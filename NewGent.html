煙門後，遂上前截停該男子…","人員隨即拘捕該名29歲姓廖本地男子"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T18:59:56+08:00","size":1,"keywords":[],"body":"九龍城警區反三合會行動組根據線報及深入調查後，昨（19日）在樂富靜安街一帶展開反毒品行動。\n行動期間，探員發現一名男子將一個黑色膠袋藏於一唐樓樓梯間的防煙門後，遂上前截停該男子，並在該膠袋內檢獲約52克懷疑氯胺酮、約28克懷疑霹靂可卡因、95粒懷疑依托咪酯煙彈及6支電子煙槍。人員隨即拘捕該名29歲姓廖本地男子。\n涉案男子被捕帶署。警方提供\n其後，人員押解該名被捕男子到其於上址租住的單位作進一步搜查，並在單位內再檢獲約430克懷疑氯胺酮、約385克懷疑冰毒、約35克懷疑霹靂可卡因、67粒懷疑依托咪酯煙彈及一批毒品包裝工具。\n行動中檢獲的毒品市值共約47.8萬元。該名被捕男子現正被扣留調查，他將被暫控兩項「販運危險藥物」罪，明日（21日）上午在西九龍裁判法院提堂。案件由九龍城警區反三合會行動組繼續跟進。\n行動中檢獲的證物。警方提供\n警方重申，販運危險藥物屬嚴重罪行，根據香港法例第134章《危險藥物條例》，任何人販運危險藥物，一經定罪，最高可被判處罰款五百萬元及終身監禁，市民切勿以身試法。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":41,"items":[{"id":"c9c2a798d6e","title":"印尼人与中国的故事：镜头、课本与父辈记忆","url":"https://www.chinanews.com.cn/hr/2026/11-20/10735602.shtml","summary":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆  　　中新社记者 李志全  　　15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门。","summary_short":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆  　　中新社记者 李志全  　　15年前…","digest":"题：印尼人与中国的故事：镜头…","points":["15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门","15年后，他再次来到厦门，举起相机，镜头里的城市已是另一番模样","11月20日，“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T23:32:07+08:00","size":1,"keywords":[],"body":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆\n\n　　中新社记者 李志全\n\n　　15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门。那时的他，对这座城市的印象是道路相对狭窄、高楼不多。15年后，他再次来到厦门，举起相机，镜头里的城市已是另一番模样。\n\n　　“高楼林立，街道宽阔，环境优美……我几乎不敢相信自己的眼睛！”邵亮明说。\n\n11月20日，“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。图为民众参观展览。　中新社记者 李志全 摄\n\n　　11月20日，心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。展览展出印尼摄影家创作的100幅摄影作品，涵盖中国历史文化、自然风光、城市发展等内容。\n\n　　“每一张照片，都是一段真实的记录。”组织采风活动的邵亮明表示，此次厦门、漳州等地之行，让印尼摄影家们亲眼见证了中国的发展变化。\n\n　　对华裔黄鸿恩(Shania)而言，“中国”二字最初来自父辈的记忆和口口相传。\n\n　　“小时候，中国对我来说，是一个既熟悉又遥远的地方。”黄鸿恩说。家里虽保留着一些中国传统，但日常交流已很少使用中文。彼时，中国文化主要与春节和红包联系在一起。\n\n　　后来，黄鸿恩开始学习中文，接触茶艺、书法和传统舞蹈。然而，中国对她而言仍像隔着一扇窗，“我想知道，长辈故事里的中国今天是什么样子，课本之外的中国人又过着怎样的生活。”\n\n　　带着好奇，黄鸿恩赴苏州大学交流学习。古镇小巷、热闹集市、街边烧烤摊，都成为她认识中国的课堂。她品尝过大闸蟹，也尝过一些连招牌都不认识的小吃。\n\n　　这段经历，拉近了她与中国的距离。过去需要在课堂上学习的词语，渐渐有了声音、味道和具体的面孔。如今在一家印尼中企工作的黄鸿恩，“每天都在和中国打交道。”\n\n　　“中文让我走近中国，文化让我理解中国。”正在清华大学攻读研究生的王雅丽(Berillya Imandi ka)，通过现场大屏幕连线，分享自己与中国结缘的经历。\n\n　　她从中学开始接触中文，进入大学后，学习汉语言与中国文化。2019年，王雅丽参加“汉语桥”比赛，获得印尼非华裔组冠军，并在比赛中表演中国传统戏曲《贵妃醉酒》。\n\n　　“那次经历让我更加坚定了继续学习中文、进一步了解中国的想法。”此后，她赴福建师范大学交流学习，在亲身体验中认识了“一个比课本描述更加丰富和多元的中国”。\n\n　　印尼总统大学国际关系学副教授赖剑文长期关注中国发展，多次赴华访问交流。他说，中国在经济建设、基础设施和科技领域的显著进步，让他每次到访都有新的感受，也让外国人对中国有了新的认识。\n\n　　中国驻印尼使馆文化参赞王思平表示，本次活动既是一场“讲中国故事”的文化分享，也是一次以影像为媒、以文化会友的交流盛会。希望通过主题讲座、青年交流等多种形式，让更多印尼朋友特别是青年一代，从身边的故事和真实视角认识中国、了解中国。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cee484b8e7b","title":"大國外交｜王毅：中俄美元首會晤為重大創舉 體現大國擔當","url":"https://news.tvb.com/tc/1207540-大國外交王毅中俄美元首會晤為重大創舉體現大國擔當","summary":"中俄美元首舉行歷史性會晤。外長王毅表示，三方會晤是載入史冊的標誌性事件，順應時代潮流，符合世界的期待。","summary_short":"中俄美元首舉行歷史性會晤。","digest":"中俄美元首舉行歷史性會晤","points":["中俄美元首舉行歷史性會晤","外長王毅表示，三方會晤是載入史冊的標誌性事件，順應時代潮流，符合世界的期待","外長王毅表示：「三國元首歷史上首次舉行，這一面對面會晤開創了三國最高領導人交往的新紀錄…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T23:20+08:00","size":1,"keywords":[],"body":"中俄美元首舉行歷史性會晤。外長王毅表示，三方會晤是載入史冊的標誌性事件，順應時代潮流，符合世界的期待。\n\n外長王毅表示：「三國元首歷史上首次舉行，這一面對面會晤開創了三國最高領導人交往的新紀錄，也為新時期的大國協調互動構建了新範式，同時也是推進新型大國關係的新實踐，可以稱為國際關係史上的一個重大的創舉。」\n\n王毅指出：「其次這是一次體現大國擔當的標誌性的會晤。當前，世界百年變局加速演進，各種風險挑戰層出不窮，國際社會對和平與穩定的期盼，日益強烈，對大國加強溝通協調的呼聲，也不斷高漲。所以這次會晤順應時代潮流，符合世界的期待。」\n\n王毅稱：「習近平主席強調，大國和則世界安，大國鬥則世界亂。三國元首面對面，介紹了各自的戰略意圖，同意要防止發生衝突對抗，要守住和平共處的底線，並且期待形成和平共處，總體穩定、均衡發展的大國關係的新格局。」","image":"https://pro-vod-cdn.tvb.com/f6a9bf6a831b44dd99e44801765c3b5d/snapshots/9c43358899be4dceb0708ca75fc7cbfc-00008.jpg","video":"https://pro-vod-cdn.tvb.com/f6a9bf6a831b44dd99e44801765c3b5d/4ce3bb9ea073426c960c946a3c9b640d-c4e6b76d424b69144e0e02a50ae0dc71-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/f6a9bf6a831b44dd99e44801765c3b5d/snapshots/9c43358899be4dceb0708ca75fc7cbfc-00008.jpg","lang":"zh-Hant"},{"id":"c19c482a196","title":"“泰国v姐”陈映玲解码《给阿嬷的情书》走红：内核在于真实与真诚","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-20/news1075620.shtml","summary":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。","summary_short":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。","digest":"11月20日，2026年侨海(客家)青年发展大会在海口市举行","points":["11月20日，2026年侨海(客家)青年发展大会在海口市举行","《给阿嬷的情书》参演者、短视频创作者“泰国v姐”陈映玲接受中新社记者采访时表示，爱国爱乡…","人与人之间情感相通，影片的出圈印证真心能够跨越地域与语言的隔阂"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T22:34:26+08:00","size":1,"keywords":[],"body":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。《给阿嬷的情书》参演者、短视频创作者“泰国v姐”陈映玲接受中新社记者采访时表示，爱国爱乡、有情有义的精神，适用于每一个时代、每一个人。她说，《给阿嬷的情书》走红的内核在于真实与真诚；人与人之间情感相通，影片的出圈印证真心能够跨越地域与语言的隔阂。(陈英清 林士杰)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/84FA9BAD929640A1A00282E0F4A80B7E.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c164477685e","title":"（深圳APEC）“未来在此被设计、测试和建造”——APEC与会领导人点赞深圳","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735538.shtml","summary":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举…","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新社深圳11月20日电 (记者 国璇)11月18日至19日…","多位APEC成员经济体领导人在不同场合点赞深圳的发展成就，并期待有更多“深圳奇迹”出现…","“在不到50年的时间里，深圳就从一个边陲小镇成长为拥有约1800万人口的超大城市"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:13:40+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。多位APEC成员经济体领导人在不同场合点赞深圳的发展成就，并期待有更多“深圳奇迹”出现，为亚太区域合作注入更多确定性。\n\n　　“在不到50年的时间里，深圳就从一个边陲小镇成长为拥有约1800万人口的超大城市。”加拿大总理卡尼认为，深圳代表了这个时代最伟大的变革之一。\n\n　　“深圳从一项政策试验变成全球经济引擎，从雄心勃勃的愿景转化为全新的生活方式，这种进步并非源于命运的眷顾或大自然的馈赠，而是来自一次次主动抉择。”在卡尼看来，深圳的成就来自开放、创新与合作。“未来在这里被设计、测试和建造。”\n\n　　韩国总统李在明表示，深圳生动展现了科技如何改变人们的生活。从在都市上空飞行的无人机、在道路上行驶的电动汽车，到应用人工智能与机器人的尖端制造现场，曾经仿佛遥不可及的未来科技，在深圳正逐渐成为日常。\n\n　　作为首位踏足深圳的在任美国总统，特朗普在同中国国家主席习近平会见时称赞深圳：“深圳真的是个非常棒的城市，只可惜有些媒体朋友没有办法看到城市全景。”\n\n11月17日，APEC会议周期间，市民游客在深圳人才公园的人才星光桥观看“春笋”、深圳湾一号等建筑亮起APEC主题标语。　中新社记者 陈楚红 摄\n\n　　“创新”是多位APEC成员经济体领导人提到的关键词。俄罗斯总统普京说，深圳是最现代化、最具活力的大都市之一，有机结合了高度城市化、舒适的城市环境和创新的生产基地。他还表示，深圳堪称中国经济发展成就的象征。\n\n　　智利总统卡斯特说，深圳已成为一座人口近2000万人的全球创新之都。“深圳的发展告诉大家，进步不是奇迹，而是一种决心，它需要劳动、努力和意志力。”\n\n　　新加坡总理黄循财在个人社交媒体上分享了一条展现深圳城市风光和科技创新成果的短视频，配文说：“自从我上次到访已经过去好几年了，这里的变化令人瞩目。深圳已成为充满活力的创新中心，尤其是在人工智能和机器人领域。”\n\n　　泰国总理阿努廷表示，深圳从小渔村发展成全球商贸大都会、先进技术与创新中心，其活力表明转型需要改革的意愿、坚持开放的信心，以及把全球联系转化为本地优势的能力。\n\n　　澳大利亚总理阿尔巴尼斯结合个人经历，以“两张照片”的对比形容深圳的巨大变化。“我在1998年第一次来到深圳。深圳这个非凡的成功故事，正是亚太地区经济显著增长的一个例证。如果你把深圳1998年和2026年的两张照片放在一起，你绝对不会认为这是同一个地方。”\n\n　　越共中央总书记、国家主席苏林说，过去几十年来，不论是深圳自身、还是整个中国所取得的跨越式发展成就，都证明了坚持改革开放和创新发展的正确性，同时表明各经济体携手合作对共促繁荣的重要意义。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccf4d10c7c7","title":"“国际基建卓越周2026”在港揭幕 香港发展局与多方推进基建合作","url":"https://www.chinanews.com.cn/dwq/2026/11-20/10735576.shtml","summary":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。","summary_short":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。","digest":"由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香…","points":["中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2…","香港特区行政长官李家超在活动上见证发展局与多个香港及海外机构交换意向书和合作备忘录…","李家超在开幕典礼上致辞时表示，要建设北部都会区并实现其发展愿景，香港必须以智慧城市理念…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:04:02+08:00","size":1,"keywords":[],"body":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。香港特区行政长官李家超在活动上见证发展局与多个香港及海外机构交换意向书和合作备忘录，以推动跨地域、跨领域的深度交流与合作，为更多香港、中国内地的建造企业及产品“出海”奠定基础。\n\n11月20日，由香港特区政府发展局牵头主办的“国际基建卓越周2026”在香港揭幕。图为香港特区行政长官李家超(中)和嘉宾主持开幕典礼。　(香港特区政府新闻处 供图)\n\n　　“国际基建卓越周2026”主要活动包括第二届国际基建项目领导峰会、“模块建造国际会议2026”和“建造创新博览会2026”，旨在构建建造业顶尖国际交流平台以促进可持续发展、提升基建效能，以及加速创新科技落地，推动行业升级转型。\n\n　　李家超在开幕典礼上致辞时表示，要建设北部都会区并实现其发展愿景，香港必须以智慧城市理念、人工智能、先进工程技术、创新建造方法及材料，打造配合未来需要的基础设施，而协作是建造业迈向卓越的关键。\n\n　　活动同场举行第二届国际基建项目领导峰会，超过800位来自全球30多个国家和地区的大型基建项目领袖和专家与会。峰会以“灼见赋能 擘画蓝图”为主题，探讨如何应对建造业的挑战及推动高质量发展。\n\n　　发展局局长甯汉豪表示，特区政府积极推动建造业升级转型，迈向高端化、智能化及高质量发展；在提速北部都会区建设时，积极推行革新，精简审批程序，并善用人工智能，推动广泛应用先进建筑物料与科技。她介绍，香港在国际建筑成本排名持续改善，建筑成本从2020年的全球第3位回落至本年度的第16位，反映成本控制取得进步。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7628b42ad7","title":"2026年空手道世界杯在杭州举行 系首次落地中国","url":"https://www.chinanews.com.cn/ty/2026/11-20/10735575.shtml","summary":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。","summary_short":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。","digest":"2026年空手道世界杯于20日在浙江杭州开幕","points":["中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕","来自全球41个国家和地区的79支顶尖队伍齐聚赛场，角逐男子团体型、女子团体型、男子团体组手…","开幕式上，世界空手道联合会主席安东尼奥·埃斯皮诺斯在致辞中表示…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:03:12+08:00","size":1,"keywords":[],"body":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。来自全球41个国家和地区的79支顶尖队伍齐聚赛场，角逐男子团体型、女子团体型、男子团体组手、女子团体组手四个项目金牌，中国队将参加全部四项比拼。这也是空手道世界杯首次在中国举办。\n\n　　开幕式上，世界空手道联合会主席安东尼奥·埃斯皮诺斯在致辞中表示，本次赛事不仅是竞技比拼的舞台，更是加深友谊、增长经验的宝贵契机，希望所有参赛者珍惜机会，在赛场上尽情展现空手道的独特魅力与卓越风采。\n\n　　空手道世界杯是世界空手道联合会最高级别团体赛事。比赛首日进行了男子团体组手、女子团体型小组赛及四分之一决赛。男子团体组手项目中，土耳其、伊朗、黑山和WKF-1队闯入四强。女子团体型项目中，中国队在四分之一决赛险胜意大利，携手埃及、伊朗、日本晋级半决赛。\n\n11月20日，2026年空手道世界杯在杭州开幕，共有41个国家和地区的79支队伍参与角逐。图为比赛现场。肖健 摄\n\n　　“这是我第二次来到杭州参赛，这里的比赛场馆很棒，赛事也组织得很好，这些都给我留下了深刻印象。今年我们期待在杭州能取得更好的成绩。”西班牙队队员玛丽亚·托雷斯说。\n\n　　“这次我参加的是女子团体组手项目，团体项目和个人项目确实有不一样的感觉，个人项目单独作战，自己拼尽全力就可以，团体项目集聚了来自不同级别的优秀选手，每个人都要上场，更讲究团队配合。”中国队队员、爱知·名古屋亚运会空手道女子组手68公斤级冠军李巧巧说，“这次在家门口比赛心情也很开心、激动，希望我们的成绩能一次比一次好”。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4faba6f64e","title":"第三届兰花奖颁奖典礼在北京举行 10位国际友人获奖","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735574.shtml","summary":"中新社北京11月20日电 第三届兰花奖颁奖典礼11月20日在北京举行。","summary_short":"中新社北京11月20日电 第三届兰花奖颁奖典礼11月20日在北京举行。","digest":"第三届兰花奖颁奖典礼11月20日在北京举行","points":["中新社北京11月20日电 第三届兰花奖颁奖典礼11月20日在北京举行","中共中央政治局委员、中央宣传部部长李书磊出席并致辞","兰花奖旨在表彰奖励为弘扬全人类共同价值、促进中外文明交流互鉴作出突出贡献的国际友人和机构"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:03:02+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 第三届兰花奖颁奖典礼11月20日在北京举行。中共中央政治局委员、中央宣传部部长李书磊出席并致辞。\n\n　　兰花奖旨在表彰奖励为弘扬全人类共同价值、促进中外文明交流互鉴作出突出贡献的国际友人和机构。来自法国的让-马里·居斯塔夫·勒克莱齐奥、新加坡的马凯硕、美国的亚当·福斯特等10位国际友人获得本届兰花奖。\n\n　　与会嘉宾认为，兰花奖源于中国、连通世界，设立以来，国际影响力持续提升，为不同文明和合共生注入了新动能，也成为各国文明同心同理、互促互进的见证。\n\n　　与会嘉宾表示，要坚持平等相待，促进多元文明包容共存；守护文化根脉，推动人类文明薪火相传；加强数智赋能，助力文明成果普惠共享，为推动人类文明进步贡献更多智慧和力量。\r\n\n　　第三届兰花奖颁奖典礼由中国外文局主办。来自中央有关部门、国际组织、驻华使节、中外智库、媒体机构代表等300余人参会。11月21日至26日，部分获奖者等还将赴山西开展“走读中国”参访活动。(完) 【编辑:李骏】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c38febb8e5e","title":"38名广州台湾青少年同场决赛 宣讲岭南文化","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735570.shtml","summary":"中新网广州11月20日电 (记者 郭军)“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”决赛20日在广州举办。","summary_short":"中新网广州11月20日电 (记者 郭军)“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”决赛20日在广州举办。","digest":"“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”决赛20日在广州举办","points":["中新网广州11月20日电 (记者 郭军)“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”…","决赛现场，38名优秀选手同台竞技，各展风采，生动讲述在广州的学习生活故事与岭南文化魅力","此次大赛由广东省海峡两岸交流促进会指导，广州市台办、市教育局、市文化广电旅游局…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T22:01:36+08:00","size":1,"keywords":[],"body":"中新网广州11月20日电 (记者 郭军)“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”决赛20日在广州举办。决赛现场，38名优秀选手同台竞技，各展风采，生动讲述在广州的学习生活故事与岭南文化魅力。\n\n　　此次大赛由广东省海峡两岸交流促进会指导，广州市台办、市教育局、市文化广电旅游局、市青联等联合主办。第三届广州台湾青少年宣讲员大赛自今年9月启动以来，得到广大在穗台湾青少年积极响应与踊跃参与，共有101名热爱岭南文化的青年学子报名参赛。\n\n　　决赛现场，经过激烈角逐，最终评选出特等奖4名、一等奖8名、二等奖12名、三等奖14名。颁奖仪式上，公布了大赛“优秀组织奖”“优秀指导老师奖”的获奖名单，出席活动的领导及嘉宾为“广州市台湾青少年金牌宣讲员”选手和“最佳组织奖”单位颁奖。\n\n　　据悉，本次大赛延续了“岭南文化我来讲”的品牌，通过优化赛事组织，为在穗台湾青少年提供了优质的风采展示平台。少年组选手走进广州14家国家、省、市对台交流平台，寻找并讲述那些关于同根同源的动人往事；而青年组选手则围绕“传承岭南优秀传统文化”“打卡广州精品主题线路”“助力公益志愿服务”“安居乐业追梦圆梦”“融入广州高质量发展”等主题，分享他们扎根大湾区的生活、学习与实践的故事，展现两岸青年携手打拼、融合发展的生动实践。(完)\r\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1a7c94fabd","title":"广东海警紧急出动 连续救助两名海岛群众","url":"https://www.chinanews.com.cn/dwq/2026/11-20/10735572.shtml","summary":"中新网广州11月20日电 (记者 方伟彬)记者20日从广东海警局获悉，当天该局直属分局连续救助两名群众，并将其安全送至珠海市区医院就医。","summary_short":"中新网广州11月20日电 (记者 方伟彬)记者20日从广东海警局获悉，当天该局直属分局连续救助两名群众…","digest":"记者20日从广东海警局获悉，当天该局直属分局连续救助两名群众…","points":["中新网广州11月20日电 (记者 方伟彬)记者20日从广东海警局获悉…","当日清晨，该局接到报警称，珠海市大万山岛有一名80岁女性，左手手腕骨折，鼻腔流血…","接警后，该局立即启动应急救援预案，派遣在该海域巡逻执勤的海警长榄艇奔赴大万山岛转运伤员"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:01:18+08:00","size":1,"keywords":[],"body":"中新网广州11月20日电 (记者 方伟彬)记者20日从广东海警局获悉，当天该局直属分局连续救助两名群众，并将其安全送至珠海市区医院就医。\n\n　　当日清晨，该局接到报警称，珠海市大万山岛有一名80岁女性，左手手腕骨折，鼻腔流血，左眼皮下血肿，人倒在楼梯口已无法自主活动，急需转运至珠海市人民医院接受专业治疗。接警后，该局立即启动应急救援预案，派遣在该海域巡逻执勤的海警长榄艇奔赴大万山岛转运伤员。\n\n众人合力转移受伤老人至海警长榄艇。广东海警局 供图\n\n　　据悉，该受伤老人疑似凌晨2点左右从2.5米高楼梯摔下，家属发现时已是凌晨3点，老人躺在楼梯口已经无法活动，身体还伴有多处损伤，家属在岛上转运至岛上医院途中还出现呕吐症状，岛上医生初步诊断老人可能有头颅骨折、脑血管损伤的情况，又因其年龄较大，身患糖尿病，必须转诊治疗，遂向海警求救。\n\n　　出动后不久，该局又接到桂山镇政府救助警情，一名2岁儿童与其家人登岛游玩，到凌晨时突发烧至39.6℃，高烧不退、精神萎靡，由于情况紧急，岛上医疗条件有限，在桂山岛医生简单治疗后，便向海警求救转运至市区就医。该局迅速调派海警东山艇赶往桂山岛转运高烧儿童。\n\n广东海警在大万山岛转运受伤老人。广东海警局 供图\n\n　　两处救援，同步开展。该局发扬连续作战的作风，密切关注海域海况，掌握救援动态，积极协调码头资源，指挥舰艇靠泊码头，协调120救护车到码头待命，经过一个多小时的破浪驰骋，两艘救援艇先后抵达港口码头，成功完成病患转运，守护了群众的生命安全。\n\n　　目前，2名群众正在珠海市区医院接受治疗，因为转运及时，病情得以迅速控制。海警提醒：近期粤港海域气温骤降，海岸风高浪急，出海或登岛活动务必注意安全。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce85c6cc98f","title":"月球时、算力网、闪身步等入选18个学科112个研究前沿热点词","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735566.shtml","summary":"中新网北京11月20日电 (记者 孙自法)全国科学技术名词审定委员会(全国科技名词委)2026年度工作会议暨学术年会11月20日至21日在北京举行，会上集中发布覆盖18个学科共112个研究前沿热点词…","summary_short":"中新网北京11月20日电 (记者 孙自法)全国科学技术名词审定委员会(全国科技名词委)2026年度工作会议暨学术年会11…","digest":"全国科学技术名词审定委员会(全国科技名词委)2026年度工作会议暨学术年会11月20…","points":["按学科分类，最新发布的2026年度学科研究前沿热点词如下：","水利科技5个，河流伦理、测雨雷达、冰碛湖监测、老旧水库韧性提升、自加速异重流","编辑与出版学5个，数字教材、出版智能体、出版业高质量数据集、出版垂类模型、城市文化会客厅"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T21:59:06+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 孙自法)全国科学技术名词审定委员会(全国科技名词委)2026年度工作会议暨学术年会11月20日至21日在北京举行，会上集中发布覆盖18个学科共112个研究前沿热点词，月球时、算力网、闪身步等入选，勾勒出年度学科研究重点与趋势。\n\n　　按学科分类，最新发布的2026年度学科研究前沿热点词如下：\n\n前沿热点词发布。中新网记者 孙自法 摄\n\n　　测绘学3个，具身导航、类脑导航、量子导航。\n\n　　水利科技5个，河流伦理、测雨雷达、冰碛湖监测、老旧水库韧性提升、自加速异重流。\n\n　　编辑与出版学5个，数字教材、出版智能体、出版业高质量数据集、出版垂类模型、城市文化会客厅。\n\n　　天文学6个，中微子天文学、时域天文学、月球时、准卫星、闰时、小红点。\n\n前沿热点词发布。中新网记者 孙自法 摄\n\n　　临床医学7个，医学知识图谱、脑机接口、近视防控关口前移、光遗传学视网膜疗法、围手术期肌肉保护、急性高原病、交替方向迭代成像网络。\n\n　　煤炭科技4个，煤炭科学开采、巨厚煤层开采、智能控制放顶煤开采、覆岩环境容量。\n\n　　美术与书法8个，文化主体性、美术自主知识体系、全球艺术史、美术教育学、数智策展、美术馆学、学科美育、科艺融合。\n\n　　公共卫生与预防医学5个，硼中子俘获治疗、无铅防护材料、智慧监测、靶向α核素治疗、氡防护。\n\n前沿热点词发布。中新网记者 孙自法 摄\n\n　　戏剧7个，戏剧振兴、未来戏剧、戏剧幻城、戏旅融合、新大众戏剧、戏剧美育、人机共演。\n\n　　博物馆学8个，中小博物馆提升、联结世界的桥梁、藏品规范管理、数字策展、出片式观展、博物馆沉浸式叙事、数字孪生博物馆、博物馆疗愈。\n\n　　护理学6个，免陪照护服务、人工智能护理、人机协同照护、阈下衰弱、失能预防关口前移、叙事护理。\n\n　　民用航空10个，《中华人民共和国民用航空法》、低空安全、低空基础设施、人工智能+民航、民航数据治理、航空器预测性维修、航空非二氧化碳排放、全球航空遇险与安全系统、无人驾驶航空器运行识别、民航报告文化。\n\n　　计算机科学技术10个，词元、深度学习编译器、三维高斯泼溅、存算一体、超节点、智能体编程、大语言模型定理证明、可信数据空间、算力网、隐私保护。\n\n　　舞蹈3个，闪身步、裁判舞、数智舞蹈。\n\n　　信息与通信科技4个，内生智能、智能体、量超融合、量子纠错。\n\n　　音乐10个，人工智能音乐模型、数智赋能音乐教育、长征音乐、民族音乐共同体、非遗音乐经济、区域国别音乐、新大众音乐、边疆民族音乐、音乐流域、音乐文化确权。\n\n　　艺术学3个，新大众文艺、数智技术、生成式人工智能艺术。\n\n　　广播电视与网络视听艺术8个，人工智能漫剧、微综艺、文化出海新三样、中剧、互动剧、短剧＋、团播、视频播客。\n\n　　发布的同时，各学科名词审定委员会专家结合最新研究动态，对入选热点词逐条阐释，集中反映相关学科一年来的重点突破方向和前沿走向。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c433209aacd","title":"北京将集中开展“宪法宣传周”系列活动","url":"https://www.chinanews.com.cn/fz/2026/11-20/10735565.shtml","summary":"中新网北京11月20日电 (记者 陈杭)2026年12月4日是第十三个国家宪法日。","summary_short":"中新网北京11月20日电 (记者 陈杭)2026年12月4日是第十三个国家宪法日。","digest":"2026年12月4日是第十三个国家宪法日","points":["中新网北京11月20日电 (记者 陈杭)2026年12月4日是第十三个国家宪法日","北京市计划于12月1日至7日在全市范围内集中开展“宪法宣传周”系列活动","2026年宪法宣传周期间，全市各区各部门各高校将组织开展各类宣传活动5000余场"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T21:58:18+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 陈杭)2026年12月4日是第十三个国家宪法日。北京市计划于12月1日至7日在全市范围内集中开展“宪法宣传周”系列活动。2026年宪法宣传周期间，全市各区各部门各高校将组织开展各类宣传活动5000余场。\n\n　　这是记者20日从2026年北京市宪法宣传周新闻发布会上获悉的。\n\n图为2026年北京市宪法宣传周新闻发布会。主办方供图\n\n　　北京市司法局副局长谢向红表示，今年北京市“宪法宣传周”将形成“市级统筹、部门协同、区级联动、基层参与”的生动局面。\n\n　　“1+6”市级层面系列宣传活动方面，“1”是指“宪法宣传周”启动仪式暨法润京华·“宪”在行动·“三微”作品集中展示活动，发布“宪法宣传周”全市宣传活动举措，总结呈现法治“三微”作品征集活动成果。“6”是指开展六场示范活动，组织送法“进机关”“进商圈”“进驿站”“进大集”“进村居”“进学校”，面向新就业形态劳动者、村居民、学生等不同群体，围绕生产生活中常用法律知识，开展宣传普及。\n\n　　今年宪法宣传周期间，北京市级各部门落实“谁执法谁普法”“谁管理谁普法”“谁服务谁普法”普法责任制，将普遍开展宪法宣传教育活动，42家代表性较强的活动纳入全市整体安排。例如北京市委网信办统筹开展2026年首都网络普法联盟“e法之光”活动；北京市农业农村局举办“宪法进农村·法治护百千”宣传活动；北京市机关事务局举办“宪法进机关”活动等。全市首批18家法治文化场所届时将同步开展主题研学、现场普法、阵地宣讲等活动。\n\n　　同时，北京16区及经开区均将举办主场活动，并指导街道、乡镇深入基层，通过组织文艺汇演、法治讲座、普法市集等多种形式，开展宣传活动。北京大学、清华大学、中国人民大学、首都师范大学等31家高等院校也将通过模拟法庭、法律知识竞赛、普法游园等形式，开展宣传活动。\n\n　　谢向红表示，下一步，北京市将持续推动宪法学习宣传走深走实，引导广大市民把宪法精神内化于心、外化于行，为建设更高水平的法治中国首善之区营造良好法治氛围。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c76834b75f9","title":"用“空间语言”绘就美丽新宁夏 《宁夏回族自治区自然资源地图集》正式出版","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735558.shtml","summary":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏回族自治区自然资源厅获悉，《宁夏回族自治区自然资源地图集》编制完成并正式出版，这本浓缩宁夏资源家底、山川风貌与发展蓝图的图集…","summary_short":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏回族自治区自然资源厅获悉…","digest":"11月20日，记者从宁夏回族自治区自然资源厅获悉…","points":["中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏回族自治区自然资源厅获悉…","据介绍，图集紧扣黄河流域生态保护和高质量发展先行区建设战略定位…","内容沿着“自然本底-资源禀赋-生态格局-产业未来”脉络展开，覆盖气候、土地、矿产…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T21:55:43+08:00","size":1,"keywords":[],"body":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏回族自治区自然资源厅获悉，《宁夏回族自治区自然资源地图集》编制完成并正式出版，这本浓缩宁夏资源家底、山川风貌与发展蓝图的图集，成为记录宁夏自然资源本底的“可阅读空间档案”。\r\n\n　　据介绍，图集紧扣黄河流域生态保护和高质量发展先行区建设战略定位，设置“塞上江南”“丰饶资源”“山水家园”“特色发展”“美好蓝图”五大篇章，共收录192幅专题地图、130余个统计图表、80余张实景照片，配套3万余字说明。内容沿着“自然本底-资源禀赋-生态格局-产业未来”脉络展开，覆盖气候、土地、矿产、水资源等基础自然资源要素，兼顾农业、工业、文旅开发布局、国土空间规划、生态修复治理等内容，清晰呈现宁夏“一河三山”生态空间格局，系统阐释黄河、贺兰山、六盘山、罗山及引黄灌区等关键地理单元功能定位。\n\n　　编制团队综合运用遥感、地理信息、数字制图、三维建模技术，将人工智能融入专题策划、数据处理、信息提取和地图设计全流程，创新采用地图泛化、地貌晕渲、三维建模、手绘表达等方式，降低读图门槛，让空间格局直观易懂。\n\n　　图集以国土调查成果、2013至2024年统计年鉴为基础，归集自然资源、水利、交通、文旅、林草等十余个行业专题资料，经多源数据交叉校核，搭建起权威统一的数据底座。目前，图集已为宁夏各级政府及发改、水利、农业农村、林草等部门提供决策支撑，同时作为科研、高校教学素材，助力市场主体掌握资源产业布局信息，承担区情科普作用，帮助公众和青少年认识宁夏自然资源本底。\n\n　　“图集记录先行区建设实践历程，彰显测绘地理信息服务自然资源管理、支撑生态文明建设、赋能区域高质量发展的时代价值。”宁夏自然资源厅相关负责人说。(完) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1effee957a","title":"莫高义、刘奇凡会见！APEC会后苏林为何直奔云南？","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735569.shtml","summary":"深圳APEC领导人非正式会议刚收官，越共中央总书记、国家主席苏林没有回河内，而是于11月19日直飞昆明。","summary_short":"深圳APEC领导人非正式会议刚收官，越共中央总书记、国家主席苏林没有回河内，而是于11月19日直飞昆明。","digest":"深圳APEC领导人非正式会议刚收官，越共中央总书记、国家主席苏林没有回河内…","points":["深圳APEC领导人非正式会议刚收官，越共中央总书记、国家主席苏林没有回河内…","作为2027年APEC接棒东道主，苏林在深圳谈的是“开放、建设性的战略对话”","这是苏林担任越共中央总书记、国家主席后首次到云南访问，也是云南省委书记莫高义，省委副书记…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T21:51:59+08:00","size":1,"keywords":[],"body":"深圳APEC领导人非正式会议刚收官，越共中央总书记、国家主席苏林没有回河内，而是于11月19日直飞昆明。\n\n　　这个行程安排意味深长。作为2027年APEC接棒东道主，苏林在深圳谈的是“开放、建设性的战略对话”；落地云南，谈的是铁路、口岸、绿电、旧居与青年。他将APEC会场凝聚的多边合作共识，落到云南与越南山水相连的边境合作实践之中。\n\n　　为什么是云南？\n\n　　这是苏林担任越共中央总书记、国家主席后首次到云南访问，也是云南省委书记莫高义，省委副书记、代省长刘奇凡履新后接待的首位外国党政最高领导人。\n\n11月19日，云南省委书记莫高义，省委副书记、代省长刘奇凡在昆明会见越共中央总书记、国家主席苏林一行。图源：云南发布\n\n　　19日，莫高义、刘奇凡在昆明会见苏林一行。莫高义说，苏林会后率团到云南参访，“充分体现对深化越南与云南合作的高度重视”。他谈到四件事：加快推进铁路、公路、水运、口岸等基础设施建设，深化绿色低碳、清洁能源、特色农产品等领域合作，以“中越旅游合作年”为契机发展跨境旅游，用好两国沿边省委书记年度会晤等机制。\n\n　　会见中，他用了两个“高度珍惜”——高度珍惜革命年代中越同志结下的深厚情谊，高度珍惜云南和越南的良好合作基础，并提出把两国战略愿景“转化为具体行动”、把友好合作“落实到具体项目”。\n\n　　苏林感谢云南省“同志加兄弟”般的热情接待，用“山连山、水连水”形容越南与云南，并说越南各省市与云南的合作越好，越中关系就会越好。\n\n　　他把下一步合作概括为四个“更加”：更加紧密的政策沟通、更加通畅的基础设施互联互通、更加便利化的贸易投资融通、更加密切的民心相通，并提到加快交通、物流、能源、电力设施联通。\n\n　　为何首站即参观胡志明旧居？\n\n　　11月19日下午，飞抵昆明的苏林即前往昆明胡志明旧居参观，向胡志明雕像献花，并捐赠胡志明铜像，了解胡志明在云南开展革命活动情况，重温越中深厚历史情谊。\n\n　　胡志明旧居位于昆明市五华区华山南路，是一栋坐南朝北的三层砖木小楼，是胡志明1940年2月至10月在昆明开展革命活动时的居所，也是他在昆明唯一保存完整的旧居。\n\n5月28日，越南青年来华“红色研学之旅”之“理想之光”研学营走进位于云南省昆明市的胡志明旧居。中新社记者 刘冉阳 摄\n\n　　胡志明在中国开展革命活动长达12年，在广州和香港分别创立越南青年革命同志会、成立越南共产党，还长期在云南、广西等地指导越南革命。\n\n　　二十世纪三四十年代，胡志明多次到昆明进行革命活动，得到云南民众支持。在滇期间，他以“南来盛咖啡馆”面包师身份为掩护，会见越南革命者并商议革命大事，号召越侨加强团结，拥护中国抗日救国。\n\n5月28日，越南青年走进位于云南省昆明市的胡志明旧居。中新社记者 刘冉阳 摄\n\n　　旧居内展出胡志明多次访问昆明的图片、中文手稿和彼时河内华侨工人的报道等，无不体现出中越两党、两国友谊合作的来时之路。\n\n　　旧居内有一件展品分量十足：2025年6月13日越方赠送的“越南-金色史册”，是苏林赠予胡志明故乡乂安省金莲村国家级特殊遗迹区的雕塑工艺品微缩版。仿书形金册共79页，刻有“没有什么比独立和自由更珍贵”，象征胡志明79载人生。一年半后，苏林亲临展柜前，并捐赠胡志明铜像。\n\n　　铁路、公路、口岸等何以反复被提及？\n\n2025年11月19日，游客在云南蒙自滇越铁路碧色寨站拍照。 中新社记者 李嘉娴 摄\n\n　　胡志明寓居昆明的岁月，滇越铁路曾因日军入侵在战火中被迫切断。这条1910年通车的铁路，从昆明直抵越南海防，全长近900公里，是中国最早的国际铁路之一，也是云南的第一条铁路。80多年后，同一方向上，老街—河内—海防标准轨铁路正在紧锣密鼓建设中。\n\n　　11月20日，苏林出席“越南—中国西南地区发展战略对接论坛”，铁路被放在议题的“重中之重”。\n\n　　此行中，铁路、公路、口岸等成为被反复提及的词汇。中越铁路及交通基础设施互联互通、跨境物流体系建设、智慧口岸建设，构成一条从“硬联通”到“运营效率”的递进链条。\n\n　　今年4月在北京发布的中越联合声明明确，加快推进两国铁路、公路、口岸基础设施互联互通，将铁路合作作为两国战略合作新亮点。其中，越南老街—河内—海防标准轨铁路规划全长390.9公里，1435毫米轨距，2025年12月开工，计划2030年建成。同登—河内、芒街—下龙—海防两条线路的规划研究也在推进。标准轨的意义在于消除中越轨距差异带来的换装环节。对云南而言，河口对接的老街—河内—海防线路一旦贯通，滇越铁路通道将从“米轨+公路”的混合模式转入标准轨直达模式。\n\n　　云南与越南的合作交流，是中越关系中最具地缘便利和机制化程度的地方实践。滇越双方依托接壤优势，建立云南省与越南老街、宣光、莱州、奠边省省委书记年度会晤机制，云南省与越南老街、河内、海防、广宁五省市经济走廊合作会议机制等。2025年8月，中越GMS跨境直达+鲜活农产品绿通“一码通”运输路线开通，持GMS证书的货车可享受“一证通多国”“一车到底”服务，从河口到越南河内实现当天发车、当天抵达。2026年11月，金水河(中国)—马鹿塘(越南)公路口岸正式升级为国际口岸，实现从双边通关向多边国际通关的跨越。该口岸年客运能力达200万人次，货运车辆通关仅需5分钟，边民自助通关不足10秒。\n\n　　“共饮一江水，早相见、晚相望，清晨共听雄鸡高唱……”云南与越南的合作始于边境线上的你来我往，正在走向产业链上的彼此嵌入、民心深处的相互理解，在“雄鸡高唱”中成为两国命运共同体建设最实在的注脚。\n\n　　作者：刘丽慧 张丹\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0919660d61","title":"体验非遗与文创 台湾民众盼赴大陆旅游更便捷","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735531.shtml","summary":"中新社台南11月20日电 (记者 路梅)“河南洛阳以什么花闻名？","summary_short":"中新社台南11月20日电 (记者 路梅)“河南洛阳以什么花闻名？","digest":"“河南洛阳以什么花闻名","points":["中新社台南11月20日电 (记者 路梅)“河南洛阳以什么花闻名","”在20日开幕的2026台南旅展上，台湾民众纷纷加入知识竞答，领略大陆旅游魅力","海峡两岸旅游交流协会高雄办事分处以“跟着文创去旅行”为主题，举办山东、河南、湖北、广东…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T21:05:09+08:00","size":1,"keywords":[],"body":"中新社台南11月20日电 (记者 路梅)“河南洛阳以什么花闻名？”“牡丹！”“孔子故乡在哪个省？”“山东！”在20日开幕的2026台南旅展上，台湾民众纷纷加入知识竞答，领略大陆旅游魅力。\n\n　　本次旅展由台南市旅行商业同业公会主办。海峡两岸旅游交流协会高雄办事分处以“跟着文创去旅行”为主题，举办山东、河南、湖北、广东、四川等五省特色非遗文创产品与旅游景点展示活动。\n\n11月20日，2026台南旅展开幕。海峡两岸旅游交流协会高雄办事分处的展位前，台湾民众参与大陆旅游知识竞答。　中新社记者 路梅 摄\n\n　　展场入口处，泰山、金丝猴、咏春拳等纱幔图格外醒目，古风打卡点“陶然亭”吸引参观者拍照留念；前来体验潍坊风筝彩绘、杨家埠财神拓印等手工制作的民众络绎不绝。\n\n　　台南市民蔡宏懋夫妇一同来逛展，近10年，他们经常到大陆旅游。“大陆城市发展进步很快，机器人送餐、无人驾驶出租车、手机支付都非常方便。”蔡宏懋说，家人都喜欢大熊猫，这个寒假要带孩子到成都旅游。他提到，过去台湾南部直飞大陆的航线很多，现在通常需要转机才能抵达目的地。\n\n11月20日，2026台南旅展开幕。海峡两岸旅游交流协会高雄办事分处以“跟着文创去旅行”为主题，举办特色非遗文创产品与旅游景点展示活动。图为台湾民众体验潍坊风筝彩绘。　中新社记者 路梅 摄\n\n　　对于两岸直航航线供不应求，台南市旅行商业同业公会副理事长王宪文指出，转机提高了时间成本，但由于两岸同文同种，沟通顺畅，台湾民众前往旅游的意愿仍高。\n\n　　他表示，大陆旅游资源丰富，旅游产品的设计灵活度高、选择丰富，无论是年轻人喜欢“网红”城市、追星，还是年长者向往壮丽山水，都能得到满足。“如果直航点足够多、取消‘禁团令’，去大陆旅游的台湾民众会更多。”\n\n　　来自高雄的大三女生尹瑄曾到上海、厦门、重庆等地旅游。她告诉中新社记者，第一次去大陆时享受到“首来族”免门票优惠，玩得开心，并发现台湾网络上许多关于大陆“不安全”“落后”的说法都是虚假的。“亲眼去看看，就会打消疑虑。”真实的大陆安全友善、城市发达，她还想继续探索不同的地方。\n\n11月20日，在2026台南旅展上，台湾旅行社把大陆旅游线路作为主力推荐产品。　中新社记者 路梅 摄\n\n　　现场有多个展位把大陆旅游线路做成醒目海报，从江南到东北，从闽粤到疆藏，选择多元，各具特色。由于台当局“禁团令”未解，旅行社多主打自由行“机+酒”安排，也表示可根据客户需求提供更多服务。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cece82f14c2","title":"任栋任扬州市副市长、代理市长","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735530.shtml","summary":"中新网扬州11月20日电 (徐珊珊 崔佳明)11月20日，扬州市第九届人大常委会第四十次会议决定：接受郑海涛辞去扬州市人民政府市长职务的请求；任命任栋为扬州市人民政府副市长、代理市长。","summary_short":"中新网扬州11月20日电 (徐珊珊 崔佳明)11月20日，扬州市第九届人大常委会第四十次会议决定：接受郑海涛辞去扬州市人…","digest":"任栋任扬州市副市长、代理市长","points":["中新网扬州11月20日电 (徐珊珊 崔佳明)11月20日…","任命任栋为扬州市人民政府副市长、代理市长","当日下午，扬州召开全市领导干部会议，宣布江苏省委有关决定：任栋同志任扬州市委委员、常委…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T21:03:53+08:00","size":1,"keywords":[],"body":"中新网扬州11月20日电 (徐珊珊 崔佳明)11月20日，扬州市第九届人大常委会第四十次会议决定：接受郑海涛辞去扬州市人民政府市长职务的请求；任命任栋为扬州市人民政府副市长、代理市长。\n\n　　当日下午，扬州召开全市领导干部会议，宣布江苏省委有关决定：任栋同志任扬州市委委员、常委、副书记。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb67c2bde57","title":"“泰国V姐”陈映玲谈侨界青年责任：不必惊天壮举，学一句乡音亦可","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-20/news1075611.shtml","summary":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。","summary_short":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。","digest":"11月20日，2026年侨海(客家)青年发展大会在海口市举行","points":["11月20日，2026年侨海(客家)青年发展大会在海口市举行","《给阿嬷的情书》参演者、短视频创作者“泰国V姐”陈映玲表示，侨批虽已成为历史…","在她看来，侨界青年的责任不必追求惊天壮举，重在接续先辈薪火，也许是学会一句祖辈的乡音…"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T20:56:48+08:00","size":1,"keywords":[],"body":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。《给阿嬷的情书》参演者、短视频创作者“泰国V姐”陈映玲表示，侨批虽已成为历史，但其中蕴含的感情从未消散。在她看来，侨界青年的责任不必追求惊天壮举，重在接续先辈薪火，也许是学会一句祖辈的乡音，也许是回到故乡走一走等。\n\n陈映玲表示，若侨批是先辈写给故乡的家书，她希望以影像为载体，写下属于当代侨界青年的回信，让华侨华人的故事与桑梓情谊代代相传。(陈英清 林士杰）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/716360C7CA67492C8136D56F9A065064.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cea282b8d7c","title":"访西安石油大学“油泥新生”团队：助力石化固废绿色资源化","url":"https://www.chinanews.com.cn/edu/2026/11-20/10735520.shtml","summary":"中新网北京11月20日电 题：访西安石油大学“油泥新生”团队：助力石化固废绿色资源化  　　作者 张素 杨博 李金灵  　　含油污泥是油气开采过程中伴生的危险固体废物，蕴藏可观的可回收油气…","summary_short":"中新网北京11月20日电 题：访西安石油大学“油泥新生”团队：助力石化固废绿色资源化  　　作者 张素 杨博 李金灵…","digest":"题：访西安石油大学“油泥新生”团队：助力石化固废绿色资源化  　　作者 张素 杨博…","points":["含油污泥是油气开采过程中伴生的危险固体废物，蕴藏可观的可回收油气，同时也存在环境隐患","资料图：图为西安石油大学“油泥新生”团队在油田现场调研并与工人交流","……“油泥新生”团队创始人胡海杰经常被问到这些问题"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:40:45+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 题：访西安石油大学“油泥新生”团队：助力石化固废绿色资源化\n\n　　作者 张素 杨博 李金灵\n\n　　含油污泥是油气开采过程中伴生的危险固体废物，蕴藏可观的可回收油气，同时也存在环境隐患。\n\n　　在西安石油大学有一支“油泥新生”团队。依托该校石油学科优势与重点实验室平台，这些科研工作者持续开展技术攻关，研发形成含油污泥低温催化热解完整技术体系，助力石化固废绿色资源化。\n\n资料图：图为西安石油大学“油泥新生”团队在油田现场调研并与工人交流。受访者供图\n\n　　传统热解技术存在局限性\n\n　　油能不能高效回收？残渣是否安全？……“油泥新生”团队创始人胡海杰经常被问到这些问题。\n\n　　胡海杰从硕士阶段便投身油气田环境保护相关研究。走访调研油田生产一线，他看到环保政策升级背景下，油田企业对于油泥高效回收、残渣安全处置的迫切现实需求，由此锚定工程实际难题开展科研攻坚。\n\n　　“经过大量实地调研和工程实践证明，热解是实现油泥深度资源化、无害化处置的重要技术。”他说。\n\n　　然而，传统热解技术普遍存在重质烃难以裂解、残渣污染管控难、处理效率偏低等问题，处理温度往往需要500摄氏度以上，原油回收效果有限。\n\n　　破解技术难题，迫在眉睫。\n\n　　受催化炼化技术思路启发\n\n　　“受催化炼化技术的启发，我们研发了以硅铝为基体的负载型催化剂。”胡海杰说。\n\n　　他介绍说，团队自主研发系列催化剂及配套工艺，成功构建含油污泥低温催化热解技术体系。在高效回收原油的同时，可同步实现热解过程中重金属稳定化处置，兼顾资源回收与污染防控。\n\n　　数据显示，相较于常规热解技术，新技术将热解温度降至420摄氏度以下，处理时长由4小时压缩至2.5小时，并实现油回收率由75%以下提升至86%以上，残渣含油率降至千分之二以下，轻质油比例提高近19倍。\n\n　　解决了“油怎么收”的问题，还要解决“残渣安全”的问题。\n\n　　团队进一步研发出双功能催化剂，在保障油回收率的同时，其中的活化组分与可溶性重金属作用，将其稳定固定在残渣中，降低其迁移和浸出风险。\n\n　　此外，不同产地油泥性质波动大，给现场稳定处理带来阻碍。团队开发出热解装备智控系统，能够快速识别油泥物料特征，自动匹配催化剂与工艺参数，显著提升处置效率。该成果获2025年度中国化工学会科技进步奖一等奖。\n\n资料图：图为西安石油大学“油泥新生”团队在实验室开展催化热解技术研究。受访者供图\n\n　　科研不只停留于实验室\n\n　　“技术创新要靠成果说话。”胡海杰表示，奖项并非终点，市场认可才是最终目标。\n\n　　据介绍，团队完成小试后，搭建催化剂中试生产线，联合企业开展工程示范。设备连续30天平稳运转，处理油泥400余吨，回收原油近45吨，处理残渣全部达标。\n\n　　通过中国化工学会组织的院士专家组鉴定，成果整体达到国际领先水平。目前这项技术已在长庆、玉门、塔里木、延长等多个油田落地应用，取得显著的经济效益与环境效益。\n\n　　“作为罗平亚院士开创团队的第三代传承人，我将继续带领团队直面科研难题，坚持产学研融合，实现从知识学习者到创新实践者的蜕变。”胡海杰说。\n\n　　他还表示，按照规划，项目未来三年预计带动200余人就业，让更多科研成果真正进入市场，以技术创新赋能油气行业绿色转型，“让油泥新生，让资源再生”。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfd512c22ae","title":"（深圳APEC）APEC十二年的变与不变","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735518.shtml","summary":"中新社深圳11月20日电 题：APEC十二年的变与不变  　　中新社记者 蔡敏婕  　　从2014年北京到2026年深圳，中国时隔12年再次成功主办亚太经合组织(APEC)领导人非正式会议。","summary_short":"中新社深圳11月20日电 题：APEC十二年的变与不变  　　中新社记者 蔡敏婕  　　从2014年北京到2026年深圳…","digest":"题：APEC十二年的变与不变  　　中新社记者 蔡敏婕  　　从2014年北京到20…","points":["从2014年北京到2026年深圳，中国时隔12年再次成功主办亚太经合组织(APEC)领导人非…","12年间，地缘扰动、逆全球化思潮不断，亚太产业版图更新，但区域合作的底层逻辑清晰可辨…","2014年“北京之约”，亚太自贸区进程启动，各方批准《亚太经合组织互联互通蓝图(2015—2…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:37:01+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 题：APEC十二年的变与不变\n\n　　中新社记者 蔡敏婕\n\n　　从2014年北京到2026年深圳，中国时隔12年再次成功主办亚太经合组织(APEC)领导人非正式会议。12年间，地缘扰动、逆全球化思潮不断，亚太产业版图更新，但区域合作的底层逻辑清晰可辨：变的是时代环境，不变的是开放合作的方向。\n\n深圳深南大道绿化景观带上布设的APEC主题花坛。 中新社记者 陈骥旻 摄\n\n　　通道升级，赛道更迭\n\n　　2014年“北京之约”，亚太自贸区进程启动，各方批准《亚太经合组织互联互通蓝图(2015—2025)》，将基础设施、规章制度、人员交流纳入整体框架。\n\n　　12年间，亚太联通通道迭代出新模样。东南亚首条高速铁路飞驰，雅万高铁将雅加达与万隆之间的通行时间缩短至最快46分钟；秘鲁钱凯港持续拓展航线，助力拉美对接亚洲市场。\n\n　　深圳APEC会议发布的《亚太经合组织互联互通蓝图》，以《2040年亚太经合组织布特拉加亚愿景》为指引，接续“硬联通、软联通、心联通”，探索自动驾驶、无人技术等新兴出行方案，为低轨卫星等下一代联通技术营造环境。\n\n　　亚太互联互通由此从“通得了”，迈向“通得智、通得密”。\n\n　　合作赛道同样更迭。北京APEC会议核心议题聚焦区域经济一体化、创新发展等；12年后的深圳会议，在“开放、创新、合作”三大优先领域之中，人工智能成为热词，各方热议数字经济、绿色转型等新赛道快速崛起，亚太供应链转向创新协同、产业链多元布局。\n\n　　“这12年里，无人车从实验室走进城市道路，亚太市场亦正从传统的商品贸易，走向更深层次的技术创新与产业协同。”九识智能创始人、CEO孔旗期待深圳APEC会议成果落实落细，推动更多政策交流、标准协调，降低企业跨区域创新落地成本。\n\n航拍盐田国际集装箱码头。（盐田国际集装箱码头 供图）\n\n　　开放底色，共赢初心\n\n　　变局之中，APEC核心底色始终未改，亚太繁荣根植于市场开放与要素自由流动，互利共赢的价值追求始终不变。\n\n　　这些年来，无论广交会还是进博会上，来自亚太经济体的客商络绎不绝，商贸热情并未因外部风浪消减。APEC持续推动中小微企业、青年、妇女等参与经济活动，倡导绿色转型兼顾各经济体发展阶段，坚守“不让任何一方掉队”的共识。\n\n　　“各经济体代表和企业家依托APEC平台相聚交流，本身就有重要意义。”中国美国商会会长何迈可说。美中贸易全国委员会会长谭森表示，数字支付、无纸化贸易，是亚太各方可携手推进的合作方向。\n\n　　TCL创始人、董事长李东生观察到，全球供应链已从效率成本优先，转向更加重视安全、韧性与区域均衡，“亚太合作最终要落到共同发展上，只有市场更开放、规则更透明、产业合作更深入，各成员经济体才能真正联通”。\n\n11月16日，外国游客在深圳人才公园与制作咖啡的机器人爱宝对话。中新社记者 王紫儒 摄\n\n　　从深圳再出发\n\n　　站在深圳这座改革开放窗口回望，12年之变，是技术迭代、产业跃迁带来的时代必然；不变的，是亚太跨越差异、同舟共济的共同选择。\n\n　　深圳大学APEC研究院院长龚晓峰指出，从2001年上海、2014年北京到2026年深圳，中国三次主办APEC会议，所处的国际环境、自身发展阶段、创新合作水平虽然不同，但始终持续扩大开放，中国参与亚太合作能力不断增强。\n\n　　此次盛会留下的是可执行的“施工图”：发布《亚太经合组织领导人深圳展望》及贸易数字化、互联互通、新兴技术多份成果文件，会议搭建起亚太共同体的“四梁八柱”，中方宣布设立亚太共同体研究中心，倡议组建世界湾区经济合作联盟。\n\n　　后续，这些成果的落地将推动亚太企业通关更便捷、跨境支付更顺畅、中小企业更能搭上数字与人工智能快车，区域产供链也将更稳定、更有韧性。\n\n　　深圳湾畔的这次相聚，为亚太合作标注了新起点：以开放对冲封闭，以创新穿越周期，以合作凝聚合力，扬亚太共同繁荣之帆。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7bf407c546","title":"浙江自然博物院“冰与蓝——极地生命探秘”特展开幕","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735504.shtml","summary":"中新网杭州11月20日电(林波)11月20日，“冰与蓝——极地生命探秘”特展正式在浙江自然博物院杭州馆开幕。","summary_short":"中新网杭州11月20日电(林波)11月20日，“冰与蓝——极地生命探秘”特展正式在浙江自然博物院杭州馆开幕。","digest":"11月20日，“冰与蓝——极地生命探秘”特展正式在浙江自然博物院杭州馆开幕","points":["中新网杭州11月20日电(林波)11月20日，“冰与蓝——极地生命探秘”特展正式在浙江自然博…","该展览将遥远的冰雪秘境浓缩于展厅之中，带领观众解锁极地生命密码，感受极地生态的壮美与脆弱","该展览由浙江省文物局指导，浙江自然博物院联合中国极地研究中心、自然资源部第二海洋研究所…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T20:22:20+08:00","size":1,"keywords":[],"body":"中新网杭州11月20日电(林波)11月20日，“冰与蓝——极地生命探秘”特展正式在浙江自然博物院杭州馆开幕。该展览将遥远的冰雪秘境浓缩于展厅之中，带领观众解锁极地生命密码，感受极地生态的壮美与脆弱。\n\n　　该展览由浙江省文物局指导，浙江自然博物院联合中国极地研究中心、自然资源部第二海洋研究所、上海交通大学海洋学院、同济大学海洋与地球科学学院共同打造。\n\n11月20日，游客观展现场。(浙江自然博物院供图)\n\n　　南北两极是地球最辽远纯净的冰雪秘境，也是维系地球生态的“核心冷擎”。这里封存着亿万年气候密码，储存着全球超七成淡水；万千生灵依冰雪脉络栖息繁衍，演化出非凡的生存智慧。\n\n　　与此同时，全球变暖持续加剧，冰川消融、栖息地萎缩，极地的细微变化，都将牵动全球生态连锁反应。\n\n　　本次展览以“冰与蓝”为引，层层递进铺展极地生命与生态全景画卷，引导公众读懂极地、守护极地。\n\n11月20日，游客在展览现场拍照留念。(浙江自然博物院供图)\n\n　　展览共设置极境、生命、共生、问极四大单元。\n\n　　第一单元“极境：地球极端的生命舞台”，聚焦南北两极独特的地理地质背景，讲解两极边界、冰体特征、极昼极夜、极光等天象，解读冰雪之下的生态系统，厘清南北极生态差异及其全球枢纽价值。\n\n　　第二单元“生命：寒极生物的生存策略”，展现极地生灵在严寒、长夜、食物匮乏等极限环境下，演化出的多样抗冻生理特征与巧妙行为适应方式。\n\n　　第三单元“共生：极地冰融与全球生态”，阐释极地作为气候变化“放大器”的特殊意义，拆解极地与全球生态密不可分的联动关系。\n\n　　第四单元“问极：极地求索与中国力量”，回溯人类极地探索历程，讲述一代代中国科考人迎风破冰、深耕极地科研，为极地保护与全球气候治理贡献中国智慧的故事。\n\n　　本次展览共展出展品150余件(组)，其中包括北极熊、北极狐、麝牛、雪羊、阿德利企鹅、帝企鹅、南极冰鱼、南极磷虾等珍贵标本，威德尔海豹、虎鲸等仿真模型，以及南极考察队工作笔记等珍贵科考档案。\n\n　　除了展品外，展览将配套举办科普讲座、研学课程、互动体验等系列活动。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c43b0294a82","title":"全国科技名词委发布科技名词近6万条 “时空智能学”“稳态医学”亮相","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735487.shtml","summary":"中新网北京11月20日电 (记者 孙自法)全国科学技术名词审定委员会(全国科技名词委)2026年度工作会议暨学术年会11月20日至21日在北京举行。","summary_short":"中新网北京11月20日电 (记者 孙自法)全国科学技术名词审定委员会(全国科技名词委)2026年度工作会议暨学术年会11…","digest":"全国科学技术名词审定委员会(全国科技名词委)2026年度工作会议暨学术年会11月20…","points":["中新网北京11月20日电 (记者 孙自法)全国科学技术名词审定委员会(全国科技名词委)202…","会上集中发布28部学科名词审定公布成果，累计收录规范科技名词近6万条","作为“基于重大科技创新的新概念新术语规范化体系化”工作年度成果…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T20:20:00+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 孙自法)全国科学技术名词审定委员会(全国科技名词委)2026年度工作会议暨学术年会11月20日至21日在北京举行。会上集中发布28部学科名词审定公布成果，累计收录规范科技名词近6万条。\n\n　　同时，作为“基于重大科技创新的新概念新术语规范化体系化”工作年度成果，“时空智能学”“稳态医学”首次亮相发布。\n\n“时空智能学”新概念亮相发布。全国科技名词委 供图\n\n　　全国科技名词委发布的2026年度审定公布成果，涵盖临床医学名词4部(包括神经外科学、普通外科学、高原医学、医学信息学)，公共卫生与预防医学名词22部(包括营养学、毒理学、消毒学等)，以及中医药学名词(第二版)、自动化科学技术名词(第二版)，全年审定公布规范名词28部，累计收录规范科技名词59575条。\n\n　　在推进新概念新术语体系化工作方面，集中呈现两项由院士团队领衔的新概念成果。其中，“时空智能学”由中国科学院和中国工程院院士、武汉大学教授李德仁团队发布，“稳态医学”由中国科学院院士、南方科技大学医学院院长王松灵团队发布。\n\n　　这两项新概念成果均产生于中国科学家在前沿领域的原创性实践，标志着科技名词工作从“对已有术语的审定公布”向“对原创概念的主动捕捉与体系化规范”延伸。\n\n“稳态医学”新概念亮相发布。全国科技名词委 供图\n\n　　在随后举办的第六讲和第七讲“笃正讲堂”上，李德仁院士、王松灵院士分别以“时空智能让AI走向物理世界”“稳态医学——健康维持和疾病防控新范式”为题作报告。\n\n　　李德仁院士的报告阐述时空智能是人工智能从“虚拟”走向“现实”的必经之路，并对建设通信、导航、遥感一体化的“东方慧眼”卫星物联网系统进行展望。\n\n　　王松灵院士的报告揭示了硝酸盐参与信号传导并维持多层面稳态的作用，据此提出稳态医学学术体系，并探索结合数智技术的数智稳态医学模式。\n\n全国科技名词委工作报告。全国科技名词委 供图\n\n　　本次会议主题为“构建汉语科技语言体系，服务高水平科技自立自强”。全国科技名词委专职副主任裴亚军作工作报告指出，过去一年，全国科技名词委在专委会扩容、审定公布体系完善、新概念新术语规范化、研究基地布局拓展、术语资源平台建设等方面取得实质性进展，科技名词工作的系统性、协同性和影响力进一步提升。2027年，将促进科技名词审定公布、推广应用、术语研究、国际合作、台港澳交流各项工作再上新台阶。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c162477d9c8","title":"中华人民共和国和澳大利亚联邦关于气候变化与清洁能源转型的联合声明","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735482.shtml","summary":"新华社北京11月20日电  中华人民共和国和澳大利亚联邦关于气候变化与清洁能源转型的联合声明  　　中华人民共和国和澳大利亚联邦(以下简称“双方”)重申共同致力于推动全球气候行动…","summary_short":"新华社北京11月20日电  中华人民共和国和澳大利亚联邦关于气候变化与清洁能源转型的联合声明  　　中华人民共和国和澳大…","digest":"中华人民共和国和澳大利亚联邦关于气候变化与清洁能源转型的联合声明  　　中华人民共和…","points":["新华社北京11月20日电","中华人民共和国和澳大利亚联邦(以下简称“双方”)重申共同致力于推动全球气候行动…","双方欢迎开展国际合作，助力全球加快清洁能源的开发与部署…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T19:59:03+08:00","size":1,"keywords":[],"body":"新华社北京11月20日电\n\n中华人民共和国和澳大利亚联邦关于气候变化与清洁能源转型的联合声明\n\n　　中华人民共和国和澳大利亚联邦(以下简称“双方”)重申共同致力于推动全球气候行动，释放全球清洁能源转型蕴含的经济机遇。\n\n　　气候目标与清洁能源转型\n\n　　双方重申《联合国气候变化框架公约》和《巴黎协定》作为国际社会合作应对气候变化的基本法律遵循和主渠道地位，重申在《联合国气候变化框架公约》和《巴黎协定》原则，包括公平、共同但有区别的责任和各自能力原则的指导下，考虑不同国情，加强全球气候治理的共同承诺。\n\n　　双方重申致力于应对气候变化，支持全面、善意、有效地落实《联合国气候变化框架公约》和《巴黎协定》。双方重申将立足本国国情，采取务实行动，兑现各自气候承诺。\n\n　　双方重申《巴黎协定》温控目标，即把全球平均气温升幅控制在工业化前水平以上低于2℃之内，并努力将气温升幅限制在工业化前水平以上1.5℃之内。双方重申致力于加强全球集体气候行动以保持1.5℃目标可实现，最大限度降低气温过冲幅度、缩短回调持续时间。双方指出，应对气温超调还需加大适应行动力度并提供相应支持，推动从地方到全球各层级迅速开展大规模行动。\n\n　　双方重申各自立足本国国情提出的国家自主贡献目标以及碳中和/净零排放承诺。双方认识到，各国转型路径、国情与优先事项各不相同，认为在转型进程中构建安全、可负担、可靠且具备韧性的能源体系十分重要。\n\n　　双方欢迎开展国际合作，助力全球加快清洁能源的开发与部署，争取到2030年实现全球可再生能源装机容量增至三倍、全球年平均能效提升速度翻一番。双方认识到加快电气化与清洁能源转型的重要意义，欢迎国际社会不断提升电气化领域的雄心并深化相关合作，争取到2035年前在自愿的基础上将电力占全球终端能源消费比重提高至35%。双方同时认识到上述转型能够带来经济、就业、能源安全、公共卫生以及民生福祉等多重收益。双方认为，气候行动应当具备包容性，确保不让任何人掉队。\n\n　　双边政策、技术与经济交流\n\n　　双方对2026年8月27日在澳大利亚举办的第十次中澳气候变化部长级对话表示欢迎。双方承诺继续落实《中澳气候变化合作谅解备忘录》，围绕气候透明度、适应行动以及其他共同关注的重点议题持续开展富有成效的交流。双方欢迎2026年11月2日在堪培拉举行的首届中澳钢铁减碳政策对话。\n\n　　双方认识到，应当开展合作，促进有利的和开放的国际经济体系，这种体系将促成各国特别是发展中国家的可持续经济增长与发展，从而使他们有能力更好地应对气候变化问题。根据《联合国气候变化框架公约》第三条第五款，双方重申，为应对气候变化而采取的措施，不应当成为国际贸易上的任意或无理的歧视手段或者隐蔽的限制。双方鼓励两国政府、科研机构、产业界等在共同关心的清洁能源转型领域开展适度的技术、科研与知识交流。上述领域所有活动均遵循自愿、双方商定原则，符合各自法律法规、国内政策安排及国家利益。\n\n　　双方重申，将通过加快清洁能源转型，共同加强能源安全领域合作。\n\n　　多边与区域合作\n\n　　双方将继续依托《联合国气候变化框架公约》以及相关区域论坛开展建设性互动，助力全球气候治理。\n\n　　双方认可澳大利亚作为《联合国气候变化框架公约》第三十一次缔约方大会谈判主席国发挥引领作用，推动各方达成富有雄心、公平、平衡、包容的成果，同时肯定中方为取得相关成果作出的贡献。双方重申支持《联合国气候变化框架公约》第三十一次缔约方大会取得圆满成功，并指出多边合作对于推动富有雄心且务实的气候行动具备持续价值与实际效用。\n\n　　澳大利亚祝贺中国成功主办2026年亚太经合组织会议，认可亚太经合组织在促进可持续经济增长、保障能源安全以及推动清洁能源转型方面发挥的作用。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c416aee1509","title":"2026地球“体检”报告发布 郭华东院士解读十大亮点成果","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735440.shtml","summary":"中新网北京11月20日电 (记者 孙自法)被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月20日在北京发布…","summary_short":"中新网北京11月20日电 (记者 孙自法)被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)…","digest":"被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)——全…","points":["中新网北京11月20日电 (记者 孙自法)被形象称为地球年度“体检”报告的《地球大数据支撑可…","中国科学院院士、可持续发展大数据国际研究中心主任郭华东在发布会上解读指出…","——中国62.8%的指标接近或实现联合国2030年可持续发展议程目标"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T19:39:48+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 孙自法)被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月20日在北京发布，当天同步在联合国官网发布，并面向联合国会员国发放，备受关注。\n\n郭华东院士解读报告。中新网记者 孙自法 摄\n\n　　中国科学院院士、可持续发展大数据国际研究中心主任郭华东在发布会上解读指出，该报告具有十大亮点成果。\n\n　　——中国62.8%的指标接近或实现联合国2030年可持续发展议程目标。截至2025年，通过地球大数据评估了中国234个可持续发展目标(SDGs)指标状态和趋势，占所有SDGs指标(截至2025年初共251个指标)的93.2%，评估指标数量比联合国官方监测指标数多一倍；中国已有147个指标(62.8%)接近或实现2030年目标，较2015年的38.9%提升23.9个百分点。预计到2030年，中国约75%的指标可实现其对应目标。\n\n　　——全球发展倡议实施五年切实加速落实SDGs。报告系统梳理了全球发展倡议在减贫、粮食安全、抗疫和疫苗等八大领域对SDGs的全面推动作用：已在130多个国家实施2000多个合作项目，培训各类人才超过20万名。例如，可持续发展科学卫星1号(SDGSAT-1)获取超54万景数据，提供122个国家使用。\n\n　　——全球油菜生产高度集聚，中国南方冬闲田蕴含扩种潜力。评估显示，全球84.9%的油菜种植面积集中于北半球中高纬度地区；中国油菜适宜种植区主要分布在长江中下游平原和东北平原，南方冬闲田仍具有扩种空间。高分辨率空间监测能进一步识别油菜适宜扩种区域及潜在扩种规模，为优化油料产能布局、提高耕地复种利用水平提供科学依据。\n\n　　——中国进入用水效率提升与水资源压力缓解协同共进的发展阶段。报告系统分析中国用水效率与用水紧张程度的长期变化及其协同关系显示，2000—2024年，全国用水效率增长约7.3倍；用水紧张程度在2011年达到峰值后总体持续下降，由2015年的38.2%降至2024年的31%，同期极度缺水人口减少1.7亿人。中国在用水效率持续提高的同时，用水紧张程度和缺水人口在2011年前后由增加趋势转为降低趋势，标志着中国水资源治理进入用水效率提升与水资源压力缓解协同推进的新阶段。\n\n　　——全球光伏分布高度集中，中国占比约41%，为核心增长引擎。报告生产出10米分辨率全球集中式光伏面板空间分布数据集显示，2025年，全球集中式光伏面板总面积约17523.5平方千米，但分布极不均衡，85.5%集中在中国、美国、印度、巴西、澳大利亚、欧洲地区及日本，其中，中国占比约41%，位居全球第一。报告评估显示：通过规模化开发与空间优化布局，中国已成为全球光伏发展的主要引擎，为全球能源转型与碳减排作出重要贡献。\n\n　　——中国棚户区改造直接改善城市中近1亿人居住环境。评估显示，2014—2024年，中国城市城中村(含棚户区)占城市建成区面积比例由10.4%下降至8.1%；21世纪以来，中国棚户区改造直接改善城市中近1亿人居住环境，城市基础设施完善促进公共开放空间和公共交通便利可达人口分别增长3.6亿和3.7亿。这表明，以城市更新统筹居住改善与公共服务补短板，能够在快速城镇化中同步实现从“住有所居”迈向“住有宜居”。\n\n　　——全球受洪涝灾害影响人口呈显著增加趋势。研究发现，2015—2025年，全球洪涝淹没面积呈不显著增加趋势，但全球受洪涝灾害影响人口呈显著增加趋势；全球受洪涝灾害影响人口年均增长率为5.35%，增加趋势显著；在快速城镇化背景下，人口与财产向沿海低地、河漫滩等高风险洪泛区集聚的速率超过人口自然增长率，导致受影响人口暴露度放大；亚洲是受洪涝影响人口最多的地区，全球占比95.29%。\n\n　　——现阶段全球珊瑚礁灰沙岛整体呈收缩趋势且长期维持能力减弱。报告对全球珊瑚礁灰沙岛状况进行动态监测和评估显示，全球珊瑚礁灰沙岛整体呈现缓慢收缩趋势，但不同区域呈现明显分化特征，长期稳定性有所下降。\n\n　　——仅占全球陆域4.1%的生物圈保护区，覆盖近半数植物和超半数脊椎动物，支撑全球生物多样性保护。\n\n　　——SDGs综合分析表明，在治理决策中需考虑多目标多尺度的协同效应。研究表明，通过尺度细化和多要素交叉分析，可由“看指标”进一步走向“识别关联、诊断瓶颈、分区施策”，为SDGs多目标协同治理提供更精准的科学依据。\n\n报告北京发布现场合影。中新网记者 孙自法 摄\n\n　　据悉，2026地球“体检”报告由依托中国科学院建设、全球首个专门以大数据技术服务联合国2030年可持续发展议程和全球发展倡议的国际科研机构——可持续发展大数据国际研究中心牵头，联合近40家科研机构的170位专家共同撰写。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9acce32786","title":"世界客属第34届恳亲大会海口开幕 约2500人共叙乡情谋合作","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-20/news1075598.shtml","summary":"11月20日，世界客属第34届恳亲大会(简称“世客会”)在海口市开幕，约2500名全球客属乡亲代表汇聚椰城，共叙乡情、共谋合作、共促发展。","summary_short":"11月20日，世界客属第34届恳亲大会(简称“世客会”)在海口市开幕，约2500名全球客属乡亲代表汇聚椰城，共叙乡情…","digest":"11月20日，世界客属第34届恳亲大会(简称“世客会”)在海口市开幕…","points":["11月20日，世界客属第34届恳亲大会(简称“世客会”)在海口市开幕…","世客会是全球最具影响力的华人盛会之一，是海内外客属乡亲恳亲联谊、经贸合作、文化交流的重要舞台","马来西亚河源同乡会总会长谭育良参加了20多届世客会"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T19:27:41+08:00","size":1,"keywords":[],"body":"11月20日，世界客属第34届恳亲大会(简称“世客会”)在海口市开幕，约2500名全球客属乡亲代表汇聚椰城，共叙乡情、共谋合作、共促发展。\n\n世客会是全球最具影响力的华人盛会之一，是海内外客属乡亲恳亲联谊、经贸合作、文化交流的重要舞台。\n\n马来西亚河源同乡会总会长谭育良参加了20多届世客会。他认为，世客会让全球客家人聚在一起，认识新老朋友，加深彼此情谊。\n\n“亲切”是印尼泗水惠潮嘉会馆顾问李丽云，在世客会上见到全球各地客属乡亲后最直观的感受。她还感慨海南的发展日新月异，早已不是印象里落后的模样，“什么都很先进”。\n\n澳大利亚维省客属崇正会会长陈裕华说，商人投资看重回报与收益，海南自贸港税收政策、营商环境契合投资者需求，对全球客家人、海外华侨吸引力显著。目前，澳大利亚维省客属崇正会已有会员主动链接海口，将公司落户于此。(陈英清 林士杰）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/FBB78FA8C05149D9B8D4A15F44E6B76C.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2ea24f5eab","title":"（深圳APEC）深圳的一天，亚太的明天","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735417.shtml","summary":"中新社深圳11月19日电 题：深圳的一天，亚太的明天  　　中新社记者 王宗汉  　　11月19日，深圳迎来意义非凡的一天——亚太经合组织(APEC)第三十三次领导人非正式会议…","summary_short":"中新社深圳11月19日电 题：深圳的一天，亚太的明天  　　中新社记者 王宗汉  　　11月19日…","digest":"题：深圳的一天，亚太的明天  　　中新社记者 王宗汉  　　11月19日…","points":["中新社深圳11月19日电 题：深圳的一天，亚太的明天","11月19日，深圳迎来意义非凡的一天——亚太经合组织(APEC)第三十三次领导人非正式会议…","中国国家主席习近平指出，开放合作是亚太发展振兴的必由之路，强调“构建开放而不排他…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T19:25:37+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：深圳的一天，亚太的明天\n\n　　中新社记者 王宗汉\n\n　　11月19日，深圳迎来意义非凡的一天——亚太经合组织(APEC)第三十三次领导人非正式会议，以及“史无前例”的中俄美元首会晤举行。\n\n　　从区域经济合作到大国关系，这一天的议程回应着关乎亚太乃至世界未来的两个问题：发展的动力从哪里来，和平如何守护？\n\n　　东道主中国，用深圳的一天作答。\n\n　　亚太合作的明天，需要开放融通。过去几十年，不同发展阶段、不同制度的经济体，通过贸易投资往来、产业分工协作，共同创造了“亚太奇迹”。如今，保护主义抬头、贸易壁垒增多，亚太能否保持活力很大程度上取决于各方能否继续向彼此敞开大门。\n\n　　中国国家主席习近平指出，开放合作是亚太发展振兴的必由之路，强调“构建开放而不排他、融合而不分割的合作格局”。\n\n　　深圳的一天，既有共同愿景，也有具体行动。中方聚焦建设亚太共同体，提出经贸、联通、创新、发展领域“四梁八柱”，宣布在深圳设立亚太共同体研究中心。这些倡议和举措为深化区域合作提供了路径，也为后续行动提供支持。\n\n　　开放合作需要落实到经济体之间更紧密的连接，落实到企业能够参与、民众能够受益的项目。经贸往来如何更顺畅、创新成果如何惠及更多人、不同经济体如何共享发展机遇，都是亚太合作需要持续作答的现实课题。APEC“中国年”全年300多场会议和活动，也为各方围绕这些问题沟通协调、积累共识创造了条件。\n\n　　亚太合作的明天，同样需要和平稳定。这里汇聚世界主要经济体，大国之间的相处，影响着区域发展的预期。保持沟通、增进共识、管控分歧、避免冲突，才能为共同发展创造有利条件。\n\n　　当天举行的中俄美元首会晤，重点讨论“维护世界和平，促进大国关系战略稳定”。习近平指出，大国良性互动不是选择题，而是必答题。\n\n　　会晤中，中方提出相互尊重、和平共处、合作共赢、对话协商四点看法，强调“修昔底德陷阱”绝不是宿命。这传递出清晰的信息：大国竞争不必走向对抗，制度差异不应成为冲突的理由。\n\n　　一次会晤难以解决所有问题，但面对面交流，可以帮助各方增进理解，为后续沟通创造条件。对于联系紧密的亚太而言，大国保持对话本身就是对区域稳定的重要支持。三方加强沟通、凝聚共识，为大国正确相处之道找到具体落点。\n\n　　中方为亚太合作付出的不懈努力，在深圳的一天收获广泛认同。俄罗斯总统普京感谢中方安排历史上首次俄中美元首会晤；美国总统特朗普称赞此次APEC会议办得非常成功；澳大利亚总理阿尔巴尼斯感谢中方在会议中展现的领导力。不同表态背后，是各方对保持沟通、推进合作的重视。\n\n　　深圳的一天，将发展的期待与和平的愿景紧紧相连。亚太合作的明天，需要开放带来的机遇，也需要对话积累的信任。唯有携手同行，才能在变局中守护和平、开创繁荣。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c54302c528c","title":"张国清出席国际丝绸组织成立大会并致辞","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735449.shtml","summary":"中新社杭州11月20日电 国际丝绸组织成立大会20日在浙江杭州举行。","summary_short":"中新社杭州11月20日电 国际丝绸组织成立大会20日在浙江杭州举行。","digest":"国际丝绸组织成立大会20日在浙江杭州举行","points":["中新社杭州11月20日电 国际丝绸组织成立大会20日在浙江杭州举行","中共中央政治局委员、国务院副总理张国清出席成立大会并致辞","张国清表示，习近平主席深刻指出，古代丝绸之路是一条贸易之路，更是一条友谊之路"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T19:24:45+08:00","size":1,"keywords":[],"body":"中新社杭州11月20日电 国际丝绸组织成立大会20日在浙江杭州举行。中共中央政治局委员、国务院副总理张国清出席成立大会并致辞。\n\n　　张国清表示，习近平主席深刻指出，古代丝绸之路是一条贸易之路，更是一条友谊之路。丝绸承载着数千年的技艺传承，是镌刻在人类文明长河中的华美印记，是共建“一带一路”、推动经贸往来与文化交流的重要载体。近年来，中国丝绸产业在创新攻关、生态培育、品牌创建等方面快速发展。中方愿与各方一道，践行四大全球倡议，弘扬以和平合作、开放包容、互学互鉴、互利共赢为核心的丝路精神，共同推动全球丝绸产业繁荣发展。要加强丝绸领域标准互认、规则对接和产业协同，依托“一带一路”科技创新行动计划等，共筑融通创新的产业生态。要在国际丝绸组织框架下搭建信息共享、供需对接、交流合作的公共服务平台，推动蚕桑资源培育、生产加工、贸易投资等领域务实合作，共建开放普惠的合作体系。要加强文化交流，推动丝绸技艺跨国展示、非遗传承人互访、设计师跨国联合创作等，促进各国丝绸技艺、设计理念与文化传统的相互交融，共织互学互鉴的友谊纽带。要用好国际丝绸组织这个合作平台，持续深耕产业、畅通经贸、传承文化，为高质量共建“一带一路”注入更多动力。\n\n　　在浙期间，张国清还就历史经典产业开展调研。他强调，丝绸、茶叶、瓷器等历史经典产业具有深厚文化底蕴和长久品质口碑，要在继承中发展，在发展中继承，推动更好传承中华文化、厚植产业优势、激发消费潜能。要加强产业传承创新，增强材料改良、工艺优化、设备升级等关键共性技术供给，强化标准引领，加强知识产权保护和运用。要推动历史经典产业与文化、旅游、康养、教育、乡村振兴等领域多元融合，培育壮大消费新场景新增长点，助力消费提质扩容。要支持经典名企做优做强，引导中小企业做精做深，不断提升品质品牌，擦亮金字招牌，让历史经典产业持续焕发新活力。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cad513bc700","title":"云南布局“十五五”生态文明：争当排头兵 消除国省控劣Ⅴ类断面","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735451.shtml","summary":"中新网昆明11月20日电 (陆希成)云南省委、省政府近日印发《生态文明建设排头兵暨美丽云南建设“十五五”规划》(以下简称《规划》)，围绕2035年建成中国生态文明建设排头兵的远景目标…","summary_short":"中新网昆明11月20日电 (陆希成)云南省委、省政府近日印发《生态文明建设排头兵暨美丽云南建设“十五五”规划》(以下简称…","digest":"云南布局“十五五”生态文明：争当排头兵 消除国省控劣Ⅴ类断面","points":["中新网昆明11月20日电 (陆希成)云南省委、省政府近日印发《生态文明建设排头兵暨美丽云南建…","云南是中国西南生态安全屏障，也是长江、珠江等六大水系的上游地区","《规划》提出，坚持保护为先、治污为重、扩绿为基、转型为要、发展为本，打好美丽云南建设持久战"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T19:18:49+08:00","size":1,"keywords":[],"body":"中新网昆明11月20日电 (陆希成)云南省委、省政府近日印发《生态文明建设排头兵暨美丽云南建设“十五五”规划》(以下简称《规划》)，围绕2035年建成中国生态文明建设排头兵的远景目标，明确到2030年，生态文明排头兵建设取得决定性进展，30%以上国土面积得到有效保护，全面消除劣Ⅴ类水体。\n\n　　云南是中国西南生态安全屏障，也是长江、珠江等六大水系的上游地区。《规划》提出，坚持保护为先、治污为重、扩绿为基、转型为要、发展为本，打好美丽云南建设持久战。\n\n　　从能源结构看，全省水能、风能、太阳能资源富集，截至2025年底，清洁能源装机超1.55亿千瓦，占比90%以上，绿色能源发电量占比约90%。依托绿电，文山壮族苗族自治州绿色铝产值2025年突破千亿元，成为当地首个千亿级产业。\n\n图为位于云南省文山壮族苗族自治州富宁县的富宁产业园区。当地依托绿色能源优势，推动电解铝及铝精深加工产业集聚发展。(无人机照片)中新网记者 李嘉娴 摄\n\n　　《规划》提出，到2030年清洁能源装机占比稳定在90%左右，发展“绿电＋先进制造业”，推动钢铁、有色金属、化工等产业绿色低碳转型，建设一批零碳园区、零碳工厂，拓展绿电直供模式。\n\n　　云南拥有茶叶、花卉、咖啡、中药材等一批高原特色优势产业。对此，《规划》提出提升绿色有机农产品供给能力，大力发展林下经济，并建设一批绿色旅游景区、生态民宿和低碳酒店，推进“旅居云南”高质量发展。\n\n　　高原湖泊和出境跨界河流是云南水环境治理的重点。《2025年云南省生态环境状况公报》显示，滇池水质达到1993年系统监测以来最好水平，杞麓湖、异龙湖实现脱劣，全省41条出境、跨界河流的49个监测断面全部达到Ⅰ至Ⅱ类标准。\n\n10月22日，云南昆明，市民来到滇池边漫步、打卡，观赏落日，享受秋日傍晚时光。　中新网记者 刘冉阳 摄\n\n　　在此基础上，《规划》明确，泸沽湖、抚仙湖水质保持Ⅰ类，洱海、阳宗海水质保持Ⅱ类，滇池水质稳定向好，程海水质达到Ⅳ类(氟化物除外)，巩固杞麓湖、异龙湖脱劣成效，加快提升星云湖水质。江河方面，长江干流水质稳定保持Ⅱ类，力争珠江、澜沧江等干流水质基本达到Ⅱ类，出境跨界断面水质稳定保持Ⅱ类及以上。\n\n　　固体废物和农村环境治理方面，《规划》提出，到2027年全面完成磷石膏库整治，综合利用率保持90%以上；到2030年，“无废城市”建设比例达75%，农村污水治理率达80%以上，374个沿边行政村(社区)农村生活垃圾处理设施覆盖率、农村生活污水治理率均达100%。\n\n　　云南素有“动植物王国”之称。《规划》提出，实施亚洲象等珍稀濒危物种跨境保护，推动香格里拉等国家公园申建，申建西双版纳、昆明国家植物园。到2030年，力争完成国土绿化1795万亩，森林蓄积量达25亿立方米。\n\n　　到2030年，云南还将开展10个美丽城市建设，美丽乡村整县建成比例达60%以上，美丽河湖建成率达65%。\n\n　　此外，《规划》明确，构建省负总责、市县抓落实的工作机制，由云南省生态环境厅会同有关部门对规划实施情况开展动态监测、中期评估和总结评估。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c88ae0ab724","title":"APEC｜領導人佩戴圍巾融合四大非遺工藝 事前準備五千米布料製作","url":"https://news.tvb.com/tc/1207504-APEC領導人佩戴圍巾融合四大非遺工藝事前準備五千米布料製作","summary":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾，這兩款圍巾融合了宋錦、香雲紗等非遺工藝，更是從一萬條圍巾的面料中，精選出42條。","summary_short":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾，這兩款圍巾融合了宋錦…","digest":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾…","points":["今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾…","APEC領導人非正式會議開始前，各經濟體領導人在嘉賓休息室內整理圍巾，智利總統卡斯特…","圍巾兩面紋樣不同，結合祥雲紋、海浪紋及嶺南木棉、簕杜鵑元素，上面的APEC標誌…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T19:10+08:00","size":1,"keywords":[],"body":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾，這兩款圍巾融合了宋錦、香雲紗等非遺工藝，更是從一萬條圍巾的面料中，精選出42條。\n\nAPEC領導人非正式會議開始前，各經濟體領導人在嘉賓休息室內整理圍巾，智利總統卡斯特，向秘魯總統籐森慶子求助，墨西哥總統辛鮑姆也上前，他們佩戴的一藍一紅「同心合錦」圍巾，寓意「同心協力、繁榮合錦」。\n\n圍巾兩面紋樣不同，結合祥雲紋、海浪紋及嶺南木棉、簕杜鵑元素，上面的APEC標誌，由21根交織的羽毛組成，展翅高飛的鯤鵬造型，織入21根天然野蠶絲，象徵21個經濟體攜手發展。更匯聚香雲紗、宋錦、粵繡及蘇繡四項非遺工藝。\n\n圍巾主要設計方吳建華說：「我們確立了四大非遺融合在一起，基本的材料以宋錦，和香雲紗技藝，包括粵繡這三方面的技藝，然後在後來過程當中，為了提升它的精緻度，我們融入了蘇繡。」\n\n他又透露準備了5,000米的布料，按常規可以製作一萬條圍巾，不過最終只製成了50條，最後僅留下紅藍圍巾各21條。由各領導人自行選擇想要的顏色，當中藍色圍巾，是蘇州上久楷的宋錦織造，而紅色是佛山順德的香雲紗染製，曾被叫作「響雲紗」，因為穿上身走路，會發出沙沙的響聲。\n\n這種製作工藝已有超過一千年歷史，一個頂尖手藝人製作一匹香雲紗，要經歷36道工序，至少要半年時間。故此香雲紗又被稱為「軟黃金」，一件成衣售價可達數萬港元。","image":"https://pro-vod-cdn.tvb.com/51eacfbc05604a638c5c87f18df8326c/snapshots/4bed92f34d754511ae1a43f962f928b4-00008.jpg","video":"https://pro-vod-cdn.tvb.com/51eacfbc05604a638c5c87f18df8326c/7d9ed4e336564d159307f5c4cb9f5856-91a158413f4044c70c19d4ee12426c44-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/51eacfbc05604a638c5c87f18df8326c/snapshots/4bed92f34d754511ae1a43f962f928b4-00008.jpg","lang":"zh-Hant"},{"id":"c744b52dc2f","title":"台湾民众对经济景气和股市的乐观情绪出现降温","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735428.shtml","summary":"中新社台北11月20日电 台湾一金融机构20日公布的调查显示，由于美伊冲突持续、市场对人工智能(AI)产业链的担忧再起，台湾民众对经济景气与股市的乐观情绪双双降温。","summary_short":"中新社台北11月20日电 台湾一金融机构20日公布的调查显示，由于美伊冲突持续、市场对人工智能(AI)产业链的担忧再起…","digest":"台湾一金融机构20日公布的调查显示，由于美伊冲突持续…","points":["中新社台北11月20日电 台湾一金融机构20日公布的调查显示，由于美伊冲突持续…","综合中央社、《工商时报》、联合新闻网等台湾媒体报道…","其中，景气现况乐观指数和展望乐观指数均呈下滑态势，分别从19.7和20降至负6.3和负1"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T19:00:24+08:00","size":1,"keywords":[],"body":"中新社台北11月20日电 台湾一金融机构20日公布的调查显示，由于美伊冲突持续、市场对人工智能(AI)产业链的担忧再起，台湾民众对经济景气与股市的乐观情绪双双降温。\n\n　　综合中央社、《工商时报》、联合新闻网等台湾媒体报道，国泰金融控股股份有限公司(简称国泰金控)当天发布11月台湾民众经济信心调查。其中，景气现况乐观指数和展望乐观指数均呈下滑态势，分别从19.7和20降至负6.3和负1。\n\n　　调查显示，由于美伊冲突持续，推升了通胀，同时市场对AI产业链担忧再起，股市乐观情绪及风险偏好指数同步下降。民众对于台股的乐观指数从55降至29.8，风险偏好指数从35下降至26.5。\n\n　　台当局行政主管机构“主计总处”8月曾预估台湾2026年经济增长率为11.05%，通货膨胀率为2.07%。此次调查显示，受访民众对台湾今年经济增长率平均预期值为10.87%，对通货膨胀率平均预期值为2.51%。(完)\r\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4f9db39ef7","title":"广西将织密乡村数字底座 提升产业数字化水平","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735421.shtml","summary":"中新网广西玉林11月20日电(记者 黄艳梅)2026年广西数字乡村建设工作推进会近日在广西玉林市举行。","summary_short":"中新网广西玉林11月20日电(记者 黄艳梅)2026年广西数字乡村建设工作推进会近日在广西玉林市举行。","digest":"2026年广西数字乡村建设工作推进会近日在广西玉林市举行","points":["中新网广西玉林11月20日电(记者 黄艳梅)2026年广西数字乡村建设工作推进会近日在广西玉…","从会上获悉，广西将织密乡村数字底座，提升产业数字化水平，提高乡村治理数字化效能…","行政村5G通达率超过98.5%，千兆光网实现行政村全覆盖，应急广播体系覆盖全部乡镇和行政村…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T18:45:11+08:00","size":1,"keywords":[],"body":"中新网广西玉林11月20日电(记者 黄艳梅)2026年广西数字乡村建设工作推进会近日在广西玉林市举行。记者从会上获悉，广西将织密乡村数字底座，提升产业数字化水平，提高乡村治理数字化效能，扎实推进“十五五”数字乡村高质量发展。\n\n图为会议现场。中新网记者 黄艳梅 摄\n\n　　数字乡村既是乡村振兴的战略方向，也是建设网络强国、农业强国的重要内容。“十四五”以来，广西数字乡村建设实现从零星试点探索向面上整体推进的跨越，累计培育5个国家级、35个自治区级试点，打造横州数字茉莉、马山智慧种业、田林乡村数字治理等特色样板；行政村5G通达率超过98.5%，千兆光网实现行政村全覆盖，应急广播体系覆盖全部乡镇和行政村，全民数字素养培训超20万人次，城乡数字鸿沟持续弥合。\n\n　　2026年是“十五五”开局之年，也是广西数字乡村从试点示范转向全域推广、从硬件建设转向软硬并举、从单点赋能转向系统赋能的关键节点。广西壮族自治区党委网信办牵头编制《广西数字乡村高质量发展行动计划(2026—2030年)》，明确各项目标任务。\n\n　　据悉，广西将聚力“基建普惠”，坚持普惠优先、边境优先、产业优先，优化乡村网络布局，实施乡村双千兆深耕行动，补齐5G、千兆光纤覆盖短板；深化智慧广电乡村工程、固边工程，保障应急广播常态长效使用；落实惠农降费举措，推动便民服务下沉，持续降低农村民众用网成本。\n\n　　广西将深耕智慧农业场景，聚焦粮油、糖蔗、果蔬、桑蚕、水产、林下经济六大优势产业，推进种养标准化、数字化管控；升级数商兴农体系，做强县域电商产业带，培育本土乡村网红品牌，规范涉农直播带货；培育数字新业态，依托乡村文旅资源，发展数字民宿、云上研学、村寨慢直播，打造特色数字文旅IP。\n\n　　此外，广西将推动村级数字化平台精简整合，建强边境数字化联防体系，拓展乡风文明数字化场景，持续优化线上便民服务，逐步缩小城乡政务服务差距。\n\n　　会议期间，与会代表实地观摩玉林福达国际香料物流港、玉州区校园智慧预警安全风险防控体系、广西(玉林)技能人才服务产业园、北流新圩镇河村百香果种植基地、数字孪生龙云灌区等现场点，近距离感受玉林在产业数字化、基层治理、智慧水利、富民产业等方面的实践。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfdf25b3458","title":"中俄美元首會晤｜肢體專家分析習特握手擁抱等互動相當合拍 展現團結","url":"https://news.tvb.com/tc/1207478-中俄美元首會晤肢體專家分析習特握手擁抱等互動相當合拍展現團結","summary":"歷史性的中俄美元首會晤落幕，有肢體語言專家分析，三國元首的互動反映權力定位。國家主席習近平與美國總統特朗普出現「伸出援手」的一幕，亦引起外界熱議。","summary_short":"歷史性的中俄美元首會晤落幕，有肢體語言專家分析，三國元首的互動反映權力定位。","digest":"歷史性的中俄美元首會晤落幕，有肢體語言專家分析，三國元首的互動反映權力定位","points":["歷史性的中俄美元首會晤落幕，有肢體語言專家分析，三國元首的互動反映權力定位","國家主席習近平與美國總統特朗普出現「伸出援手」的一幕，亦引起外界熱議","周四在深圳舉行的亞太經合組織領導人非正式會議，國家主席習近平與美國總統特朗普…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T18:33+08:00","size":1,"keywords":[],"body":"歷史性的中俄美元首會晤落幕，有肢體語言專家分析，三國元首的互動反映權力定位。國家主席習近平與美國總統特朗普出現「伸出援手」的一幕，亦引起外界熱議。\n\n周四在深圳舉行的亞太經合組織領導人非正式會議，國家主席習近平與美國總統特朗普，一邊前行一邊交流，當他們上扶手電梯時，習近平扶著特朗普的左手，讓對方先走上，特朗普站穩後，主動伸出左手，示意習近平可以扶著他。兩位元首這幕互動引起熱議，網上有評論員形容，特朗普與習近平成為最好的朋友。\n\n特朗普前一天抵達深圳時，習近平親自到機場迎接。美國《紐約郵報》引述肢體語言專家分析，當兩位元首握手及擁抱後，從站立到沿著紅地毯步行，動作及節奏都相當合拍，形容他們展現非凡的肢體協調，視覺上予人一種團結的感覺。\n\n至於周四的「重頭戲」，中俄美元首會晤，美國《新聞周刊》引述，心理、肢體語言及行為專家，指習近平由三人合照到圓檯會面始終居於核心位置，強化他作為會面主持以及權力中間人的形象，展示他成功促使特朗普與俄羅斯總統普京，訪華會面。\n\n相比習近平發言時挺直腰，專家指特朗普講話時有少少寒背，整個人向前傾及向下沉，令他顯得比另外兩位元首較矮小，加上他看似有些疲勞，沒有完全及積極投入會談。\n\n美國總統特朗普說：「他是誰？我的朋友。」\n\n特朗普與普京在中俄美元首會晤前舉行雙邊會談。有專家指，特朗普握手時，輕拍對方手臂，普京隨即「不甘示弱」，認為是有爭奪主導權的意味。","image":"https://pro-vod-cdn.tvb.com/a97640776c5c4f5c8f618f2dc3877445/snapshots/e455466f7f4a4f84bf2161721b7f3949-00008.jpg","video":"https://pro-vod-cdn.tvb.com/a97640776c5c4f5c8f618f2dc3877445/bbc1e47c7b2949f09769de335bd624df-fc428298b5399ad5172326ed2a990be3-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/a97640776c5c4f5c8f618f2dc3877445/snapshots/e455466f7f4a4f84bf2161721b7f3949-00008.jpg","lang":"zh-Hant"}]},{"name":"台灣","total":2,"items":[{"id":"ce7f37ff0cd","title":"专家：美国不支持“台独” 给岛内势力当头棒喝","url":"https://www.chinanews.com/tw/shipin/cns-d/2026/11-20/news1075605.shtml","summary":"11月20日，复旦大学国际问题研究院院长吴心伯在接受记者采访时表示，美方明确表态不支持 “台独”，也无意为 “台独” 而战。","summary_short":"11月20日，复旦大学国际问题研究院院长吴心伯在接受记者采访时表示，美方明确表态不支持 “台独”…","digest":"11月20日，复旦大学国际问题研究院院长吴心伯在接受记者采访时表示…","points":["11月20日，复旦大学国际问题研究院院长吴心伯在接受记者采访时表示…","这一清晰立场，对长期寄望以美国为靠山的岛内 “台独” 分裂势力形成当头棒喝","现在美方从表态到政策层面都释放明确信号：“台独” 不该发生…"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T19:54:45+08:00","size":1,"keywords":[],"body":"11月20日，复旦大学国际问题研究院院长吴心伯在接受记者采访时表示，美方明确表态不支持 “台独”，也无意为 “台独” 而战。这一清晰立场，对长期寄望以美国为靠山的岛内 “台独” 分裂势力形成当头棒喝。现在美方从表态到政策层面都释放明确信号：“台独” 不该发生，“台独” 势力不要幻想美国会为其撑腰出战。(记者 刘世炯 狄权 制作 王雪尔）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/844CFE176E7B4C1398EE984B16524F2E.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c3de32e7886","title":"台湾媒体人给深圳APEC打120分：“Perfect！非常完美！”","url":"https://www.chinanews.com/tw/shipin/2026/11-20/news1075617.shtml","summary":"台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展，并观察到从世界各地远道而来的领袖们在参会期间，几乎都会对这座城市本身表达赞叹。","summary_short":"台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展，并观察到从世界各地远道而来的领袖们在参会期间…","digest":"台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展…","points":["台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展…","对于此次深圳APEC会议，他直言：“Perfect"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:48:08+08:00","size":1,"keywords":[],"body":"台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展，并观察到从世界各地远道而来的领袖们在参会期间，几乎都会对这座城市本身表达赞叹。对于此次深圳APEC会议，他直言：“Perfect！120 分！”“办得非常完美！”(中新网“燕新台”工作室）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/20/4677a258-d7f9-4485-8230-c68a9f836e9a.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"國際","total":25,"items":[{"id":"cd1474a5238","title":"越共中央总书记、国家主席苏林就任后首访云南","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735579.shtml","summary":"中新社昆明11月20日电 (记者 陈静)越共中央总书记、国家主席苏林和夫人结束亚太经合组织(APEC)第三十三次领导人非正式会议行程后，于11月19日至20日到访云南。","summary_short":"中新社昆明11月20日电 (记者 陈静)越共中央总书记、国家主席苏林和夫人结束亚太经合组织(APEC)第三十三次领导人非…","digest":"越共中央总书记、国家主席苏林就任后首访云南","points":["中新社昆明11月20日电 (记者 陈静)越共中央总书记…","在滇期间，苏林参访昆明胡志明旧居、会见中越青年代表、出席越南—中国西南地区发展战略对接论坛…","苏林一行19日甫抵昆明，首站就来到位于昆明市区的胡志明旧居参访，向胡志明雕像献花…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:18:21+08:00","size":2,"keywords":[],"body":"中新社昆明11月20日电 (记者 陈静)越共中央总书记、国家主席苏林和夫人结束亚太经合组织(APEC)第三十三次领导人非正式会议行程后，于11月19日至20日到访云南。在滇期间，苏林参访昆明胡志明旧居、会见中越青年代表、出席越南—中国西南地区发展战略对接论坛、在昆明种下友谊树。\r\n\n　　这是苏林就任越共中央总书记、国家主席后首次到访云南。\n\n　　苏林一行19日甫抵昆明，首站就来到位于昆明市区的胡志明旧居参访，向胡志明雕像献花，捐赠胡志明铜像，了解胡志明在云南开展革命活动情况，重温越中深厚历史情谊。\n\n　　20日，苏林与在昆参加2026越南青年来华“红色研学之旅”云南行的中越青年会面，并寄语青年。随后，出席越南—中国西南地区发展战略对接论坛并致辞。论坛结束后，苏林前往昆明宝丰湿地公园实地考察习近平生态文明思想在云南的实践成果，察看滇池保护治理、文旅融合发展等情况，并同中共云南省委书记莫高义一起种下友谊树。\n\n　　中共云南省委书记莫高义，中共云南省委副书记、代省长刘奇凡在昆明会见苏林一行。\n\n　　莫高义表示，苏林总书记、国家主席出席亚太经合组织第三十三次领导人非正式会议后率团到云南参访，充分体现对深化越南与云南合作的高度重视。云南将加强与越南务实合作，加快推进铁路、公路、水运、口岸等基础设施建设，深化绿色低碳、清洁能源、特色农产品等领域合作，以“中越旅游合作年”为契机发展跨境旅游，用好两国沿边省委书记年度会晤等机制，在基础设施互联互通、经贸合作互惠互利、人文交流走深走实等方面取得更大更多合作成果。\n\n　　苏林表示，越南与云南山连山、水连水，有着深厚的革命友谊、良好的合作基础和巨大的合作潜力。越方愿以此访为契机，与云南同志一道努力，持续巩固拓展越南各层级和地方与云南的友好合作，加快交通、物流、能源、电力设施联通，加强特色农业、绿色工业等领域合作，扩大进出口贸易，加强青年交流，密切人员往来，增进两国人民相互了解和友谊，让更多互利合作成果惠及两国和地区人民。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"越共中央总书记、国家主席苏林就任后首访云南","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735579.shtml","source_display":"中國新聞網","published_at":"2026-11-20T22:18:21+08:00","category":"國際","digest":"越共中央总书记、国家主席苏林就任后首访云南"},{"title":"越共中央总书记、国家主席苏林抵昆 首站为何到胡志明旧居","url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075601.shtml","source_display":"中新視頻","published_at":"2026-11-20T19:30:25+08:00","category":"國際","digest":"11月19日下午，越共中央总书记、国家主席苏林和夫人结束APEC会议行程…"}],"cross":{"total":2,"angles":[{"point":"越共中央总书记、国家主席苏林就任后首访云南","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gj/2026/11-20/10735579.shtml"},{"point":"11月19日下午，越共中央总书记、国家主席苏林和夫人结束APEC会议行程…","sources":["中新視頻"],"url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075601.shtml"}]}},{"id":"c3c6ee9498c","title":"特朗普：與習近平同意為AI設防護機制 警告美企海外建數據中心將被徵重稅","url":"https://www.stheadline.com/realtime-world/3639498/特朗普與習近平同意為AI設防護機制-警告美企海外建數據中心將被徵重稅","summary":"美國總統特朗普昨日（20日）結束亞太經合組織（APEC）行程返抵華盛頓後，在白宮舉行新聞發布會。","summary_short":"美國總統特朗普昨日（20日）結束亞太經合組織（APEC）行程返抵華盛頓後，在白宮舉行新聞發布會。","digest":"美國總統特朗普結束亞太經合組織行程返抵華盛頓後，在白宮舉行新聞發布會","points":["美國總統特朗普昨日（20日）結束亞太經合組織（APEC）行程返抵華盛頓後…","他在記者會上證實，自己與國家主席習近平一致同意為人工智能（AI）設立防護機制","警告美國企業切勿在海外興建數據中心，否則將面臨「極為沉重的稅項」及嚴厲懲罰"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T02:54:09+08:00","size":1,"keywords":[],"body":"美國總統特朗普昨日（20日）結束亞太經合組織（APEC）行程返抵華盛頓後，在白宮舉行新聞發布會。他在記者會上證實，自己與國家主席習近平一致同意為人工智能（AI）設立防護機制；同時警告美國企業切勿在海外興建數據中心，否則將面臨「極為沉重的稅項」及嚴厲懲罰。\n形容與習近平普京會晤氛圍極佳\n談及數據中心發展問題，特朗普向有意在美國境外興建數據中心的企業發出強硬警告，強調相關設施必須設於美國本土。\n特朗普表示：「我們絕不允許本國企業在國外興建數據中心。我們不會讓這種事發生。大家知道，過去在晶片及其他領域，這種情況曾被放任發生，結果對我們國家造成了極大的破壞。」\n他進一步補充：「如果他們執意這麼做——當然他們不能這麼做——我們將會對他們課徵極為沉重的稅。如果他們真的要蓋，那就必須蓋在美國境內。我們不允許數據中心外移到其他國家，因為中國會把這些全盤接收，我們絕不容許這種事發生。對於任何試圖這麼做的企業，我們將祭出極為嚴厲的懲罰。」\n此外，特朗普在記者會上稱，已與習近平達成共識，同意為人工智能設立防護機制。\n他亦提及早前與習近平及俄羅斯總統普京的會晤，形容彼此對話氛圍極佳、關係甚好。特朗普透露，三國領導人在會談中觸及限制核武擴散的議題，指出三方均認為必須攜手合作，遏止核威脅在全球各地蔓延，並特別就確保伊朗永遠無法擁有核武進行了深入討論。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc1707936f5","title":"日本核心CPI连续62个月上涨","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735435.shtml","summary":"中新社东京11月20日电(记者 朱晨曦)日本总务省20日公布的数据显示，10月日本去除生鲜食品后的核心消费价格指数(CPI)同比上升2.2%至102.9，连续62个月同比上涨。","summary_short":"中新社东京11月20日电(记者 朱晨曦)日本总务省20日公布的数据显示…","digest":"日本总务省20日公布的数据显示…","points":["中新社东京11月20日电(记者 朱晨曦)日本总务省20日公布的数据显示…","数据显示，能源价格上涨是推动物价上行的重要因素","随着政府补贴退出，电费价格由9月同比下降2.4%转为10月同比上涨1.6%…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T19:17:53+08:00","size":2,"keywords":[],"body":"中新社东京11月20日电(记者 朱晨曦)日本总务省20日公布的数据显示，10月日本去除生鲜食品后的核心消费价格指数(CPI)同比上升2.2%至102.9，连续62个月同比上涨。\n\n　　数据显示，能源价格上涨是推动物价上行的重要因素。随着政府补贴退出，电费价格由9月同比下降2.4%转为10月同比上涨1.6%，城市燃气费同比涨幅也由0.2%扩大至5.3%。能源价格上涨拉动整体物价涨幅扩大0.2个百分点。\n\n　　数据显示，10月日本剔除生鲜食品的食品价格同比上涨2.2%。受原材料价格飙升影响，餐厅寿司价格同比上涨11.5%，炸鸡价格同比上涨9.6%，冰淇淋价格同比上涨7.0%。同时，受9月持续降雨、日照不足影响，生菜、卷心菜等叶菜类蔬菜生长受阻，10月日本生鲜食品价格同比涨幅达到6.3%，较9月的2.1%明显扩大。\n\n　　截至10月，日本核心CPI涨幅连续两个月超过日本政府和央行设定的2%目标水平。(完)\r\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"日本核心CPI连续62个月上涨","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735435.shtml","source_display":"中新網 環球","published_at":"2026-11-20T19:17:53+08:00","category":"國際","digest":"日本总务省20日公布的数据显示…"},{"title":"日本核心CPI连续62个月上涨 民调显示高市应对通胀措施遭质疑","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735447.shtml","source_display":"中新網 環球","published_at":"2026-11-20T19:03:54+08:00","category":"國際","digest":"日本总务省20日公布的数据显示，剔除生鲜食品后…"}]},{"id":"c4e0a84f08f","title":"联合国助理秘书长：儿基会同中国合作正惠及世界更多儿童","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735596.shtml","summary":"中新社北京11月20日电 (记者 官逸伦)“我在今年早些时候访问加沙地带时，亲眼见证了这一伙伴关系带来的影响：中国支持联合国儿童基金会，提供挽救生命的医疗和过冬物资。","summary_short":"中新社北京11月20日电 (记者 官逸伦)“我在今年早些时候访问加沙地带时…","digest":"“我在今年早些时候访问加沙地带时…","points":["中新社北京11月20日电 (记者 官逸伦)“我在今年早些时候访问加沙地带时…","”联合国助理秘书长、联合国儿基会副执行主任泰德·柴班20日在北京出席活动时如是说","自1979年以来，联合国儿基会与中国政府紧密合作，在教育、卫生、营养、儿童保护…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T23:07:47+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 (记者 官逸伦)“我在今年早些时候访问加沙地带时，亲眼见证了这一伙伴关系带来的影响：中国支持联合国儿童基金会，提供挽救生命的医疗和过冬物资。”联合国助理秘书长、联合国儿基会副执行主任泰德·柴班20日在北京出席活动时如是说。\r\n\n　　11月20日是世界儿童日。由中国儿童中心和联合国儿基会主办的世界儿童日暨联合国儿童基金会成立80周年主题活动当日举行。\n\n　　柴班称，中国支持联合国儿基会应对冲突和灾害的应急响应工作，支持在低收入国家实施的发展项目，为推动全球加快实现联合国可持续发展目标作出贡献，并在应对气候变化、在数字和人工智能领域为儿童创造机遇等行动中发挥着重要作用。\n\n　　今年是联合国儿基会成立80周年。自1979年以来，联合国儿基会与中国政府紧密合作，在教育、卫生、营养、儿童保护、青年赋能和南南合作等多个领域不断取得成果。\n\n　　回顾过去，柴班表示，在中国，持续的政治意愿和人力资本投入，推动儿童事业发展取得长足进步。“如今，中国已能为其他国家提供支持，并成为联合国儿基会最重要的合作伙伴之一。”\n\n　　在外国驻华使团长、喀麦隆驻华大使马丁·姆巴纳看来，中国的发展历程显示出一国持之以恒的努力能取得怎样的成就。他表示，通过改革开放和现代化建设，中国使数亿人摆脱极端贫困，儿童也得以从健康、教育和生活水平的重大提升中获益。\n\n　　据姆巴纳介绍，喀麦隆、中国以及联合国儿基会正在强化医疗卫生与营养服务等方面携手合作，预计约有200万人将从这一合作关系中受益。\n\n　　“这些数字的背后，是拥有健康起点的儿童、能够获得更安全饮用水的家庭，以及为未来做好更充分准备的社区。”姆巴纳说。\n\n　　柴班表示，增进儿童福祉源于一次次的选择。他呼吁各方选择倾听儿童心声，选择投资儿童、维护儿童权利、守护儿童福祉。“因为选择儿童，就是选择全人类更美好的明天。”(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2e2d5f5dde","title":"美國明星河馬誤吞遊客帽死於併發症 有人認為可避免悲劇","url":"https://news.tvb.com/tc/1207539-美國明星河馬誤吞遊客帽死於併發症有人認為可避免悲劇","summary":"美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症。大批遊客到動物園悼念，有人認為園方本來可以避免悲劇發生。","summary_short":"美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症。","digest":"美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症","points":["美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症","大批遊客到動物園悼念，有人認為園方本來可以避免悲劇發生","美國俄亥俄州辛辛那提動物園，表示現年9歲的河馬FIONA，因上周吞下意外吹入棲息園區…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T23:00:00+08:00","size":1,"keywords":["美國","併發症","河馬"],"body":"美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症。大批遊客到動物園悼念，有人認為園方本來可以避免悲劇發生。\n\n美國俄亥俄州辛辛那提動物園，表示現年9歲的河馬FIONA，因上周吞下意外吹入棲息園區，一頂屬於遊客的冷帽，周四死於併發症。\n\n園方解釋，事發後一直監察FIONA的情況，起初牠無症狀，園方認為成年的牠已經夠大，可以排出這個細小異物，但後來發現牠食慾下降，於是為牠注射鎮靜劑展開檢查。\n\n經諮詢獸醫等專家意見後，認為FIONA不適合接受手術，取出異物，原因包括牠的消化系統複雜，需要在牠身體開多個切口，尋找異物的位置，加上皮膚較厚難以麻醉，以及在手術後的康復階段，牠無法浸在水中，保持皮膚濕潤，只能夠協助牠消化及排出冷帽，包括餵牠進食喜愛的食物，但依然無效。\n\nFIONA於2017年早產出生時，比河馬最輕的出生體重紀錄，輕11公斤，無法自行站立或由母親照顧。\n\n園方將牠交由工作人員照顧，並將牠的成長過程在網上公開，吸引大批海內外網民關注及打氣，牠亦成為希望的象徵。\n\nFIONA逝世的消息傳出後，不少人到動物園獻花悼念，部分人神情哀傷。有居民及遊客表示，由FIONA出生起一直關注牠，對牠離世感到非常傷心，又認為悲劇可以避免。\n\n遊客哈基說：「我原本以為牠可以撐過去，我今早還看到她聞咖啡的影片，我當時抱有希望，所以現在非常難過，這是一個令人心碎的損失，而且不幸的是此事可以避免，但它是一場離奇意外。」\n\n動物園亦強調，FIONA吞下冷帽純屬意外，指一名遊客隔著玻璃觀看FIONA時，將冷帽向上拋，結果被吊扇勾住及飛向玻璃觀賞窗上方的空隙，跌落棲息園區。\n\n辛辛那提動物園並非首次發生涉及遊客的動物死亡事故。在FIONA出生前一年，即2016年，一名男孩爬入大猩猩園區，一隻深受歡迎的17歲大猩猩抱起他，工作人員出於男孩安全起見，開槍射殺大猩猩，做法引起極大爭議，而男孩只是受傷，無生命危險。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026IuQoBhtuCn1795188005.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/26f6ab6fc6174bddab9a83b9046c02b1/3cf9b9dee6954d15a6114640da14849f-15d8584298c74c9d1b2c36bc89daef8a-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026IuQoBhtuCn1795188005.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c8e281e7013","title":"國際法院裁定緬甸對羅興亞人實施種族滅絕 中方對越權管轄等問題存關切","url":"https://news.tvb.com/tc/1207532-國際法院裁定緬甸對羅興亞人實施種族滅絕中方對越權管轄等問題存關切","summary":"國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立，緬甸對裁決深感失望。聯合國最高司法機構荷蘭海牙的國際法院，周四就緬甸軍方在2017年，屠殺羅興亞人案作出裁決。","summary_short":"國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立，緬甸對裁決深感失望。","digest":"國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立，緬甸對裁決深感失望","points":["國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立，緬甸對裁決深感失望","聯合國最高司法機構荷蘭海牙的國際法院，周四就緬甸軍方在2017年，屠殺羅興亞人案作出裁決","由15人組成的法官小組，以9比6裁定，緬甸清剿羅興亞人構成種族滅絕…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T22:32+08:00","size":1,"keywords":[],"body":"國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立，緬甸對裁決深感失望。\n\n聯合國最高司法機構荷蘭海牙的國際法院，周四就緬甸軍方在2017年，屠殺羅興亞人案作出裁決。由15人組成的法官小組，以9比6裁定，緬甸清剿羅興亞人構成種族滅絕，違反《防止及懲治滅絕種族罪公約》，且不接受上訴。是國際法院成立逾80年來，首次裁定有主權國干犯相關罪行。\n\n緬甸外交部表示深感失望，指其採取的是反恐行動，並無滅絕種族的意圖，又指裁決並非一致通過。\n\n中國外交部稱，中方對越權管轄和擴大解釋等問題存在關切，認為有關做法不利於爭端解決。","image":"https://pro-vod-cdn.tvb.com/e08813a8b67c478a86080e813671bbab/snapshots/2ecca2374c7a491ebbcdaede560efd32-00006.jpg","video":"https://pro-vod-cdn.tvb.com/e08813a8b67c478a86080e813671bbab/a5bf3319f2b84b9587e185786721a61d-77f9628a1b150a839ac451b40c9a8b54-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e08813a8b67c478a86080e813671bbab/snapshots/2ecca2374c7a491ebbcdaede560efd32-00006.jpg","lang":"zh-Hant"},{"id":"ce6ac7cfdab","title":"俄羅斯轟烏導彈撞入波蘭領土 總理圖斯克召開緊急會議","url":"https://www.stheadline.com/realtime-world/3639437/俄羅斯轟烏導彈撞入波蘭領土-總理圖斯克召開緊急會議","summary":"11月20日，俄羅斯凌晨對烏克蘭發動大規模導彈與無人機攻擊期間，波蘭防空單位偵測到不明物體侵犯領空，在靠近烏克蘭邊境的東南部地區也有民眾拍攝到火光墜落。","summary_short":"11月20日，俄羅斯凌晨對烏克蘭發動大規模導彈與無人機攻擊期間，波蘭防空單位偵測到不明物體侵犯領空…","digest":"11月20日，俄羅斯凌晨對烏克蘭發動大規模導彈與無人機攻擊期間…","points":["11月20日，俄羅斯凌晨對烏克蘭發動大規模導彈與無人機攻擊期間…","波蘭當局正前往調查至少3處相關地點，以確定來襲物體是何種武器","波蘭國防部表示，軍方正在調查這宗疑似侵犯領空事件"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:28:33+08:00","size":1,"keywords":[],"body":"11月20日，俄羅斯凌晨對烏克蘭發動大規模導彈與無人機攻擊期間，波蘭防空單位偵測到不明物體侵犯領空，在靠近烏克蘭邊境的東南部地區也有民眾拍攝到火光墜落。波蘭當局正前往調查至少3處相關地點，以確定來襲物體是何種武器。\n波蘭國防部表示，軍方正在調查這宗疑似侵犯領空事件。國防部長卡梅什（Władysław Kosiniak-Kamysz）表示，這可能是俄羅斯對波蘭的另一項挑釁，而且發生時間恰好與歐洲多國部隊在波蘭舉行聯合軍事演習重疊。\n波蘭總理圖斯克（Donald Tusk）則宣布召集政府部長、軍方指揮官及安全部門負責人舉行緊急會議，研商因應措施。當局正在調查3處不明物體墜落地點，分別位於桑河畔魯德尼克（Rudnik nad Sanem）、莫沃迪奇（Mołodycz）及新利波維茨（Nowy Lipowiec）。\n波蘭軍方表示，正在比對雷達紀錄、居民通報及盟國提供的情報，以確認究竟有多少飛行物體進入波蘭領空，以及它們的具體種類。\n為因應俄羅斯的空襲，波蘭連夜提高防空警戒，並出動戰機執行空中警戒任務。當地時間上午6時33分左右，政府安全中心向盧布林省及喀爾巴阡山省部分地區居民發布空襲威脅警告，要求民眾尋找避難場所、聽從緊急服務部門指示。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7db9a2659e","title":"Anthropic上市｜5000多名員工一夜變富翁 600人持股價值破1億美元","url":"https://www.stheadline.com/realtime-world/3639434/Anthropic上市5000多名員工一夜變富翁-600人持股價值破1億美元","summary":"美國人工智能（AI）新創公司Anthropic11月19日在納斯達克掛牌上市，大多數員工隨即變成百萬美元富翁（約784萬港元），其中數百人身家甚至破1億美元（7.84億港元）。","summary_short":"美國人工智能（AI）新創公司Anthropic11月19日在納斯達克掛牌上市…","digest":"美國人工智能新創公司Anthropic11月19日在納斯達克掛牌上市…","points":["美國人工智能（AI）新創公司Anthropic11月19日在納斯達克掛牌上市…","這批新富豪恐怕會令原本已瘋狂的三藩市房價進一步攀高","其中2800名員工持股價值更超過1000萬美元，當中又有約600人持股價值突破1億美元…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:10:59+08:00","size":1,"keywords":[],"body":"美國人工智能（AI）新創公司Anthropic11月19日在納斯達克掛牌上市，大多數員工隨即變成百萬美元富翁（約784萬港元），其中數百人身家甚至破1億美元（7.84億港元）。這批新富豪恐怕會令原本已瘋狂的三藩市房價進一步攀高。\n96%員工變百萬美元富翁\n美國有線電視新聞網（CNN）報道，Anthropic申報資料顯示，截至9月員工總數為5300人。以招股價每股83美元計算，96%員工（即約5100名）持股價值至少達100萬美元。\n其中2800名員工持股價值更超過1000萬美元，當中又有約600人持股價值突破1億美元，躋身人數不多的「億萬富豪」俱樂部。值得注意的是，一般科技公司上市對員工設有3至6個月的持股禁售期，但Anthropic今次破例採用分批解禁機制，非創辦人員工在掛牌首日最多可套現10%持股。\nAnthropic於2021年才創立，2024年底員工人數還不到1000人。矽谷新創公司由於現金不充裕，常以配股方式吸引人才，以未來可能被收購或上市的美好願景，鼓勵員工效力至報酬實現，但甚少有新創公司像Anthropic員工規模成長如此迅速且龐大。\n\n三藩市瘋狂樓價再添壓力\nAnthropic員工集中在加州三藩市，而當地房價漲幅已創數年新高，美國樓市服務網站Redfin資料顯示，10月三藩市一般住宅成交價為170萬美元（約1332.5萬港元），同比上漲近19%。Anthropic上市造就的新一批富豪，很可能會再為三藩市房市再添壓力。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3910fd8c14","title":"数万名日本民众签名反对日本拥有核潜艇","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735557.shtml","summary":"中新社东京11月20日电(记者 朱晨曦)日本多个民间团体20日向防卫省递交由约4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。","summary_short":"中新社东京11月20日电(记者 朱晨曦)日本多个民间团体20日向防卫省递交由约4.7万名日本民众联合签名的材料…","digest":"日本多个民间团体20日向防卫省递交由约4.7万名日本民众联合签名的材料…","points":["中新社东京11月20日电(记者 朱晨曦)日本多个民间团体20日向防卫省递交由约4.7万名日本…","此次联合签名活动由“日本原子力资料情报室”等民间机构和组织共同发起","签名活动声明中说，日本作为唯一遭受过原子弹轰炸的国家，一直宣称有责任推动废除核武器…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T21:57:21+08:00","size":1,"keywords":[],"body":"中新社东京11月20日电(记者 朱晨曦)日本多个民间团体20日向防卫省递交由约4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。\n\n　　此次联合签名活动由“日本原子力资料情报室”等民间机构和组织共同发起。签名活动声明中说，日本作为唯一遭受过原子弹轰炸的国家，一直宣称有责任推动废除核武器，而拥有核动力潜艇无异于主动背弃这一承诺。声明表示，强烈要求政府撤回拥有核潜艇的相关计划。\n\n当地时间11月20日，日本多个民间团体向防卫省递交由约4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。中新社记者 朱晨曦 摄\n\n　　在递交联署材料后的记者会上，日本原子力资料情报室事务局长松久保肇说：“日本正站在十字路口。当前日本正试图朝着拥有核潜艇的方向前进，这与战后政府倡导和平利用核能的立场明显矛盾。”他表示，“虽然情况非常紧迫，但我们希望掀起一股反对的浪潮。”\n\n　　日本民间组织“和平之船”共同代表川崎哲表示，日本战后确立的“专守防卫”以及核能和平利用等原则不能被突破，日本政府不应引进核潜艇。\n\n　　相关民间团体代表在记者会上表示，日本政府一方面探讨引进核动力潜艇，另一方面又试图为“无核三原则”中“不运进”一项设置例外情况，这一系列相互关联的政策变化，可能从根本上改变日本作为无核武器国家的定位。\n\n　　围绕核动力潜艇问题，与自民党共同组成执政联盟的日本维新会今年6月在向政府提交的有关修改“安保三文件”的建议中要求日本引进核潜艇。日本防卫大臣小泉进次郎近期多次在谈及引进核潜艇问题时表示，相关讨论“不排除任何选项”。今年10月，日本首相高市早苗在国会表示，将围绕自卫队引进核潜艇问题展开“具体且现实的讨论”。相关动向持续引发日本国内广泛担忧与反对。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c872937344e","title":"联合国教科文组织新报告呼吁加大儿童学前教育投资","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735540.shtml","summary":"中新网巴黎11月20日电 联合国教科文组织在20日世界儿童日之际发布新报告，呼吁加大儿童学前教育投资。","summary_short":"中新网巴黎11月20日电 联合国教科文组织在20日世界儿童日之际发布新报告，呼吁加大儿童学前教育投资。","digest":"联合国教科文组织在20日世界儿童日之际发布新报告，呼吁加大儿童学前教育投资","points":["报告指出，若要确保到2030年每名儿童都接受至少1年的学前教育…","过去10年来，学前教育入学率增长陷入停滞，全球小学入学儿童中…","报告显示，教育资金缺口不断扩大，不平等现象持续存在，导致全球数百万幼儿无法获得优质保育和教育"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T21:56:27+08:00","size":1,"keywords":[],"body":"中新网巴黎11月20日电 联合国教科文组织在20日世界儿童日之际发布新报告，呼吁加大儿童学前教育投资。\n\n　　报告指出，若要确保到2030年每名儿童都接受至少1年的学前教育，全球每年还需增加逾350亿美元投资。过去10年来，学前教育入学率增长陷入停滞，全球小学入学儿童中，只有60%接受过至少1年的学前教育，且各地区之间存在显著差距。报告显示，教育资金缺口不断扩大，不平等现象持续存在，导致全球数百万幼儿无法获得优质保育和教育。\n\n　　联合国教科文组织总干事阿纳尼表示，童年早期的成长至关重要，但全球对幼儿保育和教育的投入仍严重不足。这不仅阻碍儿童发展和学习，加剧不平等，还会削弱经济。教科文组织呼吁各国建立可持续、公平、协调一致的筹资体系，将最年幼和最弱势儿童的需求置于核心。\n\n　　许多儿童在入学之初就已处于弱势，这一现实使得加大相关投资尤显迫切。全球24-59月龄儿童中，仅有64%在早期学习等各方面的发展水平达到其年龄预期；在撒哈拉以南非洲，这一比例降至53%。投资优质幼儿保育和教育，有助于在这些差距进一步固化之前缩小差距。\r\n\n　　尽管幼儿教育普及取得显著进展，入学率从2003年的64%提高至2024年的75%，但过去10年来，增长已陷入停滞。报告估计，全球入读小学儿童仅有59%接受过至少1年的学前教育。这一比例自2015年以来几乎没有变化，表明全球距实现教育相关可持续发展目标仍有很大差距。\n\n　　此外，全球平均数据掩盖了显著的地区差异。2024年，在欧洲、北美、拉丁美洲和加勒比地区，小学入学前1年接受学前教育的儿童比例均超过90%；而在北非、西亚、撒哈拉以南非洲，这一比例仍仅为50%左右。\n\n　　教科文组织与会员国及合作伙伴共同努力，推动保障每名儿童享有优质幼儿保育和教育的权利。相关工作包括促进良好实践交流，并支持科特迪瓦、牙买加、摩洛哥、坦桑尼亚、阿拉伯联合酋长国等国开展有关的评估和政策规划工作。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb654467940","title":"马斯克试图与MAGA切割？特朗普回应：他是我的朋友","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735542.shtml","summary":"中新网11月20日电 综合美媒近日报道，在民主党于美国中期选举中大胜共和党后，特斯拉公司和太空探索技术公司首席执行官马斯克正与“让美国再次伟大”(MAGA)阵营保持距离…","summary_short":"中新网11月20日电 综合美媒近日报道，在民主党于美国中期选举中大胜共和党后…","digest":"综合美媒近日报道，在民主党于美国中期选举中大胜共和党后…","points":["中新网11月20日电 综合美媒近日报道，在民主党于美国中期选举中大胜共和党后…","对此，美国总统特朗普则回应称，马斯克仍是自己的朋友","据美国《纽约时报》18日报道，马斯克在接受采访时试图将自己塑造成一名温和派人士…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T21:24:58+08:00","size":1,"keywords":[],"body":"中新网11月20日电 综合美媒近日报道，在民主党于美国中期选举中大胜共和党后，特斯拉公司和太空探索技术公司首席执行官马斯克正与“让美国再次伟大”(MAGA)阵营保持距离，并称对此前为共和党候选人投入大量资金表示后悔。对此，美国总统特朗普则回应称，马斯克仍是自己的朋友。\r\n\n　　马斯克与MAGA切割？\n\n　　美媒称其立场转变明显\n\n　　据美国《纽约时报》18日报道，马斯克在接受采访时试图将自己塑造成一名温和派人士，称自己不是“让美国再次伟大”(MAGA)阵营的一员，并称“两党都有积极和消极的一面”。\n\n　　马斯克说：“我不确定‘MAGA’具体指什么。但如果这意味着盲目遵循共和党的一整套政策，那么我显然不是这样的人。”\n\n　　谈及在中期选举中投入大量资金、但支持的候选人最终落败一事，马斯克表示，他感到“相当愚蠢”。“如果能重来，我会少花点钱，”马斯克说。\n\n　　美媒指出，马斯克立场转变十分明显。此前，马斯克曾积极支持特朗普及共和党阵营，而此次表态显示，其与”MAGA”阵营的关系出现变化。\n\n　　特朗普”力挺“马斯克：\n\n　　他是我的朋友\n\n　　美媒报道称，面对马斯克的表态，特朗普的态度似乎颇为淡然。尽管马斯克表示自己“不属于MAGA阵营”，但特朗普仍然将马斯克视为盟友。“他是我的朋友，”特朗普在谈到马斯克时说。\n\n　　特朗普还补充称“埃隆的初衷非常好”，他提到，马斯克曾伴随他出行。\n\n　　不过，特朗普也强调，”MAGA”对自己而言有着非常明确的含义。他说：“外界对‘MAGA’有各种定义。对我而言，‘MAGA’有着非常明确的含义，当人们偏离这一理念时，往往不会取得好结果。”\n\n　　美媒指出，特朗普和马斯克此前曾经历过多次公开争执，也在一些问题上发生冲突，但两人多次和解。此次，尽管特朗普与马斯克存在政治立场分歧，但他们的个人关系依然维持。\n\n　　不过，一些民主党人似乎对马斯克态度的转变并不买账。亚利桑那州民主党籍联邦参议员鲁宾·加列戈和亚利桑那州民主党籍联邦众议员亚萨明·安萨里表示，无论马斯克是否与”MAGA”划清界限，一旦民主党明年重掌国会，马斯克仍可能面临国会的调查。 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1edc8a7674","title":"《我是陳派派》｜台灣定格動畫奪NHK日本賞最高榮譽獎","url":"https://www.stheadline.com/realtime-world/3639413/我是陳派派台灣定格動畫奪NHK日本賞最高榮譽獎","summary":"共同社報道，由日本放送協會（NHK）主辦的第53屆國際媒體競賽，19日在東京舉行頒獎典禮，台灣小公視定格動畫作品《我是陳派派》一舉拿下日本放送協會（NHK）日本賞最高榮譽獎（Grand Prix）及學…","summary_short":"共同社報道，由日本放送協會（NHK）主辦的第53屆國際媒體競賽，19日在東京舉行頒獎典禮…","digest":"共同社報道，由日本放送協會主辦的第53屆國際媒體競賽，19日在東京舉行頒獎典禮…","points":["共同社報道，由日本放送協會（NHK）主辦的第53屆國際媒體競賽，19日在東京舉行頒獎典禮…","》，該集內容講述10歲女孩陳派派，在颱風逼近時滿心期待學校停課的故事","日本賞評審團稱讚，這部動畫透過一名個性自我中心的主角，帶領觀眾經歷如雲霄飛車般的情緒起伏…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:38:12+08:00","size":1,"keywords":[],"body":"共同社報道，由日本放送協會（NHK）主辦的第53屆國際媒體競賽，19日在東京舉行頒獎典禮，台灣小公視定格動畫作品《我是陳派派》一舉拿下日本放送協會（NHK）日本賞最高榮譽獎（Grand Prix）及學齡兒童類最優秀作品獎兩項大獎，為台灣原創動畫寫下重要紀錄。\nNHK日本賞最高榮譽獎《我是陳派派》負責人領獎。 官方fb\n共同社報導，由日本放送協會（NHK）主辦的第53屆國際媒體競賽，19日在東京舉行頒獎典禮，台灣的定格動畫作品《我是陳派派》一舉拿下日本賞最高榮譽獎（Grand Prix）及學齡兒童類最優秀作品獎兩項大獎，為台灣原創動畫創作寫下重要紀錄。\n《我是陳派派》是小公視（公視兒童台）出品，由黃勻弦導演、唐治中製片，與旋轉犀牛原創設計工作室組成的團隊共同製作。得獎的是第6集《我要放颱風假！》，該集內容講述10歲女孩陳派派，在颱風逼近時滿心期待學校停課的故事。\n日本賞評審團稱讚，這部動畫透過一名個性自我中心的主角，帶領觀眾經歷如雲霄飛車般的情緒起伏，並在過程中學習同理心及自我反思。\n《我是陳派派》製作團隊在facebook分享定格動畫製作花絮。\n優秀作品獲多國肯定\n除了今次獲得日本賞兩項大獎，《我是陳派派》上月前也在台灣第61屆金鐘獎獲得動畫節目獎、節目類美術設計獎及節目類聲音設計獎三項肯定，另外還獲得2026年新加坡國際兒童影展評審團特別獎、入圍西班牙ANIMA科爾多瓦國際動畫影展動畫影集競賽，以及STOPTRIK國際定格動畫展兒童競賽。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c32454cea2f","title":"港口通、绿电足、智能普惠：深圳APEC交出开放创新高分答卷","url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075603.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳成为继上海、北京之后中国APEC第三城，其所代表的开放联通与创新效率…","从港口航线到清洁电力，从产业对接到智能应用，亚太合作在每一次靠港启航、每一度绿电流转…"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T19:40:37+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳成为继上海、北京之后中国APEC第三城，其所代表的开放联通与创新效率，彰显出亚太合作的韧性与活力。\n\n从港口航线到清洁电力，从产业对接到智能应用，亚太合作在每一次靠港启航、每一度绿电流转、每一项技术落地之中。APEC不是少数经济体的先行游戏，而是各成员共同参与的能力提升与生态共建。开放、创新、合作，亚太共同体建设就在这条联通与共享的航线上向前延伸。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/20/e2355fad-7428-44df-adf4-5ed28131d4a3.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ce709e3e73e","title":"死囚伏法｜德州70歲罪犯注射戊巴比妥鈉 「反覆哀號」63分鐘才斷氣","url":"https://www.stheadline.com/realtime-world/3639403/死囚伏法德州70歲罪犯注射戊巴比妥鈉-反覆哀號63分鐘才斷氣","summary":"美國德州一名70歲死刑犯丹尼斯（Reinaldo Dennes）於當地19日伏法，行刑過程長達63分鐘，期間他反覆哀號喊痛、高聲呼叫上帝，現場記者形容，這是他看過「最不尋常的一次死刑」。","summary_short":"美國德州一名70歲死刑犯丹尼斯（Reinaldo Dennes）於當地19日伏法，行刑過程長達63分鐘…","digest":"美國德州一名70歲死刑犯丹尼斯（Reinaldo Dennes）於當地19日伏法…","points":["美國德州一名70歲死刑犯丹尼斯（Reinaldo Dennes）於當地19日伏法…","《每日郵報》報道，丹尼斯當晚約6時被固定在推車上…","相關新聞：注射死刑失敗｜女死囚首開腔 稱四肢喉嚨持續痛楚：不知未來如何"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T19:38:01+08:00","size":1,"keywords":[],"body":"美國德州一名70歲死刑犯丹尼斯（Reinaldo Dennes）於當地19日伏法，行刑過程長達63分鐘，期間他反覆哀號喊痛、高聲呼叫上帝，現場記者形容，這是他看過「最不尋常的一次死刑」。\n《每日郵報》報道，丹尼斯當晚約6時被固定在推車上，行刑人員失敗好幾次才找到合適的靜脈注射部位，在左腳及頸部左側各插入一支針，注射致死劑量的戊巴比妥鈉（pentobarbital）。\n相關新聞：注射死刑失敗｜女死囚首開腔 稱四肢喉嚨持續痛楚：不知未來如何\n一開始注射丹尼斯便大叫：「好痛！來吧！來吧！」並不斷呼喊：「天父啊，帶我走，不要讓我受苦。」他說右腿如抽筋般劇痛，接着發出一陣悶哼後逐漸沉寂，晚上7時8分才宣告死亡。\n不過，德州刑事司法部發言人埃爾南德斯（Amanda Hernandez）表示，行刑程序完全依規定執行，並暗示丹尼斯喊痛時可能有所誇大，「他在藥物還沒開始注射前就喊痛，而且他說會痛的部位根本扎針。」\n相關新聞：美田納西女死囚行刑細節曝光 曾痛喊「手臂像快要爆開」\n丹尼斯於1996年謀殺休士頓鑽石商人蘇克斯（Janos Szucs），警方發現蘇克斯陳屍辦公室，保險箱清空，逾20萬美元（156.8萬港元）現金與鑽石不翼而飛。當年在案中中槍的保安員科普蘭（David Copeland）數年前離世，遺孀親眼見證行刑後表示：「正義終於在30年後到來。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cac76971403","title":"一名日本人在上海被拘留 涉使其同胞死亡","url":"https://www.stheadline.com/realtime-world/3639390/一名日本人在上海被拘留-涉使其同胞死亡","summary":"日本駐上海總領事館20日證實，上海市18日發生涉及日本公民的命案，一名日本人死亡，另一名日本人被拘留。","summary_short":"日本駐上海總領事館20日證實，上海市18日發生涉及日本公民的命案，一名日本人死亡，另一名日本人被拘留。","digest":"日本駐上海總領事館20日證實，上海市18日發生涉及日本公民的命案，一名日本人死亡…","points":["日本駐上海總領事館20日證實，上海市18日發生涉及日本公民的命案，一名日本人死亡…","命案發生於18日，中國當局翌日通知總領館，總領館20日與被拘留的日本公民會面","總領事館未透露死者或被拘留日本公民的年齡、性別或事件詳情，但表示將「繼續與相關地方當局合作…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T19:08:21+08:00","size":1,"keywords":[],"body":"日本駐上海總領事館20日證實，上海市18日發生涉及日本公民的命案，一名日本人死亡，另一名日本人被拘留。 據報道，命案發生於18日，中國當局翌日通知總領館，總領館20日與被拘留的日本公民會面。 總領事館未透露死者或被拘留日本公民的年齡、性別或事件詳情，但表示將「繼續與相關地方當局合作，並從保護日本公民的角度做出適當回應」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c967081c610","title":"美官员披露：美国已为伊朗战事花费超480亿美元","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735436.shtml","summary":"中新网11月20日电 美国国防部官员19日表示，截至11月13日，美国对伊朗战事的花费估计已升至483亿美元。","summary_short":"中新网11月20日电 美国国防部官员19日表示，截至11月13日，美国对伊朗战事的花费估计已升至483亿美元。","digest":"美国国防部官员19日表示，截至11月13日…","points":["中新网11月20日电 美国国防部官员19日表示，截至11月13日…","这一数字不包括中东地区美军基地遇袭的损失，目前，国会议员正敦促五角大楼公布相关数据","同日，美国总统特朗普在接受记者采访时说，他不会在新年到来前“仓促”决定对伊朗的下一步行动"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T18:55:18+08:00","size":1,"keywords":[],"body":"中新网11月20日电 美国国防部官员19日表示，截至11月13日，美国对伊朗战事的花费估计已升至483亿美元。这一数字不包括中东地区美军基地遇袭的损失，目前，国会议员正敦促五角大楼公布相关数据。同日，美国总统特朗普在接受记者采访时说，他不会在新年到来前“仓促”决定对伊朗的下一步行动。\r\n\n　　美军基地遇袭损失仍待公布\n\n　　据美国国防部预算官员阿瑟·米勒19日提供的战事总体费用估算，美国对伊朗战事的花费估计已升至483亿美元。其中包括军事行动开支，以及补充军事装备和弹药的费用。\n\n　　此前，美国国会预算办公室曾通报，截至8月1日，美国对伊朗军事行动已花费约380亿美元。与这一数字相比，最新公布的战事开支增加约103亿美元。\n\n　　值得注意的是，上述483亿美元并不包括中东地区美军基地遭袭造成的损失。随着相关问题受到更多关注，要求五角大楼公布损失评估的呼声也日益高涨。多名议员要求国防部公开伊朗通过导弹和无人机袭击美国在中东地区军事基地所造成的损失估算。\n\n　　此前，美国《华尔街日报》10月30日报道称，据了解相关情况的美国官员透露，五角大楼单独估算的美军基地损失至少为50亿美元。另一名了解相关成本情况的人士则表示，这一数字可能高达150亿美元。\n\n　　战事开支成国会争论焦点\n\n　　美联社指出，这场战争的代价已成为美国国会中争议的焦点，围绕战争成本的辩论日益激烈。\n\n　　本周，马萨诸塞州民主党籍参议员伊丽莎白·沃伦在美国代理海军部长高雄的海军部长提名确认听证会上，就战争开支问题对其进行了质询。\n\n　　沃伦援引独立机构估算和媒体报道指出，美国实施海上封锁每天耗资约3250万美元，而伊朗袭击美国海军位于巴林的地区总部，至少造成4亿美元损失。\n\n　　报道称，高雄证实了海上封锁的费用，但表示无法提供在巴林设施受损情况的全面评估，因为“那里是无法进入的禁区”。\n\n　　美媒进一步指出，伊朗战事及其经济影响，已成为导致共和党在中期选举中惨败的原因之一，预计明年1月民主党接掌国会后，围绕这场冲突及其财政成本的争论还将进一步升级。 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c29eb0b8d57","title":"克里米亚大桥遭袭 普京发声","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735429.shtml","summary":"中新网11月20日电 综合俄媒报道，俄罗斯总统普京19日表示，俄方此前曾评估与有关方面就海上停火及停止攻击能源设施举行谈判的可能性，但克里米亚大桥再次遭袭后，俄方不会就此进行谈判。","summary_short":"中新网11月20日电 综合俄媒报道，俄罗斯总统普京19日表示，俄方此前曾评估与有关方面就海上停火及停止攻击能源设施举行谈…","digest":"综合俄媒报道，俄罗斯总统普京19日表示…","points":["中新网11月20日电 综合俄媒报道，俄罗斯总统普京19日表示…","据俄罗斯总统网站消息，在回应关于克里米亚大桥近日多次遭袭及受损情况的提问时，普京回应称…","乌克兰总统泽连斯基17日上午在社交媒体发文证实，乌国家安全局和军方使用多款无人机和“海王星”…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T18:53:40+08:00","size":1,"keywords":[],"body":"中新网11月20日电 综合俄媒报道，俄罗斯总统普京19日表示，俄方此前曾评估与有关方面就海上停火及停止攻击能源设施举行谈判的可能性，但克里米亚大桥再次遭袭后，俄方不会就此进行谈判。\n\n　　据俄罗斯总统网站消息，在回应关于克里米亚大桥近日多次遭袭及受损情况的提问时，普京回应称，克里米亚大桥是民用设施，俄方从未通过该桥运输军事装备和弹药，也没有通过该桥运输石油及石油制品。\n\n　　普京还表示，俄方将对袭击作出回应，且力度将比乌方对克里米亚大桥的攻击更大。\n\n　　据俄媒报道，克里米亚大桥16日至18日连续三天遭到乌军袭击，致使大桥交通受到影响。\r\n\n　　乌克兰总统泽连斯基17日上午在社交媒体发文证实，乌国家安全局和军方使用多款无人机和“海王星”导弹对克里米亚大桥的公路和铁路设施实施了打击。\n\n　　克里米亚大桥连接克里米亚半岛和俄罗斯克拉斯诺达尔地区，全长19公里，由公路桥和铁路桥组成。公路桥于2018年5月开通，铁路桥于2019年12月开通，普京均出席了开通仪式。 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c587e1e4c8f","title":"多国嘉宾合肥共话全球数智合作新图景","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735351.shtml","summary":"中新社合肥11月20日电(记者 张俊)以“智联世界：共绘发展合作新图景”为主题的2026“看中国 听世界”论坛20日在安徽省合肥市开幕，多国嘉宾围绕人工智能全球共享合作展开对话。","summary_short":"中新社合肥11月20日电(记者 张俊)以“智联世界：共绘发展合作新图景”为主题的2026“看中国 听世界”论坛20日在安…","digest":"以“智联世界：共绘发展合作新图景”为主题的2026“看中国 听世界”论坛20日在安徽…","points":["中新社合肥11月20日电(记者 张俊)以“智联世界…","中共中央对外联络部部长刘海星说，中方认为，世界繁荣稳定同贫者愈贫、弱者愈弱根本相悖…","人工智能的未来，不应是少数国家、少数人的福利，全球南方国家不应也不能成为被人工智能冷落的孤岛…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:45:08+08:00","size":1,"keywords":[],"body":"中新社合肥11月20日电(记者 张俊)以“智联世界：共绘发展合作新图景”为主题的2026“看中国 听世界”论坛20日在安徽省合肥市开幕，多国嘉宾围绕人工智能全球共享合作展开对话。\n\n　　中共中央对外联络部部长刘海星说，中方认为，世界繁荣稳定同贫者愈贫、弱者愈弱根本相悖，数智技术应是造福全人类的国际公共产品。人工智能的未来，不应是少数国家、少数人的福利，全球南方国家不应也不能成为被人工智能冷落的孤岛，人工智能应是惠及全球各国人民的福音。今年7月，世界人工智能合作组织在上海成立。中方愿同各方一道，依托世界人工智能合作组织，共同加强数智能力建设，弥合数智鸿沟，促进可持续发展。\n\n　　罗马尼亚前副总理兼外交部长阿德里安·塞韦林表示，中国在人工智能领域发展迅速，并将AI搭成一座人人能走的桥，让每个国家的民众都能跨过河，拿到实实在在的收益，这样的能力让世界惊叹。\n\n　　尼泊尔前副总理施雷斯塔说，今天没有任何一个国家能独自发展，在基础设施、人工智能等领域，坚持国与国之间、区域之间、多边框架下的合作是十分重要的。\r\n\n　　汤加前首相艾萨克·埃凯表示，中国帮助汤加建起风电场，提供医疗与灾害预警支持，百余名汤加学生正在中国留学，“希望更多汤加青年来中国学习，把知识和技术带回去”。\n\n　　西班牙《环球视野》网刊专栏作家巴勃罗·苏洛阿加多次来到中国。他表示，中国正从什么都能造的地方变成处处都在创新的地方。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c40974a19ab","title":"28名外籍人士安徽讲述“第二故乡”","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735345.shtml","summary":"中新网合肥11月20日电(江婉琪)“我的爷爷奶奶到老挝定居已经有50多年了，他们一直很想念中国，今天我又来到了这里。","summary_short":"中新网合肥11月20日电(江婉琪)“我的爷爷奶奶到老挝定居已经有50多年了，他们一直很想念中国，今天我又来到了这里。","digest":"“我的爷爷奶奶到老挝定居已经有50多年了，他们一直很想念中国，今天我又来到了这里","points":["中新网合肥11月20日电(江婉琪)“我的爷爷奶奶到老挝定居已经有50多年了…","”来自老挝的陈德20日在合肥说","当天，第四届外国人讲安徽故事大赛复赛在安徽合肥举办，28名国际友人同台竞技…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:44:12+08:00","size":1,"keywords":[],"body":"中新网合肥11月20日电(江婉琪)“我的爷爷奶奶到老挝定居已经有50多年了，他们一直很想念中国，今天我又来到了这里。”来自老挝的陈德20日在合肥说。\n\n　　当天，第四届外国人讲安徽故事大赛复赛在安徽合肥举办，28名国际友人同台竞技，以声为媒讲述安徽见闻。\n\n复赛现场。江婉琪 摄\n\n　　陈德的爷爷奶奶都是中国人。他说，小时候常听他们讲中国故事、唱《茉莉花》。“中国是你们的故乡，这里也是我的故乡。”陈德会把在安徽的所见所闻写信记录下来，“我想让更多东南亚的朋友看到安徽发展的面貌。”\n\n　　本届大赛自2026年9月启动以来，共有来自德国、法国、英国、智利等40个国家的192名外籍人士报名参加，参赛群体包括外籍教师、外籍员工、留学生、企业高管等。\n\n　　刚来中国时，来自俄罗斯的嘉娜常常想家。她说，黄山让她想起俄罗斯的高加索山，淮河的平静让她想起波罗的海，“来到安徽，随处都能找到家乡的身影。”\n\n　　来自缅甸的许家声是中国科学技术大学的学生。在他的视频里，无人驾驶车辆和无人机正在骆岗公园里运行。他分别用缅甸语、汉语、英语讲述了同一件事：“科技不只是出现在虚拟网络当中，在现实世界也已触手可及。”\n\n　　复赛期间，选手们深入合肥骆岗公园、明珠广场等科技创新场景和特色文旅街区，了解人工智能、低空经济等发展情况。最终共有12名选手晋级汉语组决赛。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7fca8780d1","title":"最萌除草員｜東京JR四谷站山羊太勤力 1.5月吃光900平方米雜草提早下班","url":"https://www.stheadline.com/realtime-world/3639352/最萌除草員東京JR四谷站山羊太勤力-15月吃光900平方米雜草提早下班","summary":"位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草，在減少噪音、廢物污染兼保護史跡。","summary_short":"位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草，在減少噪音、廢物污染兼保護史跡。","digest":"位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草…","points":["位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草…","原本預計工作至下個月，但兩隻山羊非常勤力，1.5個月已吃光雜草，宣布提早下班","這塊草皮位於四谷站赤坂大廳下方，面積約900平方米，屬於國家指定史跡「江戸城外堀跡」一部分…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:40:14+08:00","size":1,"keywords":[],"body":"位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草，在減少噪音、廢物污染兼保護史跡。原本預計工作至下個月，但兩隻山羊非常勤力，1.5個月已吃光雜草，宣布提早下班。\n這塊草皮位於四谷站赤坂大廳下方，面積約900平方米，屬於國家指定史跡「江戸城外堀跡」一部分，平時不對外開放。\n10月9日，JR東日本鐵路公司宣布展開一項實驗，「聘請」兩隻年幼白山羊擔當「環保除草員」，嘗試用最自然的方式除草。「受聘除草員」分別是1 歲雄山羊「小凪」（Nagi）與2歲雌山羊「波可（ポッケ，Pokke）」。\n官方原本預計小山羊可在今年內完成工作，11月20日表示牠們工作非常勤快，已差不多把雜草吃光，可以在12月1日提早收工。\n兩隻山羊「完約」後，將返回神奈川縣厚木市的租賃公司過冬，預計「環保除草員」明年3月至5月再次出動，但不確定是否繼續用這兩隻山羊。\n據報，用山羊除草是JR四谷站基層鐵路員工的提議。相比起傳統割草機，山羊不會產生噪音，可減少碳排放，吃完還幫忙消化，免除收集、運送、焚化廢棄草料的功夫，極具循環經濟效益。此外，該處屬於城跡範圍，山羊天然除草比較不怕破壞遺址。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c571fbf7f88","title":"美國探測器「航行者1號」運行近50年 抵達距離地球一光日位置","url":"https://news.tvb.com/tc/1207462-美國探測器航行者1號運行近50年抵達距離地球一光日位置","summary":"美國太空總署(NASA)確認，距離地球最遠的深空探測器「航行者1號」，已飛越一光日的里程碑，即是光在24小時傳播的距離。","summary_short":"美國太空總署(NASA)確認，距離地球最遠的深空探測器「航行者1號」，已飛越一光日的里程碑，即是光在24小時傳播的距離。","digest":"美國太空總署(NASA)確認，距離地球最遠的深空探測器「航行者1號」…","points":["美國太空總署(NASA)確認，距離地球最遠的深空探測器「航行者1號」，已飛越一光日的里程碑…","「航行者1號」1977年9月發射升空，原定
