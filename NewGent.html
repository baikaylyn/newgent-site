<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M5 4.5h10a2.5 2.5 0 0 1 2.5 2.5v12.5H5z"/>
        <path d="M8 9h6M8 12.5h6M8 16h4"/>
      </svg>
      <span>新闻</span>
    </button>
    <button class="tab" data-mod="live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.6"/>
        <path d="M7.6 7.6a6.2 6.2 0 0 0 0 8.8M16.4 7.6a6.2 6.2 0 0 1 0 8.8"/>
        <path d="M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/>
      </svg>
      <span>直播</span>
    </button>
    <button class="tab" data-mod="radio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="8.5" width="18" height="11.5" rx="2.2"/>
        <path d="M16.4 4.2 7.6 8.5"/>
        <circle cx="8.2" cy="14.2" r="2"/>
        <path d="M14 12.6h4M14 16h4"/>
      </svg>
      <span>电台</span>
    </button>
    <button class="tab" data-mod="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.9"/>
        <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.8 5.8l1.5 1.5M16.7 16.7l1.5 1.5M18.2 5.8l-1.5 1.5M7.3 16.7l-1.5 1.5"/>
      </svg>
      <span>设置</span>
    </button>

      "title": "习近平在亚太经合组织第三十三次领导人非正式会议上的讲话（全文）",
      "url": "https://www.chinanews.com.cn/gn/2026/11-19/10734521.shtml",
      "summary": "新华社深圳11月19日电  建设亚太共同体，续写“亚太奇迹”新篇章  ——在亚太经合组织第三十三次领导人非正式会议上的讲话  (2026年11月19日…",
      "summary_short": "新华社深圳11月19日电  建设亚太共同体，续写“亚太奇迹”新篇章  ——在亚太经合组织第三十三次领导人非正式会议上的讲…",
      "digest": "习近平在亚太经合组织第三十三次领导人非正式会议上的讲话（全文）",
      "points": [
        "新华社深圳11月19日电",
        "建设亚太共同体，续写“亚太奇迹”新篇章",
        "中华人民共和国主席 习近平"
      ],
      "section": "內地",
      "category": "內地",
      "source": "chinanews_china",
      "source_display": "中新網 時政",
      "published_at": "2026-11-19T10:27:26+08:00",
      "size": 10,
      "keywords": [],
      "body": "新华社深圳11月19日电\n\n建设亚太共同体，续写“亚太奇迹”新篇章\n\n——在亚太经合组织第三十三次领导人非正式会议上的讲话\n\n(2026年11月19日，深圳)\n\n中华人民共和国主席 习近平\n\n各位同事：\n\n　　很高兴同大家相聚在美丽的深圳，共谋亚太合作大计。\n\n　　30多年前，亚太经合组织应运而生，开启了建设亚太共同体的壮阔历程。30多年来，亚太地区面貌日新月异，创造了经济快速发展的“亚太奇迹”。\n\n　　当前，世界百年变局加速演进，科技创新和产业创新方兴未艾。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　——建设亚太共同体，要坚持和衷共济。浩瀚的太平洋承载千帆、滋养万物，造就了亚太地区兼收并蓄、和合共生的磅礴气象。亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，携手应对困难和挑战，持续培育共同体意识。\n\n　　——建设亚太共同体，要坚持开放融通。开放合作是亚太发展振兴的必由之路。要秉持开放的区域主义，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局。倡导自由开放的贸易和投资，打通要素流动堵点，畅通经济循环经脉，为亚太经济增长开拓更广阔空间。\n\n　　——建设亚太共同体，要坚持开拓创新。创新是引领发展的第一动力。要鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境。发扬进取精神，放大亚太经合组织孵化器作用，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。\n\n　　——建设亚太共同体，要坚持包容发展。亚太经济体多样性突出，发展诉求各异。要因势利导推进合作，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。\n\n　　各位同事！\n\n　　中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n\n　　第一，强化经贸支柱。亚太自由贸易区是亚太经合组织成员的共同愿景，要稳步向前推进，打造更高水平的开放格局。要推动区域经贸协定对接，提升贸易投资便利化、数字化水平，减少贸易投资壁垒。围绕亚太自贸区加强政策对话，开展经验交流和技术合作，提高各方参与高水平经贸安排的能力。\n\n　　第二，升级联通支柱。互联互通是区域经济一体化的纽带。2014年，我们共同制定亚太经合组织互联互通蓝图。今天，区域互联互通迎来新的机遇。要巩固“硬联通”，完善基础设施网络，推动智慧海关、智慧交通建设。增强“软联通”，促进政策和监管协调，深化跨境支付合作，维护产业链供应链稳定畅通。密切“心联通”，便利商旅和人员往来，促进人文交流和民众相知相亲。\n\n　　第三，打造创新支柱。数字经济和人工智能是创新增长的引擎。要加强数字基础设施建设，完善区域数据治理和协同合作，实现高效、便捷、安全的跨境数据流动。打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n\n　　第四，夯实发展支柱。面对层出不穷的全球性挑战，要加强能力建设，推动区域能源和粮食安全合作，深化跨境腐败治理。推动资源、环境、人口协调发展，加大自然资源合理利用和保护，拓展绿色低碳合作，实现经济可持续增长。支持改善民生和投资于人，实施健康老龄化行动，促进就业和职业技能开发，支持妇女经济赋权和青年人才交流，释放亚太人才活力。\n\n　　亚太是中国安身立命之所。中方将始终如一支持亚太合作。我宣布，中方将提供2000万美元，资助开展亚太经合组织务实合作。中方将在深圳设立亚太共同体研究中心，开展政策研究和交流，提供智力支撑。中方将立足亚太合作，在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。\n\n　　各位同事！\n\n　　深圳又名“鹏城”。期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。\n\n　　谢谢大家。 【编辑:李岩】",

      "body": "國家主席習近平，美國總統特朗普和俄羅斯總統普京，今日下午會在深圳首度舉行三方會談，可能涉及俄烏戰事及伊朗局勢。俄方指三國元首會晤，可樹立對話溝通的典範。有分析認為三方意圖不同，其象徵意義大於實際內容。\n\n國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間，先舉行中美雙邊會談，再跟俄羅斯總統普京在南山區麒麟山莊，首次出席備受矚目的三方會談。外界預計三國元首將討論俄烏戰爭、伊朗局勢及裁減核武等議題。\n\n俄羅斯總統新聞秘書佩斯科夫稱，預計三方會談不會超過1小時，並形容三國元首在探討最棘手問題方面，將樹立起對話溝通的典範。俄羅斯總統助理烏沙科夫有另一說法，他指三國元首自行決定討論持續多久，若討論得非常投入，恐怕沒有人能打斷他們。\n\n美聯社及路透社引述學者分析稱，中美俄各有所圖，特朗普試圖藉裁減核武等議題，將習近平拉到談判桌上；普京就希望趁機提升外交地位，推動有利俄方的戰爭解決方案；中方則營造「調解人」形象，估計三方會晤，象徵意義大於實際內容。\n\n烏克蘭外長西比哈敦促中美元首向普京施壓，要求俄方結束俄烏戰爭。西比哈認為此舉符合全球國家利益和公平性，又希望會談避免令普京，誤以為世界回歸到大國瓜分勢力範圍的時代。\n\n至於中美雙邊會談，有學者指雙方在貿易、技術或其他議題，未必取得重大突破，中美亦拒絕放棄有關管制稀土出口等談判籌碼，不排除中美雙方追求較現實目標，例如維持貿易休戰，管控分歧避免雙邊關係惡化等。\n\n路透社亦引述三名知情者稱，特朗普政府正考慮要求美國企業，若有使用中國人工智能AI模型，必須披露使用情況。原因之一是中國AI模型正快速擴大影響力，美方此舉可減少國內企業依賴中國AI技術。",

      "body": "本屆APEC會議是深圳建市近半世紀以來最矚目的外交盛事，亞太多個經濟體領導人昨抵埗後，隨即到深圳市內各處「打卡」，其中澳洲總理阿爾巴尼斯現身羅湖的萬象城超市，考察澳洲龍蝦在華銷情。智利總統卡斯特則現身深圳街頭水果店。俄羅斯總統普京昨日為大會致辭時，點讚深圳具備「舒適的城市環境和創新的生產基地」，是「最現代化、最具活力的大都市之一」。\n澳總理逛超市試吃家鄉和牛\n據了解，許多參加APEC的政商界都是首次踏足這個中國南方城市。據羅湖官方公眾號報道，昨午不少深圳市民稱，在羅湖深圳萬象城Ole超市偶遇澳洲總理阿爾巴尼斯。適逢「澳洲生活季」活動在此舉行，代表團一行現場了解澳洲原產和牛、南澳岩龍蝦、紅酒、水果等農副生鮮食品的情況。「總理（阿爾巴尼斯）本人逛了好一會兒，還在現場試吃了一小份澳洲和牛，並讚揚其『非常美味』！」市民說。\n相關新聞：深圳APEC｜歡迎晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n中澳關係曾在疫情期間關係惡劣，中方限制澳洲龍蝦、紅酒等進口中國。直至2022年阿爾巴尼斯工黨政府上台後，關係逐步緩和，禁令也隨之解除。\n阿爾巴尼斯昨在個人社交媒體寫道：「讓澳洲產品走出國門、擺上海外貨架，能為國內創造就業機會。中國是我們最大的客戶。自我們當選以來，我們已恢復了價值超過200億澳元的對華貿易。但在擴大貿易方面，我們仍有進一步提升的空間。」\n相關新聞：深圳APEC｜「限韓令」影視、觀光等規定鬆綁 韓中FTA服務投資談判達協議\n智利總統首來華現身水果店\n智利總統卡斯特昨晨抵達深圳，是今年3月就任以來首次來華。昨早他攜夫人現身水果連鎖店「百果園」的全國首店—深圳福華店。一台中國機械人為這位遠道而來的客人送上一箱車厘子。中國目前是智利車厘子最大的出口目的地，每年進口量約佔智利車厘子出口總量的9成。\n俄羅斯總統普京昨在APEC工商領導人峰會上說，此次APEC舉辦地深圳給人留了下深刻印象，「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」",

      "body": "中新社北京11月19日电 (记者 马帅莎)据中国航天科技集团消息，北京时间11月19日6时51分，中国在太原卫星发射中心使用长征二号丁运载火箭，成功将实践二十四号卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。\n\n11月19日，中国在太原卫星发射中心使用长征二号丁运载火箭，成功发射实践二十四号卫星。王亚鹏 摄\n\n　　长征二号丁运载火箭是一型常温液体二级运载火箭，具有可靠性高、经济性好、适应性强等特点，支持单星、多星并联、串联、搭载等多种形式的发射需求，700公里太阳同步轨道运载能力为1.3吨。此次任务是长征系列运载火箭的第678次飞行。\n\n　　实践二十四号卫星由中国航天科技集团五院抓总研制。(完)\n\n 【编辑:何颖】",

      "body": "AM730社評：世界廁所日，香港廁所協會公布今年最佳公廁選舉結果，獲獎前列公廁，多在人流和旅客較少的公園之內，惟整體香港核心商業旅遊區，例如油尖旺和銅鑼灣等地公廁，其實數量不足，往往依靠商場和商店提供給旅客使用。\n\n與其將昂貴公廁成本投放在偏遠地點，政府應反思天價公廁的資源運用，善用市場力量，以協力模式補充核心旅遊區廁所不足，讓公帑用得其所，旅客體驗切實提升。\n\n經濟日報社評：輝達在創辦人黃仁勳辭職後交出亮麗業績，同時宣布停止向華出貨芯片，並成立國安與出口管制委員會。這些舉措除了是企業合規調整，同時是配合美國國會反華鷹派，收緊芯片圍堵，改寫AI生態規則，中美科技戰升級的新開端。\n\n科技戰與貿易戰疊加爆發的系統性風險正在升溫，雙方關係如何維持穩定，備受考驗。中美雙方都承受不起科技戰與貿易戰疊加爆發的風險，雙方需展現政治智慧，將AI競爭限制在技術賽道。",

      "body": "中新社华盛顿11月18日电 (记者 沙晗汀)美国众议院民主党人当地时间18日提名现任众议院民主党领袖哈基姆·杰弗里斯(Hakeem Jeffries)为下届众议院议长候选人。如果最终当选议长，杰弗里斯将成为美国历史上首位非裔众议院议长。\r\n\n　　据美媒报道，众议院民主党人当天举行闭门会议，就众议长提名人选举行表决。杰弗里斯以251票赞成、11票反对的结果获得该提名。投票反对者为民主党中的激进派议员。在明年1月新一届国会就职时，众议院全体议员将投票选出议长人选。\n\n　　杰弗里斯在获得众议长提名后表示，民主党的目标不是“内斗”，而是“努力工作，为美国民众做大事”。\n\n　　在11月3日举行的中期选举中，民主党夺回国会参众两院的控制权。根据美联社统计，民主党在新一届国会众议院中已获得257席，共和党获得171席，目前仍有几个竞争激烈的选区尚未产生最终结果。\n\n　　共和党人11月10日分别选举约翰·图恩和吉姆·乔丹出任该党在下届国会中的参议院和众议院领袖。参议院民主党人将于12月1日投票选出下届国会参议院民主党领袖。(完) 【编辑:曲克】",

          "size": 1,
          "keywords": [],
          "body": "發展局於2024年底提出修訂《建築物條例》，針對沒有遵從強制驗樓、涉及「嚴重僭建物」的業主提高罰則，包括建議引入定額罰款。立法會發展事務委員會下周二討論修例建議，預料政府今日向立法會提交文件介紹詳情，當中擬加重「嚴重僭建物」的罰則，意味即使是有財力的業主，也非只是輕輕罰款了事。\n發展局2024年提修訂建議 嚴重僭建罰30萬元\n本港僭建問題由來已久、錯綜複雜，且並非只限新界或村屋，低密度豪宅亦經常出現非法搭建物，在外牆加建簷篷架等，現實上難以全部處理。政府兩年前提出修訂建議，將僭建物區分為與民生相關的「小型違規工程」，以及「嚴重僭建物」，前者只要證實安全，可較寬鬆處理，後者必須取締。\n2023年一場世紀暴雨，更意外揭發紅山半島多間獨立屋「向下僭建」跟單位面積相若的一層或兩層地下室，令社會譁然，地政總署及屋宇署其後大規模巡查，向違規業主提出檢控。部分業主已被法庭定罪，例如今年1月三幢獨立屋業主因僭建被判處罰款6萬元至13萬元不等。亦有業主因牽涉僭建花園和平台、佔用官地等多宗罪，合共被罰款98萬元，屬同一屋苑案件中刑罰最重。\n當局前年提出修訂《建築物條例》，針對僭建地庫、圍封天台等「嚴重僭建物」，建議從提高罰則至30萬元及監禁兩年，並降低檢控門檻、引入新罪行等，以提升阻嚇力。至於現存的小型僭建物，即未有按小型工程監管制度規定建造的僭建物，考慮到規模較小，並與市民日常生活息息相關，因此建議新增更多「指定豁免工程種類」，即現存的相關工程不再視為「僭建物」，包括指定高度以下的可收合遮篷和晾衣架等。\n民生相關輕微僭建物規範化\n因應去年發生宏福苑大火，政府決定擴大檢視《建築物條例》修訂工作，除改革對樓宇大維修規管、對業界違規加強懲處，亦務實處理僭建這個老大難問題。據悉，發展局最快今日向立法會發展事務委員會提交修例建議文件，下周二討論。\n據了解，當局建議對於風險程度低、與一般民生日常相關的較輕微僭建物，予以規範化；至於嚴重個案，則加強執法及懲處，預料罰則比兩年前提出的建議有稍為調整，總體是比目前罰則增加以倍計。\n議員倡罰則按物業價值計算\n發展事務委員會主席林筱魯認同修例大方向，若輕微僭建物無即時危險，可規範處理，而針對嚴重僭建物應加重罰則，提高阻嚇力，又直言過往司法機構對僭建處理較為「輕手」。他認為，日後針對嚴重僭建物罰款，可一併考慮物業價值，即樓價越高罰則越重，或設立「最低消費」，增加阻嚇力。至於如何釐清「嚴重僭建物」定義，林筱魯指，考慮因素包括是否影響公共安全，例如在旺區舊樓僭建，風險明顯較大。\n補地價換僭建物合法存在？政府不讓步\n近年政府面對財赤，坊間不乏有建議容許業主在申報後透過補地價方式處理，以換取僭建物合法存在，不過僭建物本質屬違法，若然「用錢搞掂」，法理上肯定說不過去，據悉政府在這方面不會讓步。\n政府兩年前曾建議引入新罪行，針對過去有業主辯稱僭建物並非由其搭建，而是購入物業時已存在，自己只是繼承前業主搭建的僭建物，以規避法律責任。林筱魯認為，「不知情」不能成為逃避法律責任的理由，而當中也可能涉及不同情況，例如圖則不清晰、買賣雙方及相關專業人士是否有責任，審議時亦須仔細討論。\n過往僭建問題時被質疑執法力度不足，又甚少重罰規違規業主，今次政府決定大幅提高罰則，從嚴執法，向違規者釋出並非「有錢大晒」的訊息，相信可收阻嚇作用。\n\n聶風",

          "body": "一股強烈東北季候風正影響廣東沿岸。同時，一道雲帶覆蓋華南。本港方面，今早多處地區氣溫較昨日低三至四度左右。\n本港地區今日天氣預測，大致多雲，有一兩陣微雨，天氣顯著轉涼。日間最高氣溫約22度。晚上市區氣溫下降至午夜最低約18度，新界再低兩三度。吹和緩至清勁偏北風，離岸及高地間中吹強風。\n展望明日有幾陣雨，氣溫進一步下降至市區最低約15度，新界再低兩三度。星期六漸轉天晴，但早上仍然相當清涼。隨後一兩日雲量增多，風勢頗大，氣溫稍為回升。\n分區氣溫\n九天天氣預報\n受強烈東北季候風及一道雲帶影響，華南地區今明兩日顯著轉涼，未來一兩日廣東沿岸相當清涼，內陸地區早晚寒冷。隨著覆蓋廣東的雲帶在週末轉薄，該區日夜溫差較大，早上仍然相當清涼。預料一股達強風程度的偏東氣流會在下週初影響華南沿岸，該區雲量增多，氣溫稍為回升。而另一股東北季候風會在下週中期影響華南，該區氣溫將再度下降及有幾陣雨。",

          "body": "「香港冬日小鎮」即日起展開，今年首度擴展至中環、尖沙咀及銅鑼灣三個地點。\n\n在中環皇后像廣場花園，高22米的聖誕樹傍晚起亮燈，閃閃發光。包括終審法院在內附近九座標誌性建築的外牆，每晚7時至11時都有定時投映。廣場花園就化身成歐陸風格火車站，內有小木屋，還有市集。\n\n吸引不少市民及旅客前來。\n\n海南旅客李小姐說：「燈光很好看，然後還有聖誕樹，然後還有投在這個樓上面的那個投影，很漂亮。氛圍很好，就像一個聖誕小鎮的感覺。」\n\n加拿大旅客Justin說：「很好，這裡的氛圍比加拿大更好，所有燈光和氣氛太好了，這裡效果令人難以置信。」\n\n李先生說：「變美了很多，比去年還有更多東西，我應該會再去尖沙咀那個。」\n\n如果中環冬日小鎮太多人，亦可考慮到銅鑼灣的冬日小鎮，那裡將會打造成精靈村莊，同樣在大廈外牆有光影表演，下周三正式開放。\n\n至於首度舉辨「冬日小鎮」的尖沙咀。聖誕鹿、松鼠等光影圖案亦現身香港文化中心。太空館變成聖誕水晶球三個地點的活動，明年1月5日結束。公眾可以免費入場。",

          "body": "「幻彩詠香江」晚上作告別演出。\n\n踏正晚上8時，有22年歷史的「幻彩詠香江」，特別加添煙火元素作為它的告別作。不少市民在尖沙咀海旁，舉機跟它講再見。\n\n有市民就想更近距離見證，登上觀光船。\n\n張女士說：「最後一次了，我都是第一次那麼認真看，不夠澎湃、都還算可以。」\n\n伍先生說：「我特意買票上來看，氣氛非常好，及在這裡是很接近整個維港。」\n\n最後一次上演的「幻彩詠香江」，跟以往一樣歷時10分鐘，有40多幢大廈參加。在這艘船上除了可看匯演，更可與一班親朋好友吃蛇宴，歌手李龍基都是座上客。\n\n李龍基說：「今天是蛇羹、好東西來的，希望這個(幻彩詠香江)停了後，有更燦爛的東西給我們。」\n\n觀光船營運總監葉定國指，相信單靠維港本身景色，仍能吸引旅客遊覽。",

          "body": "旅發局早前宣布，由2004年1月1日起宣傳香港的旅遊項目「幻彩詠香江」，將迎來告別，今晚（18日）為最後一夜，並預告會特別加設煙火表演。有市民提早個半鐘「霸位」盼可拍攝到畫面。\n攝影愛好者Ainsworth先生已在香港定居10年，知道幻彩詠香江今晚最後一次上演，亦知道今次演出加入了煙火元素，便特意前來記錄畫面。他表示已看過好幾次幻彩詠香江，一直認為表演十分有趣，每當有親友來訪都會推薦他們來看。「尤其如果搭天星小輪時遇上表演，觀賞體驗格外好。」 \n表演晚上8點開始，Ainsworth先生6點半已在尖沙咀海旁架設好攝影設備。他坦言如此早來是希望搶到好觀賞位置，又舉例指除夕倒數煙花匯演時通常會人滿為患，今日正好提早處理好手頭事情，便前來「霸位」，希望今日位置可有良好視野，能讓他準確捕捉表演動態，之後更打算和妻子會合，一同欣賞表演。\n幻彩詠香江一直為香港其中一個特色的，在燈光音樂匯演期間，維多利亞港兩岸都會亮起燈光，參與表演的主要地標包括中環廣場、香港會議展覽中心、美國銀行中心、滙豐總行大廈以及兩座國際金融中心。幻彩詠香江在2005年，獲列入《健力士世界紀錄大全》，成為全球最大型燈光音樂匯演。",

          "body": "中大醫院今年9月為一名45歲病人進行腹腔鏡子宮及雙側輸卵管切除手術期間，錯誤切除雙側卵巢，涉事醫生為婦科腫瘤科專科醫生張德康，他承認事件是「低級錯誤」，已向病人及家屬解釋和道歉。張德康在婦產科專科頗有名氣，有病人向《星島頭條》形容張德康行醫「貼心、窩心」，會代入病人角度思考。\n病人稱張德康常安慰：不要為未發生的事擔憂\n其中一名病人透露，數年前身體出問題，十分徬徨，後來經朋友介紹由張德康醫生主理手術，「佢畀咗好多專業意見，過程中亦經常去提醒及安慰病人，例如我怕痛，佢就提醒我『不要為未發生的事擔憂』。」\n涉事中大醫生張德康。\n該病人憶述，手術後需定期覆診，醫生知道病人心急想知道驗血報告結果，「上午抽血，佢傍晚睇到報告就即刻通知病人，話畀病人聽個指數正常，叫病人放心」，形容對方是好醫生。\n張德康亦經常處理婦科手術，有病人因為曾經剖腹產子，擔心再做手術開刀會留多一條疤痕，張德康當時立即安慰她，「盡量喺上次疤痕附近做，唔會令佢多一條疤痕，結果手術傷口真係做得好好」，稱讚張德康貼心、窩心，會設身處地代入病人角度處理事情。\n相關新聞：\n中大醫院誤切病人卵巢 鍾健禮指涉事醫生直接承認出錯 澄清「認知盲點」即失神 否認語言藝術\n中大醫院誤切病人卵巢｜涉事醫生張德康承認「低級錯誤」：願承擔責任 盡全力照顧病人",

          "body": "香港高級餐飲界迎來震撼消息！香港半島酒店旗下、享譽盛名的米芝蓮星級法國餐廳吉地士（Gaddi's），今日（18日）正式宣佈，將於 2026年12月31日除夕夜 結束後暫停於現址的營業。不過Gaddi's 強調這次不是告別，而是「後會有期」！\n半島2028百年誌慶 法國餐廳吉地士Gaddi's歷史性重塑\n香港半島酒店旗下、享譽盛名的法國餐廳吉地士（Gaddi's）宣佈將於除夕夜後暫停在現址的營業。\n這家陪伴香港人超過大半個世紀的傳奇餐廳，之所以在年底暫別，是為了配合香港半島酒店即將於 2028 年迎來的「百年誌慶」重大翻新工程。作為半島酒店集團旗艦酒店的核心項目，吉地士將會進行全方位重塑。在不久的將來，這間殿堂級餐廳將會在酒店內的新址重塑經典、重新開幕。\n香港半島酒店董事總經理文森（Vincent Pimont）透露，吉地士一直是無數賓客、員工乃至香港市民心中別具意義的慶祝場所。這次的重塑計劃，不僅尊重並傳承近一個世紀以來深受賓客珍視的傳統、工藝與文化底蘊，更致力於為新一代樹立奢華典範。\n1953年開業 被譽為「蘇伊士運河以東最佳餐廳」\n吉地士於 1953 年開業，是香港首家帶領 Fine Dining（精緻餐飲）潮流的法國餐廳。\n追溯歷史，吉地士於 1953 年開業，是香港首家帶領 Fine Dining（精緻餐飲）潮流的法國餐廳。一開幕便一鳴驚人，獲得「蘇伊士運河以東最佳餐廳」的極高讚譽。\n在過去的七十多年中，這片優雅的空間見證了無數香港人的重要時刻——求婚、婚禮、家族慶祝，留下無數溫馨笑語。這裡更曾款待過無數國家元首、顯赫貴賓，荷里活巨星奇勒基寶（Clark Gable）和伊莉莎白泰萊（Elizabeth Taylor）均曾是座上客，賓客名冊星光熠熠。\n事實上，這並非吉地士歷史上首次搬遷。早在 1978 年，餐廳就曾由地庫遷往一樓的原宴會廳；2000 年更與時並進增設了「主廚餐桌」（Chef's Table）；並在 2020 年首度奪得米芝蓮一星殊榮。每一次的轉變，都讓吉地士的傳奇更上一層樓。\n吉地士 Gaddi's 告別倒數 限定紀念活動陸續登場\n吉地士將照常營業至 2026 年 12 月 31 日。在停業前的這段黃金時間內，餐廳將會舉辦一系列特別慶祝活動，詳情將於酒店的官方社交媒體平台公佈。無論你是想重臨舊地、回味昔日的珍貴時刻，還是希望在現址空間體驗最後的傳奇餘韻，都要把握時間致電或電郵預約，向這個承載七十載光陰的空間深情道一聲「後會有期」。\n\n吉地士（Gaddi's）\n 訂座或查詢：+852 2696 6763\n 地址：尖沙咀梳士巴利道22號香港半島酒店1樓\n\n同場加映：世界第五 亞洲第二 Balance哥的招牌空氣春卷 最難訂位餐廳之一 品味極級中菜",

          "body": "名媛蔡天鳳（Abby Choi）疑遭殺害後肢解烹屍案，今日在高等法院展開第40日審訊，前家翁鄺球續出庭作供。鄺球在庭上親自交代案發當日搬運屍體的過程，並承認自己需為蔡天鳳被肢解一事負上全責，但對分屍細節卻稱「唔記得」。不過，他極力撇清兩子的謀殺嫌疑，堅稱事前「無任何人計劃殺害」蔡天鳳，並強調自己案發後亦從未與鄺港智及鄺港傑商討過任何抗辯理由。對於控方質疑其分屍動機，他則聲稱完全是出於想「維護兩個仔」，在當時的處境下覺得這樣做可以幫到他們。\n鄺港智指蔡與鄺球獨處後浴血\n代表前夫鄺港智的大律師安華暉在盤問時指出另一版本案情，質疑案發當日鄺港傑及鄺港智在大尾督停車場曾一度下車，讓鄺球與蔡天鳳在七人車內單獨對話，兩人隨後因蔡天鳳拒絕子女與鄺球見面問題發生激烈爭執，為此惹怒鄺球，兄弟折返時已見蔡天鳳浴血倒地失去知覺。鄺球對此說法表示強烈否認，聲稱兩子當時根本沒有下車，亦未曾發生任何爭執，他到場時已看到蔡天鳳躺臥車上。\n鄺球堅稱，當日將蔡天鳳遺體搬入龍尾村村屋時，自己在大廳對著膠箱發呆思考處理方法，直至「案發翌日才決定分屍」，並非一早預謀。控方資深大律師郭莎樂質疑，長子鄺港傑當晚折返單位時曾目擊浴室刀具有血跡，鄺球隨即辯稱刀只是「用嚟切青紅蘿蔔」，刀上的紅色液體「可能係紅蘿蔔嘅色水」，是長子自己誤以為是血跡。\n相關新聞：\n蔡天鳳碎屍案｜鄺球認對蔡天鳳被肢解負全責 「我企喺度，對住個膠箱呆咗」\n蔡天鳳碎屍案｜鄺球稱為家中每人分配角色 蔡天鳳負責財政與鄺港智研究投資\n蔡天鳳碎屍案｜鄺球稱對兩子一視同仁 否認與鄺港智不和 曾為幼子還款600萬元\n稱蔡天鳳性格因前夫有女友「180度轉變」\n鄺球在庭上自稱「分配晒屋企人所有工作」，為每位家庭成員分配角色，其中妻子李瑞香負責照顧孫兒起居飲食；長子鄺港傑忠心負責支援家中大小事務及打理車輛；蔡天鳳負責家庭財政，接收鄺球從內地匯港的營商利潤，她亦是家中的Banker，「屋企有需要就問Abby攞」；幼子鄺港智自我中心，「負責同Abby構思下有咩生意可以做同投資」。鄺球否認與鄺港智，更透露曾出資600多萬元為幼子賠償盜竊案的事主，強調對兩子一視同仁。不過，鄺球承認曾粗口辱罵蔡天鳳是「生仔機器」，並認為蔡天鳳後期性格出現「180度轉變」，主要是因為她發現了鄺港智在內地有女朋友，而非看不起鄺家。\n相關新聞：\n蔡天鳳碎屍案｜鄺球：因鄺港智「大陸有條女」 蔡天鳳性格180度轉變\n蔡天鳳碎屍案｜鄺球稱煲及砧板等用具均放廚房 事後沒有與兩子商討抗辯理由\n蔡天鳳碎屍案｜鄺港智一方指蔡與鄺球單獨對話後浴血倒地 鄺球稱分屍為維護兩子\n指內地營商賺錢滙款蔡天鳳管理財政買加多利山\n控方在盤問時質疑鄺球所謂的內地營商利潤。前職警長的鄺球堅稱自己在內地營商賺錢，故提早退休，2009年就已滙款到港，2013年蔡天鳳與鄺港智結婚後，就由蔡「負責管錢」。鄺自言，2017至2019年期間，在廣州經營餐飲業時「每個月大約匯30、40萬」給蔡天鳳儲起，包括購入加多利山物業及名車，但他承認無法向法庭提交任何營商或匯款的實質證據。\n控方隨即指出，既然鄺家資金充裕，為何妻子李瑞香在2017年破產時，鄺球完全沒有出資協助還債。鄺球回應「佢自己生意失敗係佢嘅事，同家庭啲錢無關」。此外，當控方提到蔡天鳳與現任丈夫擺酒後獲得可觀財富，並指出譚家因「譚仔米線」生意而極為富裕時，鄺球稱「我都唔知譚家富唔富裕」、「我都唔食米綫嗰啲嘢」。\n相關新聞：\n蔡天鳳碎屍案｜鄺球：李瑞香破產與家庭無關故不助還債 不知譚家富裕「我唔食米綫」\n蔡天鳳碎屍案｜鄺球稱翌日才決定分屍 當晚長子見到刀上紅色液體是紅蘿蔔汁",

          "body": "深夜時分，尖沙咀街頭上演一幕弔詭的「虔誠拜神」奇景！有的士司機在社交平台Threads上載影片，指在尖沙咀金巴利道「維多利亞酒店」外，目擊一名身穿白色上衣、性感短裙的女子，在街頭脫下高跟鞋，雙手合十跪地，旁若無人地「拜天拜地」至少1分半鐘。影片隨即引起網民熱議，不少人打趣稱「今鋪要變揸降魔的」，而警方調查後更揭開這幕「跪拜」背後的搞笑真相。\n脫高踭鞋跪地「拜天拜地」 司機驚呼：揸夜更見到點算？\n根據的士司機上載的影片，涉事地點為尖沙咀金巴利道80號「維多利亞酒店」門外。當時正值深夜，該名短裙女子突然在酒店門外脫下高跟鞋，雙膝跪在行人路上，神情肅穆。她雙手合十，不斷做出拜祭姿勢，甚至「拜天拜地」，過程維持至少1分半鐘。\n從另一角度網民分享的照片可見，該名女子身前有一個已經倒塌及損毀的酒店裝飾雕像。畫面流出後，隨即引來大批網民留言：「揸夜更見到呢啲要點做？」 ，同時亦有其他的士司機打趣指：「今鋪係咪要變咗要揸降魔的了？」不過，有細心的網民留意到損毀的雕像，一語道破真相：「飲大咗（醉酒）唔小心整爛，所以要跪拜賠罪？」\n警方調查揭真相：情侶碰撞釀意外 最終雙方和解\n這宗「深夜靈異事件」最終驚動警員到場。警方表示，於昨日（17日）凌晨1時26分接獲一名35歲女子報案，指她在上址不小心撞到一名42歲男子，導致該名男子意外撞倒並損毀酒店外的雕像。警員接報到場了解，證實純屬一宗意外碰撞事件。據悉，報案女子懷疑在消遣後帶有醉意，不慎撞倒男伴，再連累酒店門外的雕像損毀。女子疑因感到內疚及徬徨，加上幾分酒意，才當街做出令人費解的「跪拜」行為。\n最終男女主角在警員見證下，與酒店協商調解。警方將案件列作「發現財物損毀」處理，事件中無人受傷，亦無人被捕。",

          "body": "四名兼任香港中文大學校董的立法會議員，昨日（17日）向立法會提交聯署文件，建議修訂《香港中文大學條例》。惟草案文本被發現存在多處字眼錯漏，中大校董鄧家彪回應傳媒指，歡迎各界提出修正意見，相信校方會從善如流，在正式提交法案時進一步完善文本。\n擬納高層任免入主體條例\n是次提出修訂草案的四名中大校董兼立法會議員，包括梁進、陳恒鑌、鄧家彪及陳曉峰。根據已提交的立法會CB(3)1413/2026(01)號文件，建議將校長、常務副校長、副校長及行政副校長的聘任與免職程序，正式納入主體條例規管；若相關管理層人員出現行為不檢或效率欠佳等情況，校董會有權將其免職。\n此外，草案亦建議撤銷現有的「校友評議會」，改以「校友顧問委員會」取代。立法會教育事務委員會將於12月4日討論有關議程。\n英文條例名誤寫「The The」 「偽造」變「偽做」\n然而，草案文本公布後，隨即被「中大校政關注組」揭內文出現多處明顯的錯別字。當中包括將「偽造」學歷誤寫為「偽做」學歷，以及將「撤銷」誤寫為「撤鎖」；英文版本的條例標題「The Chinese University of Hong Kong Ordinance」，亦出現「The The」的重複字眼錯誤。\n梁進指文本反覆修改致混亂\n針對文本錯漏問題，鄧家彪接受傳媒查詢時表示，歡迎外界就草案字眼提出修正建議，相信校方會吸納意見，待正式提交法案階段再作修訂完善。另一名身兼校董的立法會議員梁進亦解釋，由於中大方面早前已就草案文本修改逾十至二十次，反覆更正期間或難免出現混亂，將會重新校對及修正。",

          "body": "大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前家翁鄺球作供時承認蔡天鳳被肢解，是由他全權負責，但強調絕對無預謀殺死她。\n\n審訊踏入第40日，蔡天鳳前家翁鄺球繼續作供，他指案發當日下午收到長子鄺港傑電話。告知蔡天鳳沒有意識，弟弟鄺港智則在哭。他叫兒子駕車到大美督會合，之後看到蔡天鳳面向下躺在車內地上，他檢查蔡天鳳呼吸及心跳，認為她已沒有生命跡象，但就見不到她身上有血漬。於是著大家回龍尾村單位集合，他再將蔡天鳳放入膠箱，並叫鄺港傑協助將膠箱搬入屋，之後叫兩名兒子盡快離開。\n\n鄺球形容自己當時也呆了，不知要做甚麼，作供期間鄺球多次哽咽並抹眼淚。其代表大律師戴偉奧問，蔡天鳳被肢解，是他全權負責？鄺球答是，強調與鄺港傑和鄺港智沒關係，但指絕對無預謀殺死蔡天鳳。被問及案發後沒有報警，是否為了保護鄺港智，鄺球回答是。\n\n鄺港智代表大律師盤問鄺球時就質疑他作為前警察，聽到兒子稱有嚴重情況，卻只叫對方到大美督停車場會合，情況不合常理，鄺球回應說，當時未能判斷事件嚴重程度。現在同意，當時蔡天鳳需要醫生和救護車。\n\n主控郭莎樂盤問鄺球，問他是甚麼時候將蔡天鳳肢解？鄺球回答是在案發第二日。對於龍尾村單位樓上住戶，早前供稱當晚聽到切割聲及聞到煲湯氣味。鄺球否認是他發出。\n\n至於鄺港傑早前供稱，案發當晚看到單位內有刀，刀上有血。鄺球稱可能是紅蘿蔔汁，只是兒子以為是血。郭莎樂問鄺球，如何切割蔡天鳳的屍體是否用大煲煮，鄺球就說不記得。\n\n郭莎樂提到鄺港傑作供指，案發當晚鄺球叫他將湯渣扔到垃圾站，見到有骨頭。鄺球回應說，可能是蔡天鳳的骨頭。郭莎樂問，即是當日有切割，鄺球改口說垃圾內沒有骨頭。\n\n至於為何會有青紅蘿蔔，鄺球說以往會餵飼村口，垃圾站旁的流浪貓狗，郭莎樂質疑流浪貓狗只愛吃肉，鄺球就稱曾見過貓狗吃完整包紅蘿蔔。\n\n被郭莎樂問及鄺港傑，當晚是否知情及參與，鄺球否認，指叫他回村屋，只是「想多個人陪我」。郭莎樂又質疑若鄺港傑沒有參與肢解，為何需要穿上水鞋等？鄺球解釋屍體旁可能有血漬，「不想他弄污衣服」。\n\n對於前一日，鄺球在庭上指，14吋大煲是用來種植物，郭莎樂質疑煲底無洞，怎樣種？鄺球說攀藤植物很粗生。\n\n郭莎樂質疑那麼多不尋常物品，都是有計劃的，用來處理及棄置屍體，鄺球不同意。",

          "body": "港大醫學院完成兩宗以組織碎化技術治療初期腎癌的病例，是亞洲首次。病人手術翌日已可出院。\n\n70歲的李先生，早前定期覆診時，發現腎臟有一個約2厘米的腫瘤。由於以往曾動過大手術，一度令他猶豫是否接受手術。\n\n腎癌患者李先生說：「他向我講解這個組織碎化治療，當晚再跟太太商量，決定試一試，因為最主要是無痛。(手術後)推回病房，我感覺自己好像沒發生甚麼，只是小便時有些血塊。」\n\n組織碎化技術治療，是透過控制機械臂，以水作介面，從病人體外發射聚焦超聲波，將癌組織液化破壞。港大團隊與港怡醫院，上月為李先生及另一位71歲女患者，以組織碎化技術，進行亞洲首兩宗初期腎癌治療。團隊指技術精準度高，沒有輻射、不留傷口，病人在手術後短時間可恢復。\n\n港大醫學院臨床醫學學院放射診斷學系名譽臨床副教授劉泳恆說：「還有治療之後，對正常腎臟組織的保存能力，是非常高的，腎臟其他結構例如血管、腎盂，都完全可以保存，將影響腎功能可能性減至最低。」\n\n不過，並非所有患腎癌病人，都適合採用這項技術。\n\n港大醫學院臨床醫學學院外科學系臨床助理教授梁崇禮說：「挑選病例要很小心，選得不好，例如腫瘤很靠近腸臟，或靠近腎血管或腎盂，就擔心會有其他併發症。」\n\n港大醫學院前年引入組織碎化技術後，已處理180宗肝癌及20宗胰臟癌，相信未來應用不局限於初期癌症。\n\n港大醫學院臨床醫學學院外科學系臨床教授陳智仁說：「(組織碎化)安全性和融合性較高，加上其他方案，無論與化療、電療、介入治療、免疫治療，希望達至協同效應，去增加治療效果。」\n\n團隊指，這項技術應用在腎癌仍屬研究階段，目前正招募合適病人參與臨床試驗，會按腫瘤大小及位置，審慎評估風險。",

          "body": "“来了就是深圳人！”\n\n　　11月18日清晨，美国网红博主赛瑞斯·詹森(Cyrus Janssen，中文名“王德中”)在深圳街头用中文读出了这句城市宣传语。在他看来，这句话充分体现了深圳这座城市的魅力。\n\n　　他在社交媒体上写道：\n\n　　深圳和APEC2026的热度实在太高了！今天早晨跑步时，我在路边看到了这样一块标语牌：\n\n　　来了就是深圳人！\n\n　　一旦来到这里，你就永远是深圳人！\n\n　　这是一句非常棒的城市口号，也充分体现了深圳的独特魅力。\n\n　　这座城市的人口平均年龄只有31.5岁(官方数据为32.5岁)。来自中国各地乃至世界各地的人们汇聚于此，充分利用这里全球最完善的供应链体系和科技产业生态。\n\n　　全世界都在关注深圳。很高兴本周能够来到这里，参加这场令人瞩目的盛会！\n\n图片来源：社交媒体截图\n\n　　作者：苏婧欣\n\n 【编辑:李岩】",

          "body": "中新网贵阳11月19日电 (记者 杨茜)苏黔中华职业教育社和职业院校东西部协作共建签约仪式18日在贵州省贵阳市举行。苏黔两地职教社、职业院校共达成六组结对合作，以职业教育为纽带深化山海协作，落实东西部协作部署，携手共育高素质技术技能人才。\n\n图为签约仪式现场。杨茜 摄\n\n　　本次签约中，南京市、淮安市、无锡市中华职教社，分别与贵阳市、安顺市、黔西南州中华职教社结成三对市社协作对子；常州信息职业技术大学、徐州工业职业技术学院、江苏农林职业技术学院，分别与贵州电子信息职业技术学院、毕节工业职业技术学院、黔西南职业技术学院开展校校共建，合作覆盖电子信息、工业制造、现代农业重点产业领域。\n\n　　江苏是近代职业教育发祥地，职教发展水平位居全国前列；贵州正加速从人口大省向人才大省转变，产业升级对技术技能人才需求旺盛。\n\n　　贵州省政协副主席、农工党省委主委、省中华职教社主任张光奇表示，苏黔职教合作从过去点对点帮扶升级为双向赋能的共建模式。期待双方推进订单式人才培养、共建专业课程标准、搭建产教融合实训平台，培育更多“土专家”“田秀才”，把合作打造成东西部协作、统一战线服务高质量发展的示范工程。\n\n　　江苏省委统战部副部长、省中华职教社副主任姜东表示，此次结对重在打造示范样板，务求合作落地见效。江苏方面将发挥产业、企业资源优势，在人才双向流动、学生实习就业、专业共建、产教融合上做实文章，同时邀请贵州职教界赴江苏回访交流，推动合作经验辐射更多地市与院校。\n\n　　苏黔协作根基深厚，多年来江苏持续在人才、产业、教育等领域帮扶贵州。此次签约之后，两地将推动实现人才共育有温度、专业共建有精度、产教融合有深度，把统一战线制度优势转化为职业教育发展效能，为巩固拓展脱贫攻坚成果、助力乡村全面振兴、服务两省高质量发展注入职教力量。(完)\n\n 【编辑:何颖】",

          "size": 1,

          "body": "中新网成都11月19日电 (王利文)“中国将太阳能、风能及储能成本大幅压低，使各国第一次可以同时走向繁荣和绿色。”联合国前副秘书长兼环境规划署执行主任、欧盟亚洲中心联合主席埃里克·索尔海姆在成都如是说。\n\n11月17日，四川成都，出席2026第九届国际光伏与储能产业大会的埃里克·索尔海姆。何美锟 摄\n\n　　11月17日至20日，2026第九届国际光伏与储能产业大会在成都举办，来自海内外的光伏和储能产业领军人物、专家学者汇聚一堂，共话全球光储产业发展新未来。\n\n　　索尔海姆1984年首次到访中国。他观察到，中国近年来在生态环境治理上取得显著进展。在他看来，“绿水青山就是金山银山”，这一理念正转化为现实的经济逻辑。\n\n　　谈及清洁能源成本，索尔海姆表示，约15年前，几乎没有人想到太阳能价格会下降90%，风能与储能电池价格也以类似速度下降。过去，一个国家走向繁荣似乎只有化石能源一条路，如今各国可以同时实现繁荣与绿色。在他看来，可再生能源同时回应三个问题：保护地球、保障各国能源安全、创造本地就业。\n\n　　“21世纪将是光伏主导的世纪。”对于光伏与储能在能源转型中的作用，索尔海姆举例道，太阳能兼具灵活性，既可安装在非洲小屋屋顶供孩童读书照明，也可在青海、新疆铺展成大型“光伏海洋”。在巴基斯坦，居民在屋顶安装太阳能板获取廉价电力；在印度，一些用户以太阳能替代柴油，能源支出明显下降。即便组件从中国进口，安装、并网、能效管理仍主要带动当地岗位。\n\n　　谈到共建“一带一路”，索尔海姆称，“这是当今世界最重要的发展与投资倡议”。他列举肯尼亚蒙内铁路(蒙巴萨至内罗毕)、埃塞俄比亚至吉布提铁路(亚的斯亚贝巴至吉布提)等项目，认为这些通道对当地经济发展至关重要，共建“一带一路”绿色属性进一步凸显。\n\n　　对于应对气候变化，索尔海姆表示，印度尼西亚山火、欧洲今夏热浪等一再提示风险正在加剧。他认为，最有效的应对之道是把气候行动变成商业机会，让国家和企业通过绿色转型获利，才能推动技术规模化。(完)\n\n 【编辑:何颖】",

          "body": "新华社深圳11月19日电(记者邵艺博、熊嘉艺)11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话，强调亚太各方要携手搭建亚太共同体的“四梁八柱”。\n\n　　习近平指出，中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n\n　　一是强化经贸支柱。推动区域经贸协定对接，围绕亚太自贸区加强政策对话，提高各方参与高水平经贸安排的能力。\n\n　　二是升级联通支柱。巩固“硬联通”，完善基础设施网络；增强“软联通”，促进政策和监管协调；密切“心联通”，促进人文交流和民众相知相亲。\n\n　　三是打造创新支柱。加强数字基础设施建设，完善区域数据治理和协同合作，打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n\n　　四是夯实发展支柱。推动区域能源和粮食安全合作，深化跨境腐败治理，加大自然资源合理利用和保护，实现经济可持续增长。 【编辑:叶攀】",

          "body": "新华社深圳11月19日电(记者马卓言、钟焯)11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话。\n\n　　习近平指出，当前，世界百年变局加速演进，科技创新和产业创新方兴未艾。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　建设亚太共同体，要坚持和衷共济。浩瀚的太平洋承载千帆、滋养万物，造就了亚太地区兼收并蓄、和合共生的磅礴气象。亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，持续培育共同体意识。\n\n　　建设亚太共同体，要坚持开放融通。开放合作是亚太发展振兴的必由之路。要秉持开放的区域主义，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局。倡导自由开放的贸易和投资，为亚太经济增长开拓更广阔空间。\n\n　　建设亚太共同体，要坚持开拓创新。创新是引领发展的第一动力。要鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境。放大亚太经合组织孵化器作用，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。\n\n　　建设亚太共同体，要坚持包容发展。亚太经济体多样性突出，发展诉求各异。要因势利导推进合作，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。 【编辑:叶攀】",

          "body": "中新网北京11月19日电 (记者 孙自法)记者从中国空间科学学会获悉，第二届空间科学青年科学家国际论坛11月17日至19日在塞浦路斯首都尼科西亚举行。来自中国、美国、法国、德国、意大利、芬兰、希腊、匈牙利、塞浦路斯、印度、马来西亚等11个国家40余位专家学者和青年科研人员参会，围绕日球层物理和空间地球科学主题开展深入研讨，推动空间科学领域国际合作。\n\n乔治·达诺斯主持论坛开幕式并致辞。中国空间科学学会 供图\n\n　　论坛开幕式环节，塞浦路斯空间探索组织(CSEO)主席乔治·达诺斯(George DANOS)、中国空间科学学会(CSSR)名誉理事长吴季研究员、国际空间研究委员会(COSPAR)秘书长让-克劳德·沃姆斯(Jean-Claude WORMS)代表主办方致辞。\n\n　　乔治·达诺斯认为，太空已成为关乎人类未来发展最为重要的领域之一。当今世界正面临着气候变化、人工智能等全球性挑战。为应对这些共同挑战，开展空间领域国际合作尤为关键。\n\n吴季致辞。中国空间科学学会 供图\n\n　　吴季指出，空间科学是当代自然科学的前沿领域，不断拓展人类的知识疆域。当前，科技全球化深入发展，在空间科学领域开展国际合作，已成为不可阻挡的发展趋势。他期待空间科学领域青年科学家基于本次论坛搭建的学术交流平台，增进理解、建立信任和联系，同时通过与资深专家的对话交流，未来成长为引领学科发展的领军人才。\n\n　　让-克劳德·沃姆斯表示，国际空间研究委员会成立之初，致力于为冷战期间东西方阵营之间的沟通和合作搭建桥梁。本次论坛由塞浦路斯空间探索组织、中国空间科学学会和国际空间研究委员会共同主办，希望促进处于职业早期的空间科学领域青年科学家的交流合作，为未来开展空间科学国际合作奠定基础。\n\n让-克劳德·沃姆斯致辞。中国空间科学学会 供图\n\n　　主旨报告环节，匈牙利航天员久洛·切雷尼(Gyula Cerényi)、吴季研究员、雅典国立卡波季斯特里安大学科斯塔斯·瓦罗佐斯(Costas Varotsos)教授、中国科学院国家空间科学中心施建成研究员、国际空间研究委员会能力建设专家咨询组组长胡安·卡洛斯·加布里埃尔(Juan Carlos Gabriel)博士、南京大学陈鹏飞教授、欧洲空间局计划科学家菲利普·埃斯库贝(Philippe Escoubet)、美国国家航空航天局戈达德航天飞行中心拉里·凯普科(Larry Kepko)教授等8位专家学者应邀作报告，分别就“匈牙利进入太空计划”“中国鸿蒙计划”“从轨道视角洞察地球系统”“中国西藏水循环研究”“关于国际空间研究委员会能力建设的新思考”“太阳爆发关键科学问题”“中欧微笑(SMILE)任务的科学运行”“日球层物理的研究历史、现状和未来”等议题进行分享交流。\n\n　　专题论坛环节，来自日球层物理和空间地球科学领域的青年科学家，通过学术报告深入交流和讨论领域内科学前沿热点、卫星任务取得的最新研究成果等，并对未来开展国际合作进行探讨。\n\n　　随后，青年科学家代表还通过“与专家面对面”环节等，同领域内资深专家进行面对面交流，学习和探讨科研方法，提升学术素养。\n\n　　据悉，空间科学青年科学家国际论坛由中国空间科学学会发起，旨在为全球空间科学领域青年科技人员建立沟通交流平台，增进彼此理解、信任和友谊，密切相互联系，为未来开展联合研究等合作奠定基础。2024年10月，第一届论坛在中国澳门举办。(完)\n\n 【编辑:何颖】",

          "body": "中新网海南琼海11月19日电 题：台企扎根“医疗特区”：海南自贸港政策有吸引力\n\n　　中新网记者 符宇群\n\n　　“我们企业发展最大的优势，就是海南博鳌乐城国际医疗旅游先行区(简称“乐城先行区”)的先行先试医疗特许政策。”颖奕国际医疗中心院长韩海玲向前来参访的海外华文媒体人士如是说。\n\n　　11月18日，来自17个国家的20家海外华文媒体走进乐城先行区，探访扎根于此的这家台资医疗机构，近距离感受自贸港政策叠加之下国际医疗健康产业开放发展的活力。\n\n11月18日，海外华文媒体走进海南博鳌乐城国际医疗旅游先行区内的颖奕国际医疗中心参访。　中新网记者 骆云飞 摄\n\n　　韩海玲告诉中新网记者，颖奕国际医疗中心去年接待国际医疗服务案例约157例，今年来境外客户线上咨询、线下就诊总量增长两三倍。“境外就诊人群以运动损伤患者居多，不少海外患者专程前来体验针灸、中医膏方、中药饮片等中医特色疗法。”\n\n　　国际医疗旅游业务的增长，直观印证海南自贸港政策的吸引力。官方数据显示，今年前8个月，乐城先行区累计接待医疗旅游79.13万人次，同比增长近一倍，国际医疗旅游吸引力持续释放。\n\n　　“乐城先行区的特许医疗、特许经营、特许研究、特许国际交流等4个特许政策支持，叠加海南自贸港政策，对东南亚、欧美客户吸引力突出。”韩海玲说。\n\n　　诸多“高含金量”政策加持下，乐城先行区作为中国唯一“医疗特区”，已成为国际创新药械进入中国的门户。目前，该园区汇聚40多家国内外高水平医疗机构，初步形成肿瘤、心脑血管、眼科等优势学科群；依托特许药械政策红利，引进境外上市创新药械及特殊食品超590种，累计惠及患者超34万人次。\n\n图为海外华文媒体代表参观颖奕国际医疗中心。　中新网记者 骆云飞 摄\n\n　　封关以来，海南自贸港政策红利持续释放。韩海玲表示，企业主动面向国际市场拓展业务，海外尖端医师、前沿技术落地速度明显加快；同时，海南自贸港税惠政策落地，企业运营成本得到控制，最终惠及就诊客户。\n\n　　对于颖奕国际医疗中心而言，海南自贸港外籍医师执业便利政策，助力引进美国、新加坡骨科医生；30天免签政策，则支撑起“旅游+康养+治疗”的闭环服务。\n\n　　“海外华侨华人社群对国际化、高质量医疗康养需求旺盛。”加拿大搜罗传媒副总经理唐明涛认为，乐城先行区的制度创新、国际合作实践，有助于吸引更多人前来体验国际医疗旅游服务。\n\n　　“颖奕国际医疗中心落户乐城，正是看好这里的政策环境。”在荷兰《中荷商报》特派记者姚卫民看来，颖奕国际医疗中心的成长，也是台胞台企抢抓自贸港机遇、深耕海南大健康赛道的缩影。“随着琼台交流持续深化，越来越多台资健康项目将依托这扇开放窗口，连接两岸、联通世界。”(完)\n\n 【编辑:于晓】",

          "body": "“让我们携起手来，以开放纾发展之困，以创新聚增长之势，以合作谋共享之福，建设亚太共同体，共创亚太光明未来！”\n\n这是深圳前海特区馆广场上的“鹏翔碧浪”主题景观(2026年11月5日摄)。新华社记者 梁旭 摄\n\n　　南海之滨，深圳前海国际会议中心。“鹏翔碧浪”主题景观如锦铺展，“共促繁荣 共赢未来”的金色大字熠熠生辉，映衬又一个历史性时刻——\n\n　　11月18日，2026年亚太经合组织工商领导人峰会在这里举行，习近平主席出席开幕式并发表主旨演讲，为新形势下亚太合作指引前进方向。\n\n　　这是中国继2001年在上海、2014年在北京之后，第三次以亚太经合组织(APEC)东道主身份主办工商领导人峰会。\n\n2026年11月18日上午，2026年亚太经合组织工商领导人峰会开幕式在深圳举行。这是记者在现场采访。新华社记者 李响 摄\n\n　　从黄浦江畔，到燕山脚下，再到南海之滨，作为亚太合作的坚定支持者、积极参与者、重要引领者，中国早已深度融入亚太、融入世界，成为世界经济增长的重要引擎和稳定力量。\n\n　　从去年韩国庆州到今年中国深圳，接棒东道主的近400个日夜里，从主题设置到盛会筹备，中国携手其他APEC成员经济体，共商亚太经济新图景、合作新机遇。\n\n　　此时此刻，世界聚焦亚太，亚太瞩望中国。\n\n这是深圳前海国际会议中心外的“共促繁荣 共赢未来”景观(2026年11月18日摄)。新华社记者 梁旭 摄\n\n　　灯光璀璨、镜头频闪，来自世界各地的媒体定格下这一重要时刻——上午9点50分，前海国际会议中心一层大厅内，习近平主席同与会亚太工商界代表等合影留念。\n\n　　他们身后的蓝色背景板上，是“2026年亚太经合组织工商领导人峰会”中英文字样和APEC“中国年”会标，21根交织的羽翼宛如大鹏展翅，寓意21个经济体乘大势、共翱翔。\n\n这是深圳莲花山公园的巨型APEC主题花坛(2026年10月17日摄)。新华社记者 梁旭 摄\n\n　　回首过往，每至亚太发展的关键时刻，一项项中国方案直面区域发展挑战，彰显大国领袖引领亚太合作、践行多边主义的远见与担当。\n\n　　面向未来，亚太经合组织如何推动建设亚太共同体，亚太能否继续当好推动经济全球化的火车头，中国声音备受关注。\n\n　　上午10时整，会议中心二层主会场内，随着恢宏的《和平—命运共同体》乐曲声响起，全场嘉宾起立，热烈鼓掌，习近平主席阔步走上讲台，发表题为《坚定信心，勇毅前行 共创亚太光明未来》的主旨演讲。\n\n　　“欢迎亚太工商界的朋友们！很高兴同大家在深圳见面。”情真意切的问候，让与会中外嘉宾如沐春风。\n\n在深圳前海，楼宇屏幕滚动播放APEC主题的宣传海报(2026年11月3日摄)。新华社记者 毛思倩 摄\n\n　　此次峰会的举办地深圳，在习近平主席的心中独具分量。\n\n　　2012年党的十八大后首次离京考察便来到深圳前海，2018年改革开放40周年之际再赴深圳，2020年出席深圳经济特区建立40周年庆祝大会……足迹所至、殷殷嘱托，向世界传递将改革开放进行到底的坚定决心。\n\n　　此次赴深圳出席会议前夕，习近平总书记到广东中山考察。在深中通道西人工岛上凭栏远眺，西边深中大桥车流如织，东南边深圳前海的城市天际线蔚为大观。\n\n　　“40多年来，深圳在中国改革开放春潮中勇立潮头、奋发进取，实现了从边陲小镇到国际化大都市的历史性跨越，创造了世界发展史上的一个奇迹。深圳的成功，给人们许多启示。”会场内，习近平主席的演讲跨越时空、意蕴深远。\n\n　　昔日小渔村变身今日奇迹之城，深圳的精彩蝶变何以发生？答案写在“开放”二字里——它既是这座城市拔节生长的沛然力量，也是亚太走向持续繁荣的深层根基。\n\n　　当前，国际形势变乱交织，世界经济增长动能不足，单边主义、保护主义甚嚣尘上。与此同时，全球贸易在逆势中保持增长，新兴技术加速突破，深刻影响世界发展格局。\n\n　　“世界怎么了？亚太怎么办？开放还是封闭，合作还是分化，变革还是守旧？”演讲中，习近平主席提出的问题引人深思。\n\n　　“中方愿同各方一道，坚定信心、勇毅前行，携手建设亚太共同体，促进亚太共同繁荣。”面对新的时代课题，习近平主席的回答掷地有声。\n\n　　——促进亚太共同繁荣，要维护和平稳定大局。\n\n　　提出越是外部形势复杂，“越要坚定维护战后国际秩序，推进平等有序的世界多极化、普惠包容的经济全球化”“越要坚持通过对话协商解决分歧，通过团结协作应对挑战，为亚太地区长治久安筑牢根基”。\n\n　　——促进亚太共同繁荣，要搭建开放合作桥梁。\n\n　　强调要坚定维护以世界贸易组织为核心、以规则为基础的多边贸易体制，支持自由开放的贸易和投资，维护全球产业链供应链稳定畅通；稳步推进亚太自由贸易区进程，“为亚太经济一体化建设铺路架桥”。\n\n　　——促进亚太共同繁荣，要激发创新增长动力。\n\n　　聚焦积极构建科技创新伙伴关系，强调“深化数字经济、人工智能合作，促进绿色低碳转型，不断将创新优势转化为增长动能，为亚太经济增长提供强劲动力”。\n\n　　——促进亚太共同繁荣，要拓展互利共赢路径。\n\n　　指出亚太推进合作“不能搞整齐划一”，要既消除贸易和投资壁垒，建设开放型亚太经济，又推动普惠均衡发展，兼顾效率和公平；要坚持以人民为中心的发展理念，“让发展成果惠及各经济体和不同的阶层及人群”。\n\n　　习近平主席以宏大的历史视野提出促进亚太共同繁荣的四点主张，中国理念、中国方案再次为亚太未来发展注入丰沛的思想动能、提供明确的方向指引。\n\n　　建设亚太共同体，共创亚太光明未来。\n\n　　此次工商峰会举行地深圳，处在粤港澳大湾区。经济总量突破15万亿元，拥有3个地区生产总值超3万亿元的城市……粤港澳大湾区正不断拓宽与亚太各地共享合作机遇的通道，持续释放开放的红利。\n\n　　习近平主席在演讲中表示，中方支持成立世界湾区经济合作联盟，深化各湾区交流互动，探索亚太经济合作新路径。\n\n　　扎根亚太、建设亚太、造福亚太，更加开放的中国正不断以中国式现代化新成就为亚太和世界提供新机遇。\n\n　　APEC“中国年”恰逢中国“十五五”开局。“中国‘十五五’规划既是自身的发展蓝图，也为亚太乃至全球经济增长提供机遇清单，是中国面向全球工商界发出的合作邀约。”习近平主席指出。\n\n　　这份邀约背后，是超大规模的开放市场：从新能源汽车到智能家居，从银发经济到冰雪旅游，“每一个新赛道都为全球企业带来新机遇”。\n\n　　这份邀约背后，是前景广阔的发展空间：中国将加快构建现代化产业体系，推动科技创新和产业创新深度融合，“为全球企业技术创新和发展壮大提供强劲动能”。\n\n　　这份邀约背后，是互促共进的合作环境：中国始终践行真正的多边主义，坚定维护多边贸易体制，“不断为世界经济增长和国际经贸合作注入稳定性和确定性”；坚定不移推动共建“一带一路”高质量发展，欢迎亚太地区企业积极参与，共谋发展机遇、共享发展成果。\n\n　　…………\n\n　　一以贯之的开放承诺，合作共赢的坚定决心，赢得与会嘉宾热烈回应。\n\n　　“习主席的演讲围绕促进亚太共同繁荣提出一系列主张，传递出一个明确信号就是要携手合作，这对当下的世界来说非常重要。”现场聆听演讲，美国经济学家杰弗里·萨克斯如是说。\n\n　　“这是非常重要的演讲，我会第一时间与企业朋友分享。”来自澳中工商业委员会的弗兰克·麦奎尔表示，他对习主席提到的互利共赢理念印象深刻，中国的创新发展将给澳大利亚企业带来更多新机遇。\n\n　　此时的深圳前海，开放合作的浪潮奔涌向前。会场不远处，形如“扬帆启航”的前海石迎风而立。\n\n　　“亚太是我们共同发展的天地，也是我们并肩合作的舞台。”从深圳再出发，亚太的未来充满希望、前景光明。\n\n　　文字记者：韩洁、潘洁、唐诗凝\n\n　　海报设计：马发展\n 【编辑:叶攀】",

          "body": "今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。而全球觸目的中俄美三國元首會談將在今日下午進行，可能涉及俄烏戰事及伊朗局勢。外交部表示，這是中俄美三國元首歷史上首次面對面會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。\n中俄美三國元首面對面會晤。 新華社\n​​​\n\n相關新聞：APEC 2026懶人包 21成員聚首深圳談甚麼？ 和我們息息相關？ 一文看清重點全解析\n本屆深圳APEC新增一場重頭戲：中美俄元首明日將舉行歷來首次三方會談，或觸及伊朗、烏克蘭等問題，俄方正推動會後發表聯合聲明。\n相關新聞：深圳APEC｜中美俄將展二戰後首次三方對話 學者：聚焦地區穩定不復刻強權外交︱分析\n內地分析人士對《星島》指出，在目前全球政經格局動盪之際，中美俄三國元首不但在深圳「同框」，而且將破天荒召開三方峰會；若北韓領袖金正恩也現身深圳，今次峰會將是APEC成立37年來「含金量最高」的一次會議。據了解，各方正醞釀推動達成《深圳宣言》。\n相關新聞：深圳APEC︱峰會今揭幕習近平發表講話 被譽史上「含金量最高」\n11月19日最新消息\n00：35\n內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。\n相關新聞：深圳APEC｜晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n​ 內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。 中新視頻\n11月18日最新消息\n23：50\n俄羅斯衛星通訊社報道指出，出席歡迎晚宴的俄羅斯總統普京與美國總統特朗普，分別獲安排坐在習近平及夫人彭麗媛的左右兩側。\n相關新聞：深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身訪華團\n19：23\nAPEC各經濟體領導人開始陸續抵達位於深圳福田區的深圳國際交流中心。這處將舉行領導人合影活動，並舉辦由國家主席習近平名義舉行的歡迎晚宴。大會在入口處安排樂師現場演奏，當美國總統特朗普入場時，更特意駐足欣賞一會。\n相關新聞：深圳APEC｜習近平舉行歡迎晚宴 特朗普與普京握手\n晚宴開始後，中美俄三國領導人更在台上交談，期間美國總統特朗普更與俄羅斯總統普京握手。\n\n習近平在歡迎晚宴上，向出席嘉賓祝酒。路透社\n經濟體領導人在歡迎晚宴上合照。路透社\n經濟體領導人到深圳國際交流中心，出席歡迎晚宴。路透社\n習近平親迎特朗普：禮尚往來\n16：45\n新華社報道，周三（18日）下午，國家主席習近平在深圳寶安國際機場迎接來華出席亞太經合組織領導人非正式會議的美國總統特朗普。在迎賓曲中，習近平同特朗普親切握手。三軍儀仗隊行舉槍禮，少年兒童向特朗普獻花。中美兩國國旗迎風招展，軍樂團奏兩國國歌，戰機飛越致敬。兩國元首向青年歡迎隊伍揮手致意。\n習近平表示，今年9月我訪美時，特朗普總統夫婦專程赴機場迎接，並舉行隆重歡迎儀式。中國是禮儀之邦，有禮尚往來的傳統。我歡迎你再次訪華，期待同你就事關中美關係、亞太合作和世界格局的重大問題深入交換意見，推動基於尊重、公平、對等的中美建設性戰略穩定關系向前發展。\n特朗普表示，感謝習近平主席親赴機場迎接，感謝中方特殊安排，很高興再次到訪偉大的中國。習近平主席是一位偉大的領袖，每一次同習近平主席會晤都非常愉快，相信此訪將進一步推進兩國關係，取得圓滿成功。\n蔡奇、王毅、黃坤明參加。\n相關新聞：深圳APEC｜特朗普結束訪菲啟程來華 上機前做「招牌」握拳頭動作\n16：27\n日本首相高市早苗抵達深圳，將出席領導人非正式會議，展開就任後的首次訪華之行。\n\n相關新聞：深圳APEC︱日本首相高市早苗抵華 接待層級低於其他領導人\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n12：04\n國家主席習近平與俄羅斯總統普京會晤。\n習近平與普京會晤。\n習近平與普京會晤。\n普京讚深圳最具活力的大都市之一\n11：20\n俄羅斯總統普京出席深圳前海國際會議中心出席2026年亞太經合組織工商領導人峰會開幕，並以經濟體領導人身份作特別致辭。普京表示，此次APEC舉辦地深圳給人留下了深刻印像。「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」\n10：00\n國家主席習近平在主旨演講上表示，中國「十五五」規劃既是自身的發展藍圖，也為亞太乃至全球經濟增長提供機遇清單，是中國面向全球工商界發出的合作邀約。\n\n中國將為全球工商界提供超大規模開放市場。中國擁有全球規模最大中等收入群體，投資和消費潛力巨大。\n相關新聞：深圳APEC｜習近平籲踐行真正多邊主義 共建亞太共同體\n習近平：中國正加快建設開放大市場\n習近平指出，從新能源汽車到智能家居，從銀發經濟到冰雪旅遊，每一個新賽道都為全球企業帶來新機遇。中國正在加快建設開放大市場，擴大優質產品和服務進口，將不斷催生多樣化新需求。\n中國將為全球工商界提供前景廣闊的發展空間。創新驅動、綠色轉型是中國經濟的關鍵詞。中國將加快構建現代化產業體系，推動科技創新和產業創新深度融合，為全球企業技術創新和發展壯大提供強勁動能。\n\n中國將為全球工商界提供互促共進的合作環境。面對單邊主義、保護主義衝擊，中國始終踐行真正多邊主義，堅定維護多邊貿易體制，維護世貿組織規則，推動世界貿易組織改革，不斷為世界經濟增長和國際經貿合作注入穩定性和確定性。中方將從降低關稅、擴大准入，到探索規則、管理、標準等深水區改革，全面落實製造業准入又准營，穩步擴大服務業領域開放，為全球企業來華投資興業提供更穩定、更可預期優質環境。\n今明兩日出席峰會 多國領袖齊聚深圳\n03：00\n18日凌晨，俄羅斯總統普京乘專機抵達深圳，出席APEC峰會。中共中央政治局常委、中央書記處書記蔡奇前往機場迎接。分析人士對《星島》指出，今年5月普京訪華時，接機是中共中央政治局委員、外長王毅，而今次接機的是政治局常委蔡奇，規格比之前更高。預計普京在峰會期間將與多國與會領袖就亞太區經貿合作及國際局勢等議題展開交流。\n克里姆林宮發言人周六表示，11月19日在深圳，普京將與國家主席習近平及美國總統特朗普舉行三方會晤。",

          "body": "2025年12月海南自贸港正式启动全岛封关运作以来，政策红利持续释放，市场活力加速迸发。位于海南琼海的博鳌乐城国际医疗旅游先行区(简称“乐城先行区”)是中国大陆唯一的“医疗特区”，享有“特许医疗、特许研究、特许经营、特许国际交流”等政策，已成为国际创新药械进入中国大陆市场的最主要通道。\n\n11月18日，来自17个国家的20家海外华文媒体走进乐城先行区，探访颖奕国际医疗中心，在此了解台资企业依托海南自贸港政策的发展故事。\n\n颖奕国际医疗中心作为一家全台资三级综合医疗机构，自2021年正式运营以来，依托乐城先行区特许政策叠加海南自贸港红利，持续打通两岸医疗资源、对接全球前沿技术，成为台企看好海南、深耕健康产业的生动缩影。\n\n颖奕国际医疗中心院长韩海玲表示，封关之后，无论是海内外前来就诊的患者群体，还是企业自身发展，都能感受到明显变化。不少境外客户主动多方了解、持续关注海南自贸港相关政策；依托自贸港人才引进政策，中心顺利引进多名境外顶尖医师，同步引入国际先进医疗技术，“去年我们国际医疗板块接诊约157名患者，今年截至目前，接诊量已经实现两至三倍增长”。(林士杰 陈英清 符宇群)",

          "body": "11月18日，来自17个国家的20家海外华文媒体走进海南博鳌沙美村，探访百年侨村蝶变路。\n\n沙美村是一座拥有200多年历史的侨村，历经退塘还林还湿、修复红树林湿地、保护性修复70余间南洋特色侨居，从昔日传统渔村蝶变为中国美丽休闲乡村和博鳌亚洲论坛对外交流的“国际会客厅”。\n\n沙美村党支部书记、村委会主任冯锦锋介绍，过去村庄交通闭塞、垃圾环村，发展受限。2017年，沙美村启动美丽乡村建设，依托当地特色资源发展民宿、农家乐等乡村旅游产业，带动村民增收致富。如今村庄面貌焕然一新，如同花园，吸引各地游客前来。\n\n冯锦锋说，美丽乡村建设前，该村人均收入15000元，目前人均收入提升至25000元。\n\n荷兰《中荷商报》特派记者姚卫民参访后表示，美丽乡村建设让沙美村焕然一新，也让村民生活很甜；加拿大搜罗传媒副总经理唐明涛则留意到村内风貌融合之美，古意建筑与现代洋楼并存，直观体现村庄持续向前发展的活力。(陈英清 林士杰)",

          "body": "APEC峰會展開，各地政要親臨深圳，其中墨西哥總統辛鮑姆奉行節約，不坐總統專機，而是中轉中國南航客機，飛了21小時。抵埗後歡接她的除了揮舞花球的中國兒童，還有公安部特勤局成員徐瑾，引起熱話。\n近年泰國前總理佩通坦訪華、國民黨主席鄭麗文「登陸」，徐瑾都參與護衛，其英姿颯爽的身影引起關注，被網民稱為「最美女保鏢」。\n相關新聞：深圳APEC｜墨西哥總統辛鮑姆抵深 中國女保鏢貼身保護成焦點｜有片\n談起中國女保鏢，不得不提上世紀80年代末、被稱為「中國第一女保鏢」的邊梅。筆者近日「考古」了2009年央視對邊梅的罕見專訪，詳細回顧了她的故事，\n\n邊梅1968年生於北京，畢業於中國人民警官大學警衛安全專業，1988年起專門負責各國訪華政要夫人的貼身安保。她文武兼備，除了精通拳擊、柔道、射擊、駕駛，還通曉外語、禮儀、犯罪心理、刑法，也是公安部第一批獲法學學士的警衛。任職期間，保衛任務對象包括美國、前蘇聯、印度、日本、英國、意大利等國的第一夫人。\n\n邊梅在訪問中表示，因為自己身材瘦小，執勤時經常需要穿上厚重的防彈衣，如果真有一顆子彈射來，防彈衣可以防止子彈穿透她的身體，傷到外賓。\n\n同女保鏢冷峻的形象不同，邊梅經常笑容燦爛，有女性特有的細心和關懷。據報泰國詩琳通公主訪華期間，和邊梅經常聊些有趣話題，後來還成為了很好的朋友。其他國家的警衛也很愛和邊梅交談，每次都會開心的跟她打招呼：「梅，梅」。\n\n因為年歲漸長和從事警衛行業帶來的高度壓力 ，1995年邊梅轉業，漸漸從公眾視野中消失。2009年，央視專訪邊梅時，她是一家安全咨詢公司的合伙人，有人曾邀請她拍攝電影，將自己的經歷寫書，她都一一拒絕。近年也沒有她的公開訪問。\n\n紀曉華",

          "body": "深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行。麒麟山莊是園林式酒店建築群，內部山清水秀，建築風格中西合璧，山莊去年曾對外開放，公眾可預訂住宿、婚宴、會議。近日山莊入口有警察看守，禁止外人隨意進入或拍照。\n相關新聞：深圳APEC｜中美俄將展二戰後首次三方對話 學者：聚焦地區穩定不復刻強權外交︱分析\n習特先會晤普京後加入\n中國外交部前日宣布，確認國家主席習近平19日將與美國總統特朗普、俄羅斯總統普京在深圳舉行中美俄三國元首會晤。根據白宮公布，特朗普將在19日在深圳國際交流中心出席亞太經濟合作組織（APEC）領導人全體會議，隨後中午時分轉往麒麟山莊，與習近平進行雙邊會晤。下午普京將加入兩人，舉行中美俄三方會議，歷時約1小時。三方會議結束後，特朗普將直接從麒麟山莊前往深圳寶安國際機場，啟程返回美國。\n相關新聞：深圳APEC︱習近平將與普京特朗普舉行中俄美元首會晤 外交部：將就全球和平問題交換意見\n麒麟山莊位於深圳南山區，是深圳市官方重要接待基地，主要承擔領導人及外賓訪問深圳時的接待任務。\n距寶安國際機場半小時車程\n山莊坐落深圳西北麒麟山麓，毗鄰西麗湖，佔地38公頃，旁邊是西麗高爾夫球場和深圳野生動物園，距深圳寶安國際機場約半小時車程。山莊內環境清幽，有多棟獨立別墅和大型宴會廳，採用歐陸建築風格。\n\n去年年底之前，麒麟山莊長期對外開放，公眾可預訂住宿、婚宴、會議。在內地平台「大眾點評」上，有網友曾留言稱，山莊裏山清水秀，建築風格中西合璧，非常適合周末休閒、遛娃，地方很大很適合開會，但房間內部設施略顯年代感。",

          "body": "有「流星雨之王」美譽的獅子座流星雨近日進入活躍期。據天文資料顯示，獅子座流星雨的活躍期為每年11月6日至30日。這場天文盛事以流星速度快、亮度高為主要特色，觀賞性極高。\n\n火流星劃破夜空　母體源自彗星\n\n在活躍期間，偶爾會出現極為耀眼的火流星，照亮夜空，令人驚嘆。這一切壯麗景觀的背後，源自其母體「坦普爾-塔特爾彗星」。獅子座流星雨正是地球穿過這顆彗星遺留在軌道上的塵埃帶時，塵粒衝入大氣層燃燒所形成的天文現象。\n\n黑龍江同江市\n\nLEO METEOR 黑龍江富錦市\n\n黑龍江大慶市杜爾伯特蒙古自治縣阿木塔旅遊度假區\n\n黑龍江齊齊哈爾\n\n黑龍江富錦市\n\n黑龍江佳木斯市郊區\n\n黑龍江牡丹江市\n\n黑龍江同江市\n\n黑龍江大慶市",

          "url": "https://www.stheadline.com/blockchain/3638113/穩定幣與人民幣國際化從跨境貿易痛點到離岸人民幣新基建下鄧進一",
          "summary": "已經有支付寶和微信支付，為甚麼還需要人民幣穩定幣？",
          "summary_short": "已經有支付寶和微信支付，為甚麼還需要人民幣穩定幣？",
          "digest": "已經有支付寶和微信支付，為甚麼還需要人民幣穩定幣",
          "points": [
            "已經有支付寶和微信支付，為甚麼還需要人民幣穩定幣",
            "它的定位，更像人民幣進一步國際化前的一個緩衝區和政策實驗室",
            "不改變在岸資本管理框架，先以現有離岸人民幣試行，在境外支付、投資和融資中…"
          ],
          "section": "內地",
          "category": "",
          "source": "stheadline",
          "source_display": "星島頭條",
          "published_at": "2026-11-19T06:00:00+08:00",
          "size": 1,
          "keywords": [],
          "body": "已經有支付寶和微信支付，為甚麼還需要人民幣穩定幣？如果目的只是掃碼付款，確實沒有必要。它的定位，更像人民幣進一步國際化前的一個緩衝區和政策實驗室。\n不改變在岸資本管理框架，先以現有離岸人民幣試行，在境外支付、投資和融資中，觀察哪些需求是真實的，哪些風險需要制度處理，哪些場景只是噱頭，都可以在這個範圍內先行驗證。\n我設想的方案有四個部分：合規發行、雙軌流通、平台協同、開放式RWA市場。\n一、發行資格：交給已有能力的科技金融機構\n人民幣穩定幣涉及儲備、清算、贖回、身份審查和跨境風控，不適合交給只有技術、缺乏金融基建的新團隊。\n較合理的起點，是由已有大規模支付、清算和合規能力的科技金融機構申請發行，包括大型銀行、支付平台及科技金融集團。它們已有客戶和商戶網絡，也有處理反洗錢、系統安全和流動性管理的經驗，不必由零開始。\n但規模再大，發行仍須持牌，以現有離岸人民幣資產作全額儲備，儲備獨立託管，定期披露和審計。直接鑄造和贖回只開放給完成審查的機構及企業，資金必須來自同名銀行戶口，出事後找得到負責機構。\n儲備可以分為銀行存款和短期、高流動性的人民幣債券。前者應付日常贖回，後者則令穩定幣需求轉化成人民幣債券需求。支付規模越大，發行人需要持有的合資格債券越多，穩定幣便不只服務支付，也能支持離岸人民幣資產市場。\n二、流通：註冊即時，未註冊延遲\n具體設計很簡單，只有兩條通道。註冊錢包完成身份認證和合規審查後，彼此轉賬可以即時到帳。未註冊錢包照樣可以收發，但款項會先列作待結算，24小時後才可動用。期間不能再次轉出、贖回或投入DeFi。\n這一天不是懲罰，而是緩衝。一旦涉及被盜、詐騙或制裁名單，發行商和執法機構有時間依法介入。付款人不能隨意反悔，發行商也不能任意取消交易。只有觸發明確的風控條件或法律要求，才可以凍結和調查。\n這個安排不要求所有人先註冊才能使用，而是以較慢的結算保留開放，以身份核實換取即時。至於名單由誰管理、DeFi協議地址如何分類，則需要另訂規則。\n三、銀行和支付平台：做入口\n人民幣穩定幣不會取代銀行、支付寶或微信支付。支付寶以平台帳戶為中心，穩定幣則是可以在不同錢包和應用之間流通的代幣，分別主要在於接入方式。銀行和支付平台繼續負責人民幣出入、身份核實。先連接香港、東盟和中東等已有人民幣業務的地區，「一帶一路」可以是市場方向。當買賣雙方沒有共同銀行，支付平台又未能打通，穩定幣可以先提供一條共同結算通道，讓交易完成。它在這些市場縫隙中累積用戶、交易和風險處理經驗，再逐步接入主流金融體系。\n四、生態開發：建立人民幣計價的RWA市場\n穩定幣如果只有支付功能，用戶收到錢後仍可能立即換走。要讓人民幣留在境外循環，必須有資產可以投資，也有渠道可以融資。\nCNH穩定幣可以成為人民幣RWA市場的現金端，用於認購、付款、收息和贖回；RWA代幣則代表債券、基金或貿易資產。兩者通過智能合約同步交收，減少資產與資金未能同時交付的風險。\n初期應由標準化資產做起，包括離岸人民幣國債、央行票據、企業債和貨幣市場基金，之後才加入貿易應收賬款及供應鏈融資，至於另類資產，可以留待市場成熟後再討論。\n結語\n人民幣穩定幣的價值，是在人民幣進一步開放之前，提供一個可觀察的試驗場。先由有能力的機構發行，用雙軌結算平衡開放與安全，再借助銀行和支付平台進入真實場景，最後接上人民幣資產市場。這個實驗要證明的，不是人民幣能否上鏈，而是上鏈之後，是否真的有人願意用，也願意留下來。\n相關文章：\n穩定幣與人民幣國際化：從跨境貿易痛點到離岸人幣新基建（中）｜鄧進一\n穩定幣與人民幣國際化：從跨境貿易痛點到離岸人幣新基建（上）｜鄧進一\n\n 鄧進一RhinoX首席技術官簡介:\n\n 網站: https://rhinox.hk/",

          "body": "日本政府觀光局（JNTO）周三（18日）公布，10月訪日外國旅客估算達391.25萬人次，按年微增0.4%，創有紀錄以來單月新高。雖然中國內地訪客大跌47%，但南韓、香港及多個歐美市場增長，帶動整體訪客量在連跌兩個月後回升。\n港客增3.3%　20個市場創10月紀錄\n香港10月訪日旅客達20.25萬人次，按年增加3.3%，創歷年10月新高。南韓則錄得103.58萬人次，按年升19.4%；台灣訪客達63.46萬人次，增加6.5%。中國內地訪客由去年同期約71.58萬人次，減至37.95萬人次。\n日本10月遊客391萬創單月新高。路透社\n雖然中國內地訪客大跌47%，但南韓、香港及多個歐美市場增長，帶動整體訪客量在連跌兩個月後回升。路透社\n香港10月訪日旅客達20.25萬人次，按年增加3.3%，創歷年10月新高。路透社\nJNTO指出，10月踏入紅葉季，加上東亞及東南亞部分地區有連續假期，歐洲亦適逢學校假期，帶動多個市場的訪日需求。共有20個市場創下歷年10月最高紀錄，其中墨西哥、法國、德國、俄羅斯及北歐地區，更刷新各自的單月紀錄。\n大阪內地客僅及去年同期36.7%\n全國訪客量創新高之際，部分依賴內地客的商戶仍感受到壓力。關西電視台引述大阪觀光局數字，今年首9個月到訪大阪的中國內地旅客，僅相當於去年同期的36.7%。\n道頓堀章魚燒店「たこ八」副店長松田表示，內地客減少的影響明顯，店舖每日營業額減少約10萬日圓，正嘗試延長營業時間等方法增加收入，亦希望吸引更多日本本地顧客。另一方面，店內來自菲律賓、美國及澳洲等地的旅客增多，反映客源結構正在轉變。",

          "body": "中新社深圳11月18日电 (记者 尹倩芸)《2026年亚太经合组织工商领导人峰会深圳倡议》18日对外发布。倡议呼吁深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣。这是APEC工商领导人峰会创办30年来首次以倡议形式发布成果文件。\r\n\n　　倡议呼吁APEC推进亚太自贸区建设，推动区域、双边自贸协定和部门经贸安排交流互鉴，加强区域贸易规则趋同和协调。保持亚太自贸区规则架构适应现代商业模式并与时俱进。\n\n　　倡议呼吁APEC构建负责任、安全可控、可互操作且激励创新的人工智能治理框架，推动人工智能开放包容、普惠向善发展。\n\n　　倡议还呼吁APEC着眼未来十年发展需要，制定《亚太经合组织互联互通蓝图》升级版，进一步密切亚太各经济体之间的联系。\n\n　　倡议指出，在开放包容、创新增长、互联互通、合作共赢四大优先领域引领下，亚太工商界愿与所有经济体一道，全面落实《2040年亚太经合组织布特拉加亚愿景》，共建开放、活力、强韧、和平的亚太共同体，并将今年APEC“建设亚太共同体，促进共同繁荣”的主题转化为实际行动，使亚太继续成为世界最具活力的增长引擎和共同繁荣的共同体。(完) 【编辑:田博群】",

          "title": "中国广西新发现直立人化石 将助力破解古人类演化关键谜题",
          "url": "https://www.chinanews.com.cn/gn/2026/11-19/10734432.shtml",
          "summary": "中新网北京11月19日电 (记者 孙自法)直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚大陆东部。",

            "不过，由于此前中国特别是华南地区相关化石记录存在空白，成为古人类演化关键谜题之一，备受关注",
            "中外科学家最近在广西相距15公里的两处洞穴遗址中鉴定出8颗直立人牙齿化石…"
          ],

          "published_at": "2026-11-19T00:07:40+08:00",
          "size": 1,
          "keywords": [],
          "body": "中新网北京11月19日电 (记者 孙自法)直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚大陆东部。不过，由于此前中国特别是华南地区相关化石记录存在空白，成为古人类演化关键谜题之一，备受关注。\n\n　　中外科学家最近在广西相距15公里的两处洞穴遗址中鉴定出8颗直立人牙齿化石，发现该种群曾生存于距今32.4万年至18.4万年的雨林环境中。这既表明直立人在中国的存续年代比之前的认识至少后推了8万年，也挑战了关于直立人群体无法适应雨林环境行为局限的假设。\n\n本项研究的9颗古人类牙齿化石。中国科学院古脊椎所 供图\n\n　　这项古人类重大发现，由中国科学院古脊椎动物与古人类研究所(古脊椎所)东亚古人类文化演进与环境适应研究团队张颖奇研究员等，联合山东大学等中外6个国家10余个科研机构的科学家合作完成，相关成果论文以姊妹篇形式于北京时间11月19日凌晨在国际学术期刊《自然》(Nature)上线发表。\n\n　　中国已知年代最晚直立人\n\n　　研究团队介绍，广西壮族自治区崇左市江州区岜仙洞、那线洞遗址出土的9枚古人类牙齿化石中，8枚被确认为直立人，年代为距今32.4万年至18.4万年，是迄今中国已知年代最晚的直立人化石记录。\n\n　　岜仙洞由中国科学院古脊椎所发现并主持研究，那线洞由广西民族博物馆发现、山东大学考古学院主持研究，两处遗址共出土古人类牙齿化石9枚。传统形态学和定量形态学分析表明，除岜仙洞PA1796号标本外，其余8枚牙齿所代表的古人类均为直立人。PA1796在形态学上不同于直立人、尼安德特人和现代人，其身份尚待进一步确认。\n\n　　研究团队选取了来自两个洞穴的5颗古人类牙齿化石(包括PA1796)开展古蛋白质分析。结果表明，岜仙洞和那线洞的古人类(除PA1796)，在分子证据上与直立人有关，但属于一个与其他东亚中更新世直立人(如北京周口店、安徽和县等地点出土的直立人)不同的群体。\n\n　　研究团队认为，这是现有认知水平和技术条件下最为可能的鉴定结果。而PA1796可能属于一个尚未被充分描述的非直立人种群，这一悬而未决的问题，期待未来随着在崇左地区发现更多同时期古人类化石而得到解决。\n\n　　此前，中国的直立人化石地点大多位于中国北方和中部地区，且这些地点出土的直立人化石年代均早于距今40万年。\n\n本项研究的岜仙洞洞口。中国科学院古脊椎所 供图\n\n　　为确定岜仙洞和那线洞直立人的年代，研究团队采用5种相互独立的测年技术，对两个洞穴的沉积物和伴生哺乳动物化石进行测年，结果显示，岜仙洞直立人的年代为距今32.4万年—18.4万年，那线洞直立人的年代为距今31.9万年—24.1万年。综合两个洞穴的测年结果表明，在距今32.4万年—18.4万年之间，至少有一个时期，崇左地区曾有直立人生活。\n\n　　研究团队指出，中国已知年代最晚直立人化石的发现，改变了人们以往对直立人存续年代和地理分布范围的认识，使崇左成为研究中国境内直立人种群走向消亡的关键地区。\n\n　　能适应雨林环境且远距离移动\n\n　　进一步分析发现，岜仙洞和那线洞的直立人生活在林冠郁闭的雨林环境中，并且在童年时期曾进行远距离移动。\n\n　　这表明，直立人能够利用郁闭雨林环境并在其中进行远距离移动，从而扭转了长期以来认为直立人只能栖息于开放稀树草原或疏林环境的传统观点。\n\n　　此外，岜仙洞和那线洞直立人年代的不确定区间(距今32.4万年—18.4万年)，以及形态学和古蛋白质组学均难以确定其身份的岜仙洞古人类牙齿标本(PA1796)，共同引出一个耐人寻味的科学问题，即直立人与丹尼索瓦人可能在年代和地理分布上存在重叠。\n\n　　因此，只有将来对崇左地区更多同时期的古人类牙齿化石开展形态学和古蛋白质组学分析，才有望厘清这一与现代人起源相关的关键科学问题。\n\n　　研究团队总结表示，岜仙洞和那线洞的直立人化石扩展了该古人类在亚洲大陆上的地理和年代分布范围，崇左直立人群体可能与亚洲南部的丹尼索瓦人在邻近的时空范围内共存；崇左乃至东亚是研究多个共域人类种群演化、交流与融合的关键区域。(完)\n\n 【编辑:付子豪】",

          "body": "去餐馆吃家乡菜、进小店给本国车厘子、龙虾“带货”、到大学演讲、和学生互动……\n\n　　亚太经合组织(APEC)第三十三次领导人非正式会议举行在即，这几天的深圳格外热闹。陆续抵达的APEC各经济体领导人，在紧凑的正式议程之外，趁着间隙与工商界交流，还走进城市街头巷尾，感受烟火气息。有网友感叹，原来，会议之外，亚太合作还有这般生动的打开方式。\n\n　　为车厘子、龙虾吆喝“带货”\n\n　　18日，中新社记者就在入住酒店旁的一家水果店，偶遇了智利总统卡斯特。\n\n　　卡斯特到访这家水果门店，是为见证智利车厘子新产季在中国开启。活动现场，他向一个中国家庭赠送了一箱智利车厘子，共同庆祝新产季到来。他表示，车厘子是智中双边贸易中最具代表性的产品之一，承载着两国之间的信任与友谊。\n\n11月18日，智利共和国总统何塞·安东尼奥·卡斯特到访深圳一家百果园门店，庆祝智利车厘子运抵中国。中新社记者 陈楚红 摄\n\n　　同日，澳大利亚总理阿尔巴尼斯走进深圳一家超市，与澳大利亚贸易投资委员会的官员一起考察龙虾等澳大利亚特产。他在个人社交媒体上写道：我目前身处深圳，正致力于推动经济增长，并为澳大利亚企业创造更多机遇。\n\n　　墨西哥总统辛鲍姆抵达深圳当日便来到一家墨西哥餐厅，与多位居住在深圳的墨西哥侨民一起用餐，墨西哥经济部还向该餐厅颁发荣誉证书。此后，该餐厅热度攀升，无形中为墨西哥美食与文化作了一波推介。\n\n　　进校园、访医院，交流合作再加码\n\n　　人文对话永远有着打动人心的力量。11月18日，俄罗斯总统普京来到深圳北理莫斯科大学。作为中俄教育合作的标志性成果，这里长久以来都是两国青年交流互动的平台。\n\n　　今年正值该校建校10周年，普京在现场演讲中细数了该校多年来的发展成就，并由此延伸到中俄教育合作的诸多成果。在演讲中，他毫不吝惜对深圳的夸赞，称其为“最现代化、最具活力的特大城市之一”。\n\n　　辛鲍姆当天走进深圳的一家智慧医院，近距离了解深圳医疗的科技成果。“患者在这里得到的不仅是人性化的医疗服务和专业医生的诊治，医院还运用了人工智能和最先进的设备。真的非常令人惊叹。”辛鲍姆对媒体说，墨方将与该院建立更深入的合作关系，以便把该院应用的先进科学技术成果引入墨西哥。\n\n　　对话工商界：“不能停止开放，不能停止扩大合作”\n\n　　11月18日，APEC工商领导人峰会在深圳前海国际会议中心开幕。当天，马来西亚总理安瓦尔、俄罗斯总统普京、加拿大总理卡尼、泰国总理阿努廷、澳大利亚总理阿尔巴尼斯、韩国总统李在明、越共中央总书记、国家主席苏林先后出席并发表演讲。\n\n　　每位领导人关注点虽各有侧重，但都少不了对推进亚太合作、实现更好发展的期待。李在明直言，“我们不能停止开放，不能停止扩大合作”；安瓦尔呼吁在亚太地区推动建立和平、公正、包容的框架，促进经济发展，为整个世界经济描绘出更好的图景。\n\n　　会场内的对话理性深刻，会场外的交流松弛亲切。祖籍为广东江门的阿努廷格外兴奋，对着媒体镜头飙起了粤语“猴开森”！当被问及这次是否会回老家看看，他遗憾表示“我没时间”。\n\n　　从会场到街头市井，再到校园、医院，多国政要在深圳留下的足迹，串联起亚太合作的一个个坐标。亚太各经济体本就利益交融、命运与共，理念的共鸣与现实的往来互通，正是亚太共同体鲜活的写照。\n\n　　记者：李京泽\n\n 【编辑:付子豪】",

          "body": "中新社深圳11月18日电 题：中国为何支持成立世界湾区经济合作联盟？\n\n　　中新社记者 郑嘉伟 刘玥晴\n\n　　2026年亚太经合组织(APEC)工商领导人峰会17日至18日在深圳前海国际会议中心举行。与会各方透过深圳这扇窗口观察到粤港澳大湾区的蓬勃生机，同时也提出新的问题：如何推动不同湾区加强联动，让各自的发展优势转化为更广泛的区域合作动能？\n\n　　18日上午，中国国家主席习近平在峰会开幕式发表主旨演讲时指出，中方支持成立世界湾区经济合作联盟，深化各湾区交流互动，探索亚太经济合作新路径。\n\n　　为亚太务实合作搭建新载体\n\n　　当前，国际形势变乱交织，单边主义、保护主义抬头，世界经济增长动能不足。世界湾区经济合作联盟的提出，让APEC第三十三次领导人非正式会议“建设亚太共同体，促进共同繁荣”的主题有了更具体的载体。\n\n　　辽宁大学校长、英国皇家经济学会勋衔院士余淼杰接受中新社记者采访时表示，旧金山湾区、东京湾区和粤港澳大湾区等都是经济发达、具有活力的城市群，当它们以联盟这一新方式进行开放、创新与务实合作，实现经济规模递增时，对引领全球可持续发展有重要意义。\n\n　　此外，人工智能(AI)等新技术蓬勃发展也为全球培育新的经济增长点提出新要求。中国商务部国际贸易经济合作研究院学术委员会副主任张建平认为，深化各湾区交流互动，能更好集聚培育新业态和新模式的显著优势，回应全球所需。\n\n　　为全球经济复苏注入新动力\n\n　　湾区经济具有鲜明开放性、协同性和外溢性。张建平指出，这三大特性决定了各湾区加强交流合作能为全球经济复苏注入强劲动力。\n\n　　他说，“开放性”指的是湾区作为重要交通枢纽高效连接全球；“协同性”体现在湾区城市根据比较优势整合资源，优势互补、激发经济活力；“外溢性”是湾区在人才、资金技术等方面有辐射带动效应，能有效拓展全球市场。\n\n　　联盟并非增加一个封闭的“小圈子”，而是把不同湾区的创新和产业优势连接起来，为全球经济往来提供更多可操作的合作场景。香港大学经管学院经济学高级讲师章逸飞认为，关键是各湾区要按比较优势分工，从而形成互补，承担起跨境规则协调、产业链组织、创新策源等作用。\n\n　　为跨区域协作释放新信号\n\n　　深圳所在的粤港澳大湾区已成为中国经济活力最强的区域之一，在此提出成立世界湾区经济合作联盟释放出明确信号。余淼杰称，通过推动不同地区、不同制度、不同文化的湾区形成新的合作模式，中国可以打造更大规模、更宽领域、更深层次的开放新格局。\n\n　　全国港澳研究会理事、澳门学者同盟会长叶桂平表示，广东完备的产业配套，香港的金融、专业服务和接轨国际能力以及澳门的葡语国家市场通道都是粤港澳大湾区的重要优势，大湾区有意愿也有能力承接来自其他湾区的合作。\n\n　　章逸飞认为，其他湾区与粤港澳大湾区的合作空间主要在金融科技、绿色金融、数字经济、跨境数据和先进制造等领域。他建议，依托重点项目和市场驱动，降低跨境交易成本和制度摩擦成本，探索湾区间规则衔接、技术转移、AI治理及青年人才培养的路径，并打通企业参与渠道。(完) 【编辑:付子豪】",

          "body": "中新社深圳11月18日电 (记者 尹倩芸)11月18日，在深圳举行的2026年亚太经合组织(APEC)工商领导人峰会开幕式上，中国向全球工商界发出一份合作“邀请函”。\n\n　　中国国家主席习近平指出，中国“十五五”规划既是自身的发展蓝图，也为亚太乃至全球经济增长提供机遇清单，是中国面向全球工商界发出的合作邀约。\n\n　　在全球经济深度调整、产业链供应链加速重构的背景下，这份邀约更显可贵。\n\n　　合作的机遇，在于中国正成为连接亚太经济体优势、推动产业协同发展的重要纽带。\n\n　　“亚洲不缺优势，真正的机会是把不同的市场优势连接起来。”友邦保险集团首席执行官兼总裁李源祥的话，道出亚太乃至全球经济的合作潜力。\n\n　　不同经济体各有所长，资源、技术、市场相互依存。合作不是简单的你买我卖，而是让各方在价值链上找到位置，把彼此的长处用起来。\n\n　　与会嘉宾谈到一个“四年磨一剑”的故事：中国一家食品企业与西班牙设备商在链博会上相识，从交换名片到共建智能工厂，最终推出胡柚汁产品。\n\n　　必和必拓集团首席战略和发展官罗海凌说，中国不仅是必和必拓最大的消费市场，也是重要的合作伙伴。从资源开发到技术应用，企业正在中国市场找到更多产业协作的切入点。\n\n　　合作的空间，还蕴藏在不断涌现的新技术、新产业中。\n\n　　习近平指出，中国将加快构建现代化产业体系，推动科技创新和产业创新深度融合，支持传统产业转型升级、新兴产业发展壮大、未来产业前瞻布局，为全球企业技术创新和发展壮大提供强劲动能。\n\n　　在印度尼西亚，中印尼共建的人工智能算力中心为当地提供算力支持；在智利，中国设计的智慧农业无人机走进农田，帮助农场降低成本；在泰国，基于中国人工智能大模型的操作系统为传统矿区装上“数字大脑”，助力提升运营效率。\n\n　　中国创新与当地需求相结合，不仅为传统产业转型升级提供了新方案，也让更多国家和企业在新浪潮中寻找合作契机，培育增长动力。\n\n　　合作的价值，不只是分享已有的发展成果，更在于创造长远携手的条件。\n\n　　习近平指出，中方将从降低关税、扩大准入，到探索规则、管理、标准等深水区改革，全面落实制造业准入又准营，稳步扩大服务业领域开放，为全球企业来华投资兴业提供更稳定、更可预期的优质环境。\n\n　　“长期稳定的信任，是我们最为重视的关键。”美国全国商会会长兼首席执行官苏珊·克拉克的话展现工商界的现实关切。\n\n　　在全球性挑战交织叠加的当下，企业长期信任的积累来自于政策的稳定性、规则的透明度以及长期经营的可预期性。\n\n　　天丝集团首席执行官许馨雄说，中国持续以自身开放实践为全球投资者提供可预期的发展环境，这种稳定预期就是信心根基，支撑亚太长期投资、可持续增长与韧性产业合作。\n\n　　一份邀约的分量，最终要由合作的成果来证明。让中国发展的机遇成为各方携手合作、互利共赢的动力，正是这份“邀请函”的深意所在。(完) 【编辑:付子豪】",

          "body": "从北京雁栖湖到“奇迹之城”深圳，时隔12年，中国再次担任APEC东道主。连日来，与会各经济体领导人陆续抵达深圳，记者也在机场见证着这场跨越山海的相逢。\n\n热烈庄重的礼遇，热情洋溢的笑容，匠心独具的安排，中国自信从容的待客之道，传递着“有朋自远方来”的东方情谊。远道而来的宾朋也以不同方式回应着这份善意：辛鲍姆用“隔空拥抱”的手势表达“爱与支持”；苏林偕夫人不断挥手致意；随行人员纷纷打开相机定格瞬间，让“中国排面”再次刷屏“火出圈”。这些温暖互动的背后，不只是简单的礼仪寒暄，更是亚太伙伴相向而行、同心协作的真实写照。\n\n从雁阵齐飞到大鹏展翅，开放合作的内涵从未改变。今年是中国加入APEC35周年。从以加入APEC为契机深化改革开放，到成为全球开放的引领者，中国始终与亚太伙伴携手同行。外资准入负面清单持续缩减，自主开放和单边开放有序扩大；成为13个APEC成员的最大贸易伙伴，对亚太经济增长的贡献率超过六成……中国持续以自身开放为亚太繁荣提供新机遇。\n\n从大雁到大鹏，亚太共同体建设站在新的历史起点。我们期待今明两天(18日至19日)举行的APEC第三十三次领导人非正式会议，为亚太注入更多确定性，让开放合作的大鹏穿越风浪、飞向更辽阔的天空。(记者 李佳悦 谢雁冰 张素 陈骥旻 制作 侯诗蕊）",

          "body": "新华社东京11月18日电(记者李子越 杨智翔)日本多个民间团体18日共同向日本外务省提交诉求书，要求政府坚持“无核三原则”。\n\n　　“无核三原则”指“不拥有、不制造、不运进核武器”。现行“安保三文件”中的日本《国家安全保障战略》明确表示，坚持“无核三原则”的基本方针“今后不会改变”。但据日本媒体近期报道，日本政府正考虑在计划于年底修订的《国家安全保障战略》中写入“无核三原则”例外情况，或允许在紧急情况下将核武器运进日本。\n\n　　针对这一动向，日本民间团体在18日提交的诉求书中指出，“无核三原则”是日本长期奉行的国家方针，具有极其重要的地位，长期以来对历届政府的政策选择发挥着制约和引导作用。\n\n　　民间团体代表当天还与外务省方面以非公开形式进行意见交换。在之后的记者会上，民间团体代表透露，对于要求明确承诺继续坚持“无核三原则”等诉求，外务省仅表示相关问题仍在研究之中，未作出明确承诺，延续了此前的模糊立场。\r\n\n　　民间团体还指出，日本政府试图以所谓“紧急事态”为由，为核武器运进日本设置例外，这种做法不仅无助于维护日本的和平与安全，反而可能进一步加剧地区紧张局势，带来更大的安全风险。\n\n　　日本政府或调整核政策的动向已引发广泛担忧。据日本广播协会日前报道，从2025年10月高市早苗就任首相至今年10月底，日本参议院已收到全国地方议会提交的近300份意见书，要求坚持、尊重“无核三原则”或推动其法律化，数量相较以前显著增加。(完) 【编辑:曲克】",
