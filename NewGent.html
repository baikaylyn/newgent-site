:03+08:00","size":1,"keywords":[],"body":"中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis University）頒授榮譽博士（Doctor Honoris Causa）學位。榮譽博士學位為塞麥爾維斯大學最高學術榮譽之一，頒授典禮於匈牙利布達佩斯塞麥爾維斯大學歷史悠久的中央行政大樓內舉行，彰顯兩校日益深化的學術聯繫。\n盧煜明在致辭時表示，今天成為塞麥爾維斯大學的一員，讓我與被譽為「產婦的救星」、同時亦是大學命名人的塞麥爾維斯教授建立了深厚而個人的聯繫。他表示，自己畢生致力推動更安全的產前檢測，某種意義上可視為延續塞麥爾維斯教授致力改善孕婦及嬰兒福祉的歷史使命。\n中大校長盧煜明教授獲匈牙利塞麥爾維斯大學頒授榮譽博士學位。中大提供\n表彰盧煜明於分子診斷的貢獻\n今次榮譽博士學位旨在表彰盧煜明在分子診斷及醫學領域的開創性貢獻。盧煜明被譽為「無創產前檢測之父」，亦是液體活檢領域的先驅。他在1997年率先發現孕婦血漿內存有胎兒DNA，奠定無創產前檢測技術的基礎。相關檢測技術現已於全球超過100個國家採用，累計惠及逾一億名孕婦。\n此外，盧煜明近年亦將液體活檢技術應用於癌症早期檢測，成功研發可同時偵測多種癌症的血液測試技術，並推出作臨床應用。\n盧煜明研究成果對全球醫學科影響深遠\n盧煜明的研究成果對全球醫學科學界影響深遠，自2022年起出任香港科學院院長，他致力促進本地科研生態的長遠發展，並加強香港與內地及國際科研界的交流合作。盧煜明多年來在中國內地亦屢獲高度肯定，包括榮獲有「中國諾貝爾獎」之稱的首屆「未來科學大獎—生命科學獎」、成為首位華人科學家獲頒「復旦—中植科學獎」，以及當選中國科學院院士，並獲頒首屆「騰衝科學大獎」，充分體現其科研成就對國家醫學科技發展的重要貢獻。\n中大校長盧煜明教授獲匈牙利塞麥爾維斯大學頒授榮譽博士學位。中大提供\n盧煜明亦屢獲國際殊榮，包括「湯森路透引文桂冠獎」、「科學突破獎—生命科學」、英國皇家學會生物學科「皇家獎章」等。盧煜明在今年亦獲英國劍橋大學頒授榮譽醫學科學博士學位。\n進一步鞏固兩校轉化醫學領域夥伴關係\n今次獲塞麥爾維斯大學頒授榮譽博士學位，進一步鞏固中大與塞麥爾維斯大學在轉化醫學領域的夥伴關係，促進歐洲與亞洲之間的科研合作及學術交流。雙方合作涵蓋聯合科研活動，以及學生和研究人員交流計劃。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8f9def7377","title":"蔡天鳳案・今日重點｜鄺港智自辯揭三角關係 否認謀財害命 鄺球認以殘肢混青紅蘿蔔煲湯棄垃圾站","url":"https://www.stheadline.com/society/3638998/蔡天鳳案今日重點鄺港智自辯揭三角關係-否認謀財害命-鄺球認以殘肢混青紅蘿蔔煲湯棄垃圾站","summary":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。","summary_short":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。","digest":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智…","points":["28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智…","案件踏入第41日審訊，鄺港智出庭作供，庭上大爆震撼內情，透露與蔡天鳳…","而鄺球則承認將蔡天鳳部分殘肢與青紅蘿蔔煲湯後棄置垃圾站，對於為何烹屍則只以「唔知點解」回應"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:22:28+08:00","size":1,"keywords":[],"body":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。案件踏入第41日審訊，鄺港智出庭作供，庭上大爆震撼內情，透露與蔡天鳳、譚方駿維持三角關係多年，蔡天鳳為錢與譚方駿拍拖，鄺與蔡離婚後仍有性關係，而譚方駿其實「鍾意」的是鄺港智，想三人一起生活，譚家為傳宗接代亦不介意，後來鄺港智在內地相識新女友盧曉虹Ivy，卻因不捨蔡天鳳與譚方駿選擇與盧分手。而鄺球則承認將蔡天鳳部分殘肢與青紅蘿蔔煲湯後棄置垃圾站，對於為何烹屍則只以「唔知點解」回應。\n鄺港智自揭複雜三角關係「我哋三個真係好好㗎」\n鄺港智首日作供，憶述14歲與蔡天鳳同校相戀，並搬到蔡家同居，鄺曾學海南話為融入女家，與蔡母張燕花情同母子。鄺港智說女兒出生後，他為賺多點錢，牽涉盜竊案中，於是潛逃內地，蔡天鳳會到內地探望他，譚方駿後來亦會同行。鄺港智指「Chris（譚方駿）本身鍾意我嘅」，曾買碗米線向他示愛，鄺港智說譚方駿家人「想要小朋友，所以我哋就三個一齊囉，佢屋企人唔介意」。雖然三個人的關係複雜，但鄺港智形容「其實我哋三個真係好好㗎」，譚方駿就似是家人一樣，譚與蔡到內地探望他時，三人甚至同睡酒店一張床。即使蔡後來「改嫁」譚，蔡仍與鄺深吻並有性關係。\n鄺港智2022年於內地認識新女友盧曉虹Ivy，他形容是認真對待的關係，對方亦想跟他結婚。鄺港智向蔡坦白此事後，蔡哭着要求他回港，鄺港智思前想後，難捨蔡天鳳與譚方駿及子女，「又唔想害咗Ivy」加上自己正被通緝，最終與盧分手返港。\n相關新聞：\n蔡天鳳碎屍案｜鄺球認將蔡天鳳部分殘肢與青紅蘿蔔煮湯後扔垃圾站\n蔡天鳳碎屍案｜事前租龍尾村、凱旋門單位並添置工具 鄺球：「你可以講係巧合囉」\n蔡天鳳碎屍案｜鄺港智憶與蔡天鳳年少相戀 學海南話融入蔡家 與蔡母情同母子\n潛逃內地做名錶買賣生意大賺全給蔡天鳳\n鄺港智在代表大律師安華暉提問下說，2015年8月因涉盜竊案而「坐大飛」逃往內地，每程10萬元往返兩地，期間他經營買賣名錶生意賺逾2000萬元並將利潤交予蔡天鳳，自己在廣州以勞斯萊斯代步及用蔡天鳳等人信用卡。他又在內地從事商廈轉租項目投資，每月利潤約20至30萬元人民幣。\n相關新聞：\n蔡天鳳碎屍案｜指蔡天鳳為錢與譚方駿拍拖 二人離婚後仍與深吻性交 鄺港智：好正常啫\n蔡天鳳碎屍案｜鄺港智指與內地女友盧曉虹Ivy見家長 被蔡天鳳要求回港後分手\n支持賣加多利山單位可清還按揭\n就控方指鄺家為謀取加多利山單位而殺人，鄺港智直指「根本就無可能」。他稱十分支持賣樓搬往屯門，以方便子女就讀屯門哈羅香港國際學校及清還曼克頓山單位按揭，更曾說服鄺球簽署售樓授權書。惟他透露2022年中因女兒發燒，蔡天鳳與家姑李瑞香及鄺球爆粗互罵，鄺球一度欲揮手打蔡，自此翁媳決裂，蔡下令禁止鄺球入屋及見孫，鄺家只能瞞着她讓鄺球見孫。\n相關新聞：\n蔡天鳳碎屍案｜鄺港智指譚方駿「鍾意我」 譚家為傳宗接代不介意三角關係\n蔡天鳳碎屍案｜鄺港智：好支持賣加多利山單位搬屯門 方便上學順道還清按揭\n案發前租龍尾村及凱旋門單位買工具並非計劃\n控方再三質疑鄺球為何烹屍，鄺球只以「唔知點解」回應，又稱當時精神崩潰，忘記削骨剝肉過程，但同意曾將蔡天鳳部分殘肢加入青紅蘿蔔煲湯後扔到垃圾站。\n控方質疑鄺球在蔡天鳳死前約兩星期租用龍尾村單位並添置切割工具，又在情婦原租約未滿下以月租兩萬元租下凱旋門單位及替鄺港智辦新電話卡，認為準備、殺人、肢解及潛逃均屬三父子計劃。鄺球一概否認，辯稱租龍尾村是為做運動養生，買工具僅作裝修；而交出凱旋門租約及鑰匙，是因聽聞蔡天鳳常「俾面色佢（鄺港智）睇」，故提供落腳點，又反駁幼子水路潛逃回內地的說法。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8a2a65aa90","title":"機構指近期懷疑虐兒案大部分施虐者為家庭成員 促政府全面禁止體罰","url":"https://news.tvb.com/tc/1207312-機構指近期懷疑虐兒案大部分施虐者為家庭成員促政府全面禁止體罰","summary":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。其中一半個案涉及身體虐待，促請政府全面禁止體罰。","summary_short":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。","digest":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員","points":["防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員","其中一半個案涉及身體虐待，促請政府全面禁止體罰","防止虐待兒童會指，去年4月至今年3月接獲逾1,100宗求助"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T19:28:00+08:00","size":1,"keywords":["虐兒","體罰"],"body":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。其中一半個案涉及身體虐待，促請政府全面禁止體罰。\n\n社會接連發生體罰或虐兒事件。防止虐待兒童會指，去年4月至今年3月接獲逾1,100宗求助。當中約兩成與懷疑虐兒有關，涉及241名兒童，當中逾4成是3至8歲兒童。\n\n懷疑虐兒個案中，一半是身體虐待，其次是疏忽照顧佔約兩成，包括獨留在家等。亦有分別約一成涉及心理虐待及性侵犯。而逾7成施虐者是家庭成員，當中3成是母親，相信與管教困難，或對孩子期望過高等有關。\n\n防止虐待兒童會總幹事婁小君說：「家庭對於兒童而言，是最安全的地方。當他在家庭成員，遭受懷疑虐待行為，嚴重損害心理健康，例如不論信任，很容易產生驚恐、抑鬱，亦失去安全感，自我價值低落，覺得自己不配得到愛、關懷，更影響社交及人際關係。留意到自己管教及情緒上，意識到有波動，情況不知處理，盡快找專業人士。」\n\n《強制舉報虐待兒童條例》，實施至今10個月，防止虐待兒童會指，收到約960宗舉報及諮詢，其中專業人士的查詢按年減少。\n\n婁小君說：「過去一、兩年，在專業界別中，有很多意識或培訓，整個業界包括社署，在網上有保護兒童課程，根據指引專業人員，需向社署舉報，即保護家庭及兒童服務課或警務處，預見支援數字有分別。」\n\n機構又期望，政府能盡快訂立「沒有保護罪」， 更早識別、保護及介入。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20269ecN3rduup1795088171.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/d754639105d94a23903519812798fafa/a01eee3153614c1da93fb7e86efc32c1-b9c84ec9c9a2d1363b78c3bd280542c2-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20269ecN3rduup1795088171.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c771ce720ac","title":"《星島申訴王》揭二手名牌寄賣店結業｜累計303人報案 涉款增至$4190萬","url":"https://www.stheadline.com/breaking-news/3638986/星島申訴王揭二手名牌寄賣店結業累計303人報案-涉款增至4190萬","summary":"《星島申訴王》前日（17日）報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及「Vootic」的負責人突然失聯，大批寄賣客戶的名牌手袋及貨款不翼而飛，多名苦主在社交網求助。","summary_short":"《星島申訴王》前日（17日）報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及「Vootic」的負責人突然…","digest":"《星島申訴王》前日報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及「…","points":["《星島申訴王》前日（17日）報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及…","根據警方最新公佈的數字，截至今日（11月19日）下午6時，累計有303人報案…","警方指當中207人的報案，涉及銅鑼灣Vootic，涉款金額約3,000萬元…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T19:10:56+08:00","size":1,"keywords":[],"body":"《星島申訴王》前日（17日）報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及「Vootic」的負責人突然失聯，大批寄賣客戶的名牌手袋及貨款不翼而飛，多名苦主在社交網求助。根據警方最新公佈的數字，截至今日（11月19日）下午6時，累計有303人報案，涉款增至約4190萬元。\n警方指當中207人的報案，涉及銅鑼灣Vootic，涉款金額約3,000萬元，其餘96人則涉及金鐘樂星，涉案金額約1,190萬元。警方將案件暫列「欺詐」，繼續交由灣仔警區重案組及中區警區重案組跟進。\n相關新聞 : 名牌寄賣店突關門 日籍東主失聯 苦主逾百 損失金額或逾2千萬 | 星島申訴王\n大批苦主早前向《星島申訴王》控訴日籍東主 Hide 及其妻 Victoria 的惡意欺詐行徑。其中有苦主透露，早前他幫親友寄賣多個Hermès及Chanel手袋，在發現「彈票」異常後上門交涉，驚見金鐘店正「搬空貨物」，東主當時仍推諉稱是搬往銅鑼灣店，最終導致親友慘失400萬港元。\n根據商業登記及公司註冊處資料，被指失聯的日籍負責人國里英泰（Kunisato Hideyasu，人稱 Hide），正是銅鑼灣寄賣店「Vootic」營運公司 Exodia Limited 的唯一董事。而Hide曾在接受傳媒訪問時，亦自稱金鐘海富中心「樂星」的負責人兼「駐場鑑證師」。\n目前警方已將金鐘海富中心的店舖拉閘封鎖，並在閘外貼上告示指店舖與欺詐案有關。警方呼籲，任何受影響市民或有資料提供之人士，立刻聯絡重案組報案。\n灣仔警區重案組：3660 7546 或 5466 9204\n中區警區重案組：3660 1182 或 6978 6686","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5b58082249","title":"2026年渝港澳职业技能大赛在重庆开幕","url":"https://www.chinanews.com/ga/shipin/cns-d/2026/11-19/news1075481.shtml","summary":"11月19日，2026年渝港澳职业技能大赛在重庆开幕。","summary_short":"11月19日，2026年渝港澳职业技能大赛在重庆开幕。","digest":"11月19日，2026年渝港澳职业技能大赛在重庆开幕","points":["132名来自重庆、香港、澳门和四川的选手和专家齐聚山城，围绕数字建造、餐厅服务、中式烹调…","来自香港的选手林芷浩受访说，因为AI的进步，近两年数字建造技术变化很大…"],"section":"港聞","category":"港聞","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T18:16:20+08:00","size":1,"keywords":[],"body":"11月19日，2026年渝港澳职业技能大赛在重庆开幕。132名来自重庆、香港、澳门和四川的选手和专家齐聚山城，围绕数字建造、餐厅服务、中式烹调、糖艺/西点制作、养老护理、美容6个赛项各展所长、切磋交流。\n\n来自香港的选手林芷浩受访说，因为AI的进步，近两年数字建造技术变化很大，自己也想通过此次大赛接触、学习一些新的应用、新的技术。\n\n(梁钦卿 景诗雁 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/B4807676E3724BC19C494625652D0094.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ca8689ef9a2","title":"哈薩克一個服裝及紡織品牌落戶香港 冀拓展海外市場","url":"https://news.tvb.com/tc/1207273-哈薩克一個服裝及紡織品牌落戶香港冀拓展海外市場","summary":"中亞國家哈薩克一個當地服裝及紡織品牌落戶香港。品牌的特色，是以哈薩克傳統圖案及原創印花，設計時尚服飾及家居紡織品，以香港作為首個拓展海外業務的試點，期望透過香港作為亞洲貿易中心，測試本地及國際旅客反應，再拓展海外市場。","summary_short":"中亞國家哈薩克一個當地服裝及紡織品牌落戶香港。","digest":"中亞國家哈薩克一個當地服裝及紡織品牌落戶香港","points":["品牌的特色，是以哈薩克傳統圖案及原創印花，設計時尚服飾及家居紡織品…","投資推廣署指，特首年中率團訪問中亞，促成多份合作協議，今次是繼農業、資源公司進駐後…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:56+08:00","size":1,"keywords":[],"body":"中亞國家哈薩克一個當地服裝及紡織品牌落戶香港。\n\n品牌的特色，是以哈薩克傳統圖案及原創印花，設計時尚服飾及家居紡織品，以香港作為首個拓展海外業務的試點，期望透過香港作為亞洲貿易中心，測試本地及國際旅客反應，再拓展海外市場。\n\n投資推廣署指，特首年中率團訪問中亞，促成多份合作協議，今次是繼農業、資源公司進駐後，再有消費品類型公司來港，以本港作為試驗場。","image":"https://pro-vod-cdn.tvb.com/51ac2086068f43dd85d12670f541a878/snapshots/d7db0972716e40ddbb3651e3e8d56ee9-00005.jpg","video":"https://pro-vod-cdn.tvb.com/51ac2086068f43dd85d12670f541a878/8170a1e1fe9545ca837cbe9f70f3872b-948aab628f411c6db324ce27b7ffb3c4-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/51ac2086068f43dd85d12670f541a878/snapshots/d7db0972716e40ddbb3651e3e8d56ee9-00005.jpg","lang":"zh-Hant"},{"id":"c9a6de16cca","title":"恆豐酒店與錦倫旅運合謀定價罰款10.4萬 競委會上訴得直 改判罰款95萬","url":"https://www.stheadline.com/society/3638953/恆豐酒店與錦倫旅運合謀定價罰款104萬-競委會上訴得直-改判罰款95萬","summary":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間，因不滿同業在酒店的銷售價格較低，多次向酒店施壓，要求與對手落實定價。","summary_short":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間…","digest":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司…","points":["旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間…","競爭事務審裁處裁定他們合謀定價並違反《競爭條例》，去年下令恆豐酒店罰款10.4萬元","競委會認為罰款過低提出上訴，高等法院上訴庭今頒下判詞，裁定競委會上訴得直…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:43:52+08:00","size":1,"keywords":[],"body":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間，因不滿同業在酒店的銷售價格較低，多次向酒店施壓，要求與對手落實定價。競爭事務審裁處裁定他們合謀定價並違反《競爭條例》，去年下令恆豐酒店罰款10.4萬元。競委會認為罰款過低提出上訴，高等法院上訴庭今頒下判詞，裁定競委會上訴得直，指原審判刑未能反映嚴重性及起阻嚇，終改判恆豐酒店罰款95萬元。\n上訴方為競爭事務委員會，而答辯方為擁有恆豐酒店的Prudential Hotel(BVI) Limited。\n競委會指罰款額須超違規行為得益以阻嚇\n上訴方早前提出認為罰款10.4萬元過低，強調罰款額須超越違規行為所得的利益，以作出足夠阻嚇作用，維護公平競爭環境，否則難以體現違反競爭法的嚴重性。恆豐酒店一方則指，罰款10.4萬元已足夠反映其罪責，重申恆豐酒店並非整個安排的發起者，只是充當「促成者」角色。\n判詞指，恆豐酒店一方與其他涉案人士合謀定價，雖然恆豐酒店只負責協調安排，它每月向錦倫收取固定租金，並不受涉案門票銷售額影響，但事件性質嚴重，涉及到合謀定價及排除基本競爭，符合條例下嚴重反競爭行為的定義，屬於價格競爭中典型的侵害行為，而價格競爭在經濟巿場上如同中樞神經系統一般。\n恆豐擔當中間人角色參與程度不被動 \n判詞續指，恆豐酒店即使沒有因應涉事門票銷售額而直接影響收入，它在合謀仍有着關鍵角色，而非純粹被動，例如恆豐酒店會負責把綿倫的價格轉達給Tink Labs、並要求Tink Labs跟隨定價，它擔當了中間人角色；甚至會令人懷疑，如果沒有恆豐酒店的協調，涉案合謀能否落實。\n恆豐酒店一方原被判罰款10.4萬元，這甚至少過它在案發時的租金收入，上訴庭認為競爭事務審裁處在原審判刑時未有充分考慮阻嚇需要，為反映案中合謀的嚴重性及恆豐酒店的參與程度，終改判罰款95萬元、須於42日內支付，並須向競委會一方支付訟費。\n案件編號：CACV218/2025\n法庭記者：王仁昌","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf268f4238c","title":"市建局土瓜灣道／榮光街發展計劃 由信和夥鷹君財團以26.88億元投得","url":"https://www.stheadline.com/society/3638952/市建局土瓜灣道榮光街發展計劃-由信和夥鷹君財團以2688億元投得","summary":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作，發展土瓜灣道／榮光街發展計劃，中標金額為26.88億元。","summary_short":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作…","digest":"市建局公布，經過公開招標程序後…","points":["市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成…","市建局預計項目將於2032年落成","市建局發言人表示，多間主要發展商均有參與是次投標，入標數量與出價均在預期之內…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:42:19+08:00","size":1,"keywords":[],"body":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作，發展土瓜灣道／榮光街發展計劃，中標金額為26.88億元。市建局預計項目將於2032年落成。\n市建局：入標數量與出價均在預期之內\n今次項目於11月11日截標時共接獲三份標書。由市建局董事會設立的招標遴選小組在審慎評估標書後，建議將合約批予「天瑋有限公司」，並獲董事會接納。市建局發言人表示，多間主要發展商均有參與是次投標，入標數量與出價均在預期之內，最終中標價亦相當貼近市價。市建局在與中標財團完成簽訂發展合約後，將以不記名方式適時公布其餘未中標公司的投標金額。\n發揮「小區重建」協同效應\n土瓜灣道／榮光街項目為市建局首個「小區重建新社區」（Victoria Cove Central，簡稱VCC）的最後一期。連同是次批出的項目，整個VCC共八個項目已匯聚八間主要發展商參與，反映小區規劃模式獲市場支持。\n市建局行政總監蔡宏興對參與投標的發展商及財團表示感謝。他指出，今次入標的發展商中，有三間均有參與發展VCC或毗鄰項目，證明業界充分肯定VCC整全規劃的長遠價值。他續稱，新項目將與區內另外七個正施工的重建項目產生協同效應，配合市建局提出的「海—岸—陸」整體規劃方針，營造更具活力的社區，並響應構建「東維港灣區」的願景。\n建兩條行人天橋成「超級連接」 \n根據規劃，是次項目除作商住用途外，亦兼負改善區內步行環境及社區配套的重任。項目將興建兩條行人天橋，貫通港鐵土瓜灣站及毗鄰七個重建項目，形成「超級連接」網絡；同時將提供不少於5,500平方米的非住用樓面面積作社福設施用途，並增設公共空間。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9b20c8a078","title":"聽▶︎港聞｜鄺港智供稱譚方駿鍾意自己／港青可獲智利一年簽證／午夜氣溫料最低約18度｜2026年11月19日","url":"https://news.tvb.com/tc/1207240-聽港聞鄺港智供稱譚方駿鍾意自己港青可獲智利一年簽證午夜氣溫料最低約18度2026年11月19日","summary":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地，其後用相同方法，往返內地和香港，每次都是包船，費用是10萬元，自己有能力支付。","summary_short":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地…","digest":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行…","points":["大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行…","➤ 蔡天鳳碎屍案｜鄺港智供稱譚方駿鍾意自己　「所以三個人就一齊」","行政長官李家超在深圳出席亞太經濟合作組織(APEC)領導人非正式會議…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:25+08:00","size":1,"keywords":[],"body":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地，其後用相同方法，往返內地和香港，每次都是包船，費用是10萬元，自己有能力支付。\n\n➤ 蔡天鳳碎屍案｜鄺港智供稱譚方駿鍾意自己　「所以三個人就一齊」\n\n行政長官李家超在深圳出席亞太經濟合作組織(APEC)領導人非正式會議，期間與多位成員經濟體領袖會面。他表示，與智利總統共同見證簽署工作假期計劃協議，香港青年可獲一年工作假期簽證，為香港首次與拉丁美洲國家合作推出工作假期計劃 。\n\n➤ 李家超：與智利簽署工作假期計劃協議　香港青年可獲一年簽證\n\n受強烈東北季候風影響，早上氣溫轉涼。\n\n➤ 天氣｜早上氣溫轉涼　天文台預測氣溫逐漸下降至午夜最低約18度\n\n巴拿馬當局完成審查長和集團子公司的港口特許經營合約，發現公司與當地政府前官員可能涉嫌違規，將提出刑事訴訟。長和集團早前啟動國際仲裁程序，向巴拿馬當局索償。\n\n➤ 巴拿馬完成審查長和子公司港口特許經營合約　稱或涉嫌違規將提出刑事訴訟\n\n警方搗破兩個電話詐騙中心，更發現騙徒改用固網電話行騙，懷疑是逃避電話卡實名制措施。\n\n➤ 警方搗破兩個電騙中心　發現騙徒改用固網電話行騙疑逃避電話卡實名制\n\n(旁述由AI生成)","image":"https://pro-vod-cdn.tvb.com/681879f8f50f400492bd7d65da705d27/snapshots/dc865f4840324f8495c20ee3aeef31df-00008.jpg","video":"https://pro-vod-cdn.tvb.com/681879f8f50f400492bd7d65da705d27/669796073aa0427d8ab8ad00f46c78ca-eb01212bd90bb3cb4baa3625fdddce1c-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/681879f8f50f400492bd7d65da705d27/snapshots/dc865f4840324f8495c20ee3aeef31df-00008.jpg","lang":"zh-Hant"},{"id":"c32053864b5","title":"澳門大賽車｜首日上演多項練習賽和排位賽 16歲本地女車手首戰F4","url":"https://news.tvb.com/tc/1207266-澳門大賽車首日上演多項練習賽和排位賽16歲本地女車手首戰F4","summary":"第73屆澳門格蘭披治大賽車開鑼，首日上演多項練習賽和排位賽，有16歲的澳門本地女車手，首次出戰澳門四級方程式大賽。賽車再度在澳門街頭飛馳。","summary_short":"第73屆澳門格蘭披治大賽車開鑼，首日上演多項練習賽和排位賽，有16歲的澳門本地女車手，首次出戰澳門四級方程式大賽。","digest":"第73屆澳門格蘭披治大賽車開鑼，首日上演多項練習賽和排位賽，有16歲的澳門本地女車手…","points":["第73屆澳門格蘭披治大賽車開鑼，首日上演多項練習賽和排位賽，有16歲的澳門本地女車手…","首日的澳門格蘭披治大賽車，包括國際汽聯FR世界盃和澳門四級方程式大賽自由練習…","北京旅客柯先生說：「覺得非常刺激和比較精彩，以前只是在電視和網絡上看過…"],"section":"港聞","category":"澳門","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:20+08:00","size":1,"keywords":[],"body":"第73屆澳門格蘭披治大賽車開鑼，首日上演多項練習賽和排位賽，有16歲的澳門本地女車手，首次出戰澳門四級方程式大賽。\n\n賽車再度在澳門街頭飛馳。首日的澳門格蘭披治大賽車，包括國際汽聯FR世界盃和澳門四級方程式大賽自由練習，要挑戰出名高難度的「葡京灣」，多架車撞欄，賽事一度暫停。\n\n北京旅客柯先生說：「覺得非常刺激和比較精彩，以前只是在電視和網絡上看過，沒有實際真正在現場看過比賽，所以看了非常震驚。」\n\n安哥拉留學生說：「這其實是我第一次觀賽。我也很喜歡車，在這看到賽車在賽道飛馳感受太好了。」\n\n除了三個主要觀眾看台，當局在社區多個地點，都設置了大型屏幕轉播賽事，讓市民和旅客即使沒有身處現場，都感受到大賽車的氣氛。\n\n今屆澳門四級方程式大賽，有來自十個國家及地區的十二支車隊挑戰東望洋賽道。現年16歲的澳門女車手劉司鑾，是今屆方程式賽事中唯一的澳門車手，她稱小時候在公園玩電動車，之後接觸小型賽車，亦參加過不同的賽事。\n\nF4車手劉司鑾說：「情況比我想像中更難，模擬器時直路沒那麼跳，出到去時非常跳，起初有些害怕，但之後開始有信心。我也輸了很多場，也嬴過很多場比賽，但我覺得總體來說，過程最重要，學到的東西可以幫助你成長。」\n\nF4車手劉司鑾母親說：「作為媽媽，我也很擔心，但可以幫女兒找到她的興趣和發展，我和我丈夫也很支持，希望可以陪她走下去，看看可以走得多遠。」","image":"https://pro-vod-cdn.tvb.com/720540ffd02a48119404f3bf6614a151/snapshots/6ce61a3f0f5541c68d8d673ff45c5e9b-00008.jpg","video":"https://pro-vod-cdn.tvb.com/720540ffd02a48119404f3bf6614a151/d4393b0f2ebc4ebc85faff40816eeea7-61ca82364f71659469ca0c04d77d4a24-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/720540ffd02a48119404f3bf6614a151/snapshots/6ce61a3f0f5541c68d8d673ff45c5e9b-00008.jpg","lang":"zh-Hant"},{"id":"c5cf0524a3d","title":"藍田啟田道中學疑有「尿袋」起火冒煙 14歲男學生燒傷送院","url":"https://www.stheadline.com/breaking-news/3638948/藍田啟田道中學疑有尿袋起火冒煙-14歲男學生燒傷送院","summary":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。","summary_short":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。","digest":"下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄…","points":["今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前…","事發時一名14歲男學生在校內使用「尿袋」，其間疑「尿袋」短路起火冒煙，男學生被燒傷…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:13:55+08:00","size":1,"keywords":[],"body":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。\n據了解，事發時一名14歲男學生在校內使用「尿袋」，其間疑「尿袋」短路起火冒煙，男學生被燒傷，幸仍然清醒，由救護車送往聯合醫院治理。\n消防到場調查起火原因。曾志恒攝\n現場為藍田啟田道5號聖公會基孝中學。曾志恒攝","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cda803778ca","title":"銅鑼灣時代廣場電器舖遇竊 失$188萬相機鏡頭 疑男職員監守自盜","url":"https://www.stheadline.com/breaking-news/3639024/銅鑼灣時代廣場電器舖遇竊-失188萬相機鏡頭-疑男職員監守自盜","summary":"今日（19日）傍晚6時許，警方接獲銅鑼灣勿地臣街1號時代廣場一間電器舖的負責人報案，指上址有61部相機及55個相機鏡頭不翼而飛，總值約188萬元，懷疑被一名年約40歲的男職員盜去。","summary_short":"今日（19日）傍晚6時許，警方接獲銅鑼灣勿地臣街1號時代廣場一間電器舖的負責人報案…","digest":"傍晚6時許，警方接獲銅鑼灣勿地臣街1號時代廣場一間電器舖的負責人報案…","points":["今日（19日）傍晚6時許，警方接獲銅鑼灣勿地臣街1號時代廣場一間電器舖的負責人報案…","警方經初步調查，案件列盜竊，交由灣仔警區刑事調查隊第七隊跟進，暫未有人被捕","現場為銅鑼灣時代廣場的豐澤"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:18:43+08:00","size":1,"keywords":[],"body":"今日（19日）傍晚6時許，警方接獲銅鑼灣勿地臣街1號時代廣場一間電器舖的負責人報案，指上址有61部相機及55個相機鏡頭不翼而飛，總值約188萬元，懷疑被一名年約40歲的男職員盜去。警方經初步調查，案件列盜竊，交由灣仔警區刑事調查隊第七隊跟進，暫未有人被捕。\n據悉，現場為銅鑼灣時代廣場的豐澤。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c29459da818","title":"六合彩結果：頭獎無人中 二獎一注中派210幾萬","url":"https://news.tvb.com/tc/1207319-六合彩結果頭獎無人中二獎一注中派210幾萬","summary":"六合彩號碼：12、18、32、45、47、49，特別號碼：41。頭獎無人中。","summary_short":"六合彩號碼：12、18、32、45、47、49，特別號碼：41。","digest":"六合彩號碼：12、18、32、45、47、49，特別號碼：41","points":["六合彩號碼：12、18、32、45、47、49，特別號碼：41"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T21:27+08:00","size":1,"keywords":[],"body":"六合彩號碼：12、18、32、45、47、49，特別號碼：41。\n\n頭獎無人中。二獎一注中，派210幾萬。","image":"https://pro-vod-cdn.tvb.com/e3ae0ea21e4d42cf9c5ae6d0026fbdf7/snapshots/b2e4c495bcb2420e9c16327e3746637f-00002.jpg","video":"https://pro-vod-cdn.tvb.com/e3ae0ea21e4d42cf9c5ae6d0026fbdf7/db450083c37641818d121ca934844a1f-579925b727ab0e046c70239e1f4ed709-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e3ae0ea21e4d42cf9c5ae6d0026fbdf7/snapshots/b2e4c495bcb2420e9c16327e3746637f-00002.jpg","lang":"zh-Hant"},{"id":"c401c39391e","title":"新聞掏寶｜大麻屋","url":"https://news.tvb.com/tc/1205356-新聞掏寶大麻屋","summary":"港人由加拿大回流，將海外物業放租，沒想過會淪為大麻種植場。屋主稱：「屋內真的嚇壞人，我的屋裡有兩間房間和地庫，遠一點有個車房，頗大的，差不多到處都種了。","summary_short":"港人由加拿大回流，將海外物業放租，沒想過會淪為大麻種植場。","digest":"港人由加拿大回流，將海外物業放租，沒想過會淪為大麻種植場","points":["港人由加拿大回流，將海外物業放租，沒想過會淪為大麻種植場","屋主稱：「屋內真的嚇壞人，我的屋裡有兩間房間和地庫，遠一點有個車房，頗大的，差不多到處都種了","一名男子說：「他們不會巡查，他們不會去看，若可避免，他們不想惹麻煩"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:00+08:00","size":1,"keywords":[],"body":"港人由加拿大回流，將海外物業放租，沒想過會淪為大麻種植場。\n\n屋主稱：「屋內真的嚇壞人，我的屋裡有兩間房間和地庫，遠一點有個車房，頗大的，差不多到處都種了。」\n\n宋燕華指出：「意想不到，根本想不到他們可以這樣種大麻。」\n\n在加拿大，有販賣大麻的人更公開指，專門向香港人的物業下手。\n\n一名男子說：「他們不會巡查，他們不會去看，若可避免，他們不想惹麻煩。」\n\n香港屋主可以如何自保？《新聞掏寶》和大家重溫2003年專題。\n\n警員破門而入後，疑匪及時逃脫，警方相信他們是在這裡居住，屋內的電視仍然開著，電腦還沒關上，廚房有一碗新鮮的肉。警員要找的東西就在睡房，這些是大麻，風扇還是開著。\n\n這些大麻種了沒多久，還要兩個月才收成。在室內種大麻，要大量的保溫和照明儀器，種大麻的所謂「園丁」，要將屋內的電線線路大肆改裝，加大供電量，一般大麻屋每月電費高達六千港元。這個水桶就加入了肥料，定時澆水，這樣會否令室內濕度很高，亦成為警方破案的線索。\n\n加拿大皇家騎警烈治文市輔警主管羅錦添指出：「種植大麻一定需要很高的溫度，所以燈也是特別光亮，很多時候會發現門的玻璃窗外，有很多水珠凝結在玻璃窗，甚至當你經過這間屋的時候，你會聽到一些嗡嗡聲的聲音，這些聲音是來自機器發出的聲音。」\n\n要種大麻，「園丁」對房屋造成很大破壞，例如為了通風，就鑿穿了這面牆，將通風喉管延伸到旁邊的書房。\n\n宋燕華由香港來溫哥華三十年，她的房子曾經被人種大麻。\n\n宋燕華表示：「就是這間電視房，他只用一間房間來種，這些地板全都是損壞的，你看看，如果沒有損壞應該是清潔的。意想不到，根本想不到他們可以這樣種大麻。」\n\n警方估計在大溫哥華地區，有五千至七千間這樣的大麻屋。\n\n點擊觀看節目重溫","image":"https://pro-vod-cdn.tvb.com/7874e64ca4014f77b9ed2d4dcf5640df/snapshots/8ce6c88764724b6194c678be960a5567-00008.jpg","video":"https://pro-vod-cdn.tvb.com/7874e64ca4014f77b9ed2d4dcf5640df/3d07bd17ce24405b90efa93f06378292-bfbc1cb232e33f9e4efe27b8646a798b-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/7874e64ca4014f77b9ed2d4dcf5640df/snapshots/8ce6c88764724b6194c678be960a5567-00008.jpg","lang":"zh-Hant"}]},{"name":"內地","total":51,"items":[{"id":"c9053f3109c","title":"【和合共生】习言道｜习近平与深圳的“大故事”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734813.shtml","summary":"中新网11月19日电 题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方。","summary_short":"中新网11月19日电 题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方。","digest":"题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方","points":["中新网11月19日电 题：习近平与深圳的“大故事”","“深圳是一个有大故事的地方","11月18日，在亚太经合组织第三十三次领导人非正式会议欢迎晚宴上…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:04:42+08:00","size":4,"keywords":[],"body":"中新网11月19日电 题：习近平与深圳的“大故事”\n\n　　“深圳是一个有大故事的地方。”\n\n　　11月18日，在亚太经合组织第三十三次领导人非正式会议欢迎晚宴上，习近平主席这样讲起深圳的故事。\n\n　　深圳之于中国，不只是一座城市的发展故事。\n\n　　在过去40多年的时间轴上，深圳的故事里，一条改革开放的主线贯穿其中。\n\n　　1978年，党的十一届三中全会开启改革开放大幕，也是在那一年，还在清华大学读书的习近平第一次来到深圳，彼时他看到的“还是一个小渔村”。\n\n　　2020年，在参观庆祝深圳经济特区建立40周年展览时，习近平总书记回忆道：“40多年前，我来深圳，去中英街，看到两边差距确实太大了，一边是破烂木板房，一边是带空调的气派小楼。当时就感觉到老百姓有着强烈的改变生活和命运的愿望。”\n\n　　1979年，蛇口工业区开山炮响，深圳的故事就此开篇。\n\n　　40多年沧海桑田，改革开放成就了深圳，也改变了中国。一个小渔村发展成为现代化国际大都市，一个大国实现从“赶上时代”到“引领时代”的历史性跨越。\n\n　　奇迹背后蕴藏着发展密码。\n\n　　习近平总书记曾形容，深圳是“中国特色社会主义在一张白纸上的精彩演绎”。弹指间40多年过去，深圳的故事充分证明，中国选择的这条道路，不仅走得对、走得通，而且走得稳、走得好。\n\n　　在过去10多年的时间轴上，深圳的故事里，高质量发展的步伐坚实而有力。\n\n　　党的十八大后首次赴地方考察，习近平总书记便来到深圳。此后，在改革开放40周年、深圳经济特区建立40周年等特殊节点，习近平总书记又多次来到深圳。\n\n　　2012年，在莲花山公园，他瞻仰邓小平铜像，亲手种下一棵高山榕树，发出“坚定不移推进改革开放”的动员令。\n\n　　2018年，在前海石前，他寄语深圳“在共建‘一带一路’、推进粤港澳大湾区建设、高水平参与国际合作方面发挥更大作用”。\n\n　　2020年，再次来到深圳，他展望深圳的未来，“到新中国成立100年时，我们将建成社会主义现代化强国，实现第二个百年奋斗目标，那时的深圳又将是另外一番景象”。\n\n　　党的十八大以来，深圳人均GDP从2012年的12.32万元增至2025年的21.38万元，一大批领军企业引领全球产业变革，外贸进出口规模居全国内地城市首位……\n\n　　数字背后，一个开放、创新、合作的深圳，成为新时代中国高质量发展的生动注脚。\n\n　　在18日的欢迎晚宴上，习近平主席指出，看千年的中国去西安，看五百年的中国去北京，看一百年的中国去上海，看五十年的中国来深圳。\n\n　　今天的深圳是中国高水平对外开放的窗口，是中国集群式创新的前沿，也是中国同各方合作共赢的热土。不断续写的深圳故事，展现着中国式现代化的万千气象。\n\n　　｜总策划：俞岚\n\n　　｜策划：周锐\n\n　　｜统筹：马学玲\n\n　　｜执笔：阚枫 袁秀月\n\n　　｜审校：孙静波 邵萌\n\n　　｜视觉：张舰元 雷宇竺\n\n　　｜中国新闻网“习言道”工作室出品\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"【和合共生】习言道｜习近平与深圳的“大故事”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734813.shtml","source_display":"中新網 時政","published_at":"2026-11-19T19:04:42+08:00","category":"內地","digest":"题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方"},{"title":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075480.shtml","source_display":"中新視頻","published_at":"2026-11-19T18:44:24+08:00","category":"內地","digest":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事"},{"title":"【和合共生】习言道｜构建中美建设性战略稳定关系是前无古人的开创性事业","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734801.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:39:50+08:00","category":"內地","digest":"【和合共生】习言道｜构建中美建设性战略稳定关系是前无古人的开创性事业"},{"title":"和合共生｜APEC聊些啥？又是如何运转的？","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075457.shtml","source_display":"中新視頻","published_at":"2026-11-19T16:13:02+08:00","category":"內地","digest":"和合共生｜APEC聊些啥？又是如何运转的？"}],"cross":{"total":4,"angles":[{"point":"和合共生｜APEC聊些啥？又是如何运转的？","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075457.shtml"},{"point":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075480.shtml"},{"point":"题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734813.shtml"},{"point":"【和合共生】习言道｜构建中美建设性战略稳定关系是前无古人的开创性事业","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734801.shtml"}]}},{"id":"c224470cc17","title":"深圳APEC｜王毅點評會議成果 「達成『深圳展望』里程碑」","url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議成果-達成深圳展望里程碑","summary":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果。","summary_short":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果。","digest":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果","points":["外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果","會原訂於晚上7時30分，大約6時許，大會通知記者會推遲至9時30分才舉行","由於傳媒希望能即時了解中方在APEC的總結，現場約200名中外記者即使經過連日採訪…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:10:15+08:00","size":3,"keywords":[],"body":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果。\n記者會原訂於晚上7時30分，大約6時許，大會通知記者會推遲至9時30分才舉行。由於傳媒希望能即時了解中方在APEC的總結，現場約200名中外記者即使經過連日採訪，面對疲倦的身軀仍然堅持等候。\n大約於10時許，外長王毅終於現身記者會，一踏上講台即向在場記者表示「讓大家久等了，各位辛苦了」。他解釋自己由於要從機場趕回，因而延遲，之後再作出APEC的總結，點出今次會議6大成果。\n 這次會議達成了「深圳展望」，是APEC這麼多年最重要的成果，也是APEC合作新的里程碑。國家主席習近平稱，當前國際形勢變換交織，亞太地區應當維持穩定，搭建開放合作的橋樑，激發創新生態的動力，創建開放創新、包容發展的亞太共同體，續寫亞太奇跡的新里程。\n 搭建亞太共同平台「四樑八柱」\n 我們著眼舉例目標，打造合作機制，提出合作倡議，制定行動。\n 提出亞太自貿區的願景，會議通過了APEC貿易數字化的框架，會議期間還發表外交和貿易部長雙部長的聲明，這些成果推動亞太自貿區建設與時俱進。\n 升級亞太的互聯互通，如智慧海關等成果作為經濟體之間的橋樑，為經濟體合作提供堅實支撐。\n 賦能亞太創新增長，重點就人工智能新興技術，促進高質量的充分就業、提升工作服務水平，加強數字集中設施建設等提出意見達成共識，\n 打造亞太合作的落地平台，如在清潔能源、中小企業發展等領域設立新的合作基礎。尊重各地區差異性，支持一批促發展、惠民生的物質舉措，涉及交通運輸、公共衛生、能源、糧食安全等。\n相關新聞：深圳APEC︱習近平倡攜手搭建亞太共同體「四樑八柱」︱附講話全文","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC｜王毅點評會議成果 「達成『深圳展望』里程碑」","url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議成果-達成深圳展望里程碑","source_display":"星島頭條","published_at":"2026-11-19T23:10:15+08:00","category":"內地","digest":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果"},{"title":"深圳APEC｜全家福長巾「紅藍雙絕」 拆解紅色「順德香雲紗」國禮手作奧秘","url":"https://www.stheadline.com/realtime-china/3638940/深圳APEC全家福長巾紅藍雙絕-拆解紅色順德香雲紗國禮手作奧秘","source_display":"星島頭條","published_at":"2026-11-19T17:30:54+08:00","category":"內地","digest":"11月19日，在2026年APEC領導人非正式會議的全家福合影…"},{"title":"深圳APEC｜李家超晤新加坡總理黃循財 感謝支持香港加入RCEP 邀星企發掘河套商機","url":"https://www.stheadline.com/politics/3638938/深圳APEC李家超晤新加坡總理黃循財-感謝支持香港加入RCEP-邀星企發掘河套商機","source_display":"星島頭條","published_at":"2026-11-19T17:12:39+08:00","category":"港聞","digest":"行政長官李家超於下午在深圳出席亞太經合組織相關活動期間，與新加坡總理黃循財會面"}],"cross":{"total":3,"angles":[{"point":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議成果-達成深圳展望里程碑"},{"point":"11月19日，在2026年APEC領導人非正式會議的全家福合影…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-china/3638940/深圳APEC全家福長巾紅藍雙絕-拆解紅色順德香雲紗國禮手作奧秘"},{"point":"行政長官李家超於下午在深圳出席亞太經合組織相關活動期間，與新加坡總理黃循財會面","sources":["星島頭條"],"url":"https://www.stheadline.com/politics/3638938/深圳APEC李家超晤新加坡總理黃循財-感謝支持香港加入RCEP-邀星企發掘河套商機"}]}},{"id":"c1a72538eb2","title":"习近平就大国如何正确相处提出4点看法","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734794.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","中俄美三国国情不同，谁也改变不了谁，这是历史形成的，也是各自人民的自主选择","要坚持不干涉别国内政，不干涉彼此内部事务"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T18:15:33+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平就大国如何正确相处、共同为世界和平托底提出4点看法：\n\n　　第一，坚持相互尊重。相互尊重是大国交往的基本准则。中俄美三国国情不同，谁也改变不了谁，这是历史形成的，也是各自人民的自主选择。正确的态度是彼此尊重、求同存异、共同发展。要尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重彼此核心利益和重大关切。要坚持不干涉别国内政，不干涉彼此内部事务。在涉及对方的重大敏感问题上，提前沟通、换位思考、谨慎行事，特别是不能触碰对方的底线。\n\n　　第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线，努力跨越“修昔底德陷阱”。中俄美都是二战主要战胜国，应当坚定维护战后国际秩序，维护《联合国宪章》宗旨，捍卫来之不易的二战胜利成果。核武器是悬在人类头上的“达摩克利斯之剑”，应该全面禁止并彻底销毁，最终建立无核武器世界。核战争打不赢也打不得。要尽一切努力防止核战争，遵守《不扩散核武器条约》，维护全球战略稳定。\n\n　　第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。应该摒弃冷战思维，加强经贸合作，将资源大国、制造大国、消费大国的各自优势贯通起来，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n\n　　第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。当前，全球各种纷争持续不断，热点问题按下葫芦浮起瓢，国际社会期待大国多做劝和促谈工作。中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平就大国如何正确相处提出4点看法","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734794.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:15:33+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"界面晚报 | 习近平就大国如何正确相处提出4点看法；商务部谈当前消费市场表现","url":"https://www.jiemian.com/article/15348271.html","source_display":"界面新聞","published_at":"2026-11-19T17:27:00+08:00","category":"","digest":"习近平就大国如何正确相处提出4点看法  11月19日下午…"},{"title":"习近平就大国如何正确相处提出4点看法","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734740.shtml","source_display":"中新網 時政","published_at":"2026-11-19T17:15:34+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}],"cross":{"total":3,"angles":[{"point":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","sources":["中新網 時政","中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734794.shtml"},{"point":"习近平就大国如何正确相处提出4点看法  11月19日下午…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15348271.html"}]}},{"id":"cc41f510e8b","title":"（深圳APEC）习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特…","digest":"11月19日下午…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织…","习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道…","中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:27:46+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。\n\n　　习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道，确立了“中美建设性战略稳定关系”的新定位，并赋予其“基于尊重、公平、对等”的新内涵，受到中美两国人民认可和国际社会欢迎。中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性。我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。\n\n　　习近平强调，构建中美建设性战略稳定关系是前无古人的开创性事业，需要敢闯敢试、脚踏实地、善作善成。中美元首外交的引领作用不可替代。要延续中美关系目前的稳定向好势头，关键是要在落实元首共识上付诸行动。双方团队的沟通也要跟上。要拉长合作清单、压缩问题清单，一时解决不了的分歧要建设性管控，防止矛盾升级。在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。经贸领域要加强沟通，解决彼此关切，争取互利互惠。两国在禁毒、非法移民遣返、打击电信网络诈骗等领域的合作卓有成效，可以本着尊重、公平、对等的原则继续加强合作。中美应当加强沟通和协调，防范人工智能安全风险，确保人工智能始终处于人类控制之下。\n\n　　特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。\n\n　　双方认为此次会晤是积极、建设性的，同意制定建设性战略稳定关系行动计划，落实两国元首共识，构建基于尊重、公平、对等的中美建设性战略稳定关系。\n\n　　两国元首还就共同关心的国际和地区问题交换了意见。\n\n　　蔡奇、王毅、何立峰、黄坤明等参加会见。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml","source_display":"中國新聞網","published_at":"2026-11-19T17:27:46+08:00","category":"內地","digest":"11月19日下午…"},{"title":"习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734694.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:22:55+08:00","category":"內地","digest":"11月19日下午…"},{"title":"新华图讯丨习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734624.shtml","source_display":"中新網 時政","published_at":"2026-11-19T15:24:16+08:00","category":"內地","digest":"新华图讯丨习近平会见美国总统特朗普"}],"cross":{"total":3,"angles":[{"point":"11月19日下午…","sources":["中國新聞網","中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml"},{"point":"新华图讯丨习近平会见美国总统特朗普","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734624.shtml"}]}},{"id":"ca82478b499","title":"中国担任2026年亚太经合组织东道主主办会议和活动清单","url":"https://www
