          "body": "文｜青橙财经 青沐\n\n编辑｜六子\n\n扫地机器人行业，正在迎来新一轮深度大洗牌。\n\n奥维云网数据显示，2026年上半年国内扫地机零售量为309万台，较上年同期减少约14.9万台，同比下滑4.6%；零售额98亿元，同比下跌4%。\n\n行业数据并不乐观，但扫地机龙头品牌却越战越勇。“扫地机双雄”科沃斯和石头科技相继发布2026年三季报，两家公司的营收均保持增长，尤其海外业务贡献了主要增量。\n\n海外增长不只国内双雄。IDC数据显示，2026年第二季度，全球扫地机市场出货788.5万台，前五大厂商拿走了75%的出货量份额和82%的销售额份额，而这五大厂商，全部来自中国。\n\n一边是国内市场量价齐跌，一边是海外市场持续高增，出海已经成为行业的分水岭。但引擎轰鸣之下，出海也并非都是坦途。\n\n01 不出海，就出局\n\n2026年上半年，国内扫地机的零售额和零售量双双出现下滑。同期，据洛图科技数据，整个扫地机行业减少了11个品牌和73款机型，大量千元白牌和旧款机型被销售渠道集体出清。\n\n图源洛图科技\n\n如今，扫地机行业正在经历一个尴尬的换挡期：产品越来越难卖，即便卖得动，也卖不上价。\n\n一方面，行业高度内卷，扫地机陷入“微创新”瓶颈。\n\n过去几年，扫地机市场的全面爆发，首先得益于产品的代际创新。\n\n2016年以前，扫地机虽然具备全局规划清扫能力，但仍以“干扫”为主；一直到2016年后，集吸尘和拖洗功能一体的干湿两用扫地机才开始面市。\n\n2020年之后，扫地机厂商在技术不断突破，比如石头科技推出智能感知算法；云鲸推出带自动清洗拖布功能的基站，扫地机逐渐向着更多元形态发展。\n\n图源天眼查-云鲸专利情况\n\n比如扫拖一体机器人、扫拖洗烘一体机器人、智能洗地机等，还有融合集尘+洗拖布+烘干+上下水+除菌等多功能的全能型基站，进一步解放用户双手。\n\n图源方正证券\n\n但在这之后，行业进入“抢蛋糕”阶段，行业的竞争焦点开始转向营销和价格，技术创新反而一直在“挤牙膏”，功能难免越来越同质化。\n\n另一方面，消费者正逐渐对扫地机祛魅。\n\n在社交平台上，不少消费者吐槽扫地机“好看不好用”，比如避障不到位，清洁有死角；需要用户二次清洁，不能完全解放双手；容易出现毛发缠绕，没用多久就失灵等。\n\n图源小红书\n\n归根到底，消费者不愿意买账，是因为扫地机还不够好用。然而，要让产品真正好用，需要长期的研发投入，但在行业价格战下，厂商的微薄利润根本撑不起这场攻坚战。\n\n比如科沃斯和石头科技，这几年营收规模虽然一直在涨，但利润规模反而在“瘦身”。2025年，科沃斯和石头科技的销售费用率分别为31.2%和26.2%，但研发费用率分别为5.1%和7.6%。\n\n图源公开财报\n\n当国内市场的增长和利润天花板近在眼前，向外走，就成了唯一的路。\n\n02 向海外市场“要利润”\n\n过去三年，中国清洁家电的出海明显提速。\n\nIDC数据显示，2026年第二季度，全球扫地机器人市场出货量厂商份额前五名分别为石头、追觅、科沃斯、小米与MOVA，中国厂商拿下大半江山。\n\n图源IDC\n\n以科沃斯和石头科技为例，两家公司的海外收入占比都持续提高，且海外收入增速明显高于国内。\n\n图源公开财报\n\n但有意思的是，虽然两家公司的海外占比都已过半，但利润走向却一个向上、一个向下。\n\n石头科技前三季度实现归母净利润14.66亿元，同比增长41.23%；科沃斯前三季度实现归母净利润13.69亿元，同比下滑3.47%，三季度的归母净利润更同比下滑72.43%。\n\n目前来看，国内主流品牌出海时间不同、落子不同，有人先啃下海外线下渠道，有人靠营销一路高歌猛进，利润分化的答案，就藏在这些差异里。\n\n石头科技的打法是“深扎根、向高端要利润”。\n\n它出海较早，一开始便瞄准欧美成熟市场，用产品力占住高端价位段。2023年，其在美国亚马逊800美元以上价格段份额占比一度高达62%。\n\n此后，石头科技没有将自己绑定在线上渠道，而是积极跟北美Costco、沃尔玛、欧洲MediaMarkt等主流零售体系合作，通过线上+线下双渠道提升品牌高端形象。\n\n正因如此，其才能在今年材料成本普涨的背景下，实现利润逆势增长——高端市场为其贡献了更高的溢价空间；而丰富的渠道布局又避开了亚马逊Prime Day错期的影响。\n\n追觅虽然出海较晚，却更重营销，实现了更快扩展。它在海外市场同时布局室内清洁、个护小家电、大家电等，以多品类矩阵推动业务的爆发式增长。追觅创始人俞浩曾透露，海外市场占总收入80%。\n\n不过，高举高打也有代价。据界面新闻统计，仅2026年前两个月，追觅在春晚、超级碗等渠道的投入预计不低于5亿元。营销能否一直支撑销量增长，仍待时间检验。\n\n科沃斯出海也较晚，一直到今年二季度，其海外业务收入占比才首次超过国内。\n\nCEO钱程选择另辟蹊径，通过布局割草机器人、擦窗机器人、泳池机器人等新兴品类，试图用新场景对冲扫地机的增长天花板。但这些新兴品类的市场规模尚小，公司研发、营销投入却要先行，难免在短期内拖累利润。\n\n今年前三季度，科沃斯的销售费用为41.23亿元，同比增长5.44%，销售费用率约27.51%。虽然公司已在努力降费，但销售费用率仍较石头科技（21.95%）略高。\n\n还有一些品牌已在内卷中大幅滑落。据奥维云网数据，今年9-10月的大促周期，云鲸线上销售额同比下降51%，成为下滑幅度最大的品牌。分析认为其产品更新节奏太慢，错失了全能基站的卡位期；前两年以营销换增长又碰上流量红利退潮，影响了公司的发展节奏。\n\n此外，小米、大疆等跨界玩家趁势崛起，虽然市场份额占比不高，但由于自带品牌流量，依托自身的生态链和渠道进行铺货，成本压力相对更小，出海之路也走得更顺一些。\n\n03 出海未必“一帆风顺”\n\n出海成为必然选择，但并非一路无忧，政策、关税、渠道等每一项的变动，都可能将企业难住。\n\n最大的不确定性来自政策变动。\n\n今年7月，美国联邦通信委员会（FCC）把“外国生产的先进机器人设备”列入受控清单，按照其给出的标准（能自主导航、带传感器、能联网等），部分扫地机将在此列。\n\n除了美国市场，欧洲市场也在增加准入壁垒。2025年11月，欧盟委员会对原产于中国的割草机器人发起反倾销调查，拟征收45.6%-53.3%的反倾销税。\n\n过去，中国厂商依靠成本优势和供应链效率，撬开了海外市场的大门，再加上营销和渠道的一轮猛攻，顺利在海外市场站稳了脚跟。可一旦碰上政策变动的“黑天鹅”，这些招数就仿佛一拳打在了空气里。\n\n更难的挑战在于，海外市场竞争也悄然加速。\n\n表面上看，中国扫地机在全球市场的销量和销额依然双双上涨，但当所有玩家都集体出海，那么海外市场就从蓝海被染成了红海。\n\n据IDC数据，今年二季度传统旺季，全球清洁机器人的出货量增速已有明显下滑。用户需求出现了变化，成本压力还在上涨，中国厂商要在海外挤出更多利润，不能只靠老经验。\n\n图源IDC\n\n首先，要扎根海外市场，不只是把货卖出去。\n\n目前，石头科技、追觅等都已在海外设立生产基地，除此以外，它们的渠道和服务中心也陆续“沉”在海外。\n\n比如石头科技从2023年起，已在美、德、日、韩等地设立多个区域办公室和售后服务中心，还将售后服务做成了长期生意，出售清洁家电的拖布、滤网、尘袋等配件。\n\n图源石头科技官网\n\n其次，要做精细化运营，抓住海外用户痛点。\n\n中国扫地机走向海外，很容易遭遇水土不服。比如国内家庭以硬质地面为主，欧美家庭普遍地毯多、户型大、养宠比例高，这些差异决定了产品定义必须本地化。\n\n因此，石头科技在2023年推出深度清洁地毯模式，会对地毯区域进行二次清扫；追觅的宠物关爱模式已经迭代至5.0，支持宠物巡航看护、识别宠物周边污渍等功能。\n\n图源互联网\n\n最后，聚焦更大的家庭清洁场景。\n\n目前来看，头部玩家基本都在向全场景智能生态跃迁，但厂商布局的品类越多，越需要思考如何围绕场景做深做透，品类之间的技术复用和场景联动，才是这场生态战的胜负手。\n\n以科沃斯为例，旗下地宝、窗宝、割草机器人都由同一个AI系统来操控，它们之间会共享环境感知信息，对地面、立面、室内等区域的全方位打理，通过布局场景收获增量。\n\n04 写在最后\n\n扫地机出海早已不是选择题，而是必答题。追觅创始人俞浩甚至直白地表示，“海外市场的利润占比更高”。\n\n想要拿下“更贵的鱼”，势必也会遭遇“更大的风浪”。中国清洁家电厂商勇闯海外，就要改变姿势，学会跟当地人做生意。\n\n本文为转载内容，授权事宜请联系原著作权人。扫地机器人 全球市场\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n扫地机龙头，集体出海“找利润”\n\n国内下滑，海外淘金。\n\n青橙财经 · 2026/11/19 09:03\n\n图片来源：界面图库\n\n文｜青橙财经 青沐\n\n编辑｜六子\n\n扫地机器人行业，正在迎来新一轮深度大洗牌。\n\n奥维云网数据显示，2026年上 CEO钱程选择另辟蹊径，通过布局割草机器人、擦窗机器人、泳池机器人等新兴品类，试图用新场景对冲扫地机的增长天花板。但这些新兴品类的市场规模尚小，公司研发、营销投入却要先行，难免在短期内拖累利润。\n\n今年前三季度，科沃斯的销售费用为41.23亿元，同比增长5.44%，销售费用率约27.51%。虽然公司已在努力降费，但销售费用率仍较石头科技（21.95%）略高。\n\n还有一些品牌已在内卷中大幅滑落。据奥维云网数据，今年9-10月的大促周期，云鲸线上销售额同比下降51%，成为下滑幅度最大的品牌。分析认为其产品更新节奏太慢，错失了全能基站的卡位期；前两年以营销换增长又碰上流量红利退潮，影响了公司的发展节奏。\n\n此外，小米、大疆等跨界玩家趁势崛起，虽然市场份额占比不高，但由于自带品牌流量，依托自身的生态链和渠道进行铺货，成本压力相对更小，出海之路也走得更顺一些。\n\n03 出海未必“一帆风顺”\n\n出海成为必然选择，但并非一路无忧，政策、关税、渠道等每一项的变动，都可能将企业难住。\n\n最大的不确定性来自政策变动。\n\n今年7月，美国联邦通信委员会（FCC）把“外国生产的先进机器人设备”列入受控清单，按照其给出的标准（能自主导航、带传感器、能联网等），部分扫地机将在此列。\n\n除了美国市场，欧洲市场也在增加准入壁垒。2025年11月，欧盟委员会对原产于中国的割草机器人发起反倾销调查，拟征收45.6%-53.3%的反倾销税。\n\n过去，中国厂商依靠成本优势和供应链效率，撬开了海外市场的大门，再加上营销和渠道的一轮猛攻，顺利在海外市场站稳了脚跟。可一旦碰上政策变动的“黑天鹅”，这些招数就仿佛一拳打在了空气里。\n\n更难的挑战在于，海外市场竞争也悄然加速。\n\n表面上看，中国扫地机在全球市场的销量和销额依然双双上涨，但当所有玩家都集体出海，那么海外市场就从蓝海被染成了红海。\n\n据IDC数据，今年二季度传统旺季，全球清洁机器人的出货量增速已有明显下滑。用户需求出现了变化，成本压力还在上涨，中国厂商要在海外挤出更多利润，不能只靠老经验。\n\n图源IDC\n\n首先，要扎根海外市场，不只是把货卖出去。\n\n目前，石头科技、追觅等都已在海外设立生产基地，除此以外，它们的渠道和服务中心也陆续“沉”在海外。\n\n比如石头科技从2023年起，已在美、德、日、韩等地设立多个区域办公室和售后服务中心，还将售后服务做成了长期生意，出售清洁家电的拖布、滤网、尘袋等配件。\n\n图源石头科技官网\n\n其次，要做精细化运营，抓住海外用户痛点。\n\n中国扫地机走向海外，很容易遭遇水土不服。比如国内家庭以硬质地面为主，欧美家庭普遍地毯多、户型大、养宠比例高，这些差异决定了产品定义必须本地化。\n\n因此，石头科技在2023年推出深度清洁地毯模式，会对地毯区域进行二次清扫；追觅的宠物关爱模式已经迭代至5.0，支持宠物巡航看护、识别宠物周边污渍等功能。\n\n图源互联网\n\n最后，聚焦更大的家庭清洁场景。\n\n目前来看，头部玩家基本都在向全场景智能生态跃迁，但厂商布局的品类越多，越需要思考如何围绕场景做深做透，品类之间的技术复用和场景联动，才是这场生态战的胜负手。\n\n以科沃斯为例，旗下地宝、窗宝、割草机器人都由同一个AI系统来操控，它们之间会共享环境感知信息，对地面、立面、室内等区域的全方位打理，通过布局场景收获增量。\n\n04 写在最后\n\n扫地机出海早已不是选择题，而是必答题。追觅创始人俞浩甚至直白地表示，“海外市场的利润占比更高”。\n\n想要拿下“更贵的鱼”，势必也会遭遇“更大的风浪”。中国清洁家电厂商勇闯海外，就要改变姿势，学会跟当地人做生意。\n\n本文为转载内容，授权事宜请联系原著作权人。",

          "body": "界面新闻记者 | 黄华\n界面新闻编辑 | 谢欣\n\n11月初，上海市卫生健康委、上上海市医保局等共同启动“医疗健康数据融合开发利用工作专班”，专班将响应国家数据局医疗健康行业数据资源开发利用攻坚行动，承担推进全市卫生健康数据的制度建设、融合开发、场景创新、市场运营等任务，更好释放医疗数据要素价值。\n\n此前在今年7月，《上海市卫生健康发展\"十五五\"规划》提出，到2030年，\"人工智能+卫生健康\"应用场景要在全市医疗机构实现100%覆盖。\n\n这是上海对于人工智能在医疗领域的最新规划，在一系列政策加持下，人工智能技术在上海医院的应用速度正在加速。\n\n界面新闻梳理发现，包括国家人工智能应用中试基地携手联影智能研发出全球首创的“胸部一扫多查智能体”，同济大学附属东方医院牵头研发的Med-Go医疗大模型等、上海交通大学医学院附属新华医院、海军军医大学第一附属医院以及辽宁沈阳的中国医科大学附属盛京医院，与达摩院合作研发的基于CT影像的人工智能肠癌筛查模型DAMO COCA 2.0已各自在多家上海医院落地部署。\n\n据不完全统计，截至今年年初，上海已完成医疗大模型登记20款，多家三甲医院大模型上线。\n\n政策出台至今，阶段性成果已初步显现。上海医疗机构对于人工智能的探索已经开始改写一个个具体病例的走向。48岁的陈彤（化名），就是受益者之一。在一次意外车祸后，他意外被筛查出结直肠癌。提示这一风险的，是一套人工智能系统。\n\n陈彤是一名AI电气工程师。今年6月28日，他骑电动车出门时被一辆汽车撞倒，随后被就近送至上海交通大学医学院附属新华医院（下称\"新华医院\"）。由于担心肋骨骨折，他接受了胸部CT等检查——骨折没有，肠道更不是这次检查的目标，但正是这张\"看骨头\"的CT，让他此后的人生拐了个弯。\n\n7月28日上午，陈彤接到新华医院结直肠肛门外科副主任医师吴庭玉的电话，被建议到肛肠科就诊。原因是，AI在他此前的CT影像中发现了异常。\n\n陈彤对界面新闻回忆，刚接到电话时，他一度怀疑遭遇诈骗。但自己通过新华医院的网站核实清楚吴庭玉医生的身份后，加上自己平时关注科技和人工智能，他才决定到医院复查。此后他经肠镜确诊为结直肠癌。其病理结果显示为中低分化肿瘤，恶性程度较高，但尚属中早期，没有发生转移。目前，陈彤已接受手术切除，仍在接受辅助化疗等后续治疗。\n\n界面新闻记者拍摄于新华医院\r\n\n假如没有AI，陈彤会经历什么？这是一次无法真实复盘的推演，但可以从临床数据中寻找参照。\n\n陈彤的肿瘤是中低分化型，恶性程度高、进展快；他本人在此之前没有任何症状，也没有任何在近期主动做一次肠道检查的计划。换句话说，如果没有那场车祸，没有那张恰好扫过部分横结肠的CT，没有AI的标注和医生的复核，他的第一次肠道检查，大概率要等到症状出现的那一天，后果可能会不堪想象。\n\n对结直肠癌而言，这一天往往来得太晚了。结直肠癌早期几乎没有特异症状——便血容易被当成痔疮，腹泻便秘容易被当作小毛病，等梗阻、消瘦、贫血出现时，病程往往已进入中晚期。\n\n国内相关调查显示，超过八成的结直肠癌患者首次确诊时已处于中晚期。据国家癌症中心统计数据，I期患者的5年生存率为92.8%，IV期则跌至18.3%。早期与晚期之间，隔着近五倍的生存几率，也隔着完全不同的治疗方式、治疗费用和生存质量。\n\n从这个角度看，那通被陈彤误以为是诈骗电话的来电，恰是他人生中分量很重的一通电话。\n\n但假如一个普通人始终不做肠镜又会如何？\n\n陈彤并不讳疾忌医，但即便是他，如果不是AI和医生主动找上门，也不会想到去做一次肠镜。这正是结直肠癌筛查在中国面临的普遍困境。\n\n肠镜是肠癌筛查的\"金标准\"，写进诊疗规范多年，但它的门槛也是真实的——检查前要服用泻药、进行肠道准备，检查过程中可能出现不适，还要请假、陪护、承担对\"没问题白受一趟罪\"的心理预期。\n\n吴庭玉在接受界面新闻采访时表示，这些原因让一些患者不愿接受肠镜，影响了筛查普及；社区粪便隐血筛查虽相对简便，但准确性有限，结果为阳性者仍需通过肠镜进一步确认。\n\n但现实是，肠癌并不给\"再等等\"的人留太多余地。从息肉发展为癌，通常需要5到10年——这既是坏消息，也是好消息。窗口期足够长，长到一次肠镜就足以在癌变之前摘除隐患。\n\n国内调查数据显示，约97%的结直肠癌患者在确诊前从未做过肠镜筛查，其中86.5%的人是因为不知道需要定期做。也就是说，拖垮筛查率的，除了恐惧，还有筛查意识的欠缺。\n\n医生吴庭玉工作照\r\n\n代价同样可以用数据衡量。欧洲一项纳入超10万患者的大型研究显示：通过筛查检出的结直肠癌大多为I-II期，而非筛查途径发现的病例，过半已是III-IV期。\n\n同样是结直肠癌，被筛查出来和被症状逼出来，对应的已是两种截然不同的生存结局。统计数据提示，2022年中国新发结直肠癌51.71万例，死亡24万例——这意味着，绝大多数人都是出现症状才走进医院的人。\n\n针对肠镜筛查的困境，达摩院联合新华医院、长海医院、盛京医院合作研发了基于CT影像的人工智能肠癌筛查模型DAMO COCA2.0，探索一种不需要额外肠道准备的筛查方式。\n\n其核心思路是机会性筛查：患者因体检、结石、外伤等原因接受CT检查时，由AI分析影像，寻找肠道病变的迹象。它的目的不是替代肠镜，而是先从既有影像中找出可能被忽视的高风险患者，再由医生复核，并通过肠镜确诊。\n\n陈彤的经历正是这一流程下的个案。他因车祸拍的胸部CT恰好覆盖了部分横结肠，AI标注该区域异常后，医生复核并决定召回患者，最终通过肠镜确诊。\n\n一场车祸、一张为别的目的拍的CT、一套人工智能系统——三个偶然叠在一起，让一个本可能被漏诊的患者，被提前截住了。\n\n\"AI筛查的价值，是帮助医生发现传统手段下可能被漏诊的患者。\"吴庭玉说。在这一流程中，AI只负责提示异常并勾画可疑位置，医生负责复核与召回，最终诊断仍依赖肠镜和病理——不是由AI单独作出。\n\n研发并非一蹴而就。据吴庭玉介绍，新华医院提供了约3万例CT病例，由影像科和临床医生逐层标注肿瘤的位置和形态用于模型训练；加上长海医院、盛京医院等合作机构，模型累计学习了数十万例病例，并通过回顾性和前瞻性研究持续验证、调整。\n\n需要明确的是，这一模型尚未在新华医院正式临床部署，仍处于科研和前瞻性验证阶段。\n\n吴庭玉告诉界面新闻，模型的下一步是提升敏感性和特异性：前者决定能否尽量发现真正的患者，后者决定能否减少把正常人误判为高风险——漏诊可能延误治疗，过多假阳性则会带来不必要的召回、肠镜检查和患者焦虑。\n\n他认为，此类软件未来在基层医院可能更有价值，因为部署软件比添置CT设备、建设内镜中心更容易，但前提是产品获批、准确性得到验证，且医院具备后续确诊能力。\n\n将视野放宽，AI参与医学影像判断并非新事物，但此前获批产品更多集中于辅助诊断，如眼底疾病和冠脉狭窄等，而非癌症机会性筛查。\n\n近年来，一些团队开始尝试利用患者已完成的平扫CT开展癌症机会性筛查，希望在不增加扫描的情况下，从既有影像中寻找新的疾病线索。另如中山医院与联影智能合作的胸部一扫多查智能体已进入全国近30家医院、累计处理病例超过250万例，但其侧重多病种辅助诊断和报告生成，与癌症早筛并不完全相同。目前，多数此类项目仍处于论文验证、科研合作或真实世界试点阶段。\n\n这些探索共同显示一种趋势——AI正在从识别明确的单一病灶，转向在常规检查中寻找未被注意的疾病线索。但从尝试发现到成为常规临床工具，仍需回答一系列问题：准确性能否经得起验证，产品能否获批并嵌入诊疗流程等。\n\n未经正式授权严禁转载本文，侵权必究。健康面\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\nAI医疗诊断正在上海加速落地\n\n在一场车祸后的CT检查中，AI意外发现了肠癌线索，帮助一位患者及早确诊。这正是上海对于医学AI一系列支持下的阶段性成果案例。\n\n原创新闻黄华HH · 2026/11/19 09:00来源：界面新闻\n\n图片来源：界面图库\n\n界面新闻记者 | 黄华\n界面新闻编辑 | 谢欣\n\n11月初，上海市卫生健康委、上上海市医保局等共同启动“医疗健康数据融合开发利用工作专班”，专班将响应国家数据局医疗健康行业数据资源开发利用攻坚行动，承担推进全市卫生健康数据的制度建设、融合开发、场景创新、市场运营等任务，更好释放医疗数据要素价值。\n\n此前在今年7月，《上海市卫生健康发展\"十五五\"规划》提出，到2030年，\"人工智能+卫生健康\"应用场景要在全市医疗机构实现100%覆盖。\n\n这是上海对于人工智能在医疗领域的最新规划，在一系列政策加持下，人工智能技术在上海医院的应用速度正在加速。\n\n界面新闻梳理发现，包括国家人工智能应用中试基地携手联影智能研发出全球首创的“胸部一扫多查智能体”，同济大学附属东方医院牵头研发的Med-Go医疗大模型等、上海交通大学医学院附属新华医院、海军军医大学第一附属医院以及辽宁沈阳的中国医科大学附属盛京医院，与达摩院合作研发的基于CT影           "body": "文｜创业最前线 胡芳洁\n\n编辑｜蛋总\n\n“娇韵诗黄金双萃精华挺好用的，虽然是精华油，但是一点也不黏腻，晚上用，早晨起来感觉脸上皮肤亮了很多，抗氧化效果比较明显。”消费者孙颖（化名）对「创业最前线」表示。\n\n不过，她最近几年都没复购娇韵诗的产品，一方面是因为她现在主要在线上购买化妆品，相对于其他头部大牌，娇韵诗的推广似乎比较少，可选品牌多、大促活动也多，很难想起来去买娇韵诗；另一方面，娇韵诗核心抗老产品相对比较少。\n\n这一情况并不是特例。\n\n相对于兰蔻、雅诗兰黛、赫莲娜、海蓝之谜等高端护肤品牌广泛的大众认知度，娇韵诗呈现出明显的两极分化，既有“死忠粉”，也有不少人觉得是冷门品牌甚至没听过。\n\n今年双11，娇韵诗在天猫美妆榜单排第11位，在抖音双11护肤榜单排第14位（来自青眼数据），均没有进入前十。\n\n图 / 天猫、青眼（抖音双11周期为10月15日—11月11日）\n\n早在今年8月，娇韵诗官宣章子怡出任品牌高端奢护线至臻凝时（月光宝瓶）系列全球代言人。延续品牌不事张扬的风格，这次官宣也没有铺开刷屏式流量宣传，以至于不少人后知后觉章子怡代言了娇韵诗。\n\n而她代言的至臻凝时（月光宝瓶）系列，恰恰是娇韵诗在抗老领域围绕“肌肤长寿科学”展开叙事的核心载体。\n\n在社交平台的抗老面霜盘点中，月光宝瓶虽然偶有出现在对比清单中，但声量始终不突出。靠它，娇韵诗能讲好科技抗老新故事吗？\n\n01 用植物精油对战大牌\n\n“在整个化妆品行业里，娇韵诗是比较低调的。现在很多大牌都属于集团公司，但娇韵诗是家族企业，保证产品的‘鲜活’、安全更重要。”北京某娇韵诗专柜导购告诉「创业最前线」。\n\n她进一步表示，无论是海蓝之谜也好，兰蔻也好，都是非常不错的大牌，但娇韵诗的优势在于，它是“独一份”的纯植物护肤品牌，敏感肌、孕妇也适用。\n\n实际上，娇韵诗在国际美妆集团中一直是一个异数。\n\n它不仅坚持天然植物成分，还坚持家族控股，所有的产品几乎都在法国进行设计和制造，产品出口全球，却始终没有把品牌卖给任何一家巨头。\n\n2022年，娇韵诗录得约17.5亿欧元销售额，在欧洲高端护肤市场占据领先位置。Courtin-Clarins家族至今持有品牌100%的股权，第二、第三代成员仍在参与公司治理。\n\n品牌的起点与植物紧密相连。创始人贾克·古登（Jacques Courtin-Clarins）本是一名医学生，二战中断学业后，在从事理疗、为病人按摩的过程中，注意到植物成分对皮肤的特殊作用。\n\n1954年3月，他在法国巴黎开设了第一家娇韵诗美容中心，用自己调配的植物精油为客户做按摩，在合成化学产品兴起的年代走出了一条相反的路，也就此奠定了品牌植物成分护肤、追求身心平衡与产品安全的底色。\n\n真正为娇韵诗带来长期增长引擎的，是1985年推出的黄金双萃精华。这款将水溶性与脂溶性成分分离包装的抗老精华，在此后四十多年里成为品牌最核心的“现金牛”，并进一步巩固品牌在美妆市场的影响力。\n\n图 / 天猫\n\n据魔镜及国泰君安数据，2021年和2022年，双萃精华占品牌淘系销售额的比例超过40%。一个单品撑起线上近半壁江山，既证明了产品生命力，也暴露了结构性的问题，当双萃的增速放缓或口碑波动，品牌缺少足够厚实的第二梯队来承接。\n\n走高端化路线、向肌肤长寿科学领域进发，是娇韵诗当前给出的应对策略。首发于2023年的至臻凝时系列被定位为品牌顶级的奢护线，主推面霜售价在2600元左右/50ml。\n\n它的叙事不再停留在植物萃取、天然温和的层面，而是直接进入了“长寿科学”的语境，其核心成分取自仅在月夜短暂开放的“月神花”（大花仙人掌花），以-196°C超低温萃取保留活性，宣称能够激活肌肤底层的长寿蛋白FOXO，进而促进胶原蛋白再生。\n\n从植物精油到长寿蛋白，娇韵诗试图完成一次从天然到科技的信任迁移。但这两套语言之间的接缝，比品牌预想的要宽。\n\n植物精油注重天然、安全、感受与仪式感，长寿科学讲的是机制、靶点与临床数据。前者是娇韵诗最擅长的语言，后者是当下高端护肤比拼最激烈的领域。欧莱雅2025年专门发布肌肤整合长寿科学，雅诗兰黛和资生堂也各有布局，这条赛道已经站满巨头。\n\n如果说植物萃取成分护肤的故事里，娇韵诗依然以差异化优势和精细化运营，在巨头林立的国际美妆市场稳住了话语权，那么在长寿科学的语境下，局面似乎开始松动了。\n\n02 双萃宇宙的外扩，与长寿科学叙事的裂缝\n\n实际上，作为娇韵诗核心品牌资产，双萃精华销售份额占比达到一定高度后，主动消解其强势地位，延展新增量和新品类的可能性，变得更加重要起来。\n\n2024年第九代黄金双萃面市前一年，娇韵诗在2023年推出了一条全新的双萃产品线——油皮双萃。\n\n这是一款油皮专研的抗老精华，娇韵诗对外宣传口径为“0油感”，专研7:3水油比，相对于经典双萃精华2:1的水油比进行了大幅调整。\n\n而到了2025年，第二代油皮双萃上市，这一版本采取了更高浓度的水飞蓟精粹来强化油脂调节能力。\n\n除了双萃精华自身的分型外，娇韵诗还围绕双萃这一核心概念，向外延伸出了双萃眼霜和双萃精华粉底液等，试图把水油双相的配方逻辑复制到更多品类中，从而构建出品牌独有的“双萃宇宙”。\n\n但品类扩张的代价正在显现。\n\n双萃眼霜在社交平台上的争议，比较集中的有泵头设计问题，有用户反馈按压仅出油无法挤出霜体、控制不好量等，品控稳定性受到质疑。此外，还有功效感知模糊、拔干等评价。不过，也有用户肯定其眼周暗沉淡化、不黏腻等优点。\n\n图 / 小红书\n\n而双萃精华粉底液的问题则更为明显。\n\n双舱设计需要把精华与粉底在挤出后手动混合，但两部分内容物配比在手动按压中保持稳定存在不确定性，直接影响妆效的一致性。此外，油相占比偏高还可能加剧粉底的氧化暗沉，对于彩妆产品而言，精华与粉底液的双舱设计究竟是不是形式大于内容，依然值得进一步追问。\n\n当一个品牌的创新高度依赖已有产品概念或配方逻辑，在新的场景下，每一次复制都有可能把风险同步放大。\n\n在“双萃宇宙”承压的同时，娇韵诗已经在拓展新的故事节奏，而这一次是“长寿科学”。\n\n早在2023年3月，娇韵诗在上海全球首发全新至臻凝时系列，包括精华水、面霜、眼霜等，该系列以月神花精萃为核心成分。\n\n据品牌宣称，月神花每年只在月圆之夜绽放一次，具有促进肌肤长寿的功效。原料经体外测试显示，其可使长寿蛋白FOXO蛋白活性提升33%。（编者按：该结论来自体外实验，不等同于人体皮肤实际使用效果。）\n\n图 / 天猫\n\n可以看到，相对于欧莱雅在2025年提出肌肤长寿科学概念并在2026年密集落地相关产品、雅诗兰黛于2023年底上市包含细胞再生修护成分色提因的冻龄白金系列，娇韵诗的行动更早。\n\n但遗憾的是，产品落地早，但推进并不顺利。\n\n2025年8月，一则由美妆科普博主发布的关于娇韵诗月光宝瓶面霜功效靶点宣称争议的小红书笔记，在社交媒体引发热议。\n\n在这则笔记中，该博主提出质疑，认为在皮肤创伤（如医美伤口、长痘破皮等）环境下FOXO蛋白或将引发疤痕增生，而品牌在宣传中未充分提示这一潜在风险等。而这一质疑的关键依据，来自一篇发表于《The American Journal of Pathology》的研究。\n\n图 / PubMed\n\n事件发生以后，引发知乎等平台上的诸多讨论以及相关媒体采访和报道。\n\n在这个过程中，也有其他专业人士对此提出不同看法，认为这项2014年的研究主要揭示的是相关性，且实验条件与化妆品日常使用场景存在差异，不能直接等同于使用面霜就会导致疤痕。\n\n整个事件中，娇韵诗并没有对此进行过任何官方回应。对此争议事件，「创业最前线」致函娇韵诗公司，但截至发稿前尚未获得回复。\n\n长寿蛋白FOXO所带来的争议并没有直接导致娇韵诗的品牌形象和销量出现“崩塌迹象”，但或许在其最核心资产“科学信誉”上划下了一道口子，让外界开始审视其从植萃向分子科学转型过程中的证据链完整度。\n\n当一个以植物成分叙事建立信任的品牌，转身用靶点、基因、体外数据来论证高端产品的合理性时，它进入的是一个由消费者、专业博主、媒体等共同审视且举证标准远比天然温和严苛得多的赛场。\n\n在这个赛场里，任何科学修辞，几乎必然会遭到反向审视。\n\n03 精华品类渠道分化，高端系列转化偏弱\n\n尽管面临多重挑战，娇韵诗在中国的基本盘依然可观。\n\n根据品观引用林清轩招股书的数据，2024年娇韵诗以43.8亿元零售额位居中国高端护肤品牌第6位，超过修丽可和资生堂。但与年销70亿元以上的第一梯队之间，仍隔着一道尚未跨越的规模鸿沟。\n\n在淘天平台的面部精华品类中，娇韵诗2025年1-9月以14.8亿元销售额、9.0%的市占率排在首位，同比增长31.1%。双萃精华积累多年的品牌资产，在淘宝这一品牌力+功效背书驱动的场域里，仍然具备可观的转化效率。\n\n图 / 2025年1-9月淘宝、抖音面部精华市场份额，知行战略咨询\n\n但平台之间的逻辑正在剧烈分化，同一个面部精华品类，娇韵诗同期在抖音的销售额下滑高达25.5%。品牌正在流失关键的内容电商平台的市场份额。\n\n这并非孤例。雅诗兰黛同期下滑39.6%，SK-II下滑38.7%，国际高端品牌在抖音普遍承压，而韩束、谷雨等国货品牌以更适配内容电商的节奏和价格快速起量。娇韵诗在淘宝享有的品牌势能，在抖音并没有被等比例兑换。\n\n线下同样也面临收缩压力。2026年7月，北京合生汇娇韵诗门店向会员发布闭店通知，原址由某身体护理品牌接手。\n\n更值得关注的还有高端产品线与电商渠道的错位。在今年10月中旬，「创业最前线」在天猫旗舰店并没有搜索到至臻凝时（月光宝瓶）系列产品，而11月，该产品已出现在店铺的综合推荐页面，但成交数据依然单薄，月光宝瓶面霜和精华水，成交量均只有900+。\n\n一个承载“长寿科学”叙事的高端系列推出后，在品牌最核心的线上成交场域中却难被消费者顺畅地发现、购买，在电商上的转化表现仍偏弱，这足以引发重视。章子怡的代言或许可以强化产品所需要的形象高度，但后续的市场认知、交易闭环，依然是突围的关键。\n\n植物护肤品牌能讲好“长寿科学”吗？理论上答案是肯定的。植物化学本身并不缺乏分子层面的解释空间，问题在于品牌选择用什么样的方式去讲。\n\n如果“长寿蛋白”的选择和作用机理，在专业研究中仍有讨论空间，支撑数据却主要来自成分表第41位原料的体外实验，品牌宣称与证据强度之间的落差，消费者终会用自己的方式做出判断。\n\n这家公司七十多年的发展底气，来自不上市、不外包、专注产品的克制。当天然不再是稀缺标签，长寿又需要硬证据，突破舒适区的娇韵诗最终要回答的，是如何把植萃护肤领域积累的壁垒，在“长寿科学”领域重建为可验证、逻辑自洽的系统化竞争力。\n\n本文为转载内容，授权事宜请联系原著作权人。娇韵诗 美容护肤\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n植萃老牌入局“长寿科学”，娇韵诗能否自圆其说？\n\n在“双萃宇宙”承压的同时，娇韵诗已经在拓展新的故事节奏，而这一次是“长寿科学”。\n\n创业最前线 · 2026/11/19 08:59\n\n图片来源：界面图库\n\n文｜创业最前线 胡芳洁\n\n编辑｜蛋总\n\n“娇韵诗黄金双萃精华挺好用的，虽然是精华油，但是一点也不黏腻，晚上用，早晨起来感觉脸上皮肤亮了很多，抗氧化效果比较明显。”消费者孙颖（化名）对「创业最前线」表示。\n\n不过，她最近几年都没复购娇韵诗的产品，一方面是因为她现在主要在线上购买化妆品，相对于其他头部大牌，娇韵诗的推广似乎比较少，可选品牌多、大促活动也多，很难想起来去买娇韵诗；另一方面，娇韵诗核心抗老产品相对比较少。\n\n这一情况并不是特例。\n\n相对于兰蔻、雅诗兰黛、赫莲娜、海蓝之谜等高端护肤品牌广泛的大众认知度，娇韵诗呈现出明显的两极分化，既有“死忠粉”，也有不少人觉得是冷门品牌甚至没听过。\n\n今年双11，娇韵诗在天猫美妆榜单排第11位，在抖音双11护肤榜单排第14位（来自青眼数据），均没有进入前十。\n\n图 / 天猫、青眼（抖音双11周期为10月15日—11月11日）\n\n早在今年8月，娇韵诗官宣章子怡出任品牌高端奢护线至臻凝时（月光宝瓶）系列全球代言人。延续品牌不事张扬的风格，这次官宣也没有铺开刷屏式流量宣传，以至于不少人后知后觉章子怡代言了娇韵诗。\n\n而她代言的至臻凝时（月光宝瓶）系列，恰恰是娇韵诗在抗老领域围绕“肌肤长寿科学”展开叙事的核心载体。\n\n在社交平台的抗老面霜盘点中，月光宝瓶虽然偶有出现在对比清单中，但声量始终不突出。靠它，娇韵诗能讲好科技抗老新故事吗？\n\n01 用植物精油对战大牌\n\n“在整个化妆品行业里，娇韵诗是比较低调的。现在很多大牌都属于集团公司，但娇韵诗是家族企业，保证产品的‘鲜活’、安全更重要。”北京某娇韵诗专柜导购告诉「创业最前线」。\n\n她进一步表示，无论是海蓝之谜也好，兰蔻也好，都是非常不错的大牌，但娇韵诗的优势在于，它是“独一份”的纯植物护肤品牌，敏感肌、孕妇也适用。\n\n实际上，娇韵诗在国际美妆集团中一直是一个异数。\n\n它不仅坚持天然植物成分，还坚持家族控股，所有的产品几乎都在法国进行设计和制造，产品出口全球，却始终没有把品牌卖给任何一家巨头。\n\n2022年，娇韵诗录得约17.5亿欧元销售额，在欧洲高端护肤市场占据领先位置。Courtin-Clarins家族至今持有品牌100%的股权，第二、第三代成员仍在参与公司治理。\n\n品牌的起点与植物紧密相连。创始人贾克·古登（Jacques Courtin-Clarins）本是一名医学生，二战中断学业后，在从事理疗、为病人按摩的过程中，注意到植物成分对皮肤的特殊作用。\n\n1954年3月，他在法国巴黎开设了第一家娇韵诗美容中心，用自己调配的植物精油为客户做按摩，在合成化学产品兴起的年代走出了一条相反的路，也就此奠定了品牌植物成分护肤、追求身心平衡与产品安全的底色。\n\n真正为娇韵诗带来长期增长引擎的，是1985年推出的黄金双萃精华。这款将水溶性与脂溶性成分分离包装的抗老精华，在此后四十多年里成为品牌最核心的“现金牛”，并进一步巩固品牌在美妆市场的影响力。\n\n图 / 天猫\n\n据魔镜及国泰君安数据，2021年和2022年，双萃精华占品牌淘系销售额的比例超过40%。一个单品撑起线上近半壁江山，既证明了产品生命力，也暴露了结构性的问题，当双萃的增速放缓或口碑波动，品牌缺少足够厚实的第二梯队来承接。\n\n走高端化路线、向肌肤长寿科学领域进发，是娇韵诗当前给出的应对策略。首发于2023年的至臻凝时系列被定位为品牌顶级的奢护线，主推面霜售价在2600元左右/50ml。\n\n它的叙事不再停留在植物萃取、天然温和的层面，而是直接进入了“长寿科学”的语境，其核心成分取自仅在月夜短暂开放的“月神花”（大花仙人掌花），以-196°C超低温萃取保留活性，宣称能够激活肌肤底层的长寿蛋白FOXO，进而促进胶原蛋白再生。\n\n从植物精油到长寿蛋白，娇韵诗试图完成一次从天然到科技的信任迁移。但这两套语言之间的接缝，比品牌预想的要宽。\n\n植物精油注重天然、安全、感受与仪式感，长寿科学讲的是机制、靶点与临床数据。前者是娇韵诗最擅长的语言，后者是当下高端护肤比拼最激烈的领域。欧莱雅2025年专门发布肌肤整合长寿科学，雅诗兰黛和资生堂也各有布局，这条赛道已经站满巨头。\n\n如果说植物萃取成分护肤的故事里，娇韵诗依然以差异化优势和精细化运营，在巨头林立的国际美妆市场稳住了话语权，那么在长寿科学的语境下，局面似乎开始松动了。\n\n02 双萃宇宙的外扩，与长寿科学叙事的裂缝\n\n实际上，作为娇韵诗核心品牌资产，双萃精华销售份额占比达到一定高度后，主动消解其强势地位，延展新增量和新品类的可能性，变得更加重要起来。\n\n2024年第九代黄金双萃面市前一年，娇韵诗在2023年推出了一条全新的双萃产品线——油皮双萃。\n\n这是一款油皮专研的抗老精华，娇韵诗对外宣传口径为“0油感”，专研7:3水油比，相对于经典双萃精华2:1的水油比进行了大幅调整。\n\n而到了2025年，第二代油皮双萃上市，这一版本采取了更高浓度的水飞蓟精粹来强化油脂调节能力。\n\n除了双萃精华自身的分型外，娇韵诗还围绕双萃这一核心概念，向外延伸出了双萃眼霜和双萃精华粉底液等，试图把水油双相的配方逻辑复制到更多品类中，从而构建出品牌独有的“双萃宇宙”。\n\n但品类扩张的代价正在显现。\n\n双萃眼霜在社交平台上的争议，比较集中的有泵头设计问题，有用户反馈按压仅出油无法挤出霜体、控制不好量等，品控稳定性受到质疑。此外，还有功效感知模糊、拔干等评价。不过，也有用户肯定其眼周暗沉淡化、不黏腻等优点。\n\n图 / 小红书\n\n而双萃精华粉底液的问题则更为明显。\n\n双舱设计需要把精华与粉底在挤出后手动混合，但两部分内容物配比在手动按压中保持稳定存在不确定性，直接影响妆效的一致性。此外，油相占比偏高还可能加剧粉底的氧化暗沉，对于彩妆产品而言，精华与粉底液的双舱设计究竟是不是形式大于内容，依然值得进一步追问。\n\n当一个品牌的创新高度依赖已有产品概念或配方逻辑，在新的场景下，每一次复制都有可能把风险同步放大。\n\n在“双萃宇宙”承压的同时，娇韵诗已经在拓展新的故事节奏，而这一次是“长寿科学”。\n\n早在2023年3月，娇韵诗在上海全球首发全新至臻凝时系列，包括精华水、面霜、眼霜等，该系列以月神花精萃为核心成分。\n\n据品牌宣称，月神花每年只在月圆之夜绽放一次，具有促进肌肤长寿的功效。原料经体外测试显示，其可使长寿蛋白FOXO蛋白活性提升33%。（编者按：该结论来自体外实验，不等同于人体皮肤实际使用效果。）\n\n图 / 天猫\n\n可以看到，相对于欧莱雅在2025年提出肌肤长寿科学概念并在2026年密集落地相关产品、雅诗兰黛于2023年底上市包含细胞再生修护成分色提因的冻龄白金系列，娇韵诗的行动更早。\n\n但遗憾的是，产品落地早，但推进并不顺利。\n\n2025年8月，一则由美妆科普博主发布的关于娇韵诗月光宝瓶面霜功效靶点宣称争议的小红书笔记，在社交媒体引发热议。\n\n在这则笔记中，该博主提出质疑，认为在皮肤创伤（如医美伤口、长痘破皮等）环境下FOXO蛋白或将引发疤痕增生，而品牌在宣传中未充分提示这一潜在风险等。而这一质疑的关键依据，来自一篇发表于《The American Journal of Pathology》的研究。\n\n图 / PubMed\n\n事件发生以后，引发知乎等平台上的诸多讨论以及相关媒体采访和报道。\n\n在这个过程中，也有其他专业人士对此提出不同看法，认为这项2014年的研究主要揭示的是相关性，且实验条件与化妆品日常使用场景存在差异，不能直接等同于使用面霜就会导致疤痕。\n\n整个事件中，娇韵诗并没有对此进行过任何官方回应。对此争议事件，「创业最前线」致函娇韵诗公司，但截至发稿前尚未获得回复。\n\n长寿蛋白FOXO所带来的争议并没有直接导致娇韵诗的品牌形象和销量出现“崩塌迹象”，但或许在其最核心资产“科学信誉”上划下了一道口子，让外界开始审视其从植萃向分子科学转型过程中的证据链完整度。\n\n当一个以植物成分叙事建立信任的品牌，转身用靶点、基因、体外数据来论证高端产品的合理性时，它进入的是一个由消费者、专业博主、媒体等共同审视且举证标准远比天然温和严苛得多的赛场。\n\n在这个赛场里，任何科学修辞，几乎必然会遭到反向审视。\n\n03 精华品类渠道分化，高端系列转化偏弱\n\n尽管面临多重挑战，娇韵诗在中国的基本盘依然可观。\n\n根据品观引用林清轩招股书的数据，2024年娇韵诗以43.8亿元零售额位居中国高端护肤品牌第6位，超过修丽可和资生堂。但与年销70亿元以上的第一梯队之间，仍隔着一道尚未跨越的规模鸿沟。\n\n在淘天平台的面部精华品类中，娇韵诗2025年1-9月以14.8亿元销售额、9.0%的市占率排在首位，同比增长31.1%。双萃精华积累多年的品牌资产，在淘宝这一品牌力+功效背书驱动的场域里，仍然具备可观的转化效率。\n\n图 / 2025年1-9月淘宝、抖音面部精华市场份额，知行战略咨询\n\n但平台之间的逻辑正在剧烈分化，同一个面部精华品类，娇韵诗同期在抖音的销售额下滑高达25.5%。品牌正在流失关键的内容电商平台的市场份额。\n\n这并非孤例。雅诗兰黛同期下滑39.6%，SK-II下滑38.7%，国际高端品牌在抖音普遍承压，而韩束、谷雨等国货品牌以更适配内容电商的节奏和价格快速起量。娇韵诗在淘宝享有的品牌势能，在抖音并没有被等比例兑换。\n\n线下同样也面临收缩压力。2026年7月，北京合生汇娇韵诗门店向会员发布闭店通知，原址由某身体护理品牌接手。\n\n更值得关注的还有高端产品线与电商渠道的错位。在今年10月中旬，「创业最前线」在天猫旗舰店并没有搜索到至臻凝时（月光宝瓶）系列产品，而11月，该产品已出现在店铺的综合推荐页面，但成交数据依然单薄，月光宝瓶面霜和精华水，成交量均只有900+。\n\n一个承载“长寿科学”叙事的高端系列推出后，在品牌最核心的线上成交场域中却难被消费者顺畅地发现、购买，在电商上的转化表现仍偏弱，这足以引发重视。章子怡的代言或许可以强化产品所需要的形象高度，但后续的市场认知、交易闭环，依然是突围的关键。\n\n植物护肤品牌能讲好“长寿科学”吗？理论上答案是肯定的。植物化学本身并不缺乏分子层面的解释空间，问题在于品牌选择用什么样的方式去讲。\n\n如果“长寿蛋白”的选择和作用机理，在专业研究中仍有讨论空间，支撑数据却主要来自成分表第41位原料的体外实验，品牌宣称与证据强度之间的落差，消费者终会用自己的方式做出判断。\n\n这家公司七十多年的发展底气，来自不上市、不外包、专注产品的克制。当天然不再是稀缺标签，长寿又需要硬证据，突破舒适区的娇韵诗最终要回答的，是如何把植萃护肤领域积累的壁垒，在“长寿科学”领域重建为可验证、逻辑自洽的系统化竞争力。\n\n本文为转载内容，授权事宜请联系原著作权人。",

          "body": "文｜Tech商业 定一 博文 \n\n本周，字节跳动豆包工作上线“工作台”功能，首批覆盖金融、医疗、教育、创意设计等21个专业场景，把常用技能、插件和职业要求预先配置在同一个空间里。表面上看，这是一次产品功能的扩展；但放在字节与腾讯围绕“上班时间”的竞争脉络里，它更像一次战略姿态的校准：字节试图用“职业化”重新定义办公Agent的入口——不再让用户面对一个空的对话框从零开始，而是把金融投研、教案准备、创意设计的工作流打包成开箱即用的“工位”。\n\n几乎在同一时间，另一组数据给出了相反的坐标。易观分析2026年9月的数据显示，腾讯WorkBuddy以8534万月访问量在桌面端断层领先，豆包工作为3039万；QuestMobile的月活口径下，WorkBuddy三平台合计3235.3万，豆包工作PC端仅204.9万。字节在7月底刚完成豆包、飞书、火山引擎的组织整合，梁汝波在9月的飞书大会上明确表态“加大企业市场投入”，豆包工作与飞书8.0实现原生融合。资源不可谓不密集，动作不可谓不坚决，但差距并没有因为组织整合而迅速收窄。\n\n这构成一个值得拆解的张力：当豆包用“21个工作台”把专业场景做深时，WorkBuddy的领先却并不来自更深的专业能力，而来自一个更朴素的东西——它更早地把Agent放进了打工人本来就待着的地方。\n\n职业化是对的，但“工位”不在Agent里\n\n豆包工作台的思路本身并不错，甚至切中了办公Agent长期被诟病的痛点：通用能力再强，一旦进入具体职业，用户仍需自己搭建提示词、挑选插件、拼接工作流。金融投研场景里，工作台把信息查询、材料阅读、对比分析和研报交付串在同一个环境中，可按授权接入Wind、同花顺等专业数据服务；教育场景则围绕教师的真实动线展开——按年级和教材备课件，围绕一道题生成同类练习，把空间关系或光路变成可拖拽的HTML演示。这些设计的意义在于，它把“专业要求”前置到了任务起点，而不是留给用户在对话中反复试错。\n\n但问题恰恰在于，办公Agent的“入口”从来不在Agent自己的界面里。WorkBuddy之所以能在2026年3月上线后四个月内冲到跨平台月活2000万、日活1300万（花旗研报引述腾讯管理层2026年7月数据；与QuestMobile 9月三平台合计3235.3万为不同时点、不同口径，不宜直接对比），留存率超过60%，核心原因并不复杂：它足够轻，不需要企业整体部署，一个人下载就能用；它接入了企业微信和微信的社交关系链，白领在沟通完工作之后顺手唤出Agent处理任务，生成的文件可以直接转回企微群。这种“即插即用”的体验，把使用Agent的心理门槛和操作成本压到了接近于零。而豆包工作在2026年8月才上线PC客户端，此前很长一段时间里，它的能力再强，也缺少一个让用户“顺手打开”的物理入口。21个工作台是在Agent内部修房间，WorkBuddy却已经站在了用户每天必经的走廊上。\n\n这并不意味着专业化的方向错了。它意味着，办公Agent的竞争存在两个不同层次的战场：一个是“Agent能做什么”，另一个是“用户在哪里遇到Agent”。豆包在第一个战场上正在补课，而且补得认真；但在第二个战场上，组织整合带来的飞书协同优势要转化为真实的用户习惯，需要的时间远不止一次版本发布。\n\n字节的“重整合”与腾讯的“轻嵌入”\n\n两家公司的路径差异，在2026年7月之后变得格外清晰。字节选择的是“重整合”：把飞书产品团队与豆包产品团队合并，将TRAE、扣子并入豆包体系，让Agent、模型和协作环境在组织层面先融为一体，再向外输出。梁汝波的判断是，Agent进入可用阶段后，三者“必须紧密融合”才能发挥价值。这条路径的逻辑是自洽的——飞书承载着企业的文档、会议、审批和知识沉淀，豆包工作原生融入飞书之后，Agent天然理解企业的业务数据和权限边界，可以按照既有标准操作业务系统。从“谁更懂一家公司的组织与上下文”这个维度看，字节手里的牌并不差。\n\n但WorkBuddy走的是另一条路：轻嵌入，而不是重整合。它向内融合企业微信和腾讯办公生态，向外兼容第三方IM和企业自有系统，支持企业自研Agent和第三方通信系统接入。更关键的是，它并不要求用户先完成一场“全公司数字化转型”才能开始用Agent。一个员工今天下午下载WorkBuddy，输入指令生成一张报表，这个行为本身就已经在积累使用惯性和数据上下文。当这种个体行为在千百个企业里同时发生时，WorkBuddy获得的不是某个大客户的深度定制，而是大量中小型工作场景的广度覆盖。而广度，在办公Agent的早期阶段，恰恰是训练产品、打磨体验、积累切换成本最有效的燃料。\n\n两种路径没有绝对的对错，但它们对“时间”的消耗方式不同。字节的重整合在理论上能造出更深的护城河，但深度的兑现需要企业客户完成组织层面的采纳和迁移；腾讯的轻嵌入在理论上护城河不够深，却用极低的摩擦系数把用户先圈了进来，再用企业微信的上下文和办公生态的粘性慢慢加深。在一个窗口期以月为单位计算的赛道里，后者显然更快。\n\n价格战与模型开放：一场制造“均势”的军备竞赛\n\n面对差距，字节的选择是开放和价格双管齐下。10月底，豆包工作向团队和企业客户开放第三方模型，首批包括Kimi K3.1 Pro、GLM 5.3和DeepSeek V4.1 Flash；11月12日进一步向个人用户扩大模型选择；11月3日起，个人用户每日简单问答不再消耗付费额度。WorkBuddy的回应则是继续深化企业微信整合、开放产品架构，同时在模型选择上保持开放。两家的路径迅速趋同：模型进入下拉菜单，用户按性能、速度和成本选择。\n\n这种趋同的直接后果是，模型能力本身作为差异化卖点的寿命正在急剧缩短。WorkBuddy早期的一个重要吸引力是“不挑食”，不强制绑定混元，用户可以自由选择DeepSeek、智谱等模型。但当豆包和千问办公在几周内把同样的开放性补齐之后，多模型就不再是谁的独占优势，而成了行业标配。价格层面同样如此：豆包推出DeepSeek V4.1 Flash的限时近乎免费使用，WorkBuddy此前已取消了相关折扣；企业席位定价上，豆包团队版1988元/席/年（按年付折合约166元/席/月）、企业版“席位+用量”的模式，与WorkBuddy、千问办公的定价区间高度重叠，公开可查的起售价大体集中在约166元至198元/人/月（WorkBuddy SaaS企业版为198元/人/月），没有人拥有显著的价格高地。\n\n这构成一种奇特的竞争景观：两家公司都在“开放”和“降价”，但这两个动作都不产生结构性壁垒。开放模型让用户的选择更多，也让Agent产品之间的功能差异变得更薄；降价让获客更容易，也把竞争拉回到互联网时代烧钱买流量的旧轨道上。这种状态带着某种“复古”色彩——当模型和价格都被拉平之后，真正能区分胜负的东西，反而回到了那些最不“AI”的层面：谁的用户已经在某个协同生态里沉淀了足够多的上下文，谁的Agent就拥有更高的切换成本。\n\n真正的分水岭不在模型，在“离开的成本”\n\n腾讯披露的数据提供了一个关键参照：WorkBuddy和CodeBuddy的活跃用户留存率超过60%，付费用户留存率超过80%。在办公Agent这个品类里，留存率比访问量更能说明问题。一个用户今天因为免费额度或某个模型来试用，明天可能就走了；但如果他的聊天记录、文档、日程、邮件和审批流都已经和Agent发生了交互，离开就意味着放弃这些上下文积累，切换成本会真实地阻止迁移。WorkBuddy的留存优势，本质上不是模型优势的产物，而是企业微信和腾讯办公生态作为“上下文容器”的产物。\n\n豆包工作并非没有意识到这一点。与飞书原生融合之后，它在权限体系内操作业务系统、理解企业数据的能力，在理论上可以构建同样性质的上下文壁垒。21个工作台也可以被理解为一种“垂直上下文”的积累策略：当用户在金融投研工作台里反复生成研报、补充数据、更新分析，这些行为同样会沉淀为产品对职业场景的理解。但这条路径的兑现有一个前提：用户必须先进入豆包工作的环境。而在WorkBuddy已经用轻量嵌入占据了大量用户“第一次使用办公Agent”的时刻之后，豆包要争夺的已经不是“Agent好不好用”，而是“用户愿不愿意换一个地方开始”。\n\n海外市场的对照让这一点更加清楚。Microsoft 365 Copilot和Google Gemini Enterprise的定价都在每用户每月30美元左右，它们的竞争力并不来自模型本身的参数规模，而来自Excel、Outlook、Teams、Docs、Gmail这些已经承载了企业日常运转的界面。办公Agent的商业化从来不是“卖模型”，而是“卖一个已经在工作流里的位置”。中国市场的席位定价虽然远低于海外，但商业逻辑是一致的：席位费只是入场券，真正的收入来自Agent嵌入工作流之后产生的用量和依赖。在这个逻辑下，谁先让Agent成为用户“离不开的日常”，谁就掌握了定价权和续费权。\n\n窗口期还在，但窗口在变窄\n\n字节在办公Agent上的投入决心不需要怀疑。豆包App 4.19亿的月活、飞书在企业协同市场的积累、火山引擎的模型能力，都是真实的资产。21个工作台证明字节正在从“通用能力”转向“职业场景”，这是一个正确的方向。但办公Agent的竞争有一个残酷之处：产品的迭代可以以周为单位，组织整合可以以月为单位，用户习惯的迁移和上下文壁垒的积累，却是以季度甚至年为单位来度量的。WorkBuddy在2026年3月抢出来的五个月市场空白期，不会因为豆包在11月发布了一个好功能就被抹平。\n\n真正值得关注的，不是下一轮价格战谁更便宜，也不是下一个模型版本谁跑分更高，而是两家公司谁先让Agent从一个“需要打开的产品”变成一个“不需要想起的存在”。当用户不再思考“我要用Agent做这件事”，而是直接在文档里、在聊天框里、在会议中让任务被完成时，入口的争夺才算真正结束。在那之前，所有关于访问量、月活和模型折扣的喧嚣，都只是通往那个时刻的过渡。而过渡阶段的每一次产品发布，都在悄悄定义最终的分水岭：是在Agent的房间里修更多的工位，还是让Agent走到用户已经站着的地方。\n\n本文为转载内容，授权事宜请联系原著作权人。AI 协同办公\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n豆包工作做深场景，但入口还在WorkBuddy手里\n\n入口之争的本质，不是Agent能做什么，而是用户在哪里遇见它。\n\nTech商业 · 2026/11/19 08:55\n\n图片来源：界面图库\n\n文｜Tech商业 定一 博文 \n\n本周，字节跳动豆包工作上线“工作台”功能，首批覆盖金融、医疗、教育、创意设计等21个专业场景，把常用技能、插件和职业要求预先配置在同一个空间里。表面上看，这是一次产品功能的扩展；但放在字节与腾讯围绕“上班时间”的竞争脉络里，它更像一次战略姿态的校准：字节试图用“职业化”重新定义办公Agent的入口——不再让用户面对一个空的对话框从零开始，而是把金融投研、教案准备、创意设计的工作流打包成开箱即用的“工位”。\n\n几乎在同一时间，另一组数据给出了相反的坐标。易观分析2026年9月的数据显示，腾讯WorkBuddy以8534万月访问量在桌面端断层领先，豆包工作为3039万；QuestMobile的月活口径下，WorkBuddy三平台合计3235.3万，豆包工作PC端仅204.9万。字节在7月底刚完成豆包、飞书、火山引擎的组织整合，梁汝波在9月的飞书大会上明确表态“加大企业市场投入”，豆包工作与飞书8.0实现原生融合。资源不可谓不密集，动作不可谓不坚决，但差距并没有因为组织整合而迅速收窄。\n\n这构成一个值得拆解的张力：当豆包用“21个工作台”把专业场景做深时，WorkBuddy的领先却并不来自更深的专业能力，而来自一个更朴素的东西——它更早地把Agent放进了打工人本来就待着的地方。\n\n职业化是对的，但“工位”不在Agent里\n\n豆包工作台的思路本身并不错，甚至切中了办公Agent长期被诟病的痛点：通用能力再强，一旦进入具体职业，用户仍需自己搭建提示词、挑选插件、拼接工作流。金融投研场景里，工作台把信息查询、材料阅读、对比分析和研报交付串在同一个环境中，可按授权接入Wind、同花顺等专业数据服务；教育场景则围绕教师的真实动线展开——按年级和教材备课件，围绕一道题生成同类练习，把空间关系或光路变成可拖拽的HTML演示。这些设计的意义在于，它把“专业要求”前置到了任务起点，而不是留给用户在对话中反复试错。\n\n但问题恰恰在于，办公Agent的“入口”从来不在Agent自己的界面里。WorkBuddy之所以能在2026年3月上线后四个月内冲到跨平台月活2000万、日活1300万（花旗研报引述腾讯管理层2026年7月数据；与QuestMobile 9月三平台合计3235.3万为不同时点、不同口径，不宜直接对比），留存率超过60%，核心原因并不复杂：它足够轻，不需要企业整体部署，一个人下载就能用；它接入了企业微信和微信的社交关系链，白领在沟通完工作之后顺手唤出Agent处理任务，生成的文件可以直接转回企微群。这种“即插即用”的体验，把使用Agent的心理门槛和操作成本压到了接近于零。而豆包工作在2026年8月才上线PC客户端，此前很长一段时间里，它的能力再强，也缺少一个让用户“顺手打开”的物理入口。21个工作台是在Agent内部修房间，WorkBuddy却已经站在了用户每天必经的走廊上。\n\n这并不意味着专业化的方向错了。它意味着，办公Agent的竞争存在两个不同层次的战场：一个是“Agent能做什么”，另一个是“用户在哪里遇到Agent”。豆包在第一个战场上正在补课，而且补得认真；但在第二个战场上，组织整合带来的飞书协同优势要转化为真实的用户习惯，需要的时间远不止一次版本发布。\n\n字节的“重整合”与腾讯的“轻嵌入”\n\n两家公司的路径差异，在2026年7月之后变得格外清晰。字节选择的是“重整合”：把飞书产品团队与豆包产品团队合并，将TRAE、扣子并入豆包体系，让Agent、模型和协作环境在组织层面先融为一体，再向外输出。梁汝波的判断是，Agent进入可用阶段后，三者“必须紧密融合”才能发挥价值。这条路径的逻辑是自洽的——飞书承载着企业的文档、会议、审批和知识沉淀，豆包工作原生融入飞书之后，Agent天然理解企业的业务数据和权限边界，可以按照既有标准操作业务系统。从“谁更懂一家公司的组织与上下文”这个维度看，字节手里的牌并不差。\n\n但WorkBuddy走的是另一条路：轻嵌入，而不是重整合。它向内融合企业微信和腾讯办公生态，向外兼容第三方IM和企业自有系统，支持企业自研Agent和第三方通信系统接入。更关键的是，它并不要求用户先完成一场“全公司数字化转型”才能开始用Agent。一个员工今天下午下载WorkBuddy，输入指令生成一张报表，这个行为本身就已经在积累使用惯性和数据上下文。当这种个体行为在千百个企业里同时发生时，WorkBuddy获得的不是某个大客户的深度定制，而是大量中小型工作场景的广度覆盖。而广度，在办公Agent的早期阶段，恰恰是训练产品、打磨体验、积累切换成本最有效的燃料。\n\n两种路径没有绝对的对错，但它们对“时间”的消耗方式不同。字节的重整合在理论上能造出更深的护城河，但深度的兑现需要企业客户完成组织层面的采纳和迁移；腾讯的轻嵌入在理论上护城河不够深，却用极低的摩擦系数把用户先圈了进来，再用企业微信的上下文和办公生态的粘性慢慢加深。在一个窗口期以月为单位计算的赛道里，后者显然更快。\n\n价格战与模型开放：一场制造“均势”的军备竞赛\n\n面对差距，字节的选择是开放和价格双管齐下。10月底，豆包工作向团队和企业客户开放第三方模型，首批包括Kimi K3.1 Pro、GLM 5.3和DeepSeek V4.1 Flash；11月12日进一步向个人用户扩大模型选择；11月3日起，个人用户每日简单问答不再消耗付费额度。WorkBuddy的回应则是继续深化企业微信整合、开放产品架构，同时在模型选择上保持开放。两家的路径迅速趋同：模型进入下拉菜单，用户按性能、速度和成本选择。\n\n这种趋同的直接后果是，模型能力本身作为差异化卖点的寿命正在急剧缩短。WorkBuddy早期的一个重要吸引力是“不挑食”，不强制绑定混元，用户可以自由选择DeepSeek、智谱等模型。但当豆包和千问办公在几周内把同样的开放性补齐之后，多模型就不再是谁的独占优势，而成了行业标配。价格层面同样如此：豆包推出DeepSeek V4.1 Flash的限时近乎免费使用，WorkBuddy此前已取消了相关折扣；企业席位定价上，豆包团队版1988元/席/年（按年付折合约166元/席/月）、企业版“席位+用量”的模式，与WorkBuddy、千问办公的定价区间高度重叠，公开可查的起售价大体集中在约166元至198元/人/月（WorkBuddy SaaS企业版为198元/人/月），没有人拥有显著的价格高地。\n\n这构成一种奇特的竞争景观：两家公司都在“开放”和“降价”，但这两个动作都不产生结构性壁垒。开放模型让用户的选择更多，也让Agent产品之间的功能差异变得更薄；降价让获客更容易，也把竞争拉回到互联网时代烧钱买流量的旧轨道上。这种状态带着某种“复古”色彩——当模型和价格都被拉平之后，真正能区分胜负的东西，反而回到了那些最不“AI”的层面：谁的用户已经在某个协同生态里沉淀了足够多的上下文，谁的Agent就拥有更高的切换成本。\n\n真正的分水岭不在模型，在“离开的成本”\n\n腾讯披露的数据提供了一个关键参照：WorkBuddy和CodeBuddy的活跃用户留存率超过60%，付费用户留存率超过80%。在办公Agent这个品类里，留存率比访问量更能说明问题。一个用户今天因为免费额度或某个模型来试用，明天可能就走了；但如果他的聊天记录、文档、日程、邮件和审批流都已经和Agent发生了交互，离开就意味着放弃这些上下文积累，切换成本会真实地阻止迁移。WorkBuddy的留存优势，本质上不是模型优势的产物，而是企业微信和腾讯办公生态作为“上下文容器”的产物。\n\n豆包工作并非没有意识到这一点。与飞书原生融合之后，它在权限体系内操作业务系统、理解企业数据的能力，在理论上可以构建同样性质的上下文壁垒。21个工作台也可以被理解为一种“垂直上下文”的积累策略：当用户在金融投研工作台里反复生成研报、补充数据、更新分析，这些行为同样会沉淀为产品对职业场景的理解。但这条路径的兑现有一个前提：用户必须先进入豆包工作的环境。而在WorkBuddy已经用轻量嵌入占据了           "body": "人类飞得最远的探测器走到哪了？北京时间昨天(18日)18时16分07秒，旅行者1号探测器历经49年的飞行，正式抵达了距离地球1光日的地方。这也是人类历史上第一次，将自己造出的装置送到了即便以光速也要用“天”来计量的遥远尺度。\r\n\n　　从地球到月球，光只要跑1.3秒；从太阳照到地球，光只要走8分多钟；即便飞到最远的行星海王星，光也只需要4个多小时。1光日，是指光在真空中跑上一整天的距离，折算下来大约是259亿千米。\n\n　　探测器所抵达的1光日的位置，距离飞出太阳系还有多远？半个世纪的星际航行，带来哪些发现与挑战？\n\n　　1光日到底有多远？\n\n　　北京天文馆研究员 朱进：1光日指的是以光速运动，走一天的距离。光速为光子在真空中的传播速度，每秒30万千米，一天86400秒，两者相乘约259亿千米，即1光日的距离。\n\n　　大家把1光日当成一个比较受关注的节点，那飞到这个位置，旅行者1号周边的宇宙环境，会出现比较明显变化吗？这个节点它更多是纪念意义，还是说能给我们研究星际空间、认识太阳系边界带来新的科学收获呢？\n\n　　朱进：1光日只是为了“凑个整”。平时在太阳系内运动多用天文单位，常听说的其实是光年，很少用光日。光日是因为这一距离正好是以光速衡量24小时，或者说与飞船通信时信号发过去需24小时、发回来也需24小时。因此，1光日对应的距离上并没有物理上特别不一样的地方。\n\n　　快要飞出太阳系了吗？\n\n　　这次到达1光日的距离，有不少听众好奇它是不是已经或者快要飞出太阳系了。其实早在2012年8月，旅行者1号越过日球层顶、进入星际空间的时候，大家就有过同样的疑问。那这次的情况又是怎么样的呢？\n\n　　朱进：2012年旅行者1号经过太阳风层顶(日球层顶)，这是一个比较重要的不同之处：飞船经过该处后，来自太阳的太阳风粒子压力与来自外部恒星际空间的压力达到平衡，是一个比较关键的变化。但经过太阳风层顶与飞出太阳系并非一回事。离太阳最近的恒星有4光年远，1光日其实还只是离太阳非常近的地方。旅行者1号虽已走了近50年，但按太阳系尺度看，其实只走了太阳系里非常中心的一小段。\n\n　　地面测控最大难点是什么？\n\n　　到了1光日这个距离，信号单程就要24小时，一来一回通信时延接近48小时。这么长的时延，地面测控面临最大的难点是什么？\n\n　　朱进：这一距离上最大难点其实并不是延时，因为很多时候并没有那么多需要实时反应的东西。最关键的是距离远造成信号衰减特别强；同时旅行者1号已近50年，50年前的航天器不可能携带特别大的天线，发射信号功率肯定特别低，且为节省能源还要限制信号发射强度和电力消耗。真正麻烦的是信号太微弱，探测器上科学观测设备和发射信号设备都存在寿命与功率问题。\n\n　　金唱片能被外星文明捕获吗？\n\n　　旅行者1号和2号上，都携带着同样的一张金唱片，这张唱片上，记录了55种语言的问候、大概90分钟的音乐、115幅模拟编码图像，以及风雨、浪涛和动物的声音。封面用氢原子跃迁建立时间尺度，以脉冲星图标示太阳位置。那么，在漫长的星际漂流中，它有没有机会被外星文明捕获，甚至是被读懂呢？\n\n　　朱进：在我看来，碰到外星人基本上不可能。两个探测器要真正离开太阳系、抵达离太阳最近的恒星，还早得很，怎么也是几万年以后的事。旅行者1号49年才走1光日，若银河系有外星人，一般考虑不会到处都是，在这种情况下能被外星人接触到，是百万年量级的事。因此需上百万年甚至上千万年，且唱片还没坏、还能一直往前飞，才有可能被外星人碰着。 【编辑:王琴】",

          "body": "超八成受访青年因线下观赛结识了新朋友\n\n　　见证重要赛事节点、感受紧张现场氛围、打卡丰富配套活动……观看竞技体育赛事时，你是否会选择去线下，享受和同好一起加油助威的快乐？近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育赛事的青年开展的调查显示，超七成受访青年曾在线下观看过竞技体育赛事，其中，80.8%的受访青年因线下观赛结识了新朋友。\n\n　　“线下观赛的氛围感是线上无法体验到的”\n\n　　“在线下看比赛和隔着屏幕还是很不一样的。”在广东广州上学的05后赵欣喜欢在现场亲身感受比赛氛围，也会为了自己喜欢的赛事特意去其他城市观赛，“我看的竞技项目在上海的赛程比较多，去一次可能会花费5000元左右。”今年，该赛事推出了城市巡回赛，落地了她所在的广州，“一场的票价大约在300元，比较合适。”她也会去球迷或者官方组织的线下观赛点观看赛事转播，“可以感受大家一起观赛的激动氛围。”\r\n\n　　在北京工作的90后李泽林更倾向在当地看比赛。作为一名网球爱好者，他从2014年就开始在线下观看中国网球公开赛(以下简称“中网”)。除了门票，他还会购买挂件、服饰等赛事周边，“去一次基本会花费1000元左右。”今年中网期间，他和朋友被一家正在转播中网赛事的餐厅吸引，“其实在餐馆之类的地方，和朋友一起边吃边看，也很有意思。”\n\n　　除了现场观赛，如今越来越丰富的线下观赛形式也吸引更多年轻人走出家门，和同好一起分享观赛激情。数据显示，70.9%的受访青年在比赛现场、影院转播活动等线下渠道观看过竞技体育赛事。其中，7.4%的受访青年通常会为线下观赛活动花费100元以下；43.6%的受访青年花费100-500元(不含500元)；35.4%的受访青年花费500-1000元(不含1000元)；11.2%的受访青年花费1000-3000元(不含3000元)；还有2.4%的受访青年会花费3000元及以上。\n\n　　“线下观赛的氛围感是线上无法体验到的。”正在读研究生的00后卫婕会选择在一些关键赛事，或者有自己喜欢的队伍参赛时去线下观赛，和同好一起加油助威。同时，她也感到如今的赛事配套活动越来越丰富，将赛事与城市特色融合起来，给观众带来了更沉浸的线下观赛体验，“今年我去北京看了一场比赛，它在开场表演和舞美设计中，融入了京剧等北京特色元素，让人眼前一亮。”\n\n　　对95后王卓琳而言，只有去线下观赛，才能真正感受到一个体育项目的魅力，“哪怕把电视声音开得再大，和现场也是完全不同的。”她平时也会去不同城市观看足球比赛，亲身感受赛场独有的紧张感，“有的人可能觉得屏幕上看得更清楚，可以看到细节、听清解说，但只有在现场，你才能感受到为什么一个带球、一个进球都牵动人心。”\n\n　　比起在家“躺着”观赛，年轻人为何会选择到线下场所观看竞技体育比赛？在有过线下观赛经历的743名受访青年中，57.5%的受访青年是想亲眼见证高光时刻、经典对决；56.9%的受访青年是为了和同好一起呐喊助威，获得情绪共鸣；55.2%的受访青年是为了沉浸式感受赛场独有的紧张氛围。其他还有：近距离支持喜欢的选手、队伍(47.4%)，互动、抽奖、表演等线下配套活动丰富(36.3%)，作为一种休闲社交方式(25.0%)，打卡赛事地标(5.9%)等。\n\n　　线下观赛 八成受访青年结识了新朋友\n\n　　线下观赛，年轻人不仅享受比赛本身的魅力，也拓展了自己的社交圈。调查显示，在有过线下观赛经历的受访青年中，80.8%的受访青年因此结识了新朋友。\n\n　　赵欣觉得，竞技体育赛事让来自天南海北的观众有机会相聚在一起。“最开始大家可能只是网友，在社交平台上发帖交流。随着线上交流的深入，大家会加好友、建群。”有比赛时，群里的朋友也会相约线下观赛，“我也因此认识了很多新朋友。”\n\n　　李泽林在中网期间会和球迷群里的网友相约买票，“我们会选一个比较集中的区域，方便一起加油助威。”观赛时，大家还会在现场讨论比赛内容，交流球技。赛后，他还会和新“球友”约着一起线下打球。\n\n　　卫婕会在观赛现场和其他粉丝交换周边，也会和旁边的其他同好搭话，在一来二去的闲聊中慢慢发展出友谊。如今，她和一些通过线下观赛认识的同好之间的话题，已经不仅仅是比赛本身，“有的已经成了能分享生活的好友。”\n\n　　受访青年中，男性占52.8%，女性占47.2%。05后占5.2%，00后占32.2%，95后占25.6%，90后占37.0%。\n\n　　(除卫婕外，受访者均为化名)\n\n　　中青报·中青网记者 戴瑶\n\n　　来源：中国青年报 2026年11月19日 08版 【编辑:王琴】",

          "body": "現年65歲的前TVB金牌司儀盧敏儀，日前與導演丈夫孫敬安一同出席圈中好友飯局，同場還有唐韋琪、鄧英敏等熟悉面孔。從友人分享的合照中可見，坐在左下方的盧敏儀神態從容，丈夫孫敬安則站在其身後默默陪伴，兩人表現恩愛。盧敏儀與孫敬安自1997年結婚至今已接近30年，多年來一直形影不離，是圈中出名的模範夫婦。\n盧敏儀笑談孫敬安日常相處\n兩人在2017年大搞結婚20周年派對時，盧敏儀曾公開感謝丈夫的愛護。她透露當時做體檢時懷疑患乳癌，孫敬安因擔心她而抱著她落淚；幸好後來找專家再抽組織檢驗證實無大礙，孫敬安又喜極而泣。盧敏儀坦言自己性格有時比較任性，但這20年間反而是丈夫主動為她改變，是一位好老公。談到夫妻日常，盧敏儀近年受訪時自認是個沉悶的太太，放假只想留在家中放空腦袋，不想辛苦執拾行李旅行。孫敬安則在一旁笑著投訴，指太太連去旅行或看電影都不肯，老夫老妻的鬥嘴十分溫馨。\n相關閱讀：《勁歌金曲》元祖級主持盧敏儀罕現身 轉行做律師多次為明星打官司 極關心李龍基未婚妻案情\n盧敏儀轉行做大律師曾為鍾鎮濤辯護\n盧敏儀讀中學時因主持《少年警訊》展露口才，曾獲警務處長頒發嘉許狀。入行後她深受無綫重用，不僅是《勁歌金曲》第一代主持，更屢次與鍾保羅合作主持大型節目。1997年婚後，她決定淡出娛樂圈重返校園，先後完成法律學士及法律碩士課程，並成為著名資深大律師清洪的徒弟。轉行大律師後，她多次為曾志偉、張慧雯等圈中人提供法律支援。2011年，鍾鎮濤與前妻章小蕙胞妹章小婉發生衝突而被控，當時便是由盧敏儀代表辯護，最終協助鍾鎮濤獲判無罪。\n相關閱讀：EYT好友會丨盧敏儀拒回應蔡楓華入紙紅館：盡在不言中 余慕蓮精靈現身自爆氣管不順有點咳嗽\n《勁歌金曲》元祖級主持蔡楓華獲平反：",

          "summary_short": "中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低，多地气温将陆续降至近期低点…",

            "中东部地区降水将减少减弱，进入一段降水间歇期",
            "23日前后，随着暖湿气流增强，江南、华南等地又将迎来一轮降水天气过程"
          ],
          "section": "生活",

          "source_display": "中國新聞網",

          "size": 1,
          "keywords": [],
          "body": "中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低，多地气温将陆续降至近期低点，并大范围创下立秋后新低。与此同时，中东部地区降水将减少减弱，进入一段降水间歇期。23日前后，随着暖湿气流增强，江南、华南等地又将迎来一轮降水天气过程。\n\n　　寒潮东移南下 中东部气温将陆续触底\n\n　　昨天，寒潮继续南下，中东部大部出现大风降温天气。监测显示，内蒙古中东部、东北地区中南部、华北、黄淮及青海南部、西藏等地出现6至8级阵风，局地11级以上。今早6时较昨天同时次，黄淮、江淮、江汉、江南中东部、华南中西部等地部分地区出现6至10℃，局地12℃以上降温。\n\n　　今明天，冷空气影响将趋于结束，但中东部地区气温仍较低。其中明天早晨，最低气温0°C线将南压至河南北部至苏皖北部一带。\n\n　　受冷空气影响，南北方多地气温将陆续降至近期低点，并大范围创立秋后新低。沈阳今天最高气温将是下半年首次跌至0℃，济南明天早晨最低气温也将是下半年首次跌破冰点。这次冷空气过后，北方有望全面入冬，而长江中下游一带也将会有短暂的冬日体验。\n\n　　对于华南来说，由于前期气温显著偏高，这轮降温效果会十分明显。大城市中，广州、南宁最高气温将从前期的30℃上下，下滑至不足20℃，其中南宁今天最高气温仅有17℃，秋凉明显。\n\n　　此外，今天冷空气在东移南下过程中，由于地面气压梯度较大，加上高空动量下传，东北、华北等地仍将有大风天气。午后阵风尤其强劲，阵风可达7至9级，风寒效应明显，提醒公众外出需注意防风保暖。\n\n　　中东部进入降水间歇期 23日前后南方再迎降水过程\n\n　　随着冷空气东移南下，中东部地区的降水迅速向东向南收缩。昨天，内蒙古中东部、黑龙江、吉林东部、河北北部等地出现小到中雪或雨夹雪；云南南部、广西中南部、广东中南部、福建东北部等地出现分散性中到大雨，云南西双版纳局地暴雨。\n\n　　今天，东北地区的降雪和南方的降雨都会有所减少。中央气象台预计，今天，内蒙古中部、黑龙江中东部、吉林东部等地部分地区有小到中雪或雨夹雪，其中，黑龙江东北部局地有大雪。西南地区南部、华南大部、台湾岛等地部分地区有小到中雨，其中，云南南部等地部分地区有大雨。\n\n　　明后两天，我国大部地区将进入降水间歇期，天气以晴为主，并且在干燥偏北气流的影响下，空气相对湿度下降，南方的干燥程度也会加大。\n\n　　中央气象台预计，20日，内蒙古中部、黑龙江东部、山东半岛东北部等地部分地区有小到中雪或雨夹雪，其中，山东半岛等地部分地区有大雪。云南南部、华南中南部、台湾岛等地部分地区有小雨，其中，云南南部和中部等地部分地区有中雨。\n\n　　21日，内蒙古东北部、山东半岛东北部等地部分地区有小雪。云南中南部、贵州西部等地部分地区有小雨或阵雨。\n\n　　展望后期，23日前后，随着暖湿气流加强，配合南下的冷空气，南方又会迎来新一轮降水过程。届时，江南、华南等地将有中到大雨，提醒公众密切关注临近预报，提前做好防范措施。\n\n 【编辑:梁异】",

          "body": "当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者参与的调查显示，超半数(52.2%)受访者表示为AI花过钱，知识处理(59.1%)、多媒体创作(53.3%)、办公学习(44.1%)是受访者常用AI做的事。\r\n\n　　自从使用AI办公后，来自深圳的35岁黄鹂觉得自己的工作效率有了很大提高，原来可能要做一整天的方案，如今在AI的加持下两到三小时就能完成。在她看来，为AI付费是对自己的一种“投资”。“如果你愿意付费深度学习、使用AI工具，它能提高你的工作效率，也能提升个人能力。”\n\n　　调查显示，超半数(52.2%)受访者为AI花过钱。交叉分析发现，受访90后的这一比例更高，为61.4%。然后是00后(58.3%)、95后(53.6%)。男性受访者(53.2%)的这一比例高于女性受访者(51.4%)。从地区来看，一线城市受访者的这一比例更高，为58.1%，然后是二线城市(51.7%)、三四线城市(51.1%)。\n\n　　来自上海的在读研究生王明远，从今年8月底开始为AI付费。“感觉学习效率提升了，对求职也有很大帮助。”\n\n　　王明远表示，互联网时代获取知识容易，但缺少一个可以随时提问的导师，“AI可以充当这个角色。”从课程知识学习、作业指导到简历项目设计，他用AI构建了一个24小时在线的私人导师。“我有很多问题可以问AI，它能指导我的成长。”\n\n　　来自深圳的37岁林子侨是一名游戏行业的从业者，最近他正和朋友一起创作一部AI短剧。为了达到更好的艺术效果，今年9月，他果断为AI掏出钱包。“我们有分工，朋友是编剧，用AI做视频我是自学的。”\n\n　　林子侨表示，免费模型在画面精度和语义理解上不够好，每次都要花大量时间后期修补。如今，他每月在续卡、买积分上的花费在2000元左右，调用的模型也越来越高级。“AI生成视频的成本虽有些高，但比自己拍片子的成本低。”在他看来，这笔钱买的是把创意直接变成画面的能力。\n\n　　大家会为什么样的AI服务付费？数据显示，49.2%的受访者会为更聪明的模型付费；48.4%的受访者会为多模态AI付费，生图、视频、语音更好用；46.7%的受访者是为了省时间，写稿、做表、出方案更快。其他还有：不卡额度，额度丰富够调用(28.2%)；懒得折腾，一个会员全平台通吃最省心(20.6%)等。\n\n　　90后原田在苏州做生产管理，下班后她还有另一个身份——短视频博主。她用AI生成脚本、画面、配音、剪辑，整个流程几乎不需要人工介入。“以前我试着学过剪辑，学着学着就放弃了，现在有想法直接就能成片。以前得几个人干的活，现在我下班回来一个人就做完了。”\n\n　　之前原田一直用免费版的AI工具，但发现废片率高、画质不够清晰，为AI付费之后，她明显感觉“快”了，并且能调用更好的模型。“现在几分钟就能生成能用的素材。”\n\n　　大家平时用AI做什么？调查中，查资料/翻译/解题/写代码等知识处理(59.1%)、生图/修图/剪视频/做AI短片等多媒体创作(53.3%)、写稿/周报/PPT/邮件等办公学习产出(44.1%)位列前三。其他还有：写小说/写歌/写段子/等文艺脑洞(27.7%)；闲聊/情感陪伴/角色扮演等日常互动(27.1%)；投喂资料做个人知识库/智能体训练(15.5%)等。\n\n　　来自河南郑州的85后网店主张龙，把AI当成了自己的“员工”，用AI生图、写文案、翻译，AI的出现让他解锁了很多技能。他的电脑里，整齐排列着一周的社交媒体发布包——文案、配图、标签全部由AI生成，他只需手动上传。“像美工、运营、剪辑、拍摄，以前至少需要一个团队，现在我一个人加AI就能搞定。”张龙说。\n\n　　受访者中，05后占3.2%，00后占22.6%，95后占20.7%，90后占25.4%，85后占13.2%，80后占11.2%，其他占3.7%。男性占47.6%，女性占52.4%。来自一线城市的占38.1%，二线城市的占35.7%，三四线城市的占19.8%，县城或城镇的占5.1%，农村的占1.3%。\n\n　　(应受访者要求，张龙为化名)\n\n　　中青报·中青网记者 吴欣宇 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:梁异】",

          "body": "国家文物局昨天(18日)发布了长江文明溯源最新考古成果，分别是四川遂宁桃花河遗址、浙江杭州良渚反山遗址、江西九江荞麦岭遗址群岭头上遗址、湖北云梦老虎墩墓地。\n\n　　从30万年前古人类生活营地，到五千年前良渚高等级礼仪院落，再到夏商周文化交融聚落、秦汉简牍出土墓地，这些出土遗迹、石器、简牍究竟揭开了哪些历史谜题？又为实证中华文明多元一体带来哪些全新线索？\n\n　　四川遂宁桃花河遗址\n\n　　四川遂宁的桃花河遗址坐落在涪江中上游，包含鄢家沟、田家湾两处地点，总面积大约19万平方米，主体年代距今30万年到5万年。考古人员在这里发掘了1.3万余件石制品以及179件动物化石，还发现大量碎屑和人工搬运砾石，找到了砾石铺设活动面、石器集中贮藏区、石器加工场等遗迹。四川大学历史文化学院院长吕红亮说，桃花河遗址是长江流域迄今发现遗物最密集的中更新世旷野中心营地，极具特色的定型化大石片砍斫器工业、复杂的营地组织形态与空间规划能力，对研究全球早期人类演化具有重要意义。\r\n\n　　四川大学历史文化学院院长 吕红亮：桃花河遗址的时间节点非常有意思，30万年到5万年，这是在古人类研究里面非常敏感的一个时间段。另外它出土的石器非常有特点，而且密度很高，这在全世界都是比较罕见的。第三是它发现了一些可能的人类活动遗迹，这也是比较少见的。我们以前发现的人类活动遗迹相对来说都是旧石器时代晚期的，它早的这么一个时代，对全世界旧石器的考古研究来说是一个新的纪录。\n\n　　浙江杭州良渚反山遗址\n\n　　浙江杭州良渚反山遗址是已知良渚文化等级最高的贵族墓地。2024年开启的系统性发掘带来重要突破：考古工作者发现反山不只是一处单纯的墓葬土墩，它以土墩为中心，外围建有院墙，构成一座略呈长方形的独立院落，围护面积约2.5万平方米。浙江省文物考古研究所良渚遗址考古项目负责人王宁远介绍，院墙、台基及建筑遗迹的发现，揭示了墓葬区、礼仪活动空间与外围围护设施相结合的整体布局，为探讨良渚古国王权的礼仪性表达和制度化发展，提供了新的考古证据。\n\n　　浙江省文物考古研究所良渚遗址考古项目负责人 王宁远：良渚古城是不同来源的社群聚合而成的地缘社会，意味着社会组织和制度的全新建构。反山的发现，从聚落结构角度为这一变革提供了生动的例证：反山院墙以及东部建筑遗迹的发现，突破反山作为单纯土墩墓地的传统认识，表示当时已经形成与丧葬相关的稳定的规制。成组院落或分别对应不同的人群，为研究良渚古城社会组织和人群关系提供重要线索。反山王陵与土垄的结构性关联，证实了良渚古城与水利系统是统一规划建设的整体设施，它是社会权力、信仰与大型水利工程深度结合的物化体现。由此说明治水立国的东方文明理念，早在大禹治水传说之前一千年就已经在良渚地区成功实践。\n\n　　江西九江荞麦岭遗址群岭头上遗址\n\n　　江西九江的荞麦岭遗址群是一处大型先秦聚落遗址群，岭头上遗址是其中面积最大的墩台之一，总面积约6万平方米。考古在这里发现新石器时代晚期墓葬、玉石器加工遗存；也发现早商时期的居址、青铜冶炼遗存，出土坩埚、炉壁残块、铜渣、铜块等遗物。江西省文物考古研究院副研究馆员饶华松表示，这个遗址位于长江中下游的过渡地带，遗址内新石器时代晚期及早商时期的聚落文化因素多元，反映出长江中下游文化传播、互动交融频繁，揭示了中原与长江中游地区文化交流与资源开发控制的密切关系。\n\n　　江西省文物考古研究院副研究馆员 饶华松：荞麦岭遗址群岭头上遗址地处长江中游和下游与中原之间的地理关键节点，这里连接东西沟通南北，兼有多种文化因素，自新石器晚期直到商代的文化发展展现了显著的文化交汇的特征，既有皖、鄂、赣交界期的自身文化发展主线，也可见长江中游、下游文化的较强的影响。商代早期更是融入到中原文化的一体化浪潮中，是研究中原与南方长江中游和下游文化交流互动的难得材料，是认识中华文明多元进程的重要实证。\n\n　　湖北云梦老虎墩墓地\n\n　　湖北云梦老虎墩墓地属于战国晚期至西汉初期墓地。2026年考古发掘一共清理秦汉墓葬113座，其中40座是饱水墓葬，出土漆木、陶器、金属、玉器以及简牍等各类随葬品1200余件(套)。北京大学中国古代史研究中心教授朱凤瀚表示，老虎墩墓地是目前出土秦简最集中的墓地，所获材料涉及政治、军事、文学、医学、民俗学、艺术等领域，为研究秦汉大一统王朝历史进程以及基层社会治理模式提供了最新史料。\n\n　　北京大学中国古代史研究中心教授 朱凤瀚：从出土器物来看，它很好地体现了秦文化和楚文化的融合。同一座墓葬当中既有秦式器，还有楚式器物，很好地体现了秦、楚两种文化的交融。从人群角度来说，这里也见证了秦汉之际人群的融合，一部分秦国的官吏、士兵南下，这个墓地可以说是中华民族形成的一个缩影，从墓葬制度、随葬器物的制度、形制上很好地体现了这一点。\n\n　　从几十万年前古人类营建的旷野中心营地，到良渚时期统一规划的都邑、水利、高等级墓葬体系，再到夏商阶段南北之间的文化往来、资源互动，直至秦汉大一统之下地域文化交融共生，长江流域这四项考古成果，进一步补全了中华文明漫长的发展链条。接下来，考古团队还将开展多学科综合研究，持续挖掘出土遗迹遗物背后蕴藏的历史信息，为实证中华文明百万年人类史、五千多年文明史提供更多实物支撑。\n\n　　监制丨樊新征\n\n　　记者丨韩萌 【编辑:梁异】",

          "title": "词元作为数字商品进入大众消费 专家建议：统一计量口径守护AI消费权益",

          "body": "今年“双十一”，Token首次以独立品类摆上电商货架，“囤Token”成为热词。\n\n　　Token中文名为“词元”，是大模型处理文本的最小单位，用AI写文案、做PPT、生成图片视频都在消耗它。厂商按量计费，输入输出都计费，但对普通用户来说，这个单位几乎不可感知：100万Token值多少钱，很难换算。于是不少平台把它“翻译”成积分或会员。\n\n　　有业内人士指出，词元作为数字商品进入大众消费后，仍面临计量、定价、安全、合规等多重课题：同一段文字在不同模型中消耗的词元可能相差两至五成，计费规则不一、套餐难以换算、未用完的额度如何处理、发生争议找谁，相关规则仍待厘清。\n\n　　围绕上述问题，《法治日报》记者采访了西南政法大学民商法学院教授张力和中国人民大学法学院副教授、法律科技与社会治理实验室副主任黄尹旭。\r\n\n　　囤词元系预付式消费\n\n　　记者：消费者“囤”的Token，买到的究竟是什么？\n\n　　张力：从法律性质看，单个Token不构成独立的物。Token套餐是经营者以预收款方式提供的数字服务，属于预付式消费。消费者预先支付价款，取得按Token计量的服务额度，未使用部分对应尚未消费的预付款，属于消费者的财产利益。\n\n　　记者：购买Token后，页面往往只显示“剩余额度”“剩余次数”，一次用掉多少、怎么扣费看不明白。账单看不懂、对不上，该找谁？\n\n　　张力：Token并非统一、中立的计量单位，而由各服务商自定义。消费者按Token付费，却无法预先确知某次使用消耗多少，也难以仅凭数量在不同套餐间比较。名义价格与实际消耗可能不对应，这正是“看不懂账”的根源。\n\n　　计量单位、计费口径、单价、单次消耗与余额变动，均属与消费者有重大利害关系的信息。经营者仅显示概括余额而不提供可供核验的明细，属于信息披露不充分。\n\n　　消费者首先可要求服务商提供用量明细。服务商拒绝或无法说明的，消费者可向市场监管部门投诉，或申请仲裁、提起诉讼。依据《最高人民法院关于民事诉讼证据的若干规定》，一方当事人控制证据无正当理由拒不提交，对待证事实负有举证责任的当事人主张该证据的内容不利于控制人的，人民法院可以认定该主张成立。服务商不提供明细，可能承担不利后果。\n\n　　黄尹旭：过去Token服务面向开发者，用量查询嵌入技术后台是行业惯例；转向大众零售后，数据打通、账单通俗化改造都需要时间。目前多数消费者还需跳转服务商后台查看明细。账单存疑，可先找服务商核对，协商不成再向平台投诉。\n\n　　出现争议应如何维权\n\n　　记者：打开一个Token商品，页面通常是几档套餐：有按用量计价的单项包，也有标着“赠送额度”的组合套餐，不少还写着“限时有效”“未用完不退”。对于消费者来说，付款前需要留意哪些内容？\n\n　　张力：关于“赠送额度”，若赠送额度真实无偿，其未使用部分原则上不产生退款请求权；但若实为套餐定价组成部分、仅以赠送名义标示，则属于误导性价格标示，涉嫌违反价格欺诈禁止规定。\n\n　　关于“限时有效”，预付款设定有效期并非当然违法，但有效期条款属格式条款；期限明显过短，或到期后余额一律作废、不予延期或退还的，可能排除消费者主要权利，依据民法典第四百九十七条和消费者权益保护法第二十六条，该条款无效。\n\n　　关于“未用完不退”，尚未消费部分属消费者预付资金，经营者不能以格式条款一概排除返还请求权。任何情形下均不退还余额的条款效力存疑。消费者因经营者违约、停业解除合同的，仍有权请求退还剩余额度。\n\n　　记者：对于Token这种“看得见摸不着”的数字商品，平台和AI服务商应各自承担怎样的安全保障义务？\n\n　　黄尹旭：Token作为新型数字商品，其安全保障义务边界仍在法律与实践探索之中，很难用现有标准要求某一方承担无限责任，更务实的原则是“法定底线守牢，延伸责任逐步探索”。\n\n　　张力：AI服务商作为直接提供者，依据消费者权益保护法，应保证服务符合保障财产安全的要求：保障账户与额度安全、防止盗用，保障服务连续稳定、避免中断造成额度损失，保障计量准确并保存记录；同时，依据个人信息保护法、网络安全法、数据安全法，对输入内容承担数据安全义务并明示规则。\n\n　　关于平台责任，依据电子商务法和消费者权益保护法，需核验入驻主体信息，在发生争议时提供经营者真实名称、地址和联系方式；不能提供的，消费者可要求平台赔偿；平台作出更有利于消费者承诺的，应当履行；知道或应当知道服务商侵权而未采取必要措施的，依法承担连带责任。\n\n　　计量口径有待标准化\n\n　　记者：从长远看，要让Token真正成为“买得放心、用得明白”的消费品，最关键要建立哪些制度或标准？\n\n　　黄尹旭：平台和商户当下即可先行探索：在商品详情页显著位置展示计量规则、有效期、退款政策、明细查询方式，把用户协议里的关键内容摆到台面上。\n\n　　张力：一是计量口径标准化，用国家标准、行业标准或团体标准统一Token定义、分词规则与计费口径，使输入、输出、系统提示、缓存等项目口径一致、价格可比。\n\n　　二是强制信息披露，公示单价、口径、有效期与退款规则，提供可核验明细。\n\n　　三是预付款资金监管，对预收资金实行存管或担保，防范挪用、停业失联造成余额损失。\n\n　　四是格式条款效力审查，明确“过期作废”“概不退换”等条款边界。\n\n　　五是平台主体责任，明确资质审核、信息披露与争议处置义务。\n\n　　六是第三方计量核验，建立符合性评价机制，为举证和执法提供技术支撑。Token计量不属于计量法调整的法定计量范畴，不能靠计量器具强制检定解决，但可借各类标准统一分词规则与计费口径。\n\n　　记者：统一计量口径、引入第三方核验，落到普通消费者身上，能解决什么问题？\n\n　　张力：这一步解决两个问题。其一，可验证性。口径公开、明细可获取后，消费者或其委托的第三方可自行复核账单，争议处理不再完全依赖经营者单方陈述。\n\n　　其二，可追责性。第三方核验通过认证与持续审计，将虚标额度转化为可识别、可追究的违约或违法事实，提高违法成本，为索赔提供证据基础。第三方核验不能绝对消除虚标，其作用在于降低信息不对称，而非替代监管追责。\n\n　　黄尹旭：统一计量口径，本质是给消费者一把通用的“公平秤”，也是以规则守护AI消费权益的体现。如买电用“度”、买流量用“GB”，无需逐一换算Token，比价对账才有据。第三方核验针对商家记账、消费者无从核验的信息不对称问题，既能约束商家、减少虚标多扣，也可提供中立维权依据。(记者 赵丽) 【编辑:曲克】",

          "body": "中新网11月19日电 据“平武发布”微信公众号消息，四川省绵阳市平武县市场监督管理局18日发布情况通报，2026年11月17日，有网友反映平武县某民宿提供的烤全羊分量不足，引发网民关注。对此，平武县市场监督管理局高度重视，成立工作组第一时间开展核查处置。现将有关情况通报如下。\n\n　　一、事件概况\n\n　　2026年11月11日，游客一行在该民宿食宿，通过微信预订烤全羊一只。用餐时，游客认为“烤羊有点小、肉太少、全是骨架”。11月17日下午，平武县市场监督管理局收到该网络反映，及时组织双方开展调解，双方已就赔付事宜达成一致意见。\n\n　　二、核查情况\n\n　　11月17至18日，平武县市场监督管理局执法人员在涉事民宿开展实地调查核实，并邀请人大代表、政协委员、游客代表到场全程监督。\n\n　　经现场核实并询问双方当事人，当日经营者未留存该烤全羊称重凭证，仅以口头方式和消费者沟通重量，调查时距离事发已间隔6日，现有证据难以核实实际重量，平武县市场监督管理局以视频作为参考，疑似存在缺斤少两问题。同时，经现场调查发现，该民宿店内未公示菜品价格，存在“未明码标价”问题。\n\n　　经查，该民宿涉嫌违反《中华人民共和国消费者权益保护法》《中华人民共和国价格法》相关规定。平武县市场监督管理局已对该民宿立案调查，并将根据后续调查情况依法依规严肃处理，坚决维护市场经营秩序，切实保障消费者合法权益。\n\n图片来源：“平武发布”微信公众号截图\n\n 【编辑:曹子健】",

          "body": "[22:26]\n天文台：雖然暴雨警告已經取消，但市民仍須警覺有關河道氾濫可能帶來的危險。\n\n[22:25]\n天文台取消黃色暴雨警告信號。\n\n[21:05]\n天文台改發黃雨警告。\n\n[20:30]\n天文台改發紅雨警告。\n\n[20:15]\n天文台會在下午8時30分發出紅色暴雨警告信號，取代黑色暴雨警告信號，但本港仍有大驟雨及狂風雷暴，市民仍需繼續保持警覺。\n\n[19:30]\n天文台：預料強陣風吹襲香港。如身處室外，請盡快到安全地方躲避。\n\n[19:05]\n天文台：現時本港天氣惡劣，持續的暴雨會導致道路嚴重水浸和交通擠塞，市民應留在安全地方暫避。大雨可能會引致山洪暴發，河道亦可能會氾濫。市民請留意天文台的最新天氣消息，以及電台或電視台廣播的交通情況。\n\n[18:35]\n黑色暴雨警告信號一日內第二度生效。\n\n[18:25]\n天文台：強雷雨帶正影響本港，天文台正密切評估是否需要改發黑色暴雨警告信號。市民請保持高度警惕，並留意最新天氣消息。\n\n預料本港在未來一兩小時可能受冰雹影響。\n\n預料猛烈陣風吹襲香港。如身處室外，請立刻到安全地方躲避。\n\n[18:10]\n天文台改發紅雨警告。\n\n[17:50]\n天文台：位於珠江口以西的強雷雨帶正逐漸靠近本港，預料未來一兩小時本港的雨勢將會再度增強。市民請保持警惕，並留意最新天氣消息。\n\n[15:40]\n天文台改發黃色暴雨警告信號。\n\n[15:05]\n天文台改發紅色暴雨警告信號。\n\n[14:50]\n天文台：下午3時05分發出紅色暴雨警告信號取代黑色暴雨警告信號，但本港仍有大驟雨及狂風雷暴，市民仍需繼續保持警覺。\n\n[14:02]\n特別天氣提示︰根據現時評估，黑色暴雨警告信號會至少維持至下午3時。\n\n[13:30]\n山泥傾瀉警告生效。\n\n[13:20]\n新界北部水浸特別報告：新界北部，尤其是元朗、八鄉及錦田、新田及牛潭尾、上水、打鼓嶺一帶，正受大雨影響。\n\n新界北部可能受大雨影響之市民，應採取適當的預防措施，以防止水浸可能引致的損失。大雨可能引致山洪暴發，市民應遠離河道。鄉村附近若有防洪警鐘，村民亦應留意。\n[13:00]\n特別天氣提示︰預料強陣風繼續吹襲香港。如身處室外，請儘快到安全地方躲避。在下午12時35分左右，大澳錄得每小時約80公里的強陣風。\n\n➤ 天氣冷智識｜半月內兩次黑雨！天氣家族話你知　雨還要下多少天｜附九天預報\n\n[12:55]\n天文台改發黑色暴雨警告信號。\n\n暴雨警告信號現時為黑色，表示香港廣泛地區已錄得，或預料會有每小時雨量超過70毫米的豪雨，且雨勢可能持續。\n\n注意事項：\n\n市民應留在戶內，並到安全地方暫避，直至大雨過去。市民如無法找到安全地方，可到民政事務總署轄下的臨時庇護中心暫避。\n\n駕駛人士應注意道路可能出現嚴重水淹及交通擠塞。\n\n在空曠地方工作的人士應停止戶外作業，並到安全地方暫避。\n\n政府呼籲僱主不應要求僱員上班，除非有關暴雨時的工作安排已有事先協定。如果僱員已經上班，便應留在原來工作地點，除非該處會有危險。\n\n學生應留在家中。上學途中的學生應繼續回校，除非前面路面或交通情況並不安全。如已返抵學校，則應留在校內，直至放學時間及情況安全適宜回家，方可離開。\n\n校方應安排學校開放，並有足夠人手照顧已抵達學校的學生，直至情況適宜學生回家為止。\n\n市民應避免接近容易氾濫的河道，及避免穿過水淹地區。如住所可能出現嚴重水淹，則應考慮撤離居所，直至大雨減弱和洪水退卻。\n\n[12:45]\n特別天氣提示︰強雷雨區正影響本港，是否需要發出黑色暴雨警告信號要視乎該雷雨區的發展。市民請保持高度警惕，並留意最新天氣消息。\n\n[12:40]\n香港天文台發出新界北部水浸特別報告。\n\n新界北部，尤其是打鼓嶺一帶，正受大雨影響。\n\n新界北部可能受大雨影響之市民，應採取適當的預防措施，以防止水浸可能引致的損失。大雨可能引致山洪暴發，市民應遠離河道。鄉村附近若有防洪警鐘，村民亦應留意。\n\n[12:10]\n天文台改發紅色暴雨警告信號。\n\n暴雨警告信號現時為紅色，表示香港廣泛地區已錄得，或預料會有每小時雨量超過50毫米的大雨，且雨勢可能持續。\n\n注意事項：\n\n市民如須外出，應先仔細考慮天氣及道路情況是否許可。駕駛人士應注意道路可能出現嚴重水淹及交通擠塞。\n\n市民應避免接近容易氾濫的河道，及避免穿過水淹地區。如住所可能出現嚴重水淹，則應考慮撤離居所，直至大雨減弱和洪水退卻。\n\n在空曠地方工作的人士應暫停戶外作業，直至天氣情況許可為止。\n\n學生應留在家中。上學途中的學生應繼           "body": "Token抢手？超半数受访者表示没必要囤\n\n　　为AI付费，58.6%受访者感觉额度算不明白\n\n　　今年“双十一”，直播间里出现了一个新鲜货——Token(词元)。面对消费新事物，大家有哪些看法？\n\n　　上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者参与的调查显示，今年“双十一”，近两成(18.9%)受访者下单了AI会员、Token月卡或算力包(含体验卡)，超半数(53.5%)受访者表示随用随充，没必要囤货。\r\n\n　　当Token入场“双十一”：是果断下单，还是谨慎观望？\n\n　　今年“双十一”，来自河南郑州的85后网店主张龙趁着某AI平台做活动，买了一些积分。如今，在网店的日常运营上，张龙把美工、运营、剪辑好几个人干的活都交给了AI。他算了笔账，以前请团队每月最少一万多元支出，现在AI全包，一个月几千元就能搞定，“以前我不可能以这么低的成本做到”。\n\n　　数据显示，今年“双十一”首日，某电商平台Token品类成交额环比增长450%；在某主播直播间，半小时卖出10万份AI辅助类办公会员月卡，累计约两万亿Token。\n\n　　本次调查中，今年“双十一”，近两成(18.9%)受访者下单了AI会员、Token月卡或算力包(含体验卡)。32.5%的受访者虽没下单，但表示“考虑过”。交叉分析发现，受访05后下单了的比例更高，为38.1%，然后是00后(26.2%)、90后(19.2%)。\n\n　　张龙关注到，今年“双十一”有直播间卖Token，但他没有在直播间里下单，他有一些顾虑：“每家代理的API(指应用程序编程接口‌，是软件系统之间沟通的桥梁，定义了不同程序如何相互调用功能、交换数据的规则与协议——记者注)不一样，在非官方渠道买Token，有可能要换API接口，输入、输出多少钱都不一样。”\n\n　　来自苏州的90后原田是一名短视频博主，每天大量使用AI生成视频和图片，但面对“双十一”囤Token这件事，她保持观望态度。“大模型几个月就更迭一批，现在囤一堆，过一阵可能就不值钱了。”\n\n　　在原田看来，按量付费是最理智的选择，“用多少扣多少，囤月卡我怕用不完，过期就作废了。”\n\n　　大家如何看待“双十一”囤Token的现象？超半数(53.5%)受访者表示随用随充，没必要囤货；24.4%的受访者觉得是“真刚需”，早囤早享受；17.7%的受访者认为是纯噱头，有些实际未必用得上；持有其他观点的受访者占4.4%。\n\n　　什么情况下大家会为AI续费\n\n　　来自上海的00后在读研究生王明远是一名为AI付费的资深用户，平时用AI助力学习、作业指导，以及一些项目的设计和实现。在付费使用过多款主流AI工具后他发现，目前国内的AI平台主要采取积分订阅制度，“用户花一定的钱，却可能搞不清享受到多少Token，信息对消费者不透明。”\n\n　　来自深圳的35岁黄鹂经常使用AI辅助办公。她发现，有时在调用模型生成图片和视频时，平台会在自己不知情的情况下消耗大量积分。“前几天给AI一份视频脚本，不是很复杂，结果视频还没生成完，就消耗了7万积分，相当于花了70多元。”更让黄鹂无奈的是，平台没有实时客服，只能提交工单等待反馈。\n\n　　你感觉现在AI工具收费存在哪些“坑”？调查中，58.6%的受访者觉得额度算不明白，Token、次数、时长混着来；48.4%的受访者表示一些AI工具实际表现与宣传有差距，性价比一般。其他还有：会员权益细分多种类型，需不断付费升级(42.1%)；退订流程不够便捷，自动续费提醒不够明显(32.4%)等。\n\n　　张龙也遇到过AI工具收费复杂，算不清楚的情况。他举例，调用同一模型，官方API和国内的代理商价格差异较大，“某AI模型官方10元钱可能一天就用完，通过代理商20元钱能用几天，收费不太统一”。\n\n　　原田也表示，现在为AI工具充值，有时额度算不明白，Token、次数、时长混在一块儿卖。但原田也表示，如今AI确实为她的工作和生活赋能了，如果效果显著，她仍愿意为AI付费。“我的想法很简单，这钱花出去能帮我省时间或能让我赚回来，那就值。”\n\n　　“在使用高峰期，付费用户优先，而且免费版一天只能生成几张图，付费后几乎感觉不到限制。”张龙是从今年2月份开始接触AI的，最早用AI给孩子批改作业，后来发现它是个不错的生产力，就开始给AI付费辅助办公。付费前后，他最大的感受是模型调用权限和多模态输入的差别。“以前做跨境电商，语言方面沟通不顺畅，现在AI帮我连接邮箱回复客户，这一套流程下来很颠覆我的认知。”\n\n　　如今，张龙把AI当成自己创业路上的“隐形合伙人”，并打算一直付费使用。“虽说我现在用AI还没有实打实的收益，但它成为了我创业路上的一把‘万能钥匙’。只要AI继续以较低成本帮我生成文案、配图、剪辑视频，这笔钱就花得值。”\n\n　　什么情况下受访者会给AI续费？数据显示，49.3%的受访者表示要比免费版强一大截，不卡不扯谎；45.7%的受访者觉得要是办公学习的好帮手，极大提升效率。其他还有：赶上促销够便宜的时候，薅到就是赚到(38.2%)；同事/同学都在用，跟着大家一起买(21.8%)等。\n\n　　受访者中，05后占3.2%，00后占22.6%，95后占20.7%，90后占25.4%，85后占13.2%，80后占11.2%，其他占3.7%。男性占47.6%，女性占52.4%。\n\n　　(应受访者要求，张龙为化名)\n\n　　中青报·中青网记者 吴欣宇 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:曹子健】",

          "body": "秋假还没结束，雪假也来了。11月18日，河北省张家口市中小学迎来了首个雪假，不同学段错峰放假。此外，吉林省、内蒙古呼伦贝尔、新疆阿勒泰也陆续公布2026年雪假安排。\n\n　　根据各地安排，雪假多在12月，为3个工作日与周末自然连休，形成“3+2”或“2+3”的5天小长假。雪假主要针对义务教育阶段学生，部分地区明确，幼儿园、中职学校可参照执行。\n\n　　设立雪假，促进学生上冰上雪\n\n　　同样是雪假，各地的玩法却不一样。\r\n\n　　呼伦贝尔市要求，具备合格资质、规范运营的滑雪场，面向全市义务教育阶段学生提供每天3小时免费滑雪体验，包含全套雪具使用。冰雪资源不足的旗市区将加大体育馆、全民健身中心开放力度，免费提供旱地冰壶、陆地冰球等器材借用服务。\n\n　　东北师范大学教授杨卫安认为，雪假的价值，在于把冰雪从资源变成课程，让假期从学生休整变成个人成长。它是有组织、成体系的安排，填补了课堂内教学的实践短板。\n\n　　“雪假的核心不只是‘怎么玩’‘玩什么’，更重在‘如何系统性落地’。对学生来说，雪假不等于彻底告别课堂，而是要依托冰雪游玩实践，去户外体验，并感知冰雪文化。”中国传媒大学副教授柳帆说。\n\n　　沈阳体育学院教授董传升表示，这些年冰雪运动进校园，专业化与大众化相结合的冰雪运动赛事也不断出现。设立雪假，通过政府购买服务的形式，有利于促进中小学生上冰上雪。用免费体验的方式，激活家庭滑雪需求，促进冰雪资源优化配置，也补齐冰雪运动场地设施的短板。\n\n　　孩子有假，家长能陪，学校兜底\n\n　　2025年12月，吉林省首个雪假落地，当时为全省义务教育学校统一放假。效果立竿见影：雪假期间全省接待游客945万人次，出游总花费89亿元，同比分别增长119%和31%；酒店预订量暴涨147%，重点滑雪场亲子客群占比超过60%。\n\n　　“雪假为冰雪文旅创造了可深入接触的消费时段。”柳帆认为，雪假让本地及周边居民拥有充裕的错峰窗口，能够从容体验冰雪项目，实现从“打卡式游览”向沉浸式体验的转变。他表示，目前，雪假的实施区域主要集中于多雪地区，通过雪假可以释放冰雪出游需求，带动滑雪场、冰雪乐园、民宿、餐饮、文创产品等业态客流，拉长冰雪文旅消费链条。\n\n　　在吉林省首个雪假期间，热门雪场预约难、现场核验拥堵、瞬时客流集中等问题也随之出现。\n\n　　对此，2026年吉林省的雪假方案作出调整。雪假时间确定为每年12月1日至20日内，具体日期由各市(州)结合气象条件、教学进度、冰雪场地承载力和文旅接待能力统筹错峰安排。此外，今年雪假实现惠民升级，免费体验次数增加：学生免费滑雪滑冰从上一年的1次增加到3次，每次3小时；免费游览省内A级景区也从1次增加到3次。各县市区通过政府购买服务的方式承接，全省公共文博体育场馆面向中小学生免费延时开放。\n\n　　今年雪假期间，吉林省还鼓励各地各级机关企事业单位落实职工带薪休假制度，通过分段休假、错峰休假、调休等灵活方式，为有义务教育阶段子女的职工预留雪假休假窗口。\n\n　　尽管有这么多利好政策，家住吉林长春的张先生还是有些担忧。他和妻子在高校工作，雪假期间“肯定没法和孩子同步休假，可能还是和去年一样，带着孩子去单位”。\n\n　　针对家长带娃难题，新疆阿勒泰地区教育局要求，开展校内免费托管服务，针对雪假期间双职工家庭、留守儿童、困境家庭等不能参加研学的学生，各县(市)各学校开放自习室、图书馆、运动场馆等设施，提供免费托管服务。\n\n　　杨卫安建议，针对看护难和预约场地难等问题，学校可组织集体冰雪研学，统一预约场地，由教师、专业教练随队照护，无法陪同的家长可委托教练或亲属并签订委托书。在资源统筹上，对农村和偏远学校采取“送教下乡”、移动冰场、集中包车进雪场等方式，尽量把服务送到孩子身边；在安全保障上，统一购买运动意外险，配足专业教练与医护保障，建立预约调度机制防止扎堆。\n\n　　通过特色假期推动教育特色化发展\n\n　　近两年，各地陆续设立春假、秋假、雪假等特色假期。\n\n　　目前，有十余个省份的学校试点春秋假、雪假制度。在时间安排上，与清明、“五一”、中秋等法定假期“凑整”连放外，有些地方探索结合传统节日、地方风俗、气候特点设置放假时段，多为2至3天。\n\n　　2020年，教育部在答复相关建议时指出，在保证开足开齐国家规定课程，完成好正常教育教学任务和教学时长的前提下，学校放假时间包括春秋假时间由各地、高等学校结合实际做出具体安排。\n\n　　杨卫安说，这些假期都可以被当成“撬动教育特色化发展的杠杆”。他认为，应坚持“一地一策”，用好各地特色资源；提炼可复制的制度经验，逐步推广“特色假期+实践教育”模式。\n\n　　其他地区可用本地资源替代冰雪，如江南的水、西部的山、乡村的田野，形成春秋假、农忙假、雪假等多样化的实践样态。杨卫安建议：“国家层面可出台指导意见，明确假期时长、经费保障、课程标准和安全规范标准，把地方探索上升为相对固定的假期制度，让每个孩子都拥有‘属于自己家乡的假期’。”\n\n　　(本报记者 陈鹏） 【编辑:曹子健】",

          "body": "​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台，聯同投資推廣署和香港貿易發展局（貿發局），以及香港科技園公司，在芬蘭赫爾辛基舉行的Slush 2026上，舉辦題為「下一站亞洲：透過香港拓展創科業務」的研討會，介紹香港的創新科技（創科）發展，以及香港為有意拓展亞洲市場的北歐初創企業提供的機遇。\n\n　　駐倫敦經貿辦處長周雪梅在研討會上致辭，介紹香港為北歐企業拓展亞洲市場的重要平台。她表示，香港匯聚國際人才、科技和資本，並協助企業把握中國內地，特別是粵港澳大灣區（大灣區）和其他亞洲市場的發展機遇。\n\n　　周雪梅亦介紹在《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》下，香港發展成為國際創科中心的願景。她指出，香港正積極推進「三大創科園區、五大研發機構」的建設，並投放大量資源，進一步完善創科生態圈，加快科研成果轉化，開拓更多商業機遇。\n\n　　她亦介紹北部都會區，指出這項重大發展計劃將為創新發展和跨境合作帶來新機遇。她指出，區內的河套深港科技創新合作區香港園區——港深創新及科技園（港深創科園）和新田科技城相互配合，推動研發、成果轉化及產業發展。她亦介紹港深創科園與毗鄰深圳園區所採用的「一河兩岸、一區兩園」獨特跨境合作模式。這個模式為北歐企業提供良機，讓它們在香港設立據點，善用香港「一國兩制」下的獨特優勢，與香港及深圳的科研機構和創科夥伴合作，並充分利用大灣區的科技和製造業資源。\n\n　　投資推廣署創新及科技，生命與健康科學總裁黃煒卓亦於研討會上以「香港作為通往中國及更廣泛亞洲地區商機的門戶（從科技創投角度出發）」為題發表演講。另外，貿發局、香港科技園公司及兩間北歐企業代表在爐邊對談環節中，分享他們對香港創科領域的最新發展、海外企業可把握的機遇，以及行業未來發展前景的見解。講者亦結合自身經驗和專業知識，探討北歐初創企業進軍香港市場、尋找合適合作夥伴，以及進一步拓展亞洲市場時需要考慮的實際因素。\n\n　　駐倫敦經貿辦會繼續與投資推廣署、貿發局及香港科技園公司緊密合作，推廣香港的創科發展，促進香港與北歐創科企業之間的合作。\n\n　　Slush是年度的全球初創盛會，在赫爾辛基舉行，匯聚來自世界各地初創企業創辦人、投資者及科技與創業生態圈的其他成員，為參與者提供交流經驗，以及與潛在投資者及商業夥伴建立聯繫的平台。",

          "body": "​以下是政務司司長陳國基今日（十一月十八日）在立法會會議上根據《基本法》第七十三條第（七）項及《香港終審法院條例》第7A條動議有關委任香港終審法院的其他普通法適用地區法官的擬議決議案的總結發言：\n\n主席：\n\n　　我衷心感謝剛才四位議員就任命終審法院其他普通法適用地區非常任法官提出的寶貴意見，也多謝各位議員支持任命區諾德爵士。\n\n香港的國際法律中心地位\n\n　　香港的國際法律中心地位，在國家「十五五」規劃得到明確支持，而《香港第一個五年規劃》其中一個主要目標，是善用普通法制度獨特優勢，深化國際法律中心地位。\n\n　　區諾德爵士與其他在任的終審法院非常任普通法法官一樣，都是享負盛名的普通法專家。委任這些傑出的海外法官，讓他們參與終審法院聆訊的工作，充分顯示他們對香‍港司法制度及司法獨立的信心，亦促進不同司法管轄區法官的相互交流、互相啓發、精益求精，實實在在發揮香港在「一國兩制」下作為國家唯一普通法管轄區的優勢。\n\n　　我們要積極向外宣揚香港這優點。特區政府也在持續做這方面的推廣。\n\n　　律政司本月初舉行的年度旗艦盛事香港法律周，正正向國際法律界人士展現香港作為國際法律樞紐的領導地位。隨着國際統一私法協會亞太聯絡辦公室在香港開幕，「國際私法三姊妹」，即國際統一私法協會、海牙國際私法會議，以及聯合國國際貿易法委員會都已全數落戶香港，加上其他國際組織，例如國際調解院的成立，充分彰顯國際社會對香港法治的高度信賴。而我們今次再度任命海外資深法官加入終審法院，亦一再證明了國際法律界對香港特區司法制度與法治質素的高度認可與信任。\n\n法官的來源\n\n　　我很多謝何君堯議員剛才提到是否可以任命來自更多普通法適用地區的法官。\n\n　　《基本法》第82條和《香港終審法院條例》第‍5（3）條規定：終審法院可按需要邀請其他普通法適用地區的法官參‍加終審法院的審判。《香港終審法院條例》亦規定：在聆‍訊及裁決上訴案件的終審法院法官當中，必須包括一名非常任法‍官。根據《香港終審法院條例》的規定挑選及邀請非常任法‍官參與聆訊，實屬行使《基本法》所賦予獨立司法權力的其中一環。\n\n　　一直以來，司法機構都是按《基本法》的規定，根據法官本人的司法和專業才能，從本地及其他普通法適用地區考慮聘用個別人士到終審法院服務。現‍時，終審法院共有九名非常任法官，包括四名非常任香港法官和五名非常任普通法法官，他們來自英國、澳洲和新西蘭，在這些地方具備豐富的司法履歷及經驗，專業地位和聲譽崇高。在唯才是用的大前提下，如有具備頂尖優秀司法和專業才能的合適人選，來自其他普通法適用地區的法官亦會獲考慮。司法機構會繼續留意終審法院的運作需要，並在適當時候向獨立的司法人員推薦委員會作出建議。\n\n獨立的司法制度\n\n　　司法機構一直致力維護香港的法治精神，以及受《基本法》保‍障的獨立司法制度。法官和司法人員的憲制職責，是在行使其司法權力時，須獨立和專業地以法律和證‍據為依據，以無懼、無偏、無私、無欺之精‍神，嚴格根據法律原則，維持司法公義。經過多年來的實踐，終審法院已在國際上確立堅實的地位，成為普通法世界中頂尖卓越的最終上訴法‍院；當中，一眾非常任普通法法官的卓越貢獻，是廣獲認同的。\n\n結語\n\n　　主席，終審法院審理的案件涉及不同的法律範疇，非常任普通法法官過去參與審理的案件包括：刑事法、民事實務及程‍序、行政法、仲裁、商業法、土地法、稅務法等等。多年來，這些海外法官對香港維持高水平的司法制度和鞏固本港司法體系高度國際化的優勢，貢獻良多。\n\n　　區諾德爵士在國際司法界地位崇高，其專業造詣與聲望橫跨眾多法律領域。特區政府同意司法人員推薦委員會的建議，並相信這項任命將使終審法院的非常任法官陣容更為堅實，維持終審法院的最高司法水平。\n\n　　我懇請各位議員同意這項任命。多謝主席。",

          "title": "設計營商周2026及DesignInspire創意設計博覽開幕",
          "url": "https://www.info.gov.hk/gia/general/202611/18/P2026111800257.htm",
          "summary": "設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。",
          "summary_short": "設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。",
          "digest": "設計營商周2026及DesignInspire創意設計博覽舉行開幕典禮",
          "points": [
            "連同城區活動「設計@HKG」2026及「deTour 2026設計節」…",
            "文化體育及旅遊局局長羅淑佩今日出席設計營商周2026開幕典禮及DesignInspire創意…",
            "政府將繼續推動設計及創意產業發展，進一步鞏固香港作為中外文化藝術交流中心的地位"
          ],
          "section": "政府公布",
          "category": "",

          "published_at": "2026-11-18T23:57:00+08:00",
          "size": 1,
          "keywords": [],
          "body": "設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。連同城區活動「設計@HKG」2026及「deTour 2026設計節」，這四項由文化體育及旅遊局轄下文創產業發展處資助的大型設計主題活動由即日至十一月二十九日先後或同期在香港舉行，匯聚本地及國際設計師、創意領袖、企業及品牌，為香港注入國際創意力量，將多元創意體驗帶進社區不同角落。\n\n  文化體育及旅遊局局長羅淑佩今日出席設計營商周2026開幕典禮及DesignInspire創意設計博覽交流酒會時表示，兩項活動均展現香港在連繫全球創意人才、促進跨文化交流及商業協作方面的獨特優勢。政府將繼續推動設計及創意產業發展，進一步鞏固香港作為中外文化藝術交流中心的地位。\n\n  設計營商周由香港設計中心主辦，並由瑞士擔任今屆峰會的夥伴國家。活動以「設計共話：從連繫到蛻變」為主題，匯聚超過60位來自瑞士、捷克、韓國、德國等地，以及中國內地和香港的創意領袖與商業決策者，今日起一連三日圍繞多個關鍵議題展開深入討論。\n\n  由香港貿易發展局主辦的DesignInspire創意設計博覽今日至十一月二十一日舉行。今屆展會以「Wander & Wonder」為主題，匯聚來自17個國家及地區、超過200個參展商，透過展覽、講座、工作坊及商業對接活動等，以設計串連文化、產業與日常生活，連結設計師、品牌、買家、設計愛好者及公眾。焦點節目包括由香港藝術家策劃的「Cabinets of Wonders」、由瑞士設計工作室創作的「Breathing in Motion」、由米蘭國際家具展Salone del Mobile.Milano呈獻的「ABITO/HK」以及由香港燈光設計師和室內設計師策劃的「House of Lumière」。\n\n  此外，香港設計中心今晚於DX設計館舉辦「炫彩香港」活動，慶祝DX設計館成立兩周年並為七個新展覽開幕。文創產業專員黎細明出席開幕儀式。\n\n  各項活動為業界和廣大市民帶來一場全城設計盛會，也匯聚香港及國際創意人才與資源，促進跨界別和跨文化交流，推動香港成為亞洲創意之都。所有公眾展覽均免費入場，歡迎市民親臨參觀，更多有關活動的資訊，請瀏覽以下網頁：\n\n設計營商周：2026.bodw.com/zh-hk\n\n設計@HKG：designathkg.com/zh\n\nDesignInspire：designinspire.hktdc.com/tc\n\ndeTour 2026設計節（十一月二十日開幕）：main.detour.hk/zh-hk\n\n炫彩香港： www.hkdesigncentre.org/tc",
          "image": "",
          "video": "",
          "video_poster": "",
          "lang": "zh-Hant"
        },

          "summary": "食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮獲金獎和銅獎。",
          "summary_short": "食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮…",
          "digest": "食物環境衞生署發言人表示…",
          "points": [
            "食物環境衞生署（食環署）發言人今日（十一月十八日）表示…",
            "獲得金獎的觀塘區鯉魚門（嶺南新村）公廁採用了「廁世代PT 2.0．公廁設計比賽」的得獎設計概…",
            "該公廁貫徹「以人為本」的設計理念，內部空間寬敞，並設有配備自動門的暢通易達洗手間和通用洗手間"
          ],
          "section": "政府公布",
          "category": "",
          "source": "hkgov",
          "source_display": "香港政府新闻公报",
          "published_at": "2026-11-18T23:00:00+08:00",
          "size": 1,
          "keywords": [],
          "body": "食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮獲金獎和銅獎。\n\n　　獲得金獎的觀塘區鯉魚門（嶺南新村）公廁採用了「廁世代PT 2.0．公廁設計比賽」的得獎設計概念，以「管水母」為靈感，透過靈活組合的模組化結構，完美配合不同地形和環境，將創意融入公共設施中。該公廁貫徹「以人為本」的設計理念，內部空間寬敞，並設有配備自動門的暢通易達洗手間和通用洗手間；公廁外亦設有飲水機，方便市民和旅客使用。公廁亦已裝設智能監察系統，實時監測異味並自動通報，提升衞生水平和管理效率，並透過非接觸式意見回饋系統，收集使用者的意見，作為改善服務和未來規劃的參考。此外，其暢通易達洗手間更設有智能意外感應系統，偵測跌倒和異常停留情況，以便適時提供協助。\n\n　　至於獲得銅獎的南區香港仔大道公廁，翻新後以溫暖的大地色系配搭簡潔俐落的線條設計，展現獨特的現代美學。該公廁內設有供兒童和長者使用的設施，照顧不同年齡使用者的需要。\n\n　　發言人說：「食環署一直採取多管齊下的方式，包括引入新科技，提升轄下公廁的設施、管理和衞生水平，並在設計上照顧不同使用者的需要。食環署轄下公廁屢獲殊榮，反映署方持續提升公廁服務的工作得到肯定，值得鼓舞。要長期保持公廁乾淨舒適，亦有賴前線人員用心清潔和管理，署方感謝他們的努力和貢獻。」\n\n　　食環署早前已留意到荃灣區柴灣角公廁內部分位置傳出異味，並即時通知相關部門安排維修。署方已在公廁附近加設流動廁所，並會在公廁維修工程完成前加強流動廁所的清潔工作，同時要求相關部門加快維修損壞的設施。此外，為改善大橋村公廁和通州街公廁的設施，食環署已將兩間公廁納入翻新計劃，除了要求承辦商加強清潔工作，亦會密切監察承辦商的服務表現。\n\n　　現時，食環署管理逾800所公廁，近年積極夥拍建築署推展優化公廁翻新計劃。在2019年推行該計劃前，約有110所公廁已率先展開翻新。在計劃涵蓋其餘約700所公廁中，目前已有近八成半展開工程，其中逾250所的工程已順利竣工。署方目標在2028年年底前，全面為餘下約110所公廁開展翻新工程。\n\n　　採納香港城市大學顧問報告的建議，食環署自2023年起，已於使用量高的新建或翻新公廁落實 1:2.32 的男女廁格比例標準。對於使用量不高或偏遠的公廁，則會視乎場地環境、空間限制及實際運作需要而靈活調整。\n\n　　發言人表示，食環署一直致力改善公共衞生環境，未來會持續加強轄下公廁的清潔和管理，並積極引入智慧科技和人性化配套，從軟件和硬件入手推動公廁現代化，為市民和旅客提供更優質的公廁環境。署方亦呼籲市民和訪客愛惜公廁設施、保持清潔，共同維護城市公共衞生。",

          "body": "以下是教育局局長蔡若蓮博士今日（十一月十八日）在立法會會議就「深化國際教育樞紐建設，構建國際升學首選地」議員議案的開場發言全文：\n\n主席：\n\n　　感謝范凱傑議員提出議案，鄧飛議員、李家駒議員、陳勇議員、陳穎欣議員提出修正案，就「深化國際教育樞紐建設，構建國際升學首選地」提出具體並有建設性的意見和建議。\n\n　　教育是國之大計。當前，國家正全面推進教育強國建設，「十五五」規劃明確提出教育、科技、人才一體化發展的戰略部署。香港在「一國兩制」下的獨特優勢，配合科教興國戰略，對接及服務國家發展大局，建設香港成為國際教育樞紐及高端人才集聚高地。\n\n　　香港教育質素享譽國際，加上高度國際化環境和良好的治安水平，讓香港成為世界各地優秀學生的理想留學地。去年，香港教育競爭力位列全球第三，而在今年接連公布的泰晤士高等教育（THE）二○二七年世界大學排名以及Quacquarelli Symonds（QS）二○二七年亞洲大學排名中，本地院校亦持續獲得高度評價，分別有五所大學位列世界百強，以及有五所大學躋身亞洲十強，其中三間大學更同時登上亞洲五強，反映高等教育的實力以及香港特區政府持續投入資源及推行各項措施的成果。\n\n建設香港成為國際教育樞紐\n\n　　為發揮香港高等教育的獨特優勢，我們構建「留學香港」的組合政策，制定具前瞻性、全局性及戰略性的策略，包括：統籌專班的組織保障、遊學與品牌宣傳、收生與獎學金，以及宿舍與留才支撐等，進一步深化國際教育樞紐建設。\n\n　　在統籌協調方面，教育局成立了留學香港專班，統籌大學教育資助委員會（教資會）、創新科技及工業局／創新科技署、勞工及福利局／香港人才服務辦公室、經濟貿易辦事處和政制及內地事務局／駐內地辦事處的工作，吸引全球優秀人才及學者來港升學和進行研究。\n\n「留學香港 」和「遊學香港」品牌\n\n　　同時，政府致力打造「留學香港」和「遊學香港」品牌，促進本地專上教育界擴容提質，組織首屆「留學香港周」，舉辦亞太國際教育協會年會暨展覽（APAIE 2026），吸引來自72個國家及地區、超過600間大學及機構參展，逾 3 500名國際教育界翹楚及專家齊聚香江。最近，又接連舉辦全球大學校長及領袖高峰會和世界頂尖大學校長論壇，匯聚來自全球頂尖大學及機構的高等教育領袖，其間，多所國內外頂尖學府與機構簽署合作協議，標誌了香港在全球高等教育界的地位和號召力。\n\n　　另外，政府鼓勵專上院校舉辧高增值的遊學產品，吸引中外學生參與。通過優質遊學體驗，加深學生對香港和對香港高等教育的認知與嚮往，拓展生源渠道，匯聚人才。今年暑假，八所資助大學合共舉辦超過100項「遊學香港」暑期課程、宿營、交流團等，反應非常熱烈。\n\n　　目前，修讀教資會資助課程的非本地學生人數，已由二○二三／二四學年的23 100人大幅增加至二○二五／二六學年的30 400人，來自全球超過100個國家及地區。《行政長官2026年施政報告》亦訂下於二○二六／二七學年，在香港修讀經本地評審全日制專上課程的非本地學生數目增加至大約90 000人的目標。\n\n與海內外高等教育協同發展\n\n　　與海內外高等教育協同發展方面，過去三個學年，六所教資會資助大學（即香港城市大學、香港浸會大學、香港中文大學、香港理工大學、香港科技大學及香港大學）與內地及海外院校合辦本科雙學位／聯合學位課程，包括美國、英國、法國和日本等，以及泰國、馬來西亞、印尼及菲律賓等東南亞國家，每個學年共開辦約60個雙學位／聯合學位課程，涵蓋STEAM（科學、科技、工程、藝術和數學）、社會科學、人文科學、法學、經濟及工商管理學等範疇。\n\n　　八所教資會資助大學與全球各地院校簽訂了超過2 700份學生交流協議，當中歐洲地區佔超過四成；北美洲和亞洲其他地區（不包括中國內地）亦佔近四成，為本地學生提供拓展國際視野的機會。\n\n加強支援配套\n\n　　當前，政府正多管齊下加強支援配套，深化國際教育樞紐建設。在獎學金方面，為加強與「一帶一路」沿線國家的教育合作，政府推出「一帶一路獎學金」，資助來自「一帶一路」沿線國家的非本地學生，每年發放獎學金的名額由最初的10個逐步增加二○二七／二八學年的200個，吸引更多「一帶一路」國家傑出學生來港升學。\n\n　　在住宿供應方面，發展局聯同教育局於二○二五年推出「城中學舍計劃」，透過放寬發展管制措施，鼓勵市場以自資和私營方式將現有商廈改裝或重建為學生宿舍，以增加專上學生宿位供應。至二○二六年十月底，已有45宗申請獲確認資格，落成後共可提供約11 450個宿位。\n\n　　在簽證方面，為便利各地學生前來香港修讀全日制短期課程，入境處於二○二五年落實了優化措施，豁免申請人提交經濟狀況證明，並縮短審批時間。至於非中國籍留學生前往內地的簽證事宜，經諮詢入境事務處，非中國籍香港居民（包括非永久性居民）二○二三年十月起可在港申請「一簽多行」簽證到內地，簽證有效期增至最長五年。至上月底，已有超過53 500宗「一簽多行」簽證申請獲批，便利他們多次往返內地進行文化、學術交流，鞏固本港國際教育樞紐的地位。\n\n　　在吸引人才留港發展方面，政府二○○八年推出「非本地畢業生留港／回港就業安排」（IANG），讓非本地學生在香港專上院校畢業後申請在港工作，IANG的首次逗留期限亦自二○二二年底起由12個月延長至24個月，讓受惠畢業生有更多時間在港尋找工作。政府又以試行形式擴展有關安排至涵蓋本港大學粵港澳大灣區內地城市校園的畢業生，便利大灣區內人才流通，進一步增加留學香港的吸引力。\n\n全速推進北都大學城發展\n\n　　在支持專上教育擴優提質方面，政府正全力建設北都大學城（包括新田、洪水橋及打鼓嶺大學城），總體規劃面積超過1 000公頃，以「一城五元素」（教育、科技、產業、人才及城市建設）推動教育、科技與人才一體化發展。其中三幅洪水橋大學城校園區用地現正接受合資格專上院校申請建設校舍，起動校園區的發展。由政務司司長領導的「大學城籌劃及建設組」將提升為「大學城建設及發展委員會」，強化頂層架構督導。配合北都大學城發展，政府推出措施，包括：增加教資會資助研究院研究課程學額、逐步提升香港博士研究生獎學金計劃名額，以及額外撥款支持知識共享和「科教創新基金」，全速推進北都大學城發展。\n\n國際教育樞紐推展至基礎教育\n\n　　另外，我們致力把「留學香港」品牌推廣至基礎教育。教育局自二○二六／二七學年起，以試點形式推行「直資擴容」計劃，透過優化現時直資學校的收生政策，讓有足夠資源及條件許可的直資學校，申請加大錄取持學生簽證的非本地學生。今年《施政報告》宣布，教育局會持續推進計劃，鼓勵更多直資學校錄取持學生簽證的非本地學生。目前，已有48所直資學校獲接納參與計劃。現階段，進一步開放資助中小學學位予持學生簽證的非本地生，要充分考慮基礎教育的核心任務、公帑資助邏輯、簽證限制及硬件配套等條件，我們會適時總結「直資擴容」計劃，務實審慎訂定長遠發展路向。\n\n　　支援非本地家庭子女教育需要方面，政府支持國際學校體系蓬勃發展，以便利和吸引因工作或投資而來港居住的家庭。教育局一直密切留意國際學校學額的供求情況，並持續通過「校舍分配機制」，以象徵性地價或租金分配土地或空置校舍作國際學校用途。為應付長遠需要及配合北都發展，今年《施政報告》宣布計劃於明年內批出北都或其他地區的用地發展國際學校，我們會適時透過「校舍分配機制」分配有關用地。\n\n　　在加快香港中學文憑考試（文憑試）國際化方面，香港考試及評核局致力拓展文憑試的國際認受性，並就相關科目進行基準比較研究，為海外院校提供客觀參考。文憑試資歷獲廣泛認可，為考生開拓多元升學及就業出路。目前，超過2 100所海外高等院校已公布接納文憑試作為入學資歷；內地則有165所高校可根據文憑試成績直接錄取香港學生。多個歐洲國家、印度及「一帶一路」沿線地區的院校亦接受文憑試成績作升學申請。\n\n　　主席，教育局會繼續深化國際教育樞紐建設，提升香港教育的國際地位和影響力。面對全球激烈的人才競爭，政府在推廣留學香港品牌時，定位並不在是否成為首選，而在香港作為理想留學地的獨特價值和優勢。「Hong Kong: Your World-class Campus」強調的是教育品質與科研實力，而不是首選地位。香港的核心吸引力並不在於唯一選擇，而在於背靠祖國、聯通世界的國際化環境，以及享譽國際的學術地位等疊加優勢。因此，在推廣「留學香港」時，我們採取務實及針對性拓展策略，強調香港的獨特優勢，吸引頂尖學者和優秀學生。我們期待與各位議員集思廣益，共同推進相關工作，並在聆聽各位議員的發言後，再作回應。\n\n　　多謝主席。",

          "body": "以下是文化體育及旅遊局局長羅淑佩今日（十一月十八日）出席「香港冬日小鎮．中環」啓動禮的致辭全文：\n\n林建岳博士（香港旅遊發展局（旅發局）主席）、Mr Graeme Torre（置地公司香港中環物業組合行政總裁）、各位嘉賓和傳媒朋友：\n\n　　大家晚上好。今日我很高興可以參加香港旅遊發展局「香港冬日小鎮．中環」啓動禮，為香港繽紛冬日巡禮拉開序幕。現在距離聖誕節剩下一個多月的時間，我們身處的中環已經充滿濃厚的聖誕氣氛，天氣亦開始轉涼，可以穿上「bling bling」的衣服。街道及商店都掛滿色彩繽紛的聖誕燈飾及裝置，讓人目不暇給。\n\n　　去年在這裏的「冬日小鎮」及沉浸式光影匯演，首度登場即大獲好評，今年旅發局再接再厲，除中環外，將「冬日小鎮」帶到尖沙咀和銅鑼灣，並呈獻不同主題的光影表演，進一步推高冬日節慶氛圍，讓市民和旅客感受到「只在香港」的濃濃節日氣氛。\n\n　　由今晚至明年一月初，多座中環標誌性建築物的外牆將呈獻精彩的光影表演，盡展香港夜間的閃爍魅力。稍後，維港對岸的尖沙咀「冬日小鎮」亦會啓動，帶來雙重的冬日光影體驗，與中環互相輝映。\n\n　　今晚亦是一個重要的歷史時刻。陪伴了我們22年的「幻彩詠香江」即將上演最後一場匯演，完成它的歷史使命。「幻彩詠香江」在二○○五年獲列入健力士世界紀錄，成為全球最大型燈光音樂匯演，亦是全球首批每晚恆常上演的大型燈光匯演之一，多年來向無數市民及旅客帶來了香港維港天際線的璀璨夜色，現在完成歷史任務了。今晚的匯演特別加入大廈樓頂煙火效果，為這場經典匯演劃上圓滿句號。接下來，旅發局會繼續舉辦及支持許多活動。近日的國際中秋綵燈匯、大坑舞火龍、香港美酒佳餚巡禮等，都深受市民及旅客歡迎，大大提升香港夜間的熱鬧氛圍，亦帶旺零售及餐飲業，成效有目共睹。未來，旅發局將會繼續推出不同項目，我亦呼籲零售和餐飲業界朋友與旅發局攜手，進一步豐富香港的夜間體驗。 \n\n　　聖誕節是普天同慶的節日，我預祝市民及旅客有一個愉快的佳節，亦感謝各位嘉賓及合作夥伴的支持，讓我們能在這個冬季，再次把歡樂與祝福帶給全港市民和到訪香港的旅客。\n\n　　祝各位聖誕快樂，Merry Christmas！",

          "body": "香港海關於十月二十七日及昨日（十一月十七日）偵破兩宗毒品案件，檢獲約十一公斤懷疑氯胺酮、約五百克懷疑依托咪酯粉末、約二點二公斤懷疑液態依托咪酯及超過一千三百粒懷疑依托咪酯煙彈，並拘捕三人。檢獲的懷疑毒品市值共約六百八十萬元。\n\n　　首宗案件中，香港海關與內地海關緝私部門進行聯合執法行動，根據情報交流及透過風險評估，於十月二十七日截查一件由英國經內地寄抵香港，報稱海鹽身體磨砂膏的包裹。經檢查後，海關人員於二十八個膠樽內發現約十一公斤懷疑氯胺酮。跟進調查後，海關人員採取監控遞送行動，並於昨日在佐敦拘捕一名五十歲本地女子。\n\n　　第二宗案件中，海關人員昨日下午在元朗執行反毒品行動期間，截查兩名同為二十八歲的本地和內地男子，並帶二人到附近一個村屋單位搜查。海關人員在該單位內檢獲該批懷疑依托咪酯毒品和懷疑製毒及毒品包裝工具。\n\n　　首宗案件被捕的女子已被控以一項企圖販運危險藥物罪，案件將於明日(十一月十九日)在九龍城裁判法院提堂。\n\n　　第二宗案件的兩名被捕男子已共同被控以一項製造危險藥物罪及一項販運危險藥物罪，而該名被捕本地男子亦另被控以一項阻撓一名海關人員罪。他們將於明日在粉嶺裁判法院提堂。\n\n　　根據《危險藥物條例》，製造危險藥物和販運危險藥物均屬嚴重罪行，一經定罪，最高可被判罰款五百萬元及終身監禁。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑販毒活動。",

          "body": "政制及內地事務局粵港澳大灣區發展辦公室將參與十一月十九（星期四）和二十日（星期五）在香港會議展覽中心舉行的創業日展覽，介紹粵港澳大灣區建設帶來的機遇，以及政府支援香港青年到大灣區創業的相關政策措施及計劃。\n\n　　《香港第一個五年規劃》對接國家「十五五」規劃，當中設有大灣區專章，明確指出香港會參與大灣區建設。辦公室一直通過多元化渠道，推廣大灣區建設帶來的重大機遇。今年辦公室繼續參與創業日展覽，重點展示北部都會區及河套深港科技創新合作區的發展潛力，讓創業者了解香港與大灣區內地城市協同發展所帶來的新機遇。\n\n　　辦公室的展位提供實用資訊，包括大灣區發展概覽、支援香港青年到大灣區創業的各項措施，以及設於廣州的粵港澳大灣區發展推廣中心提供的支援服務，協助有志到大灣區內地城市發展的創業者了解相關資訊。現場亦有精美限量紀念品派發，送完即止。\n\n　　辦公室的展位設於香港會議展覽中心展覽廳1E（編號1E - F02）。展覽免費入場，開放時間為十一月十九日（星期四）上午九時至下午六時三十分，以及十一月二十日（星期五）上午九時至下午六時。有意參觀的人士可於香港貿易發展局網頁（www.hktdc.com/event/eday/tc）預先登記。\n\n　　有關大灣區的更多資訊，歡迎瀏覽辦公室的專題網站(www.bayarea.gov.hk)。",

          "body": "食物環境衞生署食物安全中心（中心）今日（十一月十八日）宣布，因應英國環境、食物及鄉村事務部通報，指英國北愛爾蘭Coagh Townland爆發高致病性禽流感，中心即時指示業界暫停從該地區進口禽肉及禽類產品（包括禽蛋），以保障本港公眾健康。\n\n　　中心發言人說，根據政府統計處的資料，本港今年首九個月從英國進口約六百八十公噸冰鮮和冷藏禽肉及約二十二萬隻禽蛋。\n\n　　發言人說：「中心已就事件聯絡英國當局，並會繼續密切留意世界動物衞生組織及有關當局發出關於爆發禽流感的消息，因應當地疫情發展，採取適當行動。」",

          "body": "香港與智利今日（十一月十八日）簽署協議，設立讓兩地青年參與的雙邊工作假期計劃。\n\n　　工作假期計劃協議在香港特別行政區（香港特區）行政長官李家超與智利總統卡斯特共同見證下，由香港特區政府勞工及福利局局長孫玉菡與智利外交部部長弗朗西斯科·佩雷斯·麥肯納於深圳舉行的亞太區經濟合作組織第三十三次領導人非正式會議期間簽署。\n\n　　孫玉菡歡迎與智利設立這個計劃。他說：「智利是香港在拉丁美洲的首個工作假期計劃合作夥伴。該計劃將為香港和智利的青年提供開拓視野的機會，讓他們親身體驗在不同文化中生活和工作。」\n\n　　弗朗西斯科·佩雷斯·麥肯納表示：「我們很高興能為智利和香港青年提供新機遇，讓他們體驗彼此的當地生活。香港東西方文化的獨特融合、國際化的視野和充滿活力的經濟，將為智利青年帶來豐富的體驗。我們也期待香港青年來智利探索其豐富的文化、熱情好客的民風和秀麗的自然風光，從而增進彼此的了解和人文交流。」\n\n　　智利是香港第十五個雙邊工作假期計劃夥伴。自二○○一年起，香港已先後與新西蘭、澳洲、愛爾蘭、德國、日本、加拿大、韓國、法國、英國、奥地利、匈牙利、瑞典、荷蘭及意大利（即將生效）訂立工作假期計劃。至今已有超過109 000名香港青年參與計劃，從中得益。\n\n　　在香港與智利的工作假期計劃下，雙方青年人可以申請簽證，在智利或香港逗留最多十二個月。在這段期間，他們可從事短期工作以賺取旅費，或修讀短期課程。雙方每年各有一百個名額。\n\n　　有關香港和智利申請人的申請簽證程序，稍後將分別於智利移民局網站tramites.extranjeria.gob.cl/和香港特區入境事務處網站www.immd.gov.hk/公布。",

          "body": "中新网南宁11月19日电 (张广权 王以照 黄姿娜)2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术交流活动18日在广西南宁举行。现场公布大赛最终获奖结果并颁奖。\n\n　　该赛事是中国首个面向东盟国家的气象人工智能专项赛事。大赛自6月启动以来，吸引中国及东盟六国逾千名科创力量参与，104支队伍晋级决赛，共评出55个奖项，一批可落地、可跨境推广的创新成果集中亮相。\n\n11月18日，2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术交流活动在广西南宁举行。现场公布大赛最终获奖结果并颁奖。刘英轶 摄\n\n　　大赛设置“AI+气象数智计量”“AI+短时降水预报”“AI+众创气象服务”三大赛道。中国与东盟国家联合组队，跨境协作从“技术输出”走向“联合研发”，并依托云上算力支撑多模型同步推演。\n\n　　决赛路演环节，创新成果集中亮相。“多源融合短时降水预报模型”综合评分较传统数值模式提升34.7%；泰国代表队展示的“城市内涝智能预警方案”，可将多源多要素气象监测数据转化为街道积水风险研判。\n\n　　泰国气象局航空气象研究与发展处处长普差潘·西里萨(Putchaphan Sirisap)表示，人工智能正助力气象预报更加精准，在短时降水、城市内涝等场景中更好守护民众生命安全。\n\n　　广西壮族自治区政协副主席钱学明表示，气象与人工智能天然契合，广西以气象智能预警方案“妈祖”为抓手，深化与东盟国家的气象合作交流。希望未来推动更多气象创新成果走出赛场、惠及公众；利用人工智能等技术手段提升气候变化、极端天气应对能力。(完)\n\n 【编辑:何颖】",

          "body": "11月7日、8日，貝托祺（Tarmo Peltokoski）攜手香港管弦樂團、八位獨唱家及六個合唱團，合共近六百人，於香港文化中心隆重呈獻馬勒的鴻篇巨作第八交響曲，為他出任香港管弦樂團音樂總監揭開序幕。\n正如歌德在《浮士德》中寫下那句擲地有聲的詩句：「太初有為！」貝托祺選擇以「馬勒八」這部凝聚人類精神、創造意志與終極理想的宏偉篇章，開展他與香港管弦樂團的全新旅程。這一選擇不僅是他對藝術立場的鮮明宣示，也體現了他對音樂力量與藝術使命的深刻理解。馬勒以恢宏的音樂語言，呈現人類對愛、創造與精神昇華的不懈追尋；而這份不斷突破界限，向更高理想邁進的精神，亦與貝托祺的藝術追求形成深刻共鳴。\n以此作為履新之作，既是對馬勒宏大精神世界的致意，也寄寓着他對樂團未來的期許：以行動激發創造，以藝術凝聚力量，在傳統與創新之間不斷探索，讓音樂連繫個人、城市，乃至世界。\n躬行實踐 突破界限 貝托祺與港樂的藝術使命\n「太初有為！」 沒有甚麼比這句話更適合作為浮士德那種透過行動超越自我的精神，馬勒顯然也為這種精神所着迷。1906年夏天，他在自己的夏季作曲小屋中潛心創作，完成了第八交響曲，第二部分的歌詞正選自歌德的《浮士德》，其音響上的龐大、編制上的宏偉，以及精神內涵上的廣闊而細膩，共同構成「馬勒八」獨一無二的面貌。\n在作品首演116年後，2026年11月7日與8日，香港管弦樂團（港樂）新任音樂總監貝托祺在其就職音樂會上，帶領樂團及合唱團近六百人的演出陣容，一同在香港呈獻這部巨作。參與演出的包括八位中外歌唱家：積奇蓮．華格納（Jacquelyn Wagner）、坎睿思（Chen Reiss）、鄺勵齡、莫莉森（Catriona Morison）、菊克（Sasha Cooke）、卡塔亞拉（Tuomas Katajala）、坎達寧修斯（Rinalds Kandalincevs）及沈洋；以及香港管弦樂團合唱團、學士合唱團、倫敦愛樂合唱團、聖保羅男女中學高級混聲合唱團、英華書院合唱團及香港兒童合唱團。這份對「行動」的信念，對音樂理想的追求，以及對精神力量的共鳴，正是貝托祺與港樂共同秉持的精神。\n貝托祺曾形容馬勒八「如宇宙般宏大、普世人間、超凡入聖、眾志成城」。這次演出既是對馬勒宏大精神世界的回應，也寄託着貝托祺對自己執掌下的港樂未來的期許：以行動激發創造，以藝術凝聚力量，在傳統與創新之間不斷探索，讓音樂連繫個人、城市，乃至世界。\n當音樂行至終章，管風琴、樂隊與人聲齊鳴。音樂將代代相傳的精神，展現在觀眾面前。一瞬間，這股力量傳到每個人身上，震撼整個香港文化中心。貝托祺熟練地帶領樂團、合唱團和獨唱家，有序而細緻地完成演出。在場的人無不為之感動──這是音樂帶來的力量。\n早前，港樂行政總裁方恩哲（Bernhard Fleischer）上任時，我曾與他對話。他提到，希望自己與貝托祺及港樂各位同事，在港樂這個「正處於加速向前發展的時刻」攜手共進，以演出的「曲目策劃」和「演出質素」為本，不辜負每一位觀眾的期待。從2026/27樂季的節目策劃，到這場演出的呈現，這兩點都得到充分體現；他們以實際行動，交出令人滿意的成績。\n巡演歐洲 走向世界\n方恩哲希望港樂能夠始終保持一種「沒有局限」的特質：能駕馭多元豐富的曲目類型，不斷拓展藝術表現的疆界，同時進一步提升樂團的國際影響力，讓港樂在世界古典音樂舞台上佔據更鮮明的位置。\n11月底，貝托祺將率領港樂展開橫跨四國八城的歐洲巡演，登上多個世界著名音樂廳的舞台。此次巡演曲目兼具深度與光彩：以夫利格（Henk de Vlieger）根據華格納歌劇改編的《指環》：管弦樂冒險，以及布魯赫納第四交響曲為核心，展現樂團駕馭大型交響作品的能力與藝術深度。同時，鋼琴家赫姆森（Martin Helmchen）將演繹莫扎特第二十四鋼琴協奏曲，並與貝托祺攜手呈獻聖桑《動物嘉年華》，為這趟巡演增添別樣的音樂色彩。\n巡演城巿包括巴塞隆拿、漢諾威和慕尼黑，此外，在赫爾辛基、多蒙特、柏林、漢堡和維也納，港樂還將帶來中國作曲家姚晨為港樂巡演特別創作的《團團轉》。這不僅讓中國當代音樂創作走進歐洲音樂廳，也使港樂的國際巡演成為一次雙向的文化交流：既向世界展示樂團的藝術面貌，也將當代中國音樂的聲音帶到更廣闊的舞台。\n對港樂而言，此次巡演的意義並不止於拓展巡演版圖，或是在國際舞台上留下足跡；更重要的是，港樂能在不同音樂文化語境中檢驗自身的藝術實力，連結世界各地的聽眾，在交流與碰撞中，不斷拓展自身的可能性。從香港出發，走向世界，再將新的經驗與視野帶回香港──這樣的往返，正是一支立足國際的樂團成長的重要組成部分。\n方恩哲與貝托祺所強調的「沒有局限」，正是在這樣一次次實踐中獲得具體意義：不囿於地域，不拘於曲目，也不為藝術表現設限。正因如此，對一支立足香港、面向世界的樂團而言，真正的突破或許正在於此──躬行實踐，突破界限。\n文：謝嘉雯 圖：香港管弦樂團",

          "body": "洗潔精每天洗碗都會派上用場，隨著用量漸減，當快要見底時，有些人或許會習慣加點水進去、搖一搖繼續用。雖然這樣做看似節省一點，但背後的衞生狀況與清潔效果卻讓人不放心。到底洗潔精見底加水稀釋還能用嗎？有日媒特別邀請專家來為大家解答這個問題。\n主婦必看！洗潔精見底加水稀釋還能用嗎？\n根據日媒《grapee.jp》報導，清潔洗劑品牌「花王」明確指出：在清洗餐具或廚房用具時，不建議將洗碗精加水稀釋使用。\n【同場加映】洗潔精推介｜日本《LDK》評測14款人氣產品 4款獲A級 快乾/強效去油/溫和護手！\n花王表示，正確的用法是將適量（約1-2mL）的洗潔精倒在沾濕的海綿上，輕輕搓揉出泡沫後再使用。由於洗潔精在出廠時，其去油與清潔效果都是在「原液建議用量」下經過嚴格測試與配方設計的，一旦擅自加水稀釋，會導致濃度被稀釋，因而無法達到應有的清潔與去油效果。\n加水稀釋洗潔精的2大隱患\n「花王株式會社」指，除了洗不乾淨之外，將稀釋後的洗潔精長時間存放於瓶內，還可能導致變質，加水稀釋反而會失去原本的效能，將洗潔精加水稀釋還伴隨著以下隱患：\n加水稀釋洗潔精的2大隱患\n 洗劑容易變質：市售的洗潔精瓶內通常添加了適量的防腐劑，以確保在未開封或正常使用下的保存期限。然而，一旦加入自來水，不僅會破壞原本的化學平衡與防腐成分濃度，若將稀釋後的液體長時間存放於瓶內，更容易導致洗劑變質、發臭。\n 細菌滋生：自來水中並非無菌，且浴室或廚房周遭環境潮濕。當水進入洗潔精瓶後，若放置過久，反而容易成為細菌、黴菌（如綠膿桿菌等）滋生的溫床。原本為了清潔餐具而使用的洗潔精，若帶有大量細菌，洗碗時反而可能造成二次汙染，對家人的衛生健康帶來隱憂。\n資料來源：《grapee.jp》\n延伸閱讀：初級大人必學！臨時沒有洗衣液點算好？專家教用3大家居好物應急 天然除臭去漬首選這款",

          "body": "强势横扫、黑马逆袭、百炼成钢……如今，竞技体育赛事吸引了越来越多年轻人的目光。近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育赛事的青年开展的调查显示，竞技对抗带来的悬念与刺激感是受访青年观看赛事的首要原因。篮球、足球、乒乓球是受访青年最青睐的三项竞技项目。\r\n\n　　年轻人爱看哪些竞技体育比赛项目\n\n　　95后王卓琳从小受家人的影响开始观看竞技体育赛事，“小时候我们家里的电视除了放各种晚会，就是各项比赛，大家都是‘体育迷’。”她至今还记得2004年雅典奥运会上中国女排在先失两局的情况下连扳三局夺冠的瞬间，“给儿时的我带来了极大的震撼。”上中学后，她开始和同学一起看篮球比赛，渐渐地也开始看足球、网球、F1(世界一级方程式赛车锦标赛——记者注)等项目的比赛，“现在大部分知名赛事我都会看一下。”\n\n　　作为一名“体育迷”，在北京工作的90后李泽林在日常运动健身之余，也会关注羽毛球、乒乓球、电子竞技等赛事。“我印象最深的还是2011年看李娜法网夺冠的电视转播，当时这场比赛在国内也受到广泛关注，成为很多人了解网球的契机，我也是因此在上大学时开始学习网球。”\n\n　　丰富多样的竞技体育赛事，正在不断吸引年轻人的目光。大家都看过哪些竞技体育项目的比赛？调查中，篮球(58.0%)、足球(53.7%)、乒乓球(50.4%)位列前三。其他还有：羽毛球(39.2%)、游泳/跳水/花样游泳(33.4%)、排球(29.2%)、电子竞技(26.9%)、网球(24.1%)、田径(23.4%)、冰雪项目(22.3%)、赛车/摩托车赛(16.1%)、搏击/格斗类(12.1%)等。\n\n　　过半受访者因竞技对抗带来的悬念与刺激感而观赛\n\n　　正在读研究生的00后卫婕从2020年东京奥运会开始关注竞技体育赛事，“最开始是看乒乓球，现在比较关注短道速滑赛事。”对她而言，竞技体育的不确定性是赛事最大的魅力，“即使对手之间有一些差距，甚至可以说实力悬殊，你也很难准确预判比赛结果。”另外，她也会被选手的个人魅力打动，“我喜欢的一名短道速滑选手，尽管实力强劲，却因场外因素屡屡受挫，后来他选择换一个全新的环境，最终在世锦赛上拿到了久违的金牌。这种选手跌宕起伏的人生故事非常打动我。”\n\n　　在广东上学的05后赵欣更看重比赛本身的观赏性，“即便我力挺的队伍没有参赛，我也会观看相关比赛。只要是发挥出色、没有违规的选手，我都会为他们喝彩。”看到一些队伍即使历经千辛万苦、颗粒无收，却仍然在赛场上为了冠军奋勇拼搏时，她也会被感染，“队员们为了冠军并肩奋斗，最后一起捧起奖杯的画面，太打动我了。”\n\n　　“我觉得竞技体育的赛事结果充满变数，奇迹时有发生。这种不确定性，以及每名运动员在项目里拼尽全力、不断突破人类极限的努力，都带给我深深的震撼。” 王卓琳觉得观看体育赛事给她带来了一些积极的“刺激”。今年中超联赛期间，她和其他球迷一度以为成都蓉城会夺冠，“但大连英博专注眼前每一场比赛，一分一分去拼，拿下了最后的冠军。”\n\n　　哪些因素吸引现在的年轻人观看竞技体育赛事？数据显示，55.4%的受访青年是因为竞技对抗带来的悬念与刺激感；49.5%的受访青年是被不断突破自我、挑战极限的力量吸引；48.4%的受访青年感受到了其中的团队协作与集体荣誉感。此外，选手永不言弃、顽强拼搏的精神(43.2%)，对该体育项目的热爱(41.8%)，赛事本身的观赏性(40.0%)，运动员的个人特质、成长故事(21.9%)，可以和亲朋好友一起讨论交流(13.4%)等也是吸引受访青年观赛的因素。\n\n　　56.0%受访青年从观赛中学会了接纳输赢\n\n　　“想做的都去做吧！” 这是卫婕喜欢的一名选手分享在社交平台的一句话，在她迷茫时给了她很大鼓舞，“这让我面对选择时，不会因为害怕失败而退缩。”在观赛过程中，她也慢慢提升了抗压能力，学会了自洽。“运动员可能付出超过常人几百倍的努力，却仍会因为运气或其他因素没能拿到想要的结果。以前遇到不顺，我容易自怨自艾；现在我明白很多事不必过度纠结，就算努力之后没能如愿，我也能更坦然地接受。”\n\n　　为了支持自己喜欢的选手，赵欣开始尝试不少新事物，“比如一个人出门旅行，制作赛事物料，剪辑视频记录选手的成长。”除了学到新技能，观看竞技体育赛事也丰富了她的精神世界，选手的故事持续激励着她：“之前有一名选手年少成名，却十年无缘最有分量的冠军，最终在队伍不被任何人看好的情况下，以黑马之姿夺冠。” 每当想要放弃的时候，这段故事都能帮她重拾信心：“这些选手站在世界级赛事舞台上，顶着巨大压力，一次次遭遇失利，却依旧保持热爱、为之付出。相比之下，我生活里遇到的挫折其实微不足道，再坚持一下，或许我也能迎来不一样的结果。”\n\n　　观看竞技体育赛事给年轻人带来了哪些积极影响？调查显示，56.0%的受访青年从中学会了接纳输赢，提升抗压能力；54.6%的受访青年舒缓了日常焦虑，调节情绪，放松自我；46.4%的受访青年在遇到挫折时，能被鼓舞，不轻言放弃。其他还有：受到带动，愿意主动运动，坚持锻炼(45.4%)；理解分工协作，提升团队意识(33.5%)；懂得尊重规则、敬畏公平(34.7%)；激发集体认同感与家国情怀(25.2%)等。\n\n　　受访青年中，男性占52.8%，女性占47.2%。05后占5.2%，00后占32.2%，95后占25.6%，90后占37.0%。\n\n　　(除卫婕外，受访者均为化名)\n\n　　中青报·中青网记者 戴瑶 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:梁异】",

          "body": "消防隐患要消除 酿成火灾或领刑(以案说法)\n\n　　此前的一天夜里，上海市嘉定区一栋三层商务小楼突然火光冲天，冒出浓烟。嘉定区消防救援支队接到报警后，马上赶到现场。\n\n　　原来，该建筑一楼停放着待出售的电动自行车及铅酸电池、轮胎、小配件等，而2、3层则被店主王某出租给了他人居住。消防救援人员马上将被困火场的2、3层住户张某、李某救出，并送医救治。可张某、李某已经受到了火灾现场有毒气体的侵害，其中，张某已经意识丧失、呼吸停止，送医后还是不治身亡。\n\n　　公安机关调查发现，王某租赁该商铺多年，1层用于经营电动自行车店，同时楼上用于住宿。此前，相关部门对该店几次开展消防检查时，均发现店内经营区域存在灭火器过期、电气线路不符合消防技术标准等违法行为，多次对其处罚，要求整改。王某每次被处罚后也进行了整改，可没过多久，店里又会出现新的违反消防法规的行为。案发时，王某甚至还使用铜导线连接自制拖线板为相关设备充电。而正是这次充电引发电气线路故障，最终引发火灾。\r\n\n　　在此之前，民警就发现该店楼上存在违规住人的情况，当即就告知王某，这类经营场所必须在物理隔离等方面符合消防法相关规定才行。后来，王某为了应付检查，就让楼上的住户搬走，但很快又将楼上出租出去供人居住。最终，王某被以消防责任事故罪起诉至嘉定区人民法院。\n\n　　法院审理认为，王某租赁的房屋属于集储存、经营和住宿于一体的“三合一”场所。而且，住宿与其他使用功能之间未设置有效的防火分隔，违反了消防法相关规定，即生产、储存、经营其他物品的场所与居住场所设置在同一建筑物内的，应当符合国家工程建设消防技术标准。\n\n　　现有证据证实，属地派出所民警就“三合一”场所多次向王某申明楼上不能住人，王某都敷衍应付。虽然用木门等进行了隔断，但防火分隔仍然不到位，加之本次自制拖线板为相关设备充电引发火灾，最终发生惨剧。王某在消防监督机构通知警告后，没有认真采取有效改正措施，属于刑法规定的“拒绝执行”，而引发火灾严重后果，行为符合消防责任事故罪构成要件。最终，法院判决王某犯消防责任事故罪，判处有期徒刑一年六个月。\n\n　　法官提醒，消防安全一环扣一环，一定要坚持安全第一、预防为主。相关部门要全面排查重点场所的突出风险隐患。电动自行车消费者也要定期对锂电池进行健康评估，千万不要购买不合格的电动车及配件，更不要用私拉电线、乱接插座等方式充电。(记者 金歆) 【编辑:梁异】",

          "body": "很多人觉得骨质疏松不是大事\n\n　　这是一个很大的误区\n\n　　事实上\n\n　　骨质疏松会让骨骼脆性增加\r\n\n　　一旦跌倒极易发生骨折\n\n　　骨折后可能致残\n\n　　严重时甚至危及生命\n\n　　报告单上的指标到底是什么意思？\n\n　　我们应该如何科学对待骨质疏松？\n\n　　3个方法发现骨质疏松\n\n　　4个关键应对骨质疏松\n\n　　一起来看～\n\n　　01\n\n　　骨质在无声无息中流失\n\n　　人群普遍规律\n\n　　30～35岁：骨量达到峰值\n\n　　36～49岁：维持稳定，缓慢流失\n\n　　50～69岁：迅速减少\n\n　　70岁以上：持续减少\n\n　　过程：骨量减少—骨质疏松症—骨折\n\n　　发生骨质疏松性骨折后，患者的致残率和死亡率会显著增加，第一次骨折之后，再发骨折风险较高。\n\n　　其中，髋部骨折是骨质疏松症严重的并发症。发生髋部骨折后1年内，约20%的患者可能死于各种并发症，约50%的患者致残，生活质量明显下降。\n\n　　而这种风险离我们并不遥远。全国骨质疏松症流行病学调查显示，我国50岁以上人群骨质疏松症患病率为19.2%，其中50岁以上女性为32.1%，65岁以上女性患病率更达到51.6%。\n\n　　02\n\n　　3个方法，测一测骨质疏松风险\n\n　　OSTA亚洲人骨质疏松自我筛查工具(主要适用于绝经后亚洲女性)\n\n　　计算方法：(体重kg-年龄)×0.2=OSTA风险指数\n\n　　结果分析：\n\n　　指数＞-1，发生骨质疏松的风险较低；\n\n　　-4＜指数≤-1，属于中风险，建议到医院咨询，提前干预；\n\n　　指数≤-4，为高风险，建议尽快到医院做骨密度检查。\n\n　　举例说明：体重50公斤，年龄85岁的人，风险指数为(50－85)×0.2=-7，结果≤-4，提示骨质疏松高风险。\n\n　　3大症状，警惕骨质疏松\n\n　　腰背痛；\n\n　　驼背；\n\n　　身高缩短超过3厘米。\n\n　　以上3种情况，常提示可能存在脊柱压缩改变，需要排查骨质疏松。\n\n　　骨密度检测：报告上的3个核心指标\n\n　　双能X线骨密度检测是诊断骨质疏松的金标准，筛查建议如下：\n\n　　常规筛查人群：建议将骨密度纳入40岁以上人群常规体检项目。\n\n　　高危人群：长期服用激素、有脆性骨折史、体重过低、有烟酒嗜好等高危人群，即便没有不适，也建议主动排查骨量。女性早绝经(45岁前)、男性存在性腺功能减退症，同样需要尽早评估骨骼健康。\n\n　　T值：绝经后女性、50岁以上男性的诊断核心\n\n　　它是诊断骨质疏松的核心指标，对应分级标准如下：\n\n　　T值≥-1：骨量处于正常范围；\n\n　　-2.5＜T值＜-1：骨量减少，属于骨质疏松前期；\n\n　　T值≤-2.5：可诊断为骨质疏松症。\n\n　　Z值：绝经前女性、50岁以下男性的参考指标\n\n　　判断骨量是否符合自身年龄的正常水平。\n\n　　判断标准：\n\n　　Z值＞-2：骨量处于同年龄段的平均水平；\n\n　　Z值≤-2：骨密度低于同年龄人群平均水平，需要排查原因并积极干预。\n\n　　只看骨密度不够：结合动态指标判断流失速度\n\n　　骨密度反映的是骨骼的静态状态，只能体现检测当下的骨量水平，无法判断骨量丢失的快慢。\n\n　　如果想要了解近3个月的骨代谢动态、骨量流失速率，还需检测骨转换生化标志物。这项血液指标可以反映骨吸收与骨形成的活跃程度，和骨密度结果结合分析，才能更准确评估是否需要及时启动药物干预。\n\n　　另外需要注意，骨骼代谢周期较长，骨密度复查不宜过于频繁，通常6个月—1年检测1次即可，6个月内复查一般很难观察到明显变化。\n\n　　03\n\n　　日常护骨4字诀：吃、晒、动、戒\n\n　　骨量的积累与维护，离不开日常的健康管理，做好4件事，守护骨骼健康。\n\n　　吃：补足钙与优质蛋白\n\n　　充足的钙与蛋白质摄入，是维护骨骼健康的核心营养基础。\n\n　　普通健康成年人每日蛋白质推荐摄入量为0.8～1.0克/千克体重；\n\n　　骨质疏松人群、老年群体建议提升至每日1.0～1.2克/千克体重，以维持肌肉量、保障骨代谢正常运转；\n\n　　高龄、消瘦或已发生脆性骨折的患者，可进一步增至1.2～1.5克/千克体重，有助于降低肌肉衰减与再发骨折的风险。\n\n　　补钙优先通过膳食实现，建议每日摄入至少300毫升牛奶或相当量的奶制品，搭配豆制品、深绿色叶菜、鱼虾类等富钙食物。\n\n　　日常还要避免过度节食减重，防止营养摄入不足持续损耗骨量。\n\n　　晒：促进维生素D合成\n\n　　维生素D是钙吸收的“搬运工”，每日接受10～20分钟的日晒，可促进皮肤自行合成维生素D，帮助钙质沉积到骨骼中。注意避免正午强光暴晒，防止皮肤晒伤。\n\n　　动：给骨骼适度应力刺激\n\n　　骨骼遵循“用进废退”的原则，负重与力量训练能给骨骼施加良性刺激，促进骨形成。\n\n　　日常可选择快走、慢跑、跳绳、球类运动、深蹲等，既能锻炼肌肉，也能强化骨骼强度。\n\n　　戒：避开伤骨坏习惯\n\n　　戒烟限酒，避免过量饮用碳酸饮料、咖啡，尽量避免或少用影响骨代谢的药物，避免长期过度节食，减少骨量的不必要消耗。\n\n　　专家提醒：\n\n　　如果已确诊骨质疏松，或骨量减少且骨转换指标提示骨流失速度很快，仅靠补充营养远远不够。\n\n　　需由医生结合骨密度水平、骨代谢类型进行评估，选择规范的抗骨质疏松药物方案，有助于改善骨密度、降低骨折风险。\n\n　　应对骨质疏松行动指南\n\n　　测一测骨质疏松风险，试试这3个方法\n\n　　1.(体重kg-年龄)×0.2=OSTA风险指数，指数≤-4，建议尽快到医院做骨密度检查；\n\n　　2.骨密度检测；\n\n　　3.腰背痛、驼背、身高缩短超过3厘米。\n\n　　做好4件事，守护骨骼健康\n\n　　1.吃：每天摄入适量牛奶或酸奶，多吃豆制品、深绿色叶菜、鱼虾类食物，同时避免过度节食减重。\n\n　　2.晒：每日接受10～20分钟的日晒。\n\n　　3.动：日常可选择快走、慢跑、跳绳、球类运动、深蹲等。\n\n　　4.戒：戒烟限酒，减少含糖饮料、浓咖啡的过量摄入，避免长期过度节食。\n\n　　温馨提示\n\n　　本文为健康科普，不替代专业诊疗。骨量异常、腰背持续疼痛、身高明显缩短，请及时到骨科或内分泌科就诊，遵医嘱检查、干预。\n\n　　钙剂与维生素D仅作为基础营养支持，单纯补充一般难以逆转骨密度下降，也无法单独有效降低骨折风险，不能替代药物治疗。 【编辑:梁异】",

          "body": "近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。体育环(长)跑、上课点名、接水饮水、饭卡充值……校园生活的每一处场景，几乎都对应着不同的App或小程序。“校园App臃肿”的话题在网上引发激烈讨论，仅微博平台的相关话题阅读量就接近1亿。校园App为何越装越多？解决之道何在？\r\n\n　　校园里的数据孤岛\n\n　　打开不少大学生的手机，“超星学习通”“今日校园”“创高体育”“U净洗衣”“胖乖生活”等不同门类的App占满了屏幕，每一个都需要单独下载、注册并授权。2025年12月，一项面向全国高校大学生的问卷调查显示，97.72%的受访者日常使用校园App，其中93.89%的受访者在使用过程中受到不同程度的困扰。\n\n　　尽管吐槽不断，但独属校园的这些App又“不得不用”。以上课为例，三四个App都能签到，两三个平台都可随堂测验，任课老师挑自己顺手的用，学生却一个都不敢删。北京某高校大二学生小玖受访时表示，其英语课作业需用3个App才能完成：“批改网”写作文、“U校园”听听力、“fif口语训练平台”练口语。“它们太占内存了，等学期结束后，我打算都删了。”小玖说。\n\n　　有些应用看似体贴地提供了微信、支付宝小程序作为“轻量替代”，功能却大打折扣。华中某高校的学生宿舍洗衣机关联着“海乐生活”平台，学生小林就因小程序常常卡顿、无法使用预约功能，不得不专门下载了App。\n\n　　除了功能单一，商业广告多、运行不稳定、存在数据泄露风险等问题，这类校园App让学生不堪其扰。小玖学校的饮水机用的是一款叫“慧生活798”的App，每次喝水前都得先连着关掉几个弹窗，稍不留意就会“跳转”到购物软件。不少网友抱怨“洗个澡得先看一串广告”“看完广告热水都凉了”。\n\n　　校企各方整合难\n\n　　部分校园App乱象的根源，在于一些高校各部门各自为政，教务、学工、后勤、团委等部门往往只关注自身的管理需求，各部门对接不同供应商：每当合约到期、重新招标，系统便可能整体更换，学生只能重新下载、注册。\n\n　　企业逐利，绑架了学生的刚需。由第三方企业运营的生活服务类App一旦与校园生活强绑定，学生的手机便成为企业“跑马圈地”的沃土。对企业而言，校园是稳定的精准流量池，开屏广告、跳转流量与支付分成，共同构成了这个近乎稳赚不赔的商业闭环。有些App还强制要求开通免密支付、自动扣费，或设置最低充值金额。若学生想要退款，则颇为麻烦，甚至需要拨打12315投诉热线才能成功维权。\n\n　　在智慧校园的建设过程中，App的数量更被部分高校领导当作数字化建设的“成绩单”。校方只在意表面形式，并不关心学生使用是否便捷。西北某高校一位研究生透露，她居住的宿舍楼，若是热水器坏了，需要学生自己打电话给设备维修人员。“学校才不管，凡是不涉及安全的事，一律外包。”北方某高校一名在校内网络中心勤工俭学的学生发现，学校的部分系统版本仍停留在本世纪初，与新搭建的平台集成时问题不断，但“领导觉得好，我们就得用”。\n\n　　更何况，对于一些高校而言，新建一个平台远比多下载一个App来得麻烦——整合各方意味着协调各部门权责、触动企业利益、打破路径依赖。谁来牵头？谁来出钱？数据归谁管？就算高校有心，又能否真正实现？西部某高校相关负责人坦言，一些高校尝试自主研发软件系统，但技术能力有限，常出现各类故障；一些高校则外包给第三方，也常面临业务功能与现有系统不兼容，导致平台瘫痪的问题。\n\n　　年轻人开始自己动手\n\n　　好的数字化，应当围绕“人”转。2019年，教育部等8部门印发意见，划定备案审查、自愿选用的底线。近年来，相关部门也多次开展专项整治，要求清理冗余应用、规范广告推送。2026年8月，个人信息保护系列专项行动取得阶段性成效，不得过度收集个人信息的“最小必要”原则持续收紧。少一些“屏幕上的形式主义”，多一些“一个平台全托管”的踏实，才能让高校师生真正享受到智慧校园的便捷服务。\n\n　　如今，不少熟悉AI工具的学生选择“自力更生”：以Vibecoding的方式自行搭建集成式校园平台。来自华南某高校的小鹤同学，因为请假和订校车这两件“小事”反复受阻，所以萌生了自己动手的念头。他前后用了3天时间，搭建了一个可以代管自己在校事务的Agent，并将开源代码发布到网上。上海学生小C则围绕“Z世代校园数字生态系统设计”课题，仅用1天就搭起了一站式整合方案的雏形。\n\n　　西南大学教育学部教授彭泽平认为，高校应牵头建设功能高度集成、数据统一汇聚的智慧校园基础平台。学生之所以自行开发，根源在于其对轻量化、场景化、个性化服务的需求，与校方所提供的标准化、统一化平台之间存在错位。这些自下而上的实践不仅贴近场景，还能成为校方优化服务的“鲜活信号”。有学生反映，他使用的校园App就是民间自行开发、后被学校网络中心“招安”的，“功能越来越多，确实方便不少”。\n\n　　与其让学生各自“破墙”，不如敞开大门。重庆市教育科学研究院助理研究员邹南芳建议，将学生设计应用纳入课程学习、科研训练、专业实践等培养环节，实现数字化治理与人才培养的有机统一。在数据安全、接口合规、个人信息保护、可持续维护和责任归属等方面，学生自制应用存在一定的不确定性，校方可以开放合规、分级的标准化数据接口，建设开发沙箱与测试机制，按“最小必要”原则界定调用权限，让年轻人的热情与创造力在规则边界内自由奔涌、充分释放。\n\n　　半月谈记者：徐盛悦\n\n　　原标题《开学一个多月，手机多了十几个App》 【编辑:曲克】",

          "body": "新盤自帶基本交樓裝修，雖可省卻不少工程，但格局及用料往往較為劃一，如何沿用原有基礎，同時融入個人喜好與生活習慣，便成為改造關鍵。日出康城Grand Season一個300多方呎一房單位，獨居的女戶主偏愛自然色系與法式元素，亦熱愛煮食及烘焙，遂斥資約26萬元，委託Mstudio微工作室設計總監Marcus Ko操刀。團隊保留原有裝修，以鼠尾草綠與淺木色為主調，配搭歐式花線、水波玻璃及圓拱元素，並增設弧形中島擴充烘焙操作空間，睡房則劃分工作與休息兩區，在有限面積內兼顧實用需要與輕法式格調。\n沿用新樓裝修 拆鞋櫃重整玄關\n單位屬一手新盤，原有木地板等交樓裝修狀況良好，團隊因此未有大幅拆改，而是將工程集中於訂製傢俬、櫃門飾面及配色，透過局部改動，為全屋建立一致風格。\n團隊重新規劃大門旁的儲物空間，新造到頂鞋櫃與矮櫃沿牆排列，令入口一帶的櫃體線條更整齊連貫。\n玄關是少數需要拆改的位置。發展商原設鞋櫃的開門方向及布局，未能配合新增櫃體與枱面的配置，團隊遂將其拆除，重新規劃大門旁的儲物空間。新造到頂鞋櫃與矮櫃沿牆排列，令入口一帶的櫃體線條更整齊連貫。\n櫃身採用低飽和、帶灰調的鼠尾草綠，配搭古銅金色拉手及淺木開放層架，甫進門已見全屋主調。原有淺木地板則貫穿公共空間，以溫潤木色平衡綠色櫃身，亦讓新增傢俬自然融入交樓裝修。\n廚櫃「轉色」融入全屋 弧形中島擴充烘焙空間\n女戶主熱愛煮食及烘焙，惟原有開放式廚房的枱面有限，搓麵糰、備料及製作甜點時難免侷促。如何在不大改格局的前提下增加操作空間，遂成為改造重點之一。\n團隊保留廚房原有位置及主要設備，集中從櫃門飾面着手，以鼠尾草綠框線門板配搭淺色工作枱及古銅金色拉手，讓原本風格較中性的廚櫃融入全屋設計。部分吊櫃改用水波玻璃門，透過帶紋理的半透明材質，隱約透出櫃內物件，既增添光影層次，視覺上亦較全實心門板輕盈；其間穿插淺木背板，呼應原有木地板。\n為補足烘焙所需的操作位置，團隊在廚房與客廳之間增設弧形中島，方便戶主搓麵糰、準備材料及製作甜點。\n為補足烘焙所需的操作位置，團隊在廚房與客廳之間增設弧形中島，方便戶主搓麵糰、準備材料及製作甜點。中島下方設有儲物空間，可收納體積較大的煮食及烘焙器具；靠通道一端則以圓弧收邊，減少尖角對走動的影響，同時柔化櫃體線條。\n鼠尾草綠櫃牆定調 拱形木飾面添層次\n由廚房延伸至客廳，鼠尾草綠繼續貫穿兩側訂製櫃體，成為公共空間的主色。Marcus沒有將綠色大幅鋪滿牆身，而是集中用於儲物櫃、吊櫃及梳化背後的半高護牆，再以奶油白與淺木色調和，既突顯主題，亦避免小空間顯得沉重。\n櫃門加入簡化歐式花線及古銅金色五金，為平整櫃面增添細節；旁邊穿插淺木開放層架，將封閉儲物與展示位置分開，並以自然木質感中和法式裝飾的精緻感。\n靠露台一側設淺木色矮櫃，背後配以大型拱形木飾面，畫作及擺設可直接靠放於櫃面，構成客廳的視覺焦點。拱形輪廓呼應中島的弧角，在方正櫃體之間加入曲線，令整體觀感更柔和。\n客廳傢俬配置保持簡潔，梳化靠牆擺放，展示與儲物功能集中於另一側，中央則保留由入口通往露台的主要動線。淺木地板一路延伸至落地玻璃門，配合低身傢俬及自然採光，讓狹長客廳保持開揚。\n圓拱門洞分隔工作睡眠區 奶油白營造柔和寢區\n一房單位面積有限，睡房除了供休息，亦須兼顧工作及衣物收納。團隊以大型圓拱門洞為界，將靠入口的書枱、衣櫃區與靠窗的睡眠區分開，毋須另加門片或實牆。從工作位置望入房內，視線仍可穿過拱形開口，直達睡床及窗戶，在劃分功能之餘，亦保留採光與通透感。\n工作區沿牆整合書枱及到頂衣櫃，將工作、閱讀與衣物收納集中處理，減少零散傢俬佔用走道。鼠尾草綠框線櫃門配搭淺木枱面及古銅色拉手，延續公共空間的設計，用色則較為克制。\n由工作區進入寢區，須踏上一級淺木地台，透過高低差進一步區分兩個區域；圓拱門洞則猶如一道畫框，將靠窗睡床框入其中。相比公共空間，睡房減少了鼠尾草綠的比例，僅於衣櫃、書枱櫃及半高護牆局部點綴；睡眠位置則以奶油白牆身、米白軟包床頭及淺木色為主，營造柔和寧靜的休息氛圍。\n床頭牆加入簡化花線及壁燈，呼應圓拱曲線，保留輕法式細節，同時避免小房間因裝飾過多而顯得繁複。工作與睡眠兩區各有分工，色調亦由公共空間較鮮明的鼠尾草綠，逐步過渡至私人寢區的明亮柔和。\n圖片由Mstudio微工作室提供\n相關文章：百萬改造黃埔花園鑽石廳 石紋電視牆連窗台弱化斜角 L形玻璃酒櫃展示珍藏\n相關文章：140萬改造夫婦回港度假宅 法式中古風重留白 設計師巧用胡桃木包橫樑 結構限制變視覺主軸\n相關文章：110萬改造1400呎雙連戶 飾面板修飾鑽石廳 主人套房增海景健身區 打通兩房姊妹共享大空間\n相關文章：元朗300呎居屋一家三口住 40萬改造變兩房 傢俬牆雙面收納兼顧採光 一體化傢俬盡用空間\n相關文章：45萬改造元朗454呎新居屋 2房變3房一家三口各有空間 不減客廳採光 旋轉餐枱騰出空間\n相關文章：50萬翻新馬鞍山逾30年居屋 藍調配木色營造暖意 書房變身復古森系畫室\n相關文章：55萬改造大埔452呎奇則單位 訂造櫃巧妙「拉直」牆身化解三角位 榻榻米地台提升收納量\n相關文章：獨居教師40萬翻新344呎舊樓 捨兩房闢「藏書閣」 窗台變工作枱兼藏6人餐桌\n相關文章：180呎新居屋重塑老香港情懷 海棠玻璃配紙皮石增韻味 20萬裝修兼顧實用與舊居回憶\n相關文章：告別近40年舊洋樓局促感 夫婦50萬翻新變黑白灰質感宅 弧形天花巧妙化解橫樑壓迫\n相關文章：青衣近500呎舊公屋68萬大翻新 微水泥營造侘寂氛圍 兩房改三房兼設獨立電競角\n相關文章：120萬重塑931呎北歐風親子宅 一家四口與工人各有空間 雙兒童房伴成長 弧形玻璃廚房成焦點\n相關文章：200萬豪裝啟德千呎法式大宅 黑白花線貫穿全屋 升降機大堂化身專屬玄關 兩客房變夫妻衣帽間\n相關文章：三口之家住安達臣450呎居屋 40萬劃出兩房 圓角櫃牆化身玩偶展區 U型廚房盡用每寸空間\n相關文章：60萬翻新荃灣558呎上車盤 胡桃木重塑復古日系風 半開放式廚房成全屋焦點\n相關文章：一家三口住油塘280呎居屋 35萬裝修間出兩房 弧形玻璃取代實牆 現代神枱櫃融入玄關\n相關文章：443呎Y型公屋變身奶油風 50萬營造私樓格調 弧形燈槽修飾樑柱 一招引光入室\n相關文章：18萬築起《鬼滅之刃》大正復古風 融入和洋美學 胡桃木圍身防撞兼顧美感 一設計引海景入廳\n相關文章：60年舊唐樓大改造 拆劏房還原390呎原木風雅居 巧闢雜物房取代滿牆櫃\n相關文章：首置女生精裝365呎法式輕奢宅 黑框趟門劃出玄關添儀式感 改造步入式衣帽間圓夢",

          "body": "已經有支付寶和微信支付，為甚麼還需要人民幣穩定幣？如果目的只是掃碼付款，確實沒有必要。它的定位，更像人民幣進一步國際化前的一個緩衝區和政策實驗室。\n不改變在岸資本管理框架，先以現有離岸人民幣試行，在境外支付、投資和融資中，觀察哪些需求是真實的，哪些風險需要制度處理，哪些場景只是噱頭，都可以在這個範圍內先行驗證。\n我設想的方案有四個部分：合規發行、雙軌流通、平台協同、開放式RWA市場。\n一、發行資格：交給已有能力的科技金融機構\n人民幣穩定幣涉及儲備、清算、贖回、身份審查和跨境風控，不適合交給只有技術、缺乏金融基建的新團隊。\n較合理的起點，是由已有大規模支付、清算和合規能力的科技金融機構申請發行，包括大型銀行、支付平台及科技金融集團。它們已有客戶和商戶網絡，也有處理反洗錢、系統安全和流動性管理的經驗，不必由零開始。\n但規模再大，發行仍須持牌，以現有離岸人民幣資產作全額儲備，儲備獨立託管，定期披露和審計。直接鑄造和贖回只開放給完成審查的機構及企業，資金必須來自同名銀行戶口，出事後找得到負責機構。\n儲備可以分為銀行存款和短期、高流動性的人民幣債券。前者應付日常贖回，後者則令穩定幣需求轉化成人民幣債券需求。支付規模越大，發行人需要持有的合資格債券越多，穩定幣便不只服務支付，也能支持離岸人民幣資產市場。\n二、流通：註冊即時，未註冊延遲\n具體設計很簡單，只有兩條通道。註冊錢包完成身份認證和合規審查後，彼此轉賬可以即時到帳。未註冊錢包照樣可以收發，但款項會先列作待結算，24小時後才可動用。期間不能再次轉出、贖回或投入DeFi。\n這一天不是懲罰，而是緩衝。一旦涉及被盜、詐騙或制裁名單，發行商和執法機構有時間依法介入。付款人不能隨意反悔，發行商也不能任意取消交易。只有觸發明確的風控條件或法律要求，才可以凍結和調查。\n這個安排不要求所有人先註冊才能使用，而是以較慢的結算保留開放，以身份核實換取即時。至於名單由誰管理、DeFi協議地址如何分類，則需要另訂規則。\n三、銀行和支付平台：做入口\n人民幣穩定幣不會取代銀行、支付寶或微信支付。支付寶以平台帳戶為中心，穩定幣則是可以在不同錢包和應用之間流通的代幣，分別主要在於接入方式。銀行和支付平台繼續負責人民幣出入、身份核實。先連接香港、東盟和中東等已有人民幣業務的地區，「一帶一路」可以是市場方向。當買賣雙方沒有共同銀行，支付平台又未能打通，穩定幣可以先提供一條共同結算通道，讓交易完成。它在這些市場縫隙中累積用戶、交易和風險處理經驗，再逐步接入主流金融體系。\n四、生態開發：建立人民幣計價的RWA市場\n穩定幣如果只有支付功能，用戶收到錢後仍可能立即換走。要讓人民幣留在境外循環，必須有資產可以投資，也有渠道可以融資。\nCNH穩定幣可以成為人民幣RWA市場的現金端，用於認購、付款、收息和贖回；RWA代幣則代表債券、基金或貿易資產。兩者通過智能合約同步交收，減少資產與資金未能同時交付的風險。\n初期應由標準化資產做起，包括離岸人民幣國債、央行票據、企業債和貨幣市場基金，之後才加入貿易應收賬款及供應鏈融資，至於另類資產，可以留待市場成熟後再討論。\n結語\n人民幣穩定幣的價值，是在人民幣進一步開放之前，提供一個可觀察的試驗場。先由有能力的機構發行，用雙軌結算平衡開放與安全，再借助銀行和支付平台進入真實場景，最後接上人民幣資產市場。這個實驗要證明的，不是人民幣能否上鏈，而是上鏈之後，是否真的有人願意用，也願意留下來。\n相關文章：\n穩定幣與人民幣國際化：從跨境貿易痛點到離岸人幣新基建（中）｜鄧進一\n穩定幣與人民幣國際化：從跨境貿易痛點到離岸人幣新基建（上）｜鄧進一\n\n 鄧進一RhinoX首席技術官簡介:\n\n 網站: https://rhinox.hk/",

          "body": "11月18日，《丹噶尔的凝望——一位美国友人镜头下的湟源古城》影像展在青海省西宁市博物馆二楼展厅开展，数百帧由美籍友人柏大卫捐赠的百年湟源老照片首次亮相西宁。\n\n这批影像源自上世纪二三十年代，柏大卫的父亲柏立美长期在青海湟源生活，以相机为笔，记录下丹噶尔古城的人文风貌。古城墙肌理、香水园市井烟火、街头杂碎小摊、热闹的社火高台、各族民众日常百态皆被一一定格，留存下极为稀缺的近代河湟民俗影像史料。\n\n1932年，年仅一岁的柏大卫随父亲来到湟源，在这片高原土地生活十八载，习得一口地道的湟源方言。此后阔别故土多年，乡愁从未消减。自1987年起的二十余年间，柏大卫三十余次往返中美两地，将父亲留下的数百张照片无偿捐给湟源，并累计为当地捐赠CT机、B超机等医疗设备三十余件，价值逾六百万元人民币。\n\n已是95岁高龄的柏大卫如今身居海外，却始终心系湟源。柏大卫曾说：“一个人一生只能有一个故乡，湟源是我唯一的、永远的故乡。”\n\n如今，这些漂泊海外许久的老照片回到西宁展出，让民众得以隔着百年时光，与古城丹噶尔完成一场特殊的“面对面”。(刘洋）",

          "summary_short": "11月18日，《中国日报》独家发表东盟秘书长高金洪署名文章，表示东盟国家与中国的经济正处于结构性转型之中…",

            "传统办公模式正逐渐让位于“随处办公”的经济形态，数字市场也早已突破最初的小众领域…",
            "中国已在5G、人工智能、智慧城市和数据基础设施等领域具备较强实力"
          ],
          "section": "其他",
          "category": "",
          "source": "chinanews",
          "source_display": "中國新聞網",
          "published_at": "2026-11-18T20:20:11+08:00",
          "size": 1,
          "keywords": [],
          "body": "11月18日，《中国日报》独家发表东盟秘书长高金洪署名文章，表示东盟国家与中国的经济正处于结构性转型之中，这一转型正在重塑整个地区的工作组织方式、贸易开展方式以及财富分配格局。传统办公模式正逐渐让位于“随处办公”的经济形态，数字市场也早已突破最初的小众领域，成为区域经济增长的主要引擎。\r\n\n　　文章提到，目前，东盟数字经济规模巨大。与此同时，中国已在5G、人工智能、智慧城市和数据基础设施等领域具备较强实力。这两大发展趋势的交汇带来了战略性机遇，各方需要采取协调一致、果断有力的行动。相关制度基础已经开始构建。《东盟—中国自由贸易区(ACFTA)3.0升级版议定书》和《区域全面经济伙伴关系协定》(RCEP)这两项重要框架，为双方经济体乃至更广泛区域深化数字互联互通提供了法律基础。\n\n　　《东盟数字经济框架协议》(DEFA)将进一步完善相关制度架构，为构建安全、无缝、包容且互操作的数字环境勾勒蓝图。尤为重要的是，该协议将推动监管规则协调，为劳动力从不确定性走向真正的发展机遇创造必要条件，确保数字经济扩张能够转化为实实在在的职业发展机会，而不仅仅体现为经济总量的增长。\n\n　　文章强调，这些并非抽象的政策工具。它们将成为具体的合作机制，使雅加达的软件开发人员或马尼拉的数字营销人员能够获得深圳或上海企业的资质认可。这正是技能优先型经济在实践中的体现：资质证书能够在跨境就业中获得真正认可，劳动力市场依据能力而非地理位置决定人才价值。从更广泛的层面看，东盟与中国深化数字合作，将为双方数百万企业和消费者提供转型经营模式、提高生产效率以及增强全球市场竞争力的途径。\n\n　　文章指出，中小微企业面临的机遇与挑战尤为突出。中国先进的物流和支付基础设施与东盟充满活力的初创企业生态系统实现更高水平的互操作，有望催生新一代由青年创办、从成立之初就面向全球市场的微型跨国企业。直播电商、安全的跨境数据流动以及便捷的数字金融服务，如今都已具备应用条件，关键在于监管环境能否允许这些工具得到充分利用。当务之急是将这些工具从首都城市延伸至长期被排除在全球贸易之外的农村地区，帮助当地创业者参与数字经济。农村地区的互联互通是实现公平增长的前提。\n\n　　然而，仅有基础设施和制度框架还远远不够。数字经济所依托的就业质量同样需要得到高度重视，并被置于优先位置。平台就业在整个地区迅速扩张，但其中相当一部分劳动者缺乏充分保障，收入不稳定，也缺少职业晋升渠道。监管框架必须真正适应数字化发展的现实。东盟目前正在制定区域性指导方针，以提高数字平台劳动者的就业标准。这一工作的出发点是：以人为本的转型不仅是一项道德承诺，也是经济发展的必然要求。得到保障并受到公平对待的劳动者，生产效率更高、创新能力更强，也更具韧性。\n\n　　文章表示，数字技能提升是这一问题的另一面。只有有计划地投入人工智能能力培养、网络安全、数据管理和绿色技术等领域，才能将数字接入机会转化为实际的发展进步。尤为重要的是，通过协调远程办公和网络安全政策，我们能够创造必要条件，使东盟和中国的青年无需离开家乡，也能作为高附加值服务提供者参与全球供应链，在人工智能安全、数据托管和绿色技术等领域发光发热。如此一来，人才回流而非人才流失将成为区域常态。\n\n　　这一愿景必须结合一个不容回避的现实来考量：一些青年面临失业，也难以获得人工智能驱动型劳动力市场所要求的专业技能。这一矛盾尤为突出：技术发展带来前所未有的机遇，但与此同时，随着自动化进程加快，大量青年也面临进一步掉队的风险。要弥合这一差距，需要建立更深入的跨境数字伙伴关系，将人才创新与共同增长作为重点。\n\n　　文章强调，中国—东盟数字学院等倡议，正是当前所需要的联合能力建设模式。依托东盟与中国的全面战略伙伴关系，此类项目可以扩大规模并实现可持续发展，确保下一代青年成为这一转型的主要参与者和建设者，而不是旁观者。\n\n　　必须妥善应对未来挑战。不同司法管辖区在数字化发展水平、法律传统和治理重点方面各不相同，要实现跨境监管协调绝非易事。但不采取行动所付出的代价将更为高昂。在《东盟2045：我们的共同未来》框架下，数字化转型不仅被视为经济发展的加速器，也被定位为增强区域凝聚力与团结的基石。\n\n　　文章结尾表示，如果能够通过妥善协商和建设推进数字经济发展，它就将成为一座桥梁，连接不同经济体、不同世代，以及因地理距离和发展条件不平等而彼此隔离的社区。建设好这座桥梁，需要有序推进政策协调，持续加大制度投入，并坚定不移地确保任何社区都不掉队，不被排除在数字化发展进程之外。 【编辑:刘阳禾】",
