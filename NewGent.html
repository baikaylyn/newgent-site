倾覆…","points":["中新网11月20日电 据路透社报道，当地官员19日表示…","当地一家非政府组织负责人表示，事故发生在塞内加尔首都达喀尔以南的耶讷镇附近海域","联合国难民机构本周指出，今年以来，已有近600名移民从西非乘船前往大西洋上的西班牙加那利群岛…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T07:18:42+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆，已造成数十人下落不明。\n\n　　据报道，当地一家非政府组织负责人表示，事故发生在塞内加尔首都达喀尔以南的耶讷镇附近海域。船上至少有约50人。\n\n　　报道称，目前正在搜寻幸存者。\n\n　　联合国难民机构本周指出，今年以来，已有近600名移民从西非乘船前往大西洋上的西班牙加那利群岛途中遇难或失踪，本月前12天就有超8000人取道该航线抵达加那利群岛。\r\n\n 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c01f30a184c","title":"國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立 美國稱防止政治化","url":"https://news.tvb.com/tc/1207365-國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立美國稱防止政治化","summary":"國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來，首次裁定有主權國干犯相關罪行，緬甸軍政府一直否認指控。歐盟指要為受害者伸張正義，美國就稱防止國際法院遭政治化。","summary_short":"國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來，首次裁定有主權國干犯相關罪行…","digest":"國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來…","points":["國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來…","歐盟指要為受害者伸張正義，美國就稱防止國際法院遭政治化","聯合國最高司法機構，荷蘭海牙的國際法院，周四就緬甸軍方在2017年屠殺羅興亞人案作出裁決"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:15+08:00","size":1,"keywords":[],"body":"國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來，首次裁定有主權國干犯相關罪行，緬甸軍政府一直否認指控。歐盟指要為受害者伸張正義，美國就稱防止國際法院遭政治化。\n\n聯合國最高司法機構，荷蘭海牙的國際法院，周四就緬甸軍方在2017年屠殺羅興亞人案作出裁決。由15人組成的法官小組，以9比6裁定，緬甸清剿羅興亞人構成種族滅絕，違反《防止及懲治滅絕種族罪公約》，且不接受被告上訴。\n\n國際法院院長岩澤雄司表示：「法庭認為證據確鑿，緬甸安全部隊確曾無差別殺戮，隔離及處決男性，施以性暴力及蓄意焚毀羅興亞人家園。法院完全確信緬甸曾採取措施，意圖禁止羅興亞族群傳宗接代，有關種族滅絕(試圖阻止生育)干犯公約第2條D款成立。」\n\n今次是國際法院成立81年來，首次裁定單一國家要為種族滅絕承擔法律責任。法院長達191頁的裁決書，指緬甸當局有義務賠償羅興亞人，並保證他們安全及有尊嚴地重返緬甸家園。\n\n在孟加拉難民營有受訪羅興亞人，讚揚法院裁決等同徹底粉碎由整個國家支持的謊言。\n\n以佛教徒為主的緬甸，軍方2017年在北部若開邦，鐵腕鎮壓羅興亞穆斯林，包括殺害男性及嬰兒，強姦婦女及燒毀村莊，法院指約1萬人被屠殺，逾70萬人被迫逃亡到孟加拉等國家。\n\n時任國務資政的昂山素姬，考慮到文人政府權力受限制，加上面對國內民族主義壓力，當時她沒有阻止軍方而備受國際批評，甚至有人要求褫奪其諾貝爾和平獎。\n\n大部分人口為穆斯林的西非國家岡比亞，在伊斯蘭合作組織支持下，2019年為羅興亞人出頭，向國際法院起訴緬甸實施種族滅絕，緬甸軍方則辯稱是合法反恐行動。\n\n歐盟發言人稱，羅興亞人承受巨大苦難，國際法院今次裁決，凸顯必須為受害者伸張正義。美國國務院就稱，正確詮釋種族滅絕公約很重要，並要防止國際法院遭政治化。\n\n美方憂慮國際法院一旦降低「種族滅絕」裁決門檻，將來可能就加沙局勢，針對美國盟友以色列。","image":"https://pro-vod-cdn.tvb.com/f64e97ea841847baa91e8489d784bce5/snapshots/25b9d9e88c74485a880ebedf01730914-00008.jpg","video":"https://pro-vod-cdn.tvb.com/f64e97ea841847baa91e8489d784bce5/2d752792599847fba718eaf0c931749c-e1cb65c00309c54ded9d07c747233865-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/f64e97ea841847baa91e8489d784bce5/snapshots/25b9d9e88c74485a880ebedf01730914-00008.jpg","lang":"zh-Hant"},{"id":"c07c89c17d5","title":"普京：克里米亚大桥遭袭后 不再讨论海上停火","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734987.shtml","summary":"新华社莫斯科11月19日电 俄罗斯总统普京19日表示，在克里米亚大桥遭袭后，俄方不会就海上停火或停止攻击能源设施与有关方面进行谈判。","summary_short":"新华社莫斯科11月19日电 俄罗斯总统普京19日表示，在克里米亚大桥遭袭后…","digest":"俄罗斯总统普京19日表示，在克里米亚大桥遭袭后…","points":["新华社莫斯科11月19日电 俄罗斯总统普京19日表示，在克里米亚大桥遭袭后…","据俄罗斯总统网站19日发布的消息，在回应记者关于克里米亚大桥近日多次遭袭及受损情况的提问时…","据俄媒报道，克里米亚大桥16日至18日连续三天遭到乌军袭击，致使大桥交通受到影响"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T06:05:38+08:00","size":1,"keywords":[],"body":"新华社莫斯科11月19日电 俄罗斯总统普京19日表示，在克里米亚大桥遭袭后，俄方不会就海上停火或停止攻击能源设施与有关方面进行谈判。\n\n　　据俄罗斯总统网站19日发布的消息，在回应记者关于克里米亚大桥近日多次遭袭及受损情况的提问时，普京表示，克里米亚大桥是民用设施，俄方从未通过该桥运输军事装备和弹药，也没有通过该桥运输石油及石油制品。\n\n　　普京说，俄方此前曾评估与有关方面就海上停火及停止攻击能源设施举行谈判的可能性，但克里米亚大桥再次遭袭后，俄方不会就此进行谈判。他表示，俄方将作出回应，且力度将比乌方对克里米亚大桥的攻击更大。\n\n　　据俄媒报道，克里米亚大桥16日至18日连续三天遭到乌军袭击，致使大桥交通受到影响。乌克兰总统泽连斯基17日在社交媒体发文证实，乌军使用多款无人机和“海王星”导弹对克里米亚大桥的公路和铁路设施实施了打击。\r\n\n　　克里米亚大桥连接克里米亚半岛和俄罗斯克拉斯诺达尔地区，全长19公里，由公路桥和铁路桥组成。公路桥于2018年5月开通，铁路桥于2019年12月开通，普京均出席了开通仪式。 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cba1634a815","title":"日本淺草寺｜女遊客懸掛拉扯雷門大燈籠拍照捱轟 若損毀恐招巨額賠償","url":"https://www.stheadline.com/realtime-world/3639140/日本淺草寺女遊客懸掛拉扯雷門大燈籠拍照捱轟若損毀恐招巨額賠償","summary":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。","summary_short":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。","digest":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件","points":["日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件","網上流傳片段顯示，一名外國女遊客在寫有「雷門」字樣的大燈籠下打卡時，竟將燈籠當成單槓般…","網傳片段可見，一名外國女遊客在淺草寺入口的雷門大燈籠下拍照，期間將雙手攀着燈籠底部邊緣…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T04:50:48+08:00","size":1,"keywords":[],"body":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。網上流傳片段顯示，一名外國女遊客在寫有「雷門」字樣的大燈籠下打卡時，竟將燈籠當成單槓般，雙手攀住燈籠底部邊緣作支撐並單腳站立拍照，燈籠似被用力拉扯著，女子放手後更出現晃動，引起日本網民強烈不滿及怒轟。\n攀燈籠底部單腳打卡 放手後燈籠晃動\n網傳片段可見，一名外國女遊客在淺草寺入口的雷門大燈籠下拍照，期間將雙手攀着燈籠底部邊緣，並以此作支撐單腳站立。旁邊有人以英語大聲向女遊客叫道：「不要踫它！」女遊客聽後才放手，當她放手後，大燈籠明顯出現晃動。\n雷門大燈籠重700公斤 松下幸之助還願重建\n雷門大燈籠並非一般供人把玩的裝飾品，而是具有相當價值的傳統工藝品，高約3.9米、寬約3.3米，重達700公斤。據悉，這座大門與大燈籠曾於1865年因火災燒毀，消失近100年後，松下電器創辦人松下幸之助向淺草寺祈求膝關節痛痊癒並應驗，於1960年還願捐款重建。\n據了解，雷門大燈籠每隔約10年更換一次，即使體積較小的小舟町大燈籠，重量也超過400公斤，製作成本更高達五、六百萬日圓（約24萬至29萬港元）。由於大型燈籠主要採用傳統和紙及竹材製作，並非堅固耐磨的金屬結構，若遭人反覆觸摸、拉扯或施加外力，極易造成表面污損甚至結構受損。\n網民擔心，即使未有當場破裂，後續修復也可能涉及高昂費用，若真造成嚴重損毀，更可能衍生巨額賠償責任。\n批欠缺對宗教場所尊重 日網民斥當作遊樂場設施\n除了財物損失，部分日本網民也認為，遊客在寺廟內做出倒立、懸掛等誇張動作，反映對當地宗教場所缺乏基本尊重。在日本文化中，寺廟及神社是承載信仰且充滿敬畏之心的場所，不應被當成供人嬉戲或製造社交平台話題的背景。\n片段在網上流傳後，日本網民紛紛留言表達憤怒，有人直言「我不希望那些玩弄日本人珍視之物的外國人來日本旅遊」，亦有人呼籲「不了解日本文化的外國人，請勿入內！」。\n此外，不少網民批評行為離譜，留言稱「外國人啊？社會公害……他們為甚麼要吊在上面……那不是遊樂場設施？蠢到我都無言了」，甚至有激進留言辱罵：「滾出日本，笨蛋！」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c73ff45784b","title":"日本民众集会反对高市政府扩军修宪动向","url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075528.shtml","summary":"","summary_short":"","digest":"日本民众集会反对高市政府扩军修宪动向","points":[],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T10:00:31+08:00","size":2,"keywords":[],"body":"","image":"","video":"https://video.chinanews.com/tvmining/News/MP4ZXW/test/2026/11/20/iQt6m62_1795135950362_SjgDBhd_6383.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"日本民众集会反对高市政府扩军修宪动向","url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075528.shtml","source_display":"中新視頻","published_at":"2026-11-20T10:00:31+08:00","category":"國際","digest":"日本民众集会反对高市政府扩军修宪动向"},{"title":"上万日本民众举行抗议集会 反对高市政府扩军修宪","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735056.shtml","source_display":"中新網 環球","published_at":"2026-11-20T09:39:38+08:00","category":"國際","digest":"据日本《东京新闻》报道，当地时间19日，上万名日本民众在东京日本国会议事堂举行集会…"}],"cross":{"total":2,"angles":[{"point":"日本民众集会反对高市政府扩军修宪动向","sources":["中新視頻"],"url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075528.shtml"},{"point":"据日本《东京新闻》报道，当地时间19日，上万名日本民众在东京日本国会议事堂举行集会…","sources":["中新網 環球"],"url":"https://www.chinanews.com.cn/gj/2026/11-20/10735056.shtml"}]}},{"id":"cf3f749314b","title":"南韓高考｜今屆發現98人違規 5人用智能設備作弊","url":"https://www.stheadline.com/realtime-world/3639045/南韓高考今屆發現98人違規-5人用智能設備作弊","summary":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考），南韓政府出「奇招」嚴防作弊，全日共發現98 人違規，包括5人利用智慧型設備作弊。","summary_short":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考）…","digest":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試…","points":["南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試…","韓媒報道，今屆共有55萬人報考，教育部官員晚上開記者會通報…","相關新聞：南韓高考︱懸賞59萬元捉AI作弊 發災難短訊排查手機 鈕扣須貼紙防偷拍"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:04:20+08:00","size":1,"keywords":[],"body":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考），南韓政府出「奇招」嚴防作弊，全日共發現98 人違規，包括5人利用智慧型設備作弊。韓媒報道，今屆共有55萬人報考，教育部官員晚上開記者會通報，初步統計共發現98宗違反考試規則的行為。\n相關新聞：南韓高考︱懸賞59萬元捉AI作弊 發災難短訊排查手機 鈕扣須貼紙防偷拍\n其中，有44名考生被發現攜帶手機或其他電子設備，部分是當局發送強制手機發出聲響的災難警報，揪出沒有交出手機的學生，2人是透過首爾考場的Wi-Fi信號監測抓獲。\n有人用AI眼鏡、微型攝影機\n令人關注的是5名考生使用智慧型設備作弊。忠清南道考區一名考生配戴並使用AI智能眼鏡，這類眼鏡可掃描試卷並利用AI生成答案。京畿道考區一名考生被發現身上藏有微型攝影機及無線藍牙耳機。首爾考區一名考生直接在考場使用智能手機拍攝考試試卷。另首爾和京畿道考區各1宗考生在考試途中前往洗手間偷用智能手機。\n\n相關新聞：南韓稅務師狀元自首 認用微型相機＋AI作弊\n\n南韓近年頻頻發生高科技設備與AI作弊事件，包括10月延世大學等入學試有人用智能眼鏡作弊，就連稅務師國考榜首也承認用微型相機、手機與雲端AI解題作弊。\n逐粒鈕貼貼紙防偷拍\n當局針對修能試祭出「史上最嚴格」的防弊新規，除突擊防災警報，為防考生衣服內藏微型攝影機，監考官要求考生捲起衣袖、衣領作檢查，衣服上每一顆鈕扣都要用貼紙遮蓋；一批監考員特別接受智能眼鏡識別訓練。考場及周邊地區也從考前一天起臨時屏蔽Wi-Fi訊號。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0832dbe660","title":"（深圳APEC）外媒聚焦APEC：开放合作为亚太发展凝聚共识","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734981.shtml","summary":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。","summary_short":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。","digest":"综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳…","points":["中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日…","多家外媒聚焦深圳科技创新与城市发展，关注会议释放的开放合作信号，认为维护贸易开放…","本次会议举办地深圳成为海外媒体关注话题之一"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T23:45:35+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。多家外媒聚焦深圳科技创新与城市发展，关注会议释放的开放合作信号，认为维护贸易开放、深化区域合作、推动创新发展，仍是亚太经济体的共同关切。\r\n\n　　本次会议举办地深圳成为海外媒体关注话题之一。美国有线电视新闻网以“奇迹之城”介绍深圳，通过无人驾驶出租车、无人机送餐、智能城市设施等生活场景，展现深圳科技创新与城市发展的活力。\n\n　　美联社文章援引业内人士观点称，深圳展现了中国速度以及中国在效率和创新方面的活力。英国《卫报》指出，深圳是中国借APEC向世界展示发展成就的重要窗口。\n\n　　欧洲《现代外交》杂志网站对本次会议三大优先领域作出解读，认为“开放”是对日益高涨的贸易保护主义、日益加剧的经济碎片化的直接回应；“创新”是数字化转型和人工智能时代的新经济增长引擎；“合作”则是亚太经合组织基于共识自愿承诺的原则。\n\n　　新加坡《联合早报》的报道称，在全球经济日益分化、贸易紧张局势持续以及科技变革带来新安全挑战的背景下，各经济体领导人探讨如何深化区域经济一体化、加强互联互通，以及推动创新和数字化转型，促进亚太地区可持续和包容增长。\n\n　　新加坡亚洲新闻台援引亚太经合组织秘书处执行主任爱德华多·佩德罗萨的话说，本次会议关注供应链的韧性、应对全球经济失衡和人工智能合作。“对话过程本身是亚太经合组织工作的重要组成部分，它可以让各经济体更好地了解彼此，并找到各自体系协调运作的方式。”\n\n　　厄瓜多尔Pressenza国际通讯社指出，参会的智利、秘鲁、墨西哥三国经济结构各异，但都与国际市场和太平洋供应链有着重要的联系。对他们而言，挑战不仅在于能否销售更多产品，发展工业能力、培养专业人才、开展应用研究以及加强国内供应商队伍建设也同样重要。\n\n　　智利《塔尔卡日报》援引智利安第斯大学专家佩德罗·亚科贝利的话说，“亚太地区是非常重要的经济共同体，它改变了我们对海洋的认识。海洋不再是阻碍，而是一种沟通手段。”他认为，亚太经合组织的优势是灵活性和适应性，并为各经济体、商界领袖和学者提供一个讨论贸易和投资的平台。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b887c9ee8","title":"韩国前第一夫人金建希首案终审被判有期徒刑4年","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734932.shtml","summary":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价、收受贿赂等案件作出终审判决，判处其有期徒刑4年…","summary_short":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价…","digest":"韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价…","points":["中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建…","这是韩国最高法院首次就金建希相关案件作出裁定","韩联社报道称，这是韩国宪政史上首次有前总统夫人因刑事犯罪被终审判处实刑"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T21:54:49+08:00","size":1,"keywords":[],"body":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价、收受贿赂等案件作出终审判决，判处其有期徒刑4年，并处罚金5000万韩元(约合人民币25万元)。这是韩国最高法院首次就金建希相关案件作出裁定。\r\n\n　　韩联社报道称，这是韩国宪政史上首次有前总统夫人因刑事犯罪被终审判处实刑。\n\n　　韩国最高法院当天驳回“金建希特检组”和金建希双方的抗诉和上诉，维持二审原判。就金建希从统一教方面接受请托和收受高价物品这一指控，法院认定违反《特定犯罪加重处罚法》。同时，其涉嫌操纵股价违反《资本市场法》的部分指控成立。就金建希与尹锡悦共谋，从“政治掮客”明泰均处免费获取舆论调查服务违反《政治资金法》的指控，法院维持二审无罪判决。\n\n　　2026年1月，首尔中央地方法院对此案作出一审判决，判处金建希有期徒刑1年8个月。三项指控中只有“从统一教方面接受请托和收受高价物品”被认定部分有罪，其余两项指控均被认定不成立。特检组和金建希随后分别提出抗诉及上诉。在4月二审中，首尔高等法院认定金建希违反《资本市场法》《特定犯罪加重处罚法》，以斡旋受贿罪等罪名判处其有期徒刑4年，处罚金5000万韩元，并没收其收受的高价项链及追缴2000余万韩元。\n\n　　韩联社报道称，金建希因卷入多起案件，相关审判还在进行，未来不排除被追加判处刑罚的可能。(完) 【编辑:周驰】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"民生","total":40,"items":[{"id":"ce68a025cc3","title":"沙漠合围之地“飞”出生态画卷：甘肃民勤候鸟翔集","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735130.shtml","summary":"中新网兰州11月20日电 (马爱彬)初冬时节，薄雪漫过岸滩，甘肃武威市民勤石羊河国家湿地公园，大天鹅、赤麻鸭、白琵鹭、灰鹤成群栖落湖面，低头觅食、安然休憩。","summary_short":"中新网兰州11月20日电 (马爱彬)初冬时节，薄雪漫过岸滩，甘肃武威市民勤石羊河国家湿地公园，大天鹅、赤麻鸭、白琵鹭…","digest":"初冬时节，薄雪漫过岸滩，甘肃武威市民勤石羊河国家湿地公园，大天鹅、赤麻鸭、白琵鹭…","points":["中新网兰州11月20日电 (马爱彬)初冬时节，薄雪漫过岸滩…","“湿地公园累计记录鸟类118种，每年迁徙、越冬水鸟80余种4万余只","”石羊河国家湿地公园管理局干部张秀志介绍说"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:39:46+08:00","size":1,"keywords":[],"body":"中新网兰州11月20日电 (马爱彬)初冬时节，薄雪漫过岸滩，甘肃武威市民勤石羊河国家湿地公园，大天鹅、赤麻鸭、白琵鹭、灰鹤成群栖落湖面，低头觅食、安然休憩。“湿地公园累计记录鸟类118种，每年迁徙、越冬水鸟80余种4万余只。”石羊河国家湿地公园管理局干部张秀志介绍说。\n\n　　民勤石羊河国家湿地公园地处中亚、东亚——澳大利亚候鸟迁徙通道，是候鸟关键停歇补给地，眼下正迎来候鸟过境高峰。当地坚持系统施策、精准管护，搭建“日常巡护+专项监测”工作体系，管护人员全天候巡查，定点记录鸟类种群分布，开展珍稀鸟类物候观测与环志工作，同步监测植被、水质，建立生态台账，及时处置鸟类伤病等突发状况。\n\n初冬，甘肃民勤石羊河国家湿地公园芦苇泛金，成群大天鹅浮水停歇、低头觅食。白发明 摄\n\n　　候鸟翔集的景致并非石羊河湿地独有。在民勤青土湖，随着生态补水持续实施、水域面积稳定恢复，大批水鸟在此停歇觅食、振翅翩飞，成为民勤绿洲初冬生态画卷的又一鲜活注脚。\n\n　　青土湖是石羊河尾闾湖，也是阻隔巴丹吉林、腾格里两大沙漠交会合拢的重要生态节点。20世纪50年代末，湖泊干涸，湖床裸露，风沙侵袭加剧。经过多年综合治理与常态化生态补水，湖区水域面积稳定在27.65平方公里，形成127.6平方公里旱区湿地，区域生态系统逐步修复，为野生动植物营造稳定栖息空间，沙区生态屏障效能持续巩固。\n\n　　甘肃民勤连古城国家级自然保护区管护中心黄岭保护站工作人员石多才介绍说，青土湖芦苇、沙生草本、梭梭等植被连片发育，群落盖度稳步提高，湖区栖息生态持续改善，成为候鸟迁徙路线上重要的补给驿站。监测数据表明，到访候鸟种类、种群数量逐年增长，部分珍稀水鸟从短暂过境的迁徙个体，转变为可在湖区栖息繁育。\n\n甘肃民勤石羊河湿地薄冰初结，绿头鸭在冰水之间停歇游弋。马爱彬 摄\n\n　　民勤地处河西走廊东北部、石羊河流域下游，东、西、北三面被巴丹吉林、腾格里两大沙漠合围，位列国家北方防沙带关键节点。县域荒漠广布，绿洲外围风沙线绵长。在这样严酷的自然条件下，能够持续维系湿地生态、吸引候鸟翔集，背后是一套持续发力的生态治理体系。\n\n　　近年来，民勤县坚持“节水优先、空间均衡、系统治理、两手发力”治水思路，落实“四水四定”原则，统筹生态治理、耕地保护与经济发展，系统推进水资源管护、水利调配、农业配水等制度体系建设，全域推行深度节水、极限节水。通过压减高耗水作物、推广高效节水灌溉、优化用水结构，持续提升水资源集约利用水平，为湿地生态补水和候鸟栖息环境稳定提供支撑。\n\n　　同时，民勤推动义务压沙常态化开展，依托“请到民勤种棵树”公益品牌，借助“互联网+全民义务植树”平台，引导社会力量参与沙区植被修复。干部示范、群众参与、志愿者接续治沙，防沙治沙逐步由政府主导向全社会协同共建转变，与水资源管控举措同向发力，共同守护绿洲湿地，维系候鸟栖息的生态空间。\n\n民勤青土湖水鸟翔集。马爱彬 摄\n\n　　民勤县河湖管理中心副主任吴建福表示，当地依托石羊河流域统一水资源调度机制，在优先保障城乡生活、生产用水的基础上，依靠节水置换、动态配水，持续向青土湖等重点湿地实施生态补水，维系适宜的水域规模与生态水位。同步强化河湖岸线管护、入河排污口管控和水质常态化监测，保障生态水长效存续，为湿地发育、候鸟栖息筑牢稳定水环境根基。\n\n　　监测显示，民勤区域地下水位连续七个季度同比回升，空气质量连续五年稳定达标；石羊河入选全国首批美丽河湖案例，红崖山水库国控断面水质连续五年保持Ⅱ类。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf4c7159c42","title":"黑龙江铁力：小鹿踏雪林间行 农文旅融合激活乡村新动能","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735087.shtml","summary":"中新网伊春11月20日电(记者 刘璐)近日，在黑龙江省伊春铁力市的鹿野仙踪园区，成群梅花鹿漫步皑皑白雪，灵动身影与茫茫林海相映成趣，成为冬日里一道治愈的风景线。","summary_short":"中新网伊春11月20日电(记者 刘璐)近日，在黑龙江省伊春铁力市的鹿野仙踪园区，成群梅花鹿漫步皑皑白雪…","digest":"近日，在黑龙江省伊春铁力市的鹿野仙踪园区，成群梅花鹿漫步皑皑白雪…","points":["中新网伊春11月20日电(记者 刘璐)近日，在黑龙江省伊春铁力市的鹿野仙踪园区…","这片以梅花鹿养殖为根基打造的特色园区，把特色养殖、生态观光、研学体验融为一体","如今，鹿野仙踪园区打造梅花鹿互动投喂、森林观光小火车、田园花海、户外露营、研学实践…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T10:37:31+08:00","size":1,"keywords":[],"body":"中新网伊春11月20日电(记者 刘璐)近日，在黑龙江省伊春铁力市的鹿野仙踪园区，成群梅花鹿漫步皑皑白雪，灵动身影与茫茫林海相映成趣，成为冬日里一道治愈的风景线。\n\n小鹿踏雪林间行。　铁力市委宣传部供图\n\n　　这片以梅花鹿养殖为根基打造的特色园区，把特色养殖、生态观光、研学体验融为一体。当地立足林下资源，推动传统养殖产业向文旅体验延伸，走出一条“养殖打底、文旅赋能、全链增收”的乡村振兴新路径。\n\n　　如今，鹿野仙踪园区打造梅花鹿互动投喂、森林观光小火车、田园花海、户外露营、研学实践、冰雪嘉年华等多元体验项目，配套民宿、文创馆、鹿产品展示体验馆，实现四季皆有看点、全年可接待。随着哈伊高铁开通，交通条件大幅改善，省内外游客纷至沓来。\n\n游客在雪中与梅花鹿互动。　铁力市委宣传部供图\n\n　　冬日赏林海雪原、亲近雪地小鹿，春夏徜徉花海、沉浸式感受林下生态魅力，络绎不绝的游客，也带动本地林下特色农产品热销。据悉，铁力市宏大鹿场养殖梅花鹿近千头，由鹿场孵化打造的鹿野仙踪园区，吸纳当地村民就近就业，带动周边农家乐、民宿和林下特产发展，形成“一鹿兴、百业旺”的联动效应。\n\n　　下一步，铁力市将持续深挖林下特色资源，培育更多新型农场样板，不断丰富农文旅业态、延伸产业链条，持续把生态优势转化为富民增收的产业优势，为乡村全面振兴注入持久动能。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb0475a0cd2","title":"双十一保价靠谱吗？补贴能否成为拒退理由","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735098.shtml","summary":"“双十一”大促刚刚落幕，和“大促”相关的消费纠纷这些天却还在持续。","summary_short":"“双十一”大促刚刚落幕，和“大促”相关的消费纠纷这些天却还在持续。","digest":"“双十一”大促刚刚落幕，和“大促”相关的消费纠纷这些天却还在持续","points":["“双十一”大促刚刚落幕，和“大促”相关的消费纠纷这些天却还在持续","近日，不少消费者反映称，明明下单页面标注了“保价”，同款商品价格变低后，申请退差价却被拒绝","相关投诉平台数据显示，保价纠纷是今年的消费维权热点"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T10:25:42+08:00","size":1,"keywords":[],"body":"“双十一”大促刚刚落幕，和“大促”相关的消费纠纷这些天却还在持续。近日，不少消费者反映称，明明下单页面标注了“保价”，同款商品价格变低后，申请退差价却被拒绝。\n\n　　相关投诉平台数据显示，保价纠纷是今年的消费维权热点。相关投诉主要集中在保价期内拒退差价、保价规则未明确告知、保价申请入口失效等问题。\n\n　　保价纠纷背后，是商家明知承诺故意打折扣，还是双方对规则理解存在偏差？\n\n　　山东滨州的赵先生投诉称，本月17日他在网购平台某家电品牌自营店，以1172元购买了一款热水器，没承想19日该款商品就降了166元。\r\n\n　　赵先生就此问题和客服进行交涉，被告知该款商品参与了国补，因此无法享受保价服务。\n\n　　重庆的余女士也遇到了和平台商家的保价纠纷，涉及的商品是一款手机。她在网购平台通过以旧换新的渠道，补差价4800元购买的手机，两天后，该款商品降价600元。\n\n　　余女士：当时App上面要我补差价4800元，补完之后第三天我去看就只要补4200元了。有7天的价保，我这个在7天范围里。客服说因为是有国补，就不在价保范围之内。\n\n　　记者在黑猫投诉上搜索关键词“保价”，相关投诉量高达1.9万余条，其中大多数保价投诉涉及的差价为几十元至几百元不等。\n\n　　多位遭遇保价纠纷的消费者认为，商家宣称的所谓“保价”，多是形同虚设，实为促销噱头。一位家电品牌负责电商业务的运营总监则告诉记者，平台店铺推出保价服务，初衷是降低消费者提前下单的顾虑，本身也是一种营销承诺，并非法定强制要求。但大促期间优惠体系十分复杂：店铺券、直播间专属券、平台补贴、会员红包、以旧换新补贴叠加在一起，很容易出现“页面标价没变，特定渠道到手价更低”的情况。\n\n　　运营总监：可能因为有些消费者不清楚他用的是哪种优惠券。比如：平台给的优惠券再叠加上商家优惠券，有些情况会比保价的价格还要低一点。一般就是协商，看是商品链接的问题还是优惠券的问题。\n\n　　这位运营总监还表示，有些情况平台商家也无法控制。消费者和商家在保价承诺方面有时确实存在一定的信息差。消费者的知情权和选择权有时无法充分保障。\n\n　　运营总监：因为有些是平台发的券，它可以去叠加，这个商家也控制不了的。比如现在双十一的活动是价格加上赠品，它是一个价格，双十一过后，价格调整之后，它换一种赠品或者去掉赠品，可能价格又会浮动。\n\n　　中国互联网协会法工委副秘书长、中国消费者协会律师团成员胡钢认为，保价纠纷的核心在于：“保价”是合同承诺，不是营销噱头。\n\n　　中国互联网协会法工委副秘书长、中国消费者协会律师团成员 胡钢：依据相关法律规定，经营者以“国补、平台券、秒杀除外”或“系统不通过”拒赔，若该除外情形未在承诺时以显著方式清晰提示，则涉嫌构成不公平不合理的格式条款，即霸王条款，是无效的，也不能约束消费者；以含糊条件架空承诺，还可能构成价格欺诈。\n\n　　上海财经大学数字经济研究院副院长崔丽丽也对中国之声表示，保价纠纷本质上是一种“承诺型消费纠纷”。保价的前提是商家或平台主动作出“买贵退差”的承诺，纠纷发生在承诺的履约环节。\n\n　　上海财经大学数字经济研究院副院长 崔丽丽：这类矛盾不是消费者预期过高，而是经营者自己设定的规则被自己采用各种手段规避了，性质上更接近失信而不是一种服务本身的瑕疵。家电品类成为保价纠纷高发区也有其特殊性。单价相对高、促销期价格波动大，而且叠加国补因素，补贴、平台券、店铺券层层嵌套，价格体系异常复杂，为保价这类承诺的兑现留出了大量空间。\n\n　　崔丽丽认为，商家及平台经营者用“规则设计”架空保价承诺，是这类问题的最直接原因。典型手法包括：把国补、平台券、百亿补贴、秒杀等设为“价保除外”；以“超过价保期”“系统审核不通过”为由拒赔。此外，价保规则的法律属性模糊是纠纷不断的根源。\n\n　　崔丽丽：保价承诺目前主要属于商家和平台的自律性规则：由经营者单方制定、单方解释、单方修改，本质上是格式条款。规则不透明、可随意增设除外条款，承诺就成了一纸空文。再有就是国补政策与平台规则衔接不畅，被商家滥用为挡箭牌。政策善意在零售末端被执行成了消费者权益的“减项”。\n\n　　而对消费者来说，遇到保价纠纷维权成本较高。单笔差价往往几十到几百元，但消费者需要举证“同一商品、同一时间、更低价格”，需要留存截图、比价录屏，还要在客服与平台之间反复拉锯；AI客服机械应答、转人工难，进一步抬高了维权门槛。很多人最终放弃，这反过来降低了商家的违约成本。此外直播等新渠道进一步放大了追溯难题。\n\n　　崔丽丽：监管部门要明确价保承诺的法律性质。需要建立“同一商品”认定标准，禁止商家或平台通过换链接、改型号、换名称等方式规避价保义务；最好能出台国补订单的价保与退换货衔接规则，明确补贴核验不得成为拒绝法定退货权和价保承诺的理由；也可将价保履约情况纳入企业信用记录和大促合规检查。平台要让价保从“申请制”走向“自动制”。规则须显著、完整公示，价保期内不得单方修改；推行系统自动比价、自动退差，把举证责任从消费者转回平台；采用技术手段价保期内锁定商品链接和核心参数，价格变动留痕可追溯。\n\n　　胡钢也建议，行业监管要加大对保价规则的审查和执法力度。\n\n　　胡钢：第一，将“隐形除外”纳入格式条款效力审查，未尽显著提示义务的除外条款无效。第二，执法上把“有价格承诺不履行或不完全履行”作为价格欺诈重点查处。第三，平台不能以“系统审核”替代实质履约，对自营及平台内经营者保价承诺应当切实承担相应管理责任。 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7c86d2af70","title":"大凉山慢火车载几代人奔赴彝历新年","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735063.shtml","summary":"中新社四川西昌11月20日电 题：大凉山慢火车载几代人奔赴彝历新年  　　作者 程兆  　　“这个小‘慢’车最‘快’。","summary_short":"中新社四川西昌11月20日电 题：大凉山慢火车载几代人奔赴彝历新年  　　作者 程兆  　　“这个小‘慢’车最‘快’。","digest":"题：大凉山慢火车载几代人奔赴彝历新年  　　作者 程兆  　　“这个小‘慢’车最‘快…","points":["”11月19日，58岁的瓦张瓦格带着孙子坐上5634次公益性慢火车…","瓦张瓦格表示，西昌到喜德车程约一个半小时，节前公路车流增多，坐汽车可能一堵就是一两个小时","“坐班车要30元(人民币，下同)，去汽车站还得另外坐车，慢火车的票价只要5元…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T10:15:40+08:00","size":1,"keywords":[],"body":"中新社四川西昌11月20日电 题：大凉山慢火车载几代人奔赴彝历新年\n\n　　作者 程兆\n\n　　“这个小‘慢’车最‘快’。”11月19日，58岁的瓦张瓦格带着孙子坐上5634次公益性慢火车，从四川西昌市返回四川喜德县老家，准备迎接彝历新年。\n\n　　瓦张瓦格表示，西昌到喜德车程约一个半小时，节前公路车流增多，坐汽车可能一堵就是一两个小时。他要赶时间置办年货，慢火车成了他回家最“快”的选择。\n\n11月19日，5634次公益性慢火车在西昌站准备发车。程兆 摄\n\n　　凉山州民族中学初三学生吉古衣文也觉得，这趟车“又快又便宜”。当天上午放假，她便乘车回喜德过年。“坐班车要30元(人民币，下同)，去汽车站还得另外坐车，慢火车的票价只要5元，出了火车站就可以走路回家。”\n\n　　瓦张瓦格回忆，六岁时，他跟着外婆从红峰村乘火车到喜德县城，当时车票只要8毛钱。“那时总盼着(彝历)新年快点来。小时候，平时难得吃得上一顿肉”。他说，如今生活好了，肉食早已是寻常，娃娃们仍期盼烧年猪时的热闹以及过年后走亲访友。\n\n　　生活宽裕了，过年的方式也悄然变化。83岁的乘客阿西果格记得，早些时候的过年是乡邻一起烧年猪，忙完经常坐下来聊聊天。同车的20岁乘客阿的五呷则对年味有不同感受：“现在县城里有演唱会可以看，每年还要和朋友们去聚餐、唱歌，能干的事情更多了，过年比小时候更热闹。”\n\n11月19日，5634次公益性慢火车车厢内。程兆 摄\n\n　　自1970年成昆铁路通车以来，慢火车已在大凉山穿行56年。2022年底，新成昆铁路全线开通运营，动车为周边居民提供了更快捷的出行选择；老成昆线上，停靠沿线小站、票价低廉的公益性慢火车仍在继续运行。\n\n　　5634次公益性慢火车列车长吉布日哈说，11月10日起，节前客流逐渐增多，放假的学生尤其多。为方便沿线民众赶集、运输年货，列车还在14号车厢设置“慢车牧歌”专区，免费运输家禽家畜，实现人畜分离。\n\n　　吉布日哈介绍，“今年彝历新年期间，铁路部门在增加节日运力的同时，继续常态化开行公益性‘慢火车’。”\n\n　　几代彝族民众同乘一趟慢火车奔赴彝历新年。对于阿西果洛来说，从第一次登上慢火车到现在已过去半个多世纪，人们的生活、过年时的光景早已不同。但这趟行驶于大凉山的慢火车仍一站站停靠，把一代代人送向家的方向。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cddac2d431a","title":"专卖店、修车铺都表示不提供改装 电动自行车“远光刺客”哪儿冒出来的？","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735084.shtml","summary":"本报记者 孙云柯  　　提到电动自行车的远光灯，不少人都会抱怨：每到夜晚，总有一些电动自行车车灯特别刺眼，隔老远就被晃得睁不开眼，导致眼前白茫茫一片，给出行安全带来极大隐患。","summary_short":"本报记者 孙云柯  　　提到电动自行车的远光灯，不少人都会抱怨：每到夜晚，总有一些电动自行车车灯特别刺眼…","digest":"本报记者 孙云柯  　　提到电动自行车的远光灯，不少人都会抱怨：每到夜晚…","points":["提到电动自行车的远光灯，不少人都会抱怨：每到夜晚，总有一些电动自行车车灯特别刺眼…","北京日报记者实地走访发现，正规电动自行车专卖店、修车铺都表示不提供远光灯改装服务","连日来，记者相继走访了朝阳区合生汇、石景山区万达等地…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T10:11:39+08:00","size":1,"keywords":[],"body":"本报记者 孙云柯\n\n　　提到电动自行车的远光灯，不少人都会抱怨：每到夜晚，总有一些电动自行车车灯特别刺眼，隔老远就被晃得睁不开眼，导致眼前白茫茫一片，给出行安全带来极大隐患。\n\n　　北京日报记者实地走访发现，正规电动自行车专卖店、修车铺都表示不提供远光灯改装服务。那么，夜晚明晃晃的电动自行车远光灯，到底是怎么来的呢？对此，记者展开调查。\n\n　　现象\r\n\n　　“远光刺客”在禁令中大行其道\n\n　　入夜，立汤路上，不时有电动自行车开着远光往来穿梭。记者刚在路边站定，就见到50米外，一辆电动自行车突然从电线杆后闪出逆行而来，瞬间迸射出一团强烈白光，记者顿觉眼前白茫茫一片。和记者一样，旁边的骑车人、行人也都下意识地抬手挡眼，有人干脆停在路边，等车过去了再走。\n\n　　“不知道的还以为是汽车开过来了，那强光根本没法直视。”市民白女士说。这条路是她上下班的必经之处，过往的电动自行车特别多。到了晚上，经常被电动自行车的远光灯晃到。加上立汤路修路，辅路路窄、路况复杂，每次路过这里都得提心吊胆。\n\n　　类似场景屡见不鲜。连日来，记者相继走访了朝阳区合生汇、石景山区万达等地，驻足三五分钟就能撞见好几辆“远光刺客”飞驰而来：灯头压低、光柱平射，一路扫过路面和行人面部。有的车还加装了爆闪功能，一亮一灭，格外刺眼。\n\n　　记者查阅资料发现，今年5月，新修订的《北京市非机动车管理条例》正式实施。《条例》严禁对电动自行车实施拼改装操作，明确禁止加装、改装照明装置、高分贝喇叭等设备。今年以来，本市市场监管部门还持续开展贯穿全年的电动自行车超标改装专项整治行动，每月动态组织集中排查，对超标改装行为依法严处、“露头就打”。\n\n　　但是，“远光刺客”仍然大行其道。这些明晃晃的电动自行车远光灯，究竟从何而来？\n\n　　调查\n\n　　专卖店、修车铺不提供远光灯改装服务\n\n　　记者首先前往电动自行车销售门店一探究竟。在石景山区一家电动自行车店，当记者表明想加装远光灯时，门店负责人明确表示：不能改装。之前已经改装了的现在也都被要求恢复原厂设置。“现在出厂的电动自行车大灯照明都够用，只要不用远光灯，就不怎么晃眼。”\n\n　　在这家销售门店内，记者看到墙上贴有“禁止改装”的标识，明确“不解限速、不拼改装、不销售非法电动三轮四轮车”。随后，记者又走访了周边多家电动自行车专卖店，得到的答复也如出一辙：不提供远光灯改装服务。\n\n　　正规销售渠道不能改装，那这些远光灯是不是来自修车铺？记者随后来到一家电动自行车维修店铺，只见不时有外卖、快递人员将车辆送来维修。“电动自行车车灯能改吗？”记者问道。“改不了，自己拿灯来也不给装。”店铺负责人说。\n\n　　记者随后又走访了两家位置偏僻一些的修车店铺，得到的答案也都一致——现阶段非法改装查得严，电动自行车灯不能改。\n\n　　车主说实情\n\n　　网上买灯自己组装\n\n　　在专卖店、修车铺没能找到“答案”，记者决定转变思路。在探访过程中，记者注意到，加装刺眼远光灯的电动自行车多为外卖车辆。对于电动自行车车灯改装，外卖人员是否更了解？在一处大型商场门口，见到几位外卖小哥正在休息、等单，记者上前询问。\n\n　　一位外卖小哥告诉记者：“有的地方(修车铺)给改，有的不给改。因为改装违法，店里怕出事。一旦出事，店里就得担责。”他给记者介绍了一个方法，可以找那种比较隐蔽的小店，就是连店名都没有那种。这些店大都可以改装远光灯，但是比较难找，需要有人带着去。说着，这位小哥还推荐了附近小区里的一家修车铺，专门维修、改装外卖电动自行车，只要给钱就能修。\n\n　　不过，这样的维修小店，想要找到并不容易。旁边的一名外卖小哥建议：“大部分维修店都不给改，你就自己装嘛！”他告诉记者，不少外卖同行都是自己安装大灯。在网上购买灯具以后，按着说明书，或者是网上教程，看一遍就学会了。有些平台甚至还提供上门安装，只要支付安装费就行。\n\n　　随后，记者登录电商平台，输入“电动自行车”关键词，系统自动弹出“电动自行车超亮LED前大灯”“电动自行车加装灯、前照灯强光款”“电动自行车超强远光射灯”等搜索提示词。这些灯具价格从十几元到几十元不等，商家往往以“十核爆亮”“2000流明”“免接线秒安装”等作为噱头进行售卖。\n\n　　记者点开一款产品链接，商家毫不避讳地宣称卖的就是“流氓射灯”，并标明自己的强光灯已获国家专利，详情页第一条还附上了详细的安装视频，并以“强光晃眼、白茫茫一片”的灯光效果作为卖点。记者随后咨询店铺客服，如果不会安装该怎么办。客服表示，可以找当地的修车人员安装，店铺还有技师可以提供一对一指导。\n\n　　隐蔽套路\n\n　　私下预约上门服务\n\n　　一部分非法改装的电动自行车灯，通过网购、个人安装就上了路。那么，个别修车铺是否还在私下改装电动自行车大灯？根据外卖小哥提供的线索，记者接连走访了几家位置隐蔽、地处小区或背街小巷的修车铺，有两位老板向记者透露了电动自行车改装的隐蔽套路。\n\n　　一家修车铺负责人表示，现在电动自行车改装查得紧，但修车铺可以提供上门服务，或者约好地点私下改装。另一家修车铺负责人则向记者介绍了一家可以改装的店。记者通过拨打电话说明需求，对方当即表示可以上门改灯，改装费20元、上门费30元，同时还详细询问了需要改装的车型、电池型号、灯具等，并给出改装建议。\n\n　　记者调查发现，在全市加大电动自行车非法改装整治力度的大背景下，电动自行车远光灯非法改装虽有所收敛，但并没有消失，而是躲到了更隐蔽的角落。一方面，网上购买电动自行车远光灯十分方便，电商平台没有对此做过多限制，且价格不高、提供教程，给个人安装提供了便利；另一方面，修车铺也没有完全停止非法改装，转为可以私下预约、上门服务的模式，这也成了躲避检查更为隐蔽的改装套路。\n\n　　短评\n\n　　整治非法改装还需向前一步\n\n　　一盏盏刺眼的电动自行车远光灯，成为夜间道路上恼人的“远光刺客”。记者经过调查发现，在电商平台上，打着“流氓射灯”噱头的强光改装件轻松售卖，配套教程、远程指导降低了改装门槛；背街小巷、小区里的无照修车铺，采取电话预约、异地上门的方式躲避检查，让违规改装“换个方式存活”。\n\n　　针对电动自行车改装治理难题，一方面平台应压实责任，对这类眩光改装灯具加强筛查、下架拦截，堵住源头流通渠道；另一方面，执法部门也应紧盯线上线索、深挖隐蔽窝点，对私下接单、上门改装的经营者从严查处。同时，面向外卖骑手等用户群体做好普法宣传，讲清改装的安全风险与所应承担的法律后果。\n\n　　城市夜间通行安全，藏在每一处细节里。治理再向前一步，线上线下同步发力，才能斩断改装暗流，让城市夜晚不再被突如其来的强光惊扰，为人们出行增添一份安全保障。 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccd06e90937","title":"天津老旧供水管网改造完成132.49公里 进度同比大幅提升","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735050.shtml","summary":"中新网天津11月20日电 (孙翼飞)记者从天津市国资委19日举办的新闻发布会上获悉，2026年“十五五”开局之年，天津水务集团加快推进老旧供水管网改造，全年计划改造150公里…","summary_short":"中新网天津11月20日电 (孙翼飞)记者从天津市国资委19日举办的新闻发布会上获悉，2026年“十五五”开局之年…","digest":"记者从天津市国资委19日举办的新闻发布会上获悉，2026年“十五五”开局之年…","points":["中新网天津11月20日电 (孙翼飞)记者从天津市国资委19日举办的新闻发布会上获悉…","天津水务集团相关负责人介绍，作为天津市供水保障的核心力量，集团坚持问题导向…","本年度改造任务中，友谊路DN500管网改造是重中之重"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T10:11:35+08:00","size":1,"keywords":[],"body":"中新网天津11月20日电 (孙翼飞)记者从天津市国资委19日举办的新闻发布会上获悉，2026年“十五五”开局之年，天津水务集团加快推进老旧供水管网改造，全年计划改造150公里，截至发布会时累计完成132.49公里，完成任务量和比例同比历年大幅提升。\n\n图为发布会现场。(天津市国资委供图)\n\n　　天津水务集团相关负责人介绍，作为天津市供水保障的核心力量，集团坚持问题导向，把群众用水诉求作为出发点和落脚点，综合研判管道服役年限、群众报修诉求和实地摸排走访情况，优先选取群众反映集中、改造需求迫切的项目推进实施。\n\n　　本年度改造任务中，友谊路DN500管网改造是重中之重。该路段是天津城区核心主干道，沿线串联5个老旧小区3500户居民及11家重点公共服务单位。工程于3月3日启动，8月16日全面竣工通水，较计划工期提前半月，改造后管网运行稳定、各项指标均达标。\n\n　　实施过程中，天津水务集团坚持“少开挖、少扰民、保通行、保供水”原则，首次在天津市供水管网改造中引入叠层原位固化非开挖修复工艺，并采取夜间施工模式，最大限度降低对交通和居民生活的影响，成为天津市政工程文明施工的标杆项目。\n\n　　此外，天津水务集团还构建“一号响应、多元联动”服务体系，“96655”供水热线实行AI+人工7×24小时无休服务。今年热线呼入电话共计91.4万个，AI应答率达24.96%，电话接通率97.57%，工单处置回复率100%，工单回访满意率99.34%。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c563f86511c","title":"“电子榨菜”变“文化硬菜” “duanju”为何在海外爆火","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735071.shtml","summary":"最近，“duanju”成为海外社交平台爆火的英文通用词。","summary_short":"最近，“duanju”成为海外社交平台爆火的英文通用词。","digest":"最近，“duanju”成为海外社交平台爆火的英文通用词","points":["最近，“duanju”成为海外社交平台爆火的英文通用词","作为新兴文化传播现象，微短剧出海势头迅猛，效果明显，广受关注","据不完全统计，中国微短剧海外应用已突破300款，产品覆盖200多个国家和地区"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T10:03:41+08:00","size":1,"keywords":[],"body":"最近，“duanju”成为海外社交平台爆火的英文通用词。没错，它就是“短剧”的拼音。作为新兴文化传播现象，微短剧出海势头迅猛，效果明显，广受关注。据不完全统计，中国微短剧海外应用已突破300款，产品覆盖200多个国家和地区。国际微短剧市场规模由2023年的6亿美元，增长到2025年的36亿美元。而且在海外微短剧市场，中国企业贡献了约90%的供给份额。微短剧出海，为提升中华文化影响力、增强国家文化软实力开辟了新赛道。\r\n\n　　有人说，一个字里藏着一部文化史。那么，一个跨文化新词的诞生，则意味着一次成功的文化交流。从当年的“kung fu”“tofu”到今天的“duanju”，无不镌刻着中国文化走向世界的印记，隐藏着中国文化的密码。不同之处在于，“duanju”的文化密码具有更多科技含量。\n\n　　回顾历史，科技的发展及其在文化领域的运用，总会催生出新的艺术品类。从摄影术到录音术，从照相机到电视机，莫不如此。如今，互联网新技术改变世界的程度远超以往，由它催生的网络文艺新品类也更加丰富各种社交媒体构建的文化新圈层，各种网络应用催生的生活新场景，以及网络视听平台对人们视听习惯的改变，都为微短剧的崛起和繁盛打下了基础。此外，生成式人工智能进一步降低剧本创作、视频拍摄、后期剪辑、多语种译制的门槛，加速内容迭代、丰富视觉呈现，为微短剧规模化生产与快速传播注入强劲动能。\n\n　　文艺形态随科技发展不断拓展边界，而微短剧正是这一拓展在当下的新体现。微短剧单集篇幅小、时间短，叙事节奏快，情节反转强烈，人物形象鲜明，情绪价值饱满，题材覆盖面广，话题引爆力强。2018年以来，微短剧逐渐驶入发展“快车道”，形成了符合网络时代受众审美需求的精品化路径，正从受人揶揄的“电子榨菜”进阶为老少咸宜的“文化硬菜”。需要指出的是，人们爱看微短剧，固然和创作生产者娴熟运用穿越、重生等叙事手法和“霸总”“甜宠”等类型套路有关，但深层次的原因更在于微短剧往往精准击中社会情绪痛点和燃点，契合普通大众朴素的情感期待与价值取向。当我们把夸张刺激的剧情、引人追更的钩子等微短剧的外在特征层层剥去，它依托轻量化叙事承载大众共通的情感体验，适配当下碎片化的观看习惯；这种篇幅轻巧、冲突直观、共情门槛低的形态，不受地域文化背景的过多束缚，更容易跨越语言和文化隔阂，这也是它能够走向海外、收获海外受众青睐的重要原因。\n\n　　因此，从“duanju”这个英文新词中，我们可以读到科技与文化融合所迸发的活力，更可以读到文化创新所展现的魅力。同时也应看到，微短剧出海面临许多结构性壁垒。比如，文化适配门槛直接制约微短剧在海外的传播，一部国内爆款直接翻译出海，不一定能让海外观众买账，一些在国内语境效果极佳的设定和“梗”也可能因为文化差异而在海外市场失灵。又如，内容同质化这一网络文艺顽症痼疾在微短剧中表现尤为突出，特别是AI运用大大降低制作门槛后，一些创作生产机构跟风而上，导致一些经过市场验证的题材类型长期“霸屏”，不仅整体上拉低了微短剧的品质，而且让观众产生审美疲劳。再如，各国内容监管规则差异大，合规风险分散且复杂，也给微短剧出海带来了挑战。\n\n　　可见，“duanju”这个英文新词距离真正成为长留海外文化生活的“常用词”，还有一段路要走，需要多方发力。\n\n　　首先，提升内容质量是第一要务。微短剧高质量出海首先应提升内容的文化适配度，整合制播各方力量，加强中华文化的开发转化和全人类共同价值的提炼，不断推出既具有中国文化和美学特色又符合国外受众期待的产品。再者，技术赋能是关键所在。作为一种具有鲜明科技属性的文艺新品类，微短剧品质迭代离不开技术的加持。面对AI的快速发展，应当深化新技术在微短剧创作和传播中的运用，更好地开发文化IP，降低制作成本，用技术强化剧集的视听震撼力和艺术感染力，助力其提升传播范围和效果。最后，营造良好生态是根本保障。应梳理不同国家和地区文化适配特征，动态掌握其文化和互联网政策变化，让微短剧的出海之路在良性生态中行稳致远。\n\n　　眉间尺 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ceaf967c4dc","title":"纸箱、旧鞋架等堆放在楼道 发现邻居有这一行为请及时劝阻或举报","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735053.shtml","summary":"发现邻居有这一行为⤴️请及时劝阻或举报  生活中，一些住户为了方便  将纸箱、旧鞋架、废旧家具等  堆放在楼道  图片来源：“中国消防”微信公众号  这一做法看似节省了空间  却给整栋楼埋下了巨大安全…","summary_short":"发现邻居有这一行为⤴️请及时劝阻或举报  生活中，一些住户为了方便  将纸箱、旧鞋架…","digest":"发现邻居有这一行为⤴️请及时劝阻或举报  生活中，一些住户为了方便  将纸箱、旧鞋架…","points":["2026年10月，河南郑州一小区居民楼楼道起火，起火原因为堆在楼道的纸箱…","2026年4月，江西南昌一小区居民楼11楼的楼道起火，消防员接警后到场将火扑灭","2026年2月，广东肇庆市高新区一小区发生火灾，消防员接警后到场将火扑灭"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T09:34:07+08:00","size":1,"keywords":[],"body":"发现邻居有这一行为⤴️请及时劝阻或举报\n\n生活中，一些住户为了方便\n\n将纸箱、旧鞋架、废旧家具等\n\n堆放在楼道\n\n图片来源：“中国消防”微信公众号\n\n这一做法看似节省了空间\n\n却给整栋楼埋下了巨大安全隐患\n\n案例警示\n\n01\n\n　　2026年10月，河南郑州一小区居民楼楼道起火，起火原因为堆在楼道的纸箱、废旧家居用品被引燃，火势还波及了公共设施。\n\n02\n\n　　2026年4月，江西南昌一小区居民楼11楼的楼道起火，消防员接警后到场将火扑灭。起火物为楼道内堆积的废旧纸箱、塑料瓶等杂物。\n\n图片来源：“中国消防”微信公众号\n\n03\n\n　　2026年2月，广东肇庆市高新区一小区发生火灾，消防员接警后到场将火扑灭。起火原因是遗留火种引燃门外走廊堆积的杂物。\n\n图片来源：“中国消防”微信公众号\n\n占用疏散通道或将被罚款！\n\n　　《中华人民共和国消防法》\n\n　　第二十八条 任何单位、个人不得损坏、挪用或者擅自拆除、停用消防设施、器材，不得埋压、圈占、遮挡消火栓或者占用防火间距，不得占用、堵塞、封闭疏散通道、安全出口、消防车通道。人员密集场所的门窗不得设置影响逃生和灭火救援的障碍物。\n\n　　第六十条 占用、堵塞、封闭疏散通道、安全出口或者有其他妨碍安全疏散行为的，单位将被责令改正，处五千元以上五万元以下罚款；对个人处警告或者五百元以下罚款。\n\n阿消提示\n\n请大家一起维护消防通道畅通\n\n为生命让行\n\n日常生活中\n\n大家若发现消防通道内堆积杂物等安全隐患\n\n可向物业反映\n\n或拨打12345政务服务热线进行投诉\n\n 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c834b7a3a62","title":"全国大部降水稀少 未来十天冷空气势力较弱","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735018.shtml","summary":"中新网11月20日电 据中央气象台网站消息，过去一天，我国大部地区降水稀少，云南东部和南部、广西南部等地部分地区出现中雨，局地大雨；山东半岛出现小到中雪或雨夹雪，威海局地大到暴雪。","summary_short":"中新网11月20日电 据中央气象台网站消息，过去一天，我国大部地区降水稀少，云南东部和南部…","digest":"据中央气象台网站消息，过去一天，我国大部地区降水稀少，云南东部和南部…","points":["中新网11月20日电 据中央气象台网站消息，过去一天，我国大部地区降水稀少，云南东部和南部…","山东半岛出现小到中雪或雨夹雪，威海局地大到暴雪","其中，山东半岛东部有大到暴雪，云南南部的部分地区有中到大雨"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T09:23:23+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据中央气象台网站消息，过去一天，我国大部地区降水稀少，云南东部和南部、广西南部等地部分地区出现中雨，局地大雨；山东半岛出现小到中雪或雨夹雪，威海局地大到暴雪。此外，内蒙古、华北、黄淮、东北地区等地风力较强，风寒效应明显。\n\n　　最新预报显示，今明两天，全国大部地区降水稀少，主要雨雪集中在内蒙古、黑龙江、山东半岛及云南等地。其中，山东半岛东部有大到暴雪，云南南部的部分地区有中到大雨。\n\n图片来源：中央气象台网站\n\n　　未来10天，影响我国的冷空气势力较弱，中西部大部地区气温较常年同期偏高1~3℃，新疆、青藏高原和甘肃等地偏高4~6℃；华东部分地区气温较常年偏低1~2℃。其中22日至24日，一股中等强度的冷空气将给东部地区带来降温和雨雪天气，内蒙古东部和东北地区将有小到中雪，局地大雪。\n\n　　气象专家提醒，11月下旬冷空气势力不强，气温将稳步回升，但北方地区昼夜温差较大，部分时段有大风天气，户外活动需警惕风寒效应，做好防寒保暖措施。山东半岛、黑龙江西北部、内蒙古东部多雨雪，需防范道路湿滑、结冰等对出行交通的不利影响。\n\n图片来源：中央气象台网站\n\n图片来源：中央气象台网站\n\n 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf3e9cadf0b","title":"“赛博确诊”ADHD：逃避，还是自救","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735032.shtml","summary":"“家人说我没问题，小时候很爱看书学习，成绩也好，现在说自己是ADHD(注意缺陷多动障碍，核心特征是注意力难以持续、多动、冲动和执行功能薄弱——记者注)，就是找借口不愿自律，没有上进心。","summary_short":"“家人说我没问题，小时候很爱看书学习，成绩也好，现在说自己是ADHD(注意缺陷多动障碍，核心特征是注意力难以持续、多动…","digest":"“家人说我没问题，小时候很爱看书学习，成绩也好…","points":["“家人说我没问题，小时候很爱看书学习，成绩也好，现在说自己是ADHD(注意缺陷多动障碍…","”24岁的陈婷正在在职考公，但一直面临着容易走神、拖延的困境","随后，她急切地想要去医院确诊，心情如同文学作品中的主人公，被所有人误解…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T09:08:58+08:00","size":1,"keywords":[],"body":"“家人说我没问题，小时候很爱看书学习，成绩也好，现在说自己是ADHD(注意缺陷多动障碍，核心特征是注意力难以持续、多动、冲动和执行功能薄弱——记者注)，就是找借口不愿自律，没有上进心。”24岁的陈婷正在在职考公，但一直面临着容易走神、拖延的困境。在网上社群进行交流、对比后，她认为自己可能是ADHD。\r\n\n　　很多人都有这样的经历：无意间刷到了一篇“ADHD的10种表现”，越看越觉得每条都在说自己。相比于需要费时费力的抢挂号、等就诊、准备材料，人们热衷于通过网上问卷等快速的方式来判断自己是否可能存在某种问题，这被叫作“赛博确诊”。\n\n　　这种风潮已经流行了较长一段时间，许多人提出，这种“赛博确诊”是对自己复杂人格的简化，对自己真实能力的限制，中青报·中青网记者也注意到，“赛博确诊”的年轻人，对此也有争论辩驳——“‘赛博确诊’的背后，是我想要更积极的生活”。\n\n　　为什么“自我确诊”\n\n　　陈婷不觉得“自我确诊”是找借口、逃避困难，恰恰相反，她想要以一种科学的方式改变现在的困境，她也一直在找机会去正规医院诊断。如果确诊，她计划服用“专注达”或做一些专业的训练改善症状，同时参考其他ADHD病友的经验，找到合适的发展路径，而非将时间精力一直投入眼下辛苦但毫无效率的备考。\n\n　　27岁的徐思刚发现自己可能是ADHD的时候，一宿没合眼，“好像我人生20多年许多大大小小的痛苦都有了一个解释，我并不是懒惰、态度差、没有意志力，我只是有先天性的病。”\n\n　　随后，她急切地想要去医院确诊，心情如同文学作品中的主人公，被所有人误解，直到接近结局时才找到证据证明自己，“我想告诉所有人，我不是故意把事情搞砸，这是自我辩解，也是一个新的开始。”\n\n　　26岁的邓明天认为自己同时有ADHD和ASD(孤独症谱系障碍，核心特征是在眼神交流、理解暗示、表达情绪等方面存在社交沟通困难和兴趣狭窄、重复刻板行为——记者注)。回忆童年，他感觉自己在任何地方都没有归属感，格格不入、很疏离，而在讨论ADHD和ASD的网络社区，他却获得了从未有过的身份认同。\n\n　　北京大学医学部精神卫生学博士汪冰分析，人们为什么需要一个标签？首先，诊断本身把一组复杂的感受或表现变成了一种临床事实，让人们不再与自己的痛苦为敌，让当事人更加自洽，即对自我的接纳，“我的痛苦是真实存在的”；其次，跟别人介绍自己的时候，比起说很多症状，有一个标签对信息进行简化和压缩，更为方便。诊断还能让人获得归属感——“我不再是一个独自承受痛苦的人，还有很多人与我有类似的处境，这让我更有勇气去面对了”。\n\n　　这种标签是构建自我概念的抓手，告诉别人“我是个什么样的人”“我是谁”，人们可能会因为这一标签的存在，对自身身份更加自信而不是自卑，因为诊断不是一种个人失误或人生失败，它只是一项临床事实：我从“有问题的人”转变为“正在面对人生挑战的人”。\n\n　　诊断也是某种确定性的来源，尤其是在当下这个快速变化的世界，当大的框架失效，人们就需要自己小的框架来应对外在的混乱，“寻求诊断，或寻求性格标签，可以帮人建立一种内在的秩序感——我们还在某个架构当中，可以以此为依靠。”汪冰说。\n\n　　为什么不去医院确诊\n\n　　徐思确实想过去医院就诊，但至今仍未去过。\n\n　　连续两个月，她每次打开几家有诊断资格的医院的小程序，却发现医生的号已挂满。她专门定闹钟在放号日抢号也以失败告终，“我冷静了，”她说，“我连抢号都觉得很困难，即使挂上号了，按时到医院、联系关系不好的父母、准备就诊需要的发育史和后续复查，对我来说也并不简单。”\n\n　　后来她也在反思，即使真的确诊，生活会如她所想那样，发生翻天覆地的变化吗？她本身就常常处于焦虑和抑郁状态，在和已确诊的朋友交流后，得知服用药物会加重焦虑。徐思也承认她的注意力和精力问题是由多种因素导致的——除了焦虑抑郁，还有颈椎病、失眠，可能还包括缺乏一些微量元素，在此情况下，即使花钱买药服用，也并不一定能够立刻见效。\n\n　　“再者，他人可能也并不在乎我是否得病，得了一种怎样的病。”徐思说，“我在脑海中演绎我向老师、老板、家人摊牌的场景，似乎也并不会怎样。老师只在乎我马虎没能拿到满分；老板只在乎我会不会工作出错、拖延任务；我和父母也不住一起了，他们更不会怎么样我。”\n\n　　邓明天在做诊断攻略后也发现，国内能准确诊断成年人ADHD的医院和医生不多，就诊和开药的费用也并不便宜。他和做咨询师的朋友聊天，纠结要不要去医院就诊。\n\n　　而咨询师朋友反问他：“确诊意味着什么？当你获得一个诊断，它能够帮你自己更理解、更支持你自己吗？别人也会更理解你、更支持你吗？”\n\n　　咨询师朋友也告诉他，ADHD、ASD和CPTSD(复杂性创伤后应激障碍，在普通创伤后应激障碍的基础上，还伴有‌情绪调节困难、负性自我概念、人际关系困难‌三大核心特征——记者注)有很多共病的症状，很难下定论一种症状究竟是神经发育的问题，还是创伤的影响；人类神经发育的差异性也是一条光谱，最左端代表着神经典型发育者，最右端则是典型自闭症表现者，其间分布着各种不同的神经发育特征，体现着人类大脑发育的复杂性和多样性，这些特征本身并不具有病理学意义，它们只是人类神经多样性光谱上的不同坐标点。\n\n　　“总而言之，这一类疾病的确诊是一个复杂的、还在不断研究发展的课题。”邓明天说，“唯一可以确认的是，要亲自完成医院确诊的一套流程并不容易，存在许多主观和客观上的挑战。”\n\n　　触碰标签后，如何过好余生\n\n　　陈婷的妈妈给她发过一段话：\n\n　　“当所有的性格瑕疵都被包装成一种不可控的心理机制时，成长和改变的动力就消失了。因为我是回避型人格，所以我可以理直气壮地切断沟通；因为我是ADHD，所以我可以心安理得地放弃专注。标签给了我们一个极其体面的借口，让我们不用去面对那些笨拙的、需要通过意志力去克服的人生课题。这种体系不是在赋能，而是在阉割，它让我们在专业的术语里变得越来越虚弱。”\n\n　　陈婷看到后，首先是不服气，但在内心深处，她也很不确定——我目前“自我确诊”了，然后呢？我会正规确诊吗？我真的可以寻找到、经营好更适合我的生活吗？我真的不会在潜意识中因为这份“确诊”而改变自己本应有的、本应坚持的什么行为吗？\n\n　　邓明天也意识到，“确诊确实是一种释怀，但你还是要继续面对ADHD给生活、学习和工作带来的挑战，挑战不会凭空消失。”徐思说：“我要做的不是确诊给其他人看，而是努力在这个现状下正常生活。”\n\n　　邓明天的咨询师朋友对他说，这些挑战是一辈子的，确实会影响到家庭、婚姻，社交等。但ADHD和ASD也并不只表现为缺点，还会带来一些别样的、可以利用的好特点。当你认识到自己的潜力，燃起求生和拥抱更好生活的本能冲动，你就不会被困在静止的、糟糕的生活中。\n\n　　汪冰也提到，“我们可以将类似ADHD的一些精神科障碍理解为一种慢性长期的疾病。并不是我们有了疾病，就失去了追求幸福生活的机会，诊断只是看待生命的一个维度，人不能被等价或简化为他所面对的问题。ADHD患者的病情也不会任何时候都一样严重，有时可能会轻一点，社会功能更好一点，如果以一个标签静态地看待自己，你就捕捉不到你人生当中的变化和可能，容易被绝望所包围。”\n\n　　许多“自我确诊”ADHD的年轻人，描述自己正身陷或想要摆脱一种“废了”的生活状态，即提不起劲生活，无法专注和坚持，在课业、求职、工作上屡屡受挫。对此，汪冰分析：“我周围许多被认为所谓有点‘废’的人，只是在不喜欢的事情上做不到追求高效奋斗。‘废’的背后还有一种可能性是‘习得性无助’，当一个人去适应社会的时候，发现自己被安排的既定人生路线和自己疲于应对的生存状态都非常难受，此时，‘废’可以被理解为一种自我保护，‘废’是想节约自身能量，不去做无谓的消耗。”\n\n　　那么，如何找到方向，又如何行动起来？\n\n　　“想象一下，多年以后你过上了理想的生活，细节会是怎样的？有哪些事是你今天就可以开始做的？先一点点搬到现在。从可改变之处入手，而不是跟改变不了的事实死磕。”汪冰说。“比如，从自己的优势入手，优势会让人想要去学习和精进，发挥优势时，人有价值感、成就感，甚至会忘记生命中的苦痛。优势是生命种子中蕴含的重要内驱力。”\n\n　　在日常的实践层面，启动困难、难以坚持的人，汪冰建议他们将事务计划得更简单、更细化。“例如你要阅读，即使你连看完一页书都坚持不了也没关系，今天看一个词，明天再看一个词，只要你看了，你就完成了今天的阅读任务，让任务小到不可能失败，那只要完成，就会获得大脑的奖赏，从而慢慢坚持下去。记得要成为自己的拉拉队，而不是差评师。”汪冰说。\n\n　　汪冰回忆，他曾参加一场关于ADHD的国际会议时，一位有名的治疗ADHD儿童精神科专家说过：“我发现治疗ADHD的医生最重要的职责，是帮助每一个患者找到自己的生活道路，你因为知道、确认了自己的不一样，可以去理直气壮地、有勇气地选择自己的生活道路。”\n\n　　“就像精神科的药物可以治疗你的症状，却不能赋予你人生的意义；医生可以给你诊断，却无法完全教会你如何活出自己。这都是需要我们自己去寻找答案的命题，人是自己人生的第一责任人，对人生负责，有时是让人恐惧的，因为没有标准答案，但这也意味着你有填写空白的自由，这种人生的自由值得我们珍惜。”汪冰说。\n\n　　(文中陈婷、徐思为化名)\n\n　　中青报·中青网记者 李怡蒙来源：中国青年报\n\n　　2026年11月20日 04版 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c42bac6bb74","title":"今天起，厨房这个地方，别忘了清洗！","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735029.shtml","summary":"10月16日10时35分  江西南昌一家餐饮店突发火灾  火舌顺着排烟囱一路向上猛蹿  现场浓烟滚滚\r  消防员到场后发现  起火点位于餐饮店后厨的灶台处  火势已借助排烟囱的油垢迅速蔓延  屋顶不断…","summary_short":"10月16日10时35分  江西南昌一家餐饮店突发火灾  火舌顺着排烟囱一路向上猛蹿  现场浓烟滚滚\r  消防员到场后发…","digest":"10月16日10时35分  江西南昌一家餐饮店突发火灾  火舌顺着排烟囱一路向上猛蹿…","points":["10月16日10时35分","江西南昌一家餐饮店突发火灾","火舌顺着排烟囱一路向上猛蹿"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T09:03:32+08:00","size":1,"keywords":[],"body":"10月16日10时35分\n\n江西南昌一家餐饮店突发火灾\n\n火舌顺着排烟囱一路向上猛蹿\n\n现场浓烟滚滚\r\n\n消防员到场后发现\n\n起火点位于餐饮店后厨的灶台处\n\n火势已借助排烟囱的油垢迅速蔓延\n\n屋顶不断有火焰喷出\n\n所幸救援及时\n\n明火被迅速扑灭\n\n事故未造成人员伤亡\n\n据了解\n\n火灾发生时\n\n店内员工使用灭火器扑灭灶台明火\n\n但油烟机内部明火无法扑灭\n\n随即拨打119电话报警\n\n经调查，起火原因为\n\n厨房员工炒菜时用火不慎所致\n\n油烟管道为何会成火灾“帮凶”？\n\n　　油垢易燃\n\n　　厨房长期使用明火，油烟管道易受油烟熏染，长期不清洗导致油渍附着在油烟机和烟道表面，形成难以清除的油垢。油垢属于易燃物，一旦遇到火源，极易被引燃。\n\n　　蔓延迅速\n\n　　油烟管道是一个相对封闭的空间，起火后易形成“烟囱效应”，快速蔓延成灾。\n\n　　易形成立体火灾\n\n　　制作烟道的材料通常导热系数较高，容易引燃烟道附近可燃、易燃物品，导致火势向纵横方向迅速蔓延扩大，扑救难度大。\n\n如何预防油烟管道起火？\n\n　　使用合格烟道建材\n\n　　有些饭店为了节约成本，用易燃物制作烟囱和抽油烟机管道。一旦油锅着火或火苗上窜，这些易燃物容易被直接点燃。\n\n　　及时清理油烟管道\n\n　　国家市场监督管理总局、国家标准化管理委员会发布的GB/T 40248-2021《人员密集场所消防安全管理》中明确，宾馆、餐饮场所、医院、学校的厨房烟道应至少每季度清洗一次。\n\n　　家庭厨房内也应注重油烟机、油烟管道的清洗。\n\n　　厨房的抽油烟罩每日用完后要擦洗一次，油网一般5-10天需清洗一次，3-6个月建议对油烟机抽风扇进行清洗，一年以上建议由专业人士进行整体深度清洗。\n\n　　完善消防设施设备\n\n　　厨房内要配备灭火器等消防设施，一旦发生火情，可及时扑救初起火灾，避免灾情扩大，为消防救援争取时间。\n\n　　高层建筑及商业综合体中的餐饮场所，最好安装厨房灶台自动灭火装置。\n\n提醒大家\n\n厨房易受油烟熏染\n\n建议定期清洗\n\n油烟机和油烟管道\n\n及时消除安全隐患 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd87ef34d22","title":"老挝华文学校校长许顺宏：华文教育打开当地求学者的发展新空间","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075518.shtml","summary":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","summary_short":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","digest":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行","points":["11月18日至19日，第六届世界华文教育大会在海南博鳌举行","据老挝万象中老友谊学校校长、老挝中文职业教育发展培训中心主任许顺宏介绍，中老铁路开通后…","华文学校在做好华文基础教育的同时，紧扣市场需求，培养“中文+旅游”“中文+电力”“中文+矿业…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T08:24:24+08:00","size":1,"keywords":[],"body":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。\n\n据老挝万象中老友谊学校校长、老挝中文职业教育发展培训中心主任许顺宏介绍，中老铁路开通后，许多中国人到老挝投资、创业、旅游，中资企业大量涌入，华文教育正顺势谋求转型。华文学校在做好华文基础教育的同时，紧扣市场需求，培养“中文+旅游”“中文+电力”“中文+矿业”等复合型人才。老挝掀起“中文热”，当地民众学习中文，早已不局限于掌握一门语言，而是将其视作一种谋生手段、一门技能。(记者 李宇凡 刘洋）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/ABD74AE65C534A3D81FED11D0F4C8CC3.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf54f6d61be","title":"AI走进大学课堂：教什么，怎么教","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735011.shtml","summary":"在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词，让AI生成一个餐馆介绍页面，台下同学跟着操作。","summary_short":"在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词，让AI生成一个餐馆介绍页面，台下同学跟着操作。","digest":"在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词…","points":["在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词…","同样的提示词，该校新闻学专业的郭金梦生成的页面怎么都和老师的不一样","中南大学计算机学院2023级本科生孔禹程，大三时选修了学校信息与网络中心主任奎晓燕教授新开设…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:21:29+08:00","size":1,"keywords":[],"body":"在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词，让AI生成一个餐馆介绍页面，台下同学跟着操作。同样的提示词，该校新闻学专业的郭金梦生成的页面怎么都和老师的不一样。“没办法，AI生成的内容具有随机性。”她说，“所以老师只教我们搭大框架，具体的细节需要我们自己尝试和AI沟通。”\r\n\n　　近日，中国青年报·中青校媒就AI引入大学课堂的体验与效果展开问卷调查，共回收有效问卷4763份，其中72.27%受访者的专业不直接与人工智能、计算机相关。结果显示，AI课程正在以不同形态进入高校课堂，39.16%受访者修读过AI通识课，28.89%受访者修读过在专业课中嵌入AI模块或工具的课程，19.42%受访者修读过由不同学科老师共同完成的AI融合课。\n\n　　AI进课堂，有的教“工具”，有的教“思维”\n\n　　中南大学计算机学院2023级本科生孔禹程，大三时选修了学校信息与网络中心主任奎晓燕教授新开设的通识教育示范选修课程“邂逅人工智能时代”。这门课不容易选上，“第一次开课后，校园集市里上过课的同学都在夸，我就下决心要选”。他第一轮没抢到，开学第二周在选课系统里发现有补选名额，才补选成功。\n\n　　开课前，孔禹程以为这门课会像很多公选课一样，系统讲AI概念和算法，实际却是一个个专题：数据可视化、AI绘图、医学智能影像……“14位老师分别授课，每位老师结合自己的专业方向解读不一样的‘AI+’，我们自己很难了解到这么广的知识”。\n\n　　但课程团队自己清楚，第一轮开课“教浅了”。中南大学计算机学院教师刘逸峰介绍，首次开课时团队把内容重点放在如何正确使用提示词上，课程过半发现问题：“提示词太基础。同样的模型，有人用得好，有人一窍不通，差别不只在提示词，更在于有没有解决问题的能力。在通用人工智能时代，‘AI+’的核心是‘+’后面的内容，要和具体场景深度融合。”课程由此转向包括数据思维、连接思维、计算思维、流程思维等在内的底层思维与“为谁做”“做什么”“怎么做”的社会责任感培养。\n\n　　中青校媒调查显示，在修读AI相关课程的受访大学生中，有68.01%受访者所学课程涉及专业融合(AI用于专业课程学习、科研、作业或项目)，61.32%涉及思维素养(理解AI能做什么、不能做什么、如何判断)，50.98%涉及工具扫盲(学习AI工具的基本操作)，42.71%涉及就业准备(了解并学习目标岗位AI能力要求与求职准备)，27.64%为通识启蒙(了解概念、消除陌生感)，25.52%涉及伦理与批判(AI的风险、伦理与社会影响)。\n\n　　福建师范大学播音与主持艺术专业副教授卢佳音，把“即兴口语创作”的课程名字改成了“AI时代的即兴口语创作”。她的理由是：学生一出校门就要面对全面嵌入AI的工作流程——选题策划、内容准备、文稿写作、视频切片、营销策略、传播复盘、Skill复用。由此，课程在原有主体能力之外，新增了一块“人机协同的能力”。\n\n　　卢佳音在课堂上教的AI工具非常多，有的课上用，有的课后用。AI工具“得到大脑”可以处理音频，她在课堂上示范如何学习运用它整理口语逻辑；结合真实项目，教学生让WorkBuddy在本地文件夹里工作、建知识库，也是她教学中的一环。卢佳音联合福建省文化科技特派团，带学生到福建泰宁开展文旅直播。她会先带着学生建知识库：把历史、人文、地理、政策等背景资料统统放进去，再去采访专家、讲解员、融媒体中心的工作人员，把这些采访到的语音内容也放进知识库；然后有的同学使用Kimi，有的使用DeepSeek，用对话在知识库里生成多个选题方案，再综合选择判断。\n\n　　郭金梦的专业选修课“网页设计与制作”，前八周学网页制作基本知识，后八周侧重于用AI制作网页，实践部分的考察重点，是最后制作的网页是否符合要求。在制作网页的过程中，她遇到过代码报错、越改越乱的情况。上千行代码她看不懂，只能让AI自己修复；修复出来能不能用，也是一个未知数。尽管理论课上老师教过相关知识，但“比较浅”，老师的目的是让学生能看懂代码。“真的上手修改，不如交给AI，一个不行就换另一个。”\n\n　　“使用工具归根到底是为了提升效率。”在刘逸峰看来，工具可以是软件、大模型、智能体，但只有看懂事情的本质，才知道用什么工具提升效率。这正是他希望学生通过这门课领悟的道理。\n\n　　有人改造工具，有人只能“抽卡”\n\n　　类似的“AI+”课程，郭金梦还选了一门“新媒体创作与实践”。其中部分教学内容涉及AI视频提示词的写法——“比如你要描述一个动作，不能只说‘弯腰捡东西’，必须精确到多少度、脸侧向哪边、光影怎么打等”。而再精细的讲解也只能停留在PPT上。郭金梦说，由于AIGC生成类软件费用较高，老师在课上没有进行实操讲解。\n\n　　这门课的个人作业是创建一个自媒体账号并提交代表作。郭金梦决定用AI制作视频发在自己的社交媒体平台上。为了“起号”，她必须保证更新频率；由于资金受限，她盯上了豆包每天的免费额度。她用“痛苦”来形容每天的“抽卡”活动。“输出的内容太不稳定了，但无论好坏，生成每条视频又会确确实实扣我的额度。”\n\n　　在免费模型和有限额度的制约下，郭金梦只能妥协，“只要说得过去，我就不会太过纠结”。但无论是网页作品还是自媒体视频，她对自己的作品都不满意：“网页细节处理不到位，我没法修改；视频主要是模型的问题，免费的没办法做得那么精细。”\n\n　　在对AI相关课程满意度的调查中，评价最高的是“学习后将AI用于本专业研究、实践的能力”和“教师对AI新工具、新进展的掌握”；“教学内容与专业的结合度”“实践操作与动手机会”等相对靠后。不过，当下，已有高校师生开始利用AI自主搭建学习平台。\n\n　　在山东大学考古学院，大四学生张天翊从5米见方的虚拟探方中清理出一具人类骨骼，随后进行形态学测量与鉴定。这个名为“人类骨骼考古虚拟仿真实验教学项目”的平台，是山东大学虚拟仿真实验教学共享平台下的开源项目，校内学生可在线完成从发掘到基础研究的流程。通过该平台，田野考古的真实工作场景被完整复刻进虚拟场景，学生尚未参与发掘，便已“预知”了真实的工作现场。\n\n　　感受到了AI的高效，张天翊开始自己尝试应用AI解决学习、科研当中的问题。她所在的一支团队探索陶片数字拼合，应用AI工具，对陶片扫描、拼合、计算和修复中的实际痛点进行了创新。在她看来，工具会过时，但在使用、改造工具过程中培养的问题导向思维不会过时。\n\n　　福建师范大学中华文化传承与两岸融合发展数智实验室研究员邵的湾和学生也自建了一个名为“会通”的课程平台。他们把几十本适合本科生的跨文化传播专著、教材和跨文化传播的具体案例“喂”给AI，由AI生成理论卡，每张卡写明理论怎么用、结合案例怎么推进、出自哪些参考书目。“会通”平台在“跨文化传播”这门项目制课程里得到了充分运用。\n\n　　从边学边教，到边教边改\n\n　　卢佳音在给学生做口播生成练习时发现，学生用AI的方式大致有三种：一是直接说“你帮我生成一个什么样的内容”；二是先列出出镜口语的几个特点，请AI从这些角度生成；三是前两种都试过、发现生成的东西不对，于是把与主题有关的内容全部交给AI，让它先理解，再把自己不理解的问题提给AI、请它解释，直到充分理解相关选题后，再让AI生成——此时AI很快就知道该怎么改，最后再将文案调整成学生的个人风格。\n\n　　让卢佳音意外的是比例：“90%的同学用的是第一种和第二种，做得特别好的那个学生用的是第三种。”这次观察直接促使她改了教案——方向转为“怎么跟AI提问、怎么让AI加深理解”。\n\n　　此外，卢佳音发现AI使用的差别还体现在知识组织上。她评价一份关于直播策划的学生作业做得“非常扁平”，原因是知识库“没建好”。她的建议是：“先和AI讨论知识库该有哪些结构层次、哪些维度的内容用哪个AI找，建好知识库，再回来讨论策划。”\n\n　　基于学生掌握AI的程度不一，卢佳音已经在尝试做课堂层面的分层。在全媒体传播微专业的AIGC视听模块，她给自己的定位是“提供机会和渠道的人”。由于自己不会做AIGC，她请来业界人士给做得好的学生辅导，再推荐学生去AI公司实习，让实习回来的同学担任这门课的助教，共同讨论这门课到底怎么上。\n\n　　卢佳音的“边教边改”和自己的成长有关。去年带着学生用AI写脚本，她能给的反馈只有“你生成的脚本不行、提问方式不对”；那时她还不会做工作流，也不会建知识库。她说：“今年才到这个水平，下学期不知道又会怎么想。”\n\n　　在卢佳音看来，非计算机专业背景的老师要学会“教AI”，最难的不在工具，在观察：“我得花很多时间观察学生在人机协作过程中的难点。学生与AI协作的过程是个人化的、隐蔽的，老师要有敏感度。”她因此不把自己放在“教”的位置：“我一直不觉得是‘老师教学生’，我就是在分享使用经验——学生做得比我好，我发现他做得好的地方，然后把它放大。”\n\n　　“在AI面前我们都是同龄人。”卢佳音对学生说，“我不见得全对，也可能不够好；你们有更好的办法，大家一起交流。”\n\n　　调查数据显示，在被问及“如何加强AI教育”时，受访者的选择中，“开设分层次课程(零基础/进阶分开)”以55.55%排在第一位，“完善教学体系，增强AI相关专业师资力量”占52.53%，“加强AI与专业的融合课程”占51.84%，“引入企业真实案例与行业导师”占39.39%；此外，“用好智慧教室/线上平台，提供个性化学习资源”“提升教师AI素养与教学培训”“增加实践操作与项目式学习”“开设AI工具工作坊、训练营”“完善AI学习社群与朋辈互助”等，也是受访大学生认为有助于加强AI教育的举措。\n\n　　邵的湾判断学生“会不会”的方式，和卢佳音不同。“把PPT拍照“喂”给AI、直接提问事件梳理，与注入理论并加上反思性提示词，产出的报告质量差别很大。AI报告反而能验证课堂知识的消化程度。”她把这种做法称为“反验证”。此外，她要求学生在作业中像列参考文献一样单列“AI使用情况页”，逐条写明哪些是AI做的；还常问学生“AI有没有给到你惊喜”——比如要求5点却生成第6点，以此拉开理论思维的差距。\n\n　　中青校媒调查显示，受访大学生认为最理想的AI课程内容是“专业融合课——教AI如何服务于本专业”(58.39%)、“思维素养课——AI用于专业课程学习/科研/作业/项目”(54.63%)和“工具扫盲课——学习AI工具的基本操作”(52.91%)。约三成受访大学生认为，AI融合课或嵌入AI的专业课应该由“专业教师+AI/计算机专业教师+企业导师”共同授课。\n\n　　卢佳音不反对这样的“双师”模式，但她希望的是“共同解决问题”，而不是“课是课、事是事，没有融合”。“普适知识必须和本学科的需求结合才有用。”\n\n　　刘逸峰所在的“邂逅人工智能时代”课程团队，由信息与网络中心、计算机学院等不同教学单位的14位老师组成，每位老师根据自己的“AI+科研方向”负责一个专题。在他看来，这本身是一种跨学科协作。\n\n　　刘逸峰介绍，根据教育部有关要求，中南大学奎晓燕教授还牵头新开设了“人工智能基础及应用”必修课程，面向全体本科生开设，提升学生人工智能通识素养，课程根据专业背景分为理工科A类、医学B类和人文社科C类三个类别，分学期实施教学。目前，医学B类课程以“医学+AI”融合实践为特色，现已顺利完成首轮教学。\n\n　　面对AI技术带来的教学变化，山东大学考古学院院长郎剑锋表示，学院已经把学生培养方案从“四年一大调”改为“两年一大调、每年一微调”，且正在组织《AI考古导论》课程和教材建设，“希望人工智能技术全面赋能教学与人才培养”。\n\n　　“每门课都要有进驻真实世界的真实项目。”在卢佳音看来，有了真实的实践，学生才知道如何协作，进而发现问题、解决问题。她认为很多老师对AI的抵触来自一个预设：要学好了、学到位了，再应用；但当下技术的逻辑并非如此——“我有问题要解决，想想有什么技术能帮我解决，我学一学。”卢佳音说，这个道理同样要讲给学生听：先做事，用起来，不会了再想办法。\n\n　　中青报·中青网记者 刘俞希 程思 梅从政 实习生 吴佳玲 来源：中国青年报\n\n　　2026年11月20日 07版 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf292dc23ea","title":"“线上气氛组，线下社恐人”：大学生如何破局","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735010.shtml","summary":"当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包；可一旦有人发起线下见面的邀约，你会选择视而不见。","summary_short":"当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包；可一旦有人发起线下见面的邀约，你会选择视而不见。","digest":"当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包；可一旦有人发起线下见面的邀约…","points":["当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包","可一旦有人发起线下见面的邀约，你会选择视而不见","这个标签自有它的慰藉力量：那些难以言说的局促有了一个被同伴理解的名字…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:12:55+08:00","size":1,"keywords":[],"body":"当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包；可一旦有人发起线下见面的邀约，你会选择视而不见。你是这样的“线上气氛组，线下社恐人”吗？\n\n　　调研数据呈现出强烈的反差：近八成大学生认为自己有社交恐惧症，但真正达到临床确诊标准的只有0.64%。如今，“社恐”已成为大学生群体里最流行的自我注解之一。这个标签自有它的慰藉力量：那些难以言说的局促有了一个被同伴理解的名字，让人得以松一口气——原来不止我一个人这样。但危险的拐点也藏在这里：当标签从“描述某一刻的感受”慢慢滑向“定义‘我是谁’”，一切就变得不一样了。那么，在保护自我的铠甲与困住自我的围墙之间，那条分界线究竟在哪里？\n\n　　要回答这个问题，我们先要了解线上、线下社交模式的差异。线上社交更具可控性，因为它有编辑、撤回、延迟回复的缓冲空间，可以隐藏表情和动作；而线下社交要求即时反应，眼神、语气、微表情全部暴露在外，时刻要面对他人审视的目光和突如其来的提问，且全部无法撤回，容易触发内心对他人评价的恐惧。当人们选择逃避线下社交，并给自己贴上“社恐”的标签，会发生什么？\n\n　　一方面，这个标签可以保护自己，成为心理防御的盾牌。当你不想参与聚餐、想拒绝无意义应酬时，一句“我社恐”可以委婉划清社交边界，获得群体共情。社会认同理论指出，人们会通过群体标签定义自我，当发现“不止我一个人这样”时，个人的羞耻感会被稀释。当“社恐”成为流行身份，你不必再因为“不太会来事”而陷入自我否定。一句“我社恐”，能够帮助我们坦然拒绝消耗型社交，接纳自己不必做八面玲珑的社交达人。\r\n\n　　但另一方面，标签也会有失效的时刻，这也是我们困住自己的开始。比如“我是社恐，所以我一定做不好线下发言，我不要尝试”。此时标签不再是自嘲工具，而是变成了自我限制的枷锁。根据心理学中的“自我实现预言效应”，长期内化的“我不擅长社交”的信念，可能会让人主动回避社交，越回避越紧张，越紧张越回避，陷入恶性循环。或许“社恐”者明明有能力完成沟通，却提前放弃课堂汇报、小组协作、实习面试等机会，因为这个预设标签而主动后退。\n\n　　标签失效的痛苦是真的，社交恐惧的情绪也是真的。但更重要的是分辨：这是“我感到社交恐惧”的自我标签？还是“社交恐惧症患者”的临床障碍？有一个关键的判断标准：这种社交恐惧的情况是否持续至少6个月，并由此造成了显著的痛苦及社会功能的严重受损。或许一位大学新生会因为和同学不熟而躲着走，在群里却聊得火热，这是适应期的正常波动；但如果这种回避持续了大半年，让他无法正常上课、参与小组合作、无法建立任何一段面对面的关系，并且为此持续痛苦时，才是需要被慎重对待的临床信号。\n\n　　分清了自己站在标签“光谱”的哪一段，接下来的问题是：怎样才能和“社恐”标签好好相处？\n\n　　改变的前提不是强迫自己变成“社牛”，而是区分：哪些紧张是正常情绪，哪些是标签带来的自我限制？我们不需要消灭紧张，而要拒绝把自我价值和这个标签绑定。\n\n　　首先，我们可以尝试把身份陈述改写为状态描述。给自己贴上“社恐”标签的人可以试着做语言转换练习，把身份式描述改成场景式描述。比如把“我是社恐，我不擅长社交”换成“在多人聚会的场景，我会感到紧张；在熟悉的小圈子，我可以聊得很好”。标签只用来描述感受，不要用来定义自己。\n\n　　其次，我们可以进行阶梯式脱敏。认知行为疗法框架下的系统脱敏技术，建议我们设置难度阶梯，逐渐积累成功体验。比如最低难度是路上遇到同学简单问好，中等难度是与两三位熟悉的同学聚餐聊天，最高难度是小组汇报。不必因为一次发挥不好就退回线上舒适区。练习的目标不是消除紧张，而是学会在紧张中完成表达。在此过程中，我们可以记录被自己忽略的成功经验，比如“今天我主动和同学打了招呼”。同时也要放下完美社交的执念。对话本来就允许停顿、冷场、局促，旁人并不会时刻紧盯你，你的紧张也不会被无限放大。\n\n　　最后，我们要分清自我标签与临床障碍之间的边界。如果只是在部分社交场景紧张，在熟悉的人面前可以正常交往，那你完全可以保留“社恐”作为自嘲梗，不必逼迫自己彻底消除紧张。但如果几乎所有线下社交都会产生强烈失控的恐惧，伴随持续手抖、心慌、出汗等躯体反应；为了回避社交，放弃小组活动等必要的人际交往，学习和生活明显受影响；这种强烈痛苦持续半年以上，自己反复调节依旧没有改善；因为社交问题长期失眠，伴随持续的情绪低落时，要及时前往学校心理咨询中心或正规医院心理科评估。\n\n　　“社恐”标签是一把双刃剑。它是大学生保护自我的铠甲，接纳窘迫，帮助躲开无效应酬；可一旦固化成对自我的定论，就会变成困住我们的围墙。当“我是社恐”从共情的安慰变成退场的借口，不妨扪心自问：当下的选择，是在保护自己，还是向挑战妥协？\n\n　　黄彬彬 来源：中国青年报\n\n　　2026年11月20日 04版 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf0c3869ebf","title":"中央气象台：未来两天，全国大部降水稀少","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735007.shtml","summary":"中新网11月20日电 据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气。","summary_short":"中新网11月20日电 据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气。","digest":"据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气","points":["中新网11月20日电 据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气","预计20日，山东半岛仍有较强降雪，关注对交通、城市运行、人体健康等的影响","22日起，西南地区东部、江南、华南等地有降雨，东北地区有降雪，关注对交通运输等的影响"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:07:43+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气。预计20日，山东半岛仍有较强降雪，关注对交通、城市运行、人体健康等的影响；22日起，西南地区东部、江南、华南等地有降雨，东北地区有降雪，关注对交通运输等的影响。\n\n　　全国大部降水稀少 山东半岛出现雨雪天气\n\n　　昨日，全国大部地区降水稀少，云南东部和南部、广西南部等地部分地区出现中雨，局地大雨；山东半岛出现小到中雪或雨夹雪，威海局地大到暴雪。内蒙古中东部、东北地区东部和南部、华北、黄淮及青海南部、西藏等地部分地区出现6～8级阵风，局地11级以上。\n\n　　全国大部天气晴好\n\n　　未来两天，全国大部降水稀少。内蒙古中东部、黑龙江中东部、山东半岛东部等地有小到中雪或雨夹雪，其中，山东半岛东部有大到暴雪。西南地区南部、华南等地有小雨，局地有中到大雨。\n\n　　22日至24日，西南地区东部、江南及华南大部有小到中雨，部分地区有大雨；内蒙古东部和东北地区有小到中雪，局地有大雪。23日至24日，受冷空气影响，中东部自北向南先后有4~8℃降温，局地降温10℃，部分地区伴有大风。\n\n　　国内未来三天具体预报\n\n　　11月20日08时至21日08时，黑龙江中东部、内蒙古中部、山东半岛等地部分地区有小到中雪或雨夹雪，其中，山东半岛东部等地局地有大雪或暴雪(10～12毫米)。云南、广西、广东、海南岛、台湾岛等地部分地区有小到中雨，其中，云南西南部等地局地有大雨(25～35毫米)。内蒙古中东部、东北地区东部和南部、山东半岛等地部分地区有4～6级风。东海北部、台湾海峡、巴士海峡、北部湾、南海北部和中部海域将有6～7级风，阵风8级。\n\n全国降水量预报图(11月20日08时-21日08时)图片来源：中央气象台网站\n\n　　11月21日08时至22日08时，黑龙江西北部、山东半岛东北部等地部分地区有小雪。云南、海南岛等地部分地区有小雨。山东半岛、内蒙古东部部分地区有4～5级风。巴士海峡、南海东北部海域将有6～7级风，阵风8级。\n\n全国降水量预报图(11月21日08时-22日08时)图片来源：中央气象台网站\n\n　　11月22日08时至23日08时，内蒙古东北部、东北地区东部、青藏高原北部和东部等地部分地区有小到中雪或雨夹雪，其中，黑龙江西北部等地局地有大雪(5～7毫米)。西南地区东部和南部、江南、华南中西部等地有小到中雨。内蒙古、东北地区南部等地部分地区有4～6级风。巴士海峡、南海东北部海域将有6～7级风，阵风8级。\n\n全国降水量预报图(11月22日08时-23日08时）图片来源：中央气象台网站\n\n 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca0a47a9de4","title":"研究发现：大脑的“青春期”能持续到32岁左右","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735006.shtml","summary":"研究发现：大脑的“青春期”能持续到32岁左右！","summary_short":"研究发现：大脑的“青春期”能持续到32岁左右！","digest":"研究发现：大脑的“青春期”能持续到32岁左右","points":["老话说“三十而立”，作为一个“刻在中国人文化基因里的成长标尺”，在过去的很长时间以来…","很多人说，自己到了30岁“大脑仿佛突然开窍”，知道自己想要什么，该怎么去努力了","但近年来神经科学研究证实，人类大脑的发育并非匀速线性，而是经历多个阶段的非线性变化…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:51:52+08:00","size":1,"keywords":[],"body":"研究发现：大脑的“青春期”能持续到32岁左右！30岁，慌啥子嘛……\n\n　　老话说“三十而立”，作为一个“刻在中国人文化基因里的成长标尺”，在过去的很长时间以来，它都像是悬在二三十岁年轻人心头的一道坎，给大家带来了极大的“人生定型焦虑”，总会让人不自觉陷入“我是不是已经来不及了”的自我怀疑。\n\n　　不过，这两年，一个新的观念正在悄悄流行：\n\n　　30岁，才是真正意义上的18岁。\n\n　　很多人说，自己到了30岁“大脑仿佛突然开窍”，知道自己想要什么，该怎么去努力了。\n\n图片来源于网络\n\n图片来源于网络\n\n　　如果你也有类似的感觉，那么恭喜你！这并不是错觉，而是有科学根据的——\n\n　　传统观念认为成年后大脑发育停止，能力发展进入“下坡路”。但近年来神经科学研究证实，人类大脑的发育并非匀速线性，而是经历多个阶段的非线性变化，32 岁才是大脑真正完成结构优化、进入成熟稳定模式的关键节点[1]。\n\n　　研究发现：9-32岁\n\n　　加长版的“青春期大脑”\n\n　　剑桥大学领衔的科研团队发表在《自然·通讯》的研究，通过分析3802名从新生儿到 90岁老人的MRI扩散扫描成像数据，首次绘制了人类大脑一生的发育全景图。\n\n　　研究发现，人类大脑并非在18岁成年后就停止发育，而是经历5个明确的发展阶段，且存在4个改写大脑运行模式的关键转折点，分别为9岁、32岁、66岁和83岁。\n\n　　其中，9-32岁这一阶段是最颠覆传统认知的发育周期。\n\n　　传统观点认为青春期在18岁结束，但神经科学研究证实，大脑的结构优化会持续到32岁。此阶段的核心变化是白质的持续生长——白质作为大脑的“信息高速公路”，负责不同脑区间的信号传递，其髓鞘化程度直接决定神经信号的传递效率[2-3]。\n\n　　从9岁到32岁，大脑的神经连接网络不断精细化，信号传递路径更短、速度更快，认知能力稳步提升，逻辑思维、决策能力、情绪调控能力逐渐成熟。\n\n　　32岁是这一阶段的关键转折点，此时大脑的神经连接方向与整体轨迹发生最大幅度的转变，标志着“青少年式”的脑结构重组彻底结束，大脑正式切换到成年模式。\n\n　　过往的研究也证实，掌管决策、自控和逻辑思考的前额叶皮层，会延续到第三个十年才真正发育成熟，这也是为什么我们总觉得二十多岁的人更容易出现情绪波动、冲动决策的情况。此前的所有经历都不是人生的“最终结果”，而是神经发育的“压力测试”，是为后续的爆发式成长积蓄能量。\n\n　　别再为“社会时钟”焦虑了\n\n　　你的大脑有无限可能\n\n　　其实，即便是三十多岁以后，大脑也不会“停止成长”。\n\n　　研究显示，大脑的神经可塑性贯穿一生，32-66岁的成年期，更是大脑认知储备积累的关键阶段。所谓认知储备，就是大脑通过长期学习、经验沉淀形成的“神经护城河”，能有效抵御衰老带来的认知衰退。\n\n　　所以，与其为结婚、买房、事业定型等所谓的“30岁人生标尺”焦虑，不如主动为大脑“升级”，让我们在迎来“大脑进入衰老阶段的第一个节点”之前，更加从容。\n\n　　1 主动构建神经连接，\n\n　　用终身学习激活潜力\n\n　　持续学习是大脑的“保鲜剂”，能不断建立新的突触连接，延缓功能衰退。我们的学习，不光是“应试技能”，更应该包括“系统性成长”：\n\n　　·刻意练习与深度思考：针对专业领域进行针对性训练，避免低效率的重复劳动，通过拆解问题、复盘总结，强化前额叶皮层的逻辑思维能力；\n\n　　·跨领域学习：不同领域的知识能够激活大脑的多个脑区，建立跨区域的神经连接，提升思维的灵活性。例如学习编程时交替进行阅读文学作品，能够同时强化逻辑思维与创造力；\n\n　　·保持文字输入与输出：阅读、写作、做笔记等行为能够持续刺激大脑的语言中枢，维持神经连接的活跃度。手写笔记相较于电子记录，能够更有效地激活大脑的记忆区域，提升知识留存率。\n\n　　2 锻炼大脑“硬件”，\n\n　　优化生活方式\n\n　　大脑的高效运转，离不开健康的身体基础：\n\n　　·规律运动：每周至少进行150分钟中等强度有氧运动，如快走、游泳、太极拳，能够促进脑部血液循环，增加脑血流量，刺激脑源性神经营养因子的分泌，助力神经元修复与再生。每周2-3次的抗阻训练，如举哑铃、弹力带训练，能够改善全身代谢，降低脑血管疾病风险；\n\n　　·优化饮食结构：多摄入绿叶蔬菜、浆果、全谷物、深海鱼，减少红肉、油炸食品与精制糖的摄入。这类食物能够提供不饱和脂肪酸、抗氧化物质，减少脑部氧化应激与炎症反应，延缓认知衰退；\n\n　　·保障高质量睡眠：每天保证7-8小时的规律睡眠，睡眠时大脑会清除日间积累的代谢废物，如β-淀粉样蛋白，这是与阿尔茨海默病相关的神经毒素。睡前避免使用电子屏幕，可通过泡脚、听轻音乐提升睡眠质量。\n\n　　3 激活社交与情绪\n\n　　给大脑“软件优化”\n\n　　社交互动与情绪健康是维持大脑功能的重要因素。积极参与社交互动(社区活动、亲友聚会)，能够刺激大脑的语言中枢与情感中枢，减少孤独感与抑郁风险。\n\n　　同时，长期的焦虑、高压状态会导致皮质醇水平升高，损伤海马体等记忆相关脑区，因此需要通过冥想、深呼吸、正念练习等方式调节情绪，必要时寻求专业心理帮助。\n\n　　读完这篇文章，希望你可以不必被“三十而立”的传统观念束缚，不必因暂时的挫折否定自我。凤梨罐头会过期，但人生没有“过期日”，大脑的潜力从不因年龄设限，无论哪个年纪，你的每一次学习、每一次坚持，都是在给人生“加分”。\n\n　　所谓“最好的时光”，从来不是过去，而是你愿意开始改变的此刻。\n\n　　策划制作\n\n　　作者丨钱雨 北京市第八中学教师、基因组学博士\n\n　　审核丨李旭 中国科学技术大学副教授、中国生物化学与分子生物学会会员\n\n　　策划丨杨雅萍\n\n　　责编丨王梦如\n\n 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2b0b42cf62","title":"医美逐渐低龄化，“变美”风险不容忽视","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735001.shtml","summary":"近年来，各大医院的整形美容科门诊多出不少稚嫩面孔。","summary_short":"近年来，各大医院的整形美容科门诊多出不少稚嫩面孔。","digest":"近年来，各大医院的整形美容科门诊多出不少稚嫩面孔","points":["近年来，各大医院的整形美容科门诊多出不少稚嫩面孔","割双眼皮、打瘦脸针、填充玻尿酸……这些需谨慎对待的医疗美容项目，正被越来越多大学生…","部分向往医美的青少年，审美偏向所谓“漫画脸”“网红脸”"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:40:15+08:00","size":1,"keywords":[],"body":"近年来，各大医院的整形美容科门诊多出不少稚嫩面孔。割双眼皮、打瘦脸针、填充玻尿酸……这些需谨慎对待的医疗美容项目，正被越来越多大学生、未成年人提上日程。半月谈记者调查发现，医美低龄化趋势明显，容貌焦虑与违规营销共存，“变美”风险不容忽视。\r\n\n　　未成年人医美热存在认知误区\n\n　　今年暑假，16岁的高中生肖欣(化名)用两个月时间“逆袭大换脸”——开眼角、做双眼皮、打玻尿酸，以一张“新面孔”迎接新学期。\n\n　　这样的案例并不鲜见。大连市第四人民医院烧伤创面科主任、瘢痕整形与医疗美容科负责人王德宇告诉半月谈记者，近年来，18周岁以下的求美者数量持续攀升，初中、高中在校生咨询、预约整形人数逐年上涨，艺术特长生、播音表演类考生占未成年整形咨询人群的比例较高。“从‘毕业后求职整形’变为‘入学前整形’，医美逐步被当作升学、艺考面试的前置准备。”王德宇说。\n\n　　部分向往医美的青少年，审美偏向所谓“漫画脸”“网红脸”。受访医生指出，有的青少年通过手术将下眼睑向下延伸，使眼睛留白增多，像漫画人物的眼睛，但在医美机构手术后出现巩膜外露，导致干眼症或流泪不止；有的拿着高度美颜的“网红”照片、AI生成的虚拟人物图片来就诊，要求“照着这个样子给我做”。\n\n　　沈阳市第七人民医院美容整形科主任田雅光表示，未成年人对医美整形的风险认知不足。“一些学生把医美等同于‘护肤、化妆’，将注射美容、激光美容视为‘生活类美容’，低估手术创伤及远期后遗症风险，轻信了机构‘微创、零风险’的宣传。”\n\n　　“18岁以前是生长发育的关键阶段，尤其是面部的骨骼，包括鼻骨、上下颌骨仍在发育，过早做隆鼻、下颌手术等，会随着骨骼发育出现假体移位、五官不对称、咬合紊乱等远期并发症，后期修复难度大，费用也高。”大连理工大学附属中心医院整形科主任王琳说。\n\n　　未成年人的整形和医美需求应分类讨论。王琳表示，以治疗为目的的整形修复手术需要尽早进行。例如，各种瘢痕、先天性的血管瘤和黑毛痣、影响功能和视力的中重度上睑下垂等问题，如果延误治疗，不但会错失治疗时机，还可能影响未成年人的心理发育。但单纯以变美为目的的整容或医美项目，建议等到18岁以后再考虑。\n\n　　对于大众认知中门槛较低的医美项目，未成年人也应慎重考虑。不当注射肉毒素、玻尿酸，可能干扰面部神经、肌肉的正常发育；违规注射生长因子、奥美定等物质，易导致组织肿胀、血管栓塞、皮肤坏死，甚至造成失明、面瘫等严重后果。\n\n　　违规营销瞄准青少年，“监护人同意”形同虚设\n\n　　有医生表示，面对盲目求美的未成年群体，医生一般会劝退，但他们被拒后，可能会另选其他民营医美机构。\n\n　　有的机构专门推出针对中学生的“假期焕颜计划”，用“暑期特惠”“学生认证享折扣”等策略吸引未成年人；有的机构在社交平台上发帖推广，评论区里“16岁可以打瘦脸针吗”“14岁可以做吗”等询问层出不穷，机构纷纷给予肯定回复。\n\n　　《医疗美容服务管理办法》规定，执业医师对就医者实施治疗前，必须向就医者本人或亲属书面告知治疗的适应症、禁忌症、医疗风险和注意事项等，并取得就医者本人或监护人的签字同意。\n\n　　当半月谈记者以16岁青少年的身份在社交媒体上联系多家医美机构，均得到“有监护人同意就可以”的回复。进一步沟通发现，所谓“监护人同意”，在实践中有不小操作空间。\n\n　　如果监护人不能到场，有的机构只需未成年就医者携带户口本或留下父母联系方式即可；有的机构仅需提供父母同意的文字、录音等即可。“这些文字或录音是否真的是未成年人父母所留，机构也不会去辨别，仅仅是走个过场。”一位从业多年的医美机构负责人坦言，“监护人同意”在实际执行中容易沦为形式。\n\n　　认准“三证”，更要树立健康审美观\n\n　　田雅光有时会接诊因在“黑诊所”手术失败而前来求治的青少年。她表示，一些寻求修复的年轻人，因容貌焦虑放大所谓的“瑕疵”，最初只是进行了一项简单的医美，但此后像打开了“潘多拉魔盒”，陷入修复漩涡。\n\n　　田雅光表示，需要警惕一些藏身于居民楼、写字楼的“美丽陷阱”。一些美甲美睫店、私人美容工作室，在没有资质的情况下擅自开展注射美容、激光祛斑等医疗美容项目，存在较大风险。\n\n　　多位医学专家提醒，做任何医美项目，都要认准“三证”，即机构、人员、产品均需“持证上岗”。根据《医疗美容服务管理办法》，开展医美项目的机构必须取得《医疗机构执业许可证》，操作人员需具备执业医师资格和临床经验，美容医疗机构使用的医用材料须经有关部门批准。\n\n　　消费者可在国家卫健委、当地卫健委官网、全国医疗机构查询系统核验机构备案信息、项目备案范围。同时，可以向医美机构索要所用填充材料及其他高值药械产品的合格证、溯源码等，还要注意留存接受服务前后的对比照片、费用支出凭据、签名文书等相关材料。\n\n　　专家表示，治理医美低龄化乱象，一方面要加强医疗美容广告监管，依照广告法第九条第七项，将突出制造容貌焦虑的宣传内容认定为违背社会良好风尚，依法施以罚款等惩罚，同时建立全国统一的医美机构信用档案，明确记录机构接纳未成年人、协助造假的失信行为；另一方面要树立健康的审美观念，将健康审美教育纳入中小学心理健康课程，通过案例讲解、主题班会等形式引导未成年人理性看待外貌。\n\n　　半月谈记者：孙仁斌 刘艺淳 赵泳\n\n　　原标题《警惕医美低龄化别让花样年华被“容貌焦虑”绑架》 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb70ccb46de","title":"“互联网+AI监管”24小时全自动巡检 餐饮后厨有了智慧眼","url":"https://www.chinanews.com.cn/sh/2026/11-20/10734998.shtml","summary":"餐饮后厨有了智慧眼(大国小家)  　　“舌尖安全”“外卖安全”是大众持续关切的民生问题。","summary_short":"餐饮后厨有了智慧眼(大国小家)  　　“舌尖安全”“外卖安全”是大众持续关切的民生问题。","digest":"餐饮后厨有了智慧眼(大国小家)  　　“舌尖安全”“外卖安全”是大众持续关切的民生问…","points":["餐饮后厨有了智慧眼(大国小家)","“舌尖安全”“外卖安全”是大众持续关切的民生问题","市场监管总局试点推进“互联网+AI(人工智能)监管”…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T07:32:27+08:00","size":1,"keywords":[],"body":"餐饮后厨有了智慧眼(大国小家)\n\n　　“舌尖安全”“外卖安全”是大众持续关切的民生问题。但餐饮后厨操作不规范、食材过期、冷链失控等风险隐蔽性强，传统监管多依靠现场抽检、群众举报，问题发现滞后。\n\n　　市场监管总局试点推进“互联网+AI(人工智能)监管”，部分地区依托智能识别技术自动捕捉违规风险，实现隐患提前预警。AI开始嵌入食品安全监管全链条。新模式如何补齐传统监管短板，推动食品安全治理关口前移？记者进行了采访。\n\n　　“互联网+AI监管”能对餐饮后厨24小时全自动巡检\r\n\n　　“这家店评出来是65分，主要问题是，灶台表面有大量的深色油污，灶台下面有一个垃圾桶没有加盖，员工操作时，头发外露，没有戴工作帽。”浙江省市场监督管理局餐饮服务食品安全监督管理处副处长鲁捷盯着屏幕向记者介绍。\n\n　　这是记者在浙江网络餐饮“AI+非现场监管”驾驶舱看到的演示。“AI+非现场监管”系统启动以后，AI就实时对浙江全省的19万多家商户进行随机抽取。鲁捷说，“比如这家店，打分后系统会把抓拍的图片、总体评价和改进建议，以短信的形式发送到商户的手机上，督促改进。”\n\n　　去年11月，浙江省市场监督管理局推出“AI+非现场监管”系统，目前已运行一年。这套“AI+非现场监管”系统可以对后厨抓拍，进行静态集成评分，并自动生成整改意见实时推送给商户。同时，还能动态捕捉监控画面中包括夜间出现鼠迹、猫狗闯入、洗菜池洗拖把等12种违规问题，自动抓取、切片、固证后，实时推送给监管人员，实现24小时全自动巡检。\n\n　　目前，“AI+非现场监管”系统已覆盖浙江全省所有的外卖商户，累计巡检460余万家次，抓拍鼠迹、从业人员违规行为视频1.3万余例，60分以下商户从近29%降至4%以下。鲁捷介绍，对于60分以下的商户，通过短信和AI呼叫，让商家自主整改，两次不整改的会推给监管人员上门进行监管。比如杭州萧山美霞小吃店，今年3月18日、21日AI抓拍均为59分，2次短信推送后商户自主整改，后厨环境有了明显改善，3月23日AI抓拍达到75分。\n\n　　在市场监管总局指导下，多地市场监管部门依托“互联网+AI”技术试点推进食品安全智慧监管。中国消费者报社调研显示：湖北、北京、浙江等地搭建AI明厨亮灶、阳光智厨系统，依托智能摄像头24小时不间断巡检后厨，自动识别未佩戴工帽、生熟混放、环境卫生不达标等违规行为，形成“AI巡查—预警推送—商户整改—复核销号”闭环管理；江苏、福建运用AI开展食品标签智能预审，大幅压缩标签合规审核时长，从源头降低标签违法风险；天津、广西打通政企数据，联动外卖平台排查网络餐饮隐患，吸纳外卖骑手等社会群体以食安监督员等身份参与社会共治。\n\n　　“从‘明厨亮灶’到‘互联网+明厨亮灶’，再发展到‘互联网+明厨亮灶+AI监管’，AI的嵌入进一步提高了监管效率，过去只是能看到画面和人工核查，现在能通过算法发现一些问题，包括AI自动巡检、抓拍和预警。”中国人民大学食品安全治理协同创新中心研究员孙娟娟说，“这让非现场检查更有操作性，有助于优化有限行政资源的配置，地方政府也基于此给加入明厨亮灶的入网经营者提供行政便利，比如对加装后未发现问题的餐饮店减少检查频次，联动平台对合规商家进行流量倾斜和宣传曝光，这对商家也是一种激励。”\n\n　　提升对“幽灵外卖”“无堂食外卖”的监管效率\n\n　　面对海量的外卖商户，“AI+非现场监管”系统能否发挥更大作用？\n\n　　记者走进杭州外卖商户最密集的区域——萧山区，该区现有网络餐饮商户7300余家。“我们局能够从事餐饮监管的工作人员只有58人，此前一直面临着网络餐饮食品安全‘管不过来、管不到位、管不长久’的困境。”杭州市萧山区市场监督管理局局长吕意说，“‘AI+非现场监管’系统帮我们解决了大问题。”\n\n　　强化网络餐饮食品安全监管要铲除平台上那些租借证照、使用虚假地址，甚至伪造证照的“幽灵外卖”。这些店铺多以低廉的价格吸引消费者，但其后厨往往存在环境脏乱差、食材来源不明、加工操作不规范等问题。\n\n　　浙江的“AI+非现场监管”系统跟三大外卖平台打通数据接口，能自动对全省19万多家外卖商户的证照进行校验与比对，比对成功的商户，平台能够调用电子证照在平台上进行公示，杜绝“幽灵外卖”。\n\n　　随着外卖产业的发展，出现了只做外卖、不提供现场就餐的“无堂食外卖”，其经营场所通常隐蔽、规模小、变动频繁，是网络餐饮食品安全投诉高发领域。\n\n　　浙江没有采取“一刀切”关停的简单做法，在全国首创“无堂食外卖”聚集区“管理方+商户”自治管理模式，推动商户由分散隐蔽转向组团发展、由无人监管转向专业管护，从源头治理。\n\n　　比如位于萧山区的“不难食集”是“无堂食外卖”聚集区，曾被许多人视为食品安全治理的“隐秘角落”。今年以来，萧山区创新构建商户自治、平台主治、属地常治、部门综治、清风督治、社会共治的“六治协同”治理体系，推动网络餐饮食品安全持续规范、常态长效。“不难食集”通过墙面地面翻新、管线隐形、档口统一、增设共享仓库，实现从“脏乱差”到“洁净美”的转变。\n\n　　记者看到橙色烤漆棚架、雕花护栏和防滑木纹地板构成了小哥驿站，进入室内，商户门口是标准化的不锈钢取餐窗口，再进入商户后厨，则能看到摄像头接入“AI+非现场监管”系统。在“不难食集”经营肉蟹煲店的赵子明说，“装上摄像头能让消费者看到食品加工过程，增加对我们的信任。”\n\n　　萧山区对接外卖平台，建立网络餐饮食品安全违规行为分级惩戒机制，明确限流、置休、下架三级惩戒标准，今年以来累计通告平台下架外卖商户160家。\n\n　　浙江省市场监督管理局与外卖平台建立信用信息双向共享互认机制，将商户评价结果推送至外卖平台、纳入商户服务评分体系，并与平台流量分配、活动参与资格挂钩。比如美团对杭州“无堂食外卖”聚集区38家管理规范、信用良好的商户给予平台流量激励。\n\n　　国家食品质量检验检测中心副主任程劲松建议，外卖平台可以对商户进行分级，没有明厨亮灶的，有明厨亮灶的，还有在明厨亮灶的基础上增加其他服务的，等等，让消费者按需选择，更明白地消费，让规范经营的商家获得正向回报。\n\n　　全面推行尚面临AI能力迭代、成本分担等挑战\n\n　　“冰箱上如果盖个被子，AI就会将其识别成床铺。”“AI能识别老鼠、猫狗，但对非法添加的物料无法识别。”“AI受光线、遮挡、角度变化影响，识别上还会有误差，能力仍在进阶当中。”……多位专家表示，AI大模型的识别准确度还需要时间训练，潜力仍然很大。\n\n　　用“互联网+AI监管”赋能餐饮食品安全监管是一个方向，但全面推广仍面临一些挑战。中国农业大学食品科学与营养工程学院副教授朱毅说：“从实际落地看有一定难度，要钱、要设备、要人工、要时间，还要观念更新，一环都不能少。”\n\n　　安装摄像头需要多少成本？杭州萧山区黄力成面馆最近要做网络餐饮，安装了中国电信的明厨亮灶，套餐包年360元，免费送一个摄像头。中国饭店协会副会长宋小溪介绍：“我们在行业调研中了解到，摄像头本身100多元比较正常，加上流量费、存储费，较便宜的一年200多元，较贵的400多元。这对利润微薄的中小商家而言是一笔需要认真权衡的开支。”\n\n　　安装成本、流量费用等由谁承担？牵涉商户、运营商、平台等多方。有的运营商根据商户情况提供包宽带、手机流量套餐，免费提供摄像头。有的地方运营商与银行合作，商户开通账户或贷款，银行为部分商户免费提供摄像头。对已有宽带，只安装摄像头的，运营商针对不同使用期限，每年费用200至400元。“平台70%以上是中小微商家，设备采买、数据存储、网络流量这三项成本是每年需要持续投入的，我们对残疾人创业者、放心消费商家等特定群体有公益帮扶措施。”淘宝闪购食安总监田西艳介绍。\n\n　　对有一定规模的餐饮连锁店来讲，明厨亮灶是门店管理的一个抓手。花小小品牌联合创始人王宁介绍，“我们安装摄像头的门店将近3600家，每家装三个摄像头，一个在前厅、两个在后厨，后厨一个是固定机位，另外一个由总部做统一AI数字化管理，每15分钟调整一次角度，既可以对门店做督导、做品控，也让消费者安心。”\n\n　　“互联网+AI监管”仍处在培育期，面临AI能力迭代等挑战。科信食品与健康信息交流中心主任钟凯认为，这是鼓励商家透明化经营、增进消费者信任的“加分项”，也是一项需要长期培育、循序渐进的工作。\n\n　　本报记者 刘军国 林丽鹂 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8c3733466f","title":"病房變身「遊樂場」和「茶居」 靈實醫院打破住院悶局｜醫言九龍東","url":"https://news.tvb.com/tc/1207194-病房變身遊樂場和茶居靈實醫院打破住院悶局醫言九龍東","summary":"住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲？這並非天方夜譚！","summary_short":"住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲？","digest":"住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲","points":["住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲","靈實醫院老人科每隔一個星期日，都會將病房化身成「遊樂場」，讓一班長期住院的長者…","靈實醫院內科部門運作經理蔡月菊說，為病人帶來有溫度的陪伴，與適切治療同樣重要"],"section":"民生","category":"專欄來論","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:00+08:00","size":1,"keywords":[],"body":"住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲？這並非天方夜譚！老友記最開心的就是聚在一起熱熱鬧鬧。靈實醫院老人科每隔一個星期日，都會將病房化身成「遊樂場」，讓一班長期住院的長者，趁周末鬆鬆筋骨，亦趁機會與家人聚天倫。\n\n靈實醫院內科部門運作經理蔡月菊說，為病人帶來有溫度的陪伴，與適切治療同樣重要\n\n醫護自發籌辦　打破病人長期住院悶局\n\n靈實醫院內科部門運作經理蔡月菊表示，病房由2023年11月起，每隔一個星期日都會舉辦「耆樂星期天」活動，醫護人員會設計各類遊戲、工作坊等讓臨床情況穩定的住院長者參加。活動最初由醫護人員自發舉辦，希望讓長期住院長者保持社交，改善活動不足的問題，亦能為他們送暖。現時「耆樂星期天」已成為病房恆常而且非常受歡迎的活動。\n\n引入懷緬治療　「快樂茶居」重溫飲茶樂\n\n團隊在設計活動時，除了會按病人的需要及喜好，更引入懷緬治療元素。例如將病房位置改造成「快樂茶居」，營造熟悉的環境，讓長者重溫以往周末到茶樓「一盅兩件」的感覺。長者們一邊食得開心，與院友坐下來相聚又笑得開懷，患認知障礙的長者也能梳理自己的回憶，改善病情。\n\n團隊將病房改造成「茶居」，長者住院都可以飲茶吃點心\n\n多感官刺激遊戲　寓復健於娛樂\n\n為了幫助病人提高對復健的積極性，尤其令患有認知障礙症的長者，有動腦筋的機會，團隊設計的遊戲都會透過多感官刺激，例如視覺、觸覺、聽覺等，考驗手眼協調及反應，加強認知能力的同時，亦鍛鍊肌肉。最受長者歡迎的遊戲包括有挑戰用筷子，精準夾起乒乓球，再將乒乓球貼在膠紙上，增加遊戲難度；長者亦喜愛用器具捉道具蜜蜂及採花；又有常見於嘉年華，結合運動技巧與策略思維的經典攤位遊戲 ── 擲波「過三關」，由小朋友、大人到長者都一樣受歡迎及好玩。病人都玩得非常投入，更有老友記不停高呼「很開心」、「好好玩」，他們和家人都感謝醫護人員的無私付出和心思。\n\n長者要將五顏六色的乒乓波夾起貼在膠紙上，考驗手眼協調\n\n節日應節工作坊　促成醫患與家人共融\n\n除了遊戲及茶居等活動，團隊也會趁不同節日應應節，例如醫護人員和老友記一同寫揮春迎接農曆新年；中秋時製作燈籠、食月餅；聖誕節就製作愛心手工花、聖誕樹。長者即使住院亦感受節日氣氛，也能與醫護人員、住院老友記及家人一同歡度佳節，共同創造美好回憶。\n\n醫護人員趁節日舉辦活動與病人一同歡度佳節\n\n99.6%滿意度　見證「有溫度的陪伴」\n\n「耆樂星期天」至今已超過500人次參與。病房訪問參加活動的病人，99.6%病人都很享受「耆樂星期天」的遊戲及活動。蔡月菊憶述有一位病人平時不發一言，但參加活動後變得非常開朗，甚至主動與醫護人員打開話匣子。病人態度的轉變令團隊深信，為病人帶來有溫度的陪伴，與適切的治療同樣重要。\n\n看到參加「耆樂星期天」的病人展露笑容，正是醫護人員全心付出的最大動力\n\n她形容活動也營造了病房的正向文化，感染醫護人員更多主動關心病人，在專業服務上加添一份窩心。團隊未來會繼續透過關懷病人的活動，令更多住院病人都感到溫暖，與他們一同走過抵抗病魔之路。\n\n本文僅代表作者觀點，不代表無綫新聞立場。","image":"https://pro-vod-cdn.tvb.com/55d31dd12ea4405284741a8518b9eed3/snapshots/e97036b8ee04445688ece36b8517d00d-00008.jpg","video":"https://pro-vod-cdn.tvb.com/55d31dd12ea4405284741a8518b9eed3/921168e4f22e475db5052e9d31d78e24-38b43971f1cfd66e0781e214f595dba0-sd.m3u8","video_poster": er":"https://pro-vod-cdn.tvb.com/426f9959ee8349788092ad52a50ca6d0/snapshots/f56c05922cd044b8b6d9485d5192063b-00005.jpg","lang":"zh-Hant","items":[{"title":"Anthropic首日掛牌 成為全球第12大市值公司","url":"https://news.tvb.com/tc/1207360-Anthropic首日掛牌成為全球第12大市值公司","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T06:55+08:00","category":"財經","digest":"美國人工智能公司Anthropic，首日於納斯達克市場掛牌…"},{"title":"Anthropic首日於納斯達克掛牌","url":"https://news.tvb.com/tc/1207346-Anthropic首日於納斯達克掛牌","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T00:16:00+08:00","category":"財經","digest":"美國人工智能公司Anthropic，首日於納斯達克掛牌"}]},{"id":"ccdad83a1d7","title":"数字平台、新能源货车进入运输场景，公路货运迎来新变化","url":"https://www.jiemian.com/article/15354142.html","summary":"中国物流与采购联合会今天（10月20日）在2026物流平台与运力发展推进会上发布的最新报告显示，今年以来我国公路货运行业运行环境出现一些新的变化。","summary_short":"中国物流与采购联合会今天（10月20日）在2026物流平台与运力发展推进会上发布的最新报告显示…","digest":"中国物流与采购联合会在2026物流平台与运力发展推进会上发布的最新报告显示…","points":["中国物流与采购联合会今天（10月20日）在2026物流平台与运力发展推进会上发布的最新报告显…","数字货运平台在货源组织、交易撮合、结算服务等环节的服务不断拓展加深","新能源货车加快进入运输场景，续航能力、充电效率和补能设施成为运营中需要关注的新因素"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T11:40:22+08:00","size":1,"keywords":[],"body":"中国物流与采购联合会今天（10月20日）在2026物流平台与运力发展推进会上发布的最新报告显示，今年以来我国公路货运行业运行环境出现一些新的变化。数字货运平台在货源组织、交易撮合、结算服务等环节的服务不断拓展加深。与此同时，新能源货车加快进入运输场景，续航能力、充电效率和补能设施成为运营中需要关注的新因素。\n\n报告指出，数字货运平台使用进一步普及，数字货运平台在弥补自营司机货源不足、交易纠纷留痕处理方面发挥了积极作用。调查数据显示，有近八成的货车司机使用过数字货运平台。除了寻找货源之外，货车司机对于数字货运平台增值服务的使用呈现明显的集中化特征。其中使用加油服务的占比48.83%，运费结算服务的占比46.75%，显著高于其他服务，表明日常运营支出与运费收付仍是平台增值服务的主要使用场景。同时，平台在交易规则完善、司机参与机制方面仍有改进空间。\n\n据中国物流与采购联合会副会长杨国栋介绍，我国公路货运在全球公路货运市场中占有重要地位。2025年，全国营业性货运量587亿吨，其中公路营业性货运量432.88亿吨，占比超过七成。全国约3800万货车司机常年从事道路货运服务，近七成的货车司机主要从事跨省或全国运输，是保障产业链供应链稳定运行的重要力量。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1e9168e4ac","title":"A股午评：深成指、创业板指跌均超2%，CPO、贵金属、国防军工等概念走弱","url":"https://www.jiemian.com/article/15354107.html","summary":"11月20日，A股三大指数早盘集体下跌，截至午间收盘，上证指数跌1.57%，深证成指跌2.05%，创业板指跌2.08%；北证5 e/15354056.html","summary":"11月20日，A股畜牧板块盘中探底回升。","summary_short":"11月20日，A股畜牧板块盘中探底回升。","digest":"11月20日，A股畜牧板块盘中探底回升","points":["11月20日，A股畜牧板块盘中探底回升","截至11时14分，中证畜牧涨0.21%，此前一度跌1.99%","畜牧养殖ETF招商(516670)随指数深蹲起跳"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T11:31:28+08:00","size":1,"keywords":[],"body":"11月20日，A股畜牧板块盘中探底回升。截至11时14分，中证畜牧涨0.21%，此前一度跌1.99%；畜牧养殖ETF招商(516670)随指数深蹲起跳。成分股中，金新农涨9.94%、6天3板，唐人神涨3.91%、天邦食品涨3.03%、正邦科技涨2.78%、新五丰涨2.23%、巨星农牧涨1.63%、立华股份涨1.59%，而牧原股份仅涨0.43%、温氏股份跌0.91%。截至11月19日，该基金年内累计净流入超9.8亿元。\n\n消息面上，中秋国庆后全国生猪均价由10.7-10.8元/公斤回落至8.5-8.7元/公斤，低于行业最低现金成本；行业已连续4个季度亏损、头均亏损300-400元。11月7kg断奶仔猪价降至70-86元/头，跌破2021年10月约92元/头前低。三季度末全国能繁母猪存栏3602万头、环比降4.7%，10月去化延续。\n分析指出，这轮下跌的性质已经变了：猪肉价格跌破行业最低现金成本，意味着从“亏利润”进入“亏现金”阶段，而现金亏损会强制低效产能退出，比亏利润阶段的去化更刚性、更不可逆。最硬的信号是仔猪价格——70-86元/头跌破2021年10月的前低，仔猪代表补栏意愿，价格跌破成本线说明中小散户的扩产冲动被彻底打消，供给端的增量源头被掐断。按约10个月传导周期，能繁去化会在2027年下半年反映到供给端。盘面上，金新农6天3板、唐人神涨超3.9%，而龙头牧原仅涨0.43%、温氏反跌0.91%，这个结构说明资金买的不是当期业绩，而是去化弹性——成本线越高的产能越可能被迫退出，越能受益于供给收缩后的价格弹性。金新农这类连板走势，是资金对去化预期的集中表达。\n据了解，畜牧养殖ETF招商(516670)跟踪中证畜牧养殖指数，成分覆盖生猪养殖、饲料、疫苗与肉制品全链条，其中与养猪相关概念成分股权重合计约66%，管理费0.20%/年、明显低于同类常规水平。但需注意，冻品库容率仍处31.23%高位，12月供大于求的格局尚未逆转，去化预期能否持续兑现有待观察；金新农6天3板属短线资金推动，情绪退潮后回撤风险较大，中小养殖股现金流风险会先于弹性释放，可结合自身风险承受能力审慎关注，不宜将单日盘中反转与连板炒作简单外推为周期拐点的确认。\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n金新农6天3板！畜牧养殖ETF招商(516670)应声翻红！近10亿资金年内加仓，买的是什么？\n\n11月20日，A股畜牧板块盘中探底回升。截至11时14分，中证畜牧涨0.21%，此前一度跌1.99%；畜牧养殖ETF招商(516670)随指数深蹲起跳。成分股中，金新农涨9.94%、6天3板，唐人神涨3.91%。\n\n原创新闻有连云 · 2026/11/20 11:31来源：界面新闻\n\n11月20日，A股畜牧板块盘中探底回升。截至11时14分，中证畜牧涨0.21%，此前一度跌1.99%；畜牧养殖ETF招商(516670)随指数深蹲起跳。成分股中，金新农涨9.94%、6天3板，唐人神涨3.91%、天邦食品涨3.03%、正邦科技涨2.78%、新五丰涨2.23%、巨星农牧涨1.63%、立华股份涨1.59%，而牧原股份仅涨0.43%、温氏股份跌0.91%。截至11月19日，该基金年内累计净 海洋投融资精准效能。\n\n　　自然资源部海洋战略规划与经济司副司长 陈正：在内容设计上，新版《目录》兼顾实用性与前瞻性。实用性方面，充分贴合企业生产经营实际与产业链上下游发展需求，整合合并关联性较强的产业条目，让投融资导向更加精准清晰。\n\n　　《目录》可为沿海地方谋划海洋产业、搭建投融资项目库提供依据，引导投资主体优化资产配置，推动金融机构创新海洋特色金融产品，为企业布局海洋未来产业指明方向。\r\n\n　　陈正：自然资源部将持续做好《目录》落地后的跟踪评估工作，强化多部门协同联动，持续健全完善海洋产业投融资政策支撑体系，稳步推进海洋产业投融资结构优化升级，持续赋能海洋实体经济高质量发展。\n\n　　(总台央视记者 梁丽娟 邵海成) 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c714744bd5d","title":"闪电快讯｜方程豹钛9上市：首搭DMS超级混动全能平台，折叠方向盘量产上车","url":"https://www.jiemian.com/article/15354043.html","summary":"11月19日，方程豹钛9正式上市，官方指导价27.99万元起，置换价27.39万元起。","summary_short":"11月19日，方程豹钛9正式上市，官方指导价27.99万元起，置换价27.39万元起。","digest":"11月19日，方程豹钛9正式上市，官方指导价27.99万元起，置换价27.39万元起","points":["11月19日，方程豹钛9正式上市，官方指导价27.99万元起，置换价27.39万元起","新车共推出三个版本，售价区间为27.99万至32.99万元","作为大型六座旗舰SUV，钛9首搭比亚迪DMS超级混动全能平台…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T11:29:09+08:00","size":1,"keywords":[],"body":"11月19日，方程豹钛9正式上市，官方指导价27.99万元起，置换价27.39万元起。新车共推出三个版本，售价区间为27.99万至32.99万元。作为大型六座旗舰SUV，钛9首搭比亚迪DMS超级混动全能平台，顶配折叠智舱版则率先搭载比亚迪折叠方向盘并实现量产交付。\n\nDMS超级混动全能平台是此次发布的重点动力技术。比亚迪将其定义为面向全工况、全场景、全地形的混动平台，名称中的“S”代表“SUPER”。与此前分别侧重节能、性能和越野的DM-i、DM-p、DMO不同，DMS希望整合三套技术体系的核心优势，在能耗、动力、操控和安全之间取得平衡。对于车长约5.3米的大型SUV，这套平台还需兼顾城市、高速及复杂路况下的操控能力。\n\n方程豹汽车总经理熊甜波在发布会上介绍，DMS的一项核心技术，是通过后驱单电机独立调配左右车轮扭矩，并结合智能矢量扭矩控制，使车辆获得差速器、差速锁、电子限滑和轮端解耦等能力。比亚迪希望通过电机控制与整车协同，实现更精细的动力分配，兼顾动力输出、脱困能力和能量利用效率。\n\n动力方面，钛9搭载1.5T插混专用发动机和前后双电机，双电机总功率400千瓦，零百加速4.8秒。车辆配备正负7度后轮转向，常规转弯半径4.95米；满足低速条件时，开启豹式掉头功能，转弯半径可缩小至3.55米。\n\n比亚迪还展示了DMS在冰雪对开路面、积水和高速突发碰撞等场景下的测试。官方称，冰雪路面测试中系统约0.5秒完成打滑控制；以120公里/小时通过积水路面时，车身最大偏移量为16毫米；在100公里/小时侧后方撞击测试中，车辆依托DMS与后轮转向协同，1.73秒内完成车身姿态修正。\n\n能耗方面，钛9的CLTC纯电续航最高400公里，百公里亏电油耗6.4升，满油满电综合续航1630公里。比亚迪称，DMS可根据路况管理动力，在城市巡航时减少不必要的能量损耗，在复杂路况下及时调用四驱能力，减少用户在动力、操控和能耗之间的取舍。\n\n另一项核心技术是钛9顶配折叠智舱版首搭的比亚迪折叠智舱。该方案由折叠方向盘、躺平座椅、数字底盘和智慧生态组成，是比亚迪面向L3、L4智能驾驶发展的研发创新和技术储备。钛9率先实现该技术搭载上市及量产交付。\n\n折叠方向盘量产的关键，在于线控转向改变了传统方向盘与车轮之间的机械连接方式。传统转向柱占据主驾前方空间，也限制了方向盘收纳；钛9采用线控转向方案，使方向盘可在0至180度范围内折叠。比亚迪称，方向盘可在10秒内完成收纳，车辆启用移车泊车功能时，还能在泊入过程中同步折叠、泊出时同步展开。收纳后，方向盘可与仪表台齐平，为主驾释放约25厘米腿部空间。\n\n在使用体验上，折叠方向盘保留完整轮圈、实体组合开关及调节功能，折叠机构采用车规级高性能无刷电机，高频启停寿命为8万次。安全方面，熊甜波介绍，线控转向系统设置五重安全冗余，覆盖供电、通信、传感、控制和执行环节；折叠收纳系统取得ASIL D功能安全等级认证。相关研发经过超过1000个测试场景验证，并设置使用条件、安全联锁和防夹保护。针对碰撞保护，工程师设计了拉杆弯折水平压溃结构，官方称可使收纳结构压溃量平均增加159%，降低相关部件侵入乘员空间的风险。\n\n折叠方向盘释放的空间，也为主驾舒适性配置创造条件。钛9折叠智舱版配备一键躺平座椅，可在20秒内完成姿态调整，靠背最大后仰165度，并支持18向调节；线控数字底盘可根据车速调整转向比，兼顾低速灵活性与高速稳定性。\n\n钛9还配备云辇-A、天神之眼B辅助驾驶、第二代刀片电池及闪充技术等配置。方程豹官方数据显示，10月品牌总销量43,872辆，同比增长41.3%；截至10月底，品牌累计销售626,045辆，成交均价超过22.2万元。同期，钛7累计销量突破30万辆，豹5、豹8累计销量突破20万辆。钛9的加入，将进一步丰富方程豹的产品矩阵。\n\n本文为转载内容，授权事宜请联系原著作权人。\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n闪电快讯｜方程豹钛9上市：首搭DMS超级混动全能平台，折叠方向盘量产上车\n\n售价27.99万元起，顶配折叠智舱版率先实现折叠方向盘量产交付。\n\n翟芳雪 · 2026/11/20 11:29\n\n11月19日，方程豹钛9正式上市，官方指导价27.99万元起，置换价27.39万元起。新车共推出三个版本，售价区间为27.99万至32.99万元。作为大型六座旗舰SUV，钛9首搭比亚迪DMS超级混动全能平台，顶配折叠智舱版则率先搭载比亚迪折叠方向盘并实现量产交付。\n\nDMS超级混动全能平台是此次发布的重点动力技术。比亚迪将其定义为面向全工况、全场景、全地形的混动平台，名称中的“S”代表“SUPER”。与此前分别侧重节能、性能和越野的DM-i、DM-p、DMO不同，DMS希望整合三套技术体系的核心优势，在能耗、动力、操控和安全之间取得平衡。对于车长约5.3米的大型SUV，这套平台还需兼顾城市、高速及复杂路况下的操控能力。\n\n方程豹汽车总经理熊甜波在发布会上介绍，DMS的一项核心技术，是通过后驱单电机独立调配左右车轮扭矩，并结合智能矢量扭矩控制，使车辆获得差速器、差速锁、电子限滑和轮端解耦等能力。比亚迪希望通过电机控制与整车协同，实现更精细的动力分配，兼顾动力输出、脱困能力和能量利用效率。\n\n动力方面，钛9搭载1.5T插混专用发动机和前后双电机，双电机总功率400千瓦，零百加速4.8秒。车辆配备正负7度后轮转向，常规转弯半径4.95米；满足低速条件时，开启豹式掉头功能，转弯半径可缩小至3.55米。\n\n比亚迪还展示了DMS在冰雪对开路面、积水和高速突发碰撞等场景下的测试。官方称，冰雪路面测试中系统约0.5秒完成打滑控制；以120公里/小时通过积水路面时，车身最大偏移量为16毫米；在100公里/小时侧后方撞击测试中，车辆依托DMS与后轮转向协同，1.73秒内完成车身姿态修正。\n\n能耗方面，钛9的CLTC纯电续航最高400公里，百公里亏电油耗6.4升，满油满电综合续航1630公里。比亚迪称，DMS可根据路况管理动力，在城市巡航时减少不必要的能量损耗，在复杂路况下及时调用四驱能力，减少用户在动力、操控和能耗之间的取舍。\n\n另一项核心技术是钛9顶配折叠智舱版首搭的比亚迪折叠智舱。该方案由折叠方向盘、躺平座椅、数字底盘和智慧生态组成，是比亚迪面向L3、L4智能驾驶发展的研发创新和技术储备。钛9率先实现该技术搭载上市及量产交付。\n\n折叠方向盘量产的关键，在于线控转向改变了传统方向盘与车轮之间的机械连接方式。传统转向柱占据主驾前方空间，也限制了方向盘收纳；钛9采用线控转向方案，使方向盘可在0至180度范围内折叠。比亚迪称，方向盘可在10秒内完成收纳，车辆启用移车泊车功能时，还能在泊入过程中同步折叠、泊出时同步展开。收纳后，方向盘可与仪表台齐平，为主驾释放约25厘米腿部空间。\n\n在
