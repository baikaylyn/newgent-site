vod-cdn.tvb.com/4f2bd08d4be44bf9a97792caf6ad966a/d208a8a31cd74c639e142720912203ce-5bf020e8e3844a8bc60cbd3171256324-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/4f2bd08d4be44bf9a97792caf6ad966a/snapshots/c4c7cd81d85a42108021d3fd7faebaf3-00003.jpg","lang":"zh-Hant"},{"id":"c04213563a2","title":"歐洲多國民眾示威罷工 交通等公共服務受影響","url":"https://www.stheadline.com/realtime-world/3639593/歐洲多國民眾示威罷工-交通等公共服務受影響","summary":"德國、英國、法國、意大利、瑞士、西班牙及葡萄牙等歐洲多國年輕民眾周五（20日）舉行示威和罷工活動，宣洩對高生活成本、軍費支出及氣候危機等議題的憤怒，要求關注年輕世代的福祉…","summary_short":"德國、英國、法國、意大利、瑞士、西班牙及葡萄牙等歐洲多國年輕民眾周五（20日）舉行示威和罷工活動，宣洩對高生活成本…","digest":"德國、英國、法國、意大利、瑞士…","points":["德國、英國、法國、意大利、瑞士、西班牙及葡萄牙等歐洲多國年輕民眾周五（20日）舉行示威和罷工…","部分國家的交通、醫療和教育等公共服務受到影響","示威者走上各國城市街頭，許多人揮舞寫有「為我們的未來而戰」的標語牌，點燃照明彈…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:37:24+08:00","size":1,"keywords":[],"body":"德國、英國、法國、意大利、瑞士、西班牙及葡萄牙等歐洲多國年輕民眾周五（20日）舉行示威和罷工活動，宣洩對高生活成本、軍費支出及氣候危機等議題的憤怒，要求關注年輕世代的福祉，增加公共服務投入和提高工資以改善民生，呼籲減少國防開支。部分國家的交通、醫療和教育等公共服務受到影響。\n示威者走上各國城市街頭，許多人揮舞寫有「為我們的未來而戰」的標語牌，點燃照明彈，焚燒坦克的紙板模型。這些集會由一個由青年主導、由超過50個團體組成的聯盟協調，其訴求因地而異，包括以色列在加沙的戰爭、高昂的租金，以及學校和大學日益惡化的學習條件。\n意大利有示威者與警員衝突，警員施放水炮驅散。美聯社\n示威者呼籲減少國防開支。路透社\n倫敦特拉法加廣場有民眾示威。新華社\n德國漢堡示𢦡者人頭湧湧。路透社\n年輕世代主導示威 要求增加教育開支\n德國柏林、科隆、法蘭克福、慕尼黑等數十個城市均有民眾上街示威，反對恢復兵役制和削減教育經費，並就校舍修繕、教育公平和住房負擔等表達訴求。柏林警方說，約有4500人參加示威遊行，警方出動約1600名警力維持秩序。\n英國倫敦也舉行抗議活動，數百名抗議者，其中部分穿著校服，在倫敦國會外及鄰近的特拉法加廣場聚集示威，揮舞標語牌，上面寫著「拯救高等教育」和「為我們的未來而戰，而非他們的戰爭」。示威者反對軍事擴張和生活成本上漲，呼籲減少軍事投入，增加教育、醫療和住房等公共服務支出。示威者隨後在首相官邸附近匯合，一度造成道路交通擁堵，並與立場不同的右翼示威者發生對峙，警方逮捕數人。\n法部署7萬警員防亂\n法國巴黎等地出現規模相對較小的遊行。法國媒體報道，示威者周六還將舉行新一輪全國抗議活動以紀念「黃背心」運動發起8周年。法國政府計劃在全國部署7萬名警察和憲兵，維護公共秩序。\n意大利總工會發起全國性罷工，罷工部門包括公共部門以及部分私營部門。抗議者在羅馬、米蘭、博洛尼亞、熱那亞、那不勒斯和巴勒莫等城市舉行集會，要求提高工資、增加教育和醫療投入，並對增加國防開支表示反對。\n意大利、葡萄牙民眾發起罷工\n意大利總工會說，當日全國超過150萬人參與罷工。意大利總工會負責人蘭迪尼指出，抗議活動反映出民眾要求改變現狀、將民生需求置於優先位置的強烈願望。\n在瑞士，主辦單位聲稱全國已有超過4萬名抗議者走上街頭。在西班牙，示威者首都馬德里的抗議活動中，呼籲增加教育經費，並強烈反對增加軍費。\n葡萄牙公共部門員工也舉行罷工，要求政府就2027年工資調整方案展開談判。今次行動由葡萄牙總工會下屬的公共部門工會聯合陣線發起。罷工影響醫療、教育和垃圾清運等公共服務，全國多地學校關閉，醫院僅維持最低限度醫療服務。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c76b523fa02","title":"強風暴襲巴西南部釀3死60傷 8000房屋被摧毀","url":"https://www.stheadline.com/realtime-world/3639586/強風暴襲巴西南部釀3死60傷-8000房屋被摧毀-","summary":"巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮。","summary_short":"巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮。","digest":"巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮","points":["巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮","其中，人口約2萬的圖潘西雷唐市受災最為嚴重，至少3人死亡、60人受傷","全市約8600棟住宅中，約8000棟受損甚至倒塌"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:03:07+08:00","size":1,"keywords":[],"body":"巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮。其中，人口約2萬的圖潘西雷唐市受災最為嚴重，至少3人死亡、60人受傷。全市約8600棟住宅中，約8000棟受損甚至倒塌。\n20日淩晨3時左右，伴隨冰雹的強風暴襲擊圖潘西雷唐市，最大陣風時速達114公里。全市大量樹木、電線桿倒塌，道路受阻，電力及食水供應中斷，通訊網絡受損。市內唯一一家醫院屋頂被掀翻，傷者被緊急轉往鄰近城市救治。\n面對家園被毀，一對男女相擁安慰。路透社\n全市約8000棟住宅被摧毀。路透社\n多座建築物倒塌。路透社\n整座城市被摧毀\n圖潘西雷唐市市長特拉接受當地媒體訪問時表示：「整座城市都被摧毀了，有如前所未見的電影場景。」\n南里奧格蘭德州州長萊特表示，已動員民防、消防、警方等部門全力救援，緊急撥款調配機械設備和救災物資，加快恢復電力供應。\n巴西聯邦政府已派遣民防及醫療救援隊伍前往災區，協助救治傷者並運送救災物資，同時推動緊急救災資金撥付。\n巴西國家氣象研究所預報，至23日，該國多地仍將出現強降雨和雷暴天氣，南部、東南部部分地區面臨較高風暴風險。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"caab0176fe6","title":"特朗普稱與習近平談設AI防護機制 警告美資企業設海外數據中心將被徵重稅","url":"https://news.tvb.com/tc/1207599-特朗普稱與習近平談設AI防護機制警告美資企業設海外數據中心將被徵重稅","summary":"美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制。特朗普同時警告美資企業，一旦在海外設立數據中心將被徵收重稅，防止技術外流。","summary_short":"美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制。","digest":"美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制","points":["美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制","特朗普同時警告美資企業，一旦在海外設立數據中心將被徵收重稅，防止技術外流","美國總統特朗普結束「中國行」，談及跟國家主席習近平會面期間，討論人工智能相關議題…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T12:40+08:00","size":1,"keywords":[],"body":"美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制。特朗普同時警告美資企業，一旦在海外設立數據中心將被徵收重稅，防止技術外流。\n\n美國總統特朗普結束「中國行」，談及跟國家主席習近平會面期間，討論人工智能相關議題，包括設立防護機制。\n\n美國總統特朗普說：「習主席和我達成共識，設立(人工智能)共同防護機制，我們兩人之間，因為沒有第三個地方，我們(於人工智能發展)領先，中國位列第二，沒有任何國家能緊隨其後。」\n\n特朗普又指，美國在「超級智能」發展上正領先中國，但若因政治阻撓，導致數據中心發展停滯，可能會威脅美國的領先地位，警告美資企業一旦在海外設立人工智能數據中心，當局不排除會徵收重稅，以免他們外流晶片及相關技術，讓中國成為大贏家。\n\n特朗普表明，批准美資企業繼續向中國出售晶片，但只限舊型號晶片，而禁售最先進晶片。\n他認為美方即使完全禁售晶片，中國仍有能力自行研製。\n\n對於輝達前行政總裁黃仁勳，捲入婚外情及間諜疑雲，引起科技界關注，特朗普稱，跟習近平談及此事，但沒有交待細節。特朗普認為黃仁勳是卓越的人，即使他間中作出差劣決定，但可協助美國在人工智能保持領先地位，他值得擁有「另一次機會」。\n\n不過，美國財長貝森特則有另一個說法，指美中會談並未談及黃仁勳。路透社引述知情人士透露，美國證券管理委員會正調查輝達可能涉及的會計問題。\n\n據報黃仁勳同意出席參議院委員會聽證會，並公開作證，但未知他出席聽證會的確實日期。","image":"https://pro-vod-cdn.tvb.com/73498febb99940eba0228abb94c1ac4c/snapshots/61a2b77dff7c4b5fa75b58361b1f1c2e-00008.jpg","video":"https://pro-vod-cdn.tvb.com/73498febb99940eba0228abb94c1ac4c/a7e6222027c048429a15c247d77506a3-26d69d6aacd4eb1b2ca9e4400f9c814d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/73498febb99940eba0228abb94c1ac4c/snapshots/61a2b77dff7c4b5fa75b58361b1f1c2e-00008.jpg","lang":"zh-Hant"},{"id":"c9305cde169","title":"中俄美元首會晤｜特朗普指同中俄元首保持良好關係 有助保障美國安全","url":"https://news.tvb.com/tc/1207593-中俄美元首會晤特朗普指同中俄元首保持良好關係有助保障美國安全","summary":"美國總統特朗普總結亞洲之旅的成果，形容中俄美元首會晤意義重大，指同中俄元首保持良好關係，有助保障美國安全。新華社發表評論文章，形容中俄美元首會晤是國際關係史上重大創舉，三國要做夥伴及朋友，守住和平共處底線。","summary_short":"美國總統特朗普總結亞洲之旅的成果，形容中俄美元首會晤意義重大，指同中俄元首保持良好關係，有助保障美國安全。","digest":"美國總統特朗普總結亞洲之旅的成果，形容中俄美元首會晤意義重大…","points":["新華社發表評論文章，形容中俄美元首會晤是國際關係史上重大創舉，三國要做夥伴及朋友…","美國總統特朗普結束訪華行程返回華盛頓，在白宮召開記者會，總結亞洲之旅…","又形容在深圳舉行中俄美元首會晤，是具重大歷史意義的國際峰會"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T12:09+08:00","size":1,"keywords":[],"body":"美國總統特朗普總結亞洲之旅的成果，形容中俄美元首會晤意義重大，指同中俄元首保持良好關係，有助保障美國安全。新華社發表評論文章，形容中俄美元首會晤是國際關係史上重大創舉，三國要做夥伴及朋友，守住和平共處底線。\n\n美國總統特朗普結束訪華行程返回華盛頓，在白宮召開記者會，總結亞洲之旅，他特別感謝國家主席習近平在深圳親自接機。又形容在深圳舉行中俄美元首會晤，是具重大歷史意義的國際峰會。\n\n美國總統特朗普說：「這是美俄中史上首次(共聚一堂)，這非常重大，很了不起，氣氛非常好，難以置信，我們三人之間的關係也非常棒。」\n\n特朗普又盛讚會議主辦城市深圳發展迅速。\n\n特朗普說：「習主席做了了不起的工作，(深圳)那座城市很乾淨、一塵不染，一切都是短時間內建成的，那城市40年前還是一個漁村，的確於過去20年，習主席為中國作出了非常出色的貢獻，再看看我們的城市，到處都很髒亂，我不得不說大多一片沉鬱，到處道路骯髒，坑坑窪窪，護攔搖搖欲墜，所有東西都鏽跡斑斑，令人作嘔，犯罪率更是高得離譜。」\n\n對於特朗普與俄羅斯總統普京舉行雙邊會談期間，稱對方為朋友，引起外界關注。\n\n有記者問︰「你說普京是你的朋友，俄羅斯當然是伊朗最大的盟友，你相信普京是美國的朋友嗎？」\n\n特朗普表示︰「我無法代美國說話，我一直在跟普京打交道，尤其是在那場假的『通俄門』，我認為我和普京關係非常好，這是非常好的事，我和習主席關係非常好，這是好事，我們的國家因此安全。」\n\n新華社發表評論文章，指三國元首歷史上，首次舉行面對面會晤，開創三國最高領導人交往的新紀錄，為新時期大國互動構建了新範式，是國際關係史上的重大創舉。中俄美要做夥伴、做朋友，不衝突、不對抗，守住和平共處底線，堅定維護戰後國際秩序，盡一切努力防止核戰爭。中俄美三國發展稟賦不同，經濟互補性強。要加強經貿合作，實現雙贏共贏。\n\n評論指，大國間有分歧在所難免。要保持常態化高層交往，暢通各層級對話渠道，建立危機溝通和預防機制，確保誤判少發生，分歧管得住、摩擦不升級。","image":"https://pro-vod-cdn.tvb.com/5943ecc4ce144ffda0b54f31727afdc3/snapshots/5c561f1969f8476c8bdcb2479449759f-00008.jpg","video":"https://pro-vod-cdn.tvb.com/5943ecc4ce144ffda0b54f31727afdc3/ca80721e003346ac9bc5fc606789ecc3-9578eba3609f92a8166f243ad3e563c7-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/5943ecc4ce144ffda0b54f31727afdc3/snapshots/5c561f1969f8476c8bdcb2479449759f-00008.jpg","lang":"zh-Hant"},{"id":"ca3411520c9","title":"COP31青年说｜南非西开普省减灾负责人：高油价背景下，中国电动汽车在南非大受欢迎","url":"https://www.chinanews.com/gj/shipin/2026/11-21/news1075631.shtml","summary":"11月13日，《联合国气候变化框架公约》第三十一次缔约方大会(COP31)期间，首次参会的南非西开普省政府灾害风险减缓负责人纳比尔·莱兰兹(Nabeel Rylands)接受中新社记者采访时表示…","summary_short":"11月13日，《联合国气候变化框架公约》第三十一次缔约方大会(COP31)期间…","digest":"11月13日，《联合国气候变化框架公约》第三十一次缔约方大会(COP31)期间…","points":["11月13日，《联合国气候变化框架公约》第三十一次缔约方大会(COP31)期间…","谈及气候治理议题时，莱兰兹指出：“我们同住一个地球，每个人的声音都重要","”他号召全人类共同参与气候变化应对行动"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T11:34:34+08:00","size":1,"keywords":[],"body":"11月13日，《联合国气候变化框架公约》第三十一次缔约方大会(COP31)期间，首次参会的南非西开普省政府灾害风险减缓负责人纳比尔·莱兰兹(Nabeel Rylands)接受中新社记者采访时表示，中国电动汽车正大量进入南非市场——比亚迪、奇瑞、吉利等品牌因价格实惠，契合高油价背景下的需求，而备受青睐。\n\n谈及气候治理议题时，莱兰兹指出：“我们同住一个地球，每个人的声音都重要。”他号召全人类共同参与气候变化应对行动。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/20/bbc2c9a6-719f-4ba3-9e26-c520f59efa9e.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c1db9d8da2a","title":"沙特称拦截3枚胡塞武装导弹 也门媒体称沙特袭击致41死","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735663.shtml","summary":"中新社北京11月21日电 据沙特《利雅得报》当地时间21日凌晨报道，沙特阿拉伯主导的多国联军称摧毁了也门胡塞武装向沙特首都利雅得发射的三枚弹道导弹。","summary_short":"中新社北京11月21日电 据沙特《利雅得报》当地时间21日凌晨报道…","digest":"据沙特《利雅得报》当地时间21日凌晨报道…","points":["中新社北京11月21日电 据沙特《利雅得报》当地时间21日凌晨报道…","拦截导弹前，沙特民防总局对利雅得发布紧急警报，随后解除","这是该部门连续第三晚对利雅得发布紧急警报"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:33:02+08:00","size":1,"keywords":[],"body":"中新社北京11月21日电 据沙特《利雅得报》当地时间21日凌晨报道，沙特阿拉伯主导的多国联军称摧毁了也门胡塞武装向沙特首都利雅得发射的三枚弹道导弹。\n\n　　拦截导弹前，沙特民防总局对利雅得发布紧急警报，随后解除。这是该部门连续第三晚对利雅得发布紧急警报。\n\n　　胡塞武装军事发言人叶海亚·萨雷亚20日晚在社交媒体发文说，沙特过去24小时内发动了78次袭击，目标涉及也门首都萨那以及荷台达、塔伊兹、拉赫季、萨达和马里卜等地，造成多人死亡。\n\n　　据也门胡塞武装控制的马西拉电视台20日傍晚报道，当地卫生部门发表声明说，过去24小时内，沙特在也门的军事行动共造成41人死亡，其中包括11名儿童和7名妇女，另有28人受伤。\r\n\n　　声明还指出，自冲突升级以来，也门累计死亡人数达438人，另有924人受伤。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6f94ff7a31","title":"探访秘鲁钱凯港：跨越太平洋的发展新机遇","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735662.shtml","summary":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际…","summary_short":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024年11…","digest":"题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024…","points":["2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际…","秘鲁首都利马以北约80公里，碧蓝的太平洋畔，钱凯港巨型岸桥高高耸立，智能集卡穿梭于集装箱堆场","目前，钱凯港已建成4个生产性泊位，配备6台远程操控岸桥、15台自动化轨道吊、50台智能集卡…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:32:08+08:00","size":1,"keywords":[],"body":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇\n\n　　中新社记者 林春茵\n\n　　2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际，中秘合作建设的钱凯港正式开港。两年后，APEC时间来到中国深圳。作为亚太互联互通的标志性项目，钱凯港发生了怎样的变化？记者日前走访这座年轻的港口，探寻答案。\n\n近日，航拍秘鲁钱凯港。(钱凯港 供图)\n\n　　秘鲁首都利马以北约80公里，碧蓝的太平洋畔，钱凯港巨型岸桥高高耸立，智能集卡穿梭于集装箱堆场。走进钱凯港中央控制室，工作人员通过屏幕远程操控码头设备，装卸、运输、堆存等作业环节有序衔接。\n\n　　“从最初的一片荒滩，到如今码头操作区、入口辅建区、隧道及连接道路等基础设施已基本完善。”钱凯港常务副总经理何波亲历了南美洲首个绿色智慧现代化港口从无到有的全过程。\n\n　　何波说，作为连接亚洲与南美市场的重要物流节点，钱凯港开港后，“钱凯—上海”直航航线投入运营，两地海运时间从35至40天缩短至23天。相较直航开通前，物流成本降低逾20%。\n\n　　目前，钱凯港已建成4个生产性泊位，配备6台远程操控岸桥、15台自动化轨道吊、50台智能集卡，港机设备实现100%电气化，生产能源全部采用绿色电力。\n\n　　2026年前9个月，钱凯港累计完成船舶作业323艘次，同比增长31%；集装箱吞吐量达34万标准箱，同比增长47%。\n\n近日，秘鲁钱凯港作业场景。(钱凯港 供图)\n\n　　今年，19.6吨秘鲁鲜食香蕉搭乘“钱凯快航”抵达上海洋山港，首次进入中国市场。从牛油果、蓝莓到香蕉，越来越多拉美农产品摆上中国消费者的餐桌。\n\n　　如今的钱凯港，联通的不仅是中国和秘鲁。开港两年来，钱凯港已形成3条干线、5条支线的航运网络，覆盖亚洲、南美洲西海岸及中美洲主要港口，辐射巴西、厄瓜多尔等拉美国家。\n\n　　今年7月，一条连接秘鲁帕伊塔港、钱凯港与哥斯达黎加卡尔德拉港的支线开通。秘鲁北部及中美洲货物可汇集至钱凯港，搭乘远洋货轮直抵亚洲市场。\n\n　　据秘鲁国家海关与税务管理局统计，2026年前9个月，经钱凯港出口的货物总额达27.68亿美元，同比增长57.27%。\n\n　　“钱凯港有助于进一步畅通亚太与南美之间的贸易往来，提升区域供应链效率。”何波说，跨太平洋运输周期的缩短，为拉美农产品开拓亚洲市场带来新的机遇。\n\n当地时间11月20日，秘鲁钱凯港，钱凯港自动化轨道吊操作员莫妮卡·比索(Nicole　Monica　Bisso　Melendez)正在工作。　丘艳 摄\n\n　　钱凯港自动化轨道吊操作员莫妮卡·比索(Nicole Monica Bisso Melendez)是土生土长的钱凯人，此前从未接触过港口作业，但通过职业技能培训，走上了智能化码头的操作岗位。\n\n　　“我现在能操作吊运数吨货物的大型机械。”莫妮卡·比索说，“对年轻人来说，在钱凯港工作有很好的发展机会。”\n\n　　目前，钱凯港秘鲁籍员工占比近98.88%，来自钱凯、瓦拉尔周边社区的员工占比逾55%，女性员工占比逾20%。港口还联合秘鲁当地行业协会，开展国际贸易、旅游服务、烹饪技艺等职业技能培训，累计惠及逾千名当地青年、妇女和创业者。\n\n　　“港口还为本地供应商和中小企业带来了发展机遇。”钱凯港秘方副总经理杰森表示，钱凯这个传统渔村，正在成长为重要的贸易和物流枢纽。(完)\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4bd28c9816","title":"遊日注意 | 日本受強冷空氣影響 多地迎來初雪","url":"https://www.stheadline.com/realtime-world/3639549/遊日注意-日本受強冷空氣影響-多地迎來初雪","summary":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。","summary_short":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。","digest":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪","points":["日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪","氣象廳表示，受高空冷空氣影響，大氣極不穩定的狀態持續，提醒北陸地區至周日仍須嚴防土石災害","在岐阜縣白川鄉，屋頂被厚厚的白雪覆蓋，四周一片白茫茫"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:31:56+08:00","size":1,"keywords":[],"body":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。氣象廳表示，受高空冷空氣影響，大氣極不穩定的狀態持續，提醒北陸地區至周日仍須嚴防土石災害。\n在岐阜縣白川鄉，屋頂被厚厚的白雪覆蓋，四周一片白茫茫。受強烈冬季季候風影響，廣泛地區持續降雪，東北的秋田縣秋田市6小時內錄得20厘米降雪量，岩手縣西和賀町積雪超過40厘米。\n日本受強冷空氣影響，多地迎來降雪。法新社\n岐阜縣白川鄉迎來降雪。白川鄉觀光協會\n厚雪覆蓋白川鄉 旭川積雪22厘米\n北海道旭川有22厘米積雪，深川市積雪則超過30厘米。四國和鳥取縣等地區，以及仙台市及長野市亦迎來初雪。\n在東北的山形縣，周五下午3時左右，東根市國道48號線上一輛大型卡車因降雪受困。縣警表示，後方約50輛車也一度滯留，所幸無人受傷或身體不適。\n多地山區降雪最高50厘米\n氣象廳指，多地降雪主要集中在山區，最高可達到50厘米，又預計北海道周六平均風速達每秒20米，最大陣風則為每秒30米。\n另外，北陸地區截至周六下午6時的24小時累積雨量，局部地區預計可達120毫米，其後24小時還將達80毫米。\n氣象廳表示，冬季型氣壓分布將持續至周六，在北日本至西日本上空約5500米處，將有較往年低約10度、氣溫低於零下30度的強冷空氣流入。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c58cb652a48","title":"丹麦驱逐俄罗斯武官，俄表示将“适当回应”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735674.shtml","summary":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官，要求其在7日内离境。","summary_short":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官…","digest":"综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布…","points":["中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布…","俄外交部表示，将对丹麦驱逐其武官一事“作出适当回应”","据英国《卫报》报道，拉斯穆森当天在哥本哈根举行的记者会上表示…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:27:26+08:00","size":1,"keywords":[],"body":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官，要求其在7日内离境。俄外交部表示，将对丹麦驱逐其武官一事“作出适当回应”。\n\n　　据英国《卫报》报道，拉斯穆森当天在哥本哈根举行的记者会上表示，丹麦已召见俄罗斯驻丹麦大使弗拉基米尔·巴尔宾，告知丹方驱逐俄罗斯国防武官的决定。他称，此举旨在向俄方“发出明确信号”。拉斯穆森同时表示，丹麦不会因此切断与俄罗斯的外交联系，将继续支持乌克兰。\n\n　　拉斯穆森还表示，丹麦正在加大力度，推动停止向俄罗斯公民发放非必要签证，并已在欧洲层面推动进一步收紧俄罗斯公民入境相关规定。据土耳其阿纳多卢通讯社报道，丹麦还计划与其他申根国家讨论相关签证限制。\n\n　　丹麦安全与情报局20日发布通报称，该机构评估认为，俄罗斯情报机构策划并发起了一起针对一名乌克兰裔美国公民的暗杀行动。丹麦有关部门于9月25日挫败了这一行动。\r\n\n　　对于丹方指控，俄罗斯驻丹麦大使馆表示，丹麦方面没有提供俄罗斯参与所谓暗杀行动的证据。俄罗斯外交部发言人扎哈罗娃则表示，莫斯科将对丹麦驱逐俄国防武官一事作出“适当回应”。 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b552d0bc5","title":"太空農業突破 | 模擬月球土壤添加有機物 種出食用馬鈴薯","url":"https://www.stheadline.com/realtime-world/3639541/太空農業突破-模擬月球土壤添加有機物-種出食用馬鈴薯","summary":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊，成功在添加了有機物的模擬月球土壤中，培育出安全且營養豐富的食用馬鈴薯…","summary_short":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊…","digest":"由美國太空總署資助…","points":["由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric G…","這項研究在權威期刊《npj Microgravity》發表…","月球表面的月塵（lunar regolith）由數億年的隕石撞擊形成…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:46:56+08:00","size":1,"keywords":[],"body":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊，成功在添加了有機物的模擬月球土壤中，培育出安全且營養豐富的食用馬鈴薯，其生長和產量可以媲美地球上種植的馬鈴薯。\n這項研究在權威期刊《npj Microgravity》發表，證實只要在月球模擬岩屑中添加適量有機物質，即可獲得有如地球良田的農作物產量，為未來建立長期月球基地與太空人糧食自給，奠定了關鍵里程碑。\n科學家成功在模擬月球土壤培育出安全且營養豐富的食用馬鈴薯。路透社\n模擬月球土壤的馬鈴薯生長和產量，可以媲美地球上種植的馬鈴薯。路透社\n為月球基地糧食自足鋪路\n月球表面的月塵（lunar regolith）由數億年的隕石撞擊形成，極其鋒利且完全缺乏植物生長所需的氮元素與有機物質，甚至含有高劑量的銅等重金屬。\n研究團隊選用成熟快、紅皮白肉的「Modoc」馬鈴薯品種，並混入蚯蚓分解有機廢棄物產生的「蚯蚓堆肥」（vermicompost）進行試驗。\n產量媲美地球農田\n實驗結果顯示，未添加堆肥的純月塵幾乎無法結出塊莖；然而當堆肥比例提升至30%時，馬鈴薯產量與在俄勒岡州赫米斯頓（Hermiston）優質農地種植的表現完全一致。\n戈耶指出，有機物質不僅提供必需氮素，更能有效阻止植物過度吸收重金屬。\n未來，太空人可以將少量有機物質帶到月球，然後透過將食物殘渣和植物廢料轉化為更多有機物質來製造更多有機物，從而減少從地球運輸生長材料的需求。\n具高度飽足感 視為月球理想主食\n馬鈴薯單位面積熱量極高，富含維生素C、優質蛋白質與比香蕉更高劑量的鉀，具備高度飽足感，被視為月球基地的理想主食。 \n共同作者、太空生物學家漢迪（David Handy）強調，此項月球農業技術未來亦可轉化應用於地球，協助缺乏資源的沙漠地區、貧瘠城市或遭重金屬污染的土壤進行修復，實現地表與太空的永續農業目標。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce42792ac38","title":"特朗普称无法接受伊朗想达成的协议 重申伊朗“永远不会拥有核武器”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735660.shtml","summary":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议，但伊朗方面想要的并非他所能接受的协议。","summary_short":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议…","digest":"据美联社报道，美国总统特朗普当地时间20日表示…","points":["中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示…","特朗普20日在白宫举行的新闻发布会上表示，“我们要达成一项真正的协议，而不是虚假协议","”随后，特朗普再次重申其一贯承诺，“伊朗永远、永远不会拥有核武器"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:31:47+08:00","size":1,"keywords":[],"body":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议，但伊朗方面想要的并非他所能接受的协议。\n\n资料图：美国总统特朗普。 \n\n　　据报道，特朗普20日在白宫举行的新闻发布会上表示，“我们要达成一项真正的协议，而不是虚假协议。”随后，特朗普再次重申其一贯承诺，“伊朗永远、永远不会拥有核武器。”\n\n　　报道称，特朗普在是否达成协议的问题上态度摇摆：时而主张达成一项结束战事的协议，时而又表示美国无需达成任何协议。分析人士认为，美伊下一步行动充满不确定性，加之最新一轮时强时弱的相互攻击，反映出冲突持续近九个月之际，双方都处于难以为继的境地。\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c236072785d","title":"日媒：日本研究引进核潜艇及为“无核三原则”设例外","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735659.shtml","summary":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。","summary_short":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。","digest":"据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光","points":["新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道…","草案提出“启动研究”引进核动力潜艇问题，并允许在紧急情况下将核武器运进日本","报道援引多名相关人士的话说，该草案设想在2027至2031财年期间启动引进核动力潜艇相关项目…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:25:04+08:00","size":1,"keywords":[],"body":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。草案提出“启动研究”引进核动力潜艇问题，并允许在紧急情况下将核武器运进日本。\n\n　　报道援引多名相关人士的话说，该草案设想在2027至2031财年期间启动引进核动力潜艇相关项目，并以“调查研究费”的名义安排必要预算。\n\n　　报道说，引进核动力潜艇和调整“无核三原则”相关表述是此次修订“安保三文件”的主要议题。“无核三原则”指“不拥有、不制造、不运进核武器”。草案一方面声称坚持这一原则，另一方面又明确写入允许在紧急情况下运进核武器的例外情况。\n\n　　报道称，日本政府高层主张拥有核动力潜艇，认为可在艇上搭载导弹垂直发射装置，将其作为实施所谓“强化反击能力”的手段之一。\r\n\n　　日本首相高市早苗10月14日在国会答辩中暗示，可能在今年年底修订《国家安全保障战略》等“安保三文件”时，调整其中有关“无核三原则”的表述。日本多个民间团体11月18日共同向日本外务省提交诉求书，要求政府坚持“无核三原则”，随后又于20日向防卫省递交由4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c16ce4c3640","title":"英国推进移民制度改革 持续关停庇护安置酒店","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735614.shtml","summary":"中新社伦敦11月20日电 (记者 欧阳开宇)英国内政部20日宣布，英国政府持续推进移民庇护制度改革，再度关停多处用于安置寻求庇护者的临时酒店，进一步缓解地方社区公共服务压力，压降庇护安置财政成本。","summary_short":"中新社伦敦11月20日电 (记者 欧阳开宇)英国内政部20日宣布，英国政府持续推进移民庇护制度改革…","digest":"英国内政部20日宣布，英国政府持续推进移民庇护制度改革…","points":["中新社伦敦11月20日电 (记者 欧阳开宇)英国内政部20日宣布…","据官方发布数据，自今年夏季以来，英国新关停8家庇护安置酒店，本年度累计关停数量达52家","目前英国仍在使用的庇护酒店约140家，较2023年峰值400家大幅缩减"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:05:07+08:00","size":1,"keywords":[],"body":"中新社伦敦11月20日电 (记者 欧阳开宇)英国内政部20日宣布，英国政府持续推进移民庇护制度改革，再度关停多处用于安置寻求庇护者的临时酒店，进一步缓解地方社区公共服务压力，压降庇护安置财政成本。\n\n　　据官方发布数据，自今年夏季以来，英国新关停8家庇护安置酒店，本年度累计关停数量达52家。目前英国仍在使用的庇护酒店约140家，较2023年峰值400家大幅缩减。酒店安置的庇护者人数较历史最高值下降超七成，安置规模显著回落。\n\n　　英国政府表示，近年来一系列移民改革举措持续落地生效，非法入境、不实庇护申请等乱象得到有效管控。伴随入境人数回落、申请审理提速、遣返力度加大，英国庇护安置体系供需压力缓解，政府得以有序退出成本高昂的临时酒店安置模式。\n\n　　长期大规模租用酒店安置寻求庇护者，曾给英国多地社区带来公共资源紧张、民生承压等问题，公共财政负担居高不下。英国政府正通过制度优化、流程规范、从严治理，逐步替代酒店临时安置方式，推动庇护安置体系回归合理、可持续的运行状态。\r\n\n　　英国政府强调，将坚持稳步关停剩余庇护安置酒店，持续优化移民庇护管理机制，在保障合法庇护需求的同时，切实减轻社区治理压力、节约公共财政资源，维护本土社会秩序稳定。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c73d4523fb7","title":"南非7月至9月发生5590起谋杀案 超半数案发公共场所","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735612.shtml","summary":"中新社约翰内斯堡11月20日电 (记者 孙翔)南非警察局20日公布的犯罪统计数据显示，今年7月至9月，南非共发生5590起谋杀案件，平均每天约有60人遭谋杀；其中，近3000起发生在公共场所。","summary_short":"中新社约翰内斯堡11月20日电 (记者 孙翔)南非警察局20日公布的犯罪统计数据显示，今年7月至9月…","digest":"南非警察局20日公布的犯罪统计数据显示，今年7月至9月，南非共发生5590起谋杀案件…","points":["中新社约翰内斯堡11月20日电 (记者 孙翔)南非警察局20日公布的犯罪统计数据显示…","其中，近3000起发生在公共场所","南非代理警察部长菲罗兹·卡查利亚当天在新闻发布会上表示，南非暴力犯罪总体呈下降趋势…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:02:33+08:00","size":1,"keywords":[],"body":"中新社约翰内斯堡11月20日电 (记者 孙翔)南非警察局20日公布的犯罪统计数据显示，今年7月至9月，南非共发生5590起谋杀案件，平均每天约有60人遭谋杀；其中，近3000起发生在公共场所。\n\n　　南非代理警察部长菲罗兹·卡查利亚当天在新闻发布会上表示，南非暴力犯罪总体呈下降趋势，较去年同期的5794起减少204起。本季度，持械抢劫案件出现显著下降。其中，汽车劫持案件同比下降16.8%，卡车劫持案件下降27.9%。\n\n　　值得注意的是，尽管南非谋杀案件数量同比下降，但环比连续两个季度增加。今年第一季度，南非共记录5181起谋杀案件，第二季度增至5427起，第三季度进一步升至5590起，最近两个季度环比分别增长4.7%和3.0%。\n\n　　卡查利亚说，南非案发区域性很强，约80%的帮派相关谋杀和近60%的出租车业相关谋杀发生在西开普省，豪登省则是抢劫相关谋杀案件数量最多的省份。\r\n\n　　数据显示，该季度近3000起谋杀案件、1547起强奸案件发生在公共场所，包括街道、公园、海滩和停车场等。针对公共场所犯罪问题，卡查利亚呼吁地方政府、业主及相关部门加强公共空间管理。\n\n　　此外，南非该季度共记录9908起强奸案件。在能够核实受害者性别和年龄的9705起案件中，4362名受害者为未满18岁的儿童，占比约45%；另有5116名成年女性和227名成年男性受害者。\n\n　　今年7月至9月，豪登省埃库鲁莱尼及周边地区发生涉及12名女性遇害案，引发社会广泛关注。南非警方近日表示，针对相关案件已逮捕8名嫌疑人。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb3bcc855dd","title":"澤連斯基不滿特朗普視普京為朋友 惟仍冀美方續斡旋烏俄衝突","url":"https://news.tvb.com/tc/1207582-澤連斯基不滿特朗普視普京為朋友惟仍冀美方續斡旋烏俄衝突","summary":"美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武，以及密謀向華盛頓施襲。烏克蘭總統澤連斯基不滿他將普京視為「朋友」，但仍希望美國繼續斡旋烏俄衝突。","summary_short":"美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武，以及密謀向華盛頓施襲。","digest":"美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武…","points":["美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武…","烏克蘭總統澤連斯基不滿他將普京視為「朋友」，但仍希望美國繼續斡旋烏俄衝突","而在歐洲多國演習期間，有導彈及無人機闖入波蘭領空，華沙當局質疑是俄軍所為"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T08:30+08:00","size":1,"keywords":[],"body":"美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武，以及密謀向華盛頓施襲。烏克蘭總統澤連斯基不滿他將普京視為「朋友」，但仍希望美國繼續斡旋烏俄衝突。而在歐洲多國演習期間，有導彈及無人機闖入波蘭領空，華沙當局質疑是俄軍所為。\n\n俄烏局勢引起國際關注，歐洲11個國家共派出數千名軍人，本月9日起在波蘭參加聯合演習，直到明日結束，以協助烏克蘭準備重建國家及部署軍隊。這次聯合演習被視為檢視英、法兩國牽頭自願聯盟的實力水平。\n\n在歐洲多國演習期間，波蘭防長周五批評俄羅斯向波蘭領空發射三個物體，相信是兩枚導彈及一架無人機，墜落在接近波蘭東南部的軍訓場地。\n\n俄烏戰事持續，烏克蘭多個地區及首都基輔繼續遇襲。俄羅斯總統普京曾揚言，要為烏方襲擊克里米亞大橋報復。俄軍被指曾出動攜帶集束彈頭的彈道導彈，擴大攻擊範圍，造成多人死傷。\n\n烏克蘭總統澤連斯基指，中美俄三國元首會晤後不久，當地就遇襲，他質疑會談成效。\n\n澤連斯基又接受美國有線新聞網絡CNN訪問，他將普京視為意圖徹底摧毀烏克蘭的「殺手」，又稱即使美國總統特朗普視普京是「朋友」，但美國仍是烏俄之間合適的斡旋方。\n\n特朗普周五在白宮總結訪華及菲律賓之行時，為「朋友論」護航，他稱普京希望以外交途徑結束戰事。對於俄軍最近向烏克蘭施襲，特朗普就稱，普京同澤連斯基都要負起相同責任。\n\n近日有傳媒報道，美方收到情報指，伊朗密謀在華盛頓引爆骯髒彈或化學武器，特朗普就稱，絕不容許此事發生。\n\n美國總統特朗普稱︰「有關他們(伊朗)製造骯髒彈的傳聞，若他們這樣做，我們很了解伊朗，知道他們說甚麼，身份是誰，在哪裡。我們絕不容許此事發生。」\n\n特朗普稱，跟國家主席習近平及普京討論，三國要攜手合作，阻止核威脅在全球擴散，並確保伊朗永遠不會擁有核武。\n\n特朗普又認為伊朗不想達成他能接受的協議，伊朗外長阿拉格齊就強調，仍相信可跟美國達成公平的解決方案，但德黑蘭不會讓國內濃縮軸運到海外。","image":"https://pro-vod-cdn.tvb.com/7f7c86d3f47e40bbaeba482ff5fa820a/snapshots/13a5c6be9f174fdda399ed189f3f1af8-00008.jpg","video":"https://pro-vod-cdn.tvb.com/7f7c86d3f47e40bbaeba482ff5fa820a/03938f43a8cf4886947ee3ef83cfe801-94357b60105580950d26401cf816c22b-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/7f7c86d3f47e40bbaeba482ff5fa820a/snapshots/13a5c6be9f174fdda399ed189f3f1af8-00008.jpg","lang":"zh-Hant"},{"id":"c35453922ea","title":"聯國秘書長｜哥斯達黎加前女副總統成大熱 傳面臨美俄兩國反對","url":"https://www.stheadline.com/realtime-world/3639511/聯國秘書長哥斯達黎加前女副總統成大熱-傳面臨美俄兩國反對","summary":"聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周。","summary_short":"聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周。","digest":"聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周","points":["聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周","目前，共有8位由聯合國成員國提名的候選人角逐秘書長之職，大多來自拉丁美洲或加勒比海地區…","根據安理會為衡量支持率而進行的一系列匿名意向投票…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T08:29:43+08:00","size":1,"keywords":[],"body":"聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周。目前，共有8位由聯合國成員國提名的候選人角逐秘書長之職，大多來自拉丁美洲或加勒比海地區，有五位是女性。\n根據安理會為衡量支持率而進行的一系列匿名意向投票，領先的候選人是哥斯達黎加前女副總統格林斯潘(Rebeca Grynspan)。\n她在11月5日的最後一次投票中獲得了12張「鼓勵」票和3張「反對」票(安理會有15個成員)。據報她似乎仍然面臨來自美國和俄羅斯的反對，這兩個國家有否決權。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca06a7d1305","title":"胰臟癌︱新藥丸能縮小或消除腫瘤 專家稱「數十年來最大躍進」","url":"https://www.stheadline.com/realtime-world/3639510/胰臟癌新藥丸能縮小或消除腫瘤-專家稱數十年來最大躍進","summary":"胰臟癌是本港致命癌症的第四位，近日出現重大治療突破。","summary_short":"胰臟癌是本港致命癌症的第四位，近日出現重大治療突破。","digest":"胰臟癌是本港致命癌症的第四位，近日出現重大治療突破","points":["胰臟癌是本港致命癌症的第四位，近日出現重大治療突破","美國一項早期臨牀試驗發現，一種每日服用的藥丸，可縮小甚至消除某些患有這種癌者患者的腫瘤","英國癌症研究基金會形容，這是胰臟癌治療「數十年來最大的躍進」"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T08:23:01+08:00","size":1,"keywords":[],"body":"胰臟癌是本港致命癌症的第四位，近日出現重大治療突破。美國一項早期臨牀試驗發現，一種每日服用的藥丸，可縮小甚至消除某些患有這種癌者患者的腫瘤。英國癌症研究基金會形容，這是胰臟癌治療「數十年來最大的躍進」。\n8.2%患者腫瘤「完全緩解」\n研究由紐約紀念斯隆凱特琳癌症中心牽頭，周五在西班牙巴塞隆拿舉行的歐洲癌症研究會議公布。第一、二期試驗涉及61名未曾就轉移性胰臟癌接受治療的患者，每日服用200毫克新型口服標靶藥daraxonrasib，並定期注射兩種化療藥。結果顯示，60.7%患者腫瘤縮小或消失，當中8.2%達「完全緩解」，即掃描已不見腫瘤；連同腫瘤無增大者，整體疾病控制率達90.2%。患者無惡化存活期中位數為12.8個月，1年整體存活率達76.6%。\n胰臟癌多於晚期才現症狀，確診時往往已擴散。接受傳統化療的轉移性患者，腫瘤一般5至6個月後再生長，整體存活期僅8至11個月，5年存活率約3%。新療法令患者無惡化存活期中位數逾一年，帶來延長壽命的希望。\n領導研究的腫瘤科醫生栢克（Wungki Park）指，過去數十年胰臟癌治療往往僅能延長存活期數月，今次卻有患者腫瘤在掃描中消失，令團隊驚訝，相信新療法有望改寫晚期患者確診後的首階段治療方案。\ndaraxonrasib針對癌細胞異常活躍的RAS蛋白，阻斷腫瘤生長訊號。逾九成胰臟癌涉RAS基因變異，部分肺癌及其他癌症亦有類似機制，團隊冀日後擴大應用。該藥今年8月獲美國食品及藥物管理局（FDA）批准。英國癌症研究基金會指結果振奮，惟試驗僅涉61人且欠化療對照組，難證較現有方案優勝多少。團隊正進行大型第三期隨機試驗，確認療效及長期存活，並評估皮疹、腹瀉、疲倦等副作用。專家提醒，掃描未見腫瘤，仍有可能復發，現階段不宜宣稱可治癒。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb8d9aa71e3","title":"特朗普：此次亚洲行未能见金正恩 总有一天会见面","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735616.shtml","summary":"中新网11月21日电 据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中，接受美国全国广播公司(NBC)记者采访时指出，由于行程繁忙，他此次未能与朝鲜最高领导人金正恩会面…","summary_short":"中新网11月21日电 据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中…","digest":"据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中…","points":["中新网11月21日电 据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中…","特朗普对记者说，“我们之间的关系还在，但这次没有见面","”特朗普补充道，“但我们总有一天会举行这场会谈"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T08:21:32+08:00","size":1,"keywords":[],"body":"中新网11月21日电 据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中，接受美国全国广播公司(NBC)记者采访时指出，由于行程繁忙，他此次未能与朝鲜最高领导人金正恩会面，并展现出继续推动双方会晤的意愿。\r\n\n　　据报道，特朗普对记者说，“我们之间的关系还在，但这次没有见面。”特朗普补充道，“但我们总有一天会举行这场会谈。”\n\n　　报道指出，特朗普在第一个总统任期内曾三次与金正恩会面。近期启程前往亚洲时，他曾提及再次与金正恩举行双边会谈的可能性。 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd43230679c","title":"日本民調指九成三受訪者認為日中關係欠佳 比例創歷史新高","url":"https://news.tvb.com/tc/1207574-日本民調指九成三受訪者認為日中關係欠佳比例創歷史新高","summary":"日本政府最新民調顯示，有九成三受訪者認為日中關係欠佳，比例創歷史新高。國家主席習近平，周三在亞太經合組織會議跟多個經濟體領袖，包括日本首相高市早苗握手，但中日首腦沒有舉行會談。","summary_short":"日本政府最新民調顯示，有九成三受訪者認為日中關係欠佳，比例創歷史新高。","digest":"日本政府最新民調顯示，有九成三受訪者認為日中關係欠佳，比例創歷史新高","points":["國家主席習近平，周三在亞太經合組織會議跟多個經濟體領袖，包括日本首相高市早苗握手…","日本內閣府昨日公布外交相關輿論調查，認為日中兩國關係「不算良好」的受訪者比例多達百分之93…","外務省官員表示，這項結果反映日中關係面臨各種問題，不過約有七成受訪者認為…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T07:49:00+08:00","size":1,"keywords":["日本","中國"],"body":"日本政府最新民調顯示，有九成三受訪者認為日中關係欠佳，比例創歷史新高。\n\n國家主席習近平，周三在亞太經合組織會議跟多個經濟體領袖，包括日本首相高市早苗握手，但中日首腦沒有舉行會談。\n\n日本內閣府昨日公布外交相關輿論調查，認為日中兩國關係「不算良好」的受訪者比例多達百分之93，較去年增加6.6個百分點，另有百分86.4的日本受訪者認為跟中國沒有親近感，為2020年以來第2高。\n\n外務省官員表示，這項結果反映日中關係面臨各種問題，不過約有七成受訪者認為，未來發展日中關係相當重要。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ISgbWYINbQ1795218640.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/5418005b58b2415aa78e36e8b5b12d5a/b00d38c9656143e6a9c45370c755da93-feaf5db30dd3bdd677ef19cbac0debb0-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ISgbWYINbQ1795218640.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"}]},{"name":"民生","total":37,"items":[{"id":"c56dd875f3b","title":"黄河进入2026—2027年度凌汛期","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735702.shtml","summary":"中新社郑州11月21日电 中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时，黄河内蒙古包头至头道拐河段出现流凌，流凌长度累计34千米。","summary_short":"中新社郑州11月21日电 中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…","digest":"中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…","points":["中新社郑州11月21日电 中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…","首凌日期与常年(1971年至2025年均值)持平","凌汛是指冬春季节河流因冰凌阻塞河道导致水位上涨的水文现象"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:41:45+08:00","size":2,"keywords":[],"body":"中新社郑州11月21日电 中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时，黄河内蒙古包头至头道拐河段出现流凌，流凌长度累计34千米。首凌日期与常年(1971年至2025年均值)持平。黄河即日起进入2026—2027年度凌汛期。\n\n　　凌汛是指冬春季节河流因冰凌阻塞河道导致水位上涨的水文现象。河流从低纬度流向高纬度，且河道形态呈上宽下窄、弯曲回环的地方，容易出现凌汛。\n\n11月21日，黄河内蒙古段五犋牛浮桥处流凌。张瑞锋 摄\n\n　　11月21日黄河内蒙古段出现首凌后，黄委即刻启动防凌工作机制。黄委要求，各级各单位压紧压实防凌责任，将防范极端风险贯穿监测预警、会商研判、调度指挥、应急值守、巡查防守、抢险处置、转移安置等各环节；强化监测预报预警，科学精细调度水库，塑造适宜的封河流量过程；全面开展隐患排查，梳理风险点清单，明确处置措施和责任单位；严格浮桥与施工栈桥管理，确保河道行凌畅通；科学调度骨干水工程，全面做好各项防凌工作，全力确保本年度黄河防凌安全。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"黄河进入2026—2027年度凌汛期","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735702.shtml","source_display":"中國新聞網","published_at":"2026-11-21T13:41:45+08:00","category":"民生","digest":"中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…"},{"title":"黄河内蒙古段进入2026至2027年度凌汛期","url":"https://www.jiemian.com/article/15357658.html","source_display":"界面新聞","published_at":"2026-11-21T10:57:59+08:00","category":"","digest":"内蒙古自治区防汛抗旱指挥部办公室消息，受近期冷空气过程影响，11月21日8时…"}],"cross":{"total":2,"angles":[{"point":"中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/sh/2026/11-21/10735702.shtml"},{"point":"内蒙古自治区防汛抗旱指挥部办公室消息，受近期冷空气过程影响，11月21日8时…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15357658.html"}]}},{"id":"c05345dec23","title":"（乡村行·看振兴）广西梧州“允许抱球跑”的女篮赛：球场“不讲究” 跑出乡村新气象","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735786.shtml","summary":"中新网梧州11月21日电 题：广西梧州“允许抱球跑”的女篮赛：球场“不讲究” 跑出乡村新气象  　　作者 林洁琪 张广权  　　种养农户、村干部、返乡创业者、全职宝妈……","summary_short":"中新网梧州11月21日电 题：广西梧州“允许抱球跑”的女篮赛：球场“不讲究” 跑出乡村新气象  　　作者 林洁琪 张广权…","digest":"题：广西梧州“允许抱球跑”的女篮赛：球场“不讲究” 跑出乡村新气象  　　作者 林洁…","points":["种养农户、村干部、返乡创业者、全职宝妈……一场“欢乐乡村女篮”区级赛…","“白天在家忙农活、照看家人，晚上抽空和姐妹们一起练球，输赢不重要，开心最重要","三年来，吸引了龙圩区4个镇85个村(社区)，近300支村(社区)队伍…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:28:09+08:00","size":1,"keywords":[],"body":"中新网梧州11月21日电 题：广西梧州“允许抱球跑”的女篮赛：球场“不讲究” 跑出乡村新气象\n\n　　作者 林洁琪 张广权\n\n　　种养农户、村干部、返乡创业者、全职宝妈……一场“欢乐乡村女篮”区级赛，11月20日晚在广西梧州市龙圩区世纪广场篮球馆内开打，乡村女性从田间地头走到舞台中央，尽情展现自信拼搏、团结协作的精神面貌。\n\n图为比赛现场。梧州市龙圩区融媒体中心供图\n\n　　“白天在家忙农活、照看家人，晚上抽空和姐妹们一起练球，输赢不重要，开心最重要。”龙圩区大坡镇参赛队员李洁清说。篮球场对她们来说，早已不是竞技比拼的场地，更是新时代女性绽放“她力量”的舞台。\n\n　　“欢乐乡村女篮”是梧州市龙圩区连续三年精心培育打造的乡村文体IP，以篮球为纽带，彰显文明乡风，绽放乡村巾帼风采。三年来，吸引了龙圩区4个镇85个村(社区)，近300支村(社区)队伍、约4000名龙圩女性站上赛场竞技比拼。\n\n　　一项乡村赛事为何越办越热？答案藏在“不讲究”里——不纠结走步，允许抱球跑，有的民众甚至叫它“橄篮球”。“冇规矩”让赛事更具人情味，跳出传统篮球的技术桎梏，把欢乐至上、全民参与落到实处。\n\n　　奖项设置同样乡土味十足，除竞技名次外，还设立最佳拼搏奖、最佳宣传奖、十佳推荐官等特色奖项，烤乳猪、青头鸭等本土农货成为赛场奖品，热度转化为可观、可触、可享的民生实惠，让赛事更聚人气、留住乡情。\n\n图为开幕式现场。梧州市龙圩区融媒体中心供图\n\n　　这场赛事早已成为一场展现龙圩区乡风文明、凝聚民众、农文体融合的赛事。开幕现场，龙圩镇村民跟随音乐，生动展示滚铁环、卖冰棍、交公粮等20世纪80年代怀旧生活场景；大坡镇村民的松树盆景、叶脉时装分外吸睛，河步白斩鸭、胜洲猪头皮香飘全场；广平镇村民以高山流水迎客礼登场，“一条板凳聚民心”的创意展演尽显壮乡温情；新地镇的舞狮与农用无人机同台亮相，展现传统农业向现代农业转型的蓬勃生机……赛场内外交融成一片欢乐的海洋。\n\n　　一颗篮球带来的改变，远不止赛场。赛场之外，直播间同步开启赛事直播，舞狮舞龙等非遗技艺轮番亮相，六堡茶、时令农特产品实现云端推介，乡村振兴的路子在球场边越走越宽。\n\n图为开幕式现场。梧州市龙圩区融媒体中心供图\n\n　　“自从有了女篮比赛，村里晚饭后扎堆练球的人多了，扎堆打牌的人少了，矛盾也少了很多，有人参加比赛，也有人加油助威，都想为村子出一份力。”新地镇村民李翠霞说。\n\n　　更深的变化发生在村与村、邻与邻之间。各村组队参赛，乡亲跨村观赛，村民自发组建啦啦队、志愿服务队，还主动承担赛事服务保障。包容和睦的乡风在一次次传球与呐喊中自然生长。\n\n　　据悉，本届赛事在总结往年办赛经验的基础上，继续以篮球为载体凝聚乡村巾帼力量，深化农文体旅融合，串联产业兴、文化旺、乡风淳、治理优各项目标，奋力绘就多元协同与全域向好交织的乡村振兴图景。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb9cf1ae151","title":"中外儿童齐聚广州共唱粤语童谣","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735783.shtml","summary":"中新网广州11月21日电 (记者 张璐)广州市第二届“广府童谣”传唱暨儿童友好成果展示主场活动(简称“活动”)20日晚在广州市白鹅潭大湾区艺术中心户外舞台举行。","summary_short":"中新网广州11月21日电 (记者 张璐)广州市第二届“广府童谣”传唱暨儿童友好成果展示主场活动(简称“活动”)20日晚在…","digest":"广州市第二届“广府童谣”传唱暨儿童友好成果展示主场活动(简称“活动”)20日晚在广州…","points":["中新网广州11月21日电 (记者 张璐)广州市第二届“广府童谣”传唱暨儿童友好成果展示主场活…","约500名儿童参与演出，包括来自澳大利亚、韩国、约旦等13个国家或地区的儿童","本次活动全部由儿童演绎，来自广州的儿童表演团队带来了形式多样、各具特色的粤语童谣节目…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:20:31+08:00","size":1,"keywords":[],"body":"中新网广州11月21日电 (记者 张璐)广州市第二届“广府童谣”传唱暨儿童友好成果展示主场活动(简称“活动”)20日晚在广州市白鹅潭大湾区艺术中心户外舞台举行。约500名儿童参与演出，包括来自澳大利亚、韩国、约旦等13个国家或地区的儿童。\n\n活动现场。　广州市妇女联合会 供图\n\n　　据介绍，活动通过粤语童谣传唱与亚太地区儿童开展文化交流，集中展示广州儿童友好城市建设成果。\n\n　　本次活动全部由儿童演绎，来自广州的儿童表演团队带来了形式多样、各具特色的粤语童谣节目，通过经典传唱、创意改编、童声合唱等形式，展现广府童谣的独特韵味。\n\n　　此外，来自国外的儿童代表也加入其中，一同参与经典粤语童谣传唱，用童趣的舞蹈演绎岭南文化的灵动韵味。广州儿童与国外儿童携起手，以歌声为媒、以童心为桥，在共同演唱和互动交流中增进理解、建立友谊。\n\n　　近年来，广州推动成立300多个各级各类儿童观察团，打造“小小规划师”“荔童参事”等儿童参与品牌；持续开展“羊城少年心向党”广州童谣征集传唱和“羊城小市长”系列活动；举办“最美家风进校园”“绿美阳台·优良家风”等活动2000多场，20多万人次参与活动，并在全国率先组建城市体检少年观察员队伍。\n\n　　据介绍，未来，广州将继续坚持儿童优先发展理念，持续完善儿童友好城市建设机制，拓展儿童成长空间，提升儿童公共服务水平，健全儿童参与机制，让儿童友好融入城市发展的更多领域和场景，让每一个孩子都能在这座城市安心生活、快乐成长。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c954b64dd01","title":"广西柳州通报打击非法猎捕贩卖野生鸟类 抓捕涉案人员35人","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735771.shtml","summary":"中新网柳州11月21日电 11月20日，广西柳州市林业和园林局发布通报称，2026年10月，接到关于该市融水、三江两县出现涉非法猎捕贩卖野生鸟类的举报线索后，柳州市林业和园林局会同公安机关…","summary_short":"中新网柳州11月21日电 11月20日，广西柳州市林业和园林局发布通报称，2026年10月，接到关于该市融水…","digest":"11月20日，广西柳州市林业和园林局发布通报称，2026年10月，接到关于该市融水…","points":["中新网柳州11月21日电 11月20日，广西柳州市林业和园林局发布通报称，2026年10月…","通报称，截至目前，共立案33起，抓捕涉案人员35人，查获捕鸟网705张…","相关媒体曝光的涉案人员、餐饮店均已被查处"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T16:47:49+08:00","size":1,"keywords":[],"body":"中新网柳州11月21日电 11月20日，广西柳州市林业和园林局发布通报称，2026年10月，接到关于该市融水、三江两县出现涉非法猎捕贩卖野生鸟类的举报线索后，柳州市林业和园林局会同公安机关，对涉事区域实行全域拉网清查，对相关违法犯罪行为实施严厉打击。\r\n\n　　通报称，截至目前，共立案33起，抓捕涉案人员35人，查获捕鸟网705张、诱鸟器等作案工具80件。相关媒体曝光的涉案人员、餐饮店均已被查处。\n\n　　为全面提升民众爱鸟护鸟意识，柳州市林业和园林局将不断完善工作机制，深化“林长＋警长”合作，强化部门协作，加强市场监管，鼓励公众举报违法犯罪线索，坚决纠正捕鸟、斗鸟、食鸟陋习，严厉打击并公开曝光各类破坏野生动植物资源的违法犯罪行为，持续凝聚全社会共同保护野生动植物的强大合力，守护好该市生态资源。\n\n　　通报称，诚恳欢迎社会各界、广大民众持续当好野生动植物保护的宣传员、监督员，如发现乱捕滥猎、非法买卖、滥食野生动物等违法线索，请拨打110或0772－2828574、0772－2836820举报。经查证属实的有效线索，举报人可获得200元至2000元奖励。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0a417341ea","title":"（走进中国乡村）新雪季新疆“冰雪小镇”迎客忙","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735765.shtml","summary":"中新社新疆富蕴11月21日电 (记者 苟继鹏)“作为本雪季中国首家开滑的室外高山滑雪场，自今年10月20日新雪季开板以来，我们已累计接待游客超7.5万人次，开局即火热。","summary_short":"中新社新疆富蕴11月21日电 (记者 苟继鹏)“作为本雪季中国首家开滑的室外高山滑雪场…","digest":"“作为本雪季中国首家开滑的室外高山滑雪场，自今年10月20日新雪季开板以来…","points":["中新社新疆富蕴11月21日电 (记者 苟继鹏)“作为本雪季中国首家开滑的室外高山滑雪场…","”新疆富蕴县的可可托海国际滑雪度假区营销企划部员工赵婷玉21日说","当日走进位于度假区旁的可可托海镇塔拉特村，村民库丽帕然·哈布力哈孜正在自家民宿里收拾客房…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T16:37:57+08:00","size":1,"keywords":[],"body":"中新社新疆富蕴11月21日电 (记者 苟继鹏)“作为本雪季中国首家开滑的室外高山滑雪场，自今年10月20日新雪季开板以来，我们已累计接待游客超7.5万人次，开局即火热。”新疆富蕴县的可可托海国际滑雪度假区营销企划部员工赵婷玉21日说。\n\n　　记者当日走进位于度假区旁的可可托海镇塔拉特村，村民库丽帕然·哈布力哈孜正在自家民宿里收拾客房，她家是村里首批开办民宿的农户之一。“今冬前来滑雪的游客更多，这几天我家的民宿天天满客。”\n\n11月17日，在新疆富蕴县的可可托海国际滑雪度假区内，滑雪爱好者在雪道上畅滑。　阿妮斯娅·木尔扎别克 摄\n\n　　“以前全家人靠种地放牧为生，现在开办民宿，夏秋接待研学团队、冬春服务滑雪游客，还附带提供骑马体验项目，一年纯收入超10万元人民币。”库丽帕然说，如今守着家门口这座雪山，就像守着一座“金山”。\n\n　　“刚开始时，村民对办民宿没概念，心里都打鼓。”塔拉特村党支部书记沙拉·恩特马克说，为打消大家的顾虑，村干部带着村民前往外地考察学习，当地政府部门还专门组织烹饪、客房服务等技能培训，帮助村民提升接待水平。如今，旅游收入占村民年收入的七成，曾靠放牧种地讨生活的农牧民，稳稳端上“冰雪饭碗”。\n\n11月20日，夜晚的新疆富蕴县可可托海镇塔拉特村灯火通明。　林俏俏 摄\n\n　　冰雪热也带动越来越多当地年轻人返乡。家住可可托海镇的库丽恰提·木合亚提在2020年大学毕业后返乡就业，成为度假区的一名缆车司机。“在家门口就业，既有稳定收入，也能照顾父母。”她告诉记者，如今身边同事有一半以上是本地年轻人。\n\n　　地处阿尔泰山前山地带的可可托海镇，是一个由矿区转型的旅游小镇。近年来，这个冰雪小镇凭借降雪丰沛、山体落差大、雪期超长的优势，推动冰雪产业发展。\n\n　　“一到冬天，冰雪旅游就能带动全镇忙碌起来。”可可托海镇党委书记徐波说，该镇将冰雪旅游作为转型发展的重要产业，跳出单一滑雪、浅层观光模式，推动文旅消费从打卡看风景向深度沉浸式体验升级，冰雪旅游正带动当地越来越多民众增收致富。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c242aeb6a86","title":"藏羚羊正值交配期 西藏那曲营造“不被打扰”的栖息环境","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735766.shtml","summary":"中新社西藏那曲11月21日电 初冬的藏北高原，寒风凛冽，羌塘国家级自然保护区内，管护员正如常开展巡护工作。","summary_short":"中新社西藏那曲11月21日电 初冬的藏北高原，寒风凛冽，羌塘国家级自然保护区内，管护员正如常开展巡护工作。","digest":"初冬的藏北高原，寒风凛冽，羌塘国家级自然保护区内，管护员正如常开展巡护工作","points":["中新社西藏那曲11月21日电 初冬的藏北高原，寒风凛冽，羌塘国家级自然保护区内…","那曲市林业和草原局21日介绍，依托日益完善的管护网络与科技手段…","那曲市地处青藏高原腹地，平均海拔4500米，拥有羌塘、色林错…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T16:32:02+08:00","size":1,"keywords":[],"body":"中新社西藏那曲11月21日电 初冬的藏北高原，寒风凛冽，羌塘国家级自然保护区内，管护员正如常开展巡护工作。那曲市林业和草原局21日介绍，依托日益完善的管护网络与科技手段，当地正为藏羚羊等野生动物营造“不被打扰”的栖息环境。\n\n　　那曲市地处青藏高原腹地，平均海拔4500米，拥有羌塘、色林错、麦地卡湿地等3处国家级自然保护区，藏羚羊、野牦牛、黑颈鹤等中国国家一级保护动物在此栖息。\n\n2025年12月19日，羌塘国家级自然保护区内的藏羚羊群。　李林 摄\n\n　　自2015年组建羌塘国家级自然保护区那曲管理局以来，当地已建成36个管理站，形成一张由管护员、村级野保员、生态警务人员和普通牧民共同织起的保护网络。\n\n　　“现阶段我们主要是定点巡护和日常区域的巡护工作。”羌塘国家级自然保护区那曲市尼玛县罗布玉杰野生动物管护站站长格桑伦珠介绍，针对藏羚羊交配期，管护员的工作重心也会有所调整，做到尽量不干扰、不打扰野生动物的繁殖。\n\n　　除了人力巡护构成的“软隔离”，科技手段正成为保护工作的新支点。那曲市林业和草原局自然保护地管理科科长谢昆军介绍，依托高通量卫星数据传输“天空地”一体化生态监测体系，可对进入监测范围内的野生动物进行数量统计。目前，那曲市正在推进物联网监控体系建设，未来工作人员在监控室即可查看野外实时画面，进一步降低人员进入核心区带来的干扰。\n\n　　保护力度加大，野生动物的“可见度”也在提升。据统计，那曲境内藏羚羊种群数量已从原来的5万余只增至约15万至20万只，野牦牛从1000余头恢复到1万余头。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2b55df88b1","title":"历史经典产业博览会开幕 浙阿交流成果亮相阿克苏展区","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075657.shtml","summary":"11月20日，首届历史经典产业博览会在浙江杭州开幕。","summary_short":"11月20日，首届历史经典产业博览会在浙江杭州开幕。","digest":"11月20日，首届历史经典产业博览会在浙江杭州开幕","points":["11月20日，首届历史经典产业博览会在浙江杭州开幕","本届博览会以“经典传承 新质兴业”为主题，设置国际丝绸展示区，产业综述展区，陕西…","其中，新疆(阿克苏)展区依托浙阿历史经典产业交流互鉴行动实施以来的成果…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T16:13:12+08:00","size":1,"keywords":[],"body":"11月20日，首届历史经典产业博览会在浙江杭州开幕。本届博览会以“经典传承 新质兴业”为主题，设置国际丝绸展示区，产业综述展区，陕西、河南等8个省份展区，浙江及其11个地市展区，以及丝绸、茶叶、瓷器、中药、酿造、工艺美术等六大行业展区，共计400余家企业参展亮相。其中，新疆(阿克苏)展区依托浙阿历史经典产业交流互鉴行动实施以来的成果，集中展示阿克苏地区丰富非遗资源、深厚文化底蕴和浙阿联名共创新品。(林波 孙琳茹）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/56A8E8C304F94BDABC1F323D4B91685F.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c417397347c","title":"安徽东至一4岁男童走失 多方持续全力搜寻","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735742.shtml","summary":"中新网合肥11月21日电(记者 赵强)安徽省东至县青山乡一名4岁男童走失已超过45小时，当地多方力量仍在全力搜寻。","summary_short":"中新网合肥11月21日电(记者 赵强)安徽省东至县青山乡一名4岁男童走失已超过45小时，当地多方力量仍在全力搜寻。","digest":"安徽省东至县青山乡一名4岁男童走失已超过45小时，当地多方力量仍在全力搜寻","points":["中新网合肥11月21日电(记者 赵强)安徽省东至县青山乡一名4岁男童走失已超过45小时…","截至11月21日12时，尚未发现走失儿童下落","据青山乡人民政府21日发布的情况通报，11月19日14时40分…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T16:05:59+08:00","size":1,"keywords":[],"body":"中新网合肥11月21日电(记者 赵强)安徽省东至县青山乡一名4岁男童走失已超过45小时，当地多方力量仍在全力搜寻。截至11月21日12时，尚未发现走失儿童下落。\n\n情况通报。青山乡人民政府微信公众号截图。\n\n　　据青山乡人民政府21日发布的情况通报，11月19日14时40分，该乡双河村北屋组一名4岁男童从家中走失，走失时身穿米白色上衣、黑色裤子、白色鞋子。\n\n　　接报后，乡政府、公安、消防、社会救援力量及周边村民等多方第一时间投入搜寻，并调配无人机、警犬、皮划艇、声呐探测等专业设备，对男童住处后山、水库、周边民房等重点区域开展多轮搜索。\n\n　　通报称，搜寻工作仍在全力开展，恳请民众提供有效线索。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb970d30ff0","title":"给成长多一种可能 浙江综合高中改革试点“三校”观察","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735739.shtml","summary":"中新网杭州11月21日电(林波 曹丹 孙琳茹)在杭州市美术高级中学的画室里，高一学生徐进正对着石膏像起稿。","summary_short":"中新网杭州11月21日电(林波 曹丹 孙琳茹)在杭州市美术高级中学的画室里，高一学生徐进正对着石膏像起稿。","digest":"在杭州市美术高级中学的画室里，高一学生徐进正对着石膏像起稿","points":["中新网杭州11月21日电(林波 曹丹 孙琳茹)在杭州市美术高级中学的画室里…","入学前她几乎没有拿过画笔，中考结束后一度以为自己的升学选择十分有限","如今她注册的是普通高中学籍，课表上既有语数英、政史地等普高文化基础课程，又有素描、图创…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T15:58:05+08:00","size":1,"keywords":[],"body":"中新网杭州11月21日电(林波 曹丹 孙琳茹)在杭州市美术高级中学的画室里，高一学生徐进正对着石膏像起稿。入学前她几乎没有拿过画笔，中考结束后一度以为自己的升学选择十分有限。如今她注册的是普通高中学籍，课表上既有语数英、政史地等普高文化基础课程，又有素描、图创、摄影等职业体验课程。\n\n　　“老师是从怎么握笔教起的。”徐进说。\n\n　　在浙江，中考的分岔路口正在慢慢拓宽。作为综合高中改革试点，一批学校在普高序列招生、落实普高学籍，同时打通职业体验、技能学习与多元升学通道。杭州市美术高级中学、衢州江山市综合高级中学、温州艺文综合高级中学，走出了三种不同底色的融通育人路径。\n\n近日，杭州美术高级中学教师在画室教授绘画技巧。　林波 摄\n\n　　以艺为基，拓宽特色赛道\n\n　　杭州市美术高级中学的前身，是1979年就开办职业高中班的杭州市美术职业学校，2026年增名“杭州市美术高级中学”，成为浙江首批、杭州首个综合高中试点校。\n\n　　该校党委书记俞松涛把办学模式概括为“一校双轨、职普并行、双向融通、特色赋能”。“学生注册普高学籍、享受普高文化教育资源，同时保留艺术职业成长通道。”\n\n　　而在实践中，学校并不赞同把两类课程简单叠加。\n\n　　俞松涛说，学校构建的是“普高文化基础+艺术特色素养+职业启蒙体验”的融通课程体系，高一夯实文化与艺术基础，高二起学生可按学情、兴趣，自主、渐进地选择普通高考、艺术高考或职教高考。\n\n　　此外，学校为每名学生配备校园导师，学生的升学方向，就是在一对一谈话中一点点清晰起来的。\n\n　　“改革的初衷，是给学生多一点沉淀的时间，多一条选择的赛道。”俞松涛说，学校最终目标，是实现从“育分”向“育人”的转型，立足杭州文创产业优势，培育兼具文化素养与艺术能力的应用型人才。\n\n江山市综合高级中学学生在学习计算机专业的《图形图像处理》。资料图，江山市综合高级中学供图\n\n　　县域破局，托举基础薄弱学子\n\n　　扎根衢州江山的江山市综合高级中学由衢州第二中专申报创建，2025年正式纳入普通高中第二批次招生，是浙江首批综合高中试点里典型的县域探索样本。\n\n　　县域生源有着差异化的学习基础，不少学生更适合节奏舒缓、分层引导的学习安排。\n\n　　江山市综合高级中学校长吴晓彩和团队没有照搬现成办学模板，而是依托中专多年职普融通积累下的师资、实训资源，以“四融合、四优化”为主线，搭建适配本地学生的育人体系。\n\n　　学校实行“一套班子、统筹运行”，实训场地、教学设备共享共用，文化课教师和中专专业教师协同教学。\n\n　　面对学生差异化的学习难题，学校柔性设置课程：理化科目按需选课走班，为英语薄弱学生免费开设日语课程；每周留出固定课时，开设机械、旅游、园艺、电商等多门类职业体验课，让学生在动手体验中认识职业、找到方向。\n\n　　师资队伍的搭配，也是一次务实的探索。教师队伍里既有中职转岗骨干、普高选调教师，也有擅长共情引导、善于重建学生学习信心的转岗教师。\n\n　　贴合学情的教学方式，慢慢转化为看得见的进步：学校首届新生录取位次在当地普通高中相对靠后，但经过一学期打磨，学科整体成绩实现稳步提升。\n\n　　吴晓彩坦言，试点前行路上仍有现实难题待破解，这也是改革探索必经的过程。\n\n温州艺文综合高级中学学生在上艺术设计融通课程。资料图，温州艺文综合高级中学供图\n\n　　文脉承续，搭建多元平台\n\n　　温州艺文综合高级中学，依托有着85年师范办学历史的温州市中等幼儿师范学校，是温州首批省级综合高中试点校，2025年迎来首届新生。\n\n　　校长侯伯念定下“文化强基、艺术扬长、技术赋能”的办学方向，依托深厚的艺术教育底蕴，打造艺文融合的育人范式。\n\n　　学校采取学分制，在开设普高“语数外+政史地”文化课程的基础上，每周二、周五下午安排了两个半天的融通课程，学生可以自主走班选择音乐、美术、舞蹈、语言及无人机操控与维护、园林技术、航空服务等职业技能类课程，“一生一方案”构建“3+3+N”课程体系，打通“普职课程”的学分互认，为每个学生开辟一条“同向双车道”的快速路。\n\n　　金锦程就是在一轮轮体验中，先后接触艺术设计、园林技术、电子电工等职业体验课程，最终找准兴趣，确定职教高考方向，深耕电子电工专业。目前学生选择普通高考、艺术高考和职教高考路线分别占40%、40%和20%。多元“出口”，让每个学生都能找到适合自己的成长路径。\n\n　　侯伯念表示，学校近50名专职艺术教师、上百间专业艺术教室和现代化实训场地，为选择性课程落地提供支撑。学校还建立三年周期的生涯规划体系，高一探索兴趣、高二定向选择、高三冲刺备考，配合分层辅导、教研共同体联动，让多元成才的通道走得通、走得稳。\n\n　　从杭州画室里从零学画的学子，到江山课堂上慢慢重拾信心的县域少年，再到温州在不同课程里感知寻路的学生，综合高中试点正助力更多孩子去寻找契合自身的成长节奏。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cced3740945","title":"联合国助理秘书长：中国儿童事业长足进步","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075654.shtml","summary":"11月20日，联合国助理秘书长、联合国儿童基金会副执行主任泰德·柴班在北京出席“携手向光前行 点亮儿童未来”世界儿童日暨联合国儿童基金会成立80周年主题活动。","summary_short":"11月20日，联合国助理秘书长、联合国儿童基金会副执行主任泰德·柴班在北京出席“携手向光前行 点亮儿童未来”世界儿童日暨…","digest":"11月20日，联合国助理秘书长…","points":["11月20日，联合国助理秘书长、联合国儿童基金会副执行主任泰德·柴班在北京出席“携手向光前行…","他表示，在中国，持续的政治意愿和人力资本投入，推动儿童事业发展取得长足进步…","“如今，中国已能为其他国家提供支持，并成为联合国儿基会最重要的合作伙伴之一"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:54:37+08:00","size":1,"keywords":[],"body":"11月20日，联合国助理秘书长、联合国儿童基金会副执行主任泰德·柴班在北京出席“携手向光前行 点亮儿童未来”世界儿童日暨联合国儿童基金会成立80周年主题活动。他表示，在中国，持续的政治意愿和人力资本投入，推动儿童事业发展取得长足进步，包括消除绝对贫困，完成多项与儿童相关的联合国可持续发展目标指标。\n\n“如今，中国已能为其他国家提供支持，并成为联合国儿基会最重要的合作伙伴之一。”\n\n柴班表示，自己在今年早些时候访问加沙地带时，亲眼见证了这一伙伴关系带来的影响：“中国支持联合国儿基会，提供挽救生命的医疗和过冬物资”。\n\n柴班称，中国支持联合国儿基会应对冲突和灾害的应急响应工作，支持在低收入国家实施的发展项目，并为推动全球加快实现联合国可持续发展目标作出贡献。在可再生能源领域，中国也正走在世界前列，并在应对气候变化、数字和人工智能领域为儿童创造机遇中发挥着重要作用。\n\n柴班表示，增进儿童福祉源于一次次的选择。他呼吁各方选择倾听儿童心声，选择投资儿童、维护儿童权利、守护儿童福祉。“因为选择儿童，就是选择全人类更美好的明天。”(记者 官逸伦 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/2DA6FC7CD3274FD78C3679E0BF1441D4.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cfc9a4ee3c1","title":"中国电影博物馆举办电影中的长征专题展","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075652.shtml","summary":"11月20日，由中国电影博物馆策划举办的“光影颂魂 征途永续——电影中的长征专题展”开幕。","summary_short":"11月20日，由中国电影博物馆策划举办的“光影颂魂 征途永续——电影中的长征专题展”开幕。","digest":"中国电影博物馆举办电影中的长征专题展","points":["11月20日，由中国电影博物馆策划举办的“光影颂魂 征途永续——电影中的长征专题展”开幕","中国电影博物馆立足馆藏红色电影资源，以银幕光影为媒回望英雄史诗，赓续红色血脉","本次展览遴选不同历史时期近30部长征题材代表性影片，将电影艺术叙事与长征真实历史进程对照…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:54:19+08:00","size":1,"keywords":[],"body":"11月20日，由中国电影博物馆策划举办的“光影颂魂 征途永续——电影中的长征专题展”开幕。中国电影博物馆立足馆藏红色电影资源，以银幕光影为媒回望英雄史诗，赓续红色血脉。\n\n本次展览遴选不同历史时期近30部长征题材代表性影片，将电影艺术叙事与长征真实历史进程对照，打造“影像叙事+史实佐证”观展体验，让影像与史料成为观众读懂长征、感悟信仰力量的重要入口。\n\n展览打造“光影先驱——参加过长征的电影人”特色板块，系国内首次集中梳理、研究参加过长征的电影工作者的生平事迹、影像实践与历史贡献。以馆藏珍贵台本、创作手稿、影片道具、连环画等实物文献为核心支撑，辅以经典长征题材影片混剪资料，构建“实物叙事+光影呈现”的立体化展陈体系。(记者 徐婧 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/D2FA2E6F063444BEB191817D434491E6.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cecfc625d66","title":"做好冬季电煤保供运输“加减法” 守护万家冬日暖意","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735736.shtml","summary":"央视网消息：眼下，全国多地遭遇大风降温天气，各地采暖、生产用能需求加大。","summary_short":"央视网消息：眼下，全国多地遭遇大风降温天气，各地采暖、生产用能需求加大。","digest":"央视网消息：眼下，全国多地遭遇大风降温天气，各地采暖、生产用能需求加大","points":["央视网消息：眼下，全国多地遭遇大风降温天气，各地采暖、生产用能需求加大","我国西煤东运主要通道大秦铁路全力保障冬季电煤运输顺畅，日运量保持在120万吨以上","来到山西大同的大秦铁路湖东编组场"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T15:16:30+08:00","size":1,"keywords":[],"body":"央视网消息：眼下，全国多地遭遇大风降温天气，各地采暖、生产用能需求加大。我国西煤东运主要通道大秦铁路全力保障冬季电煤运输顺畅，日运量保持在120万吨以上。\n\n　　记者来到山西大同的大秦铁路湖东编组场。什么是编组场？就是把山西、陕西、内蒙古，包括其他一些地方的煤炭，从煤炭装车点、储煤基地运好煤之后，就到这里集结，进行统一编组，再发出，运往河北秦皇岛。眼下，这里每天就运出煤炭超过 120 万吨。\n\n　　大秦铁路西起山西大同、东至河北秦皇岛，是我国西煤东运的重要通道，年运量保持在4亿吨左右。入冬以来，降温、大风天气频发，居民采暖、工业生产用能需求持续攀升，电煤保供运输压力增大。铁路方面开辟电煤运输绿色通道，动态优化运输组织，加密重载列车开行频次，做好设备巡检和安全管控，全力保障冬季电煤运输安全顺畅。\n\n　　相关工作人员表示，一方面在煤源上做加法，原来主要运输山西、内蒙古、陕西地区的煤炭，今年通过拓宽煤炭来源，将新疆地区的煤炭引流到山西地区后，与本地煤炭进行掺配 ；另外一方面在分析上做整合，把煤矿供给、港口生产、电厂需求、进口市场等各端数据进行整合，建成煤炭市场监测体系，及时调配车流，保障迎峰度冬的运输需求。\r\n\n　　作为大秦铁路电煤保供的前端货源保障主体，大同铁路物流中心靠前统筹供需两端，持续对接上游煤矿生产、下游电厂用煤及港口接卸情况，实时掌握煤炭产能、库存、消耗动态，精准匹配煤源与运力，通过一体化物流统筹、全链条衔接服务，打通从矿区集结、铁路重载运输到港口、电厂终端的完整运输链条，保障冬季电煤运输高效周转。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8caaa5fba0","title":"湖南“草根超模”邝美：乡野走出“国际范”","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-21/news1075645.shtml","summary":"来自湖南永州新田县的邝美出生于2004年，从小心怀T台梦想，凭借创意走秀短视频走红网络，被网友称作“乡村版超模”。","summary_short":"来自湖南永州新田县的邝美出生于2004年，从小心怀T台梦想，凭借创意走秀短视频走红网络，被网友称作“乡村版超模”。","digest":"来自湖南永州新田县的邝美出生于2004年，从小心怀T台梦想…","points":["来自湖南永州新田县的邝美出生于2004年，从小心怀T台梦想，凭借创意走秀短视频走红网络…","在她的短视频作品里，她常将外婆家楼顶、乡间小路、古村落当作秀场，凭着有节奏的台步，把用旧衣…","(李盈 黄新 郑锋 湖南新田报道）"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T14:44:42+08:00","size":1,"keywords":[],"body":"来自湖南永州新田县的邝美出生于2004年，从小心怀T台梦想，凭借创意走秀短视频走红网络，被网友称作“乡村版超模”。在她的短视频作品里，她常将外婆家楼顶、乡间小路、古村落当作秀场，凭着有节奏的台步，把用旧衣、垃圾袋、床单改造的服装穿出“高级定制”的质感，在乡村走出自信风采。\n\n(李盈 黄新 郑锋 湖南新田报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/C3F93E60AD274127BB8D05489569BFC4.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c3e8baca173","title":"（走进中国乡村）广西浦北陈皮飘香四海 AI巡园助力精准种植","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735705.shtml","summary":"中新社广西钦州11月21日电 题：广西浦北陈皮飘香四海 AI巡园助力精准种植  　　中新社记者 杨陈  　　初冬时节，中国最大的大红柑(又称茶枝柑)产区广西钦州市浦北县，大红柑缀满枝头…","summary_short":"中新社广西钦州11月21日电 题：广西浦北陈皮飘香四海 AI巡园助力精准种植  　　中新社记者 杨陈  　　初冬时节…","digest":"题：广西浦北陈皮飘香四海 AI巡园助力精准种植  　　中新社记者 杨陈  　　初冬时…","points":["初冬时节，中国最大的大红柑(又称茶枝柑)产区广西钦州市浦北县，大红柑缀满枝头…","11月11日，广西钦州市浦北县三合镇大红柑标准化种植基地内，果树即将进入采摘期","浦北全县大红柑种植面积超19万亩，干果皮年产量逾1.6万吨…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:45:09+08:00","size":1,"keywords":[],"body":"中新社广西钦州11月21日电 题：广西浦北陈皮飘香四海 AI巡园助力精准种植\n\n　　中新社记者 杨陈\n\n　　初冬时节，中国最大的大红柑(又称茶枝柑)产区广西钦州市浦北县，大红柑缀满枝头，尚未集中采摘便已“名果有主”。\n\n　　大红柑被誉为“柑中之王”，是制作陈皮的上品，民间素有“一两陈皮一两金”之说。近日，一道陈皮莲子红豆沙亮相深圳APEC欢迎晚宴，让这味岭南“老味道”引发关注。\n\n11月11日，广西钦州市浦北县三合镇大红柑标准化种植基地内，果树即将进入采摘期。翟李强 摄\n\n　　浦北全县大红柑种植面积超19万亩，干果皮年产量逾1.6万吨，全产业链产值突破80亿元(人民币，下同)。\n\n　　浦北陈皮种植史可追溯至明清时期。64.62%的森林覆盖率，加上富硒土壤与“世界长寿之乡”的底子，形成了“生态+老树+富硒+长寿”的招牌。浦北陈皮讲究一个“老”字，当地有百万棵树龄数十年以上的老柑树，柑皮油室饱满，陈化之后口感醇厚。\n\n　　龙门镇林塘村委“90后”果农龙腾曾在深圳做外贸，2019年返乡创业，有100多亩柑林。“去年最忙时请了60多名临时工，凌晨提着麻袋守在烘干机旁等收陈皮。今年行情看涨，鲜果和初加工陈皮多被提前预订，连摘果、开果的人手都要预约，想留些‘私货’都难。”\n\n11月11日，果农在广西钦州浦北县大红柑种植园内管护果树。翟李强 摄\n\n　　三合镇大红柑标准化种植基地，则是另一种节奏。基地负责人冯深辉介绍，2022年建园初期全靠人工，700多亩需60多人管护；引进人工智能(AI)巡园、虫害识别及物候期识别系统后实现精准种植，人工成本省一大半，还带动全县200多个基地向智慧农业转型。“现在手机APP就能给出农事建议，为基地扩容提供科技支撑。”\n\n　　“过去本地人多到外省打工，如今通过鲜果和干皮销售、就近务工、电商经营等，已带动10万名民众就业增收。”浦北县陈皮产业发展中心主任覃祖添说。\n\n　　陈皮“陈久者良”，对储存要求极高。在浦北3万多平方米的陈皮智能公共仓里，陈皮经品质检测、精准分拣、区块链溯源后贴标入库，在仿自然仓环境下科学陈化。\n\n　　“客户在小程序就能查看实时监控和温湿度数据，目前仓储量超60万斤(1斤等于500克)，存满三年可在平台挂牌交易。”工作人员张宁说。\n\n　　陈皮理气健脾、燥湿化痰，既可入药入菜，也是凉茶、甜品的“灵魂”。在东南亚、北美等地华人社区，产地陈皮近年愈发受追捧。\n\n11月11日，广西钦州浦北陈皮产业园内陈列着陈皮“玫瑰”等文创产品。翟李强 摄\n\n　　“以前大家多是喝陈皮，现在更强调药食同源，提倡吃陈皮。”广西中皮健康产业有限公司总经理张勇介绍，企业已研发陈皮点心、陈皮花生、陈皮酱等“陈皮+”产品，年产值1000多万元，并推出陈皮胎柑手串、陈皮“玫瑰”等文创产品，还将加工残渣制成肥料。\n\n　　“浦北陈皮是一二三产业融合发展的富民产业。”浦北县陈皮产业发展工作专班办公室负责人王涛称，当地已培育6个陈皮产值超亿元村、285户超百万元户，23家加工企业进驻产业园。未来当地将在标准化、产量和产品丰富性上下功夫，全面提升浦北陈皮国际认可度与品牌影响力。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c10dd15ab73","title":"客家青年相聚海南 共谋自贸港发展机遇","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735704.shtml","summary":"中新网海口11月21日电 (张月和)世界客属第34届恳亲大会客家青年自贸港创新峰会20日在海南海口举行，海内外客家青年企业家、创业者代表等立足海南自贸港封关运作新起点，围绕产业创新、发展赛道…","summary_short":"中新网海口11月21日电 (张月和)世界客属第34届恳亲大会客家青年自贸港创新峰会20日在海南海口举行…","digest":"世界客属第34届恳亲大会客家青年自贸港创新峰会20日在海南海口举行…","points":["中新网海口11月21日电 (张月和)世界客属第34届恳亲大会客家青年自贸港创新峰会20日在海…","海南自贸港全岛封关运作以来，政策红利加快释放，流量集聚效应初显…","海南省客家商会青年联合会会长周春所在的公司主营工程咨询、招标代理项目管理等业务，他说…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:43:53+08:00","size":1,"keywords":[],"body":"中新网海口11月21日电 (张月和)世界客属第34届恳亲大会客家青年自贸港创新峰会20日在海南海口举行，海内外客家青年企业家、创业者代表等立足海南自贸港封关运作新起点，围绕产业创新、发展赛道、项目合作等话题展开交流。\r\n\n　　海南自贸港全岛封关运作以来，政策红利加快释放，流量集聚效应初显，越来越多的企业从“观望”变成“进场”。政策红利如何从“纸上”落到“账上”？企业最有发言权。\n\n　　海南省客家商会青年联合会会长周春所在的公司主营工程咨询、招标代理项目管理等业务，他说，随着自贸港建设推进，公司承接的咨询项目不仅增加了单笔合同金额，项目复杂度也明显提高。“这是因为政策把市场的‘池子’做大了。对来海南创业的客家青年而言，政策红利不是一张可直接兑现的‘支票’，而是一波接一波的项目机会。”\n\n　　主题分享环节中，广东省客家青年企业家联合会会长赖志光分享了依托海南自贸港建设机遇，在绿色产业、文化会展、出海发展等赛道的创业实践。广东省客家青年企业家联合会执行会长周运贤提出，依托海南自贸港政策与全球客属网络，可以“算力×储能×跨境贸易”构建海南自贸港数字出海新生态。\n\n　　“海南自贸港发展机遇难得，客家青年抱团发展更有力量。”广东省客家青年企业家联合会副会长兼执行会长钟权华表示，将积极对接参会企业家和青年人才，互通资源、洽谈项目，在自贸港共谋发展。\n\n　　“对客家青年而言，海南自贸港是一方可以扎根成长的沃土。”海南省客属联合会秘书长王远宏建议，设立面向侨创、客家青年的专项创业扶持资金，联动客属企业家、侨商资源，提供行业指引与资源对接，打造“客青项目对接会”“侨创供需集市”，让客家青年在这片充满机遇的热土上，有平台可依、有伙伴同行，抱团发展、共同成长。\n\n　　作为海南自贸港核心引领区，海口面向青年人才推出了安居保障、创业补贴、科研资助、落户便利等政策。海口市委常委、副市长吕小蕾表示，海口将构建常态化走访考察、招商对接、交流合作机制，链接全球客家青年人才，并以开放胸怀、优越环境、贴心服务，欢迎客家青年来海口扎根成长、创新创业、成就梦想。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce98668d8b1","title":"世界客属 le":"程乐松阐释智能时代留白智慧：入世有为 松弛自处","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735699.shtml","summary":"中新网南京11月21日电 (张传明 唐娟)11月20日，北京大学哲学系教授程乐松做客南京“牛首十二讲堂”，带来以《留白》为核心的精彩人文分享。","summary_short":"中新网南京11月21日电 (张传明 唐娟)11月20日，北京大学哲学系教授程乐松做客南京“牛首十二讲堂”…","digest":"11月20日，北京大学哲学系教授程乐松做客南京“牛首十二讲堂”…","points":["中新网南京11月21日电 (张传明 唐娟)11月20日…","讲座以通透的哲学视角解读当代生活，用从容的留白智慧滋养大众身心，帮助现代人找寻松弛自洽…","“牛首十二讲堂”诞生于2022年8月，依托南京牛首山文化旅游区千年深厚文脉孕育而生"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:38:07+08:00","size":1,"keywords":[],"body":"中新网南京11月21日电 (张传明 唐娟)11月20日，北京大学哲学系教授程乐松做客南京“牛首十二讲堂”，带来以《留白》为核心的精彩人文分享。讲座以通透的哲学视角解读当代生活，用从容的留白智慧滋养大众身心，帮助现代人找寻松弛自洽、安然丰盈的生活方式，让往来游客在山水文脉间沉淀自我、涵养心境。\n\n　　“牛首十二讲堂”诞生于2022年8月，依托南京牛首山文化旅游区千年深厚文脉孕育而生。自常态化运营以来，该讲堂持续深耕人文传播，先后邀请马伯庸、毕飞宇、王德峰、敬一丹等数十位文化名家、专家学者登台开讲，累计开展四十余场高品质人文分享活动。\n\n程乐松认为忙碌的生活应多一份从容与本真。张传明 摄\n\n　　讲座中，程乐松梳理时代发展的进阶脉络，解读智能时代全新的生活图景。他认为，从蒸汽、电气时代到信息、智能时代，科技的快速迭代不断重塑大众的生活、劳作、社交与时空感知。智能时代的系统化技术模式与外界评价体系，慢慢引导人们以外界标准定义自我，渐渐忽略了自身的真实体悟与内心感受，让忙碌的生活少了一份从容与本真。\n\n　　对此，程乐松现场诠释了留白智慧。他表示，留白不是懈怠，而是一种通透成熟的生活哲学。“身处飞速发展的时代，我们顺应时代前行的同时，更要守住精神自觉。我们要温柔接纳平凡的自己，坚守内心本真的感知，在烟火生活中稳住心神。”\n\n　　“真正的留白，是入世有为、松弛自处的人生状态。”程乐松希望大家以适度留白滋养内心丰盈，以清醒的生命自觉拥抱生活，在纷繁世事中守得从容、自在生长。\n\n　　“牛首十二讲堂”负责人汪思琦表示，程乐松提出的“留白”，超越了传统美学意境，成为适配大众的生活智慧，助力每个人在喧嚣尘世中安放身心、沉淀自我。“我们希望继续秉持‘以文塑旅、以旅彰文’理念，融合山水风光与人文底蕴，打造面向公众的‘城市文化客厅’，让文化浸润日常，让书香温暖城市。”(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c35aa644081","title":"第六届“齐白石”全国大学生中国画作品展开幕","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735693.shtml","summary":"中新网湘潭11月21日电 (唐亚慧)11月21日，“美兴·术道”第六届“齐白石”全国大学生中国画作品展在湖南科技大学齐白石艺术馆开幕。","summary_short":"中新网湘潭11月21日电 (唐亚慧)11月21日，“美兴·术道”第六届“齐白石”全国大学生中国画作品展在湖南科技大学齐白…","digest":"第六届“齐白石”全国大学生中国画作品展开幕","points":["中新网湘潭11月21日电 (唐亚慧)11月21日…","展览由中国画学会、湖南省美术家协会、湖南科技大学联合主办…","来自中国艺术研究院、清华大学、中央美术学院、中国美术学院…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T13:33:41+08:00","size":1,"keywords":[],"body":"中新网湘潭11月21日电 (唐亚慧)11月21日，“美兴·术道”第六届“齐白石”全国大学生中国画作品展在湖南科技大学齐白石艺术馆开幕。\n\n　　展览由中国画学会、湖南省美术家协会、湖南科技大学联合主办，共收到185所高校1256件投稿作品，最终61所高校123件作品入选。来自中国艺术研究院、清华大学、中央美术学院、中国美术学院、中国传媒大学等全国61所高校的500余师生共同见证这场大学生中国画艺术盛宴。\n\n展览开幕式现场。严启城 摄\n\n　　自2016年首届举办以来，该展从“国风·意境”“大雅·真趣”“心颂·至美”“天赋·匠心”“艺比·神韵”一路走来，2026年迎来十周年，并以“美兴·术道”为主题举办第六届，形成对《诗经》“风、雅、颂，赋、比、兴”六义的篇章式总结，也成为全国高校美育成果展示交流的重要平台。\n\n　　湖南省文联党组成员、副主席倪文华表示，该展历经十载耕耘，已成为全国高校中国画领域具有影响力的品牌平台，是挖掘青年美术新生力量、展示高校美育教学成果的重要窗口，也是传承弘扬齐白石艺术精神、推动中华优秀传统文化创造性转化、创新性发展的生动实践。中国画学会代会长许俊表示，希望同学们以齐白石先生为榜样，扎根中华文化沃土，坚持为人民抒写、为时代讴歌，在艺术创造中见天地、见精神、见自我，努力成长为有理想、有学养、有担当的新时代艺术人才。\n\n展览现场。唐亚慧 摄\n\n　　步入展厅，水墨气息扑面而来。刘利宝的山水画《静观·3》以现代水墨重构传统山水意境，画面幽深静谧；陈语乐的工笔花鸟《碧波游鳞》细描碧水清波、游鱼悠然，取“濠梁观鱼”的古典意趣；刘小巧的写意人物《渔家谣》以朴拙线条勾勒渔家劳作场景，笔墨沉实，充满人间烟火；邢弯湾的浅绛山水《塬上栖居》以厚重笔墨写黄土高原的苍茫肌理与乡土栖居；庞皓文的写意人物《向山野，出发！》则以新锐视角刻画青年奔赴山野、拥抱自然的鲜活姿态。这些作品既见经典文脉的传承积淀，也显当代青年开阔的艺术视野与独立的创作思考。\n\n　　湖南科技大学党委书记蒋丽忠介绍，该校齐白石艺术学院学生创作的工笔画《深海交响·海牛Ⅱ号》，以“海牛Ⅱ号”深海钻机为题材。该钻机由万步炎教授团队历经30余年攻关，在南海超2000米水深成功下钻231米，刷新世界纪录。美术学子以画笔致敬科学家精神，并将画作无偿捐赠海牛实验室，成为学校以美育人、以文化人的生动实践。\n\n　　策展人、该校齐白石艺术学院院长赵湘学介绍，本届展览融汇齐白石质朴求真、兼容创新的艺术精神，锚定清晰的中国画学术定位与新时代美育路径，探索寓德于教、文化润心、以行促学、平台赋能的美术人才培养新模式。展览将持续至2027年3月30日。活动期间还将举办学术专题讲座和师生座谈会，围绕中国画创作、教学与美育展开交流研讨。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf6751736ab","title":"专家：AI检测只是辅助依据 不能替代学术评价","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735696.shtml","summary":"当下，AIGC已经越来越多地进入科研与教学场景，不少师生把它当作辅助文献梳理、思路启发的工具。","summary_short":"当下，AIGC已经越来越多地进入科研与教学场景，不少师生把它当作辅助文献梳理、思路启发的工具。","digest":"当下，AIGC已经越来越多地进入科研与教学场景，不少师生把它当作辅助文献梳理…","points":["当下，AIGC已经越来越多地进入科研与教学场景，不少师生把它当作辅助文献梳理、思路启发的工具","与之配套的AI内容检测工具，也开始被高校、期刊广泛使用","近期，知网升级AIGC检测算法后，不少使用者发现，稿件内容没有任何改动，多次复测…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T13:24:02+08:00","size":1,"keywords":[],"body":"当下，AIGC已经越来越多地进入科研与教学场景，不少师生把它当作辅助文献梳理、思路启发的工具。与之配套的AI内容检测工具，也开始被高校、期刊广泛使用。近期，知网升级AIGC检测算法后，不少使用者发现，稿件内容没有任何改动，多次复测，AI疑似检出率却出现大幅波动，甚至基金项目名称、作者姓名这类基础信息，都被标记为疑似AI生成。\r\n\n　　眼下AIGC检测尚无统一国家标准，这份概率性结果，却直接关系课程结课、论文送审乃至答辩资格。当机器的概率结论和研究者真实的智力劳动发生冲突，该由谁来甄别、如何复核？\n\n　　不少高校课程结课论文、期刊投稿，现在都要求附上AIGC检测证明。某高校安全工程专业大三学生小李向中国之声介绍，课程作业中需要分析事故数据、阐释已经形成共识的安全原理，既要规范引用文献，还要依托自己的一手实验数据解读图表，可提交前AIGC检测时，这两部分内容常常会被系统标红。\n\n　　小李：还有一种情况，老师要求在论文里加一幅图表，然后要你对图表里的实验数据进行分析。可你这段分析明明是依据自己的实验结论写出来的，AIGC检测报告照样会把它标出来。\n\n　　小李说，部分课程划定25%-35%不等的硬性红线，一旦超出就会影响课程成绩。为了顺利通过检测，不少学生只能反复修改文本、多次花钱复测，陷入猜测算法、规避标红的循环。\n\n　　小李：我写完之后一提交，查重率就变成49%了。最后要交查重报告的时候，我前后大概查了三四次，一共花了将近500块钱。\n\n　　北京某高校研二学生 周芳：很多课程的老师会在结业论文环节要求我们附上AI检测证明，有时候投稿的杂志也会要求附上这类证明。有些老师还会明确指定用知网检测，因为知网有一个专门的AIGC检测和查重率检测入口，只要把论文粘贴进去，填好作者姓名和标题，付费后就能进入检测流程。\n\n　　江苏某高校教师告诉记者，目前学校对需参加答辩的毕业生要求全员检测，如果检测率高于40%，就不能参加答辩。20%至40%之间是修改后允许答辩，低于20%可以答辩。\n\n　　记者梳理发现，目前，各个提供AIGC检测功能的平台，收费模式各不相同，有的按篇收费，有的按字数计费，以知网个人版为例，AIGC检测按字符计费，单价2元每千字符，不足千字符按千字符计算，检测给学生们带来经济负担的同时，还有检测结果差异所带来的困扰。可查公开报道显示，知网近期完成模型升级之后，不少使用者反馈，文稿内容没有改动，复测的AI疑似率却大幅上涨，部分人工撰写的文本，甚至项目名称、作者姓名都出现被误标红的情况。除此之外，不同检测平台给出的检测结果差异也十分明显。\n\n　　周芳：我很多朋友都反馈过这种情况，原本检测率只有10%的稿子，编辑要求修改，改完再拿去检测，结果直接飙到80%。可整个过程他们其实只微调了引用之类的小地方，正文内容基本没动。\n\n　　广东某高校学科教学(思政)硕士生向记者介绍，自己原创的开题报告AIGC检测结果为22.4%，但临时由AI生成的文本，检测结果反而显示为0%。\n\n　　AIGC检测，与传统论文查重有什么不同？为什么原创学术文本也会被误判？复旦大学计算与智能创新学院、复旦大学发展研究院副研究员张晓寒向记者解释，目前主流AIGC检测分为统计语言特征、模型对抗识别、文本水印检测三类技术路径，但商业平台普遍存在准确性不足、算法不透明、结果不稳定的现实问题。\n\n　　张晓寒：AI生成的内容还是有一些比较明显的特征，可以被检测出来。大家比较关心的是算法的可解释性，也就是透明性。AI具体的检测过程和检测逻辑其实并不透明，也没法解释；因此商业平台不能只给出一个简单的检测结果，比如80%、90%这样的相似度，还应该输出一些可以验证、可以核验、可以解释的具体证据。另外，当前算法也表现出一定的不稳定性，包括模型一致性的问题，同样的内容给到模型，有时会输出不一样的结果；或者我们去试不同的商业平台，这个平台测出30%，那个平台测出80%。\n\n　　西安交通大学网络空间安全学院副教授、博士生导师刘晓明表示，从技术底层来看，现阶段AIGC检测本质是机器学习分类任务，不存在百分之百准确的模型，误报是固有缺陷。实际使用环境与训练时不一致，还会进一步影响判断。\n\n　　刘晓明：我们所谓的AIGC检测，本质上就是一个分类问题，判断一段文本是人写的，还是大模型生成的。从深度学习的角度来讲，现阶段任何模型都存在误差，现有算法准确率基本在80%-90%之间。模型层面它是存在固有缺陷的。各类大模型版本迭代很快，跨生成器、跨版本，都会对我们检测精度带来影响。除此之外，现有检测器还容易受到外部扰动影响，写错一个词、遭遇恶意改动，都会造成检测性能大幅波动。文本当中的加粗命令、表格附带的特殊字符，也会干扰检测结果的精准度。\n\n　　技术层面这些不可避免的误差，对于学生和研究者来说，却会变成现实的打击。一旦原创内容被误标为AI生成，检测报告上的百分比数字，就有可能直接影响课程成绩、论文送审甚至毕业答辩。那么如何在保证原创性的同时，避免对学术成果造成误判？\n\n　　如今很多高校已经在常规查重的基础上增加AIGC检测项目，作为作业和论文的考核标准。中国人民大学数据科学与技术系教授李彤表示，在指导论文过程中确实会检测AI疑似率，但并不会将检测结果直接作为认定证据。\n\n　　李彤：一般情况下，学生提交论文后，学校会统一安排一个检测系统来检测。检测包括两个方面：一是查重，也就是看正文与已有发表内容之间的重复率；二是我们说的AIGC疑似率。在这个基础上，学院其实不会设置硬性的百分比标准。检测工具本身做的是概率判断，它属于概率模型，并不是确凿证据，对改写、翻译和非母语写作的误报率很高。再比如图像取证类工具，对复制、篡改的识别相对可靠，但对局部微调仍然需要人工复核。所以我们一般把它定位为辅助判断依据。\n\n　　西安交通大学网络空间安全学院副教授、博士生导师 刘晓明：AIGC检测肯定是必要的，但是它是个黑盒的活动，所以说它很多时候只能做参考。目前大家对拿机器检测结果当作唯一标准，其实还是存在比较大的异议的。我们可以在列表里面写你在什么场景下用了AI，这样审稿的时候知道内容的可信性。\n\n　　那么，高校在防范AI代写、守住学术诚信的同时，应当建立怎样的评价方式，真正回归研究本身、看重独立思考？中国教育科学研究院研究员储朝晖认为，AIGC检测不应替代专业的学术评价。\n\n　　储朝晖：不管是原来知网的查重，还是现在的AIGC检测，它本身只是一个技术手段，不能够替代完整的专业评价，要把专业评价机制和这项技术嫁接起来。相关机构掌握信息资源，并不代表它就拥有评判学术界是否存在违规的权利。学术评价主体应当是专业主体，而不是掌控技术的主体。\n\n　　李彤表示，论文作者应主动声明和标注AI生成内容，并建立内容溯源机制，不能让人工智能成为责任主体。\n\n　　李彤：AI是辅助工具，它不能替代作者。润色、翻译、检索、代码调试，这些可以适当地交给它。但是观点判断和责任必须由作者来承担，责任是不能让渡的。\n\n　　我对学生主要是三条要求。第一就是要说清楚学生用了什么工具、在哪个环节用、做什么用，提交时必须写明白。第二就是要自己做选题假设，关键的方法、关键的实验、具体的数据以及文章的结论不能交给AI，必须自己来把关，自己去提炼。第三就是能溯源，每一处内容都要能解释。疑似率偏高的部分。你要回到原始材料去看实验的记录代码和数据，不断地核对，而不是只看一个分数。\n\n　　在评价机制的落地层面，张晓寒认为，检测平台出具的报告应当提供可供核验的判定依据；教师在审核时，则应当更加关注文本内容本身，考查学生对研究方法的掌握，以及研究的实际增量贡献。\n\n　　张晓寒：从学术角度来说，AIGC检测算法只是一个工具，我们还是要回到论文本身。论文真正要考察的，是学生能不能做出高质量的研究、有没有原创性贡献。所以在评价体系里，应该更看重这部分。除了用AIGC检测工具做检测，肯定还需要老师从各个角度对内容把关。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":81,"items":[{"id":"c8833b7894c","title":"第四十届中国植保双交会成都开幕 发布10项团体标准","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-21/news1075653.shtml","summary":"11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕。","summary_short":"11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕。","digest":"11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕","points":["11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕","这场国家级植保行业5A级专业盛会，汇聚千余家行业企业与科研单位参展，展品覆盖农药原药…","本届展会以“精准用药 提质增效”为主题，重回首届举办地成都"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:54:26+08:00","size":2,"keywords":[],"body":"11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕。这场国家级植保行业5A级专业盛会，汇聚千余家行业企业与科研单位参展，展品覆盖农药原药、现代化植保机械、绿色防控产品等植保全产业链品类。\n\n本届展会以“精准用药 提质增效”为主题，重回首届举办地成都。行业规范是本届展会一大重磅看点。展会现场集中发布《互联网选购农药与维权指南》《非法添加检测方法系列团体标准》等10项团体标准。(制作 陈选斌）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/6EBDA98405EF4DDCAC2DFD5998568A96.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"第四十届中国植保双交会成都开幕 发布10项团体标准","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-21/news1075653.shtml","source_display":"中新視頻","published_at":"2026-11-21T15:54:26+08:00","category":"財經","digest":"11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕"},{"title":"第四十届中国植保双交会在蓉开幕 发布10项团体标准","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735694.shtml","source_display":"中新網 社會","published_at":"2026-11-21T13:34:25+08:00","category":"","digest":"第四十届中国植保双交会在蓉开幕 发布10项团体标准"}],"cross":{"total":2,"angles":[{"point":"第四十届中国植保双交会在蓉开幕 发布10项团体标准","sources":["中新網 社會"],"url":"https://www.chinanews.com.cn/sh/2026/11-21/10735694.shtml"},{"point":"11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕","sources":["中新視頻"],"url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-21/news1075653.shtml"}]}},{"id":"c7dd68e7d9d","title":"APEC 2026 | 一批国际合作机构将在深圳设立，“后APEC”时代开启","url":"https://www.jiemian.com/article/15357792.html","summary":"界面新闻记者 | 梁宝欣  2026年APEC领导人会议周落幕，一批面向亚太经济体的长期合作机构和平台，将在深圳设立。","summary_short":"界面新闻记者 | 梁宝欣  2026年APEC领导人会议周落幕，一批面向亚太经济体的长期合作机构和平台，将在深圳设立。","digest":"界面新闻记者 | 梁宝欣  2026年APEC领导人会议周落幕…","points":["2026年APEC领导人会议周落幕，一批面向亚太经济体的长期合作机构和平台，将在深圳设立","11月18日至19日，亚太经合组织（APEC）第三十三次领导人非正式会议在深圳举行","11月19日，中国外交部公布的APEC东道主成果清单列出75项主要成果…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T13:10:23+08:00","size":2,"keywords":[],"body":"界面新闻记者 | 梁宝欣\n\n2026年APEC领导人会议周落幕，一批面向亚太经济体的长期合作机构和平台，将在深圳设立。\n\n11月18日至19日，亚太经合组织（APEC）第三十三次领导人非正式会议在深圳举行。这是中国第三次、也是时隔12年再次担任APEC东道主。\n\n11月19日，中国外交部公布的APEC东道主成果清单列出75项主要成果，包括18项会议成果文件、3项中方重大举措和54项务实合作成果。其中，《亚太经合组织领导人深圳展望》被定位为 APEC “中国年” 最重要的成果，围绕经贸、联通、创新、发展四大领域和八个方向，搭建起亚太共同体的 “四梁八柱”，为未来亚太经济合作明确方向。\n\n在具体合作机制上，11月18日，中方在APEC工商领导人峰会上宣布支持成立世界湾区经济合作联盟；19日的领导人非正式会议上，宣布在深圳设立亚太共同体研究中心此外，还提出在数字技术、数据跨境流动、清洁能源和中小企业发展等领域设立合作机构，并提供2000万美元支持APEC务实合作。\n\n部分合作项目在此次会议前已经启动。今年7月，促进APEC数据跨境流动合作中国中心确定落户深圳前海；9月，在第32次APEC中小企业部长会议上，亚太人工智能赋能中小企业发展合作中心确定在广州设立，亚太中小企业合作区则选址深圳。\n\n其中，促进APEC数据跨境流动合作中国中心，定位为立足前海、面向亚太的数据规则研究、技术验证与国际产业合作枢纽，推动构建一个集政策研究、规则对接、产业服务于一体的综合性、开放式数据跨境流动合作平台。\n\n对于跨国企业而言，数据在不同经济体之间流动，面对数据保护、合规要求和技术标准的差异。该中心有望为企业探索跨境数据合规解决方案提供支持。\n\n深圳在此前已经在相关领域开展探索。2025年11月，深圳—新加坡跨境数据验证平台投入试运行，尝试为两地跨境数字业务提供数据验证服务。\n\n在政策研究层面，亚太共同体研究中心则将通过政策研究和国际交流，为亚太经济合作提供支持。\n\n历史上，APEC曾通过推动国际贸易规则变化，对相关产业发展产生长远影响。\n\n1996年11月，APEC领导人在菲律宾苏比克会议上支持推动信息技术产品关税削减。同年12月，世界贸易组织（WTO）达成《信息技术协定》（ITA），推动计算机、半导体等相关产品逐步实现零关税。\n\n2014年北京APEC期间，中美又就扩大ITA产品覆盖范围达成共识，为2015年WTO达成扩围协议创造了条件。这些贸易规则降低了相关电子产品跨境流动的关税成本，为亚太电子制造产业链的发展创造了有利条件。深圳电子产业的发展，也受益于贸易自由化和跨国产业分工。\n\n与过去主要通过降低关税推动贸易自由化不同，2026年APEC的合作重点更多转向数字贸易、人工智能、跨境数据流动和供应链协同。\n\n综合开发研究院（中国·深圳）财税贸易与产业发展研究中心主任韦福雷还尤其关注世界湾区经济合作联盟的倡议。他向界面新闻表示，过去APEC推动贸易投资自由化，主要依靠各经济体政府之间的规则协调，再由企业根据相关规则开展投资与贸易。通过湾区之间的合作和制度创新，能够加快企业在创新链、产业链和供应链方面的合作。\n\n在他看来，世界主要湾区集中了制造、创新和国际商务资源。如果能够建立常态化合作平台，就有机会让不同经济体的企业直接对接产业链和创新链，而不只是等待政府间规则协调。\n\n深圳也具备开展跨境制度合作的基础。\n\n韦福雷认为，粤港澳大湾区拥有不同法律和监管体系，深圳与香港、澳门长期开展跨境经贸往来，为不同制度之间的规则衔接积累了经验。未来，深圳有机会与香港共同发挥国际规则接口的作用。\n\nAPEC对深圳的影响不局限于机构、平台或者相关规则的设立，还有国际知名度的提升、外资的涌入等方面。\n\n韦福雷向界面新闻记者表示，从2025年深圳被确定为APEC领导人非正式会议举办城市开始，国际对深圳的关注就已经提升。会议的举办进一步提升了这座城市的国际知名度，也为未来的产业合作和国际投资创造了机会。\n\n韦福雷告诉记者，自己调研时发现，不少外国人通过智能手机、无人机、通信设备等产品知道华为、大疆、比亚迪和腾讯等一大批深圳企业，却不了解深圳这座城市。APEC则让世界有机会直接观察深圳的制造能力、科技创新和产业生态，为后续商业合作创造条件。\n\n11月17日至18日举行的APEC工商领导人峰会，吸引来自21个APEC经济体的2000余名政商代表参会，其中包括115家世界500强企业的代表。美国企业数量占外方经济体参会企业的近两成。\n\n“会议还没开，外资就已经开始抢滩深圳了。”韦福雷说，“实际上，这是国家的背书带来的信任。”\n\n今年前三季度，深圳实际使用外资超过440亿元，同比增长超过60%。其中，来自APEC经济体的实际使用外资约400亿元，占全市总额约九成。高技术产业实际使用外资约270亿元，同比增长约两倍。\n\n外资流入的领域也在拓宽。今年以来，美国AMD深圳生态创新中心、越南FPT区域软件信息研发与运营中心、新加坡康福德高智能驾驶运营中心等项目陆续落地深圳。\n\n与此同时，深圳与APEC经济体的贸易联系进一步加深。今年前三季度，深圳对APEC其他经济体进出口3.23万亿元，同比增长40%，占全市外贸总值近七成。\n\n“深圳的产业开始往微笑曲线两端变了。”韦福雷说，过去，国际企业在深圳投资更多集中于生产制造。如今，一些外资开始向研发、法律及专业服务等领域延伸，以配合深圳制造业的发展和中国企业日益增长的出海需求。\n\n深圳储能科技企业正浩创新（EcoFlow），成立于2017年，以便携式储能电源起家，近年来逐步拓展至家庭储能、太阳能和智能能源管理等领域。\n\n正浩相关负责人告诉界面新闻，在全球产业链中，公司一端连接中国完整的新能源产业链与技术迭代能力，另一端连接不同市场的本地需求、合规要求和服务体系。\n\n“我们不是单纯的产品出口商，而是以‘产品、服务、合规与本地合作’的方式，参与全球能源转型。”该负责人说。\n\n在韦福雷看来，深圳还需要重视“后APEC时期”的持续经营。\n\n2025年韩国庆州APEC期间，英伟达与韩国政府及三星、SK集团、现代汽车、Naver等企业宣布人工智能基础设施合作，计划部署超过26万枚GPU。会议结束后，相关合作继续推进。韩国政府于同年11月成立专项工作组，12月接收首批GPU。今年11月，韩国政府再次确认，英伟达将继续履行相关供应计划。\n\n“实际上APEC给深圳带来的红利，包括推动城市、产业、创新的发展，我觉得才刚刚开始。”他说，未来可以通过进出口规模、实际使用外资、国际航线和国际游客数量等指标，观察深圳与国际市场的联系是否进一步加深。\n\n未经正式授权严禁转载本文，侵权必究。湾区经济观察\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\nAPEC 2026 | 一批国际合作机构将在深圳设立，“后APEC”时代开启\n\nAPEC给深圳带来的红利，包括推动城市、产业、创新的发展，才刚刚开始。\n\n原创新闻梁宝欣 · 2026/11/21 13:10来源：界面新闻\n\n图片来源：视觉中国\n\n 界面新闻记者 | 梁宝欣\n\n2026年APEC领导人会议周落幕，一批面向亚太经济体的长期合作机构和平台，将在深圳设立。\n\n11月18日至19日，亚太经合组织（APEC）第三十三次领导人非正式会议在深圳举行。这是中国第三次、也是时隔12年再次担任APEC东道主。\n\n11月19日，中国外交部公布的APEC东道主成果清单列出75项主要成果，包括18项会议成果文件、3项中方重大举措和54项务实合作成果。其中，《亚太经合组织领导人深圳展望》被定位为 APEC “中国年” 最重要的成果，围绕经贸、联通、创新、发展四大领域和八个方向，搭建起亚太共同体的 “四梁八柱”，为未来亚太经济合作明确方向。\n\n在具体合作机制上，11月18日，中方在APEC工商领导人峰会上宣布支持成立世界湾区经济合作联盟；19日的领导人非正式会议上，宣布在深圳设立亚太共同体研究中心此外，还提出在数字技术、数据跨境流动、清洁能源和中小企业发展等领域设立合作机构，并提供2000万美元支持APEC务实合作。\n\n部分合作项目在此次会议前已经启动。今年7月，促进APEC数据跨境流动合作中国中心确定落户深圳前海；9月，在第32次APEC中小企业部长会议上，亚太人工智能赋能中小企业发展合作中心确定在广州设立，亚太中小企业合作区则选址深圳。\n\n其中，促进APEC数据跨境流动合作中国中心，定位为立足前海、面向亚太的数据规则研究、技术验证与国际产业合作枢纽，推动构建一个集政策研究、规则对接、产业服务于一体的综合性、开放式数据跨境流动合作平台。\n\n对于跨国企业而言，数据在不同经济体之间流动，面对数据保护、合规要求和技术标准的差异。该中心有望为企业探索跨境数据合规解决方案提供支持。\n\n深圳在此前已经在相关领域开展探索。2025年11月，深圳—新加坡跨境数据验证平台投入试运行，尝试为两地跨境数字业务提供数据验证服务。\n\n在政策研究层面，亚太共同体研究中心则将通过政策研究和国际交流，为亚太经济合作提供支持。\n\n历史上，APEC曾通过推动国际贸易规则变化，对相关产业发展产生长远影响。\n\n1996年11月，APEC领导人在菲律宾苏比克会议上支持推动信息技术产品关税削减。同年12月，世界贸易组织（WTO）达成《信息技术协定》（ITA），推动计算机、半导体等相关产品逐步实现零关税。\n\n2014年北京APEC期间，中美又就扩大ITA产品覆盖范围达成共识，为2015年WTO达成扩围协议创造了条件。这些贸易规则降低了相关电子产品跨境流动的关税成本，为亚太电子制造产业链的发展创造了有利条件。深圳电子产业的发展，也受益于贸易自由化和跨国产业分工。\n\n与过去主要通过降低关税推动贸易自由化不同，2026年APEC的合作重点更多转向数字贸易、人工智能、跨境数据流动和供应链协同。\n\n综合开发研究院（中国·深圳）财税贸易与产业发展研究中心主任韦福雷还尤其关注世界湾区经济合作联盟的倡议。他向界面新闻表示，过去APEC推动贸易投资自由化，主要依靠各经济体政府之间的规则协调，再由企业根据相关规则开展投资与贸易。通过湾区之间的合作和制度创新，能够加快企业在创新链、产业链和供应链方面的合作。\n\n在他看来，世界主要湾区集中了制造、创新和国际商务资源。如果能够建立常态化合作平台，就有机会让不同经济体的企业直接对接产业链和创新链，而不只是等待政府间规则协调。\n\n深圳也具备开展跨境制度合作的基础。\n\n韦福雷认为，粤港澳大湾区拥有不同法律和监管体系，深圳与香港、澳门长期开展跨境经贸往来，为不同制度之间的规则衔接积累了经验。未来，深圳有机会与香港共同发挥国际规则接口的作用。\n\nAPEC对深圳的影响不局限于机构、平台或者相关规则的设立，还有国际知名度的提升、外资的涌入等方面。\n\n韦福雷向界面新闻记者表示，从2025年深圳被确定为APEC领导人非正式会议举办城市开始，国际对深圳的关注就已经提升。会议的举办进一步提升了这座城市的国际知名度，也为未来的产业合作和国际投资创造了机会。\n\n韦福雷告诉记者，自己调研时发现，不少外国人通过智能手机、无人机、通信设备等产品知道华为、大疆、比亚迪和腾讯等一大批深圳企业，却不了解深圳这座城市。APEC则让世界有机会直接观察深圳的制造能力、科技创新和产业生态，为后续商业合作创造条件。\n\n11月17日至18日举行的APEC工商领导人峰会，吸引来自21个APEC经济体的2000余名政商代表参会，其中包括115家世界500强企业的代表。美国企业数量占外方经济体参会企业的近两成。\n\n“会议还没开，外资就已经开始抢滩深圳了。”韦福雷说，“实际上，这是国家的背书带来的信任。”\n\n今年前三季度，深圳实际使用外资超过440亿元，同比增长超过60%。其中，来自APEC经济体的实际使用外资约400亿元，占全市总额约九成。高技术产业实际使用外资约270亿元，同比增长约两倍。\n\n外资流入的领域也在拓宽。今年以来，美国AMD深圳生态创新中心、越南FPT区域软件信息研发与运营中心、新加坡康福德高智能驾驶运营中心等项目陆续落地深圳。\n\n与此同时，深圳与APEC经济体的贸易联系进一步加深。今年前三季度，深圳对APEC其他经济体进出口3.23万亿元，同比增长40%，占全市外贸总值近七成。\n\n“深圳的产业开始往微笑曲线两端变了。”韦福雷说，过去，国际企业在深圳投资更多集中于生产制造。如今，一些外资开始向研发、法律及专业服务等领域延伸，以配合深圳制造业的发展和中国企业日益增长的出海需求。\n\n深圳储能科技企业正浩创新（EcoFlow），成立于2017年，以便携式储能电源起家，近年来逐步拓展至家庭储能、太阳能和智能能源管理等领域。\n\n正浩相关负责人告诉界面新闻，在全球产业链中，公司一端连接中国完整的新能源产业链与技术迭代能力，另一端连接不同市场的本地需求、合规要求和服务体系。\n\n“我们不是单纯的产品出口商，而是以‘产品、服务、合规与本地合作’的方式，参与全球能源转型。”该负责人说。\n\n在韦福雷看来，深圳还需要重视“后APEC时期”的持续经营。\n\n2025年韩国庆州APEC期间，英伟达与韩国政府及三星、SK集团、现代汽车、Naver等企业宣布人工智能基础设施合作，计划部署超过26万枚GPU。会议结束后，相关合作继续推进。韩国政府于同年11月成立专项工作组，12月接收首批GPU。今年11月，韩国政府再次确认，英伟达将继续履行相关供应计划。\n\n“实际上APEC给深圳带来的红利，包括推动城市、产业、创新的发展，我觉得才刚刚开始。”他说，未来可以通过进出口规模、实际使用外资、国际航线和国际游客数量等指标，观察深圳与国际市场的联系是否进一步加深。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"APEC 2026 | 一批国际合作机构将在深圳设立，“后APEC”时代开启","url":"https://www.jiemian.com/article/15357792.html","source_display":"界面新聞","published_at":"2026-11-21T13:10:23+08:00","category":"","digest":"界面新闻记者 | 梁宝欣  2026年APEC领导人会议周落幕…"},{"title":"APEC｜羅淑佩指隨行人員把握機會走訪香港 帶動酒店業入住率","url":"https://news.tvb.com/tc/1207586-APEC羅淑佩指隨行人員把握機會走訪香港帶動酒店業入住率","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T10:04+08:00","category":"港聞","digest":"亞太經合組織(APEC)領導人峰會在深圳圓滿結束，文化體育及旅遊局局長羅淑佩指…"}],"cross":{"total":2,"angles":[{"point":"界面新闻记者 | 梁宝欣  2026年APEC领导人会议周落幕…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15357792.html"},{"point":"亞太經合組織(APEC)領導人峰會在深圳圓滿結束，文化體育及旅遊局局長羅淑佩指…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207586-APEC羅淑佩指隨行人員把握機會走訪香港帶動酒店業入住率"}]}},{"id":"c86c802c269","title":"重庆发布86项低空产业发展机会清单 总投资约289亿元","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735787.shtml","summary":"中新网重庆11月21日电 (张旭)11月21日下午，重庆国际人才交流大会·超大城市低空综合治理产业人才发展大会在重庆举行。","summary_short":"中新网重庆11月21日电 (张旭)11月21日下午，重庆国际人才交流大会·超大城市低空综合治理产业人才发展大会在重庆举行…","digest":"11月21日下午…","points":["中新网重庆11月21日电 (张旭)11月21日下午…","该份清单涵盖低空基础设施、低空装备制造、科研创新与人才教育、低空运营服务…","其中包含了起降设施、通信导航监视、数字底座等基础能力建设项目，也包括整机研发制造…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:29:24+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (张旭)11月21日下午，重庆国际人才交流大会·超大城市低空综合治理产业人才发展大会在重庆举行。大会发布低空产业发展机会清单86项，预计总投资约289亿元。\n\n　　据了解，该份清单涵盖低空基础设施、低空装备制造、科研创新与人才教育、低空运营服务、检验检测与运行保障5个类别。其中包含了起降设施、通信导航监视、数字底座等基础能力建设项目，也包括整机研发制造、关键零部件、智能载荷等产业项目。\n\n图为大会现场。张旭 摄\n\n　　大会同步推出城市治理、巡检应急、低空物流、文旅消费等特色应用场景，清晰展现低空产业由单一装备制造向设施建设、技术服务、场景运营和安全保障协同延伸的发展态势。\n\n　　大会还促成8个项目达成合作，总投资约17.9亿元，涉及产业投资、校地合作、平台建设、应用场景、产学研合作等领域。相关合作协议，将打通低空治理需求、高校科研资源、企业技术优势与区县产业基础，为技术成果实景验证、产业项目加速落地搭建对接通道。\n\n图为项目签约现场。张旭 摄\n\n　　大会同步发布产业人才需求清单，覆盖技术研发、系统集成、飞行运维、装备制造等9个类别，直观体现低空产业对跨学科复合型人才的旺盛需求。大会同步举行人才签约仪式，共引进人才46名，用人单位覆盖政府、企业、高校、科研院所等各类主体。\n\n　　近年来，重庆围绕低空空域管理改革持续探索，形成一批阶段性成果。该市低空智管平台同步打通军航、民航、无人机监管三条核心数据链路，企业通过“渝快办”一次申报，空域使用批复时限压缩80%，用户平均跑动次数大幅缩短，实现从“跑多次”到“一次办”。\n\n　　本次大会由重庆市国防科技工业办公室主办。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca91b3d5199","title":"山頂御峯複式戶約1.36億沽 每呎高見5.83萬","url":"https://www.stheadline.com/property-new/3639640/山頂御峯 、储能、新能源汽车等外贸“新三样”占比约30%，传统燃油汽车同样占比30%，跨境电商高附加值货品占比15%。\n\n定价方面，中欧北极快航的运价整体低于中欧班列、高于传统远洋海运。在李晓斌看来，历经8个连续周班航次运行，中欧北极快航已初步形成常态化、连续性运营体系，团队在航行时效、线路规划、远洋货运安全管控上积累了成熟经验，整体商业化进展符合预期。\n\n中欧北极快航首航 图片来自海杰航运官微\r\n\n但常态化运营背后，难度也呈几何级增长。“8个航次的运营复杂度，不是单航次的8倍，而是80倍。”李晓斌称，多频次航行叠加复杂海域工况，各类突发风险、特殊状况大幅增加，对调度、运维、风控能力提出极高考验。\n\n受今年夏季台风、秋冬季大西洋飓风等极端天气影响，航线整体时效未能达成最初20天直达的目标，整体航行出现阶段性延误，超出企业前期预判。\n\n不过依托口岸、港口体系的专项保障，航线尽可能对冲了外部风险。今年华东口岸遭遇多轮台风，普遍出现船舶、货物积压拥堵，中欧北极快航则实现全国合作港口零等待直靠，大幅节约周转时间与物流成本，也保障了全年8个航次顺利落地。\n\n李晓斌称，没有相关部门的支持，公司今年可能完成不了8个航班的目标。\n\n作为航线核心始发港，宁波舟山港穿山港区承担着冰上丝绸之路北向通道的试点重任。\n\n宁波舟山港相关人士告诉界面新闻，港口紧邻长三角锂电、储能、光伏、新能源整车产业集群，腹地货源结构与北极航线高附加值、热敏货（需在特定温度区间内运输和储存的货物）运输需求高度契合。\n\n针对“新三样”货物，宁波港划定了封闭危化专属堆场，和普通集装箱、热源区域拉开安全隔离距离。同时，港口的吊机、集卡配套特种箱作业方案，制定了储能柜专项装卸标准作业程序。\n\n宁波港还依托海铁联运网络，把内陆货源和北极快航通道打通，打造“海铁快线+国际快航”的“双快”物流模式。\n\n以今年中欧北极快航的“海杰连云港”轮次为例，一家合肥货主的逆变器在工厂完成装箱，直接搭乘“合肥北-宁波舟山港”海铁联运精品班列抵达穿山港站，货物“不换箱”无缝衔接“中欧北极快航”，将中国内陆到欧洲之间的货物在途时长缩短了15天左右。\n\n中欧北极快航，图片来自海杰航运\r\n\n上述宁波港人士表示，航线常态化运营，进一步优化了浙江外贸开放格局。作为全省外贸增长核心动能，“新三样”得以借助北向新通道快速抢占欧洲市场，同时带动舟山极地船舶补给、LNG加注、国际航运服务等配套产业发展。\n\n值得关注的是，虽然北极快航常态化运行，但季节性通航短板、运力不足等瓶颈仍在。受北极冰情限制，航线仅夏季具备通航窗口，无法满足企业全年稳定出货需求，多数外贸企业仅能将其作为备选通道。\n\n来自北极快航客户端的反馈，也证实了上述问题，他们对中欧北极快航的时效和安全性较为满意，但希望航线能更稳定、运营时间更长。\n\n为突破现有瓶颈，海杰航运已明确下一步升级规划。\n\n李晓斌称，公司明年将引入大型冰区加强级船舶，升级船队硬件能力；同步搭建完善的气象预报、智能导航、航线优化综合服务体系，精简沿途挂靠港口，打造点对点直达快航，极致压缩运输时长。货源品类上，未来将逐步拓展机械设备、精密仪器、合规危险品等多元货类，打开增量空间。\n\n一位行业人士建议，航线还将重点培育欧洲返程货源，吸纳欧洲高端化工品、再生材料、精密设备返程回国，破解单向货流难题，提升航线整体经济性。\n\n李晓斌表示，中欧北极快航属于全新赛道，通航标准、监管细则、应急体系仍处于摸索阶段，需要多部门、多领域协同完善。\n\n在他看来，当前中欧贸易体量庞大且持续迭代，每年涌现大量新增外贸客户，北极快航的市场渗透率仍有巨大提升空间。“随着运力升级、周期拉长、双向通道打通，这条北向新航道，有望成为中国新能源出海、中欧高端贸易往来的新增长极。”李晓斌称。\n\n未经正式授权严禁转载本文，侵权必究。长三角商业地理港口 航运业\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n【出海头条】北极快航第二季收官，中欧经贸新通道如何跑得更稳？\n\n今年北极快航共运行8个航次，合作客户数量上升至接近700家，总货值达53.3亿元。\n\n原创新闻杨冰柯 · 2026/11/21 16:54来源：界面新闻\n\n中欧北极快航，图片来自海杰航运\n\n界面新闻记者 | 杨冰柯\n界面新闻编辑 | 庄键\n \n\n在他看来，当前中欧贸易体量庞大且持续迭代，每年涌现大量新增外贸客户，北极快航的市场渗透率仍有巨大提升空间。“随着运力升级、周期拉长、双向通道打通，这条北向新航道，有望成为中国新能源出海、中欧高端贸易往来的新增长极。”李晓斌称。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cca23a1a6d4","title":"李强同新加坡总理黄循财会谈","url":"https://www.jiemian.com/article/15358198.html","summary":"11月21日上午，国务院总理李强在北京钓鱼台国宾馆同新加坡总理黄循财举行会谈。","summary_short":"11月21日上午，国务院总理李强在北京钓鱼台国宾馆同新加坡总理黄循财举行会谈。","digest":"11月21日上午，国务院总理李强在北京钓鱼台国宾馆同新加坡总理黄循财举行会谈","points":["11月21日上午，国务院总理李强在北京钓鱼台国宾馆同新加坡总理黄循财举行会谈","李强表示，在双方共同努力下，中新关系保持良好发展势头，互利合作成果丰硕","昨天，习近平主席同总理先生举行会晤，就深化两国关系作出进一步规划"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T16:52:44+08:00","size":1,"keywords":[],"body":"11月21日上午，国务院总理李强在北京钓鱼台国宾馆同新加坡总理黄循财举行会谈。\n\n李强表示，在双方共同努力下，中新关系保持良好发展势头，互利合作成果丰硕。昨天，习近平主席同总理先生举行会晤，就深化两国关系作出进一步规划。中方愿同新方加强战略沟通，筑牢政治互信，支持彼此核心利益和重大关切，拓展务实合作，推动中新全方位高质量的前瞻性伙伴关系取得更多成果，持续增进两国民众福祉。\n\n李强指出，中方愿同新方加快推进中新自贸协定4.0版谈判，促进更高水平双向开放，进一步加强产业融合，推动两国政府间重大项目提质升级，加强人工智能、清洁能源、互联互通、金融等领域合作，推进陆海新通道建设，为两国发展增添动能。中新在社会治理领域有相近理念，面临不少相似课题。双方要加强在应对人口老龄化、促进发展均衡、优化公共服务等问题上的交流互鉴，扩大旅游、文化、青年等人文合作，更好造福两国人民。这些年，单边主义、保护主义抬头，给许多国家经济贸易带来影响。中新同为开放合作的践行者、受益者，应当密切在联合国、亚太经合组织等协调配合，坚定促进区域经济一体化，推动构建开放型世界经济，维护多边贸易体制，捍卫两国共同利益。中方支持新方明年担任东盟轮值主席国，愿同新方一道推动各方落实好中国－东盟自贸区3.0版升级议定书。\n\n黄循财祝贺中国在深圳成功举办亚太经合组织领导人非正式会议，表示数十年来新中建立了基于深厚相互信任的牢固伙伴关系。在当前动荡国际局势下，新中更应加强沟通合作，共同应对挑战，维护两国稳定繁荣。新方期待同中方进一步密切高层交往，加强发展战略对接，深化人工智能、数字经济、绿色能源、互联互通等领域合作，密切人文交流，推动新中全方位高质量的前瞻性伙伴关系取得更多新成果。新方支持习近平主席提出的人类命运共同体理念及四大全球倡议，赞赏中方为维护世界和平，促进开放发展发挥领导作用。明年，新方将担任东盟轮值主席国，愿同中方进一步加强在区域和多边平台沟通协作，推进东盟－中国合作，维护地区稳定。\n\n吴政隆参加会谈。（新华社）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c70f8cd2b67","title":"国家数据局：积极拓展词元服务应用场景，健全词元计量计费、质量测评等标准规范","url":"https://www.jiemian.com/article/15358195.html","summary":"11月20日，国家数据局局长刘烈宏出席在湖南长沙举办的2026世界计算大会开幕式并致辞。","summary_short":"11月20日，国家数据局局长刘烈宏出席在湖南长沙举办的2026世界计算大会开幕式并致辞。","digest":"国家数据局：积极拓展词元服务应用场景，健全词元计量计费、质量测评等标准规范","points":["11月20日，国家数据局局长刘烈宏出席在湖南长沙举办的2026世界计算大会开幕式并致辞","刘烈宏表示，词元打通了算力、模型、数据间的价值传导链路…","一是词元发展初步起势，围绕词元生产、流通、消费的产业生态正加速构建，拓展了经济增长新空间"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T16:46:56+08:00","size":1,"keywords":[],"body":"11月20日，国家数据局局长刘烈宏出席在湖南长沙举办的2026世界计算大会开幕式并致辞。刘烈宏表示，词元打通了算力、模型、数据间的价值传导链路，成为数智经济的价值锚点和数据价值的显性化载体。一是词元发展初步起势，围绕词元生产、流通、消费的产业生态正加速构建，拓展了经济增长新空间。二是“词元工厂”快速兴起，将算力租赁、模型供给、数据能力升级为词元生产服务，成为产业组织新形态。三是词元催生服务交付新模式，行业高质量数据集经模型训练推理转化为可计量、可交付的智能服务，形成以词元计量、按调用计价的交付方式，为数据要素价值释放提供新路径。下一步，国家数据局将积极拓展词元服务应用场景，健全词元计量计费、质量测评等标准规范，引导行业规范发展，坚决避免低质量重复建设，加快构建以数据为关键要素的数字经济。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7ff479cb3f","title":"气候变化下，儿童正面临日益严峻的风险","url":"https://www.jiemian.com/article/15357738.html","summary":"界面新闻记者 | 蔡星卓 界面新闻编辑 | 刘海川  2026年11月20日的北京，世界儿童日“携手向光前行，点亮儿童未来”主题活动如期举行。","summary_short":"界面新闻记者 | 蔡星卓 界面新闻编辑 | 刘海川  2026年11月20日的北京，世界儿童日“携手向光前行…","digest":"界面新闻记者 | 蔡星卓 界面新闻编辑 | 刘海川  2026年11月20日的北京…","points":["2026年11月20日的北京，世界儿童日“携手向光前行，点亮儿童未来”主题活动如期举行","同一时刻，地中海沿岸的土耳其安塔利亚，一场关乎人类未来的全球气候盛会——2026年联合国气候…","联合国儿童基金会《2026年儿童气候风险报告》显示…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T16:29:18+08:00","size":1,"keywords":[],"body":"界面新闻记者 | 蔡星卓\n界面新闻编辑 | 刘海川\n\n2026年11月20日的北京，世界儿童日“携手向光前行，点亮儿童未来”主题活动如期举行。\n\n同一时刻，地中海沿岸的土耳其安塔利亚，一场关乎人类未来的全球气候盛会——2026年联合国气候变化大会（COP31），也进入尾声。\n\n这两场跨越万里的会议，共同勾勒出当今国际社会对脆弱群体与地球未来的关切。从保障儿童的生存与发展权利，到应对迫在眉睫的全球气候危机，界面新闻汇聚多方视角，试图聚焦：气候变化之下，儿童正面临怎样的挑战？\n\n气候变化下的儿童\n\n“每年仍有近500万5岁以下儿童离世，其中绝大多数本可避免。”2026年11月20日，北京世界儿童日主题活动现场，联合国助理秘书长、联合国儿童基金会副执行主任泰德·柴班（Ted Chaiban）表示，新一代儿童正在瞬息万变的世界中成长。“除了数字时代的机遇与风险，他们还要面对气候变化和心理健康等全新挑战。”他说。\n\n活动现场，全国妇联副主席、书记处第一书记，国务院妇女儿童工作委员会副主任黄晓薇在列举儿童福祉面临的多重挑战时，明确提到“地缘冲突、气候变化、数字鸿沟”。\n\n11月20日，北京绿研公益发展中心气候与能源项目主管陈蓥婕正在COP31现场。她告诉界面新闻，自己观察到各方对儿童的关注：在会前，世卫组织、世界气象组织、联合国儿童基金会和联合国人口基金会就提出了一组重点指标，帮助各国了解高温暴露和孕产妇、新生儿及儿童的健康数据的相关情况，以支持政策制定；11月14日的儿童、青年、教育和技能主题日上，儿童和青年共同起草了一份气候行动呼吁；在大会磋商气候赋权行动（ACE）工作方案时，非洲集团也提出，案文应提及受教育权以及气候变化对儿童教育的影响。\n\n气候变化下，儿童正面临日益严峻的风险。联合国儿童基金会《2026年儿童气候风险报告》显示，由人类活动引起的全球变暖正在改变世界的大部分面貌。报告称，全球已有数量惊人的儿童暴露于与气候相关的灾害之中，这种暴露的规模凸显了危机的紧迫性。如今，几乎所有儿童都至少面临以下一种气候灾害：河流/沿海洪水、干旱、热带风暴、热浪、极端高温、火灾、沙尘暴。\n\n2026年11月20日，北京世界儿童日主题活动现场展示的男童、女童卫生包。（摄影：界面新闻/蔡星卓）\r\n\n陈蓥婕向界面新闻介绍，随着全球平均温升短暂突破1.5℃，气候相关灾害及其影响已经成为现实，并蔓延到儿童的日常生活，包括身体健康复合风险、心理健康影响，乃至可能因教育系统扰乱造成的长期发展损害。\n\n她分析，身体健康方面，气候变化通过对农业的影响，可能加剧儿童营养不良风险或为疟疾等疾病传播创造条件。心理健康方面，亲身经历极端天气事件可能导致创伤后应激障碍（PTSD），而长期气候危机的未来不确定性则会引发“气候焦虑”。此外，极端天气导致的停课与校园损毁，已在全球范围内剥夺了数亿学生的正常受教育时间。\n\n中国实践：气候行动中的儿童视角\n\n那么，中国在儿童气候行动中扮演怎样的角色？柴班表示，如今，中国已能为其他国家提供支持，且成为联合国儿童基金会最重要的合作伙伴之一。中国支持联合国儿童基金会针对冲突和灾害开展的应急响应，支持低收入国家的发展项目，为全球加速实现可持续发展目标作出贡献。同时，中国也在可再生能源领域走在世界前列，并在全球应对气候变化、在数字和人工智能领域为儿童创造机遇等行动中发挥着重要作用。\n\n近些年，在儿童气候行动方面，中国积累了不少经验。陈蓥婕也向界面新闻表示，中国近年有关“儿童与家庭”的政策明显增多，越来越关注育儿支持、教育服务等领域，逐步体现出对儿童友好元素。\n\n她提到，在政策框架方面，中国以儿童友好城市建设为抓手，并在健康、教育等与儿童发展息息相关的部门出台专门政策，推进儿童权益保障和儿童发展。2021年，国家发展改革委等23个部门联合印发《关于推进儿童友好城市建设的指导意见》，确立了以“儿童优先发展”为核心的城市建设理念，随后各地积极响应并开展试点工作。同时，在健康和教育等关键领域，《“健康中国2030”规划纲要》《健康儿童行动提升计划》《中国教育现代化2035》等重要文件都将儿童发展置于优先位置。\n\n项目层面，公开资料显示，国内一些社会组织正面向儿童和青年群体开展气候行动，如关注灾后儿童身心改善和综合发展，或进行气候教育与青少年赋能等。陈蓥婕表示，她回顾过往合作经验认为，亚洲基础设施投资银行（AIIB）和亚洲开发银行（ADB）等开发性金融机构已经有气候项目具备儿童友好的视角，对发展中国家也有很强的借鉴价值。她表示，亚投行的“河南洪灾紧急恢复与重建”项目，从设计到项目建设再到后续评估都针对性考虑到儿童的气候脆弱性，并加以应对，值得其他国家充分考虑。\n\n2026年11月20日，北京世界儿童日主题活动现场展示的联合国儿童基金会过往工作照片。上图为2008年汶川地震后的四川省绵阳市，孩子们在一间帐篷教室里上课。而今年的11月20日也是联合国儿童基金会成立80周年。（摄影：界面新闻/蔡星卓）\r\n\n不过，这些经验“移植”到其他发展中国家仍面临落地困难。陈蓥婕告诉界面新闻，在进一步推进政策、项目乃至国际合作落地的过程中，还需要系统考虑怎么把社会系统的管理责任以及预算衔接起来。以校园高温预案为例，预警发布后，谁有权调整课时？停课后家庭照护缺口由谁填补？基层卫生机构如何跟进高脆弱性儿童？这些都需要属地提前明确。\n\n她补充，中国经验走出去同样也要进行“本地化”适配，如在部分发展水平相对有限的国家和地区，还要先解决气象预警如何传到网络差的社区、气象和卫生数据能否细化等问题。\n\n陈蓥婕还表示，流向儿童相关领域的气候资金不足也是一大难题。UNICEF的一项研究显示，“儿童视角缺位”明显存在于全球气候资金动员过程中。过往研究发现，当前中国气候投融资的儿童响应程度总体处于较低水平，普遍缺乏系统性的儿童视角。\n\n“我们对国内部分气候投融资试点城市的715个项目（总投资约1.43万亿元）展开研究发现，在总计约1.43万亿元人民币的投资中，经加权核算，与儿童相关的投资金额仅占总投资额的2.4%，绝大多数项目的儿童响应水平均为‘低’或‘无关’。”陈蓥婕认为，这种不均衡会阻碍气候投资惠益儿童，特别是公共资金无法发挥其应有作用。\n\n她进一步表示，在COP31气候资金、公正转型等大会最重点和白热化的磋商中，儿童和青年没有被考虑其中。“如果我们未来的气候目标、政策、预算乃至投资仍然对儿童的需求和脆弱性视而不见，这本身又会加剧代际不公正，乃至继续压缩孩子们在‘1.5℃超调情景下的世界’中的生存和发展空间。”她说。\n 心的城市建设理念，随后各地积极响应并开展试点工作。同时，在健康和教育等关键领域，《“健康中国2030”规划纲要》《健康儿童行动提升计划》《中国教育现代化2035》等重要文件都将儿童发展置于优先位置。\n\n项目层面，公开资料显示，国内一些社会组织正面向儿童和青年群体开展气候行动，如关注灾后儿童身心改善和综合发展，或进行气候教育与青少年赋能等。陈蓥婕表示，她回顾过往合作经验认为，亚洲基础设施投资银行（AIIB）和亚洲开发银行（ADB）等开发性金融机构已经有气候项目具备儿童友好的视角，对发展中国家也有很强的借鉴价值。她表示，亚投行的“河南洪灾紧急恢复与重建”项目，从设计到项目建设再到后续评估都针对性考虑到儿童的气候脆弱性，并加以应对，值得其他国家充分考虑。\n\n2026年11月20日，北京世界儿童日主题活动现场展示的联合国儿童基金会过往工作照片。上图为2008年汶川地震后的四川省绵阳市，孩子们在一间帐篷教室里上课。而今年的11月20日也是联合国儿童基金会成立80周年。（摄影：界面新闻/蔡星卓）\r\n\n不过，这些经验“移植”到其他发展中国家仍面临落地困难。陈蓥婕告诉界面新闻，在进一步推进政策、项目乃至国际合作落地的过程中，还需要系统考虑怎么把社会系统的管理责任以及预算衔接起来。以校园高温预案为例，预警发布后，谁有权调整课时？停课后家庭照护缺口由谁填补？基层卫生机构如何跟进高脆弱性儿童？这些都需要属地提前明确。\n\n她补充，中国经验走出去同样也要进行“本地化”适配，如在部分发展水平相对有限的国家和地区，还要先解决气象预警如何传到网络差的社区、气象和卫生数据能否细化等问题。\n\n陈蓥婕还表示，流向儿童相关领域的气候资金不足也是一大难题。UNICEF的一项研究显示，“儿童视角缺位”明显存在于全球气候资金动员过程中。过往研究发现，当前中国气候投融资的儿童响应程度总体处于较低水平，普遍缺乏系统性的儿童视角。\n\n“我们对国内部分气候投融资试点城市的715个项目（总投资约1.43万亿元）展开研究发现，在总计约1.43万亿元人民币的投资中，经加权核算，与儿童相关的投资金额仅占总投资额的2.4%，绝大多数项目的儿童响应水平均为‘低’或‘无关’。”陈蓥婕认为，这种不均衡会阻碍气候投资惠益儿童，特别是公共资金无法发挥其应有作用。\n\n她进一步表示，在COP31气候资金、公正转型等大会最重点和白热化的磋商中，儿童和青年没有被考虑其中。“如果我们未来的气候目标、政策、预算乃至投资仍然对儿童的需求和脆弱性视而不见，这本身又会加剧代际不公正，乃至继续压缩孩子们在‘1.5℃超调情景下的世界’中的生存和发展空间。”她说。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cacd740f64f","title":"国家电网公司首套静止全功率发生器正式投运","url":"https://www.jiemian.com/article/15358183.html","summary":"国家电网消息，11月20日，国家电网有限公司自主研制的世界首套35千伏/30兆伏安IGBT串联型静止全功率发生器（SPG），经过短路试验后168小时试运行，在陕西延安330千伏方河变电站正式投运。","summary_short":"国家电网消息，11月20日，国家电网有限公司自主研制的世界首套35千伏/30兆伏安IGBT串联型静止全功率发生器（SPG…","digest":"国家电网消息，11月20日…","points":["国家电网消息，11月20日，国家电网有限公司自主研制的世界首套35千伏/30兆伏安IGBT串…","装备投运后，延安北部地区新能源功率可提升5万千瓦…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T16:27:21+08:00","size":1,"keywords":[],"body":"国家电网消息，11月20日，国家电网有限公司自主研制的世界首套35千伏/30兆伏安IGBT串联型静止全功率发生器（SPG），经过短路试验后168小时试运行，在陕西延安330千伏方河变电站正式投运。装备投运后，延安北部地区新能源功率可提升5万千瓦，供区每年可新增新能源上网电量约6000万千瓦时，相当于2万户家庭一年的日常用电需求。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf14dec53e0 ","digest":"11月21日，此前表示字节估值在6000亿美元会有兴趣的知名投资人段永平…","points":["11月21日，此前表示字节估值在6000亿美元会有兴趣的知名投资人段永平，进一步作出说明…","除非极为特殊的情况，我是不碰非上市公司的","”段永平强调，“只投上市公司的一个很重要的原因就是简单省事，不需要私底下跟任何人打交道"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T16:07:04+08:00","size":1,"keywords":[],"body":"11月21日，此前表示字节估值在6000亿美元会有兴趣的知名投资人段永平，进一步作出说明：“我昨天说如果字节估值在6000亿我会有兴趣，但潜台词是上市后哈。除非极为特殊的情况，我是不碰非上市公司的。”段永平也通过雪球账号“大道无形我有型”解释了作此说明的原因。“最近好几个私底下想办法找我要卖给我的人，这是我出来说明一下的原因。”段永平强调，“只投上市公司的一个很重要的原因就是简单省事，不需要私底下跟任何人打交道。”","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ceacd55f00e","title":"英国海上贸易行动办公室：一艘油轮在霍尔木兹海峡遭袭","url":"https://www.jiemian.com/article/15358117.html","summary":"当地时间11月21日，英国海上贸易行动办公室发布通报称，当天一艘油轮在阿曼海塞卜以北约11海里处遭袭。","summary_short":"当地时间11月21日，英国海上贸易行动办公室发布通报称，当天一艘油轮在阿曼海塞卜以北约11海里处遭袭。","digest":"当地时间11月21日，英国海上贸易行动办公室发布通报称…","points":["当地时间11月21日，英国海上贸易行动办公室发布通报称…","通报说，这艘油轮当时正驶离霍尔木兹海峡，船尾遭不明发射物击中","目前尚无人员伤亡情况报告，事件对环境造成的影响尚不明确"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T16:02:18+08:00","size":1,"keywords":[],"body":"当地时间11月21日，英国海上贸易行动办公室发布通报称，当天一艘油轮在阿曼海塞卜以北约11海里处遭袭。\n\n通报说，这艘油轮当时正驶离霍尔木兹海峡，船尾遭不明发射物击中。目前尚无人员伤亡情况报告，事件对环境造成的影响尚不明确。\n\n英国海上贸易行动办公室建议过往船只谨慎航行，并向该机构报告任何可疑活动。目前，有关部门正在调查这一事件。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c804d9502c9","title":"首届历史经典产业博览会落地浙江，共计约400余家企业参展","url":"https://www.jiemian.com/article/15357517.html","summary":"11月20日，首届历史经典产业博览会在杭州国际博览中心举行，本届博览会主题为“经典传承 新质兴业”。","summary_short":"11月20日，首届历史经典产业博览会在杭州国际博览中心举行，本届博览会主题为“经典传承 新质兴业”。","digest":"11月20日，首届历史经典产业博览会在杭州国际博览中心举行…","points":["11月20日，首届历史经典产业博览会在杭州国际博览中心举行…","中国前跳水运动员郭晶晶到场品茶，并参观朱炳仁铜等非遗产品","博览会设置国际丝绸展示区，产业综述展区，陕西等8个省份展区，浙江及其11个地市展区…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T16:01:38+08:00","size":1,"keywords":[],"body":"11月20日，首届历史经典产业博览会在杭州国际博览中心举行，本届博览会主题为“经典传承 新质兴业”。中国前跳水运动员郭晶晶到场品茶，并参观朱炳仁铜等非遗产品。\n\n博览会设置国际丝绸展示区，产业综述展区，陕西等8个省份展区，浙江及其11个地市展区，以及丝绸、茶叶、瓷器、中药、酿造、工艺美术等六大行业展区，共计约400余家企业参展，展出面积约3万平方米，集中展示了一批重点产区、龙头企业、经典品牌和创新产品。\n\n博览会期间还将举办百余场活动，包括主题对话、学术交流、产业对接、经典技艺体验等。比如围绕人工智能助力历史经典产业、产业多元融合、产业投融资等开展专场交流活动；针对青年传承创新、产业出海、品牌塑造、经典美学、中欧产业比较等开展深度研讨。\n\n展馆产业推介区将持续开展省市、产区、重点企业专场推介，组织新产品新场景发布、创新成果展示和供需洽谈对接，促进跨区域、跨主体产业合作。主题体验区可看丝绸、刺绣、竹编、湖笔、纸艺、金石拓印、中药、茶叶等技艺。\n\n浙江文投相关人士称，本届博览会落实《扩大消费“十五五”规划》和《关于推动历史经典产业高质量发展的意见》部署要求的具体举措，既系统展现我国历史经典产业深厚文化底蕴与产业基础，又集中呈现数智技术助力传统产业持续发展的实践，为推动历史经典产业向价值链中高端迈进打下基础。\n\n浙江历史经典产业发展、政策走在全国前列，是首届历史经典产业博览会落地在此的原因。\n\n2015年，浙江在全国率先提出以“历史经典产业”的全新视角，推动丝绸、茶叶、黄酒、中药、木雕、青瓷等文化底蕴深厚的中华传统特色产业提质。\n\n2024年，浙江省先后印发《浙江省历史经典产业高水平传承高质量发展若干政策举措》、《浙江省历史经典产业传承创新发展行动方案》，聚焦“四大高地”（创新发展高地、文化传承高地、品牌荟聚高地、人才集聚高地）建设目标，系统谋划、分业施策、协同推进，推动历史经典产业发展。\n\n截至2025年底，浙江省丝绸营收占全国一半，茶叶出口量居全国第一，淡水珍珠产量占全球70%以上，金华火腿在国内高端火腿及肉制品市场占有份额达到40%，龙泉青瓷是全球首个陶瓷类世界非物质文化遗产。\n\n未经正式授权严禁转载本文，侵权必究。长三角快讯历史 杭州\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n首届历史经典产业博览会落地浙江，共计约400余家企业参展\n\n博览会集中展示了一批重点产区、龙头企业、经典品牌和创新产品。\n\n原创新闻杨冰柯 · 2026/11/21 16:01来源：界面新闻\n\n图片来自浙江文投\n\n11月20日，首届历史经典产业博览会在杭州国际博览中心举行，本届博览会主题为“经典传承 新质兴业”。中国前跳水运动员郭晶晶到场品茶，并参观朱炳仁铜等非遗产品。\n\n博览会设置国际丝绸展示区，产业综述展区，陕西等8个省份展区，浙江及其11个地市展区，以及丝绸、茶叶、瓷器、中药、酿造、工艺美术等六大行业展区，共计约400余家企业参展，展出面积约3万平方米，集中展示了一批重点产区、龙头企业、经典品牌和创新产品。\n\n博览会期间还将举办百余场活动，包括主题对话、学术交流、产业对接、经典技艺体验等。比如围绕人工智能助力历史经典产业、产业多元融合、产业投融资等开展专场交流活动；针对青年传承创新、产业出海、品牌塑造、经典美学、中欧产业比较等开展深度研讨。\n\n展馆产业推介区将持续开展省市、产区、重点企业专场推介，组织新产品新场景发布、创新成果展示和供需洽谈对接，促进跨区域、跨主体产业合作。主题体验区可看丝绸、刺绣、竹编、湖笔、纸艺、金石拓印、中药、茶叶等技艺。\n\n浙江文投相关人士称，本届博览会落实《扩大消费“十五五”规划》和《关于推动历史经典产业高质量发展的意见》部署要求的具体举措，既系统展现我国历史经典产业深厚文化底蕴与产业基础，又集中呈现数智技术助力传统产业持续发展的实践，为推动历史经典产业向价值链中高端迈进打下基础。\n\n浙江历史经典产业发展、政策走在全国前列，是首届历史经典产业博览会落地在此的原因。\n\n2015年，浙江在全国率先提出以“历史经典产业”的全新视角，推动丝绸、茶叶、黄酒、中药、木雕、青瓷等文化底蕴深厚的中华传统特色产业提质。\n\n2024年，浙江省先后印发《浙江省历史经典产业高水平传承高质量发展若干政策举措》、《浙江省历史经典产业传承创新发展行动方案》，聚焦“四大高地”（创新发展高地、文化传承高地、品牌荟聚高地、人才集聚高地）建设目标，系统谋划、分业施策、协同推进，推动历史经典产业发展。\n\
