lay":"无綫新闻 TVB News","published_at":"2026-11-19T21:53+08:00","size":1,"keywords":[],"body":"大嶼山大東山爛頭營3號石屋，由信和置業家族旗下基金等，以288萬元投得，將用作遠足休憩區。\n\n較開價貴約6倍，由黃廷方慈善基金及大澳文物酒店投得，將改建為休憩區，給遠足者及遊客使用，並提供自動販賣機、售賣港式涼茶及朱古力熱飲等。\n\n石屋群位於大東山，共22間，當初用作華南基督教傳教士的避暑營地，至今有近百年歷史。\n\n今次拍賣的3號石屋，建築面積約2,500平方呎，屬群內面積最小，沒水電供應，而上一手業主，是香港電影導演翁維銓。","image":"https://pro-vod-cdn.tvb.com/5674c3a9ef774335b70e4079b00642d0/snapshots/d355aae1a58d416191d6f9fe23e0dddc-00003.jpg","video":"https://pro-vod-cdn.tvb.com/5674c3a9ef774335b70e4079b00642d0/450d22efd1434ceaa1af47d6f592cca9-5f91ce22139c84dd22cdd7522eeb6af6-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/5674c3a9ef774335b70e4079b00642d0/snapshots/d355aae1a58d416191d6f9fe23e0dddc-00003.jpg","lang":"zh-Hant"},{"id":"c01f51d7187","title":"樂施毅行者明開跑 視障跑手夥隊友挑戰100公里 盼證明殘障亦能創佳績","url":"https://www.stheadline.com/society/3639001/樂施毅行者明開跑-視障跑手夥隊友挑戰100公里-盼證明殘障亦能創佳績","summary":"年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里，如此高難度的比賽常人尚覺艱難，卻有視障人士和聽障人士勇於挑戰。","summary_short":"年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里…","digest":"年度大型遠足籌款活動「樂施毅行者」明起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑…","points":["年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行…","視障跑手朱健驊今年與隊友組成「猛龍長跑隊」參加活動，他接受《星島頭條》訪問時表示…","退役三項鐵人運動員 花一年半時間準備比賽"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:51:23+08:00","size":1,"keywords":[],"body":"年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里，如此高難度的比賽常人尚覺艱難，卻有視障人士和聽障人士勇於挑戰。視障跑手朱健驊今年與隊友組成「猛龍長跑隊」參加活動，他接受《星島頭條》訪問時表示，運動讓他更樂於表達自我，希望自身經驗能讓更多人知道，殘障人士也能在運動中取得成績，也能擁有豐富運動體驗。\n退役三項鐵人運動員 花一年半時間準備比賽\n朱健驊本身是退役三項鐵人運動員，如今僅有一成視力，在香港傷健共融網絡的組織下，與聽障跑手崔霞，以及兩名健全領跑員黃婉琪和姚永聰組成「猛龍長跑隊」，挑戰「樂施毅行者」100公里項目。朱健驊透露，為了挑戰如此高難度的活動，他花了一年半時間準備，做了很多山路實地練習和體能練習，也培養了和領跑員及隊友之間的默契。\n朱健驊患有先天性青光眼，從小較為多病，當時醫生建議他多做運動改善身體，他便開始接觸游泳，之後陸續嘗試長跑、三項鐵人、越野跑和HYROX等，更成為了專業三項鐵人運動員。數年前，朱健驊的視力急遽衰退，他因而選擇退役，希望以業餘身份繼續留在運動領域，「樂施毅行者」便是他參加的其中一個活動。\n領跑員笑言是「氣氛擔當」 幫視障隊友口述影像\n「猛龍長跑隊」隊友間以暱稱互稱，隊友叫他「朱仔」，他則以「琪琪」稱呼領跑員黃婉琪。領跑員與視障人士拍檔時，要以口述影像的方式向視障跑手描述周遭環境。雖然練習過程長達一年半，但朱仔笑言每一次與隊友練習都很開心，他尤其讚賞領跑員琪琪，因她在口述影像之餘還會和拍檔聊天，活絡氣氛。黃婉琪亦有接受訪問，聞此笑言「氣氛擔當好重要」，因視障人士行山時看不見風景或覺沉悶，故她會不斷幫隊友腦補畫面，例如周圍的人事物和風景等，希望視障人士在行山時，全部的感官都能參與其中。\n琪琪的口述影像不止仔細準確，更加入風趣比喻。朱仔也對琪琪的風趣幽默印象深刻，更表示自己參加過這麼多次行山比賽，最難忘的都是和領跑員或隊友的相處時光。他曾與琪琪拍檔參加過一場港島路線的50公里越野賽，期間發生過一個小插曲：當時朱仔和琪琪正在下山，視障人士下山速度本身較慢，山路後面便聚集起了不少等著下山的跑手，琪琪見此就向朱仔開玩笑，「哇，後面好多牛牛啊」。朱仔表示，自己下山時需高度專注，有時會心急，怪自己走得慢，但琪琪的比喻讓他放鬆不少。如今朱仔受訪時重新講述這個故事，也和琪琪一起邊講邊笑。\n領跑員最重要細心、觀察能力強\n黃婉琪做領跑員已有八九年時間，當初是覺得做領跑員既可貢獻社會，又可跑步減肥，便開始學習成為領跑員。她認為做領跑員最重要的是細心和觀察能力，除了周圍環境，還要用心去感受拍檔需要甚麼。黃婉琪舉例指，不同視障運動員的視覺缺損程度都不一樣，要事前先問清楚；而先天失明的跑手，身體平衡感往往與後天失明的人相比較差，這些細節都要多加留意。\n黃婉琪和許多視障拍檔合作過，觀察到視障運動員對每一次訓練都非常珍惜。她笑言，若約身體健全朋友行山，對方有可能遲到或臨時爽約，但視障朋友不但不會這樣，還會提前詢問她需要準備什麼，問清楚集合地點時間等。朱仔聞此亦十分同意，指自己作為運動員的觀念是，每次訓練都是為了日後比賽，所以次次都彌足珍貴；此外，領跑員犧牲私人休閒時間，放棄和朋友玩樂的機會，特地抽出時間陪他們訓練，這份心意也值得好好珍惜。\n視障充當聽障「耳仔」 目標30小時內完賽\n香港傷健共融網絡經理（運動康復及籌款）Fiona表示，猛龍長跑隊既有視障跑手，也有聽障跑手，有時視障跑手可充當聽障跑手的「耳仔」，若隊伍後面有跑手希望「爬頭」並大喊通知前方跑手，視障跑手便會拍一拍聽障隊友肩膀作通知。她續指，香港傷健共融網絡多年來組織過不少傷健共融隊伍參加不同運動項目或比賽，每一次大型賽事，機構都會設後方支援隊，除了幫助領跑員處理突發狀況外，也會為跑手送上食物和衣物等補給，讓隊員在夜間路段補充體力，添上厚衣，再繼續上路。\n\n黃婉琪表示，今年比賽前，「猛龍長跑隊」已參加各種活動及賽事來磨合和練習，有信心可跑出不錯的成績，目標是30小時以內完成路線。朱健驊表示，本次100公里路線是他挑戰過最長的行山路線，雖有些緊張，但更多是興奮及開心。「最重要是好好享受比賽，感受沿途路況，把過去訓練學到的技術實際運用出來。」\n朱健驊續指，運動已成為他人生的一部分，不但能保持健康，更可拓展他內心的視野。「心態變得開闊，就更願意說出自己的困難，也願意和更多人分享自己的心路歷程，讓大家知道，原來殘障人士也能在運動當中取得成績，而且也能擁有豐富的運動體驗。」談及傷殘帶來的影響，朱健驊坦言，不論是先天殘障抑或後天殘障的人士，很多人遇到這樣的狀況便會不想面對。「但很多事情如果你願意面對，就會更加能夠堅持，只要堅持下去，就會出現很多不同的結果。」除了勉勵同行人，他也希望未來能有更多健全人士接納殘障人士的需求，理解他們面對的困難，並給予更多嘗試機會，讓他們獲得更多體驗，拓闊視野。\n記者：周育瑩","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6005ce5850","title":"深圳APEC︱外媒首訪中國讚深圳「超乎想像」 亞美尼亞記者因「The Weeknd」新歌冀遊覽香港","url":"https://www.stheadline.com/politics/3638997/深圳APEC外媒首訪中國讚深圳超乎想像-亞美尼亞記者因The-Weeknd新歌冀遊覽香港","summary":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。","summary_short":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。","digest":"2026年亞太經合組織第33次領導人非正式會議最後一天在深圳舉行","points":["2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行","今次APEC會議周共有近5000名中外記者註冊報道，當中不少是初次到訪中國或深圳","《星島頭條》記者趁最後一天，在新聞中心採訪幾位分別來自俄羅斯、亞美尼亞及納米比亞的外媒記者"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:43:44+08:00","size":1,"keywords":[],"body":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。今次APEC會議周共有近5000名中外記者註冊報道，當中不少是初次到訪中國或深圳。《星島頭條》記者趁最後一天，在新聞中心採訪幾位分別來自俄羅斯、亞美尼亞及納米比亞的外媒記者。他們分享時不謀而合地讚嘆中國科技非常先進，美食很多元化，以及熱情好客的款待文化。談到香港，各人都表示認識且冀將到訪，亞美尼亞記者表示知道深港兩地很靠近，更指最近聽過歌手The Weeknd新歌《Hong Kong》，自己也因此很希望能遊覽香港。\n亞美尼亞記者：重慶麻辣顛覆認知 盼用《Hong Kong》拍片遊港\n亞美尼亞記者Diana數月前已抵中國進行採訪，坦言來華前對中國並無過多期望，然而這次旅程卻徹底打破她的刻板印象，對中國在高速現代化發展的同時，卻能保留傳統建築與文化表示敬佩。Diana分享，最喜歡的城市前三名分別是重慶、上海與深圳。她指重慶立體的城市景觀與璀璨夜景讓她大開眼界。她又指，重慶「麻辣」更徹底顛覆她對辣度的認知「之前我以為自己挺能吃辣；去過重慶之後，我才發現自己根本不懂什麼叫『辣』。」不過，她亦很欣賞這種圍爐共食、不看手機、專注聊天互動的用餐儀式「非常有人情味」。\n在深圳，她則嘗試燒賣和餃子等點心，稱感到十分驚喜。談及香港，她不僅渴望前往旅遊，還分享一個冷知識，指中環遮打道（Chater Road）是以亞美尼亞裔企業家Sir Paul Chater命名。她又指，知道加拿大歌手The Weeknd有一首新歌《Hong Kong》在網上非常熱門，自己也因此很想將來去到香港時，仿傚其他人用這首歌作配樂，分享遊覽香港的片段至社交平台。\n俄媒讚華強北「迷你高仿iPhone」 指深圳數字化超想像\n來自俄羅斯的Ilya Novikov曾於2023年到訪上海，卻是首次踏足深圳。他形容深圳給他的第一印象是「太不可思議了！」在深圳的兩天裡，他與同事一直在拍攝這座城市，特別提到南山區的景觀很美，指高樓林立、科技感亦十足。他們還參觀前海灣，體驗前沿的AI眼鏡、又到華強北參觀，笑言見到迷你版的高仿iPhone（barbie size iPhone），形容「It’s very cool」。同樣是首次到訪深圳、他的同事Dmitry Gavrilov則感嘆，深圳規模之大、城市之乾淨、數字化程度之高，均超乎他的想像。他大讚深圳市民熱情友好，在談到中西文化差異時，Gavrilov認為不應盲目比較東西方文化，指兩者雖截然不同，但也正因如此，兩者都非常美麗和獨特。\n納米比亞記者驚嘆深夜物流與AI生活 讚新聞中心設備完善\n來自納米比亞廣播公司的記者Rousa則是第二次來到深圳，她形容每次到訪都會被這裡無處不在的科技深深震撼。「AI雪糕機、AI咖啡機，無人機外賣」，指科技真的讓生活變得太便利，認為是展現「爭分奪秒」精神。Rousa又留意到，即使在凌晨2時，深圳依然有大量物流人員忙碌地為拼多多、淘寶等電商平台打包快件。她指這種高效社會節奏，以及高度普及的無現金交易方式，讓她深感敬佩，希望非洲大陸未來也能實現。\n作為與會記者，Rousa對本屆APEC新聞中心給予高度評價，認為設備非常完善，為國際媒體報導提供了極大便利。儘管在網絡上傳方面偶有延遲，但她表示各國記者之間互幫互助、交流採報經驗，形容是一次無與倫比的「人生體驗」，她會將這些寶貴的中國故事與採訪經驗帶回納米比亞。\n記者：陳俊豪、攝影：蘇正謙 深圳報道","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf3205505ea","title":"七旬翁偕友西貢深涌踩單車暈倒墮地 直升機送院搶救","url":"https://www.stheadline.com/breaking-news/3638973/七旬翁偕友西貢深涌踩單車暈倒墮地-直升機送院搶救","summary":"今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地，至深涌碼頭附近時，突然暈倒跌在地上，昏迷不醒，同行車友報警求助。","summary_short":"今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地，至深涌碼頭附近時…","digest":"下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地…","points":["今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地…","救援人員接報到場，政府飛行服務隊也派出直升機協助，將事主吊起送往東區醫院搶救"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:28:38+08:00","size":1,"keywords":[],"body":"今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地，至深涌碼頭附近時，突然暈倒跌在地上，昏迷不醒，同行車友報警求助。救援人員接報到場，政府飛行服務隊也派出直升機協助，將事主吊起送往東區醫院搶救。據了解，事主有身體病紀錄。\n男子送院時已陷昏迷。\n政府飛行服務隊也派出直升機協助，將事主吊起送往東區醫院搶救。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc369cdd1a5","title":"葵芳小巴站男子抽筋暈倒 救援人員施心外壓急救","url":"https://www.stheadline.com/breaking-news/3639004/葵芳小巴站男子抽筋暈倒-救援人員施心外壓急救","summary":"今日（19日）晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒，救援人員接報到場，將他送往仁濟醫院搶救。","summary_short":"今日（19日）晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒，救援人員接報到場…","digest":"晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒…","points":["今日（19日）晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒…","根據網上圖片所見，事主身穿黑色短褲，他倒卧小巴站旁邊，多名救援人員輪流替事主進行心外壓急救…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:28:02+08:00","size":1,"keywords":[],"body":"今日（19日）晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒，救援人員接報到場，將他送往仁濟醫院搶救。\n根據網上圖片所見，事主身穿黑色短褲，他倒卧小巴站旁邊，多名救援人員輪流替事主進行心外壓急救，其後為他戴上氧氣罩並抬上擔架床。\n救援人員輪流替事主進行心外壓急救。網上圖片\n事主被抬上擔架床。網上圖片\n現場為葵芳新都會廣場對開小巴站。網上圖片","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cec18ac715f","title":"獲匈牙利塞麥爾維斯大學頒授榮譽博士 中大校長盧煜明：彰顯兩校日益深化的學術聯繫","url":"https://www.stheadline.com/society/3638999/獲匈牙利塞麥爾維斯大學頒授榮譽博士-中大校長盧煜明彰顯兩校日益深化的學術聯繫","summary":"中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis University）頒授榮譽博士（Doctor Honoris Causa）學位。","summary_short":"中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis University）頒授榮譽博…","digest":"獲匈牙利塞麥爾維斯大學頒授榮譽博士 中大校長盧煜明：彰顯兩校日益深化的學術聯繫","points":["中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis Un…","榮譽博士學位為塞麥爾維斯大學最高學術榮譽之一，頒授典禮於匈牙利布達佩斯塞麥爾維斯大學歷史悠久…","盧煜明在致辭時表示，今天成為塞麥爾維斯大學的一員，讓我與被譽為「產婦的救星」…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:26:03+08:00","size":1,"keywords":[],"body":"中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis University）頒授榮譽博士（Doctor Honoris Causa）學位。榮譽博士學位為塞麥爾維斯大學最高學術榮譽之一，頒授典禮於匈牙利布達佩斯塞麥爾維斯大學歷史悠久的中央行政大樓內舉行，彰顯兩校日益深化的學術聯繫。\n盧煜明在致辭時表示，今天成為塞麥爾維斯大學的一員，讓我與被譽為「產婦的救星」、同時亦是大學命名人的塞麥爾維斯教授建立了深厚而個人的聯繫。他表示，自己畢生致力推動更安全的產前檢測，某種意義上可視為延續塞麥爾維斯教授致力改善孕婦及嬰兒福祉的歷史使命。\n中大校長盧煜明教授獲匈牙利塞麥爾維斯大學頒授榮譽博士學位。中大提供\n表彰盧煜明於分子診斷的貢獻\n今次榮譽博士學位旨在表彰盧煜明在分子診斷及醫學領域的開創性貢獻。盧煜明被譽為「無創產前檢測之父」，亦是液體活檢領域的先驅。他在1997年率先發現孕婦血漿內存有胎兒DNA，奠定無創產前檢測技術的基礎。相關檢測技術現已於全球超過100個國家採用，累計惠及逾一億名孕婦。\n此外，盧煜明近年亦將液體活檢技術應用於癌症早期檢測，成功研發可同時偵測多種癌症的血液測試技術，並推出作臨床應用。\n盧煜明研究成果對全球醫學科影響深遠\n盧煜明的研究成果對全球醫學科學界影響深遠，自2022年起出任香港科學院院長，他致力促進本地科研生態的長遠發展，並加強香港與內地及國際科研界的交流合作。盧煜明多年來在中國內地亦屢獲高度肯定，包括榮獲有「中國諾貝爾獎」之稱的首屆「未來科學大獎—生命科學獎」、成為首位華人科學家獲頒「復旦—中植科學獎」，以及當選中國科學院院士，並獲頒首屆「騰衝科學大獎」，充分體現其科研成就對國家醫學科技發展的重要貢獻。\n中大校長盧煜明教授獲匈牙利塞麥爾維斯大學頒授榮譽博士學位。中大提供\n盧煜明亦屢獲國際殊榮，包括「湯森路透引文桂冠獎」、「科學突破獎—生命科學」、英國皇家學會生物學科「皇家獎章」等。盧煜明在今年亦獲英國劍橋大學頒授榮譽醫學科學博士學位。\n進一步鞏固兩校轉化醫學領域夥伴關係\n今次獲塞麥爾維斯大學頒授榮譽博士學位，進一步鞏固中大與塞麥爾維斯大學在轉化醫學領域的夥伴關係，促進歐洲與亞洲之間的科研合作及學術交流。雙方合作涵蓋聯合科研活動，以及學生和研究人員交流計劃。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8f9def7377","title":"蔡天鳳案・今日重點｜鄺港智自辯揭三角關係 否認謀財害命 鄺球認以殘肢混青紅蘿蔔煲湯棄垃圾站","url":"https://www.stheadline.com/society/3638998/蔡天鳳案今日重點鄺港智自辯揭三角關係-否認謀財害命-鄺球認以殘肢混青紅蘿蔔煲湯棄垃圾站","summary":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。","summary_short":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。","digest":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智…","points":["28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智…","案件踏入第41日審訊，鄺港智出庭作供，庭上大爆震撼內情，透露與蔡天鳳…","而鄺球則承認將蔡天鳳部分殘肢與青紅蘿蔔煲湯後棄置垃圾站，對於為何烹屍則只以「唔知點解」回應"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:22:28+08:00","size":1,"keywords":[],"body":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。案件踏入第41日審訊，鄺港智出庭作供，庭上大爆震撼內情，透露與蔡天鳳、譚方駿維持三角關係多年，蔡天鳳為錢與譚方駿拍拖，鄺與蔡離婚後仍有性關係，而譚方駿其實「鍾意」的是鄺港智，想三人一起生活，譚家為傳宗接代亦不介意，後來鄺港智在內地相識新女友盧曉虹Ivy，卻因不捨蔡天鳳與譚方駿選擇與盧分手。而鄺球則承認將蔡天鳳部分殘肢與青紅蘿蔔煲湯後棄置垃圾站，對於為何烹屍則只以「唔知點解」回應。\n鄺港智自揭複雜三角關係「我哋三個真係好好㗎」\n鄺港智首日作供，憶述14歲與蔡天鳳同校相戀，並搬到蔡家同居，鄺曾學海南話為融入女家，與蔡母張燕花情同母子。鄺港智說女兒出生後，他為賺多點錢，牽涉盜竊案中，於是潛逃內地，蔡天鳳會到內地探望他，譚方駿後來亦會同行。鄺港智指「Chris（譚方駿）本身鍾意我嘅」，曾買碗米線向他示愛，鄺港智說譚方駿家人「想要小朋友，所以我哋就三個一齊囉，佢屋企人唔介意」。雖然三個人的關係複雜，但鄺港智形容「其實我哋三個真係好好㗎」，譚方駿就似是家人一樣，譚與蔡到內地探望他時，三人甚至同睡酒店一張床。即使蔡後來「改嫁」譚，蔡仍與鄺深吻並有性關係。\n鄺港智2022年於內地認識新女友盧曉虹Ivy，他形容是認真對待的關係，對方亦想跟他結婚。鄺港智向蔡坦白此事後，蔡哭着要求他回港，鄺港智思前想後，難捨蔡天鳳與譚方駿及子女，「又唔想害咗Ivy」加上自己正被通緝，最終與盧分手返港。\n相關新聞：\n蔡天鳳碎屍案｜鄺球認將蔡天鳳部分殘肢與青紅蘿蔔煮湯後扔垃圾站\n蔡天鳳碎屍案｜事前租龍尾村、凱旋門單位並添置工具 鄺球：「你可以講係巧合囉」\n蔡天鳳碎屍案｜鄺港智憶與蔡天鳳年少相戀 學海南話融入蔡家 與蔡母情同母子\n潛逃內地做名錶買賣生意大賺全給蔡天鳳\n鄺港智在代表大律師安華暉提問下說，2015年8月因涉盜竊案而「坐大飛」逃往內地，每程10萬元往返兩地，期間他經營買賣名錶生意賺逾2000萬元並將利潤交予蔡天鳳，自己在廣州以勞斯萊斯代步及用蔡天鳳等人信用卡。他又在內地從事商廈轉租項目投資，每月利潤約20至30萬元人民幣。\n相關新聞：\n蔡天鳳碎屍案｜指蔡天鳳為錢與譚方駿拍拖 二人離婚後仍與深吻性交 鄺港智：好正常啫\n蔡天鳳碎屍案｜鄺港智指與內地女友盧曉虹Ivy見家長 被蔡天鳳要求回港後分手\n支持賣加多利山單位可清還按揭\n就控方指鄺家為謀取加多利山單位而殺人，鄺港智直指「根本就無可能」。他稱十分支持賣樓搬往屯門，以方便子女就讀屯門哈羅香港國際學校及清還曼克頓山單位按揭，更曾說服鄺球簽署售樓授權書。惟他透露2022年中因女兒發燒，蔡天鳳與家姑李瑞香及鄺球爆粗互罵，鄺球一度欲揮手打蔡，自此翁媳決裂，蔡下令禁止鄺球入屋及見孫，鄺家只能瞞着她讓鄺球見孫。\n相關新聞：\n蔡天鳳碎屍案｜鄺港智指譚方駿「鍾意我」 譚家為傳宗接代不介意三角關係\n蔡天鳳碎屍案｜鄺港智：好支持賣加多利山單位搬屯門 方便上學順道還清按揭\n案發前租龍尾村及凱旋門單位買工具並非計劃\n控方再三質疑鄺球為何烹屍，鄺球只以「唔知點解」回應，又稱當時精神崩潰，忘記削骨剝肉過程，但同意曾將蔡天鳳部分殘肢加入青紅蘿蔔煲湯後扔到垃圾站。\n控方質疑鄺球在蔡天鳳死前約兩星期租用龍尾村單位並添置切割工具，又在情婦原租約未滿下以月租兩萬元租下凱旋門單位及替鄺港智辦新電話卡，認為準備、殺人、肢解及潛逃均屬三父子計劃。鄺球一概否認，辯稱租龍尾村是為做運動養生，買工具僅作裝修；而交出凱旋門租約及鑰匙，是因聽聞蔡天鳳常「俾面色佢（鄺港智）睇」，故提供落腳點，又反駁幼子水路潛逃回內地的說法。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c61d677ff11","title":"蘇黎世保險(香港)疑發生資料外洩 涉近4萬人姓名、身份證號碼等個人資料","url":"https://news.tvb.com/tc/1207278-蘇黎世保險香港疑發生資料外洩涉近4萬人姓名身份證號碼等個人資料","summary":"蘇黎世保險(香港)懷疑發生資料外洩，涉近4萬人姓名、身份證及護照號碼等個人資料。受影響的包括蘇黎世人壽保險(香港)，它們向客戶通報指，指周二偵測到懷疑被黑客入侵。","summary_short":"蘇黎世保險(香港)懷疑發生資料外洩，涉近4萬人姓名、身份證及護照號碼等個人資料。","digest":"蘇黎世保險(香港)懷疑發生資料外洩，涉近4萬人姓名、身份證及護照號碼等個人資料","points":["受影響的包括蘇黎世人壽保險(香港)，它們向客戶通報指，指周二偵測到懷疑被黑客入侵","初步調查顯示，有客戶個人資料，包括姓名、身份證號碼、保單資料等，或被未經授權存取","暫無證據顯示，涉及銀行戶口、信用卡等，已暫時停用相關網上平台，並通知受影響客戶"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T19:40+08:00","size":1,"keywords":[],"body":"蘇黎世保險(香港)懷疑發生資料外洩，涉近4萬人姓名、身份證及護照號碼等個人資料。\n\n受影響的包括蘇黎世人壽保險(香港)，它們向客戶通報指，指周二偵測到懷疑被黑客入侵。初步調查顯示，有客戶個人資料，包括姓名、身份證號碼、保單資料等，或被未經授權存取。\n\n暫無證據顯示，涉及銀行戶口、信用卡等，已暫時停用相關網上平台，並通知受影響客戶。","image":"https://pro-vod-cdn.tvb.com/c66d88699d5a4cd7b36baef09f2e5460/snapshots/2de0c6d35a36447c8f25cea7c4dad6cd-00005.jpg","video":"https://pro-vod-cdn.tvb.com/c66d88699d5a4cd7b36baef09f2e5460/487263c0f8af462faa861d4bdb0cf927-f75d07df240d4b802fba82d1100e2ace-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/c66d88699d5a4cd7b36baef09f2e5460/snapshots/2de0c6d35a36447c8f25cea7c4dad6cd-00005.jpg","lang":"zh-Hant"},{"id":"c8a2a65aa90","title":"機構指近期懷疑虐兒案大部分施虐者為家庭成員 促政府全面禁止體罰","url":"https://news.tvb.com/tc/1207312-機構指近期懷疑虐兒案大部分施虐者為家庭成員促政府全面禁止體罰","summary":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。其中一半個案涉及身體虐待，促請政府全面禁止體罰。","summary_short":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。","digest":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員","points":["防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員","其中一半個案涉及身體虐待，促請政府全面禁止體罰","防止虐待兒童會指，去年4月至今年3月接獲逾1,100宗求助"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T19:28:00+08:00","size":1,"keywords":["虐兒","體罰"],"body":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。其中一半個案涉及身體虐待，促請政府全面禁止體罰。\n\n社會接連發生體罰或虐兒事件。防止虐待兒童會指，去年4月至今年3月接獲逾1,100宗求助。當中約兩成與懷疑虐兒有關，涉及241名兒童，當中逾4成是3至8歲兒童。\n\n懷疑虐兒個案中，一半是身體虐待，其次是疏忽照顧佔約兩成，包括獨留在家等。亦有分別約一成涉及心理虐待及性侵犯。而逾7成施虐者是家庭成員，當中3成是母親，相信與管教困難，或對孩子期望過高等有關。\n\n防止虐待兒童會總幹事婁小君說：「家庭對於兒童而言，是最安全的地方。當他在家庭成員，遭受懷疑虐待行為，嚴重損害心理健康，例如不論信任，很容易產生驚恐、抑鬱，亦失去安全感，自我價值低落，覺得自己不配得到愛、關懷，更影響社交及人際關係。留意到自己管教及情緒上，意識到有波動，情況不知處理，盡快找專業人士。」\n\n《強制舉報虐待兒童條例》，實施至今10個月，防止虐待兒童會指，收到約960宗舉報及諮詢，其中專業人士的查詢按年減少。\n\n婁小君說：「過去一、兩年，在專業界別中，有很多意識或培訓，整個業界包括社署，在網上有保護兒童課程，根據指引專業人員，需向社署舉報，即保護家庭及兒童服務課或警務處，預見支援數字有分別。」\n\n機構又期望，政府能盡快訂立「沒有保護罪」， 更早識別、保護及介入。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20269ecN3rduup1795088171.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/d754639105d94a23903519812798fafa/a01eee3153614c1da93fb7e86efc32c1-b9c84ec9c9a2d1363b78c3bd280542c2-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20269ecN3rduup1795088171.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"}]},{"name":"內地","total":42,"items":[{"id":"ca4e9d336ac","title":"（深圳APEC）亚太经合组织互联互通蓝图发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml","summary":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。","summary_short":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。","digest":"亚太经合组织互联互通蓝图19日发布","points":["中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布","蓝图强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长","以《2040年亚太经合组织布特拉加亚愿景》为指引，朝着建设开放、活力、强韧…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T23:57:46+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。蓝图强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长；以《2040年亚太经合组织布特拉加亚愿景》为指引，朝着建设开放、活力、强韧、和平的亚太共同体迈进，实现亚太人民和子孙后代的共同繁荣。\r\n\n　　在“硬联通”方面，蓝图指出，目标是鼓励各经济体通过创新和应用现代技术建设、维护并升级高质量基础设施，提升硬联通水平。加强陆上、海上、航空互联互通，通过交通联接提升区域互联互通水平。推动交通运输领域创新与数字化转型，探索安全可靠的自动驾驶、无人技术等新兴出行解决方案，开展自愿知识交流，分享相关经验和良好实践，以提升对新兴技术的适应能力。\n\n　　在“软联通”方面，蓝图表示，目标为鼓励各经济体减少制度性壁垒，促进贸易和投资，推动建立更加紧密的区域经济。通过技术与创新、边境机构合作、适当的查验、自动化风险管理以及简化通关手续，推动海关程序现代化。取消贸易投资领域“边境后”壁垒，简化相关程序，提升效率、营商便利度、生产率和竞争力。\n\n　　在“心联通”方面，蓝图说，目标是通过促进商务人员流动，以及教育、旅游、人力资源开发和创新合作，加强惠及所有人的互联互通。促进商务人员流动，用好亚太经合组织商务旅行卡，鼓励商旅卡计划正式成员经济体接纳和使用亚太经合组织虚拟商务旅行卡。肯定应对非正常移民流动的重要性。加强教育、职业培训、技能提升等领域交流，探索科研人员流动，支持终身学习。\n\n　　在实施方面，蓝图表示，鼓励各经济体根据各自情况通过亚太经合组织现有工作机制，进一步推进区域互联互通。也鼓励同相关利益攸关方开展跨机制协作。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）亚太经合组织互联互通蓝图发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml","source_display":"中國新聞網","published_at":"2026-11-19T23:57:46+08:00","category":"內地","digest":"亚太经合组织互联互通蓝图19日发布"},{"title":"亚太经合组织互联互通蓝图","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734972.shtml","source_display":"中國新聞網","published_at":"2026-11-19T22:51:24+08:00","category":"內地","digest":"亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务…"},{"title":"亚太经合组织互联互通蓝图","url":"https://www.jiemian.com/article/15352436.html","source_display":"界面新聞","published_at":"2026-11-19T22:48:58+08:00","category":"","digest":"亚太经合组织互联互通蓝图  我们强调，互联互通促进本地区商品、服务、资金和人员流动…"}],"cross":{"total":3,"angles":[{"point":"亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务…","sources":["中國新聞網","界面新聞"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734972.shtml"},{"point":"亚太经合组织互联互通蓝图19日发布","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml"}]}},{"id":"c44445f9184","title":"（深圳APEC）2026年亚太经合组织领导人深圳展望发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734961.shtml","summary":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。","summary_short":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。","digest":"2026年亚太经合组织领导人深圳展望19日发布","points":["展望重申，亚太经合组织是区域经济合作的首要平台，将遵循自主自愿…","展望表示，将继续以市场驱动的方式，包括通过落实亚太自由贸易区相关议程，推进亚太区域经济一体化","亚太自由贸易区议程在提升各经济体参与高标准、综合性区域自贸安排的能力方面发挥着重要作用"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:37:01+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。展望重申，亚太经合组织是区域经济合作的首要平台，将遵循自主自愿、非约束性和协商一致的合作原则，致力于将亚太经合组织打造成一个更加现代、高效、务实的理念孵化器。\r\n\n　　展望表示，将继续以市场驱动的方式，包括通过落实亚太自由贸易区相关议程，推进亚太区域经济一体化。亚太自由贸易区议程在提升各经济体参与高标准、综合性区域自贸安排的能力方面发挥着重要作用。\n\n　　展望说，认识到数字化对驱动本地区创新、促进生产力和经济增长的重要作用，及其对促进贸易的积极作用。将继续促进贸易便利化，包括通过实施无纸化贸易和跨境电子商务等措施。\n\n　　展望表示，在现有进展基础上，核可《亚太经合组织互联互通蓝图》，鼓励各经济体继续努力，通过进一步夯实“硬联通”、“软联通”、“心联通”三大支柱，实现无缝、全面联通和融合亚太。\n\n　　展望称，鼓励各经济体推进数字互联互通，弥合社会各阶层以及城乡区域间的数字鸿沟，加强可及、有韧性的数字基础设施建设，推动数字转型，促进经济增长，提升数字素养与技能，推进数字平台建设。\n\n　　展望指出，支持推动关键领域的数字和新兴技术转型，利用数字和新兴技术改善公共服务，包括加强医疗卫生体系建设，为企业营造有利的发展环境，推广以市场为导向、以创新为驱动的做法，并为中小微企业提供可及的数字工具以赋能其发展。\n\n　　展望强调，应该帮助劳动者为未来工作做好准备，以把握技术进步带来的益处，并根据《亚太经合组织应对人口结构变化框架合作文件》应对人口结构变化。\n\n　　展望称，寻求加强跨能源部门和跨技术的综合安全，共同应对能源安全挑战，确保不间断、可依赖、可负担和可持续地获取能源，以支撑经济繁荣。鼓励围绕供应链韧性、基础设施互联互通、风险评估加强能源安全协作。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）2026年亚太经合组织领导人深圳展望发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734961.shtml","source_display":"中國新聞網","published_at":"2026-11-19T22:37:01+08:00","category":"內地","digest":"2026年亚太经合组织领导人深圳展望19日发布"},{"title":"2026年亚太经合组织领导人深圳展望 建设亚太共同体，促进共同繁荣","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734929.shtml","source_display":"中新網 時政","published_at":"2026-11-19T21:14:01+08:00","category":"內地","digest":"2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  　　我们…"},{"title":"2026年亚太经合组织领导人深圳展望","url":"https://www.jiemian.com/article/15352335.html","source_display":"界面新聞","published_at":"2026-11-19T21:12:53+08:00","category":"","digest":"2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  我们…"}],"cross":{"total":3,"angles":[{"point":"2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  　　我们…","sources":["中新網 時政","界面新聞"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734929.shtml"},{"point":"2026年亚太经合组织领导人深圳展望19日发布","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734961.shtml"}]}},{"id":"cbf804de13b","title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734919.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","三国元首围绕“维护世界和平，促进大国关系战略稳定”主题进行深入讨论","习近平指出，中俄美三国最高领导人有史以来首次聚首，具有开创性意义"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:35:16+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。三国元首围绕“维护世界和平，促进大国关系战略稳定”主题进行深入讨论。\n\n　　习近平指出，中俄美三国最高领导人有史以来首次聚首，具有开创性意义。历史告诉我们，大国和则世界安，大国斗则世界乱。和平是人类社会的永恒期盼。我们这个星球曾爆发过1万多次战争，当下世界上仍有60多场地区冲突延宕不止。80多年前，作为世界反法西斯的中坚力量，中俄美三国并肩奋战，取得伟大胜利，为世界赢得和平和安宁。历史是最好的教科书。我们要铭记历史，以史为鉴，开创未来。\n\n　　习近平强调，人类生活在同一个地球村，是一个命运共同体。在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。近年来，中国推进中俄新时代全面战略协作伙伴关系，积极构建中美建设性战略稳定关系，推动形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。当前，世界百年变局加速演进，天下并不太平。中俄美作为世界主要大国和联合国安理会常任理事国，应该当好表率，合作应对全球性挑战，共同维护世界和平稳定，为人类进步作出更大贡献。\n\n　　习近平指出，大国如何正确相处、共同为世界和平托底，是必须答好的时代课题。他就此提出4点看法：\n\n　　第一，坚持相互尊重。相互尊重是大国交往的基本准则。中俄美三国国情不同，要彼此尊重、求同存异、共同发展，包括尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重彼此核心利益和重大关切。要坚持不干涉别国内政，不干涉彼此内部事务。在涉及对方的重大敏感问题上，要提前沟通、换位思考、谨慎行事，特别是不能触碰对方的底线。\n\n　　第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线。中俄美都是二战主要战胜国，应当坚定维护战后国际秩序，维护《联合国宪章》宗旨，捍卫来之不易的二战胜利成果。核战争打不赢也打不得，要尽一切努力防止。\n\n　　第三，坚持合作共赢。中俄美三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。应该加强经贸合作，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n\n　　第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦就可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。国际社会期待大国就热点问题多做劝和促谈工作，中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。\n\n　　普京表示，感谢中方安排历史上首次俄中美元首会晤。俄中美都是大国和联合国安理会常任理事国，二战的胜利成果把我们联系在一起，捍卫《联合国宪章》宗旨、维护国际和平是三国共同责任，妥善处理热点问题符合三国共同利益。三国要坚持主权平等、不干涉内政原则，通过合作寻找平衡解决关切的办法。俄方愿同中方和美方相互尊重、平等对话、和平共处、妥处分歧，促进自由开放的国际贸易，维护能源、粮食安全，加强人工智能治理国际合作，共同为世界和平安全作出贡献。\n\n　　特朗普表示，美中俄三国元首会晤举世瞩目、非常重要，创造了历史。三国都是有核国，对维护世界和平稳定负有特殊重要的责任。三方应共同防止核扩散，避免核武器给人类带来灾难。维护稳定、实现和平需要对话，任何问题都应通过对话解决。我期待同习近平主席和普京总统一道，更好地保护我们的地球，使未来更安全。\n\n　　三国元首还就乌克兰危机、防止核武器扩散、中东局势、朝鲜半岛等重大国际和地区问题交换了意见。\n\n　　习近平在总结讲话中指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的，三国在维护世界和平上看法是一致的。三国都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平，大国应该重视各国合理安全关切；对话谈判是化解分歧的正确选择，只要对话不停止、大门不关上，和平就有希望；合作是应对挑战的必由之路，要基于共同利益加强合作，以合作促和平、谋共赢。\n\n　　习近平强调，今天三国元首会晤播下的种子，必将生根发芽、开花结果。三国要落实好会晤共识，继续加强沟通，以对话聚共识，以担当迎挑战，以合作促和平，共同推动建设一个更加美好的世界。\n\n　　会后，三国发表《中俄美元首和平宣言》。\n\n　　蔡奇、王毅参加。(完) 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734919.shtml","source_display":"中新網 時政","published_at":"2026-11-19T21:35:16+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734866.shtml","source_display":"中新網 時政","published_at":"2026-11-19T20:06:15+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"新华图讯｜习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734754.shtml","source_display":"中新網 時政","published_at":"2026-11-19T17:26:42+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"ca070b066e3","title":"大國外交｜習近平：中俄美應合作應對全球性挑戰 共同維護世界和平穩定","url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定","summary":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。習近平表示，中俄美應合作應對全球性挑戰，共同維護世界和平穩定。","summary_short":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","points":["國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","國家主席習近平稱：「當今世界早已不是彼此隔絕的孤島","人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:24+08:00","size":2,"keywords":[],"body":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。習近平表示，中俄美應合作應對全球性挑戰，共同維護世界和平穩定。\n\n國家主席習近平稱：「當今世界早已不是彼此隔絕的孤島。人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體。在這個地球村裡，大國肩負著特殊責任。大國良性互動不是選擇題，而是必答題。」\n\n習近平指出：「當前，世界百年變局加速演進，天下並不太平。風雨見擔當。作為世界主要大國和聯合國安理會常任理事國，中俄美應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定，為人類進步作出更大貢獻。」","image":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/snapshots/60793b0057e64254b53116321f5ad045-00008.jpg","video":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/8cf0cf8eb7c24cc881956d4956cb2e97-321a167a725a6d5e3ff5a6f4b80ffdf1-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/snapshots/60793b0057e64254b53116321f5ad045-00008.jpg","lang":"zh-Hant","items":[{"title":"大國外交｜習近平：中俄美應合作應對全球性挑戰 共同維護世界和平穩定","url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:24+08:00","category":"兩岸","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤"},{"title":"大國外交｜習近平指中美關係總體穩定向好","url":"https://news.tvb.com/tc/1207330-大國外交習近平指中美關係總體穩定向好","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:12:00+08:00","category":"兩岸","digest":"大國外交｜習近平指中美關係總體穩定向好"}],"cross":{"total":2,"angles":[{"point":"大國外交｜習近平指中美關係總體穩定向好","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207330-大國外交習近平指中美關係總體穩定向好"},{"point":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定"}]}},{"id":"cd2011b2bbf","title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳宣言》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳宣言-升級亞太互聯互通持續更新","summary":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。","summary_short":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行","points":["今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行","國家主席習近平將主持會議並發表重要講話","國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","size":2,"keywords":[],"body":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間，先舉行中美雙邊會談，再跟俄羅斯總統普京在南山區麒麟山莊，首次出席備受矚目的三方會談。外交部表示，這是中俄美三國元首歷史上首次面對面會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。\n​​相關新聞：APEC 2026懶人包 21成員聚首深圳談甚麼？ 和我們息息相關？ 一文看清重點全解析\n本屆深圳APEC新增一場重頭戲：中美俄元首今日將舉行歷來首次三方會談，或觸及伊朗、烏克蘭等問題，俄方正推動會後發表聯合聲明。\n相關新聞：深圳APEC｜中美俄將展二戰後首次三方對話 學者：聚焦地區穩定不復刻強權外交︱分析\n內地分析人士對《星島》指出，在目前全球政經格局動盪之際，中美俄三國元首不但在深圳「同框」，而且將破天荒召開三方峰會；若北韓領袖金正恩也現身深圳，今次峰會將是APEC成立37年來「含金量最高」的一次會議。據了解，各方正醞釀推動達成《深圳宣言》。\n相關新聞：深圳APEC︱峰會今揭幕習近平發表講話 被譽史上「含金量最高」\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n11月19日最新消息\n\n相關新聞：深圳APEC︱中美俄元首麒麟山莊會晤登場 習近平：大國良性互動是必答題\n中國外交部長王毅將舉行記者會，介紹APEC領導人非正式會議成果。 陳俊豪攝\n王毅總結APEC會議成果\n22：10\n\n中國外交部長王毅將舉行記者會，介紹APEC領導人非正式會議成果。記者會原訂於晚上7時30分，大約6時許，大會通知記者會推遲至9時30分才舉行。由於傳媒希望能即時了解中方在APEC的總結，現場約200名中外記者即使經過連日採訪，面對疲倦的身軀仍然堅持等候。大約於10時許，外長王毅終於現身記者會。王毅一踏上講台，即向在場記者表示「讓大家久等了，各位辛苦了」，他解釋自己由於要從機場趕回，因而延遲，之後再作出APEC的總結。\n\n18：55\n新華社報道，國家主席習近平、俄羅斯總統普京、美國總統特朗普今日（19日）在深圳舉行會晤。三國元首就當前國際形勢深入交換了意見，致力於維護戰略穩定和國際安全，同時發表和平宣言。\n相關新聞：深圳APEC︱中俄美元首發表和平宣言 四大要點包括防止核擴散進行對話\n\n18：40\n\n美國總統特朗普離開深圳，外長王毅到機場送行。\n深圳APEC｜美國總統特朗普離開深圳。 路透社\n深圳APEC｜美國總統特朗普離開深圳。 路透社\n習近平：美國應在台灣問題上做對的事\n18：01\n中美俄閉門會議結束，歷時約一個半小時。央視報道，會晤結束後，特朗普、普京先後離開會晤現場。\n17：22\n\n習近平、特朗普、普京目前正在進行閉門會談。\n17：10\n習近平稱，核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n習近平強調，各國要尊重彼此主權和領土完整，尊重各自選擇的社會制度和發展道路，尊重彼此核心利益和重大關切。\n16：50\n美國總統特朗普表示，美中俄在討論核武問題上具有獨特的優勢。\n習近平說，「歷史告訴我們：大國和，則世界安﹔大國斗，則世界亂。」\n16：40\n習近平指出，人類同處「地球村」，大國肩負特殊責任，大國良性互動並非「選擇題」而是「必答題」。\n他強調，面對世界百年變局加速演進、天下並不太平，中俄美同為聯合國安理會常任理事國，應當好表率，合作應對全球性挑戰並共同維護世界和平穩定。\n16：30\n俄羅斯總統普京感謝中方積極組織今次三國元首會晤。他強調，中美俄三國同為第二次世界大戰戰勝國，對維護全球和平穩定負有特殊責任，並表示烏克蘭局勢將是今次會談的重點議題。\n16：28\n國家主席習近平在深圳同俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤。\n普京抵達現場。\n15：05\n根據現場消息，隨行記者獲告知，中國國家主席習近平、美國總統特朗普及其各自代表團目前正在共進午餐。\n截至下午3時剛過，這場午宴仍在進行中；而原本預定於下午2時30分舉行的習近平、特朗普與俄羅斯總統普京三方會晤，因此有所順延。\n14：55\n央視報道，中國國家主席習近平將在深圳與俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤。 \n14：40\n央視報道，中美峰會已經結束。\n14：20\n習近平稱，中美關係整體穩定且不斷改善，建構建設性的中美戰略穩定關係也是前所未有。他將與特朗普合作，確保中美關係繼續朝着既定方向發展。\n特朗普則稱呼習近平為「我的朋友」，指雙方有非常特別的關係，只要兩人掌舵便不會出現問題；他又透露美中在確保霍爾木茲海峽能源暢通及阻止伊朗擁核上立場一致，並希望在俄烏戰事及芬太尼危機等領域展開合作。\n特朗普則稱，他計劃與習近平討論結束烏克蘭戰爭，之後再赴中美俄元首會晤。\n14：10\n據路透社引述克林姆林宮消息報道，普京與特朗普進行雙邊會晤後心情極佳。雙方討論了烏克蘭衝突及雙邊關係相關議題。\n14：00\n特朗普向習近平表示：「你是我朋友，我們有著非常特別的關係。」他強調，中美雙方已建立起公平的關係，「這正是我們所追求的」，並指全球其他地方無人能做到中美兩國所能達成的成就。\n在經貿議題上，特朗普指出中美兩國已以公平方式分攤關稅，並稱相關貿易委員會正為過往失衡的雙邊關係帶來平衡。此外，特朗普亦透露，兩國領導人均強烈認為，石油運輸應保持暢通無阻地經由霍爾木茲海峽進行。\n13：32\n特朗普已抵達麒麟山莊。據央視報道，特朗普與習近平已開始會晤。\n相關新聞：深圳APEC︱中美俄元首會晤麒麟山莊即將登場 習近平先晤特朗普\n13：12\n特朗普與普京會面結束，正在前往麒麟山莊，準備與習近平會面。路透社報道，特普兩人會晤大約半小時左右，普京告訴特朗普，很高興見到他。\n特朗普則以「我的朋友」來稱呼普京，說：「我們多年來一直保持着良好的關係。我們彼此已認識很久，我認為這會帶來很多美好的結果，或者至少會由此開始。但我相信這些美好結果會由此而來」。\n特朗普與普京會晤。路透社\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n12：35\n美俄元首在北京會晤。會晤開始前，特朗普與普京握手，並稱兩人多年來一直保持著良好的關係，認為這次會面會帶來許多美好的會面。據外媒報道，是次會談持續不到1小時。\n特朗普與普京在北京會晤。俄羅斯衛星通訊社\n領導人非正式會議中，普京與特朗普亦曾作互動。路透社\n11：45\n國家主席於今日（19日）舉行的出席亞太經合組織（APEC）領導人非正式會議上，再次與日本首相高市早苗握手。昨日在歡迎晚晏上，二人亦曾握手。二人兩次握手，習近平都是只微笑，未有作交談。\n相關新聞：深圳APEC︱習近平再與高市早苗禮節性握手 繼續保持微笑\n11：33\n美國總統特朗普多次表示，在深圳出席亞太經合組織（APEC）峰會期間可能與北韓最高領導人金正恩會面。不過朝中社今日（19日）報道，金正恩近日已轉赴東部咸鏡南道視察海軍大學，朝方至今未對美方的會面提議作出任何回應。\n相關新聞：深圳APEC︱金正恩視察咸鏡南道 朝方未回應是否與特朗普會晤\n11：25\n中美俄三國元首今日（19日）在深圳亞太經合組織峰會場邊舉行歷史性會談前夕，俄方一個神秘黑色公事包意外成為焦點。普京隨行海軍軍官在深圳下榻酒店外被拍到手提代號「Cheget」的核武公事包，面對記者追問更罕有在鏡頭前微笑承認：「沒錯，就是它。」\n相關新聞：深圳APEC︱普京隨行軍官直認手上「核公事包」 中美俄會晤前「騷肌肉」？\n10：40\n國家主席習近平、美國總統特朗普與俄羅斯總統普京周四（19日）在深圳舉行三方會晤。三人上一次共同出席國際峰會是2019年日本大阪G20峰會，但當時並未舉行三方會談。外交部指，是次中俄美三國元首首度舉行三方會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。亦有分析指出，中美俄領導人首度同框意義重大，但同時會引發美國盟友之疑慮。\n相關新聞：深圳APEC｜中美俄元首同框象徵意義重大 惟引發美盟友不安｜拆局\n09：55\n國家主席習近平主持第33次領導人非正式會議，並發表講話。習近平表示，今天會議的主題是建設亞太共同體，促進共同繁榮。相信在我們共同努力下會議會圓滿成功，爲亞太經合組織實現更大發展地區乃至世界的和平、穩定、繁榮貢獻力量。\n\n習近平在講話提出多個重點，中方將提供2000萬美元資助開展亞太經合組織務實合作，在深圳設立亞太共同體研究中心。此外，亦會推進亞太自貿區建設，減少貿易壁壘，提升數字化與便利化水平；第二，升級互聯互通，鞏固基礎設施硬聯通，深化軟聯通與跨境支付合作；打造創新支柱，以數字經濟和人工智能為引擎，促進數據安全流通；發展支柱，深化能源、糧食及綠色低碳合作，支持改善民生。\n相關新聞：深圳APEC︱習近平倡攜手搭建亞太共同體「四樑八柱」︱講話全文\n\n09：52\n習近平與一眾嘉賓統一戴上中式領巾，然後一同合照。\n習近平：會議將為世界和平穩定貢獻力量。央視截圖\n領導人非正式會議上，特朗普在台上與習近平交流。路透社\n領導人非正式會議上，各出席嘉賓帶上領巾合照。路透社\n09：38\n俄羅斯總統普京及美國總統特朗普先後抵達深圳國際交流中心，出席領導人非正式會議。\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n09：20\nAPEC 採用「經濟體」作為參與單位，所有成員均按其官方英文名稱（例如 Australia、Canada、China、Hong Kong, China、Chinese Taipei 等）的字母順序依次入座。\n年度的主辦方即東道主領袖擔任會議主席，負責主持會議，通常坐在主位或正中央。因此，今次深圳峰會，國家主席習近平坐在主位。\n相關新聞：深圳APEC︱領導人峰會座位合照安排有玄機\n09：00\n今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。\n08：45\nAPEC領導人非正式會議在深圳揭幕，美國總統特朗普由菲律賓抵達深圳後，隨即入住福田區深圳東海朗廷酒店。周三（18日）下午起，酒店周邊實施交通管制，大批市民自發在對面馬路圍觀，\n相關新聞：深圳APEC︱市民街頭歡呼迎特朗普車隊 隔空叫「請他吃豬腳飯」︱有片\n00：35\n內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。\n相關新聞：深圳APEC｜晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n​ 內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。 中新視頻\n11月18日最新消息\n23：50\n俄羅斯衛星通訊社報道指出，出席歡迎晚宴的俄羅斯總統普京與美國總統特朗普，分別獲安排坐在習近平及夫人彭麗媛的左右兩側。\n相關新聞：深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身訪華團\n19：23\nAPEC各經濟體領導人開始陸續抵達位於深圳福田區的深圳國際交流中心。這處將舉行領導人合影活動，並舉辦由國家主席習近平名義舉行的歡迎晚宴。大會在入口處安排樂師現場演奏，當美國總統特朗普入場時，更特意駐足欣賞一會。\n相關新聞：深圳APEC｜習近平舉行歡迎晚宴 特朗普與普京握手\n晚宴開始後，中美俄三國領導人更在台上交談，期間美國總統特朗普更與俄羅斯總統普京握手。\n\n習近平在歡迎晚宴上，向出席嘉賓祝酒。路透社\n經濟體領導人在歡迎晚宴上合照。路透社\n經濟體領導人到深圳國際交流中心，出席歡迎晚宴。路透社\n習近平親迎特朗普：禮尚往來\n16：45\n新華社報道，周三（18日）下午，國家主席習近平在深圳寶安國際機場迎接來華出席亞太經合組織領導人非正式會議的美國總統特朗普。在迎賓曲中，習近平同特朗普親切握手。三軍儀仗隊行舉槍禮，少年兒童向特朗普獻花。中美兩國國旗迎風招展，軍樂團奏兩國國歌，戰機飛越致敬。兩國元首向青年歡迎隊伍揮手致意。\n習近平表示，今年9月我訪美時，特朗普總統夫婦專程赴機場迎接，並舉行隆重歡迎儀式。中國是禮儀之邦，有禮尚往來的傳統。我歡迎你再次訪華，期待同你就事關中美關係、亞太合作和世界格局的重大問題深入交換意見，推動基於尊重、公平、對等的中美建設性戰略穩定關系向前發展。\n特朗普表示，感謝習近平主席親赴機場迎接，感謝中方特殊安排，很高興再次到訪偉大的中國。習近平主席是一位偉大的領袖，每一次同習近平主席會晤都非常愉快，相信此訪將進一步推進兩國關係，取得圓滿成功。\n蔡奇、王毅、黃坤明參加。\n相關新聞：深圳APEC｜特朗普結束訪菲啟程來華 上機前做「招牌」握拳頭動作\n16：27\n日本首相高市早苗抵達深圳，將出席領導人非正式會議，展開就任後的首次訪華之行。\n\n相關新聞：深圳APEC︱日本首相高市早苗抵華 接待層級低於其他領導人\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n12：04\n國家主席習近平與俄羅斯總統普京會晤。\n習近平與普京會晤。\n習近平與普京會晤。\n普京讚深圳最具活力的大都市之一\n11：20\n俄羅斯總統普京出席深圳前海國際會議中心出席2026年亞太經合組織工商領導人峰會開幕，並以經濟體領導人身份作特別致辭。普京表示，此次APEC舉辦地深圳給人留下了深刻印像。「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」\n10：00\n國家主席習近平在主旨演講上表示，中國「十五五」規劃既是自身的發展藍圖，也為亞太乃至全球經濟增長提供機遇清單，是中國面向全球工商界發出的合作邀約。\n\n中國將為全球工商界提供超大規模開放市場。中國擁有全球規模最大中等收入群體，投資和消費潛力巨大。\n相關新聞：深圳APEC｜習近平籲踐行真正多邊主義 共建亞太共同體\n習近平：中國正加快建設開放大市場\n習近平指出，從新能源汽車到智能家居，從銀發經濟到冰雪旅遊，每一個新賽道都為全球企業帶來新機遇。中國正在加快建設開放大市場，擴大優質產品和服務進口，將不斷催生多樣化新需求。\n中國將為全球工商界提供前景廣闊的發展空間。創新驅動、綠色轉型是中國經濟的關鍵詞。中國將加快構建現代化產業體系，推動科技創新和產業創新深度融合，為全球企業技術創新和發展壯大提供強勁動能。\n\n中國將為全球工商界提供互促共進的合作環境。面對單邊主義、保護主義衝擊，中國始終踐行真正多邊主義，堅定維護多邊貿易體制，維護世貿組織規則，推動世界貿易組織改革，不斷為世界經濟增長和國際經貿合作注入穩定性和確定性。中方將從降低關稅、擴大准入，到探索規則、管理、標準等深水區改革，全面落實製造業准入又准營，穩步擴大服務業領域開放，為全球企業來華投資興業提供更穩定、更可預期優質環境。\n今明兩日出席峰會 多國領袖齊聚深圳\n03：00\n18日凌晨，俄羅斯總統普京乘專機抵達深圳，出席APEC峰會。中共中央政治局常委、中央書記處書記蔡奇前往機場迎接。分析人士對《星島》指出，今年5月普京訪華時，接機是中共中央政治局委員、外長王毅，而今次接機的是政治局常委蔡奇，規格比之前更高。預計普京在峰會期間將與多國與會領袖就亞太區經貿合作及國際局勢等議題展開交流。\n克里姆林宮發言人周六表示，11月19日在深圳，普京將與國家主席習近平及美國總統特朗普舉行三方會晤。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳宣言》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳宣言-升級亞太互聯互通持續更新","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","category":"內地","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行"},{"title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳展望》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳展望-升級亞太互聯互通持續更新","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","category":"內地","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行"}]},{"id":"ced0cd41feb","title":"WTT冠军赛将首次登陆上海","url":"https://www.chinanews.com.cn/ty/2026/11-19/10734955.shtml","summary":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布，2027WTT上海冠军赛将于2027年1月19日至24日落户上海浦发银行东方体育中心…","summary_short":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","digest":"据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","points":["中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","WTT每个赛季在全球举办六站冠军赛","WTT上海冠军赛将作为2027赛季的首站冠军赛登场"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:22:28+08:00","size":2,"keywords":[],"body":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布，2027WTT上海冠军赛将于2027年1月19日至24日落户上海浦发银行东方体育中心，这也是WTT赛事首次来到上海。\n\n　　WTT每个赛季在全球举办六站冠军赛。WTT上海冠军赛将作为2027赛季的首站冠军赛登场。WTT冠军赛汇集来自全球的32名顶尖男子单打和女子单打选手，角逐这项运动中最重要的奖项之一。该赛事不设资格赛，来自世界各地的顶尖选手从第一轮开始直接进入淘汰赛对决，争夺1000点世界排名积分。\n\n　　上海拥有丰富的乒乓球历史，乒乓球在这里拥有深厚的群众基础和极高的参与度，是市民们最喜爱的体育运动之一。上海还培养了多位乒乓球世界冠军及奥运冠军。\n\n　　国际乒乓球联合会主席及WTT董事会主席佩特拉·索林表示：“对于WTT而言，每一座新的主办城市都意味着创造更多机会，让球迷亲近乒乓球、享受难忘的观赛体验，并与当地社区及合作伙伴建立深度连接。我们期待与中国乒乓球协会及本地赛事组委会紧密合作，共同呈现一场精彩的赛事，也希望以此为起点，与上海这座城市建立长期而紧密的合作关系。”\r\n\n　　中国乒乓球协会秘书长何潇表示，上海是中国乒乓球运动的发源地，同时拥有国际乒联博物馆和中国乒乓球博物馆，乒乓文化底蕴深厚。早在2005年，上海就成功举办第48届国际乒联世界乒乓球锦标赛，打造了一场属于世界乒坛的盛会。“本次WTT冠军赛落地上海，既能满足上海及周边广大民众对高品质文体生活的向往，不断提升大家的体育获得感与幸福感，也将进一步点燃市民参与乒乓球运动的热情，助力乒乓文化持续传播。”(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"WTT冠军赛将首次登陆上海","url":"https://www.chinanews.com.cn/ty/2026/11-19/10734955.shtml","source_display":"中國新聞網","published_at":"2026-11-19T22:22:28+08:00","category":"","digest":"据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…"},{"title":"WTT冠军赛将首次在上海举办","url":"https://www.jiemian.com/article/15352393.html","source_display":"界面新聞","published_at":"2026-11-19T22:06:24+08:00","category":"","digest":"11月19日，世界乒乓球职业大联盟宣布…"}],"cross":{"total":2,"angles":[{"point":"11月19日，世界乒乓球职业大联盟宣布…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15352393.html"},{"point":"据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/ty/2026/11-19/10734955.shtml"}]}},{"id":"c66a11bd409","title":"习近平：三国会晤播下的种子必将生根发芽、开花结果","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734863.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，总结此次会晤达成的主要共识。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤…","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","习近平指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的…","我们都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:50:40+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，总结此次会晤达成的主要共识。\n\n　　习近平指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的，三国在维护世界和平上看法是一致的。我们都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平。我们都同意大国应该重视各国合理安全关切。我们都主张对话谈判是化解分歧的正确选择。只要对话不停止、大门不关上，和平就有希望。我们都认为合作是应对挑战的必由之路，要基于共同利益加强合作，以合作促和平、谋共赢。今天三国会晤播下的种子，必将生根发芽、开花结果。中俄美三国要落实好会晤共识，继续加强沟通，以对话聚共识，以担当迎挑战，以合作促和平，共同推动建设一个更加美好的世界。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平：三国会晤播下的种子必将生根发芽、开花结果","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734863.shtml","source_display":"中新網 時政","published_at":"2026-11-19T19:50:40+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平：三国会晤播下的种子必将生根发芽、开花结果","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734825.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:59:09+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"c9d0400e029","title":"【和合共生】习言道｜大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075491.shtml","summary":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤","points":["11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤","习近平指出，大国和，则世界安"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻" :"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平就大国如何正确相处、共同为世界和平托底提出4点看法：\n\n　　第一，坚持相互尊重。相互尊重是大国交往的基本准则。中俄美三国国情不同，谁也改变不了谁，这是历史形成的，也是各自人民的自主选择。正确的态度是彼此尊重、求同存异、共同发展。要尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重彼此核心利益和重大关切。要坚持不干涉别国内政，不干涉彼此内部事务。在涉及对方的重大敏感问题上，提前沟通、换位思考、谨慎行事，特别是不能触碰对方的底线。\n\n　　第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线，努力跨越“修昔底德陷阱”。中俄美都是二战主要战胜国，应当坚定维护战后国际秩序，维护《联合国宪章》宗旨，捍卫来之不易的二战胜利成果。核武器是悬在人类头上的“达摩克利斯之剑”，应该全面禁止并彻底销毁，最终建立无核武器世界。核战争打不赢也打不得。要尽一切努力防止核战争，遵守《不扩散核武器条约》，维护全球战略稳定。\n\n　　第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。应该摒弃冷战思维，加强经贸合作，将资源大国、制造大国、消费大国的各自优势贯通起来，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n\n　　第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。当前，全球各种纷争持续不断，热点问题按下葫芦浮起瓢，国际社会期待大国多做劝和促谈工作。中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平就大国如何正确相处提出4点看法","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734794.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:15:33+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"界面晚报 | 习近平就大国如何正确相处提出4点看法；商务部谈当前消费市场表现","url":"https://www.jiemian.com/article/15348271.html","source_display":"界面新聞","published_at":"2026-11-19T17:27:00+08:00","category":"","digest":"习近平就大国如何正确相处提出4点看法  11月19日下午…"}],"cross":{"total":2,"angles":[{"point":"习近平就大国如何正确相处提出4点看法  11月19日下午…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15348271.html"},{"point":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734794.shtml"}]}},{"id":"ca9a0a4d01b","title":"【深圳APEC】融合四项非遗技艺 多处细节传递东方智慧 APEC围巾竟藏如此巧思","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-19/news1075513.shtml","summary":"11月19日，APEC各经济体领导人、代表合拍“全家福”。","summary_short":"11月19日，APEC各经济体领导人、代表合拍“全家福”。","digest":"11月19日，APEC各经济体领导人、代表合拍“全家福”","points":["11月19日，APEC各经济体领导人、代表合拍“全家福”","大家佩戴的红色、蓝色围巾，深深吸引了人们的目光","围巾主要设计方、苏州上久楷丝绸科技文化有限公司董事长吴建华受访时表示…"],"section":"內地","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T23:05:31+08:00","size":1,"keywords":[],"body":"11月19日，APEC各经济体领导人、代表合拍“全家福”。大家佩戴的红色、蓝色围巾，深深吸引了人们的目光。\n\n围巾主要设计方、苏州上久楷丝绸科技文化有限公司董事长吴建华受访时表示，两款名为“同心合锦”的围巾分别以宋锦、香云纱为面料，均为100%桑蚕丝，采用藏蓝和“故宫红”两种颜色。围巾融合四项非遗技艺，多处细节传递出东方智慧。 (记者 葛勇 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/9EE357CBF5804E3F91C516E4DDCAC26E.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c4b745663cb","title":"学者：中美建构建设性战略稳定关系 不支持“台独”表态具积极意义","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734968.shtml","summary":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出，相关对话反映出双方建构中美建设性战略稳定关系的积极意愿…","summary_short":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出…","digest":"围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出…","points":["中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述…","国家主席习近平19日在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普","习近平强调，在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:50:08+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出，相关对话反映出双方建构中美建设性战略稳定关系的积极意愿，美方表态释放出对台政策更趋审慎的信号。\r\n\n　　国家主席习近平19日在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。习近平强调，在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。特朗普明确表示，美国不支持“台独”。\n\n　　华侨大学客座研究员包承柯表示，习近平主席关于台湾问题的表述具有连续性。从今年5月中美元首北京会晤时强调“台湾问题是中美关系中最重要的问题”，到9月华盛顿会晤时表示“希望美方坚持反对‘台独’的正确立场”，再到此次深圳会晤强调“美方要坚持做正确的事”，可以看出，台湾问题始终是影响中美建设性战略稳定关系的重要因素。\n\n　　“‘坚持做正确的事’与‘避免中美关系出现大的波折’构成了‘进’与‘稳’的辩证关系。”北京联合大学台湾研究院教授朱松岭指出，前者是积极进取的方向，指明双方应该朝哪里走、多做加法；后者是审慎务实的底线，明确双方不能跨越的边界。他说，这显现出中国在大国关系与对外交往中的战略定力与底线思维。\n\n　　对于特朗普此次明确表示不支持“台独”，清华大学战略与安全研究中心副研究员孙成昊认为，这一表态具有积极意义，有助于降低“台独”势力误判形势的风险。\n\n　　包承柯认为，特朗普此次表态较此前“不想跨越9500英里打一场战争”等说法更加清晰，是本届美国政府首次正式明确表达这一立场。\n\n　　包承柯分析，此次美方涉台表述的变化主要基于两个因素：一是中美两国领导人在一年内实现三次会晤，在互动中加深互信，促使美方在处理台湾问题时更加谨慎；二是从全球战略大局看，各方都有妥善处理潜在冲突、避免大国对抗的现实需求，台湾问题是其中一个潜在风险点，妥善处理这一问题，有助于维护中美关系稳定，避免风波发生。\n\n　　“接下来，更重要的是观察美方能否在对台军售、官方往来和军事活动等具体行动上体现这一承诺。”孙成昊说，美国能否保持言行一致、避免向“台独”释放错误信号，将是检验建设性战略稳定关系成效的一项重要标准。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca5127e7650","title":"全国首单香港主体跨境数据知识产权登记落地广东","url":"https://www.chinanews.com.cn/dwq/2026/11-19/10734962.shtml","summary":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识产权存证登记平台获得登记…","summary_short":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数…","digest":"香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识…","points":["中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多…","这是全国首个香港经营主体通过跨境登记模式在粤获得数据知识产权登记","继向澳门经营主体颁发数据知识产权登记证书之后，广东目前已实现面向香港…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:33:27+08:00","size":1,"keywords":[],"body":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识产权存证登记平台获得登记，在19日举行的亚洲知识产权营商论坛“粤港澳大湾区分论坛”上，广东省市场监督管理局(知识产权局)为该企业颁发数据知识产权登记证书。\r\n\n　　这是全国首个香港经营主体通过跨境登记模式在粤获得数据知识产权登记。继向澳门经营主体颁发数据知识产权登记证书之后，广东目前已实现面向香港、澳门经营主体跨境数据知识产权登记的全覆盖。\n\n　　据介绍，此次登记的“影视竖屏视频镜头语言多模态训练数据集”由企业自有竖屏影视素材加工而成，共1001条镜头级记录、42个字段，以镜头级粒度完成多模态标注，面向AIGC竖屏视频模型训练，可为微短剧、竖屏广告、电商短视频等生产提供合规训练数据资源。\n\n　　香港经营主体跨境登记无现成先例。在广东省市场监督管理局(知识产权局)、广东省知识产权保护中心指导下，广州商标审查协作中心(广东省知识产权开发与服务中心)及相关服务机构与香港乾盛映像传媒有限公司建立港企跨境数据知识产权协同服务机制，破解香港企业资质核验、跨境合规、平台注册无先例等多项难题，落实两地监管要求，保障数据集权属清晰合规。\n\n　　香港乾盛映像传媒有限公司项目负责人表示：“这份登记证书，为我们香港自研的数据资产颁发了合法的‘数字身份证’。”\n\n　　近年来，广东省市场监督管理局(知识产权局)依托广东数字经济产业优势，统筹推进制度构建、登记实践、交易运用、权益保护、宣传推广全链条工作，为数据要素市场化配置改革提供有力支撑。\n\n　　截至2026年10月，广东省数据知识产权累计申请8699件，颁发证书5914件；落地数据知识产权质押70单，融资约13亿元；促成数据知识产权交易、保险、证券化金额2437.96万元；登记覆盖生物医药、先进制造、新一代电子信息、数字文创等多个重点产业领域。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c09a79539a6","title":"豪擲66萬｜遼寧千萬網紅收夫「現金花束」慶生 遭批炫富兼涉違法急刪片","url":"https://www.stheadline.com/realtime-china/3639009/豪擲66萬遼寧千萬網紅收夫現金花束慶生-遭批炫富兼涉違法急刪片","summary":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。","summary_short":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。","digest":"遼寧錦州近日一場高調生日宴引發內地網絡熱議","points":["遼寧錦州近日一場高調生日宴引發內地網絡熱議","一名男子為慶祝妻子41歲生日，竟豪擲66萬元（人民幣，下同）的百元大鈔…","事發於周三（18日）深夜，有網民在社交平台發布一段生日會現場片段…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:30:50+08:00","size":1,"keywords":[],"body":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。一名男子為慶祝妻子41歲生日，竟豪擲66萬元（人民幣，下同）的百元大鈔，紮成巨型「現金花束」贈予愛妻，場面相當誇張。相關片段在社交平台瘋傳後，隨即惹來網民批評炫富及質疑違法；事件發酵後，涉事網紅今日（19日）將帳號內所有影片全數清空。 \n稱「物質是表達愛最好方式」 \n事發於周三（18日）深夜，有網民在社交平台發布一段生日會現場片段，顯示場內擺放著一束體積龐大的現金花束。替同行代班拍攝的攝影師向內地傳媒透露，現場是一名丈夫為41歲妻子慶生，該巨型花束全數由66萬元的百元大鈔紮成。 \n場地工作人員亦證實，該66萬元現金花束為男方送給妻子的生日禮物，兩人育有3名子女，女方是坐擁千萬粉絲的知名網紅，花束由當事人自行委託花店製作。針對有網民留言提醒「用人民幣紮花屬違法行為」，工作人員表示並不知情，並指網上不少人仿效及有花店提供相關服務。 \n綜合內媒報道，該名擁有逾1,200萬粉絲的女網紅於18日晚曾連發多段生日會影片，並感性發文稱：「愛不需要錢，但證明愛需要，物質不能代替愛情，但卻是表達愛的最好方式。」不過，隨着事件登上熱搜並，大批網民批評「俗不可耐」、「赤裸裸炫富」後，涉事女網紅、攝影師及場地方的社交帳號於今日下午均已刪除相關片段，女網紅的個人帳號作品更顯示為「0」，連帶其生日會直播帶貨的回放紀錄亦一併下架。 \n據悉，涉事網紅是快手平台的胡顏雪，其丈夫為熊健。目前胡顏雪的帳號已改為私密狀態。\n律師：妨礙貨幣流通屬不當使用 \n針對「現金花束」的法律爭議，河南澤槿律師事務所主任付建指出，根據《中華人民共和國人民幣管理條例》，人民幣作為國家法定貨幣，禁止故意毀損或妨礙其正常流通。即使以平鋪方式製作花束未有造成紙幣破損，但將貨幣當作裝飾擺件使用、使其脫離支付流通功能，已屬「不當使用人民幣」。 \n付建補充，行政機關可對相關行為人或花店經營者予以警告，若涉及大量使用或公開售賣此類花束且情節較重者，更可並處罰款。\n武漢大學社會學教授尚重生則批評，用巨額現鈔紮花看似浪漫實則並不高雅，是一種低級的表達方式，且存在治安及財物安全隱患。他強調，千萬級粉絲的網紅其流量與財富皆來自社會大眾，此類高調炫富行為極易對粉絲尤其是青少年群體的價值觀造成不良誤導。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c73d31493db","title":"（深圳APEC）以船为喻，中国向亚太发出“同舟之约”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734948.shtml","summary":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。","summary_short":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。","digest":"11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象","points":["中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼…","作为全球单体规模最大的集装箱码头之一，这里每周有53条直通亚太经合组织(APEC)成员经济体…","中国的新能源汽车、照相机由此出海，马来西亚榴莲、智利车厘子跨海而来"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T22:25:14+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。作为全球单体规模最大的集装箱码头之一，这里每周有53条直通亚太经合组织(APEC)成员经济体的航线。中国的新能源汽车、照相机由此出海，马来西亚榴莲、智利车厘子跨海而来。在亚太地区，类似的航程每时每刻都在发生。彼此相连，也意味着休戚与共。\n\n　　11月19日，在深圳举行的APEC第三十三次领导人非正式会议上，中国国家主席习近平指出，亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，携手应对困难和挑战，持续培育共同体意识。他提出，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　四个关键词勾勒出亚太合作的新航向，也回答了一个现实问题：面对风高浪急的国际环境，亚太这艘大船如何行稳致远？\n\n　　风浪面前，首先要同舟共济。\n\n　　APEC21个经济体覆盖约30亿人口，经济总量约占全球GDP六成，贸易额占全球近一半，成员间产业链供应链深度互嵌。\n\n　　“没有人能单打独斗”，智利总统卡斯特说，有一些人有资源，剩下的人可能有技术，其他人有资本。只有大家一起开放市场，才能共存。\n\n　　当单边主义、保护主义掀起风浪，团结协作就是成本最低的“避险资产”。亚太经济体拉紧共同利益纽带，亚太这艘“大船”方能行稳。\n\n　　船要行得远，还要有畅通的航道。\n\n　　摩根大通中国区联席首席执行官、亚太区首席财务官何耀东表示，互联互通将带来新的经济机遇。在秘鲁，钱凯港开港两年来，中秘海运时间缩至最短23天。在印度尼西亚，雅万高铁重塑了爪哇岛经济格局。\n\n　　天丝集团首席执行官许馨雄表示，对于亚太各经济体而言，开放融通能够放大比较优势，打通要素流动堵点，共享市场扩容、技术互鉴、规则对接的红利，天丝集团正是亚太开放融通的受益者。\n\n　　要驶向新航程，还需要不断注入创新动力。\n\n　　如今，新一轮科技革命和产业变革正在重塑全球竞争格局。对于亚太经济体而言，创新不是“选择题”，而是稳住增长、化解风险、实现共同发展的“必答题”。\n\n　　中国企业研究院首席研究员李锦表示，过去各种案例已反复验证，创新既能帮助单个经济体转型升级，也能通过区域协同一起抵御外部风险、共享发展红利。\n\n　　如今，中国的新技术新产业加快走向亚太。在智利圣地亚哥市郊，中国设计的智慧农业无人机精准作业，帮助当地农场减少农药和水的使用。\n\n　　大船要走得稳，更不能落下任何一位同行者。\n\n　　亚太经济体多样性突出，发展诉求各异。在毕马威中国副主席、华南区首席合伙人伍耀辉看来，如何把“共同繁荣”的愿景转化为各经济体、各类企业都能参与并且能够受益的具体合作极为关键。\n\n　　中国银联股份有限公司董事长董俊峰说，印度尼西亚约有3500万、越南约有1600万小商户没有POS机，银联为其提供线下二维码收款牌，全球银联持卡人扫码即可购买越南芒果、泰国榴莲。一张张二维码，把亚太小商户接入了跨国消费网络。\n\n　　今年是中国“十五五”开局之年，中国为亚太提供新的“机遇清单”，也向各方发出“登船”邀请。从“同舟之约”到共同繁荣，亚太千帆，乘风共进。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3737614351","title":"在深圳APEC，全球CEO共话产业发展新方向","url":"https://www.chinanews.com/shipin/2026/11-19/news1075507.shtml","summary":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。","summary_short":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。","digest":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕","points":["11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕","峰会以“共促繁荣，共赢未来”为主题，为期两天，吸引了2000余位政商代表参会","在这场全球经贸最前沿，多位CEO接受了三里河的采访，从他们反复提及的关键词中…"],"section":"內地","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:22:35+08:00","size":1,"keywords":[],"body":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。峰会以“共促繁荣，共赢未来”为主题，为期两天，吸引了2000余位政商代表参会。在这场全球经贸最前沿，多位CEO接受了三里河的采访，从他们反复提及的关键词中，我们能瞥见全球产业的未来趋势。(戴悦 董羽辰 黄蕾 迟瀚宇 李金磊 宫宏宇）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/b0580201-8856-4188-bf5f-74c32477c0f1.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ca97a0771a5","title":"八分鐘兩岸新聞重點｜中俄美元首會晤／APEC會議習近平講話／澳門大賽車","url":"https://news.tvb.com/tc/1207327-八分鐘兩岸新聞重點中俄美元首會晤APEC會議習近平講話澳門大賽車","summary":"【中俄美元首會晤｜習近平：三國播下種子必開花結果】國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言，包括計劃增加石油產量、進行對話減少核風險。習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果。","summary_short":"【中俄美元首會晤｜習近平：三國播下種子必開花結果】國家主席習近平、俄羅斯總統普京及美國總統特朗普…","digest":"【中俄美元首會晤｜習近平：三國播下種子必開花結果】國家主席習近平…","points":["【中俄美元首會晤｜習近平：三國播下種子必開花結果】","國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言…","習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:19+08:00","size":1,"keywords":[],"body":"【中俄美元首會晤｜習近平：三國播下種子必開花結果】\n\n國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言，包括計劃增加石油產量、進行對話減少核風險。習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果。\n\n【習近平稱應避免中美關係出現大波折】\n\n中俄美元首會晤前，中美、美俄元首分別舉行雙邊會談。國家主席習近平會見美國總統特朗普時稱，在台灣問題上美方要堅持做正確的事，避免兩國關係出現大波折。特朗普稱美方不支持「台獨」。\n\n【APEC領導人會議｜習近平籲成員經濟體攜手應對挑戰】\n\n亞太經合組織(APEC)領導人非正式會議在深圳召開，國家主席習近平主持會議並發表講話，呼籲各成員經濟體守望相助應對挑戰，中方會提供2,000萬美元，在深圳設立「亞太共同體研究中心」，開展政策研究和交流。\n\n【APEC｜馬斯克自稱中國超級粉絲】\n\n特斯拉公司首席執行官馬斯克在深圳出席APEC相關活動，自稱是中國超級粉絲，又盛讚中國到處是壯麗景色。\n\n【寒潮持續影響內地多地降雪降溫】\n\n寒潮持續影響內地，多地降雪降溫，中國天氣網推出全國羽絨服預警地圖，將氣溫數據轉成穿衣建議，方便民眾參考。\n\n【澳門大賽車｜首日上演多項練習賽和排位賽】\n\n第73屆澳門格蘭披治大賽車開鑼，首日上演多項練習賽和排位賽，有16歲的澳門本地女車手，首次出戰澳門四級方程式大賽。","image":"https://pro-vod-cdn.tvb.com/31da978970204988a75fb311e22dd796/snapshots/4070157d3a10489095ba6adeb095d85d-00008.jpg","video":"https://pro-vod-cdn.tvb.com/31da978970204988a75fb311e22dd796/15eb196564bb4a26babfa98912939434-c91ecd1a46d41b5e431a507c0793a515-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/31da978970204988a75fb311e22dd796/snapshots/4070157d3a10489095ba6adeb095d85d-00008.jpg","lang":"zh-Hant"},{"id":"c50d0b3c25c","title":"（近观中国）“鹏城”之会，习近平寄语亚太合作鹏程万里","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734949.shtml","summary":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。","summary_short":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。","digest":"“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里","points":["中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞…","”19日在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议上…","30多年来，亚太地区经济快速发展，面貌日新月异"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T22:09:14+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。”19日在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议上，中国国家主席习近平这样寄语亚太合作。\n\n11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议。中新社记者 赵文宇 摄\n\n　　深圳又名“鹏城”。在中国古籍里，相传鹏鸟能飞万里路程，由此引喻前程远大、前景无限。\n\n　　30多年来，亚太地区经济快速发展，面貌日新月异。构建亚太共同体是实现本地区长远发展繁荣的必由之路，也是各方的共同愿景。\n\n　　此次“鹏城”之会，着眼推动建设亚太共同体，习近平强调要“和衷共济”“开放融通”“开拓创新”“包容发展”。\n\n　　“这16个字里既有传承也有创新。”中国外交学院院长高飞说，一方面是对APEC推进区域经济一体化等成功经验的概括总结，另一方面融入“你中有我、我中有你”的共同体意识。\n\n　　“和衷共济”一词被置于首位。习近平指出，“浩瀚的太平洋承载千帆、滋养万物”，强调“亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助”。\n\n图为深南大道的APEC主题花坛花团锦簇。中新社记者 陈楚红 摄\n\n　　在习近平的APEC时间里，他曾多次以“船”为喻，提出重大理念主张。中国国际问题研究院亚太研究所所长蓝建学说，中方此次强调“和衷共济”，既是直面单边主义、地缘对抗等当前存在的“风浪”，也意在以“求同存异、和合共生”的智慧凝聚力量，为亚太合作开创新局面。\n\n　　在系统阐述亚太共同体丰富内涵的同时，习近平也为其指明建设路径。从强化经贸支柱到升级联通支柱，从打造创新支柱到夯实发展支柱，中方表示愿同各方一道携手搭建亚太共同体的“四梁八柱”。\n\n　　中国社会科学院亚太与全球战略研究院研究员许利平说，亚太共同体建设已取得一系列务实成果。面向2040年建成亚太共同体这一愿景，中方作为东道主适时提出搭建“四梁八柱”，将助力破解建设过程中的堵点、难点，进一步汇聚行动合力。\n\n　　以互联互通领域为例，习近平今次强调要巩固“硬联通”，增强“软联通”，密切“心联通”，提出“推动智慧海关、智慧交通建设”“深化跨境支付合作”等一系列举措。\n\n　　高飞表示，互联互通是区域合作的纽带。相关举措有助于为未来区域经济一体化夯实基础，也将为亚太乃至全球繁荣增长注入动力。\n\n　　中国是亚太经济合作的倡导者、推动者、先行者，也是积极的行动派。在深圳这座充满未来感的城市，习近平提出，中方将立足亚太合作，在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。此外，旨在提供智力支撑的亚太共同体研究中心也将落户“鹏城”。\n\n　　蓝建学表示，数字经济和人工智能是创新增长的引擎。这将为搭建“四梁八柱”进一步提供支撑，将合作共识落到实处。\n\n　　“在这些新兴领域，亚太经济体拥有广阔的合作空间。未来取得丰硕成果，不仅将为推进建设亚太共同体提供新的路径，也可更好造福地区人民。”许利平说。\n\n　　“大鹏一日同风起”，2026APEC“中国年”的会标取自鲲鹏意象，21根交织的羽翼宛如振翅凌云。这既是APEC21个经济体共生共荣的生动缩影，也承载着东道主对于“乘大势、共翱翔”的美好期许。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc2efb3ba6e","title":"（深圳APEC）事关中国经济 外媒五大关切在深圳找到答案","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734942.shtml","summary":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸  　　“中国挤压了别国发展空间？","summary_short":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸  　　“…","digest":"题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸…","points":["中新社记者 张焕迪 国璇 尹倩芸","新西兰NZINC公司总经理弗兰·奥沙利文用事实给出回答…","2025年，新西兰32%的乳制品、55%的木材、41%的肉类和34%的羊毛销往中国"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:50:45+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案\n\n　　中新社记者 张焕迪 国璇 尹倩芸\n\n　　“中国挤压了别国发展空间？”“中国新能源真的‘产能过剩’？”……一段时间以来，外媒对中国经济有种种疑问。\n\n　　当亚太经合组织(APEC)大家庭齐聚深圳，这些问题在这座“奇迹之城”找到了答案。\n\n　　问题一，“中国挤压了别国发展空间？”\n\n　　新西兰NZINC公司总经理弗兰·奥沙利文用事实给出回答：新西兰是第一个与中国签署自贸协定的发达国家，这些年从与中国的合作中“受益良多”。\n\n　　2025年，新西兰32%的乳制品、55%的木材、41%的肉类和34%的羊毛销往中国。\n\n　　“不论是新技术发展、生产力提升，还是工作岗位增加，亚太地区伙伴都从中国的发展中受益。”澳大利亚总理阿尔巴尼斯说。\n\n　　合作，是深圳“APEC时间”的高频词。大批商界人士带着合同赴“深圳之约”，中国的发展为亚太增长提供了坚实支撑。\n\n　　问题二，“中国AI技术‘成色’究竟如何？”\n\n　　在华强北，在深圳湾文化广场，在APEC新闻中心的机器人身上，答案呼之欲出。\n\n　　“中国人工智能技术和机器人产业发展迅猛，很多国家望尘莫及。”尼日利亚记者马克·朗延感叹。首次来华的德国客商托马斯认为，中国在AI领域已领先德国。\n\n　　透过深圳这扇窗，人们看到，中国AI竞争力的来源在于持之以恒的自主创新与长期积累。\n\n　　泰国国家会议展览局局长苏帕万·提拉拉特说，他尤其看重深圳在AI领域的创新能力，期待与至少1000家深圳企业合作。\n\n11月17日，位于广东深圳的中国首个具身智能机器人示范街区上演一场大型机器人表演，以“机器人总动员”迎接APEC。　中新社记者 陈楚红 摄\n\n　　问题三，“中国对外资吸引力下降？”\n\n　　泰国中华总商会副主席李桂雄的回答是：中国的发展实实在在，“外界怎么讲都推翻不了”。\n\n　　统计显示，今年前7个月中国新设立外商投资企业超3.7万家，高技术产业实际使用外资同比增长32.7%。\n\n　　115家世界500强企业代表齐聚前海，APEC工商领导人峰会现场座无虚席。商界人士“用脚投票”，充分表明了中国市场对外资的吸引力。\n\n　　问题四，“中国新能源产能过剩？”\n\n　　“这种说法本身十分自私。”加拿大韦博网讯科技(WPIC)首席执行官雅各布·库克说。\n\n　　有分析指出，部分国家炒作中国新能源“产能过剩”，意在维护自身产业地位、遏制中国产业升级，是以产能过剩之名行贸易保护之实。\n\n　　此次在深圳，多位APEC成员经济体领导人对封闭和贸易保护说“不”。马来西亚总理安瓦尔说，任何国家都不可能在孤立的情况下实现发展。韩国总统李在明称，为了打造稳定的产业基础与供应链，各方必须深化合作。\n\n11月15日，中外客商在深圳华强电子世界选购商品。中新社记者 张祥毅 摄\n\n　　问题五，“中国经济发展前景如何？”\n\n　　从边陲小镇到国际化大都市，深圳的发展历程就是最好的答案。\n\n　　今天的深圳汇聚了来自100多个国家和地区的国际化人才，掌纹支付、飞行汽车等创新不断刷新想象。“希望我的祖国也能有一个深圳”，一名西班牙学者的感慨引发众多海外网友共鸣。\n\n　　在这座“奇迹之城”，外国友人感受到了中国经济的活力，也捕捉到了中国发展带给世界的机遇。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c541ec05fb3","title":"（深圳APEC）说粤语的泰国总理","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734860.shtml","summary":"中新社深圳11月19日电 题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心！","summary_short":"中新社深圳11月19日电 题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心！","digest":"题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心","points":["中新社深圳11月19日电 题：说粤语的泰国总理","”18日，泰国总理阿努廷在深圳用一句地道粤语，形容来到广东的感受","源于这种亲切感，每次我见到中国人都很开心"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:39:58+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：说粤语的泰国总理\n\n　　中新社记者 门睿\n\n　　“好开心！”18日，泰国总理阿努廷在深圳用一句地道粤语，形容来到广东的感受。\n\n　　对于阿努廷而言，广东有着特殊的意义。\n\n　　阿努廷祖籍广东。他曾在接受中国媒体采访时说：“我的父母、祖父祖母、外祖父外祖母都来自中国。我在泰国出生，有中文名字，家里也说粤语。源于这种亲切感，每次我见到中国人都很开心。”\n\n　　11月18日，阿努廷在2026年亚太经合组织(APEC)工商领导人峰会上发表演讲时用中文问好。一句“大家下午好”，引得现场响起掌声。\n\n11月18日，泰国总理阿努廷在深圳出席2026年亚太经合组织工商领导人峰会。　中新社记者 赵文宇 摄\n\n　　此次深圳之行并非阿努廷第一次“秀中文”。\n\n　　2023年1月，时任泰国副总理兼卫生部长的阿努廷亲赴曼谷素万那普国际机场，迎接中国游客。他在现场用中文说：“泰国人欢迎朋友们从中国来泰国玩。”消息传到中国，引发广泛讨论。\n\n　　今年7月，阿努廷就任泰国总理后首次正式访华。访问期间，他在社交媒体用中文发文“中泰一家亲” “上海中国”。10月，他再次在社交媒体发布中文“很好”，并配上了一张他与父亲差瓦拉在桌旁交谈的照片。\n\n　　差瓦拉中文名陈景镇，是泰国联泰工业建筑公司创始人。1998年，他曾回到广东新会祭祖，并为家乡村庄捐资修路。\n\n　　这正是海外华人心系故土的一道缩影。历史上，大批广东人离开故土到海外寻找发展机会。他们积极融入当地社会，成为联系祖(籍)国与住在国的桥梁。有数据显示，粤籍海外华侨华人有近3000万。\n\n　　五邑大学教授张国雄接受中新社记者采访时表示，无论是回馈桑梓还是语言传承，阿努廷父子的经历都体现出海外华人对中华文化的认可，以及华人与故乡割舍不断的血脉亲情。\n\n　　这种跨越时间与地域的情感，也体现在近年来频见报端的海外华人寻亲故事中。\n\n　　2025年，南太平洋岛国瑙鲁总统戴维·阿迪昂到外曾祖父的祖籍地——广东江门开平市赤坎镇中股村寻根谒祖。今年春节前夕，他再度到访，并写下“福”字赠与族亲。\n\n　　今年9月，马来西亚南侨机工后人张慧清在昆明街头“偶遇”外公邝金源的照片，她将这段经历拍摄成视频，发布在社交媒体。邝金源祖籍广东台山，曾瞒着家人加入南侨机工队伍，奔赴滇缅公路抢运物资，支援中国抗战。这段动人往事感动众多网友。视频发出十几天后，张慧清也在广东台山市台城街道岭背村完成认祖。\n\n　　“从这些家族故事中我们能看到，尽管已经过去了几代人的时光，海外华人在地域上也与家乡远隔重洋，但他们对故土亲情与中华文化的认同不会随着时间和距离淡化。”张国雄说。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdce33c36fa","title":"巴基斯坦华文学校校长马斌：为当地孩子打开一扇看中国的窗","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-19/news1075503.shtml","summary":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","summary_short":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","digest":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行","points":["11月18日至19日，第六届世界华文教育大会在海南博鳌举行","巴基斯坦华文教育协会会长、中巴教育文化中心校长马斌介绍，该校2013年建立…","马斌表示，此前巴基斯坦许多当地民众希望了解中文、了解中国文化，但是没有途径"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T21:22:42+08:00","size":1,"keywords":[],"body":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。\n\n巴基斯坦华文教育协会会长、中巴教育文化中心校长马斌介绍，该校2013年建立，是巴基斯坦首所华文学校，课程涵盖剪纸、武术、汉语、数学等。\n\n马斌表示，此前巴基斯坦许多当地民众希望了解中文、了解中国文化，但是没有途径。华文学校的建立，为当地民众搭建起系统了解中国文化的平台。(记者 李宇凡 王子谦)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/99CAA2C5C06F4EDB869538A953734402.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c40c1d2266f","title":"（深圳APEC）深圳APEC“摆桌”促对话：场边外交密集进行","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734912.shtml","summary":"中新社深圳11月19日电 题：深圳APEC“摆桌”促对话：场边外交密集进行  　　中新社记者 张焕迪  　　亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在深圳举行。","summary_short":"中新社深圳11月19日电 题：深圳APEC“摆桌”促对话：场边外交密集进行  　　中新社记者 张焕迪  　　亚太经合组织…","digest":"题：深圳APEC“摆桌”促对话：场边外交密集进行  　　中新社记者 张焕迪  　　亚…","points":["亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在深圳举行","17日，加拿大总理卡尼与墨西哥总统辛鲍姆会面","18日，卡尼与美国总统特朗普会面，讨论一项互利贸易协议，涉及就业以及加拿大的语言…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:15:03+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：深圳APEC“摆桌”促对话：场边外交密集进行\n\n　　中新社记者 张焕迪\n\n　　亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在深圳举行。会场内，各成员经济体围桌而坐，共商亚太合作；会场外，东道主中国又摆开一张张桌子。谁与谁会晤、谈些什么，由各方自行安排。谈成与否，话总要先接上。\n\n　　17日，加拿大总理卡尼与墨西哥总统辛鲍姆会面。两国重申续签《美国-墨西哥-加拿大协定》的承诺，还谈到加强关键矿产、能源、先进制造等领域合作。\r\n\n　　18日，卡尼与美国总统特朗普会面，讨论一项互利贸易协议，涉及就业以及加拿大的语言、文化和主权等问题。两国同意继续保持密切沟通。\n\n　　同日，辛鲍姆在深圳与特朗普见面后表示，双方在共同议程上继续取得进展。据悉，两国当前正推进旨在缓解贸易紧张的谈判。\n\n　　也是在同一天，俄罗斯总统普京同泰国总理阿努廷举行会谈，谈及双边关系、贸易增长以及在能源、交通、农业等领域的合作。\n\n　　在多边场合开展双边外交是国际惯例。多边会议提供场合，双边会见处理具体问题。这样的场景，在中国主办的多边会议上已属常见。\n\n　　2018年上合组织青岛峰会期间，吉尔吉斯斯坦与塔吉克斯坦两国总统举行会谈，聚焦两国边界划界和地区安全。两个中亚国家，借一次峰会，把争议多年的边界划界问题再次摆上桌面。\n\n　　2025年，普京与印度总理莫迪在上合组织天津峰会期间举行会晤，讨论双边关系以及乌克兰问题。值得注意的是，两人是在同一辆车上交谈了近一小时。一次不那么正式的见面，讨论的仍然是事关地区乃至世界局势的重要议题。\n\n　　密集的场边对话，往往是为了解开具体领域的“结”。多边共识定方向，双边沟通理脉络，亚太合作的纽带正是在这一次次接触中被不断拉紧。\n\n　　从欧洲国家领导人在第三届“一带一路”国际合作高峰论坛期间磋商，到各国经贸官员在上海进博会的展场内外对接合作，中国主办的多边会议和大型活动，正日益成为各方开展场边外交的公共平台。\n\n　　深圳这几天，这么多场重要会见密集进行，正是因为各方相信中国提供的这张桌子可用、可靠：氛围融洽，不预设议程，不居中干涉，来了就能坐下谈。\n\n　　而桌子周围，又有着广阔的市场、实在的机遇以及可预期的合作环境。\n\n　　会议有会期，对话无终点。只要各方愿意坐到一起，交流的窗口就会一直敞开。愿意坐下来的人，也总会在中国找到一张合适的桌子。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7826ed92b5","title":"APEC 1+1丨共促亚太繁荣：中国的建议与邀约","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734893.shtml","summary":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。","summary_short":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。","digest":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕","points":["17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕","在18日一系列的议程当中，APEC工商领导人峰会开幕式是最受瞩目的焦点","中国强调并始终推动开放、创新与合作"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:44:37+08:00","size":1,"keywords":[],"body":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。在18日一系列的议程当中，APEC工商领导人峰会开幕式是最受瞩目的焦点。中国强调并始终推动开放、创新与合作。这对亚太地区乃至世界会产生怎样的影响？“十五五” 规划蕴含哪些机遇惠及全球工商界？“世界湾区经济合作联盟”是什么？\r\n\n　　“十五五”规划蕴含哪些机遇惠及全球工商界？\n\n　　总台央视记者 徐卓阳：我在现场的时候感触很深。中国“十五五”和全球工商界是一体的、双向联动的。\n\n　　先说APEC对于“十五五”的意义。今年是中国第三次承办APEC，恰逢“十五五”开局之年，这场会议正是我们“十五五”开局阶段最重要的主场外交。\n\n　　再看“十五五”对于APEC能起到怎样的作用。我第一天连线时就谈到，期待来到深圳参会的嘉宾能够读懂中国质量。中国质量当中很重要的是经济质量，经济质量里很关键的一点，就是在全球经贸环境复杂多变的背景下，中国坚持以中长期规划统筹经济社会发展。这原本是我们自身发展的制度定力，而在亚太、在全球工商界眼中，这份定力正在形成一种独特的吸引力。\n\n　　就在峰会首日的工商对话上，全美商会会长克拉克谈到，地缘形势瞬息万变，企业最需要长期、稳定的信任关系。信任从哪里来？主旨演讲里提到的开放市场、广阔发展空间、互促共进的合作环境，都是大家可以信赖的支撑。\n\n　　而长期就体现在“十五五”这份规划上。五年周期对企业经营来说，是非常珍贵的定心丸，是企业求之不得的稳定预期。更大的长期则来自持续编制实施五年规划这套制度本身，“十五五”之后，还有“十六五”“十七五”，中国开放的大门只会越开越大，不会关上。\n\n　　所以对到场的全球工商界人士来说，他们收获的不只是一份合作邀约。面向未来共建亚太共同体、共促繁荣，中国有充足的诚意，在“十五五”乃至更长周期里持续敞开大门，欢迎各方伙伴前来携手合作。\n\n　　“世界湾区经济合作联盟”是什么？\n\n　　徐卓阳：这是全新的提法，非常激动人心，想象空间很大。我梳理三点理解。\n\n　　第一，全球公认的四大湾区，纽约湾区主打金融，旧金山湾区科创突出，东京湾区是历史上成熟的制造业，粤港澳大湾区起步最晚，但发展速度最快、市场潜力最大。现在湾区之间互动不少，但大多停留在企业、行业、个人这类微观层面，还缺少一个平台化的跨湾区经贸合作机制，一旦形成这样的协作平台，能够释放的能量值得期待。\n\n　　第二，这个联盟是全新的，我们都不知道长什么样子，是不是先把粤港澳大湾区的实践当作参照？我去搜了一下，大湾区已经有企业家联盟，还有会展、时尚等各类行业联盟，从官方到民间已经长出很多协同合作的载体，这些成熟经验，是不是可以为这个跨湾区新构想提供借鉴？\n\n　　接下来就是我个人最感兴趣的地方，既然这个新词是在深圳向世界提出的，向亚太提出的，接下来如果这个联盟有一个常设的理事处或者秘书处，会放在深圳吗？这会是本次APEC留给这个主办城市的一个长期的馈赠吗？是不是非常值得期待。联盟成立以后会有哪些活动？会对亚太非湾区经济体形成什么样的带动作用？给整个湾区注入什么样的新的活力？我觉得这个圈一划，有着对未来无穷的想象、无穷的力量。\n\n　　开放的共识如何转化成实际的行动？\n\n　　徐卓阳：18日的主旨演讲中提到，中国其实是一个巨大的创新实验场，天下大事，必作于细。这不就是落地嘛！华强北从改革开放发展到今天，生态已经越做越大，场所越来越新，往来的人越来越多。但是你要去看它最旺盛的生命力，还是在一个个小小的档口里面，在一些最细节的事情上面。\n\n　　《深圳特区报》上有华强北的整版报道，里面有一个细节我特别有感触。这边商户跟记者说，大厂偏好量大、技术方案成熟的订单；而来到这里的订单体量小，技术还处在起步阶段，最主要的是方案需要反复调来调去。\n\n　　在这里，大家都会非常耐心，帮你持续调试打磨。所以我觉得把小事做到极致，一个又一个小的梦想从这里起步、起飞，慢慢孕育成今天的华强北。说到大和小的关系，泰山不辞细壤，故能成其大。广阔的大市场里，一定会有这样小小的窗口；而一个个小窗口经过时间的孕育不断生长，到今天，这就是深圳这座“世界之窗”。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c30d82f0e54","title":"聚焦APEC丨亚太同心，共话合作新愿景","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734892.shtml","summary":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。","summary_short":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。","digest":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行","points":["11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行","来自亚太经合组织(APEC)21个经济体和英国、法国、德国…","从硬联通夯实物流基础，到软联通对接标准规则，再到心联通增进认同理解，互联互通不断向更深层次…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:43:15+08:00","size":1,"keywords":[],"body":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。来自亚太经合组织(APEC)21个经济体和英国、法国、德国、瑞士等13个域外经济体的2000余位政商界代表齐聚南海之滨，深入探讨亚太区域开放合作、繁荣发展大计，携手集众智、促合作、求共赢。\r\n\n　　互联互通不断走深走实\n\n　　从硬联通夯实物流基础，到软联通对接标准规则，再到心联通增进认同理解，互联互通不断向更深层次、更广领域延伸，为推进亚太自贸区建设积蓄务实力量。\n\n　　-数智合作激活创新引擎\n\n　　数字经济浪潮澎湃，数智经贸合作也成为当前APEC各方共识基础最扎实、合作氛围最浓厚的领域。工商峰会上，中外嘉宾围绕贸易数字化、人工智能、数字服务等一系列议题深入交流，探讨如何加快创新应用落地与产业深度融合。\n\n　　-共促亚太繁荣美好未来\n\n　　《2026年亚太经合组织工商领导人峰会深圳倡议》18日对外发布，呼吁深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣。这是APEC工商领导人峰会创办30年来首次以倡议形式发布成果文件。\n\n　　扎根亚太、建设亚太、造福亚太，更加开放的中国正不断以中国式现代化新成就为亚太和世界提供新机遇。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdddbdc5dd5","title":"台胞胡良昇：APEC让世界看见新时代的深圳","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734871.shtml","summary":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新网11月19日电(燕新台)11月18日至19日…","深圳，这座“创新之城”再度吸引全球目光","一句“来了就是深圳人”鼓舞人心"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:40:37+08:00","size":1,"keywords":[],"body":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳，这座“创新之城”再度吸引全球目光。\n\n　　一句“来了就是深圳人”鼓舞人心\n\n　　“今年APEC落地深圳，我感触很深。”深圳台商协会副会长、青年委员会主任委员胡良昇表示，APEC让世界看见新时代的深圳，他观察到不少海外媒体和国际博主前来深圳实地探访，都给出了真实且高度的正面评价。\n\n　　“希望本次参会的各国嘉宾在亲身体验这座城市的包容理念、发展速度与城市温度之后，能发自内心地说出那句——来了就是深圳人。”胡良昇认为，这句话“非常自豪，也非常鼓舞人心”。\r\n\n　　台湾青年能收获成长，才值得扎根\n\n　　由深圳台商协会主办的“WAY！来深圳”台湾青年深圳实习活动已连续举办近20年，累计吸引3000余名台湾在校大学生参与。\n\n　　在胡良昇看来，真正让台湾青年愿意在深圳扎根的，是这座城市的机遇与发展含金量。\n\n　　2026年，200余名台湾青年进入深圳60余家企业实习，其中科技类岗位约占四成，覆盖人工智能硬件研发、云计算技术支持、智能交通算法开发、跨境数字网络运营等细分方向。\n\n　　“台湾青年可以进入深圳科创企业一线实战、开眼界、练能力。他们看得很清楚：能在这里成长，才值得在这里扎根。”胡良昇说道。\n\n　　成长环境，决定眼界与视野\n\n　　胡良昇觉得，自己在深圳最大的收获，是身边聚集了大量优秀、敢拼敢闯的创业者与青年，多和这类人相处，自身的认知、格局、节奏都会被拉高。\n\n　　深耕科技产品出海领域多年的胡良昇，将深圳对创业者的助力总结为三点：一是高精尖人才密集，寻找团队、合作与技术伙伴效率更高；二是产业链完整、迭代速度快，产品从研发、打样到落地出海全链路效率突出；三是政府对科创产业扶持力度大、政策落地快，让创业者更敢于投入、创新并布局长期发展。\n\n　　胡良昇说，深圳一直在进化、蜕变，也推着创业者跟着这座城市一同成长。\n\n　　台湾同胞一定能“爱上深圳”\n\n　　作为在深逐梦十余年的台湾创业者，胡良昇也早已把这里当成了自己的家。一口熟悉的家乡味、一通打回台湾的视频电话……每逢节日，他总会和在深台胞们欢聚一堂。\n\n　　胡良昇也向从未到过深圳的台湾同胞发出邀请：一定要亲自到这座城市走走看看，感受这里的科技实力、商业活力、艺术氛围、生活节奏和饮食文化，找到属于自己“爱上深圳”的理由，切身感受“来了就是深圳人”的城市魅力。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfa9b5f49c6","title":"“未名·AI Park”在北京揭牌 共建人工智能创新转化高地","url":"https://www.chinanews.com.cn/edu/2026/11-19/10734878.shtml","summary":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。","summary_short":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。","digest":"“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌","points":["中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国…","“未名·AI Park”是百年京张AI创新带上的重要节点，其核心启动区选址北京大学西门外…","北京大学党委书记何光彩表示，北京大学依托深厚的基础研究和学科交叉优势…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:38:15+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。“未名·AI Park”是百年京张AI创新带上的重要节点，其核心启动区选址北京大学西门外，旨在构建服务北京大学的“一公里转化圈”，立足北京大学优势AI学科资源与海淀科创沃土，打通“原始创新—技术攻关—成果落地—产业集聚”全链条。\n\n　　“未名·AI Park”由北京大学、北京市海淀区人民政府共建。\n\n“未名·AI　Park”在北京市海淀区中关村国际创新大厦正式揭牌。主办方供图\n\n　　北京大学党委书记何光彩表示，北京大学依托深厚的基础研究和学科交叉优势，持续推动科技创新与产业创新深度融合，把园区建成北京大学科技成果转化的核心承载区、海淀人工智能产业的特色地标。\n\n　　北京市海淀区委书记王少峰表示，海淀坚持把人工智能作为现代化产业体系的龙头和引领，全力建设具有全球影响力的人工智能产业高地；依托“五方六力”科技成果转化机制，推动政府服务向科研一线延伸，共同筑牢校地共建、产城共融的创新根基。\n\n　　中关村科学城管委会副主任、海淀区副区长唐超发布“未名·AI Park”人工智能创新街区(简称未名·AI Park)，从规划背景、空间布局、生态培育三个方面作出系统阐述，打造北京大学创新成果策源地、师生创业首选地、教育科技人才一体发展示范区。\n\n　　活动现场，北京大学计算机学院AI产学研协同创新基地、北京大学具身智能系统研究中心、北京大学AI+Math国际研究中心正式亮相。多场北京大学人工智能交叉领域科创项目路演接续开展；专家学者、企业家、投资机构齐聚，围绕技术攻关、项目孵化、产业合作开展面对面对接交流。\n\n　　下一步，北京市海淀区将以“未名·AI Park”为支点，撬动更多创新资源在北大周边集聚、向海淀全域辐射，培育更多前沿技术、优质项目和高端人才；要始终当好北大创新发展的合伙人，与政产学研金等各方，一起筑牢校地共建、产城共融的创新根基，为服务国家高水平科技自立自强作出新的更大贡献。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0c7a7890b8","title":"西藏发布“十五五”妇女儿童发展规划 重点向农牧区和边境地区倾斜","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734868.shtml","summary":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。","summary_short":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。","digest":"西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行","points":["中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会1…","根据发布会上的信息，相关政策举措将向农牧区、基层、边境一线倾斜","西藏自治区妇联主席、政府妇儿工委副主任旦珍介绍，妇女、儿童发展规划分别设8个领域76项…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T20:17:01+08:00","size":1,"keywords":[],"body":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。根据发布会上的信息，相关政策举措将向农牧区、基层、边境一线倾斜。\n\n　　西藏自治区妇联主席、政府妇儿工委副主任旦珍介绍，妇女、儿童发展规划分别设8个领域76项、7个领域75项主要目标。西藏已先后制定实施5轮妇女儿童发展规划。\n\n　　“十四五”期间，西藏孕产妇系统管理率、住院分娩率分别达85.38%和99.54%；学前教育毛入园率、九年义务教育巩固率、高中阶段毛入学率分别达92.83%、98.74%和92.04%；城镇新增就业女性占比41.18%。发布会也指出，农牧区和边境地区妇幼健康服务、教育资源供给仍不够均衡。\n\n　　西藏自治区卫生健康委员会副主任国吉说，将建立稳定投入机制，向高海拔、偏远、边境地区倾斜；将对长期居住高原的儿童开展慢性缺氧风险早期筛查，防治婴幼儿高原性肺动脉高压；推进适龄女童HPV疫苗免费接种，宫颈癌筛查率达70%以上；推广出生医学证明电子证照和“新生儿出生一件事”多证联办。\r\n\n　　西藏自治区民政厅儿童福利处一级调研员来子文表示，到2030年，保持孤儿、事实无人抚养儿童保障覆盖率100%，推动孤儿、事实无人抚养儿童保障申请“跨省通办”，方便异地安置儿童及时享受救助。\n\n　　西藏自治区人民检察院副检察长张萍表示，对侵害儿童犯罪保持“零容忍”，通过制发督促监护令、开展国家司法救助介入困境未成年人帮扶。她提到，《检察公益诉讼法》将于2027年1月1日起施行，将未成年人权益保障纳入公益诉讼法定领域。\n\n　　西藏自治区农业农村厅帮扶处处长仝富军表示，支持妇女发展民族手工艺、庭院经济、家庭牧场和农村电商，带领农牧区妇女走出家门，参与“村歌”“村舞”等“村字号”大型文体活动。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8d69662c80","title":"榕台职工福州探寻百年工业文脉","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734842.shtml","summary":"中新社福州11月19日电 (记者 闫旭)由福州市总工会主办的“匠心传承·融合发展”2026年榕台职工品质生活系列活动19日在福州启动，近100名福州和台湾职工当日循着跨越百年的工业文脉探访工业遗产。","summary_short":"中新社福州11月19日电 (记者 闫旭)由福州市总工会主办的“匠心传承·融合发展”2026年榕台职工品质生活系列活动19…","digest":"由福州市总工会主办的“匠心传承·融合发展”2026年榕台职工品质生活系列活动19日在…","points":["中新社福州11月19日电 (记者 闫旭)由福州市总工会主办的“匠心传承·融合发展”2026年…","福州是中国近代工业的重要发源地之一","在中国船政文化城，榕台职工走进轮机车间、铁胁厂，在“学堂寻根”定向闯关活动中体悟船政先辈工业…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:45:56+08:00","size":1,"keywords":[],"body":"中新社福州11月19日电 (记者 闫旭)由福州市总工会主办的“匠心传承·融合发展”2026年榕台职工品质生活系列活动19日在福州启动，近100名福州和台湾职工当日循着跨越百年的工业文脉探访工业遗产。\n\n　　福州是中国近代工业的重要发源地之一。在中国船政文化城，榕台职工走进轮机车间、铁胁厂，在“学堂寻根”定向闯关活动中体悟船政先辈工业报国的赤诚；在福建电力博物馆，两岸职工通过“百年电力·榕台共话”微讲堂，了解近代福州工业发展轨迹。\n\n图为11月19日，　“匠心传承·融合发展”2026年榕台职工品质生活系列活动启动，榕台职工共同走进中国船政文化城。　(福州市总工会 供图)\n\n　　“走进这座百年厂房，看着老设备，历史仿佛触手可及。”在福建电力博物馆，来自台湾的郑家铨说，近年来，福州加快建设两岸融合发展示范区先行城市，从台胞公租房到职业资格采认，从“福马同城通”卡到工会“娘家人”的贴心服务，他真切感到这里是可以安心扎根的家。\n\n　　此次活动中，榕台职工还将走进东南汽车城、福州茉莉花茶工业技艺工坊。“今天，在电力博物馆和船政文化城，我看到两岸共同的过去；明天，在东南汽车城，我期待看到两岸携手的未来。”台胞何经源说，两岸技术各有专长、正好互补，期待在“智造”之路上和更多两岸伙伴找到携手合作的机会。\n\n　　福州市总工会社联部负责人表示，工会将持续发挥桥梁纽带作用，不断丰富榕台职工交流载体，搭建技能切磋、创业创新、文化互动平台，吸引更多台湾青年来榕就业创业。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c31d21a9182","title":"石泰峰在陕西、四川调研时强调 深入学习贯彻习近平党建思想 推动全面从严治党各项任务落到实处","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734861.shtml","summary":"新华社成都11月19日电 中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西、四川调研。","summary_short":"新华社成都11月19日电 中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西、四川调研。","digest":"中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西、四川调研","points":["新华社成都11月19日电 中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西…","他强调，要深入学习贯彻习近平党建思想，全面落实党的二十届五中全会部署…","石泰峰来到延安，瞻仰杨家岭革命旧址，缅怀革命先辈的丰功伟绩，学习感悟延安精神"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:43:14+08:00","size":1,"keywords":[],"body":"新华社成都11月19日电 中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西、四川调研。他强调，要深入学习贯彻习近平党建思想，全面落实党的二十届五中全会部署，深刻领悟“两个确立”的决定性意义，坚决做到“两个维护”，以更高标准、更实举措推进全面从严治党，把党建设得更好更强，为全面建成社会主义现代化强国、以中国式现代化全面推进中华民族伟大复兴提供坚强保障。\n\n　　石泰峰来到延安，瞻仰杨家岭革命旧址，缅怀革命先辈的丰功伟绩，学习感悟延安精神。在延安、西安、成都，走进乡村、社区、企业、科研院所，深入园区、党群服务中心、新就业群体服务阵地，同党员干部群众交流，详细了解生产生活和基层党组织建设情况。调研期间，石泰峰主持召开座谈会，围绕学习贯彻习近平党建思想和五中全会精神听取意见建议。\n\n　　石泰峰指出，习近平党建思想是坚持“两个结合”推进党的理论创新的重大成果，是深入推进新时代党的建设新的伟大工程的根本遵循和行动指南。要把学习贯彻习近平党建思想和五中全会精神作为重大政治任务，分级分类推进党员、干部培训，深化理论研究阐释，推动入脑入心、见行见效。要弘扬理论联系实际的学风，坚持党的全面领导和党中央集中统一领导，扎实做好全面从严治党各项工作，把学习成效转化为管党治党、兴党强党的实际行动。要强化大抓基层鲜明导向，深入推进抓党建促乡村全面振兴，深化党建引领基层治理，用心用情解决群众急难愁盼问题。要进一步加强国有企业党的建设，促进党建工作与生产经营深度融合，以高质量党建引领企业高质量发展。要深化拓展新兴领域“两个覆盖”，做深做实思想政治引领、服务管理、合法权益保障，引导新就业群体听党话、跟党走。\n\n　　石泰峰还实地调研中国延安干部学院工作情况。他表示，中国浦东、井冈山、延安干部学院要坚持学院姓党，把学习贯彻习近平党建思想贯穿始终，用好红色资源，突出抓好党性教育主责主业，加强政绩观教育，推进从严治院、从严治教、从严治学，不断提高办学治院水平。 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cff029cf630","title":"（深圳APEC）专家解读深圳倡议：凝聚工商界共识，为世界注入确定性","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734853.shtml","summary":"中新社深圳11月19日电 (记者 郑嘉伟)《2026年亚太经合组织工商领导人峰会深圳倡议》(简称“深圳倡议”)18日对外发布…","summary_short":"中新社深圳11月19日电 (记者 郑嘉伟)《2026年亚太经合组织工商领导人峰会深圳倡议》(简称“深圳倡议”)18日对外…","digest":"《2026年亚太经合组织工商领导人峰会深圳倡议》(简称“深圳倡议”)18日对外发布…","points":["中新社深圳11月19日电 (记者 郑嘉伟)《2026年亚太经合组织工商领导人峰会深圳倡议》(…","多位受访专家学者表示，深圳倡议为亚太区域开放合作凝聚工商界共识，也为动荡不安的世界注入确定性","“深圳倡议把APEC工商咨询理事会全年讨论成果吸纳进来…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:29:13+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 郑嘉伟)《2026年亚太经合组织工商领导人峰会深圳倡议》(简称“深圳倡议”)18日对外发布，这是亚太经合组织(APEC)工商领导人峰会创办30年来首次以倡议形式发布成果文件。多位受访专家学者表示，深圳倡议为亚太区域开放合作凝聚工商界共识，也为动荡不安的世界注入确定性。\r\n\n　　“深圳倡议把APEC工商咨询理事会全年讨论成果吸纳进来，向APEC领导人非正式会议提出工商界建议，并列出工商界愿意参与的行动。”中国社会科学院世界经济与政治研究所所长廖凡接受中新社记者采访时表示，这体现亚太工商界在变乱交织的全球环境下主动凝聚共识，积极寻求确定性的意愿。\n\n　　中国人民大学国际关系学院教授、国际事务研究所所长王义桅认为，相比过往的声明文件，倡议更强调功能性合作与循序渐进。“没有强制约束，而是在共识的基础上协同推进相关工作，这也体现了求同存异的中国智慧。”\n\n　　从内容看，深圳倡议的指向十分具体——呼吁深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣。王义桅指出，这些呼吁都在回应当下最实在的“堵点”：一方面，全球单边主义、保护主义抬头，企业跨境经营面临规则碎片化和数字鸿沟；另一方面，AI、绿色低碳等新赛道带来系列新问题，工商界需要一套“能用的共同语言”来有效应对。\n\n　　回应这些堵点，靠的是打通区域内部循环。廖凡表示，亚太是全球最具活力的区域，当亚太经济体积极回应倡议呼吁，携手破除区域交通、贸易、规则和人文交流壁垒，加快推进一体化进程，让经济循环顺畅起来，就能有效稳定全球经济预期。\n\n　　王义桅表示，深圳倡议具有充分包容性，不对非APEC经济体关门，也不在APEC内部搞小圈子，而是把不同制度、不同发展阶段的经济体都吸纳进来，最大程度上形成全球经济复苏合力。\n\n　　针对AI等前沿技术带来的问题与风险，深圳倡议也在“创新增长：以技术创新驱动包容增长”中予以关注。南京大学国际关系学院教授朱锋认为，AI带来的技术挑战远超此前三次工业革命，面对AI潜藏的风险，没有任何经济体可以独善其身，深圳倡议有助于国际社会建立可共享的规则与评测工具，共同推动“AI向善”。\n\n　　“一分部署，九分落实。”廖凡强调，中国在倡议落实中的角色清晰：坚持开放创新、普惠包容，建设更高水平开放型经济新体制；以制度型开放实现更大范围、更宽领域、更深层次的开放格局，依托自贸区建设与国际通道联通激发动能，发挥引领作用。中国用自身发展的确定性，对冲世界的不确定性。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"台灣","total":2,"items":[{"id":"c7d240a421a","title":"在深台胞：今年APEC落地深圳，期待世界看见新时代的深圳","url":"https://www.chinanews.com/tw/shipin/2026/11-19/news1075493.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇在接受中国新闻网“燕新台”…","他坦言，借着这场国际盛会，非常期待让全世界真正看见新时代的深圳…"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:07:57+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇在接受中国新闻网“燕新台”工作室采访时表示，他观察到不少海外媒体和国际博主前来深圳实地探访，都给出了真实且高度的正面评价。他坦言，借着这场国际盛会，非常期待让全世界真正看见新时代的深圳，也特别希望各国嘉宾在亲身体验这座城市的包容理念、发展速度与城市温度之后，能发自内心地说出那句——来了就是深圳人。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/12aefe9c-f627-4dad-a8a3-962a80a72c3d.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c47fcc72e11","title":"深圳创业十余年台胞：这座城市永远在蜕变，台湾青年一定会“爱上深圳”","url":"https://www.chinanews.com/tw/shipin/2026/11-19/news1075492.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳，这座“创新之城”再度吸引全球目光","“深圳最大的特质，就是永远不会停在过去的成绩里"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:07:48+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳，这座“创新之城”再度吸引全球目光。“深圳最大的特质，就是永远不会停在过去的成绩里。”深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇，近日在接受中国新闻网“燕新台”工作室采访时，分享了他眼中的深圳。他认为，深圳真正留住台湾青年的并非单纯的政策福利，而是这座城市不断迭代的产业和无可替代的机会含金量。他向岛内青年发出真诚邀约：亲自来体验这里的科技实力、商业活力、艺术氛围和饮食文化，一定会找到属于自己“爱上深圳”的理由。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/12af1128-76da-480c-99cc-b72180b8e65d.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"國際","total":16,"items":[{"id":"cba1634a815","title":"日本淺草寺｜女遊客懸掛拉扯雷門大燈籠拍照捱轟 若損毀恐招巨額賠償","url":"https://www.stheadline.com/realtime-world/3639140/日本淺草寺女遊客懸掛拉扯雷門大燈籠拍照捱轟若損毀恐招巨額賠償","summary":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。","summary_short":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。","digest":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件","points":["日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件","網上流傳片段顯示，一名外國女遊客在寫有「雷門」字樣的大燈籠下打卡時，竟將燈籠當成單槓般…","網傳片段可見，一名外國女遊客在淺草寺入口的雷門大燈籠下拍照，期間將雙手攀着燈籠底部邊緣…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T04:50:48+08:00","size":1,"keywords":[],"body":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。網上流傳片段顯示，一名外國女遊客在寫有「雷門」字樣的大燈籠下打卡時，竟將燈籠當成單槓般，雙手攀住燈籠底部邊緣作支撐並單腳站立拍照，燈籠似被用力拉扯著，女子放手後更出現晃動，引起日本網民強烈不滿及怒轟。\n攀燈籠底部單腳打卡 放手後燈籠晃動\n網傳片段可見，一名外國女遊客在淺草寺入口的雷門大燈籠下拍照，期間將雙手攀着燈籠底部邊緣，並以此作支撐單腳站立。旁邊有人以英語大聲向女遊客叫道：「不要踫它！」女遊客聽後才放手，當她放手後，大燈籠明顯出現晃動。\n雷門大燈籠重700公斤 松下幸之助還願重建\n雷門大燈籠並非一般供人把玩的裝飾品，而是具有相當價值的傳統工藝品，高約3.9米、寬約3.3米，重達700公斤。據悉，這座大門與大燈籠曾於1865年因火災燒毀，消失近100年後，松下電器創辦人松下幸之助向淺草寺祈求膝關節痛痊癒並應驗，於1960年還願捐款重建。\n據了解，雷門大燈籠每隔約10年更換一次，即使體積較小的小舟町大燈籠，重量也超過400公斤，製作成本更高達五、六百萬日圓（約24萬至29萬港元）。由於大型燈籠主要採用傳統和紙及竹材製作，並非堅固耐磨的金屬結構，若遭人反覆觸摸、拉扯或施加外力，極易造成表面污損甚至結構受損。\n網民擔心，即使未有當場破裂，後續修復也可能涉及高昂費用，若真造成嚴重損毀，更可能衍生巨額賠償責任。\n批欠缺對宗教場所尊重 日網民斥當作遊樂場設施\n除了財物損失，部分日本網民也認為，遊客在寺廟內做出倒立、懸掛等誇張動作，反映對當地宗教場所缺乏基本尊重。在日本文化中，寺廟及神社是承載信仰且充滿敬畏之心的場所，不應被當成供人嬉戲或製造社交平台話題的背景。\n片段在網上流傳後，日本網民紛紛留言表達憤怒，有人直言「我不希望那些玩弄日本人珍視之物的外國人來日本旅遊」，亦有人呼籲「不了解日本文化的外國人，請勿入內！」。\n此外，不少網民批評行為離譜，留言稱「外國人啊？社會公害……他們為甚麼要吊在上面……那不是遊樂場設施？蠢到我都無言了」，甚至有激進留言辱罵：「滾出日本，笨蛋！」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf3f749314b","title":"南韓高考｜今屆發現98人違規 5人用智能設備作弊","url":"https://www.stheadline.com/realtime-world/3639045/南韓高考今屆發現98人違規-5人用智能設備作弊","summary":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考），南韓政府出「奇招」嚴防作弊，全日共發現98 人違規，包括5人利用智慧型設備作弊。","summary_short":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考）…","digest":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試…","points":["南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試…","韓媒報道，今屆共有55萬人報考，教育部官員晚上開記者會通報…","相關新聞：南韓高考︱懸賞59萬元捉AI作弊 發災難短訊排查手機 鈕扣須貼紙防偷拍"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:04:20+08:00","size":1,"keywords":[],"body":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考），南韓政府出「奇招」嚴防作弊，全日共發現98 人違規，包括5人利用智慧型設備作弊。韓媒報道，今屆共有55萬人報考，教育部官員晚上開記者會通報，初步統計共發現98宗違反考試規則的行為。\n相關新聞：南韓高考︱懸賞59萬元捉AI作弊 發災難短訊排查手機 鈕扣須貼紙防偷拍\n其中，有44名考生被發現攜帶手機或其他電子設備，部分是當局發送強制手機發出聲響的災難警報，揪出沒有交出手機的學生，2人是透過首爾考場的Wi-Fi信號監測抓獲。\n有人用AI眼鏡、微型攝影機\n令人關注的是5名考生使用智慧型設備作弊。忠清南道考區一名考生配戴並使用AI智能眼鏡，這類眼鏡可掃描試卷並利用AI生成答案。京畿道考區一名考生被發現身上藏有微型攝影機及無線藍牙耳機。首爾考區一名考生直接在考場使用智能手機拍攝考試試卷。另首爾和京畿道考區各1宗考生在考試途中前往洗手間偷用智能手機。\n\n相關新聞：南韓稅務師狀元自首 認用微型相機＋AI作弊\n\n南韓近年頻頻發生高科技設備與AI作弊事件，包括10月延世大學等入學試有人用智能眼鏡作弊，就連稅務師國考榜首也承認用微型相機、手機與雲端AI解題作弊。\n逐粒鈕貼貼紙防偷拍\n當局針對修能試祭出「史上最嚴格」的防弊新規，除突擊防災警報，為防考生衣服內藏微型攝影機，監考官要求考生捲起衣袖、衣領作檢查，衣服上每一顆鈕扣都要用貼紙遮蓋；一批監考員特別接受智能眼鏡識別訓練。考場及周邊地區也從考前一天起臨時屏蔽Wi-Fi訊號。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0832dbe660","title":"（深圳APEC）外媒聚焦APEC：开放合作为亚太发展凝聚共识","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734981.shtml","summary":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。","summary_short":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。","digest":"综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳…","points":["中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日…","多家外媒聚焦深圳科技创新与城市发展，关注会议释放的开放合作信号，认为维护贸易开放…","本次会议举办地深圳成为海外媒体关注话题之一"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T23:45:35+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。多家外媒聚焦深圳科技创新与城市发展，关注会议释放的开放合作信号，认为维护贸易开放、深化区域合作、推动创新发展，仍是亚太经济体的共同关切。\r\n\n　　本次会议举办地深圳成为海外媒体关注话题之一。美国有线电视新闻网以“奇迹之城”介绍深圳，通过无人驾驶出租车、无人机送餐、智能城市设施等生活场景，展现深圳科技创新与城市发展的活力。\n\n　　美联社文章援引业内人士观点称，深圳展现了中国速度以及中国在效率和创新方面的活力。英国《卫报》指出，深圳是中国借APEC向世界展示发展成就的重要窗口。\n\n　　欧洲《现代外交》杂志网站对本次会议三大优先领域作出解读，认为“开放”是对日益高涨的贸易保护主义、日益加剧的经济碎片化的直接回应；“创新”是数字化转型和人工智能时代的新经济增长引擎；“合作”则是亚太经合组织基于共识自愿承诺的原则。\n\n　　新加坡《联合早报》的报道称，在全球经济日益分化、贸易紧张局势持续以及科技变革带来新安全挑战的背景下，各经济体领导人探讨如何深化区域经济一体化、加强互联互通，以及推动创新和数字化转型，促进亚太地区可持续和包容增长。\n\n　　新加坡亚洲新闻台援引亚太经合组织秘书处执行主任爱德华多·佩德罗萨的话说，本次会议关注供应链的韧性、应对全球经济失衡和人工智能合作。“对话过程本身是亚太经合组织工作的重要组成部分，它可以让各经济体更好地了解彼此，并找到各自体系协调运作的方式。”\n\n　　厄瓜多尔Pressenza国际通讯社指出，参会的智利、秘鲁、墨西哥三国经济结构各异，但都与国际市场和太平洋供应链有着重要的联系。对他们而言，挑战不仅在于能否销售更多产品，发展工业能力、培养专业人才、开展应用研究以及加强国内供应商队伍建设也同样重要。\n\n　　智利《塔尔卡日报》援引智利安第斯大学专家佩德罗·亚科贝利的话说，“亚太地区是非常重要的经济共同体，它改变了我们对海洋的认识。海洋不再是阻碍，而是一种沟通手段。”他认为，亚太经合组织的优势是灵活性和适应性，并为各经济体、商界领袖和学者提供一个讨论贸易和投资的平台。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b887c9ee8","title":"韩国前第一夫人金建希首案终审被判有期徒刑4年","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734932.shtml","summary":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价、收受贿赂等案件作出终审判决，判处其有期徒刑4年…","summary_short":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价…","digest":"韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价…","points":["中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建…","这是韩国最高法院首次就金建希相关案件作出裁定","韩联社报道称，这是韩国宪政史上首次有前总统夫人因刑事犯罪被终审判处实刑"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T21:54:49+08:00","size":1,"keywords":[],"body":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价、收受贿赂等案件作出终审判决，判处其有期徒刑4年，并处罚金5000万韩元(约合人民币25万元)。这是韩国最高法院首次就金建希相关案件作出裁定。\r\n\n　　韩联社报道称，这是韩国宪政史上首次有前总统夫人因刑事犯罪被终审判处实刑。\n\n　　韩国最高法院当天驳回“金建希特检组”和金建希双方的抗诉和上诉，维持二审原判。就金建希从统一教方面接受请托和收受高价物品这一指控，法院认定违反《特定犯罪加重处罚法》。同时，其涉嫌操纵股价违反《资本市场法》的部分指控成立。就金建希与尹锡悦共谋，从“政治掮客”明泰均处免费获取舆论调查服务违反《政治资金法》的指控，法院维持二审无罪判决。\n\n　　2026年1月，首尔中央地方法院对此案作出一审判决，判处金建希有期徒刑1年8个月。三项指控中只有“从统一教方面接受请托和收受高价物品”被认定部分有罪，其余两项指控均被认定不成立。特检组和金建希随后分别提出抗诉及上诉。在4月二审中，首尔高等法院认定金建希违反《资本市场法》《特定犯罪加重处罚法》，以斡旋受贿罪等罪名判处其有期徒刑4年，处罚金5000万韩元，并没收其收受的高价项链及追缴2000余万韩元。\n\n　　韩联社报道称，金建希因卷入多起案件，相关审判还在进行，未来不排除被追加判处刑罚的可能。(完) 【编辑:周驰】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c81f72e7b4b","title":"羅興亞難民｜國際法院裁定緬甸「種族滅絕」 創主權國家定罪首例","url":"https://www.stheadline.com/realtime-world/3639018/羅興亞難民國際法院裁定緬甸種族滅絕-創主權國家定罪首例","summary":"聯合國「國際法院」（ICJ）在荷蘭海牙作出歷史性終極判決，正式認定緬甸在2017年針對少數民族羅興亞人（Rohingya）的軍事鎮壓行動中犯下了種族滅絕罪，成為國際法院成立80年來…","summary_short":"聯合國「國際法院」（ICJ）在荷蘭海牙作出歷史性終極判決，正式認定緬甸在2017年針對少數民族羅興亞人（Rohingya…","digest":"聯合國「國際法院」在荷蘭海牙作出歷史性終極判決…","points":["聯合國「國際法院」（ICJ）在荷蘭海牙作出歷史性終極判決…","有證據支持緬軍清洗殺害1萬人","由15名法官組成的合議庭，最終以 9票贊成、6票反對…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T21:53:28+08:00","size":1,"keywords":[],"body":"聯合國「國際法院」（ICJ）在荷蘭海牙作出歷史性終極判決，正式認定緬甸在2017年針對少數民族羅興亞人（Rohingya）的軍事鎮壓行動中犯下了種族滅絕罪，成為國際法院成立80年來，認定單一主權國家犯下種族滅絕罪的首例。\n有證據支持緬軍清洗殺害1萬人\n由15名法官組成的合議庭，最終以 9票贊成、6票反對，裁定緬甸在若開邦北部對羅興亞人實施了種族滅絕，嚴重違反1948年《防止及懲治危害種族罪公約》。\n\n國際法院院長岩澤雄司（Yuji Iwasawa）花了3小時讀判詞，指出有證據支持緬軍在2017年清洗行動中，暴力殺害了約1萬名羅興亞人。法院認為緬甸的暴行規模與本質「遠遠超出了懲罰該群體所需的限度」，其摧毀羅興亞人村莊並隨後由非羅興亞族群人口取代等行為，唯一的合理推論就是「意圖消滅若開邦北部相當部分的羅興亞族群」。\n首次認定性暴力為種族滅絕手段\n緬甸當局聲稱該行動是「合法的反恐清剿行動」，遭法院明確駁回。判詞中詳述了緬甸安全部隊殺害數千平民、對婦女實施廣泛的性暴力，以及對兒童施加極端暴力、攻擊大批逃亡中的難民等令人髮指的惡行。這也是國際永久法庭首次將性暴力認定為種族滅絕手段之一。\n法院下令緬甸政府必須批准並協助目前流離失所的羅興亞人，安全、自願且有尊嚴地返回原居地，並與家人團聚。並須對羅興亞人進行賠償，包括恢復完整公民身分及權利等，具體賠償金額日後判定。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5f642c3f14","title":"蒙古国总统辞职申请获议会批准","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734898.shtml","summary":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。","summary_short":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。","digest":"乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议…","points":["中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议…","蒙古国国家大呼拉尔主席宾巴朝格特将代行总统职权","据蒙古国国家通讯社报道，当天出席全体会议的议员中，92.3%对总统辞职议案投赞成票"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T20:57:52+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。蒙古国国家大呼拉尔主席宾巴朝格特将代行总统职权。\n\n　　据蒙古国国家通讯社报道，当天出席全体会议的议员中，92.3%对总统辞职议案投赞成票。\n\n　　报道称，有数名议员在会上就总统辞职的原因和依据提出质询。呼日勒苏赫回应称，他只剩(辞职)一个选择，以“恢复国家元首这一崇高职位应有的尊严和声誉”。\n\n　　报道还称，部分议员在会上发言，肯定呼日勒苏赫任总统期间的工作成效。\r\n\n　　据报道，在蒙古国民主党指控包括总统在内的高级官员涉嫌“贪腐、非法窃取国家财产和任人唯亲”等行为并提出一系列要求后，呼日勒苏赫17日上午发表辞职声明，否认相关指控，表示接受调查，将通过法律途径维护声誉。\n\n　　该辞职申请18日提交国家大呼拉尔相关委员会审议并通过，19日提交国家大呼拉尔全体会议举行公开投票后获批准。呼日勒苏赫的总统职权即刻终止。\n\n　　根据蒙古国宪法规定，国家大呼拉尔批准总统辞职后，必须在4个月内举行总统选举，在20个工作日内确定并公布选举日期。国家大呼拉尔主席将代行总统职权，直至新总统宣誓就职。\n\n　　呼日勒苏赫于2021年6月就任蒙古国总统，任期6年。他是该国历史上首位主动提出辞职并提前结束任期的总统。(完) 【编辑:周驰】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0792d8c304","title":"世界觀｜AI發展與減碳可否兼得？","url":"https://news.tvb.com/tc/1207257-世界觀AI發展與減碳可否兼得","summary":"歡迎收看《世界觀》。長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時，人工智能急速發展，正推高算力的需求，數據中心不但「食電食水」，更佔用龐大土地。","summary_short":"歡迎收看《世界觀》。","digest":"世界觀｜AI發展與減碳可否兼得？","points":["長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時…","在土耳其安卡拉召開的聯合國氣候峰會，把AI列為核心議題之一","到底人工智能發展，是否只能站在環境保護的對立面"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB New
