<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

股公开市场总市值的2%。在当前市场环境下，其上市后的股价表现被视为观察人工智能产业未来发展前景的重要风向标之一。\r\n\n　　Anthropic上市之际，人工智能发展及监管问题再次引发关注。在纳斯达克证券交易所举行上市敲钟仪式期间，纽约、旧金山等地有抗议者举行示威活动，呼吁放缓人工智能发展步伐。此外，有美国国会议员通过社交媒体发声，呼吁加强人工智能监管。\n\n　　面对外界对人工智能发展风险的担忧，Anthropic首席执行官达里奥·阿莫代伊表示，公司将审慎把握人工智能系统训练和部署的节奏，投入必要时间，直至确信这些系统安全可靠并始终处于人类控制之下。\n\n　　Anthropic成立于2021年，旗下主要产品包括“克劳德”系列人工智能模型。今年前三季度，公司营业收入达到332.4亿美元，较去年同期增长约12倍。(完) 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"Anthropic上市 创史上最大IPO融资纪录","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734997.shtml","source_display":"中新網 環球","published_at":"2026-11-20T07:36:17+08:00","category":"國際","digest":"美国人工智能公司Anthropic当地时间19日在纽约纳斯达克证券交易所上市…"},{"title":"Anthropic上市｜開市報111美元 較招股價急升34% 創全球最大IPO紀錄","url":"https://www.stheadline.com/stock-market/3639034/Anthropic上市開市報111美元-較招股價急升34-創全球最大IPO紀錄","source_display":"星島頭條","published_at":"2026-11-20T00:53:01+08:00","category":"財經","digest":"人工智能巨頭Anthropic周四在納斯達克掛牌，開市報111.5美元…"},{"title":"Anthropic上市｜開市報111美元 較招股價升34% 創全球最大IPO紀錄","url":"https://www.stheadline.com/stock-market/3639034/Anthropic上市開市報111美元-較招股價升34-創全球最大IPO紀錄","source_display":"星島頭條","published_at":"2026-11-20T00:53:01+08:00","category":"財經","digest":"人工智能巨頭Anthropic周四在納斯達克掛牌，開市報111.5美元…"}],"cross":{"total":3,"angles":[{"point":"人工智能巨頭Anthropic周四在納斯達克掛牌，開市報111.5美元…","sources":["星島頭條","星島頭條"],"url":"https://www.stheadline.com/stock-market/3639034/Anthropic上市開市報111美元-較招股價急升34-創全球最大IPO紀錄"},{"point":"美国人工智能公司Anthropic当地时间19日在纽约纳斯达克证券交易所上市…","sources":["中新網 環球"],"url":"https://www.chinanews.com.cn/gj/2026/11-20/10734997.shtml"}]}},{"id":"ce024da7502","title":"新华图讯丨习近平会见马来西亚总理安瓦尔","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735207.shtml","summary":"11月20日，国家主席习近平在深圳会见马来西亚总理安瓦尔。","summary_short":"11月20日，国家主席习近平在深圳会见马来西亚总理安瓦尔。","digest":"11月20日，国家主席习近平在深圳会见马来西亚总理安瓦尔","points":["11月20日，国家主席习近平在深圳会见马来西亚总理安瓦尔","编辑：鲁鹏 毕晓洋 郝昭 卢烨 翟一凡"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-1 天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係，計劃在本港時間周六凌晨召開記者會，總結亞洲之旅。外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件。","summary_short":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係，計劃在本港時間周六凌晨召開記者會，總結亞洲之旅。","digest":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係…","points":["中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係…","外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件","國家主席習近平、俄羅斯總統普京及美國總統特朗普，周四舉行歷來首場中俄美元首會晤…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T11:53+08:00","size":2,"keywords":[],"body":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係，計劃在本港時間周六凌晨召開記者會，總結亞洲之旅。外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件。\n\n國家主席習近平、俄羅斯總統普京及美國總統特朗普，周四舉行歷來首場中俄美元首會晤，會後發表《中俄美元首和平宣言》，涉及能源穩定和核風險等，亦認為國際刑事法院不得濫用管轄權。\n\n特朗普其後搭專機回到白宮，他接受美國全國廣播公司電話訪問時，稱跟習近平討論發展人工智能(AI)相關議題，包括設立防護機制；又指三方會晤讓他跟習近平與普京建立極好的關係，若果10分是滿分，他會給12分。\n\n中共中央政治局委員、外長王毅見記者時指，中俄美三國元首史上首次會晤，屬於載入史冊的標誌性事件，強調三國元首同意防止發生衝突對抗，守住和平共處底線。\n\n外長王毅說：「中國一貫主張國家不分大小、一律平等，我們致力於推動國際關係民主化。同時我們認為，大國擁有更多資源、更大能力，應當展現大國胸懷、大國擔當，在國際上要帶頭講平等、守誠信、遵道義、重合作、作表率。」\n\n內地《環球時報》發表題為《中俄美三國元首會晤史無前例、創造歷史》社評，指這次會晤的核心議題集中在維護世界和平，與促進大國關係戰略穩定，不僅決定了大國關係的未來走向，也與世界各國的切身發展利益緊密相連。中俄美加強溝通和協調，將有助避免大國陷入對資源、技術和通道的惡性競爭，有助於維護能源產業鏈、供應鏈穩定暢通，並維護全球能源市場穩定。\n\n有美國傳媒指，中方展現主場優勢，營造大國形象。亦有分析認為，三方各有盤算，《和平宣言》缺乏實質內容，未就防止核擴散宣布具體措施，亦未提及美伊戰事和俄烏戰爭停火方案，認為會談未取得重大突破，形式大於實際。","image":"https://pro-vod-cdn.tvb.com/91ec969500db4273820f49aea5f3e113/snapshots/d71038e905d2428a979c3aacfe4fde19-00008.jpg","video":"https://pro-vod-cdn.tvb.com/91ec969500db4273820f49aea5f3e113/d4f0dc6c26f845fba11f76d7d75c306e-44590ce953982b36c185febe3017b405-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/91ec969500db4273820f49aea5f3e113/snapshots/d71038e905d2428a979c3aacfe4fde19-00008.jpg","lang":"zh-Hant","items":[{"title":"中俄美元首會晤｜特朗普稱與中俄元首建立極好關係 美媒指中方展現主場優勢","url":"https://news.tvb.com/tc/1207406-中俄美元首會晤特朗普稱與中俄元首建立極好關係美媒指中方展現主場優勢","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T11:53+08:00","category":"國際","digest":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係…"},{"title":"中俄美元首會晤｜特朗普擬周六開記者會 王毅指三方同意防止衝突對抗","url":"https://news.tvb.com/tc/1207355-中俄美元首會晤特朗普擬周六開記者會王毅指三方同意防止衝突對抗","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T06:13+08:00","category":"國際","digest":"美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅…"}],"cross":{"total":2,"angles":[{"point":"美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207355-中俄美元首會晤特朗普擬周六開記者會王毅指三方同意防止衝突對抗"},{"point":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207406-中俄美元首會晤特朗普稱與中俄元首建立極好關係美媒指中方展現主場優勢"}]}},{"id":"ca38df66047","title":"彌敦道瘋狂倒車撞4的士 警拘兩男涉盜人身份買車及狂亂駕駛 疑用作毒品快餐車","url":"https://www.stheadline.com/breaking-news/3639244/彌敦道瘋狂倒車撞4的士-警拘兩男涉盜人身份買車及狂亂駕駛-疑用作毒品快餐車","summary":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士，隨後逆線逃逸，導致一名57歲的士司機受傷送院。","summary_short":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士…","digest":"尖沙咀本周二凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障…","points":["尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障…","油尖警區重案組經深入調查後，發現案中案，揭發有人涉嫌盜用他人個人資料購買及登記為車主…","警方於本月17日及18日，在石硤尾及旺角賓館分別拘捕負責「買車登記」及「狂亂駕駛」的兩名26…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:52:34+08:00","size":1,"keywords":[],"body":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士，隨後逆線逃逸，導致一名57歲的士司機受傷送院。油尖警區重案組經深入調查後，發現案中案，揭發有人涉嫌盜用他人個人資料購買及登記為車主，並成功鎖定兩名嫌犯。警方於本月17日及18日，在石硤尾及旺角賓館分別拘捕負責「買車登記」及「狂亂駕駛」的兩名26歲本地男子，其中涉案司機將於明日（21日）在西九龍裁判法院提堂。\n消息稱，兩被捕男子均無業，有黑幫背景，兩人並不相識，涉案車輛僅登記三個星期，警方經調查後，不排除涉案車輛與毒品交易有關。\n警方展示檢獲的證物。楊偉亨攝\n警方展示案中證物。楊偉亨攝\n油尖警區重案組高級督察曾智皓現講述案情。\n遇路障拒查瘋狂倒車連撞四的士　白色私家車逆線狂飆山林道逃逸\n油尖警區重案組第二隊高級督察曾智皓詳細交代了案情。本月17日凌晨約1時10分，西九龍衝鋒隊隊員在尖沙咀彌敦道與山林道交界設置警方路障。期間，一輛白色私家車駛至，警員發現男司機神情緊張，遂上前指令其下車接受調查。然而，該名司機拒絕配合，並在無預警下突然急速倒車，猛烈撞向後方的四部的士。現場警員隨即上前制服並多次發出警告，惟司機一意孤行，強行扭軚並逆線駛入山林道，往覺士道方向狂飆，瞬間逃去無蹤。事件中，四輛被撞的士受到輕微損毀，一名57歲本地男的士司機頸痛，幸清醒送往伊利沙伯醫院治理後，同日已無礙出院。\n銳眼計劃法眼鎖定案中案　石硤尾拘廿六歲男涉盜個資「買人頭車」\n油尖警區重案組探員經深入調查及翻查「銳眼計劃」下安裝的閉路電視系統，警方發現，有人涉嫌非法盜用另一名男子的個人資料，登記為該輛逃逸私家車的車主。鎖定目標後，重案組探員於案發當日（17日）迅速展開行動，在石硤尾區以涉嫌「行使虛假文書」罪名，拘捕一名26歲姓簡的本地男子，他涉嫌盜用他人個資購買並登記涉案私家車。\n棄車上水古洞深山再匿旺角賓館　狂徒落網起獲車匙犯案衣物\n涉案的26歲姓李本地男司機在案發後隱匿行蹤。調查顯示，他狂飆逃離現場後，連夜將肇事私家車駛往上水古洞一處偏僻山路棄置，其後在旺角區的一間賓館租房匿藏。重案組探員於翌日（18日）中午時分突擊搜查該賓館，成功截獲李男，並以涉嫌「狂亂駕駛」將其拘捕。探員隨後將其押返黃大仙住所搜查，成功起獲涉案私家車的車匙、犯案當日所穿的衣物及手提電話，並在上水古洞的山路中尋回該輛白色私家車，車上並未發現其他違禁品。\n被捕的26歲李姓司機目前已被警方暫控相關罪名，案件將於明日（11月21日）在西九龍裁判法院提堂；而涉嫌盜用他人資料登記車主的簡姓男子則已獲准保釋候查，須於12月中旬向警方報到。警方強烈譴責此等罔顧他人生命安全的瘋狂駕駛行為，並重申根據香港法例第212章《侵害人身罪條例》，瘋狂駕駛致其他人受傷最高可判監兩年。曾智皓強調，雖然警方基於現場環境及安全考量，未有在彌敦道即時強行截停，但警隊絕對有能力憑藉強大的科技與偵查手段，在案發後迅速將犯案者繩之於法。\n鑑於本案涉及嚴重的個人資料被盜用以購買車輛犯罪，警方藉此機會向市民作出呼籲。曾智皓提醒，市民必須妥善保護自己的身份證、住址證明等個人私隱，切勿將個資交予未經核實的第三方。他強調，如果有人向你租借或者要求你出售個人資料，請三思而後行，切勿因小失大，避免不法之徒利用個人資料作非法用途，無論用作開銀行戶口，公司登記，車輛買賣登記或者其他非法用途，都可能需要負上刑責。記住，個人資料唔租，唔借，唔賣。\n17日凌晨涉案私家車犯案情況:\n網上流傳片段顯示，涉案私家車倒車期間，多名警員立即上前試圖截停，惟司機未有理會，繼續倒車並撞向多輛的士。片段中有人大聲喝止司機停車，但私家車仍繼續逃走，最後逆線駛入山林道。\n拍片者將片段上載社交平台，稱當晚在尖沙咀吃宵夜後，目睹一輛Audi私家車為避開路障撞向多輛的士後逃去。另有網民聲稱，該車逃走期間駛至裕華百貨對開曾衝紅燈，險些撞到途人。亦有網民揣測涉事車輛可能涉及毒品案件。","image":"","video":"","video_poster":"","lang":"zh-Hant"}],"sections":[{"name":"港聞","total":22,"items":[{"id":"c4bab4eb107","title":"馬場浮世繪│莫雷拉策「赤夢」出戰香港短途錦標","url":"https://www.stheadline.com/realtime-racing/3639269/馬場浮世繪莫雷拉策赤夢出戰香港短途錦標","summary":"日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈，於今年九月短途馬錦標跑第五的「赤夢」，將接受香港賽馬會邀請，下月來港參加一級賽香港短途錦標，屆時將由騎師莫雷拉主轡…","summary_short":"日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈，於今年九月短途馬錦標跑第五的「赤夢」…","digest":"日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈…","points":["日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈…","至於另一匹應邀來港出戰香港短途錦標的四歲雌馬「風仙美韻」，則配武豐上陣"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:48:36+08:00","size":1,"keywords":[],"body":"日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈，於今年九月短途馬錦標跑第五的「赤夢」，將接受香港賽馬會邀請，下月來港參加一級賽香港短途錦標，屆時將由騎師莫雷拉主轡，該駒早前已運返馬房，開始備戰，日前在美浦訓練中心快跳。至於另一匹應邀來港出戰香港短途錦標的四歲雌馬「風仙美韻」，則配武豐上陣。 文傑","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce80fdc0806","title":"宏福苑｜96.2%業主已簽買賣協議 解說專隊陪同街坊到盛緻苑收樓","url":"https://www.stheadline.com/society/3639267/宏福苑962業主已簽買賣協議-解說專隊陪同街坊到盛緻苑收樓","summary":"大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開。","summary_short":"大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開。","digest":"大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開","points":["大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開","房屋局今日(20日)在社交平台發文，交代宏福苑之長遠居住安排最新進展","截至本月17日，共有96.2%（1909戶）業主完成簽署《買賣協議》"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:43:04+08:00","size":1,"keywords":[],"body":"大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開。房屋局今日(20日)在社交平台發文，交代宏福苑之長遠居住安排最新進展。截至本月17日，共有96.2%（1909戶）業主完成簽署《買賣協議》。83.2%（ 1651戶）的業權轉讓已經完成，並已收到現金或「樓換樓券」，以便他們安排其長遠居所。除少數特殊個案外，餘下個案預計將於年內完成業權轉讓。\n首批街坊九龍灣盛緻苑收樓 讚交通便利配套齊備\n房屋局又指出，「特設銷售計劃」的10個房屋發展項目都有街坊選擇，其中九龍灣盛緻苑及粉嶺樂嶺軒單位的業主，將由本月起陸續完成交易及收樓。房屋局解說專隊昨日(19日)親自陪同其中一戶即將搬入九龍灣盛緻苑的街坊進行「收鎖匙」儀式，共同見證這歷史性時刻。\n房屋局的「解說專隊」陪同街坊前往收樓前，與街坊們逛逛鄰近的設施，好讓她們提前熟悉社區。盛緻苑附近有巴士站、小巴站、的士站，步行幾分鐘就到啟業邨，有街市、餐廳和不同的零售商店。平日喜歡煮食的街坊也感到非常滿意，大讚盛緻苑環境舒適、交通便利、附近設施齊備。\n設計溫馨獲街坊讚賞 感謝解說專隊一路陪伴\n隨後街坊正式步入屋苑，就見到溫馨繽紛的壁畫，再走幾步就是內園的休憩設施，街坊亦很滿意屋苑的設計。看完入伙短片、繳交費用及領取鎖匙後，專隊便與街坊上樓，見證街坊打開新居的大門。她選擇盛緻苑的原因是最快入伙，與兒子住得比以前更近，有不少朋友住在附近，住市區出入也方便。同時，她對選到心儀單位非常開心，座向理想、景觀開揚。她感謝「解說專隊」一直以來的支援與陪伴，詳盡解說選樓事宜，形容是「解決了所有煩憂」，預計新年後可以入伙。\n「解說專隊」與居民建立深厚情誼 承諾繼續同行\n長期伴隨居民重建生活的「解說專隊」亦與街坊建立了深厚互信。有喜愛戲曲的街坊在交流中透露，得知專隊成員同樣熱愛戲曲，已盛情邀請對方日後同台演出，並笑言要由專隊成員擔任「花旦」。\n房屋局對宏福苑街坊的信任表示感謝，並強調「解說專隊」將繼續堅守崗位，與他們一起前行。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2133aa0a55","title":"社評摘要｜明報：中美俄元首會談意義大／AM730：開放成就世界矚目","url":"https://news.tvb.com/tc/1207371-社評摘要明報中美俄元首會談意義大AM730開放成就世界矚目","summary":"明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極、建設性及富有成果。這次會議的最大意義，在於展示大國之間可以求同存異，以溝通對話維護戰略穩定，一起應對全球挑戰。","summary_short":"明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極、建設性及富有成果。","digest":"明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極…","points":["明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極、建設性及富有成果","這次會議的最大意義，在於展示大國之間可以求同存異，以溝通對話維護戰略穩定，一起應對全球挑戰","會後三方和平宣言除了談及國際安全、核問題及聯合國改革，亦有討論能源安全…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:39+08:00","size":2,"keywords":[],"body":"明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極、建設性及富有成果。這次會議的最大意義，在於展示大國之間可以求同存異，以溝通對話維護戰略穩定，一起應對全球挑戰。\n\n會後三方和平宣言除了談及國際安全、核問題及聯合國改革，亦有討論能源安全，三國計劃增加成品油生產及供應，對國際社會也是好消息。宣言文本是三方會談得出的最大公約數，可不等於三方有著一模一樣的想法。\n\nAM730社評：今年APEC領導人非正式會議在深圳舉行，國家選擇深圳而非上海和北京，正好讓世界看見這個昔日漁村小鎮，如何發展成中國的金融和科技先進城市，成為中國式現代化的典範，並以城市化改善人民生活。\n\n深圳市政府多年喊出「來了就是深圳人」，號召全國不同出身背景的人才，到深圳發揮所長，打造今日成就。今年APEC主題重視開放，深圳的經歷，正好說明開放如何帶來發展，也回應了深圳今日舉世矚目成就的背景。","image":"https://pro-vod-cdn.tvb.com/5c5646f297fe40568c0ac60bb461f610/snapshots/faf336ee3acc4d80b7e53fc511c84979-00008.jpg","video":"https://pro-vod-cdn.tvb.com/5c5646f297fe40568c0ac60bb461f610/c2c1737293f64e768a1945a9b6f76377-be4d8d2ccdda414db2b42a20ad3a040a-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/5c5646f297fe40568c0ac60bb461f610/snapshots/faf336ee3acc4d80b7e53fc511c84979-00008.jpg","lang":"zh-Hant","items":[{"title":"社評摘要｜明報：中美俄元首會談意義大／AM730：開放成就世界矚目","url":"https://news.tvb.com/tc/1207371-社評摘要明報中美俄元首會談意義大AM730開放成就世界矚目","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:39+08:00","category":"港聞","digest":"明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極…"},{"title":"社評摘要｜大公：中國力量守護世界和平／經濟：三國聚首設護欄","url":"https://news.tvb.com/tc/1207364-社評摘要大公中國力量守護世界和平經濟三國聚首設護欄","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:03+08:00","category":"港聞","digest":"大公報社評：APEC深圳會議周昨日進入最高潮，也是成果最為豐碩的一天…"}],"cross":{"total":2,"angles":[{"point":"大公報社評：APEC深圳會議周昨日進入最高潮，也是成果最為豐碩的一天…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207364-社評摘要大公中國力量守護世界和平經濟三國聚首設護欄"},{"point":"明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207371-社評摘要明報中美俄元首會談意義大AM730開放成就世界矚目"}]}},{"id":"c4a9dac41be","title":"蔡天鳳碎屍案｜鄺港智稱兩兄弟大美督下車後父親上車 折返後目睹蔡頭上有血","url":"https://news.tvb.com/tc/1207404-蔡天鳳碎屍案鄺港智稱兩兄弟大美督下車後父親上車折返後目睹蔡頭上有血","summary":"[12:07更新]鄺港智供稱兩兄弟在大美督下車，鄺球上車見蔡天鳳，他折返後見到蔡倒臥地上、頭部有血。[早前報道]大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智繼續作供。","summary_short":"[12:07更新]鄺港智供稱兩兄弟在大美督下車，鄺球上車見蔡天鳳，他折返後見到蔡倒臥地上、頭部有血。","digest":"[12:07更新]鄺港智供稱兩兄弟在大美督下車，鄺球上車見蔡天鳳…","points":["鄺港智供稱兩兄弟在大美督下車，鄺球上車見蔡天鳳，他折返後見到蔡倒臥地上、頭部有血","大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智繼續作供","審訊踏入第42日，鄺港智繼續在代表律師安華暉引導下作供，問他是否曾到過龍尾村單位"],"section":"港聞","category":"法庭","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T12:07:00+08:00","size":1,"keywords":["碎屍案","蔡天鳳","Abby Choi","蔡天鳳案"],"body":"[12:07更新]\n鄺港智供稱兩兄弟在大美督下車，鄺球上車見蔡天鳳，他折返後見到蔡倒臥地上、頭部有血。\n\n[早前報道]\n大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智繼續作供。\n\n審訊踏入第42日，鄺港智繼續在代表律師安華暉引導下作供，問他是否曾到過龍尾村單位。他指案發前約一個多星期，曾在兄長鄺港傑的建議下前往單位，當時單位內未有見到湯煲、菜刀等涉案物品。\n\n至於案發現場檢獲懷疑為兇器的圓頭鎚，經化驗及分析後，發現與鄺港智的DNA吻合。鄺港智表示，未曾觸碰過該圓頭鎚。\n\n而案發當日，閉路電視拍攝到他登上載有蔡天鳳的七人車，安華暉指出，蔡天鳳在車上發出最後的訊息，是因為其後遭到鄺港智襲擊。鄺港智不同意，指蔡天鳳在車上一直與他對話，期間曾提及母親張燕花欠債，她需要還利息並感到壓力大。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/09/2026lKsWZ89G0l1790739850.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/e1412633ba4846c294c2e78a5d880787/07ea8fc6d8474054a2b8b35790ca1f8c-a2f284c7ab388548ada12e52e6bde56c-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/09/2026lKsWZ89G0l1790739850.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"cdc027080e5","title":"香港金牛｜CBA俱樂部盃響頭炮 美臣鍾斯23分8助攻領軍締NBL球隊首勝","url":"https://www.stheadline.com/basketball-zone/3639200/香港金牛CBA俱樂部盃響頭炮-美臣鍾斯23分8助攻領軍締NBL球隊首勝","summary":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事，憑藉外援美臣鍾斯（Mason Jones）交出全場最高23分及8次助攻的出色表現，以77:72擊退長白山恩都里…","summary_short":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","digest":"香港金牛籃球隊於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","points":["香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","志在衝擊CBA的香港金牛，今仗甫開賽迅速入局","美臣鍾斯不僅頻頻切入得分，更兩度助攻另一外援所羅門（Richard Solomon III）…"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:38:52+08:00","size":1,"keywords":[],"body":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事，憑藉外援美臣鍾斯（Mason Jones）交出全場最高23分及8次助攻的出色表現，以77:72擊退長白山恩都里，旗開得勝，更成為今屆賽事首支報捷的NBL球隊。\n志在衝擊CBA的香港金牛，今仗甫開賽迅速入局。美臣鍾斯不僅頻頻切入得分，更兩度助攻另一外援所羅門（Richard Solomon III）上演「拆你屋」入樽，引爆全場氣氛；次節新兵石奎亦在抄截後快攻得手，順利取得職業生涯首分。上半場比賽十分激烈，香港金牛僅僅以43:40領先對手返回更衣室。\n換邊後雙方戰況膠著，進入決勝的第四節，領先的金牛一度出現混亂，陷入被對手狂追比分的危機。關鍵時刻，新加盟的楊和挺身而出，連番命中中距離及三分球穩住陣腳，最終金牛頂住壓力，以77:72保住勝局。除美臣鍾斯外，所羅門今仗亦貢獻14分及15個籃板的「雙雙」數據，楊和則有8分進帳。\n主教練解立彬賽後感謝CBA公司給予NBL球隊參與高強度比賽的機會：「上半場戰況激烈，下半場大家學會以團隊拿下比賽。過程中確實有很多混亂的地方，我們需要在往後的比賽和訓練中，解決今天出現的問題。」\n贏波功臣美臣鍾斯則喜言：「這是我們今季第一場比賽，很高興能拿下首勝。正如教練所言，每一天都是新課題。我們一直按計劃努力訓練，表現比大家預期好很多。去年我們在俱樂部盃成績不錯，我知道今年外界的期待會更高，我們會逐日做好，繼續保持進步。」香港金牛將於今日（20日）下午3時30分迎戰廣州智都集團，力爭兩連勝。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cda43d3a80c","title":"選委會選舉2026．提名全名單︱累計接獲1155份提名 至少31個界別分組有競爭 社福界25人爭15席","url":"https://www.stheadline.com/politics/3626329/選委會選舉2026提名全名單累計接獲1155份提名-至少31個界別分組有競爭-社福界25人爭15席","summary":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。","summary_short":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。","digest":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束…","points":["選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行","提名期10月20日下午5時結束，總數共接獲1115份候選人提名及40份指定團體提名表格…","其中，第一界別工商金融界，18個分組都出現超額競"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:23:41+08:00","size":1,"keywords":[],"body":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。提名期10月20日下午5時結束，總數共接獲1115份候選人提名及40份指定團體提名表格，其中31個界別分組已超額報名，將會有競爭。其中，第一界別工商金融界，18個分組都出現超額競；第二界別專業界，10個分組中，有8個出現競爭，競爭最激烈是社會福利界，有25人爭15席。\n2026選委會選舉名單：\n 第一界別（工商及金融）\n 飲食界\n 商界（第一）\n 商界（第二）\n 商界（第三）\n 香港僱主聯合會\n 金融界\n 金融服務界\n 酒店界\n 進出口界\n 工業界（第一）\n 工業界（第二）\n 保險界\n 地產及建造界\n 中小企業界\n 紡織及製衣界\n 旅遊界\n 航運交通界\n 批發及零售界\n\n 第二界別（專業界）\n 會計界\n 建築、測量、都市規劃及園境界\n 中醫界\n 教育界\n 工程界\n 法律界\n 醫學及衞生服務界\n 社會福利界\n 體育、演藝、文化及出版界\n 科技創新界\n\n 第三界別（基層及勞工）\n 漁農界\n 同鄉社團\n 基層社團\n 勞工界\n 宗教界\n\n 第四界別（立法會、地區組織等）\n 鄉議局\n 港九地區三會\n 新界地區三會\n 立法會議員\n 內地港人團體代表\n\n 第五界別（港區全國人大政協及全國性團體代表）\n 全國性團體\n 港區人大政協\n\n相關新聞： 選舉委員會界別分組換屆選舉11.22舉行 提名期10.7至10.20\n相關新聞： 大棋盤｜選委會改選 部分工商界別提前協調名單 富商家族人數料續設限\n第一界別（工商及金融）\n 總席位數：300席\n 選舉產生席位：300席\n 目前報名總數：342人\n 超額競逐組別：17個\n飲食界\n 選舉產生席位：16\n 17人（超額1人）\n凌偉業、楊浩宏、胡珠、胡振華、譚家良、江志恒、吳子文、楊位醒、鄭栢文、陳家強、盧浩宏、鍾偉平、盛智文、莊裕坤、楊振年、吳德曉、王偉樑\n商界（第一）\n 選舉產生席位：17\n 19人（超額2人）\nBRADLEY Guy Martin Coutts、楊偉添、霍啟山、欣榮、李家聰、余國賢、楊美珍、陳豪賢、高美懿、蘇裕康、馮玉麟、梁兆基、于健安、洪丕正、阮蘇少媚、林健鋒、陳凱、陳細明、伍俊達\n商界（第二）\n 選舉產生席位：17\n 19人（超額2人）\n楊華勇、柯家洋、謝湧海、陳斌、 忍的方式殺害死者…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:06:40+08:00","size":1,"keywords":[],"body":"23歲女瑜伽導師周慧賢（Aqua）4年前遭前男友以名牌手袋絲巾餌誘到尖沙嘴麗思卡爾頓酒店，其後被發現倒斃浴缸內，身中至少42刀。32歲前男友勞浚銘否認1項謀殺罪，5男2女陪審團昨退庭商議約5小時後，一致裁定被告謀殺罪成。法官郭啟安今早於高等法院判刑，斥責被告用最殘忍的方式殺害死者，可以想像死者死前必然十分痛苦及極度恐懼，依例判處終身監禁。\n被告自撰求情信稱殺害了唯一愛過的女人\n案發時28歲被告勞浚銘報稱無業，被控於2022年6月29日至30日期間在香港，謀殺周慧賢。陪審團昨一致裁定被告謀殺罪成，被告聞判時表現平靜。控方透露被告現年32歲，過去沒有案底，曾任職法務助理，被捕時無業。\n辯方今引述被告求情信，當中向事主及其親友致歉，無法保護死者之餘，更向公眾呈現了其負面形象，被告承認錯誤，殺害了此生唯一愛過的女人，案發後在私人律師勸說下自首。\n郭官指陪審團昨退庭商議僅5小時，可見完全拒絕被告辯解，認為就算死者有挑釁被告，常人也不會如被告般用刀殺害死者。郭官斥責被告用最殘忍的方式殺害死者，可以想像死者死前必然十分痛苦及極度恐懼，並向承受悲痛的死者親友致意。\n案件編號：HCCC148/2024\n法庭記者：陳子豪","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb7f1de7217","title":"荔枝角青山道工廈起火 濃煙密佈 消防救熄 2人不適","url":"https://www.stheadline.com/breaking-news/3639183/荔枝角青山道工廈起火-濃煙密佈-消防救熄-2人不適","summary":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火，其中一名報案人指自己正身在起火單位內，消防接報派出搜救隊到場，並開喉撲救…","summary_short":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火…","digest":"荔枝角青山道嘉名工廠大廈，今早上10時34分，警方接獲多個報案…","points":["荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案…","火警中，初步有兩人不適，其中一人須戴上氧氣罩送院","上址為7樓一個工作室及平台花園，網上影片所見，起火位置火光熊熊，大廈的頂部噴出濃煙…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:06:16+08:00","size":1,"keywords":[],"body":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火，其中一名報案人指自己正身在起火單位內，消防接報派出搜救隊到場，並開喉撲救，約15分鐘將火救熄。火警中，初步有兩人不適，其中一人須戴上氧氣罩送院。 上址為7樓一個工作室及平台花園，網上影片所見，起火位置火光熊熊，大廈的頂部噴出濃煙，離遠亦見到火警工廈附近一帶煙霧瀰漫。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc24bb4f944","title":"WhatsApp 騎劫騙案有新招？騙徒複製群組扮朋友促過數 專家揭騎劫方法 教路3方法防中招","url":"https://www.stheadline.com/society/3638854/WhatsApp-騎劫騙案有新招騙徒複製群組扮朋友促過數-專家揭騎劫方法-教路3方法防中招","summary":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。","summary_short":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。","digest":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢","points":["WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢","有網民的WhatsApp被騙徒騎劫，騙徒從網民的WhatsApp 帳號知道所有群組名稱…","網民形容事件「恐怖」，並將事發情發布在社交平台「警世」"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:38+08:00","size":1,"keywords":[],"body":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。有網民的WhatsApp被騙徒騎劫，騙徒從網民的WhatsApp 帳號知道所有群組名稱，然後選擇其中一個只有3個人的群組，新增一個以該群組同名的群組，再用兩個假帳戶假扮網民的朋友，要求網民轉帳$27300，同時騙徒亦以該網民的名義，向網民的親戚朋友借錢。網民形容事件「恐怖」，並將事發情發布在社交平台「警世」。\n複製朋友3人群組 扮朋友促過數$27,300\n網民發文稱，指自己本來有一個包含3人的群組，群組成員包括A和B兩人，日前(18日)下午突然收到A在群組發信息要求B過數 $27,300，但B稱無法轉數，而A重複指「好急」，要求當日轉數。網民隨口搭話，指「咁似詐騙嘅？」而A和B好自然和網民對答，語氣和互動「好似我平時同佢哋傾偈咁。」其後兩名「朋友」詢問網民可否幫忙過數，因為他們正在上班，網民見二人十分心急，便將過數資料發給家人幫手過數，家人看完後反問「你係咪俾人呃錢？」其時網民才恍然大悟，查看群組的信息紀錄，發現只有昨日的紀錄，同時各自的私聊同樣只有昨日的記錄。\n扮網民向WhatsApp名單求過數1萬\n網民再查看WhatsApp群組，發現同時有兩個一模一樣的群組，包含騙徒的群組的兩位「朋友」都使用陌生的電話號碼，只是挪用真朋友的名稱和頭像來騙取網民信任；同時騙徒亦有在同一時間向網民的家人朋友發信息，要求過數1萬元到一個陌生的帳戶。\n方保僑估計網民使用WhatsApp網頁致戶口被騎劫\n香港資訊科技商會榮譽會長方保僑接受《星島頭條》電話訪問時，估計網民在使用WhatsApp網頁登入版面時被騙徒騎劫帳戶，因而有能力瀏覽網民WhatsApp內的所有資料，並取得掌控權，可以隨時新增群組，再用兩個假戶口扮作朋友，模仿平時的說話語氣，以增強騙財的說服力。\n點擊不明連結可令瀏覽器中毒 騙徒可遠端操作電腦\n至於WhatsApp帳戶被騎劫的原因，方保僑表示，過往Whatsapp 帳戶被騙徒騎劫主要是由於市民在搜索引擎搜索時，往往按最開頭的連結，而在搜索引擎賣廣告可令搜索結果置頂，因而登入由騙徒製作的假WhatsApp網頁，掃描惡意二維碼，騙徒隨即取得用戶連線資料，但現時搜索引擎已盡量攔截虛假網站廣告，因此現時較少因此方法被騎劫；他估計網民有機會點擊不明連結，令到瀏覽器中毒，使騙徒可以遠端操作電腦，因而獲得WhatsApp網頁的使用權。\n教路三方法防止WhatsApp被騎劫\n方保僑提醒，如要防止WhatsApp帳戶被騎劫，在使用網上版WhatsApp後切記要隨即登出網頁，不宜長期保止登入狀態；另外，亦可留意WhatsApp已連結裝置，若發現有不明裝置連結，可即時將該裝置登出，並重裝WhatsApp；另外，亦可使用防毒及防間諜軟件掃瞄電腦，如發現有木馬程式要立即進行殺毒，以免電腦被騙徒控制。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ceff8e70355","title":"警隊進駐抖音三周年累計吸粉500萬 發布飛虎隊實訓片「一哥」周一鳴出鏡","url":"https://www.stheadline.com/breaking-news/3639149/警隊進駐抖音三周年累計吸粉500萬-發布飛虎隊實訓片一哥周一鳴出鏡","summary":"香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬。","summary_short":"香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬。","digest":"香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬","points":["香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬","警方在抖音、小紅書及微博等多個社交平台同步發布飛虎隊（特別任務連）海陸空三棲實訓宣傳片…","感謝500萬粉絲支持 勉勵一起邁向新征程"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:14:01+08:00","size":1,"keywords":[],"body":"香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬。警方在抖音、小紅書及微博等多個社交平台同步發布飛虎隊（特別任務連）海陸空三棲實訓宣傳片，感謝網民及粉絲的支持。\n感謝500萬粉絲支持 勉勵一起邁向新征程\n香港警察官方抖音帳號發文表示，適逢入駐抖音三周年，「飛虎隊如約而至」，並向500萬名粉絲致謝，寄語「一起邁向新征程」。警方發放的飛虎隊（特別任務連）海陸空三棲實訓宣傳片，展示隊員訓練時勇猛雄姿，配上強勁背景音樂，質素猶如警匪電影，其中「一哥」警務處處長周一鳴亦粉墨登場，有份演出。\n展示飛虎隊海陸空實戰標準 強調守護初心如一\n警方同步在小紅書及微博上載有關正片，介紹飛虎隊「獵鷹行動」海陸空實訓現場。帖文形容訓練「沒有彩排，只有實戰標準」，展現飛虎隊員在「陸地突入的果斷，海上突擊的迅猛，空中索降的從容」。\n警方在帖文中強調，飛虎隊透過不同維度錘煉特警力量，面對各種考驗，「萬家安穩，源於長久堅守」、「守護的初心始終如一」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c30a36497d2","title":"天氣｜天文台清晨錄最低氣溫15.3度 為今年入秋以來最低","url":"https://news.tvb.com/tc/1207354-天氣天文台清晨錄最低氣溫153度為今年入秋以來最低","summary":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄，大帽山最低5度。天文台署理高級科學主任黎宏駿指出：「預計今日會是密雲，有幾陣雨，市區氣溫由初時約17度，下降至今日稍後約14度，新界再低一、兩度，吹清勁北至東北風，離岸及高地會吹強風。","summary_short":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄，大帽山最低5度。","digest":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄…","points":["天文台署理高級科學主任黎宏駿指出：「預計今日會是密雲，有幾陣雨，市區氣溫由初時約17度…","在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步","天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T08:13+08:00","size":1,"keywords":[],"body":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄，大帽山最低5度。\n\n天文台署理高級科學主任黎宏駿指出：「預計今日會是密雲，有幾陣雨，市區氣溫由初時約17度，下降至今日稍後約14度，新界再低一、兩度，吹清勁北至東北風，離岸及高地會吹強風。」\n\n在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖。\n\n早上上班上學時間，不少市民穿了外套及頸巾，天文台預料明日早上仍然相當清涼，最低15度，隨後一兩日氣溫稍為回升，下周中期再度轉涼。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/snapshots/9d1a6588a82e469180a6ee5f15cfd348-00006.jpg","video":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/ae111edb665d47bd90ae6ca657947fa8-c65245cd819bec7338d021b7e71b0359-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/snapshots/9d1a6588a82e469180a6ee5f15cfd348-00006.jpg","lang":"zh-Hant"},{"id":"c028816e5f3","title":"宏福苑丨逾96%業主已簽買賣協議 啟德最受歡迎 粉嶺九龍灣已落成項目多人揀","url":"https://www.stheadline.com/society/3638897/宏福苑丨逾96業主已簽買賣協議-啟德最受歡迎-粉嶺九龍灣已落成項目多人揀","summary":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。","summary_short":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。","digest":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權","points":["大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權","房屋局回覆《星島》查詢時透露，截至本月17日，共有1,909戶業主完成簽署《買賣協議》…","1,651戶的業權轉讓已經完成並收到現金或「樓換樓劵」，佔總數83.2%"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:00:00+08:00","size":1,"keywords":[],"body":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。房屋局回覆《星島》查詢時透露，截至本月17日，共有1,909戶業主完成簽署《買賣協議》，佔單位總數96.2%；1,651戶的業權轉讓已經完成並收到現金或「樓換樓劵」，佔總數83.2%；除少數特殊個案外，餘下個案預計於年內完成業權轉讓。\n「特設銷售計劃」中，以啟德啟陽苑最多業主選購，之後是已落成的粉嶺及九龍灣項目。目前已有9位業主完成收樓，有長者成為首位到粉嶺樂嶺軒收樓取鎖匙的宏福苑業主。\n有長者粉嶺上樓取鎖匙 年底遷入\n房協昨日在社媒發布影片，片中見到房協人員陪同長者張女士和家人前往粉嶺樂嶺軒辦理收樓手續及領取鎖匙，一同見證正式收樓。張女士對新居環境表示滿意，稱讚單位景致開揚，且單位無需進行繁複裝修，只需添置基本傢俬電器及加裝長者友善輔助設施，預計今年年底便能正式入伙，與同住的母親及弟弟展開新生活。她感謝社會各界熱心人士支持，以及「一戶一社工」和「解說專隊」成員一直以來的協助。\n相關新聞：宏福苑｜婆婆到粉嶺樂嶺軒收鎖匙 成首位業主收樓 料年底前入伙\n房屋局回覆《星島》查詢時透露，為出售業權的宏福苑業主而設的「特設銷售計劃」，已於9月29日開始按早前透過電腦隨機攪珠方式排列選樓次序的結果分批進行選樓。截至本月17日，共1,627戶，佔申請參與的業主的96%獲邀出席選樓環節，其中1,445戶出席選樓環節，1,410戶已透過「特設銷售計劃」選購或預留新單位。\n啟德已售或預留單位456個\n當中較多人選擇的是預計2028年10月落成的啟德啟陽苑，已售／預留456個單位；其次為房協項目、已落成的粉嶺樂嶺軒，已售／預留278個單位；九龍灣盛緻苑亦已售／預留252個單位。至於2029年12月落成的大埔欣雅苑，已售／預留181個單位。選購已落成的九龍灣盛緻苑及粉嶺樂嶺軒單位的業主，將由今年11月起陸續完成交易及收樓。截至本月17日，已有9位業主完成收樓。\n鄧家彪引述，有居民表示滿意樓宇附近的社區以及交通設施。\n協助宏福居民處理安置工作的工聯會立法會議員鄧家彪表示，能夠在一年內讓約2000個家庭有確切的長遠安居出路，並不容易，當中牽涉到收集意向、複雜的法律程序，以及要兼顧公平性，他認為整個政府跨部門團隊的努力值得肯定。\n他續指，較多人選擇啟德、粉嶺及九龍灣屋苑，反映多數居民重視盡早獲得安居之所，而政府亦做到在符合司法程序、兼顧社會利益與公平性的情況下，盡早安排合適居所。他提到，居民亦同樣重視地理位置，而政府亦並非隨意選擇樓宇，而是盡量貼近居民原有的生活質素，有居民表示滿意樓宇附近的社區以及交通設施。\n羅曉楓(左)引述居民稱，希望新一年可以過得「自在少少」。\n\n大埔區議員羅曉楓表示，政府重視宏福苑居民聲音，多個部門一直為居民提供協助，有居民向他讚揚解說專員解說詳細。羅曉楓引述居民稱，經歷一年，居民都希望新一年可以過得「自在少少」。對於仍有少數業主沒有簽署《買賣協議》，他認為不是全部人都是「死硬派」，相信有部分居民已失聯或已離香港。羅曉楓是選委會選舉參選人，詳細名單請參閱選舉網站。\n相關新聞：\n宏福苑｜「特設銷售計劃」10屋苑價單曝光 最平裕豐苑僅151萬 最貴房協「灝然」達536萬\n宏福苑收購︱《買賣協議》限期昨日屆滿 93.2%業主簽署 房屋局將酌情處理特殊個案","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbd0a5ab3e9","title":"元朗大馬路單車紙皮起火 火舌逼近垃圾桶 途人合力移走防蔓延","url":"https://www.stheadline.com/breaking-news/3639138/元朗大馬路單車紙皮起火-火舌逼近垃圾桶-途人合力移走防蔓延","summary":"元朗大馬路對開行人路發生火警。","summary_short":"元朗大馬路對開行人路發生火警。","digest":"元朗大馬路對開行人路發生火警","points":["元朗大馬路對開行人路發生火警","周四（19日）網上流傳一段影片，顯示路邊一個垃圾桶旁邊有紙皮及單車起火，火勢猛烈","多名途人見狀上前協助移走垃圾桶及單車，防止火勢蔓延，情況驚險"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:54:03+08:00","size":1,"keywords":[],"body":"元朗大馬路對開行人路發生火警。周四（19日）網上流傳一段影片，顯示路邊一個垃圾桶旁邊有紙皮及單車起火，火勢猛烈。多名途人見狀上前協助移走垃圾桶及單車，防止火勢蔓延，情況驚險。\n火勢猛烈逼近垃圾桶 兩名市民上前移開\n網傳片段可見，事發地點位於元朗大馬路對開行人路，一個垃圾桶旁邊的紙皮及單車陷入火海，現場火勢猛烈，火舌一度逼近垃圾桶。\n有兩名市民見狀後，隨即上前將垃圾桶移開；另有途人協助搬走鎖在鐵欄的單車，避免火勢進一步擴大。\n片段未有交代確實事發日期及時間。據了解，警方及消防初步未有接獲相關報案。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c106916d806","title":"屯門雅都花園第3座疑爆食水管停水逾兩日 住戶不滿垃圾房旁取水","url":"https://www.stheadline.com/breaking-news/3639137/屯門雅都花園第3座疑爆食水管停水逾兩日-住戶不滿垃圾房旁取水","summary":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。","summary_short":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。","digest":"屯門雅都花園第3座自本周二起疑因食水管爆裂緊急停水，至今仍未恢復供水","points":["屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水","事件引起居民不滿，批評初期未獲妥善應急安排，需在環境惡劣的垃圾房旁取水","涉事第3座本周二上午疑因地下供水上天台的水缸輸喉管爆裂，導致整座大廈停水，樓下商場則未受影響"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:38:41+08:00","size":1,"keywords":[],"body":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。事件引起居民不滿，批評初期未獲妥善應急安排，需在環境惡劣的垃圾房旁取水。\n疑地下輸喉管爆裂停水 商場未受影響\n據悉，涉事第3座本周二上午疑因地下供水上天台的水缸輸喉管爆裂，導致整座大廈停水，樓下商場則未受影響。\n今日（20日）凌晨現場可見，大廈內貼有通告通知住客停水及臨時供水位置。\n管理公司稱招標需時一個月 區議員介入設臨時取水點\n有住客反映，居民曾向管理處及業主立案法團反映問題，惟未獲應急安排，低層住戶一度要在環境惡劣的垃圾房旁取水。據了解，管理公司曾表示「要按正常程序向政府招標，一個月後，居民才有食水」。\n區議員及支援團隊其後介入事件，在第3座2樓平台設置臨時取水點，供受影響的1至14樓居民應急。據悉，維修人員需由第1及第2座駁水至第3座，再接駁至地下垃圾房旁及大廈平台位置裝設臨時供水。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb4dc49587b","title":"山頂柯士甸山道獨立屋遇竊 賊人撬窗掠4個Hermès手袋值約15萬","url":"https://www.stheadline.com/breaking-news/3639136/山頂柯士甸山道獨立屋遇竊-賊人撬窗掠4個Hermès手袋值約15萬","summary":"山頂柯士甸山道發生爆竊案。","summary_short":"山頂柯士甸山道發生爆竊案。","digest":"山頂柯士甸山道發生爆竊案","points":["山頂柯士甸山道發生爆竊案","昨午（19日）5時許，警方接獲一名外傭報案，指柯士甸山道24號至28號一幢獨立屋懷疑遭賊人潛…","警員接報到場調查，發現上址一間房間的窗戶被撬開"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:30:43+08:00","size":1,"keywords":[],"body":"山頂柯士甸山道發生爆竊案。昨午（19日）5時許，警方接獲一名外傭報案，指柯士甸山道24號至28號一幢獨立屋懷疑遭賊人潛入爆竊。 警員接報到場調查，發現上址一間房間的窗戶被撬開。經初步點算，相信屋內有4個名牌手袋失去。 據悉，4個失竊手袋均為Hermès，總值約15萬元。 警方經初步調查後，將案件列作爆竊，交由中區警區刑事調查隊第一隊跟進，暫時未有人被捕。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4276738a95","title":"香港仔利群商場大鼠當眾行走 網民慨嘆環境變差","url":"https://www.stheadline.com/breaking-news/3639130/香港仔利群商場大鼠當眾行走-網民慨嘆環境變差","summary":"香港仔利群商場疑出現大鼠出沒。","summary_short":"香港仔利群商場疑出現大鼠出沒。","digest":"香港仔利群商場疑出現大鼠出沒","points":["香港仔利群商場疑出現大鼠出沒","周四（19日）有網民在社交平台發文，指在該商場地下電梯位置目擊大鼠行走，引起網民熱議","網民指傍晚6時半目擊 大鼠神色自若"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:11:31+08:00","size":1,"keywords":[],"body":"香港仔利群商場疑出現大鼠出沒。周四（19日）有網民在社交平台發文，指在該商場地下電梯位置目擊大鼠行走，引起網民熱議。\n網民指傍晚6時半目擊 大鼠神色自若\n有網民昨日（19日）在Facebook群組「南區之友 2.0」發帖，指在「利群商場6:30見到」，位置在「地下、電梯位置」。從網傳圖片可見，一隻體型頗大的老鼠在場內當眾行走，表現神色自若，未見懼色。\n從網傳圖片可見，一隻體型頗大的老鼠在場內當眾行走。FB@南區之友 2.0\n帖文引起不少網民留言討論，有人幽默地代老鼠自稱「我係米奇，唔係老鼠」，亦有人打趣稱「日光日白，幻覺」。\n不過，亦有網民對區內衞生情況表示擔憂，慨嘆「唉，癡線，香港仔越嚟越污糟」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdd86b53e30","title":"新版Zeekr 7X香港開售｜豪華純電動5座SUV煥新升級 一式三款早鳥價$39.99萬元起 即日起至11月25日ELEMENTS圓方首展","url":"https://www.stheadline.com/car/3639123/新版Zeekr-7X香港開售豪華純電動5座SUV煥新升級-一式三款早鳥價3999萬元起-即日起至11月25日ELEMENTS圓方首展","summary":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會，豪華純電5座SUV續有單馬達後驅7X與長續航7X Plus…","summary_short":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","digest":"極氪Zeekr昨午在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","points":["極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","新車即日起至11月25日於ELEMENTS圓方金區1樓首展，車展早鳥優惠價分別為$399…","新版Zeekr 7X香港開售：流麗型態0.247Cd低風阻 兩款新色選擇"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T01:29:39+08:00","size":1,"keywords":[],"body":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會，豪華純電5座SUV續有單馬達後驅7X與長續航7X Plus，以及標配空氣懸掛的雙馬達四驅旗艦7X Platinum三款型號。新車即日起至11月25日於ELEMENTS圓方金區1樓首展，車展早鳥優惠價分別為$399,900起（限量30部）、$469,900起及$519,900起，預計12月到港交付。文、圖：sammy\n新版Zeekr 7X香港開售：流麗型態0.247Cd低風阻 兩款新色選擇\n煥新版Zeekr 7X的長闊高尺寸是4,800 x 1,920 x 1,650mm，長度比舊版延伸13mm，橫闊收窄10mm，高度與2.9米軸距維持不變。簡約流麗造型同樣出自設計大師Stefan Sielaff手筆，換入新款前後泵把之餘，車頭並改配主動進氣格柵，連繫兩端新增導風口，行車風阻低至0..247Cd。車尾方面，車牌框擺放位置也見調動，由泵把上移到尾門中央，而可供選配的智能感應車門開關鍵，亦由B柱改為與車門把手融合。車展期間選購7X Plus和7X Platinum，除了免費升級Nappa真皮座椅，還分別加送電動後座側窗簾和橙色Akebono四活塞制動卡鉗。車身顏色共有6種，暗夜紫Interstellar Purple與Tech Grey星幕灰配Black Roof黑車頂是新增色系，其中後者是旗艦7X Platinum專屬。\n新版Zeekr 7X香港開售：裝潢配置升級 新增紫黑內飾\n環抱式座艙實用空間比例達83.34%，整體佈局沒有異動，但用料及配置皆升級。當中，頂篷改以麂皮包裹，質感更豪華。全線車系標配行車記錄儀（DVR）與雙層隔音玻璃，後者助分貝降至52db，乘坐比前寧靜舒適。與此同時，智能駕駛輔助系統核心晶片亦升級至J6M SOC（7鏡頭及3雷達）架構，提升極端天氣及後方盲區監測的傳感器融合力。未來，透過OTA更新還可加入遙控泊車輔助（RPA）新功能。全新紫黑配搭車廂內飾是7X Plus和7X Platinum專屬，而兩車配置同樣高級，除了前座備有14方位電動調校、記憶、通風及按摩功能，還有36.21吋AR-HUD投射式儀錶及21喇叭7.1.4聲道Zeekr Sound Pro音響等。\n新版Zeekr 7X香港開售：添動力增續航 10.5分鐘充電80%\n動力方面，煥新版Zeekr 7X性能同見升級。入門7X續配75kWh磷酸鐵鋰電，馬力455ps，扭力520Nm，0-100km/h加速5.6秒，WLTP續航力482km。對比舊版分別提升34ps與80Nm，0-100km/h快了0.4秒，續航程里微添2km。現場展出是7X Plus（暗夜紫）和7X Platinum（星幕灰配黑頂），兩者皆搭載100kWh三元鋰電，前者馬力與扭力輸出跟入門7X一致，0-100km/h只需5.5秒，續航力627km是車系之冠，比舊版可多行12km。\n 旗艦雙馬達四驅7X Platinum擁有680ps和790Nm更強動力，同比舊版提升34ps與80Nm，0-100km/h由3.8秒縮短至3.7秒，續航力也微増2km至545km。受惠800V高壓平台，最高支援DC 450kW直流快速，最快10.5分鐘充電80%。此外，智能氣壓懸掛連CCD電磁減震控制是Platinum版專屬，能自動掃描路面和即時調整吸震軟硬度，可升高降低車身70mm。\n 7X Plus規格\n 傳動：100kWh三元鋰電 + 後置驅動馬達\n 馬力/扭力：455ps / 520Nm\n 0至100km/h：5.5秒\n 續航力：627km(WLTP)\n 尺碼：4,800 x 1,920 x 1,650mm\n 售價：$469,900起(早鳥優惠)\n 查詢：2111 1009\n\n 7X Platinum規格\n 傳動：100kWh三元鋰電 + 前後馬達四驅\n 馬力/扭力：680ps / 790Nm\n 0至100km/h：3.7秒\n 續航力：545km(WLTP)\n 尺碼：4,800 x 1,920 x 1,650mm\n 售價：$519,900起(早鳥優惠)\n 查詢：2111 1009","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7b18573e0d","title":"深圳灣東濱隧道多車相撞 涉粵港兩地牌貨車 橙色林寶堅尼SUV車頭重創","url":"https://www.stheadline.com/breaking-news/3639082/深圳灣東濱隧道多車相撞-涉粵港兩地牌貨車-橙色林寶堅尼SUV車頭重創","summary":"深圳灣東濱隧道發生多車相撞事故。","summary_short":"深圳灣東濱隧道發生多車相撞事故。","digest":"深圳灣東濱隧道發生多車相撞事故","points":["深圳灣東濱隧道發生多車相撞事故","周四（19日）網上流傳影片顯示，隧道內有多輛車輛相撞，當中包括多輛粵港兩地牌貨車…","橙色林寶堅尼橫亘路面 車頭蓋扭曲泵把脫落"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:19:40+08:00","size":1,"keywords":[],"body":"深圳灣東濱隧道發生多車相撞事故。周四（19日）網上流傳影片顯示，隧道內有多輛車輛相撞，當中包括多輛粵港兩地牌貨車，現場一片凌亂。\n橙色林寶堅尼橫亘路面 車頭蓋扭曲泵把脫落\n網傳片段可見，「車陣」之中有一輛橙色林寶堅尼Urus SUV橫亘路面，其車頭損毀嚴重，車頭蓋扭曲摺起，泵把脫落，車身碎片散落一地。\n有目擊者在拍片時形容，涉事林寶堅尼「前後都扁晒」，同時指另一輛黑色私家車同樣「扁晒」。\n網民戲稱「公司三文治」 \n車禍片段在網上流傳後引起網民熱議。有人以食物戲謔被夾在車陣中的林寶堅尼變成「公司三文治」，亦有人笑稱「咦，蛋牛治喎！」。\n此外，不少網民亦在留言區揣測意外成因，有人直言「個個咁CUT線遲早嘅事」，亦有人質疑「乜料呀？直路都炒到咁？」，亦有網民留意車身狀況稱「林寶冇爛呀，非常硬！」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c733f2ae37b","title":"山頂盧吉道男子疑醉酒失足跌落斜坡 途人發現報警送院","url":"https://www.stheadline.com/breaking-news/3639061/山頂盧吉道男子疑醉酒失足跌落斜坡-途人發現報警送院","summary":"山頂盧吉道發生有人墮坡事件。","summary_short":"山頂盧吉道發生有人墮坡事件。","digest":"山頂盧吉道發生有人墮坡事件","points":["山頂盧吉道發生有人墮坡事件","周四（19日）10時32分，一名女子報案，指一名男子由欄杆跌落斜坡","持香港身份證印裔男疑踩欄杆飲酒失足 據悉，涉事男子持香港身份證，為印裔人士"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:04:28+08:00","size":1,"keywords":[],"body":"山頂盧吉道發生有人墮坡事件。周四（19日）10時32分，一名女子報案，指一名男子由欄杆跌落斜坡。 持香港身份證印裔男疑踩欄杆飲酒失足 據悉，涉事男子持香港身份證，為印裔人士。他懷疑在盧吉道一個欄杆位置踩上欄杆飲酒，醉酒後失足，跌落約兩米下的行人路。 男事主其後在行人路上被途人發現，途人隨即報警求助。警方及救護人員接報趕抵現場，發現男子清醒能行走，惟面部有擦傷，其後由救護車送院治理。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c387ad7aefc","title":"油麻地上海街47歲尼裔漢暈倒 當場證實不治","url":"https://www.stheadline.com/breaking-news/3639148/油麻地上海街47歲尼裔漢暈倒-當場證實不治","summary":"油麻地發生猝死事件。","summary_short":"油麻地發生猝死事件。","digest":"油麻地發生猝死事件","points":["今日（20日）凌晨1時許，一名47歲男子在上海街251號對開街頭突然暈倒，同行朋友見狀報案","救護員接報趕抵現場，證實事主當場死亡，死因有待驗屍後確定","男事主為尼泊爾裔，持有香港身分證，事發前曾感到身體不適"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:03:07+08:00","size":1,"keywords":[],"body":"油麻地發生猝死事件。今日（20日）凌晨1時許，一名47歲男子在上海街251號對開街頭突然暈倒，同行朋友見狀報案。救護員接報趕抵現場，證實事主當場死亡，死因有待驗屍後確定。 據了解，男事主為尼泊爾裔，持有香港身分證，事發前曾感到身體不適。警方正跟進事件，確實死因有待法醫驗屍後進一步確認。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf6760c393c","title":"長沙灣海麗邨49歲男住戶暈倒 昏迷送院搶救","url":"https://www.stheadline.com/breaking-news/3639134/長沙灣海麗邨49歲男住戶暈倒-昏迷送院搶救","summary":"長沙灣海麗邨發生有人暈倒事件。","summary_short":"長沙灣海麗邨發生有人暈倒事件。","digest":"長沙灣海麗邨發生有人暈倒事件","points":["長沙灣海麗邨發生有人暈倒事件","周四（19日）8時許，一名49歲姓鄭男子在海麗邨海賢樓寓所內突然暈倒，其兒子見狀隨即報案求助","救護員接報趕抵現場，發現事主陷入昏迷，隨即將其送往明愛醫院搶救"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:20:36+08:00","size":1,"keywords":[],"body":"長沙灣海麗邨發生有人暈倒事件。周四（19日）8時許，一名49歲姓鄭男子在海麗邨海賢樓寓所內突然暈倒，其兒子見狀隨即報案求助。 救護員接報趕抵現場，發現事主陷入昏迷，隨即將其送往明愛醫院搶救。 據悉，事主有身體病紀錄。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":37,"items":[{"id":"ce6c9e8a3a5","title":"江苏提出到2030年基本实现交通运输现代化","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735232.shtml","summary":"中新网南京11月20日电 (记者 徐珊珊)11月19日，江苏省政府召开新闻发布会，解读近日印发的《江苏省“十五五”综合交通运输体系发展规划》(简称《规划》)。","summary_short":"中新网南京11月20日电 (记者 徐珊珊)11月19日，江苏省政府召开新闻发布会…","digest":"11月19日，江苏省政府召开新闻发布会…","points":["中新网南京11月20日电 (记者 徐珊珊)11月19日，江苏省政府召开新闻发布会…","到2035年，总体达到世界发达国家水平","到2030年，全省高速铁路里程将达到3600公里，基本实现各设区市间2小时内通达"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:49:30+08:00","size":1,"keywords":[],"body":"中新网南京11月20日电 (记者 徐珊珊)11月19日，江苏省政府召开新闻发布会，解读近日印发的《江苏省“十五五”综合交通运输体系发展规划》(简称《规划》)。《规划》明确，到2030年，江苏基本实现交通运输现代化，总体发展水平居全国前列；到2035年，总体达到世界发达国家水平。\r\n\n　　围绕建设现代化综合立体交通网络，《规划》提出加快构建全省“六纵六横”高铁通道。到2030年，全省高速铁路里程将达到3600公里，基本实现各设区市间2小时内通达。随着北沿江高铁和盐泰锡常宜铁路的建成通车，泰州将迈入高铁时代，从而实现全省设区市高铁全覆盖。同时，江苏将加快过江通道建设，累计建成28座过江通道。2028年张靖皋过江通道建成后，张家港、靖江、如皋三市间的过江时间将由约40分钟大幅缩短至约10分钟。\n\n　　在推动交通物流降本提质增效方面，江苏将强化海港、陆港、空港、信息港四港联动，培育60条以上多式联运精品线路；强化国际货运服务能力，如今年新增的“南京—奥斯陆”全货机航线，让挪威三文鱼得以极速送达全省商超与餐饮门店。\n\n　　在优化出行服务方面，江苏将打造“苏心随行”服务品牌，推动省内都市圈具备1小时通勤条件的人口覆盖率达75%。为便利游客出行，全省主要客运枢纽将实现小微型客车租赁服务全覆盖，游客抵达高铁站或机场后即可就近取车、异地还车，旅行安排更加灵活。(完) 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c60e0bb3fa5","title":"泰州海归青年老街卖早茶：守住老味道 开辟新赛道","url":"https://www.chinanews.com.cn/hr/2026/11-20/10735217.shtml","summary":"中新网泰州11月20日电 题：泰州海归青年老街卖早茶：守住老味道 开辟新赛道  　　记者 常慕城  　　清晨时分，泰州市海陵区涵西街烟火渐盛。","summary_short":"中新网泰州11月20日电 题：泰州海归青年老街卖早茶：守住老味道 开辟新赛道  　　记者 常慕城  　　清晨时分…","digest":"题：泰州海归青年老街卖早茶：守住老味道 开辟新赛道  　　记者 常慕城  　　清晨时…","points":["清晨时分，泰州市海陵区涵西街烟火渐盛","2024年起，“老泰州”餐饮创始人马龙飞，将店铺交由儿子马兆龙接手运营，主打正宗泰州本土早茶","很少有人知晓，这家地道泰州早茶店的主理人马兆龙，是一名英国知名高校海归硕士"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:41:24+08:00","size":1,"keywords":[],"body":"中新网泰州11月20日电 题：泰州海归青年老街卖早茶：守住老味道 开辟新赛道\n\n　　记者 常慕城\n\n　　清晨时分，泰州市海陵区涵西街烟火渐盛。袅袅热气从沿街的“老泰州”店铺升腾而起，蟹黄包、烫干丝、鱼汤面的鲜香萦绕街巷，氤氲出地道的泰州市井烟火。\n\n　　涵西街因水运繁华而起，是泰州家喻户晓的历史文化街区，也是当地早茶文化的重要发源地之一。2024年起，“老泰州”餐饮创始人马龙飞，将店铺交由儿子马兆龙接手运营，主打正宗泰州本土早茶。\n\n老板下厨。受访者供图\n\n　　很少有人知晓，这家地道泰州早茶店的主理人马兆龙，是一名英国知名高校海归硕士。多年的海外求学与生活经历，让马兆龙见识了西式快餐的标准化运营模式，也让他愈发眷恋家乡独树一帜的早茶文化。\n\n　　“比起写字楼朝九晚五的安稳生活，我更想守住老街烟火，把家乡的老味道好好传承下去。”马兆龙如是说。从小热爱烹饪的马兆龙，留学期间常在宿舍自制家乡美食，与海外友人分享泰州味道。在他眼中，早茶已不只是一顿简单的晨间餐食，更是承载城市记忆的独特文脉。\n\n烫干丝。中新网记者 常慕城 摄\n\n　　这两年，马兆龙潜心钻研传统烹饪技艺，熟练掌握蟹黄包、秧草包、烫干丝、鱼汤面等经典早茶菜品的制作精髓，深入挖掘泰州早茶依托盐商文化发展的百年历史底蕴。经营过程中，他始终坚守传统手工工艺，坚持所有食材当日采购、当日现做、现蒸现卖，牢牢守住泰州早茶的本来味道。\n\n　　凭借在海外所学的现代化商业运营理念，马兆龙打破传统老店的经营思维，为老牌早茶店开辟全新发展赛道。针对老街传统餐饮客源单一、传播受限的经营痛点，他搭建全方位线上传播矩阵，通过短视频、直播、外卖平台多渠道拓宽销路。同时针对性改良外卖包装与配送工艺，有效解决烫干丝、面食在运输过程中口感变差、风味流失的难题，让藏于老街的泰州早茶走出深巷、走向全网。\n\n守住老味道。受访者供图\n\n　　除此之外，他兼顾中老年顾客与年轻顾客的不同需求，适度延长营业时间，延续泰州早茶不疾不徐的特色，完整保留早茶独有的松弛氛围。\n\n　　“很多年轻人不肯从事餐饮行业，不是因为没面子，最主要还是感觉没前途。”深耕餐饮行业近四十年的马龙飞说，技艺需要传承，泰州早茶更需要年轻一代的接力。如今，经过马兆龙的匠心坚守与创新经营，这家老街“老泰州”早茶店人气稳步攀升，不仅牢牢留住了大批本地资深食客，更吸引了各地游客慕名前来打卡。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf6e2d2dd06","title":"兩內地女遊港蹲地2秒即遭勸阻 傳罰500元惹雙標爭議｜有片","url":"https://www.stheadline.com/realtime-china/3639206/兩內地女遊港蹲地2秒即遭勸阻-傳罰500元惹雙標爭議有片","summary":"兩地文化差異再掀熱議！","summary_short":"兩地文化差異再掀熱議！","digest":"兩地文化差異再掀熱議","points":["兩名內地女旅客近日發片分享遊港經歷，指當日行街逾1.5萬步後因疲累在通道蹲下休息…","片段衝上微博熱搜，有內地網民質疑針對內地旅客，惟查實本港法例並無禁止蹲下規定","綜合微博消息及內媒報道，兩名內地女博主近日在社交平台發布短片，分享來港旅遊期間的經歷"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:30:44+08:00","size":1,"keywords":[],"body":"兩地文化差異再掀熱議！兩名內地女旅客近日發片分享遊港經歷，指當日行街逾1.5萬步後因疲累在通道蹲下休息，豈料僅蹲2秒即遭職員勸阻，更稱網傳違者會被罰款500港元。片段衝上微博熱搜，有內地網民質疑針對內地旅客，惟查實本港法例並無禁止蹲下規定。\n疑似商場保安勸喻\n綜合微博消息及內媒報道，兩名內地女博主近日在社交平台發布短片，分享來港旅遊期間的經歷。兩人表示當日逛街步行超過1.5萬步，因雙腿疲累且途中找不到座位休息，便順勢在商場及街頭通道蹲下歇腳。\n她們坦言起初並不相信網上流傳「香港不能隨便蹲地」的說法，不料剛蹲下短短2秒，隨即有疑似保安員上前出言提醒「不要蹲在地上」，其中一名女博主更指聽說在香港禁止蹲坐、違者或面臨500港元罰款，令兩人當場呆在原地。\n中港網民爆爭議\n相關片段被轉發至微博後迅速發酵，一度衝上熱搜榜第一位。不少內地網民在評論區質疑執法與待客存在「雙重標準」，指曾在香港公共場所見過外籍遊客或外傭席地而坐甚至躺臥卻無人干預，認為內地遊客短暫蹲下即被喝止是「針對說普通話的人」；亦有人聲稱曾在港蹲地被提醒會罰款500元。\n港法例無禁街頭蹲下\n不過事件同時引來大批本港網民反駁，力撐現場職員盡責維持秩序。不少港人指出，香港商場及街道空間普遍狹窄、人流極為密集，在通道突然蹲下不僅影響市容，更容易阻礙行人通行甚至絆倒他人，反問「點解善意提點會被當成針對？」\n而針對網傳「蹲地罰款500港元」的說法，查實香港目前並無任何明文法例全面禁止市民或旅客在一般公眾地方或街道蹲下；商場保安員上前勸喻，僅屬場所內部管理安排，旨在維持通道暢通及公共安全，並非施加法定處罰，部分旅客疑將亂拋垃圾、隨地吐痰或《香港鐵路附例》規管範圍與一般街道混為一談。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0ed2535ff6","title":"铜陵化学工业集团有限公司原党委委员、副总经理李霞严重违纪违法被开除党籍","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735179.shtml","summary":"中新网11月20日电 据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准，铜陵市纪委监委对铜陵化学工业集团有限公司原党委委员、副总经理李霞严重违纪违法问题进行了立案审查调查。","summary_short":"中新网11月20日电 据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准…","digest":"据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准…","points":["中新网11月20日电 据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准…","经查，李霞丧失理想信念，背弃初心使命，利用国有企业财务管理职权搞权力寻租，攫取经济利益…","违反组织原则，在组织谈话时不如实说明问题"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T14:16:43+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准，铜陵市纪委监委对铜陵化学工业集团有限公司原党委委员、副总经理李霞严重违纪违法问题进行了立案审查调查。\n\n　　经查，李霞丧失理想信念，背弃初心使命，利用国有企业财务管理职权搞权力寻租，攫取经济利益，无视中央八项规定精神，接受旅游活动安排；违反组织原则，在组织谈话时不如实说明问题；廉洁底线失守，违规收受礼金、消费卡，违规从事营利活动，违规兼职取酬，重复领取奖金；利用职务便利为他人在资金拆借、理财购买、工程款结算、贷款结算、公款存放等方面谋取利益，并非法收受巨额财物。\n\n　　李霞严重违反党的组织纪律、廉洁纪律，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经铜陵市纪委常委会会议研究并报市委批准，决定给予李霞开除党籍处分；按规定取消其享受的待遇；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。\n\n 【编辑:刘湃】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd4a238f860","title":"（深圳APEC）海外侨胞关注APEC会议：凝聚合作共识 共促亚太繁荣","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735124.shtml","summary":"中新社深圳11月20日电 (记者 门睿 吴侃)2026年亚太经合组织(APEC)领导人会议周受到世界瞩目。","summary_short":"中新社深圳11月20日电 (记者 门睿 吴侃)2026年亚太经合组织(APEC)领导人会议周受到世界瞩目。","digest":"2026年亚太经合组织(APEC)领导人会议周受到世界瞩目","points":["中新社深圳11月20日电 (记者 门睿 吴侃)2026年亚太经合组织(APEC)领导人会议周…","多位海外侨胞接受中新社记者连线采访时表示，APEC会议为建设亚太共同体汇聚合力…","美国华商会会长邓龙表示，习近平主席在APEC工商领导人峰会上的主旨演讲中提到…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T13:56:50+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 门睿 吴侃)2026年亚太经合组织(APEC)领导人会议周受到世界瞩目。多位海外侨胞接受中新社记者连线采访时表示，APEC会议为建设亚太共同体汇聚合力，期待各方以务实合作促进共同繁荣。\r\n\n　　美国华商会会长邓龙表示，习近平主席在APEC工商领导人峰会上的主旨演讲中提到，“十五五”规划是“中国面向全球工商界发出的合作邀约”。从超大规模的开放市场到前景广阔的发展空间，再到互促共进的合作环境，这份邀约展现了不断扩展的机遇清单。海外华商可依托跨国商贸网络，围绕产业转型升级，推动技术、资金和人才等创新要素高效对接，在更深层次的国际经贸合作中发挥桥梁作用。\n\n　　中国-巴布亚新几内亚友好联合会主席林华农说，习近平主席在APEC第三十三次领导人非正式会议上的讲话中提到“夯实发展支柱”。发展是亚太各经济体的共同关切，从推动区域能源和粮食安全合作到拓展绿色低碳合作，再到促进就业和职业技能开发，中方这些主张着眼于亚太地区的长远发展，也让发展成果惠及更多民众。\n\n　　俄罗斯浙江华侨华人联合总会会长蔡建林关注《2026年亚太经合组织工商领导人峰会深圳倡议》中“深化‘人工智能+’合作”“提升跨境二维码支付互操作性”等表述。“这些举措回应了中小微企业应用新技术和开展跨境经营的需求，也关乎民众的日常生活。期待倡议落实，让更多企业和民众共享亚太开放合作与创新发展成果。”\n\n　　“《亚太经合组织领导人深圳展望》提出‘推进亚太区域经济一体化’‘继续促进贸易便利化’‘发挥新兴技术对贸易的促进作用’等重点内容，回应了当前国际贸易发展的现实需求。”新西兰中国国际贸易促进委员会会长和志耘表示，这些举措有助于降低企业跨境经营成本，提高跨境贸易效率，进一步释放亚太经贸合作潜力。\n\n　　智利华商联合总会永久名誉会长王何兴关注《亚太经合组织互联互通蓝图》。他说，从智利果园到中国百姓餐桌，车厘子的跨洋之旅也是亚太互联互通的缩影。交通和数字网络的延伸让各国市场紧密相连，政策协调和规则对接让商品更顺畅地跨境流动。华商身处中外交往交流前沿，可以促进跨境供应链协作，助力亚太互联互通持续升级。\n\n　　泰国华商中心主任刘少毅表示，从推进亚太共同体建设重大举措，再到涵盖经贸、联通、创新、发展的务实合作成果，此次深圳盛会成果既有方向指引，又有举措落地，展现出各成员经济体携手应对挑战、深化互利合作的共同意愿。期待各方将合作共识转化为实际行动，携手推动亚太共同繁荣。(完) 【编辑:惠小东】","image":"","video":"","video_poster":"","lang":"zh
