想来等国内头部量贩零食品牌建立深度战略合作关系。\n\n根据财报，截至今年上半年，鸣鸣很忙、万辰两大头部集团的量贩零食店数量已经合计超过了5万家。\n\n这背后与食品公司既要依赖逐渐膨胀的零食量贩渠道，同时又要稳住原有价盘和经销商体系有关。\n\n“如果直接给零食量贩和商超卖完全同款同规格通货，由于量贩是直采模式，不需要多层经销商，终端售价天然比商超低20%-40%，就会出现大量窜货。”一个在华北市场多年从事食品和饮料经销的人士对界面新闻表示。因为如果商品没有做渠道划分，就会有经销商、黄牛从量贩店进货，倒流回普通的商超、小卖店，从而冲击原有的流通价盘和经销商体系。\n\n零食量贩店的生存逻辑是低毛利、高周转和靠低价引流，因此食品大公司往往会通过渠道定制款的方式，缩小规格、调整配方和包装成本，做出“标价更低、适合量贩引流”的单品。这也导致单品挂牌价看起来便宜，但单位克重毛利可以被品牌重新设计，不至于全盘让利。\n\n在三季度财报会的电话会问答中，好丽友管理层提到，零食折扣店属于高周转、低毛利结构，因此用专属小包装做SKU区隔，前置向经销商发放激励，推进进店扩张。在中国会优先攻坚中南部区域市场。\n\n对于产品本身已经难做到颠覆性创新的食品公司来说，放下身段与零食量贩店积极合作，并从组织结构变化应对快速的渠道变化，在中国广阔的下沉市场寻求增量，可能已经是为数不多的机会。\n\n界面新闻注意到，不只是好丽友，包括亿滋、百事、费列罗、玛氏、雀巢等外资食品巨头也在把资源向零食量贩倾斜。比如亿滋大中华区在今年11月进行了内部组织调整，为鸣鸣很忙单设了一支客户团队，万辰和零食有鸣则由另一支团队对接。与此同时，原零食连锁商贸计划团队并入全国商贸计划团队。就在今年3月，这家公司才刚刚把零食店业务从新零售发展团队中独立出来。\n\n对于好丽友来说，为了适应更大范围的市场下沉，将资源倾斜给增长更快的品类也是策略的一环。\n\n薯类零食成为好丽友在中国重点押注的品类。\n\n根据好丽友相关披露信息，自今年起薯类零食产品线的增长主导整体业绩改善。中国市场上半年薯类零食整体销售额为3230亿韩元（约合16亿元人民币），同比增长27%；好友趣增长52%，呀！土豆增长17%，维持稳定基本盘。\n\n好丽友的呀！土豆产品 图片拍摄：界面新闻 马越\r\n\n截至9月，好友趣在中国销售额超过2000亿韩元（约10亿元人民币），也成为了继呀！土豆之后，好丽友在中国第二个年销10亿元单品。不过值得注意的是，“10亿元”单品的统计口径，并未包括好丽友在中国的基本盘巧克力派。\n\n销量大涨的背后，好丽友决定在中国增加薯片的产能。\n\n界面新闻在三季度财报中获悉，好友趣产线利用率已经超过150%，难以匹配市场需求。于是公司计划到2027年在中国新增3条产线，将薯类零食产能提升约90%。\n\n好丽友的好有趣产品 图片拍摄：界面新闻 马越\r\n\n界面新闻注意到，廊坊经济技术开发区管委10月公示的环评文件显示，好丽友膨化工厂建设项目总投资15000万元，其中环保投1300万元，建设好友趣膨化生产线1条，年产528万箱。不过廊坊工厂本身就是好丽友在全球最大、品类最齐全的生产基地之一，从1995年建立至今有30多年历史，是年产能超过50亿元的超级工厂。\n\n11月18日，好丽友中国则向界面新闻证实了要在廊坊新建生产线的消息。\n\n薯片、薯条这类零食，属于休闲零食里的大刚需赛道，消费人群广、冲动消费属性强，而在遍布县域市场的零食店里，人们也最容易见到这类产品。好丽友国内流通渠道正在向零食量贩、即时零售倾斜，刚好能匹配好友趣、呀！土豆这类走量型膨化产品。\n\n但这个赛道内卷的压力同样突出。乐事长期占据中国市场薯片赛道龙头，而市面上也有更多本土低价白牌参与竞争。对比本土品牌，好丽友的优势在于品质稳定性以及全国经销商网络。\n\n好丽友管理层在近期三季度电话会上提到，薯类零食前期设备投入压力大，但随着规模扩大会显现成本杠杆。现阶段因为新产线投入、渠道促销费用投放，利润率仍低于派类。\n\n不过叠加健康消费趋势对油炸膨化品类的长期约束，好丽友薯类业务正处在拿到增量但持续让利的阶段，它的销量增长能否转化为利润改善，也取决于后续新品迭代、健康化升级以及渠道博弈的平衡能力。\n\n未经正式授权严禁转载本文，侵权必究。消费热新闻\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n好丽友在县城零食店拿到“大结果”\n\n实际上好丽友在中国能重回增长，一个重要的驱动是渠道上的变化——它押宝了遍布县域市场的零食量贩店。\n\n原创新闻马越 · 2026/11/20 14:21来源：界面新闻\n\n好丽友派 图片拍摄：界面新闻 马越\n\n界面新闻记者 | 马越\n界面新闻编辑 | 牙韩翔\n\n好丽友在中国市场的数万家零食量贩店里找到新增长点。\n\n界面新闻查阅好丽友近期公布的2026年三季度财报发现，其中国市场中国区营收达到3840亿韩元（约合19.20亿元），同比增长13.8%，占集团当季营收的40.9%，营业利润为732亿韩元（约合3.66亿元），同比增长9.3%。\n\n财报中强调，中国作为好丽友的最大单一市场，拉动集团增长。对比来看，2025年中国业务增长乏力，好丽友在中国区营收达到13207亿韩元（约合62.47亿元人民币），同比增长4.0%，营业利润为2417亿韩元（约合11.43亿元人民币），同比下滑0.9%。\n\n实际上好丽友在中国能重回增长，一个重要的驱动是渠道上的变化——它押宝了遍布县域市场的零食量贩店。\n\n好想来货架上的好丽友果滋果心产品 图片拍摄：界面新闻 马越\r\n\n好丽友强调，为了顺应中国流通环境变化，降低对传统大卖场的依赖，资源重新向零食折扣店、电商、便利店、即时配送渠道倾斜。好丽友也开发了渠道专属规格、小包装、限定商品，并且管控渠道间价格冲突，并将零食折扣店培育为核心增长渠道。\n\n界面新闻走访北京位于五环外的几家好想来发现，货架上出售包括好丽友派、呀！土豆、好有趣、果滋果心等多款产品，其中糖果类的果滋果心是单独的小规格包装用于称重售卖，价格为每500克19.8元。其他产品也有不同程度的会员价折扣。\n\n界面新闻获悉，好丽友近年推出不少专供零食量贩的产品，比如橙子、桃桃、莓果、奶茶四种口味的散称派类；区别于常规商超104g规格的、更小规格88g的薯愿等等。好丽友也已经和赵一鸣、零食很忙、好想来等国内头部量贩零食品牌建立深度战略合作关系。\n\n根据财报，截至今年上半年，鸣鸣很忙、万辰两大头部集团的量贩零食店数量已经合计超过了5万家。\n\n这背后与食品公司既要依赖逐渐膨胀的零食量贩渠道，同时又要稳住原有价盘和经销商体系有关。\n\n“如果直接给零食量贩和商超卖完全同款同规格通货，由于量贩是直采模式，不需要多层经销商，终端售价天然比商超低20%-40%，就会出现大量窜货。”一个在华北市场多年从事食品和饮料经销的人士对界面新闻表示。因为如果商品没有做渠道划分，就会有经销商、黄牛从量贩店进货，倒流回普通的商超、小卖店，从而冲击原有的流通价盘和经销商体系。\n\n零食量贩店的生存逻辑是低毛利、高周转和靠低价引流，因此食品大公司往往会通过渠道定制款的方式，缩小规格、调整配方和包装成本，做出“标价更低、适合量贩引流”的单品。这也导致单品挂牌价看起来便宜，但单位克重毛利可以被品牌重新设计，不至于全盘让利。\n\n在三季度财报会的电话会问答中，好丽友管理层提到，零食折扣店属于高周转、低毛利结构，因此用专属小包装做SKU区隔，前置向经销商发放激励，推进进店扩张。在中国会优先攻坚中南部区域市场。\n\n对于产品本身已经难做到颠覆性创新的食品公司来说，放下身段与零食量贩店积极合作，并从组织结构变化应对快速的渠道变化，在中国广阔的下沉市场寻求增量，可能已经是为数不多的机会。\n\n界面新闻注意到，不只是好丽友，包括亿滋、百事、费列罗、玛氏、雀巢等外资食品巨头也在把资源向零食量贩倾斜。比如亿滋大中华区在今年11月进行了内部组织调整，为鸣鸣很忙单设了一支客户团队，万辰和零食有鸣则由另一支团队对接。与此同时，原零食连锁商贸计划团队并入全国商贸计划团队。就在今年3月，这家公司才刚刚把零食店业务从新零售发展团队中独立出来。\n\n对于好丽友来说，为了适应更大范围的市场下沉，将资源倾斜给增长更快的品类也是策略的一环。\n\n薯类零食成为好丽友在中国重点押注的品类。\n\n根据好丽友相关披露信息，自今年起薯类零食产品线的增长主导整体业绩改善。中国市场上半年薯类零食整体销售额为3230亿韩元（约合16亿元人民币），同比增长27%；好友趣增长52%，呀！土豆增长17%，维持稳定基本盘。\n\n好丽友的呀！土豆产品 图片拍摄：界面新闻 马越\r\n\n截至9月，好友趣在中国销售额超过2000亿韩元（约10亿元人民币），也成为了继呀！土豆之后，好丽友在中国第二个年销10亿元单品。不过值得注意的是，“10亿元”单品的统计口径，并未包括好丽友在中国的基本盘巧克力派。\n\n销量大涨的背后，好丽友决定在中国增加薯片的产能。\n\n界面新闻在三季度财报中获悉，好友趣产线利用率已经超过150%，难以匹配市场需求。于是公司计划到2027年在中国新增3条产线，将薯类零食产能提升约90%。\n\n好丽友的好有趣产品 图片拍摄：界面新闻 马越\r\n\n界面新闻注意到，廊坊经济技术开发区管委10月公示的环评文件显示，好丽友膨化工厂建设项目总投资15000万元，其中环保投1300万元，建设好友趣膨化生产线1条，年产528万箱。不过廊坊工厂本身就是好丽友在全球最大、品类最齐全的生产基地之一，从1995年建立至今有30多年历史，是年产能超过50亿元的超级工厂。\n\n11月18日，好丽友中国则向界面新闻证实了要在廊坊新建生产线的消息。\n\n薯片、薯条这类零食，属于休闲零食里的大刚需赛道，消费人群广、冲动消费属性强，而在遍布县域市场的零食店里，人们也最容易见到这类产品。好丽友国内流通渠道正在向零食量贩、即时零售倾斜，刚好能匹配好友趣、呀！土豆这类走量型膨化产品。\n\n但这个赛道内卷的压力同样突出。乐事长期占据中国市场薯片赛道龙头，而市面上也有更多本土低价白牌参与竞争。对比本土品牌，好丽友的优势在于品质稳定性以及全国经销商网络。\n\n好丽友管理层在近期三季度电话会上提到，薯类零食前期设备投入压力大，但随着规模扩大会显现成本杠杆。现阶段因为新产线投入、渠道促销费用投放，利润率仍低于派类。\n\n不过叠加健康消费趋势对油炸膨化品类的长期约束，好丽友薯类业务正处在拿到增量但持续让利的阶段，它的销量增长能否转化为利润改善，也取决于后续新品迭代、健康化升级以及渠道博弈的平衡能力。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6353e733d7","title":"阿里巴巴遭股東入稟指控欺詐 稱隱瞞與黃樂關係 CEO吳泳銘同列被告","url":"https://www.stheadline.com/stock-market/3639263/阿里巴巴遭股東入稟指控欺詐-稱隱瞞與黃樂關係-CEO吳泳銘同列被告","summary":"據路透報道，阿里巴巴（9988）被美國股東起訴，指控隱瞞了與一名涉嫌為中國間諜、Megaspeed前高層黃樂（Alice Huang）的關係，涉嫌欺詐。","summary_short":"據路透報道，阿里巴巴（9988）被美國股東起訴，指控隱瞞了與一名涉嫌為中國間諜…","digest":"據路透報道，阿里巴巴被美國股東起訴，指控隱瞞了與一名涉嫌為中國間諜…","points":["據路透報道，阿里巴巴（9988）被美國股東起訴，指控隱瞞了與一名涉嫌為中國間諜…","阿里巴巴行政總裁吳泳銘同樣被列為本案被告","報道根據向曼哈頓聯邦法院提交的一項擬議集體訴訟提案，指阿里巴巴在2024年…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:20:11+08:00","size":1,"keywords":[],"body":"據路透報道，阿里巴巴（9988）被美國股東起訴，指控隱瞞了與一名涉嫌為中國間諜、Megaspeed前高層黃樂（Alice Huang）的關係，涉嫌欺詐。阿里巴巴行政總裁吳泳銘同樣被列為本案被告。\n指年報低估出口管制風險\n報道根據向曼哈頓聯邦法院提交的一項擬議集體訴訟提案，指阿里巴巴在2024年、2025年及2026年的年報中，涉嫌故意且實質性地低估了「實際或涉嫌違反出口管制行為可能損害其業務」的風險，從而人為推高了其股價。\n股東在起訴書中特別點出了阿里巴巴與新加坡公司Megaspeed的關係。Megaspeed被指協助中國獲取Nvidia（輝達、又稱英偉達）先進的AI晶片，而該公司的高層黃樂與Nvidia前行政總裁黃仁勳曾存在某種親密關係。\n入稟的股東表示，由於媒體披露了阿里巴巴與黃樂及Megaspeed的關聯，包括報道指阿里巴巴已成為Megaspeed的「主導性」客戶，導致阿里巴巴股價在上周的四個交易日內累計下挫14%。\n阿里巴巴公佈上季業績後股價造好，最新升3.5%報83.4元。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc41308fa7f","title":"Anthropic躍升全球第12大市值企業 市場質疑收入能否支撐高估值","url":"https://news.tvb.com/tc/1207420-Anthropic躍升全球第12大市值企業市場質疑收入能否支撐高估值","summary":"美國人工智能公司Anthropic於納斯達克掛牌，躍升為全球第12大市值企業。市場關注抽走大量資金，觸發股市調整，又質疑公司收入能否支撐高估值。","summary_short":"美國人工智能公司Anthropic於納斯達克掛牌，躍升為全球第12大市值企業。","digest":"美國人工智能公司Anthropic於納斯達克掛牌，躍升為全球第12大市值企業","points":["美國人工智能公司Anthropic於納斯達克掛牌，躍升為全球第12大市值企業","市場關注抽走大量資金，觸發股市調整，又質疑公司收入能否支撐高估值","開發聊天機械人Claude的Anthropic，以招股價每股83美元上市…"],"section":"財經","category":"財經","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T13:54+08:00","size":1,"keywords":[],"body":"美國人工智能公司Anthropic於納斯達克掛牌，躍升為全球第12大市值企業。市場關注抽走大量資金，觸發股市調整，又質疑公司收入能否支撐高估值。\n\n開發聊天機械人Claude的Anthropic，以招股價每股83美元上市，公開集資額達813億美元，連同私募配售合共籌集逾1,070億美元，刷新全球史上最大新股集資紀錄。\n\n股份開報111.5美元，一度急升三成四，收市報97.17美元，仍高於招股價逾百分之17。按首日表現計，Anthropic隨即躋身全球第12大市值上市公司，規模超越巴郡。若計及認股權等潛在發行股份，市值更高達1.8萬億美元，進佔全球十大。\n\nAnthropic認購反應熾熱，據報有約1,200名機構投資者認購，最終逾半落空。由高盛及摩根士丹利牽頭的22間承銷銀行，更獲得共5.5億美元承銷費，打破年中SpaceX上市時紀錄。不過，Anthropic上市並無惠及大市，美股三大指數周四全線下挫，跌幅均逾百分之2。\n\n元宇證券基金經理莫灝楠指出：「有一大堆基金被迫要買，也可能將來很快納入指數，因規模很大。而估值當然很誇張，但估值究竟有多少『水分』？上市後利潤也知道跟不上，變相有較負面預期。如果資金這樣抽調時，或發覺連那些基本消費或公用股份也抽調過去。」\n\n英國《金融時報》指，公司要符合上市估值，年收入要高達6,000億美元，不過近期實際僅約800億美元。有報告也指，公司承擔逾9,000億美元算力開支承諾，未來五年，每年要增長四成七才能支撐估值。\n\n牽頭承銷的高盛也預期，受龐大算力基建開支拖累，預期Anthropic自由現金流要到2030年才有望轉正。","image":"https://pro-vod-cdn.tvb.com/6dda044a6ac5401ab89c412093ff6809/snapshots/85632abc60c64376b9839e77cac467ef-00008.jpg","video":"https://pro-vod-cdn.tvb.com/6dda044a6ac5401ab89c412093ff6809/463f3a1dfd184a07b57c2371862c493e-94069d39135e3f29ca8e841f40a1ae1d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/6dda044a6ac5401ab89c412093ff6809/snapshots/85632abc60c64376b9839e77cac467ef-00008.jpg","lang":"zh-Hant"}]},{"name":"生活","total":20,"items":[{"id":"ca19d21cc31","title":"寶珠｜線上看Disney+陸劇 代露娃與賴偉明上演殺豬女嫁落魄世子 劇情懶人包及5大必看亮點","url":"https://www.stheadline.com/film-drama/3638094/寶珠線上看Disney陸劇-代露娃與賴偉明上演殺豬女嫁落魄世子-劇情懶人包及5大必看亮點","summary":"寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Disney+和芒果TV播出，共24集。","summary_short":"寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Disney+和芒果TV播出，共24集。","digest":"寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Dis…","points":["寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Disney+…","故事講述兩位主角「先婚後愛、雙向救贖」的宅鬥權謀","下文將為您精心整理《寶珠》的追劇日曆、詳細劇情大綱、人物關係圖、主要角色介紹…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:42:57+08:00","size":1,"keywords":[],"body":"寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Disney+和芒果TV播出，共24集。故事講述兩位主角「先婚後愛、雙向救贖」的宅鬥權謀。下文將為您精心整理《寶珠》的追劇日曆、詳細劇情大綱、人物關係圖、主要角色介紹，以及5大必看亮點！\n追劇日曆\n劇情大綱\n人物關係圖\n角色介紹\n必看亮點\n《寶珠》追劇日曆\n《寶珠》追劇日曆公開！\n回到目錄\n《寶珠》詳細劇情大綱\n市井屠戶女金寶珠（代露娃 飾）為擺脫家人壓榨，主動嫁入漕運世家，給雙腿致殘、假裝自暴自棄的落魄嫡子謝硯（賴偉明 飾）做妾，並簽下3年婚約。金寶珠憑藉殺豬刀的氣勢與過人算帳能力震懾刁僕、整頓產業，更逼迫表面病弱的謝硯戒除藥癮、重拾生機。在過程中，二人由原本的針鋒相對，慢慢暗生情愫，最終合力洗刷謝硯的冤屈並化解家族危機，收穫圓滿愛情。\n《寶珠》可謂低開高走。\n回到目錄\n《寶珠》人物關係圖\n《寶珠》人物關係圖公開！\n回到目錄\n《寶珠》主要角色介紹\n金寶珠（代露娃 飾）\n金寶珠是一名出身市井屠戶家庭的潑辣少女，她性格果敢直率、精明貪財。在嫁入謝府做妾後，憑藉殺豬刀的氣勢與過人算帳本領整頓家業，在深宅中走出自己的路。\n代露娃飾金寶珠。\n謝硯（賴偉明 飾）\n謝硯是漕運世家謝氏的嫡子，昔日曾少年成名、恃才傲物。他在一場政敵構陷中雙腿致殘並背負污名，從此表面陰鬱病弱、沉迷藥癮與紈絝生活，實則心思縝密、暗藏鋒芒。\n賴偉明飾謝硯。\n崔景君（何洛洛 飾）\n崔景君 表面溫潤如玉、實則「白切黑」的神醫，他醫術高明且身分神秘。\n何洛洛飾崔景君。\n回到目錄\n《寶珠》5大必看亮點\n1. 代露娃首扛古裝大女主\n代露娃雖然在2020年便在電競青春劇《穿越火線》擔任女一號，並主演過現代甜寵劇《完美的他》，但人氣一直不鹹不淡。而令她人氣急升的代表作，多為是古裝劇的配角，例如《長相思》的阿念以及《白月梵星》的茯苓。《寶珠》是代露娃演藝生涯中第一部以女性角色為絕對核心的「古裝大女主」劇集，勢成其職業生涯的關鍵之作。\n代露娃首擔古裝劇大旗。\n2. 賴偉明首部男主作品\n賴偉明在2022年底正式出道，在多套熱播劇中出演重要配角和男二，累積不少人氣，包括在《大夢歸離》中飾演裴思恆，大晒古裝造型的可塑性、更憑着《驕陽似我》飾演讓人又愛又恨的莊序而人氣急升。他在不同的作品大晒多樣性，直到在《寶珠》才初次挑大樑擔綱男一號，他的表現絕對值得期待。\n賴偉明守得雲開見明月！\n3. 爆笑版「先婚後愛」\n雖然《寶珠》亦是以先婚後愛作為劇集的基調，但二人化身針鋒相對的歡喜冤家，為劇情增添不少趣味！在劇中，謝硯平生最討厭貪財庸俗之人，偏偏遇上凡事講求利益的金寶珠，二人成婚後每天互相試探、鬥嘴不斷，鬧得謝府雞犬不寧。但在相處後，二人敞開心扉，更出現男主角跪地立誓「此生只娶你一人」等高甜名場面，好笑得來又甜蜜。\n二人上演爆笑版先婚後愛。\n4. 兼備宅鬥與翻案\n《寶珠》並不是單純以宅鬥或者復仇為主線，而是兩者兼備。初入謝府的金寶珠面臨親戚虎視眈眈與權貴嘲諷時，以在市井練就的察言觀色與果敢作風見招拆招，充滿爽感。除此之外，劇情除了滿布笑點外亦有懸疑線，男女主角互補，聯手調查漕運舊案並挽救謝家危機。\n劇情設定吸睛。\n5. 幕後陣容不容小覷\n《寶珠》在開播後收穫不少好評，除了是演員的努力，以及高質的劇情外，更離不開優秀的幕後團隊！劇集由曾參與《以家人之名》及《九重紫》的導演郭鋒執導，擅長刻畫細膩的情感流動與家庭張力，總編劇魏菁菁，以及由芒果TV的「大芒計劃」羅盼團隊製作，絕對是誠意之作。\n回到目錄","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb38289a472","title":"TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學 黃劍文為貪食錯失8萬3被嘲「雞髀文」","url":"https://www.stheadline.com/film-drama/3639129/TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學-黃劍文為貪食錯失8萬3被嘲雞髀文","summary":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠，而與8萬3千簽帳額錯身而過，顏志恆與黃劍文合照，更拍拍他以示鼓勵。","summary_short":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠，而與8萬3千簽帳額錯身而過，顏志恆與黃劍文合照…","digest":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠…","points":["《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠…","顏志恒獨得台慶大獎超開心，他指參加台慶第3年，但每年都進入台慶大獎最後環節…","顏志恆稱身為爸爸，會好好運用讓兒子升學之用，也會買補品給老婆…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:15:53+08:00","size":3,"keywords":[],"body":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠，而與8萬3千簽帳額錯身而過，顏志恆與黃劍文合照，更拍拍他以示鼓勵。\n顏志恒第3年參加終中獎\n顏志恒獨得台慶大獎超開心，他指參加台慶第3年，但每年都進入台慶大獎最後環節，今次終於在「開口中」到贏得獎金這一步，談到有得獎運？顏志恒笑只有大家見到這些，從未中過六合彩。問到如何運用？顏志恆稱身為爸爸，會好好運用讓兒子升學之用，也會買補品給老婆，因她一直用心照顧他這個「大大仔」。\n肥媽開聲叫請食飯\n問會請《中》兄弟食飯？他笑言已被圍攻，要好多圍請盡《中》好幾季的家族，笑言肥媽也開聲叫請食飯。談到黃劍文錯失獎金，顏志恒笑言請他食20隻雞髀。\n顏志恒信《中5》換評審會變另一感覺\n至於有傳《中5》評審大換血，肥媽和周國豐傳被換走，顏志恒相信節目會變成另一個感覺，自己參加節目一直與大家相處，有感情，會緬懷自己參與一屆的賽制。\n黃劍文為雞髀錯失獎金\n而黃劍文談到錯失獎金，他表示參與紅地毯影相後忍不住去便利店食雞髀，突然收到兄弟打電話和短訊通知他得獎，已即時跑回錄影廠可惜已宣布新得獎者，「就係因為一隻雞髀！（好貴！）係啦！但我唔會唔食雞髀，只係大家都戥我唔抵，仲改我名做「雞髀文」，希望大家食雞髀想起我，可以接下雞髀廣告。談到顏志恒請他食雞髀？黃劍文稱更想食牛扒，又笑言想與曹永廉合照。黃劍文指也算有中獎運，接下來工作也多，除了成為《流行都市》主持班底，也正製作新的快歌，以及將演出音樂劇。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學 黃劍文為貪食錯失8萬3被嘲「雞髀文」","url":"https://www.stheadline.com/film-drama/3639129/TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學-黃劍文為貪食錯失8萬3被嘲雞髀文","source_display":"星島頭條","published_at":"2026-11-20T02:15:53+08:00","category":"生活","digest":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠…"},{"title":"TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學 黃劍文為貪食錯失10萬被嘲「雞髀文」","url":"https://www.stheadline.com/film-drama/3639129/TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學-黃劍文為貪食錯失10萬被嘲雞髀文","source_display":"星島頭條","published_at":"2026-11-20T02:15:53+08:00","category":"生活","digest":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠…"},{"title":"TVB台慶2026丨完場排位揭高海寧張曦雯受盡力捧 許濤預告TVB將進軍啟德主場館搞盛事","url":"https://www.stheadline.com/film-drama/3639050/TVB台慶2026丨完場排位揭高海寧張曦雯受盡力捧-許濤預告TVB將進軍啟德主場館搞盛事","source_display":"星島頭條","published_at":"2026-11-19T23:47:35+08:00","category":"生活","digest":"TVB年度盛事《萬千星輝賀台慶2026》於今晚在將軍澳電視城圓滿落幕"}],"cross":{"total":3,"angles":[{"point":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠…","sources":["星島頭條","星島頭條"],"url":"https://www.stheadline.com/film-drama/3639129/TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學-黃劍文為貪食錯失8萬3被嘲雞髀文"},{"point":"TVB年度盛事《萬千星輝賀台慶2026》於今晚在將軍澳電視城圓滿落幕","sources":["星島頭條"],"url":"https://www.stheadline.com/film-drama/3639050/TVB台慶2026丨完場排位揭高海寧張曦雯受盡力捧-許濤預告TVB將進軍啟德主場館搞盛事"}]}},{"id":"cde7a04029d","title":"陳庭欣傳暗撻中產燈飾老闆 曾包辦名店燈光打匹克球擦出愛火 傳男方剛離婚曾力追SG成員","url":"https://www.stheadline.com/film-drama/3639259/陳庭欣傳暗撻中產燈飾老闆-曾包辦名店燈光打匹克球擦出愛火-傳男方剛離婚曾力追SG成員","summary":"前港姐冠軍陳庭欣（Toby）在2025年底宣告與相戀8年的富商男友楊振源（Benny）因三觀不合而分手，正式告別「準闊太」生活，外界一直關心陳庭欣的感情生活，今日（20日）有傳陳庭欣終於有新歡…","summary_short":"前港姐冠軍陳庭欣（Toby）在2025年底宣告與相戀8年的富商男友楊振源（Benny）因三觀不合而分手…","digest":"前港姐冠軍陳庭欣在2025年底宣告與相戀8年的富商男友楊振源因三觀不合而分手…","points":["願》，但最後二人未能進一步發展","陳庭欣過往曾有于「百億女友」之稱，但與富商男友楊振源分手後…","重投單身市場的陳庭欣曾獲「金牌媒人」林盛斌（Bob）伸出援手…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:05:37+08:00","size":1,"keywords":[],"body":"前港姐冠軍陳庭欣（Toby）在2025年底宣告與相戀8年的富商男友楊振源（Benny）因三觀不合而分手，正式告別「準闊太」生活，外界一直關心陳庭欣的感情生活，今日（20日）有傳陳庭欣終於有新歡，有傳她與從事電燈生意的Gary於今年4月因打 Pickleball（匹克球）而大速撻著，拍拖至今約半年，但男方在5個月前才離婚回復單身，年初曾力追前女團 Super Girls 成員趙慧珊（Aka），不惜以公司名義贊助趙慧珊舉辦畫展《晃樂。願》，但最後二人未能進一步發展。《星島頭條》曾向陳庭欣了解，暫未有回覆。\n陳庭欣過往曾有于「百億女友」之稱，但與富商男友楊振源分手後，搬離昔日月租高達10萬的沙田九肚山3,000呎愛巢，搬入早年購入位於黃大仙的500多呎單位。重投單身市場的陳庭欣曾獲「金牌媒人」林盛斌（Bob）伸出援手，揚言會為她全力物色及介紹優質新對象。雖然陳庭欣的「新歡」身家不及楊振源家底厚，但據知Gary中產出身，是 KOFFA LIGHTING 的創辦人，曾負責不少名店的燈光設計，在上流圈子相當活躍。\n相關閱讀：39歲陳庭欣傳獲神秘男包場慶生力追 大合照疑揭「金主」身份為謝東閔 二人曖昧回應\n陳庭欣新歡約5個月前完成離婚手續\n回復單身的陳庭欣曾因熱衷打匹克球（Pickleball）被網民質疑「釣金龜」，但未受輿論影響，在不少關於匹克球的活動都見到她的踪影，湊巧Gary近年愛上打 Pickleball，多次以公司名義贊助大小比賽，因而結識了陳庭欣。據悉，二人由球友迅速發展成親密關係，而Gary在4、5個月前才與前妻完成離婚手續，成為真正的「單身男」，有知情人士透露：「Gary同 Toby一樣係 Pickleball 嘅發燒友，佢哋識嘅時候，Gary 都未正式離婚，嗰陣佢哋差唔多晚晚同班朋友一齊打波，不過一齊咗都冇特別講，唔算高調，但大家好快 get 到！」\n陳庭欣笑言現時不心急尋找另一半\n陳庭欣早前曾表示在林盛斌的牽線下，見過其中一位男士，當時她被問到會否想「漁翁撒網」多見幾位新對象慢慢挑選時，陳庭欣笑言現時不心急尋找另一半，一切順其自然，但認為多認識朋友亦無妨，以輕鬆心情迎接下一段更美好的良緣。在今年初陳庭欣曾被拍到與 27 歲《東張西望》主持曾錦燊密會及同場現身馬場，但陳庭欣已澄清對方只是後輩及朋友。在今年9月陳庭欣慶祝39歲生日，被指獲神秘男豪氣包場力追，後來揭發「金主」是相識 15 年的同期好友謝東閔，兩人同屬匹克球波友，純粹朋友請食飯。上月陳庭欣受訪時仍自稱「單身」並否認自己眼角高：「之前有報道亂寫我有緋聞男友，阿 Bob 仲以為係真，專登打嚟問我『係咪要收手？』我即刻叫佢『千祈唔好收手呀！』」\n相關閱讀：陳庭欣告別「10億女友」首過單身39歲生日 群星拱照「東張緋聞男友」曾錦燊貼心慶祝","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2ae34e1e56","title":"78歲名醫蔡堅黃大仙診所正式停診 嘆月租8萬難負荷 拒退休轉戰太子服務基層","url":"https://www.stheadline.com/health-edu/3639229/78歲名醫蔡堅黃大仙診所正式停診-嘆月租8萬難負荷-拒退休轉戰太子服務基層","summary":"香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重。","summary_short":"香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重。","digest":"香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重","points":["香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重","近日有網民發現其黃大仙診所門前張貼手寫「停診告示」，宣布診所已於11月17日正式結束營業","他補充指，加上自己已屆高齡，身體亦有不少毛病，實在難以再同時兼顧兩間診所四處奔波…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:00:42+08:00","size":1,"keywords":[],"body":"香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重。近日有網民發現其黃大仙診所門前張貼手寫「停診告示」，宣布診所已於11月17日正式結束營業。蔡堅醫生其後向傳媒無奈透露「做唔住」真相。\n蔡堅黃大仙診所 服務街坊長達43年無奈停診\n近日有網民於社交平台上載一張攝於黃大仙診所門前的「停診告示」照片，手寫告示中清晰交代了停診緣由，寫明診所在黃大仙「經營咗43年，因租約問題，已經喺11月17日停診」，並貼心提醒一眾舊症病人，日後若有需要覆診或求醫，可轉往其位於太子道西的醫務所繼續跟進。\n現年78歲的蔡堅醫生隨後接受傳媒訪問時坦言，黃大仙舖位租金太貴，每月租金高達8萬元，直言「做唔住」。他補充指，加上自己已屆高齡，身體亦有不少毛病，實在難以再同時兼顧兩間診所四處奔波，因此決定結束黃大仙分店，集中留在屬於自置物業的旺角太子診所繼續看診，承諾不會輕易言休。\n近日有網民於社交平台上載一張攝於黃大仙診所門前的「停診告示」照片，手寫告示中清晰交代了停診緣由，寫明診所在黃大仙「經營咗43年，因租約問題，已經喺11月17日停診」。\n街坊網民留言不捨 讚醫術高明有醫德\n黃大仙診所停診的消息在網上流傳後，隨即掀起街坊集體回憶，大批曾受惠於蔡堅醫生診治的市民紛紛留言表達惋惜與敬意。不少街坊大讚蔡醫生多年來始終如一，紛紛留言讚揚他「醫術高明」。不少網民得悉他「11病纏身」仍堅持應診亦大感心痛，紛紛留言勸慰「年紀大，其實應該好好休息享福了」、「退休啦，仁醫周身病痛」、「蔡醫生 辛苦了，要愛惜自己，工作後要休息呀」。\n蔡堅糖尿纏身日服30粒藥 為食偷食朱古力\nTVB節目《醫生你有病》早前一集訪問前香港醫學會會長蔡堅醫生，77歲的他毫不言休，每日風雨不改在為病人看診。精神不錯的他，坦言自己「周身都係病」，由糖尿病、心臟病、白內障、青光眼，到胃扭轉、前列腺肥大，幾乎由頭到腳都出過事。他笑言自己是「最曳的病人」，寄語市民「病不羞恥」，鼓勵大家坦蕩蕩討論健康問題。\n蔡醫生即場示範用糖尿貼檢查血糖，指數7.7，屬正常範圍。他透露自己有家族糖尿病，40多歲後發病，每日需注射胰島素，並服食多種藥物。「糖尿病、心臟、膽固醇、血壓……一個人老咗，有好多嘢要控制，早晚加埋30粒藥。」\n談到飲食，蔡醫生笑言自己「冇得enjoy食嘢」，是「人生憾事」。他作為醫生，常常勸病人不要吃朱古力，自己卻「偷偷地食，耐唔耐食下」。被問到會否懺悔，他直言：「懺悔，做錯嘢就要懺悔。」蔡堅解釋，正因為自己也是病人，更能明白病人的心情與渴望。\n他坦言，醫生也是常人，一樣會病；他自己由頭到腳病歷一大疊：\n 眼睛：白內障、青光眼，做過白內障手術，現時滴眼藥水控制青光眼。\n 鼻：十幾歲起患鼻竇炎，曾切除鼻竇黏膜。\n 面部：三叉神經痛。\n 心臟：一條血管硬化，做過通波仔手術。\n 胃：胃扭轉，曾半夜嘔血。\n 腸：小腸切除一截，直腸多年前發炎。\n 腎：糖尿影響令腎功能轉差。\n 四肢：手震、腳曾折斷，現時鑲有鐵片固定。\n他更自嘲：「以前生肖屬牛，依家成塊鐵片。」他坦言77歲多數不會換腎，若撐不住便洗腎，若老到不能洗腎便「收工」。但他強調，這些都是都市病，與職業無關。「做醫生坐得多、運動少，醫生都會有呢啲病。」\n逃避檢查險喪命 自嘲「最曳的病人」\n蔡醫生坦言，醫生識得多，反而會挑戰醫囑：「係咪真係需要咁做呢？」結果成為「最曳的病人」。這種「曳」，其實源於過度自信，認為自己可以處理，但有時會失準，他最嚴重的一次，是胃扭轉。\n兩年前，他經常胃酸倒流及嘔吐，一直靠食藥止痛，最終痛到送院。「如果再唔理，係有機會死亡。」他形容痛楚「好似入面有嘢扭住、個胃吞咗上去咁」，情況相當罕見。他承認，多年前已獲港大外科醫生告知需要處理，但他一直逃避。「依家諗返起，係病人常見嘅盲點。」死過翻生後，他戒酒、盡量戒口，但逃避習慣未改。「照腸、照MRI、做微創手術先……有少少逃避。」\n一日去廁所近20次 半夜急召泌尿科醫生\n蔡醫生的前列腺亦出問題。十幾年前，他一日去廁所近20次，日尿夜尿頻密，控制不到，甚至褲濕。起初他自己開前列腺藥服用，拖延很久，直至某晚小便劇痛，半夜致電泌尿外科專科醫生王國田求助。王國田在電話中教他用藥控制，翌日他即到診所，最終接受經尿道前列腺切除手術，將增生組織抽薄，排尿回復暢通。\n蔡堅憶述：「一剎那天堂，一剎那地獄。之前痛不欲生，拔咗尿喉，跟住就屙得好順。」然而，他仍有逃避的習慣。前列腺指數高，需要照MRI，但他至今未照，「我諗都係時候，聽你講去照。」\n病非羞恥 籲市民勿輕視警號\n雖然常逃避檢查，但蔡醫生不怕尷尬，他鼓勵市民坦蕩蕩討論健康問題：「病並唔係一個羞恥嘅嘢。我想解釋俾市民知，醫生都係人，醫生都有病，醫生都需要睇醫生。」\n王國田醫生補充，前列腺問題並非突然出現，而是慢慢走下坡，經歷幾十年。他提醒，男士年輕時小便有力，隨年齡增長會逐漸減弱，「每個人到最後，可能嘅經歷都會同蔡醫生類似。所以千祈唔好笑人，今日笑下，聽日輪到。」他呼籲女士也應關心身邊男士，包括父親及伴侶。\n資料來源：TVB《醫生，你有病？》","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdf1f30c378","title":"專家拆解6大保暖陷阱恐致猝死 只穿厚外套不禦寒 重點保暖3部位","url":"https://www.stheadline.com/health-edu/3523254/專家拆解6大保暖陷阱恐致猝死只穿厚外套不禦寒-重點保暖3部位","summary":"冬天要怎樣保暖？","summary_short":"冬天要怎樣保暖？","digest":"專家拆解6大保暖陷阱恐致猝死 只穿厚外套不禦寒 重點保暖3部位","points":["好多人以為只穿厚外套就可保暖，但原來並不足夠","有醫生指出，冬季期間心肌梗塞、腦中風病例暴增","黃醫生分析，很多人用的「禦寒方式」既不保暖又傷血管，反而會「慢性凍害」身體"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:00:31+08:00","size":1,"keywords":[],"body":"冬天要怎樣保暖？好多人以為只穿厚外套就可保暖，但原來並不足夠！有醫生指出，冬季期間心肌梗塞、腦中風病例暴增；而日常生活中更有6大隱形陷阱，不但無法真正保暖，更可能增加心血管疾病風險，其中洗澡溫差更可能導致浴室猝死風險激增10倍。\n6大禦寒陷阱傷血管 恐致猝死\n重症科醫生黃軒近日在個人Facebook專頁分享，儘管冬天時大家都有保暖，但急症室的心肌梗塞、腦中風、骨折、氣喘、心衰竭等病例卻在寒冷氣溫下飆升。黃醫生分析，很多人用的「禦寒方式」既不保暖又傷血管，反而會「慢性凍害」身體。冬季最危險的6大錯誤習慣：\n【同場加映】天氣轉冷易猝死 醫生教4招保暖 喝2飲品有效\n禦寒陷阱｜1. 靠熱飲暖全身\n 錯誤習慣：很多人以為熱奶茶、熱湯可「瞬間」溫暖身體，讓身體誤以為「夠暖了」。\n 實際危害：熱飲僅刺激口腔溫度，核心體溫回升有限，反令大家誤判體溫而穿不夠，血管收縮更劇烈、壓力荷爾蒙更高，是冬季心肌梗塞的重要因素。\n禦寒陷阱｜2. 穿時尚緊身外套\n 錯誤習慣：很多年輕人冬天愛穿「太緊身、時尚、無保暖功能」的外套，裡面只有一件薄T恤。\n 實際危害：緊身外套易令血流受限，導致外周血管痙攣；研究顯示，寒冷暴露會讓收縮壓上升20-30mmHg，高血壓患者出現心肌梗塞風險激增。\n【同場加映】冬天洗澡後皮膚乾燥痕癢 醫生教4招保濕 潤膚膏選哪種？水溫勿超這溫度！\n禦寒陷阱｜3. 立即沖熱水澡\n 錯誤習慣：低溫天氣下，一到家立即洗熱水澡，是冬天最常見的危險習慣。\n 實際危害：日本研究指，冬季洗澡心血管死亡率是夏季10倍。寒冷氣溫令血管收縮；但洗熱水會令血管瞬間擴張，一冷一熱會引發血壓急速下降，出現洗澡中暈倒、心跳加速、心臟負荷失敗。\n禦寒陷阱｜4. 只穿厚外套、忽略3部位\n 錯誤習慣：只穿厚外套，忽略「人體3大散熱口」的頭、頸、腳，穿再厚也無法有效保暖。\n 實際危害：因為頭部散熱佔人體7-10%，如果頭沒做好保暖，導致腦血管收縮，出現頭痛、注意力下降、血壓升高。\n禦寒陷阱｜5. 暖氣開到最大\n 錯誤習慣：夜間將暖氣開到最大，令室內環境變得又熱又乾。\n 實際危害：\n 呼吸道影響：黏膜乾裂、咳嗽加劇、氣喘發作；乾燥空氣增加呼吸道感染風險。\n 睡眠影響：夜間血壓上升、睡眠品質下降。\n禦寒陷阱｜6. 冬季強硬做運動\n 錯誤習慣：冬天在戶外冷到發抖，如果照舊進行激烈運動不添加衣服，恐讓心臟更吃力。\n 實際危害：冷空氣進入氣道會導致支氣管收縮，越跑越喘、心臟負荷暴升。\n【同場加映】女子用保溫杯泡養生茶 竟炸爆天花板 裝9種飲品恐中毒傷身\n正確保暖6法則 從根本保護心血管\n黃醫生提出了正確保暖6大法則：\n 戴好「帽子＋圍巾＋手套」，比穿厚外套更有效。\n 洗澡前先把浴室暖起來。\n 冬天適合運動的大前提是做足熱身、保暖、循序漸進；走出室外前30秒做「暖身跳動」。\n 穿衣以洋蔥式分層為主，不要靠熱飲硬撐。\n 室內濕度要維持40–60%。\n 有心血管疾病者，冬天不要快步衝出門。\n解構心肌梗塞症狀/併發症\n根據本港醫管局資料，急性心肌梗塞普遍稱為「心臟病發」，是一種危及生命的疾病，通常是由動脈粥樣硬化和冠狀動脈血栓引起的。沒有血液供應的心肌就無法正常運作並開始壞死。\n 典型症狀：心口痛和胸部不適，有時更會延伸到下顎和左臂；冒汗和呼吸困難。\n 非典型症狀，如消化不良和頭暈。\n 有時，心臟驟停亦可能是急性心肌梗塞的首發症狀。\n 併發症：心肌壞死和功能失效，嚴重時會導致心源性休克和急性心臟衰竭。壞死的心肌可導致心律不正或心臟結構破裂而造成的心包填塞、急性二尖瓣倒流或急性心室間膈缺損。所有這些情況都有即時生命危險及增加中風或其他器官衰竭的機會。\n 長期影響：患者心臟受到不同程度的損傷，急性心肌梗塞的倖存者其患上慢性心臟衰竭、心律不正和中風等的風險會增加。\n資料來源：重症科醫生黃軒、醫管局\n延伸閱讀：體溫下降易患慢性病！60歲後必吃4類食物暖身延壽 5招提升體溫\n---","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6070af090d","title":"【呈分試風波】教大賽馬會小學常識重考掀爭議 校方：日後計分測考劃一同日進行","url":"https://www.stheadline.com/ohpama/3639250/呈分試風波教大賽馬會小學常識重考掀爭議-校方日後計分測考劃一同日進行","summary":"香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注，校方昨日（19日）再發通告作進一步交代。","summary_short":"香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注，校方昨日（19日）再發通告作進一步交代。","digest":"香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注…","points":["香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注…","校長張錦欣在通告中證實，11月上旬曾接獲家長反映，個別班別完成有關測驗後…","校方為免影響學生應付第一學段總結性評估的情緒，遂延至評估結束後才公布安排…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T13:42:06+08:00","size":1,"keywords":[],"body":"香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注，校方昨日（19日）再發通告作進一步交代。校長張錦欣在通告中證實，11月上旬曾接獲家長反映，個別班別完成有關測驗後，部分學生之間流傳寫有作答答案的紙張；校方為免影響學生應付第一學段總結性評估的情緒，遂延至評估結束後才公布安排，並宣布日後各級所有計分測考均會安排在同一時段進行。\n單元溫習分日考惹公平疑慮 家長憂增小六生壓力\n據悉，該校小六常識科評估涵蓋兩次單元溫習及一次大考，其中單元溫習共佔呈分試兩成分數。涉事的第二次單元溫習早前按不同班別分日進行，其後網上有地區群組傳出疑有同學傳閱抄有答案的字條，引發家長及外界對考核公平性的討論；亦有不少聲音關注小六生剛完成連日呈分試後再面對重考，擔心進一步加劇學童的溫習負擔與情緒壓力。\n校方證實部分學生傳閱答案紙張 免影響呈分試延後公布\n校方早前於18日發出通告，指鑑於該次單元溫習並非同日進行，決定不計算有關成績並安排重考。校方在昨日（19日）的通告中進一步說明，涉事單元溫習屬於常識科進展性評估的一部分（即平時分），並非總結性評估；校方11月上旬接獲家長反映後已即時跟進了解，因單元溫習未有安排各班同日進行而衍生有關情況，為確保評估公平，遂決定安排第三次常識科單元溫習。\n（圖片來源：受訪者提供）\n至於延至呈分試後才公布決定，校方解釋，當時學生即將應考11月12日至17日舉行的第一學段總結性評估，為免干擾學生備考情緒，因此決定待評估完成後再作公布。\n（圖片來源：受訪者提供）\n日後計分測考劃一同日進行 已辦特別班主任課疏導情緒\n校方強調一向重視測考公平性，為避免同類事件再發生，今後各級所有涉及計分的測考均會安排於同一時段進行，以確保評估機制公平、公正。校方又提到，昨日已為六年級學生安排特別班主任課，提供情緒疏導及輔導支援，照顧學生的身心需要，並就事件可能造成的額外負擔與不便向家長及學生致歉。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9775f8e289","title":"天氣動態圖｜創入秋最凍紀錄 寒潮持續到幾時？ 下周再有冷鋒｜附九天預報","url":"https://news.tvb.com/tc/1207401-天氣動態圖創入秋最凍紀錄寒潮持續到幾時下周再有冷鋒附九天預報","summary":"受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄。天亮後市區氣溫不斷下降，正午時分，本港普遍地區氣溫下降至約12度。","summary_short":"受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄。","digest":"受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度…","points":["受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄","天亮後市區氣溫不斷下降，正午時分，本港普遍地區氣溫下降至約12度","一道廣闊雲帶持續為該區帶來有雨的天氣"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T12:05+08:00","size":1,"keywords":[],"body":"受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄。天亮後市區氣溫不斷下降，正午時分，本港普遍地區氣溫下降至約12度。\n\n周末氣溫會否回升？下星期繼續凍？即睇天氣動態圖了解。\n\n天文台指，一股強烈東北季候風正影響華南。同時，一道廣闊雲帶持續為該區帶來有雨的天氣。受強烈東北季候風影響，明早廣東地區寒冷。隨著覆蓋華南的雲帶在明日稍為轉薄，該區天色短暫好轉。\n\n而一股達強風程度的偏東氣流會在下周初影響華南沿岸，該區雲量增多，氣溫略為回升。預料另一股東北季候風會在下星期二抵達華南沿岸，下周中期該區氣溫再度下降及有幾陣雨。\n\n天文台預料，本港地區下午及今晚天氣轉冷，密雲，有幾陣雨。吹清勁北至東北風，離岸及高地吹強風。展望明早氣溫仍然偏低。隨後一兩日雲量增多，風勢頗大，氣溫稍為回升。下周中期再度下降。\n\n更新時間： 2026年11月20日12時00分","image":"https://pro-vod-cdn.tvb.com/ba10f7a5efd94c57a81779bc1b6adf7d/snapshots/3559e4b3e6dc4ca099dee74c0bb58c3f-00002.jpg", 9日（日） 2pm-3pm 巴西雞中翼 11月29日（日） 4pm-5pm 指定 SANRIO 商品 AEON Black Friday 2026\n 活動日期：2026年11月20日（五）至12月6日（日）\n 活動地點：全線AEON、AEON STYLE 或 AEON SUPERMARKET\n 會員限定：購物滿$800或以上送$50電子優惠券（適用於12月7日至17日期間滿$150的交易）\n 備註：部分特價商品如行李喼、壽司等不適用於個別分店，請參閱店內海報說明\n資料來源：AEON Stores Hong Kong\n同場加映：一田日本秋祭大特價低至買1送1！380+款優惠時令食材/零食飲品/日用品 $79.9北海道黑牛/生蠔","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2ad51998a7","title":"聖誕節2026｜寫信給聖誕老人攻略 6大高回信率地址+4招寄信貼士","url":"https://www.stheadline.com/ohpama/3638832/聖誕節2026寫信給聖誕老人攻略-6大高回信率地址4招寄信貼士","summary":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。","summary_short":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。","digest":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人…","points":["聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人…","以下整合6大熱門聖誕老人收信地址、截郵時間及4招實用寄信貼士，家長不妨趁現時盡早陪子女動筆","德國郵政每年都會設立聖誕郵局，由聖誕老人與「聖誕天使」協助回覆世界各地小朋友的來信"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:13+08:00","size":1,"keywords":[],"body":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。以下整合6大熱門聖誕老人收信地址、截郵時間及4招實用寄信貼士，家長不妨趁現時盡早陪子女動筆！\n聖誕節2026｜德國郵政\n德國郵政每年都會設立聖誕郵局，由聖誕老人與「聖誕天使」協助回覆世界各地小朋友的來信。根據當地安排，聖誕老人將於2026年11月26日起回覆信件直至平安夜，信封上必須寫清楚寄件人地址以便寄回信件。\n資料圖片\n德國郵政\n收信地址： An den Weihnachtsmann, Weihnachtspostfiliale, 16798 Himmelpfort, Germany\n參考期限： 當地建議截郵日期為2026年12月13日（香港聖誕空郵截郵日為12月8日）\n聖誕節2026｜芬蘭羅瓦涅米聖誕老人總郵局\n位於北極圈羅瓦涅米的聖誕老人村被視為聖誕老人的官方故鄉，由芬蘭郵政運作的聖誕老人總郵局全年收信，每年處理逾50萬封信件。官方會處理來信並不時寄出回覆，但不保證每封信均獲免費回信（另設收費訂購信件服務）。由於國際郵遞需時，建議盡早寄出。\n（圖片來源：Posti網站）\n芬蘭羅瓦涅米聖誕老人總郵局\n收信地址： Santa Claus' Main Post Office, Tähtikuja 1, 96930 Arctic Circle, Finland\n參考期限： 香港聖誕空郵截郵日為12月8日（建議11月下旬前盡早空郵寄出，以提高在聖誕前收信的機會）\n更多詳情：按此\n\n聖誕節2026｜加拿大郵政\n加拿大郵政的聖誕老人回信計劃已有逾40年歷史，每年協助回覆世界各地逾100萬封信件，郵遞區號「H0H 0H0」正是諧音聖誕老人的笑聲。官方表示會回覆所有收到的信件，並按來信語言回覆，從香港寄出只需支付寄往加拿大的國際郵資，回信郵費由當地郵政負責。\n（圖片來源：Canada Post）\n加拿大郵政\n收信地址： Santa Claus, North Pole, H0H 0H0, Canada\n參考期限： 當地建議截郵日期為2026年12月9日（香港聖誕空郵截郵日為12月4日）\n更多詳情：按此了解\n法國郵政「聖誕老人秘書處」（Père Noël）\n法國郵政設有「聖誕老人秘書處」回覆兒童寄給 Père Noël 的信件，只要在信封背面填寫完整回郵地址即可申請回信。\n（AI生成示意圖）\n法國郵政「聖誕老人秘書處」（Père Noël）\n收信地址： Père Noël, 33500 Libourne, France\n參考期限： 香港聖誕空郵截郵日為12月3日\n香港郵政\n除了海外的聖誕老人郵政服務，本地其實亦有傳統的聖誕老人回信安排。一眾郵政人員便會化身聖誕老人小助手，逐一細讀孩子們的來信，並以聖誕老人回信給每位小朋友，讓在香港感受到節日氣氛。\n（圖片來源：政府新聞網圖片）\n香港郵政\n收信地址：香港中環康樂廣場2號香港郵政總局（信封面請註明「聖誕老人收」）\n同場加映：LEGO 聖誕樂仔收集小朋友的聖誕心願 \nThe LEGO Group 以全球企劃 The LEGO® Holiday Workshop 為靈感，邀請全港家庭走進充滿驚喜的節日拼砌世界。於指定時間內「寫信給聖誕樂仔」，填妥心意後寄到指定地址，即可收到聖誕樂仔的專屬回信，更有機會獲得聖誕禮物 。 \n官方圖片\n官方圖片\nLEGO\n活動日期：即日起至2027年1月3日\n參加方法：\n方法1：將信件以平郵方式寄往「Blk H, 12/F., Phase 4, Kwun Tong Ind. Ctr, 436 – 446 Kwun Tong Rd, Kwun Tong, Kln, H.K.」\n方法2：親身前往香港樂高®認證專門店索取專用信紙，寫下給「聖誕樂仔」的說話後，直接投入店內設置的聖誕郵箱即可。\n提高回信機率4個貼士\n（AI生成示意圖）\n1.清楚寫明回郵地址及格式\n在信封背面或左上角寫上孩子的姓名及完整英文回郵地址，最後加上「HONG KONG」，並確保收件人寫上「Santa Claus」或「Père Noël」等稱謂，以免無法寄回。\n2.內容自然簡潔，善用畫畫與貼紙\n信件毋須太長或太正式，可先自我介紹並分享近況或值得高興的事，再寫出願望；年紀較小或愛畫畫的孩子，可畫上聖誕樹、雪人或貼貼紙，增添童真與溫度。\n3.貼足國際郵票及留意截郵日期\n寄往海外前應按信件重量與目的地貼足國際郵票（可向郵局查詢或磅重）。需注意香港郵政的聖誕空郵截郵日只屬信件送抵目的地的參考，並非回信保證日期，預留充足郵遞時間、越早寄出越好。\n4.留意各地回信安排差異\n不同郵局的回信政策不同，部分表示會盡量或全數回覆，部分則不保證每封均獲回覆，家長宜與孩子一同平常心期待驚喜。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb5fa0f647d","title":"Oh!爸媽【聖誕4重賞】｜每週五解鎖神秘禮遇 暖笠笠迎聖誕","url":"https://www.stheadline.com/ohpama/3638585/Oh爸媽聖誕4重賞每週五解鎖神秘禮遇-暖笠笠迎聖誕","summary":"「又到聖誕…又到聖誕…","summary_short":"「又到聖誕…","digest":"「又到聖誕…又到聖誕…」Oh","points":["爸媽搜羅不同驚喜禮遇，玩樂體驗、親子好物應有盡有，與大小朋友共慶佳節","由11月23日開始，連續四星期不定時推出，記得緊貼最新公佈，一齊開心過聖誕","第一重賞(11月23日-11月26日)預告"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"「又到聖誕…又到聖誕…」Oh!爸媽搜羅不同驚喜禮遇，玩樂體驗、親子好物應有盡有，與大小朋友共慶佳節。由11月23日開始，連續四星期不定時推出，記得緊貼最新公佈，一齊開心過聖誕！\n第一重賞(11月23日-11月26日)預告\n禮遇登記連結: (11月23日中午12時開始不定時發放，大家密切留意Oh!爸媽平台最新公佈)\n第二重賞預告\n11月27日公佈，密切留意！\n\n第三重賞預告\n12月2日公佈，密切留意！\n\n第四重賞預告\n12月9日公佈，密切留意！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c77d94b941b","title":"陳家碧罕現身TVB藝訓班聚會 嫁余錦基胞弟息影做闊太 57歲近照皮膚白滑極凍齡","url":"https://www.stheadline.com/film-drama/3638977/陳家碧罕現身TVB藝訓班聚會-嫁余錦基胞弟息影做闊太-57歲近照皮膚白滑極凍齡","summary":"前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會。","summary_short":"前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會。","digest":"前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會","points":["前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會","席上除了林家棟、黃德斌、黎芷珊、杜兆津、林燕明、張靜及鄭維嘉等多位同窗外…","久未露面的陳家碧留有一頭烏黑長髮，對鏡頭展露甜美微笑，雖然身形比以往幕前時期圓潤…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會。席上除了林家棟、黃德斌、黎芷珊、杜兆津、林燕明、張靜及鄭維嘉等多位同窗外，當年的藝訓班主任高宏亦戴上招牌藍色帽子精神奕奕現身，場面溫馨。久未露面的陳家碧留有一頭烏黑長髮，對鏡頭展露甜美微笑，雖然身形比以往幕前時期圓潤，但她皮膚依然白滑，氣色極佳，保養得宜。\n陳家碧主持《娛樂新聞眼》成經典回憶\n陳家碧的演藝生涯始於1986年參加《第五屆新秀歌唱大賽》，同屆參賽者包括文佩玲、許志安、黎明、關淑怡及劉錫明等。她當時於30強止步，隨後報考第15期藝員訓練班，與林家棟、黃德斌及黎芷珊結為同學，並於1988年畢業正式入行。陳家碧在TVB期間曾參演不少經典劇集，如《花月佳期》、《蓋世豪俠》及《我本善良》等，當中以《俠客行》飾演的「白阿繡」最令人留下深刻印象，與主角梁朝偉更有不少對手戲。90年代她亦曾客串《新半斤八兩》及《唐伯虎點秋香》等電影，不過大多飾演閒角。相比之下，她轉戰主持界在《娛樂新聞眼》及《城市追擊》擔任主持，憑藉靈活淡定的表現，更為觀眾所熟悉。\n相關閱讀：《娛樂新聞眼》陳家碧激罕現身！老公余錦遠生日影帝天王到賀 曾玩新秀一原因息影\n陳家碧息影嫁余錦基胞弟\n陳家碧在1994年選擇離開TVB並息影，回歸校園修讀大學學位。告別娛樂圈後，她低調嫁給香港富商余錦基的胞弟余錦遠，婚後育有兩名女兒。陳家碧早年受訪時曾透露，婚後曾有意追生兒子，無奈夫婦二人工作與生活繁忙而未能如願，但兩名女兒乖巧貼心，一家四口生活美滿。\n相關閱讀：《娛樂新聞眼》陳家碧罕現身跟影帝同台 息影多年變化震驚網民 跟余錦基胞弟結婚育兩女","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd19be98f26","title":"抗大腸癌兼抗發炎！最新研究揭：日吃1種營養素 5年存活率飆升17個百分點","url":"https://www.stheadline.com/health-care/3637993/抗大腸癌兼抗發炎最新研究揭日吃1種營養素-5年存活率飆升17個百分點","summary":"抗癌不只是消滅癌細胞，更要抗發炎。","summary_short":"抗癌不只是消滅癌細胞，更要抗發炎。","digest":"抗癌不只是消滅癌細胞，更要抗發炎","points":["抗癌不只是消滅癌細胞，更要抗發炎","最新一項發表的研究指出，大腸癌肝轉移患者在手術前後吃1種營養素…","【同場加映】24歲女研究生患大腸癌晚期 曾邊備考邊照顧患乳癌母 慨嘆…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"抗癌不只是消滅癌細胞，更要抗發炎。最新一項發表的研究指出，大腸癌肝轉移患者在手術前後吃1種營養素，5年整體存活率竟能從45%飆升至62%，大增17個百分點。\n研究揭日吃1種營養素 大腸癌肝轉移患者存活率升17個百分點\n放射腫瘤專科醫生廖志穎在Facebook專頁發文分享，引述2026年歐洲腫瘤內科學會（ESMO）年會上發表的一項第3期臨床試驗（EMT2）結果指出，大腸癌出現肝轉移的患者，在手術前後接受高劑量「二十碳五烯酸（EPA，一種Omega-3脂肪酸）」治療，其整體存活期比服用安慰劑的患者更長。\n【同場加映】24歲女研究生患大腸癌晚期 曾邊備考邊照顧患乳癌母 慨嘆：人生的路不白走會堅持下去\n過去已知Omega-3魚油具有調節發炎的作用。廖志穎醫生表示，這項研究共納入了418名接受肝轉移切除手術的大腸直腸癌患者，並將他們分為兩組：實驗組每天服用4克高純度EPA乙酯（Omega-3魚油成分），對照組則服用安慰劑。研究結果顯示：\n 服用高純度EPA實驗組：5年整體存活率高達62.0%\n 服用安慰劑對照組：5年整體存活率為 45.1%\n研究也正常，無惡化存活期（PFS）並未顯著改善，因此仍需要進一步研究確認。\n為何補充高劑量EPA能讓患者的5年整體存活率從45%大幅提升至62%？廖志穎醫生指出，研究團隊推測，魚油中的高劑量EPA可能透過以下3種機制在體內發揮作用：\n 調節慢性發炎與腫瘤微環境\n 影響免疫反應與腸道菌相\n 可能改善癌症相關的發炎及代謝狀態。\n廖志穎醫生強調，這項研究讓醫學界重新思考抗發炎在癌症照護中的重要角色，但不能認定EPA能預防復發。由於這項研究屬於觀察性研究，尚無法證明因果關係，且研究使用的是處方級高純度EPA，並非一般市售魚油，也不建議癌症患者自行每日服用4克高純度EPA魚油。\n【同場加映】長輩溺愛惹禍！3餐常食炸雞杯麵辣條 12歲男童腹痛揭大腸癌晚期\n大腸癌有何常見徵狀？\n據香港癌症資料統計中心資料顯示，大腸癌是本港第3大常見癌症，同時亦是本港第2大致命癌症，按最新公布數據顯示一年錄得5190宗大腸癌新症及2270宗死亡個案。根據本港癌症網上資源中心資料，早期的大腸癌有機會完全無症狀。如有徵兆，身體則可能出現以下變化：\n大腸癌症狀：\n 大便帶血、或呈黑色、帶黏液，或直腸出血\n 排便習慣突變（持續便秘或腹瀉）、糞便形狀改變（幼條狀）、大便後仍有便意\n 無故體重下降\n 下腹不適（腹部發脹或腸絞痛）\n 身體出現貧血徵狀：手腳冰冷、疲倦、心跳加速、氣喘、面色蒼白、頭暈\n大腸癌風險因素：\n 飲食纖維含量不足\n 進食大量紅肉和加工肉\n 缺乏體能活動、肥胖\n 飲酒和吸煙\n 帶有遺傳性的腸病，例如「家族性大腸腺瘜肉病」或「連氏綜合症」\n 大腸長期發炎，例如「潰瘍性結腸炎」\n 過往有大腸瘜肉\n 直系親屬有大腸癌家族史\n資料來源：放射腫瘤專科醫生廖志穎、歐洲腫瘤內科學會（ESMO）、癌症網上資料中心、香港癌症資料統計中心 \n延伸閱讀：吃這10種高纖食物 防大腸癌最好！早餐必吃燕麥？營養師大推這種番薯！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c808b1c6fbb","title":"天氣｜市區氣溫跌至13.4度 多處地區及高地寒冷","url":"https://news.tvb.com/tc/1207381-天氣市區氣溫跌至134度多處地區及高地寒冷","summary":"受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度。在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。","summary_short":"受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度。","digest":"受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度","points":["受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度","在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步","天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T11:00+08:00","size":1,"keywords":[],"body":"受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度。\n\n在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖。\n\n天亮後維港兩岸天色昏暗，早上上班上學時間，不少市民穿了外套及頸巾。\n\n天文台指，受強烈東北季候風及一道雲雨帶影響，日間市區氣溫繼續下降至約13度，多處地區及高地寒冷。\n\n隨後一兩日氣溫稍為回升。預料另一股東北季候風，會在下周二抵達華南沿岸，下周中期會再度轉涼。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/c21b252926374e67a6ce5b3b22608079/snapshots/d0b7465b8e6c4f879486b2e1767665f6-00005.jpg","video":"https://pro-vod-cdn.tvb.com/c21b252926374e67a6ce5b3b22608079/464dd5e6b35146f7808cfc580db612a3-d790c2c019923a55feb6d2cdfacf02e2-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/c21b252926374e67a6ce5b3b22608079/snapshots/d0b7465b8e6c4f879486b2e1767665f6-00005.jpg","lang":"zh-Hant"},{"id":"c14251b0bb1","title":"“零添加”“0蔗糖”未必更健康","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735009.shtml","summary":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)  　　“零添加”“0蔗糖”“非油炸”……","summary_short":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)  　　“零添加”“0蔗糖”“非油炸”…","digest":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)…","points":["《人民日报海外版》(2026年11月20日 第 09 版)","“零添加”“0蔗糖”“非油炸”……如今，许多食品打出这样的宣传标签，吸引消费者购买","“这些说法只涉及某种成分或加工方式，不能代表食品的整体营养状况"],"section":"生活","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:08:41+08:00","size":1,"keywords":[],"body":"本报记者 王美华\n\n　　《人民日报海外版》(2026年11月20日 第 09 版)\n\n　　“零添加”“0蔗糖”“非油炸”……如今，许多食品打出这样的宣传标签，吸引消费者购买。这些字眼是否意味着食品更安全、更健康？在国家卫生健康委近日举行的新闻发布会上，专家进行了详细解读。\n\n　　“这些说法只涉及某种成分或加工方式，不能代表食品的整体营养状况。”国家食品安全风险评估中心副研究员梁栋在发布会上介绍，2027年3月16日起，我国将实施新的标签标准要求，将禁止使用“零添加”“不添加”等用语对食品配料进行特别强调，避免误导消费者。\r\n\n　　关键在于控制糖的总摄入量\n\n　　梁栋介绍，“0蔗糖”≠没有糖。营养成分表中的糖，包括葡萄糖、果糖、蔗糖、麦芽糖和乳糖。“0蔗糖”只针对蔗糖，并不代表这个食品中不含有其他糖类，也不代表低能量。因此，需要控糖的人群，还要结合配料表和营养成分表来综合判断。此外，科学控糖关键在于控制糖的总摄入量，而不是纠结该选择哪种糖。\n\n　　“零添加”≠更健康。比如，不添加防腐剂的食品并不代表低糖、低盐。有些食品为了延长保质期，可能在加工过程中会添加更多的糖或者盐，因此也要控制其食用量。\n\n　　“非油炸”≠没有油、脂肪低。“非油炸”仅仅说明食品在加工过程中没有采用油炸工艺，但也有可能通过食品原料添加油或食品加工过程中加入了油脂。比如，有些非油炸膨化食品、焙烤食品为改善口感也会加油。“消费者在选购的时候，还要看配料表和营养成分表，观察配料表里到底有没有加入油脂，同时结合营养成分表中的脂肪含量来综合判断，而不能仅靠加工方式来下结论。”梁栋表示。\n\n　　重点看配料表与营养成分表\n\n　　食品标签上哪些内容需要重点关注？\n\n　　“消费者需求不同，选购预包装食品时的关注点也会有所差异，但关键都在于配料表和营养成分表。”梁栋表示，有食物过敏的人，需重点关注食品配料表和致敏提示。配料表说明制作食品用了什么，排得越靠前，用量越大。过敏人群要关注自己需要避免摄入的物质。\n\n　　接着看营养成分表，要注意含量是按每100克、每100毫升还是每份标示，吃多少要相应换算。表中的“营养素参考值”百分比，表示相应营养成分占每日参考量的比例。例如，每100克饱和脂肪对应的值是70%，意味着吃100克就占了一天饱和脂肪摄入总量的七成，要注意控制食用量。\n\n　　梁栋表示，消费者应根据自己的健康需求，选择更适合的食品。例如，需要减重的人群重点看能量，这里的能量是指蛋白质、脂肪和碳水化合物提供的总能量；高血压人群重点看钠含量，尽量选择钠含量较低的食品；血脂偏高人群关注脂肪和饱和脂肪的含量。\n\n　　需要提醒的是，现在许多食品包装上有了“数字标签”二维码，用手机扫一扫就可以实现标签信息的“可听、可播、可放大”，帮助更好了解和选择食品。\n\n　　2岁内幼儿尽量不摄入添加糖\n\n　　糖尿病是吃糖、吃甜食太多引起的吗？不吃糖就不会得糖尿病吗？\n\n　　北京协和医院主任医师许岭翎表示，糖尿病是身体调节和利用葡萄糖的能力出了问题，预防糖尿病不能只盯着吃不吃糖，还要规律进餐、粗细搭配、适量运动、保持健康体重。\n\n　　“平时生活中不必谈糖色变，重要的是注意控制添加糖的摄入量。”许岭翎提醒，添加糖是指加工食品或烹调时额外加入的糖，不包括食材中天然存在的糖。对于血糖正常的成人来说，每日添加糖应不超过50克，最好控制在25克以下。儿童青少年应该更加严格，2岁之内幼儿尽量不要摄入添加糖。\n\n　　此外，还要注意隐形糖。购买食品要养成看标签的习惯，既要看配料表中有没有添加糖，也要关注营养成分表中的糖含量，并按整瓶、整包计算，同时不能把碳水化合物直接当成添加糖。要留意调味酸奶、果汁饮料、酱料中的隐形糖，少吃甜点和高糖加工食品，用白开水、淡茶水替代甜饮料，用适量新鲜水果替代甜点。 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3ef76d0516","title":"抄袭、洗稿事件频发 文学刊物如何守住“原创防线”","url":"https://www.chinanews.com.cn/cul/2026/11-20/10735008.shtml","summary":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐，并对该作者的作品永久禁发。","summary_short":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐…","digest":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明…","points":["《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传…","值得关注的是，今年以来，国内文学刊物已多次发出致歉声明，核心指向高度一致：作品雷同、洗稿…","今年10月，《人民文学》第9期短篇小说《秋宵梦觉》被读者比对指出文本雷同，经编辑部核实…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:05:14+08:00","size":1,"keywords":[],"body":"本报记者 路艳霞\n\n　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐，并对该作者的作品永久禁发。值得关注的是，今年以来，国内文学刊物已多次发出致歉声明，核心指向高度一致：作品雷同、洗稿、抄袭。\n\n　　近年文坛常见隐蔽式洗稿\n\n　　发布致歉声明的，都是大家耳熟能详的知名文学刊物。\r\n\n　　今年10月，《人民文学》第9期短篇小说《秋宵梦觉》被读者比对指出文本雷同，经编辑部核实，约三百字语段在场景书写、情绪氛围与句式表达上与日本作家井上靖作品高度相近。于是，刊物致歉，追回稿酬。\n\n　　今年11月，《人民文学》第10期散文《湘江北去》被指整体文意、行文脉络、段落结构与前人已发表作品高度重合。与普通字句抄袭不同，该作品通过改写语序、替换关键词、微调表达的方式规避机器查重——这正是近年文坛愈发常见的隐蔽式洗稿。为此，《人民文学》决定追回稿酬、撤销推介宣传，并对作者设置投稿禁发期。\n\n　　“文学期刊接二连三发致歉声明，会给其带来压力，这不是偶发性的舆论压力，而是一种结构性的制度压力。”《诗刊》社主编李少君的判断直指要害，它暴露了一个更深层的问题：传统的三审制在面对“洗稿”和“AI润色”时，防线正在系统性失守。\n\n　　在李少君看来，抄袭尚可依赖查重工具和编辑的阅读积累来发现，但洗稿是对原文本进行结构性改写，查重工具往往难以触发警报。李少君还指出，AI生成后的人工修改的文本，更是介于“原创”与“非原创”之间的灰色地带。“当最近两家标杆文学刊物在相近时间内被同一种方式击中，其他刊物的直接反应必然是：下一个会不会是我？我的审稿流程能不能挡住这种稿件？”\n\n　　坚决对抄袭和AI洗稿说“不”\n\n　　“今年以来接到的AI稿频次明显增加——表面流畅漂亮、旁征博引、词句准确，细看却空洞、模式化、堆砌意象。”《北京文学》执行主编师力斌如此说道。\n\n　　师力斌发现，AI稿件爱写一对男女到著名景区度假的场景。“一旦让它写北京某个村、某条街道，就会露马脚。”在他看来，缺乏私人性、特殊性、细节，是AI稿的致命伤。因此，在编辑部内部其实已经形成默契，凡是心存怀疑的来稿，一概不用。“因此，我们看到真人写的、哪怕不完美的文字，反而会欣喜，会觉得宝贵。”师力斌说。\n\n　　其实，不少文学期刊已纷纷启用辅助手段，进行防范。李少君介绍，《诗刊》的动作在诗歌刊物中启动较早，可概括为“工具筛查+黑名单+明确后果”三条线。“《诗刊》社很早即公开处理过几起抄袭事件，要求作者解释是否抄袭，属实则立即收回稿费、永不录用，对AI代笔同样如此。”不仅如此，在2026年全国文学报刊联盟框架下，《诗刊》作为理事长单位，参与了推动《原创承诺书》和行业统一规范的工作。“我们一直向投稿者传递‘这里不欢迎抄袭和AI代笔’的明确信号。”李少君说。\n\n　　值得关注的是，全国文学报刊联盟近期已发布通知，要求各成员单位刊发作品前，必须由作者签署《原创承诺书》，对作品原创性、著作权归属、引文规范、AI创作边界等作出郑重承诺，同时列明违背承诺所要承担的各类后果。“《原创承诺书》的落地，是一个起点，行业第一次有了统一的契约工具。”李少君说。\n\n　　编辑判断不可替代\n\n　　技术辅助手段和《原创承诺书》，是否能成为文学期刊真正捍卫“原创”的依靠，专业人士给出了答案。\n\n　　中国文字著作权协会常务副会长兼总干事张洪波透露，文著协就曾接受过知名文学期刊的咨询，为何利用学术不端检测系统依然查不出剽窃。张洪波就此向北京日报记者进行了一番普及，“检测系统可以查出来的政策、法规或者百科知识、常识，都属于不受版权保护的。而组合式抄袭、转换式使用，技术上很难发现，因此，查重技术仅仅是一种辅助。”文学期刊编辑张女士也向记者表明观点，“文学不像学术论文有规范、好鉴定。查重软件对文学不灵，人家用一句、几个字，根本查不出来。文学鉴定难就难在五花八门。”\n\n　　“几十年前的文学期刊和出版社的老编辑都是各领域的专家，对本领域的作者创作特点和行业动态非常熟悉，一打眼就能知道是不是抄袭、剽窃，或者引用了谁的观点。”张洪波直指，片面地强调依靠某些商业公司的查重系统，想走“捷径”，必然要被技术带偏。\n\n　　不仅如此，张洪波还强调，“期刊仅仅公开赔礼道歉还不足够，应该采取措施加强三审三校，一定要在期刊内部形成相关的制度，提升编辑的专业素养和版权法律意识。”同时，还应当以公告函等形式提示作者注意相关问题，如创作时对于他人作品的合理使用。针对如今存在的很多AI创作，也要考虑是否允许文学创作当中借助人工智能，并要求作者对人工智能的应用程度作出适当声明。否则，一旦造成侵权，期刊和抄袭他人作品的作者都要承担法律责任。\n\n　　延伸\n\n　　合理使用不等于随意使用\n\n　　“普通人理解的抄袭、剽窃，与文学界的行业标准、《中华人民共和国著作权法》(以下简称《著作权法》)意义上的抄袭、剽窃，并不一样。”中国文字著作权协会常务副会长兼总干事张洪波特别提示道。\n\n　　张洪波进行了一番梳理，根据《著作权法》规定，作者若对已发表、出版的作品，作为观点或内容来引用，要符合《著作权法》第24条关于“合理使用”的规定，即为了介绍、说明、评论某一作品，或说明某一问题、观点，可以适当使用已经发表的作品。张洪波说，“合理使用”是指不能构成自己作品的实质或核心部分，不能对原作者构成市场替代。此外，引用别人已发表、已出版的作品，必须标明出处，“引自哪本书、哪篇文章、作者是谁，都要标注清楚”。\n\n　　张洪波特别提醒，任何杂志、报纸在刊发作品时都依法负有审核义务，比如，作者相关作品刊发时，要审核其引用的参考文献或引用别人的作品是否做了合理标注；更关键的是，按照《最高人民法院关于审理著作权民事纠纷案件适用法律若干问题的解释》(2026年修正)，出版者对于出版行为的授权、稿件来源和署名、所编辑出版物的内容负有合理审核的义务。如果文学期刊对所刊发的内容未经过仔细核实，没有鉴别是否存在抄袭、剽窃、引用不当等，就应当为此承担相应的法律责任，即需要公开赔礼道歉、停止侵权；如果造成经济损失，则要给予被侵权者进行经济赔偿甚至精神损害赔偿。 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1887e45adc","title":"校園熱話│成軍半年奪全港醒獅冠軍！錦泰小學家校同心實踐正向教育","url":"https://www.stheadline.com/ohpama/3638515/校園熱話成軍半年奪全港醒獅冠軍錦泰小學家校同心實踐正向教育","summary":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！","summary_short":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！","digest":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間","points":["由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間","隊員每日苦練舞獅頭至腳腫仍堅持不懈，家長更自發擔任「搬運工」及現場打氣團","即睇錦泰小學如何透過傳統非遺醒獅活動結合正向教育，發掘學生品格優勢，培養孩子堅毅精神與責任感"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:15:11+08:00","size":1,"keywords":[],"body":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！隊員每日苦練舞獅頭至腳腫仍堅持不懈，家長更自發擔任「搬運工」及現場打氣團。即睇錦泰小學如何透過傳統非遺醒獅活動結合正向教育，發掘學生品格優勢，培養孩子堅毅精神與責任感！\n家校齊心 舞出最燃正能量\n今年7月，全港學界獅藝錦標賽戰鼓擂響，保良局錦泰小學醒獅隊一舉奪魁。誰曾想到，這支由12名學生組成的醒獅隊，竟才成立半年。對錦泰師生及家長而言，奪冠絕非偶然，是三方鼎力同心、堅毅不屈的真實寫照。這股精氣神，為校園的正向教育點亮了一盞明燈。\n醒獅結合了武術、音樂、舞蹈和工藝，是國家級非物質文化遺產，對於小學生來說，因平日甚少接觸反倒生出好奇。「起初設立醒獅興趣班，是為了豐富學校活動課，加深學生對傳統文化的認識。」錦泰小學負責活動的林嘉榮主任介紹，學校於2025至2026學年第二期課後活動中為六年級開設醒獅循環體驗課。學校根據學生的興趣及初步選拔，一支十二人組的醒獅校隊正式成立。他們當中，有人平時愛跳舞，有人拉得一手好琴，也有人是體育健將，唯獨對醒獅零基礎。\n興趣引領下更能展現才能\n「錦泰的學生思路清晰、做事專注！」說起錦泰小學醒獅隊的學生，具有多年專業教學、裁判經驗的黃嘉勝教練頻頻點讚。黃教練表示，訓練舞獅時，他常常需要拆成不同組作個別訓練，「當我教緊鼓樂時，獅子組的同學會自覺練習，一點時間都唔會浪費。」林嘉榮主任也十分贊同，在興趣引領、專業指導和刻苦訓練的加持下，整個醒獅隊迅速成長，成立一個月後就能上台表演，五個月後第一次參加全港性比賽拿到優異獎，六個月後就拿到冠軍。\n越努力越有成就感，這是學生最大的感觸。醒獅隊成員李俊禧同學表示，當時因為好奇加入，並選擇最需要力量的舞獅頭，「最辛苦的時候，一天中所有的閒暇時間都用來練習，練到腳腫都沒有想過放棄。」獅隨鼓動，獅鼓是整個舞獅的統帥，決定了整個舞獅的節奏及氣勢。李映澄同學憑藉爵士鼓的經驗挑起了獅鼓的重任，她表示，這讓她更加有責任感。\n加入醒獅隊後學生盡顯積極\n家長也助力不少。「每次比賽，我們要帶上成套設備，家長們自發當起了搬運工。」林嘉榮表示，每一次比賽，家長都到現場打氣，給了老師和學生很大的鼓舞。「因為在孩子身上看到了對舞獅的熱愛、堅持和努力，作為家長，哪怕看到他受傷時會心疼，但依然會給予最大的支持。」李俊禧媽媽表示，自從加入醒獅隊，孩子的積極性明顯提升了不少，處事也更有擔當。\n發掘學生的興趣及品格優勢，引導其全心投入，並通過自身努力獲取成就感，是正向教育的核心。保良局錦泰小學吳嘉慧校長表示，她非常欣慰地看到學生、老師、家長在角色上的同頻共振，為學校的正向教育樹立了優秀典範。\n文、圖：保良局錦泰小學","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c24be478611","title":"英超｜名宿哈索賓基勸車路士放棄阿歷斯史葛 改斟阿仙奴冠軍中場蘇比文迪","url":"https://www.stheadline.com/football-news/3638976/英超名宿哈索賓基勸車路士放棄阿歷斯史葛-改斟阿仙奴冠軍中場蘇比文迪","summary":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。","summary_short":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。","digest":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下…","points":["英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下…","針對藍戰士有意重燃對般尼茅夫23歲中場新星阿歷斯史葛（Alex Scott）的追求…","哈索賓基強調，球隊目前極需一位現成的世界級冠軍贏家來穩定軍心，而非繼續囤積年輕新人"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:00:06+08:00","size":1,"keywords":[],"body":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。針對藍戰士有意重燃對般尼茅夫23歲中場新星阿歷斯史葛（Alex Scott）的追求，車路士名宿哈索賓基（Jimmy Floyd Hasselbaink）日前高調獻計，強烈敦促舊東家立即放棄史葛，改斟阿仙奴陣中的西班牙失意防守中場蘇比文迪（Martin Zubimendi）。哈索賓基強調，球隊目前極需一位現成的世界級冠軍贏家來穩定軍心，而非繼續囤積年輕新人。\n促引進現成贏家重塑威望\n車路士今夏雖大肆擴軍，但隨著安素費南迪斯及安祖山度士離隊，中場防線僅靠摩西斯卡些度與剛傷癒的羅美奧拉維亞苦撐。\n哈索賓基接受《Canada Sports Betting》專訪時直言，23歲的史葛雖具備潛力，但無法解決車路士的燃眉之急：「我更希望看到球隊簽入一位經驗豐富的頂級國腳。沙比阿朗素麾下已有太多驚世駭俗的年輕人，他們現在需要的是那種一踏進科巴姆（Cobham）訓練基地，就能讓所有人驚呼『哇，我們這次是玩真的』的領袖。車路士必須引進擁有奪冠履歷的現成贏家，才能縮短重奪大賽錦標的陣痛期。」\n哈索賓基：沙比阿朗素深知其價值\n適逢蘇比文迪因難以撼動迪格蘭賴斯及新援般奴古馬雷斯的位置，今季在阿仙奴長居後備，已被槍手標價6,000萬鎊放售。\n哈索賓基一針見血地指出，這正是車路士截劫的黃金契機：「如果一月有機會從阿仙奴帶走蘇比文迪，車路士必須毫不猶豫地出手。他是歐洲國家盃及世界盃的雙料冠軍成員，渾身散發著無與倫比的冷靜與階級氣質。更重要的是，沙比阿朗素在皇家蘇斯達時期便對他非常了解。去吧，現在就去把他簽下來！」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c65bb9354dd","title":"理大入學攻略2027｜PolyU 10個最多人申請/競爭最激烈JUPAS課程 附最新收分+計分方法","url":"https://www.stheadline.com/admission-guide/3636044/理大入學攻略2027PolyU-10個最多人申請競爭最激烈JUPAS課程-附最新收分計分方法","summary":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。","summary_short":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。","digest":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試考生需要把握時間…","points":["大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請…","《星島教育》綜合了本港8所教資會資助大學2026年的收生資料，整理出各個課程的競爭情況","本文按照理大提供的數據，整合出該校5個最多人申請的課程（以Band A計算）…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T06:45:01+08:00","size":1,"keywords":[],"body":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。《星島教育》綜合了本港8所教資會資助大學2026年的收生資料，整理出各個課程的競爭情況。本文按照理大提供的數據，整合出該校5個最多人申請的課程（以Band A計算），及競爭最激烈的5個課程（以2026年的Band A申請人數對比學額計算），同時亦收錄關課程的計分方法及最新收生分數，助同學掌握最新升學形勢，增加入讀心儀學系的機會。\n理工大學5個最多人申請JUPAS課程\n在2026學年，最多申請者報讀的5個理
