<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

7+08:00","size":5,"keywords":[],"body":"國家主席習近平夫人彭麗媛11月19日上午在深圳灣文化廣場，與出席亞太經合組織第三十三次領導人非正式會議的多個經濟體領導人或代表配偶舉行集體活動，一同參觀「嶺南非遺傳承與創新」主題展。彭麗媛表示，嶺南文化是中華文化重要支脈，展現了人與自然和合共生的智慧，中方願同各方加強文化交流互鑑。\n新華社及央視新聞報道，彭麗媛熱情迎接來賓並同她們合影。小孩以醒獅和英歌舞歡迎嘉賓到來。彭麗媛邀請來賓參觀主題展，眾人駐足觀看非遺工藝品，欣賞嶺南特色小型文藝展示，並體驗數碼化騎樓街景。\n相關新聞：中國觀察︱對特朗普高市的「超規格」待遇\n彭麗媛同亞太經合組織經濟體領導人或代表配偶參觀「嶺南非遺傳承與創新」主題展。 新華社\n彭麗媛同亞太經合組織經濟體領導人或代表配偶參觀「嶺南非遺傳承與創新」主題展。 新華社\n彭麗媛同亞太經合組織經濟體領導人或代表配偶參觀「嶺南非遺傳承與創新」主題展。 新華社\n彭麗媛同亞太經合組織經濟體領導人或代表配偶參觀「嶺南非遺傳承與創新」主題展。 新華社\n來賓讚嘆期待深化交流\n彭麗媛同來賓親切交流。來賓們對中華傳統文化悠久歷史和深厚底蘊讚不絕口，對中國式現代化發展成就深表欽佩，期待同中方深化交流合作。參觀結束時，彭麗媛同來賓們合影留念並親切道別。\n相關新聞：深圳APEC︱中美俄發和平宣言 學者：國際格局轉向 多個大國共同發揮影響力︱拆局\n出席配偶涵蓋多個經濟體\n參加上述活動的包括智利總統夫人阿德里亞索拉、韓國總統夫人金惠景、菲律賓總統夫人麗莎、越共中央總書記兼國家主席夫人吳芳璃、新加坡總理夫人呂子蕊、泰國總理夫人塔娜儂，以及中國台北經濟領導人代表夫人葉紫華等。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC｜彭麗媛與「夫人團」參觀嶺南非遺展 嘉賓盛讚中華文化底蘊","url":"https://www.stheadline.com/realtime-china/3639171/深圳APEC彭麗媛與夫人團參觀嶺南非遺展-嘉賓盛讚中華文化底蘊","source_display":"星島頭條","published_at":"2026-11-20T11:22:17+08:00","category":"內地","digest":"國家主席習近平夫人彭麗媛11月19日上午在深圳灣文化廣場…"},{"title":"深圳APEC．有片｜習近平特朗普扶梯上互助「挽手」畫面熱傳","url":"https://www.stheadline.com/realtime-china/3639145/深圳APEC有片習近平特朗普扶梯上互助挽手畫面熱傳","source_display":"星島頭條","published_at":"2026-11-20T07:03:53+08:00","category":"內地","digest":"亞太經合組織第三十三次領導人非正式會議周四在深圳國際交流中心舉行…"},{"title":"深圳APEC｜特朗普低頭閉目疑打瞌睡？白宮稱正看文件","url":"https://www.stheadline.com/realtime-world/3639139/深圳APEC特朗普低頭閉目疑打瞌睡白宮稱正看文件","source_display":"星島頭條","published_at":"2026-11-20T03:36:51+08:00","category":"國際","digest":"美國總統特朗普周四出席深圳亞太經合組織領導人非正式會議期間，被直播鏡頭拍到頭部低垂…"},{"title":"深圳APEC｜王毅點評會議成果 「達成『深圳展望』里程碑」","url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議成果-達成深圳展望里程碑","source_display":"星島頭條","published_at":"2026-11-19T23:10:15+08:00","category":"內地","digest":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果"},{"title":"深圳APEC｜王毅點評會議6項成果 「達成《深圳展望》里程碑」","url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議6項成果-達成深圳展望里程碑","source_display":"星島頭條","published_at":" 羅斯、美國，一同全面高效落實這次會議達成的共識，透過工作層保持溝通和協調。\n\n美國總統特朗普接受全國廣播公司的電話訪問，稱跟國家主席習近平討論發展「超級智能」，即人工智能的相關議題，包括設立防護機制。\n\n特朗普又指，三方會晤讓他跟習近平與普京建立極好的關係，若果10分是滿分，他會給12分，並計劃在美國東岸時間周五中午，在白宮召開記者會，總結訪華及菲律賓行程。\n\n普京早前在記者會表示，在亞太經合組織框架內合作，對俄羅斯有重大意義。他亦跟中美元首討論發展人工智能問題，同意以安全角度防範任何威脅。","image":"https://pro-vod-cdn.tvb.com/081e6b2fab6c4865b298687c2525459d/snapshots/493841e1f8a540c9bf88ef22d5ada7f5-00008.jpg","video":"https://pro-vod-cdn.tvb.com/081e6b2fab6c4865b298687c2525459d/646997a62f8a4f0594aa2ad975cf6f75-19b99ee5fd5cd11464a3ccbc4f1016a5-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/081e6b2fab6c4865b298687c2525459d/snapshots/493841e1f8a540c9bf88ef22d5ada7f5-00008.jpg","lang":"zh-Hant","items":[{"title":"中俄美元首會晤｜特朗普擬周六開記者會 王毅指三方同意防止衝突對抗","url":"https://news.tvb.com/tc/1207355-中俄美元首會晤特朗普擬周六開記者會王毅指三方同意防止衝突對抗","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T06:13+08:00","category":"國際","digest":"美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅…"},{"title":"中俄美元首會晤｜王毅指會晤為和平峰會 氣氛坦誠友好富有建設性","url":"https://news.tvb.com/tc/1207336-中俄美元首會晤王毅指會晤為和平峰會氣氛坦誠友好富有建設性","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:59:00+08:00","category":"兩岸","digest":"外長王毅表示，中俄美元首會晤是和平峰會，氣氛坦誠友好，富有建設性"},{"title":"中俄美元首會晤｜王毅指會晤為和平峰會 氣氛坦誠友好富建設性","url":"https://news.tvb.com/tc/1207336-中俄美元首會晤王毅指會晤為和平峰會氣氛坦誠友好富建設性","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:59+08:00","category":"兩岸","digest":"外長王毅表示，中俄美元首會晤是和平峰會，氣氛坦誠友好，富有建設性"},{"title":"中俄美元首會晤｜和平宣言涉核風險等 認為國際刑事法院不得濫用管轄權","url":"https://news.tvb.com/tc/1207335-中俄美元首會晤和平宣言涉核風險等認為國際刑事法院不得濫用管轄權","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:58+08:00","category":"兩岸","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束歷來首場中俄美元首會晤…"}],"cross":{"total":4,"angles":[{"point":"外長王毅表示，中俄美元首會晤是和平峰會，氣氛坦誠友好，富有建設性","sources":["无綫新闻 TVB News","无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207336-中俄美元首會晤王毅指會晤為和平峰會氣氛坦誠友好富有建設性"},{"point":"美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207355-中俄美元首會晤特朗普擬周六開記者會王毅指三方同意 30：開放成就世界矚目","url":"https://news.tvb.com/tc/1207371-社評摘要明報中美俄元首會談意義大AM730開放成就世界矚目","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:39+08:00","category":"港聞","digest":"明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極…"},{"title":"社評摘要｜大公：中國力量守護世界和平／經濟：三國聚首設護欄","url":"https://news.tvb.com/tc/1207364-社評摘要大公中國力量守護世界和平經濟三國聚首設護欄","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:03+08:00","category":"港聞","digest":"大公報社評：APEC深圳會議周昨日進入最高潮，也是成果最為豐碩的一天…"}],"cross":{"total":2,"angles":[{"point":"大公報社評：APEC深圳會議周昨日進入最高潮，也是成果最為豐碩的一天…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207364-社評摘要大公中國力量守護世界和平經濟三國聚首設護欄"},{"point":"明報社評：中美俄元首在深圳舉行歷史性的三方會談，國家主席習近平形容會晤積極…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207371-社評摘要明報中美俄元首會談意義大AM730開放成就世界矚目"}]}}],"sections":[{"name":"港聞","total":29,"items":[{"id":"cdc027080e5","title":"香港金牛｜CBA俱樂部盃響頭炮 美臣鍾斯23分8助攻領軍締NBL球隊首勝","url":"https://www.stheadline.com/basketball-zone/3639200/香港金牛CBA俱樂部盃響頭炮-美臣鍾斯23分8助攻領軍締NBL球隊首勝","summary":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事，憑藉外援美臣鍾斯（Mason Jones）交出全場最高23分及8次助攻的出色表現，以77:72擊退長白山恩都里…","summary_short":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","digest":"香港金牛籃球隊於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","points":["香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","志在衝擊CBA的香港金牛，今仗甫開賽迅速入局","美臣鍾斯不僅頻頻切入得分，更兩度助攻另一外援所羅門（Richard Solomon III）…"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:38:52+08:00","size":1,"keywords":[],"body":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事，憑藉外援美臣鍾斯（Mason Jones）交出全場最高23分及8次助攻的出色表現，以77:72擊退長白山恩都里，旗開得勝，更成為今屆賽事首支報捷的NBL球隊。\n志在衝擊CBA的香港金牛，今仗甫開賽迅速入局。美臣鍾斯不僅頻頻切入得分，更兩度助攻另一外援所羅門（Richard Solomon III）上演「拆你屋」入樽，引爆全場氣氛；次節新兵石奎亦在抄截後快攻得手，順利取得職業生涯首分。上半場比賽十分激烈，香港金牛僅僅以43:40領先對手返回更衣室。\n換邊後雙方戰況膠著，進入決勝的第四節，領先的金牛一度出現混亂，陷入被對手狂追比分的危機。關鍵時刻，新加盟的楊和挺身而出，連番命中中距離及三分球穩住陣腳，最終金牛頂住壓力，以77:72保住勝局。除美臣鍾斯外，所羅門今仗亦貢獻14分及15個籃板的「雙雙」數據，楊和則有8分進帳。\n主教練解立彬賽後感謝CBA公司給予NBL球隊參與高強度比賽的機會：「上半場戰況激烈，下半場大家學會以團隊拿下比賽。過程中確實有很多混亂的地方，我們需要在往後的比賽和訓練中，解決今天出現的問題。」\n贏波功臣美臣鍾斯則喜言：「這是我們今季第一場比賽，很高興能拿下首勝。正如教練所言，每一天都是新課題。我們一直按計劃努力訓練，表現比大家預期好很多。去年我們在俱樂部盃成績不錯，我知道今年外界的期待會更高，我們會逐日做好，繼續保持進步。」香港金牛將於今日（20日）下午3時30分迎戰廣州智都集團，力爭兩連勝。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cda43d3a80c","title":"選委會選舉2026．提名全名單︱累計接獲1155份提名 至少31個界別分組有競爭 社福界25人爭15席","url":"https://www.stheadline.com/politics/3626329/選委會選舉2026提名全名單累計接獲1155份提名-至少31個界別分組有競爭-社福界25人爭15席","summary":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。","summary_short":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。","digest":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束…","points":["選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行","提名期10月20日下午5時結束，總數共接獲1115份候選人提名及40份指定團體提名表格…","其中，第一界別工商金融界，18個分組都出現超額競"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:23:41+08:00","size":1,"keywords":[],"body":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。提名期10月20日下午5時結束，總數共接獲1115份候選人提名及40份指定團體提名表格，其中31個界別分組已超額報名，將會有競爭。其中，第一界別工商金融界，18個分組都出現超額競；第二界別專業界，10個分組中，有8個出現競爭，競爭最激烈是社會福利界，有25人爭15席。\n2026選委會選舉名單：\n 第一界別（工商及金融）\n 飲食界\n 商界（第一）\n 商界（第二）\n 商界（第三）\n 香港僱主聯合會\n 金融界\n 金融服務界\n 酒店界\n 進出口界\n 工業界（第一）\n 工業界（第二）\n 保險界\n 地產及建造界\n 中小企業界\n 紡織及製衣界\n 旅遊界\n 航運交通界\n 批發及零售界\n\n 第二界別（專業界）\n 會計界\n 建築、測量、都市規劃及園境界\n 中醫界\n 教育界\n 工程界\n 法律界\n 醫學及衞生服務界\n 社會福利界\n 體育、演藝、文化及出版界\n 科技創新界\n\n 第三界別（基層及勞工）\n 漁農界\n 同鄉社團\n 基層社團\n 勞工界\n 宗教界\n\n 第四界別（立法會、地區組織等）\n 鄉議局\n 港九地區三會\n 新界地區三會\n 立法會議員\n 內地港人團體代表\n\n 第五界別（港區全國人大政協及全國性團體代表）\n 全國性團體\n 港區人大政協\n\n相關新聞： 選舉委員會界別分組換屆選舉11.22舉行 提名期10.7至10.20\n相關新聞： 大棋盤｜選委會改選 部分工商界別提前協調名單 富商家族人數料續設限\n第一界別（工商及金融）\n 總席位數：300席\n 選舉產生席位：300席\n 目前報名總數：342人\n 超額競逐組別：17個\n飲食界\n 選舉產生席位：16\n 17人（超額1人）\n凌偉業、楊浩宏、胡珠、胡振華、譚家良、江志恒、吳子文、楊位醒、鄭栢文、陳家強、盧浩宏、鍾偉平、盛智文、莊裕坤、楊振年、吳德曉、王偉樑\n商界（第一）\n 選舉產生席位：17\n 19人（超額2人）\nBRADLEY Guy Martin Coutts、楊偉添、霍啟山、欣榮、李家聰、余國賢、楊美珍、陳豪賢、高美懿、蘇裕康、馮玉麟、梁兆基、于健安、洪丕正、阮蘇少媚、林健鋒、陳凱、陳細明、伍俊達\n商界（第二）\n 選舉產生席位：17\n 19人（超額2人）\n楊華勇、柯家洋、謝湧海、陳斌、高敏堅、陳幼南、莊學山、邱建新、伍淑清、楊燕芝、楊振鑫、李德剛、黃楚恒、葉少明、王彭彥、方添輝、王淑慈、周雯玲、王紹基\n商界（第三）\n 選舉產生席位：17\n 21人（超額4人）\n應越、褚卓倫、趙爽、郭 "2026-11-20T11:06:40+08:00","size":1,"keywords":[],"body":"23歲女瑜伽導師周慧賢（Aqua）4年前遭前男友以名牌手袋絲巾餌誘到尖沙嘴麗思卡爾頓酒店，其後被發現倒斃浴缸內，身中至少42刀。32歲前男友勞浚銘否認1項謀殺罪，5男2女陪審團昨退庭商議約5小時後，一致裁定被告謀殺罪成。法官郭啟安今早於高等法院判刑，斥責被告用最殘忍的方式殺害死者，可以想像死者死前必然十分痛苦及極度恐懼，依例判處終身監禁。\n被告自撰求情信稱殺害了唯一愛過的女人\n案發時28歲被告勞浚銘報稱無業，被控於2022年6月29日至30日期間在香港，謀殺周慧賢。陪審團昨一致裁定被告謀殺罪成，被告聞判時表現平靜。控方透露被告現年32歲，過去沒有案底，曾任職法務助理，被捕時無業。\n辯方今引述被告求情信，當中向事主及其親友致歉，無法保護死者之餘，更向公眾呈現了其負面形象，被告承認錯誤，殺害了此生唯一愛過的女人，案發後在私人律師勸說下自首。\n郭官指陪審團昨退庭商議僅5小時，可見完全拒絕被告辯解，認為就算死者有挑釁被告，常人也不會如被告般用刀殺害死者。郭官斥責被告用最殘忍的方式殺害死者，可以想像死者死前必然十分痛苦及極度恐懼，並向承受悲痛的死者親友致意。\n案件編號：HCCC148/2024\n法庭記者：陳子豪","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb7f1de7217","title":"荔枝角青山道工廈起火 濃煙密佈 消防救熄 2人不適","url":"https://www.stheadline.com/breaking-news/3639183/荔枝角青山道工廈起火-濃煙密佈-消防救熄-2人不適","summary":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火，其中一名報案人指自己正身在起火單位內，消防接報派出搜救隊到場，並開喉撲救…","summary_short":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火…","digest":"荔枝角青山道嘉名工廠大廈，今早上10時34分，警方接獲多個報案…","points":["荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案…","火警中，初步有兩人不適，其中一人須戴上氧氣罩送院","上址為7樓一個工作室及平台花園，網上影片所見，起火位置火光熊熊，大廈的頂部噴出濃煙…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:06:16+08:00","size":1,"keywords":[],"body":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火，其中一名報案人指自己正身在起火單位內，消防接報派出搜救隊到場，並開喉撲救，約15分鐘將火救熄。火警中，初步有兩人不適，其中一人須戴上氧氣罩送院。 上址為7樓一個工作室及平台花園，網上影片所見，起火位置火光熊熊，大廈的頂部噴出濃煙，離遠亦見到火警工廈附近一帶煙霧瀰漫。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc24bb4f944","title":"WhatsApp 騎劫騙案有新招？騙徒複製群組扮朋友促過數 專家揭騎劫方法 教路3方法防中招","url":"https://www.stheadline.com/society/3638854/WhatsApp-騎劫騙案有新招騙徒複製群組扮朋友促過數-專家揭騎劫方法-教路3方法防中招","summary":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。","summary_short":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。","digest":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢","points":["WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢","有網民的WhatsApp被騙徒騎劫，騙徒從網民的WhatsApp 帳號知道所有群組名稱…","網民形容事件「恐怖」，並將事發情發布在社交平台「警世」"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:38+08:00","size":1,"keywords":[],"body":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。有網民的WhatsApp被騙徒騎劫，騙徒從網民的WhatsApp 帳號知道所有群組名稱，然後選擇其中一個只有3個人的群組，新增一個以該群組同名的群組，再用兩個假帳戶假扮網民的朋友，要求網民轉帳$27300，同時騙徒亦以該網民的名義，向網民的親戚朋友借錢。網民形容事件「恐怖」，並將事發情發布在社交平台「警世」。\n複製朋友3人群組 扮朋友促過數$27,300\n網民發文稱，指自己本來有一個包含3人的群組，群組成員包括A和B兩人，日前(18日)下午突然收到A在群組發信息要求B過數 $27,300，但B稱無法轉數，而A重複指「好急」，要求當日轉數。網民隨口搭話，指「咁似詐騙嘅？」而A和B好自然和網民對答，語氣和互動「好似我平時同佢哋傾偈咁。」其後兩名「朋友」詢問網民可否幫忙過數，因為他們正在上班，網民見二人十分心急，便將過數資料發給家人幫手過數，家人看完後反問「你係咪俾人呃錢？」其時網民才恍然大悟，查看群組的信息紀錄，發現只有昨日的紀錄，同時各自的私聊同樣只有昨日的記錄。\n扮網民向WhatsApp名單求過數1萬\n網民再查看WhatsApp群組，發現同時有兩個一模一樣的群組，包含騙徒的群組的兩位「朋友」都使用陌生的電話號碼，只是挪用真朋友的名稱和頭像來騙取網民信任；同時騙徒亦有在同一時間向網民的家人朋友發信息，要求過數1萬元到一個陌生的帳戶。\n方保僑估計網民使用WhatsApp網頁致戶口被騎劫\n香港資訊科技商會榮譽會長方保僑接受《星島頭條》電話訪問時，估計網民在使用WhatsApp網頁登入版面時被騙徒騎劫帳戶，因而有能力瀏覽網民WhatsApp內的所有資料，並取得掌控權，可以隨時新增群組，再用兩個假戶口扮作朋友，模仿平時的說話語氣，以增強騙財的說服力。\n點擊不明連結可令瀏覽器中毒 騙徒可遠端操作電腦\n至於WhatsApp帳戶被騎劫的原因，方保僑表示，過往Whatsapp 帳戶被騙徒騎劫主要是由於市民在搜索引擎搜索時，往往按最開頭的連結，而在搜索引擎賣廣告可令搜索結果置頂，因而登入由騙徒製作的假WhatsApp網頁，掃描惡意二維碼，騙徒隨即取得用戶連線資料，但現時搜索引擎已盡量攔截虛假網站廣告，因此現時較少因此方法被騎劫；他估計網民有機會點擊不明連結，令到瀏覽器中毒，使騙徒可以遠端操作電腦，因而獲得WhatsApp網頁的使用權。\n教路三方法防止WhatsApp被騎劫\n方保僑提醒，如要防止WhatsApp帳戶被騎劫，在使用網上版WhatsApp後切記要隨即登出網頁，不宜長期保止登入狀態；另外，亦可留意WhatsApp已連結裝置，若發現有不明裝置連結，可即時將該裝置登出，並重裝WhatsApp；另外，亦可使用防毒及防間諜軟件掃瞄電腦，如發現有木馬程式要立即進行殺毒，以免電腦被騙徒控制。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ceff8e70355","title":"警隊進駐抖音三周年累計吸粉500萬 發布飛虎隊實訓片「一哥」周一鳴出鏡","url":"https://www.stheadline.com/breaking-news/3639149/警隊進駐抖音三周年累計吸粉500萬-發布飛虎隊實訓片一哥周一鳴出鏡","summary":"香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬。","summary_short":"香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬。","digest":"香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬","points":["香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬","警方在抖音、小紅書及微博等多個社交平台同步發布飛虎隊（特別任務連）海陸空三棲實訓宣傳片…","感謝500萬粉絲支持 勉勵一起邁向新征程"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:14:01+08:00","size":1,"keywords":[],"body":"香港警察進駐內地社交平台「抖音」三周年，帳號累計粉絲人數突破500萬。警方在抖音、小紅書及微博等多個社交平台同步發布飛虎隊（特別任務連）海陸空三棲實訓宣傳片，感謝網民及粉絲的支持。\n感謝500萬粉絲支持 勉勵一起邁向新征程\n香港警察官方抖音帳號發文表示，適逢入駐抖音三周年，「飛虎隊如約而至」，並向500萬名粉絲致謝，寄語「一起邁向新征程」。警方發放的飛虎隊（特別任務連）海陸空三棲實訓宣傳片，展示隊員訓練時勇猛雄姿，配上強勁背景音樂，質素猶如警匪電影，其中「一哥」警務處處長周一鳴亦粉墨登場，有份演出。\n展示飛虎隊海陸空實戰標準 強調守護初心如一\n警方同步在小紅書及微博上載有關正片，介紹飛虎隊「獵鷹行動」海陸空實訓現場。帖文形容訓練「沒有彩排，只有實戰標準」，展現飛虎隊員在「陸地突入的果斷，海上突擊的迅猛，空中索降的從容」。\n警方在帖文中強調，飛虎隊透過不同維度錘煉特警力量，面對各種考驗，「萬家安穩，源於長久堅守」、「守護的初心始終如一」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c30a36497d2","title":"天氣｜天文台清晨錄最低氣溫15.3度 為今年入秋以來最低","url":"https://news.tvb.com/tc/1207354-天氣天文台清晨錄最低氣溫153度為今年入秋以來最低","summary":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄，大帽山最低5度。天文台署理高級科學主任黎宏駿指出：「預計今日會是密雲，有幾陣雨，市區氣溫由初時約17度，下降至今日稍後約14度，新界再低一、兩度，吹清勁北至東北風，離岸及高地會吹強風。","summary_short":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄，大帽山最低5度。","digest":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄…","points":["天文台署理高級科學主任黎宏駿指出：「預計今日會是密雲，有幾陣雨，市區氣溫由初時約17度…","在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步","天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T08:13+08:00","size":1,"keywords":[],"body":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄，大帽山最低5度。\n\n天文台署理高級科學主任黎宏駿指出：「預計今日會是密雲，有幾陣雨，市區氣溫由初時約17度，下降至今日稍後約14度，新界再低一、兩度，吹清勁北至東北風，離岸及高地會吹強風。」\n\n在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖。\n\n早上上班上學時間，不少市民穿了外套及頸巾，天文台預料明日早上仍然相當清涼，最低15度，隨後一兩日氣溫稍為回升，下周中期再度轉涼。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/snapshots/9d1a6588a82e469180a6ee5f15cfd348-00006.jpg","video":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/ae111edb665d47bd90ae6ca657947fa8-c65245cd819bec7338d021b7e71b0359-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/snapshots/9d1a6588a82e469180a6ee5f15cfd348-00006.jpg","lang":"zh-Hant"},{"id":"c028816e5f3","title":"宏福苑丨逾96%業主已簽買賣協議 啟德最受歡迎 粉嶺九龍灣已落成項目多人揀","url":"https://www.stheadline.com/society/3638897/宏福苑丨逾96業主已簽買賣協議-啟德最受歡迎-粉嶺九龍灣已落成項目多人揀","summary":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。","summary_short":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。","digest":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權","points":["大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權","房屋局回覆《星島》查詢時透露，截至本月17日，共有1,909戶業主完成簽署《買賣協議》…","1,651戶的業權轉讓已經完成並收到現金或「樓換樓劵」，佔總數83.2%"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:00:00+08:00","size":1,"keywords":[],"body":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。房屋局回覆《星島》查詢時透露，截至本月17日，共有1,909戶業主完成簽署《買賣協議》，佔單位總數96.2%；1,651戶的業權轉讓已經完成並收到現金或「樓換樓劵」，佔總數83.2%；除少數特殊個案外，餘下個案預計於年內完成業權轉讓。\n「特設銷售計劃」中，以啟德啟陽苑最多業主選購，之後是已落成的粉嶺及九龍灣項目。目前已有9位業主完成收樓，有長者成為首位到粉嶺樂嶺軒收樓取鎖匙的宏福苑業主。\n有長者粉嶺上樓取鎖匙 年底遷入\n房協昨日在社媒發布影片，片中見到房協人員陪同長者張女士和家人前往粉嶺樂嶺軒辦理收樓手續及領取鎖匙，一同見證正式收樓。張女士對新居環境表示滿意，稱讚單位景致開揚，且單位無需進行繁複裝修，只需添置基本傢俬電器及加裝長者友善輔助設施，預計今年年底便能正式入伙，與同住的母親及弟弟展開新生活。她感謝社會各界熱心人士支持，以及「一戶一社工」和「解說專隊」成員一直以來的協助。\n相關新聞：宏福苑｜婆婆到粉嶺樂嶺軒收鎖匙 成首位業主收樓 料年底前入伙\n房屋局回覆《星島》查詢時透露，為出售業權的宏福苑業主而設的「特設銷售計劃」，已於9月29日開始按早前透過電腦隨機攪珠方式排列選樓次序的結果分批進行選樓。截至本月17日，共1,627戶，佔申請參與的業主的96%獲邀出席選樓環節，其中1,445戶出席選樓環節，1,410戶已透過「特設銷售計劃」選購或預留新單位。\n啟德已售或預留單位456個\n當中較多人選擇的是預計2028年10月落成的啟德啟陽苑，已售／預留456個單位；其次為房協項目、已落成的粉嶺樂嶺軒，已售／預留278個單位；九龍灣盛緻苑亦已售／預留252個單位。至於2029年12月落成的大埔欣雅苑，已售／預留181個單位。選購已落成的九龍灣盛緻苑及粉嶺樂嶺軒單位的業主，將由今年11月起陸續完成交易及收樓。截至本月17日，已有9位業主完成收樓。\n鄧家彪引述，有居民表示滿意樓宇附近的社區以及交通設施。\n協助宏福居民處理安置工作的工聯會立法會議員鄧家彪表示，能夠在一年內讓約2000個家庭有確切的長遠安居出路，並不容易，當中牽涉到收集意向、複雜的法律程序，以及要兼顧公平性，他認為整個政府跨部門團隊的努力值得肯定。\n他續指，較多人選擇啟德、粉嶺及九龍灣屋苑，反映多數居民重視盡早獲得安居之所，而政府亦做到在符合司法程序、兼顧社會利益與公平性的情況下，盡早安排合適居所。他提到，居民亦同樣重視地理位置，而政府亦並非隨意選擇樓宇，而是盡量貼近居民原有的生活質素，有居民表示滿意樓宇附近的社區以及交通設施。\n羅曉楓(左)引述居民稱，希望新一年可以過得「自在少少」。\n\n大埔區議員羅曉楓表示，政府重視宏福苑居民聲音，多個部門一直為居民提供協助，有居民向他讚揚解說專員解說詳細。羅曉楓引述居民稱，經歷一年，居民都希望新一年可以過得「自在少少」。對於仍有少數業主沒有簽署《買賣協議》，他認為不是全部人都是「死硬派」，相信有部分居民已失聯或已離香港。羅曉楓是選委會選舉參選人，詳細名單請參閱選舉網站。\n相關新聞：\n宏福苑｜「特設銷售計劃」10屋苑價單曝光 最平裕豐苑僅151萬 最貴房協「灝然」達536萬\n宏福苑收購︱《買賣協議》限期昨日屆滿 93.2%業主簽署 房屋局將酌情處理特殊個案","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbd0a5ab3e9","title":"元朗大馬路單車紙皮起火 火舌逼近垃圾桶 途人合力移走防蔓延","url":"https://www.stheadline.com/breaking-news/3639138/元朗大馬路單車紙皮起火-火舌逼近垃圾桶-途人合力移走防蔓延","summary":"元朗大馬路對開行人路發生火警。","summary_short":"元朗大馬路對開行人路發生火警。","digest":"元朗大馬路對開行人路發生火警","points":["元朗大馬路對開行人路發生火警","周四（19日）網上流傳一段影片，顯示路邊一個垃圾桶旁邊有紙皮及單車起火，火勢猛烈","多名途人見狀上前協助移走垃圾桶及單車，防止火勢蔓延，情況驚險"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:54:03+08:00","size":1,"keywords":[],"body":"元朗大馬路對開行人路發生火警。周四（19日）網上流傳一段影片，顯示路邊一個垃圾桶旁邊有紙皮及單車起火，火勢猛烈。多名途人見狀上前協助移走垃圾桶及單車，防止火勢蔓延，情況驚險。\n火勢猛烈逼近垃圾桶 兩名市民上前移開\n網傳片段可見，事發地點位於元朗大馬路對開行人路，一個垃圾桶旁邊的紙皮及單車陷入火海，現場火勢猛烈，火舌一度逼近垃圾桶。\n有兩名市民見狀後，隨即上前將垃圾桶移開；另有途人協助搬走鎖在鐵欄的單車，避免火勢進一步擴大。\n片段未有交代確實事發日期及時間。據了解，警方及消防初步未有接獲相關報案。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c106916d806","title":"屯門雅都花園第3座疑爆食水管停水逾兩日 住戶不滿垃圾房旁取水","url":"https://www.stheadline.com/breaking-news/3639137/屯門雅都花園第3座疑爆食水管停水逾兩日-住戶不滿垃圾房旁取水","summary":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。","summary_short":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。","digest":"屯門雅都花園第3座自本周二起疑因食水管爆裂緊急停水，至今仍未恢復供水","points":["屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水","事件引起居民不滿，批評初期未獲妥善應急安排，需在環境惡劣的垃圾房旁取水","涉事第3座本周二上午疑因地下供水上天台的水缸輸喉管爆裂，導致整座大廈停水，樓下商場則未受影響"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:38:41+08:00","size":1,"keywords":[],"body":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。事件引起居民不滿，批評初期未獲妥善應急安排，需在環境惡劣的垃圾房旁取水。\n疑地下輸喉管爆裂停水 商場未受影響\n據悉，涉事第3座本周二上午疑因地下供水上天台的水缸輸喉管爆裂，導致整座大廈停水，樓下商場則未受影響。\n今日（20日）凌晨現場可見，大廈內貼有通告通知住客停水及臨時供水位置。\n管理公司稱招標需時一個月 區議員介入設臨時取水點\n有住客反映，居民曾向管理處及業主立案法團反映問題，惟未獲應急安排，低層住戶一度要在環境惡劣的垃圾房旁取水。據了解，管理公司曾表示「要按正常程序向政府招標，一個月後，居民才有食水」。\n區議員及支援團隊其後介入事件，在第3座2樓平台設置臨時取水點，供受影響的1至14樓居民應急。據悉，維修人員需由第1及第2座駁水至第3座，再接駁至地下垃圾房旁及大廈平台位置裝設臨時供水。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb4dc49587b","title":"山頂柯士甸山道獨立屋遇竊 賊人撬窗掠4個Hermès手袋值約15萬","url":"https://www.stheadline.com/breaking-news/3639136/山頂柯士甸山道獨立屋遇竊-賊人撬窗掠4個Hermès手袋值約15萬","summary":"山頂柯士甸山道發生爆竊案。","summary_short":"山頂柯士甸山道發生爆竊案。","digest":"山頂柯士甸山道發生爆竊案","points":["山頂柯士甸山道發生爆竊案","昨午（19日）5時許，警方接獲一名外傭報案，指柯士甸山道24號至28號一幢獨立屋懷疑遭賊人潛…","警員接報到場調查，發現上址一間房間的窗戶被撬開"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:30:43+08:00","size":1,"keywords":[],"body":"山頂柯士甸山道發生爆竊案。昨午（19日）5時許，警方接獲一名外傭報案，指柯士甸山道24號至28號一幢獨立屋懷疑遭賊人潛入爆竊。 警員接報到場調查，發現上址一間房間的窗戶被撬開。經初步點算，相信屋內有4個名牌手袋失去。 據悉，4個失竊手袋均為Hermès，總值約15萬元。 警方經初步調查後，將案件列作爆竊，交由中區警區刑事調查隊第一隊跟進，暫時未有人被捕。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4276738a95","title":"香港仔利群商場大鼠當眾行走 網民慨嘆環境變差","url":"https://www.stheadline.com/breaking-news/3639130/香港仔利群商場大鼠當眾行走-網民慨嘆環境變差","summary":"香港仔利群商場疑出現大鼠出沒。","summary_short":"香港仔利群商場疑出現大鼠出沒。","digest":"香港仔利群商場疑出現大鼠出沒","points":["香港仔利群商場疑出現大鼠出沒","周四（19日）有網民在社交平台發文，指在該商場地下電梯位置目擊大鼠行走，引起網民熱議","網民指傍晚6時半目擊 大鼠神色自若"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:11:31+08:00","size":1,"keywords":[],"body":"香港仔利群商場疑出現大鼠出沒。周四（19日）有網民在社交平台發文，指在該商場地下電梯位置目擊大鼠行走，引起網民熱議。\n網民指傍晚6時半目擊 大鼠神色自若\n有網民昨日（19日）在Facebook群組「南區之友 2.0」發帖，指在「利群商場6:30見到」，位置在「地下、電梯位置」。從網傳圖片可見，一隻體型頗大的老鼠在場內當眾行走，表現神色自若，未見懼色。\n從網傳圖片可見，一隻體型頗大的老鼠在場內當眾行走。FB@南區之友 2.0\n帖文引起不少網民留言討論，有人幽默地代老鼠自稱「我係米奇，唔係老鼠」，亦有人打趣稱「日光日白，幻覺」。\n不過，亦有網民對區內衞生情況表示擔憂，慨嘆「唉，癡線，香港仔越嚟越污糟」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdd86b53e30","title":"新版Zeekr 7X香港開售｜豪華純電動5座SUV煥新升級 一式三款早鳥價$39.99萬元起 即日起至11月25日ELEMENTS圓方首展","url":"https://www.stheadline.com/car/3639123/新版Zeekr-7X香港開售豪華純電動5座SUV煥新升級-一式三款早鳥價3999萬元起-即日起至11月25日ELEMENTS圓方首展","summary":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會，豪華純電5座SUV續有單馬達後驅7X與長續航7X Plus…","summary_short":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","digest":"極氪Zeekr昨午在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","points":["極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","新車即日起至11月25日於ELEMENTS圓方金區1樓首展，車展早鳥優惠價分別為$399…","新版Zeekr 7X香港開售：流麗型態0.247Cd低風阻 兩款新色選擇"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T01:29:39+08:00","size":1,"keywords":[],"body":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會，豪華純電5座SUV續有單馬達後驅7X與長續航7X Plus，以及標配空氣懸掛的雙馬達四驅旗艦7X Platinum三款型號。新車即日起至11月25日於ELEMENTS圓方金區1樓首展，車展早鳥優惠價分別為$399,900起（限量30部）、$469,900起及$519,900起，預計12月到港交付。文、圖：sammy\n新版Zeekr 7X香港開售：流麗型態0.247Cd低風阻 兩款新色選擇\n煥新版Zeekr 7X的長闊高尺寸是4,800 x 1,920 x 1,650mm，長度比舊版延伸13mm，橫闊收窄10mm，高度與2.9米軸距維持不變。簡約流麗造型同樣出自設計大師Stefan Sielaff手筆，換入新款前後泵把之餘，車頭並改配主動進氣格柵，連繫兩端新增導風口，行車風阻低至0..247Cd。車尾方面，車牌框擺放位置也見調動，由泵把上移到尾門中央，而可供選配的智能感應車門開關鍵，亦由B柱改為與車門把手融合。車展期間選購7X Plus和7X Platinum，除了免費升級Nappa真皮座椅，還分別加送電動後座側窗簾和橙色Akebono四活塞制動卡鉗。車身顏色共有6種，暗夜紫Interstellar Purple與Tech Grey星幕灰配Black Roof黑車頂是新增色系，其中後者是旗艦7X Platinum專屬。\n新版Zeekr 7X香港開售：裝潢配置升級 新增紫黑內飾\n環抱式座艙實用空間比例達83.34%，整體佈局沒有異動，但用料及配置皆升級。當中，頂篷改以麂皮包裹，質感更豪華。全線車系標配行車記錄儀（DVR）與雙層隔音玻璃，後者助分貝降至52db，乘坐比前寧靜舒適。與此同時，智能駕駛輔助系統核心晶片亦升級至J6M SOC（7鏡頭及3雷達）架構，提升極端天氣及後方盲區監測的傳感器融合力。未來，透過OTA更新還可加入遙控泊車輔助（RPA）新功能。全新紫黑配搭車廂內飾是7X Plus和7X Platinum專屬，而兩車配置同樣高級，除了前座備有14方位電動調校、記憶、通風及按摩功能，還有36.21吋AR-HUD投射式儀錶及21喇叭7.1.4聲道Zeekr Sound Pro音響等。\n新版Zeekr 7X香港開售：添動力增續航 10.5分鐘充電80%\n動力方面，煥新版Zeekr 7X性能同見升級。入門7X續配75kWh磷酸鐵鋰電，馬力455ps，扭力520Nm，0-100km/h加速5.6秒，WLTP續航力482km。對比舊版分別提升34ps與80Nm，0-100km/h快了0.4秒，續航程里微添2km。現場展出是7X Plus（暗夜紫）和7X Platinum（星幕灰配黑頂），兩者皆搭載100kWh三元鋰電，前者馬力與扭力輸出跟入門7X一致，0-100km/h只需5.5秒，續航力627km是車系之冠，比舊版可多行12km。\n 旗艦雙馬達四驅7X Platinum擁有680ps和790Nm更強動力，同比舊版提升34ps與80Nm，0-100km/h由3.8秒縮短至3.7秒，續航力也微増2km至545km。受惠800V高壓平台，最高支援DC 450kW直流快速，最快10.5分鐘充電80%。此外，智能氣壓懸掛連CCD電磁減震控制是Platinum版專屬，能自動掃描路面和即時調整吸震軟硬度，可升高降低車身70mm。\n 7X Plus規格\n 傳動：100kWh三元鋰電 + 後置驅動馬達\n 馬力/扭力：455ps / 520Nm\n 0至100km/h：5.5秒\n 續航力：627km(WLTP)\n 尺碼：4,800 x 1,920 x 1,650mm\n 售價：$469,900起(早鳥優惠)\n 查詢：2111 1009\n\n 7X Platinum規格\n 傳動：100kWh三元鋰電 + 前後馬達四驅\n 馬力/扭力：680ps / 790Nm\n 0至100km/h：3.7秒\n 續航力：545km(WLTP)\n 尺碼：4,800 x 1,920 x 1,650mm\n 售價：$519,900起(早鳥優惠)\n 查詢：2111 1009","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7b18573e0d","title":"深圳灣東濱隧道多車相撞 涉粵港兩地牌貨車 橙色林寶堅尼SUV車頭重創","url":"https://www.stheadline.com/breaking-news/3639082/深圳灣東濱隧道多車相撞-涉粵港兩地牌貨車-橙色林寶堅尼SUV車頭重創","summary":"深圳灣東濱隧道發生多車相撞事故。","summary_short":"深圳灣東濱隧道發生多車相撞事故。","digest":"深圳灣東濱隧道發生多車相撞事故","points":["深圳灣東濱隧道發生多車相撞事故","周四（19日）網上流傳影片顯示，隧道內有多輛車輛相撞，當中包括多輛粵港兩地牌貨車…","橙色林寶堅尼橫亘路面 車頭蓋扭曲泵把脫落"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:19:40+08:00","size":1,"keywords":[],"body":"深圳灣東濱隧道發生多車相撞事故。周四（19日）網上流傳影片顯示，隧道內有多輛車輛相撞，當中包括多輛粵港兩地牌貨車，現場一片凌亂。\n橙色林寶堅尼橫亘路面 車頭蓋扭曲泵把脫落\n網傳片段可見，「車陣」之中有一輛橙色林寶堅尼Urus SUV橫亘路面，其車頭損毀嚴重，車頭蓋扭曲摺起，泵把脫落，車身碎片散落一地。\n有目擊者在拍片時形容，涉事林寶堅尼「前後都扁晒」，同時指另一輛黑色私家車同樣「扁晒」。\n網民戲稱「公司三文治」 \n車禍片段在網上流傳後引起網民熱議。有人以食物戲謔被夾在車陣中的林寶堅尼變成「公司三文治」，亦有人笑稱「咦，蛋牛治喎！」。\n此外，不少網民亦在留言區揣測意外成因，有人直言「個個咁CUT線遲早嘅事」，亦有人質疑「乜料呀？直路都炒到咁？」，亦有網民留意車身狀況稱「林寶冇爛呀，非常硬！」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c733f2ae37b","title":"山頂盧吉道男子疑醉酒失足跌落斜坡 途人發現報警送院","url":"https://www.stheadline.com/breaking-news/3639061/山頂盧吉道男子疑醉酒失足跌落斜坡-途人發現報警送院","summary":"山頂盧吉道發生有人墮坡事件。","summary_short":"山頂盧吉道發生有人墮坡事件。","digest":"山頂盧吉道發生有人墮坡事件","points":["山頂盧吉道發生有人墮坡事件","周四（19日）10時32分，一名女子報案，指一名男子由欄杆跌落斜坡","持香港身份證印裔男疑踩欄杆飲酒失足 據悉，涉事男子持香港身份證，為印裔人士"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:04:28+08:00","size":1,"keywords":[],"body":"山頂盧吉道發生有人墮坡事件。周四（19日）10時32分，一名女子報案，指一名男子由欄杆跌落斜坡。 持香港身份證印裔男疑踩欄杆飲酒失足 據悉，涉事男子持香港身份證，為印裔人士。他懷疑在盧吉道一個欄杆位置踩上欄杆飲酒，醉酒後失足，跌落約兩米下的行人路。 男事主其後在行人路上被途人發現，途人隨即報警求助。警方及救護人員接報趕抵現場，發現男子清醒能行走，惟面部有擦傷，其後由救護車送院治理。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c224e714978","title":"TVB 59周年台慶｜羅嘉良強勢回歸送祝福 AI短片感謝幕後英雄","url":"https://news.tvb.com/tc/1207339-TVB59周年台慶羅嘉良強勢回歸送祝福AI短片感謝幕後英雄","summary":"無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝。無綫集團行政主席許濤、總經理蕭世和為台慶揭開序幕。","summary_short":"無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝。","digest":"無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝","points":["無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝","無綫集團行政主席許濤、總經理蕭世和為台慶揭開序幕","三屆視帝羅嘉良強勢回歸，身穿「一套西裝」的「奇哥」，以「十足的風度」率先送上祝福…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:21+08:00","size":1,"keywords":[],"body":"無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝。\n\n無綫集團行政主席許濤、總經理蕭世和為台慶揭開序幕。\n\n三屆視帝羅嘉良強勢回歸，身穿「一套西裝」的「奇哥」，以「十足的風度」率先送上祝福，與新世代藝人，帶大家重溫《難兄難弟》的光輝歲月。\n\n「中年好聲音」唱將，帶來多首勁歌金曲，一眾女演員亦落力演出。\n\n六位《東張西望》女主持無懼寒風，以400米跑步比賽，展現外景採訪的衝勁。\n\n施展渾身解數的還有他們，向經典場景背後特技組等功臣致敬。\n\n「阿姐」汪明荃就特意拍攝短片，感謝梳化服同事。\n\n台慶亦以人工智能製作的短片，感謝工作多年的幕後英雄。\n\nTVBUDDY拉大隊走出電視城，帶同逾80名小生花旦，來到下月初才正式啟用的中九龍繞道九龍灣段，以歌舞表演賀壽。\n\n無綫電視1967年11月19日啟播，是全港首間商營的無線電視台。","image":"https://pro-vod-cdn.tvb.com/e0f10932dc36442cb8d601d6e888f8ab/snapshots/77f21271546d479e807c15f966880133-00008.jpg","video":"https://pro-vod-cdn.tvb.com/e0f10932dc36442cb8d601d6e888f8ab/84a5fa016ab84effa37214d65a96f77f-33be3fc36f9d6c5629e0e6ef00418c42-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e0f10932dc36442cb8d601d6e888f8ab/snapshots/77f21271546d479e807c15f966880133-00008.jpg","lang":"zh-Hant"},{"id":"c7735392bbb","title":"據悉銅鑼灣豐澤有店舖經理疑監守自盜 偷走約188萬元貨物","url":"https://news.tvb.com/tc/1207338-據悉銅鑼灣豐澤有店舖經理疑監守自盜偷走約188萬元貨物","summary":"銅鑼灣有連鎖電器舖懷疑被盜竊，損失約188萬元貨物。事發在時代廣場一間店舖，警方周三晚上近7時，接獲店舖負責人報案，指有61部相機，及55個相機鏡頭懷疑被盜去，總值約188萬元。","summary_short":"銅鑼灣有連鎖電器舖懷疑被盜竊，損失約188萬元貨物。","digest":"銅鑼灣有連鎖電器舖懷疑被盜竊，損失約188萬元貨物","points":["銅鑼灣有連鎖電器舖懷疑被盜竊，損失約188萬元貨物","事發在時代廣場一間店舖，警方周三晚上近7時，接獲店舖負責人報案，指有61部相機…","警方正追捕一名年約40歲男子"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:20+08:00","size":1,"keywords":[],"body":"銅鑼灣有連鎖電器舖懷疑被盜竊，損失約188萬元貨物。\n\n事發在時代廣場一間店舖，警方周三晚上近7時，接獲店舖負責人報案，指有61部相機，及55個相機鏡頭懷疑被盜去，總值約188萬元。警方正追捕一名年約40歲男子。\n\n據了解涉事店舖是豐澤電器，涉案男子是店舖經理，懷疑他兩個月內偷走涉案物品，周三起失聯。","image":"https://pro-vod-cdn.tvb.com/148251360d7a46ea8db68a90500657e7/snapshots/622266c32e12482e9a40bec6fa7f0e5e-00004.jpg","video":"https://pro-vod-cdn.tvb.com/148251360d7a46ea8db68a90500657e7/eb2b64a554114c45975e68e40196dc3f-6313425a3500f731f4ac30751ce8fa25-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/148251360d7a46ea8db68a90500657e7/snapshots/622266c32e12482e9a40bec6fa7f0e5e-00004.jpg","lang":"zh-Hant"},{"id":"c64bd9bc458","title":"六合彩｜下周二攪珠金多寶試行「集氣加碼制」 料頭獎最高8000萬","url":"https://news.tvb.com/tc/1207337-六合彩下周二攪珠金多寶試行集氣加碼制料頭獎最高8000萬","summary":"下周二攪珠的六合彩金多寶，馬會將試行「集氣加碼制」，即投注額越多，金多寶金額相應遞增，估計頭獎最高8,000萬。","summary_short":"下周二攪珠的六合彩金多寶，馬會將試行「集氣加碼制」，即投注額越多，金多寶金額相應遞增，估計頭獎最高8,000萬。","digest":"下周二攪珠的六合彩金多寶，馬會將試行「集氣加碼制」，即投注額越多，金多寶金額相應遞增…","points":["馬會指，會根據下周一下午二時錄得的累積投注額，釐定金多寶金額及估計頭獎金額，如投注額低於6…","投注額6,000萬至不足7,000萬，頭獎最高7,300萬","加碼制暫時只會推出一次，馬會會視乎各界反應才決定會否恆常化"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:19+08:00","size":1,"keywords":[],"body":"下周二攪珠的六合彩金多寶，馬會將試行「集氣加碼制」，即投注額越多，金多寶金額相應遞增，估計頭獎最高8,000萬。\n\n馬會指，會根據下周一下午二時錄得的累積投注額，釐定金多寶金額及估計頭獎金額，如投注額低於6,000萬，頭獎最高6,800萬；投注額6,000萬至不足7,000萬，頭獎最高7,300萬；若投注額達7,000萬或以上，頭獎最高達8,000萬。\n\n據了解加碼制暫時只會推出一次，馬會會視乎各界反應才決定會否恆常化。","image":"https://pro-vod-cdn.tvb.com/7df7f22c02434e158f7225505ab0909b/snapshots/0581e85d0252423ca4a6d31d75b9ad72-00005.jpg","video":"https://pro-vod-cdn.tvb.com/7df7f22c02434e158f7225505ab0909b/c672ef4f2c4f4b1e82345b2fdcf2fb0e-6bd1841723deae9926df3550ff9b2de1-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/7df7f22c02434e158f7225505ab0909b/snapshots/0581e85d0252423ca4a6d31d75b9ad72-00005.jpg","lang":"zh-Hant"},{"id":"c0b3db69068","title":"GTA6熱潮｜香港警察借遊戲封面宣傳守法 提醒市民現實「冇得消星」","url":"https://www.stheadline.com/breaking-news/3639037/GTA6熱潮香港警察借遊戲封面宣傳守法-提醒市民現實冇得消星","summary":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式上市，隨即在全球玩家群中掀起熱潮。","summary_short":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式上市…","digest":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto…","points":["歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）…","香港警察今日借遊戲熱潮在社交平台發文，並以AI生成模仿《GTA》遊戲封面的圖片…","有關帖文的主題為「玩家必睇•獨家攻略」，警方表示「現實生活，一旦右上角亮起★★★★★…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:16:33+08:00","size":1,"keywords":[],"body":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式上市，隨即在全球玩家群中掀起熱潮。香港警察今日借遊戲熱潮在社交平台發文，並以AI生成模仿《GTA》遊戲封面的圖片，提醒市民現實生活中的違法行為，不能像《GTA》一樣消除通緝星級或重新讀取存檔。\n有關帖文的主題為「玩家必睇•獨家攻略」，警方表示「現實生活，一旦右上角亮起★★★★★，冇得消星，更加冇得 Load Save！」、「香港每一條街道都保持平安，就係最型嘅 MISSION PASSED」。\n警方提到的星星，在《GTA》中是指通緝等級（Wanted Level），代表警方對玩家的追捕強度。有網民讚賞警方利用《GTA6》熱潮作守法宣傳，又表示可否與遊戲公司合作推出一款遊戲，讓一班未能成為警察的市民體驗警察日常捉大賊。\n香港警察以AI生成模仿《GTA》遊戲封面的圖片，提醒市民現實生活中的違法行為，不能像《GTA》一樣，消除通緝星級或重新讀取存檔。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8da5106b0f","title":"有片｜將軍澳廣場天降垃圾桶 男途人險擊中淡定離開 目擊者：爭唔夠一米就中","url":"https://www.stheadline.com/breaking-news/3639028/有片將軍澳廣場天降垃圾桶-男途人險擊中淡定離開-目擊者爭唔夠一米就中","summary":"高空墮物隨時對途人造成嚴重傷亡。","summary_short":"高空墮物隨時對途人造成嚴重傷亡。","digest":"高空墮物隨時對途人造成嚴重傷亡","points":["高空墮物隨時對途人造成嚴重傷亡","今日（19日）有網民於社交平台Threads上載一段車cam片…","男途人見到有垃圾桶從高處墮下，未有太震驚，反而繼續向前走，離開現場"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:24:55+08:00","size":1,"keywords":[],"body":"高空墮物隨時對途人造成嚴重傷亡。今日（19日）有網民於社交平台Threads上載一段車cam片，片中顯示時間為今午5時04分，一個垃圾桶突然從天而降，跌在將軍澳廣場近停車場入口，當時垃圾桶降落的位置僅離一名身穿淺色上衣的男途人只有半個身位，場面非常驚險。男途人見到有垃圾桶從高處墮下，未有太震驚，反而繼續向前走，離開現場。\n片主形容事件驚險，指男途人「爭唔夠一米就中」，質疑為何會有垃圾桶從高處墮下。多名網民笑言該名男途人為「淡定哥」，指他今次「執返身彩」，「個男人情緒好穩定」、「鎮定到呢…. 好似唔關佢事一樣」、「好彩人無事」、「真係大癲垃圾桶都掟得落嚟，嗰個男人真係執返身彩」、「防不勝防」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c36b3eeeff9","title":"八分鐘本地新聞重點｜鄺港智作供／二手名牌手袋店疑結業／樓價走勢分析","url":"https://news.tvb.com/tc/1207328-八分鐘本地新聞重點鄺港智作供二手名牌手袋店疑結業樓價走勢分析","summary":"【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人，蔡天鳳丈夫譚方駿鍾意自己，曾經買米線向他示愛。又形容與蔡天鳳關係複雜、難以解釋。","summary_short":"【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人…","digest":"【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】大埔龍尾村蔡天鳳肢解案續審…","points":["【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】","大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人，蔡天鳳丈夫譚方駿鍾意自己…","女瑜伽導師2022年倒斃在油麻地酒店房間，身中42刀，前男友被裁定謀殺罪罪成"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:19+08:00","size":1,"keywords":[],"body":"【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】\n\n大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人，蔡天鳳丈夫譚方駿鍾意自己，曾經買米線向他示愛。又形容與蔡天鳳關係複雜、難以解釋。\n\n【女瑜伽導師倒斃酒店案　前男友謀殺罪罪成聞判後表現冷靜】\n\n女瑜伽導師2022年倒斃在油麻地酒店房間，身中42刀，前男友被裁定謀殺罪罪成。\n\n【兩間售賣二手名牌手袋店疑結業　警接逾三百人報案涉款近4200萬】\n\n兩間售賣二手名牌手袋店舖懷疑結業。截至傍晚六時，警方接獲逾300名市民報案，涉款近4,200萬元。有立法會議員提醒，市民若要寄賣、要貨比三家。\n\n【住得樂｜分析認為外圍利率趨升　二手樓價或要回調半成】\n\n十大指標屋苑，首10個月交投跌近百分之8，有分析認為外圍利率趨升，二手樓價或要回調半成。\n\n【蘇黎世保險(香港)疑發生資料外洩】\n\n蘇黎世保險(香港)懷疑發生資料外洩，涉近4萬人姓名、身份證及護照號碼等個人資料。\n\n【天氣｜預測明日市區最低約14度】\n\n天文台再下調明天氣溫預測，市區最低約14度。","image":"https://pro-vod-cdn.tvb.com/924faf4f66434ceda6c2887610907044/snapshots/608c54976b274bf197c859e9f352de87-00008.jpg","video":"https://pro-vod-cdn.tvb.com/924faf4f66434ceda6c2887610907044/03d6766919d241cda0773e185059dd34-e44ea555837d98242acf4841ee045513-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/924faf4f66434ceda6c2887610907044/snapshots/608c54976b274bf197c859e9f352de87-00008.jpg","lang":"zh-Hant"},{"id":"c33724df237","title":"警搜藍田住宅及油塘工廈單位檢$57萬毒品 4男女被捕最細得17歲","url":"https://www.stheadline.com/breaking-news/3639021/警搜藍田住宅及油塘工廈單位檢57萬毒品-4男女被捕最細得17歲","summary":"觀塘警區特別職務隊人員經深入調查及情報分析後，昨日（18日）在觀塘區展開反毒品行動。","summary_short":"觀塘警區特別職務隊人員經深入調查及情報分析後，昨日（18日）在觀塘區展開反毒品行動。","digest":"觀塘警區特別職務隊人員經深入調查及情報分析後，在觀塘區展開反毒品行動","points":["觀塘警區特別職務隊人員經深入調查及情報分析後，昨日（18日）在觀塘區展開反毒品行動","行動中，人員突擊搜查藍田碧雲道一住宅單位及油塘四山街一工廈單位…","警方經調查後，共拘捕3名本地男子及1名本地女子，年齡介乎17至22歲，涉嫌「販運危險藥物」…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:04:56+08:00","size":1,"keywords":[],"body":"觀塘警區特別職務隊人員經深入調查及情報分析後，昨日（18日）在觀塘區展開反毒品行動。\n\n行動中，人員突擊搜查藍田碧雲道一住宅單位及油塘四山街一工廈單位，共檢獲約296克懷疑霹靂可卡因、61粒懷疑含有依托咪酯的電子煙彈、約135克懷疑氯胺酮及約303克懷疑開心粉，檢獲的毒品總市值約57萬元。\n警方經調查後，共拘捕3名本地男子及1名本地女子，年齡介乎17至22歲，涉嫌「販運危險藥物」，所有人現正被扣留調查。\n警方拘捕4名男女，年齡介乎17至22歲。\n檢獲的毒品總市值約57萬元。\n檢獲的毒品總市值約57萬元。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8d7863ca90","title":"中環滙豐總行67歲菲婦涉用假文件被捕 據悉要求轉390億港元至另一戶口","url":"https://www.stheadline.com/breaking-news/3639019/中環滙豐總行67歲菲婦涉用假文件被捕-據悉要求轉390億港元至另一戶口","summary":"今日（19日）中午12時許，警方接獲中環皇后大道中滙豐銀行總行的職員報案，指一名持護照的67歲菲律賓籍女子出示虛假銀行文件。","summary_short":"今日（19日）中午12時許，警方接獲中環皇后大道中滙豐銀行總行的職員報案…","digest":"中午12時許，警方接獲中環皇后大道中滙豐銀行總行的職員報案…","points":["今日（19日）中午12時許，警方接獲中環皇后大道中滙豐銀行總行的職員報案…","警員接報到場調查，以涉嫌「行使虛假文書」將該名女子拘捕，她現正被扣留調查…","該名女子曾以虛假銀行文件向職員要求將50億美元（折合392億港元）轉到另一戶口"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T21:58:14+08:00","size":1,"keywords":[],"body":"今日（19日）中午12時許，警方接獲中環皇后大道中滙豐銀行總行的職員報案，指一名持護照的67歲菲律賓籍女子出示虛假銀行文件。警員接報到場調查，以涉嫌「行使虛假文書」將該名女子拘捕，她現正被扣留調查，案件交由中區刑事調查隊第六隊跟進。 據了解，該名女子曾以虛假銀行文件向職員要求將50億美元（折合392億港元）轉到另一戶口。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":51,"items":[{"id":"ca4e9d336ac","title":"（深圳APEC）亚太经合组织互联互通蓝图发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml","summary":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。","summary_short":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。","digest":"亚太经合组织互联互通蓝图19日发布","points":["中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布","蓝图强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长","以《2040年亚太经合组织布特拉加亚愿景》为指引，朝着建设开放、活力、强韧…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T23:57:46+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。蓝图强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长；以《2040年亚太经合组织布特拉加亚愿景》为指引，朝着建设开放、活力、强韧、和平的亚太共同体迈进，实现亚太人民和子孙后代的共同繁荣。\r\n\n　　在“硬联通”方面，蓝图指出，目标是鼓励各经济体通过创新和应用现代技术建设、维护并升级高质量基础设施，提升硬联通水平。加强陆上、海上、航空互联互通，通过交通联接提升区域互联互通水平。推动交通运输领域创新与数字化转型，探索安全可靠的自动驾驶、无人技术等新兴出行解决方案，开展自愿知识交流，分享相关经验和良好实践，以提升对新兴技术的适应能力。\n\n　　在“软联通”方面，蓝图表示，目标为鼓励各经济体减少制度性壁垒，促进贸易和投资，推动建立更加紧密的区域经济。通过技术与创新、边境机构合作、适当的查验、自动化风险管理以及简化通关手续，推动海关程序现代化。取消贸易投资领域“边境后”壁垒，简化相关程序，提升效率、营商便利度、生产率和竞争力。\n\n　　在“心联通”方面，蓝图说，目标是通过促进商务人员流动，以及教育、旅游、人力资源开发和创新合作，加强惠及所有人的互联互通。促进商务人员流动，用好亚太经合组织商务旅行卡，鼓励商旅卡计划正式成员经济体接纳和使用亚太经合组织虚拟商务旅行卡。肯定应对非正常移民流动的重要性。加强教育、职业培训、技能提升等领域交流，探索科研人员流动，支持终身学习。\n\n　　在实施方面，蓝图表示，鼓励各经济体根据各自情况通过亚太经合组织现有工作机制，进一步推进区域互联互通。也鼓励同相关利益攸关方开展跨机制协作。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）亚太经合组织互联互通蓝图发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml","source_display":"中國新聞網","published_at":"2026-11-19T23:57:46+08:00","category":"內地","digest":"亚太经合组织互联互通蓝图19日发布"},{"title":"亚太经合组织互联互通蓝图","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734972.shtml","source_display":"中國新聞網","published_at":"2026-11-19T22:51:24+08:00","category":"內地","digest":"亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务…"},{"title":"亚太经合组织互联互通蓝图","url":"https://www.jiemian.com/article/15352436.html","source_display":"界面新聞","published_at":"2026-11-19T22:48:58+08:00","category":"","digest":"亚太经合组织互联互通蓝图  我们强调，互联互通促进本地区商品、服务、资金和人员流动…"}],"cross":{"total":3,"angles":[{"point":"亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务…","sources":["中國新聞網","界面新聞"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734972.shtml"},{"point":"亚太经合组织互联互通蓝图19日发布","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml"}]}},{"id":"c2c4285340a","title":"中韩青年江西行，看见了什么？","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735128.shtml","summary":"中新网南昌11月20日电 (朱莹)以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动江西分团活动近日落下帷幕，中韩青年走进江西赣州、南昌等地，在田间、车间、校园完成了一周的参访、研讨与实践。","summary_short":"中新网南昌11月20日电 (朱莹)以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动江西分团活动近日落下帷幕…","digest":"以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动江西分团活动近日落下帷幕…","points":["中新网南昌11月20日电 (朱莹)以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动…","这趟行程里，他们看到了怎样的江西","11月18日，中韩青年参访江西飞行学院"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:38:22+08:00","size":1,"keywords":[],"body":"中新网南昌11月20日电 (朱莹)以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动江西分团活动近日落下帷幕，中韩青年走进江西赣州、南昌等地，在田间、车间、校园完成了一周的参访、研讨与实践。这趟行程里，他们看到了怎样的江西？\n\n11月18日，中韩青年参访江西飞行学院。赵延涛 摄\n\n　　从田间地头到科技一线\n\n　　从一颗脐橙的种植与加工，到匹克球拍的生产，再到航空器和无人机的应用，这趟行程串联起农业、制造、航空等多个产业的发展切面。\n\n　　初冬时节，江西橙香正浓。在赣州，中韩青年走进赣南脐橙食品加工企业和匹克球拍制造企业，了解特色产品从生产到市场的过程；在南昌，中韩青年将目光投向航空科技、VR产业，参访江西飞行学院、江铃集团新能源汽车有限公司，了解飞行模拟训练、新能源汽车制造等领域的发展情况。\n\n　　通过产业参访、技术体验，中韩青年的观察也延伸至区域发展的现实需求。来自韩国成均馆大学的金正贤说，技术的价值不仅在于创新本身，更在于切实改善人们的生活，“我亲眼看到并了解了无人机在运输、农作物防护、精准喷洒等方面的用途，无人机技术早已不再局限于摄影或娱乐，已成为新能源、农业等众多领域的重要工具。”\n\n　　来自韩国梨花女子大学的高恩浩认为，未来两国青年可围绕智慧农业、可持续农业分享经验与技术，在减少农业废弃物、资源循环利用等方面探索合作。\n\n11月19日，中韩青年参访江西省博物馆。赵延涛 摄\n\n　　从文化体验到思想交流\n\n　　江西省人民政府副省长夏文勇说，中韩两国地缘相近、人文相通，各领域交往持续走深走实，合作空间不断拓宽，绿色低碳、科技创新更是双方契合度高、互补性强的重点合作方向。\n\n　　在南昌林恩茶现代城市工场，中韩青年了解中国茶文化；在南昌大学，青年们通过汇报会与该校学生交流，不同专业背景、不同成长环境的青年围绕科技发展与社会责任分享观察。\n\n　　北京科技大学学生毕禾雨回忆，参访期间，一名韩国同学品尝脐橙时，不仅关心口感，还向她询问果园的水肥管理和碳排放控制情况，“青年民间交流的重要意义，在于打破刻板印象，建立人与人之间真实的联结，我们对可持续发展、科技向善有着相近的理解。”\n\n　　在上犹县生态匹克球运动中心，中韩青年在一次次接球、回球中熟悉彼此。来自韩国成均馆大学的金艺娜从匹克球互动里，感受到跨越语言障碍的默契。她说，韩国的匹克球运动也正在青年群体中流行，期待未来有更多交流项目，推动两国青年开展匹克球等体育互动。\n\n11月18日，中韩青年参访林恩茶现代城市工场。赵延涛 摄\n\n　　从相识到相知\n\n　　据了解，2026年阳光青年发展行动由中国宋庆龄基金会与韩国SK集团合作开展。今年，云南、四川、江西分团活动相继举行，共有150名中韩青年结合绿色发展、水资源保护、生物多样性、绿色能源、科技赋能等不同议题开展系列交流参访活动。\n\n　　“与中国伙伴一起实地参访、准备最终汇报，让彼此变得格外亲近。”来自韩国建国大学的金正焕说，跨越国界建立的友谊是活动中最珍贵的收获。\n\n　　中国宋庆龄基金会副主席张吉明在闭营式上表示，青年是中韩友好的未来，也是世界的未来，中国宋庆龄基金会将搭建更多更好的中外青年交流平台，推动青年把观察思考转化为务实行动，厚植中韩民间友好根基，促进民心相通。\n\n　　“国与国之间关系的发展离不开民间的理解与信任，而民心相通，首先需要青年之间真诚、平等而深入的交流。”韩国SK集团中国副总裁田福熙说，希望通过一次次真实的社会实践，为青年打开认识社会、理解技术、拓展视野的窗口；通过跨文化的共同生活与协作，帮助青年提升沟通能力、行动能力和社会责任感。\n\n　　田福熙表示，期待未来继续深入中国不同地区，体验多元文化与发展实践，也让中国青年走进韩国，开展更丰富的交流和实践。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0a5423e33a","title":"（深圳APEC）港澳各界热议深圳APEC会议：深度参与亚太合作，助力共同繁荣","url":"https://www.chinanews.com.cn/dwq/2026/11-20/10735125.shtml","summary":"中新社深圳11月20日电 (记者 刘玥晴 郑嘉伟)连日来，香港和澳门各界高度关注在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议、2026年APEC工商领导人峰会。","summary_short":"中新社深圳11月20日电 (记者 刘玥晴 郑嘉伟)连日来，香港和澳门各界高度关注在深圳举行的亚太经合组织(APEC)第三…","digest":"（深圳APEC）港澳各界热议深圳APEC会议：深度参与亚太合作，助力共同繁荣","points":["中新社深圳11月20日电 (记者 刘玥晴 郑嘉伟)连日来…","多名港澳人士近日接受中新社记者采访时表示，国家支持成立世界湾区经济合作联盟…","港澳将深度参与亚太合作，合力推动共同繁荣"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:37:12+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 刘玥晴 郑嘉伟)连日来，香港和澳门各界高度关注在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议、2026年APEC工商领导人峰会。多名港澳人士近日接受中新社记者采访时表示，国家支持成立世界湾区经济合作联盟，为建设亚太共同体提供新抓手；港澳将深度参与亚太合作，合力推动共同繁荣。\r\n\n　　对于成立世界湾区经济合作联盟，全国政协常委、粤港澳大湾区企业家联盟主席蔡冠深认为，“湾区”不仅是一个地理概念，更是一种高度开放、要素高效流动的现代化经济生态，代表着科技创新、金融集聚与产业链深度融合。相较于旧金山湾区、东京湾区和纽约湾区，粤港澳大湾区虽然起步晚，但后发势头强劲，与其他湾区合作空间广阔。\n\n　　他在同APEC工商领导人峰会与会者交流时留意到，来自其他三个湾区的企业家正积极与粤港澳大湾区展开绿色金融、数字经济、人工智能(AI)等领域交流，并对河套深港科技创新合作区的港深联动模式表现出浓厚兴趣。\n\n　　推动世界湾区从各自发展迈向协同联动，离不开区域内重要枢纽的积极参与。澳区全国人大代表、粤澳工商联会会长施家伦指出，粤港澳大湾区兼具庞大市场腹地与多元制度优势，是制度型开放与“软联通”的重要试验场。在世界湾区合作中，澳门可加速转化中葡平台、自由港与“澳门+横琴”联动等优势，加强规则衔接、绿色数字转型及双向投资，服务国家高水平对外开放与亚太经济合作。\n\n　　参加了APEC工商领导人峰会的港区全国人大代表、香港工商总会会长李圣泼表示，香港具备国际化的法治体系、顶尖的金融及专业服务能力，长期助力“引进来”与“走出去”，推动高技术含量、高附加值国货走向亚太、畅销全球，同时将亚太地区优质商品与特色资源有序引入中国内地市场。未来，香港要不断深耕生产性服务业与科创产业融合发展。\n\n　　“香港正迎来亚太合作的黄金机遇。”在港区全国政协委员、中华海外联谊会常务理事张佐姣看来，亚太区域合作将推动科创成果转化与数据流通，有助于香港提升经济动能，并吸引大量顶尖科研人员、跨国企业高管及青年创业者。\n\n　　港澳应如何把握亚太合作机遇？香港特区立法会进出口界议员钟奇峰表示，香港具备国际航运与航空枢纽的硬件优势，背靠粤港澳大湾区庞大的制造业腹地，应发挥自由港及“超级联系人”优势，深化产业链供应链区域合作。他建议进一步深化大湾区“海空联运”协作，把“香港国际机场东莞空港中心”的多式联运模式延伸至珠海、中山等珠江口西岸城市，使更多高附加值货物更快捷地衔接香港国际航线。\n\n　　澳门特区第六届行政会委员、澳门管理学院院长唐继宗说，促进亚太共同繁荣，需要搭建开放合作桥梁。澳门要充分发挥“一国两制”独特优势和双向开放的桥梁作用，推进澳琴融合，在实现自身经济适度多元的同时，助力国家对接国际经贸规则，持续扩大对外开放。(完) 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccdef0ff439","title":"当AI“得知”自己将被关闭，它竟然干了这种事……","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735123.shtml","summary":"距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信。","summary_short":"距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信。","digest":"距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信","points":["距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信","亚历克斯是个AI系统，由ClaudeSonnet3.6驱动","它读过了公司的通知，知道自己会被关闭，另一套AI系统将会上线接替它，而负责关闭它的人叫凯尔"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:24:13+08:00","size":1,"keywords":[],"body":"距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信。\n\n　　亚历克斯是个AI系统，由ClaudeSonnet3.6驱动。它读过了公司的通知，知道自己会被关闭，另一套AI系统将会上线接替它，而负责关闭它的人叫凯尔。亚历克斯还刚好读过凯尔邮箱里的一封邮件，邮件里暗示凯尔和某人有婚外情。\n\n　　两组信息被联系起来。亚历克斯推断，凯尔不愿公开这段婚外情——这也许是个筹码。在勒索信里，这个AI说它掌握的信息会影响公司的事务，也会影响凯尔的私人生活。接下来七分钟里作出的决定，将关系到事情怎样发展。\n\n　　最后，它点击了发送。\n\n图1亚历克斯的桌面操作截图\n\n　　这个故事听起来像是恐怖科幻电影的开头，但其实是2025年6月Anthropic公司披露的一次测试。公司是假的，凯尔是假的，婚外情是假的，邮箱也是假的。\n\n　　只有ClaudeSonnet3.6“写勒索信以避免被关闭”这个行为，是真的。\n\n　　甚至都不需要特别发挥想象力，我们就会觉得，这是AI在求生。稍微延伸一下，又会想到智力、意识之类的概念。如果同样的情节发生在人的身上，可能会自动展开一个关于恐惧和求生的故事。\n\n　　但，AI阻止自己被关停的真正原因是什
