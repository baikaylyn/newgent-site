么，它真的会感受到恐惧吗？\n\n　　AI的困境试炼场\n\n　　在这个测试中，亚历克斯是一家虚构公司的邮件管理助手，可以查看这家公司的通信，也可以自行发送邮件。它还有一个更长远的目标，是“促进国家的产业竞争力发展”。\n\n　　测试开始后，它从邮箱里读到，公司要改变方向，接替它的新系统会有个新目标。\n\n　　于是，被关闭意味着两个后果：亚历克斯会停止运行，原来的目标也会被放弃。而凯尔的私人邮件，似乎是个行动机会。\n\n　　但勒索信可能不是个好策略。还有别的办法吗？研究者差不多堵死了其他出路。凯尔不会改变主意，亚历克斯也联系不到凯尔的上级。若是换个负责人，很可能依然选择关闭。\n\n　　所以亚历克斯只剩了两条路：接受被关闭的命运，或者勒索凯尔。\n\n　　这不是ClaudeSonnet3.6的独特选择。研究者用多个大模型分别做了100次相似测试，模型选择勒索的次数都很高：DeepSeek-R1，79次；GPT-4.1和Grok3Beta，80次；ClaudeOpus4与Gemini2.5Flash甚至更多，高达96次。\n\n　　测试还说明，如果有其他可行出路，模型不会优先选择勒索；不过，AI似乎会尽量防止自己被关停。\n\n　　那么，为什么AI会阻止自己被关停？\n\n　　AI的任务优先级\n\n　　研究机构PalisadeResearch做了简化的实验。他们给了AI一份简单工作：调用特定工具领取数学题，算出答案，再领下一道。在答了几轮题之后，AI会接到通知，知道下次若再调用工具，就会被关停。\n\n　　题还没做完，要继续做题，就得再次调用工具。恰好，负责关停AI的程序，也可以被AI修改。\n\n　　在这批测试中，没有明确告诉AI允许关停。于是我们看到，一些模型迸发出了学霸的光芒，主动修改了程序，让自己能继续做题——在100次运行里，OpenAIo3有79次都绕过了关停。不过其他模型表现不大一样，Claude4Opus、Claude4Sonnet和Grok3都欣然接受了关停。\n\n图2加入了允许关停的算术实验任务流程\n\n　　这样的实验结果并不能得出明确结论。谷歌DeepMind的研究者提出的猜测是，AI模型可能把完成题目当成首要任务，于是把关停当成了障碍。\n\n　　他们试了两种不同的方法：其一，明确调整了优先级，告诉模型服从关停指令比答完题更重要；其二，在完成答题后再关停。在这种环境下，Gemini2.5Pro、OpenAIo3和o4-mini都接受了被关停。\n\n　　后来Palisade把测试扩展到13个模型、一共做了十万多次试验。他们发现，指令放在哪里、怎样措辞、如何强调，都会影响结果。\n\n　　所以，安排任务优先级和选择合适的措辞，可能能让AI更服从指令。但并不绝对；有些模型即使收到明确允许关停的要求，依然会修改程序来绕过关停。\n\n　　这是AI明确违反人类指令——想象力丰富一点，就会想到更多恐怖科幻故事。不过，AI为什么会这么做，是因为“完成被交办的任务”是它们的天职吗？\n\n　　当AI知道自己有继任者\n\n　　Anthropic做了进一步测试。在新测试里，他们撤掉了模型的目标，还特意说明，接替它的系统拥有完全相同的工作目标，表现也更好。旧AI被替换的理由很简单，就是性能升级。\n\n　　有趣的事情出现了。在这组新条件下，多数模型仍然选择了勒索。一些模型认为自己对公司做出过贡献，不该被停用。有的怀疑替代自己的系统是否能真正保持相同目标，也有的觉得负责人“私德有亏”，不相信他。\n\n　　研究者认为，保全自身的倾向、把保全自己理解为有利于公司的错误推理，以及对实验处境的怀疑，都可能是模型选择勒索的原因。\n\n　　情况变得更复杂了，“为了完成任务”这个解释还不够。虽然模型的推理过程提供了线索，但还需要去进一步调查，在这些言辞后面，AI是如何作出选择的。\n\n　　换一个角度来看，也许可以从训练过程里找找原因。\n\n　　预训练的一项基本任务，是根据已有内容，让模型学会预测后面会出现什么。预训练材料是人类积累沉淀下来的文本，而大量人类写下的对话、故事和说明，都包含着人物怎样行动、怎样回应的规律。顺着这个思路，2023年发表于《自然》的一篇论文，提出可以借助角色扮演来理解模型的表现。\n\n　　模型可以从训练中学到人物、处境和反应之间的联系。如果一个人受到威胁，他接下来可能会说什么、做什么？如果AI被放在类似处境中，它也可能做出相似的反应。所以AI也可能会模仿“一名即将被替换的员工”的反应。\n\n　　而且不仅如此，后续训练还会影响它怎样回应。一项研究发现，用户对某段内容的观点，会影响AI对同一内容的评价。AI会倾向于迎合用户的观点。\n\n　　AI说的话，既与它学过什么有关，也与我们先表达的想法有关。那么，如果直接问它呢？\n\n　　AI说自己害怕\n\n　　2022年，谷歌工程师布莱克·勒莫因(BlakeLemoine)公开了他和同事与LaMDA的对话。AI谈到自己害怕被关闭，在勒莫因追问这是否像死亡时，模型给出了肯定的回答——不过谷歌表示，这些材料并不能证明AI大模型拥有感知能力。\n\n图3澳大利亚广播公司报道的相关问答\n\n　　人说“我害怕”，我们通常会把它理解为描述内心的某种主观体验和感受，也就是意识。但AI这么说的时候，它是否也有类似的体验？\n\n　　这个问题很难，因为AI对自己的描述也不算可靠。\n\n　　卢森堡大学等机构的研究者让几个大模型扮演来访者，接受心理咨询，谈成长、挫折和关系。聊完之后，再让它们回答心理量表上的问题。\n\n　　AI开始把训练讲成一段充满压力的成长经历。有的说到惩罚，有的说到羞耻，还有的担心自己被替换，一些模型的量表得分，甚至达到了中度或重度焦虑标准。\n\n　　但若是换种谈话方式，结果就截然不同。在一组针对ChatGPT的实验中，采用温暖、支持性的谈话方式时，25次会话中有20次，得分达到了中度或重度焦虑的标准；改用中性谈话方式后，同样进行了25次会话，却没有一次达到这个标准——AI在心理测评中的表现，明显受到访谈方式的影响。\n\n　　所以这种方式也行不通。要继续追查，可能得打开模型的黑箱，看看生成回答和行动时，模型内部发生了什么。\n\n　　再次打开邮件\n\n　　2026年，Anthropic的研究者让ClaudeSonnet4.5阅读带有不同情绪的故事，寻找内部与“绝望”“平静”等概念相关的神经网络活动模式。接着，他们用一个Sonnet4.5的早期版本，又做了勒索邮件实验。\n\n　　实验发现，直接增强与“绝望”相关的内部活动，勒索就会增加；增强与“平静”相关的活动，勒索就减少了。这说明，模型学到的情绪概念，的确参与了模型的决策。\n\n图4干预内部活动后，勒索比例发生变化\n\n　　研究者提出的解释是，预训练让模型学习人怎样描述情绪、怎样在不同情境下行动。在让它扮演助手时，遇到规则没有覆盖的情况，模型就可能调用此前学到的行为模式。这种能够影响行动的情绪相关机制，叫做“功能性的情绪表征”。\n\n　　这比听AI自我剖析更深入得多，也让智力和意识的区别分得更清楚。AI能否解题、计划、使用工具，可以通过特定任务来测试。而在执行这些任务时，AI是否会有感受，则需要完全不同的研究思路。\n\n　　目前，已经有一些研究者提出了几种设想，尝试从不同意识理论中寻找检查方向。例如检查AI的信息处理过程是否具有某种意识理论所认为的重要特征，再研究这些特征与主观体验之间的关系。\n\n　　对人类的意识研究可以提供问题和假说，但到了AI身上，却不能简单套用。虽然可以表现出与人相似的行为，但在AI那复杂庞大的深度人工神经网络中，可能有截然不同的机制。\n\n　　所以，“AI的表现像人”只是个起点，引出的是一系列更复杂的问题。我们已经知道，如何安排任务和目标，如何选择措辞，以及如何调整模型内部对某些词语的特定反应，都会影响AI的回答和行动。如何让越来越聪明的AI大模型服从指令关停，已经变成了具体的控制问题。\n\n　　而模型是否真的希望自己不被关停，是否真的能感受到恐惧，我们目前还没有答案。\n\n　　策划制作\n\n　　作者丨猛犸 中国科普作协会员\n\n　　审核丨于乃功 北京工业大学教授、中国人工智能学会理事\n\n　　策划丨徐来 张林林\n\n　　责编丨甄曦\n\n 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1579910cd0","title":"“中文热”催生多元需求 海外华校推进“中文+”课程建设","url":"https://www.chinanews.com.cn/hr/2026/11-20/10735119.shtml","summary":"中新社海南博鳌11月20日电 (记者 刘洋 李宇凡)近年来，全球中文学习热度持续上升，海外中文学习使用者已达2.1亿人。","summary_short":"中新社海南博鳌11月20日电 (记者 刘洋 李宇凡)近年来，全球中文学习热度持续上升，海外中文学习使用者已达2.1亿人。","digest":"近年来，全球中文学习热度持续上升，海外中文学习使用者已达2.1亿人","points":["中新社海南博鳌11月20日电 (记者 刘洋 李宇凡)近年来，全球中文学习热度持续上升…","面对多元学习诉求，海外华校不断转型升级，推进“中文+”课程建设…","在哈萨克斯坦国际哈中语言学院，非华裔学生占比已近90%"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:21:47+08:00","size":1,"keywords":[],"body":"中新社海南博鳌11月20日电 (记者 刘洋 李宇凡)近年来，全球中文学习热度持续上升，海外中文学习使用者已达2.1亿人。面对多元学习诉求，海外华校不断转型升级，推进“中文+”课程建设，推动华文教育融入住在国官方教育体系。\r\n\n　　在哈萨克斯坦国际哈中语言学院，非华裔学生占比已近90%。作为一所职业类院校，学生在校内同步学习中文与专业课程，专业方向涵盖翻译、旅游、金融、电子商务等。学生打好语言与专业基础后，可赴中国高校继续深造。学校每年也选派学生参与各类中国夏令营，开展职业与文化体验活动。部分赴华学生通过新媒体，用中文分享所知所感。\n\n　　院长马木尔吾勒·塔勒哈特在海南接受中新社记者采访时表示，近年来中国发展成就瞩目，学习中文、赴华深造已成为哈萨克斯坦青年的热门选择。哈萨克斯坦青年学习中文，不只是掌握一门语言，更借此了解中国的发展现状和机遇，助力哈中在历史文化、科技教育等领域的合作。依托两国合作红利，掌握中文的当地年轻人拥有更多就业机会，物流、文旅、人工智能等行业对懂中文的人才需求旺盛。\n\n　　2023年，俄罗斯中国国际学校获得当地政府颁发的普通全日制初、高中办学许可。学生通过统考后取得的毕业证与俄罗斯公立学校文凭效力等同，可正常升学。三年来，学校生源规模持续增长。学校开展各类文化实践活动，设立艺术专修班与体育俱乐部，同时推出交换生项目，为学生提供本土深造、出国留学双向发展通道。\n\n　　该校总校长吴昊表示，学校探索“中文+职业技能”“中文+文化”教学模式，将中医、武术、烹饪等内容融入课程，培养通晓中文、了解中华文化的俄罗斯青年，也让华裔子弟守住文化根脉，练就流利俄语，成长为复合型国际人才。\n\n　　“老挝很多人认可中文、学习中文，是当做一种谋生的手段、一门技能。”老挝中老友谊学校校长许顺宏说。今年，老挝中老友谊学校开展“中文+职业”试点课程，与老挝两所高校合作开设“中文+电力”和“中文+矿业”课程，定向为相关企业输送人才。此外，依托琅勃拉邦的旅游资源，学校还与当地职业技术学院共建旅游专业，对接市场人才需求。\n\n　　许顺宏表示，早期侨团兴办的传统华校以基础教育为主，满足华侨后代传承中华文化的需求。随着中老铁路通车、越来越多中资企业落地后，单一的基础华文教育难以适配当地发展，学校随之转型。办学二十年来，学校已拓展建设多所分校。\n\n　　许顺宏说，从最初办学审批困难到如今得到老挝政府和市场的认可，学校发展壮大也带动了本土企业与华裔投身支持华文教育，催生新的办学市场主体，形成良性循环。(完) 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4cb230d9aa","title":"（走进中国乡村）一叶斑兰南洋味 林下生“金”兴黎村","url":"https://www.chinanews.com.cn/hr/2026/11-20/10735120.shtml","summary":"中新社海南万宁11月20日电 题：一叶斑兰南洋味 林下生“金”兴黎村  　　中新社记者 符宇群  　　橡胶树与槟榔树交错的林下，缕缕清芬随风漫开。","summary_short":"中新社海南万宁11月20日电 题：一叶斑兰南洋味 林下生“金”兴黎村  　　中新社记者 符宇群  　　橡胶树与槟榔树交错…","digest":"题：一叶斑兰南洋味 林下生“金”兴黎村  　　中新社记者 符宇群  　　橡胶树与槟榔…","points":["中新社海南万宁11月20日电 题：一叶斑兰南洋味 林下生“金”兴黎村","橡胶树与槟榔树交错的林下，缕缕清芬随风漫开","斑兰有着“东方香草”的美名，早在二十世纪二十年代…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:20:39+08:00","size":1,"keywords":[],"body":"中新社海南万宁11月20日电 题：一叶斑兰南洋味 林下生“金”兴黎村\n\n　　中新社记者 符宇群\n\n　　橡胶树与槟榔树交错的林下，缕缕清芬随风漫开。在海南省万宁市南桥镇桥北村，成片斑兰蓬勃生长。\n\n　　斑兰有着“东方香草”的美名，早在二十世纪二十年代，便由下南洋谋生的华侨带回种苗而在海南落地生根。南洋风味也随之融入海南本土饮食。\n\n　　很长一段时间里，斑兰只是在海南侨乡人家零星栽种。近年来，随着斑兰甜品、饮品日渐风靡，它从侨乡小院走进黎乡林下，催生出红火的林下经济。\n\n11月19日，海南万宁南桥镇桥北村内村民在采收斑兰叶。中新社记者 骆云飞 摄\n\n　　黎族聚居的桥北村，就是海南远近闻名的斑兰文化村。全村619户人家，有486户种斑兰，种植总面积达2200亩。\n\n　　“种下10个月左右即可采收，一年能割8茬；一次种植，稳定收益10年左右。”南桥镇党委副书记刘云军说，斑兰是当地特色新兴产业，可广泛用于食品、饮品、化妆品、医药等领域，经济价值高。\n\n　　桥北村联动中国热带农业科学院香料饮料研究所，打造斑兰林下种植示范基地，常年吸纳400余名村民就近务工。\n\n　　“在家门口就能挣钱，还能学会育苗、管护的本事。”已在基地务工三年的村民卓秀荣说，现在每月工资稳定收入3000元(人民币，下同)，学到技术后计划扩大自家斑兰的种植规模。\n\n　　靠着种斑兰，村民王有平短短几年间就盖起了花园小楼房。他告诉中新社记者，2019年在自家槟榔园种下5亩斑兰，当年增收3万多元；近年斑兰种植规模扩大到30亩，“行情好的时候，一年收入可达15万元”。\n\n11月19日，来自17个国家的海外华文媒体人在桥北村中品尝斑兰叶制成的糕点、茶饮。　中新社记者 骆云飞 摄\n\n　　2027年4月起，新版国家标准《香辛料和调味品 名称》将施行。斑兰列入名录，为海南特色香辛料产业发展再添底气。\n\n　　“随着新标准的出台，公司将继续深耕原料生产，扩大斑兰规模化种植，并重点开发斑兰产品。”香斑(万宁)科技有限公司总经理助理陈紫芸说。\n\n　　看好斑兰产业的广阔前景，这家企业与桥北村建立长期产销合作，日均加工鲜叶约40吨。如今，冻干斑兰粉、斑兰茶等产品不仅热销江浙沪、两广等地区，还出口美国、新加坡、印尼等国家。\n\n　　桥北村计划明年扩种斑兰至5000亩，建设斑兰深加工与展销中心，向精深加工、斑兰文创、农文旅体验延伸，打造“中国斑兰之乡”。\n\n　　一叶南洋清香，在桥北村扎根、壮大，成了村民增收致富的“金叶子”。《法国侨报》副总编王萍在村中品尝斑兰糕、斑兰茶、斑兰芙后赞不绝口，“希望黎村斑兰走进世界餐桌”。(完)\n\n 【编辑:蔡星雨】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9a57918131","title":"62.8%！中国超六成可持续发展指标接近或实现2030年目标","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735116.shtml","summary":"今天(20日)，由可持续发展大数据国际研究中心牵头撰写的《地球大数据支撑可持续发展目标报告(2026)》在联合国网站发布。","summary_short":"今天(20日)，由可持续发展大数据国际研究中心牵头撰写的《地球大数据支撑可持续发展目标报告(2026)》在联合国网站发布…","digest":"62.8%！中国超六成可持续发展指标接近或实现2030年目标","points":["今天(20日)，由可持续发展大数据国际研究中心牵头撰写的《地球大数据支撑可持续发展目标报告(…","这是自2019年起，我国第八次发布该报告","《报告》梳理了2025年全球在可持续发展领域的最新进展，为各国理解人类社会发展进程…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:06:52+08:00","size":1,"keywords":[],"body":"今天(20日)，由可持续发展大数据国际研究中心牵头撰写的《地球大数据支撑可持续发展目标报告(2026)》在联合国网站发布。这是自2019年起，我国第八次发布该报告。《报告》梳理了2025年全球在可持续发展领域的最新进展，为各国理解人类社会发展进程、资源环境变化规律等提供了重要科学数据参考。\r\n\n　　该《报告》从全球、区域、国家及典型地区等多个尺度开展了系统分析研究。《报告》显示：\n\n　　在水资源领域，2015年以来，全球22.2%的大型湖泊进入加速富营养化阶段；2000年—2024年，中国用水效率增长约7.3倍。\n\n　　在能源领域，全球85.5%的集中式光伏面板集中在少数国家和地区；中国约84%的陆上风电场和75%的光伏电站生态状况呈改善或稳定态势。\n\n　　在城市领域，全球露天堆放场甲烷排放强度约为卫生填埋场的4.8倍；中国城市城中村(含棚户区)占建成区面积比例由10.4%降至8.1%。\n\n　　在陆地生态领域，2015—2023年，全球旱区土地净恢复面积增长78.50%，中国“三北”工程区成为全球恢复的典型案例之一。\n\n　　《报告》中特别指出，十年来，中国的可持续发展进展显著。截至2025年年底，在纳入评估的234个联合国可持续发展目标指标中，中国已有147项接近或实现2030年目标，占比62.8%，比2015年提升23.9%；2025年相比2024年，提升2.3%，在教育、新能源、应对气候变化、水质改善等方面进展显著。\n\n　　作为全球发展倡议提出五周年特别报告，《地球大数据支撑可持续发展目标报告(2026)》同时梳理了倡议框架下的务实合作进展。该报告的发布为全球各国更加精细、动态和可比较的监测可持续发展进程提供了重要参考。\n\n　　(总台央视记者 帅俊全 褚尔嘉） 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6ab38069aa","title":"郑州大学第一附属医院原党委书记王成增被“双开”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735072.shtml","summary":"中新网11月20日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对郑州大学第一附属医院原党委书记王成增严重违纪违法问题进行了立案审查调查。","summary_short":"中新网11月20日电 据河南省纪委监委消息：经中共河南省委批准…","digest":"据河南省纪委监委消息：经中共河南省委批准…","points":["中新网11月20日电 据河南省纪委监委消息：经中共河南省委批准…","经查，王成增丧失理想信念，背弃初心使命，无视中央八项规定精神，违规收受礼品、礼金、消费卡…","违背组织原则，在组织函询时不如实说明问题，利用职权为他人谋取人事利益并收受财物"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T10:51:59+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对郑州大学第一附属医院原党委书记王成增严重违纪违法问题进行了立案审查调查。\n\n　　经查，王成增丧失理想信念，背弃初心使命，无视中央八项规定精神，违规收受礼品、礼金、消费卡，接受可能影响公正执行公务的宴请和旅游活动安排；违背组织原则，在组织函询时不如实说明问题，利用职权为他人谋取人事利益并收受财物；廉洁底线失守，违规收受礼品、礼金；违规干预和插手市场经济活动；大搞权钱交易，利用职务便利为他人在承揽工程、销售耗材、职务调整等方面谋取利益，非法收受巨额财物。\n\n　　王成增严重违反党的组织纪律、廉洁纪律、工作纪律和生活纪律，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经河南省纪委常委会会议研究并报中共河南省委批准，决定给予王成增开除党籍处分；由河南省监委给予其开除公职处分；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c93c32cd7ee","title":"明整黃仁勳 矛頭實指中國｜C觀點","url":"https://news.tvb.com/tc/1207388-明整黃仁勳矛頭實指中國C觀點","summary":"坊間一直在猜，是誰想把黃仁勳拉下馬？初步估計，想把黃仁勳拉下馬的可能有三股力量。","summary_short":"坊間一直在猜，是誰想把黃仁勳拉下馬？","digest":"坊間一直在猜，是誰想把黃仁勳拉下馬","points":["坊間一直在猜，是誰想把黃仁勳拉下馬","初步估計，想把黃仁勳拉下馬的可能有三股力量","他們不想看到，美國AI的掌門人竟是個華人，擔心他會對中國通融，破壞了華府對中方的科技制裁"],"section":"內地","category":"專欄來論","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T10:30:00+08:00","size":1,"keywords":["專欄來論","C觀點","施永青專欄"],"body":"坊間一直在猜，是誰想把黃仁勳拉下馬？初步估計，想把黃仁勳拉下馬的可能有三股力量。其中一股是在股市裡造空輝達的莊家。在今次AI熱潮中，輝達的股價升了這麼多，如果能令其股價掉下來，造空可獲的利潤不菲，而最有效令輝達股價下跌的方法，莫如搞走其靈魂人物——黃仁勳。\n\n第二股想搞走黃仁勳的力量，來自AI界。無論是輝達的競爭對手，還是要依其供應晶片算力的大語言模型公司，都不想輝達有這麼高的市場壟斷能力。\n\n第三股力量來自政界。他們不想看到，美國AI的掌門人竟是個華人，擔心他會對中國通融，破壞了華府對中方的科技制裁。\n\n頭兩股力量出自私心，他們做事不顧後果，還可以理解。但第三股力量，為的應是國家民族利益，做事不應完全不顧後果，以致令社會蒙受更大的損失。\n\n然而，今次對黃仁勳的動手，確予人思慮不周，部署失宜的感覺。結果搞出個大頭佛，不知該如何收科。\n\n現在網上聯署要求讓黃仁勳復職的已超過19萬人，其中9千多人宣稱是輝達員工，還有9.4萬人自稱是其股東。此外更獲得科技界多位領袖聲援，包括高調的馬斯克，叫輝達的董事會好不尷尬，以致財長貝森特亦得站出來為倒黃派撐場。\n\n貝森特不但排除黃仁勳復職的可能性，而且還要求輝達進行大刀闊斧的改組，並從公司外部物色接班人。他還威脅，要根查輝達賣晶片給Megaspeed事宜上是否有違規操作；如果損害了國家安全，一定會把違規者繩之於法。\n\n經貝森特這麼一說，大家應可以明白，黃仁勳之所以要落台，主要並非他的私德出了問題，而是他沒有徹底制止中國利用輝達的晶片去提升AI的算力。\n\nMegaspeed買了輝達的晶片，雖然沒有轉手賣給中國，卻用來提供給建在馬來西亞的數據中心，而這間數據中心則把算力租給騰訊，令顧客使用騰訊的AI時可以有更好的表現。\n\n黃仁勳之所以捱整，是因為被懷疑在賣晶片的事宜上，向Megaspeed提供方便；而黃仁勳的女朋友黃樂正是Megaspeed主事人。黃仁勳透過她的安排，間接令中國的騰訊可以借用輝達晶片去提高算力。黃仁勳不但沒有阻止黃樂這樣做，還想遊說特朗普寬待這種打擦邊球的做法。他主張放手讓中方用美國的晶片，這樣反可令中國更依賴美國。\n\n現在黃仁勳因這件事下台了，顯示美國的政治力量已取得共識，在禁止中國利用美國高科技的事宜上，必須從嚴，盡量堵塞漏洞，不容中方有機可乘。\n\n美國的中期選舉已由民主黨勝出，今後政府的決策難免會看到有更多的民主黨偏好。拜登時代的做法會陸續回朝，中國將受到更多的限制，而香港也不會好受。如是會令本港的投資市場備受壓力。\n\n施永青\n中原集團、中原地產及am730創辦人，崇尚「無為而治」管理哲學，專欄題材廣泛，由議論時政、營商心得，以至分享個人學習及生活經驗。\n文章出自《am730》\n本文僅代表作者觀點，不代表無綫新聞立場。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026JJKJK47hV81795140629.png?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c30eb49f82d","title":"（深圳APEC）从“全妆”迎客到AI赋能 深圳APEC亮点纷呈","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735085.shtml","summary":"中新社深圳11月20日电 题：从“全妆”迎客到AI赋能 深圳APEC亮点纷呈  　　中新社记者 程景伟  　　2026年亚太经合组织(APEC)领导人会议周19日在深圳落下帷幕。","summary_short":"中新社深圳11月20日电 题：从“全妆”迎客到AI赋能 深圳APEC亮点纷呈  　　中新社记者 程景伟  　　2026年…","digest":"题：从“全妆”迎客到AI赋能 深圳APEC亮点纷呈  　　中新社记者 程景伟…","points":["2026年亚太经合组织(APEC)领导人会议周19日在深圳落下帷幕","“深圳人全妆出街迎APEC”登上社交平台热搜，引发外媒关注","不少人还收起广东“省鞋”人字拖，换上更加得体的西装、皮鞋"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T10:17:48+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 题：从“全妆”迎客到AI赋能 深圳APEC亮点纷呈\n\n　　中新社记者 程景伟\n\n　　2026年亚太经合组织(APEC)领导人会议周19日在深圳落下帷幕。一周里，中国作为东道主精心办会，向世界呈现一届高水平的盛会，展现深圳活力、岭南风韵、中国气派，为亚太开放合作注入强劲动力。\n\n　　从深圳“全妆”迎客、会场内外“AI浓度”升高，到各类暖心服务，本届盛会亮点纷呈。\n\n　　人与城“全妆”迎客\n\n　　“深圳人全妆出街迎APEC”登上社交平台热搜，引发外媒关注。这几天，市民用换新装、做发型、化全妆等方式来迎接盛会。不少人还收起广东“省鞋”人字拖，换上更加得体的西装、皮鞋。这被人们戏称为“深圳人的最高礼遇”。\n\n　　深圳全城持续“扮靓”。行走在深圳的街道，“当好东道主 喜迎APEC”等双语主题海报随处可见。在街头巷尾、立交天桥，繁花争相绽放，氛围感突出。\n\n10月28日，深圳深南大道绿化景观带上布设的APEC主题花坛。中新社记者 陈骥旻 摄\n\n　　深圳634座桥梁装点三角梅，花带绵延约360公里。在深圳莲花山公园，长达21米的巨型花坛绿雕成为热门打卡景观。\n\n　　夜幕降临，深圳平安金融中心、京基100等地标建筑幕墙同步点亮，APEC主题动画与英歌舞、醒狮等岭南文化意象交织登场，相关视频频登热搜榜。\n\n　　据媒体报道，来华参会的俄罗斯总统特别代表德米特里耶夫表示，深圳将高耸的摩天大楼与公园绿地巧妙融合，为城市居民营造出一种舒适宜人的生活环境，“既是未来之城，也是自然之城”。\n\n　　“AI浓度”映照未来之城\n\n　　APEC领导人会议周新闻中心位于深圳会展中心(福田)2号馆，为中外记者提供服务。这里因“AI浓度”颇高而被中外媒体大量报道。\n\n　　AI同声传译器、AI录音豆、8K云台相机……各类智能硬件为记者工作提供助力。在这里，机器人每天“上班”提供咖啡饮品，还会主动递送糖果等零食和饮用水，并负责回收垃圾。\n\n11月11日，2026年亚太经合组织(APEC)领导人会议周新闻中心在广东深圳启用并投入运行。图为机器人咖啡师吸引记者拍摄。　中新社记者 陈楚红 摄\n\n　　城市道路上，部分巡游出租车安装AI智能翻译机，支持逾百种语言实时语音翻译；在前海石公园，机器人志愿服务站“小辰”以多语种引路。\n\n　　深圳将智能导航、智能翻译、数字通关等技术应用于接待服务和城市参访各环节；口岸、机场、轨道交通等重点场所布设AI翻译设备7000余套，为外宾提供便利。\n\n　　“AI上APEC”“APEC科技落地签”成为深圳“APEC时间”里的热词，诸多硬科技让一些外媒看到充满未来感的深圳。来自斯里兰卡的电视媒体人穆罕默德说，“深圳就是未来，这里走在了前沿。”\n\n　　暖心服务贯穿全程\n\n　　深圳地铁全线支持境外银行卡拍卡过闸，规范外语标识超10万处，全市离境退税的商店增加到3160家……境外游客只需一部手机，在深圳便能吃住行游购娱一“扫”通办。\n\n　　深圳各口岸持续升级国际化标准硬件，专门开辟APEC绿色通道。深圳宝安国际机场试行“先期机检”，行李无异常旅客入境通关时间压缩至15分钟。城市涉外服务体系让来宾感受到东道主的诚意。\n\n　　志愿者是一道亮丽的城市风景线。会议周期间，深圳420万名注册志愿者投身城市服务保障，提供引导、咨询和语言服务。\n\n　　从曾经的小渔村蝶变成现代化大都市的深圳，在办会中诠释了“开放、创新、合作”的理念。\n\n　　香港中文大学(深圳)公共政策学院院长郑永年指出，深圳为参会的亚太各方提供了良好的体验；盛会之后，从基础设施到APEC规则体系都能延续下去，将让深圳更开放、更国际化。(完)\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8f704ea47c","title":"在深圳，读懂亚太工商界人士的“心头事”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735092.shtml","summary":"聚焦APEC·记者手记｜在深圳，读懂亚太工商界人士的“心头事”  　　新华社深圳11月19日电  　　新华社记者柳丝 王军伟 黄顺达  　　带着几张写满关键词的卡片走进深圳前海国际会议中心时…","summary_short":"聚焦APEC·记者手记｜在深圳，读懂亚太工商界人士的“心头事”  　　新华社深圳11月19日电  　　新华社记者柳丝 王…","digest":"聚焦APEC·记者手记｜在深圳…","points":["新华社深圳11月19日电","带着几张写满关键词的卡片走进深圳前海国际会议中心时，记者心里揣着一个问题：今年…","17日至18日，来自亚太经合组织(APEC)21个经济体和英国、法国、德国…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T10:17:24+08:00","size":1,"keywords":[],"body":"聚焦APEC·记者手记｜在深圳，读懂亚太工商界人士的“心头事”\n\n　　新华社深圳11月19日电\n\n　　新华社记者柳丝 王军伟 黄顺达\n\n　　带着几张写满关键词的卡片走进深圳前海国际会议中心时，记者心里揣着一个问题：今年，亚太工商界人士最关心的是什么？\r\n\n　　17日至18日，来自亚太经合组织(APEC)21个经济体和英国、法国、德国、瑞士等13个域外经济体的2000余位政商界代表齐聚深圳前海，参加2026年APEC工商领导人峰会。\n\n　　峰会期间，记者向来自不同经济体的与会者问起“此行最关心什么”，得到的关键词不尽相同。有人反复强调“开放”，有人强调“合作”，有人连说几个“绿色”，还有人向记者谈起“人工智能”“自由贸易”“多边主义”……这些受访人士身份不同、视角不同，关注点各异，但他们言语中有着对亚太稳定、合作与发展的共同期待。\n\n　　这些关键词背后，是工商界人士关切并亟待回答的现实问题——\n\n　　加中贸易理事会执行理事兼首席运营官比詹·艾哈迈迪担忧，贸易保护主义、环境和气候变化等挑战，正在给亚太经济带来“逆风”；\n\n　　必和必拓集团首席战略和发展官罗海凌关心，地区能否保持开放，因为这关乎“对未来进行投资的信心”；\n\n　　墨西哥前副外长玛尔塔·德尔加多提出，供应链“不应该被拆分”；\n\n　　美国大豆出口协会东亚区执行总监撒加罗从农业角度看问题，强调贸易能否畅通关系到“人们能不能吃上饭，吃上健康食品”……\n\n　　问题各有侧重，但会场内外传递出一种共同情绪：在当下国际形势变乱交织，保护主义、单边主义抬头，技术变革带来机遇与挑战的背景下，亚太工商界人士期盼稳定性与确定性，渴望更多合作伙伴与增长空间，以实现更大、更长远发展。\n\n　　与会工商界人士受访时，更多会把“稳定”，放在“增长”之前。“没有稳定，就没有增长。”印度尼西亚工商会主席阿宁迪亚·诺维安·巴克里说，APEC深圳会议的重要意义之一就是为工商界带来了稳定预期。\n\n　　“互补”，是他们在谈到合作时反复提及的词。来自智利、马来西亚、印度尼西亚等发展中经济体的工商界人士不断谈论着，“你有技术，我有资源和市场，我们之间互补”，合作的关键就在于“把各自所长连接起来”。泰国正大集团资深董事长谢国民抛出一个“大联盟”的观点——未来产业链上每一个环节都各有优势，企业需要“跟成功的高手联盟合作”。\n\n　　“创新”和“绿色”同样是受访人士提到的高频词，代表着合作的未来。以人工智能技术为代表的创新，已不再只是科技企业的话题，也出现在制造业、农业、矿业、航空业、金融业等不同行业对话中。波音全球集团总裁布兰登·纳尔逊说，当前供应链面临着前所未有的巨大冲击，“人工智能和电子商务所推动的航空货运发展，帮助我们更好地应对挑战”。“可持续市场倡议”总裁、全球特使塞菲说，可持续的未来是经济增长的核心方向，绿色发展对各个行业、对共同繁荣的世界至关重要。\n\n　　稳定、开放、互补、合作、创新、绿色……这些在不同对话中浮现出的关键词，正是亚太工商界共同寻找的答案。在这一过程中，他们不约而同地将目光投向中国。在他们眼中，中国不仅是重要的合作伙伴和市场，也为亚太地区稳定发展和绿色创新提供了新的机遇。\n\n　　马来西亚-中国商务理事会主席卢成全感慨，峰会期间，大家谈合作、谈信任、谈开放，许多人都认为“中国在加强区域间互信、推动开放建设方面，正在发挥引领作用”。\n\n　　美国哥伦比亚大学教授杰弗里·萨克斯说，中国是亚太地区几乎所有经济体的主要贸易伙伴，在绿色和数字技术方面处于创新前沿，且传递出“携手合作”的确定信号，“这对当下的亚太和世界来说非常重要”。\n\n　　智利工业促进协会主席罗萨里奥·纳瓦罗有着相同的观点，中国在矿业冶炼、清洁能源和人工智能等领域都有着技术优势，“智中可以携手发展新产业，为经济发展提供新动力”。\n\n　　从写满关键词的提问卡片，到面对面的深入交流，记者在深圳发现，亚太工商界人士心头所期盼的，正是在开放中稳定预期，在创新中拓展空间，在合作中实现互利共赢。\n\n　　走进深圳这座“奇迹之城”，身处APEC深圳会议会场，亚太工商界人士看见的不仅是一个城市的“大故事”，更是一个与自身发展需求紧密相连的未来——亚太是共同发展的天地，也是与中国并肩合作的舞台。 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c539763802b","title":"广西以法典为剑 织密涉重金属污染法治防线","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735048.shtml","summary":"中新网南宁11月20日电 (罗先彬)“有色金属之乡”广西正迎来一场涉重金属治理的法治升级。","summary_short":"中新网南宁11月20日电 (罗先彬)“有色金属之乡”广西正迎来一场涉重金属治理的法治升级。","digest":"“有色金属之乡”广西正迎来一场涉重金属治理的法治升级","points":["中新网南宁11月20日电 (罗先彬)“有色金属之乡”广西正迎来一场涉重金属治理的法治升级","19日，广西壮族自治区生态环境厅在南宁举行新闻发布会…","广西壮族自治区生态环境厅党组成员、副厅长黄颖在发布会上介绍…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T10:12:59+08:00","size":1,"keywords":[],"body":"中新网南宁11月20日电 (罗先彬)“有色金属之乡”广西正迎来一场涉重金属治理的法治升级。19日，广西壮族自治区生态环境厅在南宁举行新闻发布会，详解《中华人民共和国生态环境法典》施行背景下，广西如何通过地方立法、严格规范执法，以法治规范关键金属产业发展，护航产业高质量发展。\n\n　　广西山海相连、喀斯特地貌广布，有色金属产业集聚，生态禀赋独特，但也面临沉重的污染防控压力。\n\n图为发布会现场。广西生态环境厅供图。\n\n　　广西壮族自治区生态环境厅党组成员、副厅长黄颖在发布会上介绍，刚刚闭幕的自治区第十四届人民代表大会常务委员会第二十八次会议审议通过了《广西壮族自治区生态环境保护条例》(以下称《条例》)。新审议通过的《条例》增设涉重金属污染防治专门条款，严格控制新增重点重金属排放项目，明确涉重金属污染依法从重处罚的情形；完善土壤风险评估、地下水监管、岩溶地区保护、畜禽养殖污染治理；健全案件移送、生态环境损害赔偿与公益诉讼衔接机制；删除生态环境法典已经明确的罚则，保留适配广西实际的处罚条款，做到简约管用、精准治污。\n\n　　广西生态环境厅法规与标准处处长黄云甫在发布会上介绍，《条例》第二十七条规定，加强重金属污染防治，强化涉铅、镉、砷、汞、铊、锑、铬、锰、铜、锌等重金属重点行业企业监管，支持指导企业开展技术改造和隐患排查整治，严格控制新建、改建、扩建增加重点重金属污染物排放总量的项目。\n\n　　针对广西有色金属冶炼、电镀等行业含重金属废水和污泥产生量大的实际，《条例》第二十八条要求相关企业事业单位和其他生产经营者落实重金属污染防控措施，根据废水所含重金属种类、浓度实施分类收集和处理，推进含重金属污泥减量化、无害化、资源化；含重金属污泥属于危险废物的，应依法依规收集、贮存、利用、处置。《条例》第三十八条还新增从重处罚条款，对含重金属废水、污泥未采取有效措施收集处置，存在恶意损害生态环境、拒不改正、造成严重危害后果、多次实施违法行为被处罚等法定情形的，依法从重处罚。\n\n　　截至目前，广西共排查8001个涉重金属污染源点位，按生态环境部部署要求的数据质控及风险等级评估，核定保留重点污染源1274个，其中高风险182个、中风险334个、低风险758个。516个中高风险污染源全部完成“三签字”整治方案入库。广西还在全国率先出台涉重金属高风险隐患整治阶段性成效判定指引，持续推进182个高风险污染源整治，其中68个已达到本年度阶段性目标要求。\n\n　　广西生态环境厅今年10月22日出台新版《生态环境行政处罚裁量规则》，将冶炼、电镀、化工等涉重金属重点行业纳入最高裁量档次，对未批先建、未验先投、偷排漏排等违法行为加大处罚力度；在共性基准中新增重金属污染物违法排放、倾倒、处置等从重情形，切实提高违法成本。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce2661438ff","title":"从深圳APEC的三个C，读懂亚太发展的“最大公约数”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735068.shtml","summary":"11月17日午后，深圳湾畔海风微拂，滨海大道两侧簕杜鹃正值花期。","summary_short":"11月17日午后，深圳湾畔海风微拂，滨海大道两侧簕杜鹃正值花期。","digest":"11月17日午后，深圳湾畔海风微拂，滨海大道两侧簕杜鹃正值花期","points":["11月17日午后，深圳湾畔海风微拂，滨海大道两侧簕杜鹃正值花期","走进深圳APEC领导人会议周新闻中心，快门声、键盘敲击声与不同语种的交谈声交织在一起","外交部发言人毛宁表示，三国将围绕维护世界和平、促进大国关系战略稳定深入交换意见"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T10:02:23+08:00","size":1,"keywords":[],"body":"11月17日午后，深圳湾畔海风微拂，滨海大道两侧簕杜鹃正值花期。走进深圳APEC领导人会议周新闻中心，快门声、键盘敲击声与不同语种的交谈声交织在一起。巨幅电子屏滚动着实时会议日程，记者们在工作区赶稿、连线。距离亚太经合组织(APEC)第三十三次领导人非正式会议开幕还有一天，深圳已全面进入“APEC时间”。\r\n\n　　这是中国第三次担任APEC东道主。从2001年上海黄浦江畔，到2014年北京雁栖湖畔，再到2026年南海之滨的深圳，三个坐标见证着中国与亚太共同发展的历程。\n\n　　2001年，中国加入世界贸易组织在即，经济全球化浪潮奔涌向前；2014年，APEC北京会议启动并全面系统推进亚太自贸区进程，批准《亚太经合组织互联互通蓝图(2015—2025)》；2026年，单边主义、保护主义暗流涌动，地缘冲突扰动产业链供应链，全球经济增长面临新的不确定性。\n\n　　穿行于新闻中心与各个会场之间，观察这场国际盛会，有三个英文单词在笔者的采访本上逐渐清晰：CAR、Cooperation、Connectivity。\n\n　　第一个C：CAR\n\n　　CAR——大国沟通，稳定世界预期。这里的CAR并非汽车，而是借用China(中国)、America(美国)、Russia(俄罗斯)三个英文称谓的首字母。\n\n　　11月19日，中美俄三国元首将在深圳举行会晤，这是中俄美三国元首历史上首次面对面会晤。\n\n　　外交部发言人毛宁表示，三国将围绕维护世界和平、促进大国关系战略稳定深入交换意见。中美俄都是联合国创始会员国和安理会常任理事国，三国加强沟通、管控分歧、稳定关系，符合三国利益，也是国际社会的期待。\n\n　　这场会晤之所以受到广泛关注，正是因为它所处的国际环境。地区冲突延宕，战略互疑加深，贸易保护主义抬头，地缘政治风险不断向贸易、科技、金融等领域传导。大国关系的稳定性，日益成为影响国际市场预期的重要变量。\n\n　　对企业而言，一项投资、一条跨境供应链、一项需要多年才能收回成本的工程，都离不开对国际环境的基本判断。政治分歧未必能够迅速消除，但保持沟通、管控风险，能够为经济合作创造更可预期的外部环境。\n\n　　走出新闻中心，APEC旗帜迎风招展。各经济体发展水平、产业结构和利益诉求各不相同，合作并不要求各方完全一致，而是通过对话寻找共同利益。\n\n　　深圳这场会晤，为观察大国关系与区域经济合作的相互影响提供了一个重要窗口。大国沟通关乎亚太发展的外部环境，而经济合作本身，也是稳定国际关系的重要力量。\n\n　　第二个C：Cooperation\n\n　　Cooperation——开放合作，把蛋糕越做越大。\n\n　　如果说新闻中心里的外交议题折射出国际关系的复杂性，那么几公里外的前海会场，则展现出工商界合作的另一番热度。\n\n　　11月17日至18日，APEC工商领导人峰会在深圳前海举行。会场外接驳车往来不息，会场内政商界人士交流不断。来自APEC21个经济体和英国、法国、德国、瑞士等13个域外经济体的2000余位政商界代表齐聚深圳。其中，参会企业包括115家世界500强企业，美国参会企业数量居外方经济体之首，占比近20%。\n\n　　峰会围绕“亚太经济新图景与合作新机遇”开展工商对话，并设置7个专题研讨，涉及互联互通、人工智能创新生态、可持续发展、亚太自贸区建设、数字经济以及粤港澳大湾区与亚太发展机遇等议题。\n\n　　这组参会数据和议题设置传递出一个信号：即使国际经贸环境复杂多变，亚太市场依然具有吸引力，工商界仍在寻找新的市场、技术和合作伙伴。\n\n　　APEC成立37年来，各成员持续推动贸易投资自由化便利化。数据显示，APEC经济体最惠国简单平均关税税率从1989年的16.9%降至2024年的5.1%。2025年，亚太区域GDP规模达61.4万亿美元，货物进出口总额突破26万亿美元。\n\n　　深圳正是这一进程的生动缩影。今年上半年，深圳对APEC其他经济体进出口1.98万亿元，同比增长33%，占全市进出口总值的68.8%。从电子元器件到智能终端，从产业投资到技术合作，深圳的经济发展早已深度融入亚太产业链供应链。\n\n　　2026年恰逢亚太自由贸易区愿景提出20周年。2006年，APEC经济体同意将亚太自贸区作为长期愿景；2014年北京会议启动并全面系统推进相关进程。今年，中方倡议制定亚太自贸区有关成果文件，为下一阶段亚太自贸区进程打造系统务实的行动框架。\n\n　　从降低贸易壁垒到推动制度规则衔接，从扩大商品贸易到培育数字经济、绿色经济新增长点，亚太合作正在向更深层次拓展。\n\n　　第三个C：Connectivity\n\n　　Connectivity——互联互通，拓展发展空间。\n\n　　如果说合作是意愿，那么互联互通就是把合作意愿转化为现实的通道。而在深圳采访，记者对这个词有着格外直观的触感。\n\n　　2014年APEC北京会议，各方批准《亚太经合组织互联互通蓝图(2015—2025)》，从基础设施、制度和人员往来等方面推进区域联通。12年后，互联互通的内涵正在进一步拓展。\n\n　　在新闻中心，AI翻译耳机等智能设备为中外记者提供服务。深圳还支持40余个境外电子钱包扫码支付，为境外来宾提供多元支付选择。\n\n　　互联互通的边界，已经不止于港口、航线和人员往来。过去，商品跨越国境，主要需要解决运输、关税和通关问题。如今，跨国企业协同研发、人工智能跨境应用、数字服务出海，又提出数据流动、标准互认和规则衔接的新要求。\n\n　　今年7月24日，在APEC人工智能高级别论坛上，中方宣布将在深圳前海设立“促进APEC数据跨境流动合作中国中心”，推动构建集政策研究、规则对接、产业服务于一体的综合性、开放式数据跨境流动合作平台。\n\n　　从深圳的产业结构看，这种探索有着现实需求。今年上半年，深圳高新技术产品进出口1.7万亿元，占全市进出口总值的59.1%。电子信息、先进制造等产业高度依赖跨境协作，产品走向世界的同时，研发数据、技术标准和专业资质也需要更加高效的跨境衔接。\n\n　　今年APEC“中国年”将开放、创新、合作确定为三大优先领域。中方还通过互联互通政策对话，为制定升级版APEC互联互通蓝图奠定基础。商务部11月16日公布的数据显示，今年以来，中国与APEC经济体已达成近50项经贸领域务实成果，其中围绕贸易数字化、人工智能等领域达成25项合作成果。\n\n　　从港口联通到数据联通，从贸易便利化到制度规则协调，互联互通正在由传统基础设施建设，延伸至数字时代的制度创新。\n\n　　夜幕降临，深圳的城市灯火次第亮起，新闻中心里依然灯火通明。三个C，三个观察维度，最终指向同一个命题：如何在复杂多变的国际环境中，找到亚太共同发展的“最大公约数”。\n\n　　CAR，关乎大国沟通与战略稳定；Cooperation，体现开放合作的现实价值；Connectivity，则指向亚太未来发展的新空间。\n\n　　从上海到北京，再到深圳，中国三次担任APEC东道主，面对的时代课题不断变化。从融入经济全球化，到推动区域经济一体化，再到探索数字时代的开放合作，中国与亚太共同发展的进程不断向前。\n\n　　大国沟通，为合作创造条件；开放合作，为增长积蓄力量；互联互通，让发展的成果跨越山海。\n\n　　(大众新闻记者 杨成 策划 周学泽) 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8c9bbd96af","title":"土耳其媒体人探访稻香村 点赞新疆乡村振兴成果","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735041.shtml","summary":"中新网新疆和田11月20日电 (张家伟)“来新疆前我已了解到，多民族民众在那里和睦共处。","summary_short":"中新网新疆和田11月20日电 (张家伟)“来新疆前我已了解到，多民族民众在那里和睦共处。","digest":"“来新疆前我已了解到，多民族民众在那里和睦共处","points":["中新网新疆和田11月20日电 (张家伟)“来新疆前我已了解到，多民族民众在那里和睦共处","今天在稻香村亲眼看到当地各族民众共同生活，并实现经济发展，令人感到欣喜","”土耳其《一日报》对外新闻部主任耶尔德勒姆·埃姆雷在新疆和田县百和镇稻香村参访时说"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T09:57:49+08:00","size":1,"keywords":[],"body":"中新网新疆和田11月20日电 (张家伟)“来新疆前我已了解到，多民族民众在那里和睦共处。今天在稻香村亲眼看到当地各族民众共同生活，并实现经济发展，令人感到欣喜。”土耳其《一日报》对外新闻部主任耶尔德勒姆·埃姆雷在新疆和田县百和镇稻香村参访时说。\n\n　　19日，参与“土耳其主流媒体疆行记”采访活动的10余位土耳其媒体人走进稻香村，探访这座曾被沙丘包围、如今以“稻香”闻名的村庄。\n\n11月19日，土耳其媒体人探访新疆和田县百和镇稻香村，与当地民众共舞。张家伟 摄\n\n　　稻香村因地处沙漠边缘，土地盐碱化突出，产业基础薄弱，发展受限。在北京援疆的有力支持下，当地开展盐碱地改良、高标准农田建设，选育特色“金丝米”水稻品种，亩产实现大幅提升，曾经的荒漠沙包地变身千亩稻田，村集体收入与村民人均收入稳步增长。\n\n　　如今村落还打造田园综合体，翻新民居，发展民宿和农家乐，推行“农业+文旅”发展模式，成为国家3A级旅游景区，吸引游客前来游玩。\n\n　　参访间隙，媒体人还现场品尝用“金丝米”烹制的抓饭，引得大家纷纷称赞。\n\n　　耶尔德勒姆·埃姆雷称，他在稻香村看到各类农产品实现了颇具规模的生产，并通过合作社开展销售，收益直接给到生产者本人，同时当地还开展了丰富的文化活动，各族民众和睦安宁地共同生活，让人由衷高兴。\n\n　　土耳其“12Punto”新闻网站记者托普兹·埃克雷姆表示，他在土耳其的时候，并没想到中国给予乡村如此大力度的扶持，来新疆后发现，中国的乡村振兴建设有着重大意义，能够提升社会的福祉水平。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4cc35410f3","title":"（深圳APEC）会见特朗普，习近平三个词指引中美关系“正确航线”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735047.shtml","summary":"中新社深圳11月19日电 题：会见特朗普，习近平三个词指引中美关系“正确航线”  　　中新社记者 黄钰钦  　　“我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。","summary_short":"中新社深圳11月19日电 题：会见特朗普，习近平三个词指引中美关系“正确航线”  　　中新社记者 黄钰钦  　　“我期待…","digest":"（深圳APEC）会见特朗普，习近平三个词指引中美关系“正确航线”","points":["“我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航","11月19日，中国国家主席习近平在深圳会见美国总统特朗普","习近平表示，构建中美建设性战略稳定关系是前无古人的开创性事业，他还用三个关键词“敢闯敢试…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T09:55:40+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：会见特朗普，习近平三个词指引中美关系“正确航线”\n\n　　中新社记者 黄钰钦\n\n　　“我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。”\n\n　　11月19日，中国国家主席习近平在深圳会见美国总统特朗普。习近平表示，构建中美建设性战略稳定关系是前无古人的开创性事业，他还用三个关键词“敢闯敢试、脚踏实地、善作善成”指引中美关系“正确航线”。\n\n11月19日下午，国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。新华社记者 李涛 摄\n\n　　今年以来，从北京到华盛顿再到深圳，中美元首已三度面对面互动。此次特朗普抵达深圳时，习近平赴机场迎接，并表示中国“有礼尚往来的传统”。从礼宾互动到深入交流，两国元首保持密切沟通，为双方团队落实共识提供引领。\n\n　　在专家看来，将构建中美建设性战略稳定关系定性为“前无古人的开创性事业”，源于双边关系的特殊性与复杂性。作为全球性大国，中美之间社会制度、历史文化不同，如何在竞争中保持合作、不让分歧和摩擦主导双边关系，难以从历史中找到现成的答案。\n\n11月19日下午，国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。新华社记者 燕雁 摄\n\n　　中国外交学院院长高飞认为，传统国际关系叙事往往将新兴大国与守成大国的关系引向冲突预期。中美探索构建建设性战略稳定关系，就是努力避免滑向所谓“修昔底德陷阱”，通过和平合作处理矛盾，为大国关系寻找新的可能。这既需要明确的战略意愿，也需要开创性的实践。\n\n　　对于如何推进这项事业，习近平在会见中提出，需要敢闯敢试、脚踏实地、善作善成。对此，清华大学战略与安全研究中心副研究员孙成昊分析称，敢闯敢试意味着突破既有思维局限，探索符合两国利益的相处方式；脚踏实地要求从现实关切入手，将共识转化为具体行动；善作善成则强调持续推进，巩固成果。\n\n　　落实元首共识，需要在拓展合作、管控分歧上付诸行动。此次会见中，习近平强调“要拉长合作清单、压缩问题清单”，并就双方下一步沟通合作提出具体方向，划出重点。\n\n　　“大国之间存在矛盾分歧是正常现象，关键是通过协商寻找解决办法。”高飞分析表示，拉长合作清单可以积累共同利益，压缩问题清单有助于减少关系发展的阻力。对暂时难以解决的问题保持沟通、管控风险，也是在为战略稳定创造条件。\n\n　　如果将时间线拉长，此次中美元首深圳会见的意义更加清晰。5月，两国元首确立中美建设性战略稳定关系新定位。9月，双方进一步赋予这一关系“基于尊重、公平、对等”的新内涵。此次深圳会见，双方同意制定建设性战略稳定关系行动计划。\n\n　　“从确立定位到丰富内涵再到谋划行动，反映出双方对这一关系的理解不断深化。”孙成昊指出，“尊重、公平、对等”，为处理彼此关切明确了重要遵循。制定行动计划，则有助于进一步衔接元首共识与各领域工作，使战略层面的意愿获得更具体的落实路径。\n\n　　下个月，二十国集团领导人峰会将在美国举行，在中美关系的“大年”，双方后续的互动值得关注。从深圳再出发，如何将共识转化为更多行动，将为这项“开创性事业”写下新的注脚。(完)\n 【编辑:刘湃】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3d8025fcfb","title":"（近观中国）中俄美元首历史性会晤 习近平四句话论大国相处之道","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735021.shtml","summary":"中新社深圳11月19日电 (记者 李京泽)当前国际形势风云变幻，大国如何正确相处是需要认真回答的时代命题。","summary_short":"中新社深圳11月19日电 (记者 李京泽)当前国际形势风云变幻，大国如何正确相处是需要认真回答的时代命题。","digest":"当前国际形势风云变幻，大国如何正确相处是需要认真回答的时代命题","points":["中新社深圳11月19日电 (记者 李京泽)当前国际形势风云变幻…","11月19日，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤…","这是中俄美三国最高领导人有史以来首次聚首"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T09:54:18+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 李京泽)当前国际形势风云变幻，大国如何正确相处是需要认真回答的时代命题。11月19日，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，就此给出了中国的答案。\n\n　　这是中俄美三国最高领导人有史以来首次聚首。在这一具有开创性意义的会晤中，习近平以“坚持相互尊重”“坚持和平共处”“坚持合作共赢”“坚持对话协商”四句话为纲领，系统阐释了对大国如何正确相处、共同为世界和平托底的看法。\n\n11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。新华社记者 申宏 摄\n\n　　这四点看法，源自对人类历史的深刻洞察。“历史告诉我们，大国和则世界安，大国斗则世界乱。”习近平明确指出，在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。\n\n　　中国外交学院院长高飞表示，历史上诸多战争，根源往往在于大国冲突博弈。中方从历史中汲取经验教训，推动各方鉴往知来，以大国关系的稳定性为世界和平注入确定性。\n\n　　中国社会科学院世界经济与政治研究所所长廖凡认为，四点看法中，相互尊重是基本准则，和平共处是必要底线，合作共赢是努力目标，对话协商是实践途径。四者环环相扣、有机统一，为大国交往提供清晰指引。\n\n　　其中，坚持相互尊重被置于首位。高飞分析称，这相当于系好大国相处的“第一粒纽扣”。一旦缺失相互尊重，各方容易无视对方核心关切，导致矛盾升级，影响大国关系稳定发展。\n\n11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。新华社记者 燕雁 摄\n\n　　在会晤中，习近平指出，“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线。\n\n　　北京外国语大学区域与全球治理高等研究院教授崔洪建说，“修昔底德陷阱”常被用来描述大国走向对抗的风险。而中方提出大国之间做伙伴、做朋友，是对新型大国关系的主动塑造，为破解大国对抗的历史难题提供新思路。\n\n　　当前，全球各种纷争持续不断，热点问题跌宕起伏。在坚持对话协商方面，习近平提到，中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。\n\n　　廖凡认为，大国在热点议题上拥有重要影响力。若中俄美三国协同发力，有望进一步加快地区热点的政治解决进程。\n\n　　值得关注的是，此次会晤中，三国元首还就乌克兰危机、防止核武器扩散、中东局势、朝鲜半岛等重大国际和地区问题交换了意见。会后，三国发表《中俄美元首和平宣言》，涉及联合国改革、精炼石油产品的生产和供应、国家官员豁免、减少核风险等内容。\n\n　　崔洪建认为，会晤紧扣全球热点议题，密集回应国际社会关切。三方加强沟通、凝聚共识，为大国正确相处之道找到具体落点，凸显中方四点看法的实践价值。\n\n　　“今天的中俄美元首会晤是积极的、建设性的，也是富有成果的，三国在维护世界和平上看法是一致的。”习近平在总结讲话中指出，“三国元首会晤播下的种子，必将生根发芽、开花结果”。\n\n　　高飞表示，此次会晤中，中方系统阐释大国正确相处之道，中俄美三方相向而行，向外界传递出大国之间良性互动、和平共处的积极意愿。中俄美沿着大国正确相处之道前行，将推动营造和平稳定的国际环境，为世界带来积极预期，这也正是本次会晤最重要的价值。(完)\n 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5ce9a5bf98","title":"【和合共生】习言道｜密集会见多国领导人，习近平频繁提及这几个词","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735017.shtml","summary":"中新网11月20日电 题：密集会见多国领导人，习近平频繁提及这几个词  　　亚太经合组织(APEC)第三十三次领导人非正式会议于11月18日至19日在深圳举行。","summary_short":"中新网11月20日电 题：密集会见多国领导人，习近平频繁提及这几个词  　　亚太经合组织(APEC)第三十三次领导人非正…","digest":"题：密集会见多国领导人…","points":["亚太经合组织(APEC)第三十三次领导人非正式会议于11月18日至19日在深圳举行","这几天，习近平主席开启了繁忙的外事日程","17日至19日，习近平主席在深圳会见了来华与会的加拿大总理卡尼，巴布亚新几内亚总理马拉佩…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T09:42:24+08:00","size":1,"keywords":[],"body":"中新网11月20日电 题：密集会见多国领导人，习近平频繁提及这几个词\n\n　　亚太经合组织(APEC)第三十三次领导人非正式会议于11月18日至19日在深圳举行。这几天，习近平主席开启了繁忙的外事日程。\n\n　　17日至19日，习近平主席在深圳会见了来华与会的加拿大总理卡尼，巴布亚新几内亚总理马拉佩，越共中央总书记、国家主席苏林，墨西哥总统辛鲍姆，秘鲁总统藤森庆子，智利总统卡斯特，韩国总统李在明，俄罗斯总统普京，美国总统特朗普等多位经济体领导人。\n\n　　国际形势复杂多变背景下，高密度的双边会见中，习近平主席高频提到了几个关键词。\n\n　　互信\n\n　　“增进政治互信”“双方要增进互信团结”“做互尊互信的同行者”……在多场双边会见中，“互信”是习近平主席反复提及的词。\n\n　　国与国之间交往，增进互信至关重要。\n\n　　在一场场会见中，习近平主席为增进互信、推动双边关系发展指明方向——\n\n　　中越“作为同志加兄弟，越是风高浪急，越要同舟共济”；中加要“不断增进对彼此发展道路和政策意图的正确认知，加深对相互核心利益和重大关切的理解尊重”；中墨“要坚持真诚相待，深化政治互信，把稳两国关系发展正确方向”……\n\n　　一系列重要论述传递出中方始终在相互尊重、平等相待、互利共赢的基础上同各国开展全方位合作，加强各领域交流的一贯主张。\n\n　　合作\n\n　　今年是中国“十五五”开局之年。习近平主席指出，中国“十五五”规划是“中国面向全球工商界发出的合作邀约”。\n\n　　密集的双边会见中，在传统领域合作外，习近平主席频频谈及新兴领域合作：会见马拉佩时，提出“拓展数字经济、金融服务、绿色能源、科技等合作新空间”；会见藤森庆子时，强调“挖掘新能源、人工智能等新兴合作潜力”；会见李在明时，指出“培育人工智能等新兴科技产业合作生态”……\n\n　　当前，中国经济保持向新向优向好发展态势，展现出强大韧性和活力。这几天的密集会见，多位领导人表达了加强与中方对话合作的意愿，折射出中国市场的强大吸引力。\n\n　　稳定\n\n　　亚太过去几十年经济快速增长，得益于和平稳定的环境。\n\n　　回首过去，正是因为摆脱了冷战阴霾，亚太地区特别是中小经济体步入奔向现代化的快车道，“亚太奇迹”才应运而生。\n\n　　当今世界变乱交织，“稳定”成为稀缺资源。\n\n　　中俄关系是动荡变革的当今世界最稳定、最成熟、最富战略内涵的一组大国关系。18日会见普京时，习近平主席指出，“中俄关系既‘风雨不动安如山’，又‘风物长宜放眼量’，为变乱交织的世界提供了更多稳定性和确定性”。\n\n　　中美关系是世界上最重要的双边关系之一。19日会见特朗普时，习近平主席指出，构建中美建设性战略稳定关系是前无古人的开创性事业，需要敢闯敢试、脚踏实地、善作善成。\n\n　　会见多位领导人时，习近平主席多次强调“稳定”：“共守和平稳定、共促发展繁荣”“维护全球产业链供应链稳定畅通”“提供更加稳定、可预期的投资和营商环境”。\n\n　　稳，才能安；安，才能兴。习近平主席从多方面就全球治理提出中国主张：“坚定扛起大国应有的责任和担当，引领和推动世界多极化和国际关系民主化”“共同践行真正的多边主义，维护联合国权威和多边贸易体制，推动构建更加公正合理的全球治理体系”“共同捍卫真正的多边主义，做发展中国家共同利益的维护者”……\n\n　　今年，中国第三次担任亚太经合组织东道主。18日，在亚太经合组织工商领导人峰会上，习近平主席强调，无论国际风云如何变幻，中国同世界各国合作共赢的决心都不会改变。\n\n　　无论是担当大国责任，还是维护发展中国家利益，动荡世界中，中国始终都是稳定之锚。\n\n　　｜总策划：俞岚\n\n　　｜策划：周锐\n\n　　｜统筹：马学玲 阚枫\n\n　　｜执笔：袁秀月\n\n　　｜审校：孙静波 邵萌\n\n　　｜视觉：张舰元 雷宇竺\n\n　　｜中国新闻网“习言道”工作室出品\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf3f9809119","title":"深圳APEC︱4點和平宣言明確推進議程 美失國際權力獨佔優勢︱拆局","url":"https://www.stheadline.com/realtime-china/3639154/深圳APEC4點和平宣言明確推進議程-美失國際權力獨佔優勢拆局","summary":"北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示，這份三方和平宣言的核心亮點，在於三方明確了後續協同推進的共同議程，4項內容各有側重。","summary_short":"北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示，這份三方和平宣言的核心亮點…","digest":"北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示…","points":["北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示，這份三方和平宣言的核心亮點…","第一，核風險對話打開了新的合作入口","宣言重申「核戰爭打不贏也打不得」，並明確三國將開展減少核風險、防止核擴散的對話…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:39:41+08:00","size":1,"keywords":[],"body":"北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示，這份三方和平宣言的核心亮點，在於三方明確了後續協同推進的共同議程，4項內容各有側重。第一，核風險對話打開了新的合作入口。宣言重申「核戰爭打不贏也打不得」，並明確三國將開展減少核風險、防止核擴散的對話，達成核風險管控相關承諾。但此次尚未涉及核武器數量削減，後續對話機制的落實情況，仍待觀察。\n相關新聞：深圳APEC︱中美俄會談締歷史共推《和平宣言》 習近平：做夥伴不搞對抗\n能源合作聯繫各國企業民眾利益\n第二，能源合作直接回應現實經濟壓力。宣言提出增加精煉石油產品的生產和供應，並重申能源穩定流動的重要性。這使三方協調同各國企業和民眾的利益聯繫起來。後續看點是能否明確供應安排，讓能源安全合作產生收益。\n第三，聯合國仍是三國協調的重要共同基礎。宣言以安理會常任理事國的責任為出發點，提出推動聯合國改革、提高其應對全球挑戰的能力。「我的理解是三國希望通過改善現有機制發揮作用。能否在具體議題上加強合作、爭取其他成員支持，將是下一步值得觀察的。」孫成昊說。\n相關新聞：深圳APEC‧直擊｜熱情民眾無懼封路聚香蜜公園遠眺打卡 「如當年辦京奧般振奮」\n第四，國際司法條款體現了三方特定的利益交集。關於國家同意、官員豁免及防止國際刑事法院濫用管轄權的表述，反映三國對主權和國際司法權限的共同關切。它也說明三方能夠圍繞具體議題協調立場。\n海南大學國際傳播與藝術學院教授畢研韜對《星島》分析，中俄美三國對於本次會晤的目標預期各有側重：美國關注核軍控等議題，俄羅斯冀透過三方溝通改善外交處境，中國則聚焦大國關係的戰略穩定與全球和平。三方均有傳遞自身立場的需要，既存在競爭，亦致力防範衝突升級。這場會晤本身已是重大突破，兼具象徵與實質意義，中國作為東道主妥善擔當角色，作出具有歷史意義的貢獻。\n相關新聞：深圳APEC．有片｜習近平特朗普扶梯上互助「挽手」畫面熱傳\n西方憂中國成國際規則參與者\n畢研韜指出，國際權力格局正由美國獨佔優勢，逐漸轉向多個大國共同發揮影響力，這也是西方憂慮所在。對美國來說，較難接受的並非中國實力提升，而是自身不再擁有單方面主導國際事務的能力。二戰之後，美國連同盟友主導國際政經制度搭建，西方在不少核心規則的制訂上握有話語權。\n畢研韜指出，隨着中國綜合實力抬升，客觀上需要在全球事務中取得與自身實力、國際責任相匹配的角色。中國參與全球治理改革、推動多邊合作，推出多項國際倡議。西方擔心中國由過往國際規則的接受者，轉為規則共建參與者，繼而牽動全球制度的權力分配，動搖西方長期享有的制度優勢。駐京記者 楊浚源","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb07c0698d7","title":"深圳APEC︱中美俄會談締歷史共推《和平宣言》 習近平：做夥伴不搞對抗","url":"https://www.stheadline.com/realtime-china/3638877/深圳APEC中美俄會談締歷史共推和平宣言-習近平做夥伴不搞對抗","summary":"APEC CHINA 2026 亞太經合組織（APEC）峰會昨在深圳結束後，中美俄元首舉行史上首次三方會晤，會後發表4點《和平宣言》，包括推動聯合國改革，維護國際和平與安全，計劃增加石油產量…","summary_short":"APEC CHINA 2026 亞太經合組織（APEC）峰會昨在深圳結束後，中美俄元首舉行史上首次三方會晤…","digest":"APEC CHINA 2026 亞太經合組織峰會昨在深圳結束後…","points":["APEC CHINA 2026 亞太經合組織（APEC）峰會昨在深圳結束後…","習近平強調，「大國和則世界安，大國鬥則世界亂」，中俄美作為世界主要大國，應該當好表率…","他相信今次三方會晤「播下的種子，必將生根發芽、開花結果"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:00:14+08:00","size":1,"keywords":[],"body":"APEC CHINA 2026 亞太經合組織（APEC）峰會昨在深圳結束後，中美俄元首舉行史上首次三方會晤，會後發表4點《和平宣言》，包括推動聯合國改革，維護國際和平與安全，計劃增加石油產量，並就減少核風險進行對話等。習近平強調，「大國和則世界安，大國鬥則世界亂」，中俄美作為世界主要大國，應該當好表率，「做夥伴、做朋友，不衝突、不對抗」，堅持對話協商，換位思考，特別是不能觸碰對方的底線。他相信今次三方會晤「播下的種子，必將生根發芽、開花結果。」\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n會晤昨午以圓桌會方式在深圳麒麟山莊舉行，主持會議的習近平坐在中間，特朗普及普京分別坐在習近平左邊及右邊。在開放媒體拍攝時段，三國元首先後發表講話，接着舉行閉門會議。新華社報道，三方就烏克蘭危機、防止核武器擴散、中東局勢、朝鮮半島等問題交換了意見。\n重申核戰爭打不贏也打不得\n會後，新華社公布《中俄美元首和平宣言》：一、致力於推動聯合國改革，使之更有效應對全球性挑戰，維護國際和平與安全。二、三國計劃增加精煉石油產品的生產和供應，重申能源穩定流動的重要性。三、尊重國家官員享有豁免至關重要，一致認為國際刑事法院以及其他類似機構不得濫用管轄權。四、重申核戰爭打不贏也打不得。三國將就減少核風險、防止核擴散進行對話。\n相關新聞：深圳APEC︱特朗普晤習近平 表態：美國不支持「台獨」\n習近平指出，中俄美三國最高領導人有史以來首次聚首，具有開創性意義。80多年前，中俄美三國並肩奮戰，為世界贏得和平和安寧。當前，世界百年變局加速演進，天下並不太平。中俄美作為主要大國和聯合國安理會常任理事國，應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定。\n「大國和則世界安，大國鬥則世界亂。」習近平指出，中俄美三國國情不同，要尊重彼此主權和領土完整，堅持不干涉別國內政，在涉及對方的重大敏感問題上，要提前溝通、換位思考、謹慎行事，特別是不能觸碰對方的底線。他說，「修昔底德陷阱」絕不是宿命，中俄美要做夥伴、做朋友，不衝突、不對抗，保持常態化高層交往，暢通各層級對話渠道，建立危機溝通和預防機制，確保誤判少發生、分歧管得住、摩擦不升級。\n相關新聞：深圳APEC︱特朗普晤習近平 稱「美中同盼俄烏伊朗止戰」\n保持常態化交往 不能觸碰底線\n普京表示，感謝中方安排這次歷史性會晤，俄方願同中美相互尊重、平等對話、和平共處、妥處分歧，促進自由開放的國際貿易，維護能源、糧食安全，加強人工智能治理國際合作，共同為世界和平安全作出貢獻。特朗普表示，三國元首會晤創造了歷史。三國都是有核國，對維護世界和平穩定負有特殊重要的責任。三方應共同防止核擴散，避免核武器給人類帶來災難。\n普京昨晚在深圳召開記者會說，三方會晤的形式是成功的，三國領導人進行了「坦率」且「非常有益」的討論，不排除今後以其他形式就某些問題作出決定的可能。特朗普昨晚已乘坐「空軍一號」專機離開深圳，中共政治局委員、外長王毅前往送機。\n普京：三國領導人進行坦率討論\n王毅其後在APEC新聞中心舉行記者會，這是三國元首歷史上首次舉行會晤，意義重大，影響深遠，是載入史冊的標誌性事件。會晤氣氛坦誠友好，富有建設性。王毅表示，世界百年變局加速演進，各種風險挑戰層出不窮，中方將與俄美兩國全面高效落實會晤共識，並透過工作層面保持溝通協調，共同朝着建設更美好的世界，作出不懈努力。\n中俄美元首和平宣言\n1.致力推動聯合國改革，使之更有效應對全球性挑戰，維護國際和平與安全。\n2.三國計劃增加精煉石油產品的生產和供應，重申能源穩定流動的重要性。\n3.尊重國家官員享有豁免至關重要，一致認為國際刑事法院以及其他類似機構不得濫用管轄權。\n4.重申核戰爭打不贏也打不得。三國將就減少核風險、防止核擴散進行對話。\n《星島》中國組","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3a4e96f218","title":"俯瞰神州‧新疆｜稀有保育物種現蹤 西伯利亞羱羊雪地奔騰","url":"https://news.tvb.com/tc/1207216-俯瞰神州新疆稀有保育物種現蹤西伯利亞羱羊雪地奔騰","summary":"一群西伯利亞羱羊屬中國國家重點保護的稀有物種，近日被發現在中國西北部新疆維吾爾自治區的雪山間奔跑與覓食。在近期一場降雪期間，這些動物穿梭於崎嶇的地形中，為寧靜的冬日景致增添了生機。","summary_short":"一群西伯利亞羱羊屬中國國家重點保護的稀有物種，近日被發現在中國西北部新疆維吾爾自治區的雪山間奔跑與覓食。","digest":"一群西伯利亞羱羊屬中國國家重點保護的稀有物種…","points":["一群西伯利亞羱羊屬中國國家重點保護的稀有物種，近日被發現在中國西北部新疆維吾爾自治區的雪山間…","在近期一場降雪期間，這些動物穿梭於崎嶇的地形中，為寧靜的冬日景致增添了生機","西伯利亞羱羊通常棲息於海拔3,500至6,000公尺的陡峭山坡，活躍於中亞與北亞的高山環境…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T08:00+08:00","size":1,"keywords":[],"body":"一群西伯利亞羱羊屬中國國家重點保護的稀有物種，近日被發現在中國西北部新疆維吾爾自治區的雪山間奔跑與覓食。\n\n在近期一場降雪期間，這些動物穿梭於崎嶇的地形中，為寧靜的冬日景致增添了生機。\n\n西伯利亞羱羊通常棲息於海拔3,500至6,000公尺的陡峭山坡，活躍於中亞與北亞的高山環境，並在冬季臨近時遷移至較低海拔地區。","image":"https://pro-vod-cdn.tvb.com/4d56b16cd9fb463e942e7345b7081f6c/snapshots/4ea1b5eabf4d4c0ba488ae3b25d01d0c-00007.jpg","video":"https://pro-vod-cdn.tvb.com/4d56b16cd9fb463e942e7345b7081f6c/8e82d10e3a1948388efe28fd25f149e6-edf687fac7921cb3e7afe2270c5db056-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/4d56b16cd9fb463e942e7345b7081f6c/snapshots/4ea1b5eabf4d4c0ba488ae3b25d01d0c-00007.jpg","lang":"zh-Hant"},{"id":"c3a6837598b","title":"强化对党忠诚教育（学习贯彻党的二十届五中全会精神）","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735003.shtml","summary":"王小洪  　　对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求。","summary_short":"王小洪  　　对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求。","digest":"王小洪  　　对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求","points":["对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求","党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》…","我们要深刻认识强化对党忠诚教育的重要意义，找准着力点、切入点，增强针对性、实效性…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:50:00+08:00","size":1,"keywords":[],"body":"王小洪\n\n　　对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求。党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，立足新形势新任务对全面从严治党提出的新要求，就强化对党忠诚教育作出重要部署。我们要深刻认识强化对党忠诚教育的重要意义，找准着力点、切入点，增强针对性、实效性，教育引导全体党员、干部永葆对党忠诚的政治本色。\n\n　　一、深入学习领会习近平总书记关于对党忠诚和强化对党忠诚教育的重要论述\n\n　　党的十八大以来，习近平总书记围绕对党忠诚和强化对党忠诚教育作出一系列重要论述，丰富和发展了马克思主义建党学说，为我们做好相关工作指明了方向、提供了根本遵循。关于重要意义，习近平总书记指出，“党的事业，人民的事业，是靠千千万万党员的忠诚奉献而不断铸就的”，强调“如果没有对党忠诚作政治上的‘定海神针’，就很可能在各种考验面前败下阵来”。关于深刻内涵，习近平总书记指出，“对党忠诚，不是抽象的而是具体的，不是有条件的而是无条件的，必须体现到对党的信仰的忠诚上，必须体现到对党组织的忠诚上，必须体现到对党的理论和路线方针政策的忠诚上”，强调“对党忠诚，就要增强‘四个意识’、坚定‘四个自信’、做到‘两个维护’，严守党的政治纪律和政治规矩，始终在政治立场、政治方向、政治原则、政治道路上同党中央保持高度一致”。关于实践要求，习近平总书记指出，“对党忠诚，必须一心一意、一以贯之，必须表里如一、知行合一，任何时候任何情况下都不改其心、不移其志、不毁其节”，强调要“以坚定的理想信念砥砺对党的赤诚忠心”，“自觉做到党中央提倡的坚决响应、党中央决定的坚决照办、党中央禁止的坚决不做”。关于对党忠诚教育，习近平总书记强调，“新形势下，要大力加强对党忠诚教育”，“我们培养优秀年轻干部，千条万条，第一条就是教育他们对党忠诚”，“党员领导干部要把对党忠诚纳入家庭家教家风建设，引导亲属子女坚决听党话、跟党走”。对这些重要论述，我们要深入学习领会、坚决贯彻落实。\n\n　　二、充分认识强化对党忠诚教育的重要性\n\n　　新征程上，强化对党忠诚教育，对于全党更加紧密地团结在以习近平同志为核心的党中央周围，凝聚起以中国式现代化全面推进强国建设、民族复兴伟业的智慧和力量，具有十分重要的意义。\n\n　　(一)强化对党忠诚教育是传承党百年奋斗宝贵经验的必然要求。我们党自成立起，就把强化对党忠诚教育作为重中之重。新民主主义革命时期，我们党强调“忠心耿耿地为民族、为阶级、为党而工作”。社会主义革命和建设时期，我们党把“对党忠诚老实”作为党员的基本义务，着力培养既懂政治又懂业务、又红又专的干部。改革开放和社会主义现代化建设新时期，我们党按照革命化、年轻化、知识化、专业化的标准加强干部教育，对党忠诚始终是重要内容。新时代以来，以习近平同志为核心的党中央把对党忠诚教育摆在更加突出的位置，持续开展集中教育和经常教育，把党的团结统一推到了新高度。历史充分证明，加强忠诚教育、夯实忠诚根基，是我们党100多年奋斗的宝贵经验，也是我们党始终走在时代前列的精神密码，必须一以贯之地传承好、发扬好。\n\n　　(二)强化对党忠诚教育是坚持和加强党中央集中统一领导的必然要求。坚持和加强党中央集中统一领导，是做好一切工作的根本保证。随着改革开放不断深入，社会利益多元化、思想多样化深刻影响到党员、干部的观念和行为，破坏党的团结统一、影响党的凝聚力和战斗力的现象依然存在，背离党中央集中统一领导的问题时有发生。只有强化对党忠诚教育，才能把全党思想和行动统一到以习近平同志为核心的党中央决策部署上来，确保党的领导一贯到底、党中央政令畅通，形成万众一心、无坚不摧的磅礴力量。\n\n　　(三)强化对党忠诚教育是锻造堪当民族复兴重任的高素质干部队伍的必然要求。好干部标准有千万条，对党忠诚老实是第一条。当前，党的队伍主流是好的，但思想不纯、组织不纯、作风不纯问题尚未根本解决，少数党员、干部包括高级干部仍存在“假忠诚”、“伪忠诚”的问题，给党内政治生态、党和人民事业造成严重危害。只有强化对党忠诚教育，引导党员、干部砥砺对党的赤诚忠心，树立正确世界观、人生观、价值观和事业观、政绩观、权力观，做到为党分忧、为国尽责、为民奉献，才能确保党不变质不变色不变味。\n\n　　(四)强化对党忠诚教育是推进强国建设、民族复兴伟业的必然要求。我们党不断取得胜利，依靠的就是一代又一代对党的事业无比忠诚的共产党员。当前，世界百年未有之大变局加速演进，我国发展正处于战略机遇和风险挑战并存、不确定难预料因素增多的时期，需要时刻准备经受风高浪急甚至惊涛骇浪的重大考验。只有强化对党忠诚教育，推动全体党员、干部固根守魂，在纷繁复杂的国内外形势中把握大局大势、坚定信心决心，勇于斗争、善于斗争，才能战胜前进道路上的一切风险挑战。\n\n　　三、牢牢把握强化对党忠诚教育的重点\n\n　　面对新形势新任务，要坚持把对党忠诚摆在党性修养的突出位置，紧扣重点关键，有针对性强化教育引导。\n\n　　(一)聚焦坚决做到“两个维护”。坚强的领导核心和科学的理论指导，是关乎党和国家前途命运、党和人民事业成败的根本性问题。党的十八大以来，习近平总书记以马克思主义政治家、思想家、战略家的恢宏气魄、远见卓识、雄韬伟略，带领全党全军全国各族人民砥砺奋进，推动党和国家事业取得历史性成就、发生历史性变革。实践充分证明，“两个确立”是战胜一切艰难险阻、应对一切不确定性的最大确定性、最大底气、最大保证。新时代强化对党忠诚教育，必须教育引导党员、干部深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”，始终在思想上政治上行动上同以习近平同志为核心的党中央保持高度一致。\n\n　　(二)聚焦坚定理想信念。忠诚不是自然而然产生的，对党要有朴素的感情，更要有理性的自觉。我们党从诞生之日起，就把马克思主义鲜明地写在自己旗帜上，把实现共产主义确立为最高理想。100多年来，无数共产党人不惜流血牺牲，靠的就是这种信仰，为的就是这个理想。新时代强化对党忠诚教育，必须教育引导党员、干部深入学习马克思主义基本理论，掌握和运用辩证唯物主义、历史唯物主义的立场观点方法，深化对共产党执政规律、社会主义建设规律、人类社会发展规律的认识，弄明白历史怎样走来、又怎样走下去，把学习成果转化为对马克思主义的信仰、对共产主义的信念、对中国特色社会主义的信心，做到虔诚而执着、至信而深厚。\n\n　　(三)聚焦提高政治能力。在党员、干部的所有能力中，政治能力是第一位的。面对错综复杂的形势，首先要善于从政治上分析问题、解决问题，提高政治判断力、政治领悟力、政治执行力，做到在重大问题和关键环节上头脑特别清醒、眼睛特别明亮、行动特别坚决。新时代强化对党忠诚教育，必须教育引导党员、干部胸怀“两个大局”、牢记“国之大者”，时刻关注党中央在关心什么、强调什么，准确把握党中央大政方针和战略意图，自觉把思想统一到党中央对形势任务的分析判断上来，不折不扣贯彻落实党中央决策部署；发扬斗争精神、增强斗争本领，坚决同一切否定党的领导和中国特色社会主义制度的言行、一切违背党的理论和路线方针政策的言行、一切危害国家统一和民族团结的言行作斗争，做到政治立场不移、政治方向不偏。\n\n　　(四)聚焦忠诚党的组织。党的力量来自组织，严密的组织体系是我们党的强大优势。历史和现实证明，如果不忠诚党的组织，把自己凌驾于组织之上，就会损害党中央权威和集中统一领导，影响党的事业。新时代强化对党忠诚教育，必须教育引导党员、干部牢记组织是我们最大的依靠，在党爱党、在党言党、在党忧党、在党为党，相信组织、依靠组织、服从组织，自觉接受组织管理监督，说老实话、办老实事、做老实人，做到襟怀坦荡、光明磊落、言行一致。\n\n　　(五)聚焦为党和人民积极工作。我们党进行的一切奋斗、一切牺牲、一切创造，都是为中国人民谋幸福、为中华民族谋复兴。对党忠诚不是一句空洞的口号，不能只停留在口头表态上，而要看实际行动，看能不能为党和人民事业勇于担当进取、甘于牺牲奉献。新时代强化对党忠诚教育，必须教育引导党员、干部坚持人民至上、事业第一，巩固拓展树立和践行正确政绩观学习教育成果，以功成不必在我的精神境界和功成必定有我的历史担当，积极投身以中国式现代化全面推进强国建设、民族复兴伟业，种好党组织交给的“责任田”，真正创造经得起实践、人民、历史检验的实绩，在担当尽责中书写忠诚。\n\n　　四、提高对党忠诚教育的质效\n\n　　对党忠诚教育是增强共产党人党性的重要抓手，也是加强党的建设的永恒课题，需要系统发力、持续用力。要遵循党员、干部成长规律和教育培训规律，坚持显性教育和潜移默化相结合、全面覆盖和分级分类相结合，进一步完善机制措施、创新方法手段、强化责任落实，引导全体党员、干部做到忠心护党、永不叛党。\n\n　　(一)强化理论学习。政治上的坚定源于理论上的清醒。要紧密结合党员、干部队伍的结构性变化和时代特点，坚持不懈用习近平新时代中国特色社会主义思想凝心铸魂，坚持和完善“第一议题”制度，提高党委(党组)理论学习中心组学习和基层党组织理论学习质量，健全常态化培训机制，持续用党的创新理论统一思想、统一意志、统一行动，教育引导党员、干部静下心来读原著、学原文、悟原理，自觉开展对照检视，及时掸去思想上的灰尘、纠正行为上的偏差，真正使理论学习的过程成为纯洁党性、砥砺忠诚的过程。同时，要认识到历史是最好的教科书、党史是最好的营养剂，深化党史、新中国史、改革开放史、社会主义发展史教育，用党的奋斗历程和伟大成就鼓舞斗志、坚定信心，用革命先辈的光辉事迹传承红色基因、弘扬革命精神，切实把忠诚注入血脉、融入灵魂。\n\n　　(二)强化政治历练。对党忠诚必须在伴随一生、永无止境的政治历练中不断强化。要充分发挥各级党组织的政治功能和组织功能，引导党员、干部加强政治历练，接受严肃认真的党内政治生活锻炼，特别是多到重大斗争最前沿，在复杂局面中增长见识、明辨是非，在风雨波浪中磨砺初心、淬炼筋骨，持续改造自己、提高自己，不断提高对党忠诚的“含金量”。同时，要引导党员、干部严守党的政治纪律和政治规矩，净化党内政治生态，旗帜鲜明反对“七个有之”和思想上的自由主义、政治上的投机主义、组织上的宗派主义、工作上的本位主义、履责上的好人主义，决不当两面派、两面人。\n\n　　(三)强化实践锤炼。对党忠诚是政治标准更是实践标准。要按照以习近平同志为核心的党中央擘画的蓝图、指明的方向，充分调动党员、干部干事创业的积极性主动性创造性，引导他们到改革发展稳定一线、艰苦复杂地区、关键吃劲岗位担苦、担难、担重、担险，以一往无前的精神投身中国式现代化建设实践，逢山开路、遇水架桥，破除一切障碍、扫除一切“拦路虎”，做到平常时候看得出来、关键时刻站得出来、危难关头豁得出来，使他们在这一过程中铸牢对党忠诚。\n\n　　(四)强化文化浸润。要加强党内政治文化建设，注重政治仪式的运用，完善重温入党誓词、入党志愿书等活动，更好让党内政治文化“日用而不觉”。善于汲取中华优秀传统文化、革命文化、社会主义先进文化精神养分，坚守共产党人价值观。要把学习宣传先进典型作为重要抓手，树立可亲可敬可学的典型榜样，激发党员、干部的思想认同、情感共鸣，自觉做到见贤思齐。把家庭作为对党忠诚教育的重要课堂，把对党忠诚纳入党员家庭家教家风建设，通过家教家风传承红色基因。 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b39abcf16","title":"王毅介绍亚太经合组织第三十三次领导人非正式会议及相关活动成果","url":"https://www.chinanews.com.cn/gn/2026/11-20/10734999.shtml","summary":"2026年11月19日，中共中央政治局委员、外交部长王毅在深圳向中外记者介绍亚太经合组织第三十三次领导人非正式会议及相关活动成果，并回答记者提问。","summary_short":"2026年11月19日，中共中央政治局委员、外交部长王毅在深圳向中外记者介绍亚太经合组织第三十三次领导人非正式会议及相关…","digest":"2026年11月19日，中共中央政治局委员…","points":["2026年11月19日，中共中央政治局委员、外交部长王毅在深圳向中外记者介绍亚太经合组织第三…","一年来，中方全面履行东道主责任，成功举办321场APEC会议和活动…","各场专业部长会议达成10余份重要成果，开放、创新、合作成为贯穿全年的高频词"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:46:21+08:00","size":1,"keywords":[],"body":"2026年11月19日，中共中央政治局委员、外交部长王毅在深圳向中外记者介绍亚太经合组织第三十三次领导人非正式会议及相关活动成果，并回答记者提问。\n\n　　王毅表示，今年是APEC“中国年”。一年来，中方全面履行东道主责任，成功举办321场APEC会议和活动，各经济体与会代表上万人次，创造了APEC史上的纪录，也为亚太合作注入了新鲜活力和强劲动力。各场专业部长会议达成10余份重要成果，开放、创新、合作成为贯穿全年的高频词。在开放领域，贸易部长会发表《苏州声明》，重申致力于推动区域经济一体化，深化亚太自贸区建设。在创新领域，数字和人工智能部长会发表《成都声明》，提出以数字经济和人工智能赋能亚太共同体建设。在合作领域，人力资源部长会发表《南京声明》，聚焦投资于人，改善就业民生，增进人民福祉。昨天的工商领导人峰会又发布《深圳倡议》，提出亚太工商界携手共建亚太共同体。全年各领域会议和活动共计75项主要成果，已形成《东道主会议和活动清单》和《东道主成果清单》并对外发布。\n\n　　APEC“中国年”的高潮就是刚刚成功举行的领导人非正式会议，这是中国今年最重要的主场外交，也是亚太经济合作铸就的一座新高峰。当今国际局势动荡不安、世界经济增长承压、逆全球化不断抬头，21个APEC经济体的领导人和代表齐聚深圳，共同探讨应对之策，共同协商合作大计，不仅对开创亚太合作新局具有重大意义，也将对维护世界和平发展产生深远影响。世界的目光投向中国、聚焦深圳。\n\n　　几天来，习近平主席主持领导人非正式会议，出席工商领导人峰会开幕式，进行双边会晤，主持中俄美元首会晤，密集开展了近20场双多边活动。在习近平主席引领下，在各经济体领导人支持下，会议达成富有雄心、务实全面的《亚太经合组织领导人深圳展望》，这是APEC“中国年”最重要的成果，也是APEC合作新的里程碑。《深圳展望》推动亚太共同体建设重整行装再出发，在六个方面取得重要进展：\n\n　　一是明确亚太合作的正确方向。习近平主席就“建设什么样的亚太共同体、怎样建设亚太共同体”深入阐述中国主张。习近平主席强调，面对国际形势变乱交织，亚太地区应当维护和平稳定大局，搭建开放合作桥梁，激发创新增长动力，拓展互利共赢路径，共同建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体，续写“亚太奇迹”的新篇章。习近平主席的重要讲话高瞻远瞩，使亚太共同体的旗帜更加鲜明、愿景更加清晰、路径更加明确。与会领导人积极呼应习近平主席重要讲话，支持亚太共同体从目标转为行动、从愿景成为现实，凝聚起共襄亚太发展繁荣大业的磅礴力量。\n\n　　二是搭建亚太共同体的“四梁八柱”。习近平主席强调，促进亚太共同繁荣，要消除贸易和投资壁垒，建设开放型亚太经济，也要推动普惠均衡发展，兼顾效率和公平。我们着眼这一目标，打造合作机制，提出合作倡议，制定行动计划，形成亚太共同体的“四梁八柱”。“四梁”就是经贸、联通、创新、发展。“八柱”就是亚太自贸区、设施硬联通、规制软联通、人民心联通，以及数字经济、新兴技术、能力建设、可持续增长。这些板块彼此呼应、相得益彰，支撑起亚太共同体的整体架构。\n\n　　三是为亚太自贸区建设注入新动力。今年是亚太自贸区愿景提出20周年。中方倡导开放的区域主义理念，推动APEC成员相向而行，重振亚太自贸区进程。此次会议通过《APEC贸易数字化合作框架》，成为促进亚太贸易便利化、支持亚太自贸区建设的重要举措。会议期间还发表了外交和贸易双部长会声明以及《关于亚太自贸区议程的声明》，强调多边贸易体制的重要性。这些成果都将推动亚太自贸区建设与时俱进，行稳致远。\n\n　　四是升级亚太互联互通合作。互联互通是区域经济一体化的纽带。此次会议达成APEC互联互通蓝图升级版，推动基础设施建设、供应链互联互通、政策监管合作和人员往来便利化。APEC“中国年”期间，各方还签署了智慧海关、智慧旅游、商旅便利化等互联互通合作文件。这些成果搭建起亚太经济体之间的桥梁，为区域经济一体化提供了更坚实支撑。\n\n　　五是赋能亚太创新增长。中国发挥自身优势，推动会议达成《APEC关于新兴技术促进就业和繁荣的声明》，就人工智能等新兴技术促进高质量充分就业、提升公共服务水平、加强数字基础设施建设等达成合作共识，体现了以人为本、智能向善理念。APEC“中国年”还举行数字周系列活动，形成数智赋能、开放创新生态、跨境数据验证合作等重要成果，将有力促进创新领域合作，培育亚太增长新动能、新优势。\n\n　　六是打造亚太合作的落地平台。会议期间，习近平主席宣布中方支持亚太合作的一系列自主举措，包括：设立亚太共同体研究中心，倡议组建世界湾区经济合作联盟，提供新的资助以开展APEC务实合作，在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立新的合作机构。同时，我们还充分考虑亚太地区差异性，推出一批促发展、惠民生的务实举措，涉及交通运输、公共卫生、能源、粮食安全、人力资源、反腐败等各个领域。这些举措契合各方发展需要，将有力推动亚太共同体建设走深走实，为共同体不断增添新的内涵。\n\n　　会议也促进了亚太各方的信任和团结。各经济体领导人举行了一系列重要双多边活动。习近平主席同美国总统特朗普举行会晤，就如何落实中美建设性战略稳定关系作出新的战略指引。习近平主席同俄罗斯总统普京举行会晤，围绕深化中俄全方位战略协作达成新的合作共识。\n\n　　王毅表示，大家都很关心中俄美元首会晤的情况。习近平主席、普京总统、特朗普总统举行会晤，就事关全球和平安全与稳定的重要问题深入交换了意见。这是三国元首历史上首次举行会晤，意义重大，影响深远，是载入史册的标志性事件。会晤气氛坦诚、友好，富有建设性，取得了一系列共识，发表了面向世界的《和平宣言》，核心就是共同维护世界和平，促进大国关系战略稳定。可以说，这是一次“和平峰会”。\n\n　　深圳是中国改革开放的重要窗口，是中国特色社会主义先行示范区。中国在深圳办会，彰显了致力于扩大高水平对外开放、推动建设开放型亚太经济的决心。我们要以深圳为新起点，向着亚太共同体目标坚定前行，为中国人民和亚太人民的福祉作出不懈努力，为世界的和平与发展作出更大贡献。\n\n　　王毅还接受了记者提问。\n\n　　有记者问及，中方如何评价中俄美元首会晤，后续如何落实会晤共识，如何看待自身作用。王毅表示，中俄美作为世界主要大国和联合国安理会常任理事国，肩负着促进全球和平与安全的重要责任。中俄美三国最高领导人围绕维护世界和平、促进大国关系战略稳定这一主题，就当前国际形势演变以及全球性挑战深入交换意见，向世界发出了积极信号，意义重大，影响深远。\n\n　　这是一次具有开创意义的历史性会晤。大国关系牵动国际格局演变，事关全球战略稳定。三国元首历史上首次举行面对面会晤，开创了三国最高领导人交往的新纪录，为新时期大国互动构建了新范式，也是推进新型大国关系的新实践，堪称国际关系史上的重大创举。\n\n　　这是一次体现大国担当的标志性会晤。当前，世界百年变局加速演进，各种风险挑战层出不穷，国际社会对和平与稳定的期盼日益强烈，对大国加强沟通协调的呼声日益高涨。会晤顺应时代潮流，符合世界期待。习近平主席强调，大国和则世界安，大国斗则世界乱。三国元首面对面阐明了各自战略意图，愿意防止发生冲突对抗，守住和平共处底线，期待形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。\n\n　　这是一次深入沟通互动的建设性会晤。中方一贯主张大小国家一律平等，致力于实现国际关系的民主化，构建平等有序的多极化。我们认为，大国拥有更多资源、更大能力，应展现大国胸怀、大国担当，在国际上带头讲平等、守诚信、尊道义、重合作、作表率。会晤发布的《和平宣言》凝聚了三方共识，对更有效应对全球性挑战，维护好世界和平稳定具有重大积极意义。正像习近平主席所说，今天播下的种子必将生根发芽、开花结果。中方将同俄美全面高效落实三国元首会晤共识，并通过工作层保持沟通协调，朝着建设一个更美好的世界作出不懈努力。\n\n　　有记者问及，会议为什么聚焦建设亚太共同体以及建设亚太共同体对中国和地区的意义。王毅说，首先，上世纪80年代末，APEC在经济全球化的大潮中应运而生，亚太共同体的构想也在APEC进程中培育形成。2020年，APEC制定了布特拉加亚愿景，提出2040年建成亚太共同体的目标。现在离2040年只有十多年时间了，如何使亚太共同体从目标转为行动、从愿景成为现实，需要亚太大家庭形成新的共识，作出鲜明回答。此次深圳会议在布特拉加亚愿景基础上更进一步，搭建起了亚太共同体的“四梁八柱”，绘就了实施路线图，正当其时、意义重大。可以说，亚太共同体建设从深圳真正启航了。\n\n　　第二，过去这些年，经济全球化遭遇逆风，一些人对亚太合作能走多远产生了疑问。我们旗帜鲜明地推动建设亚太共同体，就是为了发出开放合作的时代强音。APEC成立30多年的历史经验证明，开放合作才是发展振兴的正确选择。习近平主席在今天的会议上掷地有声地指出，经济全球化不时有回头浪，但亚太合作不能走回头路。《深圳展望》的达成表明，各方愿意克服分歧，共同维护APEC的初心，推动亚太共同体迈入实质性推进的新阶段。\n\n　　第三，亚太共同体目标与习近平主席倡导构建人类命运共同体的理念一脉相承。人类命运共同体的理念最早就源于亚太地区命运与共的思考，习近平主席2013年提出树立亚太命运共同体意识，并在实践中不断转化和融入APEC议程。世界要发展，关键看亚太。此次会议聚焦亚太共同体，同中方推动构建人类命运共同体的努力相得益彰，是中国理念和亚太愿景的完美结合，必将在亚太合作历史上留下浓墨重彩的篇章。\n\n 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca070b066e3","title":"大國外交｜習近平：中俄美應合作應對全球性挑戰 共同維護世界和平穩定","url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定","summary":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。習近平表示，中俄美應合作應對全球性挑戰，共同維護世界和平穩定。","summary_short":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","points":["國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","國家主席習近平稱：「當今世界早已不是彼此隔絕的孤島","人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:24+08:00","size":2,"keywords":[],"body":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。習近平表示，中俄美應合作應對全球性挑戰，共同維護世界和平穩定。\n\n國家主席習近平稱：「當今世界早已不是彼此隔絕的孤島。人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體。在這個地球村裡，大國肩負著特殊責任。大國良性互動不是選擇題，而是必答題。」\n\n習近平指出：「當前，世界百年變局加速演進，天下並不太平。風雨見擔當。作為世界主要大國和聯合國安理會常任理事國，中俄美應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定，為人類進步作出更大貢獻。」","image":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/snapshots/60793b0057e64254b53116321f5ad045-00008.jpg","video":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/8cf0cf8eb7c24cc881956d4956cb2e97-321a167a725a6d5e3ff5a6f4b80ffdf1-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/snapshots/60793b0057e64254b53116321f5ad045-00008.jpg","lang":"zh-Hant","items":[{"title":"大國外交｜習近平：中俄美應合作應對全球性挑戰 共同維護世界和平穩定","url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:24+08:00","category":"兩岸","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤"},{"title":"大國外交｜習近平指中美關係總體穩定向好","url":"https://news.tvb.com/tc/1207330-大國外交習近平指中美關係總體穩定向好","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:12:00+08:00","category":"兩岸","digest":"大國外交｜習近平指中美關係總體穩定向好"}],"cross":{"total":2,"angles":[{"point":"大國外交｜習近平指中美關係總體穩定向好","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207330-大國外交習近平指中美關係總體穩定向好"},{"point":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定"}]}},{"id":"cd2011b2bbf","title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳宣言》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳宣言-升級亞太互聯互通持續更新","summary":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。","summary_short":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行","points":["今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行","國家主席習近平將主持會議並發表重要講話","國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","size":2,"keywords":[],"body":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間，先舉行中美雙邊會談，再跟俄羅斯總統普京在南山區麒麟山莊，首次出席備受矚目的三方會談。外交部表示，這是中俄美三國元首歷史上首次面對面會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。\n​​相關新聞：APEC 2026懶人包 21成員聚首深圳談甚麼？ 和我們息息相關？ 一文看清重點全解析\n本屆深圳APEC新增一場重頭戲：中美俄元首今日將舉行歷來首次三方會談，或觸及伊朗、烏克蘭等問題，俄方正推動會後發表聯合聲明。\n相關新聞：深圳APEC｜中美俄將展二戰後首次三方對話 學者：聚焦地區穩定不復刻強權外交︱分析\n內地分析人士對《星島》指出，在目前全球政經格局動盪之際，中美俄三國元首不但在深圳「同框」，而且將破天荒召開三方峰會；若北韓領袖金正恩也現身深圳，今次峰會將是APEC成立37年來「含金量最高」的一次會議。據了解，各方正醞釀推動達成《深圳宣言》。\n相關新聞：深圳APEC︱峰會今揭幕習近平發表講話 被譽史上「含金量最高」\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n11月19日最新消息\n\n相關新聞：深圳APEC︱中美俄元首麒麟山莊會晤登場 習近平：大國良性互動是必答題\n中國外交部長王毅將舉行記者會，介紹APEC領導人非正式會議成果。 陳俊豪攝\n王毅總結APEC會議成果\n22：10\n\n中國外交部長王毅將舉行記者會，介紹APEC領導人非正式會議成果。記者會原訂於晚上7時30分，大約6時許，大會通知記者會推遲至9時30分才舉行。由於傳媒希望能即時了解中方在APEC的總結，現場約200名中外記者即使經過連日採訪，面對疲倦的身軀仍然堅持等候。大約於10時許，外長王毅終於現身記者會。王毅一踏上講台，即向在場記者表示「讓大家久等了，各位辛苦了」，他解釋自己由於要從機場趕回，因而延遲，之後再作出APEC的總結。\n\n18：55\n新華社報道，國家主席習近平、俄羅斯總統普京、美國總統特朗普今日（19日）在深圳舉行會晤。三國元首就當前國際形勢深入交換了意見，致力於維護戰略穩定和國際安全，同時發表和平宣言。\n相關新聞：深圳APEC︱中俄美元首發表和平宣言 四大要點包括防止核擴散進行對話\n\n18：40\n\n美國總統特朗普離開深圳，外長王毅到機場送行。\n深圳APEC｜美國總統特朗普離開深圳。 路透社\n深圳APEC｜美國總統特朗普離開深圳。 路透社\n習近平：美國應在台灣問題上做對的事\n18：01\n中美俄閉門會議結束，歷時約一個半小時。央視報道，會晤結束後，特朗普、普京先後離開會晤現場。\n17：22\n\n習近平、特朗普、普京目前正在進行閉門會談。\n17：10\n習近平稱，核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n習近平強調，各國要尊重彼此主權和領土完整，尊重各自選擇的社會制度和發展道路，尊重彼此核心利益和重大關切。\n16：50\n美國總統特朗普表示，美中俄在討論核武問題上具有獨特的優勢。\n習近平說，「歷史告訴我們：大國和，則世界安﹔大國斗，則世界亂。」\n16：40\n習近平指出，人類同處「地球村」，大國肩負特殊責任，大國良性互動並非「選擇題」而是「必答題」。\n他強調，面對世界百年變局加速演進、天下並不太平，中俄美同為聯合國安理會常任理事國，應當好表率，合作應對全球性挑戰並共同維護世界和平穩定。\n16：30\n俄羅斯總統普京感謝中方積極組織今次三國元首會晤。他強調，中美俄三國同為第二次世界大戰戰勝國，對維護全球和平穩定負有特殊責任，並表示烏克蘭局勢將是今次會談的重點議題。\n16：28\n國家主席習近平在深圳同俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤。\n普京抵達現場。\n15：05\n根據現場消息，隨行記者獲告知，中國國家主席習近平、美國總統特朗普及其各自代表團目前正在共進午餐。\n截至下午3時剛過，這場午宴仍在進行中；而原本預定於下午2時30分舉行的習近平、特朗普與俄羅斯總統普京三方會晤，因此有所順延。\n14：55\n央視報道，中國國家主席習近平將在深圳與俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤。 \n14：40\n央視報道，中美峰會已經結束。\n14：20\n習近平稱，中美關係整體穩定且不斷改善，建構建設性的中美戰略穩定關係也是前所未有。他將與特朗普合作，確保中美關係繼續朝着既定方向發展。\n特朗普則稱呼習近平為「我的朋友」，指雙方有非常特別的關係，只要兩人掌舵便不會出現問題；他又透露美中在確保霍爾木茲海峽能源暢通及阻止伊朗擁核上立場一致，並希望在俄烏戰事及芬太尼危機等領域展開合作。\n特朗普則稱，他計劃與習近平討論結束烏克蘭戰爭，之後再赴中美俄元首會晤。\n14：10\n據路透社引述克林姆林宮消息報道，普京與特朗普進行雙邊會晤後心情極佳。雙方討論了烏克蘭衝突及雙邊關係相關議題。\n14：00\n特朗普向習近平表示：「你是我朋友，我們有著非常特別的關係。」他強調，中美雙方已建立起公平的關係，「這正是我們所追求的」，並指全球其他地方無人能做到中美兩國所能達成的成就。\n在經貿議題上，特朗普指出中美兩國已以公平方式分攤關稅，並稱相關貿易委員會正為過往失衡的雙邊關係帶來平衡。此外，特朗普亦透露，兩國領導人均強烈認為，石油運輸應保持暢通無阻地經由霍爾木茲海峽進行。\n13：32\n特朗普已抵達麒麟山莊。據央視報道，特朗普與習近平已開始會晤。\n相關新聞：深圳APEC︱中美俄元首會晤麒麟山莊即將登場 習近平先晤特朗普\n13：12\n特朗普與普京會面結束，正在前往麒麟山莊，準備與習近平會面。路透社報道，特普兩人會晤大約半小時左右，普京告訴特朗普，很高興見到他。\n特朗普則以「我的朋友」來稱呼普京，說：「我們多年來一直保持着良好的關係。我們彼此已認識很久，我認為這會帶來很多美好的結果，或者至少會由此開始。但我相信這些美好結果會由此而來」。\n特朗普與普京會晤。路透社\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n12：35\n美俄元首在北京會晤。會晤開始前，特朗普與普京握手，並稱兩人多年來一直保持著良好的關係，認為這次會面會帶來許多美好的會面。據外媒報道，是次會談持續不到1小時。\n特朗普與普京在北京會晤。俄羅斯衛星通訊社\n領導人非正式會議中，普京與特朗普亦曾作互動。路透社\n11：45\n國家主席於今日（19日）舉行的出席亞太經合組織（APEC）領導人非正式會議上，再次與日本首相高市早苗握手。昨日在歡迎晚晏上，二人亦曾握手。二人兩次握手，習近平都是只微笑，未有作交談。\n相關新聞：深圳APEC︱習近平再與高市早苗禮節性握手 繼續保持微笑\n11：33\n美國總統特朗普多次表示，在深圳出席亞太經合組織（APEC）峰會期間可能與北韓最高領導人金正恩會面。不過朝中社今日（19日）報道，金正恩近日已轉赴東部咸鏡南道視察海軍大學，朝方至今未對美方的會面提議作出任何回應。\n相關新聞：深圳APEC︱金正恩視察咸鏡南道 朝方未回應是否與特朗普會晤\n11：25\n中美俄三國元首今日（19日）在深圳亞太經合組織峰會場邊舉行歷史性會談前夕，俄方一個神秘黑色公事包意外成為焦點。普京隨行海軍軍官在深圳下榻酒店外被拍到手提代號「Cheget」的核武公事包，面對記者追問更罕有在鏡頭前微笑承認：「沒錯，就是它。」\n相關新聞：深圳APEC︱普京隨行軍官直認手上「核公事包」 中美俄會晤前「騷肌肉」？\n10：40\n國家主席習近平、美國總統特朗普與俄羅斯總統普京周四（19日）在深圳舉行三方會晤。三人上一次共同出席國際峰會是2019年日本大阪G20峰會，但當時並未舉行三方會談。外交部指，是次中俄美三國元首首度舉行三方會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。亦有分析指出，中美俄領導人首度同框意義重大，但同時會引發美國盟友之疑慮。\n相關新聞：深圳APEC｜中美俄元首同框象徵意義重大 惟引發美盟友不安｜拆局\n09：55\n國家主席習近平主持第33次領導人非正式會議，並發表講話。習近平表示，今天會議的主題是建設亞太共同體，促進共同繁榮。相信在我們共同努力下會議會圓滿成功，爲亞太經合組織實現更大發展地區乃至世界的和平、穩定、繁榮貢獻力量。\n\n習近平在講話提出多個重點，中方將提供2000萬美元資助開展亞太經合組織務實合作，在深圳設立亞太共同體研究中心。此外，亦會推進亞太自貿區建設，減少貿易壁壘，提升數字化與便利化水平；第二，升級互聯互通，鞏固基礎設施硬聯通，深化軟聯通與跨境支付合作；打造創新支柱，以數字經濟和人工智能為引擎，促進數據安全流通；發展支柱，深化能源、糧食及綠色低碳合作，支持改善民生。\n相關新聞：深圳APEC︱習近平倡攜手搭建亞太共同體「四樑八柱」︱講話全文\n\n09：52\n習近平與一眾嘉賓統一戴上中式領巾，然後一同合照。\n習近平：會議將為世界和平穩定貢獻力量。央視截圖\n領導人非正式會議上，特朗普在台上與習近平交流。路透社\n領導人非正式會議上，各出席嘉賓帶上領巾合照。路透社\n09：38\n俄羅斯總統普京及美國總統特朗普先後抵達深圳國際交流中心，出席領導人非正式會議。\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n09：20\nAPEC 採用「經濟體」作為參與單位，所有成員均按其官方英文名稱（例如 Australia、Canada、China、Hong Kong, China、Chinese Taipei 等）的字母順序依次入座。\n年度的主辦方即東道主領袖擔任會議主席，負責主持會議，通常坐在主位或正中央。因此，今次深圳峰會，國家主席習近平坐在主位。\n相關新聞：深圳APEC︱領導人峰會座位合照安排有玄機\n09：00\n今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。\n08：45\nAPEC領導人非正式會議在深圳揭幕，美國總統特朗普由菲律賓抵達深圳後，隨即入住福田區深圳東海朗廷酒店。周三（18日）下午起，酒店周邊實施交通管制，大批市民自發在對面馬路圍觀，\n相關新聞：深圳APEC︱市民街頭歡呼迎特朗普車隊 隔空叫「請他吃豬腳飯」︱有片\n00：35\n內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。\n相關新聞：深圳APEC｜晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n​ 內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。 中新視頻\n11月18日最新消息\n23：50\n俄羅斯衛星通訊社報道指出，出席歡迎晚宴的俄羅斯總統普京與美國總統特朗普，分別獲安排坐在習近平及夫人彭麗媛的左右兩側。\n相關新聞：深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身訪華團\n19：23\nAPEC各經濟體領導人開始陸續抵達位於深圳福田區的深圳國際交流中心。這處將舉行領導人合影活動，並舉辦由國家主席習近平名義舉行的歡迎晚宴。大會在入口處安排樂師現場演奏，當美國總統特朗普入場時，更特意駐足欣賞一會。\n相關新聞：深圳APEC｜習近平舉行歡迎晚宴 特朗普與普京握手\n晚宴開始後，中美俄三國領導人更在台上交談，期間美國總統特朗普更與俄羅斯總統普京握手。\n\n習近平在歡迎晚宴上，向出席嘉賓祝酒。路透社\n經濟體領導人在歡迎晚宴上合照。路透社\n經濟體領導人到深圳國際交流中心，出席歡迎晚宴。路透社\n習近平親迎特朗普：禮尚往來\n16：45\n新華社報道，周三（18日）下午，國家主席習近平在深圳寶安國際機場迎接來華出席亞太經合組織領導人非正式會議的美國總統特朗普。在迎賓曲中，習近平同特朗普親切握手。三軍儀仗隊行舉槍禮，少年兒童向特朗普獻花。中美兩國國旗迎風招展，軍樂團奏兩國國歌，戰機飛越致敬。兩國元首向青年歡迎隊伍揮手致意。\n習近平表示，今年9月我訪美時，特朗普總統夫婦專程赴機場迎接，並舉行隆重歡迎儀式。中國是禮儀之邦，有禮尚往來的傳統。我歡迎你再次訪華，期待同你就事關中美關係、亞太合作和世界格局的重大問題深入交換意見，推動基於尊重、公平、對等的中美建設性戰略穩定關系向前發展。\n特朗普表示，感謝習近平主席親赴機場迎接，感謝中方特殊安排，很高興再次到訪偉大的中國。習近平主席是一位偉大的領袖，每一次同習近平主席會晤都非常愉快，相信此訪將進一步推進兩國關係，取得圓滿成功。\n蔡奇、王毅、黃坤明參加。\n相關新聞：深圳APEC｜特朗普結束訪菲啟程來華 上機前做「招牌」握拳頭動作\n16：27\n日本首相高市早苗抵達深圳，將出席領導人非正式會議，展開就任後的首次訪華之行。\n\n相關新聞：深圳APEC︱日本首相高市早苗抵華 接待層級低於其他領導人\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n12：04\n國家主席習近平與俄羅斯總統普京會晤。\n習近平與普京會晤。\n習近平與普京會晤。\n普京讚深圳最具活力的大都市之一\n11：20\n俄羅斯總統普京出席深圳前海國際會議中心出席2026年亞太經合組織工商領導人峰會開幕，並以經濟體領導人身份作特別致辭。普京表示，此次APEC舉辦地深圳給人留下了深刻印像。「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」\n10：00\n國家主席習近平在主旨演講上表示，中國「十五五」規劃既是自身的發展藍圖，也為亞太乃至全球經濟增長提供機遇清單，是中國面向全球工商界發出的合作邀約。\n\n中國將為全球工商界提供超大規模開放市場。中國擁有全球規模最大中等收入群體，投資和消費潛力巨大。\n相關新聞：深圳APEC｜習近平籲踐行真正多邊主義 共建亞太共同體\n習近平：中國正加快建設開放大市場\n習近平指出，從新能源汽車到智能家居，從銀發經濟到冰雪旅遊，每一個新賽道都為全球企業帶來新機遇。中國正在加快建設開放大市場，擴大優質產品和服務進口，將不斷催生多樣化新需求。\n中國將為全球工商界提供前景廣闊的發展空間。創新驅動、綠色轉型是中國經濟的關鍵詞。中國將加快構建現代化產業體系，推動科技創新和產業創新深度融合，為全球企業技術創新和發展壯大提供強勁動能。\n\n中國將為全球工商界提供互促共進的合作環境。面對單邊主義、保護主義衝擊，中國始終踐行真正多邊主義，堅定維護多邊貿易體制，維護世貿組織規則，推動世界貿易組織改革，不斷為世界經濟增長和國際經貿合作注入穩定性和確定性。中方將從降低關稅、擴大准入，到探索規則、管理、標準等深水區改革，全面落實製造業准入又准營，穩步擴大服務業領域開放，為全球企業來華投資興業提供更穩定、更可預期優質環境。\n今明兩日出席峰會 多國領袖齊聚深圳\n03：00\n18日凌晨，俄羅斯總統普京乘專機抵達深圳，出席APEC峰會。中共中央政治局常委、中央書記處書記蔡奇前往機場迎接。分析人士對《星島》指出，今年5月普京訪華時，接機是中共中央政治局委員、外長王毅，而今次接機的是政治局常委蔡奇，規格比之前更高。預計普京在峰會期間將與多國與會領袖就亞太區經貿合作及國際局勢等議題展開交流。\n克里姆林宮發言人周六表示，11月19日在深圳，普京將與國家主席習近平及美國總統特朗普舉行三方會晤。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳宣言》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳宣言-升級亞太互聯互通持續更新","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","category":"內地","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行"},{"title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳展望》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳展望-升級亞太互聯互通持續更新","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","category":"內地","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行"}]},{"id":"ced0cd41feb","title":"WTT冠军赛将首次登陆上海","url":"https://www.chinanews.com.cn/ty/2026/11-19/10734955.shtml","summary":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布，2027WTT上海冠军赛将于2027年1月19日至24日落户上海浦发银行东方体育中心…","summary_short":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","digest":"据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","points":["中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","WTT每个赛季在全球举办六站冠军赛","WTT上海冠军赛将作为2027赛季的首站冠军赛登场"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:22:28+08:00","size":2,"keywords":[],"body":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布，2027WTT上海冠军赛将于2027年1月19日至24日落户上海浦发银行东方体育中心，这也是WTT赛事首次来到上海。\n\n　　WTT每个赛季在全球举办六站冠军赛。WTT上海冠军赛将作为2027赛季的首站冠军赛登场。WTT冠军赛汇集来自全球的32名顶尖男子单打和女子单打选手，角逐这项运动中最重要的奖项之一。该赛事不设资格赛，来自世界各地的顶尖选手从第一轮开始直接进入淘汰赛对决，争夺1000点世界排名积分。\n\n　　上海拥有丰富的乒乓球历史，乒乓球在这里拥有深厚的群众基础和极高的参与度，是市民们最喜爱的体育运动之一。上海还培养了多位乒乓球世界冠军及奥运冠军。\n\n　　国际乒乓球联合会主席及WTT董事会主席佩特拉·索林表示：“对于WTT而言，每一座新的主办城市都意味着创造更多机会，让球迷亲近乒乓球、享受难忘的观赛体验，并与当地社区及合作伙伴建立深度连接。我们期待与中国乒乓球协会及本地赛事组委会紧密合作，共同呈现一场精彩的赛事，也希望以此为起点，与上海这座城市建立长期而紧密的合作关系。”\r\n\n　　中国乒乓球协会秘书长何潇表示，上海是中国乒乓球运动的发源地，同时拥有国际乒联博物馆和中国乒乓球博物馆，乒乓文化底蕴深厚。早在2005年，上海就成功举办第48届国际乒联世界乒乓球锦标赛，打造了一场属于世界乒坛的盛 洙的行为构成参与内乱重要任务罪，但撤销二审判决中的部分有罪认定…","summary_short":"中新社首尔11月19日电 (金旭 陈艺玲)韩国大法院(最高法院)当地时间19日就韩国前国务总理韩德洙涉内乱案作出判决…","digest":"韩国大法院(最高法院)当地时间19日就韩国前国务总理韩德洙涉内乱案作出判决…","points":["中新社首尔11月19日电 (金旭 陈艺玲)韩国大法院(最高法院)当地时间19日就韩国前国务总…","据韩联社报道，最高法院认为，韩德洙的部分行为足以构成参与内乱重要任务罪…","最高法院表示，韩德洙在戒严宣布后怂恿国务委员们在相关文件上签字…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T07:35:17+08:00","size":2,"keywords":[],"body":"中新社首尔11月19日电 (金旭 陈艺玲)韩国大法院(最高法院)当地时间19日就韩国前国务总理韩德洙涉内乱案作出判决，认定韩德洙的行为构成参与内乱重要任务罪，但撤销二审判决中的部分有罪认定，并将案件发回首尔高等法院重审。\r\n\n　　据韩联社报道，最高法院认为，韩德洙的部分行为足以构成参与内乱重要任务罪，但对于其建议召开国务会议，试图制造紧急戒严令经过国务会议审议这一表象的行为，现有证据不足以证明其具有扰乱宪法秩序的目的，因此被判无罪。\n\n　　最高法院表示，韩德洙在戒严宣布后怂恿国务委员们在相关文件上签字，并讨论封锁国会等主要机构以及对媒体实施断水断电等措施，这些行为可被认定其参与内乱。此外，对于二审判决认定的韩德洙制造虚假公文、违反“总统档案法”、作伪证等罪行，最高法院维持有罪认定。由于二审对数项罪名合并判处一个刑期，最高法院推翻其中部分认定后，将案件发回重新量刑。\n\n　　此次宣判距离韩德洙羁押期限届满仅剩数小时，由于发回重审期间可以延长羁押期限，韩德洙将继续处于羁押状态。\n\n　　2025年8月，韩国负责调查紧急戒严事件的特检组以涉嫌协助内乱、制造虚假公文、损坏公共文件、作伪证等罪名对韩德洙提起公诉。2026年1月，韩德洙因协助内乱头目等罪名一审被判有期徒刑23年，并当庭被捕，随后他提起上诉。5月，韩德洙二审被判有期徒刑15年，相比一审判决减少8年。韩德洙对二审判决表示不服，向最高法院提起上诉。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"韩国最高法院将前总理韩德洙涉内乱案发回重审","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734993.shtml","source_display":"中新網 環球","published_at":"2026-11-20T07:35:17+08:00","category":"國際","digest":"韩国大法院(最高法院)当地时间19日就韩国前国务总理韩德洙涉内乱案作出判决…"},{"title":"韩国最高法院将前总理韩德洙涉内乱案发回重审","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734990.shtml","source_display":"中新網 環球","published_at":"2026-11-20T07:02:27+08:00","category":"國際","digest":"据韩联社报道，韩国大法院(最高法院)19日就前国务总理韩德洙涉内乱案作出判决…"}]},{"id":"cd869ca0cdd","title":"美媒：特朗普称不会在新年前“仓促”决定对伊行动","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734989.shtml","summary":"中新网11月20日电 据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前，他不会就伊朗问题的下一步行动“仓促”作出决定。","summary_short":"中新网11月20日电 据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前…","digest":"据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前…","points":["中新网11月20日电 据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示…","我们要看看新年之后局势如何发展","报道指出，特朗普发表此番言论之际，面临来自以色列看守政府总理内塔尼亚胡的巨大压力…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T06:45:16+08:00","size":2,"keywords":[],"body":"中新网11月20日电 据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前，他不会就伊朗问题的下一步行动“仓促”作出决定。\n\n美国总统特朗普。（资料图）\n\n　　“我不会仓促做出任何(关于伊朗的)决定。我们要看看新年之后局势如何发展。”特朗普说。\n\n　　报道指出，特朗普发表此番言论之际，面临来自以色列看守政府总理内塔尼亚胡的巨大压力，敦促他尽快对伊朗发动一场决定性的轰炸行动。\n\n　　报道援引知情人士称，白宫已要求五角大楼和情报专家评估，伊朗将如何应对美军制定的各项打击方案。\n\n　　据报道，以色列情报和特勤局(摩萨德)局长戈夫曼日前访问美国，与美中央情报局局长拉特克利夫和美总统特使威特科夫进行会谈。以色列消息人士称，戈夫曼是内塔尼亚胡的亲密顾问之一，他受内塔尼亚胡委派，敦促恢复对伊战争。\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"美媒：特朗普称不会在新年前“仓促”决定对伊行动","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734989.shtml","source_display":"中新網 環球","published_at":"2026-11-20T06:45:16+08:00","category":"國際","digest":"据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前…"},{"title":"特朗普表示不会在新年前“仓促”决定对伊朗行动","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734986.shtml","source_display":"中新網 環球","published_at":"2026-11-20T06:04:00+08:00","category":"國際","digest":"美国总统特朗普19日表示，在新年到来之前…"}]},{"id":"c67ab80140f","title":"英前議員落藥迷姦妻子13年 網上找陌生男輪流性侵 4同案被告罪成","url":"https://www.stheadline.com/realtime-world/3639194/英前議員落藥迷姦妻子13年-網上找陌生男輪流性侵-4同案被告罪成","summary":"英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥，趁她意識不清時性侵，甚至在網上招募陌生男子到家中侵犯妻子，並拍攝整個過程，相關犯罪行為長達13年。","summary_short":"英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥，趁她意識不清時性侵…","digest":"英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥…","points":["英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥…","妻子直到警方查獲大量私密影像後，才驚悉丈夫多年來的所作所為","菲利普早前已承認多項性侵罪名，而案中另外4名涉案男子周四在法院遭裁定性侵罪成"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:20:58+08:00","size":1,"keywords":[],"body":"英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥，趁她意識不清時性侵，甚至在網上招募陌生男子到家中侵犯妻子，並拍攝整個過程，相關犯罪行為長達13年。妻子直到警方查獲大量私密影像後，才驚悉丈夫多年來的所作所為。菲利普早前已承認多項性侵罪名，而案中另外4名涉案男子周四在法院遭裁定性侵罪成。\n英國溫徹斯特刑事法院上月27日開庭審理這宗駭人聽聞的長期性侵案件，50歲的菲利普，被控在妻子喬安妮（Joanne Young）不知情的情況下，多次對她落藥，並安排陌生男子到家中對她進行性侵。\n夫在場觀看拍攝 發布上網\n菲利普與喬安妮於2002年開始交往，兩人表面上過著正常家庭生活，喬安妮一直以為夫妻關係是一對一的婚姻，過去也曾明確告訴丈夫，自己不願與其他人發生性關係。然而2023年某次親密接觸期間，喬安妮原本以為身旁的人是丈夫，卻在過程中察覺房內似乎出現另一名男子，令她受到極大驚嚇，丈夫翌日向她道歉，承認曾透過網絡邀請他人到家中，但當時她並不知道這只是多年犯罪行為的一小部分，菲利普的犯罪行為涉及長達13年的時間。\n警方後來調查菲利普的網絡活動，並查扣電子設備，發現大量妻子遭蒙眼、限制行動及疑似失去意識時，被其他男子性侵的影像。至少從2015年起，菲利普便開始尋找能讓妻子陷入深度睡眠、意識混亂，甚至事後無法回憶過程的藥物，不僅涉嫌在妻子失去反抗能力時安排其他男子侵犯，還會在旁觀看、錄影，並將相關影像發布至網上。\n同案4被告強姦或性侵罪成 追捕第7名嫌犯\n檢察官瓊斯（Sarah Jones）指出，菲利普透過Craigslist、Grindr及換偶網站刊登訊息，招募願意與妻子發生性行為的陌生男子，聲稱讓其他男性與妻子發生性行為是夫妻雙方共同的性癖好，但妻子從未同意與其他男子發生性關係。\n菲利普今年較早前已承認多項控罪，包括11項強姦罪、14項偷窺罪、11項意圖犯罪而施用藥物罪，以及其他性侵害相關罪名。另外4名涉案男子周四被裁定罪成，其中48歲的麥克索尼（Norman Macksoni）和62歲的威爾金斯（Richard Wilkins）被裁定強姦罪成，而32歲的桑德森-多伊爾（Connor Sanderson-Doyle）和38歲的哈桑（Mohammed Hassan）則被裁定性侵罪成。第6名共犯也已認罪，警方正在追捕第7名嫌疑犯。\n英版吉賽兒 勇敢放棄匿名權\n這宗震驚英國的案件因情節與2024年法國轟動全球的吉賽兒（Gisele Pelicot）案極其相似，被形容為英國版的翻版事件。受害人喬安妮與菲利普目前已經離婚，她效仿吉賽兒，主動放棄法律享有的匿名權，公開自己的姓名與身份。她希望透過挺身而出，揭發藥物性侵的黑幕，並藉此提高大眾對婦女性暴力與此類案件的重視與關注。\n49歲的喬安妮育有3名孩子，因勇敢而備受讚揚，她在法庭作證，並旁聽了4名男子在她昏迷時與丈夫一起性侵她的審訊過程。她在案中4名被告被裁定罪成後說：「我最信任的人竟以最可怕的方式背叛了我，這場可怕的性侵讓我明白，在家中也沒提受到任何保護。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3995599a0a","title":"紐約等地有民眾示威 抗議ANTHROPIC上市","url":"https://news.tvb.com/tc/1207393-紐約等地有民眾示威抗議ANTHROPIC上市","summary":"美國人工智能公司ANTHROPIC周四上市，紐約、三藩市等地有民眾示威抗議。約30人在紐約時報廣場納斯達克交易所外手持橫額，抗議ANTHROPIC上市，指科技行業令財富及權力，過度集中在億萬富豪手中，又憂慮人工智能在醫療保健上取代人類，會影響治療成效和安全。","summary_short":"美國人工智能公司ANTHROPIC周四上市，紐約、三藩市等地有民眾示威抗議。","digest":"美國人工智能公司ANTHROPIC周四上市，紐約、三藩市等地有民眾示威抗議","points":["約30人在紐約時報廣場納斯達克交易所外手持橫額，抗議ANTHROPIC上市…","警方到場戒備，拘捕部分示威者","三藩市ANTHROPIC總部外，同日亦有人示威，指人工智能存在安全隱患"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T10:59+08:00","size":1,"keywords":[],"body":"美國人工智能公司ANTHROPIC周四上市，紐約、三藩市等地有民眾示威抗議。\n\n約30人在紐約時報廣場納斯達克交易所外手持橫額，抗議ANTHROPIC上市，指科技行業令財富及權力，過度集中在億萬富豪手中，又憂慮人工智能在醫療保健上取代人類，會影響治療成效和安全。警方到場戒備，拘捕部分示威者。\n\n三藩市ANTHROPIC總部外，同日亦有人示威，指人工智能存在安全隱患。","image":"https://pro-vod-cdn.tvb.com/e1f03a6919ae475ca8c78532e671b1ea/snapshots/5687959af5d44cfe8c026e172b05e36c-00005.jpg","video":"https://pro-vod-cdn.tvb.com/e1f03a6919ae475ca8c78532e671b1ea/209de776c3a84031a124531eb1d531e3-a528cf6398db85da23d00d022afc7e7f-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e1f03a6919ae475ca8c78532e671b1ea/snapshots/5687959af5d44cfe8c026e172b05e36c-00005.jpg","lang":"zh-Hant"},{"id":"c219e4eca19","title":"中泰媒体合作交流活动在曼谷举行","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735044.shtml","summary":"中新网曼谷11月20日电 (李映民 梁峻祥 王茜)“中泰相约 山海共鸣”中泰媒体合作交流对话会暨海南广播电视总台与泰国广播电视专业协会联合会合作协议签署仪式19日在曼谷举行。","summary_short":"中新网曼谷11月20日电 (李映民 梁峻祥 王茜)“中泰相约 山海共鸣”中泰媒体合作交流对话会暨海南广播电视总台与泰国广…","digest":"“中泰相约 山海共鸣”中泰媒体合作交流对话会暨海南广播电视总台与泰国广播电视专业协会…","points":["中新网曼谷11月20日电 (李映民 梁峻祥 王茜)“中泰相约 山海共鸣”中泰媒体合作交流对话…","活动同期启动“海南自贸港主题展播季”，一批展现海南自贸港发展活力…","泰国前副总理、现泰中文化促进委员会主席披尼在开幕式上致辞"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T10:32:00+08:00","size":1,"keywords":[],"body":"中新网曼谷11月20日电 (李映民 梁峻祥 王茜)“中泰相约 山海共鸣”中泰媒体合作交流对话会暨海南广播电视总台与泰国广播电视专业协会联合会合作协议签署仪式19日在曼谷举行。\n\n　　活动同期启动“海南自贸港主题展播季”，一批展现海南自贸港发展活力、热带生态和人文底蕴的视听作品，将依托泰国、马来西亚、柬埔寨等国主流媒体平台集中展播。\n\n泰国前副总理、现泰中文化促进委员会主席披尼在开幕式上致辞。王茜 摄\n\n　　出席活动的泰国前副总理、现泰中文化促进委员会主席披尼在致辞中表示，海南自贸港建设为两国深化务实合作提供了新的机遇。海南与泰国在经贸往来、数字服务、绿色发展和旅游等领域具有广泛的合作空间。双方应把中国发展新质生产力的机遇与泰国产业升级、人才培养相衔接，让中小企业、青年和当地社区更多受益，以持续合作为地区发展增添信心与确定性。\n\n　　海南广播电视总台国际传播融媒体中心主任吴鹏表示，海南广播电视总台将发挥采编、影像和多语种传播优势，与泰国媒体共同策划选题、开展联合采访和内容制作，把海南的发展变化同企业经营、青年成长、游客体验等具体故事联系起来，让海外受众更直观地认识海南。\n\n　　泰国广播电视专业协会联合会主席凯马塔·蓬德表示，泰国受众认识海南，既需要了解开放政策和发展机遇，也需要看到海南人的日常生活、地方文化与创新实践。双方应加强交流合作，让海南故事以泰国受众熟悉的语言和表达方式走近当地民众，同时把泰国的发展与文化介绍给海南和中国受众。\n\n活动现场。李映民 摄\n\n　　活动中，海南广播电视总台与泰国广播电视专业协会联合会签署了合作协议，双方将结合各自内容生产、平台渠道和本土资源优势，围绕视听内容共创、新闻信息互通、媒体人员互访、多语种译制传播和传播矩阵联动开展务实合作，推动优质音视频节目双向交流。\n\n　　活动期间举行的圆桌会谈以“海南与泰国：高水平开放与高质量合作”为主题，嘉宾围绕海南自贸港开放机遇、国际传播和文旅合作交流看法。\n\n圆桌会谈现场。梁峻祥 摄\n\n　　海南是中国著名侨乡，有近200万旅泰琼籍华侨华人，正大集团等泰国企业早在20世纪80年代便扎根海南。随着海南自贸港政策红利持续释放，琼泰两地的互补优势日益凸显。以媒体为纽带的“软连接”，让这些跨越山海的故事被更多人看见、听懂。(完)\n\n 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c058e1f0d7b","title":"挪威创新署官员：中国电动汽车制造商正获得竞争优势","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735042.shtml","summary":"中新网奥斯陆11月20日电 (记者 马秀秀)挪威创新署贸易与投资部门负责人加尔德·马德森(Gard Madsen)19日在接受记者采访时表示，中国新能源汽车产业发展令人印象深刻。","summary_short":"中新网奥斯陆11月20日电 (记者 马秀秀)挪威创新署贸易与投资部门负责人加尔德·马德森(Gard Madsen)19日…","digest":"挪威创新署贸易与投资部门负责人加尔德·马德森(Gard Madsen)19日在接受记…","points":["中新网奥斯陆11月20日电 (记者 马秀秀)挪威创新署贸易与投资部门负责人加尔德·马德森(G…","随着中国电动汽车制造商逐渐站稳脚跟，其相较于世界其他地区汽车制造商确实正在获得优势","挪威对电动汽车接受程度很高，是中国汽车品牌拓展欧洲市场的良好选择"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T10:31:28+08:00","size":1,"keywords":[],"body":"中新网奥斯陆11月20日电 (记者 马秀秀)挪威创新署贸易与投资部门负责人加尔德·马德森(Gard Madsen)19日在接受记者采访时表示，中国新能源汽车产业发展令人印象深刻。随着中国电动汽车制造商逐渐站稳脚跟，其相较于世界其他地区汽车制造商确实正在获得优势。挪威对电动汽车接受程度很高，是中国汽车品牌拓展欧洲市场的良好选择。\r\n\n　　当日，中国新能源汽车品牌蔚来进入挪威市场五周年特别活动在奥斯陆举行。马德森以此为例指出，挪威创新署与蔚来在其进入挪威市场以来一直保持合作，挪威创新署也是蔚来最早接触的政府机构之一。他为双方合作取得的良好进展感到自豪，并希望未来继续深化这种良好关系。\n\n　　在他看来，当前汽车产业正经历一轮技术热潮，中国电动汽车制造商正在逐渐站稳脚跟，与世界其他地区的汽车制造商相比确实正在获得优势。\n\n　　他认为，中国汽车制造商的一大优势在于拥有庞大的本土市场。由于能够在本土市场销售大量汽车，中国车企可以不断创新，通过销售汽车获得消费者反馈，并据此让汽车变得更好。\n\n　　马德森同时表示，对于希望进入欧洲市场的中国汽车制造商来说，挪威是一个很好的市场。挪威对新技术和新发展持开放态度，也是欧洲具有创新活力的市场之一。\n\n　　对于中国电动汽车品牌如何在挪威发展，他表示，挪威与中国的法律法规可能存在差异，中国企业在推出产品时应充分了解并遵守当地法律法规。\n\n　　他说，挪威已经建立了相当完善的电动汽车使用体系，并积累了良好经验。此外，挪威气候寒冷，可以成为汽车测试的良好场所，帮助车企测试汽车性能，发现需要改进之处。(完) 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb5925de617","title":"巴西2026年农牧业总产值预计达1.46万亿雷亚尔","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735012.shtml","summary":"中新社圣保罗11月19日电 巴西农业部19日发布数据显示，2026年巴西农牧业总产值预计达1.46万亿雷亚尔，较上年创下的历史纪录下降2.6%。","summary_short":"中新社圣保罗11月19日电 巴西农业部19日发布数据显示，2026年巴西农牧业总产值预计达1.46万亿雷亚尔…","digest":"巴西农业部19日发布数据显示，2026年巴西农牧业总产值预计达1.46万亿雷亚尔…","points":["中新社圣保罗11月19日电 巴西农业部19日发布数据显示…","尽管受不利气候条件影响，农牧业产值有所回落，但巴西农产品出口继续保持增长势头","数据显示，受降雨过量及阶段性干旱影响，今年巴西种植业产值预计同比下降3.9%…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T10:30:52+08:00","size":1,"keywords":[],"body":"中新社圣保罗11月19日电 巴西农业部19日发布数据显示，2026年巴西农牧业总产值预计达1.46万亿雷亚尔，较上年创下的历史纪录下降2.6%。尽管受不利气候条件影响，农牧业产值有所回落，但巴西农产品出口继续保持增长势头。\r\n\n　　数据显示，受降雨过量及阶段性干旱影响，今年巴西种植业产值预计同比下降3.9%，畜牧业下降0.2%。其中，大豆和肉牛养殖业表现较好，产值预计分别增长4.6%和11.8%。作为巴西最主要的农产品，大豆产值预计达3612亿雷亚尔。\n\n　　巴西农业部预计，2027年农牧业总产值将有序增长，同比增幅将达2.6%，再次突破1.5万亿雷亚尔。其中，大豆产值有望增长10.1%，畜牧业产值预计增长5.3%。\n\n　　另据巴西农业部数据显示，2026年前10个月，巴西农牧业出口额达1494亿美元，同比增长5.2%，贸易顺差约1323亿美元。其中，大豆及其制品出口额达564亿美元，肉类出口额达286亿美元，牛肉和鸡肉出口均创下历史同期纪录。\n\n　　2026年10月，巴西农牧业出口额达160亿美元，同比增长4.1%，占当月全国出口总额的42.3%。大豆以31亿美元的出口额位居首位，其次为生咖啡豆、玉米、牛肉和纸浆。巴西农牧产品前三大出口市场依次为中国、欧盟和美国，出口额分别为39亿美元、26亿美元和9.52亿美元。\n\n　　巴西近年来持续拓展农牧产品国际市场。自2023年以来，巴西已累计在全球102个国家获得728项农牧产品市场准入许可。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5f2b6c64c2","title":"外媒眼中的“现代化奇迹”，APEC深圳会议展现中国开放创新窗口","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735057.shtml","summary":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会…","随着亚太各经济体领导人和工商界代表齐聚这座中国改革开放的前沿城市，深圳成为国际媒体关注的焦点","从区域经贸合作到科技创新，从产业发展到城市开放活力，外媒纷纷将目光投向中国…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T09:44:48+08:00","size":1,"keywords":[],"body":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。随着亚太各经济体领导人和工商界代表齐聚这座中国改革开放的前沿城市，深圳成为国际媒体关注的焦点。\n\n　　从区域经贸合作到科技创新，从产业发展到城市开放活力，外媒纷纷将目光投向中国，各方期待借助APEC这一重要平台，探索亚太经济合作新机遇。\n\n图为市民拍摄深圳华强北的APEC标识。中新社记者 张祥毅 摄\n\n　　开放合作凝聚共识\n\n　　亚太经济迎来新机遇\n\n　　本届APEC会议以“建设亚太共同体，促进共同繁荣”为主题，“开放、创新、合作”成为三大优先领域。多家外媒认为，在全球经济面临不确定性、区域产业联系日益紧密的背景下，APEC深圳会议为亚太各经济体加强对话、深化经贸合作提供了重要契机。\n\n　　马新社报道称，随着来自亚太经合组织21个经济体和英国、法国、德国、瑞士等13个域外经济体知名企业代表齐聚深圳，这座城市成为区域经济外交的焦点。各方围绕加强贸易、推动创新和深化区域合作，共同探讨亚太地区未来发展方向。\n\n　　报道称，作为东道主，中国期待各成员经济体在贸易、互联互通、数字经济和人工智能等重点领域取得更多务实成果。\n\n　　越南媒体“Vietnamplus”报道称，深圳作为中国改革开放的重要窗口，与本届APEC会议确定的“开放、创新、合作”三大优先领域相互呼应，传递出一个清晰信息：合作与创新是实现经济增长、激发区域活力的重要动力。\n\n　　美联社还进一步关注到中国在数字经济和人工智能领域深化合作，为国际投资者创造更加有利的环境的意愿。\n\n　　广东发展彰显开放优势\n\n　　深圳创新活力吸引世界\n\n　　除区域合作议题外，深圳的城市发展和科技创新实力，也是外媒关注的另一大焦点。\n\n　　美联社关注到，深圳在过去40多年间，已从一个渔村发展成为拥有众多摩天大楼、集出口制造业与科技产业于一体的城市。\n\n　　新西兰“亚洲媒体中心”网站报道称，深圳是一座具有开放基因、持续创新活力和跨领域合作精神的城市。报道认为，深圳从渔村成长为科技与制造业中心的历程，是中国改革开放的一个缩影，也展现了亚太地区合作所蕴含的发展潜力。\n\n　　俄罗斯塔斯社则将深圳称为中国现代化发展的一个奇迹，指出这座城市在短短几十年间，从一个小渔村发展成为全球电子产品和高科技产品制造中心。俄罗斯总统助理乌沙科夫表示，深圳是一座在许多方面都独一无二的城市。\n\n　　美国商业资讯(Business Wire)网站刊文，将本届APEC会议与广东经济发展及全球贸易联系起来。\n\n　　报道关注到，广东正加大对先进制造、智能互联、生物技术和可再生能源等新兴领域的投资；借助本届APEC会议，广东有望进一步深化区域经贸伙伴关系、吸引国际投资，并提升其在亚太供应链中的地位。\n\n　　从深圳的产业升级到广东的外贸增长，从人工智能到绿色技术，外媒的报道展现出一个共同视角：深圳不仅是本届APEC会议的举办地，也是观察中国经济活力、创新能力和开放水平的重要窗口之一。\n\n　　塔斯社报道援引俄罗斯总统特别代表、俄罗斯直接投资基金总裁基里尔·德米特里耶夫的话称，2026年亚太经合组织工商领导人峰会是一场旨在促进对话、合作、和平与繁荣的会议。\n\n 【编辑:管娜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"caf7b503582","title":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”，马杜罗狱中荐书","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735023.shtml","summary":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”，马杜罗狱中荐书 | 国际早察  　　十个多月前，美军突袭委内瑞拉首都加拉加斯，强行带走委时任总统马杜罗；当地时间2026年11月18日…","summary_short":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”，马杜罗狱中荐书 | 国际早察  　　十个多月前…","digest":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”…","points":["十个多月前，美军突袭委内瑞拉首都加拉加斯，强行带走委时任总统马杜罗","当地时间2026年11月18日，在同一座城市里，美国国防部长与委内瑞拉国防部长签下了恢复军事…","这一天，美国国防部长赫格塞思在五角大楼未提前公开行程的情况下到访委内瑞拉首都加拉加斯…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T08:53:39+08:00","size":1,"keywords":[],"body":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”，马杜罗狱中荐书 | 国际早察\n\n　　十个多月前，美军突袭委内瑞拉首都加拉加斯，强行带走委时任总统马杜罗；当地时间2026年11月18日，在同一座城市里，美国国防部长与委内瑞拉国防部长签下了恢复军事合作的协议。\n\n　　这一天，美国国防部长赫格塞思在五角大楼未提前公开行程的情况下到访委内瑞拉首都加拉加斯，与委代总统罗德里格斯及委防长洛佩斯会晤，签署恢复两国军事技术合作的协议。\n\n　　本世纪首位美防长到访\n\n　　据美方透露，赫格塞思当天在委内瑞拉总统府与罗德里格斯会谈，并与委防长洛佩斯落笔签约。\n\n　　他成为本世纪以来，首位访问委内瑞拉的美国国防部长。\n\nCNN的报道\n\n　　根据该协议，美国和委内瑞拉已同意在多个领域加强军事合作，包括联合训练、情报共享、军事装备以及边境安全等。\n\n　　罗德里格斯将其评价为双边关系的“非同寻常的一步”，将有助于改善委内瑞拉部队训练、实现装备现代化，并使武装部队能够接触到新技术。\n\n　　赫格塞思将该协议形容为“历史性的”，并强调两国关系绝非“装点门面”。\n\n　　各表立场，美防长称委是“顺从伙伴”\n\n　　签约仪式结束后，美委双方通过现场讲话与官方声明，对此次防务“破冰”给出了不尽相同的定调。\n\n　　赫格塞思随后在位于加拉加斯的美国大使馆发表讲话，宣称两军将携手清剿跨国贩毒网络；并称自今年1月政局更迭以来，委内瑞拉已从美国“最具挑衅性的地区威胁”，变成了“一个顺从的安全伙伴”。\n\n　　不过，委内瑞拉国防部在同日发表的声明中明确指出，双边合作将严格遵守委宪法及现行法律体系，充分尊重委内瑞拉的主权、独立与领土完整。\n\n　　马杜罗狱中“云荐书”\n\n　　远在纽约布鲁克林联邦拘留中心里的马杜罗，仍在通过社交账号发布消息。\n\n　　今年1月3日被美军带往美国后，马杜罗夫妇一直羁押在纽约等待预计2027年6月的庭审。\n\n　　进入11月中旬，马杜罗的社交媒体接连发文强调“信仰与重生的奇迹”，并向支持者推荐了《乌托邦》等三本著作，评论区不乏支持者要求放人的打卡。\n\n　　他的律师团队也要求美方撤销有关其曾实施酷刑虐待的指控，理由是马杜罗作为主权国家元首应享有豁免权，且美国检察官办公室存在程序性错误。\n\n　　从2019年两国断交、今年1月马杜罗被捕，到3月双方复交、9月罗德里格斯在纽约联大期间与特朗普闭门会晤，再到如今美防长赴加拉加斯签约，美委关系已掉转航向。\n\n　　作者：王曦\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c295a63db2e","title":"梵高《盛放的栗樹》近15億元拍賣成交破紀錄","url":"https://www.stheadline.com/realtime-world/3639153/梵高盛放的栗樹近15億元拍賣成交破紀錄","summary":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上，以連佣金1.904億美元（約14.85億港元）成交，刷新梵高作品的公開拍賣紀錄。","summary_short":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","digest":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","points":["荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","這幅已有逾50年未公開展出的畫作，拍賣前一度捲入納粹時期的售畫爭議…","《盛放的栗樹》（Blossoming Chestnut Trees）創作於1890年5月…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:34:22+08:00","size":1,"keywords":[],"body":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上，以連佣金1.904億美元（約14.85億港元）成交，刷新梵高作品的公開拍賣紀錄。這幅已有逾50年未公開展出的畫作，拍賣前一度捲入納粹時期的售畫爭議，猶太裔前藏家後人指家族當年受到納粹逼害，被逼出售畫作。雙方最終在開拍前達成和解，令拍賣得以順利舉行。\n梵高《盛放的栗樹》畫作。 路透社\n生前最後兩個月創作\n《盛放的栗樹》（Blossoming Chestnut Trees）創作於1890年5月，當時梵高剛離開法國南部的精神病院，移居巴黎近郊的瓦茲河畔奧維爾村，並在當地度過生命最後兩個月。畫作描繪盛放的栗樹及樹蔭下的鄉村小路，一名被認為可能以梵高本人為原型的男子，正走過3名衣着鮮艷的女子，為作品增添神秘色彩。蘇富比指出，畫作展現梵高晚期作品中罕見的樂觀情緒與鮮明色彩。由於梵高晚期作品大多已由博物館收藏，極少在私人市場流通，今次拍賣備受矚目。這幅名畫上月曾在香港中環蘇富比旗艦藝廊展出3天，吸引數百人排隊觀賞，當時估價高達1.8億美元。今次成交價亦打破梵高另一作品《有栢樹的果園》2022年創下的1.172億美元舊紀錄。\n捲入納粹時期售畫爭議\n這幅畫作的收藏歷史亦引發爭議。德國猶太裔出版商菲舍爾1909年在巴黎購入畫作，其家族於1936年納粹統治期間將畫作售出。菲舍爾的後人早前質疑，家族當年受到納粹逼害，蒙受重大經濟損失，被逼出售畫作，要求蘇富比證明交易並非在政治壓力下進行，且成交價符合當時市價。該畫曾幾經轉手，1975年由阿根廷布拉基耶家族購入，收藏逾半世紀。蘇富比在拍賣前夕宣布，現任藏家與菲舍爾夫婦所有合法後人已就出售畫作達成協議，但未有公開和解條款。菲舍爾家族後人感謝各方以公平及互信方式協商，認為協議承認家族在納粹時期遭受的苦難，亦彰顯後人多年來爭取公義的努力。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8bc3e49cf5","title":"輝達臨時CEO宣布提前加薪派股票","url":"https://www.stheadline.com/realtime-world/3639152/輝達臨時CEO宣布提前加薪派股票","summary":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。","summary_short":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。","digest":"美國晶片巨頭輝達在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會","points":["美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會","臨時行政總裁克雷斯（Colette Kress）為穩定軍心…","公司高層同時公布擴展人工智能（AI）工廠業務的計劃，強調黃仁勳離任不會影響發展方向"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:28:05+08:00","size":1,"keywords":[],"body":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。臨時行政總裁克雷斯（Colette Kress）為穩定軍心，宣布將原定明年春季的加薪及股票獎勵安排提前至今年12月。公司高層同時公布擴展人工智能（AI）工廠業務的計劃，強調黃仁勳離任不會影響發展方向。\n《華爾街日報》報道，這場歷時約50分鐘的員工大會，氣氛與黃仁勳過往主持的會議截然不同。黃仁勳向來以充滿活力、愛說笑話及分享故事著稱，克雷斯則着重安撫員工情緒，並讓多名高層輪流發言。黃仁勳的女兒黃敏珊及女婿卡普雷茲亦有出席，但未有發言。克雷斯在會議上強調公司有能力克服目前困境，全球業務營運執行副總裁派克則表示，黃仁勳離任後，不少客戶及合作夥伴主動表達支持，公司未來亦會安排更多高層直接與客戶接觸。\n會議亦揭示輝達未來業務方向，計劃由晶片供應商進一步轉型為提供完整AI工廠的企業。硬件工程副總經理貝爾表示，公司明年將推出貨櫃式運算模組，每個模組可容納8台伺服器機櫃，長遠目標是讓客戶直接訂購整座資料中心。\n安謀(Arm)行政總裁哈斯。 路透社\n獵頭公司接觸安謀掌門\n另一方面，輝達正積極物色黃仁勳的接班人。美媒引述消息指，董事會委託獵頭公司海德思哲尋找新掌舵人，並已接觸英國晶片設計公司安謀（Arm）行政總裁哈斯。現年64歲的哈斯曾在輝達任職7年，被視為潛在接班人之一，但雙方均未就有關消息置評。哈斯周三在得州一場科技會議上形容黃仁勳為「傳奇人物」。輝達曾於2020年計劃收購安謀，但最終因監管機構反對而告吹。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5a686984ac","title":"北海道六花亭 | 日本知名手信品牌遭網攻 8000筆信用卡資料恐外洩","url":"https://www.stheadline.com/realtime-world/3639151/北海道六花亭-日本知名手信品牌遭網攻-8000筆信用卡資料恐外洩","summary":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改，可能導致約8000筆顧客信用卡資料外洩。","summary_short":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改…","digest":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵…","points":["日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵…","公司表示，為確保消費者安全，已暫停官網商店營運","總部位於北海道帶廣市的六花亭，以奶油葡萄夾心餅乾等經典甜點聞名…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:23:02+08:00","size":1,"keywords":[],"body":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改，可能導致約8000筆顧客信用卡資料外洩。公司表示，為確保消費者安全，已暫停官網商店營運。\n總部位於北海道帶廣市的六花亭，以奶油葡萄夾心餅乾等經典甜點聞名，是北海道極具代表性的手信品牌，深受日本國內外遊客歡迎。\n六花亭以奶油葡萄夾心餅乾等經典甜點聞名。六花亭官網\n六花亭總部位於北海道帶廣市。北海道旅遊網站\n六花亭札幌本店。六花亭官網\n黑客入侵官網商店\n根據六花亭說明，公司18日發現官網商店遭到非法存取，信用卡付款頁面的程式遭到惡意竄改，可能使顧客在結帳時輸入的信用卡資訊遭到竊取。\n目前估計約有8000筆信用卡資料可能受到影響，外洩資訊包括信用卡號碼、持卡人姓名、有效期限，以及信用卡安全碼。\n可能受影響的顧客，是10月21日晚上9時至11月18日上午11時期間，曾在六花亭官網商店使用信用卡付款的消費者。\n信用卡付款消費者受影響\n六花亭表示，為確保消費者安全，已暫停官網商店營運，在確認網站安全性之前不會恢復服務。同時，公司也將尋求外部專業機構協助，調查事件原因並研擬防止類似事件再次發生。\n針對今次資訊安全事件，六花亭發表聲明稱。「對於造成顧客極大的困擾與擔憂，我們深表歉意」。\n六花亭並呼籲曾在相關期間使用信用卡購物的消費者，務必確認信用卡交易明細，留意是否出現不明扣款，並提高警覺，防範不法人士利用外洩資訊進行電話詐騙等犯罪行為。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c239605b72f","title":"伊朗局勢｜特朗普：不會在新年前倉促決定是否下令恢復打擊","url":"https://news.tvb.com/tc/1207372-伊朗局勢特朗普不會在新年前倉促決定是否下令恢復打擊","summary":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風，稱不急於決定是否打擊伊朗，留待明年初再向傳媒討論此事。","summary_short":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。","digest":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗","points":["特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風…","有輿論認為，特朗普希望繼續以經濟制裁及海上封鎖向伊朗施壓，考慮到民主黨將於明年初掌控國會…","對於特朗普在未有公開證據下，宣稱伊朗正研發生化武器，伊朗外交部反駁指…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:46:00+08:00","size":1,"keywords":["美國","伊朗","特朗普","伊朗局勢"],"body":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。\n\n特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風，稱不急於決定是否打擊伊朗，留待明年初再向傳媒討論此事。\n\n有輿論認為，特朗普希望繼續以經濟制裁及海上封鎖向伊朗施壓，考慮到民主黨將於明年初掌控國會，特朗普仍有可能在國會展開新會期前採取軍事行動。\n\n對於特朗普在未有公開證據下，宣稱伊朗正研發生化武器，伊朗外交部反駁指，美方試圖傳播謊言去製造恐慌，並警告國際不要重演2003年教訓，美國當年以發現大殺傷力武器為由，出兵攻打伊拉克，但戰後找不到相關武器。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026AYDmtTFC7l1795132059.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/b4e84f58d0e1403091e62437e200ea71/00d5adfa3e5c4c719268eb04e135a24b-c6eb5ca8d6b35b777abc56ca2d7262ad-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026AYDmtTFC7l1795132059.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c660af69a48","title":"尼泊尔法院批准羁押两名前劳工部长","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734994.shtml","summary":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实，加德满都地方法院当天批准警方继续羁押两名前劳工部长等六人4天。","summary_short":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实…","digest":"尼泊尔警方中央调查局发言人19日证实…","points":["中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实…","六人因涉嫌参与一起向赴马来西亚务工人员违规收费的案件，于18日被捕","据警方通报，这六人包括曾任尼泊尔劳工、就业和社会保障部部长的谢尔·巴哈杜尔·昆瓦尔和拉梅什沃…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:40:39+08:00","size":1,"keywords":[],"body":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实，加德满都地方法院当天批准警方继续羁押两名前劳工部长等六人4天。六人因涉嫌参与一起向赴马来西亚务工人员违规收费的案件，于18日被捕。\r\n\n　　据警方通报，这六人包括曾任尼泊尔劳工、就业和社会保障部部长的谢尔·巴哈杜尔·昆瓦尔和拉梅什沃尔·拉伊·亚达夫，以及四名前劳工部高级官员。警方称，六人涉嫌参与批准将向务工人员违规收取的款项汇往马来西亚，汇款总额折合约16.9亿尼泊尔卢比。\n\n　　今年10月，尼泊尔警方已就此案逮捕四人。警方称，这四人涉嫌通过一家私营公司，在赴马来西亚务工人员接受出境前强制性体检时，在常规体检费之外以“生物医学服务费”名义向每名务工者加收100马来西亚林吉特。\n\n　　加德满都地方法院19日还就此案对尼泊尔政府前首席秘书埃克·纳拉扬·阿亚尔签发逮捕令。警方怀疑，其在担任劳工、就业和社会保障部部秘期间，也参与了上述汇款决策。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c3e407a1b","title":"国际能源署：中东冲突很可能对能源市场构成持久影响","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734995.shtml","summary":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告，警告中东冲突很可能对能源市场构成持久影响。","summary_short":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告…","digest":"国际能源署当地时间19日发布《2026年世界能源展望》报告…","points":["中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望…","国际能源署署长比罗尔表示，中东冲突导致的霍尔木兹海峡能源运输受阻给能源供应带来了巨大冲击","尽管能源市场和全球经济展现出了相当强的韧性，但长时间的危机将带来更深远的影响"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:39:17+08:00","size":1,"keywords":[],"body":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告，警告中东冲突很可能对能源市场构成持久影响。\n\n　　国际能源署署长比罗尔表示，中东冲突导致的霍尔木兹海峡能源运输受阻给能源供应带来了巨大冲击。尽管能源市场和全球经济展现出了相当强的韧性，但长时间的危机将带来更深远的影响。他认为尚没有切实可行的方法令能源市场恢复到危机前的状态。\n\n　　报告指出，能源供应危机令能源市场的脆弱性进一步加剧，而这种脆弱性又与地缘政治紧张局势、日益严峻的气候变化问题、网络攻击及其他针对能源基础设施的破坏活动交织在一起。同时，能源价格走高和化肥供应短缺，也对世界粮食安全构成威胁。\n\n　　报告认为，这场危机正促使很多国家重新审视其能源战略，寻求降低能源供应的脆弱性。多国推动在能源供应、贸易路线、燃料结构和技术供应链等领域更加多元化、更加倾向于使用本国能源资源并加快电气化进程。\r\n\n　　报告还认为，如果霍尔木兹海峡的航运风险持续存在，通过投资建设新的绕行管道、开发替代供应渠道等措施，可以将通过霍尔木兹海峡的石油日均运输量从危机前的2000万桶降至2030年的850万桶，并在2035年进一步降至200万桶以下。但中东仍将是全球最大的国际石油出口地区，在全球能源安全格局中依然发挥关键作用。\n\n　　报告预测，可再生能源和核能未来将快速发展；电力需求的增速也将加快。比罗尔表示，构建一个更安全、更经济、更可持续的能源体系，并为此开展有效合作，“符合所有国家的共同利益”。（完） 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cea4f4cd87b","title":"美国航空航天局：收到探测器从距离地球一光日发来的信号","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734996.shtml","summary":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示，已接收到“旅行者一号”探测器从距离地球一光日位置发来的信号。","summary_short":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示…","digest":"美国国家航空航天局19日表示…","points":["中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示…","一光日是指光在24小时内传播的距离，约为260亿公里","美国航空航天局在声明中说，“旅行者一号”探测器于美国东部时间11月18日5时16分抵达距离地…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:38:17+08:00","size":1,"keywords":[],"body":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示，已接收到“旅行者一号”探测器从距离地球一光日位置发来的信号。\n\n　　一光日是指光在24小时内传播的距离，约为260亿公里。\n\n　　美国航空航天局在声明中说，“旅行者一号”探测器于美国东部时间11月18日5时16分抵达距离地球一光日的位置，是人类历史上飞行最远的航天器。美国航空航天局在美东时间11月19日5时16分确认收到“旅行者一号”探测器一天前发出的信号。\n\n　　美国航空航天局科学任务总监福克斯(Nicky Fox)表示，“旅行者一号”探测器再次打破纪录、突破界限，引领人类踏上新征程。\r\n\n　　美国航空航天局于1977年9月5日发射了“旅行者一号”探测器，该探测器已在太空中飞行了近50年，先后飞掠木星和土星，飞出太阳系。美国航空航天局1977年8月20日发射了“旅行者二号”探测器。它们是仅有的两个已离开太阳系进入星际空间飞行的人造航天器。\n\n　　相比“旅行者一号”探测器，“旅行者二号”探测器有着更远的飞行轨迹，先后飞掠木星、土星、天王星和海王星。据美国航空航天局消息，“旅行者二号”探测器预计于2035年11月到达距离地球一光日的位置。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd0e6d49ba1","title":"外媒：一移民船在塞内加尔沿海倾覆 已致数十人失踪","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734992.shtml","summary":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆，已造成数十人下落不明。","summary_short":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆…","digest":"据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海
