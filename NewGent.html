的购买目标，进入95分搜索，一排货架摆好，展示不同成色下的不同价格，帮助其迅速做决定。\n\n第二梯队、以手机切入的转转和爱回收，做的则是标品货值市场。2025年，转转关掉C2C，all in“官方验”，门店超过1000家，收购红布林后其切入奢饰品赛道，近期还在探索仓储门店的“超级转转”模式，其年GMV也已经达到200亿元级别；爱回收则通过2000多家线下门店织回收网络，2025年营收达到210.5亿元。\n\n它们拼的是回收触点与供应链效率，谁能收到一手货源，再把货验好、卖出去。\n\n从GMV的规模体量上看，95分也已迈入百亿级梯队。\n\n“大家都在用不同的方式解决二手的信任不对称。”陈意明也向界面新闻谈及当下二手经济的热潮，几乎每个细分形态下都站稳了竞争者。有人用内容、有人用流量、有人用线下门店，相比之下，95分选择用质检和定价能力，去解决交易信任问题。\n\n在交易形式上，每件在95分交易的商品，都需要通过平台查验。以寄售为例，卖家把商品寄给平台，平台经过查验、识别瑕疵、定级、拍摄并存储，售出后再完成发货等服务。另有挂售与回收模式。\n\n寄售模式决定了95分不是单纯提供信息的C端集市，也不是靠买低卖高赚差价的自营零售商。在商业化层面，平台主要靠收取商品查验、处理与交易的服务费。\n\n界面新闻了解到，今天仅在鞋类上，95分已积累约6000万个瑕疵项数据。每个瑕疵需要记录名称、部位和程度，再结合商品、品牌和交易行情，用于支持成色判断与估价。\n\n“一物一验”的服务，听起来这是一门非常重的生意，但平台的门槛也在这里。\n\n年轻消费者对二手商品的选择，呈现出高客单、高成色、精描述的需求特征，这也促使95分向高客单精品倾斜，投入更多成本，如质检、识瑕、估价的服务，使其成为高周转的生意。\n\n不过，贵的商品不一定更好卖，经典款与冷门款的成交速度也不尽相同。对长期卖不出的部分商品，平台会主动提醒卖家取回，而不是持续留仓。\n\n因此，对于95分来说，交易效率是核心。在此前提下，平台要在卖家收益、买家的价格接受判断之间，寻找到一种效率最高的平衡。\n\n从盈利和规模角度看，这门生意已经被验证成立。\n\n不过，从非标高货值商品起步的95分，当下面对的是另一种复杂。同一款商品可能有不同的瑕疵，用户要判断自己能接受哪些使用痕迹，这些痕迹又对应怎样的价差。报告中的瑕疵是否准确、估价建议是否有用，需要长期的积累。\n\n图源：界面图库\r\n\n慢生意、快需求\n\n界面新闻了解到，2022年至2024年，95分主要在尝试多品类策略；最近两年，则在把各品类下的服务做实。\n\n对于用户增长的课题，95分表现得颇为克制。过去几年里，他们几乎很少做投放，但用户每年增长速度都保持在30%至40%。\n\n相比之下，平台更倾向于在供给质量、品类服务与有效履约上继续“爬坡”。95分希望获得更多供给，尤其是有特色好货的卖家。比如鞋服、运动玩物更偏向个人卖家，二奢和数码则需要有更多商家参与。\n\n个人卖家既提供分散的货源，也可能成为买家，今天平台上这种买卖互转的用户占比已达约28%，团队将其视为提高用户黏性的重要方向。\n\n目前，95分的公司中心团队规模约在几百人，产品与研发人员占一半以上，另在全国上海、廊坊、武汉、沈阳等地布局了六个区域大仓，仓内有执行团队。寄售商品60天内免仓储费。\n\n“仓储费不是为了赚这笔钱。”95分的团队告诉界面新闻，60天是一个平台判断过的均值，大部分商品的流转都在60天内，设置的目的是为了让货卖得更快。卖不掉的货，平台也会主动提醒卖家免费取回。\n\n陈意明过去一年花时间最多的地方，是跑仓库、看质检，以及和用户聊天。\n\n他对用户观察的事非常感兴趣。他曾经陪着三个用户各待了一天，付费买下他们的时间，看看购买商品、使用的流程场景，这也给了其很多意外的收获。\n\n比如，每个月发工资后的10天，是95分的消费高峰，工资到手后，看够了再下手。还有一个用户花了几十万买了块冷门表，结果只为追求的是一种“深不可测”的感觉。\n\n对于95分来说，今天平台最大的挑战之一，是用户需求正在拉动品类结构变化，而平台的履约标准无法及时跟上。比如，用户想要的新运动装备，该怎样检验、怎样定级、如何估价；如果扩进来的供给不够好，平台又检验不出来，那就很可能造成更大的信任风险。\n\n“是选择拓用户还是长能力为主，我肯定会选择长能力。”陈意明说，等平台能力准备就绪，自然能迎接下一轮的增长。\n\n未经正式授权严禁转载本文，侵权必究。",

          "body": "“山东高法”消息，11月18日，济宁市中级人民法院一审公开宣判中国华云气象科技集团有限公司原党委常委、副总经理杜建苹受贿、贪污一案。对被告人杜建苹以受贿罪，判处有期徒刑十年六个月，并处罚金人民币五十万元；以贪污罪，判处有期徒刑四年，并处罚金人民币二十万元；决定执行有期徒刑十一年六个月，并处罚金人民币七十万元；对杜建苹贪污所得，返还北京华云东方探测技术有限公司，杜建苹受贿所得予以没收，上缴国库。\n\n法院审理查明：（一）受贿罪。2019年8月至2025年3月，被告人杜建苹利用担任北京华云东方探测技术有限公司总经理职务上的便利，为有关单位在气象设备销售等方面提供帮助，直接或通过他人非法收受财物，共计折合人民币515万余元。（二）贪污罪。2017年12月至2024年9月，杜建苹利用担任北京华云东方探测技术有限公司的便利，伙同他人采取虚增合同价款的方式，通过有关单位套取钱款共计255万余元。事后，杜建苹等人将上述钱款私分后占为己有，其中杜建苹实际所得165万余元。\n\n济宁市中级人民法院认为，被告人杜建苹的行为构成受贿罪、贪污罪，应依法惩处。鉴于杜建苹具有坦白、自首、立功情节，认罪悔罪，积极退赃，违法所得已全部退缴，依法可对其从轻处罚。法庭遂作出上述判决。\n\n2026年7月8日，济宁市中级人民法院公开开庭审理了该案。庭审中，检察机关出示了相关证据，被告人杜建苹及其辩护人进行了质证，控辩双方在法庭的主持下充分发表了意见，杜建苹进行了最后陈述，当庭认罪悔罪。被告人亲属、社会各界群众10余人旁听了庭审。",

          "summary_short": "美东时间11月18日，世界首富马斯克在纽约年度政经峰会DealBook上通过视频连线表态，在共和党遭遇惨败后…",

          "size": 1,
          "keywords": [],
          "body": "美东时间11月18日，世界首富马斯克在纽约年度政经峰会DealBook上通过视频连线表态，在共和党遭遇惨败后，他对自己投入巨额资金的行为感到“相当愚蠢”，花了这么多钱，却没看到什么成效。\n\n据央视新闻报道，现有申报记录显示，为帮助共和党候选人胜出，马斯克累计向联邦政治委员会捐赠4.45亿美元，成为此次中期选举最大的个人“金主”。\n\n为了让得州前总检察长、共和党人帕克斯顿进入参议院，马斯克用了2.12亿美元，但最终前者还是败给了民主党对手塔拉里科。马斯克旗下的特斯拉、SpaceX、xAI等公司的核心总部与超级项目全部落地得州，是当地政府最大的企业优惠受益方之一。\n\n有分析指出，帕克斯顿在任内把调查矛头对准了马斯克的批评者，为X平台规避了大量合规风险。若帕克斯顿能当选联邦参议员，马斯克后续在自动驾驶、AI算力中心能源、航天发射空域等核心业务领域都将获得更为宽松的监管环境。\n\n马斯克本人正在深圳出席APEC系列活动。在昨天DealBook峰会的现场连线上，他随后又为自己“找补”，称如果没有自己的资金投入，共和党人可能会输得更惨。这一结果表明，仅靠竞选资金并不能决定选举胜负。如果时光能够倒流，我大概会少花些钱。\n\n国会选举的计票工作已进入收尾阶段，目前民主党人在参议院‌拿下‌了54席‌，净增7席，在众议院‌最终锁定‌250席以上‌，净增约40席，完全掌控两院主导权。共和党此次败北，在很大程度上是因为公用事业费用、食品价格和伊朗战争带来的汽油价格不断上涨影响。\n\n马斯克是美国政坛极具影响力的纽带人物。自民权运动以来，民主党推动少数族裔平权立法，直接回应了移民群体的核心权益诉求。出生在南非的马斯克早期商业版图高度依赖民主党人长期主政下加州的新能源政策扶持。民主党长期主推环保、科技补贴政策，两者高度契合。\n\n但2020年拜登执政后逐步收紧了新能源补贴的申领门槛，同时对特斯拉的自动驾驶技术、SpaceX的频谱使用提出了更严格的监管要求。另一方面，马斯克指责民主党主张的所谓多元价值观是心智病毒……一系列事件使得双方分道扬镳。\n\n4年后的大选中，马斯克投入近3亿美元助力共和党候选人胜选，由此深度嵌入了共和党的权力版图，包括带领“政府效率部”在联邦政府内部掀起降本增效等暴风雨，双方利益高度绑定。\n\n在去年初的民调中，马斯克的不受欢迎程度一度超过了总统，大量民众迁怒到特斯拉门店上。最终他在去年5月底辞去“政府效率部”的工作。“政府效率部”一直缺乏公开问责，人员已陆续撤离总部。随后马斯克一度曾因与共和党关系恶化而威胁组建第三党，但进入秋季后双方关系有所缓和。\n\n另据新华社报道，国会民主党议员11月8日表示，明年1月民主党接管国会后，将对马斯克、新任白宫办公厅主任米勒及部分企业发起调查，重点将聚焦马斯克在“政府效率部”解雇联邦雇员一事中扮演的角色，以及米勒在特朗普政府移民执法政策中发挥的作用。\n\n另有两名民主党籍参议员已正式致信马斯克，要求后者保留关于限制乌克兰使用SpaceX“星链”和“星盾”系统的所有记录。\n\n尽管如此，马斯克本人似乎对这些潜在的监管阻力不以为意，并在社交媒体平台上暗示把数据中心部署至太空轨道相当有吸引力。\n\n他的太空算力中心布局，核心是‌依托SpaceX星舰完全可重复运力，把算力卫星部署到近地轨道，最终彻底绕开地面电网、土地和冷却资源的物理极限。今年1月，SpaceX正式向联邦通信委员会提交申请，计划部署最多‌100万颗‌搭载人工智能算力芯片的专用卫星。\n\n另一方面，美国联邦债务在今年8月就突破了40万亿美元，其中利息支出已超过国防支出。社会福利、医疗、军费和利息都难以压缩，单靠清理政府财政浪费显然不足以扭转债务曲线。国会新格局有望遏制进一步扩张支出或减税的立法空间。\n\n马斯克为白宫提开出的“药方”是，通过SpaceX的太空算力、xAI的大模型、特斯拉的“擎天柱”人形机器人三大核心业务，构建完整的产业闭环，从而摆脱两党的长期政治僵局。工厂实现高度自动化以后，商品和服务供给快速增加、价格随之下降，经济总量扩大，债务压力便可被增长慢慢消化。\n\n未经正式授权严禁转载本文，侵权必究。寰球政事\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n为中期选举砸4亿多美金，马斯克后悔了：相当愚蠢\n\n仅靠竞选资金并不能           "body": "中新网沈阳11月19日电 (记者 李晛)记者19日自辽宁省财政厅获悉，为深入落实省委、省政府“人工智能+”行动部署，降低市场主体算力使用成本，激活省内算力市场，助力人工智能赋能实体经济，辽宁省财政厅会同辽宁省数据和政务服务局联合印发了《辽宁省算力券政策实施细则》，依托省级数字经济专项资金，正式启动算力券补贴政策实施工作，为辽宁人工智能产业发展注入财政动能。\r\n\n　　算力券是省级财政安排的数字化政策工具，支持省内企业、医疗机构、高校、科研机构等算力需求方，采购合规智能算力资源，开展大模型训练推理、数据标注、数据分析等应用。\n\n　　政策明确，按算力合同实际发生金额给予最高30%补贴，同一单位年度补贴上限200万元，市县已有算力相关补贴可按规定叠加享受，累计补贴比例不突破30%。申领主体年算力采购费用需达到25万元及以上，算力供给方上架智能算力规模不低于50PFlops，并完成省级算力平台注册。\n\n　　在资金保障和兑付流程上，坚持“合法合规、公开透明”原则，采取总额控制、简化流程、规范管理。算力券全部依托省级算力平台线上办理，实行“即申即发、集中兑现”，申领主体线上提交材料完成资质审核后获取电子算力券，完成算力服务结算使用后集中申请兑现。\n\n　　算力券政策出台实施，对辽宁省发展新质生产力具有重要现实意义。一方面，通过财政补贴降低市场主体算力投入门槛，撬动更多市场力量开展大模型研发、数据加工等创新活动，加速人工智能技术成果转化落地；另一方面，以需求牵引供给，引导省内算力中心扩大有效供给，推动算力资源供需双向协同发展，补齐数字基础设施应用短板，助力数字经济与实体经济深度融合，为辽宁全面振兴取得新突破塑造数字发展新优势。\n\n　　下一步，辽宁省财政厅将统筹用好数字经济专项资金，密切跟踪政策实施成效，与主管部门共同做好政策落地兑现，充分发挥财政资金杠杆撬动作用，推动算力供给与需求双向提升，加快培育辽宁省人工智能新质生产力，服务辽宁振兴发展。(完) 【编辑:李岩】",

          "body": "親子好去處2026｜今個周末還在想帶小朋友去哪裡？本週末有不少精彩活動，全部免費入場！無論想帶小朋友欣賞爵士音樂節、親子觀星，抑或參與民族嘉年華及親子工作坊等，以下5大親子活動都能滿足不同需要的小朋友。立即記下以下活動時間、地點及參加詳情！\n博愛醫院 Chill Buddy 親子嘉年華\n「Chill Buddy 親子嘉年華」透過創意互動遊戲，讓家長與小朋友增進溝通及認識情緒。活動特設四大特色攤位，包括考驗默契、由家長蒙眼按子女指示畫畫的「蒙眼藝術家」；保密寫下心事換取鼓勵小卡的「樹洞回音」；將煩惱貼在冰壺推向解決方案、寓意減壓的「冰壺壓力回收站」；以及讓親子共同製作個性風鈴的「『魚』眾不同」。完成攤位遊戲即可獲得小禮物一份。\nChill Buddy 親子嘉年華 \n活動日期：2026年11月21日\n活動時間：11:00-18:00 \n活動地點：牛頭角上邨商場對出空地\n參加方法：費用全免，即場參加\n太空館 星空遊樂園\n今個周末太空館會化身成「星空遊樂園」，參加者可在天台使用天文望遠鏡觀賞維港上的星光，也可在展覽廳參與遊戲，認識天文知識。天台觀星活動共4節，每節約25分鐘，活動內容相同，每節名額80人。\n（圖片來源：香港太空館網站）\n太空館 星空遊樂園\n活動日期：2026年11月21日\n活動時間：19:00-21:00 \n活動地點： 香港太空館展覽廳及天台\n參加方法：於當天下午6:30在太空館正門處派發免費參加證，先到先得，額滿即止\n康文署《亞裔藝采+ 2026》嘉年華\n戶外嘉年華「亞裔藝采+」以「禮意綻放」為主題匯聚約30個國家及地區代表，帶來多元歌舞與親子工作坊。同場的「盛禮薈萃」民族文化展覽則展出各地珍貴手工藝藏品，適合一家大小共同探索不同文化的獨特風采。\n（圖片來源：香港特別行政區政府新聞公報網站）\n康文署《亞裔藝采+ 2026》嘉年華\n活動日期：2026年11月22日\n活動時間：14:00-18:00 \n活動地點： 九龍尖沙咀梳士巴利道10號香港文化中心大堂及露天廣場\n參加方法：免費入場，更多詳情可按此瀏覽\n國泰 西九爵士音樂節 \n今年「國泰西九爵士音樂節」免費演出雲集本地、中國內地、泰國、韓國及歐洲等地逾30個音樂單位，讓大小朋友感受即興與跨界音樂火花！一家大細可於大草坪及海濱西草坪邊野餐放電、邊逛15個本地品牌美食市集，或到M+草坪欣賞非洲鼓及手碟等特色樂器演出。現場詢問處更免費提供護耳罩借用，貼心照顧小朋友聽覺需要！\n由即日起於網上或國泰西九爵士音樂節現場登記成為 「西九演藝藝探會員」，只需出示有效會員證明，即可於11月21、22日到大草坪（餐飲市集）免費換領迎新飲品指定啤酒或特調汽水1罐（數量有限，先到先得，換完即止）。\n（圖片來源：WestK 西九文化區 instagram）\n（圖片來源：西九文化區網站）\n\n國泰西九爵士音樂節-免費音樂節目\n活動日期：2026年11月17日至22日\n活動時間：\n• 11月17至20日：20:15-22:45\n• 11月21日：14:30-22:30\n• 11月22日：14:00-22:45\n活動地點： 西九文化區（留白Livehouse、大草坪、海濱西草坪）\n參加方法：免費入場，部分項目需提早購票，更多詳情可按此瀏覽\nYMCA 「愛 • 和平」行動 2026\n由香港中華基督教青年會（YMCA）舉辦的「愛‧和平」行動2026，當日邀請到巴黎殘疾人奧運會輪椅羽毛球銀牌得主陳浩源先生擔任活動大使，鼓勵大眾透過運動關心自己、關愛他人。現場亦設有多個精彩攤位，參加者完成攤位遊戲更可換領豐富禮品，適合一家大小共同參與，盡興而歸。\n（圖片來源：Chinese YMCA of Hong Kong 香港中華基督教青年會 Facebook）\nYMCA 「愛 • 和平」行動 2026\n活動日期：2026年11月21日\n活動時間：14:30-17:00 \n活動地點： 啟德雙子匯2期8樓\n參加方法：免費入場\n香港女童軍總會 營地同樂日\n香港女童軍總會舉辦的營地同樂日設有3大特色活動，包括「減壓捏捏球」，參加者可發揮創意並搭配色彩，親手製作獨一無二的可愛小物。「拼豆創作」則以像素風手作形式，讓大眾利用色彩繽紛的拼豆拼砌喜愛圖案。以及「手轉小陀螺彩繪」，為經典木製小陀螺繪上獨特色彩與圖案，轉動時色彩斑斕，更可與家人及朋友即時展開陀螺大賽。無論大人或小朋友，均可一同享受這個充滿歡笑與探索的開放日。\n官方圖片\n香港女童軍總會-營地同樂日\n活動日期：2026年11月22日 \n活動時間：13:00-17:00\n活動地點：香港女童軍總會 梁省德海上活動訓練中心（大埔大美督船灣淡水           "body": "消委會潤手霜2026｜秋冬天氣乾燥，雙手容易脫皮或乾裂。消委會與國際消費者研究及試驗組織曾進行有關潤手霜的評估，測試13款在本港出售的潤手霜，發現大部分潤手霜的保濕效果理想。消委會推介10款高分且保濕功效強潤手霜，價錢最低更只需要$24，其中包括「NIVEA」、「Avène」等常見的品牌。\n消委會潤手霜測試 10款高分潤手霜防乾燥濕疹\n根據《選擇月刊》第517期測試報告，消委會總共測試13款在本港有售的潤手霜，售價由約$24至$210不等。每款潤手霜都安排30位試用者進行為期兩星期的測試，並透過試用者的皮膚狀況進行評估。\n【同場加映】為甚麼要使用潤手霜？防手部乾燥引發濕疹？\n\n消委會推介10款高分潤手霜\n消委會檢測不同潤手霜的保濕功效和水份流失速度，結果發現，有10款潤手霜測試後總評分獲4星以上的高分評價，名單如下：\n\n消委會推測試 12款潤手霜保濕功效理想\n消委會指，試用者在使用各款潤手霜樣本2星期後，皮膚表面量度所得的電容值都明顯高於基線水平，反映樣本的保濕效能普遍理想。其中有12款保濕功效達4分或以上：\n5分潤手霜\n KIEHL'S 高效能潤手霜（聲稱來源地：美國 ）\n4分潤手霜\n BIODERMA Atoderm 柔潤護手霜（聲稱來源地：法國）\n NIVEA NOURISHING CARE HAND CREAM（聲稱來源地：西班牙）\n EAU THERMALE AVENE （聲稱來源地：法國 ）\n CAUDALIE 葡萄籽滋潤抗氧潤手霜（聲稱來源地：法國 ）\n YVES ROCHER 山金車深層滋養潤手霜（聲稱來源地：法國 ）\n AESOP 尊尚芳香護手霜（聲稱來源地：澳洲 ）\n Kamill 卡蜜兒強效滋潤護甲潤手霜（聲稱來源地：德國 ）\n EUCERIN 抗乾燥深度滋養手霜5%（聲稱來源地：波蘭 ）\n Jurlique 玫瑰護手霜（聲稱來源地：澳洲 ）\n L'OCCITANE乳木果潤手霜（聲稱來源地：法國 ）\n EOS 潤手乳霜 （蘭花香草）（聲稱來源地：美國 ）\n為甚麼潤手霜會油膩？越油保濕效果越好？\n潤手霜怎樣防止水分流失？消委會指出，普遍潤膚產品除了含有保濕劑來補充皮膚水分，通常也同時含有封鎖劑，有助在皮膚表面形成抗水的屏障。傳統的封鎖劑含有礦脂和礦物油，如果配方中含有超過5%的礦脂，能有效減少水分通過皮膚表面的流失。雖然礦脂的隔水效果比礦物油和矽類化合物更理想，但會令皮膚觸感變得油膩，而這亦是大部分潤手霜觸感油膩的原因。\n30位試用者實測 推介6款好用潤手霜\n消委會表示，是次測試中有邀請30位不同年齡的女士試用潤手霜，並在產品的接受程度、產品效能上進行評分，其中有6款評價評分較高，獲3.5點評分以上。試用均認為該乳霜易推，質地不會過於油潤或黏膩，吸收程度理想，而且令皮膚變平滑，名單如下：\n\n4分潤手霜：\n NIVEA NOURISHING CARE HAND CREAM\n3.5分潤手霜：\n KIEHL'S高效能潤手霜\n BIODERMA Atoderm 柔潤護手霜\n CAUDALÍE 葡萄籽滋潤抗氧潤手霜\n YVES ROCHER 山金車深層滋養潤手霜\n EOS 潤手乳霜 （蘭花香草）\n試用者推介不黏膩潤手霜 哪款氣味最易接受？\n此外，試用者亦為不同潤手霜的氣味和油潤黏膩程度進行評分，排名如下：\n\n最歡迎氣味（清淡而柔和） \n NIVEA\n YVES ROCHER\n較不受歡迎氣味（氣味太濃） \n Jurlique\n最受歡迎質地 （清爽不黏膩）\n BIODERMA\n NIVEA\n較不受歡迎質地 （感覺稍為油潤、黏膩）\n 卡蜜兒\n Eucerin\n lavera\n消委會教保養雙手貼士 正確使用潤手霜防爆拆\n消委會指出，保養雙手和使用潤手霜也有技巧，並教4大貼士：\n.\n\n護手方法：\n1. 使用潤手霜方法\n 建議適當洗手並擦乾後，取適量潤手霜塗抹於雙手，不要忽略手指、指尖和指縫，輕輕按摩至完全吸收。\n2. 清潔工作前保護\n 進行清潔工作，例如洗碗或需要接觸強力清潔劑的家務，應配戴手套以避免雙手反覆接觸化學物品和刺激物質。\n3. 戶外活動後使用\n 長時間在戶外活動例如踏單車和遠足，事前應做足防曬措施，手背和手指都應塗上防曬乳液並適時補塗。經陽光曝曬後，皮膚可能較為乾燥，建議使用潤手霜滋潤雙手。\n4. 五類人群需特別注意\n 長期病患者（如糖尿病、甲狀腺疾病患者）和皮膚病患者（如濕疹、牛皮癬患者）等可能因疾病而長期皮膚乾燥。\n 長者的皮膚油脂分泌較少，保濕效果較差，同樣易受皮膚乾燥問題困擾。\n 部分職業人士如髮型師、醫護人員等雙手經常沾水、接觸清潔劑或化學物品。\n 建議上述人士多加留意手部和身體的皮膚護理，塗抹潤手霜時不能忽略指尖、指縫等較為乾燥的部位，塗抹潤手霜的次數宜按需要增加，不含香料的潤手霜型號或許較為適合。\n延伸閱讀：消委會推介9款安全滿分潤唇膏 不含致癌礦物油\n\n延伸閱讀：濕疹7大常見症狀\n延伸閱讀：護理濕疹皮膚2大貼士\n相關文章：\n消委會免沖水洗頭水｜21款產品逾6成含致癌致敏物 5款較安全 $68完勝$390！\n消委會染髮劑｜16款染髮劑含致敏物可致腎中毒 9款獲滿分最安全 50惠上榜\n消委會氣炸鍋推介｜6款致癌物超標 5款安全高分最平$548 2招減致癌物\n《星島頭條》APP經已推出最新版本，請立即更新，瀏覽更精彩內容：https://bit.ly/3yLrgYZ\n\n 最Hit\n\n 撳錯即中招！「我不是機器人」淪新型釣魚陷阱 網民險被盜密碼+個人資料 小心網頁這些特徵...\n\n 生活百科\n\n 20小時前\n\n 胡定欣與醫生老公陳健華放閃約「媒人」打波 劉愷威攜新女友黎紀君甜蜜同框\n\n 影視圈\n\n 13小時前\n\n 深圳APEC｜歡迎晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n\n 即時中國\n\n 7小時前\n\n 羅霖餅印長子高大帥氣 精緻五官遺傳亞姐冠軍神基因 港大碩士英俊外貌網民讚可原地出道\n\n 影視圈\n\n 2026-11-18 08:00 HKT\n\n 深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n\n 即時中國\n\n 4小時前\n\n 行山愛好者競投石屋 出價100萬惜落空 不愛「石屎森林」 嘆有錢未必買到好環境\n\n 樓市動向\n\n 18小時前\n\n 09:22\n\n 深圳APEC︱習近平：中方提供2000萬美元資助開展亞太經合組織務實合作︱不斷更新\n\n 即時中國\n\n 1小時前\n\n 再就業津貼最後召集｜限期前拎足$20,000！40歲以上全職兼職皆有份 明年7月完結即睇申請資格\n\n 生活百科\n\n 19小時前\n\n 深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身深圳\n\n 即時中國\n\n 8小時前\n\n 洪天明自爆全家移居杭州 與老婆周家蔚曾因長時間分居兩地屢傳婚變 多次提出離婚\n\n 影視圈\n\n 23小時前\n\n 聯絡我們\n\n 關於我們\n\n 隱私政策聲明\n\n 使用條款\n\n 版權及免責聲明\n\n 幫助及反饋\n\n 我要爆料\n\n 無障礙網頁\n\n Copyright © 2026 SingTao Ltd.All rights reserved. \n\n 本網站正使用 Cookies\n\n 我們使用 Cookie 改善網站體驗。 繼續使用我們的網站即表示您同意我們的 Cookie 政策。\n\n 同意及關閉\n\n 《星島頭條》流動應用程式(APP)是一個結合生活、新聞資訊、視頻、個人化功能及生活實用小工具的綜合平台。\n\n 繼續瀏覽立即下載",

          "body": "中新网哈尔滨11月19日电(记者 刘璐 赵宇航)11月18日晚，由黑龙江省青少年发展基金会主办的“托举梦的力量”——共青团“金秋助学”希望工程圆梦行动十周年公益分享会在哈尔滨举办。来自社会各界的爱心企业、受助学子等1000余人参加活动。\n\n11月18日晚，“托举梦的力量”——共青团“金秋助学”希望工程圆梦行动十周年公益分享会活动现场。赵宇航 摄\n\n　　歌舞《这世界充满爱》拉开分享会帷幕，情景诗朗诵《十年前的来信》《一个也不能少》、希望工程主题曲《大眼睛》、黑龙江希望工程原创歌曲《雨露与花》等多个节目展现社会各界爱心人士的公益善举。希望学子代表轮番登台分享成长故事，昔日受助的青少年如今成长为奋斗在祖国建设各条战线上的栋梁之材。\n\n11月18日晚，“托举梦的力量”——共青团“金秋助学”希望工程圆梦行动十周年公益分享会节目表演现场。赵宇航 摄\n\n　　活动现场还发布《“金秋助学”新十年行动倡议书》，向十年来对黑龙江希望工程公益事业做出突出贡献的爱心企业、合作伙伴、工作者等致敬，号召各界争做微光聚力的爱心资助者、薪火相传的成长引路人、弘扬美德的公益宣传员，推动共青团“金秋助学”希望工程圆梦行动持续发展。\n\n　　据悉，自2017年共青团“金秋助学”希望工程圆梦行动启动以来，项目累计募集爱心善款1.1亿元，精准帮扶5.6万名黑龙江困境学子顺利完成学业、逐梦成才；逐步构建组织化、社会化、网络化相结合的资源筹集机制，搭建覆盖基础教育、职业教育、高等教育的全学段、全方位资助体系，形成跟踪帮扶、职业规划、岗位实习一体化资助服务链条，在资助学业的同时，引导青少年厚植家国情怀、树立远大理想。(完)\n\n 【编辑:李岩】",

          "body": "曼聯新帥普捷天奴（Mauricio Pochettino）剛走馬上任，便要立即為慘不忍睹的防線尋找解藥。紅魔今季各項賽事狂失30球，與歐洲五大聯賽其餘兩隊並列防守最差。據《天空體育》披露，曼聯高層已承諾在1月冬季轉會窗全力「泵水」支持新帥，而普帥的增兵名單已初見雛形。他將破天荒獲得比歷任前度更大的轉會話事權，並瞄準中堅、左閘及前鋒三大位置進行重磅補強，其中英格蘭中堅班夫韋迪（Jarrad Branthwaite）及美國隊左閘愛將安東尼羅賓遜（Antonee Robinson）已成首要獵物。\n重燃班夫韋迪收購戰\n現年24歲的愛華頓中堅班夫韋迪，早在2024年已被曼聯瘋狂追求，惟當時兩度報價均遭拖肥糖拒絕。雖然班夫韋迪合約期至2030年，但急需中堅穩固防線的普捷天奴已將其列為頭號目標。此外，富咸中堅奇雲巴斯（Calvin Bassey）亦是考慮人選之一。\n至於左閘位置，富咸的美國國腳安東尼羅賓遜備受青睞。羅賓遜在普捷天奴執教美國國家隊期間合作無間，深得恩師器重。祖雲達斯中場麥堅尼（Weston McKennie）日前受訪時亦大爆內幕，直言多位美國隊隊友正籌備轉會，隨恩師空降奧脫福；普捷天奴對此亦拒絕排除可能性。\n美國國腳羅賓遜或隨恩師空降\n除了羅賓遜，曼聯在夏窗曾考慮的巴塞隆拿左閘阿歷斯巴迪（Alejandro Balde）依然在備用名單之中。隨着1月轉會窗進入倒數，這波針對防線的大清洗與重組，將成為普捷天奴能否帶領曼聯逃離降班區的關鍵戰役。",

          "summary_short": "中新网11月19日电 据国家网络安全通报中心微信公众号消息，11月19日…",
          "digest": "据国家网络安全通报中心微信公众号消息，11月19日…",

          "body": "中新网11月19日电 据国家网络安全通报中心微信公众号消息，11月19日，国家网络安全通报中心发布JAVA远程代码执行高危漏洞预警，具体内容如下：\n\n　　11月17日，境外安全研究机构Calif披露了名为Java4Shell的高危漏洞(CVE-2026-114938)，该漏洞存在于OpenJDK Base64解码路径中，当攻击者向Java应用提交特制的Base64数据时，可触发堆内存越界写入，造成敏感信息泄露甚至远程代码执行，Oracle已紧急发布修复版本。该漏洞影响范围广，大量暴露于互联网的Java应用，极易成为网络攻击的重点目标。\n\n　　一、Java4Shell漏洞安全风险分析\n\n　　1、漏洞存在于OpenJDK底层性能优化汇编代码中，OpenJDK在x86-64平台采用AVX-512 VBMI指令集对Base64解码进行加速，当输入为畸形数据时，尾部填充区域输出长度计算发生数值下溢，触发约62字节堆内存越界写入。该漏洞深度内嵌于底层汇编代码中，常规组件扫描工具无法有效检出。\r\n\n　　2、触发条件简单，攻击路径较多。攻击者仅需向Java应用提交64个字母“A”加1个“=”(较老的OpenJDK 17版本为128个“A”加“=”)畸形字符串即可触发越界写入。Base64解码在身份认证、文件上传、网络消息等场景中广泛使用，攻击者可通过认证令牌、SAML消息、上传文件等多种入口提交恶意输入，触发路径多、利用成本低。\n\n　　3、危害后果严重，可致信息泄露或系统遭完全控制。攻击者通过堆内存越界写入，可覆写相邻对象元数据、读取敏感内存，造成拒绝服务，并最终实现远程代码执行，甚至完全接管服务器。漏洞披露方已在Keycloak、Atlassian Jira、Atlassian Confluence、JFrog Artifactory、Jenkins、PingFederate等常用产品的默认配置下验证预认证远程代码执行，Apache Kafka Broker、Apache Solr、Elasticsearch、Gerrit、Netflix Spinnaker等产品在认证后也可被利用，基于Spring Boot、Apache Struts构建的应用同样可以复现。\n\n　　4、影响范围广，重要行业安全威胁较大。该漏洞影响OpenJDK 17.0.6及之后版本，以及Amazon Corretto、Eclipse Temurin、Microsoft Build of OpenJDK、Azul Zulu、BellSoft Liberica、SAP SapMachine、Red Hat OpenJDK、Oracle Java SE等主流发行版，Oracle同时将Java SE 8的性能版8u511b33-perf列入受影响范围。漏洞触发需运行在支持AVX-512 VBMI指令集的x86-64处理器上，ARM64平台不受影响。初步研判认为，全球范围金融、航空、电信、政务等关键行业受影响的Java应用数量庞大。\n\n　　5、技术细节已公开，漏洞利用风险上升。相关漏洞由安全研究机构Calif借助AI辅助发现，其研究人员用时约1小时完成漏洞定位、2小时写出漏洞利用代码。目前漏洞触发/复现PoC已经公开，虽然暂未发现漏洞公开利用情况，但随着针对具体Java应用的利用链被逐步发现，短期内出现规模化攻击的风险较高。\n\n　　二、Java4Shell风险防范建议\n\n　　1、全面排查资产暴露面。对本行业/单位所有运行Java的系统进行清点，核对厂商与完整构建版本，重点排查对公网或跨网络暴露的服务(如Jira、Jenkins、Keycloak、Confluence等)，识别第三方产品、设备和容器中内置的Java组件。\n\n　　2、及时升级版本。通过可信来源获取并安装官方修复版本，将Java SE 17/21/25/27升级至17.0.21.1、21.0.13.1、25.0.5.1、27.0.1.1，Oracle Java 8 performance Pack 升级至8u513-perf，GraalVM应用Oracle 2026年11月关键补丁更新中的对应补丁，其他发行版参照各自安全公告。升级后重启所有相关Java进程，确保容器镜像和内置运行时同步更新。\n\n　　3、启用临时缓解措施。对暂时无法升级的x86-64环境，可通过为JVM增加启动参数-XX:-UseBASE64Intrinsics禁用硬件加速的Base64编解码，或增加-XX:UseAVX=2禁用AVX-512执行路径。需要注意的是，ARM64原生JVM不识别-XX:UseAVX=2参数，传入将导致JVM无法启动，应严格限定在x86环境使用。\n\n　　4、做好网络隔离措施。在补丁部署前，临时限制对互联网暴露的Java管理控制台的外部访问，做好网络隔离、身份认证加固和访问控制，限制Java进程向不可信服务器发起TLS连接。\n\n　　5、强化网络安全监测。持续关注OpenJDK及各发行版安全公告，实时监测Web、应用、认证与终端日志中的可疑活动，重点关注JVM崩溃日志、异常重启、认证头长度异常的base64、异常子进程和出站连接，做好日志留存和应急处置，严防发生重大网络和数据安全事件。 【编辑:叶攀】",

          "body": "1989年港姐亞軍朱潔儀（Donna）近日作客由伍詠薇（伍姑娘）與李凱賢（Brian）主持的HOY TV節目《九運會客室2》。現年59歲、保養得宜的朱潔儀，在節目中與同是選美出身的伍詠薇大談昔日選美及拍戲秘聞，剖白入行多年鮮有緋聞的原因，更獲堪輿學家唐碧霞師傅即場批算八字，揭開單身多年的謎底。\n朱潔儀曾獲男主角贈「全家之寶」示愛\n伍詠薇問到朱潔儀入行多年鮮有緋聞，是否因為「收得密」或無人追求。朱潔儀澄清自己不乏追求者，更透露初入行時曾遇過大製作的男主角主動獻殷勤。對方當時向她示愛，更送上一個宣稱是「由細戴到大、全家之寶」的護身符。自認性格謹慎且有些「遲鈍」的朱潔儀，笑稱當時接收不到追求信號，僅因覺得禮物太貴重和古舊而婉拒退還。\n朱潔儀笑指男方曾主動約放假睇電影：「咁我又get唔到，同埋以前其實係，開06去到深夜2、3點，我真係好需要睡眠。（你隔咗幾年先知原來佢追你？）即係之後諗下。（你對佢有無興趣？）有興趣，瞓少兩粒鐘都去啦。」\n相關閱讀：56歲前港姐朱潔儀近照容貌離奇極繃緊！淡出幕前多年 曾狠批師妹馮盈盈肉酸\n朱潔儀要求極高 難忍男方大聲呵斥\n朱潔儀自言因處女座性格，對伴侶要求極高，追求完美、溝通與上進心。她坦言自己在感情中若被大聲呵斥或責罵，會感到委屈落淚，因此選擇對象時分外謹慎，因而錯失了不少發展機會。\n同場的唐碧霞師傅從八字角度分析，指朱潔儀的八字桃花星非常強，身邊出現的男士多為其「貴人」，條件非凡，所以富二代、名門公子的追求從未間斷。不過，朱潔儀單身至今，全因命格中存在兩大障礙：一是容易陷入三角關係的「姊妹爭夫」格；二是具戲劇性的「貌貴合而不發，必嫁白頭郎」命格。\n唐碧霞師傅直言，朱潔儀若配對傳統的「正常姻緣」極難開花結果，必須尋求「不正常姻緣」方可化解。所謂的「不正常姻緣」，是指對方曾結婚或離婚、年齡比朱潔儀大十年或以上（或相反地比她年輕很多），又或是異地姻緣。\n相關閱讀：九運會客室2本周預告丨伍詠薇爆遭舊愛痛打 剖白21歲新婚喪夫歲月 馬賽細談不雅片風波\n朱潔儀出生自選美世家\n除了感情世界，朱潔儀亦分享了參選港姐的趣事。她透露自己從小愛美，但朱母卻不覺得女兒漂亮，更常拿親戚作比較：「好多親戚都靚過你」。原來朱母有親戚早年曾參選港姐並打入準決賽，足見家族基因優良。\n朱潔儀當年打算參選時，曾被母親潑冷水：「人哋都唔得，你點會得呀？」母親又擔心她落選會「好肉酸」；相反父親卻大力支持，鼓勵她嘗試及學習新事物。當時仍在大專讀一年級、兼職做模特兒的朱潔儀，最後在父親支持和家姐提名下參選。比賽期間，她曾收到佳麗電話，聲稱已有內定得獎者並勸她退出。不過朱潔儀未有理會，最終順利奪得1989年香港小姐亞軍。\n朱潔儀重排同屆港姐三甲：自己擺第一\n朱潔儀直言：「每個女仔都有冠軍夢想，如果嘛，咁……我覺得任何人，女仔啦，都有個夢想㗎嘛，可能夢想做冠軍呀，係咪先？」主持李凱賢問到，若有機會重新排名，會否將自己擺在第一名，朱潔儀毫不猶豫承認：「係呀！係呀！」至於亞、季軍人選，她笑言會將順序往後移：「之前冠軍就擺亞軍，跟住第三唔變咁囉。」（註：1989年港姐冠軍為陳法蓉、季軍為梁佩瑚。）\n相關閱讀：港姐朱潔儀狂晒淺水灣逾千呎豪宅 擁兩無敵海景花園設巨型噴水池歐式古典裝潢超有氣派",

          "body": "当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者参与的调查显示，超半数(52.2%)受访者表示为AI花过钱，知识处理(59.1%)、多媒体创作(53.3%)、办公学习(44.1%)是受访者常用AI做的事。\r\n\n　　自从使用AI办公后，来自深圳的35岁黄鹂觉得自己的工作效率有了很大提高，原来可能要做一整天的方案，如今在AI的加持下两到三小时就能完成。在她看来，为AI付费是对自己的一种“投资”。“如果你愿意付费深度学习、使用AI工具，它能提高你的工作效率，也能提升个人能力。”\n\n　　调查显示，超半数(52.2%)受访者为AI花过钱。交叉分析发现，受访90后的这一比例更高，为61.4%。然后是00后(58.3%)、95后(53.6%)。男性受访者(53.2%)的这一比例高于女性受访者(51.4%)。从地区来看，一线城市受访者的这一比例更高，为58.1%，然后是二线城市(51.7%)、三四线城市(51.1%)。\n\n　　来自上海的在读研究生王明远，从今年8月底开始为AI付费。“感觉学习效率提升了，对求职也有很大帮助。”\n\n　　王明远表示，互联网时代获取知识容易，但缺少一个可以随时提问的导师，“AI可以充当这个角色。”从课程知识学习、作业指导到简历项目设计，他用AI构建了一个24小时在线的私人导师。“我有很多问题可以问AI，它能指导我的成长。”\n\n　　来自深圳的37岁林子侨是一名游戏行业的从业者，最近他正和朋友一起创作一部AI短剧。为了达到更好的艺术效果，今年9月，他果断为AI掏出钱包。“我们有分工，朋友是编剧，用AI做视频我是自学的。”\n\n　　林子侨表示，免费模型在画面精度和语义理解上不够好，每次都要花大量时间后期修补。如今，他每月在续卡、买积分上的花费在2000元左右，调用的模型也越来越高级。“AI生成视频的成本虽有些高，但比自己拍片子的成本低。”在他看来，这笔钱买的是把创意直接变成画面的能力。\n\n　　大家会为什么样的AI服务付费？数据显示，49.2%的受访者会为更聪明的模型付费；48.4%的受访者会为多模态AI付费，生图、视频、语音更好用；46.7%的受访者是为了省时间，写稿、做表、出方案更快。其他还有：不卡额度，额度丰富够调用(28.2%)；懒得折腾，一个会员全平台通吃最省心(20.6%)等。\n\n　　90后原田在苏州做生产管理，下班后她还有另一个身份——短视频博主。她用AI生成脚本、画面、配音、剪辑，整个流程几乎不需要人工介入。“以前我试着学过剪辑，学着学着就放弃了，现在有想法直接就能成片。以前得几个人干的活，现在我下班回来一个人就做完了。”\n\n　　之前原田一直用免费版的AI工具，但发现废片率高、画质不够清晰，为AI付费之后，她明显感觉“快”了，并且能调用更好的模型。“现在几分钟就能生成能用的素材。”\n\n　　大家平时用AI做什么？调查中，查资料/翻译/解题/写代码等知识处理(59.1%)、生图/修图/剪视频/做AI短片等多媒体创作(53.3%)、写稿/周报/PPT/邮件等办公学习产出(44.1%)位列前三。其他还有：写小说/写歌/写段子/等文艺脑洞(27.7%)；闲聊/情感陪伴/角色扮演等日常互动(27.1%)；投喂资料做个人知识库/智能体训练(15.5%)等。\n\n　　来自河南郑州的85后网店主张龙，把AI当成了自己的“员工”，用AI生图、写文案、翻译，AI的出现让他解锁了很多技能。他的电脑里，整齐排列着一周的社交媒体发布包——文案、配图、标签全部由AI生成，他只需手动上传。“像美工、运营、剪辑、拍摄，以前至少需要一个团队，现在我一个人加AI就能搞定。”张龙说。\n\n　　受访者中，05后占3.2%，00后占22.6%，95后占20.7%，90后占25.4%，85后占13.2%，80后占11.2%，其他占3.7%。男性占47.6%，女性占52.4%。来自一线城市的占38.1%，二线城市的占35.7%，三四线城市的占19.8%，县城或城镇的占5.1%，农村的占1.3%。\n\n　　(应受访者要求，张龙为化名)\n\n　　中青报·中青网记者 吴欣宇 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:梁异】",

          "summary": "近40歲的秀蘭，在中學時期因為要面對讀書，及朋輩相處帶來的壓力而患上抑鬱症，情緒經常在低落及高漲兩個極端之間轉換，後來更演變成思覺失調。秀蘭說︰「其實我小時候也是在一個一般的家庭長大，有朋友、有興趣，喜歡畫畫，一直都很平穩。",

          "body": "情緒起落大，經常疑神疑鬼，甚至產生例如幻聽、幻視等，脫離現實的知覺問題，這些都是抑鬱症引發思覺失調常見的病徵。除了靠藥物控制病情，亦會用到心理治療作輔助工具。\n\n根據醫管局的統計數字，香港現在有約五萬個思覺失調病人。除了遺傳因素，其他因素，例如濫用藥物有機會引發遺傳因子，另外壓力大更是最主要，引致病發的因素之一。\n\n近40歲的秀蘭，在中學時期因為要面對讀書，及朋輩相處帶來的壓力，而患上抑鬱症。期間因自行停藥，之後更演變成思覺失調。她甚至曾將同學視作會害她的人，因此而逃課。\n\n秀蘭稱：「我有一個同學，我只見到他，沒甚麼特別，但我會套上他是聖經人物，在《聖經》描述他很惡毒的一個人，我覺得是那個同學，我很害怕他，又不敢上學，自己走了回內地。」\n\n思覺失調的患者有機會有幻聽、幻覺，完全分不清現實及幻想兩個世界。\n\n精神科專科醫生王明爍指出：「如果沒有藥物時，很大機會會復發，我們見到很多第一次病發的病人，治好後如果不服藥，其實兩年內大部分病人都會復發。如果發病多過一次的病人，停藥後兩年，差不多九成病人都會復發。」\n\n除了藥物治療，治療方案亦有機會，有臨床心理學家的參與，以引導患者理解及處理自己的情緒。\n\n臨床心理學家江偉賢稱：「我們要讓他感覺到他裡面的情緒，他裡面有些困難、痛苦，是可以應對的，那些妄念是真還是假，不需要擔心這部分。當有了這個好的關係時，很多時候我們跟他說的話，他會很容易聽。」\n\n一般思覺失調患者發病後，經過適當的藥物治療，通常於數星期至數個月內，可以穩定病情，但擅自停藥會增加復發風險，而且每次發病時都會令大腦萎縮，對腦部造成不可逆轉的損傷。\n\n點擊觀看節目重溫",

          "body": "国家文物局昨天(18日)发布了长江文明溯源最新考古成果，分别是四川遂宁桃花河遗址、浙江杭州良渚反山遗址、江西九江荞麦岭遗址群岭头上遗址、湖北云梦老虎墩墓地。\n\n　　从30万年前古人类生活营地，到五千年前良渚高等级礼仪院落，再到夏商周文化交融聚落、秦汉简牍出土墓地，这些出土遗迹、石器、简牍究竟揭开了哪些历史谜题？又为实证中华文明多元一体带来哪些全新线索？\n\n　　四川遂宁桃花河遗址\n\n　　四川遂宁的桃花河遗址坐落在涪江中上游，包含鄢家沟、田家湾两处地点，总面积大约19万平方米，主体年代距今30万年到5万年。考古人员在这里发掘了1.3万余件石制品以及179件动物化石，还发现大量碎屑和人工搬运砾石，找到了砾石铺设活动面、石器集中贮藏区、石器加工场等遗迹。四川大学历史文化学院院长吕红亮说，桃花河遗址是长江流域迄今发现遗物最密集的中更新世旷野中心营地，极具特色的定型化大石片砍斫器工业、复杂的营地组织形态与空间规划能力，对研究全球早期人类演化具有重要意义。\r\n\n　　四川大学历史文化学院院长 吕红亮：桃花河遗址的时间节点非常有意思，30万年到5万年，这是在古人类研究里面非常敏感的一个时间段。另外它出土的石器非常有特点，而且密度很高，这在全世界都是比较罕见的。第三是它发现了一些可能的人类活动遗迹，这也是比较少见的。我们以前发现的人类活动遗迹相对来说都是旧石器时代晚期的，它早的这么一个时代，对全世界旧石器的考古研究来说是一个新的纪录。\n\n　　浙江杭州良渚反山遗址\n\n　　浙江杭州良渚反山遗址是已知良渚文化等级最高的贵族墓地。2024年开启的系统性发掘带来重要突破：考古工作者发现反山不只是一处单纯的墓葬土墩，它以土墩为中心，外围建有院墙，构成一座略呈长方形的独立院落，围护面积约2.5万平方米。浙江省文物考古研究所良渚遗址考古项目负责人王宁远介绍，院墙、台基及建筑遗迹的发现，揭示了墓葬区、礼仪活动空间与外围围护设施相结合的整体布局，为探讨良渚古国王权的礼仪性表达和制度化发展，提供了新的考古证据。\n\n　　浙江省文物考古研究所良渚遗址考古项目负责人 王宁远：良渚古城是不同来源的社群聚合而成的地缘社会，意味着社会组织和制度的全新建构。反山的发现，从聚落结构角度为这一变革提供了生动的例证：反山院墙以及东部建筑遗迹的发现，突破反山作为单纯土墩墓地的传统认识，表示当时已经形成与丧葬相关的稳定的规制。成组院落或分别对应不同的人群，为研究良渚古城社会组织和人群关系提供重要线索。反山王陵与土垄的结构性关联，证实了良渚古城与水利系统是统一规划建设的整体设施，它是社会权力、信仰与大型水利工程深度结合的物化体现。由此说明治水立国的东方文明理念，早在大禹治水传说之前一千年就已经在良渚地区成功实践。\n\n　　江西九江荞麦岭遗址群岭头上遗址\n\n　　江西九江的荞麦岭遗址群是一处大型先秦聚落遗址群，岭头上遗址是其中面积最大的墩台之一，总面积约6万平方米。考古在这里发现新石器时代晚期墓葬、玉石器加工遗存；也发现早商时期的居址、青铜冶炼遗存，出土坩埚、炉壁残块、铜渣、铜块等遗物。江西省文物考古研究院副研究馆员饶华松表示，这个遗址位于长江中下游的过渡地带，遗址内新石器时代晚期及早商时期的聚落文化因素多元，反映出长江中下游文化传播、互动交融频繁，揭示了中原与长江中游地区文化交流与资源开发控制的密切关系。\n\n　　江西省文物考古研究院副研究馆员 饶华松：荞麦岭遗址群岭头上遗址地处长江中游和下游与中原之间的地理关键节点，这里连接东西沟通南北，兼有多种文化因素，自新石器晚期直到商代的文化发展展现了显著的文化交汇的特征，既有皖、鄂、赣交界期的自身文化发展主线，也可见长江中游、下游文化的较强的影响。商代早期更是融入到中原文化的一体化浪潮中，是研究中原与南方长江中游和下游文化交流互动的难得材料，是认识中华文明多元进程的重要实证。\n\n　　湖北云梦老虎墩墓地\n\n　　湖北云梦老虎墩墓地属于战国晚期至西汉初期墓地。2026年考古发掘一共清理秦汉墓葬113座，其中40座是饱水墓葬，出土漆木、陶器、金属、玉器以及简牍等各类随葬品1200余件(套)。北京大学中国古代史研究中心教授朱凤瀚表示，老虎墩墓地是目前出土秦简最集中的墓地，所获材料涉及政治、军事、文学、医学、民俗学、艺术等领域，为研究秦汉大一统王朝历史进程以及基层社会治理模式提供了最新史料。\n\n　　北京大学中国古代史研究中心教授 朱凤瀚：从出土器物来看，它很好地体现了秦文化和楚文化的融合。同一座墓葬当中既有秦式器，还有楚式器物，很好地体现了秦、楚两种文化的交融。从人群角度来说，这里也见证了秦汉之际人群的融合，一部分秦国的官吏、士兵南下，这个墓地可以说是中华民族形成的一个缩影，从墓葬制度、随葬器物的制度、形制上很好地体现了这一点。\n\n　　从几十万年前古人类营建的旷野中心营地，到良渚时期统一规划的都邑、水利、高等级墓葬体系，再到夏商阶段南北之间的文化往来、资源互动，直至秦汉大一统之下地域文化交融共生，长江流域这四项考古成果，进一步补全了中华文明漫长的发展链条。接下来，考古团队还将开展多学科综合研究，持续挖掘出土遗迹遗物背后蕴藏的历史信息，为实证中华文明百万年人类史、五千多年文明史提供更多实物支撑。\n\n　　监制丨樊新征\n\n　　记者丨韩萌 【编辑:梁异】",

          "title": "词元作为数字商品进入大众消费 专家建议：统一计量口径守护AI消费权益",

          "body": "今年“双十一”，Token首次以独立品类摆上电商货架，“囤Token”成为热词。\n\n　　Token中文名为“词元”，是大模型处理文本的最小单位，用AI写文案、做PPT、生成图片视频都在消耗它。厂商按量计费，输入输出都计费，但对普通用户来说，这个单位几乎不可感知：100万Token值多少钱，很难换算。于是不少平台把它“翻译”成积分或会员。\n\n　　有业内人士指出，词元作为数字商品进入大众消费后，仍面临计量、定价、安全、合规等多重课题：同一段文字在不同模型中消耗的词元可能相差两至五成，计费规则不一、套餐难以换算、未用完的额度如何处理、发生争议找谁，相关规则仍待厘清。\n\n　　围绕上述问题，《法治日报》记者采访了西南政法大学民商法学院教授张力和中国人民大学法学院副教授、法律科技与社会治理实验室副主任黄尹旭。\r\n\n　　囤词元系预付式消费\n\n　　记者：消费者“囤”的Token，买到的究竟是什么？\n\n　　张力：从法律性质看，单个Token不构成独立的物。Token套餐是经营者以预收款方式提供的数字服务，属于预付式消费。消费者预先支付价款，取得按Token计量的服务额度，未使用部分对应尚未消费的预付款，属于消费者的财产利益。\n\n　　记者：购买Token后，页面往往只显示“剩余额度”“剩余次数”，一次用掉多少、怎么扣费看不明白。账单看不懂、对不上，该找谁？\n\n　　张力：Token并非统一、中立的计量单位，而由各服务商自定义。消费者按Token付费，却无法预先确知某次使用消耗多少，也难以仅凭数量在不同套餐间比较。名义价格与实际消耗可能不对应，这正是“看不懂账”的根源。\n\n　　计量单位、计费口径、单价、单次消耗与余额变动，均属与消费者有重大利害关系的信息。经营者仅显示概括余额而不提供可供核验的明细，属于信息披露不充分。\n\n　　消费者首先可要求服务商提供用量明细。服务商拒绝或无法说明的，消费者可向市场监管部门投诉，或申请仲裁、提起诉讼。依据《最高人民法院关于民事诉讼证据的若干规定》，一方当事人控制证据无正当理由拒不提交，对待证事实负有举证责任的当事人主张该证据的内容不利于控制人的，人民法院可以认定该主张成立。服务商不提供明细，可能承担不利后果。\n\n　　黄尹旭：过去Token服务面向开发者，用量查询嵌入技术后台是行业惯例；转向大众零售后，数据打通、账单通俗化改造都需要时间。目前多数消费者还需跳转服务商后台查看明细。账单存疑，可先找服务商核对，协商不成再向平台投诉。\n\n　　出现争议应如何维权\n\n　　记者：打开一个Token商品，页面通常是几档套餐：有按用量计价的单项包，也有标着“赠送额度”的组合套餐，不少还写着“限时有效”“未用完不退”。对于消费者来说，付款前需要留意哪些内容？\n\n　　张力：关于“赠送额度”，若赠送额度真实无偿，其未使用部分原则上不产生退款请求权；但若实为套餐定价组成部分、仅以赠送名义标示，则属于误导性价格标示，涉嫌违反价格欺诈禁止规定。\n\n　　关于“限时有效”，预付款设定有效期并非当然违法，但有效期条款属格式条款；期限明显过短，或到期后余额一律作废、不予延期或退还的，可能排除消费者主要权利，依据民法典第四百九十七条和消费者权益保护法第二十六条，该条款无效。\n\n　　关于“未用完不退”，尚未消费部分属消费者预付资金，经营者不能以格式条款一概排除返还请求权。任何情形下均不退还余额的条款效力存疑。消费者因经营者违约、停业解除合同的，仍有权请求退还剩余额度。\n\n　　记者：对于Token这种“看得见摸不着”的数字商品，平台和AI服务商应各自承担怎样的安全保障义务？\n\n　　黄尹旭：Token作为新型数字商品，其安全保障义务边界仍在法律与实践探索之中，很难用现有标准要求某一方承担无限责任，更务实的原则是“法定底线守牢，延伸责任逐步探索”。\n\n　　张力：AI服务商作为直接提供者，依据消费者权益保护法，应保证服务符合保障财产安全的要求：保障账户与额度安全、防止盗用，保障服务连续稳定、避免中断造成额度损失，保障计量准确并保存记录；同时，依据个人信息保护法、网络安全法、数据安全法，对输入内容承担数据安全义务并明示规则。\n\n　　关于平台责任，依据电子商务法和消费者权益保护法，需核验入驻主体信息，在发生争议时提供经营者真实名称、地址和联系方式；不能提供的，消费者可要求平台赔偿；平台作出更有利于消费者承诺的，应当履行；知道或应当知道服务商侵权而未采取必要措施的，依法承担连带责任。\n\n　　计量口径有待标准化\n\n　　记者：从长远看，要让Token真正成为“买得放心、用得明白”的消费品，最关键要建立哪些制度或标准？\n\n　　黄尹旭：平台和商户当下即可先行探索：在商品详情页显著位置展示计量规则、有效期、退款政策、明细查询方式，把用户协议里的关键内容摆到台面上。\n\n　　张力：一是计量口径标准化，用国家标准、行业标准或团体标准统一Token定义、分词规则与计费口径，使输入、输出、系统提示、缓存等项目口径一致、价格可比。\n\n　　二是强制信息披露，公示单价、口径、有效期与退款规则，提供可核验明细。\n\n　　三是预付款资金监管，对预收资金实行存管或担保，防范挪用、停业失联造成余额损失。\n\n　　四是格式条款效力审查，明确“过期作废”“概不退换”等条款边界。\n\n　　五是平台主体责任，明确资质审核、信息披露与争议处置义务。\n\n　　六是第三方计量核验，建立符合性评价机制，为举证和执法提供技术支撑。Token计量不属于计量法调整的法定计量范畴，不能靠计量器具强制检定解决，但可借各类标准统一分词规则与计费口径。\n\n　　记者：统一计量口径、引入第三方核验，落到普通消费者身上，能解决什么问题？\n\n　　张力：这一步解决两个问题。其一，可验证性。口径公开、明细可获取后，消费者或其委托的第三方可自行复核账单，争议处理不再完全依赖经营者单方陈述。\n\n　　其二，可追责性。第三方核验通过认证与持续审计，将虚标额度转化为可识别、可追究的违约或违法事实，提高违法成本，为索赔提供证据基础。第三方核验不能绝对消除虚标，其作用在于降低信息不对称，而非替代监管追责。\n\n　　黄尹旭：统一计量口径，本质是给消费者一把通用的“公平秤”，也是以规则守护AI消费权益的体现。如买电用“度”、买流量用“GB”，无需逐一换算Token，比价对账才有据。第三方核验针对商家记账、消费者无从核验的信息不对称问题，既能约束商家、减少虚标多扣，也可提供中立维权依据。(记者 赵丽) 【编辑:曲克】",

          "body": "中新网11月19日电 据“平武发布”微信公众号消息，四川省绵阳市平武县市场监督管理局18日发布情况通报，2026年11月17日，有网友反映平武县某民宿提供的烤全羊分量不足，引发网民关注。对此，平武县市场监督管理局高度重视，成立工作组第一时间开展核查处置。现将有关情况通报如下。\n\n　　一、事件概况\n\n　　2026年11月11日，游客一行在该民宿食宿，通过微信预订烤全羊一只。用餐时，游客认为“烤羊有点小、肉太少、全是骨架”。11月17日下午，平武县市场监督管理局收到该网络反映，及时组织双方开展调解，双方已就赔付事宜达成一致意见。\n\n　　二、核查情况\n\n　　11月17至18日，平武县市场监督管理局执法人员在涉事民宿开展实地调查核实，并邀请人大代表、政协委员、游客代表到场全程监督。\n\n　　经现场核实并询问双方当事人，当日经营者未留存该烤全羊称重凭证，仅以口头方式和消费者沟通重量，调查时距离事发已间隔6日，现有证据难以核实实际重量，平武县市场监督管理局以视频作为参考，疑似存在缺斤少两问题。同时，经现场调查发现，该民宿店内未公示菜品价格，存在“未明码标价”问题。\n\n　　经查，该民宿涉嫌违反《中华人民共和国消费者权益保护法》《中华人民共和国价格法》相关规定。平武县市场监督管理局已对该民宿立案调查，并将根据后续调查情况依法依规严肃处理，坚决维护市场经营秩序，切实保障消费者合法权益。\n\n图片来源：“平武发布”微信公众号截图\n\n 【编辑:曹子健】",

          "size": 1,
          "keywords": [],
          "body": "​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台，聯同投資推廣署和香港貿易發展局（貿發局），以及香港科技園公司，在芬蘭赫爾辛基舉行的Slush 2026上，舉辦題為「下一站亞洲：透過香港拓展創科業務」的研討會，介紹香港的創新科技（創科）發展，以及香港為有意拓展亞洲市場的北歐初創企業提供的機遇。\n\n　　駐倫敦經貿辦處長周雪梅在研討會上致辭，介紹香港為北歐企業拓展亞洲市場的重要平台。她表示，香港匯聚國際人才、科技和資本，並協助企業把握中國內地，特別是粵港澳大灣區（大灣區）和其他亞洲市場的發展機遇。\n\n　　周雪梅亦介紹在《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》下，香港發展成為國際創科中心的願景。她指出，香港正積極推進「三大創科園區、五大研發機構」的建設，並投放大量資源，進一步完善創科生態圈，加快科研成果轉化，開拓更多商業機遇。\n\n　　她亦介紹北部都會區，指出這項重大發展計劃將為創新發展和跨境合作帶來新機遇。她指出，區內的河套深港科技創新合作區香港園區——港深創新及科技園（港深創科園）和新田科技城相互配合，推動研發、成果轉化及產業發展。她亦介紹港深創科園與毗鄰深圳園區所採用的「一河兩岸、一區兩園」獨特跨境合作模式。這個模式為北歐企業提供良機，讓它們在香港設立據點，善用香港「一國兩制」下的獨特優勢，與香港及深圳的科研機構和創科夥伴合作，並充分利用大灣區的科技和製造業資源。\n\n　　投資推廣署創新及科技，生命與健康科學總裁黃煒卓亦於研討會上以「香港作為通往中國及更廣泛亞洲地區商機的門戶（從科技創投角度出發）」為題發表演講。另外，貿發局、香港科技園公司及兩間北歐企業代表在爐邊對談環節中，分享他們對香港創科領域的最新發展、海外企業可把握的機遇，以及行業未來發展前景的見解。講者亦結合自身經驗和專業知識，探討北歐初創企業進軍香港市場、尋找合適合作夥伴，以及進一步拓展亞洲市場時需要考慮的實際因素。\n\n　　駐倫敦經貿辦會繼續與投資推廣署、貿發局及香港科技園公司緊密合作，推廣香港的創科發展，促進香港與北歐創科企業之間的合作。\n\n　　Slush是年度的全球初創盛會，在赫爾辛基舉行，匯聚來自世界各地初創企業創辦人、投資者及科技與創業生態圈的其他成員，為參與者提供交流經驗，以及與潛在投資者及商業夥伴建立聯繫的平台。",

          "body": "​以下是政務司司長陳國基今日（十一月十八日）在立法會會議上根據《基本法》第七十三條第（七）項及《香港終審法院條例》第7A條動議有關委任香港終審法院的其他普通法適用地區法官的擬議決議案的總結發言：\n\n主席：\n\n　　我衷心感謝剛才四位議員就任命終審法院其他普通法適用地區非常任法官提出的寶貴意見，也多謝各位議員支持任命區諾德爵士。\n\n香港的國際法律中心地位\n\n　　香港的國際法律中心地位，在國家「十五五」規劃得到明確支持，而《香港第一個五年規劃》其中一個主要目標，是善用普通法制度獨特優勢，深化國際法律中心地位。\n\n　　區諾德爵士與其他在任的終審法院非常任普通法法官一樣，都是享負盛名的普通法專家。委任這些傑出的海外法官，讓他們參與終審法院聆訊的工作，充分顯示他們對香‍港司法制度及司法獨立的信心，亦促進不同司法管轄區法官的相互交流、互相啓發、精益求精，實實在在發揮香港在「一國兩制」下作為國家唯一普通法管轄區的優勢。\n\n　　我們要積極向外宣揚香港這優點。特區政府也在持續做這方面的推廣。\n\n　　律政司本月初舉行的年度旗艦盛事香港法律周，正正向國際法律界人士展現香港作為國際法律樞紐的領導地位。隨着國際統一私法協會亞太聯絡辦公室在香港開幕，「國際私法三姊妹」，即國際統一私法協會、海牙國際私法會議，以及聯合國國際貿易法委員會都已全數落戶香港，加上其他國際組織，例如國際調解院的成立，充分彰顯國際社會對香港法治的高度信賴。而我們今次再度任命海外資深法官加入終審法院，亦一再證明了國際法律界對香港特區司法制度與法治質素的高度認可與信任。\n\n法官的來源\n\n　　我很多謝何君堯議員剛才提到是否可以任命來自更多普通法適用地區的法官。\n\n　　《基本法》第82條和《香港終審法院條例》第‍5（3）條規定：終審法院可按需要邀請其他普通法適用地區的法官參‍加終審法院的審判。《香港終審法院條例》亦規定：在聆‍訊及裁決上訴案件的終審法院法官當中，必須包括一名非常任法‍官。根據《香港終審法院條例》的規定挑選及邀請非常任法‍官參與聆訊，實屬行使《基本法》所賦予獨立司法權力的其中一環。\n\n　　一直以來，司法機構都是按《基本法》的規定，根據法官本人的司法和專業才能，從本地及其他普通法適用地區考慮聘用個別人士到終審法院服務。現‍時，終審法院共有九名非常任法官，包括四名非常任香港法官和五名非常任普通法法官，他們來自英國、澳洲和新西蘭，在這些地方具備豐富的司法履歷及經驗，專業地位和聲譽崇高。在唯才是用的大前提下，如有具備頂尖優秀司法和專業才能的合適人選，來自其他普通法適用地區的法官亦會獲考慮。司法機構會繼續留意終審法院的運作需要，並在適當時候向獨立的司法人員推薦委員會作出建議。\n\n獨立的司法制度\n\n　　司法機構一直致力維護香港的法治精神，以及受《基本法》保‍障的獨立司法制度。法官和司法人員的憲制職責，是在行使其司法權力時，須獨立和專業地以法律和證‍據為依據，以無懼、無偏、無私、無欺之精‍神，嚴格根據法律原則，維持司法公義。經過多年來的實踐，終審法院已在國際上確立堅實的地位，成為普通法世界中頂尖卓越的最終上訴法‍院；當中，一眾非常任普通法法官的卓越貢獻，是廣獲認同的。\n\n結語\n\n　　主席，終審法院審理的案件涉及不同的法律範疇，非常任普通法法官過去參與審理的案件包括：刑事法、民事實務及程‍序、行政法、仲裁、商業法、土地法、稅務法等等。多年來，這些海外法官對香港維持高水平的司法制度和鞏固本港司法體系高度國際化的優勢，貢獻良多。\n\n　　區諾德爵士在國際司法界地位崇高，其專業造詣與聲望橫跨眾多法律領域。特區政府同意司法人員推薦委員會的建議，並相信這項任命將使終審法院的非常任法官陣容更為堅實，維持終審法院的最高司法水平。\n\n　　我懇請各位議員同意這項任命。多謝主席。",

          "summary_short": "設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。",

          "body": "設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。連同城區活動「設計@HKG」2026及「deTour 2026設計節」，這四項由文化體育及旅遊局轄下文創產業發展處資助的大型設計主題活動由即日至十一月二十九日先後或同期在香港舉行，匯聚本地及國際設計師、創意領袖、企業及品牌，為香港注入國際創意力量，將多元創意體驗帶進社區不同角落。\n\n  文化體育及旅遊局局長羅淑佩今日出席設計營商周2026開幕典禮及DesignInspire創意設計博覽交流酒會時表示，兩項活動均展現香港在連繫全球創意人才、促進跨文化交流及商業協作方面的獨特優勢。政府將繼續推動設計及創意產業發展，進一步鞏固香港作為中外文化藝術交流中心的地位。\n\n  設計營商周由香港設計中心主辦，並由瑞士擔任今屆峰會的夥伴國家。活動以「設計共話：從連繫到蛻變」為主題，匯聚超過60位來自瑞士、捷克、韓國、德國等地，以及中國內地和香港的創意領袖與商業決策者，今日起一連三日圍繞多個關鍵議題展開深入討論。\n\n  由香港貿易發展局主辦的DesignInspire創意設計博覽今日至十一月二十一日舉行。今屆展會以「Wander & Wonder」為主題，匯聚來自17個國家及地區、超過200個參展商，透過展覽、講座、工作坊及商業對接活動等，以設計串連文化、產業與日常生活，連結設計師、品牌、買家、設計愛好者及公眾。焦點節目包括由香港藝術家策劃的「Cabinets of Wonders」、由瑞士設計工作室創作的「Breathing in Motion」、由米蘭國際家具展Salone del Mobile.Milano呈獻的「ABITO/HK」以及由香港燈光設計師和室內設計師策劃的「House of Lumière」。\n\n  此外，香港設計中心今晚於DX設計館舉辦「炫彩香港」活動，慶祝DX設計館成立兩周年並為七個新展覽開幕。文創產業專員黎細明出席開幕儀式。\n\n  各項活動為業界和廣大市民帶來一場全城設計盛會，也匯聚香港及國際創意人才與資源，促進跨界別和跨文化交流，推動香港成為亞洲創意之都。所有公眾展覽均免費入場，歡迎市民親臨參觀，更多有關活動的資訊，請瀏覽以下網頁：\n\n設計營商周：2026.bodw.com/zh-hk\n\n設計@HKG：designathkg.com/zh\n\nDesignInspire：designinspire.hktdc.com/tc\n\ndeTour 2026設計節（十一月二十日開幕）：main.detour.hk/zh-hk\n\n炫彩香港： www.hkdesigncentre.org/tc",

          "body": "食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮獲金獎和銅獎。\n\n　　獲得金獎的觀塘區鯉魚門（嶺南新村）公廁採用了「廁世代PT 2.0．公廁設計比賽」的得獎設計概念，以「管水母」為靈感，透過靈活組合的模組化結構，完美配合不同地形和環境，將創意融入公共設施中。該公廁貫徹「以人為本」的設計理念，內部空間寬敞，並設有配備自動門的暢通易達洗手間和通用洗手間；公廁外亦設有飲水機，方便市民和旅客使用。公廁亦已裝設智能監察系統，實時監測異味並自動通報，提升衞生水平和管理效率，並透過非接觸式意見回饋系統，收集使用者的意見，作為改善服務和未來規劃的參考。此外，其暢通易達洗手間更設有智能意外感應系統，偵測跌倒和異常停留情況，以便適時提供協助。\n\n　　至於獲得銅獎的南區香港仔大道公廁，翻新後以溫暖的大地色系配搭簡潔俐落的線條設計，展現獨特的現代美學。該公廁內設有供兒童和長者使用的設施，照顧不同年齡使用者的需要。\n\n　　發言人說：「食環署一直採取多管齊下的方式，包括引入新科技，提升轄下公廁的設施、管理和衞生水平，並在設計上照顧不同使用者的需要。食環署轄下公廁屢獲殊榮，反映署方持續提升公廁服務的工作得到肯定，值得鼓舞。要長期保持公廁乾淨舒適，亦有賴前線人員用心清潔和管理，署方感謝他們的努力和貢獻。」\n\n　　食環署早前已留意到荃灣區柴灣角公廁內部分位置傳出異味，並即時通知相關部門安排維修。署方已在公廁附近加設流動廁所，並會在公廁維修工程完成前加強流動廁所的清潔工作，同時要求相關部門加快維修損壞的設施。此外，為改善大橋村公廁和通州街公廁的設施，食環署已將兩間公廁納入翻新計劃，除了要求承辦商加強清潔工作，亦會密切監察承辦商的服務表現。\n\n　　現時，食環署管理逾800所公廁，近年積極夥拍建築署推展優化公廁翻新計劃。在2019年推行該計劃前，約有110所公廁已率先展開翻新。在計劃涵蓋其餘約700所公廁中，目前已有近八成半展開工程，其中逾250所的工程已順利竣工。署方目標在2028年年底前，全面為餘下約110所公廁開展翻新工程。\n\n　　採納香港城市大學顧問報告的建議，食環署自2023年起，已於使用量高的新建或翻新公廁落實 1:2.32 的男女廁格比例標準。對於使用量不高或偏遠的公廁，則會視乎場地環境、空間限制及實際運作需要而靈活調整。\n\n　　發言人表示，食環署一直致力改善公共衞生環境，未來會持續加強轄下公廁的清潔和管理，並積極引入智慧科技和人性化配套，從軟件和硬件入手推動公廁現代化，為市民和旅客提供更優質的公廁環境。署方亦呼籲市民和訪客愛惜公廁設施、保持清潔，共同維護城市公共衞生。",

          "body": "以下是教育局局長蔡若蓮博士今日（十一月十八日）在立法會會議就「深化國際教育樞紐建設，構建國際升學首選地」議員議案的開場發言全文：\n\n主席：\n\n　　感謝范凱傑議員提出議案，鄧飛議員、李家駒議員、陳勇議員、陳穎欣議員提出修正案，就「深化國際教育樞紐建設，構建國際升學首選地」提出具體並有建設性的意見和建議。\n\n　　教育是國之大計。當前，國家正全面推進教育強國建設，「十五五」規劃明確提出教育、科技、人才一體化發展的戰略部署。香港在「一國兩制」下的獨特優勢，配合科教興國戰略，對接及服務國家發展大局，建設香港成為國際教育樞紐及高端人才集聚高地。\n\n　　香港教育質素享譽國際，加上高度國際化環境和良好的治安水平，讓香港成為世界各地優秀學生的理想留學地。去年，香港教育競爭力位列全球第三，而在今年接連公布的泰晤士高等教育（THE）二○二七年世界大學排名以及Quacquarelli Symonds（QS）二○二七年亞洲大學排名中，本地院校亦持續獲得高度評價，分別有五所大學位列世界百強，以及有五所大學躋身亞洲十強，其中三間大學更同時登上亞洲五強，反映高等教育的實力以及香港特區政府持續投入資源及推行各項措施的成果。\n\n建設香港成為國際教育樞紐\n\n　　為發揮香港高等教育的獨特優勢，我們構建「留學香港」的組合政策，制定具前瞻性、全局性及戰略性的策略，包括：統籌專班的組織保障、遊學與品牌宣傳、收生與獎學金，以及宿舍與留才支撐等，進一步深化國際教育樞紐建設。\n\n　　在統籌協調方面，教育局成立了留學香港專班，統籌大學教育資助委員會（教資會）、創新科技及工業局／創新科技署、勞工及福利局／香港人才服務辦公室、經濟貿易辦事處和政制及內地事務局／駐內地辦事處的工作，吸引全球優秀人才及學者來港升學和進行研究。\n\n「留學香港 」和「遊學香港」品牌\n\n　　同時，政府致力打造「留學香港」和「遊學香港」品牌，促進本地專上教育界擴容提質，組織首屆「留學香港周」，舉辦亞太國際教育協會年會暨展覽（APAIE 2026），吸引來自72個國家及地區、超過600間大學及機構參展，逾 3 500名國際教育界翹楚及專家齊聚香江。最近，又接連舉辦全球大學校長及領袖高峰會和世界頂尖大學校長論壇，匯聚來自全球頂尖大學及機構的高等教育領袖，其間，多所國內外頂尖學府與機構簽署合作協議，標誌了香港在全球高等教育界的地位和號召力。\n\n　　另外，政府鼓勵專上院校舉辧高增值的遊學產品，吸引中外學生參與。通過優質遊學體驗，加深學生對香港和對香港高等教育的認知與嚮往，拓展生源渠道，匯聚人才。今年暑假，八所資助大學合共舉辦超過100項「遊學香港」暑期課程、宿營、交流團等，反應非常熱烈。\n\n　　目前，修讀教資會資助課程的非本地學生人數，已由二○二三／二四學年的23 100人大幅增加至二○二五／二六學年的30 400人，來自全球超過100個國家及地區。《行政長官2026年施政報告》亦訂下於二○二六／二七學年，在香港修讀經本地評審全日制專上課程的非本地學生數目增加至大約90 000人的目標。\n\n與海內外高等教育協同發展\n\n　　與海內外高等教育協同發展方面，過去三個學年，六所教資會資助大學（即香港城市大學、香港浸會大學、香港中文大學、香港理工大學、香港科技大學及香港大學）與內地及海外院校合辦本科雙學位／聯合學位課程，包括美國、英國、法國和日本等，以及泰國、馬來西亞、印尼及菲律賓等東南亞國家，每個學年共開辦約60個雙學位／聯合學位課程，涵蓋STEAM（科學、科技、工程、藝術和數學）、社會科學、人文科學、法學、經濟及工商管理學等範疇。\n\n　　八所教資會資助大學與全球各地院校簽訂了超過2 700份學生交流協議，當中歐洲地區佔超過四成；北美洲和亞洲其他地區（不包括中國內地）亦佔近四成，為本地學生提供拓展國際視野的機會。\n\n加強支援配套\n\n　　當前，政府正多管齊下加強支援配套，深化國際教育樞紐建設。在獎學金方面，為加強與「一帶一路」沿線國家的教育合作，政府推出「一帶一路獎學金」，資助來自「一帶一路」沿線國家的非本地學生，每年發放獎學金的名額由最初的10個逐步增加二○二七／二八學年的200個，吸引更多「一帶一路」國家傑出學生來港升學。\n\n　　在住宿供應方面，發展局聯同教育局於二○二五年推出「城中學舍計劃」，透過放寬發展管制措施，鼓勵市場以自資和私營方式將現有商廈改裝或重建為學生宿舍，以增加專上學生宿位供應。至二○二六年十月底，已有45宗申請獲確認資格，落成後共可提供約11 450個宿位。\n\n　　在簽證方面，為便利各地學生前來香港修讀全日制短期課程，入境處於二○二五年落實了優化措施，豁免申請人提交經濟狀況證明，並縮短審批時間。至於非中國籍留學生前往內地的簽證事宜，經諮詢入境事務處，非中國籍香港居民（包括非永久性居民）二○二三年十月起可在港申請「一簽多行」簽證到內地，簽證有效期增至最長五年。至上月底，已有超過53 500宗「一簽多行」簽證申請獲批，便利他們多次往返內地進行文化、學術交流，鞏固本港國際教育樞紐的地位。\n\n　　在吸引人才留港發展方面，政府二○○八年推出「非本地畢業生留港／回港就業安排」（IANG），讓非本地學生在香港專上院校畢業後申請在港工作，IANG的首次逗留期限亦自二○二二年底起由12個月延長至24個月，讓受惠畢業生有更多時間在港尋找工作。政府又以試行形式擴展有關安排至涵蓋本港大學粵港澳大灣區內地城市校園的畢業生，便利大灣區內人才流通，進一步增加留學香港的吸引力。\n\n全速推進北都大學城發展\n\n　　在支持專上教育擴優提質方面，政府正全力建設北都大學城（包括新田、洪水橋及打鼓嶺大學城），總體規劃面積超過1 000公頃，以「一城五元素」（教育、科技、產業、人才及城市建設）推動教育、科技與人才一體化發展。其中三幅洪水橋大學城校園區用地現正接受合資格專上院校申請建設校舍，起動校園區的發展。由政務司司長領導的「大學城籌劃及建設組」將提升為「大學城建設及發展委員會」，強化頂層架構督導。配合北都大學城發展，政府推出措施，包括：增加教資會資助研究院研究課程學額、逐步提升香港博士研究生獎學金計劃名額，以及額外撥款支持知識共享和「科教創新基金」，全速推進北都大學城發展。\n\n國際教育樞紐推展至基礎教育\n\n　　另外，我們致力把「留學香港」品牌推廣至基礎教育。教育局自二○二六／二七學年起，以試點形式推行「直資擴容」計劃，透過優化現時直資學校的收生政策，讓有足夠資源及條件許可的直資學校，申請加大錄取持學生簽證的非本地學生。今年《施政報告》宣布，教育局會持續推進計劃，鼓勵更多直資學校錄取持學生簽證的非本地學生。目前，已有48所直資學校獲接納參與計劃。現階段，進一步開放資助中小學學位予持學生簽證的非本地生，要充分考慮基礎教育的核心任務、公帑資助邏輯、簽證限制及硬件配套等條件，我們會適時總結「直資擴容」計劃，務實審慎訂定長遠發展路向。\n\n　　支援非本地家庭子女教育需要方面，政府支持國際學校體系蓬勃發展，以便利和吸引因工作或投資而來港居住的家庭。教育局一直密切留意國際學校學額的供求情況，並持續通過「校舍分配機制」，以象徵性地價或租金分配土地或空置校舍作國際學校用途。為應付長遠需要及配合北都發展，今年《施政報告》宣布計劃於明年內批出北都或其他地區的用地發展國際學校，我們會適時透過「校舍分配機制」分配有關用地。\n\n　　在加快香港中學文憑考試（文憑試）國際化方面，香港考試及評核局致力拓展文憑試的國際認受性，並就相關科目進行基準比較研究，為海外院校提供客觀參考。文憑試資歷獲廣泛認可，為考生開拓多元升學及就業出路。目前，超過2 100所海外高等院校已公布接納文憑試作為入學資歷；內地則有165所高校可根據文憑試成績直接錄取香港學生。多個歐洲國家、印度及「一帶一路」沿線地區的院校亦接受文憑試成績作升學申請。\n\n　　主席，教育局會繼續深化國際教育樞紐建設，提升香港教育的國際地位和影響力。面對全球激烈的人才競爭，政府在推廣留學香港品牌時，定位並不在是否成為首選，而在香港作為理想留學地的獨特價值和優勢。「Hong Kong: Your World-class Campus」強調的是教育品質與科研實力，而不是首選地位。香港的核心吸引力並不在於唯一選擇，而在於背靠祖國、聯通世界的國際化環境，以及享譽國際的學術地位等疊加優勢。因此，在推廣「留學香港」時，我們採取務實及針對性拓展策略，強調香港的獨特優勢，吸引頂尖學者和優秀學生。我們期待與各位議員集思廣益，共同推進相關工作，並在聆聽各位議員的發言後，再作回應。\n\n　　多謝主席。",

          "body": "以下是文化體育及旅遊局局長羅淑佩今日（十一月十八日）出席「香港冬日小鎮．中環」啓動禮的致辭全文：\n\n林建岳博士（香港旅遊發展局（旅發局）主席）、Mr Graeme Torre（置地公司香港中環物業組合行政總裁）、各位嘉賓和傳媒朋友：\n\n　　大家晚上好。今日我很高興可以參加香港旅遊發展局「香港冬日小鎮．中環」啓動禮，為香港繽紛冬日巡禮拉開序幕。現在距離聖誕節剩下一個多月的時間，我們身處的中環已經充滿濃厚的聖誕氣氛，天氣亦開始轉涼，可以穿上「bling bling」的衣服。街道及商店都掛滿色彩繽紛的聖誕燈飾及裝置，讓人目不暇給。\n\n　　去年在這裏的「冬日小鎮」及沉浸式光影匯演，首度登場即大獲好評，今年旅發局再接再厲，除中環外，將「冬日小鎮」帶到尖沙咀和銅鑼灣，並呈獻不同主題的光影表演，進一步推高冬日節慶氛圍，讓市民和旅客感受到「只在香港」的濃濃節日氣氛。\n\n　　由今晚至明年一月初，多座中環標誌性建築物的外牆將呈獻精彩的光影表演，盡展香港夜間的閃爍魅力。稍後，維港對岸的尖沙咀「冬日小鎮」亦會啓動，帶來雙重的冬日光影體驗，與中環互相輝映。\n\n　　今晚亦是一個重要的歷史時刻。陪伴了我們22年的「幻彩詠香江」即將上演最後一場匯演，完成它的歷史使命。「幻彩詠香江」在二○○五年獲列入健力士世界紀錄，成為全球最大型燈光音樂匯演，亦是全球首批每晚恆常上演的大型燈光匯演之一，多年來向無數市民及旅客帶來了香港維港天際線的璀璨夜色，現在完成歷史任務了。今晚的匯演特別加入大廈樓頂煙火效果，為這場經典匯演劃上圓滿句號。接下來，旅發局會繼續舉辦及支持許多活動。近日的國際中秋綵燈匯、大坑舞火龍、香港美酒佳餚巡禮等，都深受市民及旅客歡迎，大大提升香港夜間的熱鬧氛圍，亦帶旺零售及餐飲業，成效有目共睹。未來，旅發局將會繼續推出不同項目，我亦呼籲零售和餐飲業界朋友與旅發局攜手，進一步豐富香港的夜間體驗。 \n\n　　聖誕節是普天同慶的節日，我預祝市民及旅客有一個愉快的佳節，亦感謝各位嘉賓及合作夥伴的支持，讓我們能在這個冬季，再次把歡樂與祝福帶給全港市民和到訪香港的旅客。\n\n　　祝各位聖誕快樂，Merry Christmas！",

          "body": "香港海關於十月二十七日及昨日（十一月十七日）偵破兩宗毒品案件，檢獲約十一公斤懷疑氯胺酮、約五百克懷疑依托咪酯粉末、約二點二公斤懷疑液態依托咪酯及超過一千三百粒懷疑依托咪酯煙彈，並拘捕三人。檢獲的懷疑毒品市值共約六百八十萬元。\n\n　　首宗案件中，香港海關與內地海關緝私部門進行聯合執法行動，根據情報交流及透過風險評估，於十月二十七日截查一件由英國經內地寄抵香港，報稱海鹽身體磨砂膏的包裹。經檢查後，海關人員於二十八個膠樽內發現約十一公斤懷疑氯胺酮。跟進調查後，海關人員採取監控遞送行動，並於昨日在佐敦拘捕一名五十歲本地女子。\n\n　　第二宗案件中，海關人員昨日下午在元朗執行反毒品行動期間，截查兩名同為二十八歲的本地和內地男子，並帶二人到附近一個村屋單位搜查。海關人員在該單位內檢獲該批懷疑依托咪酯毒品和懷疑製毒及毒品包裝工具。\n\n　　首宗案件被捕的女子已被控以一項企圖販運危險藥物罪，案件將於明日(十一月十九日)在九龍城裁判法院提堂。\n\n　　第二宗案件的兩名被捕男子已共同被控以一項製造危險藥物罪及一項販運危險藥物罪，而該名被捕本地男子亦另被控以一項阻撓一名海關人員罪。他們將於明日在粉嶺裁判法院提堂。\n\n　　根據《危險藥物條例》，製造危險藥物和販運危險藥物均屬嚴重罪行，一經定罪，最高可被判罰款五百萬元及終身監禁。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑販毒活動。",

          "body": "政制及內地事務局粵港澳大灣區發展辦公室將參與十一月十九（星期四）和二十日（星期五）在香港會議展覽中心舉行的創業日展覽，介紹粵港澳大灣區建設帶來的機遇，以及政府支援香港青年到大灣區創業的相關政策措施及計劃。\n\n　　《香港第一個五年規劃》對接國家「十五五」規劃，當中設有大灣區專章，明確指出香港會參與大灣區建設。辦公室一直通過多元化渠道，推廣大灣區建設帶來的重大機遇。今年辦公室繼續參與創業日展覽，重點展示北部都會區及河套深港科技創新合作區的發展潛力，讓創業者了解香港與大灣區內地城市協同發展所帶來的新機遇。\n\n　　辦公室的展位提供實用資訊，包括大灣區發展概覽、支援香港青年到大灣區創業的各項措施，以及設於廣州的粵港澳大灣區發展推廣中心提供的支援服務，協助有志到大灣區內地城市發展的創業者了解相關資訊。現場亦有精美限量紀念品派發，送完即止。\n\n　　辦公室的展位設於香港會議展覽中心展覽廳1E（編號1E - F02）。展覽免費入場，開放時間為十一月十九日（星期四）上午九時至下午六時三十分，以及十一月二十日（星期五）上午九時至下午六時。有意參觀的人士可於香港貿易發展局網頁（www.hktdc.com/event/eday/tc）預先登記。\n\n　　有關大灣區的更多資訊，歡迎瀏覽辦公室的專題網站(www.bayarea.gov.hk)。",

          "body": "食物環境衞生署食物安全中心（中心）今日（十一月十八日）宣布，因應英國環境、食物及鄉村事務部通報，指英國北愛爾蘭Coagh Townland爆發高致病性禽流感，中心即時指示業界暫停從該地區進口禽肉及禽類產品（包括禽蛋），以保障本港公眾健康。\n\n　　中心發言人說，根據政府統計處的資料，本港今年首九個月從英國進口約六百八十公噸冰鮮和冷藏禽肉及約二十二萬隻禽蛋。\n\n　　發言人說：「中心已就事件聯絡英國當局，並會繼續密切留意世界動物衞生組織及有關當局發出關於爆發禽流感的消息，因應當地疫情發展，採取適當行動。」",

          "body": "費城76人（Philadelphia 76ers）作客奧蘭多魔術（Orlando Magic），雖然有麥斯（Tyrese Maxey）及謝倫布朗（Jaylen Brown）因傷缺陣，但即將年滿42歲的勒邦占士（LeBron James）輪休後復出，交出22分、6助攻，聯同二年級後衛VJ艾治琴比（VJ Edgecombe）轟下24分、8籃板、6助攻，帶領76人在一度落後17分下，末節反撲以121:116反勝魔術，收下4連勝，同時終止對手4連勝。\n一老一嫩領軍反撲 艾治琴比末節爆發 占士關鍵兩傳一攻\n76人今季開季錄得12勝3負，高踞東區榜首。不過，麥斯及布朗兩名主力進攻點同時缺陣，令球隊作客魔術時一度陷入苦戰，首節更曾落後多達17分。幸好，即將年滿42歲的勒邦占士輪休復出。他今季採取嚴格負荷管理，所有「背靠背」賽程只會出戰其中一場，今仗與「細一個對」的艾治琴比組成「一老一嫩」組合，帶領球隊逐步收復失地。\n上半場，魔術多點開花，共有3名球員得分上雙，半場以69:64領先76人。第三節結束時，魔術仍以97:92領先5分。進入第四節，艾治琴比挺身而出，他在末節初段一度連取10分，帶領球隊不斷縮窄差距，更在比賽最後5分鐘成功反超。魔術的蘇傑斯（Jalen Suggs）其後投進超前三分，但艾治琴比隨即在進攻時間將屆時回敬一記大號三分，再度為76人取得領先。加上占士其後在關鍵時刻被「放投」，冷靜命中中距離跳投，助球隊將領先優勢擴大至4分穩住局面。再助攻西蒙斯（Anfernee Simons）命中三分，將領先優勢擴大至6分，徹底殺死比賽懸念。\nPHILLY CLOSES IT OUT ON THE ROAD! VJ 3. VJ DEFLECTION. LEBRON JUMPER. SIMONS 3. SIXERS IMPROVE TO 13-3 🔥 https://t.co/L6aunftvzS\n— NBA (@NBA) November 19, 2026占士全場16射8中，三分5射1中，攻下22分、6助攻。76人最終以121:116完成17分大逆轉，收下4連勝，同時終止魔術的4連勝。安比（Joel Embiid）攻下26分、7助攻、6籃板；艾治琴比則交出24分、8籃板、6助攻，與攻入18分的西蒙斯攜手填補麥斯及布朗缺陣的空缺。76人取勝後，繼續以強勢姿態高踞東區榜首；而勒邦占士在輪休復出後即交出關鍵表現，再次證明這位老將在關鍵時刻的價值。",

          "summary": "無供樓養家壓力、手握10萬元儲蓄兼有保險兜底，一名30歲打工仔「裸辭」僅4天卻感到極度焦慮。",

          "body": "無供樓養家壓力、手握10萬元儲蓄兼有保險兜底，一名30歲打工仔「裸辭」僅4天卻感到極度焦慮。過來人熱心教路兩招來自我治癒兼增值，並提醒要好好享受這段難得不用上班的自由時光。詳情見下圖及下文：\n無家庭負擔 10萬儲蓄撐半年 30歲打工仔裸辭第4日極焦慮 過來人教路：做這兩件事治癒增值逐張睇↓↓↓↓\n10萬預算使半年：無負擔卻感焦慮\n樓主昨天（18日）在社交平台Threads發帖苦訴，指自己才剛「裸辭」第4天，雖然無債一身輕，但卻感到焦慮：「裸辭第4日，今日Send（傳送）咗6-8份 CV（履歷表）。」\n樓主續自爆：「有10萬儲蓄，唔使供樓、唔使養小朋友、唔使養父母，Touch wood（觸木，意指謝天謝地） 有病都仲有兩份醫療保險可以救命，但個人都仲係好焦慮。」\n有網民見狀，隨即規勸應趁機好好享受不用上班的自由。不過樓主坦言「個人太焦慮，未享受到」。樓主透露自己心中有很多夢想和興趣想體驗，未料到一辭職便陷入恐慌。\n網民提醒勿自己嚇自己\n面對樓主的焦慮，有網民指出，這種不安純粹是「自己嚇自己」的心理作祟，直言令樓主焦慮的並非現實，而是腦袋不斷幻想「萬一搵唔到點算」的想法。\n網民勸道，既然當天已經寄出6至8份履歷表，就已經完成了當日的本分，其餘的應該放心交託給因緣，好好讓自己休息。\n不少網民也深有共鳴，留言安慰樓主萬事起頭難，剛進入無業空白期，不習慣是人之常情。有人直言，樓主其實已經準備得非常充足：\n「你已經準備得好足啦，有10萬應急錢、無供樓養家壓力、仲有醫療保兜底，今日又已經Send咗幾份CV，真係已經做得好好！畀自己放個假唞下氣先，好快會遇到適合你嘅 Offer（工作機會）🤍」亦有其他網民簡單留下一句「放鬆心情，會越來越好嘅」，為樓主打氣。\n過來人教兩招自我治癒兼增值\n不少曾有類似經歷的過來人亦留言，傳授如何度過這段「空白期」的兩大治癒方案。\n第一招是「免費自學」。有5個月前同樣經歷裸辭的過來人分享，利用空檔尋找免費課程學習新事物，不僅能自我增值，更能有效消除「浪費時間」的內疚感，從而減輕焦慮。網民透露自己現在多了時間，常會找免費東西學習，學了新事物覺得增值了自己，人也沒那麼焦慮。\n第二招是「做 Part-time（兼職）」。過來人指出，未找到正職前先做兼職，一來有收入可以幫補生計，二來自由身能靈活配合面試時間，隨時會因緣際會遇到更好的發展機會。\n網民提醒：10萬元不耐花\n不過，也有務實的網民提醒「10皮（十萬）唔係頂到好耐」，樓主對此也坦言「我都知，我預半年」。\n有網民更分享自身慘痛經歷來安慰樓主，指自己30歲嗰年整親手無法工作，當時沒有伴侶，同樣只有10萬元儲蓄，每個月還要花幾千元看醫生，最終捱了一年傷癒才成功轉行，勸樓主放鬆心情。\n資料來源：hiworld000111＠Threads\n相關閱讀：\n打工10年手持$133萬 32歲港男因職場一事擬裸辭「微退休」 網民意見兩極\n大學畢業裸辭後送外賣 33歲港男陷迷茫：每日賺500蚊先敢下線\n打工仔壓力爆煲「做做下嘢喺度喊」決心裸辭 網民分享求職市道現況掀熱議\n「50+」裸辭揭職場殘酷真相 「1句話」引爆初老族共鳴 網民：「終於有人敢講！」\n職場失意裸辭 母親7字真言感動 港女喊爆：後悔為咗份工忽視媽媽",

          "body": "近日，“百团联动 重走中山足迹”纪念孙中山先生诞辰160周年专题研讨会在江门五邑大学举行，专家学者、民主党派代表、高校师生、粤港澳台侨青年代表等约160人围绕“纪念先生、传承精神、凝聚侨心、服务发展”主题研讨交流，重温孙中山先生的历史功绩，阐释孙中山精神当代价值，进一步凝聚共识，厚植家国认同。\r\n\n　　五邑大学党委书记栾天罡在致辞中，深入阐释了孙中山精神在新时代侨乡统战工作中的价值内涵。中山大学历史学系主任安东强教授围绕孙中山、梁启超与“少年中国”作主旨报告。林锦清、庞光华、石坚平、麦瑞权等嘉宾，分别从地方文史、人物研究、侨史脉络、港澳家国情怀培育等多个维度分享研究成果。嘉宾们立足江门侨乡独特资源，深挖孙中山革命事业与港澳台同胞、海外侨胞的深厚历史渊源，将孙中山先生振兴中华的理想追求与粤港澳大湾区建设、铸牢中华民族共同体意识紧密结合，推动学术研究与统战工作深度融合。大家表示，孙中山先生的理想信念与精神品格是海内外中华儿女共同的宝贵精神财富，在新征程上传承中山精神，必须高举爱国主义伟大旗帜，紧紧围绕中华民族伟大复兴目标携手同心、团结奋斗。\n\n　　本次活动是全省“百团联动 重走中山足迹”粤港澳台侨青年交流活动的重要组成部分，由江门市委统战部联合五邑大学、民革江门市委员会、中山大学校友会、江门五邑海外联谊会、江门五邑炎黄文化研究会、澳门家国情怀历史学会举办。 【编辑:李岩】",

          "body": "一半砺行实干，一半案牍成文\n\n左手深耕产业经济\n\n右手守护法治初心\n\n她如一株扎根沂蒙大地的寒梅\n\n将民主党派成员、金融从业者\n\n发改工作者\n\n外贸商务人、公职律师\n\n多重身份熔铸合一\n\n脚印遍布平邑发展热土\n\n笔端汇聚社情民意真知\n\n她就是\n\n九三学社临沂市委员会委员\n\n平邑县商务发展服务中心副主任\n\n杨秀梅\n\n　履职尽责建言硕果盈枝\n\n杨秀梅始终牢记党派成员职责使命\n\n积极深入发展一线调查研究\n\n充分发挥金融、发改、商务\n\n多领域优势从业经验\n\n形成一批高质量、有分量的\n\n社情民意信息和议政建言成果\n\n近三年来，3项课题入选\n\n九三学社中央参政议政课题\n\n4项课题被九三学社省委会立项\n\n8项列为市委统战部重点研究课题\n\n6项被市社科联列为社科规划项目\n\n11篇报告被九三学社中央领导\n\n及市主要领导批示肯定\n\n40余篇社情民意信息被\n\n九三学社中央、社省委会及省市政协采用\n\n 她独立执笔完成的\n\n《关于创新发展新型跨境易货贸易，\n\n推动高质量共建“一带一路”的建议》\n\n被九三学社中央采纳\n\n转化为全国政协十四届四次会议\n\n九三学社界别提案\n\n她荣获九三学社全国优秀社员\n\n连续3年获得九三学社山东省委会\n\n参政议政、信息、宣传工作先进个人\n\n获评省发改委优秀研究成果奖三等奖\n\n　岗位建功实干赋能开放\n\n立足县域外贸发展主战场\n\n杨秀梅积极投身对外开放发展改革一线\n\n累计走访重点企业50余次\n\n实地摸排罐头、木业、建材、手套等产业\n\n出海过程中的痛点堵点\n\n结合金融视角分析企业资金瓶颈\n\n依托发改产业规划思路\n\n找准产业升级方向\n\n牵头撰写形成高质量专项调研报告\n\n为县域外贸提质扩容明确行动方向\n\n 她坚持分层分类、靶向施策\n\n重点帮扶18家骨干外贸企业\n\n精准引导70家中小微企业纾困发展\n\n推动15家意向企业“出口破零”\n\n组织20余场政策宣讲培训会送策上门\n\n统筹组织200余家企业\n\n参与国内外展会、经贸对接活动30余场\n\n助力县域外贸增长势能充分释放\n\n　多面出彩绽放别样芳华\n\n杨秀梅还以公职律师身份\n\n助力县域法治营商环境建设\n\n她参与审核对外合同协议\n\n组织开展法治宣传教育\n\n防范化解涉外经贸领域法律风险\n\n以法律专业力量\n\n守护企业出海行稳致远\n\n她多次获全国、省、市级征文奖项\n\n被吸纳为山东省散文学会会员\n\n从一线问需到谋策纾困\n\n从外贸攻坚到到法治守护\n\n从议政建言到文学抒怀\n\n杨秀梅以复合型“多面手”姿态躬身实干\n\n以“有心人”的执着笔耕不辍\n\n生动展现一名党外干部的\n\n综合素养与责任担当\n\n梅立枝头，暗香自来\n\n杨秀梅将步履不息、笔耕不辍\n\n秉寒梅坚韧不拔之风骨笃行实干\n\n继续在沂蒙热土之上\n\n静绽芳华、漫吐清芬\n\n供稿：平邑县委统战部\n\n 【编辑:李岩】",

          "body": "近日，湖南祁阳。为迎接12月上旬在湖南永州举行的第七届湖南旅游发展大会，祁阳浯溪摩崖石刻新碑林区首批20件书法作品正抓紧镌刻，古老碑林将以崭新姿态迎接八方来客。\n\n浯溪摩崖石刻始于唐代元结撰文、颜真卿书写的《大唐中兴颂》，是享誉全国的露天碑林，历经千年积淀，形成“诗、文、书、石”共生的独特文化瑰宝。为延续石刻文脉，祁阳开辟浯溪摩崖石刻新区，构建“古摩崖区+新碑林区”格局：老区守好“中兴”根脉，保护展示历代摩崖石刻遗存；新区围绕“复兴”主题，集中展示近现代书法精品。(谭俊杰 陈小玲 伍彬彬 彭旭 制作 周昂煜)",

          "body": "US federal authorities have escalated a criminal investigation into the Alaskan Senate race following allegations that Democratic candidate Mary Peltola's campaign coordinated to plant a same-name spoiler candidate on the ballot to siphon votes from the Republican incumbent.\n\nPeltola denies knowing any other candidate on the ballot while US President Donald Trump calls the move \"totally illegal.\"\n\nThe US Justice Department intensified its investigation into the Alaskan Senate race after a New York Times report detailing interviews, text messages and documents from Democratic candidate Mary Peltola's team aimed to coax a candidate with a similar name to the incumbent Republican senator into the race with the aim of confusing voters.\n\nDaniel J. Sullivan Jr., a retired schoolteacher, has been included in the Alaskan Senate race ballot alongside incumbent US Republican Senator Dan S. Sullivan and Peltola.\n\nAlaska's Republican Governor Mike Dunleavy ordered a separate state investigation, stating the deliberate manipulation of ballots directly struck at the \"integrity\" of elections.\n\nThe situation drew condemnation from the White House.\n\nSpeaking to reporters while campaigning in South Carolina, US President Donald Trump accused Democrats of \"conspiracy.\"\n\n\"So they got a guy named Dan Sullivan to go up against on a ballot, Dan Sullivan.\n\nSo you split, it's called splitting the vote, totally wrong, totally illegal.\n\nThis is voter fraud at the highest level.\n\nNot even that, he even looks a little bit like him.\n\nDo you ever see the pictures?\n\nIt's the craziest thing I've ever seen.\" said Trump.\n\nMeanwhile, addressing supporters at a rally in Juneau, Alaska, Peltola denied any wrongdoing or prior knowledge.\n\n\"I just want to clear the air.\n\nI knew nothing about any other candidates on the ballot except for me and the incumbent.\n\nThat is all I have ever known about.\n\nI am not interested in tricking voters.\n\nI know I can beat Dan Sullivan.\" said Peltola.\n\nOn the streets of Juneau, residents remained divided over the controversy.\n\nWhile some residents viewed the candidate manoeuvring as standard political strategy, rather than a criminal offence, independent voters expressed deep concerns the scandal provided fuel for critics to attack the democratic process.\n\n\"But it's not illegal and it is not unusual and so to me I'm really pissed off that the New York Times ran this article that puffed up something that is completely normal and not illegal.\" said a resident.\n\n\"I think there's no denying it and if I heard her say that it didn't happen or I don't know nothing about it, I would just at that point think even less of her because I'd believe she'd be lying.\" said an independent voter.\n\nThe controversy came as the country prepared for the upcoming mid-term elections with Trump's Republicans facing a strengthening Democrat opposition.",

          "body": "11月18日，“大地流彩——四川美术学院文艺赋美乡村实践展”在全国农业展览馆开幕，系统呈现这所艺术院校自2012年以来十四年扎根西部、以艺术赋能乡村全面振兴的实践成果。展览设“与历史同行”“为乡村赋美”“以田野育人”三个单元，覆盖贵州羊磴、璧山七塘、西藏强钦、四川夹江、重庆酉阳五个代表性案例。\n\n据四川美术学院院长焦兴涛介绍，十四年来学校在全国开展920项服务乡村项目与教学实践，超13万人次师生参与，带动地方经济效益70亿元。焦兴涛表示，乡村全面振兴不只需要产业之实、生态之美，也需要文化之魂、精神之丰。艺术如何参与乡风文明建设、如何激发村民和乡村孩子的创造力，是这个展览想回答的问题。\n\n展览将持续至12月15日。\n\n(记者 刘超)",

          "body": "很多人觉得骨质疏松不是大事\n\n　　这是一个很大的误区\n\n　　事实上\n\n　　骨质疏松会让骨骼脆性增加\r\n\n　　一旦跌倒极易发生骨折\n\n　　骨折后可能致残\n\n　　严重时甚至危及生命\n\n　　报告单上的指标到底是什么意思？\n\n　　我们应该如何科学对待骨质疏松？\n\n　　3个方法发现骨质疏松\n\n　　4个关键应对骨质疏松\n\n　　一起来看～\n\n　　01\n\n　　骨质在无声无息中流失\n\n　　人群普遍规律\n\n　　30～35岁：骨量达到峰值\n\n　　36～49岁：维持稳定，缓慢流失\n\n　　50～69岁：迅速减少\n\n　　70岁以上：持续减少\n\n　　过程：骨量减少—骨质疏松症—骨折\n\n　　发生骨质疏松性骨折后，患者的致残率和死亡率会显著增加，第一次骨折之后，再发骨折风险较高。\n\n　　其中，髋部骨折是骨质疏松症严重的并发症。发生髋部骨折后1年内，约20%的患者可能死于各种并发症，约50%的患者致残，生活质量明显下降。\n\n　　而这种风险离我们并不遥远。全国骨质疏松症流行病学调查显示，我国50岁以上人群骨质疏松症患病率为19.2%，其中50岁以上女性为32.1%，65岁以上女性患病率更达到51.6%。\n\n　　02\n\n　　3个方法，测一测骨质疏松风险\n\n　　OSTA亚洲人骨质疏松自我筛查工具(主要适用于绝经后亚洲女性)\n\n　　计算方法：(体重kg-年龄)×0.2=OSTA风险指数\n\n　　结果分析：\n\n　　指数＞-1，发生骨质疏松的风险较低；\n\n　　-4＜指数≤-1，属于中风险，建议到医院咨询，提前干预；\n\n　　指数≤-4，为高风险，建议尽快到医院做骨密度检查。\n\n　　举例说明：体重50公斤，年龄85岁的人，风险指数为(50－85)×0.2=-7，结果≤-4，提示骨质疏松高风险。\n\n　　3大症状，警惕骨质疏松\n\n　　腰背痛；\n\n　　驼背；\n\n　　身高缩短超过3厘米。\n\n　　以上3种情况，常提示可能存在脊柱压缩改变，需要排查骨质疏松。\n\n　　骨密度检测：报告上的3个核心指标\n\n　　双能X线骨密度检测是诊断骨质疏松的金标准，筛查建议如下：\n\n　　常规筛查人群：建议将骨密度纳入40岁以上人群常规体检项目。\n\n　　高危人群：长期服用激素、有脆性骨折史、体重过低、有烟酒嗜好等高危人群，即便没有不适，也建议主动排查骨量。女性早绝经(45岁前)、男性存在性腺功能减退症，同样需要尽早评估骨骼健康。\n\n　　T值：绝经后女性、50岁以上男性的诊断核心\n\n　　它是诊断骨质疏松的核心指标，对应分级标准如下：\n\n　　T值≥-1：骨量处于正常范围；\n\n　　-2.5＜T值＜-1：骨量减少，属于骨质疏松前期；\n\n　　T值≤-2.5：可诊断为骨质疏松症。\n\n　　Z值：绝经前女性、50岁以下男性的参考指标\n\n　　判断骨量是否符合自身年龄的正常水平。\n\n　　判断标准：\n\n　　Z值＞-2：骨量处于同年龄段的平均水平；\n\n　　Z值≤-2：骨密度低于同年龄人群平均水平，需要排查原因并积极干预。\n\n　　只看骨密度不够：结合动态指标判断流失速度\n\n　　骨密度反映的是骨骼的静态状态，只能体现检测当下的骨量水平，无法判断骨量丢失的快慢。\n\n　　如果想要了解近3个月的骨代谢动态、骨量流失速率，还需检测骨转换生化标志物。这项血液指标可以反映骨吸收与骨形成的活跃程度，和骨密度结果结合分析，才能更准确评估是否需要及时启动药物干预。\n\n　　另外需要注意，骨骼代谢周期较长，骨密度复查不宜过于频繁，通常6个月—1年检测1次即可，6个月内复查一般很难观察到明显变化。\n\n　　03\n\n　　日常护骨4字诀：吃、晒、动、戒\n\n　　骨量的积累与维护，离不开日常的健康管理，做好4件事，守护骨骼健康。\n\n　　吃：补足钙与优质蛋白\n\n　　充足的钙与蛋白质摄入，是维护骨骼健康的核心营养基础。\n\n　　普通健康成年人每日蛋白质推荐摄入量为0.8～1.0克/千克体重；\n\n　　骨质疏松人群、老年群体建议提升至每日1.0～1.2克/千克体重，以维持肌肉量、保障骨代谢正常运转；\n\n　　高龄、消瘦或已发生脆性骨折的患者，可进一步增至1.2～1.5克/千克体重，有助于降低肌肉衰减与再发骨折的风险。\n\n　　补钙优先通过膳食实现，建议每日摄入至少300毫升牛奶或相当量的奶制品，搭配豆制品、深绿色叶菜、鱼虾类等富钙食物。\n\n　　日常还要避免过度节食减重，防止营养摄入不足持续损耗骨量。\n\n　　晒：促进维生素D合成\n\n　　维生素D是钙吸收的“搬运工”，每日接受10～20分钟的日晒，可促进皮肤自行合成维生素D，帮助钙质沉积到骨骼中。注意避免正午强光暴晒，防止皮肤晒伤。\n\n　　动：给骨骼适度应力刺激\n\n　　骨骼遵循“用进废退”的原则，负重与力量训练能给骨骼施加良性刺激，促进骨形成。\n\n　　日常可选择快走、慢跑、跳绳、球类运动、深蹲等，既能锻炼肌肉，也能强化骨骼强度。\n\n　　戒：避开伤骨坏习惯\n\n　　戒烟限酒，避免过量饮用碳酸饮料、咖啡，尽量避免或少用影响骨代谢的药物，避免长期过度节食，减少骨量的不必要消耗。\n\n　　专家提醒：\n\n　　如果已确诊骨质疏松，或骨量减少且骨转换指标提示骨流失速度很快，仅靠补充营养远远不够。\n\n　　需由医生结合骨密度水平、骨代谢类型进行评估，选择规范的抗骨质疏松药物方案，有助于改善骨密度、降低骨折风险。\n\n　　应对骨质疏松行动指南\n\n　　测一测骨质疏松风险，试试这3个方法\n\n　　1.(体重kg-年龄)×0.2=OSTA风险指数，指数≤-4，建议尽快到医院做骨密度检查；\n\n　　2.骨密度检测；\n\n　　3.腰背痛、驼背、身高缩短超过3厘米。\n\n　　做好4件事，守护骨骼健康\n\n　　1.吃：每天摄入适量牛奶或酸奶，多吃豆制品、深绿色叶菜、鱼虾类食物，同时避免过度节食减重。\n\n　　2.晒：每日接受10～20分钟的日晒。\n\n　　3.动：日常可选择快走、慢跑、跳绳、球类运动、深蹲等。\n\n　　4.戒：戒烟限酒，减少含糖饮料、浓咖啡的过量摄入，避免长期过度节食。\n\n　　温馨提示\n\n　　本文为健康科普，不替代专业诊疗。骨量异常、腰背持续疼痛、身高明显缩短，请及时到骨科或内分泌科就诊，遵医嘱检查、干预。\n\n　　钙剂与维生素D仅作为基础营养支持，单纯补充一般难以逆转骨密度下降，也无法单独有效降低骨折风险，不能替代药物治疗。 【编辑:梁异】",

          "body": "近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。体育环(长)跑、上课点名、接水饮水、饭卡充值……校园生活的每一处场景，几乎都对应着不同的App或小程序。“校园App臃肿”的话题在网上引发激烈讨论，仅微博平台的相关话题阅读量就接近1亿。校园App为何越装越多？解决之道何在？\r\n\n　　校园里的数据孤岛\n\n　　打开不少大学生的手机，“超星学习通”“今日校园”“创高体育”“U净洗衣”“胖乖生活”等不同门类的App占满了屏幕，每一个都需要单独下载、注册并授权。2025年12月，一项面向全国高校大学生的问卷调查显示，97.72%的受访者日常使用校园App，其中93.89%的受访者在使用过程中受到不同程度的困扰。\n\n　　尽管吐槽不断，但独属校园的这些App又“不得不用”。以上课为例，三四个App都能签到，两三个平台都可随堂测验，任课老师挑自己顺手的用，学生却一个都不敢删。北京某高校大二学生小玖受访时表示，其英语课作业需用3个App才能完成：“批改网”写作文、“U校园”听听力、“fif口语训练平台”练口语。“它们太占内存了，等学期结束后，我打算都删了。”小玖说。\n\n　　有些应用看似体贴地提供了微信、支付宝小程序作为“轻量替代”，功能却大打折扣。华中某高校的学生宿舍洗衣机关联着“海乐生活”平台，学生小林就因小程序常常卡顿、无法使用预约功能，不得不专门下载了App。\n\n　　除了功能单一，商业广告多、运行不稳定、存在数据泄露风险等问题，这类校园App让学生不堪其扰。小玖学校的饮水机用的是一款叫“慧生活798”的App，每次喝水前都得先连着关掉几个弹窗，稍不留意就会“跳转”到购物软件。不少网友抱怨“洗个澡得先看一串广告”“看完广告热水都凉了”。\n\n　　校企各方整合难\n\n　　部分校园App乱象的根源，在于一些高校各部门各自为政，教务、学工、后勤、团委等部门往往只关注自身的管理需求，各部门对接不同供应商：每当合约到期、重新招标，系统便可能整体更换，学生只能重新下载、注册。\n\n　　企业逐利，绑架了学生的刚需。由第三方企业运营的生活服务类App一旦与校园生活强绑定，学生的手机便成为企业“跑马圈地”的沃土。对企业而言，校园是稳定的精准流量池，开屏广告、跳转流量与支付分成，共同构成了这个近乎稳赚不赔的商业闭环。有些App还强制要求开通免密支付、自动扣费，或设置最低充值金额。若学生想要退款，则颇为麻烦，甚至需要拨打12315投诉热线才能成功维权。\n\n　　在智慧校园的建设过程中，App的数量更被部分高校领导当作数字化建设的“成绩单”。校方只在意表面形式，并不关心学生使用是否便捷。西北某高校一位研究生透露，她居住的宿舍楼，若是热水器坏了，需要学生自己打电话给设备维修人员。“学校才不管，凡是不涉及安全的事，一律外包。”北方某高校一名在校内网络中心勤工俭学的学生发现，学校的部分系统版本仍停留在本世纪初，与新搭建的平台集成时问题不断，但“领导觉得好，我们就得用”。\n\n　　更何况，对于一些高校而言，新建一个平台远比多下载一个App来得麻烦——整合各方意味着协调各部门权责、触动企业利益、打破路径依赖。谁来牵头？谁来出钱？数据归谁管？就算高校有心，又能否真正实现？西部某高校相关负责人坦言，一些高校尝试自主研发软件系统，但技术能力有限，常出现各类故障；一些高校则外包给第三方，也常面临业务功能与现有系统不兼容，导致平台瘫痪的问题。\n\n　　年轻人开始自己动手\n\n　　好的数字化，应当围绕“人”转。2019年，教育部等8部门印发意见，划定备案审查、自愿选用的底线。近年来，相关部门也多次开展专项整治，要求清理冗余应用、规范广告推送。2026年8月，个人信息保护系列专项行动取得阶段性成效，不得过度收集个人信息的“最小必要”原则持续收紧。少一些“屏幕上的形式主义”，多一些“一个平台全托管”的踏实，才能让高校师生真正享受到智慧校园的便捷服务。\n\n　　如今，不少熟悉AI工具的学生选择“自力更生”：以Vibecoding的方式自行搭建集成式校园平台。来自华南某高校的小鹤同学，因为请假和订校车这两件“小事”反复受阻，所以萌生了自己动手的念头。他前后用了3天时间，搭建了一个可以代管自己在校事务的Agent，并将开源代码发布到网上。上海学生小C则围绕“Z世代校园数字生态系统设计”课题，仅用1天就搭起了一站式整合方案的雏形。\n\n　　西南大学教育学部教授彭泽平认为，高校应牵头建设功能高度集成、数据统一汇聚的智慧校园基础平台。学生之所以自行开发，根源在于其对轻量化、场景化、个性化服务的需求，与校方所提供的标准化、统一化平台之间存在错位。这些自下而上的实践不仅贴近场景，还能成为校方优化服务的“鲜活信号”。有学生反映，他使用的校园App就是民间自行开发、后被学校网络中心“招安”的，“功能越来越多，确实方便不少”。\n\n　　与其让学生各自“破墙”，不如敞开大门。重庆市教育科学研究院助理研究员邹南芳建议，将学生设计应用纳入课程学习、科研训练、专业实践等培养环节，实现数字化治理与人才培养的有机统一。在数据安全、接口合规、个人信息保护、可持续维护和责任归属等方面，学生自制应用存在一定的不确定性，校方可以开放合规、分级的标准化数据接口，建设开发沙箱与测试机制，按“最小必要”原则界定调用权限，让年轻人的热情与创造力在规则边界内自由奔涌、充分释放。\n\n　　半月谈记者：徐盛悦\n\n　　原标题《开学一个多月，手机多了十几个App》 【编辑:曲克】",

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // 状态
  // ---------------------------------------------------------------
  var state = {
    data: null,
    theme: "light",
    mod: "news",        // news | live | radio | settings
    section: null,      // null = 今日要闻
    trend: null,        // 非 null = 正在看某个热搜榜（weibo / bilibili …）
    trendItem: null,    // 热搜榜里选中的那一条（rank），null = 看榜单概览
    storyId: null,
    source: "",         // 数据来源说明
    radio: { key: null, hls: null }
  };

  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ---------------------------------------------------------------
  // 时间：今天只显示时分，其余带日期
  // ---------------------------------------------------------------
  function fmtTime(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso).replace("T"," ").slice(0,16);
    var now = new Date();
    var hh = String(d.getHours()).padStart(2,"0");
    var mm = String(d.getMinutes()).padStart(2,"0");
    var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
    if(sameDay) return hh + ":" + mm;
    var mo = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    if(d.getFullYear()===now.getFullYear()) return mo + "-" + dd + " " + hh + ":" + mm;
    return d.getFullYear() + "-" + mo + "-" + dd;
  }

  function fmtStamp(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso).slice(0,16);
    var p = function(n){ return String(n).padStart(2,"0"); };
    return (d.getMonth()+1) + "月" + d.getDate() + "日 " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // 热度：464972 → 46.5万
  function fmtCount(n){
    n = Number(n) || 0;
    if(!n) return "";
    if(n >= 100000000) return (n / 100000000).toFixed(1) + "亿";
    if(n >= 10000) return (n / 10000).toFixed(1) + "万";
    return String(n);
  }

  // ---------------------------------------------------------------
  // 主题
  // ---------------------------------------------------------------
  function setTheme(t){
    state.theme = t;
    root.setAttribute("data-theme", t);
    try { localStorage.setItem("ng-theme", t); } catch(e){}
    document.querySelectorAll("[data-pick]").forEach(function(el){
      el.classList.toggle("on", el.getAttribute("data-pick") === t);
    });
  }

  function initTheme(){
    var saved = null;
    try { saved = localStorage.getItem("ng-theme"); } catch(e){}
    if(saved && ["light","dark","sepia","glass"].indexOf(saved) >= 0){ setTheme(saved); return; }
    // 跟随系统
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(dark ? "dark" : "light");
  }

  // ---------------------------------------------------------------
  // 字号：用户选的档位 × 窗口宽度系数
  //   档位决定基准，宽度系数让字号随窗口变大而变大（窄屏不加成，
  //   免得手机上折行太碎）。两者相乘写进 --fs，全站字号都吃这个变量。
  // ---------------------------------------------------------------
  var FONT_STEPS = [
    ["s",  "小",   0.95],
    ["m",  "标准", 1.12],
    ["l",  "大",   1.28],
    ["xl", "特大", 1.45]
  ];
  var FONT_KEY = "ng-fs";
  var fontStep = "m";

  function viewportFontFactor(){
    var w = window.innerWidth;
    if(w <= 1040) return 1;
    return Math.min(1.2, Math.max(1, w / 1400));
  }

  function fontScaleOf(step){
    for(var i = 0; i < FONT_STEPS.length; i++){
      if(FONT_STEPS[i][0] === step) return FONT_STEPS[i][2];
    }
    return 1.12;
  }

  function applyFont(){
    var total = fontScaleOf(fontStep) * viewportFontFactor();
    total = Math.min(1.7, Math.max(0.8, total));
    document.documentElement.style.setProperty("--fs", total.toFixed(3));
  }

  function setFont(step){
    fontStep = step;
    try { localStorage.setItem(FONT_KEY, step); } catch(e){}
    applyFont();
    document.querySelectorAll("[data-set-font]").forEach(function(el){
      el.classList.toggle("on", el.getAttribute("data-set-font") === step);
    });
  }

  function initFont(){
    var saved = null;
    try { saved = localStorage.getItem(FONT_KEY); } catch(e){}
    if(saved && FONT_STEPS.some(function(s){ return s[0] === saved; })) fontStep = saved;
    applyFont();
  }

  var fontResizeTimer = null;
  window.addEventListener("resize", function(){
    if(fontResizeTimer) clearTimeout(fontResizeTimer);
    fontResizeTimer = setTimeout(applyFont, 120);
  });

  // ---------------------------------------------------------------
  // 数据
  // ---------------------------------------------------------------
  function acceptData(obj, sourceLabel, keepView){
    if(!obj || !Array.isArray(obj.headlines) || !Array.isArray(obj.sections)){
      alert("这个文件不是 NewGent 的数据包（缺少 headlines / sections）。");
      return false;
    }

    var prevSection = state.section;
    var prevTrend = state.trend;
    var prevStory = state.storyId;

    state.data = obj;
    state.source = sourceLabel || "";

    if(keepView){
      // 自动刷新时保住用户正在看的位置：分区没了就退回要闻，事件没了就选列表第一条
      var secs = obj.sections || [];
      var boards = (obj.trending && obj.trending.boards) || [];
      state.trend = (prevTrend && boards.some(function(b){ return b.key === prevTrend; }))
        ? prevTrend : null;
      state.section = (prevSection === VIDEO_SECTION)
        ? VIDEO_SECTION
        : ((prevSection && secs.some(function(s){ return s.name === prevSection; }))
            ? prevSection : null);
      state.storyId = prevStory && findStory(prevStory)
        ? prevStory
        : (currentStories()[0] ? currentStories()[0].id : null);
    } else {
      state.section = null;
      state.trend = null;
      var first = obj.headlines[0] || (obj.sections[0] && obj.sections[0].items[0]) || null;
      state.storyId = first ? first.id : null;
    }

    setUpdatedLabel(obj.generated_at);
    render();
    // 模块内容跟着数据一起刷新，免得停在旧数据上
    if(state.mod === "live") renderLive();
    if(state.mod === "radio") renderRadio();
    if(state.mod === "settings") renderSettings();
    return true;
  }

  //: 超过这个小时数就认为数据不再新鲜，顶栏直接标红提醒
  var STALE_HOURS = 6;

  function setUpdatedLabel(iso){
    var el = $("updated");
    if(!iso){ el.textContent = ""; return; }
    var t = Date.parse(iso);
    var age = isNaN(t) ? -1 : (Date.now() - t) / 3600000;
    var stale = age > STALE_HOURS;
    el.classList.toggle("stale", stale);
    el.innerHTML = '<span class="dot"></span><span>' +
      esc(stale ? "数据停在 " + fmtStamp(iso) + " · 需刷新" : "更新于 " + fmtStamp(iso)) +
      '</span>';
  }

  function flashUpdated(){
    var el = $("updated");
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 1200);
  }

  // ---------------------------------------------------------------
  // 数据来源：优先读同目录 app_data.json（能自动刷新），
  // 拿不到才退回内联快照（file:// 双击打开时走这条）
  // ---------------------------------------------------------------
  function fetchData(timeoutMs){
    return new Promise(function(resolve, reject){
      var done = false;
      var timer = setTimeout(function(){
        if(!done){ done = true; reject(new Error("timeout")); }
      }, timeoutMs || 1500);

      // 时间戳 + no-store 双保险：GitHub Pages 对静态文件有 10 分钟缓存，
      // 少任何一个，刚打开页面看到的都可能是十分钟前的旧数据。
      var url = "app_data.json?t=" + Date.now();
      fetch(url, { cache: "no-store" })
        .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("http " + r.status)); })
        .then(function(obj){
          if(done) return;
          done = true; clearTimeout(timer); resolve(obj);
        })
        .catch(function(err){
          if(done) return;
          done = true; clearTimeout(timer); reject(err);
        });
    });
  }

  function loadInline(){
    var node = $("ng-data");
    if(!node) return false;
    var raw = (node.textContent || "").trim();
    if(!raw || raw.indexOf("__NG_DATA__") >= 0) return false;
    try {
      return acceptData(JSON.parse(raw), "内置快照");
    } catch(e){
      console.error("内置数据解析失败", e);
      return false;
    }
  }

  var pollTimer = null;

  function startPolling(){
    if(pollTimer) return;
    $("updated").classList.add("live");
    pollTimer = setInterval(tick, 60 * 1000);
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) tick();   // 切回来立刻补一次
    });
    // 从「往返缓存」恢复（手机上按返回、切后台再回来）时页面不会重新加载，
    // 这里补一次，否则看到的是离开那一刻的数据
    window.addEventListener("pageshow", function(e){
      if(e.persisted) tick();
    });
  }

  function tick(){
    if(document.hidden) return;
    fetchData(8000).then(function(obj){
      var cur = state.data && state.data.generated_at;
      if(obj.generated_at !== cur){
        acceptData(obj, "实时数据", true);
        flashUpdated();
      }
    }).catch(function(){ /* 网络抖动就跳过，下一轮再说 */ });
  }

  function boot(){
    initTheme();
    initFont();
    // 打开即拉最新，不读缓存；拿不到才退回内联快照（file:// 双击打开时走这条）
    fetchData(6000).then(function(obj){
      acceptData(obj, "实时数据");
      startPolling();
    }).catch(function(){
      if(!loadInline()) showNeedData();
    });
  }

  // 手动刷新：设置页那个按钮
  function refreshNow(){
    fetchData(12000).then(function(obj){
      acceptData(obj, "实时数据", true);
      flashUpdated();
    }).catch(function(){
      var el = $("updated");
      if(el) el.classList.add("stale");
    });
  }

  function showNeedData(){
    $("sidebar").innerHTML = "";
    $("listScroll").innerHTML = "";
    $("listCount").textContent = "";
    $("detail").innerHTML =
      '<div class="empty">' +
        '<div class="e1">还没有数据</div>' +
        '<div class="e2">点右上角「载入数据」，选择项目里的 data/app_data.json；<br>或者直接把那个文件拖进这个窗口。</div>' +
      '</div>';
  }

  // ---------------------------------------------------------------
  // 取当前视图的事件列表
  // ---------------------------------------------------------------
  //: 「視頻」不是数据里的分区，是个跨分区的筛选视图：凡是带视频的都收进来
  var VIDEO_SECTION = "視頻";

  function allStories(){
    if(!state.data) return [];
    var out = (state.data.headlines || []).slice();
    (state.data.sections || []).forEach(function(sec){
      out = out.concat(sec.items || []);
    });
    return out;
  }

  function videoStories(){
    var seen = {};
    return allStories().filter(function(s){
      if(!s.video || seen[s.id]) return false;
      seen[s.id] = 1;
      return true;
    }).sort(function(a, b){
      return String(b.published_at || "").localeCompare(String(a.published_at || ""));
    });
  }

  function currentStories(){
    if(!state.data) return [];
    if(state.trend) return [];   // 热搜视图没有事件，方向键不该在这里挪
    if(state.section === VIDEO_SECTION) return videoStories();
    if(state.section){
      var sec = state.data.sections.filter(function(s){ return s.name === state.section; })[0];
      return sec ? sec.items : [];
    }
    return state.data.headlines || [];
  }

  // 当前选中的热搜榜；没选返回 null
  function currentBoard(){
    if(!state.data || !state.trend) return null;
    var boards = (state.data.trending && state.data.trending.boards) || [];
    for(var i=0;i<boards.length;i++) if(boards[i].key === state.trend) return boards[i];
    return null;
  }

  function findStory(id){
    var list = currentStories();
    for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
    // 跨区查找（详情里点关联报道时可能不在当前列表）
    if(state.data){
      var all = (state.data.headlines || []).concat(
        (state.data.sections || []).reduce(function(a,s){ return a.concat(s.items || []); }, [])
      );
      for(var j=0;j<all.length;j++) if(all[j].id === id) return all[j];
    }
    return null;
  }

  // ---------------------------------------------------------------
  // 渲染：侧栏
  // ---------------------------------------------------------------
  function renderSidebar(){
    var d = state.data;
    if(!d){ return; }
    var html = "";

    html += '<div class="sb-group">版面</div>';
    html += sbItem("今日要闻", (d.headlines||[]).length, !state.section && !state.trend, false, null);
    html += sbItem("視頻", videoStories().length, state.section === VIDEO_SECTION, false, VIDEO_SECTION);
    html += sbItem("直播", (d.live||[]).length, false, false, "__live__");

    if((d.sections||[]).length){
      html += '<div class="sb-group">分区</div>';
      d.sections.forEach(function(s){
        html += sbItem(s.name, (s.items||[]).length, state.section === s.name, false, s.name);
      });
    }

    var boards = (d.trending && d.trending.boards) || [];
    if(boards.length){
      html += '<div class="sb-group">熱搜</div>';
      boards.forEach(function(b){
        var n = b.count || (b.items||[]).length;
        html += '<div class="sb-item' + (state.trend === b.key ? " on" : "") +
                '" data-trend="' + esc(b.key) + '">' +
                  '<span>' + esc(b.display) + '</span>' +
                  '<span class="cnt">' + n + '</span>' +
                '</div>';
      });
    }

    if((d.live||[]).length){
      html += '<div class="sb-group">直播频道</div>';
      d.live.forEach(function(ch, i){
        html += '<div class="sb-item" data-live="' + i + '">' +
                  '<span class="sb-dot" style="' + (ch.live_status === 1 ? "" : "background:var(--t3)") + '"></span>' +
                  '<span>' + esc(ch.name) + '</span>' +
                  (ch.live_status === 1 ? '<span class="sb-live-tag">直播中</span>' : '') +
                '</div>';
      });
    }

    if(d.sources && d.sources.length){
      html += '<div class="sb-group">来源</div>';
      d.sources.forEach(function(s){
        html += '<div class="sb-item" style="cursor:default;color:var(--t3)">' + esc(s.display || s.name) + '</div>';
      });
    }

    $("sidebar").innerHTML = html;
  }

  function sbItem(label, count, active, live, key){
    var cls = "sb-item" + (active ? " on" : "");
    var attr = key === null ? 'data-plain="1"' : (key === "__live__" ? 'data-live-open="1"' : 'data-sec="' + esc(key) + '"');
    return '<div class="' + cls + '" ' + attr + '>' +
             (live ? '<span class="sb-dot"></span>' : '') +
             '<span>' + esc(label) + '</span>' +
             '<span class="cnt">' + count + '</span>' +
           '</div>';
  }

  // ---------------------------------------------------------------
  // 渲染：列表
  // ---------------------------------------------------------------
  function renderList(){
    if(state.trend){ renderTrendList(); return; }

    var list = currentStories();
    $("listTitle").textContent = state.section || "今日要闻";
    $("listCount").textContent = list.length + " 个事件";

    if(!list.length){
      $("listScroll").innerHTML = '<div class="empty"><div class="e1">这个分区还没有内容</div></div>';
      return;
    }

    var html = "";

    // 今日速览：只挂在「今日要闻」顶部，分区里不重复出现
    if(!state.section && !state.trend) html += briefCardHtml();

    list.forEach(function(s, i){
      var isHead = !state.section && i === 0;
      html += '<div class="row' + (isHead ? " head" : "") + (s.id === state.storyId ? " on" : "") +
              '" data-story="' + esc(s.id) + '">' +
                '<h3>' + esc(s.title) + '</h3>' +
                (s.digest || s.summary_short || s.summary
                  ? '<p>' + esc(s.digest || s.summary_short || s.summary) + '</p>' : '') +
                metaHtml(s) +
              '</div>';
    });
    $("listScroll").innerHTML = html;
  }

  function metaHtml(s){
    var parts = [];
    if(s.category) parts.push('<span class="cat">' + esc(s.category) + '</span>');
    if(s.video) parts.push('<span class="vtag">▶ 視頻</span>');
    if(s.published_at) parts.push('<span>' + esc(fmtTime(s.published_at)) + '</span>');
    if((s.size || 1) > 1) parts.push('<span class="n">' + s.size + ' 篇报道</span>');
    if(s.source_display) parts.push('<span>' + esc(s.source_display) + '</span>');
    return '<div class="meta">' + parts.join('<span class="sep"></span>') + '</div>';
  }

  // 今日速览：头条里挑出互不重复的几条，点一条直接跳过去
  function briefCardHtml(){
    var b = state.data && state.data.brief;
    if(!b || !b.items || !b.items.length) return "";
    var html = '<div class="briefcard">' +
      '<div class="bh"><b>速覽</b><small>' + esc(b.lead || "") + '</small></div>';
    b.items.forEach(function(it){
      html += '<button class="bi" data-story="' + esc(it.id) + '">' +
                '<span class="s">' + esc(it.section || "") + '</span>' +
                '<span class="t">' + esc(it.line || it.title) + '</span>' +
              '</button>';
    });
    return html + '</div>';
  }

  // 热搜榜：分类分组 + 排名 + 关键词 + 摘要。点一条看摘要，不跳站
  function trendRow(it, idx){
    var sub = [];
    if(it.heat) sub.push(fmtCount(it.heat));
    if(it.meta) sub.push(it.meta);
    // 分组展示时用组内序号，避免出现 1 2 4 5 9 这种断号
    var no = idx == null ? it.rank : idx;
    return '<div class="trow' + (no <= 3 ? " top" : "") +
           (state.trendItem === it.rank ? " on" : "") +
           '" data-trend-item="' + it.rank + '">' +
             '<span class="rk">' + no + '</span>' +
             '<span class="tx"><b>' + esc(it.title) + '</b>' +
               (it.summary ? '<span class="sm">' + esc(it.summary) + '</span>' : '') +
               (sub.length ? '<small>' + esc(sub.join(" · ")) + '</small>' : '') +
             '</span>' +
             (it.label ? '<span class="tag">' + esc(it.label) + '</span>' : '') +
           '</div>';
  }

  function renderTrendList(){
    var b = currentBoard();
    $("listTitle").textContent = b ? b.display : "熱搜";
    if(!b){
      $("listCount").textContent = "";
      $("listScroll").innerHTML = '<div class="empty"><div class="e1">这个榜暂时没数据</div></div>';
      return;
    }
    var items = b.items || [];
    $("listCount").textContent = items.length + " 条";

    if(!items.length){
      $("listScroll").innerHTML = '<div class="empty"><div class="e1">这个榜暂时没数据</div></div>';
      return;
    }

    var html = "";
    if(b.grouped && b.groups && b.groups.length){
      // 平台自带分类（微博），按时政 → 民生 → 娱乐 → 体育 → 财经科技 → 其他 排
      b.groups.forEach(function(g){
        html += '<div class="tgroup"><span>' + esc(g.group) + '</span>' +
                '<span class="n">' + g.count + '</span></div>';
        html += (g.items || []).map(function(it, i){ return trendRow(it, i + 1); }).join("");
      });
    } else {
      html = items.map(trendRow).join("");
    }
    $("listScroll").innerHTML = html;
  }

  // 窄屏详情页左上角的返回按钮。桌面端靠 CSS 隐藏
  function backBtnHtml(){
    return '<button class="backbtn" data-back="1">' +
             '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
               'stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5 8 12l6.5 5.5"/></svg>' +
             '<span>返回列表</span>' +
           '</button>';
  }

  // 窄屏从详情退回列表，并把刚才那条滚回视野
  function backToList(){
    $("main").classList.remove("split");
    var node = document.querySelector('.row[data-story="' + CSS.escape(state.storyId || "") + '"]');
    if(node && node.scrollIntoView) node.scrollIntoView({ block: "center" });
  }

  // ---------------------------------------------------------------
  // 渲染：详情
  // ---------------------------------------------------------------
  function renderDetail(){
    if(state.trend){ renderTrendDetail(); return; }

    var s = state.storyId ? findStory(state.storyId) : null;
    if(!s){
      $("detail").innerHTML =
        '<div class="empty">' +
          '<div class="e1">选择一个事件</div>' +
          '<div class="e2">从中间列表点一条新闻，或按 ↑ ↓ 切换</div>' +
        '</div>';
      return;
    }

    var html = '<div class="detail-inner">' + backBtnHtml();

    // 标题在左，操作按钮钉右上角（窄屏由 CSS 挪到标题上方）
    html += '<div class="dhead"><div class="dhead-main">';
    if(s.category) html += '<div class="kicker">' + esc(s.category) + '</div>';
    html += '<h1>' + esc(s.title) + '</h1>';
    html += '</div><div class="dactions">';
    html += '<button class="act" data-listen="1" title="用系统语音朗读这一条">听新闻</button>';
    if(s.url){
      html += '<button class="act primary" data-url="' + esc(s.url) +
              '" title="在浏览器打开原文">看原文</button>';
    }
    html += '<button class="act" data-live-open="1" title="跳到直播频道">看直播</button>';
    html += '</div></div>';

    var by = [];
    if(s.source_display) by.push(esc(s.source_display));
    if(s.published_at) by.push(esc(fmtTime(s.published_at)));
    if((s.size || 1) > 1) by.push('<span style="color:var(--accent);font-weight:550">' + s.size + ' 篇报道</span>');
    html += '<div class="byline">' + by.join('<span class="sep"></span>') + '</div>';

    var lead = s.summary || s.digest;
    if(lead) html += '<div class="lead">' + esc(lead) + '</div>';

    // 视频：源站给了直链就内嵌播；没给就整块不渲染，不留空框
    if(s.video){
      html += '<div class="vwrap">' +
                '<video controls playsinline preload="metadata"' +
                  (s.video_poster ? ' poster="' + esc(s.video_poster) + '"' : '') +
                  ' src="' + esc(s.video) + '"></video>' +
                '<div class="vfallback" hidden>这段视频在当前浏览器里播不了（编码或跨域限制），' +
                  '<a href="' + esc(s.video) + '" target="_blank" rel="noopener">在新窗口打开</a></div>' +
                '<div class="vsrc">▶ <b>' + esc(s.source_display || "來源") + '</b>' +
                  '<span>原片，未轉載</span>' +
                  '<a href="' + esc(s.video) + '" target="_blank" rel="noopener">新窗口</a></div>' +
              '</div>';
    }

    // 速览：正文里抽 3 句。抽不满 2 句就不显示，宁缺勿滥
    if(s.points && s.points.length >= 2){
      html += '<div class="brief"><div class="bh"><i></i>AI 速覽</div><ol>' +
                s.points.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("") +
              '</ol><div class="note">由正文自動抽取的關鍵句，未改寫；完整內容見下方全文。</div></div>';
    }

    if(s.body && s.body.trim()){
      var paras = s.body.split(/\n+/).map(function(p){ return p.trim(); }).filter(Boolean);
      html += '<div class="prose">' + paras.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join("") + '</div>';
    } else {
      html += '<div class="hint">（该源未提供正文，请点右上角「看原文」）</div>';
    }

    // 转载说明：正文是别人写的，出处和链接都摆出来
    if(s.body && s.body.trim()){
      var sn = ['轉載自 <b>' + esc(s.source_display || s.source || "原媒體") + '</b>'];
      html += '<div class="source-note"><div class="sn1">' + sn.join("") +
                (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">原文連結</a>' : '') +
              '</div><div class="sn2">版權歸原作者及原媒體所有，僅供個人閱讀，不作商業用途。</div></div>';
    }

    // 多源：同一件事各家怎么说，说法相近的已经合并成一条
    if(s.cross && s.cross.angles && s.cross.angles.length > 1){
      html += '<div class="cross"><div class="ch">多源怎麼說 · 共 ' + s.cross.total + ' 篇</div>';
      s.cross.angles.forEach(function(a){

        html += '<div class="ca"><div class="cp">' + esc(a.point) + '</div>' +
                (names.length
                  ? '<div class="cs">' + names.map(function(n){ return '<span>' + esc(n) + '</span>'; }).join("") + '</div>'
                  : '') +
                '</div>';
      });
      html += '</div>';
    }

    html += pagerHtml();

    if(s.items && s.items.length > 1){
      html += '<div class="related"><div class="rh">同一事件 ' + s.items.length + ' 篇报道</div>';
      s.items.forEach(function(it){

      html += '<div class="kws">关键词：' + esc(s.keywords.join("、")) + '</div>';

  // 视频挂了要给退路：有些浏览器/网络环境下 mp4 播不了，
  // 这时至少留一个「在新窗口打开」的出口，而不是一块黑屏
  function wireVideo(){
    var v = document.querySelector("#detail .vwrap video");
    if(!v) return;
    var show = function(){
      var f = document.querySelector("#detail .vfallback");
      if(f) f.hidden = false;
    };
    v.addEventListener("error", show);
    if(v.error) show();
  }

  // 上一篇 / 下一篇：在当前列表里挪一格（键盘 ↑↓ 走的是同一套逻辑）
  function pagerHtml(){
    var list = currentStories();
    var idx = -1;
    for(var i=0;i<list.length;i++) if(list[i].id === state.storyId){ idx = i; break; }
    if(idx < 0 || list.length < 2) return "";

    var prev = idx > 0 ? list[idx-1] : null;
    var next = idx < list.length-1 ? list[idx+1] : null;

    return '<div class="pager">' +
      '<button class="pg" data-pg="-1"' + (prev ? ' title="' + esc(prev.title) + '"' : ' disabled') + '>' +
        (prev ? '‹ ' + esc(prev.title) : '‹ 上一篇') + '</button>' +
      '<span class="pgn">' + (idx+1) + ' / ' + list.length + '</span>' +
      '<button class="pg" data-pg="1"' + (next ? ' title="' + esc(next.title) + '"' : ' disabled') + '>' +
        (next ? esc(next.title) + ' ›' : '下一篇 ›') + '</button>' +
    '</div>';
  }

  function goSibling(delta){
    var list = currentStories();
    if(!list.length) return;
    var idx = -1;
    for(var i=0;i<list.length;i++) if(list[i].id === state.storyId){ idx = i; break; }
    if(idx < 0) idx = 0;
    idx += delta;
    if(idx < 0 || idx >= list.length) return;
    state.storyId = list[idx].id;
    renderList();
    renderDetail();
    var node = document.querySelector('.row[data-story="' + CSS.escape(state.storyId) + '"]');
    if(node) node.scrollIntoView({ block: "nearest" });
  }

  function render(){
    renderSidebar();
    renderList();
    renderDetail();

  // 热搜详情：点了某一条就展示它的摘要；没选就展示榜单概览
  function renderTrendDetail(){
    var b = currentBoard();
    if(!b){
      $("detail").innerHTML = '<div class="empty"><div class="e1">这个榜暂时没数据</div></div>';
      return;
    }
    var items = b.items || [];
    var stamp = (state.data.trending && state.data.trending.generated_at) || "";

    // ① 选中了具体一条
    if(state.trendItem != null){
      var it = null;
      for(var i=0;i<items.length;i++) if(items[i].rank === state.trendItem){ it = items[i]; break; }
      if(it){
        var platform = (b.display || "").replace("熱搜", "").replace("热门", "");
        // 分组时序号是组内序号，和左边列表保持一致
        var no = it.rank;

          b.groups.forEach(function(g){
            (g.items || []).forEach(function(x, i){ if(x.rank === it.rank) no = i + 1; });
          });
        }

        html += '<div class="actions">' +

                  '<button class="btn ghost" data-copy-kw="' + esc(it.title) + '">复制关键词</button>' +

        html += '<div class="kws">摘要来自搜索引擎的公开结果，不是平台正文，' +
                '也不含任何登录态内容。想看完整讨论、评论数，再点上面的按钮。</div>';
        html += '</div>';
        $("detail").innerHTML = html;
        $("detail").scrollTop = 0;

    // ② 榜单概览
    var h = '<div class="detail-inner">';
    h += '<div class="kicker">熱搜</div>';
    h += '<h1>' + esc(b.display) + '</h1>';
    h += '<div class="byline">' + items.length + ' 条' +
         '<span class="sep"></span>' + esc("抓取于 " + fmtStamp(stamp)) + '</div>';
    h += '<div class="lead">这是「大家正在搜什么」的参考，不是新闻本身。' +
         '点左边任意一条，右边会显示这一条的一句话摘要。</div>';

    if(b.grouped && b.groups && b.groups.length){
      h += '<div class="related"><div class="rh">分类分布</div>';
      b.groups.forEach(function(g){
        h += '<button class="rel" data-trend-group="' + esc(g.group) + '">' +
               '<div class="rt">' + esc(g.group) + '</div>' +
               '<div class="rm">' + g.count + ' 条</div>' +
             '</button>';
      });
      h += '</div>';
    } else if(items.length){
      h += '<div class="related"><div class="rh">前三位</div>';
      items.slice(0, 3).forEach(function(it){
        h += '<button class="rel" data-trend-item="' + it.rank + '">' +
               '<div class="rt">' + it.rank + '. ' + esc(it.title) + '</div>' +
               (it.summary ? '<div class="rm">' + esc(it.summary) + '</div>' : '') +
             '</button>';

    h += '<div class="kws">热搜按平台自己的算法排序，含推广与娱乐内容，' +
         '不代表新闻价值。分类是平台自带的标签，这里按时政 / 民生 / 娱乐 / 体育 / 财经科技 归并。</div>';
