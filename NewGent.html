參與《東張女神盃》跑包尾，被網民攻擊她有機心，是特意跑輸搏訪問，何沛珈否認特登跑輸，只是因為貧血而頭暈，「之前試跑過2次，兩次跑完都要人扶…","summary_short":"何沛珈晚上出席一個慈善籌款晚宴，對於何沛珈昨日在台慶參與《東張女神盃》跑包尾，被網民攻擊她有機心，是特意跑輸搏訪問…","digest":"何沛珈晚上出席一個慈善籌款晚宴，對於何沛珈昨日在台慶參與《東張女神盃》跑包尾…","points":["何沛珈晚上出席一個慈善籌款晚宴，對於何沛珈昨日在台慶參與《東張女神盃》跑包尾…","）我已經冇感覺，無野可以做到，唯有做好自己，我應該都無得罪人","何沛珈表示在台慶後會聯絡俞可程，但暫時太累"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T21:45:17+08:00","size":1,"keywords":[],"body":"何沛珈晚上出席一個慈善籌款晚宴，對於何沛珈昨日在台慶參與《東張女神盃》跑包尾，被網民攻擊她有機心，是特意跑輸搏訪問，何沛珈否認特登跑輸，只是因為貧血而頭暈，「之前試跑過2次，兩次跑完都要人扶，Toby（陳庭欣）都見到我臉青，我都好擔心跑唔到，跑之前已經食好多野，又有食朱古力和飲能量飲品。（網民經常攻擊妳會不開心？）我已經冇感覺，無野可以做到，唯有做好自己，我應該都無得罪人。」\n何沛珈未搵「情敵」俞可程 \n對於《女神配對計劃2》」俞可程（Kanis）於參與配對節目期間被網民捕獲她與一名男子並肩同行、舉止親密，質疑她「騎牛搵馬」。何沛珈表示在台慶後會聯絡俞可程，但暫時太累。今日又多工作，所以仍未找她。\n陳庭欣真拍拖何沛珈會恭喜\n至於有傳陳庭欣與從事電燈生意Gary拍拖半年，男方在4、5個月前才與前妻完成離婚手續，何沛珈卻表示不知道，但如果是真的會恭喜她，「之前Bob話搞個《鑽石配對計劃》，如果她成功出pool就不用預她。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c060fab8607","title":"周末好去處︳愛創 Life is ARTsome社藝合作展 多元媒介藝術裝置 免費入場","url":"https://www.stheadline.com/lifetips/3639414/周末好去處愛創-Life-is-ARTsome社藝合作展-多元媒介藝術裝置-免費入場","summary":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑。","summary_short":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑。","digest":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑","points":["藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑","適逢基督教香港信義會社會服務部踏入五十周年，機構特別於石硤尾賽馬會創意藝術中心（JCCAC）…","這場別具意義的展覽匯聚了七組本地藝術家，與來自不同年齡層…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:45:53+08:00","size":1,"keywords":[],"body":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑。適逢基督教香港信義會社會服務部踏入五十周年，機構特別於石硤尾賽馬會創意藝術中心（JCCAC）舉辦「愛創 Life is ARTsome」社藝合作展。這場別具意義的展覽匯聚了七組本地藝術家，與來自不同年齡層、文化及生活背景的服務使用者同行整整一年，透過陶藝、光影、互動影像以至人工智能（AI）等多元媒介，共同創作出七組大型藝術裝置，將一個個觸動人心的生命故事化為可見可感的藝術語言。\n\n七件有溫度的作品\n走進展場，七件作品各有溫度與張力。在天幕裝置《風簾》中，張瑋晉與戒毒康復者攜手合作，讓微風吹動簾幕，象徵跨越掙扎後的重獲新生與希望；《屋企在途中》則由葉雯、陳朗丰與過渡性房屋居民運用AI與藝術共創，勾勒出基層家庭在安居路上的期盼與對「家」的想像。面對人口老化與照顧壓力，曾翠珊、林志輝與金齡長者及照顧者打造了互動影像《凝‧聽日常》，引領觀眾細味平凡生活中的深情陪伴；而黃翠雯與殘疾人士合作的陶泥板作品《手心裏的雙重奏》，則以雙手觸感記錄彼此默契，展現生命的韌力與尊嚴。\n此外，年輕一代與育兒家庭的心聲亦在展場中綻放光芒。林若曦與青少年透過光影藝術《動態皮影誌》，投射出成長路上的迷惘與蛻變；朱頌琪與幼兒照顧者創作的懸空裝置《我一嚿雲》，宛如為忙碌的照顧者提供一片喘息與放空的溫柔天空；劉清華則帶領幼兒學生以定格動畫《小小小小大冒險》，展現孩童純真眼界裏的無窮創意。\n除了七組社藝共創裝置，同場更設有「感動‧敢動 Love Creates」特別展區，展出多件信義會社會服務五十周年的重點標誌物。這些由前線同工精心挑選的日常物件，表面看似平凡無奇，背後卻盛載着半個世紀以來人與人之間最真摯的連結。\n「愛創 Life is ARTsome」社藝合作展展期由即日起至2026年11月23日，免費開放予公眾參觀。大家不妨抽空走進石硤尾JCCAC，在光影與創作之間放慢腳步，聆聽這群共創者真誠的生命故事，感受藝術與社會服務交織而成的溫暖力量。\n\nINFO\n日期： 即日至11月23日（星期一）\n時間： 星期一至四 10:30 - 17:30｜星期五至日 10:30 - 20:00\n地點： 石硤尾白田街30號賽馬會創意藝術中心（JCCAC）L0、L1藝廊及中庭（港鐵石硤尾站C出口）\n費用： 免費入場\n詳情： https://50th.elcss.org.hk/life-is-artsome","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7a32f253a6","title":"玫瑰戰爭劇情懶人包｜1-9集劇透率先睇 楊茜堯攜陳自瑤日記復仇 陳豪林夏薇各懷鬼胎","url":"https://www.stheadline.com/film-drama/3633144/玫瑰戰爭劇情懶人包1-9集劇透率先睇-楊茜堯攜陳自瑤日記復仇-陳豪林夏薇各懷鬼胎","summary":"TVB 59周年重頭台慶劇《玫瑰戰爭》由楊茜堯、陳豪、林夏薇、馬國明和陳展鵬等超強視帝視后陣容主演。","summary_short":"TVB 59周年重頭台慶劇《玫瑰戰爭》由楊茜堯、陳豪、林夏薇、馬國明和陳展鵬等超強視帝視后陣容主演。","digest":"TVB 59周年重頭台慶劇《玫瑰戰爭》由楊茜堯、陳豪、林夏薇…","points":["TVB 59周年重頭台慶劇《玫瑰戰爭》由楊茜堯、陳豪、林夏薇…","故事改編自才女編劇吳沚默的小說《維多利亞的派對》…","劇集將於11月9日起逢星期一至五晚上8:30於翡翠台隆重首播，而騰訊視頻…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:32:00+08:00","size":1,"keywords":[],"body":"TVB 59周年重頭台慶劇《玫瑰戰爭》由楊茜堯、陳豪、林夏薇、馬國明和陳展鵬等超強視帝視后陣容主演。故事改編自才女編劇吳沚默的小說《維多利亞的派對》，以一記驚悚的「影后自殺案」揭開娛樂圈繁華背後的資本遊戲與人性陰暗面。劇集將於11月9日起逢星期一至五晚上8:30於翡翠台隆重首播，而騰訊視頻、極光TV全網提早在11月6日首播。《星島頭條》為大家持續更新《玫瑰戰爭》劇情懶人包，包括詳細劇情大綱、角色人物介紹等，助你緊貼最新劇透、每集劇情發展！\n《玫瑰戰爭》故事大綱\n《玫瑰戰爭》核心人物關係表\n《玫瑰戰爭》3大必睇爆點\n《玫瑰戰爭》精彩劇照\n《玫瑰戰爭》1-5集劇情\n《玫瑰戰爭》6-9集劇情\n《玫瑰戰爭》故事大綱\n故事由一封神秘信件揭開序幕：曾經在娛樂圈叱咤一時的好姊妹團成員關子盈（陳自瑤 飾），在七年前被判定為「自殺」身亡。七年後，當年姊妹團成員不約而同收到一封寫著「I know what you did.（我知道你做過什麼）」的神秘信件，令所有人驚惶失措。因為眾人皆知，關子盈的死其實另有內情，在場每個人都牽涉其中！\n與此同時，關子盈生前閨密夏無雙（楊茜堯 飾）帶著子盈的日記強勢復出。她以法國片廠代表身分，與娛樂圈大老闆陳雲生（陳豪 飾）聯手開拍新戲《玫瑰》，目的就是要佈局逼當年有份害死子盈的「好姊妹」現身，一場血雨腥風的娛樂圈復仇戰正式爆發！\n相關閱讀：吳沚默小說改編成TVB台慶劇《玫瑰戰爭》 認劇情影射娛圈黑幕 曾自爆遭導演夜邀入房\n返回目錄\n《玫瑰戰爭》核心人物關係表\n 角色名稱 演員 角色設定 / 關係 夏無雙 楊茜堯 復仇女主角。重情重義、氣場極強。為查出好姊妹關子盈死因，重返娛圈實行剝洋蔥式復仇。 陳雲生 陳豪 「天誠娛樂」幕後大老闆。權力通天、掌控男女明星命運，背後似乎藏有更深的秘密。 關子盈 陳自瑤 昔日影后。七年前在離奇情況下「自殺」，其死因是整場復仇計劃的導火線。 李德龍 馬國明 關子盈的舊愛。後來與夏無雙聯手揭開真相，並暗中調查娛樂公司內部的權錢交易。 藍鳳儀 姚子羚 最強金牌經理人。奉行娛圈生存法則：「少說話多做事、軟硬兼施、顧全大局」。 何家俊 陳展鵬 豪門何家富三代、梁菲雅老公。一直過着富裕生活，受制於家規，沒有實權。 梁菲雅 傅嘉莉 「千億新抱」兼女明星。情緒起伏極大，與關子盈之死有重大嫌疑，劇中有不少掌摑戲份。 黎綺雲 林夏薇 昔日姊妹團成員，如今與夏無雙明爭暗鬥，角色亦正亦邪。 林安安 鄺潔楹 姊妹團成員之一，內心同樣藏有不可告人的秘密 。 返回目錄\n《玫瑰戰爭》3大必睇爆點\n 娛樂圈「最真實、最黑暗」一面\n\n監製鍾澍佳直言，雖然拍過許多職場劇，但原來「最黑暗的職場就是娛樂圈」。劇中情節大膽影射不少觀眾熟知的娛樂圈真實大事件、家族爭奪、潛規則同埋錢權交易。\n 楊茜堯x陳豪：《宮心計》後相隔 17 年再合作\n\n今次是兩位視帝視后繼《宮心計》後，相隔了 17 年再度同台交手！楊茜堯在劇中氣場全開，而陳豪則飾演心機極深的幕後大老闆，兩人互相試探、勾心鬥角，劇迷絕對可以過足戲癮。\n 大結局「7分鐘一鏡到底」神級演技\n\n楊茜堯與佳導都預告，大結局會有一場長達 7 分鐘、一鏡到底的超高難度爆發戲份。佳導更揚言其震撼度比起《新聞女王》有過之而無不及，絕對是年度演技天花板！\n返回目錄\n《玫瑰戰爭》精彩劇照\n返回目錄\n《玫瑰戰爭》1-5集劇情\n楊茜堯飾演的復仇女神「夏無雙」因意外獲得亡友日記，決心為七年前離奇投海自盡的影后摯友關子盈（陳自瑤 飾）討回公道，正式向當年有份加害子盈的「名媛姊妹團」宣戰 ！無雙藉開拍新片《玫瑰》成功拉攏「天誠娛樂」幕後大老闆陳雲生（陳豪 飾）合作，並聯手子盈昔日地下情人李德龍（馬國明 飾）暗中調查，步步為營地重現子盈生前遭遇的種種「意外」 。在無雙的精密佈局下，昔日「塑料姊妹花」人人自危，由林夏薇飾演的當家一姐「黎綺雲」不僅被揭發當年利用道具槍意外上位，更在片場慘遇重創而被無雙奪去女主角寶座 ；而金牌經理人藍鳳儀（姚子羚 飾）與名媛林安安（鄺潔楹 飾）更被扯出當年曾以「迷姦水」設局出賣子盈、逼其陪客的娛樂圈最黑暗黑幕，徹底撕開名利場下的醜陋面具 ！與此同時，無雙更指使女記者暗中誘惑何氏集團公子何家俊（陳展鵬 飾），企圖藉婚外情一手摧毀千億新抱梁菲雅（傅嘉莉 飾）的豪門婚姻，一場交織著名利、背叛與血色復仇的恩怨風暴，正式席捲整個娛樂圈 ！\n相關閱讀：《玫瑰戰爭》驚現「迷姦水」情節 陳自瑤慘遭姚子羚鄺潔楹出賣 神志不清被送上床陪客\n玫瑰戰爭第一集線上看劇情｜9/11 首播「影后之殤」：陳自瑤投海命案拉開序幕！楊茜堯攜復仇日記強勢回歸\n夏無雙（楊茜堯 飾）與昔日影后關子盈（陳自瑤 飾）本是識於微時的摯友，豈料七年前傳出子盈投海自盡的噩耗，震驚全城 。七年過去，無雙意外獲得子盈留下的絕密日記，驚悉好姊妹當年並非輕生，而是背後另有極其悲慘的黑幕！為了追查真相並為亡友復仇，無雙以法國片廠亞太區代表的身份高調重返娛樂圈，藉合拍經典遺作電影《玫瑰》為餌，主動聯絡「天誠娛樂」大老闆陳雲生（陳豪 飾）洽談合作。與此同時，無雙與子盈當年的好姊妹黎綺雲（林夏薇 飾）、藍鳳儀（姚子羚 飾）、梁菲雅（傅嘉莉 飾）及林安安（鄺潔楹 飾）重遇，並答應擔任由她們四人主持的熱門綜藝節目嘉賓。深信子盈被逼上絕路與四女脫不了關係的無雙，決定將計就計；在節目錄影期間，現場驚現連串怪事，彷彿有人在暗中佈局，一步步逼使作賊心虛的四女當眾自揭瘡疤 ！\n相關閱讀：鄺潔楹演《玫瑰戰爭》遭狠批演技唔夠班 親回網民態度獲盛讚 性格啱晒做狠毒妹？\n玫瑰戰爭第二集線上看劇情｜10/11 播出「槍聲背後」：錄影現場驚現自殘血案！林夏薇憶道具槍調包上位史\n綜藝節目錄影期間意外頻生，昔日「塑料姊妹花」紛紛將矛頭直指是夏無雙（楊茜堯 飾）在背後作梗 。無雙堅決否認，甚至不惜在眾人面前以自殘方式力證清白，因而受傷送院，連子盈的秘密情人李德龍（馬國明 飾）亦開始對此事起疑 。眾女前往探望無雙時，無意中透露大家都收到由子盈署名的神祕指控信件，一時間人人自危 。黎綺雲（林夏薇 飾）看著信件，不禁勾起七年前的陰暗往事：當年子盈深受陳雲生（陳豪 飾）重用，屈居其下的綺雲在拍攝時意外開槍擊傷子盈，導致子盈被踢出劇組，而自己則順理成章向雲生自薦，一步步爬上「天誠一姐」的寶座。事實上，綺雲當年早已察覺道具槍有異樣，卻選擇隱瞞真相。無雙與雲生前往片場探班商討電影《玫瑰》合作時，經理人藍鳳儀（姚子羚 飾）自覺被冷落，宛如陪襯。正當拍攝進行得如火如荼之際，綺雲的片場竟然再度發生恐怖意外 ！\n玫瑰戰爭第三集線上看劇情｜11/11 播出「奪愛佈局」：林夏薇女主角地位被奪！楊茜堯暗中設局踢爆傅嘉莉豪門婚姻\n夏無雙（楊茜堯 飾）憶起昔日往事，原來關子盈（陳自瑤 飾）曾與李德龍（馬國明 飾）發展地下情，子盈意外懷孕後選擇隱瞞真相，獨自誕下私生女莊寶兒（陳星妤 飾）。另一邊廂，在片場身受重傷的黎綺雲（林夏薇 飾），驚悉自己的新戲女主角位置已悄悄被無雙取代，悲憤之下向大老闆陳雲生（陳豪 飾）據理力爭，要求對方主持公道 。與此同時，何氏集團富二代何家俊（陳展鵬 飾）與雜誌社總編輯楊素希（陳楨怡 飾）重逢，兩人一見如故 。原來這一切全在無雙的掌握之中，她暗中指使素希主動接近家俊，誓要將梁菲雅（傅嘉莉 飾）與家俊的豪門婚姻徹底粉碎！寶兒低調返港，因聯手制伏劫匪而與生父德龍結緣。素希依計行事，成功令家俊對其產生依賴並大吐苦水，吐露對菲雅及婚姻名存實亡的不滿；而看到德龍無奈賣車度日的菲雅，心中亦百般不是滋味 。\n相關閱讀：玫瑰戰爭｜陳楨怡演「最強小三」床戰陳展鵬 九頭身超級學霸 港姐亞軍曾攞武術金牌\n玫瑰戰爭第四集線上看劇情｜12/11 播出「妒恨交織」：馬國明痛憶與陳自瑤甜蜜往昔！傅嘉莉因愛成恨爆發「掌摑戲」公報私仇\n李德龍（馬國明 飾）從夏無雙（楊茜堯 飾）處取回關子盈（陳自瑤 飾）的遺物，睹物思人，痛心回想起當年與子盈地下情的甜蜜點滴。原來，豪門媳婦梁菲雅（傅嘉莉 飾）多年前早已情傾德龍，當得知德龍心中只有子盈後，竟在拍攝期間假戲真做、藉故公報私仇，隨後子盈更無端深陷毀滅性的醜聞風波。即使子盈當年醜聞纏身，天誠大老闆陳雲生（陳豪 飾）卻依然對她無限包容，此舉令暗戀雲生的金牌經理人藍鳳儀（姚子羚 飾）妒火中燒，埋下決裂伏線。七年後，雲生計劃傾全力推動串流平台，鳳儀藉此向無雙明言自己無暇參演新片《玫瑰》，更透露黎綺雲（林夏薇 飾）與菲雅亦已推辭拍攝，令無雙的復仇大計頓時陷入僵局。另一邊廂，雲生欲拉攏何氏基金合作，卻遭主席何永康（潘志文 飾）當眾奚落。無雙看準雲生急需翻盤的心理，深信這次打擊必能逼使雲生加速落實開拍《玫瑰》！\n玫瑰戰爭第五集線上看劇情｜13/11 播出「玫瑰有刺」：楊茜堯林夏薇試戲演技大爆發！傅嘉莉捉姦反被陳展鵬痛罵\n新片《玫瑰》試戲場上，夏無雙（楊茜堯 飾）與黎綺雲（林夏薇 飾）正面交鋒，二人演技火花四濺，大老闆陳雲生（陳豪 飾）當場拍板由綺雲擔綱女主角。豪門恩怨同時升級，梁菲雅（傅嘉莉 飾）遭家翁何永康（潘志文 飾）訓斥未能留住丈夫何家俊（陳展鵬 飾）的心，菲雅敢怒不敢言。無雙看準時機，使計激發菲雅的演戲欲望，令她動搖並考慮接拍《玫瑰》以求自立。此時，私生女莊寶兒（陳星妤 飾）向李德龍（馬國明 飾）透露自己獲邀加盟天誠娛樂，德龍一邊隱瞞父女關係，一邊以「朋友」的經歷好言相勸；而德龍原定參演《玫瑰》的角色，卻突然被雲生無情抽起。家俊因菲雅故意在第三者楊素希（陳楨怡 飾）面前宣示主權而徹底暴怒，與菲雅爆發激烈爭吵。崩潰醉酒的菲雅無助地前往尋找德龍哭訴；與此同時，心機深重的素希正偷偷拍下與家俊的親密床照，為何家的豪門風暴埋下致命炸彈！\n返回目錄\n《玫瑰戰爭》6-9集劇情\n夏無雙（楊茜堯 飾）設局逼林安安（鄺潔楹 飾）供出當年落藥內幕，直指金牌經理人藍鳳儀（姚子羚 飾）才是逼關子盈（陳自瑤 飾）接客的背後黑手。與此同時，李德龍（馬國明 飾）質疑海旁遺留的鞋碼與子盈不符，懷疑有人偽造自殺假象，決定與無雙聯手徹查。然而，天誠大老闆陳雲生（陳豪 飾）因豪宅風波被指與鳳儀關係不尋常，更極力壓下舊事。黎綺雲（林夏薇 飾）不甘黑社會背景被揭，更不滿要與豪門媳婦梁菲雅（傅嘉莉 飾）分演《玫瑰》主角而罷拍，其弟黎天明（黃庭鋒 飾）與子盈私生女莊寶兒（陳星妤 飾）則意外同住。那邊廂，何家俊（陳展鵬 飾）與楊素希（陳楨怡 飾）床照曝光導致與菲雅豪門婚姻決裂，更遭父親何永康（潘志文 飾）訓斥。隨後，安安因手握錄有子盈潛規則黑幕的關鍵USB而慘遭車撞昏迷，這段震撼影片最終落入無雙手中，引爆全城風暴！\n相關閱讀：《玫瑰戰爭》劇情與小說情節大對比 陳豪老婆原定係佢？ 睇原著結局預視真兇身份\n玫瑰戰爭第六集線上看劇情｜11/16 播出「黑勢力風暴」：林夏薇被爆黑社會背景！楊茜堯豪花5萬買鄺潔楹上床片\n何家俊（陳展鵬 飾）與楊素希（陳楨怡 飾）一夜激情並拍下床照，家俊驚覺被利用後暴怒，挑明只當素希是秘密情人，此舉令他與梁菲雅（傅嘉莉 飾）的豪門婚姻正式宣告決裂。素希深感破壞菲雅婚姻的任務毫無意義，夏無雙（楊茜堯 飾）卻堅決要求復仇計劃必須繼續！\n另一邊廂，關子盈的私生女莊寶兒（陳星妤 飾）首度與天誠娛樂大老闆陳雲生（陳豪 飾）見面，並獲生哥邀請加盟。李德龍（馬國明 飾）不解生哥為何一直對自己充滿敵意，卻因導演堅持而得以重返《玫瑰》劇組。\n在《玫瑰》新片發佈會上，記者突然收到料，黎綺雲的爸爸是黑社會猛人黎偉雄，這一切正是無雙發現綺雲企圖將醉駕車禍責任推卸給弟弟黎天明（黃庭鋒 飾）後，暗中向傳媒放料的傑作！無雙更在意外聽到林安安（鄺潔楹 飾）借高利貸後，豪花5萬元買下安安被丁丁誘拍的上床影片，迫使生哥與安安解約。無雙表面上將影片還給安安當好人，實則藉機逼供，終令安安崩潰承認：當年正是她親手遞上落藥的酒給關子盈（陳自瑤 飾），而幕後黑手竟是逼子盈去DM28接客的金牌經理人藍鳳儀（姚子羚 飾）！與此同時，鳳儀高達五千萬的豪宅因租客自殺而曝光，其與雲生的曖昧關係再度引發網民起底……\n相關閱讀：玫瑰戰爭｜傅嘉莉惡女上身狂摑陳自瑤 近年演技大躍進 半工讀進修甩「釣金龜」形象\n玫瑰戰爭第七集線上看劇情｜11/17 播出「祼照危機」：姚子羚慘遭黑幫影裸照！陳楨怡床照要脅傅嘉莉\n藍鳳儀（姚子羚 飾）的豪宅鬧出命案，意外被踢爆該幾千萬物業竟是大老闆陳雲生（陳豪 飾）私下所贈！面對外界將其與黎綺雲（林夏薇 飾）作比較的輿論，鳳儀刻意自貶身價以澄清與生哥的關係。\n另一邊廂，心機女楊素希（陳楨怡 飾）變本加厲，竟拿著梁菲雅（傅嘉莉 飾）與李德龍（馬國明 飾）的親密合照，要脅菲雅在家族董事會中通過推廣時尚購物平台的計劃。莊寶兒（陳星妤 飾）不顧夏無雙（楊茜堯 飾）反對，執意加盟天誠娛樂，在前往機場的途中折返並暫住於德龍家，更巧合地與綺雲的弟弟黎天明（黃庭鋒 飾）同住一室。\n復仇戰況愈演愈烈，黎綺雲（林夏薇 飾）終於查出爆料自己父女新聞的始作俑者正是夏無雙（楊茜堯 飾），更驚悉好姐妹藍鳳儀（姚子羚 飾）當年竟然故意放任新聞發酵而不作公關壓制。綺雲聯同黑道父親展開報復，鳳儀隨即慘遭黑社會綁架，並被強行拍下祼照，天誠的權力核心瀕臨崩潰！\n相關閱讀：玫瑰戰爭丨陳自瑤「車震」偷食四線有婦之夫 情節似前TVB小花與已婚男星桃色風波？\n玫瑰戰爭第八集線上看劇情｜11/18 播出「火海驚魂」：林夏薇不滿主角被分演！鄺潔楹驚爆陳自瑤「自殺」假鞋證物\n梁菲雅（傅嘉莉 飾）得知原來是夏無雙（楊茜堯 飾）在背後牽線，讓情敵楊素希順理成章簽約天誠娛樂。與此同時，新片《玫瑰》的導演突然宣布將女主角「一分為二」：由黎綺雲（林夏薇 飾）飾演正角，而梁菲雅則分演惡角。此舉令綺雲感到被極大侮辱，憤而罷拍，其黑道父親亦揚言要為女兒出氣。\n隨後，《玫瑰》拍攝現場意外再度發生，更引發恐怖火警！生死一瞬之際，李德龍（馬國明 飾）英勇衝入火場救出被困的夏無雙（楊茜堯 飾）。\n無雙在德龍家驚見莊寶兒，誤以為德龍欺騙少女感情，寶兒則堅定表示想在香港闖蕩一年。此時，惶恐不安的林安安（鄺潔楹 飾）在收到神秘訊息後向無雙求助，並吐露一個驚天秘密：關子盈（陳自瑤 飾）「投海自殺」後，她曾在黎綺雲的車尾箱內看過子盈的鞋！安安懷疑當年海旁碼頭留下的鞋子只是偽造的假象，一切均是綺雲想造成關子盈自殺的假像！\n相關閱讀：玫瑰戰爭丨鄺潔楹初演反派落藥害閨密 《3日2夜》晒身材上位 出身富裕住獨立屋\n玫瑰戰爭第九集線上看劇情｜11/20 播出「奪命USB」：馬國明質疑鞋碼不同！鄺潔楹出賣片源慘被車撞至昏迷\n李德龍（馬國明 飾）向夏無雙（楊茜堯 飾）指出，當年海旁發現的遺留鞋子與關子盈（陳自瑤 飾）真正的鞋碼根本不符！這一疑點印證了關子盈極有可能是被謀殺而非自殺，二人正式決定聯手徹查當年的死亡真相。\n事情越演越烈，大老闆陳雲生（陳豪 飾）下達鐵令，由現在開始不准任何人再提起當年「DM28」及關子盈的舊事，更親自出面施壓黎綺雲（林夏薇 飾），要她阻止林安安（鄺潔楹 飾）亂說話。\n安安出於信任向綺雲求助，並透露自己手上有當年「DM28」關於關子盈的關鍵錄影 USB。綺雲表面上派人與安安交收，安安卻在最後關頭反悔要求加錢，隨即慘遭打手毆打，更被神秘車輛蓄意撞至昏迷不醒！\n幸而，千鈞一髮之際，裝有震撼黑幕的 USB 最終仍落入無雙手中。無雙看完影片後深受震撼，並直接向綺雲直言安安的意外必定是金牌經理人藍鳳儀（姚子羚 飾）在背後痛下殺手……\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3252fc2bb1","title":"獨家｜林恬兒慶生照遭外洩 發聲明宣布報警處理：私隱被嚴重侵犯","url":"https://www.stheadline.com/film-drama/3639409/獨家林恬兒慶生照遭外洩-發聲明宣布報警處理私隱被嚴重侵犯","summary":"已故富商林百欣孫女、林建岳與謝玲玲的長女林恬兒（Emily），於2014年與已故富商何柱國兒子何正德（Kent）結婚並育有一子一女。","summary_short":"已故富商林百欣孫女、林建岳與謝玲玲的長女林恬兒（Emily），於2014年與已故富商何柱國兒子何正德（Kent）結婚並育…","digest":"已故富商林百欣孫女、林建岳與謝玲玲的長女林恬兒…","points":["已故富商林百欣孫女、林建岳與謝玲玲的長女林恬兒（Emily）…","自今年8月傳出男方在加拿大街頭攬錫新歡、兩人正辦理離婚手續後…","早前網上突然流出一張林恬兒與歌手 JW（王灝兒）富二代舊愛葉韋彤（Tarzan）的私人合照"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:25:16+08:00","size":1,"keywords":[],"body":"已故富商林百欣孫女、林建岳與謝玲玲的長女林恬兒（Emily），於2014年與已故富商何柱國兒子何正德（Kent）結婚並育有一子一女。自今年8月傳出男方在加拿大街頭攬錫新歡、兩人正辦理離婚手續後，近日更爆出林恬兒 iCloud 私人合照遭盜用流出的事件，雙方今日（20日）先後發表聲明，林恬兒更宣布已正式報警處理。\n林恬兒發律師信促何正德交代\n早前網上突然流出一張林恬兒與歌手 JW（王灝兒）富二代舊愛葉韋彤（Tarzan）的私人合照。據了解，葉韋彤是林恬兒弟弟林孝能的好友，而該張流出照片是從林恬兒已刪除的 iCloud 相簿中被非法盜用。事件曝光後，林恬兒早前向正辦理離婚手續的前夫何正德發出律師信，要求對方就照片流出一事作出交代。何正德於今日（20日）較早前發出聲明，指自己「從未管有該照片」。\n相關閱讀：林恬兒私人照流出發律師信促前夫交代 何正德發聲明：從未管有該照片\n林恬兒痛斥私隱受侵犯\n在何正德發聲明否認後，林恬兒今日亦發出個人聲明回應。她在聲明中首次交代該張私人照片是於今年10月慶祝生日時所拍攝，對於照片在未經授權下被公開感到「深切震驚與困擾」，直指事件嚴重侵犯其個人隱私及雲端數據安全，個人生活以此方式被曝光不僅令人心痛，更令她感到不安與威脅。\n相關閱讀：獨家丨林恬兒私照外洩 發律師信促前夫何正德交代 名媛回復單身多人追\n林恬兒已報警處理\n林恬兒強調，在此艱難時刻最關心的是子女的福祉與安全，並感謝朋友及公眾在最需要時給予的支持與理解。她同時宣布，由於事件涉及嚴重且可能構成刑事罪行的行為，她已正式將此事交由警方調查，並表示：「我完全信任執法部門能查明我的個人及雲端數據是如何被非法取閱，以及誰應為散布行為負責。」鑑於事件已進入法律程序，她目前將不會再作進一步評論，並懇請各界尊重其家人的私隱及給予空間。\n林恬兒個人聲明 全文如下\n過去幾天，對於我於2026年10月慶祝生日時拍攝的一張私人照片在未經授權的情況下被公開，我感到深切震驚與困擾。此次事件構成了對我個人隱私及雲端數據安全的嚴重侵犯。\n個人生活以這種方式被曝光，不僅令人心痛，更令我感到不安與威脅。在此艱難時刻，我最關心的是我子女的福祉與安全。\n我衷心感謝朋友們及公眾對我的支持、理解，以及在我最需要的時候與我同行。\n然而，由於此事涉及嚴重且可能構成刑事罪行的行為，我已正式將此事交由警方調查。我完全信任執法部門能查明我的個人及雲端數據是如何被非法取閱，以及誰應為散布行為負責。鑑於此事已進入法律程序，我目前將不會再作進一步評論。\n我懇請傳媒及公眾尊重我一家人的私隱，並在這段艱難時期給予我們所需的空間。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbabd47d0fc","title":"BTS相隔8年高雄開唱吸逾5萬粉 7子狂晒中文RM台語打招呼 Jungkook大讚香腸帶挈攤檔爆紅","url":"https://www.stheadline.com/film-drama/3639399/BTS相隔8年高雄開唱吸逾5萬粉-7子狂晒中文RM台語打招呼-Jungkook大讚香腸帶挈攤檔爆紅","summary":"韓國天團BTS（防彈少年團）昨晚（19日）在高雄世運主場館為《BTS WORLD TOUR ARIRANG》高雄站，舉行頭場演出，吸引53500名ARMY（粉絲名稱）撐場。","summary_short":"韓國天團BTS（防彈少年團）昨晚（19日）在高雄世運主場館為《BTS WORLD TOUR ARIRANG》高雄站…","digest":"韓國天團BTS昨晚在高雄世運主場館為《BTS WORLD TOUR ARIRANG》…","points":["韓國天團BTS（防彈少年團）昨晚（19日）在高雄世運主場館為《BTS WORLD TOUR…","7子以《Hooligan》開場，並配以火焰特效及360度四面舞台，效果震撼，驚艷全場","暌違台灣粉絲8年，BTS不忘施盡渾身解數寵粉，7子都狂晒中文，隊長RM以台語高呼「大家好」…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T19:45:06+08:00","size":1,"keywords":[],"body":"韓國天團BTS（防彈少年團）昨晚（19日）在高雄世運主場館為《BTS WORLD TOUR ARIRANG》高雄站，舉行頭場演出，吸引53500名ARMY（粉絲名稱）撐場。7子以《Hooligan》開場，並配以火焰特效及360度四面舞台，效果震撼，驚艷全場！\nBTS將《SWIM》歌詞改成「高雄」\n暌違台灣粉絲8年，BTS不忘施盡渾身解數寵粉，7子都狂晒中文，隊長RM以台語高呼「大家好」，V亦晒出其招牌中文對白：「你好，我是金泰亨，20歲，負責唱歌」，此語一出即逗得全場笑個沒停。他們演唱大熱歌曲《SWIM》時更將歌詞改成「高雄」，引得全場粉絲尖叫聲不絕。今次他們除了帶來新專輯《ARIRANG》多首新歌之外，也重新編曲演繹《FAKE LOVE》、《Fire》、《IDOL》、《Not Today》、《Butter》、《Dynamite》等經典Hit歌，全場ARMY一起跟着唱，氣氛勁High！\nJungkook為了食香腸想再來高雄\n在一輪又一輪的勁歌熱舞之間，7子亦有跟粉絲傾偈。RM就自爆前晚有出外散步，見高雄多個景點和地標都換上BTS的應援色──紫色，讓他感動得忍不住一再向粉絲道謝。Jungkook則於前晚偕同V、Jin和J-Hope到六合夜市遊覽，他在台上不禁大讚「高雄的香腸真的好好吃」，甚至笑說未來想再來高雄，理由之一就是為了吃香腸。而V亦大讚高雄美食太多，下次一定會再回來。不過有網民發文指他們當晚光顧的大腸包小腸攤檔，因獲4子加持而爆紅，人們蜂擁到該攤檔要吃「BTS同款香腸」，結果檔主阿婆烤香腸烤到凌晨才能收工。\nBTS粉絲網上掀罵戰\n而日前BTS4子逛夜市的片段在網上瘋傳後，卻引發ARMY之間的「國際糾紛」。事緣有南美粉絲見4子在高雄逛夜市，但BTS在南美巡演期間卻一直保持閉關狀態，讓他們根本沒機會近距離接觸偶像，因而埋怨BTS偏心，對亞洲粉絲特別好。不過有粉絲就指出台灣粉絲並無私生飯行為，在夜市遇到他們也是保持着距離地進行拍攝，盡量不打擾他們。反觀南美方面既有大批秘魯粉絲在他們下榻酒店外留守，24小時全天候圍堵他們；又有巴西瘋狂CP粉因喜歡Jungkook和Jimin的CP組合而憎恨V，更向他發出死亡威脅，在這種情況下，7子又怎能放心出外逛。雙方各執一詞，在網上展開罵戰。\nBTS家人低調捧場\n此外，昨晚有逾5萬名粉絲在場內睇騷捧場之外，場外亦有大批搶唔到飛的粉絲聚集，聽從場內漏出的聲音，索性來個場外免費演唱會，將世運主場館外圍擠到水洩不通，場面熱鬧程度不弱於場館內的正牌演唱會。而據知今次V和Jungkook的家人亦有來高雄睇騷，有粉絲見到Jungkook媽媽與V的父母在開場前密密斟，不少粉絲笑言很開心，因她們終於能夠接近「未來奶奶」呢！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb2725fd095","title":"TVB台慶2026丨林秀怡遭網民點名批評把聲太尖又「搶咪」 火速現身道歉：已經反省掌緊嘴","url":"https://www.stheadline.com/film-drama/3639334/TVB台慶2026丨林秀怡遭網民點名批評把聲太尖又搶咪-火速現身道歉已經反省掌緊嘴","summary":"無綫集團年度盛事《萬千星輝賀台慶2026》於昨晚（19日）圓滿落幕，全場氣氛高漲，由汪明荃領軍，聯同陳貝兒、林溥來、朱凱婷、周奕瑋、洪永城、黃翠如、陸浩明、麥美恩、鄭衍峰、林秀怡、孔德賢及潘靜文…","summary_short":"無綫集團年度盛事《萬千星輝賀台慶2026》於昨晚（19日）圓滿落幕，全場氣氛高漲，由汪明荃領軍，聯同陳貝兒、林溥來…","digest":"無綫集團年度盛事《萬千星輝賀台慶2026》於昨晚圓滿落幕，全場氣氛高漲，由汪明荃領軍…","points":["無綫集團年度盛事《萬千星輝賀台慶2026》於昨晚（19日）圓滿落幕，全場氣氛高漲…","但司儀陣容卻意外引發網民討論，指一眾司儀在台上「搶咪搶到傻」，而林秀怡的表現更是被點名批評…","」甚至有人直言「一出聲我即刻mute咗部電視」"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T19:30:28+08:00","size":1,"keywords":[],"body":"無綫集團年度盛事《萬千星輝賀台慶2026》於昨晚（19日）圓滿落幕，全場氣氛高漲，由汪明荃領軍，聯同陳貝兒、林溥來、朱凱婷、周奕瑋、洪永城、黃翠如、陸浩明、麥美恩、鄭衍峰、林秀怡、孔德賢及潘靜文，合共13位司儀強勢坐鎮。但司儀陣容卻意外引發網民討論，指一眾司儀在台上「搶咪搶到傻」，而林秀怡的表現更是被點名批評：「把聲嘈到XX，又疊聲、又高音、成日尖叫，完全趕客！」甚至有人直言「一出聲我即刻mute咗部電視」。面對排山倒海的批評，林秀怡並未逃避，火速在社交平台現身親自回覆網民致歉，誠懇表示：「對唔住各位，一定一定好好反省，已經反省中，掌緊嘴」，極速認錯的態度獲不少網民大讚其高EQ。\n林秀怡欠缺大騷經驗表現失準\n今次林秀怡難得在台慶擔任司儀，網民推測她可能是平時做開《流行都市》，難得有機會上大台，因一時心急「搶鏡」營造熱鬧氣氛，才導致高音尖叫和疊聲問題。但亦有網民支持林秀怡，讚她「做得OK，與麥美恩氣氛好好」、「好鍾意睇妳啊，加油，Youtube片好好睇」。雖然林秀怡今次司儀表現失準，但她第一時間承諾「掌嘴反省」，展現出極具誠意的態度，網民指出經過今次的台慶經驗，林秀怡定能吸取教訓、拿捏好大騷主持的節奏，未來再次用實力與進步贏回觀眾的掌聲。\n相關閱讀：TVB台慶2026丨一文睇清精彩時刻 陳煒領軍性感熱舞 許志安馬國明「安心事件」後首同場\n林秀怡與導演男友感情穩定\n現年35歲的林秀怡於2009年畢業於第23期無綫電視藝員訓練班，入行十多年，雖然其演藝路途並不平坦，但她憑藉拼搏精神在多部劇集中留下深刻印象，她最為人熟知的代表作包括在《怒火街頭2》中飾演半裸被劫持的毒販，其敬業的演出獲觀眾一致讚賞；其後在《婚姻合夥人》中擔任重要配角同樣大受好評。除了拍劇，她近年主要擔任資訊節目《流行都市》的主持，亦有進軍飲食界經營手工意粉餐廳。私底下的她，更是一名孝順女，曾為救患癌母親而花盡60萬積蓄，近年與無綫導演男友梁啟政感情穩定，一直深受觀眾支持。\n相關閱讀：林秀怡媽媽罕有現身似韓國貴婦母女100%似樣 離婚後獨力養家母女相依為命","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1f4b6ae141","title":"天氣｜天文台錄最低12.7度入秋以來最冷 明早仍寒冷","url":"https://news.tvb.com/tc/1207488-天氣天文台錄最低127度入秋以來最冷明早仍寒冷","summary":"寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷，市區最低氣溫約13度。天氣動態圖｜創入秋最凍紀錄 寒潮持續到幾時？","summary_short":"寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷，市區最低氣溫約13度。","digest":"寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷…","points":["寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷…","天氣動態圖｜創入秋最凍紀錄　寒潮持續到幾時","一股強烈東北季候風，加上一道廣闊雲帶，氣溫顯著下降"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T18:38+08:00","size":1,"keywords":[],"body":"寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷，市區最低氣溫約13度。\n\n天氣動態圖｜創入秋最凍紀錄　寒潮持續到幾時？　下周再有冷鋒｜附九天預報\n\n一股強烈東北季候風，加上一道廣闊雲帶，氣溫顯著下降。伴隨著毛毛雨，體感溫度「凍上加凍」。強風更吹到雨傘都變形。就連牠都要添加「外套」。在北角碼頭，厚實的雲層覆蓋上空。\n\n天文台清晨錄得15.3度，但愈晏愈凍，中午跌至13.2度，下午更錄得12.7度，各區普遍下降至約12度。\n\n天文台高級科學主任楊漢賢說：「今天影響我們的雲帶比較厚實，所以日間大部分時間都是陰雨天氣，日間氣溫升不到，天氣就轉冷。第二特點是我們看到無論雲帶和雨帶，覆蓋範圍非常廣泛，而且雨勢持續很久，原來與遠在印度和孟加拉灣上空的，這個熱帶熱氣旋有關，我們分析得到，高空的西風帶，把它大量水氣，源源不絕由西向東輸送到華南地區，影響我們今天天氣。」\n\n天文台預料明早仍然寒冷，市區最低約13度，新界再低幾度，隨後一兩日氣溫稍為回升，另一股東北季候風，會在下周二抵達華南沿岸，將再度轉涼，亦會有幾陣雨。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/75a0ba42e33d4a7fbcbf9e865b2c7a31/snapshots/6f04472435ee46c6b1dd4a764276649a-00008.jpg","video":"https://pro-vod-cdn.tvb.com/75a0ba42e33d4a7fbcbf9e865b2c7a31/cce57ff67a424d4d92e4075d858d9c3c-533bb8201036e2ba9b626adffaeb7219-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/75a0ba42e33d4a7fbcbf9e865b2c7a31/snapshots/6f04472435ee46c6b1dd4a764276649a-00008.jpg","lang":"zh-Hans"},{"id":"c7fabf3471b","title":"萬千星輝賀台慶2026｜張振朗劉穎鏇率逾80藝員 6號幹線拍攝序幕","url":"https://news.tvb.com/tc/1206107-足本重溫萬千星輝賀台慶張振朗周嘉洛武打飛車劉穎鏇凌空鉸剪腳","summary":"極速狂奔Speed and Stunt視帝張振朗聯同劉穎鏇（Tiffany）、朱敏瀚及周嘉洛，上演緊張刺激的高難度動作重頭戲「極速狂奔Speed and Stunt」，將全場氣氛推至另一高峰！劉穎鏇親身上陣做出凌空鉸剪腳等高難度動作，動作自然流暢，盡顯打女本色！","summary_short":"極速狂奔Speed and Stunt視帝張振朗聯同劉穎鏇（Tiffany）、朱敏瀚及周嘉洛…","digest":"極速狂奔Speed and Stunt視帝張振朗聯同劉穎鏇（Tiffany）…","points":["極速狂奔Speed and Stunt","劉穎鏇親身上陣做出凌空鉸剪腳等高難度動作，動作自然流暢，盡顯打女本色","四人熱血沸騰的演出，亦是向一眾辛苦付出的幕後動作演員及特技人致敬"],"section":"生活","category":"娛樂","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T17:49+08:00","size":1,"keywords":[],"body":"極速狂奔Speed and Stunt\n\n視帝張振朗聯同劉穎鏇（Tiffany）、朱敏瀚及周嘉洛，上演緊張刺激的高難度動作重頭戲「極速狂奔Speed and Stunt」，將全場氣氛推至另一高峰！\n\n劉穎鏇親身上陣做出凌空鉸剪腳等高難度動作，動作自然流暢，盡顯打女本色！振朗型爆飛車，並挑戰多個驚險特技動作，令觀眾拍爛手掌！四人熱血沸騰的演出，亦是向一眾辛苦付出的幕後動作演員及特技人致敬。\n\n11月19日是《萬千星輝賀台慶2026》大喜日子，早前逾80藝員齊集6號幹線 (中九龍繞道—九龍灣段)，為台慶拍攝拍攝序幕，出席藝員有張振朗、劉穎鏇、周嘉洛、吳偉豪、朱敏瀚、陳曉華、馬貫東、劉佩玥、羅天宇、黃庭鋒等，一眾藝員有隧道口齊齊起舞，場面十分熱鬧。","image":"https://pro-vod-cdn.tvb.com/2f42c559583847d9ba47c7c32f1dde87/snapshots/5933fc0326f54148a2c49afb9f7a9204-00008.jpg","video":"https://pro-vod-cdn.tvb.com/2f42c559583847d9ba47c7c32f1dde87/4fbddf51cca44f7ca7d014f31dda7e29-3bcfeca74dfba6c4fb090246a957fd2f-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/2f42c559583847d9ba47c7c32f1dde87/snapshots/5933fc0326f54148a2c49afb9f7a9204-00008.jpg","lang":"zh-Hant"},{"id":"c63dd6c021b","title":"伍仲衡痛失恩師再揭喪母之痛 停網上直播三個月寫歌念親恩 53歲生日停辦派對改派福袋行善","url":"https://www.stheadline.com/film-drama/3639346/伍仲衡痛失恩師再揭喪母之痛-停網上直播三個月寫歌念親恩53歲生日停辦派對改派福袋行善","summary":"近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師（梁月玲）。","summary_short":"近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師（梁月玲）。","digest":"近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師","points":["近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師（梁月玲）","伍仲衡在社交平台分享僅在兩星期前才前往探望對方及與一些和老師的相處點滴…","原來三個多月前，伍仲衡至愛的母親也突然離開了，他痛心不已…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:45:56+08:00","size":1,"keywords":[],"body":"近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師（梁月玲）。伍仲衡在社交平台分享僅在兩星期前才前往探望對方及與一些和老師的相處點滴，完全深感他的痛心與不捨。原來三個多月前，伍仲衡至愛的母親也突然離開了，他痛心不已，沉澱了差不多三個月沒有出現社交平台開直播，只是透過他太太跟相熟的粉絲們告知沒有出現在社交平台的原因，讓他們不用擔心。\n伍仲衡感激母親栽培音樂興趣\n上星期，他在直播中與他的粉絲見面，有粉絲說他很久沒有直播了！他才公開回應：「我發生了人生最大衝擊嘅一件事情，呢件事對我打擊得好嚴重，因為喺八月嘅時候，我媽媽突然離開咗我，真係好突然，突然到我係完全唔識反應，所以我就三個月冇乜開live，但係到依家一切都回復正常，但係我仍然都係好掛住佢，日日都好掛住佢，因為我學琴都係因為佢鞭策我學，我才沒有放棄，我先可以彈到咁多歌，如果唔係佢，我可能都唔係做音樂，多謝媽咪對我嘅栽培。」這段期間，伍仲衡還寫了一首歌送給他媽媽，曲詞包辦，叫做《有種愛》，歌詞入邊完全感受到他對媽媽的感激和思念，粉絲們都紛紛留言說太感動及聽完都哭了。\n伍仲衡帶陳子晴及粉絲一齊行善\n11月21日是伍仲衡53歲生日，他每年都會與粉絲一齊度過，但他今年因為喪母的關係，決定不搞生日會，攜同他旗下新人Nat Chan陳子晴與Fans一齊做善事。上星期日他與Fan Club會員一起準備了500個福袋，派了給500個長者，希望他們都開開心心、身體健康，極具意義。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c73762d8626","title":"民族团结同心行 健康文体进乡村 ——沈阳市民族和宗教事务局联合沈阳医学院走进新民市兴隆堡镇","url":"https://www.chinanews.com.cn/txy/2026/11-20/10735346.shtml","summary":"11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融。","summary_short":"11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融。","digest":"11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融","points":["11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融","为有形有感有效铸牢中华民族共同体意识，把民族团结进步工作与便民惠民健康服务深度融合…","60名师生志愿者一早从学校出发，把一堂宣讲、一次义诊、一套健身功法，一并送到了村民身边"],"section":"生活","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:45:04+08:00","size":1,"keywords":[],"body":"11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融。为有形有感有效铸牢中华民族共同体意识，把民族团结进步工作与便民惠民健康服务深度融合，沈阳市民族和宗教事务局联合沈阳医学院，在这里开展“民族团结同心行·健康文体进乡村”社会实践活动。60名师生志愿者一早从学校出发，把一堂宣讲、一次义诊、一套健身功法，一并送到了村民身边。\n\n　　上午9时30分，活动从一堂宣讲开始。市民族和宗教事务局徐鹏飞以“传承长征奋进志相聚乡土叙同心”为题，为医学院的师生和村民献上一堂铸牢中华民族共同体意识宣讲课。把长征精神与铸牢中华民族共同体意识讲到了一处。他从90年前的红军长征讲起——队伍走到哪里，各族群众就送粮、带路、腾房，同舟共济才走完了漫漫征途；再讲回眼前的温查牛满族村，路修好了，产业有了，文化活动多了，靠的同样是各族群众一起干、一起过日子。长征路上的“同心”和村寨里的“同心”，本来就是一回事。宣讲过后民族团结进步促进法读本和宣传纪念品一并送到了群众手上。\n\n　　义诊台前，沈阳医学院团委邀请的医生逐一为群众测量血压、血糖并登记，对指标异常者当面说明情况、提出就医建议；应急救护演示和合理膳食、老年常见病防治的讲解，用的是“少盐少油、粗细搭配”这样的家常话；老年居家康复指导区里，师生针对颈肩腰腿痛等问题，手把手教动作、提出护理意见。体育教学部的教师带着村民练八段锦、打太极拳。同时医护人员和志愿者分组入户，在炕头、在床前为行动不便的老人做上门义诊康复评估，把宣传资料和健康提示送到手上。一户一户走下来，服务才算真正到了“最后一米”。义诊检测的登记表写满了整整几页，健康知识图解卡片成了抢手货。村民们说，过去看病要往镇里、往市里跑，如今大夫进了村、上了门，还教会了能天天练的养生法子，这样的活动盼着常来。\n\n　　市民族和宗教局有关负责同志表示，民族团结进步不是一句口号，要落在群众看得见、摸得着的实事上，把民族工作与健康服务、文体活动拧成一股绳，铸牢中华民族共同体意识才能有形有感有效。\n\n　　温查牛满族村作为沈阳市少数民族发展任务资金项目所在地之一。近年来，沈阳市民族和宗教事务局持续加大对兴隆堡镇的帮扶力度，帮助全镇落实19项民生工程，涉及完善乡村基础设施、发展特色产业、农文旅融合发展等领域；落实3983件物资，帮扶低保、五保、残疾、高龄、大病、困难党员等低收入群体，惠及1900余人次；组织文化下乡、慈善义诊、结对帮扶、法律援助、农产品展销等惠民活动数十次。项目往村里投，服务往群众身上落。这次活动，正是把帮扶从基础设施延伸到人的身边，让资金和项目背后的温度，真正被群众摸得着、感受得到。\n\n　　下一步，沈阳市民族和宗教事务局将推动民族工作与乡村振兴同向发力，把少数民族发展任务资金项目与惠民活动有效衔接；沈阳医学院将以社会实践为纽带，常态化组织师生下沉基层，让学生在实践中受教育、长才干。\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc4437957c0","title":"2026集美·阿尔勒影像艺术季在厦门开幕","url":"https://www.chinanews.com.cn/cul/2026/11-20/10735338.shtml","summary":"中新社厦门11月20日电 (吴冠标)2026集美·阿尔勒影像艺术季20日在厦门开幕。","summary_short":"中新社厦门11月20日电 (吴冠标)2026集美·阿尔勒影像艺术季20日在厦门开幕。","digest":"2026集美·阿尔勒影像艺术季20日在厦门开幕","points":["此次艺术季展期持续至2027年1月3日，展期内呈现超过40场展览，展出来自中国、法国、瑞士…","集美·阿尔勒影像艺术季长期与知名摄影节法国阿尔勒摄影节合作，关注华人艺术家的创作与研究…","截至目前，集美·阿尔勒影像艺术季已累计呈现逾380场展览、展出近900位艺术家的作品"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:43:18+08:00","size":1,"keywords":[],"body":"中新社厦门11月20日电 (吴冠标)2026集美·阿尔勒影像艺术季20日在厦门开幕。\n\n　　此次艺术季展期持续至2027年1月3日，展期内呈现超过40场展览，展出来自中国、法国、瑞士、美国、韩国、挪威等国家和地区的2000余件作品，涵盖摄影、动态影像、装置、多媒体等形式。\n\n　　集美·阿尔勒影像艺术季长期与知名摄影节法国阿尔勒摄影节合作，关注华人艺术家的创作与研究，持续呈现全球影像创作的多样面貌与发展趋势。截至目前，集美·阿尔勒影像艺术季已累计呈现逾380场展览、展出近900位艺术家的作品。\n\n11月20日，2026集美·阿尔勒影像艺术季在厦门开幕。　吴冠标 摄\n\n　　法国阿尔勒摄影节总监、集美·阿尔勒联合艺术总监克里斯托弗·维斯纳(Christoph Wiesner)在开幕式上表示，两个摄影节的合作已延续十余年，其价值“远远超越了展览作品的跨地域呈现”，更在于让来自不同文化背景、拥有不同历史经验的艺术家、策展人和观众彼此相遇、交流。\n\n　　挪威艺术家比亚纳·克文斯兰(Bjarne Kvinnsland)此次参展作品为沉浸式声音装置：二十余种从深海采集的鲸鸣，经多组扬声器在暗厅中回荡。“观众可以真切体会到与鲸鱼一同置身水下是什么感受。人们无需精通音乐，也能很容易地与动物的声音产生共鸣。”\n\n　　“我希望借此作品探讨声音如何与视觉叙事产生互动。”比亚纳·克文斯兰说，海底幽暗无光，人们却可借由声音“感知光”，当鲸鸣与展厅中其他影像作品相结合，观众便会产生更多想象。\n\n　　“集美·阿尔勒已经发展成为中国乃至国际摄影领域一项重要的文化盛事。”克里斯托弗·维斯纳表示，法国阿尔勒摄影节也非常荣幸能够每年通过“集美·阿尔勒发现奖”等项目，将中国摄影艺术家的创作介绍给欧洲观众。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf5247f5af4","title":"銅鑼灣軒尼斯道官小英文呈分試 家長質疑教師試前「通水」惹不公 校方：正調查事件","url":"https://www.stheadline.com/edu-insights/3639330/銅鑼灣軒尼斯道官小英文呈分試-家長質疑教師試前通水惹不公-校方正調查事件","summary":"近日不少學校爆出呈分試爭議。","summary_short":"近日不少學校爆出呈分試爭議。","digest":"近日不少學校爆出呈分試爭議","points":["近日不少學校爆出呈分試爭議","《星島教育》昨日（19日）亦收到家長報料，指軒尼詩道官立小學（銅鑼灣）有個別老師…","校方今日（20日）回覆《星島教育》查詢，表示正在調查事件，重申所有試卷均嚴格保密"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:34:22+08:00","size":1,"keywords":[],"body":"近日不少學校爆出呈分試爭議。《星島教育》昨日（19日）亦收到家長報料，指軒尼詩道官立小學（銅鑼灣）有個別老師，在英文科呈分試開考前，於課堂向學生提供與實際試題高度相似的題目，認為有「通水」之嫌。校方今日（20日）回覆《星島教育》查詢，表示正在調查事件，重申所有試卷均嚴格保密。教育局亦回覆，表示知悉事件後，已即時聯絡學校了解情況，要求嚴肅跟進。\n軒尼詩道官立小學(銅鑼灣) (網上圖片)\n報料家長表示，該校其中一班的英文科教師在小六呈分試前，於課堂以遊戲方式讓同學回答與試卷相近的題型。該家長質疑這有「通水」之嫌，令部分學生「於關鍵評估中處於不公平劣勢」。涉事老師曾解釋，課堂題目為人工智能生成，並非刻意「通水」，但家長認為題目與正式試題的選材、題型、篇章或答案高度相近，故不接受教師以「AI生成」作解釋。\n家長認為校方的調查並不透明，要求交代涉事課堂題目的來源、與正式試卷的關係，以及是否有班別獲不公平優勢。家長續指，該校英文呈分試早前亦爆出其他爭議，包括試卷內容與日常教學不符；有班別在考試前提醒學生溫習附錄，令各班學生的準備條件不一。\n校方回覆：所有試卷均嚴格保密\n校方回覆時表示，現正調查事件。經初步了解，該級別所有英文教師在測考前均有按測考範圍及學生能力替學生進行溫習，包括其中一班透過電子互動遊戲溫習。校方重申，所有試卷均嚴格保密，教師亦已教授考試範圍的內容。該校現正檢視相關安排，並會在有需要時優化。\n教育局回覆指，當局要求學校就所有校本評核，必須嚴格遵守公平、公正的原則，並確保評核程序嚴謹妥善。教育局知悉事件後，已即時聯絡學校了解情況，要求學校嚴肅跟進，並向局方詳細交代有關處理工作。學校已就事件展開調查，並會就學校的跟進與家長溝通。在決定任何跟進措施時，校方必須以保障全體學生福祉及評核公平為首要考慮。\n教育局已提醒學校全面檢視測考安排，務必確保所有校內測考均在公平和公正的原則下進行，亦須與家長及學生保持良好溝通，提供支援。教育局會繼續與學校保持緊密聯繫，提供適切支援。\n延伸閱讀：\n【呈分試風波】教大賽馬會小學常識重考掀爭議 校方：日後計分測考劃一同日進行\n有家長投訴呈分試試題疑外洩予補習社 馬鞍山靈糧小學澄清：絕無洩密 望釋除疑慮","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":34,"items":[{"id":"c84bf693351","title":"一年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000551.htm","summary":"下稿代香港金融管理局發出︰  　　香港金融管理局（金管局）以香港特別行政區政府（特區政府）代表身分於今日（十一月二十日）公布…","summary_short":"下稿代香港金融管理局發出︰  　　香港金融管理局（金管局）以香港特別行政區政府（特區政府）代表身分於今日（十一月二十日）…","digest":"一年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標","points":["香港金融管理局（金管局）以香港特別行政區政府（特區政府）代表身分於今日（十一月二十日）公布…","任何投標申請只可透過最新公布名單上的第一市場交易商進行…","投標結果將於金管局網站、香港政府債券網站、彭博（GBHK <GO>）和路孚特（IBPGSBP…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:00:00+08:00","size":2,"keywords":[],"body":"下稿代香港金融管理局發出︰\n\n　　香港金融管理局（金管局）以香港特別行政區政府（特區政府）代表身分於今日（十一月二十日）公布，重開在基礎建設債券計劃下推出的2年期人民幣特區政府機構債券（債券）（發行編號02GB2711001），作一年期債券供投標。該批重開債券將於二○二六年十一月二十六日（星期四）進行投標，並於二○二六年十一月三十日（星期一）交收。\n\n　　透過是次重開債券，將有額外7.5億人民幣的未到期二年期債券（發行編號02GB2711001）供投標。該批債券將於二○二七年十一月十七日期滿，利率為年息1.71厘，每半年派息一次。該批債券於二○二六年十一月二十日的指示價格為100.39，半年化收益率則為1.309%。\n\n　　投標只供於基礎建設債券計劃下委任的第一市場交易商參與。任何投標申請只可透過最新公布名單上的第一市場交易商進行，此名單可從香港政府債券網站www.hkgb.gov.hk下載。每項投標均須以五萬人民幣或其整數倍數為單位。\n\n　　投標結果將於金管局網站、香港政府債券網站、彭博（GBHK <GO>）和路孚特（IBPGSBPINDEX）公布，公布時間預計不遲於投標日的下午三時。\n\n特區政府機構債券投標資料\n\n　　一年期人民幣特區政府機構債券重開投標資料如下：\n\n 發行編號\n :\n 02GB2711001\n\n 股份代號　\n :\n 85089 （HKGB1.71 2711-R）\n\n 投標日期和時間\n :\n 2026年11月26日（星期四）\n\n 上午9時30分至10時30分\n\n 發行和交收日期\n :\n 2026年11月30日（星期一）\n\n 發行總額\n :\n 7.5億人民幣\n\n 年期\n\n 剩餘年期\n :\n\n :\n 1年\n\n 約0.96年\n\n 到期日\n :\n 2027年11月17日（星期三）\n\n 利息\n :\n 年息1.71厘，每半年派息一次\n\n 利息支付日期\n :\n 由發行日至到期日（包括該日）起計每年5月17日及 11月 17日，並按載於香港政府債券網站的基礎建設債券計劃及政府可持續債券計劃機構債券資料備忘錄（資料備忘錄）所述的條款進行調整。\n\n 投標形式\n :\n 競爭性投標\n\n 投標數額\n :\n 每項競爭性投標必須以5萬人民幣或其整數倍數為單位。任何投標申請只可透過最新公布名單上的第一市場交易商進行。\n\n 成功投得債券的人士於債券發行日（2026年11月30日），均須就每5萬人民幣的最低投標額繳付30.45人民幣的累計利息。\n\n （由於四捨五入關係，超過5萬人民幣的投標額需繳付的累計利息，可能與以5萬人民幣最低投標額計算出來的利息數字略有出入）。\n\n 其他詳情\n :\n 請參閱載於香港政府債券網站的資料備忘錄，或向第一市場交易商查詢。\n\n 預期開始在香港聯合交易所有限公司買賣的日期\n :\n 是次投標所得的債券數額可完全與現時在香港聯合交易所上市，股份代號為85089（即發行編號02GB2711001）的政府債券互換。\n\n 募集所得資金的用途\n :\n 債券將在基礎建設債券計劃下的機構部分發行。募集所得的資金將按載於香港政府債券網站的基礎建設債券框架作基建項目投資。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"一年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000551.htm","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:00:00+08:00","category":"","digest":"一年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標"},{"title":"七年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000548.htm","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:00:00+08:00","category":"","digest":"七年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標"}]},{"id":"cf99f473139","title":"文創處資助舉辦「deTour 2026設計節」今日開幕","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000252.htm","summary":"由文化體育及旅遊局（文體旅局）轄下文創產業發展處資助、PMQ元創方主辦的「deTour 2026設計節」（deTour 2026）今日（十一月二十日）在中環PMQ元創方舉行開幕禮。","summary_short":"由文化體育及旅遊局（文體旅局）轄下文創產業發展處資助、PMQ元創方主辦的「deTour 2026設計節」（deTour…","digest":"由文化體育及旅遊局轄下文創產業發展處資助…","points":["由文化體育及旅遊局（文體旅局）轄下文創產業發展處資助…","作為香港年度設計盛事之一，deTour 2026匯聚本地及海外的設計社群…","文體旅局副局長劉震出席開幕禮時表示，deTour自二○一四年舉辦以來…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T22:45:00+08:00","size":1,"keywords":[],"body":"由文化體育及旅遊局（文體旅局）轄下文創產業發展處資助、PMQ元創方主辦的「deTour 2026設計節」（deTour 2026）今日（十一月二十日）在中環PMQ元創方舉行開幕禮。作為香港年度設計盛事之一，deTour 2026匯聚本地及海外的設計社群，由即日起至十一月二十九日舉辦一系列展覽、工作坊及交流活動，讓公眾親身體驗創意設計與日常生活的融合。\n\n　　文體旅局副局長劉震出席開幕禮時表示，deTour自二○一四年舉辦以來，累計接待逾130萬名訪客，並吸引超過220個來自香港及境外的設計單位參與。這項年度設計盛事不僅成為展示本地及國際創意人才的理念和創意的重要平台，更展現其在設計界的影響力和認受性。加上今屆首度推出的快閃店及一系列精彩活動，設計節將為公眾帶來全方位的沉浸式體驗。\n\n　　deTour 2026以「BETTER, NOT PERFECT 不完美，更美好：Prototypes for Tomorrow」為主題，設有三大展區，展出來自香港、中國內地及海外創作者帶來的概念及作品。今屆設計節新設快閃店，發售本地及海外設計師的限量產品、生活用品及deTour 2026周邊商品，讓設計人才獲得更多的曝光機會，展現設計如何融入日常生活，並加深公眾對設計的認識與欣賞。\n\n　　更多關於deTour 2026的資訊，請瀏覽detour.hk。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c80e586f33f","title":"特區政府強烈不滿和堅決反對美中經濟與安全審議委員會報告","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000800.htm","summary":"​香港特別行政區（特區）政府今日（十一月二十日）就美中經濟與安全審議委員會發表所謂「二○二六年報告」，以失實和偏頗的詆毀，污衊抹黑香港特區各方面的情況，表示強烈譴責，並必須嚴厲直斥其非。","summary_short":"​香港特別行政區（特區）政府今日（十一月二十日）就美中經濟與安全審議委員會發表所謂「二○二六年報告」…","digest":"香港特別行政區政府就美中經濟與安全審議委員會發表所謂「二○二六年報告」…","points":["​香港特別行政區（特區）政府今日（十一月二十日）就美中經濟與安全審議委員會發表所謂「二○二六…","特區政府發言人強調：「香港特區是中華人民共和國不可分離的部分…","特區政府發言人表示：「特區政府堅定維護香港市民受到法律保障的權利和自由"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T21:35:56+08:00","size":1,"keywords":[],"body":"​香港特別行政區（特區）政府今日（十一月二十日）就美中經濟與安全審議委員會發表所謂「二○二六年報告」，以失實和偏頗的詆毀，污衊抹黑香港特區各方面的情況，表示強烈譴責，並必須嚴厲直斥其非。\n\n　　特區政府發言人強調：「香港特區是中華人民共和國不可分離的部分，在『一國兩制』下是一個享有高度自治權、直轄於中央人民政府的地方行政區域。『一國兩制』以《憲法》和《基本法》為法律依據實施，為基本權利和自由提供憲制上的保證，包括法律面前一律平等的權利保證，更在法治和獨立司法權之下得以鞏固。特區政府強烈不滿和堅決反對美中經濟與安全審議委員會肆意以政治凌駕法治，一再透過發表所謂報告干預香港特區事務。」\n\n　　「香港特區堅決維護國家主權、安全和發展利益，全面準確貫徹『一國兩制』方針的最高原則。特區政府會繼續堅定不移全面準確實施《香港國安法》、《維護國家安全條例》和其他維護國家安全的相關法律，依法有效防範、制止和懲治危害國家安全的行為和活動，同時堅持法治原則，依法保障香港市民的權利和自由，確保『一國兩制』實踐行穩致遠。特區政府再次強烈敦促美國認清事實，遵從國際法和國際關係的基本準則，立即停止干涉純屬中國內政的香港事務。」\n\n保障權利和自由\n\n　　特區政府發言人表示：「特區政府堅定維護香港市民受到法律保障的權利和自由。自香港回歸祖國以來，人權一直受到《憲法》和《基本法》的堅實憲制保障。《香港國安法》及《維護國家安全條例》是香港恢復秩序、保障自由和發展的制度基礎。《香港國安法》和《維護國家安全條例》訂明的罪行精準針對危害國家安全的行為，清楚訂明構成有關罪行的元素和刑罰。有關法律不會影響本地的機構、組織和人員與其他國家、地區及聯合國等相關國際組織的正常交流。奉公守法的人士不會誤墮法網。」\n\n　　「《香港國安法》和《維護國家安全條例》清楚訂明香港特區維護國家安全應當尊重和保障人權，依法保護香港居民根據《基本法》、《公民權利和政治權利國際公約》和《經濟、社會與文化權利的國際公約》適用於香港的規定，有關言論、新聞、出版、結社、集會、遊行、示威的權利和自由。然而，和世界其他地方一樣，有關權利和自由並非絕對。《公民權利和政治權利國際公約》亦清楚訂明，在有必要保障國家安全、公共安全、公共秩序或他人的權利和自由等情況下，可以依法限制部分權利和自由。所謂報告片面引用數據扭曲事實，抹煞香港特區一直以來堅定保障市民依法行使權利和自由的決心和工作，特區政府必須直斥其非，予以強烈譴責。」\n\n　　「自《香港國安法》和《維護國家安全條例》實施以來，本港的傳媒環境蓬勃依然。新聞和言論自由一直在憲制層面受到《基本法》的堅實保障。傳媒享有評論和批評政府施政的自由，與此同時與其他人一樣必須遵守所有法律；只要不違法，其行使自由的權利全然不受限制。確立的人權法原則是，新聞工作者必須按『負責任新聞作業』原則真誠地行事，以準確事實為基礎，並提供準確可靠的資訊，方可獲言論和新聞自由權利保障。反之，美國的傳媒環境卻日趨嚴峻。據統計，二○二六年至今，美國的執法當局已拘捕40多名記者；而對記者施加暴力（包括強行按倒在地、以警棍毆打、甚至向其射擊）的個案更近170宗，當中絕大部份涉及執法人員。美國官員經常辱罵提問的記者，隨意禁止主流傳媒進入白宮進行採訪及參加記者會的做法亦變本加厲，即使美國法院於今年十月發出臨時禁制令暫時停止美國政府有關做法，部分傳媒在白宮的採訪活動仍然受阻。惟美方卻聯同部分別有用心人士刻意捏造有關香港新聞和言論自由的情況，實在是恬不知恥。」\n\n　　「就大埔宏福苑火災，特區政府正全力推進善後工作，以獨立委員會報告作基礎推行全面改革，並追究刑事責任和行政責任。然而，一些別有用心的外部勢力及反中亂港分子，在火災發生後，意圖透過在網上散播假新聞、假消息，甚至派發煽動性傳單等，惡意抹黑救援工作、挑動社會分化對立，影響社會團結一致推動救災善後工作。特區政府絕不容忍任何惡意抹黑、煽動仇恨的行為，依法採取果斷執法行動。」\n\n維護國家安全法律\n\n　　發言人強調：「危害國家安全是嚴重的罪行，沒有國家會對危害國家安全的行為和活動袖手旁觀。美國有龐大而嚴密的國安法律體系，除了有多部維護國家安全法律，以所謂『國家安全』為名簽發的行政命令更不計其數，泛化『國家安全』概念打壓別國、巧取豪奪、侵犯別國主權，甚至動用軍隊濫殺平民、實行法外處決，在二○二五年九月至二○二六年九月期間便以『防止毒品恐怖主義』為名攻擊民用船隻殺害至少230名平民。美中經濟與安全審議委員會對香港特區維護國家安全法律和執法所持的標準與評價自己國家的侵犯人權問題截然不同，是實實在在的雙重標準，純屬卑劣的政治操弄，必須予以強烈譴責。」\n\n　　「香港特區負有維護國家安全的憲制責任，必須持續完善維護國家安全的法律制度和執行機制，以持續有效防範、制止和懲治危害國家安全的行為和活動。特區政府於今年三月制定《2026年〈中華人民共和國香港特別行政區維護國家安全法第四十三條實施細則〉（修訂）實施細則》（《修訂細則》）符合《基本法》，包括有關人權的條文，以及《香港國安法》的有關規定。《修訂細則》的多項措施設有由司法機關把關的機制，以確保執法人員在執行各項措施時，既能有效防範、制止和懲治危害國家安全的行為和活動，也能同時按《香港國安法》第四條及第五條的要求，充分保障個人和組織的合法權利。根據經修訂的《實施細則》附表1，在一般情況下，警務人員必須有合理理由懷疑電子設備可能包含危害國家安全罪行的證據，並向裁判官申請手令及獲得授權後，才能根據手令搜查該電子設備，以獲取相關犯罪證據。只有在依法獲得授權就電子設備行使搜查權力後，警方才有權要求指明人士提供電子設備的密碼或解密方法。」\n\n　　「特區政府於今年六月訂立《維護國家安全（程序事宜）規例》，清楚述明在《香港國安法》和《維護國家安全條例》下界定『特區的法律下其他危害國家安全的罪行』的機制，細化相關程序事宜，為《香港國安法》、《維護國家安全條例》等相關規定的實施帶來更大確定性。行政長官證明書的有關規定與普通法原則完全一致。香港和美國等普通法司法管轄區的法院均確立司法機關須尊重行政機關對國家安全問題的評估與判斷。一宗二○一○年美國最高法院案例指出：『國家安全和外交政策問題與應對不斷演變的威脅有密切關係，而在相關領域的資訊難以獲取，且某些行為的影響也難以評估』，並指出：『法院明顯欠缺評估相關問題的能力』。有關規例沒有改變現有和行之有效的規定，沒有改變《香港國安法》、《維護國家安全條例》的適用範圍，沒有改變『危害國家安全的罪行』的定義，也沒有訂立新的罪行、罰則或執法權力。美中經濟與安全審議委員會全然漠視香港特區訂立及持續優化相關法律的憲制責任和實際需要，反而對香港特區維護國家安全的法律制度和執行機制指手畫腳，其偽善之心昭然若揭，令人齒冷。」\n\n　　「在複雜多變的地緣政局下，香港得以在《香港國安法》等維護國家安全法律的保障下，發揮『一國兩制』下內聯外通、國際化和多元包容的獨特優勢，充分發揮『超級聯繫人』和『超級增值人』的角色，致力為環球投資者打造穩定安全的投資環境。一如既往，近日香港特區境內舉辦多項盛事，涵蓋法律、經濟金融、海運等不同範疇，當中不乏重要國際會議，吸引世界各地人士來港參與；國際機構相繼在香港設立總部或辦事處，包括國際調解院、國際統一私法協會等；加上近年在各項主要國際競爭力及發展排名中表現優異，充分展現香港作為國際金融和商貿中心與各界對香港的肯定和信心，使各種意圖攻擊香港特區的謊言不攻自破。」\n\n維護司法公正和法治精神\n\n　　特區政府發言人指出：「香港是法治社會，特區政府一直依法履行維護國家安全的憲制責任，堅持有法必依、執法必嚴、違法必究的原則。《香港國安法》第五條和《維護國家安全條例》第2條明確訂明防範、制止和懲治危害國家安全犯罪，應當堅持法治原則。」\n\n　　「特區政府維護獨立的司法權，全力支持司法機構依法獨立行使審判權，維護司法公正和法治精神。《基本法》第二條、第十九條及第八十五條訂明，香港特區享有獨立的司法權和終審權，法院獨立進行審判，不受任何干涉。法官在處理危害國家安全犯罪案件時，一如其他案件，都是獨立公正地履行司法職責，不受任何干涉，而所有面對刑事指控的人都享有接受公平審訊的權利。法院嚴格按照證據和所有適用法律判案，案件不會因涉案者的職業、政治理念或背景而在處理上有所不同。六年多以來的實踐證明，法院嚴格按照上述原則處理涉及《香港國安法》及特區其他維護國家安全法律的案件。 」 \n\n　　「律政司按《基本法》第六十三條主管刑事檢控工作，不受任何干涉，所有檢控決定是基於所有可接納的證據和適用法律進行客觀分析後作出，而控方有責任在毫無合理疑點下證明被告人犯罪，被告人才可被法庭定罪。」\n\n　　「香港特區執法部門一直根據證據、嚴格依照法律，以及按有關人士或單位的行為而採取執法行動，與涉事人士或組織的政治立場、背景或職業無關。所有案件均是嚴格根據證據和依照法律處理；所有被告均嚴格按照香港適用法律（包括《香港國安法》），並在《基本法》及《香港人權法案》的保障下接受公平審訊。任何倡議某些人或組織不應就其違法行為承擔其法律後果，等同給予其犯法特權，這完全違反法治精神。」\n\n　　「就所謂的報告對黎智英被控危害國家安全罪行一案（『黎智英案』）判決的惡意抹黑，特區政府必須再次強調法庭是嚴格按照證據和所有適用法律判案，依法對黎智英及各被告作出重判，彰顯了法治和公義，而黎智英已選擇不就其定罪及判刑提出上訴。特區政府留意到以美西方為首的外部勢力一直不斷抹黑香港特區在『黎智英案』的執法行動和司法程序，試圖干預香港特區法院依法進行審判，作出妨礙司法公正和破壞法治的行為。這些卑鄙圖謀在香港特區法庭不偏不倚作出的審判後不攻自破，惟美國在面對這些鐵一般的事實，依然顛倒是非、惡意攻擊，令人不齒。特區政府必須再次嚴正駁斥，以正視聽。」\n\n　　「所謂的報告亦有提及的『支聯會煽動顛覆國家政權』案。法庭頒下的裁決理由書已經明確指出，『支聯會』綱領的目標就是要推翻和破壞中國共產黨在《憲法》下的領導地位。被告透過挑起敵意和分化，企圖令香港市民對中國共產黨失去信任，從而達到破壞中華人民共和國根本制度的目的。裁決理由書清楚指出，被告並非因其政治觀點或信念受審。該案說明，任何人煽動顛覆國家政權、危害國家安全，最終都會被依法懲治，絕不姑息。法律從不容許任何人假借人權、民主和自由之名偷樑換柱，公然傷害自己的國家及同胞。」\n\n　　「至於所謂的報告提及黃之鋒涉及的『串謀勾結外國或者境外勢力危害國家安全罪』案件，黃之鋒承認控罪並被判處監禁十年。在大量事實和證據面前，黃之鋒無從狡辯。事實上，本案以外，黃之鋒屢次犯法，包括非法集結、藐視法庭等，視法律如無物。他在各宗刑事案件中被依法懲治，實屬咎由自取，亦屬天經地義。」\n\n　　「《香港國安法》及《維護國家安全條例》下的罪行訂有適當的域外效力，完全符合國際法原則、國際慣例和各國各地區通行做法，實屬必要和正當，並與世界其他國家和地區一致。香港警方作為特區維護國家安全的執法部門，有責任依法追究在境外涉嫌危害國家安全的惡行。該等一直潛藏境外的潛逃者被通緝，是因為他們在當地繼續公然從事危害國家安全的勾當，肆意勾結外部勢力包庇其惡行。警方採取一切合法措施，強烈打擊有關潛逃行為，做法有理有據，實屬必要和正當。事實上，包括美國等不少國家也會就不同的通緝犯施行措施打擊潛逃行為。美方無視《聯合國憲章》下最基本的主權平等和不干涉原則，濫施長臂管轄、亂揮『制裁』大棒、跨境擄挾甚至擊殺主權國家領導人，才是赤裸裸的『跨境鎮壓』。」\n\n　　「就所謂的報告中提及有關潛逃者郭鳳儀的父親被裁定『企圖直接或間接處理屬於有關潛逃者或由有關潛逃者擁有或控制的資金或其他財務資產或經濟資源』罪罪成一案，判刑理由書清楚指出，有關控罪旨在防範他人處理潛逃者資產，令潛逃者在潛逃期間，無法動用或移轉其資金和資產，增加其回港面對司法程序的機會。有關案件的性質嚴重，涉案行為有機會令潛逃者可繼續潛逃並進行其危害國家安全的勾當，惟有關定罪和刑罰不存在任何『連坐』懲罰，亦與被告是否潛逃者親屬無關。」\n\n　　「就香港駐倫敦經濟貿易辦事處（經貿辦）一名僱員被英國法院裁定『協助外國情報機構』罪名成立，特區政府重申，相關控罪涉及不實指控和抹黑，英方以『莫須有』罪名提告，濫用法律、操弄司法程序，案件全然是英方的政治操弄，目的是為外逃在英的反中亂港分子撐腰站臺，污蔑抹黑中國中央政府及香港特區政府。正如我們由案件開始至今一直明確指出，案件所涉的指控與特區政府、駐倫敦經貿辦及其工作絕無關連，我們堅決反對所有不實指控。英國當局的拙劣把戲亦同時突顯其《2023年國家安全法》下『協助外國情報機構』罪的寬泛、含糊和嚴苛本質，特別是控方就此罪無須證明被告人所協助的外國情報機構究竟是何組織，明顯損害了被告人獲得公平審訊的權利。」\n\n堅持「有效市場」和「有為政府」相結合\n\n　　特區政府發言人指出：「香港一直堅持奉行市場經濟的經濟政策，包括自由貿易，資金、人才和資訊自由流動，保障私有財產，簡單稅制，以及法治等。這些一直是我們成功不可或缺的元素。事實上，《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》（香港五年規劃）強調香港對市場經濟和面向全球的長期堅持，絕無偏離市場經濟。香港五年規劃第一篇已開宗明義指出，『有效市場』和『有為政府』雙管齊下的方針是規劃的基本原則之一，而其後各章闡述的頂層經濟策略亦一再印證這個原則。任何指稱香港因香港五年規劃出台而偏離資本主義市場經濟的說法，絕對子虛烏有。」\n\n　　「有效管治與成功的市場經濟從來沒有對立。世界主要經濟體進行中長期經濟規劃，是普遍甚至必要的做法，從而在充滿不確定因素的全球環境中推動經濟發展。投資者確實重視政府政策的確定性，因為這有助營造穩定的營商環境。該報告的失實聲稱顯示報告對香港現況和香港五年規劃缺乏了解，並完全漠視政府透過清晰闡述政策和有效規管，促進經濟和社會發展的願景，我們對此深表遺憾。」\n\n打擊洗錢和執行制裁\n\n　　發言人又指出︰「特區政府高度重視維護金融體系的誠信及穩健。本港銀行和其他金融機構均嚴格遵守包括打擊洗錢和恐怖分子資金籌集的國際標準和最佳做法。專責制訂打擊洗錢和恐怖分子資金籌集國際標準的財務行動特別組織已確認香港整體，尤其在識別及了解風險、執法、追討資產及國際合作等方面符合相關國際標準，並擁有健全的法律架構及有效的制度。在虛擬資產方面，虛擬資產交易平台發牌制度自二○二三年六月起實施，規定虛擬資產交易平台須符合適當人選準則，並遵從打擊洗錢和恐怖分子資金籌集的相關規定。此外，我們將於下月向立法會提交條例草案，擴大虛擬資產服務的規管制度至涵蓋新增服務類型（包括交易、提供意見、管理及託管服務），藉此進一步提升香港打擊與虛擬資產相關的洗錢及恐怖分子資金籌集活動框架的有效性。」\n\n　　「特區政府一直全面及嚴格執行聯合國安全理事會（安理會）施加的制裁，以履行國際義務。我們不會執行其他國家施加的單邊制裁或其他單邊限制措施。這些所謂『制裁』及單邊措施違反以國際法為基礎的國際秩序，和以《聯合國憲章》宗旨和原則為基礎的國際關係基本準則。特區政府通過有效的機制執行聯合國安理會的決議，包括拒絕聯合國安理會指定及可疑的船隻進入香港；監察和巡查可疑的香港公司，防止其參與規避聯合國制裁的活動；以及通過中央人民政府參與《化學武器公約》及《武器貿易條約》。我們的工作成效，一直獲得各貿易夥伴的尊重和認同。」\n\n經完善的選舉制度\n\n　　特區政府發言人指出：「二○二一年完善選舉制度後產生的立法會全面落實『愛國者治港』，符合確保政權掌握在愛國者手中這世界通行的政治原則。完善後的立法會已徹底擺脫以往對立撕裂、議事堂失序失效的亂象，重回理性務實的正軌，高效高質量議政，集中精力發展經濟、改善民生，使『一國兩制』行穩致遠。第八屆立法會換屆選舉於去年年底順利舉行，選民積極投票，選出新一屆愛國愛港、有擔當、有才幹、有志服務社會的立法會議員，再次展現新選舉制度下高質量、高水平的良性競爭，體現了廣泛代表性和均衡參與。完善後的立法會以實踐證明，這是符合香港特區實際情況、是適合香港需要的民主選舉制度。」\n\n加強國民教育\n\n　　特區政府發言人指出：「學校是學生學習和成長的地方，學校有責任提供安全有序的校園環境和氛圍，防止政治干預或違法活動入侵校園，以保障學生福祉。國民教育一直是香港中小學及幼稚園課程重要部分，以加強學生對國情、歷史和文化、《憲法》和《基本法》，以及國家安全的認識，建立文化自信，提升國民身分認同，培育他們成為德才兼備，有承擔、有視野、愛國愛港的新一代。此外，教師是學生的重要楷模，肩負知識傳承、熏陶品德的重要職責，特區政府有責任確保教師的專業操守。實施包括國家安全教育在內的國民教育，是世界各地教育當局正當合理的責任，不同地方對實施國家安全教育及培養學生國民身分，包括對各自的憲法、自身歷史、文化、地理等知識，均十分重視。」\n\n　　「學術自由是香港一直推崇的重要社會價值，亦是香港高等教育界賴以成功的基石。自《香港國安法》和《維護國家安全條例》實施以來，本港學者和專上院校繼續與境外和校外合作夥伴進行正常交流活動。同時，本地專上院校已採取一系列措施，將國家安全教育納入學生的學習範圍，以履行其法定責任。各院校在課程設計上享有自主，特區政府鼓勵其就國家安全教育為學生提供多元化的學習機會。」\n\n保持長期繁榮穩定\n\n　　發言人重申：「在『一國兩制』下，香港擁有『背靠祖國、聯通世界』此得天獨厚的顯著優勢，並會藉此繼續發揮其作為『超級連繫人』和『超級增值人』的雙角色。香港亦會繼續發揮其優勢以鞏固國際金融、航運和貿易中心等地位，以及更好融入和服務國家發展大局，包括參與粵港澳大灣區建設、『一帶一路』高質量發展等。在國際排名上，香港在不同經貿領域繼續名列前茅，包括已連續三年獲菲沙研究所評定為全球最自由經濟體。特區政府會繼續積極開拓經濟發展新領域及提升競爭力。事實上，美國在港享有重大的經濟利益，美國對香港的貿易順差過去10年超過2,500億美元，是其全球貿易夥伴中最高之一，目前約1 550家美國公司在港設有業務。這些數字顯示香港跟美國兩地有密切而長遠的經濟往來，而美國企業在香港擁有龐大的商業利益。香港的繁榮穩定對香港及美國均有利。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7826a09bbb","title":"行政長官在平等機會委員會誌慶酒會致辭","url":"https://www.info.gov.hk/gia/general/202611/20/P2026111900232.htm","summary":"以下是行政長官李家超今日（十一月二十日）在平等機會委員會誌慶酒會的視像致辭：  袁古潔副主任（中央人民政府駐香港特別行政區聯絡辦公室副主任）、林美秀主席（平等機會委員會主席）、各位嘉賓…","summary_short":"以下是行政長官李家超今日（十一月二十日）在平等機會委員會誌慶酒會的視像致辭：  袁古潔副主任（中央人民政府駐香港特別行政…","digest":"行政長官在平等機會委員會誌慶酒會致辭（只有中文）（附短片）","points":["以下是行政長官李家超今日（十一月二十日）在平等機會委員會誌慶酒會的視像致辭：","袁古潔副主任（中央人民政府駐香港特別行政區聯絡辦公室副主任）…","很高興參與今日酒會，慶祝平等機會委員會（平機會）的「而立之年」"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T20:00:00+08:00","size":1,"keywords":[],"body":"以下是行政長官李家超今日（十一月二十日）在平等機會委員會誌慶酒會的視像致辭：\n\n袁古潔副主任（中央人民政府駐香港特別行政區聯絡辦公室副主任）、林美秀主席（平等機會委員會主席）、各位嘉賓、各位朋友：\n\n　　大家好！很高興參與今日酒會，慶祝平等機會委員會（平機會）的「而立之年」。\n\n　　平機會作為香港的法定機構，三十年來致力為香港締造平等社會。平機會肩負重任，全力消除基於性別、婚姻狀況、懷孕、餵哺母乳、殘疾、家庭崗位和種族產生的歧視。從個案調查、糾紛調解，到提供法律協助、推動公眾教育，你們為不同背景、不同需要的市民，提供堅實屏障。我肯定平機會多年來的努力與貢獻。\n\n　　香港在「一國兩制」下擁有內聯外通的優勢，是世界最具競爭力的經濟體之一。除了普通法制度、卓越的專業服務和高度開放的營商環境，我們更致力厚植公平、包容的社會土壤，推動香港繁榮穩定、邁步向前。我們致力締造相互尊重的社會，讓市民能在平等的起跑線上盡展所長，讓香港繼續匯聚全球頂尖人才，鞏固國際競爭優勢，激發社會創新活力。\n\n　　特區政府剛公布《香港第一個五年規劃》，明確提出要共建平等關愛社會，積極構建多元共融社區。我們在二○二六至二七年度向平機會撥款超過一億元，支持平機會多元化的公眾宣傳教育等工作，推廣相互尊重、多元包容的價值觀，共同維護社會和諧穩定。\n\n　　特區政府坐言起行，在今年的《施政報告》中多管齊下，為各階層市民排憂解難，推動共建和諧社會。我們把「在校課後託管服務計劃」恆常化，讓雙職父母少一分牽掛，亦逐步提供免費孕前、在孕及產後的資訊服務，讓新手爸媽多一分安心。\n\n　　我們同時擴大非華語學童的中文支援，協助他們跨越語言障礙；亦會增加殘疾人士康復服務名額，為照顧者添一分支撐。這些政策舉措，正是要破除生活上的不同障礙，讓大家都在平等的天空下共享成果、築夢前行。\n\n　　三十載消除歧視，千萬家共享平等。建設關愛共融的社會，需要全社會並肩同行。政府會與平機會緊密合作，讓香港成為一個充滿機遇的國際都會、一個開放包容的共同家園。\n\n　　我祝願平機會踏入新里程繼往開來、再創佳績，在座各位身心康泰。多謝大家！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cff2675ec7d","title":"創新科技與產業發展委員會舉行第九次會議","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000603.htm","summary":"​創新科技及工業局局長孫東教授今日（十一月二十日）下午主持創新科技與產業發展委員會第九次會議。","summary_short":"​創新科技及工業局局長孫東教授今日（十一月二十日）下午主持創新科技與產業發展委員會第九次會議。","digest":"創新科技及工業局局長孫東教授下午主持創新科技與產業發展委員會第九次會議","points":["​創新科技及工業局局長孫東教授今日（十一月二十日）下午主持創新科技與產業發展委員會第九次會議","會議上，委員聽取了政府當局簡介《香港特別行政區經濟和社會發展第一個五年規劃（2026—203…","委員就如何落實《香港第一個五年規劃》所提出的規劃方向，從加快創科產業發展…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T19:45:00+08:00","size":1,"keywords":[],"body":"​創新科技及工業局局長孫東教授今日（十一月二十日）下午主持創新科技與產業發展委員會第九次會議。\n\n　　會議上，委員聽取了政府當局簡介《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》（《香港第一個五年規劃》）和《行政長官2026年施政報告》中有關創新科技及工業局範疇的重點方向和措施。委員就如何落實《香港第一個五年規劃》所提出的規劃方向，從加快創科產業發展、推進新型工業化和布局前沿科技發展等方面提出了多項具建設性的建議，有助政府繼續優化香港創新科技（創科）發展的策略。\n\n　　孫東教授表示：「國家在『十五五』規劃中，明確支持香港建設國際創科中心。特區政府主動對接國家發展戰略，公布了《香港第一個五年規劃》，為創科發展訂立了兩個主要指標，力爭在二○三○年後本地創新活動總開支佔GDP（本地生產總值）達至3%；以及製造及新型工業產業增加價值佔GDP比重達至5.5%。《香港第一個五年規劃》亦提出要在二○三○年後，基本建成立足粵港澳大灣區、輻射全國、聯通世界的國際創科中心。今年《施政報告》已經因應《香港第一個五年規劃》的發展方向，提出具體政策措施。政府致力全面落實《香港第一個五年規劃》的發展藍圖，以及《施政報告》的各項措施，引領香港創科發展邁向新的階段。」\n\n　　創新科技與產業發展委員會於二○二三年三月三日成立，就《香港創新科技發展藍圖》提出推動香港創科發展的方向和策略向政府提供意見，並加強持份者協作。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd86e2ee219","title":"​香港海關搗破製毒工場及毒品分銷中心並檢獲約一百六十萬元懷疑毒品","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000685.htm","summary":"香港海關昨日（十一月十九日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約三點七公斤懷疑大麻花、約三點六公斤懷疑大麻油、約二十四公斤懷疑大麻糖…","summary_short":"香港海關昨日（十一月十九日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約三點七公斤懷疑大麻花…","digest":"香港海關在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場…","points":["香港海關昨日（十一月十九日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場…","海關人員透過情報分析及深入調查，並鎖定兩名男子採取執法行動","海關人員於昨日押解一名二十三歲目標男子及一名二十八歲同行女子到屯門一個住宅單位進行搜查…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T19:43:19+08:00","size":1,"keywords":[],"body":"香港海關昨日（十一月十九日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約三點七公斤懷疑大麻花、約三點六公斤懷疑大麻油、約二十四公斤懷疑大麻糖、一千一百四十八支懷疑大麻油煙彈及一批懷疑毒品包裝及製毒工具，估計市值共約一百六十萬元，並拘捕三人。\n\n　　海關人員透過情報分析及深入調查，並鎖定兩名男子採取執法行動。海關人員於昨日押解一名二十三歲目標男子及一名二十八歲同行女子到屯門一個住宅單位進行搜查，在單位內檢獲約三點七公斤嘅懷疑大麻花、三百三十二支懷疑大麻油煙彈、約一百八十克懷疑大麻糖及一批懷疑毒品包裝工具。海關人員其後押解另外一名三十三歲目標男子到荃灣一個酒店單位進行搜查，在單位內檢獲約三點六公斤嘅懷疑大麻油、八百一十六支懷疑大麻油煙彈、約二十四公斤懷疑大麻糖及一批懷疑毒品包裝及製毒工具。\n\n　　二十三歲被捕男子及二十八歲被捕女子已被控兩項販運危險藥物罪。而三十三歲被捕男子已被控兩項販運危險藥物罪和一項製造危險藥物罪。案件明日（十一月二十一日）在沙田裁判法院提堂。\n\n　　根據《危險藥物條例》，販運危險藥物屬嚴重罪行，一經定罪，最高可被判罰款五百萬元及終身監禁。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑販毒活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6ca6246f8a","title":"​食環署持續推展「雷霆行動」和「天羅行動」打擊鼠患","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000723.htm","summary":"食物環境衞生署（食環署）發言人今日（十一月二十日）表示，署方持續在全港各區推展「雷霆行動」和「天羅行動」，以專項巡查和精準措施全方位打擊鼠患問題，旨在堵截鼠患源頭，改善社區環境衞生。","summary_short":"食物環境衞生署（食環署）發言人今日（十一月二十日）表示，署方持續在全港各區推展「雷霆行動」和「天羅行動」…","digest":"食物環境衞生署發言人表示，署方持續在全港各區推展「雷霆行動」和「天羅行動」…","points":["食物環境衞生署（食環署）發言人今日（十一月二十日）表示…","自十一月四日開展的「雷霆行動」秉持以風險為本、精準部署的策略，不僅在鼠隻出沒位置捕鼠…","其中，署方近日在九龍城區差館里休憩處及元朗區鳳翔路花園進行針對性滅鼠工作…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T19:33:04+08:00","size":1,"keywords":[],"body":"食物環境衞生署（食環署）發言人今日（十一月二十日）表示，署方持續在全港各區推展「雷霆行動」和「天羅行動」，以專項巡查和精準措施全方位打擊鼠患問題，旨在堵截鼠患源頭，改善社區環境衞生。\n\n　　自十一月四日開展的「雷霆行動」秉持以風險為本、精準部署的策略，不僅在鼠隻出沒位置捕鼠，更主動追查其巢穴及主要藏匿位置，集中力量精準滅鼠，務求盡快壓低鼠隻數目。其中，署方近日在九龍城區差館里休憩處及元朗區鳳翔路花園進行針對性滅鼠工作，並與康樂及文化事務署（康文署）協作，跟進設施修補、環境改善及日常防鼠管理，多管齊下，從源頭治理鼠患。\n\n　　自行動展開以來，截至十一月十九日，食環署已在全港針對性核查1 433個位置，包括1 230個由其他政府部門管理的場地，例如公園及休憩用地。行動中，署方在這些位置發現282個鼠洞／老鼠藏匿點、捕獲161隻活鼠、收集119隻死鼠，並已在162個位置完成毒殺老鼠及封堵相關鼠洞，不排除大部分鼠隻可能已經在鼠洞及隱蔽位置死亡，而未能在檢獲鼠隻數量中全面反映。經過署方覆查，相關地點的鼠蹤已大幅減少。署方會持續推進「雷霆行動」，繼續採取針對性滅鼠措施，直至鼠患得到有效控制甚至杜絕。\n\n　　在差館里休憩處的行動中，食環署人員從巡查發現的鼠穴、花圃圍牆底部有裂隙及垃圾管理問題，精準識別重點治理的位置，配合施放毒餌、設置鼠籠及安排夜間防治鼠患流動隊，集中進行滅鼠。同時，署方已建議康文署人員盡快跟進設施修補工程，並提醒其加強清理休憩處範圍內的食物殘渣與積存雜物。行動中，食環署人員已捕獲12隻活鼠，並完成治理8處老鼠巢穴。食環署執法人員亦針對亂拋垃圾行為，發出2張定額罰款通知書及提出1宗檢控，透過防治與執法，改善場地的環境衞生情況。\n\n　　在鳳翔路花園方面，食環署人員巡查時在2個花圃發現7個活躍鼠穴，場內亦有食物殘渣，食環署人員隨即施放毒餌，並向康文署人員提供防鼠建議。行動中，食環署人員已收集17隻死鼠，並摧毀7個老鼠巢穴。為配合鼠穴治理，康文署人員亦已清走鳳翔路花園內的食物殘渣及積存雜物，加強清潔，並安排在受影響花圃翻土。\n\n　　發言人表示：「追查及消滅鼠穴須要持續跟進，直至鼠患得到有效控制並消除。以行動初期另一個重點地點尖沙咀文化中心為例，在滅鼠工作展開至今已捕獲和檢獲逾百隻老鼠。署方會持續覆查鼠穴及周邊鼠蹤，評估成效及調整部署，並提醒場地管理者做好清潔、防鼠及維修，從源頭鞏固成效。捕鼠數字只顯示部分成果，鼠患持續受控才是整體成效。」\n\n　　署方亦同時推進第三階段「天羅行動」，為期兩周的專項巡查及執法行動已順利完成，期間重點針對食物業處所及其所在商場內食肆的衞生和鼠患問題，並加強巡查商場內其他高風險位置，重點巡查垃圾收集、廚餘處理及相關設施的管理情況，按實際風險採取適當執法行動。\n\n　　在第三階段「天羅行動」中，食環署巡查商場內及其他高風險位置的食肆共1 996次，發出62張「消除蟲鼠通知」、177張「規定食物業處所改善清潔狀況及維修通知」、12項警告及提出115宗檢控；另巡查其他食物業處所共1 369次，發出24張「消除蟲鼠通知」、70張「規定食物業處所改善清潔狀況及維修通知」、4項警告及提出61宗檢控；以及向有關商場及大廈物業管理負責人發出42張「消除蟲鼠通知」。巡查期間，食環署人員並要求相關負責人優化和加快廢物處理、採取有效滅鼠措施、堵塞鼠洞及清除藏匿處等。\n\n　　發言人呼籲，防鼠滅鼠需要政府、場地管理者、食物業處所及市民共同努力，保持環境衞生，妥善處理垃圾，齊心斷絕老鼠的食物來源與藏身之所，從源頭減少鼠患。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca26baaf443","title":"國際基建領袖雲集香港 推動建造業高質量發展","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000692.htm","summary":"由發展局牽頭主辦的國際基建卓越周2026今日（十一月二十日）揭幕。","summary_short":"由發展局牽頭主辦的國際基建卓越周2026今日（十一月二十日）揭幕。","digest":"由發展局牽頭主辦的國際基建卓越周2026揭幕","points":["由發展局牽頭主辦的國際基建卓越周2026今日（十一月二十日）揭幕","活動匯聚建造業界三項盛事，分別為旗艦開幕活動——第二屆國際基建項目領導峰會…","他表示，要建設北部都會區並實現其發展願景，香港必須以智慧城市理念、人工智能、先進工程技術…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T19:25:00+08:00","size":1,"keywords":[],"body":"由發展局牽頭主辦的國際基建卓越周2026今日（十一月二十日）揭幕。活動匯聚建造業界三項盛事，分別為旗艦開幕活動——第二屆國際基建項目領導峰會、模塊建造國際會議2026及建造創新博覽會2026。活動旨在構建建造業頂尖國際交流平台以促進可持續發展、提升推展基建效能，以及加速創新科技落地，成為推動行業升級轉型的重要催化劑。\n\n　　行政長官李家超在國際基建卓越周2026開幕典禮上致辭時表示，在地緣政治瞬息萬變、氣候挑戰迫在眉睫、科技迅速發展的世界中，我們必須憑藉創新、協作及清晰的戰略方向，將理念轉化為具長遠影響的項目。他指出，香港首個五年規劃勾劃出香港未來的戰略藍圖，使企業、投資者和創新者能夠深入了解城市發展及新機遇，並以北部都會區這個五年規劃的核心項目為例，闡述這些發展和機遇。他表示，要建設北部都會區並實現其發展願景，香港必須以智慧城市理念、人工智能、先進工程技術、創新建造方法及材料，打造配合未來需要的基礎設施，並強調協作是建造業邁向卓越的關鍵。\n\n　　其後，李家超見證發展局與多個本地及海外機構交換意向書和合作備忘錄，以推動跨地域、跨領域的深度交流與合作，為更多本地及內地的建造企業及產品「出海」奠定基礎。\n\n　　國家水利部副部長劉冬順在開幕典禮上表示，香港特區政府於今年九月發布首個五年規劃，提出推進粵港澳大灣區建設、推進基礎設施「硬聯通」、推動數字化與基礎設施韌性升級等發展目標，並將發揮背靠祖國、聯通世界作用，鞏固國際基建中心地位。水利部將一如既往深化對港涉水事務交流合作，為粵港澳大灣區高質量發展、維護香港長期繁榮穩定提供堅實的水安全保障。\n\n　　今日同場舉行第二屆國際基建項目領導峰會（峰會），以「灼見賦能　擘畫藍圖」為主題，探討如何應對建造業的挑戰，推動業界升級轉型及高質量發展。\n\n　　發展局局長甯漢豪在峰會午宴致歡迎辭時表示，香港在「一國兩制」下積極融入和服務國家發展大局，致力發揮「超級聯繫人」和「超級增值人」角色，助力國家標準國際化，向世界展示國家的創新科技。政府積極推動建造業升級轉型，邁向高端化、智能化及高質量發展。在提速推進北部都會區建設時，政府積極推行革新，精簡審批程序，並善用人工智能，推動廣泛應用先進建築物料與科技。此外，她和與會者分享了香港自首屆峰會取得的成果，包括在國際建築成本排名持續改善，建築成本由二○二○年的全球第三位回落至本年度的第16位，反映其間成本控制得到顯著改善。\n\n　　發展局常任秘書長（工務）劉俊傑在峰會作主題演講時表示，政府正全速推進北部都會區及多個大型基建項目，為建造業帶來不少機遇。他認為，建造業正面對科技變革、基建升級及氣候應變等機遇和挑戰，並由傳統工程推展模式，邁向更工業化、數碼化及以科技賦能的新階段。展望未來，建造業轉型會以「創新領航」、「人才興業」及「協作致遠」三大動力，推動創新科技、人才培訓及凝聚各方合作，讓建造業持續進步。\n\n　　超過800位來自全球30多個國家／地區的大型基建項目領袖和專家參與峰會，當中包括內地和海外政府高層官員，以及來自國際管理發展學院等知名國際組織的代表。他們在嘉賓演講和專題會議分享基建發展的最新倡議和挑戰。四場專題會議的主題為「北部都會區：把握無限機遇」、「全球先鋒：引領創新浪潮」、「新生代人才：共創互聯未來」及「未來城市：韌性競逐全球」。\n\n　　國際基建卓越周2026其餘兩項重點活動──由模塊建造國際學會與香港大學合辦的模塊建造國際會議2026將於明日（十一月二十一日）舉行，而由發展局、國家住房和城鄉建設部科技與產業化發展中心與建造業議會合辦的建造創新博覽會2026則由十一月二十三日至二十五日展開，展示來自世界各地的尖端建造創新技術。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1c75995f9d","title":"政務司司長出席北角社區客廳開幕典禮致辭","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000724.htm","summary":"以下是政務司司長陳國基今日（十一月二十日）出席北角社區客廳開幕典禮的致辭：  Tim（太古地產行政總裁彭國邦）、Richard（太古集團慈善理事會主席邵瑞德）…","summary_short":"以下是政務司司長陳國基今日（十一月二十日）出席北角社區客廳開幕典禮的致辭：  Tim（太古地產行政總裁彭國邦）…","digest":"政務司司長出席北角社區客廳開幕典禮致辭（只有中文）（附圖／短片）","points":["Tim（太古地產行政總裁彭國邦）、Richard（太古集團慈善理事會主席邵瑞德）…","其實我每次來到社區客廳都開心，今日特別開心，能夠出席北角社區客廳開幕典禮…","社區客廳一間接一間投入服務，充分展現政、商、民三方通力合作的力量…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T19:22:00+08:00","size":1,"keywords":[],"body":"以下是政務司司長陳國基今日（十一月二十日）出席北角社區客廳開幕典禮的致辭：\n\nTim（太古地產行政總裁彭國邦）、Richard（太古集團慈善理事會主席邵瑞德）、Brian（聖雅各福群會執行委員會副主席李民斌）、各位嘉賓、各位街坊、各位朋友：\n\n　　大家好！其實我每次來到社區客廳都開心，今日特別開心，能夠出席北角社區客廳開幕典禮，與大家共同見證今年第10間社區客廳投入服務。\n\n　　每一間社區客廳都有其特點，而這一間的特點就是有很多小朋友。這一點非常重要，因為有很多小朋友，就表示有很多「大朋友」陪伴着他們，而這些「大朋友」通常都是媽媽。剛才我與幾位媽媽聊過，發現她們都表示這個社區客廳對她們的幫助很大。照顧小朋友是天倫之樂，但如果時間很長的話，也是挺辛苦的。所以這裏可以讓她們休息一下，與新朋友聊聊天。我向很多媽媽詢問過，她們都很喜歡來到這裏，而且大多數會經常來。我也希望她們能夠在這裏過得充實、時間過得愉快，小朋友玩得開心，而她們自己也能學到一些新的手藝，這是非常好。\n\n　　社區客廳一間接一間投入服務，充分展現政、商、民三方通力合作的力量，為「劏房」戶開拓更多生活空間，送上更貼心的支援服務。\n\n　　東區是港島最多「劏房」的地區。繼去年三月筲箕灣社區客廳投入服務後，今日開幕的北角社區客廳，可以更進一步為區內有需要的市民送上更多溫暖的服務。\n\n　　我剛才參觀了這間社區客廳的設施，司儀已經提到很多這裏的服務，感覺溫暖、和諧、充滿人情味。兒童遊戲區有小朋友用社區環境作靈感，製作小遊戲；客廳有幾位女士正在縫製咕𠱸套；備餐間也有街坊準備小食，最難得的是大人與小朋友一起準備。我原本以為那些小朋友不懂得做，便問問他們、考考他們，原來他們真的懂得，還向我解釋他在做甚麼以及如何製作，我覺得他們真的很聰明，氣氛很熱鬧。社區客廳不只提供生活空間，更促進街坊交流與互動。所以我常常說，社區客廳不只改善會員的生活，更可以凝聚社區，提升他們對社區的歸屬感。剛才我看到一幅圖畫，描繪了北角區內許多不同的店鋪，表示出大家對北角這個社區都很有歸屬感，也非常熱愛。\n\n　　北角社區客廳實用面積約2 400平方呎，預計可服務270個「劏房」戶，全年服務43 000人次。會員可以在這裏煮食、用膳、接收社區生活資訊、參與活動，更可以認識不同年齡、不同背景的朋友，建立社區溝通和支援平台。\n\n　　營辦機構的服務團隊更會主動走入社區，接觸區內「劏房」戶，介紹他們加入社區客廳大家庭——這一點非常重要——邀請他們來參觀及參加。專業社工會識別高風險家庭，提供輔導、個案支援和轉介，這也是社區客廳的一個重要角色。因為有時候，部分有需要服務的人並不知道自己需要服務，所以當我們的專業社工察覺後，便會主動接觸他們，提供一些他們需要的服務，有時候許多意外，甚至乎是一些悲劇可以避免。社區客廳也提供維修工具、書本、運動器材等日常用品供居民使用，鼓勵他們互相分享。簡單來說，一個客廳應該具備的東西，這裏也有。\n\n　　社區客廳得以順利推行，政、商、民三方合作至關重要。我在此要特別感謝太古地產有限公司及太古集團慈善信託基金提供場地。這種以實際行動貢獻社會、惠及廣大社群的精神，正切合太古集團慈善信託基金「求真務實」的格言。\n\n　　On behalf of the Government, I sincerely thank Swire Properties and the Swire Group Charitable Trust for providing this venue. Your support makes this community living room possible. This generous contribution shows your strong commitment to giving back to society and to build a caring, inclusive Hong Kong. Thank you for making a real difference in people's lives.\n\n　　我亦衷心感謝聖雅各福群會擔任服務營辦機構，全力又全面服務社區。聖雅各福群會歷史悠久，而且服務內容非常豐富及多元化。我認為聖雅各福群會與太古集團聯手，可謂「強強聯手」，所以社區客廳得以如此成功。聖雅各福群會現時也是南昌社區客廳的營辦機構，營運經驗豐富。自二○○○年起，福群會已在東區為「劏房」戶提供功課輔導、兒童發展、津貼申請、居民互助小組、服務轉介等一系列支援服務，非常感謝你們。他們的服務是非常需要及非常重要的。\n\n　　值得一提的是，太古地產及太古慈善基金與福群會早於二○二二年，已在鰂魚涌合作打造社區休憩空間「舍區」，「舍」是「鄰舍」的「舍」，供不同團體舉辦手工藝工作坊、展覽、主題市集等活動，因此，他們一直都是很好的合作夥伴，既有經驗，也很有默契。他們經常鼓勵參加者交流分享，目標是希望建設更美好的社區。今日的北角社區客廳，正是這種優勢互補的良好合作的延伸，有效地把企業資源、社福機構專業和社區參與三部分結合起來。\n\n　　展望未來，政府會繼續擔當推動者和促成者的角色，透過政策引導和跨界別合作，鼓勵社區客廳善用空間和居民網絡，並與地區商戶、企業合作引入資源，讓居民由受助者成為貢獻者，讓社區客廳扎根社區、持續發展，並不斷優化服務，讓更多有需要的家庭受惠。\n\n　　最後，我祝願北角社區客廳運作順利，各位身體健康、生活愉快。多謝大家！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca798804870","title":"公務員學院舉辦首場「多邊主義時代的治理之道」系列講座","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000257.htm","summary":"​公務員學院舉辦「多邊主義時代的治理之道」系列講座，今日（十一月二十日）在公務員學院舉行首場以「亞洲地緣政治與區域變局」為題的講座，由前新加坡外交部長楊榮文主講，香港大學哲學系助理教授黃裕舜博士主持。","summary_short":"​公務員學院舉辦「多邊主義時代的治理之道」系列講座，今日（十一月二十日）在公務員學院舉行首場以「亞洲地緣政治與區域變局」…","digest":"公務員學院舉辦「多邊主義時代的治理之道」系列講座…","points":["​公務員學院舉辦「多邊主義時代的治理之道」系列講座…","​公務員學院院長郭蔭庶在講座致辭時指出，當前地緣政治格局正經歷深刻演變，各國經濟相連…","逾220名分別來自59個決策局／部門的首長級和中高級公務員現場或透過網上參與今日的講座"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T19:05:00+08:00","size":1,"keywords":[],"body":"​公務員學院舉辦「多邊主義時代的治理之道」系列講座，今日（十一月二十日）在公務員學院舉行首場以「亞洲地緣政治與區域變局」為題的講座，由前新加坡外交部長楊榮文主講，香港大學哲學系助理教授黃裕舜博士主持。\n\n　　​公務員學院院長郭蔭庶在講座致辭時指出，當前地緣政治格局正經歷深刻演變，各國經濟相連，沒有國家能獨善其身、孤立發展。香港作為國際金融中心、全球貿易樞紐以及具戰略意義的門戶，擁有獨特優勢，能促進不同制度之間的對話，並為多邊合作及爭議解決提供值得信賴的平台。\n\n　　逾220名分別來自59個決策局／部門的首長級和中高級公務員現場或透過網上參與今日的講座。\n\n　　「多邊主義時代的治理之道」系列邀請全球、區域及本地傑出領袖，分享真知灼見、寶貴經驗與前瞻視野。系列透過思想交流與討論，致力培養公務員的大局思維、深化跨文化理解，並鞏固對良好治理的共同承諾。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c370a7b5eb9","title":"​政務司司長會見傳媒答問內容","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000708.htm","summary":"以下是政務司司長陳國基今日（十一月二十日）出席活動後會見傳媒的答問內容：  記者：司長，請問外界有團體，例如一些宗教團體，原本最近打算就宏福苑舉行一些追思會，但最後都取消了。","summary_short":"以下是政務司司長陳國基今日（十一月二十日）出席活動後會見傳媒的答問內容：  記者：司長，請問外界有團體…","digest":"​政務司司長會見傳媒答問內容（只有中文）（附圖／短片）","points":["以下是政務司司長陳國基今日（十一月二十日）出席活動後會見傳媒的答問內容：","司長，請問外界有團體，例如一些宗教團體，原本最近打算就宏福苑舉行一些追思會，但最後都取消了","請問政府有否接觸過主辦方或要求他們取消"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T19:00:32+08:00","size":1,"keywords":[],"body":"以下是政務司司長陳國基今日（十一月二十日）出席活動後會見傳媒的答問內容：\n\n記者：司長，請問外界有團體，例如一些宗教團體，原本最近打算就宏福苑舉行一些追思會，但最後都取消了。請問政府有否接觸過主辦方或要求他們取消？謝謝。\n\n政務司司長：各位，大家好。宏福苑非常之令人傷心的火災發生了接近一年。首先，我要向受災災民，特別是一些痛失親人的災民，致以很深切的慰問。\n\n　　當然，我聽到有一些團體說受到壓力，取消一些悼念活動。我想在此澄清，亦重申，香港是一個法治之區，任何悼念活動，只要是合法的話，政府絕對容許。我們不會妨礙或阻止市民或災民進行悼念活動，這個政府絕對不會做。甚至如果在有需要的情況下，有關部門會協助這些希望悼念的市民進行悼念。我們亦知道在現時來說有不少團體，包括一些宗教團體都會舉辦一些悼念活動，我們在這方面願意提供協助。市民或災民如果有意參加，我們覺得是可以，甚至我們覺得是一個很正常的做法。\n\n　　但當然我們在網上亦看到，有個別別有用心人士希望利用這次悼念活動而做出一些破壞行為。我想提醒市民，如果參加這些悼念活動時，一定要小心選擇，千萬不要被一些別有用心人士利用進行一些破壞行為，或者一些妨礙他人人身安全的行為。所有違法行為警方一定會依法處理。\n\n　　我們都想做到最好，讓市民或受災災民能夠很安心、很順利地進行一些悼念活動，這是政府一直想做到的。\n\n　　當然，大家都應該在媒體上看到報道，在行政長官親自帶領下，其實整個政府現時正全力協助受火災影響的市民，重新購置家園，甚至大家都會看到絕大部分受災市民的房屋亦已賣給政府，買賣亦已經進行或完成。我們亦正協助他們盡快購買或租置一些他們認為適合的居所。我們希望他們能夠盡快、盡快重新過新生活。\n\n　　另一方面，當然火災帶給我們傷痛之餘，我覺得最重要的一點，就是我們如何進行改革，令到這樣不幸的事情不會再發生，這是政府現正大力進行的，包括調查委員會的120項建議，這些建議都是非常好的建議，我已全部看完，亦開過會議，我亦正統籌各個部門、各局，盡力、盡快落實有關建議。有些建議我們同事構想出一些更好的方法，我歡迎他們這樣做，令以後的火災風險降至最低。\n\n　　另有一件事很重要，就是圍標情況。圍標方面，大家都知道這是一個很嚴重的問題。過去一段時間，政府已進行了一些執法行動，拘捕了不少人，我們在制度上亦會進行改革，讓這樣的圍標行為永遠都不會再發生，這個是政府要做的，我們希望能夠在未來盡快做好這些工作。\n\n　　我再一次澄清，我們所有的災民或市民，只要參加一些合法悼念活動，政府是不會阻止、不會妨礙，在有需要時，我們相關的部門會提供協助，這個是政府的立場。\n\n記者： 你好，想問幾件事，因為聽到說有別有用心的人士，政府有否觀察到有某些特徵或字眼提到，市民要小心揀選？另外，想問政府會否舉行官方悼念活動，無論是官員的層面，或者市民可以公開悼念？假如當日市民去到舉花，原址悼念，警方會如何協助呢？\n\n政務司司長：民間有很多正進行悼念活動，我知道天主教有、基督教亦有、佛教亦有，這些都是很正當的一些團體，我覺得市民應該可以安心參與這些悼念活動，如果他們有懷疑的話，我亦歡迎他們向政府查詢。當然，我亦看到在網上有一些人士說得很直白：他們希望藉這個機會組織一些人走出來，或者做一些破壞行動。我希望市民要很小心去選擇，選擇一些正常的，如果你是佛教徒可以到佛寺，天主教徒可以到天主教堂，我想這些是很正常的選擇，不要因應網上的一些呼籲，就跟從他們，你都不知道他們是甚麼人，這類要小心。因為這類團體可能是一些別有用心的人，以一些悼念儀式吸引一些災民或者市民去參加其違法行動，這是我們最怕看到的。當然，警方亦會留意網上，留意這類活動，如果我們發現這類情況，我們一定會採取行動。當然，我亦希望市民如果他們需要作出悼念的話，能夠在一個很正常、很順利的情況下進行。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9b79274dd4","title":"香港視覺藝術中心舉辦「色生數植」展覽 探索自然環境與數碼科技的共生","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000402.htm","summary":"香港視覺藝術中心今日（十一月二十日）起舉辦「色生數植」展覽，展出藝術家謝炎安和王天行融合自然觀察與藝術想像轉化而成的立體打印雕塑裝置，探討自然與人工、藝術與科技之間的共生可能。","summary_short":"香港視覺藝術中心今日（十一月二十日）起舉辦「色生數植」展覽，展出藝術家謝炎安和王天行融合自然觀察與藝術想像轉化而成的立體…","digest":"香港視覺藝術中心起舉辦「色生數植」展覽…","points":["香港視覺藝術中心今日（十一月二十日）起舉辦「色生數植」展覽…","謝炎安與王天行以香港視覺藝術中心入口附近的榕樹樹墩為創作起點，從香港公園的植物形態…","作品結合繪畫、人工智能輔助生成、數碼建模及立體打印，謝炎安畫作中的鮮明色彩與幻想植物…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T18:50:00+08:00","size":1,"keywords":[],"body":"香港視覺藝術中心今日（十一月二十日）起舉辦「色生數植」展覽，展出藝術家謝炎安和王天行融合自然觀察與藝術想像轉化而成的立體打印雕塑裝置，探討自然與人工、藝術與科技之間的共生可能。\n\n　　謝炎安與王天行以香港視覺藝術中心入口附近的榕樹樹墩為創作起點，從香港公園的植物形態、自然環境及城市記憶汲取靈感，將自然觀察與藝術想像轉化為分布於中心不同樓層的立體打印雕塑裝置。作品結合繪畫、人工智能輔助生成、數碼建模及立體打印，謝炎安畫作中的鮮明色彩與幻想植物，與王天行透過植物觀察與數碼技術發展的形態互相交織，帶領觀眾感受藝術與人工智能結合所帶來的創作可能。\n\n　　展覽由康樂及文化事務署主辦、香港視覺藝術中心籌劃，由十一月二十日至明年四月五日在中區堅尼地道7A香港視覺藝術中心一樓至五樓公共空間舉行，免費入場。有關展覽詳情，請瀏覽網頁（www.apo.hk/tc/web/apo/va_greenery.html）、Facebook專頁（www.facebook.com/hkvac）或Instagram專頁（www.instagram.com/hongkongvisualartscentre）。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c395f1242d5","title":"反非法勞工行動拘五人","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000629.htm","summary":"入境事務處（入境處）於十一月十三日至昨日（十一月十九日）在全港多區展開反非法勞工行動，包括聯同香港警務處（警方）的「風沙行動」，以及聯同香港海關（海關）、警方…","summary_short":"入境事務處（入境處）於十一月十三日至昨日（十一月十九日）在全港多區展開反非法勞工行動…","digest":"入境事務處於十一月十三日至在全港多區展開反非法勞工行動…","points":["入境事務處（入境處）於十一月十三日至昨日（十一月十九日）在全港多區展開反非法勞工行動…","其中，入境處於十一月十三至十五及十七日在盛事舉行期間，聯同海關、警方…","行動中，執法人員拘捕五名懷疑非法勞工，共一男四女，年齡介乎二十一至三十一歲"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T18:06:00+08:00","size":1,"keywords":[],"body":"入境事務處（入境處）於十一月十三日至昨日（十一月十九日）在全港多區展開反非法勞工行動，包括聯同香港警務處（警方）的「風沙行動」，以及聯同香港海關（海關）、警方、食物環境衞生署（食環署）和康樂及文化事務署（康文署）在啟德體育園附近執行的聯合行動。\n\n　　其中，入境處於十一月十三至十五及十七日在盛事舉行期間，聯同海關、警方、食環署和康文署在啟德體育園附近採取聯合行動，打擊非法勞工、流動小販售賣侵權物品及非法兜售演唱會門票活動等。行動中，執法人員拘捕五名懷疑非法勞工，共一男四女，年齡介乎二十一至三十一歲。入境處及有關部門會繼續於盛事舉行期間加強高調巡邏和執法。\n\n　　入境處發言人說：「任何人違反對他有效的逗留條件，即屬犯罪。同時，所有旅客在未獲入境處處長批准前，無論受薪與否，均不得在港從事任何僱傭工作。違例者會遭檢控，一經定罪，最高刑罰為罰款五萬元及監禁兩年。協助及教唆他人違反逗留條件者同罪。」\n\n　　入境處會根據現行機制的標準程序以審核及識別販運人口及／或強迫勞動受害人，對所有行動中被捕的容易受剝削人士（包括非法勞工、非法入境者、性工作者及外籍家庭傭工）進行初步審核。如初步審核結果顯示有任何販運人口及／或強迫勞動指標出現，入境處人員會依據一份標準核對清單再作全面調查及識別程序，以確定當中是否有販運人口及／或強迫勞動的元素。被識別的販運人口及／或強迫勞動受害人會獲提供各項支援和協助，包括緊急介入、診症和治療、輔導、收容或臨時住宿及其他支援服務。入境處呼籲販運人口及／或強迫勞動受害人應立即向有關部門舉報有關罪行。\n\n　　市民可使用舉報非法勞工專線185 185、傳真2824 1166、電郵anti_crime@immd.gov.hk、或登入入境處網址www.immd.gov.hk利用「網上舉報違反入境條例罪行」表格向入境處舉報僱用非法勞工活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8c1fae3cc4","title":"蚊傳疾病登革熱和基孔肯雅熱的最新情況","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000622.htm","summary":"衞生署衞生防護中心（中心）今日（十一月二十日）公布登革熱和基孔肯雅熱的最新情況。","summary_short":"衞生署衞生防護中心（中心）今日（十一月二十日）公布登革熱和基孔肯雅熱的最新情況。","digest":"衞生署衞生防護中心公布登革熱和基孔肯雅熱的最新情況","points":["衞生署衞生防護中心（中心）今日（十一月二十日）公布登革熱和基孔肯雅熱的最新情況","中心提醒市民不論是身處本港或前往受蚊傳疾病影響的地區，均應採取適當防蚊措施，避免被蚊叮咬…","去年（二○二五年）錄得59宗登革熱個案，全部屬外地傳入"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:45:00+08:00","size":1,"keywords":[],"body":"衞生署衞生防護中心（中心）今日（十一月二十日）公布登革熱和基孔肯雅熱的最新情況。中心提醒市民不論是身處本港或前往受蚊傳疾病影響的地區，均應採取適當防蚊措施，避免被蚊叮咬，以預防感染蚊傳疾病。\n\n登革熱\n\n———\n\n　　由十一月十三日至昨日（十一月十九日），中心錄得兩宗外地傳入的登革熱感染個案，兩名病人於潛伏期內分別到過越南及柬埔寨。\n\n　　本港今年暫時累計錄得42宗登革熱個案，包括40宗外地傳入及兩宗本地感染個案。去年（二○二五年）錄得59宗登革熱個案，全部屬外地傳入。二○二四年共錄得161宗登革熱個案，包括156宗外地傳入及五宗本地感染個案。\n\n　　世界衞生組織（世衞）資料顯示，登革熱的全球發病率在過去20年顯著上升，構成重大公共衞生挑戰。世衞在二○二四年錄得超過1 400萬宗登革熱個案，創歷史新高。去年，全球超過90個國家／地區呈報了超過500萬宗登革熱個案和超過4 000宗相關死亡個案。今年一月至九月，全球共錄得約250萬宗登革熱個案和超過1 500宗相關死亡個案。\n\n　　登革熱在不少鄰近旅遊地點一直普遍流行。今年至今，孟加拉國、柬埔寨、斯里蘭卡及越南已分別錄得超過100 000宗個案；印度尼西亞錄得超過90 000宗個案；馬來西亞錄得超過80 000宗個案；印度錄得超過70 000宗個案；新加坡亦錄得超過3 000宗個案。另外，根據廣東省疾病預防控制局（疾控局）的資料，廣東省今年（截至九月）錄得586宗感染個案，其中155宗於九月錄得。\n\n　　有關香港和鄰近及海外國家及地區的登革熱最新情況，已上載至衞生防護中心的網頁。\n\n基孔肯雅熱\n\n—————\n\n　　由十一月十三日至昨日，中心錄得一宗外地傳入的基孔肯雅熱感染個案，涉及一名71歲男子，他於潛伏期內曾到過中國內地。中心認為病人在外遊期間受到感染，屬輸入個案。病人獲安排入院在無蚊環境下接受治療，現時情況穩定。中心會繼續進行流行病學調查，並已把個案通報中國內地衞生當局。\n\n　　本港今年暫時累計錄得九宗基孔肯雅熱確診個案，包括八宗輸入及一宗本地感染個案。本港去年錄得82宗基孔肯雅熱確診個案中，11宗屬本地個案，其餘全部屬輸入個案。\n\n　　世衞資料顯示，截至今年十月，全球共呈報了363 307宗基孔肯雅熱病例及122宗相關死亡個案。其中，世衞美洲區域和東南亞區域的通報病例佔比最高。另外，根據廣東省疾控局的資料，今年（截至九月）廣東省共錄得1 753宗感染個案，其中1 014宗於九月錄得，大幅高於七月至八月錄得的宗數（171至496宗）。\n\n市民應採取的防預措施\n\n——————————\n\n　　中心提醒市民保持環境衞生，不論是身處本港或前往受蚊傳疾病影響的地區，均應採取適當防蚊措施，避免被蚊叮咬，以預防感染蚊傳疾病。登革熱和基孔肯雅熱等蚊傳疾病在全球多國持續爆發，輸入風險存在，市民外遊前必須注意當地情況，尤其前往東南亞國家。此外，不論是否外遊，市民應使用含避蚊胺或其他有效活性成分的昆蟲驅避劑以防被蚊子叮咬，但使用時應注意以下事項：\n\n 先仔細閱讀標籤說明；\n\n 在進入可能被蚊叮的範圍前使用；\n\n 塗在外露皮膚及衣服；\n\n 孕婦使用避蚊胺的濃度上限是30%，兒童則為10%（如前往蚊傳疾病流行的國家或地區而有機會被蚊叮咬，兩個月或以上的兒童可使用濃度上限為30%的避蚊胺）；\n\n 先塗防曬霜，再塗昆蟲驅避劑；\n\n 遵照標籤說明，只於有需要時重複使用；及\n\n 除了避蚊胺之外，市面上亦有含其他活性成分的昆蟲驅避劑，例如IR3535、埃卡瑞丁（亦稱派卡瑞丁）等。公眾使用任何昆蟲驅避劑時，應遵從產品標籤上的使用說明及注意事項。\n\n​　　食物環境衞生署（食環署）呼籲市民繼續提高警覺及攜手合作，及早於家居及其他環境採取防蚊及滅蚊措施，包括視察家居及附近環境、徹底清除可供蚊子滋生的地方、每周最少一次徹底更換花瓶的水及擦洗內壁並清倒盆栽墊碟的水、妥善棄置空罐和飯盒等容器。此外，食環署亦建議市民和物業管理公司，應保持溝渠暢通及填平凹陷的地面，以防積水，並每周最少一次以鹼性清潔劑擦洗溝渠和排水明渠，除去可能積聚的蚊卵。\n\n　　市民如發現蚊患，應致電1823，亦可參閱以下專題網頁，了解詳情：衞生防護中心及旅遊健康服務基孔肯雅熱專頁、最新旅遊情報、使用昆蟲驅避劑的注意事項、中心Facebook專頁、Instagram帳戶及YouTube頻道，以及食環署防控蚊患專頁。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7e2467f52f","title":"民青局在創業日2026設置大灣區香港青年創新創業基地聯盟展館及舉辦專題研討會支持青年逐夢創業","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000273.htm","summary":"民政及青年事務局（民青局）今日（十一月二十日）在香港貿易發展局創業日2026舉辦專題研討會，並設置大灣區香港青年創新創業基地聯盟（聯盟）展館…","summary_short":"民政及青年事務局（民青局）今日（十一月二十日）在香港貿易發展局創業日2026舉辦專題研討會…","digest":"民政及青年事務局在香港貿易發展局創業日2026舉辦專題研討會…","points":["民政及青年事務局（民青局）今日（十一月二十日）在香港貿易發展局創業日2026舉辦專題研討會…","民青局局長麥美娟為專題研討會致開幕辭時表示，特區政府十分重視青年發展","她指出，《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》強調要開拓青年…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:45:00+08:00","size":1,"keywords":[],"body":"民政及青年事務局（民青局）今日（十一月二十日）在香港貿易發展局創業日2026舉辦專題研討會，並設置大灣區香港青年創新創業基地聯盟（聯盟）展館，向青年創業者及各界展示聯盟的支援服務和粵港澳大灣區的創業機遇。\n\n　　民青局局長麥美娟為專題研討會致開幕辭時表示，特區政府十分重視青年發展。她指出，《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》強調要開拓青年發展空間及支持青年逐夢前行，特區政府致力推動青年把握粵港澳大灣區機遇，透過聯盟激發創新與創業活力，助力青年逐夢圓夢。\n\n　　麥美娟表示，粵港兩地政府一直為有志於大灣區創業的青年提供多項扶持政策，區內創業氛圍愈見濃厚。她感謝廣東省人民政府港澳事務辦公室和廣東省人力資源和社會保障廳對聯盟工作的大力支持。民青局會繼續透過聯盟與各持份者加強合作，支持香港青年在大灣區創業，積極參與大灣區發展，更好融入和服務國家發展大局。\n\n　　是次專題研討會以「匯聚聯盟力量　支持青年逐夢創業」為題，邀請民青局粵港澳大灣區青年創業資助計劃的獲資助機構代表、青年創業團隊、粵港澳大灣區的創新創業基地代表，以及較早前出席亞太區經濟合作組織官方青年創新創業項目——APEC Young Entrepreneurs Conference的中國香港青年代表團成員，分享聯盟成員與青年創業團隊間的緊密合作，發揮一加一大於二的協同效應，協助香港青年在大灣區創新創業，並分享他們參與國際會議的體會和收穫。民青局亦邀得大灣區內地九個城市的創新創業基地代表，介紹當地創業政策及基地服務，讓青年創業者更掌握在大灣區落戶發展的資訊，提升在大灣區創新創業的能力和信心。\n\n　　是次專題研討會同場舉行聯盟新成員歡迎儀式，歡迎四個新成員機構加入，進一步擴大聯盟在粵港澳大灣區的創新創業基地網絡。\n\n　　聯盟由民青局、廣東省人民政府港澳事務辦公室及廣東省人力資源和社會保障廳於二○二三年十二月共同牽頭成立，匯聚約70個來自粵港兩地不同界別的成員機構，為青年創業者提供一站式的資訊、宣傳及交流平台。聯盟成立近三年來，各成員在粵港兩地籌辦超過480項不同類型的活動，支持處於不同發展階段的創業青年，協助他們拓展人際網絡和提升競爭力。聯盟的創新創業基地已全面覆蓋大灣區九個內地城市。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c354779fa50","title":"民政事務總署已開放臨時避寒中心","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000577.htm","summary":"民政事務總署今日（十一月二十日）已在各區開放共十八間臨時避寒中心，供有需要的市民避寒。","summary_short":"民政事務總署今日（十一月二十日）已在各區開放共十八間臨時避寒中心，供有需要的市民避寒。","digest":"民政事務總署已在各區開放共十八間臨時避寒中心，供有需要的市民避寒","points":["民政事務總署今日（十一月二十日）已在各區開放共十八間臨時避寒中心，供有需要的市民避寒","中心會於寒冷天氣警告持續生效期間繼續開放","各臨時避寒中心在開放期間會免費提供潔淨的墊褥和毛氈／棉被、熱食和熱水予入住人士使用"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:30:00+08:00","size":1,"keywords":[],"body":"民政事務總署今日（十一月二十日）已在各區開放共十八間臨時避寒中心，供有需要的市民避寒。中心會於寒冷天氣警告持續生效期間繼續開放。\n\n　　各臨時避寒中心在開放期間會免費提供潔淨的墊褥和毛氈／棉被、熱食和熱水予入住人士使用。\n\n　　為確保入住臨時避寒中心的人士可以在寧靜及不受干擾的環境下休息，任何市民或團體如希望送贈物品給入住者，須先聯絡中心職員進行登記，然後將物品放置在指定的室內地點。中心職員會協助通知入住者有關安排，讓他們自行領取所需物品。\n\n　　任何人士如需使用避寒中心或查詢有關在中心派贈物品的安排，可致電民政事務總署熱線2572 8427。\n\n　　十八間臨時避寒中心的位置如下：\n\n香港島：\n\n———\n\n中西區－西營盤高街2號西營盤社區綜合大樓3樓西營盤社區綜合大樓社區會堂\n\n東區－銅鑼灣福蔭道7號3樓銅鑼灣社區中心\n\n南區－鴨脷洲利東邨利東社區會堂\n\n灣仔－灣仔皇后大道東258號灣仔街市地下低層灣仔活動中心\n\n九龍：\n\n———\n\n九龍城－紅磡庇利街42號九龍城政府合署1樓紅磡社區會堂\n\n觀塘－藍田碧雲道223號藍田社區綜合大樓2樓藍田（東區）社區會堂\n\n深水埗－深水埗昌新里1號南昌社區中心\n\n黃大仙－鑽石山鳳德道111號鳳德邨鳳德社區中心\n\n油尖旺－油麻地眾坊街60號梁顯利油麻地社區中心\n\n新界：\n\n———\n\n離島－東涌文東路39號東涌市政大樓地下東涌社區會堂\n\n葵青－葵涌大窩口道15號大窩口社區中心\n\n北區－粉嶺祥華邨祥華社區會堂\n\n西貢－將軍澳坑口培成路38號西貢將軍澳政府綜合大樓地下坑口社區會堂\n\n沙田－沙田隆亨邨隆亨社區中心\n\n大埔－大埔鄉事會街2號大埔社區中心\n\n荃灣－荃灣梨木樹邨康樹樓地下梨木樹社區會堂\n\n屯門－屯門湖山路101號湖山路社區會堂\n\n元朗－元朗朗屏邨朗屏社區會堂","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1d393794bb","title":"一名女子因非法進口另類吸煙產品被判監六個月","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000462.htm","summary":"一名女子因非法進口38 000支另類吸煙產品，今日（十一月二十日）於西九龍裁判法院被判即時監禁六個月。","summary_short":"一名女子因非法進口38 000支另類吸煙產品，今日（十一月二十日）於西九龍裁判法院被判即時監禁六個月。","digest":"一名女子因非法進口38 000支另類吸煙產品，於西九龍裁判法院被判即時監禁六個月","points":["一名女子因非法進口38 000支另類吸煙產品，今日（十一月二十日）於西九龍裁判法院被判即時監…","衞生署歡迎判決，並忠告市民和旅客切勿攜帶電子煙、加熱煙產品或草本煙等另類吸煙產品進入香港…","衞生署控煙酒辦公室（控煙酒辦）昨日（十一月十九日）接獲香港海關通知…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:30:00+08:00","size":1,"keywords":[],"body":"一名女子因非法進口38 000支另類吸煙產品，今日（十一月二十日）於西九龍裁判法院被判即時監禁六個月。衞生署歡迎判決，並忠告市民和旅客切勿攜帶電子煙、加熱煙產品或草本煙等另類吸煙產品進入香港，亦不應使用任何另類吸煙產品。\n\n　　衞生署控煙酒辦公室（控煙酒辦）昨日（十一月十九日）接獲香港海關通知，於該名自日本抵港女子的行李中，檢獲38 000支另類吸煙產品。控煙酒辦隨即拘捕及檢控該名人士。\n\n　　自《2025年控煙法例（修訂）條例》中有關控煙酒辦督察拘捕權的修訂於二○二五年九月十九日生效以來，控煙酒辦已就34宗攜帶大量另類吸煙產品入境的案件提出檢控，共有37人被定罪和被判處監禁，刑期由四星期至八個月不等。\n\n　　根據《進出口條例》（第60章），任何人進口另類吸煙產品，包括電子煙、加熱煙產品及草本煙，即屬違法，經簡易程序定罪，可判處罰款50萬及監禁兩年；而經公訴程序定罪，則可判處罰款200萬元及監禁七年。\n\n　　根據《吸煙（公眾衞生）條例》（第371章），任何人不得推廣、製造、售賣或為商業目的而管有另類吸煙產品。違例者一經定罪，最高可處罰款五萬元及監禁六個月。\n\n　　控煙酒辦會繼續密切監察和持續執法以打擊相關違法行為。\n\n　　此外，衞生署忠告市民，另類吸煙產品會令人上癮，絕非有效的戒煙工具或減害工具。電子煙亦可增加患上癌症、呼吸系統疾病、心血管疾病之風險。吸煙人士為個人及他人健康着想，應盡快戒煙。市民可致電衞生署綜合戒煙熱線1833 183，或瀏覽www.livetobaccofree.hk，以獲取有關戒煙的資訊。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3a1109e446","title":"​《2026年虛擬資產服務法例（修訂）條例草案》刊憲","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000578.htm","summary":"政府今日（十一月二十日）在憲報刊登《2026年虛擬資產服務法例（修訂）條例草案》（《條例草案》）。","summary_short":"政府今日（十一月二十日）在憲報刊登《2026年虛擬資產服務法例（修訂）條例草案》（《條例草案》）。","digest":"政府在憲報刊登《2026年虛擬資產服務法例條例草案》","points":["《條例草案》旨在擴大虛擬資產服務的規管制度至涵蓋四類新增服務類型（包括交易、提供意見…","《條例草案》建議修訂《打擊洗錢及恐怖分子資金籌集條例》（第615章）…","受香港金融管理局（金管局）監管的銀行及儲值支付工具持牌人，如要在香港提供任何虛擬資產的服務…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:15:00+08:00","size":1,"keywords":[],"body":"政府今日（十一月二十日）在憲報刊登《2026年虛擬資產服務法例（修訂）條例草案》（《條例草案》）。《條例草案》旨在擴大虛擬資產服務的規管制度至涵蓋四類新增服務類型（包括交易、提供意見、管理及託管服務），以為相關虛擬資產服務提供者提供清晰的合規路徑，同時為投資者提供更充分保障，將有助促進香港數字資產市場穩健及可持續發展。\n\n　　《條例草案》建議修訂《打擊洗錢及恐怖分子資金籌集條例》（第615章），規定任何人在香港從事有關虛擬資產交易、提供意見、管理或託管的業務必須獲證券及期貨事務監察委員會（證監會）發牌或註冊，並須符合適當人選的評定準則及其他相關規管要求。受香港金融管理局（金管局）監管的銀行及儲值支付工具持牌人，如要在香港提供任何虛擬資產的服務，亦須向證監會註冊。《條例草案》將賦予證監會和香港金融管理局相關權力，以按照法定要求實施有關制度。《條例草案》擬議的監管制度參照了國際間就虛擬資產在反洗錢及投資者保障方面的標準及監管趨勢，同時充分考慮了本地情況，並與香港適用於傳統金融服務的標準接軌。\n\n　　財經事務及庫務局局長許正宇表示：「《香港第一個五年規劃》提出，香港應秉持「相同業務、相同風險、相同規則」原則，構建全球領先的數字資產監管制度，提升數字資產流動性及市場創新發展。此目標與我們去年發表的《香港數字資產發展政策宣言2.0》所述的願景一致。是次法例修訂工作是落實上述目標及願景的重要一步，將優化香港數字資產規管框架，貫通相關市場活動的主要節點，有助我們構建一個值得信賴、可持續的數字資產生態圈。」\n\n　　證監會行政總裁梁鳳儀表示：「這項立法建議是香港完善虛擬資產監管框架的重要里程碑。全面而穩健的監管制度不但能加強投資者保障，亦能為負責任的創新提供清晰的發展路徑，為香港數字資產生態圈的長遠及可持續發展奠定穩固基礎。」\n\n　　《條例草案》將於十二月二日提交立法會進行首讀。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c02c8de7ad7","title":"臘味時令食品調查結果滿意","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000400.htm","summary":"食物環境衞生署食物安全中心（中心）今日（十一月二十日）公布，最近完成一項有關臘味的時令食品調查結果，一百六十四個樣本全部通過檢測。","summary_short":"食物環境衞生署食物安全中心（中心）今日（十一月二十日）公布，最近完成一項有關臘味的時令食品調查結果…","digest":"食物環境衞生署食物安全中心公布，最近完成一項有關臘味的時令食品調查結果…","points":["食物環境衞生署食物安全中心（中心）今日（十一月二十日）公布…","中心發言人說：「踏入冬季，不少市民喜歡進食臘味，因此中心從不同零售商（包括網上零售商）抽取不…","發言人說：「臘味含有硝酸鹽及亞硝酸鹽，亞硝胺亦帶來潛在風險，部分臘味的鈉…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:15:00+08:00","size":1,"keywords":[],"body":"食物環境衞生署食物安全中心（中心）今日（十一月二十日）公布，最近完成一項有關臘味的時令食品調查結果，一百六十四個樣本全部通過檢測。\n\n　　中心發言人說：「踏入冬季，不少市民喜歡進食臘味，因此中心從不同零售商（包括網上零售商）抽取不同種類的臘味樣本，包括臘腸、膶腸、臘鴨及臘肉，進行化學和營養成分測試。」\n\n　　化學檢測包括獸藥殘餘、金屬雜質、較常用於醃製食品的防腐劑，以及製作過程可能使用的其他食物添加劑和不准添加於食物的染色料；營養成分測試則檢測樣本的能量、碳水化合物、蛋白質、總脂肪、飽和脂肪酸、反式脂肪酸、鈉和糖等含量，與其營養標籤上的標示值是否相符。\n\n　　發言人說：「臘味含有硝酸鹽及亞硝酸鹽，亞硝胺亦帶來潛在風險，部分臘味的鈉、糖和脂肪含量也較高，市民須注意均衡飲食，不宜過量進食臘味。嬰兒較易出現亞硝酸鹽中毒，所以不宜食用臘味，小孩也不宜多吃。」\n\n　　「此外，世界衞生組織轄下的國際癌症研究機構已將加工肉類歸類為『令人類致癌』（即第1組）。市民應避免進食過量加工肉類，以減低患大腸癌的風險。」\n\n　　​發言人亦呼籲業界遵守有關法例規定，並依從優良製造規範，適當地使用法例准許的食物添加劑。零售商應向可靠的供應商採購食物，並遵從《食物安全條例》的要求，保存良好的紀錄，以便在有需要時追查食物來源。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c610af48afd","title":"兩名入境旅客進口未完稅香煙罪成判囚","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000581.htm","summary":"兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》（第109章）；其中一人更因進口另類吸煙產品而違反《進出口條例》（第60章）。","summary_short":"兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》（第109章）…","digest":"兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》…","points":["兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》（第109章）","其中一人更因進口另類吸煙產品而違反《進出口條例》（第60章）","二人今日（十一月二十日）在西九龍裁判法院被判處監禁五至六個月，及罰款一千至二千元"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:05:00+08:00","size":1,"keywords":[],"body":"兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》（第109章）；其中一人更因進口另類吸煙產品而違反《進出口條例》（第60章）。二人今日（十一月二十日）在西九龍裁判法院被判處監禁五至六個月，及罰款一千至二千元。\n\n　　海關人員於四月十四日在香港國際機場截查一名四十七歲抵港內地女旅客，並在她的個人行李內檢獲二萬六千支未完稅香煙，估計市值約十萬六千元，應課稅值約八萬六千元。該名旅客隨即被捕。她今日被判處監禁五個月及罰款一千元。\n\n　　此外，海關人員昨日（十一月十九日）在香港國際機場截查一名五十八歲抵港內地男旅客，並在他的個人行李內檢獲約四十支未完稅香煙及四萬件另類吸煙產品，估計市值約十二萬元，應課稅值約一百三十元。該名亦旅客隨即被捕。他今日被判處監禁六個月及罰款二千元。\n\n　　海關歡迎裁決，監禁刑罰具相當阻嚇作用，並充分反映罪行的嚴重性。\n\n　　海關提醒市民及旅客，根據《應課稅品條例》，香煙屬應課稅品。任何人若進口、處理、管有、售賣或購買私煙即屬違法，一經定罪，最高可被判罰款二百萬元及監禁七年。\n\n　　另外，根據《進出口條例》，任何人進口另類吸煙產品即屬違法，一經定罪，最高可被判罰款二百萬元及監禁七年。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑私煙活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":15,"items":[{"id":"c5bebab102e","title":"第三届推进中华民族共同体建设学术研讨会在南宁举办","url":"https://www.chinanews.com.cn/mz/2026/11-20/10735577.shtml","summary":"中新网南宁11月20日电(记者 黄艳梅)第三届推进中华民族共同体建设学术研讨会20日在广西南宁举办。","summary_short":"中新网南宁11月20日电(记者 黄艳梅)第三届推进中华民族共同体建设学术研讨会20日在广西南宁举办。","digest":"第三届推进中华民族共同体建设学术研讨会20日在广西南宁举办","points":["会议聚焦“弘扬伟大长征精神与推进中华民族共同体建设”主题…","本次研讨会由广西大学主办，广西大学铸牢中华民族共同体意识研究院…","来自广西桂林、贺州民族工作部门的基层代表，结合湘江战役红色资源开发…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:04:42+08:00","size":1,"keywords":[],"body":"中新网南宁11月20日电(记者 黄艳梅)第三届推进中华民族共同体建设学术研讨会20日在广西南宁举办。会议聚焦“弘扬伟大长征精神与推进中华民族共同体建设”主题，汇聚国内多所高校专家学者以及广西民族工作一线工作者，立足中国工农红军长征胜利90周年重要时间节点，深挖红色文化资源，探索新时代中华民族共同体建设的理论路径与地方实践模式。\n\n图为研讨会现场。广西大学 供图\n\n　　本次研讨会由广西大学主办，广西大学铸牢中华民族共同体意识研究院、中国人民大学铸牢中华民族共同体意识研究院广西分院承办。\n\n　　广西大学党委书记徐华蕊在开幕致辞中介绍，广西是边疆民族地区，承担着建设铸牢中华民族共同体意识示范区的重大使命。红军长征在广西留下宝贵红色财富，“四个与共”的共同体理念深深扎根八桂大地。作为广西“双一流”高校，广西大学坚持把铸牢中华民族共同体意识贯穿办学治校全过程，强化有组织科研，推进共同体意识课程教学，产出一批服务地方发展的科研成果，努力为边疆民族地区高质量发展提供学理支撑和智力支持。\n\n　　主旨报告环节，来自中国人民大学、中央民族大学、中共中央党校(国家行政学院)、中南民族大学、海南大学等高校的专家学者，分别从各民族共同现代化、边疆安全守护、长征路上党促进民族团结的历史实践、自主民族知识体系构建、中国式现代化建设等维度分享前沿学术观点。来自广西桂林、贺州民族工作部门的基层代表，结合湘江战役红色资源开发、沉浸式民族团结教育等本土实践，分享广西地方推进中华民族共同体建设的经验。\n\n　　在平行分论坛中，与会人员围绕红色文艺、非遗、边疆社会治理、口岸经济等议题，开展跨学科对话，把学术研究同广西边疆建设现实问题紧密结合。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cda7c954cb9","title":"浙江探路综合高中 给成长多留一段“缓冲期”","url":"https://www.chinanews.com.cn/edu/2026/11-20/10735521.shtml","summary":"中新网杭州11月20日电 题：浙江探路综合高中 给成长多留一段“缓冲期”  　　作者 林波 曹丹 孙琳茹  　　走进杭州市美术高级中学画室，二十余名学生坐在画架前临摹人物头像。","summary_short":"中新网杭州11月20日电 题：浙江探路综合高中 给成长多留一段“缓冲期”  　　作者 林波 曹丹 孙琳茹  　　走进杭州…","digest":"题：浙江探路综合高中 给成长多留一段“缓冲期”  　　作者 林波 曹丹 孙琳茹…","points":["走进杭州市美术高级中学画室，二十余名学生坐在画架前临摹人物头像","2026年是“十五五”开局之年，《教育强国建设规划纲要(2024—2035年)》提出“统筹推…","浙江率先探路，2025年启动首批12所综合高中试点，2026年扩容至37所"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:41:09+08:00","size":1,"keywords":[],"body":"中新网杭州11月20日电 题：浙江探路综合高中 给成长多留一段“缓冲期”\n\n　　作者 林波 曹丹 孙琳茹\n\n　　走进杭州市美术高级中学画室，二十余名学生坐在画架前临摹人物头像。教师穿行其间，俯身指导学生作画。后墙张贴的优秀习作里，有不少出自高二学生徐进之手。\n\n近日，杭州美术高级中学学生在画室内练习。曹丹 摄\n\n　　“初中时我一度对未来的升学方向感到迷茫。中考填报志愿时，发现浙江省新增了综合高中试点，深入了解后，觉得非常适合我。”徐进说，自己一直喜爱绘画，但此前没有接受过系统训练，来到这里后逐渐找到了成长方向。\n\n　　2026年是“十五五”开局之年，《教育强国建设规划纲要(2024—2035年)》提出“统筹推进市域内高中阶段学校多样化发展”，综合高中成为这项改革的重要抓手。浙江率先探路，2025年启动首批12所综合高中试点，2026年扩容至37所。\n\n　　综合高中并非另起一条升学通道，而是在普高与职教之间增加一段可调整的缓冲期。\n\n　　“综合高中最大的特点，就是赋予学生选择权。”杭州市美术高级中学党委书记俞松涛表示，“初中毕业生大多只有16岁，对职业认知尚不充分，很难早早确定未来发展方向。”\n\n　　按照浙江综合高中制度设计，学生在校三年拥有多次动态选择的机会，在此期间可以结合自身学习状态与兴趣，自主选择普通高考、艺术类高考、职教高考等发展方向。在语文和数学学考合格的前提下，学生无需转换学籍，全程保留普高学籍。\n\n　　创办于1979年的杭州市美术高级中学，以美术教育为办学特色，也是浙江省首批、杭州市首个综合高中试点校。\n\n　　据了解，该校每周开设速写、素描、色彩等艺术类专业基础课程，同时文化课严格按照普通高中课程方案开设。每周四下午还设置了职业体验类选修课程，帮助学生近距离感知专业、认知职业方向，科学选择适配自身的成长赛道。\n\n　　高一学生张智彬根据爱好，选修了国画与摄影课程。“摄影课先讲授理论，后续会安排外出采风实践，国画从基础理论入手，留给我们慢慢摸索练习的空间。”\n\n　　在他看来，综合高中给了自己一个缓冲的机会。“学校既兼顾文化课学习与艺术特长培养，升学和就业的选择也更为多元。”\n\n　　把选择权交给学生和家长，是浙江综合高中改革的共同导向。在衢州龙游县综合高中，学校对不同升学路径的选择与生涯规划引导前置到了高一阶段。\n\n　　11月中旬，龙游县综合高中的高一学生刚结束期中考试，学校便紧锣密鼓地对252名高一学生开展全员家访，做到一人不落。这得益于去年首届学生的经验。\n\n　　“第一学期期中前后，学校就以结对方式开展全员家访，向学生和家长讲清两条升学路径的差异，最终由学生和家长自主选择。”龙游县综合高中校长徐滔红介绍，经过半个学期的学习体验，学生结合自身感受和期中考试情况，与家长共同研判，为路径选择做好铺垫。“这对学生后期安心学习很有助益。”\n\n　　据了解，龙游县综合高中推行“0.5+0.5+2”弹性学制。高一上学期以普高核心课程为主，同步开设四门专业选修课，学生可在高一第一或第二学期结束，自主选定普通高考或职教单考单招两条升学通道。\n\n　　首届综合高中160名学生在高一第一学期末完成首次选科分班，4个班级里设1个普高班、3个职教单考班，覆盖化工、机械、护理、电商4个专业方向。进入高一下学期，有11名学生申请从普高班转入职教单考班，2名学生从职教单考班转回普高班，另有6名学生在职教班内更换了专业方向。\n\n　　“每一份申请都得到学校大力支持。”徐滔红说。\n\n　　高二学生刘世泽就是这样定下职教方向的。“家访时，老师向我们介绍了综合高中的学籍规则、培养模式和学习强度。”在四门技术课程轮番体验后，他选定化工方向。\n\n　　“化工是我的优势学科，特别是上过体验课后，我确认自己对这个领域有兴趣。”刘世泽计划未来攻读环境监测相关专业，“学成后希望回到龙游工作”。\n\n　　改革落地推进过程中，一系列新课题也随之显现。多位学校负责人表示，综合高中下一步攻坚重点是实现“融而通”，避免普高文化课与职教专业课简单拼凑、形成“课程拼盘”。\n\n　　俞松涛说，学校将牵头开发文化课与职业技能融通的校本教材，探索跨界项目式学习，把普高的知识基础和职业技能训练有机结合，让学生听得懂、学得会、用得上。\n\n　　育人目标不止于升学选择。对高中生而言，三年求学收获的不只是书本知识，更重要的是认清自身适配方向，并为自己的选择承担责任。\n\n　　校方期待通过三年系统培育，帮助学生形成清晰稳定的职业认知，为今后的职业选择乃至职业转型打下扎实基础。\n\n　　“让孩子在高中学习期间保持良好心态，学习才有持续动力。”徐滔红说。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdf2a6baa72","title":"湖北云梦秦墓首现“广秦者”刻铭漆木器","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-20/news1075609.shtml","summary":"记者近日从湖北省文物考古研究院获悉，湖北云梦老虎墩墓地出土三批珍贵秦简，并首现“广秦者”刻铭漆木器。","summary_short":"记者近日从湖北省文物考古研究院获悉，湖北云梦老虎墩墓地出土三批珍贵秦简，并首现“广秦者”刻铭漆木器。","digest":"记者近日从湖北省文物考古研究院获悉，湖北云梦老虎墩墓地出土三批珍贵秦简…","points":["近日从湖北省文物考古研究院获悉，湖北云梦老虎墩墓地出土三批珍贵秦简…","老虎墩墓地位于湖北省云梦县城关镇，分布于楚王城城址的东南郊，西距龙岗墓地约900米…","2026年6月以来，为配合云梦县市政建设，经中国国家文物局批准…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T20:33:36+08:00","size":1,"keywords":[],"body":"记者近日从湖北省文物考古研究院获悉，湖北云梦老虎墩墓地出土三批珍贵秦简，并首现“广秦者”刻铭漆木器。相关文字材料为研究中国大一统历史进程关键节点提供重要实物佐证，填补相关领域空白。\n\n老虎墩墓地位于湖北省云梦县城关镇，分布于楚王城城址的东南郊，西距龙岗墓地约900米、睡虎地墓地约2800米。2026年6月以来，为配合云梦县市政建设，经中国国家文物局批准，湖北省文物考古研究院与云梦县博物馆联合组队进行发掘。\n\n(杨岚 秦婧 朱哲鋆 制作 侯诗蕊 视频来源 云梦县委宣传部）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/16CBBD6AF1B942FEA9C89A5958C0BA1A.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf1f1e6df46","title":"Leaders of China, Russia and the US hold historic summit in Shenzhen","url":"https://news.tvb.com/tc/1207513-LeadersofChinaRussiaandtheUSholdhistoricsummitinShenzhen","summary":"The leaders of China, Russia and the United States have held a historic meeting in Shenzhen. US Pres…","summary_short":"The leaders of China, Russia and the United States have held…","digest":"The leaders of China…","points":["US President Donald Trump said he had establis…","This involves energy stability and nuclear ris…","It also stated that the International Criminal…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T20:33+08:00","size":1,"keywords":[],"body":"The leaders of China, Russia and the United States have held a historic meeting in Shenzhen. \nUS President Donald Trump said he had established excellent relations with the Chinese and Russian leaders and planned to hold a press conference early Saturday to summarise his Asia trip.\nForeign Minister Wang Yi said the leaders of the three major powers agreed to prevent conflict and confrontation and that the trilateral meeting was a landmark event that will go down in history.\nPresident Xi Jinping, Russian President Vladimir Putin and US President Donald Trump held their first-ever summit on Thursday followed by the issuance of the \"China-Russia-US Peace Declaration.\"\nThis involves energy stability and nuclear risks among other things.\nIt also stated that the International Criminal Court must not abuse its jurisdiction.\nOn Trump's return to the White House after his China trip he told reporters of an upcoming press conference.\n(Reporter) Hey President Trump, how is China?\nTrump replied, \"We have a news conference at 12 o'clock (Eastern Time) tomorrow. It was really historic, thank you.\"\nIn a telephone call with NBC Trump said he discussed with President Xi issues in relation to the development of artificial intelligence including the establishment of protective mechanisms.\nForeign Minister Wang Yi said that APEC economic leaders had adopted an ambitious, practical and comprehensive Shenzhen Outlook, marking a new milestone in APEC cooperation\nand advancing the building of an Asia-Pacific community.\nHe said the agreement on the Shenzhen Outlook showed all parties were willing to overcome differences and uphold APEC's founding purposes. \nAt the Shenzhen APEC summit, President Xi made four points on how major countries could find a good way to get along and jointly underpin world peace,\nMajor countries should uphold mutual respect, uphold peaceful coexistence uphold win-win cooperation and uphold dialogue and consultation.","image":"https://pro-vod-cdn.tvb.com/b3df99a512a14ab5b9072b13ffbf8c68/snapshots/f92503b028ea45168f0258daea6f6bf3-00008.jpg","video":"https://pro-vod-cdn.tvb.com/b3df99a512a14ab5b9072b13ffbf8c68/54084c73b60740d0b3bf686191ceb764-14a67442c3c505c3a73a83c5c41f3ecb-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/b3df99a512a14ab5b9072b13ffbf8c68/snapshots/f92503b028ea45168f0258daea6f6bf3-00008.jpg","lang":"en"},{"id":"c4743d3e107","title":"东西问·兰花奖｜贾德·塔博特：中国遗产保护理念之变给世界何种启示？","url":"https://www.chinanews.com.cn/dxw/2026/11-20/10735475.shtml","summary":"中新社记者 胡健  　　由中国外文局发起、面向全球设立的重要国际文化交流奖项——兰花奖，日前公布第三届获奖名单，黎巴嫩文化部长高级顾问贾德·塔博特获得“友好使者奖”。","summary_short":"中新社记者 胡健  　　由中国外文局发起、面向全球设立的重要国际文化交流奖项——兰花奖，日前公布第三届获奖名单…","digest":"中新社记者 胡健  　　由中国外文局发起…","points":["由中国外文局发起、面向全球设立的重要国际文化交流奖项——兰花奖，日前公布第三届获奖名单…","近年来，贾德·塔博特深度参与中国多项世界文化遗产申报保护工作，为中国文化遗产价值挖掘…","更令我着迷的是，泉州至今仍保存着它与阿拉伯和波斯世界历史联系的非凡印记…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:24:58+08:00","size":1,"keywords":[],"body":"中新社记者 胡健\n\n　　由中国外文局发起、面向全球设立的重要国际文化交流奖项——兰花奖，日前公布第三届获奖名单，黎巴嫩文化部长高级顾问贾德·塔博特获得“友好使者奖”。\n\n　　近年来，贾德·塔博特深度参与中国多项世界文化遗产申报保护工作，为中国文化遗产价值挖掘、国际传播及保护实践提供专业支持。他以深厚的专业素养、开放的国际视野和对中国文化的真诚尊重，持续推动中国与黎巴嫩以及更广泛国际遗产界之间的交流合作。近日，贾德·塔博特(Jad Tabet)接受中新社“东西问”专访，畅谈世界文化遗产保护话题，并为中国文化遗产的海外传播给出建议。\n\n　　现将访谈实录摘要如下：\n\n　　中新社记者：您是否还记得第一次访问中国、第一次站在一座中国古代建筑前的情景？是什么吸引您持续关注并投身于围绕中国泉州、北京中轴线和景德镇申遗的国际讨论？\n\n　　贾德·塔博特：我第一次访问中国是在2004年，在苏州我发现了中国古典园林的精妙世界：微缩的山水景致，把自然融入由水、岩石、石头、树木和花草构成的组合之中，映照出中国传统文化的高雅格调与诗性情怀。\n\n　　孩提时代，我一直着迷于描绘自然的中国传统绘画——那些秀美的山峦、云雾缭绕的景致和姿态优雅的树木，似乎不仅捕捉到了自然世界的美，更捕捉到了它的灵魂本身。亲眼见到拙政园、狮子林和环秀山庄，唤起了我心中对中国传统山水画那种无边的想象与诗意的自由，仿佛这些画作活了起来。\n\n　　与中华文化的第一次相遇，给我留下了难以磨灭的印象。后来，当我以遗产专家的身份工作时，这种情结自然而然地把我的关注引向围绕中国重大世界遗产申报的讨论，我对这些讨论始终格外关注。\n\n2026年11月20日，第三届兰花奖颁奖现场，贾德·塔博特(左一)等多位友华人士获颁友好使者奖。主办方供图\n\n　　中新社记者：泉州在宋元时期被誉为“东方第一大港”，至今仍保留着大量阿拉伯世界的印记，从清净寺到伊斯兰教石刻。您在参与泉州申遗工作时，是如何向国际同行讲述这段可追溯至一千年前的中阿交往故事？\n\n　　贾德·塔博特：2018年我第一次到访泉州时，对这座城市的了解仅限于：它是中国东南沿海的一座古港，是10世纪至14世纪之间重要的海上枢纽。因此，当我发现这座城市在古典阿拉伯文献中被称为“刺桐”，而这个名称的来源常被认为与阿拉伯语中表示橄榄树的词有关时，我感到十分惊讶。\n\n　　更令我着迷的是，泉州至今仍保存着它与阿拉伯和波斯世界历史联系的非凡印记：始建于1009年的清净寺，是中国现存最古老的伊斯兰教寺院之一，寺内门楼与奉天坛壁龛保存着古阿拉伯文石刻；泉州各地出土的伊斯兰教石刻多集中收藏于泉州海外交通史博物馆，其中不乏宋元时期阿拉伯商人的墓碑；馆内伊斯兰文化厅前，伊本·白图泰的雕像提醒人们，这位14世纪摩洛哥穆斯林学者、法官和旅行家、中世纪最伟大的旅行家之一，曾有过怎样非凡的旅程。\n\n　　当时我担任阿拉伯建筑师组织主席，我觉得有必要把这一发现与同事们分享。我准备了一场演讲，讲述这段文化相遇与交流的篇章——它始于近一千年前，那时海洋不是文明之间的边界，而是把文明连接起来的桥梁。\n\n　　中新社记者：您曾把一件青花瓷送回景德镇，那是20世纪50年代一位中国朋友送给您父亲的礼物，当地专家鉴定其为18世纪晚期的原作。作为连接中国与世界的“文明使者”，瓷器为何在东西方文化中都拥有持久的魅力？\n\n　　贾德·塔博特：20世纪50年代，我父亲积极投身世界和平运动和亚非团结运动，并由此与几位中国同事和朋友结下了友谊。\n\n　　1956年，叙利亚大马士革举办了一场国际展览会，首次设立中国馆。在参观展览期间，我父亲收到了一件青花瓷，是他的一位中国朋友寄赠给他的。这件瓷器被安放在我们位于贝鲁特的家中，在那里留存了许多年。后来，黎巴嫩的战争迫使我携家人迁往巴黎，我把这件珍贵的物品带在了身边。\n\n　　许多年后，我因一项支持该城市申报列入联合国教科文组织《世界遗产名录》的任务而访问景德镇。在那里，我在陶瓷博物馆里看到了青花瓷，忽然意识到这件陪伴我们家多年的器物有着深厚的文化与历史渊源。我觉得它完成了一个轮回：父亲的中国朋友赠予他的这件瓷器，理应回到它的原产地。\n\n　　这是一段非凡的旅程，跨越近七十年、三个国家：从中国到黎巴嫩，从黎巴嫩到法国，最终又回到中国。但它超越了一件器物的旅程，讲述着一个更宏大的故事——关于友谊、记忆，以及超越国界、代际与时间的文化之间持久的纽带。\n\n2026年11月20日，第三届兰花奖颁奖现场，贾德·塔博特(左一)面带微笑注视获奖者哈桑・恰庞(右一)与主持人互动。主办方供图\n\n　　中新社记者：中国目前拥有61处世界遗产。多年来，您观察并参与中国的遗产保护工作，从国际视角看，中国最大的进步在哪里？您还有哪些建议？\n\n　　贾德·塔博特：从国际视角看，中国最大的进步在于其遗产保护理念的显著演变。多年来，我见证了一种转变：从最初侧重对杰出古迹和历史遗址的认定、保护与展示，转向一种更为全面的认识——把遗产理解为一种复杂的文化景观，它嵌在其社会、环境和历史的语境之中。\n\n　　关于未来，我愿提出四点建议。\n\n　　第一，随着中国世界遗产地数量的持续增长，应日益重视保护与管理的质量。挑战已不仅是争取列入《世界遗产名录》，而是要确保每一处遗产地的突出普遍价值能够长期得到有效维系。\n\n　　第二，应关注遗产地更广阔的环境，尤其是在历史城市和快速发展的城市地区。单体古迹或遗址的保护，无法与其周边的景观、城市肌理和传统生活形态相分离。开发压力、基础设施项目和旅游发展，需要通过统筹规划和严格的影响评估加以应对。\n\n　　第三，继续加强国际合作，既分享其可观的经验和技术专长，也通过与其他国家的对话和联合研究来推进合作。就其本质而言，遗产是一个超越国界的领域。\n\n　　最后，我认为中国对国际遗产界的下一项贡献，将不仅在于其杰出的遗产地，也在于它能够提供的范例——如何把遗产保护与一个快速变化世界的诉求协调起来。这或许是今天世界面临的最重要挑战之一。\n\n　　中新社记者：您多次强调“保护遗产从来不是一个国家的责任”。在您看来，各国——尤其是处于不同发展阶段的国家——应当如何建立真正有效的遗产保护伙伴关系？\n\n　　贾德·塔博特：我认为，有效的国际伙伴关系必须建立在相互尊重、共担责任的基础之上，而最重要的是，建立在承认遗产属于全人类这一共识之上。处于不同发展阶段的国家，资源或许并不均衡，但它们能够贡献同样宝贵的知识、经验和视角。因此，合作应当超越资金或技术援助。合作应当鼓励专业知识的交流、联合研究、能力建设，尤其是对年轻一代遗产专业人才的培养。\n\n　　归根结底，遗产保护不应被理解为国家间的竞争，而应被视为一项集体事业。文化遗产的多样性，恰恰是把人们连接在一起的东西；共同保护它，是增进国家之间相互理解与信任的途径。(完)\n\n　　受访者简介：\n\n贾德·塔博特。主办方供图\n\n　　贾德·塔博特，黎巴嫩文化部高级遗产顾问，长期从事世界遗产保护研究与实践，在全球城市系列遗产及贸易港口型历史城市保护领域具有重要影响力。他积极参与中国文化遗产保护和申遗工作，为多个项目提供价值研究、规划协调、文本编制及保护管理等专业支持，推动国际遗产保护理念与中国实践相结合。多年来，他始终秉持开放包容的国际视野，积极促进中国与黎巴嫩及国际遗产界之间的交流合作，推动遗产保护经验互鉴与学术对话。他的努力不仅促进了不同文明之间的相互理解，也为中国遗产保护经验的国际传播和文化遗产保护国际合作作出了积极贡献。\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c36e3d93ab8","title":"HK temperature drops to its lowest since the start of autumn","url":"https://news.tvb.com/tc/1207505-HKtemperaturedropstoitslowestsincethestartofautumn","summary":"The Cold Weather Warning is currently in force.Several areas across the city recorded just around 12…","summary_short":"The Cold Weather Warning is currently in force.Several areas…","digest":"The Cold Weather Warning is currently in f…","points":["The Cold Weather Warning is currently in force…","Several areas across the city recorded just ar…","Starting next Tuesday, another northeast monso…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T19:18+08:00","size":1,"keywords":[],"body":"The Cold Weather Warning is currently in force.\nSeveral areas across the city recorded just around 12 degrees Celsius at around noon, with the cool weather set to continue until tomorrow morning. \nThe combined effects of a northeast monsoon and cloud band have led to a significant drop in the mercury, with strong gusts flipping umbrellas inside out while both residents and pets required an extra layer of clothing to brace the cold. \nThis as the Observatory recorded just 15.3 degrees Celsius this morning, before it further dropped to 13.2 degrees by noon, reaching just 12.7 degrees this afternoon -- the coldest it has been since the start of autumn. \nSeveral districts saw temperatures drop to just 12 degrees with authorities issuing the Cold Weather Warning at 11 a.m.\nThis as weather authorities explained why it feels cooler as the day continues. \nThe Observatory said the cloud band above the city is relatively thick leading to overcast skies and a lack of sunlight, adding that the weather phenomenon is related to a tropical cyclone located in the Bay of Bengal in the Indian Ocean. \nWeather authorities predicted the temperature will remain cool tomorrow morning at a minimum of 13 degrees before gradually rising over the course of the next two days. \nStarting next Tuesday, another northeast monsoon is set to edge towards the Southern Chinese coast at which point temperatures will drop again.","image":"https://pro-vod-cdn.tvb.com/baa3205f02254409b6825056b3884186/snapshots/be6f8e24f40342e9b35720f0fbc74147-00008.jpg","video":"https://pro-vod-cdn.tvb.com/baa3205f02254409b6825056b3884186/3c2f8862b58249f1836a375b95d7a4a7-1ab399279a8b00004c826a3a25885f76-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/baa3205f02254409b6825056b3884186/snapshots/be6f8e24f40342e9b35720f0fbc74147-00008.jpg","lang":"en"},{"id":"c11ebecfc59","title":"Authorities propose to criminalise all unauthorised building works","url":"https://news.tvb.com/tc/1207506-Authoritiesproposetocriminaliseallunauthorisedbuildingworks","summary":"The government proposed the introduction of a new offence targeting unauthorised building works -- r…","summary_short":"The government proposed the introduction of a new offence ta…","digest":"The government proposed the introduction o…","points":["Owners of such properties could receive a maxi…","This as authorities are set to loosen regulati…","Some owners' corporation chairs welcomed the m…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T19:18+08:00","size":1,"keywords":[],"body":"The government proposed the in
