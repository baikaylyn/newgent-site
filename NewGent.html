"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T22:33:17+08:00","size":2,"keywords":[],"body":"11月20日，湖南洪江市江市镇红莲洑水村，复旦大学法庭科学研究院办公室主任曹兴杰双手托举着烈士张长兴的容颜复原画像，穿越75载岁月送英雄“回家”。\n\n张长兴是湖南省首位通过DNA技术成功确认身份的在韩志愿军烈士，2025年依托退役军人事务部在韩志愿军烈士亲属摸排专项行动，通过精准权威的DNA比对彻底解开身份谜题。复旦大学法庭科学研究院科研团队在无任何历史影像、无颅骨样本参照的情况下，深度比对烈士四位妹妹的五官神态、面部骨相遗传特征，综合运用DNA鉴定、三维颅骨重建、遗物考证等多模态前沿技术，还原出张长兴烈士的青年模样，让英烈“归来”。(邱承 李金欣 制作 侯诗蕊)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/39B04588D5E3438F9727FC89776A228C.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"英雄有容 在韩志愿军烈士张长兴复原画像归家","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075619.shtml","source_display":"中新視頻","published_at":"2026-11-20T22:33:17+08:00","category":"民生","digest":"11月20日，湖南洪江市江市镇红莲洑水村…"},{"title":"湖南籍在韩志愿军烈士张长兴容颜复原画像归家","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735465.shtml","source_display":"中新網 社會","published_at":"2026-11-20T20:18:10+08:00","category":"","digest":"11月20日，湖南洪江市江市镇红莲洑水村，一间质朴静谧的农家小屋，气氛肃穆而温柔"}],"cross":{"total":2,"angles":[{"point":"11月20日，湖南洪江市江市镇红莲洑水村…","sources":["中新視頻"],"url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075619.shtml"},{"point":"11月20日，湖南洪江市江市镇红莲洑水村，一间质朴静谧的农家小屋，气氛肃穆而温柔","sources":["中新網 社會"],"url":"https://www.chinanews.com.cn/sh/2026/11-20/10735465.shtml"}]}},{"id":"ca18a47fe3e","title":"百对新人喜结良缘 福州市2026年集体婚礼举行","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735580.shtml","summary":"中新网福州11月20日电 (郑江洛)20日，福州市2026年集体婚礼在福州启幕，百对来自各行各业的新人携手踏上幸福红毯，在亲友、职工代表的共同见证下许下相守承诺。","summary_short":"中新网福州11月20日电 (郑江洛)20日，福州市2026年集体婚礼在福州启幕，百对来自各行各业的新人携手踏上幸福红毯…","digest":"20日，福州市2026年集体婚礼在福州启幕，百对来自各行各业的新人携手踏上幸福红毯…","points":["中新网福州11月20日电 (郑江洛)20日，福州市2026年集体婚礼在福州启幕…","这是福州市总工会持续深耕打造的第十七届集体婚礼，以暖心婚育服务，绘就有福之州的幸福底色","本次活动由福州市总工会联合团市委、市妇联共同主办，邀请新人家属、单位代表、一线职工…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:06:16+08:00","size":1,"keywords":[],"body":"中新网福州11月20日电 (郑江洛)20日，福州市2026年集体婚礼在福州启幕，百对来自各行各业的新人携手踏上幸福红毯，在亲友、职工代表的共同见证下许下相守承诺。这是福州市总工会持续深耕打造的第十七届集体婚礼，以暖心婚育服务，绘就有福之州的幸福底色。\n\n20日，福州市2026年集体婚礼在福州启幕。　中新网记者 吕明 摄\n\n　　本次活动由福州市总工会联合团市委、市妇联共同主办，邀请新人家属、单位代表、一线职工、劳模先进及相关领导嘉宾莅临观礼。\n\n　　活动以“福‘见’爱情”为主线，依托“一场婚礼仪式、一台爱情情景剧、一份新婚贺礼”三大板块，搭建起仪式感、情感共鸣、温情回馈为一体的体验链条，生动诠释城市与奋斗青年的双向奔赴，彰显福州“最具幸福感城市”的深厚底蕴。本届新人来自福建、四川、贵州、河南、江西等全国多个省份，是奔赴榕城、扎根榕城的建设者。\n\n　　“95后”新人陈杰、杨琼便是其中一对新人。二人经由同事介绍相识，日常工作中多有配合，相知相爱后于今年领证，符合报名条件便顺势参与到本次集体婚礼当中。\n\n　　“能够入选本次集体婚礼我们觉得十分幸运。”陈杰感慨道，整场活动流程顺畅有序，盛大热烈的现场氛围让他内心满是激动澎湃。杨琼也坦言，这样的婚礼形式充满纪念意义，多年以后回想起来，依然会是难忘的美好回忆。\n\n　　作为福州市总工会服务青年职工的特色品牌，集体婚礼自2010年落地以来，聚焦外来职工交友难、婚恋难的现实需求，推动市、县、基层工会三级联动，持续完善职工婚恋全链条服务。截至目前，活动已连续举办17届，见证1700余对新人喜结良缘、扎根福地。\n\n　　“连续17年办这场婚礼，初心就是当好职工的‘娘家人’。”福州市总工会有关负责人表示，集体婚礼既为在榕打拼的青年职工搭建简约庄重、温暖走心的仪式平台，减轻职工办婚负担，也引导青年树立文明婚恋观，把小家幸福融入城市发展，让扎根福州的奋斗者心安于此、幸福相守。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1911337c3b","title":"陕西省文物安全形势研判会暨消防救援综合演练活动在商洛举行","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735560.shtml","summary":"中新网陕西商洛11月20日电 (记者 阿琳娜)2026年陕西省文物安全形势研判会暨消防救援综合演练活动19日在商洛举行，通报全省文物安全形势，研判文物领域风险隐患，交流防控举措…","summary_short":"中新网陕西商洛11月20日电 (记者 阿琳娜)2026年陕西省文物安全形势研判会暨消防救援综合演练活动19日在商洛举行…","digest":"2026年陕西省文物安全形势研判会暨消防救援综合演练活动19日在商洛举行…","points":["中新网陕西商洛11月20日电 (记者 阿琳娜)2026年陕西省文物安全形势研判会暨消防救援综…","综合演练紧扣消防宣传月“全民消防、生命至上——提高自防自救能力”主题…","现场同步安排消防技能实操展示、商洛非遗展演"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:56:17+08:00","size":1,"keywords":[],"body":"中新网陕西商洛11月20日电 (记者 阿琳娜)2026年陕西省文物安全形势研判会暨消防救援综合演练活动19日在商洛举行，通报全省文物安全形势，研判文物领域风险隐患，交流防控举措，部署冬春防火及2027年文物安全重点任务，颁发第六届全国文物执法指导性案例获奖单位牌匾，实地开展文物消防救援综合演练。\n\n　　综合演练紧扣消防宣传月“全民消防、生命至上——提高自防自救能力”主题，模拟秦岭博物馆展厅电气线路短路起火场景，依次开展火情上报、初期处置、游客疏散、文物抢护、伤员救护、盗窃警情处置、多部门联合救援、火情扑灭、隐患排查、响应解除等全链条实战科目，检验场馆先期处置、人员疏散、文物应急保护能力，磨合消防、公安、应急、卫健等部门联勤联动机制。现场同步安排消防技能实操展示、商洛非遗展演。参演队伍反应迅速、协同顺畅、处置规范，实现以练促训、实战练兵成效，为全省文博单位消防应急处置提供可借鉴、可复制样板。\n\n图为开展文物消防救援综合演练。商洛市文化和旅游局供图\n\n　　会议强调，全省文博系统要扛牢政治责任，树牢底线思维、极限思维，以“时时放心不下”的责任感压实全链条安全责任，严格落实安全管理各项责任机制。紧盯秋冬防火关键期，聚焦古建筑、展厅库房、文保工地、外包外租场所等重点区域，开展拉网式隐患排查，重大隐患挂牌督办、动态清零，强化消防设施运维，运用智能监测手段源头控险。贯通四级责任链条、织密五级管护网络，按期完成台账核对与责任人公示，紧盯火灾、法人违法、盗掘盗窃等风险，织牢责任、防火、执法、共治四张网，闭环整治隐患，严打文物违法，凝聚群防力量。常态化组织消防实操、隐患排查、应急处置、执法业务培训和实战演练，抓实督察整改、制度配套、队伍建设、应急值守，严格落实24小时值班和信息报送，扎实开展岁末年初全覆盖排查，守牢文物安全红线、底线、生命线。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf279b5886f","title":"宁夏首次发布“宁夏枸杞”商标维权典型案例 多梯度打击商标侵权","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735552.shtml","summary":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏枸杞产业发展中心获悉，该中心首次对外发布《2025年“宁夏枸杞”商标维权典型案例》。","summary_short":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏枸杞产业发展中心获悉…","digest":"11月20日，记者从宁夏枸杞产业发展中心获悉…","points":["中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏枸杞产业发展中心获悉…","自2025年以来，该中心联合中宁县枸杞产业发展服务中心持续开展“宁夏枸杞”地理标志证明商标维…","其中2起案件以发律师函方式督促当事人自行整改"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:46:01+08:00","size":1,"keywords":[],"body":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏枸杞产业发展中心获悉，该中心首次对外发布《2025年“宁夏枸杞”商标维权典型案例》。自2025年以来，该中心联合中宁县枸杞产业发展服务中心持续开展“宁夏枸杞”地理标志证明商标维权专项行动，本次公布9起案例，覆盖线上线下多场景侵权行为，单案最高赔偿金额达3万元。\n\n资料图“三标一码”“四标一码”标识。宁夏枸杞产业发展中心供图\n\n　　这批案例清晰呈现“律师函督促整改、行政举报查处、司法诉讼追责”三级维权梯度，侵权花样层出不穷。除直接冒用字样外，“一字之差”近似表述、繁体字变体、门店门头擅自使用等隐蔽方式，均被认定侵害“宁夏枸杞”地理标志证明商标专用权。\n\n　　其中2起案件以发律师函方式督促当事人自行整改。拼多多一家冲调旗舰店将宣传页、外包装上“宁夏红枸杞”修改为“红枸杞”；云南开远市一家食品经营店铺主动下架涉事枸杞产品并关停店铺。另有商家在商会宣传页面标注“宁夏枸杞”，实际产品并非宁夏产地。\n\n　　4起案件通过行政渠道举报查处，处置结果各有不同。安徽亳州一家线下门店因在门头、外包装使用“宁夏枸杞”“宁夏枸杞王”，因情节轻微且及时纠正，监管部门予以批评教育、不予处罚；抖音一家冲饮旗舰店因外包装标注相关字样被罚款3000元；淘宝一店铺被没收违法所得并处罚款合计761.76元；还有企业使用繁体“寕夏枸杞”标识，被责令停止侵权并罚款500元。\n\n　　3起案件进入司法程序，形成有力司法震慑。亳州两家企业分别在抖音商品标题、宣传图、外包装使用侵权字样，法院判决其停止侵权，各赔偿1.6万元；亳州另一家药业公司在淘宝店铺侵权，经法院调解达成协议，停止侵权并赔偿3万元。\n\n　　据介绍，本次维权范围不再局限枸杞主产区，延伸至国内集散市场和各大线上消费端，拼多多、抖音、淘宝等主流电商平台均有涉案。\n\n　　宁夏言成律师事务所相关负责人表示，未经授权冒用“宁夏枸杞”“中宁枸杞”、虚假标注产地、页面虚假宣传等行为，违反商标法、反不正当竞争法、地理标志产品保护办法以及《宁夏回族自治区枸杞产业促进条例》，扰乱市场秩序，损害区域公用品牌形象，相关主体都将承担相应法律责任。他同时提醒消费者，选购枸杞认准“三标一码”“四标一码”，更好辨别正宗宁夏枸杞。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c70f58ea0f7","title":"宁夏为国省干线逐公里赋数字坐标 公路养护实现精准溯源","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735549.shtml","summary":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉，宁夏公路管理中心吴忠分中心已完成宁夏普通国省干线公路路面技术状况检测，同步开展逐公里GPS精准打点…","summary_short":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉…","digest":"20日，记者从宁夏公路管理中心获悉…","points":["中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉…","工作人员在采集路面技术指标的同时，完成公里点位GPS定位，建立“一公里一坐标”台账…","宁夏公路管理中心吴忠分中心相关负责人介绍，依托公里级坐标与路况检测数据…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:41:37+08:00","size":1,"keywords":[],"body":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉，宁夏公路管理中心吴忠分中心已完成宁夏普通国省干线公路路面技术状况检测，同步开展逐公里GPS精准打点，为每一公里公路赋予专属数字坐标，以空间数据支撑智慧公路养护。\r\n\n　　此次作业依托多功能路况检测车，实现检测、定位、信息采集一体化。工作人员在采集路面技术指标的同时，完成公里点位GPS定位，建立“一公里一坐标”台账，精准锁定每一段路面位置，补齐过去依靠桩号粗定位、病害点位存在偏差的短板，搭建起公路管养的空间数据底座。\n\n　　宁夏公路管理中心吴忠分中心相关负责人介绍，依托公里级坐标与路况检测数据，养护部门可以研判路面衰减规律，科学排布养护计划，推动管养模式由模糊定位转向精准溯源、粗放管护转向靶向治理。\n\n　　标准化公里坐标数据将接入宁夏公路日常养护管理平台，实现病害定位、数据归集、全过程监管。养护决策逐步告别经验判断，转向数据驱动，从被动抢修向主动预防转变。在防汛防滑、路面突发险情处置场景中，这套坐标体系能够快速锁定事发地点，缩短应急调度和抢修时间，保障路网通行安全。\n\n　　据了解，后续宁夏公路部门将持续做好路况数据动态更新，深化数字化成果应用，以数据赋能路网精细化管养，持续提升普通国省干线通行保障能力。(完) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf6236fef76","title":"冬天猛搓澡不等于干净 正确洗澡记住三点","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075616.shtml","summary":"入冬后，洗澡这件日常小事衍生出不少“养生玄学”。","summary_short":"入冬后，洗澡这件日常小事衍生出不少“养生玄学”。","digest":"入冬后，洗澡这件日常小事衍生出不少“养生玄学”","points":["入冬后，洗澡这件日常小事衍生出不少“养生玄学”","中华中医药学会风湿病第六届委员会委员，吉林省吉林中西医结合医院风湿科副主任于淼表示…","因此，她提出三点冬季洗澡建议，首先，水温别太烫"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:38:47+08:00","size":1,"keywords":[],"body":"入冬后，洗澡这件日常小事衍生出不少“养生玄学”。中华中医药学会风湿病第六届委员会委员，吉林省吉林中西医结合医院风湿科副主任于淼表示，北方人的搓澡文化根深蒂固，但爱搓澡并不等于干净，使劲搓澡，搓掉的是皮肤表层保护的油脂，反而有可能伤害皮肤危害健康。因此，她提出三点冬季洗澡建议，首先，水温别太烫；其次，少搓快洗，洗完保暖；最后，洗完澡后适当地涂上一些身体乳，既能保护皮肤，也能减少风寒湿邪的侵袭。(记者 苍雁 石洪宇 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/9646518FA2EF4A0DB259C0CF2040F63A.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ca4e96d32cf","title":"农房变影棚、村民当群演 湖南“短剧村”激活乡村闲置资产","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075615.shtml","summary":"近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”，在当地进驻的剧组中过“戏瘾”、领片酬。","summary_short":"近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”，在当地进驻的剧组中过“戏瘾”、领片酬。","digest":"近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”…","points":["近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”，在当地进驻的剧组中过“戏瘾”…","这座千年水乡古镇，通过盘活闲置农房、古街老院等资源，打造天然微短剧片场，原生态场景覆盖古风…","截至目前，乔口镇已累计承接微短剧剧组40余个，拍摄作品超50部…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:38:27+08:00","size":1,"keywords":[],"body":"近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”，在当地进驻的剧组中过“戏瘾”、领片酬。\n\n据悉，这座千年水乡古镇，通过盘活闲置农房、古街老院等资源，打造天然微短剧片场，原生态场景覆盖古风、民国、乡村等多元题材，并配套一站式剧组服务，吸引数十个剧组落地。截至目前，乔口镇已累计承接微短剧剧组40余个，拍摄作品超50部，仅柳林江村村集体收入便已突破180万元人民币。(张雪盈 李盈）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/7FEEEC279DD8462A9361987C60DDE83B.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c6ee588370d","title":"意大利驻华大使：30年前有人说披萨在中国火不了 现在中国披萨师也很棒","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075614.shtml","summary":"11月20日，“品味意式风味，邂逅浪漫雅致——精品意式美食，布局中国零售市场”活动在北京举行。","summary_short":"11月20日，“品味意式风味，邂逅浪漫雅致——精品意式美食，布局中国零售市场”活动在北京举行。","digest":"11月20日，“品味意式风味，邂逅浪漫雅致——精品意式美食…","points":["11月20日，“品味意式风味，邂逅浪漫雅致——精品意式美食，布局中国零售市场”活动在北京举行","意大利驻华大使安博思表示，意方目标是引入更多原汁原味的意大利产品…","如今，披萨已成为中国人日常饮食的一部分，大量中国消费者爱吃披萨…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:38:02+08:00","size":1,"keywords":[],"body":"11月20日，“品味意式风味，邂逅浪漫雅致——精品意式美食，布局中国零售市场”活动在北京举行。意大利驻华大使安博思表示，意方目标是引入更多原汁原味的意大利产品，进一步扩大意大利产品在中国的消费群体，并通过饮食交流拉近两国饮食文化。\n\n安博思认为，中国饮食习惯已发生变化，越来越多消费者开始接受各类新兴农食产品。30年前他曾到访中国，当时有人告诉他，披萨在中国很难做起来，问题出在奶酪。如今，披萨已成为中国人日常饮食的一部分，大量中国消费者爱吃披萨，中国也涌现出技艺出色的披萨师，奶酪、咖啡等情况同样如此。同时，意方也希望把更多中国产品带到意大利，茶叶就是很好的例子。他坦言，中国市场体量巨大、需求多元，开拓并不容易，相关业务持续增长，意方将保持期待并继续尽全力，在这一重要市场持续深耕。(记者 迟瀚宇）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/0B4035088E8647789992E4D115CA84D4.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c6b522824ee","title":"知识产权赋能文旅发展 江西擦亮赣鄱文旅品牌","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735545.shtml","summary":"中新网南昌11月20日电 (记者 吴鹏泉)2026年江西省“讲好商标品牌故事”线下活动20日在位于南昌青云谱区的八大山人纪念馆举行。","summary_short":"中新网南昌11月20日电 (记者 吴鹏泉)2026年江西省“讲好商标品牌故事”线下活动20日在位于南昌青云谱区的八大山人…","digest":"2026年江西省“讲好商标品牌故事”线下活动20日在位于南昌青云谱区的八大山人纪念馆…","points":["中新网南昌11月20日电 (记者 吴鹏泉)2026年江西省“讲好商标品牌故事”线下活动20日…","活动以“山水江西 商标赋能——讲好赣鄱文旅品牌故事”为主题，旨在以商标品牌为纽带…","2026年江西省“讲好商标品牌故事”作品征集于今年9月启动…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:37:06+08:00","size":1,"keywords":[],"body":"中新网南昌11月20日电 (记者 吴鹏泉)2026年江西省“讲好商标品牌故事”线下活动20日在位于南昌青云谱区的八大山人纪念馆举行。活动以“山水江西 商标赋能——讲好赣鄱文旅品牌故事”为主题，旨在以商标品牌为纽带，积极探索知识产权与文旅产业深度融合发展新路径。\n\n11月20日，2026年江西省“讲好商标品牌故事”线下活动在位于南昌青云谱区的八大山人纪念馆举行。记者 吴鹏泉 摄\n\n　　2026年江西省“讲好商标品牌故事”作品征集于今年9月启动，活动围绕江西特色文旅商标面向全省征集短视频作品，并在线上线下集中展播，持续扩大赣鄱文旅商标品牌传播声量、凝聚品牌关注度。\n\n　　本次线下活动设置“展、讲、授、玩”四大板块，将线上展播成果转化为沉浸式线下体验。在活动现场集中展出参展作品，“赣鄱好物”展示区陈列各类文旅产品，供参观者品鉴地标好物、体验特色文创。\n\n11月20日，在位于南昌青云谱区的八大山人纪念馆，参观者品鉴地标好物。记者 吴鹏泉 摄\n\n　　江西省市场监督管理局总工程师康淑兰表示，江西将持续完善商标注册、运用、保护、管理全链条服务，推动更多“江西产品”迈向“江西品牌”，依托商标品牌建设助力文旅产业提质升级，为全省经济社会高质量发展持续注入动能。\n\n　　作为本次活动承办场地，八大山人纪念馆深挖本土文化内核，完成多类别商标注册，先后开发550余款文创产品。“商标保护筑牢根基，产品开发活化文化，场景营造激发消费。”八大山人纪念馆馆长周晓健说，一套完善的知识产权保护体系，正让古老文化IP持续焕发市场新活力。\n\n11月20日，位于南昌青云谱区的八大山人纪念馆内，游客选购文创产品。记者 吴鹏泉 摄\n\n　　当日活动现场还举行证书颁发环节，江西省市场监督管理局知识产权运用处处长石斌为各报送单位颁发2026年江西省“讲好商标品牌故事”活动参与证，鼓励各类文旅经营主体用好商标载体，深挖文化内涵，持续讲好赣鄱品牌故事。\n\n　　本次活动由江西省市场监督管理局指导，江西省检验检测认证总院检测认证技术发展研究院主办。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cced97bf252","title":"白尾海雕连续多年“打卡”黄河中卫段","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735544.shtml","summary":"中新网中卫11月20日电 (记者 于晶)初冬时节，黄河中卫段沙坡头区沿岸滩涂静谧辽阔，国家一级保护动物白尾海雕如约现身，在此栖息觅食。","summary_short":"中新网中卫11月20日电 (记者 于晶)初冬时节，黄河中卫段沙坡头区沿岸滩涂静谧辽阔，国家一级保护动物白尾海雕如约现身…","digest":"初冬时节，黄河中卫段沙坡头区沿岸滩涂静谧辽阔，国家一级保护动物白尾海雕如约现身…","points":["中新网中卫11月20日电 (记者 于晶)初冬时节，黄河中卫段沙坡头区沿岸滩涂静谧辽阔…","这一珍稀猛禽已连续多年来到此地越冬，从曾经的“稀客”变为黄河岸边的“常客”…","沙坡头区林业和草原局野生动物保护工作负责人李硕枫介绍，白尾海雕对栖息地水质…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:36:34+08:00","size":1,"keywords":[],"body":"中新网中卫11月20日电 (记者 于晶)初冬时节，黄河中卫段沙坡头区沿岸滩涂静谧辽阔，国家一级保护动物白尾海雕如约现身，在此栖息觅食。这一珍稀猛禽已连续多年来到此地越冬，从曾经的“稀客”变为黄河岸边的“常客”，成为当地生态持续向好的生动印证。\n\n白尾海雕“打卡”黄河中卫段。沙坡头区委宣传部供图\n\n　　11月20日，记者在沙坡头区黄河沿岸观测记录到白尾海雕活动画面。滩涂上，白尾海雕静立休憩，时而振翅掠过水面，在黄河上空盘旋滑翔，姿态矫健从容。沙坡头区林业和草原局野生动物保护工作负责人李硕枫介绍，白尾海雕对栖息地水质、食物资源要求严苛，对环境变化十分敏感，连续多年前来越冬，是给当地生态投出的一张“信任票”。\n\n　　珍稀猛禽稳定栖息的背后，是持续推进的黄河河湖综合治理与湿地修复行动。近年来，沙坡头区聚焦黄河河湖“四乱”问题开展整治，累计整改问题750处，拆除黄河违建138处，5万余亩河滩地逐步恢复原生面貌。在候鸟核心栖息的河心滩，当地清退耕地、鱼塘，补植原生芦苇，把滩涂空间还给野生鸟类。水质监测数据显示，黄河中卫段出入境断面水质连续9年稳定保持Ⅱ类，全市水土保持率达75.03%。\n\n　　鸟儿用翅膀为生态“投票”。随着栖息地不断修复，沙坡头区稳定监测到的鸟类种类，由早年40余种增加至80多种，白尾海雕、金雕、秃鹫等猛禽观测数量明显回升。\n\n　　“鸟类是最公正的环境评价师，它们选择停留，代表这里安全、食物充足。”李硕枫说，白尾海雕年复一年的归来，直观展现出黄河中卫段生态治理的扎实成效，黄河岸畔正持续绘就人与自然和谐共生的冬日画卷。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c87034558b3","title":"浙江多地气温创下半年新低","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735529.shtml","summary":"中新网杭州11月20日电(记者 王逸飞)记者20日从浙江省气象台获悉，当日受冷空气影响，该省多地气温创下下半年以来新低，迎来下半年“最冷早晨”。","summary_short":"中新网杭州11月20日电(记者 王逸飞)记者20日从浙江省气象台获悉，当日受冷空气影响，该省多地气温创下下半年以来新低…","digest":"记者20日从浙江省气象台获悉，当日受冷空气影响，该省多地气温创下下半年以来新低…","points":["中新网杭州11月20日电(记者 王逸飞)记者20日从浙江省气象台获悉，当日受冷空气影响…","20日，浙江杭州持续晴冷天气","当日早上，在冷高压和晴空辐射的共同影响下，浙江全省最低气温在2-7℃之间"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:02:59+08:00","size":1,"keywords":[],"body":"中新网杭州11月20日电(记者 王逸飞)记者20日从浙江省气象台获悉，当日受冷空气影响，该省多地气温创下下半年以来新低，迎来下半年“最冷早晨”。\n\n20日，浙江杭州持续晴冷天气。王逸飞 摄\n\n　　当日早上，在冷高压和晴空辐射的共同影响下，浙江全省最低气温在2-7℃之间。其中杭州(4.2℃)、安吉(2.5℃)、海宁(1.9℃)、磐安(2.5℃)等不少地区的最低气温刷新下半年以来的新低。\n\n　　冷空气除了带来降温，还带来了大风影响。20日浙江沿海大风依旧强劲，上午沿海海面小时极大风达到7-8级。\n\n　　据浙江省气象台消息，受冷高压和晴空辐射影响，21日早晨寒意还会再次“上线”，该省的气温更低，霜冻也会跟着现身。截至17时，浙江全省共发布霜冻预警65条，其中柯桥、建德、萧山、开化、德清等10地已发布霜冻黄色预警信号。\n\n　　此外，新一股冷空气已经在“路上”。该省气象部门预计，23日后期到24日，受低槽和冷空气共同影响，浙江全省将迎来又一次降温、大风和弱降水过程。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4b8f5bbf2a","title":"从接警到“治未病”：浙江义乌古镇警务“向前一步”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735524.shtml","summary":"中新网义乌11月20日电(董易鑫)每年农历十月初十，浙江义乌佛堂古镇都会迎来一年一度的“十月十”盛会，单日游客量超过30万人次。","summary_short":"中新网义乌11月20日电(董易鑫)每年农历十月初十，浙江义乌佛堂古镇都会迎来一年一度的“十月十”盛会…","digest":"每年农历十月初十，浙江义乌佛堂古镇都会迎来一年一度的“十月十”盛会…","points":["中新网义乌11月20日电(董易鑫)每年农历十月初十…","人潮涌动间，民警穿梭在街巷之中，巡逻、疏导、回应游客求助，守护着这场传统盛会的平安","面对人口流动频繁、社会治理需求多元的现实，如何让警务力量不仅能及时处置警情…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T20:46:10+08:00","size":1,"keywords":[],"body":"中新网义乌11月20日电(董易鑫)每年农历十月初十，浙江义乌佛堂古镇都会迎来一年一度的“十月十”盛会，单日游客量超过30万人次。人潮涌动间，民警穿梭在街巷之中，巡逻、疏导、回应游客求助，守护着这场传统盛会的平安。\n\n　　面对人口流动频繁、社会治理需求多元的现实，如何让警务力量不仅能及时处置警情，还能提前发现和化解风险？\n\n　　近年来，佛堂派出所尝试将警务工作向前延伸，从警情闭环、矛盾调解到出租房治理，推动警务工作从事后处置向源头预防转变。\n\n近日，民警在佛堂“十月十”现场执勤。(佛堂派出所供图)\n\n　　佛堂是浙江知名古镇之一，29万新老佛堂人生活于此，流动人口超过18万。除了节庆期间的大客流，邻里纠纷、跨省婚恋矛盾、出租房管理等，也是当地派出所每天需要面对的日常警务。\n\n　　在这里，一套“一警一群、三色闭环”管理机制正在发挥作用。\n\n　　“根据警情处置进度，我们将相关事项划分为红、黄、绿三种状态，对尚未解决的问题持续跟踪，待处置完成后再予以销号。”佛堂派出所副所长黄晖平说，红色代表还需要继续跟进，只有问题真正解决了，才能完成闭环。\n\n　　基层警务不能仅仅满足于接警、出警，还要从警情中发现背后的风险和治理短板，让每一起警情都有后续、有反馈。\n\n　　人口流动频繁，也让佛堂古镇的矛盾纠纷呈现出多样化特点。佛堂镇有8万余间出租房，外来人口居住集中，租赁纠纷、人员登记和安全隐患排查等工作相互关联。\n\n　　“针对这一情况，我们推动成立金华首个出租房行业公会，将警务网格与社区网格进一步融合，并依托‘房东码’‘古镇微警’等载体，加强出租房信息登记和风险感知。”佛堂派出所民警王维说，与此同时，当地还通过积分制、红黄榜引导房东参与自治，并设立乡音调解室，推动租赁纠纷就近化解。\n\n　　数据显示，相关模式推行后，涉租警情同比下降66.7%。\n\n　　“基层治理就是要让民警、社区、义警以及辖区经营主体形成合力，我们也需要把形成于基层的经验总结、推广。”佛堂派出所负责人说，在佛堂派出所，实战经验的传递是队伍建设的重要一环。\n\n　　从警情研判、风险预警到现场处置、矛盾化解，近年来佛堂派出所民警们正通过案例复盘、协同处置等方式交流经验，将个人积累转化为队伍共同的工作方法，推动警务力量与基层治理力量深度融合，让更多风险得以在萌芽阶段被发现、被化解。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbf4481efe4","title":"从机器人到低空飞行器：欧洲记者、博主在成都感受“未来”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735523.shtml","summary":"中新网成都11月20日电 (袁牟知博)在成都人形机器人创新中心，一台机器人从篮中精准分拣出苹果，另一台端着可乐穿行其间；再往里，有的机器人在石子路面上行走作业，有的则在墙面上施工。","summary_short":"中新网成都11月20日电 (袁牟知博)在成都人形机器人创新中心，一台机器人从篮中精准分拣出苹果，另一台端着可乐穿行其间…","digest":"在成都人形机器人创新中心，一台机器人从篮中精准分拣出苹果，另一台端着可乐穿行其间…","points":["中新网成都11月20日电 (袁牟知博)在成都人形机器人创新中心…","再往里，有的机器人在石子路面上行走作业，有的则在墙面上施工","11月20日，来自德国、瑞典、比利时、荷兰和罗马尼亚等国家的主流媒体记者、博主组成的参访团…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:42:09+08:00","size":1,"keywords":[],"body":"中新网成都11月20日电 (袁牟知博)在成都人形机器人创新中心，一台机器人从篮中精准分拣出苹果，另一台端着可乐穿行其间；再往里，有的机器人在石子路面上行走作业，有的则在墙面上施工。荷兰网红博主昆滕举着手机拍个不停，连说“这太酷了”，又说“曾幻想过的未来正在发生”。\n\n　　11月20日，来自德国、瑞典、比利时、荷兰和罗马尼亚等国家的主流媒体记者、博主组成的参访团，在四川省外事办组织下，走进成都人形机器人创新中心和四川沃飞长空科技股份有限公司(下称沃飞长空)。前者是四川人形机器人研发核心平台之一，汇聚多款面向真实场景的机器人产品；后者为全球独角兽企业，聚焦低空交通飞行器的研发、适航取证与商业化运营。\n\n　　在成都人形机器人创新中心，比利时《布鲁塞尔纵横》项目总监保罗在墙面施工机器人前驻足良久。“这里的机器人种类很多，应用场景很广泛，有的可以辅助家庭生活，有的还可以替人类完成危险性较高的工作。”保罗说。\n\n图为欧洲记者、博主在体验低空交通飞行器。　记者 吕杨 摄\n\n　　在沃飞长空展厅，昆滕遇见了一件他原以为只存在于科幻电影中的事物。他指着那辆“飞行汽车”说：“小时候聊起未来，孩子们总会幻想‘飞行汽车’。眼前这个交通飞行器，最接近那个梦。”\n\n　　昆滕认为，低空飞行前景广阔，合理利用低空空域有助于缓解地面交通拥堵，“管理得当的话，这绝对是个极好的领域”。他打开摄像机录制视频，向观众介绍这些飞行器，分享自己在成都看到的“未来”：“这是一个全新的事物，这也是我们儿时都做过的梦。”\n\n　　聊起科技领域的全球合作，昆滕认真起来：“全球科技合作确实一天比一天好，不过还可以更进一步。如果各国能更紧密地合作，科技的发展会加速‘百万倍’。”保罗则分享了他从业多年的观察：欧洲同中国等国家在科技领域的合作日益紧密，像他这样的媒体人也希望进一步了解中国科技领域的发展。\n\n　　走出展厅时，昆滕还在和同伴讨论“飞行汽车”。“儿时梦想的未来已经实现，十年后，我们又将走向怎样的未来？”昆滕说，从一个被机器人分拣出的苹果，到一架面向低空出行的飞行器，成都之行让他重新燃起了对未来的好奇与想象。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2310b81126","title":"（乡村行·看振兴）“薯”写丰收路 浙江文成山货变身富民“金疙瘩”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735514.shtml","summary":"中新网温州11月20日电(黄彦君 周思思 夏晓强)眼下正值番薯采收季，在浙江文成西坑畲族镇塘垟村的番薯基地里，农户们正抢抓晴好天气采收番薯。","summary_short":"中新网温州11月20日电(黄彦君 周思思 夏晓强)眼下正值番薯采收季，在浙江文成西坑畲族镇塘垟村的番薯基地里…","digest":"眼下正值番薯采收季，在浙江文成西坑畲族镇塘垟村的番薯基地里…","points":["中新网温州11月20日电(黄彦君 周思思 夏晓强)眼下正值番薯采收季…","锄头翻起松软泥土，一串串果形匀称的番薯接连破土而出","大家分工配合、装筐转运，田垄间一派丰收忙碌的景象"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:35:19+08:00","size":1,"keywords":[],"body":"中新网温州11月20日电(黄彦君 周思思 夏晓强)眼下正值番薯采收季，在浙江文成西坑畲族镇塘垟村的番薯基地里，农户们正抢抓晴好天气采收番薯。\n\n　　锄头翻起松软泥土，一串串果形匀称的番薯接连破土而出。大家分工配合、装筐转运，田垄间一派丰收忙碌的景象。\n\n　　“今年番薯个头大，单个能长到十几斤，品质可观。以往种出来的番薯都要自己寻找销路，今年不用再费心售卖，文成县供销社直接上门收运，省心不少。”塘垟村番薯种植户叶冬莲说。\n\n　　近年来，塘垟村立足山地资源禀赋，将山间寻常的番薯从零散种植的“土作物”，培育成标准化种植、规模化采收、精深加工一体化的特色富民产业。\n\n11月中旬，浙江文成，番薯丰收。夏晓强 摄\n\n　　随着产业链条不断延伸，番薯价值持续走高，小番薯走出了一条特色增收致富路。\n\n　　番薯产业向好发展，背后是产销模式的转变。\n\n　　此前，当地番薯多为散户自发栽种，品种混杂，收获后只能零散叫卖，销路不稳、收益微薄。如今在该县供销社的带动下，番薯实现统一品种种植、统一保底收购，真正做到“地里刚挖好，马上有销路”。\n\n　　塘垟村党总支书记刘旭清介绍，今年村里番薯种植面积达200多亩，平均亩产可达4000多斤，村民销路有保障，收入也更加稳定。\n\n　　同时，该番薯基地还设置了50多个“共富岗”，农忙采收、加工旺季时，村里的留守老人、妇女也能就近务工，真正实现“一块土地两份收益”。\n\n11月中旬，浙江文成，番薯丰收。雷思涵 摄\n\n　　随着示范效应持续释放，越来越多农户主动加入番薯种植队伍。目前，西坑畲族镇参与番薯种植的农户有147户，人均年增收8000元以上。\n\n　　然而，只卖鲜薯，利润空间有限，还面临储存难题。在此基础上，打通初加工、深加工环节，才是番薯产业提质增效的关键。\n\n　　在文成县黄坦镇一处薯业有限公司的番薯加工厂区，生产线正全速运转。\n\n　　在这里，经文成县供销社统一转运来的新鲜番薯经过清洗除杂、粉碎磨浆、多级过滤、沉淀提纯、脱水烘干等多道工序，蜕变为洁白细腻、品质稳定的番薯淀粉。番薯淀粉既可作为特色农产品直接对外销售，还能进一步加工成番薯粉丝、粉条等产品。\n\n　　“本阶段我们主打番薯粉丝产品，后续还计划开发番薯干、酸辣粉、粉皮等衍生产品。”该公司法人吴伟华说，鲜薯售价偏低且不易储存，加工成淀粉、粉丝之后，保质期更长，市场价格也更为稳定。原本一斤几毛钱的鲜薯，加工成粉丝后价值大幅提升。\n\n11月中旬，浙江文成，番薯加工成的淀粉。雷思涵 摄\n\n　　小小番薯，扎根沃土，一次深加工，串起一条共富链。前端有保底收购兜底，后端有加工消化产能，真正把农产品增值收益留在了山区乡村。\n\n　　西坑畲族镇有关负责人表示，接下来当地将持续深耕番薯产业链，进一步放大产业共富效应。在稳住现有种植规模的前提下，增设更多共富岗位，吸纳低收入农户、留守劳动力参与产业发展，让产业红利惠及更多民众。\n\n　　一个番薯的“生金路”，是文成深挖山地物产价值的缩影。\n\n　　近年来，当地依托订单农业、共富工坊等形式解锁靠山吃山“新吃法”。糯米山药、春笋、木耳、高山杨梅等特色山货不仅畅销国内，还借华侨资源走出国门，让村民在家门口就能端稳增收“饭碗”。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd660b8316f","title":"中国首次量子磁测电缆巡检实战作业完成","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735513.shtml","summary":"中新社浙江台州11月20日电 (王逸飞 徐梓沐)中国国家电网浙江省电力有限公司(下称国网浙江电力)11月20日在浙江台州大陈岛海域完成中国首次量子磁测电缆巡检实战作业。","summary_short":"中新社浙江台州11月20日电 (王逸飞 徐梓沐)中国国家电网浙江省电力有限公司(下称国网浙江电力)11月20日在浙江台州…","digest":"中国国家电网浙江省电力有限公司(下称国网浙江电力)11月20日在浙江台州大陈岛海域完…","points":["中新社浙江台州11月20日电 (王逸飞 徐梓沐)中国国家电网浙江省电力有限公司(下称国网浙江…","现场采用无人机、机器狗，搭载国网浙江电力自主研发的中国首套量子磁测电缆巡检装置…","此次仅用一天即完成全段巡检，比传统方式缩短3天至4天"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:34:57+08:00","size":1,"keywords":[],"body":"中新社浙江台州11月20日电 (王逸飞 徐梓沐)中国国家电网浙江省电力有限公司(下称国网浙江电力)11月20日在浙江台州大陈岛海域完成中国首次量子磁测电缆巡检实战作业。\n\n　　现场采用无人机、机器狗，搭载国网浙江电力自主研发的中国首套量子磁测电缆巡检装置，对中国首个柔性低频输电工程的35千伏低频电缆开展海陆一体化巡检。此次仅用一天即完成全段巡检，比传统方式缩短3天至4天。\n\n11月20日，浙江台州，量子磁测无人机检测中国首条35千伏低频海底电缆。　王奕诚 摄\n\n　　海底电缆是海岛供电、海上风电送出的能源生命线，受潮汐冲刷、海床变迁、船舶锚害等因素影响，易出现绝缘破损、路径偏移、局部裸露甚至随海流摆动等隐患。传统巡检方式难以一次完成全线巡检，且对深埋海缆的探测能力仍较为有限。此次巡检的35千伏低频海缆全长25.7千米，采用三芯绞合结构。由于三芯电流产生的磁场在外部相互削弱，海面上能够探测到的磁场信号十分微弱，进一步增加海缆定位难度。\n\n　　中国首套量子磁测电缆巡检装置利用原子自旋对磁场变化的敏感特性，可以捕捉比地磁场还要弱千万倍的磁场信号。巡检过程中，无人机搭载量子磁测装置沿预定航线扫描采集电缆磁场数据，通过海底电缆探测系统分析磁场信号，反演电缆的空间位置和埋深信息，定位精度可达米级，探测电缆埋深最高达100米，能够精准识别海缆位移、埋深变浅、绝缘损伤等早期风险。\n\n　　该装置还可适配不同巡检场景。在海上，无人机搭载量子磁测装置沿电缆路由快速扫描，覆盖深水区、浅滩等不同海域；在海陆交界和陆缆区段，机器狗搭载同一套装置接续作业，无需更换探测设备，即可完成海缆、陆缆全链路巡检。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfaee938ee0","title":"“社保断缴三个月账户清零”不实（2026·11·20）","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735519.shtml","summary":"辟 谣 “社保断缴三个月账户清零”不实  　　详情：近期，网传“社保断缴超过三个月，之前交的钱清零”，引发关注。","summary_short":"辟 谣 “社保断缴三个月账户清零”不实  　　详情：近期，网传“社保断缴超过三个月，之前交的钱清零”，引发关注。","digest":"辟 谣 “社保断缴三个月账户清零”不实  　　详情：近期，网传“社保断缴超过三个月…","points":["详情：近期，网传“社保断缴超过三个月，之前交的钱清零”，引发关注","该传言系典型的“旧谣新传”，所谓“清零”说法并不准确，参保人已缴纳的社保权益不会凭空消失","人社部已明确，养老保险断缴后，参保记录不会清零"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:31:39+08:00","size":1,"keywords":[],"body":"辟 谣 “社保断缴三个月账户清零”不实\n\n　　详情：近期，网传“社保断缴超过三个月，之前交的钱清零”，引发关注。该传言系典型的“旧谣新传”，所谓“清零”说法并不准确，参保人已缴纳的社保权益不会凭空消失。\n\n　　1.养老保险：不会清零，已缴费用一分不会少\n\n　　人社部已明确，养老保险断缴后，参保记录不会清零。社保经办机构会留存基本养老保险关系，保存全部参保缴费记录，个人账户储存额持续计息，已缴纳的养老保险费用不会作废。断缴只会放缓“累计时长”的积累，不会清除已有的缴费记录。\n\n　　2.医保：个人账户余额仍保留，但“连续缴费年限”会重新计算\n\n　　医保断缴主要影响连续缴费年限核算与医保待遇享受，医保个人账户的钱是不会清零的。多地政策规定，医保断缴超过3个月后续保，会被视为重新参保，连续缴费年限重新计算，并且有3到6个月的等待期，等待期内无法享受医保报销。因此，社保尽量不要断缴。如若已经断缴也不必恐慌，个人账户资金、累计缴费年限都不会丢失，找到新单位后续缴即可。(来源：中国劳动保障报)\n\n　　辟 谣 网传“北京22名老师飞往贵阳后全部陷入沉默”系AI编造\n\n　　详情：近日，网传“北京22名老师飞往贵阳，飞机落地下去后，全部陷入了沉默”相关图文及短视频，内容涉及校长离世、学生突发意外、吃过期面包等情节，引发关注。经贵阳市教育局核实，网传“北京22名教师赴贵阳”为虚假信息，相关内容不属实。此类谣言以悲情叙事为固定模板，衍生出多个改编版本，仅替换地名、学校、人物等要素。请广大网民提高警惕，不轻信AI流水线批量炮制的虚假信息。(来源：“贵州辟谣”微信公众号)\n\n　　误 区 饮用无醇酒不会被查出酒驾？\n\n　　真相：近年来，网上流传“无醇起泡酒、无醇葡萄酒、无醇啤酒等饮品不含酒精，喝了不会被查出酒驾”的说法，这其实是认知误区。\n\n　　事实上，“无醇酒”并非完全不含酒精，只是酒精度极低。根据我国相关标准，酒精度小于0.5%vol的酒类，即可标注为“无醇酒”，饮用后仍存在检出酒精的可能：刚饮用完毕时，口腔内会残留少量酒精，干扰呼气酒精检测结果；如果短时间大量饮用，微量酒精不断累积，一旦数值达到酒驾认定标准，同样会判定为酒后驾驶。\n\n　　需要注意的是，即便相关产品标签标注“0.0%”，也可能含有微量酒精，仍存在被检出的风险。能否认定酒驾，和实际酒精含量、饮用量、饮用时间以及个体差异有关，最终以官方检测结果为准。为安全起见，驾车前最好不要饮用任何类型的无醇酒。(来源：“科学辟谣”微信公众号)\n\n　　通 报 河南漯河通报“清朗”系列专项行动典型案例\n\n　　详情：为持续深化网络生态治理，河南漯河网信、公安等职能部门紧密协作，聚焦虚假不实信息、“三秋”网络乱象等群众关切问题开展全面整治，现通报“清朗”系列专项行动典型案例。\n\n　　案例一：网民刘某发布涉未成年人溺亡不实信息，博取关注，造成公众恐慌。经核查，当地未发生相关溺亡事件。属地网信办联合公安机关对当事人刘某进行批评教育。\n\n　　案例二：网民王某发布田间捡拾短视频，为博取流量刻意搭配惊悚背景音乐，误导公众对正常农事活动的认知，在“三秋”关键时期扰乱秋收秩序。经核查，视频场景为正常农事活动，不存在异常状况。属地网信办联合公安机关对当事人王某进行批评教育。\n\n　　案例三：网民石某拍摄种植地画面并发布上网，称辖区流转土地沦为“荒地”，引发网民误解，造成不良社会影响。经核查，视频拍摄地块为正常流转经营的冬瓜种植地，因作物成熟、藤蔓自然枯萎导致地表裸露，不存在耕地撂荒问题。属地相关部门对当事人石某讲解农业生产规律与相关政策。\n\n　　案例四：网民马某为博取流量，借田间捡拾的现场素材，捏造生姜被哄抢的不实视频发布上网，干扰群众判断，造成不良影响。经核实，姜田分区域采收，已采收完毕地块允许群众捡拾遗落生姜，现场并无哄抢情形。属地相关部门联合公安机关对当事人马某进行批评教育。\n\n　　目前，以上人员均已主动删除相关视频。(来源：“漯河网信”微信公众号)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1090f37221","title":"巴丹吉林沙漠里的“三北”治沙答卷","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735494.shtml","summary":"中新网阿拉善11月20日电 题：巴丹吉林沙漠里的“三北”治沙答卷  　　作者 陈峰 吴雯 王晓春  　　初冬时节，寒风掠过阿拉善戈壁，雅布赖山南麓九棵树防沙治沙综合治理区内却是一派繁忙之景。","summary_short":"中新网阿拉善11月20日电 题：巴丹吉林沙漠里的“三北”治沙答卷  　　作者 陈峰 吴雯 王晓春  　　初冬时节…","digest":"题：巴丹吉林沙漠里的“三北”治沙答卷  　　作者 陈峰 吴雯 王晓春  　　初冬时节…","points":["初冬时节，寒风掠过阿拉善戈壁，雅布赖山南麓九棵树防沙治沙综合治理区内却是一派繁忙之景","20世纪90年代，这里沙化严重、流沙肆虐，沙漠每年向外侵移15至20米…","扎根荒漠治沙11年的付俊年，是这片沙地上最早一批的治沙人"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T20:20:10+08:00","size":1,"keywords":[],"body":"中新网阿拉善11月20日电 题：巴丹吉林沙漠里的“三北”治沙答卷\n\n　　作者 陈峰 吴雯 王晓春\n\n　　初冬时节，寒风掠过阿拉善戈壁，雅布赖山南麓九棵树防沙治沙综合治理区内却是一派繁忙之景。连绵沙丘之上，机器轰鸣，金黄的草帘沙障顺着沙丘铺展，新植的梭梭树迎风挺立，一同构筑起阻隔巴丹吉林、腾格里两大沙漠交汇侵袭的生态防线。\n\n图为治沙现场。阿拉善右旗融媒体中心供图\n\n　　九棵树防沙治沙综合治理区，位于内蒙古自治区阿拉善盟阿拉善右旗巴丹吉林沙漠南缘，是守护河西走廊、遏制风沙东移的关键屏障。20世纪90年代，这里沙化严重、流沙肆虐，沙漠每年向外侵移15至20米，“沙进人退”一度成为当地生态环境的真实写照。随着国家“三北”工程持续推进，这片沙漠迎来系统性治理、规模化修复的全新转折点。\n\n　　扎根荒漠治沙11年的付俊年，是这片沙地上最早一批的治沙人。亲眼见证黄沙漫漫的荒漠一点点染上绿意，付俊年感慨良多。\n\n图为治沙现场。阿拉善右旗融媒体中心供图\n\n　　“刚开始那几年，真的太难了，风沙大，种下去的树苗没几天就被流沙吞没。但咱不能放弃，要干就得干出个样儿来！”回忆往昔，付俊年感慨万千。\n\n　　多年深耕一线，他和团队摸索出“草方格沙障+耐旱苗木栽植”的治理模式，通过沙障固沙保水、苗木固土扎根，持续改善沙地土质，提升荒漠植被存活率。“这份执着不仅是为了重现家乡的绿色生机，更是要给子孙后代留下一片蓝天。”付俊年笑着说道。\n\n　　数十年接续奋斗，阿拉善右旗治沙成果持续显现。2025年，全长1856公里的阿拉善三大沙漠锁边林草带全线合龙，九棵树片区是这条“绿色长城”的关键节点。锁边不是消灭沙漠，而是管控流沙边界，逐步扭转风沙扩张态势。\n\n　　从早年人工治沙，到如今机械化、标准化施工，阿拉善右旗林草和荒漠防治局工程师张有拥亲眼见证了治沙技术的升级。\n\n　　不同于早年单一的挖坑栽苗，如今的生态治理是一套系统施策的“组合拳”：工程沙障固定表层沙土，封沙育林育草修复原生植被，人工补植乡土固沙苗木，分类精准施治。“沙障就是幼苗的‘保护伞’，荒漠里种树，活下来才是硬道理。”张有拥蹲在沙地上，指尖抚过一株梭梭，感慨道。\n\n　　张有拥说：“梭梭栽种后的前3年是成活关键窗口期，我们要定期巡查、补植枯死苗木。等梭梭根系扎稳，能够依靠自然降水存活后，再移交常态化封禁管护。目前‘三北’六期工程95%地块苗木成活率达到75%以上，剩余地块我们会抓紧补植补造，确保全部地块达标。”\n\n　　科技赋能为荒漠治理注入新动能。当地联合多家科研院所聚焦重点风沙口开展治沙技术研发攻关，持续探索适配本地的综合治理技术体系。\n\n　　其中，雅布赖山风沙口综合治理示范项目，在风沙规律研判、固沙技术优化、乡土植被修复、生态监测体系建设等方面取得阶段性突破，推动治沙工作从单点治理迈向科学化、系统化、标准化全域治理。\n\n图为沙漠中的沙障。阿拉善右旗融媒体中心供图\n\n　　阿拉善右旗林业草原和荒漠防治局局长张军杰介绍：“按照‘三北’六期工程总体规划，2025至2030年，阿拉善右旗计划完成沙漠治理任务221.1万亩，2025年已完成治理任务90.3万亩。2026年作为攻坚之年，重点推进46.4万亩治理任务。下一步，当地将持续织密沙漠锁边绿色屏障，在北疆大漠书写生态保护、绿色发展的新时代答卷。”(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf73e11150b","title":"甘南学子津门研学：在历史与未来间感受“同心”","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-20/news1075608.shtml","summary":"11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津。","summary_short":"11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津。","digest":"11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津","points":["11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津","来自甘肃甘南藏族自治州的49名青少年，围绕红色教育、科创体验、校园交流…","周恩来邓颖超纪念馆里，孩子们围在展柜前看照片、听讲解"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T20:19:46+08:00","size":1,"keywords":[],"body":"11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津。来自甘肃甘南藏族自治州的49名青少年，围绕红色教育、科创体验、校园交流、民族团结联谊等开展研学。\n\n周恩来邓颖超纪念馆里，孩子们围在展柜前看照片、听讲解；天开高教科创园里，机械臂完成抓取，智能设备开口对话；南开大学校史馆内，研学团看老照片、听校史，并在周恩来总理雕像前合影；天津市红光中学操场上，津甘两地学生围成一圈跳起锅庄舞。(记者 冯宏杰 天津报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/9113D65671184CC1AD819571CA6DB550.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c6612bfe9e9","title":"今年第二批旅游市场严重失信主体典型名单公布","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735469.shtml","summary":"近期，各地深入推进“纠治旅游行业导游乱象、强制消费等问题”集中整治，严厉打击虚假宣传、强迫购物等严重侵害旅游者权益的违法违规行为，并将有关企业依法依规认定为文化和旅游市场严重失信主体。","summary_short":"近期，各地深入推进“纠治旅游行业导游乱象、强制消费等问题”集中整治，严厉打击虚假宣传…","digest":"近期，各地深入推进“纠治旅游行业导游乱象、强制消费等问题”集中整治，严厉打击虚假宣传…","points":["近期，各地深入推进“纠治旅游行业导游乱象、强制消费等问题”集中整治，严厉打击虚假宣传…","为加强警示、形成震慑，文化和旅游部选取了部分严重失信主体典型名单，予以公布","失信行为：该公司组织27名旅游者参加2026年1月“昆明、大理、丽江6天5晚游”"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T20:04:53+08:00","size":1,"keywords":[],"body":"近期，各地深入推进“纠治旅游行业导游乱象、强制消费等问题”集中整治，严厉打击虚假宣传、强迫购物等严重侵害旅游者权益的违法违规行为，并将有关企业依法依规认定为文化和旅游市场严重失信主体。为加强警示、形成震慑，文化和旅游部选取了部分严重失信主体典型名单，予以公布。\r\n\n　　一、贵州盛世优途旅行社有限公司\n\n　　失信行为：该公司组织26名旅游者参加“甄选贵州豪华品质度假五日游”，与24名旅游者签订自愿购物补充协议约定1个具体购物场所、与另外两名旅游者签订补充协议约定不含购物场所，但故意将行程单中部分购物场所包装为“非遗博物馆”“酱油厂联谊”等。行程中，被旅游者发现该公司安排了多个购物场所，引发集体投诉，协商无果后，集体终止了旅游行程。\n\n　　处罚结果：贵阳市文化和旅游局依据《中华人民共和国旅游法》第三十五条第二款、第九十八条的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚，对直接负责的主管人员严某某、其他直接责任人员黄某分别作出罚款20000元的行政处罚。\n\n　　二、云南狂嗨旅行社有限公司\n\n　　失信行为：该公司组织27名旅游者参加2026年1月“昆明、大理、丽江6天5晚游”。在“昆明—大理”段行程中，安排一名曾因强迫购物被吊销导游证的人员顶替原导游为旅游者提供服务。被执法人员发现后拒不改正。\n\n　　处罚结果：昆明市文化和旅游局依据《中华人民共和国旅游法》第九十六条第二款的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚。\n\n　　三、桂林澜悦国际旅行社有限公司\n\n　　失信行为：该公司通过网上招徕方式组织4个旅游团共131人赴桂林旅游。行前与旅游者签订的旅游合同，或未明确载明购物场所等信息，或将购物场所以“戏楼”“广场”等名义进行包装，误导旅游者。行程中，未征得旅游者同意，擅自取消、变更行程安排，引发27名旅游者集体投诉。\n\n　　处罚结果：桂林市文化广电和旅游局依据《中华人民共和国旅游法》第六十九条第一款、第一百条第一款、第一百零三条的规定，依法对该公司作出罚款41000元、吊销旅行社业务经营许可证的行政处罚，对直接负责的主管人员欧某、其他直接责任人员雷某某分别作出罚款20000元、自处罚之日起未逾三年不得从事旅行社业务的行政处罚。\n\n　　四、昆明青年国际旅行社有限公司\n\n　　失信行为：该公司组织5名旅游者参加2026年2月“昆明、大理、丽江、西双版纳10天9晚游”，并签订合同。抵达昆明后，该公司以“不再次签订合同即视为脱团”“不再安排任何交通住宿及行程”为威胁，迫使旅游者与另外一家旅行社签订旅游包价合同，严重违背旅游者意愿。\n\n　　处罚结果：昆明市文化和旅游局依据《中华人民共和国旅游法》第一百条的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚。\n\n　　五、陕西国际旅行社有限责任公司\n\n　　失信行为：该公司以666元/人、500元/人等明显低于成本的价格招徕旅游者赴泰国参加6天4晚游。行前，未征得旅游者同意，擅自将地接旅游业务委托给其他出境社；行程中，安排参观违反我国法律、法规和社会公德的项目，擅自增加购物场所和另行付费项目，并言语威胁“让你回不了中国”“到了免税店你坚决上不了车”，强迫旅游者消费，造成恶劣社会影响。\n\n　　处罚结果：西安市文化和旅游局依据《中华人民共和国旅游法》第三十三条、第三十五条、第九十八条、第一百零一条的规定，依法对该公司作出没收违法所得8558元、吊销旅行社业务经营许可证的行政处罚。\n\n　　六、天津市红牛国际旅行社有限公司\n\n　　失信行为：该公司在未取得经营出境旅游业务资格的情况下，违规招徕、组织旅游者参加“日本福冈和东京自由行五日游”。该公司未按合同约定预先支付住宿费用，行程中要求旅游者自行垫付，行程结束后未按约定退还相关垫付费用。在执法人员开展核查工作时拒不配合。同时，查明该公司拒不履行补足旅游服务质量保证金的法定义务。\n\n　　处罚结果：天津市河西区文化和旅游局依据《中华人民共和国旅游法》第二十九条第二款、第九十五条第二款的规定，依法对该公司作出没收违法所得10980元、罚款30000元、吊销旅行社业务经营许可证的行政处罚。\n\n　　七、潮州市骏晖旅行社有限公司\n\n　　失信行为：该公司以明显低于成本价方式招徕15名旅游者参加“潮汕壹号”旅行团。行程中安排未取得导游证的人员提供导游服务，并通过安排购物以“人头费”方式收取回扣，引起旅游者强烈不满。\n\n　　处罚结果：潮州市文化广电旅游体育局依据《中华人民共和国旅游法》第三十五条、第九十六条第二项、第九十八条的规定，依法对该公司作出没收违法所得10400元、罚款30000元、吊销旅行社业务经营许可证的行政处罚。\n\n　　八、西安交个朋友户外旅行有限公司\n\n　　失信行为：该公司明知秦岭“小峪草甸”位于秦岭核心保护区、禁止开展徒步登山等违规活动，仍通过短视频平台发布“小峪草甸登高”产品，招徕组织11名旅游者违规前往小峪草甸开展徒步登山活动，严重破坏秦岭核心保护区生态环境。\n\n　　处罚结果：西安市文化和旅游局依据《中华人民共和国旅游法》第一百零一条的规定，依法对该公司作出没收违法所得并吊销旅行社业务经营许可证的行政处罚。\n\n　　九、云南翱腾国际旅行社集团有限公司\n\n　　失信行为：该公司组织4名旅游者参加2026年4月“昆明、大理、丽江6天5晚游”，后将4名旅游者全程委托给第三方旅行社接待。行程结束后，该公司依然未向接受委托的旅行社支付接待和服务费用，并被旅游者投诉和媒体曝光，造成严重社会不良影响。\n\n　　处罚结果：昆明市文化和旅游局依据《旅行社条例》第三十七条第一款、第六十二条第一项的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚。\n\n　　十、北京畅想国际旅行社有限公司\n\n　　失信行为：该公司云南分公司通过短视频平台宣传招徕4名旅游者参加“昆明-大理-丽江6天5晚游”。行前承诺安排入住“昆明1晚5星酒店”，实际仅安排入住无星级的一般酒店。同时，该公司因投诉量长期排名靠前，被当地文化和旅游部门列入重点监管旅行社名单。\n\n　　处罚结果：昆明市文化和旅游局依据《中华人民共和国旅游法》第三十二条、第九十七条第一项的规定，依法对该公司作出没收违法所得并吊销旅行社业务经营许可证的行政处罚。\n\n　　十一、北京环仪国际旅行社有限公司\n\n　　失信行为：该公司云南分公司在明知曹某某曾因强迫旅游者购物已被吊销导游证的情况下，仍安排其带团从事导游服务。行程中，曹某某对旅游者态度恶劣，侮辱人格，强迫旅游者在购物场所消费。同时，该公司因旅游服务质量问题被大量投诉，相关部门督促后，仍拒不整改。\n\n　　处罚结果：昆明市文化和旅游局依据《中华人民共和国旅游法》第九十六条第二项的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚。\n\n　　十二、北京麓途国际旅行社有限公司\n\n　　失信行为：该公司云南分公司通过互联网招徕3名旅游者赴云南旅游并约定费用总计7000元(含往返机票费)。旅游者抵达昆明后被该公司要求另行支付1050元。行程中，该公司擅自将3名旅游者以每人1400元的价格委托给其他旅行社接待。行程结束后，旅游者返程机票被取消，滞留昆明，协商未果后，旅游者被迫自行购票返回。同时，该公司因投诉量长期排名靠前，被当地文化和旅游部门纳入重点监管旅行社名单。\n\n　　处罚结果：昆明市文化和旅游局依据《中华人民共和国旅游法》第一百条第三项、第一百零三条的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚，对法定代表人邓某作出自处罚之日起未逾三年不得从事旅行社业务的行政处罚。\n\n　　十三、云南滇港国际旅行社有限公司\n\n　　失信行为：该公司组织旅游者参加“云南香格里拉、虎跳峡、普达措国家公园2日1晚游”。未经旅游者同意，擅自转包给其他旅行社，致使行程中增加了2个购物场所，原定的虎跳峡(香格里拉段)游览变更为虎跳峡(丽江段)、康赞土司游览变更为阿古木土司庄园。同时，该公司因旅游服务质量问题，先后两次被当地文化和旅游部门纳入重点监管旅行社名单。\n\n　　处罚结果：昆明市文化和旅游局依据《旅行社条例》第三十三条第二项、第五十九条第二项的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚。\n\n　　十四、吉林省腾达盛世旅行社有限公司\n\n　　失信行为：该公司以全程无额外消费等宣传方式招徕旅游者，签订的合同中载明“本行程无购物活动，无另行付费旅游项目”。行程中，派遣导游在大巴车上单方面提出向每名旅游者收取1180元额外费用，并以“无法入园”“无法继续行程”等方式向旅游者施压，造成部分旅游者滞留。\n\n　　处罚结果：长白山保护开发区池北区管理委员会依据《旅行社条例》第三十三条第三项、第五十九条的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚。\n\n　　十五、海南也了国际旅行社有限公司\n\n　　失信行为：该公司在明知潜水产品服务供应商无高危险性体育项目经营许可证情况下，仍与其签订合作协议，并通过网络直播、发帖等方式销售“万宁加井岛潜水产品”。在潜水过程中，旅游者与潜水产品服务供应商发生矛盾纠纷，并被多家媒体曝光，造成严重社会不良影响。\n\n　　处罚结果：海南省旅游和文化广电体育厅依据《中华人民共和国旅游法》第三十四条、第九十七条第二项的规定，依法对该公司作出吊销旅行社业务经营许可证的行政处罚。\n\n　　(总台央视记者 曹岩 赵继哲) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2a5d4a6e90","title":"新增基础研究领域资质 上海市境外职业资格证书认可清单4.0版发布","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735459.shtml","summary":"中新网上海11月20日电 (记者 许婧)上海市人力资源和社会保障局20日发布上海市境外职业资格证书认可清单4.0版，进一步衔接境内外专业技术人才评价标准。","summary_short":"中新网上海11月20日电 (记者 许婧)上海市人力资源和社会保障局20日发布上海市境外职业资格证书认可清单4.0版…","digest":"上海市人力资源和社会保障局20日发布上海市境外职业资格证书认可清单4.0版…","points":["中新网上海11月20日电 (记者 许婧)上海市人力资源和社会保障局20日发布上海市境外职业资…","截至目前，累计323位持证人通过考核认定取得高级工程师、高级经济师、高级会计师、工程师职称…","今年，上海市人社局向29家市级主管部门征集意见，按照产业匹配度、含金量、知名度…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T19:55:19+08:00","size":1,"keywords":[],"body":"中新网上海11月20日电 (记者 许婧)上海市人力资源和社会保障局20日发布上海市境外职业资格证书认可清单4.0版，进一步衔接境内外专业技术人才评价标准。\n\n11月20日，上海市人力资源和社会保障局发布上海市境外职业资格证书认可清单4.0版。　　　上海市人力资源和社会保障局供图\n\n　　上海自2023年建立境外职业资格证书认可清单制度以来，连续发布清单，形成认可、急需紧缺、比照职称、互认ABCD“四清单”，为持证人提供出入境、人才引进等“6+6”项便利保障服务，持证人可申报认定职称，上海职称持有人申请境外职业资格可享受直接申请、豁免部分课程、减免考试科目等政策。\n\n　　截至目前，累计323位持证人通过考核认定取得高级工程师、高级经济师、高级会计师、工程师职称，其中90%以上来自外资或民营企业，30岁至49岁中青年约占80%，公司管理层或核心技术部门负责人约占50%。\n\n　　清单4.0版延续互认ABCD“四清单”和“6+6”项便利保障措施，持续健全行业联动的证书主动发现机制、证书遴选的专家评估机制、适配产业的清单动态调整机制、证书核验的快速响应机制。\n\n　　今年，上海市人社局向29家市级主管部门征集意见，按照产业匹配度、含金量、知名度、国际化程度等维度，将物理、化学、化工、材料、人工智能、信息安全、建筑、集成电路等专业的12项证书纳入A类、B类清单；会同行业主管部门组织专家评估，依据证书能查验、评价标准可比照、专业人才有需求等维度，将会计、人工智能、信息技术、项目管理领域的5项证书纳入职称比照清单(C类)。同时，将含金量不及同类证书、覆盖范围和影响力相对有限的会展、翻译专业3项证书退出清单，确保清单科学、严谨。\n\n　　在生命健康、数字技术、工程技术、专业服务四大行业领域基础上，清单4.0版新增基础研究领域，纳入美国物理学会会士、英国物理学会会士、加拿大化学协会会士、美国材料研究学会会士、德国马克斯普朗克协会科研组长等全球基础研究领域权威证书。在专业服务业领域，金融管理、人力资源、法律、会展商务等专业服务业证书达54项。重点国家(地区)、重点行业含金量较高的证书基本纳入清单。\n\n　　服务深化沪港合作，清单4.0版将香港工程师学会能源、机械、化工等全部22个专业界别证书列入清单，将香港注册会计师资深会员(FCPA)列入职称比照清单(C类)，可比照认定高级会计师；将台湾地区技术士纳入清单，助力集成电路产业发展。\n\n　　清单4.0版新增英格兰及威尔士特许会计师(ICAEW)、香港注册会计师(HKCPA)、国际会计师公会(AIA)执业证书3项证书进入互认清单(D类)。联合中和土地房地产资产评估有限公司高级经济师孙建波，是上海境外职业资格证书认可清单D类双向互认首批持证代表。他先凭借英国皇家特许测量师学会专业会员资质比照认定上海高级经济师，再以境内副高职称免试申请AAPM的MPM资深项目经理证书。孙建波表示，上海境外职业资格证书认可清单制度，大幅压缩取证周期、降低备考成本，也为他搭建起跨行业专业交流平台，给具备跨境执业背景的专业人才提供了有力支撑。\n\n　　下一步，上海市人社局将会同行业主管部门，面向外资领域、重点产业人才精准开展政策解读和案例宣传，推动清单4.0版各项举措落地见效，持续提升上海对全球专业技术人才的吸引力。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":67,"items":[{"id":"cca104e16f2","title":"德力佳：董事长提议5000万元-1亿元回购公司股份","url":"https://www.jiemian.com/article/15356887.html","summary":"德力佳11月20日公告，公司实际控制人之一、董事长兼总经理刘建国提议公司通过集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购股份将全部用于员工持股计划或股权激励。","summary_short":"德力佳11月20日公告，公司实际控制人之一、董事长兼总经理刘建国提议公司通过集中竞价交易方式回购公司已发行的部分人民币普…","digest":"德力佳11月20日公告，公司实际控制人之一…","points":["德力佳11月20日公告，公司实际控制人之一、董事长兼总经理刘建国提议公司通过集中竞价交易方式…","回购资金总额不低于5000万元（含），不超过1亿元（含）","回购价格不超过公司董事会通过回购股份决议前30个交易日公司股票交易均价的150%…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T20:19:44+08:00","size":2,"keywords":[],"body":"德力佳11月20日公告，公司实际控制人之一、董事长兼总经理刘建国提议公司通过集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购股份将全部用于员工持股计划或股权激励。回购资金总额不低于5000万元（含），不超过1亿元（含）。回购价格不超过公司董事会通过回购股份决议前30个交易日公司股票交易均价的150%，具体以董事会审议通过的回购方案为准。","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"德力佳：董事长提议5000万元-1亿元回购公司股份","url":"https://www.jiemian.com/article/15356887.html","source_display":"界面新聞","published_at":"2026-11-20T20:19:44+08:00","category":"","digest":"德力佳11月20日公告，公司实际控制人之一…"},{"title":"福龙马：实控人提议5000万元-1亿元回购公司股份","url":"https://www.jiemian.com/article/15356871.html","source_display":"界面新聞","published_at":"2026-11-20T20:12:45+08:00","category":"","digest":"福龙马11月20日公告，公司实际控制人…"}]},{"id":"cca657cf4b9","title":"上期能源：对部分客户采取限制开仓监管措施","url":"https://www.jiemian.com/article/15356313.html","summary":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告。","summary_short":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告。","digest":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告","points":["11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告","公告称，2026年11月20日，1组实际控制关系账户在相关合约上账户组日内开仓交易量超限达到…","上述客户交易行为违反《上海国际能源交易中心异常交易行为管理细则》第16条之规定…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:38:02+08:00","size":2,"keywords":[],"body":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告。公告称，2026年11月20日，1组实际控制关系账户在相关合约上账户组日内开仓交易量超限达到上海国际能源交易中心（以下简称上期能源）处理标准。上述客户交易行为违反《上海国际能源交易中心异常交易行为管理细则》第16条之规定，上期能源决定对相关客户在相应品种上采取限制开仓的监管措施。","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"上期能源：对部分客户采取限制开仓监管措施","url":"https://www.jiemian.com/article/15356313.html","source_display":"界面新聞","published_at":"2026-11-20T17:38:02+08:00","category":"","digest":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告"},{"title":"上期所：对部分客户采取限制开仓监管措施","url":"https://www.jiemian.com/article/15356297.html","source_display":"界面新聞","published_at":"2026-11-20T17:35:20+08:00","category":"","digest":"11月20日，上海期货交易所发布关于对部分客户采取限制开仓监管措施的公告"}]},{"id":"c6d66816674","title":"亚得里亚海输油管道修复工作完成，恢复向塞尔维亚输油","url":"https://www.jiemian.com/article/15357172.html","summary":"当地时间11月20日，亚得里亚海输油管道公司表示，克罗地亚境内锡萨克至斯拉沃尼亚布罗德段的管道修复工作已完成，已恢复向塞尔维亚潘切沃炼油厂进行常规原油输送。","summary_short":"当地时间11月20日，亚得里亚海输油管道公司表示，克罗地亚境内锡萨克至斯拉沃尼亚布罗德段的管道修复工作已完成…","digest":"当地时间11月20日，亚得里亚海输油管道公司表示…","points":["当地时间11月20日，亚得里亚海输油管道公司表示…","11月6日，克罗地亚境内锡萨克至斯拉沃尼亚布罗德路段发生管道事故，导致约50万升原油泄漏…","该公司表示，事故周边环境的生态修复工作仍在持续推进…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T23:19:41+08:00","size":1,"keywords":[],"body":"当地时间11月20日，亚得里亚海输油管道公司表示，克罗地亚境内锡萨克至斯拉沃尼亚布罗德段的管道修复工作已完成，已恢复向塞尔维亚潘切沃炼油厂进行常规原油输送。\n\n11月6日，克罗地亚境内锡萨克至斯拉沃尼亚布罗德路段发生管道事故，导致约50万升原油泄漏，向潘切沃炼油厂的原油输送随之暂停。该公司表示，事故周边环境的生态修复工作仍在持续推进，此前输油中断未对匈牙利和斯洛伐克的原油供应造成影响。\n\n亚得里亚海输油管道始于克罗地亚奥米沙利港，是连接中东欧多个国家的重要跨国石油运输网络，也是塞尔维亚通过亚得里亚海进口原油的主要通道。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c69d0752142","title":"外企高管：AI+可再生能源领域与中国企业合作是必然趋势","url":"https://www.chinanews.com/cj/shipin/2026/11-20/news1075621.shtml","summary":"“中国是全球可再生能源领域先驱者，也是人工智能领域领先力量之一。","summary_short":"“中国是全球可再生能源领域先驱者，也是人工智能领域领先力量之一。","digest":"“中国是全球可再生能源领域先驱者，也是人工智能领域领先力量之一","points":["“中国是全球可再生能源领域先驱者，也是人工智能领域领先力量之一","”西班牙安迅能能源公司东南亚区董事总经理伊格纳西奥·多梅克接受中新网采访表示…","而在这一过程中，与中国合作，让中国企业参与项目全流程，这是必然的"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T23:13:26+08:00","size":1,"keywords":[],"body":"“中国是全球可再生能源领域先驱者，也是人工智能领域领先力量之一。”西班牙安迅能能源公司东南亚区董事总经理伊格纳西奥·多梅克接受中新网采访表示，未来人工智能将融入风电场和太阳能电站，从开发、建设到运营的各个环节。而在这一过程中，与中国合作，让中国企业参与项目全流程，这是必然的。(陈庆洋 戴悦 杜水晶)","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/20/39654625-c2c2-4109-a6fb-0ab0e8081175.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2b45cb153e","title":"Anthropic's biggest IPO on record amid AI fears","url":"https://news.tvb.com/tc/1207530-AnthropicsbiggestIPOonrecordamidAIfears","summary":"The artificial intelligence giant Anthropic rose sharply after making the biggest public stock offer…","summary_short":"The artificial intelligence giant Anthropic rose sharply aft…","digest":"The artificial intelligence giant Anthropi…","points":["The artificial intelligence giant Anthropic ro…","This, despite anxiety about an AI bubble and f…","Anthropic shot higher as trading began and hel…"],"section":"財經","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T23:08+08:00","size":1,"keywords":[],"body":"The artificial intelligence giant Anthropic rose sharply after making the biggest public stock offering ever, at one point surpassing $2 trillion in value.\n\nThis, despite anxiety about an AI bubble and fear that the technology threatens lives and livelihoods.\n\nAnthropic shot higher as trading began and held on to much of those gains to close up 17% at $97.17.\n\nThe initial offering overtook SpaceX as the largest IPO in history.\n\nWith the IPO, though, Anthropic will now have enormous resources to accelerate its expansion without taking on more debt.\n\nIn addition to the cash from public investors, the company also planned to sell $26 billion in shares in a private sale Thursday to bring the total raised to $107 billion, an impressive haul for a business not yet six years old.\n\nThe offering will also allow its employees to sell vested stock, making many of them millionaires overnight and adding billions of dollars to the fortunes of CEO Dario Amodei and his sister, Anthropic President Daniela Amodei.\n\nAnthropic is locked in a fight for dominance with OpenAI.\n\nBut both companies have plenty of other competitors, including Google, startups in the US and China and SpaceX, which has an AI business.\n\nAnthropic, OpenAI and SpaceX's AI division have all lost more money than they've made because of the huge costs associated with building AI.\n\nThat has fuelled growing concerns about a bubble forming in the sector.\n\nFurthermore, fears have arisen that the technology could prove dangerous for the future of humanity should its development outpace the ability to safely harness it.\n\nThe regulatory environment could change for Anthropic once the new US Congress is in session.\n\nNewly elected Democrats are vowing to crack down on the industry as a backlash unfolds against data centers.\n\nAnthropic CEO Amodei said his company will aim to shape AI for the better.\n\nDARIO AMOEDI: \"We will not bend to either business nor political pressure. Today puts the company in a stronger financial position and in doing so only strengthens our resolve to do the right thing. If we can show it's possible to make the right choices on safety and still build an incredibly successful company, others in our industry will be inspired to do the same. We call this a race to the top. The race to the top works best when driven from the front of the pack, and we fully hope and expect to do so. (Team joins CEO on stage) But the goal is to make the whole industry better, regardless of whether Anthropic is winning or losing at any given time. The advent of machine intelligence is one of the seminal moments in human history, and we have a rare opportunity to shape it for the better.\"","image":"https://pro-vod-cdn.tvb.com/1ee371ea82594d23a34b359e43fdfdf2/snapshots/8529396ebd4f49c8a8abbb7fd7d0f493-00008.jpg","video":"https://pro-vod-cdn.tvb.com/1ee371ea82594d23a34b359e43fdfdf2/07c02d91ce3340b49b9c2cac249adfdc-e57348e485d7ab78aafbf3285752455a-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/1ee371ea82594d23a34b359e43fdfdf2/snapshots/8529396ebd4f49c8a8abbb7fd7d0f493-00008.jpg","lang":"en"},{"id":"c819205b59f","title":"生态环境部修订文件优化建设项目环评分类管理，明年起施行","url":"https://www.jiemian.com/article/15357161.html","summary":"生态环境部近日发布《建设项目生态环境影响评价分类管理名录（2027年版）》。","summary_short":"生态环境部近日发布《建设项目生态环境影响评价分类管理名录（2027年版）》。","digest":"生态环境部近日发布《建设项目生态环境影响评价分类管理名录》","points":["生态环境部近日发布《建设项目生态环境影响评价分类管理名录（2027年版）》","新版《名录》中，约有70%的行业环评管理类别有实质性修改…","此次修订贯彻落实《生态环境法典》，明确“生态环境影响评价”“生态环境敏感区”等表述…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T23:01:51+08:00","size":1,"keywords":[],"body":"生态环境部近日发布《建设项目生态环境影响评价分类管理名录（2027年版）》。据了解，新版《名录》中，约有70%的行业环评管理类别有实质性修改，全国生态环境影响报告书（表）编制数量将减少25%左右。此次修订贯彻落实《生态环境法典》，明确“生态环境影响评价”“生态环境敏感区”等表述，增加“温室气体排放特征”作为环评类别判定依据；同时充分考虑重点行业减污降碳协同增效，对核与辐射相关行业，按选址、建造、运行、退役等不同阶段分类明确环评要求。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9df42a173b","title":"长春高新：子公司GenSci161注射液境内生产药品注册临床试验申请获得受理","url":"https://www.jiemian.com/article/15357144.html","summary":"长春高新11月20日公告，公司控股子公司长春金赛药业有限责任公司收到国家药品监督管理局核准签发的《受理通知书》，GenSci161注射液的境内生产药品注册临床试验申请获得受理。","summary_short":"长春高新11月20日公告，公司控股子公司长春金赛药业有限责任公司收到国家药品监督管理局核准签发的《受理通知书》…","digest":"长春高新11月20日公告…","points":["长春高新11月20日公告，公司控股子公司长春金赛药业有限责任公司收到国家药品监督管理局核准签…","GenSci161注射液是金赛药业自主研发的一款治疗用生物制品1类新药…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T22:59:43+08:00","size":1,"keywords":[],"body":"长春高新11月20日公告，公司控股子公司长春金赛药业有限责任公司收到国家药品监督管理局核准签发的《受理通知书》，GenSci161注射液的境内生产药品注册临床试验申请获得受理。GenSci161注射液是金赛药业自主研发的一款治疗用生物制品1类新药，为新型全人源单克隆IgG1双特异性抗体，拟用于坏疽性脓皮病（PG）和冷吡啉相关周期性综合征（CAPS）的治疗。适应症：坏疽性脓皮病（PG）、冷吡啉相关周期性综合征（CAPS）。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7d09602e1f","title":"*ST天宜：收到北京证监局行政监管措施决定书","url":"https://www.jiemian.com/article/15357137.html","summary":"*ST天宜11月20日公告，公司及吴佩芳、杨铠璘、侯玉勃于今日收到北京证监局下发的《行政监管措施决定书》[2026]243号。","summary_short":"*ST天宜11月20日公告，公司及吴佩芳、杨铠璘、侯玉勃于今日收到北京证监局下发的《行政监管措施决定书》[2026]24…","digest":"*ST天宜11月20日公告，公司及吴佩芳、杨铠璘…","points":["*ST天宜11月20日公告，公司及吴佩芳、杨铠璘…","经查，公司存在2023年对部分项目未依据合同价格冲减前期暂估确认收入，迟至2024年调整…","2024年对预付石英砂采购款减值计提不充分"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T22:51:58+08:00","size":1,"keywords":[],"body":"*ST天宜11月20日公告，公司及吴佩芳、杨铠璘、侯玉勃于今日收到北京证监局下发的《行政监管措施决定书》[2026]243号。经查，公司存在2023年对部分项目未依据合同价格冲减前期暂估确认收入，迟至2024年调整，收入确认不准确；2024年对预付石英砂采购款减值计提不充分；2024年部分商誉减值计提不充分，且未在年报附注披露商誉减值测试选取的可比公司变动原因；实控人吴佩芳未及时告知公司其对公司非公开发行股票作出的保底收益承诺，导致相关信息披露不及时、不完整；公司合同单据管理、收入核算、资金管理、投资决策等相关内部控制不完善，公司治理制衡机制不足等问题。上述行为违反了《上市公司信息披露管理办法》第三条的规定，吴佩芳作为公司实际控制人、董事长，杨铠璘作为时任总裁，侯玉勃作为财务总监，对违规行为负有责任。根据《上市公司信息披露管理办法》第五十二条的规定，北京证监局决定对公司及吴佩芳、杨铠璘、侯玉勃采取责令改正的行政监管措施，均记入证券期货市场诚信档案。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c54fc28c9c7","title":"美股AI硬件股开盘全线下挫：费城半导体指数跌3%，AMD跌近5%","url":"https://www.jiemian.com/article/15357108.html","summary":"11月20日，美股开盘后，AI硬件板块普遍走低，费城半导体指数跌3%，报9137.56点。","summary_short":"11月20日，美股开盘后，AI硬件板块普遍走低，费城半导体指数跌3%，报9137.56点。","digest":"11月20日，美股开盘后，AI硬件板块普遍走低，费城半导体指数跌3%…","points":["11月20日，美股开盘后，AI硬件板块普遍走低，费城半导体指数跌3%，报9137.56点","个股方面，AMD跌4.71%，闪迪跌4.81%，Arm跌4.85%，美光科技跌4.64%…","三倍做多半导体ETF（SOXL）跌9.21%"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T22:33:06+08:00","size":1,"keywords":[],"body":"11月20日，美股开盘后，AI硬件板块普遍走低，费城半导体指数跌3%，报9137.56点。个股方面，AMD跌4.71%，闪迪跌4.81%，Arm跌4.85%，美光科技跌4.64%，Lumentum跌5.35%，Coherent跌5.10%，台积电跌3.93%，西部数据跌4.35%，希捷科技跌4.29%，英伟达跌2.38%，博通跌1.86%，SK海力士跌2.63%。三倍做多半导体ETF（SOXL）跌9.21%。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccde90cd5ed","title":"探访前沿科创 欧洲媒体团感受成都具身智能与低空经济","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-20/news1075618.shtml","summary":"11月20日，由德国、瑞典、比利时、荷兰和罗马尼亚等国家和地区主流媒体记者、博主组成的参访团，走进成都人形机器人创新中心和四川沃飞长空企业，实地感受成都科创活力。","summary_short":"11月20日，由德国、瑞典、比利时、荷兰和罗马尼亚等国家和地区主流媒体记者、博主组成的参访团…","digest":"11月20日，由德国、瑞典、比利时、荷兰和罗马尼亚等国家和地区主流媒体记者…","points":["11月20日，由德国、瑞典、比利时、荷兰和罗马尼亚等国家和地区主流媒体记者…","在成都人形机器人创新中心，参访团系统参观通用人形机器人…","在沃飞长空，嘉宾沿展厅了解企业发展历程与各型飞行器模型…"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T22:33:05+08:00","size":1,"keywords":[],"body":"11月20日，由德国、瑞典、比利时、荷兰和罗马尼亚等国家和地区主流媒体记者、博主组成的参访团，走进成都人形机器人创新中心和四川沃飞长空企业，实地感受成都科创活力。 在成都人形机器人创新中心，参访团系统参观通用人形机器人、文商旅体机器人及工程应用型机器人等系列成果，现场观看机器人语音对话、居家机器人与机械臂操作，了解机器人元件、远程遥操作等核心技术。\n\n在沃飞长空，嘉宾沿展厅了解企业发展历程与各型飞行器模型，近距离察看AE200电动垂直起降飞行器(eVTOL)构型，并走进1：1座舱模型体验客舱布局与座椅设计，围绕倾转旋翼技术、低空出行及文旅、应急救援等应用场景展开交流。(记者 吕杨)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/7A5F3ABD02634B9892FEEA427C71185A.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ca7d26f49eb","title":"宁夏出台干线公路勘察设计指导书 贴合本地地质筑牢公路建设源头关口","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735583.shtml","summary":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉，《宁夏普通国省干线公路工可及勘察设计通用指导书(试行)》正式印发实施，为当地普通国省干线公路前期工作划定统一标尺…","summary_short":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉…","digest":"20日，记者从宁夏公路管理中心获悉…","points":["中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉…","宁夏公路管理中心相关负责人介绍，近年来宁夏国省干线路网持续完善，但在项目工可…","编制组梳理现行法规与行业规范，把多年一线实践经验转化为标准化指引"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:26:07+08:00","size":1,"keywords":[],"body":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉，《宁夏普通国省干线公路工可及勘察设计通用指导书(试行)》正式印发实施，为当地普通国省干线公路前期工作划定统一标尺，破解前期设计标准不一、深度不均、要点漏项等问题。\r\n\n　　宁夏公路管理中心相关负责人介绍，近年来宁夏国省干线路网持续完善，但在项目工可、勘察设计环节仍存在短板，不少成熟建设经验缺少系统总结、难以复用。编制组梳理现行法规与行业规范，把多年一线实践经验转化为标准化指引。\n\n　　指导书覆盖外业调查、地质勘察、内业设计、造价编制等关键环节，贯穿前期论证、勘察设计、审查报批、成果归档全流程，对两阶段设计里容易忽略的规范要求逐一提示，实现一册指引、全程参照。文件适用于新建、改扩建普通国省干线项目，农村公路、专用公路可参照执行。\n\n　　立足宁夏干旱多风沙、盐渍土分布广、黄土丘陵地形复杂的地域特点，指导书专门针对湿陷性黄土、风积沙、盐渍土等特殊岩土路段明确专项技术要求。文件明确安全至上、质量优先、绿色低碳、建养并重、永临结合、察地定基等设计思路，推动临时工程与永久工程统筹复用、建设和养护衔接，从源头把控公路工程质量、安全、环保与耐久性。\n\n　　据了解，指导书实施后将统一宁夏普通国省干线公路前期工作技术要点，规范勘察设计行为，助力项目提质控险，为宁夏干线公路高质量建设提供技术支撑。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c24c4bae2c0","title":"种下“懒庄稼” 富了“勤快人”——记“中国黄精之乡”十八年产业路","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735582.shtml","summary":"中新网重庆11月20日电 题：种下“懒庄稼” 富了“勤快人”——记“中国黄精之乡”十八年产业路  　　作者 罗永皓 杨林波  　　入冬，武陵山里的草木收了势头。","summary_short":"中新网重庆11月20日电 题：种下“懒庄稼” 富了“勤快人”——记“中国黄精之乡”十八年产业路  　　作者 罗永皓 杨林…","digest":"题：种下“懒庄稼” 富了“勤快人”——记“中国黄精之乡”十八年产业路  　　作者 罗…","points":["入冬，武陵山里的草木收了势头","近年来，当地将黄精作为优势特色产业重点培育，沿“种、产、加、销、研”逐环布局全产业链…","除草、修枝、施肥、控温……黄精“一次种植、多年采收”，在外人眼里是省心的“懒庄稼”"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:25:03+08:00","size":1,"keywords":[],"body":"中新网重庆11月20日电 题：种下“懒庄稼” 富了“勤快人”——记“中国黄精之乡”十八年产业路\n\n　　作者 罗永皓 杨林波\n\n　　入冬，武陵山里的草木收了势头。重庆市秀山土家族苗族自治县梅江镇却是另一番景象：大棚里，黄精叶色仍绿，茎秆蹿至齐腰，一株紧挨一株，一直排到棚那头。\n\n　　黄精俗称“老虎姜”，属药食同源的中药材。在秀山县中药材产业中心副主任杨美森看来，种好这一山间小草，可“一举两得”——不伤生态，百姓也能长期稳定增收。\n\n　　秀山，是中国林学会认定的“中国黄精之乡”之一。近年来，当地将黄精作为优势特色产业重点培育，沿“种、产、加、销、研”逐环布局全产业链，推动这一野生资源向百亿级富民支柱产业转型。\n\n　　路子虽好，走起来却并不轻松。\n\n图为大棚里的黄精。杨林波 摄\n\n　　“草比苗高”的日子\n\n　　除草、修枝、施肥、控温……黄精“一次种植、多年采收”，在外人眼里是省心的“懒庄稼”。种植大户张宇却一天也不敢松劲。九年多下来，他把这些活计归结成一句：慢工出细活。\n\n　　秀山黄精的产业发展之路，最早可追溯至2008年。彼时，当地企业率先探索黄精“野生改家种”。只是早期块茎栽种的传统模式，导致产量长期难以提升。\n\n　　张宇边种边学，也没少“踩坑”。\n\n　　2018年，张宇在秀山县雅江镇流转328亩土地。他盘算着，每亩栽2500株黄精，只需亩产5000斤，就是一场好收成。可现实偏偏没照他心中的账本走。\n\n　　“草比苗还高！”张宇苦笑回忆，彼时，当地黄精品种混杂，田间管理又缺经验，问题一层压一层。到2023年底采挖，亩产只有1000余斤，账上亏了200余万元。\n\n　　杨美森坦言，过去，当地黄精产业多是粗放发展，瓶颈卡在品种和技术上。为此，当地选择“借智破局”。\n\n　　2020年，秀山与浙江农林大学科研团队签订黄精产业链研究技术合作协议，确立核心特色品种；\n\n　　同年，当地攻克“一年成苗”技术，将原先两年的育苗周期大幅压缩；\n\n　　2024年，秀山联合浙江农林大学、重庆中医药学院共建“秀山黄精共富学院”……\n\n　　这些年，张宇跟着专家反复试验，摸索出“坡地起箱、遮阴管护、生态防控”的标准化种法。同时，当地编制发布《秀山黄精地方标准》及系列配套技术规程，将全流程技术培训铺到田间。\n\n图为秀山高标准黄精种植示范基地。杨林波 摄\n\n　　从“种不起”到“不愁卖”\n\n　　“三到五年才能采收，头几年几乎全是投入。”黄精种植周期长，导致一般农户“种不起”。杨美森说，为了突破这道阻碍产业发展的“坎”，当地出台了专项政策。\n\n　　连片种植，每亩补贴2300元，补贴门槛从最初的50亩降到5亩，种植保险、贷款贴息等同步配套……截至目前，当地已累计撬动银行贷款2亿余元，用于支持农户规模化种植黄精。\n\n　　黄精种出来，销路却又横在种植户面前，成了道新“坎”。杨美森说，农户大多只能卖鲜黄精，价格随行就市，一年一个行情。“种得出、卖不好”，卡住了产业发展的下一步。\n\n　　近年来，秀山借鲁渝协作“东风”，投入1800余万元建设黄精精深加工产业园，并于2025年引进重庆市九华府农业有限公司入驻。自此，当地黄精产业链，等来了挑大梁的“龙头”。\n\n　　“很多黄精还在地里，订单就已经敲定。”张宇说，“龙头”企业按每斤10元的保底价格，敞开大门收黄精，将订单签在田间地头，让种植户心里有了底。\n\n　　据重庆市九华府农业有限公司总经理郑国雄介绍，该企业日均可初加工黄精60吨至80吨，全年原料需求量约2万吨，远超当地产量。缺口则主要靠收储云南、贵州、四川等周边地区的黄精原料进行填补。\n\n　　说话间，车间里的自动化生产线高速运转。从田间采收的黄精，在这里走完清洗、杀青以及九蒸九制的工序，变成黄精蜜饯、黄精茶、黄精面等产品，一箱箱发往全国各地。\n\n图为工人在生产车间修剪黄精。胡程 摄\n\n　　勤快的人，有了奔头\n\n　　目前，秀山已培育精深加工企业8家、初加工厂15家、专业合作社26家，并围绕黄精开发100余种大健康产品。2026年，当地黄精综合产值预计突破20亿元。此外，当地打造区域公共品牌“秀源·轻山”，2025年带动黄精产品出口约900万元。\n\n　　产业链条长了，黄精地里的人也越来越多。\n\n　　参与、见证当地黄精攻克“一年成苗”技术后，重庆市木特农业有限公司负责人孙亦军经营起近70亩育苗基地，“今年赶上好行情，苗还没出圃，就已经被预订一空”。\n\n　　来自辽宁沈阳的新农人郑钢，将黄精种在了油茶林下，填补油茶挂果前几年的收成“空档”。这一经验很快被周边农户争相学习。一时间，“油茶＋黄精”“黄精＋玉米”等套种模式在秀山铺开。\n\n　　2025年5月，在重庆市九华府农业有限公司的牵线下，张宇赴云南考察学习。一趟走下来，他对黄精种植精细化、标准化体会更深。\n\n　　同年8月，他在秀山县梅江镇打造120亩高标准黄精种植示范基地，配套“滴灌+喷灌”一体化水肥系统。该基地每亩定植6000至6400株，亩产保底可达15000斤。\n\n　　他还牵头成立秀山土家族苗族自治县黄精专业协会，将52家会员单位聚在一起，抱团闯市场。秀山县钟灵镇种植户付仲春流转100余亩土地，也跟着走上规模化种植的路。\n\n　　如今，秀山黄精入选全国名特优新农产品，获评全国道地中药材“一县一品”。种植面积达5.2万亩，覆盖27个乡镇、150个村居，带动1万多户农户参与。通过“公司+合作社+农户”模式，农户三年采收期的亩均效益超10万元。\n\n　　这些数字不是终点。杨美森说，未来五年，当地将继续扩规模、强链条、树品牌，打造10万亩种植基地、培育10亿级龙头企业，让秀山黄精走出武陵山，卖向全国。\n\n　　蹲在垄边，张宇伸手将新冒的草连根抠出。眼前的土地，他隔三岔五就要来一趟，走到哪蹲到哪。他告诉中新网，技术和标准管得住苗，却管不住草，“人能做的，就是比草更勤快。”(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc1d7736ed7","title":"傳中證監收緊紅籌上市 2023年新規後成立公司須遷冊內地方可境外上市","url":"https://www.stheadline.com/realtime-finance/3639433/傳中證監收緊紅籌上市-2023年新規後成立公司須遷冊內地方可境外上市","summary":"紅籌公司來港上市途徑或將「落閘」。","summary_short":"紅籌公司來港上市途徑或將「落閘」。","digest":"紅籌公司來港上市途徑或將「落閘」","points":["紅籌公司來港上市途徑或將「落閘」","外電引述消息報道，中證監將不再批准2023年新規生效後成立的紅籌架構公司，在內地以外地區上市","有分析料，此舉將會加強防止資金外流，並對香港新股市場構成打擊"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:09:03+08:00","size":1,"keywords":[],"body":"紅籌公司來港上市途徑或將「落閘」。外電引述消息報道，中證監將不再批准2023年新規生效後成立的紅籌架構公司，在內地以外地區上市。有分析料，此舉將會加強防止資金外流，並對香港新股市場構成打擊。\n2023年3月境外上市新規後成立紅籌須遷冊內地\n路透引述消息報道，中證監已告知一些律師事務所，2023年3月境外上市新規實施後成立的紅籌公司，必須先將註冊地遷回內地，才能赴境外上市。\n今年僅6家紅籌在港上市\n報道還指，紅籌公司上市的數量下降可能會對香港造成打擊，去年在131家在香港上市的內地公司當中，有五分之一涉及境外持股，並且大部分是採用紅籌架構。今年以來內地亦僅批准6家紅籌公司在香港上市，數量較去年50家大減。\n監管或較3月限制進一步加強\n若消息屬實，內地對紅籌公司的上市限制將較3月時進一步加強。當時有傳聞指，內地監管部門建議擬上市企業應拆除紅籌架構後，才能赴境外上市，否則須解釋及證明採用紅籌的必要性。當時中證監公開回應稱，要求部分紅籌公司拆除架構，主要是針對部分企業有股權透明度低、合規風險較高等硬傷，屬正常的監管要求，應予以正確解讀，並強調將繼續支持公司依法合規赴香港等境外市場上市。\n紅籌公司是指在境外註冊，但主要業務和資產在內地的公司，這種架構最受中國初創企業，尤其是科技企業的青睞。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c290ff24ff9","title":"产业观察：一座山区小县城，何以“无所不锯”？","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735522.shtml","summary":"中新网丽水11月20日电(傅飞扬)“这次展会，我们带来了高速切铝机、高速圆盘锯、高速带锯床等产品，其中多款锯床以进口设备三分之一的价格、90%以上的效率实现了国产替代。","summary_short":"中新网丽水11月20日电(傅飞扬)“这次展会，我们带来了高速切铝机、高速圆盘锯、高速带锯床等产品…","digest":"“这次展会，我们带来了高速切铝机、高速圆盘锯、高速带锯床等产品…","points":["中新网丽水11月20日电(傅飞扬)“这次展会，我们带来了高速切铝机、高速圆盘锯…","”11月20日，在浙江省丽水市缙云县，浙江晨龙控股股份有限公司营销副总吕易晏接受中新网采访时…","当日，以“机汇天下·缙创未来”为主题的2026中国(缙云)国际机床工具展览会(JME)在缙云…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:42:03+08:00","size":1,"keywords":[],"body":"中新网丽水11月20日电(傅飞扬)“这次展会，我们带来了高速切铝机、高速圆盘锯、高速带锯床等产品，其中多款锯床以进口设备三分之一的价格、90%以上的效率实现了国产替代。”11月20日，在浙江省丽水市缙云县，浙江晨龙控股股份有限公司营销副总吕易晏接受中新网采访时说。\n\n　　当日，以“机汇天下·缙创未来”为主题的2026中国(缙云)国际机床工具展览会(JME)在缙云开幕，这座以“中国锯床之都”闻名的工业小城，再次成为全球机床工具产业的焦点。\n\n11月20日，观众了解锯床产品。傅飞扬 摄\n\n　　龙头企业云集，释放产业引力\n\n　　锯切机床是用圆锯片、锯带或弓锯条切断金属棒料、管料、型材的机床，常见类型有圆锯床、带锯床和弓锯床。地处浙西南山区的缙云是全国最大的锯床装备研发及生产基地，该县锯床和锯片占国内市场份额分别超71%、90%。\n\n　　“得益于缙云壶镇的产业优势，一台锯床设备2000多个零部件，在本地半小时内就能找到对应的供应商。”浙江特斯克工业科技有限公司总经理唐晓敏介绍。\n\n　　本届展会吸引202家企业同台竞技，展厅“一位难求”，印证了缙云机床产业的强大吸引力——德国威库司、伦特根，日本松下、THK、欧姆龙等5家国际企业携创新技术亮相；泰嘉、鼎熔岩、欧科亿、锯力煌、晨龙控股、特斯克、畅尔智能等龙头骨干企业展示高精度智能化产品，为产业集群注入新动能。\n\n　　现场，日企欧姆龙集团带来的传感器、伺服电机、安全光栅等机床产业零部件吸引了许多专业观众的目光。该企业相关代理商张正方说，此次参展以品牌展示和客户对接为主，后续将转化为订单。\n\n　　展会集中呈现智能数控锯切、工业机器人、激光切割与焊接等全产业链创新成果，服务航空航天、新能源汽车、精密模具等高端制造需求，展现缙云机床工具行业从“规模扩张”向“质量跃升”的转型成果。\n\n　　现场交易火爆，商贸实效显著\n\n　　前两届展会累计意向订单达3.9亿元。本届展会延续“现场交易火爆”态势，重点组织专业观众参加。展会期间，晨龙控股推进与日本、波兰、印度客户洽谈对接；锯力煌邀约欧洲、东南亚、中东客商赴壶镇验机，重点洽谈智能下料产线、定制机型……\n\n　　“我们的产品从设计之初就对标欧盟安全与制造标准，尺寸适配集装箱运输需求。”唐晓敏表示，目前企业出口业务占比达70%，产品已销往俄罗斯、意大利、法国、美国等国家，“智能化、无人化方案，正帮助国产装备在海外取得更多机会。”\n\n　　现场，观众可观摩智能下料单元、智能锯切系列等高端智能装备。展会还设置“缙造好品·智享生活”工业展销特色主题馆，同步举办美食节及景区免费游等配套活动；“无所不锯”技能服务团以技赋能，现场为客商答疑释惑、登记供需意向，当好产业链上的“连接器”；“壶镇镇wuhu乡村文旅策划运营团”成员通过线上直播形式，生动展示各类参展产品，以云端视角拓宽展会传播渠道……\n\n　　多元活动赋能，创新活力涌动\n\n　　本届展会国家级会议和全国竞赛集中落地——展会同期举办锯刨床分会标准化工作会议、锯床分会2026年全体会员大会、首届锻压行业绿色低碳发展专家研讨会，以及第七届全国电子信息服务业职业技能竞赛(物联网安装调试员赛项)、缙云2026年氢能产业创新创业大赛等。\n\n　　此外，缙云装备智造生态大会、人才科技沙龙等活动也同期举行。其中，缙云装备智造生态大会聚焦“人工智能+机械装备”，展示真实AI落地方案，推动创新链、产业链、资金链、人才链深度融合。\n\n11月20日，锯床设备进行切割作业。傅飞扬 摄\n\n　　“目前，我们的物联网体系已搭建完毕，AI模块预计明年年初上线，届时用户语音输入即可下达切割尺寸等指令，机器自动识别完成加工，不需要人工反复调试参数。”唐晓敏说。\n\n　　2026中国(缙云)国际机床工具展览会将持续至11月22日，这不仅是一场技术展示的盛会，更是全球工业精英共赴“机”遇的舞台。在缙云，创新与商贸交织，传统与未来碰撞，共同书写中国机床工具产业的新篇章。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1b1ff2f9d8","title":"人生自此入桃源——博元·桃花源启约6000㎡全明生活会馆璀璨绽放，理想生活美好兑现","url":"https://www.jiemian.com/article/15356811.html","summary":"十一月的暖阳，为大地镀上一层温柔的金色。","summary_short":"十一月的暖阳，为大地镀上一层温柔的金色。","digest":"十一月的暖阳，为大地镀上一层温柔的金色","points":["十一月的暖阳，为大地镀上一层温柔的金色","清晨第一缕阳光照进博元·桃花源启约6000㎡全明生活会馆，也照亮了桃源理想生活的真实模样","所谓“全明”，不只是空间采光通透、让阳光自然抵达每一个功能区域…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T20:41:19+08:00","size":1,"keywords":[],"body":"十一月的暖阳，为大地镀上一层温柔的金色。清晨第一缕阳光照进博元·桃花源启约6000㎡全明生活会馆，也照亮了桃源理想生活的真实模样。所谓“全明”，不只是空间采光通透、让阳光自然抵达每一个功能区域，更是让会馆里的每一种生活都被看见、被照顾、被温暖点亮：老人的安稳、孩子的欢笑、邻里的相聚、家人的陪伴，都能在这一方全明空间里找到妥帖的位置。\n\n实拍图\r\n\n从图纸到实景，从承诺到日常，博元·桃花源启全明生活会馆盛情绽放，这不仅是一座会馆的开放，更是一次桃源理想生活的逐步兑现，是无数美好承诺照进现实的开始。从清晨的第一缕暖意，到全明会馆的温暖如春，再到业主食堂的温情一餐，每一处细节，都是桃花源启对“理想生活”的真诚表达。\n\n实拍图\r\n\n楼下就有热乎饭，日子有了踏实感\n\n业主食堂——是最让人心头一暖的地方。宽敞明亮的用餐空间、精心设计的营养菜谱、其乐融融的用餐氛围，让“吃饭”这件日常小事，升华为邻里相聚的温情时光。热气腾腾的菜肴、熟悉的家常味道，让不少家人感慨：“以后下了楼就能吃上热乎饭，这就是我想要的桃源生活。”\n\n实拍图\r\n\n与食堂的一日三餐相映成趣的，是私宴厅的专属尊崇。宴请挚友、寿宴家聚、商务小酌，皆可在此从容展开——私密雅致、气度从容、不失温度。\n\n实拍图\r\n\n食堂是日常的温暖，私宴厅是重要时刻的郑重；理想桃源，把业主生活的每一面，都安排得妥帖周到。\n\n一杯咖啡的时间，把日子过慢一点\n\n会馆里的咖啡吧，是另一种生活节奏：一杯手冲的醇香，一段慵懒的午后，邻里间的闲谈从此有了去处。会馆二楼阳光充盈的书吧，则以静谧雅致的氛围，为爱书之人辟出一方精神领地——孩子在此养成阅读习惯，长者在此安享书页时光，一杯咖啡、一册好书，便是桃源午后最惬意的模样。\n\n实拍图\r\n\n咖香与书香在此交融，快与慢在同一空间里各得其所。生活的诗意，不必远行寻觅，下楼即是。\n\n实拍图\r\n\n流点汗，再深呼吸，一天的疲惫就散了\n\n健身房与瑜伽室，构成会馆里最富生命力的场域。清晨的健身房里，专业器材一应俱全，挥汗如雨间唤醒一天的元气；傍晚的瑜伽室中，灯光柔和、空间舒展，一呼一吸间卸下疲惫、安顿身心。动以强健体魄，静以修养心性，无论您偏爱酣畅的锻炼，还是沉静的冥想，都能在这里找到属于自己的健康节律。\n\n实拍图\r\n\n身心皆有归处，理想生活从来不止于居住，更在于日常的丰盈与自律的从容。\n\n大人的欢聚、孩子的笑声，都在这里了\n\n亲友放歌、观影同乐，高品质的影音设备让每一场欢聚都酣畅淋漓。而专为还在打造的儿童乐园，则以安全、趣味、寓教于乐的设计，成为孩子们最流连的天地，滑梯与欢笑齐飞，成长与陪伴同在。崭新的阶梯教室，更为社区课堂、亲子活动、文化讲座提供了理想的承载空间，让学习与分享成为桃源的日常风景。\n\n实拍图\r\n\n孩子们的笑声在这里生根，长者的智慧在这里传递，一家人的欢聚在这里延续。全龄共享、其乐融融，正是桃源生活最动人的图景。\n\n实拍图\r\n\n闲来对弈，长者有了自己的会客厅\n\n会馆里的棋牌区，是桃源生活里颇具松弛感的一处所在。棋牌区与桃源市集相连，形成一个大尺度的公共活动空间，既是长者日常休闲、对弈品茗的社交主场，也是邻里相遇、闲话家常的温暖场域。在这里，老友围坐、棋牌会友，市集采买与休闲娱乐自然衔接，晚年生活不再只是“有地方去”，更是“有陪伴、有热闹、有滋味”的幸福日常。\n\n实拍图\r\n\n适老化细节里，藏着全龄友好的温度\n\n真正理想的生活，不只在于空间尺度与功能配置，更在于那些容易被忽略的细节是否被提前想到。桃花源启在全明生活会馆中，为全龄人群定制了诸多的人性化设计。会馆餐厅的餐桌下专设挂物活动挂钩，同时餐厅配置了两类适老化座椅：一类于扶手设置拐杖卡位，便于长者随手安放拐杖；一类于坐垫设置助力结构，辅助长者从容起坐。餐厅同步配置宝宝餐椅，让带娃家庭用餐更安心。\n\n实拍图\r\n\n会馆内还专门设置第三卫生间，回应父亲携女儿、母亲携儿子，以及陪同轮椅长者如厕照护等现实场景。第三卫生间内，专设婴儿放置床；大人、儿童的专用马桶、洗手池；便池、洗手池下方均作防滑处理，马桶旁设置助力把手，便于行动不便的长者起坐；同时设置化妆整理区域，兼顾日常整理与体面需求。\n\n实拍图\r\n\n从一把座椅、一个扶手，到一间第三卫生间，桃花源启以细节回应全龄家人的真实需求，让人性化不止于理念，而成为日常可感的妥帖与尊重。\n\n实景兑现，“公园里的家”同样是承诺的答卷\n\n如果说会馆是桃源生活的“内场”，那么公园便是桃源生活的“外延”。公园内景观步道、生态草坪、休闲空间、羽毛球场、篮球场、乒乓球场、社区菜园、儿童乐园、宠物乐园等全维配套均已实景呈现，让“会馆+公园”的生活图景完整落地，也让“承诺兑现”四个字有了更完整的注脚。\n\n实拍图\r\n\n步入公园，林木成荫，草坪铺展，步移景异，四季有景！不必远赴郊野，下楼即入画境。蜿蜒其间的园中步道，是清晨慢跑与傍晚散步的日常路线，两旁是舒展的绿意，一圈走下来，身心俱松。社区菜园更为公园生活添上一缕田园意趣：一方方菜畦规整铺展，既可亲子认领、体验播种与收获，也让长者在翻土浇水间重拾田园记忆，更是一处自然课堂与邻里共治的生活场域。散落在园中的休闲空间，则为邻里闲谈、长者对弈、亲子小憩提供了自在的停留之处。把家安在公园里，便是桃源里最朴素的理想生活。\n\n承诺过的美好，正一件件变为日常\n\n桃花源启全明生活会馆的开放，是桃源理想生活版图上浓墨重彩的一笔，更是“桃源理想生活逐步兑现”的有力见证。从建筑到空间，从功能到情感，桃花源启始终以长期主义的匠心，将图纸上的承诺一寸寸变为可触可感的生活日常。\n\n实拍图\r\n\n会馆之内有烟火与欢聚，会馆之外有绿意与舒展，内外相合，才是桃花源启所承诺的理想生活。公园实景的呈现，与会馆开放互为印证：博元为西安造一方桃花源，靠的不是一句口号，而是把配套做实、把生活兑现。\n\n实拍图\r\n\n博元16载，把“让更多的人幸福快乐”写进桃源日常\n\n博元品牌深耕16载，桃花源启是博元来到西安的首发作品。自进入西安之日起，博元便带着对理想生活的敬畏与诚意，将16载营造经验、对城市生活的理解以及对业主家人真实需求的洞察，落于桃花源启的一砖一瓦、一草一木之中。项目营造的初心，不止于建造一处居所，更在于为西安营造一方安放日常、安顿身心的桃花源；不止于兑现一张图纸，更在于以长期主义的匠心，将会馆、公园及产品等细节配套逐一做实，让“理想生活”成为可触可感的日常。\n\n实拍图\r\n\n实拍图\r\n\n从全明生活会馆的全龄友好，到公园实景的完整呈现，再到适老化、儿童友好等细节的前置考量，桃花源启以革新的空间营造与用心的生活服务，让品牌温度藏于每一个日常片段，也让“让更多的人幸福快乐”的品牌理念，在桃源生活中被一次次看见、一次次感受。\n\n效果图\r\n\n桃源启幕，美好启程。这处承载着无数向往的理想桃源，正以温度与诚意，静待每一位向往幸福生活的家人，回家！\n\n来源：推广\n\n本文为转载内容，授权事宜请联系原著作权人。资讯\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n人生自此入桃源——博元·桃花源启约6000㎡全明生活会馆璀璨绽放，理想生活美好兑现\n\n让阳光自然抵达每一个功能区域，更是让会馆里的每一种生活都被看见。\n\n界面陕西 · 2026/11/20 20:41\n\n十一月的暖阳，为大地镀上一层温柔的金色。清晨第一缕阳光照进博元·桃花源启约6000㎡全明生活会馆，也照亮了桃源理想生活的真实模样。所谓“全明”，不只是空间采光通透、让阳光自然抵达每一个功能区域，更是让会馆里的每一种生活都被看见、被照顾、被温暖点亮：老人的安稳、孩子的欢笑、邻里的相聚、家人的陪伴，都能在这一方全明空间里找到妥帖的位置。\n\n实拍图\r\n\n从图纸到实景，从承诺到日常，博元·桃花源启全明生活会馆盛情绽放，这不仅是一座会馆的开放，更是一次桃源理想生活的逐步兑现，是无数美好承诺照进现 里，便是桃源里最朴素的理想生活。\n\n承诺过的美好，正一件件变为日常\n\n桃花源启全明生活会馆的开放，是桃源理想生活版图上浓墨重彩的一笔，更是“桃源理想生活逐步兑现”的有力见证。从建筑到空间，从功能到情感，桃花源启始终以长期主义的匠心，将图纸上的承诺一寸寸变为可触可感的生活日常。\n\n实拍图\r\n\n会馆之内有烟火与欢聚，会馆之外有绿意与舒展，内外相合，才是桃花源启所承诺的理想生活。公园实景的呈现，与会馆开放互为印证：博元为西安造一方桃花源，靠的不是一句口号，而是把配套做实、把生活兑现。\n\n实拍图\r\n\n博元16载，把“让更多的人幸福快乐”写进桃源日常\n\n博元品牌深耕16载，桃花源启是博元来到西安的首发作品。自进入西安之日起，博元便带着对理想生活的敬畏与诚意，将16载营造经验、对城市生活的理解以及对业主家人真实需求的洞察，落于桃花源启的一砖一瓦、一草一木之中。项目营造的初心，不止于建造一处居所，更在于为西安营造一方安放日常、安顿身心的桃花源；不止于兑现一张图纸，更在于以长期主义的匠心，将会馆、公园及产品等细节配套逐一做实，让“理想生活”成为可触可感的日常。\n\n实拍图\r\n\n实拍图\r\n\n从全明生活会馆的全龄友好，到公园实景的完整呈现，再到适老化、儿童友好等细节的前置考量，桃花源启以革新的空间营造与用心的生活服务，让品牌温度藏于每一个日常片段，也让“让更多的人幸福快乐”的品牌理念，在桃源生活中被一次次看见、一次次感受。\n\n效果图\r\n\n桃源启幕，美好启程。这处承载着无数向往的理想桃源，正以温度与诚意，静待每一位向往幸福生活的家人，回家！\n\n来源：推广\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ceed92e0f31","title":"法国上调禽流感风险级别至最高级","url":"https://www.jiemian.com/article/15356936.html","summary":"法国农业、农食和粮食主权部11月19日宣布，自20日起将法国本土范围内高致病性禽流感动物疫情风险级别由“中级”上调为最高的“高级”，以应对近期欧洲野生鸟类禽流感疫情。","summary_short":"法国农业、农食和粮食主权部11月19日宣布，自20日起将法国本土范围内高致病性禽流感动物疫情风险级别由“中级”上调为最高…","digest":"法国农业、农食和粮食主权部11月19日宣布…","points":["法国农业、农食和粮食主权部11月19日宣布，自20日起将法国本土范围内高致病性禽流感动物疫情…","法国政府说，近期多个邻国的野生鸟类中高致病性禽流感病例增加，病毒可能沿候鸟迁徙通道传播","法国境内野生动物中已出现确诊病例，法国本土家庭式禽类饲养场也已出现疫情"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T20:40:36+08:00","size":1,"keywords":[],"body":"法国农业、农食和粮食主权部11月19日宣布，自20日起将法国本土范围内高致病性禽流感动物疫情风险级别由“中级”上调为最高的“高级”，以应对近期欧洲野生鸟类禽流感疫情。\n\n法国政府说，近期多个邻国的野生鸟类中高致病性禽流感病例增加，病毒可能沿候鸟迁徙通道传播。法国境内野生动物中已出现确诊病例，法国本土家庭式禽类饲养场也已出现疫情。鉴于上述情况，法国政府决定提升高致病性禽流感风险级别。（新华社）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c519f25e7a0","title":"广西柳州一饭店88元红烧“小鸡”竟是候鸟，官方通报：相关涉案人员、餐饮店被查处","url":"https://www.jiemian.com/article/15356929.html","summary":"11月20日，广西柳州市林业和园林局针对“饭店88元红烧‘小鸡’竟是候鸟，有村民直言‘留着鸟干嘛’”发布情况通报：  2026年10月，接到关于我市融水…","summary_short":"11月20日，广西柳州市林业和园林局针对“饭店88元红烧‘小鸡’竟是候鸟…","digest":"11月20日，广西柳州市林业和园林局针对“饭店88元红烧‘小鸡’竟是候鸟…","points":["11月20日，广西柳州市林业和园林局针对“饭店88元红烧‘小鸡’竟是候鸟…","2026年10月，接到关于我市融水、三江两县出现涉非法猎捕贩卖野生鸟类的举报线索后…","截至目前，共立案33起，抓捕涉案人员35人，查获捕鸟网705张、诱鸟器等作案工具80件"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T20:38:00+08:00","size":1,"keywords":[],"body":"11月20日，广西柳州市林业和园林局针对“饭店88元红烧‘小鸡’竟是候鸟，有村民直言‘留着鸟干嘛’”发布情况通报：\n\n2026年10月，接到关于我市融水、三江两县出现涉非法猎捕贩卖野生鸟类的举报线索后，柳州市林业和园林局会同公安机关，对涉事区域实行全域拉网清查，对相关违法犯罪行为实施严厉打击。截至目前，共立案33起，抓捕涉案人员35人，查获捕鸟网705张、诱鸟器等作案工具80件。相关媒体曝光的涉案人员、餐饮店均已被查处。\n\n为全面提升群众爱鸟护鸟意识，我局将不断完善工作机制，深化“林长＋警长”合作，强化部门协作，加强市场监管，鼓励公众举报违法犯罪线索，坚决纠正捕鸟、斗鸟、食鸟陋习，严厉打击并公开曝光各类破坏野生动植物资源的违法犯罪行为，持续凝聚全社会共同保护野生动植物的强大合力，守护好我市生态资源。\n\n诚恳欢迎社会各界、广大群众持续当好野生动植物保护的宣传员、监督员，如发现乱捕滥猎、非法买卖、滥食野生动物等违法线索，请拨打110或0772－2828574、0772－2836820进行举报。经查证属实的有效线索，举报人可获得200元至2000元奖励。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb281717fb4","title":"足球世界杯效应持续 10月中国销售彩票同比增长19.4%","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735516.shtml","summary":"中新社北京11月20日电 (记者 赵建华)中国财政部20日公布，今年10月，全国共销售彩票559.82亿元(人民币，下同)，同比增长19.4%。","summary_short":"中新社北京11月20日电 (记者 赵建华)中国财政部20日公布，今年10月，全国共销售彩票559.82亿元(人民币…","digest":"中国财政部20日公布，今年10月，全国共销售彩票559.82亿元(人民币，下同)…","points":["中新社北京11月20日电 (记者 赵建华)中国财政部20日公布，今年10月…","其中，福利彩票机构销售136.36亿元，同比下降9.1%","体育彩票机构销售423.46亿元，同比增长32.8%"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:36:53+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 (记者 赵建华)中国财政部20日公布，今年10月，全国共销售彩票559.82亿元(人民币，下同)，同比增长19.4%。其中，福利彩票机构销售136.36亿元，同比下降9.1%；体育彩票机构销售423.46亿元，同比增长32.8%。\n\n　　财政部解释，10月录得上述增幅，主要是足球世界杯后竞猜型彩票销量持续保持高位。当月，全国竞猜型彩票销售录得320.85亿元，占彩票销售总量的57.3%，同比增长51.8%。\n\n7月20日，球迷在上海市静安区陕康里观看比赛。当地时间7月19日，在美国纽约新泽西体育场进行的2026美加墨世界杯足球赛决赛中，西班牙队1比0战胜阿根廷队，获得冠军。　中新社记者 殷立勤 摄\n\n　　10月份，与上年同期相比，全国31个省份彩票销量均实现正增长。其中，河南、山东、江苏、安徽增加额较多。\n\n　　1-10月累计，全国共销售彩票6018.02亿元，同比增长15.1%。其中，福利彩票机构销售1617.35亿元，同比下降7.5%；体育彩票机构销售4400.67亿元，同比增长26.4%。\n\n　　1-10月累计，与上年同期相比，全国31个省份彩票销量均实现正增长。其中，山东、河南、广东、浙江增加额较多。\n\n　　财政部要求各级彩票机构，密切跟踪分析新情况新问题，加强彩票发行销售工作，确保市场平稳运行；各级财政部门加强彩票监管，创造良好的外部环境，维护市场秩序，促进彩票事业持续健康发展。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c355caf431c","title":"从合规披露迈向治理深耕 长三角国企探ESG“解题之道”","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735515.shtml","summary":"中新网杭州11月20日电(童静宜 蓝伊旎)11月20日，新质时代ESG实践与传播高峰对话在浙江杭州举办，其间发布了《长三角国有企业ESG信息披露研究报告》(下称“报告”)。","summary_short":"中新网杭州11月20日电(童静宜 蓝伊旎)11月20日，新质时代ESG实践与传播高峰对话在浙江杭州举办…","digest":"11月20日，新质时代ESG实践与传播高峰对话在浙江杭州举办…","points":["中新网杭州11月20日电(童静宜 蓝伊旎)11月20日…","报告显示，长三角国有企业ESG信息披露实践正在从“合规披露”走向“治理嵌入”…","数据显示，2025年上海上市公司独立发布ESG相关报告的比例为61.2%…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:36:51+08:00","size":1,"keywords":[],"body":"中新网杭州11月20日电(童静宜 蓝伊旎)11月20日，新质时代ESG实践与传播高峰对话在浙江杭州举办，其间发布了《长三角国有企业ESG信息披露研究报告》(下称“报告”)。\n\n　　报告显示，长三角国有企业ESG信息披露实践正在从“合规披露”走向“治理嵌入”，从“报告文本”走向“数据链条”，从“有没有写”走向“可不可信、可不可追、可不可用”。\n\n　　“对国企而言，ESG不是营销工具，而是把经济责任、政治责任、社会责任翻译成可量化、可审计、可比较的治理语言。”活动上，杭钢集团副总经理孙宏表示。\n\n《长三角国有企业ESG信息披露研究报告》发布。　孙杨洋 摄\n\n　　从实践看，长三角国企推进ESG的整体图景，并非一条整齐的“进度条”，而是因地制宜探索出多条各具特色的实践路径。\n\n　　报告认为，上海呈现出“上市国企+涉外企业双线”的高基线模式。数据显示，2025年上海上市公司独立发布ESG相关报告的比例为61.2%，其中上市国有企业披露率达到94.9%，上市非国有企业为48.8%。浙江探索出了“省属引领+地市试点”的梯度推进模式。以115家国企为样本的研究显示，浙江省属企业ESG信息披露规模居前，宁波市属企业表现突出。该省还以团体标准为编制框架，为市属和中小国企提供了可操作的规范支撑。\n\n　　报告还提到，江苏呈现“省属穿透+价值核算”的强组织模式，该省发布的ESG价值核算报告，尝试把无形的ESG表现转化为可衡量的发展价值；安徽走出了“蓝皮书驱动+考核内嵌”的成长积累路径，安徽省国资委连续编制发布社会责任(ESG)蓝皮书，2025版案例篇收录多个省属企业案例，呈现服务地方发展、科技创新引领等实践。\n\n　　除此之外，各地国企在ESG信息披露中的叙事重心也有所不同，如上海更关注治理现代化、气候风险和供应链，浙江则更突出乡村振兴、山海协作和民生服务。\n\n　　为何同处长三角，各地却走出不一样的发展路径？\n\n　　报告认为，这与多个因素密切相关。上市平台越集中的地区，市场规则对ESG信息披露的托底作用越明显；出资人监管抓手越明确的地区，披露工作的组织性、主动性越强；同时各地国企结合自身承担的发展使命，在披露内容上也各有侧重。\n\n　　从制度底座看，ESG信息披露不是单纯的市场行为，而是出资人监管、资本市场规则与公共政策使命共同作用的结果。随着国内相关规则体系不断完善，国企披露ESG信息的实践早已超出了合规范畴，成为国企履行经济、政治、社会责任的制度化表达。\n\n　　与此同时，人工智能浪潮也正在重塑ESG理念落地、传播方式。报告认为，AI能帮助企业“算得更准、写得更快”，但只能作为辅助工具，不能替代企业主体责任、人工校验和第三方鉴证。\n\n　　报告指出，下一阶段的“胜负手”不在“是否披露”，而在“披露能否进入投资、采购、风控与考核闭环”，以及AI的使用能否被有效治理。此外，监管审查方式也正从“看报告文本”转向“查数据链条”，“可核验”正在成为对国企ESG信息披露的新硬约束。\n\n　　对此，报告建议，要以统一口径夯实数据底座，以第三方鉴证提升披露可信度，以考核和董事会机制推动治理嵌入，以区域互认降低跨省核算成本，以“披露—评价—融资—治理”闭环让ESG真正进入企业管理。\n\n　　据悉，此次活动由中新社国际传播集团、中国投资协会、浙江工商大学、浙商总会指导，中新社国际传播集团浙江分公司、浙商总会新媒体专业委员会、中国投资协会高新技术投资专业委员会主办，江苏银行杭州分行、浙江工商大学战略企业家学院承办，浙江省青年企业家协会、浙江省科技型企业家联合会、微链协办。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c54c8e5e7c4","title":"专家解读：如何成长为A级纳税人？","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735512.shtml","summary":"中新网北京11月20日电 (记者 赵建华)A级纳税人是纳税缴费信用的最高级别，获评A级不仅可享受税务部门发票额度、办税绿色通道等多项守信激励，还能在市场竞争、融资授信、项目招投标等领域获得优势。","summary_short":"中新网北京11月20日电 (记者 赵建华)A级纳税人是纳税缴费信用的最高级别，获评A级不仅可享受税务部门发票额度…","digest":"A级纳税人是纳税缴费信用的最高级别，获评A级不仅可享受税务部门发票额度…","points":["中新网北京11月20日电 (记者 赵建华)A级纳税人是纳税缴费信用的最高级别…","围绕A级纳税人评定的常见认知误区以及日常经营的合规要点…","孙秀玲介绍，纳税缴费信用级别的评定，主要依据2025年7月实施的《纳税缴费信用管理办法》等相…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T20:34:39+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 赵建华)A级纳税人是纳税缴费信用的最高级别，获评A级不仅可享受税务部门发票额度、办税绿色通道等多项守信激励，还能在市场竞争、融资授信、项目招投标等领域获得优势。围绕A级纳税人评定的常见认知误区以及日常经营的合规要点，记者采访了山西省社会科学院转型发展研究所所长孙秀玲。\r\n\n　　孙秀玲介绍，纳税缴费信用级别的评定，主要依据2025年7月实施的《纳税缴费信用管理办法》等相关规定开展。该办法突出评价范围拓展与修复机制升级两大方面。\n\n　　在评价范围上，办法在以往聚焦税收征管事项的基础上，将社保费、非税收入的申报缴纳情况同步纳入信用评价体系，实现了税费信用同评，覆盖了经营主体纳税缴费义务的全场景，信用评价的全面性与约束力显著提升，标准更全面、要求更严格。\n\n　　严格约束的同时，办法在修复机制上也传递出鲜明的容错导向。孙秀玲表示，对于非主观故意造成的轻微失信行为，办法鼓励经营主体知错即改，通过规范的信用修复机制弥补扣分。这意味着并非一次失误就与A级信用永久无缘，只要主动纠正错误、履行法定义务，信用水平就能逐步恢复。\n\n　　在A级纳税人评定过程中，不少经营主体对评定标准存在疑问。针对容易出现的四种常见误区，孙秀玲逐一进行了分析。\n\n　　误区一：只有大企业、一般纳税人才有资格评A级纳税人。纳税缴费信用评价对所有经营主体一视同仁，与是否为一般纳税人、经营规模大小并无必然关系。哪怕是小规模纳税人，只要日常经营合规守法、年度评价指标满足要求，同样有资格获评A级纳税人。\n\n　　误区二：零申报会影响A级信用评定。合规前提下的正常零申报，不会成为A级评定的阻碍。\n\n　　误区三：出现过失信记录，就再也评不上A级了。偶发的轻微失信并非“终身污点”，不会彻底错失获评A级的机会。\n\n　　误区四：个体工商户不能参与A级纳税人评定。个体工商户可自愿参与纳税缴费信用评价，只要规范做好申报缴费、发票管理等各项涉税缴费事项，信用得分达到A级标准，就可以获评A级纳税人，享受同等的守信激励政策。\n\n　　孙秀玲表示，评A级靠的不是临时突击，而是日复一日的规范经营。成为A级纳税人，日常经营要按时如实申报，足额缴纳各项税费，保证申报信息完整；积极配合税务部门的评估、检查，如实提供账本、凭证和经营数据，有问题及时整改，避免额外扣分；正视轻微失信，及时纠错修复信用弥补扣分。(完) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"生活","total":27,"items":[{"id":"c0d27054bc8","title":"港超聯｜理文登榜首迎傷兵潮 贊卡路或考慮轉會窗增兵","url":"https://www.stheadline.com/football-news/3639445/港超聯理文登榜首迎傷兵潮贊卡路或考慮轉會窗增兵","summary":"港超聯周五（20日）晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首。","summary_short":"港超聯周五（20日）晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首。","digest":"港超聯周五晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首","points":["港超聯周五（20日）晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首","理文主教練贊卡路賽後認為，球隊今仗在領先後成功抵擋北區反撲…","北區由格蘭特頭槌追回一球，惟理文在補時階段獲判十二碼，巴科爾操刀射入，最終以3:1鎖定勝局"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T23:13:52+08:00","size":2,"keywords":[],"body":"港超聯周五（20日）晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首。理文主教練贊卡路賽後認為，球隊今仗在領先後成功抵擋北區反撲，並展現出比早前對傑志一戰更成熟的處理大賽能力；北區主教練冼家裕則表示，球隊整體發揮不差，只是角球防守失誤及十二碼判決令球隊付出代價。\n理文下半場三球奏功　北區首嘗敗績\n理文賽前以18分排第二，僅落後高力北區一分。今仗理文在下半場先由杜素諾夫接應角球頂入，巴科爾其後把握北區後防失誤建功，取得2:0領先。北區由格蘭特頭槌追回一球，惟理文在補時階段獲判十二碼，巴科爾操刀射入，最終以3:1鎖定勝局。高力北區吞下今季聯賽首場敗仗，理文則全取三分，反壓對手升上榜首。\n贊卡路讚球隊展現成熟一面\n贊卡路表示，理文在大部分時間控制比賽，但北區追回一球後，形勢一度變得緊張。他說，球隊最終能保持紀律，頂住對方的反撲，對結果感到滿意。他認為，北區是一支實力強、轉守為攻直接而且具威脅的球隊，今仗勝仗對理文提升信心十分重要。贊卡路又指，理文近11場贏得10場，只是早前對傑志一戰暴露出球隊處理關鍵時刻時稍欠成熟，但今仗球員在這方面有所進步，有助球隊建立一個更好的賽季。\n談到今場獲選為最佳球員的杜素諾夫表現，贊卡路認為這名球員不但在防守及比賽中具影響力，其積極的性格和訓練態度亦能感染隊友，推動其他球員提升表現。\n卡拉夫接受手術　理文或考慮增兵\n贊卡路透露，隊中球員卡拉夫特日前已接受手術，預計需要數月時間康復；另外基高里的情況亦相約，情況亦有待觀察。至於冬季轉會窗會否增兵，他表示球會會視乎實際需要作決定，現階段對現有陣容仍感滿意。\n冼家裕指失第一球成關鍵\n高力北區主教練冼家裕表示，球隊上、下半場均曾作出調整，並逐漸與理文形成均勢，可惜先在角球防守中失守，後防再出現失誤，令對手取得第二個入球。他說，球隊追回一球曾有機會追平，格蘭特的頭槌攻門若能命中，形勢或會改變；至於補時階段的十二碼判決，他表示難以評論。冼家裕認為，球隊整體表現並不差，惟在關鍵位置未能把握機會。\n北區今仗有大衛卡廸停賽，冼家裕承認球隊在侵略性及進攻方面受到一定影響，但拿華路 頂上後亦完成應有工作。他強調，球隊不會因首敗而承受額外壓力，會繼續「一場一場踢」，避免為球員設定過高目標。談到增兵部署，冼家裕表示管理層容許球隊考慮補強，現階段較可能集中在前鋒位置。共指球隊目前主要依靠格蘭特擔任正宗前鋒，若需作出輪換，替補選擇相對有限，因此教練團隊會再平衡外援名額及陣容調配。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"港超聯｜理文登榜首迎傷兵潮 贊卡路或考慮轉會窗增兵","url":"https://www.stheadline.com/football-news/3639445/港超聯理文登榜首迎傷兵潮贊卡路或考慮轉會窗增兵","source_display":"星島頭條","published_at":"2026-11-20T23:13:52+08:00","category":"生活","digest":"港超聯周五晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首"},{"title":"港超聯｜理文3:1挫高力北區 破對手金身重登榜首","url":"https://www.stheadline.com/football-news/3639441/港超聯理文31挫高力北區破對手金身重登榜首","source_display":"星島頭條","published_at":"2026-11-20T22:42:49+08:00","category":"生活","digest":"港超聯周五晚在旺角大球場上演榜首大戰，理文憑杜素諾夫、及巴科爾梅開二度…"}],"cross":{"total":2,"angles":[{"point":"港超聯周五晚在旺角大球場上演榜首大戰，理文憑杜素諾夫、及巴科爾梅開二度…","sources":["星島頭條"],"url":"https://www.stheadline.com/football-news/3639441/港超聯理文31挫高力北區破對手金身重登榜首"},{"point":"港超聯周五晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首","sources":["星島頭條"],"url":"https://www.stheadline.com/football-news/3639445/港超聯理文登榜首迎傷兵潮贊卡路或考慮轉會窗增兵"}]}},{"id":"c90f5e39924","title":"宣萱止步叱咤「女歌手5強」惹爭議 遭質疑得半首歌難合資格 網民反駁：〈年少無知〉攞埋獎啦","url":"https://www.stheadline.com/film-drama/3639424/宣萱止步叱咤女歌手5強惹爭議-遭質疑得半首歌難合資格-網民反駁年少無知攞埋獎啦","summary":"商業電台今日（20日）正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果。","summary_short":"商業電台今日（20日）正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果。","digest":"商業電台正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果","points":["商業電台今日（20日）正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果","樂迷萬眾期待的「叱咤樂壇我最喜愛的男歌手、女歌手及組合」最後5強名單經已誕生…","部分網民對宣萱的入圍資格抱持強烈質疑，認為這對其他全職歌手極不公平"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T23:00:00+08:00","size":1,"keywords":[],"body":"商業電台今日（20日）正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果。樂迷萬眾期待的「叱咤樂壇我最喜愛的男歌手、女歌手及組合」最後5強名單經已誕生，早前殺入七強的視后宣萱，最新一輪投票中，她未能再進一步打入最後五強，遺憾無緣問鼎寶座。宣萱作為實力派演員，曾憑《刑事偵緝檔案IV》奪得TVB視后，演技毋庸置疑。不過，她今年幾乎殺入「我最喜愛女歌手」5強的事蹟，在網絡上掀起極大迴響！\n宣萱得半首歌不應該參選？\n部分網民對宣萱的入圍資格抱持強烈質疑，認為這對其他全職歌手極不公平。有網民直指：「宣萱根本就唔可以當成係歌手，佢全年嘅主要工作係演員，唱歌只係業餘客串一首合唱歌。將佢同啲全年出歌、開騷、跑宣傳嘅女歌手並列一齊，係侮辱。」也有其他網民簡單直接地表示：「宣小姐真的不是歌手」、「佢係藝人，點會係歌手」。此外，亦有網民指宣萱今年只有和古天樂合唱的《無時空之戀》，嚴格來說只有「半首歌」，且未推出過個人唱片，認為她只是業餘性質：「宣萱只係業餘歌手，半首歌都可以角逐？相信宣萱自己都feel到唱歌只係玩玩下……903比面古老闆，宣萱先有得角逐。」\n相關閱讀：叱咤2026｜我最喜愛五強出爐 古天樂出局張敬軒單挑4鏡仔 容祖兒相隔7年再殺入5強\n網民：最喜愛非最佳\n面對質疑，大批支持宣萱的樂迷與網民則紛紛挺身護航，認為「我最喜愛」獎項本質就是投票給心儀的對象，無需受限：「呢個獎係我最喜愛，無需原因、背景，你喜愛就得。」、「真心！投自己最喜愛就可以了！唔好理人講乜！」。\n網民用〈年少無知〉反駁\n此外，有資深樂迷引領大家回顧叱咤歷史來反駁「演員不能當歌手」的說法：「2012年度叱咤我最喜愛歌曲得獎歌係：《年少無知》，主唱林保怡、陳豪、黃德斌。林保怡歌手轉演員，陳豪、黃德斌肯定係演員……我唔知係以前百花齊放啲人可以接受任何身份嘅歌手，定而家啲人咩都要整條界，要分歌手定演員？3分1首歌（《年少無知》）都可以係歌手啦，何況2分1首歌（《無時空之戀》）？」，有網民亦附和：「我冇投宣萱，但既然有歌上榜就自然可以俾人投。半隻歌點解唔得？當年《年少無知》都得，古老闆半隻歌又得，點解宣萱唔得？」支持者普遍認為，「我最喜愛」系列獎項並非「長期服務大獎」或「豐功偉績獎」，只要歌曲能為聽眾帶來感動與回憶，樂迷便有權投下神聖一票。亦有網民指現時宣萱未能進入最後5強，該獎對他已再無意義。\n相關閱讀：古天樂殺入叱咤2026我最喜愛男歌手八強 為入5強被逼拍片宣傳 晒宣萱黑圖笑料百出","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9df537fbf3","title":"从课堂到舞台，“中国民族声乐表演人才培训”交答卷","url":"https://www.chinanews.com.cn/cul/2026/11-20/10735593.shtml","summary":"中新网北京11月20日电 (记者 应妮)由国家艺术基金资助、中国音乐学院主办的2026年度艺术人才培训资助项目《中国民族声乐表演人才培训》结业音乐会19日晚在北京音乐厅上演。","summary_short":"中新网北京11月20日电 (记者 应妮)由国家艺术基金资助、中国音乐学院主办的2026年度艺术人才培训资助项目《中国民族…","digest":"由国家艺术基金资助…","points":["中新网北京11月20日电 (记者 应妮)由国家艺术基金资助…","30位学员以独唱、对唱、重唱、合唱等多元形式，将人物塑造、戏剧节奏、声腔把控融于舞台叙事","音乐会延续研修课程架构，分为“诗韵流声”“乡音和鸣”“歌咏戏魂”三个篇章"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:51:00+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 应妮)由国家艺术基金资助、中国音乐学院主办的2026年度艺术人才培训资助项目《中国民族声乐表演人才培训》结业音乐会19日晚在北京音乐厅上演。30位学员以独唱、对唱、重唱、合唱等多元形式，将人物塑造、戏剧节奏、声腔把控融于舞台叙事。\n\n《中国民族声乐表演人才培训》结业音乐会谢幕现场。　主办方供图\n\n　　音乐会延续研修课程架构，分为“诗韵流声”“乡音和鸣”“歌咏戏魂”三个篇章。第一篇章在《幽兰操》的悠远吟唱中开场，《枫桥夜泊》《青玉案·元夕》《清平乐·年年雪里》接连铺展诗词意境；第二篇章《看秧歌》《蒙古牧歌》《亲圪蛋下河洗衣裳》等唱响，方言韵味与民间节奏引来阵阵掌声；第三篇章《再别康桥》《雪山的风》《人就活一回》等歌剧选段，将人物冲突与戏剧张力层层推进。\n\n　　项目负责人、中国音乐学院声乐歌剧系副主任容世杰表示，这场音乐会所有曲目均为集中研修期间重点研习的作品，经过实践沉淀，学员跳出技术复刻，将课堂所得与一线感悟融为一体，实现演唱技艺、审美认知与文化理解的同步提升。同时，也与此前7月28日的“艺术歌曲音乐会”、8月8日的“传统声乐作品专场音乐会”、8月20日的“汇报音乐会”共同构成了四阶递进的实践检验体系。\n\n　　星海音乐学院民族声乐系声乐教研室主任黄熙殷毕业十几年后再回母校学习，并参演歌剧《再别康桥》，“这部作品是中国音乐学院原创、中国第一部小剧场歌剧，这次由我们演唱，是非常好的传承。”她坦言，站过讲台才知道教学岗位上有许多不足，经过这次培训，许多实践感受变得具象化、理论化，可以归纳总结后反哺教学。\n\n　　该培训项目经多轮严格评审与综合考量，最终确定的30名正式学员均为全国各大专业院校与文艺院团的青年骨干，多人曾荣获全国及省级“金钟奖”，代表着国内民族声乐教学与舞台实践的中坚力量。课程设置声乐演唱、舞台表演、声乐理论等模块，融合讲座、一对一作品打磨、排练实践等教学形式。在师资配置上，项目以中国音乐学院声乐歌剧系优秀教师为依托，汇聚各领域名家组成授课阵容，包括中国音乐学院院长、指挥家李心草，京剧表演艺术家袁慧琴，河北梆子表演艺术家刘玉玲，歌唱家单秀荣、吴碧霞、雷佳，音乐理论家居其宏、郭克俭，导演陈蔚等人。\n\n　　容世杰表示，培训项目打造“集中授业—线上深耕—岗位转化—舞台复盘”长效培养链条，重在培育一批懂本源、通理论、善实践、能传播的复合型声乐骨干，守护好、传扬好中华声乐文脉。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3494e50fd4","title":"林盛斌撐俞可程真誠參與《女神2》 已短訊慰問籲盡快交代 否認十億身家有錢派幾百萬畀黎芷珊養老","url":"https://www.stheadline.com/film-drama/3639428/林盛斌撐俞可程真誠參與女神2-已短訊慰問籲盡快交代-否認十億身家有錢派幾百萬畀黎芷珊養老","summary":"林盛斌（Bob）與黎芷珊今日為一個慈善籌款晚宴擔任司儀，兩人透露對上一次合作已是前年台慶，但平日亦不時在公開場合碰面。","summary_short":"林盛斌（Bob）與黎芷珊今日為一個慈善籌款晚宴擔任司儀，兩人透露對上一次合作已是前年台慶，但平日亦不時在公開場合碰面。","digest":"林盛斌與黎芷珊今日為一個慈善籌款晚宴擔任司儀，兩人透露對上一次合作已是前年台慶…","points":["林盛斌（Bob）與黎芷珊今日為一個慈善籌款晚宴擔任司儀，兩人透露對上一次合作已是前年台慶…","被問到昨晚未能參與無綫台慶盛事會否感到可惜","兩人均表示不會，指公司各有工作安排，Bob早前剛做完節目巡禮…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:15:46+08:00","size":1,"keywords":[],"body":"林盛斌（Bob）與黎芷珊今日為一個慈善籌款晚宴擔任司儀，兩人透露對上一次合作已是前年台慶，但平日亦不時在公開場合碰面。被問到昨晚未能參與無綫台慶盛事會否感到可惜？兩人均表示不會，指公司各有工作安排，Bob早前剛做完節目巡禮，黎芷珊接下來亦將擔任《歡樂滿東華》司儀，相信公司是為了平衡大家的工作量。\n林盛斌笑黃劍文掛住食雞髀錯過抽獎\n談及昨晚台慶情況，Bob笑言自己也有收看直播，更打趣指看到黃劍文因掛住食雞髀而錯過抽獎環節十分好笑。說到擔任大型活動司儀的心得，兩人不約而同表示，每逢抽獎環節前都會刻意提醒現場嘉賓切勿離席；黎芷珊笑言：「最重要是相信自己有機會中獎才會留下來。」並自爆在無綫工作40年來從未在台慶抽中過大獎。身旁的Bob 則自豪表示曾經中獎，卻記不起獎品內容，隨即被記者取笑是否因坐擁「十億身家」才不把小獎放在眼內。\n林盛斌否認有十億怕被追查\nBob聞言立即反應甚大，連聲否認並笑稱：「不要亂說話害死人，一陣間惹來稅局追查！」他坦言外界常誤以為他收入豐厚，但其實自己都是「揼石仔」逐單工作累積，在旁的黎芷珊笑指他「沒有十億也有八億」，Bob笑說：「如果我有十億，一定會派幾百萬元畀你養老。」場面惹笑。至於昨晚台慶抽獎由肥媽在陸浩明帶領下代領獎品而引發公平性討論，兩人解釋司儀在台上有既定指引，只要在規定時間內未能現身便會取消資格，若按程序處理並無不妥，黎芷珊亦補充擔任司儀往往要隨機應變及掌握現場節奏。\n林盛斌黎芷珊談台慶抽獎爭議\n此外，近日有傳《女神配對計劃2》參加者俞可程被指非單身，並牽涉與TVB導演的戀情傳聞，昨晚更缺席台慶活動。身為節目主持的Bob被問及此事時，表示對俞可程及一眾參加者充滿信心。他透露製作團隊在拍攝前已為所有參加者進行嚴格的背景核實，確保大家均為單身才獲准參與，若在拍攝期間出現其他追求者則另作別論。\n林盛斌撐俞可程有追求者另作別論\nBob坦言，相信俞可程在參與節目時並冇說謊，並指出演藝圈中若有任何隱瞞，最終只會自食其果，因此相信對方是真誠參與。他透露已透過短訊慰問俞可程，叮囑對方不要給自己太大壓力，並着她盡快出來向外界交代清楚；對方亦已回覆表示會盡快處理。Bob強調目前無聽聞TVB高層下令「雪藏」俞可程的傳聞，而《女神配對計劃2》亦尚有大結局篇有待拍攝，現正協調一眾藝人的檔期。至於被指牽涉其中的TVB導演，Bob表示雙方曾有合作，但對其私人感情及家庭狀況並不了解，相信當事人會盡快交代事件始末。\n黎芷珊談光明正大舊情 \n另一方面，張達倫與太太Kimmy早前一同接受伍詠薇與李凱賢主持的節目《九運會客室2》訪問，談及與黎芷珊的舊情，言談間Kimmy似是有醋意，黎芷珊表示有看該節目，不認為Kimmy是呷醋，強調與張達倫關係光明正大，沒有鬼鬼祟祟，大家有一個溝通群組，Kimmy也是其中一員，大家的溝通公開透明，又指報導出街後，張達倫亦有主動向她致歉，擔心她會誤會，不過她並不介意，笑指張達倫每次做訪問都必會提到自己，覺得他很慘，叫他「搣得甩就搣」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1c726f7714","title":"黃子桐台慶唔見影揭正式離巢 晒性感晚裝結束8年賓主關係 學霸港姐斥60萬進軍美容界","url":"https://www.stheadline.com/film-drama/3639407/黃子桐台慶唔見影揭正式離巢-晒性感晚裝結束8年賓主關係-學霸港姐斥60萬進軍美容界","summary":"無綫集團昨晚（19日）舉行《萬千星輝賀台慶2026》，正當全台藝員傾巢而出、在紅地氈上爭奇鬥艷之際，昔日屢屢以性感晚裝亮相的黃子桐，卻全程不見蹤影。","summary_short":"無綫集團昨晚（19日）舉行《萬千星輝賀台慶2026》，正當全台藝員傾巢而出、在紅地氈上爭奇鬥艷之際…","digest":"無綫集團昨晚舉行《萬千星輝賀台慶2026》，正當全台藝員傾巢而出…","points":["無綫集團昨晚（19日）舉行《萬千星輝賀台慶2026》，正當全台藝員傾巢而出…","正當網民與粉絲紛紛疑惑之際，原來她悄悄選在台慶夜，在社交平台無預警宣布離巢TVB…","她坦言這8年時光是她人生中「最珍貴的一段成長旅程」，並衷心感激公司多年來的栽培…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:00:06+08:00","size":1,"keywords":[],"body":"無綫集團昨晚（19日）舉行《萬千星輝賀台慶2026》，正當全台藝員傾巢而出、在紅地氈上爭奇鬥艷之際，昔日屢屢以性感晚裝亮相的黃子桐，卻全程不見蹤影。正當網民與粉絲紛紛疑惑之際，原來她悄悄選在台慶夜，在社交平台無預警宣布離巢TVB，正式結束長達8年的賓主關係，令不少觀眾感到意外與不捨。\n黃子桐分享歷年台慶晚裝揭離巢\n為了告別這個孕育她成長的舞台，黃子桐在社交平台貼文：「今晚係一年一度嘅台慶大日子，正式同大家講聲：我離開TVB啦！」她一口氣貼出了多張過往在台慶穿上性感晚裝、展現火辣傲人身材的美照，並特意附上一張在電視廣播城大樓外，手持TVB員工證的打卡相作結，象徵著這段演藝歲月的完美落幕。她坦言這8年時光是她人生中「最珍貴的一段成長旅程」，並衷心感激公司多年來的栽培，以及一眾前輩、導演與台前幕後戰友們的愛護與照顧。\n相關閱讀：香港探秘地圖｜黃子桐演低胸長腿女記者彈起 選港姐棄讀哈佛 擁碩士學位18歲做老闆\n黃子桐中大碩士選港姐入行\n回顧這8年的演藝之路，黃子桐嘗試過當主持及不同角色。她特別提到，今年自己迎來了演藝生涯中最滿意的兩個代表作，分別是劇集《香港探秘地圖》中性感大膽的「小背心May May」，以及在《正義女神》裡極具演技考驗的「王太太」。她直言能在螢幕上留下讓觀眾深深記住的印記，這段青春已然無憾。現年31歲的她於2018年參選港姐入行，雖然當年於12強止步，但憑藉甜美外貌與魔鬼身材備受關注，而私底下的她更是一名不折不扣的「學霸港姐」，畢業於香港大學中文及犯罪學系，其後更進修修畢香港中文大學公共衞生學碩士學位，絕對是美貌與智慧並重。\n黃子桐18歲創業現開美容院 \n談及未來的發展動向，黃子桐決定跳出舒適圈，將事業重心放在美容院，同時也會在最愛的匹克球場上繼續揮灑汗水。其實黃子桐不僅學歷亮眼，自18歲起便極具商業頭腦，曾先後投資畫室、補習社及體檢中心等多盤生意，早前她更豪擲60萬獨資開設美容院升格做老闆，為了宣傳更不惜在社交平台大派超火辣泳衣福利照，親自上陣兼任「生招牌」，事業心強勁。 \n相關閱讀：前港姐晒火辣比堅尼消暑！戰鬥格開工「勾引」視帝 學霸加入TVB做極都係閒角","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c179bc52701","title":"天氣｜天文台料明早仍寒冷 民政署開放18間臨時避寒中心","url":"https://news.tvb.com/tc/1207488-天氣天文台料明早仍寒冷民政署開放18間臨時避寒中心","summary":"寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷，市區最低氣溫約13度。民政署開放全港18間臨時避寒中心，供有需要的市民入住。","summary_short":"寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷，市區最低氣溫約13度。","digest":"寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷…","points":["寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷…","民政署開放全港18間臨時避寒中心，供有需要的市民入住","天氣動態圖｜創入秋最凍紀錄　寒潮持續到幾時"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T22:00+08:00","size":1,"keywords":[],"body":"寒冷天氣警告生效，天文台錄得最低12.7度，是入秋以來最冷，預測明早仍然寒冷，市區最低氣溫約13度。民政署開放全港18間臨時避寒中心，供有需要的市民入住。\n\n天氣動態圖｜創入秋最凍紀錄　寒潮持續到幾時？　下周再有冷鋒｜附九天預報\n\n一股強烈東北季候風，加上一道廣闊雲帶，氣溫顯著下降。伴隨著毛毛雨，體感溫度「凍上加凍」。強風更吹到雨傘都變形。就連牠都要添加「外套」。在北角碼頭，厚實的雲層覆蓋上空。\n\n天文台清晨錄得15.3度，但愈晏愈凍，中午跌至13.2度，下午更錄得12.7度，各區普遍下降至約12度。\n\n天文台高級科學主任楊漢賢說：「今天影響我們的雲帶比較厚實，所以日間大部分時間都是陰雨天氣，日間氣溫升不到，天氣就轉冷。第二特點是我們看到無論雲帶和雨帶，覆蓋範圍非常廣泛，而且雨勢持續很久，原來與遠在印度和孟加拉灣上空的，這個熱帶熱氣旋有關，我們分析得到，高空的西風帶，把它大量水氣，源源不絕由西向東輸送到華南地區，影響我們今天天氣。」\n\n天文台預料明早仍然寒冷，市區最低約13度，新界再低幾度，隨後一兩日氣溫稍為回升，另一股東北季候風，會在下周二抵達華南沿岸，將再度轉涼，亦會有幾陣雨。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/daedb7249acc433ea59a6d22b7e6dee3/snapshots/2d2cad26cf804ef69e881aed62592937-00008.jpg","video":"https://pro-vod-cdn.tvb.com/daedb7249acc433ea59a6d22b7e6dee3/5b1f8da61c1f4712b062f0053446caa2-e76ceb74ca19a7ce69dff99e107f4387-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/daedb7249acc433ea59a6d22b7e6dee3/snapshots/2d2cad26cf804ef69e881aed62592937-00008.jpg","lang":"zh-Hant"},{"id":"c1126d1a9e3","title":"香港公開羽毛球錦標賽｜拉讚諾2:0擊敗李文珊入準決賽 將與隊友李美妙內戰","url":"https://www.stheadline.com/realtime-sport/3639329/香港公開羽毛球錦標賽拉讚諾20擊敗李文珊入準決賽-將與隊友李美妙內戰","summary":"週五（20日）香港公開羽毛球錦標賽女單8強賽事，泰國名將拉讚諾（Ratchanok Intanon）2:0擊敗加拿大代表李文珊…","summary_short":"週五（20日）香港公開羽毛球錦標賽女單8強賽事，泰國名將拉讚諾（Ratchanok Intanon）2:0擊敗加拿大代表…","digest":"週五香港公開羽毛球錦標賽女單8強賽事…","points":["週五（20日）香港公開羽毛球錦標賽女單8強賽事，泰國名將拉讚諾（Ratchanok Inta…","首局雙方纏鬥相當焦灼，共14次打成平手，至19:19時拉讚諾連取2分以21:19先贏1局","次局李文珊開首曾嘗試提速拉開比賽，拉讚諾始終咬緊，戰至16:16拉讚諾打出一波5:0…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T21:59:24+08:00","size":1,"keywords":[],"body":"週五（20日）香港公開羽毛球錦標賽女單8強賽事，泰國名將拉讚諾（Ratchanok Intanon）2:0擊敗加拿大代表李文珊，準決賽將與隊友李美妙（Pornpawee Chochuwong）演內戰爭奪決賽席位。\n兩盤直落戰勝李文珊\n首局雙方纏鬥相當焦灼，共14次打成平手，至19:19時拉讚諾連取2分以21:19先贏1局。次局李文珊開首曾嘗試提速拉開比賽，拉讚諾始終咬緊，戰至16:16拉讚諾打出一波5:0，以21:16奪得勝利。\n老將之間的對壘\n賽後拉讚諾說到：「和李文珊的對陣，不總是那麼容易，因為她是很有經驗的球手，她在世界頂尖水平競賽了很多年。當狀態不是100%的時候，她知道怎樣去應對，我認為今場比賽她做得很好，她的思路很清晰，但她的身體狀態不是完全最佳，我可以看出來。雖然我也不是最健全的狀態，但我感覺我今天的身體狀況比她略好一點，所以我嘗試打得更有進攻性，並盡量不要操之過急。和她比賽永遠感覺很棒。」\n\n拉讚諾與李文珊賽後合照。爾郡耀攝\n應對長期傷病的課題\n拉讚諾（31歲）與李文珊（35歲）同樣有很長的職業生涯，對於維持狀態，拉讚諾坦言：「當我們年輕的時候，可能休息一兩天我們又可以繼續訓練，但現在我們有更多的問題，像我們有些長期積累的、微小的傷影響著我們，我們需要更多時間慢慢來休養，不能太急。有時我需要去接受身體給我們的訊號，不需要隨時做到最盡。很慶幸目前我還沒有什麼嚴重的傷，所以如果可以慢慢來我會盡量放慢節奏。」\n與李美妙上演精彩對決\n明天的準決賽，拉讚諾將與同來自泰國的李美妙上演內戰，她說到：「我的優勢是我比她更有經驗，但她現在也是相當強勁的對手，在巡回賽中學到了很多（拉讚諾世界排名第6位，而李美妙排第8位），她的心態也很成熟，當她在場上遇到低潮，她會很快找回狀態。」\n她又直言：「我們彼此很熟悉，雖然她比我年輕一些，但除了球場上，我們也會一起去吃飯，有時在泰國也會一起訓練，總而言之我認為明天的半決賽會是一場精彩的對決。」\n\n記者：爾郡耀","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5777b9fd7d","title":"王嘉慧自嘲先天不足 鄧凱文否認「岩石胸」強調真材實料可上《東張》驗真假","url":"https://www.stheadline.com/film-drama/3639423/王嘉慧自嘲先天不足-鄧凱文否認岩石胸強調真材實料可上東張驗真假","summary":"王嘉慧和鄧凱文出席慈善活動，王嘉慧表示不清楚陳庭欣是否拍拖，大家雖同是《東張》主持，但合作機會少，如是真的會為她感到開心，講到陳庭欣因玩匹克球傳戀情，她笑言現在是單身，或者都可嘗試玩匹克球…","summary_short":"王嘉慧和鄧凱文出席慈善活動，王嘉慧表示不清楚陳庭欣是否拍拖，大家雖同是《東張》主持，但合作機會少…","digest":"王嘉慧和鄧凱文出席慈善活動，王嘉慧表示不清楚陳庭欣是否拍拖，大家雖同是《東張》主持…","points":["王嘉慧和鄧凱文出席慈善活動，王嘉慧表示不清楚陳庭欣是否拍拖，大家雖同是《東張》主持…","鄧凱文昨晚在台慶打扮非常戰鬥格，在旁王嘉慧笑指她是真材實料，自己就是先天不足…","至於鄧凱文表示台慶的長裙要時時保持挺腰，一放鬆就會有窿走出來，對於被指是岩石胸，她說…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T21:45:39+08:00","size":1,"keywords":[],"body":"王嘉慧和鄧凱文出席慈善活動，王嘉慧表示不清楚陳庭欣是否拍拖，大家雖同是《東張》主持，但合作機會少，如是真的會為她感到開心，講到陳庭欣因玩匹克球傳戀情，她笑言現在是單身，或者都可嘗試玩匹克球，但認為做運動是為健身而不是為識男仔。\n王嘉慧在其他地方取勝\n鄧凱文昨晚在台慶打扮非常戰鬥格，在旁王嘉慧笑指她是真材實料，自己就是先天不足，唯有在其他地方取勝，對於鄧凱文指不時都有女同事篤她胸部，王嘉慧直言未篤過，就算對方願意，自己也未必敢碰。\n鄧凱文唔介意畀女同事篤胸\n至於鄧凱文表示台慶的長裙要時時保持挺腰，一放鬆就會有窿走出來，對於被指是岩石胸，她說：「我一向真材實料，公司女同事有時都會來篤一篤，我行得正企得正，不介意畀人篤，如果公司或客戶有要求，我可以在《東張》驗真假。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c60bb49bd1a","title":"何沛珈自揭貧血頭暈否認「跑包尾」有機心 爆曾兩次試跑要人扶","url":"https://www.stheadline.com/film-drama/3639415/何沛珈自揭貧血頭暈否認跑包尾有機心-爆曾兩次試跑要人扶","summary":"何沛珈晚上出席一個慈善籌款晚宴，對於何沛珈昨日在台慶
