升了铜的消耗量。\n\n供给方面，受极端天气、矿难等影响，全球产铜大国智利的矿石品位下滑；另一大产铜国刚果（金）出台铜精矿出口禁令，导致全球矿铜产量出现小幅负增长。在此影响下，国际铜价同比大幅上涨。\n\n伦敦金属交易所（LME）公布的数据显示，2026年前三季度LME铜均价为13434.29美元/吨，同比上涨超40%。\n\n在铜价上涨带动下，铜矿企业2026年前三季度业绩表现较为亮眼，洛阳钼业也不例外。2026年前三季度，公司实现营业收入2072.90亿元，同比增长42.48%，实现扣非后净利润233.35亿元，同比增长60.52%。\n\n除铜价上涨外，洛阳钼业的铜矿产量及销量也在提升。据悉，洛阳钼业矿产铜主要来源于刚果（金）TFM、KFM两大铜矿，2026年前三季度公司铜矿开采量持续提升。根据洛阳钼业官网披露的信息，2026年前三季度产铜59.67万吨，同比增长9.81%。\n\n实际上除铜以外，洛阳钼业还有钼、钴、钨、铌、黄金、磷肥等产品，2026年前三季度上述产品均价均有所上涨。\n\n图 / 洛阳钼业官微\n\n得益于铜及其他金属产品的价格及销量双双提升，洛阳钼业扣非后利润表现出色。\n\n值得注意的是，由于美国通胀加剧，美联储进入新一轮的加息周期，9月份美联储加息了25个基点，市场预测12月份美联储将再加息25个基点。\n\n美元是全球最主要的结算货币，大宗商品国际贸易基本以美元结算，在美联储加息周期下，铜、黄金等金属价格也会受到压制。\n\n以LME铜为例，2026年9月铜价最高为14875美元/吨，美联储加息过后，目前已跌至12500美元/吨左右。这在一定程度上给洛阳钼业未来的业绩增长带来了新的不确定性。\n\n02 并购功臣集中离职，仍斥巨资收购及扩产\n\n过去几年，洛阳钼业交出了自成立以来最好的业绩表现，最核心的原因便是公司铜产量的持续提升。\n\n而在2013年以前，洛阳钼业旗下的矿产主要以钼、钨矿为主，并不涉及铜矿开采，后续依靠不断并购才让公司跻身国内一流铜矿企业。凭借不断的并购，洛阳钼业也成为A股市值超2500亿元的矿业巨头。\n\n主导洛阳钼业一系列并购自然离不开公司实控人于泳的推动，同时也离不开公司原董事长李朝春、袁宏林及原总裁孙瑞文的努力。\n\n公开资料显示，李朝春2007年加入洛阳钼业。有意思的是，他并非传统的矿山技术出身，在加入洛阳钼业之前，其曾在安达信会计师事务所、汇丰银行任职，具备丰富的金融投资经验。\n\n自加入洛阳钼业后，其先后担任公司执行董事和副董事长。2013年公司以8.2亿美元拿下澳洲NPM（北帕克斯）铜金矿80%股权。拿下该铜矿后不久，2014年1月李朝春正式出任董事长，2020年后任首席投资官，主导公司全球化并购战略。\n\n在李朝春担任公司董事长后，洛阳钼业对外并购按下了加速键。2016年，洛阳钼业启动了公司自成立以来最重要的一笔并购，以26.5亿美元收购自由港持有的TFM56%权益；2019年，洛阳钼业又以11.36亿美元收购了TFM24%股权。\n\n为了收购该矿，洛阳钼业四处融资，例如向国内银行财团申请了累计15.9亿美元的银团贷款，此后又通过资本市场定增募资180亿元。\n\n而如此大规模的资本运作也离不开袁宏林的运作。公开资料显示，袁宏林2013年加入洛阳钼业，加入洛阳钼业之前，其长期在银行体系任职，擅长信贷结构设计、融资、风控和资产负债管理。加入洛阳钼业后，他出任洛钼非执行董事，主要负责融资方案、债务结构、风险管控等。\n\n在两人携手运作下，2020年洛阳钼业又以5.5亿美元拿下KFM（Kisanfu）铜钴矿95%的权益，凭此，洛阳钼业成为国内仅次于紫金矿业的铜矿开采商。2026年，公司利润极有可能达到300亿元。\n\n有意思的是，在洛阳钼业成为世界级矿业巨头后，李朝春和袁宏林因个人原因于2025年4月辞去相关职务。两人的离职也让外界对洛阳钼业未来的经营颇为关注。\n\n洛阳钼业持续扩大的前提是逆周期扩产，在行业低谷时买下铜矿，如2016年买下TFM56%权益时，国际铜价已经经历了长时间的下跌，彼时LME铜价还不到4500美元/吨。\n\n袁宏林也曾公开表示，洛阳钼业的扩张，得益于前期吃到了逆周期扩产的红利。\n\n此次李朝春和袁宏林离开董事会后，洛阳钼业聘请在油气和自然资源领域深耕20多年的刘建锋担任公司董事长和首席投资官，同时聘请矿业技术出身的阙朝阳担任常务副总裁和首席运营官。\n\n而在新旧管理层更替之际，2025年6月洛阳钼业又耗资5.81亿加元收购厄瓜多尔凯歌豪斯金矿，并在年末以10.15亿美元再次收购了巴西四座在产金矿。今年4月，洛阳钼业又在阿曼投资约24亿阿曼里亚尔建设年产53万吨的电解铝综合项目。\n\n但公司并购金矿时，黄金价格正处在高位，阿曼电解铝项目与伊朗隔海峡相望，地缘变量持续存在。\n\n因此，外界也担心公司新管理层是否不再遵循以前管理层低价买矿的策略。对此，「创业最前线」试图向洛阳钼业求证，截至发稿未获回复。\n\n03 股价跌超57%，实控人身家蒸发超700亿元\n\n虽然公司利润持续增长，但自2026年2月以来，公司在资本市场表现却不理想，股价从最高28.24元/股跌至11.89元/股，不到一年时间，公司股价累计跌超57%（注：以上均为复权后价格）。\n\n在股价大跌的背景下，公司实控人于泳也损失惨重。天眼查显示，洛阳钼业控股股东为鸿商产业控股集团有限公司，截至2026年9月30日，该企业持有洛阳钼业24.93%股权，而于泳又持有鸿商产业控股集团有限公司99%的股权，于泳顺理成章成为洛阳钼业实控人。\n\n图 / 天眼查\n\n作为市值超2500亿元的全球矿业巨头实控人，于泳个人非常低调。根据有限的资料报道，于泳出生于1961年，在创办鸿商产业控股集团有限公司以前，其先后担任瓦房店造纸厂工会主席、生产副厂长、大连东立工艺纺织品有限公司总经理。\n\n这也就意味着，创立鸿商产业控股集团有限公司之前，于泳的身份是东北一座小城的造纸厂干部和纺织品公司经理，跟矿业没有一丝关系。2003年，他成立鸿商产业控股集团有限公司，注册资本为1.8亿元。\n\n2004年，成立不久的鸿商产业控股集团有限公司便以1.78亿元买下债务缠身的洛阳钼业49%股权，彼时洛阳钼业的实际控制人依旧是栾川县国资，于泳依然未能掌控洛阳钼业的控制权。此后，随着洛阳钼业在A股及港股上市，栾川县国资及鸿商产业控股集团有限公司持有的股权均被稀释。\n\n2014年，鸿商集团通过在二级市场增持洛阳钼业股权至36.01%，取代洛矿集团成为控股股东，于泳也顺利成为洛阳钼业实际控制人。\n\n成为洛阳钼业的实控人后，于泳公开露面的次数并不多，企业明面上的经营管理也主要由李朝春和袁宏林等管理层负责。\n\n但这并不妨碍洛阳钼业持续发展壮大。2026年1月29日，公司股价最高涨至28元/股以上，市值最高突破5700亿元。凭借对洛阳钼业的间接持股，于泳个人身家最高突破1400亿元。\n\n好景不长，随着2月以来洛阳钼业股价持续回落，公司市值蒸发超3000亿元，于泳个人持股市值蒸发超700亿元。\n\n在公司股价大跌的背景下，洛阳钼业也推出了10亿元至20亿元的回购计划，并已经取得招商银行上海分行不超过18亿元的回购贷款专用额度。但仅凭此是否能让洛阳钼业股价企稳回升，还需要时间证明。\n\n在新能源持续发展、AI数据中心建设持续加速的背景下，市场对铜的需求将持续旺盛，作为国内头部铜矿企业的洛阳钼业也将充分受益。但短期内，在美联储加息影响下，铜价有持续下跌的风险，洛阳钼业在资本市场的股价表现或将受到影响。\n\n本文为转载内容，授权事宜请联系原著作权人。洛阳钼业\n3.2k\n\n洛阳钼业今日大宗交易平价成交599.59万股，成交额7536.9万元2天前\n洛阳钼业：取得不超18亿元股票回购专项贷款承诺函8天前\n\n业绩 市值\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n洛阳钼业\n铜价撑起前三季度233亿元利润，洛阳钼业市值十个月竟蒸发3000亿元\n\n作为世界矿业巨头，洛阳钼业能否凭借自身管理平稳度过此轮美联储加息周期？\n\n创业最前线 · 2026/11/20 11:28\n\n文｜创业最前线 段楠楠\n\n编辑｜冯羽\n\n11月12日，国内矿业巨头洛阳钼业发布公告，公司已经取得招商银行上海分行不超过18亿元的回购贷款专用额度，此前洛阳钼业公告计划回购10亿元至20亿元。\n\n过去半年，由于资本市场整体表现不佳，加之公司股价前期涨幅过大，洛阳钼业股价表现并不理想，自2月份高点以来累计跌超57%。\n\n虽然股价表现不理想，但在铜、金等金属价格上涨及公司自身产量增长带动下，洛阳钼业业绩表现较为出色，2026年前三季度公司扣非后净利润同比增长超60%。\n\n但随着美联储进入新一轮的加息周期，市场开始担忧国际铜价及金价下跌会影响公司的利润水平。作为世界矿业巨头，洛阳钼业能否凭借自身管理平稳度过此轮美联储加息周期？\n\n01 铜价大涨超40%，前三季度扣非利润超233亿元\n\n从收入来看，洛阳钼业业务主要分为精矿产品、金属贸易及自有矿山开采。其中精矿产品及金属贸易本质上属于加工和贸易业务，赚取的是加工费和服务费，因此毛利率极低。虽然该业务营收规模庞大，但并不产生多少利润。\n\n2026年上半年，洛阳钼业精炼金属贸易及精矿产品分别实现营业收入750.6亿元、448.1亿元，主营利润分别只有15.05亿元、14.82亿元，扣除各类费用后，归属于母公司的实际净利润更少。\n\n而洛阳钼业真正的利润大头是自有矿山的开采与售卖。洛阳钼业官网披露的消息显示，2026年前三季度矿山端营业收入为764.29亿元，其中铜矿实现营业收入524.17亿元，同比增长35.73%，是公司矿山端收入的最主要来源。因此，公司业绩是否景气与铜价有直接联系。\n\n图 / 洛阳钼业官微\n\n随着世界能源结构逐步转型，新能源发电占比在持续提升，相较于传统的火力发电，光伏、风电等用铜消耗量高很多。加之AI持续爆发，拉动了电网等电力设施的建设，也提升了铜的消耗量。\n\n供给方面，受极端天气、矿难等影响，全球产铜大国智利的矿石品位下滑；另一大产铜国刚果（金）出台铜精矿出口禁令，导致全球矿铜产量出现小幅负增长。在此影响下，国际铜价同比大幅上涨。\n\n伦敦金属交易所（LME）公布的数据显示，2026年前三季度LME铜均价为13434.29美元/吨，同比上涨超40%。\n\n在铜价上涨带动下，铜矿企业2026年前三季度业绩表现较为亮眼，洛阳钼业也不例外。2026年前三季度，公司实现营业收入2072.90亿元，同比增长42.48%，实现扣非后净利润233.35亿元，同比增长60.52%。\n\n除铜价上涨外，洛阳钼业的铜矿产量及销量也在提升。据悉，洛阳钼业矿产铜主要来源于刚果（金）TFM、KFM两大铜矿，2026年前三季度公司铜矿开采量持续提升。根据洛阳钼业官网披露的信息，2026年前三季度产铜59.67万吨，同比增长9.81%。\n\n实际上除铜以外，洛阳钼业还有钼、钴、钨、铌、黄金、磷肥等产品，2026年前三季度上述产品均价均有所上涨。\n\n图 / 洛阳钼业官微\n\n得益于铜及其他金属产品的价格及销量双双提升，洛阳钼业扣非后利润表现出色。\n\n值得注意的是，由于美国通胀加剧，美联储进入新一轮的加息周期，9月份美联储加息了25个基点，市场预测12月份美联储将再加息25个基点。\n\n美元是全球最主要的结算货币，大宗商品国际贸易基本以美元结算，在美联储加息周期下，铜、黄金等金属价格也会受到压制。\n\n以LME铜为例，2026年9月铜价最高为14875美元/吨，美联储加息过后，目前已跌至12500美元/吨左右。这在一定程度上给洛阳钼业未来的业绩增长带来了新的不确定性。\n\n02 并购功臣集中离职，仍斥巨资收购及扩产\n\n过去几年，洛阳钼业交出了自成立以来最好的业绩表现，最核心的原因便是公司铜产量的持续提升。\n\n而在2013年以前，洛阳钼业旗下的矿产主要以钼、钨矿为主，并不涉及铜矿开采，后续依靠不断并购才让公司跻身国内一流铜矿企业。凭借不断的并购，洛阳钼业也成为A股市值超2500亿元的矿业巨头。\n\n主导洛阳钼业一系列并购自然离不开公司实控人于泳的推动，同时也离不开公司原董事长李朝春、袁宏林及原总裁孙瑞文的努力。\n\n公开资料显示，李朝春2007年加入洛阳钼业。有意思的是，他并非传统的矿山技术出身，在加入洛阳钼业之前，其曾在安达信会计师事务所、汇丰银行任职，具备丰富的金融投资经验。\n\n自加入洛阳钼业后，其先后担任公司执行董事和副董事长。2013年公司以8.2亿美元拿下澳洲NPM（北帕克斯）铜金矿80%股权。拿下该铜矿后不久，2014年1月李朝春正式出任董事长，2020年后任首席投资官，主导公司全球化并购战略。\n\n在李朝春担任公司董事长后，洛阳钼业对外并购按下了加速键。2016年，洛阳钼业启动了公司自成立以来最重要的一笔并购，以26.5亿美元收购自由港持有的TFM56%权益；2019年，洛阳钼业又以11.36亿美元收购了TFM24%股权。\n\n为了收购该矿，洛阳钼业四处融资，例如向国内银行财团申请了累计15.9亿美元的银团贷款，此后又通过资本市场定增募资180亿元。\n\n而如此大规模的资本运作也离不开袁宏林的运作。公开资料显示，袁宏林2013年加入洛阳钼业，加入洛阳钼业之前，其长期在银行体系任职，擅长信贷结构设计、融资、风控和资产负债管理。加入洛阳钼业后，他出任洛钼非执行董事，主要负责融资方案、债务结构、风险管控等。\n\n在两人携手运作下，2020年洛阳钼业又以5.5亿美元拿下KFM（Kisanfu）铜钴矿95%的权益，凭此，洛阳钼业成为国内仅次于紫金矿业的铜矿开采商。2026年，公司利润极有可能达到300亿元。\n\n有意思的是，在洛阳钼业成为世界级矿业巨头后，李朝春和袁宏林因个人原因于2025年4月辞去相关职务。两人的离职也让外界对洛阳钼业未来的经营颇为关注。\n\n洛阳钼业持续扩大的前提是逆周期扩产，在行业低谷时买下铜矿，如2016年买下TFM56%权益时，国际铜价已经经历了长时间的下跌，彼时LME铜价还不到4500美元/吨。\n\n袁宏林也曾公开表示，洛阳钼业的扩张，得益于前期吃到了逆周期扩产的红利。\n\n此次李朝春和袁宏林离开董事会后，洛阳钼业聘请在油气和自然资源领域深耕20多年的刘建锋担任公司董事长和首席投资官，同时聘请矿业技术出身的阙朝阳担任常务副总裁和首席运营官。\n\n而在新旧管理层更替之际，2025年6月洛阳钼业又耗资5.81亿加元收购厄瓜多尔凯歌豪斯金矿，并在年末以10.15亿美元再次收购了巴西四座在产金矿。今年4月，洛阳钼业又在阿曼投资约24亿阿曼里亚尔建设年产53万吨的电解铝综合项目。\n\n但公司并购金矿时，黄金价格正处在高位，阿曼电解铝项目与伊朗隔海峡相望，地缘变量持续存在。\n\n因此，外界也担心公司新管理层是否不再遵循以前管理层低价买矿的策略。对此，「创业最前线」试图向洛阳钼业求证，截至发稿未获回复。\n\n03 股价跌超57%，实控人身家蒸发超700亿元\n\n虽然公司利润持续增长，但自2026年2月以来，公司在资本市场表现却不理想，股价从最高28.24元/股跌至11.89元/股，不到一年时间，公司股价累计跌超57%（注：以上均为复权后价格）。\n\n在股价大跌的背景下，公司实控人于泳也损失惨重。天眼查显示，洛阳钼业控股股东为鸿商产业控股集团有限公司，截至2026年9月30日，该企业持有洛阳钼业24.93%股权，而于泳又持有鸿商产业控股集团有限公司99%的股权，于泳顺理成章成为洛阳钼业实控人。\n\n图 / 天眼查\n\n作为市值超2500亿元的全球矿业巨头实控人，于泳个人非常低调。根据有限的资料报道，于泳出生于1961年，在创办鸿商产业控股集团有限公司以前，其先后担任瓦房店造纸厂工会主席、生产副厂长、大连东立工艺纺织品有限公司总经理。\n\n这也就意味着，创立鸿商产业控股集团有限公司之前，于泳的身份是东北一座小城的造纸厂干部和纺织品公司经理，跟矿业没有一丝关系。2003年，他成立鸿商产业控股集团有限公司，注册资本为1.8亿元。\n\n2004年，成立不久的鸿商产业控股集团有限公司便以1.78亿元买下债务缠身的洛阳钼业49%股权，彼时洛阳钼业的实际控制人依旧是栾川县国资，于泳依然未能掌控洛阳钼业的控制权。此后，随着洛阳钼业在A股及港股上市，栾川县国资及鸿商产业控股集团有限公司持有的股权均被稀释。\n\n2014年，鸿商集团通过在二级市场增持洛阳钼业股权至36.01%，取代洛矿集团成为控股股东，于泳也顺利成为洛阳钼业实际控制人。\n\n成为洛阳钼业的实控人后，于泳公开露面的次数并不多，企业明面上的经营管理也主要由李朝春和袁宏林等管理层负责。\n\n但这并不妨碍洛阳钼业持续发展壮大。2026年1月29日，公司股价最高涨至28元/股以上，市值最高突破5700亿元。凭借对洛阳钼业的间接持股，于泳个人身家最高突破1400亿元。\n\n好景不长，随着2月以来洛阳钼业股价持续回落，公司市值蒸发超3000亿元，于泳个人持股市值蒸发超700亿元。\n\n在公司股价大跌的背景下，洛阳钼业也推出了10亿元至20亿元的回购计划，并已经取得招商银行上海分行不超过18亿元的回购贷款专用额度。但仅凭此是否能让洛阳钼业股价企稳回升，还需要时间证明。\n\n在新能源持续发展、AI数据中心建设持续加速的背景下，市场对铜的需求将持续旺盛，作为国内头部铜矿企业的洛阳钼业也将充分受益。但短期内，在美联储加息影响下，铜价有持续下跌的风险，洛阳钼业在资本市场的股价表现或将受到影响。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca302247509","title":"《GTA 6》登場撞正AI泡沫疑慮兼美股急瀉 「GTA金融魔咒」29年內7度應驗","url":"https://www.stheadline.com/realtime-finance/3639197/GTA-6登場撞正AI泡沫疑慮兼美股急瀉-GTA金融魔咒29年內7度應驗","summary":"全球玩家期待逾13年的《俠盜獵車手6》（Grand Theft Auto VI，簡稱《GTA 6》）昨日（19日）正式發售，近日網上卻流傳一份歷代GTA遊戲與金融危機的時間對照表，發現多款作品面世時…","summary_short":"全球玩家期待逾13年的《俠盜獵車手6》（Grand Theft Auto VI…","digest":"全球玩家期待逾13年的《俠盜獵車手6》（Grand Theft Auto VI…","points":["全球玩家期待逾13年的《俠盜獵車手6》（Grand Theft Auto VI…","今次新作登場正值人工智能（AI）泡沫疑慮升溫，美股三大指數同日齊跌逾2%，究竟純屬巧合…","歷代GTA屢撞金融危機 6次巧合惹熱議"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:25:31+08:00","size":1,"keywords":[],"body":"全球玩家期待逾13年的《俠盜獵車手6》（Grand Theft Auto VI，簡稱《GTA 6》）昨日（19日）正式發售，近日網上卻流傳一份歷代GTA遊戲與金融危機的時間對照表，發現多款作品面世時，恰巧碰上亞洲金融風暴、科網泡沫及金融海嘯等重大事件，在網上被戲稱為「GTA金融魔咒」。今次新作登場正值人工智能（AI）泡沫疑慮升溫，美股三大指數同日齊跌逾2%，究竟純屬巧合，還是「魔咒」再度應驗？\n歷代GTA屢撞金融危機 6次巧合惹熱議\n近日社交平台Threads有用戶以「GTA上市真的很會選時間」為題，整理自1997年以來的系列作品，發現遊戲推出的年份多次與全球重大經濟事件重疊，引發熱議。\n1997年《GTA》碰上亞洲金融風暴。 首代遊戲面世同年，泰國於7月放棄泰銖與美元掛鈎，引發席捲亞洲多地的金融風暴，香港股市亦受到衝擊。\n1999年《GTA 2》遇上科網泡沫。 當時互聯網熱潮席捲全球，大量資金湧入科技股，納斯達克指數全年急升約86%，惟泡沫於翌年開始破裂。\n2001年《GTA 3》撞正科網泡沫破滅。 科技股持續暴跌，大批科網企業倒閉，美國更於當年3月陷入經濟衰退，而遊戲則在10月推出，正值市場低迷之際。\n2008年《GTA 4》與金融海嘯同年。 遊戲於4月面世，當時美國次按危機持續蔓延，至9月投資銀行雷曼兄弟倒閉，觸發全球金融市場恐慌，成為最具代表性的「魔咒」巧合之一。\n2013年《GTA 5》碰上歐債危機餘波。 歐洲當時仍未完全擺脫主權債務危機，塞浦路斯更於同年爆發銀行危機，需要尋求國際救助，令歐元區金融穩定再受關注。\n2021年《GTA：三部曲—最終版》遇上疫情陰影。 全球經濟仍受新冠疫情反覆影響，供應鏈受阻、物流成本上漲及通脹壓力加劇。雖然當年推出的只是舊作重製合集，仍被列入「金融魔咒」時間表。\n\n第7次巧合撞AI泡沫疑慮 美股亞股接連急挫\n今次《GTA 6》登場，適逢市場近期對AI企業估值及巨額資本開支的疑慮 升溫，引發AI泡沫的憂慮。\n而在《GTA 6》發售日，美股三大指數全線急挫，道指瀉1,101點或2.19%，失守5萬點大關，標普500指數及納指分別跌2.02%及2.25%。跌勢翌日蔓延至亞洲，日韓台股市早段顯著受壓，多隻AI概念股遭拋售。\n事實上，市場對AI投資前景的疑慮早已浮現。美國聯儲局本月13日發表的金融穩定報告顯示，87%受訪市場人士將AI列為金融穩定風險之一，高於半年前的50%，主要憂慮巨額AI投資未能帶來預期回報。\n更巧合的是，《GTA 6》發售當日，AI初創企業Anthropic亦在納斯達克掛牌，首次公開招股（IPO）集資約810億美元，創全球IPO紀錄，惟這隻焦點新股表現「虎頭蛇尾」，初段一度較招股價高出近39%，但之後升幅逐步收窄，最終收市僅升17%，盤後股價更下挫近半成。\n相關文章：美股日誌｜道指再跌千點 5萬大關失守 Anthropic登場變瀉藥","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0f1ca04802","title":"Meta拟推出Muse Charm，定价为300美元","url":"https://www.jiemian.com/article/15354030.html","summary":"当地时间11月19日，据报道，知情人士表示，Meta计划将其即将推出的Muse Charm设备定价为300美元，并提供用户补贴。","summary_short":"当地时间11月19日，据报道，知情人士表示，Meta计划将其即将推出的Muse Charm设备定价为300美元…","digest":"当地时间11月19日，据报道，知情人士表示…","points":["当地时间11月19日，据报道，知情人士表示，Meta计划将其即将推出的Muse Charm设…","该公司还计划为用户提供最长12个月的Verizon免费5G网络服务，以加快Muse的响应速度","报道称，当被问及价格和其他新信息时，Meta发言人Tyler Yee表示…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T11:23:16+08:00","size":1,"keywords":[],"body":"当地时间11月19日，据报道，知情人士表示，Meta计划将其即将推出的Muse Charm设备定价为300美元，并提供用户补贴。该公司还计划为用户提供最长12个月的Verizon免费5G网络服务，以加快Muse的响应速度。\n\n报道称，当被问及价格和其他新信息时，Meta发言人Tyler Yee表示：“我们对大家对AI设备的兴趣感到欣喜，很快会有更多消息分享。”","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0e02bc6a22","title":"Anthropic盤後曾挫半成 專家：高估值任何瑕疵也捱沽 料美股再回調最多8%","url":"https://www.stheadline.com/stock-market/3639188/Anthropic盤後曾挫半成-專家高估值任何瑕疵也捱沽-料美股再回調最多8","summary":"Anthropic破紀錄上市，首日股價曾較招股價升近39%，惟收市升幅收窄至約17%，盤後更一度挫4.7%見92.6美元，美股三大指數同日亦高開低走。","summary_short":"Anthropic破紀錄上市，首日股價曾較招股價升近39%，惟收市升幅收窄至約17%…","digest":"Anthropic破紀錄上市，首日股價曾較招股價升近39%，惟收市升幅收窄至約17%…","points":["Anthropic破紀錄上市，首日股價曾較招股價升近39%，惟收市升幅收窄至約17%…","高富金融集團投資總監梁偉民接受《星島頭條》訪問時表示…","標普500指數及納斯達克綜合指數於周四（19日）均跌逾2%，道指則自6月以來首次收於50…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:02:19+08:00","size":1,"keywords":[],"body":"Anthropic破紀錄上市，首日股價曾較招股價升近39%，惟收市升幅收窄至約17%，盤後更一度挫4.7%見92.6美元，美股三大指數同日亦高開低走。高富金融集團投資總監梁偉民接受《星島頭條》訪問時表示，仍擔心Anthropic短期跌穿83美元招股價，並認為美股大市可能再回調5%至8%，高估值及加息風險是主要壓力。\n標普500指數及納斯達克綜合指數於周四（19日）均跌逾2%，道指則自6月以來首次收於50,000點以下。\n相關文章：Anthropic今夜上市倒數 難望複製SpaceX炒風 專家：不排除跌穿招股價\n首日升幅明顯收窄\nAnthropic以每股83美元定價，IPO連同私募合共集資約1,073億美元，全面攤薄估值約1.5萬億美元。股份首日開報111.50美元，較招股價升約34.3%，最高見115.10美元，升約38.7%，其後持續回吐，最終收報97.17美元，較招股價升約17.1%。\n據雅虎財經比較21宗大型美國IPO的交易數據，Anthropic開市後首半小時較開市價跌約13%，是其2008年以來大型IPO比較樣本中最差的表現。\n梁偉民指出，Anthropic最終定價高於原先70至78美元的招股範圍，雖然拉高了上市估值，亦增加短期跌穿招股價的風險。他認為，公司估值昂貴，一旦市場樂觀情緒進一步降溫，股價便容易受壓。\n他以收入增長為例，指出第三季按季增幅由第二季逾一倍，放緩至約五成。他承認，收入基數擴大令增速減慢難以避免，公司按年增長亦仍達約11倍，但去年基數低同樣有影響。在高估值下，「任何瑕疵」都可能被市場用作沽售藉口。\n首日走勢亦未令他改變看法。梁偉民形容，股價除了最初幾分鐘衝高，其後大部分時間只在較低位置反覆，「動力明顯唔夠強」。\n美股仍有回調空間 留意中東及油價\n對於美股後市，梁偉民認為，大市仍可能再回落5%至8%。他解釋，早前AI樂觀情緒推高不少科技股，令部分估值昂貴，甚至不合理；如今情緒降溫，這些股份自然有更大回調空間。\n他指出，市場亦開始擔心加息，以及加息對經濟、企業盈利和股市氣氛的影響。過去一個月樂觀情緒持續下降，大市若繼續調整，亦不利Anthropic表現。\n梁偉民強調，「市場情緒無得估」，至於加息會否持續、幅度會否進一步擴大，仍要觀察中東局勢及其對油價走勢的影響。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c80b8ed6e21","title":"一卡玩转长三角！来文博会解锁展内展外多元新体验","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735115.shtml","summary":"11月19日，第七届长三角国际文化产业博览会在国家会展中心(上海)开幕。","summary_short":"11月19日，第七届长三角国际文化产业博览会在国家会展中心(上海)开幕。","digest":"11月19日，第七届长三角国际文化产业博览会在国家会展中心(上海)开幕","points":["11月19日，第七届长三角国际文化产业博览会在国家会展中心(上海)开幕","本届文博会以“促进文商旅体展融合发展、激发文化消费新活力”为主题，展期持续至11月22日","本届文博会汇聚1500家参展商，来自全国54个省、地级行政区及海外代表团参展…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:00:22+08:00","size":1,"keywords":[],"body":"11月19日，第七届长三角国际文化产业博览会在国家会展中心(上海)开幕。本届文博会以“促进文商旅体展融合发展、激发文化消费新活力”为主题，展期持续至11月22日。开幕式上，“长三角文化消费季”同步启动，“长三角随心游权益卡”正式发布。\r\n\n　　展馆之内\n\n　　一场能逛、能玩、也能买的嘉年华\n\n　　本届文博会汇聚1500家参展商，来自全国54个省、地级行政区及海外代表团参展，163场各类活动轮番上演。可参与式体验成为本届文博会一大亮点。\n\n　　开馆不久，展馆里的热门动线已经初见雏形：\n\n　　集章打卡路线沿途排起小队，观众举着集章手册在各展位间穿梭；\n\n　　文创IP灵感路线上，汉服、香囊、团扇的摊位前围了一圈人；\n\n　　非遗工坊里，制笔、拓印、丝绸的现场演示让不少人停下脚步；\n\n　　潮玩区的新品首发台前，年轻人举着手机拍照、下单；\n\n　　IP沉浸式剧场和潮流运动体验区，观众不仅能看展，还能“玩展”。\n\n　　来自浙江丽水的摩崖石刻拓印技艺搬到展会现场，把留在山野石壁上的石刻做成可复刻的体验：观众润湿宣纸敷上石面，棕刷逐寸敲击排气，少量多次分层上墨，十分钟内就能揭下一张拓片带走；上海闵行区的手工匠人在现场开起了手作工坊，邀请观众一同体验给皮影素坯上色的工艺，参与观众用水色自己配色，在老师傅的指导下做出一片一片特色不同的专属皮影作品。\n\n　　消费季联动全国参展商推出折扣、满减、满赠等优惠，覆盖演出、潮玩、文博、非遗、家居、服饰、老字号、科技八大品类，每个品类约10家，联动展商规模超过75家。演艺联动是一大看点：上海话剧艺术中心把售票台搬到展位，现场购票享专属折扣，购任意演出票另有周边好礼相赠；淮安西游乐园把“世界美食之都”系列毛绒带到现场，让乐园IP走出园区。\n\n　　展期之外\n\n　　“消费季”登场 长三角随心畅游\n\n　　“长三角文化消费季”于19日当天在上海同步启动，120余场专属活动同步上线。11月至12月，15家展商的品牌门店接续联动，观众凭文博会线上入场凭证，在馆外门店同样可以享受专属折扣、满减或满赠。宜兴紫砂、香醋饮品、文创围巾，到遗址文创、手作布鞋、现制茶饮，各展商把最具代表性的产品放进了延续权益清单。\n\n　　此外，开幕式上还发布了“长三角随心游权益卡”，三省一市的权益池可自由组合，内容不仅包含传统景区门票优惠，还有演出、展览、运动场馆、特色体验、文创产品等多元消费场景，整合长三角区域重点文化旅游资源，构建“一册通玩、多城联动”的消费互通网络；“随心游”数字化平台同步上线，新增电子打卡地图、积分兑换机制和行程规划功能，让行程规划一键串起跨城的“吃住行游购娱”。\n\n　　(总台记者 刘潇凡 黄天奕） 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c015f1bfa5f","title":"汽车早报｜马斯克称特斯拉会继续在中国提高产量 丰田在美召回约31.4万辆汽车","url":"https://www.jiemian.com/article/15332795.html","summary":"中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆  据中国汽车工业协会统计分析，2026年1-10月，汽车销量排名前十位的企业（集团）共销售2226.1万辆…","summary_short":"中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆  据中国汽车工业协会统计分析，2026年1-10月…","digest":"中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆  据中国汽车工业协…","points":["中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆","据乘联分会消息，综合头部厂商目标完成进度推算，11月狭义乘用车零售市场规模约163万辆…","据玉渊潭天，11月19日，中国贸促会会长任鸿斌会见特斯拉公司首席执行官埃隆·马斯克"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:33:00+08:00","size":1,"keywords":[],"body":"中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆\n\n据中国汽车工业协会统计分析，2026年1-10月，汽车销量排名前十位的企业（集团）共销售2226.1万辆，占汽车销售总量的84.7%。在上述十家企业中，与去年同期相比，吉利控股和奇瑞控股销量呈不同程度增长，其他企业销量均呈不同程度下降。\n\n乘联分会：预计11月狭义乘用车零售市场规模约163万辆，环比下降1.1%\n\n据乘联分会消息，综合头部厂商目标完成进度推算，11月狭义乘用车零售市场规模约163万辆，环比下降1.1%；新能源全月零售预计可达115万辆左右，渗透率约70.6%，成为当前市场最主要的支撑力量。\n\n吉林：发展智能网联汽车，支持迭代高阶自动驾驶技术\n\n吉林省人民政府办公厅印发《吉林省“人工智能+”发展“十五五”规划》，其中提出，培育智能消费新产品，发挥光电信息、精密制造等产业优势，丰富消费级智能终端产品，发展智能网联汽车，支持迭代高阶自动驾驶技术，开发智能座舱产品，推进车载端侧大模型部署，支持本地化推理决策与智能服务，发展健康养老、教育、文旅等场景智能可穿戴设备，支持研发具备多模态感知和场景自适应解决能力的具身智能机器人产品，推进在情感陪伴、家务辅助、康养护理等场景应用示范，加快人工智能与元宇宙、增材制造、脑机接口等前沿技术融合创新，探索发展新型智能产品。\n\n马斯克：特斯拉会继续在中国提高产量\n\n据玉渊潭天，11月19日，中国贸促会会长任鸿斌会见特斯拉公司首席执行官埃隆·马斯克。马斯克表示，他是中国的超级粉丝，中国有太多宏伟壮观的建筑与自然景观，他尤其点赞了中国的铁路系统。他还表示，特斯拉会继续在中国提高产量。据悉，这是马斯克首次公开到访深圳。抵达深圳后，马斯克还在社交平台上发文表示所谓“修昔底德陷阱”能够被避免。\n\n奇瑞控股集团增资至63.9亿元，增幅约10%\n\n天眼查App显示，11月16日，奇瑞控股集团有限公司发生工商变更，新增工融金投二号（北京）新兴产业股权投资基金合伙企业（有限合伙）为股东，同时，注册资本由约58.2亿元人民币增至约63.9亿元人民币，增幅约10%。\n\n该公司成立于2010年10月，法定代表人为尹同跃，经营范围包括汽车及汽车零部件生产与研发、汽车修理、机械加工、造船、房地产开发与建设的投资管理等，现由芜湖市投资控股集团有限公司、芜湖瑞创投资股份有限公司及上述新增股东等共同持股。\n\n华境S五座版正式官宣\n\n11月19日，华境汽车正式官宣华境S五座版本，新版本延续六座版的智能和安全底座，车身尺寸长5235mm、宽1999mm、高1800mm，轴距3105mm，全系配备华为乾崑智驾ADS 5 Pro与鸿蒙座舱5.2。\n\n宝马新世代i3车型将于广州车展开启订购\n\n11月19日，宝马中国宣布，新世代BMW i3将于11月27日在广州车展上市，大订通道同步开启。新车采用全国统一价模式，无需小订。\n\n马斯克披露多项业务时间表：Optimus拟18个月内胜任家务，Terafab计划2028年底量产\n\n当地时间11月18日，特斯拉CEO埃隆·马斯克通过视频连线参加美国奥斯汀举行的TomorrowX峰会，并披露旗下多项业务进展。他表示，Optimus人形机器人有望在未来12至18个月内完成洗碗、清洗烘干并收纳等家务；Terafab研究工厂计划于明年6月试产首款测试芯片，并争取在2028年底实现第一阶段量产；xAI目前每月新增约0.5吉瓦算力，明年将提高至每月超过1吉瓦。\n\n马斯克还称，星舰实现完全、快速重复使用后，进入轨道的成本有望降低约100倍；Neuralink目前已为30多名受试者植入脑机接口设备。谈及英伟达时，他将CEO黄仁勋比作迈克尔·乔丹，称其是科技企业创始人中的顶尖人物，若失去黄仁勋的领导，对英伟达将是重大打击。\n\n丰田在美召回约31.4万辆汽车，涉及安全气囊隐患\n\n11月19日，美国国家公路交通安全管理局（NHTSA）公告显示，丰田汽车将召回314,029辆汽车，涉及部分2002—2010款雷克萨斯SC430、2011款IS250、2017款GX460，以及2003—2008款丰田卡罗拉、2005—2006款坦途、2005—2007款红杉和2016—2017款4Runner。召回原因是部分车辆配备的高田前排乘客安全气囊充气装置可能因长期暴露于高湿度、高温及温度反复变化的环境而发生性能退化，导致充气装置破裂，金属碎片可能击中驾驶员或其他乘员，造成严重伤害甚至死亡。\n\n未经正式授权严禁转载本文，侵权必究。汽车要闻\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n汽车早报｜马斯克称特斯拉会继续在中国提高产量 丰田在美召回约31.4万辆汽车\n\n华境S五座版正式官宣；宝马新世代i3车型将于广州车展开启订购。\n\n原创新闻陈小同 · 2026/11/20 08:33来源：界面新闻\n\n中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆\n\n据中国汽车工业协会统计分析，2026年1-10月，汽车销量排名前十位的企业（集团）共销售2226.1万辆，占汽车销售总量的84.7%。在上述十家企业中，与去年同期相比，吉利控股和奇瑞控股销量呈不同程度增长，其他企业销量均呈不同程度下降。\n\n乘联分会：预计11月狭义乘用车零售市场规模约163万辆，环比下降1.1%\n\n据乘联分会消息，综合头部厂商目标完成进度推算，11月狭义乘用车零售市场规模约163万辆，环比下降1.1%；新能源全月零售预计可达115万辆左右，渗透率约70.6%，成为当前市场最主要的支撑力量。\n\n吉林：发展智能网联汽车，支持迭代高阶自动驾驶技术\n\n吉林省人民政府办公厅印发《吉林省“人工智能+”发展“十五五”规划》，其中提出，培育智能消费新产品，发挥光电信息、精密制造等产业优势，丰富消费级智能终端产品，发展智能网联汽车，支持迭代高阶自动驾驶技术，开发智能座舱产品，推进车载端侧大模型部署，支持本地化推理决策与智能服务，发展健康养老、教育、文旅等场景智能可穿戴设备，支持研发具备多模态感知和场景自适应解决能力的具身智能机器人产品，推进在情感陪伴、家务辅助、康养护理等场景应用示范，加快人工智能与元宇宙、增材制造、脑机接口等前沿技术融合创新，探索发展新型智能产品。\n\n马斯克：特斯拉会继续在中国提高产量\n\n据玉渊潭天，11月19日，中国贸促会会长任鸿斌会见特斯拉公司首席执行官埃隆·马斯克。马斯克表示，他是中国的超级粉丝，中国有太多宏伟壮观的建筑与自然景观，他尤其点赞了中国的铁路系统。他还表示，特斯拉会继续在中国提高产量。据悉，这是马斯克首次公开到访深圳。抵达深圳后，马斯克还在社交平台上发文表示所谓“修昔底德陷阱”能够被避免。\n\n奇瑞控股集团增资至63.9亿元，增幅约10%\n\n天眼查App显示，11月16日，奇瑞控股集团有限公司发生工商变更，新增工融金投二号（北京）新兴产业股权投资基金合伙企业（有限合伙）为股东，同时，注册资本由约58.2亿元人民币增至约63.9亿元人民币，增幅约10%。\n\n该公司成立于2010年10月，法定代表人为尹同跃，经营范围包括汽车及汽车零部件生产与研发、汽车修理、机械加工、造船、房地产开发与建设的投资管理等，现由芜湖市投资控股集团有限公司、芜湖瑞创投资股份有限公司及上述新增股东等共同持股。\n\n华境S五座版正式官宣\n\n11月19日，华境汽车正式官宣华境S五座版本，新版本延续六座版的智能和安全底座，车身尺寸长5235mm、宽1999mm、高1800mm，轴距3105mm，全系配备华为乾崑智驾ADS 5 Pro与鸿蒙座舱5.2。\n\n宝马新世代i3车型将于广州车展开启订购\n\n11月19日，宝马中国宣布，新世代BMW i3将于11月27日在广州 ”正展现良好的发展前景和广阔的市场空间。当前新型科技革命和产业变革加速突破，特别是以人工智能为代表的新一代信息技术，加速赋能行业深度融合，对工业互联网、网络互联、数据质量、平台建设提出了新的要求。对此，工信部将坚持系统布局，优化工业互联网新架构，深化迭代支撑“人工智能+制造”的新型工业互联网体系架构，巩固网联基础，突出智联能力，布局一批重大工程、重点项目，加强政策、基础设施、应用生态协同推进。同时，夯实新一代智能制造新结构，深入实施智能工厂梯度培育行动，支持领军企业建设，有序开展工业5G独立专网试点，加大5G工厂建设，启动新一批“5G+工业互联网”融合应用试点，加强6G与工业融合的前瞻研究。（人民财讯）\n\n未经正式授权严禁转载本文，侵权必究。西子洁能\n\n西子洁能：终止筹划发行H股并在港交所上市事项16小时前\n西子洁能(002534.SZ)：副总经理姜龙因个人原因辞任，仍留任公司任职2个月前\n\n资本风云\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n西子洁能\n11月20日投资早报|中青旅公开挂牌转让青乐文旅51%股权，兴业证券发行不超150亿元短期债券获批，西子洁能终止筹划发行H股股票\n\n今晨，这些重要的投资信息你需要知道\n\n原创新闻李科峰 · 2026/11/20 08:30来源：界面新闻\n\n【隔夜行情】\n\n•周四（2026年11月19日），A股三大股指集体下跌，截至收盘，上证综指跌0.28%，报3577.62点；深证成指跌0.71%，报10583.2点；创业板指跌0.79%，报2293.34点。沪深两市成交总额13051.47亿元，较前一个交易日缩量约645.55亿元。\n\n•周四（2026年11月19日），恒生指数跌1.95%，恒生科技指数跌2.33%。大型科网股下挫，腾讯控股跌超6%，阿里巴巴跌超5%，百度集团跌近5%，小米集团、美团跌超3%。黄金股走弱，灵宝黄金跌7%，紫金黄金国际跌超5%，老铺黄金跌超4%，山东黄金跌超1%。\n\n【今日新股】\n\n今日无新股上市，无新股申购。\n\n【重要新闻】\n\n【乘联分会：10月狭义乘用车零售164.8万辆，同比下降26.9%】中国汽车流通协会乘用车市场信息联席分会数据显示，10月狭义乘用车零售164.8万辆，同比下降26.9%，环比微增1.7%。其中，燃油车终端零售53.3万辆，与此前预测一致，同比降幅进一步扩大至45%；新能源零售111.4万辆，渗透率67.6%，再创新高。\n\n【工信部：启动新一批“5G+工业互联网”融合应用试点，加强6G与工业融合的前瞻研究】11月19日，工业和信息化部总经济师高东升在2026中国5G+工业互联网大会上表示，我国“5G+工业互联网”正展现良好的发展前景和广阔的市场空间。当前新型科技革命和产业变革加速突破，特别是以人工智能为代表的新一代信息技术，加速赋能行业深度融合，对工业互联网、网络互联、数据质量、平台建设提出了新的要求。对此，工信部将坚持系统布局，优化工业互联网新架构，深化迭代支撑“人工智能+制造”的新型工业互联网体系架构，巩固网联基础，突出智联能力，布局一批重大工程、重点项目，加强政策、基础设施、应用生态协同推进。同时，夯实新一代智能制造新结构，深入实施智能工厂梯度培育行动，支持领军企业建设，有序开展工业5G独立专网试点，加大5G工厂建设，启动新一批“5G+工业互联网”融合应用试点，加强6G与工业融合的前瞻研究。（人民财讯）\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c02b6dd8ef6","title":"土耳其卡塔尔共同防御协议不含自动派兵条款","url":"https://www.jiemian.com/article/15352860.html","summary":"土耳其国防部11月19日表示，此前与卡塔尔签署的共同防御协议不含一方遭受攻击时另一方自动派兵支援的条款。","summary_short":"土耳其国防部11月19日表示，此前与卡塔尔签署的共同防御协议不含一方遭受攻击时另一方自动派兵支援的条款。","digest":"土耳其国防部11月19日表示…","points":["土耳其国防部11月19日表示，此前与卡塔尔签署的共同防御协议不含一方遭受攻击时另一方自动派兵…","阿克蒂尔克表示，协议实施的相关决策将由两国联合成立的高级战略委员会协商作出…","阿克蒂尔克说，共同防御协议自生效起有效期为10年…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:22:40+08:00","size":1,"keywords":[],"body":"土耳其国防部11月19日表示，此前与卡塔尔签署的共同防御协议不含一方遭受攻击时另一方自动派兵支援的条款。土耳其与卡塔尔于本月13日签署共同防御协议。阿克蒂尔克表示，协议实施的相关决策将由两国联合成立的高级战略委员会协商作出，目前尚未就该协议涉及的人员、军事力量及资金分配作出具有约束力的决定。阿克蒂尔克说，共同防御协议自生效起有效期为10年，此后将在满足既定条件的情况下以5年为期进行续约。土耳其作为北约成员国的权利和义务将予以保留。（新华社）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c58e4af32ea","title":"库什纳称俄罗斯同意欧洲参与多边谈判","url":"https://www.jiemian.com/article/15352851.html","summary":"美国总统特朗普的女婿库什纳11月19日在柏林表示，俄罗斯已同意欧洲参加多边谈判机制。","summary_short":"美国总统特朗普的女婿库什纳11月19日在柏林表示，俄罗斯已同意欧洲参加多边谈判机制。","digest":"美国总统特朗普的女婿库什纳11月19日在柏林表示，俄罗斯已同意欧洲参加多边谈判机制","points":["美国总统特朗普的女婿库什纳11月19日在柏林表示，俄罗斯已同意欧洲参加多边谈判机制","在当天举行的“志愿联盟”会议后，库什纳与欧洲多国领导人共同出席记者会时说…","他说，俄方能够接受乌克兰获得类似《北大西洋公约》第五条集体防御条款的安全保障…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:21:06+08:00","size":1,"keywords":[],"body":"美国总统特朗普的女婿库什纳11月19日在柏林表示，俄罗斯已同意欧洲参加多边谈判机制。在当天举行的“志愿联盟”会议后，库什纳与欧洲多国领导人共同出席记者会时说，重启欧洲与俄罗斯直接对话尤为重要，双方将直接听取彼此的诉求。他说，俄方能够接受乌克兰获得类似《北大西洋公约》第五条集体防御条款的安全保障，同时也表达了不再爆发新冲突的意愿。库什纳强调，相关安全保障需要建立一套涵盖监督核查、威慑等措施的机制，这是一项重大举措，特朗普对此也持开放态度，但前提是必须符合美国利益。（新华社）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c14c068646d","title":"有中国公民在委内瑞拉遭网络电信诈骗，中使馆发布提醒","url":"https://www.jiemian.com/article/15352849.html","summary":"11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报，有我公民在委遭到网络电信诈骗并蒙受经济损失。","summary_short":"11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报，有我公民在委遭到网络电信诈骗并蒙受经济损失。","digest":"11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报…","points":["11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报…","一、请务必保持高度警惕和反诈意识，切勿轻信互联网平台和社交软件上的“婚恋交友”…","二、下载手机应用软件“全民反诈”APP，关注“国家反诈中心”、“北京反诈”…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:19:34+08:00","size":1,"keywords":[],"body":"11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报，有我公民在委遭到网络电信诈骗并蒙受经济损失。中国驻委内瑞拉使馆再次提醒在委中国公民：\n\n一、请务必保持高度警惕和反诈意识，切勿轻信互联网平台和社交软件上的“婚恋交友”、“理财指导”、“优惠换汇”等诱导信息，以免落入不法分子圈套。\n\n二、下载手机应用软件“全民反诈”APP，关注“国家反诈中心”、“北京反诈”、“广东反诈中心”或“江门邑反诈”等微信公众号，熟悉和了解电信诈骗典型案例，提高辨识和自我防护能力。如遭此类电信诈骗，立即联系有关银行或平台终止转账或支付流程，将损失降到最低，同时通过“全民反诈”APP进行举报，亦可向国内户籍所在地公安机关报案。\n\n驻委内瑞拉使馆领事保护与协助电话（24小时）：0058-(0)414-3669883（注：境外号码拨打0058-414-3669883，境内号码拨打0414-3669883即可。）\n\n外交部全球领事保护与服务应急热线(24小时)：\n\n0086-10-12308或0086-10-65612308","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"生活","total":23,"items":[{"id":"c2a0e6c8c88","title":"TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學 黃劍文為貪食錯失8萬3被嘲「雞髀文」","url":"https://www.stheadline.com/film-drama/3639129/TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學-黃劍文為貪食錯失8萬3被嘲雞髀文","summary":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠，而與8萬3千簽帳額錯身而過，顏志恆與黃劍文合照，更拍拍他以示鼓勵。","summary_short":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠，而與8萬3千簽帳額錯身而過，顏志恆與黃劍文合照…","digest":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠…","points":["《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠…","顏志恒獨得台慶大獎超開心，他指參加台慶第3年，但每年都進入台慶大獎最後環節…","顏志恆稱身為爸爸，會好好運用讓兒子升學之用，也會買補品給老婆…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:15:53+08:00","size":8,"keywords":[],"body":"《中年好聲音》顏志恒獨得45萬簽帳額台慶大獎，至於黃劍文則因不在錄影廠，而與8萬3千簽帳額錯身而過，顏志恆與黃劍文合照，更拍拍他以示鼓勵。\n顏志恒第3年參加終中獎\n顏志恒獨得台慶大獎超開心，他指參加台慶第3年，但每年都進入台慶大獎最後環節，今次終於在「開口中」到贏得獎金這一步，談到有得獎運？顏志恒笑只有大家見到這些，從未中過六合彩。問到如何運用？顏志恆稱身為爸爸，會好好運用讓兒子升學之用，也會買補品給老婆，因她一直用心照顧他這個「大大仔」。\n肥媽開聲叫請食飯\n問會請《中》兄弟食飯？他笑言已被圍攻，要好多圍請盡《中》好幾季的家族，笑言肥媽也開聲叫請食飯。談到黃劍文錯失獎金，顏志恒笑言請他食20隻雞髀。\n顏志恒信《中5》換評審會變另一感覺\n至於有傳《中5》評審大換血，肥媽和周國豐傳被換走，顏志恒相信節目會變成另一個感覺，自己參加節目一直與大家相處，有感情，會緬懷自己參與一屆的賽制。\n黃劍文為雞髀錯失獎金\n而黃劍文談到錯失獎金，他表示參與紅地毯影相後忍不住去便利店食雞髀，突然收到兄弟打電話和短訊通知他得獎，已即時跑回錄影廠可惜已宣布新得獎者，「就係因為一隻雞髀！（好貴！）係啦！但我唔會唔食雞髀，只係大家都戥我唔抵，仲改我名做「雞髀文」，希望大家食雞髀想起我，可以接下雞髀廣告。談到顏志恒請他食雞髀？黃劍文稱更想食牛扒，又笑言想與曹永廉合照。黃劍文指也算有中獎運，接下來工作也多，除了成為《流行都市》主持班底，也正製作新的快歌，以及將演出音樂劇。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"TVB台慶2026丨顏志恒獨得45萬簽帳額留兒子升學 黃劍文為貪食錯失8萬3被嘲「雞髀文」","url":"https://www.stheadline.com/film-drama/36391 選。另外，TOPVALU 24吋行李喼亦劈價至$349.5，為準備出國旅遊的人士提供極佳選擇；而新手爸媽亦可鎖定激減至$1,599的GB POCKIT+ ALL-TERRAIN手推車。\n想要一次過以極低價買入多款精選商品，限量福車絕對是必搶目標。售價$399的「美酒福車」（總值$575）齊集三得利角瓶威士忌、白鶴酒造梅酒原酒等頂級佳釀，最適合三五知己在節日聚會中暢飲。而「HÓME CÓORDY廚具福車」只需$189，即包含輕量陶瓷塗層桌上鍋及易潔單柄鍋，實用度滿分，能輕鬆提升下廚體驗。\n週末必玩「限時放題」任裝車厘茄/鯖魚/SANRIO精品\n除了直接的價格折扣，活動更推出極具娛樂性及話題性的「限時放題」。在11月28日（六）及29日（日）的指定時段內，顧客只需使用專用袋或盒，便能以單一價格將日本車厘茄、無鹽去骨鯖魚、巴西雞中翼或指定SANRIO精品任裝至滿，充滿挑戰性又能為日常補給。此外，購買廣告商品滿$300，即可免費到顧客服務台帶走「Black Friday多用途自黏收納布」一個，方便整理家居小物件，換完即止。\nAEON Black Friday 週末限時放題時間表\n 日期 時間 指定任裝商品 11月28日（六） 2pm-3pm 日本車厘茄 11月28日（六） 4pm-5pm 無鹽去骨鯖魚、指定 SANRIO 商品 11月29日（日） 2pm-3pm 巴西雞中翼 11月29日（日） 4pm-5pm 指定 SANRIO 商品 AEON Black Friday 2026\n 活動日期：2026年11月20日（五）至12月6日（日）\n 活動地點：全線AEON、AEON STYLE 或 AEON SUPERMARKET\n 會員限定：購物滿$800或以上送$50電子優惠券（適用於12月7日至17日期間滿$150的交易）\n 備註：部分特價商品如行李喼、壽司等不適用於個別分店，請參閱店內海報說明\n資料來源：AEON Stores Hong Kong\n同場加映：一田日本秋祭大特價低至買1送1！380+款優惠時令食材/零食飲品/日用品 $79.9北海道黑牛/生蠔","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2ad51998a7","title":"聖誕節2026｜寫信給聖誕老人攻略 6大高回信率地址+4招寄信貼士","url":"https://www.stheadline.com/ohpama/3638832/聖誕節2026寫信給聖誕老人攻略-6大高回信率地址4招寄信貼士","summary":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。","summary_short":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。","digest":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人…","points":["聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人…","以下整合6大熱門聖誕老人收信地址、截郵時間及4招實用寄信貼士，家長不妨趁現時盡早陪子女動筆","德國郵政每年都會設立聖誕郵局，由聖誕老人與「聖誕天使」協助回覆世界各地小朋友的來信"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:13+08:00","size":1,"keywords":[],"body":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。以下整合6大熱門聖誕老人收信地址、截郵時間及4招實用寄信貼士，家長不妨趁現時盡早陪子女動筆！\n聖誕節2026｜德國郵政\n德國郵政每年都會設立聖誕郵局，由聖誕老人與「聖誕天使」協助回覆世界各地小朋友的來信。根據當地安排，聖誕老人將於2026年11月26日起回覆信件直至平安夜，信封上必須寫清楚寄件人地址以便寄回信件。\n資料圖片\n德國郵政\n收信地址： An den Weihnachtsmann, Weihnachtspostfiliale, 16798 Himmelpfort, Germany\n參考期限： 當地建議截郵日期為2026年12月13日（香港聖誕空郵截郵日為12月8日）\n聖誕節2026｜芬蘭羅瓦涅米聖誕老人總郵局\n位於北極圈羅瓦涅米的聖誕老人村被視為聖誕老人的官方故鄉，由芬蘭郵政運作的聖誕老人總郵局全年收信，每年處理逾50萬封信件。官方會處理來信並不時寄出回覆，但不保證每封信均獲免費回信（另設收費訂購信件服務）。由於國際郵遞需時，建議盡早寄出。\n（圖片來源：Posti網站）\n芬蘭羅瓦涅米聖誕老人總郵局\n收信地址： Santa Claus' Main Post Office, Tähtikuja 1, 96930 Arctic Circle, Finland\n參考期限： 香港聖誕空郵截郵日為12月8日（建議11月下旬前盡早空郵寄出，以提高在聖誕前收信的機會）\n更多詳情：按此\n\n聖誕節2026｜加拿大郵政\n加拿大郵政的聖誕老人回信計劃已有逾40年歷史，每年協助回覆世界各地逾100萬封信件，郵遞區號「H0H 0H0」正是諧音聖誕老人的笑聲。官方表示會回覆所有收到的信件，並按來信語言回覆，從香港寄出只需支付寄往加拿大的國際郵資，回信郵費由當地郵政負責。\n（圖片來源：Canada Post）\n加拿大郵政\n收信地址： Santa Claus, North Pole, H0H 0H0, Canada\n參考期限： 當地建議截郵日期為2026年12月9日（香港聖誕空郵截郵日為12月4日）\n更多詳情：按此了解\n法國郵政「聖誕老人秘書處」（Père Noël）\n法國郵政設有「聖誕老人秘書處」回覆兒童寄給 Père Noël 的信件，只要在信封背面填寫完整回郵地址即可申請回信。\n（AI生成示意圖）\n法國郵政「聖誕老人秘書處」（Père Noël）\n收信地址： Père Noël, 33500 Libourne, France\n參考期限： 香港聖誕空郵截郵日為12月3日\n香港郵政\n除了海外的聖誕老人郵政服務，本地其實亦有傳統的聖誕老人回信安排。一眾郵政人員便會化身聖誕老人小助手，逐一細讀孩子們的來信，並以聖誕老人回信給每位小朋友，讓在香港感受到節日氣氛。\n（圖片來源：政府新聞網圖片）\n香港郵政\n收信地址：香港中環康樂廣場2號香港郵政總局（信封面請註明「聖誕老人收」）\n同場加映：LEGO 聖誕樂仔收集小朋友的聖誕心願 \nThe LEGO Group 以全球企劃 The LEGO® Holiday Workshop 為靈感，邀請全港家庭走進充滿驚喜的節日拼砌世界。於指定時間內「寫信給聖誕樂仔」，填妥心意後寄到指定地址，即可收到聖誕樂仔的專屬回信，更有機會獲得聖誕禮物 。 \n官方圖片\n官方圖片\nLEGO\n活動日期：即日起至2027年1月3日\n參加方法：\n方法1：將信件以平郵方式寄往「Blk H, 12/F., Phase 4, Kwun Tong Ind. Ctr, 436 – 446 Kwun Tong Rd, Kwun Tong, Kln, H.K.」\n方法2：親身前往香港樂高®認證專門店索取專用信紙，寫下給「聖誕樂仔」的說話後，直接投入店內設置的聖誕郵箱即可。\n提高回信機率4個貼士\n（AI生成示意圖）\n1.清楚寫明回郵地址及格式\n在信封背面或左上角寫上孩子的姓名及完整英文回郵地址，最後加上「HONG KONG」，並確保收件人寫上「Santa Claus」或「Père Noël」等稱謂，以免無法寄回。\n2.內容自然簡潔，善用畫畫與貼紙\n信件毋須太長或太正式，可先自我介紹並分享近況或值得高興的事，再寫出願望；年紀較小或愛畫畫的孩子，可畫上聖誕樹、雪人或貼貼紙，增添童真與溫度。\n3.貼足國際郵票及留意截郵日期\n寄往海外前應按信件重量與目的地貼足國際郵票（可向郵局查詢或磅重）。需注意香港郵政的聖誕空郵截郵日只屬信件送抵目的地的參考，並非回信保證日期，預留充足郵遞時間、越早寄出越好。\n4.留意各地回信安排差異\n不同郵局的回信政策不同，部分表示會盡量或全數回覆，部分則不保證每封均獲回覆，家長宜與孩子一同平常心期待驚喜。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb5fa0f647d","title":"Oh!爸媽【聖誕4重賞】｜每週五解鎖神秘禮遇 暖笠笠迎聖誕","url":"https://www.stheadline.com/ohpama/3638585/Oh爸媽聖誕4重賞每週五解鎖神秘禮遇-暖笠笠迎聖誕","summary":"「又到聖誕…又到聖誕…","summary_short":"「又到聖誕…","digest":"「又到聖誕…又到聖誕…」Oh","points":["爸媽搜羅不同驚喜禮遇，玩樂體驗、親子好物應有盡有，與大小朋友共慶佳節","由11月23日開始，連續四星期不定時推出，記得緊貼最新公佈，一齊開心過聖誕","第一重賞(11月23日-11月26日)預告"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"「又到聖誕…又到聖誕…」Oh!爸媽搜羅不同驚喜禮遇，玩樂體驗、親子好物應有盡有，與大小朋友共慶佳節。由11月23日開始，連續四星期不定時推出，記得緊貼最新公佈，一齊開心過聖誕！\n第一重賞(11月23日-11月26日)預告\n禮遇登記連結: (11月23日中午12時開始不定時發放，大家密切留意Oh!爸媽平台最新公佈)\n第二重賞預告\n11月27日公佈，密切留意！\n\n第三重賞預告\n12月2日公佈，密切留意！\n\n第四重賞預告\n12月9日公佈，密切留意！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c77d94b941b","title":"陳家碧罕現身TVB藝訓班聚會 嫁余錦基胞弟息影做闊太 57歲近照皮膚白滑極凍齡","url":"https://www.stheadline.com/film-drama/3638977/陳家碧罕現身TVB藝訓班聚會-嫁余錦基胞弟息影做闊太-57歲近照皮膚白滑極凍齡","summary":"前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會。","summary_short":"前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會。","digest":"前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會","points":["前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會","席上除了林家棟、黃德斌、黎芷珊、杜兆津、林燕明、張靜及鄭維嘉等多位同窗外…","久未露面的陳家碧留有一頭烏黑長髮，對鏡頭展露甜美微笑，雖然身形比以往幕前時期圓潤…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"前TVB女星陳家碧近日出席了第15期藝員訓練班同學聚會。席上除了林家棟、黃德斌、黎芷珊、杜兆津、林燕明、張靜及鄭維嘉等多位同窗外，當年的藝訓班主任高宏亦戴上招牌藍色帽子精神奕奕現身，場面溫馨。久未露面的陳家碧留有一頭烏黑長髮，對鏡頭展露甜美微笑，雖然身形比以往幕前時期圓潤，但她皮膚依然白滑，氣色極佳，保養得宜。\n陳家碧主持《娛樂新聞眼》成經典回憶\n陳家碧的演藝生涯始於1986年參加《第五屆新秀歌唱大賽》，同屆參賽者包括文佩玲、許志安、黎明、關淑怡及劉錫明等。她當時於30強止步，隨後報考第15期藝員訓練班，與林家棟、黃德斌及黎芷珊結為同學，並於1988年畢業正式入行。陳家碧在TVB期間曾參演不少經典劇集，如《花月佳期》、《蓋世豪俠》及《我本善良》等，當中以《俠客行》飾演的「白阿繡」最令人留下深刻印象，與主角梁朝偉更有不少對手戲。90年代她亦曾客串《新半斤八兩》及《唐伯虎點秋香》等電影，不過大多飾演閒角。相比之下，她轉戰主持界在《娛樂新聞眼》及《城市追擊》擔任主持，憑藉靈活淡定的表現，更為觀眾所熟悉。\n相關閱讀：《娛樂新聞眼》陳家碧激罕現身！老公余錦遠生日影帝天王到賀 曾玩新秀一原因息影\n陳家碧息影嫁余錦基胞弟\n陳家碧在1994年選擇離開TVB並息影，回歸校園修讀大學學位。告別娛樂圈後，她低調嫁給香港富商余錦基的胞弟余錦遠，婚後育有兩名女兒。陳家碧早年受訪時曾透露，婚後曾有意追生兒子，無奈夫婦二人工作與生活繁忙而未能如願，但兩名女兒乖巧貼心，一家四口生活美滿。\n相關閱讀：《娛樂新聞眼》陳家碧罕現身跟影帝同台 息影多年變化震驚網民 跟余錦基胞弟結婚育兩女","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd19be98f26","title":"抗大腸癌兼抗發炎！最新研究揭：日吃1種營養素 5年存活率飆升17個百分點","url":"https://www.stheadline.com/health-care/3637993/抗大腸癌兼抗發炎最新研究揭日吃1種營養素-5年存活率飆升17個百分點","summary":"抗癌不只是消滅癌細胞，更要抗發炎。","summary_short":"抗癌不只是消滅癌細胞，更要抗發炎。","digest":"抗癌不只是消滅癌細胞，更要抗發炎","points":["抗癌不只是消滅癌細胞，更要抗發炎","最新一項發表的研究指出，大腸癌肝轉移患者在手術前後吃1種營養素…","【同場加映】24歲女研究生患大腸癌晚期 曾邊備考邊照顧患乳癌母 慨嘆…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"抗癌不只是消滅癌細胞，更要抗發炎。最新一項發表的研究指出，大腸癌肝轉移患者在手術前後吃1種營養素，5年整體存活率竟能從45%飆升至62%，大增17個百分點。\n研究揭日吃1種營養素 大腸癌肝轉移患者存活率升17個百分點\n放射腫瘤專科醫生廖志穎在Facebook專頁發文分享，引述2026年歐洲腫瘤內科學會（ESMO）年會上發表的一項第3期臨床試驗（EMT2）結果指出，大腸癌出現肝轉移的患者，在手術前後接受高劑量「二十碳五烯酸（EPA，一種Omega-3脂肪酸）」治療，其整體存活期比服用安慰劑的患者更長。\n【同場加映】24歲女研究生患大腸癌晚期 曾邊備考邊照顧患乳癌母 慨嘆：人生的路不白走會堅持下去\n過去已知Omega-3魚油具有調節發炎的作用。廖志穎醫生表示，這項研究共納入了418名接受肝轉移切除手術的大腸直腸癌患者，並將他們分為兩組：實驗組每天服用4克高純度EPA乙酯（Omega-3魚油成分），對照組則服用安慰劑。研究結果顯示：\n 服用高純度EPA實驗組：5年整體存活率高達62.0%\n 服用安慰劑對照組：5年整體存活率為 45.1%\n研究也正常，無惡化存活期（PFS）並未顯著改善，因此仍需要進一步研究確認。\n為何補充高劑量EPA能讓患者的5年整體存活率從45%大幅提升至62%？廖志穎醫生指出，研究團隊推測，魚油中的高劑量EPA可能透過以下3種機制在體內發揮作用：\n 調節慢性發炎與腫瘤微環境\n 影響免疫反應與腸道菌相\n 可能改善癌症相關的發炎及代謝狀態。\n廖志穎醫生強調，這項研究讓醫學界重新思考抗發炎在癌症照護中的重要角色，但不能認定EPA能預防復發。由於這項研究屬於觀察性研究，尚無法證明因果關係，且研究使用的是處方級高純度EPA，並非一般市售魚油，也不建議癌症患者自行每日服用4克高純度EPA魚油。\n【同場加映】長輩溺愛惹禍！3餐常食炸雞杯麵辣條 12歲男童腹痛揭大腸癌晚期\n大腸癌有何常見徵狀？\n據香港癌症資料統計中心資料顯示，大腸癌是本港第3大常見癌症，同時亦是本港第2大致命癌症，按最新公布數據顯示一年錄得5190宗大腸癌新症及2270宗死亡個案。根據本港癌症網上資源中心資料，早期的大腸癌有機會完全無症狀。如有徵兆，身體則可能出現以下變化：\n大腸癌症狀：\n 大便帶血、或呈黑色、帶黏液，或直腸出血\n 排便習慣突變（持續便秘或腹瀉）、糞便形狀改變（幼條狀）、大便後仍有便意\n 無故體重下降\n 下腹不適（腹部發脹或腸絞痛）\n 身體出現貧血徵狀：手腳冰冷、疲倦、心跳加速、氣喘、面色蒼白、頭暈\n大腸癌風險因素：\n 飲食纖維含量不足\n 進食大量紅肉和加工肉\n 缺乏體能活動、肥胖\n 飲酒和吸煙\n 帶有遺傳性的腸病，例如「家族性大腸腺瘜肉病」或「連氏綜合症」\n 大腸長期發炎，例如「潰瘍性結腸炎」\n 過往有大腸瘜肉\n 直系親屬有大腸癌家族史\n資料來源：放射腫瘤專科醫生廖志穎、歐洲腫瘤內科學會（ESMO）、癌症網上資料中心、香港癌症資料統計中心 \n延伸閱讀：吃這10種高纖食物 防大腸癌最好！早餐必吃燕麥？營養師大推這種番薯！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c808b1c6fbb","title":"天氣｜市區氣溫跌至13.4度 多處地區及高地寒冷","url":"https://news.tvb.com/tc/1207381-天氣市區氣溫跌至134度多處地區及高地寒冷","summary":"受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度。在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。","summary_short":"受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度。","digest":"受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度","points":["受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度","在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步","天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T11:00+08:00","size":1,"keywords":[],"body":"受強烈東北季候風影響，天氣顯著轉涼，天亮後市區氣溫不斷下降，最新跌至13.4度。\n\n在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖。\n\n天亮後維港兩岸天色昏暗，早上上班上學時間，不少市民穿了外套及頸巾。\n\n天文台指，受強烈東北季候風及一道雲雨帶影響，日間市區氣溫繼續下降至約13度，多處地區及高地寒冷。\n\n隨後一兩日氣溫稍為回升。預料另一股東北季候風，會在下周二抵達華南沿岸，下周中期會再度轉涼。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/c21b252926374e67a6ce5b3b22608079/snapshots/d0b7465b8e6c4f879486b2e1767665f6-00005.jpg","video":"https://pro-vod-cdn.tvb.com/c21b252926374e67a6ce5b3b22608079/464dd5e6b35146f7808cfc580db612a3-d790c2c019923a55feb6d2cdfacf02e2-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/c21b252926374e67a6ce5b3b22608079/snapshots/d0b7465b8e6c4f879486b2e1767665f6-00005.jpg","lang":"zh-Hant"},{"id":"c614a9cde7f","title":"香港公開羽毛球錦標賽｜混雙「澤柔配」陳延澤 吳芷柔止步16強 上寶貴一課 期望新賽季衝上「大賽」頒獎台","url":"https://www.stheadline.com/realtime-sport/3639135/香港公開羽毛球錦標賽混雙澤柔配陳延澤-吳芷柔止步16強-上寶貴一課-期望新賽季衝上大賽頒獎台","summary":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合，在64分鐘的激戰中，「澤柔配」未能把握局中領先優勢，以22:24、21:19、11:21見負；總結今季的比賽…","summary_short":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合，在64分鐘的激戰中…","digest":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…","points":["香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…","總結今季的比賽，今年三月才穩定混雙合作關係的他們，世界排名已去到25位，超出教練團預期…","「澤柔配」今日的16強有點可惜，他們跟印尼組合Dejan Ferdinansyah及Feli…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:21:59+08:00","size":2,"keywords":[],"body":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合，在64分鐘的激戰中，「澤柔配」未能把握局中領先優勢，以22:24、21:19、11:21見負；總結今季的比賽，今年三月才穩定混雙合作關係的他們，世界排名已去到25位，超出教練團預期，他們期望2027年新賽季能衝上頒獎台，為五月展開的奧運計分周期打好基礎。\n「澤柔配」今日的16強有點可惜，他們跟印尼組合Dejan Ferdinansyah及Felisha Alberta Nathaniel Pasaribu的競爭像過山車，在首局初段港隊氣勢如虹，曾領先8:0，但對方一分分追上，雙方要打至「刁時」才分出勝負，結果是港隊以22:24先失一局，第二局在球迷打氣聲中越戰越勇，在這局拉鋸戰中，「澤柔配」以21:19扳成平手；決勝局初段只有一、兩分差距，但小休後一節，對方的主動追擊一分分拉開比賽，港隊終以11:21敗陣，16強止步。\n問到首局被反勝原因，延澤表示：「主要是對手的發接發和對每一分的處理比我們做得更好，當對手的分數逼近，我們自己也有些手緊，影響到發揮。」\n周四晚有八成入座率，不少人為港隊加油打氣，芷柔認為主場的壓力問題不大：「有那麼多觀眾支持，我會將壓力變成動力，沒有半點負面影響，這可能是心態及士氣上比以往好些。」\n今年三月固定合作混雙後，延澤及芷柔的世界排名徘徊在100位，五月闖入頭50位內，並接連在BWF世巡賽登上頒獎台，包括五月中的中國寶雞羽毛球大師賽（超級100）的亞軍及六月中澳門公開賽（超級300）的亞軍，世界排名於六月底升至頭32位內，這意味著二人可以打上去BWF更高級別的比賽，包括超級500、 750甚至1000級別的比賽，更首次參加了八月世錦賽及九月亞運會，二人表示這些「大賽」的經驗令他們獲益良多。\n芷柔說：「我們二人的組合越來越合作得好，近幾個月憑世界排名打到的超級500至1000級的比賽，對我們準備明年奧運積分周期很有幫助，至少令我們可以提早跟強手對陣，在高水平的比賽中檢視我們自己的水平；發覺高手們發揮很穩定，我們需要慢慢學習，有甚麼不好的，包括穩定性及臨場的變化，彼此在現場要怎樣溝通去處理下一球，或者在對方狀態散了，應如何去互相提醒，掘大家的狀態叫回來，這些都要去改善。」\n談到2027年的目標，包括新制的15分及半年後即展開的奧運積分周期，二人不約而同表示「一定要向上衝」：「爭冠的心態一定要有，今季的成績（特別是超級500以上的大賽），成績沒理想中好，但每一次感覺不是不夠打，很多時戰滿三局或『刁時』才輸，主要是在關鍵分沒處理好，所以在新一個賽季，我們要保持想衝想贏的心態。」\n記者/攝影：徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"香港公開羽毛球錦標賽｜混雙「澤柔配」陳延澤 吳芷柔止步16強 上寶貴一課 期望新賽季衝上「大賽」頒獎台","url":"https://www.stheadline.com/realtime-sport/3639135/香港公開羽毛球錦標賽混雙澤柔配陳延澤-吳芷柔止步16強-上寶貴一課-期望新賽季衝上大賽頒獎台","source_display":"星島頭條","published_at":"2026-11-20T02:21:59+08:00","category":"生活","digest":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…"},{"title":"香港公開羽毛球錦標賽｜伍家朗因傷中途退賽感「遺憾」 李卓耀自責壓力下只能發揮五成功力","url":"https://www.stheadline.com/realtime-sport/3639031/香港公開羽毛球錦標賽伍家朗因傷中途退賽感遺憾-李卓耀自責壓力下只能發揮五成功力","source_display":"星島頭條","published_at":"2026-11-19T22:58:18+08:00","category":"生活","digest":"兩位前「香港冠軍」李卓耀及伍家朗周四在八成滿的體藝館舉行的香港公開羽毛球錦標賽男單1…"}],"cross":{"total":2,"angles":[{"point":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639135/香港公開羽毛球錦標賽混雙澤柔配陳延澤-吳芷柔止步16強-上寶貴一課-期望新賽季衝上大賽頒獎台"},{"point":"兩位前「香港冠軍」李卓耀及伍家朗周四在八成滿的體藝館舉行的香港公開羽毛球錦標賽男單1…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639031/香港公開羽毛球錦標賽伍家朗因傷中途退賽感遺憾-李卓耀自責壓力下只能發揮五成功力"}]}},{"id":"c14251b0bb1","title":"“零添加”“0蔗糖”未必更健康","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735009.shtml","summary":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)  　　“零添加”“0蔗糖”“非油炸”……","summary_short":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)  　　“零添加”“0蔗糖”“非油炸”…","digest":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)…","points":["《人民日报海外版》(2026年11月20日 第 09 版)","“零添加”“0蔗糖”“非油炸”……如今，许多食品打出这样的宣传标签，吸引消费者购买","“这些说法只涉及某种成分或加工方式，不能代表食品的整体营养状况"],"section":"生活","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:08:41+08:00","size":1,"keywords":[],"body":"本报记者 王美华\n\n　　《人民日报海外版》(2026年11月20日 第 09 版)\n\n　　“零添加”“0蔗糖”“非油炸”……如今，许多食品打出这样的宣传标签，吸引消费者购买。这些字眼是否意味着食品更安全、更健康？在国家卫生健康委近日举行的新闻发布会上，专家进行了详细解读。\n\n　　“这些说法只涉及某种成分或加工方式，不能代表食品的整体营养状况。”国家食品安全风险评估中心副研究员梁栋在发布会上介绍，2027年3月16日起，我国将实施新的标签标准要求，将禁止使用“零添加”“不添加”等用语对食品配料进行特别强调，避免误导消费者。\r\n\n　　关键在于控制糖的总摄入量\n\n　　梁栋介绍，“0蔗糖”≠没有糖。营养成分表中的糖，包括葡萄糖、果糖、蔗糖、麦芽糖和乳糖。“0蔗糖”只针对蔗糖，并不代表这个食品中不含有其他糖类，也不代表低能量。因此，需要控糖的人群，还要结合配料表和营养成分表来综合判断。此外，科学控糖关键在于控制糖的总摄入量，而不是纠结该选择哪种糖。\n\n　　“零添加”≠更健康。比如，不添加防腐剂的食品并不代表低糖、低盐。有些食品为了延长保质期，可能在加工过程中会添加更多的糖或者盐，因此也要控制其食用量。\n\n　　“非油炸”≠没有油、脂肪低。“非油炸”仅仅说明食品在加工过程中没有采用油炸工艺，但也有可能通过食品原料添加油或食品加工过程中加入了油脂。比如，有些非油炸膨化食品、焙烤食品为改善口感也会加油。“消费者在选购的时候，还要看配料表和营养成分表，观察配料表里到底有没有加入油脂，同时结合营养成分表中的脂肪含量来综合判断，而不能仅靠加工方式来下结论。”梁栋表示。\n\n　　重点看配料表与营养成分表\n\n　　食品标签上哪些内容需要重点关注？\n\n　　“消费者需求不同，选购预包装食品时的关注点也会有所差异，但关键都在于配料表和营养成分表。”梁栋表示，有食物过敏的人，需重点关注食品配料表和致敏提示。配料表说明制作食品用了什么，排得越靠前，用量越大。过敏人群要关注自己需要避免摄入的物质。\n\n　　接着看营养成分表，要注意含量是按每100克、每100毫升还是每份标示，吃多少要相应换算。表中的“营养素参考值”百分比，表示相应营养成分占每日参考量的比例。例如，每100克饱和脂肪对应的值是70%，意味着吃100克就占了一天饱和脂肪摄入总量的七成，要注意控制食用量。\n\n　　梁栋表示，消费者应根据自己的健康需求，选择更适合的食品。例如，需要减重的人群重点看能量，这里的能量是指蛋白质、脂肪和碳水化合物提供的总能量；高血压人群重点看钠含量，尽量选择钠含量较低的食品；血脂偏高人群关注脂肪和饱和脂肪的含量。\n\n　　需要提醒的是，现在许多食品包装上有了“数字标签”二维码，用手机扫一扫就可以实现标签信息的“可听、可播、可放大”，帮助更好了解和选择食品。\n\n　　2岁内幼儿尽量不摄入添加糖\n\n　　糖尿病是吃糖、吃甜食太多引起的吗？不吃糖就不会得糖尿病吗？\n\n　　北京协和医院主任医师许岭翎表示，糖尿病是身体调节和利用葡萄糖的能力出了问题，预防糖尿病不能只盯着吃不吃糖，还要规律进餐、粗细搭配、适量运动、保持健康体重。\n\n　　“平时生活中不必谈糖色变，重要的是注意控制添加糖的摄入量。”许岭翎提醒，添加糖是指加工食品或烹调时额外加入的糖，不包括食材中天然存在的糖。对于血糖正常的成人来说，每日添加糖应不超过50克，最好控制在25克以下。儿童青少年应该更加严格，2岁之内幼儿尽量不要摄入添加糖。\n\n　　此外，还要注意隐形糖。购买食品要养成看标签的习惯，既要看配料表中有没有添加糖，也要关注营养成分表中的糖含量，并按整瓶、整包计算，同时不能把碳水化合物直接当成添加糖。要留意调味酸奶、果汁饮料、酱料中的隐形糖，少吃甜点和高糖加工食品，用白开水、淡茶水替代甜饮料，用适量新鲜水果替代甜点。 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3ef76d0516","title":"抄袭、洗稿事件频发 文学刊物如何守住“原创防线”","url":"https://www.chinanews.com.cn/cul/2026/11-20/10735008.shtml","summary":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐，并对该作者的作品永久禁发。","summary_short":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐…","digest":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明…","points":["《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传…","值得关注的是，今年以来，国内文学刊物已多次发出致歉声明，核心指向高度一致：作品雷同、洗稿…","今年10月，《人民文学》第9期短篇小说《秋宵梦觉》被读者比对指出文本雷同，经编辑部核实…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:05:14+08:00","size":1,"keywords":[],"body":"本报记者 路艳霞\n\n　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐，并对该作者的作品永久禁发。值得关注的是，今年以来，国内文学刊物已多次发出致歉声明，核心指向高度一致：作品雷同、洗稿、抄袭。\n\n　　近年文坛常见隐蔽式洗稿\n\n　　发布致歉声明的，都是大家耳熟能详的知名文学刊物。\r\n\n　　今年10月，《人民文学》第9期短篇小说《秋宵梦觉》被读者比对指出文本雷同，经编辑部核实，约三百字语段在场景书写、情绪氛围与句式表达上与日本作家井上靖作品高度相近。于是，刊物致歉，追回稿酬。\n\n　　今年11月，《人民文学》第10期散文《湘江北去》被指整体文意、行文脉络、段落结构与前人已发表作品高度重合。与普通字句抄袭不同，该作品通过改写语序、替换关键词、微调表达的方式规避机器查重——这正是近年文坛愈发常见的隐蔽式洗稿。为此，《人民文学》决定追回稿酬、撤销推介宣传，并对作者设置投稿禁发期。\n\n　　“文学期刊接二连三发致歉声明，会给其带来压力，这不是偶发性的舆论压力，而是一种结构性的制度压力。”《诗刊》社主编李少君的判断直指要害，它暴露了一个更深层的问题：传统的三审制在面对“洗稿”和“AI润色”时，防线正在系统性失守。\n\n　　在李少君看来，抄袭尚可依赖查重工具和编辑的阅读积累来发现，但洗稿是对原文本进行结构性改写，查重工具往往难以触发警报。李少君还指出，AI生成后的人工修改的文本，更是介于“原创”与“非原创”之间的灰色地带。“当最近两家标杆文学刊物在相近时间内被同一种方式击中，其他刊物的直接反应必然是：下一个会不会是我？我的审稿流程能不能挡住这种稿件？”\n\n　　坚决对抄袭和AI洗稿说“不”\n\n　　“今年以来接到的AI稿频次明显增加——表面流畅漂亮、旁征博引、词句准确，细看却空洞、模式化、堆砌意象。”《北京文学》执行主编师力斌如此说道。\n\n　　师力斌发现，AI稿件爱写一对男女到著名景区度假的场景。“一旦让它写北京某个村、某条街道，就会露马脚。”在他看来，缺乏私人性、特殊性、细节，是AI稿的致命伤。因此，在编辑部内部其实已经形成默契，凡是心存怀疑的来稿，一概不用。“因此，我们看到真人写的、哪怕不完美的文字，反而会欣喜，会觉得宝贵。”师力斌说。\n\n　　其实，不少文学期刊已纷纷启用辅助手段，进行防范。李少君介绍，《诗刊》的动作在诗歌刊物中启动较早，可概括为“工具筛查+黑名单+明确后果”三条线。“《诗刊》社很早即公开处理过几起抄袭事件，要求作者解释是否抄袭，属实则立即收回稿费、永不录用，对AI代笔同样如此。”不仅如此，在2026年全国文学报刊联盟框架下，《诗刊》作为理事长单位，参与了推动《原创承诺书》和行业统一规范的工作。“我们一直向投稿者传递‘这里不欢迎抄袭和AI代笔’的明确信号。”李少君说。\n\n　　值得关注的是，全国文学报刊联盟近期已发布通知，要求各成员单位刊发作品前，必须由作者签署《原创承诺书》，对作品原创性、著作权归属、引文规范、AI创作边界等作出郑重承诺，同时列明违背承诺所要承担的各类后果。“《原创承诺书》的落地，是一个起点，行业第一次有了统一的契约工具。”李少君说。\n\n　　编辑判断不可替代\n\n　　技术辅助手段和《原创承诺书》，是否能成为文学期刊真正捍卫“原创”的依靠，专业人士给出了答案。\n\n　　中国文字著作权协会常务副会长兼总干事张洪波透露，文著协就曾接受过知名文学期刊的咨询，为何利用学术不端检测系统依然查不出剽窃。张洪波就此向北京日报记者进行了一番普及，“检测系统可以查出来的政策、法规或者百科知识、常识，都属于不受版权保护的。而组合式抄袭、转换式使用，技术上很难发现，因此，查重技术仅仅是一种辅助。”文学期刊编辑张女士也向记者表明观点，“文学不像学术论文有规范、好鉴定。查重软件对文学不灵，人家用一句、几个字，根本查不出来。文学鉴定难就难在五花八门。”\n\n　　“几十年前的文学期刊和出版社的老编辑都是各领域的专家，对本领域的作者创作特点和行业动态非常熟悉，一打眼就能知道是不是抄袭、剽窃，或者引用了谁的观点。”张洪波直指，片面地强调依靠某些商业公司的查重系统，想走“捷径”，必然要被技术带偏。\n\n　　不仅如此，张洪波还强调，“期刊仅仅公开赔礼道歉还不足够，应该采取措施加强三审三校，一定要在期刊内部形成相关的制度，提升编辑的专业素养和版权法律意识。”同时，还应当以公告函等形式提示作者注意相关问题，如创作时对于他人作品的合理使用。针对如今存在的很多AI创作，也要考虑是否允许文学创作当中借助人工智能，并要求作者对人工智能的应用程度作出适当声明。否则，一旦造成侵权，期刊和抄袭他人作品的作者都要承担法律责任。\n\n　　延伸\n\n　　合理使用不等于随意使用\n\n　　“普通人理解的抄袭、剽窃，与文学界的行业标准、《中华人民共和国著作权法》(以下简称《著作权法》)意义上的抄袭、剽窃，并不一样。”中国文字著作权协会常务副会长兼总干事张洪波特别提示道。\n\n　　张洪波进行了一番梳理，根据《著作权法》规定，作者若对已发表、出版的作品，作为观点或内容来引用，要符合《著作权法》第24条关于“合理使用”的规定，即为了介绍、说明、评论某一作品，或说明某一问题、观点，可以适当使用已经发表的作品。张洪波说，“合理使用”是指不能构成自己作品的实质或核心部分，不能对原作者构成市场替代。此外，引用别人已发表、已出版的作品，必须标明出处，“引自哪本书、哪篇文章、作者是谁，都要标注清楚”。\n\n　　张洪波特别提醒，任何杂志、报纸在刊发作品时都依法负有审核义务，比如，作者相关作品刊发时，要审核其引用的参考文献或引用别人的作品是否做了合理标注；更关键的是，按照《最高人民法院关于审理著作权民事纠纷案件适用法律若干问题的解释》(2026年修正)，出版者对于出版行为的授权、稿件来源和署名、所编辑出版物的内容负有合理审核的义务。如果文学期刊对所刊发的内容未经过仔细核实，没有鉴别是否存在抄袭、剽窃、引用不当等，就应当为此承担相应的法律责任，即需要公开赔礼道歉、停止侵权；如果造成经济损失，则要给予被侵权者进行经济赔偿甚至精神损害赔偿。 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1887e45adc","title":"校園熱話│成軍半年奪全港醒獅冠軍！錦泰小學家校同心實踐正向教育","url":"https://www.stheadline.com/ohpama/3638515/校園熱話成軍半年奪全港醒獅冠軍錦泰小學家校同心實踐正向教育","summary":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！","summary_short":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！","digest":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間","points":["由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間","隊員每日苦練舞獅頭至腳腫仍堅持不懈，家長更自發擔任「搬運工」及現場打氣團","即睇錦泰小學如何透過傳統非遺醒獅活動結合正向教育，發掘學生品格優勢，培養孩子堅毅精神與責任感"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:15:11+08:00","size":1,"keywords":[],"body":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！隊員每日苦練舞獅頭至腳腫仍堅持不懈，家長更自發擔任「搬運工」及現場打氣團。即睇錦泰小學如何透過傳統非遺醒獅活動結合正向教育，發掘學生品格優勢，培養孩子堅毅精神與責任感！\n家校齊心 舞出最燃正能量\n今年7月，全港學界獅藝錦標賽戰鼓擂響，保良局錦泰小學醒獅隊一舉奪魁。誰曾想到，這支由12名學生組成的醒獅隊，竟才成立半年。對錦泰師生及家長而言，奪冠絕非偶然，是三方鼎力同心、堅毅不屈的真實寫照。這股精氣神，為校園的正向教育點亮了一盞明燈。\n醒獅結合了武術、音樂、舞蹈和工藝，是國家級非物質文化遺產，對於小學生來說，因平日甚少接觸反倒生出好奇。「起初設立醒獅興趣班，是為了豐富學校活動課，加深學生對傳統文化的認識。」錦泰小學負責活動的林嘉榮主任介紹，學校於2025至2026學年第二期課後活動中為六年級開設醒獅循環體驗課。學校根據學生的興趣及初步選拔，一支十二人組的醒獅校隊正式成立。他們當中，有人平時愛跳舞，有人拉得一手好琴，也有人是體育健將，唯獨對醒獅零基礎。\n興趣引領下更能展現才能\n「錦泰的學生思路清晰、做事專注！」說起錦泰小學醒獅隊的學生，具有多年專業教學、裁判經驗的黃嘉勝教練頻頻點讚。黃教練表示，訓練舞獅時，他常常需要拆成不同組作個別訓練，「當我教緊鼓樂時，獅子組的同學會自覺練習，一點時間都唔會浪費。」林嘉榮主任也十分贊同，在興趣引領、專業指導和刻苦訓練的加持下，整個醒獅隊迅速成長，成立一個月後就能上台表演，五個月後第一次參加全港性比賽拿到優異獎，六個月後就拿到冠軍。\n越努力越有成就感，這是學生最大的感觸。醒獅隊成員李俊禧同學表示，當時因為好奇加入，並選擇最需要力量的舞獅頭，「最辛苦的時候，一天中所有的閒暇時間都用來練習，練到腳腫都沒有想過放棄。」獅隨鼓動，獅鼓是整個舞獅的統帥，決定了整個舞獅的節奏及氣勢。李映澄同學憑藉爵士鼓的經驗挑起了獅鼓的重任，她表示，這讓她更加有責任感。\n加入醒獅隊後學生盡顯積極\n家長也助力不少。「每次比賽，我們要帶上成套設備，家長們自發當起了搬運工。」林嘉榮表示，每一次比賽，家長都到現場打氣，給了老師和學生很大的鼓舞。「因為在孩子身上看到了對舞獅的熱愛、堅持和努力，作為家長，哪怕看到他受傷時會心疼，但依然會給予最大的支持。」李俊禧媽媽表示，自從加入醒獅隊，孩子的積極性明顯提升了不少，處事也更有擔當。\n發掘學生的興趣及品格優勢，引導其全心投入，並通過自身努力獲取成就感，是正向教育的核心。保良局錦泰小學吳嘉慧校長表示，她非常欣慰地看到學生、老師、家長在角色上的同頻共振，為學校的正向教育樹立了優秀典範。\n文、圖：保良局錦泰小學","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c24be478611","title":"英超｜名宿哈索賓基勸車路士放棄阿歷斯史葛 改斟阿仙奴冠軍中場蘇比文迪","url":"https://www.stheadline.com/football-news/3638976/英超名宿哈索賓基勸車路士放棄阿歷斯史葛-改斟阿仙奴冠軍中場蘇比文迪","summary":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。","summary_short":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。","digest":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下…","points":["英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下…","針對藍戰士有意重燃對般尼茅夫23歲中場新星阿歷斯史葛（Alex Scott）的追求…","哈索賓基強調，球隊目前極需一位現成的世界級冠軍贏家來穩定軍心，而非繼續囤積年輕新人"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:00:06+08:00","size":1,"keywords":[],"body":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。針對藍戰士有意重燃對般尼茅夫23歲中場新星阿歷斯史葛（Alex Scott）的追求，車路士名宿哈索賓基（Jimmy Floyd Hasselbaink）日前高調獻計，強烈敦促舊東家立即放棄史葛，改斟阿仙奴陣中的西班牙失意防守中場蘇比文迪（Martin Zubimendi）。哈索賓基強調，球隊目前極需一位現成的世界級冠軍贏家來穩定軍心，而非繼續囤積年輕新人。\n促引進現成贏家重塑威望\n車路士今夏雖大肆擴軍，但隨著安素費南迪斯及安祖山度士離隊，中場防線僅靠摩西斯卡些度與剛傷癒的羅美奧拉維亞苦撐。\n哈索賓基接受《Canada Sports Betting》專訪時直言，23歲的史葛雖具備潛力，但無法解決車路士的燃眉之急：「我更希望看到球隊簽入一位經驗豐富的頂級國腳。沙比阿朗素麾下已有太多驚世駭俗的年輕人，他們現在需要的是那種一踏進科巴姆（Cobham）訓練基地，就能讓所有人驚呼『哇，我們這次是玩真的』的領袖。車路士必須引進擁有奪冠履歷的現成贏家，才能縮短重奪大賽錦標的陣痛期。」\n哈索賓基：沙比阿朗素深知其價值\n適逢蘇比文迪因難以撼動迪格蘭賴斯及新援般奴古馬雷斯的位置，今季在阿仙奴長居後備，已被槍手標價6,000萬鎊放售。\n哈索賓基一針見血地指出，這正是車路士截劫的黃金契機：「如果一月有機會從阿仙奴帶走蘇比文迪，車路士必須毫不猶豫地出手。他是歐洲國家盃及世界盃的雙料冠軍成員，渾身散發著無與倫比的冷靜與階級氣質。更重要的是，沙比阿朗素在皇家蘇斯達時期便對他非常了解。去吧，現在就去把他簽下來！」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c65bb9354dd","title":"理大入學攻略2027｜PolyU 10個最多人申請/競爭最激烈JUPAS課程 附最新收分+計分方法","url":"https://www.stheadline.com/admission-guide/3636044/理大入學攻略2027PolyU-10個最多人申請競爭最激烈JUPAS課程-附最新收分計分方法","summary":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。","summary_short":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。","digest":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試考生需要把握時間…","points":["大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請…","《星島教育》綜合了本港8所教資會資助大學2026年的收生資料，整理出各個課程的競爭情況","本文按照理大提供的數據，整合出該校5個最多人申請的課程（以Band A計算）…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T06:45:01+08:00","size":1,"keywords":[],"body":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。《星島教育》綜合了本港8所教資會資助大學2026年的收生資料，整理出各個課程的競爭情況。本文按照理大提供的數據，整合出該校5個最多人申請的課程（以Band A計算），及競爭最激烈的5個課程（以2026年的Band A申請人數對比學額計算），同時亦收錄關課程的計分方法及最新收生分數，助同學掌握最新升學形勢，增加入讀心儀學系的機會。\n理工大學5個最多人申請JUPAS課程\n在2026學年，最多申請者報讀的5個理大課程（以Band A計算），依次為護理學（榮譽）理學士、酒店及旅遊管理（榮譽）理學士組合課程（酒店管理 / 智慧旅遊及酒店產業 / 會展及體驗管理）、設計學（榮譽）文學士組合課程（廣告設計 / 環境設計 / 沉浸式媒體與遊戲設計 / 信息設計 / 交互設計 / 室內設計 / 產品設計 / 服務創新設計 / 社會創新設計）、時裝（榮譽）文學士組合課程（時裝設計 / 針織時裝設計 / 內衣及運動服裝 / 時裝商務 / 時裝創新及科技）及應用社會科學（榮譽）文學士組合課程（社會工作 / 社會政策及社會創業）\n第5位：應用社會科學（榮譽）文學士組合課程（社會工作 / 社會政策及社會創業）\n基本資訊：\n 課程編號：JS3250\n 27學年學額：64\n 計分方法：最佳5科\n 加權比例較高科目：無\n2026年申請/收生數據：\n Band A申請人數：524\n 中位數：171.5\n 下四分位數：164.5\n 課程詳細資料：>>按此\n第4位：時裝（榮譽）文學士組合課程（時裝設計 / 針織時裝設計 / 內衣及運動服裝 / 時裝商務 / 時裝創新及科技）\n基本資訊：\n 課程編號：JS3050\n 27學年學額：101\n 計分方法：最佳5科 + 第6科（Level 3或以上）額外加分\n
