關心，馬國明爆羅嘉良愛玩音響，一部音響都貴過自己屋企。問到馬國明再遇當年「安心事件」主角許志安，他表示未知在演出環節後會否留低睇騷，等公司安排，坦言知安仔壓軸表演，也知大家想法，但不尷尬，多年前的事已過去，今日大家一齊幫TVB慶生，絕對不尷尬。\n直擊台慶紅地氈現場盛況 Part 3： \n返回目錄\n回顧去年經典！重溫2025台慶紅地氈最性感吸睛時刻\n在今晚盛典正式揭幕前，不妨先重溫去年的紅地氈經典瞬間！去年無綫58周年台慶紅地氈可謂看點十足，女星們為了搶鏡各出奇謀，多個性感造型至今仍令網民津津樂道，即刻點擊以下圖輯重溫去年的華麗戰衣：\n 「東張女神」奇招突圍：去年「東張女神」集體行紅地氈成為全場焦點，其中黎寬怡以一雙矚目的超大翅膀晚裝搶盡風頭；而陳曉彤更以一襲黑色高衩透視裝上陣，裙擺設計直逼大腿盡頭，若隱若現的視覺效果成功突圍！\n 美魔女高貴性感：陳煒去年以白色深V貼身晚裝現身，珠光閃爍，盡顯優雅高貴的「美魔女」風範。\n 新生代大鬥性感：宋宛穎以入行以來最性感的谷胸透視裝亮相，黃嘉雯則以黑色閃片晚裝露腰開胸，大展美好身段；波波黃婧靈更以白色低胸透視裙騷長腿兼大方展露優美曲線。\n返回目錄\n點擊重溫萬千星輝賀台慶2025紅地氈完整高清圖輯：\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女 鄧凱文澎湃上圍搶鏡 陳自瑤陳煒晒人妻魅力","url":"https://www.stheadline.com/film-drama/3638904/TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女-鄧凱文澎湃上圍搶鏡-陳自瑤陳煒晒人妻魅力","source_display":"星島頭條","published_at":"2026-11-19T20:28:22+08:00","category":"生活","digest":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚在將軍澳電視廣播城隆重揭幕"},{"title":"TVB台慶2026紅地氈丨俞可程避訪問鐵定缺席 六女神雍容華貴 阮嘉敏超暖心保護性感郭珮文","url":"https://www.stheadline.com/film-drama/3638985/TVB台慶2026紅地氈丨俞可程避訪問鐵定缺席-六女神雍容華貴-阮嘉敏超暖心保護性感郭珮文","source_display":"星島頭條","published_at":"2026-11-19T19:30:00+08:00","category":"生活","digest":"《萬千星輝賀台慶2026》於今晚在將軍澳電視廣播城隆重揭幕…"}]},{"id":"c26a9f31276","title":"陳卓賢預告演唱會打破新常規 罕與未合作過隊友小組演出 入圍叱咤七強感激粉絲四出拉票","url":"https://www.stheadline.com/film-drama/3639039/陳卓賢預告演唱會打破新常規-罕與未合作過隊友小組演出-入圍叱咤七強感激粉絲四出拉票","summary":"人氣男團MIRROR成員陳卓賢（Ian）今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質，但仍吸引數十粉絲拿著燈牌到場外應援，十分熱鬧。","summary_short":"人氣男團MIRROR成員陳卓賢（Ian）今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質…","digest":"人氣男團MIRROR成員陳卓賢今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質…","points":["人氣男團MIRROR成員陳卓賢（Ian）今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質…","陳卓賢聖誕與隊友粉絲度過","Ian透露今年聖誕將會與隊友及觀眾一同度過，由平安夜…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:45:16+08:00","size":1,"keywords":[],"body":"人氣男團MIRROR成員陳卓賢（Ian）今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質，但仍吸引數十粉絲拿著燈牌到場外應援，十分熱鬧。\n陳卓賢聖誕與隊友粉絲度過\nIan透露今年聖誕將會與隊友及觀眾一同度過，由平安夜、聖誕節到Boxing Day均會與粉絲見面，笑言今年絕非Lonely Christmas。對於隊友邱士縉（Stanley）透露會在演唱會中挑戰高難度舞蹈，Ian表示自己亦是「跳舞擔當」，近日已密鑼緊鼓排練了約兩星期，進度相當理想。他更賣關子預告，今次將會打破常規，與過去未曾合作過的隊友進行小組演出，並會互唱對方的歌曲，為觀眾帶來新鮮感。 \n陳卓賢感激粉絲四出拉票\n而Ian亦入圍叱咤「我最喜愛的男歌手」七強，對於一眾粉絲（Hellosss）連日來四出奔走為其拉票，Ian坦言十分感動與感激：「看到她們周圍替我拉票，好不容易，他們這麼辛苦，都是出於愛，很感謝她們。」問及對獎項的信心？Ian表示自己一向抱平常心，強調創作歌曲並非為了獎項，獎項對他而言只是Bonus。此外，Ian將於12月31日及1月1日赴澳門演出，估今年將未能出席叱咤頒獎禮，但他認為即使人不在現場，只要作品獲得肯定便已足夠。\n陳卓賢下周推首張全創作專輯\nIan下周一（23日）推出首張個人全創作專輯，他透露新碟所有歌曲的曲、詞均由他一手包辦，實現了作為唱作歌手擁有個人全創作大碟的夢想。被問到碟中最喜歡哪一首作品？Ian笑言：「很難選擇，每一隻都是「親生仔」，每一首都是別具意義。」但當中既有安慰自己的作品，亦有希望能治癒聽眾及給予力量的歌曲。由於新碟已售罄，連Ian媽媽亦向他查詢能否「加單」留碟，Ian笑指已盡力為身邊親友爭取名額。而新碟推出當日更會舉行簽名會，屆時將透過抽籤形式與購買專輯的支持者近距離見面。\n陳卓賢回應紀念品錯體\n至於早前演唱會紀念品被指出現印製錯字及亂碼問題，Ian回應指自己並不知情，但相信公司得悉後定會即時跟進及作出更改，確保交到歌迷手上的產品完美無瑕。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce172eb7d74","title":"BTS相隔8年全員抵台 4子夜闖六合夜市掃台灣小食 V大展神射手技贏巨型公仔","url":"https://www.stheadline.com/film-drama/3638994/BTS相隔8年全員抵台-4子夜闖六合夜市掃台灣小食-V大展神射手技贏巨型公仔","summary":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲，並定於今晚（19日）、21日及22日假高雄世運主場館舉行3場高雄站演出…","summary_short":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲…","digest":"韓國天團BTS的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完…","points":["韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》…","雖然ARMY（BTS粉絲名稱）已事先發起「勿接機、勿跟車、勿蹲點、勿守酒店」的呼籲…","七子當中，Jin、J-Hope、V和Jungkook等4位成員到達下榻酒店只休息一會兒…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:15:08+08:00","size":1,"keywords":[],"body":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲，並定於今晚（19日）、21日及22日假高雄世運主場館舉行3場高雄站演出，BTS七子已於昨日（18日）飛抵高雄。雖然ARMY（BTS粉絲名稱）已事先發起「勿接機、勿跟車、勿蹲點、勿守酒店」的呼籲，但畢竟今次是七子事隔8年再度全體來台的大日子，故此昨日凌晨已有粉絲帶埋摺凳和應援物抵達小港機場守候，最終機場更湧入上千名粉絲來接機。接着SUGA、RM、Jin、J-Hope、Jimin、V及Jungkook於昨午陸續現身，令全體粉絲激動不已。\nJin、J-Hope、V和Jungkook分享小食\n七子當中，Jin、J-Hope、V和Jungkook等4位成員到達下榻酒店只休息一會兒，就「衫都冇換」立即出發到當地著名的六合夜市遊覽。4人在工作人員和保安陪同下，悠閒地行夜市，而且4人中只有Jungkook穿連帽外套戴口罩，其餘3人都是零變裝、坦蕩蕩地走進人擠人的夜市。眾人第一站就是走到賣糍粑和芝士條的攤檔，他們點了一客芝士條，攤檔老闆叮囑他們「小心爆漿啊」，V也親切地用中文回應「好、好、好」。接過那盒芝士條後，4人就急不及待即時用簽子叉起芝士條享用，食得相當滋味！接着4人走到遊戲攤檔，Jin和V先觀察射氣球遊戲，並交談研究半晌，最終由曾服役於韓國陸軍軍事警察特任隊的V首先上陣，曾受過專業射擊訓練的他三兩下就將氣球全射破，盡展神射手架勢，最終贏得豬頭公仔一大個。然後4子走到賣大腸包小腸的攤檔買香腸，不知是否為演出保持最佳狀態，4子只買了一串香腸幾份分，買完香腸他們就打道回酒店，並一邊揮手向現場粉絲講拜拜，一邊坐上接載車輛離去。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6f7308a3b2","title":"跟着戏曲去出海 《戏宇宙（海外季）》开播仪式举办","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734965.shtml","summary":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。","summary_short":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。","digest":"山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办","points":["中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会…","《戏宇宙》自2022年开播以来，以“弘扬戏曲文化、传播中华之美”为初心，从演播室创演秀…","作为四度入选国家广电总局“中华文化广播电视传播工程”的重点IP，该节目第二季斩获“星光奖”…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:39:39+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。\n\n　　据了解，《戏宇宙》自2022年开播以来，以“弘扬戏曲文化、传播中华之美”为初心，从演播室创演秀、文旅实景、经典解读到扬帆出海，五季内容完成四次形态跃迁，持续探索传统文化的年轻化表达。作为四度入选国家广电总局“中华文化广播电视传播工程”的重点IP，该节目第二季斩获“星光奖”，第三季跻身年度广电视听精品推荐。\n\n　　今年，《戏宇宙(海外季)》以“跟着戏曲去出海”为核心理念，将舞台从国内剧场搬到马来西亚的街头、海滩、校园与百年戏台，用更贴近海外年轻观众的语言重构戏曲叙事，让戏曲从“圈内叫好”走向“世界听见”。\n\n开播仪式现场。主办方供图\n\n　　山东广播电视台党委副书记、总编辑张桂林当日表示，《戏宇宙(海外季)》不是简单把中国戏曲“带出来”，而是以戏曲为桥，让海外观众透过一段唱腔、一则故事、一档节目，读懂中国人的情感表达、审美追求与精神底色；也借镜头向国内观众展现马来西亚的多元包容，实现“双向奔赴、彼此成就”。\n\n　　中国戏剧家协会分党组副书记、秘书长傅亦轩指出，《戏宇宙》五年来的迭代，是一条从“向内登临”到“向外登临”的路径，经典季回溯戏曲源头、把根讲清楚；海外季则带着名角、乡音与乡情走出国门，从经典文本溯源转向剧种与华人迁徙来路的溯源，在族谱、家书里打捞海外游子的故土记忆。\n\n　　国家广播电视总局广播影视信息网络中心副主任韩肖鹏基于中国视听大数据(CVB)在仪式上分享称，《戏宇宙》前四季正片与口述史节目大屏累计收视人次超3.5亿、总收视时长超9642万小时，各季收视率较前一季平均涨幅超41%，抖音、快手平台主话题播放超23亿次。他表示，五年运营让《戏宇宙》从一档节目成长为有稳定辨识度的文化品牌IP。\n\n节目剧照。主办方供图\n\n　　据介绍，《戏宇宙(海外季)》历时20天深入马来西亚沙巴亚庇、吉隆坡、槟城乔治市三城，把京剧、河北梆子、柳子戏、秦腔、粤剧、潮剧、闽剧、蒲剧等剧种的14位戏曲名家带到异国的土地上，完成全国首档国际戏曲文化交流节目的实地创制。\n\n　　节目中，“荐戏官”曾黎、李依晓、郑业成随团探访。三城展演各有侧重：沙巴站，河北梆子名家王少华、孙娜演绎《大登殿》，蒲剧名家梁静带来《精卫填海》，“洋美猴王”格法以《闹天宫》燃动公开课堂；吉隆坡站，秦腔名家李梅演绎《鬼怨》，彭馨韵带来《天女散花》，柳子戏梅花奖得主尹春媛献上《玩会跳船》《老青天》，青年京剧演员果菁以《卖水》《霸王别姬》展现青春力量；槟城站则将闽剧《荔枝换绛桃》、粤剧《紫钗记》、潮剧《苏六娘》及戏歌《给阿嫲的情书》搬上邱公祠百年戏台与姓氏桥，完成一场跨越山海的文化回访。\n\n节目剧照。主办方供图\n\n　　《戏宇宙(海外季)》突破“演一场”逻辑，搭建起“本土艺术对话、中外联合共创、全媒体长效传播”的传播闭环：在建国中学、英迪国际大学、钟灵独立中学开戏曲公开课，把京剧猴戏、秦腔“慢卧鱼”、粤剧长水袖带进课堂；在丹绒亚路海滩、独立广场、旧关仔角草场做街头汇演，与马来西亚二十四节令鼓、卡达山舞蹈、甘美兰同台。\n\n　　据悉，《戏宇宙(海外季)》将于11月21日起，每周六20:30，在山东卫视以及海内外新媒体平台同步播出。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc9fc2b42ab","title":"国家大剧院与法国波尔多国家歌剧院联合制作歌剧《魔笛》将在京登台","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734958.shtml","summary":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日，国家大剧院与法国波尔多国家歌剧院联合制作的莫扎特歌剧《魔笛》即将登陆国家大剧院戏剧场。","summary_short":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日…","digest":"2026年恰逢莫扎特诞辰270周年，11月24日至29日…","points":["中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年…","该剧此前已于波尔多成功首演，此番亮相北京，将由国家大剧院音乐艺术总监吕嘉执棒…","法国艺术家朱利安·杜瓦尔担纲导演，与中外实力派歌唱家组成的双卡司阵容群星璀璨，联袂献声…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:26:41+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日，国家大剧院与法国波尔多国家歌剧院联合制作的莫扎特歌剧《魔笛》即将登陆国家大剧院戏剧场。\n\n　　该剧此前已于波尔多成功首演，此番亮相北京，将由国家大剧院音乐艺术总监吕嘉执棒，国家大剧院歌剧演员队、国家大剧院合唱团、国家大剧院管弦乐团联袂演绎。法国艺术家朱利安·杜瓦尔担纲导演，与中外实力派歌唱家组成的双卡司阵容群星璀璨，联袂献声，为观众呈现一部兼具欧洲歌剧纯正基因与当代审美表达的全新《魔笛》。\n\n排练现场。刘方摄\n\n　　该版《魔笛》日前举行剧组排练媒体探班活动。中外歌唱家齐聚国家大剧院第一排练厅，为大家带来了第二幕终场大合唱的宏大场面演绎，数十位歌唱演员组成多层次的声部叠加之下，歌声响彻排练厅。第一幕帕米娜与帕帕盖诺、莫诺斯塔托斯的诙谐对手戏，情节轻快、演唱灵动活泼，演员们凭借扎实的唱功与生动的表演，提前让在场媒体感受到了这部中法联合制作歌剧的鲜活魅力。\n\n排练现场。刘方摄\n\n　　国家大剧院与法国波尔多国家歌剧院联合制作歌剧《魔笛》围绕“时尚、梦幻、浪漫”展开。中外顶尖歌唱家双卡司加盟：塔米诺由美国抒情男高音卡梅伦·贝克尔与中国男高音王川分别出演，以纯净的抒情线条塑造王子的成长；帕米娜由瑞士女高音莫伊卡·埃德曼与中国女高音张玫瑰出演，细腻的乐句控制赋予角色柔韧的情感。夜后由希腊花腔女高音达娜埃·孔托拉与法国花腔女高音格洛丽亚·特罗内尔出演，用高超的花腔技巧演绎《复仇的火焰在我心中燃烧》，成为全场的听觉焦点。帕帕盖诺由奥地利男中音拉斐尔·芬格洛斯与中国男中音周正中出演，带来充满喜剧能量的表演；萨拉斯特罗由北马其顿男低音伊戈尔·杜尔洛夫斯基与中国男低音陈佩鑫出演，沉稳声压撑起神殿的庄严。莫诺斯塔托斯由迪特马尔·克施鲍姆与扣京出演，帕帕盖娜由张文沁出演。\n\n　　导演朱利安·杜瓦尔当日介绍，这一版《魔笛》在设计和排演中，努力平衡了莫扎特作品中的童真与深刻情感，演出通过第一幕明亮、第二幕暗黑的舞台设计体现主角经历试炼并成长的过程；服装设计色彩丰富、视觉冲击力强，旨在传递音乐中的喜悦与幽默。\n\n　　据悉，该剧目前排练已进行三周。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5869c3a387","title":"深化國際教育樞紐建設 議員促先完善基礎配套","url":"https://www.stheadline.com/edu-insights/3639023/深化國際教育樞紐建設-議員促先完善基礎配套","summary":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。","summary_short":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。","digest":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設…","points":["立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設…","多位議員呼籲政府先完善本港基礎教育配套，包括宿舍及畢業後的工作安排","教育局副局長施俊輝指，政府會將「一帶一路獎學金」名額提升至200個…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:06:22+08:00","size":1,"keywords":[],"body":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。多位議員呼籲政府先完善本港基礎教育配套，包括宿舍及畢業後的工作安排。教育局副局長施俊輝指，政府會將「一帶一路獎學金」名額提升至200個，以先行先試方式逐步推行「直資擴容」，並持續檢視文憑試與國際標準的銜接。\n「一帶一路獎學金」增至200個\n提出議案之一的選委界議員范凱傑指，全球升學版圖正「洗牌」，香港應善用普通法制度、兩文三語環境及國際化學術體制，吸引更多海內外學生來港升學。\n多名議員呼籲政府擴大招攬學生的範圍，提出修正案的教育界議員鄧飛直言，社會討論國際教育樞紐時忽略基礎教育，強調政府應打通由基礎教育、職業專才教育到高等教育的「全產業鏈」。商界議員嚴剛建議，從國際學校與私立學校開始，研究放寬非本地中小學生來港就讀的簽證安排與監護人要求。\n延伸閱讀︰大學排名屢創新高 蔡若蓮：香港教育優勢難以取代 明年續辦大學校長論壇｜專訪\n選委會議員伍煥杰促請政府加快研究文憑試課程與國際接軌的方案，包括建設更具國際適應性的英文科考試。同屬選委界議員梁美芬，提到特斯拉行政總裁馬斯克的「港人消失論」，認為香港要吸引更多優質人才，提供更多實習和工作機會，「來了（香港）讀書後留住他」。\n施俊輝總結發言時重申，政府繼續支持各大院校主動走出去，而27/28學年起政府會將「一帶一路獎學金」名額，由現時每年150個增至200個，以把握「一帶一路」國家及地區的發展機遇；而直資學校今學年共170名非本地生以自資模式入讀，按年升13%，反映計劃開局良好。對於文憑試的國際認受性，他稱考評局會繼續加深各地教育界對文憑試課程及評核制度的認識，並積極拓展文憑試在內地及海外的認可。\n延伸閱讀︰蔡若蓮爭取大學城百億貸款「加碼」 新田項目最快明年底推 料院校競地不會「大包圍」｜專訪\n創新科技及工業局局長孫東則指，港府重視為大學強化科研成果轉化能力提供有利條件，包括支援大學團隊創立初創企業並將成果商品化的「大學科技初創企業資助計劃」，截至上月已累計向702間初創企業共批出約6.55億元資助。\n本報記者","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c33d32bdd18","title":"譚旻萱認愛黃澤林後過26歲生日 大騷英文語錄轉行文青風？ 遭毒舌網民起底學歷：好Kam","url":"https://www.stheadline.com/film-drama/3638907/譚旻萱認愛黃澤林後過26歲生日-大騷英文語錄轉行文青風-遭毒舌網民起底學歷好Kam","summary":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。","summary_short":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。","digest":"「籃球女神」譚旻萱早前公開與香港「網球一哥」黃澤林（Coleman）的戀情","points":["「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情","日前她迎來認愛後的首個生日，正式邁入26歲","譚旻萱隨後在社交平台上發文，分享多張美照並配上英文感言，不料卻引來部分網民的冷嘲熱諷"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:00:00+08:00","size":1,"keywords":[],"body":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。日前她迎來認愛後的首個生日，正式邁入26歲。譚旻萱隨後在社交平台上發文，分享多張美照並配上英文感言，不料卻引來部分網民的冷嘲熱諷。\n譚旻萱頻頻放閃 遠赴外地陪男友參賽\n譚旻萱自公開戀情後不時大方放閃，除了曾晒出「男友視角」的車廂照並寫下「Perfect birthday morning」外，此前更特意陪同男友遠赴外地參賽。近日，她在Instagram分享慶生新相，並在貼文中寫上西班牙文「Vamos」（意指「加油」），被指是隔空為男友打氣。\n相關閱讀：Mandy譚旻萱難忘與黃澤林台北之旅 晒男友視角甜爆 早前隨行陪網球一哥比賽感情升溫\n譚旻萱美照配英文金句\n譚旻萱在每張照片上，配上長短不一的英文感性語錄。例如與友人的合照中，寫下「leave me carrying only the love, the growth, and the quiet moments that made even the hard days beautiful」，而在自己吹蠟燭的獨照上，配文「leave a little light behind」及「26 starts now」，營造知性文青的格調。\n相關閱讀：譚旻萱赴台貼身陪黃澤林比賽 傳缺席周六903籃球賽？ 網民質疑只顧拍拖放棄上位\n網民反應兩極 起底學歷指「行為尷尬」\n然而，這番英文感言卻意外引發網民熱議。有網民認為她的舉動過於做作，甚至將其英文語錄截圖在網絡上瘋傳。更有網民起底其學歷背景，留言調侃：「英文水平：荔景天主教中學band 2中五」、「其實英文不好就不要張張寫英文，很Kam（尷尬）」、「英文版大文豪」、「裝作ABC」等。不過，亦有粉絲力撐她寫得有心思，雙方在網上掀起兩極討論。\n相關閱讀：譚旻萱戀黃澤林惹爭議 1年前訪問揭進取性格 追男仔會主動身體接觸：我係好明顯嘅","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1cb6cfc57b","title":"国家广播电视总局举办电视剧《伟大的长征》创作座谈会","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734944.shtml","summary":"中新网北京11月19日电 (记者 高凯)由国家广播电视总局主办的电视剧《伟大的长征》创作座谈会日前在京举行。","summary_short":"中新网北京11月19日电 (记者 高凯)由国家广播电视总局主办的电视剧《伟大的长征》创作座谈会日前在京举行。","digest":"由国家广播电视总局主办的电视剧《伟大的长征》创作座谈会日前在京举行","points":["中新网北京11月19日电 (记者 高凯)由国家广播电视总局主办的电视剧《伟大的长征》创作座谈…","与会人员围绕《伟大的长征》的创作传播经验、思想价值和现实意义以及做好重大革命题材电视剧创作等…","会议指出，电视剧《伟大的长征》是中宣部统筹指导下…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T21:55:31+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 高凯)由国家广播电视总局主办的电视剧《伟大的长征》创作座谈会日前在京举行。与会人员围绕《伟大的长征》的创作传播经验、思想价值和现实意义以及做好重大革命题材电视剧创作等话题进行了交流和探讨。\n\n　　会议指出，电视剧《伟大的长征》是中宣部统筹指导下，广电总局重点指导和扶持的重大革命题材电视剧，是多方协同、合力共创的精品力作。该剧坚持“以长征精神拍长征”，首次全景式呈现波澜壮阔的伟大长征，真实深刻地展现伟大长征精神，以系统详实的史料、精准细腻的表达、精益求精的创作，实现了长征题材电视剧的多个新突破、达到了新高度，是长征题材的史诗之作。\n\n　　国家广播电视总局电视剧司司长冯胜勇表示，《伟大的长征》是重大题材电视剧创作领导小组工作机制的成功实践；是央地协同、多省联动、联合共创的生动范例；是台网联动、同频共振、壮大主流舆论的鲜活例证。\n\n剧集海报。主办方供图\n\n　　《伟大的长征》之所以打动观众，引起热烈社会反响，其创作全过程所体现出的精品意识与匠心精神被认为至关重要。\n\n　　总编剧陈晋表示，主创在创作中紧紧抓住五个字：其中，“大”即全景式反映1934年1月到1937年1月三年党的历史和国内外大背景；“实”即还原历史本貌，让大历史、大感情有落点，小处见真情；“诗”即人物要有超越困境的精神境界；“思”，就是把思想融入故事；“魂”，就是要为作品立“魂”。\n\n　　导演张永新表示，创作该剧，团队始终怀着最大的克制与敬畏，恪守“大处立格局，小处见真情”的创作理念。立足全局，力求讲好远征之史、理顺转折之路，让观众看到信仰在绝境中的坚守与定力。同时团队也用心捕捉历史褶皱里的微小温热的细节，还原出有血有肉的人。\n\n　　演员于和伟(剧中“毛泽东”饰演者)谈到，塑造历史人物的核心是“一切表演扎根规定情境”，首先要尊重史料，但更关键的是要回到故事文本，回到人物当时所处的环境里去判断。\n\n　　演员曹磊(剧中“周恩来”饰演者)表示，他没有将人物简化为定型英雄符号，而是回到长征历史现场，理解巨大不确定性中的抉择、忍耐与坚持。导演提出温润、犀利四个字，也成为他把握人物精神内核的标尺：温润根植于对战士、对人民的体恤，犀利来自信仰原则上不可退让的立场。\n\n　　演员李乃文(剧中“张国焘”饰演者)表示，剧组专业严谨令他感受最深，每句台词、每个动作、每件道具都考究，提醒演员拍的是真实历史。\n\n座谈会现场。主办方供图\n\n　　中央文史研究馆馆员、文艺评论家仲呈祥认为，《伟大的长征》是新时代重大革命历史题材创作的又一部标志性的、里程碑式的作品，是从高原迈上高峰的佳作。该剧汇聚党史军史专家与电视文艺家强强联合，实现了创作资源最佳配置。\n\n　　国家广播电视总局阅评组专家李京盛指出，《伟大的长征》对重大革命历史题材的创作有四点启示：以大历史观打开中国革命历史叙事视角；以危机叙事突出中国革命的复杂性、艰巨性、残酷性；以对领袖人物的群像塑造突出团结奋斗的力量；以人民视角描写普通革命战士的牺牲与奉献。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c697463190c","title":"天氣｜天文台再下調周五氣溫預測 市區最低約14度","url":"https://news.tvb.com/tc/1207326-天氣天文台再下調周五氣溫預測市區最低約14度","summary":"天文台再下調周五氣溫預測，市區最低約14度。入夜後氣溫明顯轉涼，在尖沙咀不少市民出動冷帽、羽絨等禦寒衣物，受強烈東北季候風及雲雨帶影響，氣溫顯著下降。","summary_short":"天文台再下調周五氣溫預測，市區最低約14度。","digest":"入夜後氣溫明顯轉涼，在尖沙咀不少市民出動冷帽、羽絨等禦寒衣物…","points":["入夜後氣溫明顯轉涼，在尖沙咀不少市民出動冷帽、羽絨等禦寒衣物，受強烈東北季候風及雲雨帶影響…","天文台發出特別天氣提示，指晚上及周五顯著轉涼，周五市區氣溫由初時18度…","新界部分地區及高地寒冷，加上風寒效應，提醒市民注意保暖"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T21:55+08:00","size":1,"keywords":[],"body":"天文台再下調周五氣溫預測，市區最低約14度。\n\n入夜後氣溫明顯轉涼，在尖沙咀不少市民出動冷帽、羽絨等禦寒衣物，受強烈東北季候風及雲雨帶影響，氣溫顯著下降。\n\n天文台發出特別天氣提示，指晚上及周五顯著轉涼，周五市區氣溫由初時18度，進一步下降至稍後約14度，新界再低一兩度。新界部分地區及高地寒冷，加上風寒效應，提醒市民注意保暖。\n\n而隨著覆蓋廣東的雲帶周六轉薄，日夜溫差較大，早上仍然相當清涼，而一股達強風程度的偏東氣流下周初影響華南沿岸，氣溫將稍為回升。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/9697a0f3e4874bc0a647958eb7caff7a/snapshots/2e8bcc74e80e431a8292ff84c2cea3ad-00006.jpg","video":"https://pro-vod-cdn.tvb.com/9697a0f3e4874bc0a647958eb7caff7a/ae27f5281baf477898602a336e4d36f8-feba5f9ad978f0575cfa59d4fedf8e42-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/9697a0f3e4874bc0a647958eb7caff7a/snapshots/2e8bcc74e80e431a8292ff84c2cea3ad-00006.jpg","lang":"zh-Hant"},{"id":"c96b6be8dc7","title":"告別的年代丨邱士縉拍床戲事前向太太備案 自爆冇底線唔介意全裸演出 預告MIRROR舞台跳到斷氣","url":"https://www.stheadline.com/film-drama/3638996/告別的年代丨邱士縉拍床戲事前向太太備案-自爆冇底線唔介意全裸演出-預告MIRROR舞台跳到斷氣","summary":"MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映，MIRROR成員柳應廷（Jer）、李駿傑（Jeremy）、ROVER成員王希晉及卓金樂（Kim）、ZPOT等到場支持…","summary_short":"MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映，MIRROR成員柳應廷（Jer）…","digest":"MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映…","points":["MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映…","邱士縉難忘多倫多首映跨越語言","Stanley表示這部電影帶他走訪了許多地方，並與不同地區的台前幕後團隊合作…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:45:42+08:00","size":1,"keywords":[],"body":"MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映，MIRROR成員柳應廷（Jer）、李駿傑（Jeremy）、ROVER成員王希晉及卓金樂（Kim）、ZPOT等到場支持，呂爵安（Edan）因身體不適而缺席，但依然吸引不少粉絲到場支持，場面熱鬧。\n邱士縉難忘多倫多首映跨越語言\nStanley表示這部電影帶他走訪了許多地方，並與不同地區的台前幕後團隊合作，令他感到非常開心與感恩。最難忘是在多倫多首映時，儘管現場不少外國觀眾未必完全聽得懂戲中的語言，卻依然能深刻感受到電影所傳遞的情感與訊息。他直言：「印證了電影的魅力在於跨越語言限制，能透過影像與觀眾心靈交流，看到世界各地都有影迷前來支持，讓我既驚喜又感動。」 \n邱士縉一人分飾雙胞胎\nStanley在戲中一人分飾性格截然不同的雙胞胎兄弟，並與女主角宋芸樺有親密戲及床戲。被問及拍攝親密戲前有否向太太李炘頤「備案」及設下底線？Stanley透露：「我事前都有跟她交代，是出於尊重，不過太太本身都係表演者，她會理解演員的工作性質。」至於自身可有設下底線？他表示：「沒有。（全裸也可以？）可以，只要劇情合理、劇本需要就什麼都可以，身體只是演出工具，所以無須過多顧慮。」\n邱士縉嫌自己太大隻\n談及戲中展現身材的鏡頭，Stanley大爆導演笑言「不要浪費」他的身形，所以戲中要求他大騷結實腹肌，但他竟「嫌棄」自己太大隻，Stanley稱：「因為我個角色係60、70年代，不應該這麼大隻，但拍攝時間有限，沒時間減磅。」\n邱士縉對票房抱平常心\n至於可有票房壓力？Stanley坦言文藝題材向來具一定挑戰性，加上電影改編自原著小說且帶有濃厚馬來西亞背景，若觀眾事前看過小說或熟悉當地文化會更有共鳴。不過他對此抱持平常心，認為電影已成功在馬來西亞、台灣及多倫多等地放映並獲得關注，能夠將作品帶給不同地區的觀眾已屬難得。\n邱士縉排練順利\n除了電影宣傳，MIRROR演唱會亦進入倒數階段。Stanley透露目前排練進度比預期順利，時間充裕，甚至偶爾能提早收工休息。被問及今次會否在舞台上大派福利「騷肌」？他大賣關子笑稱雖然無刻意安排，但透露今次個人挑戰難度極高，其中一隻舞步「跳到就嚟斷氣」，屆時觀眾定能看到他全力以赴的表現，他笑：「會見到我跳完個嘴唇變白！」此外，他亦盛讚即將推出的演唱會主題曲節奏明快、極具氣氛，定能炒熱全場。\n邱士縉回應紀念品「錯體」\n至於演唱會紀念品被指出現「錯體」，其中一款襟章更印錯字及出現亂碼，Stanley直言：「聽公司說是AI圖案有少許出錯，不過他們已馬上修改，但我們的實物貨品是沒問題的。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6a7a231bad","title":"TVB台慶2026‧不斷更新｜羅嘉良「奇哥」再現 梁敏巧跑「東張女神盃」身材太好大落後？","url":"https://www.stheadline.com/film-drama/3638563/TVB台慶2026不斷更新羅嘉良奇哥再現-梁敏巧跑東張女神盃身材太好大落後","summary":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！","summary_short":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！","digest":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日盛大舉行","points":["TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行","今年適逢TVB 59周年，台慶以「TVB與你行得更近，走得更遠」為口號，除了一眾視帝…","《星島頭條》為讀者一文睇清今屆台慶的直播詳情、紅地氈時間及全晚焦點環節…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:45:08+08:00","size":1,"keywords":[],"body":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！今年適逢TVB 59周年，台慶以「TVB與你行得更近，走得更遠」為口號，除了一眾視帝、視后及全台逾百藝員傾力演出外，更有久未回巢的羅嘉良重返舞台重溫經典、許志安擔任壓軸表演嘉賓。《星島頭條》為讀者一文睇清今屆台慶的直播詳情、紅地氈時間及全晚焦點環節，今晚將會為大家不斷更新全晚盛況及得獎名單！\n《萬千星輝賀台慶》播放及直播詳情\n《萬千星輝賀台慶》全晚焦點環節【不斷更新】\nTVB台慶2026表演環節介紹\n《萬千星輝賀台慶》播放及直播詳情\n TVB台慶舉辦日期：2026年11月19日（星期四）\n 紅地氈盛況直播時間：下午5時45分起\n 紅地氈直播平台：TVB官方YouTube頻道、娛樂新聞台Facebook及YouTube、東張+、myTV SUPER 33台\n 台慶典禮現場直播時間：晚上7時45分起\n 電視直播頻道：81台翡翠台\n 大會司儀陣容： 汪明荃擔綱領軍，率領陳貝兒、朱凱婷、洪永城、黃翠如、麥美恩、林溥來、陸浩明、鄭衍峰、周奕瑋、林秀怡、孔德賢、潘靜文組成強大主持組合\n相關閱讀：TVB台慶2026紅地氈丨直播資訊懶人包 小生花旦爭妍鬥麗（附去年紅地氈圖輯重溫）返回目錄\n《萬千星輝賀台慶》全晚焦點環節【不斷更新】\n20:15 在首辦的「東張女神盃」400米跑中，一眾「東張女神」同場決戰。梁敏巧在比賽中大落後，即場被大會司儀陸浩明當眾取笑，指她未知是否因為「身形太好（上圍太豐滿）」而產生阻力，以致影響其跑步速度。而壓軸宣布賽果時，汪明荃亦忍不住開口嘲笑，指獲得第5名的梁敏巧與第6名的何沛珈，在後半段慢條斯理地跑步，笑言兩人簡直就像是在「鬥慢」一樣，喜感十足！\n19:56 接着回到錄影廠，視帝羅嘉良「回娘家」與後輩一同表演，重現《難兄難弟》角色「奇哥」經典。\n19:50 一眾TVB小生與花旦，於隧道熱舞，人才濟濟，活力十足。\n19:45 TVB高層參與亮燈儀式，為TVB 59周年台慶揭開序幕。而一眾司儀包括汪明荃與朱凱婷、麥美恩、林溥來、陸浩明、鄭衍峰、周奕瑋、林秀怡、孔德賢等，齊聚拍開場影片，大放笑彈。其中，麥美恩驚喜上演一幕「走出雪櫃」的幽默表演，效果極具視覺衝擊且喜感十足，成為開場的一大亮點！\n返回目錄\nTVB台慶2026表演環節介紹\n1. 汪明荃領軍致敬幕後功臣 盡顯驚人記憶力\n今年台慶其中一個最感人的焦點環節，是以專業與誠意向默默耕耘的幕後英雄致敬。環節由效力TVB達55年、塑造過逾80個經典角色造型的汪明荃（阿姐）領軍，帶領觀眾深入了解梳化服團隊的付出。在致敬片段中，汪明荃展現驚人記憶力，逐一細數梳化服老中青三代同事的名字、專長以及合作過的難忘造型，流露深厚情誼。此外，視帝譚俊彥、視后龔嘉欣、一眾藝人及神秘嘉賓亦會以不同形式向武指、特技人員、攝製隊及舞台設計團隊等致敬。\n2. 羅嘉良相隔23年回娘家 重現1997年《難兄難弟》\n自2003年離巢後，視帝羅嘉良相隔23年再度參與台慶。他將領軍數十位男女藝員，進行大型歌舞環節，並重演1997年經典神劇《難兄難弟》的精彩場面。而台慶的大型歌舞表演亦邀得陳煒、姚子羚、陳敏之、傅嘉莉四大「炫舞女王」聯手開騷，場面浩大。\n相關閱讀：羅嘉良為台慶2026排練 撐張家輝唔做歌星太浪費 讚劇集拍檔張曦雯聰明\n3. 逾80位藝人一鏡到底！隧道Opening震撼曝光\nTVB率先公開了全台逾80名藝人參與拍攝的隧道Opening片段。片段中多個歌舞大場面均採用「一鏡過」（One Take）直落拍攝，極具難度。短短數秒的鏡頭內有大量走位及動作，足見台前幕後的排練心機，屆時吉祥物TVBuddy亦會穿插其中與藝人互動。\n相關閱讀：萬千星輝賀台慶丨劉穎鏇在未通車隧道狂跑 同張振朗劉佩玥企正C位\n4. 《中年好聲音》破天荒合體 譚輝智黃博挑戰Rap跳舞\n人氣急升的《中年好聲音》成員譚輝智與黃博將破天荒首度合作，挑戰集唱歌、跳舞與Rap於一身的貼身歌舞演出，為觀眾帶來極具新鮮感的舞台演出。\n相關閱讀：萬千星輝賀台慶｜譚輝智望與怕醜囡囡父女檔同台 孖黃博台慶跳辣身舞兼Rap歌\n5. 「魔音女團」MYNT 聯乘韓國學院唱跳新歌\n由宋宛穎、倪嘉雯、莊子璇、倪樂琳、喬美莎及盧映彤組成的「魔音女團」MYNT，將會聯同YS韓國偶像學院的名師及尖子Lenna T.、Mia、Soe、Heily Hu及Venus，在台慶舞台上合力唱跳MYNT的第三首全新主打單曲〈Tic Toc〉。\n相關閱讀：萬千星輝賀台慶｜魔音女團首度公開跳唱新歌〈Tic Toc〉 預告月底全員赴韓接受唱跳特訓\n6. 攜手錢家班亡命挑戰！四大小生呈獻極速特技\n張振朗、劉穎鏇、周嘉洛、朱敏瀚將會聯手著名特技團隊「錢家班」，呈獻高難度動作及飛車表演項目「極速狂奔Speed and Stunt」，以驚險刺激的特技演出向一眾幕後特技英雄致敬。\n相關閱讀：朱敏瀚為TVB台慶綵排發生意外 兩米高墮地現驚險一幕 道具疑因支撐力不足突然倒塌\n7. 首辦「東張女神盃」 400米跑決賽誰是「跑女」之王\nTVB台慶2026首度增設體育競技環節「東張女神盃」，進行400米田徑決賽。一眾《東張西望》人氣主持陳庭欣、何沛珈、梁敏巧、李旻芳、黎寬怡及甘詠寧將會全副武裝化身「跑女」，在台慶的大日子同場競技，爭奪首屆女神盃寶座。\n8. 許志安壓軸Medley經典重現\n許志安將擔任壓軸表演嘉賓，為觀眾帶來一連串耳熟能詳的串燒經典Medley，用歌聲掀起全晚高潮。同場亦有競技趣劇《台慶喎！有嘢唔見咗》，實行全晚笑聲不斷。\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c670358b515","title":"纪录片《百年巨匠-秦含章》杀青 为民族工业巨匠立传","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734883.shtml","summary":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。","summary_short":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。","digest":"人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行","points":["中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京…","该片总导演夏蒙表示，在产业一线撑起民族工业的巨匠同样值得铭记","1931年毕业于上海国立劳动大学农学院，随后负笈欧洲研习农学、微生物学与酿造学"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:37:03+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。该片总导演夏蒙表示，在产业一线撑起民族工业的巨匠同样值得铭记。\n\n纪录片《百年巨匠-秦含章》杀青仪式海报。　百年巨匠文化传播有限公司供图\n\n　　秦含章(1908-2019)，生于江苏无锡，是我国食品工业科学家、一代酿酒泰斗。1931年毕业于上海国立劳动大学农学院，随后负笈欧洲研习农学、微生物学与酿造学。1936年学成归国，1950年出任中央人民政府食品工业部参事，1960年创办轻工业部食品发酵工业科学研究所并任所长。著书40余部，《新编酒经》被誉为“中国酒文化第一书”。茅台集团原董事长季克良、二锅头酿造技艺非遗代表性传承人高景炎等行业名家，皆出其门下。\n\n　　中国酒业协会秘书长何勇表示，杀青是一卷胶片的收束，更是一部精神长卷的总结——一位跨越三个世纪、享年112岁的老人，将从历史深处走到亿万观众的眼前。秦含章先生留给我们最珍贵的东西，是把传统当作根、把科学当作魂的精神。\n\n　　中国文学艺术基金会副理事长兼秘书长周冰表示，作为《百年巨匠》纪录片资助方和出品方，基金会的使命就是让文艺之花更加绚烂绽放。《百年巨匠》里的每一位人物都是中国的艺术灵魂。\n\n　　该片总导演夏蒙分享创作理念时说，匠人是把一件事做到极致；而巨匠是在极致之上，拥有格局与担当。秦含章有科学家的严谨，有读书人的风骨，有产业报国的赤诚。他一个人打通了传统酿造和现代科学之间的壁垒，让千年酒文化在现代工业时代站稳脚跟，走向更远的未来。“我们不只有书画文学的巨匠，在产业一线还有撑起民族工业的巨匠，他们同样值得被时代铭记。”\n\n　　据了解，摄制组先后赴北京、山西、无锡、重庆、南京、武汉等地取景，并远赴德国柏林、法国波尔多、比利时等秦含章当年求学与工作之地实地拍摄，还采访了季克良、高景炎、宋书玉等十余位行业专家和亲历见证者。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c83db8cfbb8","title":"Coffee林芊妤重提「殘廁事件」承受大壓力 曾飽受舊愛家暴 誤信「打你係因為愛」","url":"https://www.stheadline.com/film-drama/3638920/Coffee林芊妤重提殘廁事件承受大壓力-曾飽受舊愛家暴-誤信打你係因為愛","summary":"37歲的林芊妤（Coffee）於2018年結婚，婚後與老公翟志榮育有一子一女，近年轉型為人氣瑜伽導師兼KOL，可謂事業愛情兩得意。","summary_short":"37歲的林芊妤（Coffee）於2018年結婚，婚後與老公翟志榮育有一子一女，近年轉型為人氣瑜伽導師兼KOL…","digest":"37歲的林芊妤於2018年結婚，婚後與老公翟志榮育有一子一女…","points":["37歲的林芊妤（Coffee）於2018年結婚，婚後與老公翟志榮育有一子一女…","Coffee日前作客由伍詠薇（伍姑娘）及李凱賢（Brian）主持的HOY節目《九運會客室2》…","Coffee林芊妤走出低谷轉型變百萬KOL"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:30:00+08:00","size":1,"keywords":[],"body":"37歲的林芊妤（Coffee）於2018年結婚，婚後與老公翟志榮育有一子一女，近年轉型為人氣瑜伽導師兼KOL，可謂事業愛情兩得意。Coffee日前作客由伍詠薇（伍姑娘）及李凱賢（Brian）主持的HOY節目《九運會客室2》，大方剖白童年陰影及婚姻生活，期間亦再次主動提及當年的「殘廁事件」。\nCoffee林芊妤走出低谷轉型變百萬KOL\n當年的「殘廁事件」令Coffee形象受損並離開TVB。重提舊事，她坦言當時壓力極大：「咁梗係好大壓力啦！嗰時件事咁大！我覺得我當時係無諗咁多，亦都無計劃要點做。」Coffee透露，在事件發生前她已因病暫停工作，期間為了慳錢而考取瑜伽導師牌照，並開始提供一對一教學。這份因緣際會，最終成為她離巢後的事業新出路，成功轉型為百萬KOL。\n相關閱讀：Coffee林芊妤罕解構「殘廁事件」真相 遭TVB解約面對樂小姐極無助 拒回舊公司：保留少少尊嚴\nCoffee父親重男輕女 體罰釀成童年陰影\nCoffee在節目中提到，自己的愛情觀深受童年被父親體罰的經歷影響。她透露父親思想傳統、工作壓力大，經常對子女施以嚴重體罰；加上重男輕女，她童年時宛如哥哥的「奴婢」，包辦洗碗、拿鞋襪等家務。\n她回憶有次幫父親清潔抽油煙機時割傷腳趾，現場血流如注，家人卻沒有帶她求醫：「我可以體諒佢，我原諒佢當初咁樣。但係細個嗰時，其實我都有好多次會覺得，點解我會喺呢個屋企入面呢？究竟我嘅人生係咪就係咁呢？即係其實都幾黑暗㗎。」\n相關閱讀：Coffee林芊妤消暑夏水禮連環派福利 「水著放題」換泳衣越見少布 火辣身材勁吸睛\nCoffee默默承受初戀家暴\n中學時，Coffee曾因不滿父親體罰而離家出走，其後父親第一次向她道歉並表示：「其實我都是因為好緊張你，好愛你，我先打你。」這句「打你是因為愛」卻深植在她的潛意識中。\n17歲時，Coffee與大她兩歲的初戀男友交往。對方佔有慾極強，經常無故懷疑她，並限制其穿着及外出時間，甚至對她動粗，但Coffee卻選擇默默承受。她直言：「佢會打我，拳打腳踢。佢打咗我幾次，佢話：『我係因為好愛你，我先至會打你。』但係呢句，點解會喺我度生效？因為我爸同我講過呢句說話，我入咗血呀！」幸好，她後來遇到現任老公翟志榮，才真正獲得幸福。\n相關閱讀：Coffee林芊妤揭童年陰影 被家人貼「低能」標籤：覺得我冇得救 爆蘭桂坊「跪街」真相\nCoffee老公「有部署」未婚懷孕\nCoffee與翟志榮在酒吧相識，她當時已覺得對方高大帥氣。兩人拍拖兩年期間，翟志榮曾多次求婚，但Coffee擔心影響剛起步的瑜伽事業而婉拒。\n後來Coffee意外懷孕，她笑指老公其實早有「預謀」，因為對方平日做事非常細心、防範措施一向做足。得知懷孕後，極度自卑的Coffee曾擔心對方只是出於責任而結婚，甚至對老公說：「其實你唔使一定要娶我，我們可以繼續咁，我可以自己照顧小朋友。因為我成日睇到自己好低，覺得無人會想要我、無人會愛我。」直到後來從朋友口中得知，老公在拉埋天窗前早已默默物色及訂購求婚戒指，這份心意才讓她放下心頭大石，安心出嫁。\n相關閱讀：Coffee林芊妤最新內衣福利圖陷走光疑雲 內褲極高衩疑露敏感部位 親理品牌IG老貓燒鬚","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca9cc574fa7","title":"每星期快走3次可改善記憶力！研究證海馬體增2% 附最佳方式防認知障礙","url":"https://www.stheadline.com/health-care/3638521/每星期快走3次可改善記憶力研究證海馬體增2-附最佳方式防認知障礙","summary":"大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」。","summary_short":"大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」。","digest":"大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」","points":["大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」","研究指，每週快走3次，能有效令其掌管記憶的海馬體增大2%","每週3次快走令海馬體增大2% 刺激大腦強化記憶"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:00:42+08:00","size":1,"keywords":[],"body":"大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」。研究指，每週快走3次，能有效令其掌管記憶的海馬體增大2%！\n每週3次快走令海馬體增大2% 刺激大腦強化記憶\n美國匹茲堡大學與伊利諾大學的神經科學團隊曾發表1項刊登於《美國國家科學院院刊》（PNAS）的里程碑研究，招募120名平均年齡66歲、平日缺乏運動的中老年人進行1年追蹤，結果發現每週快走3次的組別，其掌管記憶的核心腦區「海馬體」平均增大2%，成功逆轉自然老化萎縮的軌跡。\n隨著年齡增長，負責學習、記憶與空間導航的海馬體會逐年自然萎縮，與短期記憶力衰退及患上認知障礙症（俗稱腦退化症）的風險息息相關。實驗中，對照組（僅作伸展運動）的海馬迴在1年內自然縮小了1.4%，但每週進行3次、每次40分鐘中等強度快走的組別卻不減反增：\n研究負責人 Kirk Erickson 教授指出，海馬體體積增大的幅度愈明顯，受試者在記憶力測驗中的進步亦愈顯著，證實大腦結構的物理性改善能直接反映在認知功能之上。\n科學家解釋，快走等中等強度有氧運動能顯著提升體內的「腦源性神經營養因子（BDNF）」。BDNF 猶如大腦的天然肥料，專門負責幫助神經細胞長出新連結、強化神經可塑性、保護腦細胞免受損傷及促進記憶形成；2025年多篇國際期刊系統回顧亦指出，相比其他運動，「步行」最容易讓人長期堅持，且原本最缺乏運動的人開始快走後進步幅度往往最大。\n大腦抗老方法\n6大步行健康好處 抗發炎、穩血糖、防腦退化\n許多人誤以為走路運動量太低、保健效果有限，事實上規律快走能同時帶動身體與大腦的「雙重復甦」，除護腦外更可減低慢性發炎反應、降低血壓、提升胰島素敏感度以穩定血糖、改善心肺耐力、減少壓力荷爾蒙（皮質醇）分泌及提升睡眠品質。面對全球高齡化及認知障礙症患者急增的挑戰，專家建議市民按以下「最佳步行方式」：\n 時間： 每週進行 3 次 快走，每次持續 40 分鐘，並持之以恆至少 12 個月。\n\n 強度： 步行速度應維持在「稍微感到氣喘、但仍能順暢說話」的中等有氧強度，無須昂貴器材或健身室會籍，只需1雙舒適運動鞋即可隨時啟動。\n\n 注意： 若平日完全沒有運動習慣，初學者可先從每次15分鐘起步，再逐步延長至40分鐘；科學家強調，健腦抗老的關鍵不在於一時的高強度衝刺，而在於長期規律持續。\n\n 延伸閱讀：牛津研究揭每日行夠這步數 可預防13種癌症 肝癌/肺癌/大腸癌上榜\n---","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"caa40e0e3cd","title":"天氣｜預測明日市區最低約14度 提醒市民注意保暖","url":"https://news.tvb.com/tc/1207280-天氣預測明日市區最低約14度提醒市民注意保暖","summary":"天文台再下調明天氣溫預測，市區最低約14度。受強烈東北季候風及雲雨帶影響，氣溫顯著下降，下午多區錄得18至21度，較昨日低約五度。","summary_short":"天文台再下調明天氣溫預測，市區最低約14度。","digest":"天文台再下調明天氣溫預測，市區最低約14度","points":["天文台再下調明天氣溫預測，市區最低約14度","受強烈東北季候風及雲雨帶影響，氣溫顯著下降，下午多區錄得18至21度，較昨日低約五度","天文台發出特別天氣提示，指今晚及明天顯著轉涼，明天市區進一步下降至約14度，新界再低一兩度"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T18:06+08:00","size":1,"keywords":[],"body":"天文台再下調明天氣溫預測，市區最低約14度。\n\n受強烈東北季候風及雲雨帶影響，氣溫顯著下降，下午多區錄得18至21度，較昨日低約五度。\n\n天文台發出特別天氣提示，指今晚及明天顯著轉涼，明天市區進一步下降至約14度，新界再低一兩度。新界部分地區因高地寒冷加上風寒效應，提醒市民注意保暖。\n\n而隨著覆蓋廣東的雲帶周六轉薄，日夜溫差較大，早上仍然相當清涼，而一股達強風程度的偏東氣流，下周初影響華南沿岸，氣溫將稍為回升。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/1a74fdd416754e0ea912e1d833599ffc/snapshots/32513519aad347e581aa5d1c33765006-00005.jpg","video":"https://pro-vod-cdn.tvb.com/1a74fdd416754e0ea912e1d833599ffc/ff0e172a7b4349679182fd7c442517f1-b4165f97a6054e75e1d34ef3fe482afb-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/1a74fdd416754e0ea912e1d833599ffc/snapshots/32513519aad347e581aa5d1c33765006-00005.jpg","lang":"zh-Hant"},{"id":"c8a841d4efb","title":"打城戏迎来“新话事人” “Z世代”接续守护稀有剧种","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734756.shtml","summary":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行。","summary_short":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　18日至19…","digest":"题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　1…","points":["18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行","打城戏又名“法事戏”“和尚戏”“道士戏”，是国内独树一帜的仪式戏曲…","曾经，受多重因素影响，打城戏面临剧目散失、艺人流失，被其他剧种同化的危机，一度走到濒危的边缘"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:32:15+08:00","size":1,"keywords":[],"body":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种\n\n　　作者 叶秋云\n\n　　18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行。打城戏折子戏《目连救母·过滑油山》《目连救母·代母绕枷》《真假美猴王·闹地府》《三打白骨精·擒僧》轮番登台，古老闽南戏韵响彻剧场。\n\n　　打城戏又名“法事戏”“和尚戏”“道士戏”，是国内独树一帜的仪式戏曲，已被列入国家级非物质文化遗产代表性项目名录。\n\n　　曾经，受多重因素影响，打城戏面临剧目散失、艺人流失，被其他剧种同化的危机，一度走到濒危的边缘。吴天乙、洪球江、黄锡均、黄莺莺、伍志新、吴晓军、黄海山等老一辈艺人倾尽半生心血，口传心授开展传承活动，让打城戏重返舞台。\n\n　　如今，泉州市打城戏传承中心挂靠高甲戏传承中心，实行“一团制”(一套班子、两个剧团)的运行模式，体制与民间传承双向并行。泉州市高甲戏传承中心主任周杰俊说，打城戏是珍贵的、具有重要价值的文化资源，一代代年轻人接过接力棒，继续守护和传承这份濒临消逝的戏曲记忆。\n\n11月18日，泉州市打城戏传承中心“00后”演员陈德佳(左一)在打城戏折子戏《目连救母·代母绕枷》中饰演目连。叶秋云 摄\n\n　　展演现场，折子戏《目连救母·代母绕枷》精彩上演，饰演目连的“00后”演员陈德佳带伤上阵，翻腾跳跃，利落的武打特技引得台下掌声阵阵。\n\n　　陈德佳自12岁开始学习打城戏，至今已经与之相伴十余载。“打城戏是一个断层情况十分严重的剧种。”谈起传承的难处，陈德佳感触颇深，老一辈艺人年事已高，留存下来的大多只是纸质史料，完整影像资料寥寥无几，年轻演员越来越难获得老艺人面对面言传身教的机会。“我们必须与时间赛跑，避免陷入‘人亡艺绝’的境地。”\n\n　　自2019年以来，在文旅部门和院团推动下，泉州市打城戏传承中心扎实开展打城戏掷铙钹、吃纸吐火等特技表演，累计抢救整理创排《劈山救母》《汉宫风云》等十多部剧目。与此同时，《代母绕枷》《过滑油山》《望乡台》等目连戏传统老戏也在持续挖掘复排，守住剧种的根脉。\n\n11月18日，泉州市打城戏传承中心“00后”演员苏有明(右二)在打城戏折子戏《真假美猴王·闹地府》中饰演美猴王。叶秋云 摄\n\n　　过去，打城戏传播渠道较为单一，大多依靠下乡巡演；如今，不少看完演出的戏迷自发在社交媒体分享片段。线上“种草”带动线下观演，不少上海、浙江等地的观众跨越千里专程来到泉州看戏。“这是新时代赋予我们的红利。”“00后”演员的苏有明坦言，机遇背后同样是沉甸甸的责任和压力，“主动担当是我辈义不容辞的文化责任”。\n\n　　守正不忘出新，青年演职人员也在探索适配当代观众的表达。剧团在强调剧种特性，保持剧种特色的同时，不断升级舞美灯光，运用布景机关补足演员难以实现的舞台效果；在《三打白骨精》等剧目中适度加入生活化、网络化台词，增添喜剧趣味，拉近和观众的距离。\n\n　　周杰俊表示，长期以来在各级部门和领导、专家、侨胞等社会各界人士的关心重视下，打城戏抢救、传承、研究和展示的实践探索，在人才培养、剧目整理创作和艺术研究等方面取得了可喜的成果。保护传承单位的设立及各项具体保护传承机制的组织实施，令打城戏“95后”“00后”演员从翻阅泛黄史料复原身段唱腔，到站上展演舞台挑大梁，正成为打城戏新一代“话事人”。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c137ad6d104","title":"天氣轉冷狂流鼻水、打乞嚏 中醫教3穴位 通鼻竅/防鼻敏感","url":"https://www.stheadline.com/health-edu/3638840/天氣轉冷狂流鼻水打乞嚏-中醫教3穴位-通鼻竅防鼻敏感","summary":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。","summary_short":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。","digest":"踏入秋冬季，不少人會出現鼻敏感反覆發作，特別是天氣轉變時尤其明顯","points":["踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯","中醫認為，長期處於冷氣環境及喜食冷飲，會令寒氣鬱閉、損傷陽氣，使抵抗力下降…","濟南市國家醫院分享了簡便易行的自我保健方法，適合市民日常應用："],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:31:22+08:00","size":1,"keywords":[],"body":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。中醫認為，長期處於冷氣環境及喜食冷飲，會令寒氣鬱閉、損傷陽氣，使抵抗力下降，增加鼻敏感發作機會。除積極治療外，配合穴位按摩、艾灸及敷貼等方法，有助宣通鼻竅、紓緩不適。\n3大核心穴位 通鼻竅、安神、強體質\n除內服藥物外，中醫外治法可有效控制鼻炎症狀，降低復發率。濟南市國家醫院分享了簡便易行的自我保健方法，適合市民日常應用：\n【同場加映】轉季鼻敏感發作、狂打乞嚏！營養學家推介4類抗敏食材 連皮蘋果、紫洋蔥助止鼻水？\n1. 迎香穴——通鼻第一穴\n位置：鼻翼外緣中點旁、鼻唇溝中。\n手法：以食指指腹順時針按揉1至2分鐘。\n功效：能快速疏通鼻道，緩解鼻塞、流涕及嗅覺失靈，是治療鼻炎的常用特效穴，鼻子不適時按壓最為直接。\n2. 印堂穴——安神定敏\n位置：在兩眉頭連線的中點。\n手法：以拇指或中指指腹自下而上推按或點按約1分鐘。\n功效：配合迎香穴使用，既能通鼻竅，亦可紓緩鼻炎引起的頭昏腦脹，安神穩定情緒。\n3. 合谷穴——強壯外援\n位置：在手背第1、2掌骨間，第2掌骨橈側中點，即虎口位置。\n手法：以對側拇指用力按壓，以有酸脹感為宜，維持1至2分鐘。\n功效：中醫有「面口合谷收」之說，合谷是調理頭面部的要穴，能增強體質，幫助改善過敏底子。\n應急技巧：搓揉迎香穴 快速通鼻塞\n以食指指腹按在迎香穴上，快速沿鼻樑兩側上下推擦約1至2分鐘，至鼻部發熱；也可用熱毛巾敷鼻，直至毛巾變冷。此法能瞬間擴張血管、通氣，紓緩鼻塞。建議每天早晚各做一套，持之以恆，鼻部不適會逐漸減少。\n艾灸與敷貼 逐寒濕、通氣血\n江蘇省中醫院針灸康復科主任醫師孫建華指，艾灸可逐寒濕、通氣血，對鼻炎有一定療效。隔薑灸法以鮮生薑切片，中間刺孔，置於背部大椎、肺俞及風門穴上，再放艾炷施灸，每穴灸3炷，以皮膚潮濕、紅潤為度。生薑辛溫走竄，可增強艾灸效果。\n穴位敷貼方面，夏季鼻炎症狀緩解時，可採用白芥子、甘遂、細辛等藥物加減，調以薑汁成丸，敷貼於背部定喘、肺俞及腎俞穴，讓藥物滲入皮膚，隨經絡氣血運行吸收，以期減少冬季發作。傳統以三伏天為最佳時機，臨床觀察整個三伏天均可考慮。惟敷貼並非人人適宜，正處疾病發作期、有嚴重慢性疾患、對藥物過敏、皮膚破潰或長有瘡癤者不宜；2歲以下幼兒皮膚嬌嫩，亦不建議。敷貼後應避寒保暖，忌食生冷，以免寒氣凝滯影響療效。\n穴位按摩與艾灸敷貼屬輔助保健，不能取代正規診治；使用以上輔助保健之前，應先立即求醫或諮詢專業中醫師。\n資料來源：孫建華醫師、濟南市國家醫院\n鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發','/health-care/3345484/鼻敏感飲食開冷氣易鼻敏感流鼻水中醫推介15種食物湯水紓緩防病發');\" oncontextmenu=\"cckevent('Article','鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發','/health-care/3345484/鼻敏感飲食開冷氣易鼻敏感流鼻水中醫推介15種食物湯水紓緩防病發');\">延伸閱讀：鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發\n---","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c76d415a234","title":"伍詠薇爆邀閨密上節目被開天價 袁詠儀成嫌疑人？ 靚靚曾撐好友做嘉賓近兩年忽然少交集","url":"https://www.stheadline.com/film-drama/3638902/伍詠薇爆邀閨密上節目被開天價-袁詠儀成嫌疑人-靚靚曾撐好友做嘉賓近兩年忽然少交集","summary":"現年57歲的伍詠薇向來性格直率。","summary_short":"現年57歲的伍詠薇向來性格直率。","digest":"現年57歲的伍詠薇向來性格直率","points":["現年57歲的伍詠薇向來性格直率","近日她擔任陳敏之網台節目《Chi Chat》的嘉賓時…","她主動提供了一份好友名單，當中包括一位相識多年的女性好友"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"現年57歲的伍詠薇向來性格直率。近日她擔任陳敏之網台節目《Chi Chat》的嘉賓時，透露早前主持HOY節目《九運會客室》第二季期間，節目組曾協助聯絡嘉賓。她主動提供了一份好友名單，當中包括一位相識多年的女性好友。豈料對方得知是伍詠薇的節目後，竟透過團隊要求遠超常規的車馬費才肯受訪。伍詠薇對此感到不滿，直言若無意受訪大可婉拒，而非提出高昂費用為難幕後人員，認為此舉缺乏尊重。片段播出後引起網民熱烈討論，紛紛猜測該女星的身份，其中最多人聯聯想到其相識30年的閨密袁詠儀。\n伍詠薇與袁詠儀逾30年姊妹情\n伍詠薇與袁詠儀是相識超過30年的圈中閨密，兩人於1994年合作電影《姊妹情深》結緣。當時身為香港小姐冠軍的袁詠儀起初對亞洲小姐出身的伍詠薇有些微言，心想：「她是亞洲電視的，和我一起拍戲？」沒想到合作後發現兩人性格同樣豪爽，隨即一拍即合。\n相關閱讀：伍詠薇曾患抑鬱症提早交代身後事 怨好友疏遠：我啲朋友去咗邊 一原因鬧老友「黐X線」\n伍詠薇曾調侃袁詠儀缺乏情趣\n兩人相處百無禁忌，袁詠儀曾透露伍詠薇吃飯時愛把骨頭吐進她的碟子裡，而伍詠薇也曾調侃袁詠儀「缺乏情趣」，笑稱張智霖說笑話時只有自己會給予反應，令袁詠儀反擊指兩人「有曖昧」。\n伍詠薇與袁詠儀曾有誤會\n雖然平時喜歡互相鬥嘴，但她們極為珍視這段友誼。2016年伍詠薇主持節目《伍姑娘真識食》邀請袁詠儀擔任嘉賓時，兩人都曾因「袁詠儀私下不希望與丈夫張智霖同台現身」而產生小誤會。誤會解開後，袁詠儀更大方送上一枚鑽石戒指予伍詠薇，象徵二人友誼永固。\n相關閱讀：張智霖兒子魔童20歲生日照曝光 張慕童輪廓深邃超靚仔 五官神複製《金枝玉葉》袁詠儀\n伍詠薇認曾對張智霖動心\n伍詠薇與張智霖同樣稔熟，二人以姊弟相稱，但她曾自爆當年對張智霖動過心，笑言：「當時我有想過跟靚靚『鍊過』，但鍊了個阿練（練海棠）回來。」張智霖則感性表示：「她對我的喜歡變成了疼愛。」伍詠薇常跟張智霖分享秘密，卻怨他口疏轉頭就告訴靚靚，足見三人感情深厚。而張智霖亦曾笑指伍詠薇「成日放飛機」。\n伍詠薇與袁詠儀近兩年較少交集\n不過，今年伍詠薇主持兩輯《九運會客室》，均未見袁詠儀和張智霖擔任嘉賓，而袁詠儀和伍詠薇近兩年的公開交集亦明顯減少。這次伍詠薇透露「高昂車馬費事件」，令網民再度關注這對昔日閨密的最新關係。\n相關閱讀：張智霖兒子休學與爸爸童年缺失有關？父子檔上台認有私心：點解我要多承擔呢份壓力","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":10,"items":[{"id":"c18264b0e15","title":"「見龍在田：赤洲與中國內地恐龍化石展」開幕","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900241.htm","summary":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。","summary_short":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。","digest":"「見龍在田：赤洲與中國內地恐龍化石展」於香港文物探知館舉行開幕典禮","points":["展覽由發展局和中國科學院古脊椎動物與古人類研究所（古脊椎所）合辦…","發展局局長甯漢豪在開幕典禮致辭時表示，赤洲恐龍化石發掘工作在二○二四年十月開展…","亦感謝廣西壯族自治區自然博物館、浙江自然博物院及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T21:48:00+08:00","size":1,"keywords":[],"body":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。展覽由發展局和中國科學院古脊椎動物與古人類研究所（古脊椎所）合辦，展示香港赤洲發現的恐龍化石，揭開本土巨型恐龍的神秘面紗，同時結合粵港澳大灣區其他地方和全國多地的豐富化石寶庫，全面展現中國恐龍世界的演化歷史和生存圖景。\n\n　　發展局局長甯漢豪在開幕典禮致辭時表示，赤洲恐龍化石發掘工作在二○二四年十月開展，隨着清修和研究工作逐步完成，是次展覽不僅標誌着在香港首次發現恐龍化石這難得事情，更要強調這些化石展現恐龍當年的鋒芒、蘊藏的歷史及香港遠古生態環境。她特別感謝古脊椎所在恐龍化石的發掘、清修、研究，以至挑選展品和策展方面，提供了專業的指導及協助，並借出珍貴化石標本作為展品；亦感謝廣西壯族自治區自然博物館、浙江自然博物院及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴藏品。經策展團隊悉心策劃，展覽讓來自不同地方的恐龍化石同場展出對話，說好恐龍故事。\n\n　　古脊椎所所長徐星教授致辭時表示，這次合作是香港古生物研究的重要里程碑。他感謝發展局對聯合研究與科普活動的全力支持，並希望透過是次展覽，讓香港市民了解赤洲恐龍化石的最新研究成果，認識香港恐龍在中國乃至全球恐龍演化歷程中的獨特地位；同時讓公眾近距離接觸古生物學，提升公眾對古生物的興趣和知識。\n\n　　其他展覽開幕典禮的主禮嘉賓包括發展局常任秘書長 （工務）劉俊傑、古物諮詢委員會主席許焯權教授和保育歷史建築諮詢委員會主席蘇彰德教授。\n\n　　展覽共展出66組珍貴展品，既有在香港赤洲出土的全部恐龍骨骼化石，亦有來自粵港澳大灣區其他地方以至內地廣東省以外的白堊紀恐龍化石。來自內地的46組化石中，34組為國家一級重點保護古生物化石。這次來港展覽的化石，大部分都是首次在香港展出。赤洲恐龍化石（當中多件骨骼化石相信來自同一隻「泰坦巨龍形類」恐龍）、擁有完整頭骨的徐氏亞洲暴龍骨骼化石、具有骨質頭冠但沒有上下牙齒的斑嵴龍頭骨化石、體型龐大的諸城暴龍頜骨骼化石、竊蛋龍類恐龍所產的長形蛋化石，以及帶有胚胎的恐龍蛋化石都是這次展覽的亮點。\n\n　　此外，展覽以模型呈現中國恐龍的面貌，深入淺出地解說中國恐龍的演化。為推廣古生物相關知識，香港文物探知館將舉辦一系列公眾講座和多元化的工作坊，讓公眾深入了解古生物化石和古生態。\n\n　　展覽免費入場，詳情如下：\n\n日期：二○二六年十一月二十日至二○二七年五月十二日\n\n開放時間：\n\n星期一至三及星期五早上十時至下午六時；\n\n星期六、日及公眾假期早上十時至晚上七時；\n\n星期四（公眾假期除外）、農曆年初一及二休館\n\n地點：尖沙咀海防道九龍公園香港文物探知館\n\n　　有關展覽、相關活動資料以及精華短片，請瀏覽古蹟辦網頁（www.amo.gov.hk/tc/visitor-centre/exhibitions/heritage-discovery-centre/dinosaur-exhibition/index.html）。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce83107ce70","title":"2026香港資訊及通訊科技獎踏入二十周年 表揚卓越創科成果","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900414.htm","summary":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會頒發全年大獎。","summary_short":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造…","digest":"2026香港資訊及通訊科技獎頒奬典禮今晚舉行…","points":["2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行…","勝出隊伍憑「人工智慧清潔水箱機器人」繼獲得商業方案獎大獎後，再勇奪今年比賽的最高殊榮","財政司司長陳茂波在頒獎典禮致辭時表示：「回顧歷屆得獎作品，足見科技發展一日千里"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T20:10:00+08:00","size":1,"keywords":[],"body":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會頒發全年大獎。勝出隊伍憑「人工智慧清潔水箱機器人」繼獲得商業方案獎大獎後，再勇奪今年比賽的最高殊榮。\n\n　　財政司司長陳茂波在頒獎典禮致辭時表示：「回顧歷屆得獎作品，足見科技發展一日千里。科技日新月異，但歷屆得獎者始終有一個共通之處：他們洞悉社會所需，並以創新方法回應需要。」\n\n　　陳茂波指出，人工智能現已廣泛應用，但部分最重要的應用或尚待發掘。他說：「人工智能固然有助我們把現有工作做得更好，但更值得深思的是，它能讓我們以何種嶄新方式行事。今晚不少得獎者正為我們指引方向。他們所展示的，不僅是人工智能的功能，更是人工智能為大眾開創的種種可能。」\n\n　　他指出，政府的角色是為創新者締造有利的發展條件。政府正透過「AI+與產業發展策略委員會」，推動更多產業應用人工智能。興建中的沙嶺數據園區將提升香港的算力；香港人工智能研發院會促進科研成果轉化為實際應用。政府亦致力培育專才，並透過「全民AI」計劃，協助社會各界善用人工智能。\n\n　　香港資訊及通訊科技獎自二○○六年設立以來，一直是本地資訊科技界的年度盛事。獎項今年踏入二十周年，見證着香港資訊及通訊科技業界多年來的創新與發展，並持續表揚在資訊及通訊科技發明及應用方面表現出色的企業和人才，鼓勵業界精益求精，發揮創意，推動創新科技發展，並積極開拓內地及海外市場。\n\n　　這項年度盛事由數字政策辦公室舉辦，並在八個籌辦機構、督導委員會、標準保證小組委員會、最終評審委員會、市場推廣小組委員會、各評審和支持機構及業界組織的共同支持下順利舉行。最終評審委員會主席、香港浸會大學校長衞炳江教授衷心祝賀所有得獎者，並對本屆參賽者和得獎者所展現的才華、熱誠及投入深感鼓舞。\n\n　　衞炳江教授說：「各位得獎者憑藉深厚的專業知識、嚴謹的研發精神和出色的執行能力脫穎而出，實至名歸。他們的成就彰顯香港資訊及通訊科技業蓬勃發展；而這份蓬勃活力，正有賴業界一眾從業員、科研人員、創業者及專業團隊多年來的努力、投入和貢獻。他們持續把創新意念轉化為具實際效益的方案，進一步印證香港作為國際創新科技中心的實力與潛力。」\n\n　　創新科技及工業局局長孫東教授在頒獎典禮上頒發獎座予八個獎項類別的大獎得主，嘉許他們的傑出表現。各大獎得主為：\n\n 獎項類別\n\n （籌辦機構）\n 大獎得主\n\n （作品名稱）\n\n 數碼娛樂獎\n\n （香港數碼娛樂協會）\n 極專注有限公司 \n\n （QuestXR結合AI的XR遊戲創作平台）\n\n 金融科技獎\n\n （香港銀行學會）\n 亞丁金融控股有限公司\n\n （亞丁場外資產電子化交易平台）\n\n 資訊科技初創企業獎\n\n （香港無線科技商會）\n 炫幻視界\n\n （智匯：危機應變智能體）\n\n 商業方案獎 \n\n （香港電腦學會）\n 機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會\n\n （人工智慧清潔水箱機器人）\n\n 智慧生活獎\n\n （香港資訊科技商會）\n 鋒視有限公司\n\n （面具師® — 具身智能神經康復系統）\n\n 智慧出行獎\n\n （香港貨品編碼協會）\n 港鐵公司\n\n （無人機隧道巡檢系統）\n\n 智慧市民獎\n\n （香港社會服務聯會）\n 健聲科技有限公司\n\n （聲語同行）\n\n 學生創新獎\n\n （香港創科發展協會）\n 香港科技大學（李思晉／黎卓寧／梁晶晶／吳卓庭）／香港中文大學（陳顥邦）\n\n （Syntrak）\n\n　　得獎者及比賽的詳細資料已上載香港資訊及通訊科技獎網站（www.hkictawards.hk）。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0698d4af4a","title":"發展局局長出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮致辭","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900572.htm","summary":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）、許教授（古物諮詢委員會主席許焯權教授）、蘇教授（保育歷史建築諮詢委員會主…","summary_short":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）…","digest":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物…","points":["尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）…","時間過得很快，兩年前我們公布香港首次發現恐龍化石，都是在這裏公布，當時全城雀躍哄動","發展局接着與中國科學院古脊椎動物與古人類研究所（古脊椎所）簽署《框架協議》（《關於深化地層古…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T19:02:00+08:00","size":1,"keywords":[],"body":"以下是發展局局長甯漢豪今日（十一月十九日）出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：\n\n尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）、許教授（古物諮詢委員會主席許焯權教授）、蘇教授（保育歷史建築諮詢委員會主席蘇彰德教授）、各位嘉賓、各位朋友：\n\n　　大家好。首先歡迎各位出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮。\n\n　　時間過得很快，兩年前我們公布香港首次發現恐龍化石，都是在這裏公布，當時全城雀躍哄動。發展局接着與中國科學院古脊椎動物與古人類研究所（古脊椎所）簽署《框架協議》（《關於深化地層古生物及史前時期遺址領域交流與合作的框架協議》），開展緊密合作，馬上進行赤洲恐龍化石的發掘、清修和研究工作。\n\n　　赤洲恐龍化石發掘工作在二○二四年十月開展。當時赤洲一帶風浪極大，加上化石岩層位於海邊斜坡上，發掘期間還遇上颱風及不穩定天氣，為發掘和田野研究工作帶來極大挑戰。發掘完成後，化石清修工作馬上展開，經過專家兩年的努力，多件恐龍化石標本才逐漸顯露其真正容貌；接着由恐龍專家進行深入研究工作。經古脊椎所專家鑑定，赤洲出土的多件恐龍骨骼化石，很可能來自同一隻屬於「泰坦巨龍形類」的恐龍。\n\n　　隨着清修和研究工作逐步完成，我們籌備了這個展覽。展覽的名稱為「見龍在田」，其實亦有其故事。「見龍在田」是出自《易經》一個卦象，其直接意思就是發現一隻神秘的龍離開了潛伏之地，現身在田野大地，顯露其鋒芒。其實與今次展覽非常貼切，我們在赤洲有神秘的恐龍，被發現並展現在大地上顯露其鋒芒。今次這個展覽不單標誌着在香港首次發現恐龍化石這難得的事情，更是要強調這些化石展現給大家看牠們當年的鋒芒、蘊藏的歷史，展現香港遠古生態環境。\n\n　　展覽以赤洲恐龍為切入點，公布今次研究工作的階段性成果，包括從合共31塊含有化石的岩石標本清修出來的恐龍骨骼化石，剛才我提到應該來自同一隻恐龍，而其實專家還認為它們都是來自該恐龍身上的某一個部位，究竟是哪個部位，我相信大家看完展覽後便會清楚。這次展覽也展示國家在恐龍研究方面的成就，並且匯聚了來自內地四家博物館及研究機構共54組展品，其中化石有46組，當中多達七成是國家一級重點保護古生物化石，絕大部分都是首次在港展出，所以非常珍貴。為了配合展覽和推廣古生物，特別是恐龍的知識，策展團隊特別安排一系列的公眾講座和多元有趣的工作坊等教育活動，讓公眾享受古生物化石的樂趣。\n\n　　我要特別感謝古脊椎所，他們在恐龍化石的發掘、清修、研究，以至挑選展品和策展方面，提供了專業的指導及協助，並借出珍貴化石標本作為展品。我要特別感謝來自廣西壯族自治區自然博物館、浙江自然博物院，以及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴藏品。我亦要感謝特區政府的漁農自然護理署，協助採集化石的工作，亦感謝發展局轄下古蹟辦（古物古蹟辦事處）的團隊及古脊椎所團隊一起充滿熱情地參與鑑定和保護化石。經策展團隊悉心策劃，我們促成了這次「見龍在田」展覽，而其突出之處，就是大家不單看到赤洲的恐龍化石，亦可以看到來自內地不同地方的恐龍化石。我們試想像，一億多年前不同的恐龍在今次的展覽中，大家在這裏對話，一起跟我們說恐龍的故事。\n\n　　我誠邀市民和遊客把握這個難得機會，一同探索香港首次出土的恐龍化石，感受遠古自然歷史的奧妙，開啓一場嶄新的古生物探索之旅。\n\n　　祝願這個展覽圓滿成功，祝願大家有一個豐富的體驗。謝謝各位！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c800a7fae07","title":"​進口蟹樣本鎘含量超出法例標準","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900542.htm","summary":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。","summary_short":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。","digest":"食物環境衞生署食物安全中心公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準","points":["食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布…","中心發言人說：「中心透過恆常食物監測計劃，從進口層面檢取上述蟹樣本作檢測…","發言人續說：「長期攝入過量的鎘可影響腎功能"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:45:00+08:00","size":1,"keywords":[],"body":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。中心正跟進事件。 \n\n　　中心發言人說：「中心透過恆常食物監測計劃，從進口層面檢取上述蟹樣本作檢測，結果顯示鎘含量為百萬分之五點六，超出法例上限的百萬分之二。受影響批次產品沒有流出市面。」 \n\n　　發言人續說：「長期攝入過量的鎘可影響腎功能。中心已知會涉事進口商上述違規情況。如有足夠證據，中心會提出檢控。」 \n\n　　根據《食物攙雜（金屬雜質含量）規例》（第132V章），任何人如售賣金屬雜質濃度高於法定上限水平的食物，即屬違法。違例者一經定罪，最高可處罰款五萬元及監禁六個月。 \n\n　　中心會知會菲律賓當局及業界，並會繼續跟進事件和採取適當行動。調查仍然繼續。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2f6e74765e","title":"國際青年人才交流基地正式成立","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900265.htm","summary":"民政及青年事務局（民青局）今日（十一月十九日）在民青局賽馬會青立方舉辦國際青年人才交流基地（基地）開幕活動，標誌基地正式成立，進一步推動青年發展及國際交流。","summary_short":"民政及青年事務局（民青局）今日（十一月十九日）在民青局賽馬會青立方舉辦國際青年人才交流基地（基地）開幕活動…","digest":"民政及青年事務局在民青局賽馬會青立方舉辦國際青年人才交流基地開幕活動…","points":["民政及青年事務局（民青局）今日（十一月十九日）在民青局賽馬會青立方舉辦國際青年人才交流基地（…","今日的開幕活動以「青年聯通世界：與世界知識產權組織領袖共探全球機遇」為主題…","民青局局長麥美娟在開幕活動致辭時表示，特區政府在《香港特別行政區經濟和社會發展第一個五年規劃…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:42:00+08:00","size":1,"keywords":[],"body":"民政及青年事務局（民青局）今日（十一月十九日）在民青局賽馬會青立方舉辦國際青年人才交流基地（基地）開幕活動，標誌基地正式成立，進一步推動青年發展及國際交流。 \n\n　　行政長官在二○二六年《施政報告》中宣布成立基地，推廣國際交流，並邀請國際專家和訪港貴賓與曾參與國際交流和實習的青年進行交流。今日的開幕活動以「青年聯通世界：與世界知識產權組織領袖共探全球機遇」為主題，並邀請了由世界知識產權組織副總幹事申長雨博士率領的代表團與本港青年，包括曾參與民青局青年創業計劃、實習計劃及國際交流計劃等的「連青人網絡」成員進行交流，讓本港青年了解全球知識產權經濟的最新發展及為青年人帶來的機遇。\n\n　　民青局局長麥美娟在開幕活動致辭時表示，特區政府在《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》下，致力開拓青年發展空間，支持青年逐夢前行。為落實此願景，《行政長官2026年施政報告》提出新措施，由民青局於今年成立基地，進一步推動青年發展。民青局將透過基地為青年開拓更多走向國際的機會，並在基地舉辦更多元、讓青年人擴闊國際視野的活動，同時邀請「連青人網絡」成員積極參加，匯聚全球青年人才，推廣國際交流。\n\n　　在世界知識產權組織代表團進行分享前，麥美娟與其他主禮嘉賓主持基地揭牌儀式，包括申長雨博士、民青局常任秘書長李百全、中央人民政府駐香港特別行政區聯絡辦公室教育和青年部副部長萬寧、中華人民共和國外交部駐香港特別行政區特派員公署國際部主任王劍、民青局副局長梁宏正、青年專員林兆康，以及基地的管理和營運機構代表。\n\n　　基地涵蓋三個青年設施，包括柴灣青年廣場「民青局賽馬會青立方」、深水埗南昌社區中心「連青．南昌」及啟德青年驛站「啟航1331」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbec332afb4","title":"​香港海關在彩盈邨進行跨部門反私煙宣傳活動","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900374.htm","summary":"香港海關今日（十一月十九日）與觀塘區區議員、衞生署控煙酒辦公室、房屋署及警務處在彩盈邨進行聯合反私煙宣傳活動，並講解完稅標籤制度。","summary_short":"香港海關今日（十一月十九日）與觀塘區區議員、衞生署控煙酒辦公室、房屋署及警務處在彩盈邨進行聯合反私煙宣傳活動…","digest":"香港海關與觀塘區區議員、衞生署控煙酒辦公室…","points":["香港海關今日（十一月十九日）與觀塘區區議員、衞生署控煙酒辦公室…","海關人員於屋邨範圍內巡查，向居民介紹海關打擊私煙的工作…","海關人員亦向屋邨保安員講解發現懷疑私煙活動時的應對方法"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:12:00+08:00","size":1,"keywords":[],"body":"香港海關今日（十一月十九日）與觀塘區區議員、衞生署控煙酒辦公室、房屋署及警務處在彩盈邨進行聯合反私煙宣傳活動，並講解完稅標籤制度。 \n\n　　海關人員於屋邨範圍內巡查，向居民介紹海關打擊私煙的工作，並提醒居民未完稅煙草相關罪行的最高罰則已提高至罰款二百萬元及監禁七年。海關人員亦向屋邨保安員講解發現懷疑私煙活動時的應對方法。\n\n　　海關人員亦向區議員及居民介紹香港將施行的完稅標籤制度。海關已於本年初完成為期三個月的完稅標籤制度先導計劃，並會繼續與各持份者保持緊密溝通，持續優化制度設計及執行細節。海關期望完稅標籤制度有效區分已完稅和未完稅香煙，打擊「白牌煙」。 \n\n　　海關會繼續加強宣傳教育，提高市民的反私煙意識。如發現有公屋單位涉及私煙罪行，海關會在法庭審結案件後通知房屋署跟進。海關呼籲市民，切勿以身試法買賣私煙或派發私煙傳單，以免留下案底影響前途。\n\n　　根據《應課稅品條例》（第109章），任何人若處理、管有、售賣或購買私煙即屬違法，一經定罪，最高可被判罰款二百萬元及監禁七年。市民可致電海關二十四小時熱線182 8080、透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑私煙活動。\n\n　　根據《吸煙（公眾衞生）條例》（第371章），任何人不得分發任何形式的吸煙產品廣告（包括任何傳單），違例者最高可被罰款港幣五萬元。市民可致電衞生署控煙酒辦公室熱線2961 8823舉報懷疑派發私煙傳單活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca3803843f5","title":"一名入境旅客進口未完稅香煙罪成判囚","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900526.htm","summary":"一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》，今日（十一月十九日）在西九龍裁判法院被判處監禁七個月，以及罰款二千元。","summary_short":"一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》…","digest":"一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》…","points":["一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》…","海關人員昨日（十一月十八日）在香港國際機場截查一名五十五歲從日本東京飛抵本港的內地男旅客…","海關對判刑表示歡迎，監禁判刑具相當阻嚇作用，並充分反映罪行的嚴重性"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:05:00+08:00","size":1,"keywords":[],"body":"一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》，今日（十一月十九日）在西九龍裁判法院被判處監禁七個月，以及罰款二千元。\n\n　　海關人員昨日（十一月十八日）在香港國際機場截查一名五十五歲從日本東京飛抵本港的內地男旅客，並在他攜帶的個人行李內檢獲約四萬一千八百支未完稅香煙，估計市值約二十萬九千元，應課稅值約十三萬八千一百元。該名旅客隨即被捕。\n\n　　海關對判刑表示歡迎，監禁判刑具相當阻嚇作用，並充分反映罪行的嚴重性。\n\n　　海關提醒市民，根據《應課稅品條例》，香煙屬應課稅品。任何人士若處理、管有、售賣或購買私煙，即屬違法，一經定罪，最高可被判罰款二百萬元及監禁七年。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑私煙活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3890789174","title":"香港銀行同業結算有限公司提醒公眾慎防偽冒網站","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900507.htm","summary":"下稿代香港金融管理局發出︰  　　香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fpstk.xyz。","summary_short":"下稿代香港金融管理局發出︰  　　香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站f…","digest":"香港銀行同業結算有限公司提醒公眾慎防偽冒網站","points":["下稿代香港金融管理局發出︰","香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fpst…","該偽冒網站偽裝成「買家網上安全保障」，提供轉數快FPS網上交易安全服務，包括1）退款…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:55:00+08:00","size":1,"keywords":[],"body":"下稿代香港金融管理局發出︰\n\n　　香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fpstk.xyz。該偽冒網站偽裝成「買家網上安全保障」，提供轉數快FPS網上交易安全服務，包括1）退款、2）舉報未經授權的網上交易，以及3）網上交易支援，及進一步引導用戶與偽冒客服的人員進行對話。\n\n　　結算公司澄清，該偽冒網站與結算公司以及結算公司所有業務，均絕無關係。在一般情況下，結算公司不會直接向個別公眾人士提供轉數快服務，也不會主動接觸個別公眾人士。結算公司真正官方網址是www.hkicl.com.hk及fps.hkicl.com.hk。\n\n　　結算公司呼籲公眾人士提防可疑電話、網站或其他通訊，小心保護個人資料。如接獲任何宣稱來自結算公司成員的可疑通訊，請致電結算公司電話2533 1111核實。如市民懷疑受騙，應盡快向警方報案。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1f5861b13a","title":"衞生署轄下醫療器械諮詢委員會舉行首次會議","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900211.htm","summary":"​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議，就政府正積極籌備建立的醫療器械法定規管體系提供意見，以期從安全、質量及性能方面完善規管在香港供應的醫療器械…","summary_short":"​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議…","digest":"衞生署轄下的醫療器械諮詢委員會舉行首次會議…","points":["​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議…","委員會由趙偉仁教授出任主席，成員包括醫學界、工程界和創新科技界代表","成員名單載於衞生署醫療器械科網頁"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議，就政府正積極籌備建立的醫療器械法定規管體系提供意見，以期從安全、質量及性能方面完善規管在香港供應的醫療器械，從而保障公眾健康，促進醫療器械業界有序及持續發展，助力香港成為國際醫療創新樞紐。\n\n　　委員會由趙偉仁教授出任主席，成員包括醫學界、工程界和創新科技界代表。成員名單載於衞生署醫療器械科網頁。\n\n　　《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》及《行政長官2026年施政報告》均指出，政府會全面深化藥械監管改革，完善監管體系，並成立藥物及醫療器械監督管理中心。政府正有序推進多項工作，包括推動立法改革，建立新的醫療器械法定規管體系，涵蓋醫療器械推出市場前後各個風險管理環節。衞生署期望透過委員會廣泛而全面地吸納不同持份者的真知灼見，以建立一套清晰可行、具前瞻性，同時切合香港情況，並與國際接軌的醫療器械法定規管框架，為香港發展成為國際醫療創新樞紐提供更有力的制度支撐。\n\n　　會上，衞生署代表介紹現行自願參與的「醫療器械行政管理制度」在過去20多年來的運作成果，以及政府有關規管本港醫療器械的立法建議。委員會全力支持政府秉持以下重要原則，推展相關立法工作：\n\n（一）保障公眾安全和健康；\n\n（二）促進創新發展；\n\n（三）與國際監管標準接軌；\n\n（四）承接本港行政制度經驗；\n\n（五）聚焦源頭管理，要求供應鏈上游的貿易商申領牌照；及\n\n（六）按風險為本原則，有序推行醫療器械分級註冊。\n\n 除了在建立醫療器械法定規管體系期間，為衞生署蒐集及反映持份者意見外，委員會亦會就「醫療器械行政管理制度」的運作及過渡安排向署方提供意見。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc4b8908640","title":"哈薩克斯坦品牌ADILI在港開設首間海外門店 彰顯香港與中亞日益緊密的聯繫","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111800439.htm","summary":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店，成為首批進駐香港的中亞零售品牌之一。","summary_short":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店…","digest":"投資推廣署歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店…","points":["​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦…","ADILI以其受哈薩克傳統裝飾啓發而創作的原創印花圖案而聞名…","ADILI落戶香港，反映香港積極深化與中亞的經貿及文化聯繫，並加強「一帶一路」連結"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店，成為首批進駐香港的中亞零售品牌之一。ADILI以其受哈薩克傳統裝飾啓發而創作的原創印花圖案而聞名，該品牌特別為新店推出以香港為靈感的膠囊系列，與其廣受好評的經典系列一同發售。 \n\n　　ADILI落戶香港，反映香港積極深化與中亞的經貿及文化聯繫，並加強「一帶一路」連結。投資推廣署於二○二五年及二○二六年出訪中亞，包括哈薩克斯坦，與當地企業交流，介紹香港蘊藏的機遇，並探討嶄新合作領域。開店前夕，投資推廣署於十一月十七日舉行交流會，連繫在港哈薩克斯坦商界並促進兩地文化交流。\n\n　　投資推廣署署長劉凱旋表示：「ADILI的當代哈薩克設計為香港國際化的零售市場增添一道絢麗色彩。品牌落戶反映香港與中亞的文化聯繫日益深厚，這亦是推動更廣泛經貿合作的重要動力。投資推廣署會善用環球網絡和行業專業知識，致力吸引更多像ADILI一般，來自中亞以至其他地區的出眾品牌，以香港為基地拓展全球業務。」\n\n　　ADILI聯合創辦人Indira Adil表示：「香港是亞洲時裝、生活品味及國際零售市場的交匯點。在港開店是我們邁向國際舞台的重要第一步。我們非常感謝投資推廣署的支援，包括提供市場資訊、實戰指導及聯繫本地人脈，使我們得以成功進駐香港市場。」\n\n　　ADILI聯合創辦人兼創意總監Assel Adil表示：「我們以香港為靈感的膠囊系列，開展了當代哈薩克設計與這個充滿活力的城市之間的對話，將原創印花背後的傳統裝飾藝術，與香港的色彩和特質融為一體。我們期待與香港大眾及來自世界各地的旅客分享這個系列。」\n\n　　Indira Adil和Assel Adil兩姊妹於二○一○年創立ADILI，在哈薩克斯坦的設計工作室創作其原創印花圖案，產品涵蓋時裝、配飾、家居紡織品及禮品。ADILI在哈薩克斯坦各地設有零售店，香港店是品牌進軍國際市場的第一步。\n\n　　如欲了解更多關於ADILI的資訊，請瀏覽shopadili.com。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":13,"items":[{"id":"c452158b1f8","title":"Grand Theft Auto VI released around world after 13-year wait","url":"https://news.tvb.com/tc/1207334-GrandTheftAutoVIreleasedaroundworldafter13yearwait","summary":"After over a decade in the making and an estimated 1 billion US dollars or more in production costs…","summary_short":"After over a decade in the making and an estimated 1 billion…","digest":"After over a decade in the making and an e…","points":["The crime-themed franchise known for allowing…","An auto-dealer in Arlington is closing his bus…","(Reporter: How long was the wait, 13 years…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:30+08:00","size":1,"keywords":[],"body":"After over a decade in the making and an estimated 1 billion US dollars or more in production costs, the \"Grand Theft Auto\" video game has officially launched a new entry in the series and begun its global rollout.\nThe crime-themed franchise known for allowing players to steal cars, engage in shootouts and roam freely through fictional US cities has sold more than 470 million units worldwide.\n\"Grand Theft Auto V\" generated 1 billion dollars in retail sales in only three days after its release in 2013.\nEarlier this month, GTA's co-creator Dave Jones noted players' preference for playing as criminals helped shape the direction of the original game.\nThe new edition, billed as one of the most eagerly awaited entertainment launches in years, unlocks for PlayStation 5 and Microsoft's Xbox Series X and S consoles when the clock struck midnight on Thursday .\nThe rollout with updated graphics has gained rapturous early reviews.\nExcitement spread across the electronics district in Tokyo. Posters have gone up on buildings around the town.\nFrom gaming cafes in India to the inspiration behind the game's \"Vice City\", Miami, one of the last places to get in on the action, fans take time off and even shut down businesses for Rockstar Games' latest installment.\nA crossover promo is turning the NBA's Miami Heat arena into \"Vice City\" as the team hosts the Milwaukee Bucks on a one-time-only court adorned with neon pink and blue.\nIn Dallas, Texas, a GTA player marks the release with a brass knuckle tattoo.\nAlexis Hurtado says, \"I have got a brass knuckle tattoo. I don't think you can see it fully, but its right there.\"\n(Reporter: It's related to what?) Hurtado says, \"The GTA game that's coming out...I played like the San Andreas as a kid. And it's like, it's always stuck with me cause like I got real close with like my older cousin because of it.\"\nAn auto-dealer in Arlington is closing his business on November 19.\nBryan Banuelos says, \"It's a cool game. I'm not the best player out there, but man, it's so fun to play. There's just tons of things to do, so definitely a cool thing to check out.\"\n(Reporter: How long was the wait, 13 years, is that right?) Banuelos says: \"About 13 years, yeah.\"\nHe says he hopes it's worth the wait and looks forward to exploring changes to the familiar streets and surroundings in the open world game.","image":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/snapshots/6e779408ab6546ecb42f4747fe7f32ae-00008.jpg","video":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/3a1b7976b8df408db94b89d210d4bd76-81a0e07ee93ca46b58abab60c6a52bad-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/snapshots/6e779408ab6546ecb42f4747fe7f32ae-00008.jpg","lang":"en"},{"id":"c9f8fb6d5c3","title":"TVB celebrates its 59th anniversary","url":"https://news.tvb.com/tc/1207341-TVBcelebratesits59thanniversary","summary":"TVB celebrates its 59th anniversary.TVB's executive chairman Thomas Hui and General Manager Siu Sai-…","summary_short":"TVB celebrates its 59th anniversary.TVB's executive chairman…","digest":"TVB celebrates its 59th anniversary.TVB's…","points":["TVB's executive chairman Thomas Hui and Genera…","The celebration featured a series of singing a…","A short AI-produced video was also screened…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:26+08:00","size":1,"keywords":[],"body":"TVB celebrates its 59th anniversary.\n\nTVB's executive chairman Thomas Hui and General Manager Siu Sai-wo kicked off the anniversary gala.\n\nThe celebration featured a series of singing and dancing performances from TVB artists.\n\nA short AI-produced video was also screened, shouting out to staff behind cameras.\n\nFounded on November 19, 1967, Television Broadcasts Limited (TVB) is Hong Kong's first commercial wireless television station.","image":"https://pro-vod-cdn.tvb.com/f7decc5f0cc143e98951f90e12f42839/snapshots/739b7bf5e9f3472a9e4ba34dd4e158ae-00004.jpg","video":"https://pro-vod-cdn.tvb.com/f7decc5f0cc143e98951f90e12f42839/a350b752752245fba4cb88787ea3a475-ed8ed0b5fe26b0941ec2106dd4c88e5d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/f7decc5f0cc143e98951f90e12f42839/snapshots/739b7bf5e9f3472a9e4ba34dd4e158ae-00004.jpg","lang":"en"},{"id":"ccebb1ee6a7","title":"UN World Court rules Myanmar at fault for Rohingya genocide","url":"https://news.tvb.com/tc/1207332-UNWorldCourtrulesMyanmaratfaultforRohingyagenocide","summary":"The United Nations' top court hands down a ruling that Myanmar committed genocide against the Rohing…","summary_short":"The United Nations' top court hands down a ruling that Myanm…","digest":"The United Nations' top court hands down a…","points":["The United Nations' top court hands down a rul…","Myanmar committed genocide against the Rohingy…","minority in a brutal 2017 military operation a…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:47:00+08:00","size":1,"keywords":["Myanmar","United Nations"],"body":"The United Nations' top court hands down a ruling that \nMyanmar committed genocide against the Rohingya\nminority in a brutal 2017 military operation and ordered the \nSoutheast Asian nation to allow people who fled the violence to return home.\nThe landmark decision marks the first time the court has \nruled a state committed genocide.\nIn a 9-6 decision, the World Court found Myanmar was in violation of its obligations \nunder the Genocide Convention.\nThe 15-judge panel rejected reviewed evidence that showed \nMyanmar forces killed about 10,000 Rohingya, hence rejecting the nation's defence \nthat the 2017 campaign was a legitimate operation against insurgents.\nThe court ordered Myanmar to commit to reparations including allowing \nRohingya \"safe, voluntary and dignified return to their place of residence.\" \nIt ordered Myanmar to investigate, prosecute and punish people found to \nhave committed genocidal acts and to pay compensation to Rohingya. \nThe amount will be decided in later court proceedings.","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026b1TCc0vdTJ1795099655.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/6218b3a5a3a44a00a7d4a525a4a36240/dd1208cefe044ec6b0c75d2c08c89cfb-b68399c8e5000f255260051c6990d843-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026b1TCc0vdTJ1795099655.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"cf3d1f197da","title":"共识重在落实 繁荣贵在实干","url":"https://www.chinanews.com.cn/ll/2026/11-19/10734896.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","各成员经济体汇聚一堂，共商发展大计，期待通过此次会议增进互信、凝聚共识，明确亚太前进方向…","这里产业体系多元，市场潜力巨大，科技创新活跃，孕育着广阔的发展机遇"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:46:29+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。各成员经济体汇聚一堂，共商发展大计，期待通过此次会议增进互信、凝聚共识，明确亚太前进方向，增强亚太发展动力，为世界经济注入更多确定性。\r\n\n　　亚太是全球发展的重要动力源和创新源。这里产业体系多元，市场潜力巨大，科技创新活跃，孕育着广阔的发展机遇。同时，贸易政策不确定性增加，地缘政治风险上升，也给区域发展带来新的挑战。APEC各成员经济体供应链深度交织，市场相互依存，一家的发展挑战可能传导为区域共同风险，一次成功合作也会转化为各方共享的红利。如何释放潜力、抵御风险，如何增强动能、共享成果，是APEC各成员经济体共同面对的时代课题。\n\n　　回答这些课题，需要从亚太发展的实践中寻找答案。开放合作，正是亚太繁荣的根基。各经济体发展水平不同、资源禀赋各异，在分工协作中优势互补，在互通有无中共同成长。开放打通市场，合作串联产业，让更多经济体参与区域发展、分享增长红利。亚太过去的发展得益于此，未来的繁荣同样依赖于此。越是外部环境复杂，越要坚守开放方向，巩固合作基础。\n\n　　2026年APEC“中国年”以“建设亚太共同体，促进共同繁荣”为主题，将“开放、创新、合作”作为三大优先领域，回应亚太发展之需，顺应国际社会共同期待，为亚太乃至世界应对挑战、开拓未来指明了方向。\n\n　　开放是亚太发展的重要前提。破除贸易投资壁垒，维护产业链供应链稳定畅通，才能让各经济体优势得到充分发挥。创新是持续增长的重要动力。加强技术交流，推动数字经济、绿色转型等新兴领域合作，才能不断培育新的增长动能。合作是实现共同繁荣的重要保障。深化政策沟通，照顾彼此关切，加强互通有无，才能帮助更多经济体把握机遇、应对风险，不让任何一方掉队。\n\n　　中国一直坚持与亚太及世界共享发展机遇，以高水平开放拓展亚太发展空间，以科技创新培育区域增长动能，以务实合作促进各方优势互补。接任APEC东道主以来，中国以东道主担当凝聚各方力量，以务实行动推动共同发展。中方同各成员一道，举办300多场会议和活动，达成一系列合作共识。从贸易投资自由化便利化到人工智能，从能源低碳转型到中小企业数字化发展，从防灾减灾到粮食安全，各领域交流紧扣时代发展需求，推动各方寻找利益交汇点、拓展合作空间。\n\n　　APEC的核心价值，在于从多元差异中寻找最大公约数，推动各方凝聚普遍共识、锚定共同利益。共识重在落实，繁荣贵在实干。期待APEC各成员把共识化为举措，把承诺化为行动，携手共创亚太光明未来。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c48811293db","title":"企业出海“第一站”如何行稳致远 中国和东盟法学法律界重庆共寻答案","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-19/10734890.shtml","summary":"中新网重庆11月19日电 (记者 刘相琳)企业“走出去”风险问题及法律应对论坛19日在重庆举行。","summary_short":"中新网重庆11月19日电 (记者 刘相琳)企业“走出去”风险问题及法律应对论坛19日在重庆举行。","digest":"企业“走出去”风险问题及法律应对论坛19日在重庆举行","points":["中新网重庆11月19日电 (记者 刘相琳)企业“走出去”风险问题及法律应对论坛19日在重庆举…","来自中国和东盟国家的法学法律界代表、律师组织负责人及多家企业代表齐聚一堂…","由中国法学会主办的第八届中国—东盟法治论坛此间在重庆举行…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:42:45+08:00","size":1,"keywords":[],"body":"中新网重庆11月19日电 (记者 刘相琳)企业“走出去”风险问题及法律应对论坛19日在重庆举行。来自中国和东盟国家的法学法律界代表、律师组织负责人及多家企业代表齐聚一堂，围绕“法治护航通道·合规赋能出海”主题，共商企业跨境经营风险防范与法律应对之道。\r\n\n　　由中国法学会主办的第八届中国—东盟法治论坛此间在重庆举行，企业“走出去”风险问题及法律应对论坛是分论坛之一。中国法学会党组书记、常务副会长王洪祥在分论坛致辞时表示，中国已连续17年稳居东盟第一大贸易伙伴，东盟连续6年成为中国第一大贸易伙伴。与此同时，中国已成为东盟的第二大外国投资来源地，而东盟成为中国企业海外投资最为集中的区域，也是许多中资企业出海选择的第一站。经贸合作的广度、深度持续拓展的同时，跨境经营的法律环境、规则体系、风险场景也更加复杂多元，跨境合规、投资保护、商事争议、知识产权、劳工环保等各类法律风险，成为制约企业稳健出海的关键因素。\n\n　　“合规不是出海的‘成本线’，而是‘生存线’。”王洪祥围绕深化中国—东盟法治合作、服务企业跨境发展，提出三点倡议：共筑规则基石，优化营商环境，以法治的确定性应对市场的不确定性；共守合规底线，赋能企业出海，推动企业树立全员、全程、全域合规理念；共建法律服务，护航跨境合作，建立面向东盟的国别法律查明机制和跨境商事争议多元解决机制。\n\n　　柬埔寨律师协会主席赛恩万纳介绍，该国2021年颁布的新投资法及配套实施性副法令推动投资程序更加透明可预测，他建议中国企业在进入柬埔寨之前，选择合适的法律结构，将合规性视为日常管理工作中的一项职责，同时对业务合作伙伴及交易开展有意义的尽职调查，要投资于人才建设及负责任的商业行为，并为跨境贸易可能面临的法律风险做好准备。\n\n　　老挝国家律师协会主席维恩萨万·潘塔利结合其处理的大量跨境投资合规案件与咨询实务，分析了中国企业赴老挝投资最常见的四大税务合规风险，建议中国企业赴老挝经营及投资要前置合规布局，精准适配本地化税收政策；建立常态化税务内控管理体系；依托专业法治力量，化解跨境合规壁垒。\n\n　　从一线实践出发，中国企业法务负责人分享了各自的合规经验和建议。腾讯集团副总裁徐炎建议，提升境内司法判赔力度，为企业出海提供坚实“大后方”。安踏集团法务副总裁樊俊伟提出，合规正从单项风险审核走向覆盖经营全过程的全链条治理。\n\n　　与会人士认为，企业“走出去”机遇与风险相伴，唯有把合规防线前移，才能实现“走得稳、走得远、走得好”，以高水平法治保障助力中国—东盟经贸合作行稳致远。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc0aa32f442","title":"“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办","url":"https://www.chinanews.com.cn/txy/2026/11-19/10734775.shtml","summary":"11月14日至15日，“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办。","summary_short":"11月14日至15日，“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办。","digest":"11月14日至15日，“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办","points":["河南省委统战部、省文化和旅游厅相关领导及处室负责同志，安阳市委统战部相关负责同志…","15日上午，“新艺河南·古都雅韵”非遗进景区活动启动仪式在中国文字博物馆启幕","非遗市集盛装亮相、异彩纷呈，来自全省40余项国家级、省级非遗项目集中登场，匠心技艺荟萃一堂"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:37:17+08:00","size":1,"keywords":[],"body":"11月14日至15日，“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办。河南省委统战部、省文化和旅游厅相关领导及处室负责同志，安阳市委统战部相关负责同志，省新联会“寻美河南”“新艺河南”组委会成员和网络大V、非遗传承人及媒体记者等80余人参加活动。\n\n　　15日上午，“新艺河南·古都雅韵”非遗进景区活动启动仪式在中国文字博物馆启幕。非遗市集盛装亮相、异彩纷呈，来自全省40余项国家级、省级非遗项目集中登场，匠心技艺荟萃一堂。大家驻足市集参观体验，感悟根植中原文明的匠心传承，了解非遗技艺融入景区实景场景、依托数字渠道拓宽传播声量的实践路径。\n\n　　活动期间，大家先后赴殷墟考古文旅小镇、仓巷街历史文化街区、中国文字博物馆非遗市集及展厅、殷墟宗庙宫殿遗址、殷墟博物馆，聚焦非遗保护传承、活化利用与数字化传播，考察非遗与景区融合发展成效，了解工业遗存活化、历史文脉保护、线上线下联动文旅场景打造等创新做法。\n\n　　本次活动打造“网络+非遗+景区”创新模式，网络人士同步记录创作，截至目前，全网话题总阅读量达8372.8万，#新艺河南古都雅韵 安阳启动# #当古都安阳遇上多彩非遗# #新艺河南擦亮安阳文旅名片# 三大话题连续两天登顶同城热搜前三，活动产出原创短视频280余条，掀起品读殷商文脉、感受非遗焕新的传播热潮，助力打造黄河古都群世界级旅游目的地，为河南建设文旅强省贡献力量。\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb53ac71d49","title":"甘南学子津门研学：在历史与未来间感受“同心”","url":"https://www.chinanews.com.cn/txy/2026/11-19/10734852.shtml","summary":"中新网天津11月19日电 (记者 周亚强)第四期“同心·筑梦中国行”青少年研学团19日走进天津。","summary_short":"中新网天津11月19日电 (记者 周亚强)第四期“同心·筑梦中国行”青少年研学团19日走进天津。","digest":"第四期“同心·筑梦中国行”青少年研学团19日走进天津","points":["中新网天津11月19日电 (记者 周亚强)第四期“同心·筑梦中国行”青少年研学团19日走进天…","来自甘肃甘南藏族自治州的49名小学生，围绕红色教育、科创体验、校园交流…","在周恩来邓颖超纪念馆，孩子们放慢脚步，围在展柜前看照片、听讲解"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:36:18+08:00","size":1,"keywords":[],"body":"中新网天津11月19日电 (记者 周亚强)第四期“同心·筑梦中国行”青少年研学团19日走进天津。来自甘肃甘南藏族自治州的49名小学生，围绕红色教育、科创体验、校园交流、民族团结联谊等开展研学，在历史与未来之间感受“同心”。\n\n　　在周恩来邓颖超纪念馆，孩子们放慢脚步，围在展柜前看照片、听讲解。甘南州五年级学生旦增更君说：“以前只在课本上读到周总理的故事，今天看到他用过的东西，觉得他离我们很近。”碌曲县双岔镇中心小学教师仁青草说，走进纪念馆，孩子们对“为中华之崛起而读书”有了更具体的感受。\n\n11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津。图为甘南州学生在天开高教科创园与智能机器人互动。　记者 冯宏杰 摄\n\n　　在天开高教科创园，机械臂抓取物品、智能设备开口对话，孩子们围上前，追着讲解员问原理。具身智能应用展示体验中心里，有学生和围棋机器人对弈，输了，又坐下来重开一局。卓尼县柳林小学教师李靖说，研学让孩子们看到了山外的世界，也看到了科学的样子。\n\n　　随后，研学团走进南开大学，参观校史馆，并在周总理雕像前合影。有学生站在雕像前小声说：“我以后也想考到这里来。”南开大学相关负责人表示，希望校园参访能让甘南学子感受大学氛围，激发对知识的向往。\n\n11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津。图为津甘两地学生在红光中学准备表演锅庄舞。　记者 冯宏杰 摄\n\n　　在天津市红光中学，津甘两地学生围成圈跳起锅庄舞。欢快的节奏中，原本有些拘谨的孩子们很快熟络起来。红光中学学生其美央宗说：“虽然我们来自不同地方，但跳起锅庄舞就像一家人。”合作市教育局督学马文忠表示，联谊活动让民族团结和交往交流交融自然发生在孩子们的笑声中。\n\n　　研学团带队负责人介绍，此次活动注重把爱国主义教育、科技创新体验和民族团结交流结合起来，让甘南孩子在行走中开阔眼界、增进认同。\n\n　　当天，研学团还走进银博缘四大发明文化创意体验城，感受中华优秀传统文化的魅力；后续还将参观大沽口炮台遗址博物馆、国家海洋博物馆和天津泰达航母主题公园，继续天津段研学。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cefaa878d80","title":"一把芦笙吹出爱情 探访贵州苗族传承千年的“相亲大会”","url":"https://www.chinanews.com/cul/shipin/cns/2026/11-19/news1075494.shtml","summary":"11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚，展开一场传承千年的苗族婚恋习俗——讨花带。","summary_short":"11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚…","digest":"11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚…","points":["11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚…","活动现场，女孩们头戴银冠、颈挂银项圈，身着盛装随芦笙曲翩翩起舞，展现自己最美的一面","(袁超 张琦 贵州黔东南报道 部分素材来源 雷山融媒）"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:15:31+08:00","size":1,"keywords":[],"body":"11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚，展开一场传承千年的苗族婚恋习俗——讨花带。活动现场，女孩们头戴银冠、颈挂银项圈，身着盛装随芦笙曲翩翩起舞，展现自己最美的一面。芦笙场上，女孩们佩戴不同颜色的花朵，用于区别不同的村寨，而穿着苗族便装的小伙们手持芦笙，目光紧紧锁定心仪的女孩，在朋友或者家里长辈的陪同下，吹奏婉转悠扬的曲调，一步步向女孩靠近。在讨花带的过程中，若女方也对男方有好感，则把花带或者佩戴的银饰挂在男方芦笙和脖子上，以示定情信物。(袁超 张琦 贵州黔东南报道 部分素材来源 雷山融媒）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/EC46BC2133A0485D8E5B4A64802BF893.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c6f137d756b","title":"华西这位医生因“有温度的医嘱”走红：拍科普视频是为了“偷懒”","url":"https://www.chinanews.com/shipin/cns/2026/11-19/news1075487.shtml","summary":"近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注。","summary_short":"近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注。","digest":"近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注","points":["近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注","视频中，他没有围绕病情交流，而是像一位父辈，劝导住院少年不要沉迷手机，要重视学业","马俊账号里这类一线查房、面诊实拍视频已多次出圈，其中劝老年人多吃肉蛋…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T19:07:20+08:00","size":1,"keywords":[],"body":"近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注。视频中，他没有围绕病情交流，而是像一位父辈，劝导住院少年不要沉迷手机，要重视学业。马俊账号里这类一线查房、面诊实拍视频已多次出圈，其中劝老年人多吃肉蛋、少喝汤的短视频广为传播，通俗的讲解打动不少网友。社交平台上，马俊已发布2000余个医学科普视频，积累超200万粉丝。谈及做网络科普的初衷，马俊坦言出发点十分简单，就是为了“偷懒，提升临床工作效率”。(陈选斌 四川成都报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/EF70180337404F8D9E0266E0E085B394.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cd7d41cb53b","title":"晨光追擊│「肯佩斯」愈贏愈醒","url":"https://www.stheadline.com/trackwork/3638983/晨光追擊肯佩斯愈贏愈醒","summary":"一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下。","summary_short":"一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下。","digest":"一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下","points":["一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下","「極上紗瓏」戴頭罩由潘明輝跳兩段，大步疾走神態軒昂，力度比前更好，狀態回到上季最弗時","「安都」助手跳兩段，墜手起勁火氣不斷冒升，外觀悅目毛色立立靚，狀態回勇"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T19:06:32+08:00","size":1,"keywords":[],"body":"一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下。\n「極上紗瓏」戴頭罩由潘明輝跳兩段，大步疾走神態軒昂，力度比前更好，狀態回到上季最弗時。「安都」助手跳兩段，墜手起勁火氣不斷冒升，外觀悅目毛色立立靚，狀態回勇。\n  「天天同樂」戴頭罩由巴度跳兩段，長韁操控特別試得好，岳頭馬不搶口，人馬夾檔狀態呈勇。「紫荊傳令」戴眼罩由助手按住順跳兩段，暗火湧現，馬身喼得靚佳態保持。「嘉應奇兵」潘明輝跳兩段，表現主動，火氣好到不得了，目光銳利神生步爽，保持勇態。\n  「錶之光速」助手跳兩段，動作無咁生硬，出腳變得流暢，質新馬有點進展。「金創福威」戴眼罩及頭罩由助手跳一段，轉腳後規矩好多，大馬亦不論盡，神態回旺大有起色。「絲王之王」助手跳兩段，毛色悅目金光閃閃，愈走愈起勁上火上力，狀態初勇。\n「飛來霸」戴頭罩由助手跳兩段，超短韁捉實充滿火氣，步伐無亂力度又好，狀態不俗。\n\n「跨境寶馬」戴眼罩由助手拍「八玲瓏」跳兩段，表現活躍，步輕力度充沛，毛色烏卒卒，狀態已起。「肯佩斯」戴頭罩由助手跳兩段，神態生猛大半程搶走，火力更強，愈贏愈醒神。「合夥奔馳」戴頭罩由助手跳兩段，年紀大了不再急口，馬身壯落腳爽，狀態及格。  \n  「飛來霸」戴頭罩由助手跳兩段，超短韁捉實充滿火氣，步伐無亂力度又好，狀態不俗。「君子傳承」戴眼罩由助手跳兩段，從容走過步挺開揚，馬身實淨觀感甚佳。「佰勝金龍」戴頭罩由助手跳兩段，馬身喼得靚展現線條美，神態活躍，狀態未見走樣。\n  「手機錶霸」戴頭罩由潘明輝跳兩段，一貫急勁和賣力，馬身脹卜卜，長在勇境。「友瑩亮」戴頭罩由助手跳兩段，步輕彈力十足，馬身保持飽滿，持續態勇。「觀眾之力」戴頭罩由助手草地跳兩段，扣住走火氣依然旺盛，身壯唔瘦勇態保持。佳態保持有餘。「嵐臣」潘頓草地跳兩段，健步如飛走勢爽勁，馬身壯肌肉起腱，愈贏愈銳利。\n兆文","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ceecb6dde36","title":"中国广西新发现直立人化石 助解古人类演化关键谜题","url":"https://www.chinanews.com/edu/shipin/cns-d/2026/11-19/news1075483.shtml","summary":"直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚大陆东部。","summary_short":"直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚大陆东部。","digest":"直立人是生存年代最长的古人类物种之一…","points":["直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚…","不过，由于此前中国特别是华南地区相关化石记录存在空白，成为古人类演化关键谜题之一，备受关注","中外科学家最近在广西相距15公里的两处洞穴遗址中鉴定出8颗直立人牙齿化石…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T18:17:43+08:00","size":1,"keywords":[],"body":"直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚大陆东部。不过，由于此前中国特别是华南地区相关化石记录存在空白，成为古人类演化关键谜题之一，备受关注。\n\n中外科学家最近在广西相距15公里的两处洞穴遗址中鉴定出8颗直立人牙齿化石，发现该种群曾生存于距今32.4万年至18.4万年的雨林环境中。这既表明直立人在中国的存续年代比之前的认识至少后推了8万年，也挑战了关于直立人群体无法适应雨林环境行为局限的假设。\n\n这项古人类重大发现，由中国科学院古脊椎动物与古人类研究所(古脊椎所)东亚古人类文化演进与环境适应研究团队张颖奇研究员等，联合山东大学等中外6个国家10余个科研机构的科学家合作完成。北京时间11月19日凌晨，相关成果论文以姊妹篇形式在国际学术期刊《自然》上线发表。\n\n(记者 孙自法 制作 王佳琪 视频来源 施普林格·自然）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/295E618AD6154136B890E40A9A9D369F.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cb903d5853c","title":"哈工大原創話劇《仰望者》 以藝術之美還原「精神群像」｜聚焦哈工大","url":"https://www.stheadline.com/parenting-guide/3638388/哈工大原創話劇仰望者-以藝術之美還原精神群像聚焦哈工大","summary":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神、科學家精神的共鳴。","summary_short":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神…","digest":"近日，哈爾濱工業大學歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場…","points":["近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場…","專業演員與大學師生同台，將一群科學家、教育工作者扎根東北、教書育人、科研攻關的故事搬上舞台","20世紀50年代，800多名青年師生從中國各地齊聚哈爾濱工業大學"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:45:28+08:00","size":1,"keywords":[],"body":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神、科學家精神的共鳴。專業演員與大學師生同台，將一群科學家、教育工作者扎根東北、教書育人、科研攻關的故事搬上舞台。\n哈工大「八百壯士」奮鬥歷程\n這些人物有一個共同的名字——哈工大「八百壯士」。20世紀50年代，800多名青年師生從中國各地齊聚哈爾濱工業大學。這支平均年齡只有27.5歲的教師隊伍，承擔起學科建設與教學任務，為新中國培養工業化建設急需的人才。\n不搞模式化的英雄塑造，整部話劇深入歷史細節與人性深處。「我們站在舞台上，復刻的是先輩的崢嶸故事，演繹的是一代人的赤誠信仰。」就讀於建築與設計學院的鄒明燁說。\n哈工大「八百壯士」扎根北疆、「科技報國」的奮鬥歷程，是新中國高等教育特別是高等工程教育開拓發展的生動縮影。全劇以「仰望」為核心、「傳承」為主線，表達的就是「仰望與扎根」——腳踏泥濘、仰望星空，每代人都是仰望者，也會成為被仰望者。\n文藝是時代的號角，也是精神的載體。觀察者認為，《仰望者》找到了思想性與藝術性的結合點，通過高水準的劇本創排與舞台視覺呈現，使科學家精神與教育家精神在藝術美感中自然流淌、潤物無聲。\n這部話劇通過新媒體直播平台播出，50萬人次線上觀看。\n文：李雙余、闞思邈 圖：辛然、陳暢\n延伸閱讀：\n哈爾濱工業大學香港理工大學深圳國際設計學院 舉行揭牌儀式｜聚焦哈工大\n哈工大總體研製 八一04星「哈爾濱號」成功發射｜聚焦哈工大","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c441e987d3e","title":"食蜆習慣反映教養？港人震驚朋友1食法「嚇到眼都突」網民負評：睇得出人性禮貌","url":"https://www.stheadline.com/food/3638933/食蜆習慣反映教養港人震驚朋友1食法嚇到眼都突網民負評睇得出人性禮貌","summary":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。","summary_short":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。","digest":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教","points":["與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教","近日，一名港人於網上社交平台發文，分享早前與一大班朋友聚餐食炒蜆時…","帖文旋即引起廣大網民熱烈討論，大批網民一面倒負評樓主朋友的行為，直斥缺乏禮貌：「睇得出人性…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:27:41+08:00","size":1,"keywords":[],"body":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。近日，一名港人於網上社交平台發文，分享早前與一大班朋友聚餐食炒蜆時，驚見同枱友人竟做出一個奇特的食蜆舉動，直言與自己從小的家庭教育截然不同，令他當場大感震驚。帖文旋即引起廣大網民熱烈討論，大批網民一面倒負評樓主朋友的行為，直斥缺乏禮貌：「睇得出人性、禮貌同尊重」。\n港人與友聚餐食炒蜆驚見1行為 直言與從小家教截然不同\n港人聚餐或到小炒店用膳，惹味的炒蜆往往是餐桌上的熱門菜式。最近，一名港人於網上社交平台發文，表示自己從小到大與家人食炒蜆時，家人都會將蜆連同外殼一併夾走享用。然而，樓主日前與一班朋友食炒蜆時，卻驚見同枱所有人竟然都是「直接夾嚿肉」，然後將空殼原封不動留在公家碟上，令到樓主需於整碟蜆殼中「摷」才找到蜆肉。面對朋友們異於常人的進食習慣，樓主坦言當時「嚇到眼都突」，甚至一度懷疑自己的飲食習慣才是奇怪。\n網民批評友人無家教：隻隻都空城計真係嬲\n帖文引起網民熱烈討論，大多網友力撐樓主飲食習慣無問題，直指其朋友們的行為反映家教問題：「咁係你班friend無家教」、「你屋企有家教，千祈唔好以為一大班人係norm」、「通常我係做揀走啲殼嘅人，隻隻都空城計真係嬲」、「屋企人無教錯你」。有不少網民自身的家庭教育，表示從小長輩已教導必須連殼夾起，亦不能夾回碟內：「就算夾起發覺冇肉都唔可以放返落碟」、「好細個試過一次齋夾肉，比阿爸鬧」、「夾住嚿肉喺隻碟度揈甩個殼咁核突？」\n有較為包容的網民笑指朋友間無需太計較，或大家下次可選擇用公家匙羹：「通常我會將所有嘅殼夾晒出嚟放喺我前面，搞到變到有座山」、「最方便嘅方法就係用公匙羹，一勺倒落自己個碗慢慢食」、「唯有親自攞隻公家匙羹慢慢𢳂出嚟，提示大家應該連殼夾走」。有自稱資深「食蜆美食家」的網民打趣表示，樓主的朋友都不懂食蜆的真正美味：「作為炒蜆資深食家，夾到有肉就食、啜埋汁，無肉就淨啜汁」、「真，啜汁先惹味，算埋個殼先係精粹，佢哋識唔識食」、「我連殼食，用牙咬走啲肉，咁樣除咗得體，其實更好味」。\n文：R\n資料及圖片來源：Threads\n延伸閱讀：內地客遊港遇「茶餐廳文化」衝擊 力數三宗罪怒批：這叫服務嗎？ 勸這類人不要去....","image":"","video":"","video_poster":"","lang":"zh-Hant"}]}],"stats":{"articles":320,"clusters":266,"merged":54},"trending":{"generated_at":"2026-11-19T21:42:24+00:00","boards":[{"key":"weibo","display":"微博熱搜","count":50,"grouped":true,"groups":[{"group":"时政","count":13,"items":[{"rank":1,"title":"中俄美元首和平宣言","heat":180911,"label":"","url":"https://s.weibo.com/weibo?q=%23%E4%B8%AD%E4%BF%84%E7%BE%8E%E5%85%83%E9%A6%96%E5%92%8C%E5%B9%B3%E5%AE%A3%E8%A8%80%23","meta":"","category":"国内时政","group":"时政","summary":"《中俄美元首和平宣言》，是中国国家主席习近平、俄罗斯总统普京、美国总统特朗普在中国广东省深圳市举行的中俄 …阅读更多"},{"rank":3,"title":"一图读懂深圳倡议","heat":108271,"label":"","url":"https://s.weibo.com/weibo?q=%23%E4%B8%80%E5%9B%BE%E8%AF%BB%E6%87%82%E6%B7%B1%E5%9C%B3%E5%80%A1%E8%A
