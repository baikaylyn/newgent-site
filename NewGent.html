作為唱作歌手擁有個人全創作大碟的夢想。被問到碟中最喜歡哪一首作品？Ian笑言：「很難選擇，每一隻都是「親生仔」，每一首都是別具意義。」但當中既有安慰自己的作品，亦有希望能治癒聽眾及給予力量的歌曲。由於新碟已售罄，連Ian媽媽亦向他查詢能否「加單」留碟，Ian笑指已盡力為身邊親友爭取名額。而新碟推出當日更會舉行簽名會，屆時將透過抽籤形式與購買專輯的支持者近距離見面。\n陳卓賢回應紀念品錯體\n至於早前演唱會紀念品被指出現印製錯字及亂碼問題，Ian回應指自己並不知情，但相信公司得悉後定會即時跟進及作出更改，確保交到歌迷手上的產品完美無瑕。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1a20f7dcc8","title":"萬千星輝賀台慶2026｜MYNT魔音女團露腰唱跳新歌 倪嘉雯爆排足一周 劉佩玥大讚有進步","url":"https://www.stheadline.com/film-drama/3639040/萬千星輝賀台慶2026MYNT魔音女團露腰唱跳新歌-倪嘉雯爆排足一周-劉佩玥大讚有進步","summary":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行，當中由六位TVB小花組成的「魔音女團」MYNT 震撼登場，成為全場焦點！","summary_short":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行…","digest":"《萬千星輝賀台慶2026》於今晚在將軍澳電視城隆重舉行…","points":["《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行…","成員宋宛穎（Sabrina）、倪嘉雯（Carmen）、莊子璇（Hilary）…","六女全晚舞姿整齊、動感十足，為盛典注入滿滿的青春熱血與活力"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:28:41+08:00","size":1,"keywords":[],"body":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行，當中由六位TVB小花組成的「魔音女團」MYNT 震撼登場，成為全場焦點！成員宋宛穎（Sabrina）、倪嘉雯（Carmen）、莊子璇（Hilary）、倪樂琳（Ellyn）、喬美莎（Chelsea）及盧映彤（Skylar）齊齊以型格露腰裝束亮相，合力唱跳第三首全新主打單曲〈Tic Toc〉。六女全晚舞姿整齊、動感十足，為盛典注入滿滿的青春熱血與活力。對於今次台慶跳唱演出，倪嘉雯（Carmen）表示自我感覺良好，並透露為了是次表演足足排練了一星期，連前輩劉佩玥（Moon）遇見她們時亦大讚有進步，希望觀眾能看到她們的蛻變。\n莊子璇倪樂琳預告赴韓集訓\n談到即將出發到韓國展開地獄式集訓，MYNT 成員均顯得相當興奮。被問到有否為嚴寒天氣做好準備，莊子璇（Hilary）笑言已預備了大量暖包，更準備「寓工作於娛樂」；而倪樂琳（Ellyn）則吃貨上身，揚言到當地一定要大牌檔吃烤肉，又大讚韓國便利店的食物非常美味。雖然被取笑今次旅程是「增肥團」，但她們自信地表示不怕變肥，因為當地天氣寒冷加上排練艱苦，燃燒脂肪的速度會非常快。另外，講到台慶若幸運抽中大獎，盧映彤（Skylar）大方笑言會分錢給隊友，每人派一萬元，屆時在韓國集訓時由她請客，展現團員間的超強閨密情！\n相關閱讀：TVB台慶2026丨一文睇清精彩時刻 陳煒領軍性感熱舞 許志安馬國明「安心事件」後首同場","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce172eb7d74","title":"BTS相隔8年全員抵台 4子夜闖六合夜市掃台灣小食 V大展神射手技贏巨型公仔","url":"https://www.stheadline.com/film-drama/3638994/BTS相隔8年全員抵台-4子夜闖六合夜市掃台灣小食-V大展神射手技贏巨型公仔","summary":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲，並定於今晚（19日）、21日及22日假高雄世運主場館舉行3場高雄站演出…","summary_short":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲…","digest":"韓國天團BTS的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完…","points":["韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》…","雖然ARMY（BTS粉絲名稱）已事先發起「勿接機、勿跟車、勿蹲點、勿守酒店」的呼籲…","七子當中，Jin、J-Hope、V和Jungkook等4位成員到達下榻酒店只休息一會兒…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:15:08+08:00","size":1,"keywords":[],"body":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲，並定於今晚（19日）、21日及22日假高雄世運主場館舉行3場高雄站演出，BTS七子已於昨日（18日）飛抵高雄。雖然ARMY（BTS粉絲名稱）已事先發起「勿接機、勿跟車、勿蹲點、勿守酒店」的呼籲，但畢竟今次是七子事隔8年再度全體來台的大日子，故此昨日凌晨已有粉絲帶埋摺凳和應援物抵達小港機場守候，最終機場更湧入上千名粉絲來接機。接着SUGA、RM、Jin、J-Hope、Jimin、V及Jungkook於昨午陸續現身，令全體粉絲激動不已。\nJin、J-Hope、V和Jungkook分享小食\n七子當中，Jin、J-Hope、V和Jungkook等4位成員到達下榻酒店只休息一會兒，就「衫都冇換」立即出發到當地著名的六合夜市遊覽。4人在工作人員和保安陪同下，悠閒地行夜市，而且4人中只有Jungkook穿連帽外套戴口罩，其餘3人都是零變裝、坦蕩蕩地走進人擠人的夜市。眾人第一站就是走到賣糍粑和芝士條的攤檔，他們點了一客芝士條，攤檔老闆叮囑他們「小心爆漿啊」，V也親切地用中文回應「好、好、好」。接過那盒芝士條後，4人就急不及待即時用簽子叉起芝士條享用，食得相當滋味！接着4人走到遊戲攤檔，Jin和V先觀察射氣球遊戲，並交談研究半晌，最終由曾服役於韓國陸軍軍事警察特任隊的V首先上陣，曾受過專業射擊訓練的他三兩下就將氣球全射破，盡展神射手架勢，最終贏得豬頭公仔一大個。然後4子走到賣大腸包小腸的攤檔買香腸，不知是否為演出保持最佳狀態，4子只買了一串香腸幾份分，買完香腸他們就打道回酒店，並一邊揮手向現場粉絲講拜拜，一邊坐上接載車輛離去。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6f7308a3b2","title":"跟着戏曲去出海 《戏宇宙（海外季）》开播仪式举办","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734965.shtml","summary":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。","summary_short":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。","digest":"山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办","points":["中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会…","《戏宇宙》自2022年开播以来，以“弘扬戏曲文化、传播中华之美”为初心，从演播室创演秀…","作为四度入选国家广电总局“中华文化广播电视传播工程”的重点IP，该节目第二季斩获“星光奖”…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:39:39+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。\n\n　　据了解，《戏宇宙》自2022年开播以来，以“弘扬戏曲文化、传播中华之美”为初心，从演播室创演秀、文旅实景、经典解读到扬帆出海，五季内容完成四次形态跃迁，持续探索传统文化的年轻化表达。作为四度入选国家广电总局“中华文化广播电视传播工程”的重点IP，该节目第二季斩获“星光奖”，第三季跻身年度广电视听精品推荐。\n\n　　今年，《戏宇宙(海外季)》以“跟着戏曲去出海”为核心理念，将舞台从国内剧场搬到马来西亚的街头、海滩、校园与百年戏台，用更贴近海外年轻观众的语言重构戏曲叙事，让戏曲从“圈内叫好”走向“世界听见”。\n\n开播仪式现场。主办方供图\n\n　　山东广播电视台党委副书记、总编辑张桂林当日表示，《戏宇宙(海外季)》不是简单把中国戏曲“带出来”，而是以戏曲为桥，让海外观众透过一段唱腔、一则故事、一档节目，读懂中国人的情感表达、审美追求与精神底色；也借镜头向国内观众展现马来西亚的多元包容，实现“双向奔赴、彼此成就”。\n\n　　中国戏剧家协会分党组副书记、秘书长傅亦轩指出，《戏宇宙》五年来的迭代，是一条从“向内登临”到“向外登临”的路径，经典季回溯戏曲源头、把根讲清楚；海外季则带着名角、乡音与乡情走出国门，从经典文本溯源转向剧种与华人迁徙来路的溯源，在族谱、家书里打捞海外游子的故土记忆。\n\n　　国家广播电视总局广播影视信息网络中心副主任韩肖鹏基于中国视听大数据(CVB)在仪式上分享称，《戏宇宙》前四季正片与口述史节目大屏累计收视人次超3.5亿、总收视时长超9642万小时，各季收视率较前一季平均涨幅超41%，抖音、快手平台主话题播放超23亿次。他表示，五年运营让《戏宇宙》从一档节目成长为有稳定辨识度的文化品牌IP。\n\n节目剧照。主办方供图\n\n　　据介绍，《戏宇宙(海外季)》历时20天深入马来西亚沙巴亚庇、吉隆坡、槟城乔治市三城，把京剧、河北梆子、柳子戏、秦腔、粤剧、潮剧、闽剧、蒲剧等剧种的14位戏曲名家带到异国的土地上，完成全国首档国际戏曲文化交流节目的实地创制。\n\n　　节目中，“荐戏官”曾黎、李依晓、郑业成随团探访。三城展演各有侧重：沙巴站，河北梆子名家王少华、孙娜演绎《大登殿》，蒲剧名家梁静带来《精卫填海》，“洋美猴王”格法以《闹天宫》燃动公开课堂；吉隆坡站，秦腔名家李梅演绎《鬼怨》，彭馨韵带来《天女散花》，柳子戏梅花奖得主尹春媛献上《玩会跳船》《老青天》，青年京剧演员果菁以《卖水》《霸王别姬》展现青春力量；槟城站则将闽剧《荔枝换绛桃》、粤剧《紫钗记》、潮剧《苏六娘》及戏歌《给阿嫲的情书》搬上邱公祠百年戏台与姓氏桥，完成一场跨越山海的文化回访。\n\n节目剧照。主办方供图\n\n　　《戏宇宙(海外季)》突破“演一场”逻辑，搭建起“本土艺术对话、中外联合共创、全媒体长效传播”的传播闭环：在建国中学、英迪国际大学、钟灵独立中学开戏曲公开课，把京剧猴戏、秦腔“慢卧鱼”、粤剧长水袖带进课堂；在丹绒亚路海滩、独立广场、旧关仔角草场做街头汇演，与马来西亚二十四节令鼓、卡达山舞蹈、甘美兰同台。\n\n　　据悉，《戏宇宙(海外季)》将于11月21日起，每周六20:30，在山东卫视以及海内外新媒体平台同步播出。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc9fc2b42ab","title":"国家大剧院与法国波尔多国家歌剧院联合制作歌剧《魔笛》将在京登台","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734958.shtml","summary":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日，国家大剧院与法国波尔多国家歌剧院联合制作的莫扎特歌剧《魔笛》即将登陆国家大剧院戏剧场。","summary_short":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日…","digest":"2026年恰逢莫扎特诞辰270周年，11月24日至29日…","points":["中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年…","该剧此前已于波尔多成功首演，此番亮相北京，将由国家大剧院音乐艺术总监吕嘉执棒…","法国艺术家朱利安·杜瓦尔担纲导演，与中外实力派歌唱家组成的双卡司阵容群星璀璨，联袂献声…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:26:41+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日，国家大剧院与法国波尔多国家歌剧院联合制作的莫扎特歌剧《魔笛》即将登陆国家大剧院戏剧场。\n\n　　该剧此前已于波尔多成功首演，此番亮相北京，将由国家大剧院音乐艺术总监吕嘉执棒，国家大剧院歌剧演员队、国家大剧院合唱团、国家大剧院管弦乐团联袂演绎。法国艺术家朱利安·杜瓦尔担纲导演，与中外实力派歌唱家组成的双卡司阵容群星璀璨，联袂献声，为观众呈现一部兼具欧洲歌剧纯正基因与当代审美表达的全新《魔笛》。\n\n排练现场。刘方摄\n\n　　该版《魔笛》日前举行剧组排练媒体探班活动。中外歌唱家齐聚国家大剧院第一排练厅，为大家带来了第二幕终场大合唱的宏大场面演绎，数十位歌唱演员组成多层次的声部叠加之下，歌声响彻排练厅。第一幕帕米娜与帕帕盖诺、莫诺斯塔托斯的诙谐对手戏，情节轻快、演唱灵动活泼，演员们凭借扎实的唱功与生动的表演，提前让在场媒体感受到了这部中法联合制作歌剧的鲜活魅力。\n\n排练现场。刘方摄\n\n　　国家大剧院与法国波尔多国家歌剧院联合制作歌剧《魔笛》围绕“时尚、梦幻、浪漫”展开。中外顶尖歌唱家双卡司加盟：塔米诺由美国抒情男高音卡梅伦·贝克尔与中国男高音王川分别出演，以纯净的抒情线条塑造王子的成长；帕米娜由瑞士女高音莫伊卡·埃德曼与中国女高音张玫瑰出演，细腻的乐句控制赋予角色柔韧的情感。夜后由希腊花腔女高音达娜埃·孔托拉与法国花腔女高音格洛丽亚·特罗内尔出演，用高超的花腔技巧演绎《复仇的火焰在我心中燃烧》，成为全场的听觉焦点。帕帕盖诺由奥地利男中音拉斐尔·芬格洛斯与中国男中音周正中出演，带来充满喜剧能量的表演；萨拉斯特罗由北马其顿男低音伊戈尔·杜尔洛夫斯基与中国男低音陈佩鑫出演，沉稳声压撑起神殿的庄严。莫诺斯塔托斯由迪特马尔·克施鲍姆与扣京出演，帕帕盖娜由张文沁出演。\n\n　　导演朱利安·杜瓦尔当日介绍，这一版《魔笛》在设计和排演中，努力平衡了莫扎特作品中的童真与深刻情感，演出通过第一幕明亮、第二幕暗黑的舞台设计体现主角经历试炼并成长的过程；服装设计色彩丰富、视觉冲击力强，旨在传递音乐中的喜悦与幽默。\n\n　　据悉，该剧目前排练已进行三周。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5869c3a387","title":"深化國際教育樞紐建設 議員促先完善基礎配套","url":"https://www.stheadline.com/edu-insights/3639023/深化國際教育樞紐建設-議員促先完善基礎配套","summary":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。","summary_short":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。","digest":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設…","points":["立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設…","多位議員呼籲政府先完善本港基礎教育配套，包括宿舍及畢業後的工作安排","教育局副局長施俊輝指，政府會將「一帶一路獎學金」名額提升至200個…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:06:22+08:00","size":1,"keywords":[],"body":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。多位議員呼籲政府先完善本港基礎教育配套，包括宿舍及畢業後的工作安排。教育局副局長施俊輝指，政府會將「一帶一路獎學金」名額提升至200個，以先行先試方式逐步推行「直資擴容」，並持續檢視文憑試與國際標準的銜接。\n「一帶一路獎學金」增至200個\n提出議案之一的選委界議員范凱傑指，全球升學版圖正「洗牌」，香港應善用普通法制度、兩文三語環境及國際化學術體制，吸引更多海內外學生來港升學。\n多名議員呼籲政府擴大招攬學生的範圍，提出修正案的教育界議員鄧飛直言，社會討論國際教育樞紐時忽略基礎教育，強調政府應打通由基礎教育、職業專才教育到高等教育的「全產業鏈」。商界議員嚴剛建議，從國際學校與私立學校開始，研究放寬非本地中小學生來港就讀的簽證安排與監護人要求。\n延伸閱讀︰大學排名屢創新高 蔡若蓮：香港教育優勢難以取代 明年續辦大學校長論壇｜專訪\n選委會議員伍煥杰促請政府加快研究文憑試課程與國際接軌的方案，包括建設更具國際適應性的英文科考試。同屬選委界議員梁美芬，提到特斯拉行政總裁馬斯克的「港人消失論」，認為香港要吸引更多優質人才，提供更多實習和工作機會，「來了（香港）讀書後留住他」。\n施俊輝總結發言時重申，政府繼續支持各大院校主動走出去，而27/28學年起政府會將「一帶一路獎學金」名額，由現時每年150個增至200個，以把握「一帶一路」國家及地區的發展機遇；而直資學校今學年共170名非本地生以自資模式入讀，按年升13%，反映計劃開局良好。對於文憑試的國際認受性，他稱考評局會繼續加深各地教育界對文憑試課程及評核制度的認識，並積極拓展文憑試在內地及海外的認可。\n延伸閱讀︰蔡若蓮爭取大學城百億貸款「加碼」 新田項目最快明年底推 料院校競地不會「大包圍」｜專訪\n創新科技及工業局局長孫東則指，港府重視為大學強化科研成果轉化能力提供有利條件，包括支援大學團隊創立初創企業並將成果商品化的「大學科技初創企業資助計劃」，截至上月已累計向702間初創企業共批出約6.55億元資助。\n本報記者","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c33d32bdd18","title":"譚旻萱認愛黃澤林後過26歲生日 大騷英文語錄轉行文青風？ 遭毒舌網民起底學歷：好Kam","url":"https://www.stheadline.com/film-drama/3638907/譚旻萱認愛黃澤林後過26歲生日-大騷英文語錄轉行文青風-遭毒舌網民起底學歷好Kam","summary":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。","summary_short":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。","digest":"「籃球女神」譚旻萱早前公開與香港「網球一哥」黃澤林（Coleman）的戀情","points":["「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情","日前她迎來認愛後的首個生日，正式邁入26歲","譚旻萱隨後在社交平台上發文，分享多張美照並配上英文感言，不料卻引來部分網民的冷嘲熱諷"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:00:00+08:00","size":1,"keywords":[],"body":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。日前她迎來認愛後的首個生日，正式邁入26歲。譚旻萱隨後在社交平台上發文，分享多張美照並配上英文感言，不料卻引來部分網民的冷嘲熱諷。\n譚旻萱頻頻放閃 遠赴外地陪男友參賽\n譚旻萱自公開戀情後不時大方放閃，除了曾晒出「男友視角」的車廂照並寫下「Perfect birthday morning」外，此前更特意陪同男友遠赴外地參賽。近日，她在Instagram分享慶生新相，並在貼文中寫上西班牙文「Vamos」（意指「加油」），被指是隔空為男友打氣。\n相關閱讀：Mandy譚旻萱難忘與黃澤林台北之旅 晒男友視角甜爆 早前隨行陪網球一哥比賽感情升溫\n譚旻萱美照配英文金句\n譚旻萱在每張照片上，配上長短不一的英文感性語錄。例如與友人的合照中，寫下「leave me carrying only the love, the growth, and the quiet moments that made even the hard days beautiful」，而在自己吹蠟燭的獨照上，配文「leave a little light behind」及「26 starts now」，營造知性文青的格調。\n相關閱讀：譚旻萱赴台貼身陪黃澤林比賽 傳缺席周六903籃球賽？ 網民質疑只顧拍拖放棄上位\n網民反應兩極 起底學歷指「行為尷尬」\n然而，這番英文感言卻意外引發網民熱議。有網民認為她的舉動過於做作，甚至將其英文語錄截圖在網絡上瘋傳。更有網民起底其學歷背景，留言調侃：「英文水平：荔景天主教中學band 2中五」、「其實英文不好就不要張張寫英文，很Kam（尷尬）」、「英文版大文豪」、「裝作ABC」等。不過，亦有粉絲力撐她寫得有心思，雙方在網上掀起兩極討論。\n相關閱讀：譚旻萱戀黃澤林惹爭議 1年前訪問揭進取性格 追男仔會主動身體接觸：我係好明顯嘅","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":15,"items":[{"id":"cbdf97f404b","title":"小一入學自行分配學位結果十一月二十三日公布","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000269.htm","summary":"全港官立及資助小學將於下星期一（十一月二十三日）公布有關二○二七年九月入讀小一的學校自行分配學位錄取名單。","summary_short":"全港官立及資助小學將於下星期一（十一月二十三日）公布有關二○二七年九月入讀小一的學校自行分配學位錄取名單。","digest":"全港官立及資助小學將於下星期一公布有關二○二七年九月入讀小一的學校自行分配學位錄取名…","points":["全港官立及資助小學將於下星期一（十一月二十三日）公布有關二○二七年九月入讀小一的學校自行分配…","教育局發言人今日（十一月二十日）說：「今年有32 104名兒童申請官立及資助小學的自行分配學…","其中屬於有兄／姊在該校就讀或父／母在該校就職類別共8 270人…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:30:00+08:00","size":1,"keywords":[],"body":"全港官立及資助小學將於下星期一（十一月二十三日）公布有關二○二七年九月入讀小一的學校自行分配學位錄取名單。\n\n　　教育局發言人今日（十一月二十日）說：「今年有32 104名兒童申請官立及資助小學的自行分配學位，有18 148名兒童獲派此類學位。其中屬於有兄／姊在該校就讀或父／母在該校就職類別共8 270人，餘下9 878 人則屬按『計分辦法準則』分配類別。」\n\n　　教育局提醒已啓動「小一入學電子平台」帳戶的家長，可於下星期一上午十時起透過電子平台查閱結果。家長亦可於當日上午九時至下午五時，攜同小一入學的紙本申請表家長副本，前往所申請的小學查閱自行分配學位申請結果。\n\n　　獲得自行分配學位的兒童，其家長須注意相關學校的註冊安排及註冊所需文件，例如小一入學的紙本申請表家長副本或「小一入學電子平台」的電子申請紀錄，以及指定數目的兒童相片。家長須於下星期三（十一月二十五日）或星期四（十一月二十六日）的學校辦公時間內，前往所申請的小學為子女辦理註冊手續。\n\n　　發言人說：「如家長未能在上述日期為其子女辦理註冊手續，須事先與學校負責人聯絡，以便作出適當安排，否則將被視作放棄該學位論。」\n\n　　根據小一入學統籌辦法，所有官立及資助小學的自行分配學額約為該校小一學額總數的百分之五十，餘下約百分之五十學額將留待稍後統一派位階段時分派。\n\n　　發言人補充說：「教育局會於明年一月中旬以書面通知未能獲得自行分配學位及只準備參加統一派位的申請者，於一月十八日至二十四日透過『小一入學電子平台』或在一月二十三日或二十四日前往指定的統一派位中心，辦理選校手續，以便進行統一派位。我們鼓勵家長及早登記使用『智方便+』（www.iamsmart.gov.hk/tc/reg.html），並以『智方便+』啓動『小一入學電子平台』，以享用更方便快捷的電子服務。」\n\n　　「若家長在一月二十四日後才為子女申請參加二○二七年度小一入學統籌辦法，他們須前往教育局學位分配組辦理有關手續，教育局會於二○二七年六月為申請兒童另行安排小一學位。」\n\n　　他提醒所有家長：「曾經獲派小一學位的兒童，日後不可再次參加小一入學統籌辦法。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc4647c15de","title":"天氣寒冷市民應注意健康","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000316.htm","summary":"衞生署衞生防護中心（中心）今日（十一月二十日）表示，由於天氣寒冷，市民特別是重點人群包括長者、長期病患者、戶外工作人士、孕婦、嬰幼兒和兒童應採取適當措施，保障健康。","summary_short":"衞生署衞生防護中心（中心）今日（十一月二十日）表示，由於天氣寒冷，市民特別是重點人群包括長者、長期病患者、戶外工作人士…","digest":"衞生署衞生防護中心表示，由於天氣寒冷，市民特別是重點人群包括長者、長期病患者…","points":["衞生署衞生防護中心（中心）今日（十一月二十日）表示，由於天氣寒冷…","中心發言人表示，一般而言，長者皮下脂肪較少，加上體溫調節機能減退…","加上部分長者可能因為行動不便以致身體產生及保存熱能的能力減低"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:18:06+08:00","size":1,"keywords":[],"body":"衞生署衞生防護中心（中心）今日（十一月二十日）表示，由於天氣寒冷，市民特別是重點人群包括長者、長期病患者、戶外工作人士、孕婦、嬰幼兒和兒童應採取適當措施，保障健康。\n\n長者和長期病患者\n\n————————\n\n　　中心發言人表示，一般而言，長者皮下脂肪較少，加上體溫調節機能減退，身體未必能對氣溫下降作出適當反應。加上部分長者可能因為行動不便以致身體產生及保存熱能的能力減低。\n\n　　慢性疾病如高血壓、糖尿病或甲狀腺功能減退等，更會減慢新陳代謝率，因而令患者減少製造熱能。此外，慢性呼吸道疾病或心腦血管疾病等長期病患者，亦會較易因氣溫驟降而令病情惡化。\n\n　　發言人提醒市民，特別是長者和長期病患者，採取以下預防措施：\n\n 留意天氣預報，因應需要加穿禦寒衣物，包括帽、頸巾、手套及襪等；\n\n 進食足夠的食物，攝取充足的熱量；\n\n 經常做適量運動，以增加血液循環及產生熱能；\n\n 逗留在溫暖的環境內，盡量避開早晚氣温較低時段外出，亦應避免長時間暴露於戶外；\n\n 使用保暖電器時要注意安全，室內亦應保持空氣流通；\n\n 避免飲用含酒精的飲品，因為酒精會令血管擴張不但不能保暖，更令身體流失熱量，使人感到寒冷；及\n\n 如感到不適，應盡早求醫。\n\n幼童和孕婦\n\n—————\n\n　　在寒冷天氣下，嬰幼兒比成人更易流失熱能，發言人提醒家長應確保嬰幼兒穿著足夠衣物保暖，但宜輕巧，以防過熱。當兒童進行户外體力活動時，應適量增減衣物，如衣物濕透時，應及時更換。嬰幼兒和孕婦亦應盡量避開早晚氣温較低時段外出。\n\n　　嬰兒就寢時，家長應注意以下安全事項：\n\n 保持房間空氣流通，溫度適中；\n\n 緊記讓嬰兒仰睡，確保他睡覺時頭部、面部及雙手外露，不會被遮蓋；\n\n 嬰兒不需要使用枕頭。讓嬰兒睡在堅實和大小適中的床褥上，切勿在嬰兒睡覺的地方放置軟身物件、枕頭和寬鬆被鋪；\n\n 與嬰兒共睡一室，最安全是讓嬰兒獨自在嬰兒床上睡覺，並把嬰兒床放在父母的床邊；及\n\n 締造無煙環境。\n\n戶外工作人士\n\n——————\n\n　　戶外工作人士需留意天氣報告，穿着適當禦寒衣物工作，如衣物濕透時，應及時更換。在寒冷天氣警告生效期間，應採取適當的預防措施。如有不適應立即暫停工作、尋求協助及求醫。\n\n一般市民\n\n————\n\n　　​另外，多種呼吸道病原體，包括流感及新型冠狀病毒在內，可能在冬季轉趨活躍並同時傳播。除個別有已知禁忌症人士外，所有年滿六個月或以上的人士都建議接種季節性流感疫苗。有較高風險患上流感及其併發症的人士，包括長者及兒童，應盡快接種流感疫苗。詳情請參閱衞生防護中心有關疫苗接種計劃的網站。\n\n　　同時患上流感與2019冠狀病毒病的患者有較大可能出現嚴重併發症和死亡。接種流感疫苗與2019冠狀病毒病疫苗對於長者，尤其居於院舍的院友同樣重要，他們亦應盡快按建議接種2019冠狀病毒病疫苗額外加強劑。市民亦應保持良好個人和環境衞生，以防感染呼吸道疾病，注意事項包括：\n\n 病人佩戴外科口罩可以預防傳播呼吸道病毒，因此出現病徵（即使症狀輕微）的人士佩戴外科口罩十分重要；\n\n 在乘搭交通工具或在人多擠迫的地方逗留時，應佩戴外科口罩。正確佩戴口罩十分重要，包括在佩戴口罩前及脫下口罩後，保持手部衞生；\n\n 避免觸摸眼睛、口和鼻；\n\n 雙手一旦染污，應使用梘液和清水以正確方法洗手；\n\n 當雙手沒有明顯污垢時，用含70%至80%的酒精搓手液潔淨雙手；\n\n 打噴嚏或咳嗽時，應用紙巾掩着口鼻，把用過的紙巾棄置於有蓋垃圾箱內，其後應徹底洗手；\n\n 保持室內空氣流通；\n\n 當出現呼吸道感染病徵，應戴上外科口罩，不應上班或上學，避免前往人多擠逼的地方，及盡早向醫生求診；及\n\n 保持均衡飲食、恆常運動及充足休息，不要吸煙和避免過大的生活壓力。\n\n　　​​一些經由食物傳播的疾病特別是與火鍋食品有關的疾病，在天氣寒冷時也很常見，市民應採取以下預防措施：\n\n 處理食物及進餐前應該洗淨雙手；\n\n 選擇食物時，不要光顧無牌或衞生環境惡劣的商戶；\n\n 徹底清潔並煮熟所有食物；\n\n 蔬菜應以流動清水徹底沖淨，方可烹煮食用。在適當的情況下，可用乾淨的刷子刷洗帶有硬皮的農產品，以去除表面和縫隙間的污物雜質，包括除害劑殘餘和污染物；\n\n 蝦應徹底煮熟，並待殼變紅及蝦肉變白和不透明後才進食；\n\n 貝類海產如帶子及象拔蚌等的外殼應洗擦乾淨，並去除內臟；\n\n 切勿進食任何未完全煮熟的淡水水產。為確保食物徹底煮熟，食物的中心溫度須至少達到攝氏75度，以消滅致病菌；\n\n 大部分火鍋材料都應存放在攝氏四度或以下的冷凍格內，冷藏食物則應放在攝氏負18度或以下的冰箱內；\n\n 切勿以生雞蛋作為火鍋蘸醬；及\n\n 使用不同筷子夾取生熟食物，以免交叉污染。\n\n　　​​此外，市民使用燃燒燃料的裝置時，特別在室內地方，須確保有良好的通風，以免因吸入一氧化碳引致中毒，損害健康。\n\n　　有關更多健康資訊，可致電衞生署健康教育專線（2833 0111），或參閱衞生防護中心網頁和Facebook專頁，以及勞工處於在寒冷天氣警告生效期間，對僱主及僱員發布應採取預防措施的新聞公報。\n\n　　市民亦可「打電話問天氣」（1878 200），或參閱香港天文台網頁了解最新天氣情況和預報，或瀏覽關顧長者天氣資訊。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cac527a907b","title":"僱主及僱員在寒冷天氣應採取預防措施","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000313.htm","summary":"電台及電視台當值宣布員注意：  請立即播出下列特別報告，並在寒冷天氣警告生效時多次重播：  　　勞工處提醒僱主，由於寒冷天氣警告生效，僱主應採取適當的預防措施…","summary_short":"電台及電視台當值宣布員注意：  請立即播出下列特別報告，並在寒冷天氣警告生效時多次重播：  　　勞工處提醒僱主…","digest":"電台及電視台當值宣布員注意：  請立即播出下列特別報告…","points":["電台及電視台當值宣布員注意：","請立即播出下列特別報告，並在寒冷天氣警告生效時多次重播：","勞工處提醒僱主，由於寒冷天氣警告生效，僱主應採取適當的預防措施…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:17:43+08:00","size":1,"keywords":[],"body":"電台及電視台當值宣布員注意：\n\n請立即播出下列特別報告，並在寒冷天氣警告生效時多次重播：\n\n　　勞工處提醒僱主，由於寒冷天氣警告生效，僱主應採取適當的預防措施，例如提醒須在戶外或偏遠地方工作的僱員穿着合適的禦寒衣物，及盡量安排僱員交替在戶外及戶內或有遮蔽的地方工作。僱員要留意天氣報告、穿着合適的禦寒衣物和留意身體狀況，如有不適，例如手腳冰冷和全身震顫，應盡快通知主管和看醫生。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca8ebc98781","title":"一款電磁爐禁止在港供應","url":"https://www.info.gov.hk/gia/general/202611/20/P2026111800561.htm","summary":"機電工程署（機電署）今日（十一月二十日）根據《能源效益（產品標籤）條例》，將一款電磁爐從《條例》訂明的表列型號紀錄冊中剔除，即日起不得在本港供應。","summary_short":"機電工程署（機電署）今日（十一月二十日）根據《能源效益（產品標籤）條例》…","digest":"機電工程署根據《能源效益條例》，將一款電磁爐從《條例》訂明的表列型號紀錄冊中剔除…","points":["機電工程署（機電署）今日（十一月二十日）根據《能源效益（產品標籤）條例》…","機電署負責按《條例》實行強制性能源效益標籤計劃，並定期挑選表列型號的產品進行能源表現監察測試…","由於以上型號產品的測試結果未達相關的能源效益及／或功能特性表現，署方決定將其從紀錄冊中剔除"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:15:00+08:00","size":1,"keywords":[],"body":"機電工程署（機電署）今日（十一月二十日）根據《能源效益（產品標籤）條例》，將一款電磁爐從《條例》訂明的表列型號紀錄冊中剔除，即日起不得在本港供應。\n\n　　有關產品資料如下：\n\n電磁爐\n\n 進口商／\n\n 電話／\n\n 電郵地址\n 品牌\n 型號\n 參考編號\n\n 億世集團有限公司\n\n 2235 0333\n\n cs@epsa.com.hk\n ecHome\n IDCS2100BK\n I250027\n\n　　機電署負責按《條例》實行強制性能源效益標籤計劃，並定期挑選表列型號的產品進行能源表現監察測試，以查核有關產品是否符合向機電署遞交的能源效益及功能特性表現。由於以上型號產品的測試結果未達相關的能源效益及／或功能特性表現，署方決定將其從紀錄冊中剔除。\n\n　　機電署已根據《條例》向相關進口商發出通知書，進口商會於報章刊登通告，通知巿民有關產品會停止在本港供應。\n\n　　公眾如有查詢，請與上述進口商聯絡。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c41f36a85a2","title":"《2026年〈2020年聯合國制裁（中非共和國）規例〉（修訂）規例》刊憲","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000259.htm","summary":"政府今日（十一月二十日）在憲報刊登《2026年〈2020年聯合國制裁（中非共和國）規例〉（修訂）規例》（《修訂規例》），即日生效。","summary_short":"政府今日（十一月二十日）在憲報刊登《2026年〈2020年聯合國制裁（中非共和國）規例〉（修訂）規例》（《修訂規例》）…","digest":"政府在憲報刊登《2026年〈2020年聯合國制裁規例〉規例》，即日生效","points":["政府發言人說：「《修訂規例》修訂《2020年聯合國制裁（中非共和國）規例》…","香港特別行政區政府一直全面實施聯合國安理會施加的制裁","《修訂規例》旨在執行外交部的指示，以履行中華人民共和國作為聯合國會員國的國際義務"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"政府今日（十一月二十日）在憲報刊登《2026年〈2020年聯合國制裁（中非共和國）規例〉（修訂）規例》（《修訂規例》），即日生效。\n\n　　政府發言人說：「《修訂規例》修訂《2020年聯合國制裁（中非共和國）規例》，以落實聯合國安全理事會（安理會）第2827號決議中關於中非共和國的若干制裁決定。」\n\n　　有關修訂延長與軍火相關的制裁、旅行禁令及財政制裁。\n\n　　香港特別行政區政府一直全面實施聯合國安理會施加的制裁。《修訂規例》旨在執行外交部的指示，以履行中華人民共和國作為聯合國會員國的國際義務。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc4d25f003b","title":"地政總署發出地稅繳款通知書","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000174.htm","summary":"地政總署今日（十一月二十日）公布已根據《政府租契條例》（第40章），向受該條例管制的物業及其他若干物業，發出計至十二月二十五日為止，每年地稅超過一百元的半年度地稅繳款通知書。","summary_short":"地政總署今日（十一月二十日）公布已根據《政府租契條例》（第40章），向受該條例管制的物業及其他若干物業…","digest":"地政總署公布已根據《政府租契條例》，向受該條例管制的物業及其他若干物業…","points":["地政總署今日（十一月二十日）公布已根據《政府租契條例》（第40章）…","繳款人士可透過電子方法繳付地稅，例如自動轉帳、銀行自動櫃員機、電子支票或電子本票、轉數快…","繳款人士亦可親身前往指定便利店以現金或「易辦事」繳款"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"地政總署今日（十一月二十日）公布已根據《政府租契條例》（第40章），向受該條例管制的物業及其他若干物業，發出計至十二月二十五日為止，每年地稅超過一百元的半年度地稅繳款通知書。\n\n　　繳款人士可透過電子方法繳付地稅，例如自動轉帳、銀行自動櫃員機、電子支票或電子本票、轉數快、「繳費靈」或透過各銀行及「繳費靈」在互聯網上提供的繳費服務。繳款人士亦可親身前往指定便利店以現金或「易辦事」繳款。詳情請瀏覽庫務署網站（www.try.gov.hk）。\n\n　　此外，繳款人士可以郵寄劃線支票至香港深水埗郵政局信箱28000號或親身前往任何郵政局繳款。請確保足夠郵遞時間及郵資，以令郵遞無誤。郵資不足的信件將不獲接收。有關各郵政局的地址和辦公時間，可致電香港郵政查詢熱線2921 2222或瀏覽其網頁（www.hongkongpost.hk）。\n\n　　未接獲繳款通知書的地稅繳納人，應向地政總署的地稅及地價小組查詢。小組位於香港北角渣華道333號北角政府合署一樓，電話2231 3033。\n\n　　所有物業買主在購置物業時，應促請其代表律師確保計至交易日的地稅已經清繳。有關欠付物業地稅的資料，可致電2231 3033或電郵至landsd@landsd.gov.hk查詢有關帳目結餘。如需書面回覆帳目結餘，繳納人須就每一所物業繳付查詢費。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7202a3f1cd","title":"勞工處舉辦職業健康公開講座","url":"https://www.info.gov.hk/gia/general/202611/20/P2026111900275.htm","summary":"​勞工處十二月一日（星期二）舉辦「體力處理操作及預防背部勞損」講座，簡介背部結構及功用、背部勞損的成因和預防措施及正確的體力處理操作方法，並示範和帶領參加者進行工作間運動的練習。","summary_short":"​勞工處十二月一日（星期二）舉辦「體力處理操作及預防背部勞損」講座，簡介背部結構及功用…","digest":"勞工處十二月一日舉辦「體力處理操作及預防背部勞損」講座，簡介背部結構及功用…","points":["​勞工處十二月一日（星期二）舉辦「體力處理操作及預防背部勞損」講座，簡介背部結構及功用…","講座於下午三時三十分在銅鑼灣高士威道六十六號香港中央圖書館演講廳舉行…","勞工處另於十二月二十一日（星期一）舉辦「工作間的感染控制」講座…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"​勞工處十二月一日（星期二）舉辦「體力處理操作及預防背部勞損」講座，簡介背部結構及功用、背部勞損的成因和預防措施及正確的體力處理操作方法，並示範和帶領參加者進行工作間運動的練習。\n\n　　講座於下午三時三十分在銅鑼灣高士威道六十六號香港中央圖書館演講廳舉行，由勞工處的職業環境衞生師和職業健康護士講授。\n\n　　勞工處另於十二月二十一日（星期一）舉辦「工作間的感染控制」講座，為工作時容易接觸致病細菌和病毒的員工而設，解釋微生物進入人體的途徑及其對健康的影響，並講解工作間的感染控制概念。\n\n　　講座於下午三時三十分在粉嶺璧峰路二號粉嶺健康中心七樓勞工處粉嶺職業健康診所講座室舉行，由職業健康護士講授。\n\n　　以上講座均以廣東話講授，免費入場，但須預先報名。有興趣人士可於網上報名（www.oshsreg.gov.hk）。如欲查詢，可致電2852 4040。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7efd8d22e2","title":"二○二六至二七年度反對應課差餉租值個案完成覆核","url":"https://www.info.gov.hk/gia/general/202611/20/P2026111900254.htm","summary":"差餉物業估價署（估價署）今日（十一月二十日）表示，已覆核於三月十六日至五月三十一日期間收到的約85 000份反對二○二六至二七年度新應課差餉租值建議書…","summary_short":"差餉物業估價署（估價署）今日（十一月二十日）表示，已覆核於三月十六日至五月三十一日期間收到的約85 000份反對二○二六…","digest":"差餉物業估價署表示…","points":["差餉物業估價署（估價署）今日（十一月二十日）表示…","估價署發言人說：「在上述期間提交建議書的人士，如至十一月三十日仍未收到決定通知書…","估價署如決定就反對個案修訂應課差餉租值，修訂會追溯至今年四月一日…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"差餉物業估價署（估價署）今日（十一月二十日）表示，已覆核於三月十六日至五月三十一日期間收到的約85 000份反對二○二六至二七年度新應課差餉租值建議書，並已就覆核結果分批發出決定通知書（表格R22A）。\n\n　　估價署發言人說：「在上述期間提交建議書的人士，如至十一月三十日仍未收到決定通知書，請電郵至enquiries@rvd.gov.hk或致電2150 8833聯絡估價署顧客服務主任。」\n\n　　估價署如決定就反對個案修訂應課差餉租值，修訂會追溯至今年四月一日，並在日後的徵收通知書作出調整。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c69457378b8","title":"勞工處舉辦《僱傭條例》網上研討會","url":"https://www.info.gov.hk/gia/general/202611/20/P2026111900228.htm","summary":"​勞工處十二月十六日（星期三）下午三時至五時舉辦《僱傭條例》網上研討會，歡迎市民登記參加。","summary_short":"​勞工處十二月十六日（星期三）下午三時至五時舉辦《僱傭條例》網上研討會，歡迎市民登記參加。","digest":"勞工處十二月十六日下午三時至五時舉辦《僱傭條例》網上研討會，歡迎市民登記參加","points":["​勞工處十二月十六日（星期三）下午三時至五時舉辦《僱傭條例》網上研討會，歡迎市民登記參加","網上研討會經Zoom以廣東話實時進行，講者會簡介《僱傭條例》的主要條文，費用全免","有興趣人士可於勞工處網頁下載登記表格（www.labour.gov.hk）…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"​勞工處十二月十六日（星期三）下午三時至五時舉辦《僱傭條例》網上研討會，歡迎市民登記參加。\n\n　　網上研討會經Zoom以廣東話實時進行，講者會簡介《僱傭條例》的主要條文，費用全免。\n\n　　有興趣人士可於勞工處網頁下載登記表格（www.labour.gov.hk），並於十二月二日（星期三）或之前將填妥表格以電郵交回，名額先到先得。查詢可致電3575 8671。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ceb15d6c89f","title":"中國香港成為「國際人用藥品註冊技術協調會」監管機構成員 為建設國際醫療創新樞紐邁出關鍵一步","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000238.htm","summary":"醫務衞生局今日（十一月二十日）宣布，中國香港正式加入「國際人用藥品註冊技術協調會」（ICH），成為監管機構成員。","summary_short":"醫務衞生局今日（十一月二十日）宣布，中國香港正式加入「國際人用藥品註冊技術協調會」（ICH），成為監管機構成員。","digest":"醫務衞生局宣布，中國香港正式加入「國際人用藥品註冊技術協調會」，成為監管機構成員","points":["醫務衞生局今日（十一月二十日）宣布，中國香港正式加入「國際人用藥品註冊技術協調會」（ICH）…","ICH是藥物監管技術標準的重要國際協調平台，香港正式成為ICH成員…","ICH在二○二六年十一月十七日於捷克舉行的大會上…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T10:58:25+08:00","size":1,"keywords":[],"body":"醫務衞生局今日（十一月二十日）宣布，中國香港正式加入「國際人用藥品註冊技術協調會」（ICH），成為監管機構成員。ICH是藥物監管技術標準的重要國際協調平台，香港正式成為ICH成員，代表藥物研發和監管水平獲國際認可，有助進一步推動創新藥「第一層審批」能力和機制的發展，並深度參與制定藥品研發和註冊的國際規則，加快建設國際醫療創新樞紐。\n\n　　ICH在二○二六年十一月十七日於捷克舉行的大會上，通過中國香港（由香港藥劑業及毒藥管理局代表）成為其第20個監管機構成員。其他ICH監管機構成員包括中國國家藥品監督管理局，以及歐洲、瑞士、英國和美國等地的監管機構。\n\n　　醫務衞生局局長盧寵茂教授說：「特區政府衷心感謝國家一直全力支持香港發展成為國際醫療創新樞紐。中國香港成為ICH監管機構成員，充分彰顯『一國兩制』的獨特優勢。香港於二○二三年十月三十一日成為ICH觀察員以來，一直在國家的大力支持下，全力以赴滿足ICH各項要求，才能在短短三年內正式成為ICH監管機構成員，相較政府早前參照國際經驗所估算的八至10年，進程大幅提速。」\n\n　　盧寵茂教授補充：「展望未來，特區政府將按照《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》，積極配合國家『十五五』規劃，支持生物醫藥臨床研發及優化創新藥和臨床急需藥品審評審批。特區政府將於下月成立藥物及醫療器械監督管理中心（藥械監管中心），建立獨立藥品審評審批能力，積極參與國際合作，將香港建設成為國際醫療創新樞紐，更好融入和服務國家發展大局。」\n\n　　衞生署署長林文健醫生表示：「加入ICH是香港藥品審評審批和監管改革的重要里程碑，對即將成立的藥械監管中心尤其重要。藥械監管中心將按照ICH的技術要求，建立獨立審評審批的專業隊伍，提升創新藥審評效率，並派出專家參與制定與修訂ICH指導原則，為全球藥品監管科學化貢獻力量。香港現已同時是ICH監管機構成員及『藥品檢查合作計劃』（PIC/S）成員，藥械監管中心會以科學為本，致力成為國際權威監管機構。」\n\n　　ICH是國際醫藥協調權威機構，宗旨是協調全球藥品註冊技術要求，制定各項涉及安全、效能及素質的國際最高標準指導原則，保障公眾健康。而PIC/S是一個由多個國家和地區藥物監管機構組成的權威國際組織，其使命是領導國際在醫藥品方面的發展、制定並實施嚴謹的「生產質量管理規範」指引及藥品檢查的品質管理系統。中國香港在二○一五年通過審核，並於二○一六年一月一日起正式成為PIC/S成員。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd320fc44d4","title":"財政司司長出席中華人民共和國財政部2026年美元主權債券發行儀式致辭","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000249.htm","summary":"以下是財政司司長陳茂波今日（十一月二十日）出席中華人民共和國財政部2026年美元主權債券發行儀式致辭：  尊敬的郭婷婷副部長（財政部副部長）…","summary_short":"以下是財政司司長陳茂波今日（十一月二十日）出席中華人民共和國財政部2026年美元主權債券發行儀式致辭：  尊敬的郭婷婷副…","digest":"財政司司長出席中華人民共和國財政部2026年美元主權債券發行儀式致辭（只有中文）（附…","points":["尊敬的郭婷婷副部長（財政部副部長）、尊敬的張勇副主任（中央人民政府駐香港特別行政區聯絡辦公室…","很高興出席國家財政部在香港舉行的美元主權債券發行儀式","首先，我代表香港特區政府，熱烈祝賀這次20億美元主權債券的成功發行"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T10:35:08+08:00","size":1,"keywords":[],"body":"以下是財政司司長陳茂波今日（十一月二十日）出席中華人民共和國財政部2026年美元主權債券發行儀式致辭：\n\n尊敬的郭婷婷副部長（財政部副部長）、尊敬的張勇副主任（中央人民政府駐香港特別行政區聯絡辦公室副主任）、各位嘉賓、各位朋友：\n\n　　早上好！很高興出席國家財政部在香港舉行的美元主權債券發行儀式。首先，我代表香港特區政府，熱烈祝賀這次20億美元主權債券的成功發行。感謝郭婷婷副部長親臨香港，也衷心感謝國家財政部一直以來對香港國際金融中心建設的大力支持。\n\n　　繼去年之後，財政部今年再度來港發行美元主權債券，至今已是第七次。多年來，財政部在香港發行的主權債券，幣種和品種越來越豐富。除了美元債券，人民幣國債已連續18年來港發行，累計發行額超過5,000億元人民幣。今年五月，也首次發行了人民幣綠色主權債券，認購金額更是超過發行額的十倍，可見國際投資者對我國主權債券高度認可。\n\n　　在香港發行主權債券，是國家更好利用國內國際兩個市場、兩種資源，擴大高水平對外開放的重要一步。事實上，離岸國債的發行，既為國際投資者提供優質資產配置，也有助於完善離岸人民幣收益率曲線，為市場提供定價基準。內地企業在境外發行的債券，約七成在香港發行，主權債券的定價基準作用就更加重要。\n\n　　習近平主席指出，金融強國要擁有強大的國際金融中心，能夠吸引全球投資者，影響國際定價體系。香港背靠祖國、聯通世界，正好在這方面發揮橋樑和紐帶作用。\n\n　　多年來，香港是亞洲最大的國際債券安排發行樞紐。去年，經香港安排發行的亞洲國際債券超過1,300億美元，大約佔總額的四分之一。發行人可以根據需要，選擇美元、人民幣、港元或歐元進行融資。\n\n　　為了推動香港債券市場進一步向前發展，我們去年九月發布了固定收益及貨幣市場的發展路線圖。我們會多措並舉，把一級市場發行、二級市場交易、託管結算和風險管理貫通起來，形成更大的市場體系，既便利發行人融資，也便利投資者配置資產和管理風險。目前，幾方面的工作正在同步推進。\n\n　　首先是拓展債券市場的廣度。特區政府發揮帶頭作用，未來五年，將每年發行約1,500億到2,000億港元等值的債券，既支持北部都會區等基建項目，也為市場提供不同幣種和年期的債券選擇。我們也積極吸引全球各地的政府、金融機構、多邊機構和企業來香港發債，讓發行主體更加多元。最近，來自印尼及哈薩克斯坦的發行人都先後來港發行點心債，就是很好的例子。\n\n　　除了廣度，還要有深度，重點是提升流動性。今年七月，人民銀行（中國人民銀行）、金管局（香港金融管理局）和證監會（證券及期貨事務監察委員會）宣布多項新措施，支持香港固定收益和離岸人民幣市場發展。這些措施目前正逐項落實。債券通公司將建立電子交易平台，監管機構也在探索債券回購集中清算。本月初起，經債券通持有的內地國債和政策性銀行債，以及財政部在境外發行的主權債券，都可以在香港交易所的衍生產品結算所用作抵押品。這些措施有助於提升二級市場流動性，拓寬債券作為抵押品的用途，提升資金運用的效率，並降低投資者的交易和融資成本。\n\n　　在離岸人民幣業務方面，國家「十五五」規劃綱要提出，支持香港強化全球離岸人民幣業務樞紐功能。我們正從流動性、基礎設施和產品三方面推進。以產品為例，五年期中國國債期貨今年八月上市。香港交易所本周初也推出了離岸人民幣債券指數，進一步完善離岸人民幣的投資和風險管理生態。\n\n　　與此同時，我們也在建設新一代金融基建，包括在數字平台上發行債券和推動債券代幣化，以提升效率。特區政府自二○二三年起，先後發行了四批代幣化綠色債券，今後會繼續定期發行，帶動更多發行人參與。\n\n　　各位嘉賓、各位朋友，這次國家再度在香港發行美元主權債券，既是對香港債券市場的有力支持，也為市場發展注入了新的動力。展望未來，在國家的堅實支持下，我們會繼續發揮「一國兩制」下內聯外通的優勢，全力配合財政部和內地相關部委的工作，為國家金融強國建設作出新的，更大的貢獻，也為全球投資者創造新的價值。\n\n　　最後，再次祝賀這次債券發行圓滿成功，祝各位身體健康、工作順利。謝謝大家！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf8f25a19a5","title":"​駐華盛頓經貿辦推廣香港營商機遇","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000145.htm","summary":"香港駐華盛頓經濟貿易辦事處（駐華盛頓經貿辦）於十一月十九日（華盛頓時間）在題為「香港：促發展創機遇　為全球拓商機」的午餐簡介會上…","summary_short":"香港駐華盛頓經濟貿易辦事處（駐華盛頓經貿辦）於十一月十九日（華盛頓時間）在題為「香港：促發展創機遇　為全球拓商機」的午餐…","digest":"香港駐華盛頓經濟貿易辦事處（駐華盛頓經貿辦）於十一月十九日在題為「香港：促發展創機遇…","points":["香港駐華盛頓經濟貿易辦事處（駐華盛頓經貿辦）於十一月十九日（華盛頓時間）在題為「香港…","出席人士包括美中貿易全國委員會的會員企業，它們均是以美國作基地…","駐華盛頓經貿辦處長陸紫賢致辭時，強調香港在促進全球互聯互通方面擔當關鍵角色"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T09:35:00+08:00","size":1,"keywords":[],"body":"香港駐華盛頓經濟貿易辦事處（駐華盛頓經貿辦）於十一月十九日（華盛頓時間）在題為「香港：促發展創機遇　為全球拓商機」的午餐簡介會上，向美中貿易全國委員會介紹在二○二六年《施政報告》和《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》（《香港第一個五年規劃》）公布後，香港不同界別的營商新機遇。出席人士包括美中貿易全國委員會的會員企業，它們均是以美國作基地、在大中華地區設有業務或對區內市場有興趣的跨國企業。\n\n　　駐華盛頓經貿辦處長陸紫賢致辭時，強調香港在促進全球互聯互通方面擔當關鍵角色。陸紫賢說：「香港作為『超級聯繫人』，一直致力連繫不同地方的人才、企業和市場，為國際企業提供策略性平台，以開拓中國內地及亞太區市場。」\n\n　　陸紫賢介紹《施政報告》和《香港第一個五年規劃》下香港經濟發展的重點，強調香港致力推動長遠經濟發展、加強國際聯繫，以及深化商貿合作。\n\n　　她指出，香港在金融服務、貿易、航運及航空領域具備傳統優勢，同時積極推動創新科技發展。透過強化「四中心、一高地」的地位，香港將進一步提升國際競爭力，並開拓新的投資及商貿合作機遇。她亦介紹香港在法律及解決爭議服務方面的機遇，包括正推動香港成為國際調解和仲裁之都。\n\n　　此外，陸紫賢亦提到香港歷來最大型發展項目——北部都會區的最新發展。北部都會區佔香港土地總面積約三分之一，旨在推動教育、科技、科研及人才協同發展，並充分善用毗鄰粵港澳大灣區完善供應鏈和蓬勃創科生態圈的優勢。\n\n　　陸紫賢說：「北部都會區的發展為美國企業帶來龐大機遇。美國企業在多個重要領域中具備世界一流的專業實力，對北都發展至關重要。我們歡迎美國企業參與北都發展，並期望探討進一步合作的機遇。」\n\n　　面對日益複雜的環球營商環境，香港繼續保持開放。她說：「我們希望向美國企業傳達一個清晰的信息──香港是建立聯繫、投資及拓展業務的理想地方。我們一直歡迎美國企業參與香港的發展。」\n\n　　投資推廣署紐約辦事處招商引才／投資推廣總監謝怡其後介紹香港上述發展為商界帶來的機遇，以及投資推廣署如何為有意在香港設立或擴展業務的美國企業提供度身訂造的服務。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf56ff86134","title":"社署提醒長者天氣嚴寒保重身體","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000321.htm","summary":"電台及電視台當值宣布員注意：  　　請立即播出下列特別報告，並作多次重播：  　　「由於天氣嚴寒，社會福利署特別提醒長者注意保重身體，並呼籲其親友和鄰居多關心及慰問體弱長者的身體狀況，尤其是獨居長者。","summary_short":"電台及電視台當值宣布員注意：  　　請立即播出下列特別報告，並作多次重播：  　　「由於天氣嚴寒…","digest":"電台及電視台當值宣布員注意：  　　請立即播出下列特別報告…","points":["電台及電視台當值宣布員注意：","「由於天氣嚴寒，社會福利署特別提醒長者注意保重身體…","有需要時可致電社署熱線求助，電話２３４３　２２５５"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:18:37+08:00","size":1,"keywords":[],"body":"電台及電視台當值宣布員注意：\n\n　　請立即播出下列特別報告，並作多次重播：\n\n　　「由於天氣嚴寒，社會福利署特別提醒長者注意保重身體，並呼籲其親友和鄰居多關心及慰問體弱長者的身體狀況，尤其是獨居長者。有需要時可致電社署熱線求助，電話２３４３　２２５５。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c18264b0e15","title":"「見龍在田：赤洲與中國內地恐龍化石展」開幕","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900241.htm","summary":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。","summary_short":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。","digest":"「見龍在田：赤洲與中國內地恐龍化石展」於香港文物探知館舉行開幕典禮","points":["展覽由發展局和中國科學院古脊椎動物與古人類研究所（古脊椎所）合辦…","發展局局長甯漢豪在開幕典禮致辭時表示，赤洲恐龍化石發掘工作在二○二四年十月開展…","亦感謝廣西壯族自治區自然博物館、浙江自然博物院及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T21:48:00+08:00","size":1,"keywords":[],"body":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。展覽由發展局和中國科學院古脊椎動物與古人類研究所（古脊椎所）合辦，展示香港赤洲發現的恐龍化石，揭開本土巨型恐龍的神秘面紗，同時結合粵港澳大灣區其他地方和全國多地的豐富化石寶庫，全面展現中國恐龍世界的演化歷史和生存圖景。\n\n　　發展局局長甯漢豪在開幕典禮致辭時表示，赤洲恐龍化石發掘工作在二○二四年十月開展，隨着清修和研究工作逐步完成，是次展覽不僅標誌着在香港首次發現恐龍化石這難得事情，更要強調這些化石展現恐龍當年的鋒芒、蘊藏的歷史及香港遠古生態環境。她特別感謝古脊椎所在恐龍化石的發掘、清修、研究，以至挑選展品和策展方面，提供了專業的指導及協助，並借出珍貴化石標本作為展品；亦感謝廣西壯族自治區自然博物館、浙江自然博物院及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴藏品。經策展團隊悉心策劃，展覽讓來自不同地方的恐龍化石同場展出對話，說好恐龍故事。\n\n　　古脊椎所所長徐星教授致辭時表示，這次合作是香港古生物研究的重要里程碑。他感謝發展局對聯合研究與科普活動的全力支持，並希望透過是次展覽，讓香港市民了解赤洲恐龍化石的最新研究成果，認識香港恐龍在中國乃至全球恐龍演化歷程中的獨特地位；同時讓公眾近距離接觸古生物學，提升公眾對古生物的興趣和知識。\n\n　　其他展覽開幕典禮的主禮嘉賓包括發展局常任秘書長 （工務）劉俊傑、古物諮詢委員會主席許焯權教授和保育歷史建築諮詢委員會主席蘇彰德教授。\n\n　　展覽共展出66組珍貴展品，既有在香港赤洲出土的全部恐龍骨骼化石，亦有來自粵港澳大灣區其他地方以至內地廣東省以外的白堊紀恐龍化石。來自內地的46組化石中，34組為國家一級重點保護古生物化石。這次來港展覽的化石，大部分都是首次在香港展出。赤洲恐龍化石（當中多件骨骼化石相信來自同一隻「泰坦巨龍形類」恐龍）、擁有完整頭骨的徐氏亞洲暴龍骨骼化石、具有骨質頭冠但沒有上下牙齒的斑嵴龍頭骨化石、體型龐大的諸城暴龍頜骨骼化石、竊蛋龍類恐龍所產的長形蛋化石，以及帶有胚胎的恐龍蛋化石都是這次展覽的亮點。\n\n　　此外，展覽以模型呈現中國恐龍的面貌，深入淺出地解說中國恐龍的演化。為推廣古生物相關知識，香港文物探知館將舉辦一系列公眾講座和多元化的工作坊，讓公眾深入了解古生物化石和古生態。\n\n　　展覽免費入場，詳情如下：\n\n日期：二○二六年十一月二十日至二○二七年五月十二日\n\n開放時間：\n\n星期一至三及星期五早上十時至下午六時；\n\n星期六、日及公眾假期早上十時至晚上七時；\n\n星期四（公眾假期除外）、農曆年初一及二休館\n\n地點：尖沙咀海防道九龍公園香港文物探知館\n\n　　有關展覽、相關活動資料以及精華短片，請瀏覽古蹟辦網頁（www.amo.gov.hk/tc/visitor-centre/exhibitions/heritage-discovery-centre/dinosaur-exhibition/index.html）。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cfa1d772226","title":"數個泳灘懸掛紅旗","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000207.htm","summary":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂及文化事務署今日（十一月二十日）宣布，由於大浪關係，港島南區的大浪灣泳灘…","summary_short":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂及文化事務署今日（十一月二十日）宣布…","digest":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂…","points":["電台及電視台當值宣布員注意：","游泳人士請注意：康樂及文化事務署今日（十一月二十日）宣布，由於大浪關係，港島南區的大浪灣泳灘","以及西貢區的銀線灣泳灘及清水灣第二灣泳灘已懸掛紅旗，顯示在該處游泳會有危險…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T09:31:54+08:00","size":1,"keywords":[],"body":"電台及電視台當值宣布員注意：\n\n請盡快播出下列特別報告：\n\n　　游泳人士請注意：康樂及文化事務署今日（十一月二十日）宣布，由於大浪關係，港島南區的大浪灣泳灘；以及西貢區的銀線灣泳灘及清水灣第二灣泳灘已懸掛紅旗，顯示在該處游泳會有危險，市民請勿在該處游泳。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":11,"items":[{"id":"c6269702a36","title":"进入高发季！出现这6个信号，可能是心梗","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735122.shtml","summary":"寒潮来袭  急性心肌梗死(简称心梗)  也进入每年的高发季节  今天(11月20日)是\r  中国心梗救治日  这一天提醒我们记住  两个与生命有关的“120”：  出现疑似心梗症状  应及时拨打“12…","summary_short":"寒潮来袭  急性心肌梗死(简称心梗)  也进入每年的高发季节  今天(11月20日)是\r  中国心梗救治日  这一天提醒…","digest":"寒潮来袭  急性心肌梗死(简称心梗)  也进入每年的高发季节  今天(11月20日)…","points":["应及时拨打“120”急救电话","胸部不适：胸痛、胸闷、压迫感或紧缩感，可持续存在10多分钟，也可能反复出现","冷汗、头晕或心慌：可能突然出冷汗、头晕，部分患者伴有明显不安或晕厥"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:22:21+08:00","size":1,"keywords":[],"body":"寒潮来袭\n\n急性心肌梗死(简称心梗)\n\n也进入每年的高发季节\n\n今天(11月20日)是\r\n\n中国心梗救治日\n\n这一天提醒我们记住\n\n两个与生命有关的“120”：\n\n出现疑似心梗症状\n\n应及时拨打“120”急救电话\n\n心梗救治，争取黄金120分钟\n\n那么，心梗发生前\n\n身体会发出哪些危险信号？\n\n01\n\n心梗发生前的6个预警信号\n\n　　心梗发作时，一定会胸口剧痛吗？\n\n　　不一定。有些患者心梗时表现为明显胸痛，有些患者只感到胸闷、气短、恶心或异常疲惫，容易被误认为普通的身体不适。\n\n　　当身体出现以下6个预警信号时，一定要及时就医：\n\n　　胸部不适：胸痛、胸闷、压迫感或紧缩感，可持续存在10多分钟，也可能反复出现。\n\n　　放射性疼痛：不适可能出现在肩背、手臂、颈部或下颌等部位。\n\n　　呼吸困难：突然气短、呼吸费力，有时并不伴随明显胸痛。\n\n　　消化道不适：上腹疼痛、恶心、呕吐或类似烧心的感觉，容易与胃病混淆。\n\n　　异常疲惫：出现难以解释的明显疲劳、乏力，有时轻微活动就感到疲惫。\n\n　　冷汗、头晕或心慌：可能突然出冷汗、头晕，部分患者伴有明显不安或晕厥。\n\n　　女性、老年人及糖尿病患者的症状可能不典型。上述表现并非心梗所特有，但如果出现突然、持续或反复的可疑症状，尤其伴有胸部不适、气短、冷汗，应立即拨打120。\n\n心梗并非老年人“专属”\n\n越来越需要引起重视\n\n一旦怀疑发生心梗\n\n及时正确应对至关重要\n\n02\n\n突发心梗怎么办？\n\n　　自己心梗发作\n\n　　若突然出现胸痛、冒冷汗、喘不上气、视线模糊等症状，怀疑自己心梗发作且身边无人时，千万不要捶胸、用力咳嗽，也不要自行驾车前往医院。\n\n　　发病后的120分钟内进行救治非常关键，因此应立即拨打120，准确告知急救人员症状及所在位置，保持安静以减少心脏负担。在专业指导下使用阿司匹林、硝酸甘油等药物。\n\n　　遇他人心梗\n\n　　除上述操作外，如果患者无反应且没有正常心跳、呼吸，应立即进行心肺复苏，并尽快取用自动体外除颤器(AED)，抓住“黄金4分钟”。\n\n提醒大家\n\n心梗存在比较明显的时段规律\n\n清晨和寒冷季节相对高发\n\n心梗早期的识别很重要\n\n黄金急救时间在2小时左右\n\n当出现高度疑似心梗的症状时\n\n不要存在侥幸心理\n\n及时拨打急救电话 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7452bf9352","title":"似睡非睡4年 竟拖成顽固性失眠","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735121.shtml","summary":"今年52岁的张女士(化姓)，被失眠折磨四年有余。","summary_short":"今年52岁的张女士(化姓)，被失眠折磨四年有余。","digest":"今年52岁的张女士(化姓)，被失眠折磨四年有余","points":["今年52岁的张女士(化姓)，被失眠折磨四年有余","起初只是入睡稍慢，她误以为这是更年期的正常表现，居家调理就能好转","她尝试过泡脚、食疗，也断断续续服用过多种助眠药物，但睡眠问题反反复复"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:18:41+08:00","size":1,"keywords":[],"body":"今年52岁的张女士(化姓)，被失眠折磨四年有余。起初只是入睡稍慢，她误以为这是更年期的正常表现，居家调理就能好转。她尝试过泡脚、食疗，也断断续续服用过多种助眠药物，但睡眠问题反反复复。发展到后期，她躺在床上几小时毫无睡意，夜里频繁惊醒，整夜处于似睡非睡的状态。直到前往南京市妇幼保健院麻醉治疗与睡眠门诊就诊，才得知自己已经发展成为顽固性失眠。\r\n\n　　该院麻醉科主任医师王伟提醒，如果已经出现较长时间的睡眠困扰，不要再继续自己摸索调理，应及时就医，避免错过最佳干预时机。\n\n　　很多人觉得顽固性失眠就是睡眠时间不够，但其实二者并不等同。王伟介绍，顽固性失眠属于慢性失眠里的难治类型，问题核心往往不在于睡眠时长的缺乏，而在于睡眠质量差。即便有充足的休息时间、良好的睡眠环境，先后经过生活调整、常规理疗、普通药物治疗，睡眠依旧没有明显改善，并且已经对日常生活造成持续的负面影响，这才是顽固性失眠。\n\n　　因突发事件、压力造成数日睡不着属于短期失眠(普通人遇到变故带来的短暂睡不着)，一般病程很短，经过调整大多能够恢复。\n\n　　顽固性失眠有一些典型的特征，比如病程时间较长，存在入睡困难、睡眠浅、夜间频繁惊醒、早醒等问题，每周至少出现3晚，持续超过三个月；作息基本规律，卧室安静避光，不存在长期夜班、熬夜刷手机等人为压缩睡眠的行为，客观条件适合睡觉，但大脑依旧无法正常进入睡眠；已经试过生活方式调整、安神保健品、中药、常规安眠药物等多种方式，睡眠改善十分有限，就算短暂好转也会很快复发；同时白天已经出现明显不适，例如浑身疲惫、记忆力下降、注意力涣散，还经常心慌烦躁、情绪低落。\n\n　　当然，顽固性失眠并不是无法改善，但治疗周期相对较长，所以不建议患者单纯依靠自行吃药或者居家调理解决问题。王伟提醒，这类失眠大多是睡眠节律出现紊乱，失眠拖得越久，越容易形成心理负担，进一步加重睡眠问题。每个人恢复情况各不相同，一定要尽早到睡眠专科就诊评估，不要等到发展成顽固性失眠再就医。\n\n　　通讯员 张沁沁 扬子晚报/紫牛新闻记者 许倩倩 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2d15e1a3b1","title":"出现红斑揉一揉，再用气圈垫一垫？ 这些“好心护理法”正在加重压疮","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735118.shtml","summary":"11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)。","summary_short":"11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)。","digest":"11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)","points":["11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)","2026年国际官方主题为：每一个动作，皆有意义","随着我国逐渐步入老龄化社会，大量卧床老人的居家照护问题日益显著…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:14:05+08:00","size":1,"keywords":[],"body":"11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)。2026年国际官方主题为：每一个动作，皆有意义。随着我国逐渐步入老龄化社会，大量卧床老人的居家照护问题日益显著，而其中一个非常重要且容易被大家忽视的问题就是压疮。\r\n\n　　南京市中西医结合医院中医外科(疮疡科)主任中医师黄子慧提醒，不少人认为压疮就是“躺久了磨出来的”，这是对压疮发病机制的片面理解，不同人群的压疮风险特点不同，预防和治疗的侧重点也有差异。\n\n　　通讯员 杨璞 扬子晚报/紫牛新闻记者 许倩倩\n\n　　压疮不只是“躺久了磨出来的”\n\n　　压疮的本质是局部组织长期受压，血液循环障碍导致的缺血、缺氧性坏死，除了压力外，摩擦力(比如拖拽卧床患者时皮肤和床单的摩擦)、剪切力(半卧位时身体下滑，皮肤和深层组织发生相对位移)、潮湿(汗液、尿液长期浸渍皮肤)、营养不良、外周血管疾病等都是核心诱因。\n\n　　“像部分晚期肿瘤、糖尿病患者，即使每小时翻身一次，依然可能因为自身微循环障碍出现压疮。压疮预防是包含体位管理、皮肤护理、营养支持、基础疾病控制的系统工程，翻身只是其中的一个环节。”黄子慧说。\n\n　　对于压疮的常见错误认知还有很多，比如不少家属发现患者受压部位皮肤发红，第一反应是按揉局部“活血”，殊不知，此举有时反而会加重组织损伤。当发现红斑指压不褪色，同时伴随局部发硬、水疱，说明已经进展为1期或2期压力性损伤，此时不要自行按揉、热敷，要及时咨询医护人员处理。\n\n　　还有家属会给患者使用气垫圈、橡胶圈垫在红肿部位，以为能减轻压力，减少压疮风险。事实上，气垫圈的环形结构会导致圈的边缘部位压力集中，压迫红肿区域周围的血液循环，反而扩大缺血范围，正确的做法是选用软硬度合适的减压床垫(如泡沫床垫、充气减压床垫)，足跟、肘部等骨突部位可以用软海绵垫、泡沫敷料进行局部减压，避免直接接触床面。\n\n　　关于伤口护理的常见误区，就是“干燥结痂就是好得快”，实际上湿性愈合环境下的伤口修复速度比干燥环境快30%-50%。如果压疮伤口敞着，表面会形成硬痂，痂皮下方的渗液无法引流，反而会向深部组织渗透，导致创面加深、感染。\n\n　　“压疮不是‘小病’，不是自己在家涂点药膏、换换药就能解决的问题。如果创面越来越深、甚至露出骨头，往往可能已经合并深部组织感染、骨髓炎、败血症等严重并发症。”黄子慧表示，压疮的严重程度和创面深度也并不完全成正比，部分看似只有硬币大小的浅表创面，下方可能已经形成了深达肌肉的窦道，普通家属很难准确判断。建议只要出现指压不褪色的红斑、水疱，就应第一时间到医院就诊。\n\n　　需要注意的是，一些表面没有破溃的皮肤，皮下组织也可能已经发生了坏死。这种情况在肥胖患者、使用减压床垫的患者中尤其常见。\n\n　　黄子慧提醒，除了看皮肤颜色，还要用手摸一摸有没有发硬、波动感、疼痛感，一旦发现异常就要及时就诊。压疮是高复发性疾病，曾经得过压疮的患者，局部皮肤和皮下组织的结构已经受损，微循环比正常部位差，复发风险是普通人群的2—3倍。对于长期卧床、脊髓损伤、晚期肿瘤、糖尿病等高危人群，压疮预防是需要长期坚持的日常工作，即使之前的压疮已经完全愈合，依然要定期评估风险、坚持规范的体位管理和皮肤护理。\n\n　　中西医结合，不同人群分类防治\n\n　　西医的压疮预防以风险评估、体位管理、减压器具使用为核心，在此基础上加入中医“未病先防”的干预手段，能让高危人群的压疮发生率下降。对于已经形成的2期以上压力性损伤，需要彻底清除坏死组织，否则创面很难愈合。西医的外科清创、水刀清创、酶解清创能够快速清除大块的坏死组织，但对于创面缝隙里的少量腐肉、深部窦道的坏死组织，清理难度大，还容易损伤正常肉芽。此时配合中医的化腐生肌类外用药，能够利用药物的拔毒作用，让残留的坏死组织慢慢溶解、脱落，不会损伤新生的肉芽组织。\n\n　　压疮愈合后，西医的康复指导以功能锻炼、营养支持为主，配合中医的艾灸、药膳调理、经络按摩等手段，能够进一步改善患者的全身状态，降低复发风险。\n\n　　针对不同人群压疮防治的注意事项，黄子慧也做了详细介绍：\n\n　　老年卧床人群：重点关注皮肤状态的细微变化，因为老年人皮肤薄、敏感性差，压疮进展速度比年轻人快很多，可能短短24小时就会从红斑进展为深部破溃，建议每天至少检查2次全身皮肤，每周做1次压疮风险评估。\n\n　　脊髓损伤人群：因为感觉功能障碍，患者无法感知局部压迫的疼痛感，压疮复发率极高，建议每1—2小时翻身一次，使用动态减压床垫，骨突部位常规使用泡沫敷料预防，同时每年定期到疮疡科做皮肤检查。\n\n　　糖尿病合并压疮人群：此类人群因为外周神经病变和微循环障碍，压疮愈合难度大，感染风险高，除了创面处理外，一定要严格控制血糖，将空腹血糖控制在7.8mmol/L以下，餐后血糖控制在10mmol/L以下，才能保证创面顺利愈合。\n\n　　术后卧床人群：术后1—3天是压疮高发期，尤其是骨科术后、全麻术后的患者，因为活动受限、疼痛不敢翻身，家属要主动协助患者每2小时翻身一次，重点关注骶尾部、足跟、肩胛等部位，避免压疮发生。 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3533ef4951","title":"西甲｜畢爾包地頭惡 淨勝波膽穩開","url":"https://www.stheadline.com/football-betting/3639044/西甲畢爾包地頭惡-淨勝波膽穩開","summary":"畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手，氣勢如虹。","summary_short":"畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手，氣勢如虹。","digest":"畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手…","points":["畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手，氣勢如虹","今仗迎戰反擊力極弱的愛斯賓奴，主隊憑藉鐵人防中謝蘭拿巴列拿近期展現的獵犬式逼搶與強悍攔截…","在教練泰錫調教下，畢爾包聯賽11戰僅失11球，近3輪更錄得2勝1和佳績，包括主場4…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:00:50+08:00","size":1,"keywords":[],"body":"畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手，氣勢如虹。今仗迎戰反擊力極弱的愛斯賓奴，主隊憑藉鐵人防中謝蘭拿巴列拿近期展現的獵犬式逼搶與強悍攔截，勢必封死客軍攻勢，穩奪3分兼零封對手，推介波膽1:0及2:0。\n在教練泰錫調教下，畢爾包聯賽11戰僅失11球，近3輪更錄得2勝1和佳績，包括主場4:0大炒基達菲及在巴斯克打吡中力克皇蘇，攻守極具統治力。球隊表現改善的關鍵，在於23歲青訓防中謝蘭拿巴列拿異軍突起。這名被西媒譽為「獵犬」的鐵人今季已交出21次成功搶斷及16次攔截，攔截榜更一度高居西甲次席；早前3:0大勝馬體會一役，他全場狂奔12.89公里兼末段獻助攻，地面對抗勝率亦達58.7%。泰錫盛讚其跑動覆蓋與戰術紀律，以他為核心的中場屏障，令主隊防線固若金湯。\n愛斯賓奴不時送罰球\n相反，愛斯賓奴近7戰4負，換帥後雖靠死守兩戰不失，惟中前場創造力極弱，聯賽已連續4場半場悶和0:0；加上全季累積39面黃牌冠絕西甲，犯規過多兼攻力疲軟，今仗作客難逃一敗亦難望破蛋。馬高\n畢爾包 VS 愛斯賓奴\nNow 632台周六凌晨4:00直播\n推介：波膽1:0 & 2:0","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c180b998c96","title":"起床后这4件事易引发心梗，冬天尤其别做","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735004.shtml","summary":"今天是“中国心梗救治日”  心血管的这些风险，你留意过吗？","summary_short":"今天是“中国心梗救治日”  心血管的这些风险，你留意过吗？","digest":"今天是“中国心梗救治日”  心血管的这些风险，你留意过吗","points":["心血管的这些风险，你留意过吗","冬季是中老年人心血管疾病的高发季","当人在屏气排便时，各个器官的肌肉都在用力收缩，腹部肌肉也一样，导致腹压增高…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:46:01+08:00","size":1,"keywords":[],"body":"今天是“中国心梗救治日”\n\n心血管的这些风险，你留意过吗？\n\n冬季是中老年人心血管疾病的高发季\n\n晨起避免几个容易伤心脏的习惯\r\n\n起床过猛\n\n排便用力\n\n过早晨练\n\n慢性病患者自行减药\n\n其实心脏养护要贯穿一生\n\n不同年龄段\n\n风险隐患和护心重点各不相同\n\n早筛查、早管理，才能长期守护心脏健康\n\n接下来\n\n就让中国科学院院士\n\n浙江大学医学院附属第二医院 院长\n\n心脏中心主任医师 王建安\n\n带我们一起了解！\n\n01 冬季护心注意：早起“4不做”\n\n　　1.早上起床不要过猛\n\n　　人在睡觉时，大脑皮质处于休眠、抑制状态，各项生理功能维持着低速运转，代谢水平降低、心跳减慢、血压下降……刚睡醒时，这种“睡眠惯性”还会维持一小会儿，如果此时立刻起床，容易引起大脑供血不足，可能会引发中风、猝死等意外。\n\n　　正确做法：晨起遵循“躺30秒—坐30秒—站30秒”的节奏，避免体位骤变引发脑供血不足、摔倒。\n\n　　2.晨练不赶早\n\n　　冬季早上天气寒冷，室内外温差大，如果此时再进行运动，心肌供氧量增加，心脏负担就会加重，对于老年人来说，容易出现供氧不足、心脏缺血的情况，严重时可能会诱发心肌梗死。\n\n　　正确做法：等日出后气温回升再外出，做好头颈部保暖；避免大汗后受凉，防止血管剧烈收缩诱发心血管事件。\n\n　　冬季晨练要做好保暖工作，运动强度不宜过大，运动前要充分热身。走路、太极拳、八段锦等都是较好选择。\n\n　　注意：冠心病患者早晨不建议外出运动。\n\n　　3.排便不要过于用力\n\n　　对于老年人来说，用力排便是大忌。当人在屏气排便时，各个器官的肌肉都在用力收缩，腹部肌肉也一样，导致腹压增高，心脏排血阻力增大、血压升高和心肌耗氧量增加，从而可能会导致心肌缺血、心绞痛或严重心律失常，引发心肌梗死，严重可致死亡。\n\n　　正确做法：排便时应集中注意力，但不要过于用力，专心排便，建议每次排便时间不超过10分钟。\n\n　　4.慢性病患者，不要擅自减药量\n\n　　规律监测用药：每日固定时间测量血压并记录，作为医生调药的依据；寒冷季节心血管事件高发，需遵医嘱按时服药，不要擅自减量。\n\n02 全年龄段护心指南，每个阶段重点不同\n\n　　老年期：不是老了就该喘、该累、该肿\n\n　　很多老年人将活动后气喘、疲劳、下肢水肿归为衰老的正常表现，实则可能是心脏疾病的信号。\n\n　　3类症状需警惕\n\n　　气喘：运动耐量明显下降，比如之前爬5楼无碍，现在爬2~3楼就胸闷憋气，需排查冠心病心肌缺血；平地活动也喘、夜间平卧加重，需警惕舒张性心衰。\n\n　　疲劳：血压控制不佳、心功能下降、帕金森病等都可能引发，症状持续加重时需就医鉴别。\n\n　　水肿：可能是降压药副作用、静脉瓣功能减退，也可能提示瓣膜病、心衰、低蛋白血症、房颤等问题；若水肿进行性加重、伴随胸闷气喘，需及时就诊。\n\n　　中年期：延缓心脏老化的关键期\n\n　　中年是心血管防控的承上启下阶段，此时干预可显著降低老年发病风险，甚至有助于逆转早期血管损伤，直接决定晚年的健康质量。\n\n　　1. 理性看待血管斑块\n\n　　动脉粥样硬化是随年龄增长的自然过程，查体发现轻度斑块不必过度恐慌，它更像一个健康预警：提示你需要严格管理生活方式与危险因素。\n\n　　斑块进展速度可干预，戒烟限酒、控制体重、稳定血脂血压，能大幅延缓其发展，降低破裂风险。\n\n　　2. 核心防控要点\n\n　　全面管理指标：体重、腰围、血压、血糖、低密度脂蛋白胆固醇需同步控制，体重下降往往能同步改善血压、血脂、血糖等多项指标。\n\n　　正确看待长期用药：降压、降糖、他汀类降脂药等慢性病用药，有长期循证研究支持，获益明确，不良反应大多可控。不要因“依赖药物”的顾虑擅自停药，指标长期稳定带来的低心梗、低中风风险，才是用药的核心价值。\n\n　　青年人：别让隐患在年轻时埋下\n\n　　青年心梗看似突发，实则是危险因素长期叠加的结果。\n\n　　1. 青年心梗更凶险\n\n　　年轻人的血管斑块通常体积不大，但稳定性差，一旦突然破裂，会迅速形成血栓完全堵塞血管。由于病程短、没有形成侧支循环代偿，心肌坏死进展更快，对远期心功能影响相对更大。\n\n　　超重肥胖、三高、长期吸烟、熬夜、重油重糖饮食、久坐不动，是青年心梗较为常见的诱因。\n\n　　2. 常见不适的鉴别\n\n　　一过性针刺样痛、位置不固定、安静时明显、活动后反而缓解：大多与熬夜、焦虑、神经调节紊乱相关，即心脏神经官能症，并非器质性心脏病。\n\n　　心跳“漏一拍”：多为早搏，绝大多数是功能性的，与作息、情绪相关；若每日频发、伴随胸闷头晕，或继发于心肌炎、心肌缺血，则需就医评估。\n\n　　养护建议\n\n　　避免2个极端：既不能仗着年轻透支身体、放任血压血脂异常不管；也不必因偶发不适过度焦虑。\n\n　　症状持续时可完善心电图、24小时动态心电图检查；若活动后出现胸闷胸痛、休息后不缓解，需立即就诊。\n\n　　儿童青少年：隐匿风险早筛查\n\n　　儿童的心脏问题症状常不典型，容易被当作普通感冒、体虚忽略，需重点关注2类疾病：\n\n　　1. 先天性心脏病\n\n　　重症先心病患者出生后就可能出现口唇发绀等明显表现，但轻症如房间隔缺损、室间隔缺损，早期可能毫无症状。\n\n　　建议新生儿常规做心脏超声筛查，3岁左右复查；部分小缺损可随生长自行闭合，未闭合者大多可通过介入封堵等微创方式治疗，无需一律开胸手术。\n\n　　2. 暴发性心肌炎\n\n　　多继发于感冒、病毒性腹泻之后，病毒侵袭心肌并引发免疫损伤，病情进展迅猛，严重时可导致心衰、猝死。\n\n　　预警信号：体温恢复正常后，孩子仍持续精神萎靡、乏力懒动、活动后气急，状态与病前差异明显，不要简单归为“病后体虚”，需及时就医排查。\n\n03 心梗救治，记住2个“120”\n\n　　每年11月20日是中国心梗救治日，心梗救治的核心原则可总结为2个“120”：\n\n　　第一时间拨打120：出现持续不缓解的胸痛、胸闷，伴随大汗、濒死感，不要自行驾车就医，立即拨打120。急救车配备除颤、心肺复苏设备，可在转运途中开展急救，大幅提升存活率。\n\n　　黄金救治120分钟：血管堵塞后2小时内开通，心肌损伤最小，对日后心功能影响也最低；拖延越久，心肌坏死范围越大，越容易遗留心衰等后遗症。\n\n冬季养心脏行动指南\n\n　　1.冬季护心注意：早起“4不做”\n\n　　早上起床不要过猛、排便不要过于用力、晨练不要过早、不擅自减药量。\n\n　　2.全年龄段护心指南\n\n　　老年期：气喘、疲劳、水肿，出现这3类症状需警惕。\n\n　　中年期：理性看待斑块、全面管理指标、正确看待长期用药。\n\n　　青年人：青年心梗更凶险。若活动后出现胸闷胸痛、休息后不缓解，需立即就诊。\n\n　　儿童青少年：建议新生儿常规做心脏超声筛查，3岁左右复查。感冒退烧之后，如果孩子状态和之前差别很大，要及时就医排查。\n\n　　3.心梗救治的核心原则可总结为2个“120”\n\n　　第一时间拨打120、黄金救治120分钟。\n\n　　小圈温馨提示：\n\n　　本文为健康科普，不替代专业诊疗。 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c1f0a3807","title":"中環60年補鞋老店 00後女生轉行接班做「鞋醫」| 星島申訴王","url":"https://www.stheadline.com/voice-topics/3638794/中環60年補鞋老店-00後女生轉行接班做鞋醫-星島申訴王","summary":"講求時間累積的傳統手藝。","summary_short":"講求時間累積的傳統手藝。","digest":"講求時間累積的傳統手藝","points":["在手工鞋匠日益減少的年代，26歲00後女生Herman，就選擇接手位於中環…","Herman接受《星島申訴王》記者訪問時表示，希望在科技迅速發展的時代…","年青職人報道：90後港男出位打扮宣傳服飾爆紅 形象設計師活得自我…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:45:00+08:00","size":1,"keywords":[],"body":"講求時間累積的傳統手藝。在手工鞋匠日益減少的年代，26歲00後女生Herman，就選擇接手位於中環、擁有超過60年歷史的「順記鞋家」，更得到創辦人之一的順姨手把手傳授補鞋技藝。\nHerman接受《星島申訴王》記者訪問時表示，希望在科技迅速發展的時代，將這份古老工藝與人情味延續下去。\n年青職人報道：90後港男出位打扮宣傳服飾爆紅 形象設計師活得自我：襯衫是我樂趣 | 星島申訴王\n放棄插畫專業 三代同堂做鞋匠\n「順記鞋家」擁有超過60年歷史，創辦人陳順與太太順姨先後退休，子女無意接班，第二代接手人亦於2025年移民離開香港。在機緣巧合下，Herman的父親接手經營這間鞋店。當時正於大專修讀插畫專業的Herman，因見插畫行業競爭大、難以求職，於是決定隨父親步伐入行成為一名鞋匠。\nHerman表示，與其從事容易被科技取代的工作，倒不如學習一門手藝，既能維持生計，又可以將傳統文化傳承下去。她家中三代均曾從事鞋匠工作，父親和爺爺全力支持她經營鞋店，不時會到店內幫忙招呼客人，Herman爸爸余先生笑言「最緊要係女兒開心！」家人的支持，亦讓她無後顧之憂，建立自己的「修鞋王國」。\n鞋匠日常主要工作，是協助客人修補皮鞋鞋底，行內俗稱為「打掌」，即在皮鞋鞋底黏上膠質或防滑墊，以延長鞋子壽命或磨走過滑的鞋底。過程看似簡單，但實際操作卻甚具難度。Herman解釋，她剛入行時連削鞋墊都無法做到，且手勢不對更易刮損客人的鞋。\n年青職人報道：冷氣師傅健碩靚仔多？90後冷氣公司東主熱爆網絡 分享洗冷氣秘訣\n感激老店創辦人授藝 決心守護「打掌」傳統\n幸好鞋店創辦人順姨（陳太），親自花三個月時間把技藝傾囊相授。順姨曾向她形容：「其實我們做鞋匠好像一個醫生，客人的鞋子破爛就儼如醫院的病人，有病找醫生。」這番說話令Herman印象深刻，決心更努力傳承這份工藝與人情味。\nHerman的手藝逐漸獲得不少客人肯定，多位回頭客均大讚其手藝出色，收費合理，並認為在現今社會找到好的補鞋師傅並不容易。面對愈來愈多傳統行業因年輕人嫌辛苦而面臨失傳，00後的Herman選擇用行動證明年輕一代同樣能夠守護傳統。她形容鞋子就像藝術品，並希望大眾能多多支持這班00後用心承傳的珍貴工藝。\n大家是否認識一些年青人從事特殊工種？歡迎聯絡《星島申訴王》跟進報道。\n年青職人報道：00後不躺平！17歲入行做地盤 儲幾十萬買樓照顧家人","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce0a6156bdb","title":"德甲│小將直搗黃「隆」 拜仁大炒在望","url":"https://www.stheadline.com/football-betting/3639041/德甲小將直搗黃隆-拜仁大炒在望","summary":"德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別。","summary_short":"德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別。","digest":"德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別","points":["德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別","拜仁今季主場攻力極度殘暴，近期的強勢走勢與壓倒性的對賽往績，今仗極大機會是一場單方面的虐殺","中場新星蘭納特卡爾近期踢法愈見成熟，上輪聯賽更建功助球隊力克緬恩斯，狀態大勇"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:00:11+08:00","size":1,"keywords":[],"body":"德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別。拜仁今季主場攻力極度殘暴，近期的強勢走勢與壓倒性的對賽往績，今仗極大機會是一場單方面的虐殺。中場新星蘭納特卡爾近期踢法愈見成熟，上輪聯賽更建功助球隊力克緬恩斯，狀態大勇。在主帥高柏尼重返場邊督師下，拜仁讓球盤讓足三球仍捧「主勝」。\n拜仁整體級數遠超科隆，今季縱使在中後場有所變動，在德甲仍9戰取得6勝3和，攻入29球僅失9球，場均近3球的火力冠絕德甲。拜仁在安聯主場的威力尤為恐怖，近4次主場狂轟20球，平均每場更高達5球，控球率亦錄得全聯賽最高的66.4%。加上兩隊近22次聯賽交手拜仁取得20勝2和的壓倒性優勢，近6次對碰更是全勝。另一方面，領隊高柏尼病癒回歸，配合王牌哈利卡尼和米高奧利斯在前場領軍進攻，拜仁絕對能輕鬆控制大局，徹底撕裂對手。\n年僅18歲的中場新星蘭納特卡爾今季不但克服傷患重返綠茵場，近期更成為拜仁陣中最具殺傷力的進攻催化劑。趁師兄穆斯亞拿早前養傷，卡爾立即全面取代其進攻中場位置，並完美展現其極低重心與狹窄空間中的盤扭突破天賦，更繼承了標誌性的42號球衣。這名天才橫溢的新星在聯賽僅上陣約320分鐘便攻入2球，上輪更射入奠勝球；即使在歐聯作客面對馬體會的大場面中，卡爾同場為球隊先開紀錄。領隊高柏尼亦盛讚其無懼對抗的大心臟特質。今仗面對防線漏洞百出的科隆，卡爾的中路盤球突破，和禁區的左腳精準命射，都將是拜仁開路搶分的利器。\n科隆近4場不勝\n反觀作客的科隆近況低迷，開季9戰僅得9分排名第15位，近4場聯賽錄得2和2負。而且球隊作客表現差劣，跨季連續17場聯賽作客不勝勝。近期主帥華格拿更備受防線主力缺陣的困擾。面對主場場均射門超過20次的拜仁，科隆脆弱的防線預期在半場便會全面失守。拜仁在天時地利人和下，大勝4球或以上可謂易如反掌。馬高\n拜仁慕尼黑 VS 科隆\nNow 639台周六凌晨3:30直播\n推介：讓球 [-3] 主勝","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c452158b1f8","title":"Grand Theft Auto VI released around world after 13-year wait","url":"https://news.tvb.com/tc/1207334-GrandTheftAutoVIreleasedaroundworldafter13yearwait","summary":"After over a decade in the making and an estimated 1 billion US dollars or more in production costs…","summary_short":"After over a decade in the making and an estimated 1 billion…","digest":"After over a decade in the making and an e…","points":["The crime-themed franchise known for allowing…","An auto-dealer in Arlington is closing his bus…","(Reporter: How long was the wait, 13 years…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:30+08:00","size":1,"keywords":[],"body":"After over a decade in the making and an estimated 1 billion US dollars or more in production costs, the \"Grand Theft Auto\" video game has officially launched a new entry in the series and begun its global rollout.\nThe crime-themed franchise known for allowing players to steal cars, engage in shootouts and roam freely through fictional US cities has sold more than 470 million units worldwide.\n\"Grand Theft Auto V\" generated 1 billion dollars in retail sales in only three days after its release in 2013.\nEarlier this month, GTA's co-creator Dave Jones noted players' preference for playing as criminals helped shape the direction of the original game.\nThe new edition, billed as one of the most eagerly awaited entertainment launches in years, unlocks for PlayStation 5 and Microsoft's Xbox Series X and S consoles when the clock struck midnight on Thursday .\nThe rollout with updated graphics has gained rapturous early reviews.\nExcitement spread across the electronics district in Tokyo. Posters have gone up on buildings around the town.\nFrom gaming cafes in India to the inspiration behind the game's \"Vice City\", Miami, one of the last places to get in on the action, fans take time off and even shut down businesses for Rockstar Games' latest installment.\nA crossover promo is turning the NBA's Miami Heat arena into \"Vice City\" as the team hosts the Milwaukee Bucks on a one-time-only court adorned with neon pink and blue.\nIn Dallas, Texas, a GTA player marks the release with a brass knuckle tattoo.\nAlexis Hurtado says, \"I have got a brass knuckle tattoo. I don't think you can see it fully, but its right there.\"\n(Reporter: It's related to what?) Hurtado says, \"The GTA game that's coming out...I played like the San Andreas as a kid. And it's like, it's always stuck with me cause like I got real close with like my older cousin because of it.\"\nAn auto-dealer in Arlington is closing his business on November 19.\nBryan Banuelos says, \"It's a cool game. I'm not the best player out there, but man, it's so fun to play. There's just tons of things to do, so definitely a cool thing to check out.\"\n(Reporter: How long was the wait, 13 years, is that right?) Banuelos says: \"About 13 years, yeah.\"\nHe says he hopes it's worth the wait and looks forward to exploring changes to the familiar streets and surroundings in the open world game.","image":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/snapshots/6e779408ab6546ecb42f4747fe7f32ae-00008.jpg","video":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/3a1b7976b8df408db94b89d210d4bd76-81a0e07ee93ca46b58abab60c6a52bad-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/snapshots/6e779408ab6546ecb42f4747fe7f32ae-00008.jpg","lang":"en"},{"id":"c9f8fb6d5c3","title":"TVB celebrates its 59th anniversary","url":"https://news.tvb.com/tc/1207341-TVBcelebratesits59thanniversary","summary":"TVB celebrates its 59th anniversary.TVB's executive chairman Thomas Hui and General Manager Siu Sai-…","summary_ :00+08:00","size":1,"keywords":["Myanmar","United Nations"],"body":"The United Nations' top court hands down a ruling that \nMyanmar committed genocide against the Rohingya\nminority in a brutal 2017 military operation and ordered the \nSoutheast Asian nation to allow people who fled the violence to return home.\nThe landmark decision marks the first time the court has \nruled a state committed genocide.\nIn a 9-6 decision, the World Court found Myanmar was in violation of its obligations \nunder the Genocide Convention.\nThe 15-judge panel rejected reviewed evidence that showed \nMyanmar forces killed about 10,000 Rohingya, hence rejecting the nation's defence \nthat the 2017 campaign was a legitimate operation against insurgents.\nThe court ordered Myanmar to commit to reparations including allowing \nRohingya \"safe, voluntary and dignified return to their place of residence.\" \nIt ordered Myanmar to investigate, prosecute and punish people found to \nhave committed genocidal acts and to pay compensation to Rohingya. \nThe amount will be decided in later court proceedings.","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026b1TCc0vdTJ1795099655.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/6218b3a5a3a44a00a7d4a525a4a36240/dd1208cefe044ec6b0c75d2c08c89cfb-b68399c8e5000f255260051c6990d843-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026b1TCc0vdTJ1795099655.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c7d756dffe7","title":"“一带一路”上的医疗合作","url":"https://www.chinanews.com.cn/ydyl/2026/11-20/10735015.shtml","summary":"从观摩一台手术、完成一次进修，到来中国寻找新药、新方法——  　　“一带一路”上的医疗合作　  　　“一杯白开水的缘分，带出了‘一带一路’上这么多的医疗合作友谊。","summary_short":"从观摩一台手术、完成一次进修，到来中国寻找新药、新方法——  　　“一带一路”上的医疗合作　  　　“一杯白开水的缘分…","digest":"从观摩一台手术、完成一次进修，到来中国寻找新药…","points":["从观摩一台手术、完成一次进修，到来中国寻找新药、新方法——","“一杯白开水的缘分，带出了‘一带一路’上这么多的医疗合作友谊","这次，参与接待和交流的医院包括常州市第一人民医院、山东第一医科大学附属肿瘤医院…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:30:38+08:00","size":1,"keywords":[],"body":"从观摩一台手术、完成一次进修，到来中国寻找新药、新方法——\n\n　　“一带一路”上的医疗合作　\n\n　　“一杯白开水的缘分，带出了‘一带一路’上这么多的医疗合作友谊。”\n\n　　北京大学人民医院胸部肿瘤研究所所长陈克终后来回忆，最初商讨开展国际医学交流时，他与SwanX国际医学合作平台负责人额苏日娜没有正式会谈，两人基于多年的工作信任，在咖啡馆喝了杯白开水，就把那次合作敲定了下来。\r\n\n　　如今，中国医生与“一带一路”共建国家同行们之间的合作越来越多。今年9月，由SwanX国际医学合作平台发起的亚欧肿瘤学术交流周暨第二届SwanX中国肿瘤周先后在江苏常州、山东济南、北京、广东广州四地举行。来自哈萨克斯坦、蒙古国、吉尔吉斯斯坦、塔吉克斯坦等国家的医学专家走进中国的医院、会场和企业，与中国同行交流诊疗经验，探讨合作前景。\n\n　　这次，参与接待和交流的医院包括常州市第一人民医院、山东第一医科大学附属肿瘤医院、北京大学人民医院、中国医学科学院肿瘤医院、广州医科大学附属第一医院和广东省人民医院等。对于中国许多医院和医生来说，与“一带一路”共建国家的同行展开交流合作，已经成为工作中非常重要的一部分。\n\n　　观摩一台手术\n\n　　把中国方法带回去\n\n　　两年前，来自“一带一路”共建国家的医生们首次参访广州医科大学附属第一医院时，中国工程院院士钟南山专程赶过来，与来访者逐一握手交谈。此后，广医一院副院长周承志带领团队持续推进国际医疗合作。\n\n　　今年的参访中，医生们在纸上画起了肺部解剖图，追问手术细节。\n\n　　9月23日，在广医一院，多名外国外科医生观摩了胸外科何建行教授、李树本教授展示的一台无管微创技术。随后的学术讲座中，为进一步弄清技术原理，他们不断追问、继续请教。离开手术室，走进电梯，大家仍在讨论，借着纸上的肺部解剖图一点点拆解手术原理。\n\n　　无管微创技术由广医一院何建行团队首创，减少双腔支气管导管、胸腔引流管、肌松药等药械的使用，能够减轻患者的痛苦，但也对麻醉、解剖分离、血管处理等操作都提出了更精细的要求。在现场，外国医生对这种“无肌松、无插管、无引流”的微创理念发出由衷赞叹。\n\n　　当天，外国医生们也走进广医一院的呼吸介入中心和广州市无管中心建设标准化培训基地，观摩先进的气道介入设备和操作流程，了解术前评估到术后康复的诊疗过程。\n\n　　参访中，海外同行也带来了自己的病例。哈萨克斯坦肿瘤与放射学研究所医生伊娜拉·图尔克佩诺娃分享了一例复杂的腹部肿瘤病例。中外医生们从放射治疗、胸部肿瘤外科等不同角度评估诊疗方案，并围绕不同案例各抒己见。\n\n　　据了解，2011年以来，广医一院累计完成无管胸腔镜手术逾1万例，培训了来自20多个国家的200余名专科医生。\n\n　　在常州市第一人民医院，蒙古国国家癌症中心神经外科团队的5名成员也曾前来进行过为期6个月的专项进修。常州一院院长周军介绍，这批学员回国后，成功开展了神经内镜下深部颅底肿瘤手术6例、脑膜瘤手术10例，填补了当地相关技术空白。\n\n　　“我非常希望能够把这次在中国看到的先进经验和技术也引入我们国家。”吉尔吉斯国立医学院肿瘤学教研室主任赛卡尔·卡奇金诺芙娜·迪伊坎巴耶娃在结束中国之行后感慨。\n\n　　这些年，中国医疗专家也走出国门，来到“一带一路”共建国家开展实地教学。\n\n　　2024年，常州一院胸外科主任汪潜云曾经前往哈萨克斯坦阿斯塔纳，与当地一位胸外科主任共同主刀两台肺癌手术。\n\n　　手术结束后，这位主任激动地拥抱了汪潜云，说：“以后我也要像你这样用吻合器。”今年，来常州参加交流的外国医生再次见到汪潜云时，还特地谈起他在阿斯塔纳教学的经历。\n\n　　据了解，此次交流活动由SwanX国际医学合作平台发起。该平台以肿瘤医学为切入口，致力于推动中国与欧亚国家之间临床、科研、人才培养和医疗产业的合作。近年来，该平台参与推动了消化道肿瘤筛查、肺癌数字病理人工智能、乳腺癌早诊早治等多项跨国科研项目，推进细胞治疗、微创手术机器人等技术进入欧亚市场。\n\n　　翻阅一册指南\n\n　　把临床需求提出来\n\n　　9月17日，在济南举办的第29届中国临床肿瘤学会(CSCO)学术年会现场，外国医生站在展台前，挑选着诊疗指南。有人拿起乳腺癌指南，有人翻看结直肠癌指南。面对陌生的中文指南，他们拿出手机，一页页拍照翻译。\n\n　　回国后，一些外国医生继续研读诊疗指南，向组织方询问：指南里面提到的药物能否引进，是否有可能在当地上市？\n\n　　哈萨克斯坦Miras医疗中心联合创始人苏里娅·叶森塔耶娃就是其中的一位。结束中国之行后，她特地联系组织方，表示希望为自己的一名肺癌患者寻找中国的新药和诊疗手段。\n\n　　“中国在药物研发、药品开发以及临床研究方面的水平，给我留下了非常深刻的印象。”苏里娅说。\n\n　　当天下午，外国医生们专程来到山东第一医科大学附属肿瘤医院质子中心参观学习。多年来，在医院院长、中国工程院院士于金明带领下，这家医院建设了国内规模领先、设备先进的放射治疗中心。参观时，副院长邢力刚向来访者介绍肿瘤防治、精准放疗等方面的临床实践，质子放疗技术引起了外国医生的浓厚兴趣。\n\n　　在常州参观时，主办方还特地安排了外国医生们与中国企业交流，让供需双方彼此了解，探讨合作前景。9月15日上午，在常州医疗健康产业国际合作闭门会上，哈萨克斯坦、塔吉克斯坦医生介绍本国临床需求、医院建设、市场准入等情况，常州钱璟康复、常州朗合医疗等企业则介绍了各自在康复、微创诊疗、医学影像、人工智能辅助诊疗等领域的产品与服务。\n\n　　9月15日下午，外国医生专程走进常州一院的临床科室，了解内镜诊疗、CT引导介入穿刺导航、数字病理和智能康复等技术，与中方同行探讨如何将新型设备恰当地用于日常诊疗。\n\n　　“生物医药及新型医疗器械是常州重点培育的战略性新兴产业。”常州市商务局相关负责人介绍。2025年，当地规模以上相关企业有267家，实现产值589亿元，约占江苏省相关产业规模的12.4%。常州设立了“一带一路”医疗器械海外服务中心常州分中心，支持企业出海。\n\n　　“医疗贸易可以理解为服务贸易，和其他贸易不太一样。货物贸易可能买者看到产品就想买，但医疗贸易需要从专业角度出发。”额苏日娜说。\n\n　　展开一场讨论\n\n　　合作的路越走越宽\n\n　　到中国的第四天，来自哈萨克斯坦的外科医生阿曼·叶尔肯别克的嗓子变得沙哑了。\n\n　　阿曼之前在上海交通大学学习临床医学，掌握多种语言。一路上，他参与交流的同时，还帮助同行者翻译报告、传达问题、表达想法。为了让大家听得懂、说清楚，他在汉语、俄语、哈萨克语和英语之间不断切换。\n\n　　这些活动创造了中外医生建立人际联系的机会，但活动结束后，联系能否继续，合作何以维系？这是不少医生共同的诉求。\n\n　　赛卡尔·卡奇金诺芙娜·迪伊坎巴耶娃表示，中国的乳腺癌筛查和线上多学科会诊给她留下深刻印象。但她也坦言：“由于语言障碍，目前我们还无法与中国专家保持有效的沟通和联系。”她希望今后开展联合科研，让吉尔吉斯斯坦的年轻医生参与进来。\n\n　　远程医疗合作平台提供了一种可能性。9月24日，广东省人民医院介绍国际医疗服务与远程会诊平台时，有一个细节让外国医生们格外在意。屏幕上，出现了哈萨克语、蒙古语等语言选项，熟悉的母语能被实时翻译，这让来访者感到惊喜。\n\n　　“很自豪能向外宾展示国际医疗友好设施，也希望能更快搭建起系统化的国际医疗交流平台。”广东省人民医院副院长钟文昭说。\n\n　　将国际医疗合作制度化，是许多中外专家共同的期待。\n\n　　9月12日，在2026年首都国际医学大会平行论坛——“一带一路”健康合作论坛上，国家卫生健康委卫生发展研究中心研究员王云屏提出，要关注医疗合作的制度化，比如对齐标准、评价成果等。\n\n　　来自乌兹别克斯坦塔什干国立多学科临床中心的阿卜杜拉希莫夫·萨杜拉·纳比耶维奇提议，两国医疗机构应建立长期、稳定的专业联系，在兼顾共同经验和各自特色的基础上，协同推进医学教育、临床实践领域合作。\n\n　　针对这一话题，医生们从各自的专业入手，提供着解决方案。比如，9月20日，中国医学科学院肿瘤医院内科主任马飞在面对海外同行时，介绍了中国肿瘤规范诊疗体系，指出研究合作应统一数据采集标准，开展多中心研究，推动研究成果转化为指南和临床实践。\n\n　　额苏日娜介绍，作为国际医学合作平台，SwanX也在推动架设医院之间的合作桥梁。9月23日，在其推动之下，广医一院与哈萨克斯坦肿瘤与放射学研究所、塔吉克斯坦共和国肿瘤研究中心等机构签署合作备忘录。近年来，广州医科大学已在哈萨克斯坦、土耳其等国挂牌建设海外医学培训中心，推动医学教育和临床技术交流，让中国标准“走出去”。\n\n　　一杯白开水、一台手术、一册指南、一场讨论……“一带一路”上，卫生与健康领域的合作之路越走越宽。\n\n　　(本文配图均由受访者提供)\n\n　　刘少华 王恺祺\n\n　　《人民日报海外版》(2026年11月20日 第 08 版) 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]}],"stats":{"articles":320,"clusters":274,"merg
