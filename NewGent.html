不適，由救護車送仁濟醫院治理。火警中一隻貓咪證實不治。\n據了解，起火原因疑與暖爐焫着被鋪或床褥有關，確實起火原因仍待調查。現場可見，多名居民疏散至屋苑空地等候，消防員及警員在場處理。\n㺺場所見，由於時值清晨，居民大多在睡夢中驚醒逃生，不少人仍穿着睡衣褲，僅披上一件厚上衣便趕落平台等候。一名男住客帶同寵物貓走火時，懷疑貓咪受驚，抓傷他的手指，在救護車上包紮傷口後，拒絕送院。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3ca6ed6cf9","title":"深水埗餐廳爐頭搶火冒煙 大批食客疏散","url":"https://www.stheadline.com/breaking-news/3639641/深水埗餐廳爐頭搶火冒煙-大批食客疏散","summary":"今（21日）午4時許，深水埗元州街龍鳳大廈一間越南餐廳冒煙，食客紛紛疏散，消防到場將火撲熄，事件中無人受傷。","summary_short":"今（21日）午4時許，深水埗元州街龍鳳大廈一間越南餐廳冒煙，食客紛紛疏散，消防到場將火撲熄，事件中無人受傷。","digest":"今午4時許，深水埗元州街龍鳳大廈一間越南餐廳冒煙，食客紛紛疏散，消防到場將火撲熄…","points":["今（21日）午4時許，深水埗元州街龍鳳大廈一間越南餐廳冒煙，食客紛紛疏散，消防到場將火撲熄…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:27:07+08:00","size":1,"keywords":[],"body":"今（21日）午4時許，深水埗元州街龍鳳大廈一間越南餐廳冒煙，食客紛紛疏散，消防到場將火撲熄，事件中無人受傷。 據了解，廚房爐頭搶火引致火警。\n元州街一間餐廳火警。fb：Nancy Lam","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c57c6b2efd2","title":"元朗警署對開斑馬線電單車未讓路直衝 女途人急停避過 網民轟危駕","url":"https://www.stheadline.com/breaking-news/3639497/元朗警署對開斑馬線電單車未讓路直衝-女途人急停避過-網民轟危駕","summary":"網上流傳一段車Cam片段，顯示前日（19日）下午1時許，一輛電單車駛經元朗警署對開斑馬線時，無視正橫過馬路的女途人直接衝過，幸女途人及時停步未有釀成意外。","summary_short":"網上流傳一段車Cam片段，顯示前日（19日）下午1時許，一輛電單車駛經元朗警署對開斑馬線時…","digest":"網上流傳一段車Cam片段，顯示前日下午1時許，一輛電單車駛經元朗警署對開斑馬線時…","points":["網上流傳一段車Cam片段，顯示前日（19日）下午1時許，一輛電單車駛經元朗警署對開斑馬線時…","片段曝光後惹來網民一面倒炮轟鐵騎士行為危險","事發於前日下午1時許，涉事Cam車沿元朗體育路行駛，途經元朗警署後按燈號轉入教育路"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T02:34:33+08:00","size":1,"keywords":[],"body":"網上流傳一段車Cam片段，顯示前日（19日）下午1時許，一輛電單車駛經元朗警署對開斑馬線時，無視正橫過馬路的女途人直接衝過，幸女途人及時停步未有釀成意外。片段曝光後惹來網民一面倒炮轟鐵騎士行為危險。\n網民斥「警署在旁都敢衝」 \n社交平台Facebook群組「車cam L（香港群組）」流傳一段長約42秒的車Cam影片。事發於前日下午1時許，涉事Cam車沿元朗體育路行駛，途經元朗警署後按燈號轉入教育路。當駛至元朗警署及元朗警察已婚宿舍對開斑馬線前，Cam主見一名女途人正橫過馬路，隨即停車禮讓。\n當駛至元朗警署及元朗警察已婚宿舍對開斑馬線前，Cam主見一名女途人正橫過馬路，隨即停車禮讓。fb@車cam L（香港群組）（下同）\n其後一輛電單車駛至。\n電單車無視交通規則及行人，直接從女途人前方高速穿過斑馬線。\n惟女途人行至馬路中央時突然停步，未幾即有一輛電單車無視交通規則及行人，直接從女途人前方高速穿過斑馬線，幸事件中無人受傷。女途人定神後繼續前行，對面兩名中學生橫過馬路時，亦特地向停車讓路的Cam主揮手致謝。\n大批網民留言批評涉事鐵騎士罔顧安全，直言「危駕，做佢」、「見Cam主停車就知有人過緊馬路啦，咁都衝，害人害物」，亦有人諷刺「警署喺附近，都夠膽衝」。\n根據香港法例第374G章《道路交通（交通管制）規例》第31條，當行人已踏上斑馬線，司機必須在車輛駛至斑馬線前讓行人先行。此外，按第240章《定額罰款（刑事訴訟）條例》，「沒有讓斑馬線上的行人先行」屬定額罰款罪行，自2026年1月1日起相關罰款已調高五成至675元。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c42d5388f4f","title":"港鐵尖沙咀站驚現鼠蹤 小老鼠扶手電梯旁現身 網民：米奇無處不在","url":"https://www.stheadline.com/breaking-news/3639496/港鐵尖沙咀站驚現鼠蹤-小老鼠扶手電梯旁現身-網民米奇無處不在","summary":"本港近日多處發現鼠蹤，昨日（20日）有網民在社交平台發文，指在港鐵尖沙咀站內的行人扶手電梯附近發現老鼠出沒，引來不少網民熱議。","summary_short":"本港近日多處發現鼠蹤，昨日（20日）有網民在社交平台發文，指在港鐵尖沙咀站內的行人扶手電梯附近發現老鼠出沒…","digest":"本港近日多處發現鼠蹤，有網民在社交平台發文…","points":["本港近日多處發現鼠蹤，昨日（20日）有網民在社交平台發文…","扶手電梯金屬板旁現身 身形細小疑從罅隙爬出","有目擊者昨日在Facebook群組「香港突發事故報料區及討論區」發文…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T02:16:23+08:00","size":1,"keywords":[],"body":"本港近日多處發現鼠蹤，昨日（20日）有網民在社交平台發文，指在港鐵尖沙咀站內的行人扶手電梯附近發現老鼠出沒，引來不少網民熱議。\n扶手電梯金屬板旁現身 身形細小疑從罅隙爬出\n有目擊者昨日在Facebook群組「香港突發事故報料區及討論區」發文，表示「尖沙咀地鐵站內行人扶手電梯有米奇」，並上載兩張現場照片。\n港鐵尖沙咀站內的行人扶手電梯附近發現老鼠出沒，引來不少網民熱議。FB@香港突發事故報料區及討論區（下同）\n該隻老鼠背部披有深色毛髮、耳朵圓小、尾巴幼長，疑似從附近罅隙爬出。\n從照片可見，事發地點為港鐵尖沙咀站內，在鋪有黑色及米白色間條圖案的地磚、毗鄰帶有黃色警示標記的銀灰色金屬坑紋板位置，出現一隻身形細小的老鼠。該隻老鼠背部披有深色毛髮、耳朵圓小、尾巴幼長，疑似從附近罅隙爬出。\n網民熱議衛生情況 紛指「成街周圍都係」\n帖文隨即引起大批網民留言關注本港鼠患情況，不少人感嘆「米奇無處不在」，亦有人直言「成街周圍都係老鼠」、「好多老鼠，失控」，甚至戲稱「香港係米奇之都」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c317662ddd0","title":"有片｜西九龍公路現大坑洞陷阱 電單車輾過倒地 鐵騎士受傷送院","url":"https://www.stheadline.com/breaking-news/3639494/有片西九龍公路現大坑洞陷阱電單車輾過倒地-鐵騎士受傷送院","summary":"西九龍公路發生交通意外。","summary_short":"西九龍公路發生交通意外。","digest":"西九龍公路發生交通意外","points":["昨日（20日）下午1時許，一名54歲姓李男子駕駛電單車沿西九龍公路南行…","途經的私家車司機目擊意外後代為報警","救護員接報趕抵現場，發現男傷者全身多處受傷，幸仍保持清醒，隨即由救護車送往瑪嘉烈醫院治理"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T01:17:54+08:00","size":1,"keywords":[],"body":"西九龍公路發生交通意外。昨日（20日）下午1時許，一名54歲姓李男子駕駛電單車沿西九龍公路南行，駛至商場V Walk對開時，疑因路面有殘缺，電單車輾過坑洞後失去平衡，人仰車翻倒地。途經的私家車司機目擊意外後代為報警。\n目擊者驚呼：「咁大個坑」\n救護員接報趕抵現場，發現男傷者全身多處受傷，幸仍保持清醒，隨即由救護車送往瑪嘉烈醫院治理。警方正調查意外起因。\n網傳片見路面現大坑 另有白色小狗公路奔跑\n事後網上流傳事發現場的照片及影片，可見男事主倒臥馬路上，涉事電單車橫亘路中，有警員在場調查。有途經人士拍片時驚呼路面出現「咁大個坑」，片段中亦見有一隻白色小狗在公路上奔跑，暫未知其後去向。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf054006cec","title":"富寶花園爆水管｜鹹水凌晨起陸續恢復 議員指須檢查相關零部件有否老化","url":"https://news.tvb.com/tc/1207552-富寶花園爆水管鹹水凌晨起陸續恢復議員指須檢查相關零部件有否老化","summary":"馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4,000戶的食水及沖廁水供應一度受影響。食水供應在周五晚上約8時恢復供應，至於鹹水則於周六凌晨起陸續恢復。","summary_short":"馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4,000戶的食水及沖廁水供應一度受影響。","digest":"馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4…","points":["馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4…","食水供應在周五晚上約8時恢復供應，至於鹹水則於周六凌晨起陸續恢復","供水暫停期間，不少富寶花園居民冒著寒冷天氣，帶同水桶及水袋等，到樓下水車取水…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T01:00+08:00","size":1,"keywords":[],"body":"馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4,000戶的食水及沖廁水供應一度受影響。食水供應在周五晚上約8時恢復供應，至於鹹水則於周六凌晨起陸續恢復。\n\n供水暫停期間，不少富寶花園居民冒著寒冷天氣，帶同水桶及水袋等，到樓下水車取水，取水點出現人龍，有人出動手推車。\n\n黃先生說：「真是糟糕，最重要的是鹹水、淡水都沒有，你說怎麼辦？嚴重影響的話，是沒有機會洗熱水澡。」\n\n水務署派出兩架水車，放置24個水箱，有「供水特攻隊」成員在場協助居民，派發樽裝飲用水，附近超市貨架上的樽裝水，幾乎被搶購一空。\n\n水務署稱周五早上得悉，富寶花園有內部私人供水管爆裂，與沙田民政處、區議員等協調後，大廈管理處承建商安排緊急維修。\n\n簡先生稱：「剛才問了職員，有一架水車回去裝水中，水車不是很足夠，只有一架在這裡，因為(屋苑)有兩級，這裡一層、上面一層，總共兩層，我們從上面來，我們等會兒要再走上去。」\n\n1993年入伙的富寶花園，屬私人參建居屋，共有12座、超過4,000伙。立法會議員葉傲冬曾到場了解，估計是喉管老化導致爆水管。\n\n民建聯新界東南議員葉傲冬指出：「似乎也是喉管的老化，出現金屬疲勞等情況，出現了破損，食水喉破裂的喉管，旁邊就是鹹水喉，這也是法團給我們的資訊，因為食水喉的破裂，影響了鹹水喉，出現了破裂的情況，未來最重要也要檢查相關零部件，會否出現老化情況，如果出現老化情況，也要及早更換。」\n\n水務署提醒，恢復供水初期水管可能會殘留雜質，建議市民先打開水龍頭放水，等水質清澈後才使用。","image":"https://pro-vod-cdn.tvb.com/0875034e0123470daf38c53e7026905f/snapshots/fd231d3ac28f41a78bc002bc4e318b5e-00008.jpg","video":"https://pro-vod-cdn.tvb.com/0875034e0123470daf38c53e7026905f/a6b714f12a9a4852a0bb6adb33d2b84a-34c29c35666c1498171db7cb0c6baf32-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/0875034e0123470daf38c53e7026905f/snapshots/fd231d3ac28f41a78bc002bc4e318b5e-00008.jpg","lang":"zh-Hant"},{"id":"ccb25f52cf4","title":"天氣寒冷｜今日新界6區低見10度或以下 這區日夜溫差達13度","url":"https://www.stheadline.com/society/3639461/天氣寒冷今日新界6區低見10度或以下-這區日夜溫差達13度","summary":"本港周末早晚寒意加深，日間氣溫則明顯回升。","summary_short":"本港周末早晚寒意加深，日間氣溫則明顯回升。","digest":"本港周末早晚寒意加深，日間氣溫則明顯回升","points":["本港周末早晚寒意加深，日間氣溫則明顯回升","天文台預測，今日（21日、周六）市區氣溫介乎13至21度，大致多雲，日間部分時間有陽光及乾燥","自動分區天氣預報顯示，新界6區最低氣溫降至10度或以下，其中打鼓嶺低見8度…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T00:45:20+08:00","size":1,"keywords":[],"body":"本港周末早晚寒意加深，日間氣溫則明顯回升。天文台預測，今日（21日、周六）市區氣溫介乎13至21度，大致多雲，日間部分時間有陽光及乾燥。自動分區天氣預報顯示，新界6區最低氣溫降至10度或以下，其中打鼓嶺低見8度，日間最高則達21度，日夜溫差達13度。\n打鼓嶺8度石崗9度　將軍澳大埔最低10度\n根據分區預報，周六打鼓嶺最低氣溫僅8度，石崗低見9度；將軍澳、上水、大埔及流浮山最低均為10度。多區日間氣溫回升，早晚與日間溫差顯著，市民外出宜留意氣溫變化，適時添衣。\n根據分區預報，周六打鼓嶺最低氣溫僅8度，石崗低見9度；將軍澳、上水、大埔及流浮山最低均為10度。\n天文台周五（20日）下午4時半更新的預報顯示，周六本港吹北風4至5級，後轉東風4至5級，相對濕度介乎50%至80%。\n下周初略回暖　周二季候風再抵沿岸\n天文台表示，強烈東北季候風會令周六早上廣東地區寒冷。隨着覆蓋華南的廣闊雲雨帶逐漸遠離，該區天色將短暫好轉。\n不過，一股達強風程度的偏東氣流會在下周初影響華南沿岸，屆時雲量增多，氣溫略為回升。另一股東北季候風預料於下周二（24日）抵達華南沿岸，下周中期氣溫將再度下降，並有幾陣雨。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":56,"items":[{"id":"c5931d3e17c","title":"特朗普盛赞深圳城市建设：干净整洁、路面平整，看看人家，再看看我们自己……","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735781.shtml","summary":"当地时间11月20日，美国总统特朗普在白宫举行记者会。","summary_short":"当地时间11月20日，美国总统特朗普在白宫举行记者会。","digest":"当地时间11月20日，美国总统特朗普在白宫举行记者会","points":["当地时间11月20日，美国总统特朗普在白宫举行记者会","会上，特朗普高度评价了亚太经合组织第三十三次领导人非正式会议的主办城市深圳","特朗普盛赞深圳，称整座城市干净整洁，一尘不染，而这一切都是在短时间内建成的…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:03:08+08:00","size":1,"keywords":[],"body":"当地时间11月20日，美国总统特朗普在白宫举行记者会。会上，特朗普高度评价了亚太经合组织第三十三次领导人非正式会议的主办城市深圳。\n\n　　特朗普盛赞深圳，称整座城市干净整洁，一尘不染，而这一切都是在短时间内建成的，40多年前这里还只是个渔村。他同时表示，美国一些城市的发展与治理“让人汗颜”，城市脏乱，道路坑洼，轨道也破旧，“看着很恶心”，犯罪率也很高。\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca3ed27cebe","title":"湾区和湾区经济是啥？人民日报2分钟说透","url":"https://www.chinanews.com.cn/dwq/2026/11-21/10735779.shtml","summary":"湾区不只是一片海湾，也是连接全球市场、产业和创新资源的重要枢纽。","summary_short":"湾区不只是一片海湾，也是连接全球市场、产业和创新资源的重要枢纽。","digest":"湾区不只是一片海湾，也是连接全球市场、产业和创新资源的重要枢纽","points":["湾区不只是一片海湾，也是连接全球市场、产业和创新资源的重要枢纽","湾区经济，是以港口为纽带、城市群为载体，以产业集聚和协同发展为支撑形成的区域经济形态","目前世界公认的四大湾区分别是美国纽约湾区、旧金山湾区、日本东京湾区，以及中国的粤港澳大湾区"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T16:58:52+08:00","size":1,"keywords":[],"body":"湾区不只是一片海湾，也是连接全球市场、产业和创新资源的重要枢纽。湾区经济，是以港口为纽带、城市群为载体，以产业集聚和协同发展为支撑形成的区域经济形态。目前世界公认的四大湾区分别是美国纽约湾区、旧金山湾区、日本东京湾区，以及中国的粤港澳大湾区。\n\n　　2026年11月18日，中方提出支持成立世界湾区经济合作联盟。从粤港澳大湾区望向世界湾区，新倡议寄托着让开放成果惠及更广阔世界的愿景：让一个个全球经济增长极彼此联通，为亚太乃至世界经济开辟新的合作空间。\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6eb2e32a49","title":"聚焦AI攻防变局 第六届新一代通信网内生安全大会12月南京举行","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735758.shtml","summary":"中新网南京11月21日电 (记者 徐珊珊)记者20日从紫金山实验室召开的新闻通气会上获悉，第六届新一代通信网内生安全学术大会暨第九届“强网”拟态防御国际精英挑战赛将于12月3日至6日在南京举办。","summary_short":"中新网南京11月21日电 (记者 徐珊珊)记者20日从紫金山实验室召开的新闻通气会上获悉…","digest":"记者20日从紫金山实验室召开的新闻通气会上获悉…","points":["中新网南京11月21日电 (记者 徐珊珊)记者20日从紫金山实验室召开的新闻通气会上获悉…","同期，还将举办IEEE CRESS2026国际会议","当前，人工智能驱动的网络攻击能力快速演进，依赖查漏补缺的传统防护思路已难以为继"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T16:45:29+08:00","size":1,"keywords":[],"body":"中新网南京11月21日电 (记者 徐珊珊)记者20日从紫金山实验室召开的新闻通气会上获悉，第六届新一代通信网内生安全学术大会暨第九届“强网”拟态防御国际精英挑战赛将于12月3日至6日在南京举办。同期，还将举办IEEE CRESS2026国际会议。\r\n\n　　当前，人工智能驱动的网络攻击能力快速演进，依赖查漏补缺的传统防护思路已难以为继。本次大会以“全面提升新一代通信网安全韧性水平”为总主题，旨在推动网络安全发展范式重构。中国工程院院士邬江兴在通气会上表示，中国原创的内生安全理论以“构造决定安全”为核心，依托动态异构冗余架构，让系统自带免疫能力，有望把安全防护提升为对抗威胁过程中持续可用的“网络韧性”。\n\n　　大会期间，紫金山实验室将集中发布一系列重磅成果。除了“新一代通信网内生安全基站”等重大创新成果，以及系列蓝皮书、专著等理论研究成果外，大会还将与上汽集团联合发布“全球首款搭载内生安全的量产车型”，推动内生安全技术从学术理念走向重大产业应用。\n\n　　作为大会重要组成部分，第九届“强网”拟态防御国际精英挑战赛备受瞩目。南京市委网信办一级调研员魏晓勇介绍，本届赛事紧扣智能化攻防趋势，最突出的变化是把大模型与自主智能体推上攻防一线。决赛将设置Pre6G小基站、天地一体内生安全、内生安全智能网联车、内生安全AI等六大赛道。赛事靶标全部取自云网、车联网、低空无人装备等真实软硬件系统，以人机协同复现未来由AI主导的攻防场景。\n\n　　本次活动坚持学术引领、国际协同、落地导向，将汇聚全球智慧，搭建“以赛促研、以赛验技、以赛聚才”的合作交流平台，集中呈现中国在新一代通信网内生安全领域的原创成果，为全球网络安全治理贡献中国智慧。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccd62321e96","title":"西藏阿里地区档案馆实现馆藏档案100%数字化","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735768.shtml","summary":"中新网拉萨11月21日电 (李林)20日，阿里地区档案馆介绍，该馆已完成全部全宗、全部门类馆藏档案数字化加工工作，实现馆藏档案数字化全覆盖。","summary_short":"中新网拉萨11月21日电 (李林)20日，阿里地区档案馆介绍，该馆已完成全部全宗、全部门类馆藏档案数字化加工工作…","digest":"20日，阿里地区档案馆介绍，该馆已完成全部全宗、全部门类馆藏档案数字化加工工作…","points":["中新网拉萨11月21日电 (李林)20日，阿里地区档案馆介绍，该馆已完成全部全宗…","此次数字化工作历时五年，覆盖文书、会计、基建、交通、企业退休人事、照片、录音录像…","累计完成纸质档案546598页，数据量3.98TB"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T16:32:32+08:00","size":1,"keywords":[],"body":"中新网拉萨11月21日电 (李林)20日，阿里地区档案馆介绍，该馆已完成全部全宗、全部门类馆藏档案数字化加工工作，实现馆藏档案数字化全覆盖。\n\n　　据悉，此次数字化工作历时五年，覆盖文书、会计、基建、交通、企业退休人事、照片、录音录像、实物等多载体档案，案卷级、文件级目录数据库与全文影像数据一一对应。累计完成纸质档案546598页，数据量3.98TB；录音档案8714分钟，0.84TB；照片档案20384张，0.73TB；录像档案395个，0.16TB；实物档案376个，0.01TB。\n\n　　阿里地区档案馆馆长赵军介绍，将以此次全覆盖为新起点，依托数字档案资源库开展开放鉴定、编研开发，深挖档案价值；常态化做好系统运维、数据校验与备份，筑牢数据安全防线；夯实数字资源底座，推进高水平数字档案馆建设，提升档案收、管、存、用数字化治理水平。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c220927af6e","title":"全球媒体聚焦丨为在变局中谋增长的亚太注入合作新动能","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735764.shtml","summary":"亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心、务实全面的《2026年亚太经合组织领导人深圳展望》(以下简称《深圳展望》)，持续引发外媒关注。","summary_short":"亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心…","digest":"亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心…","points":["亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心…","越南国情多语种对外传播网站(vietnam.vn)11月20日发表评论文章称，在本次会议上…","在全球经济充满不确定性的大背景下，这些合作方向有望为亚太地区增长注入新动能…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T16:26:28+08:00","size":1,"keywords":[],"body":"亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心、务实全面的《2026年亚太经合组织领导人深圳展望》(以下简称《深圳展望》)，持续引发外媒关注。\n\n　　越南国情多语种对外传播网站(vietnam.vn)11月20日发表评论文章称，在本次会议上，各方承诺推进经济一体化、强化供应链韧性、释放新兴技术潜力。在全球经济充满不确定性的大背景下，这些合作方向有望为亚太地区增长注入新动能，也为各成员经济体适应全球经济的深刻变革创造机遇。\n\n　　文章指出，本次会议以“建设亚太共同体，促进共同繁荣”为目标，不仅致力于解决眼前的贸易壁垒，还着力打造一个开放、富有活力且适应性强的经济格局，以应对全球变局。\n\n　　文章称，亚太地区汇聚了全球主要制造业、贸易与技术枢纽，拥有维持增长领先地位的诸多优势。但贸易保护主义抬头、地缘政治紧张局势、供应链中断，都给区域经济一体化带来严峻挑战。在此背景下，APEC21个经济体达成了《深圳展望》，重申推进区域经济一体化、维护供应链韧性，意义重大。\r\n\n　　文章援引昆山杜克大学常务副校长‌约翰·奎尔奇的观点称，《深圳展望》能够把建设亚太共同体的目标，转化为贸易、互联互通、创新等领域的实质合作。\n\n　　文章认为，持续推进亚太自贸区建设，将强化现有贸易机制之间的联动，迈向更加开放的区域经济格局。\n\n　　文章指出，经济一体化是基础，技术和创新则是塑造APEC未来增长的关键驱动力。人工智能、大数据、自动化、数字平台正在重塑生产与商业模式，技术越来越成为提高生产力与竞争力的决定性因素。亚太地区用好技术成果，就能释放大量新增长空间。\n\n　　文章表示，APEC各经济体领导人能够达成成果文件值得肯定。接下来的优先任务是把共同目标落实为具体举措，给企业和民众带来实实在在的好处，从而长期惠及整个亚太地区。\n\n　　文章最后表示，在当今动荡的世界中，加强合作不只是短期应对措施，更是亚太地区巩固自身地位、保持发展势头、迈向共同繁荣的必由之路。\n\n　　来源 | 总台环球资讯\n\n　　编译 | 单立娟 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce0b10bd22d","title":"湖北兴山：有水喝、喝好水，就是村民最踏实的幸福感","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735751.shtml","summary":"中新网宜昌11月21日电 题：湖北兴山：有水喝、喝好水，就是村民最踏实的幸福感  　　作者 张令旗  　　从宜昌市兴山县城出发，驱车约40分钟，一路穿行蜿蜒公路，进入兴山县峡口镇…","summary_short":"中新网宜昌11月21日电 题：湖北兴山：有水喝、喝好水，就是村民最踏实的幸福感  　　作者 张令旗  　　从宜昌市兴山县…","digest":"题：湖北兴山：有水喝、喝好水…","points":["从宜昌市兴山县城出发，驱车约40分钟，一路穿行蜿蜒公路，进入兴山县峡口镇…","这座全县最大的农村标准化水厂，自去年底全面完工投运以来，目前日处理水量达2000吨…","近日，水利部2026年“国之重器 民之三峡”主题活动采访团来到湖北宜昌兴山县…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T15:54:54+08:00","size":1,"keywords":[],"body":"中新网宜昌11月21日电 题：湖北兴山：有水喝、喝好水，就是村民最踏实的幸福感\n\n　　作者 张令旗\n\n　　从宜昌市兴山县城出发，驱车约40分钟，一路穿行蜿蜒公路，进入兴山县峡口镇，来到位于海拔900多米处的琚坪水厂。这座全县最大的农村标准化水厂，自去年底全面完工投运以来，目前日处理水量达2000吨，让村民彻底告别了干旱缺水、远道运水的日子。\n\n　　近日，水利部2026年“国之重器 民之三峡”主题活动采访团来到湖北宜昌兴山县，感受当地“踏实的幸福感”。\n\n　　峡口镇是三峡库区移民乡镇，长期面临水源匮乏、季节性缺水、供水不稳等难题。当地争取三峡后续专项补助资金，实施香溪河右岸峡口段农村水源建设及供水工程。项目采用“多水源+智慧水厂+高压管道”系统方案，新建了总容量4座达2万立方米的蓄水池，并对库容近10万立方米的凉棚岭水库进行系统整治，为区域供水提供了坚实保障。\n\n香溪河右岸峡口段农村水源建设及供水工程平面图。张令旗 摄\n\n　　“水厂通过‘原水-凝聚-絮凝-沉淀-过滤-消毒’工艺，引入信息化监测与控制系统，确保出厂水‘水质优、供水稳’。”兴山县水利局项目办工作人员向正虎介绍，该工程有效解决了峡口镇琚坪村、秀龙村等9个村(居委会)和12家企业共12422人的饮水问题，其中移民1778人，同时为1700亩农田提供灌溉用水。\n\n琚坪水厂。兴山县水利局供图\n\n　　山高坡陡，居住分散，农村供水工程管护曾是老大难。如何让山区群众从“有水喝”迈向“喝好水”？兴山县构建“县域统管公司专业运维+村级管水员属地协管”的分级运维模式，县级公司负责规模化水厂、主干管网的运营与大规模维修；村级管水员负责村级管网、入户水表等设施的日常巡查、小损处置、水费协收和用户诉求响应。通过“三定一签”，即定职责、定标准、定范围、签协议，压实各方责任，每一处供水设施有人管、有人护。\n\n　　“村级管水员由各村村民担任，小村一个，大村两个，凭借人熟、地熟、情况熟的优势，能够快速响应处置村民诉求。”峡口镇秀龙村书记孙龙说。\n\n　　王艳艳一家三口在2002年移民到峡口镇秀龙村。“琚坪水厂建好后，水更清了，也不存在季节性缺水的情况了，有什么问题，一个电话就有人来修了。”王艳艳感慨，“水好了，日子就过得踏实。”\n\n　　搬得出，更要稳得住、能致富。据了解，兴山县通过开发山水资源，发展乡村旅游，打造普安片区乡村振兴示范带，已经形成了普安村“茶光旅+科普研学”、琚坪村“红色文化+绿色农耕”、岩岭村“户外拓展+农旅康养”的发展模式。而琚坪水厂正在为乡村振兴注入源源不断的“水动力”。(完）\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3d3dfa984c","title":"ESG实践与传播高峰对话在杭州举办","url":"https://www.chinanews.com/gn/shipin/2026/11-21/news1075649.shtml","summary":"11月20日，新质时代ESG实践与传播高峰对话在杭州举办，活动聚焦中国式ESG本土化落地、价值转化、可信传播等主题展开研讨。","summary_short":"11月20日，新质时代ESG实践与传播高峰对话在杭州举办，活动聚焦中国式ESG本土化落地、价值转化…","digest":"11月20日，新质时代ESG实践与传播高峰对话在杭州举办…","points":["11月20日，新质时代ESG实践与传播高峰对话在杭州举办，活动聚焦中国式ESG本土化落地…","伴随着全球绿色治理规则迭代和资本市场价值导向转变，与会嘉宾认为…","当日现场同步发布长三角上市企业ESG报告、国有企业ESG报告…"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:50:24+08:00","size":1,"keywords":[],"body":"11月20日，新质时代ESG实践与传播高峰对话在杭州举办，活动聚焦中国式ESG本土化落地、价值转化、可信传播等主题展开研讨。\n\n伴随着全球绿色治理规则迭代和资本市场价值导向转变，与会嘉宾认为，ESG已不只是企业对外披露的“形象工程”，而是夯实治理底座、管控经营风险、对接全球供应链、吸引长期资本的核心要件，也是培育新质生产力、塑造长期竞争优势的重要抓手。\n\n当日现场同步发布长三角上市企业ESG报告、国有企业ESG报告、民营企业ESG报告三份研究成果，为长三角不同主体的ESG建设提供观测样本与行动参考。\n\n吴君毅 毛佳仪 浙江杭州报道","image":"","video":"https://v-oss.cnsimg.net/glob/2026/11/21/cef64746-752e-43c5-b8c2-da82752670bc.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c7f65c913c5","title":"“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动在海口启动","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735743.shtml","summary":"中新网海口11月21日电(黄嘉雯) 烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇。","summary_short":"中新网海口11月21日电(黄嘉雯) 烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇。","digest":"烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇","points":["中新网海口11月21日电(黄嘉雯) 烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇","由中央网信办网络传播局指导，海南省委宣传部、海南省委网信办、海南省委省直机关工委…","2026年是中国共产党成立105周年、中国工农红军长征胜利90周年…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T15:48:58+08:00","size":1,"keywords":[],"body":"中新网海口11月21日电(黄嘉雯) 烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇。由中央网信办网络传播局指导，海南省委宣传部、海南省委网信办、海南省委省直机关工委、海南省委党史研究室(海南省地方志办公室)、共青团海南省委等单位联合主办的“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动启动仪式，于11月20日在海南广播电视总台举行。\n\n启动仪式现场。黄嘉雯 摄\n\n　　2026年是中国共产党成立105周年、中国工农红军长征胜利90周年，也是中共琼崖第一次代表大会召开100周年、海南自贸港全岛封关运作后的首个完整年度。一百年前，中共琼崖第一次代表大会在海口召开，产生中共琼崖地方委员会，海南从此有了党的统一领导。在长期艰苦的革命斗争中，琼崖共产党人铸就了“二十三年红旗不倒”的革命奇迹，形成了“坚定信念、坚持斗争，实事求是、勇于担当，民族团结、共同奋斗”的琼崖精神，这是海南人民战胜一切艰难险阻、取得革命胜利的力量源泉。本次活动旨在深挖琼崖红色文化资源，传承“二十三年红旗不倒”革命精神，赓续红色血脉，展示海南自贸港建设成效，凝聚奋进力量。\n\n　　启动仪式以“一束红星，三条路”为主线，分为“山路”“海路”“新路”三个叙事段落，以情景式宣讲呈现。主题宣传片《红星照耀中国·从琼崖烽火到开放自贸港》以“光”为线索开场，从海口竹林村的一盏油灯、母瑞山密林的火种、渡海船头的马灯，延伸到网络辟谣平台、政策解读短视频、中国洋浦港与封关口岸的通关实景，展现同一束光从历史照进现实的历程。\n\n启动仪式现场的文艺演出。黄嘉雯 摄\n\n　　“山路”段落聚焦革命火种如何存续，由母瑞山革命纪念园终身名誉园长、89岁的王学广以《不老的红心》为题，讲述母瑞山在革命低潮时保住琼崖革命火种的历程。情景表演《红色娘子军》以女子军特务连成立为背景，呈现琼崖女性投身革命的光辉片段。“海路”段落聚焦红旗如何不倒、口岸如何打开，由冯白驹之女冯尔曾以《父辈的青春》为题，讲述冯白驹等琼崖先辈领导琼崖人民坚持“二十三年红旗不倒”的光辉历程。情景歌舞《渡海》以1950年渡海作战兵团强渡琼州海峡为背景，再现木帆船打败军舰、解放全岛的历史瞬间。\n\n　　“新路”段落一头连着网上群众路线，一头连着开放自贸港，讲述红星如何照进万家灯火。海南广播电视总台主持人徐海跃以《营商环境建设的新长征》为题，讲述跟随“营商巴士”深入企业一线，结合保税维修、水产种业等企业诉求推动问题解决，展现海南自贸港封关运作后营商环境持续优化的新气象。吴千斌同志生前同事杨树文以《守好网上群众路线建功海南自由贸易港》为题，讲述吴千斌长期奋战网信一线、打造“椰小探”辟谣IP，在亚沙会网络安全保障中坚守到生命最后一刻的事迹。歌曲《夜空中最亮的星》在杨树文讲述后响起，以“人走了，星还亮着”引发全场共鸣。海南海事局王月亮、汪庆言以《碧海青春守安澜 海事护航启新程》为题，讲述海事青年在海上搜救、防台护航、航天保障中守护蓝色疆域、接力传承的担当。海南大学自贸港新青年宣讲团成员刘璋澄《以青春赴自贸港之约》为题，讲述退役军人、海洋清洁能源团队、封关网络安全团队等青年群体守国土、攻专业、传故事的青春风采。\n\n　　启动仪式环节，嘉宾共同按下启动键。大屏海南地图上，星火从椰子寨初燃，依次点亮母瑞山、红色娘子军纪念园等革命遗址，最终延伸至海南自贸港沿海地标，形成“星火燎原”之势。\n\n　　据了解，启动仪式后，网络主题宣传活动将全面展开。活动将统筹中央重点新闻网站、省属重点网络媒体、国内外网络名人等传播力量，组建全媒体采编团队深入海南各地开展深度调研采访。采访报道紧扣红色传承、开放发展两大主线推进：组织大家深入革命旧址、纪念场馆和基层一线，深挖历史内涵，讲好红色故事；走进口岸、园区、企业和项目现场，见证海南自贸港建设的生动实践，倾听企业发展、群众生活中的真实心声；各参与主体将发挥平台优势和专业特长，创新传播表达，讲好革命文化与开放发展相融共生的海南故事，汇聚网络正能量，书写中国式现代化海南实践新篇章。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc868889d21","title":"岛内舆论高度关注特朗普不支持“台独”表态","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735733.shtml","summary":"中新网11月21日电(燕新台)美国总统特朗普在中美元首19日深圳会晤时明确表示，美国不支持“台独”。","summary_short":"中新网11月21日电(燕新台)美国总统特朗普在中美元首19日深圳会晤时明确表示，美国不支持“台独”。","digest":"美国总统特朗普在中美元首19日深圳会晤时明确表示，美国不支持“台独”","points":["中新网11月21日电(燕新台)美国总统特朗普在中美元首19日深圳会晤时明确表示…","此番涉台表述引发岛内舆论高度关注","台湾“中时新闻网”引述中国国民党副主席萧旭岑观点表示，中美在台湾议题上的共识与方向越来越清晰"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T15:36:37+08:00","size":1,"keywords":[],"body":"中新网11月21日电(燕新台)美国总统特朗普在中美元首19日深圳会晤时明确表示，美国不支持“台独”。此番涉台表述引发岛内舆论高度关注。\n\n　　台湾“中时新闻网”引述中国国民党副主席萧旭岑观点表示，中美在台湾议题上的共识与方向越来越清晰。特朗普重申不支持“台独”，对赖清德及其主导的“台独抗中”路线是一大警讯。中国国民党籍民意代表马文君则认为，美国过去虽已讲过不支持“台独”，但现在态度更为明确。\n\n　　台湾《旺报》19日评论称，特朗普5月访华结束后，在接受美国媒体专访和在专机上也曾谈到台湾问题，但与此次正式会谈提出的意义仍有所不同。\n\n　　台湾“中时新闻网”援引学者观点指出，特朗普再次表达不支持“台独”的立场，是对今年5月访华后相关表态的再次确认，且此次释出的信号更加明确，显示美国未来处理台湾问题时将更加谨慎。\r\n\n　　有岛内舆论指出，若赖清德当局误判国际形势，认为凭借高科技产业优势就能让全世界，尤其是西方国家在相关议题上选择“支持台湾”，“其实是很不现实的想法”。\n\n　　另据台湾《联合报》报道，台湾旅美学者翁履中批评，台湾现在最需要的，不是更多的政治表演，而是清楚的战略方向。\n\n　　据此前报道，特朗普在今年5月公开表示不希望看到有人搞“独立”、不想美军跋涉9500英里去打仗、不要当“台独”靠山、不轻易承诺对台军售。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c42ba3128d7","title":"“深圳展望”，为何成为APEC新的里程碑？","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735734.shtml","summary":"APEC1+1丨“深圳展望”，为何成为APEC新的里程碑？","summary_short":"APEC1+1丨“深圳展望”，为何成为APEC新的里程碑？","digest":"APEC1+1丨“深圳展望”，为何成为APEC新的里程碑","points":["11月20日，随着APEC成果文件的陆续公布，紧凑而忙碌的APEC领导人会议周正式完美收官","中国作为东道主，共推进落实75项合作成果","商务部国际贸易经济合作研究院学术委员会副主任 张建平：在深圳这次的会议上…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T15:12:20+08:00","size":1,"keywords":[],"body":"APEC1+1丨“深圳展望”，为何成为APEC新的里程碑？\n\n　　11月20日，随着APEC成果文件的陆续公布，紧凑而忙碌的APEC领导人会议周正式完美收官。中国作为东道主，共推进落实75项合作成果。 作为APEC的倡导者、推动者、先行者，中国在APEC东道主的岗位上，是如何履职的？在单边主义、保护主义甚嚣尘上的背景下，如何续写“亚太奇迹”新篇章？\n\n　　“深圳展望”被认为是今年APEC“中国年”最重要的成果，也是APEC合作新里程碑，怎样理解？\n\n　　商务部国际贸易经济合作研究院学术委员会副主任 张建平：在深圳这次的会议上，我们所构建的“四梁八柱”获得高度认可，而且有很多具体探索的方法和路径，具有可操作性。所以我觉得，过去说《2040年亚太经合组织布特拉加亚愿景》只是一个远景目标，但“深圳展望”确定了我们已经实实在在地从行动开始走向《2040年亚太经合组织布特拉加亚愿景》。\r\n\n　　为什么说亚太共同体的远景目标今年才真正启航？\n\n　　张建平：我们用了一年的时间去认真谋划和筹备，这些成果的背后体现了中国思维的战略性、系统性和综合性。用“携手搭建亚太共同体的‘四梁八柱’”让所有的亚太经济体明晰地知道在各个领域当中下一步该如何行动。通过实质性的行动落地，未来我们亚太就会有更好的未来。\n\n　　如何看待“中国是亚太经济合作的倡导者、推动者、先行者”？\n\n　　张建平：中国自加入APEC大家庭后，我们在推动贸易投资自由化、便利化，推动亚太经济社会可持续发展的每一个领域，都在积极倡导，并且在很多理念、倡议方面成为引领者。例如，我们在人工智能、在支持亚太共同体建设、亚太自贸区建设等方面都处在引领位置。\n\n　　中国靠什么把大家重新聚回到开放合作的道路上？\n\n　　张建平：中国目前是世界第二大经济体，也是第二大单一消费市场。中国现在的经济和APEC的经济体已经紧密连接在一起，彼此相互依存和依赖。我们和所有的APEC经济体只有通过坚持开放发展、坚持创新发展、追求可持续目标，才会有未来。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6df0dd6602","title":"欧洲气候基金会观察员：中国的电动汽车、光伏太阳能 让我印象深刻｜新闻会客厅","url":"https://www.chinanews.com/gn/shipin/2026/11-21/news1075646.shtml","summary":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。","summary_short":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。","digest":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行","points":["《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行","欧洲气候基金会观察员维多利亚·托马辛·哈里斯克接受中新社“新闻会客厅”记者采访时盛赞…","并表示，作为主要经济体与参与者，中国在金融与电气化方面有很大的空间加强并帮助制定议程"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:01:58+08:00","size":1,"keywords":[],"body":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。欧洲气候基金会观察员维多利亚·托马辛·哈里斯克接受中新社“新闻会客厅”记者采访时盛赞，中国的电动汽车与光伏太阳能“部署快、产量大、价格低”。并表示，作为主要经济体与参与者，中国在金融与电气化方面有很大的空间加强并帮助制定议程。","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/D72B69B03DDA46BEACFB6990BD3E5137.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c5d3e673db3","title":"中国最高检发布指导性案例 涉性侵害未成年人犯罪抗诉","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735720.shtml","summary":"中新社北京11月21日电 (记者 张素)中国最高人民检察院21日以“性侵害未成年人犯罪抗诉”为主题公开发布5件指导性案例。","summary_short":"中新社北京11月21日电 (记者 张素)中国最高人民检察院21日以“性侵害未成年人犯罪抗诉”为主题公开发布5件指导性案例…","digest":"中国最高人民检察院21日以“性侵害未成年人犯罪抗诉”为主题公开发布5件指导性案例","points":["中新社北京11月21日电 (记者 张素)中国最高人民检察院21日以“性侵害未成年人犯罪抗诉”…","其中，2件经抗诉由无罪改判有罪，3件经抗诉由轻刑改判重刑","2016年10月，某县人民法院作出一审判决，以犯强奸罪，分别判处李某家、李某义、李某斌…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T14:52:07+08:00","size":1,"keywords":[],"body":"中新社北京11月21日电 (记者 张素)中国最高人民检察院21日以“性侵害未成年人犯罪抗诉”为主题公开发布5件指导性案例。其中，2件经抗诉由无罪改判有罪，3件经抗诉由轻刑改判重刑。\n\n　　“黄某升强奸再审抗诉案”经四级检察机关接续抗诉后改判。案情显示，2015年，被害人张某(女，案发时16周岁，精神发育迟滞，无性防卫能力)先后被同村村民李某家、李某义、李某斌、黄某升强奸。\n\n　　2016年10月，某县人民法院作出一审判决，以犯强奸罪，分别判处李某家、李某义、李某斌、黄某升有期徒刑十三年、十一年、五年、五年六个月。四人均提出上诉。\n\n　　2017年10月，某市中级人民法院作出二审判决，以黄某升强奸证据不足为由改判其无罪。同年12月，某市人民检察院提请宁夏回族自治区人民检察院按照审判监督程序抗诉。\r\n\n　　2018年4月，宁夏回族自治区人民检察院向同级人民法院提出抗诉。同年6月，宁夏回族自治区高级人民法院裁定驳回抗诉，维持原判。\n\n　　2019年3月，宁夏回族自治区人民检察院提请最高人民检察院按照审判监督程序抗诉。最高人民检察院受理案件后，指派检察官赴案发地讯问原审被告人黄某升，询问被害人张某，并组织对张某精神状况和黄某升左臂伤痕进行了专家论证。\n\n　　2020年7月，最高人民检察院向最高人民法院依法提出抗诉。同年9月，最高人民法院指令甘肃省高级人民法院再审本案。\n\n　　2023年9月，甘肃省高级人民法院经开庭审理，采纳抗诉意见，改判原审被告人黄某升犯强奸罪，判处有期徒刑五年六个月。\n\n　　最高检在发布该案时指出，对精神发育迟滞未成年被害人陈述内容的审查判断，应当准确把握与其认知能力和表达能力的相当性。对性侵害未成年人犯罪案件事实的认定，应当结合证据特点综合分析、运用在案证据。\n\n　　有观察认为，这批案例彰显检察机关对性侵害未成年人犯罪的“零容忍”态度和坚决依法严厉打击惩处的坚定立场。在破解特殊未成年人陈述可采性、被害人翻证后事实认定、长期侵害心理强制评价、非接触型猥亵入罪与加重情节认定、奸淫幼女案件主观明知认定等实践难题，具有指导意义。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf933fddbbd","title":"陈盛燃：国家电网已在26个省市建立六氟化硫净化处理中心","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735715.shtml","summary":"中新网安塔利亚11月21日电(记者 魏园 陈溯)国家电网有限公司党组成员、副总经理陈盛燃近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角相关活动上表示…","summary_short":"中新网安塔利亚11月21日电(记者 魏园 陈溯)国家电网有限公司党组成员…","digest":"国家电网有限公司党组成员…","points":["国家电网有限公司党组成员、副总经理陈盛燃在《联合国气候变化框架公约》第三十一次缔约方大会(C…","陈盛燃介绍，六氟化硫用于电力行业，其温室效应是二氧化碳的两万多倍…","为减少排放，国家电网自主研发六氟化硫回收净化成套装备，推进混合气体设备改造…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T14:49:45+08:00","size":1,"keywords":[],"body":"中新网安塔利亚11月21日电(记者 魏园 陈溯)国家电网有限公司党组成员、副总经理陈盛燃近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角相关活动上表示，国家电网已在中国26个省市建立六氟化硫净化处理中心，形成“分散回收、灵活处置、统一检测、循环利用”的管理模式，推动这一高温室效应气体回收再利用。\n\n 国家电网有限公司党组成员、副总经理陈盛燃在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会上发言。记者 魏园 摄\n\n　　陈盛燃介绍，六氟化硫用于电力行业，其温室效应是二氧化碳的两万多倍，一旦泄漏将对气候造成长期影响。为减少排放，国家电网自主研发六氟化硫回收净化成套装备，推进混合气体设备改造，并研制环保型126千伏断路器等设备，推动电力设备向低氟方向发展。\n\n　　在市场机制方面，他表示，国家电网制定了六氟化硫自愿减排方法学，运用市场化机制激励企业主动控排。\n\n　　陈盛燃还介绍，截至今年9月底，中国发电装机达到41.3亿千瓦，其中非化石能源装机25.9亿千瓦，占比62.6%；风电、太阳能发电累计装机20.1亿千瓦。\n\n　　他表示，实现《巴黎协定》温控目标，既要扩大清洁能源规模、削减二氧化碳排放，也要同步推进非二氧化碳温室气体治理。国家电网愿与各方深化技术交流、标准互认和项目合作，探索低成本、规模化的减排方案。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb015d70328","title":"李军：中国油气企业甲烷控排联盟成员已达10家","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735714.shtml","summary":"中新网安塔利亚11月21日电(记者 魏园 陈溯)国务院国资委社会责任局局长李军近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角相关活动上通过视频致辞表示…","summary_short":"中新网安塔利亚11月21日电(记者 魏园 陈溯)国务院国资委社会责任局局长李军近日在《联合国气候变化框架公约》第三十一次…","digest":"国务院国资委社会责任局局长李军近日在《联合国气候变化框架公约》第三十一次缔约方大会(…","points":["国务院国资委社会责任局局长李军在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)…","李军介绍，联盟围绕伴生气回收、常规火炬削减、泄漏检测与修复等重点方向持续推进…","煤炭企业则积极开展煤矿瓦斯治理与利用，推进瓦斯抽采利用、低浓度瓦斯氧化蓄热和乏风余热回收…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T14:49:29+08:00","size":1,"keywords":[],"body":"中新网安塔利亚11月21日电(记者 魏园 陈溯)国务院国资委社会责任局局长李军近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角相关活动上通过视频致辞表示，中国石油等油气企业发起的中国油气企业甲烷控排联盟，成员企业已发展至10家。\n\n 国务院国资委社会责任局局长李军在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角相关活动上通过视频致辞。记者 魏园 摄\n\n　　李军介绍，联盟围绕伴生气回收、常规火炬削减、泄漏检测与修复等重点方向持续推进，为油气全产业链甲烷减排作出积极贡献。煤炭企业则积极开展煤矿瓦斯治理与利用，推进瓦斯抽采利用、低浓度瓦斯氧化蓄热和乏风余热回收，提升甲烷资源化利用效能。\n\n　　他表示，甲烷管控兼具应对气候变化、保障能源安全和提高资源利用效率的综合效应。近年来，中央企业按照中国甲烷排放控制行动方案等部署，积极探索甲烷减排。\n\n　　李军还介绍，国务院国资委推动绿色低碳发展理念融入企业战略规划、投资决策和生产经营，发布中央企业绿色低碳供应链建设指引，引导企业将绿色低碳理念融入供应链管理全过程，带动上下游企业协同转型。\n\n　　李军表示，下一步将按照“十五五”规划部署，推动中央企业继续在实现碳达峰、碳中和目标中发挥示范作用，同时加强与各国的多形式、多领域务实合作。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdbd3d79f62","title":"中国石油：甲烷排放强度较2019年下降50%，如期实现既定目标","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735713.shtml","summary":"中新网安塔利亚11月21日电(记者 魏园 陈溯)中国石油天然气集团有限公司党组成员、副总经理宋大勇近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会上表示，截至2025年底…","summary_short":"中新网安塔利亚11月21日电(记者 魏园 陈溯)中国石油天然气集团有限公司党组成员…","digest":"中国石油天然气集团有限公司党组成员…","points":["中国石油天然气集团有限公司党组成员、副总经理宋大勇在《联合国气候变化框架公约》第三十一次缔约…","宋大勇说，油气企业控制甲烷等非二氧化碳温室气体排放，不仅能产生直接的气候效益…","2021年，在生态环境部指导下，企业牵头开展油气行业甲烷监测试点，验证不同监测方法的适用性…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T14:47:49+08:00","size":1,"keywords":[],"body":"中新网安塔利亚11月21日电(记者 魏园 陈溯)中国石油天然气集团有限公司党组成员、副总经理宋大勇近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会上表示，截至2025年底，中国石油甲烷排放强度较2019年下降50%，如期实现既定目标。\n\n 中国石油天然气集团有限公司党组成员、副总经理宋大勇在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会上发言。记者 魏园 摄\n\n　　宋大勇说，油气企业控制甲烷等非二氧化碳温室气体排放，不仅能产生直接的气候效益，还可减少资源浪费、提高运营效率、降低现场安全风险。中国石油围绕全过程管控、监测报告核查体系建设、国内国际合作三个方面推进甲烷控排。\n\n　　在监测方面，中国石油建成甲烷排放数据信息化管理平台。2021年，在生态环境部指导下，企业牵头开展油气行业甲烷监测试点，验证不同监测方法的适用性，相关成果已转化为国家标准。其牵头形成的四类中国本地化油气生产甲烷排放因子，已纳入国家温室气体排放因子数据库。\n\n　　在行业合作方面，中国石油于2021年牵头发起成立中国油气企业甲烷控排联盟。今年9月，企业牵头举办非二氧化碳温室气体减排路径与协同治理能力建设研讨班，吸引16个国家22名能源环境专家参加。\n\n　　宋大勇表示，甲烷控排并非在能源保供和减排之间作取舍，而是通过技术进步和管理提升，让能源供应更加高效、绿色、可持续。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3fb3d88fac","title":"张建新：北京排水集团利用污泥沼气年发电8000万千瓦时","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735711.shtml","summary":"中新网安塔利亚11月21日电 (记者 魏园 陈溯)北京城市排水集团党委书记、董事长张建新近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会上介绍…","summary_short":"中新网安塔利亚11月21日电 (记者 魏园 陈溯)北京城市排水集团党委书记…","digest":"北京城市排水集团党委书记…","points":["中新网安塔利亚11月21日电 (记者 魏园 陈溯)北京城市排水集团党委书记…","处理后的污泥产品还用于矿山修复和园林绿化","张建新说，排水行业点多面广，排放分散、波动大"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T14:46:21+08:00","size":1,"keywords":[],"body":"中新网安塔利亚11月21日电 (记者 魏园 陈溯)北京城市排水集团党委书记、董事长张建新近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会上介绍，集团处理污泥年产沼气8000万立方米，其中一部分送入锅炉，替代天然气为污泥热水解供热，其余用于发电，年发电量达8000万千瓦时。处理后的污泥产品还用于矿山修复和园林绿化。\n\n 北京城市排水集团党委书记、董事长张建新在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会上发言。记者 魏园 摄\n\n　　此次边会聚焦甲烷、氧化亚氮等非二氧化碳温室气体控排。张建新说，排水行业点多面广，排放分散、波动大。为摸清排放底数，集团建起覆盖地下管网和污水处理厂的监测网络，采用地面通量监测、移动走航巡检等手段，建立了本地化排放因子，并参与国家和地方温室气体核算标准编制。\n\n　　据他介绍，管道中沉积的污泥厌氧发酵会产生甲烷。集团定期养护管网，对管网和污水厂实行联合调度，降低污水滞留带来的甲烷排放风险。污水厂则通过调控运行参数，抑制氧化亚氮的生成。\n\n　　张建新表示，集团的目标是到2050年实现近零碳排放。“十五五”期间，集团将进一步研究温室气体的产生机理和排放路径，探索经济高效、可在行业推广的控排办法。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c52733f41","title":"王志华：49个新增火电项目环评挖掘每年170万吨二氧化碳减排量","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735712.shtml","summary":"中新网安塔利亚11月21日电(记者 魏园 陈溯)生态环境部环境影响评价与排放管理司司长王志华，近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角介绍…","summary_short":"中新网安塔利亚11月21日电(记者 魏园 陈溯)生态环境部环境影响评价与排放管理司司长王志华…","digest":"生态环境部环境影响评价与排放管理司司长王志华…","points":["中新网安塔利亚11月21日电(记者 魏园 陈溯)生态环境部环境影响评价与排放管理司司长王志华…","其披露的数据显示，49个新增火电项目经相关措施比选，挖掘出每年约170万吨二氧化碳减排潜力","王志华在题为《中国温室气体排放生态环境影响评价的探索与实践》的发言中表示…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T14:44:45+08:00","size":1,"keywords":[],"body":"中新网安塔利亚11月21日电(记者 魏园 陈溯)生态环境部环境影响评价与排放管理司司长王志华，近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角介绍，中国通过将温室气体排放纳入建设项目环境影响评价，推动减污降碳协同。其披露的数据显示，49个新增火电项目经相关措施比选，挖掘出每年约170万吨二氧化碳减排潜力。\n\n 生态环境部环境影响评价与排放管理司司长王志华在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会发言。记者 魏园 摄\n\n　　王志华在题为《中国温室气体排放生态环境影响评价的探索与实践》的发言中表示，中国自2021年起系统推进温室气体排放环评工作，从试点探索逐步形成制度框架，覆盖二氧化碳及甲烷等非二氧化碳温室气体。\n\n　　他介绍，中国在火电、钢铁、建材、有色、石化、化工等重点行业及产业园区开展试点，并推动温室气体排放环评与碳排放权交易等制度在核算、数据和评价环节衔接。\n\n　　除火电项目外，他举例说，一家煤化工项目通过优化工艺、配置二氧化碳捕集利用等措施，每年可减少约160万吨二氧化碳排放。钢铁、煤化工等行业也在探索通过技术改造实现减排。\n\n　　王志华表示，下一步将完善重点行业环评技术规范和评价指标，逐步扩大覆盖范围，推动减排要求落实到具体项目、工艺、装备和运行管理，并加强与排污许可等环境管理制度的衔接。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c085bddf206","title":"纳入“国家行动计划”，中国在农业甲烷治理方面取得积极进展","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735710.shtml","summary":"中新网安塔利亚11月21日电(记者 魏园 陈溯)“中国已经展现出切实的引领作用。","summary_short":"中新网安塔利亚11月21日电(记者 魏园 陈溯)“中国已经展现出切实的引领作用。","digest":"“中国已经展现出切实的引领作用","points":["中新网安塔利亚11月21日电(记者 魏园 陈溯)“中国已经展现出切实的引领作用","”全球甲烷中心拉丁美洲区域主管亨里克·贝泽拉近日在《联合国气候变化框架公约》第三十一次缔约方…","贝泽拉指出，中国奶业在生产效率提高的同时，单位产品排放强度已降至低于多项国际基准的水平"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T14:42:58+08:00","size":1,"keywords":[],"body":"中新网安塔利亚11月21日电(记者 魏园 陈溯)“中国已经展现出切实的引领作用。”全球甲烷中心拉丁美洲区域主管亨里克·贝泽拉近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角主题边会上表示，中国将甲烷减排纳入国家行动计划，在农业甲烷治理方面取得积极进展。\n\n 全球甲烷中心拉丁美洲区域主管亨里克·贝泽拉在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会发言。记者 魏园 摄\n\n　　贝泽拉指出，中国奶业在生产效率提高的同时，单位产品排放强度已降至低于多项国际基准的水平；生猪和奶牛养殖粪污处理，也取得实际成效。全球甲烷中心认可中方相关进展，并将支持中国持续推广有关经验。\n\n　　他指出，中国在农业领域开展的工作不仅惠及本国，也会对全球产生积极影响。\n\n　　贝泽拉介绍，农业约占全球人为甲烷排放的40%。随着全球蛋白质需求增长，关键不是要不要增加产量，而是如何降低每公斤牛奶、肉类和稻米生产的甲烷排放。他援引中国合作研究人员在《自然·食品》发表的研究称，到2030年，中国约三分之一的畜牧业甲烷排放有望以较低成本实现减排。全球甲烷中心愿继续与中国科研机构和行业伙伴合作，推动肉牛及水稻领域的标准建设、监测核查和试点实践。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd5994bb330","title":"“棕色黄金”如何变废为宝？英国学者：中国在相关领域发挥引领作用","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735709.shtml","summary":"中新网安塔利亚11月21日电 (记者 魏园 陈溯)英国哈珀亚当斯大学副校长、可持续畜牧系统教授迈克尔·李近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角活动上表示…","summary_short":"中新网安塔利亚11月21日电 (记者 魏园 陈溯)英国哈珀亚当斯大学副校长…","digest":"英国哈珀亚当斯大学副校长…","points":["英国哈珀亚当斯大学副校长、可持续畜牧系统教授迈克尔·李在《联合国气候变化框架公约》第三十一次…","李同时担任联合国粮农组织畜牧业环境评估与绩效伙伴关系(LEAP)技术顾问","他介绍，畜牧业减排不仅需要新技术，还需要充分的实证数据和荟萃分析…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T14:41:06+08:00","size":1,"keywords":[],"body":"中新网安塔利亚11月21日电 (记者 魏园 陈溯)英国哈珀亚当斯大学副校长、可持续畜牧系统教授迈克尔·李近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角活动上表示，中国在畜禽粪污甲烷捕集和资源化利用领域开展了出色工作，并发挥了引领作用。\n\n 英国哈珀亚当斯大学副校长、可持续畜牧系统教授迈克尔·李在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会发言。记者 魏园 摄\n\n　　李同时担任联合国粮农组织畜牧业环境评估与绩效伙伴关系(LEAP)技术顾问。他介绍，畜牧业减排不仅需要新技术，还需要充分的实证数据和荟萃分析，为国家温室气体清单编制提供依据，使农场层面的减排成效能够体现在国家核算体系中，为各国国家自主贡献(NDC)目标的落实提供支持。\n\n　　他表示，在降低甲烷排放方面，可通过调整反刍动物饲料、选育具有低甲烷排放性状的牛羊等措施减少排放；在减少氧化亚氮排放方面，豆科植物固氮和抑制剂应用有助于降低对化学肥料的依赖及相关排放。然而，各项措施要进入国家核算体系，还需要在不同饲养条件和农场模式下积累可靠证据。\n\n　　对于粪污治理，李将畜禽粪污称为“棕色黄金”，认为其不只能被看作潜在污染源，而是可以成为氮、磷等养分和可再生能源的来源。他提出，应推动甲烷捕集、粪污处理和生物精炼等技术应用，将甲烷从污染物转化为能源。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c368b4d36ce","title":"全球甲烷中心首席执行官：近零甲烷标准可使油气业甲烷排放降约八成","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735708.shtml","summary":"中新网安塔利亚11月21日电(记者 魏园 陈溯)全球甲烷中心(Global Methane Hub)首席执行官马塞洛·梅纳(Marcelo Mena)近日在《联合国气候变化框架公约》第三十一次缔约方大…","summary_short":"中新网安塔利亚11月21日电(记者 魏园 陈溯)全球甲烷中心(Global Methane Hub)首席执行官马塞洛·梅…","digest":"全球甲烷中心(Global Methane Hub)首席执行官马塞洛·梅纳(Marc…","points":["全球甲烷中心(Global Methane Hub)首席执行官马塞洛·梅纳(Marcelo…","他援引评估称，相关减排措施的收益成本比可达约15比1","他介绍，越来越多国家承诺削减甲烷排放，但即便承诺措施全部落实…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T14:20:07+08:00","size":1,"keywords":[],"body":"中新网安塔利亚11月21日电(记者 魏园 陈溯)全球甲烷中心(Global Methane Hub)首席执行官马塞洛·梅纳(Marcelo Mena)近日在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会上表示，如果推动近零甲烷排放标准，并将包括中国在内的更多市场纳入适用范围，油气行业甲烷排放有望减少约80%，仅此一项措施便可能使全球升温幅度降低约0.1摄氏度。\n\n 全球甲烷中心(Global Methane Hub)首席执行官马塞洛·梅纳(Marcelo Mena)在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角边会发言。记者 魏园 摄\n\n　　他说，如果不只是比较减排成本，而是将近期降温带来的经济收益纳入考量，甲烷等短寿命气候污染物的减排优先级将提高。他援引评估称，相关减排措施的收益成本比可达约15比1。\n\n　　他介绍，越来越多国家承诺削减甲烷排放，但即便承诺措施全部落实，到2030年预计带来的甲烷减排幅度，将约为11%。他认为，中国已制定甲烷排放控制行动方案，仍有进一步挖掘减排潜力的空间。\n\n　　梅纳还指出，天然气等能源产品的气候影响，与上游生产环节的甲烷泄漏密切相关。卫星监测技术正在帮助识别具体排放源，追踪运营商及能源供应链。他以哈萨克斯坦探索利用卫星数据管理甲烷放空和火炬燃烧排放为例，呼吁以标准、监测和国际合作等方面工作加速减排进程。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1c2c552416","title":"順豐速運及八馬茶業涉嫌違規 遭軍方叫停採購資格","url":"https://www.stheadline.com/realtime-china/3639584/順豐速運及八馬茶業涉嫌違規-遭軍方叫停採購資格","summary":"內地物流龍頭順豐速運及知名茶企「八馬茶業」被指存在違規問題，軍方近日發出公告，暫停兩間企業參加全軍物資、工程及服務的採購活動。","summary_short":"內地物流龍頭順豐速運及知名茶企「八馬茶業」被指存在違規問題，軍方近日發出公告，暫停兩間企業參加全軍物資…","digest":"內地物流龍頭順豐速運及知名茶企「八馬茶業」被指存在違規問題，軍方近日發出公告…","points":["內地物流龍頭順豐速運及知名茶企「八馬茶業」被指存在違規問題，軍方近日發出公告…","軍隊採購網於11月19日發布《知情告知書公告（順豐速運有限公司）》","公告指出，根據有關部門通報，順豐速運有限公司因涉嫌存在違規問題，被暫停參加全軍物資…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:05:18+08:00","size":1,"keywords":[],"body":"內地物流龍頭順豐速運及知名茶企「八馬茶業」被指存在違規問題，軍方近日發出公告，暫停兩間企業參加全軍物資、工程及服務的採購活動。\n均未披露處罰期限\n軍隊採購網於11月19日發布《知情告知書公告（順豐速運有限公司）》。公告指出，根據有關部門通報，順豐速運有限公司因涉嫌存在違規問題，被暫停參加全軍物資、工程及服務採購活動，告知單位為中央軍委後勤保障部採購服務中心。不過，公告並未披露其涉嫌違規的具體事項及暫停期限。\n同日，軍隊採購網亦發布《知情告知書公告（八馬茶業股份有限公司）》。公告顯示，根據有關部門通報，八馬茶業股份有限公司同樣因涉嫌存在違規問題，被暫停參加全軍物資、工程及服務採購活動，告知單位亦為中央軍委後勤保障部採購服務中心。該公告所列項目編號為「無」，同樣未有披露具體違規事項及處罰期限。\n順豐速運有限公司為內地主要物流企業，此前具備參與全軍物資、工程及服務採購相關項目的資格，但在本次處置生效期間，該公司將不得參與全軍範圍內上述品類的採購活動。據順豐控股2026年半年報顯示，順豐速運註冊資本為10億元（人民幣，下同），主要從事國際貨運代理、國內及國際快遞服務等業務；而順豐控股2026年前三季度實現營業收入2,377.27億元，按年增長5.53%。\n至於八馬茶業（港交所：6980）則主要從事茶葉及相關產品銷售，並於2025年10月28日在港交所主板掛牌上市，當時發行價為每股50港元。根據八馬茶業2026年中期報告，公司今年上半年實現營業收入約14.02億元人民幣，按年增長31.8%，期內利潤約為1.98億元，按年大增64.8%。截至今年6月底，該公司在全國共有3,845家線下門店，當中包括226家直營店及3,619家加盟店。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5dadf09201","title":"两届香港马王“浪漫勇士”退役","url":"https://www.chinanews.com.cn/dwq/2026/11-21/10735719.shtml","summary":"中新社香港11月21日电 (记者 赵静怡)全球赛马史上累计奖金最多赛驹、两届当选香港马王的“浪漫勇士”，日前宣布告别赛场，将离港前往澳大利亚“享受”退休生活。","summary_short":"中新社香港11月21日电 (记者 赵静怡)全球赛马史上累计奖金最多赛驹、两届当选香港马王的“浪漫勇士”…","digest":"全球赛马史上累计奖金最多赛驹、两届当选香港马王的“浪漫勇士”，日前宣布告别赛场…","points":["中新社香港11月21日电 (记者 赵静怡)全球赛马史上累计奖金最多赛驹…","11月19日，马主刘栢辉、练马师沈集成与“浪漫勇士”在香港沙田马房合影","2021年出道的“浪漫勇士”在31场比赛中夺得24次冠军、5次亚军，累计15项一级赛冠军…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:58:54+08:00","size":1,"keywords":[],"body":"中新社香港11月21日电 (记者 赵静怡)全球赛马史上累计奖金最多赛驹、两届当选香港马王的“浪漫勇士”，日前宣布告别赛场，将离港前往澳大利亚“享受”退休生活。“浪漫勇士”近日亮相香港沙田，马主刘栢辉、练马师沈集成也同日现身马房，接受中新社等媒体采访。\n\n11月19日，马主刘栢辉、练马师沈集成与“浪漫勇士”在香港沙田马房合影。　中新社记者 陈永诺 摄\n\n　　2021年出道的“浪漫勇士”在31场比赛中夺得24次冠军、5次亚军，累计15项一级赛冠军，所得奖金逾2.88亿港元；它多次远征海外，是香港首匹在澳大利亚、日本、迪拜及中国香港四地赢得一级赛的马驹。\n\n　　回看漫漫征途，日本安田纪念赛是刘栢辉记忆最深刻的一战。当日大雨倾盆，数百名香港马迷身披雨衣到场助威，18匹同场角逐的赛驹中，16匹为东道主赛驹。“浪漫勇士”在比赛中被对手层层围困，最终抓住空隙冲刺，顺利夺魁，扬威日本。刘栢辉用两个字定义“浪漫勇士”：伟大。“奖金与纪录固然重要，但“浪漫勇士”真正的价值，是将香港赛马推向世界赛马的核心舞台”。\n\n11月19日，“浪漫勇士”亮相香港沙田马房。　中新社记者 陈永诺 摄\n\n　　沈集成表示，能够培养出“浪漫勇士”，他深感骄傲。这不仅因为它的过人成就，更因它对外彰显了香港在国际赛马领域的领先地位。\n\n　　沈集成介绍，“浪漫勇士”在马房很亲人，在赛场上却充满斗志，不肯认输。刘栢辉也坦言，初见“浪漫勇士”时只觉它性情温和，完全想不到它在赛场上会如此霸气，更未想到它能取得如此成就。\n\n　　辉煌的战绩背后，伤病也一直困扰着“浪漫勇士”。去年5月，它接受手术治疗，暂别赛场。然而，它的坚韧超出众人期待，康复之后再度称霸赛场，一年之内拿下6场胜利，斩获香港“三冠王”殊荣。\n\n11月19日，练马师沈集成在香港沙田马房亲吻“浪漫勇士”。　中新社记者 陈永诺 摄\n\n　　按照计划，香港赛马会将于11月22日在沙田马场为“浪漫勇士”举行荣休欢送仪式；12月13日，“浪漫勇士”将完成最后一次在港公开亮相，之后前往澳大利亚悉尼一处牧场“享受”退休生活。\n\n　　“对它退役，百分百是舍不得。”沈集成一边为它终于卸下比赛重担得以休养而欣慰，一边又遗憾再也不能和这匹爱驹一同征战赛场。沈集成此前专程飞赴澳大利亚，仔细确认马房、安保、饲料等细节，特意叮嘱牧场人员，要多准备它爱吃的红萝卜、定期传回它的视频。\n\n　　每天晨操结束，沈集成总会问它开不开心，而“浪漫勇士”则会主动探头贴近、与他亲昵相拥。沈集成说，会一直牵挂这匹香港马王。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2db2afa29e","title":"纪录片《胶林家书》全国首映 家书串起湘滇支边记忆","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735706.shtml","summary":"中新网衡阳11月21日电 (李勇 李嘉仪)大型纪录片《胶林家书》全国首映仪式20日在湖南衡阳祁东县举行。","summary_short":"中新网衡阳11月21日电 (李勇 李嘉仪)大型纪录片《胶林家书》全国首映仪式20日在湖南衡阳祁东县举行。","digest":"大型纪录片《胶林家书》全国首映仪式20日在湖南衡阳祁东县举行","points":["中新网衡阳11月21日电 (李勇 李嘉仪)大型纪录片《胶林家书》全国首映仪式20日在湖南衡阳…","影片以支边亲历者口述和家书为线索，讲述二十世纪五六十年代湖南儿女远赴云南边疆垦荒植胶的故事","影片由潇影集团第二影业有限公司、兰花草(湖南)文化传播有限公司…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:46:05+08:00","size":1,"keywords":[],"body":"中新网衡阳11月21日电 (李勇 李嘉仪)大型纪录片《胶林家书》全国首映仪式20日在湖南衡阳祁东县举行。影片以支边亲历者口述和家书为线索，讲述二十世纪五六十年代湖南儿女远赴云南边疆垦荒植胶的故事。\n\n11月20日，大型纪录片《胶林家书》全国首映仪式在湖南祁东县举行。曾炜煜 摄\n\n　　祁东是影片核心故事原型群体的故乡。60多年前，1.6万余名祁东儿女响应国家号召，离开家乡奔赴云南边陲，与来自醴陵、祁阳等地的支边人员一道，在艰苦条件下开荒种胶，为中国天然橡胶事业和边疆建设作出贡献。\n\n　　影片由潇影集团第二影业有限公司、兰花草(湖南)文化传播有限公司、湖南牧马人旅游文化传播有限公司联合摄制，历时七年打磨。主创团队辗转云南西双版纳、湖南祁东等地寻访，以90岁支边亲历者朱忠恒的口述回忆为主线，通过十五封家书串联全片，融合亲历者口述、旧址实拍、实物史料和适度情景再现，还原支边人员扎根边疆、建设家园的岁月。\n\n　　一封封往返于云南胶林与湖南故乡的家书，记录着支边人员初到边疆时搭茅棚、战荒岭的艰辛，也寄托着他们对故土亲人的牵挂。镜头中的胶林和旧址，连接起当年的青春记忆与几代人的家国情怀。\n\n　　“家书是当事人的亲身经历，也是鲜活的口述史料，真实反映了当时的生活；同时两地书，能够更好地传递情感。”影片导演张五洲说，寻访和拍摄让主创团队更加体会到老一辈支边人员面临的艰辛，他们自强不息、吃苦耐劳的精神值得传承。\n\n　　当天，影片主创团队、支边老兵及亲属代表和祁东县师生代表共同观看影片。“最打动我的是老一辈人告别家乡、奔赴边疆的片段。”学生周沛东观影后说，他们背井离乡、克服困难，完成国家交给的任务，让自己感受到了那一代人青春的重量。\n\n　　从湘江之畔到云南胶林，一代支边人将青春和汗水留在边疆。如今，《胶林家书》以影像重温这段历史，让他们的奋斗故事被更多人看见。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9c4c26e228","title":"民盟黑龙江省委会：盟地共建助振兴 接力奔跑开新局","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735700.shtml","summary":"中新网绥化11月21日电 题：民盟黑龙江省委会：盟地共建助振兴接力奔跑开新局  　　作者 史轶夫 崔钟元  　　初冬的海伦大地，黑土沃野静卧，田垄间留存着秋收后的痕迹。","summary_short":"中新网绥化11月21日电 题：民盟黑龙江省委会：盟地共建助振兴接力奔跑开新局  　　作者 史轶夫 崔钟元  　　初冬的海…","digest":"题：民盟黑龙江省委会：盟地共建助振兴接力奔跑开新局  　　作者 史轶夫 崔钟元…","points":["初冬的海伦大地，黑土沃野静卧，田垄间留存着秋收后的痕迹","民盟黑龙江省委会与中共绥化市委、海伦市委联合开展的“盟地共建(绥化·海伦)”项目…","20世纪80年代，以民盟盟员为骨干的科研团队进驻海伦市光荣村，把实验室安在旷野…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:38:57+08:00","size":1,"keywords":[],"body":"中新网绥化11月21日电 题：民盟黑龙江省委会：盟地共建助振兴接力奔跑开新局\n\n　　作者 史轶夫 崔钟元\n\n　　初冬的海伦大地，黑土沃野静卧，田垄间留存着秋收后的痕迹。在这片寒地黑土核心区，一场党盟同心、汇聚智力资源的共建实践正徐徐铺展。民盟黑龙江省委会与中共绥化市委、海伦市委联合开展的“盟地共建(绥化·海伦)”项目，将参政党的人才智库资源引向田间地头，以同心实干为龙江乡村振兴注入新动能。\n\n　　海伦是国家重要商品粮基地，黑土地保护、现代农业升级的需求迫切。这片土地本就藏着一段持续数十年的同心佳话。20世纪80年代，以民盟盟员为骨干的科研团队进驻海伦市光荣村，把实验室安在旷野，把论文写在大地。民盟盟员专家张兴义被当地民众唤作黑土地的“缝补匠”，带领团队治理侵蚀沟300余条，修复沟毁耕地约3500亩，让曾经沟壑破碎的土地重焕生机。数十年科研深耕，为民盟与海伦的新一轮深度共建埋下伏笔。\n\n黑龙江省政协副主席、民盟省委会主委钱福永(左二)带队赴绥化市走访调研。　民盟黑龙江省委会供图\n\n　　“不是一次性送几场义诊、开展几次短期讲学，而是要建立长效机制，把盟内智力资源扎根基层。”黑龙江省政协副主席、民盟黑龙江省委会主委钱福永道出盟地共建的初衷。此前民盟省委会的社会服务虽广受好评，但也存在服务零散、成效碎片化的短板。赴四川遂宁考察“盟遂合作”之后，班子成员达成共识：跳出零星帮扶旧路径，打造适配龙江大地的参政党社会服务品牌。\n\n　　经过多轮实地调研、供需对接，试点最终落子绥化海伦。这里既有扎实的多党合作基础，也有黑土地保护、现代农业发展的现实需求，地方所需与民盟界别优势高度契合。工作组走遍海伦乡村校园、乡镇诊室、田间地头，梳理形成需求、资源、项目三张清单，敲定黑土地保护、现代农业、基础教育、基层医疗、文旅科普五大板块，共设置25个实体化落地项目。\n\n　　“盟地共建(绥化·海伦)”启动仪式上，智库专家受聘驻场，一批共建项目集中签约，黑土文旅展馆建设、教育公益捐赠、农业科技小院打造、现代化大农业提质增效、基层医疗基地共建五大实体项目同步启动。\n\n民盟黑龙江省委会与绥化市委盟地共建(绥化·海伦)工作启动会议召开。　民盟黑龙江省委会供图\n\n　　“我们要把科研成果变成农民手中实实在在的丰收。”民盟中国科学院东北地理与生态研究所支部原主委张兴义介绍，盟内专家团队聚焦黑土修复、耕地提质、大豆良种繁育方向持续攻关，依托海伦调研基地，一边扎根田野开展试验，一边收集基层声音形成参政议政成果，守护国家粮食安全。\n\n　　与此同时，全省各级盟组织同步奔赴海伦。农业专家手把手传授技术，打通科技兴农“最后一公里”；医疗专家走进当地医院开展义诊、临床带教；公益力量落地乡村校园，优质教育资源持续下沉。民盟还牵线搭建对外交流桥梁，助力海伦粮油企业拓宽农产品出海渠道。\n\n　　从几十年前扎根光荣村的科研接力，到如今盟地共建全面铺开，这是新时代多党合作制度在黑土地上的生动实践。\n\n　　“从借鉴先进经验到立足本土创新，从顶层谋篇布局到基层落地见效，正是新时代多党合作履职实践在龙江大地上的一场生动接力、一次务实作答。”黑龙江省政协副主席、民盟黑龙江省委会主委钱福永表示，将持续秉持“出主意、想办法，做好事、做实事”的作风，不图虚功、务求实效，持续释放智力资源优势，把统一战线优势转化为发展实效。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce05a9e1921","title":"江苏扬州“绿扬金凤”人才周开幕：以满满诚意，邀天下英才“追梦”","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735692.shtml","summary":"中新网扬州11月21日电 (崔佳明 徐珊珊)“人才，因城市而聚；城市，因人才而兴。","summary_short":"中新网扬州11月21日电 (崔佳明 徐珊珊)“人才，因城市而聚；城市，因人才而兴。","digest":"“人才，因城市而聚；城市，因人才而兴","points":["中新网扬州11月21日电 (崔佳明 徐珊珊)“人才，因城市而聚","”11月21日上午，2026年第四届“绿扬金凤”人才周总活动在扬州会议中心正式启幕","24个产才项目集中签约、3亿元创投基金重磅发布……这场人才盛会以满满诚意…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T13:32:23+08:00","size":1,"keywords":[],"body":"中新网扬州11月21日电 (崔佳明 徐珊珊)“人才，因城市而聚；城市，因人才而兴。”11月21日上午，2026年第四届“绿扬金凤”人才周总活动在扬州会议中心正式启幕。中共扬州市委书记郑海涛在致辞中诚邀各方英才了解扬州、选择扬州、扎根扬州。24个产才项目集中签约、3亿元创投基金重磅发布……这场人才盛会以满满诚意，向天下英才发出“追梦来扬”的城市邀约。\n\n11月21日上午，2026第四届“绿扬金凤”人才周启幕。与会嘉宾齐聚扬州会议中心，共赴这场“追梦来扬”的城市之约。董辉 摄\n\n　　扬州地处长三角核心区，是沿沪宁产业创新带重要节点、长江经济带与大运河文化带交汇点。把“好地方”建设好，产业是根基，人才是支撑。本次活动紧紧围绕扬州“613”先进制造业体系，坚持“精准高效、务实节约、开放合作”的原则，聚焦创业人才、技能人才、青年人才，推出“1+18+9”系列活动，旨在将投资于人的城市承诺转化为引才聚才的生动实践。\n\n　　人才竞争，表面拼的是政策力度，深层拼的是机制活力。在总活动现场，扬州以极大的诚意释放改革红利：发布《人力资源服务业高质量发展三年行动方案(2027—2029年)》，为人才发展提供更加暖心服务；同时正式发布规模达3亿元的扬州“绿扬金凤”人才创业发展投资基金(筹)，以金融活水“投早投小、投硬科技”，精准支持人才创业项目落地发展。\n\n　　激发企业用才，关键是让企业从“台下看”变成“台上唱”。大会现场，分创业项目、创新项目、平台合作、人力资源机构4个类别，共完成了24个项目的集中签约，彰显了扬州深化产才融合的丰硕成果。与此同时，扬州正全面下放人才计划举荐权和人才评价自主权，真正做到“是不是人才，用人主体说了算”，让好企业成为聚才的“强磁场”。\n\n　　在平台建设与生态营造方面，活动现场举行了产业科创生态共建伙伴颁证仪式，进一步拓宽了扬州国际化、专业化引才网络。除总活动外，本届人才周还精心策划了18场主题活动和9场板块特色产才对接活动，市县联动形成招才引智的强大合力。\n\n　　如何让人才的“关键变量”转化为发展的“最大增量”？近年来，扬州全面实施人才强市战略，致力于把体制机制改到点子上、把服务做到人才心坎里。线上构建数字化人才服务体系，线下打造人才客厅、人才公园和27家OPC生态社区等实体阵地。“十四五”期间，扬州全市累计新增就业创业大学生超12.7万人，2025年新增就业大学生人数占城镇新增就业人数比重位居全省第一。扬州正以最优良的生态，让“好人才”点亮“好地方”，在“好地方”成就“好人才”。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5f6d51c35c","title":"苏锡常欧美同学会聚智联动 共探未来产业新赛道","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735695.shtml","summary":"中新网无锡11月21日电 (孙权 唐娟)11月20日，“海创未来·智聚梁溪”苏锡常欧美同学会产业联动(第6期)未来产业主题无锡站活动在江苏无锡举行。","summary_short":"中新网无锡11月21日电 (孙权 唐娟)11月20日，“海创未来·智聚梁溪”苏锡常欧美同学会产业联动(第6期)未来产业主…","digest":"苏锡常欧美同学会聚智联动 共探未来产业新赛道","points":["中新网无锡11月21日电 (孙权 唐娟)11月20日…","来自苏州、无锡、常州三地的120名欧美同学会学长齐聚一堂，通过实地探访、主题分享…","同步构建“5+X”未来产业发展体系，布局人工智能、低空经济、商业航天、合成生物等重点方向"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T13:25:20+08:00","size":1,"keywords":[],"body":"中新网无锡11月21日电 (孙权 唐娟)11月20日，“海创未来·智聚梁溪”苏锡常欧美同学会产业联动(第6期)未来产业主题无锡站活动在江苏无锡举行。\n\n　　来自苏州、无锡、常州三地的120名欧美同学会学长齐聚一堂，通过实地探访、主题分享、圆桌对话等形式，聚焦商业航天、可控核聚变、量子科技、深海装备、具身智能等未来产业赛道，共话创新、共谋协同发展。\n\n苏锡常欧美同学会产业联动(第6期)未来产业主题无锡站活动现场。孙权 摄\n\n　　苏锡常三地地缘相近、人缘相亲、产业相融。苏锡常欧美同学会产业联动活动办到第6期，持续为海归人才搭建常态化交流对接、资源合作的平台。无锡是中国民族工商业发祥地、乡镇企业摇篮，也是新质生产力发展的排头兵。扎根实业、产业报国是这座城市的底色。\n\n　　近年来，无锡坚持产业强市主导战略，物联网、集成电路、生物医药等优势产业集群持续壮大，创新能力稳居国家创新型城市前列；同步构建“5+X”未来产业发展体系，布局人工智能、低空经济、商业航天、合成生物等重点方向。\n\n　　“未来产业的竞争本质是原始创新的竞争，普遍投入大、周期长、风险高，亟需懂技术、懂产业、具备国际视野的海归人才躬身入局。”无锡市委常委、统战部部长丁四海希望各方用好苏锡常欧美同学会产业联动平台，推动技术、资本、人才高效流动、集聚耦合，在交流协作中实现优势互补，凝聚更大合力。\n\n活动参观环节。无锡市委统战部供图\n\n　　活动当日，参会学长先后走进宜兴低空经济发展服务中心，直观感受场景牵引带动低空产业链集聚的实践；前往梁溪科技城机器人6S场景创新中心、快仓(无锡)智能机器人全球总部基地，了解“展示—体验—交易—服务”一体化运营模式；参观无锡商业航天展示馆，系统了解无锡前瞻布局商业航天的发展历程。从低空经济、智能机器人到商业航天，大家边走边议，实地触摸无锡未来产业的发展脉动。\n\n　　“一部无锡史，半部在梁溪。”梁溪区委书记周子川表示，期盼大家以此次活动为契机，发挥自身视野开阔、融通中外的独特优势，积极支持和参与梁溪产业转型、科技创新和国际交流合作；期盼三地欧美同学会发挥好桥梁纽带作用，促进创新要素跨区域流动和高效配置，促成更多创新成果、优秀人才、优质项目落地梁溪。\n\n　　主题分享环节，五位嘉宾围绕多条前沿赛道分享研究与产业实践；在“看得见的未来”圆桌对话环节，来自政府部门、通航企业、高校、投资机构的四位嘉宾，围绕政策支撑、低空经济培育、未来产业布局、投资逻辑等议题深入交流，并结合自身领域，为深耕未来产业赛道的海归学长给出务实建议。\n\n“看得见的未来”圆桌对话环节。无锡市委统战部供图\n\n　　与会学长表示，将以本次活动为契机，巩固对接联系、深化务实合作，把个人专业所长融入国家发展大局，为苏锡常未来产业提质升级、长三角一体化发展贡献海归力量。\n\n　　江苏省委统战部副部长盛蕾，无锡学院党委书记、无锡市欧美同学会会长张永宏，江苏省欧美同学会秘书长朱军等出席活动。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0f3a355355","title":"越南—中国西南地区发展战略对接论坛在昆明举行","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735690.shtml","summary":"中新网昆明11月21日电 (记者 陈静)越南—中国西南地区发展战略对接论坛20日在昆明举行，越共中央总书记、国家主席苏林出席论坛并作主旨讲话，全国政协副主席王勇出席并讲话。","summary_short":"中新网昆明11月21日电 (记者 陈静)越南—中国西南地区发展战略对接论坛20日在昆明举行，越共中央总书记…","digest":"越南—中国西南地区发展战略对接论坛20日在昆明举行，越共中央总书记…","points":["中新网昆明11月21日电 (记者 陈静)越南—中国西南地区发展战略对接论坛20日在昆明举行…","中越570余家企业参会，开展对接活动","苏林指出，越中山水相连、文化相通、理想相同、命运相关、利益相融"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T13:13:52+08:00","size":1,"keywords":[],"body":"中新网昆明11月21日电 (记者 陈静)越南—中国西南地区发展战略对接论坛20日在昆明举行，越共中央总书记、国家主席苏林出席论坛并作主旨讲话，全国政协副主席王勇出席并讲话。中越570余家企业参会，开展对接活动。\r\n\n　　苏林指出，越中山水相连、文化相通、理想相同、命运相关、利益相融。近年来，两党两国最高领导人保持密切交往，就加快构建更高水平具有战略意义的越中命运共同体达成重要共识，一致同意加快两国发展战略对接。中国西南地区工业实力和创新能力强，充满发展活力，市场空间广阔，双方互补优势明显。举办此次论坛有助于进一步释放各自发展潜力，为深化合作创造更多机遇。苏林表示，越南高度重视与中国西南地区的全面合作，愿同中方一道努力，进一步推动更加紧密的政策沟通、更加通畅的基础设施互联互通、更加便利化的经贸投资融通、更加密切的民心相通，加快铁路、水运、航空等联通，发展多式联运，深化绿色工业、特色农业、科技创新等领域合作，不断提升经贸合作水平，加强人力资源培训合作，促进青年交流交往，以一个个具体的项目推动各领域务实合作取得更多成果，更好惠及两国人民。越方欢迎更多中国企业赴越投资兴业，共享发展机遇、共促繁荣发展。\n\n　　全国政协副主席王勇表示，中越两国是“同志加兄弟”的友好邻邦，在习近平总书记、国家主席和苏林总书记、国家主席战略引领下，中越政治互信持续巩固，经贸合作活力涌现，民间交往蓬勃兴盛，两国社会主义事业和国家建设不断取得新成就。中方愿与越方赓续传统友谊，加强发展战略对接，深化中国西南地区与越南各领域务实合作，推动基础设施互联互通、产业协作提质向新、人文交流持续升温，在互利共赢中守护和平稳定、促进发展繁荣，推动更高水平具有战略意义的中越命运共同体走深走实。\n\n　　中共云南省委书记莫高义表示，此次论坛在昆明举办，对赓续两国传统友好、深化交流合作具有重要意义。云南将坚持内外统筹、双向开放，不断增强大通道功能，更好服务各地企业开展经贸合作，发展纺织服装、电子信息、数字经济、文化旅游等产业，推动中越跨境经济合作区加快建设，壮大口岸经济，深化教育卫生合作、青年交流，在推进共建“一带一路”倡议同“两廊一圈”框架对接合作中当好交通物流、贸易往来、产业协作、人文交流的重要纽带。\n\n　　中华人民共和国国际贸易谈判副代表张力表示，经贸合作持续成为中越关系最具活力的组成部分，中国西南地区与越南贸易规模稳步提升，合作潜力巨大、前景广阔。商务部将持续加强与越方有关部门对话沟通，搭建经贸合作平台，深化投资、贸易、产业链供应链、跨境电商等合作，推动发展战略对接走深走实。\n\n　　越南工贸部部长黎孟雄表示，长期以来，经贸、投资、工业和能源合作是越中双方合作的重要支柱。越南工贸部高度重视与中国各地特别是西南地区建立和发展合作关系，将积极研究具体实施计划和行动方案，推动务实经济联动、基础设施互联互通、物流衔接和市场对接。\n\n　　全国政协常委、经济委员会副主任苗圩，省委副书记、代省长刘奇凡，省委副书记、昆明市委书记刘洪建，省政协主席刘晓凯出席论坛。\n\n　　广西壮族自治区政协主席孙大伟、重庆市政协主席程丽华、四川省政协主席田向利、贵州省政协主席赵永清，越南建设部、老街省领导分别致辞。\n\n　　本次论坛由云南省人民政府、越南工贸部主办。论坛前，与会嘉宾参观中越口岸物流、特色农业、新材料、绿色能源、生物医药等重点项目、产业及产品展示。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c32eec9df26","title":"首屆世界機械人登泰山大賽冠軍指成績超預期 將繼續提升機械狗速度","url":"https://news.tvb.com/tc/1207603-首屆世界機械人登泰山大賽冠軍指成績超預期將繼續提升機械狗速度","summary":"首屆世界機械人登泰山大賽月初舉行，奪得其中一項賽事冠軍的北京靈翌科技隊負責人指，成績超出預期，將繼續提升機械狗的速度，適應更多場景。今次大賽賽道全程約3.9公里，超過3,100級台階。","summary_short":"首屆世界機械人登泰山大賽月初舉行，奪得其中一項賽事冠軍的北京靈翌科技隊負責人指，成績超出預期，將繼續提升機械狗的速度…","digest":"首屆世界機械人登泰山大賽月初舉行，奪得其中一項賽事冠軍的北京靈翌科技隊負責人指…","points":["首屆世界機械人登泰山大賽月初舉行，奪得其中一項賽事冠軍的北京靈翌科技隊負責人指…","今次大賽賽道全程約3.9公里，超過3,100級台階","來自北京靈翌科技隊的機械狗，出戰足式機械人競速賽「全自主」登山"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T13:07+08:00","size":1,"keywords":[],"body":"首屆世界機械人登泰山大賽月初舉行，奪得其中一項賽事冠軍的北京靈翌科技隊負責人指，成績超出預期，將繼續提升機械狗的速度，適應更多場景。\n\n今次大賽賽道全程約3.9公里，超過3,100級台階。來自北京靈翌科技隊的機械狗，出戰足式機械人競速賽「全自主」登山。用時41分41秒，加上2分鐘罰時，最終以43分41秒奪冠。折算平均約0.8秒爬一級樓梯。\n\n奪冠團隊負責人劉佳瑞說：「前期測試的時候，泰山上的行人確實蠻多的，它一直是在做一個視覺避讓減速。比賽的情況下，因為沒有遊客在比賽賽道上，所以說這種情況下，機器人會用遠超我們平時測試的一個速度來進行登頂。」\n\n他又指，面對連續台階和陡坡彎道，每一步機械狗都要自己判斷如何走。\n\n劉佳瑞稱：「我們在機器狗身上加了一個雷達定位，讓它對路線規劃，以及它的一個實時分析，讓它知道它要往哪裡走。它能夠根據地形的不同，以及台階的高度的不同，能夠自己去判斷它的步態，以及它的平衡性。」\n\n比賽最初計劃為，每台機械人安排一名裁判全程尾隨，結果由於參賽機械人速度太快，人類裁判和隨行記者全部跟不上，甚至抽筋，組委會臨時改為裁判在固定檢查點分段駐守，記者局部跟拍。但團隊負責人表示，機械人爬山速度其實還有進步空間。\n\n劉佳瑞指：「比如說機器狗它在攀登的速度上，其實我們覺得還是有很大的提升空間的。像現在的巡檢也好、消防也好，包括這次泰山賽的『挑山工』也好，我們始終覺得科技一直是服務於人的。後續還會根據我們社會的需求，以及新需求來探索。」\n\n北京靈翌科技公司2024年成立，是宇樹科技全資子公司，主要從事技術服務及智能機械人研發。奪冠後，團隊還去到高原地區，繼續測試機械狗在低溫環境下，面對複雜地形的運動能力，期待收集更多數據用於升級。","image":"https://pro-vod-cdn.tvb.com/43e232dd2d09453884586cfa91def496/snapshots/4b7a191433d84e09ae668ff08ab266b3-00008.jpg","video":"https://pro-vod-cdn.tvb.com/43e232dd2d09453884586cfa91def496/f0ca248fe5784872ace05075f96ed1ee-e4d066eeaadae7ea9ed1c4d9af7a2dba-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/43e232dd2d09453884586cfa91def496/snapshots/4b7a191433d84e09ae668ff08ab266b3-00008.jpg","lang":"zh-Hant"},{"id":"cfc750707e7","title":"台胞陶艺家：一脉窑火烧紫砂 手捏陶土牵两岸","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735684.shtml","summary":"中新社福州11月21日电 题：台胞陶艺家：一脉窑火烧紫砂 手捏陶土牵两岸  　　作者 郑江洛  　　“我做手捏紫砂壶，这是一门慢手艺；我来到大陆，希望把自己在台湾的创作形态延续下来。","summary_short":"中新社福州11月21日电 题：台胞陶艺家：一脉窑火烧紫砂 手捏陶土牵两岸  　　作者 郑江洛  　　“我做手捏紫砂壶…","digest":"题：台胞陶艺家：一脉窑火烧紫砂 手捏陶土牵两岸  　　作者 郑江洛  　　“我做手捏…","points":["“我做手捏紫砂壶，这是一门慢手艺","今年66岁的他，带着十年柴烧手捏紫砂壶的创作经验，以一捧陶土、一脉窑火…","11月20日，生甡甦在位于福州的工作室内进行手捏紫砂壶创作"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T12:26:33+08:00","size":1,"keywords":[],"body":"中新社福州11月21日电 题：台胞陶艺家：一脉窑火烧紫砂 手捏陶土牵两岸\n\n　　作者 郑江洛\n\n　　“我做手捏紫砂壶，这是一门慢手艺；我来到大陆，希望把自己在台湾的创作形态延续下来。”近日在福州接受中新社采访时，来自台湾台南的陶艺家生甡甦如是说。今年66岁的他，带着十年柴烧手捏紫砂壶的创作经验，以一捧陶土、一脉窑火，在榕城开启自己的创作与两岸文化交流之路。\n\n　　生甡甦大学主修油画，十年前跨界转入陶艺。扎实的西方绘画功底让他习惯于从结构、机能的角度构思器物，每一把壶他都会先绘制草图、梳理设计逻辑，不刻意追逐浮夸猎奇的造型。\n\n11月20日，生甡甦在位于福州的工作室内进行手捏紫砂壶创作。　中新社记者 吕明 摄\n\n　　走进生甡甦的工作室，一件件紫砂手捏壶静静陈列，泥坯质地密实，处处暗藏人体工学上的巧思。他介绍，壶把预留手指按压位置，抬高的把手既可防烫，按住气孔便能实现断水，兼顾实用与美感；配套公道杯则设计成“腰带”造型，杯身向外浮凸，解决传统撇口容易烫手的问题。\n\n　　“振兴传统工艺，真正的意义在于创新，不是守旧复刻。”生甡甦认为，传统紫砂壶领域，不少作品与工厂量产壶样貌趋同，部分传统技艺没有完整传承，紫砂工艺亟须建立创新机制，跳出固有范式。\n\n11月20日，生甡甦在位于福州的工作室内向来访者展示其柴烧紫砂壶作品。　中新社记者 吕明 摄\n\n　　生甡甦的作品依靠柴烧落灰自然成釉。“我会刻意在坯体布置氧化铁，高温烧出晕染开的黑点，我认为这种效果很美妙。”他说，目前，捏好的坯体仍运回台湾烧制，自己计划在漳州南靖打造一座小型柴窑，让作品可直接在大陆烧制。\n\n　　在台湾柴窑内，生甡甦选用龙眼木烧制作品，需要持续30多个小时不断投柴、积灰。当窑温升至高于1100摄氏度时，落灰开始熔融，升至1300摄氏度左右时则完全玻化。落灰在坯体表面形成各式纹样，成就独一无二的款式。\n\n11月20日，生甡甦(左)在位于福州的工作室内指导徒弟创作。　中新社记者 吕明 摄\n\n　　今年8月，生甡甦的工作室正式入驻福州福马产业合作园，他在此每日投入大量时间创作。不久前，他在两岸职工(福州)会客厅开设生活美学课，向榕台职工分享柴烧窑变之美。\n\n　　生甡甦说，他已在福建收下徒弟，并期待把创作理念、手捏壶技法带到更多课堂。他还希望与大陆工艺匠人“切磋碰撞”，一同探索紫砂壶的创新路径。\n\n　　生甡甦认为，两岸陶艺界相互了解仍有限，需要积极推进彼此交流。他愿以手中砂壶为桥，让同源的中华陶艺文化在两岸之间流动传续。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce5b7e06d28","title":"2026年“数据要素×”大赛新疆分赛正式闭幕","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735671.shtml","summary":"中新网新疆昌吉11月21日电 (袁鹏冲)2026年“数据要素×”大赛新疆分赛闭幕式20日在新疆昌吉市举办，本届赛事作为“数据要素×”三年行动收官重要实践，以赛聚智、以赛促用…","summary_short":"中新网新疆昌吉11月21日电 (袁鹏冲)2026年“数据要素×”大赛新疆分赛闭幕式20日在新疆昌吉市举办…","digest":"2026年“数据要素×”大赛新疆分赛闭幕式20日在新疆昌吉市举办…","points":["中新网新疆昌吉11月21日电 (袁鹏冲)2026年“数据要素×”大赛新疆分赛闭幕式20日在新…","本届大赛围绕“数据赋能乘数而上”主题，设置17条赛道，吸引全疆各地州市766个项目踊跃报名…","经多轮评审遴选，194个项目分获各等级奖项，34个项目突围跻身全国总决赛…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:28:48+08:00","size":1,"keywords":[],"body":"中新网新疆昌吉11月21日电 (袁鹏冲)2026年“数据要素×”大赛新疆分赛闭幕式20日在新疆昌吉市举办，本届赛事作为“数据要素×”三年行动收官重要实践，以赛聚智、以赛促用，一批扎根新疆产业民生的数据创新成果集中揭晓。\n\n图为活动现场。袁鹏冲 摄\n\n　　本届大赛围绕“数据赋能乘数而上”主题，设置17条赛道，吸引全疆各地州市766个项目踊跃报名，覆盖工业制造、现代农业、文旅文博、医疗医保、能源交通等多元领域。经多轮评审遴选，194个项目分获各等级奖项，34个项目突围跻身全国总决赛，斩获全国二等奖1项、三等奖4项，不少方案把行业痛点转化为数字应用的创新亮点。\n\n　　闭幕式上，赛事成果分析报告正式发布，现场同步开展主题分享、优秀项目展演，对一、二、三等奖、优秀解决方案及优秀组织单位予以表彰。\n\n　　记者了解到，本次比赛相关参赛成果立足新疆地域实际，从智慧矿山、数字农田到文物AI活化、医保数智监管，数据要素正在田间、车间、公共治理场景落地生根，把赛场创意转化为现实生产力。\n\n　　近年来新疆持续擦亮“天山论数”赛事品牌，构建起“赛场选才、成果储备、供需对接”的完整链条。\n\n　　据新疆维吾尔自治区数字化发展局相关负责人介绍，新疆将持续完善项目储备库，搭建成果转化对接渠道，培育数据要素流通生态，吸引更多数字人才与产业资源入疆兴业，让数据“乘数效应”持续赋能丝绸之路经济带核心区高质量发展。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"台灣","total":1,"items":[{"id":"c3875db9773","title":"台湾自媒体人翟翾感叹：何其有幸，我们是中国人！我们中国有个深圳！","url":"https://www.chinanews.com/tw/shipin/2026/11-21/news1075647.shtml","summary":"台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议，世界各地的代表们都想亲自来深圳看看中国速度到底是什么，感受中国的科技发展给社会带来脱胎换骨的动力。","summary_short":"台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议…","digest":"台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议…","points":["台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议…","翟翾则感慨，不少外国人都希望“我的祖国也能有个深圳”，作为中国人“何其有幸”…"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:12:22+08:00","size":1,"keywords":[],"body":"台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议，世界各地的代表们都想亲自来深圳看看中国速度到底是什么，感受中国的科技发展给社会带来脱胎换骨的动力。翟翾则感慨，不少外国人都希望“我的祖国也能有个深圳”，作为中国人“何其有幸”，并表示也有很多台湾同胞在深圳发展得非常好。(中新网“燕新台”工作室）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/20/af62ae94-2f54-415b-a0e3-5ce21ef154c0.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"國際","total":34,"items":[{"id":"c3d8cb3b789","title":"黃仁勳辭職︱子女仍任輝達高管 專家：夾在父親公司之間 處境尷尬","url":"https://www.stheadline.com/realtime-world/3639629/黃仁勳辭職子女仍任輝達高管-專家夾在父親公司之間-處境尷尬","summary":"輝達（Nvidia）創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁，但兒子黃勝斌（Spencer Huang）、女兒黃敏珊（Madison Huang）及女婿仍任輝達高層…","summary_short":"輝達（Nvidia）創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁…","digest":"輝達創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁…","points":["輝達（Nvidia）創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁…","專家指出，他們既要對父親忠誠，也該對公司忠誠，目前陷入兩難","相關新聞：黃仁勳出軌｜分析：Nvidia家族企業色彩濃 無董事長未有繼任人計劃"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T16:39:48+08:00","size":1,"keywords":[],"body":"輝達（Nvidia）創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁，但兒子黃勝斌（Spencer Huang）、女兒黃敏珊（Madison Huang）及女婿仍任輝達高層，各自年薪逾百萬美元。專家指出，他們既要對父親忠誠，也該對公司忠誠，目前陷入兩難。\n相關新聞：黃仁勳出軌｜分析：Nvidia家族企業色彩濃 無董事長未有繼任人計劃\n美國國會正調查黃仁勳與黃樂的關係。美聯社\n黃仁勳與黃樂爆出婚外情醜聞，2人舉止親密。路透社\n黃仁勳（右2）婚外情風波核心人物黃樂（後右3）2024年COMPUTEX台北國際電腦展會後派對時，兩人被拍到坐在一起。路透社\n\n黃敏珊向丈夫拿自己的手機，為二人拍攝合照。X\n黃敏珊與黃樂談笑，氣氛融洽。X\n黃敏珊幫二人拍攝合照。X\n公司內部視為「皇族」\n根據輝達今年5月申報的關係人交易揭露文件，36歲的黃勝斌年薪約130萬美元（約1020萬港元），是輝達機械人事業群產品管理總監；35歲的黃敏珊年薪約120萬美元（約940萬港元），職銜是實體AI產品行銷資深總監。\n\n黃勝斌畢業於芝加哥哥倫比亞藝術學院，曾在台北創辦廣受好評的調酒酒吧「R&D Cocktail Lab」，後赴紐約大學取得MBA學位才加入輝達機械人部門。而黃敏珊則出身美國廚藝學院，當過侍酒師，曾加入LVMH集團負責精品飯店行銷，前往倫敦商學院攻讀MBA後，2020年以實習生身分加入輝達。她的丈夫、瑞士前高山滑雪國手卡普雷茲（Nico Caprez）同樣任職輝達，是資料中心開發商關係副總裁。\n\n相關新聞：黃仁勳出軌對象是誰？ 黃樂自稱曾任媒體、金融業、Megaspeed高層 背景神秘曝光\n黃敏珊替父管理形象惹高層不滿\n父親去職後，外界不免更嚴格檢視兩人的角色與影響力。輝達立場是他們沒有「靠父蔭」，但《華爾街日報》引述知情人士指出，黃家子女在公司內被當成「皇族」對待。《紐約時報》則爆料，黃敏珊在父親醜聞升溫期間介入形象管理，引發同事不滿，過去3年已有逾10名高層因不願與她共事而離職。\n加州大學爾灣分校商學院榮譽教授皮爾斯（Jone Pearce）直言，「就我來看這當然是裙帶關係」，如今兩人處境尷尬，「他們既要對父親忠誠，也該對組織忠誠，這令他們陷入兩難。」但她也補充，受惠於家族關係者往往揹負不公平的惡名，「但這不代表他們沒有能力。正因為知道別人會不服氣，他們通常會加倍努力。」\n知情人士透露，黃仁勳離職後，子女如常上班，黃敏珊本周赴亞利桑那州出差。兩人18日全員大會當天都有在辦公室現身，但對父親下台一事至今未公開表態。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cfe2fc545b2","title":"印尼青年体验中国茶艺 感受传统文化魅力","url":"https://www.chinanews.com/gj/shipin/cns-d/2026/11-21/news1075656.shtml","summary":"当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场，来自当地高校的青年学生和民众参与茶艺小课堂，在中国茶艺老师指导下了解中国茶文化，学习茶艺知识和冲泡技巧。","summary_short":"当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场…","digest":"当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场…","points":["当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场…","参与者通过观茶、闻香、品茶等环节，近距离体验中国茶文化，在一盏清茶中感受中国传统文化的韵味"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T16:13:06+08:00","size":1,"keywords":[],"body":"当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场，来自当地高校的青年学生和民众参与茶艺小课堂，在中国茶艺老师指导下了解中国茶文化，学习茶艺知识和冲泡技巧。\n\n参与者通过观茶、闻香、品茶等环节，近距离体验中国茶文化，在一盏清茶中感受中国传统文化的韵味。(李志全 魏之强 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/7B4143563F154653BD363A67338BA10F.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c5645401202","title":"特朗普：中俄美元首会晤具有重大历史意义","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735613.shtml","summary":"中新社华盛顿11月20日电 (记者 陈孟统)美国总统特朗普20日在白宫表示，美国、中国和俄罗斯三国领导人日前在中国深圳举行首次三方会晤，这是“一场具有重大历史意义的国际峰会”。","summary_short":"中新社华盛顿11月20日电 (记者 陈孟统)美国总统特朗普20日在白宫表示，美国…","digest":"美国总统特朗普20日在白宫表示，美国…","points":["中新社华盛顿11月20日电 (记者 陈孟统)美国总统特朗普20日在白宫表示，美国…","在结束中国之行后，特朗普美东时间19日晚返抵华盛顿","20日下午，他在副总统万斯和国务卿鲁比奥的陪同下，在白宫举行新闻发布会"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:04:27+08:00","size":2,"keywords":[],"body":"中新社华盛顿11月20日电 (记者 陈孟统)美国总统特朗普20日在白宫表示，美国、中国和俄罗斯三国领导人日前在中国深圳举行首次三方会晤，这是“一场具有重大历史意义的国际峰会”。\n\n　　在结束中国之行后，特朗普美东时间19日晚返抵华盛顿。20日下午，他在副总统万斯和国务卿鲁比奥的陪同下，在白宫举行新闻发布会。\n\n　　在谈到中俄美元首会晤时，特朗普说，“这次峰会规模很大，意义重大，气氛也非常好，令人难以置信。我们三人之间的关系非常融洽。”\n\n　　特朗普说，这场具有历史意义的峰会达成的成果，“是一份史无前例的三方和平宣言”。美国、俄罗斯和中国正式达成共识，绝不能让核冲突发生。\r\n\n　　中俄美三国元首19日在深圳举行会晤，围绕维护世界和平、促进大国关系战略稳定主题进行深入讨论。会后，三方发表《中俄美元首和平宣言》。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"特朗普：中俄美元首会晤具有重大历史意义","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735613.shtml","source_display":"中新網 環球","published_at":"2026-11-21T10:04:27+08:00","category":"國際","digest":"美国总统特朗普20日在白宫表示，美国…"},{"title":"特朗普：中俄美元首会晤“史无前例”“意义重大”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735606.shtml","source_display":"中國新聞網","published_at":"2026-11-21T06:06:28+08:00","category":"國際","digest":"美国总统特朗普20日在白宫举行的新闻发布会上表示…"}],"cross":{"total":2,"angles":[{"point":"美国总统特朗普20日在白宫表示，美国…","sources":["中新網 環球"],"url":"https://www.chinanews.com.cn/gj/202
