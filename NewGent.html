s","published_at":"2026-11-19T19:20+08:00","size":1,"keywords":[],"body":"歡迎收看《世界觀》。\n\n長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時，人工智能急速發展，正推高算力的需求，數據中心不但「食電食水」，更佔用龐大土地。在土耳其安卡拉召開的聯合國氣候峰會，把AI列為核心議題之一。到底人工智能發展，是否只能站在環境保護的對立面？\n\n聯合國氣候峰會召開之際，歐洲十多個國家本月初爆發示威，反對AI數據中心無節制擴張。\n\n蘇格蘭地球之友成員稱：「來自蘇格蘭各地的民眾來到愛丁堡，抗議計劃在全蘇格蘭各地興建人工智能數據中心，這些數據中心將對地方社區，以至全國層級產生巨大影響。」\n\n法國地方公民行動團體發言人指出：「對我們來說最重要的是，能就這數據中心項目發聲，涉及多項環境與公共衞生異常問題。」\n\n所謂AI數據中心，是專門孕育與驅動人工智能的巨型大腦工廠，裡面放滿頂級晶片，日以繼夜高速運算，多國積極興建數據中心，以搶佔AI時代的基礎設施和經濟主導權。\n\n不過，這些數據中心運算時，消耗大量電力，加上每當晶片高速運行時，散發極高熱力，要耗用大量淡水冷卻，都對環境造成負擔。\n\n哈佛大學一項研究顯示，美國超過四百座大型數據中心，一年的碳排放量，已超過整個丹麥的排放量，比先前研究估計高出兩至三倍，總耗電量達82太瓦時，足以供應近七百萬戶家庭一年的用電。\n\n值得留意的是，團隊分析的用電量及排放數據，是前年五月至去年四月間，當時AI熱潮仍未全面爆發。研究員警告，美國計劃未來增建二千座數據中心，將令排放問題更嚴峻。\n\n面對人工智能發展，可能對氣候帶來前所未有的衝擊，在土耳其安卡拉舉行的第31屆聯合國氣候峰會，首度將AI列為專門承諾議題，正式發表「安塔利亞人工智能承諾」。該承諾由東道主土耳其，與聯合國科技機構國際電信聯盟共同發起，呼籲各國政府與企業採取自願措施，以永續能源驅動人工智能，並透明揭露對環境的衝擊，同時也敦促簽署國支持更有效率的基礎建設，追蹤排放量，並擴大發展中國家使用AI的管道。\n\n不過，該倡議只屬自願性質，初期只獲包括德國、巴西和韓國在內，少數國家或地區及企業響應，人工智能發展大國美國與中國，以及OPENAI、GOOGLE等科技巨頭，都未有參與。\n\n有意見則認為，AI與環境的關係，也能由「消耗」走向「共生」，由於數據中心的運算設備，會產生大量廢熱並排入大氣，若能把這些廢熱回收再用，能減少數據中心對環境影響。國際能源署估計，如果能全面回收數據中心的廢熱，並納入供熱系統，到2030年，將足夠為約一成歐洲家庭，提供暖氣和熱水。\n\n分析認為，在AI算力高速擴張的時代，要平衡科技發展與環境保護，關鍵在於如何將龐大的能源消耗，轉化為循環資源，能否為AI永續發展找到一條務實出路，成為各地政商界一大課題。\n\n我們明天繼續《世界觀》，觀世界。\n\n點擊觀看其他集數","image":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/snapshots/f2ae01d9b2a94e0fbcb781fc5833fb09-00008.jpg","video":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/ea857a66ed494499917aee697c52fd11-53e2eae6b504ed824d74eaf8c1b18014-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/snapshots/f2ae01d9b2a94e0fbcb781fc5833fb09-00008.jpg","lang":"zh-Hant"},{"id":"cdf416c6a3c","title":"巴基斯坦在反恐行动中打死22名恐怖分子","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734843.shtml","summary":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说，巴安全部队日前在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。","summary_short":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","digest":"伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","points":["中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","综合巴基斯坦《黎明报》等媒体消息，声明称，巴安全部队于本月16日至17日开展上述反恐行动","其中在南瓦济里斯坦地区的行动中，安全部队在交火中共打死15名恐怖分子"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T19:15:44+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说，巴安全部队日前在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。\n\n　　综合巴基斯坦《黎明报》等媒体消息，声明称，巴安全部队于本月16日至17日开展上述反恐行动。其中在南瓦济里斯坦地区的行动中，安全部队在交火中共打死15名恐怖分子；在本努地区和丹格地区的行动中，安全部队打死7名恐怖分子，并在行动中缴获大量武器弹药。\n\n　　巴基斯坦三军新闻局称，这些被击毙的恐怖分子“参与了该地区多起恐怖活动”，目前清剿行动仍在继续，搜剿该地区潜藏的其他恐怖分子。同时，反恐行动将持续全力推进，旨在彻底根除恐怖主义这一祸患。\n\n　　巴基斯坦总统扎尔达里承诺，将持续开展反恐行动，直至将恐怖主义从巴基斯坦全部清除。\r\n\n　　近年来，“巴基斯坦塔利班”等恐怖组织在巴境内针对军民目标策划多起恐怖袭击，造成重大人员伤亡。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf8828a56a5","title":"韩国2026年累计出口额突破1万亿美元大关","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734799.shtml","summary":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示，韩国2026年累计出口额初步统计已超过1万亿美元(约合人民币6.7万亿元)，成为继美国、德国和中国之后…","summary_short":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示…","digest":"韩国产业通商资源部19日表示…","points":["中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示…","韩国产业通商资源部表示，自2024年以来，人工智能(AI)应用相关产品的全球贸易额增速一直高…","受AI投资热潮带动，2026年1月至10月，韩国半导体出口额同比大增193.1%…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T18:35:36+08:00","size":1,"keywords":[],"body":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示，韩国2026年累计出口额初步统计已超过1万亿美元(约合人民币6.7万亿元)，成为继美国、德国和中国之后，全球第四个实现年度出口额突破1万亿美元的国家。\r\n\n　　半导体成为主要推动力。韩国产业通商资源部表示，自2024年以来，人工智能(AI)应用相关产品的全球贸易额增速一直高于全球商品贸易整体增速。受AI投资热潮带动，2026年1月至10月，韩国半导体出口额同比大增193.1%，达到3968亿美元，占整体出口额的42.7%。\n\n　　此外，韩国其他主力产业也展现出较强竞争力。截至10月，除半导体以外的出口额同比增长20.2%，增速创近20年来新高。韩国化妆品、生物产业等具有发展潜力的消费品也为出口增长提供了支撑。\n\n　　韩国产业通商资源部长官金正官当天表示，韩国政府将集中一切力量，在发掘新的增长动力的同时，推动出口成果惠及地方经济发展，带动青年就业。\n\n　　据韩联社报道，相关专家分析称，受基数效应等因素影响，2027年韩国出口增速可能有所放缓，但预计仍能保持1万亿美元规模。同时，还应警惕半导体产业过度集中导致的产业间发展失衡，以及汇率等宏观经济环境变化、半导体产业成果带动效应不足等问题。(完) 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c641af949bb","title":"夜蛾如何辨识方向？国际最新研究发现利用地磁和星光两种罗盘导航","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734729.shtml","summary":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称，布冈夜蛾(Bogong moths)利用一种地磁罗盘帮助它们进行季节性的迁徙…","summary_short":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称…","digest":"国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称…","points":["中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表…","夏季，高山洞穴中休眠的布冈夜蛾，洞穴岩壁上每平方米约有1.7万只蛾…","春季，数十亿夜蛾从澳大利亚东南部各地出发，前往此前从未去过的1000公里外的澳大利亚阿尔卑斯…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:39+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称，布冈夜蛾(Bogong moths)利用一种地磁罗盘帮助它们进行季节性的迁徙，连同此前研究证明这些蛾子还会利用星光导航，表明此类昆虫使用地磁和星光两种内在罗盘来寻找方向。\n\n夏季，高山洞穴中休眠的布冈夜蛾，洞穴岩壁上每平方米约有1.7万只蛾，每个洞穴内有数百万只(图片来自Eric　Warrant)。施普林格·自然 供图\n\n　　论文作者认为，布冈夜蛾的磁感应能力与一些夜间迁徙的鸣禽相似，其表明相距甚远的物种可能会独立演化出类似能力。\n\n　　据论文介绍，澳大利亚的布冈夜蛾在仅一年的生命周期中有两次大规模迁徙。春季，数十亿夜蛾从澳大利亚东南部各地出发，前往此前从未去过的1000公里外的澳大利亚阿尔卑斯山，随后在秋季返回。\n\n布冈夜蛾(图片来自澳大利亚麦考瑞大学Ajay　Narendra)。施普林格·自然 供图\n\n　　此前研究表明，这些夜蛾利用星空作为指南针导航前往目的地，但星空被云层遮蔽时它们仍能正确前进。基于此，有观点提出，这是因为夜蛾能够感知和利用地球磁场，但具体机制尚未得到证实。\n\n　　在本项研究中，瑞典隆德大学、德国奥尔登堡大学的研究团队合作，捕捉了迁徙中的夜蛾，将其转移至一个封闭环境，其中布置了随机的星空(缺乏方向性线索)和一个局部磁场(可调整改变磁北极位置)。\n\n布冈夜蛾休眠洞穴附近的高山景观(图片来自Eric　Warrant)。施普林格·自然 供图\n\n　　研究显示，在没有典型夜空的情况下，蛾子能仅靠磁场继续朝向正确方向迁徙；当磁场角度调整时，它们会改变飞行方向，但磁极性(磁场南北极的方向)改变时，它们不受影响；施加微弱射频噪声和去除蓝紫光(这些因素已知会扰乱其他磁感知动物的迁徙)，都会导致夜蛾无法确定方向。\n\n　　论文作者总结表示，本项研究结果指向夜蛾的内在磁罗盘采用了基于自由基对的机制，这与夜间迁徙鸣禽中观察到的机制相似。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c279d652d49","title":"菲律宾多地高温指数达危险级别 局地达44摄氏度","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734718.shtml","summary":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数，局地高温指数达到44摄氏度。","summary_short":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数…","digest":"菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数…","points":["中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示…","据该机构消息，马斯巴特市、东萨马省博龙岸市和三宝颜市当天高温指数均达到44摄氏度","巴拉望省公主港市和库约镇达到43摄氏度"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:05+08:00","size":1,"keywords":[],"body":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数，局地高温指数达到44摄氏度。\n\n　　据该机构消息，马斯巴特市、东萨马省博龙岸市和三宝颜市当天高温指数均达到44摄氏度。巴拉望省公主港市和库约镇达到43摄氏度。另有8个地区高温指数达到42摄氏度。\n\n　　受高温天气影响，菲律宾多地19日暂停线下教学或缩短课时，以降低高温对师生健康的影响。\n\n　　菲律宾大气地球物理天文局此前预报，19日，米马罗巴地区、米沙鄢群岛和棉兰老岛的5个监测地点高温指数预计达到42至51摄氏度，处于危险级别。\r\n\n　　高温指数是结合实际气温和相对湿度计算得出的人体体感温度。菲律宾气象部门将高温指数分为四个等级：警戒级(27至32摄氏度)、高度警戒级(33至41摄氏度)、危险级(42至51摄氏度)和极端危险级(52摄氏度及以上)。\n\n　　菲律宾气象部门警告，持续暴露于危险级别高温环境可能导致热痉挛和热衰竭，长时间暴露甚至可能引发中暑。该机构提醒公众及时补充水分，尽量避免在10时至16时外出，外出时做好防晒措施。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c26b45b62ec","title":"涉嫌参与海地总统遇刺案 美国牧师或面临终身监禁","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734676.shtml","summary":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel Sanon)因涉嫌刺杀海地总统若弗内尔·莫伊兹(Jovenel Moise)…","summary_short":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel San…","digest":"涉嫌参与海地总统遇刺案 美国牧师或面临终身监禁","points":["中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christia…","综合路透社、美国《迈阿密先驱报》等媒体报道，萨农现年68岁，拥有美国和海地双重国籍","萨农被裁定所有指控全部成立，其中包括共谋杀害海地总统莫伊兹"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:43:09+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel Sanon)因涉嫌刺杀海地总统若弗内尔·莫伊兹(Jovenel Moise)，被迈阿密法官裁定有罪，可能面临终身监禁。\n\n　　综合路透社、美国《迈阿密先驱报》等媒体报道，萨农现年68岁，拥有美国和海地双重国籍。萨农被裁定所有指控全部成立，其中包括共谋杀害海地总统莫伊兹。迈阿密一家联邦法院定于2027年2月10日对其宣判量刑，萨农最高可能被判处终身监禁。\n\n　　庭审期间，萨农始终坚称自己无罪。判决公布后，其律师表示对判决结果感到失望，并称将适时提起上诉。\n\n　　2021年7月7日，海地总统莫伊兹在太子港私邸遭暗杀身亡。事发数日后，萨农在太子港被捕。警方搜查其住所时，发现8块车牌、19本护照、12部手机、30箱弹药及12个手枪枪套。\r\n\n　　莫伊兹遇刺身亡后，海地持续动荡。受政治危机、帮派暴力等因素影响，该国选举多次推迟，长期未能产生民选总统。2024年4月，海地过渡总统委员会成立，在民选总统就职前的过渡期内暂行特定总统权力。\n\n　　目前，海地总统选举首轮投票暂定于2027年7月举行，莫伊兹的遗孀玛蒂娜·莫伊兹已登记为海地总统选举候选人。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1f12d0929e","title":"沙特王储与美军中央司令部司令会谈 沙特与也门胡塞武装持续相互打击","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734656.shtml","summary":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀率领的代表团。","summary_short":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀…","digest":"综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布…","points":["中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美…","沙特和也门胡塞武装当天持续互相打击","据沙特通讯社报道，穆罕默德与库珀在会谈期间回顾双边关系，尤其是军事领域合作…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:42:35+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀率领的代表团。沙特和也门胡塞武装当天持续互相打击。\n\n　　据沙特通讯社报道，穆罕默德与库珀在会谈期间回顾双边关系，尤其是军事领域合作，讨论地区局势发展，以及促进地区安全、稳定与和平的努力。\n\n　　报道称，沙特国家安全顾问艾班、沙特武装部队总参谋长兼沙特主导的多国联军代理指挥官鲁韦利参加会谈。\n\n　　另据以色列《耶路撒冷邮报》、卡塔尔半岛电视台报道，库珀率团赴沙特会谈前，在以色列特拉维夫与以高级军事和情报官员举行会谈。以色列国防军通报称，双方讨论的重点是为应对区域安全挑战，加强军事准备和协调行动。\r\n\n　　路透社报道称，知情人士表示，本轮沙特与也门胡塞武装的冲突升级以来，沙特曾于9月向美国总统特朗普寻求军事援助，以打击胡塞武装。特朗普不同意美方直接参与打击胡塞武装，但表示将提供情报共享等援助。\n\n　　沙特民防部门19日在几小时内连续发出5次紧急情况警报，要求民众遵循安全指示，避免前往人群聚集地点。当天晚些时候，警报解除。\n\n　　沙特阿拉伯主导的多国联军发言人马利基19日在社交媒体上发布多条信息称，联军当天先后拦截并摧毁胡塞武装射向沙特南部地区的6枚导弹，并应对一起其针对沙特首都利雅得的导弹威胁。导弹碎片坠落造成财产损失，损失程度仍在评估中。\n\n　　也门胡塞武装通报称，多国联军19日对也门首都萨那的纺织厂、皮革厂，以及西南部塔伊兹省的医疗机构等民用目标发动数轮空袭。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c36dee1b62a","title":"“游历于色彩与线条之间”特别企画展在东京中国文化中心举办","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734653.shtml","summary":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心举办。","summary_short":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化…","digest":"“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心…","points":["中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别…","本次展览由东京中国文化中心策展并主办","展览汇集姜淼、吴霜、鲍蓓等中国当代一流新锐艺术家的作品，以抽象绘画为切入点，围绕色彩…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:41:45+08:00","size":1,"keywords":[],"body":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心举办。\n\n　　本次展览由东京中国文化中心策展并主办。展览汇集姜淼、吴霜、鲍蓓等中国当代一流新锐艺术家的作品，以抽象绘画为切入点，围绕色彩、线条与材料展开，呈现艺术家对绘画形式和视觉语言的多样探索。展览展期至12月25日。\n\n展览现场。中新网记者 朱晨曦 摄\n\n　　据介绍，本次展出作品虽各具面貌，却共同关注色彩、线条与材料之间的关系。作品通过色彩的交织与对照、线条的穿插与延伸，以及材料肌理的叠加和变化，共同构成画面的视觉层次。同时，线条与色块既参与画面结构的组织，也形成不同的视觉节奏。此外，材料经过覆盖、叠加、刮刻等处理，留下丰富的表面痕迹，使作品呈现出各具特点的质感。\n\n　　主办方表示，抽象艺术为艺术家提供了不同于具象描绘的表达方式，也使色彩、线条和材料本身成为画面表达的重要组成部分。艺术家并不拘泥于对具体形象的描绘，而是通过形式与材料的组合，拓展画面的表达空间。\n\n展览现场。中新网记者 朱晨曦 摄\n\n　　作为功能及定位适配化改造的重要一环，东京中国文化中心希望通过本次展览，用小而美的表达方式向日本文艺界和艺术爱好者展现鲜活的中国当代抽象艺术面貌，吸引更多日本民众了解当代中国文化、感知当代中国发展。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc8806c0028","title":"俄轟炸機近日於越南出現 分析指俄方在APEC會議期間展示實力","url":"https://news.tvb.com/tc/1207333-俄轟炸機近日於越南出現分析指俄方在APEC會議期間展示實力","summary":"俄羅斯兩架戰略轟炸機，近日在越南出現。兩架具有核打擊能力的俄羅斯圖-95型戰略轟炸機，周三在越南峴港一個機場出現，周四離開。","summary_short":"俄羅斯兩架戰略轟炸機，近日在越南出現。","digest":"俄羅斯兩架戰略轟炸機，近日在越南出現","points":["兩架具有核打擊能力的俄羅斯圖-95型戰略轟炸機，周三在越南峴港一個機場出現，周四離開","正值俄羅斯總統普京到深圳出席亞太經合組織(APEC)會議，和中俄美元首會晤等活動…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:54:00+08:00","size":1,"keywords":["俄羅斯","越南","戰略轟炸機","APEC 2026"],"body":"俄羅斯兩架戰略轟炸機，近日在越南出現。\n\n兩架具有核打擊能力的俄羅斯圖-95型戰略轟炸機，周三在越南峴港一個機場出現，周四離開。\n\n正值俄羅斯總統普京到深圳出席亞太經合組織(APEC)會議，和中俄美元首會晤等活動，有分析認為，俄方此時派轟炸機到越南，是向外界展示俄方對東亞具有影響力。","image":"/_nuxt/default.R189UE3B.jpg","video":"https://pro-vod-cdn.tvb.com/9ef0f2c88c864b469d827922c9532cac/34184e1097694581a428bf6403a2c308-b569d3ab7cbf169268b15a32a181649b-sd.m3u8","video_poster":"/_nuxt/default.R189UE3B.jpg","lang":"zh-Hant"},{"id":"cbb3e1b98b5","title":"時事通識｜雅爾塔會議","url":"https://news.tvb.com/tc/1207148-時事通識雅爾塔會議","summary":"中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤，令人聯想到1945年的雅爾塔會議。雅爾塔會議於1945年2月4日至11日，在蘇聯克里米亞舉行，是二戰期間美國、英國和蘇聯三國領袖一次重要的國際會議。","summary_short":"中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤，令人聯想到1945年的雅爾塔會議。","digest":"中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤…","points":["中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤…","雅爾塔會議於1945年2月4日至11日，在蘇聯克里米亞舉行，是二戰期間美國…","當時德國敗局已定，會議主要商討歐洲戰後重組，決定戰後新的地緣政治力量格局…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T18:25+08:00","size":1,"keywords":[],"body":"中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤，令人聯想到1945年的雅爾塔會議。\n\n雅爾塔會議於1945年2月4日至11日，在蘇聯克里米亞舉行，是二戰期間美國、英國和蘇聯三國領袖一次重要的國際會議。\n\n當時德國敗局已定，會議主要商討歐洲戰後重組，決定戰後新的地緣政治力量格局，其中包括蘇聯承諾在歐洲戰事結束後對日作戰，但條件是維持外蒙古現狀等，當中涉及中國主權，但中方並未參與決策。\n\n雅爾塔會議制定了第二次世界大戰，戰後的世界新秩序和列強利益分配方針，奠定了戰後，由美國與蘇聯主導的雅爾塔體系，而大國私下安排別國事務的做法，遺留的主權爭端影響至今。\n\n有學者認為，如今中俄美不是盟友關係，會晤也不是要給世界安排新秩序，將兩者相提並論未必恰當。\n\n點擊觀看其他集數","image":"https://pro-vod-cdn.tvb.com/24e2c94ea1e44081a038e01a4bb81442/snapshots/f7d7f1ddc9474bed8e8f83703ec2ef78-00008.jpg","video":"https://pro-vod-cdn.tvb.com/24e2c94ea1e44081a038e01a4bb81442/b4bdca3b5ac74a5e8ffd82adbcdefb44-b726195d7f0491f39d338ca07bdef4dd-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/24e2c94ea1e44081a038e01a4bb81442/snapshots/f7d7f1ddc9474bed8e8f83703ec2ef78-00008.jpg","lang":"zh-Hant"}]},{"name":"民生","total":52,"items":[{"id":"c2139f8ca2d","title":"【深圳APEC】深圳水果店店员：智利总统到访，车厘子销量明显增长","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075512.shtml","summary":"11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启。","summary_short":"11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启。","digest":"11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启","points":["11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启","活动现场，他向一个中国家庭赠送了一箱智利车厘子，共同庆祝新产季到来","他在致辞中说，车厘子是智中双边贸易中最具代表性的产品之一，承载着两国之间的信任与友谊"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:57:16+08:00","size":1,"keywords":[],"body":"11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启。活动现场，他向一个中国家庭赠送了一箱智利车厘子，共同庆祝新产季到来。\n\n他在致辞中说，车厘子是智中双边贸易中最具代表性的产品之一，承载着两国之间的信任与友谊。他邀请中国消费者品尝来自智利的车厘子，与家人和朋友分享新鲜、甜美与营养。\n\n11月19日，中新社记者走访这家水果店，店内印着“智利水果”字样的红色拱形展架格外醒目。一盒盒车厘子层层摆开，深红的果实带着青绿的果柄。展台中央，单颗包裹的车厘子被垒成一座小塔。包装盒上果园和采摘者的照片，将人们的目光引向这份甜美的源头。\n\n现场工作人员回忆到，昨天智利总统到访门店参观，他在展台等候，向总统递上产自智利的进口车厘子试吃品。门店近期推出将鲜花与水果结合的花果礼，考虑到车厘子很适合作为伴手礼，特意准备了车厘子花束，作为礼品送给总统夫人。他还提到，从昨天下午开始，店里车厘子的销量有明显上涨。(记者 范思忆 关雪昭 李佳悦 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/4213CC909E5F42EEA7C242778D74AAB2.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c970e488aee","title":"难忘二战记忆——火光之下，不只是新加坡","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734976.shtml","summary":"“四周一片漆黑，新加坡看起来就像一团火。","summary_short":"“四周一片漆黑，新加坡看起来就像一团火。","digest":"“四周一片漆黑，新加坡看起来就像一团火","points":["“四周一片漆黑，新加坡看起来就像一团火","许多船被击沉了，海面上都是残骸","”这是1942年新加坡沦陷后，来自乘船逃难者的口述"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:56:14+08:00","size":1,"keywords":[],"body":"“四周一片漆黑，新加坡看起来就像一团火。许多船被击沉了，海面上都是残骸。”这是1942年新加坡沦陷后，来自乘船逃难者的口述。空袭、肃清、占领、酷刑……火光之下，映照出的是日本军国主义曾给地区人民带来的战争伤痛。\r\n\n　　近期新加坡的一影一书一展，记录下了这团火。动画电影《沧海琴声》讲述了两位青梅竹马的天才小提琴手因音乐结缘，却在日军入侵新加坡后被迫分离、梦想破碎。书籍《铭记昭南》收录80件新加坡日据时期的信件、证件等实物，还原了日军占领时期普通人对家庭离散、亲人遭凌辱的恐惧、挣扎和苦难。新加坡国家博物馆“新加坡历史展厅”，则重现了新加坡人民在日据时期历经苦难、奋起抗争的历史。\n\n　　这团火烧的是普通人的生计，让生灵涂炭、家破人亡。新加坡沦陷后，日军以“清除反日分子”为名，进行大规模“肃清行动”。凡18至50岁华人男性都须强制接受“检证”，数万平民被随意判定为“可疑分子”押往海滩、郊野残忍杀害。大量劳力被强征，许多人因饥饿、疾病、虐待和过劳而死。日军还大肆掠夺战略物资，强迫缴纳“奉纳金”，大量印制“蕉币”，让无数家庭生活难以为继。《沧海琴声》中的抗日志士林谋盛的狱友曾控诉日军：“毒刑苛政，暴敛横征，折磨战俘，肃清检证，残害人道，罪恶滔天。”新加坡国家博物馆展出惹兰培本等乱葬岗出土的踝环、眼镜、子弹壳等，件件都浸满了当地民众的血泪。\n\n　　这团火烧的是国家的尊严，让文化被抹杀、国民遭凌辱。日军将新加坡改名“昭南岛”，强制推行奴化教育，进行洗脑和思想控制。日军在当地设立多处“慰安所”，诱骗、强征女性充当“接待妇”，对反抗者施以酷刑，对怀孕、染病等“失去价值者”则秘密处死。《铭记昭南》收录了一张1942年的结婚证，因为当时有人认为已婚女性或可避免被凌辱，就匆忙结婚；书中还有一幅漫画，描绘了当地女性浑身赤裸、惨遭日军凌辱致死的画面。这些人间惨剧还并非全部。日军还在新加坡设立了“冈字9420部队”，作为731部队在东南亚的分支，大规模饲养老鼠，培养染疫跳蚤，实施惨无人道的人体实验，并向东南亚多地和中国西南地区投放细菌武器，造成大量平民伤亡。近期新加坡媒体制作播出纪录片《揭秘731部队》，揭开了这段被刻意掩埋的历史。\n\n　　这团火不仅烧过新加坡。它烧过中国，造成逾3500万军民伤亡，仅南京大屠杀就有30多万平民遇难；烧过菲律宾，马尼拉大屠杀1个月内超10万人丧生；烧过印度尼西亚，饥饿、劳役和屠杀共造成约400万印尼人死亡；烧过马来西亚，槟城博物馆至今还留着日军强征“慰安妇”暴行的证据；烧过缅甸、泰国，泰缅415公里“死亡铁路”共造成十多万劳工惨死，平均每公里死亡约360人，相当于每修建10米就有2至3人付出生命代价；烧过越南，1944年至1945年因日军残酷掠夺饿死约200万人。即便是这些，也仅仅是亚洲被侵略国家共同记忆的冰山一角。\n\n　　如今，艺术家们把散落民间的记忆和文物一件件拾起，真实再现这段风雨如晦的岁月，再次令世人动容。《沧海琴声》在国际上屡获大奖，导演接受采访时提到，社交媒体上很多人留言表示深受触动，特别是不少韩国观众对新加坡遭受的殖民创伤感同身受，对主人公坚持理想、反抗侵略产生强烈共鸣。新加坡历史展厅观展游客往来如织，人们在乱葬岗出土的遗物前驻足，回望那段被岁月尘封的苦难。越来越多年轻人愿意去了解，因为那是自己国家的真实过往，是由无数同胞的伤痛与血泪书写而成，它不该也不能被遗忘。\n\n　　然而，受害者伤痕犹在，加害者却试图淡忘。硝烟虽已远去，但日本军国主义仍阴魂不散。今年是东京审判开庭80周年。在本该回顾历史、反思过去的时刻，日本右翼势力却罔顾东京审判历史定论，极力否认甚至美化侵略历史，公然将二战甲级战犯奉若神明，加速推进“再军事化”，意图冲破战后体制束缚，再次成为一个能战国家。这不能不给本地区民众敲响警钟。因为，维护地区和平，不让战火重燃，是亚洲各国所有爱好和平人士的共同心声。(完)\n\n　　(作者系国际问题观察员 周亚欣) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c39855c0749","title":"浙江文旅观察：秀山丽水缘何看重“疗休养”？","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734966.shtml","summary":"中新网丽水11月19日电(周健)初冬时节，浙江丽水空气清新、阳光明媚。","summary_short":"中新网丽水11月19日电(周健)初冬时节，浙江丽水空气清新、阳光明媚。","digest":"初冬时节，浙江丽水空气清新、阳光明媚","points":["中新网丽水11月19日电(周健)初冬时节，浙江丽水空气清新、阳光明媚","19日，云和梯田旁的民宿内，一批来自江苏的职工赏山水、品香茶，享受疗休养的惬意时光","而在相隔10多公里的云和县城，“我在丽水疗休养”第七届秀山丽水疗休养区域协作暨丽水全域旅游联…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:41:33+08:00","size":1,"keywords":[],"body":"中新网丽水11月19日电(周健)初冬时节，浙江丽水空气清新、阳光明媚。19日，云和梯田旁的民宿内，一批来自江苏的职工赏山水、品香茶，享受疗休养的惬意时光。而在相隔10多公里的云和县城，“我在丽水疗休养”第七届秀山丽水疗休养区域协作暨丽水全域旅游联盟资源对接活动启幕，氛围火热。\n\n　　“我们衷心期待，各位工会同仁多组团、多送客，各文旅企业多对接、多合作，共同把‘我在丽水疗休养’这张金名片擦得更亮。”活动上，丽水市委常委、副市长人选楼琅坚发出诚挚邀约。\n\n　　地处浙西南山区，丽水为何如此看重疗休养？答案，蕴藏在得天独厚的生态底色、厚重鲜活的千年文脉之中，更写在生态价值转化、推进共同富裕的发展考卷上。\n\n　　山水文脉 筑牢根基\n\n　　丽水，九山半水半分田，优越的生态本底，是疗休养产业行稳致远的根基。在这里，山是江浙之巅，水是六江之源，全市森林覆盖率80.81%，生态环境质量指数连续22年位居浙江首位，拿下国家生态文明先行示范区、中国气候养生之乡等多张“金名片”。\n\n　　一县一域，皆是精彩；一山一水，皆可入景。\n\n　　以云和为例，境内千米以上山峰多达184座，是丽水首个国家级生态县。全国首个梯田型5A级景区云和梯田坐落于此，千层叠田、千米落差、万亩云海，享有“中国最美梯田”的美誉；浙江第三大人工湖云和湖烟波浩渺，高山平湖的独特景致，十分适合泛舟览胜、亲水休闲。\n\n　　“云和坐拥好山好水好空气，既是打卡出片的观光胜地，也是养眼、养肺、养心、养身的康养福地。”云和县委副书记，代县长何子儋说。\n\n11月19日，浙江云和梯田景区稻浪翻滚。　孙杨洋 摄\n\n　　生态为骨，文化铸魂。缙云黄帝文化源远流长，龙泉青瓷宝剑匠心传承，青田石雕巧夺天工，景宁畲歌婉转悠扬……一个个沉淀于绿水青山间的文化瑰宝，为丽水疗休养增添了吸引力。\n\n　　“丽水疗休养，卖的不是一张床、一顿饭，而是一段有文化厚度、有情感温度的体验。”楼琅坚介绍，丽水推动产品从“通用款”向“定制款”升级，“亲子+非遗”“康养+红色”等主题线路逐渐形成体系，让不同群体都能找到属于自己的丽水打开方式。\n\n　　资源活化 价值可期\n\n　　疗休养，一头连着职工福祉，一头连着乡村振兴和生态转化。丽水手握优质资源，发展疗休养产业，何乐而不为？\n\n　　时光回溯到2015年，丽水疗休养基地数量上千，规模位居浙江省前列，却因分散的格局，陷入“养在深闺无人识”的困境。缺少辨识度高、辐射力强的品牌，成为产业发展的瓶颈。\n\n　　2023年，丽水提出“双项服务、三提三推、久久为功”12字方针，标志着工会疗休养全面转型产业化发展，“我在丽水疗休养”品牌应运而生。随后，丽水不断完善全域服务体系、深化跨区域资源协作，疗休养有效带动民宿餐饮、乡村文旅、农特产品销售等产业发展，培育了大量家门口就业岗位。\n\n　　多年精耕细作之下，“我在丽水疗休养” 逐步成长为响当当的金字招牌。目前，丽水已和浙江省内外150多家工会、企事业单位建立深度合作，年接待疗休养职工超20万人次，带动消费突破6亿元。丽水全市85%的疗休养站点扎根山区，助力3.3万名民众实现就近就业。\n\n　　政策赋能 活力迸发\n\n　　要想让更多职工走进丽水、留在丽水、记住丽水，既需要山水文化的“硬实力”，更离不开政策红利的“软环境”。\n\n　　当天活动现场，丽水九个县(市、区)文旅送团奖励政策和丽水文旅集团疗休养优惠礼包发布，为丽水疗休养产业发展图标注下“诚意坐标”。\n\n　　譬如，云和面向招徕县外团队赴云旅游的旅行社设置阶梯奖励：一日游按景区门票、内部交通费的15%予以奖励；团队住宿1晚，按住宿费的20%奖励，住宿两晚及以上，自第二晚起按住宿费的30%奖励。青田针对旅行社组织过夜旅游团队，按年住宿发票金额16%给予奖励；县外来青疗休养职工团队10人以上并住宿，每人发放“青田游礼”B套餐消费券……\n\n活动现场。　主办方 供图\n\n　　“近些年，云和文旅资源持续挖掘开发，市场上对疗休养的需求也十分旺盛。我们迫切需要一个平台，打通供给端和市场端之间的通道。”云和县文广旅体局党组成员、副局长蓝夏薇说，本次活动，既能让市场主体充分了解云和乃至丽水的山水禀赋，也全方位展示了接待配套等方面的综合服务能力。\n\n　　活动尾声设置自由洽谈环节，参会嘉宾、企业代表面对面深入交流、洽谈合作。景宁花动畲乡旅行社有限公司负责人马金波表示，丽水九个县(市、区)各有特色，这次集中晒出奖励政策，对旅行社来说吸引力十足，公司计划把景宁畲族元素和周边县域资源串珠成链，带动更多人来丽水疗休养。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3a50723a55","title":"四川推出25项举措提升大小凉山公共法律服务 慢火车成为“流动法治课堂”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734963.shtml","summary":"中新网西昌11月19日电 (程兆)四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服务三年行动，配套25项举措。","summary_short":"中新网西昌11月19日电 (程兆)四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服务三年行动，配套25项举措。","digest":"四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服务三年行动，配套25项举措","points":["中新网西昌11月19日电 (程兆)四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服…","19日，四川省人民政府新闻办公室在老成昆线西昌站举行第八期《发言人在现场》新闻发布活动…","四川还组建24人的“小快灵”普法宣讲师资库，将双语课堂搬进院坝、集市和校园"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:37:31+08:00","size":1,"keywords":[],"body":"中新网西昌11月19日电 (程兆)四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服务三年行动，配套25项举措。19日，四川省人民政府新闻办公室在老成昆线西昌站举行第八期《发言人在现场》新闻发布活动，介绍相关部署及慢火车普法实践。\n\n11月19日，四川省人民政府新闻办公室在老成昆线西昌站举行第八期《发言人在现场》新闻发布活动，介绍有关部署及慢火车普法实践。四川省人民政府新闻办公室 供图\n\n　　四川省司法厅公共法律服务管理处副处长李孟锦介绍，脱贫攻坚后，易地搬迁、外出务工、土地流转等带来新的法律需求。大小凉山基本公共法律服务虽已全覆盖，仍存在服务半径大、双语服务力量不足等困难。三年行动从设施建设、精准普法、法律援助、纠纷化解和人才培养五方面发力。在法律援助方面，四川已组建“四川同心·法律服务团”，组织19家律所119名律师对口帮扶19个县(市、区)；在矛盾纠纷化解方面，将规范推广“德古+”(“德古”是彝族传统民间调解人)调解模式。四川还组建24人的“小快灵”普法宣讲师资库，将双语课堂搬进院坝、集市和校园。\n\n　　老成昆线上的公益性慢火车，也成为流动法治课堂。成都铁路运输中级法院副院长徐翔介绍，这趟往返攀枝花与普雄的慢火车穿行大凉山50余年，途经38个乡镇、辐射周边97个乡镇，最低票价2元，是沿线民众重要的出行工具。近年来，成都铁路运输两级法院与中国铁路成都局集团有限公司共同打造“彝乡情·法治慢火车”。法院发放300余份问卷、开展10余次重点访谈，梳理出未成年人保护、彩礼纠纷、山货交易等普法内容，并将车厢咨询与沿线站点调解衔接。\n\n　　徐翔分享此前一次普法课经历：法官讲述一名学生被起侮辱性绰号、照片遭网络群嘲的案例后，一名10岁彝族女孩准确说出了名誉权和肖像权。孩子们还知道遇事可告诉老师、家长，并保留证据。“当孩子把‘被欺负了怎么办’从模糊的委屈转化为清晰的权利认知，这趟普法列车就没有白跑。”徐翔说。\n\n　　慢火车上的普法内容还涉及生态保护。成都铁路运输第二法院四川大熊猫国家公园生态法庭庭长冯文婷介绍，该庭五年来审理环境资源案件650余件。此前，一名乘客在车上质疑林木采伐规定，法官耐心解释了一路。临下车时，这名乘客主动添加了法官的工作微信，此后还多次咨询法律问题。\n\n　　的莫鸽鸽是省级“小快灵”普法宣讲团成员，从事基层普法40余年。她说，以前村寨纠纷多由长者按传统习俗调解，如今民众更愿主动向村干部、司法所等求助。“从我们‘追着老百姓普法’变成了‘民众主动找上门问法’。”(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c38807a1257","title":"“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动举办","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734960.shtml","summary":"中新网陕西商洛11月19日电 (记者 阿琳娜)“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动18日在秦岭博物馆举办。","summary_short":"中新网陕西商洛11月19日电 (记者 阿琳娜)“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动18日…","digest":"“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动18日在秦岭博物…","points":["活动设置主题讲座、互动交流等环节，搭建起中欧山地文明对话平台，推动秦岭文化走向世界","德累斯顿工业大学物质文化遗产方向古代史名誉教授雷诺·沃康摩尔带来题为《阿尔卑斯山脉…","陕西省人大环境与资源保护委员会副主任委员党双忍以《世界昆仑：文明贯通的脊梁》为题作主旨讲座"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:28:03+08:00","size":1,"keywords":[],"body":"中新网陕西商洛11月19日电 (记者 阿琳娜)“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动18日在秦岭博物馆举办。活动设置主题讲座、互动交流等环节，搭建起中欧山地文明对话平台，推动秦岭文化走向世界。\n\n“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动在秦岭博物馆举办。秦岭博物馆供图\n\n　　德累斯顿工业大学物质文化遗产方向古代史名誉教授雷诺·沃康摩尔带来题为《阿尔卑斯山脉：欧洲历史的十字路口》专题分享。陕西省人大环境与资源保护委员会副主任委员党双忍以《世界昆仑：文明贯通的脊梁》为题作主旨讲座。\n\n　　在互动环节，主讲嘉宾就中欧山地文化的共性特征与文明差异、博物馆创新实践、“世界昆仑”视域下秦岭的文明价值等话题与现场观众进行交流。\n\n　　此次活动以秦岭与阿尔卑斯山脉为纽带，传承古丝绸之路交流互鉴精神，搭建起中欧山地文明交流平台，为东西方文博领域学术对话、互学互鉴提供实践载体。秦岭博物馆将以本次交流为契机，持续推进秦岭文化国际传播，推动中欧博物馆行业建立常态化交流协作，为促进不同文明交流互鉴贡献力量。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1d78c284fa","title":"河北衡水七旬老人手缝爱心坐垫 温暖候车人","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075506.shtml","summary":"11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上。","summary_short":"11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上。","digest":"11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上","points":["11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上","2024年一场大雪后，崔素英心疼候车人坐在冰凉的长凳上，便开始用旧布料手工缝制棉坐垫","此后每年冬天，她都会穿梭在大街小巷，定期巡查、修补、更换棉坐垫…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:17:30+08:00","size":1,"keywords":[],"body":"11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上。据了解，2024年一场大雪后，崔素英心疼候车人坐在冰凉的长凳上，便开始用旧布料手工缝制棉坐垫。此后每年冬天，她都会穿梭在大街小巷，定期巡查、修补、更换棉坐垫，用一针一线温暖着这个城市的候车人。(刘汇斌 王红 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/E3404A45BCD048F28025261DE37A4FCC.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c32bb652b4c","title":"在深圳“最难约”红树林打卡地 偶遇“鸟中大熊猫”","url":"https://www.chinanews.com/sh/shipin/2026/11-19/news1075504.shtml","summary":"听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一。","summary_short":"听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一。","digest":"听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一","points":["听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一","这是全国唯一处在城市腹地、面积最小的国家级自然保护区","这里有大片的红树林，但为什么是绿色的"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:03:52+08:00","size":1,"keywords":[],"body":"听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一。这是全国唯一处在城市腹地、面积最小的国家级自然保护区。这里有大片的红树林，但为什么是绿色的？红树林不仅能防风消浪，还为大量生物提供了栖息的家园。在红树林，我们偶遇“鸟中大熊猫”黑脸琵鹭吃“下午茶”，还似乎听到了野猪的声音……(记者 高萌 任帅)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/28CE48E57B7C44B0A7E7A52C255DE47D.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cb274d63394","title":"琼州海峡智能航运示范工程在海口启动","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734950.shtml","summary":"中新网海口11月19日电 (贾浪博)琼州海峡智能航运示范工程启动仪式19日在海口举行，标志着琼州海峡智能航运建设迈入实质推进阶段。","summary_short":"中新网海口11月19日电 (贾浪博)琼州海峡智能航运示范工程启动仪式19日在海口举行…","digest":"琼州海峡智能航运示范工程启动仪式19日在海口举行…","points":["中新网海口11月19日电 (贾浪博)琼州海峡智能航运示范工程启动仪式19日在海口举行…","琼州海峡是国家重大战略通道，是海南自由贸易港对外联通的咽喉要道","为深入贯彻交通强国、海洋强国战略，落实《国务院关于深入实施“人工智能+”行动的意见》和交通运…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T22:01:25+08:00","size":1,"keywords":[],"body":"中新网海口11月19日电 (贾浪博)琼州海峡智能航运示范工程启动仪式19日在海口举行，标志着琼州海峡智能航运建设迈入实质推进阶段。\n\n　　琼州海峡是国家重大战略通道，是海南自由贸易港对外联通的咽喉要道。为深入贯彻交通强国、海洋强国战略，落实《国务院关于深入实施“人工智能+”行动的意见》和交通运输部等四部委印发的《智能航运2030行动计划》，依托琼州海峡固定航线、高频往返、港航衔接紧密的典型场景，启动该示范工程。\n\n　　工程坚持“创新驱动、场景牵引、船岸一体、安全可控”，汇聚政府、行业机构、院所、企业等多方力量，协同推进智能航运关键技术攻关，开展真实航线下的系统集成与实景验证，打造复杂水域客滚运输智能航运样板。\n\n11月19日，琼州海峡智能航运示范工程启动仪式在海口举行。贾浪博 供图\n\n　　启动仪式上，交通运输部相关司局、中国船级社、粤琼两省海事与交通运输主管部门、中远海运集团相关负责人先后致辞。各方一致认为，示范工程是落实《智能航运2030行动计划》的重要举措，对保障琼州海峡客滚运输安全畅通、提升航运智能化水平、服务海南自贸港建设具有重要意义；将加强跨层级、跨区域协同，推动标准共建、数据互通、监管联动，形成“技术研发-场景验证-制度适配”闭环。\n\n　　据悉，下一步各参与方将稳妥推进智能航运技术先行先试，同步完善适配智能船舶的监管治理与标准规范。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4e18535348","title":"新华视点｜一地一特色 看乡土大地的丰收与青绿","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734946.shtml","summary":"安徽阜阳：错峰小辣椒 种出大产业  　　眼下，安徽省阜阳市阜南县会龙镇3.5万亩延秋辣椒迎来采收高峰。","summary_short":"安徽阜阳：错峰小辣椒 种出大产业  　　眼下，安徽省阜阳市阜南县会龙镇3.5万亩延秋辣椒迎来采收高峰。","digest":"安徽阜阳：错峰小辣椒 种出大产业  　　眼下…","points":["安徽阜阳：错峰小辣椒 种出大产业","眼下，安徽省阜阳市阜南县会龙镇3.5万亩延秋辣椒迎来采收高峰","当地辣椒产业已发展30余年，辣椒畅销全国60多个城市…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:50:57+08:00","size":1,"keywords":[],"body":"安徽阜阳：错峰小辣椒 种出大产业\n\n　　眼下，安徽省阜阳市阜南县会龙镇3.5万亩延秋辣椒迎来采收高峰。当地辣椒产业已发展30余年，辣椒畅销全国60多个城市，并形成年交易额近20亿元的区域性蔬菜交易中心，带动1.2万余名群众全产业链就近增收。同时，当地以“我为企业找市场”等活动搭建产销对接平台，为农户找订单、找市场，通过小小辣椒持续推动乡村振兴。\n\n　　江西南昌：丰收路上有个“暖心家”\n\n　　南昌县是江西的产粮大县，今年晚稻收割期间，为了解决跨区作业的农机手停靠难、休息难、补给难等难题，南昌县塘南镇以紧邻昌万公路的主驿站为核心，联动各村党群服务中心，打造“1+N”秋收驿站农机大本营。\r\n\n　　河北临漳：初冬韭菜喜丰收 特色产业富农家\n\n　　初冬时节，河北省临漳县韭菜进入采收旺季，田间地头一派繁忙的丰收景象。\n\n　　四川合江：柚满枝头促增收\n\n　　时下正是四川省泸州市合江县真龙柚成熟上市的时候。真龙柚是合江县独有的地方柚类品种，也是国家地理标志保护产品，口感清甜脆嫩，深受消费者喜爱。目前，合江县真龙柚种植面积达到30.8万亩，今年预计总产量约8.5万吨，综合产值达11亿元，全县400余家专业合作社、经营主体带动10万余人参与产业发展，果农人均年增收2000元以上。\n\n　　板上逐光造绿电 板下治沙“点沙成金”\n\n　　板上逐光造绿电，板下修复治黄沙。石嘴山市着力盘活大面积闲置荒漠资源，在毛乌素沙地实施100万千瓦光伏发电复合项目，让2.5万亩荒漠变宝地，真正实现“点沙成金”。\n\n　　新疆尉犁县：黄沙碧水映胡杨\n\n　　近日，在塔克拉玛干沙漠北缘，新疆尉犁县160万亩胡杨林进入最佳观赏期。从漫漫黄沙渐进，乘舟泛于塔里木河水面，胡杨扎根河水下的沙土，倒影映照，波光粼粼。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4d58636daf","title":"从“国际手账”看深圳！三个现场读懂创新之城“待客之道”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734945.shtml","summary":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行","这是中国第三次，也是时隔12年再次担任APEC东道主","深圳地铁运营总部党委副书记屈恩久介绍，岗厦北综合交通枢纽采用“ T”字形布局，共五层…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:49:25+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行。这是中国第三次，也是时隔12年再次担任APEC东道主。\n\n　　有朋自远方来，不亦乐乎。近日，记者穿行于深圳多处城市场景，从岗厦北枢纽九秒钟顺畅换乘，到华强北“一米柜台”高效出货，再到写满各国客商留言的手账，深圳把“开放、创新、合作”写进城市日常，以务实、鲜活的“待客之道”助力共同繁荣的亚太新未来。\n\n　　看得见的便利，是待客的第一层。\n\n　　路怎么走、票怎么买，深圳替八方来客想到了前头。\r\n\n　　早高峰刚过，深圳岗厦北地铁站依然人流如织。记者从14号线站台出发，换乘11号线，掐表计时，全程仅用了9秒。\n\n　　深圳地铁运营总部党委副书记屈恩久介绍，岗厦北综合交通枢纽采用“ T”字形布局，共五层、23个出入口，总建筑面积约23万平方米，共5条地铁在此汇聚，串联起深圳各个片区。\n\n　　枢纽采用“交通＋商业”一体化开发，每天都有超过40万人次客流在这里集散，都可享受出行、休闲一站式服务。\n\n　　走进安检口，支持30多种语言实时翻译的多语种显示屏映入眼帘，极大提高了地铁工作人员与不同语言国家游客的沟通效率。“客人出行，最先想知道路线情况。”屈恩久说，为了让外国朋友“看得懂、走得顺”，对全线中英文标识进行全面检查和规范，并对一线工作人员开展外语专项培训。\n\n　　目前，深圳地铁全线网17条运营线路、432座车站已全面支持中国银联、Visa、万事达卡、美国运通、JCB五大卡组织的银行卡“拍卡过闸”，可受理200多个国家和地区发行的银行卡。境外旅客无需兑换现金或购买本地交通卡，将银行卡靠近闸机感应区即可立刻通行。\n\n　　愿分享的创意，是待客的第二层。\n\n　　开放待客的底气，根植于源源不断的创新活力中，体现在高效完备的产业生态上。\n\n　　“上午设计、下午打样、次日量产、一周出海。”在华强北，这不是一句口号，而是落地的日常。\n\n　　从上世纪80年代的“一米柜台”起步，华强北一路成长为“中国电子第一街”。如今，1.45平方公里的街区聚集着11.5万家商事主体，超百万种电子元器件，形成研发、打样、量产、出海可在步行一公里内完成的创新链条，支持AI眼镜、智能硬件、机器人等新品快速落地。\n\n　　“一个创意进，一个产品出。”华强北全球智能硬件定制体验中心负责人王强说，创客们可以在华强北快速找到创造灵感，并且快速链接供应链的资源。把图纸变成样机，把样机变成订单。\n\n　　数据显示，华强北电子产品出口覆盖全球190多个国家和地区，日均海外客商流量超7000人次，商圈年交易额突破4000亿元。\n\n　　“这里可看的东西太多了。昨天我们又多买了一个行李箱，准备带一整箱中国产品回去。”一位外国游客感慨，“在深圳，我看到了未来的图景。”\n\n　　留得下的情谊，是待客的第三层。\n\n　　交朋友，终究讲究以诚相待、以心相交。深圳以真心待客，图的是常来常往。\n\n　　在华强北一处6平方米的档口，老板邓贵华有本“国际手账”。手账里记下了来自世界各地客商的签名、合影，以及他们的故事。不到一年间，这本相册已经汇集了来自87个国家和地区顾客的签名与合影，涵盖全部21个APEC成员经济体。\n\n　　“最开始我只是在朋友圈分享这些相遇。后来转念一想，不如亲手留存下来，往后翻看都是非常有意义的纪念。”邓贵华说，纵然语言沟通存在障碍，但从一页页工整字迹里，能够读懂各国友人传递的善意和祝福。\n\n　　言语有界，民心相通。透过这方寸柜台，透过深圳这扇中国改革开放的窗口，世界触摸到一个更加开放包容的中国。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c1006f7ba","title":"何以中国｜唐韵润古邑 诗脉续长安","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734943.shtml","summary":"中国日报网11月19日电 山河更迭，风雅长存。","summary_short":"中国日报网11月19日电 山河更迭，风雅长存。","digest":"中国日报网11月19日电 山河更迭，风雅长存","points":["中国日报网11月19日电 山河更迭，风雅长存","11月19日，“何以中国·诗词里的千年文脉”网络主题宣传活动于古都西安启幕","纵使时代千帆竞发、科技日新月异，古典诗词始终沉淀着华夏儿女的家国情怀与人生哲思…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:47:14+08:00","size":1,"keywords":[],"body":"中国日报网11月19日电 山河更迭，风雅长存。11月19日，“何以中国·诗词里的千年文脉”网络主题宣传活动于古都西安启幕。纵使时代千帆竞发、科技日新月异，古典诗词始终沉淀着华夏儿女的家国情怀与人生哲思，是镌刻民族风骨的精神根脉。千年长安承唐风诗韵，以全域深耕的文化建设，探寻古典文脉古今赓续的新生之路。\r\n\n　　为活化传承唐诗文化、擦亮千年古都文化名片，西安于2025年9月出台唐诗文化品牌专项建设方案。城市锚定三年建设目标，蓄力在2027年底打造享誉海内外的国际化“唐诗之都”。整套建设体系多维布局、层层落地，涵盖文史研究、古艺遗存保护、文商旅融合发展、文化品牌打造、数字文创升级五大维度，细化为多项落地举措。\n\n　　今朝长安，一城街巷皆诗意，千载风雅入寻常。曲江飞行剧院依托前沿光影技术，复刻盛唐坊市盛景，让观者凌空入梦、尽览大唐风华。长安十二时辰主题街区完整复刻唐代里坊格局，以实景街巷、唐风演艺、飞花对诗、市井雅集还原盛唐烟火，诗词意蕴融于一砖一瓦、一言一行之间。大唐不夜城古韵流转，沉浸式诗词互动频频上演，游人穿行其间，与千年诗魂隔空相逢，从观景的过客变为入画的归人。\n\n　　长安云·“一带一路”城市展示体验中心里集章寻诗、AI题诗、VR等新潮雅致的轻量体验，降低了古典诗词的品鉴门槛。科技赋能、业态创新皆为传文载道的良器，让古韵经典走近青年、焕发新生，形成乐于体验、乐于分享、乐于传承的文化新风尚。\n\n　　诗韵藏于碑石，故事演于舞台。《长恨歌》实景演出以骊山为幕、华清池为台，将千古名篇化作山水间的歌舞长卷，字句里的悲欢情思，伴着光影流水娓娓道来。西安碑林博物馆碑碣林立，历代名家笔墨镌刻石上，诗文书迹同存，一笔一画皆是古人的风雅心境。小雁塔与西安博物院静立城南，古塔悠悠，馆藏丰富，在古塔、文物与史籍之间，静静铺展属于长安的诗史长卷，让访客在驻足观览间，读懂唐诗扎根的历史土壤。\n\n　　文脉传承的至高境界，从来不是束之高阁的研读，而是融于烟火的共生。让千年经典走出古籍书卷，嵌入城市肌理、浸润百姓生活，让每一个普通人都能与风雅不期而遇。当一句唐诗、一抹唐韵，总能治愈人心、触动情怀，华夏文脉便完成了从文字典籍到精神血脉、从一时热度到长久生命力的升华。这便是“何以中国”，藏在千年诗韵里的文化答案。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c33dfd99c79","title":"江西发现植物新种华东堇菜","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734940.shtml","summary":"中新社江西抚州11月19日电 (朱莹)记者19日从江西马头山国家级自然保护区管理局获悉，江西马头山国家级自然保护区与中山大学科研团队在开展生物多样性调查时发现堇菜属植物新物种——华东堇菜。","summary_short":"中新社江西抚州11月19日电 (朱莹)记者19日从江西马头山国家级自然保护区管理局获悉…","digest":"记者19日从江西马头山国家级自然保护区管理局获悉…","points":["中新社江西抚州11月19日电 (朱莹)记者19日从江西马头山国家级自然保护区管理局获悉…","该研究成果于11月17日发表在国际植物分类学期刊《北欧植物学杂志》上","“科研团队在马头山采集活体标本与分子材料，并结合大量历史标本进行比对…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:46:44+08:00","size":1,"keywords":[],"body":"中新社江西抚州11月19日电 (朱莹)记者19日从江西马头山国家级自然保护区管理局获悉，江西马头山国家级自然保护区与中山大学科研团队在开展生物多样性调查时发现堇菜属植物新物种——华东堇菜。\n\n　　该研究成果于11月17日发表在国际植物分类学期刊《北欧植物学杂志》上。\n\n　　“科研团队在马头山采集活体标本与分子材料，并结合大量历史标本进行比对，最终确认该植株为未被报道过的新物种。”江西马头山国家级自然保护区管理局高级工程师熊宇介绍，目前已知该物种仅分布于江西马头山国家级自然保护区山谷岩缝生境，海拔约685米。因其杂交后代广布于华东，主要分布在安徽黄山、浙江天目山一带，故命名为华东堇菜。\n\n2024年3月，江西马头山国家级自然保护区发现堇菜属植物新物种——华东堇菜。熊宇 摄\n\n　　华东堇菜隶属于堇菜科堇菜属，为多年生草本植物，植株高3至10厘米，根状茎短粗，无匍匐茎，根状茎分枝，顶部基生叶莲座状。叶片卵形、基部心形、叶缘具细圆齿；花瓣淡紫色，侧瓣具须毛，基部无黄斑，花期为3月至4月，夏秋季具闭锁花。\n\n　　科研调查显示，该新种生境特异性强、自然分布范围狭窄、野生种群数量稀少，具备极高的物种独特性与科研价值。\n\n2025年2月，江西马头山国家级自然保护区发现堇菜属植物新物种——华东堇菜。熊宇 摄\n\n　　据介绍，华东堇菜的发现进一步丰富了中国堇菜属植物的物种多样性，为东亚地区堇菜属植物的分类学研究和系统演化分析提供了新的材料，其发现和研究对于区域珍稀植物资源保护及生物多样性保护工作具有重要意义。\n\n　　地处江西省资溪县境内的马头山保护区是武夷山脉生物多样性核心区域，有着“罕见的动植物基因库”之称，已查明分布有高等植物270科1078属2938种，其中国家重点保护植物41种。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0270794233","title":"全国首家省级政校协同网络交易研究院在黑龙江揭牌成立","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734895.shtml","summary":"中新网哈尔滨11月19日电 (韩雪)11月19日，黑龙江省网络交易研究院揭牌仪式在哈尔滨举行。","summary_short":"中新网哈尔滨11月19日电 (韩雪)11月19日，黑龙江省网络交易研究院揭牌仪式在哈尔滨举行。","digest":"11月19日，黑龙江省网络交易研究院揭牌仪式在哈尔滨举行","points":["中新网哈尔滨11月19日电 (韩雪)11月19日，黑龙江省网络交易研究院揭牌仪式在哈尔滨举行","该研究院由黑龙江省市场监管局与黑龙江职业学院共建…","随着黑龙江直播电商、社交电商、跨境电商等新业态快速崛起，网络零售持续激活消费市场活力"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:25:49+08:00","size":1,"keywords":[],"body":"中新网哈尔滨11月19日电 (韩雪)11月19日，黑龙江省网络交易研究院揭牌仪式在哈尔滨举行。该研究院由黑龙江省市场监管局与黑龙江职业学院共建，系全国首家省级政校协同打造的网络交易专项研究机构，将以产学研融合模式，护航地方平台经济、数字经济规范有序发展。\r\n\n　　随着黑龙江直播电商、社交电商、跨境电商等新业态快速崛起，网络零售持续激活消费市场活力。新业态蓬勃发展的同时，平台规则不规范、虚假营销、刷单炒信、大数据杀熟等乱象频发，对网络交易监管制度、技术手段与执法能力提出更高要求，专业智库支撑迫在眉睫。\n\n　　此次政校合作实现优势互补、精准赋能。黑龙江省市场监管局整合各级反垄断、反不正当竞争典型案例，归集行业数据与一线执法经验，为科研工作提供法治支撑与实务参考。黑龙江职业学院依托师资科研与专业实践优势，紧扣数字龙江建设和新质生产力发展要求，深耕网络交易监管、平台治理、智慧监管等重点领域课题研究。\n\n　　据悉，研究院将建立常态化科研产出机制，聚焦多项核心工作。持续跟进电商相关法律法规落地落实，开展制度预研与优化论证；常态化开展平台合规评估，针对各类电商新业态，提供科学差异化监管建议；搭建网络市场监测体系，建立风险预警机制，完善电子数据取证规范。\n\n　　此外，研究院将总结执法办案经验，优化跨区域案件协同处置机制，深耕对俄沿边网络交易监管特色研究。同时常态化开展学术交流、行业合规培训与专业人才培养，打造集政策研究、风险研判、合规服务、人才培育于一体的专业化省级智库，助力龙江数字经济与实体经济深度融合发展。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdbaa71b738","title":"重庆设立多式联运仲裁中心 护航西部陆海新通道高水平对外开放","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734847.shtml","summary":"中新网重庆11月19日电 (记者 刘相琳)第三届西部陆海新通道国际商事仲裁论坛19日在重庆举行。","summary_short":"中新网重庆11月19日电 (记者 刘相琳)第三届西部陆海新通道国际商事仲裁论坛19日在重庆举行。","digest":"第三届西部陆海新通道国际商事仲裁论坛19日在重庆举行","points":["中新网重庆11月19日电 (记者 刘相琳)第三届西部陆海新通道国际商事仲裁论坛19日在重庆举…","会上，重庆设立的多式联运仲裁中心正式揭牌，三项实务成果集中发布…","重庆仲裁委员会(重庆国际商事仲裁院)相关负责人介绍，今年10月…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:23:57+08:00","size":1,"keywords":[],"body":"中新网重庆11月19日电 (记者 刘相琳)第三届西部陆海新通道国际商事仲裁论坛19日在重庆举行。会上，重庆设立的多式联运仲裁中心正式揭牌，三项实务成果集中发布，57家境内外单位共同签署跨境商事争议仲裁解决共识，为西部陆海新通道高水平对外开放提供法治支撑。\n\n图为论坛现场。中新网记者 周毅 摄\n\n　　重庆仲裁委员会(重庆国际商事仲裁院)相关负责人介绍，今年10月，《联合国可转让货物单证公约》(NCD公约)在加纳举行签约仪式，包括中国、加纳在内的26个国家成为首批签约国。NCD公约构想源于重庆等地企业在中欧贸易中创造性使用跨境铁路运单开展融资的探索实践，将海运提单的物权凭证效力拓展至铁路、公路等陆上运输方式，新业态催生的新型争议亟待配套专业纠纷解决机制。\n\n　　该负责人表示，重庆是西部陆海新通道物流和运营组织中心，拥有多式联运“一单制”先行先试经验和国际商事仲裁中心试点优势，率先成立多式联运仲裁中心，旨在精准回应多式联运领域纠纷化解的现实需求。\n\n　　据介绍，该中心是重庆仲裁委员会下设的专业化仲裁平台，主要面向跨境贸易、多式联运市场主体开展仲裁法律宣传、培训和咨询服务，依法解决可转让货物单证及多式联运相关商事纠纷，统筹推进调仲衔接，为相关争议提供专业高效的仲裁保障。\n\n　　论坛上，重庆仲裁委员会(重庆国际商事仲裁院)联合境内外仲裁机构、律师协会、商协会、企业、高校等57家单位，共同签署发布《西部陆海新通道跨境商事争议仲裁解决共识》，围绕共同营造开放稳定包容的区域法治环境、共同推进仲裁专业高效解决跨境贸易争议、建设适应通道贸易特点的仲裁程序机制、提升适应贸易数字化发展的仲裁服务能力、完善仲裁与调解多元解纷衔接机制、深化相关国家仲裁合作与资源共享六个方面提出倡议。\n\n　　论坛现场，重庆仲裁委员会(重庆国际商事仲裁院)发布了中英双语版本《重庆仲裁委员会可转让货物单证仲裁规则》，同步发布的还有《中国及东盟十国跨境商事争议仲裁指引》《重庆仲裁30年案例精选》。\n\n　　论坛还设置两场主旨研讨，分别围绕“建设国际一流仲裁机构 护航企业‘走出去’”“NCD公约背景下的多式联运仲裁保障”两大议题展开。来自境内外仲裁机构、高等院校的专家学者、实务代表围绕国际商事仲裁制度革新、多式联运纠纷处置、涉外企业风险防范等议题深入交流，为西部陆海新通道涉外仲裁高质量发展建言献策。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c725b21bfa1","title":"25名越南学员赴云南文山学“飞”无人机","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734830.shtml","summary":"中新网云南文山11月19日电 (刘梅 周西杨)18日，2026年云南人社“小而美”跨境培训项目——无人机驾驶员培训班开班仪式在云南省文山壮族苗族自治州举行。","summary_short":"中新网云南文山11月19日电 (刘梅 周西杨)18日，2026年云南人社“小而美”跨境培训项目——无人机驾驶员培训班开班…","digest":"25名越南学员赴云南文山学“飞”无人机","points":["中新网云南文山11月19日电 (刘梅 周西杨)18日…","来自越南宣光省的25名学员在文山开启为期5天的无人机驾驶技能学习之旅","无人机教练员向越南宣光省参训学员介绍机型"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:22:49+08:00","size":1,"keywords":[],"body":"中新网云南文山11月19日电 (刘梅 周西杨)18日，2026年云南人社“小而美”跨境培训项目——无人机驾驶员培训班开班仪式在云南省文山壮族苗族自治州举行。来自越南宣光省的25名学员在文山开启为期5天的无人机驾驶技能学习之旅。\n\n无人机教练员向越南宣光省参训学员介绍机型。文山州融媒 供图\n\n　　云南省人力资源和社会保障厅组织实施的援外“小而美”跨境培训项目，坚持“授人以渔”，把中国职业技能教育的成果与周边国家朋友分享，帮助大家掌握一门实用、能用、好用的技术。\n\n　　此次培训选择无人机作为主题，是因为无人机技术正深刻改变着农业农村的生产方式：从植保喷洒到林区巡护，再到应急搜救、灾害查勘，一架无人机就是一支“空中作业队”。文山与宣光同处北回归线附近，茶山连片、林海相依，水稻、玉米、茶叶和药材是两地共同的产业家底，对无人机技术有着同样迫切的需求。\n\n　　此次培训采取“理论教学+实操训练”相结合的方式进行，课程涵盖无人机飞行原理与法律法规、飞行安全规范、农药喷洒与航测应用、维护保养等核心内容，并将组织学员开展野外实操演练。\n\n越南宣光省参训学员佩戴飞行眼镜体验无人机飞行。文山州融媒 供图\n\n　　“我们十分珍惜这次学习机会，将认真学习无人机操作技能，把先进的技术带回宣光，运用到茶叶种植、林业管护和农业生产中，为家乡发展增添新动能，也愿做越中友好合作的参与者和促进者。”越南宣光省参训学员黄文律表示。\n\n　　本次培训班由文山州人力资源和社会保障局、文山州科学技术协会、文山州人民政府外事办公室主办，文山州高级技工学校、文山州科技馆服务中心、文山州无人机协会共同承办。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0299dfe877","title":"西工大成立航空发动机学院、空天动力研究院、空天动力产教联盟","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734921.shtml","summary":"中新网西安11月19日电 (记者 阿琳娜)西北工业大学18日举行航空发动机学院、空天动力研究院、空天动力产教联盟成立大会暨未来空天动力发展论坛。","summary_short":"中新网西安11月19日电 (记者 阿琳娜)西北工业大学18日举行航空发动机学院、空天动力研究院…","digest":"西北工业大学18日举行航空发动机学院、空天动力研究院…","points":["中新网西安11月19日电 (记者 阿琳娜)西北工业大学18日举行航空发动机学院…","西工大是中国首批开展空天动力人才培养和科学研究的高校…","此次成立的西北工业大学航空发动机学院由西北工业大学和中国航发、太行实验室三方共建…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:22:39+08:00","size":1,"keywords":[],"body":"中新网西安11月19日电 (记者 阿琳娜)西北工业大学18日举行航空发动机学院、空天动力研究院、空天动力产教联盟成立大会暨未来空天动力发展论坛。\n\n　　据了解，西工大是中国首批开展空天动力人才培养和科学研究的高校，源源不断地为空天动力事业发展输送拔尖创新人才，持续引领中国固体动力技术前沿，为中国新型空天动力体系构建奠定重要技术基础。\n\n西北工业大学举行航空发动机学院、空天动力研究院、空天动力产教联盟成立大会暨未来空天动力发展论坛。西北工业大学供图\n\n　　此次成立的西北工业大学航空发动机学院由西北工业大学和中国航发、太行实验室三方共建，立足国家重大战略，聚焦拔尖创新人才培养、前瞻性基础研究和关键核心技术攻关，着力打造航空发动机未来总师的哺育地、原创技术的策源地、领军人才的集聚地、国际合作的新高地。\n\n　　同时落地的空天动力研究院和空天动力产教联盟，将进一步整合校内外优势力量，深化产学研用协同创新，为中国空天动力高水平自立自强、航空航天强国建设提供战略支撑。\n\n　　西北工业大学党委书记张云明表示，成立航空发动机学院、空天动力研究院，并发起成立空天动力产教联盟，旨在推动学校空天动力相关学科迈入体系化布局、建制化升级、高质量发展，在航空强国和航天强国建设中彰显西工大更强担当、展现西工大更多作为、作出西工大更大贡献。\n\n　　会议期间举行了空天动力产教联盟第一届理事会第一次会议，审议通过了《空天动力产教联盟章程》。\n\n　　会后，举行了未来空天动力发展论坛。与会人员围绕航空动力技术前沿、产学研协同、成果转化等深入交流研讨，就发挥航空发动机学院、空天动力研究院和产教联盟平台作用、推动校企联合攻关与人才共育等提出意见建议。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c99715c0664","title":"探索雪山之下户外新体验 “先见·南迦巴瓦”先行者计划圆满收官","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734828.shtml","summary":"中新网拉萨11月19日电 (李林)19日，“先见·南迦巴瓦”先行者计划在西藏林芝市收官。","summary_short":"中新网拉萨11月19日电 (李林)19日，“先见·南迦巴瓦”先行者计划在西藏林芝市收官。","digest":"19日，“先见·南迦巴瓦”先行者计划在西藏林芝市收官","points":["中新网拉萨11月19日电 (李林)19日，“先见·南迦巴瓦”先行者计划在西藏林芝市收官","来自越野跑、户外探索及内容创作等领域的体验者，通过两天的跑山探线、影像记录与交流分享…","首日沿拜峰台线进发，全程17.67公里，累计爬升海拔1585米"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:21:17+08:00","size":1,"keywords":[],"body":"中新网拉萨11月19日电 (李林)19日，“先见·南迦巴瓦”先行者计划在西藏林芝市收官。来自越野跑、户外探索及内容创作等领域的体验者，通过两天的跑山探线、影像记录与交流分享，感受南迦巴瓦峰周边的自然与人文风貌，为未来线路完善、赛事筹备及户外运动目的地建设积累实地经验。\n\n图为跑山探线活动现场。林芝市鲁朗景区管理委员会供图\n\n　　此次跑山探线活动分两日进行。首日沿拜峰台线进发，全程17.67公里，累计爬升海拔1585米。次日转战雅伊湖线，全程26.85公里，沿途串联森林、河流、高原湖泊与高山牧场。\n\n图为跑山探线活动现场。林芝市鲁朗景区管理委员会供图\n\n　　18日下午，还举行了“南迦巴瓦先行者对谈”线上直播，围绕雪山的极致美学、垂直生态带的生态价值、高海拔越野跑的可能性等展开讨论。\n\n　　本次活动由广东省第十一批援藏工作队、巴宜区人民政府指导，林芝市鲁朗景区管理委员会主办，巴宜区鲁朗镇人民政府协办。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c772dcafa75","title":"AI助力青年科创 沈航学子亮出空天与水产领域创新成果","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-19/news1075501.shtml","summary":"随着人工智能快速迭代，AI正成为青年科创的新工具。","summary_short":"随着人工智能快速迭代，AI正成为青年科创的新工具。","digest":"随着人工智能快速迭代，AI正成为青年科创的新工具","points":["随着人工智能快速迭代，AI正成为青年科创的新工具","11月18日，记者走进沈阳航空航天大学 “AI + 双创” 教育成果展…","机电工程学院机械专业研二学生王吉昶，拿下2026年 “挑战杯” 国赛东北振兴专项赛道特等奖"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T21:16:29+08:00","size":1,"keywords":[],"body":"随着人工智能快速迭代，AI正成为青年科创的新工具。11月18日，记者走进沈阳航空航天大学 “AI + 双创” 教育成果展，感受学子们跨界创新的活力。\n\n机电工程学院机械专业研二学生王吉昶，拿下2026年 “挑战杯” 国赛东北振兴专项赛道特等奖。他带领团队研发的水面投饲机器人模型，聚焦水产养殖领域，把智能技术融入养殖环节，助力水产养殖绿色可持续发展。同样深耕AI科创赛道的，还有飞行器动力工程专业大三学生柏东良。依托国家级大创项目，他与团队研发的轻量化轴承故障诊断智能系统，为航空发动机健康监测提供智能化方案，推动AI技术在空天动力场景落地。除了面向空天、水产领域的智能装备，成果展上，不少项目紧扣新能源等前沿方向。\n\n当天，学校同步举办第八届大学生创新创业科技节总结大会，表彰一批双创先进集体与个人；现场还联合企业发布双创智能助手 “创伴” 智能体。据了解，沈航学子近年来累计斩获国省级科创奖项 12300余项，实现国创赛金奖、“挑战杯” 特等奖双突破。(记者 王艺霖 沈阳报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/8E083DE0F3B74800ABB2E35AD71C52E5.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c175693fba5","title":"黄河口鸟浪翻涌：赴一场《逍遥游》里的鲲鹏之约","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-19/news1075499.shtml","summary":"滔滔黄河奔流入海，于东营形成黄河口湿地。","summary_short":"滔滔黄河奔流入海，于东营形成黄河口湿地。","digest":"滔滔黄河奔流入海，于东营形成黄河口湿地","points":["滔滔黄河奔流入海，于东营形成黄河口湿地","这里是中国暖温带最广阔、最完整、最年轻的湿地生态系统","该系统是全球两大候鸟迁徙通道的核心驿站，被誉为“鸟类国际机场”"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T21:14:59+08:00","size":1,"keywords":[],"body":"滔滔黄河奔流入海，于东营形成黄河口湿地。这里是中国暖温带最广阔、最完整、最年轻的湿地生态系统。该系统是全球两大候鸟迁徙通道的核心驿站，被誉为“鸟类国际机场”。\n\n每到秋冬，数十万只花脸鸭、豆雁集结，晨昏时分腾空而起，聚散流转、变幻无形，没有固定剧本，游客八方而来，赴一场候鸟之约。\n\n记者 王峰 山东东营报道","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/7624B69452BF40338D78CF172EEEE521.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cd8e105e664","title":"第八届中国—东盟法治论坛在重庆举行","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075498.shtml","summary":"11月19日，第八届中国—东盟法治论坛在重庆举行。","summary_short":"11月19日，第八届中国—东盟法治论坛在重庆举行。","digest":"11月19日，第八届中国—东盟法治论坛在重庆举行","points":["来自中国、东盟11国、乌兹别克斯坦的政府部门、高等院校、行业协会…","中国法学会党组书记、常务副会长王洪祥在论坛开幕式致辞时表示，中国愿同东盟各国一道…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T21:14:45+08:00","size":1,"keywords":[],"body":"11月19日，第八届中国—东盟法治论坛在重庆举行。来自中国、东盟11国、乌兹别克斯坦的政府部门、高等院校、行业协会、法律服务机构等领域的专家学者，以“深化法治交流合作，共促区域繁荣稳定”为主题进行交流，为深化中国与东盟国家区域法治交流合作贡献智慧和力量。\n\n中国法学会党组书记、常务副会长王洪祥在论坛开幕式致辞时表示，中国愿同东盟各国一道，秉持“同球共济”的精神、合作共赢的理念、开放包容的胸襟，持续深化区域法治交流合作，推动中国—东盟合作继续成为亚洲发展振兴的引擎、亚太区域合作的典范、全球南方团结自强的标杆。\n\n(记者 贾楠）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/7EFFF4D87BD0430893543C5B32CAB8E5.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":68,"items":[{"id":"c09d4184ecf","title":"Anthropic上市｜開市報111美元 較招股價急升34% 創全球最大IPO紀錄","url":"https://www.stheadline.com/stock-market/3639034/Anthropic上市開市報111美元-較招股價急升34-創全球最大IPO紀錄","summary":"人工智能（AI）巨頭Anthropic（ANT）周四在納斯達克掛牌，開市報111.5美元，較招股價83美元急升34%，但升幅收窄，截至本港時間凌晨1:20，股價報98美元，較招股價升18%。","summary_short":"人工智能（AI）巨頭Anthropic（ANT）周四在納斯達克掛牌，開市報111.5美元，較招股價83美元急升34%…","digest":"人工智能巨頭Anthropic周四在納斯達克掛牌，開市報111.5美元…","points":["人工智能（AI）巨頭Anthropic（ANT）周四在納斯達克掛牌，開市報111.5美元…","Anthropic今次上市備受市場關注，最終招股價定於83美元…","公司今次公開發售9.8億股，集資規模達813.4億美元…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:53:01+08:00","size":2,"keywords":[],"body":"人工智能（AI）巨頭Anthropic（ANT）周四在納斯達克掛牌，開市報111.5美元，較招股價83美元急升34%，但升幅收窄，截至本港時間凌晨1:20，股價報98美元，較招股價升18%。 \nAnthropic今次上市備受市場關注，最終招股價定於83美元，較原定招股價區間70至78美元的上限，再提高約6.4%，反映投資者認購反應熱烈。 \n公司今次公開發售9.8億股，集資規模達813.4億美元，超越SpaceX（SPCX）今年6月上市時的集資額，創全球歷來最大首次公開招股（IPO）紀錄。若連同另外260億美元私人配售計算，整體融資規模更高達1,073.4億美元。 \n以83美元招股價計算，Anthropic完全攤薄後估值約1.5萬億美元，成為全球最具價值的科技企業之一。公司於2021年成立，由多名前OpenAI員工創辦，旗下Claude人工智能模型與OpenAI的ChatGPT直接競爭。 \nAnthropic近年收入急速增長，今年第三季收入達170億美元，較去年同期大增逾11倍。不過，公司仍未實現按一般公認會計準則計算的盈利，而且未來需要投入巨額資金興建數據中心及採購AI運算設備。 \n今次上市亦受到大型科技企業支持，亞馬遜（AMZN）及Alphabet（GOOG）旗下谷歌均為Anthropic主要股東，持股比例合計接近三成。公司另外透過私人配售，引入Nvidia、微軟及其他科技企業參與投資。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"Anthropic上市｜開市報111美元 較招股價急升34% 創全球最大IPO紀錄","url":"https://www.stheadline.com/stock-market/3639034/Anthropic上市開市報111美元-較招股價急升34-創全球最大IPO紀錄","source_display":"星島頭條","published_at":"2026-11-20T00:53:01+08:00","category":"財經","digest":"人工智能巨頭Anthropic周四在納斯達克掛牌，開市報111.5美元…"},{"title":"Anthropic上市｜開市報111美元 較招股價升34% 創全球最大IPO紀錄","url":"https://www.stheadline.com/stock-market/3639034/Anthropic上市開市報111美元-較招股價升34-創全球最大IPO紀錄","source_display":"星島頭條","published_at":"2026-11-20T00:53:01+08:00","category":"財經","digest":"人工智能巨頭Anthropic周四在納斯達克掛牌，開市報111.5美元…"}]},{"id":"c6a41679130","title":"西半山天御1期加推12伙全層大宅下周一招標","url":"https://www.stheadline.com/property-new/3639016/西半山天御1期加推12伙全層大宅下周一招標","summary":"豪宅交投氣氛持續向好，發展商趁勢加推添食。","summary_short":"豪宅交投氣氛持續向好，發展商趁勢加推添食。","digest":"豪宅交投氣氛持續向好，發展商趁勢加推添食","points":["豪宅交投氣氛持續向好，發展商趁勢加推添食","恒基與新世界合作發展的西半山超級豪宅天御1期，昨日加推12伙大宅於下周一（23日）起以招標形…","面積介乎856至1424方呎"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T05:35:00+08:00","size":1,"keywords":[],"body":"豪宅交投氣氛持續向好，發展商趁勢加推添食。恒基與新世界合作發展的西半山超級豪宅天御1期，昨日加推12伙大宅於下周一（23日）起以招標形式發售，包括2座22樓、23樓及27樓單位，屬A至D室。\n面積介乎856至1424方呎\n上述單位面積介乎856至1424方呎，涵蓋2房1套至3房3套間隔，招標期直至今年12月31日，期內採用每日截標方式出售。該盤分兩期發展，合共提供172伙，開盤至今累售約68伙。\n西半山羅便臣道80號推3房連車位招標\n西半山豪宅羅便臣道80號推出1座41樓A室，連同一個指定車位招標。\n南豐旗下三個豪盤亦上載銷售安排，均定於下周一以招標形式發售，並於即日截標。當中同系旗下西半山入伙多年的豪宅羅便臣道80號，推出1座41樓A室，面積1058方呎，屬3房1套間隔，連同一個指定車位招標。另淺水灣福慧大廈則推出1個4房雙套連兩個指定車位應市，為6樓B單位，面積3480方呎。\n南區深水灣徑8號推售2座17樓C室，面積4214方呎，採4房4套設計。\n而同系旗下與豐資源合作發展的港島南區深水灣徑8號，最新推出2座17樓C室，面積4214方呎，露台220方呎，採4房4套設計。項目共提供52伙，至今暫售23伙，套現超過62億元。\n另外，萊蒙及俊和合作發展的何文田128 WATERLOO，同步推出15樓C室於下周一起以招標形式發售，單位面積342方呎，屬1套房間隔，招標期截至今年12月31日，採每日招標截標。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc110a21325","title":"Anthropic CEO回应9000亿美元AI投入承诺：相较现有现金储备和营收规模并不算大","url":"https://www.jiemian.com/article/15352512.html","summary":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示，若考虑公司目前的现金储备及年营收规模，9000亿美元的AI相关投入承诺“看起来就没那么庞大”。","summary_short":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示，若考虑公司目前的现金储备及年营收规模…","digest":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…","points":["11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…","阿莫代伊称，公司在预测未来算力需求时，通常会采取相对保守的估算方式，尽量避免高估需求"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T23:51:04+08:00","size":4,"keywords":[],"body":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示，若考虑公司目前的现金储备及年营收规模，9000亿美元的AI相关投入承诺“看起来就没那么庞大”。阿莫代伊称，公司在预测未来算力需求时，通常会采取相对保守的估算方式，尽量避免高估需求。","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"Anthropic CEO回应9000亿美元AI投入承诺：相较现有现金储备和营收规模并不算大","url":"https://www.jiemian.com/article/15352512.html","source_display":"界面新聞","published_at":"2026-11-19T23:51:04+08:00","category":"","digest":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…"},{"title":"Anthropic CEO称公司目前与SpaceX合作愉快，算力服务质量良好","url":"https://www.jiemian.com/article/15352504.html","source_display":"界面新聞","published_at":"2026-11-19T23:49:56+08:00","category":"","digest":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…"},{"title":"Anthropic CEO：公司希望未来获得投资级信用评级","url":"https://www.jiemian.com/article/15352500.html","source_display":"界面新聞","published_at":"2026-11-19T23:48:00+08:00","category":"","digest":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…"},{"title":"Anthropic CEO谈史上最大IPO压力：公司对此保持冷静","url":"https://www.jiemian.com/article/15352489.html","source_display":"界面新聞","published_at":"2026-11-19T23:47:09+08:00","category":"","digest":"11月19日，面对创下史上最大规模IPO纪录所带来的市场关注和外界期待…"}],"cross":{"total":4,"angles":[{"point":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…","sources":["界面新聞","界面新聞","界面新聞"],"url":"https://www.jiemian.com/article/15352512.html"},{"point":"11月19日，面对创下史上最大规模IPO纪录所带来的市场关注和外界期待…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15352489.html"}]}},{"id":"c26b0f7c89c","title":"Anthropic IPO承销银行获5.5亿美元费用，创史上最大IPO承销费纪录","url":"https://www.jiemian.com/article/15352339.html","summary":"11月19日消息，Anthropic向参与其首次公开募股（IPO）的华尔街银行支付约5.5亿美元承销费用，主要承销商包括高盛和摩根士丹利。","summary_short":"11月19日消息，Anthropic向参与其首次公开募股（IPO）的华尔街银行支付约5.5亿美元承销费用…","digest":"11月19日消息…","points":["11月19日消息，Anthropic向参与其首次公开募股（IPO）的华尔街银行支付约5.5亿…","根据Anthropic向美国证券交易委员会提交的最新文件，承销费率接近68个基点","此次承销费用超过此前纪录保持者SpaceX IPO支付的5亿美元"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T21:21:57+08:00","size":2,"keywords":[],"body":"11月19日消息，Anthropic向参与其首次公开募股（IPO）的华尔街银行支付约5.5亿美元承销费用，主要承销商包括高盛和摩根士丹利。根据Anthropic向美国证券交易委员会提交的最新文件，承销费率接近68个基点。此次承销费用超过此前纪录保持者SpaceX IPO支付的5亿美元。SpaceX当时的IPO募资额为862亿美元。\n\nAnthropic及其七位联合创始人通过扩大规模后的IPO及同期私募配售，合计募资1073亿美元，创下历史纪录。此次IPO共有高盛、摩根士丹利在内的22家银行参与，除两家主要承销商外，其余20家银行也将按比例分享承销费用。值得注意的是，Anthropic和SpaceX均未就超额配售（绿鞋机制）支付承销费用。","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"Anthropic IPO承销银行获5.5亿美元费用，创史上最大IPO承销费纪录","url":"https://www.jiemian.com/article/15352339.html","source_display":"界面新聞","published_at":"2026-11-19T21:21:57+08:00","category":"","digest":"11月19日消息…"},{"title":"Anthropic IPO将于美东时间上午9:50开始报价","url":"https://www.jiemian.com/article/15352213.html","source_display":"界面新聞","published_at":"2026-11-19T20:22:13+08:00","category":"","digest":"Anthropic IPO将于美东时间上午9:50开始报价"}],"cross":{"total":2,"angles":[{"point":"11月19日消息…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15352339.html"},{"point":"Anthropic IPO将于美东时间上午9:50开始报价","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15352213.html"}]}},{"id":"ccad483d26d","title":"【深圳APEC】APEC工商界代表参访深圳“机器人谷” 关注科技创新与产业合作","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-19/news1075502.shtml","summary":"11月19日，参加APEC工商领导人峰会的工商界代表走进深圳南山区“机器人谷”，观看机器人多场景应用展示，与参展企业交流，了解人工智能、机器人等技术在生产生活中的应用，探讨亚太科技与产业合作前景。","summary_short":"11月19日，参加APEC工商领导人峰会的工商界代表走进深圳南山区“机器人谷”，观看机器人多场景应用展示…","digest":"11月19日，参加APEC工商领导人峰会的工商界代表走进深圳南山区“机器人谷”…","points":["11月19日，参加APEC工商领导人峰会的工商界代表走进深圳南山区“机器人谷”…","参访现场，机器人展示舞蹈、搏击、插花、踢足球、书写毛笔字及整理货箱等技能…","从生活服务到工业作业，多样化的应用展示引起代表们对技术落地和产业发展的关注…"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T21:18:28+08:00","size":2,"keywords":[],"body":"11月19日，参加APEC工商领导人峰会的工商界代表走进深圳南山区“机器人谷”，观看机器人多场景应用展示，与参展企业交流，了解人工智能、机器人等技术在生产生活中的应用，探讨亚太科技与产业合作前景。\n\n参访现场，机器人展示舞蹈、搏击、插花、踢足球、书写毛笔字及整理货箱等技能，工作人员还进行了“空气架子鼓”表演。从生活服务到工业作业，多样化的应用展示引起代表们对技术落地和产业发展的关注，部分代表与展商就合作方向展开交流。\n\n美国泰森食品中国区公司事务负责人苗小亚表示，在APEC会场看到的机器人让她感受到人工智能正走进日常生活。作为食品加工企业的代表，她更关注人工智能、智能化和数智化应用能为运营效率带来多大提升。\n\n科技成果如何在不同经济体落地，也成为现场交流的话题。参展企业智平方(深圳)海外与生态副总裁巫易磷介绍，企业已与约一半APEC成员经济体开展合作往来，希望通过技术与应用场景的对接，进一步了解当地生产需求，改进产品硬件和软件，深化合作交流，助力经济向科技驱动转型。\n\n据介绍，深圳“机器人谷”面积约28平方公里，串联南山智园、智谷、云谷、国际创新谷等园区，已集聚机器人产业链企业200余家，其中人形机器人整机企业超过25家，形成了涵盖关键技术研发和零部件制造的产业体系。(朱悦 制作 王佳琪)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/42F5FB16680C4FD3921B5D3070FB2646.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"【深圳APEC】APEC工商界代表参访深圳“机器人谷” 关注科技创新与产业合作","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-19/news1075502.shtml","source_display":"中新視頻","published_at":"2026-11-19T21:18:28+08:00","category":"財經","digest":"11月19日，参加APEC工商领导人峰会的工商界代表走进深圳南山区“机器人谷”…"},{"title":"【深圳APEC】APEC领导人接机像“开盲盒”？藏在机场保障里的“深圳速度”","url":"https://www.chinanews.com/gn/shipin/cns/2026/11-19/news1075489.shtml","source_display":"中新視頻","published_at":"2026-11-19T19:37:22+08:00","category":"內地","digest":"2026年11月18日至19日…"}],"cross":{"total":2,"angles":[{"point":"2026年11月18日至19日…","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/cns/2026/11-19/news1075489.shtml"},{"point":"11月19日，参加APEC工商领导人峰会的工商界代表走进深圳南山区“机器人谷”…","sources":["中新視頻"],"url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-19/news1075502.shtml"}]}},{"id":"cf2fbd5644a","title":"沽空機構狙擊AMD 質疑晶片技術流入中國黑名單企業 股價應聲大跌","url":"https://www.stheadline.com/stock-market/3639084/沽空機構狙擊AMD-質疑晶片技術流入中國黑名單企業-股價應聲大跌","summary":"美國超微公司（AMD）遭沽空機構Hunterbrook狙擊，質疑公司與受美國出口管制的中國企業存在業務聯繫，可能涉及違反美國出口限制。","summary_short":"美國超微公司（AMD）遭沽空機構Hunterbrook狙擊，質疑公司與受美國出口管制的中國企業存在業務聯繫…","digest":"美國超微公司遭沽空機構Hunterbrook狙擊…","points":["美國超微公司（AMD）遭沽空機構Hunterbrook狙擊…","Hunterbrook宣布已沽空AMD，消息拖累盤中股價大跌，截至本港時間凌晨00:21…","Hunterbrook指出，中國伺服器製造商浪潮信息旗下IEIT Systems…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:22:09+08:00","size":1,"keywords":[],"body":"美國超微公司（AMD）遭沽空機構Hunterbrook狙擊，質疑公司與受美國出口管制的中國企業存在業務聯繫，可能涉及違反美國出口限制。Hunterbrook宣布已沽空AMD，消息拖累盤中股價大跌，截至本港時間凌晨00:21，跌幅約7%。 \nHunterbrook指出，中國伺服器製造商浪潮信息旗下IEIT Systems，於2025年3月被美國商務部列入出口管制實體清單，但之後仍有至少6個較新版本的AMD韌體（Firmware）被整合至其產品。 \nHunterbrook指AMD去年向新加坡客戶開出的帳單總額達42.8億美元，佔全年收入逾一成；中國及香港客戶則佔收入逾兩成。一旦美國進一步收緊晶片出口管制，AMD的海外業務可能受到重大影響。 \n上述均屬Hunterbrook提出的質疑，尚未證實AMD違反美國出口管制法規。AMD在監管文件中曾表示，對中國出口部分AI晶片需要取得美國政府許可，相關限制可能影響公司收入及業績。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cfb64ad70c4","title":"Anthropic首日於納斯達克掛牌","url":"https://news.tvb.com/tc/1207346-Anthropic首日於納斯達克掛牌","summary":"美國人工智能公司Anthropic，首日於納斯達克掛牌。Anthropic將向參與承銷的華爾街銀行支付5.5億美元費用，高於SpaceX向承銷銀行支付的金額。","summary_short":"美國人工智能公司Anthropic，首日於納斯達克掛牌。","digest":"美國人工智能公司Anthropic，首日於納斯達克掛牌","points":["Anthropic將向參與承銷的華爾街銀行支付5.5億美元費用…","《彭博》引述知情人士透露，約有1,200家機構投資者提交Anthropic新股認購…","相當一部分來自美國境外的認購，未獲配股"],"section":"財經","category":"財經","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T00:16:00+08:00","size":1,"keywords":["財經","Anthropic"],"body":"美國人工智能公司Anthropic，首日於納斯達克掛牌。\n\nAnthropic將向參與承銷的華爾街銀行支付5.5億美元費用，高於SpaceX向承銷銀行支付的金額。據Anthropic向美國證券交易委員會提交的最新文件，公司同意由高盛和摩根士丹利為首的承銷銀行支付約百分之0.67的承銷費用，超過SpaceX向銀行支付的5億美元。\n\n另外，《彭博》引述知情人士透露，約有1,200家機構投資者提交Anthropic新股認購，超過一半未獲配任何股份。相當一部分來自美國境外的認購，未獲配股。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ySigYNQQ7A1795107885.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/e4d2600d096844f0ad76ffdc4b41bc0b/0e52584de91243bcaf381aa476425650-48784930116042748a45e0a3e91a3c74-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ySigYNQQ7A1795107885.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c2dc89c820a","title":"千亿融资落定！DeepSeek完成工商变更","url":"https://www.jiemian.com/article/15352239.html","summary":"11月19日，据环球网报道，备受瞩目的DeepSeek第二轮千亿级融资已正式落地。","summary_short":"11月19日，据环球网报道，备受瞩目的DeepSeek第二轮千亿级融资已正式落地。","digest":"11月19日，据环球网报道，备受瞩目的DeepSeek第二轮千亿级融资已正式落地","points":["11月19日，据环球网报道，备受瞩目的DeepSeek第二轮千亿级融资已正式落地","杭州深度求索人工智能基础技术研究有限公司完成工商变更","进一步向上穿透可见，杭州程砚同期完成工商变更，登记出资额增至343897.9万元…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T23:53:18+08:00","size":1,"keywords":[],"body":"11月19日，据环球网报道，备受瞩目的DeepSeek第二轮千亿级融资已正式落地。\n\n杭州深度求索人工智能基础技术研究有限公司完成工商变更\r\n\n工商登记信息显示，DeepSeek主体杭州深度求索人工智能基础技术研究有限公司已于近日完成工商变更，注册资本由1644.75万元增至1991.87万元，增幅21.1%；新增股东杭州程砚企业管理咨询合伙企业（有限合伙），持股约17.27%。\n\n据证券时报援引知情交易人士消息，DeepSeek本轮融资募资规模区间在1000亿元至1055亿元，投后估值约6155亿元。叠加2026年6月首轮约510亿元融资，市场测算其短时间内两轮累计吸纳资金将超1500亿元。\n\n进一步向上穿透可见，杭州程砚同期完成工商变更，登记出资额增至343897.9万元，新增31家合伙人，变更后共有32名合伙人，杭州程策商务咨询有限公司仍担任执行事务合伙人。这31家新增主体，正是参与DeepSeek本轮融资的各外部股东。\n\n杭州程砚变更后共有32名合伙人\r\n\n杭州程砚的31家合伙人横跨互联网、通信运营商、芯片半导体、新能源、消费电子、汽车、家电以及头部PE/VC，几乎把大模型商业化所需的上游算力与下游场景一次性集齐。\n\n出资比例排在最前面的，是腾讯与宁德时代体系。腾讯旗下上海珩岫商业管理有限公司出资比例9.5653%，为第一大出资人；宁德时代通过厦门时代怡远（4.9198%）、厦门时代深远（4.4410%）、福建时代泽远（0.2045%）三只基金合计出资同样为9.5653%，与腾讯并列居前。紧随其后的是中移投资控股与中信证券投资，各出资7.6522%；砺思资本相关主体出资7.1740%，进入前五。\n\n除此之外，合伙人还囊括了中国移动、中国电信、美团龙珠、网易雷火、小红书、携程系、vivo、美的、立讯体系（立臻精密）、吉利产投、兆易创新、中芯聚源、横店资本等均在列；投资机构一端则聚集了博裕、IDG、高榕、君联、正心谷、CPE源峰、拾象、石溪资本、国寿股权、中金系等。据证券时报不完全统计，产业方合计出资比例超过50%，是本轮绝对主力。\n\n从DeepSeek主体公司的股东序列看，变更后宁波程恩企业管理咨询合伙企业持股49.7020%，为第一大股东；梁文锋直接持股25.6041%，为第二大股东；杭州程砚持股17.2650%，为第三大股东；杭州程砺（首轮融资持股平台）持股7.0364%；国家人工智能产业投资基金持股0.3925%。\n\n工商信息显示，杭州程砚的执行事务合伙人仍由杭州程策商务咨询有限公司担任，而梁文锋持有杭州程策99%股权。也就是说，31家外部股东进入的是持股平台，通过平台间接享有经济收益，杭州程策作为普通合伙人控制权牢牢留在创始人一侧。据证券时报的测算，梁文锋直接及间接持股比例合计约67.42%，千亿资本入场并未改变控制权归属。\n\n从融资时间线来看，DeepSeek的资本化进程在2026年明显提速。今年4月，DeepSeek传出启动首次外部股权融资；6月15日，DeepSeek获得A轮510亿元融资，彼时提及的投后估值约为3300亿元附近。\n\n首轮融资中，创始人梁文锋本人以约200亿元成为最大单一出资方，腾讯出资约100亿元，宁德时代体系出资约50亿元，网易、京东、砺思资本、IDG资本各出资约30亿元，正心谷投资、拾象科技分别出资约15亿元，国家人工智能产业投资基金出资约9.8亿元。7月中旬，DeepSeek启动第二轮融资，最初目标500亿元，因认购热情远超预期，两度上调至如今的千亿级别。\n\n本轮千亿融资的推进，也将为DeepSeek的上市铺平道路。据21世纪经济报道消息称，DeepSeek已聘请中信证券为科创板IPO做准备，计划年内启动申报相关筹备工作，预计2027年挂牌。\n\n未经正式授权严禁转载本文，侵权必究。硬科技\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n千亿融资落定！DeepSeek完成工商变更\n\n梁文锋直接持股25.6041%，为第二大股东。\n\n原创新闻李科峰 · 2026/11/19 23:53来源：界面新闻\n\n图片来源：视觉中国\n\n11月19日，据环球网报道，备受瞩目的DeepSeek第二轮千亿级融资已正式落地。\n\n杭州深度求索人工智能基础技术研究有限公司完成工商变更\r\n\n工商登记信息显示，DeepSeek主体杭州深度求索人工智能基础技术研究有限公司已于近日完成工商变更，注册资本由1644.75万元增至1991.87万元，增幅21.1%；新增股东杭州程砚企业管理咨询合伙企业（有限合伙），持股约17.27%。\n\n据证券时报援引知情交易人士消息，DeepSeek本轮融资募资规模区间在1000亿元至1055亿元，投后估值约6155亿元。叠加2026年6月首轮约510亿元融资，市场测算其短时间内两轮累计吸纳资金将超1500亿元。\n\n进一步向上穿透可见，杭州程砚同期完成工商变更，登记出资额增至343897.9万元，新增31家合伙人，变更后共有32名合伙人，杭州程策商务咨询有限公司仍担任执行事务合伙人。这31家新增主体，正是参与DeepSeek本轮融资的各外部股东。\n\n杭州程砚变更后共有32名合伙人\r\n\n杭州程砚的31家合伙人横跨互联网、通信运营商、芯片半导体、新能源、消费电子、汽车、家电以及头部PE/VC，几乎把大模型商业化所需的上游算力与下游场景一次性集齐。\n\n出资比例排在最前面的，是腾讯与宁德时代体系。腾讯旗下上海珩岫商业管理有限公司出资比例9.5653%，为第一大出资人；宁德时代通过厦门时代怡远（4.9198%）、厦门时代深远（4.4410%）、福建时代泽远（0.2045%）三只基金合计出资同样为9.5653%，与腾讯并列居前。紧随其后的是中移投资控股与中信证券投资，各出资7.6522%；砺思资本相关主体出资7.1740%，进入前五。\n\n除此之外，合伙人还囊括了中国移动、中国电信、美团龙珠、网易雷火、小红书、携程系、vivo、美的、立讯体系（立臻精密）、吉利产投、兆易创新、中芯聚源、横店资本等均在列；投资机构一端则聚集了博裕、IDG、高榕、君联、正心谷、CPE源峰、拾象、石溪资本、国寿股权、中金系等。据证券时报不完全统计，产业方合计出资比例超过50%，是本轮绝对主力。\n\n从DeepSeek主体公司的股东序列看，变更后宁波程恩企业管理咨询合伙企业持股49.7020%，为第一大股东；梁文锋直接持股25.6041%，为第二大股东；杭州程砚持股17.2650%，为第三大股东；杭州程砺（首轮融资持股平台）持股7.0364%；国家人工智能产业投资基金持股0.3925%。\n\n工商信息显示，杭州程砚的执行事务合伙人仍由杭州程策商务咨询有限公司担任，而梁文锋持有杭州程策99%股权。也就是说，31家外部股东进入的是持股平台，通过平台间接享有经济收益，杭州程策作为普通合伙人控制权牢牢留在创始人一侧。据证 y":"近日，受国际金价持续走弱影响，黄金、白银价格下跌，国内各大主流黄金品牌的足金挂牌价近两日连续下调。金价接连回落，直接带动线下黄金消费热潮。11月19日，记者在上海豫园商圈的金店走访时看到，门店客流明显增多。据店内柜员介绍，随着金价一波波下行，不少此前一直观望、等待合适时机的消费者选择出手，趁着降价选购黄金饰品。(娄瀚锟)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/CA8AB7F4339C48C7AF1C6E82EE36C6AD.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c8c89cc607f","title":"（深圳APEC）外媒镜头里的深圳：机器人群舞、无人机送餐，科幻走进现实","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734970.shtml","summary":"中新网北京11月19日电 题：外媒镜头里的深圳：机器人群舞、无人机送餐，科幻走进现实  　　作者 肖玉笛 何欣怿  　　街区里，机器人伴着音乐跳起整齐的舞蹈；公园里，人形机器人化身咖啡师…","summary_short":"中新网北京11月19日电 题：外媒镜头里的深圳：机器人群舞、无人机送餐…","digest":"题：外媒镜头里的深圳：机器人群舞、无人机送餐…","points":["街区里，机器人伴着音乐跳起整齐的舞蹈","公园里，人形机器人化身咖啡师，熟练地制作饮品","城市上空，无人机穿梭，将咖啡、奶茶和外卖送到游客手中"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:50:46+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 题：外媒镜头里的深圳：机器人群舞、无人机送餐，科幻走进现实\n\n　　作者 肖玉笛 何欣怿\n\n　　街区里，机器人伴着音乐跳起整齐的舞蹈；公园里，人形机器人化身咖啡师，熟练地制作饮品；城市上空，无人机穿梭，将咖啡、奶茶和外卖送到游客手中……\n\n　　以往科幻电影中的场景，已经在深圳走进现实。亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在深圳举行。各国媒体记者也将镜头对准这座中国南方的科技之城，科技应用成为外媒观察中国创新发展的一个窗口。\r\n\n　　从舞狮到格斗，机器人秀出“十八般武艺”\n\n　　11月17日，在深圳的星河WORLD具身智能机器人示范街区举办的机器人嘉年华上，来自100多家企业的500多台机器人集中亮相。\n\n　　美国哥伦比亚广播公司(CBS)关注了这场表演，开场时，38台机器人带来架子鼓、电子键盘和“千手观音”等节目。机器狗灵活腾跃，表演传统舞狮，人形机器人则轮番展示太极和中国功夫动作，将机器人技术与传统文化相结合。\n\n　　更引人注目的是一场人形机器人集体舞蹈表演。151台人形机器人整齐列队、同步起舞，其数量创造吉尼斯世界纪录。CBS报道称，这场表演由众擎机器人研发的T800人形机器人领舞。该型号机器人身高1.73米、体重约75公斤，还能完成上勾拳、回旋踢和后空翻等高动态动作。\n\n　　在该街区的机器人6S店，路透社记者被机器人格斗吸引。人形机器人在金属围栏内进行格斗对抗、展示武术动作。孩子们则与小型机器人互动，并在一台两米高的机器人模型旁合影。\n\n　　机器人当起咖啡师，科技走进公园日常\n\n　　在深圳一处公园的饮品摊位，法新社记者看到一台人形机器人拿起杯子，拉动机器手柄制作出冰淇淋，随后将成品递给顾客。旁边另一台机器人则负责制作咖啡。\n\n　　机器人制造商智平方(AI² Robotics)的首席执行官郭彦东对法新社记者说，公司在中国部署了约200台人形服务机器人，深圳这处公园的机器人每天可售出约300杯咖啡。\n\n　　当然，机器人咖啡师并非完全不需要人类帮忙。他说，工作人员仍需定期补充咖啡豆、清理咖啡渣，不过机器人的操作由人工智能模型驱动。\n\n　　无人机送外卖，城市上空有了“空中配送员”\n\n　　在深圳的一处景区，路透社记者听到无人机的嗡嗡声此起彼伏，一架架无人机穿梭于城市上空，将外卖、咖啡和奶茶送往公园及景区。游客只需扫描二维码下单，便可在指定取货点领取餐食。\n\n　　据路透社报道，来自东南亚的游客Liew Kee Ho在体验无人机送餐后表示，自己在马来西亚从未见过无人机配送奶茶或食品，第一次体验感觉新奇而兴奋。\n\n　　路透社称，得益于制造业基础、政策支持和不断扩大的配送网络，中国已成为全球商业无人机物流最先进的市场之一。\n\n　　中国民航局发布的《2025年民航行业发展统计公报》显示，截至2025年底，全行业注册无人机共328.7万架，比上年底增长51.0%；全年无人机累计飞行小时4530.29万小时，同比增长69.89%。\n\n　　APEC为世界观察深圳提供了一个窗口，而深圳呈现给外媒的，不仅有国际会议的城市风貌，还有一座科技创新之城正在发生的变化：机器人不再只是实验室里的研究对象，无人机也不只是空中的飞行器，人工智能正以越来越具体的方式进入城市生活。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c264e04f2aa","title":"王毅：会议达成深圳展望，这是APEC中国年最重要的成果","url":"https://www.jiemian.com/article/15352425.html","summary":"11月19日，中共中央政治局委员、外交部长王毅举行中外记者会。","summary_short":"11月19日，中共中央政治局委员、外交部长王毅举行中外记者会。","digest":"11月19日，中共中央政治局委员、外交部长王毅举行中外记者会","points":["11月19日，中共中央政治局委员、外交部长王毅举行中外记者会","王毅表示，当今国际局势动荡不安，世界经济增长承压，逆全球化不断抬头…","在习近平主席引领下，在各个经济体领导人的支持下，会议达成了富有雄心…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T22:41:09+08:00","size":1,"keywords":[],"body":"11月19日，中共中央政治局委员、外交部长王毅举行中外记者会。王毅表示，当今国际局势动荡不安，世界经济增长承压，逆全球化不断抬头，21个APEC经济体的领导人和代表齐聚深圳，共同探讨应对之策，共同协商合作大计，不仅对开创亚太合作新局具有重大意义，也将为维护世界和平与发展产生深远影响。这一刻世界的目光投向中国，聚焦深圳。在习近平主席引领下，在各个经济体领导人的支持下，会议达成了富有雄心、务实全面的亚太经合组织领导人深圳展望，这是APEC中国年最重要的成果。（澎湃新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cec9d1d75b4","title":"深圳APEC开启亚太合作新篇章","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734957.shtml","summary":"深圳APEC期间，有三件事，连在一起看，颇有“深”意。","summary_short":"深圳APEC期间，有三件事，连在一起看，颇有“深”意。","digest":"深圳APEC期间，有三件事，连在一起看，颇有“深”意","points":["深圳APEC期间，有三件事，连在一起看，颇有“深”意","其一，美国企业家马斯克选择来深圳，而在纽约同期的一场峰会则由他的数字分身代为出席","真人来华，本身就传递出重视中国市场的信号"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:38:47+08:00","size":1,"keywords":[],"body":"深圳APEC期间，有三件事，连在一起看，颇有“深”意。\n\n　　其一，美国企业家马斯克选择来深圳，而在纽约同期的一场峰会则由他的数字分身代为出席。真人来华，本身就传递出重视中国市场的信号。在深圳，他又说了句大实话：“我是超级中国迷、科技迷。我常跟美国以及其他地区的人说，如果不亲自去一趟，你是无法真正了解中国的。”\n\n　　其二，“希望我的祖国也能有一个深圳”在海外火了，这座创新之城和未来之城“全妆”迎客，用硬实力和高颜值，让世界为之赞叹。\n\n　　其三，华强北市场一位女老板去年底开始制作“APEC相册”，恰在APEC会议周期间集齐最后一个经济体客商的合影。一本相册，折射深圳“朋友圈”的广度，也见证了中国对外开放的深度。\n\n　　11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。这是中国第三次担任APEC东道主。\n\n　　2001 年上海，2014 年北京，2026 年深圳，三座城市，恰好对应中国经济的三大增长极：长三角、京津冀、粤港澳大湾区。\n\n　　三点相连，构成一个稳固三角，驱动中国经济高质量发展，也为世界注入稳定性与确定性。\n\n　　三次承办，恰与中国经济融入全球的进程同频共振，也见证了中国从融入者到贡献者的角色之变。\n\n　　2001 年的黄浦江畔，那一年，中国经济总量尚未突破10万亿元，排世界第六。APEC会议首次在中国举行，各经济体领导人一身唐装合影，达成《上海共识》。\n\n　　同年，中国正式加入世贸组织。渴望深入融入世界的东方巨龙，自此开始腾飞。\n\n　　2014 年的雁栖湖畔，中国经济总量突破63万亿元，稳居世界第二大经济体。APEC北京会议通过《亚太经合组织推动实现亚太自贸区北京路线图》，正式启动亚太自贸区进程。\n\n　　“一花不是春，孤雁难成行。”彼时的中国，已经有足够底气和伙伴们一道，推动亚太合作迈向新征程。\n\n　　2026 年的前海湾，作为亚太经济合作的倡导者、推动者、先行者，中国的经济总量已迈上140 万亿元的台阶，硬实力和软实力有目共睹。世界对这个和平稳定且越来越酷的国度的好感度，已超越美国。\n\n　　然而，如今的世界，单边主义、保护主义甚嚣尘上，APEC 被反复追问同一个问题：亚太怎么办？\n\n　　在深圳，中国给出方案：推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　事实上，中国一直在这么做，现在的中国不仅是“超级卖家”，以丰富优质的产品供给惠及全球；还是“超级买家”，作为全球第二大消费市场持续释放机遇；更是“超级实验室”，为创新提供广阔试验场。\n\n　　更重要的是，无论国际风云如何变幻，中国同世界各国合作共赢的决心都不会改变。\n\n　　聪明人自然会做出明智的选择。115家世界500强企业代表齐聚APEC工商领导人峰会，美国参会企业数量居外方经济体之首，便已说明，要合作不要脱钩，是人心所向。\n\n　　以开放纾发展之困，以创新聚增长之势，以合作谋共享之福。乘着太平洋的风，亚太合作期待像大鹏一样展翅高飞、鹏程万里。\n\n　　｜总策划：俞岚\n\n　　｜策划：周锐\n\n　　｜统筹：王庆凯\n\n　　｜执笔：李金磊\n\n　　｜责编：程春雨\n\n　　｜设计：黄蕾\n\n　　｜“三里河”工作室出品\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c46b5cf0f55","title":"美股開市｜ Anthropic萬眾期待 納指展升勢 拼多多賺更多","url":"https://www.stheadline.com/stock-market/3639027/美股開市-Anthropic萬眾期待-納指展升勢-拼多多賺更多","summary":"美股今日焦點是人工智能巨頭Anthropic正式上市，每股招股價提升至83美元，股票代號ANT。","summary_short":"美股今日焦點是人工智能巨頭Anthropic正式上市，每股招股價提升至83美元，股票代號ANT。","digest":"美股今日焦點是人工智能巨頭Anthropic正式上市，每股招股價提升至83美元…","points":["美股今日焦點是人工智能巨頭Anthropic正式上市，每股招股價提升至83美元…","惟新股需進行開放報價程序，預計將會在本港時間凌晨時分才正式交易","受惠於Anthropic招股反應理想，帶動一眾科技股上升，納指開市升2%、道指微升0.3%…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:38:17+08:00","size":1,"keywords":[],"body":"美股今日焦點是人工智能巨頭Anthropic正式上市，每股招股價提升至83美元，股票代號ANT。惟新股需進行開放報價程序，預計將會在本港時間凌晨時分才正式交易。 \n受惠於Anthropic招股反應理想，帶動一眾科技股上升，納指開市升2%、道指微升0.3%，標普500指數則升約1%。 \n科技股強勢，Nvidia (輝達，又稱英偉達)（NVDA）早段上升約3.7%；谷歌母公司Alphabet（GOOG）升4.2%；微軟（MSFT）升2.3%；亞馬遜（AMZN）升1.7%；台積電（TSM）升2%；Meta（META）升2%；美國超微公司（AMD）升跌XX%；美光（MU）升3.5%；SpaceX（SPCX）升2%。 \n拼多多（PDD）公布截至9月底止第三季業績，營收1,083億元人民幣（下同），淨利潤微升0.68%至295億元，但較預期賺256億元高出15%。期內網絡營銷服務及其他收入按年增加12%至598億元，交易服務收入則減少12%至485億元。截至9月底，現金或等值資產合共4,554億元，較去年底增加約7.8%。拼多多開市後，股價初段升10%。 \n美國至11月14日，當周初請失業金人數為20.30萬人，預期為19.70萬人，前值由20萬人修正為20.2萬人。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c166f3a6e75","title":"美股纳指高开1.6%，存储、光通信等板块上扬","url":"https://www.jiemian.com/article/15352404.html","summary":"美股三大指数开盘集体上涨，道琼斯指数涨0.44%，标普500指数涨0.98%，纳斯达克综合指数涨1.58%。","summary_short":"美股三大指数开盘集体上涨，道琼斯指数涨0.44%，标普500指数涨0.98%，纳斯达克综合指数涨1.58%。","digest":"美股三大指数开盘集体上涨，道琼斯指数涨0.44%，标普500指数涨0.98%…","points":["美股三大指数开盘集体上涨，道琼斯指数涨0.44%，标普500指数涨0.98%…","Anthropic IPO提振市场情绪，AI产业链走高，存储板块方面，海力士、闪迪…","光通信公司方面，Coherent涨超6%，Lumentum涨超3%"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T22:31:39+08:00","size":1,"keywords":[],"body":"美股三大指数开盘集体上涨，道琼斯指数涨0.44%，标普500指数涨0.98%，纳斯达克综合指数涨1.58%。Anthropic IPO提振市场情绪，AI产业链走高，存储板块方面，海力士、闪迪、美光科技涨超4%；光通信公司方面，Coherent涨超6%，Lumentum涨超3%；新型云服务公司方面，NEBIUS、CoreWeave涨超4%。美股“科技七巨头”集体上涨，苹果股价上涨0.32%，微软股价上涨2.55%，英伟达股价上涨1.98%，谷歌-A股价上涨4.21%，亚马逊股价上涨1.61%，Meta股价上涨1.1%，特斯拉股价上涨1.26%。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd1974d1501","title":"数字种业“突围” 广西大石山区蹚出数字乡村新路","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734959.shtml","summary":"中新网玉林11月19日电(记者 黄艳梅)“九分石头一分土”，这是广西南宁市马山县的真实写照，也曾是这座典型大石山区县发展的“枷锁”。","summary_short":"中新网玉林11月19日电(记者 黄艳梅)“九分石头一分土”，这是广西南宁市马山县的真实写照…","digest":"“九分石头一分土”，这是广西南宁市马山县的真实写照…","points":["中新网玉林11月19日电(记者 黄艳梅)“九分石头一分土”，这是广西南宁市马山县的真实写照…","如今，这一地理劣势正被转化为制种产业得天独厚的天然隔离带","11月19日在玉林市举行的2026年广西数字乡村建设工作推进会上，马山县委常委、宣传部部长…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:30:07+08:00","size":1,"keywords":[],"body":"中新网玉林11月19日电(记者 黄艳梅)“九分石头一分土”，这是广西南宁市马山县的真实写照，也曾是这座典型大石山区县发展的“枷锁”。如今，这一地理劣势正被转化为制种产业得天独厚的天然隔离带。\n\n　　11月19日在玉林市举行的2026年广西数字乡村建设工作推进会上，马山县委常委、宣传部部长、副县长黄麟惠介绍，马山县以“数字种业”为切入点，成功入选国家第二批数字乡村试点，探索出一条靠山兴产、数智赋能的特色发展新路子。\n\n11月19日，2026年广西数字乡村建设工作推进会在广西玉林举行。图为会议交流发言现场。中新网记者 黄艳梅 摄\n\n　　院士专家“把脉开方” 石山崛起种业“芯片”\n\n　　2021年，罗锡文、钱前等院士专家为马山“把脉开方”，提出靠山兴产，发展制种产业。之后，马山县与华南农业大学共建广西首个县级种业科技创新中心，与中国农科院国家南繁研究院等科研院校深度合作，聘请院士钱前担任首席顾问，建成种业实验室，组建科技特派团对口帮扶，全力做强种业“芯片”。\n\n　　在种业基地建设方面，马山县流转制种产业用地2.5万亩，完成6000亩“种业标准地”数字化改造，实现物联网监控和水肥一体化设备全覆盖。5年来，全县玉米、水稻制种面积超10万亩，成为广西壮族自治区级杂交玉米制种大县。截至目前，该县累计引进种业公司17家，正加速向南亚热带重要种业示范基地的目标迈进。\n\n　　“会思考”的种业大脑 让数据成农民“新农具”\n\n　　黄麟惠介绍，马山县搭建“感知—网络—数据—平台—应用”五层架构，物联网设备化身田间哨兵，实时回传土壤湿度与气象数据，无人机精准洞察作物长势，AI智能分析生成农事建议。当地开发作物长势、去雄识别、授粉分析等4个AI模型，“马山数智农田”App实现语音交互与离线识别，让数据成为农民种田的“新农具”。\n\n　　数字技术让联农带农更有“温度”。马山为农户打通租金、薪金、奖金、佣金、收益金“五金”增收渠道，收益一键到账。全县制种订单产值近4亿元(人民币，下同)，带动用工近70万人次，农民户均年增收5000元以上。《数智赋能 马山有“种”》荣获2025年全国数字乡村创新大赛三等奖，马山实践成为全国县域种业全产业链数字化发展的典型范例。\n\n　　以点带面 数字赋能乡村全域发展\n\n　　在数字种业取得突破的基础上，马山县以点带面、全域联动，推动数字技术从种业产业向公共服务、乡村治理等领域全面延伸。\n\n　　作为广西“一表通”首个试点县，马山县整合形成45个台账，开通826个账号实现数字化管理，推动基层填表报数负担大幅减轻。\n\n　　该县积极布局低空经济，今年4月低空政务平台正式启用，6个乡镇无人机固定机场投入运行，累计巡检3091架次，协助处置林区用火145次。马山县民族职业技术学校开设南宁市首个县域中职“无人机操控与维护”专业，马山成为广西县域低空经济政务应用先行试点。\n\n　　数字治理亦全面铺开。马山县11个乡镇127路智能感知摄像头全面铺设，有效提升了农村地区公共安全水平；就业信息资源库累计采集劳动力信息30.86万人，实现岗位智能匹配与精准推送；互联网诊疗和“互联网+上门护理”服务惠及民众，AI养老综合服务平台启动建设，为老年群体提供智能化养老服务新选择。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3e2bd6be59","title":"从“城市包围机场”到4F级枢纽：呼和浩特新机场“大”在哪？","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734954.shtml","summary":"中新网呼和浩特11月19日电 题：从“城市包围机场”到4F级枢纽：呼和浩特新机场“大”在哪？","summary_short":"中新网呼和浩特11月19日电 题：从“城市包围机场”到4F级枢纽：呼和浩特新机场“大”在哪？","digest":"题：从“城市包围机场”到4F级枢纽：呼和浩特新机场“大”在哪","points":["抬头是层层铺开的马鞍形屋面，蒙古包形制的天窗把阳光引进大厅…","19日，中新网记者参加呼和浩特盛乐国际机场媒体开放日活动","这座航站楼建筑面积32万平方米，是白塔机场航站楼的3倍左右"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:23:48+08:00","size":1,"keywords":[],"body":"中新网呼和浩特11月19日电 题：从“城市包围机场”到4F级枢纽：呼和浩特新机场“大”在哪？\n\n　　中新网记者 刘文华\n\n　　抬头是层层铺开的马鞍形屋面，蒙古包形制的天窗把阳光引进大厅，750米长的悬挑屋檐从远处看像一条舒展的哈达。19日，中新网记者参加呼和浩特盛乐国际机场媒体开放日活动。走进航站楼，第一感觉就是“大”。\n\n　　这座航站楼建筑面积32万平方米，是白塔机场航站楼的3倍左右。不少呼和浩特人印象里，白塔机场很紧凑，进门、值机、安检、登机几步就完成。在盛乐机场，国内B区最远的登机口有725米，要走10分钟左右。记者沿出发大厅、安检隔离区、行李提取厅、国际到达厅、交通换乘中心一路走下来，渐渐觉得累，好在有电梯和扶梯，能省不少力气。机场测试显示，旅客过安检后平均7分钟走到登机口。\n\n俯瞰呼和浩特盛乐国际机场。　中新网记者 刘文华 摄\n\n　　为何要搬？\n\n　　“白塔机场2004年扩建时，规划到2015年旅客吞吐量达到300万人次，2019年实际已超过1315万人次。”讲解员介绍，白塔机场始建于1958年，只有一条跑道，长期超负荷运行，同时还是首都机场的主备降场。城市不断向东扩，机场离城市建成区最近只有约2.6至2.7公里，“城市包围机场”的局面已经形成。航班起降要从城区上空经过，噪声和安全风险越来越大。\n\n　　当年也论证过原地扩建、呼包鄂共建机场等方案，最后决定迁到和林格尔县。项目从2012年启动，到今年11月26日投运，历经14年。新机场是内蒙古首座4F级国际机场，有两条相距2公里、可以独立运行的平行跑道，南跑道长3800米，北跑道长3400米，设130个停机位，每年可保障旅客2800万人次。\n\n　　机场名字也有来历。盛乐曾是北魏早期的都城。国际到达厅里，用专门设计的魏碑“盛乐体”写着问候语，背景是18种文字的“你好”。\n\n呼和浩特盛乐国际机场航站楼内，旅客搭乘自动人行道前行，指示牌随处可见。　中新网记者 刘文华 摄\n\n　　“大”了，也要“快”\n\n　　出发大厅有98个值机柜台，另有45台自助值机设备和44台自助行李托运设备，刷脸就能办，选座值机30秒左右完成。以往设在白塔机场出港大厅的预安检，如今并进了安检通道的自助验证闸机，旅客少过一道验证。\n\n　　找人也不用再“全楼广播”。离港、监控、广播系统打通后，如果有旅客迟迟没登机，AI系统能很快找到他所在的区域，只在这片区域播放催促登机的广播。96777旅客服务热线接入了DeepSeek大模型。27条登机桥实现了L4级自动驾驶，预计每年能省下人工成本1200万元左右。\n\n　　在行李提取厅，旅客可以通过观看视频直播，了解自己的行李被运到了哪里。机场承诺，国内进港航班首件行李在旅客到达行李转盘后8分钟内、末件30分钟内可以提取。中转行李自动分拣系统目前在全国是第一家，分拣效率预计提高30%以上。\n\n呼和浩特盛乐国际机场内的行李提取大厅。　中新网记者 刘文华 摄\n\n　　向外地旅客打出“中转牌”\n\n　　航站楼变大、跑道翻倍之外，新机场也在拓展客源。机场推出“经呼飞·盛乐悦中转”服务，共有“九免十二优”21项，包括免费正餐、免费隔夜住宿、免费小微旅游等。通程航班“一次值机、一次安检、行李直挂”，没有托运行李的旅客最短60分钟就能完成中转。按2026至2027年度冬春航班计划，投运后飞粤港澳大湾区日均11班，飞长三角日均21班，还将新增拉萨、北海、西双版纳等航点。\n\n　　记者注意到，有个细节很有北方特色：每年11月1日到次年4月15日，航站楼提供冬衣寄存服务。从“零下”的呼和浩特飞去西双版纳，羽绒服不用一路抱着走。楼内商品价格对标当地主要商圈，承诺实现“同城同质同价”。\n\n　　参观的最后一站是交通换乘中心。航站楼、交通换乘中心和停车楼一体化衔接，方便旅客换乘大巴、出租车、网约车或自驾离开。停车楼有1948个车位、205个充电桩；地面公共交通方面，有4条机场快线(票价25元)，另有6条机场公交(票价5元)。\n\n　　“欢迎各位届时从这里出发，去看更远的地方。”讲解员说。11月26日，服役68年的白塔机场将关闭，由盛乐机场接替。按照安排，转场前后航班将有短期临时调减，4周后航线将全部恢复。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca20d00017c","title":"康诺亚：CLDN18.2 ADC CMG901治疗2L+胃癌BLA获FDA受理","url":"https://www.jiemian.com/article/15352391.html","summary":"11月19日，康诺亚宣布，公司核心产品Claudin 18.2（CLDN18.2）抗体偶联药物（ADC）CMG901（Sonesitatug vedotin…","summary_short":"11月19日，康诺亚宣布，公司核心产品Claudin 18.2（CLDN18.2）抗体偶联药物（ADC）CMG901（S…","digest":"11月19日，康诺亚宣布…","points":["CMG901为首个在全球范围内递交新药上市申请的CLDN18.2 ADC…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T22:02:45+08:00","size":1,"keywords":[],"body":"11月19日，康诺亚宣布，公司核心产品Claudin 18.2（CLDN18.2）抗体偶联药物（ADC）CMG901（Sonesitatug vedotin，AZD0901）生物制品许可申请（BLA）获美国食品药品监督管理局（FDA）受理，并被授予优先审评资格，拟用于肿瘤细胞CLDN18.2 表达比例≥25%（任何染色强度）的局部晚期或转移性胃癌、胃食管结合部（GEJ）癌或食管腺癌（EAC）患者的二线及以后（2L+）治疗，覆盖约60%胃癌/GEJ癌患者人群。CMG901为首个在全球范围内递交新药上市申请的CLDN18.2 ADC，该BLA的目标审评完成日期预计为2027年二季度。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0bbefc86ce","title":"黃廷方慈善基金投得大東山石屋 設販賣機提供涼茶及朱古力熱飲","url":"https://www.stheadline.com/realtime-property/3639020/黃廷方慈善基金投得大東山石屋-設販賣機提供涼茶及朱古力熱飲","summary":"由導演翁維銓持有的大東山爛頭營3號石屋，前以38萬元開價拍賣，競投氣氛激烈，短短11分鐘內獲承價50口，最終搶高至288萬元成交，「石屋變黃金屋」。","summary_short":"由導演翁維銓持有的大東山爛頭營3號石屋，前以38萬元開價拍賣，競投氣氛激烈，短短11分鐘內獲承價50口…","digest":"由導演翁維銓持有的大東山爛頭營3號石屋，前以38萬元開價拍賣，競投氣氛激烈…","points":["由導演翁維銓持有的大東山爛頭營3號石屋，前以38萬元開價拍賣，競投氣氛激烈…","神秘買家身份正式揭曉，由信和集團旗下的黃廷方慈善基金聯同大澳文物酒店投得…","相關新聞：大東山爛頭營石屋288萬拍出 11分鐘承價50口 帳面升值575倍 拍賣行總經理…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T21:59:11+08:00","size":1,"keywords":[],"body":"由導演翁維銓持有的大東山爛頭營3號石屋，前以38萬元開價拍賣，競投氣氛激烈，短短11分鐘內獲承價50口，最終搶高至288萬元成交，「石屋變黃金屋」。神秘買家身份正式揭曉，由信和集團旗下的黃廷方慈善基金聯同大澳文物酒店投得，計劃將這座逾百年歷史的石屋保育活化為高山休憩區，並設販賣機供涼茶熱飲。\n相關新聞：大東山爛頭營石屋288萬拍出 11分鐘承價50口 帳面升值575倍 拍賣行總經理：成交價超乎預期\n接近信和人士表示，基金與大澳文物酒店投得石屋後，將進行保育並活化為高山休憩區，讓本地及來世界各地的遠足人士與生態旅遊愛好者，在此稍事休息。石屋內將設置自動販賣機，提供港式涼茶及朱古力熱飲。\n大東山爛頭營3號石屋：\n翁太：能照顧辛苦上山遊人\n該名人士補充，集團認同導演翁氏夫婦理念，希望承傳歷史建築並保留大自然景觀。大東山是本港地標，而集團旗下大澳文物酒店具豐富保育經驗，是次投得石屋可發揮協同作用；加上信和集團主席黃永光本身熱愛大自然，故很支持是次保育行動。\n信和黃永光本身熱愛大自然，故支持是次保育行動。\n對於物業覓得有心買家，翁維銓太太Portia表示高興，認為新計劃能好好照顧辛苦上山的遊人，讓他們盡情享受山野之樂。\n義工關注物資補給成本\n經常登山的攝影愛好者兼教會義工Raymond指出，該石屋位置較為偏僻，且處於較低位置，以往較少遊人抵達，相信日後改作補給點後，將熱鬧起來。不過他亦關注營運挑戰，直言山上運送物資並不容易，即使設置自動販賣機亦需定期補貨，若動用直升機運送則成本高昂，將拭目以待信和如何經營。此外，他提到山上垃圾問題一直備受關注，過去全賴義工定期清理，如今有實力新買家加入，相信為山野清潔增添一份強大力量。\n承襲大澳文物酒店保育經驗\n信和旗下該非牟利機構將舊大澳警署，活化成只有9間客房的精品酒店。\n事實上，信和黃氏家族在歷史建築保育方面早有往績。家族於2008年成立非牟利機構「香港歷史文物保育建設有限公司」，並參與活化建於1902年、前身為舊大澳警署的二級歷史建築。該機構成功將這座昔日用作打擊海盜的殖民地建築，變身為僅設9間客房的「大澳文物酒店」，原汁原味保留古董大砲、壁爐與木百葉窗，更將報案室改為接待處、看守塔化作玻璃屋餐廳。該酒店以社會企業模式營運，盈餘全數回饋大澳社區，更曾榮獲聯合國教科文組織（UNESCO）文化遺產保護獎項。\n相關新聞：大東山爛頭營石屋女主人親述放售原因 驚訝估值高569倍 拍賣不設底價 盼新主守護芒草風貌\n相關新聞：大東山上生活首要解決水電-搬發電機要直昇機-水箱常漏水-惟物資難得更珍惜 | 星島頭條","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2ec38e90eb","title":"拼多多发布Q3财报，赵佳臻：坚持深耕“全产业链”，推动传统产业数智升级","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734947.shtml","summary":"11月19日，拼多多发布截至9月30日的2026年第三季度财报。","summary_short":"11月19日，拼多多发布截至9月30日的2026年第三季度财报。","digest":"11月19日，拼多多发布截至9月30日的2026年第三季度财报","points":["11月19日，拼多多发布截至9月30日的2026年第三季度财报","受益于“新十年高质量发展”战略的效用释放，以及平台治理体系的持续升级…","今年三季度，拼多多“新十年高质量发展”在纵深推进中走过了完整的一年，阶段性成效正在加速释放"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T21:54:31+08:00","size":1,"keywords":[],"body":"11月19日，拼多多发布截至9月30日的2026年第三季度财报。受益于“新十年高质量发展”战略的效用释放，以及平台治理体系的持续升级，拼多多三季度营收达到1083亿元，净利润295亿元，业绩表现保持稳健。\n\n　　今年三季度，拼多多“新十年高质量发展”在纵深推进中走过了完整的一年，阶段性成效正在加速释放。一方面，拼多多“千亿扶持”惠商战略持续深化对商家和产业的扶持，将扶持效应传导至更深的产业腹地，供需两侧质效升级更加明显。另一方面，“三年再造拼多多”战略也在稳步推进，自营品牌业务初步与产业带商家展开了规模化的合作，加速推动供应链迈向价值高端。\n\n　　“过去这个季度，我们的‘千亿扶持’战略持续投入生态建设，全面升级平台治理，扶持范围从商家层面延伸至‘全产业链’，供给侧加速迈向品牌化，生产侧逐步转向数智化，也为消费侧提供了更加优质、丰富的新供给。”拼多多集团联席董事长兼联席CEO赵佳臻表示，为了持续推动产业升级，我们也进一步加强了平台的治理和服务能力，在服务品质保障方面持续投入人力和资源，传统产业数据处理服务中心和传统制造高质量发展综合服务中心初步成型，为传统产业的数智化改造提供了更坚实的后端保障。\n\n　　“今年下半年，全球各个市场的监管要求、合规政策和关税政策还在持续变化，给我们带来了一些新的挑战和要求，我们也在积极应对，努力做好各方面的工作。”拼多多集团联席董事长兼联席CEO陈磊表示，我们加强了与全球各个地区行业协会、知产机构的合作，持续优化平台的治理规则，系统性地提升了合规能力。同时，我们将继续专注于供应链的转型升级，把已经积累的供应链能力，转化为能够穿越周期的成果和资产，推动传统制造完成品牌化、数智化转型，走向全球品牌。\n\n　　“千亿扶持”加码“全产业链”，供需两侧实现质效升级\n\n　　今年以来，拼多多“千亿扶持”惠商战略继续加码平台及产业生态，依托“多多好特产”“新质供给”“包邮进村”等专项行动，持续深入商家、工厂及供应链的各个环节，系统性地提升整个产业链的产品能力、研发能力、生产能力、组织能力以及品牌能力，推动“全产业链”加快转型升级。\n\n　　在农特产区，“2026多多好特产”专项行动先后走进眉山柑橘、融安金桔、武鸣沃柑、大连水产、桐庐桂花等农特产区，从源头提升农货品质标准，助力商家和农户把品控标准前置到生产、采摘、分拣、打包的各个环节，推动初级农产品向深加工、品牌化拓展，不断完善冷链物流，持续破解农产区“有品质无品牌”的产业痛点，带动种植户“好果卖好价、丰产又丰收”，加快推动农产区实现价值转换。\n\n▲在桐庐桂花产业中，平台商家引进了真空低温微波干燥技术。(受访者供图)\n\n　　以浙江桐庐的桂花产业为例，当地的母岭村盛产桂花，但因价格低、花期短等原因，长期以来只能“烂在枝头”。过去两年，“桂花风味产品”持续走红，商家在平台的运营、数据和资源的扶持下，与母岭村展开深度合作，从源头对桂花的采收时机、含水率、杂质控制等标准严格把关，设立收购“返利”机制，引入新式电动采收工具和真空低温微波干燥技术，打造了一个经得起标准检验、撑得起产品创新、带得动农户增收的优质供给和产业生态。今年的桂花采摘季，平台商家对当地优质桂花进行溢价收购，村民在短短5天内最多可增收10000余元。\n\n　　9月份，在第九届“农民丰收节”期间，拼多多作为电商平台代表深度参与此次活动，并联合30万农产品商家上线“多多丰收馆”，持续推动各地农货直连全国大市场，助力全国各大农产区丰产增收。\n\n　　在产业带，拼多多“新质供给”专项团队先后深入金华文具、临沂户外、深圳眼镜、高阳毛巾等数十个产业带，平台基于市场新需求，打破“你卖我扶”的单向关系，以商家为锚点，重塑“全产业链”的研发和生产方式，从以产能、规模为主转向以质量、品牌为主，推动各个环节的生产力、生产要素、技术能力和市场主体进行迭代升级，为消费者创造了新一代的产品和品牌，进一步提升了广大消费者的生活品质。\n\n　　在山东临沂，当地的户外产品此前以代工为主，在平台的扶持下，当地商家基于平台的新趋势，实现了从供给驱动到需求驱动的转型，走出了一条自有品牌道路，年销量实现了10倍以上的增长，并引进了先进生产线等设备，核心零部件也从之前的以采购为主，实现了90%以上的自产率，完成了产业的迭代升级。在河北高阳的纺织产业带，当地商家实现品牌化转型后，开始带动上下游的合作工厂完成适配性改造，促进了产业集群的快速发展。公开数据显示，当地超六成纺织企业进行了数字化改造，生产效率和收益也因此实现了大幅提升。\n\n　　此外，拼多多“包邮进村”服务也在持续为更多偏远乡村带来新电商的普惠，平台生鲜、百货、家电、农资、农具等类目的产品订单量在“多多进村”覆盖的地区均实现大幅攀升，也让当地村民获得更丰富的物质和精神供给。以农林工具产品为例，该类产品的主要受众集中在四五线城市与广大村镇，过去因为快递及退货成本高，很难在偏远乡村地区打开市场。当下，在“多多进村”覆盖的区域，很多商家的订单量增长了三成以上，迎来了产业发展的新机遇。\n\n　　受益于“千亿扶持”在供应链上积累的基础和能力，“三年再造拼多多战略”加速推进，新拼姆自营品牌业务团队先后深入不同的产业带，与供应链展开了全面且深度的合作，针对不同类目的商家提供了定制化的合作方案，合作的规模和力度都有大幅提升，批量化生产、上线了具备更高品质、更高溢价的自营品牌产品，持续提升供应链的生产标准、品控体系和品牌能力，为供应链走向价值高端又迈出了坚实的一步。\n\n　　持续提升平台治理能力，积极承担平台企业社会责任\n\n　　为了给供应链升级保驾护航，拼多多对平台治理和服务能力也进行了全方位的升级，持续加大对人员、技术和研发的投入，在全域品类逐一开展“靶向式”专项治理，推动生态治理向常态化、精细化、制度化纵深迈进。\n\n　　过去这个季度，拼多多先后推出了30多项专项治理举措，覆盖个体经营者准入门槛、食品描述与标识使用治理、食用级化学产品合规治理、取暖类商品虚假宣传、化妆品夸大宣传、未成年人网络保护等领域。今年以来，拼多多已经累计推出了180余项治理举措，坚持以制度刚性筑牢合规底线，以系统思维重构治理逻辑，切实营造一个更安全、更规范、更值得信赖的消费环境。\n\n　　在全球化业务上，拼多多也加强了与全球各个地区行业协会、知产机构的合作，持续优化平台的治理规则，系统性地提升合规能力。比如，拼多多与国际反假冒联盟(IACC)扩大了合作，推出了一项专门的知识产权保护计划，为商家和品牌升级了知产侵权的投诉渠道，通过该计划提交的每项知产投诉都将在48小时内得到回复。此外，参与该计划的品牌还可以提交关键词和图片，帮助平台在收到投诉前识别潜在的侵权商品信息，持续提升平台的知产保护能力。\n\n▲在第五届多多农研大赛上，参赛团队建造了各具特色的植物工厂。(摄影陆云波)\n\n　　此外，拼多多长期投入的农研领域也收获了不错的成果。前不久，第五届“多多农研科技大赛”落幕，本届赛事共吸引了全球46支团队、超300人报名，人数创历届赛事之最。在决赛中，参赛队伍融合视觉识别、物联网、自动化控制等前沿技术，直面设施农业在环境调控、种植精度、生产能耗等方面的行业痛点，设计、建造各具特色的植物工厂，并进行国产草莓栽培攻关，为农研设施的技术落地与产业转化注入了多元活力。\n\n　　在社会责任方面，拼多多一直积极承担平台企业应尽的义务，持续回馈社会。三季度，西藏日喀则市吉隆县发生重大泥石流灾害、那曲市巴青县发生7.0级地震，均造成重大人员伤亡，拼多多通过中华慈善总会先后向两地各捐赠现金1000万元，用于采购救灾物资和设备、安置受灾群众及支持灾后重建。\n\n　　赵佳臻表示，下一阶段我们将立足“新十年高质量发展”，秉承长期主义，继续坚持消费者导向，提升平台的治理能力，坚持深耕“全产业链”，推动供应链数智化转型，为消费者提供更好的商品和服务，以实际行动为用户、商家和社会创造共赢生态。\n\n　　“当下，拼多多一端连着广大商家和产业带的制造能力，另一端关系着全球几十亿消费者的日常需求，这让我们看到重塑供应链协同的新机遇，也是我们坚定‘重仓供应链’战略信心的来源。”陈磊表示，我们将继续专注于消费者需求，持续在供应链上下笨功夫，把已经积累的供应链能力，转化为能够穿越周期的成果和资产，推动传统制造完成品牌化、数智化转型，走向价值高端，走向全球品牌。\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"生活","total":21,"items":[{"id":"c614a9cde7f","title":"香港公開羽毛球錦標賽｜混雙「澤柔配」陳延澤 吳芷柔止步16強 上寶貴一課 期望新賽季衝上「大賽」頒獎台","url":"https://www.stheadline.com/realtime-sport/3639135/香港公開羽毛球錦標賽混雙澤柔配陳延澤-吳芷柔止步16強-上寶貴一課-期望新賽季衝上大賽頒獎台","summary":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合，在64分鐘的激戰中，「澤柔配」未能把握局中領先優勢，以22:24、21:19、11:21見負；總結今季的比賽…","summary_short":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合，在64分鐘的激戰中…","digest":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…","points":["香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…","總結今季的比賽，今年三月才穩定混雙合作關係的他們，世界排名已去到25位，超出教練團預期…","「澤柔配」今日的16強有點可惜，他們跟印尼組合Dejan Ferdinansyah及Feli…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:21:59+08:00","size":2,"keywords":[],"body":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合，在64分鐘的激戰中，「澤柔配」未能把握局中領先優勢，以22:24、21:19、11:21見負；總結今季的比賽，今年三月才穩定混雙合作關係的他們，世界排名已去到25位，超出教練團預期，他們期望2027年新賽季能衝上頒獎台，為五月展開的奧運計分周期打好基礎。\n「澤柔配」今日的16強有點可惜，他們跟印尼組合Dejan Ferdinansyah及Felisha Alberta Nathaniel Pasaribu的競爭像過山車，在首局初段港隊氣勢如虹，曾領先8:0，但對方一分分追上，雙方要打至「刁時」才分出勝負，結果是港隊以22:24先失一局，第二局在球迷打氣聲中越戰越勇，在這局拉鋸戰中，「澤柔配」以21:19扳成平手；決勝局初段只有一、兩分差距，但小休後一節，對方的主動追擊一分分拉開比賽，港隊終以11:21敗陣，16強止步。\n問到首局被反勝原因，延澤表示：「主要是對手的發接發和對每一分的處理比我們做得更好，當對手的分數逼近，我們自己也有些手緊，影響到發揮。」\n周四晚有八成入座率，不少人為港隊加油打氣，芷柔認為主場的壓力問題不大：「有那麼多觀眾支持，我會將壓力變成動力，沒有半點負面影響，這可能是心態及士氣上比以往好些。」\n今年三月固定合作混雙後，延澤及芷柔的世界排名徘徊在100位，五月闖入頭50位內，並接連在BWF世巡賽登上頒獎台，包括五月中的中國寶雞羽毛球大師賽（超級100）的亞軍及六月中澳門公開賽（超級300）的亞軍，世界排名於六月底升至頭32位內，這意味著二人可以打上去BWF更高級別的比賽，包括超級500、 750甚至1000級別的比賽，更首次參加了八月世錦賽及九月亞運會，二人表示這些「大賽」的經驗令他們獲益良多。\n芷柔說：「我們二人的組合越來越合作得好，近幾個月憑世界排名打到的超級500至1000級的比賽，對我們準備明年奧運積分周期很有幫助，至少令我們可以提早跟強手對陣，在高水平的比賽中檢視我們自己的水平；發覺高手們發揮很穩定，我們需要慢慢學習，有甚麼不好的，包括穩定性及臨場的變化，彼此在現場要怎樣溝通去處理下一球，或者在對方狀態散了，應如何去互相提醒，掘大家的狀態叫回來，這些都要去改善。」\n談到2027年的目標，包括新制的15分及半年後即展開的奧運積分周期，二人不約而同表示「一定要向上衝」：「爭冠的心態一定要有，今季的成績（特別是超級500以上的大賽），成績沒理想中好，但每一次感覺不是不夠打，很多時戰滿三局或『刁時』才輸，主要是在關鍵分沒處理好，所以在新一個賽季，我們要保持想衝想贏的心態。」\n記者/攝影：徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"香港公開羽毛球錦標賽｜混雙「澤柔配」陳延澤 吳芷柔止步16強 上寶貴一課 期望新賽季衝上「大賽」頒獎台","url":"https://www.stheadline.com/realtime-sport/3639135/香港公開羽毛球錦標賽混雙澤柔配陳延澤-吳芷柔止步16強-上寶貴一課-期望新賽季衝上大賽頒獎台","source_display":"星島頭條","published_at":"2026-11-20T02:21:59+08:00","category":"生活","digest":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…"},{"title":"香港公開羽毛球錦標賽｜伍家朗因傷中途退賽感「遺憾」 李卓耀自責壓力下只能發揮五成功力","url":"https://www.stheadline.com/realtime-sport/3639031/香港公開羽毛球錦標賽伍家朗因傷中途退賽感遺憾-李卓耀自責壓力下只能發揮五成功力","source_display":"星島頭條","published_at":"2026-11-19T22:58:18+08:00","category":"生活","digest":"兩位前「香港冠軍」李卓耀及伍家朗周四在八成滿的體藝館舉行的香港公開羽毛球錦標賽男單1…"}],"cross":{"total":2,"angles":[{"point":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639135/香港公開羽毛球錦標賽混雙澤柔配陳延澤-吳芷柔止步16強-上寶貴一課-期望新賽季衝上大賽頒獎台"},{"point":"兩位前「香港冠軍」李卓耀及伍家朗周四在八成滿的體藝館舉行的香港公開羽毛球錦標賽男單1…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639031/香港公開羽毛球錦標賽伍家朗因傷中途退賽感遺憾-李卓耀自責壓力下只能發揮五成功力"}]}},{"id":"c5f5e59d784","title":"萬千星輝賀台慶2026｜MYNT魔音女團露腰唱跳新歌 倪嘉雯爆排足一周 劉佩玥大讚有進步","url":"https://www.stheadline.com/film-drama/3639040/萬千星輝賀台慶2026MYNT魔音女團露腰唱跳新歌-倪嘉雯爆排足一周-劉佩玥大讚有進步","summary":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行，當中由六位TVB小花組成的「魔音女團」MYNT 震撼登場，成為全場焦點！","summary_short":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行…","digest":"《萬千星輝賀台慶2026》於今晚在將軍澳電視城隆重舉行…","points":["《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行…","成員宋宛穎（Sabrina）、倪嘉雯（Carmen）、莊子璇（Hilary）…","六女全晚舞姿整齊、動感十足，為盛典注入滿滿的青春熱血與活力"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:28:41+08:00","size":2,"keywords":[],"body":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行，當中由六位TVB小花組成的「魔音女團」MYNT 震撼登場，成為全場焦點！成員宋宛穎（Sabrina）、倪嘉雯（Carmen）、莊子璇（Hilary）、倪樂琳（Ellyn）、喬美莎（Chelsea）及盧映彤（Skylar）齊齊以型格露腰裝束亮相，合力唱跳第三首全新主打單曲〈Tic Toc〉。六女全晚舞姿整齊、動感十足，為盛典注入滿滿的青春熱血與活力。對於今次台慶跳唱演出，倪嘉雯（Carmen）表示自我感覺良好，並透露為了是次表演足足排練了一星期，連前輩劉佩玥（Moon）遇見她們時亦大讚有進步，希望觀眾能看到她們的蛻變。\n莊子璇倪樂琳預告赴韓集訓\n談到即將出發到韓國展開地獄式集訓，MYNT 成員均顯得相當興奮。被問到有否為嚴寒天氣做好準備，莊子璇（Hilary）笑言已預備了大量暖包，更準備「寓工作於娛樂」；而倪樂琳（Ellyn）則吃貨上身，揚言到當地一定要大牌檔吃烤肉，又大讚韓國便利店的食物非常美味。雖然被取笑今次旅程是「增肥團」，但她們自信地表示不怕變肥，因為當地天氣寒冷加上排練艱苦，燃燒脂肪的速度會非常快。另外，講到台慶若幸運抽中大獎，盧映彤（Skylar）大方笑言會分錢給隊友，每人派一萬元，屆時在韓國集訓時由她請客，展現團員間的超強閨密情！\n相關閱讀：TVB台慶2026丨一文睇清精彩時刻 陳煒領軍性感熱舞 許志安馬國明「安心事件」後首同場","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"萬千星輝賀台慶2026｜MYNT魔音女團露腰唱跳新歌 倪嘉雯爆排足一周 劉佩玥大讚有進步","url":"https://www.stheadline.com/film-drama/3639040/萬千星輝賀台慶2026MYNT魔音女團露腰唱跳新歌-倪嘉雯爆排足一周-劉佩玥大讚有進步","source_display":"星島頭條","published_at":"2026-11-19T23:28:41+08:00","category":"生活","digest":"《萬千星輝賀台慶2026》於今晚在將軍澳電視城隆重舉行…"},{"title":"萬千星輝賀台慶2026丨紅地氈盛況現場直擊 星光熠熠爭妍鬥麗","url":"https://news.tvb.com/tc/1207275-萬千星輝賀台慶2026丨紅地氈盛況現場直擊星光熠熠爭妍鬥麗","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:58:00+08:00","category":"娛樂","digest":"TVB年度盛事《萬千星輝賀台慶2026》今晚隆重舉行…"}],"cross":{"total":2,"angles":[{"point":"TVB年度盛事《萬千星輝賀台慶2026》今晚隆重舉行…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207275-萬千星輝賀台慶2026丨紅地氈盛況現場直擊星光熠熠爭妍鬥麗"},{"point":"《萬千星輝賀台慶2026》於今晚在將軍澳電視城隆重舉行…","sources":["星島頭條"],"url":"https://www.stheadline.com/film-drama/3639040/萬千星輝賀台慶2026MYNT魔音女團露腰唱跳新歌-倪嘉雯爆排足一周-劉佩玥大讚有進步"}]}},{"id":"cddd0e0d7a0","title":"TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女 鄧凱文澎湃上圍搶鏡 陳自瑤陳煒晒人妻魅力","url":"https://www.stheadline.com/film-drama/3638904/TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女-鄧凱文澎湃上圍搶鏡-陳自瑤陳煒晒人妻魅力","summary":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視廣播城隆重揭幕！","summary_short":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視廣播城隆重揭幕！","digest":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚在將軍澳電視廣播城隆重揭幕","points":["TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視廣播城隆重揭幕","今年適逢59周年台慶，除了晚會節目陣容鼎盛，每年最受矚目的「
