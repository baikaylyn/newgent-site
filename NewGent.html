at":"2026-11-20T22:50:58+08:00","category":"","digest":"11月20日，鸿蒙智行享界V8及星芒品牌发布会在北京举行"},{"title":"余承东：享界V8现在用的是L2辅助驾驶，开车不能睡觉","url":"https://www.jiemian.com/article/15356156.html","source_display":"界面新聞","published_at":"2026-11-20T17:24:16+08:00","category":"","digest":"11月20日，华为常务董事、产品投资评审委员会主任、终端BG董事长余承东发文表示…"}],"cross":{"total":2,"angles":[{"point":"11月20日，鸿蒙智行享界V8及星芒品牌发布会在北京举行","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15357116.html"},{"point":"11月20日，华为常务董事、产品投资评审委员会主任、终端BG董事长余承东发文表示…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15356156.html"}]}},{"id":"cc09a63bbb5","title":"2026地球“体检”报告发布 郭华东院士解读十大亮点成果","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735440.shtml","summary":"中新网北京11月20日电 (记者 孙自法)被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月20日在北京发布…","summary_short":"中新网北京11月20日电 (记者 孙自法)被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)…","digest":"被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)——全…","points":["中新网北京11月20日电 (记者 孙自法)被形象称为地球年度“体检”报告的《地球大数据支撑可…","中国科学院院士、可持续发展大数据国际研究中心主任郭华东在发布会上解读指出…","——中国62.8%的指标接近或实现联合国2030年可持续发展议程目标"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T19:39:48+08:00","size":2,"keywords":[],"body":"中新网北京11月20日电 (记者 孙自法)被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月20日在北京发布，当天同步在联合国官网发布，并面向联合国会员国发放，备受关注。\n\n郭华东院士解读报告。中新网记者 孙自法 摄\n\n　　中国科学院院士、可持续发展大数据国际研究中心主任郭华东在发布会上解读指出，该报告具有十大亮点成果。\n\n　　——中国62.8%的指标接近或实现联合国2030年可持续发展议程目标。截至2025年，通过地球大数据评估了中国234个可持续发展目标(SDGs)指标状态和趋势，占所有SDGs指标(截至2025年初共251个指标)的93.2%，评估指标数量比联合国官方监测指标数多一倍；中国已有147个指标(62.8%)接近或实现2030年目标，较2015年的38.9%提升23.9个百分点。预计到2030年，中国约75%的指标可实现其对应目标。\n\n　　——全球发展倡议实施五年切实加速落实SDGs。报告系统梳理了全球发展倡议在减贫、粮食安全、抗疫和疫苗等八大领域对SDGs的全面推动作用：已在130多个国家实施2000多个合作项目，培训各类人才超过20万名。例如，可持续发展科学卫星1号(SDGSAT-1)获取超54万景数据，提供122个国家使用。\n\n　　——全球油菜生产高度集聚，中国南方冬闲田蕴含扩种潜力。评估显示，全球84.9%的油菜种植面积集中于北半球中高纬度地区；中国油菜适宜种植区主要分布在长江中下游平原和东北平原，南方冬闲田仍具有扩种空间。高分辨率空间监测能进一步识别油菜适宜扩种区域及潜在扩种规模，为优化油料产能布局、提高耕地复种利用水平提供科学依据。\n\n　　——中国进入用水效率提升与水资源压力缓解协同共进的发展阶段。报告系统分析中国用水效率与用水紧张程度的长期变化及其协同关系显示，2000—2024年，全国用水效率增长约7.3倍；用水紧张程度在2011年达到峰值后总体持续下降，由2015年的38.2%降至2024年的31%，同期极度缺水人口减少1.7亿人。中国在用水效率持续提高的同时，用水紧张程度和缺水人口在2011年前后由增加趋势转为降低趋势，标志着中国水资源治理进入用水效率提升与水资源压力缓解协同推进的新阶段。\n\n　　——全球光伏分布高度集中，中国占比约41%，为核心增长引擎。报告生产出10米分辨率全球集中式光伏面板空间分布数据集显示，2025年，全球集中式光伏面板总面积约17523.5平方千米，但分布极不均衡，85.5%集中在中国、美国、印度、巴西、澳大利亚、欧洲地区及日本，其中，中国占比约41%，位居全球第一。报告评估显示：通过规模化开发与空间优化布局，中国已成为全球光伏发展的主要引擎，为全球能源转型与碳减排作出重要贡献。\n\n　　——中国棚户区改造直接改善城市中近1亿人居住环境。评估显示，2014—2024年，中国城市城中村(含棚户区)占城市建成区面积比例由10.4%下降至8.1%；21世纪以来，中国棚户区改造直接改善城市中近1亿人居住环境，城市基础设施完善促进公共开放空间和公共交通便利可达人口分别增长3.6亿和3.7亿。这表明，以城市更新统筹居住改善与公共服务补短板，能够在快速城镇化中同步实现从“住有所居”迈向“住有宜居”。\n\n　　——全球受洪涝灾害影响人口呈显著增加趋势。研究发现，2015—2025年，全球洪涝淹没面积呈不显著增加趋势，但全球受洪涝灾害影响人口呈显著增加趋势；全球受洪涝灾害影响人口年均增长率为5.35%，增加趋势显著；在快速城镇化背景下，人口与财产向沿海低地、河漫滩等高风险洪泛区集聚的速率超过人口自然增长率，导致受影响人口暴露度放大；亚洲是受洪涝影响人口最多的地区，全球占比95.29%。\n\n　　——现阶段全球珊瑚礁灰沙岛整体呈收缩趋势且长期维持能力减弱。报告对全球珊瑚礁灰沙岛状况进行动态监测和评估显示，全球珊瑚礁灰沙岛整体呈现缓慢收缩趋势，但不同区域呈现明显分化特征，长期稳定性有所下降。\n\n　　——仅占全球陆域4.1%的生物圈保护区，覆盖近半数植物和超半数脊椎动物，支撑全球生物多样性保护。\n\n　　——SDGs综合分析表明，在治理决策中需考虑多目标多尺度的协同效应。研究表明，通过尺度细化和多要素交叉分析，可由“看指标”进一步走向“识别关联、诊断瓶颈、分区施策”，为SDGs多目标协同治理提供更精准的科学依据。\n\n报告北京发布现场合影。中新网记者 孙自法 摄\n\n　　据悉，2026地球“体检”报告由依托中国科学院建设、全球首个专门以大数据技术服务联合国2030年可持续发展议程和全球发展倡议的国际科研机构——可持续发展大数据国际研究中心牵头，联合近40家科研机构的170位专家共同撰写。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"2026地球“体检”报告发布 郭华东院士解读十大亮点成果","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735440.shtml","source_display":"中新網 時政","published_at":"2026-11-20T19:39:48+08:00","category":"內地","digest":"被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)——全…"},{"title":"2026地球“体检”报告：中国多个可持续发展指标贡献度居全球首位","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735303.shtml","source_display":"中新網 時政","published_at":"2026-11-20T16:57:19+08:00","category":"內地","digest":"《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月…"}],"cross":{"total":2,"angles":[{"point":"被形象称为地球年度“体检”报告的《地球大数据支撑可持续发展目标报告(2026)——全…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-20/10735440.shtml"},{"point":"《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-20/10735303.shtml"}]}},{"id":"cb72bae80d5","title":"宏福苑大火一周年｜陳國基：不會阻止合法悼念活動 相關部門願意提供協助 籲勿被他人利用作出破壞行為","url":"https://www.stheadline.com/society/3639341/宏福苑大火一周年陳國基不會阻止合法悼念活動-相關部門願意提供協助-籲勿被他人利用作出破壞行為","summary":"政務司司長陳國基今日(20日)在出席一個活動後表示，特區政府絕對容許並不會阻撓任何合法的悼念活動，相關部門更會在有需要時提供協助。","summary_short":"政務司司長陳國基今日(20日)在出席一個活動後表示，特區政府絕對容許並不會阻撓任何合法的悼念活動…","digest":"政務司司長陳國基今日(20日)在出席一個活動後表示…","points":["政務司司長陳國基今日(20日)在出席一個活動後表示…","政府並將落實調查委員會的120項建議及推動防止大廈「圍標」的制度改革，防止悲劇重演","不論是市民或災民，政府絕不會妨礙或阻止其悼念，甚至在有需要時…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:17:31+08:00","size":2,"keywords":[],"body":"政務司司長陳國基今日(20日)在出席一個活動後表示，特區政府絕對容許並不會阻撓任何合法的悼念活動，相關部門更會在有需要時提供協助。同時，政府並將落實調查委員會的120項建議及推動防止大廈「圍標」的制度改革，防止悲劇重演。\n絕不阻撓合法悼念 防範別有用心者借機破壞\n陳國基指出，只要是合法的悼念活動，政府均絕對容許。不論是市民或災民，政府絕不會妨礙或阻止其悼念，甚至在有需要時，相關政府部門會向希望進行悼念的市民提供協助。他提到，目前已知有不少團體（包括宗教團體）計劃舉辦悼念活動，政府樂意配合，並認為市民與災民參與此類活動。\n然而，陳國基提醒市民，政府注意到網上出現個別別有用心的人士，企圖利用悼念活動進行破壞。他呼籲市民在參與活動時必須謹慎選擇，切勿被他人利用而做出破壞社會秩序或危害他人人身安全的行為，並強調警方對任何違法行為定必依法處理。政府希望做到最好，讓市民和災民能在安心、順利的環境下進行悼念。\n行政長官親自部署 絕大部分災民已完成房屋交易\n在災民安置方面，陳國基透露，在行政長官的親自帶領下，整個政府正全力協助受火災影響的市民重建家園。目前，絕大部分受災市民的房屋已完成買賣，災民盡快租賃或購買合適的居所，期望他們能盡快重過新生。\n統籌跨部門落實120項改革 \n陳國基強調，宏福苑火災獨立委員會提出的120項改善建議，陳國基表示他已親自審閱並召開跨部門會議，現正統籌各局及各部門，盡力、盡快落實相關措施。他亦鼓勵公務員團隊提出比原建議更佳的創新方案，務求將未來的火警風險減至最低。\n相關新聞：\n大棋盤｜宏福業主上樓「求快」 務實考量主導","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"宏福苑大火一周年｜陳國基：不會阻止合法悼念活動 相關部門願意提供協助 籲勿被他人利用作出破壞行為","url":"https://www.stheadline.com/society/3639341/宏福苑大火一周年陳國基不會阻止合法悼念活動-相關部門願意提供協助-籲勿被他人利用作出破壞行為","source_display":"星島頭條","published_at":"2026-11-20T17:17:31+08:00","category":"港聞","digest":"政務司司長陳國基今日(20日)在出席一個活動後表示…"},{"title":"宏福苑大火一周年‧現場｜陳國基：政府不會妨礙或阻止悼念 提醒要慎選","url":"https://news.tvb.com/tc/1207457-宏福苑大火一周年現場陳國基政府不會妨礙或阻止悼念提醒要慎選","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T17:04+08:00","category":"港聞","digest":"宏福苑大火近一周年，政務司司長陳國基表示，政府不會妨礙或阻止市民悼念…"}],"cross":{"total":2,"angles":[{"point":"政務司司長陳國基今日(20日)在出席一個活動後表示…","sources":["星島頭條"],"url":"https://www.stheadline.com/society/3639341/宏福苑大火一周年陳國基不會阻止合法悼念活動-相關部門願意提供協助-籲勿被他人利用作出破壞行為"},{"point":"宏福苑大火近一周年，政務司司長陳國基表示，政府不會妨礙或阻止市民悼念…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207457-宏福苑大火一周年現場陳國基政府不會妨礙或阻止悼念提醒要慎選"}]}}],"sections":[{"name":"港聞","total":24,"items":[{"id":"c2ec4ce4d1e","title":"香港海關自主研發「ValidAP」獲國際肯定 奪「第六屆亞洲創新發明展覽會—香港」銀獎","url":"https://www.stheadline.com/breaking-news/3639432/香港海關自主研發ValidAP獲國際肯定-奪第六屆亞洲創新發明展覽會香港銀獎","summary":"由香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中脫穎而出，榮獲銀獎。","summary_short":"由香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中脫穎而出，榮獲銀獎。","digest":"由香港海關策劃的創新項目「ValidAP」…","points":["由香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中脫穎而出…","「亞洲創新發明展覽會—香港」由日內瓦國際發明展主辦機構與香港出口商會合作舉辦…","香港海關於11月19日至20日參與在香港會議展覽中心舉行的第六屆展覽會，期間設立專屬展位…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:12:01+08:00","size":1,"keywords":[],"body":"由香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中脫穎而出，榮獲銀獎。\n「亞洲創新發明展覽會—香港」由日內瓦國際發明展主辦機構與香港出口商會合作舉辦，是專為亞洲區內創新和發明而設的年度展覽及比賽。香港海關於11月19日至20日參與在香港會議展覽中心舉行的第六屆展覽會，期間設立專屬展位，並由助理關長（稅務及策略支援）李建基親自向評審團詳細介紹「ValidAP」的主要功能及技術特點。\n海關助理關長（稅務及策略支援）李建基向評審團詳細介紹「ValidAP」的主要功能及技術特點。香港海關FB圖片\n香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中榮獲銀獎。香港海關FB圖片\n香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中榮獲銀獎。香港海關FB圖片\n香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中榮獲銀獎。香港海關FB圖片\n「ValidAP」由香港海關主導開發，是一個運用密碼學及區塊鏈技術的電子文件驗證平台，為各類電子文件（包括國際貿易相關文件）提供即時、可靠及準確的驗證，有效加速物流與經濟發展。\n海關指今次獲獎不僅展現香港海關在推動「智慧海關」建設的卓越成果，更印證在提升通關便利及促進商貿發展等方面所作的不懈努力。香港海關將繼續深化與各地海關及創科機構的交流與合作，以科技賦能海關工作，為構建更安全、更高效的國際貿易環境貢獻力量。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c93346898b2","title":"騙徒假冒機構職員 扮退款呃個人資料氹轉賬 警教4招自保","url":"https://www.stheadline.com/breaking-news/3639419/騙徒假冒機構職員-扮退款呃個人資料氹轉賬-警教4招自保","summary":"購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員，能準確說出購物者的姓名、購買紀錄及送貨地址，再以「退錢畀你」作誘餌，誘騙點擊連結、輸入個人資料，甚至轉賬。","summary_short":"購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員，能準確說出購物者的姓名、購買紀錄及送貨地址…","digest":"購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員…","points":["購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員…","警方指資料可能源自部分機構的資料外洩事件，呼籲市民應留意官方公告，接到來電話應致電客服查證…","警方指每個帳戶應使用獨立而高強度的密碼，一旦懷疑資料外洩，應即刻更改…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:07:37+08:00","size":1,"keywords":[],"body":"購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員，能準確說出購物者的姓名、購買紀錄及送貨地址，再以「退錢畀你」作誘餌，誘騙點擊連結、輸入個人資料，甚至轉賬。警方指資料可能源自部分機構的資料外洩事件，呼籲市民應留意官方公告，接到來電話應致電客服查證，不要點擊可疑連結，更不要未核實對方身份便給予個人資料。\n此外，警方指每個帳戶應使用獨立而高強度的密碼，一旦懷疑資料外洩，應即刻更改，其他曾用過同一密碼的帳戶亦要一併更改。凡支援雙重認證的帳戶應全部開啟，銀行密碼、信用卡驗證碼及一次性驗證碼，絕對不可透露予來電者，亦不要在可疑網站輸入。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd487e653e2","title":"特區政府強烈譴責美中經濟與安全審議委員會報告 嚴厲駁斥國安法與經濟發展失實指控","url":"https://www.stheadline.com/politics/3639430/特區政府強烈譴責美中經濟與安全審議委員會報告-嚴厲駁斥國安法與經濟發展失實指控","summary":"特區政府今日（20日）發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」，直斥其偏頗和失實抹黑。","summary_short":"特區政府今日（20日）發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」，直斥其偏頗和失實抹黑。","digest":"特區政府發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」…","points":["特區政府今日（20日）發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」…","發言人強調，特區政府堅定實施國安法律，保障市民權利，並嚴正駁斥報告對本港司法獨立…","特區政府強調，香港特區是中華人民共和國不可分離的部分，在「一國兩制」下享有高度自治權"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T21:56:43+08:00","size":1,"keywords":[],"body":"特區政府今日（20日）發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」，直斥其偏頗和失實抹黑。發言人強調，特區政府堅定實施國安法律，保障市民權利，並嚴正駁斥報告對本港司法獨立、涉華案件判決，以及因「五年規劃」而偏離資本主義市場經濟的無理指控。\n堅決維護國家安全 駁斥美方雙重標準與抹黑\n特區政府強調，香港特區是中華人民共和國不可分離的部分，在「一國兩制」下享有高度自治權。政府將堅定不移實施《香港國安法》及《維護國家安全條例》，依法防範和懲治危害國家安全的行為，同時保障市民的權利和自由。\n針對報告對本港國安法律的指控，特區政府指出國安法律精準針對危害國家安全的行為，完全不影響本地機構、組織及人員與海外的正常交流。同時，本港的傳媒環境在《基本法》保障下蓬勃依然，新聞工作者只要按「負責任新聞作業」原則真誠行事，其行使自由的權利全然不受限制。\n相反，美國自身的傳媒環境卻日趨嚴峻，自2026年至今已拘捕40多名記者，對記者施暴個案更近170宗。美國擁有龐大國安法體系，更頻繁以國安為名打壓別國，美方刻意捏造香港狀況，顯然是雙重標準與卑劣政治操弄。目前經修訂的《實施細則》及新訂立的《維護國家安全（程序事宜）規例》均設有司法把關機制，充分保障了個人和組織的合法權利。\n特區政府維護獨立的司法權，全力支持司法機構依法獨立行使審判權。\n捍衛司法獨立與公正 斥外部勢力干預司法程序\n特區政府維護獨立的司法權，全力支持司法機構依法獨立行使審判權。律政司的刑事檢控工作完全不受干涉，所有檢控決定均是基於證據和法律作出客觀分析，控方更有責任在毫無合理疑點下證明被告人犯罪，以維護司法公正。\n發言人亦就報告提及的多宗案件作出嚴正駁斥。在「黎智英案」中，法庭嚴格按照證據和法律判案並依法重判，彰顯法治與公義，黎智英本人亦已選擇不提出上訴，外部勢力的抹黑在公正審判下不攻自破。至於「支聯會案」，法庭判詞已明確指出其綱領旨在顛覆國家政權、破壞憲法下的根本制度，被告並非因政治觀點受審。\n另外，黃之鋒承認串謀勾結外國勢力危害國家安全罪，且屢次干犯非法集結及藐視法庭等罪，依法懲治屬咎由自取。針對通緝犯的打壓潛逃措施完全符合國際慣例，其中「郭鳳儀案」防範他人移轉潛逃者資產的法律，旨在督促其回港，並不存在任何連坐懲罰。而英方在「駐倫敦經貿辦僱員案」中以莫須有罪名進行政治操弄，相關指控與特區政府及經貿辦絕無關連。\n實施包括國家安全教育在內的國民教育是教育當局的正當責任。\n維持資本主義市場經濟 融入國家發展大局\n特區政府澄清，任何指稱香港因「五年規劃」出台而偏離資本主義市場經濟的說法絕對子虛烏有。香港將繼續奉行自由貿易、資金及資訊自由流動的市場經濟政策，並將「有效市場」與「有為政府」雙管齊下作為基本原則，這與世界主要經濟體進行中長期規劃的普遍做法一致。\n本港金融體系誠信穩健，打擊洗錢及恐怖分子資金籌集的法律架構健全，並將於下月提交條例草案以進一步擴大虛擬資產服務規管。同時，本港全面且嚴格執行聯合國安理會施加的制裁，拒絕可疑船隻入港，但不會執行個別國家的單邊制裁。\n政治與社會制度方面，完善選舉制度後產生的立法會全面落實「愛國者治港」，已擺脫以往撕裂亂象，重回理性務實正軌。在教育方面，實施包括國家安全教育在內的國民教育是教育當局的正當責任，而本地學者和院校在保障學術自由的前提下，與境外的正常學術交流活動依然蓬勃。特區政府重申，香港將發揮「超級聯繫人」和「超級增值人」的角色，鞏固各項國際中心地位，而美國在港擁有龐大商業利益，香港的繁榮穩定對港美雙方均有利。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c945327cb6f","title":"APEC青年企业家峰会在港举行 APEC秘书处执行主任点赞香港创业活力","url":"https://www.chinanews.com/ga/shipin/cns-d/2026/11-20/news1075613.shtml","summary":"11月20日，2026 APEC Next-Gen青年企业家峰会在香港故宫文化博物馆举行。","summary_short":"11月20日，2026 APEC Next-Gen青年企业家峰会在香港故宫文化博物馆举行。","digest":"APEC青年企业家峰会在港举行 APEC秘书处执行主任点赞香港创业活力","points":["11月20日，2026 APEC Next-Gen青年企业家峰会在香港故宫文化博物馆举行","会上，亚太青年创业家协会(APYEA)与香港菁英会正式签署合作备忘录…"],"section":"港聞","category":"港聞","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:20:06+08:00","size":1,"keywords":[],"body":"11月20日，2026 APEC Next-Gen青年企业家峰会在香港故宫文化博物馆举行。APEC秘书处执行主任爱德华多·佩德罗萨在峰会上点赞香港创业活力，寄语青年企业家充分发挥潜力。\n\n会上，亚太青年创业家协会(APYEA)与香港菁英会正式签署合作备忘录，双方将建立常态化的区域青年企业家网络，并将APYEA香港办事处落户香港菁英会。\n\n(记者 陈子彦)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/401436C1E6904434A80D88519D4A385A.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c0f3527d833","title":"房屋局：最新公屋綜合輪候時間4.4年 創十年新低","url":"https://news.tvb.com/tc/1207429-房屋局最新公屋綜合輪候時間44年創十年新低","summary":"房屋局指，最新公屋綜合輪候時間4.4年，創十年新低。【政府新聞公報】房屋局今日（十一月二十日）公布，最新公屋綜合輪候時間為4.4年，較今年六月時錄得的4.8年，大幅下降0.4年，而與本屆政府上任前的高位6.1年比較，縮短了1.7年，第一次低於4.5年，亦是過去十年以來的新低。","summary_short":"房屋局指，最新公屋綜合輪候時間4.4年，創十年新低。","digest":"【政府新聞公報】房屋局公布，最新公屋綜合輪候時間為4.4年…","points":["房屋局今日（十一月二十日）公布，最新公屋綜合輪候時間為4.4年，較今年六月時錄得的4.8年…","最新公屋綜合輪候時間，是根據截至二○二六年九月底…","房屋局發言人說：「隨着總體公營房屋建屋量持續增加，各個傳統公屋及『簡約公屋』項目陸續落成…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:14:00+08:00","size":2,"keywords":["公屋","房屋局","公屋輪候時間"],"body":"房屋局指，最新公屋綜合輪候時間4.4年，創十年新低。\n\n【政府新聞公報】\n\n房屋局今日（十一月二十日）公布，最新公屋綜合輪候時間為4.4年，較今年六月時錄得的4.8年，大幅下降0.4年，而與本屆政府上任前的高位6.1年比較，縮短了1.7年，第一次低於4.5年，亦是過去十年以來的新低。\n\n最新公屋綜合輪候時間，是根據截至二○二六年九月底，在過去12個月獲安排入住傳統公共租住房屋（公屋）或「簡約公屋」的一般申請者（即家庭申請者及長者一人申請者）輪候時間平均數計算所得。\n\n房屋局發言人說：「隨着總體公營房屋建屋量持續增加，各個傳統公屋及『簡約公屋』項目陸續落成，長期積壓的輪候個案逐漸被消化，公屋綜合輪候時間呈下降的趨勢。我們有信心達到行政長官在二○二二年《施政報告》提出，在二○二六／二七年度公屋綜合輪候時間下降至4.5年的目標。」\n\n總體公營房屋建屋量進入收成期\n\n本屆政府四年多以來全力「提量、提速、提效、提質」，公營房屋落成量已打好穩固基礎，進入收成期。未來五年（即二○二七／二八至二○三一／三二年度）每年平均提供超過35 000個公營房屋單位，包括公屋及資助出售房屋，較本屆政府上任時相應的五年落成量增加約73%，亦是過去二十五年來的新高。「簡約公屋」方面，截至二○二六年十一月中，約29 800個單位已經落成，餘下觀塘順利邨道及黃大仙竹園道由校舍改建的新項目（合共提供約210個單位）亦將於明年第一季落成啓用，即全數13個項目約30 000個「簡約公屋」單位，較二○二二年《施政報告》時提出五年內完成興建的目標，加快提前至四年多便完成。供應量龐大，有效縮短公屋輪候時間。\n\n多達11 200個一般申請者上樓\n\n在二○二六年第三季，多達約11 200宗一般申請獲安排入住傳統公屋或「簡約公屋」，包括約3 100個新落成的傳統公屋單位、約2 700個回收的傳統公屋單位，以及約5 450個「簡約公屋」單位。其中，獲編配入住「簡約公屋」的數目為上一季（約1 300個）的四倍多。\n\n發言人說：「在過去12個月，傳統公屋加上『簡約公屋』供應量已大大提升至平均每季有約8 200個單位，為本屆政府上任前的四年（即二○一八年第三季至二○二二年第二季）平均每季約4 100個單位供應的兩倍。『簡約公屋』更在今年七月至九月進入入伙高峰期。事實上，過去12個月內入住傳統公屋的一般申請者，平均輪候時間為5.3年，而同期獲編配入住『簡約公屋』的一般申請者，輪候時間平均僅為2.8年，充分突顯『簡約公屋』政策，在加快滿足基層市民住屋需要方面發揮了關鍵作用，有效帶動整體的公屋綜合輪候時間下降。」\n\n輪候公屋隊伍為過去15年新低\n\n發言人說：「我們亦正努力採取多管齊下的方法，加快公屋單位流轉，輪候公屋的一般申請者數目正呈下降的趨勢，今次錄得進一步減少約4 400個。我們同時亦觀察到許多輪候時間六年或以上的市區及擴展市區一般申請者，正陸續獲編配公屋單位，切實反映我們過去四年多的努力正逐步取得成效。」\n\n截至二○二六年九月底，約有96 100宗公屋的一般申請，與二○二○年九月最高位的156 400宗比較，大幅下降近40%，是過去15年以來的新低，亦是自二○一二年以來首次跌破10萬宗；至於配額及計分制下的非長者一人申請約有80 600宗，與二○一五年十二月最高位的約143 700宗比較，更大幅下降超過40%。當中，30歲以下的非長者一人申請的跌幅更為明顯，在過去十年間由二○一六年九月底約70 400宗，下跌約60%至二○二六年九月底約29 300宗。相關數字清楚顯示公屋輪候隊伍正在消化中。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026UrucK43bLj1795159014.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/1621c47c7fbe409580e79df9a67cadb9/1d83e516e7bd4698a89791f6c289b4d0-40529457e68e9ba9cf13e2556811006b-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026UrucK43bLj1795159014.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant","items":[{"title":"房屋局：最新公屋綜合輪候時間4.4年 創十年新低","url":"https://news.tvb.com/tc/1207429-房屋局最新公屋綜合輪候時間44年創十年新低","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:14:00+08:00","category":"港聞","digest":"【政府新聞公報】房屋局公布，最新公屋綜合輪候時間為4.4年…"},{"title":"最新公屋綜合輪候時間4.4年 創十年新低","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000296.htm","source_display":"香港政府新闻公报","published_at":"2026-11-20T15:00:00+08:00","category":"","digest":"房屋局公布，最新公屋綜合輪候時間為4.4年，較今年六月時錄得的4.8年…"}],"cross":{"total":2,"angles":[{"point":"【政府新聞公報】房屋局公布，最新公屋綜合輪候時間為4.4年…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207429-房屋局最新公屋綜合輪候時間44年創十年新低"},{"point":"房屋局公布，最新公屋綜合輪候時間為4.4年，較今年六月時錄得的4.8年…","sources":["香港政府新闻公报"],"url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000296.htm"}]}},{"id":"cf7e27e52ac","title":"海關破酒店製毒工場及分銷中心檢160萬元大麻毒品 3男女被捕","url":"https://www.stheadline.com/breaking-news/3639417/海關破酒店製毒工場及分銷中心檢160萬元大麻毒品-3男女被捕","summary":"香港海關昨日（19日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約3.7公斤懷疑大麻花、約3.6公斤懷疑大麻油、約24公斤懷疑大麻糖…","summary_short":"香港海關昨日（19日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約3.7公斤懷疑大麻花…","digest":"香港海關在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場…","points":["香港海關昨日（19日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場…","海關人員透過情報分析及深入調查，並鎖定兩名男子採取執法行動","海關人員於昨日押解一名23歲目標男子及一名28歲同行女子到屯門一個住宅單位進行搜查…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:46:54+08:00","size":1,"keywords":[],"body":"香港海關昨日（19日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約3.7公斤懷疑大麻花、約3.6公斤懷疑大麻油、約24公斤懷疑大麻糖、1148支懷疑大麻油煙彈及一批懷疑毒品包裝及製毒工具，估計市值共約160萬元，並拘捕3人。\n海關人員透過情報分析及深入調查，並鎖定兩名男子採取執法行動。海關人員於昨日押解一名23歲目標男子及一名28歲同行女子到屯門一個住宅單位進行搜查，在單位內檢獲約3.7公斤懷疑大麻花、332支懷疑大麻油煙彈、約180克懷疑大麻糖及一批懷疑毒品包裝工具。\n海關人員其後押解另外一名33歲目標男子到荃灣一個酒店單位進行搜查，在單位內檢獲約3.6公斤懷疑大麻油、816支懷疑大麻油煙彈、約24公斤懷疑大麻糖及一批懷疑毒品包裝及製毒工具。\n23歲被捕男子及28歲被捕女子已被控兩項販運危險藥物罪，而33歲被捕男子已被控兩項販運危險藥物罪和一項製造危險藥物罪，案件明日（21日）在沙田裁判法院提堂。\n被捕23歲男子報稱無業，而33歲被捕男子則報稱地盤工人，他們承認收取每個月2萬港元作販毒報酬；至於28歲被捕女子則為一名清潔工。\n海關表示，販毒集團選擇交通較不便、人流稀少的酒店房間製毒，然後將製成品轉運至市區住宅單位，以進行包裝、儲存及分銷，試圖分散風險及逃避執法人員偵查。另外，集團在製毒過程中會混入不同香味及香油，以減低年輕人的戒心，從而令他們染上毒癮。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c202a787854","title":"蔡天鳳案・今日重點｜鄺港智稱折返驚見蔡天鳳無氣息 以為父會報警看新聞始知分屍","url":"https://www.stheadline.com/society/3639396/蔡天鳳案今日重點鄺港智稱折返驚見蔡天鳳無氣息-以為父會報警看新聞始知分屍","summary":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。","summary_short":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智…","digest":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智…","points":["28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智…","案件踏入第42日審訊，鄺港智第2日出庭作供","他指案發日蔡天鳳不滿鄺球聲言要見孫兒否則不合作，大怒於七人車上狂罵鄺球後要當面談判"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:40:54+08:00","size":1,"keywords":[],"body":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。案件踏入第42日審訊，鄺港智第2日出庭作供。他指案發日蔡天鳳不滿鄺球聲言要見孫兒否則不合作，大怒於七人車上狂罵鄺球後要當面談判。鄺港智指他再見蔡天鳳時，對方已頭破血流倒地，且無呼吸心跳。他後來離開時以為鄺球會報警或召救護車，但看報導才知蔡被肢解。\n鄺港智指蔡天鳳罵鄺球「臨老入花叢」\n鄺港智憶述案發當日登上AA七人車與蔡天鳳同行接女兒放學，期間閒談替蔡母還賭債利息及睇樓等事。及後他向蔡天鳳透露，鄺球要求見孫兒否則不再配合其他事，隨即惹怒蔡天鳳。蔡天鳳在車上狂鬧鄺球，斥責他60多歲仍「臨老入花叢」「溝骨妹」，揶揄他被騙光錢財，說着說着，更決定不讓他再見孫兒「教壞」兩人，並當場拍板要找鄺球談判，鄺港智說抵達大尾督停車場時蔡天鳳仍在生。\n相關新聞：\n蔡天鳳碎屍案丨鄺港智稱從未接觸沾有其DNA的錘子 不知是否與蔡天鳳死亡有關\n蔡天鳳碎屍案丨鄺港智指蔡天鳳斥鄺球死老嘢臨老入花叢 拒讓見孫兒免教壞 案發日談判\n折返驚見蔡天鳳頭破血流倒地\n鄺港智供稱，抵埗後鄺球上車與蔡天鳳傾談，他與兄長鄺港傑下車吸煙，折返打開車門卻見蔡天鳳已倒臥地上，鄺球則稱「唔好講住」並指示先返龍尾村單位。途中他見蔡天鳳頭部流血，觸摸心跳及探測呼吸均無反應。到埗後他問鄺球是否報警或召救護車，鄺球以他正被通緝為由指示先搬入屋。他在外把風及協助清空七人車，期間發現衣物在檢查蔡天鳳時沾血遂更衣。鄺港智指，因正被通緝及鄺球表示會處理，於是他急忙離開；其後知道蔡母張燕花已報警，因不滿對方明知他被通緝仍未事先通知便驚動警方而爆粗，他隨即致電鄺球並收拾物品離開。\n相關新聞：\n蔡天鳳碎屍案丨鄺港智：蔡天鳳與鄺球車上傾談後 頭破流血倒地\n蔡天鳳碎屍案丨鄺港智否認曾襲擊或計劃參與襲擊蔡天鳳\n以為鄺球會報警結果是分屍\n鄺港智指當日於停車場見到蔡天鳳倒臥在地時「好驚好緊張」，更沒預計蔡天鳳會遭襲擊。其後「老豆叫我哋走先，話佢會處理」，於是他匆忙離開龍尾村，返抵加多利山後才入房哭泣，大概哭泣數十分鐘後，他走出房外「好似無事咁樣」，實是強抑情緒。他稱，他本以為鄺球會「報警或者call白車」，未料後來看報導，得知蔡天鳳被肢解時大驚，他形容當時「心驚驚」，遂安排取回存放在貴族鐘錶的款項並離開。\n指當年偷金蔡天鳳有份「睇水」\n鄺港智接受鄺港傑的代表大狀盤問時提到，14歲認識蔡天鳳後便發生性關係，當時蔡母並不反對「佢好鍾意㖭」，翌年並遷入對方住所。被問到他於婚前開始干犯盜竊案，蔡天鳳對此可知情，鄺港智直言「一齊做㗎嘛，佢幫我睇水⋯⋯（涉案金器）我交畀佢」。\n相關新聞：\n蔡天鳳碎屍案｜鄺港智婚前起干犯偷金案 蔡天鳳有份　「一齊做㗎嘛，佢幫我睇水」\n急付30萬「坐大飛」潛逃「受騙」\n鄺港智供稱因本身正被通緝，加上知悉出事及張燕花稱警方正尋找他，遂提取名錶及金錢，打算在2月22或23日安排乘搭「大飛」離港。他指以往一程船費僅10萬元，惟當時表明急需離開、「錢唔緊要」任由對方開價，結果費用被加至30萬元，他答應後翌日在接頭人陪同下抵達東涌碼頭，隨即被捕驚覺受騙。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9c59df6511","title":"馬鞍山富寶花園喉管爆裂 食水及鹹水供應一度暫停 逾4200戶受影響","url":"https://www.stheadline.com/breaking-news/3639372/馬鞍山富寶花園喉管爆裂-食水及鹹水供應一度暫停-逾4200戶受影響","summary":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。","summary_short":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。","digest":"馬鞍山富寶花園凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響","points":["管理處其後發通告通知住戶，指食水供水喉管爆裂處位於地底位置，維修程序較為複雜…","水務署其後派員到場協助，並派遣水車及水箱到各座樓宇地下，為住戶提供臨時供水","至晚上8時半，現場有消息指水管已完成修復，部份座數已經恢復供水"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:37:22+08:00","size":1,"keywords":[],"body":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。管理處其後發通告通知住戶，指食水供水喉管爆裂處位於地底位置，維修程序較為複雜，現階段暫未能清晰了解恢復供水時間。水務署其後派員到場協助，並派遣水車及水箱到各座樓宇地下，為住戶提供臨時供水。至晚上8時半，現場有消息指水管已完成修復，部份座數已經恢復供水。\n富寶花園管理處已安排搶修\n管理處在通告中提到，今日凌晨4時許屋苑的食水及鹹水總供水系統（入邨總供水系統）有喉管突發性爆裂，導致供水中斷。事故發生後，管理處已安排承辦商進行緊急搶修工程，惟食水供水喉管爆裂處處於地底位置，維修程序較為複雜，現階段暫未能清晰了解恢復供水時間，並呼籲市民自備容器到各座樓下的水車及水箱取水。\n水務署︰派出「供水特攻隊」 協助居民取水\n水務署表示，今早得悉馬鞍山富寶花園因內部私人供水管爆裂，導致屋苑住戶食水及沖廁水供應受到影響。署方經與沙田民政事務處、區議員及屋苑管理處協調後，已為屋苑安排臨時食水供應，包括提供4架水車及放置24個水箱，亦派出「供水特攻隊」 於取水點協助居民取水，並主動為有需要的居民送上水袋及樽裝水。\n水務署續稱，有關大廈管理處承建商正為大廈內部供水系統安排緊急維修工程，署方會提供適切技術支援，以協助大廈管理處盡快完成有關的私人水管維修工程。\n立法會議員葉傲冬在社交平台發文，指現時工程人員正全力搶修，爭取於今晚先行修復食水喉並盡快恢復供水，務求將對街坊日常生活的影響減至最低。\n翻查資料，富寶花園於1993年入伙，共有12座、大約4200個單位。\n相關新聞︰富寶花園居民捱寒冒雨取水現百米人龍 女子水箱旁洗菜被罵","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cccc2aca2e1","title":"據悉馬鞍山富寶花園完成修復水管 供水陸續恢復","url":"https://news.tvb.com/tc/1207511-據悉馬鞍山富寶花園完成修復水管供水陸續恢復","summary":"馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響。傍晚約六時晚飯時間，不少居民帶同水桶、水袋等，到樓下水車取水，取水點出現人龍，有水務署「供水特攻隊」，及關愛隊成員協助居民。","summary_short":"馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響。","digest":"馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響","points":["馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響","傍晚約六時晚飯時間，不少居民帶同水桶、水袋等，到樓下水車取水，取水點出現人龍…","到晚上近8時，現場消息指，已完成修復水管，供水陸續恢復"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T20:31:00+08:00","size":1,"keywords":["水務署","爆水管","富寶花園"],"body":"馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響。\n\n傍晚約六時晚飯時間，不少居民帶同水桶、水袋等，到樓下水車取水，取水點出現人龍，有水務署「供水特攻隊」，及關愛隊成員協助居民。\n\n水務署指早上得悉，富寶花園有內部私人供水管爆裂，與沙田民政處、區議員等協調後，已安排臨時食水供應，除了4架水車，亦放置了24個水箱。\n\n大廈管理處承建商，安排緊急維修。到晚上近8時，現場消息指，已完成修復水管，供水陸續恢復。\n\n富寶花園在1993年入伙，屬私人參建居屋，共有12座、超過4,000個單位。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026KMw0kufiRa1795178204.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/051a3757bf3c43e1a546f4b5e9192128/4ea3a59a6d384b0cad4f57613d607de7-0534e50d1ad8e04a5a896581468f9589-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026KMw0kufiRa1795178204.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"cac15615497","title":"北角社區客廳開幕 料惠及270劏房戶 陳國基：冀成家長日常喘息空間","url":"https://www.stheadline.com/society/3639406/北角社區客廳開幕-料惠及270劏房戶-陳國基冀成家長日常喘息空間","summary":"北角社區客廳今日（20日）舉行開幕典禮，政務司司長陳國基表示，北角社區客廳是今年第10間投入服務的社區客廳，體現「政、商、民」三方通力合作，為劏房戶開拓生活空間及提供支援。","summary_short":"北角社區客廳今日（20日）舉行開幕典禮，政務司司長陳國基表示，北角社區客廳是今年第10間投入服務的社區客廳，體現「政…","digest":"北角社區客廳舉行開幕典禮，政務司司長陳國基表示…","points":["北角社區客廳今日（20日）舉行開幕典禮，政務司司長陳國基表示…","他指出，這間社區客廳的一大特色是小朋友較多，不少家長特別是母親都會每日到訪…","陳國基致辭時表示，東區是港島最多劏房的地區，繼去年3月筲箕灣社區客廳投入服務後…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:20:24+08:00","size":1,"keywords":[],"body":"北角社區客廳今日（20日）舉行開幕典禮，政務司司長陳國基表示，北角社區客廳是今年第10間投入服務的社區客廳，體現「政、商、民」三方通力合作，為劏房戶開拓生活空間及提供支援。他指出，這間社區客廳的一大特色是小朋友較多，不少家長特別是母親都會每日到訪，場地為她們提供能喘息、交流及學習新技能的地方，也能促進街坊互動與社區凝聚。 \n佔地約2,400平方呎\n陳國基致辭時表示，東區是港島最多劏房的地區，繼去年3月筲箕灣社區客廳投入服務後，北角社區客廳開幕可進一步為區內有需要居民提供溫暖服務。他介紹，北角社區客廳實用面積約2,400平方呎，預計可服務270個劏房戶，全年服務人次約43,000人。會員可在場內煮食、用膳、獲取社區生活資訊及參與活動，認識不同年齡與背景的朋友，建立互助網絡。 \n他提到，營運機構團隊會主動走入社區接觸劏房戶，介紹及邀請他們使用設施；專業社工亦會識別高風險家庭，提供輔導、個案支援及轉介，及早介入有需要人士，避免潛在意外或生活困境。客廳亦提供維修工具、書本及運動器材等日常用品供居民共享。 \n讚現場充滿人情味\n他表示早前參觀了客廳設施，形容現場溫暖和諧、充滿人情味，見到兒童遊戲區有小朋友以社區環境為靈感製作小遊戲，客廳有家長縫製手作，備餐間亦有街坊與小朋友一同準備小食，氣氛熱鬧。他又留意到牆畫描繪北角特色店舖，反映居民對社區的歸屬感與熱愛。 \n太古提供場地聖雅各福群會營運\n陳國基致辭時提到，北角社區客廳的順利落成有賴政商民三方合作，特別感謝太古地產有限公司及太古集團慈善信託基金提供場地，他同時感謝營運機構聖雅各福群會全年無休服務社區，他續指，太古與聖雅各福群會早於2022年已在鰂魚涌合作打造社區休憩空間，今次北角項目是三方優勢互補、結合企業資源、社福專業與社區參與的延伸。 \n陳國基續稱，政府會繼續擔當「推動者」與「促成者」角色，透過政策引導及跨界別合作，鼓勵社區客廳善用空間與居民網絡，並連繫地區商戶及企業引入資源，讓居民由「受助者」成為「貢獻者」，令社區客廳紮根社區、持續發展及不斷優化服務。\n記者、攝影：蘇芷慧","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdb3843c685","title":"來論︱選委會選舉肩負重任 攜手推進香港良政善治","url":"https://www.stheadline.com/politics/3639405/來論選委會選舉肩負重任-攜手推進香港良政善治","summary":"本星期日（22日）即將舉行香港選舉委員會界別分組選舉，是落實「愛國者治港」原則、推動香港由治及興的重要一環，備受社會各界關注。","summary_short":"本星期日（22日）即將舉行香港選舉委員會界別分組選舉，是落實「愛國者治港」原則、推動香港由治及興的重要一環…","digest":"本星期日即將舉行香港選舉委員會界別分組選舉，是落實「愛國者治港」原則…","points":["本星期日（22日）即將舉行香港選舉委員會界別分組選舉，是落實「愛國者治港」原則…","選委會作為香港選舉制度的重要基石，具備廣泛界別代表性，肩負提名…","今次選舉匯聚社會不同界別的賢能人士參與競逐，候選人聚焦經濟發展、民生建設、大灣區對接…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:07:29+08:00","size":1,"keywords":[],"body":"本星期日（22日）即將舉行香港選舉委員會界別分組選舉，是落實「愛國者治港」原則、推動香港由治及興的重要一環，備受社會各界關注。\n選委會作為香港選舉制度的重要基石，具備廣泛界別代表性，肩負提名、選出行政長官與部分立法會議員的憲制職能，關乎香港管治團隊的組建，對未來五年香港的發展方向舉足輕重。今次選舉匯聚社會不同界別的賢能人士參與競逐，候選人聚焦經濟發展、民生建設、大灣區對接、北都發展等議題，展現理性務實的選舉氛圍。\n透過是次選舉，將挑選能夠代表整體社會利益、有視野有擔當的選委，為香港破解深層次民生經濟難題、鞏固國際金融貿易中心地位、更好融入國家發展大局，筑牢堅實的管治基礎，持續推動「一國兩制」行穩致遠，惠及廣大市民福祉。\n合資格選民請於投票日踴躍行使權利，投下寶貴一票，一同為香港長遠繁榮穩定作出貢獻。\n莊家蕙 四川社團總會常務副會長\n四川社團總會常務副會長莊家蕙。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1e097e496c","title":"香港金牛｜背靠背出戰現疲態 俱樂部盃不敵廣州 美臣鍾斯低迷麥卡地標戰斬13分","url":"https://www.stheadline.com/basketball-zone/3639401/香港金牛背靠背出戰現疲態-俱樂部盃不敵廣州-美臣鍾斯低迷麥卡地標戰斬13分","summary":"香港金牛今日（20日）在海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組下半區第二場小組賽。","summary_short":"香港金牛今日（20日）在海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組下半區第二場小組賽。","digest":"香港金牛在海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組下半區第二場小組賽","points":["香港金牛今日（20日）在海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組下半區第二場小組賽","面對背靠背的密集賽程，金牛眾將明顯力不從心，加上兩名外援所羅門（Richard Solomo…","金牛今仗變陣，安排港將楊和加盟後首度正選上陣，惟球隊開局慢熱，受制於體能劣勢早早落入下風"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T19:44:51+08:00","size":1,"keywords":[],"body":"香港金牛今日（20日）在海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組下半區第二場小組賽。面對背靠背的密集賽程，金牛眾將明顯力不從心，加上兩名外援所羅門（Richard Solomon III）陷入犯規麻煩及美臣鍾斯（Mason Jones）手感冰冷，最終以77:90不敵廣州智都集團。\n金牛今仗變陣，安排港將楊和加盟後首度正選上陣，惟球隊開局慢熱，受制於體能劣勢早早落入下風。上仗贏波功臣美臣鍾斯今場表現低迷，全場11投僅2中，只靠罰球勉強交出11分；另一內線支柱所羅門更嚴重受犯規困擾，上陣僅約12分鐘便吞下5記犯規，得分交白卷。相反，廣州外援布朗在禁區予取予攜，狂轟23分及20個籃板的「雙20」恐怖數據，帶領廣州在第二節打出一波13:2攻勢，令金牛一度落後多達17分。\n今仗另一焦點落在首度披上金牛戰衣的前NBA長人麥卡（Thon Maker）身上。他後備入替甫上陣即搶下進攻籃板並以入樽完成首秀得分，全場交出13分及7個籃板。雖然麥卡久疏戰陣下略顯生疏，但仍為球隊注入活力。\n換邊後金牛力圖反撲，第四節麥卡在籃下建功，加上唐才育命中三分球，一度將比分追近至56:63的個位數分差，令比賽重燃懸念。惜球隊未能一鼓作氣堅持到最後，最終以13分之差飲恨。完成兩場小組賽後，金牛與同組的長白山恩都里及廣州智都集團戰績同為1勝1負。在計算得失分差後，金牛因首仗贏5分、今仗輸13分（得失分為-8），在三隊中暫列小組第三。明日將迎戰廣東東陽光、浙江稠州金租或山東高速其中一隊，力爭出線資格。\n主教練解立彬賽後總結時直言，球隊未能打出整體性：「今場無論在進攻還是防守端，都未能打出應有的整體性，尤其讓對手獲得太多罰球機會。球員仍在適應這種高強度對抗，需要在比賽中進一步統一思想和建立默契。」他強調今次盃賽是很好的鍛鍊機會，期望球隊盡快完成磨合，迎接即將來臨的新球季。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cab67fc5c38","title":"澳門大賽車｜寒冷天氣無阻民眾觀看 周邊紀念品銷情暢旺","url":"https://news.tvb.com/tc/1207503-澳門大賽車寒冷天氣無阻民眾觀看周邊紀念品銷情暢旺","summary":"澳門格蘭披治大賽車第二日賽事，天氣急降溫，日間最低溫降至大約11度，不少旅客在寒風下入場，無阻周邊紀念品銷情暢旺。澳門雨勢不斷，賽道濕滑，賽車駛過時濺起大量水花。","summary_short":"澳門格蘭披治大賽車第二日賽事，天氣急降溫，日間最低溫降至大約11度，不少旅客在寒風下入場，無阻周邊紀念品銷情暢旺。","digest":"澳門格蘭披治大賽車第二日賽事，天氣急降溫，日間最低溫降至大約11度…","points":["澳門格蘭披治大賽車第二日賽事，天氣急降溫，日間最低溫降至大約11度，不少旅客在寒風下入場…","澳門雨勢不斷，賽道濕滑，賽車駛過時濺起大量水花","受天雨影響，早上格蘭披治電單車排位賽要取消"],"section":"港聞","category":"澳門","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T18:58:00+08:00","size":1,"keywords":["賽車","澳門大賽車"],"body":"澳門格蘭披治大賽車第二日賽事，天氣急降溫，日間最低溫降至大約11度，不少旅客在寒風下入場，無阻周邊紀念品銷情暢旺。\n\n澳門雨勢不斷，賽道濕滑，賽車駛過時濺起大量水花。受天雨影響，早上格蘭披治電單車排位賽要取消。旅客就無懼寒風冷雨，羽絨、雨衣通通上陣。而對攝影發燒友來講，最重要是保護好鏡頭。寒冷天氣下，場內的熟食檔大受歡迎。\n\n香港旅客洪先生說：「突然12度，很凍，不過我們著了很多衫，沒有問題的。」\n\n被問去看台穿了多少件衣服，洪先生指出：「4件。」\n\n有旅客稱，下雨令賽事更刺激。\n\n廣州旅客黃先生說：「下雨來說對車手更大挑戰，挑戰都挺大，賽道還會經常發生事故。」\n\n場外大賽車周邊紀念品同樣受到熱捧，各款不同品牌聯乘的模型車，大排長龍。\n\n有疑似「黃牛黨」用雙倍價錢向排隊的人兜售。有旅客稱看見過不少類似情況。\n\n山東旅客張先生說：「有挺多這樣的，有些是比較上了年紀的，她們可能也沒有事做，就來排一會兒，再加(價)賣出去。」\n\n有旅客稱用了8個鐘頭排隊，買周邊產品，認為秩序尚可接受。\n\n廣州旅客陳先生說：「我前面只有兩個人(我知道)，我以往去這些買車的展會，都是特別混亂，打架和吵架都有，但這裡都已特別好。她要插隊就插隊，5至6個人(插隊)可以接受。」\n\n今屆大賽車的重頭戲集中在周末票價則由400至1,200澳門元，網上顯示兩日的門票都已經售罄，當局早前稱會預留少量門票，供旅客即場購買。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20261w48wxuPxc1795179572.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/8a327bd431e64c96bc700ca6b17fa167/b40b41873f364165b7ac9e81e89a5656-4c282fc990ce41989d3fabefd3d04f04-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20261w48wxuPxc1795179572.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"cab6fe2ea80","title":"當局擬修例只要持有物業有僭建物已屬違法 法團歡迎放寬民生類僭建限制","url":"https://news.tvb.com/tc/1207485-當局擬修例只要持有物業有僭建物已屬違法法團歡迎放寬民生類僭建限制","summary":"政府針對建築物僭建問題，提出修例引入新罪行，只要持有的物業有僭建物已屬違法，可判監禁兩年，但同時放寬對風險較低僭建物的限制。紅山半島事件後，政府就建築物條例進行檢討。","summary_short":"政府針對建築物僭建問題，提出修例引入新罪行，只要持有的物業有僭建物已屬違法，可判監禁兩年…","digest":"政府針對建築物僭建問題，提出修例引入新罪行，只要持有的物業有僭建物已屬違法…","points":["政府針對建築物僭建問題，提出修例引入新罪行，只要持有的物業有僭建物已屬違法，可判監禁兩年…","紅山半島事件後，政府就建築物條例進行檢討","集中打擊性質嚴重，威脅公眾安全的4種「指明僭建物」"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T18:37+08:00","size":1,"keywords":[],"body":"政府針對建築物僭建問題，提出修例引入新罪行，只要持有的物業有僭建物已屬違法，可判監禁兩年，但同時放寬對風險較低僭建物的限制。\n\n紅山半島事件後，政府就建築物條例進行檢討。集中打擊性質嚴重，威脅公眾安全的4種「指明僭建物」。包括未經許可移除鋼筋，承重牆上開鑿，不少於750毫米的洞口，地庫、泳池等深度1.5米或以上的挖掘及面積超過35平方米，周邊超過一半被圍封，並有屋頂的違例構築物。\n\n新例生效後，業主須於一年內拆除僭建物，否則最高可判罰30萬元及監禁兩年。如再次定罪，就提高至罰款60萬。至於新業主可於獲得物業3個月內簽署承諾書，並於半年內拆除。\n\n未達最嚴重程度的僭建物，業主不遵辦清拆令，建議引入一萬元定額罰款。情況持續可提出檢控，首次定罪最多罰款20萬元及監禁一年，再犯罰款倍增至40萬元。搭建僭建物的罪行政府建議刪除「明知」字眼，以降低檢控門檻，最高罰則提高至200萬元、監禁兩年。\n\n現時部分晾衣架、簷篷等法例上屬違規僭建。政府認為，與市民日常生活相關而風險低，建議放寬限制。包括豁免部分工程種類不再視為僭建，例如伸出不多於750毫米，而離地超過3米的晾衣架。符合指定尺寸的簷篷，冷氣機支架、圍封露台等，就容許檢核後保留。\n\n有商住大廈的法團，歡迎放寬民生類的僭建。\n\n大廈業主立案法團主席林先生說：「有些舊式大廈、逾50年樓齡，露台若可圍封的話，就可減少室內漏水的情況，很多也沒有冷氣機槽、支架，也需要居民自行加裝，若可放寬冷氣機支架不視為僭建，對他們也是好事。」\n\n政府指截至9月，逾期未遵辦的清拆令涉及約64,800個僭建物，當中約7成是較輕微的僭建物，新措施有助集中資源打擊風險較大的僭建物。","image":"https://pro-vod-cdn.tvb.com/97d72bad2d5a41fdbaf8f2b57df9aaee/snapshots/5a823e345a3f4ecb894abc4e337cbcb1-00008.jpg","video":"https://pro-vod-cdn.tvb.com/97d72bad2d5a41fdbaf8f2b57df9aaee/092ce22c5e224834a14b782a87deeedc-ff8b69cb6cbddd87a2433bbb6a5f9125-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/97d72bad2d5a41fdbaf8f2b57df9aaee/snapshots/5a823e345a3f4ecb894abc4e337cbcb1-00008.jpg","lang":"zh-Hant"},{"id":"c0a0d7876d3","title":"財委會通過2億元北都城鄉共融基金 議員關注與現有基金重疊及資助範圍","url":"https://www.stheadline.com/politics/3639349/財委會通過2億元北都城鄉共融基金-議員關注與現有基金重疊及資助範圍","summary":"政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過。","summary_short":"政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過。","digest":"政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過","points":["政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過","民建聯陳克勤表示，新成立的北都城鄉共融基金，與鄉郊保育資助計劃…","他亦稱，若鄉民申請這個基金時需要顧問寫報告，開支昂貴，當局有何方法忙"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:32:19+08:00","size":1,"keywords":[],"body":"政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過。\n民建聯陳克勤表示，新成立的北都城鄉共融基金，與鄉郊保育資助計劃、歷史建築維修資助計劃有類似作用，關注當局如何確保新基金與另外兩個基金不會有重疊的情況，亦關注鄉民或只想保育一些物品而非一幢樓時，當局會否保育這些文物。他亦稱，若鄉民申請這個基金時需要顧問寫報告，開支昂貴，當局有何方法忙。\n基金無限制保護個別文物\n發展局常任秘書長（規劃及地政）何珮玲表示，鄉郊保育資助計劃涵蓋的北都村落已在新基金範圍內剔除，亦會與歷史建築維修資助計劃有協調，確保基金不會有重疊。至於鄉民寫建議書，她鼓勵鄉民可以與大專院校合作，當局亦有專責團隊，可提供技術意見予申請人。對於保育個別文物，何珮玲表示，基金暫沒有限制，反而申請人要思考保育一件文物時，如何可達致城鄉共融的目標。\n資助上限1000萬元 劉業強關注營運開支比例\n金融界陳振英表示，近日有慈善機構以288萬元拍得大東山一個石屋作保育，相信若這項目放在北都已可申請新成立的基金，料最高可獲1,000萬元，希望當局澄清是否這1,000萬元不能用作拍賣，只能於裝修、營運等方面的支出，而若申請人想做宣傳是否可申請第二類資助，第一、第二類能否同時申請。\n何珮玲表示，當局希望申請可利用1,000萬資助作復修私人設施，以及營運相關的設施，而要用一筆費用去購入一個地方，此筆費用則不包括在內。至於推廣費是否可納為第二類資助，她指不太希望申請人這樣做，始終基金2億元不算很多，希望可用有限資源幫到更多申請。\n鄉議局主席、經民聯劉業強表示，推動城鄉共融需要很多時間的耕耘和支持，希望政府可定期進行檢討，亦要考慮適當時候轉為恆常化或「加碼」，才能達到目標。他關注涉及改造私人土地，如村屋、祠堂等第一類的項目，資助上限是1,000萬元，當局有否規定營運開支不能超過某個百分比。\n何珮玲稱，當局暫時沒有考慮設立一個硬性的比例，但計劃希望申請人營運至少3年，故需向當局交代，申請的撥款足夠營運3年。\n記者：郭詠欣","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c440a19a97c","title":"深水埗運動場對開地盤現二戰英式迫擊砲彈 EOD檢走安全處理","url":"https://www.stheadline.com/breaking-news/3639316/深水埗運動場對開地盤現二戰英式迫擊砲彈-EOD檢走安全處理","summary":"今日（20日）下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈。","summary_short":"今日（20日）下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈。","digest":"下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈","points":["今日（20日）下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈","警方接報趕至，於上址發現一枚二戰時期英式迫擊砲彈，長約24厘米，直徑約5厘米","爆炸品處理課人員到場調查，發現該枚英式迫擊砲彈內沒有殘餘炸藥，其後將其銷毀，安全處理…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:22:23+08:00","size":1,"keywords":[],"body":"今日（20日）下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈。警方接報趕至，於上址發現一枚二戰時期英式迫擊砲彈，長約24厘米，直徑約5厘米。爆炸品處理課人員到場調查，發現該枚英式迫擊砲彈內沒有殘餘炸藥，其後將其銷毀，安全處理，事件中無人受傷。\n涉事的二戰時期英式迫擊砲彈，長約24厘米，直徑約5厘米。警方提供\n現場為深水埗運動場外地盤。\n爆炸品處理課到場調查。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd0dd211b3c","title":"警搜元朗寮屋及兩毒品儲存倉檢$1200萬冰毒 兩尼日利亞男被捕","url":"https://www.stheadline.com/breaking-news/3639339/警搜元朗寮屋及兩毒品儲存倉檢1200萬冰毒-兩尼日利亞男被捕","summary":"毒品調查科人員於今日（20日）清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒，總市值約1200萬元，並拘捕兩名分別為34歲及39歲、持行街紙的尼日利亞藉男子，涉嫌販運危險藥物。","summary_short":"毒品調查科人員於今日（20日）清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒，總市值約1200萬元…","digest":"毒品調查科人員於清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒…","points":["毒品調查科人員於今日（20日）清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒…","人員經深入調查及情報分析後，突擊搜查元朗八鄉下輋一個寮屋單位，制服屋內2名男子…","其後人員搜查兩個分別位於錦上路牛徑及天水圍錫降村的毒品儲存倉…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:14:18+08:00","size":1,"keywords":[],"body":"毒品調查科人員於今日（20日）清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒，總市值約1200萬元，並拘捕兩名分別為34歲及39歲、持行街紙的尼日利亞藉男子，涉嫌販運危險藥物。\n\n人員經深入調查及情報分析後，突擊搜查元朗八鄉下輋一個寮屋單位，制服屋內2名男子，並在單位內檢獲1包重約1公斤的懷疑冰毒及毒品包裝工具。其後人員搜查兩個分別位於錦上路牛徑及天水圍錫降村的毒品儲存倉，在倉內合共檢獲約26公斤懷疑冰毒。\n行動中，警方共檢獲約27公斤懷疑冰毒，總市值約1200萬元，而兩名男子則涉嫌販運危險藥物被捕。警方相信該兩個儲存倉由兩名被捕男子掌控，他們將被暫控三項「販運危險藥物」罪，案件將於明日（21日）上午在沙田裁判法院提堂。\n人員檢獲約27公斤懷疑冰毒，總市值約1200萬元。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c54c2f4e33f","title":"本港10月通脹升至2.2% 差餉寬減結束推高升幅 基本通脹維持溫和","url":"https://www.stheadline.com/society/3639333/本港10月通脹升至22-差餉寬減結束推高升幅-基本通脹維持溫和","summary":"政府統計處公布，2026年10月份整體消費物價按年上升2.2%，較9月份的1.9%升幅有所擴大，主因是差餉寬減於9月份結束。","summary_short":"政府統計處公布，2026年10月份整體消費物價按年上升2.2%，較9月份的1.9%升幅有所擴大…","digest":"政府統計處公布，2026年10月份整體消費物價按年上升2.2%…","points":["政府統計處公布，2026年10月份整體消費物價按年上升2.2%…","剔除政府一次性紓困措施的影響，10月基本通脹率為2.0%，較9月份（2.1%）略低","政府發言人指出10月份通脹維持溫和，惟短期內國際燃料價格仍受地緣政治緊張局勢影響，須密切留意"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:07:47+08:00","size":1,"keywords":[],"body":"政府統計處公布，2026年10月份整體消費物價按年上升2.2%，較9月份的1.9%升幅有所擴大，主因是差餉寬減於9月份結束。剔除政府一次性紓困措施的影響，10月基本通脹率為2.0%，較9月份（2.1%）略低。政府發言人指出10月份通脹維持溫和，惟短期內國際燃料價格仍受地緣政治緊張局勢影響，須密切留意。\n\n經季節性調整的綜合消費物價指數，截至2026年10月止的三個月，綜合消費物價指數的平均每月升幅為0.3%，高於截至9月止三個月的0.2%升幅。而剔除政府一次性紓困措施影響後，相應的升幅為0.1%及0.2%。\n升幅最高的類別為電力、燃氣及水\n在各類綜合消費物價指數組成項目中，價格在2026年10月份錄得按年升幅的類別為電力、燃氣及水（上升12.7%）、雜項服務（上升5.0%）、交通（上升4.5%）、耐用物品（上升1.4%）、雜項物品（上升1.4%）、住屋（上升1.4%）、外出用膳及外賣（上升0.9%），以及衣履（上升0.5%）。\n另一方面，綜合消費物價指數在二零二六年十月份錄得按年跌幅的類別為基本食品（下跌0.8%），以及煙酒（下跌0.4%）。\n10月份消費物價通脹保持溫和\n政府發言人表示，10月份的消費物價通脹依然保持溫和。雖然燃料相關項目的價格繼續錄得顯著升幅，但對其他項目的價格波及有限，大部分其他項目的價格僅輕微上升或甚至下跌。展望將來，雖然早前國際油價上升的效應會持續傳導至本地消費層面的燃料相關項目，但其他方面的價格壓力應會大致受控，整體通脹將維持溫和。然而，地緣政治緊張局勢仍是短期內影響國際燃料價格的主要不確定因素，當局將會密切留意相關發展。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb2bb4e3941","title":"興達大廈疑「圍標」案 案中法團成員涉騷擾證人 官下令撤銷保釋","url":"https://www.stheadline.com/society/3639331/興達大廈疑圍標案-案中法團成員涉騷擾證人-官下令撤銷保釋","summary":"廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案，涉嫌透過行賄手段串謀法團主席和成員，安排關聯公司取得物業管理和工程顧問合約，圖以2,000萬元投得大廈大型維修項目。","summary_short":"廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案，涉嫌透過行賄手段串謀法團主席和成員…","digest":"廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案…","points":["廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案…","案件今於區域法院續審，控方指被告之一、時任法團成員粘清波涉騷擾控方證人…","莊、林、杜為中間人，張案發時任興達大廈法團主席，而粘為時任法團成員"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:05:58+08:00","size":1,"keywords":[],"body":"廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案，涉嫌透過行賄手段串謀法團主席和成員，安排關聯公司取得物業管理和工程顧問合約，圖以2,000萬元投得大廈大型維修項目。案件今於區域法院續審，控方指被告之一、時任法團成員粘清波涉騷擾控方證人，暫委法官鄧少雄遂下令撤銷粘的保釋，粘即時還押。\n粘清波被控串謀向代理人提供利益罪\n被告依次為60歲董事莊聰圖、53歲商人林雪邊、47歲商人杜漢森、55歲的士司機張建華及49歲裝修工人粘清波；莊、林、杜為中間人，張案發時任興達大廈法團主席，而粘為時任法團成員。\n莊、林、杜和張同被控1項串謀向代理人提供利益罪，指4人於2022年9月29日至2023年1月4日期間串謀向張提供提供多筆款項，作為張協助關聯公司取得涉案合約的報酬；莊、林和粘另被控1項串謀向代理人提供利益罪，則指4人於上述時段向粘、鍾陳青蓮及鄧燦培提供等同興達大廈大型維修工程項目合約款額10%的款項，作為粘等人協助取得合約的報酬。\n莊聰圖。資料圖片\n林雪邊。資料圖片\n杜漢森。資料圖片\n張建華。資料圖片\n指粘清波與控方證人通電話並要求對方不要出庭\n控方外聘資深大律師梁卓然今向法庭表示，粘涉騷擾控方證人，違反其保釋條件。梁指，粘昨日下午涉前往興達大廈管理處，先後要求保安告知該名控方證人的電話號碼及所住單位號碼，遭保安拒絕。粘仍堅持要求聯絡，保安最終讓粘通過管理處固網電話致電證人，雙方通話約20分鐘，粘要求證人不要出庭作證、或在庭上供稱已忘記等，又着對方事後刪除通話記錄。\n梁指廉署人員因為要安排證人出庭而聯絡該證人，隨即獲告知此事；大廈閉路電視亦拍攝到粘出入管理處。梁續向法庭申請撤銷粘的保釋，獲鄧官批准。粘的代表大律師姚大華向被告提供法律意見後，今午再為粘申請保釋，惟遭鄧官拒絕，粘續須還押。\n案件編號：DCCC1217/2024\n法庭記者：王仁昌","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0e30cc572c","title":"小一入學自行分配學位結果下周一公布 近五成七人獲派位","url":"https://news.tvb.com/tc/1207438-小一入學自行分配學位結果下周一公布近五成七人獲派位","summary":"小一入學自行分配學位結果下周一公布。教育局指，今年有32,104名兒童申請公營小學自行分配學位。","summary_short":"小一入學自行分配學位結果下周一公布。","digest":"小一入學自行分配學位結果下周一公布","points":["教育局指，今年有32,104名兒童申請公營小學自行分配學位","當中近五成七，即18,148人獲派位，其中約四成五屬「世襲生」，其餘五成半按積分辦法準則分配","教育局提醒，家長下周一上午10時起，可透過電子平台或前往所申請小學查閲結果…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:29:00+08:00","size":1,"keywords":["小一自行分配學位"],"body":"小一入學自行分配學位結果下周一公布。\n\n教育局指，今年有32,104名兒童申請公營小學自行分配學位。當中近五成七，即18,148人獲派位，其中約四成五屬「世襲生」，其餘五成半按積分辦法準則分配。\n\n教育局提醒，家長下周一上午10時起，可透過電子平台或前往所申請小學查閲結果，並須在下周三或四，到申請小學為子女辦理註冊手續。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026iPa0tqrbKT1795161215.jpg?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c48a0ebeb9a","title":"女瑜伽導師謀殺案前男友罪成判囚終身 被告稱殺害「此生唯一愛過的女人」","url":"https://news.tvb.com/tc/1207436-女瑜伽導師謀殺案前男友罪成判囚終身被告稱殺害此生唯一愛過的女人","summary":"女瑜伽導師謀殺案，其前男友裁定一項謀殺罪成，法官依例判處他終身監禁。女瑜伽導師周慧賢，2022年6月身中逾40刀，伏屍在尖沙咀麗思卡爾頓酒店房內，終年23歲。","summary_short":"女瑜伽導師謀殺案，其前男友裁定一項謀殺罪成，法官依例判處他終身監禁。","digest":"女瑜伽導師謀殺案，其前男友裁定一項謀殺罪成，法官依例判處他終身監禁","points":["女瑜伽導師謀殺案，其前男友裁定一項謀殺罪成，法官依例判處他終身監禁","女瑜伽導師周慧賢，2022年6月身中逾40刀，伏屍在尖沙咀麗思卡爾頓酒店房內，終年23歲","其前男友勞浚銘被控一項謀殺罪，現年32歲的被告否認控罪，自辯時稱因為替事主支付學費、購物…"],"section":"港聞","category":"法庭","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:26+08:00","size":1,"keywords":[],"body":"女瑜伽導師謀殺案，其前男友裁定一項謀殺罪成，法官依例判處他終身監禁。\n\n女瑜伽導師周慧賢，2022年6月身中逾40刀，伏屍在尖沙咀麗思卡爾頓酒店房內，終年23歲。\n\n其前男友勞浚銘被控一項謀殺罪，現年32歲的被告否認控罪，自辯時稱因為替事主支付學費、購物，欠下巨款，但事主多次出軌，事發當晚事主指她兩度懷孕的孩子，都不是他的，失控下殺了她。五男二女陪審團周四一致裁定，被告謀殺罪成。\n\n辯方引述被告的求情信，向事主及其親友致歉，他無保護事主，更向公眾呈現了負面的形象，被告承認錯誤，殺害了此生唯一愛過的女人。\n\n高院法官郭啟安就指，案發時兩人已經分手，如果被告是如此深愛對方，應該放手，但用最殘忍的方式殺害對方，可以想像她在死前必然十分痛苦及極度恐懼，依例判被告終身監禁。","image":"https://pro-vod-cdn.tvb.com/be8f43c98f474fd0a6c1687239775d12/snapshots/77d5fc987a2f468e84d7e14b087f9d35-00008.jpg","video":"https://pro-vod-cdn.tvb.com/be8f43c98f474fd0a6c1687239775d12/6e8310a5a89f4eb09c100cf5fbee925c-ec6a91092985017a481fcadac563f3d6-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/be8f43c98f474fd0a6c1687239775d12/snapshots/77d5fc987a2f468e84d7e14b087f9d35-00008.jpg","lang":"zh-Hant"},{"id":"ca38df66047","title":"彌敦道瘋狂倒車撞4的士 警拘兩男涉盜人身份買車及狂亂駕駛 疑用作毒品快餐車","url":"https://www.stheadline.com/breaking-news/3639244/彌敦道瘋狂倒車撞4的士-警拘兩男涉盜人身份買車及狂亂駕駛-疑用作毒品快餐車","summary":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士，隨後逆線逃逸，導致一名57歲的士司機受傷送院。","summary_short":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士…","digest":"尖沙咀本周二凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障…","points":["尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障…","油尖警區重案組經深入調查後，發現案中案，揭發有人涉嫌盜用他人個人資料購買及登記為車主…","警方於本月17日及18日，在石硤尾及旺角賓館分別拘捕負責「買車登記」及「狂亂駕駛」的兩名26…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:52:34+08:00","size":1,"keywords":[],"body":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士，隨後逆線逃逸，導致一名57歲的士司機受傷送院。油尖警區重案組經深入調查後，發現案中案，揭發有人涉嫌盜用他人個人資料購買及登記為車主，並成功鎖定兩名嫌犯。警方於本月17日及18日，在石硤尾及旺角賓館分別拘捕負責「買車登記」及「狂亂駕駛」的兩名26歲本地男子，其中涉案司機將於明日（21日）在西九龍裁判法院提堂。\n消息稱，兩被捕男子均無業，有黑幫背景，兩人並不相識，涉案車輛僅登記三個星期，警方經調查後，不排除涉案車輛與毒品交易有關。\n警方展示檢獲的證物。楊偉亨攝\n警方展示案中證物。楊偉亨攝\n油尖警區重案組高級督察曾智皓現講述案情。\n遇路障拒查瘋狂倒車連撞四的士　白色私家車逆線狂飆山林道逃逸\n油尖警區重案組第二隊高級督察曾智皓詳細交代了案情。本月17日凌晨約1時10分，西九龍衝鋒隊隊員在尖沙咀彌敦道與山林道交界設置警方路障。期間，一輛白色私家車駛至，警員發現男司機神情緊張，遂上前指令其下車接受調查。然而，該名司機拒絕配合，並在無預警下突然急速倒車，猛烈撞向後方的四部的士。現場警員隨即上前制服並多次發出警告，惟司機一意孤行，強行扭軚並逆線駛入山林道，往覺士道方向狂飆，瞬間逃去無蹤。事件中，四輛被撞的士受到輕微損毀，一名57歲本地男的士司機頸痛，幸清醒送往伊利沙伯醫院治理後，同日已無礙出院。\n銳眼計劃法眼鎖定案中案　石硤尾拘廿六歲男涉盜個資「買人頭車」\n油尖警區重案組探員經深入調查及翻查「銳眼計劃」下安裝的閉路電視系統，警方發現，有人涉嫌非法盜用另一名男子的個人資料，登記為該輛逃逸私家車的車主。鎖定目標後，重案組探員於案發當日（17日）迅速展開行動，在石硤尾區以涉嫌「行使虛假文書」罪名，拘捕一名26歲姓簡的本地男子，他涉嫌盜用他人個資購買並登記涉案私家車。\n棄車上水古洞深山再匿旺角賓館　狂徒落網起獲車匙犯案衣物\n涉案的26歲姓李本地男司機在案發後隱匿行蹤。調查顯示，他狂飆逃離現場後，連夜將肇事私家車駛往上水古洞一處偏僻山路棄置，其後在旺角區的一間賓館租房匿藏。重案組探員於翌日（18日）中午時分突擊搜查該賓館，成功截獲李男，並以涉嫌「狂亂駕駛」將其拘捕。探員隨後將其押返黃大仙住所搜查，成功起獲涉案私家車的車匙、犯案當日所穿的衣物及手提電話，並在上水古洞的山路中尋回該輛白色私家車，車上並未發現其他違禁品。\n被捕的26歲李姓司機目前已被警方暫控相關罪名，案件將於明日（11月21日）在西九龍裁判法院提堂；而涉嫌盜用他人資料登記車主的簡姓男子則已獲准保釋候查，須於12月中旬向警方報到。警方強烈譴責此等罔顧他人生命安全的瘋狂駕駛行為，並重申根據香港法例第212章《侵害人身罪條例》，瘋狂駕駛致其他人受傷最高可判監兩年。曾智皓強調，雖然警方基於現場環境及安全考量，未有在彌敦道即時強行截停，但警隊絕對有能力憑藉強大的科技與偵查手段，在案發後迅速將犯案者繩之於法。\n鑑於本案涉及嚴重的個人資料被盜用以購買車輛犯罪，警方藉此機會向市民作出呼籲。曾智皓提醒，市民必須妥善保護自己的身份證、住址證明等個人私隱，切勿將個資交予未經核實的第三方。他強調，如果有人向你租借或者要求你出售個人資料，請三思而後行，切勿因小失大，避免不法之徒利用個人資料作非法用途，無論用作開銀行戶口，公司登記，車輛買賣登記或者其他非法用途，都可能需要負上刑責。記住，個人資料唔租，唔借，唔賣。\n17日凌晨涉案私家車犯案情況:\n網上流傳片段顯示，涉案私家車倒車期間，多名警員立即上前試圖截停，惟司機未有理會，繼續倒車並撞向多輛的士。片段中有人大聲喝止司機停車，但私家車仍繼續逃走，最後逆線駛入山林道。\n拍片者將片段上載社交平台，稱當晚在尖沙咀吃宵夜後，目睹一輛Audi私家車為避開路障撞向多輛的士後逃去。另有網民聲稱，該車逃走期間駛至裕華百貨對開曾衝紅燈，險些撞到途人。亦有網民揣測涉事車輛可能涉及毒品案件。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf48a539684","title":"現場｜水務署安排臨時食水供應予富寶花園居民 派供水特攻隊協助","url":"https://news.tvb.com/tc/1207517-現場水務署安排臨時食水供應予富寶花園居民派供水特攻隊協助","summary":"馬鞍山富寶花園因為內部私人供水管爆裂，屋苑食 om/tc/1207504-APEC領導人佩戴圍巾融合四大非遺工藝事前準備五千米布料製作","summary":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾，這兩款圍巾融合了宋錦、香雲紗等非遺工藝，更是從一萬條圍巾的面料中，精選出42條。","summary_short":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾，這兩款圍巾融合了宋錦…","digest":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾…","points":["今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾…","APEC領導人非正式會議開始前，各經濟體領導人在嘉賓休息室內整理圍巾，智利總統卡斯特…","圍巾兩面紋樣不同，結合祥雲紋、海浪紋及嶺南木棉、簕杜鵑元素，上面的APEC標誌…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T19:10+08:00","size":2,"keywords":[],"body":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾，這兩款圍巾融合了宋錦、香雲紗等非遺工藝，更是從一萬條圍巾的面料中，精選出42條。\n\nAPEC領導人非正式會議開始前，各經濟體領導人在嘉賓休息室內整理圍巾，智利總統卡斯特，向秘魯總統籐森慶子求助，墨西哥總統辛鮑姆也上前，他們佩戴的一藍一紅「同心合錦」圍巾，寓意「同心協力、繁榮合錦」。\n\n圍巾兩面紋樣不同，結合祥雲紋、海浪紋及嶺南木棉、簕杜鵑元素，上面的APEC標誌，由21根交織的羽毛組成，展翅高飛的鯤鵬造型，織入21根天然野蠶絲，象徵21個經濟體攜手發展。更匯聚香雲紗、宋錦、粵繡及蘇繡四項非遺工藝。\n\n圍巾主要設計方吳建華說：「我們確立了四大非遺融合在一起，基本的材料以宋錦，和香雲紗技藝，包括粵繡這三方面的技藝，然後在後來過程當中，為了提升它的精緻度，我們融入了蘇繡。」\n\n他又透露準備了5,000米的布料，按常規可以製作一萬條圍巾，不過最終只製成了50條，最後僅留下紅藍圍巾各21條。由各領導人自行選擇想要的顏色，當中藍色圍巾，是蘇州上久楷的宋錦織造，而紅色是佛山順德的香雲紗染製，曾被叫作「響雲紗」，因為穿上身走路，會發出沙沙的響聲。\n\n這種製作工藝已有超過一千年歷史，一個頂尖手藝人製作一匹香雲紗，要經歷36道工序，至少要半年時間。故此香雲紗又被稱為「軟黃金」，一件成衣售價可達數萬港元。","image":"https://pro-vod-cdn.tvb.com/51eacfbc05604a638c5c87f18df8326c/snapshots/4bed92f34d754511ae1a43f962f928b4-00008.jpg","video":"https://pro-vod-cdn.tvb.com/51eacfbc05604a638c5c87f18df8326c/7d9ed4e336564d159307f5c4cb9f5856-91a158413f4044c70c19d4ee12426c44-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/51eacfbc05604a638c5c87f18df8326c/snapshots/4bed92f34d754511ae1a43f962f928b4-00008.jpg","lang":"zh-Hant","items":[{"title":"APEC｜領導人佩戴圍巾融合四大非遺工藝 事前準備五千米布料製作","url":"https://news.tvb.com/tc/1207504-APEC領導人佩戴圍巾融合四大非遺工藝事前準備五千米布料製作","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T19:10+08:00","category":"兩岸","digest":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾…"},{"title":"APEC｜習近平就中澳關係提四點意見 黃循財稱願與中方增強政治互信","url":"https://news.tvb.com/tc/1207449-APEC習近平就中澳關係提四點意見黃循財稱願與中方增強政治互信","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T16:23+08:00","category":"兩岸","digest":"深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日…"}],"cross":{"total":2,"angles":[{"point":"深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207449-APEC習近平就中澳關係提四點意見黃循財稱願與中方增強政治互信"},{"point":"今年APEC領導人非正式會議上，各成員經濟體領導人大合照時，分別佩戴紅藍兩種顏色圍巾…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207504-APEC領導人佩戴圍巾融合四大非遺工藝事前準備五千米布料製作"}]}},{"id":"c9c2a798d6e","title":"印尼人与中国的故事：镜头、课本与父辈记忆","url":"https://www.chinanews.com.cn/hr/2026/11-20/10735602.shtml","summary":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆  　　中新社记者 李志全  　　15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门。","summary_short":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆  　　中新社记者 李志全  　　15年前…","digest":"题：印尼人与中国的故事：镜头…","points":["15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门","15年后，他再次来到厦门，举起相机，镜头里的城市已是另一番模样","11月20日，“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T23:32:07+08:00","size":1,"keywords":[],"body":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆\n\n　　中新社记者 李志全\n\n　　15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门。那时的他，对这座城市的印象是道路相对狭窄、高楼不多。15年后，他再次来到厦门，举起相机，镜头里的城市已是另一番模样。\n\n　　“高楼林立，街道宽阔，环境优美……我几乎不敢相信自己的眼睛！”邵亮明说。\n\n11月20日，“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。图为民众参观展览。　中新社记者 李志全 摄\n\n　　11月20日，心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。展览展出印尼摄影家创作的100幅摄影作品，涵盖中国历史文化、自然风光、城市发展等内容。\n\n　　“每一张照片，都是一段真实的记录。”组织采风活动的邵亮明表示，此次厦门、漳州等地之行，让印尼摄影家们亲眼见证了中国的发展变化。\n\n　　对华裔黄鸿恩(Shania)而言，“中国”二字最初来自父辈的记忆和口口相传。\n\n　　“小时候，中国对我来说，是一个既熟悉又遥远的地方。”黄鸿恩说。家里虽保留着一些中国传统，但日常交流已很少使用中文。彼时，中国文化主要与春节和红包联系在一起。\n\n　　后来，黄鸿恩开始学习中文，接触茶艺、书法和传统舞蹈。然而，中国对她而言仍像隔着一扇窗，“我想知道，长辈故事里的中国今天是什么样子，课本之外的中国人又过着怎样的生活。”\n\n　　带着好奇，黄鸿恩赴苏州大学交流学习。古镇小巷、热闹集市、街边烧烤摊，都成为她认识中国的课堂。她品尝过大闸蟹，也尝过一些连招牌都不认识的小吃。\n\n　　这段经历，拉近了她与中国的距离。过去需要在课堂上学习的词语，渐渐有了声音、味道和具体的面孔。如今在一家印尼中企工作的黄鸿恩，“每天都在和中国打交道。”\n\n　　“中文让我走近中国，文化让我理解中国。”正在清华大学攻读研究生的王雅丽(Berillya Imandi ka)，通过现场大屏幕连线，分享自己与中国结缘的经历。\n\n　　她从中学开始接触中文，进入大学后，学习汉语言与中国文化。2019年，王雅丽参加“汉语桥”比赛，获得印尼非华裔组冠军，并在比赛中表演中国传统戏曲《贵妃醉酒》。\n\n　　“那次经历让我更加坚定了继续学习中文、进一步了解中国的想法。”此后，她赴福建师范大学交流学习，在亲身体验中认识了“一个比课本描述更加丰富和多元的中国”。\n\n　　印尼总统大学国际关系学副教授赖剑文长期关注中国发展，多次赴华访问交流。他说，中国在经济建设、基础设施和科技领域的显著进步，让他每次到访都有新的感受，也让外国人对中国有了新的认识。\n\n　　中国驻印尼使馆文化参赞王思平表示，本次活动既是一场“讲中国故事”的文化分享，也是一次以影像为媒、以文化会友的交流盛会。希望通过主题讲座、青年交流等多种形式，让更多印尼朋友特别是青年一代，从身边的故事和真实视角认识中国、了解中国。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c19c482a196","title":"“泰国v姐”陈映玲解码《给阿嬷的情书》走红：内核在于真实与真诚","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-20/news1075620.shtml","summary":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。","summary_short":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。","digest":"11月20日，2026年侨海(客家)青年发展大会在海口市举行","points":["11月20日，2026年侨海(客家)青年发展大会在海口市举行","《给阿嬷的情书》参演者、短视频创作者“泰国v姐”陈映玲接受中新社记者采访时表示，爱国爱乡…","人与人之间情感相通，影片的出圈印证真心能够跨越地域与语言的隔阂"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T22:34:26+08:00","size":1,"keywords":[],"body":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。《给阿嬷的情书》参演者、短视频创作者“泰国v姐”陈映玲接受中新社记者采访时表示，爱国爱乡、有情有义的精神，适用于每一个时代、每一个人。她说，《给阿嬷的情书》走红的内核在于真实与真诚；人与人之间情感相通，影片的出圈印证真心能够跨越地域与语言的隔阂。(陈英清 林士杰)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/84FA9BAD929640A1A00282E0F4A80B7E.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cc6b13df284","title":"（深圳APEC）习近平会见马来西亚总理安瓦尔","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735268.shtml","summary":"中新社深圳11月20日电 11月20日中午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的马来西亚总理安瓦尔。","summary_short":"中新社深圳11月20日电 11月20日中午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的马来西亚总…","digest":"11月20日中午…","points":["中新社深圳11月20日电 11月20日中午，中国国家主席习近平在深圳会见来华出席亚太经合组织…","习近平指出，去年4月，我同安瓦尔总理就构建高水平战略性中马命运共同体达成重要共识…","一年多来，中马关系持续高水平发展，双方擘画的合作蓝图日益变成美好现实"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:20:45+08:00","size":2,"keywords":[],"body":"中新社深圳11月20日电 11月20日中午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的马来西亚总理安瓦尔。\n\n　　习近平指出，去年4月，我同安瓦尔总理就构建高水平战略性中马命运共同体达成重要共识，开启中马关系新的“黄金50年”。一年多来，中马关系持续高水平发展，双方擘画的合作蓝图日益变成美好现实。面对变乱交织的世界，中方愿同马方秉持建交初心，汇聚合作动能，推动中马命运共同体建设走深走实，为两国人民带来更多福祉。\n\n　　习近平强调，中马关系政治根基牢固，合作优势突出，发展前景广阔。双方要深化高水平战略协作，保持高层战略沟通，相互支持彼此维护国家主权、安全、发展利益；要加强发展战略对接，挖掘新兴合作潜力，高质量建设和运营好重点项目，做大做优农产品贸易；要引领文明交流互鉴，再接再厉办好中马“儒伊文明对话”，扩大旅游、教育等合作，进一步密切民间和地方交流；要协同推进全球治理改革，加强在亚太经合组织等多边框架内协调和配合，携手践行真正的多边主义，维护广大发展中国家共同利益。\n\n　　安瓦尔表示，在习近平主席英明领导下，中国取得非凡发展成就。衷心祝贺中国成功举办亚太经合组织领导人非正式会议和中俄美三国元首会晤，这充分彰显习近平主席在国际事务中的卓越影响力和领导力，中俄美三国元首发表《和平宣言》，在当前国际形势下具有重大战略意义。台湾问题是中国内政，马方坚定恪守一个中国政策。马方愿同中方加强战略协作，发挥好两国合作机制作用，运营好基础设施建设重点项目，加强人工智能等新兴领域合作，促进文明交流对话，加强在国际事务中的协调和配合，不断提升马中关系水平。\n\n　　蔡奇、王毅、黄坤明、王小洪等参加会见。(完) 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平会见马来西亚总理安瓦尔","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735268.shtml","source_display":"中新網 時政","published_at":"2026-11-20T16:20:45+08:00","category":"內地","digest":"11月20日中午…"},{"title":"（深圳APEC）习近平会见泰国总理阿努廷","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735278.shtml","source_display":"中新網 時政","published_at":"2026-11-20T16:19:59+08:00","category":"內地","digest":"11月20日上午…"}]},{"id":"c164477685e","title":"（深圳APEC）“未来在此被设计、测试和建造”——APEC与会领导人点赞深圳","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735538.shtml","summary":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举…","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新社深圳11月20日电 (记者 国璇)11月18日至19日…","多位APEC成员经济体领导人在不同场合点赞深圳的发展成就，并期待有更多“深圳奇迹”出现…","“在不到50年的时间里，深圳就从一个边陲小镇成长为拥有约1800万人口的超大城市"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:13:40+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。多位APEC成员经济体领导人在不同场合点赞深圳的发展成就，并期待有更多“深圳奇迹”出现，为亚太区域合作注入更多确定性。\n\n　　“在不到50年的时间里，深圳就从一个边陲小镇成长为拥有约1800万人口的超大城市。”加拿大总理卡尼认为，深圳代表了这个时代最伟大的变革之一。\n\n　　“深圳从一项政策试验变成全球经济引擎，从雄心勃勃的愿景转化为全新的生活方式，这种进步并非源于命运的眷顾或大自然的馈赠，而是来自一次次主动抉择。”在卡尼看来，深圳的成就来自开放、创新与合作。“未来在这里被设计、测试和建造。”\n\n　　韩国总统李在明表示，深圳生动展现了科技如何改变人们的生活。从在都市上空飞行的无人机、在道路上行驶的电动汽车，到应用人工智能与机器人的尖端制造现场，曾经仿佛遥不可及的未来科技，在深圳正逐渐成为日常。\n\n　　作为首位踏足深圳的在任美国总统，特朗普在同中国国家主席习近平会见时称赞深圳：“深圳真的是个非常棒的城市，只可惜有些媒体朋友没有办法看到城市全景。”\n\n11月17日，APEC会议周期间，市民游客在深圳人才公园的人才星光桥观看“春笋”、深圳湾一号等建筑亮起APEC主题标语。　中新社记者 陈楚红 摄\n\n　　“创新”是多位APEC成员经济体领导人提到的关键词。俄罗斯总统普京说，深圳是最现代化、最具活力的大都市之一，有机结合了高度城市化、舒适的城市环境和创新的生产基地。他还表示，深圳堪称中国经济发展成就的象征。\n\n　　智利总统卡斯特说，深圳已成为一座人口近2000万人的全球创新之都。“深圳的发展告诉大家，进步不是奇迹，而是一种决心，它需要劳动、努力和意志力。”\n\n　　新加坡总理黄循财在个人社交媒体上分享了一条展现深圳城市风光和科技创新成果的短视频，配文说：“自从我上次到访已经过去好几年了，这里的变化令人瞩目。深圳已成为充满活力的创新中心，尤其是在人工智能和机器人领域。”\n\n　　泰国总理阿努廷表示，深圳从小渔村发展成全球商贸大都会、先进技术与创新中心，其活力表明转型需要改革的意愿、坚持开放的信心，以及把全球联系转化为本地优势的能力。\n\n　　澳大利亚总理阿尔巴尼斯结合个人经历，以“两张照片”的对比形容深圳的巨大变化。“我在1998年第一次来到深圳。深圳这个非凡的成功故事，正是亚太地区经济显著增长的一个例证。如果你把深圳1998年和2026年的两张照片放在一起，你绝对不会认为这是同一个地方。”\n\n　　越共中央总书记、国家主席苏林说，过去几十年来，不论是深圳自身、还是整个中国所取得的跨越式发展成就，都证明了坚持改革开放和创新发展的正确性，同时表明各经济体携手合作对共促繁荣的重要意义。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccf4d10c7c7","title":"“国际基建卓越周2026”在港揭幕 香港发展局与多方推进基建合作","url":"https://www.chinanews.com.cn/dwq/2026/11-20/10735576.shtml","summary":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。","summary_short":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。","digest":"由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香…","points":["中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2…","香港特区行政长官李家超在活动上见证发展局与多个香港及海外机构交换意向书和合作备忘录…","李家超在开幕典礼上致辞时表示，要建设北部都会区并实现其发展愿景，香港必须以智慧城市理念…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:04:02+08:00","size":1,"keywords":[],"body":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。香港特区行政长官李家超在活动上见证发展局与多个香港及海外机构交换意向书和合作备忘录，以推动跨地域、跨领域的深度交流与合作，为更多香港、中国内地的建造企业及产品“出海”奠定基础。\n\n11月20日，由香港特区政府发展局牵头主办的“国际基建卓越周2026”在香港揭幕。图为香港特区行政长官李家超(中)和嘉宾主持开幕典礼。　(香港特区政府新闻处 供图)\n\n　　“国际基建卓越周2026”主要活动包括第二届国际基建项目领导峰会、“模块建造国际会议2026”和“建造创新博览会2026”，旨在构建建造业顶尖国际交流平台以促进可持续发展、提升基建效能，以及加速创新科技落地，推动行业升级转型。\n\n　　李家超在开幕典礼上致辞时表示，要建设北部都会区并实现其发展愿景，香港必须以智慧城市理念、人工智能、先进工程技术、创新建造方法及材料，打造配合未来需要的基础设施，而协作是建造业迈向卓越的关键。\n\n　　活动同场举行第二届国际基建项目领导峰会，超过800位来自全球30多个国家和地区的大型基建项目领袖和专家与会。峰会以“灼见赋能 擘画蓝图”为主题，探讨如何应对建造业的挑战及推动高质量发展。\n\n　　发展局局长甯汉豪表示，特区政府积极推动建造业升级转型，迈向高端化、智能化及高质量发展；在提速北部都会区建设时，积极推行革新，精简审批程序，并善用人工智能，推动广泛应用先进建筑物料与科技。她介绍，香港在国际建筑成本排名持续改善，建筑成本从2020年的全球第3位回落至本年度的第16位，反映成本控制取得进步。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7628b42ad7","title":"2026年空手道世界杯在杭州举行 系首次落地中国","url":"https://www.chinanews.com.cn/ty/2026/11-20/10735575.shtml","summary":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。","summary_short":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。","digest":"2026年空手道世界杯于20日在浙江杭州开幕","points":["中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕","来自全球41个国家和地区的79支顶尖队伍齐聚赛场，角逐男子团体型、女子团体型、男子团体组手…","开幕式上，世界空手道联合会主席安东尼奥·埃斯皮诺斯在致辞中表示…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:03:12+08:00","size":1,"keywords":[],"body":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。来自全球41个国家和地区的79支顶尖队伍齐聚赛场，角逐男子团体型、女子团体型、男子团体组手、女子团体组手四个项目金牌，中国队将参加全部四项比拼。这也是空手道世界杯首次在中国举办。\n\n　　开幕式上，世界空手道联合会主席安东尼奥·埃斯皮诺斯在致辞中表示，本次赛事不仅是竞技比拼的舞台，更是加深友谊、增长经验的宝贵契机，希望所有参赛者珍惜机会，在赛场上尽情展现空手道的独特魅力与卓越风采。\n\n　　空手道世界杯是世界空手道联合会最高级别团体赛事。比赛首日进行了男子团体组手、女子团体型小组赛及四分之一决赛。男子团体组手项目中，土耳其、伊朗、黑山和WKF-1队闯入四强。女子团体型项目中，中国队在四分之一决赛险胜意大利，携手埃及、伊朗、日本晋级半决赛。\n\n11月20日，2026年空手道世界杯在杭州开幕，共有41个国家和地区的79支队伍参与角逐。图为比赛现场。肖健 摄\n\n　　“这是我第二次来到杭州参赛，这里的比赛场馆很棒，赛事也组织得很好，这些都给我留下了深刻印象。今年我们期待在杭州能取得更好的成绩。”西班牙队队员玛丽亚·托雷斯说。\n\n　　“这次我参加的是女子团体组手项目，团体项目和个人项目确实有不一样的感觉，个人项目单独作战，自己拼尽全力就可以，团体项目集聚了来自不同级别的优秀选手，每个人都要上场，更讲究团队配合。”中国队队员、爱知·名古屋亚运会空手道女子组手68公斤级冠军李巧巧说，“这次在家门口比赛心情也很开心、激动，希望我们的成绩能一次比一次好”。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4faba6f64e","title":"第三届兰花奖颁奖典礼在北京举行 10位国际友人获奖","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735574.shtml","summary":"中新社北京11月20日电 第三届兰花奖颁奖典礼11月20日在北京举行。","summary_short":"中新社北京11月20日电 第三届兰花奖颁奖典礼11月20日在北京举行。","digest":"第三届兰花奖颁奖典礼11月20日在北京举行","points":["中新社北京11月20日电 第三届兰花奖颁奖典礼11月20日在北京举行","中共中央政治局委员、中央宣传部部长李书磊出席并致辞","兰花奖旨在表彰奖励为弘扬全人类共同价值、促进中外文明交流互鉴作出突出贡献的国际友人和机构"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:03:02+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 第三届兰花奖颁奖典礼11月20日在北京举行。中共中央政治局委员、中央宣传部部长李书磊出席并致辞。\n\n　　兰花奖旨在表彰奖励为弘扬全人类共同价值、促进中外文明交流互鉴作出突出贡献的国际友人和机构。来自法国的让-马里·居斯塔夫·勒克莱齐奥、新加坡的马凯硕、美国的亚当·福斯特等10位国际友人获得本届兰花奖。\n\n　　与会嘉宾认为，兰花奖源于中国、连通世界，设立以来，国际影响力持续提升，为不同文明和合共生注入了新动能，也成为各国文明同心同理、互促互进的见证。\n\n　　与会嘉宾表示，要坚持平等相待，促进多元文明包容共存；守护文化根脉，推动人类文明薪火相传；加强数智赋能，助力文明成果普惠共享，为推动人类文明进步贡献更多智慧和力量。\r\n\n　　第三届兰花奖颁奖典礼由中国外文局主办。来自中央有关部门、国际组织、驻华使节、中外智库、媒体机构代表等300余人参会。11月21日至26日，部分获奖者等还将赴山西开展“走读中国”参访活动。(完) 【编辑:李骏】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c38febb8e5e","title":"38名广州台湾青少年同场决赛 宣讲岭南文化","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735570.shtml","summary":"中新网广州11月20日电 (记者 郭军)“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”决赛20日在广州举办。","summary_short":"中新网广州11月20日电 (记者 郭军)“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”决赛20日在广州举办。","digest":"“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”决赛20日在广州举办","points":["中新网广州11月20日电 (记者 郭军)“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”…","决赛现场，38名优秀选手同台竞技，各展风采，生动讲述在广州的学习生活故事与岭南文化魅力","此次大赛由广东省海峡两岸交流促进会指导，广州市台办、市教育局、市文化广电旅游局…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T22:01:36+08:00","size":1,"keywords":[],"body":"中新网广州11月20日电 (记者 郭军)“岭南文化我来讲——第三届广州台湾青少年宣讲员大赛”决赛20日在广州举办。决赛现场，38名优秀选手同台竞技，各展风采，生动讲述在广州的学习生活故事与岭南文化魅力。\n\n　　此次大赛由广东省海峡两岸交流促进会指导，广州市台办、市教育局、市文化广电旅游局、市青联等联合主办。第三届广州台湾青少年宣讲员大赛自今年9月启动以来，得到广大在穗台湾青少年积极响应与踊跃参与，共有101名热爱岭南文化的青年学子报名参赛。\n\n　　决赛现场，经过激烈角逐，最终评选出特等奖4名、一等奖8名、二等奖12名、三等奖14名。颁奖仪式上，公布了大赛“优秀组织奖”“优秀指导老师奖”的获奖名单，出席活动的领导及嘉宾为“广州市台湾青少年金牌宣讲员”选手和“最佳组织奖”单位颁奖。\n\n　　据悉，本次大赛延续了“岭南文化我来讲”的品牌，通过优化赛事组织，为在穗台湾青少年提供了优质的风采展示平台。少年组选手走进广州14家国家、省、市对台交流平台，寻找并讲述那些关于同根同源的动人往事；而青年组选手则围绕“传承岭南优秀传统文化”“打卡广州精品主题线路”“助力公益志愿服务”“安居乐业追梦圆梦”“融入广州高质量发展”等主题，分享他们扎根大湾区的生活、学习与实践的故事，展现两岸青年携手打拼、融合发展的生动实践。(完)\r\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Han
