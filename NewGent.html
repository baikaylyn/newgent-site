<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M5 4.5h10a2.5 2.5 0 0 1 2.5 2.5v12.5H5z"/>
        <path d="M8 9h6M8 12.5h6M8 16h4"/>
      </svg>
      <span>新闻</span>
    </button>
    <button class="tab" data-mod="live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.6"/>
        <path d="M7.6 7.6a6.2 6.2 0 0 0 0 8.8M16.4 7.6a6.2 6.2 0 0 1 0 8.8"/>
        <path d="M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/>
      </svg>
      <span>直播</span>
    </button>
    <button class="tab" data-mod="radio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="8.5" width="18" height="11.5" rx="2.2"/>
        <path d="M16.4 4.2 7.6 8.5"/>
        <circle cx="8.2" cy="14.2" r="2"/>
        <path d="M14 12.6h4M14 16h4"/>
      </svg>
      <span>电台</span>
    </button>
    <button class="tab" data-mod="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.9"/>
        <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.8 5.8l1.5 1.5M16.7 16.7l1.5 1.5M18.2 5.8l-1.5 1.5M7.3 16.7l-1.5 1.5"/>
      </svg>
      <span>设置</span>
    </button>

      "body": "深圳這兩天迎來近半世紀以來最重大的國際外交盛事，多國領導人齊聚一堂。俄羅斯總統普京與日本首相高市早苗亦現身深圳APEC。據日媒報道，日俄領導人首次進行交談，時長約30分鐘，雙方同意就分歧保持溝通。\n相關新聞：日本煙草｜俄臨時接管境內4相關公司資產 日政府強烈抗議\n日俄首腦時隔8年再會晤\n相關新聞：《北海道新聞》記者涉間諜罪被俄拘留13天 日領事首獲准探視促立即放人\n《共同社》稱，此次交談在18日晚上APEC歡迎晚宴結束後不久，以交換意見的形式進行，持續約30分鐘；俄羅斯總統府並未公布日俄首腦對話的內容。\n《共同社》補充，高市要求俄方盡早釋放早前被拘留的《北海道新聞》記者，以及撤回俄方接管日本煙草產業（JT）在俄業務的命令。不過未有報道指出，俄方對日本之要求作出什麼回應以及有什麼期盼。不過報道指出，雙方一致同意在各個層面保持溝通，多名日本政府相關人士亦確認了這一消息。\n相關新聞：日俄領土之爭｜普京首訪千島群島視察 日本外相茂木敏充強烈抗議\n日俄首腦上次面對面接觸是在2019年9月；自俄烏衝突爆發後，日本與七國集團（G7）一道對俄實施制裁，使兩國關係惡化。普京今年8月首次訪問北方四島中的擇捉島（俄方稱「伊圖魯普島」），進一步加強對日施壓。\n相關新聞：深圳APEC前夕｜日嚴正抗議兩俄軍機侵領空 南下繞台飛往太平洋 \n高市政府在維持對俄制裁的同時，亦在尋求對話的突破口，例如外相茂木敏充10月曾與俄外長拉夫羅夫舉行會談。不過，就在本月17日，日本防衛省發布消息稱，2架疑似俄羅斯軍機當天接連進入了福岡縣近海的日本領空。",

      "body": "國家主席習近平晚上在深圳，為出席亞太經合組織APEC會議的領導人，舉行歡迎宴會。拍照期間，習近平與俄羅斯總統普京及美國總統特朗普在中俄美三方會晤前夕，率先短暫互動。習近平亦與首次訪華的日本首相高市早苗握手。\n\n國家主席習近平與夫人彭麗媛在深圳國際交流中心舉行宴會，歡迎出席亞太經合組織APEC領導人非正式會議的來賓，包括行政長官李家超，以及上任後首次訪華的日本首相高市早苗。\n\nAPEC｜習近平伉儷為峰會領導人舉行歡迎宴會並致祝酒辭｜附全文\n\n高市上年底發表「台灣有事」論，導致中日關係惡化，她與習近平握手後，向習近平說了幾句說話，在合照後，高市跟習近平與彭麗媛，互相點頭示意才離開。\n\n到場的還有俄羅斯總統普京，以及下午才飛抵深圳的美國總統特朗普。他與習近平及彭麗媛合照後，普京上前與他握手，二人在習近平旁邊簡短交談，形成中俄美元首「世紀同框」。\n\n三人周四將在APEC會議後，舉行中俄美元首會晤。各APEC領導人又一起拍大合照。特朗普站在習近平的右邊，普京則站在彭麗媛左邊。高市獲安排站在後排，李家超右邊。\n\n習近平在歡迎宴會發表祝酒辭，指APEC引領亞太經濟一體化進程，助力亞太成為全球經濟最具活力的地區以及重要增長引擎，並預告周四會議的內容。\n\n國家主席習近平說：「我們將討論擴大相互開放的舉措，探索創新驅動增長的路徑，拓展各領域務實合作的機遇，推動更多成果落地。」\n\n習近平表示，期待與會各方共商亞太合作大計，共襄亞太發展大業。並祝願亞太地區共同繁榮。",

      "title": "深圳APEC︱習近平再與高市早苗禮節性握手 繼續僅保持微笑",
      "url": "https://www.stheadline.com/realtime-china/3638593/深圳APEC習近平再與高市早苗禮節性握手-繼續僅保持微笑",
      "summary": "國家主席於今日（19日）舉行的出席亞太經合組織（APEC）領導人非正式會議上，與日本首相高市早苗握手。",
      "summary_short": "國家主席於今日（19日）舉行的出席亞太經合組織（APEC）領導人非正式會議上，與日本首相高市早苗握手。",
      "digest": "國家主席於舉行的出席亞太經合組織領導人非正式會議上，與日本首相高市早苗握手",
      "points": [
        "國家主席於今日（19日）舉行的出席亞太經合組織（APEC）領導人非正式會議上…",

        "有外媒指，二人握手期間，現場影片所見，高市曾說出約十秒的說話，惟習近平只微笑回應"
      ],
      "section": "兩岸",
      "category": "兩岸國際",
      "source": "stheadline",
      "source_display": "星島頭條",
      "published_at": "2026-11-19T11:40:58+08:00",
      "size": 1,
      "keywords": [],
      "body": "國家主席於今日（19日）舉行的出席亞太經合組織（APEC）領導人非正式會議上，與日本首相高市早苗握手。昨日在歡迎晚晏上，二人亦曾握手。有外媒指，二人握手期間，現場影片所見，高市曾說出約十秒的說話，惟習近平只微笑回應。\n\n日本首相高市早苗昨日（18日）下午飛抵深圳機場，出席亞太經合組織（APEC）峰會，中方今日派出已退休的前中國駐希臘大使章啟月迎接，級別不及參會的其他國家領導人。至於台灣APEC代表施振榮，則由APEC籌委會高官程烈、廣東省APEC籌委會代表方濤等人迎接。\n相關新聞：深圳APEC｜美國總統特朗普專機抵達深圳 習近平親自到機場迎接 ︱不斷更新\n退休前大使章啟月接機 \n電視畫面顯示，前往迎接高市早苗的是前中國駐希臘大使章啟月。67歲的章啟月曾任外交部發言人、中國駐印尼大使、中國駐紐約總領事，退休已有5年。今次，她以「外交部禮賓大使」的身份參與接待，除單獨迎接高市早苗外，還與廣東省政協主席林克慶、中國駐韓大使戴兵一起迎接韓國總統李在明。\n\n到了晚上舉行的歡迎晚宴，國家主席習近平與高市早苗握手。綜合彭博社等媒體報道，高市在宴會上向習近平說了幾句話，但習近平只是微笑，沒有回應。合影結束後，高市離開時，與習近平互相點頭致意。\n國家主席習近平在歡迎晚宴上，與高市早苗握手。路透社\n相關新聞：深圳APEC｜中方「自動鋪地氈機」VS美軍跪地擦？ 習特會舊片引熱議｜有片\n本次參加APEC峰會的領導人，主要由廣東省人大常委會主任黃楚平、廣東省政協主席林克慶接機，即由現任正部級幹部迎接。安排退休的正局級官員單獨迎接日本政府首腦，規格明顯低於其他領導人。\n去年11月，高市早苗發表「台灣有事」論，此後中日關係急速惡化，外界預料她此次不會與國家主席習近平舉行會晤。",

      "body": "據報捲入婚外情和間諜風波的輝達創辦人黃仁勳，曾就與出軌對象黃樂的關係誤導公司高層，堅稱兩人「清白」。美國總統特朗普表示，若黃樂不是間諜，黃仁勳未必要辭職。多名輝達員工發起網上聯署，要求輝達挽留黃仁勳。\n\n路透社引述Nvidia輝達內部員工通訊報道，周四宣布辭任行政總裁的黃仁勳，就他與婚外情對象、中國籍女商人黃樂的關係，曾誤導公司多名高層，包括首席法律顧問及市場推廣總監等。\n\n《紐約時報》去年十月報道黃仁勳與黃樂見面的消息後，黃仁勳更表示考慮向報社提訴，但最終未有成事。有指相關報道迫使黃仁勳向公司高層交代兩人之間的互動，當時他堅稱兩人關係「清白」，並不牽涉婚外情。\n\n美國總統特朗普在黃仁勳辭職當日接受訪問，指若黃樂並不是間諜，或許黃仁勳毋須下台。他形容黃仁勳「來回地獄又折返人間」，覺得愧對太太及家人，備受折磨。特朗普又稱自己了解黃仁勳，讚他「天才橫溢」。\n\n美國總統特朗普說：「他實在是一位不可多得的人才，能人所不能，你看中國及其他人，他們只會抄襲、竊取，但我們的晶片複雜、精密、無法複製，他們無法抄襲，因為已經超出了他們的認知。黃仁勳做得很好，他創立的輝達簡直驚人。」\n\n特朗普又稱，黃仁勳確實難以取代，但如果真要有人接任輝達行政總裁，只有曾帶領蘋果取得空前成功的蘋果前行政總裁庫克才可以勝任。部分輝達部分員工亦肯定黃仁勳的貢獻，發起網上聯署，要求他重返管理層。\n\n富商馬斯克亦在社交平台發文，指自己已在請願帖文署名，希望輝達挽留黃仁勳。\n\n目前輝達執行副總裁兼首席財務官克雷斯暫代公司行政總裁，她亦被視為黃仁勳的熱門繼任人之一。",

      "body": "港鐵藍田站路軌旁傍晚發生火警，無人受傷，觀塘站來往調景嶺站列車服務一度暫停約一小時。港鐵指懷疑是道岔設備絕緣膠因短路起火。\n\n事發的路軌旁冒出火光，位置靠近底部，出事的是俗稱波口的道岔用來控制列車行駛方向。港鐵指傍晚約五時半，即放工繁忙時段，藍田站路軌旁發生火警，車站需要封閉，大批消防和地鐵職員在往黃埔方向月台進入路軌搶修，受事故影響，觀塘至調景嶺站列車服務暫停，大批乘客須改乘其他交通工具。\n\n陸先生說：「上面很多人、塞滿大堂，取消行程，相信都很多人。下次再打算。」\n\n張小姐說：「原本打算繞路走，每站停久一些，其餘都可以，遲了約5至10分鐘。上層有位坐。」\n\n港鐵安排免費接駁巴士，來往觀塘、藍田及油塘站。在油塘站的車站，人龍沿著茶果嶺道，排到油塘道交界。\n\n港鐵在傍晚約六時半宣布，於藍田站附近路軌旁的火警已經處理，觀塘綫列車服務逐步回復正常，藍田站亦已經解封。\n\n港鐵晚上指懷疑是道岔設備一件絕緣膠因短路起火。曾是港鐵職員的立法會前議員張欣宇認為，事故不影響行車安全，又指單靠日常檢修，難以完全避免短路。\n\n智慧交通聯盟理事長張欣宇說：「應該是短路爆的火花點燃絕緣膠，因為膠是能燒著，在路軌軌旁包括波口，其實真的能燒著的東西很少，就算一塊膠都不會燒很久，不然燒很短時間都會停下來，只要檢查環境、固定波口、重新行車，相對短時間能完成。」\n\n由於事故歷時逾半小時，加上正值繁忙時間，張欣宇估計港鐵會被罰款。",

          "body": "港鐵藍田站路軌旁傍晚發生火警，無人受傷，觀塘站來往調景嶺站列車服務一度暫停約一小時。港鐵指懷疑是道岔設備絕緣膠因短路起火。\n\n事發的路軌旁冒出火光，位置靠近底部，出事的是俗稱波口的道岔用來控制列車行駛方向。港鐵指傍晚約五時半，即放工繁忙時段，藍田站路軌旁發生火警，車站需要封閉，大批消防和地鐵職員在往黃埔方向月台進入路軌搶修，受事故影響，觀塘至調景嶺站列車服務暫停，大批乘客須改乘其他交通工具。\n\n陸先生說：「上面很多人、塞滿大堂，取消行程，相信都很多人。下次再打算。」\n\n張小姐說：「原本打算繞路走，每站停久一些，其餘都可以，遲了約5至10分鐘。上層有位坐。」\n\n港鐵安排免費接駁巴士，來往觀塘、藍田及油塘站。在油塘站的車站，人龍沿著茶果嶺道，排到油塘道交界。\n\n港鐵在傍晚約六時半宣布，於藍田站附近路軌旁的火警已經處理，觀塘綫列車服務逐步回復正常，藍田站亦已經解封。\n\n港鐵晚上指懷疑是道岔設備一件絕緣膠因短路起火。曾是港鐵職員的立法會前議員張欣宇認為，事故不影響行車安全，又指單靠日常檢修，難以完全避免短路。\n\n智慧交通聯盟理事長張欣宇說：「應該是短路爆的火花點燃絕緣膠，因為膠是能燒著，在路軌軌旁包括波口，其實真的能燒著的東西很少，就算一塊膠都不會燒很久，不然燒很短時間都會停下來，只要檢查環境、固定波口、重新行車，相對短時間能完成。」\n\n由於事故歷時逾半小時，加上正值繁忙時間，張欣宇估計港鐵會被罰款。",

          "keywords": [],
          "body": "近年來「網上起底」問題日益嚴重，有人透過互聯網惡意公開他人資料，導致受害者身心受創。警方提醒市民：起底不僅傷人，更可能觸犯法律，後果遠超想像。\n\n「網上起底」（doxxing）指的是透過搜尋引擎、社交媒體、匿名討論區等平台，在未經當事人同意下搜集並公開個人或其親友的私隱資料，甚至配合攻擊性言論或威脅行為。常見被披露的資料包括身份證號碼、電話號碼、住址、工作單位、私人照片等，一旦這些資訊成為騷擾或勒索的工具，便會對受害人構成長期壓力和恐懼，有些人甚至要搬家、離職，影響整個家庭生活。\n\n為應對日益猖獗的起底行為，香港於2021年修訂《個人資料（私隱）條例》，正式將「起底」行為訂為刑事罪行。新修訂條例旨在打擊侵犯個人資料私隱的起底行為，同時賦權個人資料私隱專員進行刑事調查和檢控，並可強制將起底訊息移除。\n\n▍　條例引入兩級制罪行制度\n\n條例引入兩級制罪行制度以加強打擊起底。第一級罪行循簡易程序審訊，入罪門檻為未經當事人同意披露個人資料，並有意圖或罔顧是否會導致當事人或家人蒙受指明傷害，最高可處罰款十萬元及監禁兩年。第二級罪行則可循公訴程序審訊，除上述門檻外，還需證明對資料當事人或家人構成了實際的指明傷害，最高刑罰大幅提升至罰款一百萬元及監禁五年。\n\n法律定義的「指明傷害」涵蓋範圍廣泛，包括對該人的滋擾、騷擾、纏擾、威脅或恐嚇；對該人的身體傷害或心理傷害；導致該人合理地擔心其安全或福祉的傷害；以及該人的財產受損。若有人違反法院就個案發出的禁制令，亦可能被控藐視法庭，甚至即時監禁。受害者更可提出民事訴訟，向起底者追討賠償。\n\n▍　私隱專員有權要求移除有關訊息\n\n新修訂條例賦予私隱專員刑事調查權及檢控權，專員有權就起底行為作刑事調查，並於裁判法院循簡易程序提出檢控。任何人沒有合理辯解而未有提供私隱專員就指明調查所需的材料或協助，最高可被罰款二十萬元和監禁一年；若出於詐騙意圖，在要項上提供虛假或具誤導性的材料或陳述，最高可被罰款一百萬元和監禁兩年。\n\n此外，私隱專員獲賦權強制移除起底訊息。在未有資料當事人同意下披露其個人資料，並有犯罪意圖或罔顧元素，私隱專員便有權向身處香港的個人、在香港成立或設有業務地點的網絡服務供應商，以及境外服務提供者發出停止披露通知，要求移除有關起底訊息。\n\n對比修訂前的《私隱條例》，新修訂填補了多項不足。修訂前只規管「未經資料使用者同意」而披露個人資料，新修訂則規管「未經資料當事人同意」而披露個人資料；保障對象由資料當事人擴展至資料當事人及家人；保障範圍從導致心理傷害，擴展至有意圖或罔顧會否導致指明傷害，以及對當事人或家人構成了指明傷害。在要求移除起底訊息方面，修訂前只能作出勸喻，新修訂則有權發出停止披露通知強制移除；同時新增了刑事調查和檢控權，大大加強了執法力度。\n\n新修訂貫徹兩大原則：一方面杜絕起底，保障市民大眾的個人資料私隱；另一方面平衡受《基本法》保障的言論自由。移除機制設有上訴機制以作制衡，而《私隱條例》為合法的、符合公眾利益的新聞活動提供的免責辯護亦維持不變，確保在打擊起底的同時，不會不合理地限制正當的言論和新聞自由。\n\n一名電訊公司技術員利用工作之便，從公司電腦取得警務人員家屬的身份證號碼等個人資料，並發布至社交平台，導致該家屬蒙受心理傷害。2020年11月，法庭判處該被告18個月監禁，連同其他定罪共被判監兩年。這是《私隱條例》相關條文自2012年修訂後，首宗因違反規定而被定罪及判囚的案件。\n\n▍　籲避免回應爭議貼文\n\n若不幸遭遇起底，應立即向私隱專員公署舉報，提供資料截圖與網頁連結（查詢／投訴熱線：3423 6666）；同時保留所有證據並報警處理；亦可透過律師向法庭申請禁制令，制止資料進一步流傳。如感到情緒受困，應向社工、輔導機構或非政府組織求助。\n\n警方呼籲市民設定社交帳戶為「私人」模式，避免公開電話、住址、學校等敏感資料，審慎發文及回應爭議貼文，提醒子女與親友關注網絡安全與尊重他人私隱。你的一鍵，可能改變別人一生——起底不只是惡作劇，更可能是刑事行為。\n\n點擊觀看節目重溫",

          "body": "旅發局年度盛事「香港繽紛冬日巡禮」繼中環及尖沙咀冬日小鎮登場後，節慶氣氛將進一步延伸至銅鑼灣。旅發局聯同希慎興業下周三（25日）起推出「香港冬日小鎮．銅鑼灣」，以精靈村莊為主題，帶來光影表演、節慶燈海及戶外酒吧等活動，並於12月中起舉行聖誕市集及工作坊。旅發局亦由今日（18日）起推出「繽紛冬日賞」，聯同電子支付平台推出近350項餐飲及零售優惠，讓市民及旅客在節日期間盡享購物及美食體驗。\n銅鑼灣冬日小鎮下周登場　設40米戶外酒吧\n「香港冬日小鎮．銅鑼灣」將於11月25日起舉行，屆時銅鑼灣將化身熱鬧的精靈村莊，並帶來精靈籌備聖誕禮物的光影表演。恩平道及希慎道將布置節慶燈飾，希慎道更會設置全長40米的「Elves’ Night Out」戶外酒吧，提供以本地茶香、果香及傳統香料調製的銅鑼灣主題限定雞尾酒。市民及旅客亦可參加導賞團及樓上舖體驗，探索銅鑼灣不同面貌。\n活動將於12月中起增設聖誕市集及一連串工作坊，並推出零售及餐飲節慶禮遇，讓訪客由欣賞表演、品嚐美食以至購物，感受銅鑼灣冬日氣氛。\n旅發局今日起至2027年1月5日，聯同AlipayHK、支付寶及Alipay+推出「繽紛冬日賞」，市民及旅客只需於全港逾6,000間參與商戶掃描指定二維碼，即可領取近350項餐飲及零售優惠。精選優惠包括城景閣自助早餐買一送一、香港麥當勞巨無霸套餐買一送一、PHI Coffee & Pancake單點餐牌八折，以及太興晚市堂食滿100元減10元等。\n支付寶內地用戶及指定Alipay+海外合作電子錢包用戶，另可享十萬份消費優惠，並有機會獲得最高500港元或人民幣消費獎賞，或於「優質旅遊服務計劃」參與商戶享全單八折，最高減100港元。優惠數量有限，先到先得。\n精選逾50款香港特色美食及手信\n旅發局亦聯同業界精選逾50款「只在香港」的特色美食及地道手信，包括唐述「香港十味」清真嚐味菜單、紅棉邵德龍師傅秘製蕃茄豬扒飯、敏華冰廳「食神」套餐，以及Shake Shack香港限定楊枝甘露奶昔等。\n手信及商品方面，則有GigaSports聯乘本地跑步品牌T8推出的「香港特色系列」服裝、奇華餅家與香港插畫藝術家麥東記合作推出的香港情懷禮盒，以及蘇太名醬XO醬、雙妹嚜經典皇牌套裝等，讓旅客在感受節日氣氛之餘，亦可品嚐及選購具香港特色的產品。\n市民及旅客可登入旅發局「香港繽紛冬日巡禮」專頁，查閱全城節慶活動及優惠詳情。跨年倒數煙花匯演亦將以慶祝香港特區成立30周年為主題壓軸上演，詳情將於稍後公布。\n\n <div",

            "過往萬聖節前夕，「百鬼夜行」的中環蘭桂坊，一班「嘩鬼」今年提早「駕到」"

          "section": "港聞",

          "size": 1,
          "keywords": [],
          "body": "萬聖月即日起一連三個周末在全港多區舉辦特色活動。中環蘭桂坊及皇后像廣場都吸引不少市民及遊客「變身」參加，形容氣氛濃厚。\n\n過往萬聖節前夕，「百鬼夜行」的中環蘭桂坊，一班「嘩鬼」今年提早「駕到」。晚上8時許，蘭桂坊已經人頭湧湧。不論是傳統驚嚇角色或遊戲「主角」，這裡都隨處可見。\n\n馬來西亞旅客沛佳說：「我覺得很有氣氛，因為這裡過萬聖節好像過一個月，我覺得好好玩，因為每個人可以打扮成不同角色。」\n\n廣州旅客說：「(正日)驚太多人，所以提前來感受一下，提前拍照。以為今天是第一日，不會太多人，結果都是人山人海。」\n\n蘭桂坊亦安排六名「嘩鬼」在附近巡遊，直至晚上11時。\n\n呂先生說：「我去年都有來，這個時間是沒甚麼人，但今年已經好多人。」\n\n有酒吧亦期望活動帶動人流，指萬聖月首天訂枱已爆滿，期望「爆到」10月底。\n\n蘭桂坊酒吧副經理Max說：「只要下面區有人流，會有人行，很自然到餐廳、酒吧，就會上來。期望這兩星期，生意額會至少上升一半以上。」\n\n鄰近的皇后像廣場氣氛一樣夠。公主配上骷髏骨又是否相襯？不論大人、小朋友，甚至是「毛孩」都提早過萬聖節。\n\n羅先生說：「我覺得每年都這樣舉辦都好，多點遊客來香港，可以分散人流，早點出來玩。」\n\n這個近兩層樓高的大型眼球裝置，入夜後更「吸睛」。裝飾配上燈光效果，感覺更詭異。\n\n林小朋友說：「好恐怖，有這麼大的眼睛，又有很多不同的骷髏骨，不會被它嚇到，因為都不是真的。」\n\n周先生說：「很特別今年，夠大型、四處都有公仔，可以拍照。」\n\n市民除了來這裡，可與萬聖節裝飾打卡外，周日晚亦有音樂表演，令到場市民更盡興。\n\n啟德體育園主場館晚上亦化身成萬聖節南瓜。\n\n旺角、尖沙咀等亦會舉辦特色活動。旅客「扮鬼扮馬」，可免費乘搭兩輛特色電車。",

          "body": "「幻彩詠香江」晚上作告別演出。\n\n踏正晚上8時，有22年歷史的「幻彩詠香江」，最後一次在維港上演，除了傳統的鐳射燈光，這晚特別加入了煙火元素，多幢大廈同時以煙火照亮夜空。\n\n整個匯演歷時10分鐘，不少市民在尖沙咀海旁舉機紀錄這一刻。\n\n「幻彩詠香江」自2004年起上演，有逾43幢建築物參加。至於代替「幻彩詠香江」的其他光影項目，會在明年陸續推出。\n\n文化體育及旅遊局局長羅淑佩說：「今晚亦是一個重要的歷史時刻，陪伴著我們22年的『幻彩詠香江』即將上演最後一場的匯演，完成了它的歷史使命，多年來都向無數市民及旅客帶來了香港維港的天際線，璀璨夜色。今晚的匯演，我們特別加入了大廈頂樓的煙火效果，為這場經典的匯演，畫上圓滿句號。」",

          "body": "中新社深圳11月19日电 (记者 谢雁冰)11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话，强调亚太各方要携手搭建亚太共同体的“四梁八柱”。\n\n　　习近平指出，中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n\n　　一是强化经贸支柱。推动区域经贸协定对接，围绕亚太自贸区加强政策对话，提高各方参与高水平经贸安排的能力。\n\n　　二是升级联通支柱。巩固“硬联通”，完善基础设施网络；增强“软联通”，促进政策和监管协调；密切“心联通”，促进人文交流和民众相知相亲。\n\n　　三是打造创新支柱。加强数字基础设施建设，完善区域数据治理和协同合作，打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n\n　　四是夯实发展支柱。推动区域能源和粮食安全合作，深化跨境腐败治理，加大自然资源合理利用和保护，实现经济可持续增长。(完) 【编辑:叶攀】",

          "body": "中新社深圳11月19日电 (记者 谢雁冰)11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话。\n\n　　习近平指出，当前，世界百年变局加速演进，科技创新和产业创新方兴未艾。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　建设亚太共同体，要坚持和衷共济。浩瀚的太平洋承载千帆、滋养万物，造就了亚太地区兼收并蓄、和合共生的磅礴气象。亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，持续培育共同体意识。\n\n　　建设亚太共同体，要坚持开放融通。开放合作是亚太发展振兴的必由之路。要秉持开放的区域主义，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局。倡导自由开放的贸易和投资，为亚太经济增长开拓更广阔空间。\n\n　　建设亚太共同体，要坚持开拓创新。创新是引领发展的第一动力。要鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境。放大亚太经合组织孵化器作用，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。\n\n　　建设亚太共同体，要坚持包容发展。亚太经济体多样性突出，发展诉求各异。要因势利导推进合作，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。(完) 【编辑:叶攀】",

          "url": "https://www.stheadline.com/realtime-china/3638783/深圳APEC領導人峰會座位合照安排有玄機",
          "summary": "第33次亞太經合組織（APEC）領導人非正式會議在深圳召開，21個成員經濟體領導人及代表聚首深圳香蜜湖的國際交流中心。",
          "summary_short": "第33次亞太經合組織（APEC）領導人非正式會議在深圳召開，21個成員經濟體領導人及代表聚首深圳香蜜湖的國際交流中心。",

          "points": [

            "會議以桌面會形式召開，座位次序如何安排",
            "APEC峰會的座位安排，主要依照各成員經濟體的英文名稱字母順序排列"

          "section": "兩岸",

          "source": "stheadline",

          "size": 1,
          "keywords": [],
          "body": "第33次亞太經合組織（APEC）領導人非正式會議在深圳召開，21個成員經濟體領導人及代表聚首深圳香蜜湖的國際交流中心。會議以桌面會形式召開，座位次序如何安排？\n相關新聞：深圳APEC︱市民街頭歡呼迎特朗普車隊 隔空叫「請他吃豬腳飯」︱有片\nAPEC峰會的座位安排，主要依照各成員經濟體的英文名稱字母順序排列。\n按經濟體官方英文字母順序\nAPEC 採用「經濟體」作為參與單位，所有成員均按其官方英文名稱（例如 Australia、Canada、China、Hong Kong, China、Chinese Taipei 等）的字母順序依次入座。\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n年度的主辦方即東道主領袖擔任會議主席，負責主持會議，通常坐在主位或正中央。因此，今次深圳峰會，國家主席習近平坐在主位。\n東道主擔任會議主席\n前後任東道主位置也有特別安排，他們會坐在鄰近主位的旁邊，象徵會務的傳承與延續。下屆會議主辦方為越南，因此越南國家主席蘇林今次坐在習近平右手邊，而上屆會議主辦方南韓，總統李在明坐在蘇林旁邊。\n各經濟體成員會前大合照。路透社\n至於成員 「大合照」站位則相對有彈性，可加入層級與視覺對稱等考量。東道主領袖站在第一排正中央，前排通常優先安排各國元首（如總統、國家主席），後排則安排政府首腦（如總理、首相）。\n\n今次深圳峰會的大合照，站在習近平兩旁的是美俄總統特朗普和普京，以示大國關係。「特普」旁邊分別是南韓總統李在明及越南國家主席蘇林，因為他們是去年及明年會議的東道主。日本首相高市早苗安排在後排右二位置。香港行政長官李家超及中華台北代表施振榮分站後排兩側。",

          "body": "中新网11月19日电 据中国驻赞比亚使馆微信公众号消息，近日，16名中国公民在赞比亚穆钦加省因无证非法开采和加工黄金，污染当地河流，被赞有关安全和执法部门逮捕。赞矿业监管部门早前在发现有关情况后，已向涉事人员下达停业整顿令，但其无视禁令继续开采，最终酿成严重后果。\r\n\n　　根据有关法律规定，在赞从事包括黄金在内的矿物勘探、开采、浮选、加工和交易等活动，须依法在赞有关部门取得相应资质和许可。其中，赞政府对手工采矿和小规模采矿有严格主体限制，外国公民和外资企业不得擅自从事不符合规定的采矿活动。未经许可开展采金等有关矿业活动，可能面临罚款、监禁等法律处罚，相关设备及矿产品也可能被依法查扣。\n\n　　中国政府坚决反对我公民以任何形式参与非法采金行为。驻赞比亚使馆在此郑重提醒中国公民和机构，非法采金不仅触犯当地法律规定，更伴随绑架、暴力冲突等极高风险。切勿抱有侥幸心理，以身试法，给自身带来安全风险和财产损失，有关行为也将受到法律严惩。\n\n　　赞比亚报警电话：991\n\n　　外交部全球领事保护与服务应急热线(24小时)：\n\n　　+86-10-12308\n\n　　+86-10-65612308\n\n　　驻赞比亚使馆领事保护与协助电话：\n\n　　+260-977790322 【编辑:惠小东】",

          "body": "國家主席習近平在亞太經合組織第三十三次領導人非正式會議上發表講話，提出，30多年來，亞太地區面貌日新月異，創造了經濟快速發展的「亞太奇蹟」。他倡議建設亞太共同體中，要四個要堅持，包括要和衷共濟、開放融通、開拓創新、包容發展，他亦提出攜手搭建亞太共同體「四樑八柱」，包括：強化經貿支柱、升級聯通支柱、打造創新支柱、夯實發展支柱。\n相關新聞：深圳APEC︱習近平：中方提供2000萬美元資助開展亞太經合組織務實合作︱不斷更新\n講話全文內容：\n各位同事：\n很高興同大家相聚在美麗的深圳，共謀亞太合作大計。\n30多年前，亞太經合組織應運而生，開啟了建設亞太共同體的壯闊歷程。30多年來，亞太地區面貌日新月異，創造了經濟快速發展的「亞太奇蹟」。\n當前，世界百年變局加速演進，科技創新和產業創新方興未艾。面對新的機遇和挑戰，亞太合作必須適應新形勢、邁出新步伐、開創新局面，推動建設和衷共濟、開放融通、開拓創新、包容發展的亞太共同體。\n相關新聞：深圳APEC│領導人非正式會議座位安排有玄機\n亞太成員同在一條船上\n建設亞太共同體，要堅持和衷共濟。浩瀚的太平洋承載千帆、滋養萬物，造就了亞太地區兼收並蓄、和合共生的磅礡氣像。亞太大家庭的成員同在一條船上，要經受住太平洋的風浪，就應當勠力同心、守望相助，拉緊共同利益紐帶，攜手應對困難和挑戰，持續培育共同體意識。\n建設亞太共同體，要堅持開放融通。開放合作是亞太發展振興的必由之路。要秉持開放的區域主義，穩步推進經濟一體化進程，構建開放而不排他、融合而不分割的合作格局。倡導自由開放的貿易和投資，打通要素流動堵點，暢通經濟循環經脈，為亞太經濟增長開拓更廣闊空間。\n建設亞太共同體，要堅持開拓創新。創新是引領發展的第一動力。要鼓勵科技交流合作，促進創新成果轉化，營造開放、公平、公正、非歧視的合作環境。發揚進取精神，放大亞太經合組織孵化器作用，推動機制理念創新和結構性改革，不斷釋放亞太經濟的活力和潛力。\n相關新聞：深圳APEC｜中美俄元首同框象徵意義重大 惟引發美盟友不安｜拆局\n釋放亞太經濟活力潛力\n建設亞太共同體，要堅持包容發展。亞太經濟體多樣性突出，發展訴求各異。要因勢利導推進合作，讓發展成果普惠共享，增加民眾獲得感，照顧各方舒適度，為實現亞太共同體目標積累有利條件。\n各位同事！\n中國是亞太經濟合作的倡導者、推動者、先行者。中方願同各方一道，集思廣益、匯聚合力，攜手搭建亞太共同體的「四樑八柱」。\n第一，強化經貿支柱。亞太自由貿易區是亞太經合組織成員的共同願景，要穩步向前推進，打造更高水平的開放格局。要推動區域經貿協定對接，提升貿易投資便利化、數字化水平，減少貿易投資壁壘。圍繞亞太自貿區加強政策對話，開展經驗交流和技術合作，提高各方參與高水平經貿安排的能力。\n減少貿易投資壁壘\n第二，升級聯通支柱。互聯互通是區域經濟一體化的紐帶。2014年，我們共同制定亞太經合組織互聯互通藍圖。今天，區域互聯互通迎來新的機遇。要鞏固「硬聯通」，完善基礎設施網絡，推動智慧海關、智慧交通建設。增強“軟聯通”，促進政策和監管協調，深化跨境支付合作，維護產業鏈供應鏈穩定暢通。密切“心聯通”，便利商旅和人員往來，促進人文交流和民眾相知相親。\n第三，打造創新支柱。數字經濟和人工智能是創新增長的引擎。要加強數字基礎設施建設，完善區域數據治理和協同合作，實現高效、便捷、安全的跨境數據流動。打造開放創新生態，促進人工智能廣泛應用，推動產業轉型升級、向新發展。\n促進人工智能廣泛應用\n第四，夯實發展支柱。面對層出不窮的全球性挑戰，要加強能力建設，推動區域能源和糧食安全合作，深化跨境腐敗治理。推動資源、環境、人口協調發展，加大自然資源合理利用和保護，拓展綠色低碳合作，實現經濟可持續增長。支持改善民生和投資於人，實施健康老齡化行動，促進就業和職業技能開發，支持婦女經濟賦權和青年人才交流，釋放亞太人才活力。\n亞太是中國安身立命之所。中方將始終如一支持亞太合作。我宣布，中方將提供2000萬美元，資助開展亞太經合組織務實合作。中方將在深圳設立亞太共同體研究中心，開展政策研究和交流，提供智力支撐。中方將立足亞太合作，在數字技術、數據跨境流動、清潔能源、中小企業發展等領域設立合作機構，助力亞太創新、綠色增長。\n各位同事！\n深圳又名「鵬城」。期待在我們共同努力下，亞太合作像大鵬一樣展翅高飛、鵬程萬里。\n謝謝大家。",

          "body": "2025年12月海南自贸港正式启动全岛封关运作以来，政策红利持续释放，市场活力加速迸发。位于海南琼海的博鳌乐城国际医疗旅游先行区(简称“乐城先行区”)是中国大陆唯一的“医疗特区”，享有“特许医疗、特许研究、特许经营、特许国际交流”等政策，已成为国际创新药械进入中国大陆市场的最主要通道。\n\n11月18日，来自17个国家的20家海外华文媒体走进乐城先行区，探访颖奕国际医疗中心，在此了解台资企业依托海南自贸港政策的发展故事。\n\n颖奕国际医疗中心作为一家全台资三级综合医疗机构，自2021年正式运营以来，依托乐城先行区特许政策叠加海南自贸港红利，持续打通两岸医疗资源、对接全球前沿技术，成为台企看好海南、深耕健康产业的生动缩影。\n\n颖奕国际医疗中心院长韩海玲表示，封关之后，无论是海内外前来就诊的患者群体，还是企业自身发展，都能感受到明显变化。不少境外客户主动多方了解、持续关注海南自贸港相关政策；依托自贸港人才引进政策，中心顺利引进多名境外顶尖医师，同步引入国际先进医疗技术，“去年我们国际医疗板块接诊约157名患者，今年截至目前，接诊量已经实现两至三倍增长”。(林士杰 陈英清 符宇群)",

          "body": "11月18日，来自17个国家的20家海外华文媒体走进海南博鳌沙美村，探访百年侨村蝶变路。\n\n沙美村是一座拥有200多年历史的侨村，历经退塘还林还湿、修复红树林湿地、保护性修复70余间南洋特色侨居，从昔日传统渔村蝶变为中国美丽休闲乡村和博鳌亚洲论坛对外交流的“国际会客厅”。\n\n沙美村党支部书记、村委会主任冯锦锋介绍，过去村庄交通闭塞、垃圾环村，发展受限。2017年，沙美村启动美丽乡村建设，依托当地特色资源发展民宿、农家乐等乡村旅游产业，带动村民增收致富。如今村庄面貌焕然一新，如同花园，吸引各地游客前来。\n\n冯锦锋说，美丽乡村建设前，该村人均收入15000元，目前人均收入提升至25000元。\n\n荷兰《中荷商报》特派记者姚卫民参访后表示，美丽乡村建设让沙美村焕然一新，也让村民生活很甜；加拿大搜罗传媒副总经理唐明涛则留意到村内风貌融合之美，古意建筑与现代洋楼并存，直观体现村庄持续向前发展的活力。(陈英清 林士杰)",

          "body": "歡迎收看《世界觀》。\n\n受厄爾尼諾現象引發的乾旱影響，連接太平洋和大西洋的巴拿馬運河，水流量大減，運河管理局宣布，下周四開始「限航」，會對國際航運帶來甚麼衝擊？\n\n米拉弗洛雷斯船閘，位於巴拿馬運河太平洋一側，亦是一個旅遊景點。作為連接大西洋和太平洋的重要航運樞紐，巴拿馬運河承載著全球約百分之5的海運貿易量，及約4成美國集裝箱貨運業務，特別受大型零售商、能源企業歡迎。正常平均每日有36至38艘船使用巴拿馬運河，並要按船的種類和貨物等支付通行費。\n\n運河採用類似「樓梯」的通行方式，中間一段加通湖，水平面比兩側即大西洋和太平洋高20多米。每當貨船通行，都要經過一級級船閘來升降船體。由低處升到高處，要將加通湖的湖水引入船閘，托起船體，升至高一級船閘，並按相同操作，逐步提升至加通湖的水平面。下降的話，同樣將湖水流入船閘，通過逐級排水將船體降至水平面。\n\n如果沒有加通湖，船閘閘室會失去水源，整條巴拿馬運河會變得乾涸。貨船每完成一次通行，會消耗加通湖約19萬立方米淡水，這些水除了是運河通行不可或缺，還是當地居民的飲用水源。\n\n但中美洲正面臨厄爾尼諾現象，引發的嚴重乾旱。巴拿馬政府日前宣布，全國進入緊急狀態，以應對乾旱等災害風險，以及對巴拿馬運河航運、農業和能源供應等，造成的潛在影響。當地氣象部門就預測，厄爾尼諾現象會在今年10月至明年3月期間進一步增強。\n\n巴拿馬運河管理局指出，運河流域的降雨遠低於預期，管理局公布由9月3日開始，「新巴拿馬型船閘」即新船閘，每日可用通行名額將調整為9個。「巴拿馬型船閘」即舊船閘，調整為25個，兩類船閘每日通行總名額合共34個。到9月15日起，舊船閘每日通行名額進一步減至23個，令運河每日通行總名額降至32個。\n\n至於現時容許船舶提前預約，特定日期的運河通行名額安排，管理局表明如有必要，不排除預約系統全部或局部暫停。\n\n巴拿馬運河管理局局長巴斯克斯稱：「我們現有的水，希望有的水，我們每日都監測著，是盡力保存和有效使用的水，這樣才能為顧客提供最佳服務。」\n\n英國廣播公司引述國際航運公會的數據顯示，美以伊戰事爆發後，霍爾木茲海峽航運嚴重受阻，部分亞洲買家轉向美國墨西哥灣沿岸的供應商，採購原油或成品油，不少都經巴拿馬運河，往返大西洋和太平洋，令運河通行時段的需求增加。數據指在戰事爆發後五星期內，通過巴拿馬運河的船隻數量，按年急升一成六。\n\n英國廣播公司的分析認為，如果巴拿馬運河的水流量進一步下降，運河通行量必定再次受限，對巴拿馬的民生、經濟，以至全球貿易造成更大壓力。\n\n我們下星期繼續《世界觀》，觀世界。\n\n點擊觀看其他集數",

          "body": "歡迎收看《世界觀》。\n\n國家主席習近平日前到印度出席金磚國家領導人峰會，是習近平時隔七年再踏足當地，國際社會最關心的似乎並非峰會會面成果，反而更著眼於美國和印度近年關係起伏的前提下，印方是否有意和中國重歸於好。而習近平應邀親訪當地，又能否視為中方向印方示好之舉？\n\n2026年金磚國家領導人峰會，過去周日在印度新德里落幕，一如以往都有大合照環節，輪值主席國印度，總理莫迪站在正中間，左右兩邊分別是俄羅斯總統普京，以及中國國家主席習近平，是繼去年天津上海合作組織峰會後，三人再度碰頭。\n\n新華社報道，中印領導人在今次峰會期間會晤約四十分鐘，習近平稱，近兩年兩國關係從「再出發」到「再提升」，機制交往恢復，貿易再創新高，這一局面來之不易，值得珍惜。\n\n印方聲明則表示，分歧不應演變成爭端，邊境和平安寧是發展關係的必要基礎。\n\n中印關係2020年6月，因為雙方官兵在加勒萬河谷爆發嚴重肢體衝突，並造成人員傷亡後，跌至歷年冰點。四年半後中印雙方達成邊界巡邏協議，雙方軍隊回復至衝突爆發前的狀態。\n\n習近平和莫迪隨後，在俄羅斯喀山舉行的2024年金磚國家領導人峰會上，舉行雙邊會晤，中印關係隨之而「解凍」。今年峰會後，兩國領導人再次同框，還要手牽著手，不禁令外界猜測，中印從此以後是否正式「大和解」。\n\n巴西國際法與中國問題專家高文勇說：「金磚國家不單可以是中國和印度會面的平台，它亦可成為一個讓雙方，學習如何透過合作管控分歧的平台，這將向所有國家發出強而有力的信息，實現多極化需要有共存的能力，即使意見分歧，亦要合作和建立共同利益。」\n\n外長王毅在中印領導人會晤後表示，期待印方同中方相向而行，推動兩國關係向前走、不停滯、不倒退，把邊界問題置於雙邊關係適當位置，讓對話合作成為主流，共同為地區乃至世界和平與繁榮，作出應有貢獻。\n\n有意見認為，這只是中印關係持續改善的進程，兩國經歷數十年最大低谷後，還有很多工作要做，主因是美國對中印往來的影響力仍大，印度一旦同美國關係稍有改變，對於跟中國改善關係的意欲又會下降。\n\n南京大學國際關係學院院長朱鋒亦指，印度經濟存在結構性局限，對中國市場及供應鏈的依賴難以替代，但莫迪政府受印度教民族主義力量所影響，試圖借中美競爭博取戰略紅利，對華採取既防又打、既談又拉的姿態，相信兩國關係短期難有重大突破。\n\n美國總統特朗普近年對全球各國揮舞關稅大棒，令美印關係出現裂縫，有輿論認為中方正在把握機會，將印度同美國的關係拉遠一些。而對印方來說，莫迪同習近平公開握手，並不代表「親中」，可能是要向美方傳遞「我們還能有其他選擇」的信息。\n\n根據美方說法，「習特會」下周會在美國華盛頓舉行，外界猜測習近平選擇此時與莫迪及普京公開碰頭，可能是想向美國傳遞一些信息，為「習特會」增添談判籌碼。\n\n我們明天繼續《世界觀》，觀世界。\n\n點擊觀看其他集數",

          "summary": "國家主席習近平今日將於深圳，與俄羅斯總統普京及美國總統特朗普舉行中俄美元首會晤，這將是三國元首歷史上首次面對面會談。內地時事評論員司馬平邦接受俄羅斯衛星通訊社訪問時表示，本屆亞太經合組織（APEC）峰會的參會規模與覆蓋面均創下新紀錄，其中美國工商界參與度更居外方經濟體之首。",

          "body": "第33屆亞太經合組織（APEC）領導人非正式會議將於11月18日至19日在廣東深圳舉行。\n\n深圳市南山區後海片區\n\n2026年10月12日，旅客經過皇崗口岸出境大廳「皇崗之眼」\n\n深圳前海特區館廣場上的「鵬翔碧浪」主題景觀\n\n回顧過去40多年間，深圳從荒灘崛起為開放高地，小漁村蝶變為現代化國際都市。如今APEC第33次領導人非正式會議將在深圳舉行，世界的目光再一次匯聚於此。為什麼是深圳，答案或許藏在這些歷史瞬間裡。\n\n上圖為20世紀80年代的深圳蛇口港；下圖為2024年9月18日拍攝的深圳蛇口港\n\n20世紀80年代初拍攝的深圳蛇口合成材料廠車間一角\n\n20世紀80年代拍攝的深圳國際貿易中心大廈\n\n1979年，招商局在深圳創辦蛇口工業區，這是中國第一個對外開放的工業園區，為一年之後深圳經濟特區的創立起了探路作用。1987年12月1日，深圳市政府舉行首次土地使用權公開拍賣，一槌定音後，土地有償出讓漸漸成為常態，為特區城市建設籌集大量資金。20世紀80年代，設計高度160.5米的深圳國際貿易中心大廈以三天一層樓的建設速度聞名全國，成為特區地標。\n\n20世紀90年代的深圳證券交易所\n\n20世紀90年代，工人在深圳蛇口工業區一家生產計算機電腦磁頭的中外合資企業的生產車間\n\n20世紀90年代，兩位大學畢業後來深圳工作的青年人\n\n1990年12月1日，深交所率先開始集中交易，中國資本市場邁入快速發展階段。從務工者、大學畢業生到華強北博物館講述的創業故事，再到深中通道，深圳的成長是中國改革開放的生動縮影，也是亞太開放融通的生動注腳。\n\n2010年8月，前海深港現代服務業合作區正式成立，定位依托香港、服務內地、面向世界，成為特區中的特區。\n\n深圳前海深港現代服務業合作區一角\n\n2021年1月7日，觀眾穿過華強北博物館時光廊道\n\n2025年9月14日拍攝的沐浴在晨曦之中的深中通道，遠處是深圳\n\n開放門戶聯通世界\n\n作為聯通世界的重要門戶，深圳把開放的承諾化作互利共贏的堅實步履。國際人才交流大會設置外籍人才招聘會，外籍求職者與用人單位交流。\n\n2026年5月1日凌晨，對53個非洲建交國全面實施零關稅舉措生效後的全國首票貨物，經深圳灣口岸貨檢通道入境。蓮塘口岸夜景、文博會觀展、鹽田港貨輪、華強北外國客戶挑選手機，均展現深圳對外連接的活力。\n\n2019年4月14日，在第十七屆中國國際人才交流大會設置的外籍人才招聘會上，外籍求職者（右）與用人單位工作人員交流\n\n2026年5月1日凌晨，對53個非洲建交國全面實施零關稅舉措生效後的全國首票貨物，經深圳灣口岸貨檢通道入境\n\n2024年5月24日，觀眾在第二十屆中國（深圳）國際文化產業博覽交易會上觀展\n\n2026年10月14日，在深圳華強北一家手機零售店，外國客戶挑選手機\n\n創新驅動亞太繁榮\n\n科技園裡的智慧工廠、實驗室裡的協同攻關、生產線上的智能製造，創新成為深圳鮮明的標識，也是亞太繁榮的動力源。\n\n華為在深圳舉行秋季全場景新品發布會，發布最新創新技術產品。富士康龍華科技園數控機床精密加工智造熄燈工廠、美團送餐無人機穿行高樓大廈、坪山區環衛機器人在城中村清掃、高交會禮儀機器人到養老護理院人形機器人互動、優必選商用版人形機器人Walker C、全球機器人開發選品選型服務中心靈巧手、京東物流無人車行駛坪山區道路，顯示深圳智能製造與機器人應用不斷拓展。\n\n2023年9月25日，華為技術有限公司在深圳舉行秋季全場景新品發布會，發布最新創新技術產品\n\n深圳富士康龍華科技園數控機床精密加工智造「熄燈工廠」內景\n\n在深圳市龍崗區，一架美團送餐無人機穿行在高樓大廈間\n\n2025年3月19日，在深圳市坪山區石井街道，環衛機器人在城中村進行清掃工作\n\n上圖為1999年10月6日，首屆中國國際高新技術成果交易會開館儀式在深圳舉行，觀眾與深圳華強集團研製的禮儀機器人握手；下圖為2025年3月3日，在深圳市養老護理院，一名老人與人形機器人互動\n\n在深圳優必選科技展廳內，商用版人形機器人Walker C向觀眾揮手致意\n\n2026年7月4日，參觀者在深圳全球機器人開發選品選型服務中心體驗靈巧手\n\n文明交流包容共融\n\n亞太繁榮發展的歷程表明，唯有合作才能發展。深圳以包容開放的城市品格，搭建起文明交流的橋樑。不同地域、不同文化的人們在這裡相遇相知、並肩奮鬥。\n\n位於深圳市的前海深港青年夢工廠，香港創業青年們一起交流各自的創業項目\n\n外國遊客在大疆歡樂海岸旗艦店選購手持攝影設備\n\n外國遊客在深圳人才公園體驗美團無人機送外賣\n\n來自牙買加的遊客在龍崗全球首家機器人6S店參與互動遊戲\n\n2026年APEC林業部長級會議與會代表在深圳龍崗機器人街區觀看機器人表演\n\n生態底色低碳發展\n\n快速發展的同時，深圳始終堅守生態底色。紅樹林候鳥翩躚，濱海綠道綿延成廊，低碳理念早已融入城市肌理，展現深圳生態與城市發展並行。深圳市龍崗區近年重點打造綠色發展與智慧創新的道路，其中低碳產業成為該區「綠美智變」的動力引擎。\n\n深圳紅樹林濕地與城市的高樓大廈形成人與自然和諧相處的景象\n\n人們走在深圳市龍崗區「國際低碳城」的園區裡\n\n前海深港現代服務業合作區\n\n鹽田海邊騎行綠道\n\n深圳灣公園騎行\n\n園博園文萊花園\n\n蓮花山山頂俯瞰城市中軸線",

          "body": "【美中期選舉候選人撞名風波】\n\n美國中期選舉下周二舉行在阿拉斯加州，有同名同姓候選人「打對台」，角逐參議員席位。美國總統特朗普稱民主黨阿拉斯加州參議員候選人佩爾托，拉刻意找來一位跟共和黨參議員候選人相同姓名的人參選，目的是混淆視聽，他將事件形容為欺詐。\n\n【土耳其石柱倒塌釀三死】\n\n土耳其旅遊勝地卡帕多基亞，發生石柱倒塌事故，三人死亡，五人受傷。\n\n【美將領據報洩露伊朗戰事機密被解僱】\n\n美國國防部長赫格塞思解僱一名陸軍中將，據報他涉嫌向傳媒洩露機密情報，內容涉及伊朗戰事。\n\n【西班牙高鐵相撞｜習近平致慰問電】\n\n西班牙高鐵列車追撞事故，增至最少69人死亡，數十人受傷，國家主席習近平，向西班牙國王費利佩六世致慰問電。西班牙傳媒取得控制中心錄音，顯示是人為失誤，釀成慘劇。\n\n【白宮經濟顧問不排除10月加息可能性】\n\n美國經濟上季加快增長，增幅是一年來最大，並且高過市場預期，而通脹於9月升溫。白宮經濟顧問哈塞特暗示，一旦通脹於10月仍然高企，他預料聯邦儲備局將會加息。\n\n【中國實驗室被禁止測試在美使用電子產品】\n\n美國聯邦通訊委員會投票決定禁止所有中國實驗室測試在美國使用的電子產品。",

          "summary": "美國民主黨眾議院領袖傑弗里斯，獲黨內提名為下任眾議院議長候選人，一旦當選即成為美國首位非裔眾議院議長。美國眾議院民主黨黨團，當地周三舉行閉門表決，以251票對11票，提名來自紐約州，56歲的傑弗里斯，明年一月起出任眾議院議長。",

          "body": "多國政府回應美國政壇變天。英國首相貝安德指，民主黨控制美國國會凸顯結束中東衝突的重要性，伊朗就稱不相信美方會放棄敵意。俄羅斯希望美國總統特朗普繼續推動和平，又指正磋商俄中美三國元首本月在深圳會晤事宜。\n\n在伊朗首都德黑蘭，有數千人在周三集會，紀念1979年有當地學生佔領美國大使館事件，亦有示威者高叫反美口號，抗議美軍打擊伊朗。美聯社報道，有受訪示威者認為美國政壇變天，共和黨在中期選舉慘敗，跟總統特朗普施政失誤有關。另有示威者更稱特朗普失敗，是伊朗人民的功勞，而不是美國民主黨。\n\n伊斯蘭議會副議長尼克扎德表示，特朗普試圖在社交網站聲稱勝利，但在國內政壇受重挫，可見美方對德黑蘭施壓已告失敗。伊朗最高領袖穆傑塔巴，指必須推動國家全面發展，形成遏制外部侵略的威懾能力。他又稱，若果有人以為美國中期選舉之後美方就會改變霸權行為，這種想法是大錯特錯。穆傑塔巴強調，若果美國繼續侵略，伊朗就會加強回應。\n\n英國首相貝安德認為民主黨控制美國國會兩院，凸顯結束中東衝突的重要性，有利遏制能源價格上升。\n\n英國首相貝安德說︰「既然(美國)總統特朗普接受選舉結果，我認為全球有機會團結起來，聚焦討論影響大眾的生活成本問題。我無法減輕民眾生活水平壓力，除非解決中東衝突。」\n\n德國外長瓦德富爾表示，德美兩國會繼續保持合作，雙方尋求共識是至關重要。他又認為美國民主、共和兩黨都有烏克蘭的支持者，且明白到俄羅斯不僅威脅歐洲安全自由，連美國亦受威脅，相信美國國會今後會積極討論如何援助烏克蘭。\n\n俄羅斯克里姆林宮就稱，有關中期選舉純屬美國內政，俄方希望特朗普繼續推動和平。對於中、美、俄三國元首可能在深圳本月舉行亞太經合組織會議期間會晤，俄方就稱仍討論相關議程。\n\n南非周三舉行地方選舉，被視為衡量執政黨能力的指標。總統拉馬福薩稱，美國人民透過選票表達心聲，相信中期選舉結果將開啟國際關係的新時代。\n\n日本內閣官房長官木原稔指強健的日美同盟，是日本外交與安全政策的基石，對維護日本國家利益，以及國際和平穩定都是不可或缺。\n\n有份就美國中期選舉郵寄投票的教宗良十四世在周三發表講話，他沒有直接談及美國政壇，而是強調行使政治權力，應當著眼於謀求共同福祉。",

          "title": "短时免费、夜间封顶 上海停车迎来哪些新变化？",
          "url": "https://www.chinanews.com.cn/sh/2026/11-19/10734537.shtml",
          "summary": "上海市日前发布了道路停车收费新政，从昨天(18日)起正式施行：短时停车免费，夜间收费封顶，符合条件路段还可按月停放。",
          "summary_short": "上海市日前发布了道路停车收费新政，从昨天(18日)起正式施行：短时停车免费，夜间收费封顶，符合条件路段还可按月停放。",
          "digest": "上海市日前发布了道路停车收费新政，从昨天(18日)起正式施行：短时停车免费…",
          "points": [
            "上海市日前发布了道路停车收费新政，从昨天(18日)起正式施行：短时停车免费，夜间收费封顶…",
            "面对上海中心城区停车泊位紧张的现实，市民在停车方面又会迎来哪些改变",
            "新增短时免费停放，是本次道路停车收费政策调整的最大亮点"
          ],
          "section": "民生",
          "category": "",
          "source": "chinanews_society",
          "source_display": "中新網 社會",
          "published_at": "2026-11-19T11:01:05+08:00",
          "size": 1,
          "keywords": [],
          "body": "上海市日前发布了道路停车收费新政，从昨天(18日)起正式施行：短时停车免费，夜间收费封顶，符合条件路段还可按月停放。面对上海中心城区停车泊位紧张的现实，市民在停车方面又会迎来哪些改变？\n\n　　新增短时免费停放，是本次道路停车收费政策调整的最大亮点。在上海静安区，88个道路停车场的全新收费公示牌本周一已提前安装到位。公示牌上清晰地显示：每辆车工作日每天可享受2次15分钟免费停放，节假日每天可享受3次。\n\n　　近年来，“买个包子2元，停车10元”等现象曾多次引发热议。此次调整之后，市民到沿街商铺买东西、接送人员、临时办事，单次停放时长不超过15分钟，在限定次数内将不再产生停车费用，引导车辆快停快走，提高道路停车泊位周转效率。\n\n　　上海市民 蒋先生：如果只是临时去买东西停放15分钟，我认为是非常人性化的，也符合大众的临时需求。\r\n\n　　不过，短时免费停放并非没有限制。一方面，免费次数按照车辆计算，工作日和节假日均有相应的次数限制。另一方面，一旦单次停放超过15分钟，将从车辆入场停放的起始时间开始计费，也就是将前15分钟原本的免费时间一并纳入计费时间。蒋先生也建议，可以通过价格杠杆机制为市民办事停车提供便利。\n\n　　上海市民 蒋先生：在前一个小时可能稍微少一点，到两个小时可能稍微高一点，到三个小时再高一点，如果是这种阶梯政策，对于经常要过来办事、需要临时停车的人来说是非常有助益的。\n\n　　此次上海调整道路停车政策的另一项重要变化，是缩小计费单位。截至2026年10月底，上海共有收费道路停车泊位4.96万个。新规实施后，智慧道路停车场按时计费单位统一调整为15分钟，人工收费道路停车场按时计费单位则调整为30分钟。\n\n　　上海市城乡建设和交通发展研究院高级工程师施文俊表示，缩短计费单位意味着停车费用能够更贴近实际停放时长，停车时间较短的车主可以减少额外支出。\n\n　　上海市城乡建设和交通发展研究院高级工程师 施文俊：智慧道路停车场把计费的周期统一调整为15分钟，这样使计费间隔更加精细，更好地服务于市民。针对原来区域差别化不够显著的问题，把原来的收费区域划分从三类区域变为四类区域，重点是把原来内环以外地区拆分为两类区域，通过更加精细化的区域分类更好地服务于市民。\n\n　　此外，夜间停车将由按次收费改为按时计费、费用封顶；具备条件的居住小区周边路段，可向居民提供按月停放服务。施文俊表示，此次调整并非简单地涨价或者降价，而是优化收费结构，通过价格引导长时间停放的车辆，转向配建停车场以及路外公共停车场。\n\n　　施文俊：通过合理的结构优化，能够满足一些必要的短时停的需求，但是长时间停车还是鼓励停到路外场库去。\n\n　　监制丨徐菁\n\n　　记者丨王一喆 【编辑:王琴】",

          "body": "过去很长一段时间，养老床位在增加，养老机构在扩张，“到了晚年有没有一张养老院的床”似乎不是一个需要认真考虑的问题。但《2025年度国家老龄事业发展公报》(以下简称《公报》)给出的数字，让这个问题又浮出水面。\r\n\n　　截至2025年末，全国养老床位合计767.9万张，自2020年达823.8万张的峰值后连续下行；每千名老年人口拥有床位约23.7张，创下近10年新低。与此同时，60周岁及以上老年人口已达32338万人，占总人口的23.0%。\n\n　　需求在涨，床位在减。是养老院“办不下去”了，还是老年人“不愿意住”了？一个普通家庭究竟靠什么照护老人？\n\n　　机构从扩张转向收缩\n\n　　老年人口在急速扩张，养老机构却从扩张转入了收缩。据统计，养老机构数量在2023年达到顶峰后连续两年减少；养老床位数自2020年见顶后整体回落。\n\n　　一直以来，养老机构“高空置率”和“一床难求”的情况同时存在。中国人民大学教授陆杰华介绍，我国养老机构床位利用率长期在低位徘徊，部分区域床位空置率甚至超过60%。而在记者走访的北京市多家中高端养老机构中，床位几乎均处于满员状态，少量空余床位也多是朝向或房型不佳。“普通床位供给过剩，无效床位被市场淘汰，反映出当前养老服务供给正从规模扩张转向提质增效。”陆杰华说。\n\n　　复旦大学老龄研究院教授、AI向善与数智养老研究中心主任申琦认为，老年人口增长，并不意味着入住养老院的人数会同比例增长。入住养老院涉及长期居住、费用支出和家庭照护安排，老人和子女通常都比较慎重。京东消费及产业发展研究院发布的《2026家庭养老生活全景报告》(以下简称《报告》)也印证了这一判断：居家养老仍是中国家庭的主流养老方式，64.4%的老人优先选择居家养老。\n\n　　“过去一些地方把注意力放在建了多少养老院、增加了多少张床位上，但对老年人究竟需要什么样的服务考虑不够充分。”申琦分析，或是专业护理能力不足，或是收费超出当地普通家庭的承受能力，导致“想住的人进不去，有空床的没人来”。\n\n　　监管趋严是床位“出清”的另一推手。近年来，针对养老机构的消防安全、建筑规范、合规运营和资金监管的政策接连出台，一些规模较小、入住率低、经营压力大的机构难以为继。申琦提醒，床位缩减既是对部分低效供给的正常市场调整，也反映出养老服务需求与实际供给之间仍存在错位，机构整合甚至退出市场并不奇怪。不宜把床位下降简单理解为“好事”或“坏事”，但如果一些承担普惠照护功能的机构因为经营压力而退出，特别是在养老资源本就不足的县域和农村地区，那就可能影响基本养老保障，需要密切关注。\n\n　　护理型床位逆势增长\n\n　　床位结构的变化，比总量减少更值得关注。《公报》显示，截至2025年底，我国养老机构的护理型床位占比已达69.9%，比2020年提升了21.9个百分点。申琦推算，床位总量净减少的部分主要来自普通床位，护理型床位数量有所增加。\n\n　　增加的动力来自迫切的现实需要。数据显示，我国目前约有3500万失能老年人，占全体老年人的11.6%；预计到2050年，这一数字将达到5800万人左右。与此同时，我国60岁及以上人群中，认知障碍患者达5300多万人。申琦认为，床位数量不再是养老机构竞争力的核心，能否提供及时专业的照护服务将成为衡量其品质的关键。\n\n　　数据支撑了这一判断。截至2024年3月，北京市养老机构收住的4.5万名老年人中，80岁以上及不能完全自理的老年人占比为91.57%。护理型养老机构的平均收费虽高于综合性机构，但入住率也更高。部分养老机构已在有意识地提高护理型床位比例，有的还为认知障碍老人设置专门床位。北京椿萱茂康养服务有限公司副总经理毕晓娜告诉记者，失智照护需要建立在专业化、体系化的服务能力之上。据介绍，如果按普通养老院的逻辑运营，椿萱茂青塔老年公寓即便住满也很难盈利。4年前，项目团队把方向转向失智照护，运营逐步好转。“这就是专业的价值。”毕晓娜表示，真正让床位产生价值的，是叠加在床位之上的评估能力、干预方案、照护团队和持续跟踪的体系。\n\n　　政策端已经设置硬指标。中办、国办明确提出“新建养老机构护理型床位占比原则上不低于80%”；《民政事业发展“十五五”规划》进一步定下目标：到2030年，全国养老机构护理型床位占比提升至73%。在地方层面，护理型床位占比已被纳入地方政府考核的约束性指标，上海、广东、福建等地还定下更高的地方目标。\n\n　　“这反映出顶层设计对失能、半失能人群照护刚需的制度性回应。”陆杰华表示，一个床位的有效运转，需要配备合格的护理员以及医疗支持和管理体系，“过去评价养老服务体系习惯看总量，现在标尺变了，不是看有多少张床，而是看这些床能不能接住最需要被照护的那部分人”。\n\n　　养老院不是唯一出路\n\n　　在公众讨论中，床位减少常被等同于“养老院更难进了”，部分人担心未来“一床难求”现象会更加突出。对此，陆杰华认为，要分情况理解：“对于照护质量高、竞争力强的养老机构，其床位势必会更加抢手，至于普通养老机构，短期内仍处于供需调整期。随着市场上无效干扰选项的减少，老年家庭的选择路径将更加清晰。”\n\n　　申琦则提供了另外一个视角。她认为，对大多数普通家庭而言，真正的问题不是“能不能住进养老院”，而是“需不需要住”。“一个85岁、失能失智、需要全天候照护的老人，和一个65岁、身体健康、生活能够自理的老人，对养老服务的需求完全不同。”申琦说，对于失能老人家庭，专业照护能否及时接入，是决定生活质量的关键；而对于那些生活尚能自理的老人，一张养老院的床未必是晚年生活的最优解，社区助餐、日间照料、健康管理和上门服务可能比住进养老院更有吸引力，而这部分人群恰恰是老年人口中占比最大的群体。\n\n　　《报告》显示，当前，老年人的养老观念正从传统“养儿防老”转向“独立养老”，45.2%的受访老人希望留在熟悉的家中，守住生活自主权，由社区和上门服务“搭把手”，这一比例高于依赖子女照料的35.0%。\n\n　　一个普通家庭的养老规划，正在从“一张床位”转向“一张网络”。家庭层面，“十四五”期间，累计建设家庭养老床位57万张，提供居家养老上门服务3000万人次，224万户特殊困难老年人家庭完成适老化改造，机构的专业照护正以“家庭养老床位”的形式延伸进老人家门。社区层面，2025年增设养老等各类社区服务设施4300余个，各类社区嵌入式养老服务机构提供短托、康复、健康管理等就近服务；截至2025年末，全国老年助餐点达8万个，每天超过300万老年人就餐。到“十五五”时期末，全国村和社区一级的养老服务设施覆盖率将达到70%。\n\n　　支付端的制度保障也在跟进。长期护理保险制度试点参保人数超3.2亿人，基金累计支出1142亿元，为超过460万失能人员提供护理服务。“十五五”期间，这项制度将从试点转向全面建制。\n\n　　“老年人不必因床位减少而恐慌，更不必盲目认为不进养老院就没有出路。”陆杰华建议，老年人要做好自身健康管理，尽量把能够自理的时间拉长。自理阶段善用社区和居家服务，失能阶段及时对接专业照护资源，同时把长期护理保险、普惠养老补贴等制度工具纳入家庭账本。\n\n　　“当一个老人真正需要照护的时候，能不能找到合适的地方、有没有人照顾他、他的家庭能不能承担这笔费用，这3个问题的答案，比床位总数的涨跌更能说明养老服务的成色。”申琦说。\n\n　　本报记者 康琼艳 【编辑:王琴】",

          "body": "近期，不少高校学生反映，同一篇文稿在某平台进行AIGC检测，前后结果差异悬殊。平台算法升级后，大量纯人工撰写的内容、经典篇目甚至作者署名、项目名称都被误判为AI生成。明明检测报告页面明确标注结果“仅供参考”，平台却依旧按2元/千字符的标准向学生收取检测费用。为达到学校审核要求，学生反复提交送检，催生出“AI写、AI测、AI降重”的畸形闭环，一篇毕业论文反复检测累计花费可达上千元。\r\n\n　　一份平台自身都标注“仅供参考”的概率指标，就这样成了毕业路上绕不开的硬门槛。根源在于不少高校将AI生成率纳入论文审核硬性要求，把本属于辅助的参考值异化为硬性要求，学生别无选择，只能被动付费闯关。\n\n　　更值得警惕的是，不透明的算法黑箱正在扭曲学术写作的本义。判定逻辑、阈值标准、误判申诉渠道，平台均未公开。学生拿到报告后，只看到一串数字与一片标红，既不清楚为何被判定，也不知道如何改才合规，只能凭着对算法偏好的猜测反复打磨，导致原本严谨通顺的表达被改得生硬拗口，清晰连贯的论证被拆得支离破碎。学术写作本该以准确、逻辑、思想为核心追求，如今却要为讨好一套不透明的算法让路，偏离了研究与写作的初衷。\n\n　　拨开争议表象，更需认清AI检测的技术边界。当前主流AIGC检测本质上是基于语言统计特征构建的概率模型，给出的只是“疑似程度”的可能性判断，而非非黑即白的事实定论。学术文本表达规范、逻辑严谨、句式平稳，恰恰最容易被模型误判；而真正由AI生成的内容，稍加改写、混合人工表达便可轻易绕过检测。这种“守规矩者易被误杀，懂技巧者反倒通关”的逆向筛选，不仅难以真正遏制学术不端，反而可能催生更多灰色应对手段。加之生成式AI模型迭代速度远快于检测技术，检测工具始终处于后发追赶的位置，技术属性决定了其难以充当一锤定音的裁判。\n\n　　教育部《高等学校预防与处理学术不端行为办法》规定，学术不端认定需由学术委员会组织专家调查、以事实为依据作出判断，技术工具仅可作为辅助线索。中国学位与研究生教育学会发布的相关指南也提出，AI治理重心不应放在单纯技术检测上，而要压实主体责任、强化过程管理。\n\n　　事实上，南京大学、江南大学等高校已作出理性探索，明确检测结果仅作学术规范辅助参考，最终结论以人工鉴定为准。这印证了一个道理，比起盯着终稿的数字打分，回归过程管理才是治本之策。导师全程跟进写作进程，关键节点逐层核验，答辩环节当面问询研究思路，一篇论文的成色与真伪就会自然显现。\n\n　　若学校确有检测需求，也应由校方统一采购，相关费用不应转嫁给学生个体。AI检测属于学术治理的公共服务环节，理应由公共经费保障，让检测真正回归工具属性。对平台而言，要守住学术服务的边界与初心。学术服务可以获取合理收益，但将尚不成熟、稳定性不足的工具变现，本质是在透支行业信任。公开判定标准、畅通申诉渠道，是商业平台应尽的责任，也是学术服务的底线要求。\n\n　　检测可以辅助参考，绝不能代替人作出最终判决。让文字回归价值本位，让判断回归学位委员会，学术的尊严才不会被一串标红的字符消解。(孔德淇) 【编辑:王琴】",

          "body": "中新网清远11月19日电 (张璐 孟齐飞)初冬时节，阳山西洋菜迎来丰收季。近日，走进阳山县江英镇西田村旱地西洋菜产业基地(简称“基地”)，连片西洋菜青翠繁茂、叶肥茎壮。只见村民穿梭于田间，将刚采摘的鲜嫩西洋菜收拢、装筐，一派忙碌丰收景象。\n\n图为村民工作现场。　孟齐飞 供图\n\n　　据了解，当前，阳山西洋菜种植面积约1.8万亩，年产值超13.5亿元。阳山西洋菜先后获国家地理标志保护产品认定，入选全国名特优新农产品名录、全国“土特产”重点推介名单。\n\n　　近年来，阳山县立足优良生态本底，聚焦乡村产业振兴，将西洋菜这一传统“土特产”培育成现代化特色富民产业，产品销往粤港澳大湾区核心市场。今年以来，阳山县把旱地西洋菜产业作为推动全县农业高质量发展的重要抓手，于今年8月初印发《阳山西洋菜产业发展实施方案(2026—2030年)》。\n\n　　“当前批发价稳定在每斤4.5元至5元，产品每日直供粤港澳大湾区，市场需求旺盛。”清远市一家农业发展有限公司负责人陈贤君表示，旱地西洋菜采收周期短，一年可采收15至20茬，年亩产可达2万斤至2.5万斤，产出效益可观。\n\n　　“今年气温波动较大，但西洋菜整体长势向好、品质稳定。基地坚持采用山泉水灌溉，落实标准化田间管护。”陈贤君介绍，西洋菜采收后第一时间转运至分拣中心，经挑拣修整、捆扎预冷、打包处理后，依托冷链物流外运，每一批货品均开展严格抽检，落实溯源登记。基地联合仲恺农业工程学院科研团队研发专用保鲜袋，延长产品保鲜期，为进一步开拓上海、北京等市场筑牢基础。\n\n　　正在田间采收的村民黄阿姨说：“采摘要挑选品相佳、嫩度适宜的西洋菜，看着简单，长时间弯腰劳作并不轻松。旺季一天务工约8小时，收入150元，每年能够稳定增收2万元至3万元，既能补贴家用，又方便照看老人孩子。”\n\n　　据介绍，基地优先吸纳本地村民就业，推行计时、计件相结合的灵活薪酬模式，让村民实现家门口稳岗增收，兼顾家庭照料，调动群众参与产业发展的积极性。\n\n图为村民工作现场。　孟齐飞 供图\n\n　　“目前我们全镇的阳山西洋菜总种植面积约2000亩。今年以来，我们不断盘活闲置农田、低洼水田，推动产业扩面升级，扩种成效明显。”江英镇党委副书记邓炎生表示，下一步，江英镇将聚焦规模扩种、产业链延伸、品牌塑造持续发力：推进连片标准化种植，夯实产业根基；延伸深加工链条，开发西洋菜干等产品，丰富产品矩阵；深挖特色内涵，依托新媒体打造特色品牌IP，不断提升产品附加值。(完)\n\n 【编辑:何颖】",

          "body": "大会现场。沈阳航空航天大学 供图\n\n　　中新网沈阳11月19日电(记者 王艺霖)11月18日，沈阳航空航天大学“AI+双创”教育成果展暨第八届大学生创新创业科技节总结大会举行。大会以“筑梦空天创见未来”为主题，集中展示该校以人工智能赋能创新创业教育的探索与成果。校党委副书记、校长李润东，校党委常委、副校长曲迎东、周驰出席。学校职能部门、二级学院负责人、科创指导教师及师生代表参会。\n\n　　李润东表示，学校紧扣国家空天战略需求，把创新创业教育作为人才培养改革突破口，秉持“从萌客到创客”理念，构建“聚能—强链—贯通”育人体系。学校依托国家级实验教学示范中心、低空经济学院等平台和四级众创空间，构建开放普惠的校园科创生态。开设课赛结合、专创融合及AI示范课300余门，迁移有人机、无人机“制-装-调-飞”等真场景，推行大创项目“五创融合”试点，绘制110个学科竞赛图谱，搭起“萌客赛—校赛—省赛—国赛”阶梯式成长通道。近年来，学生累计获国省级竞赛奖12300余项，实现国创赛金奖与“挑战杯”特等奖双突破。\n\n校长李润东讲话。沈阳航空航天大学 供图\n\n　　他勉励学生打牢理论根基，把学术兴趣融入航空航天等国家战略领域，勇于创新突破，把真问题做成真课题，推动成果从“书架”走向“货架”。\n\n　　会上，曲迎东总结本年度AI赋能双创教育及科技节工作。周驰宣读表彰名单。辽宁省高校首届师生智能体创新大赛优秀项目进行路演，并为年度双创工作优秀集体和个人进行颁奖。现场，专为师生打造的双创智能助手“创伴”智能体正式发布。\n\n大会现场。沈阳航空航天大学 供图\n\n　　大会结束后，校领导与师生共同走进“AI+双创”教育成果展，近距离观摩学生科创作品，感受AI与双创结合的现场魅力。\n\n　　从萌客启蒙到创客成长，从实验室到国赛赛场，本次科技节是沈航推进AI与双创深度融合育人的缩影。面向AI浪潮，学校将持续引导青年学子践行“我敢闯、我会创”，深耕科创实干，努力成长为担当空天强国使命的航空创客。(完)\n\n 【编辑:何颖】",

          "body": "中新网11月19日电 据中央气象台网站消息，过去一天，冷空气继续南下给我国中东部地区带来显著降温天气。19日早晨监测显示，黄淮、江淮、江汉、江南中东部、华南中西部等地部分地区降温幅度达6～10℃、局地超过12℃；昨天白天，内蒙古、华北、黄淮等地风力强劲，局地阵风达到10～11级。\n\n图片来源：中央气象台网站\n\n　　中央气象台预计，本轮冷空气的影响已趋于尾声，但本周内中东部地区气温仍然较为低迷，明天(20日)早晨，最低气温0°C线将南压至河南北部至苏皖北部一带。未来24小时，内蒙古、宁夏、山西、山东、京津冀、东北地区等地部分地区有5～6级风，阵风7～9级；渤海、黄海、东海北部、南海北部等海域有7~8级、阵风9级的大风。建议公众继续做好防寒防风措施；昼夜温差较大，早晚时段寒意较重，出行需注意保暖，防范呼吸道、心脑血管等冬季高发疾病。\n\n图片来源：中央气象台网站\n\n　　另外，未来三天，全国大部降水稀少。今明两天，内蒙古中部、黑龙江中东部、吉林东部、山东半岛中东部有小到中雪或雨夹雪，黑龙江东部、山东半岛东北部部分地区有大到暴雪(10～15毫米)。西南地区东部和南部、华南等地有小雨，局地有中到大雨。\n\n图片来源：中央气象台网站\n\n 【编辑:于晓】",

          "url": "https://www.chinanews.com.cn/sh/2026/11-19/10734478.shtml",
          "summary": "人类飞得最远的探测器走到哪了？",
          "summary_short": "人类飞得最远的探测器走到哪了？",
          "digest": "人类飞得最远的探测器走到哪了",
          "points": [
            "人类飞得最远的探测器走到哪了",
            "北京时间昨天(18日)18时16分07秒，旅行者1号探测器历经49年的飞行…",
            "这也是人类历史上第一次，将自己造出的装置送到了即便以光速也要用“天”来计量的遥远尺度"
          ],
          "section": "民生",

          "size": 1,
          "keywords": [],
          "body": "人类飞得最远的探测器走到哪了？北京时间昨天(18日)18时16分07秒，旅行者1号探测器历经49年的飞行，正式抵达了距离地球1光日的地方。这也是人类历史上第一次，将自己造出的装置送到了即便以光速也要用“天”来计量的遥远尺度。\r\n\n　　从地球到月球，光只要跑1.3秒；从太阳照到地球，光只要走8分多钟；即便飞到最远的行星海王星，光也只需要4个多小时。1光日，是指光在真空中跑上一整天的距离，折算下来大约是259亿千米。\n\n　　探测器所抵达的1光日的位置，距离飞出太阳系还有多远？半个世纪的星际航行，带来哪些发现与挑战？\n\n　　1光日到底有多远？\n\n　　北京天文馆研究员 朱进：1光日指的是以光速运动，走一天的距离。光速为光子在真空中的传播速度，每秒30万千米，一天86400秒，两者相乘约259亿千米，即1光日的距离。\n\n　　大家把1光日当成一个比较受关注的节点，那飞到这个位置，旅行者1号周边的宇宙环境，会出现比较明显变化吗？这个节点它更多是纪念意义，还是说能给我们研究星际空间、认识太阳系边界带来新的科学收获呢？\n\n　　朱进：1光日只是为了“凑个整”。平时在太阳系内运动多用天文单位，常听说的其实是光年，很少用光日。光日是因为这一距离正好是以光速衡量24小时，或者说与飞船通信时信号发过去需24小时、发回来也需24小时。因此，1光日对应的距离上并没有物理上特别不一样的地方。\n\n　　快要飞出太阳系了吗？\n\n　　这次到达1光日的距离，有不少听众好奇它是不是已经或者快要飞出太阳系了。其实早在2012年8月，旅行者1号越过日球层顶、进入星际空间的时候，大家就有过同样的疑问。那这次的情况又是怎么样的呢？\n\n　　朱进：2012年旅行者1号经过太阳风层顶(日球层顶)，这是一个比较重要的不同之处：飞船经过该处后，来自太阳的太阳风粒子压力与来自外部恒星际空间的压力达到平衡，是一个比较关键的变化。但经过太阳风层顶与飞出太阳系并非一回事。离太阳最近的恒星有4光年远，1光日其实还只是离太阳非常近的地方。旅行者1号虽已走了近50年，但按太阳系尺度看，其实只走了太阳系里非常中心的一小段。\n\n　　地面测控最大难点是什么？\n\n　　到了1光日这个距离，信号单程就要24小时，一来一回通信时延接近48小时。这么长的时延，地面测控面临最大的难点是什么？\n\n　　朱进：这一距离上最大难点其实并不是延时，因为很多时候并没有那么多需要实时反应的东西。最关键的是距离远造成信号衰减特别强；同时旅行者1号已近50年，50年前的航天器不可能携带特别大的天线，发射信号功率肯定特别低，且为节省能源还要限制信号发射强度和电力消耗。真正麻烦的是信号太微弱，探测器上科学观测设备和发射信号设备都存在寿命与功率问题。\n\n　　金唱片能被外星文明捕获吗？\n\n　　旅行者1号和2号上，都携带着同样的一张金唱片，这张唱片上，记录了55种语言的问候、大概90分钟的音乐、115幅模拟编码图像，以及风雨、浪涛和动物的声音。封面用氢原子跃迁建立时间尺度，以脉冲星图标示太阳位置。那么，在漫长的星际漂流中，它有没有机会被外星文明捕获，甚至是被读懂呢？\n\n　　朱进：在我看来，碰到外星人基本上不可能。两个探测器要真正离开太阳系、抵达离太阳最近的恒星，还早得很，怎么也是几万年以后的事。旅行者1号49年才走1光日，若银河系有外星人，一般考虑不会到处都是，在这种情况下能被外星人接触到，是百万年量级的事。因此需上百万年甚至上千万年，且唱片还没坏、还能一直往前飞，才有可能被外星人碰着。 【编辑:王琴】",

          "body": "超八成受访青年因线下观赛结识了新朋友\n\n　　见证重要赛事节点、感受紧张现场氛围、打卡丰富配套活动……观看竞技体育赛事时，你是否会选择去线下，享受和同好一起加油助威的快乐？近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育赛事的青年开展的调查显示，超七成受访青年曾在线下观看过竞技体育赛事，其中，80.8%的受访青年因线下观赛结识了新朋友。\n\n　　“线下观赛的氛围感是线上无法体验到的”\n\n　　“在线下看比赛和隔着屏幕还是很不一样的。”在广东广州上学的05后赵欣喜欢在现场亲身感受比赛氛围，也会为了自己喜欢的赛事特意去其他城市观赛，“我看的竞技项目在上海的赛程比较多，去一次可能会花费5000元左右。”今年，该赛事推出了城市巡回赛，落地了她所在的广州，“一场的票价大约在300元，比较合适。”她也会去球迷或者官方组织的线下观赛点观看赛事转播，“可以感受大家一起观赛的激动氛围。”\r\n\n　　在北京工作的90后李泽林更倾向在当地看比赛。作为一名网球爱好者，他从2014年就开始在线下观看中国网球公开赛(以下简称“中网”)。除了门票，他还会购买挂件、服饰等赛事周边，“去一次基本会花费1000元左右。”今年中网期间，他和朋友被一家正在转播中网赛事的餐厅吸引，“其实在餐馆之类的地方，和朋友一起边吃边看，也很有意思。”\n\n　　除了现场观赛，如今越来越丰富的线下观赛形式也吸引更多年轻人走出家门，和同好一起分享观赛激情。数据显示，70.9%的受访青年在比赛现场、影院转播活动等线下渠道观看过竞技体育赛事。其中，7.4%的受访青年通常会为线下观赛活动花费100元以下；43.6%的受访青年花费100-500元(不含500元)；35.4%的受访青年花费500-1000元(不含1000元)；11.2%的受访青年花费1000-3000元(不含3000元)；还有2.4%的受访青年会花费3000元及以上。\n\n　　“线下观赛的氛围感是线上无法体验到的。”正在读研究生的00后卫婕会选择在一些关键赛事，或者有自己喜欢的队伍参赛时去线下观赛，和同好一起加油助威。同时，她也感到如今的赛事配套活动越来越丰富，将赛事与城市特色融合起来，给观众带来了更沉浸的线下观赛体验，“今年我去北京看了一场比赛，它在开场表演和舞美设计中，融入了京剧等北京特色元素，让人眼前一亮。”\n\n　　对95后王卓琳而言，只有去线下观赛，才能真正感受到一个体育项目的魅力，“哪怕把电视声音开得再大，和现场也是完全不同的。”她平时也会去不同城市观看足球比赛，亲身感受赛场独有的紧张感，“有的人可能觉得屏幕上看得更清楚，可以看到细节、听清解说，但只有在现场，你才能感受到为什么一个带球、一个进球都牵动人心。”\n\n　　比起在家“躺着”观赛，年轻人为何会选择到线下场所观看竞技体育比赛？在有过线下观赛经历的743名受访青年中，57.5%的受访青年是想亲眼见证高光时刻、经典对决；56.9%的受访青年是为了和同好一起呐喊助威，获得情绪共鸣；55.2%的受访青年是为了沉浸式感受赛场独有的紧张氛围。其他还有：近距离支持喜欢的选手、队伍(47.4%)，互动、抽奖、表演等线下配套活动丰富(36.3%)，作为一种休闲社交方式(25.0%)，打卡赛事地标(5.9%)等。\n\n　　线下观赛 八成受访青年结识了新朋友\n\n　　线下观赛，年轻人不仅享受比赛本身的魅力，也拓展了自己的社交圈。调查显示，在有过线下观赛经历的受访青年中，80.8%的受访青年因此结识了新朋友。\n\n　　赵欣觉得，竞技体育赛事让来自天南海北的观众有机会相聚在一起。“最开始大家可能只是网友，在社交平台上发帖交流。随着线上交流的深入，大家会加好友、建群。”有比赛时，群里的朋友也会相约线下观赛，“我也因此认识了很多新朋友。”\n\n　　李泽林在中网期间会和球迷群里的网友相约买票，“我们会选一个比较集中的区域，方便一起加油助威。”观赛时，大家还会在现场讨论比赛内容，交流球技。赛后，他还会和新“球友”约着一起线下打球。\n\n　　卫婕会在观赛现场和其他粉丝交换周边，也会和旁边的其他同好搭话，在一来二去的闲聊中慢慢发展出友谊。如今，她和一些通过线下观赛认识的同好之间的话题，已经不仅仅是比赛本身，“有的已经成了能分享生活的好友。”\n\n　　受访青年中，男性占52.8%，女性占47.2%。05后占5.2%，00后占32.2%，95后占25.6%，90后占37.0%。\n\n　　(除卫婕外，受访者均为化名)\n\n　　中青报·中青网记者 戴瑶\n\n　　来源：中国青年报 2026年11月19日 08版 【编辑:王琴】",

          "summary_short": "中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低，多地气温将陆续降至近期低点…",

            "中东部地区降水将减少减弱，进入一段降水间歇期",
            "23日前后，随着暖湿气流增强，江南、华南等地又将迎来一轮降水天气过程"

          "size": 1,

          "body": "中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低，多地气温将陆续降至近期低点，并大范围创下立秋后新低。与此同时，中东部地区降水将减少减弱，进入一段降水间歇期。23日前后，随着暖湿气流增强，江南、华南等地又将迎来一轮降水天气过程。\n\n　　寒潮东移南下 中东部气温将陆续触底\n\n　　昨天，寒潮继续南下，中东部大部出现大风降温天气。监测显示，内蒙古中东部、东北地区中南部、华北、黄淮及青海南部、西藏等地出现6至8级阵风，局地11级以上。今早6时较昨天同时次，黄淮、江淮、江汉、江南中东部、华南中西部等地部分地区出现6至10℃，局地12℃以上降温。\n\n　　今明天，冷空气影响将趋于结束，但中东部地区气温仍较低。其中明天早晨，最低气温0°C线将南压至河南北部至苏皖北部一带。\n\n　　受冷空气影响，南北方多地气温将陆续降至近期低点，并大范围创立秋后新低。沈阳今天最高气温将是下半年首次跌至0℃，济南明天早晨最低气温也将是下半年首次跌破冰点。这次冷空气过后，北方有望全面入冬，而长江中下游一带也将会有短暂的冬日体验。\n\n　　对于华南来说，由于前期气温显著偏高，这轮降温效果会十分明显。大城市中，广州、南宁最高气温将从前期的30℃上下，下滑至不足20℃，其中南宁今天最高气温仅有17℃，秋凉明显。\n\n　　此外，今天冷空气在东移南下过程中，由于地面气压梯度较大，加上高空动量下传，东北、华北等地仍将有大风天气。午后阵风尤其强劲，阵风可达7至9级，风寒效应明显，提醒公众外出需注意防风保暖。\n\n　　中东部进入降水间歇期 23日前后南方再迎降水过程\n\n　　随着冷空气东移南下，中东部地区的降水迅速向东向南收缩。昨天，内蒙古中东部、黑龙江、吉林东部、河北北部等地出现小到中雪或雨夹雪；云南南部、广西中南部、广东中南部、福建东北部等地出现分散性中到大雨，云南西双版纳局地暴雨。\n\n　　今天，东北地区的降雪和南方的降雨都会有所减少。中央气象台预计，今天，内蒙古中部、黑龙江中东部、吉林东部等地部分地区有小到中雪或雨夹雪，其中，黑龙江东北部局地有大雪。西南地区南部、华南大部、台湾岛等地部分地区有小到中雨，其中，云南南部等地部分地区有大雨。\n\n　　明后两天，我国大部地区将进入降水间歇期，天气以晴为主，并且在干燥偏北气流的影响下，空气相对湿度下降，南方的干燥程度也会加大。\n\n　　中央气象台预计，20日，内蒙古中部、黑龙江东部、山东半岛东北部等地部分地区有小到中雪或雨夹雪，其中，山东半岛等地部分地区有大雪。云南南部、华南中南部、台湾岛等地部分地区有小雨，其中，云南南部和中部等地部分地区有中雨。\n\n　　21日，内蒙古东北部、山东半岛东北部等地部分地区有小雪。云南中南部、贵州西部等地部分地区有小雨或阵雨。\n\n　　展望后期，23日前后，随着暖湿气流加强，配合南下的冷空气，南方又会迎来新一轮降水过程。届时，江南、华南等地将有中到大雨，提醒公众密切关注临近预报，提前做好防范措施。\n\n 【编辑:梁异】",

          "body": "曾被封為「新一代AI股神」的25歲基金經理Leopold Aschenbrenner，在旗下Situational Awareness因押注AI股失利、幾乎崩潰約4個月後，正籌劃重振基金。據英國《金融時報》引述知情人士報道，他近日與主經紀商及投資者商討「Situational Awareness 2.0」，包括恢復槓桿交易，以及在新一年向外部投資者募資，但計劃尚未敲定，仍可能調整。\n7月折讓斬倉予Citadel\n該基金今夏曾在短短數日內，由管理逾200億美元資產，陷入需要城堡投資（Citadel）出手接盤的困境。目前基金仍管理逾100億美元資產，主要為私人投資。Leopold能否重振基金，將取決於投資者及銀行是否相信他能妥善管理風險。\nLeopold於7月曾向投資者致歉，表示基金已停止向銀行借款擴大押注。當時基金與格里芬（Ken Griffin）旗下城堡投資達成緊急交易，以折讓出售絕大部分上市證券持倉，用以償還高盛及摩根大通等貸款人；摩根大通其後停止向基金放貸。\n消息指，Leopold曾與富瑞（Jefferies）商討開設主經紀商戶口，但該銀行今年較早時曾因認為基金對沖不足而拒絕接納。基金亦正與專業經紀商Clear Street合作。\n基金重整之際，Anthropic上市亦受到關注。《金融時報》報道，Situational Awareness持有價值約50億美元的Anthropic股權，相關持股價值預期在上市後顯著增加。Leopold的妻子則在Anthropic擔任行政總裁Dario Amodei的幕僚長（Chief of Staff）。\n基金亦保留規模較小的上市股票組合。本周公布的最新監管文件顯示，持倉包括SharonAI（SHAZ）及數據中心開發商CleanSpark（CLSK）等公司。\n擴充至約30人 正物色風險主管\n據熟悉情況的人士透露，Situational Awareness目前約有30名員工，多於6月監管文件披露的8人，並正物色首席風險官。基金去年亦曾聘請顧問，負責處理經紀商關係。\n部分投資者對重整仍抱有信心，但亦關注風控能否改善。一名近期曾與基金管理層交談的投資者形容，他們學到的只是「風險管理需要再微調」；另一名投資者則表示，「之前相信他的人，大概仍然相信他。」",

          "body": "出席深圳APEC峰会之际，埃隆·马斯克还通过视频连线参加在美国举办的一场峰会活动。他再次谈及对黄仁勋风波的看法，表示曾将其视为篮球运动员迈克尔·乔丹，就对一支球队的意义而言，黄仁勋处于“巅峰水平”。“在连胜之中，然后你把迈克尔·乔丹踢出你的球队，这在我看来不像是明智的决定。”马斯克认为，在换掉这样的人之前，必须深思熟虑，没有人可以替代黄仁勋。他一个人承担了好几个人的职责，和关键供应商建立积累了几十年的长期关系、对技术理解透彻，同时受到团队爱戴。马斯克还评价称，黄仁勋是历史上最有才华的创业者之一，没有人会不想聘用他，但是他显然不是在找工作。马斯克还称，他也不知道接下来会发生什么。（第一财经）",

          "body": "界面新闻记者 | 程璐\n界面新闻编辑 | 文姝琪\n\n今天，年轻人的生活方式究竟是什么样？可能很难得出一个简单的概论。\n\n二手交易算得上答案之一，甚至已经成为年轻人中一种日常的消费选择。日本进入第四消费时代后，二手经济蓬勃发展，人们喜欢在大街小巷上游逛充满生活气息的店，中古、二奢各有生存之道。\n\n在95分CEO陈意明的观察里，今天中国的年轻人们愿意穿冲锋衣上班，刚开始一项运动就想试试专业级装备，却未必愿意支付全新的价格。有人催着平台上架3D打印机，品牌一定要拓竹。\n\n他将这种消费观概括为“精致的精明”。\n\n正是这群对质感有要求、对价格也有要求的年轻人，撑起了这家从上海跑出的二手电商平台生意。\n\n在主流聚光灯视线之外，95分起步于2019年底，2022年开始盈利并持续至今；年GMV已过百亿，近三年增速都在50%以上；月活千万级，累计注册用户超过2亿。\n\n近日，在接受界面新闻的专访时，陈意明透露，平台平均客单价约600-800元，支付用户中约48%为00后。这两个数字对任何电商平台来说，都意味着吸引力，它证明了用户群既年轻，又足够有消费力，甚至看似两个矛盾的因素，在一个二手电商平台身上达成了统一。\n\n但事实上，它提供的是一个二手消费画像的侧面，年轻人既希望买到喜欢的品牌和品质，也愿意接受一些使用痕迹，以换取更低的价格。\n\n从潮流鞋服起步，95分的早期团队与业务都与得物有关。但其业务也早已不只是卖二手球鞋。如今，鞋在95分的品类占比已不足三成，箱包、服饰、数码，以及球拍、雪板等运动装备，都在快速增长。\n\n一个鲜少对外发声的平台，是如何在热闹的二手市场里做到百亿级交易规模？\n\n给二手商品“定价”\n\n界面新闻了解到，95分业务起步于2019年12月，原始团队正是来自得物的早期创始团队。这种出身也给了其初始的鉴别经验，但也决定了平台的鲜明选品倾向：有品牌、且有一定价值的商品。\n\n得物能判断真假，但二手商品需要判断瑕疵、成色和识价，此后95分逐步独立发展出相应的能力。\n\n比如一双Nike的空军一号，鞋底划痕，相比鞋面发生氧化，用户愿意支付的价格完全不同；一只同款包，即使都标注为九五成新，也可能因为瑕疵位置、配件完整度和市场行情不同，卖出不同价格。\n\n陈意明正是在这一过程中加入95分的。他有一份20多年互联网从业经历，曾任海内外多家头部电商平台的业务与管理工作，熟悉平台交易效率与年轻人洞察。\n\n但要想理解95分用户，仍要重新开始。\n\n95分团队早期认为，二手消费的需求可能来自于用户消费降级和分层的选择，更倾向于白牌产品、品牌尾货，或者更便宜的二手货。\n\n但平台上表现出来的用户需求，却不完全符合这个预设。\n\n团队看到的用户画像是：年轻人进入职场后，体面的着装不一定是西装，也可以是始祖鸟冲锋衣；开始打球、骑行、滑雪后，他们希望试试专业装备。他们不是只找最便宜的东西，而是希望用可承受的价格，买到原本就想要的品牌和品质。\n\n这种偏好逐渐改变了平台的品类结构，使其更均衡：今天95分的第一大品类是鞋，但占比不到三成；箱包、服饰、数码紧随其后，且彼此差距很小。\n\n它做手机，但其中约九成都是苹果；它也做数码，CCD相机、录音设备、耳机和游戏机，都出现在这些用户的购买清单里。运动户外，则延伸到球拍、雪板、头盔等装备，用户们既看品牌，也看性能。\n\n甚至这些用户非常专业，一个刚刚开始打球的人，可能已经知道自己想要哪一个品牌的哪一款球拍；一个准备尝试滑雪的人，可能也不满足于入门级装备。\n\n图源：视觉中国\r\n\n95分认为，这些商品不完全承担生活必需品的功能，还与用户的兴趣、审美和自我表达有关。\n\n二手电商升温\n\n过去几年，二手经济快速增长，甚至抖音、小红书等内容平台，也瞄准了年轻人的兴趣交易，但二手电商平台中仍然跑出了新故事。\n\n如果把95分放回整个行业里，它的位置会更清楚。\n\n第一梯队的闲鱼是C端（用户）基因起家。月活2.17亿、注册用户超过6亿、日均GMV超过10亿元，依靠人货的丰富性与匹配效率，低价闲置、长尾商品、本地物品，都可能在此找到买家。它的流量规模与销售额都是行业最高，但这并不意味着闲鱼能从中赚钱。\n\n过去两年里，闲鱼先后提升服务费，同时补齐验货宝、帮卖和循环商店的能力，试图多渠道创收，但它仍然要面对C端用户带来的不确定性。\n\n“大多的产品逻辑是你要逛，但我们的产品逻辑是你别逛。”用户大多有明确的购买目标，进入95分搜索，一排货架摆好，展示不同成色下的不同价格，帮助其迅速做决定。\n\n第二梯队、以手机切入的转转和爱回收，做的则是标品货值市场。2025年，转转关掉C2C，all in“官方验”，门店超过1000家，收购红布林后其切入奢饰品赛道，近期还在探索仓储门店的“超级转转”模式，其年GMV也已经达到200亿元级别；爱回收则通过2000多家线下门店织回收网络，2025年营收达到210.5亿元。\n\n它们拼的是回收触点与供应链效率，谁能收到一手货源，再把货验好、卖出去。\n\n从GMV的规模体量上看，95分也已迈入百亿级梯队。\n\n“大家都在用不同的方式解决二手的信任不对称。”陈意明也向界面新闻谈及当下二手经济的热潮，几乎每个细分形态下都站稳了竞争者。有人用内容、有人用流量、有人用线下门店，相比之下，95分选择用质检和定价能力，去解决交易信任问题。\n\n在交易形式上，每件在95分交易的商品，都需要通过平台查验。以寄售为例，卖家把商品寄给平台，平台经过查验、识别瑕疵、定级、拍摄并存储，售出后再完成发货等服务。另有挂售与回收模式。\n\n寄售模式决定了95分不是单纯提供信息的C端集市，也不是靠买低卖高赚差价的自营零售商。在商业化层面，平台主要靠收取商品查验、处理与交易的服务费。\n\n界面新闻了解到，今天仅在鞋类上，95分已积累约6000万个瑕疵项数据。每个瑕疵需要记录名称、部位和程度，再结合商品、品牌和交易行情，用于支持成色判断与估价。\n\n“一物一验”的服务，听起来这是一门非常重的生意，但平台的门槛也在这里。\n\n年轻消费者对二手商品的选择，呈现出高客单、高成色、精描述的需求特征，这也促使95分向高客单精品倾斜，投入更多成本，如质检、识瑕、估价的服务，使其成为高周转的生意。\n\n不过，贵的商品不一定更好卖，经典款与冷门款的成交速度也不尽相同。对长期卖不出的部分商品，平台会主动提醒卖家取回，而不是持续留仓。\n\n因此，对于95分来说，交易效率是核心。在此前提下，平台要在卖家收益、买家的价格接受判断之间，寻找到一种效率最高的平衡。\n\n从盈利和规模角度看，这门生意已经被验证成立。\n\n不过，从非标高货值商品起步的95分，当下面对的是另一种复杂。同一款商品可能有不同的瑕疵，用户要判断自己能接受哪些使用痕迹，这些痕迹又对应怎样的价差。报告中的瑕疵是否准确、估价建议是否有用，需要长期的积累。\n\n图源：界面图库\r\n\n慢生意、快需求\n\n界面新闻了解到，2022年至2024年，95分主要在尝试多品类策略；最近两年，则在把各品类下的服务做实。\n\n对于用户增长的课题，95分表现得颇为克制。过去几年里，他们几乎很少做投放，但用户每年增长速度都保持在30%至40%。\n\n相比之下，平台更倾向于在供给质量、品类服务与有效履约上继续“爬坡”。95分希望获得更多供给，尤其是有特色好货的卖家。比如鞋服、运动玩物更偏向个人卖家，二奢和数码则需要有更多商家参与。\n\n个人卖家既提供分散的货源，也可能成为买家，今天平台上这种买卖互转的用户占比已达约28%，团队将其视为提高用户黏性的重要方向。\n\n目前，95分的公司中心团队规模约在几百人，产品与研发人员占一半以上，另在全国上海、廊坊、武汉、沈阳等地布局了六个区域大仓，仓内有执行团队。寄售商品60天内免仓储费。\n\n“仓储费不是为了赚这笔钱。”95分的团队告诉界面新闻，60天是一个平台判断过的均值，大部分商品的流转都在60天内，设置的目的是为了让货卖得更快。卖不掉的货，平台也会主动提醒卖家免费取回。\n\n陈意明过去一年花时间最多的地方，是跑仓库、看质检，以及和用户聊天。\n\n他对用户观察的事非常感兴趣。他曾经陪着三个用户各待了一天，付费买下他们的时间，看看购买商品、使用的流程场景，这也给了其很多意外的收获。\n\n比如，每个月发工资后的10天，是95分的消费高峰，工资到手后，看够了再下手。还有一个用户花了几十万买了块冷门表，结果只为追求的是一种“深不可测”的感觉。\n\n对于95分来说，今天平台最大的挑战之一，是用户需求正在拉动品类结构变化，而平台的履约标准无法及时跟上。比如，用户想要的新运动装备，该怎样检验、怎样定级、如何估价；如果扩进来的供给不够好，平台又检验不出来，那就很可能造成更大的信任风险。\n\n“是选择拓用户还是长能力为主，我肯定会选择长能力。”陈意明说，等平台能力准备就绪，自然能迎接下一轮的增长。\n\n未经正式授权严禁转载本文，侵权必究。互联网日常\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n二手电商，上海跑出
