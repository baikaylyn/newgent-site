          "body": "国家文物局昨天(18日)发布了长江文明溯源最新考古成果，分别是四川遂宁桃花河遗址、浙江杭州良渚反山遗址、江西九江荞麦岭遗址群岭头上遗址、湖北云梦老虎墩墓地。\n\n　　从30万年前古人类生活营地，到五千年前良渚高等级礼仪院落，再到夏商周文化交融聚落、秦汉简牍出土墓地，这些出土遗迹、石器、简牍究竟揭开了哪些历史谜题？又为实证中华文明多元一体带来哪些全新线索？\n\n　　四川遂宁桃花河遗址\n\n　　四川遂宁的桃花河遗址坐落在涪江中上游，包含鄢家沟、田家湾两处地点，总面积大约19万平方米，主体年代距今30万年到5万年。考古人员在这里发掘了1.3万余件石制品以及179件动物化石，还发现大量碎屑和人工搬运砾石，找到了砾石铺设活动面、石器集中贮藏区、石器加工场等遗迹。四川大学历史文化学院院长吕红亮说，桃花河遗址是长江流域迄今发现遗物最密集的中更新世旷野中心营地，极具特色的定型化大石片砍斫器工业、复杂的营地组织形态与空间规划能力，对研究全球早期人类演化具有重要意义。\r\n\n　　四川大学历史文化学院院长 吕红亮：桃花河遗址的时间节点非常有意思，30万年到5万年，这是在古人类研究里面非常敏感的一个时间段。另外它出土的石器非常有特点，而且密度很高，这在全世界都是比较罕见的。第三是它发现了一些可能的人类活动遗迹，这也是比较少见的。我们以前发现的人类活动遗迹相对来说都是旧石器时代晚期的，它早的这么一个时代，对全世界旧石器的考古研究来说是一个新的纪录。\n\n　　浙江杭州良渚反山遗址\n\n　　浙江杭州良渚反山遗址是已知良渚文化等级最高的贵族墓地。2024年开启的系统性发掘带来重要突破：考古工作者发现反山不只是一处单纯的墓葬土墩，它以土墩为中心，外围建有院墙，构成一座略呈长方形的独立院落，围护面积约2.5万平方米。浙江省文物考古研究所良渚遗址考古项目负责人王宁远介绍，院墙、台基及建筑遗迹的发现，揭示了墓葬区、礼仪活动空间与外围围护设施相结合的整体布局，为探讨良渚古国王权的礼仪性表达和制度化发展，提供了新的考古证据。\n\n　　浙江省文物考古研究所良渚遗址考古项目负责人 王宁远：良渚古城是不同来源的社群聚合而成的地缘社会，意味着社会组织和制度的全新建构。反山的发现，从聚落结构角度为这一变革提供了生动的例证：反山院墙以及东部建筑遗迹的发现，突破反山作为单纯土墩墓地的传统认识，表示当时已经形成与丧葬相关的稳定的规制。成组院落或分别对应不同的人群，为研究良渚古城社会组织和人群关系提供重要线索。反山王陵与土垄的结构性关联，证实了良渚古城与水利系统是统一规划建设的整体设施，它是社会权力、信仰与大型水利工程深度结合的物化体现。由此说明治水立国的东方文明理念，早在大禹治水传说之前一千年就已经在良渚地区成功实践。\n\n　　江西九江荞麦岭遗址群岭头上遗址\n\n　　江西九江的荞麦岭遗址群是一处大型先秦聚落遗址群，岭头上遗址是其中面积最大的墩台之一，总面积约6万平方米。考古在这里发现新石器时代晚期墓葬、玉石器加工遗存；也发现早商时期的居址、青铜冶炼遗存，出土坩埚、炉壁残块、铜渣、铜块等遗物。江西省文物考古研究院副研究馆员饶华松表示，这个遗址位于长江中下游的过渡地带，遗址内新石器时代晚期及早商时期的聚落文化因素多元，反映出长江中下游文化传播、互动交融频繁，揭示了中原与长江中游地区文化交流与资源开发控制的密切关系。\n\n　　江西省文物考古研究院副研究馆员 饶华松：荞麦岭遗址群岭头上遗址地处长江中游和下游与中原之间的地理关键节点，这里连接东西沟通南北，兼有多种文化因素，自新石器晚期直到商代的文化发展展现了显著的文化交汇的特征，既有皖、鄂、赣交界期的自身文化发展主线，也可见长江中游、下游文化的较强的影响。商代早期更是融入到中原文化的一体化浪潮中，是研究中原与南方长江中游和下游文化交流互动的难得材料，是认识中华文明多元进程的重要实证。\n\n　　湖北云梦老虎墩墓地\n\n　　湖北云梦老虎墩墓地属于战国晚期至西汉初期墓地。2026年考古发掘一共清理秦汉墓葬113座，其中40座是饱水墓葬，出土漆木、陶器、金属、玉器以及简牍等各类随葬品1200余件(套)。北京大学中国古代史研究中心教授朱凤瀚表示，老虎墩墓地是目前出土秦简最集中的墓地，所获材料涉及政治、军事、文学、医学、民俗学、艺术等领域，为研究秦汉大一统王朝历史进程以及基层社会治理模式提供了最新史料。\n\n　　北京大学中国古代史研究中心教授 朱凤瀚：从出土器物来看，它很好地体现了秦文化和楚文化的融合。同一座墓葬当中既有秦式器，还有楚式器物，很好地体现了秦、楚两种文化的交融。从人群角度来说，这里也见证了秦汉之际人群的融合，一部分秦国的官吏、士兵南下，这个墓地可以说是中华民族形成的一个缩影，从墓葬制度、随葬器物的制度、形制上很好地体现了这一点。\n\n　　从几十万年前古人类营建的旷野中心营地，到良渚时期统一规划的都邑、水利、高等级墓葬体系，再到夏商阶段南北之间的文化往来、资源互动，直至秦汉大一统之下地域文化交融共生，长江流域这四项考古成果，进一步补全了中华文明漫长的发展链条。接下来，考古团队还将开展多学科综合研究，持续挖掘出土遗迹遗物背后蕴藏的历史信息，为实证中华文明百万年人类史、五千多年文明史提供更多实物支撑。\n\n　　监制丨樊新征\n\n　　记者丨韩萌 【编辑:梁异】",

          "title": "词元作为数字商品进入大众消费 专家建议：统一计量口径守护AI消费权益",

          "body": "今年“双十一”，Token首次以独立品类摆上电商货架，“囤Token”成为热词。\n\n　　Token中文名为“词元”，是大模型处理文本的最小单位，用AI写文案、做PPT、生成图片视频都在消耗它。厂商按量计费，输入输出都计费，但对普通用户来说，这个单位几乎不可感知：100万Token值多少钱，很难换算。于是不少平台把它“翻译”成积分或会员。\n\n　　有业内人士指出，词元作为数字商品进入大众消费后，仍面临计量、定价、安全、合规等多重课题：同一段文字在不同模型中消耗的词元可能相差两至五成，计费规则不一、套餐难以换算、未用完的额度如何处理、发生争议找谁，相关规则仍待厘清。\n\n　　围绕上述问题，《法治日报》记者采访了西南政法大学民商法学院教授张力和中国人民大学法学院副教授、法律科技与社会治理实验室副主任黄尹旭。\r\n\n　　囤词元系预付式消费\n\n　　记者：消费者“囤”的Token，买到的究竟是什么？\n\n　　张力：从法律性质看，单个Token不构成独立的物。Token套餐是经营者以预收款方式提供的数字服务，属于预付式消费。消费者预先支付价款，取得按Token计量的服务额度，未使用部分对应尚未消费的预付款，属于消费者的财产利益。\n\n　　记者：购买Token后，页面往往只显示“剩余额度”“剩余次数”，一次用掉多少、怎么扣费看不明白。账单看不懂、对不上，该找谁？\n\n　　张力：Token并非统一、中立的计量单位，而由各服务商自定义。消费者按Token付费，却无法预先确知某次使用消耗多少，也难以仅凭数量在不同套餐间比较。名义价格与实际消耗可能不对应，这正是“看不懂账”的根源。\n\n　　计量单位、计费口径、单价、单次消耗与余额变动，均属与消费者有重大利害关系的信息。经营者仅显示概括余额而不提供可供核验的明细，属于信息披露不充分。\n\n　　消费者首先可要求服务商提供用量明细。服务商拒绝或无法说明的，消费者可向市场监管部门投诉，或申请仲裁、提起诉讼。依据《最高人民法院关于民事诉讼证据的若干规定》，一方当事人控制证据无正当理由拒不提交，对待证事实负有举证责任的当事人主张该证据的内容不利于控制人的，人民法院可以认定该主张成立。服务商不提供明细，可能承担不利后果。\n\n　　黄尹旭：过去Token服务面向开发者，用量查询嵌入技术后台是行业惯例；转向大众零售后，数据打通、账单通俗化改造都需要时间。目前多数消费者还需跳转服务商后台查看明细。账单存疑，可先找服务商核对，协商不成再向平台投诉。\n\n　　出现争议应如何维权\n\n　　记者：打开一个Token商品，页面通常是几档套餐：有按用量计价的单项包，也有标着“赠送额度”的组合套餐，不少还写着“限时有效”“未用完不退”。对于消费者来说，付款前需要留意哪些内容？\n\n　　张力：关于“赠送额度”，若赠送额度真实无偿，其未使用部分原则上不产生退款请求权；但若实为套餐定价组成部分、仅以赠送名义标示，则属于误导性价格标示，涉嫌违反价格欺诈禁止规定。\n\n　　关于“限时有效”，预付款设定有效期并非当然违法，但有效期条款属格式条款；期限明显过短，或到期后余额一律作废、不予延期或退还的，可能排除消费者主要权利，依据民法典第四百九十七条和消费者权益保护法第二十六条，该条款无效。\n\n　　关于“未用完不退”，尚未消费部分属消费者预付资金，经营者不能以格式条款一概排除返还请求权。任何情形下均不退还余额的条款效力存疑。消费者因经营者违约、停业解除合同的，仍有权请求退还剩余额度。\n\n　　记者：对于Token这种“看得见摸不着”的数字商品，平台和AI服务商应各自承担怎样的安全保障义务？\n\n　　黄尹旭：Token作为新型数字商品，其安全保障义务边界仍在法律与实践探索之中，很难用现有标准要求某一方承担无限责任，更务实的原则是“法定底线守牢，延伸责任逐步探索”。\n\n　　张力：AI服务商作为直接提供者，依据消费者权益保护法，应保证服务符合保障财产安全的要求：保障账户与额度安全、防止盗用，保障服务连续稳定、避免中断造成额度损失，保障计量准确并保存记录；同时，依据个人信息保护法、网络安全法、数据安全法，对输入内容承担数据安全义务并明示规则。\n\n　　关于平台责任，依据电子商务法和消费者权益保护法，需核验入驻主体信息，在发生争议时提供经营者真实名称、地址和联系方式；不能提供的，消费者可要求平台赔偿；平台作出更有利于消费者承诺的，应当履行；知道或应当知道服务商侵权而未采取必要措施的，依法承担连带责任。\n\n　　计量口径有待标准化\n\n　　记者：从长远看，要让Token真正成为“买得放心、用得明白”的消费品，最关键要建立哪些制度或标准？\n\n　　黄尹旭：平台和商户当下即可先行探索：在商品详情页显著位置展示计量规则、有效期、退款政策、明细查询方式，把用户协议里的关键内容摆到台面上。\n\n　　张力：一是计量口径标准化，用国家标准、行业标准或团体标准统一Token定义、分词规则与计费口径，使输入、输出、系统提示、缓存等项目口径一致、价格可比。\n\n　　二是强制信息披露，公示单价、口径、有效期与退款规则，提供可核验明细。\n\n　　三是预付款资金监管，对预收资金实行存管或担保，防范挪用、停业失联造成余额损失。\n\n　　四是格式条款效力审查，明确“过期作废”“概不退换”等条款边界。\n\n　　五是平台主体责任，明确资质审核、信息披露与争议处置义务。\n\n　　六是第三方计量核验，建立符合性评价机制，为举证和执法提供技术支撑。Token计量不属于计量法调整的法定计量范畴，不能靠计量器具强制检定解决，但可借各类标准统一分词规则与计费口径。\n\n　　记者：统一计量口径、引入第三方核验，落到普通消费者身上，能解决什么问题？\n\n　　张力：这一步解决两个问题。其一，可验证性。口径公开、明细可获取后，消费者或其委托的第三方可自行复核账单，争议处理不再完全依赖经营者单方陈述。\n\n　　其二，可追责性。第三方核验通过认证与持续审计，将虚标额度转化为可识别、可追究的违约或违法事实，提高违法成本，为索赔提供证据基础。第三方核验不能绝对消除虚标，其作用在于降低信息不对称，而非替代监管追责。\n\n　　黄尹旭：统一计量口径，本质是给消费者一把通用的“公平秤”，也是以规则守护AI消费权益的体现。如买电用“度”、买流量用“GB”，无需逐一换算Token，比价对账才有据。第三方核验针对商家记账、消费者无从核验的信息不对称问题，既能约束商家、减少虚标多扣，也可提供中立维权依据。(记者 赵丽) 【编辑:曲克】",

          "body": "中新网11月19日电 据“平武发布”微信公众号消息，四川省绵阳市平武县市场监督管理局18日发布情况通报，2026年11月17日，有网友反映平武县某民宿提供的烤全羊分量不足，引发网民关注。对此，平武县市场监督管理局高度重视，成立工作组第一时间开展核查处置。现将有关情况通报如下。\n\n　　一、事件概况\n\n　　2026年11月11日，游客一行在该民宿食宿，通过微信预订烤全羊一只。用餐时，游客认为“烤羊有点小、肉太少、全是骨架”。11月17日下午，平武县市场监督管理局收到该网络反映，及时组织双方开展调解，双方已就赔付事宜达成一致意见。\n\n　　二、核查情况\n\n　　11月17至18日，平武县市场监督管理局执法人员在涉事民宿开展实地调查核实，并邀请人大代表、政协委员、游客代表到场全程监督。\n\n　　经现场核实并询问双方当事人，当日经营者未留存该烤全羊称重凭证，仅以口头方式和消费者沟通重量，调查时距离事发已间隔6日，现有证据难以核实实际重量，平武县市场监督管理局以视频作为参考，疑似存在缺斤少两问题。同时，经现场调查发现，该民宿店内未公示菜品价格，存在“未明码标价”问题。\n\n　　经查，该民宿涉嫌违反《中华人民共和国消费者权益保护法》《中华人民共和国价格法》相关规定。平武县市场监督管理局已对该民宿立案调查，并将根据后续调查情况依法依规严肃处理，坚决维护市场经营秩序，切实保障消费者合法权益。\n\n图片来源：“平武发布”微信公众号截图\n\n 【编辑:曹子健】",

          "body": "受強烈東北季候風影響，天文台指本港今早多處地區氣溫，較昨日低約三至四度，今日日間氣溫約22度，到晚上市區氣溫下降至，午夜最低約18度，新界再低兩、三度。\n\n天文台科學主任謝威寶指出：「預計之後幾天都繼續受到強烈東北季候風影響，天氣仍然相當清涼。展望明天有幾陣雨，氣溫會進一步下降至市區最低大約15度，新界再低兩、三度。」\n\n天文台預測，周六早上仍然相當清涼，隨後一、兩日氣溫稍為回升。而另一股東北季候風，會在下周中期影響華南，該區氣溫將再度下降及有幾陣雨。天文台提醒市民，特別是進行戶外活動人士，要留意天氣變化及注意保暖，並關顧長者及慢性病患者。",

          "body": "Token抢手？超半数受访者表示没必要囤\n\n　　为AI付费，58.6%受访者感觉额度算不明白\n\n　　今年“双十一”，直播间里出现了一个新鲜货——Token(词元)。面对消费新事物，大家有哪些看法？\n\n　　上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者参与的调查显示，今年“双十一”，近两成(18.9%)受访者下单了AI会员、Token月卡或算力包(含体验卡)，超半数(53.5%)受访者表示随用随充，没必要囤货。\r\n\n　　当Token入场“双十一”：是果断下单，还是谨慎观望？\n\n　　今年“双十一”，来自河南郑州的85后网店主张龙趁着某AI平台做活动，买了一些积分。如今，在网店的日常运营上，张龙把美工、运营、剪辑好几个人干的活都交给了AI。他算了笔账，以前请团队每月最少一万多元支出，现在AI全包，一个月几千元就能搞定，“以前我不可能以这么低的成本做到”。\n\n　　数据显示，今年“双十一”首日，某电商平台Token品类成交额环比增长450%；在某主播直播间，半小时卖出10万份AI辅助类办公会员月卡，累计约两万亿Token。\n\n　　本次调查中，今年“双十一”，近两成(18.9%)受访者下单了AI会员、Token月卡或算力包(含体验卡)。32.5%的受访者虽没下单，但表示“考虑过”。交叉分析发现，受访05后下单了的比例更高，为38.1%，然后是00后(26.2%)、90后(19.2%)。\n\n　　张龙关注到，今年“双十一”有直播间卖Token，但他没有在直播间里下单，他有一些顾虑：“每家代理的API(指应用程序编程接口‌，是软件系统之间沟通的桥梁，定义了不同程序如何相互调用功能、交换数据的规则与协议——记者注)不一样，在非官方渠道买Token，有可能要换API接口，输入、输出多少钱都不一样。”\n\n　　来自苏州的90后原田是一名短视频博主，每天大量使用AI生成视频和图片，但面对“双十一”囤Token这件事，她保持观望态度。“大模型几个月就更迭一批，现在囤一堆，过一阵可能就不值钱了。”\n\n　　在原田看来，按量付费是最理智的选择，“用多少扣多少，囤月卡我怕用不完，过期就作废了。”\n\n　　大家如何看待“双十一”囤Token的现象？超半数(53.5%)受访者表示随用随充，没必要囤货；24.4%的受访者觉得是“真刚需”，早囤早享受；17.7%的受访者认为是纯噱头，有些实际未必用得上；持有其他观点的受访者占4.4%。\n\n　　什么情况下大家会为AI续费\n\n　　来自上海的00后在读研究生王明远是一名为AI付费的资深用户，平时用AI助力学习、作业指导，以及一些项目的设计和实现。在付费使用过多款主流AI工具后他发现，目前国内的AI平台主要采取积分订阅制度，“用户花一定的钱，却可能搞不清享受到多少Token，信息对消费者不透明。”\n\n　　来自深圳的35岁黄鹂经常使用AI辅助办公。她发现，有时在调用模型生成图片和视频时，平台会在自己不知情的情况下消耗大量积分。“前几天给AI一份视频脚本，不是很复杂，结果视频还没生成完，就消耗了7万积分，相当于花了70多元。”更让黄鹂无奈的是，平台没有实时客服，只能提交工单等待反馈。\n\n　　你感觉现在AI工具收费存在哪些“坑”？调查中，58.6%的受访者觉得额度算不明白，Token、次数、时长混着来；48.4%的受访者表示一些AI工具实际表现与宣传有差距，性价比一般。其他还有：会员权益细分多种类型，需不断付费升级(42.1%)；退订流程不够便捷，自动续费提醒不够明显(32.4%)等。\n\n　　张龙也遇到过AI工具收费复杂，算不清楚的情况。他举例，调用同一模型，官方API和国内的代理商价格差异较大，“某AI模型官方10元钱可能一天就用完，通过代理商20元钱能用几天，收费不太统一”。\n\n　　原田也表示，现在为AI工具充值，有时额度算不明白，Token、次数、时长混在一块儿卖。但原田也表示，如今AI确实为她的工作和生活赋能了，如果效果显著，她仍愿意为AI付费。“我的想法很简单，这钱花出去能帮我省时间或能让我赚回来，那就值。”\n\n　　“在使用高峰期，付费用户优先，而且免费版一天只能生成几张图，付费后几乎感觉不到限制。”张龙是从今年2月份开始接触AI的，最早用AI给孩子批改作业，后来发现它是个不错的生产力，就开始给AI付费辅助办公。付费前后，他最大的感受是模型调用权限和多模态输入的差别。“以前做跨境电商，语言方面沟通不顺畅，现在AI帮我连接邮箱回复客户，这一套流程下来很颠覆我的认知。”\n\n　　如今，张龙把AI当成自己创业路上的“隐形合伙人”，并打算一直付费使用。“虽说我现在用AI还没有实打实的收益，但它成为了我创业路上的一把‘万能钥匙’。只要AI继续以较低成本帮我生成文案、配图、剪辑视频，这笔钱就花得值。”\n\n　　什么情况下受访者会给AI续费？数据显示，49.3%的受访者表示要比免费版强一大截，不卡不扯谎；45.7%的受访者觉得要是办公学习的好帮手，极大提升效率。其他还有：赶上促销够便宜的时候，薅到就是赚到(38.2%)；同事/同学都在用，跟着大家一起买(21.8%)等。\n\n　　受访者中，05后占3.2%，00后占22.6%，95后占20.7%，90后占25.4%，85后占13.2%，80后占11.2%，其他占3.7%。男性占47.6%，女性占52.4%。\n\n　　(应受访者要求，张龙为化名)\n\n　　中青报·中青网记者 吴欣宇 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:曹子健】",

          "body": "秋假还没结束，雪假也来了。11月18日，河北省张家口市中小学迎来了首个雪假，不同学段错峰放假。此外，吉林省、内蒙古呼伦贝尔、新疆阿勒泰也陆续公布2026年雪假安排。\n\n　　根据各地安排，雪假多在12月，为3个工作日与周末自然连休，形成“3+2”或“2+3”的5天小长假。雪假主要针对义务教育阶段学生，部分地区明确，幼儿园、中职学校可参照执行。\n\n　　设立雪假，促进学生上冰上雪\n\n　　同样是雪假，各地的玩法却不一样。\r\n\n　　呼伦贝尔市要求，具备合格资质、规范运营的滑雪场，面向全市义务教育阶段学生提供每天3小时免费滑雪体验，包含全套雪具使用。冰雪资源不足的旗市区将加大体育馆、全民健身中心开放力度，免费提供旱地冰壶、陆地冰球等器材借用服务。\n\n　　东北师范大学教授杨卫安认为，雪假的价值，在于把冰雪从资源变成课程，让假期从学生休整变成个人成长。它是有组织、成体系的安排，填补了课堂内教学的实践短板。\n\n　　“雪假的核心不只是‘怎么玩’‘玩什么’，更重在‘如何系统性落地’。对学生来说，雪假不等于彻底告别课堂，而是要依托冰雪游玩实践，去户外体验，并感知冰雪文化。”中国传媒大学副教授柳帆说。\n\n　　沈阳体育学院教授董传升表示，这些年冰雪运动进校园，专业化与大众化相结合的冰雪运动赛事也不断出现。设立雪假，通过政府购买服务的形式，有利于促进中小学生上冰上雪。用免费体验的方式，激活家庭滑雪需求，促进冰雪资源优化配置，也补齐冰雪运动场地设施的短板。\n\n　　孩子有假，家长能陪，学校兜底\n\n　　2025年12月，吉林省首个雪假落地，当时为全省义务教育学校统一放假。效果立竿见影：雪假期间全省接待游客945万人次，出游总花费89亿元，同比分别增长119%和31%；酒店预订量暴涨147%，重点滑雪场亲子客群占比超过60%。\n\n　　“雪假为冰雪文旅创造了可深入接触的消费时段。”柳帆认为，雪假让本地及周边居民拥有充裕的错峰窗口，能够从容体验冰雪项目，实现从“打卡式游览”向沉浸式体验的转变。他表示，目前，雪假的实施区域主要集中于多雪地区，通过雪假可以释放冰雪出游需求，带动滑雪场、冰雪乐园、民宿、餐饮、文创产品等业态客流，拉长冰雪文旅消费链条。\n\n　　在吉林省首个雪假期间，热门雪场预约难、现场核验拥堵、瞬时客流集中等问题也随之出现。\n\n　　对此，2026年吉林省的雪假方案作出调整。雪假时间确定为每年12月1日至20日内，具体日期由各市(州)结合气象条件、教学进度、冰雪场地承载力和文旅接待能力统筹错峰安排。此外，今年雪假实现惠民升级，免费体验次数增加：学生免费滑雪滑冰从上一年的1次增加到3次，每次3小时；免费游览省内A级景区也从1次增加到3次。各县市区通过政府购买服务的方式承接，全省公共文博体育场馆面向中小学生免费延时开放。\n\n　　今年雪假期间，吉林省还鼓励各地各级机关企事业单位落实职工带薪休假制度，通过分段休假、错峰休假、调休等灵活方式，为有义务教育阶段子女的职工预留雪假休假窗口。\n\n　　尽管有这么多利好政策，家住吉林长春的张先生还是有些担忧。他和妻子在高校工作，雪假期间“肯定没法和孩子同步休假，可能还是和去年一样，带着孩子去单位”。\n\n　　针对家长带娃难题，新疆阿勒泰地区教育局要求，开展校内免费托管服务，针对雪假期间双职工家庭、留守儿童、困境家庭等不能参加研学的学生，各县(市)各学校开放自习室、图书馆、运动场馆等设施，提供免费托管服务。\n\n　　杨卫安建议，针对看护难和预约场地难等问题，学校可组织集体冰雪研学，统一预约场地，由教师、专业教练随队照护，无法陪同的家长可委托教练或亲属并签订委托书。在资源统筹上，对农村和偏远学校采取“送教下乡”、移动冰场、集中包车进雪场等方式，尽量把服务送到孩子身边；在安全保障上，统一购买运动意外险，配足专业教练与医护保障，建立预约调度机制防止扎堆。\n\n　　通过特色假期推动教育特色化发展\n\n　　近两年，各地陆续设立春假、秋假、雪假等特色假期。\n\n　　目前，有十余个省份的学校试点春秋假、雪假制度。在时间安排上，与清明、“五一”、中秋等法定假期“凑整”连放外，有些地方探索结合传统节日、地方风俗、气候特点设置放假时段，多为2至3天。\n\n　　2020年，教育部在答复相关建议时指出，在保证开足开齐国家规定课程，完成好正常教育教学任务和教学时长的前提下，学校放假时间包括春秋假时间由各地、高等学校结合实际做出具体安排。\n\n　　杨卫安说，这些假期都可以被当成“撬动教育特色化发展的杠杆”。他认为，应坚持“一地一策”，用好各地特色资源；提炼可复制的制度经验，逐步推广“特色假期+实践教育”模式。\n\n　　其他地区可用本地资源替代冰雪，如江南的水、西部的山、乡村的田野，形成春秋假、农忙假、雪假等多样化的实践样态。杨卫安建议：“国家层面可出台指导意见，明确假期时长、经费保障、课程标准和安全规范标准，把地方探索上升为相对固定的假期制度，让每个孩子都拥有‘属于自己家乡的假期’。”\n\n　　(本报记者 陈鹏） 【编辑:曹子健】",

          "body": "在《中华人民共和国个人信息保护法》实施5周年之际，最高人民检察院发布一批依法保护公民个人信息的典型案例，集中曝光了“开盒”网暴、非法获取倒卖信息等乱象，释放出对相关违法犯罪全链条从严惩治的鲜明信号，这些案例显示出公民个人信息安全面临很复杂的风险，需要引起高度重视。\r\n\n　　乱象悄然演变\n\n　　数字技术在给我们的生产生活带来便利的同时，也越来越多地被不法分子利用。当前，侵犯公民个人信息犯罪正悄然“进化”，呈现出链条升级、手段翻新、流向复杂等新特征。\n\n　　——犯罪链条产业化。上游非法获取、中游层层倒卖、下游变现牟利，环环相扣、分工严密，衍生出信息查询、非法跟踪、“开盒”滋扰等黑灰产服务，犯罪形态由个体零散作案转向流水线式协同作案。\n\n　　——窃取手段技术化。从侵入系统的脚本代码，到批量抓取的爬虫程序，再到贴身追踪的定位装置，各类技术工具越来越多地被不法分子用于实施信息窃取，相关犯罪活动呈现自动化、批量化新特点。\n\n　　——围猎目标精准化。不法分子紧盯求职者、老年人、追星族等群体，有针对性地设计诱骗话术，以“高薪招聘”“下乡代办”“明星行程”等为诱饵，大肆非法获取公民个人信息。\n\n　　——数据流转跨境化。境外“社工库”提供查询，境外服务器存放数据，利用虚拟货币结算资金……大量公民个人信息被违规转移出境，既为跨境违法犯罪输送“弹药”，也对我国数据安全构成现实威胁。\n\n　　风险不止眼前\n\n　　公民个人信息一旦流入黑灰产链条，往往会成为多种违法犯罪的“基础原料”，衍生出多重风险。\n\n　　——危及人身安全。“开盒”曝光个人身份信息极易引发网络暴力，突破线上边界侵扰现实生活，令人身心俱疲甚至危及人身安全。\n\n　　——威胁财产安全。个人财产信息外泄，将直接催生精准电信网络诈骗、敲诈勒索等违法犯罪活动，威胁人民群众的“钱袋子”。\n\n　　——危害公共安全。行业信息泄露可能会冲击行业管理秩序，医疗、交通等敏感信息外流，会给国家数据安全带来潜在隐患。\n\n　　各方共筑强防线\n\n　　守护公民个人信息安全，需要各方齐抓共管、共筑防线。\n\n　　——强管理。各类网络平台、企事业单位要完善权限管控、日志审计、数据脱敏机制，紧盯内部人员数据异常访问风险，堵住系统漏洞；落实信息采集最小必要原则，不超范围收集个人信息。\n\n　　——强防范。广大公民在日常上网、投递简历、线上登记、扫描授权时，坚持“非必要不提供”，谨慎开放APP权限，避免在社交平台上晒出证件、票据、定位等信息，不向陌生网友透露身份证号、行程安排等，网络聊天把握分寸，谨防“有心人”顺藤摸瓜。\n\n　　——强维权。广大公民若遭遇信息被非法查询、“开盒”网暴、精准骚扰等情况，应注意留存证据，及时向有关部门报案，维护自身合法权益。\n\n　　来源：国家安全部微信公众号 【编辑:曲克】",

          "body": "跳出打卡景点，一座城市还有哪些动人之处？烟火日常，会为城市文旅带来怎样不一样的底色？不久前，网络社区小红书在北京推出一系列线下活动，通过互动展、市集、沙龙等形式，展示Z世代视角下的城市之美，探讨城市如何借助生活化、个性化表达被更多人看见。\r\n\n　　跳出景点，看见日常\n\n　　走进首钢三高炉旧址，以“我们的城市聚会”为主题的互动展人头攒动。这不是一场静态展览，更像一处充满烟火气的公共客厅，可观赏、可互动、可参与。\n\n　　入口的时光长廊里，汇集了网友捕捉的生活瞬间：归途晚霞、胡同小店、晨练的人们、微公共艺术装置，一帧帧影像，串联起真实可触的日常生活。\n\n　　建筑师鲁雯泋喜欢在工作之余走街串巷，观察自己感兴趣的设计。此次，她带着北京胡同里的“野生设计集”来到展览：自制防雨插座罩、夹缝里开辟的停车位置、可收放的简易雨棚……所谓“野生设计”，指的就是这些出自居民之手的设计。通过她的分享，许多网友看到了北京胡同鲜为人知的趣味与巧思。\n\n　　“很多人觉得北京胡同里只有老房子，其实在不起眼的街巷边角，有许多居民设计的小改造，不仅鲜活有趣，而且藏着生活的智慧。”鲁雯泋说。在她看来，一座城市动人的内核，不只在知名地标与景区，也藏在日常生活中。\n\n　　展览上，创作者阿志的摄影组图“没有县城，万万不能”也引来不少关注。这组图记录了重庆奉节独特的山城风貌：高低错落的“8D魔幻”建筑、楼顶打太极的居民、街头的“摩的”司机，这些充满地域特色与生活气息的图片，发布以来吸引网友持续“围观”。评论区里不少人询问具体地点，表示将把这些地方列入旅行目的地清单。\n\n　　如今，与鲁雯泋、阿志一样，在小红书上分享城市观察的网友越来越多。数据显示，2026年以来，小红书用户每天发布的笔记中，带地点POI(Point of Interest，兴趣点)的内容已经超过1/10，越来越多人把线上的兴趣锚定到现实生活空间里。他们的观察与分享，让城市文旅跳出景点打卡，生长出更多烟火日常与原生诗意。\n\n　　不只打卡，还要体验\n\n　　除了好看又好玩的互动展，此次活动还举办了“聚一聚”市集，北京绒花、陕西非遗民艺、山东拼布花瓶、植物标本手作……近百个摊位里，近一半都是从小红书社区里成长起来的中小微创作者和商家。\n\n　　来自山西汾阳的非遗剪纸传承人张佳琪，此次带来她的“豆豆剪纸国风首饰”，摊位前人气十足。这些首饰把剪纸和热缩片相结合，首饰造型既有龙凤呈祥、缠枝双棠等传统剪纸纹样，也有取材自壁画、古诗、生肖、十二星座的创意纹样。本次市集，她带来新款产品，刚一开摊，就有线上粉丝专程赶来购买。\n\n　　这样线上结缘、线下相逢的故事，也折射出当下旅行观念的转变。数据显示，今年国庆假期，手作、访古、户外等体验型旅行在小红书的搜索量环比增长48%，增速是打卡型旅行的1.6倍。游客不再满足于在热门打卡点拍一张照片，而是想在一座城市里有所遇见、有所体验。\n\n　　“对年轻人来说，去哪里很重要，在这个地方能做什么更重要。”小红书乐活探索业务负责人王淑君表示，目前小红书上粉丝千人以上的旅游类创作者有26万个，月均新增旅游笔记2100万篇，80%的用户出行前会在小红书上搜索。大众旅行需求正走向具体、走向深度。\n\n　　数据显示，人文古建是小红书旅游类目搜索增速最快的类别，县城相关搜索增速则是旅游品类整体的2.8倍，如贵州兴义、吉林辉南、福建东山等小城，陆续进入年轻人的出行清单。有人专程赶赴江西景德镇，请假10天沉浸式学习陶艺；云南的古法造纸、扎染、山野采菌等体验，也让“云南是个巨大的兴趣班”成为游客新的到访理由。\n\n　　破圈之后，如何长红\n\n　　城市被看见后，如何从“网红”走向“长红”？此次活动特别邀请地方文旅、文化运营、媒体和学界嘉宾，围绕这个话题展开讨论。\n\n　　北京大学城市与环境学院旅游研究与规划中心主任戴林琳认为，旅游城市首先是一座生活城市，既要值得远道而来，也要值得在这里生活。“小红书等网络平台给的是第一次到访的理由，但城市回答的是一千次到访的理由。”\n\n　　她把城市能做的工作概括为：文化有根、体验有场、消费有路、服务有度、治理有责。城市未必能预定风口，“能做的是练好内功，当风口来的时候，可以很好地接住”。\n\n　　景德镇陶溪川文创街区一年举办几百场文化活动，持续激活城市活力。“生活是剧本，城市是舞台。”景德镇陶邑文化发展有限公司董事长刚好认为：“网络平台是在地文化走进大众视野的重要载体，文旅主管者、运营者要做的，是和在这片土地上生长的人一起，把传统文化、在地生产方式和生活方式‘转译’成游客感兴趣的内容。”\n\n　　城市传播从“网红”到“长红”，平台责任也十分重要。“屏幕上的排序与推荐，最终会落到街道中。”戴林琳说，平台在分配注意力资源时，不仅要展示哪里有吸引力，“还要让真实的风险与责任同样可见”。\n\n　　“一座城市的故事，不能只靠官方讲述，小店店主、手艺人、普通居民、乡土守护者，都是讲述者。想吸引游客，不一定需要再造一个新地标，而是要重新梳理那些本就存在、却还没有被讲清楚的生活。”王淑君表示，平台参与城市长期发展，重在做游客需求的“雷达”，帮城市理解人们为什么想来、又在哪些细节上犹豫。\n\n　　“长红”的城市应该是什么样子？刚好认为，应该具备三点：审美在线、不断创新，以及城市各方有效协同的循环机制。无忧传媒市场品牌副总裁郭嘉认为，“长红”要靠不断学习、不断迭代，城市要向内求，成为独特的自己。山西大同文旅项目东南邑主理人夏滔说，热度之后，城市留下的不应该只是流量与好看的数据，而是“让一个城市的人有持续创造美好生活的能力”。\n\n　　与会嘉宾普遍认为，城市文旅的“长红”之道，关键在于跳出流量思维，扎根在地生活、涵养本土文脉，善用线上生态讲好多元鲜活的城市故事。把一时的打卡热度，转化为城市源源不断的内生活力，方能实现热度可持续、文化可传播。(郑娜 陈婉儿) 【编辑:曹子健】",

          "body": "每逢測考季節，不少家長都要化身「全職補習導師」，陪伴子女挑燈夜戰。面對繁重的學業壓力，很多時候孩子只會死記硬背，結果「輸入得多、提取不出」，考前更是壓力山大。育有兩名兒子的Nana媽媽（長子初中、次子小五）一直主理兩子的溫習大業，她認為溫習不應是苦差，只要從做筆記開始幫孩子建立自主學習態度，結合科學的記憶與溫習策略，就能讓學習變得輕鬆且有成就感。\n（圖片來源：Shutterstock）\n做筆記是自學基石\n很多孩子溫習時最大的盲點就是抓不到重點，面對龐雜資訊無從下手。Nana媽媽特別推介源自美國康乃爾大學的「康乃爾筆記法」，這方法將每頁筆記劃分為「筆記欄（記錄課堂重點）」、「索引欄（關鍵字與提問）」及「總結欄（以自己的文字濃縮精華）」三大板塊。\n傳統的抄寫只是單向輸入，而康乃爾筆記能在記錄時迫使孩子進行篩選與濃縮。Nana媽媽直言：「成績好是有足夠輸出，而死記硬背只是輸入，孩子根本不清楚自己是否真正『識書』，考試便提不出正確答案。」溫習時，孩子只需遮蔽筆記內容，透過「索引欄」與「總結欄」自我提問，就能輕鬆檢視自己是否真正掌握知識。\n對於年紀較小的初小學童，Nana媽媽鼓勵家長趁放假與孩子一起探索：「初小孩子還未懂太多字，可以剪貼圖片或畫畫，甚至把書上的內容印出來貼上，順道當心智圖用；家長更可以一起做筆記，孩子負責畫圖、家長輔以文字說明，讓孩子感受到互動樂趣。」從小培養整理思維的好習慣，升上高小就能自然建立自動做筆記的態度。\n2大高效記憶法\n在筆記之外，Nana媽媽還活用了兩種針對不同性格孩子的科學溫習法，幫他們將短期記憶鞏固為長期記憶。\n 間隔重複學習法（對抗遺忘曲線）\n 針對需要記憶大量史料或概念的學科，Nana媽媽運用了根據「艾賓浩斯遺忘曲線」設計的學習法。大腦有其遺忘規律，在記憶消退前的關鍵時間點安排規律的重溫，能有效對抗遺忘，將短期記憶轉化為長期記憶。\n\n 費曼學習法（以教代學）\n 面對需要融會貫通的內容，Nana媽媽的長子在升中後採用了諾貝爾物理學獎得主理查·費曼提出的學習法——如果能用簡單到小學生都聽得懂的話把複雜概念解釋清楚，才代表真正學懂。Nana媽媽建議讓孩子扮演小老師，把課本內容「講」給家長或公仔聽，甚至對着鏡頭像KOL般拍片。「朋友的女兒科學科本來不合格，媽媽教她把公仔當學 生『講書』給它們聽，結果成績從3字頭進步到6字頭！這個過程很輕鬆，孩子認為自己厲害又有滿 足感，自然大大提升信心。」\n\n除了上述兩種方法外，面對專注力較短、較少耐性的次子，Nana媽媽則會靈活搭配「番茄工作法」。她安排孩子專心溫習20分鐘後休息5分鐘，將龐大的溫習目標拆解成小段落完成，並特別建議使用獨立計時器代替手機，防止孩子因查看手機訊息而分心。\n5大溫習貼士\n好的方法需要良好的心理與生活習慣輔助，Nana媽媽總結了以下5個實用貼士，幫爸媽在家營造高效溫習環境。\n 正向心理建設與清晰時間表\n Nana媽媽強調：「高效學習，切忌臨急抱佛腳。」平時應與孩子以開放態度共同制定「溫習進度時間表」，利用日曆或紙卡清楚寫下每日目標與學科進度，培養孩子的責任感與自主性。\n\n 尊重孩子的獨特學習模式\n 「每位孩子的學習模式不一，家長應尊重其獨特的天賦，提醒自己毋須比較。」視覺型孩子善於睇圖與心智圖，聽覺型適合朗讀與互相提問，觸覺型則需要透過實際操作來學習。家長應順應天賦，切忌誤以為觸覺型孩子「坐唔定」就是不專心。\n\n 提供大腦營養與適量運動\n 溫習期間安排適量運動有助大腦釋放多巴胺與腦內啡，能有效紓緩壓力並提升行動力；同時可補充如Omega-3、DHA等營養素，加強專注力。\n\n 拒絕過度密集操練\n Nana媽媽提醒：「越多操練，反使效果越差。過度用腦，容易出現暫時性腦海空白、無法專注。」準備過量補充練習只會帶來沉重壓力，應給予充足睡眠與休息時間，讓大腦有時間重整資訊。\n\n 經營緊密的親子關係\n Nana媽媽提倡「先處理情緒，後處理事情」。家長言語上的讚賞與正向鼓勵極為重要，多擁抱孩子或進行睡前按摩，有助產生催產素，增加信任感與依戀感，讓親子在溫習期間和平共處。\n\nNana媽媽最後提醒家長不宜將注意力全集中在孩子身上。「適時放手，讓孩子成長，才不會令他們過分依賴家長而導致沒有責任感。保持身心平衡，有良好心態應付考試，才能事半功倍。」",

          "body": "2026年文憑試其中一名狀元有意入讀香港大學社會科學學士（政治學與法學）及法學士雙學位課程，成為尖子中的特例。呂大樂指，教授社會科學課題最重要是從學生的興趣出發，啟發他們對身邊事物感到好奇，進而探索自身可能性。他又形容對人工智能（AI）「又愛又恨」，最擔心是學生將思考過程也交給AI進行。\n社科屬「一理通百理明」\n由方大舊生王信明設計的Molly人偶及其他同期產品曾「沉沒」一段時間，近年又再冒起，呂大樂認為難論其成敗。資料圖片\n呂大樂指社會科學屬「一理通百理明」，存在不同角度和層次的觀點，教學上最重要是從學生的興趣出發，引導他們提出有意義的問題、打開他們的眼界，增加學生對周邊人和事的好奇心，並產生興趣與關懷，從而自行探索與洞悉可能性，「現在確實是面對挑戰，學生們對很多事情欠缺好奇，如何提高是需要思考的，因為如果連好奇心也欠缺，後面的就不存在了」。\n延伸閱讀︰方大署理副校長 社會學學者呂大樂展開研究 探討「弱勢中學」角色與價值︱專訪\n他舉例稱，最近因在撰寫有關創意設計的報告而閱讀有關Labubu的書籍，提到由方大設計學系舊生王信明設計的Molly人偶及其他同期產品，剛推出時雖曾爆紅，但之後無以為繼，惟近年因應泡泡瑪特而再次冒起，「我有興趣的是創意環境如何出現？如何總結1998至2000年代曾經火爆、但又消失的東西的成敗？」\n面對急速發展、影響無遠弗屆的AI，呂大樂坦言對AI「又愛又恨」，雖有助於撰寫論文摘要或修飾文法，但擔心剝奪學生的思考能力。呂大樂憶述，約兩年前有學生在論文聲稱引用他的文章，「看他的參考書目，我沒在那刊物上寫過這文章啊？他從哪兒找出來的？」他笑言學生最少應翻閱刊物的目錄，「連它（文章）存在與否都不知道就應用了？」\n延伸閱讀︰五年規劃、施政報告2026︱方大：重視產學研結合 期望使用北都大學城共享設施\n他直言，現在已經「很難不鼓勵使用AI」，教師須引導學生如何活用，最擔心是學生撰寫文章的框架與大綱均是AI生成，「（AI）將完成了的東西做得更好當然沒問題，但如果想都不想、由它代替自己去想，第一步都沒做到就不行了」。\n記者：歐文瀚",

          "url": "https://www.stheadline.com/edu-insights/3638644/方大署理副校長-社會學學者呂大樂展開研究-探討弱勢中學角色與價值專訪",

          "body": "提出「四代香港人」而聞名的本地社會學學者呂大樂，加盟聖方濟各大學出任社會科學院教授，日前更獲委任為署理副校長（研究及發展）。他接受《星島教育》專訪時表示，大專教學環境及大學生需要正在改變，不同院校學生能力和學習方法不同，需要因材施教，讓他們明白講課內容。他透露，將針對本港的「弱勢中學」展開研究，釐清在教育體系內的角色，與在「主流學校」以外的獨特價值。\n訪校發現運作殊不簡單\n呂大樂加盟聖方濟各大學出任社會科學院教授，日前更獲委任為署理副校長（研究及發展）。\n呂大樂形容，教育制度殘忍，只要收生不足，學校便面對縮班等措施，增加運作難度。\n過去先後於香港大學、中文大學及教育大學任教的呂大樂表示，約一年前與方大校長張仁良交流時，對方談到希望協助在中學或高等教育系統內，面對挑戰學生的需要，「他們考試成績不是最標青，那麼他們的未來學習如何？怎樣提升自己？」雙方由此談到更多共同興趣和關懷，應張仁良邀請加盟方大。他指，大專教學環境以外，大學生需要正在改變，例如社會以往可能認為喋喋不休3小時、讓學生不斷抄寫筆記的大學教授才是「最好的教授」，現在則需要因地制宜，做好傳播訊息和完成教學，讓學生知悉課堂的重點。\n延伸閱讀︰方大宣布任命呂大樂為署理副校長（研究及發展）\n他舉例指，早前受邀出席另一間大學迎新項目時，須講約45分鐘香港社會和歷史，過去參與TED Talk時，亦須於18分鐘內完成演講，「聽眾可能18分鐘後已雲遊了，所以要在18分鐘內講完最重要的內容，讓他們離開時有東西帶走；如果尾聲仍未能讓他們知悉演講重點，在現今環境下應該是我的失敗」。他指，作為社會科學系教授，如未能令非主修該科的學生或前線工作者明白，就應該自我檢討。他亦坦言，自己中學生涯數學科長期不及格，嘗過讀書不順利，「好處就是明白對着最弱的人時，如何講才能讓他們明白」。\n對於加盟後的研究大計，呂大樂透露近期展開研究，探討被列為第三組別（Band 3）中學的「弱勢學校」在本港教育系統內的角色。他前年應邀訪問本港48間這類中學，發現學校運作殊不簡單，「弱勢的不止學習，亦包括家庭和文化背景等因素，還有非華語和特殊需要的同學」，即使學校未必能使他們成績躍進，仍會盡力照顧學生，「大部分學生準時上學、有參加學校活動，我覺得一點都不簡單」。\n教育制度殘忍 改變不易\n呂大樂坦言，家長未必願意子女入讀，令這些學校面對收生等挑戰，但學校面對部分學生不喜歡讀書，或未「開竅」致成績不理想，仍繼續幫助他們成長，部分學生更成功入讀八大，舉例指有坊間俗稱「武館」的學校，亦有學生於文憑試考獲兩科5**，或因創意媒體表現優秀而循校長推薦計劃入讀本港三大。\n延伸閱讀︰學齡人口續跌 教局推算2034年起中一新生少於小一 2035年僅32300人升中\n他相信這類照顧學生的學校「在教育系統內是很重要」，但教育制度本身殘忍，只要學校收生不足就面對縮班等措施，增加運作難度，「社會一般也不太關心這些學校，或思考如何令學生們更獲益」；學校只能錄取表現較遜色的學生，亦影響學校進步的幅度，即使想要改變也不易走，「有些（學校）可能想升Band 2，但需要更多考試操練，很多學生就未必做到，所以重點是如何提供多元化路徑，令弱勢學校能『拔尖保底』，弱的同學也能有自己的人生、對自己的期望和看法。」\n呂大樂憶述，早前到訪油尖旺區一間中學，一名新移民母親對兒子成功獲取錄喜上眉梢，因不像內地學習環境，成績追不上就會被忽視，「她的兒子讀書不好，但他入學後很開心，參加了很多活動，明顯看到他進步和更開朗」。他相信，這正是教育制度需要的元素，「考試表現不好，學生也能有其他途徑建立自信和責任感」。\n「小事」成新作題材描繪地道生活文化\n呂大樂正籌備新書，探討看似「小事」的香港地道生活文化。\n呂大樂舉例稱，本港的茶餐廳食物和飲品的配搭可多達數十種，食客又會不時改變是否接受「搭枱」。\n除了教學，呂大樂近年亦持續出版新著作。他透露，下一本推出的新書將會討論香港多項看似「小事」的地道生活文化，例如茶餐廳食物搭配、「搭枱」以至乘車時的行為等。對於是否擔心研究時事會遇到外來壓力，呂大樂坦言暫時未面對相關問題，認為重點是保持客觀中立，提出足夠理據說明。\n今年初參與出版《香港．處境．記述》的呂大樂表示，下一本新書將會討論香港的地道生活文化，以及相關的文化底蘊。他指新來港的內地生不時會提問︰「香港人到底一日內會說多少次『唔該』？」既會疑惑一頓飯期間會說多少次，更發現這是與陌生人打開話題的方法之一。\n延伸閱讀︰呂大樂對AI「又愛又恨」 須引導學生如何活用︱專訪\n他續稱，本港的茶餐廳文化相當奇特，食物及其煮法和飲品的配搭可多達數十種，「在日本的餐廳不會有這樣多花款，但香港茶餐廳如果沒提供這些選擇，就是服務不行」，食客又會因應時間而改變是否接受「搭枱」。此外，港人乘坐港鐵時大多不會佔據優先座，乘坐電梯或交通工具時也會盡力不去觸碰其他人，「到底港人是否這些優先已是『內化』成一套文明，還是只於不同程度上認為是『樣衰』而不做？」希望通過新作介紹貌似「小事」的香港生活點滴。\n教研保持客觀中立\n近年不少涉及時事的研究均聲稱受到壓力，呂大樂承認近年社會大環境轉變，但最重要是教學和研究時保持客觀中立，在提出批評的同時，提出理據解釋。他舉例指，如覺得社會忽視弱勢學校，就要尋找證據佐證；又如社會對香港經濟是否復甦議論紛紛，「其中一個問題是︰年輕人是否感到機會增加了？這就要去了解，不能低估人們的主觀感受，因為『新機會』可能與某些人永遠無關」。\n呂大樂指，評論作者都有被批評的機會，不應因被批評就改口，「你不可以說自己因為是做研究和寫社會評論的人，就不能接受別人在背後指指點點或作出反擊，甚至叫你不能說」，如果覺得自己的意見沒錯，就應繼續豐富理據。\n記者：歐文瀚 攝影：盧江球 部分圖片：星島圖片庫",

          "size": 1,
          "keywords": [],
          "body": "​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台，聯同投資推廣署和香港貿易發展局（貿發局），以及香港科技園公司，在芬蘭赫爾辛基舉行的Slush 2026上，舉辦題為「下一站亞洲：透過香港拓展創科業務」的研討會，介紹香港的創新科技（創科）發展，以及香港為有意拓展亞洲市場的北歐初創企業提供的機遇。\n\n　　駐倫敦經貿辦處長周雪梅在研討會上致辭，介紹香港為北歐企業拓展亞洲市場的重要平台。她表示，香港匯聚國際人才、科技和資本，並協助企業把握中國內地，特別是粵港澳大灣區（大灣區）和其他亞洲市場的發展機遇。\n\n　　周雪梅亦介紹在《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》下，香港發展成為國際創科中心的願景。她指出，香港正積極推進「三大創科園區、五大研發機構」的建設，並投放大量資源，進一步完善創科生態圈，加快科研成果轉化，開拓更多商業機遇。\n\n　　她亦介紹北部都會區，指出這項重大發展計劃將為創新發展和跨境合作帶來新機遇。她指出，區內的河套深港科技創新合作區香港園區——港深創新及科技園（港深創科園）和新田科技城相互配合，推動研發、成果轉化及產業發展。她亦介紹港深創科園與毗鄰深圳園區所採用的「一河兩岸、一區兩園」獨特跨境合作模式。這個模式為北歐企業提供良機，讓它們在香港設立據點，善用香港「一國兩制」下的獨特優勢，與香港及深圳的科研機構和創科夥伴合作，並充分利用大灣區的科技和製造業資源。\n\n　　投資推廣署創新及科技，生命與健康科學總裁黃煒卓亦於研討會上以「香港作為通往中國及更廣泛亞洲地區商機的門戶（從科技創投角度出發）」為題發表演講。另外，貿發局、香港科技園公司及兩間北歐企業代表在爐邊對談環節中，分享他們對香港創科領域的最新發展、海外企業可把握的機遇，以及行業未來發展前景的見解。講者亦結合自身經驗和專業知識，探討北歐初創企業進軍香港市場、尋找合適合作夥伴，以及進一步拓展亞洲市場時需要考慮的實際因素。\n\n　　駐倫敦經貿辦會繼續與投資推廣署、貿發局及香港科技園公司緊密合作，推廣香港的創科發展，促進香港與北歐創科企業之間的合作。\n\n　　Slush是年度的全球初創盛會，在赫爾辛基舉行，匯聚來自世界各地初創企業創辦人、投資者及科技與創業生態圈的其他成員，為參與者提供交流經驗，以及與潛在投資者及商業夥伴建立聯繫的平台。",

          "summary": "​以下是政務司司長陳國基今日（十一月十八日）在立法會會議上根據《基本法》第七十三條第（七）項及《香港終審法院條例》第7A條動議有關委任香港終審法院的其他普通法適用地區法官的擬議決議案的總結發言：  主…",
          "summary_short": "​以下是政務司司長陳國基今日（十一月十八日）在立法會會議上根據《基本法》第七十三條第（七）項及《香港終審法院條例》第7A…",

          "body": "​以下是政務司司長陳國基今日（十一月十八日）在立法會會議上根據《基本法》第七十三條第（七）項及《香港終審法院條例》第7A條動議有關委任香港終審法院的其他普通法適用地區法官的擬議決議案的總結發言：\n\n主席：\n\n　　我衷心感謝剛才四位議員就任命終審法院其他普通法適用地區非常任法官提出的寶貴意見，也多謝各位議員支持任命區諾德爵士。\n\n香港的國際法律中心地位\n\n　　香港的國際法律中心地位，在國家「十五五」規劃得到明確支持，而《香港第一個五年規劃》其中一個主要目標，是善用普通法制度獨特優勢，深化國際法律中心地位。\n\n　　區諾德爵士與其他在任的終審法院非常任普通法法官一樣，都是享負盛名的普通法專家。委任這些傑出的海外法官，讓他們參與終審法院聆訊的工作，充分顯示他們對香‍港司法制度及司法獨立的信心，亦促進不同司法管轄區法官的相互交流、互相啓發、精益求精，實實在在發揮香港在「一國兩制」下作為國家唯一普通法管轄區的優勢。\n\n　　我們要積極向外宣揚香港這優點。特區政府也在持續做這方面的推廣。\n\n　　律政司本月初舉行的年度旗艦盛事香港法律周，正正向國際法律界人士展現香港作為國際法律樞紐的領導地位。隨着國際統一私法協會亞太聯絡辦公室在香港開幕，「國際私法三姊妹」，即國際統一私法協會、海牙國際私法會議，以及聯合國國際貿易法委員會都已全數落戶香港，加上其他國際組織，例如國際調解院的成立，充分彰顯國際社會對香港法治的高度信賴。而我們今次再度任命海外資深法官加入終審法院，亦一再證明了國際法律界對香港特區司法制度與法治質素的高度認可與信任。\n\n法官的來源\n\n　　我很多謝何君堯議員剛才提到是否可以任命來自更多普通法適用地區的法官。\n\n　　《基本法》第82條和《香港終審法院條例》第‍5（3）條規定：終審法院可按需要邀請其他普通法適用地區的法官參‍加終審法院的審判。《香港終審法院條例》亦規定：在聆‍訊及裁決上訴案件的終審法院法官當中，必須包括一名非常任法‍官。根據《香港終審法院條例》的規定挑選及邀請非常任法‍官參與聆訊，實屬行使《基本法》所賦予獨立司法權力的其中一環。\n\n　　一直以來，司法機構都是按《基本法》的規定，根據法官本人的司法和專業才能，從本地及其他普通法適用地區考慮聘用個別人士到終審法院服務。現‍時，終審法院共有九名非常任法官，包括四名非常任香港法官和五名非常任普通法法官，他們來自英國、澳洲和新西蘭，在這些地方具備豐富的司法履歷及經驗，專業地位和聲譽崇高。在唯才是用的大前提下，如有具備頂尖優秀司法和專業才能的合適人選，來自其他普通法適用地區的法官亦會獲考慮。司法機構會繼續留意終審法院的運作需要，並在適當時候向獨立的司法人員推薦委員會作出建議。\n\n獨立的司法制度\n\n　　司法機構一直致力維護香港的法治精神，以及受《基本法》保‍障的獨立司法制度。法官和司法人員的憲制職責，是在行使其司法權力時，須獨立和專業地以法律和證‍據為依據，以無懼、無偏、無私、無欺之精‍神，嚴格根據法律原則，維持司法公義。經過多年來的實踐，終審法院已在國際上確立堅實的地位，成為普通法世界中頂尖卓越的最終上訴法‍院；當中，一眾非常任普通法法官的卓越貢獻，是廣獲認同的。\n\n結語\n\n　　主席，終審法院審理的案件涉及不同的法律範疇，非常任普通法法官過去參與審理的案件包括：刑事法、民事實務及程‍序、行政法、仲裁、商業法、土地法、稅務法等等。多年來，這些海外法官對香港維持高水平的司法制度和鞏固本港司法體系高度國際化的優勢，貢獻良多。\n\n　　區諾德爵士在國際司法界地位崇高，其專業造詣與聲望橫跨眾多法律領域。特區政府同意司法人員推薦委員會的建議，並相信這項任命將使終審法院的非常任法官陣容更為堅實，維持終審法院的最高司法水平。\n\n　　我懇請各位議員同意這項任命。多謝主席。",

          "title": "設計營商周2026及DesignInspire創意設計博覽開幕",
          "url": "https://www.info.gov.hk/gia/general/202611/18/P2026111800257.htm",
          "summary": "設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。",
          "summary_short": "設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。",
          "digest": "設計營商周2026及DesignInspire創意設計博覽舉行開幕典禮",
          "points": [
            "連同城區活動「設計@HKG」2026及「deTour 2026設計節」…",
            "文化體育及旅遊局局長羅淑佩今日出席設計營商周2026開幕典禮及DesignInspire創意…",
            "政府將繼續推動設計及創意產業發展，進一步鞏固香港作為中外文化藝術交流中心的地位"
          ],
          "section": "政府公布",
          "category": "",

          "size": 1,
          "keywords": [],
          "body": "設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。連同城區活動「設計@HKG」2026及「deTour 2026設計節」，這四項由文化體育及旅遊局轄下文創產業發展處資助的大型設計主題活動由即日至十一月二十九日先後或同期在香港舉行，匯聚本地及國際設計師、創意領袖、企業及品牌，為香港注入國際創意力量，將多元創意體驗帶進社區不同角落。\n\n  文化體育及旅遊局局長羅淑佩今日出席設計營商周2026開幕典禮及DesignInspire創意設計博覽交流酒會時表示，兩項活動均展現香港在連繫全球創意人才、促進跨文化交流及商業協作方面的獨特優勢。政府將繼續推動設計及創意產業發展，進一步鞏固香港作為中外文化藝術交流中心的地位。\n\n  設計營商周由香港設計中心主辦，並由瑞士擔任今屆峰會的夥伴國家。活動以「設計共話：從連繫到蛻變」為主題，匯聚超過60位來自瑞士、捷克、韓國、德國等地，以及中國內地和香港的創意領袖與商業決策者，今日起一連三日圍繞多個關鍵議題展開深入討論。\n\n  由香港貿易發展局主辦的DesignInspire創意設計博覽今日至十一月二十一日舉行。今屆展會以「Wander & Wonder」為主題，匯聚來自17個國家及地區、超過200個參展商，透過展覽、講座、工作坊及商業對接活動等，以設計串連文化、產業與日常生活，連結設計師、品牌、買家、設計愛好者及公眾。焦點節目包括由香港藝術家策劃的「Cabinets of Wonders」、由瑞士設計工作室創作的「Breathing in Motion」、由米蘭國際家具展Salone del Mobile.Milano呈獻的「ABITO/HK」以及由香港燈光設計師和室內設計師策劃的「House of Lumière」。\n\n  此外，香港設計中心今晚於DX設計館舉辦「炫彩香港」活動，慶祝DX設計館成立兩周年並為七個新展覽開幕。文創產業專員黎細明出席開幕儀式。\n\n  各項活動為業界和廣大市民帶來一場全城設計盛會，也匯聚香港及國際創意人才與資源，促進跨界別和跨文化交流，推動香港成為亞洲創意之都。所有公眾展覽均免費入場，歡迎市民親臨參觀，更多有關活動的資訊，請瀏覽以下網頁：\n\n設計營商周：2026.bodw.com/zh-hk\n\n設計@HKG：designathkg.com/zh\n\nDesignInspire：designinspire.hktdc.com/tc\n\ndeTour 2026設計節（十一月二十日開幕）：main.detour.hk/zh-hk\n\n炫彩香港： www.hkdesigncentre.org/tc",
          "image": "",
          "video": "",
          "video_poster": "",
          "lang": "zh-Hant"
        },

          "summary": "食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮獲金獎和銅獎。",
          "summary_short": "食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮…",
          "digest": "食物環境衞生署發言人表示…",
          "points": [
            "食物環境衞生署（食環署）發言人今日（十一月十八日）表示…",
            "獲得金獎的觀塘區鯉魚門（嶺南新村）公廁採用了「廁世代PT 2.0．公廁設計比賽」的得獎設計概…",
            "該公廁貫徹「以人為本」的設計理念，內部空間寬敞，並設有配備自動門的暢通易達洗手間和通用洗手間"
          ],
          "section": "政府公布",
          "category": "",
          "source": "hkgov",
          "source_display": "香港政府新闻公报",
          "published_at": "2026-11-18T23:00:00+08:00",
          "size": 1,
          "keywords": [],
          "body": "食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮獲金獎和銅獎。\n\n　　獲得金獎的觀塘區鯉魚門（嶺南新村）公廁採用了「廁世代PT 2.0．公廁設計比賽」的得獎設計概念，以「管水母」為靈感，透過靈活組合的模組化結構，完美配合不同地形和環境，將創意融入公共設施中。該公廁貫徹「以人為本」的設計理念，內部空間寬敞，並設有配備自動門的暢通易達洗手間和通用洗手間；公廁外亦設有飲水機，方便市民和旅客使用。公廁亦已裝設智能監察系統，實時監測異味並自動通報，提升衞生水平和管理效率，並透過非接觸式意見回饋系統，收集使用者的意見，作為改善服務和未來規劃的參考。此外，其暢通易達洗手間更設有智能意外感應系統，偵測跌倒和異常停留情況，以便適時提供協助。\n\n　　至於獲得銅獎的南區香港仔大道公廁，翻新後以溫暖的大地色系配搭簡潔俐落的線條設計，展現獨特的現代美學。該公廁內設有供兒童和長者使用的設施，照顧不同年齡使用者的需要。\n\n　　發言人說：「食環署一直採取多管齊下的方式，包括引入新科技，提升轄下公廁的設施、管理和衞生水平，並在設計上照顧不同使用者的需要。食環署轄下公廁屢獲殊榮，反映署方持續提升公廁服務的工作得到肯定，值得鼓舞。要長期保持公廁乾淨舒適，亦有賴前線人員用心清潔和管理，署方感謝他們的努力和貢獻。」\n\n　　食環署早前已留意到荃灣區柴灣角公廁內部分位置傳出異味，並即時通知相關部門安排維修。署方已在公廁附近加設流動廁所，並會在公廁維修工程完成前加強流動廁所的清潔工作，同時要求相關部門加快維修損壞的設施。此外，為改善大橋村公廁和通州街公廁的設施，食環署已將兩間公廁納入翻新計劃，除了要求承辦商加強清潔工作，亦會密切監察承辦商的服務表現。\n\n　　現時，食環署管理逾800所公廁，近年積極夥拍建築署推展優化公廁翻新計劃。在2019年推行該計劃前，約有110所公廁已率先展開翻新。在計劃涵蓋其餘約700所公廁中，目前已有近八成半展開工程，其中逾250所的工程已順利竣工。署方目標在2028年年底前，全面為餘下約110所公廁開展翻新工程。\n\n　　採納香港城市大學顧問報告的建議，食環署自2023年起，已於使用量高的新建或翻新公廁落實 1:2.32 的男女廁格比例標準。對於使用量不高或偏遠的公廁，則會視乎場地環境、空間限制及實際運作需要而靈活調整。\n\n　　發言人表示，食環署一直致力改善公共衞生環境，未來會持續加強轄下公廁的清潔和管理，並積極引入智慧科技和人性化配套，從軟件和硬件入手推動公廁現代化，為市民和旅客提供更優質的公廁環境。署方亦呼籲市民和訪客愛惜公廁設施、保持清潔，共同維護城市公共衞生。",

          "body": "以下是教育局局長蔡若蓮博士今日（十一月十八日）在立法會會議就「深化國際教育樞紐建設，構建國際升學首選地」議員議案的開場發言全文：\n\n主席：\n\n　　感謝范凱傑議員提出議案，鄧飛議員、李家駒議員、陳勇議員、陳穎欣議員提出修正案，就「深化國際教育樞紐建設，構建國際升學首選地」提出具體並有建設性的意見和建議。\n\n　　教育是國之大計。當前，國家正全面推進教育強國建設，「十五五」規劃明確提出教育、科技、人才一體化發展的戰略部署。香港在「一國兩制」下的獨特優勢，配合科教興國戰略，對接及服務國家發展大局，建設香港成為國際教育樞紐及高端人才集聚高地。\n\n　　香港教育質素享譽國際，加上高度國際化環境和良好的治安水平，讓香港成為世界各地優秀學生的理想留學地。去年，香港教育競爭力位列全球第三，而在今年接連公布的泰晤士高等教育（THE）二○二七年世界大學排名以及Quacquarelli Symonds（QS）二○二七年亞洲大學排名中，本地院校亦持續獲得高度評價，分別有五所大學位列世界百強，以及有五所大學躋身亞洲十強，其中三間大學更同時登上亞洲五強，反映高等教育的實力以及香港特區政府持續投入資源及推行各項措施的成果。\n\n建設香港成為國際教育樞紐\n\n　　為發揮香港高等教育的獨特優勢，我們構建「留學香港」的組合政策，制定具前瞻性、全局性及戰略性的策略，包括：統籌專班的組織保障、遊學與品牌宣傳、收生與獎學金，以及宿舍與留才支撐等，進一步深化國際教育樞紐建設。\n\n　　在統籌協調方面，教育局成立了留學香港專班，統籌大學教育資助委員會（教資會）、創新科技及工業局／創新科技署、勞工及福利局／香港人才服務辦公室、經濟貿易辦事處和政制及內地事務局／駐內地辦事處的工作，吸引全球優秀人才及學者來港升學和進行研究。\n\n「留學香港 」和「遊學香港」品牌\n\n　　同時，政府致力打造「留學香港」和「遊學香港」品牌，促進本地專上教育界擴容提質，組織首屆「留學香港周」，舉辦亞太國際教育協會年會暨展覽（APAIE 2026），吸引來自72個國家及地區、超過600間大學及機構參展，逾 3 500名國際教育界翹楚及專家齊聚香江。最近，又接連舉辦全球大學校長及領袖高峰會和世界頂尖大學校長論壇，匯聚來自全球頂尖大學及機構的高等教育領袖，其間，多所國內外頂尖學府與機構簽署合作協議，標誌了香港在全球高等教育界的地位和號召力。\n\n　　另外，政府鼓勵專上院校舉辧高增值的遊學產品，吸引中外學生參與。通過優質遊學體驗，加深學生對香港和對香港高等教育的認知與嚮往，拓展生源渠道，匯聚人才。今年暑假，八所資助大學合共舉辦超過100項「遊學香港」暑期課程、宿營、交流團等，反應非常熱烈。\n\n　　目前，修讀教資會資助課程的非本地學生人數，已由二○二三／二四學年的23 100人大幅增加至二○二五／二六學年的30 400人，來自全球超過100個國家及地區。《行政長官2026年施政報告》亦訂下於二○二六／二七學年，在香港修讀經本地評審全日制專上課程的非本地學生數目增加至大約90 000人的目標。\n\n與海內外高等教育協同發展\n\n　　與海內外高等教育協同發展方面，過去三個學年，六所教資會資助大學（即香港城市大學、香港浸會大學、香港中文大學、香港理工大學、香港科技大學及香港大學）與內地及海外院校合辦本科雙學位／聯合學位課程，包括美國、英國、法國和日本等，以及泰國、馬來西亞、印尼及菲律賓等東南亞國家，每個學年共開辦約60個雙學位／聯合學位課程，涵蓋STEAM（科學、科技、工程、藝術和數學）、社會科學、人文科學、法學、經濟及工商管理學等範疇。\n\n　　八所教資會資助大學與全球各地院校簽訂了超過2 700份學生交流協議，當中歐洲地區佔超過四成；北美洲和亞洲其他地區（不包括中國內地）亦佔近四成，為本地學生提供拓展國際視野的機會。\n\n加強支援配套\n\n　　當前，政府正多管齊下加強支援配套，深化國際教育樞紐建設。在獎學金方面，為加強與「一帶一路」沿線國家的教育合作，政府推出「一帶一路獎學金」，資助來自「一帶一路」沿線國家的非本地學生，每年發放獎學金的名額由最初的10個逐步增加二○二七／二八學年的200個，吸引更多「一帶一路」國家傑出學生來港升學。\n\n　　在住宿供應方面，發展局聯同教育局於二○二五年推出「城中學舍計劃」，透過放寬發展管制措施，鼓勵市場以自資和私營方式將現有商廈改裝或重建為學生宿舍，以增加專上學生宿位供應。至二○二六年十月底，已有45宗申請獲確認資格，落成後共可提供約11 450個宿位。\n\n　　在簽證方面，為便利各地學生前來香港修讀全日制短期課程，入境處於二○二五年落實了優化措施，豁免申請人提交經濟狀況證明，並縮短審批時間。至於非中國籍留學生前往內地的簽證事宜，經諮詢入境事務處，非中國籍香港居民（包括非永久性居民）二○二三年十月起可在港申請「一簽多行」簽證到內地，簽證有效期增至最長五年。至上月底，已有超過53 500宗「一簽多行」簽證申請獲批，便利他們多次往返內地進行文化、學術交流，鞏固本港國際教育樞紐的地位。\n\n　　在吸引人才留港發展方面，政府二○○八年推出「非本地畢業生留港／回港就業安排」（IANG），讓非本地學生在香港專上院校畢業後申請在港工作，IANG的首次逗留期限亦自二○二二年底起由12個月延長至24個月，讓受惠畢業生有更多時間在港尋找工作。政府又以試行形式擴展有關安排至涵蓋本港大學粵港澳大灣區內地城市校園的畢業生，便利大灣區內人才流通，進一步增加留學香港的吸引力。\n\n全速推進北都大學城發展\n\n　　在支持專上教育擴優提質方面，政府正全力建設北都大學城（包括新田、洪水橋及打鼓嶺大學城），總體規劃面積超過1 000公頃，以「一城五元素」（教育、科技、產業、人才及城市建設）推動教育、科技與人才一體化發展。其中三幅洪水橋大學城校園區用地現正接受合資格專上院校申請建設校舍，起動校園區的發展。由政務司司長領導的「大學城籌劃及建設組」將提升為「大學城建設及發展委員會」，強化頂層架構督導。配合北都大學城發展，政府推出措施，包括：增加教資會資助研究院研究課程學額、逐步提升香港博士研究生獎學金計劃名額，以及額外撥款支持知識共享和「科教創新基金」，全速推進北都大學城發展。\n\n國際教育樞紐推展至基礎教育\n\n　　另外，我們致力把「留學香港」品牌推廣至基礎教育。教育局自二○二六／二七學年起，以試點形式推行「直資擴容」計劃，透過優化現時直資學校的收生政策，讓有足夠資源及條件許可的直資學校，申請加大錄取持學生簽證的非本地學生。今年《施政報告》宣布，教育局會持續推進計劃，鼓勵更多直資學校錄取持學生簽證的非本地學生。目前，已有48所直資學校獲接納參與計劃。現階段，進一步開放資助中小學學位予持學生簽證的非本地生，要充分考慮基礎教育的核心任務、公帑資助邏輯、簽證限制及硬件配套等條件，我們會適時總結「直資擴容」計劃，務實審慎訂定長遠發展路向。\n\n　　支援非本地家庭子女教育需要方面，政府支持國際學校體系蓬勃發展，以便利和吸引因工作或投資而來港居住的家庭。教育局一直密切留意國際學校學額的供求情況，並持續通過「校舍分配機制」，以象徵性地價或租金分配土地或空置校舍作國際學校用途。為應付長遠需要及配合北都發展，今年《施政報告》宣布計劃於明年內批出北都或其他地區的用地發展國際學校，我們會適時透過「校舍分配機制」分配有關用地。\n\n　　在加快香港中學文憑考試（文憑試）國際化方面，香港考試及評核局致力拓展文憑試的國際認受性，並就相關科目進行基準比較研究，為海外院校提供客觀參考。文憑試資歷獲廣泛認可，為考生開拓多元升學及就業出路。目前，超過2 100所海外高等院校已公布接納文憑試作為入學資歷；內地則有165所高校可根據文憑試成績直接錄取香港學生。多個歐洲國家、印度及「一帶一路」沿線地區的院校亦接受文憑試成績作升學申請。\n\n　　主席，教育局會繼續深化國際教育樞紐建設，提升香港教育的國際地位和影響力。面對全球激烈的人才競爭，政府在推廣留學香港品牌時，定位並不在是否成為首選，而在香港作為理想留學地的獨特價值和優勢。「Hong Kong: Your World-class Campus」強調的是教育品質與科研實力，而不是首選地位。香港的核心吸引力並不在於唯一選擇，而在於背靠祖國、聯通世界的國際化環境，以及享譽國際的學術地位等疊加優勢。因此，在推廣「留學香港」時，我們採取務實及針對性拓展策略，強調香港的獨特優勢，吸引頂尖學者和優秀學生。我們期待與各位議員集思廣益，共同推進相關工作，並在聆聽各位議員的發言後，再作回應。\n\n　　多謝主席。",

          "body": "以下是文化體育及旅遊局局長羅淑佩今日（十一月十八日）出席「香港冬日小鎮．中環」啓動禮的致辭全文：\n\n林建岳博士（香港旅遊發展局（旅發局）主席）、Mr Graeme Torre（置地公司香港中環物業組合行政總裁）、各位嘉賓和傳媒朋友：\n\n　　大家晚上好。今日我很高興可以參加香港旅遊發展局「香港冬日小鎮．中環」啓動禮，為香港繽紛冬日巡禮拉開序幕。現在距離聖誕節剩下一個多月的時間，我們身處的中環已經充滿濃厚的聖誕氣氛，天氣亦開始轉涼，可以穿上「bling bling」的衣服。街道及商店都掛滿色彩繽紛的聖誕燈飾及裝置，讓人目不暇給。\n\n　　去年在這裏的「冬日小鎮」及沉浸式光影匯演，首度登場即大獲好評，今年旅發局再接再厲，除中環外，將「冬日小鎮」帶到尖沙咀和銅鑼灣，並呈獻不同主題的光影表演，進一步推高冬日節慶氛圍，讓市民和旅客感受到「只在香港」的濃濃節日氣氛。\n\n　　由今晚至明年一月初，多座中環標誌性建築物的外牆將呈獻精彩的光影表演，盡展香港夜間的閃爍魅力。稍後，維港對岸的尖沙咀「冬日小鎮」亦會啓動，帶來雙重的冬日光影體驗，與中環互相輝映。\n\n　　今晚亦是一個重要的歷史時刻。陪伴了我們22年的「幻彩詠香江」即將上演最後一場匯演，完成它的歷史使命。「幻彩詠香江」在二○○五年獲列入健力士世界紀錄，成為全球最大型燈光音樂匯演，亦是全球首批每晚恆常上演的大型燈光匯演之一，多年來向無數市民及旅客帶來了香港維港天際線的璀璨夜色，現在完成歷史任務了。今晚的匯演特別加入大廈樓頂煙火效果，為這場經典匯演劃上圓滿句號。接下來，旅發局會繼續舉辦及支持許多活動。近日的國際中秋綵燈匯、大坑舞火龍、香港美酒佳餚巡禮等，都深受市民及旅客歡迎，大大提升香港夜間的熱鬧氛圍，亦帶旺零售及餐飲業，成效有目共睹。未來，旅發局將會繼續推出不同項目，我亦呼籲零售和餐飲業界朋友與旅發局攜手，進一步豐富香港的夜間體驗。 \n\n　　聖誕節是普天同慶的節日，我預祝市民及旅客有一個愉快的佳節，亦感謝各位嘉賓及合作夥伴的支持，讓我們能在這個冬季，再次把歡樂與祝福帶給全港市民和到訪香港的旅客。\n\n　　祝各位聖誕快樂，Merry Christmas！",

          "body": "香港海關於十月二十七日及昨日（十一月十七日）偵破兩宗毒品案件，檢獲約十一公斤懷疑氯胺酮、約五百克懷疑依托咪酯粉末、約二點二公斤懷疑液態依托咪酯及超過一千三百粒懷疑依托咪酯煙彈，並拘捕三人。檢獲的懷疑毒品市值共約六百八十萬元。\n\n　　首宗案件中，香港海關與內地海關緝私部門進行聯合執法行動，根據情報交流及透過風險評估，於十月二十七日截查一件由英國經內地寄抵香港，報稱海鹽身體磨砂膏的包裹。經檢查後，海關人員於二十八個膠樽內發現約十一公斤懷疑氯胺酮。跟進調查後，海關人員採取監控遞送行動，並於昨日在佐敦拘捕一名五十歲本地女子。\n\n　　第二宗案件中，海關人員昨日下午在元朗執行反毒品行動期間，截查兩名同為二十八歲的本地和內地男子，並帶二人到附近一個村屋單位搜查。海關人員在該單位內檢獲該批懷疑依托咪酯毒品和懷疑製毒及毒品包裝工具。\n\n　　首宗案件被捕的女子已被控以一項企圖販運危險藥物罪，案件將於明日(十一月十九日)在九龍城裁判法院提堂。\n\n　　第二宗案件的兩名被捕男子已共同被控以一項製造危險藥物罪及一項販運危險藥物罪，而該名被捕本地男子亦另被控以一項阻撓一名海關人員罪。他們將於明日在粉嶺裁判法院提堂。\n\n　　根據《危險藥物條例》，製造危險藥物和販運危險藥物均屬嚴重罪行，一經定罪，最高可被判罰款五百萬元及終身監禁。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑販毒活動。",

          "body": "政制及內地事務局粵港澳大灣區發展辦公室將參與十一月十九（星期四）和二十日（星期五）在香港會議展覽中心舉行的創業日展覽，介紹粵港澳大灣區建設帶來的機遇，以及政府支援香港青年到大灣區創業的相關政策措施及計劃。\n\n　　《香港第一個五年規劃》對接國家「十五五」規劃，當中設有大灣區專章，明確指出香港會參與大灣區建設。辦公室一直通過多元化渠道，推廣大灣區建設帶來的重大機遇。今年辦公室繼續參與創業日展覽，重點展示北部都會區及河套深港科技創新合作區的發展潛力，讓創業者了解香港與大灣區內地城市協同發展所帶來的新機遇。\n\n　　辦公室的展位提供實用資訊，包括大灣區發展概覽、支援香港青年到大灣區創業的各項措施，以及設於廣州的粵港澳大灣區發展推廣中心提供的支援服務，協助有志到大灣區內地城市發展的創業者了解相關資訊。現場亦有精美限量紀念品派發，送完即止。\n\n　　辦公室的展位設於香港會議展覽中心展覽廳1E（編號1E - F02）。展覽免費入場，開放時間為十一月十九日（星期四）上午九時至下午六時三十分，以及十一月二十日（星期五）上午九時至下午六時。有意參觀的人士可於香港貿易發展局網頁（www.hktdc.com/event/eday/tc）預先登記。\n\n　　有關大灣區的更多資訊，歡迎瀏覽辦公室的專題網站(www.bayarea.gov.hk)。",

          "body": "食物環境衞生署食物安全中心（中心）今日（十一月十八日）宣布，因應英國環境、食物及鄉村事務部通報，指英國北愛爾蘭Coagh Townland爆發高致病性禽流感，中心即時指示業界暫停從該地區進口禽肉及禽類產品（包括禽蛋），以保障本港公眾健康。\n\n　　中心發言人說，根據政府統計處的資料，本港今年首九個月從英國進口約六百八十公噸冰鮮和冷藏禽肉及約二十二萬隻禽蛋。\n\n　　發言人說：「中心已就事件聯絡英國當局，並會繼續密切留意世界動物衞生組織及有關當局發出關於爆發禽流感的消息，因應當地疫情發展，採取適當行動。」",

          "body": "香港與智利今日（十一月十八日）簽署協議，設立讓兩地青年參與的雙邊工作假期計劃。\n\n　　工作假期計劃協議在香港特別行政區（香港特區）行政長官李家超與智利總統卡斯特共同見證下，由香港特區政府勞工及福利局局長孫玉菡與智利外交部部長弗朗西斯科·佩雷斯·麥肯納於深圳舉行的亞太區經濟合作組織第三十三次領導人非正式會議期間簽署。\n\n　　孫玉菡歡迎與智利設立這個計劃。他說：「智利是香港在拉丁美洲的首個工作假期計劃合作夥伴。該計劃將為香港和智利的青年提供開拓視野的機會，讓他們親身體驗在不同文化中生活和工作。」\n\n　　弗朗西斯科·佩雷斯·麥肯納表示：「我們很高興能為智利和香港青年提供新機遇，讓他們體驗彼此的當地生活。香港東西方文化的獨特融合、國際化的視野和充滿活力的經濟，將為智利青年帶來豐富的體驗。我們也期待香港青年來智利探索其豐富的文化、熱情好客的民風和秀麗的自然風光，從而增進彼此的了解和人文交流。」\n\n　　智利是香港第十五個雙邊工作假期計劃夥伴。自二○○一年起，香港已先後與新西蘭、澳洲、愛爾蘭、德國、日本、加拿大、韓國、法國、英國、奥地利、匈牙利、瑞典、荷蘭及意大利（即將生效）訂立工作假期計劃。至今已有超過109 000名香港青年參與計劃，從中得益。\n\n　　在香港與智利的工作假期計劃下，雙方青年人可以申請簽證，在智利或香港逗留最多十二個月。在這段期間，他們可從事短期工作以賺取旅費，或修讀短期課程。雙方每年各有一百個名額。\n\n　　有關香港和智利申請人的申請簽證程序，稍後將分別於智利移民局網站tramites.extranjeria.gob.cl/和香港特區入境事務處網站www.immd.gov.hk/公布。",

          "body": "行政長官李家超今日（十一月十八日）在深圳出席亞太區經濟合作組織（亞太經合組織）工商領導人峰會開幕式。他亦與其他經濟體領導人會面和舉行雙邊會談，就共同關心的議題交流意見。\n\n　　早上，李家超出席亞太經合組織工商領導人峰會開幕式。國家主席習近平出席開幕式並發表主旨演講。習近平主席指出，亞太經合組織伴隨經濟全球化浪潮而生，推動亞太地區引領時代風氣之先，今年中國第三次擔任亞太經合組織東道主，願同各方一道，堅定信心、勇毅前行，攜手建設亞太共同體，促進亞太共同繁榮，並就此提出四點建議：一要維護和平穩定大局，二要搭建開放合作橋梁，三要激發創新增長動力，四要拓展互利共贏路徑。習近平主席又表示，中方支持成立世界灣區經濟合作聯盟，深化各灣區交流互動，探索亞太經濟合作新路徑。\n\n　　李家超對此感到十分振奮和鼓舞。習近平主席的主旨演講從戰略高度和長遠角度擘畫亞太合作藍圖，深刻指明越是外部形勢複雜，越要堅定維護戰後國際秩序，越要堅持通過對話協商解決分歧，通過團結協作應對挑戰，為亞太地區長治久安築牢根基。香港作為亞太經合組織成員經濟體，長期擔當着重要的區域經貿與合作樞紐，是世界上最具競爭力的經濟體之一，一直堅定支持自由貿易和多邊主義，積極通過亞太經合組織的平台，持續深化國際交往合作。\n\n　　及後，李家超與馬來西亞總理安華會面。他很高興繼二○二五年在韓國舉行的亞太經合組織會議後，與對方再次見面。李家超說，香港與馬來西亞一直合作緊密，他在二○二三年訪問馬來西亞期間，兩地簽署涵蓋不同領域的合作備忘錄和協議。隨着香港駐吉隆坡經濟貿易辦事處（經貿辦）正式運作，香港深化與東南亞國家聯盟（東盟）及周邊亞洲國家的經貿和投資推廣。他感謝馬來西亞政府支持香港在當地設立經貿辦，期望兩地在經貿和人文交流有更深更廣的合作。香港正建設成為國際高端人才集聚高地，同時近年積極推廣作為穆斯林友善旅遊目的地，他歡迎更多馬來西亞學生、旅客來港。\n\n　　其後，李家超與越南國家主席蘇林會面。他表示很高興繼二○二四年訪問越南後，與蘇林主席再次會面。李家超說，越南是香港的第三大貿易夥伴，亦是香港在東盟最大的貿易夥伴，兩地經貿合作緊密。香港今年九月公布《香港第一個五年規劃》，越南早前公布其五年計劃，展現兩地對促進高質量發展的共同願景。他期望雙方進一步加強政府與政府間的合作，深化在旅遊、人文交流和創科領域的交流協作，同時鼓勵越南企業善用香港內聯外通的優勢，以香港作為開拓大灣區的跳板，攜手把握更多機遇。越南將於二○二七年主辦亞太經合組織會議，香港會與越南緊密合作，共同促進區域經濟合作和融合。\n\n　　下午，李家超與文萊蘇丹哈桑納爾會面。李家超說，繼二○二五年在韓國舉行的亞太經合組織會議後，他與哈桑納爾蘇丹再次見面。他表示，香港與文萊的經貿合作穩步推進，去年的雙邊商品貿易總額按年增長四成。香港擁有世界級資本市場、專業服務和航空物流網絡，可為兩地深化合作提供有力支撐，並期望雙方進一步加強協作，互補優勢。\n\n　　李家超其後與泰國總理阿努廷會面。他很高興繼二○二五年在韓國舉行的亞太經合組織會議後，再次與阿努廷總理見面。李家超表示，泰國最近公布了新一份五年規劃，積極推進創科產業發展。香港是國際創新科技中心，正全力推進北部都會區（北都）發展，推展北都大學城、河套深港科技創新合作區香港園區等建設，實現教育、科技、人才一體化發展。他期望香港與泰國加強創科領域合作聯通，並鼓勵更多泰國企業落戶香港，結合香港的蓬勃創科生態和雄厚科研實力，開拓國際市場。\n\n　　李家超之後與智利總統卡斯特會面，共同見證香港與智利簽署工作假期計劃協議。他表示，智利是香港在拉丁美洲的第三大貿易夥伴，也是香港在拉丁美洲首個工作假期計劃的合作夥伴。工作假期計劃協議標誌兩地交流由商貿合作進一步延伸至人文和青年層面，不但有助促進民心相通，亦為雙邊關係注入新動力。協議將為兩地青年提供更多工作和文化交流的機會，助他們拓闊國際視野，同時進一步鞏固提升香港作為國際交流樞紐的角色。香港會繼續發揮「超級聯繫人」和「超級增值人」的角色，與智利加強不同領域的合作。\n\n　　李家超感謝今日會晤的馬來西亞、越南、文萊和泰國領袖，持續支持香港盡早加入《區域全面經濟伙伴關係協定》，攜手推動區域經濟發展。他表示，面對複雜多變的國際形勢，香港正積極拓展多元市場，深化與東盟和拉丁美洲等全球南方國家的協作，進一步加強國際交往合作。香港特別行政區政府正強化「四中心、一高地」建設，積極發揮香港在「一國兩制」下的背靠祖國、聯通世界的獨特優勢，為海內外企業帶來更廣闊發展空間。香港會持續加強與傳統市場、新興市場在商貿投資、創新科技和人文交流等領域的務實合作，攜手開拓更多發展機遇。\n\n　　晚上，李家超出席為與會各經濟體領導人或代表舉行的歡迎宴會。\n\n　　李家超明日（十一月十九日）出席亞太經合組織第三十三次領導人非正式會議，並與其他經濟體領導人會面。",

          "body": "政府歡迎立法會今日（十一月十八日）通過《2026年銀行業法例（雜項修訂）條例草案》，讓香港的銀行業法例與時並進，更好切合銀行業未來發展的需要，並與其他主要國際金融中心的法規更趨一致。\n\n　　《2026年銀行業法例（雜項修訂）條例》（《修訂條例》）充分考慮了香港銀行業的運作情況及監管環境，同時參考相關國際標準及做法，從而就《銀行業條例》以下範疇作出修訂，包括：（一）銀行控權公司的規管；（二）為監管目的聘用具相關技能人士；（三）完善執法條文；（四）簡化現行的銀行三級制至二級制；及（五）減輕合規負擔及提升法規清晰度和有效性的技術性修訂。《修訂條例》亦對《香港銀行公會條例》及《金融機構（處置機制）條例》作出修訂，以提升運作效率及靈活性。 \n\n　　財經事務及庫務局局長許正宇表示：「《修訂條例》充分彰顯政府一直致力確保香港的金融法規持續與國際標準接軌，貼合巿場變化，與時俱進，為經濟和金融市場的長遠發展提供堅實支持。這次修例適逢我們推進《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》和《行政長官2026年施政報告》，我們將繼續與銀行業界緊密合作，壯根基、穩結構、強功能、控風險，共同鞏固及提升香港的國際競爭優勢。」\n\n　　香港金融管理局總裁余偉文表示：「與時並進的《銀行業條例》是穩健和具備應對風險能力的銀行體系的關鍵要素，並為業務發展提供有利的環境。這次法例的更新，將有助於確保我們的監管框架持續有效，同時讓銀行業能夠更好把握未來的新機遇，從而加強香港國際金融中心的地位。」 \n\n　　《修訂條例》將自二○二七年一月一日起分階段實施。",

          "body": "下稿代交通諮詢委員會發岀：\n\n　　交通諮詢委員會轄下的交通投訴組在二○二六年第二季共接獲12 447 宗投訴及建議，當中純粹提出建議的有259宗。\n\n　　季內接獲的投訴及建議，主要關於公共交通服務（91%）、執法事宜（7%）和交通情況（2%）。\n\n　　與公共交通服務有關的個案，由上季的9 331宗上升至今季的11 335 宗。涉及違例泊車及其他執法事宜的個案，由800宗上升至836宗。有關交通情況的投訴及建議，由249宗下降至197宗。涉及道路維修的個案，則由42宗下降至40宗。\n\n　　交通投訴組於季內接獲的投訴及建議均已轉交有關政府部門及公共交通機構跟進。\n\n　　季內，12 284宗個案的調查工作已經完成。在這些個案中，有10 536宗（86%）證實成立，而不成立的個案有六宗（少於1%），其餘1 742宗（14%）則因證據不足而無法追查。\n\n　　就證實成立的個案而言，有關政府部門及公共交通機構已採取措施以改善情況，或正考慮可以解決問題的方法。在這些個案中，有九名駕駛者被警務處票控。\n\n　　季內，有關政府部門及公共交通機構共採納了11項市民提出的建議，以改善公共交通服務和交通情況。有關個案的概要載於附錄。\n\n　　市民可致電交通投訴組熱線2889 9999（辦公時間以外提供留言服務）、以傳真2577 1858、電郵info@tcu.gov.hk或於該組網站（www.tcu.gov.hk）填妥網上表格，提出建議或投訴。",

          "body": "下稿代交通諮詢委員會（交諮會）發出：\n\n　　因應新大嶼山巴士（一九七三）有限公司（嶼巴）及九龍巴士（一九三三）有限公司（九巴）現有專營權將分別於二○二七年三月及七月屆滿，繼今年三月政府向交通諮詢委員會（交諮會）匯報該兩個專營權屆滿後的新專營權相關工作，交諮會今日（十一月十八日）聽取政府與相關專營巴士營辦商進行磋商的最新情況。\n\n　　交諮會主席黃仕進教授說：「委員備悉政府的工作進展，目標是相關營辦商能在為期十年的新專營權下，繼續為市民提供有效率及優質的公共巴士服務。委員亦欣悉兩間營辦商儘管面對巴士業界具挑戰性的營運環境，仍作出涵蓋環保措施、智慧出行、巴士安全及票務優惠四個主要範疇的新承諾，進一步提升服務。」\n\n　　此外，交諮會亦討論九巴、城巴有限公司、龍運巴士有限公司及嶼巴的加價申請。\n\n　　黃仕進教授表示，交諮會在討論有關四個巴士專營權的加價申請時，已考慮和平衡現行機制下的一籃子因素，包括市民的接受程度及負擔能力、營辦商的服務表現、營辦商過去和預測的財務狀況（包括燃油價格上升的影響），以及按綜合消費物價指數及工資指數變動，再由方程式運算得出的加幅參考數據。\n\n　　黃仕進教授說：「一如以往，交諮會會把有關專營巴士新專營權及營辦商加價申請的意見提交政府，供行政長官會同行政會議考慮。」",

          "body": "​運輸及物流局今日（十一月十八日）宣布，已與業界攜手成立綠色船用燃料交易平台發展專責小組，並與多家業界及研究機構簽署合作備忘錄，共同推動香港發展成為面向全球、多元開放的綠色船用燃料貿易中心。\n\n　　運輸及物流局發言人表示：「航運減排是國際趨勢。國際海事組織已訂立國際航運於二○五○年前後達致淨零排放的目標。在眾多減碳的方法中，使用綠色船用燃料最為有效，因此綠色船用燃料的使用量正穩步上升。隨着綠色船用燃料的交易量增加，帶來相關交易市場的需求。」\n\n　　「香港作為國際航運、金融及貿易中心，擁有背靠祖國、聯通世界的獨特優勢，金融和法律制度與國際接軌的獨特優勢。加上實物大宗商品交易半稅優惠即將落實，其合資格大宗商品亦包括綠色燃料，香港具備條件建立由市場主導、面向國際的綠色燃料貿易中心，提供匯聚來自內地及世界各地的綠色燃料和對接國際航運需求的平台。」\n\n　　為推進有關發展，運輸及物流局與業界攜手成立專責小組，匯聚能源交易商、綠色燃料生產商、航運與能源業界組織，以及智庫，為綠色燃料交易平台的發展方向出謀獻策，亦會探索建立以實際交易數據為基礎的香港綠色燃料價格指數，為業界提供可靠的價格參考。此外，專責小組亦會為建立綠色燃料交易的完整產業鏈提供意見，致力吸引海內外更多持份者在香港進行綠色燃料交易。\n\n　　專責小組的創始成員包括中國產業發展促進會氫能分會、中集安瑞科控股有限公司、香港中華煤氣有限公司、浩澈綠能控股有限公司、國際綠色燃料聯盟、團結香港基金及AEX Holdings, Ltd。\n\n　　為推進交易平台的建設，運輸及物流局日前在香港海運週期間與多家合作夥伴簽署合作備忘錄，涵蓋交易平台建設、發展價格指數、錨定平台用家、進行行業研究等範疇。\n\n　　​多家企業及行業機構亦於當日簽署商業合作備忘錄，涵蓋綠色燃料供應、航運、船級認證、政策研究及金融科技等範疇，透過企業及機構之間的合作，支持綠色燃料交易平台發展。\n\n　　發言人續說：「有關合作將有助拓展平台的用戶及合作夥伴網絡，促進綠色燃料在港交易。運輸及物流局會繼續聯同業界推進相關工作，吸引更多內地及海外燃料供應商、船東和貿易商等不同持份者參與，鞏固香港作為綠色船用燃料加注和貿易中心的地位。」",

          "body": "懲教署轄下石壁監獄今日（十一月十八日）舉行證書頒發典禮，頒發學業證書予98名在囚人士，以肯定他們在學業進修上的努力及取得的成果。\n\n　　過去一年，石壁監獄共有284名在囚人士參與各類遙距課程及公開考試。他們合共考獲522卷合格成績，其中258卷為優良成績。考試分別由香港都會大學、香港考試及評核局及明愛社區書院舉辦，科目包括中國語文、英國語文、數學、經濟、心理學、社會學、工商管理、普通話及會計等。而出席今日典禮的98名在囚人士合共考獲292卷合格成績，其中175卷為優良成績，當中分別有三名在囚人士獲香港都會大學頒授通識教育學士學位、兩名獲頒工商管理副學士學位及十名獲頒通識教育副學士學位。\n\n　　主禮嘉賓香港山西總會副會長吳婧致辭時表示，香港山西總會十分支持懲教署的更生工作，於二○二二年設立一項名為「香港山西總會燃亮希望教育基金」的教育資助計劃，為有需要的在囚人士在教育及職業訓練方面提供資助，協助他們獲釋後重新融入社會。\n\n　　典禮上，有由在囚人士組成的銅管樂隊，與本地銅管樂團義務導師及懲教人員合奏銅管樂。另外，歌手關心妍和合唱團導師胡永正分別與在囚人士樂隊和合唱團一起獻唱多首勵志歌曲。在囚人士希望透過以上的表演項目，向家人及幫助他們更生的社會人士及團體表達謝意。\n\n　　在分享環節中，三名在囚人士分享更生路上的點滴，並感謝家人對他們不離不棄。他們亦感謝懲教人員的支持和鼓勵，在學習過程中為他們提供協助，讓他們得以順利完成課程。\n\n　　石壁監獄位於大嶼山，是一所高度設防監獄，羈押男性成年在囚人士，認可收容額為426名。",

          "body": "下稿代香港金融管理局發出︰\n\n　　香港金融管理局（金管局）呼籲市民提高警覺，留意以下銀行已就欺詐網站、網上銀行登入畫面、偽冒電郵或其他騙案發出新聞稿。有關銀行已向金管局匯報事件，其新聞稿的超連結已上載至金管局網站。\n\n 銀行\n 騙案類別\n\n 香港上海滙豐銀行有限公司\n 欺詐網站及網上銀行登入畫面\n\n 中國銀行（香港）有限公司\n 欺詐網站、網上銀行登入畫面及「網絡釣魚」即時訊息\n\n　　金管局提醒公眾，銀行不會透過短訊或電郵超連結，引領他們到其網站進行交易，更不會以電話、電郵及手機短訊（包括以超連結方式），要求客戶提供任何敏感資料（包括登入密碼和一次性密碼）。\n\n　　任何人士若曾就上述騙案提供其個人資料或進行任何交易，應利用有關新聞稿中的資料聯絡銀行，及致電2860 5012向香港警務處刑事總部資訊中心報案。",

          "body": "11月7日、8日，貝托祺（Tarmo Peltokoski）攜手香港管弦樂團、八位獨唱家及六個合唱團，合共近六百人，於香港文化中心隆重呈獻馬勒的鴻篇巨作第八交響曲，為他出任香港管弦樂團音樂總監揭開序幕。\n正如歌德在《浮士德》中寫下那句擲地有聲的詩句：「太初有為！」貝托祺選擇以「馬勒八」這部凝聚人類精神、創造意志與終極理想的宏偉篇章，開展他與香港管弦樂團的全新旅程。這一選擇不僅是他對藝術立場的鮮明宣示，也體現了他對音樂力量與藝術使命的深刻理解。馬勒以恢宏的音樂語言，呈現人類對愛、創造與精神昇華的不懈追尋；而這份不斷突破界限，向更高理想邁進的精神，亦與貝托祺的藝術追求形成深刻共鳴。\n以此作為履新之作，既是對馬勒宏大精神世界的致意，也寄寓着他對樂團未來的期許：以行動激發創造，以藝術凝聚力量，在傳統與創新之間不斷探索，讓音樂連繫個人、城市，乃至世界。\n躬行實踐 突破界限 貝托祺與港樂的藝術使命\n「太初有為！」 沒有甚麼比這句話更適合作為浮士德那種透過行動超越自我的精神，馬勒顯然也為這種精神所着迷。1906年夏天，他在自己的夏季作曲小屋中潛心創作，完成了第八交響曲，第二部分的歌詞正選自歌德的《浮士德》，其音響上的龐大、編制上的宏偉，以及精神內涵上的廣闊而細膩，共同構成「馬勒八」獨一無二的面貌。\n在作品首演116年後，2026年11月7日與8日，香港管弦樂團（港樂）新任音樂總監貝托祺在其就職音樂會上，帶領樂團及合唱團近六百人的演出陣容，一同在香港呈獻這部巨作。參與演出的包括八位中外歌唱家：積奇蓮．華格納（Jacquelyn Wagner）、坎睿思（Chen Reiss）、鄺勵齡、莫莉森（Catriona Morison）、菊克（Sasha Cooke）、卡塔亞拉（Tuomas Katajala）、坎達寧修斯（Rinalds Kandalincevs）及沈洋；以及香港管弦樂團合唱團、學士合唱團、倫敦愛樂合唱團、聖保羅男女中學高級混聲合唱團、英華書院合唱團及香港兒童合唱團。這份對「行動」的信念，對音樂理想的追求，以及對精神力量的共鳴，正是貝托祺與港樂共同秉持的精神。\n貝托祺曾形容馬勒八「如宇宙般宏大、普世人間、超凡入聖、眾志成城」。這次演出既是對馬勒宏大精神世界的回應，也寄託着貝托祺對自己執掌下的港樂未來的期許：以行動激發創造，以藝術凝聚力量，在傳統與創新之間不斷探索，讓音樂連繫個人、城市，乃至世界。\n當音樂行至終章，管風琴、樂隊與人聲齊鳴。音樂將代代相傳的精神，展現在觀眾面前。一瞬間，這股力量傳到每個人身上，震撼整個香港文化中心。貝托祺熟練地帶領樂團、合唱團和獨唱家，有序而細緻地完成演出。在場的人無不為之感動──這是音樂帶來的力量。\n早前，港樂行政總裁方恩哲（Bernhard Fleischer）上任時，我曾與他對話。他提到，希望自己與貝托祺及港樂各位同事，在港樂這個「正處於加速向前發展的時刻」攜手共進，以演出的「曲目策劃」和「演出質素」為本，不辜負每一位觀眾的期待。從2026/27樂季的節目策劃，到這場演出的呈現，這兩點都得到充分體現；他們以實際行動，交出令人滿意的成績。\n巡演歐洲 走向世界\n方恩哲希望港樂能夠始終保持一種「沒有局限」的特質：能駕馭多元豐富的曲目類型，不斷拓展藝術表現的疆界，同時進一步提升樂團的國際影響力，讓港樂在世界古典音樂舞台上佔據更鮮明的位置。\n11月底，貝托祺將率領港樂展開橫跨四國八城的歐洲巡演，登上多個世界著名音樂廳的舞台。此次巡演曲目兼具深度與光彩：以夫利格（Henk de Vlieger）根據華格納歌劇改編的《指環》：管弦樂冒險，以及布魯赫納第四交響曲為核心，展現樂團駕馭大型交響作品的能力與藝術深度。同時，鋼琴家赫姆森（Martin Helmchen）將演繹莫扎特第二十四鋼琴協奏曲，並與貝托祺攜手呈獻聖桑《動物嘉年華》，為這趟巡演增添別樣的音樂色彩。\n巡演城巿包括巴塞隆拿、漢諾威和慕尼黑，此外，在赫爾辛基、多蒙特、柏林、漢堡和維也納，港樂還將帶來中國作曲家姚晨為港樂巡演特別創作的《團團轉》。這不僅讓中國當代音樂創作走進歐洲音樂廳，也使港樂的國際巡演成為一次雙向的文化交流：既向世界展示樂團的藝術面貌，也將當代中國音樂的聲音帶到更廣闊的舞台。\n對港樂而言，此次巡演的意義並不止於拓展巡演版圖，或是在國際舞台上留下足跡；更重要的是，港樂能在不同音樂文化語境中檢驗自身的藝術實力，連結世界各地的聽眾，在交流與碰撞中，不斷拓展自身的可能性。從香港出發，走向世界，再將新的經驗與視野帶回香港──這樣的往返，正是一支立足國際的樂團成長的重要組成部分。\n方恩哲與貝托祺所強調的「沒有局限」，正是在這樣一次次實踐中獲得具體意義：不囿於地域，不拘於曲目，也不為藝術表現設限。正因如此，對一支立足香港、面向世界的樂團而言，真正的突破或許正在於此──躬行實踐，突破界限。\n文：謝嘉雯 圖：香港管弦樂團",

          "body": "一把斧头加腐蚀性金属，爱尔兰男子潜入机场，“拆报废”一架6000万美元的“大力神”军机 | 国际早察\n\n　　美东时间11月17日，美国纽约南区联邦检察官办公室正式公开一份联邦起诉书，对48岁的爱尔兰男子戴西·奥科兰(Daithi O'Corrain)提起刑事指控，罪名是蓄意破坏并“有效摧毁”一架造价高达6000万美元的美军“大力神”运输机。\n\n　　这份最新解密的起诉书，将今年4月发生在爱尔兰香农机场(Shannon Airport)的一起离奇破坏案公之于众——而作案现场曝光的细节，堪称现实版的“硬核拆机现场”。\n\n　　凌晨封窗反锁舱门，48岁男子上演“硬核拆机”\n\n　　据英国广播公司、CNN等外媒报道，今年4月11日，一架美国空军国民警卫队的C-130H“大力神”运输机正停放在爱尔兰香农机场过夜。\n\n　　凌晨4时30分刚过，奥科兰趁夜通过破坏锁定装置进入机舱。\n\nBBC的报道公布了奥科兰作案现场\n\n　　他反侦察意识极强：先用绑带将舱门固定关闭，然后遮盖机窗，给自己造出封闭的“作案暗室”，随后展开系统性破坏：\n\n　　切断机内电线和液压管路。他挤压液氧管路，摧毁驾驶舱内的所有仪表，并刺穿飞机的通风管道。\n\n　　抡起斧头砍砸机身。走出机舱后，他直接挥斧猛砍机身，留下一道道“伤口”。\n\n　　卡死油箱腐蚀机身。更致命的是，他拧开油箱盖倒入大量金属滚珠轴承，还在关键金属部件上涂抹了具有腐蚀性的金属镓。\n\n　　预谋数月摸清门路，6000万美元“大力神”报废\n\n　　直到安保与美军察觉异样破门而入时，这架“大力神”已面目全非。\n\n　　美国检察官表示，奥科兰策划此次袭击已长达数月，期间专门在网上搜集了关于C-130运输机结构的信息，这才得以精准瘫痪整架飞机。\n\n　　美方确认，由于航电全毁、机身遭斧劈、油箱混入异物且蒙皮遭镓元素严重腐蚀，这架价值约6000万美元的运输机已无法修复，被认定为“有效摧毁”。\n\n　　雪上加霜的是，美国联邦调查局(FBI)称，此次袭击还“危及了关键的军事行动”。\n\n　　目前，奥科兰仍被关押在爱尔兰监狱中，美方已启动程序欲将其引渡至美国受审，一旦在美定罪，他将面临最高10年监禁。\n\n　　奥科兰为什么要冒险拆机？\n\n　　随着案情公开，奥科兰冒险“拆机”的动机也浮出水面。\n\n　　据外媒披露，一项由奥科兰好友发起的在线筹款活动称，他之所以让这架C-130运输机“丧失功能”，是为了抗议美国与以色列针对伊朗的战争，以及华盛顿对以色列在加沙地带所进行“种族灭绝战争”的支持。\n\nCNN对于此次事件的报道\n\n　　位于爱尔兰西部的香农机场是一座民用国际机场，亦时常承担过境军机的经停补给任务。然而，据媒体梳理，在过去18个月里，该机场曾发生多起安保漏洞事件。其中包括三人被控向一架过境美军飞机喷漆，以及另外三人驾车闯入限制区域。\n\n　　作者：王曦\n\n 【编辑:李岩】",

          "body": "强势横扫、黑马逆袭、百炼成钢……如今，竞技体育赛事吸引了越来越多年轻人的目光。近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育赛事的青年开展的调查显示，竞技对抗带来的悬念与刺激感是受访青年观看赛事的首要原因。篮球、足球、乒乓球是受访青年最青睐的三项竞技项目。\r\n\n　　年轻人爱看哪些竞技体育比赛项目\n\n　　95后王卓琳从小受家人的影响开始观看竞技体育赛事，“小时候我们家里的电视除了放各种晚会，就是各项比赛，大家都是‘体育迷’。”她至今还记得2004年雅典奥运会上中国女排在先失两局的情况下连扳三局夺冠的瞬间，“给儿时的我带来了极大的震撼。”上中学后，她开始和同学一起看篮球比赛，渐渐地也开始看足球、网球、F1(世界一级方程式赛车锦标赛——记者注)等项目的比赛，“现在大部分知名赛事我都会看一下。”\n\n　　作为一名“体育迷”，在北京工作的90后李泽林在日常运动健身之余，也会关注羽毛球、乒乓球、电子竞技等赛事。“我印象最深的还是2011年看李娜法网夺冠的电视转播，当时这场比赛在国内也受到广泛关注，成为很多人了解网球的契机，我也是因此在上大学时开始学习网球。”\n\n　　丰富多样的竞技体育赛事，正在不断吸引年轻人的目光。大家都看过哪些竞技体育项目的比赛？调查中，篮球(58.0%)、足球(53.7%)、乒乓球(50.4%)位列前三。其他还有：羽毛球(39.2%)、游泳/跳水/花样游泳(33.4%)、排球(29.2%)、电子竞技(26.9%)、网球(24.1%)、田径(23.4%)、冰雪项目(22.3%)、赛车/摩托车赛(16.1%)、搏击/格斗类(12.1%)等。\n\n　　过半受访者因竞技对抗带来的悬念与刺激感而观赛\n\n　　正在读研究生的00后卫婕从2020年东京奥运会开始关注竞技体育赛事，“最开始是看乒乓球，现在比较关注短道速滑赛事。”对她而言，竞技体育的不确定性是赛事最大的魅力，“即使对手之间有一些差距，甚至可以说实力悬殊，你也很难准确预判比赛结果。”另外，她也会被选手的个人魅力打动，“我喜欢的一名短道速滑选手，尽管实力强劲，却因场外因素屡屡受挫，后来他选择换一个全新的环境，最终在世锦赛上拿到了久违的金牌。这种选手跌宕起伏的人生故事非常打动我。”\n\n　　在广东上学的05后赵欣更看重比赛本身的观赏性，“即便我力挺的队伍没有参赛，我也会观看相关比赛。只要是发挥出色、没有违规的选手，我都会为他们喝彩。”看到一些队伍即使历经千辛万苦、颗粒无收，却仍然在赛场上为了冠军奋勇拼搏时，她也会被感染，“队员们为了冠军并肩奋斗，最后一起捧起奖杯的画面，太打动我了。”\n\n　　“我觉得竞技体育的赛事结果充满变数，奇迹时有发生。这种不确定性，以及每名运动员在项目里拼尽全力、不断突破人类极限的努力，都带给我深深的震撼。” 王卓琳觉得观看体育赛事给她带来了一些积极的“刺激”。今年中超联赛期间，她和其他球迷一度以为成都蓉城会夺冠，“但大连英博专注眼前每一场比赛，一分一分去拼，拿下了最后的冠军。”\n\n　　哪些因素吸引现在的年轻人观看竞技体育赛事？数据显示，55.4%的受访青年是因为竞技对抗带来的悬念与刺激感；49.5%的受访青年是被不断突破自我、挑战极限的力量吸引；48.4%的受访青年感受到了其中的团队协作与集体荣誉感。此外，选手永不言弃、顽强拼搏的精神(43.2%)，对该体育项目的热爱(41.8%)，赛事本身的观赏性(40.0%)，运动员的个人特质、成长故事(21.9%)，可以和亲朋好友一起讨论交流(13.4%)等也是吸引受访青年观赛的因素。\n\n　　56.0%受访青年从观赛中学会了接纳输赢\n\n　　“想做的都去做吧！” 这是卫婕喜欢的一名选手分享在社交平台的一句话，在她迷茫时给了她很大鼓舞，“这让我面对选择时，不会因为害怕失败而退缩。”在观赛过程中，她也慢慢提升了抗压能力，学会了自洽。“运动员可能付出超过常人几百倍的努力，却仍会因为运气或其他因素没能拿到想要的结果。以前遇到不顺，我容易自怨自艾；现在我明白很多事不必过度纠结，就算努力之后没能如愿，我也能更坦然地接受。”\n\n　　为了支持自己喜欢的选手，赵欣开始尝试不少新事物，“比如一个人出门旅行，制作赛事物料，剪辑视频记录选手的成长。”除了学到新技能，观看竞技体育赛事也丰富了她的精神世界，选手的故事持续激励着她：“之前有一名选手年少成名，却十年无缘最有分量的冠军，最终在队伍不被任何人看好的情况下，以黑马之姿夺冠。” 每当想要放弃的时候，这段故事都能帮她重拾信心：“这些选手站在世界级赛事舞台上，顶着巨大压力，一次次遭遇失利，却依旧保持热爱、为之付出。相比之下，我生活里遇到的挫折其实微不足道，再坚持一下，或许我也能迎来不一样的结果。”\n\n　　观看竞技体育赛事给年轻人带来了哪些积极影响？调查显示，56.0%的受访青年从中学会了接纳输赢，提升抗压能力；54.6%的受访青年舒缓了日常焦虑，调节情绪，放松自我；46.4%的受访青年在遇到挫折时，能被鼓舞，不轻言放弃。其他还有：受到带动，愿意主动运动，坚持锻炼(45.4%)；理解分工协作，提升团队意识(33.5%)；懂得尊重规则、敬畏公平(34.7%)；激发集体认同感与家国情怀(25.2%)等。\n\n　　受访青年中，男性占52.8%，女性占47.2%。05后占5.2%，00后占32.2%，95后占25.6%，90后占37.0%。\n\n　　(除卫婕外，受访者均为化名)\n\n　　中青报·中青网记者 戴瑶 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:梁异】",

          "body": "消防隐患要消除 酿成火灾或领刑(以案说法)\n\n　　此前的一天夜里，上海市嘉定区一栋三层商务小楼突然火光冲天，冒出浓烟。嘉定区消防救援支队接到报警后，马上赶到现场。\n\n　　原来，该建筑一楼停放着待出售的电动自行车及铅酸电池、轮胎、小配件等，而2、3层则被店主王某出租给了他人居住。消防救援人员马上将被困火场的2、3层住户张某、李某救出，并送医救治。可张某、李某已经受到了火灾现场有毒气体的侵害，其中，张某已经意识丧失、呼吸停止，送医后还是不治身亡。\n\n　　公安机关调查发现，王某租赁该商铺多年，1层用于经营电动自行车店，同时楼上用于住宿。此前，相关部门对该店几次开展消防检查时，均发现店内经营区域存在灭火器过期、电气线路不符合消防技术标准等违法行为，多次对其处罚，要求整改。王某每次被处罚后也进行了整改，可没过多久，店里又会出现新的违反消防法规的行为。案发时，王某甚至还使用铜导线连接自制拖线板为相关设备充电。而正是这次充电引发电气线路故障，最终引发火灾。\r\n\n　　在此之前，民警就发现该店楼上存在违规住人的情况，当即就告知王某，这类经营场所必须在物理隔离等方面符合消防法相关规定才行。后来，王某为了应付检查，就让楼上的住户搬走，但很快又将楼上出租出去供人居住。最终，王某被以消防责任事故罪起诉至嘉定区人民法院。\n\n　　法院审理认为，王某租赁的房屋属于集储存、经营和住宿于一体的“三合一”场所。而且，住宿与其他使用功能之间未设置有效的防火分隔，违反了消防法相关规定，即生产、储存、经营其他物品的场所与居住场所设置在同一建筑物内的，应当符合国家工程建设消防技术标准。\n\n　　现有证据证实，属地派出所民警就“三合一”场所多次向王某申明楼上不能住人，王某都敷衍应付。虽然用木门等进行了隔断，但防火分隔仍然不到位，加之本次自制拖线板为相关设备充电引发火灾，最终发生惨剧。王某在消防监督机构通知警告后，没有认真采取有效改正措施，属于刑法规定的“拒绝执行”，而引发火灾严重后果，行为符合消防责任事故罪构成要件。最终，法院判决王某犯消防责任事故罪，判处有期徒刑一年六个月。\n\n　　法官提醒，消防安全一环扣一环，一定要坚持安全第一、预防为主。相关部门要全面排查重点场所的突出风险隐患。电动自行车消费者也要定期对锂电池进行健康评估，千万不要购买不合格的电动车及配件，更不要用私拉电线、乱接插座等方式充电。(记者 金歆) 【编辑:梁异】",

          "body": "很多人觉得骨质疏松不是大事\n\n　　这是一个很大的误区\n\n　　事实上\n\n　　骨质疏松会让骨骼脆性增加\r\n\n　　一旦跌倒极易发生骨折\n\n　　骨折后可能致残\n\n　　严重时甚至危及生命\n\n　　报告单上的指标到底是什么意思？\n\n　　我们应该如何科学对待骨质疏松？\n\n　　3个方法发现骨质疏松\n\n　　4个关键应对骨质疏松\n\n　　一起来看～\n\n　　01\n\n　　骨质在无声无息中流失\n\n　　人群普遍规律\n\n　　30～35岁：骨量达到峰值\n\n　　36～49岁：维持稳定，缓慢流失\n\n　　50～69岁：迅速减少\n\n　　70岁以上：持续减少\n\n　　过程：骨量减少—骨质疏松症—骨折\n\n　　发生骨质疏松性骨折后，患者的致残率和死亡率会显著增加，第一次骨折之后，再发骨折风险较高。\n\n　　其中，髋部骨折是骨质疏松症严重的并发症。发生髋部骨折后1年内，约20%的患者可能死于各种并发症，约50%的患者致残，生活质量明显下降。\n\n　　而这种风险离我们并不遥远。全国骨质疏松症流行病学调查显示，我国50岁以上人群骨质疏松症患病率为19.2%，其中50岁以上女性为32.1%，65岁以上女性患病率更达到51.6%。\n\n　　02\n\n　　3个方法，测一测骨质疏松风险\n\n　　OSTA亚洲人骨质疏松自我筛查工具(主要适用于绝经后亚洲女性)\n\n　　计算方法：(体重kg-年龄)×0.2=OSTA风险指数\n\n　　结果分析：\n\n　　指数＞-1，发生骨质疏松的风险较低；\n\n　　-4＜指数≤-1，属于中风险，建议到医院咨询，提前干预；\n\n　　指数≤-4，为高风险，建议尽快到医院做骨密度检查。\n\n　　举例说明：体重50公斤，年龄85岁的人，风险指数为(50－85)×0.2=-7，结果≤-4，提示骨质疏松高风险。\n\n　　3大症状，警惕骨质疏松\n\n　　腰背痛；\n\n　　驼背；\n\n　　身高缩短超过3厘米。\n\n　　以上3种情况，常提示可能存在脊柱压缩改变，需要排查骨质疏松。\n\n　　骨密度检测：报告上的3个核心指标\n\n　　双能X线骨密度检测是诊断骨质疏松的金标准，筛查建议如下：\n\n　　常规筛查人群：建议将骨密度纳入40岁以上人群常规体检项目。\n\n　　高危人群：长期服用激素、有脆性骨折史、体重过低、有烟酒嗜好等高危人群，即便没有不适，也建议主动排查骨量。女性早绝经(45岁前)、男性存在性腺功能减退症，同样需要尽早评估骨骼健康。\n\n　　T值：绝经后女性、50岁以上男性的诊断核心\n\n　　它是诊断骨质疏松的核心指标，对应分级标准如下：\n\n　　T值≥-1：骨量处于正常范围；\n\n　　-2.5＜T值＜-1：骨量减少，属于骨质疏松前期；\n\n　　T值≤-2.5：可诊断为骨质疏松症。\n\n　　Z值：绝经前女性、50岁以下男性的参考指标\n\n　　判断骨量是否符合自身年龄的正常水平。\n\n　　判断标准：\n\n　　Z值＞-2：骨量处于同年龄段的平均水平；\n\n　　Z值≤-2：骨密度低于同年龄人群平均水平，需要排查原因并积极干预。\n\n　　只看骨密度不够：结合动态指标判断流失速度\n\n　　骨密度反映的是骨骼的静态状态，只能体现检测当下的骨量水平，无法判断骨量丢失的快慢。\n\n　　如果想要了解近3个月的骨代谢动态、骨量流失速率，还需检测骨转换生化标志物。这项血液指标可以反映骨吸收与骨形成的活跃程度，和骨密度结果结合分析，才能更准确评估是否需要及时启动药物干预。\n\n　　另外需要注意，骨骼代谢周期较长，骨密度复查不宜过于频繁，通常6个月—1年检测1次即可，6个月内复查一般很难观察到明显变化。\n\n　　03\n\n　　日常护骨4字诀：吃、晒、动、戒\n\n　　骨量的积累与维护，离不开日常的健康管理，做好4件事，守护骨骼健康。\n\n　　吃：补足钙与优质蛋白\n\n　　充足的钙与蛋白质摄入，是维护骨骼健康的核心营养基础。\n\n　　普通健康成年人每日蛋白质推荐摄入量为0.8～1.0克/千克体重；\n\n　　骨质疏松人群、老年群体建议提升至每日1.0～1.2克/千克体重，以维持肌肉量、保障骨代谢正常运转；\n\n　　高龄、消瘦或已发生脆性骨折的患者，可进一步增至1.2～1.5克/千克体重，有助于降低肌肉衰减与再发骨折的风险。\n\n　　补钙优先通过膳食实现，建议每日摄入至少300毫升牛奶或相当量的奶制品，搭配豆制品、深绿色叶菜、鱼虾类等富钙食物。\n\n　　日常还要避免过度节食减重，防止营养摄入不足持续损耗骨量。\n\n　　晒：促进维生素D合成\n\n　　维生素D是钙吸收的“搬运工”，每日接受10～20分钟的日晒，可促进皮肤自行合成维生素D，帮助钙质沉积到骨骼中。注意避免正午强光暴晒，防止皮肤晒伤。\n\n　　动：给骨骼适度应力刺激\n\n　　骨骼遵循“用进废退”的原则，负重与力量训练能给骨骼施加良性刺激，促进骨形成。\n\n　　日常可选择快走、慢跑、跳绳、球类运动、深蹲等，既能锻炼肌肉，也能强化骨骼强度。\n\n　　戒：避开伤骨坏习惯\n\n　　戒烟限酒，避免过量饮用碳酸饮料、咖啡，尽量避免或少用影响骨代谢的药物，避免长期过度节食，减少骨量的不必要消耗。\n\n　　专家提醒：\n\n　　如果已确诊骨质疏松，或骨量减少且骨转换指标提示骨流失速度很快，仅靠补充营养远远不够。\n\n　　需由医生结合骨密度水平、骨代谢类型进行评估，选择规范的抗骨质疏松药物方案，有助于改善骨密度、降低骨折风险。\n\n　　应对骨质疏松行动指南\n\n　　测一测骨质疏松风险，试试这3个方法\n\n　　1.(体重kg-年龄)×0.2=OSTA风险指数，指数≤-4，建议尽快到医院做骨密度检查；\n\n　　2.骨密度检测；\n\n　　3.腰背痛、驼背、身高缩短超过3厘米。\n\n　　做好4件事，守护骨骼健康\n\n　　1.吃：每天摄入适量牛奶或酸奶，多吃豆制品、深绿色叶菜、鱼虾类食物，同时避免过度节食减重。\n\n　　2.晒：每日接受10～20分钟的日晒。\n\n　　3.动：日常可选择快走、慢跑、跳绳、球类运动、深蹲等。\n\n　　4.戒：戒烟限酒，减少含糖饮料、浓咖啡的过量摄入，避免长期过度节食。\n\n　　温馨提示\n\n　　本文为健康科普，不替代专业诊疗。骨量异常、腰背持续疼痛、身高明显缩短，请及时到骨科或内分泌科就诊，遵医嘱检查、干预。\n\n　　钙剂与维生素D仅作为基础营养支持，单纯补充一般难以逆转骨密度下降，也无法单独有效降低骨折风险，不能替代药物治疗。 【编辑:梁异】",

          "body": "英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層黃樂（Alice Huang）的婚外情風波持續。美國商務部與司法部披露，美方早於2024年已就Megaspeed涉嫌違反出口管制展開調查，並於去年6月派員到公司實地查核及約談黃樂；英偉達亦於同月將Megaspeed列入公司「禁售」名單。\n2024年啟動調查　去年要求交出銷售紀錄\n兩部門在聯合聲明中表示，當局透過主動監察敏感半導體可能遭轉運的情況，發現可疑活動，遂於2024年啟動調查。商務部調查人員於2025年5月要求英偉達提交直接或間接向Megaspeed銷售產品的紀錄，英偉達翌月將該公司列入禁售名單。\n相關新聞：黃仁勳下台｜Nvidia宣布提前加薪派股權穩軍心 重申無意讓黃回歸\n聲明指，商務部工業與安全局人員其後聯同新加坡執法機關，於2025年6月到Megaspeed進行實地最終用途查核，並約談當時擔任行政總裁的黃樂。司法部其後接手主導刑事調查，惟聲明未交代具體接手日期，亦未公布針對Megaspeed的起訴。\nCNN：現有情報不足證明黃樂從事間諜活動\nCNN報道，美國商務部長盧特尼克近日因處理Megaspeed案的步伐受到質疑，財政部長貝森特亦曾批評商務部，延誤將這家英偉達客戶識別為潛在國安威脅。兩部門表示，雖然一般不評論進行中的調查，但認為有必要向公眾交代事實，澄清報道中的不準確資訊。\n至於黃樂被指可能與情報活動有關，CNN引述多名消息人士指出，美國情報界仍在釐清她與中國政府的關係，目前掌握的情報不足以證明她曾為北京從事間諜活動。相關懷疑不能視為已獲證實的結論。\n新加坡稱未查間諜活動　黃樂已被禁再入境\n新加坡內政部早前公布，當地警方及海關於2025年2月展開獨立調查，涉及採購伺服器時可能作出虛假申報等罪行。黃樂當時是Megaspeed行政總裁、主席及主要控制人之一，因此接受調查；當局強調，並非就間諜活動調查她。\n新加坡警方今年2月經諮詢總檢察署後，認為證據不足以確立黃樂涉及相關申報罪行。不過，警方認定她在調查期間提供明知不準確的資料，試圖淡化自己在公司的角色，因此向她發出嚴厲警告，並禁止她再次入境。當局於2月26日歸還護照，她同日離境；針對Megaspeed及另外6人的調查仍在進行。\nMegaspeed則表示，黃樂已於2025年8月離職，目前未在公司擔任任何職務，並反駁近期部分涉及其業務、供應鏈及全球營運的報道，指相關說法缺乏可核實證據。",

          "body": "近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。体育环(长)跑、上课点名、接水饮水、饭卡充值……校园生活的每一处场景，几乎都对应着不同的App或小程序。“校园App臃肿”的话题在网上引发激烈讨论，仅微博平台的相关话题阅读量就接近1亿。校园App为何越装越多？解决之道何在？\r\n\n　　校园里的数据孤岛\n\n　　打开不少大学生的手机，“超星学习通”“今日校园”“创高体育”“U净洗衣”“胖乖生活”等不同门类的App占满了屏幕，每一个都需要单独下载、注册并授权。2025年12月，一项面向全国高校大学生的问卷调查显示，97.72%的受访者日常使用校园App，其中93.89%的受访者在使用过程中受到不同程度的困扰。\n\n　　尽管吐槽不断，但独属校园的这些App又“不得不用”。以上课为例，三四个App都能签到，两三个平台都可随堂测验，任课老师挑自己顺手的用，学生却一个都不敢删。北京某高校大二学生小玖受访时表示，其英语课作业需用3个App才能完成：“批改网”写作文、“U校园”听听力、“fif口语训练平台”练口语。“它们太占内存了，等学期结束后，我打算都删了。”小玖说。\n\n　　有些应用看似体贴地提供了微信、支付宝小程序作为“轻量替代”，功能却大打折扣。华中某高校的学生宿舍洗衣机关联着“海乐生活”平台，学生小林就因小程序常常卡顿、无法使用预约功能，不得不专门下载了App。\n\n　　除了功能单一，商业广告多、运行不稳定、存在数据泄露风险等问题，这类校园App让学生不堪其扰。小玖学校的饮水机用的是一款叫“慧生活798”的App，每次喝水前都得先连着关掉几个弹窗，稍不留意就会“跳转”到购物软件。不少网友抱怨“洗个澡得先看一串广告”“看完广告热水都凉了”。\n\n　　校企各方整合难\n\n　　部分校园App乱象的根源，在于一些高校各部门各自为政，教务、学工、后勤、团委等部门往往只关注自身的管理需求，各部门对接不同供应商：每当合约到期、重新招标，系统便可能整体更换，学生只能重新下载、注册。\n\n　　企业逐利，绑架了学生的刚需。由第三方企业运营的生活服务类App一旦与校园生活强绑定，学生的手机便成为企业“跑马圈地”的沃土。对企业而言，校园是稳定的精准流量池，开屏广告、跳转流量与支付分成，共同构成了这个近乎稳赚不赔的商业闭环。有些App还强制要求开通免密支付、自动扣费，或设置最低充值金额。若学生想要退款，则颇为麻烦，甚至需要拨打12315投诉热线才能成功维权。\n\n　　在智慧校园的建设过程中，App的数量更被部分高校领导当作数字化建设的“成绩单”。校方只在意表面形式，并不关心学生使用是否便捷。西北某高校一位研究生透露，她居住的宿舍楼，若是热水器坏了，需要学生自己打电话给设备维修人员。“学校才不管，凡是不涉及安全的事，一律外包。”北方某高校一名在校内网络中心勤工俭学的学生发现，学校的部分系统版本仍停留在本世纪初，与新搭建的平台集成时问题不断，但“领导觉得好，我们就得用”。\n\n　　更何况，对于一些高校而言，新建一个平台远比多下载一个App来得麻烦——整合各方意味着协调各部门权责、触动企业利益、打破路径依赖。谁来牵头？谁来出钱？数据归谁管？就算高校有心，又能否真正实现？西部某高校相关负责人坦言，一些高校尝试自主研发软件系统，但技术能力有限，常出现各类故障；一些高校则外包给第三方，也常面临业务功能与现有系统不兼容，导致平台瘫痪的问题。\n\n　　年轻人开始自己动手\n\n　　好的数字化，应当围绕“人”转。2019年，教育部等8部门印发意见，划定备案审查、自愿选用的底线。近年来，相关部门也多次开展专项整治，要求清理冗余应用、规范广告推送。2026年8月，个人信息保护系列专项行动取得阶段性成效，不得过度收集个人信息的“最小必要”原则持续收紧。少一些“屏幕上的形式主义”，多一些“一个平台全托管”的踏实，才能让高校师生真正享受到智慧校园的便捷服务。\n\n　　如今，不少熟悉AI工具的学生选择“自力更生”：以Vibecoding的方式自行搭建集成式校园平台。来自华南某高校的小鹤同学，因为请假和订校车这两件“小事”反复受阻，所以萌生了自己动手的念头。他前后用了3天时间，搭建了一个可以代管自己在校事务的Agent，并将开源代码发布到网上。上海学生小C则围绕“Z世代校园数字生态系统设计”课题，仅用1天就搭起了一站式整合方案的雏形。\n\n　　西南大学教育学部教授彭泽平认为，高校应牵头建设功能高度集成、数据统一汇聚的智慧校园基础平台。学生之所以自行开发，根源在于其对轻量化、场景化、个性化服务的需求，与校方所提供的标准化、统一化平台之间存在错位。这些自下而上的实践不仅贴近场景，还能成为校方优化服务的“鲜活信号”。有学生反映，他使用的校园App就是民间自行开发、后被学校网络中心“招安”的，“功能越来越多，确实方便不少”。\n\n　　与其让学生各自“破墙”，不如敞开大门。重庆市教育科学研究院助理研究员邹南芳建议，将学生设计应用纳入课程学习、科研训练、专业实践等培养环节，实现数字化治理与人才培养的有机统一。在数据安全、接口合规、个人信息保护、可持续维护和责任归属等方面，学生自制应用存在一定的不确定性，校方可以开放合规、分级的标准化数据接口，建设开发沙箱与测试机制，按“最小必要”原则界定调用权限，让年轻人的热情与创造力在规则边界内自由奔涌、充分释放。\n\n　　半月谈记者：徐盛悦\n\n　　原标题《开学一个多月，手机多了十几个App》 【编辑:曲克】",

          "body": "「慌啥子嘛，慢慢來。」久未在大眾前露面的內地著名喜劇小品演員趙本山，近日為網劇獻聲演唱的歌曲《慌啥子嘛》爆紅。歌曲上線僅3小時，點讚便突破百萬，抖音相關話題播放量破兩億次。不少網民深受觸動，直言聽到落淚。\n《慌啥子嘛》最初是首含川渝方言的網絡歌曲，早前有網友以AI技術模仿趙本山聲線翻唱，在網上廣傳。面對這宗疑似侵權的創作，趙本山未有追究，反而主動聯絡原作者購入版權，親自走進錄音室重新錄製。\n\n11月13日，趙本山真人版的《慌啥子嘛》作為趙家班新劇《走馬上任》的推廣曲正式上線。官方發放的錄音花絮所見，趙本山戴上耳機，逐句反覆揣摩唱腔。他解釋願意獻唱的原因十分簡單：「孩子們愛聽，那我就唱唄。」\n這首歌歌詞簡單質樸：「慌啥子嘛，慢慢來。卸下一身的疲憊，今夜枕著星光再入睡。人生路還遠，你不必事事都完美。」\n真人版本推出後，在網上掀起巨大反響。內媒《長沙晚報》撰評稱，這首歌走紅背後是普通人對鬆弛感的集體渴望，一句「慢慢來」並非鼓勵躺平，而是給緊繃的生活按下了一個短暫停鍵。",

          "body": "英偉達（Nvidia，又稱輝達）在創辦人兼行政總裁黃仁勳因婚外婚醜聞辭職後，周三（18日）首次召開全體員工大會。臨時行政總裁克雷斯（Colette Kress）宣布，將加薪及額外股權獎勵提前至12月落實，較慣常春季調薪周期提早數月，藉此安撫員工對薪酬及公司前景的憂慮。管理層同時重申，董事會正物色永久行政總裁，無意讓黃仁勳復職。\n700條員工提問　薪酬最受關注\n據《WIRED》取得的會議發言內容，員工事前提交約700條問題，薪酬是最熱門議題，其次是要求董事會提高透明度。克雷斯表示，公司希望照顧每一位員工，讓大家對公司保持信心，毋須擔心薪酬，並承諾12月將有加薪及更多股權獎勵。\n《金融時報》引述知情人士指出，英偉達原本在春季進行年度考核及調薪。黃仁勳離任後，部分員工憂慮股價下跌會削弱股票薪酬的價值，提前調薪及發放股權獎勵，被視為新管理層穩定士氣的重要措施。\n克雷斯開場籲「繼續向前走」\nCNBC引述與會人士報道，克雷斯以「Let’s move forward」（讓我們繼續向前走）揭開大會序幕，新任董事會主席Harvey Jones及多名資深主管亦有發言。會議在加州聖克拉拉舉行，並透過網上平台向員工直播。\n面對部分員工希望黃仁勳回歸的聲音，管理層再次表明，董事會已一致接受其辭呈，並無意重新委任他為行政總裁。英偉達早前公布，永久接班人的遴選將同時考慮內部及外部人選；克雷斯過渡期間繼續兼任財務總監。\n強調產品路線不變　擴大高層維繫客戶角色\n《商業內幕》報道，主管在會上強調，公司產品路線圖、客戶關係及執行策略維持不變，客戶與合作夥伴亦在領導層變動後表達支持。不過，公司需要由更廣泛的高層團隊承擔維繫客戶的工作，延續過往由黃仁勳親自建立的聯繫。\n軟件工程高級副總裁Diercks亦表示，公司仍致力完成收購開放模型平台Hugging Face。這並非會上首次提出的新收購構想：英偉達早於9月已公布相關協議，預計2027年上半年完成，仍須取得監管批准及符合其他交割條件。",

          "body": "刘金国\n\n　　习近平总书记强调，“民心是最大的政治”，“为民造福是最大政绩”。我们党是全心全意为人民服务的马克思主义执政党，管党治党归根结底是为了坚守党的初心使命、性质宗旨，实现好、维护好、发展好最广大人民根本利益。党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，对“常态化整治群众身边不正之风和腐败问题”作出重要部署，充分体现了以习近平同志为核心的党中央始终坚持以人民为中心的发展思想，把人民放在心中最高位置。我们要深刻领悟“两个确立”的决定性意义、坚决做到“两个维护”，认真学习贯彻全会精神，不断深化认识，发扬成绩，怀着对人民群众的深厚感情，持续推进群众身边不正之风和腐败问题整治工作。\n\n　　一、整治群众身边不正之风和腐败问题意义重大\n\n　　(一)这是践行人民至上理念、巩固党的执政根基的必然要求。党的根基在人民、血脉在人民、力量在人民，党同人民是鱼水关系，一刻也不能脱离群众。发生在群众身边的不正之风和腐败问题，损害老百姓切身利益，啃食人民群众获得感，割裂党同人民群众的血肉联系，如果任其蔓延，党就会失去民心，甚至走向衰败。整治群众身边不正之风和腐败问题，是老百姓期盼的实事，是关系党的执政根基的大事，怎么用力抓都不为过。只有坚持为人民而战，把群众利益放在第一位，凡是群众反映强烈的问题都严肃认真对待，凡是侵害群众利益的行为都坚决纠正，才能不断厚植我们党长期执政的群众基础，确保红色江山永不变色。\n\n　　(二)这是持续推动全面从严治党和反腐败斗争向基层延伸的重要举措。新时代全面从严治党和反腐败斗争取得历史性成就，开辟了百年大党自我革命新境界。但必须清醒看到，“上热中温下冷”现象还不同程度存在，特别是群众身边不正之风和腐败问题量大、面广、多发，人民群众对近在眼前的“蝇贪蚁腐”深恶痛绝，迫切渴望加以整治。习近平总书记强调：“我们党强力反腐，纠‘四风’树新风，是为了赢得党心民心。如果上面九级风浪、下面纹丝不动，怎么能得到人民群众衷心拥护？”正风反腐，不仅要“打老虎”，也要“拍苍蝇”，让老百姓可感可及、真正受益。只有对基层风腐问题零容忍、严惩治，才能打通全面从严治党“最后一公里”，让人民群众切实感受到党中央和习近平总书记的关心关爱就在身边，公平正义就在身边。\n\n　　(三)这是优化基层治理、推动中国式现代化行稳致远的重要保障。基层治理是国家治理的基石。习近平总书记指出，基层是改革发展稳定的第一线，是各种矛盾和问题的集聚地，必须抓好基层治理现代化这项基础性工作。群众身边不正之风和腐败问题暴露出基层治理还存在很多薄弱环节，如果长期得不到有效解决，就会影响中国式现代化事业顺利推进。只有树立大抓基层鲜明导向，持续整治群众身边不正之风和腐败问题，坚持一体推进不敢腐不能腐不想腐，深化以案促改促治，补齐基层治理短板，护航基层经济发展，化解基层矛盾，建强基层党组织战斗堡垒，才能打牢国家治理体系的坚实底座，为凝心聚力推进中国式现代化提供有力支撑。\n\n　　二、三年集中整治的成效和经验\n\n　　习近平总书记对人民群众感情最深厚，对老百姓急难愁盼最牵挂，高度重视整治群众身边不正之风和腐败问题，多次作出重要指示批示、提出明确要求。中央纪委国家监委坚决贯彻落实党中央决策部署和习近平总书记重要指示批示精神，自2024年起在全国开展群众身边不正之风和腐败问题集中整治，集中时间、集中精力、集中力量超常规推进，各地区各有关部门共同发力，取得了让老百姓得实惠、我们党得民心的效果。\n\n　　(一)惩治了一大批“蝇贪蚁腐”。“蝇贪蚁腐”其害如虎。集中整治以办案开路，中央纪委国家监委直接查办督办、强化指导，带动各级纪检监察机关强力办案。截至2026年9月，全国查处群众身边不正之风和腐败问题235.8万个、处分163万人、留置11.2万人、移送检察机关5.8万人。紧盯民愤大、反映多的“关键少数”，处分现任或原任县级以下“一把手”38万人。突破一批“骨头案”、“钉子案”，查办一批贪腐上千万的“小官大贪”，挖出一批地域性系统性窝案串案，侵害民利的违纪违法问题得到有力遏制。直接或推动返还群众被吃拿卡要、贪占挪用等的财物2304.8亿元。\n\n　　(二)解决了一大批群众急难愁盼问题。从人民群众最关心最直接最现实的利益问题入手，集中整改整治群众反映强烈的突出问题748.1万个，覆盖衣食住行、生老病葬、安居乐业等20多个领域，推动办成了许多过去想办而没有办成的实事难事，增进民生福祉，有的立竿见影、有的长远受益。攻坚治理民生领域信访问题，化解一批10年以上积案，攻克一批跨地区跨部门难案，有力维护群众合法权益。2025年，中央纪委国家监委接收检举控告量在2024年下降9.5%基础上又下降6.2%。聚焦不动产登记难问题，推动出台政策性文件，化解630万套房屋历史遗留问题，一些群众拿到了期盼20多年的房产证。坚决整治趋利性执法、违规异地执法等乱象，为企业挽回经济损失310亿余元。推动补发村干部报酬110亿元，为11万名环卫工人补发工资8.2亿元。推动纠治残疾人等级评定不精准问题95.37万个，追缴违规资金2110.7万元，增发补发各项补贴6.3亿元，有力保障残疾人权益。推动打掉一批涉黑涉恶组织，深挖背后的腐败问题及“保护伞”，处分8179人。\n\n　　(三)破解了许多民生领域的顽瘴痼疾。针对一些民生行业乱象丛生、党中央惠民政策“沙滩流水不到头”等问题，小切口、大纵深推进7个全国性整治项目和24项民生实事，先后出台69个全国性制度规定，重点民生领域治理取得突破性进展。强力整治“校园餐”问题，首次摸清全国校园食堂供餐规模，查处贪占学生餐费、插手招标采购等问题13万个，推动建立从源头到餐桌的全链条监管责任体系，学校食堂保障条件和管理水平明显提升，“校园餐”质量普遍提高，学生吃得更安心、家长更放心。开展整治殡葬领域腐败乱象专项行动，严肃查改天价骨灰盒、“靠墓吃墓”等问题，推动殡葬行业回归公益属性，全国经营性公墓均价明显下降，群众抱怨的“葬不起”问题得到有效解决。狠抓高标准农田建设问题整治，严查资金截留挪用、利益输送、监管不力等违纪违法行为，整改工程质量缺陷、管护不力等问题21万个。针对套取骗取医保基金等问题，深入整顿医保领域乱象，严查党员、干部失职失责问题，斩断骗保利益链条，追回群众医保“看病钱”572.3亿元。\n\n　　(四)有效提升基层监督治理水平。加强对基层的指导和帮助，推动资源力量下沉，着力解决基层治理“小马拉大车”问题。中央纪委国家监委直接督办1.6万个基层问题，推动解决35项“表现在基层、根子在上面”问题。各级各有关部门党员、干部沉到一线参与整治、纾困解难。行政执法监督平台、农村集体“三资”平台等直通县乡村，赋能基层治理。完善基层监督体系，推动纪检监察监督与巡视巡察、审计、财会等监督贯通协调，持续提升基层监督治理效能。坚决整治形式主义为基层减负，公开通报30起典型案例。\n\n　　国家统计局民意调查结果显示，农村居民对集中整治效果认可的比例达到96%，人民群众发自内心念党好、感党恩，更加爱戴习近平总书记、拥护党中央。在三年集中整治中，各地区各有关部门深入践行习近平新时代中国特色社会主义思想特别是习近平党建思想，坚持学以致用、用以促干，积累了经验，为常态化整治打下良好基础。\n\n　　一是发挥党的领导优势，压实责任聚合力。党的领导是各方合力、“一盘棋”推进集中整治的根本保证。必须始终压实责任，党政主责靠前主抓、纪委牵头全力推动、部门协同一贯到底、市县主战抓乡促村，引导人民群众广泛参与，横向联动、纵向贯通、全面发力，形成强劲态势。\n\n　　二是落实全面从严要求，强力办案揭盖子。办案是最直接、最有力的整治措施，这一手决不能松。必须始终坚持以办案带全局，对问题线索全面排查起底、集中优势力量突破，对涉及范围广、影响恶劣的从严查处，对疑难复杂、干扰多阻力大的联动攻坚，提级办理，查深查透。\n\n　　三是始终树牢宗旨意识，用情用力办实事。老百姓是天，老百姓是地。必须始终把老百姓的事当成自己的事，想尽办法解决群众反映强烈的痛点难点问题，真正守好百姓的钱、办好群众的事、治好为民的权。坚持开门搞整治，充分依靠群众，回应群众诉求，接受群众评判。千好万好老百姓说好才是真的好，千条万条老百姓的感受是第一条。\n\n　　四是聚焦工作短板漏洞，建章立制固成果。制度建设是打基础、利长远的，必须坚持运用改革的办法巩固整治成果，推动制度治权、依规治权。坚持“查改治”一体推进，把正风反腐与深化改革、完善制度、促进治理贯通起来，推动职能部门加强监管、堵塞漏洞，健全维护群众利益常态长效机制。\n\n　　五是强化基层支撑保障，督帮结合促提升。集中整治主战场在基层，必须聚焦县级以下补短板、强弱项。坚持抓两头、带中间，加强调度、督导、调研，对薄弱地区“一县一策”分类指导，促进整体提升。深化基层监督体制机制改革，优化县乡纪检监察机构设置和力量配备，推动监督下沉。\n\n　　六是正确运用政策策略，务实唯实保质效。基层情况千差万别，必须坚持实事求是，一切从实际出发，不下指标、不搞“一刀切”、不办“凑数案”。坚持惩前毖后、治病救人，准确运用“四种形态”，宽严相济、区别对待，激励干部担当作为。坚持从群众愿望和实际需要出发，突出重点，动真碰硬推进整治项目、办好民生实事，确保抓一个成一个，以看得见、摸得着的实际成效取信于民。\n\n　　三、常态长效推进整治工作\n\n　　群众身边不正之风和腐败问题积弊甚深，必须保持永远在路上的坚韧执着，以钉钉子精神系统整治，不断巩固、扩大成果。\n\n　　(一)健全齐抓共管责任体系。常态化整治要取得实效，各方主动担责、协同发力是关键。各级党委和政府扛牢主体责任，健全整治责任机制，加强统筹领导，靠前真抓实抓，增强整治工作整体性、协同性。职能部门切实履行行业主管和部门监管责任。纪委监委立足“监督的再监督”，加强对责任落实情况的监督检查，逐级拧紧责任螺丝。推动把常态化整治情况纳入党政督查、巡视巡察和部门评议、干部考核，强化结果运用，坚持“好的表扬、差的批评”，对履责不力的严肃问责并通报曝光。\n\n　　(二)纵深推进基层正风反腐。发扬斗争精神，狠抓办案不放松，对老问题深挖彻查，对新问题露头就打，持续形成强大震慑。紧盯资金使用、项目审批、工程建设等基层公权力运行关键环节，用好督办直办、片区协作、大数据比对等手段，深入排查问题线索，严查群众反映强烈的突出问题，坚决斩断伸向群众利益的“黑手”。对被贪占的财物应返尽返，承诺事项务必做到，让人民群众有更多更直接的获得感。深化以案促改促治，有针对性制发纪检监察建议书，逐一跟踪问效，确保整改到位。\n\n　　(三)闭环整治民生突出问题。紧扣民生痛点强力攻坚，一个问题一个问题解决。对问题多发的民生领域开展全国性整治，推动职能部门抓条线、带系统，全面查改乱象。指导各地因地制宜找准切口，完善领导包联、“纪巡审”贯通、拉网式排查等措施，真抓实干为群众办实事解难题。健全“群众点题、部门答题、纪委监督、社会评价”机制，抓好普惠性、基础性、兜底性民生实事，真正把工作做到群众心坎上。\n\n　　(四)系统施治提升基层治理水平。坚持党建引领基层治理，把整治工作与乡村振兴、基层组织建设、整治形式主义为基层减负等工作贯通起来，更好发挥基层党组织战斗堡垒作用和党员先锋模范作用。持续推动基层党务政务公开，统筹推进信息化平台建设，解决好监管缺位、数据壁垒等深层次问题，规范基层小微权力运行。注重发动群众、依靠群众，坚持和发展新时代“枫桥经验”，及时有效化解各类矛盾纠纷，提升基层治理效能。 【编辑:曹子健】",

          "body": "中新社布鲁塞尔11月18日电 (记者 德永健)中国驻欧盟使团17日在布鲁塞尔举办专题讲座，阐释台湾问题中方原则立场和政策主张。\n\n　　讲座由中国驻欧盟使团团长蔡润主持，第十四届全国政协常委、外事委员会副主任刘结一应邀主讲，中国政府欧洲事务特别代表卢沙野、第十四届全国政协委员、中华全国台湾同胞联谊会副会长蔡睿等专家组成员一同出席。欧盟官员、欧洲议会议员、有关国家驻欧盟使节、智库学者等各界人士180余人参加讲座。\n\n　　刘结一系统阐释台湾问题的历史经纬、法理事实，全面介绍两岸关系现状，深入解读中国政府在台湾问题上的原则立场和政策主张，强调台湾问题是中国核心利益中的核心，希望欧方顺应大势，站在历史正确一边，切实尊重中国主权和领土完整，支持中国统一大业。\n\n　　蔡润表示，中欧关系发展积累起多方面宝贵经验，关键是尊重各自人民选择的社会制度和发展道路，尊重彼此核心利益和重大关切。希望欧方充分认识台湾问题的重要性敏感性，以实际行动恪守一个中国原则，尊重支持中方核心利益。\r\n\n　　讲座现场气氛热烈。来宾们积极评价讲座，认为增进了对台湾问题和中方立场的理解认识，愿努力推动欧中关系健康稳定发展。(完) 【编辑:曲克】",

          "body": "新盤自帶基本交樓裝修，雖可省卻不少工程，但格局及用料往往較為劃一，如何沿用原有基礎，同時融入個人喜好與生活習慣，便成為改造關鍵。日出康城Grand Season一個300多方呎一房單位，獨居的女戶主偏愛自然色系與法式元素，亦熱愛煮食及烘焙，遂斥資約26萬元，委託Mstudio微工作室設計總監Marcus Ko操刀。團隊保留原有裝修，以鼠尾草綠與淺木色為主調，配搭歐式花線、水波玻璃及圓拱元素，並增設弧形中島擴充烘焙操作空間，睡房則劃分工作與休息兩區，在有限面積內兼顧實用需要與輕法式格調。\n沿用新樓裝修 拆鞋櫃重整玄關\n單位屬一手新盤，原有木地板等交樓裝修狀況良好，團隊因此未有大幅拆改，而是將工程集中於訂製傢俬、櫃門飾面及配色，透過局部改動，為全屋建立一致風格。\n團隊重新規劃大門旁的儲物空間，新造到頂鞋櫃與矮櫃沿牆排列，令入口一帶的櫃體線條更整齊連貫。\n玄關是少數需要拆改的位置。發展商原設鞋櫃的開門方向及布局，未能配合新增櫃體與枱面的配置，團隊遂將其拆除，重新規劃大門旁的儲物空間。新造到頂鞋櫃與矮櫃沿牆排列，令入口一帶的櫃體線條更整齊連貫。\n櫃身採用低飽和、帶灰調的鼠尾草綠，配搭古銅金色拉手及淺木開放層架，甫進門已見全屋主調。原有淺木地板則貫穿公共空間，以溫潤木色平衡綠色櫃身，亦讓新增傢俬自然融入交樓裝修。\n廚櫃「轉色」融入全屋 弧形中島擴充烘焙空間\n女戶主熱愛煮食及烘焙，惟原有開放式廚房的枱面有限，搓麵糰、備料及製作甜點時難免侷促。如何在不大改格局的前提下增加操作空間，遂成為改造重點之一。\n團隊保留廚房原有位置及主要設備，集中從櫃門飾面着手，以鼠尾草綠框線門板配搭淺色工作枱及古銅金色拉手，讓原本風格較中性的廚櫃融入全屋設計。部分吊櫃改用水波玻璃門，透過帶紋理的半透明材質，隱約透出櫃內物件，既增添光影層次，視覺上亦較全實心門板輕盈；其間穿插淺木背板，呼應原有木地板。\n為補足烘焙所需的操作位置，團隊在廚房與客廳之間增設弧形中島，方便戶主搓麵糰、準備材料及製作甜點。\n為補足烘焙所需的操作位置，團隊在廚房與客廳之間增設弧形中島，方便戶主搓麵糰、準備材料及製作甜點。中島下方設有儲物空間，可收納體積較大的煮食及烘焙器具；靠通道一端則以圓弧收邊，減少尖角對走動的影響，同時柔化櫃體線條。\n鼠尾草綠櫃牆定調 拱形木飾面添層次\n由廚房延伸至客廳，鼠尾草綠繼續貫穿兩側訂製櫃體，成為公共空間的主色。Marcus沒有將綠色大幅鋪滿牆身，而是集中用於儲物櫃、吊櫃及梳化背後的半高護牆，再以奶油白與淺木色調和，既突顯主題，亦避免小空間顯得沉重。\n櫃門加入簡化歐式花線及古銅金色五金，為平整櫃面增添細節；旁邊穿插淺木開放層架，將封閉儲物與展示位置分開，並以自然木質感中和法式裝飾的精緻感。\n靠露台一側設淺木色矮櫃，背後配以大型拱形木飾面，畫作及擺設可直接靠放於櫃面，構成客廳的視覺焦點。拱形輪廓呼應中島的弧角，在方正櫃體之間加入曲線，令整體觀感更柔和。\n客廳傢俬配置保持簡潔，梳化靠牆擺放，展示與儲物功能集中於另一側，中央則保留由入口通往露台的主要動線。淺木地板一路延伸至落地玻璃門，配合低身傢俬及自然採光，讓狹長客廳保持開揚。\n圓拱門洞分隔工作睡眠區 奶油白營造柔和寢區\n一房單位面積有限，睡房除了供休息，亦須兼顧工作及衣物收納。團隊以大型圓拱門洞為界，將靠入口的書枱、衣櫃區與靠窗的睡眠區分開，毋須另加門片或實牆。從工作位置望入房內，視線仍可穿過拱形開口，直達睡床及窗戶，在劃分功能之餘，亦保留採光與通透感。\n工作區沿牆整合書枱及到頂衣櫃，將工作、閱讀與衣物收納集中處理，減少零散傢俬佔用走道。鼠尾草綠框線櫃門配搭淺木枱面及古銅色拉手，延續公共空間的設計，用色則較為克制。\n由工作區進入寢區，須踏上一級淺木地台，透過高低差進一步區分兩個區域；圓拱門洞則猶如一道畫框，將靠窗睡床框入其中。相比公共空間，睡房減少了鼠尾草綠的比例，僅於衣櫃、書枱櫃及半高護牆局部點綴；睡眠位置則以奶油白牆身、米白軟包床頭及淺木色為主，營造柔和寧靜的休息氛圍。\n床頭牆加入簡化花線及壁燈，呼應圓拱曲線，保留輕法式細節，同時避免小房間因裝飾過多而顯得繁複。工作與睡眠兩區各有分工，色調亦由公共空間較鮮明的鼠尾草綠，逐步過渡至私人寢區的明亮柔和。\n圖片由Mstudio微工作室提供\n相關文章：百萬改造黃埔花園鑽石廳 石紋電視牆連窗台弱化斜角 L形玻璃酒櫃展示珍藏\n相關文章：140萬改造夫婦回港度假宅 法式中古風重留白 設計師巧用胡桃木包橫樑 結構限制變視覺主軸\n相關文章：110萬改造1400呎雙連戶 飾面板修飾鑽石廳 主人套房增海景健身區 打通兩房姊妹共享大空間\n相關文章：元朗300呎居屋一家三口住 40萬改造變兩房 傢俬牆雙面           "body": "新华社昆明11月18日电 中共中央政治局常委、全国人大常委会委员长赵乐际11月16日至18日在云南调研。他强调，要坚持用习近平新时代中国特色社会主义思想凝心铸魂，深入学习贯彻党的二十届五中全会精神，以更高标准、更实举措深入推进人大党的建设，以高质量党建引领人大工作高质量发展。\n\n　　赵乐际先后来到红河州、昆明市，深入人大代表工作站、企业、社区、乡村和农户家中，与代表、群众面对面交流，听取意见建议。他强调，人大代表要带头学习宣传贯彻五中全会精神，自觉加强思想政治和纪律作风建设，忠实代表人民的利益和意志参加行使国家权力，当好党和国家联系人民群众的桥梁。要立足本职建功立业，接地气、察民情，反映群众呼声，依法推动解决群众关心的问题，让群众感到代表就在身边，让全过程人民民主可感可及。要廉洁自律，树立良好形象，自觉接受原选举单位和人民群众的监督。\n\n　　赵乐际在红河州人大和省人大机关调研预算决算审查监督、依法推进生态环境建设、县乡两级人大换届选举等工作，看望机关干部，并主持召开座谈会。他强调，各级人大要把深入学习贯彻习近平党建思想和五中全会精神作为重大政治任务，结合人大党建和工作实际落实到位。要坚持党的全面领导和党中央集中统一领导，通过立法、监督等工作贯彻党的主张、完成党的任务，以实际行动拥护“两个确立”、做到“两个维护”。人大各级党组织和党员干部、党员代表要把加强党性修养作为终身课题，坚定理想信念、铸牢对党忠诚。要坚持严的基调不动摇，建强组织、管好队伍，强化人大各级党组织的政治功能和组织功能，落实管党治党主体责任。要把作风建设融入日常、抓在经常，锲而不舍落实中央八项规定精神，不断改进会风文风。\n\n　　赵乐际指出，人大履职要自觉围绕中心、服务大局，树立和践行正确政绩观，把党建成果转化为工作实效，为实现“十五五”目标任务提供法治保障。要抓住提高立法质量这个关键，不断完善中国特色社会主义法律体系。地方立法要发挥实施性、补充性、探索性功能，因地制宜、突出特色，注重解决实际问题，切实维护国家法治统一。要坚持正确监督、有效监督、依法监督，更好发挥人大监督在党和国家监督体系中的重要作用。\n\n　　赵乐际强调，县乡两级人大换届选举正在有序推进。要坚持党的领导、充分发扬民主、严格依法办事，做实做细各项工作，切实保证选民登记率、投票参选率，有力保障宪法法律赋予公民的选举权，充分展现人民当家作主实践和国家根本政治制度优势。 【编辑:刘欢】",

          "body": "11月18日，《丹噶尔的凝望——一位美国友人镜头下的湟源古城》影像展在青海省西宁市博物馆二楼展厅开展，数百帧由美籍友人柏大卫捐赠的百年湟源老照片首次亮相西宁。\n\n这批影像源自上世纪二三十年代，柏大卫的父亲柏立美长期在青海湟源生活，以相机为笔，记录下丹噶尔古城的人文风貌。古城墙肌理、香水园市井烟火、街头杂碎小摊、热闹的社火高台、各族民众日常百态皆被一一定格，留存下极为稀缺的近代河湟民俗影像史料。\n\n1932年，年仅一岁的柏大卫随父亲来到湟源，在这片高原土地生活十八载，习得一口地道的湟源方言。此后阔别故土多年，乡愁从未消减。自1987年起的二十余年间，柏大卫三十余次往返中美两地，将父亲留下的数百张照片无偿捐给湟源，并累计为当地捐赠CT机、B超机等医疗设备三十余件，价值逾六百万元人民币。\n\n已是95岁高龄的柏大卫如今身居海外，却始终心系湟源。柏大卫曾说：“一个人一生只能有一个故乡，湟源是我唯一的、永远的故乡。”\n\n如今，这些漂泊海外许久的老照片回到西宁展出，让民众得以隔着百年时光，与古城丹噶尔完成一场特殊的“面对面”。(刘洋）",

          "body": "11月18日，《中国日报》独家发表东盟秘书长高金洪署名文章，表示东盟国家与中国的经济正处于结构性转型之中，这一转型正在重塑整个地区的工作组织方式、贸易开展方式以及财富分配格局。传统办公模式正逐渐让位于“随处办公”的经济形态，数字市场也早已突破最初的小众领域，成为区域经济增长的主要引擎。\r\n\n　　文章提到，目前，东盟数字经济规模巨大。与此同时，中国已在5G、人工智能、智慧城市和数据基础设施等领域具备较强实力。这两大发展趋势的交汇带来了战略性机遇，各方需要采取协调一致、果断有力的行动。相关制度基础已经开始构建。《东盟—中国自由贸易区(ACFTA)3.0升级版议定书》和《区域全面经济伙伴关系协定》(RCEP)这两项重要框架，为双方经济体乃至更广泛区域深化数字互联互通提供了法律基础。\n\n　　《东盟数字经济框架协议》(DEFA)将进一步完善相关制度架构，为构建安全、无缝、包容且互操作的数字环境勾勒蓝图。尤为重要的是，该协议将推动监管规则协调，为劳动力从不确定性走向真正的发展机遇创造必要条件，确保数字经济扩张能够转化为实实在在的职业发展机会，而不仅仅体现为经济总量的增长。\n\n　　文章强调，这些并非抽象的政策工具。它们将成为具体的合作机制，使雅加达的软件开发人员或马尼拉的数字营销人员能够获得深圳或上海企业的资质认可。这正是技能优先型经济在实践中的体现：资质证书能够在跨境就业中获得真正认可，劳动力市场依据能力而非地理位置决定人才价值。从更广泛的层面看，东盟与中国深化数字合作，将为双方数百万企业和消费者提供转型经营模式、提高生产效率以及增强全球市场竞争力的途径。\n\n　　文章指出，中小微企业面临的机遇与挑战尤为突出。中国先进的物流和支付基础设施与东盟充满活力的初创企业生态系统实现更高水平的互操作，有望催生新一代由青年创办、从成立之初就面向全球市场的微型跨国企业。直播电商、安全的跨境数据流动以及便捷的数字金融服务，如今都已具备应用条件，关键在于监管环境能否允许这些工具得到充分利用。当务之急是将这些工具从首都城市延伸至长期被排除在全球贸易之外的农村地区，帮助当地创业者参与数字经济。农村地区的互联互通是实现公平增长的前提。\n\n　　然而，仅有基础设施和制度框架还远远不够。数字经济所依托的就业质量同样需要得到高度重视，并被置于优先位置。平台就业在整个地区迅速扩张，但其中相当一部分劳动者缺乏充分保障，收入不稳定，也缺少职业晋升渠道。监管框架必须真正适应数字化发展的现实。东盟目前正在制定区域性指导方针，以提高数字平台劳动者的就业标准。这一工作的出发点是：以人为本的转型不仅是一项道德承诺，也是经济发展的必然要求。得到保障并受到公平对待的劳动者，生产效率更高、创新能力更强，也更具韧性。\n\n　　文章表示，数字技能提升是这一问题的另一面。只有有计划地投入人工智能能力培养、网络安全、数据管理和绿色技术等领域，才能将数字接入机会转化为实际的发展进步。尤为重要的是，通过协调远程办公和网络安全政策，我们能够创造必要条件，使东盟和中国的青年无需离开家乡，也能作为高附加值服务提供者参与全球供应链，在人工智能安全、数据托管和绿色技术等领域发光发热。如此一来，人才回流而非人才流失将成为区域常态。\n\n　　这一愿景必须结合一个不容回避的现实来考量：一些青年面临失业，也难以获得人工智能驱动型劳动力市场所要求的专业技能。这一矛盾尤为突出：技术发展带来前所未有的机遇，但与此同时，随着自动化进程加快，大量青年也面临进一步掉队的风险。要弥合这一差距，需要建立更深入的跨境数字伙伴关系，将人才创新与共同增长作为重点。\n\n　　文章强调，中国—东盟数字学院等倡议，正是当前所需要的联合能力建设模式。依托东盟与中国的全面战略伙伴关系，此类项目可以扩大规模并实现可持续发展，确保下一代青年成为这一转型的主要参与者和建设者，而不是旁观者。\n\n　　必须妥善应对未来挑战。不同司法管辖区在数字化发展水平、法律传统和治理重点方面各不相同，要实现跨境监管协调绝非易事。但不采取行动所付出的代价将更为高昂。在《东盟2045：我们的共同未来》框架下，数字化转型不仅被视为经济发展的加速器，也被定位为增强区域凝聚力与团结的基石。\n\n　　文章结尾表示，如果能够通过妥善协商和建设推进数字经济发展，它就将成为一座桥梁，连接不同经济体、不同世代，以及因地理距离和发展条件不平等而彼此隔离的社区。建设好这座桥梁，需要有序推进政策协调，持续加大制度投入，并坚定不移地确保任何社区都不掉队，不被排除在数字化发展进程之外。 【编辑:刘阳禾】",

          "body": "杨啸林 李一凡\n\n　　风鹏正举，亚太潮涌。11月18日至19日，亚太经济合作组织(APEC)第三十三次领导人非正式会议在深圳举行。作为APEC领导人会议周的重要组成部分，2026年APEC工商领导人峰会11月17日至18日在深圳前海国际会议中心举行。\n\n　　面对地缘政治扰动、供应链重构与保护主义抬头，亚太地区需要一次有分量的会议，重申开放合作的共识。作为多边主义的捍卫者和世界经济增长的重要引擎，中国时隔12年再次担任APEC东道主，向亚太释放出坚持开放合作的清晰信号。中国将与亚太各成员一道走在全球开放发展前列，共谋区域合作大计，共绘亚太发展蓝图。\n\n　　坚守初心\r\n\n　　开放是APEC经济体的生命线，也是APEC一以贯之的合作底色。APEC成立于1989年，彼时经济全球化浪潮初起。APEC秉持“开放的区域主义”理念：让环太平洋经济体坐在一起，把贸易壁垒降下来，把增长空间打开来。\n\n　　30多年来，亚太各经济体持续拆除贸易壁垒、畅通投资渠道，不断扩大开放的广度与深度，以近全球40%的人口，创造了超六成的全球经济总量和近五成的全球贸易总额。2025年，亚太区域国内生产总值(GDP)规模达61.4万亿美元，货物进出口总额突破26万亿美元，拉动世界经济重心持续向亚太转移。\n\n　　然而，随着世界百年变局加速演进，世界经济增长乏力，世界开放指数不断下滑。对外经济贸易大学金砖国家研究中心主任、国际经济贸易学院副院长蓝庆新表示，亚太地区面临地缘冲突、单边主义和保护主义上升等挑战，亚太合作也面临不进则退的考验。如何维护亚太开放合作的发展格局，成为摆在APEC各经济体面前的共同课题。\n\n　　越是风高浪急，越要同舟共济。亚太各界乃至全球工商界将本次峰会视为抵御单边主义、保护主义等逆流的关键节点。\n\n　　贝宝支付副总经理刘致勇表示，公司重要战略方向是依托全球网络和本地服务能力，助力中国实体经济与亚太及全球市场建立更广泛、更持久的联系。面对全球经济的不确定性，坚持开放合作、深化互联互通，是释放增长潜力、增强发展韧性的重要方向。\n\n　　中国美国商会会长何迈可表示，对广大企业而言，开放、可预期的国际贸易环境至关重要，APEC工商领导人峰会正是加强区域对话、挖掘合作空间的宝贵契机。\n\n　　“当前，亚太地区比任何时候都更需要坚持开放合作。”亚太经合组织秘书处前执行主任、秘鲁前驻华大使胡安·卡洛斯·卡普纳伊表示，相信在东道主中国的推动下，各经济体将进一步深化伙伴关系，携手建设亚太共同体，为促进亚太地区持久繁荣和世界经济稳定增长作出新的贡献。\n\n　　深化议程\n\n　　2026年APEC“中国年”议程中，“开放”被置于三大优先领域之首，为各方讨论开放议题、凝聚开放共识提供了充分空间。\n\n　　今年恰逢APEC领导人提出亚太自由贸易区愿景20周年。2026年亚太经合组织工商咨询理事会(ABAC)全年达成14份成果文件，其中，《关于支持亚太自贸区的声明》受到各方高度关注。本次APEC工商领导人峰会也将“亚太自贸区建设”列为七大议题之一。\n\n　　商务部国际贸易经济合作研究院研究员彭波表示，亚太地区在市场开放、服务投资、数字贸易、贸易便利化等领域积累了丰富的实践成果，本次峰会的重点是把这些分散成果汇聚起来，推动FTAAP(亚太自由贸易区)从长期愿景转向更加清晰、务实的实现路径，为日益碎片化的亚太经贸格局凝聚新的最大公约数。\n\n　　加强区域互联互通也是各方关注的焦点议题。联合国亚洲及太平洋经济社会委员会贸易、投资和创新司司长鲁帕·钱达表示，随着升级版APEC互联互通蓝图制定进程的推进，亚太地区有望在基础设施、物流、数字连接和规则制度衔接等领域实现更高水平互联互通。\n\n　　“APEC已在无纸贸易、电子单证跨境互认、跨境数据流动等领域形成阶段性共识，正式启动APEC无纸贸易卓越中心。”中央财经大学国际经济与贸易学院副教授刘春生表示，期待本次峰会在此基础上推动相关规则探索从试点走向深化，在数字贸易规则衔接上取得更多务实进展。\n\n　　作为开放合作的直接受益者，工商界对开放议题也有着积极期待。天丝集团首席执行官许馨雄表示，作为深耕亚太市场的跨国企业，天丝集团依托《区域全面经济伙伴关系协定》(RCEP)等区域经贸安排，对接APEC互联互通合作方向，持续打通中国与东盟的双向产业协同链路；期待本次峰会能够形成优化跨境通关、物流联通等贸易便利化举措，支持跨国企业高效调配区域供应链资源，持续深耕亚太市场。\n\n　　注入活力\n\n　　2026年APEC落子深圳并非偶然。从小渔村蝶变为现代化国际大都市，这座奇迹之城本身就是开放兴邦的缩影。\n\n　　深圳盐田港，桥吊林立，巨轮穿梭，平均每两秒就能操作一个集装箱。每周超过100条全球航线从这里出发，其中53条直通APEC成员经济体。\n\n　　今年以来，深圳海关围绕跨境通关便利化开展了一系列务实合作。深圳海关所属前海海关综合业务科副科长刘攀介绍，深圳海关与智利瓦尔帕莱索海关签署了首个关际合作备忘录，围绕信息互通、监管互认、执法互助、贸易便利化等方向开展协作。为保障中秘自贸协定升级平稳落地，还精准筛选关区对秘鲁重点出口企业，开展“一对一”政策宣讲辅导。\n\n　　这些举措折射出中国高水平对外开放的持续深化，也为亚太合作提供了稳定支撑。“APEC能够历经风浪而始终保持生机，离不开核心大国的战略定力与主动担当。”彭波表示，在单边主义和保护主义抬头的背景下，中国持续缩减外资准入负面清单，自主开放和单边开放有序扩大，高质量共建“一带一路”，正是这种稳定的开放预期和务实行动，为APEC机制注入了源源不断的内生动力。\n\n　　中国丰富的开放实践，为APEC“中国年”提供了扎实的议程基础。今年以来，中国已举办300多场会议活动，开放议题贯穿始终。5月，在苏州举行的APEC贸易部长会议上，各方同意共同构建开放、可预期的服务贸易投资制度环境。7月，在成都举行的APEC数字和人工智能部长会议，首次将“开源”提升至部长级合作层面，明确释放出以开放合作推进数字与人工智能规则协调的信号。本次峰会上，APEC各经济体领导人和代表将相聚深圳，盘点全年各层级会议积累的合作成果，并就亚太开放的新议题展开讨论，推动形成新的共识。\n\n　　今年恰逢中国“十五五”开局之年，进一步全面深化改革、推进中国式现代化的系统部署稳步展开，将为亚太乃至世界发展创造更多机遇。蓝庆新表示，依托APEC政策交流与合作机制，中国高水平对外开放与亚太区域经济一体化进程将进一步衔接，促进区域内经济体共享中国超大规模市场机遇，围绕服务贸易、数字经济和产业链供应链协同等领域加强务实合作。\n\n　　从深圳再出发，中国期待同各方一道，坚持“拉手”而非“松手”，坚持“拆墙”而非“筑墙”，相信亚太开放型经济的大海一定能容纳百川、奔涌不息，开创亚太地区更加美好的未来。 【编辑:刘阳禾】",

          "body": "中新社北京11月18日电 中国最高人民法院通报，11月18日，浙江省杭州市中级人民法院一审公开宣判中国银行股份有限公司原党委委员、副行长林景臻受贿案。\n\n　　法院对林景臻以受贿罪判处有期徒刑十三年，并处罚金人民币三百万元；对林景臻犯罪所得财物及孳息依法予以追缴，上缴国库。\n\n　　公开资料显示，林景臻1987年进入中国银行工作。去年9月，官方通报其被查。今年2月，中央纪委国家监委通报其被开除党籍。\n\n　　党纪政务处分通报中，林景臻被指毫无纪法底线，将信贷权力异化为谋取个人私利的工具，大搞权钱交易，利用职务便利为他人在贷款融资等方面谋利，并非法收受巨额财物。他还被指“私藏、阅看、寄递有严重政治问题的书籍”“违规拥有非上市公司股份”等。\r\n\n　　经审理查明，2015年至2025年，林景臻利用担任中国银行(香港)有限公司副总裁、中国银行股份有限公司党委委员、副行长职务上的便利，为有关单位和个人在贷款融资、职工录用等事项上提供帮助，非法收受上述单位和个人给予的财物共计价值人民币4335万余元。\n\n　　法院认为，林景臻的行为构成受贿罪，且受贿数额特别巨大，应依法惩处。鉴于林景臻到案后如实供述罪行，主动交代办案机关尚未掌握的部分受贿事实，认罪悔罪，积极退赃，涉案赃款赃物及孳息已全部追缴，具有法定、酌定从宽处罚情节，可对其依法从轻处罚。法庭遂作出上述判决。\n\n　　杭州市中级人民法院于今年8月7日公开开庭审理了该案。林景臻当庭表示认罪悔罪。(完) 【编辑:田博群】",
