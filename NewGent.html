          "body": "中新网曼谷11月19日电 (王茜 梁峻祥 李映民)由曼谷中国文化中心、中外文化和旅游交流中心、连云港市东海县政府共同主办的“晶通丝路”东海水晶文化体验活动18日在曼谷中国文化中心开幕。中泰文化界、教育界、工商界嘉宾及主流媒体约150人出席。\n\n开幕式现场。王茜 摄\n\n　　泰国文化部文化促进司副司长苏拉潘·查伦萨普、曼谷中国文化中心兼中国驻曼谷旅游办事处主任张若愚、连云港市东海县副县长任彦洁以及泰国文化中心主任纳塔帕·吉拉蓬邦迪特等嘉宾共同为活动启幕。\n\n　　张若愚主任在致辞中表示，东海水晶雕刻技艺走进曼谷中国文化中心，让泰国朋友近距离感受中华文化的温度，也让中泰朋友在面对面交流中增进了解、加深情谊。苏拉潘副司长表示，东海水晶所展现的东方工艺智慧，与泰国本地的珠宝玉石传统完全可以相互借鉴、彼此成就。任彦洁副县长表示，恰逢东海获授“世界水晶之都”十周年，希望依托曼谷的区位优势与产业优势，推开一扇双向交流的窗口，让泰国朋友近距离感受水晶工艺和人文情怀，读懂藏在晶石里的东方故事。\n\n水晶精品鉴赏。梁峻祥 摄\n\n　　活动为期两天，将水晶精品鉴赏、茶艺展演、水晶雕刻展演与体验、文创互动四大环节串联成可观、可品、可触、可玩的精彩互动。观众在传承人带领下鉴赏水晶原石与雕刻佳作，品味“云茶入晶器”的交融之美，现场观摩立体圆雕、浮雕、镂空雕等东海特色技法并亲手打磨原石，还参与水晶手串DIY，体验水晶与潮玩跨界文创、水晶穿戴甲等时尚新品，感受水晶文化年轻化、生活化、潮流化的多元魅力。\n\n体验活动现场。李映民 摄\n\n　　“晶通丝路”东海水晶文化体验活动以一方晶石、一门手艺、一次体验，为中泰文化交流与水晶产业合作搭建桥梁，为“中泰一家亲”和“一带一路”民心相通增添温润而持久的力量。(完)\n\n 【编辑:惠小东】",

          "body": "中新社北京11月19日电 综合消息：以色列军方18日在加沙地带中部“黄线”以西发动军事行动。巴勒斯坦伊斯兰抵抗运动(哈马斯)同日发表声明，谴责以色列违反停火协议。\n\n　　据《以色列时报》报道，以军18日在加沙地带中部“黄线”以西展开军事行动，导致当地巴勒斯坦平民被迫流离失所。\n\n　　以军表示，此次行动旨在摧毁当地一条隧道，并称该隧道对以军部队构成直接威胁。\n\n　　半岛电视台报道说，这是自2025年10月10日停火协议生效以来，以军首次公开宣布在加沙地带发动大规模地面军事行动。根据停火协议，以军应将部队撤至“黄线”以东，这条分界线大致将加沙地带划分为东西两部分。\r\n\n　　此外，以军方18日宣布，两名哈马斯指挥官在前一天加沙地带的两次袭击中丧生。以军方称，这两名武装人员不断袭击以军和以平民，并试图恢复哈马斯的作战能力，其行为“系统性地违反了停火协议”。\n\n　　哈马斯18日发表声明称，以军发动突袭并迫使巴勒斯坦人流离失所，严重违反停火协议，导致局势危险升级。\n\n　　哈马斯指责以色列试图通过军事行动将巴勒斯坦居民进一步挤压至加沙地带一处狭窄区域，并称以色列看守政府意在通过升级军事袭击，转移公众对其国内危机的注意力。\n\n　　哈马斯警告说，如果以方继续采取此类行动，加沙地带200多万巴勒斯坦人面临的人道主义灾难将进一步加剧。(完) 【编辑:甘甜】",

          "body": "日本交通儲值用的「西瓜卡」，陪伴乘客25年的吉祥物企鵝，將於明年3月「退休」。發行商公布新的吉祥物造型，設計師期望可帶來安心及感動的理念。另有網民製作AI惡搞片段，成為網上熱話。\n\n在日本部分地區用餐、購物、乘搭巴士及鐵路，部分民眾會用JR東日本發行，俗稱「西瓜卡」的綠色交通IC卡Suica繳費，形式類似「八達通」。包含手機數碼版及實體卡在內，「西瓜卡」在日本發行量，已突破1億2,000萬張。\n\n說到「西瓜卡」，相信大家記得這隻企鵝，它由插畫家坂崎千春設計，1998年在個人繪本登場，2001年開始成為「西瓜卡」吉祥物，幾乎成為日本鐵道文化的經典象徵。\n\n由於「西瓜卡」品牌轉型，JR東日本決定更改吉祥物，身形圓滾滾、表情可愛的企鵝，將於明年3月底光榮退休。JR東日本早前公開3款新角色設計，供民眾在網上投票，到周三選出新的吉祥物，總票數逾166萬，這隻由插畫家世戶宏明設計的紫色兔子拿下86萬票，成為「西瓜卡」第二代吉祥物。\n\n世戶宏明表示，選擇兔子作為設計原型，是希望塑造一個角色，代表聆聽聲音、朝向未來躍進。他又稱象徵「安心」的藍色，與代表「感動」的紅色，混合起來就變成紫色，希望藉此傳達新角色的理念。\n\n評選委員會主席就稱，紫色兔子帶來新鮮感，具備極強的視覺衝擊力，令人印象深刻，相信會受到大眾喜愛。JR東日本正舉行命名活動，明年3月底公布紫色兔子的名字。\n\n不過日本部分網民似乎不太喜歡這個新角色，不僅用AI人工智能生成「惡搞」片段，甚至稱它做「毒兔子」。有超高人氣的企鵝，陪伴日本人四分之一個世紀，紫色兔子將來能否受到大眾愛戴，有待時間證明。",

          "body": "中新社华盛顿11月18日电 (记者 沙晗汀)美国国土安全部长马林当地时间18日出席国会众议院国土安全委员会听证会，就全美航班停飞等事件回答议员提问。\n\n　　本月13日，美国联邦航空管理局发布指令称，因通信问题暂停全美范围航班起飞。该停飞令持续时间超过4小时，导致大批航班延误或取消。\n\n　　对此，马林表示，“在因通信问题而实施地面停飞期间，我们引导了4000多架飞机降落，且未发生任何事故，这本身就是巨大成功”。\n\n　　在当天的听证会上，多位议员表示，在仍有众多乘客滞留机场的情况下，马林不应该于14日飞往路易斯安那州去看美式橄榄球比赛。\r\n\n　　马林回应称，该旅行计划几周前就已经定下，并且14日航班已经可以起飞，在这个时候取消该行程可能“造成误解”。\n\n　　当天与马林一同出席听证会的还有美国国家情报总监克莱顿(Jay Clayton)和联邦调查局副局长拉亚(Christopher Raia)。\n\n　　对于近来出现的多次“技术故障”事件，包括微软多项服务宕机、全美航班停飞等，克莱顿表示，根据目前掌握情况来看，这些事件属于各自独立的服务中断，与维护工作及技术变更有关。“这些事件并非协同进行的攻击，也并非由某个国家支持的攻击。”(完) 【编辑:曲克】",

          "body": "中新社约翰内斯堡11月18日电 (记者 孙翔)南非统计局18日公布的数据显示，南非10月消费者价格指数(CPI)同比上涨5.2%，高于9月的4.5%，创2024年5月以来最高水平，符合市场预期。\n\n　　数据显示，10月，南非交通运输类价格同比上涨15.2%，拉动整体通胀率上升2.1个百分点；住房及公用事业类价格同比上涨5.2%，拉动1.3个百分点；保险及金融服务类价格同比上涨5.3%，拉动0.6个百分点。\n\n　　南非统计局价格统计首席主任帕特里克·凯利表示，燃油价格上涨是交通运输类通胀攀升的主要原因。10月，南非燃油价格环比上涨11.8%，同比涨幅达42.9%，较9月扩大15个百分点，创2022年8月以来最高水平。\n\n　　受伊朗战事引发的全球石油供应紧张影响，南非燃油价格自今年4月以来持续攀升。10月，南非汽油价格首次突破每升30兰特(约1.83美元)，较2月底冲突爆发时上涨近50%；同期柴油批发价格上涨近70%。\r\n\n　　南非储备银行(央行)将于19日公布今年最后一次利率决定。南非央行行长卡尼亚戈此前表示，全球多重供应冲击持续推高物价，通胀率回归3%目标水平所需时间可能长于此前预期。\n\n　　今年以来，南非央行分别在5月和9月加息25个基点，7月维持利率不变，目前政策利率为7.25%。\n\n　　通胀压力加剧之际，南非兰特汇率持续承压。18日晚间，兰特兑美元汇率突破17关口，一度跌至17.28兰特兑换1美元，创近一年以来新低。(完) 【编辑:惠小东】",

          "body": "共同社引述日本氣象廳報道，當地時間周四（19日）凌晨2時22分左右，日本熊本縣發生黎克特制5.7級地震，最大震度達到日本標準的「5弱」。此次地震不會引發海嘯。\n震源深度約10公里 位於天草及蘆北地區\n日本氣象廳公布資料顯示，今次地震震源位於熊本縣天草、蘆北地區，震源深度約為10公里，屬極淺層地震。當局正密切監察當地有否出現建築物損毀或人員傷亡報告。\n日本氣象廳認為這次地震與今年7月的熊本地震屬於同一活動，並呼籲民眾在未來一周左右保持警惕。日本放送協會\n日本放送協會報道，氣象廳認為這次地震與今年7月的熊本地震屬於同一活動，並呼籲民眾在未來一周左右保持警惕，注意震度為5度以下的地震，同時也要意識到不排除發生更強烈地震的可能性。",

          "body": "四方安全對話（Quad）領袖峰會於17日在菲律賓馬尼拉登場，由美、日、印、澳四國領導人出席。然而，合照環節卻發生一段意外插曲，美國總統特普將合照時間變成即興記者會，且無視印度總理莫迪的提醒，在場暢談網路服務中斷及黃仁勳事件相關議題，引發全球網友熱議。\n合照變即興記者會 莫迪提醒無果面無表情\n綜合外媒報道，此次峰會由特朗普、印度總理莫迪、澳洲總理阿爾巴尼斯及日本首相高市早苗出席。在合照期間，特朗普主動回應記者提問，對近期發生的網絡服務中斷及輝達相關議題侃侃而談，其餘三國領袖只能在一旁乾等。眼見媒體不斷發問，莫迪一度出聲打斷並詢問：我們該移步了嗎？但特朗普卻若無其事繼續發言。\n見特朗普對自己的提建充耳不聞，莫廸只好別過頭去，頗為不是味兒，旁邊的日本首相高市早苗似乎亦感覺得到情況有異，場面相當尷尬。\n特朗普在回答到一半時，更轉頭向莫迪笑稱「你看看我被問的問題，真的很棘手」。隨後他逐一點評三國領袖，指莫迪是「非常強悍的人」，但莫迪全程面無表情；特朗普隨即轉向高市早苗稱「她可能更強悍」，對阿爾巴尼斯則笑稱「我們還不錯」。\n美印關係持續緊繃 互動與過往熱絡形成對比\n影片曝光後迅速在社群媒體擴散，外界注意到特朗普與莫迪此次互動冷淡，與過往的熱絡氛圍大相逕庭。自去年以來，美印關係因貿易摩擦及美國重啟對巴基斯坦的外交接觸而持續緊繃，特朗普更一度針對印度購買俄羅斯石油祭出懲罰性關稅。\n四方安全對話（Quadrilateral Security Dialogue）是由美國、日本、印度及澳洲組成的非正式戰略安全合作機制，被外界廣泛視為制衡中國在該區影響力擴張的戰略聯盟。",

          "url": "https://news.tvb.com/tc/1207099-中俄美元首今將歷史性會晤俄媒體引評論料中方堅持不捲入衝突國際分析",
          "summary": "國家主席習近平今日將於深圳，與俄羅斯總統普京及美國總統特朗普舉行中俄美元首會晤，這將是三國元首歷史上首次面對面會談。內地時事評論員司馬平邦接受俄羅斯衛星通訊社訪問時表示，本屆亞太經合組織（APEC）峰會的參會規模與覆蓋面均創下新紀錄，其中美國工商界參與度更居外方經濟體之首。",

          "body": "國家主席習近平今日將於深圳，與俄羅斯總統普京及美國總統特朗普舉行中俄美元首會晤，這將是三國元首歷史上首次面對面會談。\n\n內地時事評論員司馬平邦接受俄羅斯衛星通訊社訪問時表示，本屆亞太經合組織（APEC）峰會的參會規模與覆蓋面均創下新紀錄，其中美國工商界參與度更居外方經濟體之首。在貿易保護主義橫行之際，中國已為亞太地區準備了大開放與大合作的經貿藍圖，形容這屆峰會本質上是全球化市場經濟與自由貿易的「回家之旅」。\n\nAPEC規模創紀錄　美工商界參與度居各經濟體之首\n\n司馬平邦指出，APEC作為亞太地區最高層級經濟合作機制，現有21個經濟體成員，憑藉自願協商、不設強制條約的原則，成為二戰後全球最成功的經貿合作組織，歷屆峰會均獲各國政府、國際組織及跨國企業大力支持。\n\n今屆深圳峰會規模再創新高，工商峰會實現21個APEC經濟體全覆蓋，匯聚逾二千名政商界嘉賓及115家世界500強企業，更吸引英國、法國、德國及瑞士等13個非APEC經濟體的知名企業參與，域外參與廣度為近年罕見。當中美國工商界參與度尤為突出，佔比接近兩成，居所有外方經濟體首位，中美兩大經濟體將在深圳展開更全面交流。\n\n中國成區域最大貿易夥伴　粵深前沿窗口引領合作\n\n他認為，中國製造業產值佔全球三成以上，新質生產力亦不斷推動工業升級，長期擔當全球經濟增長核心引擎。作為東道主的廣東省與深圳市是中國最發達地區之一，今年經濟發展勢頭依然領先全國，更是對接亞太產業鏈、貿易與數字創新的前沿窗口，令各成員國對峰會交流寄予厚望。司馬平邦引述數據指，APEC其餘20個經濟體中，多達13個的最大貿易夥伴均為中國，包括澳洲、汶萊、智利、印尼、韓國、馬來西亞、新西蘭、巴布亞新畿內亞、秘魯、菲律賓、泰國、越南及中國香港；而在中國全球前20大貿易夥伴中，APEC成員亦佔過半數。他強調應穿透國際媒體的雜音，認清今屆峰會推動自由貿易回歸正軌的本質。\n\n駁斥「新雅爾塔會議」論調　料中方拒被道德綁架或霸權施壓\n\n至於萬眾矚目的中俄美元首會晤，司馬平邦表示APEC已逐步成為各國進行廣泛政治與外交協商的舞台，包括烏克蘭、歐洲、伊朗、中東及拉丁美洲等全球大部分國家均對此抱有期待，希望地區戰亂收縮並重回和平發展軌道，這亦與中國的意願一致。\n\n不過他強調，化解世界各地戰亂必須由當事國主導，烏克蘭不應企圖以自說自話的道義綁架中國或其他無關國家，美國亦不應指望透過慣常的霸權手段迫使中國讓步。他判斷，中國致力成為動盪世界中最重要的確定性力量，即使在這場三方峰會上，中方仍會堅守不捲入任何地區衝突的底線，因此他並不認同國際媒體將今次會晤形容為「新雅爾塔會議」的說法。",

          "body": "中新网11月19日电 马来西亚总理安瓦尔18日在社交媒体上表示，同中国知名企业开展的交流为马来西亚创造了新机遇，为该国经济发展注入动力。\n\n图片来源：安瓦尔在社交媒体上发布的图片截图\n\n　　11月18日，安瓦尔乘机抵达深圳宝安国际机场。深圳APEC会议期间，由马方主办的马来西亚-中国高层贸易与投资对话会举行。\n\n　　安瓦尔在帖文中发布多张图片并配文称，马来西亚-中国高层贸易与投资对话会上，汇集了23家中国知名企业的代表。双方的交流为拓展战略合作、扩大投资规模，以及提升马来西亚在全球供应链中的参与度带来新机遇。\n\n　　他还表示，会议涉及新能源、数字技术、医疗科技以及先进制造等多个领域。与中国企业的合作，有望为马来西亚创造更多出口机会、拓展市场空间，以及提升本地企业在国际供应链中的参与度，有助于推动马来西亚实现更具包容性和竞争力的经济增长。\n\n 【编辑:付子豪】",

          "body": "新华社耶路撒冷11月18日电(记者王卓伦 庞昕熠)以色列国防军和国家安全总局(辛贝特)18日发表联合声明说，以安全部队当天在加沙地带“黄线”以西开展针对性军事行动，拆除一条据称对以军构成直接且紧迫威胁的地道。\r\n\n　　声明说，行动开始前，以方已向当地平民发出警告，要求他们远离相关区域，并通知关闭附近道路。\n\n　　声明称，以军南方司令部所属部队目前按照停火协议部署在相关地区，将继续采取行动消除直接威胁，并阻止巴勒斯坦伊斯兰抵抗运动(哈马斯)袭击以色列平民或士兵，以及违反停火协议。\n\n　　“黄线”是以军根据加沙停火第一阶段协议所划设。“黄线”以东为以军控制区，约占加沙地带面积的53%；“黄线”以西由哈马斯控制，以军不再驻扎或开展行动。\n\n　　哈马斯18日发表声明，谴责以色列军队当天在加沙地带中部展开军事行动，称此举严重违反加沙停火协议。声明说，以色列军车越过“黄线”向西推进，并强迫努赛赖特难民营东北区域的巴勒斯坦人离开住所。哈马斯称，以军行动旨在将巴勒斯坦人挤压至加沙地带狭小区域。 【编辑:付子豪】",

          "body": "中新社伦敦11月18日电 (记者 欧阳开宇)英国官方18日公布的数据显示，英国10月消费者价格指数(CPI)同比上涨3.6%，较9月3.5%的涨幅小幅抬升，创下一年以来通胀率最高水平。\n\n　　从核心物价表现来看，剔除能源、食品、烟酒等波动品类的核心通胀率维持在2.8%，反映实体经济价格走势的服务业通胀率稳定在3.7%，两大关键指标均保持平稳，未出现上行态势。\n\n　　英国国家统计局分析，燃油价格走高以及本年度烟草税提前上调，是拉动10月整体通胀走高的主要推手。与此同时，英国零售商超竞争激烈，压制民生物价涨幅。数据显示，英国食品及非酒精饮品价格同比仅上涨0.9%，创下2021年9月以来的最小涨幅，对整体通胀形成明显对冲效果。\n\n　　近五年来，英国通胀长期高于官方2%的政策目标，持续加重民众生活成本压力。英国高度依赖进口天然气能源，且国内能源价格调控机制存在滞后性，导致其物价涨跌周期普遍滞后于其他主要经济体。\r\n\n　　业内人士指出，目前英国尚未出现薪资、物价联动攀升的通胀二次传导效应，整体物价压力仍处于可控区间，能源价格波动仍是影响后续通胀走势的核心变量。(完) 【编辑:付子豪】",

          "body": "中新网布里斯班11月18日电 (记者 薄雯雯)中昆“旅游+”对话会17日在澳大利亚昆士兰州首府布里斯班举行。与会嘉宾围绕中国与昆士兰州在旅游、教育、体育等领域的合作展开交流。\n\n当地时间11月17日，中国驻布里斯班总领馆举办中昆“旅游+”对话会。图为活动现场。　薄雯雯 摄\n\n　　中国驻布里斯班总领事孙朝阳在致辞中表示，中国已成为昆州第一大国际旅游消费客源国，“到中国去”也正逐渐成为一种“流行”。篮球、赛艇等体育交流活动为中澳青年搭建起相知相交的桥梁。他希望以此次对话会为契机，与各界共同助力中澳旅游、教育、体育合作不断发展，积极推动双边扩大人员往来，增进两国人民友谊。\n\n　　澳大利亚昆士兰州财政、贸易、就业和培训部长贝茨在视频致辞中表示，昆士兰州珍视与中国的长期合作关系，并致力于推动这一关系持续发展。她谈及近期率领昆士兰州贸易代表团赴上海参加中国国际进口博览会的经历，认为旅游是拉近昆士兰州与中国距离的重要纽带，期待此次对话会为深化合作、促进双向游客往来带来新机遇。\n\n当地时间11月17日，中国驻布里斯班总领馆举办中昆“旅游+”对话会。图为活动现场。　薄雯雯 摄\n\n　　澳大利亚贸易投资委员会旅游与访客经济经理娜塔莉娅表示，澳中双向旅游需求旺盛，游客往来创造了显著的经济和社会价值。同时，旅游有助于增进相互理解，促进贸易、投资和国际教育交流。她指出，中国是昆士兰州重要的国际客源市场，澳中两国有着长期的旅游合作基础。\n\n　　昆士兰乡村旅游机构(Queensland Country Tourism)前首席执行官彼得·霍曼表示，旅游让澳中两国民众有机会亲身体验彼此的生活和文化，从而增进相互理解。他认为，悠久的文化、丰富的美食、热情好客的民众和良好的公共安全环境，是中国吸引澳大利亚游客的重要因素。\n\n　　与会嘉宾认为，旅游能够带动教育、体育、文化和经贸等领域的交流。双方可加强旅游产品开发与航线合作，依托青年体育赛事、研学活动等创造更多双向往来机会，让民众在亲身体验中增进了解，推动中国与昆士兰州的合作持续发展。(完)\n\n 【编辑:惠小东】",

          "body": "中新社北京11月18日电 阿布扎比消息：当地时间18日，阿联酋阿布扎比国家石油公司旗下的物流与服务公司表示，该公司一艘船只17日晚途经霍尔木兹海峡时遭到袭击，造成11人受伤、1人失踪。\n\n　　综合阿联酋《国家报》《海湾新闻报》等媒体报道，该公司目前正与相关部门协调，搜寻失踪船员。其余11名受伤船员已安全撤离，正在接受医疗救治。\n\n　　阿布扎比国家石油公司是阿联酋国有石油和天然气企业，旗下的物流与服务公司负责航运物流业务，其运营的船队规模为500至800艘。\n\n　　11月10日，该公司证实，其一艘船只在阿联酋领海内遇袭受损，但未透露船只受损情况及是否有人员伤亡；7月14日，该公司表示，两艘油轮在通过霍尔木兹海峡时被发射物击中，造成1人死亡，另有多人受伤。(完)\r\n\n 【编辑:管娜】",

          "body": "中新网土耳其安塔利亚11月18日电 (记者 王高飞 　陈溯)《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。COP31观察员、全球环境中心(Global Environment Centre，GEC)专家Yannick Matz当地时间17日接受中新社记者专访时表示，中国在绿色金融领域相当活跃，不仅推动绿色金融纳入全球议程，且相关开创性实践“可圈可点”。\n\nCOP31期间，COP31观察员、全球环境中心(Global　Environment　Centre，GEC)专家Yannick　Matz接受中新社记者专访。记者 陈溯 摄\n\n　　谈及全球气候治理最大挑战，Matz表示，气候变化影响在各地并不均衡，每个地区都需找到自己的应对路径；当前最关键的是将国际协议和国家承诺转化为可实施方案，并打通融资渠道。他认为技术进步扮演着关键角色，电动汽车、航空生物燃料等技术正在提供新方案，适应领域行之有效的做法也需通过知识转移推广。\n\n　　谈到人工智能，他指出AI必然会贡献于气候行动，但数据中心本身消耗大量能源，如何在“用AI解决问题”与AI自身能耗之间取得平衡仍需探索。\n\n　　Matz曾多次到访中国参与绿色金融合作。他说，中国在绿色金融领域相当活跃，正是中国在G20推动将绿色金融纳入研究小组，后来演变为G20可持续金融工作组，把企业环境、气候与可持续性指标纳入金融决策，“这很大程度上是由中国推动的”。\n\n　　他特别提到，GEC曾与中国工商银行合作，参与开发首个银行环境压力测试，专门评估水资源短缺对企业贷款组合和银行自身的影响，“这是一项开创性的工作，发生在中国”。在他看来，中国改善环境、推进低碳发展的努力“可圈可点”，中欧在气候变化等全球挑战面前应继续深化合作。\n\n　　Matz表示，当前仍需“全球挑战、全球解决”，从政策识别到方案落地与资金匹配，需要各国携手推进。(完)\n\n 【编辑:张子怡】",

          "body": "中新社东京11月18日电 (记者 朱晨曦)日本财务省18日公布的贸易统计结果显示，受原油等商品进口成本上涨影响，日本10月贸易逆差达4765亿日元(1美元约合157.84日元)，为连续第6个月出现贸易逆差。\n\n　　数据显示，10月日本出口额、进口额均创单月历史新高。其中，受汽车、半导体及半导体制造设备等出口增长带动，出口额同比增长20.5%，达到约11.77万亿日元。受原油、半导体、计算机类产品等进口增长影响，进口额同比增长21.6%，达到约12.25万亿日元。\n\n　　10月日本原油进口额同比增长60.5%，而原油进口量同比减少0.7%。据日本共同社报道，由于中东局势持续紧张，10月日本来自中东的原油进口量同比减少16.5%，来自美国的原油进口量增至去年同期约8.4倍。受日元贬值美元升值趋势的影响，原油进口额增长。(完)\n\n 【编辑:管娜】",

          "body": "都市人嚮往小城鄉郊的恬靜與慢活，而小地方居民亦對大城市的石屎森林與繁華節奏心生憧憬，正如名著《圍城》所言：「城裡的人想出去，城外的人想進去。」近日，甘肅省隴南市轄下的兩當縣，便因地廣人稀及悠閒的生活步調，在內地網絡意外走紅。\n四季皆宜旅遊 美食琳琅滿目\n一名內地旅遊博主日前（11月16日）在社交平台發布短片，直言「在這裡我感受到了很多美好」，向網民推介甘肅省隴南市兩當縣。該博主此前到當地遊覽時，發現這座縣城的城區常住人口不足一萬，全縣更僅有5輛的士營運。居民稱，在街道上見不到垃圾，更指兩當縣連老鼠都沒有，亦可能是全國唯一的「無鼠」縣城。\n短片隨即引起網民熱議，截至發稿前，相關帖文的點讚數已突破3.5萬次，幾乎與全縣約3.75萬名常住人口（其中城鎮人口約1.97萬人）相若。\n帖文點讚與全縣人口相若\n據兩當縣政府官網資料顯示，兩當縣位於甘肅省東南部、隴南市東北部，地處陝甘川三省交界的秦嶺山區。在博主發布的短片中，一名女的士司機一邊駕車，一邊向博主介紹風土人情，鏡頭下盡顯這座山區小縣城淳樸、悠閒的日常生活節奏。\n針對「全縣僅有5輛的士」的說法，兩當縣交通運輸局工作人員向內媒證實，目前縣城只有一間的士公司，全縣確僅有5輛的士在營運。\n至於旅遊資源方面，當地文廣旅局人員介紹指，兩當四季皆宜旅遊，尤以秋季漫山紅楓最為迷人；遊客亦可到訪兩當兵變紀念館、雲屏三峽自然風景區及張果老養生文化旅遊景區等景點，並品嚐洋芋攪團、麵皮、柴火雞及雲屏蜜酥等地道美食。\n這股「小城慢活」熱潮亦引來不少網民留言。有當地網民熱情推介指，每年4月中旬天氣回暖時兩當最美，亦有人讚賞國慶期間人少景美；另有網民感嘆，不少人總會羨慕自己未曾擁有的生活，亦有人驚訝地表示：「這是甘肅嗎？這麼乾淨，本以為西北風沙大、黃土漫天，沒想到這裡的山這麼綠。」",

          "body": "热播剧《小城良方》带火了锦州。小新探访千年辽代大广济寺塔，回溯锦州从先秦、辽代到闯关东的历史变迁，中原文化与北方少数民族在此交融，造就独有的城市气质。小新走进取景地石桥子早市，回族油炸糕、满族打糕、蒙古族奶皮子各色美食齐聚。软糯江米凉糕、鲜香蒸丸子、甜而不腻的炸大枣，烟火小吃正是民族交融最生动的体现。\n\n逛完古塔、游过早市，小新切身感受剧集之外真实鲜活的锦州风土人情。(禹瑞斋 王翕瞳 辽宁锦州报道)",

          "body": "中新网云南大理11月18日电 (记者 韩帅南)记者18日从大理州委宣传部获悉，近日，在云南省大理白族自治州成立70周年之际，一封跨越重洋的贺信从南半球传来。澳大利亚米尔迪拉市市长海伦·希利议员致信，向大理州送上祝贺。\n\n澳大利亚米尔迪拉市市长海伦·希利议员致信大理。大理州新闻办 供图\n\n　　大理州地处南方丝绸之路与茶马古道交汇处，素有“亚洲文化十字路口的古都”之称。自1956年成立以来，大理州持续对外开放，与多个国际城市缔结友好关系，“全球生态文明建设(洱海)论坛”“澜沧江—湄公河合作大理马拉松”等涉外品牌活动持续举办，正加快成为面向南亚东南亚开放的重要节点。\n\n　　“我谨向大理州人民致以祝贺，祝贺大理白族自治州取得七十载辉煌成就。”贺信中，海伦·希利写道。她表示，大理与米尔迪拉市两座城市各具特色、风光秀美，都依托农业与旅游业实现繁荣发展。\n\n　　风光相似、产业相近，两地往来也日益密切。教育交流，就是这份情谊最生动的注脚。在贺信中，海伦·希利写道，在姐妹学校交流项目框架下，米尔迪拉至今已有400余名学生、80名教师到访大理，受到当地热情接待；15年来，大理师生也多次赴米尔迪拉交流学习。“我们必将持续巩固这份教育纽带，让交流合作薪火相传、面向未来。”\n\n　　米尔迪拉位于澳大利亚维多利亚州西北部墨累河沿岸，与大理州于2006年缔结友好城市关系。以教育合作为起点，两地交流逐步向多领域延伸。\n\n　　贺信的最后，海伦·希利送上祝福，“祝愿全州人民度过一个美好的州庆，欢庆活动圆满顺利、喜乐祥和！”\n\n　　从苍山洱海到墨累河畔，山海不远，情谊长青。这封贺信，映照出大理以民间交流厚植开放底色的前行脚步。(完)\n\n 【编辑:付子豪】",

          "points": [

          "body": "中新网哈尔滨11月18日电 (记者 王琳)截至18日，哈尔滨太阳岛雪博会、冰雪大世界两大冰雪旅游景区先后启动新雪季的人工造雪工作，为赶制雪雕景观提前“囤雪”。\n\n11月18日晚，第28届哈尔滨冰雪大世界启动人工造雪工作。图为造雪机全速运转、喷涌雪雾。　江宇阳 摄\n\n　　受自然降雪时序、雪量、雪质不可控影响，景区难以依靠天然雪完成体量巨大的雪雕工程。人工造雪质地密实、可塑性强、不易融化，雪质统一洁白，适配大型雪雕雕刻需求。作为“世界冰雪旅游卓越城市”，哈尔滨人工造雪技术成熟。\n\n　　人工造雪对气温、湿度、风向和水温都有严格要求，-10℃左右是启动作业的关键节点。哈尔滨连日降温、降雪，气象条件已经满足造雪标准。第39届哈尔滨太阳岛雪博会于16日凌晨启动人工造雪工作，首日造雪量约100立方米。\n\n　　11月18日晚，第28届哈尔滨冰雪大世界启动人工造雪工作，30余台造雪机完成调试并全速运转。丝丝雪雾从造雪机喷涌而出，洁白雪花缓缓飘落、堆积成小山，将成为本届冰雪大世界的雪雕原料。\n\n　　人工造雪是雪雕工程建设的首道工序，造雪师傅们要时时关注气象条件，调整设备压力、喷射角度等参数，持续监测雪料状态，确保产出的雪料紧实均匀、密度达标，满足雪雕堆筑、精细修型、长期留存等工艺要求。\n\n　　第一批经过精细把控的雪料验收合格后，将送往该景区东售检票大厅外，用于本届冰雪大世界首个大型主题雪雕“雪人一家”的建设。(完)\n\n 【编辑:田博群】",

          "summary": "中新网祁阳11月18日电(何艳飞 于卫容)时下，湖南祁阳市下马渡镇团栗村慕云山景致怡人。",
          "summary_short": "中新网祁阳11月18日电(何艳飞 于卫容)时下，湖南祁阳市下马渡镇团栗村慕云山景致怡人。",
          "digest": "时下，湖南祁阳市下马渡镇团栗村慕云山景致怡人",

            "中新网祁阳11月18日电(何艳飞 于卫容)时下，湖南祁阳市下马渡镇团栗村慕云山景致怡人",
            "连片花木错落有致，山顶露营基地帐篷错落排布，不少游客前来观景赏日落",
            "曾经无人问津的荒坡山地，如今变身花海秘境、网红休闲营地"
          ],
          "section": "民生",
          "category": "",
          "source": "chinanews_society",
          "source_display": "中新網 社會",
          "published_at": "2026-11-18T21:40:41+08:00",
          "size": 1,
          "keywords": [],
          "body": "中新网祁阳11月18日电(何艳飞 于卫容)时下，湖南祁阳市下马渡镇团栗村慕云山景致怡人。连片花木错落有致，山顶露营基地帐篷错落排布，不少游客前来观景赏日落。\n\n　　曾经无人问津的荒坡山地，如今变身花海秘境、网红休闲营地。依托花木、文旅、康养三大融合产业，团栗村成功盘活闲置山地资源，将荒芜山野变为富民增收的“聚宝盆”。\n\n曾经无人问津的荒坡山地，如今变身花海秘境、网红休闲营地。祁阳市委宣传部供图\n\n　　团栗村是下马渡镇“花卉小镇”核心村落，先后获评永州市乡村振兴示范村和祁阳市先进村、模范村。过去，受地形条件限制，村内坡地土壤贫瘠、不宜耕作，大量山地长期撂荒。加之青壮年劳动力外流，村集体经济基础薄弱，一度制约村级发展。为此，团栗村立足山地资源与乡友人脉优势，因地制宜盘活闲置土地，探索出三产融合的乡村振兴发展路径。\n\n　　据悉，依托全镇“花卉小镇”发展定位，团栗村聚焦花卉苗木主导产业，整合村内零散坡地、撂荒土地，实行统一流转、集中经营，打造规模化苗木基地。村集体投入资金参与共建分红，建成近千亩花卉苗木种植基地，成为祁阳城区近郊颇具规模的四季花海景观。\n\n　　土地流转让闲置资源稳定变现，苗木基地日常管护、苗木装运等岗位，吸纳本地村民就近务工，实现“土地租金+务工薪金”双增收。有村民表示，连片花木产业既筑牢村级集体经济根基，也塑造了优美的乡村生态景观，为文旅业态落地奠定基础。\n\n　　依托慕云山可俯瞰祁阳城区的区位优势，该村还盘活山顶闲置荒坡，引入文旅企业打造慕云山山顶露营基地。通过完善观景平台、休闲草坪、通行道路等基础设施，基地迅速成为城郊热门休闲打卡点，吸引市民登山露营、观赏日出日落。“站在观景台上，全城美景尽收眼底，在家门口就能感受诗与远方。”村民刘成晨说。\n\n　　目前，该村已形成“山顶观景露营、山脚赏花休闲”的游玩环线，上下业态联动引流，持续激活乡村文旅消费活力。\n\n　　据了解，依托祁阳市乡友招商机制与村级商会平台，团栗村还精准以商引商，引进总投资2000余万元的生态康养庄园项目，规划建设智能化鸽类养殖、屠宰冷链、有机肥加工、文旅康养等配套业态，打造三产融合示范基地，目前项目正有序推进建设。\n\n　　该项目构建起村内产业循环体系：鸽粪加工为有机肥，反哺花卉苗木种植；标准化养殖与冷链加工拓宽农产品外销渠道；康养文旅业态与花海、露营基地串联互补，完善乡村产业链条，实现产业互促、资源循环。\n\n　　村党支部书记邓小军介绍，近年来，团栗村持续盘活闲置资源、完善基础设施、争取项目支持，推动村集体经济集约化、规模化发展。下一步，村里将持续深耕特色优势产业，丰富文旅、康养新业态，持续拓宽群众增收渠道。\n\n　　如今的团栗村，村容整洁、产业兴旺、生态宜居。通过盘活荒山薄地、推动多元产业融合发展，村庄实现由荒芜山野向和美乡村的蝶变。(完)\n\n 【编辑:刘欢】",

          "body": "中新网兰州11月18日电 (戴文昌)141起处罚案件、186次应急处置、317件民众信访、500余次普法帮扶，几组数字，记录着甘肃定西市安定区应急管理综合行政执法队副队长安文伟13年一线执法路。在基层辖区，她直面多领域安全风险，贴心纾解民忧，刚柔并济守护一方平安。\n\n　　18日，“新征程上的奋斗者”媒体见面活动——甘肃省应急管理系统代表专场举行。安文伟说，守红线是责任，护安宁是追求，不退却是坚守。事故现场没有如果，只有后果，执法者能做的就是把功夫下在平时，把隐患挡在成灾之前。\n\n　　1985年出生的安文伟，2013年投身安定区安全生产监管，2019年转隶应急管理系统。其辖区危化品、烟花爆竹、工贸、建筑施工等高风险行业集中，安全监管压力大。在她看来，应急执法不是坐在办公室翻看台账，更不是简单开罚单，而是严管与帮扶并举，既要守住不可逾越的安全红线，也要带着温度化解民众急难愁盼。\n\n　　“13年里，317件信访连着一个个家庭的难处，141起处罚案件守着一条不能破的安全红线。”安文伟说，应急人的分量，不在急上，在责上。\n\n　　令她印象深刻的是，2021年春节前一起烟花爆竹爆燃事故。安定区一名民众家中办丧事时烟花倾覆爆炸，伤者眼部重伤，高额医疗费用让一家人陷入困境。接到求助后，安文伟和同事连夜奔赴深山事故现场，依托产品溯源线索联系生产厂家，通宵协商沟通，最终促成厂家赶赴定西，全额承担伤者治疗及后续赔偿。\n\n图为安定区称钩驿镇马铃薯万亩示范片带犹如大地绿毯。(资料图) 易思耿 摄\n\n　　老人康复后上门回访的一幕，也让她更加笃定，执法有力度，帮扶更要有温度。\n\n　　在化解民众难题之外，安文伟把更多精力放在隐患源头治理上。安定区高原夏菜产业蓬勃发展，泡沫网套加工企业广泛分布，不少经营者对发泡原料正丁烷的爆炸风险认识不足，安全设施短板突出。2025年，她带队排查11家同类企业，查出隐患114条，其中重大隐患4条。\n\n　　面对风险隐患，安文伟采取柔性执法推动企业整改。当地一家企业违规堆放成品、未安装可燃气体报警装置。她没有一罚了之，反复上门说理普法，量身制定整改方案。不久，外地同类企业发生爆炸事故，该企业负责人专门致电致谢。经持续跟进，当地泡沫网套行业多年未发生生产安全事故。\n\n　　作为法学专业出身的执法人员，安文伟不满足于“会检查、会整改”。2025年，她代表甘肃出征第六届全国应急管理普法知识竞赛，白天苦练心肺复苏、高空索降、水域救援等实战内容，夜晚深耕法规题库，最终斩获全国一等奖，受到应急管理部等四部门通报表扬。\n\n图为航拍下的甘肃定西马铃薯种苗大棚。(资料图) 高莹 摄\n\n　　归来后，安文伟把集训所学转化为培训课程，带动全队同步锤炼法理功底与应急技能，凝聚执法合力。她给自己定下目标，在危险面前寸步不退，当民众需要时，要拉得出、冲得上、打得赢，用长久坚守守护民众生命安全底线。\n\n　　“事故现场没有如果，只有沉甸甸的后果。”安文伟坦言，应急人的底气，来自平日千锤百炼。(完)\n\n 【编辑:刘欢】",

          "body": "中新网哈尔滨11月18日电 (记者 刘锡菊)“仅用4个月，我就拿到新房钥匙和不动产权证，这种喜悦无法用语言表达。”18日，在黑龙江省首个自主更新原拆原建项目回搬交付现场，哈尔滨市居民崔艳滨如是说。\n\n哈尔滨市居民崔艳滨拿到不动产权证。王迎超 摄\n\n　　哈尔滨市道外区南和街112-1号老楼始建于20世纪30年代，共3层，楼龄近90年，屋内没有独立厨卫，长期存在冬冷漏雨、管线老化、下水道堵塞等问题。2023年，该建筑经专业机构鉴定为D级危房，居民全部避险迁出。在哈尔滨市、道外区，市住建、市资规等部门以及街道、社区协同推进下，15户居民全部签订委托代建协议，项目于今年7月启动拆除施工。\n\n　　经过近4个月紧张建设，项目代建单位龙江安装集团完成新楼建设。新建楼为4层成套住宅，总建筑面积约700平方米，每户配套独立厨卫，同步配齐排水、燃气、供热、电梯等基础设施。\n\n　　为保障居民办证便利，哈尔滨市不动产登记事务中心创新推出“建设单位统一代办、材料一次复用”专属服务模式，依托预告登记，把不动产登记流程前置嵌入交付环节，做到交房与产权登记同步办理、同步办结。\n\n　　“我第一个领到产权证，非常高兴，浑身都在抖。”回迁居民崔艳滨表示，脸上难掩喜悦之情。周围居民纷纷用镜头记录下这一充满喜悦时刻。当日，15户居民陆续领到新房钥匙，并现场办结不动产登记。\n\n　　“两分钟办证对我们来说也是一个奇迹，欢迎大家过年来我家吃饺子。”回迁居民侯女士表示，拿到钥匙后的第一件事情就是装修，争取在过年前搬进新居。\n\n黑龙江省首个自主更新原拆原建项目回搬交付现场。刘锡菊 摄\n\n　　新建的四层楼宇外立面延续原建筑的仿红砖色调，在一楼上方，“南和街”三个大字镶嵌在红砖墙上。整栋楼的玻璃窗干净透亮，每家的窗户上都贴上了印有“福满新居”和“乔迁之喜”的红色窗花，整栋建筑洋溢着乔迁之喜与浓浓的市井温情。\n\n　　“欢迎各位业主回家。”现场，物业负责人表示，该栋楼交付前的公共部分和各建设环节已逐项查验验收，每一户物业都建立了完善的房屋与设备档案，供热供水电梯消防巡检和应急预案已安排好。\n\n回迁居民开锁。刘锡菊 摄\n\n　　“你好，我是附近的居民，将来我们的楼房也可能进行自主更新原拆原建，我们能到你的新家参观一下吗？”一位市民询问刚领到钥匙的居民。\n\n　　据悉，南和街112-1号老楼住户不多，但遇到的难题却一点不少——公产房买断、不动产登记、产权归属、规划落地……自主更新原拆原建项目可能遇到的问题，这个项目几乎蹚了一遍。正因如此，也经常有居民和其他自主更新原拆原建项目团队到南和街来取经。\n\n　　自主更新原拆原建，让老地方“长”出新生活。哈尔滨市南和街112-1号的焕新实践，是该市危旧住房更新中“不迁走人、不拆散邻里”的治理探索——既把危旧住宅从“不能住”变为“住得安”，更让居民过上了“过得好”的新生活。(完)\n\n 【编辑:田博群】",

          "body": "中新网哈尔滨11月18日电 (韩雪)11月18日，黑龙江省委宣传部、省政府新闻办举行“开局起步‘十五五’奋力谱写中国式现代化黑龙江新篇章”系列主题新闻发布会，介绍高质量教育体系建设情况。\n\n发布会现场。石启立 摄\n\n　　黑龙江省教育厅党组成员、副厅长赵雅琴介绍，在高校学科调整与人才培养方面，黑龙江省围绕国家攻关领域和省内重点产业集群形成专业调整清单，调整学科专业点1600余个，重点建设10所高水平大学、141个优势特色学科、10个交叉中心，新增12个ESI前1%学科。黑龙江工程师学院第二届85名学生提前取得工程师职称。今年国家科学技术奖黑龙江14项获奖项目均来自高校，哈尔滨工程大学杨德森院士牵头项目获国家技术发明奖一等奖。\n\n　　25所高校与境外高校举办中外合作办学机构和项目61个，在海外建设30个“开物工坊”；建成16个省级中俄同类大学联盟集群，俄方成员高校800余所；哈尔滨市第六中学校牵头成立国家级中俄中学联盟。今年高校俄罗斯籍留学生人数同比增长超30%，黑龙江省举办“中俄教育年”主题活动近400项。\n\n　　黑龙江省委教育工委副书记程爽介绍，黑龙江省推行弹性学制、实践成果申请学位等改革，304名本科生提前衔接研究生课程，40名硕博研究生凭实践成果取得学位；3091所学校开设人工智能通识课，近300万名学生参与，上线“就业超市”匹配岗位信息154万余条。\n\n　　黑龙江省教育厅党组成员、副厅长慕海军介绍，黑龙江省提质升级学前教育学位3万个，学前一年免费教育惠及10万余名儿童；13.35万名中小学生招生入学“一网通办”，9.63万名随迁子女在公办学校就读并享同城待遇；“云帮扶”“数字支教”覆盖408所边境和农村学校，提质升级县中学位1.3万个。\n\n　　黑龙江省委教育工委常务副书记、省教育厅厅长许振宇表示，“十五五”时期将推进“国门学校”标准化建设，培养“专业+俄语”复合型人才，围绕现代农业、装备智造、能源、生态安全、向北开放、冰雪人才等领域建设特色教育高地。(完)\n\n 【编辑:田博群】",

          "body": "中新网杭州11月18日电(林波)从社区门口的15分钟学习圈，到“杭学通”平台300万注册用户的学习轨迹；从青蓝夜校里年轻人的“充电+社交”，到银龄课堂上老年人的AI数字素养培训；从淳安山村里的公益送教课，到上城社区里的隔代教育沙龙……“让学习成为一种生活方式”这句话在杭州，并不仅仅是挂在墙上的口号。\n\n　　11月18日，杭州市人民政府新闻办公室联合杭州市教育局召开新闻发布会，介绍杭州市终身教育工作进展成效和2026年全民终身学习活动周(以下简称“学习周”)特色亮点。\n\n11月18日，新闻发布会现场一景。(杭州市教育局供图)\n\n　　学习周将于11月21日在杭州良渚文化艺术中心启动，将把这座城市绵延二十年的终身学习实践，浓缩成一场可看、可玩、可学的全民嘉年华。\n\n　　杭州是全球首批、全国首个加入联合国教科文组织全球学习型城市网络的城市，2024年又首批入选全国学习型城市网络。\n\n　　早在2002年，杭州便把学习型城市建设纳入城市发展战略，每五年一轮出台专项文件，迭代顶层设计。如今，纵向看，市、区县、乡镇、村社四级实体办学网络全面贯通，13个区、县(市)均建成独立法人社区学院；横向看，各类学习阵地超过5000个，学习场景嵌入社区、园区、景区，“城乡15分钟市民学习圈”加速成形。\n\n杭州青年在夜校学习拳击。(资料图，杭州市教育局供图)\n\n　　“一张网”托底，“一个码”增效。杭州市打造的终身学习公共服务平台“杭学通”，目前已实名注册用户300万人，入驻机构3800余个，累计组织学习活动21万场。平台提供“扫码即学”便捷服务，市民打开手机，扫码即可完成课程预约、签到、评价全流程闭环；利用AI学情模型，智能推送周边线下资源与适配课程，实现千人千面的个性化供给，尤其为老年群体降低了数字门槛。\n\n　　学习不只发生在课堂，更贯穿人的一生。\n\n杭州市西湖区手机AI创意进课堂一景。(资料图，杭州市教育局供图)\n\n　　面向老年人，杭州在提前实现全市乡镇(街道)老年学校全覆盖的基础上，累计建成32所省级老年教育优质校，推动“老有所学”从阵地建设转向内涵提质；“社区共学养老”实践模式入选国家级终身学习品牌项目，为全国老年教育与养老融合发展提供了杭州样本。\n\n　　面向中青年，杭州用好共富夜校、青蓝夜校等载体，推广“课程+社交+实践”三位一体教学，构建15分钟青年文化生活圈，回应“充电+社交”的双重需求。面向亲子家庭，杭州全市建成社区家长学校、家庭教育指导服务站点3449个，开发亲子沟通、隔代教育等市级课程，组建家庭教育讲师团，把家庭教育指导送到家门口。\n\n　　面向新市民、新农人、特需青少年等群体，杭州依托“双证制”教育、退役职通车、萤火学苑等项目重点开展技能提升培训，守好普惠底线，助力共同富裕。\n\n　　本届学习周，是这些成果的集中亮相。活动周由杭州市教育局、杭州市委老干部局等七部门联合主办，主题是“让学习成为一种生活方式——数智赋能学习·文脉点亮成长”，现场布设全民阅读、技能提升、非遗传承、数智赋能、银龄教育、健康生活、共同富裕、开放学习等八大主题展区。其中，数智赋能展区以“AI智学·慧享终身”为题，市民可体验AI机器人、智能学习设备与青少年科创成果；银龄展区则安排节目展演、银龄电竞与益智互动，诠释“银发乐学”的时代内涵。(完)\n\n 【编辑:田博群】",

          "body": "中新网重庆11月18日电 (马佳欣)重庆60岁及以上常住人口约835万，老龄化率26.2%。“十五五”期间，这800多万老年人的权益怎么守？18日，在“开局起步十五五·建设现代化新重庆”——《重庆市民政事业发展“十五五”规划(2026—2030年)》解读新闻发布会上，重庆给出的办法是抓好“三个保障”。\r\n\n　　重庆市民政局二级巡视员周利民介绍，做好老龄工作，既要保障“老有所养”，也要守护“老有所安”，牢牢守住老年人权益保障安全底线。重庆有800多万老年人，不同老年群体面临的权益风险侧重点各有不同。“针对这些多元化的权益保障诉求，我们将在‘十五五’期间重点抓好‘三个保障’。”\n\n　　第一是强化法治保障。重庆将以高质量修正《重庆市老年人权益保障条例》为契机，结合重庆实际，进一步完善子女护理假、养老机构准入及监管、监护与遗赠抚养等条款细则，把成熟实践固化为法规制度，让法规条文跟上老年人的现实需要。落到老年人身上，就是今后老年人在患病住院需要赡养人照料、赡养权益遭受侵害、与养老机构发生服务争议等情形下，维权有法可依，合法权益有“法治守护”。\n\n　　第二是强化维权保障。针对涉老电信诈骗、保健食品虚假宣传、养老非法集资等突出问题，重庆建立跨部门协同联动机制，一方面，健全“信息共享、联合排查、线索移送、会商处置”闭环，补齐分散监管短板，实现涉老风险早发现、早干预、早化解；另一方面，协同公安、司法、市场监管等部门开展联合核查和专项整治，持续从严惩处各类涉老违法违规行为，形成长效震慑。与此同时，常态化开展“反诈银龄守护”等普法宣讲，帮助老年人提升识骗防骗能力，联动司法部门打通维权通道，优化绿色通道，让老年人就近便捷维权、安心放心维权。\n\n　　第三是强化兜底保障。一方面，重庆支持推进老年人意外伤害保险，老年人可通过保险公司等渠道自愿参保。对参保老年人而言，如果发生跌倒等情况，能够根据条款规定获得相应理赔补偿，减轻就医、康复的经济压力，缓解照护家庭的经济焦虑。另一方面，稳步试点推广意定监护制度，有效解决高龄独居、无子女、子女不在身边等老年人失能失智后的照护、财产处置、医疗决策等难题，保障老年人在全生命周期不同阶段的自主决定权与合法权益。\n\n　　“让老年朋友说话有人听、遇事有人帮、权益有人护。”周利民说，“十五五”期间，重庆将全心全意办好护老、助老、惠老民生实事，要让“老有所养”更有成色、“老有所安”更有温度。(完) 【编辑:刘欢】",

          "summary_short": "中新网乌鲁木齐11月18日电 (张家伟)“土耳其主流媒体疆行记”日前启动，10余位土耳其媒体人走访新疆乌鲁木齐…",
          "digest": "“土耳其主流媒体疆行记”日前启动，10余位土耳其媒体人走访新疆乌鲁木齐、克拉玛依",

          "body": "中新网乌鲁木齐11月18日电 (张家伟)“土耳其主流媒体疆行记”日前启动，10余位土耳其媒体人走访新疆乌鲁木齐、克拉玛依。他们走进新疆高校、历史文化场馆、社区等，实地了解新疆现状。\n\n　　感受文化底蕴\n\n　　在新疆博物馆，土耳其媒体人参观出土文物、古代织物等展品，了解古代丝绸之路交往历史和新疆历史脉络。\n\n　　Oda TV总编辑玉切尔·穆斯塔法·伊尔凯尔说：“新疆博物馆精彩地讲述了人类共同遗产以及文化交融共生，能看到各民族文化与历史彼此交融，展现出新疆拥有悠久深厚的文明。”\n\n土耳其媒体人在新疆博物馆参观。张家伟 摄\n\n　　他表示，西方媒体刊发很多片面报道，声称中国在新疆的治理破坏本土文化、不重视文化传承。但亲眼所见的这座博物馆比很多西欧、美国的博物馆还要出色，充分体现出新疆保护地域文化的决心。\n\n　　“站在媒体从业者的角度，这也带给我们启示：不能只听信单方面说辞，要亲身到访、亲眼观察、如实传递客观事实。”他说。\n\n　　来到克拉玛依市文化馆，他们近距离了解当地非遗保护和公共文化服务工作，并观摩泥塑、绒花制作等技艺，感受传统文化的保护与传承。两处文化场所，展现出新疆文化保护传承的不同侧面。\n\n　　探访新疆高校\n\n　　在新疆艺术学院，土耳其媒体人参观万桐书木卡姆文献馆、中华传统乐器馆等，并现场观看木卡姆表演。\n\n　　“一个社会的未来，最重要的衡量标准，在于它对自身传统的传承程度。”国民频道(Ulusal Kanal)安卡拉站代表土耳其坎·阿德南说，他在新疆艺术学院看到弹布尔、热瓦普、艾捷克等民族乐器得以良好保护和传承，倍感欣喜。\n\n　　他表示，看到新疆有这样一所规模宏大的艺术院校、齐全的师资，充分展现了当地对传统、音乐与文化的高度重视。\n\n土耳其媒体人在中国石油大学(北京)克拉玛依校区参观实训场地并与在校学生交流。张家伟 摄\n\n　　土耳其媒体人还在中国石油大学(北京)克拉玛依校区走访了校园实训场地，了解学校专业设置、科研方向等。\n\n　　土耳其《光明报》上海站首席记者别尔卡伊·萨伊尔称，他看到中国石油大学(北京)克拉玛依校区不仅和国内众多高校开展合作，还对接世界多国，尤其和中亚合作紧密。同时，中国依靠自身建设带动了周边国家发展。\n\n　　最让他触动的是，他了解到中国石油大学(北京)克拉玛依校区不少学生毕业后选择留在当地，持续助力中国西部发展，这点尤为可贵。\n\n　　体验市井民生\n\n　　除校园、展馆之外，土耳其媒体人还走访集市与城市社区，感受民生烟火。\n\n　　在新疆国际大巴扎，街区商铺林立，民族手工艺品、特色美食琳琅满目，往来游客络绎不绝。这让土耳其《光明报》对外部主任阿尔滕巴什·奥兹居尔印象深刻。\n\n　　他说，这里秩序井然，多元文化共生共存，各民族商户在此经营，和睦共处。实地所见的鲜活图景，让他对新疆有了更为立体的感知。\n\n土耳其媒体人在克拉玛依市克拉玛依区昆仑路街道南苑·南泉社区邻里共享中心内的“健康屋”体验中医诊疗。张家伟 摄\n\n　　走进克拉玛依市克拉玛依区昆仑路街道南苑·南泉社区，这里居住着汉族、维吾尔族、哈萨克族等24个民族共5600余名居民。社区配套完善，常态化开展便民服务，各族群众邻里和睦，是民族团结与基层治理的典范。\n\n　　玉切尔·穆斯塔法·伊尔凯尔表示，他看到这个社区居民生活十分和谐，民众能够共同生活、共同学习、共同进步。此外社区的住房条件、生活服务、免费诊疗能够得到充分保障，体现出中国政府对百姓的重视。\n\n　　几天时间，土耳其媒体人逐渐了解真实新疆，他们还将去往新疆和田地区感受民生风貌。不少土耳其媒体人表示，实地走访感受到新疆的安定与活力，希望把此行的真实见闻，传递给土耳其受众。(完)\n\n 【编辑:田博群】",

          "body": "中新网重庆11月18日电 (马佳欣)11月18日，“开局起步十五五·建设现代化新重庆”——《重庆市民政事业发展“十五五”规划(2026—2030年)》解读新闻发布会在重庆市政府新闻办举行。中新网从会上获悉，“十五五”期间，重庆市儿童福利工作将由“保基本、兜底线”向“提质效、促发展”转型升级。对困境儿童及其家庭而言，最直观的新变化有三个：保障更精准、关爱更可及、服务更便捷。\n\n图为重庆市爱心庄园工作人员正在给孤残儿童开展个性化辅导。重庆市民政局 供图\n\n　　重庆市民政局副局长余东海介绍，第一个变化是分类保障更精准。“十五五”时期，重庆将在现有兜底政策基础上，针对困境儿童各方面的实际需求细化保障举措，持续织密筑牢生活、教育、医疗一体化兜底保障网。基本生活方面，将持续健全孤儿、事实无人抚养儿童基本生活保障标准自然增长机制，根据经济社会发展情况动态调整保障标准，稳步提高保障水平。在教育方面，落实“福彩圆梦·孤儿助学”“福彩圆梦·助学成长”项目，按每人每学年10000元、8000元分别为孤儿、事实无人抚养儿童发放助学补贴，保障孩子求学之路不断档。在医疗方面，持续实施孤儿医疗康复“明天计划”和民政“惠民济困保”，完善困境儿童医疗保障政策，减轻困境儿童家庭医疗负担。\n\n　　第二个变化是精准关爱更可感。余东海表示，当前重庆的关爱保障已经兜住基本生活底线，但部分留守、流动儿童还存在监护支持不足、心理关怀不够等问题。“十五五”期间，重庆将建立关爱服务台账，优化留守儿童委托照护，牵头落实流动儿童关爱服务清单，推动孩子们在常住地平等享受各项基本公共服务，让流动儿童进城不“陌生”、留守儿童在家不“孤单”。针对心理健康和监护状况这一新的关注重点，持续实施“童心相伴”心理健康关爱服务民生实事，拓展实施“育见未来”监护赋能关爱服务项目，联动教育、卫生健康、妇联等相关单位，对困境儿童的成长风险做到早发现、早干预、早帮扶。\n\n　　第三个变化是服务网络更下沉。以往优质的儿童养护、康复、特教资源相对集中在城区，镇街、村社一线服务供给偏弱，就近服务的可及性还有提升空间。“十五五”期间，重庆将推动优质关爱资源下沉落地、均衡布局。市级层面全面推进儿童福利机构优化提质，深入实施“开门办院”，把养护、康复、特教等优质服务资源向社区延伸，有需求的残疾儿童不必跑远路就能享受到专业服务。区县层面强化未成年人救助保护机构规范化建设和实体化运行，筑牢基层保护核心阵地。在镇街、村社，整合儿童主任、爱心妈妈、社区志愿者、儿童社工等力量，依托儿童之家等阵地，把关爱服务真正送到孩子“家门口”。\n\n　　“让每一个困境儿童都被看见、被守护，在同一片蓝天下健康成长。”余东海说。(完)\n\n 【编辑:刘欢】",

          "body": "中新网唐山11月18日电 (王夏菲 孙浩文)18日，依托环渤海自贸区海事政务跨域通办新模式，曹妃甸海事局协同烟台海事局成功办结首单船舶转籍登记业务。\n\n　　据悉，本次业务涉及的两家航运企业分属山东烟台、河北曹妃甸两地，但企业办事人员常驻河北曹妃甸。“我一个人就能把全套业务办完，免去了去烟台办理的往返路费和时间成本。”此次业务经办人张晓娟说，她只需在曹妃甸海事局政务中心办理窗口一次性提交材料，就可“一站式”完成注销登记、船舶所有权登记等全链条审批，真正实现“就近办、一次办、少跑腿”。\n\n　　据了解，船舶转籍登记是航运企业高频刚需业务，在以往办理模式下，买卖双方需前往新旧两个船籍港分别办理手续，办事流程繁琐。新模式落地后，在河北曹妃甸、天津东疆、辽宁大连、山东青岛、山东烟台五地互通范围内，办事企业可结合自身经营实际，自主选择任一“环渤海自贸区跨域互通办理窗口”提交申请，由两地海事部门内部流转、并联审批。\n\n　　曹妃甸海事局政务中心副主任李孟弟表示，下一步，曹妃甸海事局将持续用好环渤海自贸区海事政务跨域通办新模式，不断优化业务流程、提升协同效能，助力环渤海航运一体化高质量发展。(完)\r\n\n 【编辑:田博群】",

          "body": "中新网北京11月18日电 (记者 陈杭)18日，“岁月流金 宜于长久——东城长者影像展”在北京市东城区内务部街27号的朝阳门社区文化生活馆(27院儿)开展。展览展出二十余位东城长者代表的肖像与人生故事，将持续至12月8日。\n\n图为“岁月流金 宜于长久——东城长者影像展”。中新社记者 贾天勇 摄\n\n　　展览以“岁月流金 宜于长久”为题，设“风骨久久·立身以正”“执手久久·相守以诚”“守望久久·睦邻以善”“满堂久久·传家以德”“颐年久久·敬老以仁”五个篇章，依次呈现老党员的初心坚守、金婚伉俪的相濡以沫、街坊邻里的守望相助、多代同堂的家风传承，以及养老服务机构的悉心照护。每组人物以大北照相馆拍摄的肖像为主体，配以日常生活照片和简短故事。\n\n图为“岁月流金 宜于长久——东城长者影像展”。中新社记者 贾天勇 摄\n\n　　北京市东城区文化和旅游局副局长俞浩表示，今年重阳节起，该局以“岁月流金·宜于长久”为主题，开展东城好时节·重阳系列文化活动，并携手中华老字号大北照相馆，为各街道和区民政局、区妇联推荐的长者代表拍摄肖像、记录故事。今天的展览，就是这项工作的成果。\n\n　　俞浩说，今后，该局将持续擦亮“东城好时节”文化品牌，推出更多贴近群众的文化活动，让东城居民在家门口享受到更多优质文化服务。\n\n　　展览由北京市东城区文化和旅游局主办，北京市东城区民政局、北京市东城区妇女联合会、北京大北照相有限责任公司协办。(完)\n\n 【编辑:刘欢】",

          "body": "中新网重庆11月18日电 (杨梦逸)11月18日，“渝见黄南 共赴神韵”——2026年“大美青海·神韵黄南”冬季文旅宣传推介活动在重庆举行。青海省黄南藏族自治州坎布拉景区、泽库县、河南县及西宁市文旅部门同台推介冬季文旅。\n\n图为推介活动现场。　杨梦逸 摄\n\n　　据介绍，黄南藏族自治州位于青海省东南部，因地处黄河之南而得名，是青海省连接中国西南地区的主要通道之一，全州总面积1.89万平方公里。黄南拥有热贡艺术和黄南藏戏2项世界非物质文化遗产、6项国家级非物质文化遗产，8名国家级工艺美术大师。现存古文化遗址409处，国家级文物保护单位4处，省级文物保护单位41处。2019年被评为国家级热贡文化生态保护区。\n\n　　作为青海省“清清黄河”旅游带上的重要节点，黄南拥有世界地质公园坎布拉、宁木特大峡谷、河南县蒙旗大草原、泽库和日石经墙等丰富文旅资源。\n\n图为推介活动中藏戏歌舞表演。　杨梦逸 摄\n\n　　推介环节，黄南州文旅推介官重点推介“清清黄河1号风景大道”和“非遗研学之旅”两条精品线路，把黄河风光与热贡非遗体验串成一条可走、可看、可学的行程；坎布拉景区现场推介世界地质公园的丹霞赤壁与黄河碧水；泽库县、河南县分别带来草原牧区文旅资源和民族风情产品；西宁市推介“夏都”冬季旅游线路。\n\n　　“近年来，黄南聚焦‘高质量打造青海国际生态旅游目的地东南门户’战略定位，着力构建青海东南片区的‘服务门厅、生态客厅、文化展厅’。”天津援青指挥部总指挥，青海省黄南州委副书记、副州长裴治表示，希望以此次推介会为契机，依托重庆客源市场，让“大美青海·神韵黄南”的品牌在山城大地“响起来、走出去”。(完)\n\n 【编辑:黄钰涵】",

          "body": "中新网北京11月18日电 11月中旬开始，北京市丰台区将陆续举办养老资源、体育资源、公园运营合作、城市更新等系列专场推介发布会。作为系列活动的首场推介会，“遇见丰台·众汇京彩”——2026丰台区养老资源发布会11月18日举办，丰台区集中推出11处、约13.98万平方米养老资源“大礼包”，涵盖5处新建小区配套养老设施、6宗社会福利用地。同步配套惠企营商举措与专属金融服务方案，面向社会公开征集运营主体，以空间换服务，引导社会资本深度参与养老事业建设，推动优质养老项目加速落地。\r\n\n　　养老既是民生关切，也是城市发展新机遇。北京市丰台区民政局局长毕博、市规划自然资源委丰台分局副局长谯贇在现场联合发布本次推介的11处养老资源。其中，5处新建小区配套养老设施均已完成竣工验收，水、电、气、热等基础配套全部到位，内部无障碍设施完备，可实现轻装入场。\n\n　　5处设施各具特点：位于南苑街道槐房南路的设施周边社区密集，满足老人“离家不离街”的养老需求；位于大红门街道木材厂东路的设施临近南苑森林湿地公园等生态空间，适宜开展康复与户外疗愈；新村街道科安街的设施紧邻地铁丰台南路站，周边商业便民配套成熟；新村街道康庄东路的设施医疗资源配套齐全，紧邻樊家村社区卫生服务站以及约3000平方米医疗配套；宛平街道醒狮街的设施体量最大，建筑规模达1.78万平方米，可设置床位300张以上。\n\n　　丰台区还推出6宗社会福利用地，用地面积合计4.5万平方米，规划建筑规模合计9.5万平方米，容积率1.5至2.0。6宗地块全部净地可移交，周边市政道路贯通，基本具备“拿地即开工”条件。\n\n　　发布会上，谯贇表示，结合养老设施公益属性、运营模式、建设主体差异，按照国家及北京市现行政策规定，丰台区社会福利用地实行划拨、公开招拍挂、协议出让三类法定供地方式。各类模式适用场景、准入条件清晰明确，便于市场主体精准匹配项目定位和拿地路径。\n\n　　“我们要把资源亮出来、把场景开放出来、把合作机会讲清楚，把养老资源场景变成企业’看得见、可参与、能盈利’的投资机会。”毕博表示，此次资源既可承接嵌入式社区照护，也可支撑规模化医养结合项目，能满足不同运营主体的差异化需求。\n\n　　发布会现场，北京市丰台区民政局副局长李杰介绍，截至2025年底，丰台区60岁及以上老年人口达54.5万人，占常住人口27.2%。\n\n　　面对普惠化、专业化、多元化的养老需求，丰台区持续织密区、街、社区三级养老服务网络，不断完善“15分钟养老服务圈”。目前，全区已建成区级养老服务指导中心、19家街镇区域养老服务中心、99家社区养老驿站。在机构养老方面，全区备案运营养老机构60家，其中公建民营28家，普惠性养老床位超6000张。丰台区还联合区卫健委开展“五床联动”，推动机构养老床位、医疗机构床位、家庭养老床位、家庭病床、安宁疗护床位衔接流转。\n\n　　居家养老服务体系不断完善。全区布局助餐点289个，年助餐服务73.2万人次；连续三年实施“百岁老人幸福工程”；为1.3万名独居、空巢、失能等特殊老人建立一对一动态关爱台账，全年关爱探访13.8万人次。\n\n　　“在丰台，老年人在熟悉的街巷间，热乎的饭菜就近可享，舒心的照护近在身旁，急难有人帮扶，在家门口就能安心享老。”李杰表示。\n\n　　养老项目的落地，离不开营商环境与金融力量的支持。北京市丰台区发展改革委副主任张文杰介绍了惠企服务举措。针对养老项目审批环节多、链条长的痛点，丰台依托“审批科长工作营”机制，联动20多个职能部门、60多名审批科长，每周半天集中办公、联合会商，“一站式”解决审批问题。该机制自今年8月底启动以来，已服务企业200家、办理诉求300件，工程类项目开工时间压缩25%。\n\n　　在金融支持环节，瑞众保险北京分公司党委书记、总经理牟海林介绍瑞众保险正推动服务向“保险保障+生态服务+长期陪伴”转型。北京农商银行零售金融服务部副总经理张莉静介绍了“一项目一策”定制化融资安排以及“浓情星级贷”专属产品。保险的客户与生态，加上银行的信贷与结算，互为补充，为有意参与丰台养老项目的市场主体提供了多元的融资支持路径与合作展望。\n\n　　“当前养老行业正在从‘床位出租’向‘医养康护一体化’升级，需要构建‘有为政府、有效市场、有责家庭、有爱社会’的治理格局。”中国人民大学国家发展与战略研究院高级研究员黄石松说。国家发展改革委社会发展研究所研究室主任、研究员李璐从宏观层面指出，当前银发经济中养老服务仍处于供需匹配较弱的领域，存在“老人找不到优质服务、企业找不到要素资源”的两难。丰台区通过政府搭台集中亮出资源，为供需双方提供了直接对接的渠道。\n\n　　为方便企业深入了解，11月19日、20日丰台区将集中开放这批配套养老设施及用地，供意向企业实地踏勘。5处配套设施计划陆续启动公开招标，6宗用地后续结合市场情况以划拨、招拍挂、协议出让三种法定方式供地。\n\n　　未来，丰台区将以此次资源发布为契机，持续盘活存量空间，吸引更多优质社会力量参与养老服务供给，把“一刻钟养老服务圈”建设得更具品质与温度。(完) 【编辑:刘欢】",

          "body": "中新网哈尔滨11月19日电 (记者 王琳)11月18日，哈尔滨市亚布力管理委员会举办亚布力冰雪季新闻发布会，围绕新雪季的滑雪产品、赛事活动、度假场景、服务保障等亮点举措集中推介，重点培育冰雪夜经济。\n\n11月18日，哈尔滨市亚布力管理委员会举办亚布力冰雪季新闻发布会。　杨思颖 摄\n\n　　会上发布了亚布力滑雪旅游度假区2026—2027雪季的全新业态、服务安排及“三山联网”运营成效，展现“这么早，那么晚，龙江滑雪任你选”的资源优势，持续擦亮哈尔滨冰雪季品牌。\n\n　　哈尔滨市亚布力管理委员会文化旅游管理处处长吴丹介绍，亚布力滑雪旅游度假区的新业态、新场景集中亮相，为冰雪消费注入全新活力，今冬将积极培育夜间消费，做强温泉、夜间演艺、山地酒吧等多元场景，拉长游客停留消费链条。\n\n11月18日，游客在亚布力阳光度假村体验滑雪运动。　杨思颖 摄\n\n　　亚布力阳光度假村新媒体运营官杜冰玉介绍，多家连锁品牌入驻度假村，餐点全天供应；酒店内新增轻奢下午茶、酒廊、午夜粥铺等业态，度假村内配有酒吧、健身房等供游客休闲娱乐，实现“白天滑雪、日间休闲、夜间社交”全时段闭环。\n\n　　亚布力旅游投资集团有限公司副总经理刘广鹏介绍，服务升级的核心方向是暖心细节，深化“有温度的亚布力”服务品牌。在夜间保障方面，增设4至6台自动售餐机，解决夜间闭店后用餐需求。\n\n11月18日，大熊猫在亚布力熊猫馆吃竹子。　杨思颖 摄\n\n　　亚布力森林温泉酒店总经理吴辉介绍，依托亚布力顶级滑雪资源，酒店成功打造“白天激情滑雪、夜晚温泉康养”的成熟度假闭环。滑雪释放活力，温泉舒缓身心，动静结合、冷暖相宜，构建出完整、高品质的冰雪度假体验体系。(完)\n\n 【编辑:何颖】",

          "body": "中新网南宁11月19日电 (张广权 王以照 黄姿娜)2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术交流活动18日在广西南宁举行。现场公布大赛最终获奖结果并颁奖。\n\n　　该赛事是中国首个面向东盟国家的气象人工智能专项赛事。大赛自6月启动以来，吸引中国及东盟六国逾千名科创力量参与，104支队伍晋级决赛，共评出55个奖项，一批可落地、可跨境推广的创新成果集中亮相。\n\n11月18日，2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术交流活动在广西南宁举行。现场公布大赛最终获奖结果并颁奖。刘英轶 摄\n\n　　大赛设置“AI+气象数智计量”“AI+短时降水预报”“AI+众创气象服务”三大赛道。中国与东盟国家联合组队，跨境协作从“技术输出”走向“联合研发”，并依托云上算力支撑多模型同步推演。\n\n　　决赛路演环节，创新成果集中亮相。“多源融合短时降水预报模型”综合评分较传统数值模式提升34.7%；泰国代表队展示的“城市内涝智能预警方案”，可将多源多要素气象监测数据转化为街道积水风险研判。\n\n　　泰国气象局航空气象研究与发展处处长普差潘·西里萨(Putchaphan Sirisap)表示，人工智能正助力气象预报更加精准，在短时降水、城市内涝等场景中更好守护民众生命安全。\n\n　　广西壮族自治区政协副主席钱学明表示，气象与人工智能天然契合，广西以气象智能预警方案“妈祖”为抓手，深化与东盟国家的气象合作交流。希望未来推动更多气象创新成果走出赛场、惠及公众；利用人工智能等技术手段提升气候变化、极端天气应对能力。(完)\n\n 【编辑:何颖】",

          "body": "一、Anthropic：AI赛道的“超级抽血机”来了\n本周，全球科技圈和资本市场都在屏息等待一件事——大模型巨头 Anthropic 正式登陆纳斯达克。作为史上规模最大的IPO之一，这次发行高达8.25亿股，定价区间在70至78美元，募资体量极其惊人。\n每当这种级别的巨无霸上市，市场的第一反应往往不是狂欢，而是对流动性的恐慌。在资金总量有限的情况下，机构为了腾出仓位认购新巨头，必然会抛售手中的存量科技股。这也为近期科技板块的剧烈震荡埋下了伏笔。\n二、市场复盘：英伟达业绩炸裂，为何科技股反而大跌？\n很多投资者看着盘面感到困惑：就在刚刚发布的英伟达最新财报中，数据中心营收同比增长高达110%（达到1,076亿美元），下一季度的营收指引更是达到了惊人的1,300亿美元，远远甩开市场预期。\n单看基本面，AI算力需求不仅没有丝毫放缓，订单反而依然旺盛。那为什么美股科技股此前却提前经历了一轮大跌？\n核心原因只有一句话：资本市场交易的从来不是已经兑现的业绩，而是对未来的预期。\n在亮眼的财报数据之下，华尔街正在为四个深层的不确定性重新定价：\n对AI资本开支可持续性的担忧：下游科技巨头们真金白银砸了上千亿美元买芯片，但市场开始疑惑：这种疯狂的资本开支还能持续几个季度？如果终端应用迟迟跑不出对等的商业变现，算力采购的拐点随时可能出现。\n高估值的脆弱性：过去两年AI概念被极致演绎，科技股估值普遍处于历史高位。在“预期打满”的状态下，任何风吹草动都会触发资金的获利了结，高估值本身就是最大的风险。\n核心管理层变动的冲击：随着黄仁勋卸任CEO、临时管理层接棒，尽管公司强调技术路线图照常推进，但失去灵魂人物掌舵带来的治理不确定性，依然让部分机构选择避险为上。\n三、重定价：新一轮资本融资如何重塑AI估值？\nAnthropic 的上市，标志着AI产业正式从“一级市场讲故事”迈入“二级市场算总账”的残酷阶段。\n大模型不再稀缺，盈利能力成试金石：Anthropic 招股书里写满了风险提示，即便模型能力处于第一梯队，它依然是一个极其烧钱、尚未建立稳定持续盈利路径的重资产业务。上市后，它的每一个季度财报都会被放在显微镜下审视。\n估值锚点重构：今年6月 SpaceX 上市后也曾经历过破发和剧烈波动。如果 Anthropic 上市后表现不及预期，或者出现“上市即巅峰”的走势，整个AI应用层乃至算力层的估值中枢都会被向下重定价。资本市场将不再为单纯的“参数规模”买单，而是只为“自由现金流”和“商业闭环”买单。\n四、破局：泡沫暗涌之下，普通人该如何调整账户？\n当高估值科技股进入高波动、高分化的“深水区”，普通投资者如果还把所有筹码押在单一科技赛道上，无异于在惊涛骇浪中走钢丝。\n在这个节骨眼上，“哑铃策略”依然是最稳妥的解法——一端保留少量看好的硬核科技底仓，另一端则必须加大高股息、低波动的防御性资产配置，用确定的分红现金流来对冲科技泡沫破裂的风险。\n为什么现阶段建议重点关注红利资产？\n抗跌属性强：在市场风险偏好下降、资金从高估值成长股撤离时，具备稳定盈利和持续分红能力的企业往往成为资金青睐的对象。\n穿越周期的复利：不管AI技术路线怎么迭代、哪家大模型最终胜出，水电煤、银行、交运等关系国计民生的基础行业依然在源源不断地产生现金流。\n红利低波ETF天弘（159549）——紧密跟踪红利低波100指数\n红利低波ETF天弘（159549）通过紧密跟踪红利低波100指数，聚焦银行、医药生物、交通运输等具备稳健盈利与强现金流的行业，剔除了高波动杂质，将低波特征与分红意愿结合。\n从指数编制情况来看，红利低波100从A股中选取100只流动性好、连续分红、股息率高且波动率低的股票，有四个亮点值得关注：\n•双因子筛选，规避“红利陷阱”：只看股息率，容易买入因股价暴跌而“被动高息”的公司；叠加低波动筛选，更聚焦经营稳定、分红可持续的企业。\n•股息率/波动率加权：股息率越高、波动越低，权重越大；股价下跌推高股息率时，权重随之上调，形成“越便宜越多买”的再平衡。\n•每季度调样：比年度调样更及时地剔除股息率下滑或波动放大的个股。\n•行业分散：单一二级行业权重上限20%。\n●作为标准化的资产配置工具，在AI泡沫加剧的当前市场环境，红利低波ETF天弘（159549）仍具有较高的配置价值，适合作为投资者“哑铃策略”的一端。\n风险提示：成份股仅为客观展示，不代表个股推荐。本文观点不构成任何投资建议，市场有风险，投资需谨慎，指数基金存在跟踪误差，请投资人独立判断和决策。数据来源：wind。\n往期精选：\n《岁末年初险资避险需求提升，红利低波ETF天弘(159549)资产配置工具属性凸现》\nhttps://www.jiemian.com/article/15250858.html\n《震荡市中的确定性回报——揭秘红利资产背后收益驱动的引擎》\nhttps://www.jiemian.com/article/15308740.html\n《宽基和高股息资产怎么搭配更佳？一文说清》\nhttps://www.jiemian.com/article/15318567.html\n《俄乌美三方会谈重启，市场定价容易反复，该选择什么类型的避险资产？》\nhttps://www.jiemian.com/article/15323480.html\n《行业轮动过快，账户里的数字上蹿下跳，如何放置我们的资产？》\nhttps://www.jiemian.com/article/15334891.html\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\nAnthropic敲钟在即，英伟达业绩炸裂，为何科技股反而大跌？当前应该如何配置资产？\n\n作为标准化的资产配置工具，在AI泡沫加剧的当前市场环境，红利低波ETF天弘（159549）仍具有较高的配置价值，适合作为投资者“哑铃策略”的一端。\n\n原创新闻有连云 · 2026/11/19 09:08来源：界面新闻\n\n一、Anthropic：AI赛道的“超级抽血机”来了\n本周，全球科技圈和资本市场都在屏息等待一件事——大模型巨头 Anthropic 正式登陆纳斯达克。作为史上规模最大的IPO之一，这次发行高达8.25亿股，定价区间在70至78美元，募资体量极其惊人。\n每当这种级别的巨无霸上市，市场的第一反应往往不是狂欢，而是对流动性的恐慌。在资金总量有限的情况下，机构为了腾出仓位认购新巨头，必然会抛售手中的存量科技股。这也为近期科技板块的剧烈震荡埋下了伏笔。\n二、市场复盘：英伟达业绩炸裂，为何科技股反而大跌？\n很多投资者看着盘面感到困惑：就在刚刚发布的英伟达最新财报中，数据中心营收同比增长高达110%（达到1,076亿美元），下一季度的营收指引更是达到了惊人的1,300亿美元，远远甩开市场预期。\n单看基本面，AI算力需求不仅没有丝毫放缓，订单反而依然旺盛。那为什么美股科技股此前却提前经历了一轮大跌？\n核心原因只有一句话：资本市场交易的从来不是已经兑现的业绩，而是对未来的预期。\n在亮眼的财报数据之下，华尔街正在为四个深层的不确定性重新定价：\n对AI资本开支可持续性的担忧：下游科技巨头们真金白银砸了上千亿美元买芯片，但市场开始疑惑：这种疯狂的资本开支还能持续几个季度？如果终端应用迟迟跑不出对等的商业变现，算力采购的拐点随时可能出现。\n高估值的脆弱性：过去两年AI概念被极致演绎，科技股估值普遍处于历史高位。在“预期打满”的状态下，任何风吹草动都会触发资金的获利了结，高估值本身就是最大的风险。\n核心管理层变动的冲击：随着黄仁勋卸任CEO、临时管理层接棒，尽管公司强调技术路线图照常推进，但失去灵魂人物掌舵带来的治理不确定性，依然让部分机构选择避险为上。\n三、重定价：新一轮资本融资如何重塑AI估值？\nAnthropic 的上市，标志着AI产业正式从“一级市场讲故事”迈入“二级市场算总账”的残酷阶段。\n大模型不再稀缺，盈利能力成试金石：Anthropic 招股书里写满了风险提示，即便模型能力处于第一梯队，它依然是一个极其烧钱、尚未建立稳定持续盈利路径的重资产业务。上市后，它的每一个季度财报都会被放在显微镜下审视。\n估值锚点重构：今年6月 SpaceX 上市后也曾经历过破发和剧烈波动。如果 Anthropic 上市后表现不及预期，或者出现“上市即巅峰”的走势，整个AI应用层乃至算力层的估值中枢都会被向下重定价。资本市场将不再为单纯的“参数规模”买单，而是只为“自由现金流”和“商业闭环”买单。\n四、破局：泡沫暗涌之下，普通人该如何调整账户？\n当高估值科技股进入高波动、高分化的“深水区”，普通投资者如果还把所有筹码押在单一科技赛道上，无异于在惊涛骇浪中走钢丝。\n在这个节骨眼上，“哑铃策略”依然是最稳妥的解法——一端保留少量看好的硬核科           "body": "朋友们，又到了“收租”的日子。\n三只月月分红的ETF——港股红利低波ETF招商（520550）、800现金流ETF招商（159119）、红利质量ETF招商（159209）——2026年第十次月度分红，已经陆续到账了。\n\n有多准时？港股红利低波自成立以来连续分了19次，红利质量连续17次，800现金流连续10次。每个月到点就发，比工资还靠谱。\n而且费率也低，管理费只有0.15%/年，全市场最低档。\n但今天想聊的不是分红本身，而是一个更实在的问题：\n这笔钱到账之后，你打算怎么花？\n先搞清楚，这三只ETF分别是什么角色？\n港股红利低波ETF招商（520550）——深度价值型。 买的是港股里高股息、低波动的公司，金融、公用事业为主，股息率近6%，市净率才0.73倍。说白了，就是一群“稳稳收租”的资产。\n800现金流ETF招商（159119）——核心底仓型。 选的是全市场自由现金流最充沛的50家公司，赚的都是真金白银。现在净值还在1块钱以下，相当于打折买“现金奶牛”。\n红利质量ETF招商（159209）——价值成长型。 高股息+高质量双筛，ROE近20%、股息率超4%，不含银行股。在红利家族里，它属于“能打”的那个。\n好了，现在钱到账了，无非两个选择：\n第一条路：花掉。\n这没什么不好意思的。分红本来就是给你花的。每月多一笔现金流，补贴家用、还房贷、带孩子吃顿好的，都行。\n三只ETF都是现金分红模式，钱直接打到你的银行账户。按中等仓位算，年化现金流回报大概3%-4%，比存银行强不少。分红金额会随市场波动，不是固定的，但每个月都有，这种“被钱叫醒”的感觉，挺踏实。\n第二条路：滚进去。\n如果你现在不急着用钱，那分红再投，可能是更聪明的选择。\n为什么？因为这三只ETF现在都处于回撤期。回撤的时候分红再投，等于在低位捡份额。等市场回升，这些低位积累的份额会帮你赚更多。\n但再投不是无脑“原路返回”，可以讲点策略：\n800现金流ETF（159119） 现在净值不到1块，折价最明显，再投性价比最高，优先考虑。\n红利质量ETF（159209） 长期回报最好，ROE也高，适合定投式加仓。\n港股红利低波ETF（520550） 估值压得很低，但港股拐点还不明朗，分红可以先放货币基金，等趋势清楚了再进去。\n所以怎么选？\n问自己一句话就行：这笔钱，我现在需要花吗？\n需要，就花掉。分红本来就是设计来给你提供现金流的，别觉得“花了就是亏了”。\n不需要，就滚进去。现在回撤期，每一分再投都是在低位攒筹码。\n最后说一句：\n每月分红到账，不只是收钱，更是一次提醒——提醒你检查一下自己的组合，看看哪块该补，哪块该等。\n分红不是终点，而是下一次决策的起点。\n这笔钱，你打算怎么花？欢迎聊聊。\n来源：搞钱小达人\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n又“被钱叫醒”了！比工资还准时！这笔钱怎么花？\n\n三只月月分红的ETF——港股红利低波ETF招商（520550）、800现金流ETF招商（159119）、红利质量ETF招商（159209）——2026年第十次月度分红，已经陆续到账了。\n\n原创新闻有连云 · 2026/11/19 09:07来源：界面新闻\n\n朋友们，又到了“收租”的日子。\n三只月月分红的ETF——港股红利低波ETF招商（520550）、800现金流ETF招商（159119）、红利质量ETF招商（159209）——2026年第十次月度分红，已经陆续到账了。\n\n有多准时？港股红利低波自成立以来连续分了19次，红利质量连续17次，800现金流连续10次。每个月到点就发，比工资还靠谱。\n而且费率也低，管理费只有0.15%/年，全市场最低档。\n但今天想聊的不是分红本身，而是一个更实在的问题：\n这笔钱到账之后，你打算怎么花？\n先搞清楚，这三只ETF分别是什么角色？\n港股红利低波ETF招商（520550）——深度价值型。 买的是港股里高股息、低波动的公司，金融、公用事业为主，股息率近6%，市净率           "body": "核心摘要： 昨日A股窄幅震荡，沪指涨0.09%报3587.83点、创业板指涨0.85%，但万得全A跌0.18%，成交13801亿元、缩量875亿元刷新年内地量，缩量博弈下赚钱效应偏弱，多只宽基ETF尾盘再度放量。外部约束继续加码：美联储10月纪要显示几乎全体官员认为还需加息，市场对12月加息25个基点定价95%以上，且首次将AI投资热潮列为通胀与金融稳定双重隐患。产业端国产算力接过主线，腾讯Q3资本开支814亿元远超市场预估的554亿元、自由现金流-691亿元，说明国产算力投入仍在加速而非降速。本周最确定的增量来自首批18只主动ETF，11月23日上市前至少84亿元待建仓，风格呈\"红利筑底、算力增强\"。今日看点：Anthropic纳斯达克挂牌首日表现，以及英伟达停止对华供应H200后的国产替代定价。\n【宏观】\n• APEC工商领导人峰会在深圳举行：中方支持成立\"世界湾区经济合作联盟\"，全面落实制造业准入又准营、稳步扩大服务业开放\n• 美联储10月纪要偏鹰：以10比2维持利率不变，几乎所有与会者认为进一步加息合适，两人提及12月可加息超25个基点，市场对12月加息25个基点定价95%-96.8%\n• 纪要首提AI双重风险：首次将AI投资热潮同时列为通胀上行风险与金融稳定隐患，指AI相关债务通过不透明结构快速累积；理事沃勒称若不释放1月加息信号，应在12月一次加息50个基点\n• 两则\"小作文\"同日辟谣：\"国常会表态不再频繁救市\"经核查系编造会议内容；证监会明确否认\"要求基金公司上报全部产品AI敞口\"\n• 海外通胀与地产压力延续：美国10月成屋签约销售指数跌4.7%至63，为2001年有记录以来最低；英国10月CPI同比涨3.6%，创一年新高\n相关ETF：A500ETF560610、上证增强ETF563930、纳指100ETF159659\n【金融 / 资本市场】\n• 首批主动ETF进入上市倒计时：18只产品11月23日集中上市，目前持股票资产约204亿元，按80%仓位下限测算上市前至少84亿元待入市\n• 长线资金借道ETF持续入场：9月28日以来股票型ETF净流入超6100亿元，企业年金、保险及产业资本密集现身新成立ETF前十大持有人名单\n相关ETF：价值主动ETF招商\n【AI / 算力】\n• 腾讯Q3资本开支大超预期：单季资本开支814亿元、远超预估554亿元，自由现金流-691亿元；云服务收入增长35%，调整后净利润降6%，管理层称现金资本开支已处峰值\n• 算力限制影响显性化：腾讯总裁刘炽平称新版本混元模型推出或需更长时间；英伟达临时CEO称将停止向中国供应H200芯片，外交部回应已多次阐明原则立场\n• AI融资规模预期上调：高盛将2027年全球AI项目融资从3000亿美元上调至5450亿美元，其中2250亿投数据中心建筑、3200亿投GPU等算力\n• 泡沫警示与逆势扩表并存：SEC前主席根斯勒称AI泡沫或在2028年大选前破裂、算力租赁云商面临\"崩溃破产\"；三星则称高负债新云商份额仅约8%，风险可控\n• Anthropic今日纳斯达克挂牌：定价83美元/股，机构认购约4000亿美元、散户近1000亿美元，代码\"ANT\"，为A股算力链提供外部定价参照\n相关ETF：云计算ETF159890、创业板人工智能ETF159243、软件ETF159899\n【半导体 / 设备】\n• BIS新规下的替代顺序：先看国内流片敞口大的昇腾链、寒武纪、壁仞，再看承接转产的国内晶圆厂与封测，最后是高端设备自主\n• 设备支出预期上修：伯恩斯坦预计2027年中国大陆以外区域设备开支增幅高达44%，国产设备与封测的转产承接同步受益\n• 存储成为采购主驱动：英伟达采购承诺环比增加约1000亿美元，主要由内存驱动，管理层预计2027年内存价格高于2026年\n• 对华出货再收紧：英伟达不再向中国出货此前已获许可的Hopper数据中心芯片，国产卡替代窗口进一步打开\n相关ETF：半导体设备ETF561980、科创芯片设计ETF589390\n【消费电子】\n• 英伟达切入AI PC：RTX Spark平台紧凑型桌面电脑上市，搭载20核Grace CPU与Blackwell架构RTX GPU，最高128GB统一内存、1 Petaflop算力，可本地运行1200亿参数大模型\n相关ETF：消费电子ETF159779\n【地缘 & 能源】\n• 美伊进入新一轮交火：伊朗袭击巴林、科威特美军基地及波斯湾油轮，美军空袭格什姆岛导弹阵地并集结三艘航母，特朗普称不需要与伊朗达成协议\n• 地缘溢价让位于供应过剩：美油主力跌3.65%报82.87美元/桶、布油跌1.83%           "body": "截至2026年11月18日 15:00，公司债ETF平安(511030)最新规模达450.14亿元。（数据来源：Wind）\n资金流入方面，公司债ETF平安近23个交易日内，合计“吸金”4.27亿元。（数据来源：Wind）\n数据显示，杠杆资金持续布局中。公司债ETF平安最新融资买入额达1741.19万元，最新融资余额达2189.19万元。（数据来源：Wind）\n截至11月18日，公司债ETF平安近5年净值上涨10.89%。\n截至2026年11月13日，公司债ETF平安近1年夏普比率为1.44。\n回撤方面，截至2026年11月18日，公司债ETF平安今年以来最大回撤0.33%，相对基准回撤0.07%。\n费率方面，公司债ETF平安管理费率为0.15%，托管费率为0.05%。\n跟踪精度方面，截至2026年11月18日，公司债ETF平安今年以来跟踪误差为0.010%。\n公司债ETF平安(511030)紧密跟踪中债-中高等级公司债利差因子指数(总值)净价指数，为多角度反映人民币债券市场的走势，该指数以主体和债项评级AAA的上交所公司债为基础，按照中债市场隐含评级分为三组并以利差因子进行细分，可作为投资中高等级公司债的业绩比较基准和投资标的。中债-中高等级公司债利差因子指数的财富指数代码为CBC00701，基期为2015年6月30日，基点值为100，包含待偿期分段子指数，每季度第一个银行间市场工作日调整指数成分券。\n风险提示：基金有风险，投资需谨慎。基金管理人承诺以诚实信用、勤勉尽责的原则管理和运用基金资产，但不保证本基金一定盈利，也不保证最低收益。基金管理人提醒投资人基金投资的“买者自负”原则，在做出投资决策后，基金运营状况与基金净值变化引致的投资风险，由投资人自行负担。基金的过往业绩及其净值高低并不预示其未来业绩表现，基金管理人管理的其他基金的业绩不构成对本基金业绩表现的保证。投资人购买基金，既可能按其持有份额分享基金投资所产生的收益，也可能承担基金投资所带来的损失。投资人应当认真阅读《基金合同》《招募说明书》等基金法律文件，全面认识本基金的风险收益特征和产品特性，并根据自身的投资目的、投资期限、投资经验、资产状况等判断基金是否和投资人的风险承受能力相适应，理性判断市场，谨慎做出投资决策。本材料中相关信息来源于基金管理人认为可靠的公开资料，相关观点、评估和预测仅反映当前的判断，后续可能有所变化。本材料所含任何市场观点的内容皆基于相应的假设条件，而任何假设条件都可能随时发生变化。基金管理人不承诺、不保证任何具有预测性质的市场观点必然得以实现。材料中提及的个股不构成投资推荐或建议。ETF基金的二级市场涨跌幅不代表基金实际收益率，请投资者关注场内价格波动风险。\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n公司债ETF平安(511030)近23个交易日净流入4.27亿元，近5年净值上涨10.89%\n\n截至2026年11月18日 15:00，公司债ETF平安(511030)最新规模达450.14亿元。\n\n原创新闻有连云 · 2026/11/19 09:06来源：界面新闻\n\n截至2026年11月18日 15:00，公司债ETF平安(511030)最新规模达450.14亿元。（数据来源：Wind）\n资金流入方面，公司债ETF平安近23个交易日内，合计“吸金”4.27亿元。（数据来源：Wind）\n数据显示，杠杆资金持续布局中。公司债ETF平安最新融资买入额达1741.19万元，最新融资余额达2189.19万元。（数据来源：Wind）\n截至11月18日，公司债ETF平安近5年净值上涨10.89%。\n截至2026年11月13日，公司债ETF平安近1年夏普比率为1.44。\n回撤方面，截至2026年11月18日，公司债ETF平安今年以来最大回撤0.33%，相对基准回撤0.07%。\n费率方面，公司债ETF平安管理费率为0.15%，托管费率为0.05%。\n跟踪精度方面，截至2026年11月18日，公司债ETF平安今年以来           "summary_short": "文｜青橙财经 青沐  编辑｜六子  扫地机器人行业，正在迎来新一轮深度大洗牌。",

          "points": [

            "“扫地机双雄”科沃斯和石头科技相继发布2026年三季报，两家公司的营收均保持增长…",
            "IDC数据显示，2026年第二季度，全球扫地机市场出货788.5万台…"
          ],

          "published_at": "2026-11-19T09:03:38+08:00",
          "size": 1,

          "body": "文｜青橙财经 青沐\n\n编辑｜六子\n\n扫地机器人行业，正在迎来新一轮深度大洗牌。\n\n奥维云网数据显示，2026年上半年国内扫地机零售量为309万台，较上年同期减少约14.9万台，同比下滑4.6%；零售额98亿元，同比下跌4%。\n\n行业数据并不乐观，但扫地机龙头品牌却越战越勇。“扫地机双雄”科沃斯和石头科技相继发布2026年三季报，两家公司的营收均保持增长，尤其海外业务贡献了主要增量。\n\n海外增长不只国内双雄。IDC数据显示，2026年第二季度，全球扫地机市场出货788.5万台，前五大厂商拿走了75%的出货量份额和82%的销售额份额，而这五大厂商，全部来自中国。\n\n一边是国内市场量价齐跌，一边是海外市场持续高增，出海已经成为行业的分水岭。但引擎轰鸣之下，出海也并非都是坦途。\n\n01 不出海，就出局\n\n2026年上半年，国内扫地机的零售额和零售量双双出现下滑。同期，据洛图科技数据，整个扫地机行业减少了11个品牌和73款机型，大量千元白牌和旧款机型被销售渠道集体出清。\n\n图源洛图科技\n\n如今，扫地机行业正在经历一个尴尬的换挡期：产品越来越难卖，即便卖得动，也卖不上价。\n\n一方面，行业高度内卷，扫地机陷入“微创新”瓶颈。\n\n过去几年，扫地机市场的全面爆发，首先得益于产品的代际创新。\n\n2016年以前，扫地机虽然具备全局规划清扫能力，但仍以“干扫”为主；一直到2016年后，集吸尘和拖洗功能一体的干湿两用扫地机才开始面市。\n\n2020年之后，扫地机厂商在技术不断突破，比如石头科技推出智能感知算法；云鲸推出带自动清洗拖布功能的基站，扫地机逐渐向着更多元形态发展。\n\n图源天眼查-云鲸专利情况\n\n比如扫拖一体机器人、扫拖洗烘一体机器人、智能洗地机等，还有融合集尘+洗拖布+烘干+上下水+除菌等多功能的全能型基站，进一步解放用户双手。\n\n图源方正证券\n\n但在这之后，行业进入“抢蛋糕”阶段，行业的竞争焦点开始转向营销和价格，技术创新反而一直在“挤牙膏”，功能难免越来越同质化。\n\n另一方面，消费者正逐渐对扫地机祛魅。\n\n在社交平台上，不少消费者吐槽扫地机“好看不好用”，比如避障不到位，清洁有死角；需要用户二次清洁，不能完全解放双手；容易出现毛发缠绕，没用多久就失灵等。\n\n图源小红书\n\n归根到底，消费者不愿意买账，是因为扫地机还不够好用。然而，要让产品真正好用，需要长期的研发投入，但在行业价格战下，厂商的微薄利润根本撑不起这场攻坚战。\n\n比如科沃斯和石头科技，这几年营收规模虽然一直在涨，但利润规模反而在“瘦身”。2025年，科沃斯和石头科技的销售费用率分别为31.2%和26.2%，但研发费用率分别为5.1%和7.6%。\n\n图源公开财报\n\n当国内市场的增长和利润天花板近在眼前，向外走，就成了唯一的路。\n\n02 向海外市场“要利润”\n\n过去三年，中国清洁家电的出海明显提速。\n\nIDC数据显示，2026年第二季度，全球扫地机器人市场出货量厂商份额前五名分别为石头、追觅、科沃斯、小米与MOVA，中国厂商拿下大半江山。\n\n图源IDC\n\n以科沃斯和石头科技为例，两家公司的海外收入占比都持续提高，且海外收入增速明显高于国内。\n\n图源公开财报\n\n但有意思的是，虽然两家公司的海外占比都已过半，但利润走向却一个向上、一个向下。\n\n石头科技前三季度实现归母净利润14.66亿元，同比增长41.23%；科沃斯前三季度实现归母净利润13.69亿元，同比下滑3.47%，三季度的归母净利润更同比下滑72.43%。\n\n目前来看，国内主流品牌出海时间不同、落子不同，有人先啃下海外线下渠道，有人靠营销一路高歌猛进，利润分化的答案，就藏在这些差异里。\n\n石头科技的打法是“深扎根、向高端要利润”。\n\n它出海较早，一开始便瞄准欧美成熟市场，用产品力占住高端价位段。2023年，其在美国亚马逊800美元以上价格段份额占比一度高达62%。\n\n此后，石头科技没有将自己绑定在线上渠道，而是积极跟北美Costco、沃尔玛、欧洲MediaMarkt等主流零售体系合作，通过线上+线下双渠道提升品牌高端形象。\n\n正因如此，其才能在今年材料成本普涨的背景下，实现利润逆势增长——高端市场为其贡献了更高的溢价空间；而丰富的渠道布局又避开了亚马逊Prime Day错期的影响。\n\n追觅虽然出海较晚，却更重营销，实现了更快扩展。它在海外市场同时布局室内清洁、个护小家电、大家电等，以多品类矩阵推动业务的爆发式增长。追觅创始人俞浩曾透露，海外市场占总收入80%。\n\n不过，高举高打也有代价。据界面新闻统计，仅2026年前两个月，追觅在春晚、超级碗等渠道的投入预计不低于5亿元。营销能否一直支撑销量增长，仍待时间检验。\n\n科沃斯出海也较晚，一直到今年二季度，其海外业务收入占比才首次超过国内。\n\nCEO钱程选择另辟蹊径，通过布局割草机器人、擦窗机器人、泳池机器人等新兴品类，试图用新场景对冲扫地机的增长天花板。但这些新兴品类的市场规模尚小，公司研发、营销投入却要先行，难免在短期内拖累利润。\n\n今年前三季度，科沃斯的销售费用为41.23亿元，同比增长5.44%，销售费用率约27.51%。虽然公司已在努力降费，但销售费用率仍较石头科技（21.95%）略高。\n\n还有一些品牌已在内卷中大幅滑落。据奥维云网数据，今年9-10月的大促周期，云鲸线上销售额同比下降51%，成为下滑幅度最大的品牌。分析认为其产品更新节奏太慢，错失了全能基站的卡位期；前两年以营销换增长又碰上流量红利退潮，影响了公司的发展节奏。\n\n此外，小米、大疆等跨界玩家趁势崛起，虽然市场份额占比不高，但由于自带品牌流量，依托自身的生态链和渠道进行铺货，成本压力相对更小，出海之路也走得更顺一些。\n\n03 出海未必“一帆风顺”\n\n出海成为必然选择，但并非一路无忧，政策、关税、渠道等每一项的变动，都可能将企业难住。\n\n最大的不确定性来自政策变动。\n\n今年7月，美国联邦通信委员会（FCC）把“外国生产的先进机器人设备”列入受控清单，按照其给出的标准（能自主导航、带传感器、能联网等），部分扫地机将在此列。\n\n除了美国市场，欧洲市场也在增加准入壁垒。2025年11月，欧盟委员会对原产于中国的割草机器人发起反倾销调查，拟征收45.6%-53.3%的反倾销税。\n\n过去，中国厂商依靠成本优势和供应链效率，撬开了海外市场的大门，再加上营销和渠道的一轮猛攻，顺利在海外市场站稳了脚跟。可一旦碰上政策变动的“黑天鹅”，这些招数就仿佛一拳打在了空气里。\n\n更难的挑战在于，海外市场竞争也悄然加速。\n\n表面上看，中国扫地机在全球市场的销量和销额依然双双上涨，但当所有玩家都集体出海，那么海外市场就从蓝海被染成了红海。\n\n据IDC数据，今年二季度传统旺季，全球清洁机器人的出货量增速已有明显下滑。用户需求出现了变化，成本压力还在上涨，中国厂商要在海外挤出更多利润，不能只靠老经验。\n\n图源IDC\n\n首先，要扎根海外市场，不只是把货卖出去。\n\n目前，石头科技、追觅等都已在海外设立生产基地，除此以外，它们的渠道和服务中心也陆续“沉”在海外。\n\n比如石头科技从2023年起，已在美、德、日、韩等地设立多个区域办公室和售后服务中心，还将售后服务做成了长期生意，出售清洁家电的拖布、滤网、尘袋等配件。\n\n图源石头科技官网\n\n其次，要做精细化运营，抓住海外用户痛点。\n\n中国扫地机走向海外，很容易遭遇水土不服。比如国内家庭以硬质地面为主，欧美家庭普遍地毯多、户型大、养宠比例高，这些差异决定了产品定义必须本地化。\n\n因此，石头科技在2023年推出深度清洁地毯模式，会对地毯区域进行二次清扫；追觅的宠物关爱模式已经迭代至5.0，支持宠物巡航看护、识别宠物周边污渍等功能。\n\n图源互联网\n\n最后，聚焦更大的家庭清洁场景。\n\n目前来看，头部玩家基本都在向全场景智能生态跃迁，但厂商布局的品类越多，越需要思考如何围绕场景做深做透，品类之间的技术复用和场景联动，才是这场生态战的胜负手。\n\n以科沃斯为例，旗下地宝、窗宝、割草机器人都由同一个AI系统来操控，它们之间会共享环境感知信息，对地面、立面、室内等区域的全方位打理，通过布局场景收获增量。\n\n04 写在最后\n\n扫地机出海早已不是选择题，而是必答题。追觅创始人俞浩甚至直白地表示，“海外市场的利润占比更高”。\n\n想要拿下“更贵的鱼”，势必也会遭遇“更大的风浪”。中国清洁家电厂商勇闯海外，就要改变姿势，学会跟当地人做生意。\n\n本文为转载内容，授权事宜请联系原著作权人。扫地机器人 全球市场\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n扫地机龙头，集体出海“找利润”\n\n国内下滑，海外淘金。\n\n青橙财经 · 2026/11/19 09:03\n\n图片来源：界面图库\n\n文｜青橙财经 青沐\n\n编辑｜六子\n\n扫地机器人行业，正在迎来新一轮深度大洗牌。\n\n奥维云网数据显示，2026年上 CEO钱程选择另辟蹊径，通过布局割草机器人、擦窗机器人、泳池机器人等新兴品类，试图用新场景对冲扫地机的增长天花板。但这些新兴品类的市场规模尚小，公司研发、营销投入却要先行，难免在短期内拖累利润。\n\n今年前三季度，科沃斯的销售费用为41.23亿元，同比增长5.44%，销售费用率约27.51%。虽然公司已在努力降费，但销售费用率仍较石头科技（21.95%）略高。\n\n还有一些品牌已在内卷中大幅滑落。据奥维云网数据，今年9-10月的大促周期，云鲸线上销售额同比下降51%，成为下滑幅度最大的品牌。分析认为其产品更新节奏太慢，错失了全能基站的卡位期；前两年以营销换增长又碰上流量红利退潮，影响了公司的发展节奏。\n\n此外，小米、大疆等跨界玩家趁势崛起，虽然市场份额占比不高，但由于自带品牌流量，依托自身的生态链和渠道进行铺货，成本压力相对更小，出海之路也走得更顺一些。\n\n03 出海未必“一帆风顺”\n\n出海成为必然选择，但并非一路无忧，政策、关税、渠道等每一项的变动，都可能将企业难住。\n\n最大的不确定性来自政策变动。\n\n今年7月，美国联邦通信委员会（FCC）把“外国生产的先进机器人设备”列入受控清单，按照其给出的标准（能自主导航、带传感器、能联网等），部分扫地机将在此列。\n\n除了美国市场，欧洲市场也在增加准入壁垒。2025年11月，欧盟委员会对原产于中国的割草机器人发起反倾销调查，拟征收45.6%-53.3%的反倾销税。\n\n过去，中国厂商依靠成本优势和供应链效率，撬开了海外市场的大门，再加上营销和渠道的一轮猛攻，顺利在海外市场站稳了脚跟。可一旦碰上政策变动的“黑天鹅”，这些招数就仿佛一拳打在了空气里。\n\n更难的挑战在于，海外市场竞争也悄然加速。\n\n表面上看，中国扫地机在全球市场的销量和销额依然双双上涨，但当所有玩家都集体出海，那么海外市场就从蓝海被染成了红海。\n\n据IDC数据，今年二季度传统旺季，全球清洁机器人的出货量增速已有明显下滑。用户需求出现了变化，成本压力还在上涨，中国厂商要在海外挤出更多利润，不能只靠老经验。\n\n图源IDC\n\n首先，要扎根海外市场，不只是把货卖出去。\n\n目前，石头科技、追觅等都已在海外设立生产基地，除此以外，它们的渠道和服务中心也陆续“沉”在海外。\n\n比如石头科技从2023年起，已在美、德、日、韩等地设立多个区域办公室和售后服务中心，还将售后服务做成了长期生意，出售清洁家电的拖布、滤网、尘袋等配件。\n\n图源石头科技官网\n\n其次，要做精细化运营，抓住海外用户痛点。\n\n中国扫地机走向海外，很容易遭遇水土不服。比如国内家庭以硬质地面为主，欧美家庭普遍地毯多、户型大、养宠比例高，这些差异决定了产品定义必须本地化。\n\n因此，石头科技在2023年推出深度清洁地毯模式，会对地毯区域进行二次清扫；追觅的宠物关爱模式已经迭代至5.0，支持宠物巡航看护、识别宠物周边污渍等功能。\n\n图源互联网\n\n最后，聚焦更大的家庭清洁场景。\n\n目前来看，头部玩家基本都在向全场景智能生态跃迁，但厂商布局的品类越多，越需要思考如何围绕场景做深做透，品类之间的技术复用和场景联动，才是这场生态战的胜负手。\n\n以科沃斯为例，旗下地宝、窗宝、割草机器人都由同一个AI系统来操控，它们之间会共享环境感知信息，对地面、立面、室内等区域的全方位打理，通过布局场景收获增量。\n\n04 写在最后\n\n扫地机出海早已不是选择题，而是必答题。追觅创始人俞浩甚至直白地表示，“海外市场的利润占比更高”。\n\n想要拿下“更贵的鱼”，势必也会遭遇“更大的风浪”。中国清洁家电厂商勇闯海外，就要改变姿势，学会跟当地人做生意。\n\n本文为转载内容，授权事宜请联系原著作权人。",

          "body": "界面新闻记者 | 黄华\n界面新闻编辑 | 谢欣\n\n11月初，上海市卫生健康委、上上海市医保局等共同启动“医疗健康数据融合开发利用工作专班”，专班将响应国家数据局医疗健康行业数据资源开发利用攻坚行动，承担推进全市卫生健康数据的制度建设、融合开发、场景创新、市场运营等任务，更好释放医疗数据要素价值。\n\n此前在今年7月，《上海市卫生健康发展\"十五五\"规划》提出，到2030年，\"人工智能+卫生健康\"应用场景要在全市医疗机构实现100%覆盖。\n\n这是上海对于人工智能在医疗领域的最新规划，在一系列政策加持下，人工智能技术在上海医院的应用速度正在加速。\n\n界面新闻梳理发现，包括国家人工智能应用中试基地携手联影智能研发出全球首创的“胸部一扫多查智能体”，同济大学附属东方医院牵头研发的Med-Go医疗大模型等、上海交通大学医学院附属新华医院、海军军医大学第一附属医院以及辽宁沈阳的中国医科大学附属盛京医院，与达摩院合作研发的基于CT影像的人工智能肠癌筛查模型DAMO COCA 2.0已各自在多家上海医院落地部署。\n\n据不完全统计，截至今年年初，上海已完成医疗大模型登记20款，多家三甲医院大模型上线。\n\n政策出台至今，阶段性成果已初步显现。上海医疗机构对于人工智能的探索已经开始改写一个个具体病例的走向。48岁的陈彤（化名），就是受益者之一。在一次意外车祸后，他意外被筛查出结直肠癌。提示这一风险的，是一套人工智能系统。\n\n陈彤是一名AI电气工程师。今年6月28日，他骑电动车出门时被一辆汽车撞倒，随后被就近送至上海交通大学医学院附属新华医院（下称\"新华医院\"）。由于担心肋骨骨折，他接受了胸部CT等检查——骨折没有，肠道更不是这次检查的目标，但正是这张\"看骨头\"的CT，让他此后的人生拐了个弯。\n\n7月28日上午，陈彤接到新华医院结直肠肛门外科副主任医师吴庭玉的电话，被建议到肛肠科就诊。原因是，AI在他此前的CT影像中发现了异常。\n\n陈彤对界面新闻回忆，刚接到电话时，他一度怀疑遭遇诈骗。但自己通过新华医院的网站核实清楚吴庭玉医生的身份后，加上自己平时关注科技和人工智能，他才决定到医院复查。此后他经肠镜确诊为结直肠癌。其病理结果显示为中低分化肿瘤，恶性程度较高，但尚属中早期，没有发生转移。目前，陈彤已接受手术切除，仍在接受辅助化疗等后续治疗。\n\n界面新闻记者拍摄于新华医院\r\n\n假如没有AI，陈彤会经历什么？这是一次无法真实复盘的推演，但可以从临床数据中寻找参照。\n\n陈彤的肿瘤是中低分化型，恶性程度高、进展快；他本人在此之前没有任何症状，也没有任何在近期主动做一次肠道检查的计划。换句话说，如果没有那场车祸，没有那张恰好扫过部分横结肠的CT，没有AI的标注和医生的复核，他的第一次肠道检查，大概率要等到症状出现的那一天，后果可能会不堪想象。\n\n对结直肠癌而言，这一天往往来得太晚了。结直肠癌早期几乎没有特异症状——便血容易被当成痔疮，腹泻便秘容易被当作小毛病，等梗阻、消瘦、贫血出现时，病程往往已进入中晚期。\n\n国内相关调查显示，超过八成的结直肠癌患者首次确诊时已处于中晚期。据国家癌症中心统计数据，I期患者的5年生存率为92.8%，IV期则跌至18.3%。早期与晚期之间，隔着近五倍的生存几率，也隔着完全不同的治疗方式、治疗费用和生存质量。\n\n从这个角度看，那通被陈彤误以为是诈骗电话的来电，恰是他人生中分量很重的一通电话。\n\n但假如一个普通人始终不做肠镜又会如何？\n\n陈彤并不讳疾忌医，但即便是他，如果不是AI和医生主动找上门，也不会想到去做一次肠镜。这正是结直肠癌筛查在中国面临的普遍困境。\n\n肠镜是肠癌筛查的\"金标准\"，写进诊疗规范多年，但它的门槛也是真实的——检查前要服用泻药、进行肠道准备，检查过程中可能出现不适，还要请假、陪护、承担对\"没问题白受一趟罪\"的心理预期。\n\n吴庭玉在接受界面新闻采访时表示，这些原因让一些患者不愿接受肠镜，影响了筛查普及；社区粪便隐血筛查虽相对简便，但准确性有限，结果为阳性者仍需通过肠镜进一步确认。\n\n但现实是，肠癌并不给\"再等等\"的人留太多余地。从息肉发展为癌，通常需要5到10年——这既是坏消息，也是好消息。窗口期足够长，长到一次肠镜就足以在癌变之前摘除隐患。\n\n国内调查数据显示，约97%的结直肠癌患者在确诊前从未做过肠镜筛查，其中86.5%的人是因为不知道需要定期做。也就是说，拖垮筛查率的，除了恐惧，还有筛查意识的欠缺。\n\n医生吴庭玉工作照\r\n\n代价同样可以用数据衡量。欧洲一项纳入超10万患者的大型研究显示：通过筛查检出的结直肠癌大多为I-II期，而非筛查途径发现的病例，过半已是III-IV期。\n\n同样是结直肠癌，被筛查出来和被症状逼出来，对应的已是两种截然不同的生存结局。统计数据提示，2022年中国新发结直肠癌51.71万例，死亡24万例——这意味着，绝大多数人都是出现症状才走进医院的人。\n\n针对肠镜筛查的困境，达摩院联合新华医院、长海医院、盛京医院合作研发了基于CT影像的人工智能肠癌筛查模型DAMO COCA2.0，探索一种不需要额外肠道准备的筛查方式。\n\n其核心思路是机会性筛查：患者因体检、结石、外伤等原因接受CT检查时，由AI分析影像，寻找肠道病变的迹象。它的目的不是替代肠镜，而是先从既有影像中找出可能被忽视的高风险患者，再由医生复核，并通过肠镜确诊。\n\n陈彤的经历正是这一流程下的个案。他因车祸拍的胸部CT恰好覆盖了部分横结肠，AI标注该区域异常后，医生复核并决定召回患者，最终通过肠镜确诊。\n\n一场车祸、一张为别的目的拍的CT、一套人工智能系统——三个偶然叠在一起，让一个本可能被漏诊的患者，被提前截住了。\n\n\"AI筛查的价值，是帮助医生发现传统手段下可能被漏诊的患者。\"吴庭玉说。在这一流程中，AI只负责提示异常并勾画可疑位置，医生负责复核与召回，最终诊断仍依赖肠镜和病理——不是由AI单独作出。\n\n研发并非一蹴而就。据吴庭玉介绍，新华医院提供了约3万例CT病例，由影像科和临床医生逐层标注肿瘤的位置和形态用于模型训练；加上长海医院、盛京医院等合作机构，模型累计学习了数十万例病例，并通过回顾性和前瞻性研究持续验证、调整。\n\n需要明确的是，这一模型尚未在新华医院正式临床部署，仍处于科研和前瞻性验证阶段。\n\n吴庭玉告诉界面新闻，模型的下一步是提升敏感性和特异性：前者决定能否尽量发现真正的患者，后者决定能否减少把正常人误判为高风险——漏诊可能延误治疗，过多假阳性则会带来不必要的召回、肠镜检查和患者焦虑。\n\n他认为，此类软件未来在基层医院可能更有价值，因为部署软件比添置CT设备、建设内镜中心更容易，但前提是产品获批、准确性得到验证，且医院具备后续确诊能力。\n\n将视野放宽，AI参与医学影像判断并非新事物，但此前获批产品更多集中于辅助诊断，如眼底疾病和冠脉狭窄等，而非癌症机会性筛查。\n\n近年来，一些团队开始尝试利用患者已完成的平扫CT开展癌症机会性筛查，希望在不增加扫描的情况下，从既有影像中寻找新的疾病线索。另如中山医院与联影智能合作的胸部一扫多查智能体已进入全国近30家医院、累计处理病例超过250万例，但其侧重多病种辅助诊断和报告生成，与癌症早筛并不完全相同。目前，多数此类项目仍处于论文验证、科研合作或真实世界试点阶段。\n\n这些探索共同显示一种趋势——AI正在从识别明确的单一病灶，转向在常规检查中寻找未被注意的疾病线索。但从尝试发现到成为常规临床工具，仍需回答一系列问题：准确性能否经得起验证，产品能否获批并嵌入诊疗流程等。\n\n未经正式授权严禁转载本文，侵权必究。健康面\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\nAI医疗诊断正在上海加速落地\n\n在一场车祸后的CT检查中，AI意外发现了肠癌线索，帮助一位患者及早确诊。这正是上海对于医学AI一系列支持下的阶段性成果案例。\n\n原创新闻黄华HH · 2026/11/19 09:00来源：界面新闻\n\n图片来源：界面图库\n\n界面新闻记者 | 黄华\n界面新闻编辑 | 谢欣\n\n11月初，上海市卫生健康委、上上海市医保局等共同启动“医疗健康数据融合开发利用工作专班”，专班将响应国家数据局医疗健康行业数据资源开发利用攻坚行动，承担推进全市卫生健康数据的制度建设、融合开发、场景创新、市场运营等任务，更好释放医疗数据要素价值。\n\n此前在今年7月，《上海市卫生健康发展\"十五五\"规划》提出，到2030年，\"人工智能+卫生健康\"应用场景要在全市医疗机构实现100%覆盖。\n\n这是上海对于人工智能在医疗领域的最新规划，在一系列政策加持下，人工智能技术在上海医院的应用速度正在加速。\n\n界面新闻梳理发现，包括国家人工智能应用中试基地携手联影智能研发出全球首创的“胸部一扫多查智能体”，同济大学附属东方医院牵头研发的Med-Go医疗大模型等、上海交通大学医学院附属新华医院、海军军医大学第一附属医院以及辽宁沈阳的中国医科大学附属盛京医院，与达摩院合作研发的基于CT影           "body": "文｜创业最前线 胡芳洁\n\n编辑｜蛋总\n\n“娇韵诗黄金双萃精华挺好用的，虽然是精华油，但是一点也不黏腻，晚上用，早晨起来感觉脸上皮肤亮了很多，抗氧化效果比较明显。”消费者孙颖（化名）对「创业最前线」表示。\n\n不过，她最近几年都没复购娇韵诗的产品，一方面是因为她现在主要在线上购买化妆品，相对于其他头部大牌，娇韵诗的推广似乎比较少，可选品牌多、大促活动也多，很难想起来去买娇韵诗；另一方面，娇韵诗核心抗老产品相对比较少。\n\n这一情况并不是特例。\n\n相对于兰蔻、雅诗兰黛、赫莲娜、海蓝之谜等高端护肤品牌广泛的大众认知度，娇韵诗呈现出明显的两极分化，既有“死忠粉”，也有不少人觉得是冷门品牌甚至没听过。\n\n今年双11，娇韵诗在天猫美妆榜单排第11位，在抖音双11护肤榜单排第14位（来自青眼数据），均没有进入前十。\n\n图 / 天猫、青眼（抖音双11周期为10月15日—11月11日）\n\n早在今年8月，娇韵诗官宣章子怡出任品牌高端奢护线至臻凝时（月光宝瓶）系列全球代言人。延续品牌不事张扬的风格，这次官宣也没有铺开刷屏式流量宣传，以至于不少人后知后觉章子怡代言了娇韵诗。\n\n而她代言的至臻凝时（月光宝瓶）系列，恰恰是娇韵诗在抗老领域围绕“肌肤长寿科学”展开叙事的核心载体。\n\n在社交平台的抗老面霜盘点中，月光宝瓶虽然偶有出现在对比清单中，但声量始终不突出。靠它，娇韵诗能讲好科技抗老新故事吗？\n\n01 用植物精油对战大牌\n\n“在整个化妆品行业里，娇韵诗是比较低调的。现在很多大牌都属于集团公司，但娇韵诗是家族企业，保证产品的‘鲜活’、安全更重要。”北京某娇韵诗专柜导购告诉「创业最前线」。\n\n她进一步表示，无论是海蓝之谜也好，兰蔻也好，都是非常不错的大牌，但娇韵诗的优势在于，它是“独一份”的纯植物护肤品牌，敏感肌、孕妇也适用。\n\n实际上，娇韵诗在国际美妆集团中一直是一个异数。\n\n它不仅坚持天然植物成分，还坚持家族控股，所有的产品几乎都在法国进行设计和制造，产品出口全球，却始终没有把品牌卖给任何一家巨头。\n\n2022年，娇韵诗录得约17.5亿欧元销售额，在欧洲高端护肤市场占据领先位置。Courtin-Clarins家族至今持有品牌100%的股权，第二、第三代成员仍在参与公司治理。\n\n品牌的起点与植物紧密相连。创始人贾克·古登（Jacques Courtin-Clarins）本是一名医学生，二战中断学业后，在从事理疗、为病人按摩的过程中，注意到植物成分对皮肤的特殊作用。\n\n1954年3月，他在法国巴黎开设了第一家娇韵诗美容中心，用自己调配的植物精油为客户做按摩，在合成化学产品兴起的年代走出了一条相反的路，也就此奠定了品牌植物成分护肤、追求身心平衡与产品安全的底色。\n\n真正为娇韵诗带来长期增长引擎的，是1985年推出的黄金双萃精华。这款将水溶性与脂溶性成分分离包装的抗老精华，在此后四十多年里成为品牌最核心的“现金牛”，并进一步巩固品牌在美妆市场的影响力。\n\n图 / 天猫\n\n据魔镜及国泰君安数据，2021年和2022年，双萃精华占品牌淘系销售额的比例超过40%。一个单品撑起线上近半壁江山，既证明了产品生命力，也暴露了结构性的问题，当双萃的增速放缓或口碑波动，品牌缺少足够厚实的第二梯队来承接。\n\n走高端化路线、向肌肤长寿科学领域进发，是娇韵诗当前给出的应对策略。首发于2023年的至臻凝时系列被定位为品牌顶级的奢护线，主推面霜售价在2600元左右/50ml。\n\n它的叙事不再停留在植物萃取、天然温和的层面，而是直接进入了“长寿科学”的语境，其核心成分取自仅在月夜短暂开放的“月神花”（大花仙人掌花），以-196°C超低温萃取保留活性，宣称能够激活肌肤底层的长寿蛋白FOXO，进而促进胶原蛋白再生。\n\n从植物精油到长寿蛋白，娇韵诗试图完成一次从天然到科技的信任迁移。但这两套语言之间的接缝，比品牌预想的要宽。\n\n植物精油注重天然、安全、感受与仪式感，长寿科学讲的是机制、靶点与临床数据。前者是娇韵诗最擅长的语言，后者是当下高端护肤比拼最激烈的领域。欧莱雅2025年专门发布肌肤整合长寿科学，雅诗兰黛和资生堂也各有布局，这条赛道已经站满巨头。\n\n如果说植物萃取成分护肤的故事里，娇韵诗依然以差异化优势和精细化运营，在巨头林立的国际美妆市场稳住了话语权，那么在长寿科学的语境下，局面似乎开始松动了。\n\n02 双萃宇宙的外扩，与长寿科学叙事的裂缝\n\n实际上，作为娇韵诗核心品牌资产，双萃精华销售份额占比达到一定高度后，主动消解其强势地位，延展新增量和新品类的可能性，变得更加重要起来。\n\n2024年第九代黄金双萃面市前一年，娇韵诗在2023年推出了一条全新的双萃产品线——油皮双萃。\n\n这是一款油皮专研的抗老精华，娇韵诗对外宣传口径为“0油感”，专研7:3水油比，相对于经典双萃精华2:1的水油比进行了大幅调整。\n\n而到了2025年，第二代油皮双萃上市，这一版本采取了更高浓度的水飞蓟精粹来强化油脂调节能力。\n\n除了双萃精华自身的分型外，娇韵诗还围绕双萃这一核心概念，向外延伸出了双萃眼霜和双萃精华粉底液等，试图把水油双相的配方逻辑复制到更多品类中，从而构建出品牌独有的“双萃宇宙”。\n\n但品类扩张的代价正在显现。\n\n双萃眼霜在社交平台上的争议，比较集中的有泵头设计问题，有用户反馈按压仅出油无法挤出霜体、控制不好量等，品控稳定性受到质疑。此外，还有功效感知模糊、拔干等评价。不过，也有用户肯定其眼周暗沉淡化、不黏腻等优点。\n\n图 / 小红书\n\n而双萃精华粉底液的问题则更为明显。\n\n双舱设计需要把精华与粉底在挤出后手动混合，但两部分内容物配比在手动按压中保持稳定存在不确定性，直接影响妆效的一致性。此外，油相占比偏高还可能加剧粉底的氧化暗沉，对于彩妆产品而言，精华与粉底液的双舱设计究竟是不是形式大于内容，依然值得进一步追问。\n\n当一个品牌的创新高度依赖已有产品概念或配方逻辑，在新的场景下，每一次复制都有可能把风险同步放大。\n\n在“双萃宇宙”承压的同时，娇韵诗已经在拓展新的故事节奏，而这一次是“长寿科学”。\n\n早在2023年3月，娇韵诗在上海全球首发全新至臻凝时系列，包括精华水、面霜、眼霜等，该系列以月神花精萃为核心成分。\n\n据品牌宣称，月神花每年只在月圆之夜绽放一次，具有促进肌肤长寿的功效。原料经体外测试显示，其可使长寿蛋白FOXO蛋白活性提升33%。（编者按：该结论来自体外实验，不等同于人体皮肤实际使用效果。）\n\n图 / 天猫\n\n可以看到，相对于欧莱雅在2025年提出肌肤长寿科学概念并在2026年密集落地相关产品、雅诗兰黛于2023年底上市包含细胞再生修护成分色提因的冻龄白金系列，娇韵诗的行动更早。\n\n但遗憾的是，产品落地早，但推进并不顺利。\n\n2025年8月，一则由美妆科普博主发布的关于娇韵诗月光宝瓶面霜功效靶点宣称争议的小红书笔记，在社交媒体引发热议。\n\n在这则笔记中，该博主提出质疑，认为在皮肤创伤（如医美伤口、长痘破皮等）环境下FOXO蛋白或将引发疤痕增生，而品牌在宣传中未充分提示这一潜在风险等。而这一质疑的关键依据，来自一篇发表于《The American Journal of Pathology》的研究。\n\n图 / PubMed\n\n事件发生以后，引发知乎等平台上的诸多讨论以及相关媒体采访和报道。\n\n在这个过程中，也有其他专业人士对此提出不同看法，认为这项2014年的研究主要揭示的是相关性，且实验条件与化妆品日常使用场景存在差异，不能直接等同于使用面霜就会导致疤痕。\n\n整个事件中，娇韵诗并没有对此进行过任何官方回应。对此争议事件，「创业最前线」致函娇韵诗公司，但截至发稿前尚未获得回复。\n\n长寿蛋白FOXO所带来的争议并没有直接导致娇韵诗的品牌形象和销量出现“崩塌迹象”，但或许在其最核心资产“科学信誉”上划下了一道口子，让外界开始审视其从植萃向分子科学转型过程中的证据链完整度。\n\n当一个以植物成分叙事建立信任的品牌，转身用靶点、基因、体外数据来论证高端产品的合理性时，它进入的是一个由消费者、专业博主、媒体等共同审视且举证标准远比天然温和严苛得多的赛场。\n\n在这个赛场里，任何科学修辞，几乎必然会遭到反向审视。\n\n03 精华品类渠道分化，高端系列转化偏弱\n\n尽管面临多重挑战，娇韵诗在中国的基本盘依然可观。\n\n根据品观引用林清轩招股书的数据，2024年娇韵诗以43.8亿元零售额位居中国高端护肤品牌第6位，超过修丽可和资生堂。但与年销70亿元以上的第一梯队之间，仍隔着一道尚未跨越的规模鸿沟。\n\n在淘天平台的面部精华品类中，娇韵诗2025年1-9月以14.8亿元销售额、9.0%的市占率排在首位，同比增长31.1%。双萃精华积累多年的品牌资产，在淘宝这一品牌力+功效背书驱动的场域里，仍然具备可观的转化效率。\n\n图 / 2025年1-9月淘宝、抖音面部精华市场份额，知行战略咨询\n\n但平台之间的逻辑正在剧烈分化，同一个面部精华品类，娇韵诗同期在抖音的销售额下滑高达25.5%。品牌正在流失关键的内容电商平台的市场份额。\n\n这并非孤例。雅诗兰黛同期下滑39.6%，SK-II下滑38.7%，国际高端品牌在抖音普遍承压，而韩束、谷雨等国货品牌以更适配内容电商的节奏和价格快速起量。娇韵诗在淘宝享有的品牌势能，在抖音并没有被等比例兑换。\n\n线下同样也面临收缩压力。2026年7月，北京合生汇娇韵诗门店向会员发布闭店通知，原址由某身体护理品牌接手。\n\n更值得关注的还有高端产品线与电商渠道的错位。在今年10月中旬，「创业最前线」在天猫旗舰店并没有搜索到至臻凝时（月光宝瓶）系列产品，而11月，该产品已出现在店铺的综合推荐页面，但成交数据依然单薄，月光宝瓶面霜和精华水，成交量均只有900+。\n\n一个承载“长寿科学”叙事的高端系列推出后，在品牌最核心的线上成交场域中却难被消费者顺畅地发现、购买，在电商上的转化表现仍偏弱，这足以引发重视。章子怡的代言或许可以强化产品所需要的形象高度，但后续的市场认知、交易闭环，依然是突围的关键。\n\n植物护肤品牌能讲好“长寿科学”吗？理论上答案是肯定的。植物化学本身并不缺乏分子层面的解释空间，问题在于品牌选择用什么样的方式去讲。\n\n如果“长寿蛋白”的选择和作用机理，在专业研究中仍有讨论空间，支撑数据却主要来自成分表第41位原料的体外实验，品牌宣称与证据强度之间的落差，消费者终会用自己的方式做出判断。\n\n这家公司七十多年的发展底气，来自不上市、不外包、专注产品的克制。当天然不再是稀缺标签，长寿又需要硬证据，突破舒适区的娇韵诗最终要回答的，是如何把植萃护肤领域积累的壁垒，在“长寿科学”领域重建为可验证、逻辑自洽的系统化竞争力。\n\n本文为转载内容，授权事宜请联系原著作权人。娇韵诗 美容护肤\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n植萃老牌入局“长寿科学”，娇韵诗能否自圆其说？\n\n在“双萃宇宙”承压的同时，娇韵诗已经在拓展新的故事节奏，而这一次是“长寿科学”。\n\n创业最前线 · 2026/11/19 08:59\n\n图片来源：界面图库\n\n文｜创业最前线 胡芳洁\n\n编辑｜蛋总\n\n“娇韵诗黄金双萃精华挺好用的，虽然是精华油，但是一点也不黏腻，晚上用，早晨起来感觉脸上皮肤亮了很多，抗氧化效果比较明显。”消费者孙颖（化名）对「创业最前线」表示。\n\n不过，她最近几年都没复购娇韵诗的产品，一方面是因为她现在主要在线上购买化妆品，相对于其他头部大牌，娇韵诗的推广似乎比较少，可选品牌多、大促活动也多，很难想起来去买娇韵诗；另一方面，娇韵诗核心抗老产品相对比较少。\n\n这一情况并不是特例。\n\n相对于兰蔻、雅诗兰黛、赫莲娜、海蓝之谜等高端护肤品牌广泛的大众认知度，娇韵诗呈现出明显的两极分化，既有“死忠粉”，也有不少人觉得是冷门品牌甚至没听过。\n\n今年双11，娇韵诗在天猫美妆榜单排第11位，在抖音双11护肤榜单排第14位（来自青眼数据），均没有进入前十。\n\n图 / 天猫、青眼（抖音双11周期为10月15日—11月11日）\n\n早在今年8月，娇韵诗官宣章子怡出任品牌高端奢护线至臻凝时（月光宝瓶）系列全球代言人。延续品牌不事张扬的风格，这次官宣也没有铺开刷屏式流量宣传，以至于不少人后知后觉章子怡代言了娇韵诗。\n\n而她代言的至臻凝时（月光宝瓶）系列，恰恰是娇韵诗在抗老领域围绕“肌肤长寿科学”展开叙事的核心载体。\n\n在社交平台的抗老面霜盘点中，月光宝瓶虽然偶有出现在对比清单中，但声量始终不突出。靠它，娇韵诗能讲好科技抗老新故事吗？\n\n01 用植物精油对战大牌\n\n“在整个化妆品行业里，娇韵诗是比较低调的。现在很多大牌都属于集团公司，但娇韵诗是家族企业，保证产品的‘鲜活’、安全更重要。”北京某娇韵诗专柜导购告诉「创业最前线」。\n\n她进一步表示，无论是海蓝之谜也好，兰蔻也好，都是非常不错的大牌，但娇韵诗的优势在于，它是“独一份”的纯植物护肤品牌，敏感肌、孕妇也适用。\n\n实际上，娇韵诗在国际美妆集团中一直是一个异数。\n\n它不仅坚持天然植物成分，还坚持家族控股，所有的产品几乎都在法国进行设计和制造，产品出口全球，却始终没有把品牌卖给任何一家巨头。\n\n2022年，娇韵诗录得约17.5亿欧元销售额，在欧洲高端护肤市场占据领先位置。Courtin-Clarins家族至今持有品牌100%的股权，第二、第三代成员仍在参与公司治理。\n\n品牌的起点与植物紧密相连。创始人贾克·古登（Jacques Courtin-Clarins）本是一名医学生，二战中断学业后，在从事理疗、为病人按摩的过程中，注意到植物成分对皮肤的特殊作用。\n\n1954年3月，他在法国巴黎开设了第一家娇韵诗美容中心，用自己调配的植物精油为客户做按摩，在合成化学产品兴起的年代走出了一条相反的路，也就此奠定了品牌植物成分护肤、追求身心平衡与产品安全的底色。\n\n真正为娇韵诗带来长期增长引擎的，是1985年推出的黄金双萃精华。这款将水溶性与脂溶性成分分离包装的抗老精华，在此后四十多年里成为品牌最核心的“现金牛”，并进一步巩固品牌在美妆市场的影响力。\n\n图 / 天猫\n\n据魔镜及国泰君安数据，2021年和2022年，双萃精华占品牌淘系销售额的比例超过40%。一个单品撑起线上近半壁江山，既证明了产品生命力，也暴露了结构性的问题，当双萃的增速放缓或口碑波动，品牌缺少足够厚实的第二梯队来承接。\n\n走高端化路线、向肌肤长寿科学领域进发，是娇韵诗当前给出的应对策略。首发于2023年的至臻凝时系列被定位为品牌顶级的奢护线，主推面霜售价在2600元左右/50ml。\n\n它的叙事不再停留在植物萃取、天然温和的层面，而是直接进入了“长寿科学”的语境，其核心成分取自仅在月夜短暂开放的“月神花”（大花仙人掌花），以-196°C超低温萃取保留活性，宣称能够激活肌肤底层的长寿蛋白FOXO，进而促进胶原蛋白再生。\n\n从植物精油到长寿蛋白，娇韵诗试图完成一次从天然到科技的信任迁移。但这两套语言之间的接缝，比品牌预想的要宽。\n\n植物精油注重天然、安全、感受与仪式感，长寿科学讲的是机制、靶点与临床数据。前者是娇韵诗最擅长的语言，后者是当下高端护肤比拼最激烈的领域。欧莱雅2025年专门发布肌肤整合长寿科学，雅诗兰黛和资生堂也各有布局，这条赛道已经站满巨头。\n\n如果说植物萃取成分护肤的故事里，娇韵诗依然以差异化优势和精细化运营，在巨头林立的国际美妆市场稳住了话语权，那么在长寿科学的语境下，局面似乎开始松动了。\n\n02 双萃宇宙的外扩，与长寿科学叙事的裂缝\n\n实际上，作为娇韵诗核心品牌资产，双萃精华销售份额占比达到一定高度后，主动消解其强势地位，延展新增量和新品类的可能性，变得更加重要起来。\n\n2024年第九代黄金双萃面市前一年，娇韵诗在2023年推出了一条全新的双萃产品线——油皮双萃。\n\n这是一款油皮专研的抗老精华，娇韵诗对外宣传口径为“0油感”，专研7:3水油比，相对于经典双萃精华2:1的水油比进行了大幅调整。\n\n而到了2025年，第二代油皮双萃上市，这一版本采取了更高浓度的水飞蓟精粹来强化油脂调节能力。\n\n除了双萃精华自身的分型外，娇韵诗还围绕双萃这一核心概念，向外延伸出了双萃眼霜和双萃精华粉底液等，试图把水油双相的配方逻辑复制到更多品类中，从而构建出品牌独有的“双萃宇宙”。\n\n但品类扩张的代价正在显现。\n\n双萃眼霜在社交平台上的争议，比较集中的有泵头设计问题，有用户反馈按压仅出油无法挤出霜体、控制不好量等，品控稳定性受到质疑。此外，还有功效感知模糊、拔干等评价。不过，也有用户肯定其眼周暗沉淡化、不黏腻等优点。\n\n图 / 小红书\n\n而双萃精华粉底液的问题则更为明显。\n\n双舱设计需要把精华与粉底在挤出后手动混合，但两部分内容物配比在手动按压中保持稳定存在不确定性，直接影响妆效的一致性。此外，油相占比偏高还可能加剧粉底的氧化暗沉，对于彩妆产品而言，精华与粉底液的双舱设计究竟是不是形式大于内容，依然值得进一步追问。\n\n当一个品牌的创新高度依赖已有产品概念或配方逻辑，在新的场景下，每一次复制都有可能把风险同步放大。\n\n在“双萃宇宙”承压的同时，娇韵诗已经在拓展新的故事节奏，而这一次是“长寿科学”。\n\n早在2023年3月，娇韵诗在上海全球首发全新至臻凝时系列，包括精华水、面霜、眼霜等，该系列以月神花精萃为核心成分。\n\n据品牌宣称，月神花每年只在月圆之夜绽放一次，具有促进肌肤长寿的功效。原料经体外测试显示，其可使长寿蛋白FOXO蛋白活性提升33%。（编者按：该结论来自体外实验，不等同于人体皮肤实际使用效果。）\n\n图 / 天猫\n\n可以看到，相对于欧莱雅在2025年提出肌肤长寿科学概念并在2026年密集落地相关产品、雅诗兰黛于2023年底上市包含细胞再生修护成分色提因的冻龄白金系列，娇韵诗的行动更早。\n\n但遗憾的是，产品落地早，但推进并不顺利。\n\n2025年8月，一则由美妆科普博主发布的关于娇韵诗月光宝瓶面霜功效靶点宣称争议的小红书笔记，在社交媒体引发热议。\n\n在这则笔记中，该博主提出质疑，认为在皮肤创伤（如医美伤口、长痘破皮等）环境下FOXO蛋白或将引发疤痕增生，而品牌在宣传中未充分提示这一潜在风险等。而这一质疑的关键依据，来自一篇发表于《The American Journal of Pathology》的研究。\n\n图 / PubMed\n\n事件发生以后，引发知乎等平台上的诸多讨论以及相关媒体采访和报道。\n\n在这个过程中，也有其他专业人士对此提出不同看法，认为这项2014年的研究主要揭示的是相关性，且实验条件与化妆品日常使用场景存在差异，不能直接等同于使用面霜就会导致疤痕。\n\n整个事件中，娇韵诗并没有对此进行过任何官方回应。对此争议事件，「创业最前线」致函娇韵诗公司，但截至发稿前尚未获得回复。\n\n长寿蛋白FOXO所带来的争议并没有直接导致娇韵诗的品牌形象和销量出现“崩塌迹象”，但或许在其最核心资产“科学信誉”上划下了一道口子，让外界开始审视其从植萃向分子科学转型过程中的证据链完整度。\n\n当一个以植物成分叙事建立信任的品牌，转身用靶点、基因、体外数据来论证高端产品的合理性时，它进入的是一个由消费者、专业博主、媒体等共同审视且举证标准远比天然温和严苛得多的赛场。\n\n在这个赛场里，任何科学修辞，几乎必然会遭到反向审视。\n\n03 精华品类渠道分化，高端系列转化偏弱\n\n尽管面临多重挑战，娇韵诗在中国的基本盘依然可观。\n\n根据品观引用林清轩招股书的数据，2024年娇韵诗以43.8亿元零售额位居中国高端护肤品牌第6位，超过修丽可和资生堂。但与年销70亿元以上的第一梯队之间，仍隔着一道尚未跨越的规模鸿沟。\n\n在淘天平台的面部精华品类中，娇韵诗2025年1-9月以14.8亿元销售额、9.0%的市占率排在首位，同比增长31.1%。双萃精华积累多年的品牌资产，在淘宝这一品牌力+功效背书驱动的场域里，仍然具备可观的转化效率。\n\n图 / 2025年1-9月淘宝、抖音面部精华市场份额，知行战略咨询\n\n但平台之间的逻辑正在剧烈分化，同一个面部精华品类，娇韵诗同期在抖音的销售额下滑高达25.5%。品牌正在流失关键的内容电商平台的市场份额。\n\n这并非孤例。雅诗兰黛同期下滑39.6%，SK-II下滑38.7%，国际高端品牌在抖音普遍承压，而韩束、谷雨等国货品牌以更适配内容电商的节奏和价格快速起量。娇韵诗在淘宝享有的品牌势能，在抖音并没有被等比例兑换。\n\n线下同样也面临收缩压力。2026年7月，北京合生汇娇韵诗门店向会员发布闭店通知，原址由某身体护理品牌接手。\n\n更值得关注的还有高端产品线与电商渠道的错位。在今年10月中旬，「创业最前线」在天猫旗舰店并没有搜索到至臻凝时（月光宝瓶）系列产品，而11月，该产品已出现在店铺的综合推荐页面，但成交数据依然单薄，月光宝瓶面霜和精华水，成交量均只有900+。\n\n一个承载“长寿科学”叙事的高端系列推出后，在品牌最核心的线上成交场域中却难被消费者顺畅地发现、购买，在电商上的转化表现仍偏弱，这足以引发重视。章子怡的代言或许可以强化产品所需要的形象高度，但后续的市场认知、交易闭环，依然是突围的关键。\n\n植物护肤品牌能讲好“长寿科学”吗？理论上答案是肯定的。植物化学本身并不缺乏分子层面的解释空间，问题在于品牌选择用什么样的方式去讲。\n\n如果“长寿蛋白”的选择和作用机理，在专业研究中仍有讨论空间，支撑数据却主要来自成分表第41位原料的体外实验，品牌宣称与证据强度之间的落差，消费者终会用自己的方式做出判断。\n\n这家公司七十多年的发展底气，来自不上市、不外包、专注产品的克制。当天然不再是稀缺标签，长寿又需要硬证据，突破舒适区的娇韵诗最终要回答的，是如何把植萃护肤领域积累的壁垒，在“长寿科学”领域重建为可验证、逻辑自洽的系统化竞争力。\n\n本文为转载内容，授权事宜请联系原著作权人。",

          "body": "文｜Tech商业 定一 博文 \n\n本周，字节跳动豆包工作上线“工作台”功能，首批覆盖金融、医疗、教育、创意设计等21个专业场景，把常用技能、插件和职业要求预先配置在同一个空间里。表面上看，这是一次产品功能的扩展；但放在字节与腾讯围绕“上班时间”的竞争脉络里，它更像一次战略姿态的校准：字节试图用“职业化”重新定义办公Agent的入口——不再让用户面对一个空的对话框从零开始，而是把金融投研、教案准备、创意设计的工作流打包成开箱即用的“工位”。\n\n几乎在同一时间，另一组数据给出了相反的坐标。易观分析2026年9月的数据显示，腾讯WorkBuddy以8534万月访问量在桌面端断层领先，豆包工作为3039万；QuestMobile的月活口径下，WorkBuddy三平台合计3235.3万，豆包工作PC端仅204.9万。字节在7月底刚完成豆包、飞书、火山引擎的组织整合，梁汝波在9月的飞书大会上明确表态“加大企业市场投入”，豆包工作与飞书8.0实现原生融合。资源不可谓不密集，动作不可谓不坚决，但差距并没有因为组织整合而迅速收窄。\n\n这构成一个值得拆解的张力：当豆包用“21个工作台”把专业场景做深时，WorkBuddy的领先却并不来自更深的专业能力，而来自一个更朴素的东西——它更早地把Agent放进了打工人本来就待着的地方。\n\n职业化是对的，但“工位”不在Agent里\n\n豆包工作台的思路本身并不错，甚至切中了办公Agent长期被诟病的痛点：通用能力再强，一旦进入具体职业，用户仍需自己搭建提示词、挑选插件、拼接工作流。金融投研场景里，工作台把信息查询、材料阅读、对比分析和研报交付串在同一个环境中，可按授权接入Wind、同花顺等专业数据服务；教育场景则围绕教师的真实动线展开——按年级和教材备课件，围绕一道题生成同类练习，把空间关系或光路变成可拖拽的HTML演示。这些设计的意义在于，它把“专业要求”前置到了任务起点，而不是留给用户在对话中反复试错。\n\n但问题恰恰在于，办公Agent的“入口”从来不在Agent自己的界面里。WorkBuddy之所以能在2026年3月上线后四个月内冲到跨平台月活2000万、日活1300万（花旗研报引述腾讯管理层2026年7月数据；与QuestMobile 9月三平台合计3235.3万为不同时点、不同口径，不宜直接对比），留存率超过60%，核心原因并不复杂：它足够轻，不需要企业整体部署，一个人下载就能用；它接入了企业微信和微信的社交关系链，白领在沟通完工作之后顺手唤出Agent处理任务，生成的文件可以直接转回企微群。这种“即插即用”的体验，把使用Agent的心理门槛和操作成本压到了接近于零。而豆包工作在2026年8月才上线PC客户端，此前很长一段时间里，它的能力再强，也缺少一个让用户“顺手打开”的物理入口。21个工作台是在Agent内部修房间，WorkBuddy却已经站在了用户每天必经的走廊上。\n\n这并不意味着专业化的方向错了。它意味着，办公Agent的竞争存在两个不同层次的战场：一个是“Agent能做什么”，另一个是“用户在哪里遇到Agent”。豆包在第一个战场上正在补课，而且补得认真；但在第二个战场上，组织整合带来的飞书协同优势要转化为真实的用户习惯，需要的时间远不止一次版本发布。\n\n字节的“重整合”与腾讯的“轻嵌入”\n\n两家公司的路径差异，在2026年7月之后变得格外清晰。字节选择的是“重整合”：把飞书产品团队与豆包产品团队合并，将TRAE、扣子并入豆包体系，让Agent、模型和协作环境在组织层面先融为一体，再向外输出。梁汝波的判断是，Agent进入可用阶段后，三者“必须紧密融合”才能发挥价值。这条路径的逻辑是自洽的——飞书承载着企业的文档、会议、审批和知识沉淀，豆包工作原生融入飞书之后，Agent天然理解企业的业务数据和权限边界，可以按照既有标准操作业务系统。从“谁更懂一家公司的组织与上下文”这个维度看，字节手里的牌并不差。\n\n但WorkBuddy走的是另一条路：轻嵌入，而不是重整合。它向内融合企业微信和腾讯办公生态，向外兼容第三方IM和企业自有系统，支持企业自研Agent和第三方通信系统接入。更关键的是，它并不要求用户先完成一场“全公司数字化转型”才能开始用Agent。一个员工今天下午下载WorkBuddy，输入指令生成一张报表，这个行为本身就已经在积累使用惯性和数据上下文。当这种个体行为在千百个企业里同时发生时，WorkBuddy获得的不是某个大客户的深度定制，而是大量中小型工作场景的广度覆盖。而广度，在办公Agent的早期阶段，恰恰是训练产品、打磨体验、积累切换成本最有效的燃料。\n\n两种路径没有绝对的对错，但它们对“时间”的消耗方式不同。字节的重整合在理论上能造出更深的护城河，但深度的兑现需要企业客户完成组织层面的采纳和迁移；腾讯的轻嵌入在理论上护城河不够深，却用极低的摩擦系数把用户先圈了进来，再用企业微信的上下文和办公生态的粘性慢慢加深。在一个窗口期以月为单位计算的赛道里，后者显然更快。\n\n价格战与模型开放：一场制造“均势”的军备竞赛\n\n面对差距，字节的选择是开放和价格双管齐下。10月底，豆包工作向团队和企业客户开放第三方模型，首批包括Kimi K3.1 Pro、GLM 5.3和DeepSeek V4.1 Flash；11月12日进一步向个人用户扩大模型选择；11月3日起，个人用户每日简单问答不再消耗付费额度。WorkBuddy的回应则是继续深化企业微信整合、开放产品架构，同时在模型选择上保持开放。两家的路径迅速趋同：模型进入下拉菜单，用户按性能、速度和成本选择。\n\n这种趋同的直接后果是，模型能力本身作为差异化卖点的寿命正在急剧缩短。WorkBuddy早期的一个重要吸引力是“不挑食”，不强制绑定混元，用户可以自由选择DeepSeek、智谱等模型。但当豆包和千问办公在几周内把同样的开放性补齐之后，多模型就不再是谁的独占优势，而成了行业标配。价格层面同样如此：豆包推出DeepSeek V4.1 Flash的限时近乎免费使用，WorkBuddy此前已取消了相关折扣；企业席位定价上，豆包团队版1988元/席/年（按年付折合约166元/席/月）、企业版“席位+用量”的模式，与WorkBuddy、千问办公的定价区间高度重叠，公开可查的起售价大体集中在约166元至198元/人/月（WorkBuddy SaaS企业版为198元/人/月），没有人拥有显著的价格高地。\n\n这构成一种奇特的竞争景观：两家公司都在“开放”和“降价”，但这两个动作都不产生结构性壁垒。开放模型让用户的选择更多，也让Agent产品之间的功能差异变得更薄；降价让获客更容易，也把竞争拉回到互联网时代烧钱买流量的旧轨道上。这种状态带着某种“复古”色彩——当模型和价格都被拉平之后，真正能区分胜负的东西，反而回到了那些最不“AI”的层面：谁的用户已经在某个协同生态里沉淀了足够多的上下文，谁的Agent就拥有更高的切换成本。\n\n真正的分水岭不在模型，在“离开的成本”\n\n腾讯披露的数据提供了一个关键参照：WorkBuddy和CodeBuddy的活跃用户留存率超过60%，付费用户留存率超过80%。在办公Agent这个品类里，留存率比访问量更能说明问题。一个用户今天因为免费额度或某个模型来试用，明天可能就走了；但如果他的聊天记录、文档、日程、邮件和审批流都已经和Agent发生了交互，离开就意味着放弃这些上下文积累，切换成本会真实地阻止迁移。WorkBuddy的留存优势，本质上不是模型优势的产物，而是企业微信和腾讯办公生态作为“上下文容器”的产物。\n\n豆包工作并非没有意识到这一点。与飞书原生融合之后，它在权限体系内操作业务系统、理解企业数据的能力，在理论上可以构建同样性质的上下文壁垒。21个工作台也可以被理解为一种“垂直上下文”的积累策略：当用户在金融投研工作台里反复生成研报、补充数据、更新分析，这些行为同样会沉淀为产品对职业场景的理解。但这条路径的兑现有一个前提：用户必须先进入豆包工作的环境。而在WorkBuddy已经用轻量嵌入占据了大量用户“第一次使用办公Agent”的时刻之后，豆包要争夺的已经不是“Agent好不好用”，而是“用户愿不愿意换一个地方开始”。\n\n海外市场的对照让这一点更加清楚。Microsoft 365 Copilot和Google Gemini Enterprise的定价都在每用户每月30美元左右，它们的竞争力并不来自模型本身的参数规模，而来自Excel、Outlook、Teams、Docs、Gmail这些已经承载了企业日常运转的界面。办公Agent的商业化从来不是“卖模型”，而是“卖一个已经在工作流里的位置”。中国市场的席位定价虽然远低于海外，但商业逻辑是一致的：席位费只是入场券，真正的收入来自Agent嵌入工作流之后产生的用量和依赖。在这个逻辑下，谁先让Agent成为用户“离不开的日常”，谁就掌握了定价权和续费权。\n\n窗口期还在，但窗口在变窄\n\n字节在办公Agent上的投入决心不需要怀疑。豆包App 4.19亿的月活、飞书在企业协同市场的积累、火山引擎的模型能力，都是真实的资产。21个工作台证明字节正在从“通用能力”转向“职业场景”，这是一个正确的方向。但办公Agent的竞争有一个残酷之处：产品的迭代可以以周为单位，组织整合可以以月为单位，用户习惯的迁移和上下文壁垒的积累，却是以季度甚至年为单位来度量的。WorkBuddy在2026年3月抢出来的五个月市场空白期，不会因为豆包在11月发布了一个好功能就被抹平。\n\n真正值得关注的，不是下一轮价格战谁更便宜，也不是下一个模型版本谁跑分更高，而是两家公司谁先让Agent从一个“需要打开的产品”变成一个“不需要想起的存在”。当用户不再思考“我要用Agent做这件事”，而是直接在文档里、在聊天框里、在会议中让任务被完成时，入口的争夺才算真正结束。在那之前，所有关于访问量、月活和模型折扣的喧嚣，都只是通往那个时刻的过渡。而过渡阶段的每一次产品发布，都在悄悄定义最终的分水岭：是在Agent的房间里修更多的工位，还是让Agent走到用户已经站着的地方。\n\n本文为转载内容，授权事宜请联系原著作权人。AI 协同办公\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n豆包工作做深场景，但入口还在WorkBuddy手里\n\n入口之争的本质，不是Agent能做什么，而是用户在哪里遇见它。\n\nTech商业 · 2026/11/19 08:55\n\n图片来源：界面图库\n\n文｜Tech商业 定一 博文 \n\n本周，字节跳动豆包工作上线“工作台”功能，首批覆盖金融、医疗、教育、创意设计等21个专业场景，把常用技能、插件和职业要求预先配置在同一个空间里。表面上看，这是一次产品功能的扩展；但放在字节与腾讯围绕“上班时间”的竞争脉络里，它更像一次战略姿态的校准：字节试图用“职业化”重新定义办公Agent的入口——不再让用户面对一个空的对话框从零开始，而是把金融投研、教案准备、创意设计的工作流打包成开箱即用的“工位”。\n\n几乎在同一时间，另一组数据给出了相反的坐标。易观分析2026年9月的数据显示，腾讯WorkBuddy以8534万月访问量在桌面端断层领先，豆包工作为3039万；QuestMobile的月活口径下，WorkBuddy三平台合计3235.3万，豆包工作PC端仅204.9万。字节在7月底刚完成豆包、飞书、火山引擎的组织整合，梁汝波在9月的飞书大会上明确表态“加大企业市场投入”，豆包工作与飞书8.0实现原生融合。资源不可谓不密集，动作不可谓不坚决，但差距并没有因为组织整合而迅速收窄。\n\n这构成一个值得拆解的张力：当豆包用“21个工作台”把专业场景做深时，WorkBuddy的领先却并不来自更深的专业能力，而来自一个更朴素的东西——它更早地把Agent放进了打工人本来就待着的地方。\n\n职业化是对的，但“工位”不在Agent里\n\n豆包工作台的思路本身并不错，甚至切中了办公Agent长期被诟病的痛点：通用能力再强，一旦进入具体职业，用户仍需自己搭建提示词、挑选插件、拼接工作流。金融投研场景里，工作台把信息查询、材料阅读、对比分析和研报交付串在同一个环境中，可按授权接入Wind、同花顺等专业数据服务；教育场景则围绕教师的真实动线展开——按年级和教材备课件，围绕一道题生成同类练习，把空间关系或光路变成可拖拽的HTML演示。这些设计的意义在于，它把“专业要求”前置到了任务起点，而不是留给用户在对话中反复试错。\n\n但问题恰恰在于，办公Agent的“入口”从来不在Agent自己的界面里。WorkBuddy之所以能在2026年3月上线后四个月内冲到跨平台月活2000万、日活1300万（花旗研报引述腾讯管理层2026年7月数据；与QuestMobile 9月三平台合计3235.3万为不同时点、不同口径，不宜直接对比），留存率超过60%，核心原因并不复杂：它足够轻，不需要企业整体部署，一个人下载就能用；它接入了企业微信和微信的社交关系链，白领在沟通完工作之后顺手唤出Agent处理任务，生成的文件可以直接转回企微群。这种“即插即用”的体验，把使用Agent的心理门槛和操作成本压到了接近于零。而豆包工作在2026年8月才上线PC客户端，此前很长一段时间里，它的能力再强，也缺少一个让用户“顺手打开”的物理入口。21个工作台是在Agent内部修房间，WorkBuddy却已经站在了用户每天必经的走廊上。\n\n这并不意味着专业化的方向错了。它意味着，办公Agent的竞争存在两个不同层次的战场：一个是“Agent能做什么”，另一个是“用户在哪里遇到Agent”。豆包在第一个战场上正在补课，而且补得认真；但在第二个战场上，组织整合带来的飞书协同优势要转化为真实的用户习惯，需要的时间远不止一次版本发布。\n\n字节的“重整合”与腾讯的“轻嵌入”\n\n两家公司的路径差异，在2026年7月之后变得格外清晰。字节选择的是“重整合”：把飞书产品团队与豆包产品团队合并，将TRAE、扣子并入豆包体系，让Agent、模型和协作环境在组织层面先融为一体，再向外输出。梁汝波的判断是，Agent进入可用阶段后，三者“必须紧密融合”才能发挥价值。这条路径的逻辑是自洽的——飞书承载着企业的文档、会议、审批和知识沉淀，豆包工作原生融入飞书之后，Agent天然理解企业的业务数据和权限边界，可以按照既有标准操作业务系统。从“谁更懂一家公司的组织与上下文”这个维度看，字节手里的牌并不差。\n\n但WorkBuddy走的是另一条路：轻嵌入，而不是重整合。它向内融合企业微信和腾讯办公生态，向外兼容第三方IM和企业自有系统，支持企业自研Agent和第三方通信系统接入。更关键的是，它并不要求用户先完成一场“全公司数字化转型”才能开始用Agent。一个员工今天下午下载WorkBuddy，输入指令生成一张报表，这个行为本身就已经在积累使用惯性和数据上下文。当这种个体行为在千百个企业里同时发生时，WorkBuddy获得的不是某个大客户的深度定制，而是大量中小型工作场景的广度覆盖。而广度，在办公Agent的早期阶段，恰恰是训练产品、打磨体验、积累切换成本最有效的燃料。\n\n两种路径没有绝对的对错，但它们对“时间”的消耗方式不同。字节的重整合在理论上能造出更深的护城河，但深度的兑现需要企业客户完成组织层面的采纳和迁移；腾讯的轻嵌入在理论上护城河不够深，却用极低的摩擦系数把用户先圈了进来，再用企业微信的上下文和办公生态的粘性慢慢加深。在一个窗口期以月为单位计算的赛道里，后者显然更快。\n\n价格战与模型开放：一场制造“均势”的军备竞赛\n\n面对差距，字节的选择是开放和价格双管齐下。10月底，豆包工作向团队和企业客户开放第三方模型，首批包括Kimi K3.1 Pro、GLM 5.3和DeepSeek V4.1 Flash；11月12日进一步向个人用户扩大模型选择；11月3日起，个人用户每日简单问答不再消耗付费额度。WorkBuddy的回应则是继续深化企业微信整合、开放产品架构，同时在模型选择上保持开放。两家的路径迅速趋同：模型进入下拉菜单，用户按性能、速度和成本选择。\n\n这种趋同的直接后果是，模型能力本身作为差异化卖点的寿命正在急剧缩短。WorkBuddy早期的一个重要吸引力是“不挑食”，不强制绑定混元，用户可以自由选择DeepSeek、智谱等模型。但当豆包和千问办公在几周内把同样的开放性补齐之后，多模型就不再是谁的独占优势，而成了行业标配。价格层面同样如此：豆包推出DeepSeek V4.1 Flash的限时近乎免费使用，WorkBuddy此前已取消了相关折扣；企业席位定价上，豆包团队版1988元/席/年（按年付折合约166元/席/月）、企业版“席位+用量”的模式，与WorkBuddy、千问办公的定价区间高度重叠，公开可查的起售价大体集中在约166元至198元/人/月（WorkBuddy SaaS企业版为198元/人/月），没有人拥有显著的价格高地。\n\n这构成一种奇特的竞争景观：两家公司都在“开放”和“降价”，但这两个动作都不产生结构性壁垒。开放模型让用户的选择更多，也让Agent产品之间的功能差异变得更薄；降价让获客更容易，也把竞争拉回到互联网时代烧钱买流量的旧轨道上。这种状态带着某种“复古”色彩——当模型和价格都被拉平之后，真正能区分胜负的东西，反而回到了那些最不“AI”的层面：谁的用户已经在某个协同生态里沉淀了足够多的上下文，谁的Agent就拥有更高的切换成本。\n\n真正的分水岭不在模型，在“离开的成本”\n\n腾讯披露的数据提供了一个关键参照：WorkBuddy和CodeBuddy的活跃用户留存率超过60%，付费用户留存率超过80%。在办公Agent这个品类里，留存率比访问量更能说明问题。一个用户今天因为免费额度或某个模型来试用，明天可能就走了；但如果他的聊天记录、文档、日程、邮件和审批流都已经和Agent发生了交互，离开就意味着放弃这些上下文积累，切换成本会真实地阻止迁移。WorkBuddy的留存优势，本质上不是模型优势的产物，而是企业微信和腾讯办公生态作为“上下文容器”的产物。\n\n豆包工作并非没有意识到这一点。与飞书原生融合之后，它在权限体系内操作业务系统、理解企业数据的能力，在理论上可以构建同样性质的上下文壁垒。21个工作台也可以被理解为一种“垂直上下文”的积累策略：当用户在金融投研工作台里反复生成研报、补充数据、更新分析，这些行为同样会沉淀为产品对职业场景的理解。但这条路径的兑现有一个前提：用户必须先进入豆包工作的环境。而在WorkBuddy已经用轻量嵌入占据了           "body": "英國《金融時報》昨日報道，四大會計師事務所之一的畢馬威（KPMG）對一間英國上市公司開展實驗性審計，發現人工智能代理（AI agents）能提出更好的問題，並且對某些財務問題的調查也更加深入。畢馬威計劃將該項目擴展至最多20項大型審計項目，並希望未來能向客戶提供AI審計服務。\n審計員仍須負上最終問責\n該項試驗與傳統人手審計同步開展。畢馬威部署了100多個AI代理來審核一家匿名的富時250指數成分公司的財務報表。AI代理自主協作，負責收集及分析數據、草擬結論並提出後續建議。畢馬威英國審計主管伯內特指出，在幾個案例中，AI能做更深入的調查；在某些情況下，AI提出了「更好的問題」，不過當AI未能將監管條例與公司文件準確配對時，仍需由人類審計員介入處理，強調人的參與仍「至關重要」。\n另一大會計師行羅兵咸永道(PwC)也正開展類似的審計項目。英國財務匯報局（FRC）對此警告，無論採用何種技術，審計員仍須負上最終問責，必須有能力解釋及質疑AI的運算結果，以維持審計獨立性與專業懷疑態度。",

          "body": "南韓的大學修學能力試驗（高考）在一天內完成，對考生的前途至關重要。為了緩解交通擠塞，今日股市延後1小時開市；全國範圍暫停飛機起降35分鐘，以減少英語聽力試期間的噪音。\n各單位公司亦須配合高考\n相關新聞：南韓高考︱懸賞59萬元捉AI作弊 發災難短訊排查手機 鈕扣須貼紙防偷拍\n南韓高考競爭激烈，考生一天內考完國語（韓語）、數學、英語、韓國史、探究科目（社會/科學）5科，部分考生可選修第二外語或漢文。考試共8個小時，有4次休息。首爾市政府日前稱，今年首爾地區共有11萬3454名考生，預計在228個考場應試。\n為避免考生因交通擁塞而遲到，首爾市決定將市政府、各自治區及公共機關等單位的上班時間，比平時延後1小時（上午10時）。今日股市也會延後1小時開市。\n為營造安靜的考試環境，首爾市政府要求公共巴士與的士在行駛期間避免鳴按喇叭、突然起步及急煞等可能製造噪音的行為。全國飛機今日會暫停起降35分鐘（下午1時05分至1時40分），影響130個航班，以減少英語聽力試的噪音。",

          "size": 1,
          "keywords": [],
          "body": "南韓的大學入學試(高考)今日登場，當局嚴防考生利用人工智能(AI)及高科技電子設備作弊。總統李在明在考試前宣布懸賞至少1億韓圜(59萬港元)，獎勵揭發高科技作弊的舉報者。當局還推出「史上最嚴格」的緊急防作弊措施，包括在考試期間不定時發送災難短訊以排查未上交的手機，以及為考生衣服上的每顆鈕扣貼上貼紙，防止以微型鏡頭偷拍考題等。\n相關新聞：南韓稅務師狀元自首 認用微型相機＋AI作弊\n稅務師考試作弊「敲響警鐘」\n是次大學修學能力試驗（CSAT，簡稱修能）正值該國AI迅猛發展之際。近期一宗稅務師考試作弊醜聞轟動全國，榜首狀元因成績異常突出受到質疑，他在第一階段考試的160條題目中僅錯1題，4門科目有3門取得滿分。他上周日向警方自首，承認利用微型攝影機拍攝考題傳送給AI工具，再透過手機查看答案。案件觸發當局嚴打高考作弊。\n李在明周二在社交平台發文稱：「我們已祭出新措施，鼓勵舉報高科技考試作弊行為：至少可獲1億韓圜獎金。」他說，獎金金額可能視涉案人數多寡而增加；若作弊者主動供出同夥，也可從輕處罰。\n李在明的帖文警告：「任何想在考試中作弊的人請注意：切勿心存僥倖、拿前途作賭注。為了你自己和其他人，打消這個念頭吧。」這是全球首次有國家元首親自宣布以巨額現金懸賞防範AI輔助的作弊，反映南韓社會對尖端科技破壞考試公平的深切憂慮。\n國務總理韓聖淑周二稱，全國1312個考場除了原有的逾7.5萬名監考官外，額外增派約1800名智能設備專職人員及6600名走廊監考官。她指出，監考人員會在第一節考試前，檢查所有考生的眼鏡及隨身物品，確保無人佩戴具備拍攝或顯示功能的智能眼鏡。 韓聖淑說，為防範微型攝影機藏於衣物，監考人員會用貼紙遮蓋考生衣服的每顆鈕扣，並要求考生捲起衣袖，及接受衣領檢查。\n要求捲起衣袖接受衣領檢查\n據悉，微型攝影機可藏匿於衣物的鈕扣或領帶夾之中，將拍攝的考題傳入手機的AI工具中。待AI解題後，設備會透過微型耳機告訴考生答案。自昨日傍晚6時起，全國高考考地點及周邊地區，也臨時屏蔽WiFi訊號。\n此外，教育部與行政安全部昨日表示，會在考試上午8時30分，在全國範圍內發送無法拒收的「緊急災難短訊」，其後更會在不作預先通知的情況下不定時追加發送。\n只要手機處於開機狀態，便會持續發出長達10.5秒的提示音，藉此排查未依規定在開考前關機並交予考試本部保管的手機，杜絕考生在考場內偷偷重開手機使用AI作弊。\n為免民眾恐慌，當局會在短訊中標示：「這是一條防止CSAT考試作弊的短訊。請不要驚慌，繼續您的日常生活。」 對於被抓到的作弊者，政府正推動處以「10年內禁止重考」的懲罰。現行的懲罰力度是禁考1年。\n對於被抓到的作弊者，政府正推動處以「10年內禁止重考」的懲罰。",

          "body": "乘联分会：11月1-15日全国乘用车市场零售61.1万辆，同比下降25%\n\n乘联分会公布数据显示，11月1-15日，全国乘用车市场零售61.1万辆，同比去年11月同期下降25%，较上月同期下降6%，今年以来累计零售1,558.9万辆，同比下降22%；11月1-15日，全国乘用车厂商批发72.2万辆，同比去年11月同期下降23%，较上月同期增长11%，今年以来累计批发2,309.2万辆，同比下降7%。\n\n智界获道路机动车辆独立生产资质\n\n据蓝鲸新闻，11月18日，记者查询工业和信息化部公告获悉，在汽车生产企业方面，奇瑞集团获同意增加成员企业安徽智界新能源汽车有限公司，注册地址为安徽省芜湖市经济技术开发区龙山街道华山路与千岛湖路交叉口芜湖经济技术开发区管理委员会15楼1507室，生产地址为安徽省芜湖市经济技术开发区皖江大道8号。在该公告中，东风集团也获同意增加成员企业岚图汽车科技股份有限公司。\n\n北汽集团与雄安集团签署战略合作协议\n\n11月17日，北汽集团与中国雄安集团有限公司签署战略合作协议。根据协议，双方围绕智慧交通出行、城市建设用车、自主品牌渠道建设、汽车后市场服务、产业链协同创新等方向开展多层次合作。\n\n长安汽车、长安民生物流与中远海特签署合资合作意向协议\n\n据中国长安汽车集团消息，11月16日，长安汽车、长安民生物流、中远海运特运三方正式签署合资合作意向协议。三方将共同搭建汽车滚装运力持有平台。\n\n小马智行：Q3 Robotaxi收入同比增165.4%\n\n11月18日，小马智行发布2026年第三季度财报。三季度总营收2.99亿元，同比增长75.2%，由Robotaxi与Robotruck业务共同驱动。其中，Robotaxi业务收入1.19亿元，同比大幅增长165.4%，环比增长47.1%，营收占比升至39.9%。Robotruck业务收入1.20亿元，同比增长76.3%，环比增长34.7%。小马智行在国内一线城市加大全无人车辆的投放规模和范围，广州单城运营面积突破1000平方公里，并在杭州、重庆及珠海横琴启动Robotaxi部署；海外业务向伦敦、曼彻斯特等欧洲大型城市扩张，9月在克罗地亚推出欧洲首个全无人Robotaxi载客测试。截至9月30日，Robotaxi车队规模达2768辆。\n\nMomenta与Uber在德国慕尼黑启动Robotaxi试运营\n\n11月18日消息，界面新闻获悉Momenta与Uber宣布在德国慕尼黑启动Robotaxi试运营，初期覆盖慕尼黑北部大部分区域，包括奥林匹克公园周边街区。乘客即日起可在Uber App内报名，获得体验资格后，在服务区域内呼叫UberX、Electric或Comfort服务时，将有机会乘坐自动驾驶车辆。此次试运营免费开放，每趟行程均配备安全员。双方计划在合规框架下逐步将服务拓展至慕尼黑更多区域。\n\n通用汽车据悉正物色CEO玛丽·博拉潜在继任者\n\n据报道，通用汽车正与一家高管猎头公司合作，物色可能接替CEO玛丽·博拉（Mary Barra）的外部人选，同时正考察一批内部候选人。报道称，通用汽车正为其现代史上任职时间最长CEO离任后的未来做准备。\n\n美国加州发布禁令后，Waymo暂停在全美高速公路运营自动驾驶出租车\n\n当地时间11月17日，Alphabet旗下自动驾驶公司Waymo表示，已暂停其自动驾驶出租车在美国高速公路上的运营。此前，在美国加州监管机禁止Waymo车辆在该州高速公路上行驶。 加州机动车管理局（DMV）17日发布声明称，禁令源于Waymo自动驾驶出租车多次驶入正在施工区域所引发的一系列事件，“经认定，Waymo在高速公路上的无人驾驶运营对公共安全构成迫在眉睫的危险”。 Waymo发言人称，该公司已在其他运营市场暂时限制高速公路上的车辆运行，旨在评估其性能表现，在普通道路上的服务则照常运营。\n\n未经正式授权严禁转载本文，侵权必究。通用汽车\n483\n\n美国国家公路交通安全管理局：通用汽车申请召回约1.3万辆汽车14天前\n美国国家公路交通安全管理局：通用汽车申请召回约6.7万辆汽车14天前\n\n汽车要闻\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n通用汽车\n汽车早报｜智界获独立生产资质 通用汽车据悉正物色CEO玛丽·博拉潜           "digest": "人类飞得最远的探测器走到哪了",
          "points": [

          ],
          "section": "生活",

          "size": 1,

          "body": "人类飞得最远的探测器走到哪了？北京时间昨天(18日)18时16分07秒，旅行者1号探测器历经49年的飞行，正式抵达了距离地球1光日的地方。这也是人类历史上第一次，将自己造出的装置送到了即便以光速也要用“天”来计量的遥远尺度。\r\n\n　　从地球到月球，光只要跑1.3秒；从太阳照到地球，光只要走8分多钟；即便飞到最远的行星海王星，光也只需要4个多小时。1光日，是指光在真空中跑上一整天的距离，折算下来大约是259亿千米。\n\n　　探测器所抵达的1光日的位置，距离飞出太阳系还有多远？半个世纪的星际航行，带来哪些发现与挑战？\n\n　　1光日到底有多远？\n\n　　北京天文馆研究员 朱进：1光日指的是以光速运动，走一天的距离。光速为光子在真空中的传播速度，每秒30万千米，一天86400秒，两者相乘约259亿千米，即1光日的距离。\n\n　　大家把1光日当成一个比较受关注的节点，那飞到这个位置，旅行者1号周边的宇宙环境，会出现比较明显变化吗？这个节点它更多是纪念意义，还是说能给我们研究星际空间、认识太阳系边界带来新的科学收获呢？\n\n　　朱进：1光日只是为了“凑个整”。平时在太阳系内运动多用天文单位，常听说的其实是光年，很少用光日。光日是因为这一距离正好是以光速衡量24小时，或者说与飞船通信时信号发过去需24小时、发回来也需24小时。因此，1光日对应的距离上并没有物理上特别不一样的地方。\n\n　　快要飞出太阳系了吗？\n\n　　这次到达1光日的距离，有不少听众好奇它是不是已经或者快要飞出太阳系了。其实早在2012年8月，旅行者1号越过日球层顶、进入星际空间的时候，大家就有过同样的疑问。那这次的情况又是怎么样的呢？\n\n　　朱进：2012年旅行者1号经过太阳风层顶(日球层顶)，这是一个比较重要的不同之处：飞船经过该处后，来自太阳的太阳风粒子压力与来自外部恒星际空间的压力达到平衡，是一个比较关键的变化。但经过太阳风层顶与飞出太阳系并非一回事。离太阳最近的恒星有4光年远，1光日其实还只是离太阳非常近的地方。旅行者1号虽已走了近50年，但按太阳系尺度看，其实只走了太阳系里非常中心的一小段。\n\n　　地面测控最大难点是什么？\n\n　　到了1光日这个距离，信号单程就要24小时，一来一回通信时延接近48小时。这么长的时延，地面测控面临最大的难点是什么？\n\n　　朱进：这一距离上最大难点其实并不是延时，因为很多时候并没有那么多需要实时反应的东西。最关键的是距离远造成信号衰减特别强；同时旅行者1号已近50年，50年前的航天器不可能携带特别大的天线，发射信号功率肯定特别低，且为节省能源还要限制信号发射强度和电力消耗。真正麻烦的是信号太微弱，探测器上科学观测设备和发射信号设备都存在寿命与功率问题。\n\n　　金唱片能被外星文明捕获吗？\n\n　　旅行者1号和2号上，都携带着同样的一张金唱片，这张唱片上，记录了55种语言的问候、大概90分钟的音乐、115幅模拟编码图像，以及风雨、浪涛和动物的声音。封面用氢原子跃迁建立时间尺度，以脉冲星图标示太阳位置。那么，在漫长的星际漂流中，它有没有机会被外星文明捕获，甚至是被读懂呢？\n\n　　朱进：在我看来，碰到外星人基本上不可能。两个探测器要真正离开太阳系、抵达离太阳最近的恒星，还早得很，怎么也是几万年以后的事。旅行者1号49年才走1光日，若银河系有外星人，一般考虑不会到处都是，在这种情况下能被外星人接触到，是百万年量级的事。因此需上百万年甚至上千万年，且唱片还没坏、还能一直往前飞，才有可能被外星人碰着。 【编辑:王琴】",

          "body": "超八成受访青年因线下观赛结识了新朋友\n\n　　见证重要赛事节点、感受紧张现场氛围、打卡丰富配套活动……观看竞技体育赛事时，你是否会选择去线下，享受和同好一起加油助威的快乐？近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育赛事的青年开展的调查显示，超七成受访青年曾在线下观看过竞技体育赛事，其中，80.8%的受访青年因线下观赛结识了新朋友。\n\n　　“线下观赛的氛围感是线上无法体验到的”\n\n　　“在线下看比赛和隔着屏幕还是很不一样的。”在广东广州上学的05后赵欣喜欢在现场亲身感受比赛氛围，也会为了自己喜欢的赛事特意去其他城市观赛，“我看的竞技项目在上海的赛程比较多，去一次可能会花费5000元左右。”今年，该赛事推出了城市巡回赛，落地了她所在的广州，“一场的票价大约在300元，比较合适。”她也会去球迷或者官方组织的线下观赛点观看赛事转播，“可以感受大家一起观赛的激动氛围。”\r\n\n　　在北京工作的90后李泽林更倾向在当地看比赛。作为一名网球爱好者，他从2014年就开始在线下观看中国网球公开赛(以下简称“中网”)。除了门票，他还会购买挂件、服饰等赛事周边，“去一次基本会花费1000元左右。”今年中网期间，他和朋友被一家正在转播中网赛事的餐厅吸引，“其实在餐馆之类的地方，和朋友一起边吃边看，也很有意思。”\n\n　　除了现场观赛，如今越来越丰富的线下观赛形式也吸引更多年轻人走出家门，和同好一起分享观赛激情。数据显示，70.9%的受访青年在比赛现场、影院转播活动等线下渠道观看过竞技体育赛事。其中，7.4%的受访青年通常会为线下观赛活动花费100元以下；43.6%的受访青年花费100-500元(不含500元)；35.4%的受访青年花费500-1000元(不含1000元)；11.2%的受访青年花费1000-3000元(不含3000元)；还有2.4%的受访青年会花费3000元及以上。\n\n　　“线下观赛的氛围感是线上无法体验到的。”正在读研究生的00后卫婕会选择在一些关键赛事，或者有自己喜欢的队伍参赛时去线下观赛，和同好一起加油助威。同时，她也感到如今的赛事配套活动越来越丰富，将赛事与城市特色融合起来，给观众带来了更沉浸的线下观赛体验，“今年我去北京看了一场比赛，它在开场表演和舞美设计中，融入了京剧等北京特色元素，让人眼前一亮。”\n\n　　对95后王卓琳而言，只有去线下观赛，才能真正感受到一个体育项目的魅力，“哪怕把电视声音开得再大，和现场也是完全不同的。”她平时也会去不同城市观看足球比赛，亲身感受赛场独有的紧张感，“有的人可能觉得屏幕上看得更清楚，可以看到细节、听清解说，但只有在现场，你才能感受到为什么一个带球、一个进球都牵动人心。”\n\n　　比起在家“躺着”观赛，年轻人为何会选择到线下场所观看竞技体育比赛？在有过线下观赛经历的743名受访青年中，57.5%的受访青年是想亲眼见证高光时刻、经典对决；56.9%的受访青年是为了和同好一起呐喊助威，获得情绪共鸣；55.2%的受访青年是为了沉浸式感受赛场独有的紧张氛围。其他还有：近距离支持喜欢的选手、队伍(47.4%)，互动、抽奖、表演等线下配套活动丰富(36.3%)，作为一种休闲社交方式(25.0%)，打卡赛事地标(5.9%)等。\n\n　　线下观赛 八成受访青年结识了新朋友\n\n　　线下观赛，年轻人不仅享受比赛本身的魅力，也拓展了自己的社交圈。调查显示，在有过线下观赛经历的受访青年中，80.8%的受访青年因此结识了新朋友。\n\n　　赵欣觉得，竞技体育赛事让来自天南海北的观众有机会相聚在一起。“最开始大家可能只是网友，在社交平台上发帖交流。随着线上交流的深入，大家会加好友、建群。”有比赛时，群里的朋友也会相约线下观赛，“我也因此认识了很多新朋友。”\n\n　　李泽林在中网期间会和球迷群里的网友相约买票，“我们会选一个比较集中的区域，方便一起加油助威。”观赛时，大家还会在现场讨论比赛内容，交流球技。赛后，他还会和新“球友”约着一起线下打球。\n\n　　卫婕会在观赛现场和其他粉丝交换周边，也会和旁边的其他同好搭话，在一来二去的闲聊中慢慢发展出友谊。如今，她和一些通过线下观赛认识的同好之间的话题，已经不仅仅是比赛本身，“有的已经成了能分享生活的好友。”\n\n　　受访青年中，男性占52.8%，女性占47.2%。05后占5.2%，00后占32.2%，95后占25.6%，90后占37.0%。\n\n　　(除卫婕外，受访者均为化名)\n\n　　中青报·中青网记者 戴瑶\n\n　　来源：中国青年报 2026年11月19日 08版 【编辑:王琴】",

          "body": "近期時尚圈大吹「回憶殺」與「可愛風」，多個國際品牌不約而同與經典卡通或傳奇飲品推出驚喜聯乘，將滿滿童趣與復古情懷穿戴上身！無論是把萌爆Monchhichi躍上經典袋款、將Snoopy融入美式學院風外套，又或以Coca-Cola化作服飾上的華麗串珠刺繡，三大話題聯乘新作各具特色，為日常造型增添亮眼焦點！\nMCM x Monchhichi 潮萌玩味時尚\n德國時尚皮具品牌MCM與日本經典玩偶Monchhichi驚喜碰頭，帶來充滿童趣與懷舊魅力的限量聯乘系列。早前Marf與泰國女星Freen一同出席MCM X Monchhichi系列發布活動，演繹萌爆可愛新袋款。這次合作以玩味十足的視角，重新演繹品牌標誌性的干邑色Visetos印花圖案，同時將饒富質感的皮革、招牌金色金屬配件，與Monchhichi可愛萌趣的細節互相融合，為奢華街頭時尚注入滿滿的治癒氣息。此系列包羅4款人氣經典袋款，分別是實用百搭的Liz Shopping Bag與Toni Tote Bag，還有小巧精緻且復古的Aren單肩長形手袋及大熱的Vanity Bag，每款單品既保留品牌工藝與經典輪廓，亦不失童趣，適合日常配搭之餘，又是值得粉絲收藏，令人愛不釋手！\nBrooks Brothers×PEANUTS New Ivy休閒格調\n美國百年服飾品牌Brooks Brothers今次與PEANUTS推出秋冬聯名系列，以品牌經典單品為核心，結合刺繡、復古提花、嵌花編織與人字紋等工藝，透過招牌版型、舒適剪裁與活潑圖案，展現休閒的New Ivy風格。系列延續Brooks Brothers 1818經典花體標誌，搭配細緻的鎖鏈刺繡工藝。當中人字紋西裝外套、費爾島圖騰針織衫、Oxford Shirt等經典單品換上全新面貌。外套款式包括人字紋粗花呢西裝外套、卡其色哈靈頓外套，以及藍白拼色復古棒球外套。利落剪裁搭配花生主角Snoopy刺繡徽章或低調暗紋，適合任何場合輕鬆穿搭。藍白條紋及純白T恤簡約清爽，巧妙融入史努比與胡士托的可愛身影，為日常造型增添童趣。同系列亦有推出棒球帽及Tote Bag，可隨意Mix & Match。\nALICE + OLIVIA by Stacey Bendet×Coca Cola 投入美式世界\n這個獨家聯乘膠囊系列完美地融合兩個品牌的美式風格。聯乘系列共有19款單品，包括恤衫、牛仔褲、T恤及連身裙等，ALICE + OLIVIA by Stacey Bendet的優雅女性氣質與可口可樂的悠久傳承一拍即合。其中Willa Staceface恤衫，隱藏式前襟設計令品牌標誌性的Staceface圖案更見突出。另貫徹品牌Glam風格，模特兒穿上的半截\n長裙綴滿色彩繽紛的汽水瓶圖案，豐富多姿的串珠刺繡閃爍耀目，極具高訂服的華麗氣派，正是高街時尚混搭的最佳示範。",

          "body": "現年65歲的前TVB金牌司儀盧敏儀，日前與導演丈夫孫敬安一同出席圈中好友飯局，同場還有唐韋琪、鄧英敏等熟悉面孔。從友人分享的合照中可見，坐在左下方的盧敏儀神態從容，丈夫孫敬安則站在其身後默默陪伴，兩人表現恩愛。盧敏儀與孫敬安自1997年結婚至今已接近30年，多年來一直形影不離，是圈中出名的模範夫婦。\n盧敏儀笑談孫敬安日常相處\n兩人在2017年大搞結婚20周年派對時，盧敏儀曾公開感謝丈夫的愛護。她透露當時做體檢時懷疑患乳癌，孫敬安因擔心她而抱著她落淚；幸好後來找專家再抽組織檢驗證實無大礙，孫敬安又喜極而泣。盧敏儀坦言自己性格有時比較任性，但這20年間反而是丈夫主動為她改變，是一位好老公。談到夫妻日常，盧敏儀近年受訪時自認是個沉悶的太太，放假只想留在家中放空腦袋，不想辛苦執拾行李旅行。孫敬安則在一旁笑著投訴，指太太連去旅行或看電影都不肯，老夫老妻的鬥嘴十分溫馨。\n相關閱讀：《勁歌金曲》元祖級主持盧敏儀罕現身 轉行做律師多次為明星打官司 極關心李龍基未婚妻案情\n盧敏儀轉行做大律師曾為鍾鎮濤辯護\n盧敏儀讀中學時因主持《少年警訊》展露口才，曾獲警務處長頒發嘉許狀。入行後她深受無綫重用，不僅是《勁歌金曲》第一代主持，更屢次與鍾保羅合作主持大型節目。1997年婚後，她決定淡出娛樂圈重返校園，先後完成法律學士及法律碩士課程，並成為著名資深大律師清洪的徒弟。轉行大律師後，她多次為曾志偉、張慧雯等圈中人提供法律支援。2011年，鍾鎮濤與前妻章小蕙胞妹章小婉發生衝突而被控，當時便是由盧敏儀代表辯護，最終協助鍾鎮濤獲判無罪。\n相關閱讀：EYT好友會丨盧敏儀拒回應蔡楓華入紙紅館：盡在不言中 余慕蓮精靈現身自爆氣管不順有點咳嗽\n《勁歌金曲》元祖級主持蔡楓華獲平反：",

          "body": "洗潔精每天洗碗都會派上用場，隨著用量漸減，當快要見底時，有些人或許會習慣加點水進去、搖一搖繼續用。雖然這樣做看似節省一點，但背後的衞生狀況與清潔效果卻讓人不放心。到底洗潔精見底加水稀釋還能用嗎？有日媒特別邀請專家來為大家解答這個問題。\n主婦必看！洗潔精見底加水稀釋還能用嗎？\n根據日媒《grapee.jp》報導，清潔洗劑品牌「花王」明確指出：在清洗餐具或廚房用具時，不建議將洗碗精加水稀釋使用。\n【同場加映】洗潔精推介｜日本《LDK》評測14款人氣產品 4款獲A級 快乾/強效去油/溫和護手！\n花王表示，正確的用法是將適量（約1-2mL）的洗潔精倒在沾濕的海綿上，輕輕搓揉出泡沫後再使用。由於洗潔精在出廠時，其去油與清潔效果都是在「原液建議用量」下經過嚴格測試與配方設計的，一旦擅自加水稀釋，會導致濃度被稀釋，因而無法達到應有的清潔與去油效果。\n加水稀釋洗潔精的2大隱患\n「花王株式會社」指，除了洗不乾淨之外，將稀釋後的洗潔精長時間存放於瓶內，還可能導致變質，加水稀釋反而會失去原本的效能，將洗潔精加水稀釋還伴隨著以下隱患：\n加水稀釋洗潔精的2大隱患\n 洗劑容易變質：市售的洗潔精瓶內通常添加了適量的防腐劑，以確保在未開封或正常使用下的保存期限。然而，一旦加入自來水，不僅會破壞原本的化學平衡與防腐成分濃度，若將稀釋後的液體長時間存放於瓶內，更容易導致洗劑變質、發臭。\n 細菌滋生：自來水中並非無菌，且浴室或廚房周遭環境潮濕。當水進入洗潔精瓶後，若放置過久，反而容易成為細菌、黴菌（如綠膿桿菌等）滋生的溫床。原本為了清潔餐具而使用的洗潔精，若帶有大量細菌，洗碗時反而可能造成二次汙染，對家人的衛生健康帶來隱憂。\n資料來源：《grapee.jp》\n延伸閱讀：初級大人必學！臨時沒有洗衣液點算好？專家教用3大家居好物應急 天然除臭去漬首選這款",

            "中东部地区降水将减少减弱，进入一段降水间歇期",

          "size": 1,
          "keywords": [],
          "body": "中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低，多地气温将陆续降至近期低点，并大范围创下立秋后新低。与此同时，中东部地区降水将减少减弱，进入一段降水间歇期。23日前后，随着暖湿气流增强，江南、华南等地又将迎来一轮降水天气过程。\n\n　　寒潮东移南下 中东部气温将陆续触底\n\n　　昨天，寒潮继续南下，中东部大部出现大风降温天气。监测显示，内蒙古中东部、东北地区中南部、华北、黄淮及青海南部、西藏等地出现6至8级阵风，局地11级以上。今早6时较昨天同时次，黄淮、江淮、江汉、江南中东部、华南中西部等地部分地区出现6至10℃，局地12℃以上降温。\n\n　　今明天，冷空气影响将趋于结束，但中东部地区气温仍较低。其中明天早晨，最低气温0°C线将南压至河南北部至苏皖北部一带。\n\n　　受冷空气影响，南北方多地气温将陆续降至近期低点，并大范围创立秋后新低。沈阳今天最高气温将是下半年首次跌至0℃，济南明天早晨最低气温也将是下半年首次跌破冰点。这次冷空气过后，北方有望全面入冬，而长江中下游一带也将会有短暂的冬日体验。\n\n　　对于华南来说，由于前期气温显著偏高，这轮降温效果会十分明显。大城市中，广州、南宁最高气温将从前期的30℃上下，下滑至不足20℃，其中南宁今天最高气温仅有17℃，秋凉明显。\n\n　　此外，今天冷空气在东移南下过程中，由于地面气压梯度较大，加上高空动量下传，东北、华北等地仍将有大风天气。午后阵风尤其强劲，阵风可达7至9级，风寒效应明显，提醒公众外出需注意防风保暖。\n\n　　中东部进入降水间歇期 23日前后南方再迎降水过程\n\n　　随着冷空气东移南下，中东部地区的降水迅速向东向南收缩。昨天，内蒙古中东部、黑龙江、吉林东部、河北北部等地出现小到中雪或雨夹雪；云南南部、广西中南部、广东中南部、福建东北部等地出现分散性中到大雨，云南西双版纳局地暴雨。\n\n　　今天，东北地区的降雪和南方的降雨都会有所减少。中央气象台预计，今天，内蒙古中部、黑龙江中东部、吉林东部等地部分地区有小到中雪或雨夹雪，其中，黑龙江东北部局地有大雪。西南地区南部、华南大部、台湾岛等地部分地区有小到中雨，其中，云南南部等地部分地区有大雨。\n\n　　明后两天，我国大部地区将进入降水间歇期，天气以晴为主，并且在干燥偏北气流的影响下，空气相对湿度下降，南方的干燥程度也会加大。\n\n　　中央气象台预计，20日，内蒙古中部、黑龙江东部、山东半岛东北部等地部分地区有小到中雪或雨夹雪，其中，山东半岛等地部分地区有大雪。云南南部、华南中南部、台湾岛等地部分地区有小雨，其中，云南南部和中部等地部分地区有中雨。\n\n　　21日，内蒙古东北部、山东半岛东北部等地部分地区有小雪。云南中南部、贵州西部等地部分地区有小雨或阵雨。\n\n　　展望后期，23日前后，随着暖湿气流加强，配合南下的冷空气，南方又会迎来新一轮降水过程。届时，江南、华南等地将有中到大雨，提醒公众密切关注临近预报，提前做好防范措施。\n\n 【编辑:梁异】",

          "body": "当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者参与的调查显示，超半数(52.2%)受访者表示为AI花过钱，知识处理(59.1%)、多媒体创作(53.3%)、办公学习(44.1%)是受访者常用AI做的事。\r\n\n　　自从使用AI办公后，来自深圳的35岁黄鹂觉得自己的工作效率有了很大提高，原来可能要做一整天的方案，如今在AI的加持下两到三小时就能完成。在她看来，为AI付费是对自己的一种“投资”。“如果你愿意付费深度学习、使用AI工具，它能提高你的工作效率，也能提升个人能力。”\n\n　　调查显示，超半数(52.2%)受访者为AI花过钱。交叉分析发现，受访90后的这一比例更高，为61.4%。然后是00后(58.3%)、95后(53.6%)。男性受访者(53.2%)的这一比例高于女性受访者(51.4%)。从地区来看，一线城市受访者的这一比例更高，为58.1%，然后是二线城市(51.7%)、三四线城市(51.1%)。\n\n　　来自上海的在读研究生王明远，从今年8月底开始为AI付费。“感觉学习效率提升了，对求职也有很大帮助。”\n\n　　王明远表示，互联网时代获取知识容易，但缺少一个可以随时提问的导师，“AI可以充当这个角色。”从课程知识学习、作业指导到简历项目设计，他用AI构建了一个24小时在线的私人导师。“我有很多问题可以问AI，它能指导我的成长。”\n\n　　来自深圳的37岁林子侨是一名游戏行业的从业者，最近他正和朋友一起创作一部AI短剧。为了达到更好的艺术效果，今年9月，他果断为AI掏出钱包。“我们有分工，朋友是编剧，用AI做视频我是自学的。”\n\n　　林子侨表示，免费模型在画面精度和语义理解上不够好，每次都要花大量时间后期修补。如今，他每月在续卡、买积分上的花费在2000元左右，调用的模型也越来越高级。“AI生成视频的成本虽有些高，但比自己拍片子的成本低。”在他看来，这笔钱买的是把创意直接变成画面的能力。\n\n　　大家会为什么样的AI服务付费？数据显示，49.2%的受访者会为更聪明的模型付费；48.4%的受访者会为多模态AI付费，生图、视频、语音更好用；46.7%的受访者是为了省时间，写稿、做表、出方案更快。其他还有：不卡额度，额度丰富够调用(28.2%)；懒得折腾，一个会员全平台通吃最省心(20.6%)等。\n\n　　90后原田在苏州做生产管理，下班后她还有另一个身份——短视频博主。她用AI生成脚本、画面、配音、剪辑，整个流程几乎不需要人工介入。“以前我试着学过剪辑，学着学着就放弃了，现在有想法直接就能成片。以前得几个人干的活，现在我下班回来一个人就做完了。”\n\n　　之前原田一直用免费版的AI工具，但发现废片率高、画质不够清晰，为AI付费之后，她明显感觉“快”了，并且能调用更好的模型。“现在几分钟就能生成能用的素材。”\n\n　　大家平时用AI做什么？调查中，查资料/翻译/解题/写代码等知识处理(59.1%)、生图/修图/剪视频/做AI短片等多媒体创作(53.3%)、写稿/周报/PPT/邮件等办公学习产出(44.1%)位列前三。其他还有：写小说/写歌/写段子/等文艺脑洞(27.7%)；闲聊/情感陪伴/角色扮演等日常互动(27.1%)；投喂资料做个人知识库/智能体训练(15.5%)等。\n\n　　来自河南郑州的85后网店主张龙，把AI当成了自己的“员工”，用AI生图、写文案、翻译，AI的出现让他解锁了很多技能。他的电脑里，整齐排列着一周的社交媒体发布包——文案、配图、标签全部由AI生成，他只需手动上传。“像美工、运营、剪辑、拍摄，以前至少需要一个团队，现在我一个人加AI就能搞定。”张龙说。\n\n　　受访者中，05后占3.2%，00后占22.6%，95后占20.7%，90后占25.4%，85后占13.2%，80后占11.2%，其他占3.7%。男性占47.6%，女性占52.4%。来自一线城市的占38.1%，二线城市的占35.7%，三四线城市的占19.8%，县城或城镇的占5.1%，农村的占1.3%。\n\n　　(应受访者要求，张龙为化名)\n\n　　中青报·中青网记者 吴欣宇 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:梁异】",
