增长4.6%和11.8%。作为巴西最主要的农产品，大豆产值预计达3612亿雷亚尔。\n\n　　巴西农业部预计，2027年农牧业总产值将有序增长，同比增幅将达2.6%，再次突破1.5万亿雷亚尔。其中，大豆产值有望增长10.1%，畜牧业产值预计增长5.3%。\n\n　　另据巴西农业部数据显示，2026年前10个月，巴西农牧业出口额达1494亿美元，同比增长5.2%，贸易顺差约1323亿美元。其中，大豆及其制品出口额达564亿美元，肉类出口额达286亿美元，牛肉和鸡肉出口均创下历史同期纪录。\n\n　　2026年10月，巴西农牧业出口额达160亿美元，同比增长4.1%，占当月全国出口总额的42.3%。大豆以31亿美元的出口额位居首位，其次为生咖啡豆、玉米、牛肉和纸浆。巴西农牧产品前三大出口市场依次为中国、欧盟和美国，出口额分别为39亿美元、26亿美元和9.52亿美元。\n\n　　巴西近年来持续拓展农牧产品国际市场。自2023年以来，巴西已累计在全球102个国家获得728项农牧产品市场准入许可。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5f2b6c64c2","title":"外媒眼中的“现代化奇迹”，APEC深圳会议展现中国开放创新窗口","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735057.shtml","summary":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会…","随着亚太各经济体领导人和工商界代表齐聚这座中国改革开放的前沿城市，深圳成为国际媒体关注的焦点","从区域经贸合作到科技创新，从产业发展到城市开放活力，外媒纷纷将目光投向中国…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T09:44:48+08:00","size":1,"keywords":[],"body":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。随着亚太各经济体领导人和工商界代表齐聚这座中国改革开放的前沿城市，深圳成为国际媒体关注的焦点。\n\n　　从区域经贸合作到科技创新，从产业发展到城市开放活力，外媒纷纷将目光投向中国，各方期待借助APEC这一重要平台，探索亚太经济合作新机遇。\n\n图为市民拍摄深圳华强北的APEC标识。中新社记者 张祥毅 摄\n\n　　开放合作凝聚共识\n\n　　亚太经济迎来新机遇\n\n　　本届APEC会议以“建设亚太共同体，促进共同繁荣”为主题，“开放、创新、合作”成为三大优先领域。多家外媒认为，在全球经济面临不确定性、区域产业联系日益紧密的背景下，APEC深圳会议为亚太各经济体加强对话、深化经贸合作提供了重要契机。\n\n　　马新社报道称，随着来自亚太经合组织21个经济体和英国、法国、德国、瑞士等13个域外经济体知名企业代表齐聚深圳，这座城市成为区域经济外交的焦点。各方围绕加强贸易、推动创新和深化区域合作，共同探讨亚太地区未来发展方向。\n\n　　报道称，作为东道主，中国期待各成员经济体在贸易、互联互通、数字经济和人工智能等重点领域取得更多务实成果。\n\n　　越南媒体“Vietnamplus”报道称，深圳作为中国改革开放的重要窗口，与本届APEC会议确定的“开放、创新、合作”三大优先领域相互呼应，传递出一个清晰信息：合作与创新是实现经济增长、激发区域活力的重要动力。\n\n　　美联社还进一步关注到中国在数字经济和人工智能领域深化合作，为国际投资者创造更加有利的环境的意愿。\n\n　　广东发展彰显开放优势\n\n　　深圳创新活力吸引世界\n\n　　除区域合作议题外，深圳的城市发展和科技创新实力，也是外媒关注的另一大焦点。\n\n　　美联社关注到，深圳在过去40多年间，已从一个渔村发展成为拥有众多摩天大楼、集出口制造业与科技产业于一体的城市。\n\n　　新西兰“亚洲媒体中心”网站报道称，深圳是一座具有开放基因、持续创新活力和跨领域合作精神的城市。报道认为，深圳从渔村成长为科技与制造业中心的历程，是中国改革开放的一个缩影，也展现了亚太地区合作所蕴含的发展潜力。\n\n　　俄罗斯塔斯社则将深圳称为中国现代化发展的一个奇迹，指出这座城市在短短几十年间，从一个小渔村发展成为全球电子产品和高科技产品制造中心。俄罗斯总统助理乌沙科夫表示，深圳是一座在许多方面都独一无二的城市。\n\n　　美国商业资讯(Business Wire)网站刊文，将本届APEC会议与广东经济发展及全球贸易联系起来。\n\n　　报道关注到，广东正加大对先进制造、智能互联、生物技术和可再生能源等新兴领域的投资；借助本届APEC会议，广东有望进一步深化区域经贸伙伴关系、吸引国际投资，并提升其在亚太供应链中的地位。\n\n　　从深圳的产业升级到广东的外贸增长，从人工智能到绿色技术，外媒的报道展现出一个共同视角：深圳不仅是本届APEC会议的举办地，也是观察中国经济活力、创新能力和开放水平的重要窗口之一。\n\n　　塔斯社报道援引俄罗斯总统特别代表、俄罗斯直接投资基金总裁基里尔·德米特里耶夫的话称，2026年亚太经合组织工商领导人峰会是一场旨在促进对话、合作、和平与繁荣的会议。\n\n 【编辑:管娜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0322ea80f7","title":"澤連斯基倡召開歐洲有份四方會談 多國領袖與普京劃清界線","url":"https://news.tvb.com/tc/1207382-澤連斯基倡召開歐洲有份四方會談多國領袖與普京劃清界線","summary":"美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障。烏克蘭總統澤連斯基，倡議召開歐洲有份的四方會談。","summary_short":"美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障。","digest":"美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障","points":["美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障","烏克蘭總統澤連斯基，倡議召開歐洲有份的四方會談","歐洲多國領袖表明，跟俄羅斯總統普京劃清界線"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T09:10+08:00","size":1,"keywords":[],"body":"美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障。烏克蘭總統澤連斯基，倡議召開歐洲有份的四方會談。歐洲多國領袖表明，跟俄羅斯總統普京劃清界線。普京就稱無意就海上停火談判。\n\n俄烏戰事持續將近4年9個月，烏克蘭周四指俄羅斯出動多枚反艦導彈及近百架無人機，向烏方至少18處施襲。\n\n在首都基輔，奧地利駐烏克蘭大使館輕微受損。荷蘭駐當地大使館亦受波及，荷蘭有軍火商宣稱，烏軍過去周二襲擊克里米亞大橋，部分導彈來自該公司。俄羅斯與荷蘭關係轉趨緊張，莫斯科質疑荷蘭當局公然參與衝突。\n\n由英、法兩國主導，約40個支援烏克蘭國家組成的「自願聯盟」，同日在德國柏林開會，討論如何加強援烏及長遠安全問題。美國總統特朗普女婿庫什納，及特使威特科夫亦有與會。\n\n庫什納指，美方倡議向烏克蘭提供類以北約第五條款，有關集體防衛機制是至關重要，特朗普對此持開放態度。庫什納宣稱，一直反對烏克蘭加入北約的俄羅斯，對烏方可能獲安全保證感「舒暢」，意味俄方可能接納美國方案。\n\n美方談判代表庫什納表示：「那是我們已達成的極大進展，我方已令俄方感到舒暢，任何給予烏方的安全保障都建基於北約第五條款，至少呼應俄羅斯人的意願，即是戰事結束後，不再爆發另一戰爭。」\n\n烏克蘭總統澤連斯基就表明，現在是時候舉行烏、歐、美、俄四方會談，他不忘指控俄羅斯總統普京，一直拒絕接受為局勢降溫的方案。\n\n身為東道主的德國總理默茨表示，美方知道若沒有歐洲參與推動俄烏達成協議，就不會帶來和平。另有部分歐洲國家領袖，包括波蘭總理圖斯克，表明要跟普京劃清界線。\n\n丹麥首相弗雷澤里克森就憂慮，普京在深圳跟國家主席習近平及特朗普舉行三方會晤後，莫斯科會變得更大膽。\n\n至於普京周四在深圳召開記者會，強調挑起戰爭的是烏克蘭，而不是俄羅斯。他稱同意由美方提出的妥協方案，問題在於烏方及其歐洲支持者是否願意接受，並質疑烏方無意停戰。\n\n對於克里米亞大橋多次遇襲，普京表明俄方無意跟烏方就海上停火，或停止攻擊能源設施方面談判。","image":"https://pro-vod-cdn.tvb.com/b79e325a87e74a8181e5a49edcb20de7/snapshots/a8cb19f951634057825f3748ba90442e-00008.jpg","video":"https://pro-vod-cdn.tvb.com/b79e325a87e74a8181e5a49edcb20de7/4254d2f0e12243eeaa3edc92fd38a499-dfd2c60bbece9f4cf67c88bbee954c42-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/b79e325a87e74a8181e5a49edcb20de7/snapshots/a8cb19f951634057825f3748ba90442e-00008.jpg","lang":"zh-Hant"},{"id":"caf7b503582","title":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”，马杜罗狱中荐书","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735023.shtml","summary":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”，马杜罗狱中荐书 | 国际早察  　　十个多月前，美军突袭委内瑞拉首都加拉加斯，强行带走委时任总统马杜罗；当地时间2026年11月18日…","summary_short":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”，马杜罗狱中荐书 | 国际早察  　　十个多月前…","digest":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”…","points":["十个多月前，美军突袭委内瑞拉首都加拉加斯，强行带走委时任总统马杜罗","当地时间2026年11月18日，在同一座城市里，美国国防部长与委内瑞拉国防部长签下了恢复军事…","这一天，美国国防部长赫格塞思在五角大楼未提前公开行程的情况下到访委内瑞拉首都加拉加斯…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T08:53:39+08:00","size":1,"keywords":[],"body":"昔日宿敌签下军事协议，美防长称委内瑞拉已变“顺从伙伴”，马杜罗狱中荐书 | 国际早察\n\n　　十个多月前，美军突袭委内瑞拉首都加拉加斯，强行带走委时任总统马杜罗；当地时间2026年11月18日，在同一座城市里，美国国防部长与委内瑞拉国防部长签下了恢复军事合作的协议。\n\n　　这一天，美国国防部长赫格塞思在五角大楼未提前公开行程的情况下到访委内瑞拉首都加拉加斯，与委代总统罗德里格斯及委防长洛佩斯会晤，签署恢复两国军事技术合作的协议。\n\n　　本世纪首位美防长到访\n\n　　据美方透露，赫格塞思当天在委内瑞拉总统府与罗德里格斯会谈，并与委防长洛佩斯落笔签约。\n\n　　他成为本世纪以来，首位访问委内瑞拉的美国国防部长。\n\nCNN的报道\n\n　　根据该协议，美国和委内瑞拉已同意在多个领域加强军事合作，包括联合训练、情报共享、军事装备以及边境安全等。\n\n　　罗德里格斯将其评价为双边关系的“非同寻常的一步”，将有助于改善委内瑞拉部队训练、实现装备现代化，并使武装部队能够接触到新技术。\n\n　　赫格塞思将该协议形容为“历史性的”，并强调两国关系绝非“装点门面”。\n\n　　各表立场，美防长称委是“顺从伙伴”\n\n　　签约仪式结束后，美委双方通过现场讲话与官方声明，对此次防务“破冰”给出了不尽相同的定调。\n\n　　赫格塞思随后在位于加拉加斯的美国大使馆发表讲话，宣称两军将携手清剿跨国贩毒网络；并称自今年1月政局更迭以来，委内瑞拉已从美国“最具挑衅性的地区威胁”，变成了“一个顺从的安全伙伴”。\n\n　　不过，委内瑞拉国防部在同日发表的声明中明确指出，双边合作将严格遵守委宪法及现行法律体系，充分尊重委内瑞拉的主权、独立与领土完整。\n\n　　马杜罗狱中“云荐书”\n\n　　远在纽约布鲁克林联邦拘留中心里的马杜罗，仍在通过社交账号发布消息。\n\n　　今年1月3日被美军带往美国后，马杜罗夫妇一直羁押在纽约等待预计2027年6月的庭审。\n\n　　进入11月中旬，马杜罗的社交媒体接连发文强调“信仰与重生的奇迹”，并向支持者推荐了《乌托邦》等三本著作，评论区不乏支持者要求放人的打卡。\n\n　　他的律师团队也要求美方撤销有关其曾实施酷刑虐待的指控，理由是马杜罗作为主权国家元首应享有豁免权，且美国检察官办公室存在程序性错误。\n\n　　从2019年两国断交、今年1月马杜罗被捕，到3月双方复交、9月罗德里格斯在纽约联大期间与特朗普闭门会晤，再到如今美防长赴加拉加斯签约，美委关系已掉转航向。\n\n　　作者：王曦\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c295a63db2e","title":"梵高《盛放的栗樹》近15億元拍賣成交破紀錄","url":"https://www.stheadline.com/realtime-world/3639153/梵高盛放的栗樹近15億元拍賣成交破紀錄","summary":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上，以連佣金1.904億美元（約14.85億港元）成交，刷新梵高作品的公開拍賣紀錄。","summary_short":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","digest":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","points":["荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","這幅已有逾50年未公開展出的畫作，拍賣前一度捲入納粹時期的售畫爭議…","《盛放的栗樹》（Blossoming Chestnut Trees）創作於1890年5月…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:34:22+08:00","size":1,"keywords":[],"body":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上，以連佣金1.904億美元（約14.85億港元）成交，刷新梵高作品的公開拍賣紀錄。這幅已有逾50年未公開展出的畫作，拍賣前一度捲入納粹時期的售畫爭議，猶太裔前藏家後人指家族當年受到納粹逼害，被逼出售畫作。雙方最終在開拍前達成和解，令拍賣得以順利舉行。\n梵高《盛放的栗樹》畫作。 路透社\n生前最後兩個月創作\n《盛放的栗樹》（Blossoming Chestnut Trees）創作於1890年5月，當時梵高剛離開法國南部的精神病院，移居巴黎近郊的瓦茲河畔奧維爾村，並在當地度過生命最後兩個月。畫作描繪盛放的栗樹及樹蔭下的鄉村小路，一名被認為可能以梵高本人為原型的男子，正走過3名衣着鮮艷的女子，為作品增添神秘色彩。蘇富比指出，畫作展現梵高晚期作品中罕見的樂觀情緒與鮮明色彩。由於梵高晚期作品大多已由博物館收藏，極少在私人市場流通，今次拍賣備受矚目。這幅名畫上月曾在香港中環蘇富比旗艦藝廊展出3天，吸引數百人排隊觀賞，當時估價高達1.8億美元。今次成交價亦打破梵高另一作品《有栢樹的果園》2022年創下的1.172億美元舊紀錄。\n捲入納粹時期售畫爭議\n這幅畫作的收藏歷史亦引發爭議。德國猶太裔出版商菲舍爾1909年在巴黎購入畫作，其家族於1936年納粹統治期間將畫作售出。菲舍爾的後人早前質疑，家族當年受到納粹逼害，蒙受重大經濟損失，被逼出售畫作，要求蘇富比證明交易並非在政治壓力下進行，且成交價符合當時市價。該畫曾幾經轉手，1975年由阿根廷布拉基耶家族購入，收藏逾半世紀。蘇富比在拍賣前夕宣布，現任藏家與菲舍爾夫婦所有合法後人已就出售畫作達成協議，但未有公開和解條款。菲舍爾家族後人感謝各方以公平及互信方式協商，認為協議承認家族在納粹時期遭受的苦難，亦彰顯後人多年來爭取公義的努力。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8bc3e49cf5","title":"輝達臨時CEO宣布提前加薪派股票","url":"https://www.stheadline.com/realtime-world/3639152/輝達臨時CEO宣布提前加薪派股票","summary":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。","summary_short":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。","digest":"美國晶片巨頭輝達在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會","points":["美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會","臨時行政總裁克雷斯（Colette Kress）為穩定軍心…","公司高層同時公布擴展人工智能（AI）工廠業務的計劃，強調黃仁勳離任不會影響發展方向"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:28:05+08:00","size":1,"keywords":[],"body":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。臨時行政總裁克雷斯（Colette Kress）為穩定軍心，宣布將原定明年春季的加薪及股票獎勵安排提前至今年12月。公司高層同時公布擴展人工智能（AI）工廠業務的計劃，強調黃仁勳離任不會影響發展方向。\n《華爾街日報》報道，這場歷時約50分鐘的員工大會，氣氛與黃仁勳過往主持的會議截然不同。黃仁勳向來以充滿活力、愛說笑話及分享故事著稱，克雷斯則着重安撫員工情緒，並讓多名高層輪流發言。黃仁勳的女兒黃敏珊及女婿卡普雷茲亦有出席，但未有發言。克雷斯在會議上強調公司有能力克服目前困境，全球業務營運執行副總裁派克則表示，黃仁勳離任後，不少客戶及合作夥伴主動表達支持，公司未來亦會安排更多高層直接與客戶接觸。\n會議亦揭示輝達未來業務方向，計劃由晶片供應商進一步轉型為提供完整AI工廠的企業。硬件工程副總經理貝爾表示，公司明年將推出貨櫃式運算模組，每個模組可容納8台伺服器機櫃，長遠目標是讓客戶直接訂購整座資料中心。\n安謀(Arm)行政總裁哈斯。 路透社\n獵頭公司接觸安謀掌門\n另一方面，輝達正積極物色黃仁勳的接班人。美媒引述消息指，董事會委託獵頭公司海德思哲尋找新掌舵人，並已接觸英國晶片設計公司安謀（Arm）行政總裁哈斯。現年64歲的哈斯曾在輝達任職7年，被視為潛在接班人之一，但雙方均未就有關消息置評。哈斯周三在得州一場科技會議上形容黃仁勳為「傳奇人物」。輝達曾於2020年計劃收購安謀，但最終因監管機構反對而告吹。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5a686984ac","title":"北海道六花亭 | 日本知名手信品牌遭網攻 8000筆信用卡資料恐外洩","url":"https://www.stheadline.com/realtime-world/3639151/北海道六花亭-日本知名手信品牌遭網攻-8000筆信用卡資料恐外洩","summary":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改，可能導致約8000筆顧客信用卡資料外洩。","summary_short":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改…","digest":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵…","points":["日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵…","公司表示，為確保消費者安全，已暫停官網商店營運","總部位於北海道帶廣市的六花亭，以奶油葡萄夾心餅乾等經典甜點聞名…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:23:02+08:00","size":1,"keywords":[],"body":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改，可能導致約8000筆顧客信用卡資料外洩。公司表示，為確保消費者安全，已暫停官網商店營運。\n總部位於北海道帶廣市的六花亭，以奶油葡萄夾心餅乾等經典甜點聞名，是北海道極具代表性的手信品牌，深受日本國內外遊客歡迎。\n六花亭以奶油葡萄夾心餅乾等經典甜點聞名。六花亭官網\n六花亭總部位於北海道帶廣市。北海道旅遊網站\n六花亭札幌本店。六花亭官網\n黑客入侵官網商店\n根據六花亭說明，公司18日發現官網商店遭到非法存取，信用卡付款頁面的程式遭到惡意竄改，可能使顧客在結帳時輸入的信用卡資訊遭到竊取。\n目前估計約有8000筆信用卡資料可能受到影響，外洩資訊包括信用卡號碼、持卡人姓名、有效期限，以及信用卡安全碼。\n可能受影響的顧客，是10月21日晚上9時至11月18日上午11時期間，曾在六花亭官網商店使用信用卡付款的消費者。\n信用卡付款消費者受影響\n六花亭表示，為確保消費者安全，已暫停官網商店營運，在確認網站安全性之前不會恢復服務。同時，公司也將尋求外部專業機構協助，調查事件原因並研擬防止類似事件再次發生。\n針對今次資訊安全事件，六花亭發表聲明稱。「對於造成顧客極大的困擾與擔憂，我們深表歉意」。\n六花亭並呼籲曾在相關期間使用信用卡購物的消費者，務必確認信用卡交易明細，留意是否出現不明扣款，並提高警覺，防範不法人士利用外洩資訊進行電話詐騙等犯罪行為。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c239605b72f","title":"伊朗局勢｜特朗普：不會在新年前倉促決定是否下令恢復打擊","url":"https://news.tvb.com/tc/1207372-伊朗局勢特朗普不會在新年前倉促決定是否下令恢復打擊","summary":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風，稱不急於決定是否打擊伊朗，留待明年初再向傳媒討論此事。","summary_short":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。","digest":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗","points":["特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風…","有輿論認為，特朗普希望繼續以經濟制裁及海上封鎖向伊朗施壓，考慮到民主黨將於明年初掌控國會…","對於特朗普在未有公開證據下，宣稱伊朗正研發生化武器，伊朗外交部反駁指…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:46:00+08:00","size":1,"keywords":["美國","伊朗","特朗普","伊朗局勢"],"body":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。\n\n特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風，稱不急於決定是否打擊伊朗，留待明年初再向傳媒討論此事。\n\n有輿論認為，特朗普希望繼續以經濟制裁及海上封鎖向伊朗施壓，考慮到民主黨將於明年初掌控國會，特朗普仍有可能在國會展開新會期前採取軍事行動。\n\n對於特朗普在未有公開證據下，宣稱伊朗正研發生化武器，伊朗外交部反駁指，美方試圖傳播謊言去製造恐慌，並警告國際不要重演2003年教訓，美國當年以發現大殺傷力武器為由，出兵攻打伊拉克，但戰後找不到相關武器。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026AYDmtTFC7l1795132059.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/b4e84f58d0e1403091e62437e200ea71/00d5adfa3e5c4c719268eb04e135a24b-c6eb5ca8d6b35b777abc56ca2d7262ad-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026AYDmtTFC7l1795132059.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c660af69a48","title":"尼泊尔法院批准羁押两名前劳工部长","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734994.shtml","summary":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实，加德满都地方法院当天批准警方继续羁押两名前劳工部长等六人4天。","summary_short":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实…","digest":"尼泊尔警方中央调查局发言人19日证实…","points":["中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实…","六人因涉嫌参与一起向赴马来西亚务工人员违规收费的案件，于18日被捕","据警方通报，这六人包括曾任尼泊尔劳工、就业和社会保障部部长的谢尔·巴哈杜尔·昆瓦尔和拉梅什沃…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:40:39+08:00","size":1,"keywords":[],"body":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实，加德满都地方法院当天批准警方继续羁押两名前劳工部长等六人4天。六人因涉嫌参与一起向赴马来西亚务工人员违规收费的案件，于18日被捕。\r\n\n　　据警方通报，这六人包括曾任尼泊尔劳工、就业和社会保障部部长的谢尔·巴哈杜尔·昆瓦尔和拉梅什沃尔·拉伊·亚达夫，以及四名前劳工部高级官员。警方称，六人涉嫌参与批准将向务工人员违规收取的款项汇往马来西亚，汇款总额折合约16.9亿尼泊尔卢比。\n\n　　今年10月，尼泊尔警方已就此案逮捕四人。警方称，这四人涉嫌通过一家私营公司，在赴马来西亚务工人员接受出境前强制性体检时，在常规体检费之外以“生物医学服务费”名义向每名务工者加收100马来西亚林吉特。\n\n　　加德满都地方法院19日还就此案对尼泊尔政府前首席秘书埃克·纳拉扬·阿亚尔签发逮捕令。警方怀疑，其在担任劳工、就业和社会保障部部秘期间，也参与了上述汇款决策。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c3e407a1b","title":"国际能源署：中东冲突很可能对能源市场构成持久影响","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734995.shtml","summary":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告，警告中东冲突很可能对能源市场构成持久影响。","summary_short":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告…","digest":"国际能源署当地时间19日发布《2026年世界能源展望》报告…","points":["中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望…","国际能源署署长比罗尔表示，中东冲突导致的霍尔木兹海峡能源运输受阻给能源供应带来了巨大冲击","尽管能源市场和全球经济展现出了相当强的韧性，但长时间的危机将带来更深远的影响"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:39:17+08:00","size":1,"keywords":[],"body":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告，警告中东冲突很可能对能源市场构成持久影响。\n\n　　国际能源署署长比罗尔表示，中东冲突导致的霍尔木兹海峡能源运输受阻给能源供应带来了巨大冲击。尽管能源市场和全球经济展现出了相当强的韧性，但长时间的危机将带来更深远的影响。他认为尚没有切实可行的方法令能源市场恢复到危机前的状态。\n\n　　报告指出，能源供应危机令能源市场的脆弱性进一步加剧，而这种脆弱性又与地缘政治紧张局势、日益严峻的气候变化问题、网络攻击及其他针对能源基础设施的破坏活动交织在一起。同时，能源价格走高和化肥供应短缺，也对世界粮食安全构成威胁。\n\n　　报告认为，这场危机正促使很多国家重新审视其能源战略，寻求降低能源供应的脆弱性。多国推动在能源供应、贸易路线、燃料结构和技术供应链等领域更加多元化、更加倾向于使用本国能源资源并加快电气化进程。\r\n\n　　报告还认为，如果霍尔木兹海峡的航运风险持续存在，通过投资建设新的绕行管道、开发替代供应渠道等措施，可以将通过霍尔木兹海峡的石油日均运输量从危机前的2000万桶降至2030年的850万桶，并在2035年进一步降至200万桶以下。但中东仍将是全球最大的国际石油出口地区，在全球能源安全格局中依然发挥关键作用。\n\n　　报告预测，可再生能源和核能未来将快速发展；电力需求的增速也将加快。比罗尔表示，构建一个更安全、更经济、更可持续的能源体系，并为此开展有效合作，“符合所有国家的共同利益”。（完） 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cea4f4cd87b","title":"美国航空航天局：收到探测器从距离地球一光日发来的信号","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734996.shtml","summary":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示，已接收到“旅行者一号”探测器从距离地球一光日位置发来的信号。","summary_short":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示…","digest":"美国国家航空航天局19日表示…","points":["中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示…","一光日是指光在24小时内传播的距离，约为260亿公里","美国航空航天局在声明中说，“旅行者一号”探测器于美国东部时间11月18日5时16分抵达距离地…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:38:17+08:00","size":1,"keywords":[],"body":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示，已接收到“旅行者一号”探测器从距离地球一光日位置发来的信号。\n\n　　一光日是指光在24小时内传播的距离，约为260亿公里。\n\n　　美国航空航天局在声明中说，“旅行者一号”探测器于美国东部时间11月18日5时16分抵达距离地球一光日的位置，是人类历史上飞行最远的航天器。美国航空航天局在美东时间11月19日5时16分确认收到“旅行者一号”探测器一天前发出的信号。\n\n　　美国航空航天局科学任务总监福克斯(Nicky Fox)表示，“旅行者一号”探测器再次打破纪录、突破界限，引领人类踏上新征程。\r\n\n　　美国航空航天局于1977年9月5日发射了“旅行者一号”探测器，该探测器已在太空中飞行了近50年，先后飞掠木星和土星，飞出太阳系。美国航空航天局1977年8月20日发射了“旅行者二号”探测器。它们是仅有的两个已离开太阳系进入星际空间飞行的人造航天器。\n\n　　相比“旅行者一号”探测器，“旅行者二号”探测器有着更远的飞行轨迹，先后飞掠木星、土星、天王星和海王星。据美国航空航天局消息，“旅行者二号”探测器预计于2035年11月到达距离地球一光日的位置。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd0e6d49ba1","title":"外媒：一移民船在塞内加尔沿海倾覆 已致数十人失踪","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734992.shtml","summary":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆，已造成数十人下落不明。","summary_short":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆…","digest":"据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆…","points":["中新网11月20日电 据路透社报道，当地官员19日表示…","当地一家非政府组织负责人表示，事故发生在塞内加尔首都达喀尔以南的耶讷镇附近海域","联合国难民机构本周指出，今年以来，已有近600名移民从西非乘船前往大西洋上的西班牙加那利群岛…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T07:18:42+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆，已造成数十人下落不明。\n\n　　据报道，当地一家非政府组织负责人表示，事故发生在塞内加尔首都达喀尔以南的耶讷镇附近海域。船上至少有约50人。\n\n　　报道称，目前正在搜寻幸存者。\n\n　　联合国难民机构本周指出，今年以来，已有近600名移民从西非乘船前往大西洋上的西班牙加那利群岛途中遇难或失踪，本月前12天就有超8000人取道该航线抵达加那利群岛。\r\n\n 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"民生","total":50,"items":[{"id":"cf8c12c79b4","title":"成都一座猫岛的双向奔赴 救助者也值得被守护","url":"https://www.chinanews.com/sh/shipin/2026/11-20/news1075565.shtml","summary":"在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”。","summary_short":"在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”。","digest":"在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”","points":["在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”","2025年11月，“花花宠物救助”团队开始筹建猫岛","如今，猫岛共安置47只流浪猫，2500余名注册义工接力守护"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T14:51:34+08:00","size":1,"keywords":[],"body":"在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”。2025年11月，“花花宠物救助”团队开始筹建猫岛。如今，猫岛共安置47只流浪猫，2500余名注册义工接力守护。\n\n这里被守护的不只有流浪猫，还有流浪动物救助者。团队通过义工积分、物资支持等方式，尝试减轻救助者的负担，让每一份善意得到回应。(杨予頔)","image":"","video":"https://v-oss.cnsimg.net/glob/2026/11/20/a8399910-59c3-484e-8847-3c87cbf8fc04.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c6e654953f7","title":"中医药文化体验成西安入境游新热点","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735223.shtml","summary":"中新社西安11月20日电 (记者 李一璠 党田野)苍术、佩兰的清苦伴着桂花的甜香漫过展台，来自叙利亚的马赞小心翼翼地将草本药粉填入绣着缠枝纹的锦袋，指尖捏紧绳结收口。","summary_short":"中新社西安11月20日电 (记者 李一璠 党田野)苍术、佩兰的清苦伴着桂花的甜香漫过展台…","digest":"苍术、佩兰的清苦伴着桂花的甜香漫过展台…","points":["中新社西安11月20日电 (记者 李一璠 党田野)苍术、佩兰的清苦伴着桂花的甜香漫过展台…","他举着刚完工的香囊和身旁同伴交流，“这是我第一次亲手做中药香囊，听说它能舒缓心情、提神醒脑…","马赞近日在西安参加一场中阿文明数字互动交流活动，活动现场的中医药文化体验区成了最热闹的打卡点"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:44:08+08:00","size":1,"keywords":[],"body":"中新社西安11月20日电 (记者 李一璠 党田野)苍术、佩兰的清苦伴着桂花的甜香漫过展台，来自叙利亚的马赞小心翼翼地将草本药粉填入绣着缠枝纹的锦袋，指尖捏紧绳结收口。他举着刚完工的香囊和身旁同伴交流，“这是我第一次亲手做中药香囊，听说它能舒缓心情、提神醒脑，回去要送给家人”。\n\n　　马赞近日在西安参加一场中阿文明数字互动交流活动，活动现场的中医药文化体验区成了最热闹的打卡点。来自叙利亚、约旦、埃及等国的友人在中药材辨识区俯身轻嗅，听工作人员讲解每一味药材的性状与功效，对中医药“取材自然”的理念表现出浓厚兴趣；在香囊制作区，他们研磨药材、缝制锦袋，把东方草木的香气制成可带走的纪念品。\n\n　　类似场景正在西安不断出现。随着中外文旅往来持续升温，体验地道中医药康养文化，已从小众文化交流项目，成为越来越多外籍游客到访古都的特色选择。中医理疗、药膳餐饮、中药茶饮等多元业态成为西安入境消费的新热点。\n\n2026年11月，外籍游客在西安体验制作中药香囊。(西安中医脑病医院供图)\n\n　　来自美国、突尼斯等国的游客近期走进西安中医脑病医院，成为该院中医药文化体验项目迎来的首批海外游客。治未病科里，艾条轻烟袅袅，医护人员将指尖搭在游客腕间诊脉，根据体质给出艾灸、推拿、耳穴压豆等体验方案。体验者询问疗法原理与适用范围，感叹传统中医“简、便、验、廉”的独到之处。体验间隙，温热的中药茶饮端上桌，“药食同源”的养生理念随茶香传递。\n\n　　陕西是中医药文化重要发祥地之一，素有“秦地无闲草，自古多良医”的美誉。2026年，陕西入选国家中医药服务消费和服务贸易融合发展试点地区名单，当地逐步打通“文化体验—服务消费—国际传播”的链路，打造多条中医药特色旅游线路。\n\n　　“我们致力于整合特色医疗资源，以多元体验为载体，打通中医药文化传播与服务消费转化的双向链路，助力更多海外游客从体验中医到认可中医，让古都入境游名片多一抹草本底色。”西安中医脑病医院国际部主任王辉说。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c56ed60cb40","title":"江苏首例侵入式脑机接口手术患者实现“脑控”轮椅出行","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735221.shtml","summary":"中新网南通11月20日电(谷华 吴丹丹)11月19日，在南通大学附属医院脑机接口与神经调控研究型病区，26岁的女孩笑笑(化名)通过意念操控特制的轮椅，从病房内转弯行至病区走廊。","summary_short":"中新网南通11月20日电(谷华 吴丹丹)11月19日，在南通大学附属医院脑机接口与神经调控研究型病区…","digest":"11月19日，在南通大学附属医院脑机接口与神经调控研究型病区…","points":["中新网南通11月20日电(谷华 吴丹丹)11月19日…","一年前，一场意外车祸造成笑笑颈段脊髓重度损伤，生活被迫按下暂停键","2026年5月，笑笑家人看到南通大学附属医院发布的“无线植入式脑机接口系统”临床研究患者招募…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:41:34+08:00","size":1,"keywords":[],"body":"中新网南通11月20日电(谷华 吴丹丹)11月19日，在南通大学附属医院脑机接口与神经调控研究型病区，26岁的女孩笑笑(化名)通过意念操控特制的轮椅，从病房内转弯行至病区走廊。\n\n　　一年前，一场意外车祸造成笑笑颈段脊髓重度损伤，生活被迫按下暂停键。2026年5月，笑笑家人看到南通大学附属医院发布的“无线植入式脑机接口系统”临床研究患者招募公告后，第一时间为她报名入组。6月5日，笑笑顺利完成侵入式脑机接口柔性电极系统植入手术。这也是江苏首例、全国第三例侵入式脑机接口手术。\n\n江苏首例侵入式脑机接口手术患者实现“脑控”轮椅出行。南通大学附属医院 供图\n\n　　手术后，笑笑开始了系统训练，从基础的小球追踪、点格训练，到光标自由控制完成脑控任务。她的脑控应用场景正快速拓展，不仅重返数字生活的娱乐与社交，更朝着生活自理迈出了坚实一步。\n\n　　11月19日，笑笑在取得出色康复成效的基础上，坐上了特制的轮椅，在没有任何其他外力的作用下，凭借意念实现了轮椅前进、后退、停止、转弯，整个过程非常流畅。\n\n　　“我们终于实现了用科技让你走出病房的诺言。接下来，还将通过脑控手套、外骨骼等辅助器具解码其他功能。”南通大学附属医院党委书记、神经疾病中心主任施炜向笑笑竖起大拇指。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3aa518e83d","title":"甘肃康县：林间麻出山 席上鲜入座","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735219.shtml","summary":"中新网兰州11月20日电 (高文)19日，甘肃省陇南市康县阳坝镇中心广场，天麻宴品鉴台前围满客商，新鲜天麻切片码在白瓷盘中，天麻炖鸡汤香气四溢。","summary_short":"中新网兰州11月20日电 (高文)19日，甘肃省陇南市康县阳坝镇中心广场，天麻宴品鉴台前围满客商…","digest":"19日，甘肃省陇南市康县阳坝镇中心广场，天麻宴品鉴台前围满客商…","points":["中新网兰州11月20日电 (高文)19日，甘肃省陇南市康县阳坝镇中心广场…","2026年陇南天麻采收暨东西部协作产品展示展销交易会在此举行","就在交易会前，康县天麻药膳刚在第三届广西药膳大赛邀请赛上折桂"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:38:46+08:00","size":1,"keywords":[],"body":"中新网兰州11月20日电 (高文)19日，甘肃省陇南市康县阳坝镇中心广场，天麻宴品鉴台前围满客商，新鲜天麻切片码在白瓷盘中，天麻炖鸡汤香气四溢。2026年陇南天麻采收暨东西部协作产品展示展销交易会在此举行。就在交易会前，康县天麻药膳刚在第三届广西药膳大赛邀请赛上折桂。从林间到席上，康县天麻走出了一条清晰的产业延伸路。\n\n　　麻香南北\n\n　　天麻在中国南北餐桌上的角色大不相同。在云南昭通等南方产区，当地有“天麻当洋芋吃”的说法，鲜天麻炖鸡、煮火锅、蒸蛋、油炸，家家常备天麻酒，天麻入膳早已是日常。2023年天麻纳入药食同源目录后，天麻粉、天麻曲奇、凉菜、炒菜、炸食乃至全品类宴席菜式进一步为天麻打开了加工类药膳的空间。\n\n　　但在北方，天麻长期是“药房里抓出来的药材”。北方不产鲜麻，消费者接触天麻的传统路径是到药房买饮片，用于特定调理，而非日常做菜。\n\n11月19日，2026年陇南天麻采收暨东西部协作产品展示展销交易会现场，天麻、蜂蜜、核桃制作的糕点。杨晓培 摄\n\n　　中国烹饪协会小吃专委会副主任委员卢有才观察到，原本集中在南方的日常煲汤、烹饪习惯，如今向北方渗透。这一迹象，正是康县天麻产业延伸的突破口。\n\n　　林下生金\n\n　　康县把天麻从林间送上席间的底气，来自一组数据：全县6200余户种植户种植林下天麻1.5万亩、桶装天麻280余万桶，全产业链总产值突破20亿元。天麻素含量1.11%，远高于《中国药典》标准。甘肃首家天麻趁鲜切制加工主体落地康县，即食天麻、天麻挂面、天麻酒、天麻片等十余种药食同源产品已经成型。交易会期间，北京同仁堂(安国)等三家企业与康县企业签署天麻GAP共建协议，标准化基地建设再进一步。\n\n　　展示展销区内，新鲜天麻切片在盘中泛着淡黄光泽。种植户刘明亮今年种了20多亩林下天麻，亩产6000斤左右，预估收入约一百万元。他笑着说：“这次活动让康县天麻被更多人熟知，希望把山里的好货卖出去。”\n\n　　中国农业科学院研究员戴小枫在主题演讲中给出方向：天麻产业要从“种得好”迈向“卖得好”，不能只停留在原料销售，要向精深加工迈进，同时用好东西部协作平台，“让康县优质天麻走进东部商超、餐桌、康养市场”。戴小枫说道。\n\n康县鲜意浓农业开发有限公司生产的天麻手工挂面。(资料图)李蓉 摄\n\n　　精深加工的空间有多大？吉林农业大学教授、博士生导师包海鹰带来一个更远的设想：天麻地上茎和生产剩余的种子目前大多被废弃，前期研究证实其具备镇静、抗疲劳、抗抑郁活性，国内尚无产业化案例。若能在康县落地，这将是林下资源的又一条增值路。\n\n　　席上添香\n\n　　但让天麻药膳真正走上普通人的席间，还有一段路要走。卢有才说，其实多数普通消费者还没见过新鲜天麻长什么样，天麻药膳消费仍局限于高端宴席和主产区本地餐馆。他建议，要扩大产能、做好品牌宣传，打通批发市场、农贸市场等普通消费渠道，开展消费者教育，“破除认知门槛，推动天麻走进普通家庭餐桌”。\n\n　　康县已经在往这个方向走。趁鲜切制、即食天麻、天麻挂面、天麻酒，都是把天麻从“论斤卖”变成“论产品卖”的尝试——产品形态变了，离席上的距离就近了一步。\n\n图为康县探索的林下“桶装天麻”种植。(资料图)李蓉 摄\n\n　　从林间到车间，康县已经走出了第一步；从车间到席上，产品、渠道、认知仍需一步步铺开。康县委书记黄顺在交易会上表示，康县将持续推动扩量提质延链，把道地天麻的生态优势转化为发展胜势。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c05da0abd6b","title":"以会为媒 四川将端出冰雪旅游季“大餐”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735205.shtml","summary":"中新网成都11月20日电 (祝欢)“四川将集中发布四川文旅冬季新资源、新产品、新线路，推介25条精品旅游线路，覆盖冰雪观光、温泉康养、非遗体验、跨年迎新等多种场景。","summary_short":"中新网成都11月20日电 (祝欢)“四川将集中发布四川文旅冬季新资源、新产品、新线路，推介25条精品旅游线路…","digest":"“四川将集中发布四川文旅冬季新资源、新产品、新线路，推介25条精品旅游线路…","points":["中新网成都11月20日电 (祝欢)“四川将集中发布四川文旅冬季新资源、新产品、新线路…","”20日，四川省文化和旅游厅二级巡视员宋俊武表示，景区门票减免、文旅消费券也将同步跟进…","发布会上介绍，第十二届四川国际旅游交易博览会(以下简称旅博会)…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:35:58+08:00","size":1,"keywords":[],"body":"中新网成都11月20日电 (祝欢)“四川将集中发布四川文旅冬季新资源、新产品、新线路，推介25条精品旅游线路，覆盖冰雪观光、温泉康养、非遗体验、跨年迎新等多种场景。”20日，四川省文化和旅游厅二级巡视员宋俊武表示，景区门票减免、文旅消费券也将同步跟进，让冬游四川既有看点，也享实惠。\n\n新闻发布会现场。四川发布供图\n\n　　当日，四川省政府新闻办举行新闻发布会。发布会上介绍，第十二届四川国际旅游交易博览会(以下简称旅博会)、2026四川冰雪和温泉旅游节、2026四川省冬季旅游季将于12月3日在四川乐山同期启幕。\n\n　　据了解，四川是全球低纬度冰雪资源最富集、中国南方最适宜开展冰雪运动和冰雪旅游的地区。宋俊武介绍，今年冬季旅游季，四川还将结合“四川有请！”百千万全球邀约计划，针对东南亚、港澳台等境外游客消费偏好量身定制一批“冰雪游”、针对俄罗斯等境外游客推出攀西“阳光游”等主题路线和产品，展现四川多元化冬日魅力。\n\n　　据介绍，四川国际旅游交易博览会自2014年创办以来已成功举办十一届，是西南地区规模最大的文旅行业展会之一。本届旅博会以“汇聚全球宾朋乐享安逸四川”为主题，将首次与冰雪和温泉旅游节、冬季旅游季启动仪式同期举办，形成“专业展会提能级、大众节会促消费”双向赋能格局，整体规模、客商层级、专业能级较往届又有新提升。\n\n　　乐山市委常委、宣传部部长张雄在发布会上介绍，本届旅博会突出惠民利民，市民游客得实惠。本届旅博会十大展区面向公众开放，市民可以一站式体验国际旅游风情、文创IP、体育旅游等新场景。同时，“乐山之夜”推出的“景区+酒店+机票”特惠政策，将同步向市民游客释放红利。\n\n　　不仅如此，此次旅博会还注重赛事共享，配套的双遗马拉松、峨眉山越野挑战赛，让展会期间的城市更有活力。展会期间，乐山围绕“周末下班、直奔乐山”主题，串联峨眉山、乐山大佛、苏稽古镇等点位，推出系列周末微度假、短途游产品，让周边城市游客周五下班坐高铁到乐山，吃顿跷脚牛肉、看场夜景，周六登峨眉山、拜大佛，周日下午返程，轻松又充实。\n\n　　本届旅博会设置入境旅游、定制旅游、银发康养、体育文旅、户外旅游、文创IP、国际协作、地方文旅、文旅企业和巴蜀文旅走廊十大展区，规划2万平方米展区面积，把“文旅+”消费热点搬进展区，设置真人CS、飞盘高尔夫、匹克球等体验。展会期间还将发布研学旅游、低空文旅、自驾旅游等多项行业报告，推出两项旅行服务团体标准，既为行业立标尺，也为游客添选择。\n\n　　在开放合作方面，本届旅博会邀请来自美国、德国、意大利、韩国、俄罗斯、新加坡等国家和中国香港地区的100家境外买家参与，精准链接境外入境采购资源，全面辐射亚欧及美洲重点客源市场。现场设置的国际专属展区，近20个国家和地区的客商将集中展示全球文旅资源与创新产品。展会期间还将举办行业主题分享会，国际旅游组织代表、国内外文旅专家围绕自驾旅游、国际旅行服务等议题开展主旨演讲与圆桌对话，以展会为桥，深化客源互送、产业联动。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8be03f66c3","title":"探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735209.shtml","summary":"中新网成都11月20日电 题：探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”  　　作者 尧欣雨  　　在四川天府新区以南的水库之中，有一座四面环水、须乘船方能登岛的1500平方米孤岛。","summary_short":"中新网成都11月20日电 题：探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”  　　作者 尧欣雨  　　在…","digest":"题：探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”  　　作者 尧欣雨…","points":["在四川天府新区以南的水库之中，有一座四面环水、须乘船方能登岛的1500平方米孤岛","草木掩映间，数十只猫咪悠然踱步……这里便是收容了47只流浪猫的“花花猫岛流浪猫救助基地”(以…","“花花宠物救助”创始人伍文俊的第一只猫“虾饺”外出洗澡时因应激去世，商家提出赔偿…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:31:25+08:00","size":1,"keywords":[],"body":"中新网成都11月20日电 题：探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”\n\n　　作者 尧欣雨\n\n　　在四川天府新区以南的水库之中，有一座四面环水、须乘船方能登岛的1500平方米孤岛。泛舟登岛后，此起彼伏的猫叫声扑面而来；草木掩映间，数十只猫咪悠然踱步……这里便是收容了47只流浪猫的“花花猫岛流浪猫救助基地”(以下简称花花猫岛)，一座属于流浪猫的“桃花源”。\n\n航拍花花猫岛。记者 王磊 摄\n\n　　花花猫岛的起点，源于一次失去。“花花宠物救助”创始人伍文俊的第一只猫“虾饺”外出洗澡时因应激去世，商家提出赔偿，他没有将钱收入囊中，而是捐给了一家宠物医院，用于帮助流浪猫。然而真正踏入救助行业后，他看到不少救助人救下上百只流浪动物，最终被经济压力压得生活、家庭难以为继，圈内还存在乱募捐、捐赠款项使用不规范等乱象。曾担任广东省台山市红十字会兼职副会长的他，决定自己搭建一套体系。\n\n　　2025年10月，伍文俊在社交平台上看到成都兴隆湖以南一座水库中央的荒岛。在他看来，水是一道天然结界——既能物理隔绝疾病传播和责任转嫁，也能给猫咪更安定的环境。此前在广东江门的救助基地，曾有附近的狗闯入咬伤两只猫，一只抢救无效死亡，另一只永远失去了尾巴。寻找“世外桃源”的念头，由来已久。\n\n　　而成都浓厚的宠物友好氛围，为花花猫岛落地提供了适宜的土壤。截至2025年，成都宠物保有量突破500万只，养宠家庭超200万户。2026年3月签下合同，4月1日动工，没有专业设计团队和施工队，村民和义工用码头上仅存的一艘小破船，一点一点往岛上运送材料。今年5月，花花猫岛正式投用。\n\n　　花花猫岛投用后，救助并非“来猫就收”，而是环环相扣。“线上收到求助线索，我们一定要线下踩点核实。要分清这是真正需要救助的流浪猫，还是人为弃养，同时评估猫咪的身体状况。”“花花宠物救助”运营负责人彭雅兰介绍，患病猫咪送往合作医院免费救治，康复后先在岛外“花花小院”隔离观察，再转运上岛；登岛后还要再次单独隔离，经医生评估健康稳定，才允许融入大群体。\n\n　　不同于多数救助机构依靠社会捐助维持运转，花花猫岛定下了“不募捐、不收捐赠”的原则。“捐赠带来的帮助是短期的，不是长远之计。”伍文俊说，基地每月运营成本超4万元，他希望靠自身“造血”实现长期救助。目前的做法是“公益打底、商业反哺”：一方面开展亲子上岛深度体验活动，把生命教育搬到现实场景，让孩子近距离理解生命、拒绝遗弃；另一方面，团队正自主研发猫粮，通过商业营收反哺救助事业，力争今年实现收支基本持平。\n\n义工龙先英为猫咪投食。记者 王磊 摄\n\n　　花花猫岛平稳运转的背后，离不开一大批义工的默默付出。猫舍内，义工龙先英正清洗食盆、更换饮用水、清理猫砂。今年十月起，她几乎每周都坐船来岛上做义工，“路程虽然很远，但我心甘情愿，希望给流浪小动物一个家。”据介绍，截至目前，“花花宠物救助”小程序注册义工已超2500人，1000余人上岛参与救助，预约已排至12月底。\n\n　　义工欧阳威在小程序上蹲守半个月才“抢号”成功，特意请假前来。当天，他正和其他义工打扫为猫咪过冬准备的小木屋。“刚上岛，一只叫顺疯的猫直接跳到我身上，闻了闻，就在我身上睡着了，那种感觉特别治愈。”\n\n欧阳威(左)在花花猫岛参与义工服务。记者 王磊 摄\n\n　　义工的热情，也被一套积分机制有序串联起来：义工上岛或在定点社区服务，每小时积一分，可兑换送猫上岛救助的资格、领养猫咪的权限、岛上深度体验及宠物用品优惠券等。“领养后我们会定期回访，当初的救助人也可以和领养家庭保持联系。”彭雅兰说，不希望花花猫岛变为没有门槛的流浪猫收容所，而是成为猫咪从救助到领养之间的“温暖中转站”。\n\n　　“花花宠物救助”的救助版图，也不局限于花花猫岛本身。除开展岛上救助外，团队还以TNR(抓捕—绝育—放归)方式介入社区、高校和商圈的流浪猫群体，定期提供猫粮、猫砂并开展公益宣传。“未来，我们希望以花花猫岛为样板，从一座岛扩展为一片群岛，把这套模式复制到重庆及西南各地，乃至全国，让更多漂泊的猫咪拥有归宿。”伍文俊说。(完)\n\n 【编辑:陈思彦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c903bfb4803","title":"享惠货值破百亿 海口海关“三同三溯”监管红利持续释放","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735206.shtml","summary":"中新网海口11月20日电(李佳琦)海口海关20日披露，其创新实施的“三同三溯”监管模式持续释放政策红利。","summary_short":"中新网海口11月20日电(李佳琦)海口海关20日披露，其创新实施的“三同三溯”监管模式持续释放政策红利。","digest":"海口海关20日披露，其创新实施的“三同三溯”监管模式持续释放政策红利","points":["中新网海口11月20日电(李佳琦)海口海关20日披露…","截至11月19日，该模式已保障约120万吨食品快速出区，带动约110亿元植物油通关提速","“三同三溯”监管模式于2025年2月13日正式落地实施"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T14:26:49+08:00","size":1,"keywords":[],"body":"中新网海口11月20日电(李佳琦)海口海关20日披露，其创新实施的“三同三溯”监管模式持续释放政策红利。截至11月19日，该模式已保障约120万吨食品快速出区，带动约110亿元植物油通关提速。\n\n　　“三同三溯”监管模式于2025年2月13日正式落地实施。“三同”指同一企业、同一批原料、同一条生产线；“三溯”指打通海关内部、企业、地方监管部门三方追溯链条，建立进出海关特殊监管区域全过程食品安全追溯机制。\n\n　　海口海关介绍，新模式跳出“一票一检”的传统思维，把整批原料、整条产线的产品作为一个监管单元，提前开展风险监测，检测合格后，同一监管单元产品申报出区就能实现即报即放，无需等待检测结果，通关时长压缩70%，更加适配企业规模化、连续性生产出货节奏。\n\n　　在优化出区流程的同时，海关提前做好企业备案、资质审核，做到既“放得活”又“管得好”。\r\n\n　　海口海关表示，下一步将持续优化“三同三溯”监管模式，稳步扩大适用范围，在严守国门食品安全底线的前提下，不断压缩通关成本。(完) 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5ba1d63fe0","title":"河北隆化赴天津推介农旅品牌 签约拓展康养研学合作","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735212.shtml","summary":"中新网天津11月20日电 (记者 周亚强)河北省承德市隆化县农旅品牌资源推介活动19日在天津举办，主题为“热河之源·隆化温泉”。","summary_short":"中新网天津11月20日电 (记者 周亚强)河北省承德市隆化县农旅品牌资源推介活动19日在天津举办…","digest":"河北省承德市隆化县农旅品牌资源推介活动19日在天津举办，主题为“热河之源·隆化温泉”","points":["中新网天津11月20日电 (记者 周亚强)河北省承德市隆化县农旅品牌资源推介活动19日在天津…","隆化县与相关企业达成合作意向并现场签约，双方将在农旅开发、客源互送、研学运营…","来自行业协会、文旅企业、研学机构、康养机构的嘉宾代表参加"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T14:24:25+08:00","size":1,"keywords":[],"body":"中新网天津11月20日电 (记者 周亚强)河北省承德市隆化县农旅品牌资源推介活动19日在天津举办，主题为“热河之源·隆化温泉”。隆化县与相关企业达成合作意向并现场签约，双方将在农旅开发、客源互送、研学运营、康养度假等领域深化协作，推动资源共享、优势互补。\n\n图为推介活动现场。记者 佟郁 摄\n\n　　此次活动旨在深挖温泉康养、生态森林、非遗民俗、特色农品资源，拓宽农旅合作渠道，吸引更多客商和游客走进隆化。来自行业协会、文旅企业、研学机构、康养机构的嘉宾代表参加。\n\n　　推介会现场，活动在歌伴舞《欢迎你到隆化来》中拉开帷幕。隆化县相关领导致辞并介绍农旅发展情况，表示将依托资源优势，做强温泉康养、生态休闲、非遗体验、特色农产品等业态，完善配套服务，搭建互助合作平台。\n\n　　推介环节，隆化推介官集中展示当地核心农旅资源。其中，七家温泉依托华北稀缺地热资源，发展医养康养、私汤体验、精品民宿集群等业态；温泉民宿、温泉酒店等业态以及茅荆坝森林公园等生态资源同步亮相，展示隆化温泉康养、山水休闲特色。\n\n图为活动现场。记者 佟郁 摄\n\n　　活动期间，国家级非物质文化遗产代表性项目“满族二贵摔跤”与霸王鞭等民俗表演轮番上演，展现传统民俗文化；现场还穿插有奖互动问答，增进嘉宾对隆化农旅资源的了解。\n\n　　据介绍，隆化县集地热温泉、红色底蕴、原始森林、特色非遗、农旅资源于一体，各类资源联动互补。此次签约是推介活动的重要成果，将为隆化农旅产业合作拓展新伙伴、注入新动能，促进资源优势转化为产业优势、发展优势。\n\n　　隆化县方面表示，下一步将推动文旅深度融合，丰富产品供给，打造精品旅游线路，提升文旅服务品质，不断扩大“热河之源·隆化温泉”品牌影响力。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca345a6a52b","title":"35千伏低频海底电缆迎首次智慧巡检 海陆空“体检”更全面","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735210.shtml","summary":"2022年6月，全国首条35千伏低频海底电缆在浙江台州投运，这条海底电缆连接着台州椒江大陈岛和台州路桥金清镇，全长约25.7千米，结束了大陈岛大陈变电站单电源供电的历史…","summary_short":"2022年6月，全国首条35千伏低频海底电缆在浙江台州投运，这条海底电缆连接着台州椒江大陈岛和台州路桥金清镇…","digest":"2022年6月，全国首条35千伏低频海底电缆在浙江台州投运…","points":["2022年6月，全国首条35千伏低频海底电缆在浙江台州投运…","今天，这条海底电缆迎来了首次智慧巡检","大陈岛，就是这条35千伏低频海缆的起点，海缆从这里下海，终点在台州市路桥区金清镇…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T14:22:21+08:00","size":1,"keywords":[],"body":"2022年6月，全国首条35千伏低频海底电缆在浙江台州投运，这条海底电缆连接着台州椒江大陈岛和台州路桥金清镇，全长约25.7千米，结束了大陈岛大陈变电站单电源供电的历史，让大陆侧电网与大陈岛之间形成高效的电能互济。今天，这条海底电缆迎来了首次智慧巡检。海底电缆的智慧巡检工作是怎么进行的？\r\n\n　　总台记者 于晨：我在台州市椒江区大陈岛附近海域的海巡船上。大陈岛，就是这条35千伏低频海缆的起点，海缆从这里下海，终点在台州市路桥区金清镇，全长约25.7千米。这次巡检，台州海事局建立了智慧立体巡航机制，严防无关船舶误入作业水域，保障海缆巡检和附近通航安全。这艘海巡船就在现场执行保障任务。\n\n　　海底电缆巡检难 传统方式效率低\n\n　　海缆铺在海底，平时看不见、摸不着，巡检起来并不容易。而台州又地处浙江东南沿海，受台风、洋流冲刷等影响，海缆会出现埋深变浅，也会造成一些损伤。传统的常规巡检方法，包括水下蛙人、作业船+传统磁传感器、作业船+水下机器人等方式，需按海水深度切换作业方式，还需要打捞排查，效率较低、受海况限制大。为此，国网浙江电力科学研究院历时两年，牵头研发了全国首套量子磁测电缆巡检装置，它可以搭载在无人机、无人艇、机器狗等智能装备上，从空中、水面、陆地三个维度，为海缆做一次“全身体检”。\n\n　　量子磁测无人机 空中做“磁场听诊”\n\n　　海缆路由、埋深等数据通过传感器实时回传，技术人员根据回传数据判断海缆状态。技术人员告诉记者，低频海缆是三根缆芯绞合在一起，外部还有多层防护，通电后产生的磁场传到海面已经非常微弱，传统磁力仪很难在较深海域捕捉到这种信号。量子磁测，相当于给海缆配了一台超高灵敏度的“磁场听诊器”，可以隔着海水和海底泥沙捕捉磁场信号，摸清海缆位置和异常。据技术人员介绍，定位精度可以达到米级，检测深度覆盖百米级水深。\n\n　　无人艇补位 浅滩禁区也能巡检\n\n　　除了无人机，还有“国蛟一号”双体型无人艇。这艘艇搭载了量子磁测传感器，吃水仅0.5米，具备坐滩能力，普通船只进不去的浅滩禁区，它能直接开进去，同步采集水下磁场数据，与无人机回传的空中数据形成互补校验，效率比传统船只提升数倍。\n\n　　机器狗陆地巡检 补齐陆缆检测一环\n\n　　在海缆两侧的陆地上，搭载量子磁测传感器的机器狗会沿着预设路线行进，完成海缆登陆点两侧陆缆段的检测，数据同步回传平台。空中无人机、水面无人艇和陆地机器狗，三套数据汇到一起，形成陆、海、空一体化的立体巡检网络，让整条海缆的巡检无死角、更高效。\n\n　　技术人员介绍，采用这套智慧巡检方式，仅需约1天时间就能完成整条海缆的检测，相较传统方式能缩短3到4天。 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4f7718b122","title":"广西首例心肺联合移植患者痊愈出院","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735200.shtml","summary":"中新网南宁11月20日电(陈沿佑 王东栋)11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院。","summary_short":"中新网南宁11月20日电(陈沿佑 王东栋)11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院…","digest":"11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院","points":["中新网南宁11月20日电(陈沿佑 王东栋)11月19日…","这是广西首例心肺联合移植手术，该例手术的成功，填补了广西在此项技术领域的空白…","20年间，活动后气促始终困扰着他，其先后到过国内多家心血管权威医院就诊治疗…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T14:18:27+08:00","size":1,"keywords":[],"body":"中新网南宁11月20日电(陈沿佑 王东栋)11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院。这是广西首例心肺联合移植手术，该例手术的成功，填补了广西在此项技术领域的空白，也标志着广西器官移植与危重症救治的整体水平迈上了新台阶。\n\n11月19日，接受心肺联合移植手术的患者(中)与家属给医生团队送锦旗。陈沿佑 摄\n\n　　据了解，该名37岁患者的病史可追溯至33年前，其幼年感冒体检时发现心脏杂音，当时未予重视，之后顺利成长。2007年病情加重后就诊，确诊为“先天性心脏病、室间隔缺损合并重度肺动脉高压”，次年接受心脏畸形矫治手术，但其肺动脉高压并未随手术缓解，反而逐年加重。20年间，活动后气促始终困扰着他，其先后到过国内多家心血管权威医院就诊治疗，但病情仍在持续进展。\n\n　　今年9月20日，患者因“再发胸闷伴出现咯血2天”入住某家三甲医院CCU，虽经积极治疗，但心衰仍急性加重，很快发展为心源性休克。9月24日凌晨，患者突发“呼吸急促、大汗淋漓”，血压降至80/50毫米汞柱，血氧饱和度仅80%，当地医院紧急行气管插管并启动VA-ECMO(静脉—动脉体外膜肺氧合)支持，随后连夜转入广西医科大学第二附属医院重症医学科进一步治疗。\n\n　　经相关医生评估后认为，该患者的病，用药物和常规手术治疗已无逆转可能，“心肺联合移植”是唯一有效的救治方法。医院随即组织移植医学研究所、胸心外科、心血管内科、麻醉科、呼吸与危重症医学科等多学科团队会诊，在VA-ECMO桥接支持下完成器官移植术前评估，并将其录入器官移植等待系统。\n\n　　10月22日，匹配的供体出现，患者进入手术室接受心肺联合移植手术。历经五个多小时，手术成功。\n\n　　“经过二十多天的各项看护，他现在恢复得不错，生活可以自理，还能下床走几步”，患者妻子陈康(化名)表示，家中孩子每天都会询问父亲的病情，这次终于能回家了。\n\n　　广西医科大学第二附属医院副院长、移植医学研究所所长孙煦勇表示，心肺联合移植手术牵涉很多学科，对医院的组织协调能力有着极大考验，在手术过程中的每个环节都不能出现过多耽搁，这是一个很严峻的挑战。\n\n　　“广西没有做过这类手术，在别的地方，这种联合移植手术也属于个位数，没有太多经验来借鉴。我们对肝肾、心肝、心肾等联合移植，是有挺多经验的，这些经验对这次心肺联合移植手术有很大的帮助。这例手术的成功实施，病人成功康复出院，对我们来说，在器官移植的‘版图’就画上了一个圆满的句号。”孙煦勇说。\n\n　　据悉，中国首例心肺联合移植手术于1995年由中国医学科学院阜外医院完成，此后国内该项移植手术仅有少数零星开展。因该项手术技术门槛高，受供体心肺匹配条件严苛等因素限制，整体开展规模始终有限。目前全国具备常规开展手术能力的医疗机构不足5家，年完成手术量不足10例。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3de4e82144","title":"AI类岗位扩容、技能人才需求旺 就业市场出现哪些新趋势？","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735196.shtml","summary":"共青团部署开展服务和促进大学生就业行动以来，面向2027届高校毕业生，各地持续举办多场“千校万岗”招聘会。","summary_short":"共青团部署开展服务和促进大学生就业行动以来，面向2027届高校毕业生，各地持续举办多场“千校万岗”招聘会。","digest":"共青团部署开展服务和促进大学生就业行动以来，面向2027届高校毕业生…","points":["共青团部署开展服务和促进大学生就业行动以来，面向2027届高校毕业生…","今年秋招，人工智能人才需求热度不减，AI类岗位持续扩容，对人才的需求也更加多元","不久前在上海交通大学举行的共青团“千校万岗”招聘会上，集成电路、生物医药…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T14:10:38+08:00","size":1,"keywords":[],"body":"共青团部署开展服务和促进大学生就业行动以来，面向2027届高校毕业生，各地持续举办多场“千校万岗”招聘会。\n\n　　今年秋招，人工智能人才需求热度不减，AI类岗位持续扩容，对人才的需求也更加多元。\n\n　　不久前在上海交通大学举行的共青团“千校万岗”招聘会上，集成电路、生物医药、人工智能三大先导产业超230家企业推出4200多个岗位。\n\n　　某企业招聘负责人 马天军：最大的变化是我们的招聘的岗位在持续增多。硬件岗位是以芯片的设计，芯片验证为主，软件岗位以编译器开发、算子优化以及AI算法为主。\r\n\n　　随着传统制造企业加快转型升级，相应人才招聘的专业边界也在拓宽。一家船舶建造领域的企业，招聘不再局限于机械、电气等传统专业，数字化、智能化转型带来新的岗位缺口，人工智能等专业人才同样成为企业重点招揽的对象。\n\n　　不少招聘单位坦言，如今重点关注四项核心能力：扎实的专业理论基础、真实工程项目中的实习经历、跨领域协作与自主学习能力，以及主动拥抱智能工具、善用AI的意识与能力。\n\n　　某平台校招业务负责人 郑人杰：同学需要结合专业结合上AI ，同时需要更多的实习机会，因为实习履历是现在招聘面试当中非常重要的一个环节。\n\n技能型、创新型人才需求旺盛\n\n　　人工智能带来的产业升级，对技能型、创新型人才也提出更高的要求。多地通过举办技能大赛、创业大赛等，打通赛场到职场的通道，让学生们在提升技能的同时，及时感知市场需求，提升求职竞争力。\n\n　　不久前，在第十九届“振兴杯”全国青年职业技能大赛决赛期间，同步举办了青年技能人才招聘会，90家企业带来300多个岗位，岗位人才需求总量达2400余人，覆盖机器人运维、设备调试、工艺技术员、数字化技术支持等方向。\n\n　　杭州职业技术大学新能源汽车技术专业学生 张彬：目前我们国家新能源汽车的保有量也是很大的，市场急需一些岗位，关于维修汽车的“三电”电池、电机、电控。\n\n　　招聘会上，不少企业坦言，技能人才供需呈现新趋势：专用设备制造业、与新质生产力相关产业岗位需求增加，企业更看重人才掌握新技术、能直接上手的综合能力。\n\n　　招聘企业人力资源负责人 严晓辉：对技工来讲，第一个对专业知识要比较精深，第二动手能力要强，其次要会创新、懂工艺、懂编程。特别现在一些新的AI设备，他们也会操作，这样也是我们比较喜欢的人才。\n\n　　在辽宁大连，第十五届“挑战杯”中国大学生创业计划竞赛决赛期间，举办人才对接会，150多家用人单位涵盖央国企、专精特新企业、高新技术企业等，覆盖装备制造、能源化工、人工智能等热门领域，提供正式岗、实习岗等多种选择。\n\n　　中关村科学城管委会科技发展处副处长 黄宇玲：像人工智能、集成电路、商业航天、医药健康这样的战略性新兴产业，急需的是懂算法又懂场景的交叉人才；像具身智能、量子科技、脑机接口等未来产业，我们更看重的是原始创新和工程落地的能力；成果转化环节还紧缺懂技术、懂市场、懂资本的人才。\n\nAI赋能产业升级\n\n拓展就业新空间\n\n　　今年是海南自由贸易港封关运作首年，随着开放政策持续落地，一批新企业、新项目加快集聚，传统行业也在进行数字化、智能化升级。就业市场出现了哪些新趋势？\n\n　　在海口经济学院校园招聘会现场，120余家企业集中提供近2500个就业岗位。在一家从事AI短剧出海的企业展位前，计算机专业应届毕业生罗浩宣没有只递简历，而是带来了“个人名片”——一款自己运用AI工具制作的小游戏。\n\n　　海口经济学院计算机专业学生 罗浩宣：刚刚跟企业聊了，彼此都比较感兴趣，我本身也对AI感兴趣，所以说找工作感觉都还挺好的。\n\n　　一份自主制作、运行流畅的作品，成为学生证明能力的直接方式，也成为企业迅速了解应聘者能力的直观载体。一家AI短剧制作企业，今年新增加了像AI软件开发、AI培训师、账号运营等100多个AI相关岗位。\n\n　　招聘企业行政主管 徐子诒：现在AI短剧好一点的制作的人员很稀缺。如果是复合型人才，可以懂从AI剧本到AI短剧成品制作这一套流程，可以更完善去开发我们的软件，以及更高效落地。\n\n　　此外，低空经济等新兴行业把技术需求带入了电力、测绘和城市服务等实体场景，就业空间也随之向多场景、多环节拓展。\n\n　　招聘企业人力资源主管苑素丽：我们公司主要是做无人机培训、组装、调试、维修。企业需要测绘、电力这些专业人才，也需求无人机教员。\n\n　　从招聘市场整体看，企业需求也在分化：一部分岗位向技术和跨行业应用延伸，另一部分则在成熟行业中寻找更细分的市场。与此同时，服务业和销售岗位仍然是招聘市场的重要组成部分。\n\n　　海口经济学院常务副校长 周冰冰：学校跟企业签备忘录、签就业合作协议，跟我们深度合作的企业，可以开通让同学们优先进行实习的绿色通道，包括培养的岗位也可以增设。\n\n　　共青团海南省委员会青年发展部三级主任科员 林璇：重点聚焦海南四大主导产业，旅游业、现代服务业、高新技术产业和热带特色高效农业，我们建立了学校的专业清单、企业的用人清单以及学生的实习意向清单。打通企业用人需求和学生实习就业的双向通道。 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1031295efa","title":"采油守望者：传承“三老四严” 数字赋能守护油田生命线","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735189.shtml","summary":"中新网大庆11月20日电 题：采油守望者：传承“三老四严” 数字赋能守护油田生命线  　　作者 史轶夫 刘洋  　　松嫩平原之上，一排排抽油机在广袤的黑土地上缓缓起落。","summary_short":"中新网大庆11月20日电 题：采油守望者：传承“三老四严” 数字赋能守护油田生命线  　　作者 史轶夫 刘洋  　　松嫩…","digest":"题：采油守望者：传承“三老四严” 数字赋能守护油田生命线  　　作者 史轶夫 刘洋…","points":["松嫩平原之上，一排排抽油机在广袤的黑土地上缓缓起落","大庆油田第一采油厂中四采油队，正是“当老实人、说老实话、办老实事","“进了四队门，就是三老四严传人”，这份沉甸甸的精神传承，始终鞭策着他坚守岗位…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T13:58:08+08:00","size":1,"keywords":[],"body":"中新网大庆11月20日电 题：采油守望者：传承“三老四严” 数字赋能守护油田生命线\n\n　　作者 史轶夫 刘洋\n\n　　松嫩平原之上，一排排抽油机在广袤的黑土地上缓缓起落。大庆油田第一采油厂中四采油队，正是“当老实人、说老实话、办老实事；严格的要求、严密的组织、严肃的态度、严明的纪律”，大庆油田“三老四严”精神的发源地。\n\n　　第一采油厂第三作业区副经理王一伦，在走上作业区管理岗位前，曾在这里担任班长近十年，是扎根油田一线的“油二代”。“进了四队门，就是三老四严传人”，这份沉甸甸的精神传承，始终鞭策着他坚守岗位，守牢老油田稳产阵地。\n\n　　中四采油队已走过65载岁月，油田步入特高含水开发阶段，队里综合含水超97%，采油如同水里捞油花，稳产难度陡增。“作为采油最小单元，如果我们稳不住，国家能源安全靠什么保障？”王一伦深知，践行端牢能源饭碗的嘱托，就要精管每口井、优采每吨油。\n\n王一伦在井上检查设备运行状态。　任鸶鸶 摄\n\n　　稳产不能靠“大概、可能、差不多”。他带领技术骨干驻守现场，落实“真细优精”工作法，化验比对500余次，梳理上万个参数，逐井逐层分析，定制差异化注水方案，让出油层充分补给、水淹层减少注水，推动全队含水不升反降，把严实作风落到每一口井、每一个油层。\n\n　　精神传承，贵在守正出新。在王一伦眼中，“三老四严”绝非尘封的口号。他表示，时代条件虽变，但铁人精神内核从未改变，昔日会战靠人拉肩扛，如今数字化就是传承优良传统的新载体。他推行“四化五检”岗检法，创下220多万次巡检无一遗漏、五千多万条数据无差错的纪录。\n\n　　作为油田数字化示范队建设参与者，他推动数智孪生落地，搭建地面地下一体化管控模式，依靠实时监测、智能研判，实现隐患早预警早处置，推动管理由“经验驱动”转向“数据驱动”，劳动生产率实现显著提升，真正让数字转化为生产力。\n\n王一伦在计量间查看数字化设备运行状态。　任鸶鸶 摄\n\n　　抽油机日夜不停，巡井路四季绵长。王一伦坚信，能源安全蕴藏在每一次巡检、每一组数据、每一口油井之中。“只有把严和实刻在骨子里，才能克服前路难关。”他将继续带领队伍当好先锋打头阵，以实干担当为建设百年油田贡献基层力量。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5256ee0c24","title":"（乡村行·看振兴）寒江赏雾凇 非遗暖游人：吉林古镇做热“冷风景”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735187.shtml","summary":"中新网吉林11月20日电 题：寒江赏雾凇 非遗暖游人：吉林古镇做热“冷风景”  　　中新网记者 苍雁 石洪宇  　　松花江畔韩屯村的渡口在清晨六点就已人声涌动，江面白雾升腾，岸边柳枝挂满晶莹雾凇…","summary_short":"中新网吉林11月20日电 题：寒江赏雾凇 非遗暖游人：吉林古镇做热“冷风景”  　　中新网记者 苍雁 石洪宇  　　松花…","digest":"题：寒江赏雾凇 非遗暖游人：吉林古镇做热“冷风景”  　　中新网记者 苍雁 石洪宇…","points":["松花江畔韩屯村的渡口在清晨六点就已人声涌动，江面白雾升腾，岸边柳枝挂满晶莹雾凇…","吉林市龙潭区乌拉街满族镇韩屯村雾凇岛是当地优质雾凇观赏地之一，这座坐落于松花江沿岸的古镇…","广东游客韩霜带着家人一早登岛，她告诉中新网记者，这是她第一次到东北看雾凇"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T13:57:16+08:00","size":1,"keywords":[],"body":"中新网吉林11月20日电 题：寒江赏雾凇 非遗暖游人：吉林古镇做热“冷风景”\n\n　　中新网记者 苍雁 石洪宇\n\n　　松花江畔韩屯村的渡口在清晨六点就已人声涌动，江面白雾升腾，岸边柳枝挂满晶莹雾凇，不少游客裹着羽绒服排队等候登船。\n\n　　吉林雾凇被誉为中国“四大气象奇观”之一，吉林市享有“雾凇之都 滑雪天堂”的美誉。吉林市龙潭区乌拉街满族镇韩屯村雾凇岛是当地优质雾凇观赏地之一，这座坐落于松花江沿岸的古镇，是满族重要发祥地、国家级历史文化名镇。\n\n韩屯村雾凇岛上雾凇如画。　孙婉莹 摄\n\n　　广东游客韩霜带着家人一早登岛，她告诉中新网记者，这是她第一次到东北看雾凇。“美得像仙境一样，排队也值得。”\n\n　　过去，像韩霜一样的游客大多为雾凇而来，当地旅游高度依赖这一自然景观，每到雾凇季，游客天亮赶来、中午便匆匆离开。\n\n　　如今，“留客”的除了雾凇，还有老街上咕嘟作响的满族铜锅，以及沉淀百年的民俗文化。\n\n　　“凤吉园贾家锅子”始创于清光绪年间，其制作技艺被列入吉林省级非物质文化遗产名录。天色未亮，后厨便开始熬制汤底。第五代代表性传承人贾鑫忙着核对订单，炭火烘热铜锅，酸菜、白肉、血肠依次码放妥当。\n\n小游客在品尝乌拉火锅。　石洪宇 摄\n\n　　来自马来西亚的陈志明品尝着铜锅，对酸菜、白肉和血肠的搭配颇感新鲜，不时向店员询问吃法，“先放什么，再吃什么。”\n\n　　乌拉街满族镇党委书记马丙学介绍，当地统筹非遗传承、老字号培育，串起完整旅游动线，打造出“上午观雾凇、下午品火锅、晚间宿民宿”的文旅链条，让海外游客不必匆匆赶路，可以沉下心感受小镇。\n\n　　近些年，松花江沿线20多公里范围内，多个村落借着雾凇文旅盘活乡土资源。33岁的杨家佳在韩屯村经营客栈多年，除了接待食宿，她常常给海外游客讲解雾凇形成的奥秘，并带着他们走进村里的非遗工坊。\n\n　　在满族剪纸工坊，泰国游客甘雅拉跟着匠人剪出窗花。她把作品举到镜头前说，自己原本只计划停留一天，火锅、火炕和剪纸让她想多住两晚。\n\n　　“很多游客是专程奔着雾凇而来，但看过美景之后，他们更渴望读懂这片土地的民俗底色。”杨家佳说。外国游客格外喜爱草编、满族剪纸，常常一边认真观摩匠人手艺，一边拍摄短视频，把北国小镇的冬日日常分享到海外社交平台。\n\n　　“雾凇是稍纵即逝的自然馈赠，能将客人留下的是火锅、满族剪纸、暖融融的火炕民居这些鲜活的文化载体。”马丙学说，当地将不断深入挖掘多元文化资源，把古镇“冷风景”慢慢熬热。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca63091e797","title":"APEC“全家福”围巾 大有门道","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735180.shtml","summary":"11月19日，亚太经合组织第三十三次领导人非正式会议在深圳国际交流中心举行。","summary_short":"11月19日，亚太经合组织第三十三次领导人非正式会议在深圳国际交流中心举行。","digest":"11月19日，亚太经合组织第三十三次领导人非正式会议在深圳国际交流中心举行","points":["11月19日，亚太经合组织第三十三次领导人非正式会议在深圳国际交流中心举行","与会各经济体领导人及代表戴着浓郁中国特色的围巾，共同拍下一张宝贵的亚太大家庭“全家福”","今年各经济体领导人、代表佩戴的一红一蓝两条围巾，藏着哪些中国文化名片"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T13:38:45+08:00","size":1,"keywords":[],"body":"11月19日，亚太经合组织第三十三次领导人非正式会议在深圳国际交流中心举行。与会各经济体领导人及代表戴着浓郁中国特色的围巾，共同拍下一张宝贵的亚太大家庭“全家福”。\n\n　　今年各经济体领导人、代表佩戴的一红一蓝两条围巾，藏着哪些中国文化名片？工艺有哪些特点？\n\n两条围巾荟萃四项非遗技艺\n\n　　这两条围巾名为“同心合锦”，寓意“同心协力、繁荣合锦”，分别是以香云纱为主料的红色款和以宋锦为主料的蓝色款，由各经济体领导人、代表自行选择一色佩戴。\r\n\n　　设计团队表示，两款围巾最大的创新之处，在于香云纱、宋锦、粤绣、苏绣四项非遗技艺汇于一套丝绸织造品，交相辉映。\n\n　　2006年，粤绣、苏绣被列入国家级非物质文化遗产名录；\n\n　　2008年，香云纱染整技艺成为国家级非遗；\n\n　　2009年，宋锦织造技艺作为中国蚕桑丝织技艺重要组成部分，被列入联合国教科文组织人类非物质文化遗产代表作名录。\n\n　　何以“香云纱”？\n\n　　香云纱染整技艺作为岭南文化的代表之一，以前又名“响云纱”，因为当时的香云纱材质偏硬，穿戴的人走起路来“沙沙”作响。现在的香云纱通过砂洗、变软，穿着更加柔软、冰凉。\n\n　　香云纱以桑蚕丝为底坯，通过香云纱染整工艺制作而成。薯莨汁把布染成棕红，河泥里的铁离子再将其压成乌黑，成就其一面乌黑油亮、一面赭褐温润的独特质感。三浸九煮十八晒，三十余道工序，缺一不可。\n\n　　正是因为工序极其繁杂，香云纱也被喻为“软黄金”。与此同时，制作一匹香云纱，不仅要看手艺，还要看天气。“做一匹香云纱，现在最顶尖的手艺人也要半年时间，我们是跟时间赛跑，抢时间，抢阳光。”香云纱染整技艺顺德区级非遗代表性传承人何超说。\n\n缘何“同心合锦”？\n\n　　此次APEC围巾的设计制作人吴建华，也曾参与过2014年APEC“新中装”服饰的面料制作。吴建华介绍，围巾设计理念以湾区为窗，向世界铺展出合作共享的锦绣长卷，是一条流动的纽带，牵系历史与未来、东方与西方，以文化自信诠释大国担当。\n\n　　围巾整体以虚实交错的云纹为廓，象征中华文明如云海奔腾、延绵不绝。底纹结合岭南木棉、三角梅和祥云三种元素——\n\n　　木棉又称“英雄花”，寓意湾区儿女勇立潮头的民族气节；\n\n　　三角梅又名簕杜鹃，是深圳的市花；\n\n　　祥云纹则呼应“海上丝绸之路”的历史脉络，体现中华民族对和平、繁荣的永恒追求。\n\n　　此外，围巾还深藏一处巧思：21根天然野蚕丝线贯穿织入围巾，表达21个成员经济体紧密合作、互利共赢的美好寓意。\n\n　　“我们提炼出‘双色共鸣、和谐共生’的设计总体思路。”设计团队表示，希望展现以湾区为窗口、世界为画卷，亚太共繁荣，21个经济体携手擘画“同心协力、繁荣合锦”的锦绣图景。“希望披上这条围巾时，感受到的不仅是中华文化的深厚，还有亚太共同体意识。”香云纱宋锦围巾设计制作方负责人吴建华介绍。\n\n暖意可触可感，中国非遗走向世界\n\n　　11月19日上午，亚太经合组织第三十三次领导人非正式会议开始前，领导人互相帮忙整理围巾，小小的细节让这两款围巾的美好寓意具象化，也让“大家庭”的暖意可触可感。\n\n　　从江南宋锦到岭南香云纱，从清雅苏绣到华丽粤绣，大合影里的这两条围巾，不仅展示着中国文化的博大精深，更向世界传递着和而不同、美美与共的价值追求。吴建华希望，通过APEC，让全世界看到中国非遗的魅力，未来真正地让中国非遗走向世界。 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c97226e4e57","title":"国家公园每五年开展一次“生态体检”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735177.shtml","summary":"记者今天(20日)从国家林业和草原局了解到，国家林业和草原局等五部门日前制定印发国家公园自然资源和生态环境状况评估办法，根据《办法》，国家公园每五年将开展一次“生态体检”。","summary_short":"记者今天(20日)从国家林业和草原局了解到，国家林业和草原局等五部门日前制定印发国家公园自然资源和生态环境状况评估办法…","digest":"记者今天(20日)从国家林业和草原局了解到…","points":["今天(20日)从国家林业和草原局了解到，国家林业和草原局等五部门日前制定印发国家公园自然资源…","《办法》提出，国家林草局会同自然资源部、生态环境部、水利部、农业农村部…","国家林草局将组织专业机构对国家公园自然资源和生态环境状况进行评估并形成报告…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T13:29:34+08:00","size":1,"keywords":[],"body":"记者今天(20日)从国家林业和草原局了解到，国家林业和草原局等五部门日前制定印发国家公园自然资源和生态环境状况评估办法，根据《办法》，国家公园每五年将开展一次“生态体检”。\n\n　　《办法》提出，国家林草局会同自然资源部、生态环境部、水利部、农业农村部，每五年组织开展一次国家公园自然资源和生态环境状况评估工作，评估内容包括国家公园自然资源状况、生态环境质量、生物多样性、生态系统原真性和完整性、生态系统服务功能、生态安全风险等。\n\n　　国家林草局将组织专业机构对国家公园自然资源和生态环境状况进行评估并形成报告，会同相关部门对评估报告进行论证，形成评估结果并依法公布。\n\n　　(总台央视记者 梁丽娟 田琪永）\r\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cff2bccb710","title":"今年以来广州白云机场口岸APEC外籍旅客占入出境六成","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735168.shtml","summary":"中新社广州11月20日电 (方伟彬 林圣敏)截至11月20日，今年经广州白云机场口岸入出境的亚太经合组织(APEC)成员经济体外籍旅客已超435万人次，同比增长33.8%…","summary_short":"中新社广州11月20日电 (方伟彬 林圣敏)截至11月20日，今年经广州白云机场口岸入出境的亚太经合组织(APEC)成员…","digest":"截至11月20日…","points":["中新社广州11月20日电 (方伟彬 林圣敏)截至11月20日…","广州白云出入境边防检查站的数据还显示，入境方向超216万人次","从入境目的看，会议商务与旅游观光合计占比超过82.8%…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T13:25:50+08:00","size":1,"keywords":[],"body":"中新社广州11月20日电 (方伟彬 林圣敏)截至11月20日，今年经广州白云机场口岸入出境的亚太经合组织(APEC)成员经济体外籍旅客已超435万人次，同比增长33.8%，占该口岸入出境外籍旅客总量的61.2%。\n\n　　广州白云出入境边防检查站的数据还显示，入境方向超216万人次。从入境目的看，会议商务与旅游观光合计占比超过82.8%，是APEC成员经济体外籍旅客来华的主要类型。\n\n　　客流快速增长与多项便利政策落地直接相关。目前中国单方面免签国家已达50个，240小时过境免签政策适用国家扩展至57个；自11月1日起，APEC商务旅行卡持卡人在华最长停留期由60天延长至90天。同期，第140届广交会、粤港澳大湾区全球招商大会等展会密集在广东举办，进一步带动外籍旅客经白云机场口岸入境。受此拉动，该口岸今年入出境外籍旅客总量已超710万人次，同比增长33.2%。\n\n　　白云边检站介绍，面对客流高峰集中、旅客停留时间较短的特点，已通过与驻场航司联动预警、动态调配中外旅客查验通道比例、前置入境卡网上填报、增设多语种咨询引导点等方式提升通关效率，并联合机场外籍人士便利化服务中心提供一站式服务。(完)\r\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd95ba2e616","title":"为何会无意识长时间看手机？如何有效约束","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735172.shtml","summary":"你是否有过这样的体验，本来想去做点别的事情，可拿起手机后忍不住一直刷视频，刷完后，又感到后悔。","summary_short":"你是否有过这样的体验，本来想去做点别的事情，可拿起手机后忍不住一直刷视频，刷完后，又感到后悔。","digest":"你是否有过这样的体验，本来想去做点别的事情，可拿起手机后忍不住一直刷视频，刷完后…","points":["你是否有过这样的体验，本来想去做点别的事情，可拿起手机后忍不住一直刷视频，刷完后，又感到后悔","有网友分享，晚上躺下只想看两分钟，结果一条接一条，放下手机一抬头，已经到后半夜了","明知事后会懊恼，当时却很难收手"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T13:21:56+08:00","size":1,"keywords":[],"body":"你是否有过这样的体验，本来想去做点别的事情，可拿起手机后忍不住一直刷视频，刷完后，又感到后悔。\n\n　　有网友分享，晚上躺下只想看两分钟，结果一条接一条，放下手机一抬头，已经到后半夜了。明知事后会懊恼，当时却很难收手。也有网友说，自己想减少一点用手机消遣、娱乐的时间，就在手机应用商店里找到了一款戒断类的应用软件，开始尝试“用手机，戒手机”。\n\n　　不光是戒手机，这类应用软件通过打卡、勋章激励等方式来引导用户戒糖、戒冲动消费等等。用户只需要选中自己想戒掉的东西，就能开启一场自律挑战。\n\n　　借助戒断类应用软件，真的能让我们更好坚持下来吗？想摆脱依赖的人，为什么停不下来？用手机对抗手机，这套约束真的靠得住吗？\r\n\n　　刷手机停不下来、网购下单刹不住车，甜食一吃就超标，很多时候，人们会在“先享受又后悔”的循环中，责怪自己意志力不足。想摆脱依赖的人，为什么停不下来？\n\n　　首都医科大学附属北京安定医院临床心理中心副主任医师 唐利荣：这些共同特点都是作用在我们的多巴胺奖赏系统，并且它都会带有一些间歇性的、可变比例的强化特征。可能我们做这些事情不是每次都一定很开心，但是下一次可能就会很开心，这样就会形成一个很强驱动力。比如下一条视频可能很有趣，这样不可预测的奖励，就特别容易让人持续这个行为。判断是否有这种成瘾倾向，核心不在于喜欢的程度有多深，而是要去看这种喜欢是否影响了控制力，是否这个行为带来了明显的不良后果，却被他无视，他的社会功能是否被损害？如果是医学层面的成瘾，他会沉迷于这样的事情，他会停不下来。他的正常生活是被挤占的，不良的后果即使已经摆在眼前，还是刹不住车。\n\n　　一些戒断类的手机应用软件应运而生。它们除了通过限时锁机等方式来帮用户少用手机外，还会通过打卡、攒勋章这类游戏化的设计，来鼓励用户坚持。唐利荣表示，这样的约束方式也是一种形式的“奖励”。\n\n　　唐利荣：本身使用手机就是一个挺容易让人形成行为依赖的事情。戒断App有一些短期的效果，它可能是在这个过程中激活我们大脑即时的奖赏和胜任感回路，让用户得到一些可预测的小奖励，帮助他去获得一些变化。\n\n　　不过，虽然短期有用，但是唐利荣指出，这很难从根源上解决这类问题，因为这种奖励所带来的效果也会逐渐减弱，同时，这样约束的只是行为，并没有解决行为背后的情绪问题。\n\n　　唐利荣：比如我是因为有压力、无聊，这样的情绪如果没有被处理的话，App的约束力下降之后，原来的行为模式就会很快复现；\n\n　　这种游戏化的奖励，效应也会递减，新鲜劲过去之后，获得这些App的勋章不能再带来多巴胺，打卡可能就变成了负担；\n\n　　这样的外部约束，本质还是外在约束，不是提高了个体的自我控制能力，所以容易失去效果。\n\n　　既然单靠App不行，还有哪些容易长期坚持的办法，能帮我们减少，例如无意识的刷屏？对此，唐利荣表示，做一个现实生活充实的人很重要。\n\n　　唐利荣：在现实生活中给自己制造满足感，去转移关注点。通过运动、手工、社交等等来提供现实的多巴胺，提高胜任感和愉快感。不过度关注今天刷了多久，可以在刷手机之前先想一下，我今天刷的目的是什么？我是不是要去做？这样及时觉察，也非常有利于避免后续无意识的刷屏行为。比如增加一些行为的摩擦力，我们叫无痛调整，比如把手机放在一个不是太可及的地方，不是马上能拿到的。也可以给冲动加一个替代的动作，比如我在想点开手机之前，先站起来去倒杯水、深呼吸，看窗外等。 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdd943773af","title":"送别98岁乡村教师叶连平：那间教室的灯还亮着","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-20/news1075553.shtml","summary":"11月18日，安徽省马鞍山市和县乌江镇卜陈村乡村教师叶连平，因病医治无效逝世，享年98岁。","summary_short":"11月18日，安徽省马鞍山市和县乌江镇卜陈村乡村教师叶连平，因病医治无效逝世，享年98岁。","digest":"11月18日，安徽省马鞍山市和县乌江镇卜陈村乡村教师叶连平，因病医治无效逝世…","points":["11月18日，安徽省马鞍山市和县乌江镇卜陈村乡村教师叶连平，因病医治无效逝世，享年98岁","19日，这是他走后的第一个清晨，“卜陈未成年人之家”的教室门照常打开…","叶连平1978年起在卜陈学校任教"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T13:14:20+08:00","size":1,"keywords":[],"body":"11月18日，安徽省马鞍山市和县乌江镇卜陈村乡村教师叶连平，因病医治无效逝世，享年98岁。19日，这是他走后的第一个清晨，“卜陈未成年人之家”的教室门照常打开，来自社会各界民众自发前往悼念。叶连平1978年起在卜陈学校任教。退休后，他腾出自家房子办起“卜陈未成年人之家”，免费给村里孩子补课；今年9月新学期，98岁的他还准时出现在教室。他生前说：“我希望最后的一口气，是在讲台上呼出去的。”\n\n刘鸿鹤 张俊 安徽马鞍山报道","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/CFE2916E92C5497FB89F99ADA05D4AB5.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf173efab5b","title":"宁夏固原：一条河的五年蜕变 一座城的绿色转身","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735137.shtml","summary":"中新网固原11月20日电 题：宁夏固原：一条河的五年蜕变 一座城的绿色转身  　　中新网记者 李佩珊  　　冬日清晨，宁夏固原市原州区沈家河水库水面上，赤麻鸭、绿头鸭成群觅食、悠然游弋。","summary_short":"中新网固原11月20日电 题：宁夏固原：一条河的五年蜕变 一座城的绿色转身  　　中新网记者 李佩珊  　　冬日清晨…","digest":"题：宁夏固原：一条河的五年蜕变 一座城的绿色转身  　　中新网记者 李佩珊  　　冬…","points":["冬日清晨，宁夏固原市原州区沈家河水库水面上，赤麻鸭、绿头鸭成群觅食、悠然游弋","2021年以来，当地锚定黄河流域生态保护和高质量发展先行区建设，接续推进生态治理","今年11月，全市17项生态环境指标稳中有进，空气、水、土壤等核心指标稳居宁夏前列"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T12:23:25+08:00","size":1,"keywords":[],"body":"中新网固原11月20日电 题：宁夏固原：一条河的五年蜕变 一座城的绿色转身\n\n　　中新网记者 李佩珊\n\n　　冬日清晨，宁夏固原市原州区沈家河水库水面上，赤麻鸭、绿头鸭成群觅食、悠然游弋。灵动水鸟的现身，正是清水河固原段生态蝶变的生动注脚。\n\n　　清水河是宁夏境内流入黄河面积最大、流程最长的支流，固原段过去排污监管不到位、两岸垃圾遍布，曾被群众叫作“臭水河”；如今水清岸绿，当地人改口叫它“幸福河”。\n\n西海子是清水河源头核心生态片区，属重要水源涵养地，支撑流域生态屏障，兼具珍稀物种保护价值。　固原市委宣传部供图\n\n　　一个外号的改变，固原用了五年。2021年以来，当地锚定黄河流域生态保护和高质量发展先行区建设，接续推进生态治理。今年11月，全市17项生态环境指标稳中有进，空气、水、土壤等核心指标稳居宁夏前列。\n\n隆德渝河治理成效明显，先后入选全国美丽河湖、全国幸福河湖优秀案例。　固原市委宣传部供图\n\n　　顺着清水河往上走，进入原州区叠叠沟林场。这里素有“绿色水库”之称，沟道里格宾网沿山铺展，护坡石压住土层，相当于给水流加了道过滤层。林场职工舒海亮说：“过去沟里水土流失严重，水都是浑的，治理后水道通了、土留住了。”\n\n　　水从源头流下来，河里的变化更直观。这几年，固原以清水河、泾河等为重点推进生态修复和污染防治，茹河等河道里土著鱼类重新出现。\n\n航拍镜头下，彭阳金鸡坪层层旱作梯田顺着山势铺展，昔日荒山变身黄土高原上流动的金色绸带。　固原市委宣传部供图\n\n　　水在变，冬天取暖这件小事也在变。隆德县沙塘镇十八里村，赵富年家的暖气片摸着温热。过去烧煤，室温不稳；去年“煤改电”后，他家换上空气源热泵，全天恒温，取暖费也降了。“以前烧煤不干净也不安全，现在干净又安全。”他说。\n\n　　山上的变化，也改变着山下人的日子。六盘山腹地的燕家山曾大片裸露，2021年起，泾源县引入企业修复。王文兵在山上干活近两年，眼看着这片山变样：“以前半山腰都是荒地，现在栽满了苗木。”\n\n　　2025年9月，泾源完成宁夏首单水土保持生态产品价值转化交易，新旗村委会以91.2万元转让“兴盛集宿”48套民宿5年经营权，村民以闲置院落入股分红。\n\n　　泾源县沙塘林场是六盘山区的重点林区。生态护林员马有全每天巡护要走七八公里，在沟壑间守了十几年。他在笔记上写道：“护林工作马虎不得，保住了绿水青山，就是保住了子孙后代的发展根脉。”\n\n　　从一条河的蝶变，成了大家的“幸福河”，到生态价值变现，收获91.2万元交易成果，固原这五年，一点点把绿水青山转化为可量化的发展收益，稳稳留住百姓的幸福笑颜。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c18795e1f65","title":"2026休闲度假大会在安徽石台举行","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735136.shtml","summary":"中新网池州11月20日电 (记者 张强)以“新体验 新经济”为主题的2026休闲度假大会19日在安徽省池州市石台县举行，来自全国各地的文旅业界专家、企业代表齐聚秋浦河畔，共话休闲度假新路径。","summary_short":"中新网池州11月20日电 (记者 张强)以“新体验 新经济”为主题的2026休闲度假大会19日在安徽省池州市石台县举行…","digest":"以“新体验 新经济”为主题的2026休闲度假大会19日在安徽省池州市石台县举行…","points":["中新网池州11月20日电 (记者 张强)以“新体验 新经济”为主题的2026休闲度假大会19…","薄雾笼罩着清晨的石台县仙寓镇大山村","会上，中国旅游协会与石台县人民政府签署合作协议，并发布《安徽休闲度假康养创新实践报告》"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T11:58:03+08:00","size":1,"keywords":[],"body":"中新网池州11月20日电 (记者 张强)以“新体验 新经济”为主题的2026休闲度假大会19日在安徽省池州市石台县举行，来自全国各地的文旅业界专家、企业代表齐聚秋浦河畔，共话休闲度假新路径。\n\n薄雾笼罩着清晨的石台县仙寓镇大山村。(资料图)何清 摄\n\n　　会上，中国旅游协会与石台县人民政府签署合作协议，并发布《安徽休闲度假康养创新实践报告》。同时，有关线上视频平台和旅游平台发布了《“心动目的地”安徽100休闲度假新体验》报告和《入境旅游十大新趋势暨安徽入境旅游十大新体验》报告。\n\n　　其中，《入境旅游十大新趋势暨安徽入境旅游十大新体验》报告梳理出安徽入境旅游的十大新趋势，涵盖商务休闲客群互补、康养服务、咖啡夜生活、多语种服务、特色目的地深度游等维度。此次入选安徽十大新体验的项目包括泾县古法捞纸、徽州鱼灯、黄梅戏学唱等，从“一座黄山”到“一场安徽之旅”的全景画卷正徐徐展开。\n\n　　当日，围绕“新旅游”“新酒店”“新演艺”“新山水”“新乐园”“新玩法”，与会业界人士先后分享一线实践。大会另设三场主题沙龙，分别聚焦审美、陪伴、健康三大文旅经济领域。\n\n11月19日，活动现场。中新社记者 张强 摄\n\n　　“越来越多的游客希望自己不只是游客，而成为自己人生的主角。”中国旅游协会秘书长葛磊说，当前游客对参与性、体验性产品需求旺盛，“吃住行游购娱”都可以用体验思维重塑，应顺应审美经济、健康经济、陪伴经济的需求导向，推动旅游业态创新。\n\n　　池州森林覆盖率超六成，石台县被誉为“中国原生态最美山乡”。葛磊建议当地做好水、睡眠、富硒三篇文章，开发“水的100种玩法”，擦亮“到池州睡个好觉”品牌，建设国内领先的健康生活目的地。\n\n　　该会由中国旅游协会、安徽省文化和旅游厅、池州市人民政府共同主办。(完)\n\n 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":82,"items":[{"id":"cb00eaec1cf","title":"前10月中国快递收入增速“跑赢”业务量","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735226.shtml","summary":"中新社北京11月20日电 (记者 王梦瑶)据中国国家邮政局20日消息，今年前10个月，中国快递业务收入累计完成12981.5亿元人民币，同比增长6.6%；同期快递业务量累计完成1688.2亿件…","summary_short":"中新社北京11月20日电 (记者 王梦瑶)据中国国家邮政局20日消息，今年前10个月…","digest":"据中国国家邮政局20日消息，今年前10个月…","points":["中新社北京11月20日电 (记者 王梦瑶)据中国国家邮政局20日消息，今年前10个月…","同期快递业务量累计完成1688.2亿件，同比增长3.8%","11月10日，在位于河北廊坊的一家快递企业北方总部内，快递被有序分拣"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:48:16+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 (记者 王梦瑶)据中国国家邮政局20日消息，今年前10个月，中国快递业务收入累计完成12981.5亿元人民币，同比增长6.6%；同期快递业务量累计完成1688.2亿件，同比增长3.8%。快递业务收入增速“跑赢”业务量增速。\n\n　　从“以价换量”到“提质增效”，这一转变与行业综合整治“内卷式”竞争的治理脉络高度吻合。\n\n　　国家邮政局发展研究中心战略规划研究部主任刘江表示，从产地直发、进厂驻点到按品类定制，快递服务供需匹配度与履约精准度明显提升；技术应用由单点提效向全链路赋能延伸，自动化、具身机器人、无人快递车与AI(人工智能)助手承接重复性劳动，在提高效率的同时缓解一线人员压力；权益保障制度化，关怀措施更加可及，行业高质量发展成果更多惠及快递员。\n\n11月10日，在位于河北廊坊的一家快递企业北方总部内，快递被有序分拣。　中新社记者 翟羽佳 摄\n\n　　这些收入增量正投向科技与效率。顺丰在广东东莞寮步片区升级末端智慧运力，新增投入3台无人配送车参与日常派件作业，以自动化设备分流末端派送压力，降低一线人员劳动强度；浙江桐乡濮院毛衫旺季单量暴涨，韵达以客户管家系统实现多平台订单一键同步、急件优先流转，客服前置介入；圆通AI助手将揽派等日常工作集成到行者App，帮助快递员在实际派件过程中提前了解客户需求，AI室内外导航帮助快递员少绕路；邮政企业在浙江宁波与本土龙头企业共建智能云仓，依托13米高的立体仓储空间、分拣机器人、AI无人叉车等自动化设备，提升寄件效率。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c33ac824a27","title":"百万重奖寻创作者！2027宁波银行·天e网络文学大赛全球启幕","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735227.shtml","summary":"2026年11月19日，2027宁波银行·天e网络文学大赛正式向全球创作者发出“英雄帖”。","summary_short":"2026年11月19日，2027宁波银行·天e网络文学大赛正式向全球创作者发出“英雄帖”。","digest":"2026年11月19日…","points":["2026年11月19日，2027宁波银行·天e网络文学大赛正式向全球创作者发出“英雄帖”","本届大赛旨在构建“网文原创+AI短剧可视化+海内外全域传播”的全链条孵化平台…","两个赛道将分别评选出1部获奖作品，总奖金池共计100万元"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:47:40+08:00","size":1,"keywords":[],"body":"2026年11月19日，2027宁波银行·天e网络文学大赛正式向全球创作者发出“英雄帖”。本届大赛旨在构建“网文原创+AI短剧可视化+海内外全域传播”的全链条孵化平台，面向全球征集优质网络文学作品，以单部作品最高50万元的奖金，刷新国内网络文学赛事单项奖金纪录。\n\n　　双赛道并行，总奖金池达百万\n\n　　与2024年首届大赛相比，本届赛事全面升级，设立“综合作品”与“专题作品”双赛道。两个赛道将分别评选出1部获奖作品，总奖金池共计100万元。\n\n　　其中，50万元奖金由30万元基础奖金和20万元IP改编/海外传播专项基金组成。基础奖金在获奖后直接发放；20万元专项基金则采取“成果导向”的分档拨付机制，依据短剧落地拍摄、海外译本连载等实际转化情况进行核发。若未达到拨付条件，该部分资金将由组委会统筹用于作品的AI成片制作及海内外宣发推广。若最终获奖作品数量未达设定上限，剩余奖金将全额结转至下一届大赛。\n\n　　零门槛参赛，海内外作者同台竞技\n\n　　大赛秉持开放包容原则，面向全球网络作家、业余创作者、青年学生、IP改编从业者及海外译制运营人员开放。不限国籍、户籍与年龄，全程免收报名费与评审费，实现真正的“零门槛”参与。\n\n　　🔹综合作品赛道：体裁、主题、字数不设硬性限制，但须为2024年8月31日至2027年8月31日期间完结的原创网文。作品需弘扬社会主义核心价值观，厚植中华优秀传统文化，讲好中国故事，兼顾思想性、艺术性、可读性与传播性。\n\n　　🔹专题作品赛道：字数不设硬性限制，须为同期完结的原创网文。创作背景需紧扣宁波海洋文化，深入挖掘海上丝路、海洋民俗、港口经济等内涵，展现人海共生的海洋精神及港城人文融合发展的丰硕成果。作品严禁渲染暴力情节，鼓励多元写作手法。\n\n　　值得注意的是，已获省级及以上政府文艺奖项或正式纸质出版的作品不得参赛；抄袭、洗稿、纯AI生成及低俗违规作品严禁入围。使用AI辅助创作短剧须在作品中明确注明；境内作者使用境外AI工具须确保合法合规，严禁使用非法手段。\n\n　　权威指导，多地机构协同助力\n\n　　本届大赛阵容强大，由中国作家协会网络文学委员会指导，浙江省网络作家协会支持。宁波市委宣传部、市委网信办、宁波日报报业集团、市文联主办，宁波甬派传媒股份有限公司承办，宁波银行冠名。协办单位包括宁波市互联网发展联合会、市文化产业促进会、市作协网络作家工作委员会及鄞州区委宣传部等。\n\n　　此外，大赛还获得了广东、江苏、四川、上海、重庆等地网络作家协会，以及中国网络作家村、咪咕阅读、塔读文学、飞卢小说网、火星小说、息壤中文网、盛世阅读网、爆侃网文、橙瓜网等多家行业机构与平台的鼎力支持。\n\n　　评审透明，专家库随机抽取\n\n　　为确保公平、公正、公开，组委会建立了30人的评审专家库。复评与终评阶段，将从库中随机各抽取5位专家进行独立评审，且同一专家不得同时参与两个赛道的评审工作。\n\n　　评分体系总分100分，其中网络文学质量占80分，影视IP转化适配度与海外传播成果各占10分。赛事将对参赛作品进行严格的版权核验、AI标注核查及海外传播数据验证。赛后三年内，组委会保留对造假、剽窃行为的追责权利，一经查实，将取消资格并追回奖金。\n\n　　赛程安排\n\n　　初评\n\n　　2027年9月上中旬，两大赛道各筛选10部作品进入复评。\n\n　　复评\n\n　　2027年9月下旬，各赛道筛出5部作品进入终评。\n\n　　终评\n\n　　2027年10月上旬，各赛道产生1部获奖作品，结果全网公示。\n\n　　颁奖\n\n　　拟于2027年10月下旬举行颁奖仪式，同步开展IP对接、版权洽谈、作家沙龙等产业配套活动。\n\n　　06\n\n　　投稿方式\n\n　　征稿即日起至2027年8月31日截止，参赛者可通过以下任一渠道投稿：\n\n　　1️⃣官方邮箱投稿\n\n　　邮箱：tewlwxds@163.com\n\n　　邮件标题格式：天e网络文学奖+赛道名称+作品名(示例：天e网络文学奖+综合作品+《代表全人类》)\n\n　　🔹附件要求：\n\n　　①作品完整Word全文；\n\n　　②作者实名、笔名、联系方式、作品发布网址；\n\n　　③短剧改编片段、AI创作说明；\n\n　　④出海类作品需附译本、海外平台截图及合作合同佐证材料。\n\n　　2️⃣甬派线上投稿通道\n\n　　💻电脑端：\n\n　　https://ypapp.cnnb.com.cn/writer_novel_page\n\n　　📱手机端：\n\n　　登录甬派APP→网络小说频道→实名注册作家→新建作品并勾选对应参赛赛道。\n\n　　温馨提示\n\n　　参赛者请务必添加微信14758054525，以便进行报名确认、答疑咨询及资料审核等工作。\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1d37bff92a","title":"中国电动汽车充电枪总数超2500万个","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735224.shtml","summary":"中新社北京11月20日电 (记者 王梦瑶)中国国家能源局20日发布的数据显示，截至2026年10月底，中国电动汽车充电基础设施(枪)总数达到2539.1万个，同比增长36.2%。","summary_short":"中新社北京11月20日电 (记者 王梦瑶)中国国家能源局20日发布的数据显示，截至2026年10月底…","digest":"中国国家能源局20日发布的数据显示，截至2026年10月底…","points":["中新社北京11月20日电 (记者 王梦瑶)中国国家能源局20日发布的数据显示…","其中，公共充电设施(枪)528.3万个，同比增长16.5%，额定总功率达到2.71亿千瓦…","私人充电设施(枪)2010.8万个，同比增长42.5%…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:47:18+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 (记者 王梦瑶)中国国家能源局20日发布的数据显示，截至2026年10月底，中国电动汽车充电基础设施(枪)总数达到2539.1万个，同比增长36.2%。\n\n　　其中，公共充电设施(枪)528.3万个，同比增长16.5%，额定总功率达到2.71亿千瓦，单枪平均功率约为51.37千瓦；私人充电设施(枪)2010.8万个，同比增长42.5%，私人充电设施报装用电容量达到1.71亿千伏安。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdec7445e52","title":"1-10月全国网上商品和服务零售额增长3.7%","url":"https://www.jiemian.com/article/15354728.html","summary":"商务部电子商务司负责人介绍2026年1-10月我国电子商务发展情况。","summary_short":"商务部电子商务司负责人介绍2026年1-10月我国电子商务发展情况。","digest":"商务部电子商务司负责人介绍2026年1-10月我国电子商务发展情况","points":["商务部电子商务司负责人介绍2026年1-10月我国电子商务发展情况","数字产品增长加速，据商务大数据监测，10月份智能穿戴和笔记本电脑网上零售额分别增长42.5%…","即时零售激发线下商品消费潜力，重点监测平台1-10月即时零售交易额增速超过两位数"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T14:41:31+08:00","size":1,"keywords":[],"body":"商务部电子商务司负责人介绍2026年1-10月我国电子商务发展情况。\n\n2026年1-10月，我国电子商务平稳发展，线上线下融合持续增强消费市场韧性，数字技术赋能产业转型升级，“丝路电商”拓展国际经贸合作，商务领域新质生产力不断培育壮大，助力我国经济向新向优。\n\n深化线上线下联动消费。据国家统计局数据，1-10月全国网上商品和服务零售额增长3.7%，其中网上商品零售额增长2.9%、网上服务零售额增长5%。数字产品增长加速，据商务大数据监测，10月份智能穿戴和笔记本电脑网上零售额分别增长42.5%和32.4%。即时零售激发线下商品消费潜力，重点监测平台1-10月即时零售交易额增速超过两位数。电商不断提升服务消费便利性，据商务大数据监测，1-10月在线旅游、在线餐饮和在线生活服务零售额分别增长24.3%、12%和11.5%。\n\n推动产业数智化转型升级。电子商务发挥技术、数据和场景优势，为农业、制造业和服务业数智化转型升级注入新动能。据商务大数据监测，1-10月我国农产品网上零售额增长12%，“电商+产业带”推动河南许昌假发、江苏宜兴紫砂壶网上零售额分别增长33.6%和16.8%。据国家统计局数据，10月份信息传输、软件和信息技术服务业，交通运输、仓储和邮政业生产指数分别增长9.2%和5.1%。\n\n拓展国际经贸合作深度广度。第三届“丝路云品”电商月在第九届中国国际进口博览会期间启动，发布“丝路电商”典型实践案例集、故事集和国别电商投资指引，“丝路电商”合作创新发展推介会推动中国电商平台与伙伴国企业达成12个合作意向。各地同步开展东盟好物网购节、中阿好物集、澜湄好物随心购、丝路云品惠京城及上合云品电商节等特色活动，助力丝路好物进中国。重点监测跨境电商进口平台上，10月份亚美尼亚、韩国和乌兹别克斯坦商品零售额分别增长87.8%、32.6%和22.6%。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c587aa0d46e","title":"金融街证券董事长祝艳辉被查","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735202.shtml","summary":"中新网北京11月20日电(记者 谢艺观)11月20日，金融街证券发布公告，根据北京市西城区监察委员会通知，公司董事长祝艳辉目前正接受调查并被实施留置措施。","summary_short":"中新网北京11月20日电(记者 谢艺观)11月20日，金融街证券发布公告，根据北京市西城区监察委员会通知…","digest":"11月20日，金融街证券发布公告，根据北京市西城区监察委员会通知…","points":["中新网北京11月20日电(记者 谢艺观)11月20日，金融街证券发布公告…","公告称，于公告刊发时，公司未收到任何委员会需要协助调查或提供任何资料的要求，集团业务运营正常","祝艳辉除担任董事长及执行董事外，亦为董事会战略与投资决策委员会主席及风险控制与监察委员会主席…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:40:06+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电(记者 谢艺观)11月20日，金融街证券发布公告，根据北京市西城区监察委员会通知，公司董事长祝艳辉目前正接受调查并被实施留置措施。\n\n　　公告称，于公告刊发时，公司未收到任何委员会需要协助调查或提供任何资料的要求，集团业务运营正常。祝艳辉除担任董事长及执行董事外，亦为董事会战略与投资决策委员会主席及风险控制与监察委员会主席，并无担任其他职务。公司其他董事和高级管理层均正常履职。\n\n 金融街证券公告截图。\n\n　　根据现有资料，董事会(祝艳辉除外)认为，上述事项预计不会对集团的业务及营运造成重大影响。\n\n　　企业官网信息显示，金融街集团控股的金融街证券成立于1992年，是经中国证监会批准的综合性、全牌照证券公司，于2015年在香港上市。公司在全国设有104家分支机构(含7家分公司)，业务范围涵盖经纪及财富管理、资产管理、资产证券化、资本中介、资产托管、自营交易等全牌照业务。\n\n　　另外，公开资料显示，祝艳辉自2022年12月起担任董事长及执行董事。\n\n　　财报显示，今年上半年，金融街证券实现经营收益18.45亿元，较2025年同期增长10.74%；实现归属于上市公司股东的净利润2.4亿元，同比减少0.45%。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd80480d8f6","title":"延榆高铁王家坪隧道顺利贯通","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735220.shtml","summary":"中新网延安11月20日电(记者 张远)记者20日从西安铁路局获悉，延榆高铁王家坪隧道18日顺利贯通，这是延榆高铁贯通的第2座4千米以上隧道，全线隧道累计掘进量超90%。","summary_short":"中新网延安11月20日电(记者 张远)记者20日从西安铁路局获悉，延榆高铁王家坪隧道18日顺利贯通…","digest":"记者20日从西安铁路局获悉，延榆高铁王家坪隧道18日顺利贯通…","points":["中新网延安11月20日电(记者 张远)记者20日从西安铁路局获悉…","延榆高铁王家坪隧道位于陕西省延安市延川县，全长4352.8米，为单洞双线隧道…","建设期间，西成客专陕西公司联合建设团队借助 BIM数字化建模技术…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:38:54+08:00","size":1,"keywords":[],"body":"中新网延安11月20日电(记者 张远)记者20日从西安铁路局获悉，延榆高铁王家坪隧道18日顺利贯通，这是延榆高铁贯通的第2座4千米以上隧道，全线隧道累计掘进量超90%。\n\n图为隧道内部。耿涛 摄\n\n　　延榆高铁王家坪隧道位于陕西省延安市延川县，全长4352.8米，为单洞双线隧道，最大埋深约172m。隧道洞身主要穿越黄土梁峁沟壑区，起伏剧烈，沟谷岸坡陡峻，施工难度大，安全风险高。\n\n　　建设期间，西成客专陕西公司联合建设团队借助 BIM数字化建模技术，对施工全流程开展系统性模拟推演，动态优化施工组织与资源配置，确保施工安全质量。建设团队投入使用新型智能衬砌台车，将混凝土浇筑、高频振捣、温湿协同养护等关键工序纳入全流程智慧闭环管理，通过标准化、可视化、可追溯的工艺管控，保障衬砌结构质量。构建“数智隧道”管理系统，通过在全域布置智能传感终端，实现对围岩变形、支护受力、环境参数的全天候、全断面、高精度监测，系统自动进行建模分析与分级预警，施工人员科学动态调整支护刚度与施作时机，确保隧道绝对安全。\n\n　　据悉，针对黄土隧道浅埋、易坍塌等特点，建设团队采用三台阶预留核心土工法，结合机械开挖与精准爆破技术，分台阶有序推进施工，最大限度降低对黄土围岩的扰动，有效控制隧道变形及坍塌风险，保障隧道安全高效掘进。为解决双向掘进精准贯通的难题，建设团队建立双向联动机制，加密测量复核频次，最终实现隧道安全高效贯通。\n\n　　延榆高铁位于陕西省北部，线路全长约238.7公里，设计时速350公里/小时，自延安站引出，向北经延安市宝塔区、延川县，榆林市清涧县、绥德县、米脂县至横山区，共设延安、延安新区、延川、清涧北、绥德西、米脂北、榆林南7座车站，其中延安站为既有车站，其他为新建车站。\n\n　　延榆高铁是中国“八纵八横”高铁网包(银)海通道的重要组成部分，是内蒙古西部和陕西北部地区通达关中、西南、中南等地区的便捷客运通道，路网地位十分重要。项目建成后，对加快构建包(银)海通道，完善铁路网布局，改善沿线交通基础设施条件，促进区域经济社会高质量发展具有十分重要的意义。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5c0c5a67e0","title":"陕西金泰恒业房地产有限公司：金质好房筑安居 金彩生活暖人心","url":"https://www.jiemian.com/article/15354664.html","summary":"11月14日，首届金泰恒业“金泰杯”金彩运动会在西安金泰·唐618项目开幕。","summary_short":"11月14日，首届金泰恒业“金泰杯”金彩运动会在西安金泰·唐618项目开幕。","digest":"11月14日，首届金泰恒业“金泰杯”金彩运动会在西安金泰·唐618项目开幕","points":["11月14日，首届金泰恒业“金泰杯”金彩运动会在西安金泰·唐618项目开幕","来自8个赛区、15个社区的200多户家庭齐聚赛场","自启动报名以来，近千名客户前来咨询，500多位业主踊跃报名"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T14:35:21+08:00","size":1,"keywords":[],"body":"11月14日，首届金泰恒业“金泰杯”金彩运动会在西安金泰·唐618项目开幕。来自8个赛区、15个社区的200多户家庭齐聚赛场。据悉，自启动报名以来，近千名客户前来咨询，500多位业主踊跃报名。\n\n一场运动会，检验的是社区的组织能力，连接的是邻里之间的日常往来。从交付“金质好房”到营造“金彩生活”，金泰恒业二十余载深耕人居，正用一个个看得见、摸得着的场景，书写“恒心恒意，金彩生活”的品牌承诺。\n\n现房见底气 匠心铸品质\n\n“择居当下，现房亲鉴”，所见即所得。随着现房销售制逐步推行，现房正成为越来越多购房者的共同选择，也对房企的品质交付能力、社群运营能力提出了更高要求。\n\n作为陕投集团旗下的西安本土国企，金泰恒业把现房现售作为经营底色。购房者可以看楼栋、进房间、摸质感。今年以来，企业围绕“品质交付”持续发力，遵循“安全、舒适、绿色、智慧”的好房子理念，从空间布局、园林景观到建材工艺精研细筑，用金质交付回应业主信赖。\n\n金秋双节，金泰恒业迎来一波市场热潮，累计新增来访客户1200余组，实现销售近1.5亿元，同比提升23%。成都金泰・和序住宅成交近3000万元，拿下所在板块销售榜首；西安高新金泰・和樾项目10月签约额超6000万元，环比增长近40%；金泰・未来印10月占据区域70%市场份额，来访、成交双榜区域第一；金泰・山河砚2期近期重磅上新，凭借突出的产品力收获市场关注，来访量跻身区域第一梯队。根据中指研究院发布的1-10月西安楼市销售榜单显示，金泰恒业销售面积位列第12名，销售金额位列第14名。\n\n布局覆盖从核心主城到区域城市，金泰恒业依靠稳健交付能力、精细物业服务以及成熟社群运营，持续积累市场口碑。秉持国企初心，深耕人居赛道，持续迭代品质服务、聚力精进突破，推动品牌实力与人居价值稳步跃升。\n\n资源汇合力 服务有温度\n\n交房不是服务的终点，而是服务的起点。今年下半年，金泰恒业从“精致好房”转向“金彩生活”，依托陕投集团旗下酒店、商业、科普、康养医疗等资源，把集团的“家底”变成业主身边看得见、用得上的生活场景。\n\n近期，金泰恒业携手陕西自然博物馆，在金泰·和樾、金泰·唐樾推出金彩蝴蝶展，珍稀蝶类标本与艺术装置相映成趣，近五百组家庭前来“寻蝶”，不少孩子在展台前一站就是半天。10月金泰·唐618联袂索菲特传奇酒店举办百年文艺巡礼，酒店珍藏的国宴器皿、银质餐具走出展柜，非遗面塑传承人现场授艺，大人孩子围坐一桌，揉、搓、捏、压，捏出的是技艺，也是对美好生活的向往。重阳时节，金泰·和樾联合陕投康养办起“秋日养生局”，营销中心变身“康养会客厅”，约50组家庭围坐品茶、亲手封装茶包、制作艾草手作，老人们笑着说，这才是“过节”的样子。\n\n自然科普、非遗传承、康养颐乐、亲子研学，一场场活动串起旅居、研学、颐养等多元场景，营销中心不再只是看房的地方，而成了业主周末愿意来坐坐的“客厅”。\n\n社群聚人心 赛场添活力\n\n让业主相识、相知、相助，是金泰恒业“金彩生活”的又一层内涵。官方业主社群平台“金泰会”以权益、活动、组织三大体系协同支撑，以“金彩生活”为主线，全年常态化举办覆盖老中青幼的社群活动，鼓励业主共建共创，让社区成为温暖的生活场域。\n\n“金泰杯”运动会，是这套生活体系中又一次生动的实践。开幕式当天，签到区排起长队，工作人员引导选手核验签到，领取赛事能量包；休息区、饮水点、医护岗布设周全。活力啦啦操率先登场，各赛区选手按篮球、乒乓球、羽毛球项目整齐列队。随后，“篮球运输”“尖叫乒乓”“飞羽投手”等趣味游戏轮番上演，大家踊跃上场、赢取好礼。\n\n据悉，运动会自11月14日持续至12月27日，各赛区预选赛层层比拼；12月26日至27日，总决赛将在金泰・唐618举行。\n\n从一次活动到一个圈子，从一个圈子到一种生活方式，这正是金泰恒业对“好房子”的理解，房子是“硬件”，邻里温度才是“软实力”；交付是“承诺”，长久陪伴才是“答案”。\n\n现房销售制的推行，对房企提出了更高的要求，既要“交得出”，更要“住得好”。金泰恒业以国企的担当守住品质底线，以资源的协同拓展生活边界。“看得见的好房子，享得到的好配套，用得着的好服务，住得到的好小区，有温度的好文化”的“五好价值”人居体系，正在融入企业的品牌内核。\n\n赛场终有落幕时，生活却从不止步。面向未来，金泰恒业将坚守国企初心，把党建引领融入品质开发与社区服务的全过程，让“五好价值”、社群运营和品牌使命，融入规划建造、物业服务与社区生活的日常，持续提升业主的获得感、幸福感、安全感，以国企担当深耕城市人居，让“金质好房”真正成为安居乐业的依托。\n\n来源：推广\n\n本文为转载内容，授权事宜请联系原著作权人。资讯\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n陕西金泰恒业房地产有限公司：金质好房筑安居 金彩生活暖人心\n\n一场运动会，检验的是社区的组织能力，连接的是邻里之间的日常往来。\n\n界面陕西 · 2026/11/20 14:35\n\n11月14日，首届金泰恒业“金泰杯”金彩运动会在西安金泰·唐618项目开幕。来自8个赛区、15个社区的200多户家庭齐聚赛场。据悉，自启动报名以来，近千名客户前来咨询，500多位业主踊跃报名。\n\n一场运动会，检验的是社区的组织能力，连接的是邻里之间的日常往来。从交付“金质好房”到营造“金彩生活”，金泰恒业二十余载深耕人居，正用一个个看得见、摸得着的场景，书写“恒心恒意，金彩生活”的品牌承诺。\n\n现房见底气 匠心铸品质\n\n“择居当下，现房亲鉴”，所见即所得。随着现房销售制逐步推行，现房正成为越来越多购房者的共同选择，也对房企的品质交付能力、社群运营能力提出了更高要求。\n\n作为陕投集团旗下的西安本土国企，金泰恒业把现房现售作为经营底色。购房者可以看楼栋、进房间、摸质感。今年以来，企业围绕“品质交付”持续发力，遵循“安全、舒适、绿色、智慧”的好房子理念，从空间布局、园林景观到建材工艺精研细筑，用金质交付回应业主信赖。\n\n金秋双节，金泰恒业迎来一波市场热潮，累计新增来访客户1200余组，实现销售近1.5亿元，同比提升23%。成都金泰・和序住宅成交近3000万元，拿下所在板块销售榜首；西安高新金泰・和樾项目10月签约额超6000万元，环比增长近40%；金泰・未来印10月占据区域70%市场份额，来访、成交双榜区域第一；金泰・山河砚2期近期重磅上新，凭借突出的产品力收获市场关注，来访量跻身区域第一梯队。根据中指研究院发布的1- 牌“三五而栗”，在出圈一年半后按下了停止键。近日，该公司创始人接受媒体采访回顾了这段创业历程。\n\n此前，“三五而栗”正式发布全员通告，宣布品牌停止运营，旗下门店于10月底结束统一经营。这距离品牌首店开业仅过去14个月，这家一度被网友称为“长沙胖东来”的特色餐饮品牌，在累计亏损超过100万元后，最终选择谢幕。\n\n根据九派新闻报道，品牌创始人、95后创业者朱天赐在近日接受采访时表示，距离正式宣布停业已过去半个多月，自己至今仍处于疲惫状态。他坦言：“我们收入比别人多几百元，住得好一点，休息时间也好一些，还照顾中年人和残障人士。但后来才发现，站在我们的角度，这确实有点像自我感动。”\n\n理想与现实的落差，最终在账本上显现。朱天赐表示，品牌2025年4月开始招聘，同年8月第一家门店正式开业，到今年一共开了六家店，都在长沙。2026年9月，六家门店全部开业后，之前一直进进出出、没有理清的账目彻底清晰：大约一年时间，累计亏空100多万元。\n\n复盘这段创业经历时，朱天赐坦言“除了在网上有人说你的品牌好、有良心，现实中没有一个人觉得我们做得好”。他给自己的答案是“原因很复杂”——产品特色、损耗控制、人员执行、管理经验等多个方面，或许都存在不足；就算放慢开店的脚步，他认为这也只是在麻痹自己，最后的结局还是会一样。\n\n目前，朱天赐已卸任三五而栗的所有工作，其中3家门店已转手，由原来的员工、店长自负盈亏。有的门店仍在继续经营，门口招牌和员工衣服上仍写着“优先招聘三十五岁+”。\n\n回溯品牌的走红之路，其高光时刻始于2025年4月。当时朱天赐发布的招聘启事明确标注“优先招聘35岁以上青中年”，直接击中了职场环境中广受争议的“35岁就业门槛”痛点，短时间内收到上千份求职咨询，甚至有应聘者卷着铺盖守在待开业的门店门口等待面试。\n\n2025年8月首店正式开业时，店内15名员工中九成以上年龄超过35岁，近半数为需要兼顾家庭的女性群体；品牌后续还专门开设了一家以招聘残障人士为主的特色门店，运营评分一度位列区域前列，高峰时段出现排队就餐的场景，开业初期单店日营收最高可达6000元。\n\n然而，高光数据终究没能撑住高昂的运营成本。深思熟虑之后，他宣布停业，逐步通知员工、结清费用，并发布了公告。\n\n未经正式授权严禁转载本文，侵权必究。餐饮热新闻\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n三五而栗餐厅停业：曾靠35岁优先招聘走红，创始人称像“自我感动”\n\n理想与现实的落差，最终在账本上显现。\n\n原创新闻江怡曼JYM · 2026/11/20 14:34来源：界面新闻\n\n图片来源：界面图库\n\n曾因“优先招聘35岁以上员工”走红网络的长沙餐饮品牌“三五而栗”，在出圈一年半后按下了停止键。近日，该公司创始人接受媒体采访回顾了这段创业历程。\n\n此前，“三五而栗”正式发布全员通告，宣布品牌停止运营，旗下门店于10月底结束统一经营。这距离品牌首店开业仅过去14个月，这家一度被网友称为“长沙胖东来”的特色餐饮品牌，在累计亏损超过100万元后，最终选择谢幕。\n\n根据九派新闻报道，品牌创始人、95后创业者朱天赐在近日接受采访时表示，距离正式宣布停业已过去半个多月，自己至今仍处于疲惫状态。他坦言：“我们收入比别人多几百元，住得好一点，休息时间也好一些，还照顾中年人和残障人士。但后来才发现，站在我们的角度，这确实有点像自我感动。”\n\n理想与现实的落差，最终在账本上显现。朱天赐表示，品牌2025年4月开始招聘，同年8月第一家门店正式开业，到今年一共开了六家店，都在长沙。2026年9月，六家门店全部开业后，之前一直进进出出、没有理清的账目彻底清晰：大约一年时间，累计亏空100多万元。\n\n复盘这段创业经历时，朱天赐坦言“除了在网上有人说你的品牌好、有良心，现实中没有一个人觉得我们做得好”。他给自己的答案是“原因很复杂”——产品特色、损耗控制、人员执行、管理经验等多个方面，或许都存在不足；就算放慢开店的脚步，他认为这也只是在麻痹自己，最后的结局还是会一样。\n\n目前，朱天赐已卸任三五而栗的所有工作，其中3家门店已转手，由原来的员工、店长自负盈亏。有的门店仍在继续经营，门口招牌和员工衣服上仍写着“优先招聘三十五岁+”。\n\n回溯品牌的走红之路，其高光时刻始于2025年4月。当时朱天赐发布的招聘启事明确 ":"中央纪委国家监委网站11月20日通报，据湖南省纪委监委消息：经湖南省委批准，湖南省纪委监委对永州市委原常委、秘书长唐能武严重违纪违法问题进行了立案审查调查。\n\n经查，唐能武丧失理想信念，背弃初心使命，对抗组织审查；不按规定报告个人有关事项，在组织谈话时不如实说明问题，在干部选拔、职务调整等工作中为他人谋取利益；违规收受礼金，利用职权为亲属经商谋取利益；利用职务便利为他人在项目承揽、规划调整等方面谋利，并非法收受巨额财物。\n\n唐能武严重违反党的政治纪律、组织纪律和廉洁纪律，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经湖南省纪委常委会会议研究并报湖南省委批准，决定给予唐能武开除党籍处分；按规定取消其享受的退休待遇；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c93c9417cb9","title":"【异动】小盘股集体跳水，159552被逆势砸进3100万，这是抄底还是接飞刀？","url":"https://www.jiemian.com/article/15354628.html","summary":"11月20日，A股小盘股跟随两市大幅下挫。","summary_short":"11月20日，A股小盘股跟随两市大幅下挫。","digest":"11月20日，A股小盘股跟随两市大幅下挫","points":["11月20日，A股小盘股跟随两市大幅下挫","截至14时13分，中证2000跌3.64%，中证2000增强ETF招商(159552)盘中再…","据Wind Level2实时行情结合均价预估，该ETF盘中净流入超3100万元"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T14:31:47+08:00","size":1,"keywords":[],"body":"11月20日，A股小盘股跟随两市大幅下挫。截至14时13分，中证2000跌3.64%，中证2000增强ETF招商(159552)盘中再度放量。据Wind Level2实时行情结合均价预估，该ETF盘中净流入超3100万元。\n\n分析指出，3.64%的单日跌幅在小微盘身上属于典型的流动性冲击，而非基本面变化——这类资产缺乏机构定价，价格对资金面极度敏感，一旦风险偏好收缩，跌幅往往数倍于大盘。有意思的是，指数跌得越狠，资金反而越愿意买：3100万元的盘中净流入在当前价位上不算小量，说明有资金把它当成买点而不是风险。这个逻辑成立的前提是，小微盘的盈利弹性在流动性恢复后会重新被定价，而当前压制它的是资金面而非盈利面。\n据了解，中证2000增强ETF招商(159552)采用量化多因子模型动态优化组合，在中证2000指数基础上争取超额收益。根据最新披露的三季报，该基金成立以来累计超额63.48%，且每个自然年度均实现正超额，为跟踪该指数的增强ETF中历史超额最高、规模最大的品种。但需注意，历史超额不代表未来收益，增强策略在单一年度或区间可能跑输基准；小微盘成分股流动性弱于大盘、个股波动更剧烈，在缩量环境中流动性折价会更明显。\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n【异动】小盘股集体跳水，159552被逆势砸进3100万，这是抄底还是接飞刀？\n\n11月20日，A股小盘股跟随两市大幅下挫。截至14时13分，中证2000跌3.64%，中证2000增强ETF招商(159552)盘中再度放量。据Wind Level2实时行情结合均价预估，该ETF盘中净流入超3100万元。\n\n原创新闻有连云 · 2026/11/2 比高于目标权重时，卖出部分股票…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T14:31:38+08:00","size":1,"keywords":[],"body":"组合再平衡的核心操作，是当各类资产权重偏离目标中枢时，将组合权重修复至预设区间，非基于对资产价格涨跌方向的预判。中信建投相关研究指出，再平衡机制对于降低组合波动率、提升风险回报具有显著作用。大成红利智选主动ETF(158902)定位“红利底仓+质量筛选+风险优化”的投研框架，在组合权重管理维度，对应若干和再平衡执行直接关联的特征，为考察红利类ETF在再平衡体系中的功能定位提供了观测样本。\n再平衡需要什么样的权益资产\n适合用来做资产再平衡的权益工具，核心前提是它的波动主要来自大盘整体行情，而不是单一行业的特殊风险。再平衡本身是一套纪律化操作：当股票占比高于目标权重时，卖出部分股票，并将资金转向债券或其他资产；当股票占比低于目标权重时，则反向回补权益。这套操作成立的前提是，导致权重偏离的相对价格变化具有暂时性，且再平衡工具能够提供足够分散的权益敞口。\n红利ETF多偏爱银行、煤炭、交通运输等经营相对成熟、现金流较为充沛的行业，可选标的更容易呈现行业聚集的特征。大成红利智选主动ETF(158902)的差异化价值，就在于通过风险优化环节，主动控制个股与行业集中度，缓解红利策略自带的行业集中问题——产品首先满足沪深交易所主动ETF业务指引的硬性分散要求：持仓个股不少于30只，前十大持仓合计不超过基金净值60%；在此基础上，风险优化的集中度约束进一步限制了组合对单一行业或标的的依赖。对于以再平衡为目的持有红利ETF的投资者而言，这一环节的意义不在于提升收益，而在于使组合的行业暴露更接近“红利资产类别”的整体特征，而非某一行业的周期性押注。\n波动特征与再平衡的冲击成本\n再平衡操作的另一个约束是冲击成本。权重调回需要在市场上实际买卖，买卖的规模、频率和标的的流动性共同决定了操作成本。如果用于再平衡的权益资产本身波动较大，调回的频率和幅度相应增加，冲击成本也随之累积。\n红利资产在波动特征上具有相对优势。Wind数据显示，截至2026年11月19日，近三年维度下中证红利指数最大回撤约18.42%，优于沪深300、万得全A同期表现；拉长周期看，2016年11月19日至今，中证红利指数最大回撤约29.66%，同样优于同期沪深300（-45.60%）等宽基指数。更低的回撤意味着，在再平衡的触发阈值下，需要调回的权重偏离幅度相对更小，操作频率和规模相应更低。\n但低波动本身不是再平衡操作的充分条件。如果低波动来自流动性不足，再平衡的冲击成本反而可能更高。158902的流动性管理在组合层面约束持仓标的的成交活跃度，交易所的“前80%”流动性门槛过滤了成交过于清淡的标的，风险优化的集中度控制则降低了组合对单一标的承接能力的依赖。这些安排不消除冲击成本，但它们使再平衡操作面对的流动性环境相对可预期。\n风格稳定性与再平衡的标的可替代性\n再平衡操作隐含一个假设：当前买入的权益资产，应当与目标配置所要求的权益敞口基本一致。如果红利ETF在两次再平衡之间发生了明显的风格漂移，即使资产类别未变，其实际风险结构也已经改变。\n158902的风格边界由合同条款锁定：投资于股票（含存托凭证）的比例不低于基金资产净值的80%，投资于红利主题相关股票占非现金基金资产的比例不低于80%。这两条约束不因基金经理的判断而放宽，也不因市场环境的变化而调整。对于以再平衡为目的持有该产品的投资者而言，这意味着每次调回操作所对应的权益敞口，在风格属性上与上一次操作时大致相同。\n另外，业绩比较基准中证红利指数收益率提供了外部参照系。158902不跟踪该指数，但基准的存在使投资者可以将组合的行业分布与指数进行对照，观察偏离是否在红利框架内的行业之间发生。\n总结\n把上述特征放在一起，158902在再平衡场景中的功能定位可以概括为：提供一个风格边界清晰、行业暴露受控、波动特征相对可预期的红利权益敞口，使再平衡操作所依赖的“标的可替代性”和“冲击成本可预期性”具备制度基础。\n当然，再平衡的最终效果取决于组合整体的资产配置框架、再平衡阈值和操作纪律，而非单一标的的选择。再平衡是一种组合管理纪律，红利ETF是执行这一纪律的工具之一。工具的价值在于它是否使纪律的执行更可预期，而非它本身能否替代纪律。\n常见问题解答（FAQ）\nQ1：选择红利ETF作为再平衡工具，需要重点评估哪一项组合特征？\nA1：需要重点关注组合的行业分散水平。红利策略选股往往倾向于现金流稳定、分红能力较强的成熟行业，不同红利产品的行业暴露差异较大。行业分散度更好的红利标的，其收益表现会更贴近红利风格整体的收益特征。158902在红利底仓、质量筛选的基础上增加集中度风险优化，均衡行业与个股暴露，适配大类资产再平衡的配置逻辑。\nQ2：产品的低波动特征，是否意味着再平衡的冲击成本一定更低？\nA2：二者没有必然的对应关系。低波动能够减少权重偏离的幅度，降低再平衡的调仓频次与交易规模，但冲击成本还取决于标的的流动性。如果低波动来自流动性不足，冲击成本反而可能更高。158902在构建组合时纳入流动性筛选标准，对标的成交活跃度设置约束，以此平滑再平衡的执行压力。\nQ3：以再平衡为目的持有158902，需要关注什么？\nA3：需要关注风格稳定性、风险分散特征能否持续。投资者可以借助每日PCF清单和定期报告，持续观察行业、个股集中度的变化，核验组合是否维持均衡的暴露结构。基金合同也设置了相应投资约束，构成跟踪的基准底线。需要留意，即便组合分散管理机制运行稳定，再平衡最终效果依然取决于自身大类资产配置方案与执行纪律。\n产品卡：大成红利智选主动ETF（158902）\n底层资产分布与策略特征：大成红利智选主动ETF（158902）由大成基金发行，是一只采用主动管理策略的股票型ETF，定位“红利底仓+质量筛选+风险优化”，主要投资于红利主题的上市公司，在严格控制风险并保持良好流动性的前提下，力争实现基金资产的长期稳健增值。\n158902投资于股票、存托凭证的比例不低于基金资产净值的80%（港股通标的股票投资比例不超过基金股票资产的50%），投资于基金界定的红利主题相关股票（含存托凭证）占非现金基金资产的比例不低于80%。\n产品概况与上市安排：该基金于2026年10月16日获中国证监会准予注册，场内简称“红利智选主动ETF大成”。另据11月18日公告披露，158902将于2026年11月23日在深圳证券交易所上市交易，截至公告日前两个工作日（即2026年11月16日）基金份额净值为1.0026元。\n运作机制与基金经理：该基金为主动管理交易型开放式股票基金，以中证红利指数为风格锚，业绩比较基准为中证红利指数收益率（业绩比较基准仅作为表征产品风格与衡量业绩的参考，非强制跟踪标的）。基金年管理费率为1.00%，年托管费率为0.15%，采取双基金经理共管模式。\n风险提示：本文仅为行业信息梳理与产品分析，不构成任何投资建议。文中涉及的产品要素以基金合同和招募说明书为准。基金的过往业绩并不预示其未来表现，基金经理历史业绩不代表未来表现，基金管理人管理的其他基金的业绩并不构成对基金业绩表现的保证。投资有风险，入市需谨慎。\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n再平衡场景中的红利ETF：大成红利智选主动ETF(158902)的适配性分析\n\n大成红利智选主动ETF（158902）由大成基金发行，是一只采用主动管理策略的股票型ETF，定位“红利底仓+质量筛选+风险优化”，主要投资于红利主题的上市公司。\n\n原创新闻有连云 · 2026/11/20 14:31来源：界面新闻\n\n组合再平衡的核心操作，是当各类资产权重偏离目标中枢时，将组合权重修复至预设区间，非基于对资产价格涨跌方向的预判。中信建投相关研究指出，再平衡机制对于降低组合波动率、提升风险回报具有显著作用。大成红利智选主动ETF(158902)定位“红利底仓+质量筛选+风险优化”的投研框架，在组合权重管理维度，对应若干和再平衡执行直接关联的特征，为考察红利类ETF在再平衡体系中的功能定位提供了观测样本。\n再平衡需要什么样的权益资产\n适合用来做资产再平衡的权益工具，核心前提是它的波动主要来自大盘整体行情，而不是单一行业的特殊风险。再平衡本身是一套纪律化操作：当股票占比高于目标权重时，卖出部分股票，并将资金转向债券或其他资产；当股票占比低于目标权重时，则反向回补权益。这套操作成立的前提是，导致权重偏离的相对价格变化具有暂时性，且再平衡工具能够提供足够分散的权益敞口。\n红利ETF多偏爱银行、煤炭、交通运输等经营相对成熟、现金流较为充沛的行业，可选标的更容易呈现行业聚集的特征。大成红利智选主动ETF(158902)的差异化价值，就在于通过风险优化环节，主动控制个股与行业集中度，缓解红利策略自带的行业集中问题——产品首先满足沪深交易所主动ETF业务指引的硬性分散要求：持仓个股不少于30只，前十大持仓合计不超过基金净值60%；在此基础上，风险优化的集中度约束进一步限制了组合对单一行业或标的的依赖。对于以再平衡为目的持有红利ETF的投资者而言，这一环节的意义不在于提升收益，而在于使组合的行业暴露更接近“红利资产类别”的整体特征，而非某一行业的周期性押注。\n波动特征与再平衡的冲击成本\n再平衡操作的另一个约束是冲击成本。权重调回需要在市场上实际买卖，买卖的规模、频率和标的的流动性共同决定了操作成本。如果用于再平衡的权益资产本身波动较大，调回的频率和幅度相应增加，冲击成本也随之累积。\n红利资产在波动特征上具有相对优势。Wind数据显示，截至2026年11月19日，近三年维度下中证红利指数最大回撤约18.42%，优于沪深300、万得全A同期表现；拉长周期看，2016年11月19日至今，中证红利指数最大回撤约29.66%，同样优于同期沪深300（-45.60%）等宽基指数。更低的回撤意味着，在再平衡的触发阈值下，需要调回的权重偏离幅度相对更小，操作频率和规模相应更低。\n但低波动本身不是再平衡操作的充分条件。如果低波动来自流动性不足，再平衡的冲击成本反而可能更高。158902的流动性管理在组合层面约束持仓标的的成交活跃度，交易所的“前80%”流动性门槛过滤了成交过于清淡的标的，风险优化的集中度控制则降低了组合对单一标的承接能力的依赖。这些安排不消除冲击成本，但它们使再平衡操作面对的流动性环境相对可预期。\n风格稳定性与再平衡的标的可替代性\n再平衡操作隐含一个假设：当前买入的权益资产，应当与目标配置所要求的权益敞口基本一致。如果红利ETF在两次再平衡之间发生了明显的风格漂移，即使资产类别未变，其实际风险结构也已经改变。\n158902的风格边界由合同条款锁定：投资于股票（含存托凭证）的比例不低于基金资产净值的80%，投资于红利主题相关股票占非现金基金资产的比例不低于80%。这两条约束不因基金经理的判断而放宽，也不因市场环境的变化而调整。对于以再平衡为目的持有该产品的投资者而言，这意味着每次调回操作所对应的权益敞口，在风格属性上与上一次操作时大致相同。\n另外，业绩比较基准中证红利指数收益率提供了外部参照系。158902不跟踪该指数，但基准的存在使投资者可以将组合的行业分布与指数进行对照，观察偏离是否在红利框架内的行业之间发生。\n总结\n把上述特征放在一起，158902在再平衡场景中的功能定位可以概括为：提供一个风格边界清晰、行业暴露受控、波动特征相对可预期的红利权益敞口，使再平衡操作所依赖的“标的可替代性”和“冲击成本可预期性”具备制度基础。\n当然，再平衡的最终效果取决于组合整体的资产配置框架、再平衡阈值和操作纪律，而非单一标的的选择。再平衡是一种组合管理纪律，红利ETF是执行这一纪律的工具之一。工具的价值在于它是否使纪律的执行更可预期，而非它本身能否替代纪律。\n常见问题解答（FAQ）\nQ1：选择红利ETF作为再平衡工具，需要重点评估哪一项组合特征？\nA1：需要重点关注组合的行业分散水平。红利策略选股往往倾向于现金流稳定、分红能力较强的成熟行业，不同红利产品的行业暴露差异较大。行业分散度更好的红利标的，其收益表现会更贴近红利风格整体的收益特征。158902在红利底仓、质量筛选的基础上增加集中度风险优化，均衡行业与个股暴露，适配大类资产再平衡的配置逻辑。\nQ2：产品的低波动特征，是否意味着再平衡的冲击成本一定更低？\nA2：二者没有必然的对应关系。低波动能够减少权重偏离的幅度，降低再平衡的调仓频次与交易规模，但冲击成本还取决于标的的流动性。如果低波动来自流动性不足，冲击成本反而可能更高。158902在构建组合时纳入流动性筛选标准，对标的成交活跃度设置约束，以此平滑再平衡的执行压力。\nQ3：以再平衡为目的持有158902，需要关注什么？\nA3：需要关注风格稳定性、风险分散特征能否持续。投资者可以借助每日PCF清单和定期报告，持续观察行业、个股集中度的变化，核验组合是否维持均衡的暴露结构。基金合同也设置了相应投资约束，构成跟踪的基准底线。需要留意，即便组合分散管理机制运行稳定，再平衡最终效果依然取决于自身大类资产配置方案与执行纪律。\n产品卡：大成红利智选主动ETF（158902）\n底层资产分布与策略特征：大成红利智选主动ETF（158902）由大成基金发行，是一只采用主动管理策略的股票型ETF，定位“红利底仓+质量筛选+风险优化”，主要投资于红利主题的上市公司，在严格控制风险并保持良好流动性的前提下，力争实现基金资产的长期稳健增值。\n158902投资于股票、存托凭证的比例不低于基金资产净值的80%（港股通标的股票投资比例不超过基金股票资产的50%），投资于基金界定的红利主题相关股票（含存托凭证）占非现金基金资产的比例不低于80%。\n产品概况与上市安排：该基金于2026年10月16日获中国证监会准予注册，场内简称“红利智选主动ETF大成”。另据11月18日公告披露，158902将于2026年11月23日在深圳证券交易所上市交易，截至公告日前两个工作日（即2026年11月16日）基金份额净值为1.0026元。\n运作机制与基金经理：该基金为主动管理交易型开放式股票基金，以中证红利指数为风格锚，业绩比较基准为中证红利指数收益率（业绩比较基准仅作为表征产品风格与衡量业绩的参考，非强制跟踪标的）。基金年管理费率为1.00%，年托管费率为0.15%，采取双基金经理共管模式。\n风险提示：本文仅为行业信息梳理与产品分析，不构成任何投资建议。文中涉及的产品要素以基金合同和招募说明书为准。基金的过往业绩并不预示其未来表现，基金经理历史业绩不代表未来表现，基金管理人管理的其他基金的业绩并不构成对基金业绩表现的保证。投资有风险，入市需谨慎。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8fd4562133","title":"科创芯片板块重挫，什么情况？海光信息跌超10%，科创芯片ETF汇添富(588750)指数跌超3%！阿里：国产算力进度超预期！AI投资步入回报验证期","url":"https://www.jiemian.com/article/15354670.html","summary":"11月20日，A股市场震荡回调，沪指跌超2%，考验3500点，硬科技板块承压，截至14:16，科创芯片ETF汇添富（588750）标的指数跌超3%。","summary_short":"11月20日，A股市场震荡回调，沪指跌超2%，考验3500点，硬科技板块承压，截至14:16…","digest":"11月20日，A股市场震荡回调，沪指跌超2%，考验3500点，硬科技板块承压…","points":["11月20日，A股市场震荡回调，沪指跌超2%，考验3500点，硬科技板块承压，截至14…","科创芯片ETF汇添富（588750）标的指数成分股多数回调，海光信息跌超10%…","这意味着，阿里的资本开支并非简单地全面收缩，而是可能出现结构性变化…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T14:31:30+08:00","size":1,"keywords":[],"body":"11月20日，A股市场震荡回调，沪指跌超2%，考验3500点，硬科技板块承压，截至14:16，科创芯片ETF汇添富（588750）标的指数跌超3%。\n\n科创芯片ETF汇添富（588750）标的指数成分股多数回调，海光信息跌超10%，澜起科技跌超6%，源杰科技、华虹宏力跌超5%，拓荆科技、寒武纪等跌超2%，华海清科等回调。\n【科创芯片ETF汇添富（588750）标的指数前十大成分股】\n\n截至14:17，成分股仅做展示使用，不构成投资建议。\n国产芯片方面，阿里巴巴高管表示，20GW数据中心建设目标及资本开支计划可能下调。国产算力进度超出预期，预计明年一季度阿里国产芯片完全可以支持超大规模模型的训练。\n海外方面，史上最大规模IPO落地。11月19日，Anthropic在纳斯达克挂牌交易，开盘价为111.5美元/股，较83美元/股的IPO发行价上涨超过30%，盘中最高触及115.10美元/股，最终收涨17.07%报97.17美元/股，总市值达1.27万亿美元。Anthropic本次公开发行约9.8亿股，募资约813亿美元，创历史新高。\n【为何全球半导体扰动频繁？分母压制+分子扰动+微观流动性不足】\n分母压制：美联储鹰派预期升温，远期折现率上行，成长赛道久期长，对利率敏感，估值中枢下修；此外，AMD遭做空引发“循环交易/合规”疑虑与估值风险扩散。\n分子扰动：腾讯、阿里等科技大厂均表示资本开支或见顶。\n微观流动性不足：隔夜Anthropic作为史上最大规模IPO落地，抽水分流全球科技赛道资金；叠加A股市场本身连续缩量，场内承接力弱。\n其中，分子端供应链扰动是核心矛盾，而分母压制抬升估值压力、微观流动性偏弱形成共振放大下跌幅度。\n【分子端扰动是核心：如何看待AI资本开支？】\n当前AI投资从“投入期”进入“验证期”。不过值得注意的是，国内大厂资本开支不是“总量断崖式收缩”，而是从无上限军备扩张，转向ROI 约束、结构再分配，国产算力反而可能投入更积极。\n阿里电话会上，其CFO表示“审慎根据市场情况投入AI建设，注重提升资本回报率。”管理层还表示，整体资本开支计划也可能相应调整，但国产算力及相关供应链的投入会更加积极。这意味着，阿里的资本开支并非简单地全面收缩，而是可能出现结构性变化，减少对部分海外算力资源的依赖，将更多资源转向国产芯片和自主供应链。\n而从算力供需视角来看，阿里管理层在电话会中反复强调的一个判断是：全球AI算力供不应求，这一格局未来几年不会改变。而中国的算力紧缺尤为严重，管理层认为2027—2028年国内市场算力将处于紧缺状态，整体算力价格、毛利有较好的保障基础。\n因此，国产芯片的自主创新逻辑有望进一步强化。往后看，对于半导体板块的投资者而言，除了科技大厂的资本开支情况外，国产芯片产能爬坡、单位算力成本等变量同样值得关注。\n【国产芯片：自主创新大势所趋，国产占比提升】\n华福证券指出，IDC数据报道，2025年中国AI加速卡出货量约400万张，国产厂商合计出货约165万张，占比约41%；2026上半年主要五家国产厂商份额合计47%，11家厂商中9家出货量同比增长。IDC预计2026年中国AI加速器整体出货量同比增长19%。（来源于国产算力20261109《推理放量与云厂资本开支共振，AIDC 和国产芯片需求旺盛》）\n往后看，国泰海通认为，国产AI芯片替代有望提速，算力基础设施产业链迎来发展机遇。BIS此次规则将特定境外数据中心远程提供算力的行为纳入许可管理，有望进一步推动国内云厂商、互联网企业及智算中心加大国产算力布局。随着国产AI芯片性能持续提升、软硬件生态不断完善，国产芯片在AI训练、推理及行业应用中的渗透率有望逐步提高，并带动AI服务器、存储、高速交换机、光模块及液冷等配套环节协同发展，推动国产算力产业链规模化建设。（来源于国泰海通20261119《计算机：BIS强化先进算力远程访问管制，国产算力自主可控及信创产业链有望受益》）\n【半导体市场波动剧烈，如何布局？】\n国产替代不是“一蹴而就”，验证周期长、良率爬坡会有反复，行情不会单边上涨，注定是会波动期的。因此这条主线适合用ETF长期布局，而不是短线博弈。\n而在市场高波动，风格切换频繁的背景下，当下配置思路推荐哑铃型配置：一部分拿高确定性底仓（如港股通红利ETF汇添富（513820）），依靠红利资产稳定现金流对冲赛道波动；另一端布局长期高景气的科创芯片ETF汇添富（588750），博弈成长弹性，做到攻防兼备。\n同时要注意震荡行情的核心操作纪律：拒绝一把梭！半导体预期摇摆、波动剧烈，采用分批定投思路，把资金拆开，平滑买入成本，降低单一时点的择时风险。\nAI基建超级周期仍可期待，存储、CPU、晶圆、先进封装等供需缺口全面超预期，$科创芯片ETF汇添富(588750)标的指数算力（含CPU/GPU/ASCI）+存储+先进制造含量高达87%！高度聚焦高纯度芯片赛道。20CM涨跌幅“大长腿”轻松把握高景气赛道成长机遇。场外投资者可关注联接基金（A：020628；C：020629），可7*24申赎。\n若希望更精准布局国产算力及存储，可关注$科创芯片设计ETF汇添富(589290)，算力(含CPU/GPU/ASIC)+存储含量高达70%，在AI算力需求爆发+存储芯片涨价超级周期+国产替代三重共振下，有望充分受益于AI浪潮与自主趋势下的国产算力及存储产业链历史性发展机遇，20CM大长腿更有助于轻松把握本轮超级周期！\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n科创芯片板块重挫，什么情况？海光信息跌超10%，科创芯片ETF汇添富(588750)指数跌超3%！阿里：国产算力进度超预期！AI投资步入回报验证期\n\n11月20日，A股市场震荡回调，沪指跌超2%，考验3500点，硬科技 逐步显现。跨境电子合同效力、数字知识产权保护、数据跨境流动、隐私合规、平台监管责任等议题，各经济体标准不一、诉求各异。针对区域发展差异化现状，本次峰会没有推行一刀切的刚性规则，延续了APEC协商一致、自愿务实的合作传统，优先推动最佳实践互认、政策经验交流与发展中经济体能力建设。\n\n《深圳展望》中表示：“我们注意到环境及相关挑战带来的影响，鼓励亚太经合组织各经济体思考如何通过能力建设和经验交流，助力实现各自的环境与贸易目标。”这种包容渐进的路径，贴合亚太多元发展格局，避免高标准规则脱离部分经济体的承载能力，保障合作可持续推进。\n\nAI等新兴技术的深度融入，既拓宽了贸易数字化的发展空间，也带来全新治理挑战。智能报关、大数据供应链预测、全流程数字化溯源，持续提升区域产业链、供应链的韧性与效率。与此同时，算法偏差、虚假信息、跨境侵权等风险，也依托数字化渠道快速扩散。本次《深圳展望》强调负责任创新与风险可控并重，通过强化知识产权保护、网络风险防控、数字贸易合规治理，为贸易数字化发展筑牢“安全阀”，确保开放便利不牺牲市场秩序与市场主体合法权益。\n\n当前全球多边经贸体系承压，保护主义、阵营化趋势抬头，亚太亟需增量合作动能稳住开放发展的基本盘。贸易数字化避开争议较大的存量利益博弈，聚焦共识充足、收益明确的流程改革，以小切口积累大互信，持续夯实亚太开放合作根基。\n\n长远来看，贸易数字化是亚太深度一体化的重要试金石。其价值不止于短期提振贸易规模，更在于通过长期规则对接、标准互认、治理协同，培育统一的区域数字经贸话语体系，为未来更高水平的区域经济一体化铺路。亚太能否持续巩固全球经济增长的主引擎地位，关键在于能否把握贸易数字化转型机遇，在开放便利、风险治理、普惠均衡之间找准可持续的发展支点。\n\n未经正式授权严禁转载本文，侵权必究。热点锐评\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n界面快评｜亚太贸易数字化先行：用“低摩擦”对冲“高分歧”\n\n贸易数字化避开争议较大的存量利益博弈，聚焦共识充足、收益明确的流程改革，以小切口积累大互信，持续夯实亚太开放合作根基。\n\n原创新闻张一诺 · 2026/11/20 14:30来源：界面新闻\n\n2026年11月19日，深圳，中共中央政治局委员、外交部长王毅在位于广东深圳的2026年APEC领导人会议周新闻中心举行中外记者会。图片来源：视觉中国\n\n 界面新闻记者 | 张一诺\n界面新闻编辑 | 王强\n\n2026年《亚太经合组织领导人深圳展望》（以下简称《深圳展望》）将贸易数字化置于突出位置，会议通过了《亚太经合组织贸易数字化合作框架（2027-2030）》，释放明确信号：亚太新一轮区域经贸融合，将以贸易数字化为突破口，以数字软联通打通区域贸易微循环、激活一体化新动能。\n\n亚太集聚全球最密集的产业链与最活跃的跨境经贸往来，但区域经济一体化长期受制于结构性瓶颈。各经济体发展阶段悬殊、利益诉求多元，关税谈判、市场准入开放等传统核心议题博弈激烈、推进缓慢，深层次贸易壁垒难以短期破除。相比之下，贸易数字化具备天然的合作优势：无纸化通关、电子单证互认、跨境电商流程协同、检验检疫数据互通，聚焦监管流程优化与制度协同，属于低摩擦、高共识的“软联通”改革。传统关税与市场准入谈判涉及存量利益的再分配，而数字化聚焦的是流程效率的增量改进——前者是“分蛋糕”，后者是“把切蛋糕的手续费降下来”，落地门槛更低、见效更快，是当前多边合作最稳妥的先行赛道。\n\n贸易数字化绝非简单的线下流程线上迁移，而是对传统贸易全链条成本体系的系统性重塑。从原产地证书电子化、海关数据共享，到跨境支付便利、物流溯源互通、核验流程简化，数字化手段大幅压缩通关时长、减少重复审查、降低制度性交易成本。\n\nAPEC秘书处11月3日介绍合作进展时指出，相关研究测算，国际贸易单据数字化有望将贸易交易成本降低5.8%；无纸化贸易的降本增效效应也在具体试点中显现。亚太示范电子口岸网络在成员机构间试点进出口贸易数据“一次录入、多边重复使用”模式，整体报关成本降低66%，报关时间压缩近50%。\n\n这一变革对亚太海量中小微企业意义重大。长期以来，中小微主体受限于信息不对称、跨境流程繁琐、合规成本偏高，难以深度嵌入区域产业链。今年APEC无纸贸易卓越中心正式启动，聚焦能力建设、经验互鉴和实践分享开展工作。而APEC推动的这些贸易数字化改革，本质上是降低跨境贸易的参与门槛，让中小企业平等共享亚太大市场的发展红利，激活区域贸易的微观活力。\n\n在快速推进改革的同时，贸易数字化的规则分歧与治理难题也逐步显现。跨境电子合同效力、数字知识产权保护、数据跨境流动、隐私合规、平台监管责任等议题，各经济体标准不一、诉求各异。针对区域发展差异化现状，本次峰会没有推行一刀切的刚性规则，延续了APEC协商一致、自愿务实的合作传统，优先推动最佳实践互认、政策经验交流与发展中经济体能力建设。\n\n《深圳展望》中表示：“我们注意到环境及相关挑战带来的影响，鼓励亚太经合组织各经济体思考如何通过能力建设和经验交流，助力实现各自的环境与贸易目标。”这种包容渐进的路径，贴合亚太多元发展格局，避免高标准规则脱离部分经济体的承载能力，保障合作可持续推进。\n\nAI等新兴技术的深度融入，既拓宽了贸易数字化的发展空间，也带来全新治理挑战。智能报关、大数据供应链预测、全流程数字化溯源，持续提升区域产业链、供应链的韧性与效率。与此同时，算法偏差、虚假信息、跨境侵权等风险，也依托数字化渠道快速扩散。本次《深圳展望》强调负责任创新与风险可控并重，通过强化知识产权保护、网络风险防控、数字贸易合规治理，为贸易数字化发展筑牢“安全阀”，确保开放便利不牺牲市场秩序与市场主体合法权益。\n\n当前全球多边经贸体系承压，保护主义、阵营化趋势抬头，亚太亟需增量合作动能稳住开放发展的基本盘。贸易数字化避开争议较大的存量利益博弈，聚焦共识充足、收益明确的流程改革，以小切口积累大互信，持续夯实亚太开放合作根基。\n\n长远来看，贸易数字化是亚太深度一体化的重要试金石。其价值不止于短期提振贸易规模，更在于通过长期规则对接、标准互认、治理协同，培育统一的区域数字经贸话语体系，为未来更高水平的区域经济一体化铺路。亚太能否持续巩固全球经济增长的主引擎地位，关键在于能否把握贸易数字化转型机遇，在开放便利、风险治理、普惠均衡之间找准可持续的发展支点。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c489c83f688","title":"“深漂”荷兰创客爱上华强北 帮全球创客脑洞落地","url":"https://www.chinanews.com/cj/shipin/cns/2026/11-20/news1075563.shtml","summary":"说起华强北，很多人第一反应是电子配件天堂，而来自荷兰的亨克·维尔纳，算是这里老牌“洋创客”了。","summary_short":"说起华强北，很多人第一反应是电子配件天堂，而来自荷兰的亨克·维尔纳，算是这里老牌“洋创客”了。","digest":"说起华强北，很多人第一反应是电子配件天堂，而来自荷兰的亨克·维尔纳…","points":["说起华强北，很多人第一反应是电子配件天堂，而来自荷兰的亨克·维尔纳，算是这里老牌“洋创客”了","因为一趟深圳之行而被华强北圈粉，他决定打包行囊，来到中国开启“深漂”","近日，记者来到亨克在华强北创办的的创客空间：TroubleMaker，意思是“麻烦制造者”…"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T14:30:14+08:00","size":1,"keywords":[],"body":"说起华强北，很多人第一反应是电子配件天堂，而来自荷兰的亨克·维尔纳，算是这里老牌“洋创客”了。因为一趟深圳之行而被华强北圈粉，他决定打包行囊，来到中国开启“深漂”。\n\n近日，记者来到亨克在华强北创办的的创客空间：TroubleMaker，意思是“麻烦制造者”，这里为来自世界各地的创客们提供了一个让创意落地的平台，从这里诞生的新设计、新产品几乎所有材料都来自华强北。名为“麻烦制造者”，但实际上则是“麻烦解决者”，亨克利用自己对华强北的熟悉，化身引路人，帮外籍创客筛选零件、对接厂家、打通落地全流程。\n\n记者 王庆然 广东深圳报道","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/12BCF3A1BCFE4B568F03FCAEB451657B.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2421bea258","tit
