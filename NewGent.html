<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // 状态
  // ---------------------------------------------------------------
  var state = {
    data: null,
    theme: "light",
    mod: "news",        // news | live | radio | settings
    section: null,      // null = 今日要闻
    trend: null,        // 非 null = 正在看某个热搜榜（weibo / bilibili …）
    trendItem: null,    // 热搜榜里选中的那一条（rank），null = 看榜单概览
    storyId: null,
    source: "",         // 数据来源说明
    radio: { key: null, hls: null }
  };

  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ---------------------------------------------------------------
  // 时间：今天只显示时分，其余带日期
  // ---------------------------------------------------------------
  function fmtTime(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso).replace("T"," ").slice(0,16);
    var now = new Date();
    var hh = String(d.getHours()).padStart(2,"0");
    var mm = String(d.getMinutes()).padStart(2,"0");
    var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
    if(sameDay) return hh + ":" + mm;
    var mo = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    if(d.getFullYear()===now.getFullYear()) return mo + "-" + dd + " " + hh + ":" + mm;
    return d.getFullYear() + "-" + mo + "-" + dd;
  }

  function fmtStamp(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso).slice(0,16);
    var p = function(n){ return String(n).padStart(2,"0"); };
    return (d.getMonth()+1) + "月" + d.getDate() + "日 " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // 热度：464972 → 46.5万
  function fmtCount(n){
    n = Number(n) || 0;
    if(!n) return "";
    if(n >= 100000000) return (n / 100000000).toFixed(1) + "亿";
    if(n >= 10000) return (n / 10000).toFixed(1) + "万";
    return String(n);
  }

  // ---------------------------------------------------------------
  // 主题
  // ---------------------------------------------------------------
  function setTheme(t){
    state.theme = t;
    root.setAttribute("data-theme", t);
    try { localStorage.setItem("ng-theme", t); } catch(e){}
    document.querySelectorAll("[data-pick]").forEach(function(el){
      el.classList.toggle("on", el.getAttribute("data-pick") === t);
    });
  }

  function initTheme(){
    var saved = null;
    try { saved = localStorage.getItem("ng-theme"); } catch(e){}
    if(saved && ["light","dark","sepia","glass"].indexOf(saved) >= 0){ setTheme(saved); return; }
    // 跟随系统
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(dark ? "dark" : "light");
  }

  // ---------------------------------------------------------------
  // 字号：用户选的档位 × 窗口宽度系数
  //   档位决定基准，宽度系数让字号随窗口变大而变大（窄屏不加成，
  //   免得手机上折行太碎）。两者相乘写进 --fs，全站字号都吃这个变量。
  // ---------------------------------------------------------------
  var FONT_STEPS = [
    ["s",  "小",   0.95],
    ["m",  "标准", 1.12],
    ["l",  "大",   1.28],
    ["xl", "特大", 1.45]
  ];
  var FONT_KEY = "ng-fs";
  var fontStep = "m";

  function viewportFontFactor(){
    var w = window.innerWidth;
    if(w <= 1040) return 1;
    return Math.min(1.2, Math.max(1, w / 1400));
  }

  function fontScaleOf(step){
    for(var i = 0; i < FONT_STEPS.length; i++){
      if(FONT_STEPS[i][0] === step) return FONT_STEPS[i][2];
    }
    return 1.12;
  }

  function applyFont(){
    var total = fontScaleOf(fontStep) * viewportFontFactor();
    total = Math.min(1.7, Math.max(0.8, total));
    document.documentElement.style.setProperty("--fs", total.toFixed(3));
  }

  function setFont(step){
    fontStep = step;
    try { localStorage.setItem(FONT_KEY, step); } catch(e){}
    applyFont();
    document.querySelectorAll("[data-set-font]").forEach(function(el){
      el.classList.toggle("on", el.getAttribute("data-set-font") === step);
    });
  }

  function initFont(){
    var saved = null;
    try { saved = localStorage.getItem(FONT_KEY); } catch(e){}
    if(saved && FONT_STEPS.some(function(s){ return s[0] === saved; })) fontStep = saved;
    applyFont();
  }

  var fontResizeTimer = null;
  window.addEventListener("resize", function(){
    if(fontResizeTimer) clearTimeout(fontResizeTimer);
    fontResizeTimer = setTimeout(applyFont, 120);
  });

  // ---------------------------------------------------------------
  // 数据
  // ---------------------------------------------------------------
  function acceptData(obj, sourceLabel, keepView){
    if(!obj || !Array.isArray(obj.headlines) || !Array.isArray(obj.sections)){
      alert("这个文件不是 NewGent 的数据包（缺少 headlines / sections）。");
      return false;
    }

    var prevSection = state.section;
    var prevTrend = state.trend;
    var prevStory = state.storyId;

    state.data = obj;
    state.source = sourceLabel || "";

    if(keepView){
      // 自动刷新时保住用户正在看的位置：分区没了就退回要闻，事件没了就选列表第一条
      var secs = obj.sections || [];
      var boards = (obj.trending && obj.trending.boards) || [];
      state.trend = (prevTrend && boards.some(function(b){ return b.key === prevTrend; }))
        ? prevTrend : null;
      state.section = (prevSection === VIDEO_SECTION)
        ? VIDEO_SECTION
        : ((prevSection && secs.some(function(s){ return s.name === prevSection; }))
            ? prevSection : null);
      state.storyId = prevStory && findStory(prevStory)
        ? prevStory
        : (currentStories()[0] ? currentStories()[0].id : null);
    } else {
      state.section = null;
      state.trend = null;
      var first = obj.headlines[0] || (obj.sections[0] && obj.sections[0].items[0]) || null;
      state.storyId = first ? first.id : null;
    }

    setUpdatedLabel(obj.generated_at);
    render();
    // 模块内容跟着数据一起刷新，免得停在旧数据上
    if(state.mod === "live") renderLive();
    if(state.mod === "radio") renderRadio();
    if(state.mod === "settings") renderSettings();
    return true;
  }

  //: 超过这个小时数就认为数据不再新鲜，顶栏直接标红提醒
  var STALE_HOURS = 6;

  function setUpdatedLabel(iso){
    var el = $("updated");
    if(!iso){ el.textContent = ""; return; }
    var t = Date.parse(iso);
    var age = isNaN(t) ? -1 : (Date.now() - t) / 3600000;
    var stale = age > STALE_HOURS;
    el.classList.toggle("stale", stale);
    el.innerHTML = '<span class="dot"></span><span>' +
      esc(stale ? "数据停在 " + fmtStamp(iso) + " · 需刷新" : "更新于 " + fmtStamp(iso)) +
      '</span>';
  }

  function flashUpdated(){
    var el = $("updated");
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 1200);
  }

  // ---------------------------------------------------------------
  // 数据来源：优先读同目录 app_data.json（能自动刷新），
  // 拿不到才退回内联快照（file:// 双击打开时走这条）
  // ---------------------------------------------------------------
  function fetchData(timeoutMs){
    return new Promise(function(resolve, reject){
      var done = false;
      var timer = setTimeout(function(){
        if(!done){ done = true; reject(new Error("timeout")); }
      }, timeoutMs || 1500);

      // 时间戳 + no-store 双保险：GitHub Pages 对静态文件有 10 分钟缓存，
      // 少任何一个，刚打开页面看到的都可能是十分钟前的旧数据。
      var url = "app_data.json?t=" + Date.now();
      fetch(url, { cache: "no-store" })
        .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("http " + r.status)); })
        .then(function(obj){
          if(done) return;
          done = true; clearTimeout(timer); resolve(obj);
        })
        .catch(function(err){
          if(done) return;
          done = true; clearTimeout(timer); reject(err);
        });
    });
  }

  function loadInline(){
    var node = $("ng-data");
    if(!node) return false;
    var raw = (node.textContent || "").trim();
    if(!raw || raw.indexOf("__NG_DATA__") >= 0) return false;
    try {
      return acceptData(JSON.parse(raw), "内置快照");
    } catch(e){
      console.error("内置数据解析失败", e);
      return false;
    }
  }

  var pollTimer = null;

  function startPolling(){
    if(pollTimer) return;
    $("updated").classList.add("live");
    pollTimer = setInterval(tick, 60 * 1000);
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) tick();   // 切回来立刻补一次
    });
    // 从「往返缓存」恢复（手机上按返回、切后台再回来）时页面不会重新加载，
    // 这里补一次，否则看到的是离开那一刻的数据
    window.addEventListener("pageshow", function(e){
      if(e.persisted) tick();
    });
  }

  function tick(){
    if(document.hidden) return;
    fetchData(8000).then(function(obj){
      var cur = state.data && state.data.generated_at;
      if(obj.generated_at !== cur){
        acceptData(obj, "实时数据", true);
        flashUpdated();
      }
    }).catch(function(){ /* 网络抖动就跳过，下一轮再说 */ });
  }

  function boot(){
    initTheme();
    initFont();
    // 打开即拉最新，不读缓存；拿不到才退回内联快照（file:// 双击打开时走这条）
    fetchData(6000).then(function(obj){
      acceptData(obj, "实时数据");
      startPolling();
    }).catch(function(){
      if(!loadInline()) showNeedData();
    });
  }

  // 手动刷新：设置页那个按钮
  function refreshNow(){
    fetchData(12000).then(function(obj){
      acceptData(obj, "实时数据", true);
      flashUpdated();
    }).catch(function(){
      var el = $("updated");
      if(el) el.classList.add("stale");
    });
  }

  function showNeedData(){
    $("sidebar").innerHTML = "";
    $("listScroll").innerHTML = "";
    $("listCount").textContent = "";
    $("detail").innerHTML =
      '<div class="empty">' +
        '<div class="e1">还没有数据</div>' +
        '<div class="e2">点右上角「载入数据」，选择项目里的 data/app_data.json；<br>或者直接把那个文件拖进这个窗口。</div>' +
      '</div>';
  }

  // ---------------------------------------------------------------
  // 取当前视图的事件列表
  // ---------------------------------------------------------------
  //: 「視頻」不是数据里的分区，是个跨分区的筛选视图：凡是带视频的都收进来
  var VIDEO_SECTION = "視頻";

  function allStories(){
    if(!state.data) return [];
    var out = (state.data.headlines || []).slice();
    (state.data.sections || []).forEach(function(sec){
      out = out.concat(sec.items || []);
    });
    return out;
  }

  function videoStories(){
    var seen = {};
    return allStories().filter(function(s){
      if(!s.video || seen[s.id]) return false;
      seen[s.id] = 1;
      return true;
    }).sort(function(a, b){
      return String(b.published_at || "").localeCompare(String(a.published_at || ""));
    });
  }

  function currentStories(){
    if(!state.data) return [];
    if(state.trend) return [];   // 热搜视图没有事件，方向键不该在这里挪
    if(state.section === VIDEO_SECTION) return videoStories();
    if(state.section){
      var sec = state.data.sections.filter(function(s){ return s.name === state.section; })[0];
      return sec ? sec.items : [];
    }
    return state.data.headlines || [];
  }

  // 当前选中的热搜榜；没选返回 null
  function currentBoard(){
    if(!state.data || !state.trend) return null;
    var boards = (state.data.trending && state.data.trending.boards) || [];
    for(var i=0;i<boards.length;i++) if(boards[i].key === state.trend) return boards[i];
    return null;
  }

  function findStory(id){
    var list = currentStories();
    for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
    // 跨区查找（详情里点关联报道时可能不在当前列表）
    if(state.data){
      var all = (state.data.headlines || []).concat(
        (state.data.sections || []).reduce(function(a,s){ return a.concat(s.items || []); }, [])
      );
      for(var j=0;j<all.length;j++) if(all[j].id === id) return all[j];
    }
    return null;
  }

  // ---------------------------------------------------------------
  // 渲染：侧栏
  // ---------------------------------------------------------------
  function renderSidebar(){
    var d = state.data;
    if(!d){ return; }
    var html = "";

    html += '<div class="sb-group">版面</div>';
    html += sbItem("今日要闻", (d.headlines||[]).length, !state.section && !state.trend, false, null);
    html += sbItem("視頻", videoStories().length, state.section === VIDEO_SECTION, false, VIDEO_SECTION);
    html += sbItem("直播", (d.live||[]).length, false, false, "__live__");

    if((d.sections||[]).length){
      html += '<div class="sb-group">分区</div>';
      d.sections.forEach(function(s){
        html += sbItem(s.name, (s.items||[]).length, state.section === s.name, false, s.name);
      });
    }

    var boards = (d.trending && d.trending.boards) || [];
    if(boards.length){
      html += '<div class="sb-group">熱搜</div>';
      boards.forEach(function(b){
        var n = b.count || (b.items||[]).length;
        html += '<div class="sb-item' + (state.trend === b.key ? " on" : "") +
                '" data-trend="' + esc(b.key) + '">' +
                  '<span>' + esc(b.display) + '</span>' +
                  '<span class="cnt">' + n + '</span>' +
                '</div>';
      });
    }

    if((d.live||[]).length){
      html += '<div class="sb-group">直播频道</div>';
      d.live.forEach(function(ch, i){
        html += '<div class="sb-item" data-live="' + i + '">' +
                  '<span class="sb-dot" style="' + (ch.live_status === 1 ? "" : "background:var(--t3)") + '"></span>' +
                  '<span>' + esc(ch.name) + '</span>' +
                  (ch.live_status === 1 ? '<span class="sb-live-tag">直播中</span>' : '') +
                '</div>';
      });
    }

    if(d.sources && d.sources.length){
      html += '<div class="sb-group">来源</div>';
      d.sources.forEach(function(s){
        html += '<div class="sb-item" style="cursor:default;color:var(--t3)">' + esc(s.display || s.name) + '</div>';
      });
    }

    $("sidebar").innerHTML = html;
  }

  function sbItem(label, count, active, live, key){
    var cls = "sb-item" + (active ? " on" : "");
    var attr = key === null ? 'data-plain="1"' : (key === "__live__" ? 'data-live-open="1"' : 'data-sec="' + esc(key) + '"');
    return '<div class="' + cls + '" ' + attr + '>' +
             (live ? '<span class="sb-dot"></span>' : '') +
             '<span>' + esc(label) + '</span>' +
             '<span class="cnt">' + count + '</span>' +
           '</div>';
  }

  // ---------------------------------------------------------------
  // 渲染：列表
  // ---------------------------------------------------------------
  function renderList(){
    if(state.trend){ renderTrendList(); return; }

    var list = currentStories();
    $("listTitle").textContent = state.section || "今日要闻";
    $("listCount").textContent = list.length + " 个事件";

    if(!list.length){
      $("listScroll").innerHTML = '<div class="empty"><div class="e1">这个分区还没有内容</div></div>';
      return;
    }

    var html = "";

    // 今日速览：只挂在「今日要闻」顶部，分区里不重复出现
    if(!state.section && !state.trend) html += briefCardHtml();

    list.forEach(function(s, i){
      var isHead = !state.section && i === 0;
      html += '<div class="row' + (isHead ? " head" : "") + (s.id === state.storyId ? " on" : "") +
              '" data-story="' + esc(s.id) + '">' +
                '<h3>' + esc(s.title) + '</h3>' +
                (s.digest || s.summary_short || s.summary
                  ? '<p>' + esc(s.digest || s.summary_short || s.summary) + '</p>' : '') +
                metaHtml(s) +
              '</div>';
    });
    $("listScroll").innerHTML = html;
  }

  function metaHtml(s){
    var parts = [];
    if(s.category) parts.push('<span class="cat">' + esc(s.category) + '</span>');
    if(s.video) parts.push('<span class="vtag">▶ 視頻</span>');
    if(s.published_at) parts.push('<span>' + esc(fmtTime(s.published_at)) + '</span>');
    if((s.size || 1) > 1) parts.push('<span class="n">' + s.size + ' 篇报道</span>');
    if(s.source_display) parts.push('<span>' + esc(s.source_display) + '</span>');
    return '<div class="meta">' + parts.join('<span class="sep"></span>') + '</div>';
  }

  // 今日速览：头条里挑出互不重复的几条，点一条直接跳过去
  function briefCardHtml(){
    var b = state.data && state.data.brief;
    if(!b || !b.items || !b.items.length) return "";
    var html = '<div class="briefcard">' +
      '<div class="bh"><b>速覽</b><small>' + esc(b.lead || "") + '</small></div>';
    b.items.forEach(function(it){
      html += '<button class="bi" data-story="' + esc(it.id) + '">' +
                '<span class="s">' + esc(it.section || "") + '</span>' +
                '<span class="t">' + esc(it.line || it.title) + '</span>' +
              '</button>';
    });
    return html + '</div>';
  }

  // 热搜榜：分类分组 + 排名 + 关键词 + 摘要。点一条看摘要，不跳站
  function trendRow(it, idx){
    var sub = [];
    if(it.heat) sub.push(fmtCount(it.heat));
    if(it.meta) sub.push(it.meta);
    // 分组展示时用组内序号，避免出现 1 2 4 5 9 这种断号
    var no = idx == null ? it.rank : idx;
    return '<div class="trow' + (no <= 3 ? " top" : "") +
           (state.trendItem === it.rank ? " on" : "") +
           '" data-trend-item="' + it.rank + '">' +
             '<span class="rk">' + no + '</span>' +
             '<span class="tx"><b>' + esc(it.title) + '</b>' +
               (it.summary ? '<span class="sm">' + esc(it.summary) + '</span>' : '') +
               (sub.length ? '<small>' + esc(sub.join(" · ")) + '</small>' : '') +
             '</span>' +
             (it.label ? '<span class="tag">' + esc(it.label) + '</span>' : '') +
           '</div>';
  }

  function renderTrendList(){
    var b = currentBoard();
    $("listTitle").textContent = b ? b.display : "熱搜";
    if(!b){
      $("listCount").textContent = "";
      $("listScroll").innerHTML = '<div class="empty"><div class="e1">这个榜暂时没数据</div></div>';
      return;
    }
    var items = b.items || [];
    $("listCount").textContent = items.length + " 条";

    if(!items.length){
      $("listScroll").innerHTML = '<div class="empty"><div class="e1">这个榜暂时没数据</div></div>';
      return;
    }

    var html = "";
    if(b.grouped && b.groups && b.groups.length){
      // 平台自带分类（微博），按时政 → 民生 → 娱乐 → 体育 → 财经科技 → 其他 排
      b.groups.forEach(function(g){
        html += '<div class="tgroup"><span>' + esc(g.group) + '</span>' +
                '<span class="n">' + g.count + '</span></div>';
        html += (g.items || []).map(function(it, i){ return trendRow(it, i + 1); }).join("");
      });
    } else {
      html = items.map(trendRow).join("");
    }
    $("listScroll").innerHTML = html;
  }

  // 窄屏详情页左上角的返回按钮。桌面端靠 CSS 隐藏
  function backBtnHtml(){
    return '<button class="backbtn" data-back="1">' +
             '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
               'stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5 8 12l6.5 5.5"/></svg>' +
             '<span>返回列表</span>' +
           '</button>';
  }

  // 窄屏从详情退回列表，并把刚才那条滚回视野
  function backToList(){
    $("main").classList.remove("split");
    var node = document.querySelector('.row[data-story="' + CSS.escape(state.storyId || "") + '"]');
    if(node && node.scrollIntoView) node.scrollIntoView({ block: "center" });
  }

  // ---------------------------------------------------------------
  // 渲染：详情
  // ---------------------------------------------------------------
  function renderDetail(){
    if(state.trend){ renderTrendDetail(); return; }

    var s = state.storyId ? findStory(state.storyId) : null;
    if(!s){
      $("detail").innerHTML =
        '<div class="empty">' +
          '<div class="e1">选择一个事件</div>' +
          '<div class="e2">从中间列表点一条新闻，或按 ↑ ↓ 切换</div>' +
        '</div>';
      return;
    }

    var html = '<div class="detail-inner">' + backBtnHtml();

    // 标题在左，操作按钮钉右上角（窄屏由 CSS 挪到标题上方）
    html += '<div class="dhead"><div class="dhead-main">';
    if(s.category) html += '<div class="kicker">' + esc(s.category) + '</div>';
    html += '<h1>' + esc(s.title) + '</h1>';
    html += '</div><div class="dactions">';
    html += '<button class="act" data-listen="1" title="用系统语音朗读这一条">听新闻</button>';
    if(s.url){
      html += '<button class="act primary" data-url="' + esc(s.url) +
              '" title="在浏览器打开原文">看原文</button>';
    }
    html += '<button class="act" data-live-open="1" title="跳到直播频道">看直播</button>';
    html += '</div></div>';

    var by = [];
    if(s.source_display) by.push(esc(s.source_display));
    if(s.published_at) by.push(esc(fmtTime(s.published_at)));
    if((s.size || 1) > 1) by.push('<span style="color:var(--accent);font-weight:550">' + s.size + ' 篇报道</span>');
    html += '<div class="byline">' + by.join('<span class="sep"></span>') + '</div>';

    var lead = s.summary || s.digest;
    if(lead) html += '<div class="lead">' + esc(lead) + '</div>';

    // 视频：源站给了直链就内嵌播；没给就整块不渲染，不留空框
    if(s.video){
      html += '<div class="vwrap">' +
                '<video controls playsinline preload="metadata"' +
                  (s.video_poster ? ' poster="' + esc(s.video_poster) + '"' : '') +
                  ' src="' + esc(s.video) + '"></video>' +
                '<div class="vfallback" hidden>这段视频在当前浏览器里播不了（编码或跨域限制），' +
                  '<a href="' + esc(s.video) + '" target="_blank" rel="noopener">在新窗口打开</a></div>' +
                '<div class="vsrc">▶ <b>' + esc(s.source_display || "來源") + '</b>' +
                  '<span>原片，未轉載</span>' +
                  '<a href="' + esc(s.video) + '" target="_blank" rel="noopener">新窗口</a></div>' +
              '</div>';
    }

    // 速览：正文里抽 3 句。抽不满 2 句就不显示，宁缺勿滥
    if(s.points && s.points.length >= 2){
      html += '<div class="brief"><div class="bh"><i></i>AI 速覽</div><ol>' +
                s.points.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("") +
              '</ol><div class="note">由正文自動抽取的關鍵句，未改寫；完整內容見下方全文。</div></div>';
    }

    if(s.body && s.body.trim()){
      var paras = s.body.split(/\n+/).map(function(p){ return p.trim(); }).filter(Boolean);
      html += '<div class="prose">' + paras.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join("") + '</div>';
    } else {
      html += '<div class="hint">（该源未提供正文，请点右上角「看原文」）</div>';
    }

    // 转载说明：正文是别人写的，出处和链接都摆出来
    if(s.body && s.body.trim()){
      var sn = ['轉載自 <b>' + esc(s.source_display || s.source || "原媒體") + '</b>'];
      html += '<div class="source-note"><div class="sn1">' + sn.join("") +
                (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">原文連結</a>' : '') +
              '</div><div class="sn2">版權歸原作者及原媒體所有，僅供個人閱讀，不作商業用途。</div></div>';
    }

    // 多源：同一件事各家怎么说，说法相近的已经合并成一条
    if(s.cross && s.cross.angles && s.cross.angles.length > 1){
      html += '<div class="cross"><div class="ch">多源怎麼說 · 共 ' + s.cross.total + ' 篇</div>';
      s.cross.angles.forEach(function(a){
        var names = (a.sources || []).filter(Boolean);
        html += '<div class="ca"><div class="cp">' + esc(a.point) + '</div>' +
                (names.length
                  ? '<div class="cs">' + names.map(function(n){ return '<span>' + esc(n) + '</span>'; }).join("") + '</div>'
                  : '') +
                '</div>';
      });
      html += '</div>';
    }

    html += pagerHtml();

    if(s.items && s.items.length > 1){
      html += '<div class="related"><div class="rh">同一事件 ' + s.items.length + ' 篇报道</div>';
      s.items.forEach(function(it){
        html += '<button class="rel" data-url="' + esc(it.url) + '">' +
                  '<div class="rt">' + esc(it.title) + '</div>' +
                  '<div class="rm">' + esc(it.source_display || "") + ' · ' + esc(fmtTime(it.published_at)) + '</div>' +
                '</button>';
      });
      html += '</div>';
    }

    if(s.keywords && s.keywords.length){
      html += '<div class="kws">关键词：' + esc(s.keywords.join("、")) + '</div>';
    }

    html += '</div>';
    $("detail").innerHTML = html;
    $("detail").scrollTop = 0;
    wireVideo();
  }

  // 视频挂了要给退路：有些浏览器/网络环境下 mp4 播不了，
  // 这时至少留一个「在新窗口打开」的出口，而不是一块黑屏
  function wireVideo(){
    var v = document.querySelector("#detail .vwrap video");
    if(!v) return;
    var show = function(){
      var f = document.querySelector("#detail .vfallback");
      if(f) f.hidden = false;
    };
    v.addEventListener("error", show);
    if(v.error) show();
  }

  // 上一篇 / 下一篇：在当前列表里挪一格（键盘 ↑↓ 走的是同一套逻辑）
  function pagerHtml(){
    var list = currentStories();
    var idx = -1;
    for(var i=0;i<list.length;i++) if(list[i].id === state.storyId){ idx = i; break; }
    if(idx < 0 || list.length < 2) return "";

    var prev = idx > 0 ? list[idx-1] : null;
    var next = idx < list.length-1 ? list[idx+1] : null;

    return '<div class="pager">' +
      '<button class="pg" data-pg="-1"' + (prev ? ' title="' + esc(prev.title) + '"' : ' disabled') + '>' +
        (prev ? '‹ ' + esc(prev.title) : '‹ 上一篇') + '</button>' +
      '<span class="pgn">' + (idx+1) + ' / ' + list.length + '</span>' +
      '<button class="pg" data-pg="1"' + (next ? ' title="' + esc(next.title) + '"' : ' disabled') + '>' +
        (next ? esc(next.title) + ' ›' : '下一篇 ›') + '</button>' +
    '</div>';
  }

  function goSibling(delta){
    var list = currentStories();
    if(!list.length) return;
    var idx = -1;
    for(var i=0;i<list.length;i++) if(list[i].id === state.storyId){ idx = i; break; }
    if(idx < 0) idx = 0;
    idx += delta;
    if(idx < 0 || idx >= list.length) return;
    state.storyId = list[idx].id;
    renderList();
    renderDetail();
    var node = document.querySelector('.row[data-story="' + CSS.escape(state.storyId) + '"]');
    if(node) node.scrollIntoView({ block: "nearest" });
  }

  function render(){
    renderSidebar();
    renderList();
    renderDetail();
  }

  // 热搜详情：点了某一条就展示它的摘要；没选就展示榜单概览
  function renderTrendDetail(){
    var b = currentBoard();
    if(!b){
      $("detail").innerHTML = '<div class="empty"><div class="e1">这个榜暂时没数据</div></div>';
      return;
    }
    var items = b.items || [];
    var stamp = (state.data.trending && state.data.trending.generated_at) || "";

    // ① 选中了具体一条
    if(state.trendItem != null){
      var it = null;
      for(var i=0;i<items.length;i++) if(items[i].rank === state.trendItem){ it = items[i]; break; }
      if(it){
        var platform = (b.display || "").replace("熱搜", "").replace("热门", "");
        // 分组时序号是组内序号，和左边列表保持一致
        var no = it.rank;
        if(b.grouped && b.groups){
          b.groups.forEach(function(g){
            (g.items || []).forEach(function(x, i){ if(x.rank === it.rank) no = i + 1; });
          });
        }
        var by = ['第 ' + no + ' 位'];
        if(it.heat) by.push(fmtCount(it.heat) + ' 热度');
        if(it.category) by.push(esc(it.category));

        var html = '<div class="detail-inner">' + backBtnHtml();
        html += '<div class="kicker">' + esc(it.group || platform) + '</div>';
        html += '<h1>' + esc(it.title) + '</h1>';
        html += '<div class="byline">' + by.join('<span class="sep"></span>') + '</div>';
        html += it.summary
          ? '<div class="lead">' + esc(it.summary) + '</div>'
          : '<div class="hint">这一条还没取到摘要，点下面「去' + esc(platform) + '看」看原始内容。</div>';
        html += '<div class="actions">' +
                  '<button class="btn primary" data-trend-url="' + esc(it.url) + '">去' + esc(platform) + '看</button>' +
                  '<button class="btn ghost" data-copy-kw="' + esc(it.title) + '">复制关键词</button>' +
                '</div>';
        html += '<div class="kws">摘要来自搜索引擎的公开结果，不是平台正文，' +
                '也不含任何登录态内容。想看完整讨论、评论数，再点上面的按钮。</div>';
        html += '</div>';
        $("detail").innerHTML = html;
        $("detail").scrollTop = 0;
        return;
      }
    }

    // ② 榜单概览
    var h = '<div class="detail-inner">';
    h += '<div class="kicker">熱搜</div>';
    h += '<h1>' + esc(b.display) + '</h1>';
    h += '<div class="byline">' + items.length + ' 条' +
         '<span class="sep"></span>' + esc("抓取于 " + fmtStamp(stamp)) + '</div>';
    h += '<div class="lead">这是「大家正在搜什么」的参考，不是新闻本身。' +
         '点左边任意一条，右边会显示这一条的一句话摘要。</div>';

    if(b.grouped && b.groups && b.groups.length){
      h += '<div class="related"><div class="rh">分类分布</div>';
      b.groups.forEach(function(g){
        h += '<button class="rel" data-trend-group="' + esc(g.group) + '">' +
               '<div class="rt">' + esc(g.group) + '</div>' +
               '<div class="rm">' + g.count + ' 条</div>' +
             '</button>';
      });
      h += '</div>';
    } else if(items.length){

      items.slice(0, 3).forEach(function(it){

               (it.summary ? '<div class="rm">' + esc(it.summary) + '</div>' : '') +
             '</button>';

    h += '<div class="kws">热搜按平台自己的算法排序，含推广与娱乐内容，' +
         '不代表新闻价值。分类是平台自带的标签，这里按时政 / 民生 / 娱乐 / 体育 / 财经科技 归并。</div>';
    h += '</div>';

  // ---------------------------------------------------------------
  // 电台模块
  // ---------------------------------------------------------------
  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6l11-6.8z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';
  var ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="8" rx="1.4"/></svg>';

  var hlsPromise = null;

  // 只有 Safari（含 iOS 上的所有浏览器内核）真正能原生解 HLS。
  // Chromium 系对 application/vnd.apple.mpegurl 会返回 "maybe"，
  // 真塞进 <audio> 却报「no supported source」——不能只信 canPlayType。
  function isSafari(){
    var ua = navigator.userAgent;
    return /safari/i.test(ua) && !/chrome|chromium|crios|fxios|edg|android/i.test(ua);
  }

  function canPlayHls(){
    return isSafari();
  }

  // hls.js 按需加载：主备三个 CDN，全挂了才报错
  function loadHls(){
    if(window.Hls) return Promise.resolve(window.Hls);
    if(hlsPromise) return hlsPromise;
    var urls = [
      "https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js",
      "https://cdn.bootcdn.net/ajax/libs/hls.js/1.5.17/hls.min.js",
      "https://unpkg.com/hls.js@1.5.17/dist/hls.min.js"
    ];
    hlsPromise = new Promise(function(resolve, reject){
      var i = 0;
      (function next(){
        if(i >= urls.length){ reject(new Error("hls.js 加载失败")); return; }
        var s = document.createElement("script");
        s.src = urls[i++];
        s.onload = function(){ window.Hls ? resolve(window.Hls) : next(); };
        s.onerror = next;
        document.head.appendChild(s);
      })();
    });
    return hlsPromise;
  }

  function findStation(key){
    var groups = ((state.data && state.data.radio) || {}).groups || [];
    for(var i=0;i<groups.length;i++){
      var ss = groups[i].stations || [];
      for(var j=0;j<ss.length;j++) if(ss[j].key === key) return ss[j];
    }
    return null;
  }

  function setPlayer(name, meta, url, isErr){
    var n = $("pName"), m = $("pMeta"), a = $("pUrl");
    if(n) n.textContent = name || "未选择频率";
    if(m){
      m.textContent = meta || "选一个频率开始收听";
      m.classList.toggle("perr", !!isErr);
    }
    if(a){
      if(url){ a.href = url; a.style.display = "inline-block"; }
      else { a.style.display = "none"; }
    }
  }

  // 页面是 https 时，http 流会被浏览器按「混合内容」直接拦掉，
  // 上一版电台全哑就是栽在这里。这里先修协议再播。
  function streamUrl(st){
    var u = (st && st.url) || "";
    if(location.protocol === "https:" && u.indexOf("http://") === 0){
      u = "https://" + u.slice(7);
    }
    return u;
  }

  function syncPlayerBtn(){
    var btn = $("pPlay");
    var audio = $("player");
    if(!btn || !audio) return;
    btn.innerHTML = state.radio.key ? (audio.paused ? ICON_PLAY : ICON_PAUSE) : ICON_STOP;
    btn.classList.toggle("loading", audio.readyState < 3 && !audio.paused && !!state.radio.key);
  }

  function markStationRow(){
    document.querySelectorAll("[data-station]").forEach(function(el){
      el.classList.toggle("on", el.getAttribute("data-station") === state.radio.key);
    });
  }

  function playStation(key){
    var st = findStation(key);
    var audio = $("player");
    if(!st || !audio) return;
    // 电台和朗读抢同一个音频通道，先停朗读
    if(listen.on) stopListen();

    // 再点同一台 = 暂停 / 继续
    if(state.radio.key === key && audio.dataset.station === key){
      if(audio.paused){ audio.play().catch(function(){}); }
      else { audio.pause(); }
      return;
    }

    state.radio.key = key;
    audio.dataset.station = key;
    var url = streamUrl(st);
    setPlayer(st.name, st.note || st.region, url);

    if(state.radio.hls){ state.radio.hls.destroy(); state.radio.hls = null; }
    audio.pause();
    audio.removeAttribute("src");
    try { audio.load(); } catch(err){}

    var fail = function(msg){
      setPlayer(st.name, msg || "这个频率暂时连不上，换一个试试", url, true);
      audio.pause();
      syncPlayerBtn();
    };

    audio.onerror = function(){
      fail("连不上这个频率（网络或该台限制）。点下面「流地址」可以直接验证。");
    };

    if(st.kind === "hls" && !canPlayHls()){
      setPlayer(st.name, "正在加载播放器…", url);
      loadHls().then(function(Hls){
        if(state.radio.key !== key) return;      // 期间又换了台
        var hls = new Hls({ enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(audio);
        state.radio.hls = hls;
        hls.on(Hls.Events.ERROR, function(_, data){
          if(data && data.fatal){
            fail("这个频率暂时连不上（" + (data.details || "网络错误") + "）");
          }
        });
        audio.play().catch(function(){});
      }).catch(function(){
        // hls.js 的 CDN 全挂了：退回原生播放，Safari 能行，其他浏览器基本不行
        audio.src = url;
        var p2 = audio.play();
        if(p2 && p2.catch){
          p2.catch(function(){
            fail("HLS 播放器加载失败（网络取不到 hls.js），浏览器也不支持原生播放。点「流地址」可直接验证。");
          });
        }
      });
    } else {
      audio.src = url;
      var p = audio.play();
      if(p && p.catch){
        p.catch(function(err){
          fail("播放失败：" + (err && err.message ? err.message : "浏览器拒绝播放"));
        });
      }
    }
    markStationRow();
    syncPlayerBtn();
  }

        '<div id="radioGroups"></div>' +
        '<div class="mnote">音频由各电台官方提供，这里只做播放，不转码、不代理。' +
          '标 <b>HLS</b> 的频率用 m3u8 传输：Safari 原生支持，其他浏览器会自动加载 hls.js。' +
          '播不了先点播放器里的「流地址」直接验证，再判断是网络问题还是地址失效。</div>';

    var cnt = $("radioCount");

    var html = groups.map(function(g){

        (g.stations || []).map(function(st){
          return '<button class="strow" data-station="' + esc(st.key) + '">' +
                   '<span class="si">' + ICON_PLAY + '</span>' +
                   '<span class="sn"><b>' + esc(st.name) + '</b>' +
                     (st.note ? '<small>' + esc(st.note) + '</small>' : '') +
                   '</span>' +
                   (st.kind === "hls" ? '<span class="kind">HLS</span>' : '') +
                 '</button>';
        }).join("") +
      '</div>';
    }).join("");

    var gbox = $("radioGroups");
    if(gbox) gbox.innerHTML = html;

    // 播放器状态可能在切模块期间变过，这里同步一次
    var cur = state.radio.key ? findStation(state.radio.key) : null;
    if(cur) setPlayer(cur.name, cur.note || cur.region, streamUrl(cur));
    markStationRow();
    syncPlayerBtn();
  }

  // ---------------------------------------------------------------
  // 听新闻（系统语音朗读）
  //
  // TVB 的纯音频 HLS 其实拿得到（无视频轨，128k AAC），但分片是 AES-128，
  // 密钥服务器只放行 tvb 域名跨域读，网页里解不开。所以「不看画面只听新闻」
  // 走另一条路：把已经收进库里的标题 + 一句话摘要用系统语音念出来，
  // 一条读完自动下一条，像电台一样连着听。纯前端，不联网、不花钱。
  // ---------------------------------------------------------------
  var TTS_LANG_KEY = "ng_tts_lang";
  var TTS_BODY_KEY = "ng_tts_body";
  var TTS_RATE_KEY = "ng_tts_rate";

  var listen = {
    on: false,
    idx: 0,          // 当前条目在 currentStories() 里的位置
    segs: [],        // 当前条目切好的句子
    seg: 0,
    rate: 1,
    lang: "zh-HK",
    withBody: false,
    paused: false,
    token: 0,        // 每次换条 +1，用来丢弃上一条的 onend
    internal: false
  };

  try {
    var _l = localStorage.getItem(TTS_LANG_KEY);
    if(_l) listen.lang = _l;
    listen.withBody = localStorage.getItem(TTS_BODY_KEY) === "1";
    var _r = parseFloat(localStorage.getItem(TTS_RATE_KEY));
    if(_r > 0.5 && _r < 2) listen.rate = _r;
  } catch(err){}

  function ttsOk(){
    return typeof window.speechSynthesis !== "undefined" &&
           typeof window.SpeechSynthesisUtterance !== "undefined";
  }

  // 优先用指定语言的音色（zh-HK 粤语 / zh-CN 普通话），没有就退到任意中文
  function ttsVoice(){
    if(!ttsOk()) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    var want = String(listen.lang).replace("_", "-").toLowerCase();
    var i, l;
    for(i = 0; i < vs.length; i++){
      l = String(vs[i].lang || "").replace("_", "-").toLowerCase();
      if(l.indexOf(want) === 0) return vs[i];
    }
    for(i = 0; i < vs.length; i++){
      if(/^zh/i.test(vs[i].lang || "")) return vs[i];
    }
    return null;
  }

  // Chrome 对单条长文本会在 ~15 秒处截断，所以按标点切成短句逐条念
  function segmentsOf(text){
    var t = String(text || "").replace(/\s+/g, " ").trim();
    var out = [], buf = "";
    for(var i = 0; i < t.length; i++){
      var ch = t.charAt(i);
      buf += ch;
      if("。！？；!?;\n".indexOf(ch) >= 0 || buf.length >= 60){
        if(buf.trim()) out.push(buf.trim());
        buf = "";
      }
    }
    if(buf.trim()) out.push(buf.trim());
    return out;
  }

  function storySpeech(s){
    var parts = [];
    // 「｜」在朗读里没有语义，换成停顿
    parts.push(String(s.title || "").replace(/[｜|]/g, "，") + "。");
    // summary_short 是完整的首句；digest 结尾带「…」，念出来会断在半句上
    var lead = s.summary_short || s.digest || s.summary || "";
    if(lead) parts.push(String(lead).replace(/…+$/, "。"));
    if(listen.withBody && s.body){
      parts.push(s.body.split(/\n+/).join(" "));
    }
    return parts.join(" ");
  }

  function storyIndex(id){
    var list = currentStories();
    for(var i = 0; i < list.length; i++) if(list[i].id === id) return i;
    return -1;
  }

  function updateListenBar(){
    var bar = $("listenBar");
    if(!bar) return;
    bar.classList.toggle("on", listen.on);
    if(!listen.on) return;
    var list = currentStories();
    // 自动刷新后条目数会变，别让下标越界
    if(list.length && listen.idx >= list.length) listen.idx = list.length - 1;
    var s = list[listen.idx];
    $("lbKicker").textContent = "收听 " + (listen.idx + 1) + " / " + list.length +
      (listen.paused ? " · 已暂停" : "");
    $("lbTitle").textContent = s ? s.title : "";
    $("lbToggle").innerHTML = listen.paused
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6l11-6.8z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';
  }

  function speakSeg(i){
    if(!listen.on || listen.paused) return;
    if(i >= listen.segs.length){ listenStep(1); return; }

    listen.seg = i;
    var u = new SpeechSynthesisUtterance(listen.segs[i]);
    var v = ttsVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = listen.lang; }
    u.rate = listen.rate;
    u.pitch = 1;

    var my = listen.token;
    u.onend = function(){
      // 被 cancel / 换条 / 暂停时，token 会变，这里的续播要作废
      if(!listen.on || listen.paused || my !== listen.token) return;
      speakSeg(i + 1);
    };
    u.onerror = function(){ /* 打断、网络音色失败都走这里，忽略 */ };
    window.speechSynthesis.speak(u);
  }

  function readCurrentStory(){
    if(!listen.on) return;
    var list = currentStories();
    var s = list[listen.idx];
    if(!s){ stopListen(); return; }

    listen.token++;
    window.speechSynthesis.cancel();
    listen.segs = segmentsOf(storySpeech(s));
    listen.seg = 0;
    listen.paused = false;

    // 让列表和详情跟着朗读走，知道现在念到哪条
    listen.internal = true;
    state.storyId = s.id;
    renderList();
    renderDetail();
    listen.internal = false;
    var node = document.querySelector('.row[data-story="' + CSS.escape(s.id) + '"]');
    if(node) node.scrollIntoView({ block: "nearest" });

    updateListenBar();
    // cancel 之后立刻 speak 在 Chrome 里偶尔会被吞掉，隔一拍更稳
    setTimeout(function(){ if(listen.on) speakSeg(0); }, 60);
  }

  function listenStep(delta){
    if(!listen.on) return;
    var list = currentStories();
    if(!list.length){ stopListen(); return; }
    // 念到末尾就绕回第一条，像电台一样一直连着放，不想听了按 ✕
    var next = listen.idx + delta;
    if(next < 0) next = list.length - 1;
    if(next >= list.length) next = 0;
    listen.idx = next;
    readCurrentStory();
  }

  function startListen(fromIndex){
    if(!ttsOk()){
      alert("这台设备的浏览器没有语音朗读能力（Web Speech），换个浏览器或系统再试。");
      return;
    }
    // 热搜视图里 currentStories() 是空的，先退回今日要闻，否则点了没反应
    if(state.trend) selectSection(null);
    if(state.mod !== "news") switchModule("news");
    var list = currentStories();
    if(!list.length) return;
    // 朗读和电台抢音频输出，先停电台
    var audio = $("player");
    if(audio && !audio.paused) audio.pause();

    if(state.mod !== "news") switchModule("news");
    listen.on = true;
    listen.paused = false;
    listen.idx = typeof fromIndex === "number" && fromIndex >= 0
      ? Math.min(fromIndex, list.length - 1)
      : Math.max(0, storyIndex(state.storyId));
    readCurrentStory();
  }

  function stopListen(){
    listen.on = false;
    listen.token++;
    listen.paused = false;
    if(ttsOk()) window.speechSynthesis.cancel();
    updateListenBar();
  }

  // 打断当前这句，用新的音色 / 语速把同一句重念一遍
  function respeakCurrent(){
    if(!listen.on) return;
    listen.token++;
    window.speechSynthesis.cancel();
    setTimeout(function(){ if(listen.on && !listen.paused) speakSeg(listen.seg); }, 60);
  }

  function toggleListenPause(){
    if(!listen.on) return;
    if(listen.paused){
      listen.paused = false;
      window.speechSynthesis.resume();
      // resume 在部分 Chrome 版本上无效，兜底：重念当前句
      setTimeout(function(){
        if(listen.on && !listen.paused && !window.speechSynthesis.speaking){
          listen.token++;
          speakSeg(listen.seg);
        }
      }, 260);
    } else {
      listen.paused = true;
      window.speechSynthesis.pause();
    }
    updateListenBar();
  }

  // 进页面先摸一次音色表：Chrome 首次返回空，要等 voiceschanged
  if(ttsOk()){
    window.speechSynthesis.getVoices();
    if(window.speechSynthesis.addEventListener){
      window.speechSynthesis.addEventListener("voiceschanged", function(){ ttsVoice(); });
    }
  }


  // ---------------------------------------------------------------
  // 设置模块
  // ---------------------------------------------------------------
  var THEMES = [["light","正常"],["dark","黑暗"],["sepia","护眼"],["glass","磨砂"]];

  function renderSettings(){
    var box = $("settingsBody");
    if(!box) return;
    var d = state.data || {};
    var st = d.stats || {};
    var boards = (d.trending && d.trending.boards) || [];
    var rd = d.radio || {};
    var live = d.live || [];
    var srcs = d.sources || [];

    // 摘要版（--excerpt）只带标题和摘要，没有 body；「全文」这个选项要跟着变
    var allStories = (d.headlines || []).slice();
    (d.sections || []).forEach(function(sec){ allStories = allStories.concat(sec.items || []); });
    var hasBody = allStories.some(function(s){ return !!s.body; });

    var html = '<div class="mhead"><h2>设置</h2></div>';

    html += '<div class="setrow"><div class="sl"><b>字号</b>' +
            '<small>先选一个基准档位，字号还会跟着窗口宽度自动微调——窗口拉大，字就大一点。' +
            '选择记在这台机器上。</small></div>' +
            '<div class="seg">' + FONT_STEPS.map(function(f){
              return '<button data-set-font="' + f[0] + '"' +
                     (fontStep === f[0] ? ' class="on"' : '') + '>' + f[1] + '</button>';
            }).join("") + '</div></div>';

    html += '<div class="setrow"><div class="sl"><b>主题</b>' +
            '<small>四套配色，跟着你的环境光走。选择会记在这台机器上。</small></div>' +
            '<div class="seg">' + THEMES.map(function(t){
              return '<button data-set-theme="' + t[0] + '"' +
                     (state.theme === t[0] ? ' class="on"' : '') + '>' + t[1] + '</button>';
            }).join("") + '</div></div>';

    html += '<div class="setrow"><div class="sl"><b>听新闻</b>' +
            '<small>用系统自带的语音念新闻，不看画面也能听，一条念完自动下一条。' +
            'iPhone / Mac 有粤语音色，安卓多半只有普通话，选不到会自动退回中文音色。</small></div>' +
            '<div class="seg">' +
              [["zh-HK","粤语"],["zh-CN","普通话"]].map(function(l){
                return '<button data-set-tts-lang="' + l[0] + '"' +
                       (listen.lang === l[0] ? ' class="on"' : '') + '>' + l[1] + '</button>';
              }).join("") +
            '</div></div>';

    html += '<div class="setrow"><div class="sl"><b>朗读内容</b>' +
            '<small>' + (hasBody
              ? '只念标题和一句话摘要（快），或连正文一起念（慢，但更完整）。'
              : '分享版只带标题和一句话摘要，没有正文；想听全文用本地版。') +
            '</small></div>' +
            '<div class="seg">' +
              (hasBody
                ? [[0,"摘要"],[1,"全文"]].map(function(b){
                    return '<button data-set-tts-body="' + b[0] + '"' +
                           (listen.withBody === !!b[0] ? ' class="on"' : '') + '>' + b[1] + '</button>';
                  }).join("")
                : '<span style="font-size:calc(11px * var(--fs));color:var(--t3)">仅摘要</span>') +
            '</div></div>';

    html += '<div class="setrow"><div class="sl"><b>朗读语速</b>' +
            '<small>新闻播报一般偏快，听不清就调慢一档。</small></div>' +
            '<div class="seg">' +
              [[0.85,"慢"],[1,"正常"],[1.15,"快"]].map(function(r){
                return '<button data-set-tts-rate="' + r[0] + '"' +
                       (Math.abs(listen.rate - r[0]) < 0.01 ? ' class="on"' : '') + '>' + r[1] + '</button>';
              }).join("") +
            '</div></div>';

    html += '<div class="setrow"><div class="sl"><b>更新方式</b>' +
            '<small>每次打开页面都会重新拉一次最新数据（绕过缓存），之后每 60 秒自动检查，' +
            '切回这个标签页也会立刻补一次。数据由云端每天 4 次抓取后自动发布。</small></div>' +
            '<div class="seg"><button class="btn ghost" style="padding:8px 14px" data-refresh-now="1">立即刷新</button></div></div>';

    // 数据新鲜度：没有定时任务时，这里会一直显示「过期」
    var gen = d.generated_at || "";
    var ageH = gen ? (Date.now() - Date.parse(gen)) / 3600000 : -1;
    var fresh = ageH >= 0 && ageH <= STALE_HOURS;
    var ageText = ageH < 0 ? "没有时间戳"
      : ageH < 1 ? "不到 1 小时前"
      : ageH < 48 ? Math.round(ageH) + " 小时前"
      : Math.round(ageH / 24) + " 天前";
    html += '<div class="setrow"><div class="sl"><b>数据新鲜度</b>' +
            '<small>' + (gen ? esc(fmtStamp(gen)) + " 抓的，" + ageText : ageText) +
            (fresh ? "。" : "。已经过期了，跑一次 ./refresh.sh，或装个定时任务。") +
            '</small></div>' +
            '<div class="seg"><span style="font-size:calc(11px * var(--fs));color:' +
            (fresh ? "var(--t3)" : "var(--live)") + '">' +
            (fresh ? "新鲜" : "过期") + '</span></div></div>';

    html += '<div class="setrow"><div class="sl"><b>内容量</b>' +
            '<small>' + (st.articles || 0) + ' 篇报道 → ' + (st.clusters || 0) + ' 个事件' +
            '；热搜 ' + boards.reduce(function(a,b){ return a + (b.count||0); }, 0) + ' 条' +
            '；电台 ' + (rd.total || 0) + ' 个频率</small></div></div>';

    if(srcs.length){
      html += '<div class="setrow"><div class="sl"><b>新闻来源</b>' +
              '<small>' + esc(srcs.map(function(s){ return s.display || s.name; }).join(" · ")) +
              '</small></div></div>';
    }
    if(boards.length){
      html += '<div class="setrow"><div class="sl"><b>热搜来源</b>' +
              '<small>' + esc(boards.map(function(b){ return b.display; }).join(" · ")) +
              '</small></div></div>';
    }
    if(live.length){
      html += '<div class="setrow"><div class="sl"><b>直播频道</b>' +
              '<small>' + esc(live.map(function(c){ return c.name; }).join(" · ")) +
              '</small></div></div>';
    }

    html += '<div class="setrow"><div class="sl"><b>关于</b>' +
            '<small>NewGent · 本地新闻聚合。内容版权归原媒体所有，' +
            '这里只做索引与摘要，阅读全文请点「看原文」。</small></div></div>';

    box.innerHTML = html;
  }

  // ---------------------------------------------------------------
  // 交互
  // ---------------------------------------------------------------
  // 窄屏抽屉：侧栏在 1040px 以下变成抽屉，由左上角汉堡按钮唤出
  function openDrawer(){
    $("sidebar").classList.add("open");
    $("drawerMask").classList.add("on");
  }

  function closeDrawer(){
    $("sidebar").classList.remove("open");
    $("drawerMask").classList.remove("on");
  }

  function selectSection(name){
    state.section = name;
    state.trend = null;
    state.trendItem = null;
    var list = currentStories();
    state.storyId = list.length ? list[0].id : null;
    render();
    closeDrawer();
    // 窄屏下切分区要回到列表，并且滚回顶部
    if(window.innerWidth <= 780){ $("main").classList.remove("split"); }
    var sc = $("listScroll");
    if(sc) sc.scrollTop = 0;
  }

  function selectTrend(key){
    state.trend = key;
    state.trendItem = null;
    state.section = null;
    state.storyId = null;
    render();
    closeDrawer();
    // 窄屏下热搜榜要看榜单本身，不是右侧的概览，所以不进详情
    if(window.innerWidth <= 780){ $("main").classList.remove("split"); }
    var sc = $("listScroll");
    if(sc) sc.scrollTop = 0;
  }

  // 热搜里点一条：右侧显示这一条的摘要
  function selectTrendItem(rank){
    state.trendItem = rank;
    renderList();
    renderDetail();
    if(window.innerWidth <= 780){ $("main").classList.add("split"); }
  }

  function selectStory(id){
    state.storyId = id;
    renderList();
    renderDetail();
    // 窄窗口下切到详情
    if(window.innerWidth <= 780){ $("main").classList.add("split"); }
    // 正在收听时点别的条目：从这一条接着念
    if(listen.on && !listen.internal){
      var i = storyIndex(id);
      if(i >= 0){ listen.idx = i; readCurrentStory(); }
    }
  }

  function openUrl(url){
    if(url) window.open(url, "_blank", "noopener");
  }

  // 侧栏 / 列表 / 详情 事件委托
  document.addEventListener("click", function(e){
    var t = e.target;
    if(!t || typeof t.closest !== "function") return;

    var sec = t.closest("[data-sec]");
    if(sec){ selectSection(sec.getAttribute("data-sec")); return; }

    // 窄屏详情页的「返回列表」
    var back = t.closest("[data-back]");
    if(back){ backToList(); return; }

    var tr = t.closest("[data-trend]");
    if(tr){ selectTrend(tr.getAttribute("data-trend")); return; }

    // 热搜条目：站内看摘要，不跳站
    var trItem = t.closest("[data-trend-item]");
    if(trItem){ selectTrendItem(parseInt(trItem.getAttribute("data-trend-item"), 10)); return; }

    var trUrl = t.closest("[data-trend-url]");
    if(trUrl){ openUrl(trUrl.getAttribute("data-trend-url")); return; }

    var pg = t.closest("[data-pg]");
    if(pg && !pg.disabled){ goSibling(parseInt(pg.getAttribute("data-pg"), 10)); return; }

    var copyKw = t.closest("[data-copy-kw]");
    if(copyKw){
      var kw = copyKw.getAttribute("data-copy-kw") || "";
      if(navigator.clipboard && kw){
        navigator.clipboard.writeText(kw).then(function(){
          copyKw.textContent = "已复制";
          setTimeout(function(){ copyKw.textContent = "复制关键词"; }, 1400);
        }).catch(function(){});
      }
      return;
    }

    var refreshBtn = t.closest("[data-refresh-now]");
    if(refreshBtn){ refreshNow(); return; }

    // 听新闻：详情页按钮 / 直播页入口
    var listenBtn = t.closest("[data-listen]");
    if(listenBtn){
      if(listen.on) toggleListenPause();
      else startListen();
      return;
    }
    var listenAll = t.closest("[data-listen-all]");
    if(listenAll){
      if(listen.on) stopListen();
      else startListen(0);
      return;
    }

    var plain = t.closest("[data-plain]");
    if(plain){ selectSection(null); return; }

    var story = t.closest("[data-story]");
    if(story){ selectStory(story.getAttribute("data-story")); return; }

    var urlBtn = t.closest("[data-url]");
    if(urlBtn){ openUrl(urlBtn.getAttribute("data-url")); return; }

    var liveUrl = t.closest("[data-live-url]");
    if(liveUrl){ openUrl(liveUrl.getAttribute("data-live-url")); return; }

    var liveBtn = t.closest("[data-live-open]");
    if(liveBtn){ switchModule("live"); return; }

    var live = t.closest("[data-live]");
    if(live && state.data && state.data.live){
      var ch = state.data.live[parseInt(live.getAttribute("data-live"), 10)];
      if(ch) openUrl(ch.url);
      return;
    }

    var station = t.closest("[data-station]");
    if(station){ playStation(station.getAttribute("data-station")); return; }

    var pickTheme = t.closest("[data-set-theme]");
    if(pickTheme){ setTheme(pickTheme.getAttribute("data-set-theme")); renderSettings(); return; }

    var pickFont = t.closest("[data-set-font]");
    if(pickFont){ setFont(pickFont.getAttribute("data-set-font")); renderSettings(); return; }

    var pickLang = t.closest("[data-set-tts-lang]");
    if(pickLang){
      listen.lang = pickLang.getAttribute("data-set-tts-lang");
      try { localStorage.setItem(TTS_LANG_KEY, listen.lang); } catch(err){}
      if(listen.on) readCurrentStory();
      renderSettings();
      return;
    }

    var pickBody = t.closest("[data-set-tts-body]");
    if(pickBody){
      listen.withBody = pickBody.getAttribute("data-set-tts-body") === "1";
      try { localStorage.setItem(TTS_BODY_KEY, listen.withBody ? "1" : "0"); } catch(err){}
      if(listen.on) readCurrentStory();
      renderSettings();
      return;
    }

    var pickRate = t.closest("[data-set-tts-rate]");
    if(pickRate){
      listen.rate = parseFloat(pickRate.getAttribute("data-set-tts-rate")) || 1;
      try { localStorage.setItem(TTS_RATE_KEY, String(listen.rate)); } catch(err){}
      // 只改速度不用从这一条开头重念，接着当前这句往下走
      if(listen.on){ listen.paused = false; respeakCurrent(); }
      renderSettings();
      return;
    }
  });

  // 底部四大模块
  document.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){ switchModule(b.getAttribute("data-mod")); });
  });

  // 播放器状态：按钮图标、加载态跟着 audio 走
  ["play", "pause", "playing", "waiting", "emptied", "error"].forEach(function(ev){
    $("player").addEventListener(ev, function(){ syncPlayerBtn(); });
  });

  // 听新闻：控制条
  $("lbToggle").addEventListener("click", toggleListenPause);
  $("lbPrev").addEventListener("click", function(){ listenStep(-1); });
  $("lbNext").addEventListener("click", function(){ listenStep(1); });
  $("lbClose").addEventListener("click", stopListen);

  // 侧栏开关：窄屏唤出抽屉，宽屏收起/展开侧栏
  var NAV_KEY = "ng_nav_hidden";
  function applyNav(hidden){
    var app = document.querySelector(".app");
    if(app) app.classList.toggle("nav-collapsed", !!hidden);
  }
  $("menuBtn").addEventListener("click", function(e){
    e.stopPropagation();
    if(window.innerWidth <= 1040){
      openDrawer();
      return;
    }
    var app = document.querySelector(".app");
    var hidden = app.classList.toggle("nav-collapsed");
    try { localStorage.setItem(NAV_KEY, hidden ? "1" : "0"); } catch(err){}
  });
  // 恢复上次的收起状态（宽屏才有意义）
  try {
    if(localStorage.getItem(NAV_KEY) === "1") applyNav(true);
  } catch(err){}
  $("drawerMask").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeDrawer();
  });

  // 主题选择器
  $("themeBtn").addEventListener("click", function(e){
    e.stopPropagation();    $("picker").classList.toggle("on");
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest("#picker") && !e.target.closest("#themeBtn")) $("picker").classList.remove("on");
  });
  document.querySelectorAll("[data-pick]").forEach(function(el){
    el.addEventListener("click", function(){
      setTheme(el.getAttribute("data-pick"));
      $("picker").classList.remove("on");
    });
  });

  // 载入数据
  $("loadBtn").addEventListener("click", function(){ $("fileInput").click(); });
  $("fileInput").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try { acceptData(JSON.parse(r.result), f.name); }
      catch(err){ alert("JSON 解析失败：" + err.message); }
    };
    r.readAsText(f, "utf-8");
  });

  // 拖放
  var dragDepth = 0;
  window.addEventListener("dragenter", function(e){
    e.preventDefault(); dragDepth++; $("dropveil").classList.add("on");
  });
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("dragleave", function(e){
    dragDepth--; if(dragDepth <= 0){ dragDepth = 0; $("dropveil").classList.remove("on"); }
  });
  window.addEventListener("drop", function(e){
    e.preventDefault(); dragDepth = 0; $("dropveil").classList.remove("on");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try { acceptData(JSON.parse(r.result), f.name); }
      catch(err){ alert("JSON 解析失败：" + err.message); }
    };
    r.readAsText(f, "utf-8");
  });

  // 键盘：↑↓ 切换事件，Esc 收起浮层，← 返回列表
  document.addEventListener("keydown", function(e){
    if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

    if(e.key === "Escape"){
      $("picker").classList.remove("on");
      var lm = document.getElementById("liveMenu"); if(lm) lm.remove();
      $("main").classList.remove("split");
      return;
    }
    if(e.key === "ArrowLeft"){
      if($("main").classList.contains("split")){ $("main").classList.remove("split"); e.preventDefault(); }
      return;
    }
    if(e.key !== "ArrowDown" && e.key !== "ArrowUp") return;

    var list = currentStories();
    if(!list.length) return;
    e.preventDefault();
    var idx = -1;
    for(var i=0;i<list.length;i++) if(list[i].id === state.storyId){ idx = i; break; }
    idx += (e.key === "ArrowDown" ? 1 : -1);
    if(idx < 0) idx = 0;
    if(idx >= list.length) idx = list.length - 1;
    state.storyId = list[idx].id;
    renderList();
    renderDetail();

    var node = document.querySelector('.row[data-story="' + CSS.escape(state.storyId) + '"]');
    if(node) node.scrollIntoView({ block: "nearest" });
  });

  // 启动
  boot();
})();
</script>
</body>
</html>
