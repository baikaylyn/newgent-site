<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M5 4.5h10a2.5 2.5 0 0 1 2.5 2.5v12.5H5z"/>
        <path d="M8 9h6M8 12.5h6M8 16h4"/>
      </svg>
      <span>新闻</span>
    </button>
    <button class="tab" data-mod="live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.6"/>
        <path d="M7.6 7.6a6.2 6.2 0 0 0 0 8.8M16.4 7.6a6.2 6.2 0 0 1 0 8.8"/>
        <path d="M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"/>
      </svg>
      <span>直播</span>
    </button>
    <button class="tab" data-mod="radio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="8.5" width="18" height="11.5" rx="2.2"/>
        <path d="M16.4 4.2 7.6 8.5"/>
        <circle cx="8.2" cy="14.2" r="2"/>
        <path d="M14 12.6h4M14 16h4"/>
      </svg>
      <span>电台</span>
    </button>
    <button class="tab" data-mod="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.9"/>
        <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.8 5.8l1.5 1.5M16.7 16.7l1.5 1.5M18.2 5.8l-1.5 1.5M7.3 16.7l-1.5 1.5"/>
      </svg>
      <span>设置</span>
    </button>

      "body": "國務院總理李強訪問聖彼得堡會晤俄羅斯總統普京，他稱中俄關係是當前世界的穩定力量，中方願與俄方在能源、經貿及交通等領域加強合作。普京就稱，兩國關係不受第三方干擾，下月有機會在深圳會晤國家主席習近平。\n\n國務院總理李強周三在聖彼得堡，與俄羅斯總統普京舉行會談。普京稱，俄中關係建立在平等尊重、互利共贏的基礎上，不受第三方干擾。李強就稱，中俄兩國是當前世界的穩定力量。\n\n國務院總理李強指出︰「當前國際形勢持續複雜演變，單邊主義、霸權主義大行其道，就這樣的一個背景下，中國和俄羅斯保持著緊密協作，是變亂交織的世界中難能可貴的穩定力量。」\n\n俄羅斯總統普京說︰「我們關係不受國際形勢所影響，不受第三方干擾，兩國經貿關係不斷發展，我們會在各關鍵領域擴大合作。」\n\n李強表示，中方願同俄方加強戰略溝通，拓展全方位互利合作，密切在上合組織、金磚國家等多邊平台的配合，團結更多全球南方力量，捍衛共同利益，維護公平正義。李強又稱，中方願同俄方更好發揮經濟互補優勢，加強能源資源、經貿投資、交通運輸等務實合作，取得更多積極成果，促進兩國共同繁榮。\n\n新華社報道，普京指，中國是俄羅斯最可靠的夥伴，俄方願同中方深化能源、農業、太空，民用核能、人工智能等領域合作。俄方亦支持中方下月在深圳主辦亞太經合組織(APEC)領導人非正式會議，並且共同辦好「俄中教育年」，擴大人文交流。\n\n國家主席習近平與普京，在今年共會晤3次，包括2月視像對話，5月普京國事訪問中國，以及中俄元首8月在吉爾吉斯，出席上合組織會議期間會談。普京向李強表明，他下月有機會在深圳再次會晤習近平。\n\n李強較早前跟俄羅斯總理米舒斯京，共同主持中俄總理會晤，並發表聯合公報，俄方重申恪守一個中國原則，堅定支持中國政府，維護國家主權和領土完整，反對任何形式「台獨」。中俄兩國支持企業，深化石油、天然氣，煤炭及電力等領域合作。\n\n雙方又商定在上海合作組織、金磚國家等框架內加強協調立場，反對單邊霸凌和保護主義。",

      "body": "本屆APEC會議是深圳建市近半世紀以來最矚目的外交盛事，亞太多個經濟體領導人昨抵埗後，隨即到深圳市內各處「打卡」，其中澳洲總理阿爾巴尼斯現身羅湖的萬象城超市，考察澳洲龍蝦在華銷情。智利總統卡斯特則現身深圳街頭水果店。俄羅斯總統普京昨日為大會致辭時，點讚深圳具備「舒適的城市環境和創新的生產基地」，是「最現代化、最具活力的大都市之一」。\n澳總理逛超市試吃家鄉和牛\n據了解，許多參加APEC的政商界都是首次踏足這個中國南方城市。據羅湖官方公眾號報道，昨午不少深圳市民稱，在羅湖深圳萬象城Ole超市偶遇澳洲總理阿爾巴尼斯。適逢「澳洲生活季」活動在此舉行，代表團一行現場了解澳洲原產和牛、南澳岩龍蝦、紅酒、水果等農副生鮮食品的情況。「總理（阿爾巴尼斯）本人逛了好一會兒，還在現場試吃了一小份澳洲和牛，並讚揚其『非常美味』！」市民說。\n相關新聞：深圳APEC｜歡迎晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n中澳關係曾在疫情期間關係惡劣，中方限制澳洲龍蝦、紅酒等進口中國。直至2022年阿爾巴尼斯工黨政府上台後，關係逐步緩和，禁令也隨之解除。\n阿爾巴尼斯昨在個人社交媒體寫道：「讓澳洲產品走出國門、擺上海外貨架，能為國內創造就業機會。中國是我們最大的客戶。自我們當選以來，我們已恢復了價值超過200億澳元的對華貿易。但在擴大貿易方面，我們仍有進一步提升的空間。」\n相關新聞：深圳APEC｜「限韓令」影視、觀光等規定鬆綁 韓中FTA服務投資談判達協議\n智利總統首來華現身水果店\n智利總統卡斯特昨晨抵達深圳，是今年3月就任以來首次來華。昨早他攜夫人現身水果連鎖店「百果園」的全國首店—深圳福華店。一台中國機械人為這位遠道而來的客人送上一箱車厘子。中國目前是智利車厘子最大的出口目的地，每年進口量約佔智利車厘子出口總量的9成。\n俄羅斯總統普京昨在APEC工商領導人峰會上說，此次APEC舉辦地深圳給人留了下深刻印象，「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」",

      "summary": "AM730社評：世界廁所日，香港廁所協會公布今年最佳公廁選舉結果，獲獎前列公廁，多在人流和旅客較少的公園之內，惟整體香港核心商業旅遊區，例如油尖旺和銅鑼灣等地公廁，其實數量不足…",
      "summary_short": "AM730社評：世界廁所日，香港廁所協會公布今年最佳公廁選舉結果，獲獎前列公廁，多在人流和旅客較少的公園之內…",

      "points": [

        "雖然美國仍堅持平壤當局必須放棄核武，然而朝鮮擁核已成客觀現實，逆轉可能性愈來愈低"

      "body": "中共中央總書記、國家主席習近平應邀訪問平壤，與朝鮮領導人金正恩會晤。世界百年變局加速演進，東北亞形勢近年出現重大變化，中日關係急轉直下，朝俄關係則顯著加強，韓國外交方針則受國內政治撕裂影響而搖擺不定。雖然美國仍堅持平壤當局必須放棄核武，然而朝鮮擁核已成客觀現實，逆轉可能性愈來愈低。受核問題影響，中朝關係經歷了一段相對疏遠的時期，直至去年開始回暖。今次是習近平事隔7年再訪朝鮮，「習金會」釋出的信息是兩國傳統友誼特殊關係牢不可破，並會因應新時期注入新內涵；兩國將堅定捍衛各自主權與安全，共同維護地區和平，則明顯帶有警惕日本再軍事化之意。\n\n中國國際地位與影響力持續提升，美俄等多國元首近期密集訪華。相比之下，習近平近年親自出訪頻率其實有所減少。這次應邀出訪朝鮮，乃是他今年首度外訪，亦是中朝領導人繼去年9月北京抗戰勝利80周年閱兵後再度會晤。習近平在朝鮮《勞動新聞》發表署名文章，將此行定調為「共話中朝傳統友誼，共商中朝關係發展大計」，形容中朝關係「站在新的歷史起點，面臨新的發展機遇，肩負新的時代使命」，中方願同朝方一道，「從戰略高度」把握中朝關係，推動中朝關係「與時俱進、得到更大發展」。\n\n中朝關係的特殊性，在於它不是一般的戰略伙伴合作關係，還有着深厚的「傳統情誼」。中國外交強調「結伴不結盟」，唯一例外可能就是朝鮮。由早期聯手抗日到後來「抗美援朝」戰爭，兩國形成了「血盟」關係。簡言之，維繫中朝關係的不止是戰略共同利益，還有習近平所說的「深厚歷史積澱」及「牢固情感紐帶」。《中朝友好合作互助條約》是新中國成立至今，唯一一份含有明確「共同防衛」條款的雙邊條約。條約還列明，除非中朝雙方就修改或終止條約達成協議，否則條約將一直有效。\n\n過去10多年，中朝關係因朝鮮核問題而有所褪色。中國希望朝鮮半島無核化，既是為了自身安全，亦擔心引發東北亞軍備競賽，但平壤堅持發展核武，中朝一度漸行漸遠，直至金正恩去年訪華後，雙方關係才回暖，兩國之間的國際旅客列車及航空也於早前復通。2022年俄烏戰爭爆發，則為俄朝關係升溫帶來契機，朝鮮以提供軍事支援，換取俄國在能源、糧食等經濟領域上的支持。兩國前年還簽訂了《俄朝全面戰略伙伴關係條約》。\n\n朝鮮過去長時間遭國際社會孤立，經濟發展舉步維艱，因而形成了高度依賴中國的格局，現在有了俄羅斯作為戰略伙伴，對朝鮮而言是走出孤立狀態的重要一步。西方習慣從拉幫結派的排他視角看世界，要麼認為朝鮮選擇「親俄疏華」，要麼認為中俄朝結成一伙對抗美日韓，然而中國從來無意追求東北亞建立霸權；俄朝關係變得緊密，也不代表中朝關係不能加強。西方以己度人，才會有北京將朝鮮當成「附庸」一類想像。事實上，中國支持朝鮮，除了歷史情誼，也因為朝鮮是中國鄰邦，當地維持穩定對中國國家安全非常重要。當朝鮮擁有核武已變既成現實，平壤當局甚至將擁核寫入憲法，看不到走回頭路的可能，繼續在這問題上糾纏，實際也沒有太大意思，倒不如向前看。「中朝關係站在新的歷史起點」，需要放在這一框架下理解。\n\n觀乎新華社的報道內容，今次「習金會」有幾點值得留意。首先是兩人皆重申兩國關係的特殊性，在於具有深厚傳統友誼和共同信念，雙方均樂見這份深厚情誼代代傳承。金正恩強調會「一如既往」將發展朝中關係作為國家「最重大的第一戰略事業」。有關說法有力地反駁了「親俄疏華」論，同時也折射了一個客觀現實，即朝鮮若要發展經濟，不能沒有中國。習近平則強調，「無論國際形勢如何變化」，中方堅定「三不變」，包括高度重視中朝傳統友好、支持由金正恩領導的朝鮮社會主義事業，以及維護中朝共同利益及良好戰略環境不變。有關說法，可說是北京對朝鮮的強而有力承諾及保證。\n\n其次是通稿隻字未提「核」議題。上月「習特會」後，美方曾聲稱，中美元首峰會確認「朝鮮半島無核化」的信息，金正恩胞妹金與正日前開腔反駁，批評美方拒絕面對現實，還散播虛假信息，又強調「平壤有最準確信息」。朝鮮仍因為發展核武，遭聯合國制裁。中方強調維護聯合國權威，不會無視制裁決議，公開承認朝鮮是擁核國的機會也微乎其微，但北京外交向來務實，朝鮮半島無核化現階段無望實現，不如按下不表。事實上，自2023年夏天起，北京已再無公開提及半島無核化，取而代之的是希望朝鮮半島穩定，這需要朝韓雙方克制，中方能夠與兩國有良好關係，才能在半島發揮穩定器的作用。\n\n第三是對日本再軍事化提高警惕。習近平就發展中朝關係提出4點意見，包括以高層交往強化政治互信、在經貿農業科技等領域務實合作、傳承友誼促進民心相通，以及以公平正義為原則，豐富戰略協作內涵。在《勞動新聞》的署名文章中，習近平更明言反對霸權主義和強權政治，反對一切復活軍國主義、危害地區安全穩定的圖謀和行徑。去年日相高市早苗上台後，高舉擴軍旗幟，又發表「台灣有事論」。習近平提到，中朝堅定捍衛各自主權、安全及發展利益，共同維護地區和平與發展，金正恩則稱朝方堅定支持「一中」原則及中國維護核心利益的政策和立場，雖然兩人均無點名提及日本，但提防日本之意，卻明顯不過。",

      "body": "港鐵藍田站路軌旁傍晚發生火警，無人受傷，觀塘站來往調景嶺站列車服務一度暫停約一小時。港鐵指懷疑是道岔設備絕緣膠因短路起火。\n\n事發的路軌旁冒出火光，位置靠近底部，出事的是俗稱波口的道岔用來控制列車行駛方向。港鐵指傍晚約五時半，即放工繁忙時段，藍田站路軌旁發生火警，車站需要封閉，大批消防和地鐵職員在往黃埔方向月台進入路軌搶修，受事故影響，觀塘至調景嶺站列車服務暫停，大批乘客須改乘其他交通工具。\n\n陸先生說：「上面很多人、塞滿大堂，取消行程，相信都很多人。下次再打算。」\n\n張小姐說：「原本打算繞路走，每站停久一些，其餘都可以，遲了約5至10分鐘。上層有位坐。」\n\n港鐵安排免費接駁巴士，來往觀塘、藍田及油塘站。在油塘站的車站，人龍沿著茶果嶺道，排到油塘道交界。\n\n港鐵在傍晚約六時半宣布，於藍田站附近路軌旁的火警已經處理，觀塘綫列車服務逐步回復正常，藍田站亦已經解封。\n\n港鐵晚上指懷疑是道岔設備一件絕緣膠因短路起火。曾是港鐵職員的立法會前議員張欣宇認為，事故不影響行車安全，又指單靠日常檢修，難以完全避免短路。\n\n智慧交通聯盟理事長張欣宇說：「應該是短路爆的火花點燃絕緣膠，因為膠是能燒著，在路軌軌旁包括波口，其實真的能燒著的東西很少，就算一塊膠都不會燒很久，不然燒很短時間都會停下來，只要檢查環境、固定波口、重新行車，相對短時間能完成。」\n\n由於事故歷時逾半小時，加上正值繁忙時間，張欣宇估計港鐵會被罰款。",

      "body": "今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。而全球觸目的中俄美三國元首會談將在今日下午進行，可能涉及俄烏戰事及伊朗局勢。外交部表示，這是中俄美三國元首歷史上首次面對面會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。\n中俄美三國元首面對面會晤。 新華社\n​​​\n\n相關新聞：APEC 2026懶人包 21成員聚首深圳談甚麼？ 和我們息息相關？ 一文看清重點全解析\n本屆深圳APEC新增一場重頭戲：中美俄元首明日將舉行歷來首次三方會談，或觸及伊朗、烏克蘭等問題，俄方正推動會後發表聯合聲明。\n相關新聞：深圳APEC｜中美俄將展二戰後首次三方對話 學者：聚焦地區穩定不復刻強權外交︱分析\n內地分析人士對《星島》指出，在目前全球政經格局動盪之際，中美俄三國元首不但在深圳「同框」，而且將破天荒召開三方峰會；若北韓領袖金正恩也現身深圳，今次峰會將是APEC成立37年來「含金量最高」的一次會議。據了解，各方正醞釀推動達成《深圳宣言》。\n相關新聞：深圳APEC︱峰會今揭幕習近平發表講話 被譽史上「含金量最高」\n11月19日最新消息\n00：35\n內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。\n相關新聞：深圳APEC｜晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n​ 內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。 中新視頻\n11月18日最新消息\n23：50\n俄羅斯衛星通訊社報道指出，出席歡迎晚宴的俄羅斯總統普京與美國總統特朗普，分別獲安排坐在習近平及夫人彭麗媛的左右兩側。\n相關新聞：深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身訪華團\n19：23\nAPEC各經濟體領導人開始陸續抵達位於深圳福田區的深圳國際交流中心。這處將舉行領導人合影活動，並舉辦由國家主席習近平名義舉行的歡迎晚宴。大會在入口處安排樂師現場演奏，當美國總統特朗普入場時，更特意駐足欣賞一會。\n相關新聞：深圳APEC｜習近平舉行歡迎晚宴 特朗普與普京握手\n晚宴開始後，中美俄三國領導人更在台上交談，期間美國總統特朗普更與俄羅斯總統普京握手。\n\n習近平在歡迎晚宴上，向出席嘉賓祝酒。路透社\n經濟體領導人在歡迎晚宴上合照。路透社\n經濟體領導人到深圳國際交流中心，出席歡迎晚宴。路透社\n習近平親迎特朗普：禮尚往來\n16：45\n新華社報道，周三（18日）下午，國家主席習近平在深圳寶安國際機場迎接來華出席亞太經合組織領導人非正式會議的美國總統特朗普。在迎賓曲中，習近平同特朗普親切握手。三軍儀仗隊行舉槍禮，少年兒童向特朗普獻花。中美兩國國旗迎風招展，軍樂團奏兩國國歌，戰機飛越致敬。兩國元首向青年歡迎隊伍揮手致意。\n習近平表示，今年9月我訪美時，特朗普總統夫婦專程赴機場迎接，並舉行隆重歡迎儀式。中國是禮儀之邦，有禮尚往來的傳統。我歡迎你再次訪華，期待同你就事關中美關係、亞太合作和世界格局的重大問題深入交換意見，推動基於尊重、公平、對等的中美建設性戰略穩定關系向前發展。\n特朗普表示，感謝習近平主席親赴機場迎接，感謝中方特殊安排，很高興再次到訪偉大的中國。習近平主席是一位偉大的領袖，每一次同習近平主席會晤都非常愉快，相信此訪將進一步推進兩國關係，取得圓滿成功。\n蔡奇、王毅、黃坤明參加。\n相關新聞：深圳APEC｜特朗普結束訪菲啟程來華 上機前做「招牌」握拳頭動作\n16：27\n日本首相高市早苗抵達深圳，將出席領導人非正式會議，展開就任後的首次訪華之行。\n\n相關新聞：深圳APEC︱日本首相高市早苗抵華 接待層級低於其他領導人\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n12：04\n國家主席習近平與俄羅斯總統普京會晤。\n習近平與普京會晤。\n習近平與普京會晤。\n普京讚深圳最具活力的大都市之一\n11：20\n俄羅斯總統普京出席深圳前海國際會議中心出席2026年亞太經合組織工商領導人峰會開幕，並以經濟體領導人身份作特別致辭。普京表示，此次APEC舉辦地深圳給人留下了深刻印像。「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」\n10：00\n國家主席習近平在主旨演講上表示，中國「十五五」規劃既是自身的發展藍圖，也為亞太乃至全球經濟增長提供機遇清單，是中國面向全球工商界發出的合作邀約。\n\n中國將為全球工商界提供超大規模開放市場。中國擁有全球規模最大中等收入群體，投資和消費潛力巨大。\n相關新聞：深圳APEC｜習近平籲踐行真正多邊主義 共建亞太共同體\n習近平：中國正加快建設開放大市場\n習近平指出，從新能源汽車到智能家居，從銀發經濟到冰雪旅遊，每一個新賽道都為全球企業帶來新機遇。中國正在加快建設開放大市場，擴大優質產品和服務進口，將不斷催生多樣化新需求。\n中國將為全球工商界提供前景廣闊的發展空間。創新驅動、綠色轉型是中國經濟的關鍵詞。中國將加快構建現代化產業體系，推動科技創新和產業創新深度融合，為全球企業技術創新和發展壯大提供強勁動能。\n\n中國將為全球工商界提供互促共進的合作環境。面對單邊主義、保護主義衝擊，中國始終踐行真正多邊主義，堅定維護多邊貿易體制，維護世貿組織規則，推動世界貿易組織改革，不斷為世界經濟增長和國際經貿合作注入穩定性和確定性。中方將從降低關稅、擴大准入，到探索規則、管理、標準等深水區改革，全面落實製造業准入又准營，穩步擴大服務業領域開放，為全球企業來華投資興業提供更穩定、更可預期優質環境。\n今明兩日出席峰會 多國領袖齊聚深圳\n03：00\n18日凌晨，俄羅斯總統普京乘專機抵達深圳，出席APEC峰會。中共中央政治局常委、中央書記處書記蔡奇前往機場迎接。分析人士對《星島》指出，今年5月普京訪華時，接機是中共中央政治局委員、外長王毅，而今次接機的是政治局常委蔡奇，規格比之前更高。預計普京在峰會期間將與多國與會領袖就亞太區經貿合作及國際局勢等議題展開交流。\n克里姆林宮發言人周六表示，11月19日在深圳，普京將與國家主席習近平及美國總統特朗普舉行三方會晤。",

          "body": "港鐵藍田站路軌旁傍晚發生火警，無人受傷，觀塘站來往調景嶺站列車服務一度暫停約一小時。港鐵指懷疑是道岔設備絕緣膠因短路起火。\n\n事發的路軌旁冒出火光，位置靠近底部，出事的是俗稱波口的道岔用來控制列車行駛方向。港鐵指傍晚約五時半，即放工繁忙時段，藍田站路軌旁發生火警，車站需要封閉，大批消防和地鐵職員在往黃埔方向月台進入路軌搶修，受事故影響，觀塘至調景嶺站列車服務暫停，大批乘客須改乘其他交通工具。\n\n陸先生說：「上面很多人、塞滿大堂，取消行程，相信都很多人。下次再打算。」\n\n張小姐說：「原本打算繞路走，每站停久一些，其餘都可以，遲了約5至10分鐘。上層有位坐。」\n\n港鐵安排免費接駁巴士，來往觀塘、藍田及油塘站。在油塘站的車站，人龍沿著茶果嶺道，排到油塘道交界。\n\n港鐵在傍晚約六時半宣布，於藍田站附近路軌旁的火警已經處理，觀塘綫列車服務逐步回復正常，藍田站亦已經解封。\n\n港鐵晚上指懷疑是道岔設備一件絕緣膠因短路起火。曾是港鐵職員的立法會前議員張欣宇認為，事故不影響行車安全，又指單靠日常檢修，難以完全避免短路。\n\n智慧交通聯盟理事長張欣宇說：「應該是短路爆的火花點燃絕緣膠，因為膠是能燒著，在路軌軌旁包括波口，其實真的能燒著的東西很少，就算一塊膠都不會燒很久，不然燒很短時間都會停下來，只要檢查環境、固定波口、重新行車，相對短時間能完成。」\n\n由於事故歷時逾半小時，加上正值繁忙時間，張欣宇估計港鐵會被罰款。",

          "size": 1,

          "body": "發展局於2024年底提出修訂《建築物條例》，針對沒有遵從強制驗樓、涉及「嚴重僭建物」的業主提高罰則，包括建議引入定額罰款。立法會發展事務委員會下周二討論修例建議，預料政府今日向立法會提交文件介紹詳情，當中擬加重「嚴重僭建物」的罰則，意味即使是有財力的業主，也非只是輕輕罰款了事。\n發展局2024年提修訂建議 嚴重僭建罰30萬元\n本港僭建問題由來已久、錯綜複雜，且並非只限新界或村屋，低密度豪宅亦經常出現非法搭建物，在外牆加建簷篷架等，現實上難以全部處理。政府兩年前提出修訂建議，將僭建物區分為與民生相關的「小型違規工程」，以及「嚴重僭建物」，前者只要證實安全，可較寬鬆處理，後者必須取締。\n2023年一場世紀暴雨，更意外揭發紅山半島多間獨立屋「向下僭建」跟單位面積相若的一層或兩層地下室，令社會譁然，地政總署及屋宇署其後大規模巡查，向違規業主提出檢控。部分業主已被法庭定罪，例如今年1月三幢獨立屋業主因僭建被判處罰款6萬元至13萬元不等。亦有業主因牽涉僭建花園和平台、佔用官地等多宗罪，合共被罰款98萬元，屬同一屋苑案件中刑罰最重。\n當局前年提出修訂《建築物條例》，針對僭建地庫、圍封天台等「嚴重僭建物」，建議從提高罰則至30萬元及監禁兩年，並降低檢控門檻、引入新罪行等，以提升阻嚇力。至於現存的小型僭建物，即未有按小型工程監管制度規定建造的僭建物，考慮到規模較小，並與市民日常生活息息相關，因此建議新增更多「指定豁免工程種類」，即現存的相關工程不再視為「僭建物」，包括指定高度以下的可收合遮篷和晾衣架等。\n民生相關輕微僭建物規範化\n因應去年發生宏福苑大火，政府決定擴大檢視《建築物條例》修訂工作，除改革對樓宇大維修規管、對業界違規加強懲處，亦務實處理僭建這個老大難問題。據悉，發展局最快今日向立法會發展事務委員會提交修例建議文件，下周二討論。\n據了解，當局建議對於風險程度低、與一般民生日常相關的較輕微僭建物，予以規範化；至於嚴重個案，則加強執法及懲處，預料罰則比兩年前提出的建議有稍為調整，總體是比目前罰則增加以倍計。\n議員倡罰則按物業價值計算\n發展事務委員會主席林筱魯認同修例大方向，若輕微僭建物無即時危險，可規範處理，而針對嚴重僭建物應加重罰則，提高阻嚇力，又直言過往司法機構對僭建處理較為「輕手」。他認為，日後針對嚴重僭建物罰款，可一併考慮物業價值，即樓價越高罰則越重，或設立「最低消費」，增加阻嚇力。至於如何釐清「嚴重僭建物」定義，林筱魯指，考慮因素包括是否影響公共安全，例如在旺區舊樓僭建，風險明顯較大。\n補地價換僭建物合法存在？政府不讓步\n近年政府面對財赤，坊間不乏有建議容許業主在申報後透過補地價方式處理，以換取僭建物合法存在，不過僭建物本質屬違法，若然「用錢搞掂」，法理上肯定說不過去，據悉政府在這方面不會讓步。\n政府兩年前曾建議引入新罪行，針對過去有業主辯稱僭建物並非由其搭建，而是購入物業時已存在，自己只是繼承前業主搭建的僭建物，以規避法律責任。林筱魯認為，「不知情」不能成為逃避法律責任的理由，而當中也可能涉及不同情況，例如圖則不清晰、買賣雙方及相關專業人士是否有責任，審議時亦須仔細討論。\n過往僭建問題時被質疑執法力度不足，又甚少重罰規違規業主，今次政府決定大幅提高罰則，從嚴執法，向違規者釋出並非「有錢大晒」的訊息，相信可收阻嚇作用。\n\n聶風",

          "body": "一股強烈東北季候風正影響廣東沿岸。同時，一道雲帶覆蓋華南。本港方面，今早多處地區氣溫較昨日低三至四度左右。\n本港地區今日天氣預測，大致多雲，有一兩陣微雨，天氣顯著轉涼。日間最高氣溫約22度。晚上市區氣溫下降至午夜最低約18度，新界再低兩三度。吹和緩至清勁偏北風，離岸及高地間中吹強風。\n展望明日有幾陣雨，氣溫進一步下降至市區最低約15度，新界再低兩三度。星期六漸轉天晴，但早上仍然相當清涼。隨後一兩日雲量增多，風勢頗大，氣溫稍為回升。\n分區氣溫\n九天天氣預報\n受強烈東北季候風及一道雲帶影響，華南地區今明兩日顯著轉涼，未來一兩日廣東沿岸相當清涼，內陸地區早晚寒冷。隨著覆蓋廣東的雲帶在週末轉薄，該區日夜溫差較大，早上仍然相當清涼。預料一股達強風程度的偏東氣流會在下週初影響華南沿岸，該區雲量增多，氣溫稍為回升。而另一股東北季候風會在下週中期影響華南，該區氣溫將再度下降及有幾陣雨。",

          "body": "宏福苑火災獨立委員會向行政長官李家超提交報告。李家超稱短期內公布全面改革計劃，和如何追究責任。消息指，報告點名四個政府部門失職，其中房屋局獨立審查組責任最大。\n\n宏福苑火災獨立委員會主席陸啟康、委員陳健波和歐陽伯權，親自向行政長官李家超呈交報告，相中見到報告分為兩冊，李家超感謝委員會努力，短期內會公布全面改革計劃和如何追究責任，但由於涉案人士已被起訴，會徵詢法律意見，以適當方式盡快公開報告。\n\n大埔宏福苑五級火去年11月26日發生，造成168人死亡。李家超成立獨立委員會，審視起火等原因，委員會舉行了三十場聽證會，有80人作證，取得逾百萬個檔案，據了解報告連附件約一千頁，超過十個章節。\n\n責任方面，委員會認為，大維修承建商宏業及工程顧問鴻毅要負上最大責任。政府方面，委員會點名四個政府部門失職，當中負責監管工程的房屋局獨立審查組ICU責任最大，報告指ICU只是跟隨屋宇署指引，無收到投訴不會巡查，只依賴檢驗人員。即使文件有相片，顯示後樓梯開設生口，都無主動跟進。\n\n至於非阻燃棚網，ICU曾到場巡查，但預先通知承建商，令他們有空間魚目混珠，而發泡膠封窗雖有居民投訴，但ICU只相信承建商說法，更回覆居民無法例規管，另一個被點名的是負責審查ICU工作的屋宇署，報告指署方從無按機制，抽查強制驗樓的工作，而更改抽查比例後，ICU表示沒有收到通知，反映溝通機制失效。\n\n消防處亦有失職，宏福苑警報系統停用多時，承建商先後向消防處85次申請延長關閉裝置，處方實地巡查26次，都沒有進入泵房查看，亦無了解長期停用原因，而居民投訴生口及發泡膠封窗問題，消防認為機制下不屬處方管轄範圍亦未有跟進。\n\n至於勞工處的責任，委員會認為相對最小，涉及勞工處17次到場巡查，都未能確立有工人吸煙的投訴，而處方多次收到同一張棚網阻燃證書，都無發現問題。\n\n據了解，報告亦會點出涉案部門人員的缺失，但不會具體列明誰要負較大責任。消息指政府已首次啟動部門首長責任制第二級調查，並設調查小組展開行政問責。",

          "body": "萬聖月即日起一連三個周末在全港多區舉辦特色活動。中環蘭桂坊及皇后像廣場都吸引不少市民及遊客「變身」參加，形容氣氛濃厚。\n\n過往萬聖節前夕，「百鬼夜行」的中環蘭桂坊，一班「嘩鬼」今年提早「駕到」。晚上8時許，蘭桂坊已經人頭湧湧。不論是傳統驚嚇角色或遊戲「主角」，這裡都隨處可見。\n\n馬來西亞旅客沛佳說：「我覺得很有氣氛，因為這裡過萬聖節好像過一個月，我覺得好好玩，因為每個人可以打扮成不同角色。」\n\n廣州旅客說：「(正日)驚太多人，所以提前來感受一下，提前拍照。以為今天是第一日，不會太多人，結果都是人山人海。」\n\n蘭桂坊亦安排六名「嘩鬼」在附近巡遊，直至晚上11時。\n\n呂先生說：「我去年都有來，這個時間是沒甚麼人，但今年已經好多人。」\n\n有酒吧亦期望活動帶動人流，指萬聖月首天訂枱已爆滿，期望「爆到」10月底。\n\n蘭桂坊酒吧副經理Max說：「只要下面區有人流，會有人行，很自然到餐廳、酒吧，就會上來。期望這兩星期，生意額會至少上升一半以上。」\n\n鄰近的皇后像廣場氣氛一樣夠。公主配上骷髏骨又是否相襯？不論大人、小朋友，甚至是「毛孩」都提早過萬聖節。\n\n羅先生說：「我覺得每年都這樣舉辦都好，多點遊客來香港，可以分散人流，早點出來玩。」\n\n這個近兩層樓高的大型眼球裝置，入夜後更「吸睛」。裝飾配上燈光效果，感覺更詭異。\n\n林小朋友說：「好恐怖，有這麼大的眼睛，又有很多不同的骷髏骨，不會被它嚇到，因為都不是真的。」\n\n周先生說：「很特別今年，夠大型、四處都有公仔，可以拍照。」\n\n市民除了來這裡，可與萬聖節裝飾打卡外，周日晚亦有音樂表演，令到場市民更盡興。\n\n啟德體育園主場館晚上亦化身成萬聖節南瓜。\n\n旺角、尖沙咀等亦會舉辦特色活動。旅客「扮鬼扮馬」，可免費乘搭兩輛特色電車。",

          "body": "「幻彩詠香江」晚上作告別演出。\n\n踏正晚上8時，有22年歷史的「幻彩詠香江」，最後一次在維港上演，除了傳統的鐳射燈光，這晚特別加入了煙火元素，多幢大廈同時以煙火照亮夜空。\n\n整個匯演歷時10分鐘，不少市民在尖沙咀海旁舉機紀錄這一刻。\n\n「幻彩詠香江」自2004年起上演，有逾43幢建築物參加。至於代替「幻彩詠香江」的其他光影項目，會在明年陸續推出。\n\n文化體育及旅遊局局長羅淑佩說：「今晚亦是一個重要的歷史時刻，陪伴著我們22年的『幻彩詠香江』即將上演最後一場的匯演，完成了它的歷史使命，多年來都向無數市民及旅客帶來了香港維港的天際線，璀璨夜色。今晚的匯演，我們特別加入了大廈頂樓的煙火效果，為這場經典的匯演，畫上圓滿句號。」",

          "body": "旅發局早前宣布，由2004年1月1日起宣傳香港的旅遊項目「幻彩詠香江」，將迎來告別，今晚（18日）為最後一夜，並預告會特別加設煙火表演。有市民提早個半鐘「霸位」盼可拍攝到畫面。\n攝影愛好者Ainsworth先生已在香港定居10年，知道幻彩詠香江今晚最後一次上演，亦知道今次演出加入了煙火元素，便特意前來記錄畫面。他表示已看過好幾次幻彩詠香江，一直認為表演十分有趣，每當有親友來訪都會推薦他們來看。「尤其如果搭天星小輪時遇上表演，觀賞體驗格外好。」 \n表演晚上8點開始，Ainsworth先生6點半已在尖沙咀海旁架設好攝影設備。他坦言如此早來是希望搶到好觀賞位置，又舉例指除夕倒數煙花匯演時通常會人滿為患，今日正好提早處理好手頭事情，便前來「霸位」，希望今日位置可有良好視野，能讓他準確捕捉表演動態，之後更打算和妻子會合，一同欣賞表演。\n幻彩詠香江一直為香港其中一個特色的，在燈光音樂匯演期間，維多利亞港兩岸都會亮起燈光，參與表演的主要地標包括中環廣場、香港會議展覽中心、美國銀行中心、滙豐總行大廈以及兩座國際金融中心。幻彩詠香江在2005年，獲列入《健力士世界紀錄大全》，成為全球最大型燈光音樂匯演。",

            "不過Gaddi's 強調這次不是告別，而是「後會有期」"

          "section": "港聞",

          "body": "香港高級餐飲界迎來震撼消息！香港半島酒店旗下、享譽盛名的米芝蓮星級法國餐廳吉地士（Gaddi's），今日（18日）正式宣佈，將於 2026年12月31日除夕夜 結束後暫停於現址的營業。不過Gaddi's 強調這次不是告別，而是「後會有期」！\n半島2028百年誌慶 法國餐廳吉地士Gaddi's歷史性重塑\n香港半島酒店旗下、享譽盛名的法國餐廳吉地士（Gaddi's）宣佈將於除夕夜後暫停在現址的營業。\n這家陪伴香港人超過大半個世紀的傳奇餐廳，之所以在年底暫別，是為了配合香港半島酒店即將於 2028 年迎來的「百年誌慶」重大翻新工程。作為半島酒店集團旗艦酒店的核心項目，吉地士將會進行全方位重塑。在不久的將來，這間殿堂級餐廳將會在酒店內的新址重塑經典、重新開幕。\n香港半島酒店董事總經理文森（Vincent Pimont）透露，吉地士一直是無數賓客、員工乃至香港市民心中別具意義的慶祝場所。這次的重塑計劃，不僅尊重並傳承近一個世紀以來深受賓客珍視的傳統、工藝與文化底蘊，更致力於為新一代樹立奢華典範。\n1953年開業 被譽為「蘇伊士運河以東最佳餐廳」\n吉地士於 1953 年開業，是香港首家帶領 Fine Dining（精緻餐飲）潮流的法國餐廳。\n追溯歷史，吉地士於 1953 年開業，是香港首家帶領 Fine Dining（精緻餐飲）潮流的法國餐廳。一開幕便一鳴驚人，獲得「蘇伊士運河以東最佳餐廳」的極高讚譽。\n在過去的七十多年中，這片優雅的空間見證了無數香港人的重要時刻——求婚、婚禮、家族慶祝，留下無數溫馨笑語。這裡更曾款待過無數國家元首、顯赫貴賓，荷里活巨星奇勒基寶（Clark Gable）和伊莉莎白泰萊（Elizabeth Taylor）均曾是座上客，賓客名冊星光熠熠。\n事實上，這並非吉地士歷史上首次搬遷。早在 1978 年，餐廳就曾由地庫遷往一樓的原宴會廳；2000 年更與時並進增設了「主廚餐桌」（Chef's Table）；並在 2020 年首度奪得米芝蓮一星殊榮。每一次的轉變，都讓吉地士的傳奇更上一層樓。\n吉地士 Gaddi's 告別倒數 限定紀念活動陸續登場\n吉地士將照常營業至 2026 年 12 月 31 日。在停業前的這段黃金時間內，餐廳將會舉辦一系列特別慶祝活動，詳情將於酒店的官方社交媒體平台公佈。無論你是想重臨舊地、回味昔日的珍貴時刻，還是希望在現址空間體驗最後的傳奇餘韻，都要把握時間致電或電郵預約，向這個承載七十載光陰的空間深情道一聲「後會有期」。\n\n吉地士（Gaddi's）\n 訂座或查詢：+852 2696 6763\n 地址：尖沙咀梳士巴利道22號香港半島酒店1樓\n\n同場加映：世界第五 亞洲第二 Balance哥的招牌空氣春卷 最難訂位餐廳之一 品味極級中菜",

          "body": "2025年12月海南自贸港正式启动全岛封关运作以来，政策红利持续释放，市场活力加速迸发。位于海南琼海的博鳌乐城国际医疗旅游先行区(简称“乐城先行区”)是中国大陆唯一的“医疗特区”，享有“特许医疗、特许研究、特许经营、特许国际交流”等政策，已成为国际创新药械进入中国大陆市场的最主要通道。\n\n11月18日，来自17个国家的20家海外华文媒体走进乐城先行区，探访颖奕国际医疗中心，在此了解台资企业依托海南自贸港政策的发展故事。\n\n颖奕国际医疗中心作为一家全台资三级综合医疗机构，自2021年正式运营以来，依托乐城先行区特许政策叠加海南自贸港红利，持续打通两岸医疗资源、对接全球前沿技术，成为台企看好海南、深耕健康产业的生动缩影。\n\n颖奕国际医疗中心院长韩海玲表示，封关之后，无论是海内外前来就诊的患者群体，还是企业自身发展，都能感受到明显变化。不少境外客户主动多方了解、持续关注海南自贸港相关政策；依托自贸港人才引进政策，中心顺利引进多名境外顶尖医师，同步引入国际先进医疗技术，“去年我们国际医疗板块接诊约157名患者，今年截至目前，接诊量已经实现两至三倍增长”。(林士杰 陈英清 符宇群)",

          "body": "11月18日，来自17个国家的20家海外华文媒体走进海南博鳌沙美村，探访百年侨村蝶变路。\n\n沙美村是一座拥有200多年历史的侨村，历经退塘还林还湿、修复红树林湿地、保护性修复70余间南洋特色侨居，从昔日传统渔村蝶变为中国美丽休闲乡村和博鳌亚洲论坛对外交流的“国际会客厅”。\n\n沙美村党支部书记、村委会主任冯锦锋介绍，过去村庄交通闭塞、垃圾环村，发展受限。2017年，沙美村启动美丽乡村建设，依托当地特色资源发展民宿、农家乐等乡村旅游产业，带动村民增收致富。如今村庄面貌焕然一新，如同花园，吸引各地游客前来。\n\n冯锦锋说，美丽乡村建设前，该村人均收入15000元，目前人均收入提升至25000元。\n\n荷兰《中荷商报》特派记者姚卫民参访后表示，美丽乡村建设让沙美村焕然一新，也让村民生活很甜；加拿大搜罗传媒副总经理唐明涛则留意到村内风貌融合之美，古意建筑与现代洋楼并存，直观体现村庄持续向前发展的活力。(陈英清 林士杰)",

          "body": "一把斧头加腐蚀性金属，爱尔兰男子潜入机场，“拆报废”一架6000万美元的“大力神”军机 | 国际早察\n\n　　美东时间11月17日，美国纽约南区联邦检察官办公室正式公开一份联邦起诉书，对48岁的爱尔兰男子戴西·奥科兰(Daithi O'Corrain)提起刑事指控，罪名是蓄意破坏并“有效摧毁”一架造价高达6000万美元的美军“大力神”运输机。\n\n　　这份最新解密的起诉书，将今年4月发生在爱尔兰香农机场(Shannon Airport)的一起离奇破坏案公之于众——而作案现场曝光的细节，堪称现实版的“硬核拆机现场”。\n\n　　凌晨封窗反锁舱门，48岁男子上演“硬核拆机”\n\n　　据英国广播公司、CNN等外媒报道，今年4月11日，一架美国空军国民警卫队的C-130H“大力神”运输机正停放在爱尔兰香农机场过夜。\n\n　　凌晨4时30分刚过，奥科兰趁夜通过破坏锁定装置进入机舱。\n\nBBC的报道公布了奥科兰作案现场\n\n　　他反侦察意识极强：先用绑带将舱门固定关闭，然后遮盖机窗，给自己造出封闭的“作案暗室”，随后展开系统性破坏：\n\n　　切断机内电线和液压管路。他挤压液氧管路，摧毁驾驶舱内的所有仪表，并刺穿飞机的通风管道。\n\n　　抡起斧头砍砸机身。走出机舱后，他直接挥斧猛砍机身，留下一道道“伤口”。\n\n　　卡死油箱腐蚀机身。更致命的是，他拧开油箱盖倒入大量金属滚珠轴承，还在关键金属部件上涂抹了具有腐蚀性的金属镓。\n\n　　预谋数月摸清门路，6000万美元“大力神”报废\n\n　　直到安保与美军察觉异样破门而入时，这架“大力神”已面目全非。\n\n　　美国检察官表示，奥科兰策划此次袭击已长达数月，期间专门在网上搜集了关于C-130运输机结构的信息，这才得以精准瘫痪整架飞机。\n\n　　美方确认，由于航电全毁、机身遭斧劈、油箱混入异物且蒙皮遭镓元素严重腐蚀，这架价值约6000万美元的运输机已无法修复，被认定为“有效摧毁”。\n\n　　雪上加霜的是，美国联邦调查局(FBI)称，此次袭击还“危及了关键的军事行动”。\n\n　　目前，奥科兰仍被关押在爱尔兰监狱中，美方已启动程序欲将其引渡至美国受审，一旦在美定罪，他将面临最高10年监禁。\n\n　　奥科兰为什么要冒险拆机？\n\n　　随着案情公开，奥科兰冒险“拆机”的动机也浮出水面。\n\n　　据外媒披露，一项由奥科兰好友发起的在线筹款活动称，他之所以让这架C-130运输机“丧失功能”，是为了抗议美国与以色列针对伊朗的战争，以及华盛顿对以色列在加沙地带所进行“种族灭绝战争”的支持。\n\nCNN对于此次事件的报道\n\n　　位于爱尔兰西部的香农机场是一座民用国际机场，亦时常承担过境军机的经停补给任务。然而，据媒体梳理，在过去18个月里，该机场曾发生多起安保漏洞事件。其中包括三人被控向一架过境美军飞机喷漆，以及另外三人驾车闯入限制区域。\n\n　　作者：王曦\n\n 【编辑:李岩】",

          "body": "美國11月3日舉行中期選舉，18日美媒報道，前聯邦眾議員佩爾托拉（Mary Peltola）在阿拉斯加州的聯邦參議員選舉中，擊敗共和黨籍現任參議員沙利文，為民主黨拿下第9個原由共和黨掌握的席位，使民主黨在參議院以56席壓倒共和黨的44席，是16年來該黨在參議院的最大優勢。\n相關新聞：美國中期選舉｜防長赫格塞思成特朗普挫敗「替死鬼」 最快下周被彈劾\n拿第9個原共和黨掌握席位\n佩爾托拉以50.12%得票率勝出，讓這次中期選舉最後一場勝負未定的參議院選戰塵埃落定。由於阿拉斯加州偏遠村落分布廣泛，選民散居各地，點票歷時兩周才完成。佩爾托拉獲得14萬4302票，勝過沙利文（Dan Sullivan）13萬1844票；即使將另一名候選人小蘇利文（Daniel J. Sullivan Jr.）所得的4760票合併計算，仍無法超越佩爾托拉。\n選票上出現兩名叫沙利文的候選人，多次引發總統特朗普不滿，指稱民主黨利用「冒牌候選人」分票。\n佩爾托拉勝選後，民主黨將在明年1月新一屆國會開議時，以56席對44席掌握參議院多數，為民主黨16年來在參議院的最大優勢。民主黨目前在435席的眾議院，暫以257席拋離共和黨的172席。",

          "body": "美國疾病控制及預防中心（CDC）週五（24日）公布，與冰山萵苣有關的環孢子蟲寄生蟲疫情，已蔓延至美國九個州份，成為該國有紀錄以來最大規模的相關爆發。\n\n疫情範圍擴大　中西部成重災區\n\nCDC指出，除最初通報個案的印第安納州、肯塔基州、密歇根州、俄亥俄州及西維珍尼亞州外，伊利諾伊州、堪薩斯州、奧克拉荷馬州及賓夕凡尼亞州亦錄得與受污染萵苣相關的病例。自5月中旬以來，全美41個州份合共錄得超過11,000宗感染個案，其中密歇根州情況最為嚴峻，確診人數已突破8,100人。\n\n患者形容「畢生最痛」　寄生蟲引發嚴重腸道疾病\n\n這種名為環孢子蟲的寄生蟲，會引發環孢子蟲病，患者會出現爆發性腹瀉。有受感染居民向英國廣播公司（BBC）形容，該病症是「一生中經歷過最痛苦的事」。由於寄生蟲進入人體後，可能要數星期才出現病徵，令調查人員難以追蹤患者進食紀錄，增加鎖定感染源頭的難度。\n\n供應商自願回收　化驗結果曾現烏龍\n\n主要食品供應商Taylor Farms於本月17日，主動回收所有來自墨西哥中部的冰山萵苣。美國食品及藥物管理局（FDA）調查人員亦在上週末曾宣佈，在Taylor Farms的產品樣本中驗出陽性反應，但其後撤回聲明，指有關結果為「假陽性」。\n\n專家料調查漫長　猶如馬拉松\n\n密歇根州立大學食品安全專家韋德·塞耶斯向BBC表示，環孢子蟲病的調查進展通常緩慢，往往要在首宗病例發生數月後，情況才會變得明朗。他形容：「這類調查不幸地更像是馬拉松，而非短途衝刺。」CDC在週五的更新中，呼籲民眾切勿進食Taylor Farms已回收、源自墨西哥中部的冰山萵苣。",

          "body": "日本於月初公布新版防衛白皮書，將中國列為最大戰略挑戰，又指武器生產是促進經濟繁榮之路。\n\n俄羅斯國營電視台RT引述捷克學者澤馬內克（Ladislav Zemánek）分析，白皮書實則是將日本的防衞擴張，轉化為更緊密、更全面的體系。重組情報與軍事組織，部署長程打擊系統，更把日本一直以來的防禦範圍向外延伸。\n\n增加遠程反擊能力　「被動防禦」變「遠程遏制」\n\n分析認為，白皮書提及的一項重大轉變，在於日本把「反擊能力」視為遏止入侵的關鍵，並將「遙距防衛能力」列為防衛力整備的核心支柱。\n\n為此，日本從美國手上取得「戰斧」巡航導彈，並首度公開測試本土三菱重工製造的「25式」反艦導彈，加上高超音速武器的研發，顯示日本已從「被動防禦」變成「遠程遏制」。\n\n防衛開支接近9萬億日圓　創歷史新高\n\n增強裝備之餘，日本的防衞預算同步擴張，聲稱防衛開支將提前達到相當於GDP 2%的目標。日前已有報道指出，日本下個財政年度防衛預算，將增至8.9萬億日圓（折合約4,400億港元）歷史新高。\n\n報道又指，首相高市早苗雖然多次表示日本遵守「無核三原則」，但亦未有確認「無核三原則」會在即將修訂的安保文件裡保持不變。分析認為，日本民用核工業、核處理設施及技術，已讓日本擁有「潛在核能力」。\n\n外交部批評：戳破日方「和平國家」謊言\n\n中國外交部對新版防衛白皮書，表示強烈不滿、堅決反對，批評日本政府無端抹黑指責中方，炒作所謂「中國威脅」論。外交部直指，新版白皮書鼓吹發展遠程進攻能力，甚至將軍事產業擴張包裝為經濟增長點，再次戳破日方「和平國家」的謊言，中方敦促日方深刻反省歷史罪責，停止為強軍擴武尋找藉口。\n\n分析認為，中國擔憂的不只是日本軍力擴張，還有跟美國、澳洲、菲律賓、南韓等國的防衛合作。新版白皮書讓日本的情報、打擊、工業、科技都更具能力，在區域防衞合作的角色亦更加重要。",

          "body": "歡迎收看《世界觀》。\n\n國家主席習近平日前到印度出席金磚國家領導人峰會，是習近平時隔七年再踏足當地，國際社會最關心的似乎並非峰會會面成果，反而更著眼於美國和印度近年關係起伏的前提下，印方是否有意和中國重歸於好。而習近平應邀親訪當地，又能否視為中方向印方示好之舉？\n\n2026年金磚國家領導人峰會，過去周日在印度新德里落幕，一如以往都有大合照環節，輪值主席國印度，總理莫迪站在正中間，左右兩邊分別是俄羅斯總統普京，以及中國國家主席習近平，是繼去年天津上海合作組織峰會後，三人再度碰頭。\n\n新華社報道，中印領導人在今次峰會期間會晤約四十分鐘，習近平稱，近兩年兩國關係從「再出發」到「再提升」，機制交往恢復，貿易再創新高，這一局面來之不易，值得珍惜。\n\n印方聲明則表示，分歧不應演變成爭端，邊境和平安寧是發展關係的必要基礎。\n\n中印關係2020年6月，因為雙方官兵在加勒萬河谷爆發嚴重肢體衝突，並造成人員傷亡後，跌至歷年冰點。四年半後中印雙方達成邊界巡邏協議，雙方軍隊回復至衝突爆發前的狀態。\n\n習近平和莫迪隨後，在俄羅斯喀山舉行的2024年金磚國家領導人峰會上，舉行雙邊會晤，中印關係隨之而「解凍」。今年峰會後，兩國領導人再次同框，還要手牽著手，不禁令外界猜測，中印從此以後是否正式「大和解」。\n\n巴西國際法與中國問題專家高文勇說：「金磚國家不單可以是中國和印度會面的平台，它亦可成為一個讓雙方，學習如何透過合作管控分歧的平台，這將向所有國家發出強而有力的信息，實現多極化需要有共存的能力，即使意見分歧，亦要合作和建立共同利益。」\n\n外長王毅在中印領導人會晤後表示，期待印方同中方相向而行，推動兩國關係向前走、不停滯、不倒退，把邊界問題置於雙邊關係適當位置，讓對話合作成為主流，共同為地區乃至世界和平與繁榮，作出應有貢獻。\n\n有意見認為，這只是中印關係持續改善的進程，兩國經歷數十年最大低谷後，還有很多工作要做，主因是美國對中印往來的影響力仍大，印度一旦同美國關係稍有改變，對於跟中國改善關係的意欲又會下降。\n\n南京大學國際關係學院院長朱鋒亦指，印度經濟存在結構性局限，對中國市場及供應鏈的依賴難以替代，但莫迪政府受印度教民族主義力量所影響，試圖借中美競爭博取戰略紅利，對華採取既防又打、既談又拉的姿態，相信兩國關係短期難有重大突破。\n\n美國總統特朗普近年對全球各國揮舞關稅大棒，令美印關係出現裂縫，有輿論認為中方正在把握機會，將印度同美國的關係拉遠一些。而對印方來說，莫迪同習近平公開握手，並不代表「親中」，可能是要向美方傳遞「我們還能有其他選擇」的信息。\n\n根據美方說法，「習特會」下周會在美國華盛頓舉行，外界猜測習近平選擇此時與莫迪及普京公開碰頭，可能是想向美國傳遞一些信息，為「習特會」增添談判籌碼。\n\n我們明天繼續《世界觀》，觀世界。\n\n點擊觀看其他集數",

          "title": "中俄美元首今將歷史性會晤 俄媒體引評論：料中方堅持不捲入衝突｜國際分析",
          "url": "https://news.tvb.com/tc/1207099-中俄美元首今將歷史性會晤俄媒體引評論料中方堅持不捲入衝突國際分析",
          "summary": "國家主席習近平今日將於深圳，與俄羅斯總統普京及美國總統特朗普舉行中俄美元首會晤，這將是三國元首歷史上首次面對面會談。內地時事評論員司馬平邦接受俄羅斯衛星通訊社訪問時表示，本屆亞太經合組織（APEC）峰會的參會規模與覆蓋面均創下新紀錄，其中美國工商界參與度更居外方經濟體之首。",
          "summary_short": "國家主席習近平今日將於深圳，與俄羅斯總統普京及美國總統特朗普舉行中俄美元首會晤，這將是三國元首歷史上首次面對面會談。",

          "body": "第33屆亞太經合組織（APEC）領導人非正式會議將於11月18日至19日在廣東深圳舉行。\n\n深圳市南山區後海片區\n\n2026年10月12日，旅客經過皇崗口岸出境大廳「皇崗之眼」\n\n深圳前海特區館廣場上的「鵬翔碧浪」主題景觀\n\n回顧過去40多年間，深圳從荒灘崛起為開放高地，小漁村蝶變為現代化國際都市。如今APEC第33次領導人非正式會議將在深圳舉行，世界的目光再一次匯聚於此。為什麼是深圳，答案或許藏在這些歷史瞬間裡。\n\n上圖為20世紀80年代的深圳蛇口港；下圖為2024年9月18日拍攝的深圳蛇口港\n\n20世紀80年代初拍攝的深圳蛇口合成材料廠車間一角\n\n20世紀80年代拍攝的深圳國際貿易中心大廈\n\n1979年，招商局在深圳創辦蛇口工業區，這是中國第一個對外開放的工業園區，為一年之後深圳經濟特區的創立起了探路作用。1987年12月1日，深圳市政府舉行首次土地使用權公開拍賣，一槌定音後，土地有償出讓漸漸成為常態，為特區城市建設籌集大量資金。20世紀80年代，設計高度160.5米的深圳國際貿易中心大廈以三天一層樓的建設速度聞名全國，成為特區地標。\n\n20世紀90年代的深圳證券交易所\n\n20世紀90年代，工人在深圳蛇口工業區一家生產計算機電腦磁頭的中外合資企業的生產車間\n\n20世紀90年代，兩位大學畢業後來深圳工作的青年人\n\n1990年12月1日，深交所率先開始集中交易，中國資本市場邁入快速發展階段。從務工者、大學畢業生到華強北博物館講述的創業故事，再到深中通道，深圳的成長是中國改革開放的生動縮影，也是亞太開放融通的生動注腳。\n\n2010年8月，前海深港現代服務業合作區正式成立，定位依托香港、服務內地、面向世界，成為特區中的特區。\n\n深圳前海深港現代服務業合作區一角\n\n2021年1月7日，觀眾穿過華強北博物館時光廊道\n\n2025年9月14日拍攝的沐浴在晨曦之中的深中通道，遠處是深圳\n\n開放門戶聯通世界\n\n作為聯通世界的重要門戶，深圳把開放的承諾化作互利共贏的堅實步履。國際人才交流大會設置外籍人才招聘會，外籍求職者與用人單位交流。\n\n2026年5月1日凌晨，對53個非洲建交國全面實施零關稅舉措生效後的全國首票貨物，經深圳灣口岸貨檢通道入境。蓮塘口岸夜景、文博會觀展、鹽田港貨輪、華強北外國客戶挑選手機，均展現深圳對外連接的活力。\n\n2019年4月14日，在第十七屆中國國際人才交流大會設置的外籍人才招聘會上，外籍求職者（右）與用人單位工作人員交流\n\n2026年5月1日凌晨，對53個非洲建交國全面實施零關稅舉措生效後的全國首票貨物，經深圳灣口岸貨檢通道入境\n\n2024年5月24日，觀眾在第二十屆中國（深圳）國際文化產業博覽交易會上觀展\n\n2026年10月14日，在深圳華強北一家手機零售店，外國客戶挑選手機\n\n創新驅動亞太繁榮\n\n科技園裡的智慧工廠、實驗室裡的協同攻關、生產線上的智能製造，創新成為深圳鮮明的標識，也是亞太繁榮的動力源。\n\n華為在深圳舉行秋季全場景新品發布會，發布最新創新技術產品。富士康龍華科技園數控機床精密加工智造熄燈工廠、美團送餐無人機穿行高樓大廈、坪山區環衛機器人在城中村清掃、高交會禮儀機器人到養老護理院人形機器人互動、優必選商用版人形機器人Walker C、全球機器人開發選品選型服務中心靈巧手、京東物流無人車行駛坪山區道路，顯示深圳智能製造與機器人應用不斷拓展。\n\n2023年9月25日，華為技術有限公司在深圳舉行秋季全場景新品發布會，發布最新創新技術產品\n\n深圳富士康龍華科技園數控機床精密加工智造「熄燈工廠」內景\n\n在深圳市龍崗區，一架美團送餐無人機穿行在高樓大廈間\n\n2025年3月19日，在深圳市坪山區石井街道，環衛機器人在城中村進行清掃工作\n\n上圖為1999年10月6日，首屆中國國際高新技術成果交易會開館儀式在深圳舉行，觀眾與深圳華強集團研製的禮儀機器人握手；下圖為2025年3月3日，在深圳市養老護理院，一名老人與人形機器人互動\n\n在深圳優必選科技展廳內，商用版人形機器人Walker C向觀眾揮手致意\n\n2026年7月4日，參觀者在深圳全球機器人開發選品選型服務中心體驗靈巧手\n\n文明交流包容共融\n\n亞太繁榮發展的歷程表明，唯有合作才能發展。深圳以包容開放的城市品格，搭建起文明交流的橋樑。不同地域、不同文化的人們在這裡相遇相知、並肩奮鬥。\n\n位於深圳市的前海深港青年夢工廠，香港創業青年們一起交流各自的創業項目\n\n外國遊客在大疆歡樂海岸旗艦店選購手持攝影設備\n\n外國遊客在深圳人才公園體驗美團無人機送外賣\n\n來自牙買加的遊客在龍崗全球首家機器人6S店參與互動遊戲\n\n2026年APEC林業部長級會議與會代表在深圳龍崗機器人街區觀看機器人表演\n\n生態底色低碳發展\n\n快速發展的同時，深圳始終堅守生態底色。紅樹林候鳥翩躚，濱海綠道綿延成廊，低碳理念早已融入城市肌理，展現深圳生態與城市發展並行。深圳市龍崗區近年重點打造綠色發展與智慧創新的道路，其中低碳產業成為該區「綠美智變」的動力引擎。\n\n深圳紅樹林濕地與城市的高樓大廈形成人與自然和諧相處的景象\n\n人們走在深圳市龍崗區「國際低碳城」的園區裡\n\n前海深港現代服務業合作區\n\n鹽田海邊騎行綠道\n\n深圳灣公園騎行\n\n園博園文萊花園\n\n蓮花山山頂俯瞰城市中軸線",

          "body": "美國總統特朗普、日本首相高市早苗，昨日跟澳洲、印度兩國總理在菲律賓出席四方安全對話。特朗普宣稱美國稀土產量十個月後會趕上中國，又稱要加強印太區內的人工智能(AI)發展。至於高市早苗較早前與農村部長張柱握手，被視為中日關係惡化後，高市首次跟中方官員接觸。\n\n美國總統特朗普在訪問深圳、與中俄兩國元首歷史性會晤之前，他周三先到菲律賓首都馬尼拉，與日本首相高市早苗、澳洲總理阿爾巴內塞、印度總理莫迪出席四方安全對話。\n\n特朗普跟三國領袖合照期間見記者，稱期待訪華行程，亦宣稱美國稀土產量很快會追上中國。\n\n美國總統特朗普表示：「我們的稀土產量達到前所未有水平，預計十個月內將追上他們(中國)，我們在十個月後將擁有一切所需。我很期待到訪中國，我們將討論一些重要事情。我是習主席的賓客，聽說我們行程備受矚目，會很美好。」\n\n四國領袖發聲明，重申要致力維護自由、開放的印太地區，並強烈反對任何企圖透過武力或脅迫、單方面改變現狀的行動。\n\n日本首相高市早苗稱：「四方安全對話致力促進地區和平穩定，我們區內夥伴將共同塑造印太未來。」\n\n澳洲總理阿爾巴內塞說：「(討論重點)涉及我們經濟前景，包括關鍵礦物及稀土發展、人工智能革命及其成長生產的潛力。」\n\n特朗普表明，跟多國達成新關鍵礦產協議，旨在鞏固供應鏈，並確保四國不會受到單一外國供應方的脅迫風險。特朗普表明，各國正致力發展AI人工智能，美方希望跟有共同價值觀的國家確保這項技術的未來，並且共同應對網路攻擊。四國早前承諾投入逾8,500萬美元，支持印太地區夥伴獲取可信賴的AI技術。\n\n各方明年將首次在四方安全對話框架下進行聯合海上演習，以加強資訊共享，提升海上態勢感知能力。特朗普強調正跟澳洲及其他國家製造全球最好的潛艇。\n\n在四方安全對話舉行之前，高市早苗先出席東盟與中日韓會議。國務院總理李強提早回國，改由農業農村部長張柱出席。共同社報道，高市主動跟鄰座的張柱握手及短暫交談。這幕被視為高市去年11月在日本國會發表「台灣有事」論後，首度與中方官員接觸。日本傳媒認為雙方似乎是出於外交禮節而握手。",

          "body": "中新网云南大理11月18日电 (记者 韩帅南)记者18日从大理州委宣传部获悉，近日，在云南省大理白族自治州成立70周年之际，一封跨越重洋的贺信从南半球传来。澳大利亚米尔迪拉市市长海伦·希利议员致信，向大理州送上祝贺。\n\n澳大利亚米尔迪拉市市长海伦·希利议员致信大理。大理州新闻办 供图\n\n　　大理州地处南方丝绸之路与茶马古道交汇处，素有“亚洲文化十字路口的古都”之称。自1956年成立以来，大理州持续对外开放，与多个国际城市缔结友好关系，“全球生态文明建设(洱海)论坛”“澜沧江—湄公河合作大理马拉松”等涉外品牌活动持续举办，正加快成为面向南亚东南亚开放的重要节点。\n\n　　“我谨向大理州人民致以祝贺，祝贺大理白族自治州取得七十载辉煌成就。”贺信中，海伦·希利写道。她表示，大理与米尔迪拉市两座城市各具特色、风光秀美，都依托农业与旅游业实现繁荣发展。\n\n　　风光相似、产业相近，两地往来也日益密切。教育交流，就是这份情谊最生动的注脚。在贺信中，海伦·希利写道，在姐妹学校交流项目框架下，米尔迪拉至今已有400余名学生、80名教师到访大理，受到当地热情接待；15年来，大理师生也多次赴米尔迪拉交流学习。“我们必将持续巩固这份教育纽带，让交流合作薪火相传、面向未来。”\n\n　　米尔迪拉位于澳大利亚维多利亚州西北部墨累河沿岸，与大理州于2006年缔结友好城市关系。以教育合作为起点，两地交流逐步向多领域延伸。\n\n　　贺信的最后，海伦·希利送上祝福，“祝愿全州人民度过一个美好的州庆，欢庆活动圆满顺利、喜乐祥和！”\n\n　　从苍山洱海到墨累河畔，山海不远，情谊长青。这封贺信，映照出大理以民间交流厚植开放底色的前行脚步。(完)\n\n 【编辑:付子豪】",

          "title": "哈尔滨两大冰雪旅游景区启动人工造雪",

          "summary": "中新网哈尔滨11月18日电 (记者 王琳)截至18日，哈尔滨太阳岛雪博会、冰雪大世界两大冰雪旅游景区先后启动新雪季的人工造雪工作，为赶制雪雕景观提前“囤雪”。",

          "size": 1,
          "keywords": [],
          "body": "中新网哈尔滨11月18日电 (记者 王琳)截至18日，哈尔滨太阳岛雪博会、冰雪大世界两大冰雪旅游景区先后启动新雪季的人工造雪工作，为赶制雪雕景观提前“囤雪”。\n\n11月18日晚，第28届哈尔滨冰雪大世界启动人工造雪工作。图为造雪机全速运转、喷涌雪雾。　江宇阳 摄\n\n　　受自然降雪时序、雪量、雪质不可控影响，景区难以依靠天然雪完成体量巨大的雪雕工程。人工造雪质地密实、可塑性强、不易融化，雪质统一洁白，适配大型雪雕雕刻需求。作为“世界冰雪旅游卓越城市”，哈尔滨人工造雪技术成熟。\n\n　　人工造雪对气温、湿度、风向和水温都有严格要求，-10℃左右是启动作业的关键节点。哈尔滨连日降温、降雪，气象条件已经满足造雪标准。第39届哈尔滨太阳岛雪博会于16日凌晨启动人工造雪工作，首日造雪量约100立方米。\n\n　　11月18日晚，第28届哈尔滨冰雪大世界启动人工造雪工作，30余台造雪机完成调试并全速运转。丝丝雪雾从造雪机喷涌而出，洁白雪花缓缓飘落、堆积成小山，将成为本届冰雪大世界的雪雕原料。\n\n　　人工造雪是雪雕工程建设的首道工序，造雪师傅们要时时关注气象条件，调整设备压力、喷射角度等参数，持续监测雪料状态，确保产出的雪料紧实均匀、密度达标，满足雪雕堆筑、精细修型、长期留存等工艺要求。\n\n　　第一批经过精细把控的雪料验收合格后，将送往该景区东售检票大厅外，用于本届冰雪大世界首个大型主题雪雕“雪人一家”的建设。(完)\n\n 【编辑:田博群】",

          "summary_short": "中新网祁阳11月18日电(何艳飞 于卫容)时下，湖南祁阳市下马渡镇团栗村慕云山景致怡人。",
          "digest": "时下，湖南祁阳市下马渡镇团栗村慕云山景致怡人",

            "连片花木错落有致，山顶露营基地帐篷错落排布，不少游客前来观景赏日落",
            "曾经无人问津的荒坡山地，如今变身花海秘境、网红休闲营地"

          "section": "民生",
          "category": "",

          "size": 1,

          "body": "中新网祁阳11月18日电(何艳飞 于卫容)时下，湖南祁阳市下马渡镇团栗村慕云山景致怡人。连片花木错落有致，山顶露营基地帐篷错落排布，不少游客前来观景赏日落。\n\n　　曾经无人问津的荒坡山地，如今变身花海秘境、网红休闲营地。依托花木、文旅、康养三大融合产业，团栗村成功盘活闲置山地资源，将荒芜山野变为富民增收的“聚宝盆”。\n\n曾经无人问津的荒坡山地，如今变身花海秘境、网红休闲营地。祁阳市委宣传部供图\n\n　　团栗村是下马渡镇“花卉小镇”核心村落，先后获评永州市乡村振兴示范村和祁阳市先进村、模范村。过去，受地形条件限制，村内坡地土壤贫瘠、不宜耕作，大量山地长期撂荒。加之青壮年劳动力外流，村集体经济基础薄弱，一度制约村级发展。为此，团栗村立足山地资源与乡友人脉优势，因地制宜盘活闲置土地，探索出三产融合的乡村振兴发展路径。\n\n　　据悉，依托全镇“花卉小镇”发展定位，团栗村聚焦花卉苗木主导产业，整合村内零散坡地、撂荒土地，实行统一流转、集中经营，打造规模化苗木基地。村集体投入资金参与共建分红，建成近千亩花卉苗木种植基地，成为祁阳城区近郊颇具规模的四季花海景观。\n\n　　土地流转让闲置资源稳定变现，苗木基地日常管护、苗木装运等岗位，吸纳本地村民就近务工，实现“土地租金+务工薪金”双增收。有村民表示，连片花木产业既筑牢村级集体经济根基，也塑造了优美的乡村生态景观，为文旅业态落地奠定基础。\n\n　　依托慕云山可俯瞰祁阳城区的区位优势，该村还盘活山顶闲置荒坡，引入文旅企业打造慕云山山顶露营基地。通过完善观景平台、休闲草坪、通行道路等基础设施，基地迅速成为城郊热门休闲打卡点，吸引市民登山露营、观赏日出日落。“站在观景台上，全城美景尽收眼底，在家门口就能感受诗与远方。”村民刘成晨说。\n\n　　目前，该村已形成“山顶观景露营、山脚赏花休闲”的游玩环线，上下业态联动引流，持续激活乡村文旅消费活力。\n\n　　据了解，依托祁阳市乡友招商机制与村级商会平台，团栗村还精准以商引商，引进总投资2000余万元的生态康养庄园项目，规划建设智能化鸽类养殖、屠宰冷链、有机肥加工、文旅康养等配套业态，打造三产融合示范基地，目前项目正有序推进建设。\n\n　　该项目构建起村内产业循环体系：鸽粪加工为有机肥，反哺花卉苗木种植；标准化养殖与冷链加工拓宽农产品外销渠道；康养文旅业态与花海、露营基地串联互补，完善乡村产业链条，实现产业互促、资源循环。\n\n　　村党支部书记邓小军介绍，近年来，团栗村持续盘活闲置资源、完善基础设施、争取项目支持，推动村集体经济集约化、规模化发展。下一步，村里将持续深耕特色优势产业，丰富文旅、康养新业态，持续拓宽群众增收渠道。\n\n　　如今的团栗村，村容整洁、产业兴旺、生态宜居。通过盘活荒山薄地、推动多元产业融合发展，村庄实现由荒芜山野向和美乡村的蝶变。(完)\n\n 【编辑:刘欢】",

          "title": "甘肃定西应急执法人：13载守红线 “刚柔并济”护民安",
          "url": "https://www.chinanews.com.cn/sh/2026/11-18/10734370.shtml",
          "summary": "中新网兰州11月18日电 (戴文昌)141起处罚案件、186次应急处置、317件民众信访、500余次普法帮扶，几组数字，记录着甘肃定西市安定区应急管理综合行政执法队副队长安文伟13年一线执法路。",
          "summary_short": "中新网兰州11月18日电 (戴文昌)141起处罚案件、186次应急处置、317件民众信访、500余次普法帮扶，几组数字…",

          "size": 1,

          "body": "中新网兰州11月18日电 (戴文昌)141起处罚案件、186次应急处置、317件民众信访、500余次普法帮扶，几组数字，记录着甘肃定西市安定区应急管理综合行政执法队副队长安文伟13年一线执法路。在基层辖区，她直面多领域安全风险，贴心纾解民忧，刚柔并济守护一方平安。\n\n　　18日，“新征程上的奋斗者”媒体见面活动——甘肃省应急管理系统代表专场举行。安文伟说，守红线是责任，护安宁是追求，不退却是坚守。事故现场没有如果，只有后果，执法者能做的就是把功夫下在平时，把隐患挡在成灾之前。\n\n　　1985年出生的安文伟，2013年投身安定区安全生产监管，2019年转隶应急管理系统。其辖区危化品、烟花爆竹、工贸、建筑施工等高风险行业集中，安全监管压力大。在她看来，应急执法不是坐在办公室翻看台账，更不是简单开罚单，而是严管与帮扶并举，既要守住不可逾越的安全红线，也要带着温度化解民众急难愁盼。\n\n　　“13年里，317件信访连着一个个家庭的难处，141起处罚案件守着一条不能破的安全红线。”安文伟说，应急人的分量，不在急上，在责上。\n\n　　令她印象深刻的是，2021年春节前一起烟花爆竹爆燃事故。安定区一名民众家中办丧事时烟花倾覆爆炸，伤者眼部重伤，高额医疗费用让一家人陷入困境。接到求助后，安文伟和同事连夜奔赴深山事故现场，依托产品溯源线索联系生产厂家，通宵协商沟通，最终促成厂家赶赴定西，全额承担伤者治疗及后续赔偿。\n\n图为安定区称钩驿镇马铃薯万亩示范片带犹如大地绿毯。(资料图) 易思耿 摄\n\n　　老人康复后上门回访的一幕，也让她更加笃定，执法有力度，帮扶更要有温度。\n\n　　在化解民众难题之外，安文伟把更多精力放在隐患源头治理上。安定区高原夏菜产业蓬勃发展，泡沫网套加工企业广泛分布，不少经营者对发泡原料正丁烷的爆炸风险认识不足，安全设施短板突出。2025年，她带队排查11家同类企业，查出隐患114条，其中重大隐患4条。\n\n　　面对风险隐患，安文伟采取柔性执法推动企业整改。当地一家企业违规堆放成品、未安装可燃气体报警装置。她没有一罚了之，反复上门说理普法，量身制定整改方案。不久，外地同类企业发生爆炸事故，该企业负责人专门致电致谢。经持续跟进，当地泡沫网套行业多年未发生生产安全事故。\n\n　　作为法学专业出身的执法人员，安文伟不满足于“会检查、会整改”。2025年，她代表甘肃出征第六届全国应急管理普法知识竞赛，白天苦练心肺复苏、高空索降、水域救援等实战内容，夜晚深耕法规题库，最终斩获全国一等奖，受到应急管理部等四部门通报表扬。\n\n图为航拍下的甘肃定西马铃薯种苗大棚。(资料图) 高莹 摄\n\n　　归来后，安文伟把集训所学转化为培训课程，带动全队同步锤炼法理功底与应急技能，凝聚执法合力。她给自己定下目标，在危险面前寸步不退，当民众需要时，要拉得出、冲得上、打得赢，用长久坚守守护民众生命安全底线。\n\n　　“事故现场没有如果，只有沉甸甸的后果。”安文伟坦言，应急人的底气，来自平日千锤百炼。(完)\n\n 【编辑:刘欢】",

          "body": "中新网哈尔滨11月18日电 (记者 刘锡菊)“仅用4个月，我就拿到新房钥匙和不动产权证，这种喜悦无法用语言表达。”18日，在黑龙江省首个自主更新原拆原建项目回搬交付现场，哈尔滨市居民崔艳滨如是说。\n\n哈尔滨市居民崔艳滨拿到不动产权证。王迎超 摄\n\n　　哈尔滨市道外区南和街112-1号老楼始建于20世纪30年代，共3层，楼龄近90年，屋内没有独立厨卫，长期存在冬冷漏雨、管线老化、下水道堵塞等问题。2023年，该建筑经专业机构鉴定为D级危房，居民全部避险迁出。在哈尔滨市、道外区，市住建、市资规等部门以及街道、社区协同推进下，15户居民全部签订委托代建协议，项目于今年7月启动拆除施工。\n\n　　经过近4个月紧张建设，项目代建单位龙江安装集团完成新楼建设。新建楼为4层成套住宅，总建筑面积约700平方米，每户配套独立厨卫，同步配齐排水、燃气、供热、电梯等基础设施。\n\n　　为保障居民办证便利，哈尔滨市不动产登记事务中心创新推出“建设单位统一代办、材料一次复用”专属服务模式，依托预告登记，把不动产登记流程前置嵌入交付环节，做到交房与产权登记同步办理、同步办结。\n\n　　“我第一个领到产权证，非常高兴，浑身都在抖。”回迁居民崔艳滨表示，脸上难掩喜悦之情。周围居民纷纷用镜头记录下这一充满喜悦时刻。当日，15户居民陆续领到新房钥匙，并现场办结不动产登记。\n\n　　“两分钟办证对我们来说也是一个奇迹，欢迎大家过年来我家吃饺子。”回迁居民侯女士表示，拿到钥匙后的第一件事情就是装修，争取在过年前搬进新居。\n\n黑龙江省首个自主更新原拆原建项目回搬交付现场。刘锡菊 摄\n\n　　新建的四层楼宇外立面延续原建筑的仿红砖色调，在一楼上方，“南和街”三个大字镶嵌在红砖墙上。整栋楼的玻璃窗干净透亮，每家的窗户上都贴上了印有“福满新居”和“乔迁之喜”的红色窗花，整栋建筑洋溢着乔迁之喜与浓浓的市井温情。\n\n　　“欢迎各位业主回家。”现场，物业负责人表示，该栋楼交付前的公共部分和各建设环节已逐项查验验收，每一户物业都建立了完善的房屋与设备档案，供热供水电梯消防巡检和应急预案已安排好。\n\n回迁居民开锁。刘锡菊 摄\n\n　　“你好，我是附近的居民，将来我们的楼房也可能进行自主更新原拆原建，我们能到你的新家参观一下吗？”一位市民询问刚领到钥匙的居民。\n\n　　据悉，南和街112-1号老楼住户不多，但遇到的难题却一点不少——公产房买断、不动产登记、产权归属、规划落地……自主更新原拆原建项目可能遇到的问题，这个项目几乎蹚了一遍。正因如此，也经常有居民和其他自主更新原拆原建项目团队到南和街来取经。\n\n　　自主更新原拆原建，让老地方“长”出新生活。哈尔滨市南和街112-1号的焕新实践，是该市危旧住房更新中“不迁走人、不拆散邻里”的治理探索——既把危旧住宅从“不能住”变为“住得安”，更让居民过上了“过得好”的新生活。(完)\n\n 【编辑:田博群】",

          "body": "中新网哈尔滨11月18日电 (韩雪)11月18日，黑龙江省委宣传部、省政府新闻办举行“开局起步‘十五五’奋力谱写中国式现代化黑龙江新篇章”系列主题新闻发布会，介绍高质量教育体系建设情况。\n\n发布会现场。石启立 摄\n\n　　黑龙江省教育厅党组成员、副厅长赵雅琴介绍，在高校学科调整与人才培养方面，黑龙江省围绕国家攻关领域和省内重点产业集群形成专业调整清单，调整学科专业点1600余个，重点建设10所高水平大学、141个优势特色学科、10个交叉中心，新增12个ESI前1%学科。黑龙江工程师学院第二届85名学生提前取得工程师职称。今年国家科学技术奖黑龙江14项获奖项目均来自高校，哈尔滨工程大学杨德森院士牵头项目获国家技术发明奖一等奖。\n\n　　25所高校与境外高校举办中外合作办学机构和项目61个，在海外建设30个“开物工坊”；建成16个省级中俄同类大学联盟集群，俄方成员高校800余所；哈尔滨市第六中学校牵头成立国家级中俄中学联盟。今年高校俄罗斯籍留学生人数同比增长超30%，黑龙江省举办“中俄教育年”主题活动近400项。\n\n　　黑龙江省委教育工委副书记程爽介绍，黑龙江省推行弹性学制、实践成果申请学位等改革，304名本科生提前衔接研究生课程，40名硕博研究生凭实践成果取得学位；3091所学校开设人工智能通识课，近300万名学生参与，上线“就业超市”匹配岗位信息154万余条。\n\n　　黑龙江省教育厅党组成员、副厅长慕海军介绍，黑龙江省提质升级学前教育学位3万个，学前一年免费教育惠及10万余名儿童；13.35万名中小学生招生入学“一网通办”，9.63万名随迁子女在公办学校就读并享同城待遇；“云帮扶”“数字支教”覆盖408所边境和农村学校，提质升级县中学位1.3万个。\n\n　　黑龙江省委教育工委常务副书记、省教育厅厅长许振宇表示，“十五五”时期将推进“国门学校”标准化建设，培养“专业+俄语”复合型人才，围绕现代农业、装备智造、能源、生态安全、向北开放、冰雪人才等领域建设特色教育高地。(完)\n\n 【编辑:田博群】",

          "summary": "中新网杭州11月18日电(林波)从社区门口的15分钟学习圈，到“杭学通”平台300万注册用户的学习轨迹；从青蓝夜校里年轻人的“充电+社交”，到银龄课堂上老年人的AI数字素养培训；从淳安山村里的公益送教课，到上城社区里的隔代教育沙龙……",

          "body": "中新网杭州11月18日电(林波)从社区门口的15分钟学习圈，到“杭学通”平台300万注册用户的学习轨迹；从青蓝夜校里年轻人的“充电+社交”，到银龄课堂上老年人的AI数字素养培训；从淳安山村里的公益送教课，到上城社区里的隔代教育沙龙……“让学习成为一种生活方式”这句话在杭州，并不仅仅是挂在墙上的口号。\n\n　　11月18日，杭州市人民政府新闻办公室联合杭州市教育局召开新闻发布会，介绍杭州市终身教育工作进展成效和2026年全民终身学习活动周(以下简称“学习周”)特色亮点。\n\n11月18日，新闻发布会现场一景。(杭州市教育局供图)\n\n　　学习周将于11月21日在杭州良渚文化艺术中心启动，将把这座城市绵延二十年的终身学习实践，浓缩成一场可看、可玩、可学的全民嘉年华。\n\n　　杭州是全球首批、全国首个加入联合国教科文组织全球学习型城市网络的城市，2024年又首批入选全国学习型城市网络。\n\n　　早在2002年，杭州便把学习型城市建设纳入城市发展战略，每五年一轮出台专项文件，迭代顶层设计。如今，纵向看，市、区县、乡镇、村社四级实体办学网络全面贯通，13个区、县(市)均建成独立法人社区学院；横向看，各类学习阵地超过5000个，学习场景嵌入社区、园区、景区，“城乡15分钟市民学习圈”加速成形。\n\n杭州青年在夜校学习拳击。(资料图，杭州市教育局供图)\n\n　　“一张网”托底，“一个码”增效。杭州市打造的终身学习公共服务平台“杭学通”，目前已实名注册用户300万人，入驻机构3800余个，累计组织学习活动21万场。平台提供“扫码即学”便捷服务，市民打开手机，扫码即可完成课程预约、签到、评价全流程闭环；利用AI学情模型，智能推送周边线下资源与适配课程，实现千人千面的个性化供给，尤其为老年群体降低了数字门槛。\n\n　　学习不只发生在课堂，更贯穿人的一生。\n\n杭州市西湖区手机AI创意进课堂一景。(资料图，杭州市教育局供图)\n\n　　面向老年人，杭州在提前实现全市乡镇(街道)老年学校全覆盖的基础上，累计建成32所省级老年教育优质校，推动“老有所学”从阵地建设转向内涵提质；“社区共学养老”实践模式入选国家级终身学习品牌项目，为全国老年教育与养老融合发展提供了杭州样本。\n\n　　面向中青年，杭州用好共富夜校、青蓝夜校等载体，推广“课程+社交+实践”三位一体教学，构建15分钟青年文化生活圈，回应“充电+社交”的双重需求。面向亲子家庭，杭州全市建成社区家长学校、家庭教育指导服务站点3449个，开发亲子沟通、隔代教育等市级课程，组建家庭教育讲师团，把家庭教育指导送到家门口。\n\n　　面向新市民、新农人、特需青少年等群体，杭州依托“双证制”教育、退役职通车、萤火学苑等项目重点开展技能提升培训，守好普惠底线，助力共同富裕。\n\n　　本届学习周，是这些成果的集中亮相。活动周由杭州市教育局、杭州市委老干部局等七部门联合主办，主题是“让学习成为一种生活方式——数智赋能学习·文脉点亮成长”，现场布设全民阅读、技能提升、非遗传承、数智赋能、银龄教育、健康生活、共同富裕、开放学习等八大主题展区。其中，数智赋能展区以“AI智学·慧享终身”为题，市民可体验AI机器人、智能学习设备与青少年科创成果；银龄展区则安排节目展演、银龄电竞与益智互动，诠释“银发乐学”的时代内涵。(完)\n\n 【编辑:田博群】",

          "body": "中新网哈尔滨11月19日电 (记者 王琳)11月18日，哈尔滨市亚布力管理委员会举办亚布力冰雪季新闻发布会，围绕新雪季的滑雪产品、赛事活动、度假场景、服务保障等亮点举措集中推介，重点培育冰雪夜经济。\n\n11月18日，哈尔滨市亚布力管理委员会举办亚布力冰雪季新闻发布会。　杨思颖 摄\n\n　　会上发布了亚布力滑雪旅游度假区2026—2027雪季的全新业态、服务安排及“三山联网”运营成效，展现“这么早，那么晚，龙江滑雪任你选”的资源优势，持续擦亮哈尔滨冰雪季品牌。\n\n　　哈尔滨市亚布力管理委员会文化旅游管理处处长吴丹介绍，亚布力滑雪旅游度假区的新业态、新场景集中亮相，为冰雪消费注入全新活力，今冬将积极培育夜间消费，做强温泉、夜间演艺、山地酒吧等多元场景，拉长游客停留消费链条。\n\n11月18日，游客在亚布力阳光度假村体验滑雪运动。　杨思颖 摄\n\n　　亚布力阳光度假村新媒体运营官杜冰玉介绍，多家连锁品牌入驻度假村，餐点全天供应；酒店内新增轻奢下午茶、酒廊、午夜粥铺等业态，度假村内配有酒吧、健身房等供游客休闲娱乐，实现“白天滑雪、日间休闲、夜间社交”全时段闭环。\n\n　　亚布力旅游投资集团有限公司副总经理刘广鹏介绍，服务升级的核心方向是暖心细节，深化“有温度的亚布力”服务品牌。在夜间保障方面，增设4至6台自动售餐机，解决夜间闭店后用餐需求。\n\n11月18日，大熊猫在亚布力熊猫馆吃竹子。　杨思颖 摄\n\n　　亚布力森林温泉酒店总经理吴辉介绍，依托亚布力顶级滑雪资源，酒店成功打造“白天激情滑雪、夜晚温泉康养”的成熟度假闭环。滑雪释放活力，温泉舒缓身心，动静结合、冷暖相宜，构建出完整、高品质的冰雪度假体验体系。(完)\n\n 【编辑:何颖】",

          "body": "一、Anthropic：AI赛道的“超级抽血机”来了\n本周，全球科技圈和资本市场都在屏息等待一件事——大模型巨头 Anthropic 正式登陆纳斯达克。作为史上规模最大的IPO之一，这次发行高达8.25亿股，定价区间在70至78美元，募资体量极其惊人。\n每当这种级别的巨无霸上市，市场的第一反应往往不是狂欢，而是对流动性的恐慌。在资金总量有限的情况下，机构为了腾出仓位认购新巨头，必然会抛售手中的存量科技股。这也为近期科技板块的剧烈震荡埋下了伏笔。\n二、市场复盘：英伟达业绩炸裂，为何科技股反而大跌？\n很多投资者看着盘面感到困惑：就在刚刚发布的英伟达最新财报中，数据中心营收同比增长高达110%（达到1,076亿美元），下一季度的营收指引更是达到了惊人的1,300亿美元，远远甩开市场预期。\n单看基本面，AI算力需求不仅没有丝毫放缓，订单反而依然旺盛。那为什么美股科技股此前却提前经历了一轮大跌？\n核心原因只有一句话：资本市场交易的从来不是已经兑现的业绩，而是对未来的预期。\n在亮眼的财报数据之下，华尔街正在为四个深层的不确定性重新定价：\n对AI资本开支可持续性的担忧：下游科技巨头们真金白银砸了上千亿美元买芯片，但市场开始疑惑：这种疯狂的资本开支还能持续几个季度？如果终端应用迟迟跑不出对等的商业变现，算力采购的拐点随时可能出现。\n高估值的脆弱性：过去两年AI概念被极致演绎，科技股估值普遍处于历史高位。在“预期打满”的状态下，任何风吹草动都会触发资金的获利了结，高估值本身就是最大的风险。\n核心管理层变动的冲击：随着黄仁勋卸任CEO、临时管理层接棒，尽管公司强调技术路线图照常推进，但失去灵魂人物掌舵带来的治理不确定性，依然让部分机构选择避险为上。\n三、重定价：新一轮资本融资如何重塑AI估值？\nAnthropic 的上市，标志着AI产业正式从“一级市场讲故事”迈入“二级市场算总账”的残酷阶段。\n大模型不再稀缺，盈利能力成试金石：Anthropic 招股书里写满了风险提示，即便模型能力处于第一梯队，它依然是一个极其烧钱、尚未建立稳定持续盈利路径的重资产业务。上市后，它的每一个季度财报都会被放在显微镜下审视。\n估值锚点重构：今年6月 SpaceX 上市后也曾经历过破发和剧烈波动。如果 Anthropic 上市后表现不及预期，或者出现“上市即巅峰”的走势，整个AI应用层乃至算力层的估值中枢都会被向下重定价。资本市场将不再为单纯的“参数规模”买单，而是只为“自由现金流”和“商业闭环”买单。\n四、破局：泡沫暗涌之下，普通人该如何调整账户？\n当高估值科技股进入高波动、高分化的“深水区”，普通投资者如果还把所有筹码押在单一科技赛道上，无异于在惊涛骇浪中走钢丝。\n在这个节骨眼上，“哑铃策略”依然是最稳妥的解法——一端保留少量看好的硬核科技底仓，另一端则必须加大高股息、低波动的防御性资产配置，用确定的分红现金流来对冲科技泡沫破裂的风险。\n为什么现阶段建议重点关注红利资产？\n抗跌属性强：在市场风险偏好下降、资金从高估值成长股撤离时，具备稳定盈利和持续分红能力的企业往往成为资金青睐的对象。\n穿越周期的复利：不管AI技术路线怎么迭代、哪家大模型最终胜出，水电煤、银行、交运等关系国计民生的基础行业依然在源源不断地产生现金流。\n红利低波ETF天弘（159549）——紧密跟踪红利低波100指数\n红利低波ETF天弘（159549）通过紧密跟踪红利低波100指数，聚焦银行、医药生物、交通运输等具备稳健盈利与强现金流的行业，剔除了高波动杂质，将低波特征与分红意愿结合。\n从指数编制情况来看，红利低波100从A股中选取100只流动性好、连续分红、股息率高且波动率低的股票，有四个亮点值得关注：\n•双因子筛选，规避“红利陷阱”：只看股息率，容易买入因股价暴跌而“被动高息”的公司；叠加低波动筛选，更聚焦经营稳定、分红可持续的企业。\n•股息率/波动率加权：股息率越高、波动越低，权重越大；股价下跌推高股息率时，权重随之上调，形成“越便宜越多买”的再平衡。\n•每季度调样：比年度调样更及时地剔除股息率下滑或波动放大的个股。\n•行业分散：单一二级行业权重上限20%。\n●作为标准化的资产配置工具，在AI泡沫加剧的当前市场环境，红利低波ETF天弘（159549）仍具有较高的配置价值，适合作为投资者“哑铃策略”的一端。\n风险提示：成份股仅为客观展示，不代表个股推荐。本文观点不构成任何投资建议，市场有风险，投资需谨慎，指数基金存在跟踪误差，请投资人独立判断和决策。数据来源：wind。\n往期精选：\n《岁末年初险资避险需求提升，红利低波ETF天弘(159549)资产配置工具属性凸现》\nhttps://www.ji           "body": "朋友们，又到了“收租”的日子。\n三只月月分红的ETF——港股红利低波ETF招商（520550）、800现金流ETF招商（159119）、红利质量ETF招商（159209）——2026年第十次月度分红，已经陆续到账了。\n\n有多准时？港股红利低波自成立以来连续分了19次，红利质量连续17次，800现金流连续10次。每个月到点就发，比工资还靠谱。\n而且费率也低，管理费只有0.15%/年，全市场最低档。\n但今天想聊的不是分红本身，而是一个更实在的问题：\n这笔钱到账之后，你打算怎么花？\n先搞清楚，这三只ETF分别是什么角色？\n港股红利低波ETF招商（520550）——深度价值型。 买的是港股里高股息、低波动的公司，金融、公用事业为主，股息率近6%，市净率才0.73倍。说白了，就是一群“稳稳收租”的资产。\n800现金流ETF招商（159119）——核心底仓型。 选的是全市场自由现金流最充沛的50家公司，赚的都是真金白银。现在净值还在1块钱以下，相当于打折买“现金奶牛”。\n红利质量ETF招商（159209）——价值成长型。 高股息+高质量双筛，ROE近20%、股息率超4%，不含银行股。在红利家族里，它属于“能打”的那个。\n好了，现在钱到账了，无非两个选择：\n第一条路：花掉。\n这没什么不好意思的。分红本来就是给你花的。每月多一笔现金流，补贴家用、还房贷、带孩子吃顿好的，都行。\n三只ETF都是现金分红模式，钱直接打到你的银行账户。按中等仓位算，年化现金流回报大概3%-4%，比存银行强不少。分红金额会随市场波动，不是固定的，但每个月都有，这种“被钱叫醒”的感觉，挺踏实。\n第二条路：滚进去。\n如果你现在不急着用钱，那分红再投，可能是更聪明的选择。\n为什么？因为这三只ETF现在都处于回撤期。回撤的时候分红再投，等于在低位捡份额。等市场回升，这些低位积累的份额会帮你赚更多。\n但再投不是无脑“原路返回”，可以讲点策略：\n800现金流ETF（159119） 现在净值不到1块，折价最明显，再投性价比最高，优先考虑。\n红利质量ETF（159209） 长期回报最好，ROE也高，适合定投式加仓。\n港股红利低波ETF（520550） 估值压得很低，但港股拐点还不明朗，分红可以先放货币基金，等趋势清楚了再进去。\n所以怎么选？\n问自己一句话就行：这笔钱，我现在需要花吗？\n需要，就花掉。分红本来就是设计来给你提供现金流的，别觉得“花了就是亏了”。\n不需要，就滚进去。现在回撤期，每一分再投都是在低位攒筹码。\n最后说一句：\n每月分红到账，不只是收钱，更是一次提醒——提醒你检查一下自己的组合，看看哪块该补，哪块该等。\n分红不是终点，而是下一次决策的起点。\n这笔钱，你打算怎么花？欢迎聊聊。\n来源：搞钱小达人\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n又“被钱叫醒”了！比工资还准时！这笔钱怎么花？\n\n三只月月分红的ETF——港股红利低波ETF招商（520550）、800现金流ETF招商（159119）、红利质量ETF招商（159209）——2026年第十次月度分红，已经陆续到账了。\n\n原创新闻有连云 · 2026/11/19 09:07来源：界面新闻\n\n朋友们，又到了“收租”的日子。\n三只月月分红的ETF——港股红利低波ETF招商（520550）、800现金流ETF招商（159119）、红利质量ETF招商（159209）——2026年第十次月度分红，已经陆续到账了。\n\n有多准时？港股红利低波自成立以来连续分了19次，红利质量连续17次，800现金流连续10次。每个月到点就发，比工资还靠谱。\n而且费率也低，管理费只有0.15%/年，全市场最低档。\n但今天想聊的不是分红本身，而是一个更实在的问题：\n这笔钱到账之后，你打算怎么花？\n先搞清楚，这三只ETF分别是什么角色？\n港股红利低波ETF招商（520550）——深度价值型。 买的是港股里高股息、低波动的公司，金融、公用事业为主，股息率近6%，市净率           "body": "核心摘要： 昨日A股窄幅震荡，沪指涨0.09%报3587.83点、创业板指涨0.85%，但万得全A跌0.18%，成交13801亿元、缩量875亿元刷新年内地量，缩量博弈下赚钱效应偏弱，多只宽基ETF尾盘再度放量。外部约束继续加码：美联储10月纪要显示几乎全体官员认为还需加息，市场对12月加息25个基点定价95%以上，且首次将AI投资热潮列为通胀与金融稳定双重隐患。产业端国产算力接过主线，腾讯Q3资本开支814亿元远超市场预估的554亿元、自由现金流-691亿元，说明国产算力投入仍在加速而非降速。本周最确定的增量来自首批18只主动ETF，11月23日上市前至少84亿元待建仓，风格呈\"红利筑底、算力增强\"。今日看点：Anthropic纳斯达克挂牌首日表现，以及英伟达停止对华供应H200后的国产替代定价。\n【宏观】\n• APEC工商领导人峰会在深圳举行：中方支持成立\"世界湾区经济合作联盟\"，全面落实制造业准入又准营、稳步扩大服务业开放\n• 美联储10月纪要偏鹰：以10比2维持利率不变，几乎所有与会者认为进一步加息合适，两人提及12月可加息超25个基点，市场对12月加息25个基点定价95%-96.8%\n• 纪要首提AI双重风险：首次将AI投资热潮同时列为通胀上行风险与金融稳定隐患，指AI相关债务通过不透明结构快速累积；理事沃勒称若不释放1月加息信号，应在12月一次加息50个基点\n• 两则\"小作文\"同日辟谣：\"国常会表态不再频繁救市\"经核查系编造会议内容；证监会明确否认\"要求基金公司上报全部产品AI敞口\"\n• 海外通胀与地产压力延续：美国10月成屋签约销售指数跌4.7%至63，为2001年有记录以来最低；英国10月CPI同比涨3.6%，创一年新高\n相关ETF：A500ETF560610、上证增强ETF563930、纳指100ETF159659\n【金融 / 资本市场】\n• 首批主动ETF进入上市倒计时：18只产品11月23日集中上市，目前持股票资产约204亿元，按80%仓位下限测算上市前至少84亿元待入市\n• 长线资金借道ETF持续入场：9月28日以来股票型ETF净流入超6100亿元，企业年金、保险及产业资本密集现身新成立ETF前十大持有人名单\n相关ETF：价值主动ETF招商\n【AI / 算力】\n• 腾讯Q3资本开支大超预期：单季资本开支814亿元、远超预估554亿元，自由现金流-691亿元；云服务收入增长35%，调整后净利润降6%，管理层称现金资本开支已处峰值\n• 算力限制影响显性化：腾讯总裁刘炽平称新版本混元模型推出或需更长时间；英伟达临时CEO称将停止向中国供应H200芯片，外交部回应已多次阐明原则立场\n• AI融资规模预期上调：高盛将2027年全球AI项目融资从3000亿美元上调至5450亿美元，其中2250亿投数据中心建筑、3200亿投GPU等算力\n• 泡沫警示与逆势扩表并存：SEC前主席根斯勒称AI泡沫或在2028年大选前破裂、算力租赁云商面临\"崩溃破产\"；三星则称高负债新云商份额仅约8%，风险可控\n• Anthropic今日纳斯达克挂牌：定价83美元/股，机构认购约4000亿美元、散户近1000亿美元，代码\"ANT\"，为A股算力链提供外部定价参照\n相关ETF：云计算ETF159890、创业板人工智能ETF159243、软件ETF159899\n【半导体 / 设备】\n• BIS新规下的替代顺序：先看国内流片敞口大的昇腾链、寒武纪、壁仞，再看承接转产的国内晶圆厂与封测，最后是高端设备自主\n• 设备支出预期上修：伯恩斯坦预计2027年中国大陆以外区域设备开支增幅高达44%，国产设备与封测的转产承接同步受益\n• 存储成为采购主驱动：英伟达采购承诺环比增加约1000亿美元，主要由内存驱动，管理层预计2027年内存价格高于2026年\n• 对华出货再收紧：英伟达不再向中国出货此前已获许可的Hopper数据中心芯片，国产卡替代窗口进一步打开\n相关ETF：半导体设备ETF561980、科创芯片设计ETF589390\n【消费电子】\n• 英伟达切入AI PC：RTX Spark平台紧凑型桌面电脑上市，搭载20核Grace CPU与Blackwell架构RTX GPU，最高128GB统一内存、1 Petaflop算力，可本地运行1200亿参数大模型\n相关ETF：消费电子ETF159779\n【地缘 & 能源】\n• 美伊进入新一轮交火：伊朗袭击巴林、科威特美军基地及波斯湾油轮，美军空袭格什姆岛导弹阵地并集结三艘航母，特朗普称不需要与伊朗达成协议\n• 地缘溢价让位于供应过剩：美油主力跌3.65%报82.87美元/桶、布油跌1.83%           "body": "截至2026年11月18日 15:00，公司债ETF平安(511030)最新规模达450.14亿元。（数据来源：Wind）\n资金流入方面，公司债ETF平安近23个交易日内，合计“吸金”4.27亿元。（数据来源：Wind）\n数据显示，杠杆资金持续布局中。公司债ETF平安最新融资买入额达1741.19万元，最新融资余额达2189.19万元。（数据来源：Wind）\n截至11月18日，公司债ETF平安近5年净值上涨10.89%。\n截至2026年11月13日，公司债ETF平安近1年夏普比率为1.44。\n回撤方面，截至2026年11月18日，公司债ETF平安今年以来最大回撤0.33%，相对基准回撤0.07%。\n费率方面，公司债ETF平安管理费率为0.15%，托管费率为0.05%。\n跟踪精度方面，截至2026年11月18日，公司债ETF平安今年以来跟踪误差为0.010%。\n公司债ETF平安(511030)紧密跟踪中债-中高等级公司债利差因子指数(总值)净价指数，为多角度反映人民币债券市场的走势，该指数以主体和债项评级AAA的上交所公司债为基础，按照中债市场隐含评级分为三组并以利差因子进行细分，可作为投资中高等级公司债的业绩比较基准和投资标的。中债-中高等级公司债利差因子指数的财富指数代码为CBC00701，基期为2015年6月30日，基点值为100，包含待偿期分段子指数，每季度第一个银行间市场工作日调整指数成分券。\n风险提示：基金有风险，投资需谨慎。基金管理人承诺以诚实信用、勤勉尽责的原则管理和运用基金资产，但不保证本基金一定盈利，也不保证最低收益。基金管理人提醒投资人基金投资的“买者自负”原则，在做出投资决策后，基金运营状况与基金净值变化引致的投资风险，由投资人自行负担。基金的过往业绩及其净值高低并不预示其未来业绩表现，基金管理人管理的其他基金的业绩不构成对本基金业绩表现的保证。投资人购买基金，既可能按其持有份额分享基金投资所产生的收益，也可能承担基金投资所带来的损失。投资人应当认真阅读《基金合同》《招募说明书》等基金法律文件，全面认识本基金的风险收益特征和产品特性，并根据自身的投资目的、投资期限、投资经验、资产状况等判断基金是否和投资人的风险承受能力相适应，理性判断市场，谨慎做出投资决策。本材料中相关信息来源于基金管理人认为可靠的公开资料，相关观点、评估和预测仅反映当前的判断，后续可能有所变化。本材料所含任何市场观点的内容皆基于相应的假设条件，而任何假设条件都可能随时发生变化。基金管理人不承诺、不保证任何具有预测性质的市场观点必然得以实现。材料中提及的个股不构成投资推荐或建议。ETF基金的二级市场涨跌幅不代表基金实际收益率，请投资者关注场内价格波动风险。\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n公司债ETF平安(511030)近23个交易日净流入4.27亿元，近5年净值上涨10.89%\n\n截至2026年11月18日 15:00，公司债ETF平安(511030)最新规模达450.14亿元。\n\n原创新闻有连云 · 2026/11/19 09:06来源：界面新闻\n\n截至2026年11月18日 15:00，公司债ETF平安(511030)最新规模达450.14亿元。（数据来源：Wind）\n资金流入方面，公司债ETF平安近23个交易日内，合计“吸金”4.27亿元。（数据来源：Wind）\n数据显示，杠杆资金持续布局中。公司债ETF平安最新融资买入额达1741.19万元，最新融资余额达2189.19万元。（数据来源：Wind）\n截至11月18日，公司债ETF平安近5年净值上涨10.89%。\n截至2026年11月13日，公司债ETF平安近1年夏普比率为1.44。\n回撤方面，截至2026年11月18日，公司债ETF平安今年以来最大回撤0.33%，相对基准回撤0.07%。\n费率方面，公司债ETF平安管理费率为0.15%，托管费率为0.05%。\n跟踪精度方面，截至2026年11月18日，公司债ETF平安今年以来           "summary_short": "文｜青橙财经 青沐  编辑｜六子  扫地机器人行业，正在迎来新一轮深度大洗牌。",

          "points": [

            "“扫地机双雄”科沃斯和石头科技相继发布2026年三季报，两家公司的营收均保持增长…",
            "IDC数据显示，2026年第二季度，全球扫地机市场出货788.5万台…"
          ],

          "published_at": "2026-11-19T09:03:38+08:00",
          "size": 1,
