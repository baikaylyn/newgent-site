共商亚太合作；会场外，东道主中国又摆开一张张桌子。谁与谁会晤、谈些什么，由各方自行安排。谈成与否，话总要先接上。\n\n　　17日，加拿大总理卡尼与墨西哥总统辛鲍姆会面。两国重申续签《美国-墨西哥-加拿大协定》的承诺，还谈到加强关键矿产、能源、先进制造等领域合作。\r\n\n　　18日，卡尼与美国总统特朗普会面，讨论一项互利贸易协议，涉及就业以及加拿大的语言、文化和主权等问题。两国同意继续保持密切沟通。\n\n　　同日，辛鲍姆在深圳与特朗普见面后表示，双方在共同议程上继续取得进展。据悉，两国当前正推进旨在缓解贸易紧张的谈判。\n\n　　也是在同一天，俄罗斯总统普京同泰国总理阿努廷举行会谈，谈及双边关系、贸易增长以及在能源、交通、农业等领域的合作。\n\n　　在多边场合开展双边外交是国际惯例。多边会议提供场合，双边会见处理具体问题。这样的场景，在中国主办的多边会议上已属常见。\n\n　　2018年上合组织青岛峰会期间，吉尔吉斯斯坦与塔吉克斯坦两国总统举行会谈，聚焦两国边界划界和地区安全。两个中亚国家，借一次峰会，把争议多年的边界划界问题再次摆上桌面。\n\n　　2025年，普京与印度总理莫迪在上合组织天津峰会期间举行会晤，讨论双边关系以及乌克兰问题。值得注意的是，两人是在同一辆车上交谈了近一小时。一次不那么正式的见面，讨论的仍然是事关地区乃至世界局势的重要议题。\n\n　　密集的场边对话，往往是为了解开具体领域的“结”。多边共识定方向，双边沟通理脉络，亚太合作的纽带正是在这一次次接触中被不断拉紧。\n\n　　从欧洲国家领导人在第三届“一带一路”国际合作高峰论坛期间磋商，到各国经贸官员在上海进博会的展场内外对接合作，中国主办的多边会议和大型活动，正日益成为各方开展场边外交的公共平台。\n\n　　深圳这几天，这么多场重要会见密集进行，正是因为各方相信中国提供的这张桌子可用、可靠：氛围融洽，不预设议程，不居中干涉，来了就能坐下谈。\n\n　　而桌子周围，又有着广阔的市场、实在的机遇以及可预期的合作环境。\n\n　　会议有会期，对话无终点。只要各方愿意坐到一起，交流的窗口就会一直敞开。愿意坐下来的人，也总会在中国找到一张合适的桌子。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）深圳APEC“摆桌”促对话：场边外交密集进行","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734912.shtml","source_display":"中新網 時政","published_at":"2026-11-19T21:15:03+08:00","category":"內地","digest":"题：深圳APEC“摆桌”促对话：场边外交密集进行  　　中新社记者 张焕迪  　　亚…"},{"title":"（深圳APEC）深圳APEC：一场中国式现代化的“现场说明会”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734636.shtml","source_display":"中新網 時政","published_at":"2026-11-19T15:36:08+08:00","category":"內地","digest":"题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉…"}],"cross":{"total":2,"angles":[{"point":"题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734636.shtml"},{"point":"题：深圳APEC“摆桌”促对话：场边外交密集进行  　　中新社记者 张焕迪  　　亚…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734912.shtml"}]}},{"id":"c66a11bd409","title":"习近平：三国会晤播下的种子必将生根发芽、开花结果","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734863.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，总结此次会晤达成的主要共识。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤…","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","习近平指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的…","我们都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:50:40+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，总结此次会晤达成的主要共识。\n\n　　习近平指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的，三国在维护世界和平上看法是一致的。我们都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平。我们都同意大国应该重视各国合理安全关切。我们都主张对话谈判是化解分歧的正确选择。只要对话不停止、大门不关上，和平就有希望。我们都认为合作是应对挑战的必由之路，要基于共同利益加强合作，以合作促和平、谋共赢。今天三国会晤播下的种子，必将生根发芽、开花结果。中俄美三国要落实好会晤共识，继续加强沟通，以对话聚共识，以担当迎挑战，以合作促和平，共同推动建设一个更加美好的世界。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平：三国会晤播下的种子必将生根发芽、开花结果","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734863.shtml","source_display":"中新網 時政","published_at":"2026-11-19T19:50:40+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平：三国会晤播下的种子必将生根发芽、开花结果","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734825.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:59:09+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"cd69632d3e3","title":"（深圳APEC）彭丽媛同亚太经合组织经济体领导人或代表配偶参观“岭南非遗传承与创新”主题展","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734850.shtml","summary":"中新社深圳11月19日电 11月19日上午，中国国家主席习近平夫人彭丽媛同出席亚太经合组织第三十三次领导人非正式会议的经济体领导人或代表配偶在深圳湾文化广场举行集体活动。","summary_short":"中新社深圳11月19日电 11月19日上午，中国国家主席习近平夫人彭丽媛同出席亚太经合组织第三十三次领导人非正式会议的经…","digest":"11月19日上午…","points":["中新社深圳11月19日电 11月19日上午，中国国家主席习近平夫人彭丽媛同出席亚太经合组织第…","彭丽媛热情迎接来宾并同她们合影","孩子们以喜庆热烈的醒狮和英歌舞欢迎嘉宾们的到来"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:29:01+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日上午，中国国家主席习近平夫人彭丽媛同出席亚太经合组织第三十三次领导人非正式会议的经济体领导人或代表配偶在深圳湾文化广场举行集体活动。\n\n　　彭丽媛热情迎接来宾并同她们合影。孩子们以喜庆热烈的醒狮和英歌舞欢迎嘉宾们的到来。彭丽媛邀请来宾参观“岭南非遗传承与创新”主题展。大家兴致盎然，不时驻足观看精美的非遗工艺品，共同欣赏岭南特色小型文艺展示，体验数字化骑楼街景。\n\n　　彭丽媛同来宾们亲切交流，表示岭南文化是中华文化重要支脉，展现了人与自然和合共生的智慧，中方愿同各方加强文化交流互鉴。来宾们对中华传统文化悠久历史和深厚底蕴赞不绝口，对中国式现代化发展成就深表钦佩，期待同中方深化交流合作。\n\n　　参观结束时，彭丽媛同来宾们合影留念并亲切道别。\n\n　　智利总统夫人阿德里亚索拉，韩国总统夫人金惠景，菲律宾总统夫人丽莎，越共中央总书记、国家主席夫人吴芳璃，新加坡总理夫人吕子蕊，泰国总理夫人塔娜侬，中国台北经济领导人代表夫人叶紫华等参加上述活动。(完) 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）彭丽媛同亚太经合组织经济体领导人或代表配偶参观“岭南非遗传承与创新”主题展","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734850.shtml","source_display":"中新網 時政","published_at":"2026-11-19T19:29:01+08:00","category":"內地","digest":"11月19日上午…"},{"title":"彭丽媛同亚太经合组织经济体领导人或代表配偶参观“岭南非遗传承与创新”主题展","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734812.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:56:41+08:00","category":"內地","digest":"11月19日上午…"}]},{"id":"c1e298881f0","title":"习近平：大国良性互动不是选择题，而是必答题","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734792.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","习近平指出，当今世界早已不是彼此隔绝的孤岛","人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T18:14:15+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。\n\n　　习近平指出，当今世界早已不是彼此隔绝的孤岛。人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体。在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。近年来，中国推进中俄新时代全面战略协作伙伴关系，积极构建中美建设性战略稳定关系，推动形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。当前，世界百年变局加速演进，天下并不太平。风雨见担当。作为世界主要大国和联合国安理会常任理事国，中俄美应该当好表率，合作应对全球性挑战，共同维护世界和平稳定，为人类进步作出更大贡献。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平：大国良性互动不是选择题，而是必答题","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734792.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:14:15+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平：大国良性互动不是选择题，而是必答题","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734714.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:43:00+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"c03b73816a5","title":"习近平：大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734790.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","习近平指出，和平是人类社会的永恒期盼","我们这个星球曾爆发过1万多次战争，两次世界大战更是给人类社会造成空前浩劫…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T18:13:29+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。\n\n　　习近平指出，和平是人类社会的永恒期盼。我们这个星球曾爆发过1万多次战争，两次世界大战更是给人类社会造成空前浩劫，当下世界上仍有60多场地区冲突延宕不止。历史告诉我们：大国和，则世界安；大国斗，则世界乱。80多年前，作为世界反法西斯的中坚力量，中俄美三国并肩奋战，取得伟大胜利，为世界赢得和平和安宁。历史是最好的教科书。我们要铭记历史，以史为鉴，开创未来。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平：大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734790.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:13:29+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平：大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734712.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:41:10+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"ca9a0a4d01b","title":"【深圳APEC】融合四项非遗技艺 多处细节传递东方智慧 APEC围巾竟藏如此巧思","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-19/news1075513.shtml","summary":"11月19日，APEC各经济体领导人、代表合拍“全家福”。","summary_short":"11月19日，APEC各经济体领导人、代表合拍“全家福”。","digest":"11月19日，APEC各经济体领导人、代表合拍“全家福”","points":["11月19日，APEC各经济体领导人、代表合拍“全家福”","大家佩戴的红色、蓝色围巾，深深吸引了人们的目光","围巾主要设计方、苏州上久楷丝绸科技文化有限公司董事长吴建华受访时表示…"],"section":"內地","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T23:05:31+08:00","size":1,"keywords":[],"body":"11月19日，APEC各经济体领导人、代表合拍“全家福”。大家佩戴的红色、蓝色围巾，深深吸引了人们的目光。\n\n围巾主要设计方、苏州上久楷丝绸科技文化有限公司董事长吴建华受访时表示，两款名为“同心合锦”的围巾分别以宋锦、香云纱为面料，均为100%桑蚕丝，采用藏蓝和“故宫红”两种颜色。围巾融合四项非遗技艺，多处细节传递出东方智慧。 (记者 葛勇 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/9EE357CBF5804E3F91C516E4DDCAC26E.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2b581afe38","title":"亚太经合组织互联互通蓝图","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734972.shtml","summary":"新华社深圳11月19日电  　亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长…","summary_short":"新华社深圳11月19日电  　亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务、资金和人员流动…","digest":"亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务…","points":["新华社深圳11月19日电","我们强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长","我们以《2040年亚太经合组织布特拉加亚愿景》为指引，朝着建设开放、活力、强韧…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:51:24+08:00","size":1,"keywords":[],"body":"新华社深圳11月19日电\n\n　亚太经合组织互联互通蓝图\n\n　　我们强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长；我们以《2040年亚太经合组织布特拉加亚愿景》为指引，朝着建设开放、活力、强韧、和平的亚太共同体迈进，实现亚太人民和子孙后代的共同繁荣。\n\n　　我们肯定《亚太经合组织互联互通蓝图(2015-2025)》十年来为推进互联互通合作发挥的作用。新兴趋势和不断演变的需求正在重塑本地区互联互通格局。我们鼓励各经济体继续努力，朝着实现无缝、全面联通和融合亚太的远景目标迈进。\r\n\n　　支柱一：硬联通\n\n　　目标：鼓励各经济体通过创新和应用现代技术建设、维护并升级高质量基础设施，提升硬联通水平。\n\n　　加强陆上、海上、航空互联互通，通过交通联接提升区域互联互通水平。\n\n　　推动交通运输领域创新与数字化转型，探索安全可靠的自动驾驶、无人技术等新兴出行解决方案，开展自愿知识交流，分享相关经验和良好实践，以提升对新兴技术的适应能力。\n\n　　推动海运、航空和多式联运安全高效运行，便利人员和货物流动。\n\n　　在可行且互利的前提下，推进能源基础设施互联互通，促进能源运输与贸易，增强关键能源基础设施和供应链的可靠性、安全性和韧性，维护能源安全，推动高质量能源普遍可及，同时促进技术创新。\n\n　　鼓励建设可靠、可扩展、可信赖、安全且有韧性的通信基础设施；向农村及偏远地区拓展可接入网络，提升全民数字服务可及性；鼓励合作，为包括低地球轨道卫星在内的下一代互联互通技术和服务营造有利环境；升级数字基础设施，以更高能效和资源利用效率满足不断增长的需求；推动现有基础设施数字化，提高运营效率与服务供给能力。\n\n　　构建全生态协同模式，调动公共部门、私营部门和多边开发银行资源，识别并弥合基础设施融资缺口。\n\n　　提升基础设施项目的规划和实施水平，纳入韧性措施、减灾事前投资和全周期成本考量。\n\n　　支柱二：软联通\n\n　　目标：鼓励各经济体减少制度性壁垒，促进贸易和投资，推动建立更加紧密的区域经济。\n\n　　通过技术与创新、边境机构合作、适当的查验、自动化风险管理以及简化通关手续，推动海关程序现代化。\n\n　　开展结构性改革，激发增长活力，降低不必要监管负担，营造有利且有竞争力的营商环境，继续推进《亚太经合组织强化和提升结构性改革议程(2026-2030)》和《亚太经合组织改善营商环境行动计划(第四期)》。\n\n　　鼓励在共同关心的领域深化技术标准交流与合作，肯定良好监管实践对提升透明度、可预见性和效率的价值。\n\n　　取消贸易投资领域“边境后”壁垒，简化相关程序，提升效率、营商便利度、生产率和竞争力。\n\n　　提升供应链互联互通水平，通过破解供应链堵点、增强韧性、提升运行效率、最大限度减少中断、强化价值链，包括依托《亚太经合组织供应链互联互通框架行动计划》等相关机制开展合作。\n\n　　发挥数字及其他新兴技术作用，促进贸易数字化。\n\n　　强化数据对经济增长和数字创新的支撑作用，鼓励采取措施促进数据流动，包括通过亚太经合组织跨境隐私规则体系，增进企业和消费者对数字交易的信任，同时确保数据保护、尊重隐私和知识产权。\n\n　　提升金融互联互通，促进区域资本流动，包括推动资本市场发展、基础设施融资和防范灾害风险融资。\n\n　　支柱三：心联通\n\n　　目标：通过促进商务人员流动，以及教育、旅游、人力资源开发和创新合作，加强惠及所有人的互联互通。\n\n　　促进商务人员流动，用好亚太经合组织商务旅行卡，鼓励商旅卡计划正式成员经济体接纳和使用亚太经合组织虚拟商务旅行卡。\n\n　　肯定应对非正常移民流动的重要性。\n\n　　加强教育、职业培训、技能提升等领域交流，探索科研人员流动，支持终身学习。\n\n　　支持社会各界参与数字经济合作，提升数字素养，让数字转型成果惠及全民，包括开展能力建设，出台提升数字素养与数字能力的政策，为劳动者全职业生涯提供技能提升和再培训机会。\n\n　　赋能中小微企业，助力其参与价值链，包括营造有利营商环境，提升其创新能力、发展能力与专业水平，取消繁琐和不必要的监管，推动非正规中小微企业向正规和全球经济转型。\n\n　　调动劳动力市场各方力量，扶持创业，创造更多经济机遇，促进高质量充分和生产性就业，加强终身学习，拓宽技能提升和再培训机会，保护工人权利，在不断变化的劳动世界中继续提升国际劳工标准。\n\n　　通过建设有韧性的就业和教育体系，强化劳动力需求与技能预测研判，塑造现代化人力资源开发，通过提升医疗服务可及性等扩大劳动力市场参与度，帮助劳动者应对人口结构变化。\n\n　　促进文化交流与旅游便利化，利用数字技术提升旅游业效率、能力与生产力。\n\n　　构建有竞争力的创新生态；鼓励根据双方同意的条件，自愿开展知识共享，增强地区创新能力与竞争力。\n\n　　实施\n\n　　鼓励各经济体根据各自情况通过亚太经合组织现有工作机制，进一步推进区域互联互通。也鼓励同相关利益攸关方开展跨机制协作。\n\n　　2027至2030年，高官将在每年某一次高官会上讨论本蓝图落实情况，旨在更加深入地讨论这一事项。请亚太经合组织秘书处在高官会上通报相关机制及下设机制采取的行动和举措，并鼓励各经济体报告进展。 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4b745663cb","title":"学者：中美建构建设性战略稳定关系 不支持“台独”表态具积极意义","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734968.shtml","summary":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出，相关对话反映出双方建构中美建设性战略稳定关系的积极意愿…","summary_short":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出…","digest":"围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出…","points":["中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述…","国家主席习近平19日在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普","习近平强调，在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:50:08+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出，相关对话反映出双方建构中美建设性战略稳定关系的积极意愿，美方表态释放出对台政策更趋审慎的信号。\r\n\n　　国家主席习近平19日在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。习近平强调，在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。特朗普明确表示，美国不支持“台独”。\n\n　　华侨大学客座研究员包承柯表示，习近平主席关于台湾问题的表述具有连续性。从今年5月中美元首北京会晤时强调“台湾问题是中美关系中最重要的问题”，到9月华盛顿会晤时表示“希望美方坚持反对‘台独’的正确立场”，再到此次深圳会晤强调“美方要坚持做正确的事”，可以看出，台湾问题始终是影响中美建设性战略稳定关系的重要因素。\n\n　　“‘坚持做正确的事’与‘避免中美关系出现大的波折’构成了‘进’与‘稳’的辩证关系。”北京联合大学台湾研究院教授朱松岭指出，前者是积极进取的方向，指明双方应该朝哪里走、多做加法；后者是审慎务实的底线，明确双方不能跨越的边界。他说，这显现出中国在大国关系与对外交往中的战略定力与底线思维。\n\n　　对于特朗普此次明确表示不支持“台独”，清华大学战略与安全研究中心副研究员孙成昊认为，这一表态具有积极意义，有助于降低“台独”势力误判形势的风险。\n\n　　包承柯认为，特朗普此次表态较此前“不想跨越9500英里打一场战争”等说法更加清晰，是本届美国政府首次正式明确表达这一立场。\n\n　　包承柯分析，此次美方涉台表述的变化主要基于两个因素：一是中美两国领导人在一年内实现三次会晤，在互动中加深互信，促使美方在处理台湾问题时更加谨慎；二是从全球战略大局看，各方都有妥善处理潜在冲突、避免大国对抗的现实需求，台湾问题是其中一个潜在风险点，妥善处理这一问题，有助于维护中美关系稳定，避免风波发生。\n\n　　“接下来，更重要的是观察美方能否在对台军售、官方往来和军事活动等具体行动上体现这一承诺。”孙成昊说，美国能否保持言行一致、避免向“台独”释放错误信号，将是检验建设性战略稳定关系成效的一项重要标准。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c889fbd93e0","title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳宣言》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳宣言-升級亞太互聯互通持續更新","summary":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。","summary_short":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行","points":["今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行","國家主席習近平將主持會議並發表重要講話","國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","size":1,"keywords":[],"body":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間，先舉行中美雙邊會談，再跟俄羅斯總統普京在南山區麒麟山莊，首次出席備受矚目的三方會談。外交部表示，這是中俄美三國元首歷史上首次面對面會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。\n​​相關新聞：APEC 2026懶人包 21成員聚首深圳談甚麼？ 和我們息息相關？ 一文看清重點全解析\n本屆深圳APEC新增一場重頭戲：中美俄元首今日將舉行歷來首次三方會談，或觸及伊朗、烏克蘭等問題，俄方正推動會後發表聯合聲明。\n相關新聞：深圳APEC｜中美俄將展二戰後首次三方對話 學者：聚焦地區穩定不復刻強權外交︱分析\n內地分析人士對《星島》指出，在目前全球政經格局動盪之際，中美俄三國元首不但在深圳「同框」，而且將破天荒召開三方峰會；若北韓領袖金正恩也現身深圳，今次峰會將是APEC成立37年來「含金量最高」的一次會議。據了解，各方正醞釀推動達成《深圳宣言》。\n相關新聞：深圳APEC︱峰會今揭幕習近平發表講話 被譽史上「含金量最高」\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n11月19日最新消息\n\n相關新聞：深圳APEC︱中美俄元首麒麟山莊會晤登場 習近平：大國良性互動是必答題\n中國外交部長王毅將舉行記者會，介紹APEC領導人非正式會議成果。 陳俊豪攝\n王毅總結APEC會議成果\n22：10\n\n中國外交部長王毅將舉行記者會，介紹APEC領導人非正式會議成果。記者會原訂於晚上7時30分，大約6時許，大會通知記者會推遲至9時30分才舉行。由於傳媒希望能即時了解中方在APEC的總結，現場約200名中外記者即使經過連日採訪，面對疲倦的身軀仍然堅持等候。大約於10時許，外長王毅終於現身記者會。王毅一踏上講台，即向在場記者表示「讓大家久等了，各位辛苦了」，他解釋自己由於要從機場趕回，因而延遲，之後再作出APEC的總結。\n\n18：55\n新華社報道，國家主席習近平、俄羅斯總統普京、美國總統特朗普今日（19日）在深圳舉行會晤。三國元首就當前國際形勢深入交換了意見，致力於維護戰略穩定和國際安全，同時發表和平宣言。\n相關新聞：深圳APEC︱中俄美元首發表和平宣言 四大要點包括防止核擴散進行對話\n\n18：40\n\n美國總統特朗普離開深圳，外長王毅到機場送行。\n深圳APEC｜美國總統特朗普離開深圳。 路透社\n深圳APEC｜美國總統特朗普離開深圳。 路透社\n習近平：美國應在台灣問題上做對的事\n18：01\n中美俄閉門會議結束，歷時約一個半小時。央視報道，會晤結束後，特朗普、普京先後離開會晤現場。\n17：22\n\n習近平、特朗普、普京目前正在進行閉門會談。\n17：10\n習近平稱，核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n習近平強調，各國要尊重彼此主權和領土完整，尊重各自選擇的社會制度和發展道路，尊重彼此核心利益和重大關切。\n16：50\n美國總統特朗普表示，美中俄在討論核武問題上具有獨特的優勢。\n習近平說，「歷史告訴我們：大國和，則世界安﹔大國斗，則世界亂。」\n16：40\n習近平指出，人類同處「地球村」，大國肩負特殊責任，大國良性互動並非「選擇題」而是「必答題」。\n他強調，面對世界百年變局加速演進、天下並不太平，中俄美同為聯合國安理會常任理事國，應當好表率，合作應對全球性挑戰並共同維護世界和平穩定。\n16：30\n俄羅斯總統普京感謝中方積極組織今次三國元首會晤。他強調，中美俄三國同為第二次世界大戰戰勝國，對維護全球和平穩定負有特殊責任，並表示烏克蘭局勢將是今次會談的重點議題。\n16：28\n國家主席習近平在深圳同俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤。\n普京抵達現場。\n15：05\n根據現場消息，隨行記者獲告知，中國國家主席習近平、美國總統特朗普及其各自代表團目前正在共進午餐。\n截至下午3時剛過，這場午宴仍在進行中；而原本預定於下午2時30分舉行的習近平、特朗普與俄羅斯總統普京三方會晤，因此有所順延。\n14：55\n央視報道，中國國家主席習近平將在深圳與俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤。 \n14：40\n央視報道，中美峰會已經結束。\n14：20\n習近平稱，中美關係整體穩定且不斷改善，建構建設性的中美戰略穩定關係也是前所未有。他將與特朗普合作，確保中美關係繼續朝着既定方向發展。\n特朗普則稱呼習近平為「我的朋友」，指雙方有非常特別的關係，只要兩人掌舵便不會出現問題；他又透露美中在確保霍爾木茲海峽能源暢通及阻止伊朗擁核上立場一致，並希望在俄烏戰事及芬太尼危機等領域展開合作。\n特朗普則稱，他計劃與習近平討論結束烏克蘭戰爭，之後再赴中美俄元首會晤。\n14：10\n據路透社引述克林姆林宮消息報道，普京與特朗普進行雙邊會晤後心情極佳。雙方討論了烏克蘭衝突及雙邊關係相關議題。\n14：00\n特朗普向習近平表示：「你是我朋友，我們有著非常特別的關係。」他強調，中美雙方已建立起公平的關係，「這正是我們所追求的」，並指全球其他地方無人能做到中美兩國所能達成的成就。\n在經貿議題上，特朗普指出中美兩國已以公平方式分攤關稅，並稱相關貿易委員會正為過往失衡的雙邊關係帶來平衡。此外，特朗普亦透露，兩國領導人均強烈認為，石油運輸應保持暢通無阻地經由霍爾木茲海峽進行。\n13：32\n特朗普已抵達麒麟山莊。據央視報道，特朗普與習近平已開始會晤。\n相關新聞：深圳APEC︱中美俄元首會晤麒麟山莊即將登場 習近平先晤特朗普\n13：12\n特朗普與普京會面結束，正在前往麒麟山莊，準備與習近平會面。路透社報道，特普兩人會晤大約半小時左右，普京告訴特朗普，很高興見到他。\n特朗普則以「我的朋友」來稱呼普京，說：「我們多年來一直保持着良好的關係。我們彼此已認識很久，我認為這會帶來很多美好的結果，或者至少會由此開始。但我相信這些美好結果會由此而來」。\n特朗普與普京會晤。路透社\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n12：35\n美俄元首在北京會晤。會晤開始前，特朗普與普京握手，並稱兩人多年來一直保持著良好的關係，認為這次會面會帶來許多美好的會面。據外媒報道，是次會談持續不到1小時。\n特朗普與普京在北京會晤。俄羅斯衛星通訊社\n領導人非正式會議中，普京與特朗普亦曾作互動。路透社\n11：45\n國家主席於今日（19日）舉行的出席亞太經合組織（APEC）領導人非正式會議上，再次與日本首相高市早苗握手。昨日在歡迎晚晏上，二人亦曾握手。二人兩次握手，習近平都是只微笑，未有作交談。\n相關新聞：深圳APEC︱習近平再與高市早苗禮節性握手 繼續保持微笑\n11：33\n美國總統特朗普多次表示，在深圳出席亞太經合組織（APEC）峰會期間可能與北韓最高領導人金正恩會面。不過朝中社今日（19日）報道，金正恩近日已轉赴東部咸鏡南道視察海軍大學，朝方至今未對美方的會面提議作出任何回應。\n相關新聞：深圳APEC︱金正恩視察咸鏡南道 朝方未回應是否與特朗普會晤\n11：25\n中美俄三國元首今日（19日）在深圳亞太經合組織峰會場邊舉行歷史性會談前夕，俄方一個神秘黑色公事包意外成為焦點。普京隨行海軍軍官在深圳下榻酒店外被拍到手提代號「Cheget」的核武公事包，面對記者追問更罕有在鏡頭前微笑承認：「沒錯，就是它。」\n相關新聞：深圳APEC︱普京隨行軍官直認手上「核公事包」 中美俄會晤前「騷肌肉」？\n10：40\n國家主席習近平、美國總統特朗普與俄羅斯總統普京周四（19日）在深圳舉行三方會晤。三人上一次共同出席國際峰會是2019年日本大阪G20峰會，但當時並未舉行三方會談。外交部指，是次中俄美三國元首首度舉行三方會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。亦有分析指出，中美俄領導人首度同框意義重大，但同時會引發美國盟友之疑慮。\n相關新聞：深圳APEC｜中美俄元首同框象徵意義重大 惟引發美盟友不安｜拆局\n09：55\n國家主席習近平主持第33次領導人非正式會議，並發表講話。習近平表示，今天會議的主題是建設亞太共同體，促進共同繁榮。相信在我們共同努力下會議會圓滿成功，爲亞太經合組織實現更大發展地區乃至世界的和平、穩定、繁榮貢獻力量。\n\n習近平在講話提出多個重點，中方將提供2000萬美元資助開展亞太經合組織務實合作，在深圳設立亞太共同體研究中心。此外，亦會推進亞太自貿區建設，減少貿易壁壘，提升數字化與便利化水平；第二，升級互聯互通，鞏固基礎設施硬聯通，深化軟聯通與跨境支付合作；打造創新支柱，以數字經濟和人工智能為引擎，促進數據安全流通；發展支柱，深化能源、糧食及綠色低碳合作，支持改善民生。\n相關新聞：深圳APEC︱習近平倡攜手搭建亞太共同體「四樑八柱」︱講話全文\n\n09：52\n習近平與一眾嘉賓統一戴上中式領巾，然後一同合照。\n習近平：會議將為世界和平穩定貢獻力量。央視截圖\n領導人非正式會議上，特朗普在台上與習近平交流。路透社\n領導人非正式會議上，各出席嘉賓帶上領巾合照。路透社\n09：38\n俄羅斯總統普京及美國總統特朗普先後抵達深圳國際交流中心，出席領導人非正式會議。\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n09：20\nAPEC 採用「經濟體」作為參與單位，所有成員均按其官方英文名稱（例如 Australia、Canada、China、Hong Kong, China、Chinese Taipei 等）的字母順序依次入座。\n年度的主辦方即東道主領袖擔任會議主席，負責主持會議，通常坐在主位或正中央。因此，今次深圳峰會，國家主席習近平坐在主位。\n相關新聞：深圳APEC︱領導人峰會座位合照安排有玄機\n09：00\n今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。\n08：45\nAPEC領導人非正式會議在深圳揭幕，美國總統特朗普由菲律賓抵達深圳後，隨即入住福田區深圳東海朗廷酒店。周三（18日）下午起，酒店周邊實施交通管制，大批市民自發在對面馬路圍觀，\n相關新聞：深圳APEC︱市民街頭歡呼迎特朗普車隊 隔空叫「請他吃豬腳飯」︱有片\n00：35\n內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。\n相關新聞：深圳APEC｜晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n​ 內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。 中新視頻\n11月18日最新消息\n23：50\n俄羅斯衛星通訊社報道指出，出席歡迎晚宴的俄羅斯總統普京與美國總統特朗普，分別獲安排坐在習近平及夫人彭麗媛的左右兩側。\n相關新聞：深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身訪華團\n19：23\nAPEC各經濟體領導人開始陸續抵達位於深圳福田區的深圳國際交流中心。這處將舉行領導人合影活動，並舉辦由國家主席習近平名義舉行的歡迎晚宴。大會在入口處安排樂師現場演奏，當美國總統特朗普入場時，更特意駐足欣賞一會。\n相關新聞：深圳APEC｜習近平舉行歡迎晚宴 特朗普與普京握手\n晚宴開始後，中美俄三國領導人更在台上交談，期間美國總統特朗普更與俄羅斯總統普京握手。\n\n習近平在歡迎晚宴上，向出席嘉賓祝酒。路透社\n經濟體領導人在歡迎晚宴上合照。路透社\n經濟體領導人到深圳國際交流中心，出席歡迎晚宴。路透社\n習近平親迎特朗普：禮尚往來\n16：45\n新華社報道，周三（18日）下午，國家主席習近平在深圳寶安國際機場迎接來華出席亞太經合組織領導人非正式會議的美國總統特朗普。在迎賓曲中，習近平同特朗普親切握手。三軍儀仗隊行舉槍禮，少年兒童向特朗普獻花。中美兩國國旗迎風招展，軍樂團奏兩國國歌，戰機飛越致敬。兩國元首向青年歡迎隊伍揮手致意。\n習近平表示，今年9月我訪美時，特朗普總統夫婦專程赴機場迎接，並舉行隆重歡迎儀式。中國是禮儀之邦，有禮尚往來的傳統。我歡迎你再次訪華，期待同你就事關中美關係、亞太合作和世界格局的重大問題深入交換意見，推動基於尊重、公平、對等的中美建設性戰略穩定關系向前發展。\n特朗普表示，感謝習近平主席親赴機場迎接，感謝中方特殊安排，很高興再次到訪偉大的中國。習近平主席是一位偉大的領袖，每一次同習近平主席會晤都非常愉快，相信此訪將進一步推進兩國關係，取得圓滿成功。\n蔡奇、王毅、黃坤明參加。\n相關新聞：深圳APEC｜特朗普結束訪菲啟程來華 上機前做「招牌」握拳頭動作\n16：27\n日本首相高市早苗抵達深圳，將出席領導人非正式會議，展開就任後的首次訪華之行。\n\n相關新聞：深圳APEC︱日本首相高市早苗抵華 接待層級低於其他領導人\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n12：04\n國家主席習近平與俄羅斯總統普京會晤。\n習近平與普京會晤。\n習近平與普京會晤。\n普京讚深圳最具活力的大都市之一\n11：20\n俄羅斯總統普京出席深圳前海國際會議中心出席2026年亞太經合組織工商領導人峰會開幕，並以經濟體領導人身份作特別致辭。普京表示，此次APEC舉辦地深圳給人留下了深刻印像。「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」\n10：00\n國家主席習近平在主旨演講上表示，中國「十五五」規劃既是自身的發展藍圖，也為亞太乃至全球經濟增長提供機遇清單，是中國面向全球工商界發出的合作邀約。\n\n中國將為全球工商界提供超大規模開放市場。中國擁有全球規模最大中等收入群體，投資和消費潛力巨大。\n相關新聞：深圳APEC｜習近平籲踐行真正多邊主義 共建亞太共同體\n習近平：中國正加快建設開放大市場\n習近平指出，從新能源汽車到智能家居，從銀發經濟到冰雪旅遊，每一個新賽道都為全球企業帶來新機遇。中國正在加快建設開放大市場，擴大優質產品和服務進口，將不斷催生多樣化新需求。\n中國將為全球工商界提供前景廣闊的發展空間。創新驅動、綠色轉型是中國經濟的關鍵詞。中國將加快構建現代化產業體系，推動科技創新和產業創新深度融合，為全球企業技術創新和發展壯大提供強勁動能。\n\n中國將為全球工商界提供互促共進的合作環境。面對單邊主義、保護主義衝擊，中國始終踐行真正多邊主義，堅定維護多邊貿易體制，維護世貿組織規則，推動世界貿易組織改革，不斷為世界經濟增長和國際經貿合作注入穩定性和確定性。中方將從降低關稅、擴大准入，到探索規則、管理、標準等深水區改革，全面落實製造業准入又准營，穩步擴大服務業領域開放，為全球企業來華投資興業提供更穩定、更可預期優質環境。\n今明兩日出席峰會 多國領袖齊聚深圳\n03：00\n18日凌晨，俄羅斯總統普京乘專機抵達深圳，出席APEC峰會。中共中央政治局常委、中央書記處書記蔡奇前往機場迎接。分析人士對《星島》指出，今年5月普京訪華時，接機是中共中央政治局委員、外長王毅，而今次接機的是政治局常委蔡奇，規格比之前更高。預計普京在峰會期間將與多國與會領袖就亞太區經貿合作及國際局勢等議題展開交流。\n克里姆林宮發言人周六表示，11月19日在深圳，普京將與國家主席習近平及美國總統特朗普舉行三方會晤。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb4cfc86ce1","title":"（深圳APEC）2026年亚太经合组织领导人深圳展望发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734961.shtml","summary":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。","summary_short":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。","digest":"2026年亚太经合组织领导人深圳展望19日发布","points":["展望重申，亚太经合组织是区域经济合作的首要平台，将遵循自主自愿…","展望表示，将继续以市场驱动的方式，包括通过落实亚太自由贸易区相关议程，推进亚太区域经济一体化","亚太自由贸易区议程在提升各经济体参与高标准、综合性区域自贸安排的能力方面发挥着重要作用"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:37:01+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。展望重申，亚太经合组织是区域经济合作的首要平台，将遵循自主自愿、非约束性和协商一致的合作原则，致力于将亚太经合组织打造成一个更加现代、高效、务实的理念孵化器。\r\n\n　　展望表示，将继续以市场驱动的方式，包括通过落实亚太自由贸易区相关议程，推进亚太区域经济一体化。亚太自由贸易区议程在提升各经济体参与高标准、综合性区域自贸安排的能力方面发挥着重要作用。\n\n　　展望说，认识到数字化对驱动本地区创新、促进生产力和经济增长的重要作用，及其对促进贸易的积极作用。将继续促进贸易便利化，包括通过实施无纸化贸易和跨境电子商务等措施。\n\n　　展望表示，在现有进展基础上，核可《亚太经合组织互联互通蓝图》，鼓励各经济体继续努力，通过进一步夯实“硬联通”、“软联通”、“心联通”三大支柱，实现无缝、全面联通和融合亚太。\n\n　　展望称，鼓励各经济体推进数字互联互通，弥合社会各阶层以及城乡区域间的数字鸿沟，加强可及、有韧性的数字基础设施建设，推动数字转型，促进经济增长，提升数字素养与技能，推进数字平台建设。\n\n　　展望指出，支持推动关键领域的数字和新兴技术转型，利用数字和新兴技术改善公共服务，包括加强医疗卫生体系建设，为企业营造有利的发展环境，推广以市场为导向、以创新为驱动的做法，并为中小微企业提供可及的数字工具以赋能其发展。\n\n　　展望强调，应该帮助劳动者为未来工作做好准备，以把握技术进步带来的益处，并根据《亚太经合组织应对人口结构变化框架合作文件》应对人口结构变化。\n\n　　展望称，寻求加强跨能源部门和跨技术的综合安全，共同应对能源安全挑战，确保不间断、可依赖、可负担和可持续地获取能源，以支撑经济繁荣。鼓励围绕供应链韧性、基础设施互联互通、风险评估加强能源安全协作。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca5127e7650","title":"全国首单香港主体跨境数据知识产权登记落地广东","url":"https://www.chinanews.com.cn/dwq/2026/11-19/10734962.shtml","summary":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识产权存证登记平台获得登记…","summary_short":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数…","digest":"香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识…","points":["中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多…","这是全国首个香港经营主体通过跨境登记模式在粤获得数据知识产权登记","继向澳门经营主体颁发数据知识产权登记证书之后，广东目前已实现面向香港…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:33:27+08:00","size":1,"keywords":[],"body":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识产权存证登记平台获得登记，在19日举行的亚洲知识产权营商论坛“粤港澳大湾区分论坛”上，广东省市场监督管理局(知识产权局)为该企业颁发数据知识产权登记证书。\r\n\n　　这是全国首个香港经营主体通过跨境登记模式在粤获得数据知识产权登记。继向澳门经营主体颁发数据知识产权登记证书之后，广东目前已实现面向香港、澳门经营主体跨境数据知识产权登记的全覆盖。\n\n　　据介绍，此次登记的“影视竖屏视频镜头语言多模态训练数据集”由企业自有竖屏影视素材加工而成，共1001条镜头级记录、42个字段，以镜头级粒度完成多模态标注，面向AIGC竖屏视频模型训练，可为微短剧、竖屏广告、电商短视频等生产提供合规训练数据资源。\n\n　　香港经营主体跨境登记无现成先例。在广东省市场监督管理局(知识产权局)、广东省知识产权保护中心指导下，广州商标审查协作中心(广东省知识产权开发与服务中心)及相关服务机构与香港乾盛映像传媒有限公司建立港企跨境数据知识产权协同服务机制，破解香港企业资质核验、跨境合规、平台注册无先例等多项难题，落实两地监管要求，保障数据集权属清晰合规。\n\n　　香港乾盛映像传媒有限公司项目负责人表示：“这份登记证书，为我们香港自研的数据资产颁发了合法的‘数字身份证’。”\n\n　　近年来，广东省市场监督管理局(知识产权局)依托广东数字经济产业优势，统筹推进制度构建、登记实践、交易运用、权益保护、宣传推广全链条工作，为数据要素市场化配置改革提供有力支撑。\n\n　　截至2026年10月，广东省数据知识产权累计申请8699件，颁发证书5914件；落地数据知识产权质押70单，融资约13亿元；促成数据知识产权交易、保险、证券化金额2437.96万元；登记覆盖生物医药、先进制造、新一代电子信息、数字文创等多个重点产业领域。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c09a79539a6","title":"豪擲66萬｜遼寧千萬網紅收夫「現金花束」慶生 遭批炫富兼涉違法急刪片","url":"https://www.stheadline.com/realtime-china/3639009/豪擲66萬遼寧千萬網紅收夫現金花束慶生-遭批炫富兼涉違法急刪片","summary":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。","summary_short":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。","digest":"遼寧錦州近日一場高調生日宴引發內地網絡熱議","points":["遼寧錦州近日一場高調生日宴引發內地網絡熱議","一名男子為慶祝妻子41歲生日，竟豪擲66萬元（人民幣，下同）的百元大鈔…","事發於周三（18日）深夜，有網民在社交平台發布一段生日會現場片段…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:30:50+08:00","size":1,"keywords":[],"body":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。一名男子為慶祝妻子41歲生日，竟豪擲66萬元（人民幣，下同）的百元大鈔，紮成巨型「現金花束」贈予愛妻，場面相當誇張。相關片段在社交平台瘋傳後，隨即惹來網民批評炫富及質疑違法；事件發酵後，涉事網紅今日（19日）將帳號內所有影片全數清空。 \n稱「物質是表達愛最好方式」 \n事發於周三（18日）深夜，有網民在社交平台發布一段生日會現場片段，顯示場內擺放著一束體積龐大的現金花束。替同行代班拍攝的攝影師向內地傳媒透露，現場是一名丈夫為41歲妻子慶生，該巨型花束全數由66萬元的百元大鈔紮成。 \n場地工作人員亦證實，該66萬元現金花束為男方送給妻子的生日禮物，兩人育有3名子女，女方是坐擁千萬粉絲的知名網紅，花束由當事人自行委託花店製作。針對有網民留言提醒「用人民幣紮花屬違法行為」，工作人員表示並不知情，並指網上不少人仿效及有花店提供相關服務。 \n綜合內媒報道，該名擁有逾1,200萬粉絲的女網紅於18日晚曾連發多段生日會影片，並感性發文稱：「愛不需要錢，但證明愛需要，物質不能代替愛情，但卻是表達愛的最好方式。」不過，隨着事件登上熱搜並，大批網民批評「俗不可耐」、「赤裸裸炫富」後，涉事女網紅、攝影師及場地方的社交帳號於今日下午均已刪除相關片段，女網紅的個人帳號作品更顯示為「0」，連帶其生日會直播帶貨的回放紀錄亦一併下架。 \n據悉，涉事網紅是快手平台的胡顏雪，其丈夫為熊健。目前胡顏雪的帳號已改為私密狀態。\n律師：妨礙貨幣流通屬不當使用 \n針對「現金花束」的法律爭議，河南澤槿律師事務所主任付建指出，根據《中華人民共和國人民幣管理條例》，人民幣作為國家法定貨幣，禁止故意毀損或妨礙其正常流通。即使以平鋪方式製作花束未有造成紙幣破損，但將貨幣當作裝飾擺件使用、使其脫離支付流通功能，已屬「不當使用人民幣」。 \n付建補充，行政機關可對相關行為人或花店經營者予以警告，若涉及大量使用或公開售賣此類花束且情節較重者，更可並處罰款。\n武漢大學社會學教授尚重生則批評，用巨額現鈔紮花看似浪漫實則並不高雅，是一種低級的表達方式，且存在治安及財物安全隱患。他強調，千萬級粉絲的網紅其流量與財富皆來自社會大眾，此類高調炫富行為極易對粉絲尤其是青少年群體的價值觀造成不良誤導。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c73d31493db","title":"（深圳APEC）以船为喻，中国向亚太发出“同舟之约”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734948.shtml","summary":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。","summary_short":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。","digest":"11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象","points":["中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼…","作为全球单体规模最大的集装箱码头之一，这里每周有53条直通亚太经合组织(APEC)成员经济体…","中国的新能源汽车、照相机由此出海，马来西亚榴莲、智利车厘子跨海而来"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T22:25:14+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。作为全球单体规模最大的集装箱码头之一，这里每周有53条直通亚太经合组织(APEC)成员经济体的航线。中国的新能源汽车、照相机由此出海，马来西亚榴莲、智利车厘子跨海而来。在亚太地区，类似的航程每时每刻都在发生。彼此相连，也意味着休戚与共。\n\n　　11月19日，在深圳举行的APEC第三十三次领导人非正式会议上，中国国家主席习近平指出，亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，携手应对困难和挑战，持续培育共同体意识。他提出，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　四个关键词勾勒出亚太合作的新航向，也回答了一个现实问题：面对风高浪急的国际环境，亚太这艘大船如何行稳致远？\n\n　　风浪面前，首先要同舟共济。\n\n　　APEC21个经济体覆盖约30亿人口，经济总量约占全球GDP六成，贸易额占全球近一半，成员间产业链供应链深度互嵌。\n\n　　“没有人能单打独斗”，智利总统卡斯特说，有一些人有资源，剩下的人可能有技术，其他人有资本。只有大家一起开放市场，才能共存。\n\n　　当单边主义、保护主义掀起风浪，团结协作就是成本最低的“避险资产”。亚太经济体拉紧共同利益纽带，亚太这艘“大船”方能行稳。\n\n　　船要行得远，还要有畅通的航道。\n\n　　摩根大通中国区联席首席执行官、亚太区首席财务官何耀东表示，互联互通将带来新的经济机遇。在秘鲁，钱凯港开港两年来，中秘海运时间缩至最短23天。在印度尼西亚，雅万高铁重塑了爪哇岛经济格局。\n\n　　天丝集团首席执行官许馨雄表示，对于亚太各经济体而言，开放融通能够放大比较优势，打通要素流动堵点，共享市场扩容、技术互鉴、规则对接的红利，天丝集团正是亚太开放融通的受益者。\n\n　　要驶向新航程，还需要不断注入创新动力。\n\n　　如今，新一轮科技革命和产业变革正在重塑全球竞争格局。对于亚太经济体而言，创新不是“选择题”，而是稳住增长、化解风险、实现共同发展的“必答题”。\n\n　　中国企业研究院首席研究员李锦表示，过去各种案例已反复验证，创新既能帮助单个经济体转型升级，也能通过区域协同一起抵御外部风险、共享发展红利。\n\n　　如今，中国的新技术新产业加快走向亚太。在智利圣地亚哥市郊，中国设计的智慧农业无人机精准作业，帮助当地农场减少农药和水的使用。\n\n　　大船要走得稳，更不能落下任何一位同行者。\n\n　　亚太经济体多样性突出，发展诉求各异。在毕马威中国副主席、华南区首席合伙人伍耀辉看来，如何把“共同繁荣”的愿景转化为各经济体、各类企业都能参与并且能够受益的具体合作极为关键。\n\n　　中国银联股份有限公司董事长董俊峰说，印度尼西亚约有3500万、越南约有1600万小商户没有POS机，银联为其提供线下二维码收款牌，全球银联持卡人扫码即可购买越南芒果、泰国榴莲。一张张二维码，把亚太小商户接入了跨国消费网络。\n\n　　今年是中国“十五五”开局之年，中国为亚太提供新的“机遇清单”，也向各方发出“登船”邀请。从“同舟之约”到共同繁荣，亚太千帆，乘风共进。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3737614351","title":"在深圳APEC，全球CEO共话产业发展新方向","url":"https://www.chinanews.com/shipin/2026/11-19/news1075507.shtml","summary":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。","summary_short":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。","digest":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕","points":["11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕","峰会以“共促繁荣，共赢未来”为主题，为期两天，吸引了2000余位政商代表参会","在这场全球经贸最前沿，多位CEO接受了三里河的采访，从他们反复提及的关键词中…"],"section":"內地","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:22:35+08:00","size":1,"keywords":[],"body":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。峰会以“共促繁荣，共赢未来”为主题，为期两天，吸引了2000余位政商代表参会。在这场全球经贸最前沿，多位CEO接受了三里河的采访，从他们反复提及的关键词中，我们能瞥见全球产业的未来趋势。(戴悦 董羽辰 黄蕾 迟瀚宇 李金磊 宫宏宇）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/b0580201-8856-4188-bf5f-74c32477c0f1.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c56eb5e49ff","title":"大國外交｜習近平指中美關係總體穩定向好","url":"https://news.tvb.com/tc/1207330-大國外交習近平指中美關係總體穩定向好","summary":"國家主席習近平，在深圳會見來華出席亞太經合組織(APEC)領導人非正式會議的美國總統特朗普。習近平指出，中美關係總體穩定向好，給世界注入了穩定性和確定性。","summary_short":"國家主席習近平，在深圳會見來華出席亞太經合組織(APEC)領導人非正式會議的美國總統特朗普。","digest":"大國外交｜習近平指中美關係總體穩定向好","points":["國家主席習近平，在深圳會見來華出席亞太經合組織(APEC)領導人非正式會議的美國總統特朗普","國家主席習近平稱：「這段時間，中美關係總體穩定向好，給兩國人民帶來了實實在在的利益…","實際上，我們的中美建設性戰略穩定關係，也是前無古人的一個開創性事業，也需要我們敢闖敢試…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:12:00+08:00","size":1,"keywords":["習近平","大國外交","特朗普"],"body":"國家主席習近平，在深圳會見來華出席亞太經合組織(APEC)領導人非正式會議的美國總統特朗普。習近平指出，中美關係總體穩定向好，給世界注入了穩定性和確定性。\n\n國家主席習近平稱：「這段時間，中美關係總體穩定向好，給兩國人民帶來了實實在在的利益，也給世界注入了穩定性和確定性，總統先生做出的努力有目共睹，將載入史冊。實際上，我們的中美建設性戰略穩定關係，也是前無古人的一個開創性事業，也需要我們敢闖敢試、腳踏實地、善作善成。」\n\n習近平表示：「所以我還是願意堅定地，同總統先生一道，繼續為中美關係，領航掌舵，確保這條大船始終沿著正確的航向，劈波斬浪。」","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026eesZYFcaCJ1795098221.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/7a85c87a8df348b49a8c42d8fd0cca61/067a4a728c41491f85745a265826e528-c74461625b7638c49c13c80d5eeca170-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026eesZYFcaCJ1795098221.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c50d0b3c25c","title":"（近观中国）“鹏城”之会，习近平寄语亚太合作鹏程万里","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734949.shtml","summary":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。","summary_short":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。","digest":"“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里","points":["中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞…","”19日在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议上…","30多年来，亚太地区经济快速发展，面貌日新月异"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T22:09:14+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。”19日在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议上，中国国家主席习近平这样寄语亚太合作。\n\n11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议。中新社记者 赵文宇 摄\n\n　　深圳又名“鹏城”。在中国古籍里，相传鹏鸟能飞万里路程，由此引喻前程远大、前景无限。\n\n　　30多年来，亚太地区经济快速发展，面貌日新月异。构建亚太共同体是实现本地区长远发展繁荣的必由之路，也是各方的共同愿景。\n\n　　此次“鹏城”之会，着眼推动建设亚太共同体，习近平强调要“和衷共济”“开放融通”“开拓创新”“包容发展”。\n\n　　“这16个字里既有传承也有创新。”中国外交学院院长高飞说，一方面是对APEC推进区域经济一体化等成功经验的概括总结，另一方面融入“你中有我、我中有你”的共同体意识。\n\n　　“和衷共济”一词被置于首位。习近平指出，“浩瀚的太平洋承载千帆、滋养万物”，强调“亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助”。\n\n图为深南大道的APEC主题花坛花团锦簇。中新社记者 陈楚红 摄\n\n　　在习近平的APEC时间里，他曾多次以“船”为喻，提出重大理念主张。中国国际问题研究院亚太研究所所长蓝建学说，中方此次强调“和衷共济”，既是直面单边主义、地缘对抗等当前存在的“风浪”，也意在以“求同存异、和合共生”的智慧凝聚力量，为亚太合作开创新局面。\n\n　　在系统阐述亚太共同体丰富内涵的同时，习近平也为其指明建设路径。从强化经贸支柱到升级联通支柱，从打造创新支柱到夯实发展支柱，中方表示愿同各方一道携手搭建亚太共同体的“四梁八柱”。\n\n　　中国社会科学院亚太与全球战略研究院研究员许利平说，亚太共同体建设已取得一系列务实成果。面向2040年建成亚太共同体这一愿景，中方作为东道主适时提出搭建“四梁八柱”，将助力破解建设过程中的堵点、难点，进一步汇聚行动合力。\n\n　　以互联互通领域为例，习近平今次强调要巩固“硬联通”，增强“软联通”，密切“心联通”，提出“推动智慧海关、智慧交通建设”“深化跨境支付合作”等一系列举措。\n\n　　高飞表示，互联互通是区域合作的纽带。相关举措有助于为未来区域经济一体化夯实基础，也将为亚太乃至全球繁荣增长注入动力。\n\n　　中国是亚太经济合作的倡导者、推动者、先行者，也是积极的行动派。在深圳这座充满未来感的城市，习近平提出，中方将立足亚太合作，在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。此外，旨在提供智力支撑的亚太共同体研究中心也将落户“鹏城”。\n\n　　蓝建学表示，数字经济和人工智能是创新增长的引擎。这将为搭建“四梁八柱”进一步提供支撑，将合作共识落到实处。\n\n　　“在这些新兴领域，亚太经济体拥有广阔的合作空间。未来取得丰硕成果，不仅将为推进建设亚太共同体提供新的路径，也可更好造福地区人民。”许利平说。\n\n　　“大鹏一日同风起”，2026APEC“中国年”的会标取自鲲鹏意象，21根交织的羽翼宛如振翅凌云。这既是APEC21个经济体共生共荣的生动缩影，也承载着东道主对于“乘大势、共翱翔”的美好期许。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc2efb3ba6e","title":"（深圳APEC）事关中国经济 外媒五大关切在深圳找到答案","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734942.shtml","summary":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸  　　“中国挤压了别国发展空间？","summary_short":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸  　　“…","digest":"题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸…","points":["中新社记者 张焕迪 国璇 尹倩芸","新西兰NZINC公司总经理弗兰·奥沙利文用事实给出回答…","2025年，新西兰32%的乳制品、55%的木材、41%的肉类和34%的羊毛销往中国"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:50:45+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案\n\n　　中新社记者 张焕迪 国璇 尹倩芸\n\n　　“中国挤压了别国发展空间？”“中国新能源真的‘产能过剩’？”……一段时间以来，外媒对中国经济有种种疑问。\n\n　　当亚太经合组织(APEC)大家庭齐聚深圳，这些问题在这座“奇迹之城”找到了答案。\n\n　　问题一，“中国挤压了别国发展空间？”\n\n　　新西兰NZINC公司总经理弗兰·奥沙利文用事实给出回答：新西兰是第一个与中国签署自贸协定的发达国家，这些年从与中国的合作中“受益良多”。\n\n　　2025年，新西兰32%的乳制品、55%的木材、41%的肉类和34%的羊毛销往中国。\n\n　　“不论是新技术发展、生产力提升，还是工作岗位增加，亚太地区伙伴都从中国的发展中受益。”澳大利亚总理阿尔巴尼斯说。\n\n　　合作，是深圳“APEC时间”的高频词。大批商界人士带着合同赴“深圳之约”，中国的发展为亚太增长提供了坚实支撑。\n\n　　问题二，“中国AI技术‘成色’究竟如何？”\n\n　　在华强北，在深圳湾文化广场，在APEC新闻中心的机器人身上，答案呼之欲出。\n\n　　“中国人工智能技术和机器人产业发展迅猛，很多国家望尘莫及。”尼日利亚记者马克·朗延感叹。首次来华的德国客商托马斯认为，中国在AI领域已领先德国。\n\n　　透过深圳这扇窗，人们看到，中国AI竞争力的来源在于持之以恒的自主创新与长期积累。\n\n　　泰国国家会议展览局局长苏帕万·提拉拉特说，他尤其看重深圳在AI领域的创新能力，期待与至少1000家深圳企业合作。\n\n11月17日，位于广东深圳的中国首个具身智能机器人示范街区上演一场大型机器人表演，以“机器人总动员”迎接APEC。　中新社记者 陈楚红 摄\n\n　　问题三，“中国对外资吸引力下降？”\n\n　　泰国中华总商会副主席李桂雄的回答是：中国的发展实实在在，“外界怎么讲都推翻不了”。\n\n　　统计显示，今年前7个月中国新设立外商投资企业超3.7万家，高技术产业实际使用外资同比增长32.7%。\n\n　　115家世界500强企业代表齐聚前海，APEC工商领导人峰会现场座无虚席。商界人士“用脚投票”，充分表明了中国市场对外资的吸引力。\n\n　　问题四，“中国新能源产能过剩？”\n\n　　“这种说法本身十分自私。”加拿大韦博网讯科技(WPIC)首席执行官雅各布·库克说。\n\n　　有分析指出，部分国家炒作中国新能源“产能过剩”，意在维护自身产业地位、遏制中国产业升级，是以产能过剩之名行贸易保护之实。\n\n　　此次在深圳，多位APEC成员经济体领导人对封闭和贸易保护说“不”。马来西亚总理安瓦尔说，任何国家都不可能在孤立的情况下实现发展。韩国总统李在明称，为了打造稳定的产业基础与供应链，各方必须深化合作。\n\n11月15日，中外客商在深圳华强电子世界选购商品。中新社记者 张祥毅 摄\n\n　　问题五，“中国经济发展前景如何？”\n\n　　从边陲小镇到国际化大都市，深圳的发展历程就是最好的答案。\n\n　　今天的深圳汇聚了来自100多个国家和地区的国际化人才，掌纹支付、飞行汽车等创新不断刷新想象。“希望我的祖国也能有一个深圳”，一名西班牙学者的感慨引发众多海外网友共鸣。\n\n　　在这座“奇迹之城”，外国友人感受到了中国经济的活力，也捕捉到了中国发展带给世界的机遇。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c541ec05fb3","title":"（深圳APEC）说粤语的泰国总理","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734860.shtml","summary":"中新社深圳11月19日电 题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心！","summary_short":"中新社深圳11月19日电 题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心！","digest":"题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心","points":["中新社深圳11月19日电 题：说粤语的泰国总理","”18日，泰国总理阿努廷在深圳用一句地道粤语，形容来到广东的感受","源于这种亲切感，每次我见到中国人都很开心"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:39:58+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：说粤语的泰国总理\n\n　　中新社记者 门睿\n\n　　“好开心！”18日，泰国总理阿努廷在深圳用一句地道粤语，形容来到广东的感受。\n\n　　对于阿努廷而言，广东有着特殊的意义。\n\n　　阿努廷祖籍广东。他曾在接受中国媒体采访时说：“我的父母、祖父祖母、外祖父外祖母都来自中国。我在泰国出生，有中文名字，家里也说粤语。源于这种亲切感，每次我见到中国人都很开心。”\n\n　　11月18日，阿努廷在2026年亚太经合组织(APEC)工商领导人峰会上发表演讲时用中文问好。一句“大家下午好”，引得现场响起掌声。\n\n11月18日，泰国总理阿努廷在深圳出席2026年亚太经合组织工商领导人峰会。　中新社记者 赵文宇 摄\n\n　　此次深圳之行并非阿努廷第一次“秀中文”。\n\n　　2023年1月，时任泰国副总理兼卫生部长的阿努廷亲赴曼谷素万那普国际机场，迎接中国游客。他在现场用中文说：“泰国人欢迎朋友们从中国来泰国玩。”消息传到中国，引发广泛讨论。\n\n　　今年7月，阿努廷就任泰国总理后首次正式访华。访问期间，他在社交媒体用中文发文“中泰一家亲” “上海中国”。10月，他再次在社交媒体发布中文“很好”，并配上了一张他与父亲差瓦拉在桌旁交谈的照片。\n\n　　差瓦拉中文名陈景镇，是泰国联泰工业建筑公司创始人。1998年，他曾回到广东新会祭祖，并为家乡村庄捐资修路。\n\n　　这正是海外华人心系故土的一道缩影。历史上，大批广东人离开故土到海外寻找发展机会。他们积极融入当地社会，成为联系祖(籍)国与住在国的桥梁。有数据显示，粤籍海外华侨华人有近3000万。\n\n　　五邑大学教授张国雄接受中新社记者采访时表示，无论是回馈桑梓还是语言传承，阿努廷父子的经历都体现出海外华人对中华文化的认可，以及华人与故乡割舍不断的血脉亲情。\n\n　　这种跨越时间与地域的情感，也体现在近年来频见报端的海外华人寻亲故事中。\n\n　　2025年，南太平洋岛国瑙鲁总统戴维·阿迪昂到外曾祖父的祖籍地——广东江门开平市赤坎镇中股村寻根谒祖。今年春节前夕，他再度到访，并写下“福”字赠与族亲。\n\n　　今年9月，马来西亚南侨机工后人张慧清在昆明街头“偶遇”外公邝金源的照片，她将这段经历拍摄成视频，发布在社交媒体。邝金源祖籍广东台山，曾瞒着家人加入南侨机工队伍，奔赴滇缅公路抢运物资，支援中国抗战。这段动人往事感动众多网友。视频发出十几天后，张慧清也在广东台山市台城街道岭背村完成认祖。\n\n　　“从这些家族故事中我们能看到，尽管已经过去了几代人的时光，海外华人在地域上也与家乡远隔重洋，但他们对故土亲情与中华文化的认同不会随着时间和距离淡化。”张国雄说。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdce33c36fa","title":"巴基斯坦华文学校校长马斌：为当地孩子打开一扇看中国的窗","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-19/news1075503.shtml","summary":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","summary_short":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","digest":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行","points":["11月18日至19日，第六届世界华文教育大会在海南博鳌举行","巴基斯坦华文教育协会会长、中巴教育文化中心校长马斌介绍，该校2013年建立…","马斌表示，此前巴基斯坦许多当地民众希望了解中文、了解中国文化，但是没有途径"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T21:22:42+08:00","size":1,"keywords":[],"body":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。\n\n巴基斯坦华文教育协会会长、中巴教育文化中心校长马斌介绍，该校2013年建立，是巴基斯坦首所华文学校，课程涵盖剪纸、武术、汉语、数学等。\n\n马斌表示，此前巴基斯坦许多当地民众希望了解中文、了解中国文化，但是没有途径。华文学校的建立，为当地民众搭建起系统了解中国文化的平台。(记者 李宇凡 王子谦)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/99CAA2C5C06F4EDB869538A953734402.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c625a76d38c","title":"2026年亚太经合组织领导人深圳展望 建设亚太共同体，促进共同繁荣","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734929.shtml","summary":"新华社深圳11月19日电  2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  　　我们，亚太经合组织领导人，于2026年11月18日至19日在中国深圳举行会议。","summary_short":"新华社深圳11月19日电  2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  　　我们…","digest":"2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  　　我们…","points":["新华社深圳11月19日电","建设亚太共同体，促进共同繁荣","我们致力于携手努力，维护宏观经济稳定，提升生产力和活力，促进经济增长，造福全体人民"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:14:01+08:00","size":1,"keywords":[],"body":"新华社深圳11月19日电\n\n2026年亚太经合组织领导人深圳展望\n\n建设亚太共同体，促进共同繁荣\n\n　　我们，亚太经合组织领导人，于2026年11月18日至19日在中国深圳举行会议。亚太经合组织成立数十年来，在我们持续努力下，本地区已成为全球增长的重要引擎和区域经济合作的典范。今年以来，我们围绕“建设亚太共同体，促进共同繁荣”主题，聚焦中国设定的2026年亚太经合组织三大优先领域“开放、创新、合作”，以《2040年亚太经合组织布特拉加亚愿景》为指引，持续推进工作，朝着建成开放、活力、强韧、和平的亚太共同体这一共同目标不断迈进。\r\n\n　　当今世界快速变革，新兴机遇与复杂挑战并存。技术突破为促进本地区经济增长、韧性和活力作出贡献。我们致力于携手努力，维护宏观经济稳定，提升生产力和活力，促进经济增长，造福全体人民。\n\n　　亚太经合组织长期以来处在区域经济合作前沿，在当前经济背景下依然发挥着重要作用。我们重申，亚太经合组织是区域经济合作的首要平台，我们将遵循自主自愿、非约束性和协商一致的合作原则，致力于将亚太经合组织打造成一个更加现代、高效、务实的理念孵化器。\n\n　　经贸和投资\n\n　　我们强调，支持改善贸易和投资环境的努力对本地区具有重要意义。我们重申致力于加强供应链韧性、深化区域经济合作，建设稳健且有韧性的经济，为本地区实现持续的经济增长与繁荣作出贡献。\n\n　　我们将继续以市场驱动的方式，包括通过落实亚太自由贸易区相关议程，推进亚太区域经济一体化。我们认识到，亚太自由贸易区议程在提升各经济体参与高标准、综合性区域自贸安排的能力方面发挥着重要作用。\n\n　　我们认识到数字化对驱动本地区创新、促进生产力和经济增长的重要作用，及其对促进贸易的积极作用。在此背景下，我们欢迎《亚太经合组织贸易数字化合作框架(2027-2030)》，以此指导各方努力营造有利的政策环境、加强政策交流，并推动将数字技术应用在贸易数字化进程之中。我们将继续促进贸易便利化，包括通过实施无纸化贸易和跨境电子商务等措施。我们也致力于发挥新兴技术对贸易的促进作用。\n\n　　我们认识到服务业对促进经济增长和创造就业的贡献，以及数字服务日益扩大的作用，将继续提升亚太经合组织各经济体在服务业领域的竞争力。我们注意到环境及相关挑战带来的影响，鼓励亚太经合组织各经济体思考如何通过能力建设和经验交流，助力实现各自的环境与贸易目标。我们也认可亚太经合组织过去和当前在推动有韧性的商业模式合作方面所做的工作。我们肯定文化创意产业对经济增长的积极贡献，并重申强有力的知识产权保护的重要性。我们致力于加强知识产权保护和执法，并持续努力解决创新者、创作者及其他知识产权持有者所面临的挑战。\n\n　　联通\n\n　　我们重申，互联互通一直是经济增长的渠道，促进了商品、服务、资本和人员的流动，交通网络的安全与韧性为其提供了支持。我们赞赏亚太经合组织过去十年为推进区域互联互通所作的努力。在现有进展基础上，我们核可《亚太经合组织互联互通蓝图》，鼓励各经济体继续努力，通过进一步夯实“硬联通”、“软联通”、“心联通”三大支柱，实现无缝、全面联通和融合亚太。我们将继续加强互联互通，为所有人带来实实在在的利益。我们将加强合作，促进高质量基础设施开发和投资。我们也强调投资的重要性，包括通过事前投资来减少灾害风险。\n\n　　面对影响我们地区的供应链挑战，我们重申致力于维护供应链韧性，特别是必需品的供应链。我们认识到，保持本区域互联互通、贸易走廊开放，以促进包括能源供应和其他必需品的贸易流动，符合我们的共同利益。我们决心与其他贸易伙伴共同努力，确保贸易持续流动，确保关键基础设施继续支撑全球供应链的运转和完整。我们支持增强供应链韧性、解决瓶颈问题、利用亚太经合组织现有平台促进供应链互联互通和贸易便利化。我们欢迎对《供应链互联互通框架行动计划(第三期)》(2022-2026)的终期审议。我们也认识到，政策透明至关重要，否则可能影响贸易或扰乱供应链。\n\n　　我们将继续加强交通领域的合作以推动创新，增强信息通信技术韧性。我们将继续推广良好监管实践，在标准和评定程序方面努力加强合作，并推进结构性改革以改善营商环境。我们也将就贸易数字化、供应链、贸易便利化开展务实经验交流，提升海关数字化水平，完善其他与贸易相关的流程。我们鼓励通过亚太经合组织商务旅行卡促进商务人员流动，欢迎各经济体推动旅游便利化、加强教育和技能培训、促进文化交流。\n\n　　创新\n\n　　我们认识到，技术和创新正在深刻重塑亚太经济体，并驱动地区经济迅速增长。我们将推进技术进步，推动创新驱动增长，着力提高生产力，改善生活质量，拓展繁荣机遇，造福所有人民。为此，我们支持科技与创新合作，培育具有竞争力、韧性且安全的创新生态系统。我们鼓励就良好实践进行自愿交流，为本土创新生态系统发展提供支持。\n\n　　我们重申致力于发展数字经济，让所有人民共享数字转型红利。我们鼓励各经济体推进数字互联互通，弥合社会各阶层以及城乡区域间的数字鸿沟，加强可及、有韧性的数字基础设施建设，推动数字转型，促进经济增长，提升数字素养与技能，推进数字平台建设。我们鼓励各经济体积极应对相关潜在风险，包括数据泄露、网络诈骗以及蓄意滥用人工智能和其他新兴技术从事恶意活动等，以加强和改善数字环境。我们认识到尊重知识产权对数字和新兴技术发展的重要性。我们认识到数据在推动数字转型中的关键作用。我们将继续加强在跨境数据流动、数字交易安全性以及数据保护和隐私等方面的合作。\n\n　　我们强调，数字和新兴技术为整个亚太地区带来了变革性机遇，有助于提升生产力、效率、竞争力和韧性，促进经济增长。我们赞赏亚太经合组织为推进数字和新兴技术相关讨论所作的努力，包括《亚太经合组织人工智能倡议(2026-2030)》，并通过《亚太经合组织关于亚太地区新兴技术促进就业和繁荣的声明》，以继续推进这一重要工作。我们支持以人民为中心的创新，支持采取负责任的方式，促进数字和新兴技术在各经济领域应用，造福全体人民。我们支持推动关键领域的数字和新兴技术转型，利用数字和新兴技术改善公共服务，包括加强医疗卫生体系建设，为企业营造有利的发展环境，推广以市场为导向、以创新为驱动的做法，并为中小微企业提供可及的数字工具以赋能其发展。我们将继续投资数字和新兴技术相关基础设施，推进数据利用，激发创新活力。\n\n　　经济增长\n\n　　我们认识到全民经济赋权是促进生产力和创新、强化经济参与度的重要途径。我们强调，应该帮助劳动者为未来工作做好准备，以把握技术进步带来的益处，并根据《亚太经合组织应对人口结构变化框架合作文件》应对人口结构变化。我们重申致力于提升人力资源开发现代化水平，促进高质量、充分、生产性和体面的就业，促进终身学习、职业培训、技能提升和再培训，保护劳动者权利，在不断变化的工作环境中继续努力提升相关国际劳工标准，以及酌情优化社会保障体系。\n\n　　我们强调可信且灵活的财政、货币和金融政策框架对于应对冲击、维护宏观经济和金融稳定的重要性。我们也注意到，全球失衡问题持续存在，给增长与稳定带来了风险。我们认识到，全球再平衡符合我们的共同利益，并同意就此加强沟通与合作。我们鼓励应用财政政策支持家庭，促进全民金融可及性、拓展金融机会、提升金融素养，认识到金融知识对财务健康和人民福祉至关重要。\n\n　　我们寻求加强跨能源部门和跨技术的综合安全，共同应对能源安全挑战，确保不间断、可依赖、可负担和可持续地获取能源，以支撑经济繁荣。我们鼓励围绕供应链韧性、基础设施互联互通、风险评估加强能源安全协作。我们认识到及时修复发电厂、电网、海底电力电缆和管道等关键能源基础设施的重要性，并鼓励各经济体围绕市场机制、应急准备和响应、战略储备管理进行经验交流。我们认识到，安全且不间断的能源流动至关重要，应在互利的基础上开展涵盖整个供应链的合作，包括生产者与消费者之间的合作，同时促进区域内能源合作。我们将推广安全、可靠、充足、有韧性和可负担的高质量能源，在包括偏远地区和农村在内的所有地区普遍可及。我们鼓励深化自愿合作，推动数字和新兴技术与能源之间相互促进，支持为数字和新兴技术发展提供可靠、有韧性且可负担的能源，同时利用数字和新兴技术完善能源系统，惠及全民。我们认识到，传统能源以及零排放、低排放能源和技术为能源安全以及强劲和可持续的经济增长提供了基础，各经济体将根据自身优先事项选择能源系统组合。\n\n　　我们将努力促进开放、公平、透明、高产出、有韧性和创新的农业粮食体系，以惠及全民。我们将加强粮食安全政策伙伴关系，提高农业生产力和效率，通过创新和数字化增强区域粮食体系韧性，促进农业粮食体系转型，促进食品安全，改善全民营养，防止和减少粮食损失与浪费。我们支持基于科学和证据、由技术赋能的农业，包括用好数字和新兴技术等工具，并推进农业生物技术发展。我们重申致力于为农村地区拓展经济机遇。\n\n　　我们认识到，森林为经济增长、生物多样性保护以及亚太地区的社区韧性和繁荣提供多重价值和贡献。我们支持合作打击非法采伐及相关贸易，促进合法采伐的林产品、可持续森林管理，制止并扭转森林丧失与退化。我们还将协作提升海洋和沿海社区的韧性，促进海洋资源的保护和管理，包括通过基于科学和技术的方式，打击非法、不报告和不受管制的捕捞，应对日益严峻的海洋垃圾挑战。\n\n　　我们致力于打造有利的营商环境，支持中小微企业和初创企业抓住机遇，增强竞争力和创新性，实现增长。我们将支持中小微企业更好地获得资本、资产、技能培训和数字工具，支持中小微企业参与区域和全球价值链，并鼓励各经济体继续为中小微企业能力建设提供支持。我们鼓励开发可及、易用且具有成本效益的产品和解决方案，帮助中小微企业提高生产力和效率、扩大市场参与、加速数字化转型，并推动经济主体从非正规经济向正规经济和全球经济转型。\n\n　　我们认识到腐败的破坏性影响，它威胁经济增长、侵蚀公众信任、损害贸易和公平竞争，使资源偏离关键领域，为有组织犯罪等非法行为创造条件。我们决心通过有效的反腐倡廉措施促进增长与繁荣，继续共同努力反腐，包括打击跨境腐败，不为腐败分子和通过腐败及非法资产牟利者提供避风港，并就资产追回和返还加强合作。\n\n　　作为我们共同努力深化亚太地区各领域合作的一部分，我们注意到2026年举行了妇女与经济、贸易、旅游、数字与人工智能、林业、粮食安全、中小企业、能源、运输、人力资源开发、财政等专业部长会议，以及数字周系列活动等其他高级别活动。我们赞赏亚太经合组织第37届外交和贸易双部长会议的成果，包括批准《奥特奥罗亚行动计划》五年审议，这些成果将作为未来合作的重要基础。\n\n　　工商界和其他利益相关方给亚太经合组织带来创造力、活力和能量，始终是我们的重要伙伴。我们期待与包括亚太经合组织工商咨询理事会和太平洋经济合作理事会在内的广大利益相关方进一步加强交流合作。\n\n　　我们衷心感谢今年东道主中华人民共和国，感谢广东省深圳市的周到安排以及市民的热情好客。我们欢迎越南(2027年)、墨西哥(2028年)、新加坡(2030年)、日本(2031年)、智利(2032年)、巴布亚新几内亚(2033年)以及秘鲁(2034年)担任未来几年亚太经合组织东道主。 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7826ed92b5","title":"APEC 1+1丨共促亚太繁荣：中国的建议与邀约","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734893.shtml","summary":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。","summary_short":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。","digest":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕","points":["17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕","在18日一系列的议程当中，APEC工商领导人峰会开幕式是最受瞩目的焦点","中国强调并始终推动开放、创新与合作"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:44:37+08:00","size":1,"keywords":[],"body":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。在18日一系列的议程当中，APEC工商领导人峰会开幕式是最受瞩目的焦点。中国强调并始终推动开放、创新与合作。这对亚太地区乃至世界会产生怎样的影响？“十五五” 规划蕴含哪些机遇惠及全球工商界？“世界湾区经济合作联盟”是什么？\r\n\n　　“十五五”规划蕴含哪些机遇惠及全球工商界？\n\n　　总台央视记者 徐卓阳：我在现场的时候感触很深。中国“十五五”和全球工商界是一体的、双向联动的。\n\n　　先说APEC对于“十五五”的意义。今年是中国第三次承办APEC，恰逢“十五五”开局之年，这场会议正是我们“十五五”开局阶段最重要的主场外交。\n\n　　再看“十五五”对于APEC能起到怎样的作用。我第一天连线时就谈到，期待来到深圳参会的嘉宾能够读懂中国质量。中国质量当中很重要的是经济质量，经济质量里很关键的一点，就是在全球经贸环境复杂多变的背景下，中国坚持以中长期规划统筹经济社会发展。这原本是我们自身发展的制度定力，而在亚太、在全球工商界眼中，这份定力正在形成一种独特的吸引力。\n\n　　就在峰会首日的工商对话上，全美商会会长克拉克谈到，地缘形势瞬息万变，企业最需要长期、稳定的信任关系。信任从哪里来？主旨演讲里提到的开放市场、广阔发展空间、互促共进的合作环境，都是大家可以信赖的支撑。\n\n　　而长期就体现在“十五五”这份规划上。五年周期对企业经营来说，是非常珍贵的定心丸，是企业求之不得的稳定预期。更大的长期则来自持续编制实施五年规划这套制度本身，“十五五”之后，还有“十六五”“十七五”，中国开放的大门只会越开越大，不会关上。\n\n　　所以对到场的全球工商界人士来说，他们收获的不只是一份合作邀约。面向未来共建亚太共同体、共促繁荣，中国有充足的诚意，在“十五五”乃至更长周期里持续敞开大门，欢迎各方伙伴前来携手合作。\n\n　　“世界湾区经济合作联盟”是什么？\n\n　　徐卓阳：这是全新的提法，非常激动人心，想象空间很大。我梳理三点理解。\n\n　　第一，全球公认的四大湾区，纽约湾区主打金融，旧金山湾区科创突出，东京湾区是历史上成熟的制造业，粤港澳大湾区起步最晚，但发展速度最快、市场潜力最大。现在湾区之间互动不少，但大多停留在企业、行业、个人这类微观层面，还缺少一个平台化的跨湾区经贸合作机制，一旦形成这样的协作平台，能够释放的能量值得期待。\n\n　　第二，这个联盟是全新的，我们都不知道长什么样子，是不是先把粤港澳大湾区的实践当作参照？我去搜了一下，大湾区已经有企业家联盟，还有会展、时尚等各类行业联盟，从官方到民间已经长出很多协同合作的载体，这些成熟经验，是不是可以为这个跨湾区新构想提供借鉴？\n\n　　接下来就是我个人最感兴趣的地方，既然这个新词是在深圳向世界提出的，向亚太提出的，接下来如果这个联盟有一个常设的理事处或者秘书处，会放在深圳吗？这会是本次APEC留给这个主办城市的一个长期的馈赠吗？是不是非常值得期待。联盟成立以后会有哪些活动？会对亚太非湾区经济体形成什么样的带动作用？给整个湾区注入什么样的新的活力？我觉得这个圈一划，有着对未来无穷的想象、无穷的力量。\n\n　　开放的共识如何转化成实际的行动？\n\n　　徐卓阳：18日的主旨演讲中提到，中国其实是一个巨大的创新实验场，天下大事，必作于细。这不就是落地嘛！华强北从改革开放发展到今天，生态已经越做越大，场所越来越新，往来的人越来越多。但是你要去看它最旺盛的生命力，还是在一个个小小的档口里面，在一些最细节的事情上面。\n\n　　《深圳特区报》上有华强北的整版报道，里面有一个细节我特别有感触。这边商户跟记者说，大厂偏好量大、技术方案成熟的订单；而来到这里的订单体量小，技术还处在起步阶段，最主要的是方案需要反复调来调去。\n\n　　在这里，大家都会非常耐心，帮你持续调试打磨。所以我觉得把小事做到极致，一个又一个小的梦想从这里起步、起飞，慢慢孕育成今天的华强北。说到大和小的关系，泰山不辞细壤，故能成其大。广阔的大市场里，一定会有这样小小的窗口；而一个个小窗口经过时间的孕育不断生长，到今天，这就是深圳这座“世界之窗”。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c30d82f0e54","title":"聚焦APEC丨亚太同心，共话合作新愿景","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734892.shtml","summary":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。","summary_short":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。","digest":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行","points":["11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行","来自亚太经合组织(APEC)21个经济体和英国、法国、德国…","从硬联通夯实物流基础，到软联通对接标准规则，再到心联通增进认同理解，互联互通不断向更深层次…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:43:15+08:00","size":1,"keywords":[],"body":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。来自亚太经合组织(APEC)21个经济体和英国、法国、德国、瑞士等13个域外经济体的2000余位政商界代表齐聚南海之滨，深入探讨亚太区域开放合作、繁荣发展大计，携手集众智、促合作、求共赢。\r\n\n　　互联互通不断走深走实\n\n　　从硬联通夯实物流基础，到软联通对接标准规则，再到心联通增进认同理解，互联互通不断向更深层次、更广领域延伸，为推进亚太自贸区建设积蓄务实力量。\n\n　　-数智合作激活创新引擎\n\n　　数字经济浪潮澎湃，数智经贸合作也成为当前APEC各方共识基础最扎实、合作氛围最浓厚的领域。工商峰会上，中外嘉宾围绕贸易数字化、人工智能、数字服务等一系列议题深入交流，探讨如何加快创新应用落地与产业深度融合。\n\n　　-共促亚太繁荣美好未来\n\n　　《2026年亚太经合组织工商领导人峰会深圳倡议》18日对外发布，呼吁深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣。这是APEC工商领导人峰会创办30年来首次以倡议形式发布成果文件。\n\n　　扎根亚太、建设亚太、造福亚太，更加开放的中国正不断以中国式现代化新成就为亚太和世界提供新机遇。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdddbdc5dd5","title":"台胞胡良昇：APEC让世界看见新时代的深圳","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734871.shtml","summary":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新网11月19日电(燕新台)11月18日至19日…","深圳，这座“创新之城”再度吸引全球目光","一句“来了就是深圳人”鼓舞人心"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:40:37+08:00","size":1,"keywords":[],"body":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳，这座“创新之城”再度吸引全球目光。\n\n　　一句“来了就是深圳人”鼓舞人心\n\n　　“今年APEC落地深圳，我感触很深。”深圳台商协会副会长、青年委员会主任委员胡良昇表示，APEC让世界看见新时代的深圳，他观察到不少海外媒体和国际博主前来深圳实地探访，都给出了真实且高度的正面评价。\n\n　　“希望本次参会的各国嘉宾在亲身体验这座城市的包容理念、发展速度与城市温度之后，能发自内心地说出那句——来了就是深圳人。”胡良昇认为，这句话“非常自豪，也非常鼓舞人心”。\r\n\n　　台湾青年能收获成长，才值得扎根\n\n　　由深圳台商协会主办的“WAY！来深圳”台湾青年深圳实习活动已连续举办近20年，累计吸引3000余名台湾在校大学生参与。\n\n　　在胡良昇看来，真正让台湾青年愿意在深圳扎根的，是这座城市的机遇与发展含金量。\n\n　　2026年，200余名台湾青年进入深圳60余家企业实习，其中科技类岗位约占四成，覆盖人工智能硬件研发、云计算技术支持、智能交通算法开发、跨境数字网络运营等细分方向。\n\n　　“台湾青年可以进入深圳科创企业一线实战、开眼界、练能力。他们看得很清楚：能在这里成长，才值得在这里扎根。”胡良昇说道。\n\n　　成长环境，决定眼界与视野\n\n　　胡良昇觉得，自己在深圳最大的收获，是身边聚集了大量优秀、敢拼敢闯的创业者与青年，多和这类人相处，自身的认知、格局、节奏都会被拉高。\n\n　　深耕科技产品出海领域多年的胡良昇，将深圳对创业者的助力总结为三点：一是高精尖人才密集，寻找团队、合作与技术伙伴效率更高；二是产业链完整、迭代速度快，产品从研发、打样到落地出海全链路效率突出；三是政府对科创产业扶持力度大、政策落地快，让创业者更敢于投入、创新并布局长期发展。\n\n　　胡良昇说，深圳一直在进化、蜕变，也推着创业者跟着这座城市一同成长。\n\n　　台湾同胞一定能“爱上深圳”\n\n　　作为在深逐梦十余年的台湾创业者，胡良昇也早已把这里当成了自己的家。一口熟悉的家乡味、一通打回台湾的视频电话……每逢节日，他总会和在深台胞们欢聚一堂。\n\n　　胡良昇也向从未到过深圳的台湾同胞发出邀请：一定要亲自到这座城市走走看看，感受这里的科技实力、商业活力、艺术氛围、生活节奏和饮食文化，找到属于自己“爱上深圳”的理由，切身感受“来了就是深圳人”的城市魅力。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfa9b5f49c6","title":"“未名·AI Park”在北京揭牌 共建人工智能创新转化高地","url":"https://www.chinanews.com.cn/edu/2026/11-19/10734878.shtml","summary":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。","summary_short":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。","digest":"“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌","points":["中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国…","“未名·AI Park”是百年京张AI创新带上的重要节点，其核心启动区选址北京大学西门外…","北京大学党委书记何光彩表示，北京大学依托深厚的基础研究和学科交叉优势…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:38:15+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。“未名·AI Park”是百年京张AI创新带上的重要节点，其核心启动区选址北京大学西门外，旨在构建服务北京大学的“一公里转化圈”，立足北京大学优势AI学科资源与海淀科创沃土，打通“原始创新—技术攻关—成果落地—产业集聚”全链条。\n\n　　“未名·AI Park”由北京大学、北京市海淀区人民政府共建。\n\n“未名·AI　Park”在北京市海淀区中关村国际创新大厦正式揭牌。主办方供图\n\n　　北京大学党委书记何光彩表示，北京大学依托深厚的基础研究和学科交叉优势，持续推动科技创新与产业创新深度融合，把园区建成北京大学科技成果转化的核心承载区、海淀人工智能产业的特色地标。\n\n　　北京市海淀区委书记王少峰表示，海淀坚持把人工智能作为现代化产业体系的龙头和引领，全力建设具有全球影响力的人工智能产业高地；依托“五方六力”科技成果转化机制，推动政府服务向科研一线延伸，共同筑牢校地共建、产城共融的创新根基。\n\n　　中关村科学城管委会副主任、海淀区副区长唐超发布“未名·AI Park”人工智能创新街区(简称未名·AI Park)，从规划背景、空间布局、生态培育三个方面作出系统阐述，打造北京大学创新成果策源地、师生创业首选地、教育科技人才一体发展示范区。\n\n　　活动现场，北京大学计算机学院AI产学研协同创新基地、北京大学具身智能系统研究中心、北京大学AI+Math国际研究中心正式亮相。多场北京大学人工智能交叉领域科创项目路演接续开展；专家学者、企业家、投资机构齐聚，围绕技术攻关、项目孵化、产业合作开展面对面对接交流。\n\n　　下一步，北京市海淀区将以“未名·AI Park”为支点，撬动更多创新资源在北大周边集聚、向海淀全域辐射，培育更多前沿技术、优质项目和高端人才；要始终当好北大创新发展的合伙人，与政产学研金等各方，一起筑牢校地共建、产城共融的创新根基，为服务国家高水平科技自立自强作出新的更大贡献。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0c7a7890b8","title":"西藏发布“十五五”妇女儿童发展规划 重点向农牧区和边境地区倾斜","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734868.shtml","summary":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。","summary_short":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。","digest":"西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行","points":["中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会1…","根据发布会上的信息，相关政策举措将向农牧区、基层、边境一线倾斜","西藏自治区妇联主席、政府妇儿工委副主任旦珍介绍，妇女、儿童发展规划分别设8个领域76项…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T20:17:01+08:00","size":1,"keywords":[],"body":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。根据发布会上的信息，相关政策举措将向农牧区、基层、边境一线倾斜。\n\n　　西藏自治区妇联主席、政府妇儿工委副主任旦珍介绍，妇女、儿童发展规划分别设8个领域76项、7个领域75项主要目标。西藏已先后制定实施5轮妇女儿童发展规划。\n\n　　“十四五”期间，西藏孕产妇系统管理率、住院分娩率分别达85.38%和99.54%；学前教育毛入园率、九年义务教育巩固率、高中阶段毛入学率分别达92.83%、98.74%和92.04%；城镇新增就业女性占比41.18%。发布会也指出，农牧区和边境地区妇幼健康服务、教育资源供给仍不够均衡。\n\n　　西藏自治区卫生健康委员会副主任国吉说，将建立稳定投入机制，向高海拔、偏远、边境地区倾斜；将对长期居住高原的儿童开展慢性缺氧风险早期筛查，防治婴幼儿高原性肺动脉高压；推进适龄女童HPV疫苗免费接种，宫颈癌筛查率达70%以上；推广出生医学证明电子证照和“新生儿出生一件事”多证联办。\r\n\n　　西藏自治区民政厅儿童福利处一级调研员来子文表示，到2030年，保持孤儿、事实无人抚养儿童保障覆盖率100%，推动孤儿、事实无人抚养儿童保障申请“跨省通办”，方便异地安置儿童及时享受救助。\n\n　　西藏自治区人民检察院副检察长张萍表示，对侵害儿童犯罪保持“零容忍”，通过制发督促监护令、开展国家司法救助介入困境未成年人帮扶。她提到，《检察公益诉讼法》将于2027年1月1日起施行，将未成年人权益保障纳入公益诉讼法定领域。\n\n　　西藏自治区农业农村厅帮扶处处长仝富军表示，支持妇女发展民族手工艺、庭院经济、家庭牧场和农村电商，带领农牧区妇女走出家门，参与“村歌”“村舞”等“村字号”大型文体活动。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"台灣","total":2,"items":[{"id":"c7d240a421a","title":"在深台胞：今年APEC落地深圳，期待世界看见新时代的深圳","url":"https://www.chinanews.com/tw/shipin/2026/11-19/news1075493.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇在接受中国新闻网“燕新台”…","他坦言，借着这场国际盛会，非常期待让全世界真正看见新时代的深圳…"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:07:57+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇在接受中国新闻网“燕新台”工作室采访时表示，他观察到不少海外媒体和国际博主前来深圳实地探访，都给出了真实且高度的正面评价。他坦言，借着这场国际盛会，非常期待让全世界真正看见新时代的深圳，也特别希望各国嘉宾在亲身体验这座城市的包容理念、发展速度与城市温度之后，能发自内心地说出那句——来了就是深圳人。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/12aefe9c-f627-4dad-a8a3-962a80a72c3d.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c47fcc72e11","title":"深圳创业十余年台胞：这座城市永远在蜕变，台湾青年一定会“爱上深圳”","url":"https://www.chinanews.com/tw/shipin/2026/11-19/news1075492.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳，这座“创新之城”再度吸引全球目光","“深圳最大的特质，就是永远不会停在过去的成绩里"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:07:48+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳，这座“创新之城”再度吸引全球目光。“深圳最大的特质，就是永远不会停在过去的成绩里。”深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇，近日在接受中国新闻网“燕新台”工作室采访时，分享了他眼中的深圳。他认为，深圳真正留住台湾青年的并非单纯的政策福利，而是这座城市不断迭代的产业和无可替代的机会含金量。他向岛内青年发出真诚邀约：亲自来体验这里的科技实力、商业活力、艺术氛围和饮食文化，一定会找到属于自己“爱上深圳”的理由。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/12af1128-76da-480c-99cc-b72180b8e65d.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"國際","total":19,"items":[{"id":"c6b887c9ee8","title":"韩国前第一夫人金建希首案终审被判有期徒刑4年","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734932.shtml","summary":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价、收受贿赂等案件作出终审判决，判处其有期徒刑4年…","summary_short":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价…","digest":"韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价…","points":["中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建…","这是韩国最高法院首次就金建希相关案件作出裁定","韩联社报道称，这是韩国宪政史上首次有前总统夫人因刑事犯罪被终审判处实刑"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T21:54:49+08:00","size":1,"keywords":[],"body":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价、收受贿赂等案件作出终审判决，判处其有期徒刑4年，并处罚金5000万韩元(约合人民币25万元)。这是韩国最高法院首次就金建希相关案件作出裁定。\r\n\n　　韩联社报道称，这是韩国宪政史上首次有前总统夫人因刑事犯罪被终审判处实刑。\n\n　　韩国最高法院当天驳回“金建希特检组”和金建希双方的抗诉和上诉，维持二审原判。就金建希从统一教方面接受请托和收受高价物品这一指控，法院认定违反《特定犯罪加重处罚法》。同时，其涉嫌操纵股价违反《资本市场法》的部分指控成立。就金建希与尹锡悦共谋，从“政治掮客”明泰均处免费获取舆论调查服务违反《政治资金法》的指控，法院维持二审无罪判决。\n\n　　2026年1月，首尔中央地方法院对此案作出一审判决，判处金建希有期徒刑1年8个月。三项指控中只有“从统一教方面接受请托和收受高价物品”被认定部分有罪，其余两项指控均被认定不成立。特检组和金建希随后分别提出抗诉及上诉。在4月二审中，首尔高等法院认定金建希违反《资本市场法》《特定犯罪加重处罚法》，以斡旋受贿罪等罪名判处其有期徒刑4年，处罚金5000万韩元，并没收其收受的高价项链及追缴2000余万韩元。\n\n　　韩联社报道称，金建希因卷入多起案件，相关审判还在进行，未来不排除被追加判处刑罚的可能。(完) 【编辑:周驰】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5f642c3f14","title":"蒙古国总统辞职申请获议会批准","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734898.shtml","summary":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。","summary_short":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。","digest":"乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议…","points":["中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议…","蒙古国国家大呼拉尔主席宾巴朝格特将代行总统职权","据蒙古国国家通讯社报道，当天出席全体会议的议员中，92.3%对总统辞职议案投赞成票"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T20:57:52+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。蒙古国国家大呼拉尔主席宾巴朝格特将代行总统职权。\n\n　　据蒙古国国家通讯社报道，当天出席全体会议的议员中，92.3%对总统辞职议案投赞成票。\n\n　　报道称，有数名议员在会上就总统辞职的原因和依据提出质询。呼日勒苏赫回应称，他只剩(辞职)一个选择，以“恢复国家元首这一崇高职位应有的尊严和声誉”。\n\n　　报道还称，部分议员在会上发言，肯定呼日勒苏赫任总统期间的工作成效。\r\n\n　　据报道，在蒙古国民主党指控包括总统在内的高级官员涉嫌“贪腐、非法窃取国家财产和任人唯亲”等行为并提出一系列要求后，呼日勒苏赫17日上午发表辞职声明，否认相关指控，表示接受调查，将通过法律途径维护声誉。\n\n　　该辞职申请18日提交国家大呼拉尔相关委员会审议并通过，19日提交国家大呼拉尔全体会议举行公开投票后获批准。呼日勒苏赫的总统职权即刻终止。\n\n　　根据蒙古国宪法规定，国家大呼拉尔批准总统辞职后，必须在4个月内举行总统选举，在20个工作日内确定并公布选举日期。国家大呼拉尔主席将代行总统职权，直至新总统宣誓就职。\n\n　　呼日勒苏赫于2021年6月就任蒙古国总统，任期6年。他是该国历史上首位主动提出辞职并提前结束任期的总统。(完) 【编辑:周驰】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0792d8c304","title":"世界觀｜AI發展與減碳可否兼得？","url":"https://news.tvb.com/tc/1207257-世界觀AI發展與減碳可否兼得","summary":"歡迎收看《世界觀》。長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時，人工智能急速發展，正推高算力的需求，數據中心不但「食電食水」，更佔用龐大土地。","summary_short":"歡迎收看《世界觀》。","digest":"世界觀｜AI發展與減碳可否兼得？","points":["長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時…","在土耳其安卡拉召開的聯合國氣候峰會，把AI列為核心議題之一","到底人工智能發展，是否只能站在環境保護的對立面"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T19:20+08:00","size":1,"keywords":[],"body":"歡迎收看《世界觀》。\n\n長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時，人工智能急速發展，正推高算力的需求，數據中心不但「食電食水」，更佔用龐大土地。在土耳其安卡拉召開的聯合國氣候峰會，把AI列為核心議題之一。到底人工智能發展，是否只能站在環境保護的對立面？\n\n聯合國氣候峰會召開之際，歐洲十多個國家本月初爆發示威，反對AI數據中心無節制擴張。\n\n蘇格蘭地球之友成員稱：「來自蘇格蘭各地的民眾來到愛丁堡，抗議計劃在全蘇格蘭各地興建人工智能數據中心，這些數據中心將對地方社區，以至全國層級產生巨大影響。」\n\n法國地方公民行動團體發言人指出：「對我們來說最重要的是，能就這數據中心項目發聲，涉及多項環境與公共衞生異常問題。」\n\n所謂AI數據中心，是專門孕育與驅動人工智能的巨型大腦工廠，裡面放滿頂級晶片，日以繼夜高速運算，多國積極興建數據中心，以搶佔AI時代的基礎設施和經濟主導權。\n\n不過，這些數據中心運算時，消耗大量電力，加上每當晶片高速運行時，散發極高熱力，要耗用大量淡水冷卻，都對環境造成負擔。\n\n哈佛大學一項研究顯示，美國超過四百座大型數據中心，一年的碳排放量，已超過整個丹麥的排放量，比先前研究估計高出兩至三倍，總耗電量達82太瓦時，足以供應近七百萬戶家庭一年的用電。\n\n值得留意的是，團隊分析的用電量及排放數據，是前年五月至去年四月間，當時AI熱潮仍未全面爆發。研究員警告，美國計劃未來增建二千座數據中心，將令排放問題更嚴峻。\n\n面對人工智能發展，可能對氣候帶來前所未有的衝擊，在土耳其安卡拉舉行的第31屆聯合國氣候峰會，首度將AI列為專門承諾議題，正式發表「安塔利亞人工智能承諾」。該承諾由東道主土耳其，與聯合國科技機構國際電信聯盟共同發起，呼籲各國政府與企業採取自願措施，以永續能源驅動人工智能，並透明揭露對環境的衝擊，同時也敦促簽署國支持更有效率的基礎建設，追蹤排放量，並擴大發展中國家使用AI的管道。\n\n不過，該倡議只屬自願性質，初期只獲包括德國、巴西和韓國在內，少數國家或地區及企業響應，人工智能發展大國美國與中國，以及OPENAI、GOOGLE等科技巨頭，都未有參與。\n\n有意見則認為，AI與環境的關係，也能由「消耗」走向「共生」，由於數據中心的運算設備，會產生大量廢熱並排入大氣，若能把這些廢熱回收再用，能減少數據中心對環境影響。國際能源署估計，如果能全面回收數據中心的廢熱，並納入供熱系統，到2030年，將足夠為約一成歐洲家庭，提供暖氣和熱水。\n\n分析認為，在AI算力高速擴張的時代，要平衡科技發展與環境保護，關鍵在於如何將龐大的能源消耗，轉化為循環資源，能否為AI永續發展找到一條務實出路，成為各地政商界一大課題。\n\n我們明天繼續《世界觀》，觀世界。\n\n點擊觀看其他集數","image":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/snapshots/f2ae01d9b2a94e0fbcb781fc5833fb09-00008.jpg","video":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/ea857a66ed494499917aee697c52fd11-53e2eae6b504ed824d74eaf8c1b18014-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/snapshots/f2ae01d9b2a94e0fbcb781fc5833fb09-00008.jpg","lang":"zh-Hant"},{"id":"cdf416c6a3c","title":"巴基斯坦在反恐行动中打死22名恐怖分子","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734843.shtml","summary":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说，巴安全部队日前在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。","summary_short":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","digest":"伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","points":["中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","综合巴基斯坦《黎明报》等媒体消息，声明称，巴安全部队于本月16日至17日开展上述反恐行动","其中在南瓦济里斯坦地区的行动中，安全部队在交火中共打死15名恐怖分子"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T19:15:44+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说，巴安全部队日前在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。\n\n　　综合巴基斯坦《黎明报》等媒体消息，声明称，巴安全部队于本月16日至17日开展上述反恐行动。其中在南瓦济里斯坦地区的行动中，安全部队在交火中共打死15名恐怖分子；在本努地区和丹格地区的行动中，安全部队打死7名恐怖分子，并在行动中缴获大量武器弹药。\n\n　　巴基斯坦三军新闻局称，这些被击毙的恐怖分子“参与了该地区多起恐怖活动”，目前清剿行动仍在继续，搜剿该地区潜藏的其他恐怖分子。同时，反恐行动将持续全力推进，旨在彻底根除恐怖主义这一祸患。\n\n　　巴基斯坦总统扎尔达里承诺，将持续开展反恐行动，直至将恐怖主义从巴基斯坦全部清除。\r\n\n　　近年来，“巴基斯坦塔利班”等恐怖组织在巴境内针对军民目标策划多起恐怖袭击，造成重大人员伤亡。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf8828a56a5","title":"韩国2026年累计出口额突破1万亿美元大关","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734799.shtml","summary":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示，韩国2026年累计出口额初步统计已超过1万亿美元(约合人民币6.7万亿元)，成为继美国、德国和中国之后…","summary_short":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示…","digest":"韩国产业通商资源部19日表示…","points":["中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示…","韩国产业通商资源部表示，自2024年以来，人工智能(AI)应用相关产品的全球贸易额增速一直高…","受AI投资热潮带动，2026年1月至10月，韩国半导体出口额同比大增193.1%…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T18:35:36+08:00","size":1,"keywords":[],"body":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示，韩国2026年累计出口额初步统计已超过1万亿美元(约合人民币6.7万亿元)，成为继美国、德国和中国之后，全球第四个实现年度出口额突破1万亿美元的国家。\r\n\n　　半导体成为主要推动力。韩国产业通商资源部表示，自2024年以来，人工智能(AI)应用相关产品的全球贸易额增速一直高于全球商品贸易整体增速。受AI投资热潮带动，2026年1月至10月，韩国半导体出口额同比大增193.1%，达到3968亿美元，占整体出口额的42.7%。\n\n　　此外，韩国其他主力产业也展现出较强竞争力。截至10月，除半导体以外的出口额同比增长20.2%，增速创近20年来新高。韩国化妆品、生物产业等具有发展潜力的消费品也为出口增长提供了支撑。\n\n　　韩国产业通商资源部长官金正官当天表示，韩国政府将集中一切力量，在发掘新的增长动力的同时，推动出口成果惠及地方经济发展，带动青年就业。\n\n　　据韩联社报道，相关专家分析称，受基数效应等因素影响，2027年韩国出口增速可能有所放缓，但预计仍能保持1万亿美元规模。同时，还应警惕半导体产业过度集中导致的产业间发展失衡，以及汇率等宏观经济环境变化、半导体产业成果带动效应不足等问题。(完) 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c641af949bb","title":"夜蛾如何辨识方向？国际最新研究发现利用地磁和星光两种罗盘导航","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734729.shtml","summary":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称，布冈夜蛾(Bogong moths)利用一种地磁罗盘帮助它们进行季节性的迁徙…","summary_short":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称…","digest":"国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称…","points":["中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表…","夏季，高山洞穴中休眠的布冈夜蛾，洞穴岩壁上每平方米约有1.7万只蛾…","春季，数十亿夜蛾从澳大利亚东南部各地出发，前往此前从未去过的1000公里外的澳大利亚阿尔卑斯…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:39+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称，布冈夜蛾(Bogong moths)利用一种地磁罗盘帮助它们进行季节性的迁徙，连同此前研究证明这些蛾子还会利用星光导航，表明此类昆虫使用地磁和星光两种内在罗盘来寻找方向。\n\n夏季，高山洞穴中休眠的布冈夜蛾，洞穴岩壁上每平方米约有1.7万只蛾，每个洞穴内有数百万只(图片来自Eric　Warrant)。施普林格·自然 供图\n\n　　论文作者认为，布冈夜蛾的磁感应能力与一些夜间迁徙的鸣禽相似，其表明相距甚远的物种可能会独立演化出类似能力。\n\n　　据论文介绍，澳大利亚的布冈夜蛾在仅一年的生命周期中有两次大规模迁徙。春季，数十亿夜蛾从澳大利亚东南部各地出发，前往此前从未去过的1000公里外的澳大利亚阿尔卑斯山，随后在秋季返回。\n\n布冈夜蛾(图片来自澳大利亚麦考瑞大学Ajay　Narendra)。施普林格·自然 供图\n\n　　此前研究表明，这些夜蛾利用星空作为指南针导航前往目的地，但星空被云层遮蔽时它们仍能正确前进。基于此，有观点提出，这是因为夜蛾能够感知和利用地球磁场，但具体机制尚未得到证实。\n\n　　在本项研究中，瑞典隆德大学、德国奥尔登堡大学的研究团队合作，捕捉了迁徙中的夜蛾，将其转移至一个封闭环境，其中布置了随机的星空(缺乏方向性线索)和一个局部磁场(可调整改变磁北极位置)。\n\n布冈夜蛾休眠洞穴附近的高山景观(图片来自Eric　Warrant)。施普林格·自然 供图\n\n　　研究显示，在没有典型夜空的情况下，蛾子能仅靠磁场继续朝向正确方向迁徙；当磁场角度调整时，它们会改变飞行方向，但磁极性(磁场南北极的方向)改变时，它们不受影响；施加微弱射频噪声和去除蓝紫光(这些因素已知会扰乱其他磁感知动物的迁徙)，都会导致夜蛾无法确定方向。\n\n　　论文作者总结表示，本项研究结果指向夜蛾的内在磁罗盘采用了基于自由基对的机制，这与夜间迁徙鸣禽中观察到的机制相似。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c279d652d49","title":"菲律宾多地高温指数达危险级别 局地达44摄氏度","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734718.shtml","summary":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数，局地高温指数达到44摄氏度。","summary_short":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数…","digest":"菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数…","points":["中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示…","据该机构消息，马斯巴特市、东萨马省博龙岸市和三宝颜市当天高温指数均达到44摄氏度","巴拉望省公主港市和库约镇达到43摄氏度"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:05+08:00","size":1,"keywords":[],"body":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数，局地高温指数达到44摄氏度。\n\n　　据该机构消息，马斯巴特市、东萨马省博龙岸市和三宝颜市当天高温指数均达到44摄氏度。巴拉望省公主港市和库约镇达到43摄氏度。另有8个地区高温指数达到42摄氏度。\n\n　　受高温天气影响，菲律宾多地19日暂停线下教学或缩短课时，以降低高温对师生健康的影响。\n\n　　菲律宾大气地球物理天文局此前预报，19日，米马罗巴地区、米沙鄢群岛和棉兰老岛的5个监测地点高温指数预计达到42至51摄氏度，处于危险级别。\r\n\n　　高温指数是结合实际气温和相对湿度计算得出的人体体感温度。菲律宾气象部门将高温指数分为四个等级：警戒级(27至32摄氏度)、高度警戒级(33至41摄氏度)、危险级(42至51摄氏度)和极端危险级(52摄氏度及以上)。\n\n　　菲律宾气象部门警告，持续暴露于危险级别高温环境可能导致热痉挛和热衰竭，长时间暴露甚至可能引发中暑。该机构提醒公众及时补充水分，尽量避免在10时至16时外出，外出时做好防晒措施。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c26b45b62ec","title":"涉嫌参与海地总统遇刺案 美国牧师或面临终身监禁","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734676.shtml","summary":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel Sanon)因涉嫌刺杀海地总统若弗内尔·莫伊兹(Jovenel Moise)…","summary_short":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel San…","digest":"涉嫌参与海地总统遇刺案 美国牧师或面临终身监禁","points":["中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christia…","综合路透社、美国《迈阿密先驱报》等媒体报道，萨农现年68岁，拥有美国和海地双重国籍","萨农被裁定所有指控全部成立，其中包括共谋杀害海地总统莫伊兹"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:43:09+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel Sanon)因涉嫌刺杀海地总统若弗内尔·莫伊兹(Jovenel Moise)，被迈阿密法官裁定有罪，可能面临终身监禁。\n\n　　综合路透社、美国《迈阿密先驱报》等媒体报道，萨农现年68岁，拥有美国和海地双重国籍。萨农被裁定所有指控全部成立，其中包括共谋杀害海地总统莫伊兹。迈阿密一家联邦法院定于2027年2月10日对其宣判量刑，萨农最高可能被判处终身监禁。\n\n　　庭审期间，萨农始终坚称自己无罪。判决公布后，其律师表示对判决结果感到失望，并称将适时提起上诉。\n\n　　2021年7月7日，海地总统莫伊兹在太子港私邸遭暗杀身亡。事发数日后，萨农在太子港被捕。警方搜查其住所时，发现8块车牌、19本护照、12部手机、30箱弹药及12个手枪枪套。\r\n\n　　莫伊兹遇刺身亡后，海地持续动荡。受政治危机、帮派暴力等因素影响，该国选举多次推迟，长期未能产生民选总统。2024年4月，海地过渡总统委员会成立，在民选总统就职前的过渡期内暂行特定总统权力。\n\n　　目前，海地总统选举首轮投票暂定于2027年7月举行，莫伊兹的遗孀玛蒂娜·莫伊兹已登记为海地总统选举候选人。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1f12d0929e","title":"沙特王储与美军中央司令部司令会谈 沙特与也门胡塞武装持续相互打击","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734656.shtml","summary":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀率领的代表团。","summary_short":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀…","digest":"综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布…","points":["中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美…","沙特和也门胡塞武装当天持续互相打击","据沙特通讯社报道，穆罕默德与库珀在会谈期间回顾双边关系，尤其是军事领域合作…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:42:35+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀率领的代表团。沙特和也门胡塞武装当天持续互相打击。\n\n　　据沙特通讯社报道，穆罕默德与库珀在会谈期间回顾双边关系，尤其是军事领域合作，讨论地区局势发展，以及促进地区安全、稳定与和平的努力。\n\n　　报道称，沙特国家安全顾问艾班、沙特武装部队总参谋长兼沙特主导的多国联军代理指挥官鲁韦利参加会谈。\n\n　　另据以色列《耶路撒冷邮报》、卡塔尔半岛电视台报道，库珀率团赴沙特会谈前，在以色列特拉维夫与以高级军事和情报官员举行会谈。以色列国防军通报称，双方讨论的重点是为应对区域安全挑战，加强军事准备和协调行动。\r\n\n　　路透社报道称，知情人士表示，本轮沙特与也门胡塞武装的冲突升级以来，沙特曾于9月向美国总统特朗普寻求军事援助，以打击胡塞武装。特朗普不同意美方直接参与打击胡塞武装，但表示将提供情报共享等援助。\n\n　　沙特民防部门19日在几小时内连续发出5次紧急情况警报，要求民众遵循安全指示，避免前往人群聚集地点。当天晚些时候，警报解除。\n\n　　沙特阿拉伯主导的多国联军发言人马利基19日在社交媒体上发布多条信息称，联军当天先后拦截并摧毁胡塞武装射向沙特南部地区的6枚导弹，并应对一起其针对沙特首都利雅得的导弹威胁。导弹碎片坠落造成财产损失，损失程度仍在评估中。\n\n　　也门胡塞武装通报称，多国联军19日对也门首都萨那的纺织厂、皮革厂，以及西南部塔伊兹省的医疗机构等民用目标发动数轮空袭。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c36dee1b62a","title":"“游历于色彩与线条之间”特别企画展在东京中国文化中心举办","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734653.shtml","summary":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心举办。","summary_short":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化…","digest":"“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心…","points":["中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别…","本次展览由东京中国文化中心策展并主办","展览汇集姜淼、吴霜、鲍蓓等中国当代一流新锐艺术家的作品，以抽象绘画为切入点，围绕色彩…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:41:45+08:00","size":1,"keywords":[],"body":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心举办。\n\n　　本次展览由东京中国文化中心策展并主办。展览汇集姜淼、吴霜、鲍蓓等中国当代一流新锐艺术家的作品，以抽象绘画为切入点，围绕色彩、线条与材料展开，呈现艺术家对绘画形式和视觉语言的多样探索。展览展期至12月25日。\n\n展览现场。中新网记者 朱晨曦 摄\n\n　　据介绍，本次展出作品虽各具面貌，却共同关注色彩、线条与材料之间的关系。作品通过色彩的交织与对照、线条的穿插与延伸，以及材料肌理的叠加和变化，共同构成画面的视觉层次。同时，线条与色块既参与画面结构的组织，也形成不同的视觉节奏。此外，材料经过覆盖、叠加、刮刻等处理，留下丰富的表面痕迹，使作品呈现出各具特点的质感。\n\n　　主办方表示，抽象艺术为艺术家提供了不同于具象描绘的表达方式，也使色彩、线条和材料本身成为画面表达的重要组成部分。艺术家并不拘泥于对具体形象的描绘，而是通过形式与材料的组合，拓展画面的表达空间。\n\n展览现场。中新网记者 朱晨曦 摄\n\n　　作为功能及定位适配化改造的重要一环，东京中国文化中心希望通过本次展览，用小而美的表达方式向日本文艺界和艺术爱好者展现鲜活的中国当代抽象艺术面貌，吸引更多日本民众了解当代中国文化、感知当代中国发展。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce10a8e0351","title":"印度一学校62名学生疑因附近沥青厂污染出现恶心和呼吸困难症状","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734747.shtml","summary":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心、呼吸困难等症状并入院，相关症状据称与学校附近一处沥青搅拌厂造成的污染有关。","summary_short":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心…","digest":"据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心…","points":["中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生…","警方表示，目前所有学生情况稳定，暂无严重健康问题","警方还表示，该工厂此前因当地居民投诉污染问题曾被关闭，后在高等法院解除停业限制后重新运营…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T17:11:33+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心、呼吸困难等症状并入院，相关症状据称与学校附近一处沥青搅拌厂造成的污染有关。\n\n　　警方表示，目前所有学生情况稳定，暂无严重健康问题。\n\n　　警方还表示，该工厂此前因当地居民投诉污染问题曾被关闭，后在高等法院解除停业限制后重新运营，此次事件发生后再次被关闭。\n\n　　事件发生后，警方和当地有关部门已介入处理。\r\n\n 【编辑:孔庆玲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c298a9635bb","titl
