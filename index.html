停火","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734987.shtml","summary":"新华社莫斯科11月19日电 俄罗斯总统普京19日表示，在克里米亚大桥遭袭后，俄方不会就海上停火或停止攻击能源设施与有关方面进行谈判。","summary_short":"新华社莫斯科11月19日电 俄罗斯总统普京19日表示，在克里米亚大桥遭袭后…","digest":"俄罗斯总统普京19日表示，在克里米亚大桥遭袭后…","points":["新华社莫斯科11月19日电 俄罗斯总统普京19日表示，在克里米亚大桥遭袭后…","据俄罗斯总统网站19日发布的消息，在回应记者关于克里米亚大桥近日多次遭袭及受损情况的提问时…","据俄媒报道，克里米亚大桥16日至18日连续三天遭到乌军袭击，致使大桥交通受到影响"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T06:05:38+08:00","size":1,"keywords":[],"body":"新华社莫斯科11月19日电 俄罗斯总统普京19日表示，在克里米亚大桥遭袭后，俄方不会就海上停火或停止攻击能源设施与有关方面进行谈判。\n\n　　据俄罗斯总统网站19日发布的消息，在回应记者关于克里米亚大桥近日多次遭袭及受损情况的提问时，普京表示，克里米亚大桥是民用设施，俄方从未通过该桥运输军事装备和弹药，也没有通过该桥运输石油及石油制品。\n\n　　普京说，俄方此前曾评估与有关方面就海上停火及停止攻击能源设施举行谈判的可能性，但克里米亚大桥再次遭袭后，俄方不会就此进行谈判。他表示，俄方将作出回应，且力度将比乌方对克里米亚大桥的攻击更大。\n\n　　据俄媒报道，克里米亚大桥16日至18日连续三天遭到乌军袭击，致使大桥交通受到影响。乌克兰总统泽连斯基17日在社交媒体发文证实，乌军使用多款无人机和“海王星”导弹对克里米亚大桥的公路和铁路设施实施了打击。\r\n\n　　克里米亚大桥连接克里米亚半岛和俄罗斯克拉斯诺达尔地区，全长19公里，由公路桥和铁路桥组成。公路桥于2018年5月开通，铁路桥于2019年12月开通，普京均出席了开通仪式。 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cba1634a815","title":"日本淺草寺｜女遊客懸掛拉扯雷門大燈籠拍照捱轟 若損毀恐招巨額賠償","url":"https://www.stheadline.com/realtime-world/3639140/日本淺草寺女遊客懸掛拉扯雷門大燈籠拍照捱轟若損毀恐招巨額賠償","summary":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。","summary_short":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。","digest":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件","points":["日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件","網上流傳片段顯示，一名外國女遊客在寫有「雷門」字樣的大燈籠下打卡時，竟將燈籠當成單槓般…","網傳片段可見，一名外國女遊客在淺草寺入口的雷門大燈籠下拍照，期間將雙手攀着燈籠底部邊緣…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T04:50:48+08:00","size":1,"keywords":[],"body":"日本東京著名景點淺草寺的「雷門」近日發生遊客不文明行為事件。網上流傳片段顯示，一名外國女遊客在寫有「雷門」字樣的大燈籠下打卡時，竟將燈籠當成單槓般，雙手攀住燈籠底部邊緣作支撐並單腳站立拍照，燈籠似被用力拉扯著，女子放手後更出現晃動，引起日本網民強烈不滿及怒轟。\n攀燈籠底部單腳打卡 放手後燈籠晃動\n網傳片段可見，一名外國女遊客在淺草寺入口的雷門大燈籠下拍照，期間將雙手攀着燈籠底部邊緣，並以此作支撐單腳站立。旁邊有人以英語大聲向女遊客叫道：「不要踫它！」女遊客聽後才放手，當她放手後，大燈籠明顯出現晃動。\n雷門大燈籠重700公斤 松下幸之助還願重建\n雷門大燈籠並非一般供人把玩的裝飾品，而是具有相當價值的傳統工藝品，高約3.9米、寬約3.3米，重達700公斤。據悉，這座大門與大燈籠曾於1865年因火災燒毀，消失近100年後，松下電器創辦人松下幸之助向淺草寺祈求膝關節痛痊癒並應驗，於1960年還願捐款重建。\n據了解，雷門大燈籠每隔約10年更換一次，即使體積較小的小舟町大燈籠，重量也超過400公斤，製作成本更高達五、六百萬日圓（約24萬至29萬港元）。由於大型燈籠主要採用傳統和紙及竹材製作，並非堅固耐磨的金屬結構，若遭人反覆觸摸、拉扯或施加外力，極易造成表面污損甚至結構受損。\n網民擔心，即使未有當場破裂，後續修復也可能涉及高昂費用，若真造成嚴重損毀，更可能衍生巨額賠償責任。\n批欠缺對宗教場所尊重 日網民斥當作遊樂場設施\n除了財物損失，部分日本網民也認為，遊客在寺廟內做出倒立、懸掛等誇張動作，反映對當地宗教場所缺乏基本尊重。在日本文化中，寺廟及神社是承載信仰且充滿敬畏之心的場所，不應被當成供人嬉戲或製造社交平台話題的背景。\n片段在網上流傳後，日本網民紛紛留言表達憤怒，有人直言「我不希望那些玩弄日本人珍視之物的外國人來日本旅遊」，亦有人呼籲「不了解日本文化的外國人，請勿入內！」。\n此外，不少網民批評行為離譜，留言稱「外國人啊？社會公害……他們為甚麼要吊在上面……那不是遊樂場設施？蠢到我都無言了」，甚至有激進留言辱罵：「滾出日本，笨蛋！」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf3f749314b","title":"南韓高考｜今屆發現98人違規 5人用智能設備作弊","url":"https://www.stheadline.com/realtime-world/3639045/南韓高考今屆發現98人違規-5人用智能設備作弊","summary":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考），南韓政府出「奇招」嚴防作弊，全日共發現98 人違規，包括5人利用智慧型設備作弊。","summary_short":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考）…","digest":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試…","points":["南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試…","韓媒報道，今屆共有55萬人報考，教育部官員晚上開記者會通報…","相關新聞：南韓高考︱懸賞59萬元捉AI作弊 發災難短訊排查手機 鈕扣須貼紙防偷拍"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:04:20+08:00","size":1,"keywords":[],"body":"南韓於2026年11月19日舉行「2027學年度大學修學能力試驗」（簡稱修能試，即南韓高考），南韓政府出「奇招」嚴防作弊，全日共發現98 人違規，包括5人利用智慧型設備作弊。韓媒報道，今屆共有55萬人報考，教育部官員晚上開記者會通報，初步統計共發現98宗違反考試規則的行為。\n相關新聞：南韓高考︱懸賞59萬元捉AI作弊 發災難短訊排查手機 鈕扣須貼紙防偷拍\n其中，有44名考生被發現攜帶手機或其他電子設備，部分是當局發送強制手機發出聲響的災難警報，揪出沒有交出手機的學生，2人是透過首爾考場的Wi-Fi信號監測抓獲。\n有人用AI眼鏡、微型攝影機\n令人關注的是5名考生使用智慧型設備作弊。忠清南道考區一名考生配戴並使用AI智能眼鏡，這類眼鏡可掃描試卷並利用AI生成答案。京畿道考區一名考生被發現身上藏有微型攝影機及無線藍牙耳機。首爾考區一名考生直接在考場使用智能手機拍攝考試試卷。另首爾和京畿道考區各1宗考生在考試途中前往洗手間偷用智能手機。\n\n相關新聞：南韓稅務師狀元自首 認用微型相機＋AI作弊\n\n南韓近年頻頻發生高科技設備與AI作弊事件，包括10月延世大學等入學試有人用智能眼鏡作弊，就連稅務師國考榜首也承認用微型相機、手機與雲端AI解題作弊。\n逐粒鈕貼貼紙防偷拍\n當局針對修能試祭出「史上最嚴格」的防弊新規，除突擊防災警報，為防考生衣服內藏微型攝影機，監考官要求考生捲起衣袖、衣領作檢查，衣服上每一顆鈕扣都要用貼紙遮蓋；一批監考員特別接受智能眼鏡識別訓練。考場及周邊地區也從考前一天起臨時屏蔽Wi-Fi訊號。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0832dbe660","title":"（深圳APEC）外媒聚焦APEC：开放合作为亚太发展凝聚共识","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734981.shtml","summary":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。","summary_short":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。","digest":"综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳…","points":["中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日…","多家外媒聚焦深圳科技创新与城市发展，关注会议释放的开放合作信号，认为维护贸易开放…","本次会议举办地深圳成为海外媒体关注话题之一"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T23:45:35+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 综合消息：亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在中国深圳举行。多家外媒聚焦深圳科技创新与城市发展，关注会议释放的开放合作信号，认为维护贸易开放、深化区域合作、推动创新发展，仍是亚太经济体的共同关切。\r\n\n　　本次会议举办地深圳成为海外媒体关注话题之一。美国有线电视新闻网以“奇迹之城”介绍深圳，通过无人驾驶出租车、无人机送餐、智能城市设施等生活场景，展现深圳科技创新与城市发展的活力。\n\n　　美联社文章援引业内人士观点称，深圳展现了中国速度以及中国在效率和创新方面的活力。英国《卫报》指出，深圳是中国借APEC向世界展示发展成就的重要窗口。\n\n　　欧洲《现代外交》杂志网站对本次会议三大优先领域作出解读，认为“开放”是对日益高涨的贸易保护主义、日益加剧的经济碎片化的直接回应；“创新”是数字化转型和人工智能时代的新经济增长引擎；“合作”则是亚太经合组织基于共识自愿承诺的原则。\n\n　　新加坡《联合早报》的报道称，在全球经济日益分化、贸易紧张局势持续以及科技变革带来新安全挑战的背景下，各经济体领导人探讨如何深化区域经济一体化、加强互联互通，以及推动创新和数字化转型，促进亚太地区可持续和包容增长。\n\n　　新加坡亚洲新闻台援引亚太经合组织秘书处执行主任爱德华多·佩德罗萨的话说，本次会议关注供应链的韧性、应对全球经济失衡和人工智能合作。“对话过程本身是亚太经合组织工作的重要组成部分，它可以让各经济体更好地了解彼此，并找到各自体系协调运作的方式。”\n\n　　厄瓜多尔Pressenza国际通讯社指出，参会的智利、秘鲁、墨西哥三国经济结构各异，但都与国际市场和太平洋供应链有着重要的联系。对他们而言，挑战不仅在于能否销售更多产品，发展工业能力、培养专业人才、开展应用研究以及加强国内供应商队伍建设也同样重要。\n\n　　智利《塔尔卡日报》援引智利安第斯大学专家佩德罗·亚科贝利的话说，“亚太地区是非常重要的经济共同体，它改变了我们对海洋的认识。海洋不再是阻碍，而是一种沟通手段。”他认为，亚太经合组织的优势是灵活性和适应性，并为各经济体、商界领袖和学者提供一个讨论贸易和投资的平台。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b887c9ee8","title":"韩国前第一夫人金建希首案终审被判有期徒刑4年","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734932.shtml","summary":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价、收受贿赂等案件作出终审判决，判处其有期徒刑4年…","summary_short":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价…","digest":"韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价…","points":["中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建…","这是韩国最高法院首次就金建希相关案件作出裁定","韩联社报道称，这是韩国宪政史上首次有前总统夫人因刑事犯罪被终审判处实刑"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T21:54:49+08:00","size":1,"keywords":[],"body":"中新社首尔11月19日电(金旭 林珺)韩国大法院(最高法院)19日就韩国前总统尹锡悦妻子金建希涉嫌操纵股价、收受贿赂等案件作出终审判决，判处其有期徒刑4年，并处罚金5000万韩元(约合人民币25万元)。这是韩国最高法院首次就金建希相关案件作出裁定。\r\n\n　　韩联社报道称，这是韩国宪政史上首次有前总统夫人因刑事犯罪被终审判处实刑。\n\n　　韩国最高法院当天驳回“金建希特检组”和金建希双方的抗诉和上诉，维持二审原判。就金建希从统一教方面接受请托和收受高价物品这一指控，法院认定违反《特定犯罪加重处罚法》。同时，其涉嫌操纵股价违反《资本市场法》的部分指控成立。就金建希与尹锡悦共谋，从“政治掮客”明泰均处免费获取舆论调查服务违反《政治资金法》的指控，法院维持二审无罪判决。\n\n　　2026年1月，首尔中央地方法院对此案作出一审判决，判处金建希有期徒刑1年8个月。三项指控中只有“从统一教方面接受请托和收受高价物品”被认定部分有罪，其余两项指控均被认定不成立。特检组和金建希随后分别提出抗诉及上诉。在4月二审中，首尔高等法院认定金建希违反《资本市场法》《特定犯罪加重处罚法》，以斡旋受贿罪等罪名判处其有期徒刑4年，处罚金5000万韩元，并没收其收受的高价项链及追缴2000余万韩元。\n\n　　韩联社报道称，金建希因卷入多起案件，相关审判还在进行，未来不排除被追加判处刑罚的可能。(完) 【编辑:周驰】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c81f72e7b4b","title":"羅興亞難民｜國際法院裁定緬甸「種族滅絕」 創主權國家定罪首例","url":"https://www.stheadline.com/realtime-world/3639018/羅興亞難民國際法院裁定緬甸種族滅絕-創主權國家定罪首例","summary":"聯合國「國際法院」（ICJ）在荷蘭海牙作出歷史性終極判決，正式認定緬甸在2017年針對少數民族羅興亞人（Rohingya）的軍事鎮壓行動中犯下了種族滅絕罪，成為國際法院成立80年來…","summary_short":"聯合國「國際法院」（ICJ）在荷蘭海牙作出歷史性終極判決，正式認定緬甸在2017年針對少數民族羅興亞人（Rohingya…","digest":"聯合國「國際法院」在荷蘭海牙作出歷史性終極判決…","points":["聯合國「國際法院」（ICJ）在荷蘭海牙作出歷史性終極判決…","有證據支持緬軍清洗殺害1萬人","由15名法官組成的合議庭，最終以 9票贊成、6票反對…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T21:53:28+08:00","size":1,"keywords":[],"body":"聯合國「國際法院」（ICJ）在荷蘭海牙作出歷史性終極判決，正式認定緬甸在2017年針對少數民族羅興亞人（Rohingya）的軍事鎮壓行動中犯下了種族滅絕罪，成為國際法院成立80年來，認定單一主權國家犯下種族滅絕罪的首例。\n有證據支持緬軍清洗殺害1萬人\n由15名法官組成的合議庭，最終以 9票贊成、6票反對，裁定緬甸在若開邦北部對羅興亞人實施了種族滅絕，嚴重違反1948年《防止及懲治危害種族罪公約》。\n\n國際法院院長岩澤雄司（Yuji Iwasawa）花了3小時讀判詞，指出有證據支持緬軍在2017年清洗行動中，暴力殺害了約1萬名羅興亞人。法院認為緬甸的暴行規模與本質「遠遠超出了懲罰該群體所需的限度」，其摧毀羅興亞人村莊並隨後由非羅興亞族群人口取代等行為，唯一的合理推論就是「意圖消滅若開邦北部相當部分的羅興亞族群」。\n首次認定性暴力為種族滅絕手段\n緬甸當局聲稱該行動是「合法的反恐清剿行動」，遭法院明確駁回。判詞中詳述了緬甸安全部隊殺害數千平民、對婦女實施廣泛的性暴力，以及對兒童施加極端暴力、攻擊大批逃亡中的難民等令人髮指的惡行。這也是國際永久法庭首次將性暴力認定為種族滅絕手段之一。\n法院下令緬甸政府必須批准並協助目前流離失所的羅興亞人，安全、自願且有尊嚴地返回原居地，並與家人團聚。並須對羅興亞人進行賠償，包括恢復完整公民身分及權利等，具體賠償金額日後判定。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5f642c3f14","title":"蒙古国总统辞职申请获议会批准","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734898.shtml","summary":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。","summary_short":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。","digest":"乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议…","points":["中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议…","蒙古国国家大呼拉尔主席宾巴朝格特将代行总统职权","据蒙古国国家通讯社报道，当天出席全体会议的议员中，92.3%对总统辞职议案投赞成票"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T20:57:52+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 乌兰巴托消息：蒙古国国家大呼拉尔(议会)19日召开全体会议，表决批准呼日勒苏赫辞去总统职务。蒙古国国家大呼拉尔主席宾巴朝格特将代行总统职权。\n\n　　据蒙古国国家通讯社报道，当天出席全体会议的议员中，92.3%对总统辞职议案投赞成票。\n\n　　报道称，有数名议员在会上就总统辞职的原因和依据提出质询。呼日勒苏赫回应称，他只剩(辞职)一个选择，以“恢复国家元首这一崇高职位应有的尊严和声誉”。\n\n　　报道还称，部分议员在会上发言，肯定呼日勒苏赫任总统期间的工作成效。\r\n\n　　据报道，在蒙古国民主党指控包括总统在内的高级官员涉嫌“贪腐、非法窃取国家财产和任人唯亲”等行为并提出一系列要求后，呼日勒苏赫17日上午发表辞职声明，否认相关指控，表示接受调查，将通过法律途径维护声誉。\n\n　　该辞职申请18日提交国家大呼拉尔相关委员会审议并通过，19日提交国家大呼拉尔全体会议举行公开投票后获批准。呼日勒苏赫的总统职权即刻终止。\n\n　　根据蒙古国宪法规定，国家大呼拉尔批准总统辞职后，必须在4个月内举行总统选举，在20个工作日内确定并公布选举日期。国家大呼拉尔主席将代行总统职权，直至新总统宣誓就职。\n\n　　呼日勒苏赫于2021年6月就任蒙古国总统，任期6年。他是该国历史上首位主动提出辞职并提前结束任期的总统。(完) 【编辑:周驰】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0792d8c304","title":"世界觀｜AI發展與減碳可否兼得？","url":"https://news.tvb.com/tc/1207257-世界觀AI發展與減碳可否兼得","summary":"歡迎收看《世界觀》。長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時，人工智能急速發展，正推高算力的需求，數據中心不但「食電食水」，更佔用龐大土地。","summary_short":"歡迎收看《世界觀》。","digest":"世界觀｜AI發展與減碳可否兼得？","points":["長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時…","在土耳其安卡拉召開的聯合國氣候峰會，把AI列為核心議題之一","到底人工智能發展，是否只能站在環境保護的對立面"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T19:20+08:00","size":1,"keywords":[],"body":"歡迎收看《世界觀》。\n\n長久以來，大家一直提倡要減少碳足跡，節省用電、多回收來保護地球，但與此同時，人工智能急速發展，正推高算力的需求，數據中心不但「食電食水」，更佔用龐大土地。在土耳其安卡拉召開的聯合國氣候峰會，把AI列為核心議題之一。到底人工智能發展，是否只能站在環境保護的對立面？\n\n聯合國氣候峰會召開之際，歐洲十多個國家本月初爆發示威，反對AI數據中心無節制擴張。\n\n蘇格蘭地球之友成員稱：「來自蘇格蘭各地的民眾來到愛丁堡，抗議計劃在全蘇格蘭各地興建人工智能數據中心，這些數據中心將對地方社區，以至全國層級產生巨大影響。」\n\n法國地方公民行動團體發言人指出：「對我們來說最重要的是，能就這數據中心項目發聲，涉及多項環境與公共衞生異常問題。」\n\n所謂AI數據中心，是專門孕育與驅動人工智能的巨型大腦工廠，裡面放滿頂級晶片，日以繼夜高速運算，多國積極興建數據中心，以搶佔AI時代的基礎設施和經濟主導權。\n\n不過，這些數據中心運算時，消耗大量電力，加上每當晶片高速運行時，散發極高熱力，要耗用大量淡水冷卻，都對環境造成負擔。\n\n哈佛大學一項研究顯示，美國超過四百座大型數據中心，一年的碳排放量，已超過整個丹麥的排放量，比先前研究估計高出兩至三倍，總耗電量達82太瓦時，足以供應近七百萬戶家庭一年的用電。\n\n值得留意的是，團隊分析的用電量及排放數據，是前年五月至去年四月間，當時AI熱潮仍未全面爆發。研究員警告，美國計劃未來增建二千座數據中心，將令排放問題更嚴峻。\n\n面對人工智能發展，可能對氣候帶來前所未有的衝擊，在土耳其安卡拉舉行的第31屆聯合國氣候峰會，首度將AI列為專門承諾議題，正式發表「安塔利亞人工智能承諾」。該承諾由東道主土耳其，與聯合國科技機構國際電信聯盟共同發起，呼籲各國政府與企業採取自願措施，以永續能源驅動人工智能，並透明揭露對環境的衝擊，同時也敦促簽署國支持更有效率的基礎建設，追蹤排放量，並擴大發展中國家使用AI的管道。\n\n不過，該倡議只屬自願性質，初期只獲包括德國、巴西和韓國在內，少數國家或地區及企業響應，人工智能發展大國美國與中國，以及OPENAI、GOOGLE等科技巨頭，都未有參與。\n\n有意見則認為，AI與環境的關係，也能由「消耗」走向「共生」，由於數據中心的運算設備，會產生大量廢熱並排入大氣，若能把這些廢熱回收再用，能減少數據中心對環境影響。國際能源署估計，如果能全面回收數據中心的廢熱，並納入供熱系統，到2030年，將足夠為約一成歐洲家庭，提供暖氣和熱水。\n\n分析認為，在AI算力高速擴張的時代，要平衡科技發展與環境保護，關鍵在於如何將龐大的能源消耗，轉化為循環資源，能否為AI永續發展找到一條務實出路，成為各地政商界一大課題。\n\n我們明天繼續《世界觀》，觀世界。\n\n點擊觀看其他集數","image":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/snapshots/f2ae01d9b2a94e0fbcb781fc5833fb09-00008.jpg","video":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/ea857a66ed494499917aee697c52fd11-53e2eae6b504ed824d74eaf8c1b18014-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/355064dc24e1455aa0758bf13e2ba7f0/snapshots/f2ae01d9b2a94e0fbcb781fc5833fb09-00008.jpg","lang":"zh-Hant"},{"id":"cdf416c6a3c","title":"巴基斯坦在反恐行动中打死22名恐怖分子","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734843.shtml","summary":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说，巴安全部队日前在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。","summary_short":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","digest":"伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","points":["中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","综合巴基斯坦《黎明报》等媒体消息，声明称，巴安全部队于本月16日至17日开展上述反恐行动","其中在南瓦济里斯坦地区的行动中，安全部队在交火中共打死15名恐怖分子"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T19:15:44+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说，巴安全部队日前在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。\n\n　　综合巴基斯坦《黎明报》等媒体消息，声明称，巴安全部队于本月16日至17日开展上述反恐行动。其中在南瓦济里斯坦地区的行动中，安全部队在交火中共打死15名恐怖分子；在本努地区和丹格地区的行动中，安全部队打死7名恐怖分子，并在行动中缴获大量武器弹药。\n\n　　巴基斯坦三军新闻局称，这些被击毙的恐怖分子“参与了该地区多起恐怖活动”，目前清剿行动仍在继续，搜剿该地区潜藏的其他恐怖分子。同时，反恐行动将持续全力推进，旨在彻底根除恐怖主义这一祸患。\n\n　　巴基斯坦总统扎尔达里承诺，将持续开展反恐行动，直至将恐怖主义从巴基斯坦全部清除。\r\n\n　　近年来，“巴基斯坦塔利班”等恐怖组织在巴境内针对军民目标策划多起恐怖袭击，造成重大人员伤亡。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc8806c0028","title":"俄轟炸機近日於越南出現 分析指俄方在APEC會議期間展示實力","url":"https://news.tvb.com/tc/1207333-俄轟炸機近日於越南出現分析指俄方在APEC會議期間展示實力","summary":"俄羅斯兩架戰略轟炸機，近日在越南出現。兩架具有核打擊能力的俄羅斯圖-95型戰略轟炸機，周三在越南峴港一個機場出現，周四離開。","summary_short":"俄羅斯兩架戰略轟炸機，近日在越南出現。","digest":"俄羅斯兩架戰略轟炸機，近日在越南出現","points":["兩架具有核打擊能力的俄羅斯圖-95型戰略轟炸機，周三在越南峴港一個機場出現，周四離開","正值俄羅斯總統普京到深圳出席亞太經合組織(APEC)會議，和中俄美元首會晤等活動…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:54:00+08:00","size":1,"keywords":["俄羅斯","越南","戰略轟炸機","APEC 2026"],"body":"俄羅斯兩架戰略轟炸機，近日在越南出現。\n\n兩架具有核打擊能力的俄羅斯圖-95型戰略轟炸機，周三在越南峴港一個機場出現，周四離開。\n\n正值俄羅斯總統普京到深圳出席亞太經合組織(APEC)會議，和中俄美元首會晤等活動，有分析認為，俄方此時派轟炸機到越南，是向外界展示俄方對東亞具有影響力。","image":"/_nuxt/default.R189UE3B.jpg","video":"https://pro-vod-cdn.tvb.com/9ef0f2c88c864b469d827922c9532cac/34184e1097694581a428bf6403a2c308-b569d3ab7cbf169268b15a32a181649b-sd.m3u8","video_poster":"/_nuxt/default.R189UE3B.jpg","lang":"zh-Hant"}]},{"name":"民生","total":42,"items":[{"id":"cd87ef34d22","title":"老挝华文学校校长许顺宏：华文教育打开当地求学者的发展新空间","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075518.shtml","summary":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","summary_short":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","digest":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行","points":["11月18日至19日，第六届世界华文教育大会在海南博鳌举行","据老挝万象中老友谊学校校长、老挝中文职业教育发展培训中心主任许顺宏介绍，中老铁路开通后…","华文学校在做好华文基础教育的同时，紧扣市场需求，培养“中文+旅游”“中文+电力”“中文+矿业…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T08:24:24+08:00","size":1,"keywords":[],"body":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。\n\n据老挝万象中老友谊学校校长、老挝中文职业教育发展培训中心主任许顺宏介绍，中老铁路开通后，许多中国人到老挝投资、创业、旅游，中资企业大量涌入，华文教育正顺势谋求转型。华文学校在做好华文基础教育的同时，紧扣市场需求，培养“中文+旅游”“中文+电力”“中文+矿业”等复合型人才。老挝掀起“中文热”，当地民众学习中文，早已不局限于掌握一门语言，而是将其视作一种谋生手段、一门技能。(记者 李宇凡 刘洋）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/ABD74AE65C534A3D81FED11D0F4C8CC3.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf54f6d61be","title":"AI走进大学课堂：教什么，怎么教","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735011.shtml","summary":"在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词，让AI生成一个餐馆介绍页面，台下同学跟着操作。","summary_short":"在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词，让AI生成一个餐馆介绍页面，台下同学跟着操作。","digest":"在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词…","points":["在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词…","同样的提示词，该校新闻学专业的郭金梦生成的页面怎么都和老师的不一样","中南大学计算机学院2023级本科生孔禹程，大三时选修了学校信息与网络中心主任奎晓燕教授新开设…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:21:29+08:00","size":1,"keywords":[],"body":"在湖南一所高校的《网页设计与制作》课堂上，老师站在讲台上实时输入提示词，让AI生成一个餐馆介绍页面，台下同学跟着操作。同样的提示词，该校新闻学专业的郭金梦生成的页面怎么都和老师的不一样。“没办法，AI生成的内容具有随机性。”她说，“所以老师只教我们搭大框架，具体的细节需要我们自己尝试和AI沟通。”\r\n\n　　近日，中国青年报·中青校媒就AI引入大学课堂的体验与效果展开问卷调查，共回收有效问卷4763份，其中72.27%受访者的专业不直接与人工智能、计算机相关。结果显示，AI课程正在以不同形态进入高校课堂，39.16%受访者修读过AI通识课，28.89%受访者修读过在专业课中嵌入AI模块或工具的课程，19.42%受访者修读过由不同学科老师共同完成的AI融合课。\n\n　　AI进课堂，有的教“工具”，有的教“思维”\n\n　　中南大学计算机学院2023级本科生孔禹程，大三时选修了学校信息与网络中心主任奎晓燕教授新开设的通识教育示范选修课程“邂逅人工智能时代”。这门课不容易选上，“第一次开课后，校园集市里上过课的同学都在夸，我就下决心要选”。他第一轮没抢到，开学第二周在选课系统里发现有补选名额，才补选成功。\n\n　　开课前，孔禹程以为这门课会像很多公选课一样，系统讲AI概念和算法，实际却是一个个专题：数据可视化、AI绘图、医学智能影像……“14位老师分别授课，每位老师结合自己的专业方向解读不一样的‘AI+’，我们自己很难了解到这么广的知识”。\n\n　　但课程团队自己清楚，第一轮开课“教浅了”。中南大学计算机学院教师刘逸峰介绍，首次开课时团队把内容重点放在如何正确使用提示词上，课程过半发现问题：“提示词太基础。同样的模型，有人用得好，有人一窍不通，差别不只在提示词，更在于有没有解决问题的能力。在通用人工智能时代，‘AI+’的核心是‘+’后面的内容，要和具体场景深度融合。”课程由此转向包括数据思维、连接思维、计算思维、流程思维等在内的底层思维与“为谁做”“做什么”“怎么做”的社会责任感培养。\n\n　　中青校媒调查显示，在修读AI相关课程的受访大学生中，有68.01%受访者所学课程涉及专业融合(AI用于专业课程学习、科研、作业或项目)，61.32%涉及思维素养(理解AI能做什么、不能做什么、如何判断)，50.98%涉及工具扫盲(学习AI工具的基本操作)，42.71%涉及就业准备(了解并学习目标岗位AI能力要求与求职准备)，27.64%为通识启蒙(了解概念、消除陌生感)，25.52%涉及伦理与批判(AI的风险、伦理与社会影响)。\n\n　　福建师范大学播音与主持艺术专业副教授卢佳音，把“即兴口语创作”的课程名字改成了“AI时代的即兴口语创作”。她的理由是：学生一出校门就要面对全面嵌入AI的工作流程——选题策划、内容准备、文稿写作、视频切片、营销策略、传播复盘、Skill复用。由此，课程在原有主体能力之外，新增了一块“人机协同的能力”。\n\n　　卢佳音在课堂上教的AI工具非常多，有的课上用，有的课后用。AI工具“得到大脑”可以处理音频，她在课堂上示范如何学习运用它整理口语逻辑；结合真实项目，教学生让WorkBuddy在本地文件夹里工作、建知识库，也是她教学中的一环。卢佳音联合福建省文化科技特派团，带学生到福建泰宁开展文旅直播。她会先带着学生建知识库：把历史、人文、地理、政策等背景资料统统放进去，再去采访专家、讲解员、融媒体中心的工作人员，把这些采访到的语音内容也放进知识库；然后有的同学使用Kimi，有的使用DeepSeek，用对话在知识库里生成多个选题方案，再综合选择判断。\n\n　　郭金梦的专业选修课“网页设计与制作”，前八周学网页制作基本知识，后八周侧重于用AI制作网页，实践部分的考察重点，是最后制作的网页是否符合要求。在制作网页的过程中，她遇到过代码报错、越改越乱的情况。上千行代码她看不懂，只能让AI自己修复；修复出来能不能用，也是一个未知数。尽管理论课上老师教过相关知识，但“比较浅”，老师的目的是让学生能看懂代码。“真的上手修改，不如交给AI，一个不行就换另一个。”\n\n　　“使用工具归根到底是为了提升效率。”在刘逸峰看来，工具可以是软件、大模型、智能体，但只有看懂事情的本质，才知道用什么工具提升效率。这正是他希望学生通过这门课领悟的道理。\n\n　　有人改造工具，有人只能“抽卡”\n\n　　类似的“AI+”课程，郭金梦还选了一门“新媒体创作与实践”。其中部分教学内容涉及AI视频提示词的写法——“比如你要描述一个动作，不能只说‘弯腰捡东西’，必须精确到多少度、脸侧向哪边、光影怎么打等”。而再精细的讲解也只能停留在PPT上。郭金梦说，由于AIGC生成类软件费用较高，老师在课上没有进行实操讲解。\n\n　　这门课的个人作业是创建一个自媒体账号并提交代表作。郭金梦决定用AI制作视频发在自己的社交媒体平台上。为了“起号”，她必须保证更新频率；由于资金受限，她盯上了豆包每天的免费额度。她用“痛苦”来形容每天的“抽卡”活动。“输出的内容太不稳定了，但无论好坏，生成每条视频又会确确实实扣我的额度。”\n\n　　在免费模型和有限额度的制约下，郭金梦只能妥协，“只要说得过去，我就不会太过纠结”。但无论是网页作品还是自媒体视频，她对自己的作品都不满意：“网页细节处理不到位，我没法修改；视频主要是模型的问题，免费的没办法做得那么精细。”\n\n　　在对AI相关课程满意度的调查中，评价最高的是“学习后将AI用于本专业研究、实践的能力”和“教师对AI新工具、新进展的掌握”；“教学内容与专业的结合度”“实践操作与动手机会”等相对靠后。不过，当下，已有高校师生开始利用AI自主搭建学习平台。\n\n　　在山东大学考古学院，大四学生张天翊从5米见方的虚拟探方中清理出一具人类骨骼，随后进行形态学测量与鉴定。这个名为“人类骨骼考古虚拟仿真实验教学项目”的平台，是山东大学虚拟仿真实验教学共享平台下的开源项目，校内学生可在线完成从发掘到基础研究的流程。通过该平台，田野考古的真实工作场景被完整复刻进虚拟场景，学生尚未参与发掘，便已“预知”了真实的工作现场。\n\n　　感受到了AI的高效，张天翊开始自己尝试应用AI解决学习、科研当中的问题。她所在的一支团队探索陶片数字拼合，应用AI工具，对陶片扫描、拼合、计算和修复中的实际痛点进行了创新。在她看来，工具会过时，但在使用、改造工具过程中培养的问题导向思维不会过时。\n\n　　福建师范大学中华文化传承与两岸融合发展数智实验室研究员邵的湾和学生也自建了一个名为“会通”的课程平台。他们把几十本适合本科生的跨文化传播专著、教材和跨文化传播的具体案例“喂”给AI，由AI生成理论卡，每张卡写明理论怎么用、结合案例怎么推进、出自哪些参考书目。“会通”平台在“跨文化传播”这门项目制课程里得到了充分运用。\n\n　　从边学边教，到边教边改\n\n　　卢佳音在给学生做口播生成练习时发现，学生用AI的方式大致有三种：一是直接说“你帮我生成一个什么样的内容”；二是先列出出镜口语的几个特点，请AI从这些角度生成；三是前两种都试过、发现生成的东西不对，于是把与主题有关的内容全部交给AI，让它先理解，再把自己不理解的问题提给AI、请它解释，直到充分理解相关选题后，再让AI生成——此时AI很快就知道该怎么改，最后再将文案调整成学生的个人风格。\n\n　　让卢佳音意外的是比例：“90%的同学用的是第一种和第二种，做得特别好的那个学生用的是第三种。”这次观察直接促使她改了教案——方向转为“怎么跟AI提问、怎么让AI加深理解”。\n\n　　此外，卢佳音发现AI使用的差别还体现在知识组织上。她评价一份关于直播策划的学生作业做得“非常扁平”，原因是知识库“没建好”。她的建议是：“先和AI讨论知识库该有哪些结构层次、哪些维度的内容用哪个AI找，建好知识库，再回来讨论策划。”\n\n　　基于学生掌握AI的程度不一，卢佳音已经在尝试做课堂层面的分层。在全媒体传播微专业的AIGC视听模块，她给自己的定位是“提供机会和渠道的人”。由于自己不会做AIGC，她请来业界人士给做得好的学生辅导，再推荐学生去AI公司实习，让实习回来的同学担任这门课的助教，共同讨论这门课到底怎么上。\n\n　　卢佳音的“边教边改”和自己的成长有关。去年带着学生用AI写脚本，她能给的反馈只有“你生成的脚本不行、提问方式不对”；那时她还不会做工作流，也不会建知识库。她说：“今年才到这个水平，下学期不知道又会怎么想。”\n\n　　在卢佳音看来，非计算机专业背景的老师要学会“教AI”，最难的不在工具，在观察：“我得花很多时间观察学生在人机协作过程中的难点。学生与AI协作的过程是个人化的、隐蔽的，老师要有敏感度。”她因此不把自己放在“教”的位置：“我一直不觉得是‘老师教学生’，我就是在分享使用经验——学生做得比我好，我发现他做得好的地方，然后把它放大。”\n\n　　“在AI面前我们都是同龄人。”卢佳音对学生说，“我不见得全对，也可能不够好；你们有更好的办法，大家一起交流。”\n\n　　调查数据显示，在被问及“如何加强AI教育”时，受访者的选择中，“开设分层次课程(零基础/进阶分开)”以55.55%排在第一位，“完善教学体系，增强AI相关专业师资力量”占52.53%，“加强AI与专业的融合课程”占51.84%，“引入企业真实案例与行业导师”占39.39%；此外，“用好智慧教室/线上平台，提供个性化学习资源”“提升教师AI素养与教学培训”“增加实践操作与项目式学习”“开设AI工具工作坊、训练营”“完善AI学习社群与朋辈互助”等，也是受访大学生认为有助于加强AI教育的举措。\n\n　　邵的湾判断学生“会不会”的方式，和卢佳音不同。“把PPT拍照“喂”给AI、直接提问事件梳理，与注入理论并加上反思性提示词，产出的报告质量差别很大。AI报告反而能验证课堂知识的消化程度。”她把这种做法称为“反验证”。此外，她要求学生在作业中像列参考文献一样单列“AI使用情况页”，逐条写明哪些是AI做的；还常问学生“AI有没有给到你惊喜”——比如要求5点却生成第6点，以此拉开理论思维的差距。\n\n　　中青校媒调查显示，受访大学生认为最理想的AI课程内容是“专业融合课——教AI如何服务于本专业”(58.39%)、“思维素养课——AI用于专业课程学习/科研/作业/项目”(54.63%)和“工具扫盲课——学习AI工具的基本操作”(52.91%)。约三成受访大学生认为，AI融合课或嵌入AI的专业课应该由“专业教师+AI/计算机专业教师+企业导师”共同授课。\n\n　　卢佳音不反对这样的“双师”模式，但她希望的是“共同解决问题”，而不是“课是课、事是事，没有融合”。“普适知识必须和本学科的需求结合才有用。”\n\n　　刘逸峰所在的“邂逅人工智能时代”课程团队，由信息与网络中心、计算机学院等不同教学单位的14位老师组成，每位老师根据自己的“AI+科研方向”负责一个专题。在他看来，这本身是一种跨学科协作。\n\n　　刘逸峰介绍，根据教育部有关要求，中南大学奎晓燕教授还牵头新开设了“人工智能基础及应用”必修课程，面向全体本科生开设，提升学生人工智能通识素养，课程根据专业背景分为理工科A类、医学B类和人文社科C类三个类别，分学期实施教学。目前，医学B类课程以“医学+AI”融合实践为特色，现已顺利完成首轮教学。\n\n　　面对AI技术带来的教学变化，山东大学考古学院院长郎剑锋表示，学院已经把学生培养方案从“四年一大调”改为“两年一大调、每年一微调”，且正在组织《AI考古导论》课程和教材建设，“希望人工智能技术全面赋能教学与人才培养”。\n\n　　“每门课都要有进驻真实世界的真实项目。”在卢佳音看来，有了真实的实践，学生才知道如何协作，进而发现问题、解决问题。她认为很多老师对AI的抵触来自一个预设：要学好了、学到位了，再应用；但当下技术的逻辑并非如此——“我有问题要解决，想想有什么技术能帮我解决，我学一学。”卢佳音说，这个道理同样要讲给学生听：先做事，用起来，不会了再想办法。\n\n　　中青报·中青网记者 刘俞希 程思 梅从政 实习生 吴佳玲 来源：中国青年报\n\n　　2026年11月20日 07版 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf292dc23ea","title":"“线上气氛组，线下社恐人”：大学生如何破局","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735010.shtml","summary":"当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包；可一旦有人发起线下见面的邀约，你会选择视而不见。","summary_short":"当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包；可一旦有人发起线下见面的邀约，你会选择视而不见。","digest":"当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包；可一旦有人发起线下见面的邀约…","points":["当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包","可一旦有人发起线下见面的邀约，你会选择视而不见","这个标签自有它的慰藉力量：那些难以言说的局促有了一个被同伴理解的名字…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:12:55+08:00","size":1,"keywords":[],"body":"当群里聊起你感兴趣的话题，你会兴致勃勃地接梗、刷表情包；可一旦有人发起线下见面的邀约，你会选择视而不见。你是这样的“线上气氛组，线下社恐人”吗？\n\n　　调研数据呈现出强烈的反差：近八成大学生认为自己有社交恐惧症，但真正达到临床确诊标准的只有0.64%。如今，“社恐”已成为大学生群体里最流行的自我注解之一。这个标签自有它的慰藉力量：那些难以言说的局促有了一个被同伴理解的名字，让人得以松一口气——原来不止我一个人这样。但危险的拐点也藏在这里：当标签从“描述某一刻的感受”慢慢滑向“定义‘我是谁’”，一切就变得不一样了。那么，在保护自我的铠甲与困住自我的围墙之间，那条分界线究竟在哪里？\n\n　　要回答这个问题，我们先要了解线上、线下社交模式的差异。线上社交更具可控性，因为它有编辑、撤回、延迟回复的缓冲空间，可以隐藏表情和动作；而线下社交要求即时反应，眼神、语气、微表情全部暴露在外，时刻要面对他人审视的目光和突如其来的提问，且全部无法撤回，容易触发内心对他人评价的恐惧。当人们选择逃避线下社交，并给自己贴上“社恐”的标签，会发生什么？\n\n　　一方面，这个标签可以保护自己，成为心理防御的盾牌。当你不想参与聚餐、想拒绝无意义应酬时，一句“我社恐”可以委婉划清社交边界，获得群体共情。社会认同理论指出，人们会通过群体标签定义自我，当发现“不止我一个人这样”时，个人的羞耻感会被稀释。当“社恐”成为流行身份，你不必再因为“不太会来事”而陷入自我否定。一句“我社恐”，能够帮助我们坦然拒绝消耗型社交，接纳自己不必做八面玲珑的社交达人。\r\n\n　　但另一方面，标签也会有失效的时刻，这也是我们困住自己的开始。比如“我是社恐，所以我一定做不好线下发言，我不要尝试”。此时标签不再是自嘲工具，而是变成了自我限制的枷锁。根据心理学中的“自我实现预言效应”，长期内化的“我不擅长社交”的信念，可能会让人主动回避社交，越回避越紧张，越紧张越回避，陷入恶性循环。或许“社恐”者明明有能力完成沟通，却提前放弃课堂汇报、小组协作、实习面试等机会，因为这个预设标签而主动后退。\n\n　　标签失效的痛苦是真的，社交恐惧的情绪也是真的。但更重要的是分辨：这是“我感到社交恐惧”的自我标签？还是“社交恐惧症患者”的临床障碍？有一个关键的判断标准：这种社交恐惧的情况是否持续至少6个月，并由此造成了显著的痛苦及社会功能的严重受损。或许一位大学新生会因为和同学不熟而躲着走，在群里却聊得火热，这是适应期的正常波动；但如果这种回避持续了大半年，让他无法正常上课、参与小组合作、无法建立任何一段面对面的关系，并且为此持续痛苦时，才是需要被慎重对待的临床信号。\n\n　　分清了自己站在标签“光谱”的哪一段，接下来的问题是：怎样才能和“社恐”标签好好相处？\n\n　　改变的前提不是强迫自己变成“社牛”，而是区分：哪些紧张是正常情绪，哪些是标签带来的自我限制？我们不需要消灭紧张，而要拒绝把自我价值和这个标签绑定。\n\n　　首先，我们可以尝试把身份陈述改写为状态描述。给自己贴上“社恐”标签的人可以试着做语言转换练习，把身份式描述改成场景式描述。比如把“我是社恐，我不擅长社交”换成“在多人聚会的场景，我会感到紧张；在熟悉的小圈子，我可以聊得很好”。标签只用来描述感受，不要用来定义自己。\n\n　　其次，我们可以进行阶梯式脱敏。认知行为疗法框架下的系统脱敏技术，建议我们设置难度阶梯，逐渐积累成功体验。比如最低难度是路上遇到同学简单问好，中等难度是与两三位熟悉的同学聚餐聊天，最高难度是小组汇报。不必因为一次发挥不好就退回线上舒适区。练习的目标不是消除紧张，而是学会在紧张中完成表达。在此过程中，我们可以记录被自己忽略的成功经验，比如“今天我主动和同学打了招呼”。同时也要放下完美社交的执念。对话本来就允许停顿、冷场、局促，旁人并不会时刻紧盯你，你的紧张也不会被无限放大。\n\n　　最后，我们要分清自我标签与临床障碍之间的边界。如果只是在部分社交场景紧张，在熟悉的人面前可以正常交往，那你完全可以保留“社恐”作为自嘲梗，不必逼迫自己彻底消除紧张。但如果几乎所有线下社交都会产生强烈失控的恐惧，伴随持续手抖、心慌、出汗等躯体反应；为了回避社交，放弃小组活动等必要的人际交往，学习和生活明显受影响；这种强烈痛苦持续半年以上，自己反复调节依旧没有改善；因为社交问题长期失眠，伴随持续的情绪低落时，要及时前往学校心理咨询中心或正规医院心理科评估。\n\n　　“社恐”标签是一把双刃剑。它是大学生保护自我的铠甲，接纳窘迫，帮助躲开无效应酬；可一旦固化成对自我的定论，就会变成困住我们的围墙。当“我是社恐”从共情的安慰变成退场的借口，不妨扪心自问：当下的选择，是在保护自己，还是向挑战妥协？\n\n　　黄彬彬 来源：中国青年报\n\n　　2026年11月20日 04版 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf0c3869ebf","title":"中央气象台：未来两天，全国大部降水稀少","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735007.shtml","summary":"中新网11月20日电 据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气。","summary_short":"中新网11月20日电 据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气。","digest":"据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气","points":["中新网11月20日电 据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气","预计20日，山东半岛仍有较强降雪，关注对交通、城市运行、人体健康等的影响","22日起，西南地区东部、江南、华南等地有降雨，东北地区有降雪，关注对交通运输等的影响"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:07:43+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据中央气象台网站消息，昨日，全国大部降水稀少，山东半岛出现雨雪天气。预计20日，山东半岛仍有较强降雪，关注对交通、城市运行、人体健康等的影响；22日起，西南地区东部、江南、华南等地有降雨，东北地区有降雪，关注对交通运输等的影响。\n\n　　全国大部降水稀少 山东半岛出现雨雪天气\n\n　　昨日，全国大部地区降水稀少，云南东部和南部、广西南部等地部分地区出现中雨，局地大雨；山东半岛出现小到中雪或雨夹雪，威海局地大到暴雪。内蒙古中东部、东北地区东部和南部、华北、黄淮及青海南部、西藏等地部分地区出现6～8级阵风，局地11级以上。\n\n　　全国大部天气晴好\n\n　　未来两天，全国大部降水稀少。内蒙古中东部、黑龙江中东部、山东半岛东部等地有小到中雪或雨夹雪，其中，山东半岛东部有大到暴雪。西南地区南部、华南等地有小雨，局地有中到大雨。\n\n　　22日至24日，西南地区东部、江南及华南大部有小到中雨，部分地区有大雨；内蒙古东部和东北地区有小到中雪，局地有大雪。23日至24日，受冷空气影响，中东部自北向南先后有4~8℃降温，局地降温10℃，部分地区伴有大风。\n\n　　国内未来三天具体预报\n\n　　11月20日08时至21日08时，黑龙江中东部、内蒙古中部、山东半岛等地部分地区有小到中雪或雨夹雪，其中，山东半岛东部等地局地有大雪或暴雪(10～12毫米)。云南、广西、广东、海南岛、台湾岛等地部分地区有小到中雨，其中，云南西南部等地局地有大雨(25～35毫米)。内蒙古中东部、东北地区东部和南部、山东半岛等地部分地区有4～6级风。东海北部、台湾海峡、巴士海峡、北部湾、南海北部和中部海域将有6～7级风，阵风8级。\n\n全国降水量预报图(11月20日08时-21日08时)图片来源：中央气象台网站\n\n　　11月21日08时至22日08时，黑龙江西北部、山东半岛东北部等地部分地区有小雪。云南、海南岛等地部分地区有小雨。山东半岛、内蒙古东部部分地区有4～5级风。巴士海峡、南海东北部海域将有6～7级风，阵风8级。\n\n全国降水量预报图(11月21日08时-22日08时)图片来源：中央气象台网站\n\n　　11月22日08时至23日08时，内蒙古东北部、东北地区东部、青藏高原北部和东部等地部分地区有小到中雪或雨夹雪，其中，黑龙江西北部等地局地有大雪(5～7毫米)。西南地区东部和南部、江南、华南中西部等地有小到中雨。内蒙古、东北地区南部等地部分地区有4～6级风。巴士海峡、南海东北部海域将有6～7级风，阵风8级。\n\n全国降水量预报图(11月22日08时-23日08时）图片来源：中央气象台网站\n\n 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca0a47a9de4","title":"研究发现：大脑的“青春期”能持续到32岁左右","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735006.shtml","summary":"研究发现：大脑的“青春期”能持续到32岁左右！","summary_short":"研究发现：大脑的“青春期”能持续到32岁左右！","digest":"研究发现：大脑的“青春期”能持续到32岁左右","points":["老话说“三十而立”，作为一个“刻在中国人文化基因里的成长标尺”，在过去的很长时间以来…","很多人说，自己到了30岁“大脑仿佛突然开窍”，知道自己想要什么，该怎么去努力了","但近年来神经科学研究证实，人类大脑的发育并非匀速线性，而是经历多个阶段的非线性变化…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:51:52+08:00","size":1,"keywords":[],"body":"研究发现：大脑的“青春期”能持续到32岁左右！30岁，慌啥子嘛……\n\n　　老话说“三十而立”，作为一个“刻在中国人文化基因里的成长标尺”，在过去的很长时间以来，它都像是悬在二三十岁年轻人心头的一道坎，给大家带来了极大的“人生定型焦虑”，总会让人不自觉陷入“我是不是已经来不及了”的自我怀疑。\n\n　　不过，这两年，一个新的观念正在悄悄流行：\n\n　　30岁，才是真正意义上的18岁。\n\n　　很多人说，自己到了30岁“大脑仿佛突然开窍”，知道自己想要什么，该怎么去努力了。\n\n图片来源于网络\n\n图片来源于网络\n\n　　如果你也有类似的感觉，那么恭喜你！这并不是错觉，而是有科学根据的——\n\n　　传统观念认为成年后大脑发育停止，能力发展进入“下坡路”。但近年来神经科学研究证实，人类大脑的发育并非匀速线性，而是经历多个阶段的非线性变化，32 岁才是大脑真正完成结构优化、进入成熟稳定模式的关键节点[1]。\n\n　　研究发现：9-32岁\n\n　　加长版的“青春期大脑”\n\n　　剑桥大学领衔的科研团队发表在《自然·通讯》的研究，通过分析3802名从新生儿到 90岁老人的MRI扩散扫描成像数据，首次绘制了人类大脑一生的发育全景图。\n\n　　研究发现，人类大脑并非在18岁成年后就停止发育，而是经历5个明确的发展阶段，且存在4个改写大脑运行模式的关键转折点，分别为9岁、32岁、66岁和83岁。\n\n　　其中，9-32岁这一阶段是最颠覆传统认知的发育周期。\n\n　　传统观点认为青春期在18岁结束，但神经科学研究证实，大脑的结构优化会持续到32岁。此阶段的核心变化是白质的持续生长——白质作为大脑的“信息高速公路”，负责不同脑区间的信号传递，其髓鞘化程度直接决定神经信号的传递效率[2-3]。\n\n　　从9岁到32岁，大脑的神经连接网络不断精细化，信号传递路径更短、速度更快，认知能力稳步提升，逻辑思维、决策能力、情绪调控能力逐渐成熟。\n\n　　32岁是这一阶段的关键转折点，此时大脑的神经连接方向与整体轨迹发生最大幅度的转变，标志着“青少年式”的脑结构重组彻底结束，大脑正式切换到成年模式。\n\n　　过往的研究也证实，掌管决策、自控和逻辑思考的前额叶皮层，会延续到第三个十年才真正发育成熟，这也是为什么我们总觉得二十多岁的人更容易出现情绪波动、冲动决策的情况。此前的所有经历都不是人生的“最终结果”，而是神经发育的“压力测试”，是为后续的爆发式成长积蓄能量。\n\n　　别再为“社会时钟”焦虑了\n\n　　你的大脑有无限可能\n\n　　其实，即便是三十多岁以后，大脑也不会“停止成长”。\n\n　　研究显示，大脑的神经可塑性贯穿一生，32-66岁的成年期，更是大脑认知储备积累的关键阶段。所谓认知储备，就是大脑通过长期学习、经验沉淀形成的“神经护城河”，能有效抵御衰老带来的认知衰退。\n\n　　所以，与其为结婚、买房、事业定型等所谓的“30岁人生标尺”焦虑，不如主动为大脑“升级”，让我们在迎来“大脑进入衰老阶段的第一个节点”之前，更加从容。\n\n　　1 主动构建神经连接，\n\n　　用终身学习激活潜力\n\n　　持续学习是大脑的“保鲜剂”，能不断建立新的突触连接，延缓功能衰退。我们的学习，不光是“应试技能”，更应该包括“系统性成长”：\n\n　　·刻意练习与深度思考：针对专业领域进行针对性训练，避免低效率的重复劳动，通过拆解问题、复盘总结，强化前额叶皮层的逻辑思维能力；\n\n　　·跨领域学习：不同领域的知识能够激活大脑的多个脑区，建立跨区域的神经连接，提升思维的灵活性。例如学习编程时交替进行阅读文学作品，能够同时强化逻辑思维与创造力；\n\n　　·保持文字输入与输出：阅读、写作、做笔记等行为能够持续刺激大脑的语言中枢，维持神经连接的活跃度。手写笔记相较于电子记录，能够更有效地激活大脑的记忆区域，提升知识留存率。\n\n　　2 锻炼大脑“硬件”，\n\n　　优化生活方式\n\n　　大脑的高效运转，离不开健康的身体基础：\n\n　　·规律运动：每周至少进行150分钟中等强度有氧运动，如快走、游泳、太极拳，能够促进脑部血液循环，增加脑血流量，刺激脑源性神经营养因子的分泌，助力神经元修复与再生。每周2-3次的抗阻训练，如举哑铃、弹力带训练，能够改善全身代谢，降低脑血管疾病风险；\n\n　　·优化饮食结构：多摄入绿叶蔬菜、浆果、全谷物、深海鱼，减少红肉、油炸食品与精制糖的摄入。这类食物能够提供不饱和脂肪酸、抗氧化物质，减少脑部氧化应激与炎症反应，延缓认知衰退；\n\n　　·保障高质量睡眠：每天保证7-8小时的规律睡眠，睡眠时大脑会清除日间积累的代谢废物，如β-淀粉样蛋白，这是与阿尔茨海默病相关的神经毒素。睡前避免使用电子屏幕，可通过泡脚、听轻音乐提升睡眠质量。\n\n　　3 激活社交与情绪\n\n　　给大脑“软件优化”\n\n　　社交互动与情绪健康是维持大脑功能的重要因素。积极参与社交互动(社区活动、亲友聚会)，能够刺激大脑的语言中枢与情感中枢，减少孤独感与抑郁风险。\n\n　　同时，长期的焦虑、高压状态会导致皮质醇水平升高，损伤海马体等记忆相关脑区，因此需要通过冥想、深呼吸、正念练习等方式调节情绪，必要时寻求专业心理帮助。\n\n　　读完这篇文章，希望你可以不必被“三十而立”的传统观念束缚，不必因暂时的挫折否定自我。凤梨罐头会过期，但人生没有“过期日”，大脑的潜力从不因年龄设限，无论哪个年纪，你的每一次学习、每一次坚持，都是在给人生“加分”。\n\n　　所谓“最好的时光”，从来不是过去，而是你愿意开始改变的此刻。\n\n　　策划制作\n\n　　作者丨钱雨 北京市第八中学教师、基因组学博士\n\n　　审核丨李旭 中国科学技术大学副教授、中国生物化学与分子生物学会会员\n\n　　策划丨杨雅萍\n\n　　责编丨王梦如\n\n 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2b0b42cf62","title":"医美逐渐低龄化，“变美”风险不容忽视","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735001.shtml","summary":"近年来，各大医院的整形美容科门诊多出不少稚嫩面孔。","summary_short":"近年来，各大医院的整形美容科门诊多出不少稚嫩面孔。","digest":"近年来，各大医院的整形美容科门诊多出不少稚嫩面孔","points":["近年来，各大医院的整形美容科门诊多出不少稚嫩面孔","割双眼皮、打瘦脸针、填充玻尿酸……这些需谨慎对待的医疗美容项目，正被越来越多大学生…","部分向往医美的青少年，审美偏向所谓“漫画脸”“网红脸”"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:40:15+08:00","size":1,"keywords":[],"body":"近年来，各大医院的整形美容科门诊多出不少稚嫩面孔。割双眼皮、打瘦脸针、填充玻尿酸……这些需谨慎对待的医疗美容项目，正被越来越多大学生、未成年人提上日程。半月谈记者调查发现，医美低龄化趋势明显，容貌焦虑与违规营销共存，“变美”风险不容忽视。\r\n\n　　未成年人医美热存在认知误区\n\n　　今年暑假，16岁的高中生肖欣(化名)用两个月时间“逆袭大换脸”——开眼角、做双眼皮、打玻尿酸，以一张“新面孔”迎接新学期。\n\n　　这样的案例并不鲜见。大连市第四人民医院烧伤创面科主任、瘢痕整形与医疗美容科负责人王德宇告诉半月谈记者，近年来，18周岁以下的求美者数量持续攀升，初中、高中在校生咨询、预约整形人数逐年上涨，艺术特长生、播音表演类考生占未成年整形咨询人群的比例较高。“从‘毕业后求职整形’变为‘入学前整形’，医美逐步被当作升学、艺考面试的前置准备。”王德宇说。\n\n　　部分向往医美的青少年，审美偏向所谓“漫画脸”“网红脸”。受访医生指出，有的青少年通过手术将下眼睑向下延伸，使眼睛留白增多，像漫画人物的眼睛，但在医美机构手术后出现巩膜外露，导致干眼症或流泪不止；有的拿着高度美颜的“网红”照片、AI生成的虚拟人物图片来就诊，要求“照着这个样子给我做”。\n\n　　沈阳市第七人民医院美容整形科主任田雅光表示，未成年人对医美整形的风险认知不足。“一些学生把医美等同于‘护肤、化妆’，将注射美容、激光美容视为‘生活类美容’，低估手术创伤及远期后遗症风险，轻信了机构‘微创、零风险’的宣传。”\n\n　　“18岁以前是生长发育的关键阶段，尤其是面部的骨骼，包括鼻骨、上下颌骨仍在发育，过早做隆鼻、下颌手术等，会随着骨骼发育出现假体移位、五官不对称、咬合紊乱等远期并发症，后期修复难度大，费用也高。”大连理工大学附属中心医院整形科主任王琳说。\n\n　　未成年人的整形和医美需求应分类讨论。王琳表示，以治疗为目的的整形修复手术需要尽早进行。例如，各种瘢痕、先天性的血管瘤和黑毛痣、影响功能和视力的中重度上睑下垂等问题，如果延误治疗，不但会错失治疗时机，还可能影响未成年人的心理发育。但单纯以变美为目的的整容或医美项目，建议等到18岁以后再考虑。\n\n　　对于大众认知中门槛较低的医美项目，未成年人也应慎重考虑。不当注射肉毒素、玻尿酸，可能干扰面部神经、肌肉的正常发育；违规注射生长因子、奥美定等物质，易导致组织肿胀、血管栓塞、皮肤坏死，甚至造成失明、面瘫等严重后果。\n\n　　违规营销瞄准青少年，“监护人同意”形同虚设\n\n　　有医生表示，面对盲目求美的未成年群体，医生一般会劝退，但他们被拒后，可能会另选其他民营医美机构。\n\n　　有的机构专门推出针对中学生的“假期焕颜计划”，用“暑期特惠”“学生认证享折扣”等策略吸引未成年人；有的机构在社交平台上发帖推广，评论区里“16岁可以打瘦脸针吗”“14岁可以做吗”等询问层出不穷，机构纷纷给予肯定回复。\n\n　　《医疗美容服务管理办法》规定，执业医师对就医者实施治疗前，必须向就医者本人或亲属书面告知治疗的适应症、禁忌症、医疗风险和注意事项等，并取得就医者本人或监护人的签字同意。\n\n　　当半月谈记者以16岁青少年的身份在社交媒体上联系多家医美机构，均得到“有监护人同意就可以”的回复。进一步沟通发现，所谓“监护人同意”，在实践中有不小操作空间。\n\n　　如果监护人不能到场，有的机构只需未成年就医者携带户口本或留下父母联系方式即可；有的机构仅需提供父母同意的文字、录音等即可。“这些文字或录音是否真的是未成年人父母所留，机构也不会去辨别，仅仅是走个过场。”一位从业多年的医美机构负责人坦言，“监护人同意”在实际执行中容易沦为形式。\n\n　　认准“三证”，更要树立健康审美观\n\n　　田雅光有时会接诊因在“黑诊所”手术失败而前来求治的青少年。她表示，一些寻求修复的年轻人，因容貌焦虑放大所谓的“瑕疵”，最初只是进行了一项简单的医美，但此后像打开了“潘多拉魔盒”，陷入修复漩涡。\n\n　　田雅光表示，需要警惕一些藏身于居民楼、写字楼的“美丽陷阱”。一些美甲美睫店、私人美容工作室，在没有资质的情况下擅自开展注射美容、激光祛斑等医疗美容项目，存在较大风险。\n\n　　多位医学专家提醒，做任何医美项目，都要认准“三证”，即机构、人员、产品均需“持证上岗”。根据《医疗美容服务管理办法》，开展医美项目的机构必须取得《医疗机构执业许可证》，操作人员需具备执业医师资格和临床经验，美容医疗机构使用的医用材料须经有关部门批准。\n\n　　消费者可在国家卫健委、当地卫健委官网、全国医疗机构查询系统核验机构备案信息、项目备案范围。同时，可以向医美机构索要所用填充材料及其他高值药械产品的合格证、溯源码等，还要注意留存接受服务前后的对比照片、费用支出凭据、签名文书等相关材料。\n\n　　专家表示，治理医美低龄化乱象，一方面要加强医疗美容广告监管，依照广告法第九条第七项，将突出制造容貌焦虑的宣传内容认定为违背社会良好风尚，依法施以罚款等惩罚，同时建立全国统一的医美机构信用档案，明确记录机构接纳未成年人、协助造假的失信行为；另一方面要树立健康的审美观念，将健康审美教育纳入中小学心理健康课程，通过案例讲解、主题班会等形式引导未成年人理性看待外貌。\n\n　　半月谈记者：孙仁斌 刘艺淳 赵泳\n\n　　原标题《警惕医美低龄化别让花样年华被“容貌焦虑”绑架》 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb70ccb46de","title":"“互联网+AI监管”24小时全自动巡检 餐饮后厨有了智慧眼","url":"https://www.chinanews.com.cn/sh/2026/11-20/10734998.shtml","summary":"餐饮后厨有了智慧眼(大国小家)  　　“舌尖安全”“外卖安全”是大众持续关切的民生问题。","summary_short":"餐饮后厨有了智慧眼(大国小家)  　　“舌尖安全”“外卖安全”是大众持续关切的民生问题。","digest":"餐饮后厨有了智慧眼(大国小家)  　　“舌尖安全”“外卖安全”是大众持续关切的民生问…","points":["餐饮后厨有了智慧眼(大国小家)","“舌尖安全”“外卖安全”是大众持续关切的民生问题","市场监管总局试点推进“互联网+AI(人工智能)监管”…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T07:32:27+08:00","size":1,"keywords":[],"body":"餐饮后厨有了智慧眼(大国小家)\n\n　　“舌尖安全”“外卖安全”是大众持续关切的民生问题。但餐饮后厨操作不规范、食材过期、冷链失控等风险隐蔽性强，传统监管多依靠现场抽检、群众举报，问题发现滞后。\n\n　　市场监管总局试点推进“互联网+AI(人工智能)监管”，部分地区依托智能识别技术自动捕捉违规风险，实现隐患提前预警。AI开始嵌入食品安全监管全链条。新模式如何补齐传统监管短板，推动食品安全治理关口前移？记者进行了采访。\n\n　　“互联网+AI监管”能对餐饮后厨24小时全自动巡检\r\n\n　　“这家店评出来是65分，主要问题是，灶台表面有大量的深色油污，灶台下面有一个垃圾桶没有加盖，员工操作时，头发外露，没有戴工作帽。”浙江省市场监督管理局餐饮服务食品安全监督管理处副处长鲁捷盯着屏幕向记者介绍。\n\n　　这是记者在浙江网络餐饮“AI+非现场监管”驾驶舱看到的演示。“AI+非现场监管”系统启动以后，AI就实时对浙江全省的19万多家商户进行随机抽取。鲁捷说，“比如这家店，打分后系统会把抓拍的图片、总体评价和改进建议，以短信的形式发送到商户的手机上，督促改进。”\n\n　　去年11月，浙江省市场监督管理局推出“AI+非现场监管”系统，目前已运行一年。这套“AI+非现场监管”系统可以对后厨抓拍，进行静态集成评分，并自动生成整改意见实时推送给商户。同时，还能动态捕捉监控画面中包括夜间出现鼠迹、猫狗闯入、洗菜池洗拖把等12种违规问题，自动抓取、切片、固证后，实时推送给监管人员，实现24小时全自动巡检。\n\n　　目前，“AI+非现场监管”系统已覆盖浙江全省所有的外卖商户，累计巡检460余万家次，抓拍鼠迹、从业人员违规行为视频1.3万余例，60分以下商户从近29%降至4%以下。鲁捷介绍，对于60分以下的商户，通过短信和AI呼叫，让商家自主整改，两次不整改的会推给监管人员上门进行监管。比如杭州萧山美霞小吃店，今年3月18日、21日AI抓拍均为59分，2次短信推送后商户自主整改，后厨环境有了明显改善，3月23日AI抓拍达到75分。\n\n　　在市场监管总局指导下，多地市场监管部门依托“互联网+AI”技术试点推进食品安全智慧监管。中国消费者报社调研显示：湖北、北京、浙江等地搭建AI明厨亮灶、阳光智厨系统，依托智能摄像头24小时不间断巡检后厨，自动识别未佩戴工帽、生熟混放、环境卫生不达标等违规行为，形成“AI巡查—预警推送—商户整改—复核销号”闭环管理；江苏、福建运用AI开展食品标签智能预审，大幅压缩标签合规审核时长，从源头降低标签违法风险；天津、广西打通政企数据，联动外卖平台排查网络餐饮隐患，吸纳外卖骑手等社会群体以食安监督员等身份参与社会共治。\n\n　　“从‘明厨亮灶’到‘互联网+明厨亮灶’，再发展到‘互联网+明厨亮灶+AI监管’，AI的嵌入进一步提高了监管效率，过去只是能看到画面和人工核查，现在能通过算法发现一些问题，包括AI自动巡检、抓拍和预警。”中国人民大学食品安全治理协同创新中心研究员孙娟娟说，“这让非现场检查更有操作性，有助于优化有限行政资源的配置，地方政府也基于此给加入明厨亮灶的入网经营者提供行政便利，比如对加装后未发现问题的餐饮店减少检查频次，联动平台对合规商家进行流量倾斜和宣传曝光，这对商家也是一种激励。”\n\n　　提升对“幽灵外卖”“无堂食外卖”的监管效率\n\n　　面对海量的外卖商户，“AI+非现场监管”系统能否发挥更大作用？\n\n　　记者走进杭州外卖商户最密集的区域——萧山区，该区现有网络餐饮商户7300余家。“我们局能够从事餐饮监管的工作人员只有58人，此前一直面临着网络餐饮食品安全‘管不过来、管不到位、管不长久’的困境。”杭州市萧山区市场监督管理局局长吕意说，“‘AI+非现场监管’系统帮我们解决了大问题。”\n\n　　强化网络餐饮食品安全监管要铲除平台上那些租借证照、使用虚假地址，甚至伪造证照的“幽灵外卖”。这些店铺多以低廉的价格吸引消费者，但其后厨往往存在环境脏乱差、食材来源不明、加工操作不规范等问题。\n\n　　浙江的“AI+非现场监管”系统跟三大外卖平台打通数据接口，能自动对全省19万多家外卖商户的证照进行校验与比对，比对成功的商户，平台能够调用电子证照在平台上进行公示，杜绝“幽灵外卖”。\n\n　　随着外卖产业的发展，出现了只做外卖、不提供现场就餐的“无堂食外卖”，其经营场所通常隐蔽、规模小、变动频繁，是网络餐饮食品安全投诉高发领域。\n\n　　浙江没有采取“一刀切”关停的简单做法，在全国首创“无堂食外卖”聚集区“管理方+商户”自治管理模式，推动商户由分散隐蔽转向组团发展、由无人监管转向专业管护，从源头治理。\n\n　　比如位于萧山区的“不难食集”是“无堂食外卖”聚集区，曾被许多人视为食品安全治理的“隐秘角落”。今年以来，萧山区创新构建商户自治、平台主治、属地常治、部门综治、清风督治、社会共治的“六治协同”治理体系，推动网络餐饮食品安全持续规范、常态长效。“不难食集”通过墙面地面翻新、管线隐形、档口统一、增设共享仓库，实现从“脏乱差”到“洁净美”的转变。\n\n　　记者看到橙色烤漆棚架、雕花护栏和防滑木纹地板构成了小哥驿站，进入室内，商户门口是标准化的不锈钢取餐窗口，再进入商户后厨，则能看到摄像头接入“AI+非现场监管”系统。在“不难食集”经营肉蟹煲店的赵子明说，“装上摄像头能让消费者看到食品加工过程，增加对我们的信任。”\n\n　　萧山区对接外卖平台，建立网络餐饮食品安全违规行为分级惩戒机制，明确限流、置休、下架三级惩戒标准，今年以来累计通告平台下架外卖商户160家。\n\n　　浙江省市场监督管理局与外卖平台建立信用信息双向共享互认机制，将商户评价结果推送至外卖平台、纳入商户服务评分体系，并与平台流量分配、活动参与资格挂钩。比如美团对杭州“无堂食外卖”聚集区38家管理规范、信用良好的商户给予平台流量激励。\n\n　　国家食品质量检验检测中心副主任程劲松建议，外卖平台可以对商户进行分级，没有明厨亮灶的，有明厨亮灶的，还有在明厨亮灶的基础上增加其他服务的，等等，让消费者按需选择，更明白地消费，让规范经营的商家获得正向回报。\n\n　　全面推行尚面临AI能力迭代、成本分担等挑战\n\n　　“冰箱上如果盖个被子，AI就会将其识别成床铺。”“AI能识别老鼠、猫狗，但对非法添加的物料无法识别。”“AI受光线、遮挡、角度变化影响，识别上还会有误差，能力仍在进阶当中。”……多位专家表示，AI大模型的识别准确度还需要时间训练，潜力仍然很大。\n\n　　用“互联网+AI监管”赋能餐饮食品安全监管是一个方向，但全面推广仍面临一些挑战。中国农业大学食品科学与营养工程学院副教授朱毅说：“从实际落地看有一定难度，要钱、要设备、要人工、要时间，还要观念更新，一环都不能少。”\n\n　　安装摄像头需要多少成本？杭州萧山区黄力成面馆最近要做网络餐饮，安装了中国电信的明厨亮灶，套餐包年360元，免费送一个摄像头。中国饭店协会副会长宋小溪介绍：“我们在行业调研中了解到，摄像头本身100多元比较正常，加上流量费、存储费，较便宜的一年200多元，较贵的400多元。这对利润微薄的中小商家而言是一笔需要认真权衡的开支。”\n\n　　安装成本、流量费用等由谁承担？牵涉商户、运营商、平台等多方。有的运营商根据商户情况提供包宽带、手机流量套餐，免费提供摄像头。有的地方运营商与银行合作，商户开通账户或贷款，银行为部分商户免费提供摄像头。对已有宽带，只安装摄像头的，运营商针对不同使用期限，每年费用200至400元。“平台70%以上是中小微商家，设备采买、数据存储、网络流量这三项成本是每年需要持续投入的，我们对残疾人创业者、放心消费商家等特定群体有公益帮扶措施。”淘宝闪购食安总监田西艳介绍。\n\n　　对有一定规模的餐饮连锁店来讲，明厨亮灶是门店管理的一个抓手。花小小品牌联合创始人王宁介绍，“我们安装摄像头的门店将近3600家，每家装三个摄像头，一个在前厅、两个在后厨，后厨一个是固定机位，另外一个由总部做统一AI数字化管理，每15分钟调整一次角度，既可以对门店做督导、做品控，也让消费者安心。”\n\n　　“互联网+AI监管”仍处在培育期，面临AI能力迭代等挑战。科信食品与健康信息交流中心主任钟凯认为，这是鼓励商家透明化经营、增进消费者信任的“加分项”，也是一项需要长期培育、循序渐进的工作。\n\n　　本报记者 刘军国 林丽鹂 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8c3733466f","title":"病房變身「遊樂場」和「茶居」 靈實醫院打破住院悶局｜醫言九龍東","url":"https://news.tvb.com/tc/1207194-病房變身遊樂場和茶居靈實醫院打破住院悶局醫言九龍東","summary":"住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲？這並非天方夜譚！","summary_short":"住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲？","digest":"住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲","points":["住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲","靈實醫院老人科每隔一個星期日，都會將病房化身成「遊樂場」，讓一班長期住院的長者…","靈實醫院內科部門運作經理蔡月菊說，為病人帶來有溫度的陪伴，與適切治療同樣重要"],"section":"民生","category":"專欄來論","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:00+08:00","size":1,"keywords":[],"body":"住院期間也能嘆「一盅兩件」，甚至像遊樂場般玩小遊戲？這並非天方夜譚！老友記最開心的就是聚在一起熱熱鬧鬧。靈實醫院老人科每隔一個星期日，都會將病房化身成「遊樂場」，讓一班長期住院的長者，趁周末鬆鬆筋骨，亦趁機會與家人聚天倫。\n\n靈實醫院內科部門運作經理蔡月菊說，為病人帶來有溫度的陪伴，與適切治療同樣重要\n\n醫護自發籌辦　打破病人長期住院悶局\n\n靈實醫院內科部門運作經理蔡月菊表示，病房由2023年11月起，每隔一個星期日都會舉辦「耆樂星期天」活動，醫護人員會設計各類遊戲、工作坊等讓臨床情況穩定的住院長者參加。活動最初由醫護人員自發舉辦，希望讓長期住院長者保持社交，改善活動不足的問題，亦能為他們送暖。現時「耆樂星期天」已成為病房恆常而且非常受歡迎的活動。\n\n引入懷緬治療　「快樂茶居」重溫飲茶樂\n\n團隊在設計活動時，除了會按病人的需要及喜好，更引入懷緬治療元素。例如將病房位置改造成「快樂茶居」，營造熟悉的環境，讓長者重溫以往周末到茶樓「一盅兩件」的感覺。長者們一邊食得開心，與院友坐下來相聚又笑得開懷，患認知障礙的長者也能梳理自己的回憶，改善病情。\n\n團隊將病房改造成「茶居」，長者住院都可以飲茶吃點心\n\n多感官刺激遊戲　寓復健於娛樂\n\n為了幫助病人提高對復健的積極性，尤其令患有認知障礙症的長者，有動腦筋的機會，團隊設計的遊戲都會透過多感官刺激，例如視覺、觸覺、聽覺等，考驗手眼協調及反應，加強認知能力的同時，亦鍛鍊肌肉。最受長者歡迎的遊戲包括有挑戰用筷子，精準夾起乒乓球，再將乒乓球貼在膠紙上，增加遊戲難度；長者亦喜愛用器具捉道具蜜蜂及採花；又有常見於嘉年華，結合運動技巧與策略思維的經典攤位遊戲 ── 擲波「過三關」，由小朋友、大人到長者都一樣受歡迎及好玩。病人都玩得非常投入，更有老友記不停高呼「很開心」、「好好玩」，他們和家人都感謝醫護人員的無私付出和心思。\n\n長者要將五顏六色的乒乓波夾起貼在膠紙上，考驗手眼協調\n\n節日應節工作坊　促成醫患與家人共融\n\n除了遊戲及茶居等活動，團隊也會趁不同節日應應節，例如醫護人員和老友記一同寫揮春迎接農曆新年；中秋時製作燈籠、食月餅；聖誕節就製作愛心手工花、聖誕樹。長者即使住院亦感受節日氣氛，也能與醫護人員、住院老友記及家人一同歡度佳節，共同創造美好回憶。\n\n醫護人員趁節日舉辦活動與病人一同歡度佳節\n\n99.6%滿意度　見證「有溫度的陪伴」\n\n「耆樂星期天」至今已超過500人次參與。病房訪問參加活動的病人，99.6%病人都很享受「耆樂星期天」的遊戲及活動。蔡月菊憶述有一位病人平時不發一言，但參加活動後變得非常開朗，甚至主動與醫護人員打開話匣子。病人態度的轉變令團隊深信，為病人帶來有溫度的陪伴，與適切的治療同樣重要。\n\n看到參加「耆樂星期天」的病人展露笑容，正是醫護人員全心付出的最大動力\n\n她形容活動也營造了病房的正向文化，感染醫護人員更多主動關心病人，在專業服務上加添一份窩心。團隊未來會繼續透過關懷病人的活動，令更多住院病人都感到溫暖，與他們一同走過抵抗病魔之路。\n\n本文僅代表作者觀點，不代表無綫新聞立場。","image":"https://pro-vod-cdn.tvb.com/55d31dd12ea4405284741a8518b9eed3/snapshots/e97036b8ee04445688ece36b8517d00d-00008.jpg","video":"https://pro-vod-cdn.tvb.com/55d31dd12ea4405284741a8518b9eed3/921168e4f22e475db5052e9d31d78e24-38b43971f1cfd66e0781e214f595dba0-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/55d31dd12ea4405284741a8518b9eed3/snapshots/e97036b8ee04445688ece36b8517d00d-00008.jpg","lang":"zh-Hant"},{"id":"c2139f8ca2d","title":"【深圳APEC】深圳水果店店员：智利总统到访，车厘子销量明显增长","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075512.shtml","summary":"11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启。","summary_short":"11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启。","digest":"11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启","points":["11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启","活动现场，他向一个中国家庭赠送了一箱智利车厘子，共同庆祝新产季到来","他在致辞中说，车厘子是智中双边贸易中最具代表性的产品之一，承载着两国之间的信任与友谊"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:57:16+08:00","size":1,"keywords":[],"body":"11月18日，智利总统卡斯特到访深圳一家水果店，见证智利车厘子新产季在中国开启。活动现场，他向一个中国家庭赠送了一箱智利车厘子，共同庆祝新产季到来。\n\n他在致辞中说，车厘子是智中双边贸易中最具代表性的产品之一，承载着两国之间的信任与友谊。他邀请中国消费者品尝来自智利的车厘子，与家人和朋友分享新鲜、甜美与营养。\n\n11月19日，中新社记者走访这家水果店，店内印着“智利水果”字样的红色拱形展架格外醒目。一盒盒车厘子层层摆开，深红的果实带着青绿的果柄。展台中央，单颗包裹的车厘子被垒成一座小塔。包装盒上果园和采摘者的照片，将人们的目光引向这份甜美的源头。\n\n现场工作人员回忆到，昨天智利总统到访门店参观，他在展台等候，向总统递上产自智利的进口车厘子试吃品。门店近期推出将鲜花与水果结合的花果礼，考虑到车厘子很适合作为伴手礼，特意准备了车厘子花束，作为礼品送给总统夫人。他还提到，从昨天下午开始，店里车厘子的销量有明显上涨。(记者 范思忆 关雪昭 李佳悦 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/4213CC909E5F42EEA7C242778D74AAB2.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c970e488aee","title":"难忘二战记忆——火光之下，不只是新加坡","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734976.shtml","summary":"“四周一片漆黑，新加坡看起来就像一团火。","summary_short":"“四周一片漆黑，新加坡看起来就像一团火。","digest":"“四周一片漆黑，新加坡看起来就像一团火","points":["“四周一片漆黑，新加坡看起来就像一团火","许多船被击沉了，海面上都是残骸","”这是1942年新加坡沦陷后，来自乘船逃难者的口述"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:56:14+08:00","size":1,"keywords":[],"body":"“四周一片漆黑，新加坡看起来就像一团火。许多船被击沉了，海面上都是残骸。”这是1942年新加坡沦陷后，来自乘船逃难者的口述。空袭、肃清、占领、酷刑……火光之下，映照出的是日本军国主义曾给地区人民带来的战争伤痛。\r\n\n　　近期新加坡的一影一书一展，记录下了这团火。动画电影《沧海琴声》讲述了两位青梅竹马的天才小提琴手因音乐结缘，却在日军入侵新加坡后被迫分离、梦想破碎。书籍《铭记昭南》收录80件新加坡日据时期的信件、证件等实物，还原了日军占领时期普通人对家庭离散、亲人遭凌辱的恐惧、挣扎和苦难。新加坡国家博物馆“新加坡历史展厅”，则重现了新加坡人民在日据时期历经苦难、奋起抗争的历史。\n\n　　这团火烧的是普通人的生计，让生灵涂炭、家破人亡。新加坡沦陷后，日军以“清除反日分子”为名，进行大规模“肃清行动”。凡18至50岁华人男性都须强制接受“检证”，数万平民被随意判定为“可疑分子”押往海滩、郊野残忍杀害。大量劳力被强征，许多人因饥饿、疾病、虐待和过劳而死。日军还大肆掠夺战略物资，强迫缴纳“奉纳金”，大量印制“蕉币”，让无数家庭生活难以为继。《沧海琴声》中的抗日志士林谋盛的狱友曾控诉日军：“毒刑苛政，暴敛横征，折磨战俘，肃清检证，残害人道，罪恶滔天。”新加坡国家博物馆展出惹兰培本等乱葬岗出土的踝环、眼镜、子弹壳等，件件都浸满了当地民众的血泪。\n\n　　这团火烧的是国家的尊严，让文化被抹杀、国民遭凌辱。日军将新加坡改名“昭南岛”，强制推行奴化教育，进行洗脑和思想控制。日军在当地设立多处“慰安所”，诱骗、强征女性充当“接待妇”，对反抗者施以酷刑，对怀孕、染病等“失去价值者”则秘密处死。《铭记昭南》收录了一张1942年的结婚证，因为当时有人认为已婚女性或可避免被凌辱，就匆忙结婚；书中还有一幅漫画，描绘了当地女性浑身赤裸、惨遭日军凌辱致死的画面。这些人间惨剧还并非全部。日军还在新加坡设立了“冈字9420部队”，作为731部队在东南亚的分支，大规模饲养老鼠，培养染疫跳蚤，实施惨无人道的人体实验，并向东南亚多地和中国西南地区投放细菌武器，造成大量平民伤亡。近期新加坡媒体制作播出纪录片《揭秘731部队》，揭开了这段被刻意掩埋的历史。\n\n　　这团火不仅烧过新加坡。它烧过中国，造成逾3500万军民伤亡，仅南京大屠杀就有30多万平民遇难；烧过菲律宾，马尼拉大屠杀1个月内超10万人丧生；烧过印度尼西亚，饥饿、劳役和屠杀共造成约400万印尼人死亡；烧过马来西亚，槟城博物馆至今还留着日军强征“慰安妇”暴行的证据；烧过缅甸、泰国，泰缅415公里“死亡铁路”共造成十多万劳工惨死，平均每公里死亡约360人，相当于每修建10米就有2至3人付出生命代价；烧过越南，1944年至1945年因日军残酷掠夺饿死约200万人。即便是这些，也仅仅是亚洲被侵略国家共同记忆的冰山一角。\n\n　　如今，艺术家们把散落民间的记忆和文物一件件拾起，真实再现这段风雨如晦的岁月，再次令世人动容。《沧海琴声》在国际上屡获大奖，导演接受采访时提到，社交媒体上很多人留言表示深受触动，特别是不少韩国观众对新加坡遭受的殖民创伤感同身受，对主人公坚持理想、反抗侵略产生强烈共鸣。新加坡历史展厅观展游客往来如织，人们在乱葬岗出土的遗物前驻足，回望那段被岁月尘封的苦难。越来越多年轻人愿意去了解，因为那是自己国家的真实过往，是由无数同胞的伤痛与血泪书写而成，它不该也不能被遗忘。\n\n　　然而，受害者伤痕犹在，加害者却试图淡忘。硝烟虽已远去，但日本军国主义仍阴魂不散。今年是东京审判开庭80周年。在本该回顾历史、反思过去的时刻，日本右翼势力却罔顾东京审判历史定论，极力否认甚至美化侵略历史，公然将二战甲级战犯奉若神明，加速推进“再军事化”，意图冲破战后体制束缚，再次成为一个能战国家。这不能不给本地区民众敲响警钟。因为，维护地区和平，不让战火重燃，是亚洲各国所有爱好和平人士的共同心声。(完)\n\n　　(作者系国际问题观察员 周亚欣) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c39855c0749","title":"浙江文旅观察：秀山丽水缘何看重“疗休养”？","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734966.shtml","summary":"中新网丽水11月19日电(周健)初冬时节，浙江丽水空气清新、阳光明媚。","summary_short":"中新网丽水11月19日电(周健)初冬时节，浙江丽水空气清新、阳光明媚。","digest":"初冬时节，浙江丽水空气清新、阳光明媚","points":["中新网丽水11月19日电(周健)初冬时节，浙江丽水空气清新、阳光明媚","19日，云和梯田旁的民宿内，一批来自江苏的职工赏山水、品香茶，享受疗休养的惬意时光","而在相隔10多公里的云和县城，“我在丽水疗休养”第七届秀山丽水疗休养区域协作暨丽水全域旅游联…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:41:33+08:00","size":1,"keywords":[],"body":"中新网丽水11月19日电(周健)初冬时节，浙江丽水空气清新、阳光明媚。19日，云和梯田旁的民宿内，一批来自江苏的职工赏山水、品香茶，享受疗休养的惬意时光。而在相隔10多公里的云和县城，“我在丽水疗休养”第七届秀山丽水疗休养区域协作暨丽水全域旅游联盟资源对接活动启幕，氛围火热。\n\n　　“我们衷心期待，各位工会同仁多组团、多送客，各文旅企业多对接、多合作，共同把‘我在丽水疗休养’这张金名片擦得更亮。”活动上，丽水市委常委、副市长人选楼琅坚发出诚挚邀约。\n\n　　地处浙西南山区，丽水为何如此看重疗休养？答案，蕴藏在得天独厚的生态底色、厚重鲜活的千年文脉之中，更写在生态价值转化、推进共同富裕的发展考卷上。\n\n　　山水文脉 筑牢根基\n\n　　丽水，九山半水半分田，优越的生态本底，是疗休养产业行稳致远的根基。在这里，山是江浙之巅，水是六江之源，全市森林覆盖率80.81%，生态环境质量指数连续22年位居浙江首位，拿下国家生态文明先行示范区、中国气候养生之乡等多张“金名片”。\n\n　　一县一域，皆是精彩；一山一水，皆可入景。\n\n　　以云和为例，境内千米以上山峰多达184座，是丽水首个国家级生态县。全国首个梯田型5A级景区云和梯田坐落于此，千层叠田、千米落差、万亩云海，享有“中国最美梯田”的美誉；浙江第三大人工湖云和湖烟波浩渺，高山平湖的独特景致，十分适合泛舟览胜、亲水休闲。\n\n　　“云和坐拥好山好水好空气，既是打卡出片的观光胜地，也是养眼、养肺、养心、养身的康养福地。”云和县委副书记，代县长何子儋说。\n\n11月19日，浙江云和梯田景区稻浪翻滚。　孙杨洋 摄\n\n　　生态为骨，文化铸魂。缙云黄帝文化源远流长，龙泉青瓷宝剑匠心传承，青田石雕巧夺天工，景宁畲歌婉转悠扬……一个个沉淀于绿水青山间的文化瑰宝，为丽水疗休养增添了吸引力。\n\n　　“丽水疗休养，卖的不是一张床、一顿饭，而是一段有文化厚度、有情感温度的体验。”楼琅坚介绍，丽水推动产品从“通用款”向“定制款”升级，“亲子+非遗”“康养+红色”等主题线路逐渐形成体系，让不同群体都能找到属于自己的丽水打开方式。\n\n　　资源活化 价值可期\n\n　　疗休养，一头连着职工福祉，一头连着乡村振兴和生态转化。丽水手握优质资源，发展疗休养产业，何乐而不为？\n\n　　时光回溯到2015年，丽水疗休养基地数量上千，规模位居浙江省前列，却因分散的格局，陷入“养在深闺无人识”的困境。缺少辨识度高、辐射力强的品牌，成为产业发展的瓶颈。\n\n　　2023年，丽水提出“双项服务、三提三推、久久为功”12字方针，标志着工会疗休养全面转型产业化发展，“我在丽水疗休养”品牌应运而生。随后，丽水不断完善全域服务体系、深化跨区域资源协作，疗休养有效带动民宿餐饮、乡村文旅、农特产品销售等产业发展，培育了大量家门口就业岗位。\n\n　　多年精耕细作之下，“我在丽水疗休养” 逐步成长为响当当的金字招牌。目前，丽水已和浙江省内外150多家工会、企事业单位建立深度合作，年接待疗休养职工超20万人次，带动消费突破6亿元。丽水全市85%的疗休养站点扎根山区，助力3.3万名民众实现就近就业。\n\n　　政策赋能 活力迸发\n\n　　要想让更多职工走进丽水、留在丽水、记住丽水，既需要山水文化的“硬实力”，更离不开政策红利的“软环境”。\n\n　　当天活动现场，丽水九个县(市、区)文旅送团奖励政策和丽水文旅集团疗休养优惠礼包发布，为丽水疗休养产业发展图标注下“诚意坐标”。\n\n　　譬如，云和面向招徕县外团队赴云旅游的旅行社设置阶梯奖励：一日游按景区门票、内部交通费的15%予以奖励；团队住宿1晚，按住宿费的20%奖励，住宿两晚及以上，自第二晚起按住宿费的30%奖励。青田针对旅行社组织过夜旅游团队，按年住宿发票金额16%给予奖励；县外来青疗休养职工团队10人以上并住宿，每人发放“青田游礼”B套餐消费券……\n\n活动现场。　主办方 供图\n\n　　“近些年，云和文旅资源持续挖掘开发，市场上对疗休养的需求也十分旺盛。我们迫切需要一个平台，打通供给端和市场端之间的通道。”云和县文广旅体局党组成员、副局长蓝夏薇说，本次活动，既能让市场主体充分了解云和乃至丽水的山水禀赋，也全方位展示了接待配套等方面的综合服务能力。\n\n　　活动尾声设置自由洽谈环节，参会嘉宾、企业代表面对面深入交流、洽谈合作。景宁花动畲乡旅行社有限公司负责人马金波表示，丽水九个县(市、区)各有特色，这次集中晒出奖励政策，对旅行社来说吸引力十足，公司计划把景宁畲族元素和周边县域资源串珠成链，带动更多人来丽水疗休养。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3a50723a55","title":"四川推出25项举措提升大小凉山公共法律服务 慢火车成为“流动法治课堂”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734963.shtml","summary":"中新网西昌11月19日电 (程兆)四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服务三年行动，配套25项举措。","summary_short":"中新网西昌11月19日电 (程兆)四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服务三年行动，配套25项举措。","digest":"四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服务三年行动，配套25项举措","points":["中新网西昌11月19日电 (程兆)四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服…","19日，四川省人民政府新闻办公室在老成昆线西昌站举行第八期《发言人在现场》新闻发布活动…","四川还组建24人的“小快灵”普法宣讲师资库，将双语课堂搬进院坝、集市和校园"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:37:31+08:00","size":1,"keywords":[],"body":"中新网西昌11月19日电 (程兆)四川省司法厅今年启动“法治蜀光”支持大小凉山做强公共法律服务三年行动，配套25项举措。19日，四川省人民政府新闻办公室在老成昆线西昌站举行第八期《发言人在现场》新闻发布活动，介绍相关部署及慢火车普法实践。\n\n11月19日，四川省人民政府新闻办公室在老成昆线西昌站举行第八期《发言人在现场》新闻发布活动，介绍有关部署及慢火车普法实践。四川省人民政府新闻办公室 供图\n\n　　四川省司法厅公共法律服务管理处副处长李孟锦介绍，脱贫攻坚后，易地搬迁、外出务工、土地流转等带来新的法律需求。大小凉山基本公共法律服务虽已全覆盖，仍存在服务半径大、双语服务力量不足等困难。三年行动从设施建设、精准普法、法律援助、纠纷化解和人才培养五方面发力。在法律援助方面，四川已组建“四川同心·法律服务团”，组织19家律所119名律师对口帮扶19个县(市、区)；在矛盾纠纷化解方面，将规范推广“德古+”(“德古”是彝族传统民间调解人)调解模式。四川还组建24人的“小快灵”普法宣讲师资库，将双语课堂搬进院坝、集市和校园。\n\n　　老成昆线上的公益性慢火车，也成为流动法治课堂。成都铁路运输中级法院副院长徐翔介绍，这趟往返攀枝花与普雄的慢火车穿行大凉山50余年，途经38个乡镇、辐射周边97个乡镇，最低票价2元，是沿线民众重要的出行工具。近年来，成都铁路运输两级法院与中国铁路成都局集团有限公司共同打造“彝乡情·法治慢火车”。法院发放300余份问卷、开展10余次重点访谈，梳理出未成年人保护、彩礼纠纷、山货交易等普法内容，并将车厢咨询与沿线站点调解衔接。\n\n　　徐翔分享此前一次普法课经历：法官讲述一名学生被起侮辱性绰号、照片遭网络群嘲的案例后，一名10岁彝族女孩准确说出了名誉权和肖像权。孩子们还知道遇事可告诉老师、家长，并保留证据。“当孩子把‘被欺负了怎么办’从模糊的委屈转化为清晰的权利认知，这趟普法列车就没有白跑。”徐翔说。\n\n　　慢火车上的普法内容还涉及生态保护。成都铁路运输第二法院四川大熊猫国家公园生态法庭庭长冯文婷介绍，该庭五年来审理环境资源案件650余件。此前，一名乘客在车上质疑林木采伐规定，法官耐心解释了一路。临下车时，这名乘客主动添加了法官的工作微信，此后还多次咨询法律问题。\n\n　　的莫鸽鸽是省级“小快灵”普法宣讲团成员，从事基层普法40余年。她说，以前村寨纠纷多由长者按传统习俗调解，如今民众更愿主动向村干部、司法所等求助。“从我们‘追着老百姓普法’变成了‘民众主动找上门问法’。”(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c38807a1257","title":"“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动举办","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734960.shtml","summary":"中新网陕西商洛11月19日电 (记者 阿琳娜)“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动18日在秦岭博物馆举办。","summary_short":"中新网陕西商洛11月19日电 (记者 阿琳娜)“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动18日…","digest":"“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动18日在秦岭博物…","points":["活动设置主题讲座、互动交流等环节，搭建起中欧山地文明对话平台，推动秦岭文化走向世界","德累斯顿工业大学物质文化遗产方向古代史名誉教授雷诺·沃康摩尔带来题为《阿尔卑斯山脉…","陕西省人大环境与资源保护委员会副主任委员党双忍以《世界昆仑：文明贯通的脊梁》为题作主旨讲座"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:28:03+08:00","size":1,"keywords":[],"body":"中新网陕西商洛11月19日电 (记者 阿琳娜)“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动18日在秦岭博物馆举办。活动设置主题讲座、互动交流等环节，搭建起中欧山地文明对话平台，推动秦岭文化走向世界。\n\n“秦岭与阿尔卑斯山的对话——山地文明视域下的博物馆”国际学术交流活动在秦岭博物馆举办。秦岭博物馆供图\n\n　　德累斯顿工业大学物质文化遗产方向古代史名誉教授雷诺·沃康摩尔带来题为《阿尔卑斯山脉：欧洲历史的十字路口》专题分享。陕西省人大环境与资源保护委员会副主任委员党双忍以《世界昆仑：文明贯通的脊梁》为题作主旨讲座。\n\n　　在互动环节，主讲嘉宾就中欧山地文化的共性特征与文明差异、博物馆创新实践、“世界昆仑”视域下秦岭的文明价值等话题与现场观众进行交流。\n\n　　此次活动以秦岭与阿尔卑斯山脉为纽带，传承古丝绸之路交流互鉴精神，搭建起中欧山地文明交流平台，为东西方文博领域学术对话、互学互鉴提供实践载体。秦岭博物馆将以本次交流为契机，持续推进秦岭文化国际传播，推动中欧博物馆行业建立常态化交流协作，为促进不同文明交流互鉴贡献力量。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1d78c284fa","title":"河北衡水七旬老人手缝爱心坐垫 温暖候车人","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075506.shtml","summary":"11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上。","summary_short":"11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上。","digest":"11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上","points":["11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上","2024年一场大雪后，崔素英心疼候车人坐在冰凉的长凳上，便开始用旧布料手工缝制棉坐垫","此后每年冬天，她都会穿梭在大街小巷，定期巡查、修补、更换棉坐垫…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:17:30+08:00","size":1,"keywords":[],"body":"11月19日，河北衡水70岁退休环卫工崔素英将一个个棉坐垫，铺在公交站台的长凳上。据了解，2024年一场大雪后，崔素英心疼候车人坐在冰凉的长凳上，便开始用旧布料手工缝制棉坐垫。此后每年冬天，她都会穿梭在大街小巷，定期巡查、修补、更换棉坐垫，用一针一线温暖着这个城市的候车人。(刘汇斌 王红 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/E3404A45BCD048F28025261DE37A4FCC.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c32bb652b4c","title":"在深圳“最难约”红树林打卡地 偶遇“鸟中大熊猫”","url":"https://www.chinanews.com/sh/shipin/2026/11-19/news1075504.shtml","summary":"听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一。","summary_short":"听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一。","digest":"听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一","points":["听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一","这是全国唯一处在城市腹地、面积最小的国家级自然保护区","这里有大片的红树林，但为什么是绿色的"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:03:52+08:00","size":1,"keywords":[],"body":"听说，福田红树林国家级自然保护区被称为深圳“最难约”的打卡地之一。这是全国唯一处在城市腹地、面积最小的国家级自然保护区。这里有大片的红树林，但为什么是绿色的？红树林不仅能防风消浪，还为大量生物提供了栖息的家园。在红树林，我们偶遇“鸟中大熊猫”黑脸琵鹭吃“下午茶”，还似乎听到了野猪的声音……(记者 高萌 任帅)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/28CE48E57B7C44B0A7E7A52C255DE47D.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cb274d63394","title":"琼州海峡智能航运示范工程在海口启动","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734950.shtml","summary":"中新网海口11月19日电 (贾浪博)琼州海峡智能航运示范工程启动仪式19日在海口举行，标志着琼州海峡智能航运建设迈入实质推进阶段。","summary_short":"中新网海口11月19日电 (贾浪博)琼州海峡智能航运示范工程启动仪式19日在海口举行…","digest":"琼州海峡智能航运示范工程启动仪式19日在海口举行…","points":["中新网海口11月19日电 (贾浪博)琼州海峡智能航运示范工程启动仪式19日在海口举行…","琼州海峡是国家重大战略通道，是海南自由贸易港对外联通的咽喉要道","为深入贯彻交通强国、海洋强国战略，落实《国务院关于深入实施“人工智能+”行动的意见》和交通运…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T22:01:25+08:00","size":1,"keywords":[],"body":"中新网海口11月19日电 (贾浪博)琼州海峡智能航运示范工程启动仪式19日在海口举行，标志着琼州海峡智能航运建设迈入实质推进阶段。\n\n　　琼州海峡是国家重大战略通道，是海南自由贸易港对外联通的咽喉要道。为深入贯彻交通强国、海洋强国战略，落实《国务院关于深入实施“人工智能+”行动的意见》和交通运输部等四部委印发的《智能航运2030行动计划》，依托琼州海峡固定航线、高频往返、港航衔接紧密的典型场景，启动该示范工程。\n\n　　工程坚持“创新驱动、场景牵引、船岸一体、安全可控”，汇聚政府、行业机构、院所、企业等多方力量，协同推进智能航运关键技术攻关，开展真实航线下的系统集成与实景验证，打造复杂水域客滚运输智能航运样板。\n\n11月19日，琼州海峡智能航运示范工程启动仪式在海口举行。贾浪博 供图\n\n　　启动仪式上，交通运输部相关司局、中国船级社、粤琼两省海事与交通运输主管部门、中远海运集团相关负责人先后致辞。各方一致认为，示范工程是落实《智能航运2030行动计划》的重要举措，对保障琼州海峡客滚运输安全畅通、提升航运智能化水平、服务海南自贸港建设具有重要意义；将加强跨层级、跨区域协同，推动标准共建、数据互通、监管联动，形成“技术研发-场景验证-制度适配”闭环。\n\n　　据悉，下一步各参与方将稳妥推进智能航运技术先行先试，同步完善适配智能船舶的监管治理与标准规范。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4e18535348","title":"新华视点｜一地一特色 看乡土大地的丰收与青绿","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734946.shtml","summary":"安徽阜阳：错峰小辣椒 种出大产业  　　眼下，安徽省阜阳市阜南县会龙镇3.5万亩延秋辣椒迎来采收高峰。","summary_short":"安徽阜阳：错峰小辣椒 种出大产业  　　眼下，安徽省阜阳市阜南县会龙镇3.5万亩延秋辣椒迎来采收高峰。","digest":"安徽阜阳：错峰小辣椒 种出大产业  　　眼下…","points":["安徽阜阳：错峰小辣椒 种出大产业","眼下，安徽省阜阳市阜南县会龙镇3.5万亩延秋辣椒迎来采收高峰","当地辣椒产业已发展30余年，辣椒畅销全国60多个城市…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:50:57+08:00","size":1,"keywords":[],"body":"安徽阜阳：错峰小辣椒 种出大产业\n\n　　眼下，安徽省阜阳市阜南县会龙镇3.5万亩延秋辣椒迎来采收高峰。当地辣椒产业已发展30余年，辣椒畅销全国60多个城市，并形成年交易额近20亿元的区域性蔬菜交易中心，带动1.2万余名群众全产业链就近增收。同时，当地以“我为企业找市场”等活动搭建产销对接平台，为农户找订单、找市场，通过小小辣椒持续推动乡村振兴。\n\n　　江西南昌：丰收路上有个“暖心家”\n\n　　南昌县是江西的产粮大县，今年晚稻收割期间，为了解决跨区作业的农机手停靠难、休息难、补给难等难题，南昌县塘南镇以紧邻昌万公路的主驿站为核心，联动各村党群服务中心，打造“1+N”秋收驿站农机大本营。\r\n\n　　河北临漳：初冬韭菜喜丰收 特色产业富农家\n\n　　初冬时节，河北省临漳县韭菜进入采收旺季，田间地头一派繁忙的丰收景象。\n\n　　四川合江：柚满枝头促增收\n\n　　时下正是四川省泸州市合江县真龙柚成熟上市的时候。真龙柚是合江县独有的地方柚类品种，也是国家地理标志保护产品，口感清甜脆嫩，深受消费者喜爱。目前，合江县真龙柚种植面积达到30.8万亩，今年预计总产量约8.5万吨，综合产值达11亿元，全县400余家专业合作社、经营主体带动10万余人参与产业发展，果农人均年增收2000元以上。\n\n　　板上逐光造绿电 板下治沙“点沙成金”\n\n　　板上逐光造绿电，板下修复治黄沙。石嘴山市着力盘活大面积闲置荒漠资源，在毛乌素沙地实施100万千瓦光伏发电复合项目，让2.5万亩荒漠变宝地，真正实现“点沙成金”。\n\n　　新疆尉犁县：黄沙碧水映胡杨\n\n　　近日，在塔克拉玛干沙漠北缘，新疆尉犁县160万亩胡杨林进入最佳观赏期。从漫漫黄沙渐进，乘舟泛于塔里木河水面，胡杨扎根河水下的沙土，倒影映照，波光粼粼。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4d58636daf","title":"从“国际手账”看深圳！三个现场读懂创新之城“待客之道”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734945.shtml","summary":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行","这是中国第三次，也是时隔12年再次担任APEC东道主","深圳地铁运营总部党委副书记屈恩久介绍，岗厦北综合交通枢纽采用“ T”字形布局，共五层…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:49:25+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行。这是中国第三次，也是时隔12年再次担任APEC东道主。\n\n　　有朋自远方来，不亦乐乎。近日，记者穿行于深圳多处城市场景，从岗厦北枢纽九秒钟顺畅换乘，到华强北“一米柜台”高效出货，再到写满各国客商留言的手账，深圳把“开放、创新、合作”写进城市日常，以务实、鲜活的“待客之道”助力共同繁荣的亚太新未来。\n\n　　看得见的便利，是待客的第一层。\n\n　　路怎么走、票怎么买，深圳替八方来客想到了前头。\r\n\n　　早高峰刚过，深圳岗厦北地铁站依然人流如织。记者从14号线站台出发，换乘11号线，掐表计时，全程仅用了9秒。\n\n　　深圳地铁运营总部党委副书记屈恩久介绍，岗厦北综合交通枢纽采用“ T”字形布局，共五层、23个出入口，总建筑面积约23万平方米，共5条地铁在此汇聚，串联起深圳各个片区。\n\n　　枢纽采用“交通＋商业”一体化开发，每天都有超过40万人次客流在这里集散，都可享受出行、休闲一站式服务。\n\n　　走进安检口，支持30多种语言实时翻译的多语种显示屏映入眼帘，极大提高了地铁工作人员与不同语言国家游客的沟通效率。“客人出行，最先想知道路线情况。”屈恩久说，为了让外国朋友“看得懂、走得顺”，对全线中英文标识进行全面检查和规范，并对一线工作人员开展外语专项培训。\n\n　　目前，深圳地铁全线网17条运营线路、432座车站已全面支持中国银联、Visa、万事达卡、美国运通、JCB五大卡组织的银行卡“拍卡过闸”，可受理200多个国家和地区发行的银行卡。境外旅客无需兑换现金或购买本地交通卡，将银行卡靠近闸机感应区即可立刻通行。\n\n　　愿分享的创意，是待客的第二层。\n\n　　开放待客的底气，根植于源源不断的创新活力中，体现在高效完备的产业生态上。\n\n　　“上午设计、下午打样、次日量产、一周出海。”在华强北，这不是一句口号，而是落地的日常。\n\n　　从上世纪80年代的“一米柜台”起步，华强北一路成长为“中国电子第一街”。如今，1.45平方公里的街区聚集着11.5万家商事主体，超百万种电子元器件，形成研发、打样、量产、出海可在步行一公里内完成的创新链条，支持AI眼镜、智能硬件、机器人等新品快速落地。\n\n　　“一个创意进，一个产品出。”华强北全球智能硬件定制体验中心负责人王强说，创客们可以在华强北快速找到创造灵感，并且快速链接供应链的资源。把图纸变成样机，把样机变成订单。\n\n　　数据显示，华强北电子产品出口覆盖全球190多个国家和地区，日均海外客商流量超7000人次，商圈年交易额突破4000亿元。\n\n　　“这里可看的东西太多了。昨天我们又多买了一个行李箱，准备带一整箱中国产品回去。”一位外国游客感慨，“在深圳，我看到了未来的图景。”\n\n　　留得下的情谊，是待客的第三层。\n\n　　交朋友，终究讲究以诚相待、以心相交。深圳以真心待客，图的是常来常往。\n\n　　在华强北一处6平方米的档口，老板邓贵华有本“国际手账”。手账里记下了来自世界各地客商的签名、合影，以及他们的故事。不到一年间，这本相册已经汇集了来自87个国家和地区顾客的签名与合影，涵盖全部21个APEC成员经济体。\n\n　　“最开始我只是在朋友圈分享这些相遇。后来转念一想，不如亲手留存下来，往后翻看都是非常有意义的纪念。”邓贵华说，纵然语言沟通存在障碍，但从一页页工整字迹里，能够读懂各国友人传递的善意和祝福。\n\n　　言语有界，民心相通。透过这方寸柜台，透过深圳这扇中国改革开放的窗口，世界触摸到一个更加开放包容的中国。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c1006f7ba","title":"何以中国｜唐韵润古邑 诗脉续长安","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734943.shtml","summary":"中国日报网11月19日电 山河更迭，风雅长存。","summary_short":"中国日报网11月19日电 山河更迭，风雅长存。","digest":"中国日报网11月19日电 山河更迭，风雅长存","points":["中国日报网11月19日电 山河更迭，风雅长存","11月19日，“何以中国·诗词里的千年文脉”网络主题宣传活动于古都西安启幕","纵使时代千帆竞发、科技日新月异，古典诗词始终沉淀着华夏儿女的家国情怀与人生哲思…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:47:14+08:00","size":1,"keywords":[],"body":"中国日报网11月19日电 山河更迭，风雅长存。11月19日，“何以中国·诗词里的千年文脉”网络主题宣传活动于古都西安启幕。纵使时代千帆竞发、科技日新月异，古典诗词始终沉淀着华夏儿女的家国情怀与人生哲思，是镌刻民族风骨的精神根脉。千年长安承唐风诗韵，以全域深耕的文化建设，探寻古典文脉古今赓续的新生之路。\r\n\n　　为活化传承唐诗文化、擦亮千年古都文化名片，西安于2025年9月出台唐诗文化品牌专项建设方案。城市锚定三年建设目标，蓄力在2027年底打造享誉海内外的国际化“唐诗之都”。整套建设体系多维布局、层层落地，涵盖文史研究、古艺遗存保护、文商旅融合发展、文化品牌打造、数字文创升级五大维度，细化为多项落地举措。\n\n　　今朝长安，一城街巷皆诗意，千载风雅入寻常。曲江飞行剧院依托前沿光影技术，复刻盛唐坊市盛景，让观者凌空入梦、尽览大唐风华。长安十二时辰主题街区完整复刻唐代里坊格局，以实景街巷、唐风演艺、飞花对诗、市井雅集还原盛唐烟火，诗词意蕴融于一砖一瓦、一言一行之间。大唐不夜城古韵流转，沉浸式诗词互动频频上演，游人穿行其间，与千年诗魂隔空相逢，从观景的过客变为入画的归人。\n\n　　长安云·“一带一路”城市展示体验中心里集章寻诗、AI题诗、VR等新潮雅致的轻量体验，降低了古典诗词的品鉴门槛。科技赋能、业态创新皆为传文载道的良器，让古韵经典走近青年、焕发新生，形成乐于体验、乐于分享、乐于传承的文化新风尚。\n\n　　诗韵藏于碑石，故事演于舞台。《长恨歌》实景演出以骊山为幕、华清池为台，将千古名篇化作山水间的歌舞长卷，字句里的悲欢情思，伴着光影流水娓娓道来。西安碑林博物馆碑碣林立，历代名家笔墨镌刻石上，诗文书迹同存，一笔一画皆是古人的风雅心境。小雁塔与西安博物院静立城南，古塔悠悠，馆藏丰富，在古塔、文物与史籍之间，静静铺展属于长安的诗史长卷，让访客在驻足观览间，读懂唐诗扎根的历史土壤。\n\n　　文脉传承的至高境界，从来不是束之高阁的研读，而是融于烟火的共生。让千年经典走出古籍书卷，嵌入城市肌理、浸润百姓生活，让每一个普通人都能与风雅不期而遇。当一句唐诗、一抹唐韵，总能治愈人心、触动情怀，华夏文脉便完成了从文字典籍到精神血脉、从一时热度到长久生命力的升华。这便是“何以中国”，藏在千年诗韵里的文化答案。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c33dfd99c79","title":"江西发现植物新种华东堇菜","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734940.shtml","summary":"中新社江西抚州11月19日电 (朱莹)记者19日从江西马头山国家级自然保护区管理局获悉，江西马头山国家级自然保护区与中山大学科研团队在开展生物多样性调查时发现堇菜属植物新物种——华东堇菜。","summary_short":"中新社江西抚州11月19日电 (朱莹)记者19日从江西马头山国家级自然保护区管理局获悉…","digest":"记者19日从江西马头山国家级自然保护区管理局获悉…","points":["中新社江西抚州11月19日电 (朱莹)记者19日从江西马头山国家级自然保护区管理局获悉…","该研究成果于11月17日发表在国际植物分类学期刊《北欧植物学杂志》上","“科研团队在马头山采集活体标本与分子材料，并结合大量历史标本进行比对…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T21:46:44+08:00","size":1,"keywords":[],"body":"中新社江西抚州11月19日电 (朱莹)记者19日从江西马头山国家级自然保护区管理局获悉，江西马头山国家级自然保护区与中山大学科研团队在开展生物多样性调查时发现堇菜属植物新物种——华东堇菜。\n\n　　该研究成果于11月17日发表在国际植物分类学期刊《北欧植物学杂志》上。\n\n　　“科研团队在马头山采集活体标本与分子材料，并结合大量历史标本进行比对，最终确认该植株为未被报道过的新物种。”江西马头山国家级自然保护区管理局高级工程师熊宇介绍，目前已知该物种仅分布于江西马头山国家级自然保护区山谷岩缝生境，海拔约685米。因其杂交后代广布于华东，主要分布在安徽黄山、浙江天目山一带，故命名为华东堇菜。\n\n2024年3月，江西马头山国家级自然保护区发现堇菜属植物新物种——华东堇菜。熊宇 摄\n\n　　华东堇菜隶属于堇菜科堇菜属，为多年生草本植物，植株高3至10厘米，根状茎短粗，无匍匐茎，根状茎分枝，顶部基生叶莲座状。叶片卵形、基部心形、叶缘具细圆齿；花瓣淡紫色，侧瓣具须毛，基部无黄斑，花期为3月至4月，夏秋季具闭锁花。\n\n　　科研调查显示，该新种生境特异性强、自然分布范围狭窄、野生种群数量稀少，具备极高的物种独特性与科研价值。\n\n2025年2月，江西马头山国家级自然保护区发现堇菜属植物新物种——华东堇菜。熊宇 摄\n\n　　据介绍，华东堇菜的发现进一步丰富了中国堇菜属植物的物种多样性，为东亚地区堇菜属植物的分类学研究和系统演化分析提供了新的材料，其发现和研究对于区域珍稀植物资源保护及生物多样性保护工作具有重要意义。\n\n　　地处江西省资溪县境内的马头山保护区是武夷山脉生物多样性核心区域，有着“罕见的动植物基因库”之称，已查明分布有高等植物270科1078属2938种，其中国家重点保护植物41种。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":77,"items":[{"id":"c87cc49e8d7","title":"Anthropic首日掛牌 成為全球第12大市值公司","url":"https://news.tvb.com/tc/1207360-Anthropic首日掛牌成為全球第12大市值公司","summary":"美國人工智能公司Anthropic，首日於納斯達克市場掛牌，即成為全球第12大市值公司，市值剛剛高於「股神」巴菲特投資旗艦巴郡。以收市價97.17美元計，Anthropic的市值達1.27萬億美元，高過市值1.21萬億美元的巴郡。","summary_short":"美國人工智能公司Anthropic，首日於納斯達克市場掛牌，即成為全球第12大市值公司…","digest":"美國人工智能公司Anthropic，首日於納斯達克市場掛牌…","points":["美國人工智能公司Anthropic，首日於納斯達克市場掛牌，即成為全球第12大市值公司…","以收市價97.17美元計，Anthropic的市值達1.27萬億美元…","如果以全面攤薄股權計，即計上認股權等潛在發行股份，公司市值更高達約1.8萬億美元…"],"section":"財經","category":"財經","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T06:55+08:00","size":2,"keywords":[],"body":"美國人工智能公司Anthropic，首日於納斯達克市場掛牌，即成為全球第12大市值公司，市值剛剛高於「股神」巴菲特投資旗艦巴郡。\n\n以收市價97.17美元計，Anthropic的市值達1.27萬億美元，高過市值1.21萬億美元的巴郡。如果以全面攤薄股權計，即計上認股權等潛在發行股份，公司市值更高達約1.8萬億美元，令公司成為全球10大市值企業。\n\n另外有外媒報道，Anthropic今次發售的股份，一般散戶獲分派一成半股份，而有超過一半的機構投資者未能分得股份。","image":"https://pro-vod-cdn.tvb.com/426f9959ee8349788092ad52a50ca6d0/snapshots/f56c05922cd044b8b6d9485d5192063b-00005.jpg","video":"https://pro-vod-cdn.tvb.com/426f9959ee8349788092ad52a50ca6d0/6680a9fa36cf46fe833060bce70ce565-d2133c927e895ea317114f269c9e8847-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/426f9959ee8349788092ad52a50ca6d0/snapshots/f56c05922cd044b8b6d9485d5192063b-00005.jpg","lang":"zh-Hant","items":[{"title":"Anthropic首日掛牌 成為全球第12大市值公司","url":"https://news.tvb.com/tc/1207360-Anthropic首日掛牌成為全球第12大市值公司","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T06:55+08:00","category":"財經","digest":"美國人工智能公司Anthropic，首日於納斯達克市場掛牌…"},{"title":"Anthropic首日於納斯達克掛牌","url":"https://news.tvb.com/tc/1207346-Anthropic首日於納斯達克掛牌","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T00:16:00+08:00","category":"財經","digest":"美國人工智能公司Anthropic，首日於納斯達克掛牌"}]},{"id":"c015f1bfa5f","title":"汽车早报｜马斯克称特斯拉会继续在中国提高产量 丰田在美召回约31.4万辆汽车","url":"https://www.jiemian.com/article/15332795.html","summary":"中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆  据中国汽车工业协会统计分析，2026年1-10月，汽车销量排名前十位的企业（集团）共销售2226.1万辆…","summary_short":"中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆  据中国汽车工业协会统计分析，2026年1-10月…","digest":"中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆  据中国汽车工业协…","points":["中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆","据乘联分会消息，综合头部厂商目标完成进度推算，11月狭义乘用车零售市场规模约163万辆…","据玉渊潭天，11月19日，中国贸促会会长任鸿斌会见特斯拉公司首席执行官埃隆·马斯克"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:33:00+08:00","size":1,"keywords":[],"body":"中汽协：1-10月汽车销量排名前十位的企业共销售2226.1万辆\n\n据中国汽车工业协会统计分析，2026年1-10月，汽车销量排名前十位的企业（集团）共销售2226.1万辆，占汽车销售总量的84.7%。在上述十家企业中，与去年同期相比，吉利控股和奇瑞控股销量呈不同程度增长，其他企业销量均呈不同程度下降。\n\n乘联分会：预计11月狭义乘用车零售市场规模约163万辆，环比下降1.1%\n\n据乘联分会消息，综合头部厂商目标完成进度推算，11月狭义乘用车零售市场规模约163万辆，环比下降1.1%；新能源全月零售预计可达115万辆左右，渗透率约70.6%，成为当前市场最主要的支撑力量。\n\n吉林：发展智能网联汽车，支持迭代高阶自动驾驶技术\n\n吉林省人民政府办公厅印发《吉林省“人工智能+”发展“十五五”规划》，其中提出，培育智能消费新产品，发挥光电信息、精密制造等产业优势，丰富消费级智能终端产品，发展智能网联汽车，支持迭代高阶自动驾驶技术，开发智能座舱产品，推进车载端侧大模型部署，支持本地化推理决策与智能服务，发展健康养老、教育、文旅等场景智能可穿戴设备，支持研发具备多模态感知和场景自适应解决能力的具身智能机器人产品，推进在情感陪伴、家务辅助、康养护理等场景应用示范，加快人工智能与元宇宙、增材制造、脑机接口等前沿技术融合创新，探索发展新型智能产品。\n\n马斯克：特斯拉会继续在中国提高产量\n\n据玉渊潭天，11月19日，中国贸促会会长任鸿斌会见特斯拉公司首席执行官埃隆·马斯克。马斯克表示，他是中国的超级粉丝，中国有太多宏伟壮观的建筑与自然景观，他尤其点赞了中国的铁路系统。他还表示，特斯拉会继续在中国提高产量。据悉，这是马斯克首次公开到访深圳。抵达深圳后，马斯克还在社交平台上发文表示所谓“修昔底德陷阱”能够被避免。\n\n奇瑞控股集团增资至63.9亿元，增幅约10%\n\n天眼查App显示，11月16日，奇瑞控股集团有限公司发生工商变更，新增工融金投二号（北京）新兴产业股权投资基金合伙企业（有限合伙）为股东，同时，注册资本由约58.2亿元人民币增至约63.9亿元人民币，增幅约10%。\n\n该公司成立于2010年10月，法定代表人为尹同跃，经营范围包括汽车及汽车零部件生产与研发、汽车修理、机械加工、造船、房地产开发与建设的投资管理等，现由芜湖市投资控股集团有限公司、芜湖瑞创投资股份有限公司及上述新增股东等共同持股。\n\n华境S五座版正式官宣\n\n11月19日，华境汽车正式官宣华境S五座版本，新版本延续六座版的智能和安全底座，车身尺寸长5235mm、宽1999mm、高1800mm，轴距3105mm，全系配备华为乾崑智驾ADS 5 Pro与鸿蒙座舱5.2。\n\n宝马新世代i3车型将于广州车展开启订购\n\n11月19日，宝马中国宣布，新世代BMW i3将于11月27日在广州车展上市，大订通道同步开启。新车采用全国统一价模式，无需小订。\n\n马斯克披露多项业务时间表：Optimus拟18个月内胜任家务，Terafab计划2028年底量产\n\n当地时间11月18日，特斯拉CEO埃隆·马斯克通过视频连线参加美国奥斯汀举行的TomorrowX峰会，并披露旗下多项业务进展。他表示，Optimus人形机器人有望在未来12至18个月内完成洗碗、清洗烘干并收纳等家务；Terafab研究工厂计划于明年6月试产首款测试芯片，并争取在2028年底实现第一阶段量产；xAI目前每月新增约0.5吉瓦算力，明年将提高至每月超过1吉瓦。\n\n马斯克还称，星舰实现完全、快速重复使用后，进入轨道的成本有望降低约100倍；Neuralink目前已为30多名受试者植入脑机接口设备。谈及英伟达时，他将CEO黄仁勋比作迈克尔·乔丹，称其是科技企业创始人中的顶尖人物，若失去黄仁勋的领导，对英伟达将是重大打击。\n\n丰田在美召回约31.4万辆汽车，涉及安全气囊隐患\n\n11月19日，美国国家公路交通安全管理局（NHTSA）公告显示，丰田汽车将召回314,029辆汽车，涉及部分2002—2010款雷克萨斯SC430、2011款IS250、2017款GX460，以及2003—2008款丰田卡罗拉、2005—2006款坦途、2005—2007款红杉和2016—2017款4Runner。召回原因是部分车辆配备的高田前排乘客安全气囊充气装置可能因长期暴露于高湿度、高温及温度反复变化的环境而发生性能退化，导致充气装置破裂，金属碎片可能击中驾驶员或其他乘员，造成严重伤害甚至死亡。\n\n未经正式授权严禁转载本文，侵权必究。汽车要闻\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n汽车早报｜马斯克称特斯拉会继续在中国提高产量 丰田在美召回约31.4万辆汽车\n\n华境S五座版正 在柏林表示，俄罗斯已同意欧洲参加多边谈判机制。","digest":"美国总统特朗普的女婿库什纳11月19日在柏林表示，俄罗斯已同意欧洲参加多边谈判机制","points":["美国总统特朗普的女婿库什纳11月19日在柏林表示，俄罗斯已同意欧洲参加多边谈判机制","在当天举行的“志愿联盟”会议后，库什纳与欧洲多国领导人共同出席记者会时说…","他说，俄方能够接受乌克兰获得类似《北大西洋公约》第五条集体防御条款的安全保障…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:21:06+08:00","size":1,"keywords":[],"body":"美国总统特朗普的女婿库什纳11月19日在柏林表示，俄罗斯已同意欧洲参加多边谈判机制。在当天举行的“志愿联盟”会议后，库什纳与欧洲多国领导人共同出席记者会时说，重启欧洲与俄罗斯直接对话尤为重要，双方将直接听取彼此的诉求。他说，俄方能够接受乌克兰获得类似《北大西洋公约》第五条集体防御条款的安全保障，同时也表达了不再爆发新冲突的意愿。库什纳强调，相关安全保障需要建立一套涵盖监督核查、威慑等措施的机制，这是一项重大举措，特朗普对此也持开放态度，但前提是必须符合美国利益。（新华社）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c14c068646d","title":"有中国公民在委内瑞拉遭网络电信诈骗，中使馆发布提醒","url":"https://www.jiemian.com/article/15352849.html","summary":"11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报，有我公民在委遭到网络电信诈骗并蒙受经济损失。","summary_short":"11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报，有我公民在委遭到网络电信诈骗并蒙受经济损失。","digest":"11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报…","points":["11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报…","一、请务必保持高度警惕和反诈意识，切勿轻信互联网平台和社交软件上的“婚恋交友”…","二、下载手机应用软件“全民反诈”APP，关注“国家反诈中心”、“北京反诈”…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:19:34+08:00","size":1,"keywords":[],"body":"11月20日，据“中国驻委内瑞拉大使馆”公众号消息，我馆近日接到举报，有我公民在委遭到网络电信诈骗并蒙受经济损失。中国驻委内瑞拉使馆再次提醒在委中国公民：\n\n一、请务必保持高度警惕和反诈意识，切勿轻信互联网平台和社交软件上的“婚恋交友”、“理财指导”、“优惠换汇”等诱导信息，以免落入不法分子圈套。\n\n二、下载手机应用软件“全民反诈”APP，关注“国家反诈中心”、“北京反诈”、“广东反诈中心”或“江门邑反诈”等微信公众号，熟悉和了解电信诈骗典型案例，提高辨识和自我防护能力。如遭此类电信诈骗，立即联系有关银行或平台终止转账或支付流程，将损失降到最低，同时通过“全民反诈”APP进行举报，亦可向国内户籍所在地公安机关报案。\n\n驻委内瑞拉使馆领事保护与协助电话（24小时）：0058-(0)414-3669883（注：境外号码拨打0058-414-3669883，境内号码拨打0414-3669883即可。）\n\n外交部全球领事保护与服务应急热线(24小时)：\n\n0086-10-12308或0086-10-65612308","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5b1d4e9980","title":"AI早报|Anthropic向英国及欧洲散户投资者售股11亿美元，OpenAI进军手机领域","url":"https://www.jiemian.com/article/15351973.html","summary":"三星称云服务商仅占整体市场约8%，认为不会显著威胁AI行业增长  三星电子11月18日在新加坡举行的摩根士丹利会议上表示，高负债云服务商（Neocloud）在整体市场中的占比相对有限，约为8%…","summary_short":"三星称云服务商仅占整体市场约8%，认为不会显著威胁AI行业增长  三星电子11月18日在新加坡举行的摩根士丹利会议上表示…","digest":"三星称云服务商仅占整体市场约8%…","points":["三星称云服务商仅占整体市场约8%，认为不会显著威胁AI行业增长","三星电子11月18日在新加坡举行的摩根士丹利会议上表示…","三星零部件业务部门企业管理、战略与运营负责人金容宽表示…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:15:00+08:00","size":1,"keywords":[],"body":"三星称云服务商仅占整体市场约8%，认为不会显著威胁AI行业增长\n\n三星电子11月18日在新加坡举行的摩根士丹利会议上表示，高负债云服务商（Neocloud）在整体市场中的占比相对有限，约为8%，相关风险不会对AI行业整体增长趋势构成重大威胁。三星零部件业务部门企业管理、战略与运营负责人金容宽表示，市场对这类企业债务驱动数据中心扩张的担忧不应被过度放大。三星晶圆代工销售与营销负责人康锡采表示，当前AI投资热潮由实际需求驱动，而非投机行为，芯片制造商与客户签订的长期合同也提高了供需可见度。他预计，当前芯片短缺将在可预见的未来持续。\n\nAnthropic向英国及欧洲散户投资者售股11亿美元\n\n11月19日消息，Anthropic在英国及欧洲大陆向散户投资者出售了价值约11亿美元的股票。根据监管文件，该公司向英国散户出售逾360万股，向欧盟、挪威和瑞士投资者出售近970万股。按每股83美元的IPO发行价计算，Anthropic及其联合创始人分别通过英国和欧洲大陆的散户发售筹集约3亿美元和8.01亿美元。此次IPO总募资额达1073亿美元，创历史纪录。\n\nLG Uplus拟投资7890亿韩元建设坡州AI数据中心三期项目\n\n韩国LG Uplus 11月19日宣布，董事会已批准投资7890亿韩元建设坡州人工智能数据中心（AIDC）三期项目，以满足客户需求增长。项目预计于2026年11月23日开工，2029年1月31日完工。公司称，投资金额已按预估金额的约130%设定，以应对价格、汇率等因素波动，实际金额可能根据经营环境变化调整。\n\n联想集团杨元庆：对AI算力需求的长期增长充满信心\n\n11月19日，联想集团公布截至2026年9月30日的2026/27财年第二季度业绩：集团季度营收首次突破2000亿元人民币，同比增长近50%，创历史新高；调整后净利润同比增长166%，创历史新高；调整后净利润率同比提升2个百分点至4.5%，刷新自收购摩托罗拉移动和IBM x86服务器业务以来的历史纪录。\n\n第二财季，集团AI相关业务营收同比增长近80%，突破700亿元人民币，占集团整体营收近四成。其中，AI服务器营收同比增长超过300%，储备订单进一步扩大至5300亿元人民币；AI服务营收实现三位数同比增长。\n\n“AI在企业现在还只是引入和尝试阶段。”联想集团董事长兼CEO杨元庆称，“我们对AI算力需求的长期增长充满信心。”\n\nOpenAI进军手机领域，富士康旗下富智康集团获组装订单\n\n11月19日，据供应链消息，富士康旗下富智康集团（02038.HK）已获得OpenAI手机项目订单，将参与相关产品的整机组装。富士康同时是苹果iPhone的主要组装商。若OpenAI手机最终面市，其将进入手机终端市场，并可能围绕AI交互体验，与现有手机品牌展开更直接的竞争。相关产品方案、订单规模及量产安排，仍有待进一步获悉。（人民财讯）\n\n谷歌推出Gemini 4 Neon模型\n\n北京时间11月19日，谷歌正式推出Gemini 4 Neon。谷歌介绍，企业日常业务高度依赖电子表格、PDF文档、图表及音视频资料。Neon能够在单个100万token上下文窗口内同步处理各类异构数据，并将其整合为结构化交付物。该模型定价为每百万输入token 3美元（缓存输入token享0.5折优惠，仅需0.15美元/百万），每百万输出token 15美元。\n\n未经正式授权严禁转载本文，侵权必究。OpenAI\n\n美国亚利桑那州称已对OpenAI及其他公司展开刑事调查19小时前\n加州起诉OpenAI，控其模型测试疏于管控、危害公共安全2天前\n\n硬科技\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面 岛微电网在福建福鼎台山岛投运…","digest":"据国家电网消息，昨天，全国首个独立运行的兆瓦级海岛微电网在福建福鼎台山岛投运…","points":["据国家电网消息，昨天（11月19日），全国首个独立运行的兆瓦级海岛微电网在福建福鼎台山岛投运…","此次投运的微电网工程，配置风机、光伏、锂电池和氨氢燃料电池，总装机容量达到1.5兆瓦…","工程投运后，岛上实现24小时全绿电供电"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:13:46+08:00","size":1,"keywords":[],"body":"据国家电网消息，昨天（11月19日），全国首个独立运行的兆瓦级海岛微电网在福建福鼎台山岛投运，台山岛彻底告别柴油发电时代，实现百分之百绿电不间断供电。\n\n此次投运的微电网工程，配置风机、光伏、锂电池和氨氢燃料电池，总装机容量达到1.5兆瓦，年发电量120万千瓦时。工程投运后，岛上实现24小时全绿电供电。\n\n据介绍，台山岛是福建离陆地最远的有人居住岛屿，由于海底地形复杂，一直未能敷设海底电缆，全岛依靠柴油发电。为保障岛上居民可靠用电，今年1月微电网工程开工建设，至此，台山岛彻底告别了柴油发电的历史，当地渔业、民宿业等发展也有了可靠电力支撑。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"caceac3d7f6","title":"新开发银行熊猫债累计发行规模破千亿","url":"https://www.jiemian.com/article/15352833.html","summary":"11月18日，新开发银行于中国银行间债券市场成功定价发行80亿元熊猫债。","summary_short":"11月18日，新开发银行于中国银行间债券市场成功定价发行80亿元熊猫债。","digest":"11月18日，新开发银行于中国银行间债券市场成功定价发行80亿元熊猫债","points":["11月18日，新开发银行于中国银行间债券市场成功定价发行80亿元熊猫债","本期债券设置3年期、5年期两个期限品种，发行规模分别为60亿元、20亿元","本次发行引入双向回拨机制，可在不同期限品种间灵活调剂发行规模…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:07:38+08:00","size":1,"keywords":[],"body":"11月18日，新开发银行于中国银行间债券市场成功定价发行80亿元熊猫债。本期债券设置3年期、5年期两个期限品种，发行规模分别为60亿元、20亿元。本次发行引入双向回拨机制，可在不同期限品种间灵活调剂发行规模，进一步优化定价效率与期限结构配置。随着此次债券顺利发行，新开发银行累计发行的熊猫债规模达到1025亿元。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca4bc752f32","title":"能源早报｜紫金矿业拟不超过30亿元回购A股股份；内蒙古电力集团原董事长张海峰被“双开”","url":"https://www.jiemian.com/article/15352300.html","summary":"紫金矿业拟不超过30亿元回购A股股份  紫金矿业11月19日公告，公司拟以自有资金和/或自筹资金(含金融机构回购专项贷款等)回购A股股份，回购金额不低于20亿元且不超过30亿元…","summary_short":"紫金矿业拟不超过30亿元回购A股股份  紫金矿业11月19日公告…","digest":"紫金矿业拟不超过30亿元回购A股股份  紫金矿业11月19日公告…","points":["紫金矿业11月19日公告，公司拟以自有资金和/或自筹资金(含金融机构回购专项贷款等)回购A股…","回购股份将用于员工持股计划或股权激励，若公司未能在股份回购实施结果暨股份变动公告后3年内使用…","宁德时代11月19日公告，公司于2026年11月19日通过深圳证券交易所回购A股股份850…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:06:40+08:00","size":1,"keywords":[],"body":"紫金矿业拟不超过30亿元回购A股股份\n\n紫金矿业11月19日公告，公司拟以自有资金和/或自筹资金(含金融机构回购专项贷款等)回购A股股份，回购金额不低于20亿元且不超过30亿元，回购价格不超过35元/股，回购期限为董事会审议通过后12个月内。回购股份将用于员工持股计划或股权激励，若公司未能在股份回购实施结果暨股份变动公告后3年内使用完毕已回购股份，尚未使用的已回购股份将予以注销。\n\n宁德时代回购约2亿元A股股份\n\n宁德时代11月19日公告，公司于2026年11月19日通过深圳证券交易所回购A股股份850,473股，回购价格区间为每股233.39元-237元，回购总金额为1.9998亿元，所回购股份拟用于注销。\n\n赣锋锂业拟不超过4亿元回购公司股份\n\n赣锋锂业11月19日公告，拟使用自有资金和/或自筹资金以集中竞价方式回购公司部分人民币普通股A股股份。回购总金额不低于2亿元且不超过4亿元。本次回购股份价格上限为57.47元/股，不高于公司董事会审议通过回购股份方案前30个交易日公司股票交易均价的150%。回购股份将用于维护公司价值及股东权益。回购期限为自董事会审议通过回购股份方案之日起3个月内。\n\n内蒙古电力集团原董事长张海峰被“双开”\n\n中央纪委国家监委网站11月19日通报，据内蒙古自治区纪委监委消息：经内蒙古自治区党委批准，内蒙古自治区纪委监委对内蒙古电力（集团）有限责任公司原党委书记、董事长张海峰严重违纪违法问题进行了立案审查调查。\n\n经查，张海峰丧失理想信念，背弃初心使命，搞迷信活动；无视中央八项规定精神，违规收受礼品、礼金、消费卡，接受可能影响公正执行公务的宴请，将应当由本人支付的费用由他人支付；违反组织原则，不按规定报告个人有关事项，在组织函询时不如实说明问题，在干部工作调动中违规为他人谋取利益并收受财物；廉洁底线失守，利用职务便利为他人谋取利益并收受财物；违反工作纪律，干预和插手市场经济活动；公权私用，利用职务上的便利为他人在承揽工程、结算工程款等方面谋取利益，并非法收受巨额财物。\n\n张海峰严重违反党的政治纪律、组织纪律、廉洁纪律、工作纪律，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，特别是党的二十大后仍不知止，情节严重，影响恶劣，应予严肃处理。依据有关规定，经内蒙古自治区纪委常委会会议研究并报内蒙古自治区党委批准，决定给予张海峰开除党籍处分；由内蒙古自治区监委给予其开除公职处分；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。 \n\n江苏日托光伏主动申请破产重整\n\n近日，全国企业破产重整案件信息网显示，江苏日托光伏科技股份有限公司已向无锡市中级人民法院提交破产重整申请。目前案件处于破产申请审查阶段，法院尚未裁定正式受理重整。天眼查显示，日托光伏成立于2012年，是无锡产业发展集团旗下国有控股企业。该公司布局MWT背接触技术路线，主要从事光伏电池及组件研发、制造，产品涉及轻质组件及分布式光伏应用场景。据公司公开资料，日托光伏建有无锡、徐州、南京三大生产基地，拥有电池及组件垂直产业链产能。\n\n英力特控股股东拟向宝丰集团转让39.41%股份\n\n英力特11月19日公告，公司于近日收到控股股东国能英力特能源化工集团股份有限公司通知，英力特集团已确定宁夏宝丰集团有限公司为其拟协议转让公司股份的最终受让方。英力特集团拟向宝丰集团一次性整体协议转让其持有的公司155,322,687股无限售流通股份，占公司总股本的39.41%。本次股份转让交易目前正在推进《股份转让协议》的协商谈判工作。\n\n西子洁能终止筹划发行H股并在港交所上市事项\n\n西子洁能11月19日公告称，公司决定终止筹划发行H股股票并在香港联合交易所有限公司上市的相关筹备工作。鉴于当前宏观经济环境、公司自身实际情况及资本市场环境变化等多重因素，经审慎讨论分析后作出上述决策。本次终止无需提交董事会和股东会审议，不会对公司经营活动和持续发展造成重大影响。\n\n保能源安全，欧盟推迟“限甲烷排放”法规生效\n\n据新华社报道，欧盟多方代表11月19日达成协议，同意将旨在控制甲烷排放的“欧盟甲烷法规”生效日期从2027年推迟至2029年，以在“全球动荡”中保障可靠、安全的能源供应。\n\n未经正式授权严禁转载本文，侵权必究。矿产\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权
