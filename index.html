旅等新业态新需求，破解跨境司法堵点难点。\n\n　　段农根倡议，中越边境法院完善合作机制，深化数字司法合作，探索在线调解、远程取证、电子送达等跨境司法服务新模式，让更多中越民众了解边境省份法院合作的实际成效。\n\n　　广西壮族自治区高级人民法院院长黄海龙表示，当前，中国—东盟自由贸易区3.0版即将生效实施，中越经贸合作和人员往来日益密切。作为中国边境省份，广西愿与越方加强司法交流合作，共同维护边境地区安宁稳定，促进经贸合作，增进民众福祉。\n\n　　越南谅山省人民法院院长丁玉勋对中方倡议表示认同。他认为，越中边境法院可以建立“年度轮值司法研讨会”机制，开展法官专题交流，确保法院裁判客观、公正，并得到有效执行。\n\n　　近年来，在中国最高人民法院指导下，广西法院相继与越南谅山、广宁等法院签署相关合作备忘录，在法官培训、案例研究、司法协助等方面开展合作。本次会晤活动的举办，标志着中越司法交流合作逐步迈向更深层次、更广领域。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c93c0385252","title":"（深圳APEC）深圳APEC：一场中国式现代化的“现场说明会”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734636.shtml","summary":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉  　　世界的目光正聚焦深圳“APEC时间”。","summary_short":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉  　　世界的目光…","digest":"题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉…","points":["作为亚太经合组织(APEC)“中国年”的三大优先领域，“开放、创新…","“看五十年的中国就来深圳”，中国国家主席习近平在APEC领导人非正式会议欢迎晚宴上这样介绍深…","APEC“中国年”启动以来，16座城市举办300多场会议和活动，各经济体代表累计参与逾万人次"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:36:08+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”\n\n　　中新社记者 王宗汉\n\n　　世界的目光正聚焦深圳“APEC时间”。\n\n　　作为亚太经合组织(APEC)“中国年”的三大优先领域，“开放、创新、合作”成为在深圳举行的领导人会议周的关键词。\n\n　　三个关键词，既回应亚太共同发展的现实课题，也与中国式现代化的发展追求高度契合——开放是鲜明标识，创新是第一动力，合作共赢是必然要求。\n\n　　“看五十年的中国就来深圳”，中国国家主席习近平在APEC领导人非正式会议欢迎晚宴上这样介绍深圳。深圳的发展实践，正是中国式现代化的生动缩影。深圳APEC会议，为世界读懂中国式现代化开了一场生动的“现场说明会”。\n\n11月15日，市民拍摄深圳华强北的APEC标识。中新社记者 张祥毅 摄\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“开放”。\n\n　　APEC“中国年”启动以来，16座城市举办300多场会议和活动，各经济体代表累计参与逾万人次。进入深圳会议周，全部21个APEC成员经济体的领导人、代表相聚于此，APEC工商领导人峰会吸引来自亚太及域外经济体的2000余位政商界代表参加。\n\n　　国际盛会，折射深圳与亚太的深度联系，也展现中国拥抱世界的开放姿态。\n\n　　近年来，从全面取消制造业领域外资准入限制，到扩大电信、医疗等服务业开放试点，再到海南自贸港全岛封关运作，中国以一系列务实举措持续扩大开放。APEC各经济体代表走进深圳前海合作区，感受中国开放的成果；工商界围绕区域贸易、数字经济等议题深入交流，让合作更进一步。\n\n　　从深圳深度融入全球市场，到APEC汇聚亚太各方，世界观察到，中国式现代化始终坚持敞开大门，与伙伴共拓发展空间。\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“创新”。\n\n　　加拿大总理卡尼这样评价深圳：“未来在这里设计，在这里测试，也在这里制造。”美国经济学家杰弗里·萨克斯则称深圳是中国创新的“标杆”。\n\n　　“APEC科技落地签”“AI上APEC”……诸多热点在这场盛会上出圈，让深圳的创新活力更加鲜活可感，也彰显了中国以科技创新推动现代化的蓬勃动能。\n\n　　近年来，从加大基础研究投入、支持前沿探索，到实施“人工智能+”行动、推动成果转化，中国以务实举措持续激发创新活力。2025年，中国研发经费投入稳居世界第二，全球创新指数排名首次跻身前十。\n\n　　从深圳科技产业蓬勃发展，到APEC共商亚太增长新动能，世界看到的不只是中国科技创新成果，更是中国式现代化坚持创新驱动、推动科技与产业深度融合的生动实践。\n\n11月18日，《2026年亚太经合组织工商领导人峰会深圳倡议》在深圳对外发布。　中新社记者 赵文宇 摄\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“合作”。\n\n　　深圳的发展离不开亚太市场，亚太的繁荣也离不开各经济体的密切协作。这座城市正是中国与亚太相互依存、彼此成就的缩影。\n\n　　作为东道主，中方与各方一道，聚焦深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣等达成诸多共识，也展现了中国与世界相互成就的广阔前景。\n\n　　近年来，从高质量共建“一带一路”，到深化区域产业链供应链协作，中国不断拓展互利共赢空间。中国已成为13个APEC经济体的最大贸易伙伴，2025年与APEC其他经济体进出口总额超过26万亿元人民币。\n\n　　从凝聚合作共识，到共绘繁荣蓝图，深圳的“APEC时间”，既是世界观察中国的窗口，也是中国与世界携手前行的生动见证。\n\n　　这次盛会再次证明，中国式现代化，不是独善其身的现代化，而是在开放中拥抱世界、在创新中共享机遇、在合作中彼此成就。中国与世界的故事，从不是单向的奔赴，而是相向而行、共同书写的未来。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c97454dc58d","title":"东西问丨中国AI赋能中小企业，对亚太其他经济体有何借鉴意义？","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734642.shtml","summary":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。","summary_short":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。","digest":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新…","points":["中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量","日前，在广州举行的第32次APEC中小企业部长会议…","9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:31:42+08:00","size":1,"keywords":[],"body":"中新社记者 许青青\n\n　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。日前，在广州举行的第32次APEC中小企业部长会议，正式倡议在广州设立“亚太人工智能赋能中小企业发展合作中心”、在深圳建设“亚太中小企业合作区”，标志着中国AI赋能中小企业发展，从国内实践走向区域协作。\n\n　　中国中小企业使用AI进展如何？中国在AI赋能中小企业方面有哪些经验可供借鉴？中山大学国家发展研究院副院长、中山大学岭南学院教授李兵近日接受中新社“东西问”专访，对此作出解读。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能体验中心观看机器人弹奏钢琴。　中新社记者 　陈楚红 摄\n\n　　中新社记者：AI对于一家中小企业本质上意味着什么？它将带来哪些改变？\n\n　　李兵：人工智能(AI)被认为是继蒸汽、电力、信息技术之后的又一次技术革命。经济学里把这一类技术叫作“通用目的技术”，它能渗透到经济生活的每一个角落，而且会越用越好。人工智能，就是最新一次这样的革命。\n\n　　AI对中小企业而言，既是挑战，更是机遇。\n\n　　过去，顶尖人才往往聚集在大企业，中小企业很难聘用到。而AI集成了大量人类智慧，且模型每次迭代都会吸收新的经验。所以某种程度上讲，中小企业现在借助AI，就相当于随时随地用到了这些顶尖智慧。这一点对中小企业最重要，“顶尖能力”变得便宜了。\n\n　　AI时代正滚滚而来，中小企业会加速分化：用好了，成长很快；没抓住、忽视了，就会被时代抛弃。\n\n　　中新社记者：中国中小企业运用AI提高生产效率，相对亚太区域其他经济体中小企业有哪些优势？\n\n　　李兵：根据中国信通院对中国6000多家中小企业的调查，已经有50%以上的企业用上了人工智能，还有约1/4计划在两年内使用。但结合我们自己调研的实际情况看，企业员工已在日常工作里使用，老板对此不一定知情。也就是说，中国至少有50%的中小企业正在使用AI。但真正把AI深度嵌入到业务流程里的，只有4%左右：企业清楚哪个流程该用什么AI，特定流程从头到尾都有AI参与，整体效率得到提升，但不等于全公司所有业务都已完全打通。\n\n　　要让AI真正发挥效用来、带动企业提效增长，还是要真正实现全公司端到端的全流程打通。此外，底层技术变了，组织机构必然跟着调整，目前来看还为时尚早，最终形式还需要企业在实践中探索。\n\n　　中国中小企业在利用AI方面，我认为主要有三方面优势：中国AI供给充足，很多国内大模型比美国同类产品便宜，而且好用；AI建立在移动互联网之上，中国有高速网络与稳定电力，基础设施优势明显；中国有完整产业体系与丰富应用场景，尤其粤港澳大湾区中小企业密集、创业热情高，只要找到一个场景把AI用起来，往往就能赚到钱。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾体验互动游戏。　中新社记者 　陈楚红 　摄\n\n　　中新社记者：广州花都通过AI产业园引入头部企业搭建公共AI服务平台，批量服务纺织、鞋服等传统中小企业，这种共享数字化服务模式的核心逻辑是什么？\n\n　　李兵：广州市花都区政府牵头，联合华为、中国信通院等共建的城市级工业人工智能中心“广州市花都区新型工业化数字服务平台”，集成了50P公共算力，提供工业互联网SaaS应用、AI工具及全链条数字化转型服务，带动声光电、化妆品、皮革皮具等重点产业产值同比增长，这一共享数字化服务模式已向多地推广。\n\n　　在花都项目里，华为主要为园区提供算力和大模型支撑，还整理、打包了各类成熟的应用场景案例；专门安排人员开展使用相关技术和工具的培训。此外，当地的客户资源与产业集群优势，也让产业园模式释放出更多红利。\n\n　　这种“政府搭台、大企业输出技术、中小企业共享服务”的共享数字化模式，把中小企业单独买不起、用不好的AI能力，变成一种公共品，按需取用、门槛极低，正是广东探索出来的典型路径。\n\n　　中新社记者：中国AI赋能中小企业的经验有哪些可以复制？对亚太区域发展中经济体有何借鉴意义？\n\n　　李兵：我的基本判断是：技术可以复制，但认知、能力与环境的鸿沟不会自动消弭。很多发展中国家不是没有技术，而是“不知道技术存在、不知道如何运用”，认知鸿沟比技术鸿沟更难消弭，这正是务实合作必须发力的方向。\n\n　　可以直接复制的有：\n\n　　公共赋能中心的机制。政府搭台、共享服务的逻辑，几乎所有经济体都可以做，只是规模大小不同。花都模式最值得复制的地方，不是具体的平台，而是“把固定成本公共化”这个机制。\n\n　　算力券、创新券这类补贴工具。这是降低企业使用门槛最直接的政策工具，对于很多经济体值得参考。\n\n　　开源大模型的路径。中国的AI大模型总体走开源路线，开源天然就是普惠的，是帮助全球中小企业跨越技术门槛最有价值的路径。\n\n　　“小快轻准”的轻量化产品。引导企业的产品在小型化、快速化、轻量化、精准化等维度持续深耕，把AI拆成中小企业用得起的模块，这种产品化思路可复制性很强。\n\n　　能力建设和培训机制。这是投入小、见效长的“基础工程”，也是消弭认知鸿沟最直接的手段。\n\n　　对亚太发展中经济体，我建议复制中国的“机制”而不是复制“模板”。把共享、普惠、借力的机制带回去，结合本地产业基础和制度条件重新设计。技术转移从来不是单向输出，而是供给方与应用方的双向奔赴。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能体验中心佩戴脑机接口设备控制汽车模型行驶。　中新社记者 　陈楚红 　摄\n\n　　中新社记者：对于正在犹豫要不要上AI的亚太中小企业主，您有何具体建议？\n\n　　李兵：我的建议主要有三条：\n\n　　第一，老板带头，全员用起来。老板自己不用AI、没有体感，员工下面在做什么你根本不知道，又怎么指挥？所以第一件事是自己上手。同时，给员工账号、给额度，鼓励大家用起来。\n\n　　第二，从小场景切入，借外力降低门槛。高频、重复、输入任务和输出成果都特别明确的流程，最适合先用AI，借助产业园、政府算力券先跑起来，把这部分效率提上来，再考虑其他环节。\n\n　　第三，用场景换技术，找高校合作。草根中小企业摸爬滚打在第一线，最清楚要做什么、怎么落地。高校懂技术却不了解高密度、真需求，两者结合起来，就能找到好的应用场景。\n\n　　对于还在观望的中小企业，我想说：中小企业不应该是AI的旁观者，而应该是AI赋能的主战场、生力军；谁先用会AI，谁就有机会拿下未来的市场。(完)\n\n　　受访者简介\n\n李兵。受访者供图\n\n　　李兵，中山大学岭南学院教授，博士生导师，中山大学国家发展研究院副院长，中山大学经济管理国家级实验教学示范中心副主任。主要研究方向是国际贸易、国际政治经济学、城市经济学等。教育部全国万名优秀创新创业导师人才库首批入库导师，首批国家知识产权局专利分析和预警专家库专家，中国技术经济学会知识产权分委会理事，中国国际经济关系学会理事，粤港澳高校质量联盟学术委员会委员，中国国土经济学会区域战略青年学者菁英会会员，广东省经济学会副秘书长。\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7ca1d27bb7","title":"成都首发中亚JSQ捷达班列","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-19/10734621.shtml","summary":"中新社成都11月19日电 (记者 张浪 岳依桐)中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式19日在四川成都举行。","summary_short":"中新社成都11月19日电 (记者 张浪 岳依桐)中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式19日在四川成都举行…","digest":"中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式19日在四川成都举行","points":["中新社成都11月19日电 (记者 张浪 岳依桐)中亚(中国·成都—哈萨克斯坦)JSQ捷达班列…","一批由一汽大众汽车有限公司成都分公司生产的捷达品牌整车完成装载后正式发运，驶向中亚市场","这是“成都造”汽车首次通过铁路JSQ车方式在成都发运…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:48:48+08:00","size":1,"keywords":[],"body":"中新社成都11月19日电 (记者 张浪 岳依桐)中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式19日在四川成都举行。\n\n　　一批由一汽大众汽车有限公司成都分公司生产的捷达品牌整车完成装载后正式发运，驶向中亚市场。这是“成都造”汽车首次通过铁路JSQ车方式在成都发运，标志着成都汽车产业国际化物流服务体系再添新模式。\n\n11月19日，中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式在四川成都举行。 中新社记者 张浪 摄\n\n　　据介绍，铁路JSQ车是中铁特货公司服务整车运输的重要专业化装备。采用该方式组织汽车出口，可实现车辆集运、报关、发运等环节高效衔接，较传统集装箱运输运量提升约75%、运费降低约10%，能够有效提升整车装载效率和运输组织质效，为汽车企业降低综合物流成本、稳定国际交付周期提供有力支撑。\n\n　　据了解，此次班列开行，将制造基地、口岸平台和国际市场更加紧密地连接起来，为成都汽车企业拓展中亚市场提供了更加稳定、高效、经济的国际物流选择，也为中亚跨境整车运输探索形成可复制、可推广经验。\n\n　　下一步，成都将完善整车集运、口岸报关、国际联运等一体化服务，争取更多JSQ国际运力，推动成都至中亚整车出口运输常态化、规模化发展。(完)\n\n 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"台灣","total":2,"items":[{"id":"c7d240a421a","title":"在深台胞：今年APEC落地深圳，期待世界看见新时代的深圳","url":"https://www.chinanews.com/tw/shipin/2026/11-19/news1075493.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇在接受中国新闻网“燕新台”…","他坦言，借着这场国际盛会，非常期待让全世界真正看见新时代的深圳…"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:07:57+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇在接受中国新闻网“燕新台”工作室采访时表示，他观察到不少海外媒体和国际博主前来深圳实地探访，都给出了真实且高度的正面评价。他坦言，借着这场国际盛会，非常期待让全世界真正看见新时代的深圳，也特别希望各国嘉宾在亲身体验这座城市的包容理念、发展速度与城市温度之后，能发自内心地说出那句——来了就是深圳人。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/12aefe9c-f627-4dad-a8a3-962a80a72c3d.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c47fcc72e11","title":"深圳创业十余年台胞：这座城市永远在蜕变，台湾青年一定会“爱上深圳”","url":"https://www.chinanews.com/tw/shipin/2026/11-19/news1075492.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳，这座“创新之城”再度吸引全球目光","“深圳最大的特质，就是永远不会停在过去的成绩里"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:07:48+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳，这座“创新之城”再度吸引全球目光。“深圳最大的特质，就是永远不会停在过去的成绩里。”深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇，近日在接受中国新闻网“燕新台”工作室采访时，分享了他眼中的深圳。他认为，深圳真正留住台湾青年的并非单纯的政策福利，而是这座城市不断迭代的产业和无可替代的机会含金量。他向岛内青年发出真诚邀约：亲自来体验这里的科技实力、商业活力、艺术氛围和饮食文化，一定会找到属于自己“爱上深圳”的理由。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/12af1128-76da-480c-99cc-b72180b8e65d.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"國際","total":19,"items":[{"id":"cdf416c6a3c","title":"巴基斯坦在反恐行动中打死22名恐怖分子","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734843.shtml","summary":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说，巴安全部队日前在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。","summary_short":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","digest":"伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","points":["中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说…","综合巴基斯坦《黎明报》等媒体消息，声明称，巴安全部队于本月16日至17日开展上述反恐行动","其中在南瓦济里斯坦地区的行动中，安全部队在交火中共打死15名恐怖分子"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T19:15:44+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 伊斯兰堡消息：当地时间11月19日，巴基斯坦三军新闻局发表声明说，巴安全部队日前在该国西北部开伯尔－普什图省开展多次反恐行动，共打死22名恐怖分子。\n\n　　综合巴基斯坦《黎明报》等媒体消息，声明称，巴安全部队于本月16日至17日开展上述反恐行动。其中在南瓦济里斯坦地区的行动中，安全部队在交火中共打死15名恐怖分子；在本努地区和丹格地区的行动中，安全部队打死7名恐怖分子，并在行动中缴获大量武器弹药。\n\n　　巴基斯坦三军新闻局称，这些被击毙的恐怖分子“参与了该地区多起恐怖活动”，目前清剿行动仍在继续，搜剿该地区潜藏的其他恐怖分子。同时，反恐行动将持续全力推进，旨在彻底根除恐怖主义这一祸患。\n\n　　巴基斯坦总统扎尔达里承诺，将持续开展反恐行动，直至将恐怖主义从巴基斯坦全部清除。\r\n\n　　近年来，“巴基斯坦塔利班”等恐怖组织在巴境内针对军民目标策划多起恐怖袭击，造成重大人员伤亡。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf8828a56a5","title":"韩国2026年累计出口额突破1万亿美元大关","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734799.shtml","summary":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示，韩国2026年累计出口额初步统计已超过1万亿美元(约合人民币6.7万亿元)，成为继美国、德国和中国之后…","summary_short":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示…","digest":"韩国产业通商资源部19日表示…","points":["中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示…","韩国产业通商资源部表示，自2024年以来，人工智能(AI)应用相关产品的全球贸易额增速一直高…","受AI投资热潮带动，2026年1月至10月，韩国半导体出口额同比大增193.1%…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T18:35:36+08:00","size":1,"keywords":[],"body":"中新社首尔11月19日电(记者 金旭)韩国产业通商资源部19日表示，韩国2026年累计出口额初步统计已超过1万亿美元(约合人民币6.7万亿元)，成为继美国、德国和中国之后，全球第四个实现年度出口额突破1万亿美元的国家。\r\n\n　　半导体成为主要推动力。韩国产业通商资源部表示，自2024年以来，人工智能(AI)应用相关产品的全球贸易额增速一直高于全球商品贸易整体增速。受AI投资热潮带动，2026年1月至10月，韩国半导体出口额同比大增193.1%，达到3968亿美元，占整体出口额的42.7%。\n\n　　此外，韩国其他主力产业也展现出较强竞争力。截至10月，除半导体以外的出口额同比增长20.2%，增速创近20年来新高。韩国化妆品、生物产业等具有发展潜力的消费品也为出口增长提供了支撑。\n\n　　韩国产业通商资源部长官金正官当天表示，韩国政府将集中一切力量，在发掘新的增长动力的同时，推动出口成果惠及地方经济发展，带动青年就业。\n\n　　据韩联社报道，相关专家分析称，受基数效应等因素影响，2027年韩国出口增速可能有所放缓，但预计仍能保持1万亿美元规模。同时，还应警惕半导体产业过度集中导致的产业间发展失衡，以及汇率等宏观经济环境变化、半导体产业成果带动效应不足等问题。(完) 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c641af949bb","title":"夜蛾如何辨识方向？国际最新研究发现利用地磁和星光两种罗盘导航","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734729.shtml","summary":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称，布冈夜蛾(Bogong moths)利用一种地磁罗盘帮助它们进行季节性的迁徙…","summary_short":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称…","digest":"国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称…","points":["中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表…","夏季，高山洞穴中休眠的布冈夜蛾，洞穴岩壁上每平方米约有1.7万只蛾…","春季，数十亿夜蛾从澳大利亚东南部各地出发，前往此前从未去过的1000公里外的澳大利亚阿尔卑斯…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:39+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称，布冈夜蛾(Bogong moths)利用一种地磁罗盘帮助它们进行季节性的迁徙，连同此前研究证明这些蛾子还会利用星光导航，表明此类昆虫使用地磁和星光两种内在罗盘来寻找方向。\n\n夏季，高山洞穴中休眠的布冈夜蛾，洞穴岩壁上每平方米约有1.7万只蛾，每个洞穴内有数百万只(图片来自Eric　Warrant)。施普林格·自然 供图\n\n　　论文作者认为，布冈夜蛾的磁感应能力与一些夜间迁徙的鸣禽相似，其表明相距甚远的物种可能会独立演化出类似能力。\n\n　　据论文介绍，澳大利亚的布冈夜蛾在仅一年的生命周期中有两次大规模迁徙。春季，数十亿夜蛾从澳大利亚东南部各地出发，前往此前从未去过的1000公里外的澳大利亚阿尔卑斯山，随后在秋季返回。\n\n布冈夜蛾(图片来自澳大利亚麦考瑞大学Ajay　Narendra)。施普林格·自然 供图\n\n　　此前研究表明，这些夜蛾利用星空作为指南针导航前往目的地，但星空被云层遮蔽时它们仍能正确前进。基于此，有观点提出，这是因为夜蛾能够感知和利用地球磁场，但具体机制尚未得到证实。\n\n　　在本项研究中，瑞典隆德大学、德国奥尔登堡大学的研究团队合作，捕捉了迁徙中的夜蛾，将其转移至一个封闭环境，其中布置了随机的星空(缺乏方向性线索)和一个局部磁场(可调整改变磁北极位置)。\n\n布冈夜蛾休眠洞穴附近的高山景观(图片来自Eric　Warrant)。施普林格·自然 供图\n\n　　研究显示，在没有典型夜空的情况下，蛾子能仅靠磁场继续朝向正确方向迁徙；当磁场角度调整时，它们会改变飞行方向，但磁极性(磁场南北极的方向)改变时，它们不受影响；施加微弱射频噪声和去除蓝紫光(这些因素已知会扰乱其他磁感知动物的迁徙)，都会导致夜蛾无法确定方向。\n\n　　论文作者总结表示，本项研究结果指向夜蛾的内在磁罗盘采用了基于自由基对的机制，这与夜间迁徙鸣禽中观察到的机制相似。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c279d652d49","title":"菲律宾多地高温指数达危险级别 局地达44摄氏度","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734718.shtml","summary":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数，局地高温指数达到44摄氏度。","summary_short":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数…","digest":"菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数…","points":["中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示…","据该机构消息，马斯巴特市、东萨马省博龙岸市和三宝颜市当天高温指数均达到44摄氏度","巴拉望省公主港市和库约镇达到43摄氏度"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:05+08:00","size":1,"keywords":[],"body":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数，局地高温指数达到44摄氏度。\n\n　　据该机构消息，马斯巴特市、东萨马省博龙岸市和三宝颜市当天高温指数均达到44摄氏度。巴拉望省公主港市和库约镇达到43摄氏度。另有8个地区高温指数达到42摄氏度。\n\n　　受高温天气影响，菲律宾多地19日暂停线下教学或缩短课时，以降低高温对师生健康的影响。\n\n　　菲律宾大气地球物理天文局此前预报，19日，米马罗巴地区、米沙鄢群岛和棉兰老岛的5个监测地点高温指数预计达到42至51摄氏度，处于危险级别。\r\n\n　　高温指数是结合实际气温和相对湿度计算得出的人体体感温度。菲律宾气象部门将高温指数分为四个等级：警戒级(27至32摄氏度)、高度警戒级(33至41摄氏度)、危险级(42至51摄氏度)和极端危险级(52摄氏度及以上)。\n\n　　菲律宾气象部门警告，持续暴露于危险级别高温环境可能导致热痉挛和热衰竭，长时间暴露甚至可能引发中暑。该机构提醒公众及时补充水分，尽量避免在10时至16时外出，外出时做好防晒措施。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c26b45b62ec","title":"涉嫌参与海地总统遇刺案 美国牧师或面临终身监禁","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734676.shtml","summary":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel Sanon)因涉嫌刺杀海地总统若弗内尔·莫伊兹(Jovenel Moise)…","summary_short":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel San…","digest":"涉嫌参与海地总统遇刺案 美国牧师或面临终身监禁","points":["中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christia…","综合路透社、美国《迈阿密先驱报》等媒体报道，萨农现年68岁，拥有美国和海地双重国籍","萨农被裁定所有指控全部成立，其中包括共谋杀害海地总统莫伊兹"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:43:09+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel Sanon)因涉嫌刺杀海地总统若弗内尔·莫伊兹(Jovenel Moise)，被迈阿密法官裁定有罪，可能面临终身监禁。\n\n　　综合路透社、美国《迈阿密先驱报》等媒体报道，萨农现年68岁，拥有美国和海地双重国籍。萨农被裁定所有指控全部成立，其中包括共谋杀害海地总统莫伊兹。迈阿密一家联邦法院定于2027年2月10日对其宣判量刑，萨农最高可能被判处终身监禁。\n\n　　庭审期间，萨农始终坚称自己无罪。判决公布后，其律师表示对判决结果感到失望，并称将适时提起上诉。\n\n　　2021年7月7日，海地总统莫伊兹在太子港私邸遭暗杀身亡。事发数日后，萨农在太子港被捕。警方搜查其住所时，发现8块车牌、19本护照、12部手机、30箱弹药及12个手枪枪套。\r\n\n　　莫伊兹遇刺身亡后，海地持续动荡。受政治危机、帮派暴力等因素影响，该国选举多次推迟，长期未能产生民选总统。2024年4月，海地过渡总统委员会成立，在民选总统就职前的过渡期内暂行特定总统权力。\n\n　　目前，海地总统选举首轮投票暂定于2027年7月举行，莫伊兹的遗孀玛蒂娜·莫伊兹已登记为海地总统选举候选人。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1f12d0929e","title":"沙特王储与美军中央司令部司令会谈 沙特与也门胡塞武装持续相互打击","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734656.shtml","summary":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀率领的代表团。","summary_short":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀…","digest":"综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布…","points":["中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美…","沙特和也门胡塞武装当天持续互相打击","据沙特通讯社报道，穆罕默德与库珀在会谈期间回顾双边关系，尤其是军事领域合作…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:42:35+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀率领的代表团。沙特和也门胡塞武装当天持续互相打击。\n\n　　据沙特通讯社报道，穆罕默德与库珀在会谈期间回顾双边关系，尤其是军事领域合作，讨论地区局势发展，以及促进地区安全、稳定与和平的努力。\n\n　　报道称，沙特国家安全顾问艾班、沙特武装部队总参谋长兼沙特主导的多国联军代理指挥官鲁韦利参加会谈。\n\n　　另据以色列《耶路撒冷邮报》、卡塔尔半岛电视台报道，库珀率团赴沙特会谈前，在以色列特拉维夫与以高级军事和情报官员举行会谈。以色列国防军通报称，双方讨论的重点是为应对区域安全挑战，加强军事准备和协调行动。\r\n\n　　路透社报道称，知情人士表示，本轮沙特与也门胡塞武装的冲突升级以来，沙特曾于9月向美国总统特朗普寻求军事援助，以打击胡塞武装。特朗普不同意美方直接参与打击胡塞武装，但表示将提供情报共享等援助。\n\n　　沙特民防部门19日在几小时内连续发出5次紧急情况警报，要求民众遵循安全指示，避免前往人群聚集地点。当天晚些时候，警报解除。\n\n　　沙特阿拉伯主导的多国联军发言人马利基19日在社交媒体上发布多条信息称，联军当天先后拦截并摧毁胡塞武装射向沙特南部地区的6枚导弹，并应对一起其针对沙特首都利雅得的导弹威胁。导弹碎片坠落造成财产损失，损失程度仍在评估中。\n\n　　也门胡塞武装通报称，多国联军19日对也门首都萨那的纺织厂、皮革厂，以及西南部塔伊兹省的医疗机构等民用目标发动数轮空袭。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c36dee1b62a","title":"“游历于色彩与线条之间”特别企画展在东京中国文化中心举办","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734653.shtml","summary":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心举办。","summary_short":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化…","digest":"“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心…","points":["中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别…","本次展览由东京中国文化中心策展并主办","展览汇集姜淼、吴霜、鲍蓓等中国当代一流新锐艺术家的作品，以抽象绘画为切入点，围绕色彩…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:41:45+08:00","size":1,"keywords":[],"body":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心举办。\n\n　　本次展览由东京中国文化中心策展并主办。展览汇集姜淼、吴霜、鲍蓓等中国当代一流新锐艺术家的作品，以抽象绘画为切入点，围绕色彩、线条与材料展开，呈现艺术家对绘画形式和视觉语言的多样探索。展览展期至12月25日。\n\n展览现场。中新网记者 朱晨曦 摄\n\n　　据介绍，本次展出作品虽各具面貌，却共同关注色彩、线条与材料之间的关系。作品通过色彩的交织与对照、线条的穿插与延伸，以及材料肌理的叠加和变化，共同构成画面的视觉层次。同时，线条与色块既参与画面结构的组织，也形成不同的视觉节奏。此外，材料经过覆盖、叠加、刮刻等处理，留下丰富的表面痕迹，使作品呈现出各具特点的质感。\n\n　　主办方表示，抽象艺术为艺术家提供了不同于具象描绘的表达方式，也使色彩、线条和材料本身成为画面表达的重要组成部分。艺术家并不拘泥于对具体形象的描绘，而是通过形式与材料的组合，拓展画面的表达空间。\n\n展览现场。中新网记者 朱晨曦 摄\n\n　　作为功能及定位适配化改造的重要一环，东京中国文化中心希望通过本次展览，用小而美的表达方式向日本文艺界和艺术爱好者展现鲜活的中国当代抽象艺术面貌，吸引更多日本民众了解当代中国文化、感知当代中国发展。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce10a8e0351","title":"印度一学校62名学生疑因附近沥青厂污染出现恶心和呼吸困难症状","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734747.shtml","summary":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心、呼吸困难等症状并入院，相关症状据称与学校附近一处沥青搅拌厂造成的污染有关。","summary_short":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心…","digest":"据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心…","points":["中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生…","警方表示，目前所有学生情况稳定，暂无严重健康问题","警方还表示，该工厂此前因当地居民投诉污染问题曾被关闭，后在高等法院解除停业限制后重新运营…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T17:11:33+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心、呼吸困难等症状并入院，相关症状据称与学校附近一处沥青搅拌厂造成的污染有关。\n\n　　警方表示，目前所有学生情况稳定，暂无严重健康问题。\n\n　　警方还表示，该工厂此前因当地居民投诉污染问题曾被关闭，后在高等法院解除停业限制后重新运营，此次事件发生后再次被关闭。\n\n　　事件发生后，警方和当地有关部门已介入处理。\r\n\n 【编辑:孔庆玲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c298a9635bb","title":"强气旋风暴逼近 印度东部沿海逾4.6万人转移避险","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734736.shtml","summary":"中新网11月19日电 据《印度斯坦时报》19日报道，印度当地官员表示，强气旋风暴“阿克万”逼近印度东部沿海，预计将于20日在安得拉邦纳尔萨普尔至奥迪沙邦普里之间沿海地区登陆。","summary_short":"中新网11月19日电 据《印度斯坦时报》19日报道，印度当地官员表示，强气旋风暴“阿克万”逼近印度东部沿海…","digest":"据《印度斯坦时报》19日报道，印度当地官员表示，强气旋风暴“阿克万”逼近印度东部沿海…","points":["中新网11月19日电 据《印度斯坦时报》19日报道，印度当地官员表示…","奥迪沙邦已有超过4.6万人转移至安全地点","当地政府已对11个地区发布红色预警"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T16:56:51+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据《印度斯坦时报》19日报道，印度当地官员表示，强气旋风暴“阿克万”逼近印度东部沿海，预计将于20日在安得拉邦纳尔萨普尔至奥迪沙邦普里之间沿海地区登陆。奥迪沙邦已有超过4.6万人转移至安全地点。当地政府已对11个地区发布红色预警。\r\n\n　　当地官员还表示，目前，奥迪沙邦已有448处避难所投入使用，另有约3000处正准备启用。当地政府优先转移孕妇、老年人和儿童，并要求山区居民前往安全地点，以防发生山体滑坡。\n\n　　印度气象局局长姆鲁琼贾伊·莫哈帕特拉指出，奥迪沙邦南部、北部及沿海地区预计20日至21日将出现大到特大暴雨，局部地区可能出现极端强降雨。 【编辑:孔庆玲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c963fd1a491","title":"第一视角带看APEC！深圳不止速度与算法 快与慢之间 藏着中国智慧","url":"https://www.chinanews.com/gj/shipin/2026/11-19/news1075464.shtml","summary":"如果说深圳的快是速度，慢则是深度。","summary_short":"如果说深圳的快是速度，慢则是深度。","digest":"如果说深圳的快是速度，慢则是深度","points":["如果说深圳的快是速度，慢则是深度","在深圳图书馆北馆，看一本书的奇妙旅行，感受深圳这座“阅读之城”的科技魔法","在深圳美术馆，近距离领略岭南生物的多样性，感叹被呵护着的自然生态之美"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T15:58:58+08:00","size":1,"keywords":[],"body":"如果说深圳的快是速度，慢则是深度。\n\n在深圳图书馆北馆，看一本书的奇妙旅行，感受深圳这座“阅读之城”的科技魔法；在深圳美术馆，近距离领略岭南生物的多样性，感叹被呵护着的自然生态之美。\n\n深圳不只有速度与算法，这里的“快与慢”是这座APEC之城的A面与B面，也是“走得快”也要“走更远”的中式智慧。(唐雨弦 赵丽）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/a7026dd2-e9c1-4b31-a1ed-12cd11cf7792.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2cf14cc0eb","title":"乌克兰称袭击俄罗斯两座炼油厂","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734629.shtml","summary":"中新社北京11月19日电 基辅消息：乌克兰总参谋部18日表示，乌军于17日至18日袭击了俄罗斯西南部克拉斯诺达尔边疆区的两座炼油厂。","summary_short":"中新社北京11月19日电 基辅消息：乌克兰总参谋部18日表示，乌军于17日至18日袭击了俄罗斯西南部克拉斯诺达尔边疆区的…","digest":"基辅消息：乌克兰总参谋部18日表示…","points":["中新社北京11月19日电 基辅消息：乌克兰总参谋部18日表示…","综合《基辅独立报》、乌通社等媒体报道，乌克兰总参谋部称…","乌克兰总参谋部说，两座炼油厂的年石油加工能力合计约为1300万吨"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:28:00+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 基辅消息：乌克兰总参谋部18日表示，乌军于17日至18日袭击了俄罗斯西南部克拉斯诺达尔边疆区的两座炼油厂。\n\n　　综合《基辅独立报》、乌通社等媒体报道，乌克兰总参谋部称，袭击击中了伊利斯基炼油厂的储油罐及阿菲普斯基炼油厂的石油加工装置，但未说明袭击方式。\n\n　　乌克兰总参谋部说，两座炼油厂的年石油加工能力合计约为1300万吨。\n\n　　另据俄罗斯《生意人报》18日报道，克拉斯诺达尔边疆区应急指挥部当天表示，该边疆区遭无人机袭击，造成9人受伤。\r\n\n　　伊利斯基炼油厂和阿菲普斯基炼油厂均位于俄罗斯克拉斯诺达尔边疆区，此前曾多次遭乌克兰无人机袭击。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca8005c0e3f","title":"韩国高考开考 多项措施严防考试作弊","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734614.shtml","summary":"中新网首尔11月19日电(记者 金旭)韩国第2027学年度大学修学能力考试(以下简称“韩国高考”)当地时间19日开考，55万多名考生在全国1312个考场参加考试。","summary_short":"中新网首尔11月19日电(记者 金旭)韩国第2027学年度大学修学能力考试(以下简称“韩国高考”)当地时间19日开考…","digest":"韩国第2027学年度大学修学能力考试(以下简称“韩国高考”)当地时间19日开考…","points":["中新网首尔11月19日电(记者 金旭)韩国第2027学年度大学修学能力考试(以下简称“韩国高…","此前，韩国政府出台一系列防作弊追加措施，在现有约7.5万名监考人员的基础上…","其中部分人员专门负责检查AI眼镜等智能设备"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:27:10+08:00","size":1,"keywords":[],"body":"中新网首尔11月19日电(记者 金旭)韩国第2027学年度大学修学能力考试(以下简称“韩国高考”)当地时间19日开考，55万多名考生在全国1312个考场参加考试。\n\n　　此前，韩国政府出台一系列防作弊追加措施，在现有约7.5万名监考人员的基础上，增派约8400人维护考场秩序。其中部分人员专门负责检查AI眼镜等智能设备。考生不得携带任何智能设备进入考场，所有考生衣服纽扣必须用贴纸密封，以防藏有摄像头。考场内及附近区域的无线网络也被关闭。\n\n　　据韩联社报道，韩国政府在考试前发送无法拒收的紧急灾难警报短信，以排查未按规定上交手机的学生。8时30分发送紧急灾难警报短信后，已查获22部未上交的智能手机，尚未发现考生使用其他高科技设备作弊的情况。截至记者发稿时，14时21分、14时57分分别发送第二轮、第三轮紧急灾难警报短信。\n\n　　今年韩国高考于8时40分至17时45分进行，按照韩国国语、数学、英语等五个科目依次进行。所有考生须在8时10分之前进入考场，今年参考人数共有55.1864万人，同比减少0.4%。(完)\r\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c60461cc30d","title":"澳大利亚10月失业率升至4.9%","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734599.shtml","summary":"中新社悉尼11月19日电(记者 薄雯雯)澳大利亚统计局19日公布的数据显示，经季节性因素调整，该国10月失业率从9月的4.7%升至4.9%，为2021年10月以来最高水平。","summary_short":"中新社悉尼11月19日电(记者 薄雯雯)澳大利亚统计局19日公布的数据显示，经季节性因素调整…","digest":"澳大利亚统计局19日公布的数据显示，经季节性因素调整…","points":["中新社悉尼11月19日电(记者 薄雯雯)澳大利亚统计局19日公布的数据显示…","数据显示，澳大利亚10月就业人数环比减少约4.35万人","其中，全职就业人数减少约2900人，兼职就业人数减少约4.06万人…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:19:43+08:00","size":1,"keywords":[],"body":"中新社悉尼11月19日电(记者 薄雯雯)澳大利亚统计局19日公布的数据显示，经季节性因素调整，该国10月失业率从9月的4.7%升至4.9%，为2021年10月以来最高水平。\n\n　　数据显示，澳大利亚10月就业人数环比减少约4.35万人。其中，全职就业人数减少约2900人，兼职就业人数减少约4.06万人，兼职岗位减少是当月就业人数下降的主要原因。同期，失业人数增加约1.78万人，劳动参与率环比下降0.2个百分点至66.6%。\n\n　　澳大利亚统计局劳工统计部门负责人肖恩·克里克表示，10月澳15岁至24岁人口的失业率从9月的11.1%升至11.3%，达到2021年10月以来最高水平。\n\n　　澳大利亚国库部长查默斯当天表示，数据反映出澳民众当前面临的“切实而严峻的压力”。在利率上升及全球性挑战持续的背景下，失业率走高并不意外，但仍令人担忧。政府将继续帮助民众应对生活成本压力、支持就业并抑制通胀。\r\n\n　　澳大利亚广播公司(ABC)报道称，澳大利亚储备银行(央行)此前预测失业率将在未来两年继续上升，到2028年底达到5.1%。10月数据表明，失业率上升速度快于央行预期。\n\n　　澳央行本月初进行了今年第五次加息。ABC援引分析人士观点称，最新数据降低了央行12月再次加息的可能性，但通胀和工资增长压力仍在，央行或将维持利率不变，继续观察经济数据。(完) 【编辑:惠小东】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3d5c9ffc34","title":"洪都拉斯发生袭击事件造成至少12人死亡","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734574.shtml","summary":"中新社北京11月19日电 特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Edgardo Barahona)18日表示，该国中北部约罗省约里托市当天凌晨发生4起袭击事件…","summary_short":"中新社北京11月19日电 特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Edgardo Barahona…","digest":"特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Edgardo Bar…","points":["中新社北京11月19日电 特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Ed…","综合《洪都拉斯日报》等媒体报道，3起袭击事件发生在巴列西略斯的一处足球场和两处民宅…","另一起袭击发生在帕卡亚雷斯社区，造成3人死亡，其中包括一名市议员"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:19:09+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Edgardo Barahona)18日表示，该国中北部约罗省约里托市当天凌晨发生4起袭击事件，共造成至少12人死亡，其中包括一名地方市议员。\r\n\n　　综合《洪都拉斯日报》等媒体报道，3起袭击事件发生在巴列西略斯的一处足球场和两处民宅，每起袭击均造成3人死亡。另一起袭击发生在帕卡亚雷斯社区，造成3人死亡，其中包括一名市议员。\n\n　　巴拉奥纳说，警方初步调查认为，上述袭击是犯罪团伙实施的报复行动。\n\n　　目前，洪都拉斯刑事调查局正与检察机关协调，对4处案发现场进行勘查和取证。\n\n　　洪都拉斯政府已召开紧急会议，协调相关部门采取应对措施，并决定加强受影响地区的警力和军事部署。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c810e8a3975","title":"马斯克盛赞深圳：“我是中国的粉丝，总是鼓励人们来中国走走看看”","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734638.shtml","summary":"中新网11月19日电 综合报道，2026年APEC会议期间，美国企业家马斯克随美方团队到访中国深圳。","summary_short":"中新网11月19日电 综合报道，2026年APEC会议期间，美国企业家马斯克随美方团队到访中国深圳。","digest":"综合报道，2026年APEC会议期间，美国企业家马斯克随美方团队到访中国深圳","points":["中新网11月19日电 综合报道，2026年APEC会议期间…","马斯克远程连线参加了在美国得克萨斯州奥斯汀举行的一场会议活动(TomorrowX Summi…","说实话，中国真是一个令人印象深刻的国家"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:14:33+08:00","size":1,"keywords":[],"body":"中新网11月19日电 综合报道，2026年APEC会议期间，美国企业家马斯克随美方团队到访中国深圳。马斯克远程连线参加了在美国得克萨斯州奥斯汀举行的一场会议活动(TomorrowX Summit)，并谈到了自己的访华经历。马斯克表示，“我是中国的粉丝，我总是鼓励人们来中国走走，亲眼看看。”\n\n图片来源：TomorrowX Summit社交媒体截图\n\n　　马斯克通过视频连线告诉与会者，他现在正在中国深圳。他表示，“每次来中国，我都觉得太震撼了。说实话，中国真是一个令人印象深刻的国家。我现在在深圳，这是一座非常巨大的城市，有很多很酷的建筑，我觉得这里是中国最大的科技中心。”\n\n　　“每次来到这里，我都会被中国的规模和宏伟壮丽所震撼。我是中国的粉丝，我总是鼓励人们来中国走走，亲眼看看。这是一个令人印象深刻的国家。”马斯克说。\n\n　　马斯克提到，他来华的原因之一，还包括想参观特斯拉上海工厂，并感谢团队多年来所付出的努力。\n\n　　马斯克最后说道，美国总统特朗普也正在中国访问，讨论贸易关系。马斯克说，他希望双方能取得进展，并指出，推动经贸关系向好发展，对全世界都是有益的。\n\n　　据此前报道，11月18日，特朗普车队抵达深圳东海朗廷酒店，马斯克现身随行大巴车。\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf19e0c453b","title":"委内瑞拉同美国签署协议恢复军事技术合作","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734563.shtml","summary":"中新社北京11月19日电 加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国国防部长赫格塞思签署协议，以恢复两国军事技术合作。","summary_short":"中新社北京11月19日电 加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国国防部长赫格塞思签署协议…","digest":"加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国国防部长赫格塞思签…","points":["中新社北京11月19日电 加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国…","委内瑞拉国防部18日发表声明称，委美两国决定，在相互尊重、互惠等基础上…","根据声明，此次合作旨在恢复同训练、技术交流、技术升级等相关的举措…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T12:48:07+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国国防部长赫格塞思签署协议，以恢复两国军事技术合作。\n\n　　委内瑞拉国防部18日发表声明称，委美两国决定，在相互尊重、互惠等基础上，推动军事技术合作恢复到之前水平。\n\n　　根据声明，此次合作旨在恢复同训练、技术交流、技术升级等相关的举措，并为“应对共同威胁”作出贡献。声明指出，合作将严格遵守委内瑞拉宪法及该国现行法律体系，充分尊重委内瑞拉主权、独立与领土完整。\n\n　　据路透社消息，赫格塞思称，该协议涵盖联合训练、情报共享以及美委军事合作的其他方面。他还表示，双方合作预示着将大幅加强针对贩毒团伙的联合行动。\r\n\n　　美联社称，赫格塞思未对协议内容作更多说明。\n\n　　据委内瑞拉《最新消息报》报道，委内瑞拉代总统德尔西·罗德里格斯18日在位于该国首都加拉加斯的总统府会见赫格塞思，并在会晤结束后强调恢复两国军事技术合作的重要性。罗德里格斯认为，双边合作应当确保委内瑞拉与西半球和平。\n\n　　由于美国持续干涉委内瑞拉内政，委内瑞拉于2019年与美国断绝外交关系。今年1月3日，美军对委内瑞拉发动大规模军事打击，强行控制委总统马杜罗及其妻子并将他们带到美国。3月，委美两国政府同意恢复外交和领事关系。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c541e5a81ef","title":"黃仁勳辭職｜輝達董事會稱必須尋求新領導人接替 公司提前加薪冀重振士氣","url":"https://news.tvb.com/tc/1207217-黃仁勳辭職輝達董事會稱必須尋求新領導人接替公司提前加薪冀重振士氣","summary":"美國晶片龍頭輝達Nvidia代理行政總裁克雷斯指，公司不再向中國出貨H200晶片。董事會指，必須尋求新領導人，接替因婚外情風波辭職的黃仁勳。","summary_short":"美國晶片龍頭輝達Nvidia代理行政總裁克雷斯指，公司不再向中國出貨H200晶片。","digest":"美國晶片龍頭輝達Nvidia代理行政總裁克雷斯指，公司不再向中國出貨H200晶片","points":["美國晶片龍頭輝達Nvidia代理行政總裁克雷斯指，公司不再向中國出貨H200晶片","董事會指，必須尋求新領導人，接替因婚外情風波辭職的黃仁勳","美國民主黨據報將調查商務部長盧特尼克，是否為避免兒子生意受影響，而拖延執行出口管制"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T12:35:00+08:00","size":1,"keywords":["晶片","輝達","黃仁勳","盧特尼克"],"body":"美國晶片龍頭輝達Nvidia代理行政總裁克雷斯指，公司不再向中國出貨H200晶片。董事會指，必須尋求新領導人，接替因婚外情風波辭職的黃仁勳。另外，美國民主黨據報將調查商務部長盧特尼克，是否為避免兒子生意受影響，而拖延執行出口管制。\n\n輝達代理行政總裁克雷斯周二接受美國財經頻道CNBC訪問，提到輝達不再向中國出貨H200晶片。\n\n輝達代理行政總裁克雷斯說：「我們只會把有授權的H200，在這最後季度送到中國，現在我們完全不再出貨H200，更別說不再運往中國了，所以我們非常謹慎，並會繼續專注於這方面。」\n\n輝達創辦人黃仁勳日前因捲入婚外情與間諜風波，辭任行政總裁職務。克雷斯在訪問中重申，董事會已決定不會讓黃仁勳復職。\n\n公司方面在當地周三舉行黃仁勳辭職後的首場全體員工大會，CNBC引述在場消息人士透露，克雷斯會上試圖平息員工要求黃仁勳復職的聲浪，呼籲員工向前邁進，之後將話題轉向加薪，打破公司慣例，宣布將原定在明年初進行的加薪和股票獎勵安排，提前至下月，希望藉此重振士氣。\n\n輝達董事會主席瓊斯就強調，找不到黃仁勳「翻版」，但外界仍有充滿活力、才能和經驗的領導人才。\n\n美國國會早前要求黃仁勳，以及商務部長盧特尼克出庭作證，雙方都已同意出席。有民主黨眾議員周二要求盧特尼克兒子提供所接管的投資公司，與輝達有關商業活動的紀錄，指要了解盧特尼克是否為避免兒子公司商業利益受影響，而拖延執行出口管制，做了影響國家安全政策等方面的決定。\n\n霍士新聞周三播出美國總統特朗普訪問，特朗普指，與國家主席習近平在晚宴期間就AI進行對話，並簡短提及黃仁勳的狀況。特朗普形容事件是悲劇，又指未聽過黃樂是間諜。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026esq0d6WmcJ1794802880.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/1be2ecd363f945c7aeb0bff668acb671/63d066a33966433783a0f833880cf90f-d2b34c7e6126eba8803b789aa49920b5-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026esq0d6WmcJ1794802880.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c9cb2f30ee9","title":"深耕中国、看好深圳：美国工商界人士期待借APEC深化中美经贸合作","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734557.shtml","summary":"中新网深圳11月19日电（张东方 戴悦 宫宏宇）2026年APEC领导人会议周期间，多位美国工商界人士接受记者采访时表示，APEC是推动区域贸易便利化、加强政策沟通协调的重要平台，期待依托这一机制…","summary_short":"中新网深圳11月19日电（张东方 戴悦 宫宏宇）2026年APEC领导人会议周期间…","digest":"2026年APEC领导人会议周期间，多位美国工商界人士接受记者采访时表示…","points":["中新网深圳11月19日电（张东方 戴悦 宫宏宇）2026年APEC领导人会议周期间…","视频：美中贸委会会长谭森现场用中文说“厚积薄发” 诠释APEC务实推进之道来源：中国新闻网","APEC推动贸易便利化，为企业带来切实机遇"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T11:49:34+08:00","size":1,"keywords":[],"body":"中新网深圳11月19日电（张东方 戴悦 宫宏宇）2026年APEC领导人会议周期间，多位美国工商界人士接受记者采访时表示，APEC是推动区域贸易便利化、加强政策沟通协调的重要平台，期待依托这一机制，在数字支付、无纸化贸易等多领域深化合作。\n\n视频：美中贸委会会长谭森现场用中文说“厚积薄发” 诠释APEC务实推进之道来源：中国新闻网\n\n　　APEC推动贸易便利化，为企业带来切实机遇\n\n　　成立37年来，APEC始终致力于推动贸易投资自由化便利化，促进区域经济增长与共同繁荣。\n\n　　在美国工商界人士看来，APEC的价值不仅在于凝聚共识，更体现在持续改善贸易环境、降低跨境经营成本，为企业创造更加便利的条件。\n\n　　中国美国商会会长何迈可表示，企业家和各经济体代表依托APEC平台相聚交流，本身就具有重要意义。对美国企业而言，APEC的重要价值在于帮助他们了解中国市场的长期前景，把握潜在机遇。\n\n　　他指出，深圳的发展展现了中国经济转型与创新的速度。作为众多中国企业总部所在地，深圳创新活力充沛，也为美国企业近距离了解中国市场和产业发展提供了窗口。\n\n　　“我们不少企业都已经在深圳以及大湾区布局业务。”何迈可说，“对美国企业而言，清晰、明确的规则至关重要，无论是企业母国的相关规则，还是中国的政策法规，都有助于企业准确判断经营环境。”\n\n　　在美中贸易全国委员会会长谭森看来，APEC这一多边机制不仅关乎中美，更关乎整个亚太地区。谭森说，APEC设立的意义在于让产品跨境流转变得更加顺畅。\n\n　　“这件事听起来并不新潮，不算高科技，也没有亮眼的噱头，但APEC实实在在的价值，就是帮助货物跨境运输更高效、更快速。”谭森说。\n\n　　他以机器人等高科技产品为例指出，一件产品的零部件可能在中国、马来西亚、越南、新加坡和美国等地之间多次流转，最终再回到中国。“供应链越复杂，APEC的作用就越关键。”\n\n　　谭森表示，APEC的成效不会一蹴而就，而是通过每年推动许多非常微小的渐进性变化和建议，持续降低贸易和商业活动中的障碍，让跨境交易更加便捷。\n\n　　“没有哪一家企业比深圳的公司，更能感受到APEC机制带来的便利。它让贸易变得更加顺畅高效，不仅惠及深圳企业，也惠及APEC各经济体以及全球各地的消费者。”谭森说。\n\n视频：深圳APEC丨美中贸易全国委员会会长谭森：APEC惠及全世界消费者来源：三里河\n\n　　期待深化务实合作，共促亚太繁荣\n\n　　受访美国工商界人士认为，作为全球和亚太地区重要经济体，中美加强协作，不仅有利于双边经贸关系发展，也将为区域合作与共同繁荣创造更多机遇。\n\n　　谭森表示，中美两大经济体携手努力，APEC才能更好地实现其愿景。在他看来，数字支付和无纸化贸易是双方有望取得进展的合作方向。中美可与其他APEC经济体一道，推动无纸化贸易和跨境电子支付建设。\n\n　　在何迈可看来，可持续发展目标、供应链和经济韧性是中美工商界可优先推进的合作方向。他认为，中国市场及其持续推进的创新，为两国企业深化合作提供了良好契机。\n\n　　农业领域同样是中美经贸合作的重要领域。美国大豆出口协会（USSEC）东亚区执行总监撒加罗表示，美国仍高度重视中国市场，美国农民希望继续向中国销售大豆。\n\n　　撒加罗介绍，不仅是APEC，在中国国际进口博览会期间，由美国大豆出口协会等多家农产品行业协会组成的“美国农产品贸易高级访华团”访华。“我希望继续发挥协会的桥梁作用，推动美国农业与中国市场对接，巩固双方信任，进一步拓展合作。”\n\n　　进入中国市场40多年来，惠普也持续从中国的发展中寻找合作机遇。惠普公司首席公共政策官布里塔妮·马萨洛萨洛（Brittany Masalosalo）表示，中国不仅是惠普全球制造业供应链的重要组成部分，也在研发创新领域发挥着重要作用。中国高校人才储备丰富，本土企业创新活跃，为跨国企业开展合作提供了广阔空间。（完）\n\n 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbb3e1b98b5","title":"時事通識｜雅爾塔會議","url":"https://news.tvb.com/tc/1207148-時事通識雅爾塔會議","summary":"中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤，令人聯想到1945年的雅爾塔會議。雅爾塔會議於1945年2月4日至11日，在蘇聯克里米亞舉行，是二戰期間美國、英國和蘇聯三國領袖一次重要的國際會議。","summary_short":"中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤，令人聯想到1945年的雅爾塔會議。","digest":"中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤…","points":["中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤…","雅爾塔會議於1945年2月4日至11日，在蘇聯克里米亞舉行，是二戰期間美國…","當時德國敗局已定，會議主要商討歐洲戰後重組，決定戰後新的地緣政治力量格局…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T18:25+08:00","size":1,"keywords":[],"body":"中俄美元首在APEC會議期間，舉行三方會談，有評論指今次會晤，令人聯想到1945年的雅爾塔會議。\n\n雅爾塔會議於1945年2月4日至11日，在蘇聯克里米亞舉行，是二戰期間美國、英國和蘇聯三國領袖一次重要的國際會議。\n\n當時德國敗局已定，會議主要商討歐洲戰後重組，決定戰後新的地緣政治力量格局，其中包括蘇聯承諾在歐洲戰事結束後對日作戰，但條件是維持外蒙古現狀等，當中涉及中國主權，但中方並未參與決策。\n\n雅爾塔會議制定了第二次世界大戰，戰後的世界新秩序和列強利益分配方針，奠定了戰後，由美國與蘇聯主導的雅爾塔體系，而大國私下安排別國事務的做法，遺留的主權爭端影響至今。\n\n有學者認為，如今中俄美不是盟友關係，會晤也不是要給世界安排新秩序，將兩者相提並論未必恰當。\n\n點擊觀看其他集數","image":"https://pro-vod-cdn.tvb.com/24e2c94ea1e44081a038e01a4bb81442/snapshots/f7d7f1ddc9474bed8e8f83703ec2ef78-00008.jpg","video":"https://pro-vod-cdn.tvb.com/24e2c94ea1e44081a038e01a4bb81442/b4bdca3b5ac74a5e8ffd82adbcdefb44-b726195d7f0491f39d338ca07bdef4dd-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/24e2c94ea1e44081a038e01a4bb81442/snapshots/f7d7f1ddc9474bed8e8f83703ec2ef78-00008.jpg","lang":"zh-Hant"}]},{"name":"民生","total":58,"items":[{"id":"c75e63f43d5","title":"中国雪乡风景区开园 新增冰雪DIY体验","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734667.shtml","summary":"中新网牡丹江11月19日电 (记者 王琳)19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。","summary_short":"中新网牡丹江11月19日电 (记者 王琳)19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。","digest":"19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客","points":["中新网牡丹江11月19日电 (记者 王琳)19日…","今冬，该景区新增冰雪DIY(Do It Yourself)创作等互动体验","中国雪乡风景区距离哈尔滨200多公里，是“哈亚雪”冰雪旅游精品线路的重要一环"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T15:44:45+08:00","size":2,"keywords":[],"body":"中新网牡丹江11月19日电 (记者 王琳)19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。今冬，该景区新增冰雪DIY(Do It Yourself)创作等互动体验。\n\n　　中国雪乡风景区距离哈尔滨200多公里，是“哈亚雪”冰雪旅游精品线路的重要一环。这里每年10月至次年4月持续降雪，积雪厚度最高可达2米，自然形成层层叠叠的雪蘑菇、雪檐等景观。\n\n19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。图为开园活动现场全景。孙庭义 摄\n\n　　开园当日，雪乡银装素裹，纷飞的雪花为大红灯笼罩上一层白纱。开园仪式现场，高跷、锣鼓、秧歌轮番上演，中外游客从远方赶来，驻足观看民俗展演，在唯美雪景中拍照打卡。\n\n　　新雪季，雪乡围绕游玩业态、夜景氛围、场景设施、服务保障、文体活动等多维度提档升级。在游玩内容方面，全新推出多个互动式、体验式、参与式的冰雪项目，引入雪地龙舟展演特色项目，打造关东冰雪运动IP。\n\n19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。图为高跷民俗表演在雪中精彩上演。孙庭义 摄\n\n　　依托雪源大街河道的天然冰雪资源，雪乡打造自然造物冰雪体验区，结合墙面彩绘与自然雪景，开设雪雕手工课堂。专业人员现场指导，面向亲子家庭、青少年群体开设冰雪DIY创作体验，让静态雪景转化为可触摸、可创作、可互动的动态游玩场景。\n\n　　在灯饰亮化方面，全新建成4200平方米大型花灯观赏区，围绕林海雪原风光、东北民俗文化、新春祈福年味三大主题布设灯组，并增设许愿互动环节。火红灯火与皑皑白雪交相辉映，营造“白天赏雪景、夜晚观灯景”的全天候游览体验。\n\n19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。图为鼓手雪中擂鼓助兴。孙庭义 摄\n\n　　此外，雪乡全新打造年轻化、潮流化的网红打卡景观集群，增设主题打卡墙、文艺快闪舞台、东北方言创意景观等新潮点位；针对往年旅游旺季车流集中、通行压力较大的实际情况，实施多项重点基础设施升级工程；将陆续启动14项文体赛事，涵盖文创艺术、体育竞技、数字创作等多个领域。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"中国雪乡风景区开园 新增冰雪DIY体验","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734667.shtml","source_display":"中新網 社會","published_at":"2026-11-19T15:44:45+08:00","category":"","digest":"19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客"},{"title":"中国雪乡风景区开园 新增冰雪DIY体验","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734640.shtml","source_display":"中新網 社會","published_at":"2026-11-19T15:18:49+08:00","category":"","digest":"位于黑龙江省的龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区19日开园迎客"}]},{"id":"ca55652137c","title":"上海区域空间环评改革扩围 源头管控方式更丰富","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734849.shtml","summary":"中新网上海11月19日电 (记者 陈静)上海市生态环境局方面19日披露，上海区域空间环评改革已从单个试点拓展至包括郊区新城、重点产业集聚区和中心城区在内的三种类型区域…","summary_short":"中新网上海11月19日电 (记者 陈静)上海市生态环境局方面19日披露…","digest":"上海市生态环境局方面19日披露，上海区域空间环评改革已从单个试点拓展至包括郊区新城…","points":["中新网上海11月19日电 (记者 陈静)上海市生态环境局方面19日披露…","上海的营商环境进一步优化、源头管控手段和方式进一步丰富","区域空间环评是推进区级生态环境分区管控落地实施的一项重要手段"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T20:48:53+08:00","size":1,"keywords":[],"body":"中新网上海11月19日电 (记者 陈静)上海市生态环境局方面19日披露，上海区域空间环评改革已从单个试点拓展至包括郊区新城、重点产业集聚区和中心城区在内的三种类型区域，“亚单元+清单”差异化精准管控加快落地。上海的营商环境进一步优化、源头管控手段和方式进一步丰富。\r\n\n　　据悉，区域空间环评是推进区级生态环境分区管控落地实施的一项重要手段。继青浦新城完成上海首个区域空间环评试点后，张江科学城、徐汇区也先后完成区域空间生态环境评价成果发布。\n\n　　据悉，上海不同区域自然资源禀赋和管理需求差异明显，中心城区以餐饮油烟、汽修等生活源及交通噪声管控为主，郊区新城更关注产城融合发展矛盾和农业源管控，需要定制精准策略。上海区域空间环评改革明确在各区推行区域空间环评，实施“亚单元+清单”差异化精准管控；通过政府主导的“区域空间环评”替代企业零散的“项目环评单独申报”，推动管理方式由被动管理向主动服务转变。\n\n　　青浦区组建覆盖生态环境分区管控、国土空间规划、大气环境、水环境、固定污染源管理等领域的联合技术团队。青浦区在原有6个市级环境管控单元基础上，细化划定产业发展、科创研发、居住生活等8类43个生态环境评价单元，分不同类别单元编制生态环境管理清单。\n\n　　针对完成区域空间环评后豁免环评手续的行业，青浦区制定行业环保指引，明确施工期、运营期废气、废水、固废、噪声治理和土壤地下水污染防控以及新污染物管控、环境风险管控等要求；同时将排污许可发证和登记关口前移至开工建设前。\n\n　　徐汇区区域空间环评将原有2个市级环境管控单元细化为产业发展、科创研发等9类47个生态环境评价单元，按“市-区-评价单元-地块”建立清单管控体系；针对漕河泾开发区以外的零星工业研发用地明确了产业准入要求，针对餐饮选址明确了禁设地址清单。\n\n　　据悉，自青浦新城区域空间环评成果发布实施以来，共有130个产业项目享受豁免环评政策。从更长周期看，此次试点共可豁免76个行业类别的环评手续，占全部141个行业类别的54%，而现行环评政策豁免比例为21%。\n\n　　上海市生态环境局方面表示，三类区域空间环评改革进展背后，是一套逐步成形的全市性制度框架。在简化环评的同时，上海用区域空间环评解决选址问题、用排污许可解决准入后管理问题，准入更精准、要求不降低，让源头预防、过程管控、末端治理形成有效闭环。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce64627527e","title":"天津河西：“老帮老”搭桥 银发互助融入社区日常","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734832.shtml","summary":"中新网天津11月19日电 题：天津河西：“老帮老”搭桥 银发互助融入社区日常  　　作者 薛淳月  　　天津市河西区西园西里社区活动室内，老人们将盐和中草药装入布袋中封好，制成可以带回家的热敷盐包。","summary_short":"中新网天津11月19日电 题：天津河西：“老帮老”搭桥 银发互助融入社区日常  　　作者 薛淳月  　　天津市河西区西园…","digest":"题：天津河西：“老帮老”搭桥 银发互助融入社区日常  　　作者 薛淳月  　　天津市…","points":["天津市河西区西园西里社区活动室内，老人们将盐和中草药装入布袋中封好，制成可以带回家的热敷盐包","每月19日是西园西里社区固定的老年活动日","健康讲座、法律咨询、手机课堂、手工制作……活动内容并不固定，而是根据老年人的实际需求安排"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:34:58+08:00","size":1,"keywords":[],"body":"中新网天津11月19日电 题：天津河西：“老帮老”搭桥 银发互助融入社区日常\n\n　　作者 薛淳月\n\n　　天津市河西区西园西里社区活动室内，老人们将盐和中草药装入布袋中封好，制成可以带回家的热敷盐包。\n\n　　每月19日是西园西里社区固定的老年活动日。健康讲座、法律咨询、手机课堂、手工制作……活动内容并不固定，而是根据老年人的实际需求安排。西园西里社区党委书记张磊介绍：“最近天气冷了，老人犯腰腿疼的多了，需要热敷和艾灸。”\n\n11月19日，天津市河西区西园西里社区老人参加社区活动。(受访者供图)\n\n　　这些需求从哪里来？西园西里社区老年协会会长苗志强介绍，社区工作人员、网格员和老年协会成员平时通过入户探访、日常聊天了解老人的想法。每月老年协会都会召开例会，将收集到的需求进行归纳，再讨论当月活动安排。\n\n　　西园西里社区建于20世纪80年代，目前常住人口4000余人，60岁以上老人占比近41%，社区居委会只有9名工作人员。\n\n　　面对较多的老年人需求，社区过去的为老服务更多以“救急”为主。在梳理资源时，社区发现，老年人多不仅意味着服务需求多，也意味着有更多有时间、有经验、有技能的居民可以参与社区事务。张磊说，社区以选好老年协会带头人为突破口，吸纳热心公益、愿意服务邻里的退休居民参与社区生活。\n\n　　2024年底，西园西里社区老年协会换届，新一届协会有9名成员，年龄均在65岁以上。苗志强表示，老年协会希望成为社区党委、居委会与老年人之间的桥梁，让老年人“有话愿意说、有事愿意找”。\n\n　　在西园西里，邻里互助并不是近年才开始的尝试。张磊介绍，早在20多年前，社区就探索了“1+N帮1”服务项目，由网格员统筹协调，带动老年协会志愿者、邻居、爱心商户、共建单位等N方力量参与，帮助孤寡、独居等困难老人。\n\n图为天津市河西区西园西里社区，老人在小区花园里围坐休闲交流。薛淳月 摄\n\n　　在此基础上，社区近年又形成面向全体老年人的“2345”为老服务工作法，涵盖两项制度、“三个一”行动、四大功能组、五项举措。其中，“三个一”行动要求老年协会成员帮扶一名孤寡老人、办好一件助老实事、组织一项益老活动。苗志强说，协会通过定期例会讨论服务计划、登记帮扶情况，让原本比较零散的助老工作有了固定安排。\n\n　　社区内孤寡困难老人是重点帮扶对象，由老年协会成员分工结对。苗志强在探访中发现一位80多岁的老人常拄着树枝出门，他便为老人买来拐杖，又买来新鞋替换老人脚上开裂的拖鞋，并联系有维修技能的志愿者修补老人家里损坏的纱窗。\n\n　　这种互助机制也向社区文化活动延伸。今年重阳节，西园西里社区举办首届老年艺术节，活动包括文艺演出、独唱和朗诵比赛等。“老年人展，老年人看，老年人演，老年人赞。”苗志强表示，艺术节不仅让老人展示才艺，也让更多此前较少参与社区活动的居民走进社区。一些老人参加活动后，主动加入志愿服务队伍，开始为其他老人提供帮助。\n\n　　“这不单是一次活动，而是通过活动把社区里‘沉睡的老年人’叫醒了，将大家凝聚到一起。”张磊说，艺术节后，不少老人走进社区，主动询问有什么事情可以参与。\n\n　　随着老年协会成员参与日常帮扶，一些原本需要社区工作人员协调处理的生活小事，也有了更多人帮着解决。“工作量减轻的同时，居民整体满意率反而比以前提高了。”张磊说。\n\n　　“社区的工作就是这样，很多小事、很多琐碎的事，但也就是这些小事和琐事组成了居民的日常。”张磊说，“怎么在日常生活中把这些小事服务好、办好，这是居委会的日常作用。”(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c772479db3f","title":"广西师范大学出版社成立40周年高质量发展大会举行","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734872.shtml","summary":"中新网桂林11月19日电(周利朔 欧惠兰)11月19日，广西师范大学出版社成立40周年高质量发展大会在桂林举行。","summary_short":"中新网桂林11月19日电(周利朔 欧惠兰)11月19日，广西师范大学出版社成立40周年高质量发展大会在桂林举行。","digest":"11月19日，广西师范大学出版社成立40周年高质量发展大会在桂林举行","points":["广西师范大学党委书记赵勇富致辞时表示，数十年来，广西师范大学出版社近百种图书斩获国家级荣誉…","广西师范大学出版社集团党委书记、董事长黄轩庄在大会上介绍，集团业务涉及图书期刊出版发行…","原国家新闻出版总署副署长邬书林致辞表示，广西师范大学出版社从高校出发，依托教育出版成长…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:33:34+08:00","size":1,"keywords":[],"body":"中新网桂林11月19日电(周利朔 欧惠兰)11月19日，广西师范大学出版社成立40周年高质量发展大会在桂林举行。广西师范大学党委书记赵勇富致辞时表示，数十年来，广西师范大学出版社近百种图书斩获国家级荣誉，图书海外馆藏影响力多年稳居全国高校出版社首位。\n\n图为11月19日，广西师范大学出版社成立40周年高质量发展大会在桂林举行。李显杨 摄\n\n　　广西师范大学出版社集团党委书记、董事长黄轩庄在大会上介绍，集团业务涉及图书期刊出版发行、创意设计、阅读服务、教育培训、研学旅游等多个领域，年出版图书2500多种。40年来，广西师范大学出版社2次获得中宣部“五个一工程”图书奖，16种图书获得国家图书奖、中国图书奖和中国出版政府奖，7种图书获得中华优秀出版物奖，3种图书获评为“中国好书”，共有14种图书获得“中国最美的书”和“世界最美的书”等荣誉。\n\n　　原国家新闻出版总署副署长邬书林致辞表示，广西师范大学出版社从高校出发，依托教育出版成长，逐步向学术文化、古籍文献拓展，从20世纪90年代起，在全球范围内开展珍稀文献的抢救、整理与传播。《汉画总录》《英国国家图书馆藏敦煌遗书》等，为学界提供了大量第一手史料，也为国际学术界提供了研究范式。\n\n　　中国图书评论学会会长肖启明说，当前，出版业正面临数智化转型、媒介迭代的深刻变革。期待广西师范大学出版社既守住慢工出细活的传统，也主动拥抱新质生产力，在知识服务、古籍活化、国际传播上探索新路；既坚持精品底线，也探索厚重人文著作的现代化传播，让学术走出书斋。\n\n图为广西师范大学出版社成立40周年高质量发展大会现场。李显杨 摄\n\n　　黄轩庄表示，广西师范大学出版社未来将以教育出版为主轴精耕细作，持续提升学术人文和珍稀文献出版的内涵，推进构建以知识服务为目标、以数字信息为载体的新型出版传播体系；将以出版融合发展为牵引，探索“出版＋文化＋科技”的新业态、新模式，推动内容、技术、平台、业态深度融合，加快形成内容增值、融合共生、开放创新的出版发展新生态，有效促进出版产业链、价值链优化升级。\n\n　　当天，中国出版协会、中国图书评论学会、韬奋基金会、中国大学出版社协会等单位代表以及作者、读者代表约300人参加了大会。大会同步举行了“数智时代：出版新局与深阅读”研讨会。中国新闻出版研究院出版研究所所长徐升国作了题为“人工智能时代出版业新未来——‘十五五’时期出版业发展趋势思考”报告，中国出版集团公司原总裁聂震宁作了题为“全民阅读视域下的深阅读”报告。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8900b36b78","title":"云南优良水体比例十年间提升31.8个百分点","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734879.shtml","summary":"中新网昆明11月19日电 (黄欣媛)19日，云南省全面推行河湖长制十周年建设成效新闻发布会在昆明举行。","summary_short":"中新网昆明11月19日电 (黄欣媛)19日，云南省全面推行河湖长制十周年建设成效新闻发布会在昆明举行。","digest":"19日，云南省全面推行河湖长制十周年建设成效新闻发布会在昆明举行","points":["中新网昆明11月19日电 (黄欣媛)19日，云南省全面推行河湖长制十周年建设成效新闻发布会在…","会上介绍，2025年云南国控断面优良水体比例达94.1%，较2015年提升31.8个百分点","云南地处长江、珠江、澜沧江、红河、怒江、伊洛瓦底江六大水系上游或源头…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:28:28+08:00","size":1,"keywords":[],"body":"中新网昆明11月19日电 (黄欣媛)19日，云南省全面推行河湖长制十周年建设成效新闻发布会在昆明举行。会上介绍，2025年云南国控断面优良水体比例达94.1%，较2015年提升31.8个百分点。\n\n　　云南地处长江、珠江、澜沧江、红河、怒江、伊洛瓦底江六大水系上游或源头，是中国重要的生态安全屏障。全面推行河湖长制以来，云南逐步建立省、市、县、乡、村五级河湖长责任体系，3万余名河湖长履职尽责，持续推动河湖保护治理责任落实。同时，通过完善地方性法规、深化部门协作等方式，形成河湖长与检察长、警长协同保护机制，推动河湖治理形成多方共治格局。\n\n图为发布会现场。赵嘉 摄\n\n　　云南省河长办副主任、省水利厅副厅长霍玉河介绍，十年来，云南持续完善河湖长制工作机制，压实各级河湖长责任，统筹推进河湖保护、治理与修复，河湖管护能力不断提升。2025年，云南全省出省、出国境水质连续5年保持100%优良，六大水系出境跨界断面水质均保持Ⅱ类及以上，劣Ⅴ类水体比例由2015年的17.4%下降至0.5%。\n\n　　高原湖泊保护治理是云南河湖治理的重要内容。近年来，云南围绕重点高原湖泊实施“三治一改善”行动，累计建成城镇污水处理厂64座，治理入湖河道131条(段)、405公里，修复湿地15.8万亩、湖滨生态带14.5万亩。\n\n　　目前，抚仙湖、泸沽湖水质稳定保持Ⅰ类，洱海水质保持优良，阳宗海由Ⅲ类提升至Ⅱ类，滇池自2018年以来连续8年保持Ⅳ类，2025年水质多项指标达到系统监测以来最好水平。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1433424a25","title":"天津成立生态研学联盟 发布十大生态文旅研学点位","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734819.shtml","summary":"中新网天津11月19日电 (记者 江莹)18日，天津“生态文旅寻美津门”工作会暨天津生态研学联盟成立活动在天津师范大学举办。","summary_short":"中新网天津11月19日电 (记者 江莹)18日，天津“生态文旅寻美津门”工作会暨天津生态研学联盟成立活动在天津师范大学举…","digest":"18日，天津“生态文旅寻美津门”工作会暨天津生态研学联盟成立活动在天津师范大学举办","points":["中新网天津11月19日电 (记者 江莹)18日，天津“生态文旅寻美津门”工作会暨天津生态研学…","活动现场发布十大生态文旅研学点位，打造一批集生态科普…","图为与会人员到天津师范大学生态记忆展馆参观"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T20:15:51+08:00","size":1,"keywords":[],"body":"中新网天津11月19日电 (记者 江莹)18日，天津“生态文旅寻美津门”工作会暨天津生态研学联盟成立活动在天津师范大学举办。活动现场发布十大生态文旅研学点位，打造一批集生态科普、互动体验与文化旅游于一体的生态文明实践阵地。\n\n图为与会人员到天津师范大学生态记忆展馆参观。(天津市生态环境局供图)\n\n　　据介绍，本次活动由天津市生态环境局、天津市文化和旅游局指导，天津生态研学联盟将系统整合全市优质生态文旅研学资源，建立常态化协作机制，推进研学产品开发、线路设计与品牌推广，构建“跨域协同、多点联动”研学体系，打造“生态+文旅+研学”融合发展的天津样板，引导公众在研学旅行中学习生态环保知识、感受生态治理成效、践行绿色低碳行为。\n\n　　此次公布的十个生态文旅研学点位划分六大主题板块，覆盖森林、湿地、河流、农业、工业、校园多元生态资源。\n\n　　其中，八仙山国家级自然保护区为华北物种基因库，保存华北罕见完整森林垂直带谱；海河河北区段获评全国“美丽河湖”优秀案例，联动南开区段创新“水陆复合、文旅交融”体验模式；春山里生态教育国际生活示范区是京津冀废弃矿坑生态修复标杆项目；临港生态湿地公园(一期)为国内大型工业区内少见的集水处理、景观展示于一体的生态湿地；第六埠村作为国家级“两山”实践创新基地，形成“一水三用、一地三收”复合产业体系；一汽—大众华北基地、光大兴辰环保能源呈现“智能制造+绿色生态”工业研学场景；长芦海盐文化旅游区、津药达仁堂现代中药产业园分别展现千年海盐文化与中医药传承智慧；天津师范大学依托771亩自然湖泊湿地及多个科普平台，开辟校园生态研学课堂。\n\n　　活动现场，天津市相关区生态环境部门、联盟成员单位、各研学点位相关代表围绕点位生态文化内涵开展交流研讨，聚焦精品研学路线打造、完善绿色服务配套、推动“绿水青山就是金山银山”生态价值转化等议题建言献策。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbd426488f6","title":"北京构建暖冬文旅服务矩阵 多元演艺、精品展览集中亮相","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734831.shtml","summary":"中新网北京11月19日电 (记者 徐婧)“京彩冬韵畅游北京”冬季活动推介会19日举行。","summary_short":"中新网北京11月19日电 (记者 徐婧)“京彩冬韵畅游北京”冬季活动推介会19日举行。","digest":"“京彩冬韵畅游北京”冬季活动推介会19日举行","points":["中新网北京11月19日电 (记者 徐婧)“京彩冬韵畅游北京”冬季活动推介会19日举行","北京市文化和旅游局联合市商务局、市文物局、市体育局等相关部门，整合冰雪、演艺、乡村、美食…","演出活动方面，今年11月至明年2月，北京已开票营业性演出1100多台5600余场…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T20:11:33+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 徐婧)“京彩冬韵畅游北京”冬季活动推介会19日举行。北京市文化和旅游局联合市商务局、市文物局、市体育局等相关部门，整合冰雪、演艺、乡村、美食、文博、赛事等优质资源，邀请民众共赴文商旅体展荟萃的冬日之约。\n\n　　演出活动方面，今年11月至明年2月，北京已开票营业性演出1100多台5600余场，大型文艺演出40多台80余场，覆盖传统国粹、潮流演出等品类。\n\n　　入境游方面，北京构建全链条暖冬文旅服务矩阵，面向东南亚、欧美、海外青年学生等客源市场推出差异化产品。11月11日至12月31日，大兴机场国际中转旅客可兑换北京野生动物园免费门票，并领取机场消费券；首都机场在T3国际区设文旅专区，推出多条精品转机游线路。\n\n　　消费活动方面，北京将以“京彩冬韵”“京彩春禧”两大核心主题，统筹各大商圈、餐饮老字号、电商平台、零售企业等力量，推出全城联动、线上线下深度融合的冬春消费大餐。王府井、三里屯、隆福寺、五棵松、蓝色港湾等重点商圈将密集推出形式多样的促消费主题活动，京菜名片美食推广季将集中呈现涮羊肉、炙子烤肉等美食。与此同时，线上年货节“不打烊”。北京各大电商平台、即时零售企业集中开设线上年货专区，消费者可选购老字号礼盒、地道京味特产、生肖文创好物等商品。\n\n11月9日，媒体记者参观拍摄明代孝端皇后九龙九凤冠。当日，“明礼华章——万历孝端皇后九龙九凤冠”专题展媒体开放日在位于北京的中国国家博物馆举行。　中新社记者 田雨昊 摄\n\n　　文博场馆方面，北京地区各博物馆准备了系列展览和文化活动。围绕2027年丁未羊年主题，统筹策划年俗展览，形成生肖文化展示矩阵；中国国家博物馆将推出“万里同归——新时代文物追索返还成果展”，讲述文物漂泊海外、终回故里的真实故事；首都博物馆将于明年1月推出京津冀花鸟书画展，以传统花鸟画为载体，展现三地文化同源、文脉相通的地域特质。\n\n　　体育赛事方面，2026-2027赛季国际雪联单板及自由式滑雪大跳台世界杯(北京站)将于12月3日至5日在首钢滑雪大跳台开赛；12月14日至20日，有着“冰上F1”之称的雪橇世界杯将在延庆“雪游龙”举办；2027年1月18日至29日，2026-2027赛季钢架雪车亚洲杯也将在“雪游龙”举办。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2ab2cfacd5","title":"旧物缄口 故事不息：年轻人如何读懂美国友人柏大卫？","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734855.shtml","summary":"中新网西宁11月19日电 题：旧物缄口 故事不息：年轻人如何读懂美国友人柏大卫？","summary_short":"中新网西宁11月19日电 题：旧物缄口 故事不息：年轻人如何读懂美国友人柏大卫？","digest":"题：旧物缄口 故事不息：年轻人如何读懂美国友人柏大卫","points":["青海省西宁市湟源县人民医院的院史馆里，最显眼的是一台退役的CT机，白色外壳已经泛黄","图为湟源县人民医院院长黄炯介绍柏大卫的信件","湟源县人民医院新职工入职第一课安排在这里"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T20:01:01+08:00","size":1,"keywords":[],"body":"中新网西宁11月19日电 题：旧物缄口 故事不息：年轻人如何读懂美国友人柏大卫？\n\n　　作者 祁增蓓 杨璐新\n\n　　青海省西宁市湟源县人民医院的院史馆里，最显眼的是一台退役的CT机，白色外壳已经泛黄。机器旁边，玻璃柜里放着几摞信，纸色发深，折角磨得起了毛，柜角还摞着几本外文说明书，书脊翻得发松。\n\n图为湟源县人民医院院长黄炯介绍柏大卫的信件。　　　祁增蓓摄\n\n　　湟源县人民医院新职工入职第一课安排在这里。“入职教育讲柏大卫，门诊大屏上展播他的故事。”院长黄炯说，“不然的话，我们这一代人知道，后续的年轻人就不知道了。”\n\n　　黄炯口中的柏大卫是一位95岁的美国老人。1932年，刚满周岁的他随父亲柏立美从纽约来到湟源，1949年随家人离开湟源，辗转多地后定居美国。1987年再回湟源，张口就是地道的湟源话，被老街坊当场认了出来。\n\n　　“这是县里第一台CT，是柏大卫2000年捐赠给湟源的。”黄炯回忆，简单的捐赠仪式上，柏大卫走到CT机前，深深鞠了一躬，用湟源话说：“这个CT机要好好地给家乡人服务。”\n\n资料图为2000年7月，柏大卫在CT机捐赠仪式上向仪器鞠躬。　　　湟源县人民医院供图\n\n　　二十多年过去，黄炯说起那一幕还是会红了眼眶，感叹一句：“那个鞠躬，我一辈子忘不了。”\n\n　　为把这台机器送进来，柏大卫前后跑了三趟湟源：问CT室要多大房间、用哪种胶片、隔墙里有没有加铅。人不在湟源的时候，信一封接一封寄来。\n\n　　湟源县人民医院原院长王世康在信里劝他保重身体，他回信只有一句：“我们是朋友，不要费心、费时、费事在我的身上，有一碗面片就好了。”\n\n　　如今站在展板前听讲解的年轻人，多半没赶上机器启用，也没见过那个总套着件旧马甲的美国老人。\n\n　　“我是湟源人，小时候就听过他的故事，站在这里才读懂这份跨越山海的仁心。”2025年9月入职的尹首垟说，“身为医者，我们不仅需要不断增进自身的医术，更要心怀感恩，乐于奉献。”\n\n　　机器已退役，可它曾给出湟源县第一例开颅手术的诊断依据。在人口不过10万的小县城，湟源县人民医院年门诊量超30万人次，周边州县民众都要来这里看病。\n\n图为青海省西宁市湟源县人民医院院史馆里陈列的退役医疗设备。　　　祁增蓓摄\n\n　　展馆里还有另一批东西：柏大卫父亲柏立美拍下的老照片，结集为画册《印迹》，原件捐给了当地档案馆，成为地方文史研究与民俗传承的重要支撑。\n\n　　新入职的年轻人未必记得清那些退役设备的名字，但走一圈下来，会看到百余封信件，还有一张1942年的古城全景照——照片上六个孩子站在山坡上，其中一个就是柏大卫。\n\n　　“在外人看来，他是一张外国面孔；但在我们心里，他就是土生土长的湟源娃。”湟源县人民医院工会主席范龙说，柏大卫不是把东西寄来了事，而是从对接、运输到落地，全程跟着，“这份真诚，会传给一代代医护人员”。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c286549cdf6","title":"四川成都：病房里的艺术之“约”","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-19/news1075488.shtml","summary":"画笔绘出童趣、艺术带来慰藉……","summary_short":"画笔绘出童趣、艺术带来慰藉…","digest":"画笔绘出童趣、艺术带来慰藉……每周一晚7时，在成都第一骨科医院儿童骨科病区…","points":["画笔绘出童趣、艺术带来慰藉……每周一晚7时，在成都第一骨科医院儿童骨科病区…","来自成都青羊区多所公立学校的美术教师，利用下班时间…","让住院患儿在艺术创作中，缓解入院带来的紧张情绪，感受陪伴与快乐"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T19:35:27+08:00","size":1,"keywords":[],"body":"画笔绘出童趣、艺术带来慰藉……每周一晚7时，在成都第一骨科医院儿童骨科病区，病房里多了欢声笑语。来自成都青羊区多所公立学校的美术教师，利用下班时间，为住院患儿带来40分钟的一对一公益艺术疗愈体验课。让住院患儿在艺术创作中，缓解入院带来的紧张情绪，感受陪伴与快乐。\n\n据悉，这项艺术疗愈项目由成都市青羊区中小学美术教研员匡敏发起。此前，她曾带领志愿教师在特殊教育学校开展7年公益艺术疗愈活动。2023年，在医院支持下，美术课堂走进儿童骨科病房。志愿教师根据患儿年龄、受伤部位等情况，设计一对一教学内容。\n\n截至目前，项目已开展82场，服务600余名患儿及家属，志愿教师队伍从最初的80余人扩大至150余人。如今，艺术疗愈已延伸至老年病区。未来，医院计划将项目拓展至更多科室，匡敏也希望吸纳音乐、形体等领域的专业教师参与，探索更加科学、可持续的艺术疗愈服务模式。(杨予頔 四川成都报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/DA98F6E7E931480A96A98CAC77BE2BDA.mp4","video_poster":"","lang":"zh-Hant"},{"id":"cf760f7a047","title":"好评中国丨秋假释放文旅活力，让“诗与远方”赋能成长","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734854.shtml","summary":"彭泷阩  　　11月起，江苏、福建、四川、广东等多地进入中小学秋假时段。","summary_short":"彭泷阩  　　11月起，江苏、福建、四川、广东等多地进入中小学秋假时段。","digest":"彭泷阩  　　11月起，江苏、福建、四川、广东等多地进入中小学秋假时段","points":["11月起，江苏、福建、四川、广东等多地进入中小学秋假时段","据人民日报海外版报道，多家旅游平台数据显示，11月14日至15日迎来首个秋假集中出行小高峰…","各地秋假时间自行安排，预计秋假出游热潮将延续到12月初"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T19:25:25+08:00","size":1,"keywords":[],"body":"彭泷阩\n\n　　11月起，江苏、福建、四川、广东等多地进入中小学秋假时段。据人民日报海外版报道，多家旅游平台数据显示，11月14日至15日迎来首个秋假集中出行小高峰，酒店预订量环比上一周末增长超五成，来自放秋假地区的亲子家庭订单较去年增长70%，12岁及以下儿童机票预订量增长75%；各地秋假时间自行安排，预计秋假出游热潮将延续到12月初。\n\n　　设立秋假的初衷是给孩子留出调整学习节奏、亲近自然的时间，政策出发点在孩子，落脚点在家庭。“一年好景君须记，最是橙黄橘绿时。”秋日风光值得孩子们走出课堂亲近，更适合一家人相伴共赏。不少地方景区将学生优惠延伸至随行家长，秋假的设计面向的不只是单独放假的学生，而是期盼亲子相伴的家庭。假期安排的是孩子的假期时间，承载的是家庭团聚的需求。\n\n　　政策善意尤其要关照那些没有体现在旅游订单里的家庭。杭州是国内较早探索春秋假的城市，实践已有二十余年。2025年秋假期间，杭州十个城区开设138个托管点位，约1.2万名中小学生参与托管。双职工家庭假期看护难、留守儿童假期缺少陪伴、不少工薪家庭难以负担市场化托管费用等现实难题依然摆在眼前，这部分群体的处境最能检验政策的民生温度。\r\n\n　　秋假的核心目标始终是服务学生成长、助力家庭陪伴，客流走向也折射秋假落地的实际成色。不少县域民宿预订火热，乡村研学产品订单走高，家庭搭乘短途动车、自驾、乘坐城乡公交奔赴乡野，亲子客群向周边县域流动；各地错开秋假时段，实现错峰出游，在一定程度上避开长假拥堵，给普通家庭提供了更从容的出游选择……文旅流量向县域下沉是秋假带来的外溢红利，既拓宽家庭出行选择，也为县域文旅积蓄动能。\n\n　　秋假落地最突出的堵点在于家长休假时间难以匹配，孩子放假，家长的带薪休假安排并不会同步跟进。一项公共政策倘若预设家庭总有家长可以随时请假陪护，就脱离不少家庭的现实。今年的政府工作报告将“支持有条件的地方推广中小学春秋假”与“落实职工带薪错峰休假制度”一并部署。眼下不少地方探索班组轮休、弹性上下班，优先保障未成年子女家长调休。多地探索印证，学生假期与职工休假两套时间安排，存在衔接空间。从局部探索走向普遍可行，还需要持续完善制度衔接、压实各方责任。家长调休有渠道、有保障，孩子的秋假才能真正成为家庭相伴的时光。\n\n　　秋假从试点走向常态化推广，不能急于求成，也不宜“一刀切”推进。各地气候条件、教学安排、用工状况、家庭结构差异明显，一味齐步走反而会削弱因地制宜的空间。“支持有条件的地方推广”本身就是实事求是的安排，推进这项改革既要顺应群众对劳逸结合、亲子陪伴的期盼，也要统筹企业用工、职工休假、基层托管承载力等现实条件，坚持积极稳妥、量力而行，兼顾不同群体诉求，方能推动这项民生探索行稳致远。\n\n　　(中国互联网发展基金会中国正能量网络传播专项基金支持项目) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c428061ae3c","title":"冷空气补充影响广东 全省气温继续下降","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734817.shtml","summary":"中新网广州11月19日电 (记者 王坚)广东19日气温持续走低，当日早晨全省最低气温降至10℃。","summary_short":"中新网广州11月19日电 (记者 王坚)广东19日气温持续走低，当日早晨全省最低气温降至10℃。","digest":"广东19日气温持续走低，当日早晨全省最低气温降至10℃","points":["中新网广州11月19日电 (记者 王坚)广东19日气温持续走低…","广东省气象局表示，预计20日冷空气将持续补充影响该省，全省气温还将有所下降","广东省气象局介绍，在冷空气影响下，19日早晨，全省多云到阴天，局部出现了零星小雨…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T19:05:44+08:00","size":1,"keywords":[],"body":"中新网广州11月19日电 (记者 王坚)广东19日气温持续走低，当日早晨全省最低气温降至10℃。广东省气象局表示，预计20日冷空气将持续补充影响该省，全省气温还将有所下降。\n\n广州气温下降，市民穿上厚衣服保暖。王坚 摄\n\n　　广东省气象局介绍，在冷空气影响下，19日早晨，全省多云到阴天，局部出现了零星小雨，早晨最低气温：粤北大部、肇庆北部、云浮北部市县10℃至15℃，雷州半岛南部21℃左右，其余市县15℃至19℃。此外，受冷空气影响，18日傍晚到19日早晨，全省海面出现东北风6级至7级、阵风8级。\n\n　　气象专家表示，预计20日有冷空气持续补充影响广东，气温还将继续下降，此次冷空气过程最低气温将出现在21日早晨前后，届时全省最低气温或将跌至6℃。\n\n　　广东省气象局表示，根据当前气象资料分析，21日，粤西市县多云，局部有小雨，其余市县多云到晴，最低气温：粤北和珠三角偏北市县6℃至9℃，粤西沿海市县14℃至18℃，其余市县9℃至13℃。22日，粤西和珠三角西部市县多云到阴天，有分散小雨，其余市县多云，局部有小雨，最低气温：粤北市县8℃至11℃，粤西沿海市县16℃至19℃，其余市县11℃至14℃。\n\n　　气象专家提醒，近期广东气温下降，海面风力较大，要注意海上交通和作业安全。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c21a2d1f5f2","title":"武汉火车站综合环境改造加速推进 避免堵在高架赶高铁","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734798.shtml","summary":"中新网武汉11月19日电 (段萌萌 张煦甜)武汉火车站拓宽工程西站台拼宽施工19日顺利完成首个钢箱梁节段的吊装…","summary_short":"中新网武汉11月19日电 (段萌萌 张煦甜)武汉火车站拓宽工程西站台拼宽施工19日顺利完成首个钢箱梁节段的吊装…","digest":"武汉火车站拓宽工程西站台拼宽施工19日顺利完成首个钢箱梁节段的吊装…","points":["中新网武汉11月19日电 (段萌萌 张煦甜)武汉火车站拓宽工程西站台拼宽施工19日顺利完成首…","武汉火车站地处该市三环附近的杨春湖畔，工程于2006年9月开工…","为此，武汉市今年10月起启动该高铁站综合环境提升工程，旨在优化进出站体系和停车运营机制…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T18:41:18+08:00","size":1,"keywords":[],"body":"中新网武汉11月19日电 (段萌萌 张煦甜)武汉火车站拓宽工程西站台拼宽施工19日顺利完成首个钢箱梁节段的吊装，标志着这座中国首批建设高速铁路特大型站房工程之一的京广高铁重要车站综合改造项目迎来重要进展，项目建成后将避免送站“堵在高架赶高铁”现象。\n\n图为武汉火车站拓宽工程西站台拼宽施工顺利完成首个钢箱梁节段吊装。　中铁重工供图\n\n　　武汉火车站地处该市三环附近的杨春湖畔，工程于2006年9月开工，2009年12月26日随京广高速铁路武汉至广州段开通投入运营，2011年获中国土木工程詹天佑奖。该站既是武广段的始发站，也是中国首批建设的高速铁路特大型站房工程之一，车站总建筑面积超33万平方米，设客车到发线20条、站台11座，年旅客发送容量3100万人次。\n\n　　近年来，随着中国高铁网络不断完善、旅客出行方式转变等因素影响，原先设计日均客流仅为10万人次的武汉火车站，如今高峰期单日到发旅客已逼近40万人次，车站相关设施长期超负荷运转。为此，武汉市今年10月起启动该高铁站综合环境提升工程，旨在优化进出站体系和停车运营机制，实现扩容提质增效，增强旅客出行体验，全部项目计划明年“五一”前完工。\n\n　　其中，作为本次武汉火车站综合环境提升工程重点内容之一，就是要将东、西广场高架平台(落客区)从现在的16米拓宽至24米，由四车道升级为六车道，实现落客车辆与通行车辆各行其道，有效缓解高峰期“堵在高架赶高铁”的拥堵现状。项目由武汉桥建集团有限公司担任业主，武汉誉诚青山市政工程有限公司组织建设，中铁重工承担钢箱梁制造与现场安装任务。\n\n武汉火车站拓宽工程西站台拼宽施工首个钢箱梁节段吊装现场。中铁重工供图\n\n　　据担负本次施工任务的中铁重工华中区域运营总部总经理陈伟介绍，本次吊装的西站台钢箱梁为1联5跨全焊接结构，梁宽7.9米，总重约1795吨，属于涉及多项超过一定规模的危险性较大的分部分项工程。施工区域紧邻武汉地铁4号线，地下地铁持续运行，施工全过程实时监测，严控结构扰动；片区多条220千伏高压线迁改同步推进，周边道路高峰车流大，叠加春运保通的刚性节点要求，不具备大面积封路施工条件，是一项工况复杂、风险突出、管控难度极高的枢纽改造工程。\n\n　　面对工期紧、任务重等难题，为最大限度降低施工对地铁运营结构的扰动，项目部组织专家进行广泛论证，创新采用砂浆找平、路基箱铺底的配套支架体系，工字钢与路基箱形成整体受力结构，均匀扩散支架荷载，将保护区地面承载力稳定控制在安全限值内；自主设计组装组合式提升支架，集成贝雷梁、型钢、滑靴、千斤顶等构件，一套体系可同步实现钢箱梁提升、姿态调节、偏差纠偏，在狭小间隙内完成大节段钢箱梁精准就位。这套大节段提升工法，把原先单断面顺序施工优化为三个断面同步作业，大幅压缩施工工期，计划2026年年底前完成钢箱梁节段安装。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfc5757a334","title":"甘肃省临夏回族自治州成立70周年庆祝大会举行","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075486.shtml","summary":"11月19日上午，甘肃省临夏回族自治州成立70周年庆祝大会暨群众文艺演出在临夏市举行。","summary_short":"11月19日上午，甘肃省临夏回族自治州成立70周年庆祝大会暨群众文艺演出在临夏市举行。","digest":"11月19日上午，甘肃省临夏回族自治州成立70周年庆祝大会暨群众文艺演出在临夏市举行","points":["庆祝活动以“感恩奋进七十载·花儿临夏展新颜”为主题，当日的群众性文艺演出中，河州花儿、砖雕…","临夏州是全国两个回族自治州和甘肃省两个少数民族自治州之一，42个民族在此繁衍生息、和睦共居","当日还举行了临夏回族自治州成立70周年主题成就展…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T18:37:06+08:00","size":1,"keywords":[],"body":"11月19日上午，甘肃省临夏回族自治州成立70周年庆祝大会暨群众文艺演出在临夏市举行。庆祝活动以“感恩奋进七十载·花儿临夏展新颜”为主题，当日的群众性文艺演出中，河州花儿、砖雕、东乡刺绣、保安腰刀等非遗元素集中亮相，千人方阵、多民族演员同台演绎团结奋进风貌。\n\n临夏州是全国两个回族自治州和甘肃省两个少数民族自治州之一，42个民族在此繁衍生息、和睦共居。东乡族和保安族是以临夏为主要聚居区的甘肃特有少数民族。\n\n当日还举行了临夏回族自治州成立70周年主题成就展，展览共分为“亲切关怀”“石榴花开”“脱贫攻坚”等十个单元，从交通网络蝶变到产业格局重塑，从教育发展丰硕成果到民生医疗兜底保障……张张生动影像，展现了临夏70年来的发展成果。(高莹 马昱炅 张岩俊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/085771D8F77C4F619635647EF14CA6FA.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c1f8d63f3b8","title":"浙江景宁综合高中试点观察：一所山区县中的“第二次选择”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734777.shtml","summary":"中新网丽水11月19日电(林波)浙江省丽水市景宁畲族自治县综合高级中学高二学生钟林涛至今记得高一那堂数控实训体验课。","summary_short":"中新网丽水11月19日电(林波)浙江省丽水市景宁畲族自治县综合高级中学高二学生钟林涛至今记得高一那堂数控实训体验课。","digest":"浙江省丽水市景宁畲族自治县综合高级中学高二学生钟林涛至今记得高一那堂数控实训体验课","points":["中新网丽水11月19日电(林波)浙江省丽水市景宁畲族自治县综合高级中学高二学生钟林涛至今记得…","老师让他上手操作，发现这个瘦瘦的男生动手能力“出乎意料地强”","那一刻，从小觉得自己“手比较巧”的钟林涛，第一次认真地把“数控”和“未来”连在了一起"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T18:22:33+08:00","size":1,"keywords":[],"body":"中新网丽水11月19日电(林波)浙江省丽水市景宁畲族自治县综合高级中学高二学生钟林涛至今记得高一那堂数控实训体验课。老师让他上手操作，发现这个瘦瘦的男生动手能力“出乎意料地强”。那一刻，从小觉得自己“手比较巧”的钟林涛，第一次认真地把“数控”和“未来”连在了一起。\n\n　　而在同校的高二学生朱海真走的是另一条路。高一刚进校时，学校同时开设普高课程和职高体验课，她试过数控机床、旅游服务等，“还是不太感兴趣”。普高课程难度不小，但她选择坚持，“学校有稳定的师资和平台支撑着我们向目标去努力”。\n\n　　一年前，这两个孩子都站在景宁中考的分岔口上——分数够不上县里的重点普高景宁中学。按过去的惯例，他们要么去读职高，要么去外面读民办高中。\n\n　　2025年秋天，他们多了一个选项：景宁畲族自治县综合高级中学。\n\n　　这所综合高中依托景宁畲族自治县职业高级中学(以下简称“景宁职高”)创办，是浙江首批综合高中试点之一。学生注册普高学籍，高一入学后统一学习普高基础课程；从第二学期起，学校提供政史地、数字媒体技术应用、数控技术应用、中餐烹饪等方向供学生选择，学生既可参加普通高考，也可参加职教高考。\n\n2025年9月，景宁畲族自治县综合高级中学揭牌现场。　(景宁畲族自治县教育局供图)\n\n　　2025年，该校首届招生3个班120人，纳入普通高中招生计划。彼时有400多名考生填报志愿。\n\n　　“以前没得选，现在要自己选。”景宁畲族自治县综合高级中学党支部书记、校长吴家亮这样概括变化。\n\n　　他坦言，创办综合高中的初衷很朴素：景宁普职招生比长期只有0.53比0.47，达不到丽水市0.6比0.4的要求；每年还有三四十个景宁孩子因为考不上景宁中学，被送到丽水民办高中，“老百姓有这个需求，我们得接住”。\n\n　　接住的方式，是在不新建学校的前提下“创办”——综合高中与景宁职高实行“一套班子、两块牌子”，共享师资、实训基地和体艺设施。\n\n　　“避免了大投入的重复建设，减轻了地方财政负担。”吴家亮说。\n\n　　更关键的是“接住之后怎么办”。这所综合高中与景宁中学签订教共体合作协议，联合教研、联合备课、联合教学评价，学生参加丽水市普通高中质量监控考试。教师队伍采取“招一点、转一点”，校内选调有普高教学履历的高三把关教师转岗任教。\n\n　　针对职称评聘这一教师最现实的顾虑，学校实行“老人老办法、新人新办法”：原讲师系列教师兼任综合高中课程，职称仍走讲师系列；综合高中编制招录的教师，参加普高系列评审。\n\n　　2025年首届高一的第一个学期下来，120名学生的选择逐渐清晰：29人选择政史地方向，走普通高考；近38人选数控技术应用，20余人选计算机数字媒体，10余人选中餐烹饪……\n\n　　“1/4继续读普高课程，绝大部分还是走了职教通道。”吴家亮并不回避这个结果，“适合普高学业的学生本来就不多，但综合高中的价值在于，选择是学生自己做的，不是一次考试替他做的。”\n\n近日，景宁畲族自治县综合高级中学校园一景。　林波 摄\n\n　　这种“自己做选择”的缓冲，对山区家庭的意义尤为具体。过去考不上景宁中学的孩子去丽水民办高中，学费较高；综合高中一年学费2400元。吴家亮算过这笔账：“对山区家长来说，这不是小数目”。\n\n　　制度设计上也留出了回旋空间。学校经教育部门同意出台调剂、转学制度：经市、县教育局备案，中考成绩达到录取分数线的学生可申请转入。综合高中试点的第一学期结束后，该校有2人转入，其中1人来自该县重点高中，1人来自外县普通高中。\n\n　　“有进有出，说明这条路是通的。”吴家亮说。\n\n　　景宁畲族自治县教育局党组副书记、副局长金益华表示，在景宁，老百姓“想上普高”的需求是真实的，综合高中用职校的底子接住这部分需求，既“扩”普高学位，又不关掉职教出口，“是眼下最务实的解法”。\n\n浙江景宁一景。(资料图，景宁县委宣传部供图)\n\n　　在金益华看来，均衡教育不只是把资源摊平，更是让山区的孩子多一条走得通的路，“哪怕他中途改主意，门还开着”。\n\n　　当然，试点并非没有难题。譬如，师资方面缺乏既能上好课、又能管好班级的年轻优质教师，课程的专业覆盖面也有限。\n\n　　吴家亮说得很直白：“综合高中对学校是机遇，更是一场挑战。”\n\n　　但对钟林涛来说，挑战已经有了具体的形状。他选了数控方向，尽管对专业“还不是很了解”，但老师教学时的自信让他“在班级里感觉十分自信”。朱海真还在普高方向上坚持，难度不小，但她说学校有平台“支撑着我们向目标去努力”。\n\n　　2026年，景宁综合高中招生140名，实行小班化教学。120个学位也好，140个学位也罢，放在浙江全省37所试点校的盘子里都不算大数目。但对景宁这个山区县来说，它改变的是一个默认规则：十五岁那年的一次考试结果，不必再决定一个人全部的方向。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5d870fe25a","title":"【深圳APEC】智利总统现身深圳水果店 见证车厘子新产季正式在华开启","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-19/news1075484.shtml","summary":"智利总统何塞·安东尼奥·卡斯特从人形机器人手中接过一盒新鲜车厘子，和身旁嘉宾一同合影留念。","summary_short":"智利总统何塞·安东尼奥·卡斯特从人形机器人手中接过一盒新鲜车厘子，和身旁嘉宾一同合影留念。","digest":"智利总统何塞·安东尼奥·卡斯特从人形机器人手中接过一盒新鲜车厘子…","points":["智利总统何塞·安东尼奥·卡斯特从人形机器人手中接过一盒新鲜车厘子，和身旁嘉宾一同合影留念","11月18日，记者在深圳一家街边水果店内见证了这幕画面","当天，卡斯特到访这家水果门店，是为了见证智利车厘子新产季在中国开启"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":" 向基金管理人提出相关数据报送要求"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T18:14:25+08:00","size":1,"keywords":[],"body":"辟 谣 “监管要求基金公司上报全部产品AI敞口”不实\n\n　　详情：11月18日，中国证监会新闻发言人就互联网上传播“监管要求基金公司上报全部产品AI敞口”相关信息答记者问。证监会新闻发言人称，上述信息不属实。公募基金投资运作依照《证券投资基金法》等法律法规和基金合同约定进行，投资标的、投资比例由基金管理人按照基金合同和内部投资决策程序自主确定。中国证监会依法履行监管职责，未向基金管理人提出相关数据报送要求。(来源：“证监会发布”微信公众号)\n\n　　科 普 广西平陆运河废土如何变良田？\n\n　　详情：广西平陆运河企石枢纽开挖产生2400万立方米土石方，体量相当于9座埃及胡夫金字塔。这么多土石方如果采用传统堆放方式，将占用大量土地。面对难题，项目组采用土石方“抬田造地”的思路，对弃土进行利用。首先在枢纽附近低洼地带铺设阻断污染的隔离层，中层以土石方分层压实，表层覆盖肥沃耕作层；同时配套建设生态田埂、导流沟渠和生态拦截带等，实现保水保肥和污染防范。经改造形成的地块，作物成活率达95%以上，肥力和原生良田基本相当。\n\n　　这套模式既化解弃土处置压力，又为当地新增耕地，实现了土石方100%资源化利用，生态效益与民生效益得到双提升。(来源：“中交求真”微信公众号)\n\n　　通 报 沈阳约谈散布涉中考改革不实信息的自媒体账号\n\n　　详情：2026年11月上旬，网上多个自媒体账号以“2027年沈阳中考英语听力及口语考试改革”为话题发布视频、图文内容，宣称相关政策已确定或即将实施，引发舆论关注。11月15日，沈阳市教育局发布辟谣声明，明确网传“2027年沈阳中考英语听力及口语考试改革”为不实信息，提醒广大师生、家长不信谣、不传谣。\n\n　　上述账号在无政策依据的前提下编造、传播涉中考政策不实信息，人为制造升学焦虑，误导学生和家长备考规划。近日，网信、教育、公安部门依法对“沈阳升学**”“懂英语**”等11个账号运营人进行约谈，通报官方辟谣内容，宣讲自媒体管理相关规定，责令其删除不实信息并停止发布未经核实的招生考试政策类内容。目前，11名账号运营人均已主动下架违规内容，并承诺今后加强信息来源审核，不再传播不实信息。网上谣言信息均已处置。(来源：“指尖新闻沈阳晚报”微信公众号)\n\n　　通 报 安徽铜陵公安机关向社会公布两起网络谣言典型案例\n\n　　详情：为有效净化网络环境，维护正常网络秩序和社会公共秩序，近日，安徽省铜陵市公安局义安分局向社会通报两起涉网络谣言典型案例。\n\n　　案例一：查某某编造发布网络谣言。近日，查某某在未经核实素材来源的情况下，在网络社交平台发布涉某地出现外来物种的不实言论。该虚假信息引发大量网民关注，造成不良社会影响。\n\n　　案例二：刘某某编造发布网络谣言。近日，刘某某为吸引客源，提高店铺知名度，在网络社交平台发布服装店虚假信息。该虚假信息引发大量网民关注，造成不良社会影响。\n\n　　目前，相关涉案人员均已被公安机关依法给予行政处罚。(来源：“安徽网络举报”微信公众号)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf8bdae012a","title":"【深圳APEC】现场直击APEC领导人非正式会议","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075485.shtml","summary":"11月19日，中新社记者在香蜜湖畔的深圳国际交流中心现场直击APEC第三十三次领导人非正式会议。","summary_short":"11月19日，中新社记者在香蜜湖畔的深圳国际交流中心现场直击APEC第三十三次领导人非正式会议。","digest":"【深圳APEC】现场直击APEC领导人非正式会议","points":["11月19日，中新社记者在香蜜湖畔的深圳国际交流中心现场直击APEC第三十三次领导人非正式会…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T18:29:35+08:0
