<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

议的马来西亚总理安瓦尔。\n\n　　习近平指出，去年4月，我同安瓦尔总理就构建高水平战略性中马命运共同体达成重要共识，开启中马关系新的“黄金50年”。一年多来，中马关系持续高水平发展，双方擘画的合作蓝图日益变成美好现实。面对变乱交织的世界，中方愿同马方秉持建交初心，汇聚合作动能，推动中马命运共同体建设走深走实，为两国人民带来更多福祉。\n\n　　习近平强调，中马关系政治根基牢固，合作优势突出，发展前景广阔。双方要深化高水平战略协作，保持高层战略沟通，相互支持彼此维护国家主权、安全、发展利益；要加强发展战略对接，挖掘新兴合作潜力，高质量建设和运营好重点项目，做大做优农产品贸易；要引领文明交流互鉴，再接再厉办好中马“儒伊文明对话”，扩大旅游、教育等合作，进一步密切民间和地方交流；要协同推进全球治理改革，加强在亚太经合组织等多边框架内协调和配合，携手践行真正的多边主义，维护广大发展中国家共同利益。\n\n　　安瓦尔表示，在习近平主席英明领导下，中国取得非凡发展成就。衷心祝贺中国成功举办亚太经合组织领导人非正式会议和中俄美三国元首会晤，这充分彰显习近平主席在国际事务中的卓越影响力和领导力，中俄美三国元首发表《和平宣言》，在当前国际形势下具有重大战略意义。台湾问题是中国内政，马方坚定恪守一个中国政策。马方愿同中方加强战略协作，发挥好两国合作机制作用，运营好基础设施建设重点项目，加强人工智能等新兴领域合作，促进文明交流对话，加强在国际事务中的协调和配合，不断提升马中关系水平。\n\n　　蔡奇、王毅、黄坤明、王小洪等参加会见。(完) 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平会见马来西亚总理安瓦尔","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735268.shtml","source_display":"中新網 時政","published_at":"2026-11-20T16:20:45+08:00","category":"內地","digest":"11月20日中午…"},{"title":"（深圳APEC）习近平会见泰国总理阿努廷","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735278.shtml","source_display":"中新網 時政","published_at":"2026-11-20T16:19:59+08:00","category":"內地","digest":"11月20日上午…"},{"title":"新华图讯丨习近平会见马来西亚总理安瓦尔","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735207.shtml","source_display":"中新網 時政","published_at":"2026-11-20T14:24:47+08:00","category":"內地","digest":"11月20日，国家主席习近平在深圳会见马来西亚总理安瓦尔"},{"title":"新华图讯丨习近平会见泰国总理阿努廷","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735198.shtml","source_display":"中新網 時政","published_at":"2026-11-20T14:24:35+08:00","category":"內地","digest":"11月20日，国家主席习近平在深圳会见泰国总理阿努廷"},{"title":"（深圳APEC）习近平会见澳大利亚总理阿尔巴尼斯","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735166.shtml","source_display":"中新網 時政","published_at":"2026-11-20T13:54:35+08:00","category":"內地","digest":"11月20日上午…"},{"title":"（深圳APEC）习近平会见印度尼西亚总统普拉博沃","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735167.shtml","source_display":"中新網 時政","published_at":"2026-11-20T13:51:11+08:00","category":"內地","dig 度尼西亚总统普拉博沃","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735055.shtml","source_display":"中新網 時政","published_at":"2026-11-20T09:41:22+08:00","category":"內地","digest":"新华社快讯：11月20日，国家主席习近平在深圳会见印度尼西亚总统普拉博沃"}],"cross":{"total":16,"angles":[{"point":"11月20日中午…","sources":["中新網 時政","中新網 時政","中新網 時政","中新網 時政","中新網 時政","中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-20/10735268.shtml"},{"point":"11月20日，国家主席习近平在深圳会见马来西亚总理安瓦尔","sources":["中新網 時政","中新網 時政","中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-20/10735207.shtml"},{"point":"11月20日，国家主席习近平在深圳会见新加坡总理黄循财","sources":["中新網 時政","中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-20/10735160.shtml"},{"point":"11月20日，国家主席习近平在深圳会见澳大利亚总理阿尔巴尼斯","sources":["中新網 時政","中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-20/10735165.shtml"}]}},{"id":"cc1bffff12b","title":"APEC｜習近平就中澳關係提四點意見 黃循財稱願與中方增強政治互信","url":"https://news.tvb.com/tc/1207449-APEC習近平就中澳關係提四點意見黃循財稱願與中方增強政治互信","summary":"深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日，國家主席習近平跟多位與會的國家領導人分別舉行雙邊會晤。習近平上午在麒麟山莊會見澳洲總理阿爾巴內塞。","summary_short":"深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日，國家主席習近平跟多位與會的國家領導人分別舉行雙邊會晤。","digest":"深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日…","points":["深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日…","習近平上午在麒麟山莊會見澳洲總理阿爾巴內塞","國家主席習近平說：「2022年你就任總理以來，我們四次會晤，應該說我們共同推動…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T16:23+08:00","size":3,"keywords":[],"body":"深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日，國家主席習近平跟多位與會的國家領導人分別舉行雙邊會晤。\n\n習近平上午在麒麟山莊會見澳洲總理阿爾巴內塞。習近平表示，目前中澳關係穩定發展，兩國既沒有歷史恩怨，亦沒有根本利益衝突，理應成為相互信任、彼此成就的合作夥伴。\n\n他又就中澳關係提出四點意見，包括增進彼此互信、深化互利合作，將2027年設為「中澳旅遊年」等。\n\n國家主席習近平說：「2022年你就任總理以來，我們四次會晤，應該說我們共同推動，中澳關係的全面轉緩，兩國各領域的交流合作，是持續深化的。」\n\n阿爾巴內塞表示，澳中關係改善發展符合雙方利益，為兩國人民帶來實實在在的福祉，又以在中國超市見到的情況做例子。\n\n澳洲總理阿爾巴內塞說：「我們同樣重視開放，且以規則為基礎的貿易，我在這裡的一家超市，看到貨架上有澳洲商品，種類超過200種，這樣的關係為我們兩國都帶來了繁榮。」\n\n中新要做引領創新發展夥伴\n\n習近平與新加坡總理黃循財會面時，提到中新要做引領創新的發展夥伴。\n\n習近平表示：「作為友好近鄰和重要發展夥伴，中新雙方要把握時代潮流，加上戰略溝通，增進團結協作，推動中新全方位高質量的前瞻性夥伴關係，不斷地能夠邁上新台階。」\n\n黃循財則表示，願同中方增強政治互信，又表明堅定奉行一個中國政策，反對「台獨」。\n\n黃循財說：「我們兩國享有長久的友誼，與密切的夥伴關係，我們期盼在此基礎上，進一步深化雙方的經濟連結。」\n\n再接連會見泰印馬領導人\n\n習近平亦會見了泰國總理阿努廷，提到雙方要加大打擊網賭電詐等違法犯罪活動，為兩國人員往來營造更加安全的環境。習近平與印尼總統普拉博沃會面時，共同宣布啟動兩國全面經濟夥伴關係協定談判。\n\n另外，習近平亦會見了馬來西亞首相安華。","image":"https://pro-vod-cdn.tvb.com/5d164d139d9242bea3f275b9fe5d105f/snapshots/cfdeacc5b82d490a91bd3a327bdd7f2a-00008.jpg","video":"https://pro-vod-cdn.tvb.com/5d164d139d9242bea3f275b9fe5d105f/e874857d9eab4a9fb8ff44c5d3c80d91-ba9eedb0ff7732b5c05176308d1e0cb4-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/5d164d139d9242bea3f275b9fe5d105f/snapshots/cfdeacc5b82d490a91bd3a327bdd7f2a-00008.jpg","lang":"zh-Hant","items":[{"title":"APEC｜習近平就中澳關係提四點意見 黃循財稱願與中方增強政治互信","url":"https://news.tvb.com/tc/1207449-APEC習近平就中澳關係提四點意見黃循財稱願與中方增強政治互信","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T16:23+08:00","category":"兩岸","digest":"深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日…"},{"title":"APEC｜習近平深圳會見多國領導人 就中澳關係提出四點意見","url":"https://news.tvb.com/tc/1207418-APEC習近平深圳會見多國領導人就中澳關係提出四點意見","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T13:02+08:00","category":"兩岸","digest":"國家主席習近平在深圳會見多國領導人"},{"title":"APEC｜深圳歡迎晚宴花絮 習近平特朗普同桌欣賞《YMCA》表演｜有片","url":"https://news.tvb.com/tc/1207395-APEC深圳歡迎晚宴花絮習近平特朗普同桌欣賞YMCA表演有片","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T11:00+08:00","category":"兩岸","digest":"國家主席習近平與美國總統特朗普在深圳出席亞太經合組織(APEC)峰會期間…"}],"cross":{"total":3,"angles":[{"point":"國家主席習近平在深圳會見多國領導人","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207418-APEC習近平深圳會見多國領導人就中澳關係提出四點意見"},{"point":"深圳舉辦的亞太經合組織APEC領導人非正式會議結束後一日…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207449-APEC習近平就中澳關係提四點意見黃循財稱願與中方增強政治互信"},{"point":"國家主席習近平與美國總統特朗普在深圳出席亞太經合組織(APEC)峰會期間…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207395-APEC深圳歡迎晚宴花絮習近平特朗普同桌欣賞YMCA表演有片"}]}},{"id":"cb72bae80d5","title":"宏福苑大火一周年｜陳國基：不會阻止合法悼念活動 相關部門願意提供協助 籲勿被他人利用作出破壞行為","url":"https://www.stheadline.com/society/3639341/宏福苑大火一周年陳國基不會阻止合法悼念活動-相關部門願意提供協助-籲勿被他人利用作出破壞行為","summary":"政務司司長陳國基今日(20日)在出席一個活動後表示，特區政府絕對容許並不會阻撓任何合法的悼念活動，相關部門更會在有需要時提供協助。","summary_short":"政務司司長陳國基今日(20日)在出席一個活動後表示，特區政府絕對容許並不會阻撓任何合法的悼念活動…","digest":"政務司司長陳國基今日(20日)在出席一個活動後表示…","points":["政務司司長陳國基今日(20日)在出席一個活動後表示…","政府並將落實調查委員會的120項建議及推動防止大廈「圍標」的制度改革，防止悲劇重演","不論是市民或災民，政府絕不會妨礙或阻止其悼念，甚至在有需要時…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:17:31+08:00","size":2,"keywords":[],"body":"政務司司長陳國基今日(20日)在出席一個活動後表示，特區政府絕對容許並不會阻撓任何合法的悼念活動，相關部門更會在有需要時提供協助。同時，政府並將落實調查委員會的120項建議及推動防止大廈「圍標」的制度改革，防止悲劇重演。\n絕不阻撓合法悼念 防範別有用心者借機破壞\n陳國基指出，只要是合法的悼念活動，政府均絕對容許。不論是市民或災民，政府絕不會妨礙或阻止其悼念，甚至在有需要時，相關政府部門會向希望進行悼念的市民提供協助。他提到，目前已知有不少團體（包括宗教團體）計劃舉辦悼念活動，政府樂意配合，並認為市民與災民參與此類活動。\n然而，陳國基提醒市民，政府注意到網上出現個別別有用心的人士，企圖利用悼念活動進行破壞。他呼籲市民在參與活動時必須謹慎選擇，切勿被他人利用而做出破壞社會秩序或危害他人人身安全的行為，並強調警方對任何違法行為定必依法處理。政府希望做到最好，讓市民和災民能在安心、順利的環境下進行悼念。\n行政長官親自部署 絕大部分災民已完成房屋交易\n在災民安置方面，陳國基透露，在行政長官的親自帶領下，整個政府正全力協助受火災影響的市民重建家園。目前，絕大部分受災市民的房屋已完成買賣，災民盡快租賃或購買合適的居所，期望他們能盡快重過新生。\n統籌跨部門落實120項改革 \n陳國基強調，宏福苑火災獨立委員會提出的120項改善建議，陳國基表示他已親自審閱並召開跨部門會議，現正統籌各局及各部門，盡力、盡快落實相關措施。他亦鼓勵公務員團隊提出比原建議更佳的創新方案，務求將未來的火警風險減至最低。\n相關新聞：\n大棋盤｜宏福業主上樓「求快」 務實考量主導","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"宏福苑大火一周年｜陳國基：不會阻止合法悼念活動 相關部門願意提供協助 籲勿被他人利用作出破壞行為","url":"https://www.stheadline.com/society/3639341/宏福苑大火一周年陳國基不會阻止合法悼念活動-相關部門願意提供協助-籲勿被他人利用作出破壞行為","source_display":"星島頭條","published_at":"2026-11-20T17:17:31+08:00","category":"港聞","digest":"政務司司長陳國基今日(20日)在出席一個活動後表示…"},{"title":"宏福苑大火一周年‧現場｜陳國基：政府不會妨礙或阻止悼念 提醒要慎選","url":"https://news.tvb.com/tc/1207457-宏福苑大火一周年現場陳國基政府不會妨礙或阻止悼念提醒要慎選","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T17:04+08:00","category":"港聞","digest":"宏福苑大火近一周年，政務司司長陳國基表示，政府不會妨礙或阻止市民悼念…"}],"cross":{"total":2,"angles":[{"point":"政務司司長陳國基今日(20日)在出席一個活動後表示…","sources":["星島頭條"],"url":"https://www.stheadline.com/society/3639341/宏福苑大火一周年陳國基不會阻止合法悼念活動-相關部門願意提供協助-籲勿被他人利用作出破壞行為"},{"point":"宏福苑大火近一周年，政務司司長陳國基表示，政府不會妨礙或阻止市民悼念…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207457-宏福苑大火一周年現場陳國基政府不會妨礙或阻止悼念提醒要慎選"}]}},{"id":"cc9afc6d176","title":"小一入學自行分配學位結果下周一公布 近五成七人獲派位","url":"https://news.tvb.com/tc/1207438-小一入學自行分配學位結果下周一公布近五成七人獲派位","summary":"小一入學自行分配學位結果下周一公布。教育局指，今年有32,104名兒童申請公營小學自行分配學位。","summary_short":"小一入學自行分配學位結果下周一公布。","digest":"小一入學自行分配學位結果下周一公布","points":["教育局指，今年有32,104名兒童申請公營小學自行分配學位","當中近五成七，即18,148人獲派位，其中約四成五屬「世襲生」，其餘五成半按積分辦法準則分配","教育局提醒，家長下周一上午10時起，可透過電子平台或前往所申請小學查閲結果…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:29:00+08:00","size":2,"keywords":["小一自行分配學位"],"body":"小一入學自行分配學位結果下周一公布。\n\n教育局指，今年有32,104名兒童申請公營小學自行分配學位。當中近五成七，即18,148人獲派位，其中約四成五屬「世襲生」，其餘五成半按積分辦法準則分配。\n\n教育局提醒，家長下周一上午10時起，可透過電子平台或前往所申請小學查閲結果，並須在下周三或四，到申請小學為子女辦理註冊手續。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026iPa0tqrbKT1795161215.jpg?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"小一入學自行分配學位結果下周一公布 近五成七人獲派位","url":"https://news.tvb.com/tc/1207438-小一入學自行分配學位結果下周一公布近五成七人獲派位","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:29:00+08:00","category":"港聞","digest":"小一入學自行分配學位結果下周一公布"},{"title":"小一入學自行分配學位結果十一月二十三日公布","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000269.htm","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:30:00+08:00","category":"","digest":"全港官立及資助小學將於下星期一公布有關二○二七年九月入讀小一的學校自行分配學位錄取名…"}],"cross":{"total":2,"angles":[{"point":"小一入學自行分配學位結果下周一公布","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207438-小一入學自行分配學位結果下周一公布近五成七人獲派位"},{"point":"全港官立及資助小學將於下星期一公布有關二○二七年九月入讀小一的學校自行分配學位錄取名…","sources":["香港政府新闻公报"],"url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000269.htm"}]}},{"id":"c978e103430","title":"蔡天鳳碎屍案｜鄺港智指無接觸過懷疑兇器圓頭鎚 否認計劃襲擊","url":"https://news.tvb.com/tc/1207430-蔡天鳳碎屍案鄺港智指無接觸過懷疑兇器圓頭鎚否認計劃襲擊","summary":"大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智繼續作供。他指無接觸過懷疑是兇器的圓頭鎚，又指案發當日，父親鄺球在車上，單獨同蔡天鳳見面，其後就發現蔡天鳳頭部有血，倒臥車上。","summary_short":"大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智繼續作供。","digest":"大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智繼續作供","points":["大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智繼續作供","他指無接觸過懷疑是兇器的圓頭鎚，又指案發當日，父親鄺球在車上，單獨同蔡天鳳見面…","三名被告，蔡天鳳前夫鄺港智、前家翁鄺球，前大伯鄺港傑，由囚車押送到高等法院應訊…"],"section":"港聞","category":"法庭","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:21+08:00","size":2,"keywords":[],"body":"大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智繼續作供。他指無接觸過懷疑是兇器的圓頭鎚，又指案發當日，父親鄺球在車上，單獨同蔡天鳳見面，其後就發現蔡天鳳頭部有血，倒臥車上。\n\n三名被告，蔡天鳳前夫鄺港智、前家翁鄺球，前大伯鄺港傑，由囚車押送到高等法院應訊，三人否認謀殺罪。審訊踏入第42日，鄺港智繼續在代表律師，安華暉引導下作供。\n\n問他是否曾到過龍尾村單位，他指案發前約一個多星期，曾在兄長鄺港傑的建議下前往單位，當時未有見到湯煲、菜刀等涉案物品。\n\n至於案發現場檢獲，懷疑為兇器的圓頭鎚，早前經化驗及分析後，發現與鄺港智的DNA吻合。鄺港智表示未曾觸碰過該圓頭鎚，不知是否曾放在涉案七人車上，亦不知該圓頭鎚，是否與蔡天鳳死亡有關。\n\n而案發當日閉路電視拍攝到，鄺港智登上載有蔡天鳳的七人車由鄺港傑駕駛，蔡天鳳坐在司機位後，自己則坐在蔡天鳳左邊。\n\n安華暉指出蔡天鳳在車上發出最後訊息，是因為其後遭到鄺港智襲擊。他不同意，稱蔡天鳳在車上一直與他對話，期間曾提及母親張燕花欠債，她需要還利息並感到壓力大。\n\n鄺港智稱，蔡天鳳還提到不滿鄺球在同年農曆新年期間，曾與兩名孫兒見面，認為不能再讓鄺球與兩名孫兒見面，要求正在駕駛的鄺港傑轉去找鄺球當面對質，及找前家姑李瑞香去接其子女。期間還曾斥責鄺球養情婦是「臨老入花叢」。\n\n鄺港智指車駛至大美督停車場時，蔡天鳳仍然在生。同時鄺球駕駛的七人車亦到達停車場。其後兩兄弟下車吸煙，折返後就見到鄺球，坐在蔡天鳳左邊位置，蔡天鳳頭部有血、倒臥地上。\n\n鄺港智指，鄺球開車走，說要先回龍尾村單位再處理，他就登上蔡天鳳在內的七人車，期間有動蔡天鳳的手、呼喊她，檢查心跳和呼吸，發現她沒有反應。\n\n駛至龍尾村後，鄺港智指曾提出報警和叫救護車，但遭鄺球反對，他再度檢查蔡天鳳心跳和呼吸仍然沒有反應，並稱自己從來沒有計劃過上述的襲擊。","image":"https://pro-vod-cdn.tvb.com/16649ebce68241e88f4d5ed3967ba283/snapshots/3c197eb5b0384c8abc6c2f8b396dafe8-00008.jpg","video":"https://pro-vod-cdn.tvb.com/16649ebce68241e88f4d5ed3967ba283/b8729dd761e24d82bd9af8808d06cb84-82540238f44469d520d4180524edcd97-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/16649ebce68241e88f4d5ed3967ba283/snapshots/3c197eb5b0384c8abc6c2f8b396dafe8-00008.jpg","lang":"zh-Hant","items":[{"title":"蔡天鳳碎屍案｜鄺港智指無接觸過懷疑兇器圓頭鎚 否認計劃襲擊","url":"https://news.tvb.com/tc/1207430-蔡天鳳碎屍案鄺港智指無接觸過懷疑兇器圓頭鎚否認計劃襲擊","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:21+08:00","category":"法庭","digest":"大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智繼續作供"},{"title":"蔡天鳳碎屍案｜鄺港智稱兩兄弟大美督下車後父親上車 折返後目睹蔡頭上有血","url":"https://news.tvb.com/tc/1207404-蔡天鳳碎屍案鄺港智稱兩兄弟大美督下車後父親上車折返後目睹蔡頭上有血","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T12:07:00+08:00","category":"法庭","digest":"[12:07更新]鄺港智供稱兩兄弟在大美督下車 ，深圳APEC会议记者会现场来了“亿点点”人，外国记者用大疆拍拍拍不停","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/cns-d/2026/11-20/news1075537.shtml"}]}}],"sections":[{"name":"港聞","total":15,"items":[{"id":"c0a0d7876d3","title":"財委會通過2億元北都城鄉共融基金 議員關注與現有基金重疊及資助範圍","url":"https://www.stheadline.com/politics/3639349/財委會通過2億元北都城鄉共融基金-議員關注與現有基金重疊及資助範圍","summary":"政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過。","summary_short":"政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過。","digest":"政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過","points":["政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過","民建聯陳克勤表示，新成立的北都城鄉共融基金，與鄉郊保育資助計劃…","他亦稱，若鄉民申請這個基金時需要顧問寫報告，開支昂貴，當局有何方法忙"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:32:19+08:00","size":1,"keywords":[],"body":"政府向立法會財委會申請2億元，成立北都城鄉共融基金，終獲在席議員大比數支持通過。\n民建聯陳克勤表示，新成立的北都城鄉共融基金，與鄉郊保育資助計劃、歷史建築維修資助計劃有類似作用，關注當局如何確保新基金與另外兩個基金不會有重疊的情況，亦關注鄉民或只想保育一些物品而非一幢樓時，當局會否保育這些文物。他亦稱，若鄉民申請這個基金時需要顧問寫報告，開支昂貴，當局有何方法忙。\n基金無限制保護個別文物\n發展局常任秘書長（規劃及地政）何珮玲表示，鄉郊保育資助計劃涵蓋的北都村落已在新基金範圍內剔除，亦會與歷史建築維修資助計劃有協調，確保基金不會有重疊。至於鄉民寫建議書，她鼓勵鄉民可以與大專院校合作，當局亦有專責團隊，可提供技術意見予申請人。對於保育個別文物，何珮玲表示，基金暫沒有限制，反而申請人要思考保育一件文物時，如何可達致城鄉共融的目標。\n資助上限1000萬元 劉業強關注營運開支比例\n金融界陳振英表示，近日有慈善機構以288萬元拍得大東山一個石屋作保育，相信若這項目放在北都已可申請新成立的基金，料最高可獲1,000萬元，希望當局澄清是否這1,000萬元不能用作拍賣，只能於裝修、營運等方面的支出，而若申請人想做宣傳是否可申請第二類資助，第一、第二類能否同時申請。\n何珮玲表示，當局希望申請可利用1,000萬資助作復修私人設施，以及營運相關的設施，而要用一筆費用去購入一個地方，此筆費用則不包括在內。至於推廣費是否可納為第二類資助，她指不太希望申請人這樣做，始終基金2億元不算很多，希望可用有限資源幫到更多申請。\n鄉議局主席、經民聯劉業強表示，推動城鄉共融需要很多時間的耕耘和支持，希望政府可定期進行檢討，亦要考慮適當時候轉為恆常化或「加碼」，才能達到目標。他關注涉及改造私人土地，如村屋、祠堂等第一類的項目，資助上限是1,000萬元，當局有否規定營運開支不能超過某個百分比。\n何珮玲稱，當局暫時沒有考慮設立一個硬性的比例，但計劃希望申請人營運至少3年，故需向當局交代，申請的撥款足夠營運3年。\n記者：郭詠欣","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c440a19a97c","title":"深水埗運動場對開地盤現二戰英式迫擊砲彈 EOD檢走安全處理","url":"https://www.stheadline.com/breaking-news/3639316/深水埗運動場對開地盤現二戰英式迫擊砲彈-EOD檢走安全處理","summary":"今日（20日）下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈。","summary_short":"今日（20日）下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈。","digest":"下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈","points":["今日（20日）下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈","警方接報趕至，於上址發現一枚二戰時期英式迫擊砲彈，長約24厘米，直徑約5厘米","爆炸品處理課人員到場調查，發現該枚英式迫擊砲彈內沒有殘餘炸藥，其後將其銷毀，安全處理…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:22:23+08:00","size":1,"keywords":[],"body":"今日（20日）下午近1時，一名工人於深水埗運動場對開地盤進行工程期間發現兩枚懷疑炸彈。警方接報趕至，於上址發現一枚二戰時期英式迫擊砲彈，長約24厘米，直徑約5厘米。爆炸品處理課人員到場調查，發現該枚英式迫擊砲彈內沒有殘餘炸藥，其後將其銷毀，安全處理，事件中無人受傷。\n涉事的二戰時期英式迫擊砲彈，長約24厘米，直徑約5厘米。警方提供\n現場為深水埗運動場外地盤。\n爆炸品處理課到場調查。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd0dd211b3c","title":"警搜元朗寮屋及兩毒品儲存倉檢$1200萬冰毒 兩尼日利亞男被捕","url":"https://www.stheadline.com/breaking-news/3639339/警搜元朗寮屋及兩毒品儲存倉檢1200萬冰毒-兩尼日利亞男被捕","summary":"毒品調查科人員於今日（20日）清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒，總市值約1200萬元，並拘捕兩名分別為34歲及39歲、持行街紙的尼日利亞藉男子，涉嫌販運危險藥物。","summary_short":"毒品調查科人員於今日（20日）清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒，總市值約1200萬元…","digest":"毒品調查科人員於清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒…","points":["毒品調查科人員於今日（20日）清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒…","人員經深入調查及情報分析後，突擊搜查元朗八鄉下輋一個寮屋單位，制服屋內2名男子…","其後人員搜查兩個分別位於錦上路牛徑及天水圍錫降村的毒品儲存倉…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:14:18+08:00","size":1,"keywords":[],"body":"毒品調查科人員於今日（20日）清晨在元朗八鄉及天水圍展開反毒品行動，檢獲約27公斤懷疑冰毒，總市值約1200萬元，並拘捕兩名分別為34歲及39歲、持行街紙的尼日利亞藉男子，涉嫌販運危險藥物。\n\n人員經深入調查及情報分析後，突擊搜查元朗八鄉下輋一個寮屋單位，制服屋內2名男子，並在單位內檢獲1包重約1公斤的懷疑冰毒及毒品包裝工具。其後人員搜查兩個分別位於錦上路牛徑及天水圍錫降村的毒品儲存倉，在倉內合共檢獲約26公斤懷疑冰毒。\n行動中，警方共檢獲約27公斤懷疑冰毒，總市值約1200萬元，而兩名男子則涉嫌販運危險藥物被捕。警方相信該兩個儲存倉由兩名被捕男子掌控，他們將被暫控三項「販運危險藥物」罪，案件將於明日（21日）上午在沙田裁判法院提堂。\n人員檢獲約27公斤懷疑冰毒，總市值約1200萬元。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c54c2f4e33f","title":"本港10月通脹升至2.2% 差餉寬減結束推高升幅 基本通脹維持溫和","url":"https://www.stheadline.com/society/3639333/本港10月通脹升至22-差餉寬減結束推高升幅-基本通脹維持溫和","summary":"政府統計處公布，2026年10月份整體消費物價按年上升2.2%，較9月份的1.9%升幅有所擴大，主因是差餉寬減於9月份結束。","summary_short":"政府統計處公布，2026年10月份整體消費物價按年上升2.2%，較9月份的1.9%升幅有所擴大…","digest":"政府統計處公布，2026年10月份整體消費物價按年上升2.2%…","points":["政府統計處公布，2026年10月份整體消費物價按年上升2.2%…","剔除政府一次性紓困措施的影響，10月基本通脹率為2.0%，較9月份（2.1%）略低","政府發言人指出10月份通脹維持溫和，惟短期內國際燃料價格仍受地緣政治緊張局勢影響，須密切留意"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:07:47+08:00","size":1,"keywords":[],"body":"政府統計處公布，2026年10月份整體消費物價按年上升2.2%，較9月份的1.9%升幅有所擴大，主因是差餉寬減於9月份結束。剔除政府一次性紓困措施的影響，10月基本通脹率為2.0%，較9月份（2.1%）略低。政府發言人指出10月份通脹維持溫和，惟短期內國際燃料價格仍受地緣政治緊張局勢影響，須密切留意。\n\n經季節性調整的綜合消費物價指數，截至2026年10月止的三個月，綜合消費物價指數的平均每月升幅為0.3%，高於截至9月止三個月的0.2%升幅。而剔除政府一次性紓困措施影響後，相應的升幅為0.1%及0.2%。\n升幅最高的類別為電力、燃氣及水\n在各類綜合消費物價指數組成項目中，價格在2026年10月份錄得按年升幅的類別為電力、燃氣及水（上升12.7%）、雜項服務（上升5.0%）、交通（上升4.5%）、耐用物品（上升1.4%）、雜項物品（上升1.4%）、住屋（上升1.4%）、外出用膳及外賣（上升0.9%），以及衣履（上升0.5%）。\n另一方面，綜合消費物價指數在二零二六年十月份錄得按年跌幅的類別為基本食品（下跌0.8%），以及煙酒（下跌0.4%）。\n10月份消費物價通脹保持溫和\n政府發言人表示，10月份的消費物價通脹依然保持溫和。雖然燃料相關項目的價格繼續錄得顯著升幅，但對其他項目的價格波及有限，大部分其他項目的價格僅輕微上升或甚至下跌。展望將來，雖然早前國際油價上升的效應會持續傳導至本地消費層面的燃料相關項目，但其他方面的價格壓力應會大致受控，整體通脹將維持溫和。然而，地緣政治緊張局勢仍是短期內影響國際燃料價格的主要不確定因素，當局將會密切留意相關發展。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb2bb4e3941","title":"興達大廈疑「圍標」案 案中法團成員涉騷擾證人 官下令撤銷保釋","url":"https://www.stheadline.com/society/3639331/興達大廈疑圍標案-案中法團成員涉騷擾證人-官下令撤銷保釋","summary":"廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案，涉嫌透過行賄手段串謀法團主席和成員，安排關聯公司取得物業管理和工程顧問合約，圖以2,000萬元投得大廈大型維修項目。","summary_short":"廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案，涉嫌透過行賄手段串謀法團主席和成員…","digest":"廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案…","points":["廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案…","案件今於區域法院續審，控方指被告之一、時任法團成員粘清波涉騷擾控方證人…","莊、林、杜為中間人，張案發時任興達大廈法團主席，而粘為時任法團成員"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:05:58+08:00","size":1,"keywords":[],"body":"廉政公署2023年「火網」行動拘控23人，其中5人涉觀塘興達大廈「圍標」案，涉嫌透過行賄手段串謀法團主席和成員，安排關聯公司取得物業管理和工程顧問合約，圖以2,000萬元投得大廈大型維修項目。案件今於區域法院續審，控方指被告之一、時任法團成員粘清波涉騷擾控方證人，暫委法官鄧少雄遂下令撤銷粘的保釋，粘即時還押。\n粘清波被控串謀向代理人提供利益罪\n被告依次為60歲董事莊聰圖、53歲商人林雪邊、47歲商人杜漢森、55歲的士司機張建華及49歲裝修工人粘清波；莊、林、杜為中間人，張案發時任興達大廈法團主席，而粘為時任法團成員。\n莊、林、杜和張同被控1項串謀向代理人提供利益罪，指4人於2022年9月29日至2023年1月4日期間串謀向張提供提供多筆款項，作為張協助關聯公司取得涉案合約的報酬；莊、林和粘另被控1項串謀向代理人提供利益罪，則指4人於上述時段向粘、鍾陳青蓮及鄧燦培提供等同興達大廈大型維修工程項目合約款額10%的款項，作為粘等人協助取得合約的報酬。\n莊聰圖。資料圖片\n林雪邊。資料圖片\n杜漢森。資料圖片\n張建華。資料圖片\n指粘清波與控方證人通電話並要求對方不要出庭\n控方外聘資深大律師梁卓然今向法庭表示，粘涉騷擾控方證人，違反其保釋條件。梁指，粘昨日下午涉前往興達大廈管理處，先後要求保安告知該名控方證人的電話號碼及所住單位號碼，遭保安拒絕。粘仍堅持要求聯絡，保安最終讓粘通過管理處固網電話致電證人，雙方通話約20分鐘，粘要求證人不要出庭作證、或在庭上供稱已忘記等，又着對方事後刪除通話記錄。\n梁指廉署人員因為要安排證人出庭而聯絡該證人，隨即獲告知此事；大廈閉路電視亦拍攝到粘出入管理處。梁續向法庭申請撤銷粘的保釋，獲鄧官批准。粘的代表大律師姚大華向被告提供法律意見後，今午再為粘申請保釋，惟遭鄧官拒絕，粘續須還押。\n案件編號：DCCC1217/2024\n法庭記者：王仁昌","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5e6d4104bb","title":"房屋局：最新公屋綜合輪候時間4.4年 創十年新低","url":"https://news.tvb.com/tc/1207429-房屋局最新公屋綜合輪候時間44年創十年新低","summary":"房屋局指，最新公屋綜合輪候時間4.4年，創十年新低。【政府新聞公報】房屋局今日（十一月二十日）公布，最新公屋綜合輪候時間為4.4年，較今年六月時錄得的4.8年，大幅下降0.4年，而與本屆政府上任前的高位6.1年比較，縮短了1.7年，第一次低於4.5年，亦是過去十年以來的新低。","summary_short":"房屋局指，最新公屋綜合輪候時間4.4年，創十年新低。","digest":"【政府新聞公報】房屋局公布，最新公屋綜合輪候時間為4.4年…","points":["房屋局今日（十一月二十日）公布，最新公屋綜合輪候時間為4.4年，較今年六月時錄得的4.8年…","最新公屋綜合輪候時間，是根據截至二○二六年九月底…","房屋局發言人說：「隨着總體公營房屋建屋量持續增加，各個傳統公屋及『簡約公屋』項目陸續落成…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:14:00+08:00","size":1,"keywords":["公屋","房屋局","公屋輪候時間"],"body":"房屋局指，最新公屋綜合輪候時間4.4年，創十年新低。\n\n【政府新聞公報】\n\n房屋局今日（十一月二十日）公布，最新公屋綜合輪候時間為4.4年，較今年六月時錄得的4.8年，大幅下降0.4年，而與本屆政府上任前的高位6.1年比較，縮短了1.7年，第一次低於4.5年，亦是過去十年以來的新低。\n\n最新公屋綜合輪候時間，是根據截至二○二六年九月底，在過去12個月獲安排入住傳統公共租住房屋（公屋）或「簡約公屋」的一般申請者（即家庭申請者及長者一人申請者）輪候時間平均數計算所得。\n\n房屋局發言人說：「隨着總體公營房屋建屋量持續增加，各個傳統公屋及『簡約公屋』項目陸續落成，長期積壓的輪候個案逐漸被消化，公屋綜合輪候時間呈下降的趨勢。我們有信心達到行政長官在二○二二年《施政報告》提出，在二○二六／二七年度公屋綜合輪候時間下降至4.5年的目標。」\n\n總體公營房屋建屋量進入收成期\n\n本屆政府四年多以來全力「提量、提速、提效、提質」，公營房屋落成量已打好穩固基礎，進入收成期。未來五年（即二○二七／二八至二○三一／三二年度）每年平均提供超過35 000個公營房屋單位，包括公屋及資助出售房屋，較本屆政府上任時相應的五年落成量增加約73%，亦是過去二十五年來的新高。「簡約公屋」方面，截至二○二六年十一月中，約29 800個單位已經落成，餘下觀塘順利邨道及黃大仙竹園道由校舍改建的新項目（合共提供約210個單位）亦將於明年第一季落成啓用，即全數13個項目約30 000個「簡約公屋」單位，較二○二二年《施政報告》時提出五年內完成興建的目標，加快提前至四年多便完成。供應量龐大，有效縮短公屋輪候時間。\n\n多達11 200個一般申請者上樓\n\n在二○二六年第三季，多達約11 200宗一般申請獲安排入住傳統公屋或「簡約公屋」，包括約3 100個新落成的傳統公屋單位、約2 700個回收的傳統公屋單位，以及約5 450個「簡約公屋」單位。其中，獲編配入住「簡約公屋」的數目為上一季（約1 300個）的四倍多。\n\n發言人說：「在過去12個月，傳統公屋加上『簡約公屋』供應量已大大提升至平均每季有約8 200個單位，為本屆政府上任前的四年（即二○一八年第三季至二○二二年第二季）平均每季約4 100個單位供應的兩倍。『簡約公屋』更在今年七月至九月進入入伙高峰期。事實上，過去12個月內入住傳統公屋的一般申請者，平均輪候時間為5.3年，而同期獲編配入住『簡約公屋』的一般申請者，輪候時間平均僅為2.8年，充分突顯『簡約公屋』政策，在加快滿足基層市民住屋需要方面發揮了關鍵作用，有效帶動整體的公屋綜合輪候時間下降。」\n\n輪候公屋隊伍為過去15年新低\n\n發言人說：「我們亦正努力採取多管齊下的方法，加快公屋單位流轉，輪候公屋的一般申請者數目正呈下降的趨勢，今次錄得進一步減少約4 400個。我們同時亦觀察到許多輪候時間六年或以上的市區及擴展市區一般申請者，正陸續獲編配公屋單位，切實反映我們過去四年多的努力正逐步取得成效。」\n\n截至二○二六年九月底，約有96 100宗公屋的一般申請，與二○二○年九月最高位的156 400宗比較，大幅下降近40%，是過去15年以來的新低，亦是自二○一二年以來首次跌破10萬宗；至於配額及計分制下的非長者一人申請約有80 600宗，與二○一五年十二月最高位的約143 700宗比較，更大幅下降超過40%。當中，30歲以下的非長者一人申請的跌幅更為明顯，在過去十年間由二○一六年九月底約70 400宗，下跌約60%至二○二六年九月底約29 300宗。相關數字清楚顯示公屋輪候隊伍正在消化中。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026UrucK43bLj1795159014.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/1621c47c7fbe409580e79df9a67cadb9/1d83e516e7bd4698a89791f6c289b4d0-40529457e68e9ba9cf13e2556811006b-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026UrucK43bLj1795159014.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"ca38df66047","title":"彌敦道瘋狂倒車撞4的士 警拘兩男涉盜人身份買車及狂亂駕駛 疑用作毒品快餐車","url":"https://www.stheadline.com/breaking-news/3639244/彌敦道瘋狂倒車撞4的士-警拘兩男涉盜人身份買車及狂亂駕駛-疑用作毒品快餐車","summary":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士，隨後逆線逃逸，導致一名57歲的士司機受傷送院。","summary_short":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士…","digest":"尖沙咀本周二凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障…","points":["尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障…","油尖警區重案組經深入調查後，發現案中案，揭發有人涉嫌盜用他人個人資料購買及登記為車主…","警方於本月17日及18日，在石硤尾及旺角賓館分別拘捕負責「買車登記」及「狂亂駕駛」的兩名26…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:52:34+08:00","size":1,"keywords":[],"body":"尖沙咀本周二（17日）凌晨發生瘋狂駕駛案，一輛白色私家車為逃避警方路障，竟不顧警告急速倒車連撞後方四輛的士，隨後逆線逃逸，導致一名57歲的士司機受傷送院。油尖警區重案組經深入調查後，發現案中案，揭發有人涉嫌盜用他人個人資料購買及登記為車主，並成功鎖定兩名嫌犯。警方於本月17日及18日，在石硤尾及旺角賓館分別拘捕負責「買車登記」及「狂亂駕駛」的兩名26歲本地男子，其中涉案司機將於明日（21日）在西九龍裁判法院提堂。\n消息稱，兩被捕男子均無業，有黑幫背景，兩人並不相識，涉案車輛僅登記三個星期，警方經調查後，不排除涉案車輛與毒品交易有關。\n警方展示檢獲的證物。楊偉亨攝\n警方展示案中證物。楊偉亨攝\n油尖警區重案組高級督察曾智皓現講述案情。\n遇路障拒查瘋狂倒車連撞四的士　白色私家車逆線狂飆山林道逃逸\n油尖警區重案組第二隊高級督察曾智皓詳細交代了案情。本月17日凌晨約1時10分，西九龍衝鋒隊隊員在尖沙咀彌敦道與山林道交界設置警方路障。期間，一輛白色私家車駛至，警員發現男司機神情緊張，遂上前指令其下車接受調查。然而，該名司機拒絕配合，並在無預警下突然急速倒車，猛烈撞向後方的四部的士。現場警員隨即上前制服並多次發出警告，惟司機一意孤行，強行扭軚並逆線駛入山林道，往覺士道方向狂飆，瞬間逃去無蹤。事件中，四輛被撞的士受到輕微損毀，一名57歲本地男的士司機頸痛，幸清醒送往伊利沙伯醫院治理後，同日已無礙出院。\n銳眼計劃法眼鎖定案中案　石硤尾拘廿六歲男涉盜個資「買人頭車」\n油尖警區重案組探員經深入調查及翻查「銳眼計劃」下安裝的閉路電視系統，警方發現，有人涉嫌非法盜用另一名男子的個人資料，登記為該輛逃逸私家車的車主。鎖定目標後，重案組探員於案發當日（17日）迅速展開行動，在石硤尾區以涉嫌「行使虛假文書」罪名，拘捕一名26歲姓簡的本地男子，他涉嫌盜用他人個資購買並登記涉案私家車。\n棄車上水古洞深山再匿旺角賓館　狂徒落網起獲車匙犯案衣物\n涉案的26歲姓李本地男司機在案發後隱匿行蹤。調查顯示，他狂飆逃離現場後，連夜將肇事私家車駛往上水古洞一處偏僻山路棄置，其後在旺角區的一間賓館租房匿藏。重案組探員於翌日（18日）中午時分突擊搜查該賓館，成功截獲李男，並以涉嫌「狂亂駕駛」將其拘捕。探員隨後將其押返黃大仙住所搜查，成功起獲涉案私家車的車匙、犯案當日所穿的衣物及手提電話，並在上水古洞的山路中尋回該輛白色私家車，車上並未發現其他違禁品。\n被捕的26歲李姓司機目前已被警方暫控相關罪名，案件將於明日（11月21日）在西九龍裁判法院提堂；而涉嫌盜用他人資料登記車主的簡姓男子則已獲准保釋候查，須於12月中旬向警方報到。警方強烈譴責此等罔顧他人生命安全的瘋狂駕駛行為，並重申根據香港法例第212章《侵害人身罪條例》，瘋狂駕駛致其他人受傷最高可判監兩年。曾智皓強調，雖然警方基於現場環境及安全考量，未有在彌敦道即時強行截停，但警隊絕對有能力憑藉強大的科技與偵查手段，在案發後迅速將犯案者繩之於法。\n鑑於本案涉及嚴重的個人資料被盜用以購買車輛犯罪，警方藉此機會向市民作出呼籲。曾智皓提醒，市民必須妥善保護自己的身份證、住址證明等個人私隱，切勿將個資交予未經核實的第三方。他強調，如果有人向你租借或者要求你出售個人資料，請三思而後行，切勿因小失大，避免不法之徒利用個人資料作非法用途，無論用作開銀行戶口，公司登記，車輛買賣登記或者其他非法用途，都可能需要負上刑責。記住，個人資料唔租，唔借，唔賣。\n17日凌晨涉案私家車犯案情況:\n網上流傳片段顯示，涉案私家車倒車期間，多名警員立即上前試圖截停，惟司機未有理會，繼續倒車並撞向多輛的士。片段中有人大聲喝止司機停車，但私家車仍繼續逃走，最後逆線駛入山林道。\n拍片者將片段上載社交平台，稱當晚在尖沙咀吃宵夜後，目睹一輛Audi私家車為避開路障撞向多輛的士後逃去。另有網民聲稱，該車逃走期間駛至裕華百貨對開曾衝紅燈，險些撞到途人。亦有網民揣測涉事車輛可能涉及毒品案件。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4bab4eb107","title":"馬場浮世繪│莫雷拉策「赤夢」出戰香港短途錦標","url":"https://www.stheadline.com/realtime-racing/3639269/馬場浮世繪莫雷拉策赤夢出戰香港短途錦標","summary":"日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈，於今年九月短途馬錦標跑第五的「赤夢」，將接受香港賽馬會邀請，下月來港參加一級賽香港短途錦標，屆時將由騎師莫雷拉主轡…","summary_short":"日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈，於今年九月短途馬錦標跑第五的「赤夢」…","digest":"日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈…","points":["日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈…","至於另一匹應邀來港出戰香港短途錦標的四歲雌馬「風仙美韻」，則配武豐上陣"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:48:36+08:00","size":1,"keywords":[],"body":"日本賽馬團體Tokyo Thoroughbred Club昨日在其官方網站宣佈，於今年九月短途馬錦標跑第五的「赤夢」，將接受香港賽馬會邀請，下月來港參加一級賽香港短途錦標，屆時將由騎師莫雷拉主轡，該駒早前已運返馬房，開始備戰，日前在美浦訓練中心快跳。至於另一匹應邀來港出戰香港短途錦標的四歲雌馬「風仙美韻」，則配武豐上陣。 文傑","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce80fdc0806","title":"宏福苑｜96.2%業主已簽買賣協議 解說專隊陪同街坊到盛緻苑收樓","url":"https://www.stheadline.com/society/3639267/宏福苑962業主已簽買賣協議-解說專隊陪同街坊到盛緻苑收樓","summary":"大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開。","summary_short":"大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開。","digest":"大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開","points":["大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開","房屋局今日(20日)在社交平台發文，交代宏福苑之長遠居住安排最新進展","截至本月17日，共有96.2%（1909戶）業主完成簽署《買賣協議》"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:43:04+08:00","size":1,"keywords":[],"body":"大埔宏福苑業主「特設銷售計劃」揀樓程序於9月29日展開。房屋局今日(20日)在社交平台發文，交代宏福苑之長遠居住安排最新進展。截至本月17日，共有96.2%（1909戶）業主完成簽署《買賣協議》。83.2%（ 1651戶）的業權轉讓已經完成，並已收到現金或「樓換樓券」，以便他們安排其長遠居所。除少數特殊個案外，餘下個案預計將於年內完成業權轉讓。\n首批街坊九龍灣盛緻苑收樓 讚交通便利配套齊備\n房屋局又指出，「特設銷售計劃」的10個房屋發展項目都有街坊選擇，其中九龍灣盛緻苑及粉嶺樂嶺軒單位的業主，將由本月起陸續完成交易及收樓。房屋局解說專隊昨日(19日)親自陪同其中一戶即將搬入九龍灣盛緻苑的街坊進行「收鎖匙」儀式，共同見證這歷史性時刻。\n房屋局的「解說專隊」陪同街坊前往收樓前，與街坊們逛逛鄰近的設施，好讓她們提前熟悉社區。盛緻苑附近有巴士站、小巴站、的士站，步行幾分鐘就到啟業邨，有街市、餐廳和不同的零售商店。平日喜歡煮食的街坊也感到非常滿意，大讚盛緻苑環境舒適、交通便利、附近設施齊備。\n設計溫馨獲街坊讚賞 感謝解說專隊一路陪伴\n隨後街坊正式步入屋苑，就見到溫馨繽紛的壁畫，再走幾步就是內園的休憩設施，街坊亦很滿意屋苑的設計。看完入伙短片、繳交費用及領取鎖匙後，專隊便與街坊上樓，見證街坊打開新居的大門。她選擇盛緻苑的原因是最快入伙，與兒子住得比以前更近，有不少朋友住在附近，住市區出入也方便。同時，她對選到心儀單位非常開心，座向理想、景觀開揚。她感謝「解說專隊」一直以來的支援與陪伴，詳盡解說選樓事宜，形容是「解決了所有煩憂」，預計新年後可以入伙。\n「解說專隊」與居民建立深厚情誼 承諾繼續同行\n長期伴隨居民重建生活的「解說專隊」亦與街坊建立了深厚互信。有喜愛戲曲的街坊在交流中透露，得知專隊成員同樣熱愛戲曲，已盛情邀請對方日後同台演出，並笑言要由專隊成員擔任「花旦」。\n房屋局對宏福苑街坊的信任表示感謝，並強調「解說專隊」將繼續堅守崗位，與他們一起前行。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdc027080e5","title":"香港金牛｜CBA俱樂部盃響頭炮 美臣鍾斯23分8助攻領軍締NBL球隊首勝","url":"https://www.stheadline.com/basketball-zone/3639200/香港金牛CBA俱樂部盃響頭炮-美臣鍾斯23分8助攻領軍締NBL球隊首勝","summary":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事，憑藉外援美臣鍾斯（Mason Jones）交出全場最高23分及8次助攻的出色表現，以77:72擊退長白山恩都里…","summary_short":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","digest":"香港金牛籃球隊於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","points":["香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事…","志在衝擊CBA的香港金牛，今仗甫開賽迅速入局","美臣鍾斯不僅頻頻切入得分，更兩度助攻另一外援所羅門（Richard Solomon III）…"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:38:52+08:00","size":1,"keywords":[],"body":"香港金牛籃球隊昨日（19日）於海南瓊海出戰「第三屆中國人壽CBA俱樂部盃」D組賽事，憑藉外援美臣鍾斯（Mason Jones）交出全場最高23分及8次助攻的出色表現，以77:72擊退長白山恩都里，旗開得勝，更成為今屆賽事首支報捷的NBL球隊。\n志在衝擊CBA的香港金牛，今仗甫開賽迅速入局。美臣鍾斯不僅頻頻切入得分，更兩度助攻另一外援所羅門（Richard Solomon III）上演「拆你屋」入樽，引爆全場氣氛；次節新兵石奎亦在抄截後快攻得手，順利取得職業生涯首分。上半場比賽十分激烈，香港金牛僅僅以43:40領先對手返回更衣室。\n換邊後雙方戰況膠著，進入決勝的第四節，領先的金牛一度出現混亂，陷入被對手狂追比分的危機。關鍵時刻，新加盟的楊和挺身而出，連番命中中距離及三分球穩住陣腳，最終金牛頂住壓力，以77:72保住勝局。除美臣鍾斯外，所羅門今仗亦貢獻14分及15個籃板的「雙雙」數據，楊和則有8分進帳。\n主教練解立彬賽後感謝CBA公司給予NBL球隊參與高強度比賽的機會：「上半場戰況激烈，下半場大家學會以團隊拿下比賽。過程中確實有很多混亂的地方，我們需要在往後的比賽和訓練中，解決今天出現的問題。」\n贏波功臣美臣鍾斯則喜言：「這是我們今季第一場比賽，很高興能拿下首勝。正如教練所言，每一天都是新課題。我們一直按計劃努力訓練，表現比大家預期好很多。去年我們在俱樂部盃成績不錯，我知道今年外界的期待會更高，我們會逐日做好，繼續保持進步。」香港金牛將於今日（20日）下午3時30分迎戰廣州智都集團，力爭兩連勝。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cda43d3a80c","title":"選委會選舉2026．提名全名單︱累計接獲1155份提名 至少31個界別分組有競爭 社福界25人爭15席","url":"https://www.stheadline.com/politics/3626329/選委會選舉2026提名全名單累計接獲1155份提名-至少31個界別分組有競爭-社福界25人爭15席","summary":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。","summary_short":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。","digest":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束…","points":["選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行","提名期10月20日下午5時結束，總數共接獲1115份候選人提名及40份指定團體提名表格…","其中，第一界別工商金融界，18個分組都出現超額競"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:23:41+08:00","size":1,"keywords":[],"body":"選舉委員會提名期10月7日展開，為期兩星期，至10月20日結束，選舉投票將於11月22日舉行。提名期10月20日下午5時結束，總數共接獲1115份候選人提名及40份指定團體提名表格，其中31個界別分組已超額報名，將會有競爭。其中，第一界別工商金融界，18個分組都出現超額競；第二界別專業界，10個分組中，有8個出現競爭，競爭最激烈是社會福利界，有25人爭15席。\n2026
