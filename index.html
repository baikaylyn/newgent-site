<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

"11月19日，在2026年APEC領導人非正式會議的全家福合影，定格了經濟體的歷史性同框。各國領導人披着一條香雲紗長巾，沈穩紅與深邃藍兩色輝映。其中獨特的「英雄紅」來自順德薯莨與河泥「魔法」變出的香雲紗，花了不少功夫才登上國禮的舞台。\n今次中方配飾「同心合錦」紅藍CP驚艷世界，藍色圍巾以蘇州上久楷的宋錦織造，紅色圍巾則是來自順德的香雲紗染整。「同心合錦」中的那抹磚紅色並非化學染劑，而是源自順德倫教曬莨裏，薯莨與河泥的古老魔法。經過30多道純手工、無化學助劑的染整工序，在日光、河泥與草地的反復催化下，才沈澱出那份沈穩的「英雄紅」。\n從老師傅靠經驗到規範化\n傳統香雲紗「憑手感、看眼力」，導致市場上真偽難辨、良莠不齊，成為高端品牌化的最大阻礙，但倫教政府特別出台《香雲紗品類與等級評定規範》團體標準，將老師傅的經驗轉化為包含色牢度、撕拉力等指標的理化數據，並結合非遺傳承人的感官評定。\n2026年4月，首批「優等品」評定落地。優質香雲紗獲得品質認證，打開了成為國禮的大門。\n順德河泥獨特 溫濕度難複製\n其他地方即使能種出薯莨（一種薯蕷科薯蕷屬植物）、仿造工序，也搬不走順德特有的富含鐵離子的河泥，搬不走珠三角的日照與溫濕度，更搬不走一代代順德手藝人沈澱的技藝。\n如今的順德倫教，手握國家級非遺、國家地理標誌產品、國家地理標誌證明商標三張「國字號」名片，2025年香雲紗產能突破1000萬米，曬莨場逾1600畝，倫教建立出全國首個香雲紗全產業鏈園區，將面料生產、設計研發、品牌孵化、交易展貿整合於一體。\n當「同心合錦」需要批量交付高品質長巾時，順德能夠迅速調度產能、控制品質。從原產地的保護，到規模化、標準化的生產，順德香雲紗完成了從「農產品式作坊」向「現代時尚工業」的躍升。\n小知識：大合照傳統服裝何以簡化成圍巾？\n自1993年西雅圖峰會，時任美國總統克林頓贈送每人一件皮褸開始，APEC就出現了了穿東道主特色服裝拍大合照慣例，例如上海唐裝、越南奧黛等。後來有官員對於穿異國傳統服飾感到不自在，近年多國簡化為有各國特色的圍巾，在保留了宣傳本土文化工藝的同時免各國領袖感到拘束 。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC｜全家福長巾「紅藍雙絕」 拆解紅色「順德香雲紗」國禮手作奧秘","url":"https://www.stheadline.com/realtime-china/3638940/深圳APEC全家福長巾紅藍雙絕-拆解紅色順德香雲紗國禮手作奧秘","source_display":"星島頭條","published_at":"2026-11-19T17:30:54+08:00","category":"內地","digest":"11月19日，在2026年APEC領導人非正式會議的全家福合影…"},{"title":"深圳APEC｜李家超晤新加坡總理黃循財 感謝支持香港加入RCEP 邀星企發掘河套商機","url":"https://www.stheadline.com/politics/3638938/深圳APEC李家超晤新加坡總理黃循財-感謝支持香港加入RCEP-邀星企發掘河套商機","source_display":"星島頭條","published_at":"2026-11-19T17:12:39+08:00","category":"港聞","digest":"行政長官李家超於下午在深圳出席亞太經合組織相關活動期間，與新加坡總理黃循財會面"},{"title":"深圳APEC‧直擊｜熱情民眾無懼封路聚香蜜公園遠眺打卡 「如當年辦京奧般振奮」","url":"https://www.stheadline.com/realtime-china/3638917/深圳APEC直擊熱情民眾無懼封路聚香蜜公園遠眺打卡-如當年辦京奧般振奮","source_display":"星島頭條","published_at":"2026-11-19T17:00:11+08:00","category":"內地","digest":"APEC領導人全體會議今晨9時半在深圳國際交流中心舉行，《星島》記者直擊觀察…"},{"title":"深圳APEC｜政要忙打卡普京讚最現代化都市","url":"https://www.stheadline.com/realtime-china/3638769/深圳APEC政要忙打卡普京讚最現代化都市","source_display":"星島頭條","published_at":"2026-11-19T09:00:56+08:00","category":"兩岸國際","dige 新，鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。四要坚持包容发展，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。\n\n　　习近平强调，中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n\n　　第一，强化经贸支柱。亚太自由贸易区是亚太经合组织成员的共同愿景，要稳步向前推进，打造更高水平的开放格局。推动区域经贸协定对接，提升贸易投资便利化、数字化水平，减少贸易投资壁垒。加强政策对话，开展经验交流和技术合作，提高各方参与高水平经贸安排的能力。\n\n　　第二，升级联通支柱。互联互通是区域经济一体化的纽带。要巩固“硬联通”，完善基础设施网络；增强“软联通”，促进政策和监管协调；密切“心联通”，便利商旅和人员往来，促进人文交流和民众相知相亲。\n\n　　第三，打造创新支柱。数字经济和人工智能是创新增长的引擎。要加强数字基础设施建设，完善区域数据治理和协同合作，实现高效、便捷、安全的跨境数据流动。打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n\n　　第四，夯实发展支柱。要加强能力建设，推动区域能源和粮食安全合作，深化跨境腐败治理。推动资源、环境、人口协调发展，拓展绿色低碳合作，实现经济可持续增长。支持改善民生和投资于人，实施健康老龄化行动，促进就业和职业技能开发，支持妇女经济赋权和青年人才交流，释放亚太人才活力。\n\n　　习近平宣布中方支持亚太合作的最新举措，包括提供2000万美元资助开展亚太经合组织务实合作；在深圳设立亚太共同体研究中心，开展政策研究和交流，提供智力支撑；在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。\n\n　　各经济体领导人及代表围绕会议主题“建设亚太共同体，促进共同繁荣”依次发言。各方高度评价APEC“中国年”取得的丰硕成果，感谢中方所做出色工作，积极呼应习近平主席提出的重大倡议举措。各方表示，愿密切各领域合作，携手应对风险挑战，推动亚太经合组织实现更大发展，为地区和世界的和平、稳定、繁荣作出贡献。国际货币基金组织总裁格奥尔基耶娃应邀介绍当前全球经济形势。\n\n　　习近平听取各方发言后作总结发言，就高质量推进亚太合作提出3点主张：一是坚定信心，努力将建设亚太共同体的共识转化为行动，把愿景变为现实。二是把准方向，始终锚定建设亚太共同体的大方向不动摇，以强烈的使命感推进各领域合作，携手创造亚太更加美好的未来，推动构建人类命运共同体。三是实干笃行，抓住发展这个最大公约数，尊重规律、真抓实干、善作善成，不断取得可感可及的亚太合作成果。\n\n　　会议最后进行东道主交接，2027年亚太经合组织东道主越南国家主席苏林欢迎各经济体领导人、代表明年前往越南出席会议。\n\n　　会议一致通过2026年亚太经合组织领导人宣言，就亚太共同体建设提出“深圳展望”，以及贸易、联通、创新领域3项成果文件。\n\n　　蔡奇、王毅出席。(完) 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734613.shtml","source_display":"中新網 時政","published_at":"2026-11-19T14:37:43+08:00","category":"內地","digest":"11月19日上午…"},{"title":"习近平在亚太经合组织第三十三次领导人非正式会议上的讲话（全文）","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734521.shtml","source_display":"中新網 時政","published_at":"2026-11-19T10:27:26+08:00","category":"內地","digest":"习近平在亚太经合组织第三十三次领导人非正式会议上的讲话（全文）"},{"title":"习近平主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734509.shtml","source_display":"中新網 時政","published_at":"2026-11-19T10:02:52+08:00","category":"內地","digest":"11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议…"},{"title":"习近平主持亚太经合组织第三十三次领导人非正式会议","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734502.shtml","source_display":"中新網 時政","published_at":"2026-11-19T09:51:38+08:00","category":"內地","digest":"新华社快讯：11月19日上午…"},{"title":"习近平将出席亚太经合组织第三十三次领导人非正式会议","url":"https://www.jiemian.com/article/15348689.html","source_display":"界面新聞","published_at":"2026-11-19T08:37:10+08:00","category":"","digest":"今日上午，亚太经合组织第三十三次领导人非正式会议将在深圳国际交流中心举行"}],"cross":{"total":5,"angles":[{"point":"11月19日上午…","sources":["中新網 時政","中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734613.shtml"},{"point":"习近平在亚太经合组织第三十三次领导人非正式会议上的讲话（全文）","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734521.shtml"},{"point":"今日上午，亚太经合组织第三十三次领导人非正式会议将在深圳国际交流中心举行","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15348689.html"},{"point":"11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734509.shtml"}]}},{"id":"cc41f510e8b","title":"（深圳APEC）习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特…","digest":"11月19日下午…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织…","习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道…","中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:27:46+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。\n\n　　习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道，确立了“中美建设性战略稳定关系”的新定位，并赋予其“基于尊重、公平、对等”的新内涵，受到中美两国人民认可和国际社会欢迎。中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性。我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。\n\n　　习近平强调，构建中美建设性战略稳定关系是前无古人的开创性事业，需要敢闯敢试、脚踏实地、善作善成。中美元首外交的引领作用不可替代。要延续中美关系目前的稳定向好势头，关键是要在落实元首共识上付诸行动。双方团队的沟通也要跟上。要拉长合作清单、压缩问题清单，一时解决不了的分歧要建设性管控，防止矛盾升级。在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。经贸领域要加强沟通，解决彼此关切，争取互利互惠。两国在禁毒、非法移民遣返、打击电信网络诈骗等领域的合作卓有成效，可以本着尊重、公平、对等的原则继续加强合作。中美应当加强沟通和协调，防范人工智能安全风险，确保人工智能始终处于人类控制之下。\n\n　　特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。\n\n　　双方认为此次会晤是积极、建设性的，同意制定建设性战略稳定关系行动计划，落实两国元首共识，构建基于尊重、公平、对等的中美建设性战略稳定关系。\n\n　　两国元首还就共同关心的国际和地区问题交换了意见。\n\n　　蔡奇、王毅、何立峰、黄坤明等参加会见。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml","source_display":"中國新聞網","published_at":"2026-11-19T17:27:46+08:00","category":"內地","digest":"11月19日下午…"},{"title":"习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734694.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:22:55+08:00","category":"內地","digest":"11月19日下午…"},{"title":"新华图讯丨习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734624.shtml","source_display":"中新網 時政","published_at":"2026-11-19T15:24:16+08:00","category":"內地","digest":"新华图讯丨习近平会见美国总统特朗普"}],"cross":{"total":3,"angles":[{"point":"11月19日下午…","sources":["中國新聞網","中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml"},{"point":"新华图讯丨习近平会见美国总统特朗普","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734624.shtml"}]}},{"id":"c84af283f8e","title":"蔡天鳳碎屍案｜鄺港智供稱譚方駿鍾意自己 「所以三個人就一齊」","url":"https://news.tvb.com/tc/1207241-蔡天鳳碎屍案鄺港智供稱譚方駿鍾意自己所以三個人就一齊","summary":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地，其後用相同方法，往返內地和香港，每次都是包船，費用是10萬元，自己有能力支付。鄺港智稱，在內地期間有同蔡天鳳維持聯絡，每天都有傾談幾個小時電話或視頻。","summary_short":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地…","digest":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行…","points":["大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行…","鄺 ary_short":"中新网郑州11月19日电 (记者 王佳宁 赵梦阳)近日，河南省新密市岐伯山“千碑林”走红网络。","digest":"近日，河南省新密市岐伯山“千碑林”走红网络","points":["中新网郑州11月19日电 (记者 王佳宁 赵梦阳)近日，河南省新密市岐伯山“千碑林”走红网络","中新网记者探访现场发现，刻有中医验方的石碑吸引众多中医爱好者参观、抄方","在现场看到，碑林位于岐伯墓不远处，入园处有“千家名医名方碑林”的题名碑"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T13:57:49+08:00","size":3,"keywords":[],"body":"中新网郑州11月19日电 (记者 王佳宁 赵梦阳)近日，河南省新密市岐伯山“千碑林”走红网络。中新网记者探访现场发现，刻有中医验方的石碑吸引众多中医爱好者参观、抄方。\n\n　　“医之始，本岐黄。”河南是中医药重要发祥地。新密市是岐黄文化发祥圣地，是《黄帝内经》思想理论形成地。\n\n图为新密中医验方“千碑林”吸引众多来访者。记者 赵梦阳 摄\n\n　　记者在现场看到，碑林位于岐伯墓不远处，入园处有“千家名医名方碑林”的题名碑。园内众多石碑顺坡势排布，每方高约2米，正面记载中医验方捐献者的行医履历，背面镌刻验方名称、对症、剂量与功效，多为一碑一方。众多来访者在碑前抄录或拍照留存。\n\n　　“以碑载方、以方传医，是岐黄文化的延伸。”碑林负责人郑旭耀受访称，目前碑林刻有200余个中医验方，均由医者自愿自费捐刻。\n\n　　其中，验方既涉及胃病、鼻炎、头疼等常见病，也有食疗、养生内容，免费向公众开放。郑旭耀说：“这些捐赠验方的医者多为长期从事中医药临床实践的中医，有扎实的专业积累。”\n\n图为河南新密中医验方“千碑林”。记者 赵梦阳 摄\n\n　　现场一位中医爱好者崔国山受访称，“老话说‘方不外传’‘传方不传量、传内不传外’，但这些中医愿意把验方向公众免费开放，这不就是医者济世惠民最生动的体现吗？”\n\n　　一大早专程从河北石家庄赶来的中医爱好者楚洋介绍，“我已将石碑上的药方尽数抄录，主要是为学习、参考用”。\n\n　　“中医本就是代代相传、生生不息的学问，现在很多中医技法、验方失传，实在可惜。”来自河南焦作的刻碑留方者、中医姬广奇向记者介绍，其家族四代从医，自己也已行医近50年。\n\n　　在姬广奇看来，刻碑留方是一种庄重、持久的中医传承方式，能为后世留下可溯源的实物载体。“石碑上刻的这两个药方，是我从长期临床经验中总结而来，主要是为了中医科普、供同行研究交流”。\n\n　　郑旭耀介绍，目前，医者捐刻的石碑还在持续增加。此碑林计划打造两三千方石碑、收录5000个中医验方，让岐黄良方长久留存。\n\n　　“刻碑传方” 事迹不只在岐伯山碑林一处。此前，河南驻马店老中医袁淑芳墓碑上刻药方的事迹便被广泛关注。不过，郑旭耀也提醒公众，中医药核心在于辨证论治，同方不同证，公众不能盲目照搬碑刻药方抓药服用，务必遵医嘱辨证施治。(完)\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"河南新密中医验方“千碑林”引关注","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734589.shtml","source_display":"中新網 社會","published_at":"2026-11-19T13:57:49+08:00","category":"","digest":"近日，河南省新密市岐伯山“千碑林”走红网络"},{"title":"二三百位中医献方！河南新密中医验方“千碑林”引关注","url":"http://www.chinanews.com.cn/sh/shipin/cns-d/2026/11-19/news1075421.shtml","source_display":"中國新聞網","published_at":"2026-11-19T08:58:31+08:00","category":"生活","digest":"近日，河南新密岐伯山 “千碑林” 走红网络后…"},{"title":"二三百位中医献方！河南新密中医验方“千碑林”引关注","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075421.shtml","source_display":"中新視頻","published_at":"2026-11-19T08:41:18+08:00","category":"民生","digest":"近日，河南新密岐伯山 “千碑林” 走红网络后…"}]},{"id":"cf3324de2e0","title":"界面晚报 | 习近平就大国如何正确相处提出4点看法；商务部谈当前消费市场表现","url":"https://www.jiemian.com/article/15348271.html","summary":"习近平就大国如何正确相处提出4点看法  11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"习近平就大国如何正确相处提出4点看法  11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","digest":"习近平就大国如何正确相处提出4点看法  11月19日下午…","points":["11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤","习近平就大国如何正确相处、共同为世界和平托底提出4点看法：第一，坚持相互尊重","大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:27:00+08:00","size":2,"keywords":[],"body":"习近平就大国如何正确相处提出4点看法\n\n11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平就大国如何正确相处、共同为世界和平托底提出4点看法：第一，坚持相互尊重。相互尊重是大国交往的基本准则。第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。详情点击>>\n\n新一轮国企改革全面实施，国资委强调发展未来产业要防止“一哄而上”\n\n丽莎对界面新闻表示，现代产业核心技术研发投入大、周期长、风险高、交叉性强，单一龙头企业难以独立完成全链条技术突破，尤其在根技术、共性技术、前沿技术领域，需要多元主体联合攻关。胡迟对界面新闻表示，提升国资监管效能需要构建纵横协同的监管体系。详情点击>>\n\nAPEC 2026｜从华强北到亚太产业链：深圳智能硬件的世界坐标\n\n陈金尧告诉界面新闻，其中在东南亚，泰国已成为其中增长最快的市场之一。郭彦东告诉界面新闻，智平方的机器人当“志愿者”之前快速学习了十几门外语，APEC经济体里国家常用的语言它都会。杨倩向界面新闻分析道，亚太市场对具身智能、物理AI技术的需求是真实且长期的。详情点击>>\n\n如何看待当前消费市场表现？商务部提到三个特点\n\n罗志恒对界面新闻表示，当前，有效需求不足是宏观经济运行的突出矛盾，主要表现为居民消费动力不足、企业投资意愿偏弱。居民消费不足，既与收入增长和就业预期有关，也受到社会保障不够完善、教育医疗养老等支出压力较大、预防性储蓄倾向较强等因素影响。详情点击>>\n\n特朗普说美国不支持“台独”\n\n特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。详情点击>>\n\n日媒称中方对高市早苗的简朴接机仪式引发关注，中方回应\n\n日本朝日新闻记者提问，关于APEC峰会期间对访华领导人的机场迎接，日本首相受到的简朴迎接仪式引发广泛关注。请问在迎接方式上采取这种方法，中方有什么考虑？郭嘉昆表示，作为东道主，中方根据国际惯例，对所有参会方作出适当的礼宾安排。详情点击>>\n\n被判有期徒刑4年，金建希涉争议案件终审结果出炉\n\n尹锡悦夫妻以总统职权为核心、夫妻分工协作的系统性腐败模式‌，成为韩国政坛标志性案件。金建希背负的刑事指控集中在‌影响力受贿、股价操纵、违规斡旋‌三大类，相关案件大多已进入二审及后续审理阶段。除了上述罪名，自尹锡悦2021年12月参选总统起，金建希便被爆出存在学术不端、履历造假等问题。详情点击>>\n\n马斯克：我是中国的超级粉丝\n\n马斯克11月19日在深圳说：“我是中国的超级粉丝。中国很酷。我一直鼓励世界各地的人们来中国走走，亲眼看看中国这些了不起的地方。这里有不可思议的城市、不可思议的自然风光，还有像兵马俑这样的世界奇迹。美中合作越多，各自也会越好。”详情点击>>\n\n未经正式授权严禁转载本文，侵权必究。界面晚报\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n界面晚报 | 习近平就大国如何正确相处提出4点看法；商务部谈当前消费市场表现\n\n国资委强调发展未来产业要防止“一哄而上”；从华强北到亚太产业链：深圳智能硬件的世界坐标；金建希涉争议案件终审结果出炉。以下是界面新闻为你梳理的11月19日晚报新闻。\n\n原创新闻界面综合 · 2026/11/19 17:27来源：界面新闻\n\n习近平就大国如何正确相处提出4点看法\n\n11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平就大国如何正确相处、共同为世界和平托底提出4点看法：第一，坚持相互尊重。相互尊重是大国交往的基本准则。第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。详情点击>>\n\n新一轮国企改革全面实施，国资委强调发展未来产业要防止“一哄而上”\n\n丽莎对界面新闻表示，现代产业核心技术研发投入大、周期长、风险高、交叉性强，单一龙头企业难以独立完成全链条技术突破，尤其在根技术、共性技术、前沿技术领域，需要多元主体联合攻关。胡迟对界面新闻表示，提升国资监管效能需要构建纵横协同的监管体系。详情点击>>\n\nAPEC 2026｜从华强北到亚太产业链：深圳智能硬件的世界坐标\n\n陈金尧告诉界面新闻，其中在东南亚，泰国已成为其中增长最快的市场之一。郭彦东告诉界面新闻，智平方的机器人当“志愿者”之前快速学习了十几门外语，APEC经济体里国家常用的语言它都会。杨倩向界面新闻分析道，亚太市场对具身智能、物理AI技术的需求是真实且长期的。详情点击>>\n\n如何看待当前消费市场表现？商务部提到三个特点\n\n罗志恒对界面新闻表示，当前，有效需求不足是宏观经济运行的突出矛盾，主要表现为居民消费动力不足、企业投资意愿偏弱。居民消费不足，既与收入增长和就业预期有关，也受到社会保障不够完善、教育医疗养老等支出压力较大、预防性储蓄倾向较强等因素影响。详情点击>>\n\n特朗普说美国不支持“台独”\n\n特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。详情点击>>\n\n日媒称中方对高市早苗的简朴接机仪式引发关注，中方回应\n\n日本朝日新闻记者提问，关于APEC峰会期间对访华领导人的机场迎接，日本首相受到的简朴迎接仪式引发广泛关注。请问在迎接方式上采取这种方法，中方有什么考虑？郭嘉昆表示，作为东道主，中方根据国际惯例，对所有参会方作出适当的礼宾安排。详情点击>>\n\n被判有期徒刑4年，金建希涉争议案件终审结果出炉\n\n尹锡悦夫妻以总统职权为核心、夫妻分工协作的系统性腐败模式‌，成为韩国政坛标志性案件。金建希背负的刑事指控集中在‌影响力受贿、股价操纵、违规斡旋‌三大类，相关案件大多已进入二审及后续审理阶段。除了上述罪名，自尹锡悦2021年12月参选总统起，金建希便被爆出存在学术不端、履历造假等问题。详情点击>>\n\n马斯克：我是中国的超级粉丝\n\n马斯克11月19日在深圳说：“我是中国的超级粉丝。中国很酷。我一直鼓励世界各地的人们来中国走走，亲眼看看中国这些了不起的地方。这里有不可思议的城市、不可思议的自然风光，还有像兵马俑这样的世界奇迹。美中合作越多，各自也会越好。”详情点击>>\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"界面晚报 | 习近平就大国如何正确相处提出4点看法；商务部谈当前消费市场表现","url":"https://www.jiemian.com/article/15348271.html","source_display":"界面新聞","published_at":"2026-11-19T17:27:00+08:00","category":"","digest":"习近平就大国如何正确相处提出4点看法  11月19日下午…"},{"title":"习近平就大国如何正确相处提出4点看法","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734740.shtml","source_display":"中國新聞網","published_at":"2026-11-19T17:15:34+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}],"cross":{"total":2,"angles":[{"point":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734740.shtml"},{"point":"习近平就大国如何正确相处提出4点看法  11月19日下午…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15348271.html"}]}}],"sections":[{"name":"港聞","total":18,"items":[{"id":"c9a6de16cca","title":"恆豐酒店與錦倫旅運合謀定價罰款10.4萬 競委會上訴得直 改判罰款95萬","url":"https://www.stheadline.com/society/3638953/恆豐酒店與錦倫旅運合謀定價罰款104萬-競委會上訴得直-改判罰款95萬","summary":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間，因不滿同業在酒店的銷售價格較低，多次向酒店施壓，要求與對手落實定價。","summary_short":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間…","digest":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司…","points":["旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間…","競爭事務審裁處裁定他們合謀定價並違反《競爭條例》，去年下令恆豐酒店罰款10.4萬元","競委會認為罰款過低提出上訴，高等法院上訴庭今頒下判詞，裁定競委會上訴得直…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:43:52+08:00","size":1,"keywords":[],"body":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間，因不滿同業在酒店的銷售價格較低，多次向酒店施壓，要求與對手落實定價。競爭事務審裁處裁定他們合謀定價並違反《競爭條例》，去年下令恆豐酒店罰款10.4萬元。競委會認為罰款過低提出上訴，高等法院上訴庭今頒下判詞，裁定競委會上訴得直，指原審判刑未能反映嚴重性及起阻嚇，終改判恆豐酒店罰款95萬元。\n上訴方為競爭事務委員會，而答辯方為擁有恆豐酒店的Prudential Hotel(BVI) Limited。\n競委會指罰款額須超違規行為得益以阻嚇\n上訴方早前提出認為罰款10.4萬元過低，強調罰款額須超越違規行為所得的利益，以作出足夠阻嚇作用，維護公平競爭環境，否則難以體現違反競爭法的嚴重性。恆豐酒店一方則指，罰款10.4萬元已足夠反映其罪責，重申恆豐酒店並非整個安排的發起者，只是充當「促成者」角色。\n判詞指，恆豐酒店一方與其他涉案人士合謀定價，雖然恆豐酒店只負責協調安排，它每月向錦倫收取固定租金，並不受涉案門票銷售額影響，但事件性質嚴重，涉及到合謀定價及排除基本競爭，符合條例下嚴重反競爭行為的定義，屬於價格競爭中典型的侵害行為，而價格競爭在經濟巿場上如同中樞神經系統一般。\n恆豐擔當中間人角色參與程度不被動 \n判詞續指，恆豐酒店即使沒有因應涉事門票銷售額而直接影響收入，它在合謀仍有着關鍵角色，而非純粹被動，例如恆豐酒店會負責把綿倫的價格轉達給Tink Labs、並要求Tink Labs跟隨定價，它擔當了中間人角色；甚至會令人懷疑，如果沒有恆豐酒店的協調，涉案合謀能否落實。\n恆豐酒店一方原被判罰款10.4萬元，這甚至少過它在案發時的租金收入，上訴庭認為競爭事務審裁處在原審判刑時未有充分考慮阻嚇需要，為反映案中合謀的嚴重性及恆豐酒店的參與程度，終改判罰款95萬元、須於42日內支付，並須向競委會一方支付訟費。\n案件編號：CACV218/2025\n法庭記者：王仁昌","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf268f4238c","title":"市建局土瓜灣道／榮光街發展計劃 由信和夥鷹君財團以26.88億元投得","url":"https://www.stheadline.com/society/3638952/市建局土瓜灣道榮光街發展計劃-由信和夥鷹君財團以2688億元投得","summary":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作，發展土瓜灣道／榮光街發展計劃，中標金額為26.88億元。","summary_short":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作…","digest":"市建局公布，經過公開招標程序後…","points":["市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成…","市建局預計項目將於2032年落成","市建局發言人表示，多間主要發展商均有參與是次投標，入標數量與出價均在預期之內…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:42:19+08:00","size":1,"keywords":[],"body":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作，發展土瓜灣道／榮光街發展計劃，中標金額為26.88億元。市建局預計項目將於2032年落成。\n市建局：入標數量與出價均在預期之內\n今次項目於11月11日截標時共接獲三份標書。由市建局董事會設立的招標遴選小組在審慎評估標書後，建議將合約批予「天瑋有限公司」，並獲董事會接納。市建局發言人表示，多間主要發展商均有參與是次投標，入標數量與出價均在預期之內，最終中標價亦相當貼近市價。市建局在與中標財團完成簽訂發展合約後，將以不記名方式適時公布其餘未中標公司的投標金額。\n發揮「小區重建」協同效應\n土瓜灣道／榮光街項目為市建局首個「小區重建新社區」（Victoria Cove Central，簡稱VCC）的最後一期。連同是次批出的項目，整個VCC共八個項目已匯聚八間主要發展商參與，反映小區規劃模式獲市場支持。\n市建局行政總監蔡宏興對參與投標的發展商及財團表示感謝。他指出，今次入標的發展商中，有三間均有參與發展VCC或毗鄰項目，證明業界充分肯定VCC整全規劃的長遠價值。他續稱，新項目將與區內另外七個正施工的重建項目產生協同效應，配合市建局提出的「海—岸—陸」整體規劃方針，營造更具活力的社區，並響應構建「東維港灣區」的願景。\n建兩條行人天橋成「超級連接」 \n根據規劃，是次項目除作商住用途外，亦兼負改善區內步行環境及社區配套的重任。項目將興建兩條行人天橋，貫通港鐵土瓜灣站及毗鄰七個重建項目，形成「超級連接」網絡；同時將提供不少於5,500平方米的非住用樓面面積作社福設施用途，並增設公共空間。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5cf0524a3d","title":"藍田啟田道中學疑有「尿袋」起火冒煙 14歲男學生燒傷送院","url":"https://www.stheadline.com/breaking-news/3638948/藍田啟田道中學疑有尿袋起火冒煙-14歲男學生燒傷送院","summary":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。","summary_short":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。","digest":"下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄…","points":["今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前…","事發時一名14歲男學生在校內使用「尿袋」，其間疑「尿袋」短路起火冒煙，男學生被燒傷…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:13:55+08:00","size":1,"keywords":[],"body":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。\n據了解，事發時一名14歲男學生在校內使用「尿袋」，其間疑「尿袋」短路起火冒煙，男學生被燒傷，幸仍然清醒，由救護車送往聯合醫院治理。\n消防到場調查起火原因。曾志恒攝\n現場為藍田啟田道5號聖公會基孝中學。曾志恒攝","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0c3ee778f3","title":"元朗七人車壞車阻路 4壯漢見義勇為推車解困 目擊者：好人好事","url":"https://www.stheadline.com/breaking-news/3638937/元朗七人車壞車阻路-4壯漢見義勇為推車解困-目擊者好人好事","summary":"行善助人一向不是難事，即使小事也可溫暖別人。","summary_short":"行善助人一向不是難事，即使小事也可溫暖別人。","digest":"行善助人一向不是難事，即使小事也可溫暖別人","points":["行善助人一向不是難事，即使小事也可溫暖別人","一輛白色七人車駛至元朗牡丹街時突然壞車，停在路中心，影響現場交通，尾隨車輛不斷響咹示意…","帖主表示當時「成條街塞晒」，幸有貨車司機落車幫手推車才可「救返成個交通」"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:05:13+08:00","size":1,"keywords":[],"body":"行善助人一向不是難事，即使小事也可溫暖別人。一輛白色七人車駛至元朗牡丹街時突然壞車，停在路中心，影響現場交通，尾隨車輛不斷響咹示意，有4名男子見義勇為上前施援，合在將故障的七人車推前騰出路面空間。帖主表示當時「成條街塞晒」，幸有貨車司機落車幫手推車才可「救返成個交通」。\n今日（19日）有網民於社交平台Threads發文並上載影片，片中見到七人車停在路中心，現場交通嚴重受阻，有車輛更需要駛上行人路才能勉強通過。一名疑為七人車司機的女子站在路邊打電話求助，稱「突然間著唔到車，死咗火呀！」，未幾有外賣員及3名男子合力將七人車推前，讓尾隨的車輛駛過。\n發帖的網民指事件是好人好事，「元朗牡丹街有壞車， 成條街塞晒，好彩貨車阿叔落車幫手推車，救返成個交通」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c25f2af4e4c","title":"澳門大賽車｜今開鑼上演多場排位賽 有內地旅客稱感刺激精彩","url":"https://news.tvb.com/tc/1207261-澳門大賽車今開鑼上演多場排位賽有內地旅客稱感刺激精彩","summary":"一連4日的第73屆澳門格蘭披治大賽車，今日開鑼。首日上演多場自由練習及排位賽，其中澳門四級方程式大賽自由練習期間，多架車先後在葡京灣撞欄，一度要出示紅旗暫停。","summary_short":"一連4日的第73屆澳門格蘭披治大賽車，今日開鑼。","digest":"一連4日的第73屆澳門格蘭披治大賽車，今日開鑼","points":["一連4日的第73屆澳門格蘭披治大賽車，今日開鑼","首日上演多場自由練習及排位賽，其中澳門四級方程式大賽自由練習期間，多架車先後在葡京灣撞欄…","不少觀眾用手機，拍下車手風馳電掣的一刻"],"section":"港聞","category":"澳門","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T16:26:00+08:00","size":1,"keywords":["賽車","澳門大賽車"],"body":"一連4日的第73屆澳門格蘭披治大賽車，今日開鑼。\n\n首日上演多場自由練習及排位賽，其中澳門四級方程式大賽自由練習期間，多架車先後在葡京灣撞欄，一度要出示紅旗暫停。不少觀眾用手機，拍下車手風馳電掣的一刻。\n\n深圳旅客唐先生說：「朋友推薦說(拍攝)賽車不錯，我剛好有這設備可以拍到。希望拍到賽車競逐的畫面，互相追逐和超越的畫面。」\n\n北京旅客柯先生稱：「覺得非常刺激和比較精彩，以前只是在電視和網絡上看過，沒有實際真正在現場看過比賽，所以看了非常震驚。」\n\n安哥拉留學生表示：「這其實是我第一次觀賽。我也很喜歡車，能來到這裡觀看賽車感受非常好。」","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026qm3YIUmtsI1795077699.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/db7d1b7b983d4a16997fc36565fe3c8a/63edd45d6e824e02a602c541b2b4b06d-4e388121eddff3fea8fd75f9458ac790-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026qm3YIUmtsI1795077699.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c6c816084c7","title":"社評摘要｜AM730：天價公廁獲日獎宜反思／經濟：中美博弈暗潮湧","url":"https://news.tvb.com/tc/1207172-社評摘要AM730天價公廁獲日獎宜反思經濟中美博弈暗潮湧","summary":"AM730社評：世界廁所日，香港廁所協會公布今年最佳公廁選舉結果，獲獎前列公廁，多在人流和旅客較少的公園之內，惟整體香港核心商業旅遊區，例如油尖旺和銅鑼灣等地公廁，其實數量不足…","summary_short":"AM730社評：世界廁所日，香港廁所協會公布今年最佳公廁選舉結果，獲獎前列公廁，多在人流和旅客較少的公園之內…","digest":"AM730社評：世界廁所日，香港廁所協會公布今年最佳公廁選舉結果，獲獎前列公廁…","points":["AM730社評：世界廁所日，香港廁所協會公布今年最佳公廁選舉結果，獲獎前列公廁…","與其將昂貴公廁成本投放在偏遠地點，政府應反思天價公廁的資源運用，善用市場力量…","經濟日報社評：輝達在創辦人黃仁勳辭職後交出亮麗業績，同時宣布停止向華出貨芯片…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T07:45+08:00","size":2,"keywords":[],"body":"AM730社評：世界廁所日，香港廁所協會公布今年最佳公廁選舉結果，獲獎前列公廁，多在人流和旅客較少的公園之內，惟整體香港核心商業旅遊區，例如油尖旺和銅鑼灣等地公廁，其實數量不足，往往依靠商場和商店提供給旅客使用。\n\n與其將昂貴公廁成本投放在偏遠地點，政府應反思天價公廁的資源運用，善用市場力量，以協力模式補充核心旅遊區廁所不足，讓公帑用得其所，旅客體驗切實提升。\n\n經濟日報社評：輝達在創辦人黃仁勳辭職後交出亮麗業績，同時宣布停止向華出貨芯片，並成立國安與出口管制委員會。這些舉措除了是企業合規調整，同時是配合美國國會反華鷹派，收緊芯片圍堵，改寫AI生態規則，中美科技戰升級的新開端。\n\n科技戰與貿易戰疊加爆發的系統性風險正在升溫，雙方關係如何維持穩定，備受考驗。中美雙方都承受不起科技戰與貿易戰疊加爆發的風險，雙方需展現政治智慧，將AI競爭限制在技術賽道。","image":"https://pro-vod-cdn.tvb.com/41149895856844f6a2fb6fec759aa9b8/snapshots/a1993056fdf24b4582bc35194da40160-00008.jpg","video":"https://pro-vod-cdn.tvb. 常務副校長等高層的免職理由。\n\n教務會亦重組及賦權規管學生行為紀律，包括撤銷被刑事定罪，學術不端或有損校譽的學生學位。有份提交草案的立法會議員鄧家彪指，修例旨在理順內容，強調各書院地位不會改變。","image":"https://pro-vod-cdn.tvb.com/3f158507b7e34cefb63e83b873f18dc9/snapshots/7102398be1424562b9222ffd424fd64e-00008.jpg","video":"https://pro-vod-cdn.tvb.com/3f158507b7e34cefb63e83b873f18dc9/ee3c4bcbe6b741b2b96e229775290596-782d20d00c33e893b5d3bde8054d780d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/3f158507b7e34cefb63e83b873f18dc9/snapshots/7102398be1424562b9222ffd424fd64e-00008.jpg","lang":"zh-Hant"},{"id":"c554ae471cf","title":"香港大學站連續2日信號設備故障 港島綫行車時間一度調整","url":"https://www.stheadline.com/breaking-news/3638756/香港大學站連續2日信號設備故障-港島綫行車時間一度調整","summary":"香港大學站連續兩日早上發生信號故障，今日（19日）早上約8時17分，港鐵表示，由於香港大學站附近有信號設備故障，列車行經該路段需要慢駛，整體行車時間（總站至總站）預計需要額外5至8分鐘。","summary_short":"香港大學站連續兩日早上發生信號故障，今日（19日）早上約8時17分，港鐵表示，由於香港大學站附近有信號設備故障…","digest":"香港大學站連續兩日早上發生信號故障，早上約8時17分，港鐵表示…","points":["香港大學站連續兩日早上發生信號故障，今日（19日）早上約8時17分，港鐵表示…","港鐵人員經處理後，至早上約8時42分信號設備故障已修復，港島綫列車服務陸續恢復正常","相關新聞：香港大學站附近信號設備故障 港島綫列車服務一度受阻近2小時"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:43:13+08:00","size":1,"keywords":[],"body":"香港大學站連續兩日早上發生信號故障，今日（19日）早上約8時17分，港鐵表示，由於香港大學站附近有信號設備故障，列車行經該路段需要慢駛，整體行車時間（總站至總站）預計需要額外5至8分鐘。港鐵人員經處理後，至早上約8時42分信號設備故障已修復，港島綫列車服務陸續恢復正常。\n相關新聞：香港大學站附近信號設備故障 港島綫列車服務一度受阻近2小時\n周三香港大學站信號設備故障：\n昨日（18日）早上8時46分，香港大學站附近亦發生信號設備故障，列車行經該路段需要慢駛，港島綫列車服務受阻近2小時，整體行車時間一度需要延長最多達8分鐘，至早上10時36分信號設備故障經修復，港島綫列車服務陸續恢復正常。\n事發時正值上班繁忙時間，有網民在社交平台上載相片，所見北角站的月台擠滿候車乘客。亦有網民發文指：「港島綫壞信號，已淪陷。」不過，亦有市民拍得金鐘站情況，所見人流暢順，並未出現擠塞情況。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c59fd12889c","title":"龍翔道救護車遭私家車撞尾 行車線一度封閉","url":"https://www.stheadline.com/breaking-news/3638755/龍翔道救護車遭私家車撞尾-行車線一度封閉","summary":"今日（19日）早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵鑽石山站對開時，與尾隨一輛私家車相撞。","summary_short":"今日（19日）早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵鑽石山站對開時，與尾隨一輛私家車相撞。","digest":"早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵鑽石山站對開時…","points":["今日（19日）早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵 ords":[],"body":"11月18日，香港旅游发展局主办的“香港缤纷冬日巡礼”启动，其中焦点活动“香港冬日小镇”将首次扩展至中环、尖沙咀及铜锣湾，并将精选一系列“只在香港”的特色美食和地道手信，吸引游客消费。\n\n有进驻“香港冬日小镇”的商户表示，期待会迎来许多游客，让销售额有显著增长，并将此次冬季盛事看做向游客介绍自己的机会。(记者 温孟馨)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/18/chinanews/MEIZI_YUNSHI/onair/38F95D2B64D54FB2A5E1D7AAAB38732C.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c58e8f028c1","title":"大棋盤︱ 《建築物條例》 修訂今出台 加強罰則打擊嚴重僭建物 涉民生輕微個案規範化處理","url":"https://www.stheadline.com/politics/3638736/大棋盤-建築物條例-修訂今出台-加強罰則打擊嚴重僭建物-涉民生輕微個案規範化處理","summary":"發展局於2024年底提出修訂《建築物條例》，針對沒有遵從強制驗樓、涉及「嚴重僭建物」的業主提高罰則，包括建議引入定額罰款。","summary_short":"發展局於2024年底提出修訂《建築物條例》，針對沒有遵從強制驗樓、涉及「嚴重僭建物」的業主提高罰則…","digest":"發展局於2024年底提出修訂《建築物條例》，針對沒有遵從強制驗樓…","points":["發展局於2024年底提出修訂《建築物條例》，針對沒有遵從強制驗樓…","立法會發展事務委員會下周二討論修例建議，預料政府今日向立法會提交文件介紹詳情…","政府兩年前提出修訂建議，將僭建物區分為與民生相關的「小型違規工程」，以及「嚴重僭建物」…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T07:00:00+08:00","size":1,"keywords":[],"body":"發展局於2024年底提出修訂《建築物條例》，針對沒有遵從強制驗樓、涉及「嚴重僭建物」的業主提高罰則，包括建議引入定額罰款。立法會發展事務委員會下周二討論修例建議，預料政府今日向立法會提交文件介紹詳情，當中擬加重「嚴重僭建物」的罰則，意味即使是有財力的業主，也非只是輕輕罰款了事。\n發展局2024年提修訂建議 嚴重僭建罰30萬元\n本港僭建問題由來已久、錯綜複雜，且並非只限新界或村屋，低密度豪宅亦經常出現非法搭建物，在外牆加建簷篷架等，現實上難以全部處理。政府兩年前提出修訂建議，將僭建物區分為與民生相關的「小型違規工程」，以及「嚴重僭建物」，前者只要證實安全，可較寬鬆處理，後者必須取締。\n2023年一場世紀暴雨，更意外揭發紅山半島多間獨立屋「向下僭建」跟單位面積相若的一層或兩層地下室，令社會譁然，地政總署及屋宇署其後大規模巡查，向違規業主提出檢控。部分業主已被法庭定罪，例如今年1月三幢獨立屋業主因僭建被判處罰款6萬元至13萬元不等。亦有業主因牽涉僭建花園和平台、佔用官地等多宗罪，合共被罰款98萬元，屬同一屋苑案件中刑罰最重。\n當局前年提出修訂《建築物條例》，針對僭建地庫、圍封天台等「嚴重僭建物」，建議從提高罰則至30萬元及監禁兩年，並降低檢控門檻、引入新罪行等，以提升阻嚇力。至於現存的小型僭建物，即未有按小型工程監管制度規定建造的僭建物，考慮到規模較小，並與市民日常生活息息相關，因此建議新增更多「指定豁免工程種類」，即現存的相關工程不再視為「僭建物」，包括指定高度以下的可收合遮篷和晾衣架等。\n民生相關輕微僭建物規範化\n因應去年發生宏福苑大火，政府決定擴大檢視《建築物條例》修訂工作，除改革對樓宇大維修規管、對業界違規加強懲處，亦務實處理僭建這個老大難問題。據悉，發展局最快今日向立法會發展事務委員會提交修例建議文件，下周二討論。\n據了解，當局建議對於風險程度低、與一般民生日常相關的較輕微僭建物，予以規範化；至於嚴重個案，則加強執法及懲處，預料罰則比兩年前提出的建議有稍為調整，總體是比目前罰則增加以倍計。\n議員倡罰則按物業價值計算\n發展事務委員會主席林筱魯認同修例大方向，若輕微僭建物無即時危險，可規範處理，而針對嚴重僭建物應加重罰則，提高阻嚇力，又直言過往司法機構對僭建處理較為「輕手」。他認為，日後針對嚴重僭建物罰款，可一併考慮物業價值，即樓價越高罰則越重，或設立「最低消費」，增加阻嚇力。至於如何釐清「嚴重僭建物」定義，林筱魯指，考慮因素包括是否影響公共安全，例如在旺區舊樓僭建，風險明顯較大。\n補地價換僭建物合法存在？政府不讓步\n近年政府面對財赤，坊間不乏有建議容許業主在申報後透過補地價方式處理，以換取僭建物合法存在，不過僭建物本質屬違法，若然「用錢搞掂」，法理上肯定說不過去，據悉政府在這方面不會讓步。\n政府兩年前曾建議引入新罪行，針對過去有業主辯稱僭建物並非由其搭建，而是購入物業時已存在，自己只是繼承前業主搭建的僭建物，以規避法律責任。林筱魯認為，「不知情」不能成為逃避法律責任的理由，而當中也可能涉及不同情況，例如圖則不清晰、買賣雙方及相關專業人士是否有責任，審議時亦須仔細討論。\n過往僭建問題時被質疑執法力度不足，又甚少重罰規違規業主，今次政府決定大幅提高罰則，從嚴執法，向違規者釋出並非「有錢大晒」的訊息，相信可收阻嚇作用。\n\n聶風","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ccaa8599180","title":"天文台｜天氣顯著轉涼 日間最高氣溫約22度 晚上市區氣溫下降最低約18度","url":"https://www.stheadline.com/society/3638747/天文台天氣顯著轉涼-日間最高氣溫約22度-晚上市區氣溫下降最低約18度","summary":"一股強烈東北季候風正影響廣東沿岸。","summary_short":"一股強烈東北季候風正影響廣東沿岸。","digest":"一股強烈東北季候風正影響廣東沿岸","points":["一股強烈東北季候風正影響廣東沿岸","本港方面，今早多處地區氣溫較昨日低三至四度左右","晚上市區氣溫下降至午夜最低約18度，新界再低兩三度"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T06:33:00+08:00","size":1,"keywords":[],"body":"一股強烈東北季候風正影響廣東沿岸。同時，一道雲帶覆蓋華南。本港方面，今早多處地區氣溫較昨日低三至四度左右。\n本港地區今日天氣預測，大致多雲，有一兩陣微雨，天氣顯著轉涼。日間最高氣溫約22度。晚上市區氣溫下降至午夜最低約18度，新界再低兩三度。吹和緩至清勁偏北風，離岸及高地間中吹強風。\n展望明日有幾陣雨，氣溫進一步下降至市區最低約15度，新界再低兩三度。星期六漸轉天晴，但早上仍然相當清涼。隨後一兩日雲量增多，風勢頗大，氣溫稍為回升。\n分區氣溫\n九天天氣預報\n受強烈東北季候風及一道雲帶影響，華南地區今明兩日顯著轉涼，未來一兩日廣東沿岸相當清涼，內陸地區早晚寒冷。隨著覆蓋廣東的雲帶在週末轉薄，該區日夜溫差較大，早上仍然相當清涼。預料一股達強風程度的偏東氣流會在下週初影響華南沿岸，該區雲量增多，氣溫稍為回升。而另一股東北季候風會在下週中期影響華南，該區氣溫將再度下降及有幾陣雨。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cef52cadf70","title":"北角電燈中心有變壓器故障起火 一名港燈員工被燒傷清醒送院","url":"https://news.tvb.com/tc/1207138-北角電燈中心有變壓器故障起火一名港燈員工被燒傷清醒送院","summary":"北角電燈中心有變壓器故障並起火，一名港燈員工被燒傷，清醒送院。事發後警方派員到場調查，港燈亦派職員了解情況。","summary_short":"北角電燈中心有變壓器故障並起火，一名港燈員工被燒傷，清醒送院。","digest":"事發後警方派員到場調查，港燈亦派職員了解情況","points":["事發後警方派員到場調查，港燈亦派職員了解情況","警方下午約5時接報，指城市花園道電燈中心的變壓器房發生火警，消防到場將火救熄…","一名28歲男職員雙手及面燒傷，清醒送院治理"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-18T23:53+08:00","size":1,"keywords":[],"body":"北角電燈中心有變壓器故障並起火，一名港燈員工被燒傷，清醒送院。\n\n事發後警方派員到場調查，港燈亦派職員了解情況。\n\n警方下午約5時接報，指城市花園道電燈中心的變壓器房發生火警，消防到場將火救熄，約200人自行疏散。\n\n一名28歲男職員雙手及面燒傷，清醒送院治理。據了解他當時到變壓器房取工具，期間變壓器突然爆炸。\n\n消防指相信起因無可疑，懷疑是因低壓設備出現異常引致短路。港燈就指，中心部分樓層供電受影響，客戶電力供應則維持正常，會進一步檢查相關設備。","image":"https://pro-vod-cdn.tvb.com/05f762f6f09e4a20ae0c7d77eabfd8ed/snapshots/9d5859ef820447e0a670085d44b40a4d-00005.jpg","video":"https://pro-vod-cdn.tvb.com/05f762f6f09e4a20ae0c7d77eabfd8ed/2dc90569c20b475bad8e8c5115a0ec84-ee7f2aa0a4ec0b467457aff6618a3f65-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/05f762f6f09e4a20ae0c7d77eabfd8ed/snapshots/9d5859ef820447e0a670085d44b40a4d-00005.jpg","lang":"zh-Hant"},{"id":"c299861007c","title":"圖輯｜中環22米高聖誕樹亮燈吸引不少市民打卡 有外國旅客盛讚氣氛好","url":"https://news.tvb.com/tc/1207141-圖輯中環22米高聖誕樹亮燈吸引不少市民打卡有外國旅客盛讚氣氛好","summary":"「香港冬日小鎮」即日起展開，今年首度擴展至中環、尖沙咀及銅鑼灣三個地點。在中環皇后像廣場花園，高22米的聖誕樹傍晚起亮燈，閃閃發光。","summary_short":"「香港冬日小鎮」即日起展開，今年首度擴展至中環、尖沙咀及銅鑼灣三個地點。","digest":"「香港冬日小鎮」即日起展開，今年首度擴展至中環、尖沙咀及銅鑼灣三個地點","points":["「香港冬日小鎮」即日起展開，今年首度擴展至中環、尖沙咀及銅鑼灣三個地點","在中環皇后像廣場花園，高22米的聖誕樹傍晚起亮燈，閃閃發光","包括終審法院在內附近九座標誌性建築的外牆，每晚7時至11時都有定時投映"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-18T23:12+08:00","size":1,"keywords":[],"body":"「香港冬日小鎮」即日起展開，今年首度擴展至中環、尖沙咀及銅鑼灣三個地點。\n\n在中環皇后像廣場花園，高22米的聖誕樹傍晚起亮燈，閃閃發光。包括終審法院在內附近九座標誌性建築的外牆，每晚7時至11時都有定時投映。廣場花園就化身成歐陸風格火車站，內有小木屋，還有市集。\n\n吸引不少市民及旅客前來。\n\n海南旅客李小姐說：「燈光很好看，然後還有聖誕樹，然後還有投在這個樓上面的那個投影，很漂亮。氛圍很好，就像一個聖誕小鎮的感覺。」\n\n加拿大旅客Justin說：「很好，這裡的氛圍比加拿大更好，所有燈光和氣氛太好了，這裡效果令人難以置信。」\n\n李先生說：「變美了很多，比去年還有更多東西，我應該會再去尖沙咀那個。」\n\n如果中環冬日小鎮太多人，亦可考慮到銅鑼灣的冬日小鎮，那裡將會打造成精靈村莊，同樣在大廈外牆有光影表演，下周三正式開放。\n\n至於首度舉辨「冬日小鎮」的尖沙咀。聖誕鹿、松鼠等光影圖案亦現身香港文化中心。太空館變成聖誕水晶球三個地點的活動，明年1月5日結束。公眾可以免費入場。","image":"https://pro-vod-cdn.tvb.com/14627e6a5ba041c9932a04080e7c6e71/snapshots/6a1587f67f9242b1acff4b60157e5e4a-00008.jpg","video":"https://pro-vod-cdn.tvb.com/14627e6a5ba041c9932a04080e7c6e71/a2fd44b2f488464991adeba630ee3534-45c3137c5735476f71a273cc6d5e3673-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/14627e6a5ba041c9932a04080e7c6e71/snapshots/6a1587f67f9242b1acff4b60157e5e4a-00008.jpg","lang":"zh-Hant"},{"id":"cde037a5070","title":"「幻彩詠香江」告別演出特別加添煙火元素 不少市民尖沙咀海旁舉機講再見","url":"https://news.tvb.com/tc/1207139-幻彩詠香江告別演出特別加添煙火元素不少市民尖沙咀海旁舉機講再見","summary":"「幻彩詠香江」晚上作告別演出。踏正晚上8時，有22年歷史的「幻彩詠香江」，特別加添煙火元素作為它的告別作。","summary_short":"「幻彩詠香江」晚上作告別演出。","digest":"「幻彩詠香江」晚上作告別演出","points":["踏正晚上8時，有22年歷史的「幻彩詠香江」，特別加添煙火元素作為它的告別作","不少市民在尖沙咀海旁，舉機跟它講再見","張女士說：「最後一次了，我都是第一次那麼認真看，不夠澎湃、都還算可以"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-18T23:10+08:00","size":1,"keywords":[],"body":"「幻彩詠香江」晚上作告別演出。\n\n踏正晚上8時，有22年歷史的「幻彩詠香江」，特別加添煙火元素作為它的告別作。不少市民在尖沙咀海旁，舉機跟它講再見。\n\n有市民就想更近距離見證，登上觀光船。\n\n張女士說：「最後一次了，我都是第一次那麼認真看，不夠澎湃、都還算可以。」\n\n伍先生說：「我特意買票上來看，氣氛非常好，及在這裡是很接近整個維港。」\n\n最後一次上演的「幻彩詠香江」，跟以往一樣歷時10分鐘，有40多幢大廈參加。在這艘船上除了可看匯演，更可與一班親朋好友吃蛇宴，歌手李龍基都是座上客。\n\n李龍基說：「今天是蛇羹、好東西來的，希望這個(幻彩詠香江)停了後，有更燦爛的東西給我們。」\n\n觀光船營運總監葉定國指，相信單靠維港本身景色，仍能吸引旅客遊覽。","image":"https://pro-vod-cdn.tvb.com/7bf811c4946645669ec34539746d0f06/snapshots/b88da6d9aacc4847bc0496cd6f9e02f6-00008.jpg","video":"https://pro-vod-cdn.tvb.com/7bf811c4946645669ec34539746d0f06/f2fba0594d3c4faf8942759d477c75b3-44239f272fc186f8324ef2ad832fe13b-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/7bf811c4946645669ec34539746d0f06/snapshots/b88da6d9aacc4847bc0496cd6f9e02f6-00008.jpg","lang":"zh-Hant"},{"id":"c07b45dcbcb","title":"港鐵：香港大學站信號設備故障已修復 港島綫列車服務陸續恢復正常","url":"https://news.tvb.com/tc/1207174-港鐵香港大學站信號設備故障已修復港島綫列車服務陸續恢復正常","summary":"[08:45]港鐵：早前的信號設備故障已修復，港島綫列車服務陸續恢復正常。[08:10]港鐵：香港大學站有信號設備故障，來往堅尼地城站及柴灣站的行車時間預計需要額外5至8分鐘。","summary_short":"[08:45]港鐵：早前的信號設備故障已修復，港島綫列車服務陸續恢復正常。","digest":"[08:45]港鐵：早前的信號設備故障已修復，港島綫列車服務陸續恢復正常","points":["港鐵：香港大學站有信號設備故障，來往堅尼地城站及柴灣站的行車時間預計需要額外5至8分鐘"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T08:44:00+08:00","size":1,"keywords":["港鐵"],"body":"[08:45]\n港鐵：早前的信號設備故障已修復，港島綫列車服務陸續恢復正常。\n\n[08:10]\n港鐵：香港大學站有信號設備故障，來往堅尼地城站及柴灣站的行車時間預計需要額外5至8分鐘。","image":"https://pro-img-cdn.tvb.
