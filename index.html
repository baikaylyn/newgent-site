到15%或20%，而不是4%。我會非常迅速地還清債務，這才是應有的運作方式，但我們反其道而行之。\n\n看看印度，他們利率低，國內生產總值達7%，我們有14%到15%，甚至可能20%的GDP，當你做得這麼好，他們卻提高利率，但事實是我們已突破困境、我們實際上已經突破了困境，儘管有人試圖阻撓，我不知道為甚麼，你不想讓這個國家真正富裕和偉大嗎？也許每個點降低六百五十億美元，所以我們應該擁有全球最低的利率。\n\n世界上任何地方，因為我們是那個，我們是讓其他國家成功的國家，其中一些被視為金融精英，但他們並非精英，他們只因我們才成為精英，我們應該擁有以往一直有的低利率，即使我們當時表現不佳。我們擁有全球最低的利率，現在他們卻不斷加息，如果我們表現良好，就繼續加息直到我們可能表現不佳，但事實是我們正衝破這一切和所有迷霧。\n\n我們正創造着無人敢信的數字，以工廠為例，因關稅而興建了數千家工廠，因為他們不想付錢，他們不必支付關稅，當他們進來時，你會看到價格下降，但你看到數千家工廠正在興建，汽車公司都在回流。他們曾被從我們這裏偷走、被其他國家偷走，從德國到日本、韓國、加拿大、墨西哥，它們正以前所未有的數量回歸。它們目前正在建設中，奧迪剛宣布一項40億美元計劃，豐田正在建設50億美元工廠，大家都在建廠，通用汽車也在擴張，福特正瘋狂擴張，你記得那個那個工廠在底特律最老的工廠，我想差不多是全國最大的工廠之一，也許是最大且最老的，福特正準備關閉它，但他們說，等等看那場選舉的結果。\n\n2024年，因為特朗普有些想法，他們準備關閉它，因為沒有生意，我想它建於1906年，是最古老的工廠之一，可能是全國最古老的工廠，也是最大的之一，現在正在運轉，每周七天全天候運行。他們需要更多空間準備擴建，所以他們不關閉，反而準備擴建，這就是訂單運作方式，所以肖恩·費恩前幾天打電話來感謝我，他原本不站在我這邊，他是個激進民主黨人，但他喜歡這份工作，他其實不敢相信，其他工人一直很出色、卡車司機們也很出色。至於工作權，他們一直很出色、每個人都很出色，因為他們明白正在發生甚麼，我認為我們在選舉前沒有傳達這一點，但這太遺憾了，不過再說一次，如果我參選，你只需看看麥克勞克林的民調數字，如果我參選，結果會完全不同，但我不在選票上，人們認為共和黨待我不公，因為他們沒滿足我的要求，他們無法在參議院通過，但希望現在能通過，我們的軍隊，以及這裏所有其他事項，空中交通管制，我們必須解決，昨晚具有里程碑意義，許可改革法案已在參議院通過，這是你將看到的最重大事項之一，這是一件大事，所以那項通過了，我認為我們能推動它通過的，原因之一是他們必須讓它通過。\n\n現在提交眾議院，若通過預計將投入至少每年一千三百美元，回到辛勤工作的美國人口袋，這將帶來大量新建設，加上已有的紀錄、建築業就業人數創紀錄，因為他們正在興建所有新廠房，這些廠房正在拔地而起，超級智能工廠，我們有很多這樣的設施、數據中心，我們將為數據中心全力爭取，因為我們不會讓中國、我們領先中國，習主席祝賀我們在各方面的出色表現。\n\n而且還有關於超級智能，他也喜歡這個名字，順便說一句，他更喜歡這個，正如他所說，這個更準確，它是超級，它不是人工智能，它不是人工的，它是超級的，它可能太超級了，我們將共同設立一些防護措施，就我們兩個，因為確實沒有第三家，我的意思是，我們遙遙領先、我們遙遙領先，他們排第二，而且差距很大，我認為以後也不會有人追上。\n\n但記住，誰贏得超級智能，誰就贏，誰贏得超級智能誰就贏，你們要利用數據中心，讓他們付錢給你們，讓他們付錢給你們的社區，但要利用好機會，不要拒絕他們，這個國家總會有其他人，但如果不是這個國家，我們不會允許我們的公司在我們國家以外建設數據中心，我們不會允許這種事發生，你知道他們曾允許芯片等外流，破壞性很大。\n\n對我們國家而言，我們就是從那時開始落後，所以我不確定這是否算突發新聞，但我甚至還沒跟我的人提過，不過我現在告訴他們，他們都在這裏，他們中許多人都在這裏，我們不會允許企業在其他國家建設數據中心，如果他們這樣做，他們可以，但我們將對他們徵收巨額稅，如果他們這樣做，我們希望他們在這裏建設，如果他們不願去德州，或者不願去，加州他們會去，西維珍尼亞他們會去，我們有很多地方急需他們，那些都是擁有能源的好地方。\n\n而且他們甚麼都有，那裏有巨大的資產，勞登縣旁邊有個地區，他們有很多數據中心，他們賺的錢多到不知怎麼花，你們會賺很多錢，你們的稅會減少，他們會自己發電，所以電價會下降。實際上，你們的電費會下降，你們可以自行協商協議。理想情況下，你們的領導人可以協商協議，有一種情況，他們向教師支付五萬美元，以便在路易斯安那州獲批。另一地則向當地居民發放一萬美元、每人一萬，我沒意見，達成交易吧，他們有的是錢，拿去吧。\n\n但我們不允許數據中心進入其他國家，因為中國會全部拿走，我們不允許這種情況發生，我們將對試圖這樣做的公司處以鉅額罰款，他們想在芬蘭建一個我們不允許這種情況發生。\n\n所以此行所到之處會見的每位領袖，很明顯，美國再次受到尊重、前所未有地受到尊重，我非常榮幸習主席迎接我們的國家，讓我迎接我們的國家，在飛機旁，這是前所未有的，這意味着他尊重我們的國家。我可以告訴你，他沒有在飛機旁會見瞌睡喬。\n\n馬尼拉之行非常精彩，齊聚一堂，四大太平洋強國領袖，美國、印度、澳洲和日本都是出色的領袖，也是我的好朋友，與其中很多人都是朋友，與少數人是敵人。我們宣布了首屆四方領導人論壇，就經濟安全與供應鏈韌性展開合作，非常重要，我們啟動了新的四方超級智能加速器，協調我們四國共同發展超級智能，但我要告訴你們，我們將在有限基礎上進行，但我們遙遙領先，並將其留在國內。\n\n這項計劃早已啟動並蓬勃發展，但我們想把它留在國內，很高興能說我們正與其他國家合作，在國內建設我所期望的項目，這比工業革命更宏大，信不信由你。他們是這麼說的，我也同意，我同意這個說法，剛剛進行了一次非常成功的人類智能、非常成功的發布對達里奧充滿敬意，而且創下了紀錄，我們會把這一切留在這個國家，我們不希望它們離開去別處建廠，因為我們愚蠢不給批准，他們本該獲得的批准，你知道他們得不到批准，就會去別的地方。很多國家都想要他們，接下來他們就會在太空建造，這也可能發生，對吧？\n\n我們推出了新的四方超級智能加速器，協調我們四國共同發展，服務於我們共同利益的超級智能，但相比之下，我們對此關注甚少，我們也同意四方國家之間展開新合作、海上安全與監視行動，這很重要。\n\n如你所知，我們有格陵蘭，昨天剛剛獲批，大家都說，你永遠拿不到，但我們拿到了，而且我們強有力地擁有它，這給了我們巨大的保護。我要感謝丹麥，我要感謝馬克·魯道夫，一群非常優秀的人，我的意思是，馬克·魯特是位出色的領袖，他是個了不起的人，他為北約做了很多好事，非常出色。\n\n以及網絡安全和防禦、海底電纜，我們希望這些都能處理好，因為人們往往非常老練，我不會說我們這麼做，但我們可能也這麼做，但我不想談這個，我們能做到，但他們做不到，當天晚些時候在馬尼拉我向十四國領導人發表講話，東盟各國在東盟夏季峰會上，以及整個東南亞、邊境地區，所有那些邊境地區，對美國的愛與尊重非同尋常，他們再次尊重我們。","image":"https://pro-vod-cdn.tvb.com/e502b089c42c4959a7fab91287e4906d/snapshots/a413d5bcf2d546cebf63d3b9574e7ffb-00008.jpg","video":"https://pro-vod-cdn.tvb.com/e502b089c42c4959a7fab91287e4906d/5193cf19f85043d99947e2af241d2f3b-19ac4632c26cfad93547530ef40ef84d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e502b089c42c4959a7fab91287e4906d/snapshots/a413d5bcf2d546cebf63d3b9574e7ffb-00008.jpg","lang":"zh-Hant"},{"id":"c4e0a84f08f","title":"联合国助理秘书长：儿基会同中国合作正惠及世界更多儿童","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735596.shtml","summary":"中新社北京11月20日电 (记者 官逸伦)“我在今年早些时候访问加沙地带时，亲眼见证了这一伙伴关系带来的影响：中国支持联合国儿童基金会，提供挽救生命的医疗和过冬物资。","summary_short":"中新社北京11月20日电 (记者 官逸伦)“我在今年早些时候访问加沙地带时…","digest":"“我在今年早些时候访问加沙地带时…","points":["中新社北京11月20日电 (记者 官逸伦)“我在今年早些时候访问加沙地带时…","”联合国助理秘书长、联合国儿基会副执行主任泰德·柴班20日在北京出席活动时如是说","自1979年以来，联合国儿基会与中国政府紧密合作，在教育、卫生、营养、儿童保护…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T23:07:47+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 (记者 官逸伦)“我在今年早些时候访问加沙地带时，亲眼见证了这一伙伴关系带来的影响：中国支持联合国儿童基金会，提供挽救生命的医疗和过冬物资。”联合国助理秘书长、联合国儿基会副执行主任泰德·柴班20日在北京出席活动时如是说。\r\n\n　　11月20日是世界儿童日。由中国儿童中心和联合国儿基会主办的世界儿童日暨联合国儿童基金会成立80周年主题活动当日举行。\n\n　　柴班称，中国支持联合国儿基会应对冲突和灾害的应急响应工作，支持在低收入国家实施的发展项目，为推动全球加快实现联合国可持续发展目标作出贡献，并在应对气候变化、在数字和人工智能领域为儿童创造机遇等行动中发挥着重要作用。\n\n　　今年是联合国儿基会成立80周年。自1979年以来，联合国儿基会与中国政府紧密合作，在教育、卫生、营养、儿童保护、青年赋能和南南合作等多个领域不断取得成果。\n\n　　回顾过去，柴班表示，在中国，持续的政治意愿和人力资本投入，推动儿童事业发展取得长足进步。“如今，中国已能为其他国家提供支持，并成为联合国儿基会最重要的合作伙伴之一。”\n\n　　在外国驻华使团长、喀麦隆驻华大使马丁·姆巴纳看来，中国的发展历程显示出一国持之以恒的努力能取得怎样的成就。他表示，通过改革开放和现代化建设，中国使数亿人摆脱极端贫困，儿童也得以从健康、教育和生活水平的重大提升中获益。\n\n　　据姆巴纳介绍，喀麦隆、中国以及联合国儿基会正在强化医疗卫生与营养服务等方面携手合作，预计约有200万人将从这一合作关系中受益。\n\n　　“这些数字的背后，是拥有健康起点的儿童、能够获得更安全饮用水的家庭，以及为未来做好更充分准备的社区。”姆巴纳说。\n\n　　柴班表示，增进儿童福祉源于一次次的选择。他呼吁各方选择倾听儿童心声，选择投资儿童、维护儿童权利、守护儿童福祉。“因为选择儿童，就是选择全人类更美好的明天。”(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2e2d5f5dde","title":"美國明星河馬誤吞遊客帽死於併發症 有人認為可避免悲劇","url":"https://news.tvb.com/tc/1207539-美國明星河馬誤吞遊客帽死於併發症有人認為可避免悲劇","summary":"美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症。大批遊客到動物園悼念，有人認為園方本來可以避免悲劇發生。","summary_short":"美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症。","digest":"美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症","points":["美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症","大批遊客到動物園悼念，有人認為園方本來可以避免悲劇發生","美國俄亥俄州辛辛那提動物園，表示現年9歲的河馬FIONA，因上周吞下意外吹入棲息園區…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T23:00:00+08:00","size":1,"keywords":["美國","併發症","河馬"],"body":"美國一隻早產奇蹟存活的明星河馬，日前意外吞下遊客的帽，最終死於併發症。大批遊客到動物園悼念，有人認為園方本來可以避免悲劇發生。\n\n美國俄亥俄州辛辛那提動物園，表示現年9歲的河馬FIONA，因上周吞下意外吹入棲息園區，一頂屬於遊客的冷帽，周四死於併發症。\n\n園方解釋，事發後一直監察FIONA的情況，起初牠無症狀，園方認為成年的牠已經夠大，可以排出這個細小異物，但後來發現牠食慾下降，於是為牠注射鎮靜劑展開檢查。\n\n經諮詢獸醫等專家意見後，認為FIONA不適合接受手術，取出異物，原因包括牠的消化系統複雜，需要在牠身體開多個切口，尋找異物的位置，加上皮膚較厚難以麻醉，以及在手術後的康復階段，牠無法浸在水中，保持皮膚濕潤，只能夠協助牠消化及排出冷帽，包括餵牠進食喜愛的食物，但依然無效。\n\nFIONA於2017年早產出生時，比河馬最輕的出生體重紀錄，輕11公斤，無法自行站立或由母親照顧。\n\n園方將牠交由工作人員照顧，並將牠的成長過程在網上公開，吸引大批海內外網民關注及打氣，牠亦成為希望的象徵。\n\nFIONA逝世的消息傳出後，不少人到動物園獻花悼念，部分人神情哀傷。有居民及遊客表示，由FIONA出生起一直關注牠，對牠離世感到非常傷心，又認為悲劇可以避免。\n\n遊客哈基說：「我原本以為牠可以撐過去，我今早還看到她聞咖啡的影片，我當時抱有希望，所以現在非常難過，這是一個令人心碎的損失，而且不幸的是此事可以避免，但它是一場離奇意外。」\n\n動物園亦強調，FIONA吞下冷帽純屬意外，指一名遊客隔著玻璃觀看FIONA時，將冷帽向上拋，結果被吊扇勾住及飛向玻璃觀賞窗上方的空隙，跌落棲息園區。\n\n辛辛那提動物園並非首次發生涉及遊客的動物死亡事故。在FIONA出生前一年，即2016年，一名男孩爬入大猩猩園區，一隻深受歡迎的17歲大猩猩抱起他，工作人員出於男孩安全起見，開槍射殺大猩猩，做法引起極大爭議，而男孩只是受傷，無生命危險。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026IuQoBhtuCn1795188005.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/26f6ab6fc6174bddab9a83b9046c02b1/3cf9b9dee6954d15a6114640da14849f-15d8584298c74c9d1b2c36bc89daef8a-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026IuQoBhtuCn1795188005.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"}]},{"name":"民生","total":32,"items":[{"id":"c3e4924cf6c","title":"“无氟”成为新卖点 买冲锋衣值得为“无氟”多花钱吗","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735661.shtml","summary":"秋冬季节，冲锋衣成为不少消费者出行的必备单品。","summary_short":"秋冬季节，冲锋衣成为不少消费者出行的必备单品。","digest":"秋冬季节，冲锋衣成为不少消费者出行的必备单品","points":["秋冬季节，冲锋衣成为不少消费者出行的必备单品","最近，关于冲锋衣涂层的宣传话术越来越多元，线上直播间、线下门店里…","不少品牌把“无氟”当作核心卖点，暗示传统含氟冲锋衣存在隐患"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T10:46:24+08:00","size":1,"keywords":[],"body":"秋冬季节，冲锋衣成为不少消费者出行的必备单品。最近，关于冲锋衣涂层的宣传话术越来越多元，线上直播间、线下门店里，“无氟更安全”“告别有害氟化物”等宣传语随处可见，产品标价也从几百元一直铺到数千元。不少品牌把“无氟”当作核心卖点，暗示传统含氟冲锋衣存在隐患。\r\n\n　　但很多消费者并不清楚，冲锋衣的无氟与含氟，核心区别在于表面防泼水处理工艺，并非简单的好坏之分。所谓含氟不等于有毒，无氟也并非全场景最优解。如何辨别宣传噱头与真实产品性能，根据自身使用需求选购高性价比的冲锋衣？\n\n　　过去强调防风防水、耐磨透湿的冲锋衣，如今多了一个看似更高级的标签：环保、健康、不含氟。近日，记者在北京一家大型商场的户外品牌门店走访注意到，从几百元到上千元的外穿衣服，吊牌上几乎都写着“无氟防泼水”，门店导购员也向记者介绍了无氟衣服相比含氟衣服的优势。\n\n　　导购员：这种无氟的，吊牌得写。无氟的肯定比含氟的要贵，它比较环保。无氟的防泼水性能会更好，这种无氟的特大暴雨都能防。\n\n　　同一件功能外衣无氟和有氟，究竟差别在哪里？有氟冲锋衣，是不是就一定不好？要回答这个问题，先要拆开“防水”这件事。记者梳理发现，冲锋衣并不靠一层涂层硬扛暴雨，真正决定不渗水的是中间的防水透湿膜、接缝压胶和面料结构；而产生“荷叶滚珠”效果的，是表面的防泼水处理。含氟体系的价值恰恰在这里，对需要蹲在机油旁修车、在厨房与露营之间切换，衣物具备防泼水和拒油性能，确实方便日常打理。\n\n　　社交平台‌‌有博主发帖解释，国内标准也没有把有氟产品一刀切，而是对致癌物PFOA有明确限制。2024年4月起实施的GB/T 32614-2023《户外运动服装 冲锋衣》是推荐性国标，仅在企业标称“无氟整理”时，才考核外层面料中PFOS(全氟辛烷磺酰基化合物)、PFOA(全氟辛酸)的含量。\n\n　　博主：如果用无氟冲锋衣来宣传，那PFOA不能高于1.0μg(微克)/m²。不过，纺织行业对无氟的共识是不得检出含氟有机物，也就是PFAS(全氟和多氟烷基物质)。而冲锋衣国标之所以会有允许残留这样的设定，是考虑到无氟面料的加工会存在被污染的情况。因为染厂的染缸、面料定型机不可能只给一个客户使用，如果染缸定型机槽没有清洁干净，以及水被污染，确实会存在无氟面料检出含氟的情况。国标对无氟冲锋衣PFOA的检出线是为非主观使用含氟聚水剂的情况考虑的。\n\n　　然而，也有相关资料明确表示，PFAS会对人体健康造成潜在的危害，可能会引发一些人体疾病，如癌症、肝损伤、甲状腺疾病和发育问题。当然，消费者也不必谈“氟”色变。近日，北京市消费者协会公布对50个品牌80款冲锋衣的比较试验，80款样品的PFOS、PFOA检出值均在标准限定范围以内。货架上同时存在合规的无氟与有氟产品，不是好坏之分，而是过渡期的路线并存。消费者在选购时查看吊牌是否标注“无氟整理”及执行标准即可，无须为“无氟”概念支付过高溢价。\n\n　　对此，中国纺织建设规划院高级工程师宋立丹认为，冲锋衣含有害物质就一定对身体不好的宣传往往是商家偷换概念制造焦虑，氟化物肯定是有毒的，但任何抛开剂量谈毒性的方式都不严谨。“有氟一定不好”是一个需要纠偏的命题，而无氟路线也并不是把氟拿掉后硬说更好，只是换了一套拒水逻辑。\n\n　　宋立丹：我参考了一些研究，目前没有研究表明穿了有氟防水剂处理的冲锋衣，就会直接造成不适或者健康下降。氟其实就是为了保证冲锋衣防水特性，含氟的防水剂涂在冲锋衣的表面，形成一种“荷叶效应”，泼水上去水马上就能散掉，不会被衣服吸收。迭代技术，发明了一种无氟的防水剂，也可以达到防水效果，是环保的一个新工艺，相对环境来说没有氟就环境友好，避免了这种毒素在环境的积累，导致产生对人体的负面影响。但是无氟的防水剂性能会有所下降，在追求性能和环保之间，我们只能来权衡这个事。\n\n　　宋立丹进一步解释，对符合现行法规、供应链可控的产品，含氟日常穿着风险不应被夸大；真正需要追问的是品牌是否公开物质信息、是否降低不必要排放、是否提供维修与回收。对无氟也一样，不能因为它站在环保叙事里，就豁免对耐久性的拷问。\n\n　　宋立丹：目前在我国市面上正规渠道买到的冲锋衣即使采用了有氟防水，都是安全的。因为服装要上市销售流通，都必须符合国家的基本安全技术规范，这是强制性的。中毒、致癌、身体健康状况不佳，这个风险并不是来自衣服穿在身上，是从它的整个生产过程，还有中间清洗，以及最后处理进入环境之后，在全生命周期里的积累产生的效应，并不是说穿在身上就马上会造成一些健康问题。用了无氟防水之后，我们接受它性能下降，不能宣传无氟之后性能高了，这是不等同的。但是如果说无氟更健康，从长远的环境角度来看，这个确实是成立的。\n\n　　那么，面对有氟和无氟，消费者怎样把预算花在刀刃上？宋立丹建议，如果只是通勤防雨、城市旅行，优先看透湿与舒适，无氟产品往往性价比更高；如果工作常接触油渍，或长线重装穿越对耐脏耐洗要求苛刻，含氟整理赋予织物的拒油、拒水、拒污的“三防”性能，仍有现实优势。\n\n　　监制丨李行健\n\n　　记者丨江晓晨 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdc00560c37","title":"西双版纳曼烈村：通道向边境延伸 “老庚”之约岁岁如常","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735647.shtml","summary":"中新网云南西双版纳11月21日电 题：西双版纳曼烈村：通道向边境延伸 “老庚”之约岁岁如常  　　作者 赶四 龙斯 黄毅林  　　云南省西双版纳傣族自治州勐腊县曼烈村，坐落在中老边境一线…","summary_short":"中新网云南西双版纳11月21日电 题：西双版纳曼烈村：通道向边境延伸 “老庚”之约岁岁如常  　　作者 赶四 龙斯 黄毅…","digest":"题：西双版纳曼烈村：通道向边境延伸 “老庚”之约岁岁如常  　　作者 赶四 龙斯 黄…","points":["云南省西双版纳傣族自治州勐腊县曼烈村，坐落在中老边境一线，距边境线仅5公里","这里没有动车到站，却借着中老铁路带来的通道优势，边民往来、农货外销发生新变化","村里只有两米宽的土路，拖拉机通行都十分费力"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T10:44:31+08:00","size":1,"keywords":[],"body":"中新网云南西双版纳11月21日电 题：西双版纳曼烈村：通道向边境延伸 “老庚”之约岁岁如常\n\n　　作者 赶四 龙斯 黄毅林\n\n　　云南省西双版纳傣族自治州勐腊县曼烈村，坐落在中老边境一线，距边境线仅5公里。这里没有动车到站，却借着中老铁路带来的通道优势，边民往来、农货外销发生新变化。\n\n昆曼公路、中老铁路“同框”。西双版纳州融媒 供图\n\n　　中老铁路通车五年来，持续拓宽跨境交往的空间。这座有着百年建寨史的傣族村寨，把“老庚”之约从零星走动，变成稳定持续的边境日常。“老庚”，是当地对同龄好友的称呼，在边境村寨，这个词往往意味着跨越国界的世代情谊。\n\n　　曼烈在傣语中意为“迎宾的寨子”，但早年间，这条“迎宾路”并不好走。村里只有两米宽的土路，拖拉机通行都十分费力。村民收入主要依靠橡胶种植，增收渠道有限。跨境往来受制于交通条件，村民和老挝南塔省勐新县曼纳坎村的亲友相见，往往要辗转多日。\n\n　　边境幸福村建设启动后，村民主动投工投劳，拆除老旧围墙、杂房，把房前屋后空地打理成花池果园。环村沥青路、村内排水沟、太阳能路灯相继落地，彩虹路、同心亭、幸福亭、空中花园走廊次第建成，村寨面貌焕然一新。\n\n　　铁路通车后，勐腊到勐满的客流明显增多，勐满口岸的跨境通行也更顺畅。勐满口岸与中老铁路联动，跨境贸易和人员往来效率持续提升。外地游客搭乘动车抵达勐腊站后，转乘短途班车即可进入曼烈村；本地农户的果蔬等农特产品，也能借铁路通道销往国内多地。\n\n边民参与中老边民“老庚大赶摆”。赶四 摄\n\n　　村寨抓住机遇，把延续多年的边民赶摆升级为常态化的中老边民“老庚大赶摆”，同步打造中老民族特色美食街，持续开展边境文旅活动。据勐满镇统计，截至2026年11月中旬，曼烈村共举办46期特色边境文旅活动，拉动社会消费超1052.9万元。\n\n　　“我们和老挝勐新县曼纳坎村世代是老庚，大家日常往来就近走勐满口岸，很方便。铁路虽然没有直达到这里，但是把外面的客流带进来，农货也好往外销。”曼烈村民小组党支部书记岩再燕说，这几年下来，老庚大赶摆稳定办起来，国门书社随时敞开，两国边民在这里交易谈心，情谊一直延续。\n\n　　赶摆日的曼烈村民小组，各种摊位依次沿路铺开。傣味包烧、菠萝饭、酸笋煮鸡香气散开，老挝凉菜、老挝咖啡、手工香皂、竹编器物与傣锦、傣家土特产并排摆开。相识多年的老庚围坐闲谈，交换自家出产的物产。不少老挝客商和本地农户形成了稳定供需关系，不再只是赶摆当日短暂碰面。\n\n　　“我们家主要靠割胶，赶摆是额外一笔收入。早些年游客少，赶摆冷冷清清。铁路通了之后，外地游客转过来，生意稳了很多，赶摆的时候，我也能和相熟的老庚坐下来好好聊聊天。”村民依应香说。\n\n　　来自老挝勐新县的边民漂(Phiew)也常年参与赶摆，她说：“自从中老铁路通车以来，游客越来越多，我的老挝凉菜、老挝特产更好卖，每次赶摆能见到老朋友，心里很高兴。”\n\n　　赶摆之外，国门书社也是两国边民常去的地方。书社设在前任村民小组党支部书记岩书家楼下，由他牵头管护，日常向村民和老挝边民开放。劳作间隙的村民、前来赶摆的老挝边民都可以进来歇脚、翻看书籍。书社专门设置中老文化角，摆放两国文字读物、农技资料。\n\n游客走进曼烈村。龙斯 摄\n\n　　依托边境风貌和国门文化阵地，曼烈村逐步发展研学游、边境体验游。研学团队沿着中老铁路抵达勐腊，再转赴勐满走进曼烈村。闲置民居陆续改造为农家乐、民宿，门球场、陀螺场、民族舞台配套齐全，村寨朝着边境旅游示范村目标稳步推进。\n\n　　“中老铁路打通了整个区域的流通大循环，吸引不少外地游客来到勐腊，再转进我们边境村寨，本地果蔬等特产外销路子也更宽。”勐满镇党委副书记叶俊磊说。\n\n　　暮色降临，同心亭下还有中老边民闲谈。通车五年，依托中老铁路搭建的流通网络，老挝老庚前来赶摆的路更顺，本地农货外销的渠道也更通畅。两地老庚的相聚之约，一年接一年，越走越亲。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c31efb121f9","title":"2026全国陶瓷行业职业技能竞赛总决赛在河南平顶山举行","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735646.shtml","summary":"中新网平顶山11月21日电 (刘鹏 张玥颖)11月20日，2026全国陶瓷行业职业技能竞赛总决赛、中原陶瓷文化之旅暨第二届“雨过天青·平顶山”当代陶瓷系列活动在河南平顶山拉开帷幕。","summary_short":"中新网平顶山11月21日电 (刘鹏 张玥颖)11月20日，2026全国陶瓷行业职业技能竞赛总决赛…","digest":"11月20日，2026全国陶瓷行业职业技能竞赛总决赛…","points":["中新网平顶山11月21日电 (刘鹏 张玥颖)11月20日…","平顶山是中原陶瓷文明重要的根脉之地，也是中华陶瓷文化谱系中的重要一环，境内古窑遗存星罗棋布…","平顶山市委书记陈向平介绍，目前，平顶山全市有陶瓷企业900余家，省级以上陶瓷艺术大师…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T10:32:23+08:00","size":1,"keywords":[],"body":"中新网平顶山11月21日电 (刘鹏 张玥颖)11月20日，2026全国陶瓷行业职业技能竞赛总决赛、中原陶瓷文化之旅暨第二届“雨过天青·平顶山”当代陶瓷系列活动在河南平顶山拉开帷幕。\n\n　　平顶山是中原陶瓷文明重要的根脉之地，也是中华陶瓷文化谱系中的重要一环，境内古窑遗存星罗棋布，孕育了汝瓷、花瓷、唐钧、蒲陶、紫砂、彩陶“六朵金花”。其中，“汝瓷天青”温润典雅、气韵天成，彰显东方独有的审美意境，凝结着精益求精、质朴守正的匠心品格。\n\n图为陶瓷展品。河南省文化和旅游厅供图\n\n　　平顶山市委书记陈向平介绍，目前，平顶山全市有陶瓷企业900余家，省级以上陶瓷艺术大师、非遗代表性传承人200余人，6所院校开设陶瓷相关专业，打造了“天青里”“东坡杯”“雨过天青”等特色IP。同时，平顶山依托本次赛事平台，联动开展了中原陶瓷文化之旅、主题创意展览、人文陶瓷创作、青年文创市集等系列活动。\n\n　　中国陶瓷工业协会常务副理事长吴越申介绍，本次大赛设置陶瓷工艺师、陶瓷手工成型工(拉坯)两个核心项目。拉坯，是手工制瓷最基础、最考验手上功夫的成型技艺，由学生组与职工组同台竞技；陶瓷工艺师，则兼顾造型塑造、工艺把控、审美创作、创新转化，是支撑行业发展的复合型技能岗位。三项赛事紧扣陶瓷生产创作的核心环节，既是全国陶瓷技能人才同台比拼的竞技场，也是行业技艺交流、经验互鉴的大平台。\n\n　　河南省美术家协会驻会副主席陈文利在介绍第二届“雨过天青·平顶山”当代陶瓷创意设计展筹备情况时表示，本届活动征稿共收到221位作者报送的363件作品，参与者既有各产区的陶瓷传承人、艺术家、设计师，也有在校大学生；经初评遴选，共有141位作者的167件作品入选展览。\n\n　　活动开幕式现场，随着乐声缓缓响起，群舞《汝瓷赋》翩然登场。舞者身着天青色舞裙，衣袂如同流动的釉色，把“雨过天青云破处”的意境铺在背景之上。\n\n　　压轴舞台剧《天青入梦》剧目以宋徽宗梦寻天青的传说为引，以泥与火的相逢作为叙事主线。光影流转间，云雾、窑火、湖山次第在舞台浮现，把古人对一抹天青的追寻、匠人代代守窑的执着娓娓道来。\n\n　　开幕式后，选手们转场至竞赛场地，正式开启实操比拼。赛场之内，选手们凝神屏息、神情专注，全部沉心投入比拼，在一捧陶泥之上角逐技艺高下。\n\n　　活动现场还发布了2026“中原陶瓷文化之旅”主题精品线路，四条主题线路，一条深度研学总线，串起从史前彩陶到宋代名窑的陶瓷文明。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9b24fb585c","title":"（走进中国乡村）村民变演员 湖南千年水乡“演”出新生活","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735648.shtml","summary":"中新社长沙11月21日电 题：村民变演员 湖南千年水乡“演”出新生活  　　作者 张雪盈  　　初冬时节，湖南长沙市望城区乔口镇柳林江村村民刘淑梅刚在家用过晚饭…","summary_short":"中新社长沙11月21日电 题：村民变演员 湖南千年水乡“演”出新生活  　　作者 张雪盈  　　初冬时节…","digest":"题：村民变演员 湖南千年水乡“演”出新生活  　　作者 张雪盈  　　初冬时节…","points":["初冬时节，湖南长沙市望城区乔口镇柳林江村村民刘淑梅刚在家用过晚饭…","”刘淑梅在接受中新社采访时说，一年前自己还只是围着灶台和田地打转的普通农妇…","不同于人工搭建的标准化影视基地，乔口的街巷院落保留着未经修饰的生活风貌"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T10:30:49+08:00","size":1,"keywords":[],"body":"中新社长沙11月21日电 题：村民变演员 湖南千年水乡“演”出新生活\n\n　　作者 张雪盈\n\n　　初冬时节，湖南长沙市望城区乔口镇柳林江村村民刘淑梅刚在家用过晚饭，就被乡村CEO(农村集体经济经理人)陈浩请去剧组当临时群演。\n\n　　“白天种菜园，晚上当演员，顾家、赚钱两不耽误。”刘淑梅在接受中新社采访时说，一年前自己还只是围着灶台和田地打转的普通农妇，如今已是村里小有名气的群演。\n\n11月17日，湖南长沙望城区乔口镇柳林江村，短剧导演正在与村民讲戏。　张雪盈 摄\n\n　　地处湘江之滨、洞庭湖南岸的乔口是千年水乡古镇，建制史可追溯至春秋战国时期，唐代诗人杜甫曾在此留下诗作《入乔口》。近年，这座古镇借中国微短剧产业快速发展之势，盘活闲置农房、老校舍、老街巷，把整座村庄打造成天然影视片场，让村民在家门口吃上“影视饭”。\n\n　　不同于人工搭建的标准化影视基地，乔口的街巷院落保留着未经修饰的生活风貌。从事影视行业20余年的导演赵志杰认为，这份原生态正是乔口最核心的竞争力：青石板铺就的千年古街适配古风悬疑题材，连片的清末民初民居可用于年代商战片，郊野散落的农家院落能承载乡村现实主题，既省去高额搭景成本，也让镜头里的故事更具质感。\n\n11月17日，湖南长沙望城区乔口镇柳林江村，短剧导演正与微短剧发展专班沟通拍摄事宜。　张雪盈 摄\n\n　　为对接短剧拍摄需求，乔口镇成立微短剧发展专班。陈浩介绍，剧组租用民房、古书院等作为拍摄场地，专班为入驻剧组提供场地协调、群演对接、食宿配套等服务，参演村民可按场次领取演出酬劳。\n\n　　“农闲时当一天群演能拿150元(人民币，下同)左右，还能过过戏瘾，日子比以前有意思多了。”柳林江村村民赵月娥说，像她这样常年参与拍摄的村民有数十人，上至六七十岁的老人，下至放假在家的学生。\n\n8月28日，湖南长沙望城区乔口镇，短剧剧组在乔江书院内拍摄年代剧。　(受访者供图)\n\n　　据乔口镇介绍，截至目前，当地已累计承接微短剧剧组40余个，拍摄作品超50部，仅柳林江村村集体收入便已突破180万元。在望城区妇联的指导下，柳林江村还成立了“爱姨工坊”，承接农产品加工、剧组后勤、道具制作等业务，让不便出镜的中老年村民也能在家门口实现增收。\n\n　　乔口镇深挖乔江书院、周瑜传说等本土历史资源，引导剧组创作在地化故事。以本土传说为蓝本的《乔口秘闻》系列短剧，已吸引超千万人次在线观看，让这座水乡古镇走进了更多网友的视野。陈浩表示，下一步将引导游客循着短剧来乔口打卡，把线上关注转化为线下到访和消费。\n\n　　面对微短剧行业迭代快、人工智能(AI)技术冲击等挑战，乔口镇也在主动调整思路。陈浩透露，当地正探索“短剧+文旅”，定期开设演员、场务技能培训班，培育本土影视人才，还计划于近期推出“游客当群演”沉浸式体验项目。他希望短剧带来的人气能够延续，为村民增加更多收入。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c833c1b3a07","title":"又到三峡满山红叶时 重庆巫山举行系列活动","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735650.shtml","summary":"中新网重庆11月21日电 (张旭)11月20日晚，第二十届重庆长江三峡(巫山)国际红叶节暨第七届巫山神女杯艺术电影周在巫山体育馆开幕。","summary_short":"中新网重庆11月21日电 (张旭)11月20日晚，第二十届重庆长江三峡(巫山)国际红叶节暨第七届巫山神女杯艺术电影周在巫…","digest":"又到三峡满山红叶时 重庆巫山举行系列活动","points":["中新网重庆11月21日电 (张旭)11月20日晚…","本届红叶节以“雄奇山水间·新韵红叶情”为主题，将电影展映、文艺活动和主题旅游共同融合…","据介绍，多年来，巫山坚持以节会友，红叶为媒、光影为纽带，吸引400余位电影艺术家亮相巫山…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T10:27:03+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (张旭)11月20日晚，第二十届重庆长江三峡(巫山)国际红叶节暨第七届巫山神女杯艺术电影周在巫山体育馆开幕。本届红叶节以“雄奇山水间·新韵红叶情”为主题，将电影展映、文艺活动和主题旅游共同融合，让游客在赏红叶、游三峡的同时，感受电影艺术的魅力。\n\n图为开幕式现场。张旭 摄\n\n　　开幕式上，第七届巫山神女杯艺术电影周开幕影片《摩托书记》剧组登台推介影片。该片讲述了时任巫山县安静村驻村第一书记的王涛骑摩托车走村入户，带领村民改善基础设施、发展产业脱贫的故事。\n\n　　当晚，重庆市巫山县，山东省荣成市、临清市、东昌府区，河南省项城市、临颍县，陕西省麟游县，内蒙古自治区包头市青山区的代表，共同举行县域城市信用发展联盟新进成员签约仪式，各方将以信用信息共享、信用评价互认为纽带，推动资源共享。\n\n　　据介绍，多年来，巫山坚持以节会友，红叶为媒、光影为纽带，吸引400余位电影艺术家亮相巫山、点赞三峡。巫山的峡江美名传向大江南北，游客流量节节攀升，2025年景区购票突破300万人次，高峡平湖成为越来越多人向往的“诗与远方”。\n\n　　巫山坚持以节兴业，持续放大红叶节、电影周品牌效应，深挖山水禀赋，释放“一江碧水、两岸青山、三峡红叶、四季云雨”的生态价值，展现“千年古镇、万年文明”的文化气质。据悉，旅游正逐步成为巫山第一支柱产业。\n\n图为巫山红叶。尹诗语 摄\n\n　　今年，巫山将举行系列活动。11月20日晚，开幕式晚会启幕，电影展映、电影市集活动同步开张；电影主题音乐会、无人机灯光秀、荣誉盛典等活动相继举行。\n\n　　第七届巫山神女杯艺术电影周的4天时间里，《过家家》《想飞的女孩》等20部影片将陆续与观众见面，室内室外同步放映，市民可就近看、免费看。同时，部分影片主创团队将与观众面对面分享光影背后的创作故事。\n\n　　当地还推出“一张票根游巫山”活动，市民、游客可凭电影周期间在活动指定影院观影的票根，享受部分景区、住宿、餐饮优惠。同时，“光影三峡”电影市集将集中展示电影手作、特色美食等元素，推出消费满额兑换景区抵扣券等玩法。\n\n图为开幕式现场的舞蹈表演。张旭 摄\n\n　　“二十年一叶深耕，十余载光影同行。”中共巫山县委书记刘本万在开幕式上致辞称，这些年，巫山以节会友，架起了一座四海宾朋“相约峡江、共赴山河”的新桥梁。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9303c07dc8","title":"这杯“调解茶”：茶馆坐得下，云端连得上","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735657.shtml","summary":"何以中国·和合礼让丨这杯“调解茶”：茶馆坐得下，云端连得上  　　央广网合肥11月20日消息(记者徐鹏)初冬的淮北市濉溪县临涣镇，青石板路旁的老茶馆热气氤氲，淮北大鼓的腔调伴着茶香漫过街巷。","summary_short":"何以中国·和合礼让丨这杯“调解茶”：茶馆坐得下，云端连得上  　　央广网合肥11月20日消息(记者徐鹏)初冬的淮北市濉溪…","digest":"何以中国·和合礼让丨这杯“调解茶”：茶馆坐得下…","points":["央广网合肥11月20日消息(记者徐鹏)初冬的淮北市濉溪县临涣镇，青石板路旁的老茶馆热气氤氲…","六百余年的饮茶习俗早已融进这座古镇的肌理，从线下茶馆里的家长里短，到线上直播间里的政策答疑…","如今，当地人以茶为媒、以礼为先、以和为贵，让老茶俗在新时代焕发新活力…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T10:20:58+08:00","size":1,"keywords":[],"body":"何以中国·和合礼让丨这杯“调解茶”：茶馆坐得下，云端连得上\n\n　　央广网合肥11月20日消息(记者徐鹏)初冬的淮北市濉溪县临涣镇，青石板路旁的老茶馆热气氤氲，淮北大鼓的腔调伴着茶香漫过街巷。\n\n　　六百余年的饮茶习俗早已融进这座古镇的肌理，从线下茶馆里的家长里短，到线上直播间里的政策答疑，一杯棒棒茶始终是串联人情、化解心结的温情纽带。如今，当地人以茶为媒、以礼为先、以和为贵，让老茶俗在新时代焕发新活力，走出了一条兼具温度与智慧的基层善治之路。\n\n　　老茶馆润人心 一碗茶解千结\n\n　　“大鼓一敲带笑颜，俺是人民调解员，大事小事俺都管，几杯茶能给他调解完。”64岁的周素芬敲着鼓板，一段自编的《温馨调解大碗茶》，总能让满座茶客听得入神。做了十几年人民调解员，同时也是淮北坠子戏非遗传承人的她，把调解的道理编进鼓词，用老百姓听得懂、愿意听的方式讲政策、化纠纷，比起生硬说教，这份烟火气里的共情更有直抵人心的力量。\n\n　　周素芬把整套调解流程浓缩成“七碗茶”的唱词：“端着香茶茶一碗，双方对坐在桌前；端着香茶茶二碗，双方叙事讲事端；端着香茶茶三碗，是是非非摆面前；端着香茶茶四碗，双方言和带笑颜；端着香茶茶五碗，双方提笔把字签；端着香茶茶六碗，双方道谢调解员；端着香茶茶七碗，一饮而尽回家园。”\n\n　　“一杯热茶双手递过去，当事人心里先暖了半截，觉得我们是可信的人，也就愿意敞开心扉好好说话。”周素芬说。\n\n调解员正在调解邻里纠纷(央广网记者 徐鹏 摄)\n\n　　曾有两位村民为一块土地争执多年，互不相让。走进茶馆后，调解员先端上两杯热茶拉家常，几杯茶下肚，原本面红耳赤的两人火气消了大半。待到调解员唱起“千里捎书为一墙，让他三尺又何妨”的典故，老人终于坦言，争的不是地，是一口气、一份面子。找准了心结，调解员顺势提出轮流耕种的方案，既照顾了老人的体面，也兼顾了年轻人的诉求，一场积攒多年的矛盾，就在袅袅茶香里悄然化解。\n\n　　从邻里间的排水琐事，到牵扯亲情的赡养纠纷，一代代调解员始终守着最朴素的信念：对簿公堂，输赢都伤感情；握手言和，才能守住邻里亲情。做了41年人民调解员的陈文章，化解纠纷时总先兜住安全底线，再慢慢疏通心结。此前他处理一起邻里排水纠纷时，没有简单要求恢复原状，而是先敲定临时通行方案保障安全，再促成双方协商，最终让两家人握手言和。“红脸进来、笑脸出去”，渐渐成了茶馆里的常态。\n\n　　2012年以来，当地将“茶为媒、礼为先、和为贵”的茶文化精神融入基层治理，形成“有理到茶馆说”的“一杯茶”调解工作法。这套扎根乡土的治理模式顺着百姓生活习惯自然生长，把“和合礼让”的文化内核转化为可落地的调解实践。如今濉溪县已建成255个“百姓说事点”，实现全县域站点全覆盖，大量矛盾纠纷被化解在萌芽状态。2023年，该工作法入选全国第五批乡村治理典型案例，2024年写入安徽省政府工作报告，从一方小小茶馆走向了全省乡村治理的广阔舞台。\n\n　　云茶馆连万家 直播间传和气\n\n　　当老茶馆遇上新媒介，一杯茶的温度顺着网线漫出了古镇。\n\n　　一个手机支架、一盏补光灯，茶俗临涣直播间就在茶香里开播了。村干部和司法所调解员并肩坐下当起主播，公屏上滚动着乡亲们的提问，从宅基地审批到土地承包，从医保缴费到养老政策，原本严肃的法规政策，被聊成了接地气的家常话。\n\n　　石集村党总支委员杨延和镇司法所调解员孙作成是直播间的老搭档，一个负责念题互动，一个负责答疑解惑，配合得十分默契。“农村建房为什么要审批？”“承包土地怎么避免纠纷？”是网友问得最多的问题。孙作成总会掰开揉碎了讲清利害，在他看来，直播间的价值不止于解答疑问，更在于提前预警矛盾隐患，把工作做在纠纷发生之前。\n\n　　屏幕这头讲得热闹，屏幕那头的诉求也从没被落下。曾有一位办厂的茶客在直播现场咨询，一批农用棉鞋跨省交易未签合同，双方因尾款和发票起了争执，眼看就要对簿公堂。孙作成通过电话、微信两头沟通，给双方搭起沟通的桥梁，只用两天就促成了问题解决。\n\n　　“其实他们人都很不错，就是沟通上有一个障碍。我们一杯茶，也就是搭那一座桥。”在孙作成心里，“一杯茶”从来不是特指棒棒茶，一杯温水、一句暖言，只要能暖了人心、通了情理，就是最好的“调解茶”。\n\n茶俗临涣直播间(央广网记者 徐鹏 摄)\n\n　　除了纠纷调解，直播间还装着乡村的“日子账”。政策宣讲、村务公开、助农帮扶都是日常内容，村里按分工安排各条线工作人员出镜，“让专业的人来讲专业的事”。去年雨水偏多，村里一位蜜薯种植大户的产品运不出去，杨延带着镜头扎进田间，实拍蜜薯长势与种植细节，打开定位引导周边乡亲上门采购，本镇就消化了全部库存，解了农户的燃眉之急。\n\n　　如今年轻人外出务工多，留守老人更习惯从手机获取信息，把茶馆“搬”到线上，就让治理服务覆盖到了更多人群。随着影响力不断扩大，临涣的义务调解员队伍已发展到200多人，组成兵哥调解队、姐妹花调解团队等多支志愿队伍，覆盖全镇19个行政村，每年累计调解纠纷160多场次。\n\n　　鼓板声在老茶馆里回响，直播间的乡音顺着网线传向远方。\n\n　　六百余年茶俗绵延至今，变的是传播与服务的形式，不变的是“茶为媒、礼为先、和为贵”的精神内核。从线下一碗热茶到线上一场直播，临涣把“和合礼让”的古老智慧转化为基层治理的鲜活实践，在袅袅茶香与声声乡音里，绘就一幅邻里和睦、乡风文明的和美乡村画卷。\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7b75632469","title":"新产业催生更多新岗位 @高校毕业生，你准备好了吗？","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735642.shtml","summary":"央视网消息：记者从2027届全国普通高校毕业生就业创业工作会议上获悉，2027届全国普通高校毕业生规模预计1299万人，各地各部门将全力确保2027届高校毕业生就业总体稳定。","summary_short":"央视网消息：记者从2027届全国普通高校毕业生就业创业工作会议上获悉，2027届全国普通高校毕业生规模预计1299万人…","digest":"央视网消息：记者从2027届全国普通高校毕业生就业创业工作会议上获悉…","points":["央视网消息：记者从2027届全国普通高校毕业生就业创业工作会议上获悉…","各地各有关部门将健全政策支持体系促就业，用足用好现行政策，支持出台增量政策，优化招录时序安排","共青团部署开展服务和促进大学生就业行动以来，面向2027届高校毕业生…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T09:53:13+08:00","size":1,"keywords":[],"body":"央视网消息：记者从2027届全国普通高校毕业生就业创业工作会议上获悉，2027届全国普通高校毕业生规模预计1299万人，各地各部门将全力确保2027届高校毕业生就业总体稳定。\n\n　　据了解，各地各有关部门将健全政策支持体系促就业，用足用好现行政策，支持出台增量政策，优化招录时序安排；挖潜更多岗位资源促就业，支持重点区域提升就业承载力，助力重点产业更多吸纳就业，拓展先进制造业和现代服务业就业空间，推动国有企业稳岗扩岗，促进中小企业吸纳就业，支持鼓励创业带动就业；抓实服务“着力点”，推动服务提质升级促就业，有力有效开展就业公共服务进校园，深化校地人才供需精准对接行动，创新推进人工智能赋能就业，强化就业资源薄弱校倾斜支持；强化帮困“兜底策”，做实做细暖心帮扶促就业，落实困难群体毕业生结对帮扶，持续做好离校未就业毕业生服务攻坚。紧盯产业“风向标”，加快推进产教融合促就业，深化招生培养就业联动联审改革，持续推动校企共建“微专业”，多管齐下提升青年求职竞争力。\n\n　　AI岗位扩容 企业选人青睐实战型人才\n\n　　共青团部署开展服务和促进大学生就业行动以来，面向2027届高校毕业生，各地持续举办多场“千校万岗”招聘会。今年秋招，人工智能人才需求热度不减，AI类岗位持续扩容，对人才的需求也更加多元。\r\n\n　　不久前，在上海交通大学举行的共青团“千校万岗”招聘会上，集成电路、生物医药、人工智能三大先导产业超230家企业推出4200多个岗位。记者在现场看到，不少企业增加了人工智能岗位的需求。这家科技服务企业今年新增多智能体开发岗位，AI基础设施相关岗位同步扩招，这家集成电路企业今年的招聘则“软硬并重”。\n\n　　随着传统制造企业加快转型升级，相应人才招聘的专业边界也在拓宽。这家船舶建造领域的企业招聘不再局限于机械、电气等传统专业，数字化、智能化转型带来新的岗位缺口，人工智能等专业人才同样成为企业重点招揽的对象。\n\n　　不少招聘单位坦言，如今重点关注四项核心能力：扎实的专业理论基础、真实工程项目中的实习经历、跨领域协作与自主学习能力，以及主动拥抱智能工具、善用AI的意识与能力。某平台校招业务负责人介绍，同学需要专业结合上AI，同时需要更多的实习机会、实习经验，因为实习履历是招聘面试当中非常重要的环节。\n\n　　技能型 创新型人才需求旺盛\n\n　　人工智能带来的产业升级，对技能型、创新型人才也提出更高的要求。多地通过举办技能大赛、创业大赛等打通赛场到职场的通道，让学生们在提升技能的同时，及时感知市场需求，提升求职竞争力。\n\n　　不久前，在第十九届“振兴杯”全国青年职业技能大赛决赛期间，同步举办了青年技能人才招聘会，90家企业带来300多个岗位，岗位人才需求总量达2400余人，覆盖机器人运维、设备调试、工艺技术员、数字化技术支持等方向。\n\n　　招聘会上，不少企业坦言，技能人才供需呈现新趋势：专用设备制造业、与新质生产力相关产业岗位需求增加，企业更看重人才掌握新技术、能直接上手的综合能力。\n\n　　在辽宁大连，第十五届“挑战杯”中国大学生创业计划竞赛决赛期间，举办人才对接会。150多家用人单位涵盖央国企、专精特新企业、高新技术企业等，覆盖装备制造、能源化工、人工智能等热门领域，提供正式岗、实习岗等多种选择。\n\n　　AI赋能产业升级 拓展就业新空间\n\n　　今年是海南自由贸易港封关运作首年。随着开放政策持续落地，一批新企业、新项目加快集聚，传统行业也在进行数字化、智能化升级。那么，就业市场出现了哪些新趋势？继续来看记者观察。\n\n　　在海口经济学院校园招聘会现场，120余家企业集中提供近2500个就业岗位。在这家从事AI短剧出海的企业展位前，计算机专业应届毕业生罗浩宣没有只递简历，而是带来了“个人名片”——一款自己运用AI工具制作的小游戏。他一边演示游戏操作，一边解释制作过程，这个作品让企业招聘人员眼前一亮。\n\n　　一份自主制作、运行流畅的作品成为学生证明能力的直接方式，也成为企业迅速了解应聘者能力的直观载体。这家AI短剧制作企业今年新增加了像AI软件开发、AI培训师、账号运营等100多个AI相关岗位。企业对人工智能人才的判断也在发生变化，掌握某一种工具只是起点，能否把技术用到内容生产和具体业务中，更为企业所看重。此外，低空经济等新兴行业把技术需求带入了电力、测绘和城市服务等实体场景，就业空间也随之向多场景、多环节拓展。\n\n　　新产业正在扩展岗位边界。从招聘市场整体看，企业需求也在分化：一部分岗位向技术和跨行业应用延伸，另一部分则在成熟行业中寻找更细分的市场。与此同时，服务业和销售岗位仍然是招聘市场的重要组成部分。但供需两端的错位仍然存在：求职者感到传统专业岗位减少，而企业面对的却是细分岗位找不到合适的人。学校和企业的合作正在从毕业季招聘向人才培养前端延伸。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1702bd5b39","title":"第二届文化养老产业交流会在厦门举行","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735630.shtml","summary":"中新网厦门11月21日电 (叶艺琳)以“洞见趋势 共生未来”为主题的第二届文化养老产业交流会20日下午在福建厦门举行。","summary_short":"中新网厦门11月21日电 (叶艺琳)以“洞见趋势 共生未来”为主题的第二届文化养老产业交流会20日下午在福建厦门举行。","digest":"以“洞见趋势 共生未来”为主题的第二届文化养老产业交流会20日下午在福建厦门举行","points":["中新网厦门11月21日电 (叶艺琳)以“洞见趋势 共生未来”为主题的第二届文化养老产业交流会…","来自中国社会福利与养老服务协会、福建省老年事业促进会、高校院所，以及文旅康养、老年教育…","复旦大学旅游学系教授、复旦大学终身教育学院副院长孙云龙援引中国旅游研究院数据指出…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T09:44:16+08:00","size":1,"keywords":[],"body":"中新网厦门11月21日电 (叶艺琳)以“洞见趋势 共生未来”为主题的第二届文化养老产业交流会20日下午在福建厦门举行。来自中国社会福利与养老服务协会、福建省老年事业促进会、高校院所，以及文旅康养、老年教育、智慧科技、养老金融等领域的业界代表齐聚鹭岛，共探积极老龄化背景下文化养老产业高质量发展新路径。\n\n活动现场。叶艺琳 摄\n\n　　“如果说专业照护是养老服务的‘硬支撑’，那么文化养老则是享老生活的‘软实力’。”中国社会福利与养老服务协会执行会长徐建中在致辞中指出，当前，文化养老已从“附加选项”转变为高品质康养的“刚需标配”，业界需打破壁垒，推动教研内容、基层运营与智慧科技跨界融合，构建协同共生的产业生态。\n\n　　随着老龄化进程加速，银发旅游正从“小众需求”走向“主流市场”。复旦大学旅游学系教授、复旦大学终身教育学院副院长孙云龙援引中国旅游研究院数据指出，2025年中国银发群体国内出游达10.05亿人次，国内旅游收入达1.14万亿元。针对需求快速释放与供给调整滞后之间的结构性矛盾，他表示，全国6.46万家旅行社中，专门面向老年人的旅游线路供给偏少，且存在高龄老人参团投保受限、景区适老化设施不足等短板。“适老化不是‘简配’，而是新的价值锚点与溢价来源。”孙云龙说，银发旅游正从“朝阳产业”迈向“幸福产业”。\n\n　　中国康养研究院院长张晋认为，银发经济已非单一细分市场，而是整个消费地图的重构。他建议，企业应从单纯售卖商品升级为提供生活解决方案，以线下场景夯实消费信任基础，让3.2亿老年人从“被服务对象”重新变回“街坊邻居”。\n\n　　创新供给与金融赋能亦成为热议焦点。国家开放大学出版传媒集团总编辑刘占荣介绍，该集团将认知训练与社交联结融入“游戏化”老年教育，目前已在全国500个场所开展了7000场次活动，服务约28万人次。四川财经职业学院银发经济与养老金融研究中心副主任李成林指出，“流量靠营销，留量靠信任”，金融应发挥跨期配置、信任中介与资产转化作用，成为银发文旅康养的“留量”基础设施。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfa007c2b17","title":"“租购修养”全周期保障正在落实落细","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735632.shtml","summary":"新修订的《住房公积金管理条例》施行已满两个月  　　“租购修养”全周期保障正在落实落细  　　本报记者 孙天骄  　　“没想到公积金还能用来交物业费！","summary_short":"新修订的《住房公积金管理条例》施行已满两个月  　　“租购修养”全周期保障正在落实落细  　　本报记者 孙天骄  　　“…","digest":"新修订的《住房公积金管理条例》施行已满两个月  　　“租购修养”全周期保障正在落实落…","points":["新修订的《住房公积金管理条例》施行已满两个月","”今年11月初，年近六旬的王先生在女儿的指导下打开“邢台公积金”微信公众号…","《条例》将住房公积金提取使用范围从6种情形扩展到9种情形，住房装修…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T09:22:15+08:00","size":1,"keywords":[],"body":"新修订的《住房公积金管理条例》施行已满两个月\n\n　　“租购修养”全周期保障正在落实落细\n\n　　本报记者 孙天骄\n\n　　“没想到公积金还能用来交物业费！”今年11月初，年近六旬的王先生在女儿的指导下打开“邢台公积金”微信公众号，跟着页面指引完成线上操作，短短数分钟，便提取到2000元公积金，覆盖了绝大部分物业费用。\r\n\n　　王先生家住河北省邢台市区某小区，物业费一年3000余元。收费通知贴到单元门门口时，女儿告诉他，现在公积金支持以交纳物业费名义提取，在手机上就能操作。抱着试一试的心态，王先生在“邢台公积金”公众号里找到“业务办理”，按提示填好房屋地址、缴费年度等内容后，提交了申请。很快，页面显示“审核通过”，钱当天就打进了王先生的银行卡。\n\n　　新修订的《住房公积金管理条例》(以下简称《条例》)已于今年9月20日起施行，至今已满2个月。《条例》将住房公积金提取使用范围从6种情形扩展到9种情形，住房装修、物业费被正式纳入提取范围，同时增设“国务院批准的其他住房消费情形”兜底条款，并且允许灵活就业人员自愿参加住房公积金制度。此前据不完全统计，《条例》施行1个月以来，全国住房装修提取住房公积金137亿元，支付物业费提取28亿元。\n\n　　王先生的经历正是公积金提取更便捷、更高效，使用范围更广的缩影之一。\n\n　　提取使用场景拓宽\n\n　　山东省青岛市的陈先生已是青岛市住房公积金线上服务平台的“常客”。他翻出手机里的提取记录展示给记者：4月27日上午提交物业费提取申请，4月29日上午审核通过，6000元当日到账；10月10日14时23分提交装修提取申请，15时05分审核通过，13.3万余元当日到账；11月5日10时09分提交购房提取申请，13时35分审核通过，29.7万余元当日到账。\n\n　　共计43.7万余元的提取申请，全部在手机上办结。\n\n　　这三笔钱对应着陈先生家今年的三件大事。4月那笔，是他家一年的物业费。按照青岛的政策，支付物业费提取公积金以家庭为单位，每年最高6000元，陈先生提取到了上限，“一年物业费基本由公积金兜住了”。10月，他为家里更换门窗，还重新装修了厨房和卫生间，凭装修合同和发票申请提取，家庭合计提取13.3万余元，用来支付材料和施工费用，提交后40多分钟就通过了，钱款当天到账。11月，陈先生和妻子购买了一套新房，他以配偶再交易名义，凭房产证和发票提取了29.7万余元，“从提交到入账也就3个多小时”。\n\n　　“在以前的印象中，公积金就是买房专用。”陈先生感慨，今年新政出台，装修、交纳物业费、买房都能提取，几笔大额支出带来的压力减轻不少。\n\n　　2026年《政府工作报告》明确提出“深化住房公积金制度改革”。部分城市先行结合本地实际展开探索，扩大公积金制度惠及面，青岛就是其中的代表。\n\n　　据了解，青岛市住房公积金管理中心分别于今年4月20日和9月20日推出惠民措施，进一步提高住房公积金贷款额度上限，扩大首套房优惠范围，拓宽提取使用场景，持续提升制度惠及居民住房消费的广度与深度。\n\n　　目前，青岛住房公积金的提取情形已增至18种，完整覆盖“租、购、修、养”全链条住房消费。缴存人或配偶装修本市自住住房可一次性提取住房公积金，家庭合计最高可提取20万元；缴纳住房契税、住宅专项维修资金被纳入提取范围；支付物业费也能提取住房公积金，以家庭为单位每年可最高提取6000元。\n\n　　功能校准适配变化\n\n　　今年9月20日，新修订的《条例》开始施行。\n\n　　据了解，《条例》修订主要包含几方面核心内容：提取情形由原来6种扩充为9种，新增装修自住住房、支付自住住房物业费，以及国务院批准的其他住房消费情形；扩大了缴存覆盖面，明确个体工商户、非全日制从业人员以及其他灵活就业人员可以自愿参加住房公积金制度；简化提取审批流程，缩短贷款审查时限，推进缴存记录等在全国范围内互信互认，同时完善信用惩戒，打击骗提骗贷行为。\n\n　　政策出台后，多地快速跟进。\n\n　　9月，江苏省南京市发布《关于开展自住住房装修和物业费提取住房公积金业务的通知》，支持装修、支付物业费提取住房公积金，装修提取总额最高不超过15万元，物业费凭发票最高可提取5000元；同月，四川省成都市出台《关于支持装修和物业费提取住房公积金的通知》；10月，辽宁省沈阳市推出共计9项住房公积金使用新政，打通购房、住房改造、日常养房全链条公积金使用渠道。\n\n　　对此，中国社会科学院财经战略研究院住房大数据项目组组长邹琳华表示，新修订的《条例》对公积金的功能定位进行了校准，推动公积金从过去以支持购房为单一轴心，转向覆盖“租、购、修、养”的全周期住房消费。不买房、房贷已经结清的缴存人，同样可以动用账户资金解决房屋装修、缴纳物业费这类日常居住维护开支；放到住房消费市场层面，新政能够激活存量住房翻新维护需求，带动建材、家居等住房后周期消费；将灵活就业群体纳入自愿缴存体系，则是制度普惠性的结构性补强，适配当下就业结构发生的深刻变化。\n\n　　首都经济贸易大学京津冀房地产研究院院长、北京市房地产法学会副会长赵秀池认为，公积金用途扩围具备多重现实意义。站在居民安居保障角度，提取情形扩容叠加灵活就业人员可参与缴存，标志着公积金功能发生实质性转变，直面群众“买不起”“租不起”“养不起”“修不起”的现实痛点，通过降低居民住房持有和养护成本，提升居住质量。灵活就业群体也能获得低息信贷支持，助力实现住有所居。“从房地产行业来看，适配存量时代城市更新的大趋势，助推存量住房提质升级，服务房地产行业高质量发展。”\n\n　　分类施策释放红利\n\n　　如何进一步细化配套规则，引导公积金新政高质量平稳落地，更好释放制度民生红利？\n\n　　邹琳华建议，把握“底线统一、分类施策、能力匹配”的总体思路。\n\n　　一方面，针对装修、物业费提取制定清晰可落地的正面清单，明确票据类型、费用覆盖范围，针对自装情形设置替代核验路径，减少窗口自由裁量，避免因为票据时间差直接驳回群众申请。\n\n　　另一方面，全国不宜设置统一提取额度，但各地在出台细则时，应开展资金流动性压力测试，提取节奏要和个贷率安全边界挂钩。资金压力偏大的城市，可针对非购房类提取设置过渡期或者弹性额度。推动政策由“一城一策”向“全国底线标准+地方弹性调整”过渡，逐步统一程序性办理规则；异地互认从信息互通向资金互通迈进，优先选取重点城市群试点资金调剂、风险分担机制；推进公积金和税务、住建、物业的数据共享，用大数据比对替代纸质材料堆叠，兼顾制度普惠性和资金安全。\n\n　　赵秀池则提出四条具体建议。第一，出台装修费、物业费专项提取规范，探索简化票据要求，设置标准化提取额度。第二，建立和个贷率挂钩的动态提取机制，个贷率偏高时，适度压低装修等大额项目的提取上限；个贷率处于低位时，可以适度放宽额度。第三，大力推进“一网通办”线上办理，推行承诺制、信用审核机制，减少线下材料，铲除灰色产业链生存土壤。第四，以城市群为试点搭建全国公积金资金调剂平台，实行资金有偿使用制度，推动公积金全国互联互通，提升整体资金使用效率。\n\n　　受访专家同时表示，参与公积金缴存的群众自身也应留存装修合同、缴费凭证、物业单据等相关材料以便后续用于申领公积金；各地公积金管理部门则应畅通投诉咨询渠道，针对骗提行为强化信用约束，让改革红利真正落到缴存人身上。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2e47777a30","title":"“助眠神器”，真有用还是“割韭菜”？","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735625.shtml","summary":"无须服药，轻松一握，一秒关机式入睡；睡前一点一滴一夹，三步入睡……","summary_short":"无须服药，轻松一握，一秒关机式入睡；睡前一点一滴一夹，三步入睡…","digest":"无须服药，轻松一握，一秒关机式入睡；睡前一点一滴一夹…","points":["无须服药，轻松一握，一秒关机式入睡","睡前一点一滴一夹，三步入睡……记者在一些社交平台看到，手握睡眠仪…","北京大学第六医院睡眠医学中心主治医师何佳告诉记者，在其门诊中…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T09:16:41+08:00","size":1,"keywords":[],"body":"无须服药，轻松一握，一秒关机式入睡；睡前一点一滴一夹，三步入睡……记者在一些社交平台看到，手握睡眠仪、低频脉冲治疗仪等“助眠神器”引起不少睡眠障碍者关注。这些打出“快速入眠黑科技”口号的产品，真有用还是在“割韭菜”？\r\n\n　　不少患者尝试过多种助眠产品\n\n　　近几年，山西太原的贾女士持续受睡眠问题困扰，她说：“有时凌晨3点钟还睡不着，用了各种办法：换床垫、换枕头、吃中药、喝酸枣仁安神茶，还买过一种睡眠含片，但效果都不太好。”\n\n　　据《2025年中国睡眠健康调查报告》，我国有48.5%的成年人存在睡眠问题，超3亿人存在睡眠障碍，且呈年轻化趋势。\n\n　　记者梳理发现，市面上的助眠产品大致有四类：监测类产品，如智能手环；干预/治疗类产品，如手持睡眠仪、CES设备等；深睡枕、床垫、眼罩等寝具与物理辅助类产品；口服类产品，如褪黑素、助眠软糖等。\n\n　　北京大学第六医院睡眠医学中心主治医师何佳告诉记者，在其门诊中，约80%的患者尝试过不同类型的助眠产品。“一些老年人和青少年群体对吃药有顾虑，多数会选择尝试中成药类产品，年轻群体偏向选择监测手环、眼罩、香薰、睡眠喷雾等。”\n\n　　对于睡眠监测类产品，何佳表示，其数据具有一定参考价值，但不完全准确。“在医学上，我们是通过脑电波来确认睡眠阶段，但监测手环判断深睡眠的逻辑很简单，人不动了，加上心率是平稳的，就是深睡眠，这就存在一定误判率。”\n\n　　“一些监测产品的数据还容易引发用户焦虑，如果未明确解决失眠具体问题，还可能误导消费者，延误正规治疗。”何佳说。\n\n　　“助眠神器”有效吗？\n\n　　什么样的助眠产品才真正有效？河北省邯郸市第一医院睡眠医学科主任刘俊平表示，失眠成因不同，应对的方法也不尽相同。\n\n　　“因腰椎、颈椎问题造成失眠的患者，可以购买更加舒适的枕头、床垫，提高舒适度，进而改善睡眠；对声音、光线比较敏感的患者，可选择适合自己的耳塞、眼罩等。”刘俊平说。\n\n　　北京的马女士常年受睡眠问题困扰，她尝试过各类助眠产品，如安睡枕、重力睡帽、睡眠喷雾等，“这些产品能提升舒适度，但对于非环境因素导致失眠的人来说，效果有限”。目前，她主要靠口服非处方药来调整睡眠。\n\n　　何佳表示，口服类的助眠产品，如酸枣仁等，成分天然，长期使用对于改善睡眠、降低觉醒程度有一定帮助；一些患者是昼夜节律失调，可以使用褪黑素。\n\n　　对于网上黑科技助眠仪“一秒入睡”的宣传口号，何佳解释道，入睡慢、睡得晚、多梦、早醒，都是引发失眠的原因或表现，从医学角度看，需要对症下药，在购买助眠产品前了解清楚其功能和原理。\n\n　　何佳进一步解释道，在临床试验中，CES疗法的确是物理治疗失眠的一个重要部分。CES全称为“经颅微电流”，关键是经颅，电流穿过颅骨到达大脑皮层，通过磁场作用影响大脑状态，是吃药治疗、心理治疗的重要补充。\n\n　　“手握式助眠仪的微电流，很难通过手掌穿透各层组织到达颅脑；低频脉冲治疗仪的微电流可以到达颅脑，但要注意产品的电流参数、作用部位，以及是否获得我国药监局的认证。”何佳提醒。\n\n　　专家支招找回“丢失的睡眠”\n\n　　失眠人群如何采用合理方式来干预睡眠障碍？何佳表示，首先要判断自己只是没睡好，还是真的有睡眠障碍。\n\n　　睡眠障碍最广泛的定义是，感觉到痛苦，同时会影响白天的功能。具体到症状上，表现为每周出现失眠的天数在3天以上，问题包含三个方面：一是入睡慢，躺床上超过30分钟还没睡着；二是夜里会反复觉醒3次以上；三是会早醒，比平时起床时间早30分钟以上。如果以上情况持续超过3个月，就可以判断为慢性失眠，需要重视并解决。\n\n　　何佳建议有睡眠障碍的人群，日常少喝浓茶、咖啡，睡前不看手机，尽量营造让自己舒服的环境。\n\n　　“最重要的是，不要因为一天没睡好就担心。有一些失眠的朋友迫切希望每天都睡好，认为一晚睡不好，第二天就崩溃了，这种灾难性的思维会让其对睡眠产生过度期望，造成焦虑。睡眠是自然发生的，而非强行控制。”刘俊平说。\n\n　　“白天不要补大觉，适当活动，消耗精力。”刘俊平建议，维护好生物钟，即使晚上没睡好，也要定点起床。另外，要见太阳光，这也是校准生物钟的一种方式。\n\n　　本报记者 付子晴 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cece81d0553","title":"从“跑多科”到“一号通”，就医流程改革让患者不再“绕晕”","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735623.shtml","summary":"一次挂号、多科接诊、院内免费转诊，多地医院推出“一号管到底”服务  　　从“跑多科”到“一号通”，就医流程改革让患者不再“绕晕”  　　业内人士认为，挂号体验直接影响群众对医疗服务的感受…","summary_short":"一次挂号、多科接诊、院内免费转诊，多地医院推出“一号管到底”服务  　　从“跑多科”到“一号通”…","digest":"一次挂号、多科接诊、院内免费转诊…","points":["一次挂号、多科接诊、院内免费转诊，多地医院推出“一号管到底”服务","业内人士认为，挂号体验直接影响群众对医疗服务的感受，是检验医疗改革成效最实在的标尺","南京的方先生不久前到南京市第二医院肝病科就诊"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T09:13:47+08:00","size":1,"keywords":[],"body":"一次挂号、多科接诊、院内免费转诊，多地医院推出“一号管到底”服务\n\n　　从“跑多科”到“一号通”，就医流程改革让患者不再“绕晕”\n\n　　业内人士认为，挂号体验直接影响群众对医疗服务的感受，是检验医疗改革成效最实在的标尺\n\n　　本报讯(记者刘金梦)“一次挂号、多科接诊、院内免费转诊”针对多病共存以及疑难重症患者，南京市第二医院近日推出就医便民新举措——“一号通”。患者无需重复挂号缴费，就能享受多科室诊疗服务，实现“一号管到底”。\r\n\n　　南京的方先生不久前到南京市第二医院肝病科就诊。问诊时，医生发现其除肝脏问题外还患有高血压。按过去的流程，方先生看完肝病后，如果想同步诊治高血压，需重新挂心血管内科的号，并再次排队候诊，耗费的时间和精力大幅增加。而此次就诊，接诊医生通过院内“一号通”机制，直接为其发起免费跨科室转诊，肝病、心血管两个科室的诊疗接续完成。\n\n　　随着人口老龄化程度加深，多病共存已成临床常见现象。按传统专科划分，各科室独立接诊，患者为兼顾各类病症不得不辗转于各诊室之间，不仅耗时耗力，也容易因专科分割而遗漏整体病情。记者了解到，南京市第二医院推出的“一号通”便民服务，主要面向多病共存患者。患者完成首次挂号后，接诊医生根据病情需要发起院内免费转诊；遇到病情复杂的疑难病例，医院会开启MDT多学科会诊模式，围绕患者个体情况综合研判，实现患者“一号看到底”、专家“多科一起看”，既免去患者来回奔波之苦，也确保了诊疗的系统性和连续性。\n\n　　“临床中常遇到一身多种基础病的老年患者，挨个跑科室看病，身体吃不消，不同科室几套意见听下来，患者也容易绕晕。推行‘一号通’，核心是打破科室间的壁垒，从患者全身病情出发开展诊疗。”南京市第二医院党委书记杨永峰表示，多学科协同弥补了单一专科视角的局限性，能更好地服务多病共存群体。\n\n　　“真要把这事落到实处，有几个堵点得先打通。”杨永峰坦言，一是信息系统要跟上，跨科室转诊、号源调取、费用结算需在系统里流畅对接；二是诊疗标准要明确，什么情况发起转诊、转诊后由谁牵头，都需要制定完善的规章制度，不能 “一转了之”。\n\n　　2023年国家卫健委发布的《关于开展改善就医感受提升患者体验主题活动的通知》明确，鼓励医疗机构再造门诊流程、完善多学科诊疗制度。《“健康中国2030”规划纲要》也提出，要优化诊疗流程，推进多学科诊疗模式，为患者提供一体化、连续性的医疗服务。\n\n　　目前全国多地已推出相关举措。福州市卫健委自2024年起在全市二级及以上公立医院推行 “一号管到底”，不再重复收取挂号费，如今这项改革已从试点走向全省。山东省济宁市第一人民医院推出门诊转诊转介服务，支持 “挂一个号看多个科”，首诊医生评估后可直接转介至关联科室免费就诊。\n\n　　业内人士表示，挂号是就医的第一步，直接影响群众对医疗服务的感受。让患者少跑一趟、少等一会儿、少花一笔冤枉钱，既是各地改善就医感受的共同出发点，也是检验改革成效最实在的标尺。 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c464d060b8b","title":"洗一次摇粒绒释放70万根微塑料？","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735621.shtml","summary":"洗一次摇粒绒释放70万根微塑料？","summary_short":"洗一次摇粒绒释放70万根微塑料？","digest":"洗一次摇粒绒释放70万根微塑料","points":["专家：数字被“张冠李戴”，无需过度恐慌","可就在最近，“洗一次摇粒绒会释放70万根微塑料”的说法在社交平台上传开，引发讨论…","江南大学纺织科学与工程学院纺织结构材料交叉技术研究室教授刘建立表示…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T09:09:36+08:00","size":1,"keywords":[],"body":"洗一次摇粒绒释放70万根微塑料？\n\n　　专家：数字被“张冠李戴”，无需过度恐慌\n\n　　天气一冷，衣柜里的摇粒绒又被翻了出来。柔软、轻便、保暖，价格还便宜。可就在最近，“洗一次摇粒绒会释放70万根微塑料”的说法在社交平台上传开，引发讨论，不少人翻着衣柜犯起了嘀咕：这件天天穿的衣服，是不是一直在“掉塑料”？江南大学纺织科学与工程学院纺织结构材料交叉技术研究室教授刘建立表示：摇粒绒确实是微纤维释放的“大户”，但“70万根”的说法并不准确。\n\n　　确实是塑料做的，但不等同于普通塑料\r\n\n　　刘建立告诉记者，从纺织材料学专业角度讲，摇粒绒的核心材质通常是100%聚酯纤维；从化学本质上看，聚酯纤维确实与矿泉水瓶、饮料瓶所用的塑料是同一种材质。因此，说“摇粒绒是塑料做的”在化学层面并无大问题。\n\n　　但是，摇粒绒与普通塑料、其他化纤面料的异同主要体现在物理形态和加工工艺上都有差异。刘建立教授表示：普通塑料是块状或膜状的高分子材料，而摇粒绒是将同种高分子材料通过熔融纺丝制成极细的纤维，再织成面料，形态完全不同。\n\n　　此外，摇粒绒的特殊性在于其后整理工艺。它经过拉毛、梳毛、剪毛、摇粒等复杂加工工艺，使面料表面布满卷曲的、细密的短纤维球粒，从而获得蓬松柔软的手感。这种起绒结构正是它容易脱落纤维的根本原因。\n\n　　“70万根”不准，被“张冠李戴”\n\n　　“洗一次摇粒绒会释放70万根微塑料纤维”这个说法要看洗的是什么衣物、一次洗多少。刘建立教授解释道：大家常引用的这个数字，来自英国普利茅斯大学2016年的一项研究。研究人员选取腈纶、涤纶和涤棉混纺套头衫面料，使用家用滚筒洗衣机，在30℃和40℃下，比较添加不同洗涤剂、是否使用柔顺剂时的纤维释放情况，每次程序为75分钟。其中，腈纶样品从论文照片来看是针织面料。研究人员根据试验结果推算，6公斤腈纶织物一次洗涤可释放约72.9万根纤维。也就是说，这个数字对应的是6公斤腈纶织物，不能直接套用到一件摇粒绒上。\n\n　　刘建立教授补充道：针对摇粒绒(抓绒)的独立研究更直接数据来自加州大学圣塔芭芭拉分校的一项研究，对包括涤纶抓绒夹克在内的服装进行了单件洗涤试验。试验使用自来水，不添加洗涤剂，分别采用顶开门中央搅拌式和前开门滚筒式洗衣机，程序时长分别为30分钟和24分钟。该校官方报道援引研究作者的估算，单件夹克一次洗涤可释放约10万根合成纤维。\n\n　　所以，摇粒绒确实是微纤维释放的“大户”，但“70万根”这个具体数字被错误地安在了它头上。\n\n　　不止洗涤，日常穿着也在掉\n\n　　需要提醒的是，洗涤只是微塑料纤维释放的一个场景。摇粒绒特殊的蓬松起绒结构，决定了其在日常穿着时的摩擦、日晒、磨损过程中，表面的绒毛同样容易断裂，脱落塑料微纤维。\n\n　　且不同品质、新旧程度的摇粒绒，释放量差距非常显著，主要受衣物所用面料的织物组织结构、纤维的细度和断裂强力，以及衣物新旧程度和洗衣机类型影响。刘建立教授表示：如果织物织造时，用的纤维细度小且断裂强力低，同时织物组织结构松散，微纤维更容易脱落，释放量较大；旧款的摇粒绒衣物，由于纤维已经历多次洗涤和穿着磨损，结构更为松散，脱落量会进一步显著升高。且研究明确指出，相比滚筒洗衣机，使用机械作用力更强的波轮洗衣机洗涤时，纤维脱落量也会更高。\n\n　　虽然没有直接对比不同加工工艺的摇粒绒释放微纤维量的精确数据，但从工艺角度可以推断：起绒工艺越剧烈，比如拉毛、梳毛强度越大、纤维越短越细的摇粒绒，其表面不稳定的纤维越多，理论上在洗涤和摩擦中越容易脱落。高品质面料通常会在工艺上平衡手感与纤维固着率。\n\n　　值得注意的是，针对纤维脱落或微塑料释放的检测标准，行业并不是无据可依。刘建立教授称，相关标准正在逐步建立和完善中。在常规质检层面，商家在选用摇粒绒面料时，一个重要的内控指标就是脱毛率，通常会要求低于1%。\n\n　　在纺织品释放微塑料专项检测层面，目前已有国际和国内标准出台。这些标准的建立，为科学量化不同纺织品(包括摇粒绒)的微塑料释放量提供了统一的测试方法，是未来进行产品评估和监管的重要基础。\n\n　　无需过度恐慌，正确洗涤可减少掉毛\n\n　　掉下来的微塑料纤维，对身体有没有危害？北京服装学院材料设计与工程学院教授吴汉光介绍，制作摇粒绒的聚酯纤维本身相对安全，正常穿着时，皮肤是有效的屏障，能阻挡绝大多数微塑料纤维被吸收，无需过度恐慌；不过，其脱落的微塑料纤维对身体确实存在吸入风险等潜在影响。\n\n　　如果想减少摇粒绒衣物掉毛，可以从洗涤习惯入手。洗涤前，可将衣服翻面，并装入洗衣袋，减少表面摩擦。洗涤时，选择30℃以下冷水，采用轻柔或羊毛模式，并缩短洗涤时间，避免纤维因高温和强力搅动而断裂。同时，不要和毛巾、针织衫等易粘毛的衣物一起洗，防止互相磨损。此外，烘干机的高温和翻滚会显著加剧掉毛，最好选择自然晾干。\n\n　　扬子晚报/紫牛新闻记者 徐悦 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c45f4be095c","title":"杀伤力极大！多人中招！警惕这个“伤人利器”","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735620.shtml","summary":"近年来  时尚便捷的“鲨鱼夹”  受不少人的青睐  可一旦发生意外\r  小小发夹  就可能变成“伤人利器”  　　近日，浙江杭州一网友发帖称，自己开车等红灯时被追尾，后脑戴着的“鲨鱼夹”被撞得稀碎…","summary_short":"近年来  时尚便捷的“鲨鱼夹”  受不少人的青睐  可一旦发生意外\r  小小发夹  就可能变成“伤人利器”  　　近日…","digest":"近年来  时尚便捷的“鲨鱼夹”  受不少人的青睐  可一旦发生意外\r  小小发夹…","points":["近日，浙江杭州一网友发帖称，自己开车等红灯时被追尾，后脑戴着的“鲨鱼夹”被撞得稀碎…","帖子发出后，网友纷纷评论：“人没事就是万幸","2025年5月，河南的纪女士因低血糖在家中摔倒，头上佩戴的“鲨鱼夹”受撞击破碎…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T09:07:06+08:00","size":1,"keywords":[],"body":"近年来\n\n时尚便捷的“鲨鱼夹”\n\n受不少人的青睐\n\n可一旦发生意外\r\n\n小小发夹\n\n就可能变成“伤人利器”\n\n　　近日，浙江杭州一网友发帖称，自己开车等红灯时被追尾，后脑戴着的“鲨鱼夹”被撞得稀碎，好在人没事。\n\n　　帖子发出后，网友纷纷评论：“人没事就是万幸。”“开车时‘鲨鱼夹’一定要取下来。”\n\n　　实际上，这并非个例，“鲨鱼夹”伤人的意外近年来屡屡发生。\n\n　　2025年5月，河南的纪女士因低血糖在家中摔倒，头上佩戴的“鲨鱼夹”受撞击破碎，断裂的锯齿扎破头部，她紧急前往急诊缝针治疗后才脱离危险。\n\n　　2024年9月，四川成都，胡先生和女友骑电动车时摔倒。女友由于头上戴了“鲨鱼夹”，且后脑着地受力，导致头骨骨折，不幸成为植物人。\n\n　　2024年8月，武汉一57岁女士骑电动车时不慎摔倒，“鲨鱼夹”扎进脑后，深可见头骨，缝了8针。\n\n那么，“鲨鱼夹”的杀伤力\n\n究竟有多大？\n\n为什么会致人受伤严重？\n\n国家应急广播联合\n\n北京市西城区消防救援局\n\n开展模拟试验\n\n　　“鲨鱼夹”的杀伤力究竟有多大？\n\n　　试验中，消防员在人偶后脑部绑上鲜肉，模拟人体头部的皮肤，分别夹上金属、塑料材质的多款“鲨鱼夹”。\n\n　　可以看到，人偶倒地的瞬间，金属“鲨鱼夹”的锯齿深深刺入鲜肉；塑料“鲨鱼夹”则发生碎裂，形成能够划伤皮肤的尖锐棱角。\n\n　　北京市西城区消防救援局李禹江介绍，“鲨鱼夹”硬而脆，容易碎裂，佩戴时遭遇磕碰或撞击，可能造成伤害，甚至危及生命。\n\n　　为了防止意外撞击导致的伤害，建议尽量避免购买金属材质的“鲨鱼夹”；在浴室、泳池等易滑倒的场合，或在驾驶、骑行、运动时，最好不要佩戴“鲨鱼夹”。\n\n假如不慎被\n\n“鲨鱼夹”等尖锐物品扎伤\n\n切不可随意大幅度移动\n\n或盲目拔除利器\n\n谨记以下急救知识\n\n　　利器贯穿如何急救？\n\n　　拨打急救电话\n\n　　立即拨打119、120等急救电话，准确报出求救地址，并保护现场，等待救援。\n\n　　切勿拔出利器\n\n　　在等待救援的过程中，要妥善固定刺入利器的外露部分，不可盲目拔出利器，以免造成大出血和更严重的脏器损伤。\n\n　　及时止血\n\n　　如果利器已经穿透身体，引起大量出血，应使用干净的纱布、棉布等填入伤口内，起到充填、压迫止血作用。\n\n　　减少震动\n\n　　前往医院过程中，应尽量减少震动，以防利器移位或刺入更深。\n\n国家应急广播提醒\n\n日常生活中随处可见的小物品\n\n如果使用不当\n\n也会带来严重的安全隐患\n\n请务必加强防范意识\n\n避免意外事故的发生 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd27b04beeb","title":"英雄有容 在韩志愿军烈士张长兴复原画像归家","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075619.shtml","summary":"11月20日，湖南洪江市江市镇红莲洑水村，复旦大学法庭科学研究院办公室主任曹兴杰双手托举着烈士张长兴的容颜复原画像，穿越75载岁月送英雄“回家”。","summary_short":"11月20日，湖南洪江市江市镇红莲洑水村，复旦大学法庭科学研究院办公室主任曹兴杰双手托举着烈士张长兴的容颜复原画像…","digest":"11月20日，湖南洪江市江市镇红莲洑水村…","points":["11月20日，湖南洪江市江市镇红莲洑水村，复旦大学法庭科学研究院办公室主任曹兴杰双手托举着烈…","张长兴是湖南省首位通过DNA技术成功确认身份的在韩志愿军烈士…","复旦大学法庭科学研究院科研团队在无任何历史影像、无颅骨样本参照的情况下…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T22:33:17+08:00","size":1,"keywords":[],"body":"11月20日，湖南洪江市江市镇红莲洑水村，复旦大学法庭科学研究院办公室主任曹兴杰双手托举着烈士张长兴的容颜复原画像，穿越75载岁月送英雄“回家”。\n\n张长兴是湖南省首位通过DNA技术成功确认身份的在韩志愿军烈士，2025年依托退役军人事务部在韩志愿军烈士亲属摸排专项行动，通过精准权威的DNA比对彻底解开身份谜题。复旦大学法庭科学研究院科研团队在无任何历史影像、无颅骨样本参照的情况下，深度比对烈士四位妹妹的五官神态、面部骨相遗传特征，综合运用DNA鉴定、三维颅骨重建、遗物考证等多模态前沿技术，还原出张长兴烈士的青年模样，让英烈“归来”。(邱承 李金欣 制作 侯诗蕊)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/39B04588D5E3438F9727FC89776A228C.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ca18a47fe3e","title":"百对新人喜结良缘 福州市2026年集体婚礼举行","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735580.shtml","summary":"中新网福州11月20日电 (郑江洛)20日，福州市2026年集体婚礼在福州启幕，百对来自各行各业的新人携手踏上幸福红毯，在亲友、职工代表的共同见证下许下相守承诺。","summary_short":"中新网福州11月20日电 (郑江洛)20日，福州市2026年集体婚礼在福州启幕，百对来自各行各业的新人携手踏上幸福红毯…","digest":"20日，福州市2026年集体婚礼在福州启幕，百对来自各行各业的新人携手踏上幸福红毯…","points":["中新网福州11月20日电 (郑江洛)20日，福州市2026年集体婚礼在福州启幕…","这是福州市总工会持续深耕打造的第十七届集体婚礼，以暖心婚育服务，绘就有福之州的幸福底色","本次活动由福州市总工会联合团市委、市妇联共同主办，邀请新人家属、单位代表、一线职工…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:06:16+08:00","size":1,"keywords":[],"body":"中新网福州11月20日电 (郑江洛)20日，福州市2026年集体婚礼在福州启幕，百对来自各行各业的新人携手踏上幸福红毯，在亲友、职工代表的共同见证下许下相守承诺。这是福州市总工会持续深耕打造的第十七届集体婚礼，以暖心婚育服务，绘就有福之州的幸福底色。\n\n20日，福州市2026年集体婚礼在福州启幕。　中新网记者 吕明 摄\n\n　　本次活动由福州市总工会联合团市委、市妇联共同主办，邀请新人家属、单位代表、一线职工、劳模先进及相关领导嘉宾莅临观礼。\n\n　　活动以“福‘见’爱情”为主线，依托“一场婚礼仪式、一台爱情情景剧、一份新婚贺礼”三大板块，搭建起仪式感、情感共鸣、温情回馈为一体的体验链条，生动诠释城市与奋斗青年的双向奔赴，彰显福州“最具幸福感城市”的深厚底蕴。本届新人来自福建、四川、贵州、河南、江西等全国多个省份，是奔赴榕城、扎根榕城的建设者。\n\n　　“95后”新人陈杰、杨琼便是其中一对新人。二人经由同事介绍相识，日常工作中多有配合，相知相爱后于今年领证，符合报名条件便顺势参与到本次集体婚礼当中。\n\n　　“能够入选本次集体婚礼我们觉得十分幸运。”陈杰感慨道，整场活动流程顺畅有序，盛大热烈的现场氛围让他内心满是激动澎湃。杨琼也坦言，这样的婚礼形式充满纪念意义，多年以后回想起来，依然会是难忘的美好回忆。\n\n　　作为福州市总工会服务青年职工的特色品牌，集体婚礼自2010年落地以来，聚焦外来职工交友难、婚恋难的现实需求，推动市、县、基层工会三级联动，持续完善职工婚恋全链条服务。截至目前，活动已连续举办17届，见证1700余对新人喜结良缘、扎根福地。\n\n　　“连续17年办这场婚礼，初心就是当好职工的‘娘家人’。”福州市总工会有关负责人表示，集体婚礼既为在榕打拼的青年职工搭建简约庄重、温暖走心的仪式平台，减轻职工办婚负担，也引导青年树立文明婚恋观，把小家幸福融入城市发展，让扎根福州的奋斗者心安于此、幸福相守。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1911337c3b","title":"陕西省文物安全形势研判会暨消防救援综合演练活动在商洛举行","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735560.shtml","summary":"中新网陕西商洛11月20日电 (记者 阿琳娜)2026年陕西省文物安全形势研判会暨消防救援综合演练活动19日在商洛举行，通报全省文物安全形势，研判文物领域风险隐患，交流防控举措…","summary_short":"中新网陕西商洛11月20日电 (记者 阿琳娜)2026年陕西省文物安全形势研判会暨消防救援综合演练活动19日在商洛举行…","digest":"2026年陕西省文物安全形势研判会暨消防救援综合演练活动19日在商洛举行…","points":["中新网陕西商洛11月20日电 (记者 阿琳娜)2026年陕西省文物安全形势研判会暨消防救援综…","综合演练紧扣消防宣传月“全民消防、生命至上——提高自防自救能力”主题…","现场同步安排消防技能实操展示、商洛非遗展演"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:56:17+08:00","size":1,"keywords":[],"body":"中新网陕西商洛11月20日电 (记者 阿琳娜)2026年陕西省文物安全形势研判会暨消防救援综合演练活动19日在商洛举行，通报全省文物安全形势，研判文物领域风险隐患，交流防控举措，部署冬春防火及2027年文物安全重点任务，颁发第六届全国文物执法指导性案例获奖单位牌匾，实地开展文物消防救援综合演练。\n\n　　综合演练紧扣消防宣传月“全民消防、生命至上——提高自防自救能力”主题，模拟秦岭博物馆展厅电气线路短路起火场景，依次开展火情上报、初期处置、游客疏散、文物抢护、伤员救护、盗窃警情处置、多部门联合救援、火情扑灭、隐患排查、响应解除等全链条实战科目，检验场馆先期处置、人员疏散、文物应急保护能力，磨合消防、公安、应急、卫健等部门联勤联动机制。现场同步安排消防技能实操展示、商洛非遗展演。参演队伍反应迅速、协同顺畅、处置规范，实现以练促训、实战练兵成效，为全省文博单位消防应急处置提供可借鉴、可复制样板。\n\n图为开展文物消防救援综合演练。商洛市文化和旅游局供图\n\n　　会议强调，全省文博系统要扛牢政治责任，树牢底线思维、极限思维，以“时时放心不下”的责任感压实全链条安全责任，严格落实安全管理各项责任机制。紧盯秋冬防火关键期，聚焦古建筑、展厅库房、文保工地、外包外租场所等重点区域，开展拉网式隐患排查，重大隐患挂牌督办、动态清零，强化消防设施运维，运用智能监测手段源头控险。贯通四级责任链条、织密五级管护网络，按期完成台账核对与责任人公示，紧盯火灾、法人违法、盗掘盗窃等风险，织牢责任、防火、执法、共治四张网，闭环整治隐患，严打文物违法，凝聚群防力量。常态化组织消防实操、隐患排查、应急处置、执法业务培训和实战演练，抓实督察整改、制度配套、队伍建设、应急值守，严格落实24小时值班和信息报送，扎实开展岁末年初全覆盖排查，守牢文物安全红线、底线、生命线。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf279b5886f","title":"宁夏首次发布“宁夏枸杞”商标维权典型案例 多梯度打击商标侵权","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735552.shtml","summary":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏枸杞产业发展中心获悉，该中心首次对外发布《2025年“宁夏枸杞”商标维权典型案例》。","summary_short":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏枸杞产业发展中心获悉…","digest":"11月20日，记者从宁夏枸杞产业发展中心获悉…","points":["中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏枸杞产业发展中心获悉…","自2025年以来，该中心联合中宁县枸杞产业发展服务中心持续开展“宁夏枸杞”地理标志证明商标维…","其中2起案件以发律师函方式督促当事人自行整改"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:46:01+08:00","size":1,"keywords":[],"body":"中新网银川11月20日电 (记者 于晶)11月20日，记者从宁夏枸杞产业发展中心获悉，该中心首次对外发布《2025年“宁夏枸杞”商标维权典型案例》。自2025年以来，该中心联合中宁县枸杞产业发展服务中心持续开展“宁夏枸杞”地理标志证明商标维权专项行动，本次公布9起案例，覆盖线上线下多场景侵权行为，单案最高赔偿金额达3万元。\n\n资料图“三标一码”“四标一码”标识。宁夏枸杞产业发展中心供图\n\n　　这批案例清晰呈现“律师函督促整改、行政举报查处、司法诉讼追责”三级维权梯度，侵权花样层出不穷。除直接冒用字样外，“一字之差”近似表述、繁体字变体、门店门头擅自使用等隐蔽方式，均被认定侵害“宁夏枸杞”地理标志证明商标专用权。\n\n　　其中2起案件以发律师函方式督促当事人自行整改。拼多多一家冲调旗舰店将宣传页、外包装上“宁夏红枸杞”修改为“红枸杞”；云南开远市一家食品经营店铺主动下架涉事枸杞产品并关停店铺。另有商家在商会宣传页面标注“宁夏枸杞”，实际产品并非宁夏产地。\n\n　　4起案件通过行政渠道举报查处，处置结果各有不同。安徽亳州一家线下门店因在门头、外包装使用“宁夏枸杞”“宁夏枸杞王”，因情节轻微且及时纠正，监管部门予以批评教育、不予处罚；抖音一家冲饮旗舰店因外包装标注相关字样被罚款3000元；淘宝一店铺被没收违法所得并处罚款合计761.76元；还有企业使用繁体“寕夏枸杞”标识，被责令停止侵权并罚款500元。\n\n　　3起案件进入司法程序，形成有力司法震慑。亳州两家企业分别在抖音商品标题、宣传图、外包装使用侵权字样，法院判决其停止侵权，各赔偿1.6万元；亳州另一家药业公司在淘宝店铺侵权，经法院调解达成协议，停止侵权并赔偿3万元。\n\n　　据介绍，本次维权范围不再局限枸杞主产区，延伸至国内集散市场和各大线上消费端，拼多多、抖音、淘宝等主流电商平台均有涉案。\n\n　　宁夏言成律师事务所相关负责人表示，未经授权冒用“宁夏枸杞”“中宁枸杞”、虚假标注产地、页面虚假宣传等行为，违反商标法、反不正当竞争法、地理标志产品保护办法以及《宁夏回族自治区枸杞产业促进条例》，扰乱市场秩序，损害区域公用品牌形象，相关主体都将承担相应法律责任。他同时提醒消费者，选购枸杞认准“三标一码”“四标一码”，更好辨别正宗宁夏枸杞。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c70f58ea0f7","title":"宁夏为国省干线逐公里赋数字坐标 公路养护实现精准溯源","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735549.shtml","summary":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉，宁夏公路管理中心吴忠分中心已完成宁夏普通国省干线公路路面技术状况检测，同步开展逐公里GPS精准打点…","summary_short":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉…","digest":"20日，记者从宁夏公路管理中心获悉…","points":["中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉…","工作人员在采集路面技术指标的同时，完成公里点位GPS定位，建立“一公里一坐标”台账…","宁夏公路管理中心吴忠分中心相关负责人介绍，依托公里级坐标与路况检测数据…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T21:41:37+08:00","size":1,"keywords":[],"body":"中新网银川11月20日电(记者 于晶)20日，记者从宁夏公路管理中心获悉，宁夏公路管理中心吴忠分中心已完成宁夏普通国省干线公路路面技术状况检测，同步开展逐公里GPS精准打点，为每一公里公路赋予专属数字坐标，以空间数据支撑智慧公路养护。\r\n\n　　此次作业依托多功能路况检测车，实现检测、定位、信息采集一体化。工作人员在采集路面技术指标的同时，完成公里点位GPS定位，建立“一公里一坐标”台账，精准锁定每一段路面位置，补齐过去依靠桩号粗定位、病害点位存在偏差的短板，搭建起公路管养的空间数据底座。\n\n　　宁夏公路管理中心吴忠分中心相关负责人介绍，依托公里级坐标与路况检测数据，养护部门可以研判路面衰减规律，科学排布养护计划，推动管养模式由模糊定位转向精准溯源、粗放管护转向靶向治理。\n\n　　标准化公里坐标数据将接入宁夏公路日常养护管理平台，实现病害定位、数据归集、全过程监管。养护决策逐步告别经验判断，转向数据驱动，从被动抢修向主动预防转变。在防汛防滑、路面突发险情处置场景中，这套坐标体系能够快速锁定事发地点，缩短应急调度和抢修时间，保障路网通行安全。\n\n　　据了解，后续宁夏公路部门将持续做好路况数据动态更新，深化数字化成果应用，以数据赋能路网精细化管养，持续提升普通国省干线通行保障能力。(完) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf6236fef76","title":"冬天猛搓澡不等于干净 正确洗澡记住三点","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075616.shtml","summary":"入冬后，洗澡这件日常小事衍生出不少“养生玄学”。","summary_short":"入冬后，洗澡这件日常小事衍生出不少“养生玄学”。","digest":"入冬后，洗澡这件日常小事衍生出不少“养生玄学”","points":["入冬后，洗澡这件日常小事衍生出不少“养生玄学”","中华中医药学会风湿病第六届委员会委员，吉林省吉林中西医结合医院风湿科副主任于淼表示…","因此，她提出三点冬季洗澡建议，首先，水温别太烫"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:38:47+08:00","size":1,"keywords":[],"body":"入冬后，洗澡这件日常小事衍生出不少“养生玄学”。中华中医药学会风湿病第六届委员会委员，吉林省吉林中西医结合医院风湿科副主任于淼表示，北方人的搓澡文化根深蒂固，但爱搓澡并不等于干净，使劲搓澡，搓掉的是皮肤表层保护的油脂，反而有可能伤害皮肤危害健康。因此，她提出三点冬季洗澡建议，首先，水温别太烫；其次，少搓快洗，洗完保暖；最后，洗完澡后适当地涂上一些身体乳，既能保护皮肤，也能减少风寒湿邪的侵袭。(记者 苍雁 石洪宇 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/9646518FA2EF4A0DB259C0CF2040F63A.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ca4e96d32cf","title":"农房变影棚、村民当群演 湖南“短剧村”激活乡村闲置资产","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075615.shtml","summary":"近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”，在当地进驻的剧组中过“戏瘾”、领片酬。","summary_short":"近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”，在当地进驻的剧组中过“戏瘾”、领片酬。","digest":"近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”…","points":["近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”，在当地进驻的剧组中过“戏瘾”…","这座千年水乡古镇，通过盘活闲置农房、古街老院等资源，打造天然微短剧片场，原生态场景覆盖古风…","截至目前，乔口镇已累计承接微短剧剧组40余个，拍摄作品超50部…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:38:27+08:00","size":1,"keywords":[],"body":"近日，在湖南长沙乔口镇柳林江村，不少村民摇身一变成“群演”，在当地进驻的剧组中过“戏瘾”、领片酬。\n\n据悉，这座千年水乡古镇，通过盘活闲置农房、古街老院等资源，打造天然微短剧片场，原生态场景覆盖古风、民国、乡村等多元题材，并配套一站式剧组服务，吸引数十个剧组落地。截至目前，乔口镇已累计承接微短剧剧组40余个，拍摄作品超50部，仅柳林江村村集体收入便已突破180万元人民币。(张雪盈 李盈）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/7FEEEC279DD8462A9361987C60DDE83B.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":99,"items":[{"id":"cba5356a810","title":"产业规模破万亿元！高铁直达、夜场升级，冰雪消费提前升温","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735677.shtml","summary":"新一轮冰雪季开启，我国冰雪消费呈现出不少新变化：秋假带动亲子冰雪游提前升温，南方游客持续涌入北方雪场，冰雪产业规模突破万亿元。","summary_short":"新一轮冰雪季开启，我国冰雪消费呈现出不少新变化：秋假带动亲子冰雪游提前升温，南方游客持续涌入北方雪场…","digest":"新一轮冰雪季开启，我国冰雪消费呈现出不少新变化：秋假带动亲子冰雪游提前升温…","points":["新一轮冰雪季开启，我国冰雪消费呈现出不少新变化：秋假带动亲子冰雪游提前升温…","冰雪游正从季节性运动体验，向亲子研学、休闲度假和综合消费延伸，为冬季文旅市场注入新活力","服务窗口重新划分布局，增设大屏实时公示业务信息，同时推出雪具破损免赔、雪具酒店专送…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:35:12+08:00","size":1,"keywords":[],"body":"新一轮冰雪季开启，我国冰雪消费呈现出不少新变化：秋假带动亲子冰雪游提前升温，南方游客持续涌入北方雪场，冰雪产业规模突破万亿元。冰雪游正从季节性运动体验，向亲子研学、休闲度假和综合消费延伸，为冬季文旅市场注入新活力。\r\n\n　　吉林：通化万峰雪场高铁直达 夜场再扩容\n\n　　吉林通化万峰滑雪度假区依托长白山余脉优质粉雪，33条雪道总长31公里，覆盖适配新手入门、进阶滑行、专业竞技等不同滑雪群体。雪道导视系统全面更新，进出雪场动线进一步优化。服务窗口重新划分布局，增设大屏实时公示业务信息，同时推出雪具破损免赔、雪具酒店专送、雪道免费热饮等便民服务。夜场12月1日将提前开放，经典C1雪道、逐梦道加入夜场序列。\n\n　　沈白高铁开通后，“飞机+高铁”“高铁+接驳”让半日游、周末游和亲子度假更加便利。度假区市场部总监耿浩霖表示，本雪季还将持续推出多项高水准冰雪赛事与品牌快闪活动，进一步集聚人气、拉长消费链条，全方位丰富游客度假体验感。\n\n　　黑龙江：哈尔滨冰雪大世界造雪 规模创新高\n\n　　11月18日晚，第二十八届哈尔滨冰雪大世界正式开启造雪作业。30多台造雪机全速运转，首批验收合格的雪料将用于打造本届首个大型雪雕“雪人一家”，预计高15米、用雪量3400立方米，是今冬最早亮相的雪雕景观。本届园区规模创历届之最，扩容至125万平方米，总用冰用雪量40万立方米，全园冰雪建筑超千座，《哈冰秀》、冰雪汽车芭蕾秀、主题巡游等轮番上演。\n\n　　哈尔滨的亚布力滑雪旅游度假区已率先开板，率先投用的山顶初级雪道，带给游客“先登顶、再滑雪”的独特体验，吸引不少外地游客前来打卡。开板至今，度假区已接待游客10.32万人次。本周末，多条雪道将陆续开放，景区持续完善雪道、交通、食宿配套，不断优化游客滑雪体验。\n\n　　新疆：青河狼山雪场开板 民俗活动与滑雪共享\n\n　　在新疆阿勒泰地区青河县，海拔约2000米的青格里狼山国际滑雪场也迎来了新雪季。作为阿勒泰四大滑雪场之一，这里拥有13条覆盖各水平的雪道。\n\n　　滑雪之外，雪场还同步举办了冬季趣味运动会。拔河比赛火热进行，叼羊比赛激烈展开，不少游客也主动加入体验。一位进阶滑雪爱好者余雪飞评价道：“狼山的雪道又宽又长、雪质好，非常适合进阶选手。”而来自南方的游客郭杰则感叹：“这里的环境让人感觉与大自然融为一体，赛马、骑马这些体验在南方根本接触不到，非常棒。”\n\n　　深圳：前海室内滑雪场 外国游客同比增长44.8%\n\n　　位于广东深圳的前海冰雪世界，是目前全球建筑面积最大的室内滑雪场之一。上午十点刚开门，便有不少外国游客前来租赁雪服雪具。一位英国游客直言体验过一次就“上瘾”，看到雪场高手云集直呼“很酷”；一位美国佛蒙特州的游客则兴奋地表示，家乡雪季将尽，能在这里体验全球最大的室内滑雪区，实现每天滑雪。\n\n　　数据显示，11月1日至18日，该雪场的外国游客人数同比增长44.8%。受北方雪季分流影响，每年四季度通常是南方室内雪场的运营淡季。但今年受深圳中小学秋假带动，学生游客明显增加，雪场呈现“淡季不淡”的态势。\n\n　　2025年9月底开始运营以来，前海冰雪世界人流量持续增长，截至目前已接待游客超150万人次，冰雪经济正带动周边，成为消费新增量。\n\n　　广东深圳华发冰雪体育有限公司董事长李挺介绍，商圈内雪具雪服挑选、教练教学、高压氧舱康复及餐饮等业态深度联动，每周人流量超3万人次，远超预期。\n\n　　冰雪消费：多重利好 潜力释放\n\n　　随着新一轮冰雪季开启，我国冰雪消费呈现新变化。11月以来，河北崇礼、吉林北大湖、新疆阿勒泰等地雪场陆续“开板”，去哪儿旅行数据显示，11月以来，“滑雪”“冰雪”等关键词搜索量月环比增长1.2倍。航旅纵横数据显示，今年11月，前往张家口的机票预订量同比增长超270%，前往阿勒泰的机票预订量同比增长约50%。\n\n　　11月以来，全国多省份分批落地中小学秋假，和冰雪季叠加，让今年冰雪消费的启动窗口较往年进一步前移。此外，吉林省、新疆阿勒泰地区、内蒙古呼伦贝尔市、河北张家口市等地已陆续公布2026年雪假安排，进一步释放冰雪季消费潜力。\n\n　　同程研究院研究员薛冰冰分析，在部分地区的中小学生秋假和雪假带动下，预计2026—2027雪季冰雪游亲子家庭客群的占比将进一步上升至45%，其中，亲子研学游需求将有30%以上的增长。\n\n　　南方游客对冰雪游热情持续高涨。同程旅行报告显示，东北核心冰雪目的地游客中约有六成来自南方；全国室内冰雪消费最热门的十座城市中，有八座是南方城市。美团数据显示，南方用户购买北方雪场雪票的订单量同比增长超四成。\n\n　　根据2026国际冬季运动博览会数据，2025至2026冰雪季全国居民冰雪运动参与人数达3.08亿，冰雪旅游休闲人次突破3.6亿，冰雪产业规模突破万亿元。\n\n　　北京体育大学中国体育发展研究院教授蔡娟表示，冰雪产业链将向服务端和综合消费端进一步延伸，装备租赁、培训教学、赛事观演、住宿餐饮、休闲康养等消费需求同步增长，增加游客的停留时间，提高场外消费和综合的经营收益，有利于推动冰雪产业形成多元收入结构。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c357d818870","title":"源杰科技独家直投芯钬量子A++轮融资","url":"https://www.jiemian.com/article/15357765.html","summary":"11月20日晚，上海芯钬量子科技有限公司宣布完成A++轮融资，由源杰科技独家直投。","summary_short":"11月20日晚，上海芯钬量子科技有限公司宣布完成A++轮融资，由源杰科技独家直投。","digest":"11月20日晚，上海芯钬量子科技有限公司宣布完成A++轮融资，由源杰科技独家直投","points":["11月20日晚，上海芯钬量子科技有限公司宣布完成A++轮融资，由源杰科技独家直投","此前，公司天使轮、A轮及A+轮分别由慧眼资本、京东方显智链和交银资本投资","本轮融资后，芯钬量子将围绕工业AI与多物理场仿真能力的深度融合持续加大投入"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T11:34:30+08:00","size":1,"keywords":[],"body":"11月20日晚，上海芯钬量子科技有限公司宣布完成A++轮融资，由源杰科技独家直投。此前，公司天使轮、A轮及A+轮分别由慧眼资本、京东方显智链和交银资本投资。本轮融资后，芯钬量子将围绕工业AI与多物理场仿真能力的深度融合持续加大投入。芯钬量子表示，未来还将探索量子计算、超导、光子芯片、自旋电子及拓扑物态等前沿领域的应用需求。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c939698141b","title":"俄称乌克兰加入北约完全不可接受","url":"https://www.jiemian.com/article/15357763.html","summary":"据俄新社报道，俄罗斯外交部副部长里亚布科夫11月20日表示，乌克兰加入北约对俄方而言“完全不可接受”，为乌方谋求“准成员国”地位或寻找某种“创造性解决方案”也不会被俄方接受。","summary_short":"据俄新社报道，俄罗斯外交部副部长里亚布科夫11月20日表示，乌克兰加入北约对俄方而言“完全不可接受”…","digest":"据俄新社报道，俄罗斯外交部副部长里亚布科夫11月20日表示…","points":["据俄新社报道，俄罗斯外交部副部长里亚布科夫11月20日表示…","里亚布科夫表示，鉴于欧盟“日益咄咄逼人”的姿态、鲜明的反俄路线以及持续军事化，俄方认为…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T11:33:45+08:00","size":1,"keywords":[],"body":"据俄新社报道，俄罗斯外交部副部长里亚布科夫11月20日表示，乌克兰加入北约对俄方而言“完全不可接受”，为乌方谋求“准成员国”地位或寻找某种“创造性解决方案”也不会被俄方接受。里亚布科夫表示，鉴于欧盟“日益咄咄逼人”的姿态、鲜明的反俄路线以及持续军事化，俄方认为，欧盟与北约之间“没有多大差别”。（CCTV国际时讯）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c90f19c6b2c","title":"旧面板厂不愁卖，芯片巨头为什么排队接盘","url":"https://www.jiemian.com/article/15357739.html","summary":"文｜半导体产业纵横  过去两年，显示产业最忙的一件事不是盖厂，而是卖厂，而买家名单里出现得最频繁的面孔，就是晶圆代工厂和存储厂。","summary_short":"文｜半导体产业纵横  过去两年，显示产业最忙的一件事不是盖厂，而是卖厂，而买家名单里出现得最频繁的面孔…","digest":"文｜半导体产业纵横  过去两年，显示产业最忙的一件事不是盖厂，而是卖厂…","points":["过去两年，显示产业最忙的一件事不是盖厂，而是卖厂，而买家名单里出现得最频繁的面孔…","那些被贴上“落后产能”标签的5代线、5.5代线、7.5代线…","友达这边，高雄路竹5代彩色滤光片厂以约12.8亿元卖给日月光…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T11:32:51+08:00","size":1,"keywords":[],"body":"文｜半导体产业纵横\n\n过去两年，显示产业最忙的一件事不是盖厂，而是卖厂，而买家名单里出现得最频繁的面孔，就是晶圆代工厂和存储厂。那些被贴上“落后产能”标签的5代线、5.5代线、7.5代线，忽然成了半导体扩产链条上最短的一条路径，备受青睐，甚至被哄抢。\n\n买家名单越来越长\n\n早在2024年8月15日，台积电以约34.7亿元买下群创南科四厂，一座已经停产的5.5代LCD厂，群创认列处分利益约29.8亿元。此后不到一年，这座厂变成台积电的AP8先进封装基地，据了解，2025年4月2日进机，无尘室面积接近10万平方米，约为此前AP5厂的四倍，首阶段整修只用了8个月。值得一提的是，这座厂最初中意的买家是美光，台积电抢到了这笔交易。\n\n两年多之后，价格翻了一倍多。2026年10月29日，友达公告把台中二期厂区整体卖给台积电，标的包含L5C 5代线、L6A 6代线与L7A 7.5代线共九处建物、无尘室及厂务设施，权状面积约42.9万平方米，使用面积约16.6万坪，交易金额约78.5亿元，预计处分利益约37.4亿元，须待交割条件满足后认列。两家估价机构给出的估值都在78亿元上下，成交价还略高于估值。加上此前的群创南科厂，台积电为这两笔二手厂房合计付出约113.2亿元。\n\n买家当然不止台积电。存储厂美光在2024年8月接手友达台南科技工业区的C4A、C5D、C6C三座彩色滤光片厂，作价约15.0亿元，加上友达晶材位于后里的西侧设施约1.4亿元，合计约16.4亿元，用途是前段晶圆测试，就近支撑台中的DRAM产能；2025年2月，后里东侧厂再以约6.2亿元成交，后里东西两侧合计约7.6亿元。晶圆代工的另一家联电，2025年6月被传出正在与彩晶洽谈购置其南科Fab12A对面的厂房，用于发展先进封装，联电对传闻不予评论，只表示不排除在台扩厂。这场洽谈后来没有下文，2026年4月，这块厂房由日月光旗下的矽品以约8.7亿元买下。\n\n再往外一圈，是同一套逻辑的延长线。2026年4月，群创把南科Fab5以约30.1亿元卖给日月光半导体，建物面积约18.4万平方米，处分利益约26.9亿元；3月10日董事会通过，把南科模组厂以约1.8亿元卖给南茂，建物3.43万平方米，处分利益约1.3亿元；精金则以约13.1亿元把南科厂房卖给矽品，与彩晶那笔合并计算，矽品一共花了约21.9亿元。\n\n友达这边，高雄路竹5代彩色滤光片厂以约12.8亿元卖给日月光，新加坡AFPD厂房以约18.6亿元卖给西部数据。严格说，日月光、矽品、南茂是封测厂，美光、西部数据是存储制造厂，真正意义上的晶圆代工厂只有台积电和联电。但这恰恰说明，争抢的对象不只是代工产能，整条芯片制造链条都在抢高标准洁净空间。\n\n买的是厂房，省下的是时间\n\n支撑这一轮厂房抢购潮的底层背景，是AI算力竞赛里瓶颈重心的转移。过去三年，AI芯片的约束条件不断切换，先进制程、HBM先后成为行业卡点，到2026年，先进封装的产能供给矛盾走到台前。\n\n据机构估算，台积电CoWoS月产能从2022年的约1.2万至1.5万片，提升到2025年的近7万片，2026年底预计达到12万至14万片。叠加日月光、安靠等封测厂外包的5万至6万片，全行业月产能接近20万片。即便如此，2026年供需缺口仍在20%左右。\n\n供应链估算英伟达锁定台积电2026年CoWoS产能约80万至85万片，占台积电当年CoWoS全年产能一半以上。博通、AMD、谷歌 TPU、亚马逊 Trainium等客户需要在剩余产能中排队。供应链消息称订单交付周期可达52至78周，下单后需等待一年半左右方可交付。\n\nCoWoS的稀缺直接反映在价格上。据东北证券测算，CoWoS单片晶圆ASP约1万至1.05万美元，单位产能市值约128亿美元每万片每月，和7nm先进制程的140亿美元相差不到10%。先进封装毛利率48%至55%，并不低于先进制程。2026年10月，供应链传出台积电正考虑把CoWoS报价上调10%至20%，客户几乎没有太多议价空间。\n\n而技术路线的演进，进一步放大了对超大洁净空间的需求。台积电5倍光罩尺寸的CoWoS已经在2026年量产，14倍光罩尺寸计划2028年量产，CoPoS面板级封装预计2027年小批量试产，2028年底至2029年量产。封装尺寸持续扩张，对厂房净高、楼面承重、大尺寸基板搬运通道的要求随之抬升，传统适配12英寸圆片的封装厂房，很难承载下一代大尺寸封装方案。这正是芯片厂商愿意重金收购旧面板厂房的核心逻辑，厂房带来的大面积洁净空间，刚好匹配CoPoS这类新架构的硬件条件。\n\n因此，市场极致的需求让台积电必须加快扩产节奏，但按台积电自己的建设节奏，2025年至2026年每年要新建或改造九座厂，此前平均每年只有四座，先进封装与先进制程同时在抢工期。新建一座半导体厂，从选址、环评、土建、机电安装到装机验证，通常以年为单位；而买下一座现成厂房，只需要厂内改装、设备进驻和试产。群创南科四厂改造为AP8时，供应链的说法很直白，这笔交易省去了须以年计的环评阶段，只要进行厂内改装，不到一年机台进驻后就可以投产。所以，如果只看地皮和建筑，约78.5亿元买一片旧厂房并不便宜，甚至高于市场早前传闻的约60.7亿元。台积电愿意溢价，是因为它买的不是资产，而是时间。\n\n友达台中厂这笔交易更能说明地利的价值。友达中科厂区与台积电中科十五厂相邻，台积电在中科Fab25规划四座A14即1.4纳米晶圆厂，首座2027年4月完工、同年第三季试产，按官方说法量产要等到2028年，四座厂预计2028年第二季全数完工。厂房、土地、供电、纯水、废水许可、人才与供应链，都已经在一个运转了二十年的科学园区里准备好了。买旧厂，等于把最难谈的那部分前置条件一次性买断。\n\n面板车间为什么天生像晶圆厂\n\nTFT-LCD的阵列段本来就是一串半导体工艺：成膜用PVD和CVD，图形化用曝光和显影，刻蚀、剥离、清洗、检测一个不少，只不过基板是玻璃而不是硅片，线宽在微米级而不是纳米级。为了守住良率，这条产线同样配备了百级到千级的洁净室、满布FFU的垂直层流、高架地板、恒温恒湿、超纯水、特种气体、化学品供应与废液废气处理系统，同样要防微振、防静电、防颗粒污染。一座5.5代厂的洁净室面积动辄数万平方米，7.5代厂的厂房跨度、层高与物流通道更是按大尺寸玻璃搬运设计的。\n\n这些条件恰好是先进封装和面板级封装的入场券。封装线需要的不是纳米级洁净度，而是大面积、高等级、可灵活分区的洁净空间，以及能搬运大尺寸基板的天车与自动化物流。存储测试线同理，美光把友达厂房改成前段晶圆测试基地，看中的就是大空间与现成的厂务系统。\n\n但晶圆前道，尤其先进逻辑，洁净室要做到ISO1至3级，对分子级污染物、微振动、温湿度波动的控制远严于面板厂常规的ISO5至6级，厂房的承重、层高与化学兼容性也未必够。所以旧面板厂改造的最佳落点是先进封装、面板级封装、晶圆测试、成熟制程与功率器件，而不是先进逻辑前道。台积电一边买旧厂做封装，一边仍在中科新建A14厂，两条腿走路。\n\n卖方算的又是另一笔账\n\n面板厂愿意卖，是因为留在手里的账已经算不过来。\n\n小世代线在成本上早已没有竞争力。同样的玻璃基板，大世代线的切割效率、单位折旧和材料利用率全面占优，5代、5.5代线只能退守工控、车载、医疗等利基市场。据洛图科技测算，2025年中国大陆厂商在全球液晶电视面板出货的合并份额达到72.1%，比2024年提升5.6个百分点；TrendForce则预估，大陆厂商的LCD产能占比会从2024年的68%升到2025年的71%，同期群创与友达的全球LCD产能占比将分别降到9.1%和9.2%。留在原地拼价格，只会把现金继续消耗在折旧上。\n\n卖厂则一次性把已经沉没的资产变成了现金。群创2026年第三季税后纯益约15.6亿元，年增超过114倍，前三季累计约28.0亿元、年增约50倍，但同期营业利益只有约2.0亿元，营业利益率1.70%，本业对净利的贡献约为13%，其余绝大部分来自资产处分。这个结构说明得很直白：卖厂撑起了报表，本业仍在盈亏线附近窄幅浮动。\n\n友达董事长彭双浪在公告后表示，今年以来公司陆续推进厂房处置，剩余厂房空间已完成合理配置，资产活化到此告一段落，回笼资金将投入策略性与未来性项目。群创把钱投进面板级扇出封装、X-ray传感器与车用系统整合，并保留玻璃基板试产线；彩晶把目标定在车载、工控、穿戴与无人机，2027年车载营收占比要过三成。这些方向有一个共同点，都需要现金，也都不需要那么多旧产线。\n\n代价同样存在。处分利益是一次性的，卖完之后产能空心化，营收规模会往下走，员工安置也是真问题。据台媒报道，群创南科五厂关厂时给出优离方案，年资20年可领至少9个月薪资，分三个梯次在6月启动、8月完成。彩晶2026年上半年毛利率仍为负3.24%、营业亏损约1.9亿元、已连亏四年，对它来说，卖厂更像是止血，还谈不上从容转型。\n\n不是每一座旧厂都能变身\n\n这条赛道也有失败案例，恰好说明门槛在哪。\n\n友达原本在2026年7月把华亚厂以约39.9亿元卖给广达，用于服务器产能，三个月后又因双方对厂房使用规格与交付时程谈不拢而终止，约27.1亿元的预估处分利益随之落空。厂房不是标准件，买方要的层高、承重、洁净等级、电力冗余、气体管路走向、设备搬入口尺寸，差一样就要重新算账。\n\n真正的改造门槛有四道。第一是结构与防微振，面板厂按大玻璃搬运设计，不等于按光刻机的振动谱设计；第二是洁净度与分子污染控制，先进封装对AMC的要求比面板严得多；第三是电力与厂务冗余，双重电源、UPS、超纯水与特气系统都要扩容；第四是环保许可与排放指标，厂址能改什么，受地方主管部门的清单约束。这也解释了为什么最抢手的是5代以上的大厂房，而不是更老更小更便宜的线。\n\n与之对照的是另一条路径。2026年3月，美光完成收购力积电铜锣P5厂，直接拿到约30万平方英尺的300毫米洁净室，改造后计划2028财年开始出货，并已规划在同一厂址再建一座约27万平方英尺的洁净室。买一座能跑的晶圆厂，价格显然比买一座停摆的面板厂更贵，但它说明同一件事：在AI扩产的竞赛里，现成的洁净空间本身已经成了战略资产。\n\n回到最初的问题。为什么最近面板厂卖厂、芯片厂买厂的案例特别多？\n\n因为三股力量在同一个窗口相遇了。AI把封装和存储变成了算力基建的瓶颈，半导体厂需要最快速度拿到洁净室；液晶进入成熟期，台日韩的旧产线失去了成本竞争力，面板厂需要现金完成转型；土地、电力、环评的约束越来越硬，新建厂的时间成本高到难以接受。三股力量叠加，旧面板厂就从“包袱”变成了“硬通货”。\n\n2026年到2028年，是CoWoS扩产、HBM扩产、玻璃基板从验证走向小批量、CoPoS从试产走向量产的关键三年。这三年里，能改的旧厂会被逐步消化。等到2028年之后，半导体厂的新建产能陆续释放，旧厂的稀缺性会下降，价格也会回归理性。\n\n本文为转载内容，授权事宜请联系原著作权人。台积电\n4.8k\n\n台积电股价下跌2.2%，总市值跌破1.9万亿美元3天前\n美股芯片股盘前普跌，英伟达跌4%、台积电跌5.3%4天前\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n台积电\n旧面板厂不愁卖，芯片巨头为什么排队接盘\n\n支撑这一轮厂房抢购潮的底层背景，是AI算力竞赛里瓶颈重心的转移。\n\n半导体产业纵横 · 2026/11/21 11:32\n\n文｜半导体产业纵横\n\n过去两年，显示产业最忙的一件事不是盖厂，而是卖厂，而买家名单里出现得最频繁的面孔，就是晶圆代工厂和存储厂。那些被贴上“落后产能”标签的5代线、5.5代线、7.5代线，忽然成了半导体扩产链条上最短的一条路径，备受青睐，甚至被哄抢。\n\n买家名单越来越长\n\n早在2024年8月15日，台积电以约34.7亿元买下群创南科四厂，一座已经停产的5.5代LCD厂，群创认列处分利益约29.8亿元。此后不到一年，这座厂变成台积电的AP8先进封装基地，据了解，2025年4月2日进机，无尘室面积接近10万平方米，约为此前AP5厂的四倍，首阶段整修只用了8个月。值得一提的是，这座厂最初中意的买家是美光，台积电抢到了这笔交易。\n\n两年多之后，价格翻了一倍多。2026年10月29日，友达公告把台中二期厂区整体卖给台积电，标的包含L5C 5代线、L6A 6代线与L7A 7.5代线共九处建物、无尘室及厂务设施，权状面积约42.9万平方米，使用面积约16.6万坪，交易金额约78.5亿元，预计处分利益约37.4亿元，须待交割条件满足后认列。两家估价机构给出的估值都在78亿元上下，成交价还略高于估值。加上此前的群创南科厂，台积电为这两笔二手厂房合计付出约113.2亿元。\n\n买家当然不止台积电。存储厂美光在2024年8月接手友达台南科技工业区的C4A、C5D、C6C三座彩色滤光片厂，作价约15.0亿元，加上友达晶材位于后里的西侧设施约1.4亿元，合计约16.4亿元，用途是前段晶圆测试，就近支撑台中的DRAM产能；2025年2月，后里东侧厂再以约6.2亿元成交，后里东西两侧合计约7.6亿元。晶圆代工的另一家联电，2025年6月被传出正在与彩晶洽谈购置其南科Fab12A对面的厂房，用于发展先进封装，联电对传闻不予评论，只表示不排除在台扩厂。这场洽谈后来没有下文，2026年4月，这块厂房由日月光旗下的矽品以约8.7亿元买下。\n\n再往外一圈，是同一套逻辑的延长线。2026年4月，群创把南科Fab5以约30.1亿元卖给日月光半导体，建物面积约18.4万平方米，处分利益约26.9亿元；3月10日董事会通过，把南科模组厂以约1.8亿元卖给南茂，建物3.43万平方米，处分利益约1.3亿元；精金则以约13.1亿元把南科厂房卖给矽品，与彩晶那笔合并计算，矽品一共花了约21.9亿元。\n\n友达这边，高雄路竹5代彩色滤光片厂以约12.8亿元卖给日月光，新加坡AFPD厂房以约18.6亿元卖给西部数据。严格说，日月光、矽品、南茂是封测厂，美光、西部数据是存储制造厂，真正意义上的晶圆代工厂只有台积电和联电。但这恰恰说明，争抢的对象不只是代工产能，整条芯片制造链条都在抢高标准洁净空间。\n\n买的是厂房，省下的是时间\n\n支撑这一轮厂房抢购潮的底层背景，是AI算力竞赛里瓶颈重心的转移。过去三年，AI芯片的约束条件不断切换，先进制程、HBM先后成为行业卡点，到2026年，先进封装的产能供给矛盾走到台前。\n\n据机构估算，台积电CoWoS月产能从2022年的约1.2万至1.5万片，提升到2025年的近7万片，2026年底预计达到12万至14万片。叠加日月光、安靠等封测厂外包的5万至6万片，全行业月产能接近20万片。即便如此，2026年供需缺口仍在20%左右。\n\n供应链估算英伟达锁定台积电2026年CoWoS产能约80万至85万片，占台积电当年CoWoS全年产能一半以上。博通、AMD、谷歌 TPU、亚马逊 Trainium等客户需要在剩余产能中排队。供应链消息称订单交付周期可达52至78周，下单后需等待一年半左右方可交付。\n\nCoWoS的稀缺直接反映在价格上。据东北证券测算，CoWoS单片晶圆ASP约1万至1.05万美元，单位产能市值约128亿美元每万片每月，和7nm先进制程的140亿美元相差不到10%。先进封装毛利率48%至55%，并不低于先进制程。2026年10月，供应链传出台积电正考虑把CoWoS报价上调10%至20%，客户几乎没有太多议价空间。\n\n而技术路线的演进，进一步放大了对超大洁净空间的需求。台积电5倍光罩尺寸的CoWoS已经在2026年量产，14倍光罩尺寸计划2028年量产，CoPoS面板级封装预计2027年小批量试产，2028年底至2029年量产。封装尺寸持续扩张，对厂房净高、楼面承重、大尺寸基板搬运通道的要求随之抬升，传统适配12英寸圆片的封装厂房，很难承载下一代大尺寸封装方案。这正是芯片厂商愿意重金收购旧面板厂房的核心逻辑，厂房带来的大面积洁净空间，刚好匹配CoPoS这类新架构的硬件条件。\n\n因此，市场极致的需求让台积电必须加快扩产节奏，但按台积电自己的建设节奏，2025年至2026年每年要新建或改造九座厂，此前平均每年只有四座，先进封装与先进制程同时在抢工期。新建一座半导体厂，从选址、环评、土建、机电安装到装机验证，通常以年为单位；而买下一座现成厂房，只需要厂内改装、设备进驻和试产。群创南科四厂改造为AP8时，供应链的说法很直白，这笔交易省去了须以年计的环评阶段，只要进行厂内改装，不到一年机台进驻后就可以投产。所以，如果只看地皮和建筑，约78.5亿元买一片旧厂房并不便宜，甚至高于市场早前传闻的约60.7亿元。台积电愿意溢价，是因为它买的不是资产，而是时间。\n\n友达台中厂这笔交易更能说明地利的价值。友达中科厂区与台积电中科十五厂相邻，台积电在中科Fab25规划四座A14即1.4纳米晶圆厂，首座2027年4月完工、同年第三季试产，按官方说法量产要等到2028年，四座厂预计2028年第二季全数完工。厂房、土地、供电、纯水、废水许可、人才与供应链，都已经在一个运转了二十年的科学园区里准备好了。买旧厂，等于把最难谈的那部分前置条件一次性买断。\n\n面板车间为什么天生像晶圆厂\n\nTFT-LCD的阵列段本来就是一串半导体工艺：成膜用PVD和CVD，图形化用曝光和显影，刻蚀、剥离、清洗、检测一个不少，只不过基板是玻璃而不是硅片，线宽在微米级而不是纳米级。为了守住良率，这条产线同样配备了百级到千级的洁净室、满布FFU的垂直层流、高架地板、恒温恒湿、超纯水、特种气体、化学品供应与废液废气处理系统，同样要防微振、防静电、防颗粒污染。一座5.5代厂的洁净室面积动辄数万平方米，7.5代厂的厂房跨度、层高与物流通道更是按大尺寸玻璃搬运设计的。\n\n这些条件恰好是先进封装和面板级封装的入场券。封装线需要的不是纳米级洁净度，而是大面积、高等级、可灵活分区的洁净空间，以及能搬运大尺寸基板的天车与自动化物流。存储测试线同理，美光把友达厂房改成前段晶圆测试基地，看中的就是大空间与现成的厂务系统。\n\n但晶圆前道，尤其先进逻辑，洁净室要做到ISO1至3级，对分子级污染物、微振动、温湿度波动的控制远严于面板厂常规的ISO5至6级，厂房的承重、层高与化学兼容性也未必够。所以旧面板厂改造的最佳落点是先进封装、面板级封装、晶圆测试、成熟制程与功率器件，而不是先进逻辑前道。台积电一边买旧厂做封装，一边仍在中科新建A14厂，两条腿走路。\n\n卖方算的又是另一笔账\n\n面板厂愿意卖，是因为留在手里的账已经算不过来。\n\n小世代线在成本上早已没有竞争力。同样的玻璃基板，大世代线的切割效率、单位折旧和材料利用率全面占优，5代、5.5代线只能退守工控、车载、医疗等利基市场。据洛图科技测算，2025年中国大陆厂商在全球液晶电视面板出货的合并份额达到72.1%，比2024年提升5.6个百分点；TrendForce则预估，大陆厂商的LCD产能占比会从2024年的68%升到2025年的71%，同期群创与友达的全球LCD产能占比将分别降到9.1%和9.2%。留在原地拼价格，只会把现金继续消耗在折旧上。\n\n卖厂则一次性把已经沉没的资产变成了现金。群创2026年第三季税后纯益约15.6亿元，年增超过114倍，前三季累计约28.0亿元、年增约50倍，但同期营业利益只有约2.0亿元，营业利益率1.70%，本业对净利的贡献约为13%，其余绝大部分来自资产处分。这个结构说明得很直白：卖厂撑起了报表，本业仍在盈亏线附近窄幅浮动。\n\n友达董事长彭双浪在公告后表示，今年以来公司陆续推进厂房处置，剩余厂房空间已完成合理配置，资产活化到此告一段落，回笼资金将投入策略性与未来性项目。群创把钱投进面板级扇出封装、X-ray传感器与车用系统整合，并保留玻璃基板试产线；彩晶把目标定在车载、工控、穿戴与无人机，2027年车载营收占比要过三成。这些方向有一个共同点，都需要现金，也都不需要那么多旧产线。\n\n代价同样存在。处分利益是一次性的，卖完之后产能空心化，营收规模会往下走，员工安置也是真问题。据台媒报道，群创南科五厂关厂时给出优离方案，年资20年可领至少9个月薪资，分三个梯次在6月启动、8月完成。彩晶2026年上半年毛利率仍为负3.24%、营业亏损约1.9亿元、已连亏四年，对它来说，卖厂更像是止血，还谈不上从容转型。\n\n不是每一座旧厂都能变身\n\n这条赛道也有失败案例，恰好说明门槛在哪。\n\n友达原本在2026年7月把华亚厂以约39.9亿元卖给广达，用于服务器产能，三个月后又因双方对厂房使用规格与交付时程谈不拢而终止，约27.1亿元的预估处分利益随之落空。厂房不是标准件，买方要的层高、承重、洁净等级、电力冗余、气体管路走向、设备搬入口尺寸，差一样就要重新算账。\n\n真正的改造门槛有四道。第一是结构与防微振，面板厂按大玻璃搬运设计，不等于按光刻机的振动谱设计；第二是洁净度与分子污染控制，先进封装对AMC的要求比面板严得多；第三是电力与厂务冗余，双重电源、UPS、超纯水与特气系统都要扩容；第四是环保许可与排放指标，厂址能改什么，受地方主管部门的清单约束。这也解释了为什么最抢手的是5代以上的大厂房，而不是更老更小更便宜的线。\n\n与之对照的是另一条路径。2026年3月，美光完成收购力积电铜锣P5厂，直接拿到约30万平方英尺的300毫米洁净室，改造后计划2028财年开始出货，并已规划在同一厂址再建一座约27万平方英尺的洁净室。买一座能跑的晶圆厂，价格显然比买一座停摆的面板厂更贵，但它说明同一件事：在AI扩产的竞赛里，现成的洁净空间本身已经成了战略资产。\n\n回到最初的问题。为什么最近面板厂卖厂、芯片厂买厂的案例特别多？\n\n因为三股力量在同一个窗口相遇了。AI把封装和存储变成了算力基建的瓶颈，半导体厂需要最快速度拿到洁净室；液晶进入成熟期，台日韩的旧产线失去了成本竞争力，面板厂需要现金完成转型；土地、电力、环评的约束越来越硬，新建厂的时间成本高到难以接受。三股力量叠加，旧面板厂就从“包袱”变成了“硬通货”。\n\n2026年到2028年，是CoWoS扩产、HBM扩产、玻璃基板从验证走向小批量、CoPoS从试产走向量产的关键三年。这三年里，能改的旧厂会被逐步消化。等到2028年之后，半导体厂的新建产能陆续释放，旧厂的稀缺性会下降，价格也会回归理性。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca56d7599ac","title":"中国驻墨西哥使馆发言人就美国驻新拉雷多总领事涉华言论答记者问","url":"https://www.jiemian.com/article/15357752.html","summary":"美国驻新拉雷多总领事近日称，中国等“域外国家”在墨西哥投资存在“风险”，质疑中国企业在美墨边境附近经营的“动机”。","summary_short":"美国驻新拉雷多总领事近日称，中国等“域外国家”在墨西哥投资存在“风险”，质疑中国企业在美墨边境附近经营的“动机”。","digest":"美国驻新拉雷多总领事近日称，中国等“域外国家”在墨西哥投资存在“风险”…","points":["美国驻新拉雷多总领事近日称，中国等“域外国家”在墨西哥投资存在“风险”…","中国驻墨西哥使馆发言人：这些陈词滥调罔顾事实，充斥冷战零和思维，无端抹黑中墨正常经贸合作…","中国企业在墨守法经营，助力当地创造就业、增加税收和产业升级"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T11:29:33+08:00","size":1,"keywords":[],"body":"美国驻新拉雷多总领事近日称，中国等“域外国家”在墨西哥投资存在“风险”，质疑中国企业在美墨边境附近经营的“动机”。中国驻墨西哥使馆发言人：这些陈词滥调罔顾事实，充斥冷战零和思维，无端抹黑中墨正常经贸合作，中方对此坚决反对。中墨经贸合作光明磊落。中国企业在墨守法经营，助力当地创造就业、增加税收和产业升级。企业选址看市场、看配套，美国企业同样如此。给正常企业行为贴上“风险”标签，凭空揣测企业“动机”，根本站不住脚。拉美不是任何人的后院。拉美各主权国家同谁合作，应由各国自己决定，不需要他人批准。对别国的正常合作指手画脚，究竟是谁在干涉他国，藏着什么“动机”，一目了然。我们奉劝美方有关外交官停止将经贸问题政治化，停止干扰中墨正常合作，把精力多用在增进同驻在国的友好上，而不是对别国说三道四。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c36a24ab551","title":"华为星芒品牌总经理回应O1 PRO定价争议：努力贴近4999","url":"https://www.jiemian.com/article/15357744.html","summary":"11月21日凌晨，华为OSTA星芒品牌总经理刘赫公布O1 PRO首销进展：16G版本已在全平台售罄，远超预期，12G版本仅部分门店和平台合作伙伴有现货，目前正在全力以赴协调产能和版本生产弹性。","summary_short":"11月21日凌晨，华为OSTA星芒品牌总经理刘赫公布O1 PRO首销进展：16G版本已在全平台售罄，远超预期…","digest":"11月21日凌晨…","points":["11月21日凌晨，华为OSTA星芒品牌总经理刘赫公布O1 PRO首销进展…","针对定价争议，刘赫回应称：“星芒要便宜还是星芒要创新，我们选择创新优先","”他也表示，在努力贴近4999这个国补后的价格，这一点导致其高配备货过于谨慎"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T11:28:28+08:00","size":1,"keywords":[],"body":"11月21日凌晨，华为OSTA星芒品牌总经理刘赫公布O1 PRO首销进展：16G版本已在全平台售罄，远超预期，12G版本仅部分门店和平台合作伙伴有现货，目前正在全力以赴协调产能和版本生产弹性。针对定价争议，刘赫回应称：“星芒要便宜还是星芒要创新，我们选择创新优先。”他也表示，在努力贴近4999这个国补后的价格，这一点导致其高配备货过于谨慎。\n\n11月20日下午，华为子品牌OSTA星芒首款新品——OSTA O1 Pro正式发布，售价5699元起，首发价5499元起。新机定位鸿蒙AI手机，首发搭载HarmonyOS 7 AI先锋版，采用阔直板形态，此外还搭载麒麟9030S芯片，配置7000mAh电池。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c135e5c65d8","title":"“三医”协同持续发力 天津北辰探索公立医院改革新路径","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735666.shtml","summary":"中新网天津11月21日电 (记者 江莹)20日，天津市北辰区举办“卫健护航见行见效”专题新闻发布会，介绍该区深化医疗、医保、医药“三医”协同发展治理、优化高水平诊疗供给、提升医院精细化管理相关进展。","summary_short":"中新网天津11月21日电 (记者 江莹)20日，天津市北辰区举办“卫健护航见行见效”专题新闻发布会，介绍该区深化医疗…","digest":"20日，天津市北辰区举办“卫健护航见行见效”专题新闻发布会，介绍该区深化医疗、医保…","points":["中新网天津11月21日电 (记者 江莹)20日，天津市北辰区举办“卫健护航见行见效”专题新闻…","作为国家第二批公立医院综合改革示范区，北辰区持续系统推进医改探索，多措并举夯实群众健康保障","北辰区持续完善现代医院管理制度，着力提升医疗服务供给质量，现已建成5个国家级重点专科…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:19:45+08:00","size":1,"keywords":[],"body":"中新网天津11月21日电 (记者 江莹)20日，天津市北辰区举办“卫健护航见行见效”专题新闻发布会，介绍该区深化医疗、医保、医药“三医”协同发展治理、优化高水平诊疗供给、提升医院精细化管理相关进展。作为国家第二批公立医院综合改革示范区，北辰区持续系统推进医改探索，多措并举夯实群众健康保障。\n\n图为新闻发布会现场。天津市北辰区供图\n\n　　据了解，北辰区持续完善现代医院管理制度，着力提升医疗服务供给质量，现已建成5个国家级重点专科、6个区级重点专科，新增7项多学科诊疗服务，持续做强专科诊疗能力。该区聚力“三医”联动改革，自2024年起，以区域医共体18家成员单位为整体，全面推行家庭医生签约按人头总额付费管理，减轻群众就医负担。全市率先建成的区域集中线上审方中心平稳运行，单日审方量超7000张；公立基层医疗卫生机构实现SPD医用耗材精细化管理全覆盖，2024年以来基层卫生材料收入占医疗收入比重稳步下降。\n\n　　该区持续推动优质医疗资源下沉赋能基层，建成覆盖医共体成员单位的区域远程诊疗中心，累计出具检验、影像、病理、心电等各类报告41.49万份，影像检查实现基层检查、上级诊断占比超50%。依托区级龙头医院带动，下沉共建特色学科24个，帮助基层落地新技术、新项目64项。\n\n　　同时，北辰区加快智慧医共体建设，高标准打造“1+N”智慧医共体，搭建区级全民健康信息集成共享平台，打通区、镇、村三级医疗机构诊疗信息，实现互联互通。该区联合行业企业共建检验、影像数字化质控平台，推动区域医疗服务同质化。智慧医院建设成效凸显，北辰医院电子病历系统应用水平分级评价获评全市唯一6级认证，以数字化赋能区域医疗高质量发展。\n\n　　北辰区卫生健康委党委书记、主任吴畏表示，下一步，北辰区将聚焦“三医”协同、专科协作、强基固本、数智赋能和体系重构集中攻坚，破除层级协作壁垒，筑牢基层健康服务网底，深化医共体内涵建设，培育区域专科联盟集群，扩容区域资源共享中心，把优质健康服务送到群众身边，着力打造公立医院改革的北辰实践样本。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c93956a2faa","title":"（经济观察）重庆构建NCD综合服务体系 激活西部陆海新通道贸易动能","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735667.shtml","summary":"中新网重庆11月21日电 题：重庆构建NCD综合服务体系 激活西部陆海新通道贸易动能  　　作者 殷缘  　　“海运提单凭借其物权凭证属性，构成了国际贸易的制度基石。","summary_short":"中新网重庆11月21日电 题：重庆构建NCD综合服务体系 激活西部陆海新通道贸易动能  　　作者 殷缘  　　“海运提单…","digest":"题：重庆构建NCD综合服务体系 激活西部陆海新通道贸易动能  　　作者 殷缘…","points":["“海运提单凭借其物权凭证属性，构成了国际贸易的制度基石","”在11月举办的2026陆海新通道经济发展论坛中…","今年10月，《联合国可转让货物单证公约》签署仪式举行，包括中国在内的26个国家成为首批签约国"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:19:25+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 题：重庆构建NCD综合服务体系 激活西部陆海新通道贸易动能\n\n　　作者 殷缘\n\n　　“海运提单凭借其物权凭证属性，构成了国际贸易的制度基石。”在11月举办的2026陆海新通道经济发展论坛中，重庆官方发布了以可转让货物单证为牵引的西部陆海新通道综合服务体系。\n\n　　可转让货物单证是一种新型的、代表在途货物的可转让物权凭证，可采用纸质或电子形式，适用于水路、公路、铁路、航空等单式运输及多式联运，各类货物均可适用。\r\n\n　　今年10月，《联合国可转让货物单证公约》签署仪式举行，包括中国在内的26个国家成为首批签约国。该公约创设适用于各类运输方式的可转让货物单证，并赋予其与海运提单相同的物权凭证属性，填补了陆路运单不具有物权凭证属性的国际规则空白，为跨境贸易融资和全球供应链稳定提供更加统一高效的法治保障。\n\n　　作为陆海新通道发源地，重庆是《联合国可转让货物单证公约》构想落地的实践策源地。重庆市政府口岸物流办主任杨琳表示，近年来，重庆在“一单制”改革框架下，以NCD贯通贸易、物流、金融、监管全链条，初步构建起基于公约规范的数字化应用生态和综合服务体系，形成全域共享即联即用的数字服务、联运畅通精准可控的多式联运服务、平台支撑场景贯通的立体化金融服务、规则引领法治护航的集成式专业服务四项重点能力。\n\n　　体系的价值落地于场景，体现在实战。“以粮食进口为例，一票从澳大利亚起运的500吨粮食经海运抵达湛江港，再经铁海联运班列运抵贵州。”杨琳介绍，陆海新通道公司作为多式联运负责人提供“一单制”服务，在公共服务平台给予综合性范本签发全程NCD，同步连通央行、西部陆海智融通平台完成贸易真实性核查，由金融机构提供专项融资，实现一次签发、全程流转、在途融资。\n\n　　制度创新之外，金融机构也持续开展业务探索，把公约条文转化为企业可触达的金融产品。作为西部陆海新通道核心金融主力军，中国建设银行重庆市分行迭代升级“一单制”，落地数字可转让货物单证(eNCD)贸易融资业务，以数字化单证改革打通多式联运融资堵点。\n\n　　“今年8月，我们联合中远海运集运、长安汽车及中银泰国，依托全球首份由实际承运人签发的可转让货物单证(NCD)范本，成功办理首笔电子可转让货物单证(eNCD)项下银行跟单托收业务，为‘渝车出海’注入金融动能。”建行重庆市分行相关负责人介绍。\n\n　　此外，该行还成功落地了中欧班列渝新欧全国首笔eNCD贸易融资，落地“央行西部陆海智融通平台”首笔基于数字可转让货物单证(eNCD)的“一单制”提单真实性核验全线上贸易融资业务，扎实推进通道数字化金融服务落地见效。\n\n　　目前，重庆已累计签发“一单制”提单超7万单，覆盖国际铁路海运、铁海联运等六种运输场景，联合广西、新疆、四川、贵州、湖南、陕西测试签发NCD超600单。通道金融服务已覆盖“13+2”340家金融机构、2600家市场主体，便利融资结算超3600亿元，其中NCD融资超9400万元。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7f40606f8c","title":"腾讯姚顺雨团队：Hy4仍有很大改进空间，计划训练更大规模模型","url":"https://www.jiemian.com/article/15357705.html","summary":"11月21日凌晨，腾讯首席AI科学家姚顺雨带着混元团队出现在海外社交媒体社区，做了一场文字AMA（公开问答）。","summary_short":"11月21日凌晨，腾讯首席AI科学家姚顺雨带着混元团队出现在海外社交媒体社区，做了一场文字AMA（公开问答）。","digest":"11月21日凌晨，腾讯首席AI科学家姚顺雨带着混元团队出现在海外社交媒体社区…","points":["11月21日凌晨，腾讯首席AI科学家姚顺雨带着混元团队出现在海外社交媒体社区…","问答环节，有人直言：字节跳动和Kimi等（参数量）似乎都在往3T甚至5T推…","混元团队回应：“Hy3和Hy4已经证明，较小的模型也能超越较大的模型，而且更便宜"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T11:08:32+08:00","size":1,"keywords":[],"body":"11月21日凌晨，腾讯首席AI科学家姚顺雨带着混元团队出现在海外社交媒体社区，做了一场文字AMA（公开问答）。问答环节，有人直言：字节跳动和Kimi等（参数量）似乎都在往3T甚至5T推，你们为什么停在700B？混元团队回应：“Hy3和Hy4已经证明，较小的模型也能超越较大的模型，而且更便宜。”不过，混元团队也表示，Hy4仍有很大的改进空间，尤其是通过后训练。“我们正投入大量精力进行大规模强化学习，同时继续改善用户体验和模型安全。我们还计划训练更大规模的模型。”（每经）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c46fe635577","title":"2025-2026中国档案数据创新力指数报告：山东、江苏、北京表现突出，省际差距有所收窄","url":"https://www.jiemian.com/article/15357577.html","summary":"界面新闻记者 | 王玉、毛盾 界面新闻编辑 | 崔宇  2026年6月，中共中央办公厅、国务院办公厅印发《全国档案事业发展“十五五”规划》，把“加快推进档案工作数字转型”列为首项主要任务…","summary_short":"界面新闻记者 | 王玉、毛盾 界面新闻编辑 | 崔宇  2026年6月，中共中央办公厅…","digest":"界面新闻记者 | 王玉、毛盾 界面新闻编辑 | 崔宇  2026年6月…","points":["2026年6月，中共中央办公厅、国务院办公厅印发《全国档案事业发展“十五五”规划》…","2026年，国家档案局在《档案专题数据库建设工作规范》解读中指出…","自课题组首次发布《2024 档案数据创新力指数（ADIA）研究报告》以来…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T11:02:26+08:00","size":1,"keywords":[],"body":"界面新闻记者 | 王玉、毛盾\n界面新闻编辑 | 崔宇\n\n2026年6月，中共中央办公厅、国务院办公厅印发《全国档案事业发展“十五五”规划》，把“加快推进档案工作数字转型”列为首项主要任务，并提出到2030年，档案数字转型取得新突破的主要目标。与“十四五”时期相比，“十五五”时期，档案数据创新将更加注重把资源积累转化为服务能力，让数智化建设的成效落实到档案资源的开发利用中，更好支撑国家治理和经济社会发展。\n\n当前，档案数据资源已形成一定规模，但资源数量并不意味着数据质量和利用效能的提升。2026年，国家档案局在《档案专题数据库建设工作规范》解读中指出，部分档案专题数据库存在质效不高、建设不够规范、更新维护不足等问题。\n\n基于此背景，档案数据产教融合发展平台、中国人民大学信息资源管理学院、中国人民大学—宁波八益集团数据智能联合实验室、多模态档案保护与开发国家档案局重点实验室、界面财联社研究院等五家单位共同研制了《中国档案数据创新力指数（ADIA）研究报告（2025—2026）》（以下简称报告）。报告于11月21日在北京友谊宾馆举办的第十六届中国电子文件管理论坛暨2026档案数据产教融合大会上正式发布。\n\n自课题组首次发布《2024 档案数据创新力指数（ADIA）研究报告》以来，档案数据创新问题受到档案部门和相关机构的持续关注。课题组负责人、中国人民大学人文社会科学部部长、信息资源管理学院教授钱明辉表示，“十五五”时期档案数据工作既面临数字化转型与智能应用拓展的发展机遇，也需要应对资源利用与安全管理相协调、数据供给与模型应用相适配、业务流程与工作方式相转变等要求。这些变化涉及技术研发、服务供给、管理实践和制度建设，既需要把握发展方向，也需要了解各地区已有的创新基础与进展。\n\n为呈现全国档案数据创新的发展状况与年度进展，报告沿用技术、业态、管理、制度四个维度，对31个省级行政区的档案数据创新力开展测评，分析全国总体水平、区域格局及各维度创新特征，为研判发展形势和推进档案工作数字转型提供参考。\n\n测评结果显示，2025年全国平均 ADIA 得分89.41分，较2024年平均得分提高0.31分，90分以上省份较2024年多一位增至19个。31个省份得分标准差由 9.20 分降至 7.20 分，省际综合得分差距有所收窄。山东、江苏、北京位列前三，天津、陕西、内蒙古位次提升明显。\n\n从区域来看，长三角、环渤海、泛珠三角、泛西北等四区域 ADIA 得分的位次不变，环渤海、泛西北的分值有所提高，长三角、泛珠三角的分值保持稳定。整体来看，长三角依然保持档案数据创新力的领先，环渤海在管理创新方面提升较快，泛珠三角的业态创新相对突出，泛西北的技术创新能力积累加快。\n\n课题组联合负责人、中国人民大学信息资源管理学院数字人文系系主任、副教授杨建梁表示，2025年，各地围绕智能处理、服务转型与政策供给展开了差异化探索，创新实践呈现多点开花态势。从“技术创新活力、业态创新潜力、管理创新效力、制度创新动力”四个维度的测评框架来看，2025年呈现如下特征。\n\n技术产出稳中有进，智能处理专利占比上升。2025年，档案数据技术创新活力的全国平均得分为85.32分，较上年提高4.28分；85分以上省份由16个增至21个，标准差由9.58分降至5.38分。山西、内蒙古、天津等地得分上升幅度较大。档案数据技术创新在专利规模和类型结构上出现新变化，全国档案数据相关专利申请量增幅近30%，申请内容呈现向智能处理领域集中的态势。\n\n市场主体规模扩大，业务领域呈现多元态势。2025年，档案数据业态创新潜力的全国平均得分为87.41分，同比提高0.27分，近10个省份得分相对上年提高。从档案数据相关企业新增规模来看，2025年相比2024年企业数量提高10.8%。其中，广东、江苏、四川、湖南、浙江企业增量较多。东部地区新增档案数据企业约占全国增量的四成，中西部合计接近六成；广东、四川、浙江的档案数据企业数量位居全国前三。\n\n服务方式持续优化，不同行业应用各具特色。2025年，档案数据管理创新效力的全国平均得分为81.01分。北京、山东、上海、江苏、广东、浙江得分均在89分以上，得分超过85分有11个省份。档案数据管理创新领先地区各有优势，北京的管理科研创新数量最多，山东的行业管理应用创新较为突出，上海在管理科研创新与业务管理应用创新方面较为均衡。\n\n标准体系不断下沉，政策配套措施逐步健全。2025年，档案数据制度创新动力的全国平均得分为88.24分，17省得分超过90分。江苏保持首位、山东升至第二；江西、广东、上海前移9-13位，山西、安徽前移6-7位。全国档案数据相关标准增长稳定，江苏、北京在相关标准建设方面成效突出档案数据相关政策供给不断增加，内容主要涉及机关和企事业单位档案管理、政府采购档案管理、档案征集和开放利用、档案工作责任制等方面。\n\n对于未来的发展趋势，报告指出有四个方向值得关注。技术应用方面，人机协同走向纵深，专业经验沉淀为系统可复用的知识，形成“人员设定任务与标准、系统批量处理、人员重点复核”的协作方式；数据资源方面，以应用需求牵引供给，治理向文件形成源头延伸，长期保存的历史档案，其开发利用正从以整卷整件查阅为主，向档案内部信息的提取与联拓展；利用服务方面，跨域查档融入事项办理，关联利用拓展知识服务，档案利用由正由单项查证向跨领域、跨时期的关联分析深化，并按需融入政务、科研和公共文化平台；业态环境方面，基础业务供给方式转变，增值服务成为竞争重点，专业核验与持续供给能力正成为档案数据服务的重要竞争条件，技术设施建成并不等于可持续服务。\n\n未经正式授权严禁转载本文，侵权必究。趋势新知\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n 关于界面智库\n\n 界面智库是界面新闻旗下的财经和商业智库，聚焦宏观政策、区域经济、产业趋势和资本市场等。我们的宗旨是扎根事实、演绎趋势、探索新知，助力政策制定和企业决策。关于专题策划、研究报告、指数产品和论坛培训等合作，请联系我们。\n\n 联系邮箱：jiemian 三。\n\n服务方式持续优化，不同行业应用各具特色。2025年，档案数据管理创新效力的全国平均得分为81.01分。北京、山东、上海、江苏、广东、浙江得分均在89分以上，得分超过85分有11个省份。档案数据管理创新领先地区各有优势，北京的管理科研创新数量最多，山东的行业管理应用创新较为突出，上海在管理科研创新与业务管理应用创新方面较为均衡。\n\n标准体系不断下沉，政策配套措施逐步健全。2025年，档案数据制度创新动力的全国平均得分为88.24分，17省得分超过90分。江苏保持首位、山东升至第二；江西、广东、上海前移9-13位，山西、安徽前移6-7位。全国档案数据相关标准增长稳定，江苏、北京在相关标准建设方面成效突出档案数据相关政策供给不断增加，内容主要涉及机关和企事业单位档案管理、政府采购档案管理、档案征集和开放利用、档案工作责任制等方面。\n\n对于未来的发展趋势，报告指出有四个方向值得关注。技术应用方面，人机协同走向纵深，专业经验沉淀为系统可复用的知识，形成“人员设定任务与标准、系统批量处理、人员重点复核”的协作方式；数据资源方面，以应用需求牵引供给，治理向文件形成源头延伸，长期保存的历史档案，其开发利用正从以整卷整件查阅为主，向档案内部信息的提取与联拓展；利用服务方面，跨域查档融入事项办理，关联利用拓展知识服务，档案利用由正由单项查证向跨领域、跨时期的关联分析深化，并按需融入政务、科研和公共文化平台；业态环境方面，基础业务供给方式转变，增值服务成为竞争重点，专业核验与持续供给能力正成为档案数据服务的重要竞争条件，技术设施建成并不等于可持续服务。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c09d1a77fa4","title":"伊朗称击落第58架美军“死神”无人机","url":"https://www.jiemian.com/article/15357669.html","summary":"伊朗伊斯兰革命卫队公共关系部门11月21日在社交媒体上说，一架美军MQ-9型“死神”无人机当天在霍尔木兹海峡上空被伊斯兰革命卫队新型防空系统拦截并击落。","summary_short":"伊朗伊斯兰革命卫队公共关系部门11月21日在社交媒体上说，一架美军MQ-9型“死神”无人机当天在霍尔木兹海峡上空被伊斯兰…","digest":"伊朗伊斯兰革命卫队公共关系部门11月21日在社交媒体上说…","points":["伊朗伊斯兰革命卫队公共关系部门11月21日在社交媒体上说…","根据所搭载的传感器和武器不同类型，一架MQ-9型“死神”无人机的造价在3000万美元至500…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T11:01:20+08:00","size":1,"keywords":[],"body":"伊朗伊斯兰革命卫队公共关系部门11月21日在社交媒体上说，一架美军MQ-9型“死神”无人机当天在霍尔木兹海峡上空被伊斯兰革命卫队新型防空系统拦截并击落。这是伊方击落的第58架美军“死神”无人机。根据所搭载的传感器和武器不同类型，一架MQ-9型“死神”无人机的造价在3000万美元至5000万美元之间。（新华社）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf6a972beb0","title":"美财长称仍居住在军事基地","url":"https://www.jiemian.com/article/15357667.html","summary":"美国财政部长贝森特11月20日称，他依然面临来自伊朗方面的安全“威胁”，因此目前仍居住在军事基地里。","summary_short":"美国财政部长贝森特11月20日称，他依然面临来自伊朗方面的安全“威胁”，因此目前仍居住在军事基地里。","digest":"美国财政部长贝森特11月20日称，他依然面临来自伊朗方面的安全“威胁”…","points":["美国财政部长贝森特11月20日称，他依然面临来自伊朗方面的安全“威胁”…","贝森特接受美国消费者新闻与商业频道采访时称，自己“不会被伊朗人吓倒”…","贝森特称：“如果伊朗人针对我，这恰恰表明他们正在承受压力"],"section":"財經","category":"","source":"jiemian","source_display":"界面新 ":"字节20亿元对腾讯5亿美元：AI办公入口之争","url":"https://www.jiemian.com/article/15357591.html","summary":"文｜Tech商业   本周，字节跳动和腾讯同期摊牌。","summary_short":"文｜Tech商业   本周，字节跳动和腾讯同期摊牌。","digest":"文｜Tech商业   本周，字节跳动和腾讯同期摊牌","points":["豆包工作上线三个月，DAU突破800万，企业ARR超过20亿元","豆包工作三个月做到20亿元ARR，增速惊人，但其中相当一部分来自飞书既有客户的升级与迁移…","腾讯说中国百强企业已有60%成为WorkBuddy客户…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T10:46:42+08:00","size":1,"keywords":[],"body":"文｜Tech商业 \n\n本周，字节跳动和腾讯同期摊牌。\n\n豆包工作上线三个月，DAU突破800万，企业ARR超过20亿元。同一天，WorkBuddy披露DAU超过1000万，日均Token消耗100万亿，近七天收入年化折算超过5亿美元。\n\n放在一年前，这组数字只有一个读法：速度竞赛。谁跑得快，谁先撞线。但到了2026年下半年，数字本身退到其次。真正值得拆的，是两组数字背后两套完全不同的入口逻辑——以及它们对“AI办公究竟在争什么”给出的两个答案。\n\n字节：把AI装进飞书的关系网\n\n孤立地看豆包工作的ARR，会失真。它得放进飞书的坐标系里读。\n\n飞书2025年ARR已超30亿元，2026年二季度ARR同比增长超100%。豆包工作三个月做到20亿元ARR，增速惊人，但其中相当一部分来自飞书既有客户的升级与迁移，而非全新的企业采购。\n\n字节的路径很清楚：不另起炉灶造一个AI原生的企业入口，而是把豆包嵌进飞书已经沉淀好的文档、知识库、会议与协作场景。飞书过去几年在中大型客户那里攒下的组织关系、工作流数据和付费习惯，就是豆包工作最短的商业化路径。\n\n这条路的好处是ARR的“厚度”。企业年度经常性收入天生比消费订阅更稳、更可预测；一旦嵌进工作流，替换成本就是事实上的护城河。\n\n代价同样清楚：豆包工作的增长节奏，很大程度上被飞书的客户结构定义。飞书擅长的是知识密集、协作密集的组织，而这在中国企业版图里并不是最大公约数。20亿元ARR之后更该追问的是——在飞书还没覆盖的行业和规模段里，豆包工作能不能独立跑出增量？\n\n腾讯：用户先跑，组织跟上\n\nWorkBuddy几乎是反着走的。\n\n它的前身CodeBuddy是面向开发者的内部效率工具，早期团队直接驻场企业客户，在会议和部署里打磨产品。等产品降低门槛、转向非技术用户的办公场景，接上腾讯文档、QQ邮箱、腾讯新闻这些消费级触点，才真正进入规模化轨道。\n\n腾讯披露的1000万DAU和100万亿日均Token，本质上是消费端频次的胜利：用户先在个人工作场景里形成高频依赖，企业采购意愿随后被“倒逼”出来。\n\n业内一个判断是：“WorkBuddy是用户先用起来，再倒逼组织关注；豆包和千问则是通过已有B端产品直接切入组织。”这解释了为什么WorkBuddy在QuestMobile 9月办公Agent月活榜上以3235.3万居首、季度环比增长647.1%，而豆包工作在同口径下的月活，远不及它DAU暗示的体量。\n\nWorkBuddy的流量逻辑更像消费产品。它的壁垒不在企业合同里，在用户日复一日的操作习惯里。\n\n但“倒逼”的脆弱也在这里：消费端高频，不会自动变成组织级采购。腾讯说中国百强企业已有60%成为WorkBuddy客户，这个数字的含金量取决于“客户”怎么定义——是完成了企业级部署与付费，还是仅仅有一批活跃的个人用户。从个人订阅到企业合同，中间那道转化漏斗，是WorkBuddy下一阶段必须交出的答卷。\n\n模型趋同，胜负手回到渠道\n\n三家在做同一件事：把第三方模型纳入自己的产品体系。\n\nWorkBuddy整合了DeepSeek、智谱GLM、Kimi和MiniMax；豆包工作在自研豆包模型之外接入Kimi、GLM和DeepSeek；千问办公在11月中旬一次性上线10款模型，除Qwen系列外同样覆盖主流第三方。\n\n放在一年前，这会被读作“不够专注”。到了2026年，它只说明一个事实：在办公场景里，底层模型的能力差异，已经不是用户选产品的主要变量。\n\n模型不再是差异化来源，竞争就回落到三个更“重”的维度：渠道、客户关系、产品系统。\n\n字节的牌是飞书已经建好的企业协作系统，AI只是嵌进这套系统的一层能力。阿里的牌是钉钉的销售体系和企业流程数据，千问办公更接近“在组织内部执行任务”的Agent。腾讯独有的牌，是微信生态连着的消费者关系与使用频次——WorkBuddy从C端切入，本质是把腾讯最擅长的“高频入口”能力，往工作场景里延伸。\n\n但三家最近的收拢动作，也各自暴露了焦虑。字节把飞书产品团队并入豆包体系，是和“协同办公唱主角”的时代告别；阿里把QoderWork、悟空、MuleRun三条Agent赛道捏成千问办公，是追赶中的集中火力；腾讯把QClaw划入WorkBuddy管理体系，动作最小，方向同样明确。\n\n共识只有一个：分散的实验没意义了。入口，只能有一个。\n\n两份收入，两个未答之问\n\n20亿元ARR和5亿美元年化收入，表面看都是“AI办公能赚钱”的证据。拆开看，它们回答的是两个问题。\n\n豆包工作的ARR回答的是：企业愿不愿为AI工作流付费。三个月做到20亿元，说明在飞书已覆盖的组织里，AI能力是被当作协作基础设施的延伸采购的，而不是一个要单独论证ROI的新品类。艾媒咨询白皮书显示，企业付费中约一半采用“基础订阅+超额用量”的混合模式——这意味着收入上限取决于AI在组织内部被用得多深，而不是卖了几个席位。\n\nWorkBuddy的DAU和Token消耗回答的是另一个问题：个人工作流能不能产生足够高的频次，高到AI成为日常操作里剥不掉的一层。100万亿日均Token给出了肯定的答案。\n\n但“高频”本身不是商业模式。从个人高频到企业级收入，中间隔着订阅转化、组织采购、合规部署、IT集成四道关。腾讯用“最近七天年化”来呈现收入规模，传播上有效，财务审慎性上却留了余地——月度是行业公认的最短合理年化周期，七天数据的波动性不言自明。\n\n两个问题并不互斥，但答案指向的组织能力不同。答好第一个，靠企业销售体系、客户成功和行业解决方案；答好第二个，靠产品体验、增长机制和生态触点。两个都答好，比在任意单一路径上跑出漂亮数据难得多。\n\n陆战变海战，考验才刚开始\n\nWorkBuddy在腾讯财报里的位置值得留意。\n\n2026年三季度，腾讯营收2073.36亿元，同比增长8%，非IFRS净利润同比下降6%；但云服务收入同比增长35%，腾讯明确把WorkBuddy的需求列为驱动力之一。在整体增速放缓的背景下，AI办公产品第一次进入核心财务叙事。这本身就是信号：WorkBuddy不再是一个“尝试性产品”，它扛着腾讯在AI时代从消费互联网向企业服务延伸的期待。\n\n马化腾11月内部讲话里那句“陆战已经变成海战，陆军必须变成海军”，放进这个语境并不夸张。腾讯在AI原生应用第一梯队里的缺位是结构性的：QuestMobile 9月AI原生App月活榜前三分别是豆包4.19亿、千问1.58亿、DeepSeek 1.23亿，腾讯无一入围。WorkBuddy的3235万办公Agent月活，是腾讯在“工作场景”里为数不多能对位的资产。\n\n它必须从“跑得最快的办公Agent”，变成“收得住收入的企业平台”，才能补上腾讯AI版图最薄的一块。\n\n对整个赛道来说，同一天的两组数据给了个清晰的观察框架：豆包工作检验企业付费的可持续性，WorkBuddy检验消费端频次向组织采购的转化效率。两个检验，都还没到终局。\n\nAI办公最终争的，不是一个新品类，而是个人工作流与企业工作流的交汇处。在这儿，DAU和ARR只是某一刻的快照。真正决定格局的，是谁能让AI同时读懂一个人的操作习惯和一个组织的运行规则，再把两者接进同一条工作流。\n\n发布数据的日子会过去。入口之争，才刚进入要证明“留量”而非“流量”的阶段。\n\n本文为转载内容，授权事宜请联系原著作权人。腾讯\n5.5k\n\n腾讯控股：云收入同比增长35%，WorkBuddy日活超1000万2天前\n腾讯控股：截至三季度末，收费增值服务订阅会员数同比下降5%2天前\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n腾讯\n字节20亿元对腾讯5亿美元：AI办公入口之争\n\n字节腾讯AI办公走不同路径，入口之争刚启。\n\nTech商业 · 2026/11/21 10:46\n\n文｜Tech商业 \n\n本周，字节跳动和腾讯同期摊牌。\n\n豆包工作上线
