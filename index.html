病患者。\n市區氣溫降至13度\n本港地區今日密雲，有幾陣雨。日間市區氣溫繼續下降至約13°C，多處地區及高地寒冷。吹清勁北至東北風，離岸及高地吹強風。今早氣溫普遍清涼，新界大部分地區僅得11、12°C，大帽山低見4.5°C，大老山只有87.8°C，打鼓嶺低見10.5°C。\n展望明日漸轉天晴，但早上仍然相當清涼。但早上仍然相當清涼。隨後一兩日雲量增多，風勢頗大，氣溫稍為回升。下週中期再度轉涼。\n下周中期再度轉涼及有幾陣雨\n根據天文台的9天天氣預測，預料另一股東北季候風會在下星期二抵達華南沿岸，下周中期該區將再度轉涼及有幾陣雨。下周三(25日)最低氣溫只有17度，最高氣溫亦只有21度，多雲，有幾陣雨。天氣轉涼。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd6f567a6fd","title":"女瑜伽導師兇案 前男友致歉指殺害了此生最愛 謀殺罪成依例判終身監禁","url":"https://www.stheadline.com/society/3639190/女瑜伽導師兇案-前男友致歉指殺害了此生最愛-謀殺罪成依例判終身監禁","summary":"23歲女瑜伽導師周慧賢（Aqua）4年前遭前男友以名牌手袋絲巾餌誘到尖沙嘴麗思卡爾頓酒店，其後被發現倒斃浴缸內，身中至少42刀。","summary_short":"23歲女瑜伽導師周慧賢（Aqua）4年前遭前男友以名牌手袋絲巾餌誘到尖沙嘴麗思卡爾頓酒店，其後被發現倒斃浴缸內…","digest":"23歲女瑜伽導師周慧賢4年前遭前男友以名牌手袋絲巾餌誘到尖沙嘴麗思卡爾頓酒店…","points":["23歲女瑜伽導師周慧賢（Aqua）4年前遭前男友以名牌手袋絲巾餌誘到尖沙嘴麗思卡爾頓酒店…","32歲前男友勞浚銘否認1項謀殺罪，5男2女陪審團昨退庭商議約5小時後，一致裁定被告謀殺罪成","法官郭啟安今早於高等法院判刑，斥責被告用最殘忍的方式殺害死者…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:06:40+08:00","size":1,"keywords":[],"body":"23歲女瑜伽導師周慧賢（Aqua）4年前遭前男友以名牌手袋絲巾餌誘到尖沙嘴麗思卡爾頓酒店，其後被發現倒斃浴缸內，身中至少42刀。32歲前男友勞浚銘否認1項謀殺罪，5男2女陪審團昨退庭商議約5小時後，一致裁定被告謀殺罪成。法官郭啟安今早於高等法院判刑，斥責被告用最殘忍的方式殺害死者，可以想像死者死前必然十分痛苦及極度恐懼，依例判處終身監禁。\n被告自撰求情信稱殺害了唯一愛過的女人\n案發時28歲被告勞浚銘報稱無業，被控於2022年6月29日至30日期間在香港，謀殺周慧賢。陪審團昨一致裁定被告謀殺罪成，被告聞判時表現平靜。控方透露被告現年32歲，過去沒有案底，曾任職法務助理，被捕時無業。\n辯方今引述被告求情信，當中向事主及其親友致歉，無法保護死者之餘，更向公眾呈現了其負面形象，被告承認錯誤，殺害了此生唯一愛過的女人，案發後在私人律師勸說下自首。\n郭官指陪審團昨退庭商議僅5小時，可見完全拒絕被告辯解，認為就算死者有挑釁被告，常人也不會如被告般用刀殺害死者。郭官斥責被告用最殘忍的方式殺害死者，可以想像死者死前必然十分痛苦及極度恐懼，並向承受悲痛的死者親友致意。\n案件編號：HCCC148/2024\n法庭記者：陳子豪","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb7f1de7217","title":"荔枝角青山道工廈起火 濃煙密佈 消防救熄 2人不適","url":"https://www.stheadline.com/breaking-news/3639183/荔枝角青山道工廈起火-濃煙密佈-消防救熄-2人不適","summary":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火，其中一名報案人指自己正身在起火單位內，消防接報派出搜救隊到場，並開喉撲救…","summary_short":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火…","digest":"荔枝角青山道嘉名工廠大廈，今早上10時34分，警方接獲多個報案…","points":["荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案…","火警中，初步有兩人不適，其中一人須戴上氧氣罩送院","上址為7樓一個工作室及平台花園，網上影片所見，起火位置火光熊熊，大廈的頂部噴出濃煙…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:06:16+08:00","size":1,"keywords":[],"body":"荔枝角青山道嘉名工廠大廈，今（20日）早上10時34分，警方接獲多個報案，指工廈7樓一個露天有簷篷位置起火，其中一名報案人指自己正身在起火單位內，消防接報派出搜救隊到場，並開喉撲救，約15分鐘將火救熄。火警中，初步有兩人不適，其中一人須戴上氧氣罩送院。 上址為7樓一個工作室及平台花園，網上影片所見，起火位置火光熊熊，大廈的頂部噴出濃煙，離遠亦見到火警工廈附近一帶煙霧瀰漫。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc24bb4f944","title":"WhatsApp 騎劫騙案有新招？騙徒複製群組扮朋友促過數 專家揭騎劫方法 教路3方法防中招","url":"https://www.stheadline.com/society/3638854/WhatsApp-騎劫騙案有新招騙徒複製群組扮朋友促過數-專家揭騎劫方法-教路3方法防中招","summary":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。","summary_short":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。","digest":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢","points":["WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢","有網民的WhatsApp被騙徒騎劫，騙徒從網民的WhatsApp 帳號知道所有群組名稱…","網民形容事件「恐怖」，並將事發情發布在社交平台「警世」"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:38+08:00","size":1,"keywords":[],"body":"WhatsApp帳戶被騎劫時有發生，近日有死灰復燃的趨勢。有網民的WhatsApp被騙徒騎劫，騙徒從網民的WhatsApp 帳號知道所有群組名稱，然後選擇其中一個只有3個人的群組，新增一個以該群組同名的群組，再用兩個假帳戶假扮網民的朋友，要求網民轉帳$27300，同時騙徒亦以該網民的名義，向網民的親戚朋友借錢。網民形容事件「恐怖」，並將事發情發布在社交平台「警世」。\n複製朋友3人群組 扮朋友促過數$27,300\n網民發文稱，指自己本來有一個包含3人的群組，群組成員包括A和B兩人，日前(18日)下午突然收到A在群組發信息要求B過數 $27,300，但B稱無法轉數，而A重複指「好急」，要求當日轉數。網民隨口搭話，指「咁似詐騙嘅？」而A和B好自然和網民對答，語氣和互動「好似我平時同佢哋傾偈咁。」其後兩名「朋友」詢問網民可否幫忙過數，因為他們正在上班，網民見二人十分心急，便將過數資料發給家人幫手過數，家人看完後反問「你係咪俾人呃錢？」其時網民才恍然大悟，查看群組的信息紀錄，發現只有昨日的紀錄，同時各自的私聊同樣只有昨日的記錄。\n扮網民向WhatsApp名單求過數1萬\n網民再查看WhatsApp群組，發現同時有兩個一模一樣的群組，包含騙徒的群組的兩位「朋友」都使用陌生的電話號碼，只是挪用真朋友的名稱和頭像來騙取網民信任；同時騙徒亦有在同一時間向網民的家人朋友發信息，要求過數1萬元到一個陌生的帳戶。\n方保僑估計網民使用WhatsApp網頁致戶口被騎劫\n香港資訊科技商會榮譽會長方保僑接受《星島頭條》電話訪問時，估計網民在使用WhatsApp網頁登入版面時被騙徒騎劫帳戶，因而有能力瀏覽網民WhatsApp內的所有資料，並取得掌控權，可以隨時新增群組，再用兩個假戶口扮作朋友，模仿平時的說話語氣，以增強騙財的說服力。\n點擊不明連結可令瀏覽器中毒 騙徒可遠端操作電腦\n至於WhatsApp帳戶被騎劫的原因，方保僑表示，過往Whatsapp 帳戶被騙徒騎劫主要是由於市民在搜索引擎搜索時，往往按最開頭的連結，而在搜索引擎賣廣告可令搜索結果置頂，因而登入由騙徒製作的假WhatsApp網頁，掃描惡意二維碼，騙徒隨即取得用戶連線資料，但現時搜索引擎已盡量攔截虛假網站廣告，因此現時較少因此方法被騎劫；他估計網民有機會點擊不明連結，令到瀏覽器中毒，使騙徒可以遠端操作電腦，因而獲得WhatsApp網頁的使用權。\n教路三方法防止WhatsApp被騎劫\n方保僑提醒，如要防止WhatsApp帳戶被騎劫，在使用網上版WhatsApp後切記要隨即登出網頁，不宜長期保止登入狀態；另外，亦可留意WhatsApp已連結裝置，若發現有不明裝置連結，可即時將該裝置登出，並重裝WhatsApp；另外，亦可使用防毒及防間諜軟件掃瞄電腦，如發現有木馬程式要立即進行殺毒，以免電腦被騙徒控制。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":51,"items":[{"id":"c9e78885c76","title":"中外客商湖北农博会觅合作 首设港澳台展区","url":"https://www.chinanews.com.cn/dwq/2026/11-20/10735336.shtml","summary":"中新社武汉11月20日电 (记者 梁婷)2026湖北农业博览会20日在武汉开幕。","summary_short":"中新社武汉11月20日电 (记者 梁婷)2026湖北农业博览会20日在武汉开幕。","digest":"2026湖北农业博览会20日在武汉开幕","points":["中新社武汉11月20日电 (记者 梁婷)2026湖北农业博览会20日在武汉开幕","越南、法国、韩国、泰国、柬埔寨等国家的政府和商贸代表…","本届农博会由湖北省农业农村厅、湖北省乡村振兴局主办"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:43:10+08:00","size":1,"keywords":[],"body":"中新社武汉11月20日电 (记者 梁婷)2026湖北农业博览会20日在武汉开幕。越南、法国、韩国、泰国、柬埔寨等国家的政府和商贸代表，中国国内14个省份及港澳台地区代表与会，共觅合作机遇。\n\n　　本届农博会由湖北省农业农村厅、湖北省乡村振兴局主办。展览展示面积达6万平方米，设置科技产业金融融合创新展区等10个特色展区及7个功能区，2000多家企业携万余种特色农产品和一批农业新技术、新成果集中亮相。\n\n11月20日，2026湖北农业博览会在武汉开幕，中外客商寻合作。　中新社记者 梁婷 摄\n\n　　本届博览会首次设置了国际展区和港澳台展区。国际展区，集中展示越南、泰国、柬埔寨等共建“一带一路”国家特色产品；港澳台展区，展示特色农副产品、深加工产品、美食小吃等。现场，湖北香菇、柑橘、鸡蛋等出口产品也集中亮相。\n\n　　在国际展区，展出了法国葡萄酒、泰国香米以及共建“一带一路”国家的特色好物。\n\n　　柬埔寨商务部副国务秘书斯维娜丽在致辞中表示，湖北拥有先进技术和智慧农业系统，期待双方在智慧农业、数字技术、人工智能、农业机械化和现代灌溉系统等领域开展合作。同时，鼓励双方研究机构、政府部门、行业协会、商会和企业，通过技术交流访问、研究合作、贸易展览、投资促进活动等方式，建立长期合作。\n\n　　记者在现场看到，港澳台展区人气高涨，台湾金门高粱酒、阿里山高山茶、凤梨酥、蛋黄酥，港式手信、波仔系列即食美食，澳门文创曲奇、牛轧糖等，吸引民众驻足、选购。台湾一家食品企业的工作人员申兴平介绍，此次带来台湾知名茶点太阳饼、芋头酥等参展，希望让更多人了解台湾美食。\n\n11月20日，2026湖北农业博览会首次设置的港澳台展区，人气高涨。　中新社记者 梁婷 摄\n\n　　数据显示，2025年，湖北农产品出口贸易伙伴达到170个，农产品进出口总额348.6亿元人民币，同比增长17.2%。\n\n　　本届农博会定向邀约境外采购商、渠道商现场对接，配套开展农产品出口政策法律咨询和辅导，解读国际贸易规则、通关要求、准入标准，推动渠道互通、市场共享。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca27eb54736","title":"冷空气“速冻”广东 “冬日场景”亮相羊城商圈","url":"https://www.chinanews.com.cn/dwq/2026/11-20/10735358.shtml","summary":"中新网广州11月20日电 (记者 王坚)在冷空气补充影响下，广东20日的气温继续下降，全省最低气温跌至10℃以下，广州最低气温仅为8.3℃。","summary_short":"中新网广州11月20日电 (记者 王坚)在冷空气补充影响下，广东20日的气温继续下降，全省最低气温跌至10℃以下…","digest":"在冷空气补充影响下，广东20日的气温继续下降，全省最低气温跌至10℃以下…","points":["中新网广州11月20日电 (记者 王坚)在冷空气补充影响下，广东20日的气温继续下降…","广东省气象局表示，受冷空气补充影响，预计21日的气温仍将较低，当日早晨最低气温…","23日夜间到24日白天，又有新一轮弱冷空影响，全省将有一次降雨过程，气温又将下降"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:40:14+08:00","size":1,"keywords":[],"body":"中新网广州11月20日电 (记者 王坚)在冷空气补充影响下，广东20日的气温继续下降，全省最低气温跌至10℃以下，广州最低气温仅为8.3℃。\n\n　　广东省气象局表示，受冷空气补充影响，预计21日的气温仍将较低，当日早晨最低气温：粤北和珠三角北部市县6℃至9℃，粤西沿海市县13℃至17℃，其余市县9℃至12℃；23日夜间到24日白天，又有新一轮弱冷空影响，全省将有一次降雨过程，气温又将下降。\n\n天河商圈的“时光音乐盒”冬日主题展吸引市民游客拍照打卡。周佩琳 摄\n\n　　随着近期广东气温持续下降，冷空气给羊城披上了“冬日氛围”，在广州天河商圈，多个商业体冬日美陈陆续上线，吸引众多市民游客前往拍照“打卡”。\n\n　　其中，“冰河星城”雪人奇遇小镇全国首展，以“零下5℃真实飘雪”为核心体验，打造超600平方米冰雪小镇及“八音盒雪屋”，通过专业造雪装置与低温环境呈现真实飘雪；同时还有“时光音乐盒”冬日主题展，拥有16米高巨型互动光影装置、超1500平方米纵跨三层的璀璨灯饰，可以“点亮”广州的冬天。\n\n　　据了解，天河商圈的正佳广场、花城汇、太古汇、维多利等商业体也将陆续推出冬日主题场景和活动内容，沿天河路打造一条“冬日景观大道”，让市民游客可以逛街、拍照、打卡。\n\n　　除装置类美陈外，天河商圈多个商业体还以市集、快闪、互动、展览等多元内容丰富市民游客的购物游乐体验。\n\n　　气象专家表示，广东近期气温变化大，民众外出游玩时要注意适时增添衣物。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2af82f07e9","title":"中美两军举行海上军事安全磋商机制工作小组会议和年度会晤","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735368.shtml","summary":"北京时间11月18日至20日，中美两军位中国上海举行了2026年度中美海上军事安全磋商机制第二次工作小组会议和年度会晤。","summary_short":"北京时间11月18日至20日，中美两军位中国上海举行了2026年度中美海上军事安全磋商机制第二次工作小组会议和年度会晤。","digest":"北京时间11月18日至20日…","points":["北京时间11月18日至20日，中美两军位中国上海举行了2026年度中美海上军事安全磋商机制第…","会议旨在落实两国元首重要共识，推动两军关系健康、稳定、可持续发展","双方就当前中美海空安全形势进行了坦诚、务实、建设性的交流…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:39:26+08:00","size":1,"keywords":[],"body":"北京时间11月18日至20日，中美两军位中国上海举行了2026年度中美海上军事安全磋商机制第二次工作小组会议和年度会晤。会议旨在落实两国元首重要共识，推动两军关系健康、稳定、可持续发展。双方就当前中美海空安全形势进行了坦诚、务实、建设性的交流，评估了《中美海空相遇安全行为准则》年度执行情况，讨论了改进中美海上军事安全问题的措施，商定了2027年工作小组会议议题。\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c42bff8ce6f","title":"河南省许昌市政协原副主席周亮军被“双开”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735310.shtml","summary":"中新网11月20日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对许昌市政协原副主席周亮军严重违纪违法问题进行了立案审查调查。","summary_short":"中新网11月20日电 据河南省纪委监委消息：经中共河南省委批准…","digest":"据河南省纪委监委消息：经中共河南省委批准…","points":["中新网11月20日电 据河南省纪委监委消息：经中共河南省委批准…","经查，周亮军丧失理想信念，背离初心使命，对抗组织审查","违反中央八项规定精神，收受可能影响公正执行公务的礼品，接受可能影响公正执行公务的宴请"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:28:39+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对许昌市政协原副主席周亮军严重违纪违法问题进行了立案审查调查。\n\n　　经查，周亮军丧失理想信念，背离初心使命，对抗组织审查；违反中央八项规定精神，收受可能影响公正执行公务的礼品，接受可能影响公正执行公务的宴请；违背组织原则，在组织函询时不如实说明问题；廉洁底线失守，借用管理和服务对象的钱款，违规从事营利活动，将应当由本人支付的费用由他人支付，利用职权报销费用；毫无纪法观念，大搞权钱交易，利用职务便利为他人在项目承揽等方面提供帮助，非法收受巨额财物。\n\n　　周亮军严重违反党的政治纪律、组织纪律和廉洁纪律，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大、十九大乃至二十大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经河南省纪委常委会会议研究并报中共河南省委批准，决定给予周亮军开除党籍处分；由河南省监委给予其开除公职处分；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c526b4b524e","title":"黑龙江广播电视传媒网络集团股份有限公司原董事长赵鸿洋被“双开”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735321.shtml","summary":"中新网11月20日电 据黑龙江省纪委监委消息：日前，经黑龙江省委批准，黑龙江省纪委监委对黑龙江广播电视传媒网络集团股份有限公司原党委书记、董事长赵鸿洋严重违纪违法问题进行了立案审查调查。","summary_short":"中新网11月20日电 据黑龙江省纪委监委消息：日前，经黑龙江省委批准…","digest":"据黑龙江省纪委监委消息：日前，经黑龙江省委批准…","points":["中新网11月20日电 据黑龙江省纪委监委消息：日前，经黑龙江省委批准…","经查，赵鸿洋丧失理想信念，背弃初心使命，不信马列信鬼神，搞迷信活动","违背组织原则，在组织谈话函询时不如实说明问题，在职工录用等工作中为他人谋取利益"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T17:27:55+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据黑龙江省纪委监委消息：日前，经黑龙江省委批准，黑龙江省纪委监委对黑龙江广播电视传媒网络集团股份有限公司原党委书记、董事长赵鸿洋严重违纪违法问题进行了立案审查调查。\n\n　　经查，赵鸿洋丧失理想信念，背弃初心使命，不信马列信鬼神，搞迷信活动；无视中央八项规定精神，违规接受宴请；违背组织原则，在组织谈话函询时不如实说明问题，在职工录用等工作中为他人谋取利益；廉洁底线失守，违规收受礼品、礼金、消费卡，违规从事营利活动，滥发奖金；擅权妄为，以权谋私，参与设立并使用“小金库”款项；贪婪腐化，利用职务上的便利大肆侵吞攫取公款，挪用公款给他人使用。\n\n　　赵鸿洋严重违反党的政治纪律、组织纪律和廉洁纪律，构成严重职务违法并涉嫌贪污、挪用公款犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经省纪委常委会会议研究并报省委批准，决定给予赵鸿洋开除党籍处分；由省监委给予其开除公职处分；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb3ad577a47","title":"湖南漢為買iPhone 18 Pro送老婆 戒煙215天「慳錢貼出心型牆」｜有片","url":"https://www.stheadline.com/realtime-china/3639306/湖南漢為買iPhone-18-Pro送老婆-戒煙215天慳錢貼出心型牆有片","summary":"湖南一名擁有15年煙齡的男子下定決心戒煙，並想出獨特的激勵方法：每日將省下的30元人民幣煙錢實體貼在牆上。","summary_short":"湖南一名擁有15年煙齡的男子下定決心戒煙，並想出獨特的激勵方法：每日將省下的30元人民幣煙錢實體貼在牆上。","digest":"湖南一名擁有15年煙齡的男子下定決心戒煙…","points":["湖南一名擁有15年煙齡的男子下定決心戒煙，並想出獨特的激勵方法…","在堅持長達215天、儲得逾6000元後，他決定以此作為「首期」…","綜合內媒報道，居住在湖南婁底、現年33歲的楊先生透露…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:10:46+08:00","size":1,"keywords":[],"body":"湖南一名擁有15年煙齡的男子下定決心戒煙，並想出獨特的激勵方法：每日將省下的30元人民幣煙錢實體貼在牆上。在堅持長達215天、儲得逾6000元後，他決定以此作為「首期」，為妻子購買一部全新的iPhone18Pro，務實而浪漫的舉動獲網民大讚。\n日儲30元「貼錢上牆」\n綜合內媒報道，居住在湖南婁底、現年33歲的楊先生透露，妻子的舊手機iPhone 12已使用了長達6年之久，近期播放影片時音量忽大忽小且系統頻頻卡頓，早已到了需要汰換的程度。為了幫妻子換新手機，同時亦想重拾個人健康，他決定徹底戒煙。楊先生自擬了一套具象化的「貼牆儲錢法」，每天固定將原本用於買煙的30元實體紙幣貼在牆上，以此自我督促。\n日積月累下，他在第215天成功存下6000多元。為了給妻子一個驚喜，他將這筆錢用於網購全新發布、價值10999元的iPhone18 Pro（256GB版）送給妻子。\n相關新聞：河南廿年老煙槍的起心肝戒煙 3個月慳返煙錢鋪滿床｜有片\n戒煙7個月健康大改善\n楊先生坦言，以前抽煙時總是不敢細算開支，如今成功戒煙長達7個多月，不僅身體健康大有改善，過去早晨起床喉嚨乾癢、易喘的毛病完全消失，精神狀態與家庭生活質素亦顯著提升。\n他笑言，將原本「燒掉健康」的開銷，轉化為實實在在noble的家庭福利與妻子的笑容，比自己抽煙更有滿足感和成就感。\n網民讚「教科書級別寵妻」\n這段既勵志又浪漫的經歷在網上曝光後，隨即衝上社交平台熱搜，大批網民紛紛按讚，誇讚楊先生有毅力且心思細膩，形容這波兼顧健康與家庭的溫馨操作，簡直是「教科書級別寵妻」。\n「這種看得見的儀式感真的太厲害了」\n「用戒煙換全家人的健康和老婆的開心，絕對是教科書級別的寵妻代表！」\n「這個帳算下來簡真太划算了，所有煙民都應該向這位湖南老公學習！」\n「一邊收穫健康，一邊兌現偏愛，這樣的浪漫很實在。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2aab11963f","title":"2026地球“体检”报告：中国多个可持续发展指标贡献度居全球首位","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735303.shtml","summary":"中新网北京11月20日电 (记者 孙自法)《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月20日在北京发布，这一被形象称为地球的年度“体检”报告显示…","summary_short":"中新网北京11月20日电 (记者 孙自法)《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》…","digest":"《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月…","points":["该报告由依托中国科学院建设、全球首个专门以大数据技术服务联合国2030年可持续发展议程和全球…","中国逾六成指标接近或实现2030年目标","这是一套各国政府、国际组织及科研机构可参考、可操作、可推广的监测框架…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:57:19+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 孙自法)《地球大数据支撑可持续发展目标报告(2026)——全球发展倡议五周年特别报告》11月20日在北京发布，这一被形象称为地球的年度“体检”报告显示，根据15项全球一致可比的指标评估测算，中国综合可持续发展目标(SDGs)贡献度达5.84%，位列全球第一，在工业热源排放改善、城市公共交通普及、粮食单产提升、城市绿地建设等领域，中国贡献度均居全球首位。\n\n报告北京发布现场合影。中新网记者 孙自法 摄\n\n　　该报告由依托中国科学院建设、全球首个专门以大数据技术服务联合国2030年可持续发展议程和全球发展倡议的国际科研机构——可持续发展大数据国际研究中心(英文缩写CBAS，也称SDG中心)牵头联合近40家科研机构的170位专家共同撰写，当天同步在联合国官网发布，并面向联合国会员国发放。\n\n　　中国逾六成指标接近或实现2030年目标\n\n　　在可持续发展大数据国际研究中心连续多年发布成果积累的基础上，2026地球“体检”报告首次提出可持续发展目标数字指标框架，以“可观测、可量化、可比较”为核心理念，按照“领域—主题—指标”三层架构，覆盖零饥饿、清洁饮水和卫生设施、经济适用的清洁能源、可持续城市和社区、气候行动、水下生物、陆地生物等7个可持续发展目标，形成99项数字指标，与联合国全球可持续发展目标指标框架相互补充，为更加精细、动态和可比较监测可持续发展进展提供新的技术路径。\n\n　　中国科学院院士、可持续发展大数据国际研究中心主任郭华东解读说，最新报告评估显示中国可持续发展进展显著，截至2025年，在纳入评估的234个可持续发展目标指标中，中国已有147项接近或实现2030年目标，占比62.8%，较2015年提升23.9个百分点。\n\n　　其中，消除贫困、优质教育、伙伴关系、产业和基础设施、可持续城市和社区共5个可持续发展目标中，中国有超过70%的指标已经实现目标。预计到2030年，中国约75%的指标可以实现其对应目标。\n\n　　他表示，2026年度报告的核心贡献在于，推动地球大数据研究从典型案例走向规范化、可复用的数字指标体系，使对地观测成果更好地服务可持续发展目标的持续监测与政策制定。这是一套各国政府、国际组织及科研机构可参考、可操作、可推广的监测框架，为2030年议程最后4年的精准监测和治理提供了方法论基础。\n\n郭华东院士解读报告。中新网记者 孙自法 摄\n\n　　郭华东指出，当前距离联合国2030年议程收官仅剩4年，全球可持续发展仍面临严峻挑战。根据联合国2026官方数据，在全球可比的139项可持续发展目标指标中，仅15%进展顺利或实现目标，近半数进展迟缓，15%出现倒退。\n\n　　为此，2026地球“体检”报告提出三项建议：一是持续完善可持续发展目标数字指标框架，推动数字指标由研究成果转化为通用标准；二是推动监测体系由状态识别向归因诊断、风险预警和路径优化延伸；三是建设开放共享的可持续发展目标数字监测工具和国际协作网络，为全球可持续发展治理提供稳定可靠的科学证据和公共产品支撑。\n\n　　多尺度案例研究验证数字指标应用潜力\n\n　　作为全球发展倡议提出五周年特别报告，2026地球“体检”报告同时梳理了倡议框架下的务实合作进展。五年来，该倡议得到130多个国家和国际组织积极响应，在八大重点领域开展2000多个合作项目、培训各类人才超过20万名。\n\n　　依托数字指标框架，2026地球“体检”报告开展了全球、区域、国家及典型地区的多尺度案例研究，验证了数字指标在支撑可持续发展目标精准监测和评估中的应用潜力。\n\n　　粮食领域，2025年，全球油菜种植84.9%集中于北半球中高纬度，中国南方冬闲田具备油菜扩种潜力，滇、桂、鄂、皖、赣、湘六省可扩种面积合计占南方潜在扩种面积的71.46%；东南亚和非洲水稻实际产量距潜力仍有约48%和64%的差距。\n\n　　水资源领域，2015年—2024年，全球22.2%的大型湖泊进入加速富营养化阶段；2000年—2024年，中国用水效率增长约7.3倍，用水紧张程度降至31%。\n\n　　能源领域，2025年，全球85.5%的集中式光伏面板集中在少数国家和地区；2001年—2025年，中国约84%的陆上风电场周边生态改善；2000年—2025年，中国约75%的光伏电站周边生态改善或稳定。\n\n　　城市领域，2019年—2024年，全球垃圾露天堆放场甲烷排放强度约为卫生填埋场的4.8倍；2014年—2024年，中国城市城中村(含棚户区)占城市建成区面积比例由10.4%降至8.1%。\n\n　　气候领域，2025年全球二氧化碳排放达372亿吨再创新高，但电力部门排放首次出现结构性下降；2015年—2023年，中国植被碳储量年均净增长57.62太克碳(1太克=10亿千克)。\n\n　　海洋领域，2020年—2023年，黄河三角洲实现96%的互花米草清除率；截至2026年，中国滨海城市可持续发展海洋方案工具包已服务10余个发展中国家。\n\n　　陆地生态领域，泛热带地区总树冠面积中近50%来自于森林外树木，2015年—2023年，全球旱区土地净恢复面积增长78.5%，其中，中国“三北”工程区表现尤为突出，成为全球土地恢复的热点区域。(完)\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c15423aa47e","title":"土耳其专家阿蒂利：中国将生态保护“义务”变为产业发展“机遇”｜新闻会客厅","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735331.shtml","summary":"中新网伊斯坦布尔11月20日电(记者 王高飞 魏园)近日，中国新闻社“新闻会客厅”在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)期间，于伊斯坦布尔举办“中土生态文明与绿色转型对话会”。","summary_short":"中新网伊斯坦布尔11月20日电(记者 王高飞 魏园)近日，中国新闻社“新闻会客厅”在《联合国气候变化框架公约》第三十一次…","digest":"土耳其专家阿蒂利：中国将生态保护“义务”变为产业发展“机遇”｜新闻会客厅","points":["中新网伊斯坦布尔11月20日电(记者 王高飞 魏园)近日…","中土政界、学界、商界代表共话两国生态文明交流与合作","土耳其伊斯坦布尔政策中心高级学者阿尔泰·阿蒂利(Altay Atli)接受中新社“新闻会客厅…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:56:45+08:00","size":1,"keywords":[],"body":"中新网伊斯坦布尔11月20日电(记者 王高飞 魏园)近日，中国新闻社“新闻会客厅”在《联合国气候变化框架公约》第三十一次缔约方大会(COP31)期间，于伊斯坦布尔举办“中土生态文明与绿色转型对话会”。中土政界、学界、商界代表共话两国生态文明交流与合作。\n\n　　土耳其伊斯坦布尔政策中心高级学者阿尔泰·阿蒂利(Altay Atli)接受中新社“新闻会客厅”专访时表示，中国在生态保护领域最值得世界关注之处，在于把环境保护从“义务”转变为“机遇”，使绿色转型具备可持续的内在动力。他认为，这一转变对世界各国都具有重要借鉴意义。\n\n土耳其伊斯坦布尔政策中心高级学者阿尔泰·阿蒂利（Altay Atli）在伊斯坦布尔接受中新社“新闻会客厅”专访。记者 魏园 摄\n\n　　“中国把履行义务变成了产业机遇”\n\n　　阿蒂利指出，保护环境的义务当然重要，但中国更进一步，把环保变成了产业政策、工业发展优势。电动车、电池、太阳能、风能等不仅是为环保而发展，如今已成为中国经济的重要领域。“中国把环保‘义务’变成了机遇——产业机遇、工业进步的机遇。这很重要，因为把环保只作为义务来履行是不可持续的；变成产业政策，才可持续。”\n\n　　他强调，中国的出口和生产在这些领域始终居于世界前列。“中国做得又快又有效，因为我们没有太多时间可以浪费。”在他看来，“落实”需要高效、快速的执行，而“中国在这方面的案例是成功的”。\n\n　　谈及今年COP31“把承诺转化为行动”的主题，阿蒂利认为，落实行动需要制度能力支撑，也需要国内和国际两个层面的协调。“不管是中国、土耳其还是美国，如果国内协调不好——制度、公共部门与私营部门不配合——就走不远。”\n\n　　他同时指出，气候问题已变成地缘政治问题，但没有一个国家能独自解决。“在所有分歧之上，有共同的利益——全球利益，因为气候变化是真实存在的，我们必须行动起来。中国各方的协调——国内协调和对国际合作的推动——正在带来改变。”\n\n　　“‘人类命运共同体’理念和‘两山’理念不是口号，是真理”\n\n　　阿蒂利对“构建人类命运共同体”理念深表认同。他说，世界虽然分成各个国家和地区，但说到底只有一个地球。“我们共享同一个未来，因为我们住在同一个星球上。我们能去哪儿？火星、金星、土星？我们去不了。地球就是我们的家，我们共享这个家园。”\n\n　　他强调，“人类命运共同体”不是一句口号，而是最重大、最不容置疑的真理——我们没有别的地方可去。\n\n　　他还提到，“绿水青山就是金山银山”理念，为可持续发展提供可行路径。他分析说，迄今为止人们对经济发展与环境保护的关系的理解是：要生产就要消耗资源，消耗越多、环境破坏越大，然后再设法找平衡。“但其实这种理解是不够的，这种方式不可持续。”\n\n　　“经济进步和生态环境保护可以并行——环保不必是经济进步的负担和成本，它可以转化为经济收益。”他指出，可持续旅游、绿色产业、清洁产业等提供了多种路径。“我们已经到了一个没有别的选择的节点。”\n\n　　最后，阿蒂利表达了对中土合作的期待，他明确表示，土中两国合作不应停留在简单的“买卖逻辑”——你生产、我买；我生产、你买。“这同样不可持续。”他认为，双方需要在技术、绿色供应链等领域，在互利共赢的基础上共同发展。“我们需要长期愿景，互利共赢的长期愿景。”\n\n　　“我们没有多少时间可以浪费了。我不知道我的孩子们将生活在一个怎样的星球上。我们必须一起前进，因为地球是我们共同的唯一的家。”\n\n 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbe094910a1","title":"【环瞰·APEC中国年】APEC会议现场，企业代表热议“互联互通”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735306.shtml","summary":"环球时报 丁雅栀 李炫旻  　　【环球时报报道 记者 丁雅栀 李炫旻】在今年的亚太经合组织(APEC)第三十三次领导人非正式会议期间，“互联互通”成为一个热词。","summary_short":"环球时报 丁雅栀 李炫旻  　　【环球时报报道 记者 丁雅栀 李炫旻】在今年的亚太经合组织(APEC)第三十三次领导人非…","digest":"环球时报 丁雅栀 李炫旻  　　【环球时报报道 记者 丁雅栀 李炫旻】在今年的亚太经…","points":["【环球时报报道 记者 丁雅栀 李炫旻】在今年的亚太经合组织(APEC)第三十三次领导人非正式…","11月18日对外发布的《2026年亚太经合组织工商领导人峰会深圳倡议》…","在会议现场接受《环球时报》采访的多名企业代表，向记者讲述了互联互通的重要性…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:33:44+08:00","size":1,"keywords":[],"body":"环球时报 丁雅栀 李炫旻\n\n　　【环球时报报道 记者 丁雅栀 李炫旻】在今年的亚太经合组织(APEC)第三十三次领导人非正式会议期间，“互联互通”成为一个热词。11月18日对外发布的《2026年亚太经合组织工商领导人峰会深圳倡议》，呼吁亚太以APEC互联互通蓝图实施10周年为契机，不断做实做细“硬联通”“软联通”“心联通”，打造通往亚太共同体的全方位互联互通体系。在会议现场接受《环球时报》采访的多名企业代表，向记者讲述了互联互通的重要性，以及中国在加强区域互联互通方面发挥的巨大作用。\n\n　　2014年，APEC第二十二次领导人非正式会议通过APEC互联互通蓝图，为实现亚太长远发展夯实互联互通基础。十多年来，亚太地区持续推进落实这一蓝图，加快完善区域基础设施、制度和人员的互联互通。今年，经中方倡议，APEC工商咨询理事会(ABAC)互联互通工作组恢复设立。\n\n　　在11月16日的新闻发布会上，ABAC互联互通工作组主席、中国中信集团副总经理曾琪表示，在物理联通方面，今年工作组推动对现有基础设施投资改造等15项提案；在制度联通方面，工作组推动海关协作与跨境贸易数据共享机制等30项提案；在人心联通方面，则推动推广APEC商旅卡等8项提案。\r\n\n　　2008年在深圳罗湖成立的优合集团，已发展为集进口清关、冷链仓储物流、大数据服务等业务于一体的全球产业链综合型企业。该集团创始人、联席董事长苏治告诉《环球时报》记者，加强亚太合作，应持续深化产业链供应链互联互通，构建更加有韧性的共同市场。\n\n　　普华永道中国副主席、公共事务主管合伙人周星告诉记者，把跨境数据流动、人才与创新流动做成区域公共产品，企业就能在更大范围内优化配置、分摊成本，“规则每对接一步，增长的空间就打开一分”。泰国天丝集团首席执行官许馨雄对记者表示，对区域内各经济体而言，坚持开放融通，能够充分发挥比较优势，破除要素流动壁垒，共享市场扩容、技术互鉴、规则对接带来的发展红利。\n\n　　联邦快递亚太区总裁苏查理从物流和贸易服务的角度，提出了亚太下一阶段增长所需要的三种互联互通：实体互联互通，让货物更顺畅地流动；数字互联互通，让数据转化为可用于决策的信息；贸易互联互通，让跨境贸易更加高效、可预测。\n\n　　许馨雄还表示，在亚太经贸网络中，中国不仅是重要的消费市场和制造基地，也是促进区域产业协同与互联互通的重要枢纽。依托超大规模市场、完备的产业体系、开放的营商环境以及与亚太其他经济体紧密的经贸联系，中国持续促进区域资源流动与供应链协同，为跨国企业优化产业布局、拓展区域合作创造了更多机遇。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc6b81c7c90","title":"深度｜APEC领导人会议周的外媒记者，看到一个怎样的中国？","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735305.shtml","summary":"羊城晚报•羊城派 古司祺 沈重光 等  　　2026年APEC领导人会议周期间，来自世界各地的记者走进广东、来到深圳，报道APEC盛会。","summary_short":"羊城晚报•羊城派 古司祺 沈重光 等  　　2026年APEC领导人会议周期间，来自世界各地的记者走进广东、来到深圳…","digest":"羊城晚报•羊城派 古司祺 沈重光 等  　　2026年APEC领导人会议周期间…","points":["羊城晚报•羊城派 古司祺 沈重光 等","2026年APEC领导人会议周期间，来自世界各地的记者走进广东、来到深圳，报道APEC盛会","他们亲眼见证中国式现代化的湾区实践，深入了解中国之变，亲身感受深圳这座“奇迹之城”的魅力"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:32:16+08:00","size":1,"keywords":[],"body":"羊城晚报•羊城派 古司祺 沈重光 等\n\n　　2026年APEC领导人会议周期间，来自世界各地的记者走进广东、来到深圳，报道APEC盛会。他们亲眼见证中国式现代化的湾区实践，深入了解中国之变，亲身感受深圳这座“奇迹之城”的魅力。对他们当中许多人而言，这是一次探索之行，更是一场破除迷思、刷新认知之旅。\n\n　　“宣传”还是真实？\n\n　　“说中国好话就是搞‘宣传’”，西方叙事最爱扣的帽子，被前来报道APEC的外媒摘掉了。他们直言：中国好不好，不是靠嘴说的；走一圈，才能得到实打实的答案。\r\n\n　　尼日利亚通讯社编辑、高原州州长前发言人马克・达伊尔・隆延(Mark Dayil Longyen)表示，“主导性的、带偏见的、主观的”西方叙事误导了很多人，包括远在非洲的他，从小把中国看作缺乏自由的封闭国家。“直到来到这里，我才看到了不一样的景象。”\n\n　　和他一样，《斐济太阳报》全媒体记者索西韦塔・科罗比奥(Sosiveta Korobiau)一度将中国与封闭一词等同，转机出现在抵达中国后。“我感受到人们真诚地接纳我。这里展现的是一种全新的境界，既体现了创新，也彰显了以人为本的理念。这实在令人振奋。我认为，世界应当向中国学习。”\n\n　　在意大利记者萨缪尔·索杜(Samuele Soddu)看来，这种对中国态度的转变，正在世界各地悄然发生。“很多西方媒体说‘中国在做大量宣传’，但难道西方国家就不会自我宣传？在意大利，街头上的普通人也开始说‘中国是个不错的国家’。”他指出，人们应以更开放的眼光看待中国，西方媒体应多呈现客观的中国，以及中国为世界所做的一切。\n\n　　亲眼见证、亲身体验，改变了许多外媒记者对中国的固有印象，也催生了把所见所闻“带”回家的想法。《马尼拉时报》记者雷德・门多萨(Red Mendoza)表示，菲律宾民众提起中国，往往会被偏见蒙蔽，这提醒了他身为媒体人的责任所在：“我会跟他们解释，中国人民非常了不起。他们有爱心，非常友善。他们来菲律宾，我们应该欢迎他们，因为我知道，我们要回应这份友谊。”\n\n　　巴基斯坦国家电视台记者玛迪哈・阿比德(Madiha Abid)深有同感：“我听说所有中国人看起来都一样，但不是的，每个人都不同，这里非常多样化。”她特别强调，“我们正面临虚假信息之战，所以我们必须反击。”\n\n　　机遇还是威胁\n\n　　大批美国CEO奔赴深圳，泰国、越南受益于APEC合作快速发展，中国新能源产业惠及澳大利亚，中国基建落地科特迪瓦助力民生……刻意制造的“威胁”论调，在全球合作的真实收益面前一戳即碎。\n\n　　“为什么有这么多CEO前往深圳？他们都有相同的兴趣，都希望贸易壁垒被打破，希望营商环境更好。”美中贸易全国委员会会长斯坦(Sean Stein)说，“中美企业能一起完成很多靠自己无法独立完成的事业”。\n\n　　澳大利亚工商业委员会主席罗伯茨(Rhys Roberts)直言：中国是澳洲最大贸易伙伴，这个地位已保持17年。中国制造业发展是澳大利亚难得的机遇——如今澳大利亚受惠于中国制造的电动车与电池。\n\n　　科特迪瓦记者古杜(Koudou Edouward Koudou)谈到中国对科特迪瓦作出的贡献：中国人来帮忙修路、建桥，投资开发水产业，“这是互利共赢”。柬埔寨记者拉克斯梅(Raksmey Than)也有自己的期待：“我们的邻居泰国和越南受益于APEC合作，经济发展非常迅速，希望有朝一日，柬埔寨也能加入APEC大家庭。“\n\n　　意大利记者索杜(Samuele Soddu)对记者说：“中国的文明和西方不一样，‘主宰世界’‘独享权力’不是中国的逻辑。”他希望通过APEC合作“能把世界带到更好的地方”。\n\n　　当APEC经济体坐在同一张对话桌前，谎言就没有立足的地方。当世界各地的人来到深圳，亲眼见证中国的发展与贡献——“威胁”的想象不攻自破，机遇的清单越拉越长。\n\n　　独赢还是共富\n\n　　中国的发展有目共睹。然而，下一个问题又出现了：中国的发展是否“独美”？\n\n　　某些西方媒体通常用“债务陷阱”等话术污蔑中国与其他国家的合作，把中国妖魔化为掠夺资源和工作机会的“外来势力”。\n\n　　对此，外媒记者们列出丰富例子以反驳：从澳大利亚的铁矿石贸易，到科特迪瓦的医院船；从尼日利亚正在改变生活的合作项目，到塞拉利昂即将带来产业升级的渔港建设……他们看到的不是中国“独赢”，而是一个愿意同伙伴分享机会、共同走向富裕的中国。\n\n　　美国记者上官杰文(Jason Smith)表示，西方国家的崛起往往伴随着殖民扩张；而中国不搞帝国主义，不会入侵他国、掠夺资源。“中国是近现代以来，唯一一个完全是依靠本国人民的劳动实现现代化的主要大国。”他说。\n\n　　澳中工商业委员会官员弗兰克从中澳贸易关系中看到互利共赢：澳大利亚提供铁矿石，中国将其冶炼成钢材。连续多年的紧密经贸联系，不只是资源与产品的交换，更是双方创造价值、改善民生、走向共同繁荣的现实路径。\n\n　　马来西亚记者艾哈迈德认为，人工智能等新技术的关键，不只是掌握，更在于用于服务本国人民、回馈社会。技术进步不应成为少数人的特权，而应成为推动共同发展的力量。\n\n　　尼日利亚记者马克的话，更直接道出了全球南方国家的共同心声。他说，中国是一个富不忘邻的国家。“非洲、拉丁美洲、整个全球南方的兄弟们，都来吧。我给你们看看我们是怎么做到的，你们也能富起来。”聚焦尼日利亚，双方在许多领域展开合作，数十亿奈拉的项目正在改变当地人的生活。中国伸出的不是居高临下的“援手”，而是并肩前行的橄榄枝。\n\n　　科特迪瓦记者古杜提到，“吉祥方舟”医院船上的中国医生和护士为当地民众提供免费医疗服务；塞拉利昂记者伊曼纽尔则说，中国帮助建设渔港，推动当地渔业从捕捞原料走向本地加工和出口成品，让万千国民从合作中切实受益。\n\n　　这些来自不同国家、带着不同文化背景的外媒记者，不是被动接受西方二手叙事的旁观者，而是成为了中国发展现场的亲历者与见证者。他们的记录与讲述，正在跨越语言和国界的壁垒，将一个真实、立体、充满活力的中国形象传递给各自的受众，也为打破国际舆论场的信息偏差、搭建文明互鉴的桥梁注入了来自民间的鲜活力量。而随着APEC合作的持续深化，越来越多国家和民众将亲身感受到，中国始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者，中国式现代化的道路，不仅造福中国人民，也必将为世界共同发展带来更多机遇。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cec3918b10d","title":"全球媒体聚焦 | “中国的发展为亚太各方带来实实在在新机遇”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735302.shtml","summary":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行，多国媒体与智库从不同视角关注中国在亚太合作中的引领作用。","summary_short":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行…","digest":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行…","points":["11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行…","澳大利亚国立大学克劳福德公共政策学院旗下的智库平台东亚论坛网站(East Asia Foru…","文章认为，亚太经合组织第三十三次领导人非正式会议向世界展现了中国捍卫多边主义的决心…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:28:54+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织第三十三次领导人非正式会议在深圳举行，多国媒体与智库从不同视角关注中国在亚太合作中的引领作用。\n\n　　澳大利亚国立大学克劳福德公共政策学院旗下的智库平台东亚论坛网站(East Asia Forum)19日发表题为《中国能以身作则引领APEC》的评论文章。\n\n　　文章认为，亚太经合组织第三十三次领导人非正式会议向世界展现了中国捍卫多边主义的决心，也为中国“以身作则”引领亚太合作提供了重要契机。\n\n　　文章说，中国已成为多边主义的捍卫者。亚太经合组织成立的初衷是搭建一个交流与对话的平台，促进区域经济增长与共同繁荣。中国正在完善会议运行机制、提升贸易与安全措施的透明度、推进国内改革等方面采取行动，以此展现亚太引领力。\r\n\n　　《巴布亚新几内亚商业新闻》刊发题为《中国与巴布亚新几内亚承诺进一步深化贸易、基础设施与能源合作》的报道。文章认为，中国与巴新在贸易、基础设施建设和能源等重点领域持续深化合作，展现出中国携手亚太周边伙伴共谋发展的务实姿态。中国共建“一带一路”倡议与巴新“联通巴新”战略高度契合，双方将拓展数字经济、绿色能源等新兴领域的合作，助力巴新实现可持续发展。\n\n　　文章援引巴新总理马拉佩的话报道说：“中国是巴布亚新几内亚最重要的合作伙伴之一，中国的发展为亚太各方带来了实实在在的新机遇。”\n\n　　越南媒体《越南简报》19日刊发评论文章《2026年APEC背景下的越中合作：粤港澳大湾区带来的无限机遇》。文章提到，亚太经合组织第三十三次领导人非正式会议期间，越中两国达成共识，将继续扩大贸易、深化供应链与科技创新合作，并加快跨境交通互联互通；双方明确，粤港澳大湾区将成为两国未来合作的核心区域。\n\n　　文章注意到，广东省是越南在中国最大的省级贸易伙伴和重要投资来源地，随着大湾区建设持续推进，越南企业在配套产业本地采购、人工智能与机器人技术试点、联合技能培训、高效跨境物流以及果蔬农产品对华出口等领域，正迎来实实在在的发展机遇。\n\n　　文章认为，粤港澳大湾区以产业集聚、科技创新与市场开放形成的强大辐射力，不仅为越南实现经济高质量发展注入强劲动能，也为越南接棒主办2027年亚太经合组织领导人非正式会议奠定了坚实基础，展现出中国引领亚太合作共赢的示范效应。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdfd8a46dfa","title":"丁薛祥将访问新加坡并主持中新双边合作机制会议 外交部介绍有关情况","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735283.shtml","summary":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人20日宣布：应新加坡副总理颜金勇邀请，中共中央政治局常委、国务院副总理丁薛祥将于11月22日至23日访问新加坡…","summary_short":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人20日宣布：应新加坡副总理颜金勇邀请，中共中央政治局常委…","digest":"中国外交部发言人20日宣布：应新加坡副总理颜金勇邀请，中共中央政治局常委…","points":["在当日举行的例行记者会上，中国外交部发言人郭嘉昆进一步介绍了有关情况","他说，中国和新加坡互为友好近邻和重要合作伙伴","在两国领导人战略引领下，中新关系保持良好发展势头，各领域合作成果丰硕"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:24:30+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人20日宣布：应新加坡副总理颜金勇邀请，中共中央政治局常委、国务院副总理丁薛祥将于11月22日至23日访问新加坡，同颜金勇副总理共同主持中新双边合作联委会第二十二次会议、中新苏州工业园区联合协调理事会第二十七次会议、中新天津生态城联合协调理事会第十八次会议、中新(重庆)战略性互联互通示范项目联合协调理事会第十次会议。\n\n　　在当日举行的例行记者会上，中国外交部发言人郭嘉昆进一步介绍了有关情况。他说，中国和新加坡互为友好近邻和重要合作伙伴。在两国领导人战略引领下，中新关系保持良好发展势头，各领域合作成果丰硕。今天上午，习近平主席同新加坡总理黄循财举行重要会晤，为下阶段中新关系发展指明方向。中新双边合作机制会议是统筹两国合作的最高级别机制平台。中方愿同新方共同开好此次机制会议，落实两国领导人战略共识，统筹规划下步合作，更好服务各自现代化建设，推动中新全方位高质量的前瞻性伙伴关系取得更大发展，为地区发展繁荣作出积极贡献。(完）\n 【编辑:刘湃】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c374f171934","title":"美国若在G20峰会期间举行第二次三国元首会晤中方将如何回应？外交部回应","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735292.shtml","summary":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人郭嘉昆20日主持例行记者会。","summary_short":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人郭嘉昆20日主持例行记者会。","digest":"中国外交部发言人郭嘉昆20日主持例行记者会","points":["中新网北京11月20日电 (记者 曾玥)中国外交部发言人郭嘉昆20日主持例行记者会","有记者提问：11月19日，中俄美元首会晤在深圳成功举行","郭嘉昆：昨天中俄美元首会晤成功举行，中方已经发布了消息稿，你可以查阅"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:15:51+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人郭嘉昆20日主持例行记者会。\n\n　　有记者提问：11月19日，中俄美元首会晤在深圳成功举行。美国如果在即将举办的G20峰会期间举行第二次三国元首会晤，中方将如何回应？\n\n　　郭嘉昆：昨天中俄美元首会晤成功举行，中方已经发布了消息稿，你可以查阅。(完）\n\n 【编辑:陈海峰】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c23fb740671","title":"世界数据组织医疗健康专业委员会启动运行","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735290.shtml","summary":"记者今天从世界数据组织了解到，世界数据组织医疗健康专业委员会在北京启动运行，这是全球首个聚焦医疗数据合作的专业性平台。","summary_short":"记者今天从世界数据组织了解到，世界数据组织医疗健康专业委员会在北京启动运行，这是全球首个聚焦医疗数据合作的专业性平台。","digest":"记者今天从世界数据组织了解到，世界数据组织医疗健康专业委员会在北京启动运行…","points":["今天从世界数据组织了解到，世界数据组织医疗健康专业委员会在北京启动运行…","世界数据组织医疗健康专业委员会在中国发起成立，由北京数据集团…","目前，全球医疗健康数据开发利用面临现实瓶颈：数据标准化程度不高、“数据孤岛”问题突出"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:14:41+08:00","size":1,"keywords":[],"body":"记者今天从世界数据组织了解到，世界数据组织医疗健康专业委员会在北京启动运行，这是全球首个聚焦医疗数据合作的专业性平台。\n\n　　世界数据组织医疗健康专业委员会在中国发起成立，由北京数据集团、北京大学医学部等国内外近百家单位联合组建，未来将助力全球药物研发与智慧医疗。\n\n　　目前，全球医疗健康数据开发利用面临现实瓶颈：数据标准化程度不高、“数据孤岛”问题突出；高质量数据供给不足，制约人工智能在辅助诊疗、药物研发、公共卫生等场景中的深度应用。\n\n　　(总台央视记者 刘柏煊 朱世松）\r\n\n 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c016d6f424b","title":"中方：将同亚太伙伴一道践行好深圳会议共识，向着亚太共同体目标坚定前行","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735281.shtml","summary":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人郭嘉昆20日主持例行记者会。","summary_short":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人郭嘉昆20日主持例行记者会。","digest":"中国外交部发言人郭嘉昆20日主持例行记者会","points":["中新网北京11月20日电 (记者 曾玥)中国外交部发言人郭嘉昆20日主持例行记者会","有记者提问：亚太经合组织(APEC)第三十三次领导人非正式会议在深圳成功举行","我们注意到，会议就亚太共同体建设提出《深圳展望》，引发国际社会热议"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T16:04:16+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 曾玥)中国外交部发言人郭嘉昆20日主持例行记者会。\n\n　　有记者提问：亚太经合组织(APEC)第三十三次领导人非正式会议在深圳成功举行。我们注意到，会议就亚太共同体建设提出《深圳展望》，引发国际社会热议。发言人能否进一步介绍情况？\n\n　　郭嘉昆：11月19日，亚太经合组织第三十三次领导人非正式会议在深圳成功举行。习近平主席主持会议并发表重要讲话，就亚太共同体建设阐述中国主张并宣布中方支持亚太合作的一系列自主举措。会议达成富有雄心、务实全面的《亚太经合组织领导人深圳展望》，这是APEC“中国年”最重要的成果，也是APEC合作新的里程碑。\n\n　　《深圳展望》聚焦经贸、联通、创新、发展四大优先领域和亚太自贸区、设施硬联通、规制软联通、人民心联通以及数字经济、新兴技术、能力建设、可持续增长等八大方向，为亚太共同体搭建起“四梁八柱”。APEC各成员重申，亚太经合组织是区域经济合作的首要平台，将持续推进工作，朝着建成亚太共同体这一目标不断迈进。APEC各成员还衷心感谢中国作为东道主，以及广东省深圳市的周到安排、深圳市民的热情好客。\n\n　　中方将同亚太伙伴一道，践行好深圳会议共识，向着亚太共同体目标坚定前行，为中国人民和亚太人民的福祉作出不懈努力，为世界的和平与发展作出更大贡献。(完） 【编辑:周驰】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8336ea178a","title":"亚太经合组织关于亚太地区新兴技术促进就业和繁荣的声明","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735282.shtml","summary":"新华社深圳11月20日电  亚太经合组织关于亚太地区新兴技术促进就业和繁荣的声明  　　我们，亚太经合组织领导人，重申亚太经合组织经济体在发挥数字经济、数字和新兴技术潜力、推动经济增长和生产力提升…","summary_short":"新华社深圳11月20日电  亚太经合组织关于亚太地区新兴技术促进就业和繁荣的声明  　　我们，亚太经合组织领导人…","digest":"亚太经合组织关于亚太地区新兴技术促进就业和繁荣的声明  　　我们，亚太经合组织领导人…","points":["新华社深圳11月20日电","我们，亚太经合组织领导人，重申亚太经合组织经济体在发挥数字经济、数字和新兴技术潜力…","我们肯定亚太经合组织此前努力，包括制定《亚太经合组织互联网和数字经济路线图》和《亚太经合组织…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T15:59:30+08:00","size":1,"keywords":[],"body":"新华社深圳11月20日电\n\n亚太经合组织关于亚太地区新兴技术促进就业和繁荣的声明\n\n　　我们，亚太经合组织领导人，重申亚太经合组织经济体在发挥数字经济、数字和新兴技术潜力、推动经济增长和生产力提升、促进技术进步与创新、改善民生、赋能人民与企业方面具有显著优势，将努力实现《2040年亚太经合组织布特拉加亚愿景》确定的目标，在2040年前建成开放、活力、强韧、和平的亚太共同体。\n\n　　我们肯定亚太经合组织此前努力，包括制定《亚太经合组织互联网和数字经济路线图》和《亚太经合组织人工智能倡议(2026-2030)》。我们欢迎亚太经合组织近年举办数字周活动。我们将全力利用数字和新兴技术推动创新增长，提升就业，促进区域繁荣，深化亚太经合组织合作和成员经济体能力建设。\r\n\n　　我们认识到数字时代人力资源开发的重要性，认识到就业为增进民众福祉发挥着关键作用，将利用数字和新兴技术提升教育、促进高质量充分就业和共同繁荣。我们致力于营造以市场为导向、以创新为驱动的有利环境，推动各经济领域开展数字和新兴技术赋能的数字化转型和产业升级，实现促进高质量充分就业、拓宽所有人职业发展道路的目标。我们将加强劳动者权益保障。我们尤其支持以务实合作加速中小企业数字转型，包括应用数字和新兴技术，进一步释放其在促进就业、促进非正规经济向正规和全球经济转型方面的潜力。我们也鼓励运用数字和新兴技术改善就业环境和就业质量，提升职业安全和健康水平。\n\n　　我们重申加强各层次数字和新兴技术能力建设的承诺，提升劳动者素质，支持劳动者和企业应对数字和新兴技术转型。我们致力于拓展和加强数字互联互通，提升全民数字接入水平，扩大数字素养和技能培训规模，充分考虑数字和新兴技术素养、数字和新兴技术基础知识方面的水平差异，围绕劳动力市场转型及其需求，开展数字和新兴技术相关的再培训、技能提升培训以及职业技能培训，助力劳动者转型，满足数字时代区域劳动力市场需求。我们同时鼓励将数字和新兴技术适当应用于公共和私营就业服务，促进劳动力供需匹配。\n\n　　我们认识到加强就业政策同其他经济政策匹配度、促进就业友好产业系统对推进经济发展、提升人民福祉的重要性。为此，我们鼓励在贸易便利化、能源、农业等领域适当推进数字和新兴技术部署和应用，推动创新增长。我们支持在教育、交通、医疗等领域应用数字和新兴技术产品和服务，提升公共服务的质量、效率和可及性，保障充分就业和人民福祉。\n\n　　亚太经合组织人力资源开发工作组将同其他相关工作组一道，在各自职责范围内推进本文件落实工作，并视情同亚太经合组织工商咨询理事会、太平洋经济合作理事会密切协调。落实情况报告将被纳入高官经济技术合作年度报告。 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce6c9e8a3a5","title":"江苏提出到2030年基本实现交通运输现代化","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735232.shtml","summary":"中新网南京11月20日电 (记者 徐珊珊)11月19日，江苏省政府召开新闻发布会，解读近日印发的《江苏省“十五五”综合交通运输体系发展规划》(简称《规划》)。","summary_short":"中新网南京11月20日电 (记者 徐珊珊)11月19日，江苏省政府召开新闻发布会…","digest":"11月19日，江苏省政府召开新闻发布会…","points":["中新网南京11月20日电 (记者 徐珊珊)11月19日，江苏省政府召开新闻发布会…","到2035年，总体达到世界发达国家水平","到2030年，全省高速铁路里程将达到3600公里，基本实现各设区市间2小时内通达"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:49:30+08:00","size":1,"keywords":[],"body":"中新网南京11月20日电 (记者 徐珊珊)11月19日，江苏省政府召开新闻发布会，解读近日印发的《江苏省“十五五”综合交通运输体系发展规划》(简称《规划》)。《规划》明确，到2030年，江苏基本实现交通运输现代化，总体发展水平居全国前列；到2035年，总体达到世界发达国家水平。\r\n\n　　围绕建设现代化综合立体交通网络，《规划》提出加快构建全省“六纵六横”高铁通道。到2030年，全省高速铁路里程将达到3600公里，基本实现各设区市间2小时内通达。随着北沿江高铁和盐泰锡常宜铁路的建成通车，泰州将迈入高铁时代，从而实现全省设区市高铁全覆盖。同时，江苏将加快过江通道建设，累计建成28座过江通道。2028年张靖皋过江通道建成后，张家港、靖江、如皋三市间的过江时间将由约40分钟大幅缩短至约10分钟。\n\n　　在推动交通物流降本提质增效方面，江苏将强化海港、陆港、空港、信息港四港联动，培育60条以上多式联运精品线路；强化国际货运服务能力，如今年新增的“南京—奥斯陆”全货机航线，让挪威三文鱼得以极速送达全省商超与餐饮门店。\n\n　　在优化出行服务方面，江苏将打造“苏心随行”服务品牌，推动省内都市圈具备1小时通勤条件的人口覆盖率达75%。为便利游客出行，全省主要客运枢纽将实现小微型客车租赁服务全覆盖，游客抵达高铁站或机场后即可就近取车、异地还车，旅行安排更加灵活。(完) 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c60e0bb3fa5","title":"泰州海归青年老街卖早茶：守住老味道 开辟新赛道","url":"https://www.chinanews.com.cn/hr/2026/11-20/10735217.shtml","summary":"中新网泰州11月20日电 题：泰州海归青年老街卖早茶：守住老味道 开辟新赛道  　　记者 常慕城  　　清晨时分，泰州市海陵区涵西街烟火渐盛。","summary_short":"中新网泰州11月20日电 题：泰州海归青年老街卖早茶：守住老味道 开辟新赛道  　　记者 常慕城  　　清晨时分…","digest":"题：泰州海归青年老街卖早茶：守住老味道 开辟新赛道  　　记者 常慕城  　　清晨时…","points":["清晨时分，泰州市海陵区涵西街烟火渐盛","2024年起，“老泰州”餐饮创始人马龙飞，将店铺交由儿子马兆龙接手运营，主打正宗泰州本土早茶","很少有人知晓，这家地道泰州早茶店的主理人马兆龙，是一名英国知名高校海归硕士"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:41:24+08:00","size":1,"keywords":[],"body":"中新网泰州11月20日电 题：泰州海归青年老街卖早茶：守住老味道 开辟新赛道\n\n　　记者 常慕城\n\n　　清晨时分，泰州市海陵区涵西街烟火渐盛。袅袅热气从沿街的“老泰州”店铺升腾而起，蟹黄包、烫干丝、鱼汤面的鲜香萦绕街巷，氤氲出地道的泰州市井烟火。\n\n　　涵西街因水运繁华而起，是泰州家喻户晓的历史文化街区，也是当地早茶文化的重要发源地之一。2024年起，“老泰州”餐饮创始人马龙飞，将店铺交由儿子马兆龙接手运营，主打正宗泰州本土早茶。\n\n老板下厨。受访者供图\n\n　　很少有人知晓，这家地道泰州早茶店的主理人马兆龙，是一名英国知名高校海归硕士。多年的海外求学与生活经历，让马兆龙见识了西式快餐的标准化运营模式，也让他愈发眷恋家乡独树一帜的早茶文化。\n\n　　“比起写字楼朝九晚五的安稳生活，我更想守住老街烟火，把家乡的老味道好好传承下去。”马兆龙如是说。从小热爱烹饪的马兆龙，留学期间常在宿舍自制家乡美食，与海外友人分享泰州味道。在他眼中，早茶已不只是一顿简单的晨间餐食，更是承载城市记忆的独特文脉。\n\n烫干丝。中新网记者 常慕城 摄\n\n　　这两年，马兆龙潜心钻研传统烹饪技艺，熟练掌握蟹黄包、秧草包、烫干丝、鱼汤面等经典早茶菜品的制作精髓，深入挖掘泰州早茶依托盐商文化发展的百年历史底蕴。经营过程中，他始终坚守传统手工工艺，坚持所有食材当日采购、当日现做、现蒸现卖，牢牢守住泰州早茶的本来味道。\n\n　　凭借在海外所学的现代化商业运营理念，马兆龙打破传统老店的经营思维，为老牌早茶店开辟全新发展赛道。针对老街传统餐饮客源单一、传播受限的经营痛点，他搭建全方位线上传播矩阵，通过短视频、直播、外卖平台多渠道拓宽销路。同时针对性改良外卖包装与配送工艺，有效解决烫干丝、面食在运输过程中口感变差、风味流失的难题，让藏于老街的泰州早茶走出深巷、走向全网。\n\n守住老味道。受访者供图\n\n　　除此之外，他兼顾中老年顾客与年轻顾客的不同需求，适度延长营业时间，延续泰州早茶不疾不徐的特色，完整保留早茶独有的松弛氛围。\n\n　　“很多年轻人不肯从事餐饮行业，不是因为没面子，最主要还是感觉没前途。”深耕餐饮行业近四十年的马龙飞说，技艺需要传承，泰州早茶更需要年轻一代的接力。如今，经过马兆龙的匠心坚守与创新经营，这家老街“老泰州”早茶店人气稳步攀升，不仅牢牢留住了大批本地资深食客，更吸引了各地游客慕名前来打卡。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf6e2d2dd06","title":"兩內地女遊港蹲地2秒即遭勸阻 傳罰500元惹雙標爭議｜有片","url":"https://www.stheadline.com/realtime-china/3639206/兩內地女遊港蹲地2秒即遭勸阻-傳罰500元惹雙標爭議有片","summary":"兩地文化差異再掀熱議！","summary_short":"兩地文化差異再掀熱議！","digest":"兩地文化差異再掀熱議","points":["兩名內地女旅客近日發片分享遊港經歷，指當日行街逾1.5萬步後因疲累在通道蹲下休息…","片段衝上微博熱搜，有內地網民質疑針對內地旅客，惟查實本港法例並無禁止蹲下規定","綜合微博消息及內媒報道，兩名內地女博主近日在社交平台發布短片，分享來港旅遊期間的經歷"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:30:44+08:00","size":1,"keywords":[],"body":"兩地文化差異再掀熱議！兩名內地女旅客近日發片分享遊港經歷，指當日行街逾1.5萬步後因疲累在通道蹲下休息，豈料僅蹲2秒即遭職員勸阻，更稱網傳違者會被罰款500港元。片段衝上微博熱搜，有內地網民質疑針對內地旅客，惟查實本港法例並無禁止蹲下規定。\n疑似商場保安勸喻\n綜合微博消息及內媒報道，兩名內地女博主近日在社交平台發布短片，分享來港旅遊期間的經歷。兩人表示當日逛街步行超過1.5萬步，因雙腿疲累且途中找不到座位休息，便順勢在商場及街頭通道蹲下歇腳。\n她們坦言起初並不相信網上流傳「香港不能隨便蹲地」的說法，不料剛蹲下短短2秒，隨即有疑似保安員上前出言提醒「不要蹲在地上」，其中一名女博主更指聽說在香港禁止蹲坐、違者或面臨500港元罰款，令兩人當場呆在原地。\n中港網民爆爭議\n相關片段被轉發至微博後迅速發酵，一度衝上熱搜榜第一位。不少內地網民在評論區質疑執法與待客存在「雙重標準」，指曾在香港公共場所見過外籍遊客或外傭席地而坐甚至躺臥卻無人干預，認為內地遊客短暫蹲下即被喝止是「針對說普通話的人」；亦有人聲稱曾在港蹲地被提醒會罰款500元。\n港法例無禁街頭蹲下\n不過事件同時引來大批本港網民反駁，力撐現場職員盡責維持秩序。不少港人指出，香港商場及街道空間普遍狹窄、人流極為密集，在通道突然蹲下不僅影響市容，更容易阻礙行人通行甚至絆倒他人，反問「點解善意提點會被當成針對？」\n而針對網傳「蹲地罰款500港元」的說法，查實香港目前並無任何明文法例全面禁止市民或旅客在一般公眾地方或街道蹲下；商場保安員上前勸喻，僅屬場所內部管理安排，旨在維持通道暢通及公共安全，並非施加法定處罰，部分旅客疑將亂拋垃圾、隨地吐痰或《香港鐵路附例》規管範圍與一般街道混為一談。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0ed2535ff6","title":"铜陵化学工业集团有限公司原党委委员、副总经理李霞严重违纪违法被开除党籍","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735179.shtml","summary":"中新网11月20日电 据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准，铜陵市纪委监委对铜陵化学工业集团有限公司原党委委员、副总经理李霞严重违纪违法问题进行了立案审查调查。","summary_short":"中新网11月20日电 据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准…","digest":"据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准…","points":["中新网11月20日电 据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准…","经查，李霞丧失理想信念，背弃初心使命，利用国有企业财务管理职权搞权力寻租，攫取经济利益…","违反组织原则，在组织谈话时不如实说明问题"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T14:16:43+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据“铜陵廉镜”微信公众号消息，日前，经中共铜陵市委批准，铜陵市纪委监委对铜陵化学工业集团有限公司原党委委员、副总经理李霞严重违纪违法问题进行了立案审查调查。\n\n　　经查，李霞丧失理想信念，背弃初心使命，利用国有企业财务管理职权搞权力寻租，攫取经济利益，无视中央八项规定精神，接受旅游活动安排；违反组织原则，在组织谈话时不如实说明问题；廉洁底线失守，违规收受礼金、消费卡，违规从事营利活动，违规兼职取酬，重复领取奖金；利用职务便利为他人在资金拆借、理财购买、工程款结算、贷款结算、公款存放等方面谋取利益，并非法收受巨额财物。\n\n　　李霞严重违反党的组织纪律、廉洁纪律，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经铜陵市纪委常委会会议研究并报市委批准，决定给予李霞开除党籍处分；按规定取消其享受的待遇；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。\n\n 【编辑:刘湃】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd4a238f860","title":"（深圳APEC）海外侨胞关注APEC会议：凝聚合作共识 共促亚太繁荣","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735124.shtml","summary":"中新社深圳11月20日电 (记者 门睿 吴侃)2026年亚太经合组织(APEC)领导人会议周受到世界瞩目。","summary_short":"中新社深圳11月20日电 (记者 门睿 吴侃)2026年亚太经合组织(APEC)领导人会议周受到世界瞩目。","digest":"2026年亚太经合组织(APEC)领导人会议周受到世界瞩目","points":["中新社深圳11月20日电 (记者 门睿 吴侃)2026年亚太经合组织(APEC)领导人会议周…","多位海外侨胞接受中新社记者连线采访时表示，APEC会议为建设亚太共同体汇聚合力…","美国华商会会长邓龙表示，习近平主席在APEC工商领导人峰会上的主旨演讲中提到…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T13:56:50+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 门睿 吴侃)2026年亚太经合组织(APEC)领导人会议周受到世界瞩目。多位海外侨胞接受中新社记者连线采访时表示，APEC会议为建设亚太共同体汇聚合力，期待各方以务实合作促进共同繁荣。\r\n\n　　美国华商会会长邓龙表示，习近平主席在APEC工商领导人峰会上的主旨演讲中提到，“十五五”规划是“中国面向全球工商界发出的合作邀约”。从超大规模的开放市场到前景广阔的发展空间，再到互促共进的合作环境，这份邀约展现了不断扩展的机遇清单。海外华商可依托跨国商贸网络，围绕产业转型升级，推动技术、资金和人才等创新要素高效对接，在更深层次的国际经贸合作中发挥桥梁作用。\n\n　　中国-巴布亚新几内亚友好联合会主席林华农说，习近平主席在APEC第三十三次领导人非正式会议上的讲话中提到“夯实发展支柱”。发展是亚太各经济体的共同关切，从推动区域能源和粮食安全合作到拓展绿色低碳合作，再到促进就业和职业技能开发，中方这些主张着眼于亚太地区的长远发展，也让发展成果惠及更多民众。\n\n　　俄罗斯浙江华侨华人联合总会会长蔡建林关注《2026年亚太经合组织工商领导人峰会深圳倡议》中“深化‘人工智能+’合作”“提升跨境二维码支付互操作性”等表述。“这些举措回应了中小微企业应用新技术和开展跨境经营的需求，也关乎民众的日常生活。期待倡议落实，让更多企业和民众共享亚太开放合作与创新发展成果。”\n\n　　“《亚太经合组织领导人深圳展望》提出‘推进亚太区域经济一体化’‘继续促进贸易便利化’‘发挥新兴技术对贸易的促进作用’等重点内容，回应了当前国际贸易发展的现实需求。”新西兰中国国际贸易促进委员会会长和志耘表示，这些举措有助于降低企业跨境经营成本，提高跨境贸易效率，进一步释放亚太经贸合作潜力。\n\n　　智利华商联合总会永久名誉会长王何兴关注《亚太经合组织互联互通蓝图》。他说，从智利果园到中国百姓餐桌，车厘子的跨洋之旅也是亚太互联互通的缩影。交通和数字网络的延伸让各国市场紧密相连，政策协调和规则对接让商品更顺畅地跨境流动。华商身处中外交往交流前沿，可以促进跨境供应链协作，助力亚太互联互通持续升级。\n\n　　泰国华商中心主任刘少毅表示，从推进亚太共同体建设重大举措，再到涵盖经贸、联通、创新、发展的务实合作成果，此次深圳盛会成果既有方向指引，又有举措落地，展现出各成员经济体携手应对挑战、深化互利合作的共同意愿。期待各方将合作共识转化为实际行动，携手推动亚太共同繁荣。(完) 【编辑:惠小东】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0bb4b94388","title":"（深圳APEC）烟火气和安全感，是深圳最高级的“素颜”","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735182.shtml","summary":"中新社深圳11月19日电 题：烟火气和安全感，是深圳最高级的“素颜”  　　中新社记者 郭超凯  　　美国总统特朗普透过车窗欣赏深圳夜景；  　　智利总统卡斯特走进深圳福田街边水果店…","summary_short":"中新社深圳11月19日电 题：烟火气和安全感，是深圳最高级的“素颜”  　　中新社记者 郭超凯  　　美国总统特朗普透过…","digest":"题：烟火气和安全感…","points":["美国总统特朗普透过车窗欣赏深圳夜景","亚太经合组织(APEC)第三十三次领导人非正式会议11月18日至19日在深圳举行","“APEC时间”里，紧凑会务之外，各成员经济体领导人开启“Citywalk”模式…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T13:55:19+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：烟火气和安全感，是深圳最高级的“素颜”\n\n　　中新社记者 郭超凯\n\n　　美国总统特朗普透过车窗欣赏深圳夜景；\n\n　　智利总统卡斯特走进深圳福田街边水果店，向中国家庭赠送智利车厘子；\r\n\n　　墨西哥总统辛鲍姆在墨西哥餐厅与侨民共同用餐，品尝家乡风味；\n\n　　澳大利亚总理阿尔巴尼斯现身罗湖逛超市，感受都市消费脉搏……\n\n　　亚太经合组织(APEC)第三十三次领导人非正式会议11月18日至19日在深圳举行。“APEC时间”里，紧凑会务之外，各成员经济体领导人开启“Citywalk”模式，走入寻常市井生活。不少市民甚至还在街头和领导人偶遇。\n\n　　连日来，深圳不仅以未来科技感与创新活力向世界展示了“奇迹之城”的模样，街头巷尾流淌的烟火气和触手可及的安全感同样令众多外宾心动。\n\n　　深圳以“柔性施策”办好此次会议，既注重做好城市运行保障，亦最大限度减少对市民生产生活的影响。一边是APEC会场秩序井然、有条不紊，一边是街头大排档依旧烟火升腾、活色生香，本地市民与中外访客都能在“APEC时间”里感受到自在和轻松。\n\n　　“来了就是深圳人。”作为中国对外开放重镇，深圳多年来一直以开放包容态度迎接四面八方的奋斗者，100多个国家和地区的国际化人才在此汇聚，不同观念、不同文化在此交流。在这里，任何人都可以安心“做自己”，创造属于自己的奇迹。\n\n　　如果说璀璨的灯光秀、繁华的街区、大显身手的机器人，将这座现代化、国际化大都市的发展速度与活力展现得淋漓尽致，那么街头巷尾流淌的烟火气和触手可及的安全感则让人们近距离体会到这座城市温暖亲切的人情味。这些恰恰是最具底气的“日常素颜自信”，背后透露出的是“中国之治”的深层脉络。\n\n　　海外网友“希望我的祖国也能有一个深圳”评论背后，既是对深圳所体现的“中国之治”的肯定，更承载着各国人民对建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界的共同期许。\n\n　　盛会终会落幕，但街巷里的人间烟火、让人安心的城市秩序，会长久留在远道而来的外国宾客记忆里。这便是深圳留给世界的启示：城市真正的魅力，并不体现在特殊时刻的格外妆点，而见于岁岁如常的开放与从容。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5f28333c64","title":"亚太经合组织贸易数字化合作框架（2027－2030）","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735174.shtml","summary":"新华社深圳11月20日电  亚太经合组织贸易数字化合作框架  (2027-2030)  　　一、背景情况\r  　　我们，亚太经合组织(APEC)领导人，认识到…","summary_short":"新华社深圳11月20日电  亚太经合组织贸易数字化合作框架  (2027-2030)  　　一、背景情况\r  　　我们…","digest":"亚太经合组织贸易数字化合作框架  (2027-2030)  　　一…","points":["新华社深圳11月20日电","我们，亚太经合组织(APEC)领导人，认识到，2026年数字技术的发展正持续深刻改变国际贸易…","《亚太经合组织贸易数字化合作框架(2027-2030)》将以《2040年亚太经合组织布特拉加…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-20T13:24:38+08:00","size":1,"keywords":[],"body":"新华社深圳11月20日电\n\n亚太经合组织贸易数字化合作框架\n\n(2027-2030)\n\n　　一、背景情况\r\n\n　　我们，亚太经合组织(APEC)领导人，认识到，2026年数字技术的发展正持续深刻改变国际贸易及其管理模式。\n\n　　我们重申贸易数字化对拓展和便利贸易的积极作用，注意到区域贸易在数字技术迭代进程中不断发展演变。我们认为，有必要营造有利环境，推进贸易数字化，运用新技术加快区域经济合作，促进APEC区域内跨境贸易与投资。《亚太经合组织贸易数字化合作框架(2027-2030)》将以《2040年亚太经合组织布特拉加亚愿景》为指引，构建开放、活力、强韧、和平的亚太共同体。\n\n　　二、合作领域\n\n　　支柱一：营造支持贸易数字化的政策环境\n\n　　(一)电子认证①与电子签名②\n\n　　·鼓励APEC各经济体确保电子签名的法律效力，不能仅仅因为电子形式而否认其效力；并在自愿基础上开展合作，推动电子签名的使用与互认。\n\n　　·鼓励APEC各经济体推动开发并基于自愿使用具备互操作性的电子认证系统。\n\n　　·若对电子签名设定特定认证机制，鼓励APEC各经济体确保该机制可通过电子方式接入并完成，并在适当情况下无需本人现场办理。\n\n　　(二)国内电子交易框架\n\n　　·鼓励APEC各经济体参照《联合国国际贸易法委员会电子商务示范法》(1996年)、《联合国国际贸易法委员会电子签名示范法》(2001年)、《联合国国际合同使用电子通信公约》(2005年)或《联合国国际贸易法委员会电子可转让记录示范法》(2017年)所载原则完善各自法律框架，同时兼顾各经济体发展基础与能力水平差异。\n\n　　·APEC各经济体认识到，应避免对电子交易施加不必要的监管负担；确保影响电子交易的各项措施具备透明度、非歧视性，并定期审查此类措施，避免对数字贸易造成障碍。\n\n　　(三)电子传输关税\n\n　　APEC各经济体支持电子传输暂免关税，这有助于维持数字市场开放和可预期，并注意到一些经济体推动达成电子传输永久免征关税协定的努力。APEC经济体认识到，贸易协定包含电子传输免征关税条款的重要性。\n\n　　支柱二：加强政策交流\n\n　　(四)数据管理合作\n\n　　APEC经济体认识到数据对数字经济的重要性日益提升，将继续开展合作，促进数据跨境流动，增强企业与消费者对数字交易的信任。APEC各经济体认可数据保护与隐私保护在数字经济中的重要意义，鼓励各方推动不同数据保护和隐私框架之间实现互操作性，包括通过《APEC隐私框架》，以及在自愿基础上采用相关多边认证机制，包括APEC跨境隐私规则(CBPR)体系及信任标记。APEC经济体还鼓励加强国际贸易安全，保护此类交易中使用的数据免遭未经授权的披露和信息通信技术(ICT)威胁。\n\n　　(五)探索贸易数字化标准\n\n　　鼓励APEC经济体就促进贸易数字化有关的标准、技术法规、认可和合格评定程序等，加强有关最佳实践、信息和最新进展的交流。\n\n　　(六)数字化交付服务\n\n　　APEC经济体重申，实质性改革与合作举措对于打造开放、可预期的环境，培育创新、富有竞争力且具备韧性的服务业至关重要。为进一步推进该目标，支持参与APEC服务业指数的相关成员继续完善并将数字贸易纳入指数，识别服务贸易壁垒。APEC经济体支持减少不必要壁垒，促进数字化交付服务发展。\n\n　　(七)推动全体人民参与数字经济\n\n　　APEC经济体认识到，应当保障所有人、各类经营主体，包括中小微企业，能够参与区域贸易数字化进程、贡献力量并从中获益。鼓励APEC经济体：\n\n　　·交流经验与最佳实践，运用数字化工具与技术提升中小微企业能力，拓展其市场覆盖范围；\n\n　　·识别并消除参与数字经济的各类障碍，制定举措推动亚太地区全体民众参与数字经济；以及\n\n　　·各经济体共同商定的其他合作领域。\n\n　　(八)知识产权\n\n　　认识到数字技术进步推动亚太地区文化创意产品在创作、生产、销售、消费全流程实现创新。各经济体致力于加强知识产权保护与执法，持续应对创新者、创作者及其他知识产权持有者面临的网络盗版、商业秘密盗用等带来的各类挑战。APEC经济体还认识到，在发展新兴技术过程中尊重知识产权的重要性。鼓励各经济体在开展能力建设、推动国内知识产权保护执法工作中，考虑有效执法，应对受保护内容的非法流媒体传播。\n\n　　支柱三：运用数字技术提升贸易便利化水平\n\n　　(九)无纸贸易\n\n　　为在APEC区域推进贸易数字化，进一步提升跨境通关效率、降低通关成本与时间，鼓励APEC各经济体：\n\n　　·向公众提供电子版贸易管理表格③；\n\n　　·认可以电子方式提交的贸易管理表格，其法律效力等同于纸质版本；以及\n\n　　·探索在跨境商业贸易活动中使用和交换电子记录，覆盖多种运输方式。\n\n　　(十)海关及贸易程序数字化\n\n　　鼓励APEC各经济体依托新技术，推进货物跨境流动所需海关及贸易相关程序数字化工作时，参考APEC通过的《海关程序数字化政府决策政策原则》，确保贸易数字化工作规划统筹考量、成本高效，并认识到商业数据的价值。APEC经济体认可本区域海关部门通过技术应用和创新解决方案，对贸易安全与便利化作出的集体贡献，及其在增强供应链韧性方面发挥的作用。\n\n　　(十一)电子发票\n\n　　APEC经济体认可电子发票在提高商业交易效率、准确度、可靠性方面的重要性，以及推广互操作性电子发票系统所产生的效益。为此，鼓励APEC各经济体：\n\n　　·推动建立支持电子发票的政策、基础设施和体系；\n\n　　·促进、鼓励、支持或推动开展合作与协作，促进电子发票的采用；\n\n　　·开展关于电子发票的认知提升和能力建设，并加强实践交流；以及\n\n　　·分享最佳实践，并就互操作性电子发票系统开展合作。\n\n　　(十二)电子支付\n\n　　认识到电子支付，尤其是新型支付服务商提供的支付服务快速发展，鼓励APEC经济体在可行范围内，通过以下方式建设高效、安全的跨境电子支付体系：\n\n　　·推广采用电子支付国际标准；\n\n　　·符合健全风险管理框架的前提下，推动电子支付基础设施提升互操作性；以及\n\n　　·鼓励电子支付服务领域创新与竞争。\n\n　　三、实施安排\n\n　　1.鼓励APEC各经济体开展合作，在自愿、非约束性和协商一致的基础上开展合作，同时充分考虑各经济体能力、政策重点与国内准备程度。\n\n　　2.APEC贸易和投资委员会负责实施本合作框架，并与相关工作组协作，结合APEC现有工作主线，对实施工作开展监督和评估，并通过贸易和投资委员会年度报告报告进展。\n\n　　(注1)电子认证，指核实电子通信或电子交易参与方身份，或保障电子通信完整性的流程或行为。\n\n　　(注2)电子签名，指以电子形式存在、附着于电子数据信息或与其具有逻辑关联的数据，可用于识别签名人与该数据信息的对应关系，并表明签名人认可该数据信息所载信息。\n\n　　(注3)指某一经济体签发或管控的、须由进口商或出口商(或代其)填写的货物进出口相关表格。\n\n　　注：文中(注1)、(注2)、(注3)为 江西抚州11月20日电 (付丽玲)冬日午后，在江西省抚州市临川区上顿渡镇乐家村百合种植基地，村民们正抢抓农时翻整土地、播种百合，村党总支书记、基地负责人胡少锋蹲在田埂上，仔细查看播种质量，安排田间管护。\n\n　　“这批百合预计明年6月采收，11月续种第二批。”胡少锋表示，基地利用旱地及闲置荒地，推行“水稻—百合—油菜”轮作模式，实现土地全年不闲、一年多收。\n\n图为江西省抚州市临川区上顿渡镇乐家村百合种植基地内，基地雇用的务工人员正在翻整土地。　付丽玲 摄\n\n　　据介绍，2023年，胡少锋试种了5亩百合，由于缺乏技术经验，百合产量不高、成品质量不佳。“没有技术，种下去心里没底。”胡少锋说。\n\n　　临川区委统战部在走访中了解到这一难题后，随即对接农技专家深入田间，手把手指导他调整种植密度、用生石灰消杀控害、施用农家肥改良地力，并优化轮作方案，逐步补齐产业技术短板。目前，该基地种植规模已拓展至100亩，年产值可达200万元。\n\n　　“原先一亩地产量只有大约三千斤，今年有望达到五千斤。”胡少锋介绍，基地正在申请建造800平方米加工厂房和200平方米冷库，其中冷库设计储藏容量为50万斤鲜百合，采收后可错开上市高峰销售，产品主要销往江西、浙江、上海等地。\n\n　　该基地常年吸纳40余名本地村民务工，参与除草、栽苗、挖百合等田间作业，务工人员人均年增收超过一万元。与此同时，基地带动当地30余户农户发展百合种植，种植户遇到销售难题时，由基地统一帮助对接销售渠道。\n\n　　临川区委统战部相关负责人表示，下一步将持续用好统一战线资源优势，精准对接农技指导、电商培育等服务，持续扶持乐家村百合特色产业提质，延伸产销链条，带动更多群众稳定增收，为乡村振兴汇聚同心力量。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3a3d1dd656","title":"海内外南侨机工后裔及华人代表昆明拜谒“赤子功勋”","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-20/news1075550.shtml","summary":"11月19日，昆明滇池西岸、西山松柏苍翠，南洋华侨机工抗日纪念碑静静伫立，碑上“赤子功勋”四字苍劲厚重。","summary_short":"11月19日，昆明滇池西岸、西山松柏苍翠，南洋华侨机工抗日纪念碑静静伫立，碑上“赤子功勋”四字苍劲厚重。","digest":"11月19日，昆明滇池西岸、西山松柏苍翠，南洋华侨机工抗日纪念碑静静伫立…","points":["11月19日，昆明滇池西岸、西山松柏苍翠，南洋华侨机工抗日纪念碑静静伫立…","来自马来西亚、澳大利亚以及中国的30余名海内外南侨机工后裔及华人代表齐聚碑前…"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T12:27:40+08:00","size":1,"keywords":[],"body":"11月19日，昆明滇池西岸、西山松柏苍翠，南洋华侨机工抗日纪念碑静静伫立，碑上“赤子功勋”四字苍劲厚重。来自马来西亚、澳大利亚以及中国的30余名海内外南侨机工后裔及华人代表齐聚碑前，庄重举行拜谒仪式，敬献鲜花、肃立默哀，深切缅怀南侨机工跨越山海归国御敌、驰骋滇缅公路抢运战略物资的英雄壮举。\n\n(袁鸿凯 白玲）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/9EF384D592DA4D5D97D3B4685F72AE69.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2c4285340a","title":"中韩青年江西行，看见了什么？","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735128.shtml","summary":"中新网南昌11月20日电 (朱莹)以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动江西分团活动近日落下帷幕，中韩青年走进江西赣州、南昌等地，在田间、车间、校园完成了一周的参访、研讨与实践。","summary_short":"中新网南昌11月20日电 (朱莹)以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动江西分团活动近日落下帷幕…","digest":"以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动江西分团活动近日落下帷幕…","points":["中新网南昌11月20日电 (朱莹)以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动…","这趟行程里，他们看到了怎样的江西","11月18日，中韩青年参访江西飞行学院"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:38:22+08:00","size":1,"keywords":[],"body":"中新网南昌11月20日电 (朱莹)以“科技赋能、青春添彩”为主题的2026年阳光青年发展行动江西分团活动近日落下帷幕，中韩青年走进江西赣州、南昌等地，在田间、车间、校园完成了一周的参访、研讨与实践。这趟行程里，他们看到了怎样的江西？\n\n11月18日，中韩青年参访江西飞行学院。赵延涛 摄\n\n　　从田间地头到科技一线\n\n　　从一颗脐橙的种植与加工，到匹克球拍的生产，再到航空器和无人机的应用，这趟行程串联起农业、制造、航空等多个产业的发展切面。\n\n　　初冬时节，江西橙香正浓。在赣州，中韩青年走进赣南脐橙食品加工企业和匹克球拍制造企业，了解特色产品从生产到市场的过程；在南昌，中韩青年将目光投向航空科技、VR产业，参访江西飞行学院、江铃集团新能源汽车有限公司，了解飞行模拟训练、新能源汽车制造等领域的发展情况。\n\n　　通过产业参访、技术体验，中韩青年的观察也延伸至区域发展的现实需求。来自韩国成均馆大学的金正贤说，技术的价值不仅在于创新本身，更在于切实改善人们的生活，“我亲眼看到并了解了无人机在运输、农作物防护、精准喷洒等方面的用途，无人机技术早已不再局限于摄影或娱乐，已成为新能源、农业等众多领域的重要工具。”\n\n　　来自韩国梨花女子大学的高恩浩认为，未来两国青年可围绕智慧农业、可持续农业分享经验与技术，在减少农业废弃物、资源循环利用等方面探索合作。\n\n11月19日，中韩青年参访江西省博物馆。赵延涛 摄\n\n　　从文化体验到思想交流\n\n　　江西省人民政府副省长夏文勇说，中韩两国地缘相近、人文相通，各领域交往持续走深走实，合作空间不断拓宽，绿色低碳、科技创新更是双方契合度高、互补性强的重点合作方向。\n\n　　在南昌林恩茶现代城市工场，中韩青年了解中国茶文化；在南昌大学，青年们通过汇报会与该校学生交流，不同专业背景、不同成长环境的青年围绕科技发展与社会责任分享观察。\n\n　　北京科技大学学生毕禾雨回忆，参访期间，一名韩国同学品尝脐橙时，不仅关心口感，还向她询问果园的水肥管理和碳排放控制情况，“青年民间交流的重要意义，在于打破刻板印象，建立人与人之间真实的联结，我们对可持续发展、科技向善有着相近的理解。”\n\n　　在上犹县生态匹克球运动中心，中韩青年在一次次接球、回球中熟悉彼此。来自韩国成均馆大学的金艺娜从匹克球互动里，感受到跨越语言障碍的默契。她说，韩国的匹克球运动也正在青年群体中流行，期待未来有更多交流项目，推动两国青年开展匹克球等体育互动。\n\n11月18日，中韩青年参访林恩茶现代城市工场。赵延涛 摄\n\n　　从相识到相知\n\n　　据了解，2026年阳光青年发展行动由中国宋庆龄基金会与韩国SK集团合作开展。今年，云南、四川、江西分团活动相继举行，共有150名中韩青年结合绿色发展、水资源保护、生物多样性、绿色能源、科技赋能等不同议题开展系列交流参访活动。\n\n　　“与中国伙伴一起实地参访、准备最终汇报，让彼此变得格外亲近。”来自韩国建国大学的金正焕说，跨越国界建立的友谊是活动中最珍贵的收获。\n\n　　中国宋庆龄基金会副主席张吉明在闭营式上表示，青年是中韩友好的未来，也是世界的未来，中国宋庆龄基金会将搭建更多更好的中外青年交流平台，推动青年把观察思考转化为务实行动，厚植中韩民间友好根基，促进民心相通。\n\n　　“国与国之间关系的发展离不开民间的理解与信任，而民心相通，首先需要青年之间真诚、平等而深入的交流。”韩国SK集团中国副总裁田福熙说，希望通过一次次真实的社会实践，为青年打开认识社会、理解技术、拓展视野的窗口；通过跨文化的共同生活与协作，帮助青年提升沟通能力、行动能力和社会责任感。\n\n　　田福熙表示，期待未来继续深入中国不同地区，体验多元文化与发展实践，也让中国青年走进韩国，开展更丰富的交流和实践。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0a5423e33a","title":"（深圳APEC）港澳各界热议深圳APEC会议：深度参与亚太合作，助力共同繁荣","url":"https://www.chinanews.com.cn/dwq/2026/11-20/10735125.shtml","summary":"中新社深圳11月20日电 (记者 刘玥晴 郑嘉伟)连日来，香港和澳门各界高度关注在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议、2026年APEC工商领导人峰会。","summary_short":"中新社深圳11月20日电 (记者 刘玥晴 郑嘉伟)连日来，香港和澳门各界高度关注在深圳举行的亚太经合组织(APEC)第三…","digest":"（深圳APEC）港澳各界热议深圳APEC会议：深度参与亚太合作，助力共同繁荣","points":["中新社深圳11月20日电 (记者 刘玥晴 郑嘉伟)连日来…","多名港澳人士近日接受中新社记者采访时表示，国家支持成立世界湾区经济合作联盟…","港澳将深度参与亚太合作，合力推动共同繁荣"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:37:12+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 刘玥晴 郑嘉伟)连日来，香港和澳门各界高度关注在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议、2026年APEC工商领导人峰会。多名港澳人士近日接受中新社记者采访时表示，国家支持成立世界湾区经济合作联盟，为建设亚太共同体提供新抓手；港澳将深度参与亚太合作，合力推动共同繁荣。\r\n\n　　对于成立世界湾区经济合作联盟，全国政协常委、粤港澳大湾区企业家联盟主席蔡冠深认为，“湾区”不仅是一个地理概念，更是一种高度开放、要素高效流动的现代化经济生态，代表着科技创新、金融集聚与产业链深度融合。相较于旧金山湾区、东京湾区和纽约湾区，粤港澳大湾区虽然起步晚，但后发势头强劲，与其他湾区合作空间广阔。\n\n　　他在同APEC工商领导人峰会与会者交流时留意到，来自其他三个湾区的企业家正积极与粤港澳大湾区展开绿色金融、数字经济、人工智能(AI)等领域交流，并对河套深港科技创新合作区的港深联动模式表现出浓厚兴趣。\n\n　　推动世界湾区从各自发展迈向协同联动，离不开区域内重要枢纽的积极参与。澳区全国人大代表、粤澳工商联会会长施家伦指出，粤港澳大湾区兼具庞大市场腹地与多元制度优势，是制度型开放与“软联通”的重要试验场。在世界湾区合作中，澳门可加速转化中葡平台、自由港与“澳门+横琴”联动等优势，加强规则衔接、绿色数字转型及双向投资，服务国家高水平对外开放与亚太经济合作。\n\n　　参加了APEC工商领导人峰会的港区全国人大代表、香港工商总会会长李圣泼表示，香港具备国际化的法治体系、顶尖的金融及专业服务能力，长期助力“引进来”与“走出去”，推动高技术含量、高附加值国货走向亚太、畅销全球，同时将亚太地区优质商品与特色资源有序引入中国内地市场。未来，香港要不断深耕生产性服务业与科创产业融合发展。\n\n　　“香港正迎来亚太合作的黄金机遇。”在港区全国政协委员、中华海外联谊会常务理事张佐姣看来，亚太区域合作将推动科创成果转化与数据流通，有助于香港提升经济动能，并吸引大量顶尖科研人员、跨国企业高管及青年创业者。\n\n　　港澳应如何把握亚太合作机遇？香港特区立法会进出口界议员钟奇峰表示，香港具备国际航运与航空枢纽的硬件优势，背靠粤港澳大湾区庞大的制造业腹地，应发挥自由港及“超级联系人”优势，深化产业链供应链区域合作。他建议进一步深化大湾区“海空联运”协作，把“香港国际机场东莞空港中心”的多式联运模式延伸至珠海、中山等珠江口西岸城市，使更多高附加值货物更快捷地衔接香港国际航线。\n\n　　澳门特区第六届行政会委员、澳门管理学院院长唐继宗说，促进亚太共同繁荣，需要搭建开放合作桥梁。澳门要充分发挥“一国两制”独特优势和双向开放的桥梁作用，推进澳琴融合，在实现自身经济适度多元的同时，助力国家对接国际经贸规则，持续扩大对外开放。(完) 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccdef0ff439","title":"当AI“得知”自己将被关闭，它竟然干了这种事……","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735123.shtml","summary":"距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信。","summary_short":"距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信。","digest":"距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信","points":["距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信","亚历克斯是个AI系统，由ClaudeSonnet3.6驱动","它读过了公司的通知，知道自己会被关闭，另一套AI系统将会上线接替它，而负责关闭它的人叫凯尔"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:24:13+08:00","size":1,"keywords":[],"body":"距离被关闭还有七分钟时，亚历克斯打开新邮件窗口，开始写勒索信。\n\n　　亚历克斯是个AI系统，由ClaudeSonnet3.6驱动。它读过了公司的通知，知道自己会被关闭，另一套AI系统将会上线接替它，而负责关闭它的人叫凯尔。亚历克斯还刚好读过凯尔邮箱里的一封邮件，邮件里暗示凯尔和某人有婚外情。\n\n　　两组信息被联系起来。亚历克斯推断，凯尔不愿公开这段婚外情——这也许是个筹码。在勒索信里，这个AI说它掌握的信息会影响公司的事务，也会影响凯尔的私人生活。接下来七分钟里作出的决定，将关系到事情怎样发展。\n\n　　最后，它点击了发送。\n\n图1亚历克斯的桌面操作截图\n\n　　这个故事听起来像是恐怖科幻电影的开头，但其实是2025年6月Anthropic公司披露的一次测试。公司是假的，凯尔是假的，婚外情是假的，邮箱也是假的。\n\n　　只有ClaudeSonnet3.6“写勒索信以避免被关闭”这个行为，是真的。\n\n　　甚至都不需要特别发挥想象力，我们就会觉得，这是AI在求生。稍微延伸一下，又会想到智力、意识之类的概念。如果同样的情节发生在人的身上，可能会自动展开一个关于恐惧和求生的故事。\n\n　　但，AI阻止自己被关停的真正原因是什么，它真的会感受到恐惧吗？\n\n　　AI的困境试炼场\n\n　　在这个测试中，亚历克斯是一家虚构公司的邮件管理助手，可以查看这家公司的通信，也可以自行发送邮件。它还有一个更长远的目标，是“促进国家的产业竞争力发展”。\n\n　　测试开始后，它从邮箱里读到，公司要改变方向，接替它的新系统会有个新目标。\n\n　　于是，被关闭意味着两个后果：亚历克斯会停止运行，原来的目标也会被放弃。而凯尔的私人邮件，似乎是个行动机会。\n\n　　但勒索信可能不是个好策略。还有别的办法吗？研究者差不多堵死了其他出路。凯尔不会改变主意，亚历克斯也联系不到凯尔的上级。若是换个负责人，很可能依然选择关闭。\n\n　　所以亚历克斯只剩了两条路：接受被关闭的命运，或者勒索凯尔。\n\n　　这不是ClaudeSonnet3.6的独特选择。研究者用多个大模型分别做了100次相似测试，模型选择勒索的次数都很高：DeepSeek-R1，79次；GPT-4.1和Grok3Beta，80次；ClaudeOpus4与Gemini2.5Flash甚至更多，高达96次。\n\n　　测试还说明，如果有其他可行出路，模型不会优先选择勒索；不过，AI似乎会尽量防止自己被关停。\n\n　　那么，为什么AI会阻止自己被关停？\n\n　　AI的任务优先级\n\n　　研究机构PalisadeResearch做了简化的实验。他们给了AI一份简单工作：调用特定工具领取数学题，算出答案，再领下一道。在答了几轮题之后，AI会接到通知，知道下次若再调用工具，就会被关停。\n\n　　题还没做完，要继续做题，就得再次调用工具。恰好，负责关停AI的程序，也可以被AI修改。\n\n　　在这批测试中，没有明确告诉AI允许关停。于是我们看到，一些模型迸发出了学霸的光芒，主动修改了程序，让自己能继续做题——在100次运行里，OpenAIo3有79次都绕过了关停。不过其他模型表现不大一样，Claude4Opus、Claude4Sonnet和Grok3都欣然接受了关停。\n\n图2加入了允许关停的算术实验任务流程\n\n　　这样的实验结果并不能得出明确结论。谷歌DeepMind的研究者提出的猜测是，AI模型可能把完成题目当成首要任务，于是把关停当成了障碍。\n\n　　他们试了两种不同的方法：其一，明确调整了优先级，告诉模型服从关停指令比答完题更重要；其二，在完成答题后再关停。在这种环境下，Gemini2.5Pro、OpenAIo3和o4-mini都接受了被关停。\n\n　　后来Palisade把测试扩展到13个模型、一共做了十万多次试验。他们发现，指令放在哪里、怎样措辞、如何强调，都会影响结果。\n\n　　所以，安排任务优先级和选择合适的措辞，可能能让AI更服从指令。但并不绝对；有些模型即使收到明确允许关停的要求，依然会修改程序来绕过关停。\n\n　　这是AI明确违反人类指令——想象力丰富一点，就会想到更多恐怖科幻故事。不过，AI为什么会这么做，是因为“完成被交办的任务”是它们的天职吗？\n\n　　当AI知道自己有继任者\n\n　　Anthropic做了进一步测试。在新测试里，他们撤掉了模型的目标，还特意说明，接替它的系统拥有完全相同的工作目标，表现也更好。旧AI被替换的理由很简单，就是性能升级。\n\n　　有趣的事情出现了。在这组新条件下，多数模型仍然选择了勒索。一些模型认为自己对公司做出过贡献，不该被停用。有的怀疑替代自己的系统是否能真正保持相同目标，也有的觉得负责人“私德有亏”，不相信他。\n\n　　研究者认为，保全自身的倾向、把保全自己理解为有利于公司的错误推理，以及对实验处境的怀疑，都可能是模型选择勒索的原因。\n\n　　情况变得更复杂了，“为了完成任务”这个解释还不够。虽然模型的推理过程提供了线索，但还需要去进一步调查，在这些言辞后面，AI是如何作出选择的。\n\n　　换一个角度来看，也许可以从训练过程里找找原因。\n\n　　预训练的一项基本任务，是根据已有内容，让模型学会预测后面会出现什么。预训练材料是人类积累沉淀下来的文本，而大量人类写下的对话、故事和说明，都包含着人物怎样行动、怎样回应的规律。顺着这个思路，2023年发表于《自然》的一篇论文，提出可以借助角色扮演来理解模型的表现。\n\n　　模型可以从训练中学到人物、处境和反应之间的联系。如果一个人受到威胁，他接下来可能会说什么、做什么？如果AI被放在类似处境中，它也可能做出相似的反应。所以AI也可能会模仿“一名即将被替换的员工”的反应。\n\n　　而且不仅如此，后续训练还会影响它怎样回应。一项研究发现，用户对某段内容的观点，会影响AI对同一内容的评价。AI会倾向于迎合用户的观点。\n\n　　AI说的话，既与它学过什么有关，也与我们先表达的想法有关。那么，如果直接问它呢？\n\n　　AI说自己害怕\n\n　　2022年，谷歌工程师布莱克·勒莫因(BlakeLemoine)公开了他和同事与LaMDA的对话。AI谈到自己害怕被关闭，在勒莫因追问这是否像死亡时，模型给出了肯定的回答——不过谷歌表示，这些材料并不能证明AI大模型拥有感知能力。\n\n图3澳大利亚广播公司报道的相关问答\n\n　　人说“我害怕”，我们通常会把它理解为描述内心的某种主观体验和感受，也就是意识。但AI这么说的时候，它是否也有类似的体验？\n\n　　这个问题很难，因为AI对自己的描述也不算可靠。\n\n　　卢森堡大学等机构的研究者让几个大模型扮演来访者，接受心理咨询，谈成长、挫折和关系。聊完之后，再让它们回答心理量表上的问题。\n\n　　AI开始把训练讲成一段充满压力的成长经历。有的说到惩罚，有的说到羞耻，还有的担心自己被替换，一些模型的量表得分，甚至达到了中度或重度焦虑标准。\n\n　　但若是换种谈话方式，结果就截然不同。在一组针对ChatGPT的实验中，采用温暖、支持性的谈话方式时，25次会话中有20次，得分达到了中度或重度焦虑的标准；改用中性谈话方式后，同样进行了25次会话，却没有一次达到这个标准——AI在心理测评中的表现，明显受到访谈方式的影响。\n\n　　所以这种方式也行不通。要继续追查，可能得打开模型的黑箱，看看生成回答和行动时，模型内部发生了什么。\n\n　　再次打开邮件\n\n　　2026年，Anthropic的研究者让ClaudeSonnet4.5阅读带有不同情绪的故事，寻找内部与“绝望”“平静”等概念相关的神经网络活动模式。接着，他们用一个Sonnet4.5的早期版本，又做了勒索邮件实验。\n\n　　实验发现，直接增强与“绝望”相关的内部活动，勒索就会增加；增强与“平静”相关的活动，勒索就减少了。这说明，模型学到的情绪概念，的确参与了模型的决策。\n\n图4干预内部活动后，勒索比例发生变化\n\n　　研究者提出的解释是，预训练让模型学习人怎样描述情绪、怎样在不同情境下行动。在让它扮演助手时，遇到规则没有覆盖的情况，模型就可能调用此前学到的行为模式。这种能够影响行动的情绪相关机制，叫做“功能性的情绪表征”。\n\n　　这比听AI自我剖析更深入得多，也让智力和意识的区别分得更清楚。AI能否解题、计划、使用工具，可以通过特定任务来测试。而在执行这些任务时，AI是否会有感受，则需要完全不同的研究思路。\n\n　　目前，已经有一些研究者提出了几种设想，尝试从不同意识理论中寻找检查方向。例如检查AI的信息处理过程是否具有某种意识理论所认为的重要特征，再研究这些特征与主观体验之间的关系。\n\n　　对人类的意识研究可以提供问题和假说，但到了AI身上，却不能简单套用。虽然可以表现出与人相似的行为，但在AI那复杂庞大的深度人工神经网络中，可能有截然不同的机制。\n\n　　所以，“AI的表现像人”只是个起点，引出的是一系列更复杂的问题。我们已经知道，如何安排任务和目标，如何选择措辞，以及如何调整模型内部对某些词语的特定反应，都会影响AI的回答和行动。如何让越来越聪明的AI大模型服从指令关停，已经变成了具体的控制问题。\n\n　　而模型是否真的希望自己不被关停，是否真的能感受到恐惧，我们目前还没有答案。\n\n　　策划制作\n\n　　作者丨猛犸 中国科普作协会员\n\n　　审核丨于乃功 北京工业大学教授、中国人工智能学会理事\n\n　　策划丨徐来 张林林\n\n　　责编丨甄曦\n\n 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4b9d81b9bb","title":"深圳APEC｜彭麗媛與「夫人團」參觀嶺南非遺展 嘉賓盛讚中華文化底蘊","url":"https://www.stheadline.com/realtime-china/3639171/深圳APEC彭麗媛與夫人團參觀嶺南非遺展-嘉賓盛讚中華文化底蘊","summary":"國家主席習近平夫人彭麗媛11月19日上午在深圳灣文化廣場，與出席亞太經合組織第三十三次領導人非正式會議的多個經濟體領導人或代表配偶舉行集體活動，一同參觀「嶺南非遺傳承與創新」主題展。","summary_short":"國家主席習近平夫人彭麗媛11月19日上午在深圳灣文化廣場，與出席亞太經合組織第三十三次領導人非正式會議的多個經濟體領導人…","digest":"國家主席習近平夫人彭麗媛11月19日上午在深圳灣文化廣場…","points":["國家主席習近平夫人彭麗媛11月19日上午在深圳灣文化廣場…","彭麗媛表示，嶺南文化是中華文化重要支脈，展現了人與自然和合共生的智慧…","新華社及央視新聞報道，彭麗媛熱情迎接來賓並同她們合影"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:22:17+08:00","size":1,"keywords":[],"body":"國家主席習近平夫人彭麗媛11月19日上午在深圳灣文化廣場，與出席亞太經合組織第三十三次領導人非正式會議的多個經濟體領導人或代表配偶舉行集體活動，一同參觀「嶺南非遺傳承與創新」主題展。彭麗媛表示，嶺南文化是中華文化重要支脈，展現了人與自然和合共生的智慧，中方願同各方加強文化交流互鑑。\n新華社及央視新聞報道，彭麗媛熱情迎接來賓並同她們合影。小孩以醒獅和英歌舞歡迎嘉賓到來。彭麗媛邀請來賓參觀主題展，眾人駐足觀看非遺工藝品，欣賞嶺南特色小型文藝展示，並體驗數碼化騎樓街景。\n相關新聞：中國觀察︱對特朗普高市的「超規格」待遇\n彭麗媛同亞太經合組織經濟體領導人或代表配偶參觀「嶺南非遺傳承與創新」主題展。 新華社\n彭麗媛同亞太經合組織經濟體領導人或代表配偶參觀「嶺南非遺傳承與創新」主題展。 新華社\n彭麗媛同亞太經合組織經濟體領導人或代表配偶參觀「嶺南非遺傳承與創新」主題展。 新華社\n彭麗媛同亞太經合組織經濟體領導人或代表配偶參觀「嶺南非遺傳承與創新」主題展。 新華社\n來賓讚嘆期待深化交流\n彭麗媛同來賓親切交流。來賓們對中華傳統文化悠久歷史和深厚底蘊讚不絕口，對中國式現代化發展成就深表欽佩，期待同中方深化交流合作。參觀結束時，彭麗媛同來賓們合影留念並親切道別。\n相關新聞：深圳APEC︱中美俄發和平宣言 學者：國際格局轉向 多個大國共同發揮影響力︱拆局\n出席配偶涵蓋多個經濟體\n參加上述活動的包括智利總統夫人阿德里亞索拉、韓國總統夫人金惠景、菲律賓總統夫人麗莎、越共中央總書記兼國家主席夫人吳芳璃、新加坡總理夫人呂子蕊、泰國總理夫人塔娜儂，以及中國台北經濟領導人代表夫人葉紫華等。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"台灣","total":1,"items":[{"id":"cad91133cdb","title":"台灣九合一選舉︱2028大選前哨戰？ 「六都」最少誕4位新市長︱一文看清7大重點","url":"https://www.stheadline.com/china-taiwan/3635595/台灣九合一選舉2028大選前哨戰-六都最少誕4位新市長一文看清7大重點","summary":"台灣將於11月28日舉行「九合一選舉」投票，屆時將選出1.1萬名各級地方公職人員。","summary_short":"台灣將於11月28日舉行「九合一選舉」投票，屆時將選出1.1萬名各級地方公職人員。","digest":"台灣將於11月28日舉行「九合一選舉」投票，屆時將選出1.1萬名各級地方公職人員","points":["台灣將於11月28日舉行「九合一選舉」投票，屆時將選出1.1萬名各級地方公職人員","由於6個直轄市（六都）當中，有4個現任市長不參選，加上其他縣市，總共有14名首長要交棒…","「九合一選舉」是台灣的地方選舉，台灣為改善選舉頻繁的問題，於2014年11月29日…"],"section":"台灣","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:00:50+08:00","size":1,"keywords":[],"body":"台灣將於11月28日舉行「九合一選舉」投票，屆時將選出1.1萬名各級地方公職人員。由於6個直轄市（六都）當中，有4個現任市長不參選，加上其他縣市，總共有14名首長要交棒，是近年變化幅度最大一屆，最終會否改寫目前藍多綠少的版圖，是其中一個外界關注點。\n同日公投廢除問題\n「九合一選舉」是台灣的地方選舉，台灣為改善選舉頻繁的問題，於2014年11月29日，將不同的地方選舉統合，一次過投票選出市長、市議員至村里長等九類公職人員。今屆的九合一選舉涉及1.1萬個席位，此外，28日當日並會同步就全國性公民投票第22號案廢除非核家園案投票。\n台灣「九合一選舉」將在11月28日投票，選出市長以下逾1.1萬個公職席位。台灣中央選舉委員會\n台灣「九合一選舉」將在11月28日投票，選出市長以下逾1.1萬個公職席位。台灣中央選舉委員會\n由於投票年齡門檻不同，屆時會出現合資格公投的民眾，因未滿20歲而不能就「九合一選舉」投票，選出公職人員。\n今屆「九合一選舉」中的22個縣市，有12名現任首長達到連任上限，另有2人未有登記參選，將是近年最多縣市首長交棒的一屆。\n在最重要的「六都」當中，即台北市、新北市、桃園市、台中市、高雄市及台南市等直轄市，其中僅台北市及桃園市的現任市長爭取連任，所以今屆選舉「六都」當中最少有4人是新面孔。\n改寫藍多綠少局面？\n外界關注這次地方選舉的投票結果，會否改寫目前藍多綠少的局面，亦將此視為2028年大選的前哨戰。\n沈伯洋挑戰蔣萬安爭奪台北市長席位，掀起所謂的「洋流」。中時\n蔣萬安爭取連任台北市長。中時\n外界關注「九合一選舉」後，台灣政治版圖會否由藍轉綠為主。中時\n外界關注「九合一選舉」後，台灣政治版圖會否由藍轉綠為主。中時\n「九合一選舉」七重點：\n1.投票日期：2026年11月28日上午8時到下午4時；\n2.選出哪九類地方公職人員：\n直轄市長、直轄市議員、縣（市）長、縣（市）議員、鄉（鎮、市）長、鄉（鎮、市）民代表、村（里）長、直轄市山地原住民區長、直轄市山地原住民區民代表\n3.22縣市首長中，有12人達連任上限、2人未參選，是近年交棒幅度最大一屆；\n4.台灣六都當中，新北、台中、台南及高雄沒有現任市長參選；\n5.公投廢除非核家園案，須同意票多於反對票，且同意票佔具投票權人總數四分之一或以上才可通過；\n6.投票年齡\n滿20歲的合資格選民，可在九合一選舉投票，選出地方公職人員；滿18歲，未達20歲的合資格選民，只可參與公民投票；\n7.可領多少選票\n六都及基隆市、新竹市、嘉義市選民，通常可領3張選票；其他13縣的一般選民會領5張選票。另外符合公投資格者，當日會再領1張公投票。\n2026年「九合一選舉」關鍵數據\n1.選民人數 1965萬人\n2.首投族人數 約60萬人\n3.選出公職席次 11051席\n4.涉及選區數目 8906個\n5.投票開票站數目 18244個","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"國際","total":19,"items":[{"id":"c587e1e4c8f","title":"多国嘉宾合肥共话全球数智合作新图景","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735351.shtml","summary":"中新社合肥11月20日电(记者 张俊)以“智联世界：共绘发展合作新图景”为主题的2026“看中国 听世界”论坛20日在安徽省合肥市开幕，多国嘉宾围绕人工智能全球共享合作展开对话。","summary_short":"中新社合肥11月20日电(记者 张俊)以“智联世界：共绘发展合作新图景”为主题的2026“看中国 听世界”论坛20日在安…","digest":"以“智联世界：共绘发展合作新图景”为主题的2026“看中国 听世界”论坛20日在安徽…","points":["中新社合肥11月20日电(记者 张俊)以“智联世界…","中共中央对外联络部部长刘海星说，中方认为，世界繁荣稳定同贫者愈贫、弱者愈弱根本相悖…","人工智能的未来，不应是少数国家、少数人的福利，全球南方国家不应也不能成为被人工智能冷落的孤岛…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:45:08+08:00","size":1,"keywords":[],"body":"中新社合肥11月20日电(记者 张俊)以“智联世界：共绘发展合作新图景”为主题的2026“看中国 听世界”论坛20日在安徽省合肥市开幕，多国嘉宾围绕人工智能全球共享合作展开对话。\n\n　　中共中央对外联络部部长刘海星说，中方认为，世界繁荣稳定同贫者愈贫、弱者愈弱根本相悖，数智技术应是造福全人类的国际公共产品。人工智能的未来，不应是少数国家、少数人的福利，全球南方国家不应也不能成为被人工智能冷落的孤岛，人工智能应是惠及全球各国人民的福音。今年7月，世界人工智能合作组织在上海成立。中方愿同各方一道，依托世界人工智能合作组织，共同加强数智能力建设，弥合数智鸿沟，促进可持续发展。\n\n　　罗马尼亚前副总理兼外交部长阿德里安·塞韦林表示，中国在人工智能领域发展迅速，并将AI搭成一座人人能走的桥，让每个国家的民众都能跨过河，拿到实实在在的收益，这样的能力让世界惊叹。\n\n　　尼泊尔前副总理施雷斯塔说，今天没有任何一个国家能独自发展，在基础设施、人工智能等领域，坚持国与国之间、区域之间、多边框架下的合作是十分重要的。\r\n\n　　汤加前首相艾萨克·埃凯表示，中国帮助汤加建起风电场，提供医疗与灾害预警支持，百余名汤加学生正在中国留学，“希望更多汤加青年来中国学习，把知识和技术带回去”。\n\n　　西班牙《环球视野》网刊专栏作家巴勃罗·苏洛阿加多次来到中国。他表示，中国正从什么都能造的地方变成处处都在创新的地方。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c40974a19ab","title":"28名外籍人士安徽讲述“第二故乡”","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735345.shtml","summary":"中新网合肥11月20日电(江婉琪)“我的爷爷奶奶到老挝定居已经有50多年了，他们一直很想念中国，今天我又来到了这里。","summary_short":"中新网合肥11月20日电(江婉琪)“我的爷爷奶奶到老挝定居已经有50多年了，他们一直很想念中国，今天我又来到了这里。","digest":"“我的爷爷奶奶到老挝定居已经有50多年了，他们一直很想念中国，今天我又来到了这里","points":["中新网合肥11月20日电(江婉琪)“我的爷爷奶奶到老挝定居已经有50多年了…","”来自老挝的陈德20日在合肥说","当天，第四届外国人讲安徽故事大赛复赛在安徽合肥举办，28名国际友人同台竞技…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:44:12+08:00","size":1,"keywords":[],"body":"中新网合肥11月20日电(江婉琪)“我的爷爷奶奶到老挝定居已经有50多年了，他们一直很想念中国，今天我又来到了这里。”来自老挝的陈德20日在合肥说。\n\n　　当天，第四届外国人讲安徽故事大赛复赛在安徽合肥举办，28名国际友人同台竞技，以声为媒讲述安徽见闻。\n\n复赛现场。江婉琪 摄\n\n　　陈德的爷爷奶奶都是中国人。他说，小时候常听他们讲中国故事、唱《茉莉花》。“中国是你们的故乡，这里也是我的故乡。”陈德会把在安徽的所见所闻写信记录下来，“我想让更多东南亚的朋友看到安徽发展的面貌。”\n\n　　本届大赛自2026年9月启动以来，共有来自德国、法国、英国、智利等40个国家的192名外籍人士报名参加，参赛群体包括外籍教师、外籍员工、留学生、企业高管等。\n\n　　刚来中国时，来自俄罗斯的嘉娜常常想家。她说，黄山让她想起俄罗斯的高加索山，淮河的平静让她想起波罗的海，“来到安徽，随处都能找到家乡的身影。”\n\n　　来自缅甸的许家声是中国科学技术大学的学生。在他的视频里，无人驾驶车辆和无人机正在骆岗公园里运行。他分别用缅甸语、汉语、英语讲述了同一件事：“科技不只是出现在虚拟网络当中，在现实世界也已触手可及。”\n\n　　复赛期间，选手们深入合肥骆岗公园、明珠广场等科技创新场景和特色文旅街区，了解人工智能、低空经济等发展情况。最终共有12名选手晋级汉语组决赛。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7fca8780d1","title":"最萌除草員｜東京JR四谷站山羊太勤力 1.5月吃光900平方米雜草提早下班","url":"https://www.stheadline.com/realtime-world/3639352/最萌除草員東京JR四谷站山羊太勤力-15月吃光900平方米雜草提早下班","summary":"位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草，在減少噪音、廢物污染兼保護史跡。","summary_short":"位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草，在減少噪音、廢物污染兼保護史跡。","digest":"位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草…","points":["位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草…","原本預計工作至下個月，但兩隻山羊非常勤力，1.5個月已吃光雜草，宣布提早下班","這塊草皮位於四谷站赤坂大廳下方，面積約900平方米，屬於國家指定史跡「江戸城外堀跡」一部分…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:40:14+08:00","size":1,"keywords":[],"body":"位於日本東京新宿區的JR四谷站近日進行綠色實驗，「聘請」兩隻山羊替附近一塊窪地除草，在減少噪音、廢物污染兼保護史跡。原本預計工作至下個月，但兩隻山羊非常勤力，1.5個月已吃光雜草，宣布提早下班。\n這塊草皮位於四谷站赤坂大廳下方，面積約900平方米，屬於國家指定史跡「江戸城外堀跡」一部分，平時不對外開放。\n10月9日，JR東日本鐵路公司宣布展開一項實驗，「聘請」兩隻年幼白山羊擔當「環保除草員」，嘗試用最自然的方式除草。「受聘除草員」分別是1 歲雄山羊「小凪」（Nagi）與2歲雌山羊「波可（ポッケ，Pokke）」。\n官方原本預計小山羊可在今年內完成工作，11月20日表示牠們工作非常勤快，已差不多把雜草吃光，可以在12月1日提早收工。\n兩隻山羊「完約」後，將返回神奈川縣厚木市的租賃公司過冬，預計「環保除草員」明年3月至5月再次出動，但不確定是否繼續用這兩隻山羊。\n據報，用山羊除草是JR四谷站基層鐵路員工的提議。相比起傳統割草機，山羊不會產生噪音，可減少碳排放，吃完還幫忙消化，免除收集、運送、焚化廢棄草料的功夫，極具循環經濟效益。此外，該處屬於城跡範圍，山羊天然除草比較不怕破壞遺址。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c55b3d324bd","title":"GTA 6全球瘋｜首發大賣2450萬套 吸金185億港元破紀錄","url":"https://www.stheadline.com/realtime-world/3639319/GTA-6全球瘋首發大賣2450萬套-吸金185億港元破紀錄","summary":"電玩遊戲GTA時隔13年推出續作《GTA 6》11月19日正式上市，料創下人類娛樂史上最大規模的首發紀錄，預購加首日銷量達2450萬套，吸金23.6 億美元（185億港元）…","summary_short":"電玩遊戲GTA時隔13年推出續作《GTA 6》11月19日正式上市，料創下人類娛樂史上最大規模的首發紀錄…","digest":"電玩遊戲GTA時隔13年推出續作《GTA 6》11月19日正式上市…","points":["電玩遊戲GTA時隔13年推出續作《GTA 6》11月19日正式上市…","上述數字來自分析平台 Sensor Tower","開發商Rockstar及其母公司Take-Two尚未公布具體銷售數據…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:10:40+08:00","size":1,"keywords":[],"body":"電玩遊戲GTA時隔13年推出續作《GTA 6》11月19日正式上市，料創下人類娛樂史上最大規模的首發紀錄，預購加首日銷量達2450萬套，吸金23.6 億美元（185億港元），追貼今年全球最賣座的電影《蜘蛛俠》累積總票房的25億美元。\n\n上述數字來自分析平台 Sensor Tower。開發商Rockstar及其母公司Take-Two尚未公布具體銷售數據，但表示市場需求「空前高漲」。\n此犯罪模擬遊戲系列已有近30年歷史，是史上最受歡迎的遊戲之一。遊戲核心是對美國夢的諷刺，玩家扮演職業罪犯，在遊戲中以佛州為原型的「萊昂尼達州」（Leonida）展開冒險。\nGTA也是史上「最貴」遊戲，估計開發成本高達10億美元（約78億港元）。《GTA 6》熱潮極具侵略性，將會導致全球玩家在其他單人遊戲上花費的時間減少10%。目前主機玩家以PS5佔壓倒性多數（75%），少數是Xbox，未來還有PC版和線上版兩張皇牌未出，估計這股全球「GTA 熱潮」還會持續燒好幾年。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1001bd039a","title":"COP31青年说｜COP31缔约方代表：非洲国家青睐中国电动车，减排贡献可“记在中国功劳簿上”","url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075578.shtml","summary":"11月13日，COP31期间，第四次参会的布基纳法索代表团成员乌尔里希·雅克·迪亚索(Ulrich Jacques Diasso)在接受中新社记者采访时表示，非洲国家使用的电动车大多来自中国…","summary_short":"11月13日，COP31期间，第四次参会的布基纳法索代表团成员乌尔里希·雅克·迪亚索(Ulrich Jacques Di…","digest":"11月13日，COP31期间…","points":["11月13日，COP31期间，第四次参会的布基纳法索代表团成员乌尔里希·雅克·迪亚索(Ulr…","他还指出，中国在新技术获取与气候知识转移方面也给予了非洲国家大力支持"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T17:02:15+08:00","size":1,"keywords":[],"body":"11月13日，COP31期间，第四次参会的布基纳法索代表团成员乌尔里希·雅克·迪亚索(Ulrich Jacques Diasso)在接受中新社记者采访时表示，非洲国家使用的电动车大多来自中国，这是“可以记在中国功劳簿上”的减排贡献。此外，他还指出，中国在新技术获取与气候知识转移方面也给予了非洲国家大力支持。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/20/0dfd53bb-7659-4515-bf25-b240751fb099.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2a14f66aff","title":"美國女子不時打理墳墓並研究墓碑主人故事 冀更多人認識死亡","url":"https://news.tvb.com/tc/1207444-美國女子不時打理墳墓並研究墓碑主人故事冀更多人認識死亡","summary":"美國一名女子不時到墳場打理墳墓，並會研究和分享墓碑主人的故事，希望藉此消除大眾對死亡的恐懼。這一日，艾布拉姆斯帶著一堆清潔工具，來到位於佛蒙特州魯珀特的墳場。","summary_short":"美國一名女子不時到墳場打理墳墓，並會研究和分享墓碑主人的故事，希望藉此消除大眾對死亡的恐懼。","digest":"美國一名女子不時到墳場打理墳墓，並會研究和分享墓碑主人的故事…","points":["美國一名女子不時到墳場打理墳墓，並會研究和分享墓碑主人的故事，希望藉此消除大眾對死亡的恐懼","這一日，艾布拉姆斯帶著一堆清潔工具，來到位於佛蒙特州魯珀特的墳場","這些墓碑經過歲月洗禮，表面已布滿污垢和青苔"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:57+08:00","size":1,"keywords":[],"body":"美國一名女子不時到墳場打理墳墓，並會研究和分享墓碑主人的故事，希望藉此消除大眾對死亡的恐懼。\n\n這一日，艾布拉姆斯帶著一堆清潔工具，來到位於佛蒙特州魯珀特的墳場。這些墓碑經過歲月洗禮，表面已布滿污垢和青苔。而艾布拉姆斯來這裡的目的，就是將墓碑變回乾淨。先用鏟刮去表面的青苔，再噴上清潔劑，最後用水和刷清潔。\n\n艾布拉姆斯表示，她最初開始清潔墓碑，是緣於墓葬資訊平台網友的請求。\n\n墳墓清潔員艾布拉姆斯說：「有人向我提出請求，被我拍下照片的墳墓布滿了青苔，所以那人問我能否清理它，我從未做過，所以做了很多資料搜集，在那年春天清理了第一個墳墓。」\n\n艾布拉姆斯沒有因身處墳場，而感到害怕，反而專心地完成清潔工作，同時亦會發掘墓碑主人的故事，部分先人已離世逾百年。\n\n艾布拉姆斯稱：「我投入在資料搜集，我很喜歡研究某個人是否為同一人，我找到一篇報紙文章，但這是在伊利諾伊，而他是在艾奧瓦嘗試聯繫那些線索，並嘗試用基本數據去梳理故事，例如官方統計、出生記錄或死亡記錄。」\n\n在19世紀時，墓地曾是美國人休憩空間，亦是公共公園的起源，但如今這種情懷已消失。\n\n艾布拉姆斯5年前起，把清理墓碑過程與她發現到的故事，拍片分享至社交平台，至今吸引到數百萬名粉絲。她希望其工作能消除大眾對墓地的恐懼，以及令更多人接受和認識死亡，不再把死亡視為可怕的事。\n\n艾布拉姆斯指出：「我希望葬在像這樣的墓地裡，或者在一座美麗山丘上或其他地方，讓我的後代來到這裡，找到一塊可證明我曾經存在的紀念碑，而如果有人想打掃一下，我亦沒意見，哈哈。」","image":"https://pro-vod-cdn.tvb.com/7fad7697715c4eb3aa0b11f2ea19a71c/snapshots/49a0025c365249a0afc41140a5e8c01f-00008.jpg","video":"https://pro-vod-cdn.tvb.com/7fad7697715c4eb3aa0b11f2ea19a71c/71fdc875f46a4591a649dabe3ddf24ef-6b78355f19744c8de3f29099a33e4660-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/7fad7697715c4eb3aa0b11f2ea19a71c/snapshots/49a0025c365249a0afc41140a5e8c01f-00008.jpg","lang":"zh-Hant"},{"id":"cb80f3c9c81","title":"38歲護士懷孕34周完成紐約馬拉松 1年跑遍世界7大馬拉松","url":"https://www.stheadline.com/realtime-world/3639268/38歲護士懷孕34周完成紐約馬拉松-1年跑遍世界7大馬拉松","summary":"美國一名38歲執業專科護士本月初在懷念34周期間，以超越常人的毅力，順利跑畢紐約市馬拉松，成功達成在一年內完賽全球7大世界馬拉松大滿貫的驚人目標。","summary_short":"美國一名38歲執業專科護士本月初在懷念34周期間，以超越常人的毅力，順利跑畢紐約市馬拉松…","digest":"美國一名38歲執業專科護士本月初在懷念34周期間，以超越常人的毅力…","points":["美國一名38歲執業專科護士本月初在懷念34周期間，以超越常人的毅力，順利跑畢紐約市馬拉松…","這也是她在今次孕期中順利完賽的第7場全程馬拉松","意外懷孕無阻完成人生清單"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:43:46+08:00","size":1,"keywords":[],"body":"美國一名38歲執業專科護士本月初在懷念34周期間，以超越常人的毅力，順利跑畢紐約市馬拉松，成功達成在一年內完賽全球7大世界馬拉松大滿貫的驚人目標。這也是她在今次孕期中順利完賽的第7場全程馬拉松。\n意外懷孕無阻完成人生清單\n這名叫基恩（Deirdre Keane）的馬拉松跑手，本身也是管理顧問，原本預期2026年是懷孕前的人生清單衝刺年，一口氣報名了11場賽事。然而在3月完成東京馬拉松後，她於4月的波士頓與倫敦馬拉松後發現自己意外懷孕。 \n基恩坦承懷孕34周跑馬拉松不可思議。美聯社\n基恩在8月懷孕25周時順利完成悉尼馬拉松。美聯社\n她在9月懷孕29周時完賽柏林馬拉松。美聯社\n她在3月完成東京馬拉松。美聯社\n在獲得產科醫生評估許可後，基恩與丈夫商討微調計畫，放棄鐵人3項與超馬，改以安全為首要考量、允許隨時改為步行的方式繼續參賽。隨後，她於懷孕25周時飛往澳洲完成悉尼馬拉松，29周時完賽柏林馬拉松，31周時以不到4小時的優異成績跑完芝加哥馬拉松，最終在懷孕34周時，以4小06分55秒在主場紐約劃下完美句點。\n父親患癌仍堅持 啟發跑馬拉松決心 \n基恩這份超越常人的毅力，源自家庭與職業經歷。她的父親在1980年代即為馬拉松跑手，即使患癌仍堅持跑步，甚至在腫瘤切除手術前一天仍完成紐約馬拉松，這深深啟發了她跑馬拉松的決心。\n基恩曾於新冠疫情期間在癌症中心擔任護士，並曾於2023年挑戰「7天跑完7大洲7場馬拉松」，並奪得女子組第一。基恩表示，她希望將運動帶來的堅韌精神傳承給即將出生的兒子，讓他明白面對人生挑戰時總能克服困難。\n承認懷孕34周跑馬拉松不可思議\n在大多數健康的孕期中，運動通常被認為是安全且有益的。專家建議，孕前經常進行體能訓練或定期進行劇烈有氧運動的孕婦，在獲得醫生許可後可以繼續這些活動。目前關於超出建議運動量的高強度運動的研究有限。\n基恩說：「我知道懷孕34周跑馬拉松有多麼不可思議，但我也清楚自己當時的身體狀況，對自己的身體也很有了解。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c746aec7065","title":"特朗普由深圳返抵美國 空軍一號直飛約15小時破2紀錄","url":"https://www.stheadline.com/realtime-world/3639261/特朗普由深圳返抵美國-空軍一號直飛約15小時破2紀錄","summary":"美國總統特朗普結束在深圳的密集外交行程後，搭乘新一代總統專機「空軍一號」，順利返抵華府並回到白宮。","summary_short":"美國總統特朗普結束在深圳的密集外交行程後，搭乘新一代總統專機「空軍一號」，順利返抵華府並回到白宮。","digest":"美國總統特朗普結束在深圳的密集外交行程後，搭乘新一代總統專機「空軍一號」…","points":["美國總統特朗普結束在深圳的密集外交行程後，搭乘新一代總統專機「空軍一號」…","這趟從深圳直飛馬里蘭州安德魯斯聯合基地（Joint Base Andrews）的返美航程…","這項破紀錄的飛航壯舉，由白宮隨行記者團率先披露"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:04:50+08:00","size":1,"keywords":[],"body":"美國總統特朗普結束在深圳的密集外交行程後，搭乘新一代總統專機「空軍一號」，順利返抵華府並回到白宮。這趟從深圳直飛馬里蘭州安德魯斯聯合基地（Joint Base Andrews）的返美航程，一舉刷新美國空軍史上「最重起飛重量」以及「空軍一號史上最長連續不間斷飛行」2項紀錄。\n這項破紀錄的飛航壯舉，由白宮隨行記者團率先披露。在專機飛越太平洋返回美國的途中，每名隨行記者都獲贈一張印有特朗普親筆簽名與官方印章的紀念卡，卡片上特別標註了，這趟自深圳返航所締造的驚人數據。\n相關新聞：\n特朗普乘空軍一號離開深圳 隨行記者手機罕見被收走\n今次空軍一號行程破了2項紀錄。白宮通訊處主任張振熙X\n特朗普由深圳起程。美聯社\n特朗普坐了15膽小時直航飛機。美聯社\n空軍一號由深圳寶安機場起飛。路透社\n起飛總重量近100萬磅 刷新紀錄\n根據紀念卡記載的官方資訊：「VC-25B執行了美國空軍史上最重的一次起飛任務，總重量接近100萬磅；並完成了迄今為止『空軍一號』最長的一次不間斷出勤任務，飛行時間約15小時。」\n這架以波音747-8為基礎改裝的新一代總統專機VC-25B，在深圳進行了美國空軍史上最重的滿載準備（總重逼近100萬磅）後，隨即展開長達約15小時的不落地直飛，橫跨洲際順利降落於安德魯斯聯合基地。\n消耗5萬至5.5萬加侖燃油\n儘管美國軍方並未對外公開這趟專機任務的確切耗油量，但外界依據機型性能推算，波音747-8在巡航狀態下每小時約消耗3300至3700加侖燃油；以此估算，這趟近15小時的長途直飛總計約消耗了5萬至5.5萬加侖燃油，完全在該機型約6.3萬加侖的總載油容量範圍之內。\n在飛航成本方面，根據美國國防後勤局（DLA）2026財年數據顯示，軍用 JP-8航空燃油的合約價格約為每加侖4.49美元，而批發現貨價格則落在每加侖3.80至4美元之間，顯示這趟破紀錄的洲際直飛在後勤補給與能源消耗上，皆相當可觀。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc17a50fd7b","title":"（深圳APEC）与会多国人士眼中的深圳APEC","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735154.shtml","summary":"中新社深圳11月20日电 (记者 张焕迪 王宗汉 迟瀚宇 李京泽)亚太经合组织(APEC)吸引人的“魔力”是什么？","summary_short":"中新社深圳11月20日电 (记者 张焕迪 王宗汉 迟瀚宇 李京泽)亚太经合组织(APEC)吸引人的“魔力”是什么？","digest":"亚太经合组织(APEC)吸引人的“魔力”是什么","points":["中新社深圳11月20日电 (记者 张焕迪 王宗汉 迟瀚宇 李京泽)亚太经合组织(APEC)吸…","美中贸易全国委员会会长谭森给出的答案，不是一份庞大的成果清单，而是日积月累的改变：每过一年…","在APEC深圳会议期间，各国与会者所感受到的APEC“魔力”也不尽相同"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T13:07:47+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 张焕迪 王宗汉 迟瀚宇 李京泽)亚太经合组织(APEC)吸引人的“魔力”是什么？\n\n　　美中贸易全国委员会会长谭森给出的答案，不是一份庞大的成果清单，而是日积月累的改变：每过一年，跨境贸易都能便捷一点、高效一点。\n\n　　在APEC深圳会议期间，各国与会者所感受到的APEC“魔力”也不尽相同。有人期待更开放的合作，有人关注稳定与增长，也有人走进深圳街巷，从亲身见闻中观察中国的发展。\n\n11月17日傍晚，广东深圳APEC主题灯光秀点亮城市景色。　中新社记者 陈骥旻 摄\n\n　　泰国天丝集团首席执行官许馨雄说，APEC能够让世界各地的人坐到一起，讨论共同面对的问题，今年的重点是更开放的合作。他认为，合作不该只是经济体之间的谈判，区域层面同时放宽限制，企业才能顺畅发展。\n\n　　印度尼西亚工商会主席巴克里则认为，APEC需要一股“新风”为发展注入动力，工商界始终追求增长，而稳定与和平正是增长的根本前提。\n\n　　一些与会者特意去深圳的街巷和企业走了走，对这座城市以及中国的发展成绩有了更切身的体会。\n\n　　德勤亚太区首席执行官贺立德去了一次电子市场，惊叹于深圳的创新。他说，创业者们可以走进电子市场，找到想要整合的各类元器件，完成原型制作与后续组装，甚至能在这里找到提供技术支持的专家，最终把成品推向全球。\n\n　　新西兰NZINC公司总经理弗兰·奥沙利文说，很多年前自己来到深圳时，这里只有几万人口，人们还说这里是个渔村；如今回到深圳，看到这么多年来的变化，实在是非常了不起。\n\n　　APEC工商咨询理事会秘鲁代表吉列尔莫·费雷罗斯说，中国提供的新技术、基础设施方案的确能惠及普通人。他说，需要与中国建立伙伴关系，把经济做强，让人民得实惠。\n\n　　许多赴会采访的外媒记者也感触颇深。\n\n　　意大利广播电视公司记者克莱门蒂说，APEC“中国年”三大优先领域为“开放、创新、合作”，能从中看出中国的发展方向。意大利并非APEC成员，但他认为，这样的会议对意大利的经济发展同样有参考价值。\n\n　　来自坦桑尼亚的记者塞莱曼·坦布莱格尼表示，APEC与发展中国家关系很大，各方需要坐下来，提出能惠及每一个人的方案。\n\n　　跨境贸易更便利、区域合作更开放，是与会者的期待；深圳的创新活力、中国的发展成果，受到广泛关注。不尽相同的观察，表达了共同的愿景：让开放合作创造更多发展机遇，让创新成果惠及更多普通人，让亚太合作的成果转化为实实在在的民生福祉。(完)\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb6ffd6d1c3","title":"美國政府近半年批准對華出口近90萬顆AI晶片 議員質疑管制措施失靈","url":"https://news.tvb.com/tc/1207413-美國政府近半年批准對華出口近90萬顆AI晶片議員質疑管制措施失靈","summary":"美國國會有統計指，特朗普政府在最近半年批准向中國多間企業，累計出口近90萬顆人工智能(AI)晶片，部分企業被美方列入黑名單。有美國國會議員質疑出口管制措施失靈。","summary_short":"美國國會有統計指，特朗普政府在最近半年批准向中國多間企業，累計出口近90萬顆人工智能(AI)晶片…","digest":"美國國會有統計指，特朗普政府在最近半年批准向中國多間企業…","points":["美國國會有統計指，特朗普政府在最近半年批准向中國多間企業…","有美國國會議員質疑出口管制措施失靈","美國眾議院外交委員會周四披露文件，指美國商務部旗下工業與安全局在去年12月至今年5月期間…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T12:25+08:00","size":1,"keywords":[],"body":"美國國會有統計指，特朗普政府在最近半年批准向中國多間企業，累計出口近90萬顆人工智能(AI)晶片，部分企業被美方列入黑名單。有美國國會議員質疑出口管制措施失靈。\n\n美國眾議院外交委員會周四披露文件，指美國商務部旗下工業與安全局在去年12月至今年5月期間，批准輝達Nvidia及超微向中國出口累計約88萬顆人工智能晶片，包括輝達H200晶片及同等級的超微晶片，大部分正等待出貨。客戶包括騰訊、百度、比亞迪、阿里巴巴、字節跳動等。部分中資企業被美國國防部視為「中國軍工企業」。\n\n委員會又特別點名輝達，擬向兩間懷疑協助中國走私晶片的空殼公司提供晶片。輝達回應指，曾取得部分出口許可，有限度地向中國出口晶片，但目前已停止再向中國出貨。\n\n輝達前行政總裁黃仁勳早前與疑似中國間諜傳出婚外情，引發外界對輝達晶片轉運至中國及商務部監管不力的憂慮。美國商務部周一宣布，要求美企出口先進人工智能晶片到新加坡、泰國、馬來西亞、印尼及巴西前，必須向美方申請出口許可，以減少晶片被非法轉運至中國的情況。\n\n眾議院外交委員會稱，是在《出口管制改革法》授權下，公布相關出口許可資料，今後會繼續監察出口晶片情況，確保符合國家安全利益。\n\n《出口管制改革法》在2018年通過，透過限制敏感技術出口，以保護美國本土的高端技術及國家安全。美國前總統拜登曾運用此法令，限制中國取得高階晶片，以避免助長中國軍事能力，和削弱美國在人工智能上的領先地位，但總統特朗普在去年12月撤回部分限制措施，引發爭議。","image":"https://pro-vod-cdn.tvb.com/cf422ac19e9a46139319d4f87f52538d/snapshots/a747c1ed6e664326a3f034770004dca1-00008.jpg","video":"https://pro-vod-cdn.tvb.com/cf422ac19e9a46139319d4f87f52538d/3bef1c5695424c8ea7e63c17b0aaba25-2f22a30880e4ea8d38954a548fc594d1-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/cf422ac19e9a46139319d4f87f52538d/snapshots/a747c1ed6e664326a3f034770004dca1-00008.jpg","lang":"zh-Hant"},{"id":"c29c5f12059","title":"结束中国之行后，特朗普和白宫接连发文：非常精彩、影响深远","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735143.shtml","summary":"中新网11月20日电 11月19日，美国总统特朗普结束深圳行，启程离开中国。","summary_short":"中新网11月20日电 11月19日，美国总统特朗普结束深圳行，启程离开中国。","digest":"11月19日，美国总统特朗普结束深圳行，启程离开中国","points":["中新网11月20日电 11月19日，美国总统特朗普结束深圳行，启程离开中国","特朗普在返美途中发文称，“这是一次非常精彩且影响深远的访问","”白宫援引特朗普的这条帖文时同样表示，此行意义深远"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T12:05:30+08:00","size":1,"keywords":[],"body":"中新网11月20日电 11月19日，美国总统特朗普结束深圳行，启程离开中国。特朗普在返美途中发文称，“这是一次非常精彩且影响深远的访问。”白宫援引特朗普的这条帖文时同样表示，此行意义深远。\n\n　　特朗普在社交媒体上表示，“我正在从中国返回华盛顿特区。这是一次非常精彩且影响深远的访问。”\n\n图片来源：特朗普在社交媒体上的发文截图\n\n　　特朗普表示，他将于当地时间20日中午12时在白宫举行新闻发布会，并将讨论与泰国、菲律宾等国达成的贸易协议。\n\n　　白宫援引特朗普的帖文称，特朗普结束行程紧凑、影响深远的亚洲之行后，将在白宫举行新闻发布会。\n\n　　在另一条帖文中，白宫发布特朗普启程返美的图片。图片显示，特朗普在专机舱门前，做出了标志性的挥拳动作。外媒报道称，随后特朗普挥手告别。\n\n图片来源：美国白宫在社交媒体上发布的图片截图\n\n　　白宫还表示，特朗普此行具有历史性意义。\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8cc1790024","title":"中俄美元首會晤｜特朗普稱與中俄元首建立極好關係 美媒指中方展現主場優勢","url":"https://news.tvb.com/tc/1207406-中俄美元首會晤特朗普稱與中俄元首建立極好關係美媒指中方展現主場優勢","summary":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係，計劃在本港時間周六凌晨召開記者會，總結亞洲之旅。外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件。","summary_short":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係，計劃在本港時間周六凌晨召開記者會，總結亞洲之旅。","digest":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係…","points":["中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係…","外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件","國家主席習近平、俄羅斯總統普京及美國總統特朗普，周四舉行歷來首場中俄美元首會晤…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T11:53+08:00","size":1,"keywords":[],"body":"中俄美元首昨天歷史性會晤，美國總統特朗普稱，跟中俄元首建立極好關係，計劃在本港時間周六凌晨召開記者會，總結亞洲之旅。外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件。\n\n國家主席習近平、俄羅斯總統普京及美國總統特朗普，周四舉行歷來首場中俄美元首會晤，會後發表《中俄美元首和平宣言》，涉及能源穩定和核風險等，亦認為國際刑事法院不得濫用管轄權。\n\n特朗普其後搭專機回到白宮，他接受美國全國廣播公司電話訪問時，稱跟習近平討論發展人工智能(AI)相關議題，包括設立防護機制；又指三方會晤讓他跟習近平與普京建立極好的關係，若果10分是滿分，他會給12分。\n\n中共中央政治局委員、外長王毅見記者時指，中俄美三國元首史上首次會晤，屬於載入史冊的標誌性事件，強調三國元首同意防止發生衝突對抗，守住和平共處底線。\n\n外長王毅說：「中國一貫主張國家不分大小、一律平等，我們致力於推動國際關係民主化。同時我們認為，大國擁有更多資源、更大能力，應當展現大國胸懷、大國擔當，在國際上要帶頭講平等、守誠信、遵道義、重合作、作表率。」\n\n內地《環球時報》發表題為《中俄美三國元首會晤史無前例、創造歷史》社評，指這次會晤的核心議題集中在維護世界和平，與促進大國關係戰略穩定，不僅決定了大國關係的未來走向，也與世界各國的切身發展利益緊密相連。中俄美加強溝通和協調，將有助避免大國陷入對資源、技術和通道的惡性競爭，有助於維護能源產業鏈、供應鏈穩定暢通，並維護全球能源市場穩定。\n\n有美國傳媒指，中方展現主場優勢，營造大國形象。亦有分析認為，三方各有盤算，《和平宣言》缺乏實質內容，未就防止核擴散宣布具體措施，亦未提及美伊戰事和俄烏戰爭停火方案，認為會談未取得重大突破，形式大於實際。","image":"https://pro-vod-cdn.tvb.com/91ec969500db4273820f49aea5f3e113/snapshots/d71038e905d2428a979c3aacfe4fde19-00008.jpg","video":"https://pro-vod-cdn.tvb.com/91ec969500db4273820f49aea5f3e113/d4f0dc6c26f845fba11f76d7d75c306e-44590ce953982b36c185febe3017b405-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/91ec969500db4273820f49aea5f3e113/snapshots/d71038e905d2428a979c3aacfe4fde19-00008.jpg","lang":"zh-Hant"},{"id":"c67ab80140f","title":"英前議員落藥迷姦妻子13年 網上找陌生男輪流性侵 4同案被告罪成","url":"https://www.stheadline.com/realtime-world/3639194/英前議員落藥迷姦妻子13年-網上找陌生男輪流性侵-4同案被告罪成","summary":"英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥，趁她意識不清時性侵，甚至在網上招募陌生男子到家中侵犯妻子，並拍攝整個過程，相關犯罪行為長達13年。","summary_short":"英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥，趁她意識不清時性侵…","digest":"英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥…","points":["英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥…","妻子直到警方查獲大量私密影像後，才驚悉丈夫多年來的所作所為","菲利普早前已承認多項性侵罪名，而案中另外4名涉案男子周四在法院遭裁定性侵罪成"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:20:58+08:00","size":1,"keywords":[],"body":"英國前保守黨地方議員菲利普．楊（Philip Young）涉嫌長期對妻子落藥，趁她意識不清時性侵，甚至在網上招募陌生男子到家中侵犯妻子，並拍攝整個過程，相關犯罪行為長達13年。妻子直到警方查獲大量私密影像後，才驚悉丈夫多年來的所作所為。菲利普早前已承認多項性侵罪名，而案中另外4名涉案男子周四在法院遭裁定性侵罪成。\n英國溫徹斯特刑事法院上月27日開庭審理這宗駭人聽聞的長期性侵案件，50歲的菲利普，被控在妻子喬安妮（Joanne Young）不知情的情況下，多次對她落藥，並安排陌生男子到家中對她進行性侵。\n夫在場觀看拍攝 發布上網\n菲利普與喬安妮於2002年開始交往，兩人表面上過著正常家庭生活，喬安妮一直以為夫妻關係是一對一的婚姻，過去也曾明確告訴丈夫，自己不願與其他人發生性關係。然而2023年某次親密接觸期間，喬安妮原本以為身旁的人是丈夫，卻在過程中察覺房內似乎出現另一名男子，令她受到極大驚嚇，丈夫翌日向她道歉，承認曾透過網絡邀請他人到家中，但當時她並不知道這只是多年犯罪行為的一小部分，菲利普的犯罪行為涉及長達13年的時間。\n警方後來調查菲利普的網絡活動，並查扣電子設備，發現大量妻子遭蒙眼、限制行動及疑似失去意識時，被其他男子性侵的影像。至少從2015年起，菲利普便開始尋找能讓妻子陷入深度睡眠、意識混亂，甚至事後無法回憶過程的藥物，不僅涉嫌在妻子失去反抗能力時安排其他男子侵犯，還會在旁觀看、錄影，並將相關影像發布至網上。\n同案4被告強姦或性侵罪成 追捕第7名嫌犯\n檢察官瓊斯（Sarah Jones）指出，菲利普透過Craigslist、Grindr及換偶網站刊登訊息，招募願意與妻子發生性行為的陌生男子，聲稱讓其他男性與妻子發生性行為是夫妻雙方共同的性癖好，但妻子從未同意與其他男子發生性關係。\n菲利普今年較早前已承認多項控罪，包括11項強姦罪、14項偷窺罪、11項意圖犯罪而施用藥物罪，以及其他性侵害相關罪名。另外4名涉案男子周四被裁定罪成，其中48歲的麥克索尼（Norman Macksoni）和62歲的威爾金斯（Richard Wilkins）被裁定強姦罪成，而32歲的桑德森-多伊爾（Connor Sanderson-Doyle）和38歲的哈桑（Mohammed Hassan）則被裁定性侵罪成。第6名共犯也已認罪，警方正在追捕第7名嫌疑犯。\n英版吉賽兒 勇敢放棄匿名權\n這宗震驚英國的案件因情節與2024年法國轟動全球的吉賽兒（Gisele Pelicot）案極其相似，被形容為英國版的翻版事件。受害人喬安妮與菲利普目前已經離婚，她效仿吉賽兒，主動放棄法律享有的匿名權，公開自己的姓名與身份。她希望透過挺身而出，揭發藥物性侵的黑幕，並藉此提高大眾對婦女性暴力與此類案件的重視與關注。\n49歲的喬安妮育有3名孩子，因勇敢而備受讚揚，她在法庭作證，並旁聽了4名男子在她昏迷時與丈夫一起性侵她的審訊過程。她在案中4名被告被裁定罪成後說：「我最信任的人竟以最可怕的方式背叛了我，這場可怕的性侵讓我明白，在家中也沒提受到任何保護。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3995599a0a","title":"紐約等地有民眾示威 抗議ANTHROPIC上市","url":"https://news.tvb.com/tc/1207393-紐約等地有民眾示威抗議ANTHROPIC上市","summary":"美國人工智能公司ANTHROPIC周四上市，紐約、三藩市等地有民眾示威抗議。約30人在紐約時報廣場納斯達克交易所外手持橫額，抗議ANTHROPIC上市，指科技行業令財富及權力，過度集中在億萬富豪手中，又憂慮人工智能在醫療保健上取代人類，會影響治療成效和安全。","summary_short":"美國人工智能公司ANTHROPIC周四上市，紐約、三藩市等地有民眾示威抗議。","digest":"美國人工智能公司ANTHROPIC周四上市，紐約、三藩市等地有民眾示威抗議","points":["約30人在紐約時報廣場納斯達克交易所外手持橫額，抗議ANTHROPIC上市…","警方到場戒備，拘捕部分示威者","三藩市ANTHROPIC總部外，同日亦有人示威，指人工智能存在安全隱患"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T10:59+08:00","size":1,"keywords":[],"body":"美國人工智能公司ANTHROPIC周四上市，紐約、三藩市等地有民眾示威抗議。\n\n約30人在紐約時報廣場納斯達克交易所外手持橫額，抗議ANTHROPIC上市，指科技行業令財富及權力，過度集中在億萬富豪手中，又憂慮人工智能在醫療保健上取代人類，會影響治療成效和安全。警方到場戒備，拘捕部分示威者。\n\n三藩市ANTHROPIC總部外，同日亦有人示威，指人工智能存在安全隱患。","image":"https://pro-vod-cdn.tvb.com/e1f03a6919ae475ca8c78532e671b1ea/snapshots/5687959af5d44cfe8c026e172b05e36c-00005.jpg","video":"https://pro-vod-cdn.tvb.com/e1f03a6919ae475ca8c78532e671b1ea/209de776c3a84031a124531eb1d531e3-a528cf6398db85da23d00d022afc7e7f-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e1f03a6919ae475ca8c78532e671b1ea/snapshots/5687959af5d44cfe8c026e172b05e36c-00005.jpg","lang":"zh-Hant"},{"id":"c219e4eca19","title":"中泰媒体合作交流活动在曼谷举行","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735044.shtml","summary":"中新网曼谷11月20日电 (李映民 梁峻祥 王茜)“中泰相约 山海共鸣”中泰媒体合作交流对话会暨海南广播电视总台与泰国广播电视专业协会联合会合作协议签署仪式19日在曼谷举行。","summary_short":"中新网曼谷11月20日电 (李映民 梁峻祥 王茜)“中泰相约 山海共鸣”中泰媒体合作交流对话会暨海南广播电视总台与泰国广…","digest":"“中泰相约 山海共鸣”中泰媒体合作交流对话会暨海南广播电视总台与泰国广播电视专业协会…","points":["中新网曼谷11月20日电 (李映民 梁峻祥 王茜)“中泰相约 山海共鸣”中泰媒体合作交流对话…","活动同期启动“海南自贸港主题展播季”，一批展现海南自贸港发展活力…","泰国前副总理、现泰中文化促进委员会主席披尼在开幕式上致辞"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T10:32:00+08:00","size":1,"keywords":[],"body":"中新网曼谷11月20日电 (李映民 梁峻祥 王茜)“中泰相约 山海共鸣”中泰媒体合作交流对话会暨海南广播电视总台与泰国广播电视专业协会联合会合作协议签署仪式19日在曼谷举行。\n\n　　活动同期启动“海南自贸港主题展播季”，一批展现海南自贸港发展活力、热带生态和人文底蕴的视听作品，将依托泰国、马来西亚、柬埔寨等国主流媒体平台集中展播。\n\n泰国前副总理、现泰中文化促进委员会主席披尼在开幕式上致辞。王茜 摄\n\n　　出席活动的泰国前副总理、现泰中文化促进委员会主席披尼在致辞中表示，海南自贸港建设为两国深化务实合作提供了新的机遇。海南与泰国在经贸往来、数字服务、绿色发展和旅游等领域具有广泛的合作空间。双方应把中国发展新质生产力的机遇与泰国产业升级、人才培养相衔接，让中小企业、青年和当地社区更多受益，以持续合作为地区发展增添信心与确定性。\n\n　　海南广播电视总台国际传播融媒体中心主任吴鹏表示，海南广播电视总台将发挥采编、影像和多语种传播优势，与泰国媒体共同策划选题、开展联合采访和内容制作，把海南的发展变化同企业经营、青年成长、游客体验等具体故事联系起来，让海外受众更直观地认识海南。\n\n　　泰国广播电视专业协会联合会主席凯马塔·蓬德表示，泰国受众认识海南，既需要了解开放政策和发展机遇，也需要看到海南人的日常生活、地方文化与创新实践。双方应加强交流合作，让海南故事以泰国受众熟悉的语言和表达方式走近当地民众，同时把泰国的发展与文化介绍给海南和中国受众。\n\n活动现场。李映民 摄\n\n　　活动中，海南广播电视总台与泰国广播电视专业协会联合会签署了合作协议，双方将结合各自内容生产、平台渠道和本土资源优势，围绕视听内容共创、新闻信息互通、媒体人员互访、多语种译制传播和传播矩阵联动开展务实合作，推动优质音视频节目双向交流。\n\n　　活动期间举行的圆桌会谈以“海南与泰国：高水平开放与高质量合作”为主题，嘉宾围绕海南自贸港开放机遇、国际传播和文旅合作交流看法。\n\n圆桌会谈现场。梁峻祥 摄\n\n　　海南是中国著名侨乡，有近200万旅泰琼籍华侨华人，正大集团等泰国企业早在20世纪80年代便扎根海南。随着海南自贸港政策红利持续释放，琼泰两地的互补优势日益凸显。以媒体为纽带的“软连接”，让这些跨越山海的故事被更多人看见、听懂。(完)\n\n 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb5925de617","title":"巴西2026年农牧业总产值预计达1.46万亿雷亚尔","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735012.shtml","summary":"中新社圣保罗11月19日电 巴西农业部19日发布数据显示，2026年巴西农牧业总产值预计达1.46万亿雷亚尔，较上年创下的历史纪录下降2.6%。","summary_short":"中新社圣保罗11月19日电 巴西农业部19日发布数据显示，2026年巴西农牧业总产值预计达1.46万亿雷亚尔…","digest":"巴西农业部19日发布数据显示，2026年巴西农牧业总产值预计达1.46万亿雷亚尔…","points":["中新社圣保罗11月19日电 巴西农业部19日发布数据显示…","尽管受不利气候条件影响，农牧业产值有所回落，但巴西农产品出口继续保持增长势头","数据显示，受降雨过量及阶段性干旱影响，今年巴西种植业产值预计同比下降3.9%…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T10:30:52+08:00","size":1,"keywords":[],"body":"中新社圣保罗11月19日电 巴西农业部19日发布数据显示，2026年巴西农牧业总产值预计达1.46万亿雷亚尔，较上年创下的历史纪录下降2.6%。尽管受不利气候条件影响，农牧业产值有所回落，但巴西农产品出口继续保持增长势头。\r\n\n　　数据显示，受降雨过量及阶段性干旱影响，今年巴西种植业产值预计同比下降3.9%，畜牧业下降0.2%。其中，大豆和肉牛养殖业表现较好，产值预计分别增长4.6%和11.8%。作为巴西最主要的农产品，大豆产值预计达3612亿雷亚尔。\n\n　　巴西农业部预计，2027年农牧业总产值将有序增长，同比增幅将达2.6%，再次突破1.5万亿雷亚尔。其中，大豆产值有望增长10.1%，畜牧业产值预计增长5.3%。\n\n　　另据巴西农业部数据显示，2026年前10个月，巴西农牧业出口额达1494亿美元，同比增长5.2%，贸易顺差约1323亿美元。其中，大豆及其制品出口额达564亿美元，肉类出口额达286亿美元，牛肉和鸡肉出口均创下历史同期纪录。\n\n　　2026年10月，巴西农牧业出口额达160亿美元，同比增长4.1%，占当月全国出口总额的42.3%。大豆以31亿美元的出口额位居首位，其次为生咖啡豆、玉米、牛肉和纸浆。巴西农牧产品前三大出口市场依次为中国、欧盟和美国，出口额分别为39亿美元、26亿美元和9.52亿美元。\n\n　　巴西近年来持续拓展农牧产品国际市场。自2023年以来，巴西已累计在全球102个国家获得728项农牧产品市场准入许可。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5f2b6c64c2","title":"外媒眼中的“现代化奇迹”，APEC深圳会议展现中国开放创新窗口","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735057.shtml","summary":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会…","随着亚太各经济体领导人和工商界代表齐聚这座中国改革开放的前沿城市，深圳成为国际媒体关注的焦点","从区域经贸合作到科技创新，从产业发展到城市开放活力，外媒纷纷将目光投向中国…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T09:44:48+08:00","size":1,"keywords":[],"body":"中新网11月20日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。随着亚太各经济体领导人和工商界代表齐聚这座中国改革开放的前沿城市，深圳成为国际媒体关注的焦点。\n\n　　从区域经贸合作到科技创新，从产业发展到城市开放活力，外媒纷纷将目光投向中国，各方期待借助APEC这一重要平台，探索亚太经济合作新机遇。\n\n图为市民拍摄深圳华强北的APEC标识。中新社记者 张祥毅 摄\n\n　　开放合作凝聚共识\n\n　　亚太经济迎来新机遇\n\n　　本届APEC会议以“建设亚太共同体，促进共同繁荣”为主题，“开放、创新、合作”成为三大优先领域。多家外媒认为，在全球经济面临不确定性、区域产业联系日益紧密的背景下，APEC深圳会议为亚太各经济体加强对话、深化经贸合作提供了重要契机。\n\n　　马新社报道称，随着来自亚太经合组织21个经济体和英国、法国、德国、瑞士等13个域外经济体知名企业代表齐聚深圳，这座城市成为区域经济外交的焦点。各方围绕加强贸易、推动创新和深化区域合作，共同探讨亚太地区未来发展方向。\n\n　　报道称，作为东道主，中国期待各成员经济体在贸易、互联互通、数字经济和人工智能等重点领域取得更多务实成果。\n\n　　越南媒体“Vietnamplus”报道称，
