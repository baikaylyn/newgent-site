<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

keywords":[],"body":"大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人，蔡天鳳丈夫譚方駿鍾意自己，曾經買米線向他示愛。又形容與蔡天鳳關係複雜、難以解釋。\n\n三名被告，蔡天鳳前夫鄺港智、前家翁鄺球和前大伯鄺港傑，由囚車押送到高等法院應訊，三人否認謀殺罪。\n\n鄺港智在代表律師安華暉引導下首次作供，確認在14歲時認識蔡天鳳，2013年結婚，同年誕下第一個小孩。\n\n鄺港智稱，在2015年8月，因為盜竊要坐「大飛」往內地，其後用相同方法，往返內地和香港，每次都是包船、費用10萬元，自己有能力支付，否認財政上需要依靠蔡天鳳。\n\n鄺港智稱，在內地期間有同蔡天鳳維持聯絡，每天傾談幾小時電話或視頻。代表律師問鄺港智，是否覺得自己和蔡天鳳仍然是夫婦，鄺港智回答稱「複雜，難以解釋」，又稱兩人最終離婚，「唔記得哪年，由蔡天鳳處理，自己無簽署」。\n\n他又提到11歲時已經認識譚方駿，知道蔡天鳳與對方結婚，有少少不開心，但都有祝福兩人，指蔡天鳳曾經向他提過，是因為錢而同譚方駿結婚。\n\n鄺港智又在庭上指，譚方駿「鍾意自己」，但譚方駿家人想要小朋友，所以三個人就一齊，譚方駿的家人不介意，又提及譚方駿曾經買米線，向他示愛。\n\n鄺港智稱，蔡天鳳曾先後多次到內地探望他，其中一次譚方駿亦有同行，入住海南海口一間酒店，「三個人瞓同一張床」。\n\n他稱，在內地認識一名叫盧曉虹的女朋友，形容是四角關係。後來被蔡天鳳知道，要求他盡快回港，最後他與盧曉虹分手，於2022年6月返港。\n\n鄺港智又提到，支持出售加多利山物業的決定，相信出售單位後搬往屯門居住，可以方便子女上學，及清還蔡天鳳名下曼克頓山單位的按揭貸款。\n\n鄺港智作供期間，暫委法官祁彥輝提醒他，切勿在供詞內添加過多律師沒有問及的資訊。","image":"https://pro-vod-cdn.tvb.com/e1412633ba4846c294c2e78a5d880787/snapshots/bfafd69818bd4ffea8f8d16e10beb440-00008.jpg","video":"https://pro-vod-cdn.tvb.com/e1412633ba4846c294c2e78a5d880787/07ea8fc6d8474054a2b8b35790ca1f8c-a2f284c7ab388548ada12e52e6bde56c-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e1412633ba4846c294c2e78a5d880787/snapshots/bfafd69818bd4ffea8f8d16e10beb440-00008.jpg","lang":"zh-Hant","items":[{"title":"蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛 與另外兩女形成四角關係","url":"https://news.tvb.com/tc/1207292-蔡天鳳碎屍案鄺港智作供稱譚方駿曾買米線示愛與另外兩女形成四角關係","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T18:42+08:00","category":"法庭","digest":"大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人…"},{"title":"蔡天鳳碎屍案｜鄺港智供稱譚方駿鍾意自己 「所以三個人就一齊」","url":"https://news.tvb.com/tc/1207241-蔡天鳳碎屍案鄺港智供稱譚方駿鍾意自己所以三個人就一齊","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T15:17+08:00","category":"法庭","digest":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行…"},{"title":"蔡天鳳碎屍案｜鄺港智指與內地女友盧曉虹Ivy見家長 被蔡天鳳要求回港後分手","url":"https://www.stheadline.com/society/3638873/蔡天鳳碎屍案鄺港智指與內地女友盧曉虹Ivy見家長-被蔡天鳳要求回港後分手","source_display":"星島頭條","published_at":"2026-11-19T14:34:13+08:00","category":"港聞","digest":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍…"},{"title":"蔡天鳳碎屍案｜鄺港智稱與蔡天鳳譚 一座城市的发展故事。\n\n　　在过去40多年的时间轴上，深圳的故事里，一条改革开放的主线贯穿其中。\n\n　　1978年，党的十一届三中全会开启改革开放大幕，也是在那一年，还在清华大学读书的习近平第一次来到深圳，彼时他看到的“还是一个小渔村”。\n\n　　2020年，在参观庆祝深圳经济特区建立40周年展览时，习近平总书记回忆道：“40多年前，我来深圳，去中英街，看到两边差距确实太大了，一边是破烂木板房，一边是带空调的气派小楼。当时就感觉到老百姓有着强烈的改变生活和命运的愿望。”\n\n　　1979年，蛇口工业区开山炮响，深圳的故事就此开篇。\n\n　　40多年沧海桑田，改革开放成就了深圳，也改变了中国。一个小渔村发展成为现代化国际大都市，一个大国实现从“赶上时代”到“引领时代”的历史性跨越。\n\n　　奇迹背后蕴藏着发展密码。\n\n　　习近平总书记曾形容，深圳是“中国特色社会主义在一张白纸上的精彩演绎”。弹指间40多年过去，深圳的故事充分证明，中国选择的这条道路，不仅走得对、走得通，而且走得稳、走得好。\n\n　　在过去10多年的时间轴上，深圳的故事里，高质量发展的步伐坚实而有力。\n\n　　党的十八大后首次赴地方考察，习近平总书记便来到深圳。此后，在改革开放40周年、深圳经济特区建立40周年等特殊节点，习近平总书记又多次来到深圳。\n\n　　2012年，在莲花山公园，他瞻仰邓小平铜像，亲手种下一棵高山榕树，发出“坚定不移推进改革开放”的动员令。\n\n　　2018年，在前海石前，他寄语深圳“在共建‘一带一路’、推进粤港澳大湾区建设、高水平参与国际合作方面发挥更大作用”。\n\n　　2020年，再次来到深圳，他展望深圳的未来，“到新中国成立100年时，我们将建成社会主义现代化强国，实现第二个百年奋斗目标，那时的深圳又将是另外一番景象”。\n\n　　党的十八大以来，深圳人均GDP从2012年的12.32万元增至2025年的21.38万元，一大批领军企业引领全球产业变革，外贸进出口规模居全国内地城市首位……\n\n　　数字背后，一个开放、创新、合作的深圳，成为新时代中国高质量发展的生动注脚。\n\n　　在18日的欢迎晚宴上，习近平主席指出，看千年的中国去西安，看五百年的中国去北京，看一百年的中国去上海，看五十年的中国来深圳。\n\n　　今天的深圳是中国高水平对外开放的窗口，是中国集群式创新的前沿，也是中国同各方合作共赢的热土。不断续写的深圳故事，展现着中国式现代化的万千气象。\n\n　　｜总策划：俞岚\n\n　　｜策划：周锐\n\n　　｜统筹：马学玲\n\n　　｜执笔：阚枫 袁秀月\n\n　　｜审校：孙静波 邵萌\n\n　　｜视觉：张舰元 雷宇竺\n\n　　｜中国新闻网“习言道”工作室出品\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"【和合共生】习言道｜习近平与深圳的“大故事”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734813.shtml","source_display":"中新網 時政","published_at":"2026-11-19T19:04:42+08:00","category":"內地","digest":"题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方"},{"title":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075480.shtml","source_display":"中新視頻","published_at":"2026-11-19T18:44:24+08:00","category":"內地","digest":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事"},{"title":"【和合共生】习言道｜构建中美建设性战略稳定关系是前无古人的开创性事业","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734801.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:39:50+08:00","category":"內地","digest":"【和合共生】习言道｜构建中美建设性战略稳定关系是前无古人的开创性事业"},{"title":"和合共生｜APEC聊些啥？又是如何运转的？","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075457.shtml","source_display":"中新視頻","published_at":"2026-11-19T16:13:02+08:00","category":"內地","digest":"和合共生｜APEC聊些啥？又是如何运转的？"},{"title":"【和合共生】习言道｜推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734579.shtml","source_display":"中國新聞網","published_at":"2026-11-19T14:23:18+08:00","category":"內地","digest":"11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议…"}],"cross":{"total":5,"angles":[{"point":"和合共生｜APEC聊些啥？又是如何运转的？","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075457.shtml"},{"point":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075480.shtml"},{"point":"题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734813.shtml"},{"point":"【和合共生】习言道｜构建中美建设性战略稳定关系是前无古人的开创性事业","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734801.shtml"}]}},{"id":"c04a3ef751c","title":"深圳APEC｜全家福長巾「紅藍雙絕」 拆解紅色「順德香雲紗」國禮手作奧秘","url":"https://www.stheadline.com/realtime-china/3638940/深圳APEC全家福長巾紅藍雙絕-拆解紅色順德香雲紗國禮手作奧秘","summary":"11月19日，在2026年APEC領導人非正式會議的全家福合影，定格了經濟體的歷史性同框。","summary_short":"11月19日，在2026年APEC領導人非正式會議的全家福合影，定格了經濟體的歷史性同框。","digest":"11月19日，在2026年APEC領導人非正式會議的全家福合影…","points":["11月19日，在2026年APEC領導人非正式會議的全家福合影，定格了經濟體的歷史性同框","各國領導人披着一條香雲紗長巾，沈穩紅與深邃藍兩色輝映","其中獨特的「英雄紅」來自順德薯莨與河泥「魔法」變出的香雲紗，花了不少功夫才登上國禮的舞台"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:30:54+08:00","size":5,"keywords":[],"body":"11月19日，在2026年APEC領導人非正式會議的全家福合影，定格了經濟體的歷史性同框。各國領導人披着一條香雲紗長巾，沈穩紅與深邃藍兩色輝映。其中獨特的「英雄紅」來自順德薯莨與河泥「魔法」變出的香雲紗，花了不少功夫才登上國禮的舞台。\n今次中方配飾「同心合錦」紅藍CP驚艷世界，藍色圍巾以蘇州上久楷的宋錦織造，紅色圍巾則是來自順德的香雲紗染整。「同心合錦」中的那抹磚紅色並非化學染劑，而是源自順德倫教曬莨裏，薯莨與河泥的古老魔法。經過30多道純手工、無化學助劑的染整工序，在日光、河泥與草地的反復催化下，才沈澱出那份沈穩的「英雄紅」。\n從老師傅靠經驗到規範化\n傳統香雲紗「憑手感、看眼力」，導致市場上真偽難辨、良莠不齊，成為高端品牌化的最大阻礙，但倫教政府特別出台《香雲紗品類與等級評定規範》團體標準，將老師傅的經驗轉化為包含色牢度、撕拉力等指標的理化數據，並結合非遺傳承人的感官評定。\n2026年4月，首批「優等品」評定落地。優質香雲紗獲得品質認證，打開了成為國禮的大門。\n順德河泥獨特 溫濕度難複製\n其他地方即使能種出薯莨（一種薯蕷科薯蕷屬植物）、仿造工序，也搬不走順德特有的富含鐵離子的河泥，搬不走珠三角的日照與溫濕度，更搬不走一代代順德手藝人沈澱的技藝。\n如今的順德倫教，手握國家級非遺、國家地理標誌產品、國家地理標誌證明商標三張「國字號」名片，2025年香雲紗產能突破1000萬米，曬莨場逾1600畝，倫教建立出全國首個香雲紗全產業鏈園區，將面料生產、設計研發、品牌孵化、交易展貿整合於一體。\n當「同心合錦」需要批量交付高品質長巾時，順德能夠迅速調度產能、控制品質。從原產地的保護，到規模化、標準化的生產，順德香雲紗完成了從「農產品式作坊」向「現代時尚工業」的躍升。\n小知識：大合照傳統服裝何以簡化成圍巾？\n自1993年西雅圖峰會，時任美國總統克林頓贈送每人一件皮褸開始，APEC就出現了了穿東道主特色服裝拍大合照慣例，例如上海唐裝、越南奧黛等。後來有官員對於穿異國傳統服飾感到不自在，近年多國簡化為有各國特色的圍巾，在保留了宣傳本土文化工藝的同時免各國領袖感到拘束 。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC｜全家福長巾「紅藍雙絕」 拆解紅色「順德香雲紗」國禮手作奧秘","url":"https://www.stheadline.com/realtime-china/3638940/深圳APEC全家福長巾紅藍雙絕-拆解紅色順德香雲紗國禮手作奧秘","source_display":"星島頭條","published_at":"2026-11-19T17:30:54+08:00","category":"內地","digest":"11月19日，在2026年APEC領導人非正式會議的全家福合影…"},{"title":"深圳APEC｜李家超晤新加坡總理黃循財 感謝支持香港加入RCEP 邀星企發掘河套商機","url":"https://www.stheadline.com/politics/3638938/深圳APEC李家超晤新加坡總理黃循財-感謝支持香港加入RCEP-邀星企發掘河套商機","source_display":"星島頭條","published_at":"2026-11-19T17:12:39+08:00","category":"港聞","digest":"行政長官李家超於下午在深圳出席亞太經合組織相關活動期間，與新加坡總理黃循財會面"},{"title":"深圳APEC｜李家超：與習近平短暫交流 匯報大灣區機遇及香港發展優勢","url":"https://www.stheadline.com/politics/3638875/深圳APEC李家超與習近平短暫交流-匯報大灣區機遇及香港發展優勢","source_display":"星島頭條","published_at":"2026-11-19T14:41:34+08:00","category":"港聞","digest":"第33次亞太經合組織領導人非正式會議在深圳召開"},{"title":"深圳APEC｜李家超：達五成果 包括與智利簽定工作假期計劃協議","url":"https://www.stheadline.com/politics/3638845/深圳APEC李家超達五成果-包括與智利簽定工作假期計劃協議","source_display":"星島頭條","published_at":"2026-11-19T13:50:04+08:00","category":"港聞","digest":"亞太區經濟合作組織第三十三次領導人非正式會議在深圳舉行"},{"title":"深圳APEC｜習特會結束 特朗普稱兩人掌舵便「無問題」｜不斷更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC習特會結束-特朗普稱兩人掌舵便無問題不斷更新","source_display":"星島頭條","published_at":"2026-11-19T13:38:27+08:00","category":"內地","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行"}],"cross":{"total":5,"angles":[{"point":"第33次亞太經合組織領導人非正式會議在深圳召開","sources":["星島頭條"],"url":"https://www.stheadline.com/politics/36 （20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里，如此高難度的比賽常人尚覺艱難，卻有視障人士和聽障人士勇於挑戰。","summary_short":"年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里…","digest":"年度大型遠足籌款活動「樂施毅行者」明起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑…","points":["年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行…","視障跑手朱健驊今年與隊友組成「猛龍長跑隊」參加活動，他接受《星島頭條》訪問時表示…","退役三項鐵人運動員 花一年半時間準備比賽"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:51:23+08:00","size":1,"keywords":[],"body":"年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里，如此高難度的比賽常人尚覺艱難，卻有視障人士和聽障人士勇於挑戰。視障跑手朱健驊今年與隊友組成「猛龍長跑隊」參加活動，他接受《星島頭條》訪問時表示，運動讓他更樂於表達自我，希望自身經驗能讓更多人知道，殘障人士也能在運動中取得成績，也能擁有豐富運動體驗。\n退役三項鐵人運動員 花一年半時間準備比賽\n朱健驊本身是退役三項鐵人運動員，如今僅有一成視力，在香港傷健共融網絡的組織下，與聽障跑手崔霞，以及兩名健全領跑員黃婉琪和姚永聰組成「猛龍長跑隊」，挑戰「樂施毅行者」100公里項目。朱健驊透露，為了挑戰如此高難度的活動，他花了一年半時間準備，做了很多山路實地練習和體能練習，也培養了和領跑員及隊友之間的默契。\n朱健驊患有先天性青光眼，從小較為多病，當時醫生建議他多做運動改善身體，他便開始接觸游泳，之後陸續嘗試長跑、三項鐵人、越野跑和HYROX等，更成為了專業三項鐵人運動員。數年前，朱健驊的視力急遽衰退，他因而選擇退役，希望以業餘身份繼續留在運動領域，「樂施毅行者」便是他參加的其中一個活動。\n領跑員笑言是「氣氛擔當」 幫視障隊友口述影像\n「猛龍長跑隊」隊友間以暱稱互稱，隊友叫他「朱仔」，他則以「琪琪」稱呼領跑員黃婉琪。領跑員與視障人士拍檔時，要以口述影像的方式向視障跑手描述周遭環境。雖然練習過程長達一年半，但朱仔笑言每一次與隊友練習都很開心，他尤其讚賞領跑員琪琪，因她在口述影像之餘還會和拍檔聊天，活絡氣氛。黃婉琪亦有接受訪問，聞此笑言「氣氛擔當好重要」，因視障人士行山時看不見風景或覺沉悶，故她會不斷幫隊友腦補畫面，例如周圍的人事物和風景等，希望視障人士在行山時，全部的感官都能參與其中。\n琪琪的口述影像不止仔細準確，更加入風趣比喻。朱仔也對琪琪的風趣幽默印象深刻，更表示自己參加過這麼多次行山比賽，最難忘的都是和領跑員或隊友的相處時光。他曾與琪琪拍檔參加過一場港島路線的50公里越野賽，期間發生過一個小插曲：當時朱仔和琪琪正在下山，視障人士下山速度本身較慢，山路後面便聚集起了不少等著下山的跑手，琪琪見此就向朱仔開玩笑，「哇，後面好多牛牛啊」。朱仔表示，自己下山時需高度專注，有時會心急，怪自己走得慢，但琪琪的比喻讓他放鬆不少。如今朱仔受訪時重新講述這個故事，也和琪琪一起邊講邊笑。\n領跑員最重要細心、觀察能力強\n黃婉琪做領跑員已有八九年時間，當初是覺得做領跑員既可貢獻社會，又可跑步減肥，便開始學習成為領跑員。她認為做領跑員最重要的是細心和觀察能力，除了周圍環境，還要用心去感受拍檔需要甚麼。黃婉琪舉例指，不同視障運動員的視覺缺損程度都不一樣，要事前先問清楚；而先天失明的跑手，身體平衡感往往與後天失明的人相比較差，這些細節都要多加留意。\n黃婉琪和許多視障拍檔合作過，觀察到視障運動員對每一次訓練都非常珍惜。她笑言，若約身體健全朋友行山，對方有可能遲到或臨時爽約，但視障朋友不但不會這樣，還會提前詢問她需要準備什麼，問清楚集合地點時間等。朱仔聞此亦十分同意，指自己作為運動員的觀念是，每次訓練都是為了日後比賽，所以次次都彌足珍貴；此外，領跑員犧牲私人休閒時間，放棄和朋友玩樂的機會，特地抽出時間陪他們訓練，這份心意也值得好好珍惜。\n視障充當聽障「耳仔」 目標30小時內完賽\n香港傷健共融網絡經理（運動康復及籌款）Fiona表示，猛龍長跑隊既有視障跑手，也有聽障跑手，有時視障跑手可充當聽障跑手的「耳仔」，若隊伍後面有跑手希望「爬頭」並大喊通知前方跑手，視障跑手便會拍一拍聽障隊友肩膀作通知。她續指，香港傷健共融網絡多年來組織過不少傷健共融隊伍參加不同運動項目或比賽，每一次大型賽事，機構都會設後方支援隊，除了幫助領跑員處理突發狀況外，也會為跑手送上食物和衣物等補給，讓隊員在夜間路段補充體力，添上厚衣，再繼續上路。\n\n黃婉琪表示，今年比賽前，「猛龍長跑隊」已參加各種活動及賽事來磨合和練習，有信心可跑出不錯的成績，目標是30小時以內完成路線。朱健驊表示，本次100公里路線是他挑戰過最長的行山路線，雖有些緊張，但更多是興奮及開心。「最重要是好好享受比賽，感受沿途路況，把過去訓練學到的技術實際運用出來。」\n朱健驊續指，運動已成為他人生的一部分，不但能保持健康，更可拓展他內心的視野。「心態變得開闊，就更願意說出自己的困難，也願意和更多人分享自己的心路歷程，讓大家知道，原來殘障人士也能在運動當中取得成績，而且也能擁有豐富的運動體驗。」談及傷殘帶來的影響，朱健驊坦言，不論是先天殘障抑或後天殘障的人士，很多人遇到這樣的狀況便會不想面對。「但很多事情如果你願意面對，就會更加能夠堅持，只要堅持下去，就會出現很多不同的結果。」除了勉勵同行人，他也希望未來能有更多健全人士接納殘障人士的需求，理解他們面對的困難，並給予更多嘗試機會，讓他們獲得更多體驗，拓闊視野。\n記者：周育瑩","image":"","video":"","video_poster":"","lang":"zh-Hant"}],"sections":[{"name":"港聞","total":19,"items":[{"id":"c6005ce5850","title":"深圳APEC︱外媒首訪中國讚深圳「超乎想像」 亞美尼亞記者因「The Weeknd」新歌冀遊覽香港","url":"https://www.stheadline.com/politics/3638997/深圳APEC外媒首訪中國讚深圳超乎想像-亞美尼亞記者因The-Weeknd新歌冀遊覽香港","summary":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。","summary_short":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。","digest":"2026年亞太經合組織第33次領導人非正式會議最後一天在深圳舉行","points":["2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行","今次APEC會議周共有近5000名中外記者註冊報道，當中不少是初次到訪中國或深圳","《星島頭條》記者趁最後一天，在新聞中心採訪幾位分別來自俄羅斯、亞美尼亞及納米比亞的外媒記者"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:43:44+08:00","size":1,"keywords":[],"body":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。今次APEC會議周共有近5000名中外記者註冊報道，當中不少是初次到訪中國或深圳。《星島頭條》記者趁最後一天，在新聞中心採訪幾位分別來自俄羅斯、亞美尼亞及納米比亞的外媒記者。他們分享時不謀而合地讚嘆中國科技非常先進，美食很多元化，以及熱情好客的款待文化。談到香港，各人都表示認識且冀將到訪，亞美尼亞記者表示知道深港兩地很靠近，更指最近聽過歌手The Weeknd新歌《Hong Kong》，自己也因此很希望能遊覽香港。\n亞美尼亞記者：重慶麻辣顛覆認知 盼用《Hong Kong》拍片遊港\n亞美尼亞記者Diana數月前已抵中國進行採訪，坦言來華前對中國並無過多期望，然而這次旅程卻徹底打破她的刻板印象，對中國在高速現代化發展的同時，卻能保留傳統建築與文化表示敬佩。Diana分享，最喜歡的城市前三名分別是重慶、上海與深圳。她指重慶立體的城市景觀與璀璨夜景讓她大開眼界。她又指，重慶「麻辣」更徹底顛覆她對辣度的認知「之前我以為自己挺能吃辣；去過重慶之後，我才發現自己根本不懂什麼叫『辣』。」不過，她亦很欣賞這種圍爐共食、不看手機、專注聊天互動的用餐儀式「非常有人情味」。\n在深圳，她則嘗試燒賣和餃子等點心，稱感到十分驚喜。談及香港，她不僅渴望前往旅遊，還分享一個冷知識，指中環遮打道（Chater Road）是以亞美尼亞裔企業家Sir Paul Chater命名。她又指，知道加拿大歌手The Weeknd有一首新歌《Hong Kong》在網上非常熱門，自己也因此很想將來去到香港時，仿傚其他人用這首歌作配樂，分享遊覽香港的片段至社交平台。\n俄媒讚華強北「迷你高仿iPhone」 指深圳數字化超想像\n來自俄羅斯的Ilya Novikov曾於2023年到訪上海，卻是首次踏足深圳。他形容深圳給他的第一印象是「太不可思議了！」在深圳的兩天裡，他與同事一直在拍攝這座城市，特別提到南山區的景觀很美，指高樓林立、科技感亦十足。他們還參觀前海灣，體驗前沿的AI眼鏡、又到華強北參觀，笑言見到迷你版的高仿iPhone（barbie size iPhone），形容「It’s very cool」。同樣是首次到訪深圳、他的同事Dmitry Gavrilov則感嘆，深圳規模之大、城市之乾淨、數字化程度之高，均超乎他的想像。他大讚深圳市民熱情友好，在談到中西文化差異時，Gavrilov認為不應盲目比較東西方文化，指兩者雖截然不同，但也正因如此，兩者都非常美麗和獨特。\n納米比亞記者驚嘆深夜物流與AI生活 讚新聞中心設備完善\n來自納米比亞廣播公司的記者Rousa則是第二次來到深圳，她形容每次到訪都會被這裡無處不在的科技深深震撼。「AI雪糕機、AI咖啡機，無人機外賣」，指科技真的讓生活變得太便利，認為是展現「爭分奪秒」精神。Rousa又留意到，即使在凌晨2時，深圳依然有大量物流人員忙碌地為拼多多、淘寶等電商平台打包快件。她指這種高效社會節奏，以及高度普及的無現金交易方式，讓她深感敬佩，希望非洲大陸未來也能實現。\n作為與會記者，Rousa對本屆APEC新聞中心給予高度評價，認為設備非常完善，為國際媒體報導提供了極大便利。儘管在網絡上傳方面偶有延遲，但她表示各國記者之間互幫互助、交流採報經驗，形容是一次無與倫比的「人生體驗」，她會將這些寶貴的中國故事與採訪經驗帶回納米比亞。\n記者：陳俊豪、攝影：蘇正謙 深圳報道","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf3205505ea","title":"七旬翁偕友西貢深涌踩單車暈倒墮地 直升機送院搶救","url":"https://www.stheadline.com/breaking-news/3638973/七旬翁偕友西貢深涌踩單車暈倒墮地-直升機送院搶救","summary":"今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地，至深涌碼頭附近時，突然暈倒跌在地上，昏迷不醒，同行車友報警求助。","summary_short":"今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地，至深涌碼頭附近時…","digest":"下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地…","points":["今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地…","救援人員接報到場，政府飛行服務隊也派出直升機協助，將事主吊起送往東區醫院搶救"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:28:38+08:00","size":1,"keywords":[],"body":"今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩單車到深涌營地，至深涌碼頭附近時，突然暈倒跌在地上，昏迷不醒，同行車友報警求助。救援人員接報到場，政府飛行服務隊也派出直升機協助，將事主吊起送往東區醫院搶救。據了解，事主有身體病紀錄。\n男子送院時已陷昏迷。\n政府飛行服務隊也派出直升機協助，將事主吊起送往東區醫院搶救。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc369cdd1a5","title":"葵芳小巴站男子抽筋暈倒 救援人員施心外壓急救","url":"https://www.stheadline.com/breaking-news/3639004/葵芳小巴站男子抽筋暈倒-救援人員施心外壓急救","summary":"今日（19日）晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒，救援人員接報到場，將他送往仁濟醫院搶救。","summary_short":"今日（19日）晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒，救援人員接報到場…","digest":"晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒…","points":["今日（19日）晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒…","根據網上圖片所見，事主身穿黑色短褲，他倒卧小巴站旁邊，多名救援人員輪流替事主進行心外壓急救…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:28:02+08:00","size":1,"keywords":[],"body":"今日（19日）晚上7時許，一名30多歲男子於葵芳新都會廣場對開小巴站突然抽筋暈倒，昏迷不醒，救援人員接報到場，將他送往仁濟醫院搶救。\n根據網上圖片所見，事主身穿黑色短褲，他倒卧小巴站旁邊，多名救援人員輪流替事主進行心外壓急救，其後為他戴上氧氣罩並抬上擔架床。\n救援人員輪流替事主進行心外壓急救。網上圖片\n事主被抬上擔架床。網上圖片\n現場為葵芳新都會廣場對開小巴站。網上圖片","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cec18ac715f","title":"獲匈牙利塞麥爾維斯大學頒授榮譽博士 中大校長盧煜明：彰顯兩校日益深化的學術聯繫","url":"https://www.stheadline.com/society/3638999/獲匈牙利塞麥爾維斯大學頒授榮譽博士-中大校長盧煜明彰顯兩校日益深化的學術聯繫","summary":"中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis University）頒授榮譽博士（Doctor Honoris Causa）學位。","summary_short":"中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis University）頒授榮譽博…","digest":"獲匈牙利塞麥爾維斯大學頒授榮譽博士 中大校長盧煜明：彰顯兩校日益深化的學術聯繫","points":["中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis Un…","榮譽博士學位為塞麥爾維斯大學最高學術榮譽之一，頒授典禮於匈牙利布達佩斯塞麥爾維斯大學歷史悠久…","盧煜明在致辭時表示，今天成為塞麥爾維斯大學的一員，讓我與被譽為「產婦的救星」…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:26:03+08:00","size":1,"keywords":[],"body":"中文大學公布，校長盧煜明教授今日（19日）獲匈牙利塞麥爾維斯大學（Semmelweis University）頒授榮譽博士（Doctor Honoris Causa）學位。榮譽博士學位為塞麥爾維斯大學最高學術榮譽之一，頒授典禮於匈牙利布達佩斯塞麥爾維斯大學歷史悠久的中央行政大樓內舉行，彰顯兩校日益深化的學術聯繫。\n盧煜明在致辭時表示，今天成為塞麥爾維斯大學的一員，讓我與被譽為「產婦的救星」、同時亦是大學命名人的塞麥爾維斯教授建立了深厚而個人的聯繫。他表示，自己畢生致力推動更安全的產前檢測，某種意義上可視為延續塞麥爾維斯教授致力改善孕婦及嬰兒福祉的歷史使命。\n中大校長盧煜明教授獲匈牙利塞麥爾維斯大學頒授榮譽博士學位。中大提供\n表彰盧煜明於分子診斷的貢獻\n今次榮譽博士學位旨在表彰盧煜明在分子診斷及醫學領域的開創性貢獻。盧煜明被譽為「無創產前檢測之父」，亦是液體活檢領域的先驅。他在1997年率先發現孕婦血漿內存有胎兒DNA，奠定無創產前檢測技術的基礎。相關檢測技術現已於全球超過100個國家採用，累計惠及逾一億名孕婦。\n此外，盧煜明近年亦將液體活檢技術應用於癌症早期檢測，成功研發可同時偵測多種癌症的血液測試技術，並推出作臨床應用。\n盧煜明研究成果對全球醫學科影響深遠\n盧煜明的研究成果對全球醫學科學界影響深遠，自2022年起出任香港科學院院長，他致力促進本地科研生態的長遠發展，並加強香港與內地及國際科研界的交流合作。盧煜明多年來在中國內地亦屢獲高度肯定，包括榮獲有「中國諾貝爾獎」之稱的首屆「未來科學大獎—生命科學獎」、成為首位華人科學家獲頒「復旦—中植科學獎」，以及當選中國科學院院士，並獲頒首屆「騰衝科學大獎」，充分體現其科研成就對國家醫學科技發展的重要貢獻。\n中大校長盧煜明教授獲匈牙利塞麥爾維斯大學頒授榮譽博士學位。中大提供\n盧煜明亦屢獲國際殊榮，包括「湯森路透引文桂冠獎」、「科學突破獎—生命科學」、英國皇家學會生物學科「皇家獎章」等。盧煜明在今年亦獲英國劍橋大學頒授榮譽醫學科學博士學位。\n進一步鞏固兩校轉化醫學領域夥伴關係\n今次獲塞麥爾維斯大學頒授榮譽博士學位，進一步鞏固中大與塞麥爾維斯大學在轉化醫學領域的夥伴關係，促進歐洲與亞洲之間的科研合作及學術交流。雙方合作涵蓋聯合科研活動，以及學生和研究人員交流計劃。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8f9def7377","title":"蔡天鳳案・今日重點｜鄺港智自辯揭三角關係 否認謀財害命 鄺球認以殘肢混青紅蘿蔔煲湯棄垃圾站","url":"https://www.stheadline.com/society/3638998/蔡天鳳案今日重點鄺港智自辯揭三角關係-否認謀財害命-鄺球認以殘肢混青紅蘿蔔煲湯棄垃圾站","summary":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。","summary_short":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。","digest":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智…","points":["28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智…","案件踏入第41日審訊，鄺港智出庭作供，庭上大爆震撼內情，透露與蔡天鳳…","而鄺球則承認將蔡天鳳部分殘肢與青紅蘿蔔煲湯後棄置垃圾站，對於為何烹屍則只以「唔知點解」回應"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:22:28+08:00","size":1,"keywords":[],"body":"28歲名媛蔡天鳳於2023年2月疑遭殺害後肢解烹屍，前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。案件踏入第41日審訊，鄺港智出庭作供，庭上大爆震撼內情，透露與蔡天鳳、譚方駿維持三角關係多年，蔡天鳳為錢與譚方駿拍拖，鄺與蔡離婚後仍有性關係，而譚方駿其實「鍾意」的是鄺港智，想三人一起生活，譚家為傳宗接代亦不介意，後來鄺港智在內地相識新女友盧曉虹Ivy，卻因不捨蔡天鳳與譚方駿選擇與盧分手。而鄺球則承認將蔡天鳳部分殘肢與青紅蘿蔔煲湯後棄置垃圾站，對於為何烹屍則只以「唔知點解」回應。\n鄺港智自揭複雜三角關係「我哋三個真係好好㗎」\n鄺港智首日作供，憶述14歲與蔡天鳳同校相戀，並搬到蔡家同居，鄺曾學海南話為融入女家，與蔡母張燕花情同母子。鄺港智說女兒出生後，他為賺多點錢，牽涉盜竊案中，於是潛逃內地，蔡天鳳會到內地探望他，譚方駿後來亦會同行。鄺港智指「Chris（譚方駿）本身鍾意我嘅」，曾買碗米線向他示愛，鄺港智說譚方駿家人「想要小朋友，所以我哋就三個一齊囉，佢屋企人唔介意」。雖然三個人的關係複雜，但鄺港智形容「其實我哋三個真係好好㗎」，譚方駿就似是家人一樣，譚與蔡到內地探望他時，三人甚至同睡酒店一張床。即使蔡後來「改嫁」譚，蔡仍與鄺深吻並有性關係。\n鄺港智2022年於內地認識新女友盧曉虹Ivy，他形容是認真對待的關係，對方亦想跟他結婚。鄺港智向蔡坦白此事後，蔡哭着要求他回港，鄺港智思前想後，難捨蔡天鳳與譚方駿及子女，「又唔想害咗Ivy」加上自己正被通緝，最終與盧分手返港。\n相關新聞：\n蔡天鳳碎屍案｜鄺球認將蔡天鳳部分殘肢與青紅蘿蔔煮湯後扔垃圾站\n蔡天鳳碎屍案｜事前租龍尾村、凱旋門單位並添置工具 鄺球：「你可以講係巧合囉」\n蔡天鳳碎屍案｜鄺港智憶與蔡天鳳年少相戀 學海南話融入蔡家 與蔡母情同母子\n潛逃內地做名錶買賣生意大賺全給蔡天鳳\n鄺港智在代表大律師安華暉提問下說，2015年8月因涉盜竊案而「坐大飛」逃往內地，每程10萬元往返兩地，期間他經營買賣名錶生意賺逾2000萬元並將利潤交予蔡天鳳，自己在廣州以勞斯萊斯代步及用蔡天鳳等人信用卡。他又在內地從事商廈轉租項目投資，每月利潤約20至30萬元人民幣。\n相關新聞：\n蔡天鳳碎屍案｜指蔡天鳳為錢與譚方駿拍拖 二人離婚後仍與深吻性交 鄺港智：好正常啫\n蔡天鳳碎屍案｜鄺港智指與內地女友盧曉虹Ivy見家長 被蔡天鳳要求回港後分手\n支持賣加多利山單位可清還按揭\n就控方指鄺家為謀取加多利山單位而殺人，鄺港智直指「根本就無可能」。他稱十分支持賣樓搬往屯門，以方便子女就讀屯門哈羅香港國際學校及清還曼克頓山單位按揭，更曾說服鄺球簽署售樓授權書。惟他透露2022年中因女兒發燒，蔡天鳳與家姑李瑞香及鄺球爆粗互罵，鄺球一度欲揮手打蔡，自此翁媳決裂，蔡下令禁止鄺球入屋及見孫，鄺家只能瞞着她讓鄺球見孫。\n相關新聞：\n蔡天鳳碎屍案｜鄺港智指譚方駿「鍾意我」 譚家為傳宗接代不介意三角關係\n蔡天鳳碎屍案｜鄺港智：好支持賣加多利山單位搬屯門 方便上學順道還清按揭\n案發前租龍尾村及凱旋門單位買工具並非計劃\n控方再三質疑鄺球為何烹屍，鄺球只以「唔知點解」回應，又稱當時精神崩潰，忘記削骨剝肉過程，但同意曾將蔡天鳳部分殘肢加入青紅蘿蔔煲湯後扔到垃圾站。\n控方質疑鄺球在蔡天鳳死前約兩星期租用龍尾村單位並添置切割工具，又在情婦原租約未滿下以月租兩萬元租下凱旋門單位及替鄺港智辦新電話卡，認為準備、殺人、肢解及潛逃均屬三父子計劃。鄺球一概否認，辯稱租龍尾村是為做運動養生，買工具僅作裝修；而交出凱旋門租約及鑰匙，是因聽聞蔡天鳳常「俾面色佢（鄺港智）睇」，故提供落腳點，又反駁幼子水路潛逃回內地的說法。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8a2a65aa90","title":"機構指近期懷疑虐兒案大部分施虐者為家庭成員 促政府全面禁止體罰","url":"https://news.tvb.com/tc/1207312-機構指近期懷疑虐兒案大部分施虐者為家庭成員促政府全面禁止體罰","summary":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。其中一半個案涉及身體虐待，促請政府全面禁止體罰。","summary_short":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。","digest":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員","points":["防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員","其中一半個案涉及身體虐待，促請政府全面禁止體罰","防止虐待兒童會指，去年4月至今年3月接獲逾1,100宗求助"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T19:28:00+08:00","size":1,"keywords":["虐兒","體罰"],"body":"防止虐待兒童會上年度接獲約220宗懷疑虐兒個案，超過7成施虐者是家庭成員。其中一半個案涉及身體虐待，促請政府全面禁止體罰。\n\n社會接連發生體罰或虐兒事件。防止虐待兒童會指，去年4月至今年3月接獲逾1,100宗求助。當中約兩成與懷疑虐兒有關，涉及241名兒童，當中逾4成是3至8歲兒童。\n\n懷疑虐兒個案中，一半是身體虐待，其次是疏忽照顧佔約兩成，包括獨留在家等。亦有分別約一成涉及心理虐待及性侵犯。而逾7成施虐者是家庭成員，當中3成是母親，相信與管教困難，或對孩子期望過高等有關。\n\n防止虐待兒童會總幹事婁小君說：「家庭對於兒童而言，是最安全的地方。當他在家庭成員，遭受懷疑虐待行為，嚴重損害心理健康，例如不論信任，很容易產生驚恐、抑鬱，亦失去安全感，自我價值低落，覺得自己不配得到愛、關懷，更影響社交及人際關係。留意到自己管教及情緒上，意識到有波動，情況不知處理，盡快找專業人士。」\n\n《強制舉報虐待兒童條例》，實施至今10個月，防止虐待兒童會指，收到約960宗舉報及諮詢，其中專業人士的查詢按年減少。\n\n婁小君說：「過去一、兩年，在專業界別中，有很多意識或培訓，整個業界包括社署，在網上有保護兒童課程，根據指引專業人員，需向社署舉報，即保護家庭及兒童服務課或警務處，預見支援數字有分別。」\n\n機構又期望，政府能盡快訂立「沒有保護罪」， 更早識別、保護及介入。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20269ecN3rduup1795088171.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/d754639105d94a23903519812798fafa/a01eee3153614c1da93fb7e86efc32c1-b9c84ec9c9a2d1363b78c3bd280542c2-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20269ecN3rduup1795088171.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c771ce720ac","title":"《星島申訴王》揭二手名牌寄賣店結業｜累計303人報案 涉款增至$4190萬","url":"https://www.stheadline.com/breaking-news/3638986/星島申訴王揭二手名牌寄賣店結業累計303人報案-涉款增至4190萬","summary":"《星島申訴王》前日（17日）報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及「Vootic」的負責人突然失聯，大批寄賣客戶的名牌手袋及貨款不翼而飛，多名苦主在社交網求助。","summary_short":"《星島申訴王》前日（17日）報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及「Vootic」的負責人突然…","digest":"《星島申訴王》前日報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及「…","points":["《星島申訴王》前日（17日）報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及…","根據警方最新公佈的數字，截至今日（11月19日）下午6時，累計有303人報案…","警方指當中207人的報案，涉及銅鑼灣Vootic，涉款金額約3,000萬元…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T19:10:56+08:00","size":1,"keywords":[],"body":"《星島申訴王》前日（17日）報道兩間專營二手名牌寄賣店「樂星（Obsessplanet）」及「Vootic」的負責人突然失聯，大批寄賣客戶的名牌手袋及貨款不翼而飛，多名苦主在社交網求助。根據警方最新公佈的數字，截至今日（11月19日）下午6時，累計有303人報案，涉款增至約4190萬元。\n警方指當中207人的報案，涉及銅鑼灣Vootic，涉款金額約3,000萬元，其餘96人則涉及金鐘樂星，涉案金額約1,190萬元。警方將案件暫列「欺詐」，繼續交由灣仔警區重案組及中區警區重案組跟進。\n相關新聞 : 名牌寄賣店突關門 日籍東主失聯 苦主逾百 損失金額或逾2千萬 | 星島申訴王\n大批苦主早前向《星島申訴王》控訴日籍東主 Hide 及其妻 Victoria 的惡意欺詐行徑。其中有苦主透露，早前他幫親友寄賣多個Hermès及Chanel手袋，在發現「彈票」異常後上門交涉，驚見金鐘店正「搬空貨物」，東主當時仍推諉稱是搬往銅鑼灣店，最終導致親友慘失400萬港元。\n根據商業登記及公司註冊處資料，被指失聯的日籍負責人國里英泰（Kunisato Hideyasu，人稱 Hide），正是銅鑼灣寄賣店「Vootic」營運公司 Exodia Limited 的唯一董事。而Hide曾在接受傳媒訪問時，亦自稱金鐘海富中心「樂星」的負責人兼「駐場鑑證師」。\n目前警方已將金鐘海富中心的店舖拉閘封鎖，並在閘外貼上告示指店舖與欺詐案有關。警方呼籲，任何受影響市民或有資料提供之人士，立刻聯絡重案組報案。\n灣仔警區重案組：3660 7546 或 5466 9204\n中區警區重案組：3660 1182 或 6978 6686","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca8689ef9a2","title":"哈薩克一個服裝及紡織品牌落戶香港 冀拓展海外市場","url":"https://news.tvb.com/tc/1207273-哈薩克一個服裝及紡織品牌落戶香港冀拓展海外市場","summary":"中亞國家哈薩克一個當地服裝及紡織品牌落戶香港。品牌的特色，是以哈薩克傳統圖案及原創印花，設計時尚服飾及家居紡織品，以香港作為首個拓展海外業務的試點，期望透過香港作為亞洲貿易中心，測試本地及國際旅客反應，再拓展海外市場。","summary_short":"中亞國家哈薩克一個當地服裝及紡織品牌落戶香港。","digest":"中亞國家哈薩克一個當地服裝及紡織品牌落戶香港","points":["品牌的特色，是以哈薩克傳統圖案及原創印花，設計時尚服飾及家居紡織品…","投資推廣署指，特首年中率團訪問中亞，促成多份合作協議，今次是繼農業、資源公司進駐後…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:56+08:00","size":1,"keywords":[],"body":"中亞國家哈薩克一個當地服裝及紡織品牌落戶香港。\n\n品牌的特色，是以哈薩克傳統圖案及原創印花，設計時尚服飾及家居紡織品，以香港作為首個拓展海外業務的試點，期望透過香港作為亞洲貿易中心，測試本地及國際旅客反應，再拓展海外市場。\n\n投資推廣署指，特首年中率團訪問中亞，促成多份合作協議，今次是繼農業、資源公司進駐後，再有消費品類型公司來港，以本港作為試驗場。","image":"https://pro-vod-cdn.tvb.com/51ac2086068f43dd85d12670f541a878/snapshots/d7db0972716e40ddbb3651e3e8d56ee9-00005.jpg","video":"https://pro-vod-cdn.tvb.com/51ac2086068f43dd85d12670f541a878/8170a1e1fe9545ca837cbe9f70f3872b-948aab628f411c6db324ce27b7ffb3c4-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/51ac2086068f43dd85d12670f541a878/snapshots/d7db0972716e40ddbb3651e3e8d56ee9-00005.jpg","lang":"zh-Hant"},{"id":"c9a6de16cca","title":"恆豐酒店與錦倫旅運合謀定價罰款10.4萬 競委會上訴得直 改判罰款95萬","url":"https://www.stheadline.com/society/3638953/恆豐酒店與錦倫旅運合謀定價罰款104萬-競委會上訴得直-改判罰款95萬","summary":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間，因不滿同業在酒店的銷售價格較低，多次向酒店施壓，要求與對手落實定價。","summary_short":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間…","digest":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司…","points":["旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間…","競爭事務審裁處裁定他們合謀定價並違反《競爭條例》，去年下令恆豐酒店罰款10.4萬元","競委會認為罰款過低提出上訴，高等法院上訴庭今頒下判詞，裁定競委會上訴得直…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:43:52+08:00","size":1,"keywords":[],"body":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間，因不滿同業在酒店的銷售價格較低，多次向酒店施壓，要求與對手落實定價。競爭事務審裁處裁定他們合謀定價並違反《競爭條例》，去年下令恆豐酒店罰款10.4萬元。競委會認為罰款過低提出上訴，高等法院上訴庭今頒下判詞，裁定競委會上訴得直，指原審判刑未能反映嚴重性及起阻嚇，終改判恆豐酒店罰款95萬元。\n上訴方為競爭事務委員會，而答辯方為擁有恆豐酒店的Prudential Hotel(BVI) Limited。\n競委會指罰款額須超違規行為得益以阻嚇\n上訴方早前提出認為罰款10.4萬元過低，強調罰款額須超越違規行為所得的利益，以作出足夠阻嚇作用，維護公平競爭環境，否則難以體現違反競爭法的嚴重性。恆豐酒店一方則指，罰款10.4萬元已足夠反映其罪責，重申恆豐酒店並非整個安排的發起者，只是充當「促成者」角色。\n判詞指，恆豐酒店一方與其他涉案人士合謀定價，雖然恆豐酒店只負責協調安排，它每月向錦倫收取固定租金，並不受涉案門票銷售額影響，但事件性質嚴重，涉及到合謀定價及排除基本競爭，符合條例下嚴重反競爭行為的定義，屬於價格競爭中典型的侵害行為，而價格競爭在經濟巿場上如同中樞神經系統一般。\n恆豐擔當中間人角色參與程度不被動 \n判詞續指，恆豐酒店即使沒有因應涉事門票銷售額而直接影響收入，它在合謀仍有着關鍵角色，而非純粹被動，例如恆豐酒店會負責把綿倫的價格轉達給Tink Labs、並要求Tink Labs跟隨定價，它擔當了中間人角色；甚至會令人懷疑，如果沒有恆豐酒店的協調，涉案合謀能否落實。\n恆豐酒店一方原被判罰款10.4萬元，這甚至少過它在案發時的租金收入，上訴庭認為競爭事務審裁處在原審判刑時未有充分考慮阻嚇需要，為反映案中合謀的嚴重性及恆豐酒店的參與程度，終改判罰款95萬元、須於42日內支付，並須向競委會一方支付訟費。\n案件編號：CACV218/2025\n法庭記者：王仁昌","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf268f4238c","title":"市建局土瓜灣道／榮光街發展計劃 由信和夥鷹君財團以26.88億元投得","url":"https://www.stheadline.com/society/3638952/市建局土瓜灣道榮光街發展計劃-由信和夥鷹君財團以2688億元投得","summary":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作，發展土瓜灣道／榮光街發展計劃，中標金額為26.88億元。","summary_short":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作…","digest":"市建局公布，經過公開招標程序後…","points":["市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成…","市建局預計項目將於2032年落成","市建局發言人表示，多間主要發展商均有參與是次投標，入標數量與出價均在預期之內…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:42:19+08:00","size":1,"keywords":[],"body":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作，發展土瓜灣道／榮光街發展計劃，中標金額為26.88億元。市建局預計項目將於2032年落成。\n市建局：入標數量與出價均在預期之內\n今次項目於11月11日截標時共接獲三份標書。由市建局董事會設立的招標遴選小組在審慎評估標書後，建議將合約批予「天瑋有限公司」，並獲董事會接納。市建局發言人表示，多間主要發展商均有參與是次投標，入標數量與出價均在預期之內，最終中標價亦相當貼近市價。市建局在與中標財團完成簽訂發展合約後，將以不記名方式適時公布其餘未中標公司的投標金額。\n發揮「小區重建」協同效應\n土瓜灣道／榮光街項目為市建局首個「小區重建新社區」（Victoria Cove Central，簡稱VCC）的最後一期。連同是次批出的項目，整個VCC共八個項目已匯聚八間主要發展商參與，反映小區規劃模式獲市場支持。\n市建局行政總監蔡宏興對參與投標的發展商及財團表示感謝。他指出，今次入標的發展商中，有三間均有參與發展VCC或毗鄰項目，證明業界充分肯定VCC整全規劃的長遠價值。他續稱，新項目將與區內另外七個正施工的重建項目產生協同效應，配合市建局提出的「海—岸—陸」整體規劃方針，營造更具活力的社區，並響應構建「東維港灣區」的願景。\n建兩條行人天橋成「超級連接」 \n根據規劃，是次項目除作商住用途外，亦兼負改善區內步行環境及社區配套的重任。項目將興建兩條行人天橋，貫通港鐵土瓜灣站及毗鄰七個重建項目，形成「超級連接」網絡；同時將提供不少於5,500平方米的非住用樓面面積作社福設施用途，並增設公共空間。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9b20c8a078","title":"聽▶︎港聞｜鄺港智供稱譚方駿鍾意自己／港青可獲智利一年簽證／午夜氣溫料最低約18度｜2026年11月19日","url":"https://news.tvb.com/tc/1207240-聽港聞鄺港智供稱譚方駿鍾意自己港青可獲智利一年簽證午夜氣溫料最低約18度2026年11月19日","summary":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地，其後用相同方法，往返內地和香港，每次都是包船，費用是10萬元，自己有能力支付。","summary_short":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地…","digest":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，201
