畅谈五个多小时，翻出珍藏多年的老照片，临别还唱起儿时童谣。\n\n　　“祖(籍)国强大，我们在海外的华人脸上才有光。”这是许多老侨胞反复和陈映玲说的一句话。\n\n　　今年在海内外出圈的潮语电影《给阿嬷的情书》，勾起无数人对阿嬷、对长辈的思念，让更多人回望那段浮沉商海的下南洋岁月，也让陈映玲对“侨”有了更深体会。\n\n　　走访愈多，陈映玲心中的紧迫感愈发强烈，“聆听者一直都在，但是讲故事的人不断在减少”。\n\n　　陈映玲透露，今年6月，她启动华侨华人纪录片《暹罗潮声》拍摄，目前主体素材已基本拍完，计划明年1月推出。\n\n　　从短视频转向纪录片创作，并非科班出身的陈映玲一路走了不少弯路，却依旧想尽力留住时代记忆，留给后辈寻根溯源的影像。\n\n　　在陈映玲看来，侨界青年的责任，未必是做出惊天动地的大事。“我们这一代青年接过的是先辈留下的心火，也许是守住祖辈的乡音，也许是回到故乡走一走，也许是认真听一位老人想要讲完他一生的故事，再把这个故事告诉更多人，把情谊延续下去。”\n\n11月20日，短视频创作者、电影《给阿嬷的情书》参演者陈映玲在海口分享发言。中新网记者 骆云飞 摄\n\n　　这是陈映玲第一次踏足海南。在此之前，她在泰国采访过大量海南籍侨胞，早就听遍琼侨下南洋的故事，对这片土地满怀亲近。\n\n　　在陈映玲看来，海南与潮汕同为侨乡，琼侨、潮侨、客家侨胞同闯南洋，敢闯敢拼、心系故土的精神内核一脉相连。\n\n　　“在泰国侨社里面，海南籍乡亲、潮汕乡亲一起聊天，我说潮汕话他们听得懂，他们讲海南话我也能大致跟上，彼此可以边听边猜着交流，语言、文化上的距离很近。”陈映玲说。\n\n　　谈及海南自贸港建设，陈映玲表示，除了关注各项开放政策，她更看重这片土地包容开放的文化生态。“这也是我这次来到海南，想要实地感受、观察的地方。”\n\n　　陈映玲期待大会后续的骑楼老街、自贸港产业园区走访行程，希望用年轻人喜爱的表达方式，记录海南侨文化、自贸港故事，把侨乡故事传递出去。\n\n　　“不少青年参与侨社事务，多是遵从长辈安排，缺少主动探寻侨史的内生动力。”常年扎根海外，陈映玲观察到华裔新生代的现状，这也成为她此行最想对接海内外侨青、交流思想的缘由。\n\n　　“不用刻意雕琢复杂的话术，顺着自己真实的感受、讲真实的故事就好，这份心意，大家是可以感知的。”陈映玲说，侨的情义跨越山海，不受地域局限，她愿做一名忠实的记录者，让先辈的故事不只留在他们的年代，跨越山海、代代相传。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7a6e1690fa","title":"香港人工智能与生命科学伦理研究院成立","url":"https://www.chinanews.com.cn/dwq/2026/11-21/10735673.shtml","summary":"中新网香港11月21日电 (记者 张语洽)香港人工智能(AI)与生命科学伦理研究院成立仪式20日在香港举行，同场举办《人的革命：AI时代的人类增强史》新书研讨会。","summary_short":"中新网香港11月21日电 (记者 张语洽)香港人工智能(AI)与生命科学伦理研究院成立仪式20日在香港举行…","digest":"香港人工智能(AI)与生命科学伦理研究院成立仪式20日在香港举行…","points":["中新网香港11月21日电 (记者 张语洽)香港人工智能(AI)与生命科学伦理研究院成立仪式2…","当日，该研究院与中国人民大学社会科学高等研究院(深圳)、香港管理学院达成合作意向","该研究院以“确保AI与生命科学服务于每一个人的尊严与福祉”为宗旨，贯通金融经济、投资、法律…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:27:04+08:00","size":1,"keywords":[],"body":"中新网香港11月21日电 (记者 张语洽)香港人工智能(AI)与生命科学伦理研究院成立仪式20日在香港举行，同场举办《人的革命：AI时代的人类增强史》新书研讨会。当日，该研究院与中国人民大学社会科学高等研究院(深圳)、香港管理学院达成合作意向。\r\n\n　　该研究院以“确保AI与生命科学服务于每一个人的尊严与福祉”为宗旨，贯通金融经济、投资、法律、哲学、医学、AI科学、材料科学与公共政策等领域，就AI与生命科学的伦理、法律及社会影响开展跨学科研究、政策分析与公众教育。\n\n　　香港人工智能与生命科学伦理研究院董事局主席、新书作者李鹰表示，以往的技术革命主要改变人类的外部环境，而AI技术开始直接作用于人的智能与身体。他在新书研讨会上介绍，《人的革命：AI时代的人类增强史》一书试图在较长的历史周期中看待AI革命的历史地位。当 AI 与生命科学交叉融合、 AI 被用于促进人的自我增强时，伦理建设应当先行。他主张以中华文明作为相关建设的伦理基座，同时，任何文明资源需要经过当代转化，与其他文明展开真诚对话，形成全球共识。\n\n　　李鹰表示，香港既具备国学研究基础，也拥有对接海外学界的渠道，可发挥多元交流平台作用，推动AI生命科学伦理建设并与国际社会交流。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7d23870688","title":"单霁翔：让灿烂文化有尊严地传给子孙后代","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735668.shtml","summary":"中新网杭州11月21日电 (王潇婧)11月20日，浙江省社会主义学院(浙江中华文化学院)第9期“共识讲堂”开讲。","summary_short":"中新网杭州11月21日电 (王潇婧)11月20日，浙江省社会主义学院(浙江中华文化学院)第9期“共识讲堂”开讲。","digest":"11月20日，浙江省社会主义学院(浙江中华文化学院)第9期“共识讲堂”开讲","points":["中新网杭州11月21日电 (王潇婧)11月20日…","故宫博物院第六任院长单霁翔受邀作专题报告，以“讲好中国故事，传播中华传统文化”为主题…","各民主党派浙江省委会、浙江省侨联、有关统战团体成员…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:20:53+08:00","size":1,"keywords":[],"body":"中新网杭州11月21日电 (王潇婧)11月20日，浙江省社会主义学院(浙江中华文化学院)第9期“共识讲堂”开讲。故宫博物院第六任院长单霁翔受邀作专题报告，以“讲好中国故事，传播中华传统文化”为主题，带来一场兼具深度与温度的文明对话。各民主党派浙江省委会、浙江省侨联、有关统战团体成员，“文化出海”企业代表以及浙江全省社会主义学院、部分高校干部教师、研究生等线上线下众多观众聆听。\n\n2026年11月20日，浙江省社会主义学院(浙江中华文化学院)第9期“共识讲堂”现场。　主办方 供图\n\n　　现场，单霁翔立足四十余年文化遗产保护的实践与思考，结合良渚古城、西湖、北京中轴线“申遗”和故宫博物院文化遗产保护与利用的实践，以一个个生动鲜活的案例，深入浅出地阐释了讲好中国故事、传播中华文化的理念与路径，深刻阐明了从“文物保护”走向“文化遗产保护”的理念之变、让文物“活起来”的实践之道，以及讲好中国故事的文化之魂。\n\n　　谈及文化遗产保护实践，单霁翔重点以杭州西湖申遗历程为例。他表示，西湖凭借深厚的诗词文脉底蕴与“三面云山一面城”的独特城市格局，诠释了东方审美与人文内涵。申遗过程中，杭州严守城市天际线，坚持整体风貌保护；申遗成功后，当地率先设立世界遗产监测中心，构建常态化保护机制，实现老城文脉守护与新城现代化建设相得益彰、相融共生。\n\n　　“过去我们讲文物保护，关注的是文化要素、静态古迹；今天讲文化遗产保护，强调的是文化与自然不可分割，是动态活态的传承。”在单霁翔看来，保护和利用都不是最终目的，唯有传承才是核心。讲好中国故事，最终是要将祖先创造的灿烂文化有尊严地传给子孙后代。\n\n　　据悉，开展政治共识教育，不断增进统一战线成员的政治认同、思想认同、理论认同和情感认同，是社会主义学院的主责主业。为教育引导学员准确把握党的创新理论，学习传承中华优秀文化，深入了解世情国情，持续筑牢团结奋斗的思想根基，浙江省社会主义学院常态化举办“共识讲堂”，定期邀请名家名师作专题辅导报告。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7cd58fa8db","title":"英才青年聚海口 “侨”见自贸港新机遇","url":"https://www.chinanews.com.cn/hr/2026/11-21/10735669.shtml","summary":"中新网海口11月21日电 (记者 符宇群)“大湾区制造业基础扎实、产业链配套完善、人才资源集聚，海南则具备独特的自贸港政策优势，两地产业互补性突出。","summary_short":"中新网海口11月21日电 (记者 符宇群)“大湾区制造业基础扎实、产业链配套完善、人才资源集聚…","digest":"“大湾区制造业基础扎实、产业链配套完善、人才资源集聚，海南则具备独特的自贸港政策优势…","points":["中新网海口11月21日电 (记者 符宇群)“大湾区制造业基础扎实、产业链配套完善…","”广东省客家青年企业家联合会会长、广东东升控股集团有限公司总裁赖志光说…","11月20日，以“客聚琼州 侨见未来”为主题的2026年侨海(客家)青年发展大会在海口开幕"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:17:07+08:00","size":1,"keywords":[],"body":"中新网海口11月21日电 (记者 符宇群)“大湾区制造业基础扎实、产业链配套完善、人才资源集聚，海南则具备独特的自贸港政策优势，两地产业互补性突出。”广东省客家青年企业家联合会会长、广东东升控股集团有限公司总裁赖志光说，这也是不少广东企业家选择来琼布局项目的重要原因。\n\n　　11月20日，以“客聚琼州 侨见未来”为主题的2026年侨海(客家)青年发展大会在海口开幕。海内外侨界、客家青年以侨为纽带，共话自贸港开放新机遇，从文化根脉传承谈到产业落地布局，从民间人文交流讲到跨境协同合作，勾勒出新时代侨青奔赴自贸港的多元图景。\n\n11月20日，2026年侨海(客家)青年发展大会在海口开幕。中新网记者 骆云飞 摄\n\n　　海南封关后基础设施、配套政策持续完善，国际化营商环境不断提升。赖志光看好文旅、贸易领域的发展，目前正在筹备海南项目。此次，他组织200多名青年参会，希望依托大会平台，推动大湾区产业链、技术资源对接海南自贸港，携手共谋发展。\n\n　　看好海南自贸港低碳赛道机遇，法国唯勤国际有限公司总经理、海南泰娆能源科技有限公司执行董事李洹今年7月在海南新设企业。在他看来，海南坚持绿色低碳发展，叠加通关便利、跨境资金通道、“双15%”税收优惠等红利，是布局低碳产业的优选之地。\n\n　　“海南自贸港不只是面向国内市场的热土，更能作为企业开拓亚洲市场的支点。”李洹说，此行他计划对接洋浦海上风电、绿色甲醇等本地产业链资源，推动法国低碳技术落地，将海南作为业务总部、亚洲总部的布局地。\n\n　　爱尔兰华协会秘书长、全国青联海外学人华侨界别秘书长马瀚龙长期深耕中欧农产品跨境贸易，主营爱尔兰优质肉类对华出口。他说，老一辈华侨曾靠着“三把刀”扎根海外，新时代侨青承接先辈商贸积淀，更多转向国际贸易、跨境电商赛道。\n\n　　本次参会，马瀚龙期待搭建两地经贸桥梁，促进两地人文交流。他希望借助海南自贸港枢纽优势，打通双向通道：引进爱尔兰优质农产品，同时以爱尔兰为跳板，把中国国产AI、智能机器人等科创产品推向欧洲。\n\n　　《给阿嬷的情书》参演者、短视频创作者“泰国V姐”陈映玲深耕侨题材内容创作，常年在泰国采访侨胞，与不少海南籍侨胞结缘。在她看来，琼侨、潮侨、客家侨胞有着相通的下南洋闯拼精神，爱国爱乡、重情重义的底色一脉相承。\n\n　　陈映玲正在拍摄侨主题纪录片《暹罗潮声》，预计明年1月推出。“打动观众的核心永远是真诚。”她计划在海南采风挖掘侨文化素材，用青年喜闻乐见的创作形式讲好侨故事，期待海内外侨青在自贸港寻找文化合作新契机。\n\n　　作为中国重要侨乡，海南自贸港正持续吸引侨界青年、归国留学人才前来创新创业。当地不断出台扶持举措，加快推进海南自贸港侨海创新创业园建设。多位侨青代表受访表示，切身感受到自贸港日新月异的变化，希望吃透政策红利、对接合作资源，共赴发展新机遇。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c85166497fe","title":"花壇藏屍案｜整容女魔頭判死提上訴 遺孤痛斥：只求多活一天毫無悔意","url":"https://www.stheadline.com/realtime-china/3639546/花壇藏屍案整容女魔頭判死提上訴-遺孤痛斥只求多活一天毫無悔意","summary":"備受矚目的四川瀘州「天台花壇藏屍案」有最新進展！","summary_short":"備受矚目的四川瀘州「天台花壇藏屍案」有最新進展！","digest":"備受矚目的四川瀘州「天台花壇藏屍案」有最新進展","points":["備受矚目的四川瀘州「天台花壇藏屍案」有最新進展","被指是「農夫與蛇」現實版、謀財害命並整容改名潛逃28年的女死囚陳某芬，不服一審死刑判決…","受害人兒子得知消息後極度憤怒，痛斥對方「毫無悔意，就是想多活一天算一天」…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:15:00+08:00","size":1,"keywords":[],"body":"備受矚目的四川瀘州「天台花壇藏屍案」有最新進展！被指是「農夫與蛇」現實版、謀財害命並整容改名潛逃28年的女死囚陳某芬，不服一審死刑判決，於上訴期限最後一天（20日）正式提出上訴。受害人兒子得知消息後極度憤怒，痛斥對方「毫無悔意，就是想多活一天算一天」，並堅決表態會跟進到底，直至兇手依法伏法。\n相關新聞：四川花壇藏屍案｜借4萬殺債主埋屍28年 整容女逃犯判死前夫死緩\n上訴期最後一日送達材料\n綜合內媒報道，四川省瀘州市中級人民法院於本月10日對這宗跨越28年的積案作出一審公開宣判。法院裁定主謀陳某芬犯故意殺人罪、偽造身份證件罪及偷越國（邊）境罪等，數罪併罰判處死刑；其前夫兼同謀楊某根則被判處死刑，緩期兩年執行。\n11月20日是刑事上訴期限的最後一天。受害人吳某萍的兒子黃平主動向法院核實，證實陳某芬不服一審判決，已於當日下午正式將上訴材料送達法院，目前案件已正式進入二審上訴階段。\n黃平透露，在一審庭審尾聲時，共犯楊某根對犯罪事實供認不諱並表示不上訴；然而主謀陳某芬卻當庭翻供，將殺人罪責全數推給前夫，辯稱自己只是「受慫恿作案」。黃平痛批陳某芬的翻供與上訴行為極其無恥，根本沒有任何悔改心理，上訴完全是為了苟延殘殘、多活一天。\n相關新聞：奇案解密︱老闆娘借¥4萬反遭害命埋屍花壇 兇手改名整容潛逃28年終落網\n家屬：堅持跟進\n回顧案情，1997年2月1日，在服裝城經營羊毛衫批發的34歲女老闆吳某萍，因4萬元人民幣債務糾紛，被相鄰鋪位、曾多次受其恩惠的陳某芬及楊某根誘騙至倉庫內掐死並劫走首飾，屍體隨後被埋入商城天台的花壇中。陳某芬在案發後利用漏洞改名並多次到韓國整容，潛逃28年；直至2025年6月頂樓防水施工拆除花壇時意外挖出白骨，這起冤案才得以揭發。\n當年初僅10歲的黃平因此成為孤兒，漂泊尋母28年，至去年DNA比對成功才在天台尋回母親遺骨。\n面對陳某芬企圖透過上訴求生，黃平表示，他和家人對此「早已做好心理準備」。他直言，對方的垂死掙扎只是在拖延案件進程，「無論上訴周期多久、流程多長，即使家庭面臨再大困難，我都會堅持跟進案件全程，直至看到兇手被依法處決的那一天，為九泉之下的母親討回公道。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c657a915907","title":"金價跌勢持續｜深圳水貝現買金潮 中港與外籍客湧入掃貨","url":"https://www.stheadline.com/realtime-china/3639540/金價跌勢持續深圳水貝現買金潮-中港與外籍客湧入掃貨","summary":"國際金價近日上演「高空跳水」，倫敦現貨黃金價格跌破每盎司3600美元大關，創一年多新低！","summary_short":"國際金價近日上演「高空跳水」，倫敦現貨黃金價格跌破每盎司3600美元大關，創一年多新低！","digest":"國際金價近日上演「高空跳水」，倫敦現貨黃金價格跌破每盎司3600美元大關…","points":["國際金價近日上演「高空跳水」，倫敦現貨黃金價格跌破每盎司3600美元大關，創一年多新低","內地金價亦跌入「7字頭」，作為亞洲最大黃金集散地的深圳水貝市場隨即掀起搶購熱潮…","綜合《每日經濟新聞》等內媒報道，受美聯儲官員近期頻釋「鷹派」加息言論…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:48:00+08:00","size":1,"keywords":[],"body":"國際金價近日上演「高空跳水」，倫敦現貨黃金價格跌破每盎司3600美元大關，創一年多新低！內地金價亦跌入「7字頭」，作為亞洲最大黃金集散地的深圳水貝市場隨即掀起搶購熱潮，大批北上港人及外國遊客湧入「掃平金」。\n美聯儲加息預期升溫擊落金價\n綜合《每日經濟新聞》等內媒報道，受美聯儲官員近期頻釋「鷹派」加息言論、美元指數攀上19個月新高等多重因素壓制，國際金價連續多日暴跌。昨日（20日）上午，倫敦現貨黃金價格正式跌破每盎司3600美元整數關口，盤中最低下探至3540美元附近，創一年多以來新低，較今年1月29日創下的5598.75美元歷史高位，累計回撤幅度已超過35%。\n在國際金價急瀉之下，內地市場同步承壓。上海黃金交易所現貨黃金Au99.99價格昨日跌破每克800元人民幣大關，最低下探至793.44元，正式步入「7字頭」時代。一線珠寶品牌如周大福、老鳳祥等的足金飾品掛牌價，亦應聲下調至每克約1088至1132元，短短一周內每克暴跌逾百元，較年內高位更是累計回落近600元。\nAPEC效應外籍客也「淘金」\n在深圳水貝黃金市場，大屏幕上的綠色跌幅卻點燃了消費者的「撈底」熱情。由於水貝足金首飾實際成交價約在每克847元（另加每克十幾至幾十元工費），相比品牌金店每克便宜近300元，吸引了大批剛需買家前來選購婚嫁金飾及投資金條。\n剛巧本周正值深圳舉辦APEC會議，商圈內人頭湧湧，除了大批北上掃貨的港人外，還有來自俄羅斯、墨西哥和馬來西亞的外籍客商拉著行李箱前來瘋狂「淘金」，客流量比平日激增。\n不過相較買金的熾熱，賣金套現的散戶則多選擇觀望。由於金價變動極快，水貝黃金回收店舖近日推出「定金鎖價」套路——顧客只需支付500元人民幣定金，即可鎖定當刻約每克790元的回收價，鎖定期為一天；若當天未交易，定金將不予退還。\n專家提醒，此輪暴跌警示黃金並非只漲不跌，投資者切忌在破位下跌中盲目補倉或盲目抄底，應將其作為中長期資產配置，理性看待價格波動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c817970a28f","title":"（深圳APEC）出席APEC会议的多国领导人明确表态：坚定恪守一个中国原则","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735652.shtml","summary":"中新社深圳11月20日电 (记者 李京泽 国璇)17日至20日，中国国家主席习近平在深圳密集会见来华出席亚太经合组织(APEC)领导人非正式会议的APEC成员经济体领导人。","summary_short":"中新社深圳11月20日电 (记者 李京泽 国璇)17日至20日…","digest":"（深圳APEC）出席APEC会议的多国领导人明确表态：坚定恪守一个中国原则","points":["中新社深圳11月20日电 (记者 李京泽 国璇)17日至20日…","在会见中，多位APEC成员经济体领导人明确表示，坚定恪守一个中国原则","11月19日，习近平会见美国总统特朗普"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T10:35:59+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 李京泽 国璇)17日至20日，中国国家主席习近平在深圳密集会见来华出席亚太经合组织(APEC)领导人非正式会议的APEC成员经济体领导人。在会见中，多位APEC成员经济体领导人明确表示，坚定恪守一个中国原则。\n\n　　11月19日，习近平会见美国总统特朗普。今年以来，从北京到华盛顿再到深圳，中美元首已三度面对面互动。在此次会见中，特朗普明确表示，美国不支持“台独”。\n\n　　新加坡总理黄循财表示，新方坚定奉行一个中国政策，反对“台独”。\n\n　　印度尼西亚总统普拉博沃明确表示，“台湾是中华人民共和国的一个省”。马来西亚总理安瓦尔也指出，台湾问题是中国内政，马方坚定恪守一个中国政策。\n\n　　当前，中澳关系稳定发展，两国各领域交流合作持续深化。澳大利亚总理阿尔巴尼斯20日在会见中说，澳大利亚“承诺坚持一个中国政策”，愿同中方密切高层交往，加强贸易、投资、人工智能等领域务实合作。\n\n　　韩国总统李在明称，韩方坚持一个中国的政策“没有也不会改变”，愿以明年两国建交35周年为契机，同中方密切高层交往。\n\n　　泰国总理阿努廷、墨西哥总统辛鲍姆和秘鲁总统藤森庆子也都表示，坚定恪守一个中国原则。\n\n　　智利总统卡斯特说，智利将毫不动摇坚持一个中国政策，深化与中国的良好关系。\n\n　　今年是中国和巴布亚新几内亚建交50周年。巴新总理马拉佩表示，建交50年来，巴新始终恪守一个中国原则，坚定支持中国维护国家主权和领土完整，坚定支持中国实现国家统一、推进民族复兴。(完) 【编辑:张燕玲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfea03a1df8","title":"外媒记者访云南迪庆：“当地各民族生活很幸福”","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735649.shtml","summary":"中新网云南迪庆11月21日电 (罗婕)近日，来自老挝、缅甸、柬埔寨的外媒记者走进云南省迪庆藏族自治州，实地探访当地产业发展，见证各族民众生活变迁。","summary_short":"中新网云南迪庆11月21日电 (罗婕)近日，来自老挝、缅甸、柬埔寨的外媒记者走进云南省迪庆藏族自治州…","digest":"近日，来自老挝、缅甸、柬埔寨的外媒记者走进云南省迪庆藏族自治州，实地探访当地产业发展…","points":["中新网云南迪庆11月21日电 (罗婕)近日，来自老挝、缅甸…","柬埔寨东盟通讯社记者Chhan Linda感慨，当地民众开办民宿、经营酒庄、传承黑陶技艺…","迪庆州地处滇川藏三省区结合部，藏族、傈僳族、纳西族等各族民众安居于此"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T10:29:03+08:00","size":1,"keywords":[],"body":"中新网云南迪庆11月21日电 (罗婕)近日，来自老挝、缅甸、柬埔寨的外媒记者走进云南省迪庆藏族自治州，实地探访当地产业发展，见证各族民众生活变迁。柬埔寨东盟通讯社记者Chhan Linda感慨，当地民众开办民宿、经营酒庄、传承黑陶技艺，富起来后还不忘带动邻里，非常团结。\n\n　　迪庆州地处滇川藏三省区结合部，藏族、傈僳族、纳西族等各族民众安居于此。这里位于“三江并流”世界自然遗产核心区，拥有“香格里拉”“梅里雪山”“茶马古道”等世界级文旅IP。为期五天的走访行程里，各国记者先后赴维西傈僳族自治县、香格里拉市等地，沉浸式领略高原风光、产业发展，感受人与自然和谐共生的生态之美。\n\n图为在云南省白马雪山国家级自然保护区响古箐，滇金丝猴正在觅食。　罗婕 摄\n\n　　老挝新万象报记者Souliyo Sengngam并非初次到访云南，却是第一次深入乡村与自然保护区。在白马雪山国家级自然保护区响古箐，他亲眼见到，经过持续保护，中国特有珍稀濒危保护动物滇金丝猴种群稳步恢复。“我看到云南的生物多样性保护，是推动文化、生态环境与经济协同发展，在守护自然的同时，还能惠及地方。”\n\n　　恰逢中老铁路开通运营五周年，Souliyo Sengngam表示，这条大通道为老挝贸易、文旅产业发展带来很多新机遇。“这条铁路已经足够好了，期待未来铁路能继续延伸，惠及更多人。”\n\n图为各国记者在云南省维西县塔城镇启别村了解民宿发展情况。　罗婕 摄\n\n　　在维西县塔城镇启别村，藏、傈僳、纳西等多民族特色民宿连片集聚；走进香格里拉市尼西乡汤堆村，户户门前摆放陶坯，百余座黑陶工坊里，传承人们守正创新，让古老黑陶技艺焕发新生。\n\n　　缅甸《金凤凰》中文报社记者Akari San在探访中读懂了当地年轻人的乡愁。“不论是塔城民宿经营者，还是尼西黑陶手艺人，不少人曾离乡务工闯荡，在家乡需要时返乡创业。他们不只为了自己赚钱，更带着家乡一同增收发展，这些故事非常感人。”\n\n图为各国记者体验尼西黑陶制作。　罗婕 摄\n\n　　在香格里拉，采访团体验藏民家访特色文旅项目，品鉴酥油茶、牦牛肉、糌粑，观赏弦子舞、锅庄等，了解藏族服饰，近距离感受藏族民俗文化。\n\n　　Chhan Linda说，“在柬埔寨，我们很少拼桌共餐。但在这里，素不相识的人围坐一桌，很快就像熟人一样。餐后大家没有急着离开，而是围着火塘手拉手共跳锅庄舞，让我好放松、好亲切，就像回到家一样。”(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbb04f46c0c","title":"“我们把彼此视为重要合作伙伴”——访墨西哥外贸、投资和技术委员会墨中分委会主席巴尔德斯","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735658.shtml","summary":"“我们把彼此视为重要合作伙伴”(APEC中国年：开放 创新 合作)  　　——访墨西哥外贸、投资和技术委员会墨中分委会主席巴尔德斯  　　“深圳APEC会议进一步推动各方加强对话、深化产业合作…","summary_short":"“我们把彼此视为重要合作伙伴”(APEC中国年：开放 创新 合作)  　　——访墨西哥外贸…","digest":"“我们把彼此视为重要合作伙伴”(APEC中国年：开放 创新 合作)  　　——访墨西…","points":["“我们把彼此视为重要合作伙伴”(APEC中国年：开放 创新 合作)","“深圳APEC会议进一步推动各方加强对话、深化产业合作…","”墨西哥外贸、投资和技术委员会墨中分委会主席拉斐尔·巴尔德斯日前在接受本报记者专访时说"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T10:23:10+08:00","size":1,"keywords":[],"body":"“我们把彼此视为重要合作伙伴”(APEC中国年：开放 创新 合作)\n\n　　——访墨西哥外贸、投资和技术委员会墨中分委会主席巴尔德斯\n\n　　“深圳APEC会议进一步推动各方加强对话、深化产业合作，把建设亚太共同体的愿景转化为企业能够参与、受益的具体项目。”墨西哥外贸、投资和技术委员会墨中分委会主席拉斐尔·巴尔德斯日前在接受本报记者专访时说。\n\n　　巴尔德斯认为，工商界需要开放市场、稳定预期和长期合作。企业开展跨境经营，离不开透明可预期的监管环境，以及有利于投资和创新的政策条件。中方提出“开放、创新、合作”三大优先领域，契合各方共同需求，为深化合作提供了重要契机。\r\n\n　　巴尔德斯表示，中国与APEC各经济体联系紧密，能够共同构建更加稳固的产业链供应链。墨西哥拥有制造业基础和产业人才；中国在先进制造、机械、自动化、电池和清洁能源技术等领域具备优势。双方可以通过共同投资、技术合作和本地供应商配套，把现有经贸联系转化为更加紧密的产业合作。“我们把彼此视为重要合作伙伴。”巴尔德斯说。\n\n　　“能源转型既带来机遇，也关乎我们对环境的责任，以及应对气候变化的紧迫需要。”巴尔德斯表示，中国企业同墨西哥企业在能源领域开展合作，既输出设备，也参与项目投资与发电运营，同时带动配套服务和供应链落地，展现出技术、资本与当地产业需求深度对接的广阔合作潜力。双方可以在风电、光伏、储能、电网和能效提升等领域进一步深化合作。\n\n　　巴尔德斯认为，APEC经济体可以推动兼顾技术创新、生产率提升和可持续发展的合作议程。人工智能助力优化生产规划和物流安排，数字化有助于简化海关手续、便利贸易，清洁技术则可以降低能源成本。推动这些技术服务于生产经营的具体环节，将为墨中合作培育新的增长动力。巴尔德斯尤其希望更多中小企业参与其中，“APEC可以通过企业对接、技术培训和数字工具应用等，帮助中小企业寻找合作伙伴、获取技术、融入供应链，让更多企业分享国际合作机遇”。\n\n　　墨西哥将于2028年担任APEC东道主。巴尔德斯认为，中国的议程安排，以及对基础设施、制度和人员之间互联互通的重视，值得墨西哥借鉴。墨方应把握主办APEC会议的契机，加强与亚洲伙伴的联系，推动生产和可持续投资，促进中小企业国际化。“APEC的巨大潜力，在于通过政府间对话，促成企业间的务实项目合作。对墨西哥而言，这意味着在发挥与地区市场紧密联系优势的同时，加强与中国及亚太其他经济体的经贸和技术联系。”巴尔德斯说。\n\n　　本报记者 王骁波 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb130d0f0d9","title":"贵州毕节聚焦群众急难愁盼，完善支持保障机制 温暖193万人的外出务工路","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735645.shtml","summary":"贵州毕节聚焦群众急难愁盼，完善支持保障机制  　　温暖193万人的外出务工路(深阅读)  　　贵州是劳务输出大省，外出务工规模常年在600万人左右。","summary_short":"贵州毕节聚焦群众急难愁盼，完善支持保障机制  　　温暖193万人的外出务工路(深阅读)  　　贵州是劳务输出大省…","digest":"贵州毕节聚焦群众急难愁盼…","points":["温暖193万人的外出务工路(深阅读)","贵州是劳务输出大省，外出务工规模常年在600万人左右","毕节作为贵州劳务人口输出最多的地级市，现有193万人外出务工，其中157万人跨省份打拼"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T10:04:19+08:00","size":1,"keywords":[],"body":"贵州毕节聚焦群众急难愁盼，完善支持保障机制\n\n　　温暖193万人的外出务工路(深阅读)\n\n　　贵州是劳务输出大省，外出务工规模常年在600万人左右。毕节作为贵州劳务人口输出最多的地级市，现有193万人外出务工，其中157万人跨省份打拼。据统计，在毕节，务工收入占脱贫家庭收入的70%、易地搬迁家庭收入的90%。\n\n　　解决外出务工人员后顾之忧，事关广大家庭的幸福生活。2024年以来，毕节聚焦破解外出务工人员急难愁盼问题，织密外出务工人员民生保障网，促进群众安心就业、稳定增收，让留守群体享有更多照护与保障。今年7月，贵州印发《关于建立完善支持保障机制解决外出务工人员后顾之忧的指导意见》，提出“推广毕节试点经验，探索建立外出务工人员家庭公共服务联络机制”。\r\n\n　　关爱“一老一小”，帮办家里事\n\n　　55岁的吴学兴，家在毕节七星关区大新桥街道殷官屯社区。2008年起，他到江苏镇江的一家工厂上班，把妻儿也带了过去。但父亲独自留守毕节老家，身边没人照应，成了吴学兴最大的牵挂。有一次父亲生病，吴学兴返回毕节照顾老人一个多月，失去了原来的工作，回到镇江后花了半个月才找到新工作。\n\n　　2025年，大新桥街道聚焦外出务工人员需求，重点解决留守人员照料等诉求，开设老年食堂，定期开展老人免费体检活动。“这些措施落实后，可以减少外出务工人员的频繁奔波。”大新桥街道党工委书记彭义说。\n\n　　在毕节织金县惠民街道党群服务中心，公益托管班里传来孩子们的歌声。“街道有上百名留守儿童，绝大多数都需要陪伴照顾。”音乐教师马娟介绍，今年县里依托党群服务中心等场地开设了3个公益托管班，兼顾日常看护与兴趣培养，设置音乐、美术、手工等特色课程，有效缓解儿童看护难题。\n\n　　抓住外出务工人员最大的牵挂，毕节做好“一老一小”服务保障，建成运营养老机构112家，配套城镇老年人日间照料中心62个、农村互助幸福院89个；依托儿童之家、党群服务中心等载体，提供心理咨询、假期托管等服务，2024年8月以来惠及儿童68万人次。\n\n　　组织留守群体，共理邻里事\n\n　　在毕节金沙县禹谟镇中坪村，有一群由留守妇女组成的“孃孃帮”服务队，这两年村里的大变化背后，几乎都有她们的身影。\n\n　　55岁的村民王宏珍曾在外务工，2020年起，她留在村里开了家百货店。看到村中有些留守老人、妇女面临种种生活难题，王宏珍有了新想法：“把村里的留守群体组织起来，大家一起打理好村子。”\n\n　　为鼓励和引导群众参与村级事务管理，提高村民议事便捷性和参与度，在中坪村党总支支持下，村里一些留守妇女成立了“孃孃帮”服务队。服务队起初只有6人，王宏珍任队长。农闲时，她们是自娱自乐的文艺队；农忙时，她们是抢种抢收的互助队；邻里发生矛盾时，她们是靠前沟通的调解队……\n\n　　目前，“孃孃帮”服务队扩展到40多人。在服务队的积极参与下，中坪村细化村规民约，强化议事协商机制，邻里矛盾越来越少。同时，村里积极争取项目资金，硬化村民出行路，成立广场舞蹈队等文艺队伍，留守老人、妇女和儿童的生活更加丰富多彩。\n\n　　近年来，毕节探索创新基层社会治理机制，已组建群众自治组织2800余个，制定就医陪护、家事劳作、农事帮衬等12类互助服务清单。截至目前，毕节累计争取各类资金近60亿元，构建市、县、乡、村四级联动解忧责任体系，组建市、县外出务工人员家庭公共服务中心。\n\n　　精准联动施策，服务工作事\n\n　　32岁的李军是毕节黔西市洪水镇人，此前在浙江温州的一家五金冲压加工厂上班。由于设备突发卡顿，李军的手臂和小腿受伤，在与厂方协商时产生分歧。\n\n　　正发愁时，李军看到了黔西市驻温州劳务协作站的务工维权宣传短视频，随即拨通了服务热线。劳务协作站详细了解事件经过，马上联系黔西与温州两地的工伤认定部门、劳动监察部门，并同涉事厂方交涉调解。在多方共同努力下，从接到求助到促成双方签订调解协议，并确保赔偿款足额支付，整个过程仅用3天。\n\n　　截至目前，毕节已建成25个省外劳务协作站，配备专职维权人员、公益法律顾问，开通多种维权通道，累计为3.44万名农民工追回欠薪5.63亿元。\n\n　　为筑牢外出务工人员就业底气，毕节实施“技能照亮前程”行动，2025年以来累计完成技能培训7.86万人次，收集、发布岗位47.9万个，服务零工人员23.87万人次。\n\n　　解决后顾之忧，温暖务工之路。结合毕节试点工作经验，贵州从强化“一老一小”关心关爱、加强寨邻事务综合治理、提升公共服务水平等5个方面，提出15条指导意见，建立完善外出务工人员家庭关怀、社会治理、就业创业、融合发展的支持保障机制。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cba4b149a40","title":"抢在前、备在先——能源全线迎战今冬“冲峰大考”","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735643.shtml","summary":"财经聚焦丨抢在前、备在先——能源全线迎战今冬“冲峰大考”  　　新华社北京11月20日电 题：抢在前、备在先——能源全线迎战今冬“冲峰大考”  　　新华社记者戴小河、王悦阳  　　入冬以来…","summary_short":"财经聚焦丨抢在前、备在先——能源全线迎战今冬“冲峰大考”  　　新华社北京11月20日电 题：抢在前…","digest":"财经聚焦丨抢在前…","points":["据气象部门预测，今冬我国寒潮频次略多，极端天气或多发频发，电力、煤炭、天然气保供面临多重考验","各地各有关部门密切关注能源供需形势，加强监测预警、统筹协调、应急调度，全力做好保暖保供工作","11月5日起，强冷空气席卷天山南北，新疆阿勒泰、伊犁河谷等地持续降雪"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T09:56:21+08:00","size":1,"keywords":[],"body":"财经聚焦丨抢在前、备在先——能源全线迎战今冬“冲峰大考”\n\n　　新华社北京11月20日电 题：抢在前、备在先——能源全线迎战今冬“冲峰大考”\n\n　　新华社记者戴小河、王悦阳\n\n　　入冬以来，多股冷空气接连影响我国，北方地区供暖全面展开，能源保供进入迎峰度冬关键阶段。据气象部门预测，今冬我国寒潮频次略多，极端天气或多发频发，电力、煤炭、天然气保供面临多重考验。各地各有关部门密切关注能源供需形势，加强监测预警、统筹协调、应急调度，全力做好保暖保供工作。\r\n\n　　电力：保供能力增量跑赢负荷增量\n\n　　11月5日起，强冷空气席卷天山南北，新疆阿勒泰、伊犁河谷等地持续降雪。国网新疆电力提前研判冬季天气趋势，对全疆2000多个供热站点逐一排查，累计消除用电隐患750余项。\n\n　　保暖保供，电力是生命线。\n\n　　国家电网预计今冬最大负荷12.4亿千瓦，同比增加7200万千瓦；高峰可靠保供能力约13亿千瓦，同比增加9000万千瓦，保供能力增量大于负荷增量，可满足高峰时段用电需求。\n\n　　为确保度冬期间电力稳定供应，国家电网将继续提升互济能力。今冬经营区跨区输电能力将首超2亿千瓦，同比增加740万千瓦，“西电东送”“北电南送”骨干网架持续强化。\n\n　　南方电网预测，今冬南方区域阶段性低温凝冻天气将达近10年最强，电网运行面临较大压力。\n\n　　“我们着力抢占防灾减灾先机。”南方电网输配电部副总经理章彬说，针对线路设备覆冰风险，电网企业已开展覆冰监测装置检修消缺和融冰装置预试定检，改造频繁融冰线路，抢修队伍和物资已经前置到了预计受影响的覆冰区。\n\n　　电网“强筋壮骨”，机组“稳发满发”。\n\n　　走进向北京输电的重要电源点——中国大唐托克托电厂，集控室里运行人员紧盯屏幕，精细调整机组运行参数。“每台机组的‘脾气’都不一样。”当班值长介绍，厂里针对每台机组状况，编制定制化调峰操作细则，在满足供热前提下，把每台机组的发电和调峰潜力都充分释放出来。\n\n　　立冬过后，吉林省用电用热负荷进入高峰区间。10月1日以来，作为吉林省能源保供骨干企业，国家电投旗下电投绿能火电板块发电超15亿千瓦时、供热量近600万吉焦，保障吉林省民生用电、工业生产及热源供应。\n\n　　“煤改电”地区是保暖工作重中之重。国网沧县供电公司工作人员走村入户，指导用户用好谷段电价优惠，为孤寡老人、留守家庭建立一户一档用户台账，提供到家服务。国网蒙东电力在内蒙古巴林右旗试点投运智慧能源单元，为电采暖用户加装柔性调控装置，在用户“零感知”的前提下削峰填谷。\n\n　　煤炭：产运销储全链发力\n\n　　走进陕北毛乌素沙漠南缘的山东能源集团金鸡滩煤矿，百米井下采煤机滚筒高速旋转，“乌金”应声而落，智能皮带把滚滚煤流送往地面。\n\n　　入冬以来，这座矿井保持满负荷生产，日均产量在5.5万吨以上，单日最高商品煤外运量超6万吨，即便遭遇极端降温、雨雪冰冻天气，仍做到寒潮不停产、保供不断档。\n\n　　保暖保供，煤炭是“压舱石”。\n\n　　作为全球最大的煤炭企业，国家能源集团全力备战：旗下神东煤炭承担19个省(区、市)煤炭保供任务，17座矿井满负荷稳产，10月以来原煤产量突破1600万吨。\n\n　　“煤炭产运销就像咬合的齿轮，哪个环节卡壳，保供都要打折扣。”神东煤炭总调度室高级主管王军介绍，公司持续跟踪气象变化，提前做好寒潮应对举措，主动对接铁路、港口等联运单位，推动产运销各环节高效协同。\n\n　　位于内蒙古准格尔旗的国家能源集团黑岱沟、哈尔乌素露天煤矿，每天约17万吨商品煤从这里运往全国各地，为缺煤地区度冬保驾护航。\n\n　　山西朔州，寒风凛冽。在中国中煤所属平朔集团东露天矿作业现场，最低气温已低至-10℃。智能采掘设备高速运转，满载煤炭的运输车辆络绎不绝，一派繁忙景象。\n\n　　11月1日至15日，中国中煤原煤产量897.42万吨、发运量892.34万吨，煤炭生产发运平稳有序。\n\n　　煤炭是供暖的“热源”，也是煤电的“口粮”。国家能源局最新数据显示，目前全国统调电厂存煤2.16亿吨，可用天数32天，库存总体有保障。\n\n　　天然气：冲峰能力提升至12亿立方米/日\n\n　　11月18日晚，柴达木盆地，青海油田涩北气田井场气温降到零下十几摄氏度。采气工打着手电，逐井查看压力表、听气流声，遇上积液井就记下井号，排进次日维护计划。\n\n　　青海油田主要保障青海、甘肃、西藏三省区用气，今冬保供目标19亿立方米，峰值日产1250万立方米。\n\n　　保暖保供，天然气是重要支撑，一头连着清洁取暖，一头连着气电发电。\n\n　　国家能源局加强资源筹措，已落实天然气资源量不低于上一采暖季，深挖天然气“全国一张网”保供潜力，今年采暖季顶峰能力在去年峰值基础上增长超过7000万立方米/日，可有力支撑取暖用气供应。\n\n　　“我们已超额完成年度注气任务。”中国石化天然气公司销售管理高级专家赵奎介绍，目前公司调峰能力可达5000万立方米/日，相当于1亿户家庭一天的用气量。\n\n　　作为我国最大的天然气生产基地，中国石油长庆油田天然气日产量突破1.4亿立方米，气源输送至全国50余座大中城市，以高位稳产态势夯实供气保障基础。\n\n　　进入11月，从戈壁站场到平原干线，从沿海LNG(液化天然气)接收站到地下储气库，国家管网集团天然气保供由战前准备转入实战攻坚——“全国一张网”冲峰能力提升至12亿立方米/日、最大采气能力可达6500万立方米/日、LNG接收站罐存气超10.5亿立方米，度冬“底气”充足。\n\n　　“煤改气”地区群众能否温暖过冬，令人牵挂。中国石油天然气销售河北公司副总经理曹洪伟介绍，公司设置“煤改气”专项资源，采暖季天然气资源供应量同比增加7.5%。永清和遵化等地的燃气公司针对孤寡老人、残障人士等特殊用户上门“一对一”服务。\n\n　　寒意渐深，暖流涌动，各单位正以万全准备迎战冲峰大考，守护人民群众温暖过冬。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c569f7e81f5","title":"重庆统战教育高地建设积厚成势 五方面成果集中显现","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735629.shtml","summary":"中新网重庆11月21日电 (马佳欣)20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。","summary_short":"中新网重庆11月21日电 (马佳欣)20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。","digest":"20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行","points":["中新网重庆11月21日电 (马佳欣)20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式…","重庆市统战教育高地建设成果在开幕式上发布","2023年以来，重庆统战教育高地建设在政治共识、阵地建设、培训体系、科研资政…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T09:48:42+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (马佳欣)20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。重庆市统战教育高地建设成果在开幕式上发布。2023年以来，重庆统战教育高地建设在政治共识、阵地建设、培训体系、科研资政、平台载体五方面集中显现成效。\n\n图为开幕式现场。马佳欣 摄\n\n　　2023年以来，重庆市级统战系统举办主体培训班200余期，培训近2万人次，市级民主党派和无党派代表人士培训班等长学制班次已形成特色品牌，团结奋斗的共同思想政治基础不断巩固。\n\n　　重庆社会主义学院深化后勤服务改革和校园更新改造，加快构建全市社会主义学院“1+1+3+N”办学布局，2023年以来学院承接全国各类培训班350余期，培训学员2.5万余人次，年均培训体量居全国社院系统前5位、西部首位，培训对象实现全国31个省(区、市)全覆盖。\n\n　　在培训体系方面，重庆整合优质专兼职骨干师资100名，统筹充实后备师资161名；迭代打造“五大模块”共19个门类的系统化共识教育课程体系，新开发课程81门，累计获评全国社院“好课程”“推荐课程”8门；升级打造标准化现场教学线路30条，中国民主党派历史陈列馆被纳入全市干部教育培训常态化现场教学线路，“寻根重庆·同心圆梦”现场教学品牌基本形成。\n\n　　在科研资政方面，《统一战线学研究》正式入选南京大学CSSCI来源期刊。重庆获全国统战理论政策研究创新成果一等奖、全国统战工作实践创新成果各一项，实现中央社院高端智库课题突破并获批2项。\n\n　　在平台载体方面，重庆搭建一体化“共识教育”数字应用平台，建成施教机构、培训师资、精品课程、网络课程等资源数据库。组织开展全市小学教师讲统战故事竞赛、中学教师统战知识教学竞赛、高校统战成员征文等活动4次，累计吸引2万余名师生参与，统战知识教育实现向全年龄段国民教育阵地延伸。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c37e87d6be6","title":"世界首个、蝉联榜首、刷新纪录！本周我国多领域捷报频传","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735640.shtml","summary":"“灵晟”超算蝉联全球榜首  “梦想”号大洋钻探船刷新水深纪录  “源储一号”并网发电  ……","summary_short":"“灵晟”超算蝉联全球榜首  “梦想”号大洋钻探船刷新水深纪录  “源储一号”并网发电  …","digest":"“灵晟”超算蝉联全球榜首  “梦想”号大洋钻探船刷新水深纪录  “源储一号”并网发电…","points":["“梦想”号大洋钻探船刷新水深纪录","“灵晟”系统首创在线加速(Online Acceleration)全CPU超智融合架构…","目前船上4种钻探模式全部验证通过，建成自主超深水钻探技术体系"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T09:47:10+08:00","size":1,"keywords":[],"body":"“灵晟”超算蝉联全球榜首\n\n“梦想”号大洋钻探船刷新水深纪录\n\n“源储一号”并网发电\n\n……\r\n\n本周，多领域创新成果密集涌现\n\n捷报频传\n\n👍👍👍\n\n🏆世界第一\n\n“灵晟”超算蝉联全球榜首\n\n　　当地时间11月17日，SC26国际超级计算大会期间，新一期全球超算TOP500榜单正式发布：国家超级计算深圳中心“灵晟”E级超算以2.198EFlops(每秒219.8亿亿次)的Linpack双精度实测性能蝉联世界第一，领先第二名美国“El Capitan”(1.809EFlops)约21%，并以22PFlops继续保持HPCG榜单榜首。\n\n　　“灵晟”系统首创在线加速(Online Acceleration)全CPU超智融合架构，实现从芯片、网络、存储到系统软件的全栈自主可控，已支撑22项千万核级全机规模应用，适配220余款领域应用。\n\n🌊深海钻探刷新纪录\n\n“梦想”号大洋钻探船\n\n完成钻井系统海试任务\n\n　　近日，我国首艘大洋钻探船“梦想”号入列两周年之际，顺利完成国内首套2000米级深海无隔水管泥浆回收循环钻井系统海试，刷新该类系统国际作业水深纪录(2004.8米)，填补国内技术空白。\n\n　　目前船上4种钻探模式全部验证通过，建成自主超深水钻探技术体系。入列两年来已执行9个航次，我国深海钻探取心能力提升至5000米级，跻身全球第三。\n\n⚡世界首个\n\n“源储一号”并网发电\n\n　　11月16日，世界首个300兆瓦人工硐室型压缩空气储能电站——“源储一号”在甘肃成功并网。\n\n　　压缩空气储能是一种将电能转化为空气压力势能，并在需要时重新转化为电能的储能技术。\n\n　　“源储一号”电站在地下110米深处的岩层中开挖建设储气硐室，硐室群由4个硐室组成。电站建设一台功率300兆瓦，储能规模达1800兆瓦时发电机组，电-电转换效率达72%，单次可实现6小时长时发电，年发电量可达6亿千瓦时。\n\n　　“源储一号”于2022年12月21日启动建设。历经四年攻关，形成世界最大容积承压式人工硐室群、世界首创充放换热装置共用技术、世界领先多介质宽温域储换热系统、世界首创高内压储气库密封技术等多项世界级核心技术。\n\n🍃24小时全绿电\n\n全国首个独立运行\n\n兆瓦级海岛微电网投运\n\n　　11月19日，全国首个独立运行的兆瓦级海岛微电网在福建福鼎台山岛投运，台山岛彻底告别柴油发电时代，实现百分之百绿电不间断供电。\n\n　　台山岛是福建离陆地最远的有人居住岛屿，全岛依靠柴油发电。此次投运的微电网工程，配置风机、光伏、锂电池和氨氢燃料电池，总装机容量达到1.5兆瓦，年发电量120万千瓦时。工程投运后，岛上实现24小时全绿电供电。\n\n🛢️我国首个\n\n海上注碳增气项目建设迎新进展\n\n　　东方1-1气田是我国首个海上自营气田，也是我国开发建设的首个海上富碳气田。自2003年建成投产以来，已累计产气超500亿立方米。\n\n　　中心平台计划12月进行海上安装，项目投产后，每天可提纯二氧化碳175万立方米，推动二氧化碳从“排放物”向“资源”转化，助力千亿方级老气田焕发新生机，持续为海南自贸港经济发展提供稳定可靠的能源支撑。\n\n👍破多项纪录\n\n国内最长二氧化碳长输管道投运\n\n　　记者11月16日从中国石油获悉，吉林石化—吉林油田二氧化碳长输管道工程建成投运。管道工程横跨吉林省吉林、长春、松原三市，干线全长277.6公里，每年可输送二氧化碳达330万吨。这是目前我国输送距离最长、管径最大、设计压力最高、输送规模最大的二氧化碳长输管道。\n\n　　在建设过程中，技术人员围绕长距离高压输送、自动化焊接和核心装备国产化等难题开展攻关，取得多项创新成果。\n\n一项项纪录不断刷新\n\n一个个成果相继落地\n\n持续攻关、向新而行\n\n向着科技自立自强\n\n稳步前行！ 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7d07b8d9fb","title":"中国科技馆“北辰对话”推出特别节目《雨林的“创”生》","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735631.shtml","summary":"中新网北京11月21日电 (记者 孙自法)中国科技馆11月20日向媒体通报说，该馆科学文化访谈栏目“北辰对话”最新一期推出特别节目《雨林的“创”生》…","summary_short":"中新网北京11月21日电 (记者 孙自法)中国科技馆11月20日向媒体通报说…","digest":"中国科技馆11月20日向媒体通报说…","points":["中新网北京11月21日电 (记者 孙自法)中国科技馆11月20日向媒体通报说…","本期节目由中国科技馆馆长郭哲担任召集人，与中国工程院院士、香港中文大学(深圳)校长徐扬生…","徐扬生指出，人工智能(AI)时代的人才标准已从体力、知识转向创造性，它决定一个人能走多远"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T09:34:58+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 (记者 孙自法)中国科技馆11月20日向媒体通报说，该馆科学文化访谈栏目“北辰对话”最新一期推出特别节目《雨林的“创”生》，以“开放之源”“联通之桥”“协同之光”三个篇章展开，呼应APEC中国年“开放、创新、合作”三大优先领域。\n\n中国科技馆“北辰对话”最新一期推出APEC特别节目《雨林的“创”生》。中国科技馆 供图\n\n　　《雨林的“创”生》中的“雨林”，则是本期节目照见的深圳生态——独木不成林，创新从来不是一棵树的长高，而是一整片雨林孕育出的共生。\n\n　　本期节目由中国科技馆馆长郭哲担任召集人，与中国工程院院士、香港中文大学(深圳)校长徐扬生，港中大(深圳)数据科学学院贾奎教授、武执政副教授，以及青年创业者代表展开对话。\n\n　　徐扬生指出，人工智能(AI)时代的人才标准已从体力、知识转向创造性，它决定一个人能走多远。在港中大(深圳)，培育创造力有两条路径：跨学科与艺术。通识教育必修四年，艺术中心不设学分，却让艺术家驻校，与学生朝夕相处。\n\n　　郭哲认为，科学和艺术应该是一体两面，很难分出清晰界面。徐扬生对此深有同感——艺术既是感性世界里人生的支点，也是理性世界想象力的源泉。\n\n　　当AI什么都能教，大学还剩下什么？在徐扬生看来，这其实关乎科学精神的培养——坚韧、无私、真实、真诚。教育需要厚度，他给出的路径是学、思、践、悟。\n\n　　从实验室到市场，中间横着一道“死亡之谷”。贾奎坦言，高校教授创业最初多是技术驱动，对商业的诉求往往不完整。武执政认为，实验室完成的只是Idea的验证，还要到真实场景里获取用户痛点后迭代一次，才谈得上产品化。\n\n　　郭哲称，深圳就像一个“热带雨林”，学校、城市与产业彼此供养，为科技“新物种”的萌发提供沃土。创业者要做的，是以开拓进取的锐气破土而出，也让自己成为这片沃土的一部分。\n\n　　港中大(深圳)“一腔热血、百年大学、千载品牌、万世良心。”徐扬生说，“哪怕整个世界都黑暗了下来，在这里永远有一盏灯为你亮着。”(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbf3526b747","title":"“BBNJ协定秘书处落户的形势与展望”国际研讨会在海口举行","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735633.shtml","summary":"中新网海口11月21日电 (记者 王子谦)由华阳海洋研究中心主办的“BBNJ协定秘书处落户的形势与展望”国际研讨会近日在海口举行。","summary_short":"中新网海口11月21日电 (记者 王子谦)由华阳海洋研究中心主办的“BBNJ协定秘书处落户的形势与展望”国际研讨会近日在…","digest":"由华阳海洋研究中心主办的“BBNJ协定秘书处落户的形势与展望”国际研讨会近日在海口举…","points":["来自中国、英国、加拿大、澳大利亚、多哥、尼日利亚等国家和地区智库、高校…","《〈联合国海洋法公约〉下国家管辖范围以外区域海洋生物多样性的养护和可持续利用协定》(即BBN…","与会代表围绕比利时与智利“联合申办”对《协定》秘书处的可能影响…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T09:33:58+08:00","size":1,"keywords":[],"body":"中新网海口11月21日电 (记者 王子谦)由华阳海洋研究中心主办的“BBNJ协定秘书处落户的形势与展望”国际研讨会近日在海口举行。来自中国、英国、加拿大、澳大利亚、多哥、尼日利亚等国家和地区智库、高校、研究机构以及国际组织的百余名专家学者及媒体代表，以线上线下相结合的方式参会。\r\n\n　　《〈联合国海洋法公约〉下国家管辖范围以外区域海洋生物多样性的养护和可持续利用协定》(即BBNJ协定，以下简称《协定》)，旨在养护和可持续利用海洋生物多样性。\n\n　　今年以来，中国提名厦门申办《协定》秘书处，短时间内获得《协定》多数缔约国支持。\n\n　　11月6日，在未同广大《协定》缔约方协商的情况下，比利时和智利宣布合并申办秘书处，公开表示将秘书处设在智利瓦尔帕莱索，将信息交换机制设在比利时布鲁塞尔，并将布鲁塞尔作为附属机构的会议举办地。\n\n　　与会代表围绕比利时与智利“联合申办”对《协定》秘书处的可能影响、联合申办方案中的机制分设安排与《协定》规则的一致性，以及《协定》秘书处落户与全球南方等议题展开研讨。\n\n　　华阳海洋研究中心理事长、中国南海研究院学术委员会主席吴士存指出，比利时与智利提出的“联合申办”方案给《协定》秘书处选址带来新的不确定性。有关安排应尊重缔约方大会的决策权限，充分评估秘书处与信息交换机制分设两地可能带来的额外运行成本和协调难度，以及对信息交换机制运行效率和透明度的影响。\n\n　　有与会专家指出，考虑到亚洲特别是亚洲发展中国家在全球海洋治理机构中的代表性仍显不足，秘书处选址还应充分考虑地域平衡。有与会学者强调，中国作为全球南方的一员、最大的发展中国家及全球第二大经济体，秘书处落户厦门具有不可替代的有利条件，也有助于《协定》的有效实施。\n\n　　与会代表一致认为，《协定》秘书处的选址和职能安排应以推动《协定》有效实施为目标。缔约方大会应依照《协定》，综合考虑运行效率、经费可持续性、地域代表性和各方参与的便利程度，通过透明、公平、包容的程序作出决定。秘书处应坚持独立、中立、透明、包容和高效运行，为能力建设、海洋技术转让、科学知识共享和国际合作搭建平台，帮助发展中国家特别是小岛屿发展中国家提升履约能力和参与全球海洋治理的能力。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbc8b9157ad","title":"国内外专家齐聚广州共商数智技术与运动健康深度融合新路径","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735634.shtml","summary":"中新网广州11月21日电 (记者 张璐)2026年广州运动与健康国际学术研讨会(简称“研讨会”)11月19日至21日在广州体育学院举行，吸引了来自德国、英国…","summary_short":"中新网广州11月21日电 (记者 张璐)2026年广州运动与健康国际学术研讨会(简称“研讨会”)11月19日至21日在广…","digest":"2026年广州运动与健康国际学术研讨会(简称“研讨会”)11月19日至21日在广州体…","points":["中新网广州11月21日电 (记者 张璐)2026年广州运动与健康国际学术研讨会(简称“研讨会…","据介绍，广州运动与健康国际学术研讨会自2013年创办以来，为运动与健康及相关领域专家…","开幕式现场举行主动健康平安社区项目签约、主动健康医联体签约和主动健康三级网络医联体共建启动仪…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T09:31:36+08:00","size":1,"keywords":[],"body":"中新网广州11月21日电 (记者 张璐)2026年广州运动与健康国际学术研讨会(简称“研讨会”)11月19日至21日在广州体育学院举行，吸引了来自德国、英国、澳大利亚及中国多所知名高校与科研机构的顶尖专家齐聚一堂，共商数智技术与运动健康深度融合的新路径。\n\n研讨会现场。　广州体育学院 供图\n\n　　据介绍，广州运动与健康国际学术研讨会自2013年创办以来，为运动与健康及相关领域专家、学者搭建国际学术交流平台，传播国内外运动与健康新理论、新方法，推动中国运动与健康事业高质量发展。\n\n　　开幕式现场举行主动健康平安社区项目签约、主动健康医联体签约和主动健康三级网络医联体共建启动仪式。\n\n研讨会现场。　广州体育学院 供图\n\n　　国际运动医学联合会前副主席李国平教授等国内专家围绕运动医学防治康一体化等前沿议题作大会报告。德国运动医学协会主席维尔海姆·布洛克(Wilhelm Bloch)教授等国际专家，带来从基础科学到实用运动医学等前沿报告。\n\n　　本届研讨会设十二个专题报告会场，涵盖大模型与运动健康理论方法创新、AI驱动的运动与公共健康促进等方向，并设墙报交流四个单元，集中呈现运动健康领域数智化研究的最新成果，为国内外学者搭建了高水平跨学科交流平台。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2f2f837931","title":"国产大模型引领全球开源生态 累计下载量突破100亿次","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735639.shtml","summary":"国产大模型引领全球开源生态(大数据观察·智能经济新形态)  　　累计下载量突破100亿次  　　近日，北京月之暗面科技股份有限公司公布了Kimi K3.1 Pro完整模型权重…","summary_short":"国产大模型引领全球开源生态(大数据观察·智能经济新形态)  　　累计下载量突破100亿次  　　近日…","digest":"国产大模型引领全球开源生态(大数据观察·智能经济新形态)  　　累计下载量突破100…","points":["国产大模型引领全球开源生态(大数据观察·智能经济新形态)","近日，北京月之暗面科技股份有限公司公布了Kimi K3.1 Pro完整模型权重…","腾讯混元发布了新一代大语言模型Hy4，在指令遵循、长文理解…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T09:26:17+08:00","size":1,"keywords":[],"body":"国产大模型引领全球开源生态(大数据观察·智能经济新形态)\n\n　　累计下载量突破100亿次\n\n　　近日，北京月之暗面科技股份有限公司公布了Kimi K3.1 Pro完整模型权重，这款全球参数规模最大开源模型在技术社区引发了广泛讨论；腾讯混元发布了新一代大语言模型Hy4，在指令遵循、长文理解、长程任务及深度研究等能力方面实现了提升。\n\n　　前不久闭幕的2026年世界互联网大会乌镇峰会上，“开源”也成为关键词。今年以来，我国多家科技企业密集推出开源模型产品，在参数规模与技术深度方面不断实现突破。什么是开源？如何看待模型开源现象？国产开源模型有哪些新的发展趋势？\r\n\n　　开源步伐加快，下载量、衍生模型数量领跑\n\n　　与软件“公开源代码”的字面意义不同，模型开源更多指的是“开放权重”。\n\n　　简单来说，模型就像是一个拥有海量知识的大脑，而“权重”就是这个大脑中数以千亿计的参数数值。这些参数记录了模型在训练过程中学到的所有语言规律、逻辑推理能力和各种知识。\n\n　　“开放权重”，意味着使用者可以下载模型，在自己的电脑或服务器上运行推理，甚至通过微调让它来适应特定的任务。例如，企业和开发者不需要花费大笔资金从头开始训练，就能获得一个极其聪明的模型底座；它还允许在本地服务器或私有云上部署，这对一些对数据隐私要求极高的用户来说很关键。日益丰富的开源模型，还能让发展中国家以低成本获取前沿能力。\n\n　　不过，开源不等同于放弃商业回报，依托云端推理、智能体平台、模型微调等，企业依然能够形成可持续的收益模式。\n\n　　目前，我国日均词元调用量已突破500万亿，国内网购平台已上线词元充值中心，“双11”直播间里，词元也成了抢手货。“词元可计量、可定价、可交易的属性逐步被挖掘，词元调用量正成为观察人工智能(AI)活跃度、产业渗透深度、智能化发展水平的重要指标。”中央网信办副主任王京涛表示。\n\n　　在高度市场化的模型聚合平台上，中国开源模型的表现同样突出。11月9日至15日，全球开源模型聚合平台OpenRouter上中国模型的周调用量为119.1万亿词元，连续29周稳居全球首位。工业和信息化部数据显示，我国人工智能开源大模型全球累计下载量突破100亿次。“一批全球领先的开源模型持续涌现，下载量、衍生模型数量领跑，引领全球人工智能开源生态。”中国科学技术信息研究所党委书记黄琦说。\n\n　　竞争力提升，模型架构加快创新、底层技术不断突破\n\n　　国产开源模型竞争力的提升，不仅源于应用范围广，更来自模型架构加快创新、底层技术不断突破。\n\n　　去年年初，深度求索发布的DeepSeek系列模型，不仅在性能上取得了突破，更对混合专家模型架构进行了创新，大幅降低了推理成本和算力需求。这种架构后来成为全球人工智能领域共同探索的方向。\n\n　　今年发布的Kimi K3则提出了自主研发的混合线性注意力机制等，让“超长文本算得更省，超大模型训得更稳”。“我们从底层逻辑对该架构的关键组件进行了重构，让模型训练找到全新进化空间。”月之暗面Kimi创始人兼首席执行官杨植麟说，中国开源模型正在成为全球模型厂商评测中的标杆和海外研究机构的重要样本。\n\n　　国产开源模型与国产算力适配度的提升同样值得关注。今年6月，美团发布依靠国产算力完成训练、推理全流程的万亿参数大模型。11月，美团新一代大模型LongCat—2.5发布，推动国产算力上的大模型从“跑得动”走向“跑得快、跑得省”。美团龙猫大模型负责人蔡勋梁说：“我们逐步攻克了神经网络处理器确定性计算、算力利用率提升等难题，验证了大规模国产训练的可行性。”\n\n　　为了推动人工智能落地，国内芯片厂商也在产品设计上持续进行优化。“国产开源模型能力提升，带动智能体、编程、视频生成等需求提速，将催生大量长上下文承载、多轮工具的高频调用，以及更高效的多模态并发处理能力。调用规模越大，用户对响应速度、使用成本就越敏感。”国产推理GPU(图形处理器)厂商曦望董事长徐冰说。\n\n　　应用深度增强，推动智能成果普惠全球\n\n　　随着技术的发展，国产开源模型正走入更多应用场景。\n\n　　深夜的京东方生产线上，显示面板有序通过各道工序。人工智能系统实时捕捉到一处微观缺陷，即刻生成修复方案，联动设备完成修复——从发现问题、分析判断，到执行处理，实现全链路智能化质量管理闭环。\n\n　　“我们以国产开源大模型为基础底座，自主研发了京东方蓝鲸显示大模型，融合工业制造经验和产线数据，覆盖研发设计、生产制造、质量管理等场景，推动多项AI应用在京东方各地工厂落地。”京东方高级副总裁、联席首席技术官姜幸群说。\n\n　　个人开发者吴瑞孟接到一名淘宝店主“用二次元图片给车贴膜”的需求时，马上联想到“AI试衣”场景。他在无代码应用开发平台“秒哒”上，只花了25分钟就设计出demo(小样)，这个“+AI”的创意，最终以8000元的价格成交。“用自然语言描述需求，由模型创建定制化应用，人工智能可以帮我补齐能力短板。”吴瑞孟表示。\n\n　　中国开源模型同样改变着海外用户的工作方式和海外企业的成本结构。\n\n　　去年底，一款名为“海狮V4”的多语言大模型在新加坡发布。该模型以阿里千问开源模型为基座研发，聚焦东南亚复杂的语言使用环境，受到当地用户的欢迎。“海狮V4”依托千问开源模型覆盖119种语言的优势，在36万亿词元上进行了预训练。在新加坡人工智能计划高级总监刘思理看来，与中国企业的合作是推动AI普惠化、使其更具东南亚代表性的一个重要标志。\n\n　　“人工智能普惠的可能性，需要建立在坚实的开源根基上。”中国科学院计算技术研究所研究员张云泉表示，从技术、规则到公共产品，中国正把普惠的愿景转化为实实在在的行动。\n\n　　本报记者 谷业凯 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c98ba1134b7","title":"中澳总理年度会晤联合成果声明（全文）","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735611.shtml","summary":"新华社北京11月20日电  中澳总理年度会晤联合成果声明  (2026年11月20日)  　　一、应中华人民共和国主席习近平邀请…","summary_short":"新华社北京11月20日电  中澳总理年度会晤联合成果声明  (2026年11月20日)  　　一…","digest":"中澳总理年度会晤联合成果声明  (2026年11月20日)  　　一…","points":["新华社北京11月20日电","一、应中华人民共和国主席习近平邀请，澳大利亚总理安东尼·阿尔巴尼斯来华出席在深圳举行的亚太经…","二、11月20日，习近平主席在深圳会见阿尔巴尼斯总理"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T08:49:53+08:00","size":1,"keywords":[],"body":"新华社北京11月20日电\n\n中澳总理年度会晤联合成果声明\n\n(2026年11月20日)\n\n　　一、应中华人民共和国主席习近平邀请，澳大利亚总理安东尼·阿尔巴尼斯来华出席在深圳举行的亚太经合组织第三十三次领导人非正式会议。阿尔巴尼斯总理还访问了北京。\n\n　　二、11月20日，习近平主席在深圳会见阿尔巴尼斯总理。在京期间，中华人民共和国国务院总理李强同阿尔巴尼斯总理举行中澳总理年度会晤，全国人民代表大会常务委员会委员长赵乐际会见阿尔巴尼斯总理。两国领导人就中澳关系及重要国际和地区问题深入交换意见。\n\n　　三、两国领导人在年度会晤中重申支持中澳全面战略伙伴关系，重申成熟、稳定、建设性双边关系的重要性。双方同意在2027年中澳建交55周年之际继续推动两国关系发展，维护各自国家利益，明智管控分歧。\n\n　　四、同双方2025年7月在北京发表的联合成果声明相一致，双方重申1972年《中华人民共和国政府和澳大利亚政府关于中、澳两国建立外交关系的联合公报》的重要性，重申坚持联合公报中阐述的各自国家政策和立场，包括相互尊重、平等互利，以及澳方对一个中国政策的承诺。\n\n　　五、双方肯定两国领导人、部长和各层级官员开展定期接触对于支持双边关系的重要性，欢迎自2025年7月上一轮中澳总理年度会晤以来，双方举行系列双边对话，包括2026年4月中澳外交与战略对话、2026年5月中澳部长级经济联委会、2025年12月和2026年11月中澳战略经济对话。双方期待2027年举行新一轮相关对话。\n\n　　六、双方重申多边体系、以国际法为基础的国际秩序以及联合国宪章宗旨和原则的重要性，同意继续在联合国、世贸组织、二十国集团、亚太经合组织、东亚峰会等多边平台开展合作。澳方祝贺中方在深圳成功主办亚太经合组织第三十三次领导人非正式会议。双方欢迎会议达成《深圳展望》，支持在亚太共同体建设、贸易数字化、互联互通、数字经济和人工智能等领域取得务实成果。双方重视在《区域全面经济伙伴关系协定》框架下开展合作。\n\n　　七、双方强调人文交流对深化双边关系的重要性，重申支持人文交流，欢迎中澳高级别对话发挥的重要作用，计划今年12月在澳举行新一轮对话。\n\n　　八、双方同意建立中澳人工智能对话机制，就人工智能安全、治理和应用交换意见。\n\n　　九、双方发表中澳关于气候变化与清洁能源转型联合声明。\n\n　　十、双方同意在以下领域延续和拓展交往：\n\n　　——政治对话，包括总理年度会晤、外交与战略对话、战略经济对话、部长级经济联委会以及其他政府间机制。\n\n　　——双边贸易，包括两国领导人11月20日在北京出席中澳工商界首席执行官圆桌会。双方肯定中澳自贸协定对促进双边贸易和经济关系持续发挥的作用，欢迎协定审议不断取得进展。中方欢迎澳方担任第四届中国国际供应链促进博览会主宾国，欢迎澳大利亚出席中国国际进口博览会并在参会规模方面创造新的纪录。\n\n　　——气候变化、能源和环境，包括2026年8月在澳成功举办第十次中澳气候变化部长级对话，以及将于2027年在华举行的新一次对话。双方同意两国间持续开展基于市场的能源资源产品贸易的重要性。双方欢迎两国官员在气候变化和环境领域开展持续交流，包括气候治理相关事项、旱地农业、气候智慧型农业、绿色经济。\n\n　　——钢铁减碳，两国领导人欢迎首届中澳钢铁减碳政策对话于11月2日在堪培拉举办，同意继续推进低碳钢铁价值链务实合作，包括技术、低碳钢铁产品市场培育以及可信标准和排放核算方法等领域。\n\n　　——人文联系，包括文化、体育、教育、创新、学术、航空、旅游等领域交流。双方宣布2027年为“中澳旅游年”，确认2027年在澳举行新一次中澳旅游对话。澳方继续欢迎中国留学生，肯定其对澳社会所作贡献。双方欢迎澳青少年通过“新科伦坡计划”等赴华学习、实习，包括在支持清洁能源转型领域。两国领导人欢迎两国艺术机构间自愿返还重要文物，欢迎两国博物馆互办重要文化展览，包括即将于2026年12月在堪培拉澳大利亚国家博物馆举办的兵马俑特色展览，以及将于2027年在中国国家博物馆举办的“歌之径”展览。\n\n　　——卫生健康，两国领导人欢迎双方完成《中华人民共和国国家卫生健康委与澳大利亚卫生、残障和老年护理部关于卫生合作的谅解备忘录》磋商，欢迎开展卫生领域合作，包括在心理健康和听力健康等领域交流。\n\n　　——边境执法，基于双方合作打击各类犯罪的共同利益和既有的双边执法合作，包括打击非法烟草走私、跨国有组织犯罪、网络犯罪和电信网络诈骗等。\n\n　　十一、两国领导人同意2027年举行下一轮中澳总理年度会晤。澳方邀请中方领导人在双方方便时访澳，中方对此表示欢迎。 【编辑:张燕玲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6340f5c33c","title":"亚太媒体合作伙伴计划正式成立","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735610.shtml","summary":"新华社北京11月21日电 由新华通讯社发起的亚太媒体合作伙伴计划近日宣布正式成立，首批伙伴计划成员机构共计310家，覆盖亚太41个国家和地区。","summary_short":"新华社北京11月21日电 由新华通讯社发起的亚太媒体合作伙伴计划近日宣布正式成立，首批伙伴计划成员机构共计310家…","digest":"由新华通讯社发起的亚太媒体合作伙伴计划近日宣布正式成立…","points":["新华社北京11月21日电 由新华通讯社发起的亚太媒体合作伙伴计划近日宣布正式成立…","在9月5日举行的亚太媒体高端论坛开幕式上，来自40多个国家和地区以及联合国机构…","筹委会发出《关于加强亚太媒体智库合作传播的倡议》，正式邀请亚太地区媒体…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T08:05:21+08:00","size":1,"keywords":[],"body":"新华社北京11月21日电 由新华通讯社发起的亚太媒体合作伙伴计划近日宣布正式成立，首批伙伴计划成员机构共计310家，覆盖亚太41个国家和地区。\n\n　　在9月5日举行的亚太媒体高端论坛开幕式上，来自40多个国家和地区以及联合国机构、国际组织的400余名中外嘉宾共同见证了伙伴计划筹备委员会成立。筹委会发出《关于加强亚太媒体智库合作传播的倡议》，正式邀请亚太地区媒体、智库等机构加入伙伴计划。截至发稿日，共有310家机构加入，成为伙伴计划成员。\n\n　　伙伴计划以加强亚太区域媒体互利共赢为目标，重点打造高端对话、协同传播、技术创新、务实合作四大平台，将机制化举办媒体高端对话活动，推动亚太地区媒体开展联合采访，合作制作优秀融媒产品，开展亚太地区媒体记者来华采访活动，举办亚太媒体主题研修活动等一系列务实合作项目。\n\n　　《亚太媒体合作伙伴计划》及《亚太媒体高端论坛深圳共识》已纳入中国担任2026年亚太经合组织东道主成果清单。亚太媒体高端论坛已纳入中国担任2026年亚太经合组织东道主主办会议和活动清单。\r\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfc86609947","title":"俯瞰神州‧山西｜壺口瀑布冬季水清現彩虹 展現獨特季節之美","url":"https://news.tvb.com/tc/1207387-俯瞰神州山西壺口瀑布冬季水清現彩虹展現獨特季節之美","summary":"壺口瀑布位於黃河流經中國北部山西省臨汾市的河段，季節性地展現出獨特之美，一道彩虹出現在其異常清澈的水面上。壺口瀑布是中國第二長河黃河上最大的瀑布。","summary_short":"壺口瀑布位於黃河流經中國北部山西省臨汾市的河段，季節性地展現出獨特之美，一道彩虹出現在其異常清澈的水面上。","digest":"壺口瀑布位於黃河流經中國北部山西省臨汾市的河段，季節性地展現出獨特之美…","points":["壺口瀑布位於黃河流經中國北部山西省臨汾市的河段，季節性地展現出獨特之美…","壺口瀑布是中國第二長河黃河上最大的瀑布","壺口瀑布景區工作人員表示，冬季水量和泥沙含量減少，使這座氣勢磅礴的瀑布的水由黃濁變為清澈"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T08:00+08:00","size":1,"keywords":[],"body":"壺口瀑布位於黃河流經中國北部山西省臨汾市的河段，季節性地展現出獨特之美，一道彩虹出現在其異常清澈的水面上。\n\n壺口瀑布是中國第二長河黃河上最大的瀑布。壺口瀑布景區工作人員表示，冬季水量和泥沙含量減少，使這座氣勢磅礴的瀑布的水由黃濁變為清澈。同時，冬季頻繁的晴朗天氣也大大增加出現彩虹的可能性。\n\n在陽光沐浴下，絢麗的彩虹橫跨清澈傾瀉的水面，構成如畫的景象，吸引遊客前來欣賞這壯麗的冬季美景。","image":"https://pro-vod-cdn.tvb.com/fd7e095cd29643239efa57fbeca72825/snapshots/5e03482cbc1a4106be8fb435581f99e0-00007.jpg","video":"https://pro-vod-cdn.tvb.com/fd7e095cd29643239efa57fbeca72825/3d46549c0e5447938807f11b4b1dcf29-b8437e5f00a58ab68b82e559c0602d1d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/fd7e095cd29643239efa57fbeca72825/snapshots/5e03482cbc1a4106be8fb435581f99e0-00007.jpg","lang":"zh-Hant"},{"id":"ce9beee9f42","title":"中國觀察︱深圳APEC峰會 美俄元首等都住哪？","url":"https://www.stheadline.com/realtime-china/3639272/中國觀察深圳APEC峰會-美俄元首等都住哪","summary":"過去幾天，毗連香港的深圳成了全球焦點。","summary_short":"過去幾天，毗連香港的深圳成了全球焦點。","digest":"過去幾天，毗連香港的深圳成了全球焦點","points":["過去幾天，毗連香港的深圳成了全球焦點","亞太地區21個經濟體的領袖、代表、相關政商人員，湧進這座充滿新鮮感的中國南方城市","他們如同港人北上般，好奇地四處逛街打卡，相關鏡頭通過各自官媒及社交平台，傳遍世界…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T07:00:20+08:00","size":1,"keywords":[],"body":"過去幾天，毗連香港的深圳成了全球焦點。亞太地區21個經濟體的領袖、代表、相關政商人員，湧進這座充滿新鮮感的中國南方城市。他們如同港人北上般，好奇地四處逛街打卡，相關鏡頭通過各自官媒及社交平台，傳遍世界，為深圳賣了一次國際性廣告。\n相關新聞：中國觀察︱對特朗普高市的「超規格」待遇\n澳洲總理逛羅湖萬象城超市、智利總統嘗福華百果園，多個熟悉的名字被點出。有網民好奇，這批亞太「大咖」的深圳遊都住在哪家酒店？\n\n官方並無正式公布各代表的駐地，但綜合各地隨行記者的報道，以及社交平台網民目測，可以梳理出一些訊息。\n特朗普下榻深東海朗廷酒店\n相關新聞：深圳APEC︱中美俄發和平宣言 學者：國際格局轉向 多個大國共同發揮影響力︱拆局\n深圳APEC主會場是香蜜湖邊的深圳國際交流中心，大會、晚宴全在這裏舉行。緊挨著它的五洲香蜜湖酒店年初剛落成，12月才開業，配合會議提前啓用，但多數領導人並非住在這裏。\n\n美國總統特朗普下榻深南大道的東海朗廷酒店。有酒店達人點評稱，這裏勝在離主會場只有幾公里，且有獨立塔樓、地下車庫可走專屬通道，高層還能整層封閉。\n\n俄羅斯總統普京則落腳前海的康萊德。可能因爲他當日凌晨抵深，早上隨即要到前海國際會議中心參與APEC工商領導人峰會，從酒店到會場，這是最短的一條路線。根據報道，他還在酒店裏見了越南和泰國領導人。\n高市早苗住好日子皇冠假日酒店\n日本首相高市早苗下榻的是福田好日子皇冠假日酒店。她前日返回東京前，專門在此酒店舉行了記者會。\n\n台灣代表、ACER電腦創辦人施振榮就入住四季酒店，並在酒店內宴請台企代表。有報道指加拿大總理卡尼也住此酒店。\n\n40多年前，深圳連一間像樣的酒店都沒有，香蜜湖就是那個充滿兒時回憶的度假村、遊樂場。40多年後，短短三天，一場大型會議，驗證了一個城市的現代化蛻變。\n\n紀曉華","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c273c38a96c","title":"AI擺烏龍？｜消防水炮狂噴火焰圖案遭嘲 滑雪場揭真相｜有片","url":"https://www.stheadline.com/realtime-china/3639299/AI擺烏龍消防水炮狂噴火焰圖案遭嘲-滑雪場揭真相有片","summary":"河北張家口一間滑雪場日前上演一幕「AI大烏龍」！","summary_short":"河北張家口一間滑雪場日前上演一幕「AI大烏龍」！","digest":"河北張家口一間滑雪場日前上演一幕「AI大烏龍」","points":["河北張家口一間滑雪場日前上演一幕「AI大烏龍」","場內一部自動消防水炮突然啟動，精準對準燒烤檔口印有烈火圖案的燈箱廣告牌狂噴水…","惟雪場昨日（19日）緊急澄清指，實屬炭爐熱源觸發水炮"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T07:00:00+08:00","size":1,"keywords":[],"body":"河北張家口一間滑雪場日前上演一幕「AI大烏龍」！場內一部自動消防水炮突然啟動，精準對準燒烤檔口印有烈火圖案的燈箱廣告牌狂噴水，影片瘋傳後遭網民調侃是「純視覺識別的缺陷」；惟雪場昨日（19日）緊急澄清指，實屬炭爐熱源觸發水炮。\n智能系統「睇錯」？\n綜合內媒報道，事發於11月19日中午時分，河北張家口崇禮萬龍滑雪場餐飲區當時坐滿用膳的滑雪客。天花板上一支具備自動定位功能的消防水炮突然啟動，噴射出強勁水柱，並不偏不倚地直射在燒烤檔口印有炭火火焰圖案的廣告燈箱上。\n由於現場並無冒出濃煙，水流順著招牌向下傾瀉形成水簾，獵奇畫面引來大批遊客舉機拍攝並上傳社交平台。不少網民隨即調侃「這難道是純視覺AI識別的缺陷？」，質疑智能消防系統「睇錯」，誤將海報上的假火當成了真火情。網民更聯想到自動駕駛汽車常因看錯廣告牌人像而緊急煞車的烏龍奇案。\n相關新聞：大烏龍｜手持摺扇被誤當刀 江西赤膊紋身男遭路人飛踹送警局\n雪場與消防澄清設備正常\n面對「AI消防水炮擺烏龍」的質疑，萬龍滑雪場與崇禮區消防大隊同日作出官方說明澄清，還原事件真相。\n發言人指出，該設備並非僅依靠單一視覺圖像識別，而是採用「視覺+紅外熱源」雙重檢測機制。事發時，是燒烤檔口後廚正在烤串的炭爐發生明火與高溫熱源，從而觸發了消防系統的正常工作流程。\n消防部門強調，水炮是在起火點周邊範圍進行定點噴射，只是噴射範圍剛好覆蓋了招牌區域，視覺上才造成「對著假火滅火」的誤會。\n意外發生後，工作人員在20分鐘內便清理好現場，無任何遊客受傷或物品被淋濕，雪場目前已調整炭爐的擺放角度，規避再次出現同類視覺誤會。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf3c7f9e88b","title":"我在APEC记者会现场！321场活动、75项成果，一起回顾APEC的成绩单","url":"http://www.chinanews.com.cn/gn/shipin/2026/11-21/news1075630.shtml","summary":"321场会议和活动，75项主要成果！","summary_short":"321场会议和活动，75项主要成果！","digest":"321场会议和活动，75项主要成果","points":["321场会议和活动，75项主要成果","APEC“中国年”交出怎样一份成绩单","贸易数字化、人工智能、互联互通、亚太共同体建设……中新网记者走进深圳APEC记者会现场…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:31:18+08:00","size":1,"keywords":[],"body":"321场会议和活动，75项主要成果！APEC“中国年”交出怎样一份成绩单？贸易数字化、人工智能、互联互通、亚太共同体建设……中新网记者走进深圳APEC记者会现场，带你梳理会议成果，一起看亚太合作有哪些新进展！","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9c2a798d6e","title":"印尼人与中国的故事：镜头、课本与父辈记忆","url":"https://www.chinanews.com.cn/hr/2026/11-20/10735602.shtml","summary":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆  　　中新社记者 李志全  　　15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门。","summary_short":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆  　　中新社记者 李志全  　　15年前…","digest":"题：印尼人与中国的故事：镜头…","points":["15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门","15年后，他再次来到厦门，举起相机，镜头里的城市已是另一番模样","11月20日，“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T23:32:07+08:00","size":1,"keywords":[],"body":"中新社雅加达11月20日电 题：印尼人与中国的故事：镜头、课本与父辈记忆\n\n　　中新社记者 李志全\n\n　　15年前，印度尼西亚群岛摄影学会会长邵亮明(Rasmono Sudarjo)曾到访中国厦门。那时的他，对这座城市的印象是道路相对狭窄、高楼不多。15年后，他再次来到厦门，举起相机，镜头里的城市已是另一番模样。\n\n　　“高楼林立，街道宽阔，环境优美……我几乎不敢相信自己的眼睛！”邵亮明说。\n\n11月20日，“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。图为民众参观展览。　中新社记者 李志全 摄\n\n　　11月20日，心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。展览展出印尼摄影家创作的100幅摄影作品，涵盖中国历史文化、自然风光、城市发展等内容。\n\n　　“每一张照片，都是一段真实的记录。”组织采风活动的邵亮明表示，此次厦门、漳州等地之行，让印尼摄影家们亲眼见证了中国的发展变化。\n\n　　对华裔黄鸿恩(Shania)而言，“中国”二字最初来自父辈的记忆和口口相传。\n\n　　“小时候，中国对我来说，是一个既熟悉又遥远的地方。”黄鸿恩说。家里虽保留着一些中国传统，但日常交流已很少使用中文。彼时，中国文化主要与春节和红包联系在一起。\n\n　　后来，黄鸿恩开始学习中文，接触茶艺、书法和传统舞蹈。然而，中国对她而言仍像隔着一扇窗，“我想知道，长辈故事里的中国今天是什么样子，课本之外的中国人又过着怎样的生活。”\n\n　　带着好奇，黄鸿恩赴苏州大学交流学习。古镇小巷、热闹集市、街边烧烤摊，都成为她认识中国的课堂。她品尝过大闸蟹，也尝过一些连招牌都不认识的小吃。\n\n　　这段经历，拉近了她与中国的距离。过去需要在课堂上学习的词语，渐渐有了声音、味道和具体的面孔。如今在一家印尼中企工作的黄鸿恩，“每天都在和中国打交道。”\n\n　　“中文让我走近中国，文化让我理解中国。”正在清华大学攻读研究生的王雅丽(Berillya Imandi ka)，通过现场大屏幕连线，分享自己与中国结缘的经历。\n\n　　她从中学开始接触中文，进入大学后，学习汉语言与中国文化。2019年，王雅丽参加“汉语桥”比赛，获得印尼非华裔组冠军，并在比赛中表演中国传统戏曲《贵妃醉酒》。\n\n　　“那次经历让我更加坚定了继续学习中文、进一步了解中国的想法。”此后，她赴福建师范大学交流学习，在亲身体验中认识了“一个比课本描述更加丰富和多元的中国”。\n\n　　印尼总统大学国际关系学副教授赖剑文长期关注中国发展，多次赴华访问交流。他说，中国在经济建设、基础设施和科技领域的显著进步，让他每次到访都有新的感受，也让外国人对中国有了新的认识。\n\n　　中国驻印尼使馆文化参赞王思平表示，本次活动既是一场“讲中国故事”的文化分享，也是一次以影像为媒、以文化会友的交流盛会。希望通过主题讲座、青年交流等多种形式，让更多印尼朋友特别是青年一代，从身边的故事和真实视角认识中国、了解中国。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cee484b8e7b","title":"大國外交｜王毅：中俄美元首會晤為重大創舉 體現大國擔當","url":"https://news.tvb.com/tc/1207540-大國外交王毅中俄美元首會晤為重大創舉體現大國擔當","summary":"中俄美元首舉行歷史性會晤。外長王毅表示，三方會晤是載入史冊的標誌性事件，順應時代潮流，符合世界的期待。","summary_short":"中俄美元首舉行歷史性會晤。","digest":"中俄美元首舉行歷史性會晤","points":["中俄美元首舉行歷史性會晤","外長王毅表示，三方會晤是載入史冊的標誌性事件，順應時代潮流，符合世界的期待","外長王毅表示：「三國元首歷史上首次舉行，這一面對面會晤開創了三國最高領導人交往的新紀錄…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T23:20+08:00","size":1,"keywords":[],"body":"中俄美元首舉行歷史性會晤。外長王毅表示，三方會晤是載入史冊的標誌性事件，順應時代潮流，符合世界的期待。\n\n外長王毅表示：「三國元首歷史上首次舉行，這一面對面會晤開創了三國最高領導人交往的新紀錄，也為新時期的大國協調互動構建了新範式，同時也是推進新型大國關係的新實踐，可以稱為國際關係史上的一個重大的創舉。」\n\n王毅指出：「其次這是一次體現大國擔當的標誌性的會晤。當前，世界百年變局加速演進，各種風險挑戰層出不窮，國際社會對和平與穩定的期盼，日益強烈，對大國加強溝通協調的呼聲，也不斷高漲。所以這次會晤順應時代潮流，符合世界的期待。」\n\n王毅稱：「習近平主席強調，大國和則世界安，大國鬥則世界亂。三國元首面對面，介紹了各自的戰略意圖，同意要防止發生衝突對抗，要守住和平共處的底線，並且期待形成和平共處，總體穩定、均衡發展的大國關係的新格局。」","image":"https://pro-vod-cdn.tvb.com/f6a9bf6a831b44dd99e44801765c3b5d/snapshots/9c43358899be4dceb0708ca75fc7cbfc-00008.jpg","video":"https://pro-vod-cdn.tvb.com/f6a9bf6a831b44dd99e44801765c3b5d/4ce3bb9ea073426c960c946a3c9b640d-c4e6b76d424b69144e0e02a50ae0dc71-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/f6a9bf6a831b44dd99e44801765c3b5d/snapshots/9c43358899be4dceb0708ca75fc7cbfc-00008.jpg","lang":"zh-Hant"},{"id":"c19c482a196","title":"“泰国v姐”陈映玲解码《给阿嬷的情书》走红：内核在于真实与真诚","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-20/news1075620.shtml","summary":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。","summary_short":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。","digest":"11月20日，2026年侨海(客家)青年发展大会在海口市举行","points":["11月20日，2026年侨海(客家)青年发展大会在海口市举行","《给阿嬷的情书》参演者、短视频创作者“泰国v姐”陈映玲接受中新社记者采访时表示，爱国爱乡…","人与人之间情感相通，影片的出圈印证真心能够跨越地域与语言的隔阂"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T22:34:26+08:00","size":1,"keywords":[],"body":"11月20日，2026年侨海(客家)青年发展大会在海口市举行。《给阿嬷的情书》参演者、短视频创作者“泰国v姐”陈映玲接受中新社记者采访时表示，爱国爱乡、有情有义的精神，适用于每一个时代、每一个人。她说，《给阿嬷的情书》走红的内核在于真实与真诚；人与人之间情感相通，影片的出圈印证真心能够跨越地域与语言的隔阂。(陈英清 林士杰)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/84FA9BAD929640A1A00282E0F4A80B7E.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2cb526264e","title":"多国媒体记者热议中俄美元首会晤：见证历史性时刻 世界需要加强合作","url":"https://www.chinanews.com/gn/shipin/cns/2026/11-21/news1075627.shtml","summary":"11月19日，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"11月19日，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["11月19日，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤","会后，中俄美三国发表《中俄美元首和平宣言》","中新社记者就此采访多国媒体记者，“和平”成为被提及最多的关键词"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T09:20:45+08:00","size":1,"keywords":[],"body":"11月19日，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。会后，中俄美三国发表《中俄美元首和平宣言》。中新社记者就此采访多国媒体记者，“和平”成为被提及最多的关键词。(中新社记者综合报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/AEE8F9C2131F4048A92E5042C81C6990.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c164477685e","title":"（深圳APEC）“未来在此被设计、测试和建造”——APEC与会领导人点赞深圳","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735538.shtml","summary":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举…","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新社深圳11月20日电 (记者 国璇)11月18日至19日…","多位APEC成员经济体领导人在不同场合点赞深圳的发展成就，并期待有更多“深圳奇迹”出现…","“在不到50年的时间里，深圳就从一个边陲小镇成长为拥有约1800万人口的超大城市"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:13:40+08:00","size":1,"keywords":[],"body":"中新社深圳11月20日电 (记者 国璇)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。多位APEC成员经济体领导人在不同场合点赞深圳的发展成就，并期待有更多“深圳奇迹”出现，为亚太区域合作注入更多确定性。\n\n　　“在不到50年的时间里，深圳就从一个边陲小镇成长为拥有约1800万人口的超大城市。”加拿大总理卡尼认为，深圳代表了这个时代最伟大的变革之一。\n\n　　“深圳从一项政策试验变成全球经济引擎，从雄心勃勃的愿景转化为全新的生活方式，这种进步并非源于命运的眷顾或大自然的馈赠，而是来自一次次主动抉择。”在卡尼看来，深圳的成就来自开放、创新与合作。“未来在这里被设计、测试和建造。”\n\n　　韩国总统李在明表示，深圳生动展现了科技如何改变人们的生活。从在都市上空飞行的无人机、在道路上行驶的电动汽车，到应用人工智能与机器人的尖端制造现场，曾经仿佛遥不可及的未来科技，在深圳正逐渐成为日常。\n\n　　作为首位踏足深圳的在任美国总统，特朗普在同中国国家主席习近平会见时称赞深圳：“深圳真的是个非常棒的城市，只可惜有些媒体朋友没有办法看到城市全景。”\n\n11月17日，APEC会议周期间，市民游客在深圳人才公园的人才星光桥观看“春笋”、深圳湾一号等建筑亮起APEC主题标语。　中新社记者 陈楚红 摄\n\n　　“创新”是多位APEC成员经济体领导人提到的关键词。俄罗斯总统普京说，深圳是最现代化、最具活力的大都市之一，有机结合了高度城市化、舒适的城市环境和创新的生产基地。他还表示，深圳堪称中国经济发展成就的象征。\n\n　　智利总统卡斯特说，深圳已成为一座人口近2000万人的全球创新之都。“深圳的发展告诉大家，进步不是奇迹，而是一种决心，它需要劳动、努力和意志力。”\n\n　　新加坡总理黄循财在个人社交媒体上分享了一条展现深圳城市风光和科技创新成果的短视频，配文说：“自从我上次到访已经过去好几年了，这里的变化令人瞩目。深圳已成为充满活力的创新中心，尤其是在人工智能和机器人领域。”\n\n　　泰国总理阿努廷表示，深圳从小渔村发展成全球商贸大都会、先进技术与创新中心，其活力表明转型需要改革的意愿、坚持开放的信心，以及把全球联系转化为本地优势的能力。\n\n　　澳大利亚总理阿尔巴尼斯结合个人经历，以“两张照片”的对比形容深圳的巨大变化。“我在1998年第一次来到深圳。深圳这个非凡的成功故事，正是亚太地区经济显著增长的一个例证。如果你把深圳1998年和2026年的两张照片放在一起，你绝对不会认为这是同一个地方。”\n\n　　越共中央总书记、国家主席苏林说，过去几十年来，不论是深圳自身、还是整个中国所取得的跨越式发展成就，都证明了坚持改革开放和创新发展的正确性，同时表明各经济体携手合作对共促繁荣的重要意义。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccf4d10c7c7","title":"“国际基建卓越周2026”在港揭幕 香港发展局与多方推进基建合作","url":"https://www.chinanews.com.cn/dwq/2026/11-20/10735576.shtml","summary":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。","summary_short":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。","digest":"由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香…","points":["中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2…","香港特区行政长官李家超在活动上见证发展局与多个香港及海外机构交换意向书和合作备忘录…","李家超在开幕典礼上致辞时表示，要建设北部都会区并实现其发展愿景，香港必须以智慧城市理念…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:04:02+08:00","size":1,"keywords":[],"body":"中新社香港11月20日电 由香港特区政府发展局(简称“发展局”)牵头主办的“国际基建卓越周2026”20日在香港揭幕。香港特区行政长官李家超在活动上见证发展局与多个香港及海外机构交换意向书和合作备忘录，以推动跨地域、跨领域的深度交流与合作，为更多香港、中国内地的建造企业及产品“出海”奠定基础。\n\n11月20日，由香港特区政府发展局牵头主办的“国际基建卓越周2026”在香港揭幕。图为香港特区行政长官李家超(中)和嘉宾主持开幕典礼。　(香港特区政府新闻处 供图)\n\n　　“国际基建卓越周2026”主要活动包括第二届国际基建项目领导峰会、“模块建造国际会议2026”和“建造创新博览会2026”，旨在构建建造业顶尖国际交流平台以促进可持续发展、提升基建效能，以及加速创新科技落地，推动行业升级转型。\n\n　　李家超在开幕典礼上致辞时表示，要建设北部都会区并实现其发展愿景，香港必须以智慧城市理念、人工智能、先进工程技术、创新建造方法及材料，打造配合未来需要的基础设施，而协作是建造业迈向卓越的关键。\n\n　　活动同场举行第二届国际基建项目领导峰会，超过800位来自全球30多个国家和地区的大型基建项目领袖和专家与会。峰会以“灼见赋能 擘画蓝图”为主题，探讨如何应对建造业的挑战及推动高质量发展。\n\n　　发展局局长甯汉豪表示，特区政府积极推动建造业升级转型，迈向高端化、智能化及高质量发展；在提速北部都会区建设时，积极推行革新，精简审批程序，并善用人工智能，推动广泛应用先进建筑物料与科技。她介绍，香港在国际建筑成本排名持续改善，建筑成本从2020年的全球第3位回落至本年度的第16位，反映成本控制取得进步。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7628b42ad7","title":"2026年空手道世界杯在杭州举行 系首次落地中国","url":"https://www.chinanews.com.cn/ty/2026/11-20/10735575.shtml","summary":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。","summary_short":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。","digest":"2026年空手道世界杯于20日在浙江杭州开幕","points":["中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕","来自全球41个国家和地区的79支顶尖队伍齐聚赛场，角逐男子团体型、女子团体型、男子团体组手…","开幕式上，世界空手道联合会主席安东尼奥·埃斯皮诺斯在致辞中表示…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T22:03:12+08:00","size":1,"keywords":[],"body":"中新社杭州11月20日电 (张煜欢)2026年空手道世界杯于20日在浙江杭州开幕。来自全球41个国家和地区的79支顶尖队伍齐聚赛场，角逐男子团体型、女子团体型、男子团体组手、女子团体组手四个项目金牌，中国队将参加全部四项比拼。这也是空手道世界杯首次在中国举办。\n\n　　开幕式上，世界空手道联合会主席安东尼奥·埃斯皮诺斯在致辞中表示，本次赛事不仅是竞技比拼的舞台，更是加深友谊、增长经验的宝贵契机，希望所有参赛者珍惜机会，在赛场上尽情展现空手道的独特魅力与卓越风采。\n\n　　空手道世界杯是世界空手道联合会最高级别团体赛事。比赛首日进行了男子团体组手、女子团体型小组赛及四分之一决赛。男子团体组手项目中，土耳其、伊朗、黑山和WKF-1队闯入四强。女子团体型项目中，中国队在四分之一决赛险胜意大利，携手埃及、伊朗、日本晋级半决赛。\n\n11月20日，2026年空手道世界杯在杭州开幕，共有41个国家和地区的79支队伍参与角逐。图为比赛现场。肖健 摄\n\n　　“这是我第二次来到杭州参赛，这里的比赛场馆很棒，赛事也组织得很好，这些都给我留下了深刻印象。今年我们期待在杭州能取得更好的成绩。”西班牙队队员玛丽亚·托雷斯说。\n\n　　“这次我参加的是女子团体组手项目，团体项目和个人项目确实有不一样的感觉，个人项目单独作战，自己拼尽全力就可以，团体项目集聚了来自不同级别的优秀选手，每个人都要上场，更讲究团队配合。”中国队队员、爱知·名古屋亚运会空手道女子组手68公斤级冠军李巧巧说，“这次在家门口比赛心情也很开心、激动，希望我们的成绩能一次比一次好”。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"台灣","total":1,"items":[{"id":"c3de32e7886","title":"台湾媒体人给深圳APEC打120分：“Perfect！非常完美！”","url":"https://www.chinanews.com/tw/shipin/2026/11-20/news1075617.shtml","summary":"台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展，并观察到从世界各地远道而来的领袖们在参会期间，几乎都会对这座城市本身表达赞叹。","summary_short":"台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展，并观察到从世界各地远道而来的领袖们在参会期间…","digest":"台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展…","points":["台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展…","对于此次深圳APEC会议，他直言：“Perfect"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:48:08+08:00","size":1,"keywords":[],"body":"台湾媒体人唐湘龙近日在节目中分享在深圳的感受时，惊叹于深圳的发展，并观察到从世界各地远道而来的领袖们在参会期间，几乎都会对这座城市本身表达赞叹。对于此次深圳APEC会议，他直言：“Perfect！120 分！”“办得非常完美！”(中新网“燕新台”工作室）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/20/4677a258-d7f9-4485-8230-c68a9f836e9a.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"國際","total":36,"items":[{"id":"c6f94ff7a31","title":"探访秘鲁钱凯港：跨越太平洋的发展新机遇","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735662.shtml","summary":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际…","summary_short":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024年11…","digest":"题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024…","points":["2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际…","秘鲁首都利马以北约80公里，碧蓝的太平洋畔，钱凯港巨型岸桥高高耸立，智能集卡穿梭于集装箱堆场","目前，钱凯港已建成4个生产性泊位，配备6台远程操控岸桥、15台自动化轨道吊、50台智能集卡…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:32:08+08:00","size":1,"keywords":[],"body":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇\n\n　　中新社记者 林春茵\n\n　　2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际，中秘合作建设的钱凯港正式开港。两年后，APEC时间来到中国深圳。作为亚太互联互通的标志性项目，钱凯港发生了怎样的变化？记者日前走访这座年轻的港口，探寻答案。\n\n近日，航拍秘鲁钱凯港。(钱凯港 供图)\n\n　　秘鲁首都利马以北约80公里，碧蓝的太平洋畔，钱凯港巨型岸桥高高耸立，智能集卡穿梭于集装箱堆场。走进钱凯港中央控制室，工作人员通过屏幕远程操控码头设备，装卸、运输、堆存等作业环节有序衔接。\n\n　　“从最初的一片荒滩，到如今码头操作区、入口辅建区、隧道及连接道路等基础设施已基本完善。”钱凯港常务副总经理何波亲历了南美洲首个绿色智慧现代化港口从无到有的全过程。\n\n　　何波说，作为连接亚洲与南美市场的重要物流节点，钱凯港开港后，“钱凯—上海”直航航线投入运营，两地海运时间从35至40天缩短至23天。相较直航开通前，物流成本降低逾20%。\n\n　　目前，钱凯港已建成4个生产性泊位，配备6台远程操控岸桥、15台自动化轨道吊、50台智能集卡，港机设备实现100%电气化，生产能源全部采用绿色电力。\n\n　　2026年前9个月，钱凯港累计完成船舶作业323艘次，同比增长31%；集装箱吞吐量达34万标准箱，同比增长47%。\n\n近日，秘鲁钱凯港作业场景。(钱凯港 供图)\n\n　　今年，19.6吨秘鲁鲜食香蕉搭乘“钱凯快航”抵达上海洋山港，首次进入中国市场。从牛油果、蓝莓到香蕉，越来越多拉美农产品摆上中国消费者的餐桌。\n\n　　如今的钱凯港，联通的不仅是中国和秘鲁。开港两年来，钱凯港已形成3条干线、5条支线的航运网络，覆盖亚洲、南美洲西海岸及中美洲主要港口，辐射巴西、厄瓜多尔等拉美国家。\n\n　　今年7月，一条连接秘鲁帕伊塔港、钱凯港与哥斯达黎加卡尔德拉港的支线开通。秘鲁北部及中美洲货物可汇集至钱凯港，搭乘远洋货轮直抵亚洲市场。\n\n　　据秘鲁国家海关与税务管理局统计，2026年前9个月，经钱凯港出口的货物总额达27.68亿美元，同比增长57.27%。\n\n　　“钱凯港有助于进一步畅通亚太与南美之间的贸易往来，提升区域供应链效率。”何波说，跨太平洋运输周期的缩短，为拉美农产品开拓亚洲市场带来新的机遇。\n\n当地时间11月20日，秘鲁钱凯港，钱凯港自动化轨道吊操作员莫妮卡·比索(Nicole　Monica　Bisso　Melendez)正在工作。　丘艳 摄\n\n　　钱凯港自动化轨道吊操作员莫妮卡·比索(Nicole Monica Bisso Melendez)是土生土长的钱凯人，此前从未接触过港口作业，但通过职业技能培训，走上了智能化码头的操作岗位。\n\n　　“我现在能操作吊运数吨货物的大型机械。”莫妮卡·比索说，“对年轻人来说，在钱凯港工作有很好的发展机会。”\n\n　　目前，钱凯港秘鲁籍员工占比近98.88%，来自钱凯、瓦拉尔周边社区的员工占比逾55%，女性员工占比逾20%。港口还联合秘鲁当地行业协会，开展国际贸易、旅游服务、烹饪技艺等职业技能培训，累计惠及逾千名当地青年、妇女和创业者。\n\n　　“港口还为本地供应商和中小企业带来了发展机遇。”钱凯港秘方副总经理杰森表示，钱凯这个传统渔村，正在成长为重要的贸易和物流枢纽。(完)\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4bd28c9816","title":"遊日注意 | 日本受強冷空氣影響 多地迎來初雪","url":"https://www.stheadline.com/realtime-world/3639549/遊日注意-日本受強冷空氣影響-多地迎來初雪","summary":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。","summary_short":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。","digest":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪","points":["日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪","氣象廳表示，受高空冷空氣影響，大氣極不穩定的狀態持續，提醒北陸地區至周日仍須嚴防土石災害","在岐阜縣白川鄉，屋頂被厚厚的白雪覆蓋，四周一片白茫茫"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:31:56+08:00","size":1,"keywords":[],"body":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。氣象廳表示，受高空冷空氣影響，大氣極不穩定的狀態持續，提醒北陸地區至周日仍須嚴防土石災害。\n在岐阜縣白川鄉，屋頂被厚厚的白雪覆蓋，四周一片白茫茫。受強烈冬季季候風影響，廣泛地區持續降雪，東北的秋田縣秋田市6小時內錄得20厘米降雪量，岩手縣西和賀町積雪超過40厘米。\n日本受強冷空氣影響，多地迎來降雪。法新社\n岐阜縣白川鄉迎來降雪。白川鄉觀光協會\n厚雪覆蓋白川鄉 旭川積雪22厘米\n北海道旭川有22厘米積雪，深川市積雪則超過30厘米。四國和鳥取縣等地區，以及仙台市及長野市亦迎來初雪。\n在東北的山形縣，周五下午3時左右，東根市國道48號線上一輛大型卡車因降雪受困。縣警表示，後方約50輛車也一度滯留，所幸無人受傷或身體不適。\n多地山區降雪最高50厘米\n氣象廳指，多地降雪主要集中在山區，最高可達到50厘米，又預計北海道周六平均風速達每秒20米，最大陣風則為每秒30米。\n另外，北陸地區截至周六下午6時的24小時累積雨量，局部地區預計可達120毫米，其後24小時還將達80毫米。\n氣象廳表示，冬季型氣壓分布將持續至周六，在北日本至西日本上空約5500米處，將有較往年低約10度、氣溫低於零下30度的強冷空氣流入。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c58cb652a48","title":"丹麦驱逐俄罗斯武官，俄表示将“适当回应”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735674.shtml","summary":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官，要求其在7日内离境。","summary_short":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官…","digest":"综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布…","points":["中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布…","俄外交部表示，将对丹麦驱逐其武官一事“作出适当回应”","据英国《卫报》报道，拉斯穆森当天在哥本哈根举行的记者会上表示…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:27:26+08:00","size":1,"keywords":[],"body":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官，要求其在7日内离境。俄外交部表示，将对丹麦驱逐其武官一事“作出适当回应”。\n\n　　据英国《卫报》报道，拉斯穆森当天在哥本哈根举行的记者会上表示，丹麦已召见俄罗斯驻丹麦大使弗拉基米尔·巴尔宾，告知丹方驱逐俄罗斯国防武官的决定。他称，此举旨在向俄方“发出明确信号”。拉斯穆森同时表示，丹麦不会因此切断与俄罗斯的外交联系，将继续支持乌克兰。\n\n　　拉斯穆森还表示，丹麦正在加大力度，推动停止向俄罗斯公民发放非必要签证，并已在欧洲层面推动进一步收紧俄罗斯公民入境相关规定。据土耳其阿纳多卢通讯社报道，丹麦还计划与其他申根国家讨论相关签证限制。\n\n　　丹麦安全与情报局20日发布通报称，该机构评估认为，俄罗斯情报机构策划并发起了一起针对一名乌克兰裔美国公民的暗杀行动。丹麦有关部门于9月25日挫败了这一行动。\r\n\n　　对于丹方指控，俄罗斯驻丹麦大使馆表示，丹麦方面没有提供俄罗斯参与所谓暗杀行动的证据。俄罗斯外交部发言人扎哈罗娃则表示，莫斯科将对丹麦驱逐俄国防武官一事作出“适当回应”。 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b552d0bc5","title":"太空農業突破 | 模擬月球土壤添加有機物 種出食用馬鈴薯","url":"https://www.stheadline.com/realtime-world/3639541/太空農業突破-模擬月球土壤添加有機物-種出食用馬鈴薯","summary":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊，成功在添加了有機物的模擬月球土壤中，培育出安全且營養豐富的食用馬鈴薯…","summary_short":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊…","digest":"由美國太空總署資助…","points":["由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric G…","這項研究在權威期刊《npj Microgravity》發表…","月球表面的月塵（lunar regolith）由數億年的隕石撞擊形成…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:46:56+08:00","size":1,"keywords":[],"body":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊，成功在添加了有機物的模擬月球土壤中，培育出安全且營養豐富的食用馬鈴薯，其生長和產量可以媲美地球上種植的馬鈴薯。\n這項研究在權威期刊《npj Microgravity》發表，證實只要在月球模擬岩屑中添加適量有機物質，即可獲得有如地球良田的農作物產量，為未來建立長期月球基地與太空人糧食自給，奠定了關鍵里程碑。\n科學家成功在模擬月球土壤培育出安全且營養豐富的食用馬鈴薯。路透社\n模擬月球土壤的馬鈴薯生長和產量，可以媲美地球上種植的馬鈴薯。路透社\n為月球基地糧食自足鋪路\n月球表面的月塵（lunar regolith）由數億年的隕石撞擊形成，極其鋒利且完全缺乏植物生長所需的氮元素與有機物質，甚至含有高劑量的銅等重金屬。\n研究團隊選用成熟快、紅皮白肉的「Modoc」馬鈴薯品種，並混入蚯蚓分解有機廢棄物產生的「蚯蚓堆肥」（vermicompost）進行試驗。\n產量媲美地球農田\n實驗結果顯示，未添加堆肥的純月塵幾乎無法結出塊莖；然而當堆肥比例提升至30%時，馬鈴薯產量與在俄勒岡州赫米斯頓（Hermiston）優質農地種植的表現完全一致。\n戈耶指出，有機物質不僅提供必需氮素，更能有效阻止植物過度吸收重金屬。\n未來，太空人可以將少量有機物質帶到月球，然後透過將食物殘渣和植物廢料轉化為更多有機物質來製造更多有機物，從而減少從地球運輸生長材料的需求。\n具高度飽足感 視為月球理想主食\n馬鈴薯單位面積熱量極高，富含維生素C、優質蛋白質與比香蕉更高劑量的鉀，具備高度飽足感，被視為月球基地的理想主食。 \n共同作者、太空生物學家漢迪（David Handy）強調，此項月球農業技術未來亦可轉化應用於地球，協助缺乏資源的沙漠地區、貧瘠城市或遭重金屬污染的土壤進行修復，實現地表與太空的永續農業目標。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce42792ac38","title":"特朗普称无法接受伊朗想达成的协议 重申伊朗“永远不会拥有核武器”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735660.shtml","summary":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议，但伊朗方面想要的并非他所能接受的协议。","summary_short":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议…","digest":"据美联社报道，美国总统特朗普当地时间20日表示…","points":["中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示…","特朗普20日在白宫举行的新闻发布会上表示，“我们要达成一项真正的协议，而不是虚假协议","”随后，特朗普再次重申其一贯承诺，“伊朗永远、永远不会拥有核武器"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:31:47+08:00","size":1,"keywords":[],"body":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议，但伊朗方面想要的并非他所能接受的协议。\n\n资料图：美国总统特朗普。 \n\n　　据报道，特朗普20日在白宫举行的新闻发布会上表示，“我们要达成一项真正的协议，而不是虚假协议。”随后，特朗普再次重申其一贯承诺，“伊朗永远、永远不会拥有核武器。”\n\n　　报道称，特朗普在是否达成协议的问题上态度摇摆：时而主张达成一项结束战事的协议，时而又表示美国无需达成任何协议。分析人士认为，美伊下一步行动充满不确定性，加之最新一轮时强时弱的相互攻击，反映出冲突持续近九个月之际，双方都处于难以为继的境地。\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c236072785d","title":"日媒：日本研究引进核潜艇及为“无核三原则”设例外","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735659.shtml","summary":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。","summary_short":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。","digest":"据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光","points":["新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道…","草案提出“启动研究”引进核动力潜艇问题，并允许在紧急情况下将核武器运进日本","报道援引多名相关人士的话说，该草案设想在2027至2031财年期间启动引进核动力潜艇相关项目…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:25:04+08:00","size":1,"keywords":[],"body":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。草案提出“启动研究”引进核动力潜艇问题，并允许在紧急情况下将核武器运进日本。\n\n　　报道援引多名相关人士的话说，该草案设想在2027至2031财年期间启动引进核动力潜艇相关项目，并以“调查研究费”的名义安排必要预算。\n\n　　报道说，引进核动力潜艇和调整“无核三原则”相关表述是此次修订“安保三文件”的主要议题。“无核三原则”指“不拥有、不制造、不运进核武器”。草案一方面声称坚持这一原则，另一方面又明确写入允许在紧急情况下运进核武器的例外情况。\n\n　　报道称，日本政府高层主张拥有核动力潜艇，认为可在艇上搭载导弹垂直发射装置，将其作为实施所谓“强化反击能力”的手段之一。\r\n\n　　日本首相高市早苗10月14日在国会答辩中暗示，可能在今年年底修订《国家安全保障战略》等“安保三文件”时，调整其中有关“无核三原则”的表述。日本多个民间团体11月18日共同向日本外务省提交诉求书，要求政府坚持“无核三原则”，随后又于20日向防卫省递交由4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbd0eab3af7","title":"“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735636.shtml","summary":"中新网雅加达11月21日电 (记者 李志全)心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展20日在雅加达举行。","summary_short":"中新网雅加达11月21日电 (记者 李志全)心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展20日在雅加达举…","digest":"心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展20日在雅加达举行","points":["图为中国驻印尼使馆文化参赞王思平致辞","印尼福建社团联谊总会总主席俞雨龄认为，摄影是跨越语言的艺术，文化是连接心灵的桥梁","由印尼摄影家亲自走进中国、观察中国，再通过镜头向印尼社会介绍中国，这种交流方式更加生动…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:05:33+08:00","size":1,"keywords":[],"body":"中新网雅加达11月21日电 (记者 李志全)心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展20日在雅加达举行。\n\n图为中国驻印尼使馆文化参赞王思平致辞。记者 李志全 摄\n\n　　中国驻印尼使馆文化参赞王思平表示，本次活动以“心联通·文互鉴”为主题，既是一场“讲中国故事”的文化分享，也是一次以影像为媒、以文化会友的交流盛会。希望通过主题讲座、青年交流、文艺展演和文化体验等多种形式，让更多印尼朋友特别是青年一代，从身边的故事和真实的视角认识中国、了解中国。\n\n　　印尼福建社团联谊总会总主席俞雨龄认为，摄影是跨越语言的艺术，文化是连接心灵的桥梁。由印尼摄影家亲自走进中国、观察中国，再通过镜头向印尼社会介绍中国，这种交流方式更加生动、真实，也更容易引起两国人民的共鸣。\n\n　　印尼群岛摄影学会会长邵亮明说，希望通过摄影这一跨越语言与国界的艺术形式，以真实的影像讲述中国故事，以独特的艺术视角展现中国风貌，让更多印尼朋友认识中国、了解中国，进一步增进两国人民之间的相互理解、文化交流与深厚友谊。\n\n图为人们在参观摄影展览。记者 李志全 摄\n\n　　本次展览共展出印尼摄影家创作的100幅摄影作品，涵盖中国历史文化、自然风光、城市发展、人文风情等内容，从不同角度展现真实、生动的中国。\n\n　　活动现场还安排了中文歌曲合唱、传统舞蹈等文艺节目，以及书法、吹画、漆扇和茶艺等文化体验活动。(完)\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c16ce4c3640","title":"英国推进移民制度改革 持续关停庇护安置酒店","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735614.shtml","summary":"中新社伦敦11月20日电 (记者 欧阳开宇)英国内政部20日宣布，英国政府持续推进移民庇护制度改革，再度关停多处用于安置寻求庇护者的临时酒店，进一步缓解地方社区公共服务压力，压降庇护安置财政成本。","summary_short":"中新社伦敦11月20日电 (记者 欧阳开宇)英国内政部20日宣布，英国政府持续推进移民庇护制度改革…","digest":"英国内政部20日宣布，英国政府持续推进移民庇护制度改革…","points":["中新社伦敦11月20日电 (记者 欧阳开宇)英国内政部20日宣布…","据官方发布数据，自今年夏季以来，英国新关停8家庇护安置酒店，本年度累计关停数量达52家","目前英国仍在使用的庇护酒店约140家，较2023年峰值400家大幅缩减"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:05:07+08:00","size":1,"keywords":[],"body":"中新社伦敦11月20日电 (记者 欧阳开宇)英国内政部20日宣布，英国政府持续推进移民庇护制度改革，再度关停多处用于安置寻求庇护者的临时酒店，进一步缓解地方社区公共服务压力，压降庇护安置财政成本。\n\n　　据官方发布数据，自今年夏季以来，英国新关停8家庇护安置酒店，本年度累计关停数量达52家。目前英国仍在使用的庇护酒店约140家，较2023年峰值400家大幅缩减。酒店安置的庇护者人数较历史最高值下降超七成，安置规模显著回落。\n\n　　英国政府表示，近年来一系列移民改革举措持续落地生效，非法入境、不实庇护申请等乱象得到有效管控。伴随入境人数回落、申请审理提速、遣返力度加大，英国庇护安置体系供需压力缓解，政府得以有序退出成本高昂的临时酒店安置模式。\n\n　　长期大规模租用酒店安置寻求庇护者，曾给英国多地社区带来公共资源紧张、民生承压等问题，公共财政负担居高不下。英国政府正通过制度优化、流程规范、从严治理，逐步替代酒店临时安置方式，推动庇护安置体系回归合理、可持续的运行状态。\r\n\n　　英国政府强调，将坚持稳步关停剩余庇护安置酒店，持续优化移民庇护管理机制，在保障合法庇护需求的同时，切实减轻社区治理压力、节约公共财政资源，维护本土社会秩序稳定。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c73d4523fb7","title":"南非7月至9月发生5590起谋杀案 超半数案发公共场所","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735612.shtml","summary":"中新社约翰内斯堡11月20日电 (记者 孙翔)南非警察局20日公布的犯罪统计数据显示，今年7月至9月，南非共发生5590起谋杀案件，平均每天约有60人遭谋杀；其中，近3000起发生在公共场所。","summary_short":"中新社约翰内斯堡11月20日电 (记者 孙翔)南非警察局20日公布的犯罪统计数据显示，今年7月至9月…","digest":"南非警察局20日公布的犯罪统计数据显示，今年7月至9月，南非共发生5590起谋杀案件…","points":["中新社约翰内斯堡11月20日电 (记者 孙翔)南非警察局20日公布的犯罪统计数据显示…","其中，近3000起发生在公共场所","南非代理警察部长菲罗兹·卡查利亚当天在新闻发布会上表示，南非暴力犯罪总体呈下降趋势…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:02:33+08:00","size":1,"keywords":[],"body":"中新社约翰内斯堡11月20日电 (记者 孙翔)南非警察局20日公布的犯罪统计数据显示，今年7月至9月，南非共发生5590起谋杀案件，平均每天约有60人遭谋杀；其中，近3000起发生在公共场所。\n\n　　南非代理警察部长菲罗兹·卡查利亚当天在新闻发布会上表示，南非暴力犯罪总体呈下降趋势，较去年同期的5794起减少204起。本季度，持械抢劫案件出现显著下降。其中，汽车劫持案件同比下降16.8%，卡车劫持案件下降27.9%。\n\n　　值得注意的是，尽管南非谋杀案件数量同比下降，但环比连续两个季度增加。今年第一季度，南非共记录5181起谋杀案件，第二季度增至5427起，第三季度进一步升至5590起，最近两个季度环比分别增长4.7%和3.0%。\n\n　　卡查利亚说，南非案发区域性很强，约80%的帮派相关谋杀和近60%的出租车业相关谋杀发生在西开普省，豪登省则是抢劫相关谋杀案件数量最多的省份。\r\n\n　　数据显示，该季度近3000起谋杀案件、1547起强奸案件发生在公共场所，包括街道、公园、海滩和停车场等。针对公共场所犯罪问题，卡查利亚呼吁地方政府、业主及相关部门加强公共空间管理。\n\n　　此外，南非该季度共记录9908起强奸案件。在能够核实受害者性别和年龄的9705起案件中，4362名受害者为未满18岁的儿童，占比约45%；另有5116名成年女性和227名成年男性受害者。\n\n　　今年7月至9月，豪登省埃库鲁莱尼及周边地区发生涉及12名女性遇害案，引发社会广泛关注。南非警方近日表示，针对相关案件已逮捕8名嫌疑人。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb3bcc855dd","title":"澤連斯基不滿特朗普視普京為朋友 惟仍冀美方續斡旋烏俄衝突","url":"https://news.tvb.com/tc/1207582-澤連斯基不滿特朗普視普京為朋友惟仍冀美方續斡旋烏俄衝突","summary":"美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武，以及密謀向華盛頓施襲。烏克蘭總統澤連斯基不滿他將普京視為「朋友」，但仍希望美國繼續斡旋烏俄衝突。","summary_short":"美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武，以及密謀向華盛頓施襲。","digest":"美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武…","points":["美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武…","烏克蘭總統澤連斯基不滿他將普京視為「朋友」，但仍希望美國繼續斡旋烏俄衝突","而在歐洲多國演習期間，有導彈及無人機闖入波蘭領空，華沙當局質疑是俄軍所為"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T08:30+08:00","size":1,"keywords":[],"body":"美國總統特朗普表示，美中俄三國要攜手合作，阻止核威脅在全球擴散，絕不容許伊朗擁有核武，以及密謀向華盛頓施襲。烏克蘭總統澤連斯基不滿他將普京視為「朋友」，但仍希望美國繼續斡旋烏俄衝突。而在歐洲多國演習期間，有導彈及無人機闖入波蘭領空，華沙當局質疑是俄軍所為。\n\n俄烏局勢引起國際關注，歐洲11個國家共派出數千名軍人，本月9日起在波蘭參加聯合演習，直到明日結束，以協助烏克蘭準備重建國家及部署軍隊。這次聯合演習被視為檢視英、法兩國牽頭自願聯盟的實力水平。\n\n在歐洲多國演習期間，波蘭防長周五批評俄羅斯向波蘭領空發射三個物體，相信是兩枚導彈及一架無人機，墜落在接近波蘭東南部的軍訓場地。\n\n俄烏戰事持續，烏克蘭多個地區及首都基輔繼續遇襲。俄羅斯總統普京曾揚言，要為烏方襲擊克里米亞大橋報復。俄軍被指曾出動攜帶集束彈頭的彈道導彈，擴大攻擊範圍，造成多人死傷。\n\n烏克蘭總統澤連斯基指，中美俄三國元首會晤後不久，當地就遇襲，他質疑會談成效。\n\n澤連斯基又接受美國有線新聞網絡CNN訪問，他將普京視為意圖徹底摧毀烏克蘭的「殺手」，又稱即使美國總統特朗普視普京是「朋友」，但美國仍是烏俄之間合適的斡旋方。\n\n特朗普周五在白宮總結訪華及菲律賓之行時，為「朋友論」護航，他稱普京希望以外交途徑結束戰事。對於俄軍最近向烏克蘭施襲，特朗普就稱，普京同澤連斯基都要負起相同責任。\n\n近日有傳媒報道，美方收到情報指，伊朗密謀在華盛頓引爆骯髒彈或化學武器，特朗普就稱，絕不容許此事發生。\n\n美國總統特朗普稱︰「有關他們(伊朗)製造骯髒彈的傳聞，若他們這樣做，我們很了解伊朗，知道他們說甚麼，身份是誰，在哪裡。我們絕不容許此事發生。」\n\n特朗普稱，跟國家主席習近平及普京討論，三國要攜手合作，阻止核威脅在全球擴散，並確保伊朗永遠不會擁有核武。\n\n特朗普又認為伊朗不想達成他能接受的協議，伊朗外長阿拉格齊就強調，仍相信可跟美國達成公平的解決方案，但德黑蘭不會讓國內濃縮軸運到海外。","image":"https://pro-vod-cdn.tvb.com/7f7c86d3f47e40bbaeba482ff5fa820a/snapshots/13a5c6be9f174fdda399ed189f3f1af8-00008.jpg","video":"https://pro-vod-cdn.tvb.com/7f7c86d3f47e40bbaeba482ff5fa820a/03938f43a8cf4886947ee3ef83cfe801-94357b60105580950d26401cf816c22b-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/7f7c86d3f47e40bbaeba482ff5fa820a/snapshots/13a5c6be9f174fdda399ed189f3f1af8-00008.jpg","lang":"zh-Hant"},{"id":"c35453922ea","title":"聯國秘書長｜哥斯達黎加前女副總統成大熱 傳面臨美俄兩國反對","url":"https://www.stheadline.com/realtime-world/3639511/聯國秘書長哥斯達黎加前女副總統成大熱-傳面臨美俄兩國反對","summary":"聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周。","summary_short":"聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周。","digest":"聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周","points":["聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周","目前，共有8位由聯合國成員國提名的候選人角逐秘書長之職，大多來自拉丁美洲或加勒比海地區…","根據安理會為衡量支持率而進行的一系列匿名意向投票…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T08:29:43+08:00","size":1,"keywords":[],"body":"聯合國秘書長古特雷斯將於今年12月31日卸任，其繼任者之爭進入最後數周。目前，共有8位由聯合國成員國提名的候選人角逐秘書長之職，大多來自拉丁美洲或加勒比海地區，有五位是女性。\n根據安理會為衡量支持率而進行的一系列匿名意向投票，領先的候選人是哥斯達黎加前女副總統格林斯潘(Rebeca Grynspan)。\n她在11月5日的最後一次投票中獲得了12張「鼓勵」票和3張「反對」票(安理會有15個成員)。據報她似乎仍然面臨來自美國和俄羅斯的反對，這兩個國家有否決權。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca06a7d1305","title":"胰臟癌︱新藥丸能縮小或消除腫瘤 專家稱「數十年來最大躍進」","url":"https://www.stheadline.com/realtime-world/3639510/胰臟癌新藥丸能縮小或消除腫瘤-專家稱數十年來最大躍進","summary":"胰臟癌是本港致命癌症的第四位，近日出現重大治療突破。","summary_short":"胰臟癌是本港致命癌症的第四位，近日出現重大治療突破。","digest":"胰臟癌是本港致命癌症的第四位，近日出現重大治療突破","points":["胰臟癌是本港致命癌症的第四位，近日出現重大治療突破","美國一項早期臨牀試驗發現，一種每日服用的藥丸，可縮小甚至消除某些患有這種癌者患者的腫瘤","英國癌症研究基金會形容，這是胰臟癌治療「數十年來最大的躍進」"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T08:23:01+08:00","size":1,"keywords":[],"body":"胰臟癌是本港致命癌症的第四位，近日出現重大治療突破。美國一項早期臨牀試驗發現，一種每日服用的藥丸，可縮小甚至消除某些患有這種癌者患者的腫瘤。英國癌症研究基金會形容，這是胰臟癌治療「數十年來最大的躍進」。\n8.2%患者腫瘤「完全緩解」\n研究由紐約紀念斯隆凱特琳癌症中心牽頭，周五在西班牙巴塞隆拿舉行的歐洲癌症研究會議公布。第一、二期試驗涉及61名未曾就轉移性胰臟癌接受治療的患者，每日服用200毫克新型口服標靶藥daraxonrasib，並定期注射兩種化療藥。結果顯示，60.7%患者腫瘤縮小或消失，當中8.2%達「完全緩解」，即掃描已不見腫瘤；連同腫瘤無增大者，整體疾病控制率達90.2%。患者無惡化存活期中位數為12.8個月，1年整體存活率達76.6%。\n胰臟癌多於晚期才現症狀，確診時往往已擴散。接受傳統化療的轉移性患者，腫瘤一般5至6個月後再生長，整體存活期僅8至11個月，5年存活率約3%。新療法令患者無惡化存活期中位數逾一年，帶來延長壽命的希望。\n領導研究的腫瘤科醫生栢克（Wungki Park）指，過去數十年胰臟癌治療往往僅能延長存活期數月，今次卻有患者腫瘤在掃描中消失，令團隊驚訝，相信新療法有望改寫晚期患者確診後的首階段治療方案。\ndaraxonrasib針對癌細胞異常活躍的RAS蛋白，阻斷腫瘤生長訊號。逾九成胰臟癌涉RAS基因變異，部分肺癌及其他癌症亦有類似機制，團隊冀日後擴大應用。該藥今年8月獲美國食品及藥物管理局（FDA）批准。英國癌症研究基金會指結果振奮，惟試驗僅涉61人且欠化療對照組，難證較現有方案優勝多少。團隊正進行大型第三期隨機試驗，確認療效及長期存活，並評估皮疹、腹瀉、疲倦等副作用。專家提醒，掃描未見腫瘤，仍有可能復發，現階段不宜宣稱可治癒。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb8d9aa71e3","title":"特朗普：此次亚洲行未能见金正恩 总有一天会见面","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735616.shtml","summary":"中新网11月21日电 据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中，接受美国全国广播公司(NBC)记者采访时指出，由于行程繁忙，他此次未能与朝鲜最高领导人金正恩会面…","summary_short":"中新网11月21日电 据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中…","digest":"据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中…","points":["中新网11月21日电 据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中…","特朗普对记者说，“我们之间的关系还在，但这次没有见面","”特朗普补充道，“但我们总有一天会举行这场会谈"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T08:21:32+08:00","size":1,"keywords":[],"body":"中新网11月21日电 据法新社20日报道，美国总统特朗普乘专机返回华盛顿途中，接受美国全国广播公司(NBC)记者采访时指出，由于行程繁忙，他此次未能与朝鲜最高领导人金正恩会面，并展现出继续推动双方会晤的意愿。\r\n\n　　据报道，特朗普对记者说，“我们之间的关系还在，但这次没有见面。”特朗普补充道，“但我们总有一天会举行这场会谈。”\n\n　　报道指出，特朗普在第一个总统任期内曾三次与金正恩会面。近期启程前往亚洲时，他曾提及再次与金正恩举行双边会谈的可能性。 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd43230679c","title":"日本民調指九成三受訪者認為日中關係欠佳 比例創歷史新高","url":"https://news.tvb.com/tc/1207574-日本民調指九成三受訪者認為日中關係欠佳比例創歷史新高","summary":"日本政府最新民調顯示，有九成三受訪者認為日中關係欠佳，比例創歷史新高。國家主席習近平，周三在亞太經合組織會議跟多個經濟體領袖，包括日本首相高市早苗握手，但中日首腦沒有舉行會談。","summary_short":"日本政府最新民調顯示，有九成三受訪者認為日中關係欠佳，比例創歷史新高。","digest":"日本政府最新民調顯示，有九成三受訪者認為日中關係欠佳，比例創歷史新高","points":["國家主席習近平，周三在亞太經合組織會議跟多個經濟體領袖，包括日本首相高市早苗握手…","日本內閣府昨日公布外交相關輿論調查，認為日中兩國關係「不算良好」的受訪者比例多達百分之93…","外務省官員表示，這項結果反映日中關係面臨各種問題，不過約有七成受訪者認為…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T07:49:00+08:00","size":1,"keywords":["日本","中國"],"body":"日本政府最新民調顯示，有九成三受訪者認為日中關係欠佳，比例創歷史新高。\n\n國家主席習近平，周三在亞太經合組織會議跟多個經濟體領袖，包括日本首相高市早苗握手，但中日首腦沒有舉行會談。\n\n日本內閣府昨日公布外交相關輿論調查，認為日中兩國關係「不算良好」的受訪者比例多達百分之93，較去年增加6.6個百分點，另有百分86.4的日本受訪者認為跟中國沒有親近感，為2020年以來第2高。\n\n外務省官員表示，這項結果反映日中關係面臨各種問題，不過約有七成受訪者認為，未來發展日中關係相當重要。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ISgbWYINbQ1795218640.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/5418005b58b2415aa78e36e8b5b12d5a/b00d38c9656143e6a9c45370c755da93-feaf5db30dd3bdd677ef19cbac0debb0-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ISgbWYINbQ1795218640.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c79069775c3","title":"特朗普強調同中俄元首關係良好 與習近平談及黃仁勳婚外情及人工智能等議題","url":"https://news.tvb.com/tc/1207572-特朗普強調同中俄元首關係良好與習近平談及黃仁勳婚外情及人工智能等議題","summary":"美國總統特朗普總結亞洲之旅的成果，他強調同中、俄元首關係良好，並感謝國家主席習近平在深圳親自接機。特朗普又稱跟習近平，談及輝達前行政總裁黃仁勳捲入婚外情，以及人工智能等議題。","summary_short":"美國總統特朗普總結亞洲之旅的成果，他強調同中、俄元首關係良好，並感謝國家主席習近平在深圳親自接機。","digest":"美國總統特朗普總結亞洲之旅的成果，他強調同中、俄元首關係良好…","points":["美國總統特朗普總結亞洲之旅的成果，他強調同中、俄元首關係良好…","特朗普又稱跟習近平，談及輝達前行政總裁黃仁勳捲入婚外情，以及人工智能等議題","為了防止技術外流，特朗普警告美資企業，一旦在海外設立數據中心，將會被徵收重稅"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T07:32+08:00","size":1,"keywords":[],"body":"美國總統特朗普總結亞洲之旅的成果，他強調同中、俄元首關係良好，並感謝國家主席習近平在深圳親自接機。特朗普又稱跟習近平，談及輝達前行政總裁黃仁勳捲入婚外情，以及人工智能等議題。為了防止技術外流，特朗普警告美資企業，一旦在海外設立數據中心，將會被徵收重稅。\n\n美國總統特朗普周五在白宮召開記者會，交代訪華及菲律賓之行，他形容這是美國有史以來，其中一次最成功的亞洲之旅，並特別感謝國家主席習近平在深圳親自接機。\n\n美國總統特朗普稱：「我很榮幸習主席歡迎我國代表(訪華)，他在飛機旁不僅迎接我，還有我國代表團，這前所未有舉動凸顯他很尊重我們，他看不到懶睡喬(前總統拜登)。」\n\n特朗普強調自己跟習近平及俄羅斯總統普京合得來，對於外界質疑他身為美國總統，應該跟中俄元首保持距離，特朗普反指三國元首保持良好關係有助化解分歧，又稱批評者都是「蠢才」。\n\n說到人工智能，特朗普稱跟習近平討論相關議題，包括設立防護機制。但他同時關注美中雙方在發展人工智能是互相角力，更警告美資企業一旦在海外設立人工智能數據中心，當局不排除會徵收重稅，以免他們外流晶片及相關技術，讓中國成為大贏家。\n\n特朗普表明，批准美資企業繼續向中國出售晶片，但只限舊型號晶片，而禁售最先進晶片。他認為美方就算完全禁售晶片，中國仍有能力自行研製。\n\n美國財經頻道CNBC有民調指，六成四受訪登記選民，反對在住所16公里範圍內，興建人工智能數據中心，贊成的就只有一成三。有輿論推斷，特朗普意圖透過徵收重稅，迫使美企回流國內及設立數據中心，但可能遇到民主黨及部分選民阻力，主要原因是數據中心消耗大量電力，成本或由居民負擔，利益卻流入科技企業。美國科技巨企如微軟、Meta、亞馬遜及甲骨文等，已在海外設數據中心，特朗普未必輕易游說他們將中心搬回美國。\n\n另一方面，輝達前行政總裁黃仁勳捲入婚外情及間諜疑雲，特朗普稱跟習近平談及此事，但沒有交待細節。特朗普認為黃仁勳是卓越的人，即使他間中作出差劣決定，但可協助美國在人工智能保持領先地位，他值得擁有「另一次機會」。","image":"https://pro-vod-cdn.tvb.com/eeb14cc8cfd44db38369645487fd62fa/snapshots/a9c17cc74b7c4e34ba91cef636afe2c0-00008.jpg","video":"https://pro-vod-cdn.tvb.com/eeb14cc8cfd44db38369645487fd62fa/21276777f4934a5c8ec282146c87bda4-bc0fd66249090e7fffead298f41bf7d2-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/eeb14cc8cfd44db38369645487fd62fa/snapshots/a9c17cc74b7c4e34ba91cef636afe2c0-00008.jpg","lang":"zh-Hant"},{"id":"c23667c7fef","title":"中俄美元首深圳歷史性會晤 《紐時》：難改中俄長期對美立場｜國際分析","url":"https://news.tvb.com/tc/1207461-中俄美元首深圳歷史性會晤紐時難改中俄長期對美立場國際分析","summary":"國家主席習近平、俄羅斯總統普京與美國總統特朗普，在深圳舉行中俄美三國元首歷史上首次正式三方會晤，三方同意防止衝突對抗，並在會後發表《中俄美元首和平宣言》。今次會晤被視為載入史冊的標誌性事件，但《紐約時報》唱反調，撰文分析指出，峰會無跡象能改變習近平與普京長期以來對美國抱持的立場。","summary_short":"國家主席習近平、俄羅斯總統普京與美國總統特朗普，在深圳舉行中俄美三國元首歷史上首次正式三方會晤，三方同意防止衝突對抗…","digest":"國家主席習近平、俄羅斯總統普京與美國總統特朗普…","points":["國家主席習近平、俄羅斯總統普京與美國總統特朗普，在深圳舉行中俄美三國元首歷史上首次正式三方會…","今次會晤被視為載入史冊的標誌性事件，但《紐約時報》唱反調，撰文分析指出…","蘇聯解體後　美國主導國際格局"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T07:15+08:00","size":1,"keywords":[],"body":"國家主席習近平、俄羅斯總統普京與美國總統特朗普，在深圳舉行中俄美三國元首歷史上首次正式三方會晤，三方同意防止衝突對抗，並在會後發表《中俄美元首和平宣言》。今次會晤被視為載入史冊的標誌性事件，但《紐約時報》唱反調，撰文分析指出，峰會無跡象能改變習近平與普京長期以來對美國抱持的立場。\n\n蘇聯解體後　美國主導國際格局\n\n報道指，自蘇聯解體三十多年來，美國權力不斷擴張並主導國際格局，令中俄長期以來希望挑戰美國地位。隨著時間推演，從習近平的角度來看，當前國際形勢正在演變，美國亦開始由盛轉衰。報道形容，儘管特朗普多次稱呼習近平與普京為朋友，卻亦難以跟任何一人，建立起猶如中俄領袖之間那種緊密的關係。\n\n南京大學與約翰斯霍普金斯大學中美文化研究中心國際政治學教授魯樂漢表示，習近平與普京均是深具歷史思維的領袖，習慣透過本國的國家敘事框架審視地緣政治，行事層面與一般政客截然不同。\n\n中俄元首會面逾四十次　建「無上限」夥伴關係\n\n事實上，中俄關係近年持續深化，習近平與普京至今已會面超過四十次。在俄羅斯向烏克蘭發動特別軍事行動前，兩人便於北京冬奧會期間會晤，當時兩國政府更宣布建立「無上限」的夥伴關係。\n\n文章引述拜登時期的駐華大使、前駐北約大使伯恩斯指，在其擔任駐華大使期間，北京希望看到俄羅斯變得更強大，並在俄烏戰事中取得優勢。","image":"https://pro-vod-cdn.tvb.com/06bdcbc8335244f387b1179bce6141e8/snapshots/012bccd2092a487bbd1a9896ed9d153a-00007.jpg","video":"https://pro-vod-cdn.tvb.com/06bdcbc8335244f387b1179bce6141e8/aeee6c16ab8b43bf8884c42cc8817da8-6ccd4cf3fd3041db546d2e4b44bf0bf7-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/06bdcbc8335244f387b1179bce6141e8/snapshots/012bccd2092a487bbd1a9896ed9d153a-00007.jpg","lang":"zh-Hant"},{"id":"ce2e3921bfa","title":"安理会举行联合国秘书长遴选第九轮意向性投票","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735607.shtml","summary":"新华社联合国11月20日电(记者尚绪谦)联合国安理会20日就下一任联合国秘书长遴选举行第九轮意向性投票。","summary_short":"新华社联合国11月20日电(记者尚绪谦)联合国安理会20日就下一任联合国秘书长遴选举行第九轮意向性投票。","digest":"联合国安理会20日就下一任联合国秘书长遴选举行第九轮意向性投票","points":["新华社联合国11月20日电(记者尚绪谦)联合国安理会20日就下一任联合国秘书长遴选举行第九轮…","安理会当月轮值主席、拉脱维亚常驻联合国代表萨尼塔·帕夫柳塔-德斯兰德斯在投票结束后说…","安理会意向性投票采取闭门方式，只有安理会成员代表在场，投票结果不作官方记录、不对外公布"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T06:07:58+08:00","size":1,"keywords":[],"body":"新华社联合国11月20日电(记者尚绪谦)联合国安理会20日就下一任联合国秘书长遴选举行第九轮意向性投票。\n\n　　安理会当月轮值主席、拉脱维亚常驻联合国代表萨尼塔·帕夫柳塔-德斯兰德斯在投票结束后说，投票结果将通过候选人推举国通知各候选人。\n\n　　安理会意向性投票采取闭门方式，只有安理会成员代表在场，投票结果不作官方记录、不对外公布。投票意向分别为“鼓励”“劝阻”和“不发表意见”。在意向性投票中，候选人必须获得至少9票鼓励，并且5个常任理事国均不劝阻，方可获得安理会推荐，经联合国大会任命。\n\n　　下一任联合国秘书长遴选于去年11月启动。安理会今年7月30日举行首轮意向性投票。目前下任联合国秘书长共有8名候选人。\r\n\n　　现任联合国秘书长古特雷斯来自葡萄牙，2017年1月上任，2021年获得连任，任期至今年12月31日。根据惯例，秘书长任期5年，可连任。 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c34850788b1","title":"俄烏戰爭｜特朗普再稱普京是朋友 澤連斯基對記者苦笑聳肩","url":"https://www.stheadline.com/realtime-world/3639501/俄烏戰爭特朗普再稱普京是朋友澤連斯基對記者苦笑聳肩","summary":"美國總統特朗普出席深圳亞太經合（APEC）峰會與俄羅斯總統普京會晤期間，首度公開熱情稱對方為「我的朋友」，周五（20日）返美後見記者總結亞洲之行時，再度形容與普京是「朋友」。","summary_short":"美國總統特朗普出席深圳亞太經合（APEC）峰會與俄羅斯總統普京會晤期間，首度公開熱情稱對方為「我的朋友」…","digest":"美國總統特朗普出席深圳亞太經合峰會與俄羅斯總統普京會晤期間…","points":["美國總統特朗普出席深圳亞太經合（APEC）峰會與俄羅斯總統普京會晤期間…","不過，當記者追問普京是否也是美國的朋友時，特朗普表示無法代美國回答…","特朗普稱普京想結束戰爭　指俄烏領袖均陷困局"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T05:10:18+08:00","size":1,"keywords":[],"body":"美國總統特朗普出席深圳亞太經合（APEC）峰會與俄羅斯總統普京會晤期間，首度公開熱情稱對方為「我的朋友」，周五（20日）返美後見記者總結亞洲之行時，再度形容與普京是「朋友」。不過，當記者追問普京是否也是美國的朋友時，特朗普表示無法代美國回答，只強調自己與普京的私人關係「非常好」。\n特朗普稱普京想結束戰爭　指俄烏領袖均陷困局\n特朗普周四（19日）在深圳出席亞太經合組織（APEC）峰會期間，與普京舉行會談。進場時，特朗普笑着向旁人說：「他是誰？他是我朋友。」普京亦面露笑容。\n相關新聞：特朗普乘空軍一號離開深圳 隨行記者手機罕見被收走\n同日在德國柏林，烏克蘭總統澤連斯基與歐洲領導人出席記者會。有記者問澤連斯基，如何看待特朗普稱普京為「我朋友」，澤連斯基聳肩、露出苦笑，未有回答，隨其他領導人離開台上。\n被問普京是否美國朋友 特朗普：我無法代美國回答\n特朗普周五（20日）在白宮記者會上，沒有收回「朋友」的稱呼。被問普京是否美國的朋友時，他表示：「我無法代美國回答。」隨後稱，自己視普京為一名與他關係非常好的人。\n對於俄方在深圳會晤後仍繼續攻擊烏克蘭，特朗普堅稱普京希望結束戰爭，又將戰事持續歸因於俄烏兩國領袖互相仇視，形容兩人都想結束戰爭，卻不知道如何做到，因而陷入困局。\n特朗普說：「我只能告訴你，普京總統希望這件事得到解決，而且這是可以肯定的。⋯⋯如果你們沒有這種巨大的——這不是一點點敵意，這是嚴重的敵意——如果你們沒有這種對彼此的巨大仇恨，這件事兩年前就解決了。」\n魯比奧力挺元首交往　稱有助外交工作\n特朗普強調，自己與主要大國領導人的關係，有助推動和平。\n一同出席記者會、並曾隨特朗普訪華的國務卿魯比奧亦為此辯護，表示國家元首之間的關係極具價值，能為整體雙邊關係、貿易談判人員及外交官的工作定下基調。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3748a3910d","title":"馬斯克深圳視像會議談中美關係 突提「T字頭國家」恐引地緣摩擦惹聯想","url":"https://www.stheadline.com/realtime-world/3639500/馬斯克深圳視像會議談中美關係-突提T字頭國家恐引地緣摩擦惹聯想","summary":"全球首富、特斯拉行政總裁馬斯克在深圳出席亞太經合組織（APEC）峰會期間，透過視像參與美國投資者大會，大讚中國的城市規模與科技發展，自稱是「中國的粉絲」。","summary_short":"全球首富、特斯拉行政總裁馬斯克在深圳出席亞太經合組織（APEC）峰會期間，透過視像參與美國投資者大會…","digest":"全球首富、特斯拉行政總裁馬斯克在深圳出席亞太經合組織峰會期間…","points":["全球首富、特斯拉行政總裁馬斯克在深圳出席亞太經合組織（APEC）峰會期間…","不過，他隨即表示，未來數年或因「某個以T字開頭的國家」出現地緣政治摩擦，引起外界聯想到台灣","TomorrowX Summit於美國時間11月17至18日在德州奧斯汀舉行…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T04:49:57+08:00","size":1,"keywords":[],"body":"全球首富、特斯拉行政總裁馬斯克在深圳出席亞太經合組織（APEC）峰會期間，透過視像參與美國投資者大會，大讚中國的城市規模與科技發展，自稱是「中國的粉絲」。不過，他隨即表示，未來數年或因「某個以T字開頭的國家」出現地緣政治摩擦，引起外界聯想到台灣。\n讚深圳科技發展　籲外界親身到中國看看\nTomorrowX Summit於美國時間11月17至18日在德州奧斯汀舉行，馬斯克從深圳連線，與投資公司Valor Equity Partners創辦人格拉西亞斯（Antonio Gracias），以及Atreides Management創辦人貝克（Gavin Baker）對談。馬斯克形容，兩人都是他最好的朋友，這次交流猶如好友聊天。\n相關新聞：深圳APEC︱馬斯克帶另一兒子到中國 「他是超級中國迷」︱有片\n當格拉西亞斯問及訪華感受時，馬斯克表示，每次來到中國，都對當地發展感到震撼。他形容深圳規模龐大，擁有不少令人讚嘆的建築，也是中國重要的先進科技中心，並鼓勵外界親身到訪，了解中國的面貌。\n冀中美長遠保持良好關係\n談及中美關係時，馬斯克表示，未來數年某個時候，可能因「某個以字母T開頭的國家」而出現地緣政治波折，但他對雙方長遠關係仍抱有期望，認為目前關係相當不錯，希望日後能進一步改善。\n馬斯克亦提到，此行其中一個目的，是到訪特斯拉上海工廠，感謝團隊多年來的辛勤工作及生產成果。他表示，特朗普正在中國討論貿易關係，希望磋商取得進展，認為中美維持良好的經貿及雙邊關係，對全球都有益。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0c0419f9ac","title":"特朗普總結亞洲之旅成果 警告美資企業海外設AI數據中心將被徵收重稅","url":"https://news.tvb.com/tc/1207559-特朗普總結亞洲之旅成果警告美資企業海外設AI數據中心將被徵收重稅","summary":"美國總統特朗普總結亞洲之旅的成果，他感謝國家主席習近平在深圳親自接機，又警告美資企業一旦在海外設立人工智能(AI)數據中心，將會被徵收重稅。美國總統特朗普說：「我很榮幸習主席歡迎我國代表(訪華)，他在飛機旁不僅迎接我，還有我國代表團，這前所未有舉動凸顯他很尊重我們，他看不到懶睡喬(前總統拜登)。","summary_short":"美國總統特朗普總結亞洲之旅的成果，他感謝國家主席習近平在深圳親自接機…","digest":"美國總統特朗普總結亞洲之旅的成果，他感謝國家主席習近平在深圳親自接機…","points":["美國總統特朗普總結亞洲之旅的成果，他感謝國家主席習近平在深圳親自接機…","美國總統特朗普說：「我很榮幸習主席歡迎我國代表(訪華)，他在飛機旁不僅迎接我…","特朗普周五在白宮舉行記者會，提到他跟習近平、俄羅斯總統普京，討論伊朗、俄烏、核不擴散等議題"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T03:00+08:00","size":1,"keywords":[],"body":"美國總統特朗普總結亞洲之旅的成果，他感謝國家主席習近平在深圳親自接機，又警告美資企業一旦在海外設立人工智能(AI)數據中心，將會被徵收重稅。\n\n美國總統特朗普說：「我很榮幸習主席歡迎我國代表(訪華)，他在飛機旁不僅迎接我，還有我國代表團，這前所未有舉動凸顯他很尊重我們，他看不到懶睡喬(前總統拜登)。」\n\n特朗普周五在白宮舉行記者會，提到他跟習近平、俄羅斯總統普京，討論伊朗、俄烏、核不擴散等議題。特朗普強調跟中俄元首關係很好，彼此合得來，對於有人質疑三國元首之間關係，特朗普形容他們是「蠢才」。\n\n特朗普又稱極重視「超級智能」發展，若果有美資企業在海外設立人工智能數據中心，他們將會面對被徵收重稅。特朗普稱有跟習近平討論人工智能問題，包括設立防護機制，美方亦要避免讓晶片等技術外流，以免中國成為大贏家。","image":"https://pro-vod-cdn.tvb.com/688181c1430e42eb9a13bc76e74be024/snapshots/c62dec6763574b3ca1cd2438e409bd11-00008.jpg","video":"https://pro-vod-cdn.tvb.com/688181c1430e42eb9a13bc76e74be024/5cb40e8f0f2245b8a64b0eabbcc7391e-e7e4d16cc72e08bb40349c8a6fb8a5bd-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/688181c1430e42eb9a13bc76e74be024/snapshots/c62dec6763574b3ca1cd2438e409bd11-00008.jpg","lang":"zh-Hant"},{"id":"c3c6ee9498c","title":"特朗普：與習近平同意為AI設防護機制 警告美企海外建數據中心將被徵重稅","url":"https://www.stheadline.com/realtime-world/3639498/特朗普與習近平同意為AI設防護機制-警告美企海外建數據中心將被徵重稅","summary":"美國總統特朗普昨日（20日）結束亞太經合組織（APEC）行程返抵華盛頓後，在白宮舉行新聞發布會。","summary_short":"美國總統特朗普昨日（20日）結束亞太經合組織（APEC）行程返抵華盛頓後，在白宮舉行新聞發布會。","digest":"美國總統特朗普結束亞太經合組織行程返抵華盛頓後，在白宮舉行新聞發布會","points":["美國總統特朗普昨日（20日）結束亞太經合組織（APEC）行程返抵華盛頓後…","他在記者會上證實，自己與國家主席習近平一致同意為人工智能（AI）設立防護機制","警告美國企業切勿在海外興建數據中心，否則將面臨「極為沉重的稅項」及嚴厲懲罰"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T02:54:09+08:00","size":1,"keywords":[],"body":"美國總統特朗普昨日（20日）結束亞太經合組織（APEC）行程返抵華盛頓後，在白宮舉行新聞發布會。他在記者會上證實，自己與國家主席習近平一致同意為人工智能（AI）設立防護機制；同時警告美國企業切勿在海外興建數據中心，否則將面臨「極為沉重的稅項」及嚴厲懲罰。\n形容與習近平普京會晤氛圍極佳\n談及數據中心發展問題，特朗普向有意在美國境外興建數據中心的企業發出強硬警告，強調相關設施必須設於美國本土。\n特朗普表示：「我們絕不允許本國企業在國外興建數據中心。我們不會讓這種事發生。大家知道，過去在晶片及其他領域，這種情況曾被放任發生，結果對我們國家造成了極大的破壞。」\n他進一步補充：「如果他們執意這麼做——當然他們不能這麼做——我們將會對他們課徵極為沉重的稅。如果他們真的要蓋，那就必須蓋在美國境內。我們不允許數據中心外移到其他國家，因為中國會把這些全盤接收，我們絕不容許這種事發生。對於任何試圖這麼做的企業，我們將祭出極為嚴厲的懲罰。」\n此外，特朗普在記者會上稱，已與習近平達成共識，同意為人工智能設立防護機制。\n他亦提及早前與習近平及俄羅斯總統普京的會晤，形容彼此對話氛圍極佳、關係甚好。特朗普透露，三國領導人在會談中觸及限制核武擴散的議題，指出三方均認為必須攜手合作，遏止核威脅在全球各地蔓延，並特別就確保伊朗永遠無法擁有核武進行了深入討論。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c648f39e965","title":"現場｜特朗普：感謝習近平接機 不准美企國外建數據中心否則徵重稅","url":"https://news.tvb.com/tc/1207553-現場特朗普感謝習近平接機不准美企國外建數據中心否則徵重稅","summary":"美國總統特朗普見記者，總結亞洲之行成果，特別感謝國家主席習近平親自在深圳接機。特朗普又表示，不容許美國企業在美國以外建設數據中心，否則徵收重稅。","summary_short":"美國總統特朗普見記者，總結亞洲之行成果，特別感謝國家主席習近平親自在深圳接機。","digest":"美國總統特朗普見記者，總結亞洲之行成果，特別感謝國家主席習近平親自在深圳接機","points":["美國總統特朗普見記者，總結亞洲之行成果，特別感謝國家主席習近平親自在深圳接機","特朗普又表示，不容許美國企業在美國以外建設數據中心，否則徵收重稅","中國和俄羅斯都印象深刻，我也印象深刻，在四天裡，我會見了二十多位世界領導人達成了兩項新貿易協…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T01:27+08:00","size":1,"keywords":[],"body":"美國總統特朗普見記者，總結亞洲之行成果，特別感謝國家主席習近平親自在深圳接機。特朗普又表示，不容許美國企業在美國以外建設數據中心，否則徵收重稅。\n\n特朗普記者會發言\n\n昨晚我們結束亞洲之行回國，這是美國歷史上最成功的總統訪問之一，我認為也許在亞洲或其他任何地方都是如此，我們確實有一個殊榮，擁有空軍一號，這是最長的飛行，空軍一號有史以來進行的，新的空軍一號可以不停機加油，而且比之前的紀錄還少了約四小時，這說明新裝備比舊裝備更好，但飛行持續了約十四個半小時，通常這是二十小時的航程，通常包括中途加油，它總是包括中途加油，所以這只是說明新裝備比舊裝備更好，這是一架了不起的飛機。\n\n中國和俄羅斯都印象深刻，我也印象深刻，在四天裡，我會見了二十多位世界領導人達成了兩項新貿易協議，還有約十項即將達成出席了四場重要國際峰會，並重申立場，美國在該地區的盟友關係，並推動全球和平與安全事業，其他國家非常強大，非常好的國家，馬來西亞、日本，很多國家，但他們覺得有點被冷落。\n\n在這個特定情況下，他們想看到三個國家，這真的成了三國峰會，但實際上所有國家都參與了，而且我們表現出色，我們達成了很棒的貿易協議，美國以無與倫比的經濟和外交實力開啟此行，我們的經濟增速遠超全球其他主要發達國家，而且優勢巨大，我們已連續十個月實現製造業增長，新設備投資創下紀錄，今年增長高達21%，這同樣是紀錄，21%聞所未聞。\n\n原油價格自選舉結束以來暴跌，我想知道這是怎麼發生的，原油自11月初以來下跌了20%，現在已跌至每桶近80美元，據稱這是石油史上最大跌幅之一，這是有記錄以來最大跌幅，跌幅非常大，可惜選舉前沒有這個，但事情就是這樣。你還記得疫苗嗎？選舉後第二天他們就宣布了疫苗，你還記得封城嗎？但我不怪任何人，我只知道這個體制，我們別說它腐敗，我們稱它非常有趣，但這不重要，每個人都知道我們的來處，它已大幅下滑，而我們做得很好，但汽油價格已較一個月前每加侖下跌六十美分，價格將迅速下跌，很快你會看到極低價格。\n\n正如我所述，在前往馬尼拉之前，油價是每加侖1.85美元，我們稍作軍事行動，伊朗伊斯蘭共和國，但現在汽油價格，這也取決於我們如何解決。伊朗，他們想達成協議，但他們不想達成我能接受的協議，想達成真正的協議，不是虛假的協議，他們這51年來一直在做的，不再如此，他們一直在、他們51年來一直在欺騙民眾。\n\n自上任以來，我們創造了25萬億美元的新財富，這是創紀錄的，不到兩年時間，我們創造了25萬億、我們賺了25萬億美元。話雖如此，自選舉以來我們損失了四萬億，因為全世界對此不滿，在選舉中表現出色的人，我並不在選票上，希望你們記得這點。\n\n貧困率處於歷史最低紀錄，所以是最低貧困率，這是我國有史以來最好的貧困數據，今天工作的美國人比我國歷史上任何時候都多，我們將會有一些難以置信的數據，利率太高了，因為我們的聯儲局非常政治化，我並非在責怪主席。順帶一提，我責怪的是聯儲局非常政治化，每當我們公布良好數據，他們就提高利率，他們這樣做是有原因的，本應相反才對。格林斯潘是偉大的聯儲局主席，當經濟數據良好時，他會降低利率，當數據良好時，你的信用會更好。我們卻恰恰相反，我們這樣做是為了摧毀國家，當我們擁有這些出色的數據時，你不應該繼續加息、你應該降息，因為我們的信用更好，國內生產總值將達
