<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

月21日上午，国务院总理李强在北京钓鱼台国宾馆同新加坡总理黄循财举行会谈。\n\n　　李强表示，在双方共同努力下，中新关系保持良好发展势头，互利合作成果丰硕。昨天，习近平主席同总理先生举行会晤，就深化两国关系作出进一步规划。中方愿同新方加强战略沟通，筑牢政治互信，支持彼此核心利益和重大关切，拓展务实合作，推动中新全方位高质量的前瞻性伙伴关系取得更多成果，持续增进两国民众福祉。\n\n　　李强指出，中方愿同新方加快推进中新自贸协定4.0版谈判，促进更高水平双向开放，进一步加强产业融合，推动两国政府间重大项目提质升级，加强人工智能、清洁能源、互联互通、金融等领域合作，推进陆海新通道建设，为两国发展增添动能。中新在社会治理领域有相近理念，面临不少相似课题。双方要加强在应对人口老龄化、促进发展均衡、优化公共服务等问题上的交流互鉴，扩大旅游、文化、青年等人文合作，更好造福两国人民。这些年，单边主义、保护主义抬头，给许多国家经济贸易带来影响。中新同为开放合作的践行者、受益者，应当密切在联合国、亚太经合组织等协调配合，坚定促进区域经济一体化，推动构建开放型世界经济，维护多边贸易体制，捍卫两国共同利益。中方支持新方明年担任东盟轮值主席国，愿同新方一道推动各方落实好中国-东盟自贸区3.0版升级议定书。\n\n　　黄循财祝贺中国在深圳成功举办亚太经合组织领导人非正式会议，表示数十年来新中建立了基于深厚相互信任的牢固伙伴关系。在当前动荡国际局势下，新中更应加强沟通合作，共同应对挑战，维护两国稳定繁荣。新方期待同中方进一步密切高层交往，加强发展战略对接，深化人工智能、数字经济、绿色能源、互联互通等领域合作，密切人文交流，推动新中全方位高质量的前瞻性伙伴关系取得更多新成果。新方支持习近平主席提出的人类命运共同体理念及四大全球倡议，赞赏中方为维护世界和平，促进开放发展发挥领导作用。明年，新方将担任东盟轮值主席国，愿同中方进一步加强在区域和多边平台沟通协作，推进东盟-中国合作，维护地区稳定。\n\n　　吴政隆参加会谈。 【编辑:张燕玲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"李强同新加坡总理黄循财会谈","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735776.shtml","source_display":"中新網 時政","published_at":"2026-11-21T18:39:05+08:00","category":"內地","digest":"11月21日上午，国务院总理李强在北京钓鱼台国宾馆同新加坡总理黄循财举行会谈"},{"title":"李强同新加坡总理黄循财会谈","url":"https://www.jiemian.com/article/15358198.html","source_display":"界面新聞","published_at":"2026-11-21T16:52:44+08:00","category":"","digest":"11月21日上午，国务院总理李强在北京钓鱼台国宾馆同新加坡总理黄循财举行会谈"}]},{"id":"c51daf2b7dc","title":"中国驻沙特大使馆再次提醒在沙中资机构和中国公民注意安全","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735774.shtml","summary":"中新网11月21日电 据中国驻沙特大使馆微信公众号消息，近来，沙特首都利雅得等多地频繁遭导弹和无人机袭击。","summary_short":"中新网11月21日电 据中国驻沙特大使馆微信公众号消息，近来，沙特首都利雅得等多地频繁遭导弹和无人机袭击。","digest":"据中国驻沙特大使馆微信公众号消息，近来，沙特首都利雅得等多地频繁遭导弹和无人机袭击","points":["中新网11月21日电 据中国驻沙特大使馆微信公众号消息，近来…","据媒体报道，部分袭击造成人员伤亡，有机场、建筑物、能源电力设施等受损…","多地学校继续线上授课，部分当地机构和企业人员居家办公"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T18:23:30+08:00","size":2,"keywords":[],"body":"中新网11月21日电 据中国驻沙特大使馆微信公众号消息，近来，沙特首都利雅得等多地频繁遭导弹和无人机袭击。据媒体报道，部分袭击造成人员伤亡，有机场、建筑物、能源电力设施等受损，局部地区出现短时停水电断网等情况。多地学校继续线上授课，部分当地机构和企业人员居家办公。利雅得哈立德国王国际机场部分恢复运营，但多地机场航班经常出现异常。局势还有可能进一步恶化。\r\n\n　　中国驻沙特使领馆再次提醒在沙特中资机构和中国公民务必注意安全，密切关注沙特有关部门公告、警报及中国驻沙使领馆安全提醒。注意以下事项：\n\n　　一、非必要不外出，可适量储备应急物资。远离机场、石油电力等设施、军事基地等敏感地区。\n\n　　二、收到警报或遇紧急情况，保持冷静，立即就地避难，优先确保人身安全。\n\n　　三、切勿拍摄、发布或传播任何与沙特政府机关、军事单位、外国使领馆、军事活动或遭受袭击相关的照片和视频，违者可能面临羁押、高额罚款、驱逐出境等后果。\n\n　　四、尽量不乘飞机旅行。如已订票，请与有关航空公司保持密切联系。拟来沙特转机的中国公民应慎重考虑当前航空状况。发生争议时应保留证据、理性维权。\n\n　　五、赴第三国人员注意出入境规定，带齐重要证件，长途行车防止疲劳驾驶，遵守交通规则。\n\n　　紧急联系方式：\n\n　　沙特当地报警：‌999‌(利雅得、麦加、麦地那、东部省为‌911‌)；交通意外993；救护车997；火警998。\n\n　　外交部全球领事保护与服务应急热线(24小时)：‌+86-10-12308‌、+86-10-65612308。\n\n　　驻沙特使馆领事保护协助电话：‌+966-555924745(临)‌；驻吉达总领馆：‌+966-508399809‌。 【编辑:张燕玲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"中国驻沙特大使馆再次提醒在沙中资机构和中国公民注意安全","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735774.shtml","source_display":"中新網 時政","published_at":"2026-11-21T18:23:30+08:00","category":"內地","digest":"据中国驻沙特大使馆微信公众号消息，近来，沙特首都利雅得等多地频繁遭导弹和无人机袭击"},{"title":"中国驻沙特使馆再次提醒在沙特中资机构和中国公民注意安全","url":"https://www.jiemian.com/article/15358102.html","source_display":"界面新聞","published_at":"2026-11-21T15:43:42+08:00","category":"","digest":"11月21日，中国驻沙特大使馆发文表示，近来…"}],"cross":{"total":2,"angles":[{"point":"11月21日，中国驻沙特大使馆发文表示，近来…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15358102.html"},{"point":"据中国驻沙特大使馆微信公众号消息，近来，沙特首都利雅得等多地频繁遭导弹和无人机袭击","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-21/10735774.shtml"}]}},{"id":"cbd0c5234b9","title":"多国驻华使节走进浙江舟山 探访渔业可持续发展经验","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735801.shtml","summary":"中新网舟山11月21日电(鲍梦妮)11月17日至19日，来自智利、阿根廷、乌拉圭等8个国家的驻华使节走进浙江舟山，了解中国渔业可持续发展经验。","summary_short":"中新网舟山11月21日电(鲍梦妮)11月17日至19日，来自智利、阿根廷、乌拉圭等8个国家的驻华使节走进浙江舟山…","digest":"11月17日至19日，来自智利、阿根廷、乌拉圭等8个国家的驻华使节走进浙江舟山…","points":["中新网舟山11月21日电(鲍梦妮)11月17日至19日，来自智利、阿根廷…","”在舟山六横深远海大黄鱼养殖基地，所罗门群岛驻华大使巴雷特·萨拉托品尝当地产的大黄鱼后…","在舟山六横深远海大黄鱼养殖基地，工作人员向外国使节展示新鲜捕捞的海鱼"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T18:17:50+08:00","size":2,"keywords":[],"body":"中新网舟山11月21日电(鲍梦妮)11月17日至19日，来自智利、阿根廷、乌拉圭等8个国家的驻华使节走进浙江舟山，了解中国渔业可持续发展经验。\n\n　　“这里的黄鱼出口吗？”在舟山六横深远海大黄鱼养殖基地，所罗门群岛驻华大使巴雷特·萨拉托品尝当地产的大黄鱼后，赞不绝口。据悉，该牧场地处葛藤水道咸淡水交汇处，水流流速高，水体交换率高，产出的大黄鱼条形修长、肉质紧实呈蒜瓣状，口感鲜甜无土腥味。\n\n在舟山六横深远海大黄鱼养殖基地，工作人员向外国使节展示新鲜捕捞的海鱼。　鲍梦妮 摄\n\n　　近年来，舟山六横深远海大黄鱼养殖基地投放人工鱼礁修复海域，采用低密度围栏野化养殖培育岱衢族大黄鱼；搭配循环水系统、立体增养殖，依托活水、高交换海域模拟野生环境，兼顾资源养护与良种繁育。与此同时，当地配套海钓设施，推出海钓、海上观光、渔鲜品鉴等旅游项目。\n\n　　巴雷特认为，水产养殖与旅游业相结合的模式对投资者和游客具有吸引力，具备良好的发展潜力。“所罗门群岛正同中国农业部门密切合作，舟山在水产养殖方面的经验技术与配套设施，正是我们亟需的。”\n\n　　远洋渔业是海洋水产业的重要板块，对全程冷链可追溯低温锁鲜、加工快速标准化、国际履约有着严苛要求。作为中国规模最大的金枪鱼加工基地之一，大洋世家优品园实现自动化冷库、超低温冷库与万吨码头联动，令远洋渔获“从码头到工厂”无缝衔接。\n\n　　“我们还在船底配备-55℃的冷库，确保渔获上岸后的最佳新鲜度。”大洋世家(浙江)股份公司总经理彭思飞介绍，这些年，企业打通了远洋捕捞、水产精深加工、国内外终端销售全产业链。以金枪鱼罐头为例，经过精深加工后，一条3公斤的金枪鱼大约可以生产出12罐罐头，价值提升了5倍多。\n\n　　一城探索照见全域。中国远洋渔业历经四十年发展，船队、加工、管理能力跻身全球前列。其不仅水产品国际贸易活跃，同时深度参与全球渔业治理，倡导负责任捕捞合作。\n\n　　斐济驻华大使李振凡表示，中国从传统沿海养殖向现代化全产业链转型的经验，为斐济发展综合性海洋经济提供了重要参考。他期待，斐济与中国的渔业合作不仅限于水产品养殖，还可延伸至冷链物流运输。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"多国驻华使节走进浙江舟山 探访渔业可持续发展经验","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735801.shtml","source_display":"中新網 時政","published_at":"2026-11-21T18:17:50+08:00","category":"內地","digest":"11月17日至19日，来自智利、阿根廷、乌拉圭等8个国家的驻华使节走进浙江舟山…"},{"title":"多国驻华使节走进浙江舟山 探寻海洋经济合作新机遇","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-21/news1075651.shtml","source_display":"中新視頻","published_at":"2026-11-21T15:54:12+08:00","category":"財經","digest":"近日，来自南太、拉美等8个国家的驻华使节走进浙江舟山，了解中国渔业可持续发展经验"}],"cross":{"total":2,"angles":[{"point":"11月17日至19日，来自智利、阿根廷、乌拉圭等8个国家的驻华使节走进浙江舟山…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-21/10735801.shtml"},{"point":"近日，来自南太、拉美等8个国家的驻华使节走进浙江舟山，了解中国渔业可持续发展经验","sources":["中新視頻"],"url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-21/news1075651.shtml"}]}},{"id":"cf2b0e49b8c","title":"來論｜以優質選舉築基治理動能 以人才活水賦能香港長遠起飛","url":"https://www.stheadline.com/politics/3639596/來論以優質選舉築基治理動能-以人才活水賦能香港長遠起飛","summary":"11月22日，選舉委員會界別分組投票舉行，這是完善選舉制度下，一次重要的民主實踐。","summary_short":"11月22日，選舉委員會界別分組投票舉行，這是完善選舉制度下，一次重要的民主實踐。","digest":"11月22日，選舉委員會界別分組投票舉行，這是完善選舉制度下，一次重要的民主實踐","points":["11月22日，選舉委員會界別分組投票舉行，這是完善選舉制度下，一次重要的民主實踐","不少朋友會問，一張選票，到底對香港、對我們推動的各項發展，意義何在","我認為，選票背後，揀選的不只是代表，更是香港未來五年發展的議程、人才方向與社會共識"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T20:00:13+08:00","size":1,"keywords":[],"body":"11月22日，選舉委員會界別分組投票舉行，這是完善選舉制度下，一次重要的民主實踐。不少朋友會問，一張選票，到底對香港、對我們推動的各項發展，意義何在？我認為，選票背後，揀選的不只是代表，更是香港未來五年發展的議程、人才方向與社會共識。\n\n香港正處於由治及興的關鍵階段，本港首個五年規劃明確提出建設國際創科中心，同時要持續發揮聯通內地、連接世界的獨特優勢。選委會作為制度當中的重要平台，肩負提名、選出行政長官與立法會議員的職能，來自不同界別的代表，正是把各行各業、不同專業的聲音帶入體制之內。教育、科技、文化、青年、專業服務等界別的意見，透過這個渠道成為施政參考，令政策更貼近業界的真實訴求，避免發展方向脫離社會實際。\n\n我長年透過基金會參與川港以及各地之間教育、科技、文化的交流工作，接觸許多香港青年科研人員與創業人士。我深深感受到，香港的核心競爭力，根源在於多元的人才庫。一場高質素的選舉，能夠吸納不同背景、擁有實務經驗的愛國愛港人士進入選委平台，讓創科發展、文化傳承、青年培育這些長遠議題，可以持續獲得社會重視。無論是北部都會區建設、科研成果產業化落地，抑或是搭建香港與四川以至整個中國西部的協作通道，都離不開制度層面穩定而持續的支援。\n\n投票並非一次性的儀式，而是各界參與社會治理的起點。完善選舉制度落實之後，「愛國者治港」原則得以切實體現，參選比拼的是施政理念、服務實績，以及對香港社會的責任與承擔。良性的競爭，推動候選人更多聚焦民生改善、產業升級、青年發展等實際議題，而非流於空泛口號。\n\n立足基金會的平台，我會繼續擔當兩地之間的橋樑角色，一方面把內地龐大的發展機遇介紹給香港業界與年輕一代；另一方面亦把香港專業界別、科研創新從業者的想法與實際困難，向內地相關機構傳達。選委會的組成，將直接影響未來數年香港的政策走向，亦關係香港能否好好把握大灣區、成渝地區雙城經濟圈帶來的重大機遇。\n\n在此呼籲合資格投票人，把握機會，細心了解各候選人的理念與抱負，積極行使投票權。以選票凝聚社會共識，以健全制度穩定發展大局，讓香港繼續發揮自身獨特優勢，在國家發展大局之下，邁出屬於自己的堅實步伐。\n鄺文匡\n亞洲教育科技文化基金會會長\n亞洲教育科技文化基金會會長鄺文匡 。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c191eea4b9f","title":"將軍澳廣場天降垃圾桶 警考慮票控55歲餐廳男職員","url":"https://www.stheadline.com/breaking-news/3639673/將軍澳廣場天降垃圾桶-警考慮票控55歲餐廳男職員","summary":"將軍澳廣場前日 （19日）有一個垃圾桶從天而降，跌在將軍澳廣場近停車場入口，險擊中一名男途人。","summary_short":"將軍澳廣場前日 （19日）有一個垃圾桶從天而降，跌在將軍澳廣場近停車場入口，險擊中一名男途人。","digest":"將軍澳廣場前日 有一個垃圾桶從天而降，跌在將軍澳廣場近停車場入口，險擊中一名男途人","points":["將軍澳廣場前日 （19日）有一個垃圾桶從天而降，跌在將軍澳廣場近停車場入口，險擊中一名男途人","警方表示事件交由將軍澳警區刑事調查隊第四隊接手調查，考慮稍後向55歲餐廳男職員作出票控","相關新聞：有片｜將軍澳廣場天降垃圾桶 男途人險擊中淡定離開 目擊者：爭唔夠一米就中"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:54:20+08:00","size":1,"keywords":[],"body":"將軍澳廣場前日 （19日）有一個垃圾桶從天而降，跌在將軍澳廣場近停車場入口，險擊中一名男途人。警方表示事件交由將軍澳警區刑事調查隊第四隊接手調查，考慮稍後向55歲餐廳男職員作出票控。\n相關新聞：有片｜將軍澳廣場天降垃圾桶 男途人險擊中淡定離開 目擊者：爭唔夠一米就中\n警方指留意到近日網上流傳一段短片，片段中一垃圾桶懷疑從高處墮下。警方其後接獲一名55歲本地男餐廳職員報案，指前日下午約5時，一個長70厘米、闊50厘米、高40厘米的垃圾桶從其所屬，位於將軍澳廣場內的餐廳高處墮下，案件中無人受傷。\n將軍澳警區刑事調查隊第四隊接手調查。經初步調查，該餐廳職員涉嫌「容許物件從高處墮下」，人員考慮稍後作出票控。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6f23ccaf1d","title":"二手名牌寄賣店疑走數｜累計334人報案 樂星唯一股東發聲明：月底結束營業","url":"https://www.stheadline.com/breaking-news/3639646/二手名牌寄賣店疑走數累計334人報案-樂星唯一股東發聲明月底結束營業","summary":"《星島申訴王》日前報道本港兩間二手名牌寄賣店「樂星」及「Vootic」突然未有營業，並拖欠寄賣款項及失聯，導致大批苦主在網上求助，報案人數更飆升至334人，涉款約4718萬元。","summary_short":"《星島申訴王》日前報道本港兩間二手名牌寄賣店「樂星」及「Vootic」突然未有營業，並拖欠寄賣款項及失聯…","digest":"《星島申訴王》日前報道本港兩間二手名牌寄賣店「樂星」及「Vootic」突然未有營業…","points":["《星島申訴王》日前報道本港兩間二手名牌寄賣店「樂星」及「Vootic」突然未有營業…","樂星今日（21日）於社交平台發聲明，指店舖將會在月底結束營業，請客人盡快取回寄賣商品","逾期未能取回的商品，將會作為失物交由警方處理"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:29:50+08:00","size":1,"keywords":[],"body":"《星島申訴王》日前報道本港兩間二手名牌寄賣店「樂星」及「Vootic」突然未有營業，並拖欠寄賣款項及失聯，導致大批苦主在網上求助，報案人數更飆升至334人，涉款約4718萬元。樂星今日（21日）於社交平台發聲明，指店舖將會在月底結束營業，請客人盡快取回寄賣商品；逾期未能取回的商品，將會作為失物交由警方處理。\n相關新聞 : 名牌寄賣店突關門 日籍東主失聯 苦主逾百 損失金額或逾2千萬 | 星島申訴王\n聲明由「樂星控股有限公司的單一股東」Roger Wong發出，他指這場騙局是由國里英泰（Kunisato Hideyasu ；又名Hide) 和女友黃侃祺（Wong Hon Kei Victoria）二人精心策劃，強調與黃女並無任何關係。他指除已報警的苦主外，加拿大公司在香港寄賣的40萬商品也被盜取，日本的相關公司也被騙取接近70萬的預繳貨款，「除此之外，連他們身邊多年的好友也被騙了20多萬。我們相信他們已經逃回日本，日本相關人士也已準備報警備案。」\n文中透露，金鐘的樂星（Obsessplanet）能避開總公司監察，最主要是他們製作一批虛假的寄賣單據，「我們對寄賣商品向來有嚴格的管控，首先因為所有商品在有限期均設有7折回收的保障，所以每件商品的報價都必須得到總公司批准；而他們能夠騙去這麼多商品的原因，正正就是開出了那些不可思議的高價。」\n相關新聞 : 《星島申訴王》揭二手名牌寄賣店結業｜累計303人報案 涉款增至$4190萬\nRoger Wong在聲明中表示，香港公司被利用行騙時深感震驚，「完全沒法想像原本為客人爭取最大效益而導入的寄賣制度，竟然被人利用製作成世紀級龐氏騙局，過去的每一日都深感懊悔和痛心…多年來我們一直珍惜客人對我們的信賴。我們對加盟商的監管亦非常嚴格，但所有制度只能防君子、防不了小人。如今當我們同樣被騙、同樣受到損失，卻要我們做替死鬼單獨承擔所有的責任。」\nRoger Wong提到已就事件報警備案，及聘請律師跟進，又稱警方指公司沒有任何法律責任，會按專責律師的指引結束在香港的一切業務，而樂星全線會在月底結束營業，並請客人盡快取回寄賣商品；逾期未取的商品，將會作爲失物交由警方處理。\n累計334人報案 涉款增至$4718萬\n根據警方最新公佈的數字，截至昨日（20日）下午6時，累計有334人報案，涉款增至約4718萬元。\n警方指當中230人的報案，涉及銅鑼灣Vootic，涉款金額約3,400萬元，其餘104人則涉及金鐘樂星，涉案金額約1,318萬元。警方將案件暫列「欺詐」，繼續交由灣仔警區重案組及中區警區重案組跟進。","image":"","video":"","video_poster":"","lang":"zh-Hant"}],"sections":[{"name":"港聞","total":17,"items":[{"id":"c82a9583791","title":"友邦香港及澳門宣布推出「全方位醫療夥伴」 與私家醫院合作提升醫療透明度等","url":"https://www.stheadline.com/society/3639668/友邦香港及澳門宣布推出全方位醫療夥伴-與私家醫院合作提升醫療透明度等","summary":"隨着本港人口老化及醫療開支持續上升，友邦香港及澳門今日（21日）在舉辦「醫療融資高峰論壇 2026」中，宣布推出「全方位醫療夥伴」（Omni Healthcare Circle）協作模式…","summary_short":"隨着本港人口老化及醫療開支持續上升，友邦香港及澳門今日（21日）在舉辦「醫療融資高峰論壇 2026」中…","digest":"隨着本港人口老化及醫療開支持續上升…","points":["隨着本港人口老化及醫療開支持續上升，友邦香港及澳門今日（21日）在舉辦「醫療融資高峰論壇 2…","友邦保險集團首席執行官兼總裁李源祥於「醫療 融資高峰論壇 2026」致辭…","根據香港保險業聯會委託香港理工大學進行的一項研究顯示，2019年至2023年間…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:22:51+08:00","size":1,"keywords":[],"body":"隨着本港人口老化及醫療開支持續上升，友邦香港及澳門今日（21日）在舉辦「醫療融資高峰論壇 2026」中，宣布推出「全方位醫療夥伴」（Omni Healthcare Circle）協作模式，並率先與香港中文大學醫院及港怡醫院合作，透過全新的保險公司與醫療服務機構協作模式，提升醫療質素、促進醫療 資源的妥善和有效運用，並支持香港醫療體系長遠可持續發展。\n友邦保險集團首席執行官兼總裁李源祥於「醫療 融資高峰論壇 2026」致辭，重申友邦致力支持香 港醫療體系長遠及可持續發展。\n私人醫保開支四年升逾六成\n今次論壇匯聚政商、監管機構及醫療界代表，醫務衞生局代表及保監局行政總監張雲正亦有致辭。友邦保險集團首席執行官兼總裁李源祥亦於高峰論壇上致辭，重申友邦致力支持香港醫療體系長遠可持續發展。\n根據香港保險業聯會委託香港理工大學進行的一項研究顯示，2019年至2023年間，本港私人醫療保險開支上升超過60%，同期住院索償次數亦增加68%。友邦香港及澳門首席執行官馮偉昌指出，隨着市民壽命延長及醫療需求演變，保險公司與醫療服務機構須加強跨界合作，妥善運用醫療資源，以維持優質且可負擔的醫療服務。\n聚焦三大範疇 簡化就醫流程\n友邦指出，隨着醫療需要持續增加，病人在就醫過程中有時難以掌握合適的治療路徑。新推出的「全方位醫療夥伴」將結合臨床專業知識與醫療使用數據分析，重點涵蓋三大範疇，包括採用符合醫學實證與臨床卓越研究所（IMACE）指引及國際標準的治療路徑，以提升治療成效的一致性；向病人提供更清晰的醫療質素、治療成效及診治效率資訊，協助其作出知情決定；以及推動保險公司與醫院在病人治療旅程的較早階段展開合作，讓病人預先掌握治療安排及預計費用，並簡化行政流程。\n友邦香港及澳門首席產品主張策劃及醫療保健官梁莉斯分享友邦加強保險公司與醫療服務機構協 作的願景，以提升醫療質素，為客戶創造更大價值。\n冀吸引更多私營醫療機構加入\n友邦香港及澳門首席產品主張策劃及醫療保健官梁莉斯表示，中大醫院及港怡醫院均具規模且與本港大學聯繫密切，具備臨床專長與創新科研優勢；期望透過新模式善用醫療資源，未來亦計劃邀請更多私營醫療機構加入。\n圖片：友邦香港","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdddc4008f5","title":"羅淑佩有信心本港全年訪港旅客數字達標 指積極發展夜間活動鼓勵市民外出","url":"https://news.tvb.com/tc/1207632-羅淑佩有信心本港全年訪港旅客數字達標指積極發展夜間活動鼓勵市民外出","summary":"文化體育及旅遊局局長羅淑佩指，有信心本港全年訪港旅客數字會達到按年升百分之8的目標，又指政府積極發展夜間活動，希望鼓勵市民外出。風和日麗的周末，不少市民和遊客一家大小到西九文化區草坪享受陽光，伴隨悠揚的爵士樂，倍感寫意，想跟節拍動動身體都可以。","summary_short":"文化體育及旅遊局局長羅淑佩指，有信心本港全年訪港旅客數字會達到按年升百分之8的目標，又指政府積極發展夜間活動…","digest":"文化體育及旅遊局局長羅淑佩指，有信心本港全年訪港旅客數字會達到按年升百分之8的目標…","points":["文化體育及旅遊局局長羅淑佩指，有信心本港全年訪港旅客數字會達到按年升百分之8的目標…","風和日麗的周末，不少市民和遊客一家大小到西九文化區草坪享受陽光，伴隨悠揚的爵士樂，倍感寫意…","近期每逢周末、假日，各區都有不同類型活動，吸引市民及旅客"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T17:51:00+08:00","size":1,"keywords":["消費","旅遊","羅淑佩","啟德主場館"],"body":"文化體育及旅遊局局長羅淑佩指，有信心本港全年訪港旅客數字會達到按年升百分之8的目標，又指政府積極發展夜間活動，希望鼓勵市民外出。\n\n風和日麗的周末，不少市民和遊客一家大小到西九文化區草坪享受陽光，伴隨悠揚的爵士樂，倍感寫意，想跟節拍動動身體都可以。近期每逢周末、假日，各區都有不同類型活動，吸引市民及旅客。\n\n陸小姐表示：「我們喜歡某幾位表演者，所以選擇這裡。如果香港有不同類型活動、如果多些小朋友活動，我們一家四口會容易些(參加)。」\n\n梁女士稱：「譬如(聖誕)小鎮那些，我都有去支持，真的很漂亮。我去年都有來西九，今年會去中環。」\n\n文化體育及旅遊局局長羅淑佩指，要吸引旅客再度訪港，首要是推動本地居民多些外出，帶動活動氣氛。\n\n文化體育及旅遊局局長羅淑佩說：「我們就希望做到每周都有得意的活動，讓你覺得要出來活動、出來消費的。為何我們現在這麼著力，由中秋節開始這個節慶盛事季，著力做燈光或夜間活動，我們希望讓大家有習慣，本地人先有習慣，想想香港晚間有哪些地方、很久沒去，或是有新活動，不如去一去。始終相信人氣旺，財氣先會旺，不要讓旅客覺得做給我看，特別為旅客而做，而不是本地特色。」\n\n今年截至10月，已有4,580萬人次訪港，按年升幅達一成二，羅淑佩有信心達到政府估算，全年訪港旅客5,380萬人次，按年升百分之8的目標。\n\n對於早前有智庫調查指，本港演唱會票務政策及訂場安排，影響歐美巨星來港演出的意欲，羅淑佩指有關調查的時間，啟德主場館尚未啟用，不能作比較，又透露主場館未來一年訂場反應熱烈，2027/28跨年檔期已被預訂。","image":"/_nuxt/default.R189UE3B.jpg","video":"https://pro-vod-cdn.tvb.com/f7ef59351a3b4b82bbfa85999be2fff5/83f414b2f1304a4596ed54d6956ff3eb-617109568d9f94b27f7f862fd6c19299-sd.m3u8","video_poster":"/_nuxt/default.R189UE3B.jpg","lang":"zh-Hant"},{"id":"cd1af507371","title":"選委會界別分組選舉周日舉行 李家超到投票站視察","url":"https://news.tvb.com/tc/1207627-選委會界別分組選舉周日舉行李家超到投票站視察","summary":"2026年選委會界別分組一般選舉明天舉行，行政長官李家超到其中一個投票站視察。李家超下午聯同政制及內地事務局局長謝小華、選舉管理委員會主席陸啟康，到訪灣仔港灣道體育館的一般投票，了解場地布置及最後準備情況，工作人員向李家超介紹票站運作和投票流程。","summary_short":"2026年選委會界別分組一般選舉明天舉行，行政長官李家超到其中一個投票站視察。","digest":"2026年選委會界別分組一般選舉明天舉行，行政長官李家超到其中一個投票站視察","points":["2026年選委會界別分組一般選舉明天舉行，行政長官李家超到其中一個投票站視察","李家超下午聯同政制及內地事務局局長謝小華、選舉管理委員會主席陸啟康…","今次選舉共有31個需要競逐的界別分組，由約5,700名投票人，選出723名選委會委員"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T17:40+08:00","size":1,"keywords":[],"body":"2026年選委會界別分組一般選舉明天舉行，行政長官李家超到其中一個投票站視察。\n\n李家超下午聯同政制及內地事務局局長謝小華、選舉管理委員會主席陸啟康，到訪灣仔港灣道體育館的一般投票，了解場地布置及最後準備情況，工作人員向李家超介紹票站運作和投票流程。\n\n今次選舉共有31個需要競逐的界別分組，由約5,700名投票人，選出723名選委會委員。李家超稱多界別競爭，充分彰顯「愛國者治港」下的理性、良性民主政治發展，鼓勵合資格的投票人踴躍投票。","image":"https://pro-vod-cdn.tvb.com/6ec079f702ea4a4aa081e3629a47d727/snapshots/e274afc56b6241b5b00fd9f79805cd26-00005.jpg","video":"https://pro-vod-cdn.tvb.com/6ec079f702ea4a4aa081e3629a47d727/19d497715d60450e880d60b17637959a-e4fd4661430532f9279246d7ce40031e-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/6ec079f702ea4a4aa081e3629a47d727/snapshots/e274afc56b6241b5b00fd9f79805cd26-00005.jpg","lang":"zh-Hant"},{"id":"cbc8f998bc5","title":"亞投行推進在港開設辦事處 陳茂波：彰顯香港獨特角色 全力支持辦公室設立和運作","url":"https://www.stheadline.com/macroeconomics/3639639/亞投行推進在港開設辦事處-陳茂波彰顯香港獨特角色-全力支持辦公室設立和運作","summary":"中國政府與亞洲基礎設施投資銀行（亞投行）今日（21日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資銀行關於在中華人民共和國香港特別行政區設立辦公室的協定》，為亞投行在香港開設辦公室奠定基礎。","summary_short":"中國政府與亞洲基礎設施投資銀行（亞投行）今日（21日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資銀行關於在中華人民…","digest":"中國政府與亞洲基礎設施投資銀行在香港簽署《中華人民共和國政府與亞洲基礎設施投資銀行關…","points":["中國政府與亞洲基礎設施投資銀行（亞投行）今日（21日）在香港簽署《中華人民共和國政府與亞洲基…","財政司司長陳茂波和署理財經事務及庫務局局長陳浩濂出席了簽署儀式","中國政府與亞投行分別由國家財政部部長藍佛安和亞投行行長鄒加怡代表簽署協定"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:26:12+08:00","size":1,"keywords":[],"body":"中國政府與亞洲基礎設施投資銀行（亞投行）今日（21日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資銀行關於在中華人民共和國香港特別行政區設立辦公室的協定》，為亞投行在香港開設辦公室奠定基礎。財政司司長陳茂波和署理財經事務及庫務局局長陳浩濂出席了簽署儀式。\n財長藍佛安與亞投行行長簽協定\n中國政府與亞投行分別由國家財政部部長藍佛安和亞投行行長鄒加怡代表簽署協定。該協定確定亞投行於香港設立辦公室，並為特權及豁免與其他有助成立辦公室的事宜制定原則。\n陳茂波：充分肯定香港地位\n陳茂波感謝國家財政部對香港特區的支持，以及亞投行對香港的信任。亞投行選擇在香港設立辦公室，充分肯定香港作為國際金融中心的地位，亦彰顯香港在匯聚國際資本、支持亞洲基礎設施建設方面的獨特角色。特區政府會全力支持辦公室的設立和運作。我們期待與亞投行加強合作，讓香港的資本市場和專業服務為其業務發展提供更大的支持，撬動更多國際資本參與亞洲基建投融資。\n他表示，特區政府將按便利國際組織在港運作的一貫做法，盡早向立法會提交有關附屬法例，以正式賦予亞投行在香港辦公室所需的特權及豁免。\n注資2000萬美元支持亞投行\n此外，在同一場合，陳浩濂代表特區政府與亞投行首席夥伴合作官金憲簽署一份向「項目準備特別基金」注資2,000萬美元的協定，以展現對亞投行工作的支持。陳浩濂表示，香港會一如既往積極支持亞投行推展其使命，並探索與亞投行進一步加強合作，尤其在發揮香港資本市場與專業服務優勢，以及在能力建設與人才培訓等方面。\n亞投行的「項目準備特別基金」資金來源包括亞投行其中7個成員的注資，以支援發展中經濟體接受亞投行融資的部分項目的前期準備工作。中國香港於2017年6月成為亞投行成員。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf8d23c30f9","title":"有片｜屯門友愛邨男童疑連環掟雜物落街 家人火速落樓推車仔執走","url":"https://www.stheadline.com/breaking-news/3639636/有片屯門友愛邨男童疑連環掟雜物落街-家人火速落樓推車仔執走","summary":"網上今日（21日）流傳一段高空擲物的影片，片中見到屯門友愛邨愛廉樓對開有大量雜物，包括毛公仔、水杯、衣夾等，現場一片混亂，其間有人繼續在單位擲紙張落街。","summary_short":"網上今日（21日）流傳一段高空擲物的影片，片中見到屯門友愛邨愛廉樓對開有大量雜物，包括毛公仔、水杯、衣夾等…","digest":"網上流傳一段高空擲物的影片，片中見到屯門友愛邨愛廉樓對開有大量雜物，包括毛公仔、水杯…","points":["網上今日（21日）流傳一段高空擲物的影片，片中見到屯門友愛邨愛廉樓對開有大量雜物…","有目擊者指有人從18樓一單位的窗邊擲雜物，片段就此結束","到場了解，發現所有雜物疑被執走，不遠處有兩名男童遭家人訓斥，懷疑兩童在家中將雜物擲落街…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:12:50+08:00","size":1,"keywords":[],"body":"網上今日（21日）流傳一段高空擲物的影片，片中見到屯門友愛邨愛廉樓對開有大量雜物，包括毛公仔、水杯、衣夾等，現場一片混亂，其間有人繼續在單位擲紙張落街。有目擊者指有人從18樓一單位的窗邊擲雜物，片段就此結束。\n記者到場了解，發現所有雜物疑被執走，不遠處有兩名男童遭家人訓斥，懷疑兩童在家中將雜物擲落街，家人發現後立即帶同手推車落樓拾回所有雜物。\n根據《簡易程序治罪條例》（第228章）相關條文，如有人從建築物掉下任何東西，或容許物件墜下，以致對公眾地方內或附近人士造成危險或損傷，可被判罰款1萬元及監禁6個月。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"caccdd540e1","title":"議員推先導計劃於長者住所安裝系統監測心跳、跌倒風險等 冀助居家安老","url":"https://news.tvb.com/tc/1207615-議員推先導計劃於長者住所安裝系統監測心跳跌倒風險等冀助居家安老","summary":"近年以老護老，獨居長者不時在家發生意外。有立法會議員推出先導計劃，在長者住所安裝系統，監測心跳、跌倒風險，並定期派護士上門，期望能令他們在居家安老。","summary_short":"近年以老護老，獨居長者不時在家發生意外。","digest":"近年以老護老，獨居長者不時在家發生意外","points":["近年以老護老，獨居長者不時在家發生意外","71歲王婆婆及86歲丈夫住在天水圍公屋單位，丈夫有糖尿病、高血壓，還有慢性心臟病…","科技公司負責人黃賢廷說：「判定一些異常情況，如跌倒、在洗手間時間太長，或長時間沒用洗手間…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T16:33+08:00","size":1,"keywords":[],"body":"近年以老護老，獨居長者不時在家發生意外。有立法會議員推出先導計劃，在長者住所安裝系統，監測心跳、跌倒風險，並定期派護士上門，期望能令他們在居家安老。\n\n71歲王婆婆及86歲丈夫住在天水圍公屋單位，丈夫有糖尿病、高血壓，還有慢性心臟病，膝蓋的骨刺增生更令他經常跌倒。\n\n王婆婆表示：「今年已經跌倒五次，我在這裡睡，『碰』一下響，我說是甚麼東西？他就跌在地上，拉也拉不起來。在天一商城門口(跌倒)，那次是跌得最嚴重，到處都傷了。」\n\n但她最近就可稍為放心，因有科技公司在其廁所、床邊安裝系統，利用毫米波雷達監測他們的心跳、呼吸，檢測有否跌倒等。\n\n科技公司負責人黃賢廷說：「判定一些異常情況，如跌倒、在洗手間時間太長，或長時間沒用洗手間，即代表你的身體出現不適。可通過後台綁定家屬、監護人確認，亦可根據社區內的社工，他們可以看到，服務屋邨的人可打電話或上門確認一下。」\n\n王婆婆稱：「就感覺有個安全感，例如我不在家在外、買菜，他跌倒，裝置會響，對方知道會聯繫我。」\n\n計劃由立法會議員陳祖光設立，自行籌集30萬元起動資金，以先導計劃方式，提供予50戶在天水圍、元朗獨居或雙老長者戶。\n\n選舉委員會界別議員陳祖光指出：「大部分長者都希望在自己家中有尊嚴地生活，在最熟悉環境，24小時受到保護，提供需要如醫護常識、身體監測等。希望日後這服務將來可擴展至每一區，或十八區有這服務，政府或慈善團體關注或支持我們的工作。」\n\n《施政報告》提及下個財政年度，長者社區照顧服務券會增至1.8萬張，陳祖光期望日後可將租借及購買樂齡科技產品納入服務券內，讓更多長者可居家安老。","image":"https://pro-vod-cdn.tvb.com/98bfa1488ff747f08bf5908f100ee870/snapshots/0585d5e5d256449abb2c9147f45e2ed5-00008.jpg","video":"https://pro-vod-cdn.tvb.com/98bfa1488ff747f08bf5908f100ee870/980ba58853bd423184936892e2ecc03d-d2d3c56d78bcfa1f1e531b94378a073f-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/98bfa1488ff747f08bf5908f100ee870/snapshots/0585d5e5d256449abb2c9147f45e2ed5-00008.jpg","lang":"zh-Hant"},{"id":"c5b22b0f231","title":"天氣｜下周中期又降溫！11.25最低氣溫16度 新界再低一兩度","url":"https://www.stheadline.com/society/3639524/天氣下周中期又降溫1125最低氣溫16度-新界再低一兩度","summary":"天文台昨日（20日）上午11時15分一度發出寒冷天氣警告，至今日（21日）清晨6時取消。","summary_short":"天文台昨日（20日）上午11時15分一度發出寒冷天氣警告，至今日（21日）清晨6時取消。","digest":"天文台上午11時15分一度發出寒冷天氣警告，至清晨6時取消","points":["天文台昨日（20日）上午11時15分一度發出寒冷天氣警告，至今日（21日）清晨6時取消","天文台表示，一股清勁至強風程度的偏東氣流會在未來一兩日影響華南沿岸，該區雲量增多…","根據天文台的9天天氣預測，明日(22日)天氣回暖，最低氣溫升到19度，而最高氣溫則有22度…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:37:53+08:00","size":1,"keywords":[],"body":"天文台昨日（20日）上午11時15分一度發出寒冷天氣警告，至今日（21日）清晨6時取消。\n天文台表示，一股清勁至強風程度的偏東氣流會在未來一兩日影響華南沿岸，該區雲量增多，氣溫略為回升。根據天文台的9天天氣預測，明日(22日)天氣回暖，最低氣溫升到19度，而最高氣溫則有22度，大致多雲。稍後有一兩陣微雨。周一(23日)溫度進一步回升，最低氣溫21度，最高24度，多雲，有一兩陣雨。\n下周二東北季候風抵達 周三最低氣溫僅16度\n天文台又預料東北季候風會在下星期二抵達華南沿岸，下周中期該區氣溫下降及有幾陣雨。周二(24日)氣溫稍為回落，最低氣溫只有18度，若按周一最高氣溫24度計算，一日之間跌6度。周三(25日)氣溫再下降，氣溫介乎16至20度，多雲，有幾陣雨。早晚清涼。\n根據自動分區天氣預測，周二(24日)新界普遍有16、17度，周三(25日)新界氣溫稍為下降1度，上水、天水圍有15度，打鼓嶺則低見14度。\n天文台又指，季候風會在下周後期稍為緩和，廣東沿岸天色好轉，氣溫回升。根據天文台的9天天氣預測，周六(28日)最高氣溫升至26度，大致天晴，日間乾燥。周日(29日)最高氣溫亦有24度，最低19度，部分時間有陽光。\n今日下午天晴 未來一兩日氣溫略為回升\n天文台預計今日(21日)下午大致天晴及非常乾燥。今晚漸轉多雲。吹和緩至清勁東北風。展望未來一兩日大致多雲，風勢頗大，氣溫略為回升。下週中期氣溫再度下降。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c07eea45033","title":"海關參與亞洲知識產權營商論壇 深化交流及保護知識產權","url":"https://www.stheadline.com/breaking-news/3639585/海關參與亞洲知識產權營商論壇-深化交流及保護知識產權","summary":"香港海關於11月19至20日參與假香港會議展覽中心舉行的「2026亞洲知識產權營商論壇」，與來自世界各地的業界人士及權利擁有人交流，分享知識產權保護及合作經驗。","summary_short":"香港海關於11月19至20日參與假香港會議展覽中心舉行的「2026亞洲知識產權營商論壇」…","digest":"香港海關於11月19至20日參與假香港會議展覽中心舉行的「2026亞洲知識產權營商論…","points":["香港海關於11月19至20日參與假香港會議展覽中心舉行的「2026亞洲知識產權營商論壇」…","版權及商標調查科高級監督譚佩英獲邀於11月20日參與「守護品牌價值…","Madam譚介紹海關如何運用大數據系統，進行跨平台24小時監察，打擊電子商貿平台上的侵權活動"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T13:58:47+08:00","size":1,"keywords":[],"body":"香港海關於11月19至20日參與假香港會議展覽中心舉行的「2026亞洲知識產權營商論壇」，與來自世界各地的業界人士及權利擁有人交流，分享知識產權保護及合作經驗。\n海關參與「2026亞洲知識產權營商論壇」。\n版權及商標調查科高級監督譚佩英獲邀於11月20日參與「守護品牌價值：電子商貿中的知識產權執法」專題討論，並與嘉賓分享海關以「三E」策略—執法（Enforcement）、參與（Engagement）及教育（Education）— 全方位保護知識產權的工作方針。\nMadam譚介紹海關如何運用大數據系統，進行跨平台24小時監察，打擊電子商貿平台上的侵權活動；並透過參與國際組織及聯合行動，深化與各地執法機關及持份者的協作。海關亦配合本地高調巡查及針對性宣傳教育，持續提升執法效能及公眾尊重知識產權的意識。 她同時鼓勵權利擁有人積極向海關辦理版權及商標備案，協助海關更有效識別及打擊侵權活動，保障他們的合法權益。\n海關參與「2026亞洲知識產權營商論壇」。\n香港海關亦首次於論壇設置展覽攤位，向與會者介紹知識產權執法工作，以及版權及商標備案程序，透過面對面交流，加深各界對海關工作的了解，促進協作。\n香港海關將繼續配合國家「十五五」規劃，與各界夥伴攜手打擊侵權罪行，營造尊重知識產權、公平且具競爭力的營商環境，助力鞏固香港作為區域知識產權貿易中心的地位。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c300b071164","title":"創新香港國際人才嘉年華2026秋季開幕 三企榮獲「最受國際人才歡迎企業獎」","url":"https://www.stheadline.com/society/3639579/創新香港國際人才嘉年華2026秋季開幕-三企榮獲最受國際人才歡迎企業獎","summary":"「創新香港國際人才嘉年華2026秋季」開幕典禮今日（21日）於亞洲國際博覽館舉行。","summary_short":"「創新香港國際人才嘉年華2026秋季」開幕典禮今日（21日）於亞洲國際博覽館舉行。","digest":"「創新香港國際人才嘉年華2026秋季」開幕典禮於亞洲國際博覽館舉行","points":["「創新香港國際人才嘉年華2026秋季」開幕典禮今日（21日）於亞洲國際博覽館舉行","開幕儀式獲行政長官李家超題辭致賀，並由勞工及福利局副局長何啟明、創新香港基金會主席趙磊…","華潤集團、中建香港、分眾傳媒脫穎而出"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T13:53:21+08:00","size":1,"keywords":[],"body":"「創新香港國際人才嘉年華2026秋季」開幕典禮今日（21日）於亞洲國際博覽館舉行。開幕儀式獲行政長官李家超題辭致賀，並由勞工及福利局副局長何啟明、創新香港基金會主席趙磊，以及香港理工大學工商管理學院院長鄭大昭教授等政商及學界領袖蒞臨主禮並致辭，共同見證香港國際人才高地的蓬勃發展。\n華潤集團、中建香港、分眾傳媒脫穎而出 \n為表揚企業在國際人才吸納、培育及多元共融方面的傑出表現，本屆嘉年華繼續頒發備受矚目的「最受國際人才歡迎企業獎」。經過嚴格評選，華潤（集團）有限公司、中國建築工程（香港）有限公司及分眾傳媒憑藉卓越的人才戰略與國際化視野脫穎而出，榮獲殊榮。獎項計劃獨家合作夥伴為 RT Management Ltd.。\n中國建築工程（香港）有限公司（「中建香港」）由董事、副總經理兼人力資源部總經理陳啟蒙代表領獎。中建香港於1979年開始於香港從事建築業務，包括房屋工程、醫療工程、土木工程、基礎工程、地盤勘察、機電工程和混凝土生產等建築相關業務。同時是香港大型建築商之一，持有五個由工務局發出的最高等級的C牌建造執照，可競投標額不受限制的公共樓宇建築、海港工程、道路與渠務、地盤開拓及水務工程，持續為香港基建培育頂尖工程及管理人才。\n華潤（集團）有限公司由人力資源部副總經理邢一兵代表領獎。華潤集團業務涵蓋大消費、綜合能源、城市建設運營、大健康、產業金融、科技及新興產業六大領域，實體企業3000餘家，在職員工約39.2萬人，位列2026年《財富》世界五百強第68位。所屬企業中有9家在香港上市，13家在內地上市，其中華潤置地、華潤啤酒、華潤萬象生活和華潤電力位列香港恒生指數成份股，為海內外專才提供廣闊的跨領域發展平台。\n分眾傳媒由人事及行政經理張甜代表領獎。公司立足香港樓宇場景，以電梯媒體為核心載體，為各行各業品牌提供一站式戶外廣告服務，憑藉靈活創新的企業文化及人才發展機制，深受年輕及國際化創意專才歡迎。\n獎項旨在鼓勵在港企業重視人才多元化與國際化佈局\n「最受國際人才歡迎企業獎」旨在鼓勵在港企業重視人才多元化與國際化佈局，完善招聘、培訓及職業發展體系，進一步鞏固並提升香港作為國際高端人才集聚高地的核心競爭力。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c20b08af328","title":"宏福苑｜消防承辦商中華發展董事涉虛假證明書 消防處提出檢控明年一月提堂","url":"https://news.tvb.com/tc/1207606-宏福苑消防承辦商中華發展董事涉虛假證明書消防處提出檢控明年一月提堂","summary":"消防處檢控多次申請宏福苑消防裝置停用通知書的中華發展工程董事梁秉基，明年一月提堂。消防處回覆查詢指，就宏福苑個案處方已檢控中華發展工程有限公司董事梁秉基，兩項協助及教唆公司發出虛假或具誤導性的證明書，涉嫌違反《消防規例》，明年1月21日在西九龍裁判法院提堂。","summary_short":"消防處檢控多次申請宏福苑消防裝置停用通知書的中華發展工程董事梁秉基，明年一月提堂。","digest":"消防處檢控多次申請宏福苑消防裝置停用通知書的中華發展工程董事梁秉基，明年一月提堂","points":["消防處檢控多次申請宏福苑消防裝置停用通知書的中華發展工程董事梁秉基，明年一月提堂","消防處回覆查詢指，就宏福苑個案處方已檢控中華發展工程有限公司董事梁秉基…","獨立委員會報告指出，中華發展先後為宏福苑85次申請維持消防水缸暫停供水，長達七個月…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T13:32:00+08:00","size":1,"keywords":["宏福苑","中華發展"],"body":"消防處檢控多次申請宏福苑消防裝置停用通知書的中華發展工程董事梁秉基，明年一月提堂。\n\n消防處回覆查詢指，就宏福苑個案處方已檢控中華發展工程有限公司董事梁秉基，兩項協助及教唆公司發出虛假或具誤導性的證明書，涉嫌違反《消防規例》，明年1月21日在西九龍裁判法院提堂。\n\n獨立委員會報告指出，中華發展先後為宏福苑85次申請維持消防水缸暫停供水，長達七個月，但無到場了解是否有需要。\n\n宏福苑另一消防承辦商宏泰消防工程有限公司及其董事鍾傑文，消防處早前發現，公司就位於葵涌的金威工業大廈二期火警偵測系統周年檢查，所發出的證明書涉嫌有不當。調查後提出檢控。\n\n宏泰消防及鍾傑文昨日在屯門裁判法院承認控罪，裁定罪名成立。處方會考慮轉介紀律委員會跟進。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ksqVQqHqo81795239205.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/37c5a80b47b540c3a41b2d4e63ecb49f/6c85b1d2d4114aa59a488c22956d0df5-11a15347344593d842cb28d1eda8351a-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ksqVQqHqo81795239205.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c411708c27c","title":"港鐵東涌綫下周六來往東涌站會提早收車","url":"https://news.tvb.com/tc/1207604-港鐵東涌綫下周六來往東涌站會提早收車","summary":"港鐵東涌綫下周六，來往東涌站會提早收車。為配合東涌東段波口工程，下周六東涌站開出，往香港站的尾班車，提早在晚上11時02分開出。","summary_short":"港鐵東涌綫下周六，來往東涌站會提早收車。","digest":"為配合東涌東段波口工程，下周六東涌站開出，往香港站的尾班車…","points":["為配合東涌東段波口工程，下周六東涌站開出，往香港站的尾班車，提早在晚上11時02分開出","香港站往東涌最遲一班，是在晚上11時07分，之後列車服務僅維持來往欣澳至香港站","港鐵將在欣澳站，提供免費接駁巴士來往東涌站，並加派人手及指示，亦會確保翌日頭班車恢復正常服務"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T13:08:00+08:00","size":1,"keywords":["港鐵","東涌綫","東涌站"],"body":"港鐵東涌綫下周六，來往東涌站會提早收車。\n\n為配合東涌東段波口工程，下周六東涌站開出，往香港站的尾班車，提早在晚上11時02分開出。香港站往東涌最遲一班，是在晚上11時07分，之後列車服務僅維持來往欣澳至香港站。\n\n港鐵將在欣澳站，提供免費接駁巴士來往東涌站，並加派人手及指示，亦會確保翌日頭班車恢復正常服務。\n\n機場快綫服務就不受影響。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026NO5xjD8zpP1795238883.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/dea69fa3960940679b3aa042f5fbb3f5/746ba299261a43bd92d8944fe1ffb909-a7ccc3cd5bdb721e0c206693b3550b27-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026NO5xjD8zpP1795238883.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c4d24752ec7","title":"星期日檔案｜災後一年 宏福苑居民心靈重建之路","url":"https://news.tvb.com/tc/1207590-星期日檔案災後一年宏福苑居民心靈重建之路","summary":"大埔宏福苑五級火發生將近一年，有遇難者家屬及居民說，仍在學習與傷痛共存。人生無常，居民更學懂珍惜眼前人。","summary_short":"大埔宏福苑五級火發生將近一年，有遇難者家屬及居民說，仍在學習與傷痛共存。","digest":"大埔宏福苑五級火發生將近一年，有遇難者家屬及居民說，仍在學習與傷痛共存","points":["大埔宏福苑五級火發生將近一年，有遇難者家屬及居民說，仍在學習與傷痛共存","人生無常，居民更學懂珍惜眼前人","政府在今年四月及五月，安排居民分批返回單位執拾"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T11:30+08:00","size":1,"keywords":[],"body":"大埔宏福苑五級火發生將近一年，有遇難者家屬及居民說，仍在學習與傷痛共存。人生無常，居民更學懂珍惜眼前人。\n\nDorz自小住在宏福苑，一場大火令他失去家園。政府在今年四月及五月，安排居民分批返回單位執拾。87歲的祖母第一次回到住了二十多年的家。\n\n宏福苑居民DORZ祖母說︰「家裡漆黑一片，很翳焗，地下很混亂、骯髒，四周都很漆黑。」\n\nDorz指，這次再上樓比起第一次，心情平復了一些。\n\n宏福苑居民DORZ表示︰「都有情緒，但沒有上一次這麼激動般哭，以及望多了，觀察自己的家是怎樣。身外物可以斷捨離，但自己的家很難。」\n\n因應大埔宏福苑大火而設的「特設銷售計劃」，政府安排業主9月底起陸續選單位。Dorz與祖母最後選擇啟德一個正興建的屋苑。\n\nDORZ說︰「將來有新的『落腳點』，都不能取代宏福苑。我想這件事叫做在一塊高溫的石頭，放了很冷的水上去，但其實仍有餘溫，就是這種感覺。但餘溫能維持多久，我不知道，但我覺得這件事，因為我知道生活必須繼續下去。」\n\n大火奪去168條性命，林一君有三名親人在大火中罹難，包括一名由她從小帶大的表妹。\n\n遇難者家屬林一君表示︰「她當日只是考完試放早，午睡，就離開了我們。」\n\n經歷喪親之痛，令林一君深刻體會要珍惜眼前人，往後會花更多時間陪伴獨居的母親。\n\n林一君說︰「安裝了閉路電視，可以監察媽媽平日在家的情況，為她配戴了電子追蹤手表，萬一發生事時可以求救。樹欲靜而風不息，子欲養而親不在。如果發生事才補救都沒有用。」\n\n林一君的媽媽起初接受不了幾名親人同一時間離世，後來逐漸看開了。\n\n林一君媽媽表示︰「人最重要自己看得開、放得下，這句是以前我教人的座右銘，為何我現在做不到，慢慢想一想便釋懷一些了。」","image":"https://pro-vod-cdn.tvb.com/d3757dd0cded4949834ac9a7df0ec3cd/snapshots/603dae7f1e3e4828ab549c8f317dc660-00008.jpg","video":"https://pro-vod-cdn.tvb.com/d3757dd0cded4949834ac9a7df0ec3cd/3c2faa90b6864244b262f0e3604ed22f-ed3fa27c9a9b46b1b72201da921373f5-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/d3757dd0cded4949834ac9a7df0ec3cd/snapshots/603dae7f1e3e4828ab549c8f317dc660-00008.jpg","lang":"zh-Hant"},{"id":"c380708eb7a","title":"韓國娛樂公司夥內地機械人企業及香港國際網絡 將新一代機械人娛樂推向全球","url":"https://news.tvb.com/tc/1207533-韓國娛樂公司夥內地機械人企業及香港國際網絡將新一代機械人娛樂推向全球","summary":"機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢，以及香港的國際網絡，將新一代機械人娛樂推向全球市場。本港積極發展盛事經濟，不但吸引更多國際巨星來港演出，亦希望進一步發揮國際橋樑角色。","summary_short":"機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢，以及香港的國際網絡…","digest":"機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢…","points":["機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢…","韓國娛樂科技獨角獸公司Galaxy Corporation，曾製作國際熱門節目《體能之巔》…","公司創辦人兼行政總裁崔龍湖此行亦出席了在深圳舉行的APEC工商領導人峰會…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T11:20+08:00","size":1,"keywords":[],"body":"機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢，以及香港的國際網絡，將新一代機械人娛樂推向全球市場。\n\n本港積極發展盛事經濟，不但吸引更多國際巨星來港演出，亦希望進一步發揮國際橋樑角色。\n\n韓國娛樂科技獨角獸公司Galaxy Corporation，曾製作國際熱門節目《體能之巔》，旗下歌手權志龍G-Dragon剛完成在啟德舉行的BIGBANG出道20周年演唱會。\n\n公司創辦人兼行政總裁崔龍湖此行亦出席了在深圳舉行的APEC工商領導人峰會，他接受本台訪問時稱，香港是連接內地與國際市場的重要橋樑。\n\n韓國Galaxy Corporation創辦人兼行政總裁崔龍湖說：「這是BIGBANG第4次在港舉行演唱會。因為香港是最佳平台向全球市場展示實力。無論是亞洲市場、人工智能，還是具身智能領域，香港是一座橋樑，也是通往全球及亞洲市場的門戶。我每次來到香港都可與深圳、廣州及澳門合作夥伴會面。」\n\n目前，公司正與香港上市公司巨星傳奇及內地機械人企業宇樹科技合作，開拓機械人娛樂市場。\n\n崔龍湖說：「硬件由中國製造，軟件及K-pop內容則由韓國提供。只要我們攜手合作，就可將這種娛樂帶到世界各地巡演。我們可攜手進軍100個國家。所以我們需要跨界合作，亦必須團結一致。」\n\n他們投資2,000萬美元，於首爾開設了全球首個機械人主題樂園，開業約半年，到訪旅客逾5萬人次。並將於明年1月，推出實體人形機械人女團，並籌備海外巡演。他們亦計劃在亞洲推出機械人棟篤笑表演，希望進一步豐富他們的機械人娛樂項目。","image":"https://pro-vod-cdn.tvb.com/0a6fc6d8a2bf40ddb9b7d2a3ae3d65e5/snapshots/f178282cbb7a46b6a4822320b14f0b8c-00008.jpg","video":"https://pro-vod-cdn.tvb.com/0a6fc6d8a2bf40ddb9b7d2a3ae3d65e5/897c0afa0e764103b5b92863594bc2e1-5a0136d524938e2c16300b266fa99dee-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/0a6fc6d8a2bf40ddb9b7d2a3ae3d65e5/snapshots/f178282cbb7a46b6a4822320b14f0b8c-00008.jpg","lang":"zh-Hant"},{"id":"c450c1e28cc","title":"韓娛獨角獸聯手大灣區企業 以香港為橋樑開拓全球機械人娛樂市場","url":"https://news.tvb.com/tc/1207533-韓娛獨角獸聯手大灣區企業以香港為橋樑開拓全球機械人娛樂市場","summary":"機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢，以及香港的國際網絡，將新一代機械人娛樂推向全球市場。本港積極發展盛事經濟，不但吸引更多國際巨星來港演出，亦希望進一步發揮國際橋樑角色。","summary_short":"機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢，以及香港的國際網絡…","digest":"機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢…","points":["機械人技術日新月異，有韓國娛樂科技公司希望結合韓國娛樂產業經驗、中國機械人製造的優勢…","韓國娛樂科技獨角獸公司Galaxy Corporation，曾製作國際熱門節目《體能之巔》…","公司創辦人兼行政總裁崔龍湖此行亦出席了在深圳舉行的APEC工商領導人峰會…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T11:20+08:00","size":1,"keywords":[],"body":"機械人技術日新月 步加強，最高罰款達800萬港元、沒收違法商業得益的兩倍，或違法期間最多3個年度的本地營業額的30%，以3年為限，並延長取消董事資格的期限，關聯公司亦會被連帶檢控。\n不傾向將「吹哨者」寬待機制普及化\n針對社會關注跨部門「聯合特遣隊」在立法後會否出現人手與資源不足，丘應樺回應指，作為政府機構必須量入為出，暫時會先以現有資源應付，待實際運作體現出真實需求後，才會適當申請增撥公帑。\n至於會否將目前競爭事務委員會針對「吹哨者」（舉報人）的寬待機制（豁免或減免刑罰）普及化至刑事檢控中，丘應樺認為，檢舉並非一定要靠吹哨者，現行刑事法例中警方會就不同情況，對個別個案會有酌情權。由於涉及刑事起訴，港府在修例時會再詳細考慮，並諮詢律政司及業界意見，目前不傾向將其全部普及化。\n政府正從多方面建立防線\n民政及青年事務局在諮詢後決定暫不推行「授權票上限」改革，外界憂慮可能讓圍標集團繼續透過控制授權票影響採購。丘應樺對此表示並不擔心。他指出，政府正從多方面建立防線， 特遣隊及民政事務總署有權以「風險為本」 ，主動派員直接列席業主立案法團會議、法例修訂後，監管範圍將直接針對顧問公司的聘用，若涉不法行為即屬刑事，還有白名單機制，支援局會為法團揀選顧問公司提供充足資訊，相信並無大空間可予他們做出違法行為。\n相關新聞：\n打擊圍標︱測量師學會：新成立樓宇維修支援及服務局有利正規承建商 可為已展開工程項目「驗身」\n宏福苑︱政府料明年4月通過樓宇維修圍標刑事化 鄧家彪倡設「篤灰獎勵金」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5399223b1b","title":"葵涌裘錦秋中學五名學生被石屎擊中受傷送院 校內正進行升降機工程","url":"https://news.tvb.com/tc/1207631-葵涌裘錦秋中學五名學生被石屎擊中受傷送院校內正進行升降機工程","summary":"葵涌一間中學有五名學生被墜下的石屎擊中，輕傷送院。現場是安捷街裘錦秋中學，警方上午10時許接報，有五名學生被石屎擊中受輕傷，送往瑪嘉烈醫院治理。","summary_short":"葵涌一間中學有五名學生被墜下的石屎擊中，輕傷送院。","digest":"葵涌一間中學有五名學生被墜下的石屎擊中，輕傷送院","points":["葵涌一間中學有五名學生被墜下的石屎擊中，輕傷送院","現場是安捷街裘錦秋中學，警方上午10時許接報，有五名學生被石屎擊中受輕傷，送往瑪嘉烈醫院治理","調查指，校內正進行升降機工程"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T17:44:00+08:00","size":1,"keywords":["葵涌","升降機"],"body":"葵涌一間中學有五名學生被墜下的石屎擊中，輕傷送院。\n\n現場是安捷街裘錦秋中學，警方上午10時許接報，有五名學生被石屎擊中受輕傷，送往瑪嘉烈醫院治理。調查指，校內正進行升降機工程。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20267sVcOeO47e1795256706.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/d18d7bc5df7f4167ab9e1b74cbcd6cc2/990304828594409db0bfc313ce4b5c47-4b49fa0e523e3d8105ec864bb97e46dc-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20267sVcOeO47e1795256706.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c3ca6ed6cf9","title":"深水埗餐廳爐頭搶火冒煙 大批食客疏散","url":"https://www.stheadline.com/breaking-news/3639641/深水埗餐廳爐頭搶火冒煙-大批食客疏散","summary":"今（21日）午4時許，深水埗元州街龍鳳大廈一間越南餐廳冒煙，食客紛紛疏散，消防到場將火撲熄，事件中無人受傷。","summary_short":"今（21日）午4時許，深水埗元州街
