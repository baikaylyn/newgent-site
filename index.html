tion":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T20:45:40+08:00","size":2,"keywords":[],"body":"中新网杭州11月21日电(林波 孙琳茹)11月20日至22日，首届历史经典产业博览会在浙江杭州举行。博览会以“经典传承 新质兴业”为主题，汇聚丝绸、茶叶、瓷器、中药、酿造、工艺美术等产业，集中展示历史经典产业守正创新、向新发展的丰硕成果。\n\n　　何为“经典”？穿行展馆，答案变得具体可感：它是一把撑了千年的伞，是一根绣了两三星期的丝线，是一坛跨越山海的黄酒，也是一部写于2500多年前的《考工记》。\n\n11月20日，游客观展现场。　王刚 摄\n\n　　可触可感，让“百工”回到日常\n\n　　博览会现场，“百工传韵”活态体验工坊人气爆棚。展会期间，该工坊共安排数场绸伞、刺绣等非遗技艺体验，每场设置30个到50个名额，民众可通过小程序预约参与。\n\n　　从展柜里“走”出来的手艺，正落在参观者的指尖上。\n\n　　拥有数千年历史的伞，不只是日常用品，更是一件精美的工艺品，西湖绸伞是其中的代表。它以竹作骨、以绸张面，小巧玲珑、风格典雅，素有“西湖之花”的美称。2008年，伞制作技艺(西湖绸伞)被列入第二批国家级非物质文化遗产名录。\n\n　　“希望我们的非遗能够贴近大众的生活，变得更加生活化，比如把伞做成伞形的灯笼，这些都是可以去探索的。”国家级非物质文化遗产代表性项目伞制作技艺(西湖绸伞)余杭区级代表性传承人宋超说。\n\n　　杭州市工艺美术大师周秀萍带来的是杭州刺绣。“杭州刺绣源于汉代，南宋时期达到鼎盛，至今已有几千年历史。它用真丝线绣在真丝面料上，讲究细腻雅致。”\n\n　　面对现场数十名学生、只有一个小时的体验时间，周秀萍做了一次调整：平时一把扇面要绣两三个星期，当天改用棉线与棉麻布，让大家做一枚带首届历史经典产业博览会标志的小挂件，完成后裱进小框带回家。“希望他们把杭州的一份文化带回家去。”\n\n　　一小时的课绣不出扇面，却可能绣下一颗种子。\n\n11月20日，游客在国际丝绸展区参观。　王刚 摄\n\n　　各美其美，浙阿“经典”的双向流\n\n　　新疆阿克苏地区库车市是龟兹·多浪文化的发源地。国际著名东方学家季羡林曾说：“龟兹是古印度、希腊—罗马、波斯、汉唐文明在世界上唯一的交汇地。”\n\n　　2024年以来，阿克苏率先启动“浙阿历史经典(非遗)产业交流互鉴专项行动”，以非遗为桥，让技艺、设计、渠道、品牌双向流动：10余位浙江工艺美术大师与阿克苏传承人结对，研发焕新产品百余款；36项自治区级以上非遗完成数字化采集；“浙疆有礼”商贸网络让阿克苏好物直通长三角。\n\n　　“依托浙阿历史经典产业交流互鉴专项行动的丰硕成果，我们设置五大特色展示板块，集中展示阿克苏丰富的非遗资源、深厚的文化底蕴，以及浙阿两地匠心携手、跨界融合共创的精品力作。”浙江省援疆指挥部产业就业组工作人员姜钲苗说，这既是成果展示，也是文化交流、产业推介，是两地交往交流交融、产业对接合作的鲜活实践。\n\n　　展台上，库车铜雕与东阳木雕并置，刀郎农民画配上杭州丝绸；“龟兹新境”借VR设备和技术，让观众穿越时空，身临其境感受古龟兹的文化魅力。\n\n　　“既各美其美，又美美与共，可以说是两个地方工匠的跨界融合与深情对话。”姜钲苗说。\n\n　　浙江的助力路径清晰可见：一是科技赋能，发挥数字技术优势，帮助阿克苏解析非遗基因、开展创意设计，让古老非遗焕发全新活力；二是人才共育，坚持投资于物与投资于人相结合，组织两地非遗代表性传承人结对交流，帮助阿克苏培育本土匠人队伍，打造一支带不走的传承力量；三是产业合作，推动非遗从指尖上的技艺转变为指尖上的经济，赋能发展、改善民生、增进认同。\n\n　　于是，一条“保护—传承—转化—传播—销售”的产业链，就浓缩在眼前的一件件展品里。\n\n11月20日，游客在新疆(阿克苏)展区观看演出。　孙琳茹 摄\n\n　　考工新解，古法如何照见未来\n\n　　2500多年前，一部记载春秋战国时期手工业分工与工艺的典籍《考工记》，以其精微的技艺与深邃的造物思想，成为中国科技史上的不朽经典。\n\n　　英国科技史学家李约瑟在《中国科学技术史》中盛赞其为“研究中国古代技术史的最重要的文献”。它也为“百工之事”立下细密的规矩，并以“天有时，地有气，材有美，工有巧”的造物哲学，奠定了中国工艺与人文、技术与艺术和谐共生的独特范式。\n\n　　在由中央广播电视总台与工业和信息化部联合摄制的大型工业文化节目《中华考工记》展区，节目探寻古籍中“天有时、地有气、材有美、工有巧”的智慧源流，紧扣“十五五”时期现代制造业发展的重点领域，聚焦船舶、机器人、航空等重点产业的提质升级，以及智能制造等新兴领域的突破，呈现未来产业发展的前沿成果，全景展现中国超大规模市场优势和全球最完整的产业体系。\n\n　　古与今在这里并非两段叙事：一部讲“百工之事”的典籍，正与今天的智能制造同框而立。\n\n　　经典之所以为经典，全在它至今仍在回答当下的问题，而非仅因年代久远。博览会给出的启示在于，历史经典产业的“新质”，一面来自数字技术对非遗基因的解析与再设计，一面来自人才、渠道、品牌的双向流动——技艺要有人接续，产品要有人购买，文化要有人理解。\n\n　　守好“材美工巧”的手上功夫，接上“天时地气”的时代需求，经典才能从展台走向生活，从“被观看”走向“被使用”。这或许正是“经典传承新质兴业”的深意所在。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"首届历史经典产业博览会在杭州举行：有哪些“经典”？","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735890.shtml","source_display":"中新網 社會","published_at":"2026-11-21T20:45:40+08:00","category":"","digest":"11月20日至22日，首届历史经典产业博览会在浙江杭州举行"},{"title":"首届历史经典产业博览会落地浙江，共计约400余家企业参展","url":"https://www.jiemian.com/article/15357517.html","source_display":"界面新聞","published_at":"2026-11-21T16:01:38+08:00","category":"","digest":"11月20日，首届历史经典产业博览会在杭州国际博览中心举行…"}]},{"id":"c2899a87aa6","title":"刘家峡黄河渔灯：当“星空”坠入蓝色黄河","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075683.shtml","summary":"湖畔渔灯次第明，星河璀璨落人间。","summary_short":"湖畔渔灯次第明，星河璀璨落人间。","digest":"湖畔渔灯次第明，星河璀璨落人间","points":["湖畔渔灯次第明，星河璀璨落人间","在甘肃临夏州永靖县，一年一度的渔灯季在黄河岸畔拉开帷幕","沿线数千盏渔灯顺着光束轨迹逐次亮起，连绵数公里的灯海瞬间与天空相映…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T22:21:03+08:00","size":1,"keywords":[],"body":"湖畔渔灯次第明，星河璀璨落人间。在甘肃临夏州永靖县，一年一度的渔灯季在黄河岸畔拉开帷幕。沿线数千盏渔灯顺着光束轨迹逐次亮起，连绵数公里的灯海瞬间与天空相映，航拍视角记录下这片“渔灯连星河”的震撼画面。\n\n这是刘家峡渔民捕鱼用的传统方式，渔民利用鱼群趋光性，在夜间点亮水面上的渔灯诱捕。与印象中浑黄奔腾的黄河不同，黄河奔涌至永靖县，在此褪去浑黄，展现出碧蓝澄澈、宛若宝石的别样风貌。当夜晚的渔灯亮起，光影层次最丰富，仿佛“星空”坠入蓝色黄河，星辰倒入了大海。(高莹 侯奇志 刘江 马英安 制作 高莹)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/9F326B2C1E684DDFA679469A57340F3B.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ccfa01b9c6c","title":"2026年林木业大会在南宁举行 现场签约超400亿元","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735919.shtml","summary":"中新社南宁11月21日电 (张广权 黄令妍)2026年林木业大会21日在广西南宁举行。","summary_short":"中新社南宁11月21日电 (张广权 黄令妍)2026年林木业大会21日在广西南宁举行。","digest":"2026年林木业大会21日在广西南宁举行","points":["中新社南宁11月21日电 (张广权 黄令妍)2026年林木业大会21日在广西南宁举行","大会现场签约一批项目，总金额超400亿元人民币，涵盖浆纸原料林、纸品加工等领域","本届大会以“林木绿业，合作共襄——构建稳定可持续的林木业产业链供应链”为主题…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:51:38+08:00","size":1,"keywords":[],"body":"中新社南宁11月21日电 (张广权 黄令妍)2026年林木业大会21日在广西南宁举行。大会现场签约一批项目，总金额超400亿元人民币，涵盖浆纸原料林、纸品加工等领域。\n\n　　本届大会以“林木绿业，合作共襄——构建稳定可持续的林木业产业链供应链”为主题，全面展示全球林木业技术新成果，共同探讨林木业发展新路径。\n\n11月21日，2026年林木业大会在广西南宁启幕。图为大会现场。　陈冠言 摄\n\n　　中国国家林业和草原局副局长李云卿在致辞中表示，绿色发展是各国共同的时代课题，各国有责任有义务维护稳定可持续的林木业产业链供应链。中国愿与各方携手并肩，坚持共保联治，共同应对全球性生态挑战，守护地球家园；深化林产品生产、贸易、消费合作，筑牢产业链条；加强数智技术与林业融合，激活绿色动能，为全球林木业高质量发展贡献智慧与力量。\n\n　　老挝农业与环境部副部长纪高·辛纳翁指出，老挝与中国在林木产业领域深化合作，林业贸易和投资额逐年增加。\n\n　　他表示，老挝林业司与广西壮族自治区林业局已签署合作谅解备忘录，中国广西与老挝共建的跨国林业产业园区，总体规划已印发实施。老挝愿与中方在此基础上继续推进务实合作，在提高林木业数字化、森林保护等方面加强合作交流。\n\n　　本次大会由广西壮族自治区人民政府、中国林业产业联合会、中国林产工业协会联合主办。大会还配套举行2026年广西国际林产品及木制品展、多场政策对话、学术研讨、跨境采购对接活动。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbc35a3bbe9","title":"西藏尼木：雅鲁藏布江上体验高原漂流","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075680.shtml","summary":"11月21日，2026年尼木县全民健身漂流推广活动(西藏尼木站)在拉萨市尼木县吞巴镇雅鲁藏布江根培村河段举办，活动由尼木县文化和旅游局、教育局主办，250余人参与体验。","summary_short":"11月21日，2026年尼木县全民健身漂流推广活动(西藏尼木站)在拉萨市尼木县吞巴镇雅鲁藏布江根培村河段举办…","digest":"西藏尼木：雅鲁藏布江上体验高原漂流","points":["11月21日，2026年尼木县全民健身漂流推广活动(西藏尼木站)在拉萨市尼木县吞巴镇雅鲁藏布…","本次活动为全民健身普及体验，不设竞赛名次，依托7公里天然白水河道…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T21:49:42+08:00","size":1,"keywords":[],"body":"11月21日，2026年尼木县全民健身漂流推广活动(西藏尼木站)在拉萨市尼木县吞巴镇雅鲁藏布江根培村河段举办，活动由尼木县文化和旅游局、教育局主办，250余人参与体验。本次活动为全民健身普及体验，不设竞赛名次，依托7公里天然白水河道，将高原峡谷风光与吞巴藏香非遗相结合，全程配备专业保障，以水上运动推动文旅体融合发展。(贡嘎来松 制作 侯诗蕊)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/634906E1429D4168B02291CA861DDE54.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c97df296d15","title":"青海省海西州德令哈市发生5.6级地震 当地震感强烈","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075679.shtml","summary":"11月21日晚记者从青海省德令哈市委宣传部获悉，德令哈5.6级地震发生时，当地震感强烈。","summary_short":"11月21日晚记者从青海省德令哈市委宣传部获悉，德令哈5.6级地震发生时，当地震感强烈。","digest":"11月21日晚记者从青海省德令哈市委宣传部获悉，德令哈5.6级地震发生时…","points":["11月21日晚记者从青海省德令哈市委宣传部获悉，德令哈5.6级地震发生时，当地震感强烈","据中国地震台网正式测定，2026年11月21日18时45分…","经初步排查未发现人员伤亡和房屋倒塌事件，目前一切正常"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T21:49:14+08:00","size":1,"keywords":[],"body":"11月21日晚记者从青海省德令哈市委宣传部获悉，德令哈5.6级地震发生时，当地震感强烈。\n\n据中国地震台网正式测定，2026年11月21日18时45分，青海省海西州德令哈市(北纬37.14度，东经96.62度)发生5.6级地震，震源深度10公里。\n\n经初步排查未发现人员伤亡和房屋倒塌事件，目前一切正常。地震发生后，海西公安、交警、医护等力量迅速响应，德令哈市消防救援大队第一时间集结力量，对救援装备开展全面检查，同步派出人员奔赴震中及辖区开展灾情巡查，及时摸排安全隐患，做好应急处置准备。(朱强 周瑞辰子 赵凛松 制作 侯诗蕊 视频来源 中共德令哈市委宣传部 海西州融媒)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/68A30822279E4054BEAED6569EEED96E.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c4aeefebc33","title":"雅江逐浪迎全民健身热潮 西藏尼木上演“高原第一漂”","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735891.shtml","summary":"中新网拉萨11月21日电 (贡嘎来松)21日，2026年尼木县全民健身漂流推广活动(西藏尼木站)在拉萨市尼木县吞巴镇雅鲁藏布江根培村河段举办。","summary_short":"中新网拉萨11月21日电 (贡嘎来松)21日，2026年尼木县全民健身漂流推广活动(西藏尼木站)在拉萨市尼木县吞巴镇雅鲁…","digest":"雅江逐浪迎全民健身热潮 西藏尼木上演“高原第一漂”","points":["中新网拉萨11月21日电 (贡嘎来松)21日，2026年尼木县全民健身漂流推广活动(西藏尼木…","本次活动由尼木县文化和旅游局、尼木县教育局主办，共有250余名漂流爱好者参与体验","图为西藏尼木雅鲁藏布江漂流体验活动现场"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T21:07:27+08:00","size":1,"keywords":[],"body":"中新网拉萨11月21日电 (贡嘎来松)21日，2026年尼木县全民健身漂流推广活动(西藏尼木站)在拉萨市尼木县吞巴镇雅鲁藏布江根培村河段举办。本次活动由尼木县文化和旅游局、尼木县教育局主办，共有250余名漂流爱好者参与体验。\n\n图为西藏尼木雅鲁藏布江漂流体验活动现场。贡嘎来松 摄\n\n　　吞巴镇雅鲁藏布江河段拥有得天独厚的天然白水河道，7公里的漂流线路穿行于高原峡谷之间，雪山、河谷相映成趣，同时毗邻千年吞巴藏香非遗传承地。本次活动定位全民健身普及体验，不设置竞赛名次，重在推广高原水上运动。活动设置多人漂流筏、双人背包船等项目，每艇配备持证教练随行指导。\n\n图为西藏尼木雅鲁藏布江漂流体验活动现场。贡嘎来松 摄\n\n　　“能在雅鲁藏布江上体验‘高原第一漂’，我特别激动！”参与者王律说，平时很少有机会在高原江河上体验漂流，一路顺着江流穿行峡谷，一边欣赏壮阔的高原风光，一边感受吞巴浓厚的非遗氛围，新奇又震撼。这样的全民健身活动，让我们走出家门亲近山水，真切体会到高原水上运动独有的快乐。\n\n图为西藏尼木雅鲁藏布江漂流体验活动现场。贡嘎来松 摄\n\n　　尼木县文化和旅游局相关负责人表示，此次活动深度整合本地生态资源、非遗资源与体育资源，创新打造“体育+文旅+非遗”融合发展新模式，进一步丰富民众精神文体生活，拓宽尼木特色文旅品牌内涵。\n\n　　活动现场，参与者乘舟逐浪、激流前行，在碧波浪花中体验运动活力，在高原河谷间尽享山水之美。\n\n　　下一步，尼木县将持续深挖优质山水生态与传统文化资源，常态化开展特色全民健身活动，持续培育高原水上运动新业态，丰富文体旅产品供给，不断擦亮“秘境尼木”文旅名片，助推全县文体旅产业高质量融合发展。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c22460f3b92","title":"全国逾2300名选手齐聚广州“以赛会友”","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735897.shtml","summary":"中新网广州11月21日电 (张璐 焦婵娟)第二届全国全民健身大赛2026年全国国防体育运动大联动暨2026年传统运动项目公开赛(以下简称“赛事”)21日在广州黄埔区知识城国际会展中心开赛。","summary_short":"中新网广州11月21日电 (张璐 焦婵娟)第二届全国全民健身大赛2026年全国国防体育运动大联动暨2026年传统运动项目…","digest":"第二届全国全民健身大赛2026年全国国防体育运动大联动暨2026年传统运动项目公开赛…","points":["中新网广州11月21日电 (张璐 焦婵娟)第二届全国全民健身大赛2026年全国国防体育运动大…","赛事为期三天，共吸引全国237支代表队、2390名选手参赛","赛事设知识城国际会展中心、迳下体育馆双赛场，参赛组别覆盖5岁及以下至70岁以上共12个年龄段"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T21:05:25+08:00","size":1,"keywords":[],"body":"中新网广州11月21日电 (张璐 焦婵娟)第二届全国全民健身大赛2026年全国国防体育运动大联动暨2026年传统运动项目公开赛(以下简称“赛事”)21日在广州黄埔区知识城国际会展中心开赛。赛事为期三天，共吸引全国237支代表队、2390名选手参赛。\n\n赛事现场。邓志伸 摄\n\n　　本次赛事以“国防体育+传统运动”为双主线，设置传统武术套路、太极推手、短兵对抗等多个竞赛项目。赛事设知识城国际会展中心、迳下体育馆双赛场，参赛组别覆盖5岁及以下至70岁以上共12个年龄段。短兵、太极推手等项目按年龄、体重细分竞赛层级，实现全年龄段、全覆盖参赛，让全民健身真正走进大众。\n\n赛事现场。邓志伸 摄\n\n　　开赛仪式展演亮点纷呈：龙湖街道17个社区武术站点的老中青表演者共同完成百人八法五步扇展示，延续了龙湖街道创下的大世界基尼斯“参与人数最多的太极扇展演活动”纪录；四位少年武者压轴登场：全网短视频播放量破亿的洪拳小武者黄子君，曾亮相2026年亚太经合组织(APEC)领导人会议周新闻中心的洪拳姐妹黄湘茹、黄湘怡，以及“武术进校园”培育出的全能选手罗浩仪同台献艺，诠释了传统武术的传承与创新。\n\n　　本次赛事创新打造“体育赛事+乡村文旅”模式，激活辖区文旅消费新动能。赛事期间，参赛人员凭赛务证件，观众凭预约门票，即可打卡九龙湖、迳下东湖、莲塘古村等文旅节点，推出“一张票根逛龙湖”票根经济举措，让三天的武术赛事延伸为长链条文旅消费。\n\n　　“村民在家门口就可观看全国赛事，同时借赛事完善乡村运动设施，让全民健身真正扎根乡村。”广州市黄埔区龙湖街道党工委副书记、办事处主任王华表示，街道联动辖区商圈、迳下旅游景区及周边特色餐饮商户，推出赛事观光、乡村游、特色消费联动套餐，将赛事流量转化为消费流量。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c497bde1795","title":"十六载笔墨传童心 “国寿小画家”颁奖盛典在杭举行","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735907.shtml","summary":"中新网杭州11月21日电(曹丹)画笔为桨，童心作帆。","summary_short":"中新网杭州11月21日电(曹丹)画笔为桨，童心作帆。","digest":"画笔为桨，童心作帆","points":["中新网杭州11月21日电(曹丹)画笔为桨，童心作帆","11月21日，2026“国寿小画家”颁奖盛典在浙江杭州钱塘江上举行","浙江省35强小画家及其家庭登上“小画家梦想号”游轮，在江景中迎来属于自己的荣誉时刻"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T21:04:31+08:00","size":1,"keywords":[],"body":"中新网杭州11月21日电(曹丹)画笔为桨，童心作帆。11月21日，2026“国寿小画家”颁奖盛典在浙江杭州钱塘江上举行。浙江省35强小画家及其家庭登上“小画家梦想号”游轮，在江景中迎来属于自己的荣誉时刻。这项已举办16年的少儿书画活动，首次将颁奖盛典搬上游轮，开启了一段流动的艺术之旅。\n\n11月21日，颁奖典礼现场。吴君毅 摄\n\n　　据介绍，第十六届“国寿小画家”浙江省少年儿童书画艺术大赛面向浙江全省3周岁至16周岁少年儿童开放。大赛设“青绿染华章”“文脉续华章”“烟火暖华章”“数智启华章”四大主题，作品涵盖数字绘画、水墨、版画、综合材料、硬笔书法、软笔书法等门类。11个地市分赛区共收到作品近6万幅。\n\n　　江风入舷，荣誉与欢乐在游轮上交织。“小画家梦想号”的游轮展厅里，陈列着35强作品——从舞龙、皮影、剪纸到智能机器人、城市新轨道，既有山河青绿、市井烟火，也有孩子们对未来世界的想象。孩子们在船舱内与自己的作品拍照打卡、自由观展。\n\n　　活动现场以一支回顾短片重温了这一年11城的画笔接力，书画专家逐一点评获奖作品。\n\n　　颁奖台上，获得金奖的12岁小画家王宇宸捧着奖状说，自己的作品叫《努力前行》，画的是四个戴着头盔、身穿黄绿队服的轮滑少年在赛道上全力冲刺的样子。“我想用鲜艳的色彩和动感的线条，把他们在风中那股不服输、拼搏向前的劲儿画出来。”\n\n　　夜幕降临，“小画家梦想号”从浙江第一码头缓缓起航。无人机群腾空而起，在钱塘江夜空上演快闪，与游轮、灯火共同构成一幅流动的城市画卷。\n\n11月21日，小画家在展厅现场欣赏画作。曹丹 摄\n\n　　当日下午，小画家们参观了“国寿小画家”优秀作品浙江省巡展首站——小画家“梦想之城”。\n\n　　据悉，本届巡展由中国美术学院专业团队策展，构建“一城首发启幕+一城重点呈现+九城流动辐射”的梯度巡展体系，走进美术馆、少年宫、商业中心等公共空间，免费向公众开放，把孩子们的画作汇聚成一所“行走的美育课堂”。\n\n　　画笔不仅描绘梦想，更是一座通向善意的桥。该活动连续多年关注特殊儿童艺术表达，公益覆盖范围持续扩大。其中，杭州市杨绫子学校已连续多年参加，今年杭州市艮山路学校、衢州柯城区润智学校首次参与本届活动。对孩子而言，“国寿小画家”不是一场要拼名次的比赛，而是一个每年都有人等候、每一幅作品都会被郑重对待的舞台。\n\n　　在主办方看来，画笔是孩子与世界对话的桥梁，愿意长久做这份美育的“守护者”。这也正是这项活动的温度所在。\n\n　　十六年来，“国寿小画家”累计吸引浙江省超270万人次参与，早已超越赛事本身，成为一场有温度、有厚度的社会公益实践。\n\n　　“‘国寿小画家’的价值不止于美育本身，更在于回应一个时代命题：如何为民族复兴培养有文化底蕴、有创造力的下一代。”中国人寿寿险浙江省分公司党委委员、副总经理胡永生表示。\n\n11月21日，“国寿小画家”优秀作品浙江省巡展现场。吴君毅 摄\n\n　　十六年来，该活动完成了从书画比赛到以美育人实践的转变，持续深化“三传”实践体系：传播教育理念，不论画技高低，重在敢于想象、乐于表达；传递公益爱心，邀请培智学校参赛，让每一份才华都被珍视，同步推进“艺术回山”公益计划；传承传统文化，以中国传世名画开展“美育工坊”亲子共学，在笔墨间播下文化自信种子。\n\n　　据悉，本届大赛由浙江省美术家协会、浙江省书法家协会、浙江画院和中国美术学院社会美育学院指导，中国人寿寿险浙江省分公司与中国新闻社浙江分社新闻发展中心联合主办。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c900d61aedf","title":"千余人徒步浙江千年古村 畅享绿水青山与人文之美","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735883.shtml","summary":"中新网金华11月21日电(项菁 赵海涵)“真是人文风光俱佳的宝藏地。","summary_short":"中新网金华11月21日电(项菁 赵海涵)“真是人文风光俱佳的宝藏地。","digest":"“真是人文风光俱佳的宝藏地","points":["中新网金华11月21日电(项菁 赵海涵)“真是人文风光俱佳的宝藏地","今天在古道徒步，体验感非常好","”健身爱好者刘圣良21日受访时表示"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:37:14+08:00","size":1,"keywords":[],"body":"中新网金华11月21日电(项菁 赵海涵)“真是人文风光俱佳的宝藏地。今天在古道徒步，体验感非常好。”健身爱好者刘圣良21日受访时表示。\n\n11月21日，2026“环浙步道—浙中环线”八婺徒步接力系列活动(磐安站)期间，多位参与者行走乡间古道。双峰乡人民政府 供图\n\n　　当日，2026“环浙步道—浙中环线”八婺徒步接力系列活动(磐安站)在浙江省金华市磐安县双峰乡大皿村启幕。来自全国各地的1000多名健身、徒步爱好者齐聚这座千年古村，踏古道、越山岭，沉浸式感受浙江绿水青山与人文底蕴交融之美。\n\n　　大皿村坐落于层峦叠嶂的山岙之中，皿溪穿村而过，古屋、古巷、石桥、古井依溪错落分布，村落入选第六批中国传统村落名录。千余年来，羊氏族人在此耕读传家、生生不息，如今村内95%的村民为羊姓，大皿村也素有“中华羊氏第一村”的美誉。\n\n　　古村、民俗、山野等资源集聚，为当地探索“体育+文旅+康养”融合发展打下坚实基础。据了解，本次磐安站徒步线路以大皿村为起终点，途经东坑村，翻越西华岭头，沿途可见连绵竹海、潺潺溪流与层叠山岭。\n\n11月21日，2026“环浙步道—浙中环线”八婺徒步接力系列活动(磐安站)期间，多位参与者享受山野风光。双峰乡人民政府 供图\n\n　　当日阳光正好，随着发令汽笛鸣响，徒步爱好者精神饱满踏上征程。大家穿行山野古道，呼吸山林间的清新空气，饱览青山竹海风光，近距离感受千年古村的烟火与人文。络绎不绝的徒步者、游客也进一步带动了当地生姜、进士酒等农特产品销售。\n\n　　走完全程后，徒步爱好者陈静娴感慨：“一路竹林伴溪，风景很美。虽然有点累，但心里特别放松。”\n\n　　近年来，浙江整合、扩容11个地市现有步道资源，建成“环浙步道”，为徒步、越野、骑行等运动休闲打造新场景。双峰乡则依托磐安县“身心两安、自在磐安”发展定位，以“环浙步道”建设为抓手，深挖古村、古道、民俗资源，串珠成链打造古村研学、古道寻踪、山野康养等特色文旅线路，让藏于深山的古村落持续焕发新活力。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c09a5deb1a9","title":"“小雪”后黑龙江多地进入冰封雪飘时节","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735882.shtml","summary":"中新网哈尔滨11月21日电 (王妮娜 杨爽)11月22日迎来中国传统二十四节气中的“小雪”，黑龙江省自此气温快速走低，大风、降温、降雪天气增多，千里北疆冬意铺展，逐步进入冰封雪飘的时节。","summary_short":"中新网哈尔滨11月21日电 (王妮娜 杨爽)11月22日迎来中国传统二十四节气中的“小雪”，黑龙江省自此气温快速走低…","digest":"11月22日迎来中国传统二十四节气中的“小雪”，黑龙江省自此气温快速走低，大风、降温…","points":["中新网哈尔滨11月21日电 (王妮娜 杨爽)11月22日迎来中国传统二十四节气中的“小雪”…","据黑龙江省气象部门预报，小雪节气首日，大兴安岭、黑河北部有小雪，其中大兴安岭北部有中到大雪…","气温方面，大兴安岭、黑河、伊春大部、齐齐哈尔北部、绥化北部、鹤岗东部、佳木斯大部…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:36:06+08:00","size":1,"keywords":[],"body":"中新网哈尔滨11月21日电 (王妮娜 杨爽)11月22日迎来中国传统二十四节气中的“小雪”，黑龙江省自此气温快速走低，大风、降温、降雪天气增多，千里北疆冬意铺展，逐步进入冰封雪飘的时节。\n\n　　据黑龙江省气象部门预报，小雪节气首日，大兴安岭、黑河北部有小雪，其中大兴安岭北部有中到大雪，哈尔滨东部、牡丹江西部有阵雪。气温方面，大兴安岭、黑河、伊春大部、齐齐哈尔北部、绥化北部、鹤岗东部、佳木斯大部、双鸭山东部、鸡西东部为-8至-4℃，其中大兴安岭北部、黑河北部部分地区为-12至-8℃，其他大部地区为-4至0℃。\n\n　　小雪时节是黑龙江省降雪较多的时期，常伴大风降温。虽名为“小雪”，但此时大雪纷飞甚至出现暴雪并不罕见。根据黑龙江省十三市(地)1991—2020年小雪节气期间降雪日数统计，伊春平均降雪日数为7.0天，“遇雪”概率最高，达46.9%；双鸭山以42.4%紧随其后；黑河为39.8%；佳木斯、鹤岗、七台河、大兴安岭、哈尔滨、牡丹江、绥化“遇雪”概率均超过30%，其他地区在20%至30%之间。\n\n　　气象部门预计，22日至24日，黑龙江省北部和东部地区有小雪，其中22日大兴安岭北部有中到大雪，降雪前后气温波动明显；25日至27日多弱冷空气活动，全省大部多阵雪天气。22日白天，南部地区大气扩散气象条件一般，局地有轻雾或霾。\r\n\n　　气象部门提醒，降雪易导致路面结冰、能见度下降，驾车请减速慢行、保持车距；气温波动较大，建议随时关注最新预报信息，及时增减衣物，做好防寒保暖，预防感冒。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c08cef21b89","title":"重庆举办生命科学产业人才发展大会释放创新动能","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735880.shtml","summary":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会·生命科学产业人才发展大会21日举行。","summary_short":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会·生命科学产业人才发展大会21日举行。","digest":"重庆国际人才交流大会·生命科学产业人才发展大会21日举行","points":["中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会·生命科学产业人才发展大会21日…","大会着力搭建人才交流、科创研讨、产业对接、成果转化的协同发展平台…","现场发布4款1类创新药成果，包括重庆市首个获批上市的1类新药赛立奇单抗…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:34:38+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会·生命科学产业人才发展大会21日举行。\n\n　　大会着力搭建人才交流、科创研讨、产业对接、成果转化的协同发展平台，汇聚多方资源助力生命科学与生物医药产业高质量发展。\n\n　　现场发布4款1类创新药成果，包括重庆市首个获批上市的1类新药赛立奇单抗，全球首款用于狂犬病被动免疫的双特异性抗体斯乐韦米单抗，国产首个靶向BCMA和CD3的双特异性抗体药品纬利妥米单抗，以及国内首个、全球第二款用于儿童青少年白血病的CAR-T细胞治疗创新药普基奥仑赛；抗体偶联药物、创新型医用材料、基因治疗、健康智能装备等领域10个重点项目同步签约。\n\n图为偶联药物产才科金共同体启动仪式。巴南区融媒体中心 供图\n\n　　大会还举办偶联药物产才科金共同体启动仪式。该共同体是重庆市抢抓全球偶联药物黄金赛道、构建完整产业生态的重要平台，将集聚链主企业、高校科研院所、医疗机构、检验检测平台、产业资本等主体，推动产业链、创新链、资金链、人才链深度融合，通过金融赋能，建设西部领先、具有全国影响力的偶联药物产业集群，打造“热带雨林式”产业生态。\n\n　　中新网记者从会上了解到，作为重庆医药产业布局体系里的核心园区，位于重庆市巴南区的重庆国际生物城近年持续构建创新生态，形成了涵盖基础研究、中试小试、成果转化的全链条创新能力。\n\n　　目前，重庆国际生物城已形成年产胰岛素3000余万支、疫苗4000余万支、抗体药物6.4万余升的产能储备，园区在研新药53个，进入临床21个、III期临床6个，注册申报阶段5个；包括3款国家1类新药在内的4款新药获批上市，实现重庆生物医药产业发展的关键性突破。\n\n图为生命科学产业人才发展大会现场。巴南区融媒体中心 供图\n\n　　产业成果的背后，离不开优质的营商环境与产业生态的持续培育。近年来，巴南区不断夯实“上下楼就是上下游、产业园就是产业链”的产业发展环境，打造集专业人才、专业标准、专业技术于一体的“专业陪跑”服务体系，推动国内“头部”生物医药企业聚集发展。\n\n　　下一步，巴南区将以大会为契机，吸引更多生命科学领域关键人才扎根重庆，推动源头创新成果落地生根，助力重庆打造国内生命科学产业新高地。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c56147574d2","title":"青春科创赴零碳之约 全国大学生零碳科技创新大赛宁德收官","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735870.shtml","summary":"中新网宁德11月21日电 (记者 叶茂)21日下午，“时代杯”全国大学生零碳科技创新大赛总决赛在福建省宁德市举行，经校赛、区域赛和半决赛遴选，最终10支高校团队晋级总决赛，同台展示零碳创新方案。","summary_short":"中新网宁德11月21日电 (记者 叶茂)21日下午，“时代杯”全国大学生零碳科技创新大赛总决赛在福建省宁德市举行…","digest":"21日下午，“时代杯”全国大学生零碳科技创新大赛总决赛在福建省宁德市举行，经校赛…","points":["中新网宁德11月21日电 (记者 叶茂)21日下午…","本次大赛由中国环境科学学会、中共宁德市委人才工作领导小组办公室…","赛事共吸引400余所高校、近9000名学生报名，覆盖环境、能源、化工、材料…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:19:11+08:00","size":1,"keywords":[],"body":"中新网宁德11月21日电 (记者 叶茂)21日下午，“时代杯”全国大学生零碳科技创新大赛总决赛在福建省宁德市举行，经校赛、区域赛和半决赛遴选，最终10支高校团队晋级总决赛，同台展示零碳创新方案。\n\n“时代杯”全国大学生零碳科技创新大赛总决赛现场。中新网记者 叶茂 摄\n\n　　本次大赛由中国环境科学学会、中共宁德市委人才工作领导小组办公室、宁德时代新能源科技股份有限公司共同主办。赛事共吸引400余所高校、近9000名学生报名，覆盖环境、能源、化工、材料、经管等500多个专业方向。\n\n　　零碳转型既是生态环保的硬性要求，更是新一轮产业竞争的战略支点，发展零碳，根本靠科技创新、核心靠人才。宁德市副市长许锋表示，希望参赛学生把宁德当作“创新现场”，让科创成果、路演数据经得起产线工况、真实场景的检验；希望企业敞开需求、揭榜出题，让优质项目找到落地载体，让青年创新拥有清晰的成长路径；希望主办承办单位建立常态化成果对接和跟踪服务机制，打通项目孵化、成果转化、人才落地通道。\n\n　　对宁德而言，零碳不是远景蓝图，而是正在落地的生动实践。当前，宁德正全力推动零碳人才引育、技术创新、产业落地一体推进。福鼎工业园区入选首批国家级零碳园区，《零碳宁德行动方案》系统布局九大应用场景。\n\n　　同时，宁德深入实施新时代“三都澳人才”强市战略，依托宁德时代等龙头企业，形成强大人才虹吸效应，“中国锂电行业博士一半在宁德”已成为现实图景；2026年宁德跻身全球百强创新集群第75位，连续三年入选“中国最具人才吸引力百强城市”，为零碳创新、成果转化厚植了沃土。\n\n参赛选手路演现场。中新网记者 叶茂 摄\n\n　　中国环境科学学会副秘书长陈永梅表示，学会举办大赛，旨在以赛促学、以赛促创、以创促用，引导青年学子把科研所长与产业所需贯通起来，希望青年学子厚植家国情怀，立足真问题、锤炼真本领，恪守科学精神，既有敢想敢试的锐气，也有坐得住冷板凳的定力，加强交流互鉴，让今天的对手成为明天的伙伴。\n\n　　总决赛现场，10支团队依次登场，通过项目展示、现场答辩等形式呈现创新成果，与专家评委深入交流。从不同学科的交叉探索，到技术方案的反复打磨，大赛不仅为青年学子提供了展示创新能力的舞台，也创造了跨专业交流、学习与实践的机会。\n\n　　路演结束后，现场通过评委投票评选出最佳减碳效益奖、最佳跨学科创新奖、最佳应用创新奖三个单项奖，并颁发二等奖、一等奖及特等奖。\n\n颁奖仪式。中新网记者 　叶茂 摄\n\n　　据悉，“时代杯”全国大学生零碳科技创新大赛是宁德时代青柠计划的重要组成部分。今年1月，宁德时代正式发布高校零碳科技人才培养公益项目“青柠计划”，以“一套课程及教材、一场大赛、一百个社群”为核心，构建覆盖知识学习、竞赛实践与社群交流的零碳科技人才培养体系。\n\n　　其中，零碳科技课程结合前沿理论与企业真实案例，帮助学子建立系统知识框架；全国大学生零碳科技创新大赛为青年学子提供实践与交流平台；由学生自发组织、自主管理的青柠俱乐部，则推动零碳知识传播与高校学生之间的持续交流。目前，青柠俱乐部已覆盖超100所高校。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc829cfa98a","title":"“医药保学面对面”首站在穗举办 推动创新药落地","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735862.shtml","summary":"中新网广州11月21日电 (记者 蔡敏婕)2026年医保药品目录新增品种“医药保学面对面”活动(第一站)21日在广州举行。","summary_short":"中新网广州11月21日电 (记者 蔡敏婕)2026年医保药品目录新增品种“医药保学面对面”活动(第一站)21日在广州举行…","digest":"2026年医保药品目录新增品种“医药保学面对面”活动(第一站)21日在广州举行","points":["中新网广州11月21日电 (记者 蔡敏婕)2026年医保药品目录新增品种“医药保学面对面”活…","这场活动释放的信号更明确：国家医保局正在把创新药准入的发力点，从“进目录”延伸至“进医院…","国家医保局医药服务管理司司长黄心宇介绍，2026年医保药品目录新增品种及相关政策"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T20:19:03+08:00","size":1,"keywords":[],"body":"中新网广州11月21日电 (记者 蔡敏婕)2026年医保药品目录新增品种“医药保学面对面”活动(第一站)21日在广州举行。这场活动释放的信号更明确：国家医保局正在把创新药准入的发力点，从“进目录”延伸至“进医院、进处方、进课堂”，让新药更快惠及患者的现实需求。\n\n　　对创新药来说，进目录只是拿到了“准生证”，临床知不知道、会不会用、患者找不找得到，才是真正的可及性。\n\n2026年医保药品目录新增品种“医药保学面对面”活动(第一站 广州—走进中山大学)在中山大学举行。广东省医保局 供图\n\n　　国家医保局医药服务管理司司长黄心宇介绍，2026年医保药品目录新增品种及相关政策。2026版医保目录共3331种药品，新增107种，调出34种；新增药品中103种为5年内新上市、51种为1类新药，均创新高；新增药品中化学药60种、生物制品36种、中成药11种；新增药品中治疗领域为肿瘤的29种、慢性病的21种、罕见病的18种。\n\n　　调出药品主要是未续约谈判药，以及因剂型替代、主成分仍在目录、临床可替代等调出的常规药。\n\n　　国家医保局局长章轲表示，中国医保将从六个方面持续发力：为医药创新提供稳定可靠的资金支持、构建科学合理的价格体系、提供客观公正的评价标准、完善支付政策、提供真实准确的数据、整合更多支付渠道。坚持“新药不集采、集采非新药”，全周期、全渠道、全领域支持创新。\n\n　　广东省医保局党组成员、副局长刘碧茹表示，截至目前，广东参保人数达1.13亿，2026年纳入广东医保目录药品达6493个；2025年按病种付费年度清算后全省结余留用总金额约35.06亿元。\n\n　　刘碧茹表示，广东省医保局将在四方面持续推动新增药品落地：紧盯终端落地、深化“医药保学”互动、统筹待遇保障和基金可持续发展、加强政策宣传解读。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdc9916939a","title":"把太阳光“分”着用 中国科研团队给植物“定制阳光”","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-21/news1075674.shtml","summary":"没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长。","summary_short":"没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长。","digest":"没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长","points":["没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长","这是记者近日在中国科学技术大学先进技术研究院农业光学实验室看到的一幕","这里的科研团队围绕“光与作物” 已经研究了十多年，做的第一件事是把阳光 “分” 开用"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T20:13:33+08:00","size":1,"keywords":[],"body":"没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长。这是记者近日在中国科学技术大学先进技术研究院农业光学实验室看到的一幕。\n\n这里的科研团队围绕“光与作物” 已经研究了十多年，做的第一件事是把阳光 “分” 开用。一张聚合物光学膜，能把太阳光分成两部分。\n\n“植物生长只需要不到百分之十的太阳光，其余大部分都被浪费了。”据该院研究员张放心介绍，分出来的这部分光留给植物，植物不吸收的光则反射给光伏板发电。\n\n第二件事是把光“配”出来。植物工厂为不同作物定制“光配方”，除光强、光谱，还调控光周期，让能耗更低、作物长得更好。\n\n这座植物工厂还同时充当“育种加速器”。“南方一年两季的水稻，在人工光植物工厂里可以做到四季、五季甚至六季，当然这与品种有关。”张放心说。\n\n目前，集装箱式的植物工厂已经走进戈壁、海岛和雪域高原。“最大的好处是不依赖外部环境。”他坦言，在条件艰苦的地方，用人工光模拟光照环境，照样能种出菜来。\n\n谈及下一步，张放心表示，团队要把光学膜技术继续做深，让“光配方”走向更普遍的应用场景，同时持续突破技术、降低成本，让植物工厂从特殊场景走进更多社区和家庭。\n\n记者 张俊 安徽合肥报道","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/52758FCCFF724EC1B03FC163B0A91ADA.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c46a27c197b","title":"“传承薪火 同心筑梦”第四届重庆统战文化月开幕式举行","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075672.shtml","summary":"11月20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。","summary_short":"11月20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。","digest":"11月20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行","points":["活动集中发布重庆“一都一城两高地”建设成果，通过文化作品展演、精品线路推介等形式…","开幕式将成果发布与文化作品展演、线路推介结合，以曲艺、故事讲述等形式呈现统战历史","据介绍，重庆统战文化月自2023年起已连续成功举办三届，成为全市统一战线凝聚政治共识…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T19:57:07+08:00","size":1,"keywords":[],"body":"11月20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。活动集中发布重庆“一都一城两高地”建设成果，通过文化作品展演、精品线路推介等形式，系统展现重庆统战文化建设成效。\n\n开幕式将成果发布与文化作品展演、线路推介结合，以曲艺、故事讲述等形式呈现统战历史。现场还推介了“重走歌乐·初心之旅”“棠城同心·五社润心之旅”等一批统战文化精品线路。\n\n据介绍，重庆统战文化月自2023年起已连续成功举办三届，成为全市统一战线凝聚政治共识、彰显统战魅力、促进文化传承的标志性品牌。(记者 贾楠）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/7929FC15023142BC93C70342B5557EDB.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf656bc2250","title":"哈尔滨极地公园今冬首场“淘学企鹅冰雪巡游”上线","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075671.shtml","summary":"11月21日，哈尔滨极地公园开启今冬首场“淘学企鹅冰雪巡游”。","summary_short":"11月21日，哈尔滨极地公园开启今冬首场“淘学企鹅冰雪巡游”。","digest":"11月21日，哈尔滨极地公园开启今冬首场“淘学企鹅冰雪巡游”","points":["伴随着欢快的音乐，50只南极企鹅集体亮相极地广场，可爱十足的巡游场面…","本次“淘学企鹅冰雪巡游”自11月21日起，每天13…","(制作 赵宇航 部分视频来源 哈尔滨极地公园）"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T19:56:52+08:00","size":1,"keywords":[],"body":"11月21日，哈尔滨极地公园开启今冬首场“淘学企鹅冰雪巡游”。伴随着欢快的音乐，50只南极企鹅集体亮相极地广场，可爱十足的巡游场面，为来自五湖四海的游客带来与众不同的极地体验。\n\n据了解，本次“淘学企鹅冰雪巡游”自11月21日起，每天13：30在哈尔滨极地公园极地广场免费向公众开放，后续还将根据客流的变化，逐步增加巡游场次。(制作 赵宇航 部分视频来源 哈尔滨极地公园）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/3515CA344B5B4C419A944CBD08360BAA.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf50d77aa0d","title":"云南非遗保护与发展试点成果展在大理启幕","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735849.shtml","summary":"中新网大理11月21日电 (黄兴鸿)21日，“非物质文化遗产系统性保护与可持续发展云南试点成果展”在大理白族自治州大理市喜洲镇启幕，60余项国家级、省级、州市级非物质文化遗产代表性项目进行现场展示…","summary_short":"中新网大理11月21日电 (黄兴鸿)21日，“非物质文化遗产系统性保护与可持续发展云南试点成果展”在大理白族自治州大理市…","digest":"云南非遗保护与发展试点成果展在大理启幕","points":["中新网大理11月21日电 (黄兴鸿)21日，“非物质文化遗产系统性保护与可持续发展云南试点成…","截至目前，国家级、省级非遗代表性项目分别有127项、686项","2024年12月，文化和旅游部确定云南省承担非物质文化遗产系统性保护与可持续发展试点任务…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T19:55:49+08:00","size":1,"keywords":[],"body":"中新网大理11月21日电 (黄兴鸿)21日，“非物质文化遗产系统性保护与可持续发展云南试点成果展”在大理白族自治州大理市喜洲镇启幕，60余项国家级、省级、州市级非物质文化遗产代表性项目进行现场展示、展演、展销，旨在把试点成果从“报告文本”变成“可感知的实践经验”，推动非遗融入现代生活，服务美好生活。\n\n　　地处中国西南边陲的云南省，各民族在漫长的历史长河中创造了多姿多彩、特色鲜明的非物质文化遗产。截至目前，国家级、省级非遗代表性项目分别有127项、686项。2024年12月，文化和旅游部确定云南省承担非物质文化遗产系统性保护与可持续发展试点任务，由云南省非物质文化遗产保护中心具体承担课题研究工作。\n\n11月21日，“非物质文化遗产系统性保护与可持续发展云南试点成果展”启幕。　黄兴鸿 摄\n\n　　课题组选取大理白族自治州大理市喜洲镇周城村、鹤庆县新华银匠村，楚雄彝族自治州南华县“七彩彝绣”非遗工坊，普洱市澜沧拉祜族自治县惠民镇景迈山古茶林，昆明市安宁市县街街道石庄村，怒江傈僳族自治州福贡县匹河怒族乡老姆登村，西双版纳傣族自治州景洪市勐罕镇曼远村，红河哈尼族彝族自治州元阳县阿者科村共8个典型点位开展案例研究，聚焦包容性经济发展、环境可持续发展等7大领域，形成1个总报告与8个案例分报告成果。\n\n　　周城扎染年产值超1.6亿元、带动4000余人就业，新华银匠村的“固定工坊+居家灵活作业”模式为困难民众和残障从业者留出稳定生计空间，景迈山古茶林的“林茶互养”与元阳梯田的“四素同构”把非遗根系扎进生态安全与粮食安全的土壤……9个报告拼出“非物质文化遗产系统性保护与可持续发展”的云南答案，于2026年3月通过文化和旅游部非物质文化遗产司验收。\n\n11月21日，活动现场傣族舞蹈《神鸟舞》展演。　黄兴鸿 摄\n\n　　本次成果展，集成果展示、非遗大集、歌舞乐展演、公开课直播、学术交流于一体，荟萃云南试点60余项国家级、省级、州市级非遗代表性项目，搭建起专家、基层从业者、代表性传承人与社区民众多元互动平台，旨在将试点经验转化为民众可看、可感、可体验的文化盛宴，凝聚更多力量参与到非物质文化遗产的保护、传承中。\n\n　　当天的非遗大集、歌舞乐展演等活动，吸引众多游客和当地民众体验传统技艺，共赏民族文化的独特魅力。\n\n11月21日，活动现场展出琳琅满目的瓦猫文创产品。　黄兴鸿 摄\n\n　　云南省将坚持系统性保护理念，推动非遗与生态保护、乡村建设、基层治理深度融合，提炼可复制、可推广的“云南经验”，让非遗更好地彰显“七彩云南”文化魅力，服务品牌建设，为云南文旅高质量发展注入持久动能。\n\n　　本次成果展共3天时间，由云南省文化和旅游厅指导，云南省非物质文化遗产保护中心、大理州文化和旅游局主办。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8785df1191","title":"研讨现代化水网建设 第三届国家水网及南水北调高质量发展论坛举行","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735834.shtml","summary":"中新网北京11月21日电 11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质量发展论坛在京举行。","summary_short":"中新网北京11月21日电 11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质量发展论坛在京举行。","digest":"11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质量发展论坛在京举行","points":["中新网北京11月21日电 11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质…","来自国家部委、地方政府、企事业单位、金融机构、科研院所、高等院校的院士…","南水北调工程是国家水网的主骨架和大动脉，事关战略全局、事关长远发展、事关人民福祉"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T19:38:10+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质量发展论坛在京举行。来自国家部委、地方政府、企事业单位、金融机构、科研院所、高等院校的院士、专家学者及有关方面代表，围绕“科技赋能·创新驱动 建设现代化水网”主题开展交流研讨。\n\n 11月21日，第三届国家水网及南水北调高质量发展论坛在京举行。中国南水北调集团供图\n\n　　水利部总规划师于琪洋在致辞中表示，加快构建国家水网，建设现代化高质量水利基础设施网络，统筹解决水资源、水生态、水环境、水灾害问题，是党中央作出的重大战略部署。南水北调工程是国家水网的主骨架和大动脉，事关战略全局、事关长远发展、事关人民福祉。中国南水北调集团作为南水北调工程的投资建设运营管理主体，要立足“三个企业”战略定位，统筹发展和安全，大力推进智能运维、智能建造、智能治理，为保障我国水安全作出新的更大贡献。\n\n　　“南水北调东中线一期工程通水以来，累计向北方调水超920亿立方米，为近2亿人提供稳定优质水源，有力支撑北方地区超19万亿元GDP增长。”中国南水北调集团党组书记、董事长汪安南在作报告时说。他表示，立足“十五五”，南水北调集团确立了巩固提升世界一流调水工程、投资建设运营一批国家水网重大工程、加快建设世界一流水网企业“三个一”的奋斗目标。集团将统筹推进维护南水北调“三个安全”、充分发挥“四条生命线”作用、加快推进后续工程高质量发展、全面参与现代化水网建设、积极有序发展相关涉水业务五大任务，不断增强企业核心功能，助力加快建成“系统完备、安全可靠，集约高效、绿色智能，循环通畅、调控有序”的现代化水网。\n\n　　在主论坛主旨报告环节，中国工程院院士张建云、康绍忠、张强，中国科学院院士夏军，国务院发展研究中心研究员高世楫围绕深入贯彻党中央关于“六张网”规划建设战略部署、推进国家“十五五”规划落实，加快建设现代化水网、推进水权水价水市场等市场化改革，提升水网运营可持续性、推进科技创新与产业创新深度融合，推动国家水网及南水北调高质量发展等开展交流。\n\n　　三场平行论坛上，20多位专家学者，聚焦“三个智能”推动南水北调高质量发展、深化改革提升水网运营可持续性、数智融合打造现代水网新质生产力等方面交流探讨，共同分享科技创新成果。论坛还发布了南水北调“天河”大模型系统V2。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cae38489a36","title":"（走进中国乡村）安徽青阳农民把“生活日记”画向世界","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735836.shtml","summary":"中新社安徽池州11月21日电 题：安徽青阳农民把“生活日记”画向世界  　　中新社记者 张强  　　皖南山区，地处九华山后山的安徽省池州市青阳县朱备镇朱笔村…","summary_short":"中新社安徽池州11月21日电 题：安徽青阳农民把“生活日记”画向世界  　　中新社记者 张强  　　皖南山区…","digest":"题：安徽青阳农民把“生活日记”画向世界  　　中新社记者 张强  　　皖南山区…","points":["中新社安徽池州11月21日电 题：安徽青阳农民把“生活日记”画向世界","皖南山区，地处九华山后山的安徽省池州市青阳县朱备镇朱笔村，一栋农家小院的客厅里挂满农民画…","”张平安是安徽省级非遗青阳农民画的省级代表性传承人，他给自己立了条规矩：作品要让人看得懂"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T19:27:52+08:00","size":1,"keywords":[],"body":"中新社安徽池州11月21日电 题：安徽青阳农民把“生活日记”画向世界\n\n　　中新社记者 张强\n\n　　皖南山区，地处九华山后山的安徽省池州市青阳县朱备镇朱笔村，一栋农家小院的客厅里挂满农民画：八头水牛在塘中戏水，农妇在苎麻地里弯腰劳作，板龙在村巷间游走……耄耋之年的张平安伏在案前，握笔为画作上色。\n\n　　“田就是田，池塘就是池塘，山就是山。”张平安是安徽省级非遗青阳农民画的省级代表性传承人，他给自己立了条规矩：作品要让人看得懂。“青阳农民画是农民的‘生活日记’，画的是身边的生产场景和乡风民俗，每一笔都藏着对生活的热爱。”\n\n11月20日，安徽青阳农民画省级非遗代表性传承人张平安在家中创作。中新社记者 张强 摄\n\n　　青阳农民画距今已有600多年历史。有别于陕西西安鄠邑区、上海金山区、安徽萧县等地的农民画，青阳农民画在吸收青阳县及周边地区古代砖雕、石雕、木雕、剪纸、墙饰画等民间艺术的基础上逐渐发展而来，艺术风格体现为构图饱满、色彩艳丽、造型夸张。\n\n　　1975年，青阳县文化部门开办农民画培训班。在家务农的张平安报名参加，画笔从此成为他和同学们的另一件“农具”。目前，青阳县拥有青阳农民画省级非遗代表性传承人4人、市级非遗代表性传承人3人，农民画协会有近100名会员。\n\n11月20日，在安徽省池州市青阳县朱备镇东桥村九子岩景区，展示着青阳农民画省级非遗代表性传承人张平安的作品。中新社记者 张强 摄\n\n　　东桥村党总支书记王金安说，当地的基层治理、廉政宣传、板龙舞、七布泉瀑布都是青阳农民画的创作题材，画作在文化广场和景区常态化展示。“今年以来，我们村接待游客近40万人次。农民画嵌入文旅业态，二者相互赋能。”\n\n　　张平安的儿子张理庆把自家闲置老屋改造成“青画民宿”，以青阳农民画为主题。“九华山高铁站开通了，后山的旅游环境也好了，我们看到了新的商机。”张理庆说，民宿在节假日时常满房，平日入住率超五成。\n\n11月20日，青画民宿负责人张理庆在给民宿里的花浇水。花下面的墙面上画有农民画。中新社记者 张强 摄\n\n　　青阳县杨田镇则把农民画“画”进了产业链。正在上海参加第七届长三角国际文化产业博览会的青阳农民画池州市级非遗代表性传承人徐金锋21日接受记者电话采访时说，“博览会现场非常火爆，青阳农民画文创产品日销售额超1万元人民币，已与杭州、上海及法国、日本等地的客商达成合作。”他们带去参会产品的标签、包装均按农民画技艺绘制专题图案且全部申请了版权保护，“实现了非遗赋能地方特产”。\n\n　　黄精丸、木榨油、野生葛粉、富硒米……据介绍，徐金锋公司的上百种农特产品陆续有了专属的农民画“保护外衣”。他还开发出扇子、茶杯垫、灯光画等百余款融入农民画元素的文创产品，其中的农民画拓印文创产品颇受研学学子欢迎。\n\n　　徐金锋说，通过电商、直播等渠道，青阳农民画原画及手工文创已远销法国、德国、韩国等国家和地区。许多来九华山旅游的外国友人，也专程上门交流合作。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9c2592d8ee","title":"多项大科学装置模型在武汉展出","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735835.shtml","summary":"中新网武汉11月21日电 (陈长丽 高笛)“中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华”21日在中国科学院武汉植物园启动。","summary_short":"中新网武汉11月21日电 (陈长丽 高笛)“中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华”21日在中国科…","digest":"“中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华”21日在中国科学院武…","points":["中新网武汉11月21日电 (陈长丽 高笛)“中国科学院第九届科学节·武汉专场暨2026年湖北…","活动集结中国科学院院属科研机构，湖北省科普教育基地、高校等40余家单位力量…","活动由中国科学院学部工作局、湖北省科学技术协会主办，为期两天…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T19:26:42+08:00","size":1,"keywords":[],"body":"中新网武汉11月21日电 (陈长丽 高笛)“中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华”21日在中国科学院武汉植物园启动。活动集结中国科学院院属科研机构，湖北省科普教育基地、高校等40余家单位力量，通过100多项科技展品、节目及实践体验，为公众呈现一场科普盛宴。\n\n中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华活动举行。中国科学院武汉植物园供图\n\n　　活动由中国科学院学部工作局、湖北省科学技术协会主办，为期两天，设置“嗨剧场”“创新展”“创工坊”“零距离”“科创荟”“科学之美”六个板块。\n\n　　“创新展”板块集中展出中国科学院12件重大科技基础设施与科研成果的科学装置模型，其中江门中微子实验设施、强流重离子加速器装置、超导量子计算原型机“祖冲之三号”、钍基熔盐堆核能系统、“怀柔一号”(极目)卫星等8件模型为首次在武汉展出。\n\n观众参观超导量子计算原型机。中国科学院武汉植物园供图\n\n　　借助实景模型、VR体验等展示手段，大科学装置变成可走近、可触摸、可操作的沉浸式展项。活动现场，江门中微子实验设施模型前排起长队，“奋斗者”号、“拉索”模型旁观众络绎不绝，重大科技基础设施与科研成果从科研一线走到公众身边，让大国重器与前沿科技变得可感可及。\n\n　　“创工坊”板块，细胞观察实验、鱼鳞拓印、叶脉书签、古钱币范铸、宋瓷冰箱贴手作等20余项趣味科学实践集中开展；“嗨剧场”板块，科普舞台剧、科学实验秀、魔术、舞蹈等10余场节目轮番登场。\n\n观众参与科学实验互动。中国科学院武汉植物园供图\n\n　　中国科学院科学节是中国科学院自2018年起打造的面向社会公众的大型科学嘉年华，今年以“主场＋多地专场”方式展开。此次活动是科学节设置专场以来，第四次落地中国科学院武汉植物园。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":74,"items":[{"id":"cbecca7f46e","title":"外籍来华消费有多便利？美国博主：来了就知道","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735780.shtml","summary":"聚焦APEC丨外籍来华消费有多便利？","summary_short":"聚焦APEC丨外籍来华消费有多便利？","digest":"聚焦APEC丨外籍来华消费有多便利","points":["聚焦APEC丨外籍来华消费有多便利","美国博主白满智Matt专程来深圳华强北体验","相中直接打开TenPayGo支付，可连接60多个国际电子钱包，还能立享9%退税"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:01:02+08:00","size":2,"keywords":[],"body":"聚焦APEC丨外籍来华消费有多便利？美国博主：来了就知道\n\n　　来华吃喝玩乐能有多丝滑？美国博主白满智Matt专程来深圳华强北体验。在时空壶店里，白满智拿起AI眼镜、翻译耳机挨个试；相中直接打开TenPayGo支付，可连接60多个国际电子钱包，还能立享9%退税。外国朋友无需更换支付方式，即可扫码消费，便利的入境服务不仅提升了游客体验，也为本地商户带来更多“家门口的全球生意”。\n\n　　(中国经济网记者 马常艳 视频剪辑 郭志杰)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"外籍来华消费有多便利？美国博主：来了就知道","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735780.shtml","source_display":"中國新聞網","published_at":"2026-11-21T17:01:02+08:00","category":"財經","digest":"聚焦APEC丨外籍来华消费有多便利"},{"title":"聚焦APEC丨外籍来华消费有多便利？美国博主：来了就知道","url":"https://www.chinanews.com/cj/shipin/2026/11-21/news1075659.shtml","source_display":"中新視頻","published_at":"2026-11-21T16:49:52+08:00","category":"財經","digest":"聚焦APEC丨外籍来华消费有多便利？美国博主：来了就知道"}]},{"id":"c8b41ef6d6a","title":"生态环境部党组书记孙金龙赴浙江省、上海市调研生态环境保护工作","url":"https://www.jiemian.com/article/15358449.html","summary":"11月18日至20日，生态环境部党组书记孙金龙赴浙江省、上海市调研生态环境保护工作。","summary_short":"11月18日至20日，生态环境部党组书记孙金龙赴浙江省、上海市调研生态环境保护工作。","digest":"11月18日至20日，生态环境部党组书记孙金龙赴浙江省、上海市调研生态环境保护工作","points":["大运河连接海河、黄河、淮河、长江、钱塘江五大水系，是国家重要文化遗产和生态廊道","孙金龙来到京杭大运河杭州段，现场察看河湖生态保护与修复成效…","他表示，要深入贯彻落实习近平总书记关于大运河文化保护传承利用和生态环境保护的重要指示批示精神…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T22:33:37+08:00","size":1,"keywords":[],"body":"11月18日至20日，生态环境部党组书记孙金龙赴浙江省、上海市调研生态环境保护工作。\n\n大运河连接海河、黄河、淮河、长江、钱塘江五大水系，是国家重要文化遗产和生态廊道。孙金龙来到京杭大运河杭州段，现场察看河湖生态保护与修复成效，详细了解大运河生态环境综合治理等工作情况。他表示，要深入贯彻落实习近平总书记关于大运河文化保护传承利用和生态环境保护的重要指示批示精神，统筹水资源、水环境、水生态治理，强化污染源头防控、生态保护与修复，持续改善流域生态环境质量。要把生态环境保护同文化遗产保护结合起来，深入实施大运河绿色生态廊道建设工程，加强大运河文化遗产系统性保护和统一监管，让古老大运河焕发时代新风貌。\n\n美丽河湖是美丽中国在水生态环境领域的集中体现和重要载体。孙金龙来到绍兴市西小河、鉴湖和上海市闵行区张正浦等地，现场察看水体保护和岸线生态环境治理成效，认真听取当地开展截污治污、生态修复，推动生态环境保护与文化旅游产业融合发展等情况介绍。他指出，要将美丽河湖建设作为加强水生态环境保护的重要抓手，强化综合治理、系统治理、源头治理，为周边居民提供更多亲水空间，不断提升城市宜居品质。要扎实推进群众身边水体保护治理，把水生态环境保护工作重心进一步向小微水体延伸，着力解决老百姓家门口的突出水生态环境问题，不断提升人民群众生态环境获得感、幸福感、安全感。\n\n推动经济社会发展绿色化、低碳化是实现高质量发展的关键环节。孙金龙来到位于杭州市的浙江吉利控股集团有限公司和位于绍兴市的浙江省现代纺织技术创新中心，详细了解新能源重卡生产使用、甲醇等清洁能源汽车产业发展、绿色智慧印染技术应用等情况。他表示，要深入贯彻落实习近平生态文明思想，牢固树立和践行绿水青山就是金山银山的理念，把绿色发展理念贯穿企业发展全过程，持续提升生态环境管理水平。要加快绿色低碳技术研发应用，助力产业结构、能源结构、交通运输结构优化调整，培育壮大绿色生产力，不断增强绿色发展动能。\n\n科技创新是美丽中国建设的关键支撑。孙金龙来到浙江省之江实验室、上海市绿色低碳数据创新实验室、上海“模速空间”创新生态社区、上海航天技术研究院，详细了解人工智能、大数据、卫星遥感等新技术在生态环境领域的应用情况。他指出，要全面落实精准科学依法治污，加强基础科学研究和关键技术攻关，推动研究成果落地应用，赋能生态环境保护，着力提升美丽中国建设科技支撑能力。要促进技术创新与治理需求、治理场景深度融合，持续强化新技术推广应用，不断提升生态环境治理现代化水平。\n\n调研期间，孙金龙来到生态环境部太湖东海局生态环境监测与科学研究中心，看望慰问干部职工，现场察看实验室运行情况，听取监测科研中心服务支撑太湖流域、东海海域治理等情况介绍。他强调，要深入学习贯彻党的二十届五中全会精神，全面贯彻习近平党建思想，坚持以党的政治建设为统领，扎实推进党的各方面建设，深化党建与业务融合，加快打造政治强、本领高、作风硬、敢担当的生态环境保护铁军。要切实发挥全面从严治党引领保障作用，强化陆海统筹、河海联动，以高质量监测数据和科研成果支撑区域生态环境共保联治，更好服务长三角美丽中国先行区建设和长三角一体化发展。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cddf4a8409b","title":"受地震影响，途经青藏铁路西格段部分列车晚点运行","url":"https://www.jiemian.com/article/15358437.html","summary":"国铁青藏公司消息，今天（11月21日）18时45分，青海省海西州德令哈市发生5.6级地震，地震波及青藏铁路西宁至格尔木段部分区段，铁路部门紧急扣停途经列车，部分列车晚点运行。","summary_short":"国铁青藏公司消息，今天（11月21日）18时45分，青海省海西州德令哈市发生5.6级地震…","digest":"国铁青藏公司消息，18时45分，青海省海西州德令哈市发生5.6级地震…","points":["国铁青藏公司消息，今天（11月21日）18时45分，青海省海西州德令哈市发生5.6级地震…","目前铁路部门已启动应急预案，对封锁区间进行设备全面巡检并准备充足的食品、饮用水等应急物资…","铁路部门提醒旅客，注意站、车公告或通过铁路12306App、客服电话等官方渠道查询…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T22:26:41+08:00","size":1,"keywords":[],"body":"国铁青藏公司消息，今天（11月21日）18时45分，青海省海西州德令哈市发生5.6级地震，地震波及青藏铁路西宁至格尔木段部分区段，铁路部门紧急扣停途经列车，部分列车晚点运行。\n\n目前铁路部门已启动应急预案，对封锁区间进行设备全面巡检并准备充足的食品、饮用水等应急物资，保障旅客需求。\n\n铁路部门提醒旅客，注意 html","summary":"11月21日，第十四届中国中部投资贸易博览会(以下简称“中博会”)在河南郑州开幕，吸引来自中部六省及海内外的政府机构、商协会和企业代表参会，围绕产业合作、投资贸易等开展交流对接。","summary_short":"11月21日，第十四届中国中部投资贸易博览会(以下简称“中博会”)在河南郑州开幕，吸引来自中部六省及海内外的政府机构…","digest":"11月21日，第十四届中国中部投资贸易博览会(以下简称“中博会”)在河南郑州开幕…","points":["11月21日，第十四届中国中部投资贸易博览会(以下简称“中博会”)在河南郑州开幕…","据介绍，本届中博会聚焦智能制造、培育钻石、生物医药、现代食品等领域，举办产业对接、项目洽谈…","受访嘉宾表示，中部地区产业基础和市场潜力突出，期待借助中博会进一步拓展合作"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T21:47:24+08:00","size":1,"keywords":[],"body":"11月21日，第十四届中国中部投资贸易博览会(以下简称“中博会”)在河南郑州开幕，吸引来自中部六省及海内外的政府机构、商协会和企业代表参会，围绕产业合作、投资贸易等开展交流对接。\n\n据介绍，本届中博会聚焦智能制造、培育钻石、生物医药、现代食品等领域，举办产业对接、项目洽谈、实地考察、展览展示等活动。受访嘉宾表示，中部地区产业基础和市场潜力突出，期待借助中博会进一步拓展合作。(记者 范晓恒)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/2C5B4D4A50C948E493CA76292DAEA42A.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c158d06331e","title":"重庆信托董事长翁振杰“不能正常履职”，总经理已代行董事长职务","url":"https://www.jiemian.com/article/15357729.html","summary":"界面新闻记者 | 邹文榕  重庆路桥（600106.SH）公告董事长翁振杰无法正常履职数日后，其第一大股东重庆信托发布董事长变动公告。","summary_short":"界面新闻记者 | 邹文榕  重庆路桥（600106.SH）公告董事长翁振杰无法正常履职数日后…","digest":"界面新闻记者 | 邹文榕  重庆路桥（600106.SH）公告董事长翁振杰无法正常履…","points":["重庆路桥（600106.SH）公告董事长翁振杰无法正常履职数日后…","11月20日，重庆信托官网消息，公司当日召开董事会…","秦晓倩现任重庆信托总经理，于2025年11月获董事会聘任…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T21:38:20+08:00","size":1,"keywords":[],"body":"界面新闻记者 | 邹文榕\n\n重庆路桥（600106.SH）公告董事长翁振杰无法正常履职数日后，其第一大股东重庆信托发布董事长变动公告。\n\n11月20日，重庆信托官网消息，公司当日召开董事会，审议同意秦晓倩代为履行公司董事长职务（含相关委员会委员），自本次董事会决议通过之日起生效。\n\n图源：重庆信托官网\r\n\n“目前，公司经营管理及业务开展正常，员工队伍保持稳定，各项业务均按既定部署平稳有序开展。”重庆信托公告显示。\n\n秦晓倩现任重庆信托总经理，于2025年11月获董事会聘任，2026年7月获监管核准批复担任公司总经理职务。\n\n此次秦晓倩代行董事长职务因公司现任董事长翁振杰被传失联有关系。\n\n2026年11月17日晚间，重庆信托持股的上市公司重庆路桥（600106.SH）公告称，近日收到股东重庆信托告知函，公司董事长翁振杰因个人原因暂不能正常履行董事长及董事会相关专门委员会委员等职务，董事会推举董事马赟在翁振杰不能正常履职期间，代行公司董事长及董事会相关专门委员会委员的职责。\n\n翁振杰于2025年11月获重庆路桥董事会提名担任非独立董事，一个月之后，被推举为重庆路桥第九届董事会董事长。而失联前，翁振杰最后一次出现在公众视线是其10月29日主持了重庆路桥第九届董事会第五次会议。\n\n知情人士向界面新闻记者透露，本周以来（11月16日-11月20日），翁振杰已未到过办公室工作。\n\n11月5日，“两高”发布依法惩治新型、隐性职务犯罪典型案例。其中一案例提到“翁某某”。据披露，2007年至2018年，张某某利用职务上的便利，为某信托公司在业务拓展、债券销售等方面提供帮助。某信托公司董事长翁某某为表达感谢，在明知张某某妻子李某不符合任职条件的情况下，让其到某信托公司控股的基金公司担任独立董事领取薪酬。2018年8月，李某担任某基金公司独立董事，至2021年9月离职，共计领取薪酬40万元。\n\n翁振杰现年65岁，曾先后担任重庆三峡银行董事长、西南证券（600369.SH）董事长、国都证券（870488.NQ）董事长等核心金融机构要职。目前，翁振杰仍担任中国信托业保障基金有限责任公司董事以及中国信托登记有限责任公司董事。\n\n1986年7月，翁振杰从解放军南京通信工程学院毕业后留校任教。转业后，翁振杰相继任职于中国凯利实业有限公司、中关村科技（000931.SZ），以及珠海国利工贸有限公司（下称珠海国利）。\n\n2001年，珠海国利牵头相关财团以11亿元现金入股重庆信托前身重庆国际信托投资有限公司（下称重庆国投），翁振杰以战投方代表进入重庆国投董事会。彼时，恰为全国信托业第五次整顿启动，重庆国投濒临破产，历史负债达13.09亿元，账面净资产4.28亿元。\n\n2002年1月，在重庆市政府推动下，重庆国投启动改制重组，后续完成更名后又历经多次增资。2005年起，翁振杰开始担任重庆信托首席执行官，2014年11月获批出任董事长。\n\n在翁振杰操盘下，重庆信托注册资本从重组后的10.34亿元增至150亿元，为迄今业内注册资本规模最高的信托公司。同时，依托自营股权投资，重庆信托又相继拿下多家银行、券商、基金以及上市公司股权，形成了覆盖面极广的金融资产版图。\n\n2003年9月，以重庆信托为主要发起人的益民基金获批筹建；同年10月，控股企业重庆路桥投资2亿元，成为重庆市商业银行第二大股东；2006年起，翁振杰带领下重庆信托先后参与西南证券、重庆万州商业银行两家问题金融机构的风险重组。\n\n其中西南证券在2009年完成借壳上市，翁振杰于2010年1月出任其董事长，次年西南证券增持银华基金股权至49%，成为其第一大股东。万州商业银行仅耗时106天就完成全部不良资产剥离，后续更名为重庆三峡银行，翁振杰出任该行首任董事长。\n\n不过，翁振杰在西南证券任董事长仅两年零7个月，2012年8月，翁振杰便辞去董事长职务。且辞任前不久，由翁振杰一手推动的西南证券吸收合并国都证券计划在当月告吹，A股首例上市券商并购案例随之流产。\n\n尽管这桩券业并购最后无疾而终，但2015年11月，重庆信托借国都证券增资扩股之际实现入股，取得国都证券5.282%股份。翁振杰于2016年进入国都证券董事会，2017年起，翁振杰代行国都证券董事长，并于2020年正式担任董事长。\n\n2023年，伴随监管引导信托业回归本源业务，叠加国都证券股东及公司治理问题遭到监管严查，作为股东方的重庆信托收到监管整改措施，重庆信托启动转让国都证券股权事宜，并于2024年与对手方浙商证券完成交割。此后，重庆信托彻底退出国都证券股东之列，翁振杰也于2025年5月卸任。\n\n天眼查显示，目前重庆信托仅持有益民基金65%、农银人寿10.34%的股权。\n\n重庆信托近年来业绩下滑明显。\n\n企业预警通显示，2023年前，重庆信托仅依赖投资收益一项，全年便能撑起接近三分之一的营收（合并利润表，下同）。2015年高峰期，重庆信托全年28.43亿元的投资收益更是占到营收（54.46亿元）的一半以上。重庆信托2019至2021年连续三年营业收入保持在76亿元以上，营收规模长期位居行业前列。\n\n转折出现自2022年：公司信托业务手续费佣金收入近乎腰斩，从2021年的19.45亿元回落至2022年的8.61亿元；到2023年，自营板块进一步出现剧烈波动，投资收益由2022年的11.73亿元转为-3.57亿元。\n\n在两大板块收入双重走弱之下，重庆信托营收排名由此前行业第四，下坠到第39位。即便到2025年营收回暖，全年同比增长40.84%至7.04亿元，营收行业排名也未能扭转，依旧处于行业腰部以下位置。\n\n2025年，重庆信托强化信托主业经营，布局破产重整投资信托和风险处置服务信托，前者累计发行规模超过10亿元，后者管理的信托资产规模达到532.63亿元。\n\n整体来看，截至2025年末，公司信托资产规模增长41%至3384亿元。其中，集合类和单一类信托规模均现增长。主动管理型信托中，期内，证券投资类信托资产大幅增长3.39倍至667.47亿元。\n\n此外，融资类信托也增幅明显。其中，主动管理型融资类信托资产增长39.29%至1596亿元，规模位列Wind有数据统计的行业第五；被动管理型融资类信托资产也增长1.99倍至131亿元，位列第二。\n\n有业内人士向界面新闻反馈，主动管理型的融资类信托也即通常业内提到的非标信托，投向领域多为城投、地产等领域，被动管理型融资类信托通常即信托公司为银行理财等机构资金做通道投向非标领域，“虽然收益率高，但伴随《资产管理信托管理办法》的落地，未来投资非标底层资产集中度需不超过25%，展业难度将大幅提升。”\n\n未经正式授权严禁转载本文，侵权必究。界面投资\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n重庆信托董事长翁振杰“不能正常履职”，总经理已代行董事长职务\n\n近期“两高”发布发布依法惩治新型、隐性职务犯罪典型案例，对“翁某某”有所提及。\n\n原创新闻邹文榕 · 2026/11/21 21:38来源：界面新闻\n\n图片来源：界面图库\n\n界面新闻记者 | 邹文榕\n\n重庆路桥（600106.SH）公告董事长翁振杰无法正常履职数日后，其第一大股东重庆信托发布董事长变动公告。\n\n11月20日，重庆信托官网消息，公司当日召开董事会，审议同意秦晓倩代为履行公司董事长职务（含相关委员会委员），自本次董事会决议通过之日起生效。\n\n图源：重庆信托官网\r\n\n“目前，公司经营管理及业务开展正常，员工队伍保持稳定，各项业务均按既定部署平稳有序开展。”重庆信托公告显示。\n\n秦晓倩现任重庆信托总经理，于2025年11月获董事会聘任，2026年7月获监管核准批复担任公司总经理职务。\n\n此次秦晓倩代行董事长职务因公司现任董事长翁振杰被传失联有关系。\n\n2026年11月17日晚间，重庆信托持股的上市公司重庆路桥（600106.SH）公告称，近日收到股东重庆信托告知函，公司董事长翁振杰因个人原因暂不能正常履行董事长及董事会相关专门委员会委员等职务，董事会推举董事马赟在翁振杰不能正常履职期间，代行公司董事长及董事会相关专门委员会委员的职责。\n\n翁振杰于2025年11月获重庆路桥董事会提名担任非独立董事，一个月之后，被推举为重庆路桥第九届董事会董事长。而失联前，翁振杰最后一次出现在公众视线是其10月29日主持了重庆路桥第九届董事会第五次会议。\n\n知情人士向界面新闻记者透露，本周以来（11月16日-11月20日），翁振杰已未到过办公室工作。\n\n11月5日，“两高”发布依法惩治新型、隐性职务犯罪典型案例。其中一案例提到“翁某某”。据披露，2007年至2018年，张某某利用职务上的便利，为某信托公司在业务拓展、债券销售等方面提供帮助。某信托公司董事长翁某某为表达感谢，在明知张某某妻子李某不符合任职条件的情况下，让其到某信托公司控股的基金公司担任独立董事领取薪酬。2018年8月，李某担任某基金公司独立董事，至2021年9月离职，共计领取薪酬40万元。\n\n翁振杰现年65岁，曾先后担任重庆三峡银行董事长、西南证券（600369.SH）董事长、国都证券（870488.NQ）董事长等核心金融机构要职。目前，翁振杰仍担任中国信托业保障基金有限责任公司董事以及中国信托登记有限责任公司董事。\n\n1986年7月，翁振杰从解放军南京通信工程学院毕业后留校任教。转业后，翁振杰相继任职于中国凯利实业有限公司、中关村科技（000931.SZ），以及珠海国利工贸有限公司（下称珠海国利）。\n\n2001年，珠海国利牵头相关财团以11亿元现金入股重庆信托前身重庆国际信托投资有限公司（下称重庆国投），翁振杰以战投方代表进入重庆国投董事会。彼时，恰为全国信托业第五次整顿启动，重庆国投濒临破产，历史负债达13.09亿元，账面净资产4.28亿元。\n\n2002年1月，在重庆市政府推动下，重庆国投启动改制重组，后续完成更名后又历经多次增资。2005年起，翁振杰开始担任重庆信托首席执行官，2014年11月获批出任董事长。\n\n在翁振杰操盘下，重庆信托注册资本从重组后的10.34亿元增至150亿元，为迄今业内注册资本规模最高的信托公司。同时，依托自营股权投资，重庆信托又相继拿下多家银行、券商、基金以及上市公司股权，形成了覆盖面极广的金融资产版图。\n\n2003年9月，以重庆信托为主要发起人的益民基金获批筹建；同年10月，控股企业重庆路桥投资2亿元，成为重庆市商业银行第二大股东；2006年起，翁振杰带领下重庆信托先后参与西南证券、重庆万州商业银行两家问题金融机构的风险重组。\n\n其中西南证券在2009年完成借壳上市，翁振杰于2010年1月出任其董事长，次年西南证券增持银华基金股权至49%，成为其第一大股东。万州商业银行仅耗时106天就完成全部不良资产剥离，后续更名为重庆三峡银行，翁振杰出任该行首任董事长。\n\n不过，翁振杰在西南证券任董事长仅两年零7个月，2012年8月，翁振杰便辞去董事长职务。且辞任前不久，由翁振杰一手推动的西南证券吸收合并国都证券计划在当月告吹，A股首例上市券商并购案例随之流产。\n\n尽管这桩券业并购最后无疾而终，但2015年11月，重庆信托借国都证券增资扩股之际实现入股，取得国都证券5.282%股份。翁振杰于2016年进入国都证券董事会，2017年起，翁振杰代行国都证券董事长，并于2020年正式担任董事长。\n\n2023年，伴随监管引导信托业回归本源业务，叠加国都证券股东及公司治理问题遭到监管严查，作为股东方的重庆信托收到监管整改措施，重庆信托启动转让国都证券股权事宜，并于2024年与对手方浙商证券完成交割。此后，重庆信托彻底退出国都证券股东之列，翁振杰也于2025年5月卸任。\n\n天眼查显示，目前重庆信托仅持有益民基金65%、农银人寿10.34%的股权。\n\n重庆信托近年来业绩下滑明显。\n\n企业预警通显示，2023年前，重庆信托仅依赖投资收益一项，全年便能撑起接近三分之一的营收（合并利润表，下同）。2015年高峰期，重庆信托全年28.43亿元的投资收益更是占到营收（54.46亿元）的一半以上。重庆信托2019至2021年连续三年营业收入保持在76亿元以上，营收规模长期位居行业前列。\n\n转折出现自2022年：公司信托业务手续费佣金收入近乎腰斩，从2021年的19.45亿元回落至2022年的8.61亿元；到2023年，自营板块进一步出现剧烈波动，投资收益由2022年的11.73亿元转为-3.57亿元。\n\n在两大板块收入双重走弱之下，重庆信托营收排名由此前行业第四，下坠到第39位。即便到2025年营收回暖，全年同比增长40.84%至7.04亿元，营收行业排名也未能扭转，依旧处于行业腰部以下位置。\n\n2025年，重庆信托强化信托主业经营，布局破产重整投资信托和风险处置服务信托，前者累计发行规模超过10亿元，后者管理的信托资产规模达到532.63亿元。\n\n整体来看，截至2025年末，公司信托资产规模增长41%至3384亿元。其中，集合类和单一类信托规模均现增长。主动管理型信托中，期内，证券投资类信托资产大幅增长3.39倍至667.47亿元。\n\n此外，融资类信托也增幅明显。其中，主动管理型融资类信托资产增长39.29%至1596亿元，规模位列Wind有数据统计的行业第五；被动管理型融资类信托资产也增长1.99倍至131亿元，位列第二。\n\n有业内人士向界面新闻反馈，主动管理型的融资类信托也即通常业内提到的非标信托，投向领域多为城投、地产等领域，被动管理型融资类信托通常即信托公司为银行理财等机构资金做通道投向非标领域，“虽然收益率高，但伴随《资产管理信托管理办法》的落地，未来投资非标底层资产集中度需不超过25%，展业难度将大幅提升。”\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c919a19db65","title":"“拖堂”的气候大会给全世界算了笔账","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735906.shtml","summary":"气候大会又“拖堂”了。","summary_short":"气候大会又“拖堂”了。","digest":"气候大会又“拖堂”了","points":["原定20日闭幕的《联合国气候变化框架公约》第三十一次缔约方大会(COP31)…","讨论了将近两周，显然，各国围绕“怎么减”“减多快”“谁出钱”等一系列核心问题的分歧仍在","联合国环境规划署在COP31召开前夕发布的《2026年适应差距报告》显示…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:15:16+08:00","size":1,"keywords":[],"body":"气候大会又“拖堂”了。\n\n　　原定20日闭幕的《联合国气候变化框架公约》第三十一次缔约方大会(COP31)，由于各方未能就部分核心议题达成一致，当晚进入加时阶段。\n\n　　讨论了将近两周，显然，各国围绕“怎么减”“减多快”“谁出钱”等一系列核心问题的分歧仍在。\n\n　　但紧迫的现实是，气候大会开到第三十一届，地球越来越热。\n\n　　安塔利亚的这场大会真正值得关注的地方，不仅仅是最后文本会写什么，它还把一件事摆到了台面上：谁在真干活，谁在拖后腿。\n\n　　融资的议题，一直备受关注。\n\n　　本次大会开幕即遇到问题——因发展中国家要求将气候资金列入议程，开幕式比原定时间晚了90分钟。这一插曲本身就足以反映分歧。\n\n　　2024年举行的COP29设立了到2035年发达国家每年至少筹集3000亿美元、全球每年至少筹集1.3万亿美元的气候融资目标，但怎么落实是最大问题。\n\n　　联合国环境规划署在COP31召开前夕发布的《2026年适应差距报告》显示，2024年从发达国家流向发展中国家的国际公共适应资金仅为282亿至317亿美元。\n\n　　需求与供给之间的差距约为十倍，即便实现COP30提出的到2035年将国际公共适应资金增至三倍的目标，经通胀调整后也仅能满足届时需求的20%至29%。\n\n　　土耳其总统埃尔多安在COP31领导人峰会开幕式上直言：“历史上消耗了全球碳预算的发达国家，应当在减排和资金支持方面承担更大责任。”\n\n　　巴西总统卢拉也在大会期间直接点名美国、法国、德国、葡萄牙等国领导人，敦促这些“吃尽工业革命红利、污染了这个星球”的西方富裕国家，在气候融资方面承担起更大的责任。\n\n　　荒诞的是，美国作为历史累计排放量最大的国家，这次连桌子也没坐。在别人讨论怎么减排、如何凑钱帮岛国修防波堤的时候，美国选择了直接“退群”。\n\n　　过去，西方一些政客最爱说“共同责任”，可真到了掏钱买单的时候，又换了副面孔。\n\n　　反观中国，则一直在用实际行动促进减排。\n\n　　数据摆出来很直观。\n\n　　截至2025年底，中国累计发电装机容量38.9亿千瓦，较2020年增长76.4%，其中风电与太阳能发电装机合计达18.4亿千瓦，占总装机容量的47.3%，历史性超越火电。\n\n　　到2026年上半年，中国的煤电发电量占比首次降至低于50%，可再生能源发电量占比首次超过四成。\n\n　　在全球产业链上，中国为全球提供了80%以上的光伏组件和70%的风电装备，推动全球风电、光伏发电成本大幅下降。“十四五”时期，中国出口的风电和光伏产品累计为其他国家减少碳排放约41亿吨。\n\n　　在交通领域，中国新能源汽车产销量连续11年居世界首位。此外，中国还建成了全球最大、最完整的清洁能源产业链，以及全球规模最大的碳排放权交易市场。\n\n　　这不是PPT上的远期承诺，而是看得见、摸得着、有实效的成果。\n\n　　在COP31的新闻发布会上，联合国秘书长古特雷斯肯定了中国在可再生能源领域付出的巨大努力及所取得的进展，并呼吁各国落实气候承诺。\n\n　　连美国前国务卿约翰·克里也坦言，“唯一大幅加快步伐的国家是中国。世界其他地方仍然步履蹒跚，而大自然每周、每天都在向我们发出更强烈的信号。”\n\n　　中国不是只管自己埋头赶路。\n\n　　在南南合作方面，中国已同46个发展中国家签署了60份应对气候变化南南合作谅解备忘录，开展了建设低碳示范区、“非洲光带”“早期预警”“清洁炉灶”等旗舰项目。\n\n　　此外，中国还向发展中国家捐赠了各类绿色低碳产品和设备，实施了300多期能力建设项目，为120多个发展中国家培训了超过1万名气候变化领域的官员和技术人员。\n\n　　所以，在这次考验“落实”成色的大会上，中国带来的是一份亮眼的“绿色答卷”。\n\n　　安塔利亚的这两周，并不能把所有气候治理难题都解决，但它把账本摊开在190多个缔约方面前：谁在欠债，谁在干活，一清二楚。\n\n　　说到底，气候治理不能只喊口号，应对全球变暖靠的不是嘴皮子，而是实际行动。\n\n　　｜总策划：俞岚\n\n　　｜策划：周锐\n\n　　｜统筹：王庆凯 程春雨\n\n　　｜执笔：张尼\n\n　　｜责编：李金磊\n\n　　｜设计：黄蕾\n\n　　｜“三里河”工作室出品\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd02212c124","title":"结构向优、动能向新 我国消费市场潜能不断释放","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735914.shtml","summary":"“经”彩新图景丨结构向优、动能向新 我国消费市场潜能不断释放  　　消费是国内需求的重要组成部分。","summary_short":"“经”彩新图景丨结构向优、动能向新 我国消费市场潜能不断释放  　　消费是国内需求的重要组成部分。","digest":"“经”彩新图景丨结构向优…","points":["消费是国内需求的重要组成部分","今年以来，随着提振消费专项行动深入实施，消费潜能逐步释放，消费市场规模总体上持续扩大","设计制作：葛曼怡 周妍妍 朱莹茹"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:14:40+08:00","size":1,"keywords":[],"body":"“经”彩新图景丨结构向优、动能向新 我国消费市场潜能不断释放\n\n　　消费是国内需求的重要组成部分。今年以来，随着提振消费专项行动深入实施，消费潜能逐步释放，消费市场规模总体上持续扩大。\n\n　　监制：赵刚\n\n　　记者：杨亚楠 金昱希\n\n　　合作机构：西安外国语大学\n\n　　设计制作：葛曼怡 周妍妍 朱莹茹\n\n　　审核专家：王秀丽\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1e0d9e71d2","title":"数万家智能工厂背后，AI到底改变了什么？","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735913.shtml","summary":"新华社南京11月20日电(记者沈汝发)“过去靠看风口亮度、听异响、摸水温来判断炉况，现在，我们给高炉装上了‘透视眼’。","summary_short":"新华社南京11月20日电(记者沈汝发)“过去靠看风口亮度、听异响、摸水温来判断炉况，现在，我们给高炉装上了‘透视眼’。","digest":"“过去靠看风口亮度、听异响、摸水温来判断炉况，现在，我们给高炉装上了‘透视眼’","points":["新华社南京11月20日电(记者沈汝发)“过去靠看风口亮度、听异响、摸水温来判断炉况，现在…","”南钢人工智能研究院院长李瑾彦说，高炉周边布设了上千个传感器，实时采集温度、压力…","印象中“傻大黑粗”的钢铁企业，依靠“智改数转网联”…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:11:08+08:00","size":1,"keywords":[],"body":"新华社南京11月20日电(记者沈汝发)“过去靠看风口亮度、听异响、摸水温来判断炉况，现在，我们给高炉装上了‘透视眼’。”南钢人工智能研究院院长李瑾彦说，高炉周边布设了上千个传感器，实时采集温度、压力、图像等多维数据，铁水一级品率提升了10个百分点，217个产品和技术达到国际领先水平。\r\n\n　　印象中“傻大黑粗”的钢铁企业，依靠“智改数转网联”，实现了从依赖个人经验的“手工作坊式”操作，到依靠数据算法的标准化、精准化生产的转变。\n\n　　这是我国大力培育发展智能工厂的一个缩影。在南京举行的2026世界智能制造大会上，工业和信息化部等六部门正式公布第二批领航级智能工厂培育名单，小米汽车科技有限公司的AI驱动的敏捷制造高端新能源汽车超级智能工厂等34家工厂入选。截至目前，我国已累计培育49家领航级智能工厂。\n\n　　从大型飞机、高速列车、能源装备等大国重器，到新能源汽车、智能终端、日用消费品等百姓民生，新一批领航工厂展现出先进制造业高端化、智能化、绿色化、融合化发展的新态势。\n\n　　智能制造是推动制造业转型升级，提升产业竞争力的重要途径。“新一代人工智能和先进制造技术的融合创新，将极大地提高制造的质量、效率和可靠性，推动智能制造系统越用越聪明，越用越智能。”中国工程院院士周济说。\n\n　　人工智能已成为制造业的强大助力。西门子大中华区总裁肖松举例说，西门子正和全球知名的造船企业合作，通过AI和全面数字孪生的深度融合，把造船的设计、制造、运营等整个系统搬进数字世界。\n\n　　“AI能够基于过去船舶长期运行的海量高质量数据，从成千上万种复杂的船舶设计、建造与运行的组合中，很快为工程师智能匹配出最优方案。”肖松说，项目实施后，建造周期预计缩短30%，生产效率提高30%。\n\n　　大会同期举办的2026世界智能制造博览会，设置了智能装备、未来工厂、产教融合、产业基座四大主题馆与户外体验区，600余家海内外知名企业参展。展览首次设置“AI+制造”和“人才专区”特色展区，围绕AI诊断、研发设计、生产作业、质量检测、仓储物流、生态服务等智能制造各环节进行展示，吸引了许多企业负责人和行业专业人士参观交流。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc25d83f3c2","title":"秋假+赏秋热潮叠加 地方文旅消费迎来新机遇","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735912.shtml","summary":"亲子游、家庭游是秋假期间旅游市场一大亮点。","summary_short":"亲子游、家庭游是秋假期间旅游市场一大亮点。","digest":"亲子游、家庭游是秋假期间旅游市场一大亮点","points":["亲子游、家庭游是秋假期间旅游市场一大亮点","眼下，安徽黄山正值赏秋时节，秋假与赏秋热潮叠加，让当地不少景区人气持续走高","孩子们来到黄山，除了饱览风光，还能体验哪些特色活动"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:09:24+08:00","size":1,"keywords":[],"body":"亲子游、家庭游是秋假期间旅游市场一大亮点。眼下，安徽黄山正值赏秋时节，秋假与赏秋热潮叠加，让当地不少景区人气持续走高。孩子们来到黄山，除了饱览风光，还能体验哪些特色活动？\n\n01\n\n跟着课本游西递\n\n赏秋研学两相宜\r\n\n　　放秋假去哪里玩？跟着课本实地打卡古村落。\n\n　　走出课堂体验手作 古村研学玩法多多\n\n　　记者看到，现场上演的是“徽墨传薪”沉浸式演出，游客可以参与其中，跟着演员走进故事，在互动中感知徽墨文化。\n\n　　看完演出，还可以到徽墨工坊，小朋友在师傅的指导下，体验传统徽墨制作。像捶墨、徽墨描金，都可以上手参与，师傅还会结合现场的制作工具，讲解徽墨从原料到成品的整套工序，让孩子们能直观地了解传统徽墨的技艺流程，感受徽州文化的魅力。\n\n　　秋假叠加赏秋旺季 古村迎来八方客流\n\n　　即便不是周末，西递景区主入口停车场的车位已基本饱和，场内车辆除了安徽本地的，还有不少江浙沪地区的牌照，更远的比如湖北、陕西等地牌照的车辆，反映出游客既有周边短途家庭，也有不少跨省出游家庭。\n\n　　为什么11月的工作日，西递依旧客流旺盛？一方面，当下正值黄山地区赏秋的好时节，西递、宏村、塔川等地秋景吸引了不少游客；另一方面，不只是安徽，国内多地中小学也陆续迎来秋假。\n\n　　有家长谈到，各地秋假时间并不完全相同，大家错峰出游，既避开了传统假期里人挤人的高峰，又能感受到景区热闹的氛围，游玩体验更加舒适。\n\n　　而对于当地的旅游市场来说，这种相对分散的出游方式也拉长了旅游热度周期。景区工作人员介绍，11月中旬以来，西递日均接待游客7000多人次；自11月初起，像西递这样的热门景区，周边酒店等预订紧俏。\n\n　　今年是安徽首次推行中小学春秋假制度。这种时间拉长、错峰释放的旅游活力，为地方文旅消费带来新机遇，同时也对景区接待能力、配套服务提出更高要求，如何更好适配亲子家庭出游需求，也是当地在本次秋假接待中持续探索的课题。\n\n02\n\n鱼灯融入新潮设计\n\n圈粉亲子家庭\n\n　　逛完了安徽黄山市黟县的西递村，再去歙县看看。徽州鱼灯是歙县一带流传的传统鱼形灯笼。今年秋假期间，当地把徽州鱼灯融入新潮设计，推出一系列符合学生和年轻群体审美的创新文创产品。\n\n　　走进安徽黄山市歙县徽州古城，这家店的鱼灯主题文创琳琅满目，摆件、冰箱贴、盲盒等产品受到亲子家庭的欢迎，店铺销量大幅上涨。\n\n　　游客 曹艺可：一路上看到很多鱼灯文创产品，种类特别多，通过这些，我也了解到一些鱼灯的故事。\n\n　　某文创店工作人员 叶金菊：这几天秋假研学，客流特别大，我们整体销量比平时增长了40%以上。\n\n　　据介绍，传统的徽州鱼灯造型偏大，多用于节庆展演。而近年来，当地开发了多款潮玩、挂件、饰品、日用文创等轻巧的品类，更贴合孩子与年轻人的需求、审美。除了买文创，徽州鱼灯制作的体验课程更受到孩子的欢迎。\n\n　　游客 曾煜程：我亲手制作了鱼灯之后，特别有成就感，非物质文化遗产不光靠手艺人保护，我们要传承它、体验它，让更多人了解和喜爱徽州鱼灯。\n\n03\n\n出游研学收获多\n\n公益托管暖人心\n\n　　秋假期间，一些家庭选择带孩子外出游玩，在旅行中增长知识、放松身心。而针对双职工无法陪孩子的家庭，安徽多地还推出了秋假公益托管服务，缓解家长的假期看护压力。\n\n　　连日来，在安徽省铜陵市，当地依托乡村秋色，推出一系列沉浸式研学玩法，家长和孩子们可以赏秋景、逛市集、品美食；在芜湖市，不少学校带着学生参与手工体验、田园劳作、户外团队游戏等。而淮北市的学生们，可以到淮北工业博物馆里游览，通过全息光影、科普装置，沉浸式感受工业遗存的魅力与城市发展的脉络。\n\n　　研学团学生 张芯蕊：近距离看到了老电厂的设备、矿工工作的场景，还体验了趣味科普实验，既好玩又长知识。\n\n　　与此同时，针对有看管需求的家庭，安徽各地推出了秋假公益托管班。在池州市贵池区秋浦街道湖心社区，孩子们可参与烘焙课程，在老师的指导下，亲手体验揉面、发酵、塑形等一系列制作流程，感受劳动的乐趣。\n\n　　学生 伍玟玥：我和同学们一起做面包，特别开心。\n\n　　学生家长 张芳华：这个秋假家长比较忙，社区提供一个特别好的机会和平台，让孩子能学到东西，我觉得就是最终的意义。\n\n　　在淮北市，团市委依托24个托管点位，打造了内容丰富的秋假公益课堂。课程涵盖红色诵读、体育运动、心理疏导、作业辅导、安全自护等。当地还整合高校大学生、青年教师、社工等力量，开展志愿服务，让学生在假期中既有人管、有事做，又能学有所获。\n\n04\n\n亲子游升温\n\n航天研学受青睐\n\n　　趁着放秋假，不少家长选择带孩子去沿海城市走走看看。在海南，除了自然风光，主题乐园、研学体验类产品受到欢迎，孩子们在游玩中放松身心、增长见识。\n\n　　在三亚市，家长带着孩子畅玩水世界，水上滑道、漂流河道惊险刺激。水族馆内，孩子们驻足观赏各类海洋生物，在游玩中探索海洋奥秘、收获快乐与知识。\n\n　　游客 王歆玥：我是从湖南来三亚游玩的，平时上学有一些考试非常紧张，来到水世界放松了一些。\n\n　　游客 张巧飞：小孩子放秋假，我们过来玩，想带孩子边研学、边玩耍。\n\n　　在文昌市，航天特色研学游也受到欢迎。学生们走进文昌航天科普中心，在讲解员带领下，了解火箭、卫星知识。为迎接研学热潮，文昌航天科普中心推出了秋假专属优惠政策，并开设免费课堂，邀请航天领域专家现场授课，让孩子在参观体验中拓宽眼界。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6c1e3ddf42","title":"泽连斯基会见英国国防大臣，讨论乌防空能力建设","url":"https://www.jiemian.com/article/15358396.html","summary":"当地时间11月21日，乌克兰总统泽连斯基在基辅会见到访的英国国防大臣斯特里廷。","summary_short":"当地时间11月21日，乌克兰总统泽连斯基在基辅会见到访的英国国防大臣斯特里廷。","digest":"当地时间11月21日，乌克兰总统泽连斯基在基辅会见到访的英国国防大臣斯特里廷","points":["当地时间11月21日，乌克兰总统泽连斯基在基辅会见到访的英国国防大臣斯特里廷","双方重点就乌防空能力建设、“爱国者”防空系统所用拦截弹供应、联合武器生产…","在联合武器生产与远程打击能力建设方面，双方认为该领域具备深化合作的空间"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T21:05:45+08:00","size":1,"keywords":[],"body":"当地时间11月21日，乌克兰总统泽连斯基在基辅会见到访的英国国防大臣斯特里廷。双方重点就乌防空能力建设、“爱国者”防空系统所用拦截弹供应、联合武器生产、远程打击能力等议题进行磋商。\n\n在联合武器生产与远程打击能力建设方面，双方认为该领域具备深化合作的空间。通过联合生产与技术协作，能够助力乌克兰推进本土导弹研发计划。\n\n此外，泽连斯基还表示，英国提供的新一批国防与人道主义援助总额超过5亿英镑。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ced00a6b7f1","title":"算力补贴直达企业 北京延庆上线词元服务平台","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735881.shtml","summary":"中新网北京11月21日电 (张思琦)Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服务计划上线发布会20日在北京延庆Y-Hub·OPC创新社区举办。","summary_short":"中新网北京11月21日电 (张思琦)Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服…","digest":"Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服…","points":["中新网北京11月21日电 (张思琦)Token Hub·词元汇——中关村延庆园词元服务平台暨…","该平台的上线投用，将有效补齐区域科创服务链条，降低中小微企业人工智能算力使用成本…","平台依托天翼云底座搭建，接入DeepSeek、豆包、通义千问等34款模型，全面覆盖文本创作…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:38:36+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 (张思琦)Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服务计划上线发布会20日在北京延庆Y-Hub·OPC创新社区举办。该平台的上线投用，将有效补齐区域科创服务链条，降低中小微企业人工智能算力使用成本，为北京延庆数字科创产业发展赋能增效。\n\n图为Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服务计划上线发布会。主办方供图\n\n　　据了解，平台依托天翼云底座搭建，接入DeepSeek、豆包、通义千问等34款模型，全面覆盖文本创作、图文生成、音视频制作等多元AI应用能力，可充分满足各类科创企业的智能化开发与运营需求。\n\n　　平台最大亮点为普惠化、直达式算力补贴机制，企业算力使用补贴最高可达50%。补贴采用实时直抵抵扣模式，无需企业先行垫付费用、后续报销，彻底简化补贴申领流程，大幅减轻中小微企业资金压力。\n\n　　同时，平台配套推出多档月度算力套餐及增量加油包，实现补贴账目、套餐账目独立分账、清晰可查。企业账户开通、订单查询、发票申领等全部流程实现线上一体化办结。平台支持密钥额度上限设置、IP白名单管理，全程可追溯每一次模型调用记录，从技术层面筑牢企业数据安全屏障。\n\n　　本次发布会成果密集落地，同步完成平台正式发布、全新服务体系亮相、科创加速营招募、产业机构集中签约等多项重要环节。平台将算力供给、政策补贴、孵化培育、创业培训、产业对接等服务整合为一体化科创服务包，精准直达创业主体，全力打造普惠可及、生态完善的区域AI创新发展环境。\n\n图为Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服务计划上线发布会。主办方供图\n\n　　发布会还同步推出Y-Hub·OPC企业服务体系与“Yan创课堂”培训栏目，集成政策申报、财税法务、知识产权等全维度创业刚需服务。活动现场专门设置实操咨询专区，技术人员一对一、手把手指导企业完成平台注册、补贴申领、模型部署等操作，让科创服务直达一线、落地见效。\n\n　　活动由中关村科技园区延庆园管委会指导，中国电信延庆分公司、中关村延庆园投资发展有限公司、北京氪星创服联合主办，多家科技孵化器与科技服务企业共同承办。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4aa329a1da","title":"行业报告称，中国脑机接口产业集聚于三大城市群","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735875.shtml","summary":"中新社北京11月21日电 (记者 陈杭)21日于北京举行的2026脑机接口大会主论坛发布《脑机接口创新发展研究报告(2026)》。","summary_short":"中新社北京11月21日电 (记者 陈杭)21日于北京举行的2026脑机接口大会主论坛发布《脑机接口创新发展研究报告(20…","digest":"21日于北京举行的2026脑机接口大会主论坛发布《脑机接口创新发展研究报告(2026…","points":["中新社北京11月21日电 (记者 陈杭)21日于北京举行的2026脑机接口大会主论坛发布《脑…","报告显示，中国脑机接口产业集聚于京津冀、长三角和粤港澳三大城市群，已初步形成重视原创、转化…","报告由中国信息通信研究院联合脑机接口产业联盟编制"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:35:26+08:00","size":1,"keywords":[],"body":"中新社北京11月21日电 (记者 陈杭)21日于北京举行的2026脑机接口大会主论坛发布《脑机接口创新发展研究报告(2026)》。报告显示，中国脑机接口产业集聚于京津冀、长三角和粤港澳三大城市群，已初步形成重视原创、转化、制造的优质协同链条。\r\n\n　　报告由中国信息通信研究院联合脑机接口产业联盟编制。报告显示，2026年，全球脑机接口企业数量达1175家，相比2025年有较快增长。脑机接口国际产业发展环境不断完善，产业格局面临洗牌。中国、美国等从技术、应用、生态、治理等方面推进，积极争取产业话语权。\n\n　　根据报告，中国京津冀地区脑机接口项目呈精品化特征，融资转化率高；长三角地区有龙头企业带动，投资环境良好；粤港澳地区中小企业多，制造环节占优。\n\n　　报告提出，脑机接口产业当前的营收主要来自科研和医疗两个领域，大量相关医疗器械产品仍处于研发、临床与审批中；非医疗领域尚处产业初期阶段，在人机交互、消费电子方面有较大发展空间。\n\n　　报告指出，脑机接口技术周期长、难度大，多学科协同复杂度高，疗效评估仍需审慎；规模化落地受制于临床证据不足、支付与人才体系不完善，仍需要战略耐心、资本耐心，需要持续的政策支持及资源供给。\n\n　　报告发布人、中国信息通信研究院知识产权与创新发展中心主任李文宇表示，2026年，随着脑机接口技术与产业不断进步，其战略意义正逐渐从大脑和外部设备的直接连接，走向更为多维的产业赋能。\n\n　　2026脑机接口大会由中国信息通信研究院、北京市昌平区联合举办，从11月19日持续至22日，打造集竞技活动、论坛、成果展览于一体的国家级产业交流平台。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cee54e96138","title":"北京丰台亮出9处优质体育资源 邀“城市合伙人”共创运动新空间","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735873.shtml","summary":"中新网北京11月21日电 11月中旬开始，北京市丰台区陆续举办系列专场推介发布会，亮出政府合作诚意，全程公开透明，持续释放优质投资机会。","summary_short":"中新网北京11月21日电 11月中旬开始，北京市丰台区陆续举办系列专场推介发布会，亮出政府合作诚意，全程公开透明…","digest":"11月中旬开始，北京市丰台区陆续举办系列专场推介发布会，亮出政府合作诚意…","points":["中新网北京11月21日电 11月中旬开始，北京市丰台区陆续举办系列专场推介发布会…","“遇见丰台·众汇京彩”——2026丰台区体育资源发布会作为第二场系列发布20日举办","会上，丰台亮出体育资源“家底”，集中推出9处体育“留白空间”，包括5宗体育用地…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:26:57+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 11月中旬开始，北京市丰台区陆续举办系列专场推介发布会，亮出政府合作诚意，全程公开透明，持续释放优质投资机会。“遇见丰台·众汇京彩”——2026丰台区体育资源发布会作为第二场系列发布20日举办。会上，丰台亮出体育资源“家底”，集中推出9处体育“留白空间”，包括5宗体育用地、1处体育存量设施和3处可做气膜场馆用地，面向社会公开征集运营主体，所有体育设施、地块信息全部向社会公开、全程接受社会监督。\r\n\n　　“丰台资源丰富。大家的需求，我们看得明白。丰台区有打造宜居宜业城区的真心，也有一抓到底的决心。”北京市丰台区副区长高崇耀率先用三个“有”——有底、有数、有心，道出丰台的诚意。\n\n　　一块体育用地，能长出什么？丰台实打实拿出一批优质空间满足想象。会上，北京市丰台区体育局局长杨华发布9处体育资源，分布在右安门、大红门、南苑、花乡等街镇，项目类型丰富、特色鲜明，可充分满足各类运营主体差异化、多元化的项目建设需求。\n\n　　其中，5宗体育用地全部完成征地拆迁、净地可移交，周边市政道路贯通，基本具备“拿地即开工”条件。位于南二环与南三环之间的右安门街道T00-0501-617地块A4体育用地面积最大、人口密度最高，周边配套条件成熟，可考虑做地区级全民健身中心、全民赛事活力中心；大红门街道T00-0516-0003地块A4体育用地位处南中轴活力片区，弥补周边潮流运动项目缺口，可瞄准“潮流运动”方向；南苑街道NY-040地块A4体育用地紧邻南苑森林湿地公园，可打造体绿融合、全龄友好、赛消一体的森氧运动公园；看丹街道FT00-1523-081地块A4体育用地位处中关村丰台园，依托高频客群底盘与交通商业协同，可打造全龄运动生活中心；新村街道FT00-1523-0030地块A4体育用地体量最小但紧邻北京丰台站，可服务通勤人群与周边居民。\n\n　　5宗净地外，还有一处待更新的存量设施——占地21.78万平方米、已运营36年的丰台体育中心城市焕新项目，以及3处属于建设用地的拆违腾退地块，位处花乡街道、王佐镇及六里桥街道，可做气膜场馆用地，为中小运营主体提供了进入丰台体育市场的低门槛通道。\n\n　　“我们寻找的是‘城市合伙人’，丰台有把体育产业当作长期事业来做的诚意，无论是重资产开发，还是轻资产运营，总有一款适合您。”杨华发出邀约。\n\n　　北京市体育产业协会副会长高原鸣在访谈中表示，引入社会资本，不是简单把体育项目完全交给市场，核心是把握好边界；华体集团总裁助理李铁林从产业实操角度为企业“划重点”，要吃透政策、用好服务工具、匹配地块所在板块的功能定位；北京市篮协副主席焦健则从运动员、全民健身推广者的角度出发，对丰台未来的体育场景提出期待；中国科学院大学讲习教授，北京市建筑设计研究院总建筑师、总规划师，首钢集团总建筑师吴晨认为，项目落地需要运营前置、业态导入和界面处理，让体育节点与慢行系统、周边街区形成动线耦合，把“过境人流”转化为“驻留人流”。\n\n　　高崇耀用核心三件事向企业清晰亮出丰台的发力主线——释放空间资源、做优营商环境、打造产业生态。“三样到位了，产业才能扎下根、活力才能出来。”\n\n　　截至目前，丰台全区规划公共体育设施共计164处，总用地面积约198.8公顷，建筑规模约136.6万平方米。“15分钟健身圈”建设加速推进，已建成全民健身专项活动场地497片，全民健身路径工程器材13000余件，体育公园2处，群众在家门口即可享高品质健身服务。\n\n　　体育生态为产业生长涵养沃土，营商环境与金融赋能同样不可或缺。据介绍，丰台区通过持续举办“区长企业服务日”活动，深化政企协调发展，同时创新推出“审批科长工作营”，联动市级部门，汇聚20余个职能部门、60余名审批科长，提供一站式审批对接服务，助力企业轻装上阵、专心发展。\n\n　　在金融支持环节，北京银行丰台支行副行长郝梦瑶介绍，银行可提供“项目建设—资产更新—运营周转—消费场景—综合服务”全周期金融服务，为金融资本与产业资本同频共振带去新机会。\n\n　　以体育凝聚人气，以商业实现价值，以生态反哺发展，丰台将携手“城市合伙人”，把每一处体育空间打造成“一刻钟遇见美好生活”的活力场景。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6872f6c602","title":"投资额约14亿元 重庆发布市属国企第四批“四链”融合创新项目","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735871.shtml","summary":"中新网重庆11月21日电 (梁钦卿)重庆国际人才交流大会·“科学家·创业者·投资人”创投对接活动21日在重庆举办。","summary_short":"中新网重庆11月21日电 (梁钦卿)重庆国际人才交流大会·“科学家·创业者·投资人”创投对接活动21日在重庆举办。","digest":"重庆国际人才交流大会·“科学家·创业者·投资人”创投对接活动21日在重庆举办","points":["中新网重庆11月21日电 (梁钦卿)重庆国际人才交流大会·“科学家·创业者·投资人”创投对接…","活动现场发布了重庆市属国企第四批“四链”融合创新项目共65个，投资额约14亿元…","此次活动以“‘四链’融合 赋能发展”为主题，推动科学家、创业者、投资人三方对接、同向发力…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:19:59+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (梁钦卿)重庆国际人才交流大会·“科学家·创业者·投资人”创投对接活动21日在重庆举办。活动现场发布了重庆市属国企第四批“四链”融合创新项目共65个，投资额约14亿元，主要覆盖智能网联新能源汽车、先进材料与绿色化工、智能装备与制造等6大方向。\n\n　　此次活动以“‘四链’融合 赋能发展”为主题，推动科学家、创业者、投资人三方对接、同向发力，撬动各类资本为重庆市引进的高层次人才创新创业赋能。\n\n图为活动现场。重庆市国有资产监督管理委员会供图\n\n　　此次发布的“四链”融合创新项目中，先进材料与绿色化工方向项目7个、计划投资2.69亿元，围绕特种精细化工、新型功能材料等开展研发，推动产业向高端化、绿色化转型；智能装备与制造方向项目14个、计划投资5.34亿元，重点布局高端装备国产化和首台(套)重大技术装备研发应用，提升产业链自主可控能力。\n\n　　今年以来，重庆市属国企“四链”融合创新项目累计落地239个、带动经济效益近100亿元。\n\n　　重庆渝富控股集团现场发布渝富科创资本体系及国有资本服务高层次人才成果转化对接机制，构建“入库汇总—价值挖掘—分类赋能—转化落地”全链条孵化通道，配套成果转化、融资接力、项目直通三张清单。\n\n　　该机制聚焦高层次人才项目动态库建设，按“创业企业类”“中试熟化类”“概念验证类”“创意形成类”分层标注、分类赋能；对尚未转化为公司实体的科技成果，探索组建陪跑人团队，深化“科技成果+认股权”模式；对已形成项目载体的，按种子期、天使期、A轮及以前、成长成熟期精准匹配种子基金、天使类基金、科创母基金等投资工具接续赋能。\n\n　　本次活动紧扣重庆“33618”现代制造业集群体系，现场签约人才项目、“国企优投”创投项目。人才项目签约涵盖科技副总、“背靠一所大学”校企合作、人才代表等；“国企优投”创投项目涵盖基金合作与科创企业投资两类，涉及碳化硅半导体、医疗大数据、具身智能、智能网联新能源汽车、智能装备等领域。\n\n　　重庆市国有资产监督管理委员会相关负责人表示，将持续跟踪“国企优投”签约项目落地实施，推动国有资本服务高层次人才成果转化对接机制常态长效，深化人才强企战略，为现代化新重庆建设贡献国资国企力量。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c854eedbd31","title":"泽连斯基：打击克里米亚大桥是对俄军袭击乌桥梁的回应","url":"https://www.jiemian.com/article/15358373.html","summary":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，在乌方对克里米亚大桥实施打击之前，俄军已经使用导弹和无人机对乌克兰境内桥梁发动109次袭击。","summary_short":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，在乌方对克里米亚大桥实施打击之前…","digest":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示…","points":["当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示…","泽连斯基强调，乌方针对克里米亚大桥的行动，是在俄军多次袭击乌克兰桥梁之后作出的回应","他指出，克里米亚大桥长期被俄方用作军事后勤通道，俄军经由该桥向克里米亚运送坦克…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:59:32+08:00","size":1,"keywords":[],"body":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，在乌方对克里米亚大桥实施打击之前，俄军已经使用导弹和无人机对乌克兰境内桥梁发动109次袭击。泽连斯基强调，乌方针对克里米亚大桥的行动，是在俄军多次袭击乌克兰桥梁之后作出的回应。他指出，克里米亚大桥长期被俄方用作军事后勤通道，俄军经由该桥向克里米亚运送坦克、火炮等各类军事装备，相关运输活动有视频佐证。泽连斯基认为，俄方持续袭击乌克兰基础设施的行为，表明其并无结束战争的意愿，还在寻找借口继续升级冲突。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccbc62ad085","title":"泽连斯基称乌欧美俄四方会谈时间取决于美方协调","url":"https://www.jiemian.com/article/15358367.html","summary":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，下一轮乌克兰、美国、欧洲、俄罗斯四方会谈的举办时间与形式，取决于美方和各方就会议议程协调一致的进度。","summary_short":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，下一轮乌克兰、美国、欧洲…","digest":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示…","points":["当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，下一轮乌克兰…","泽连斯基指出，欧洲加入谈判后，四方参与令谈判筹备更为复杂，会议需要充分准备…","泽连斯基称，人员交换依然重要，乌方主张按照 “全部交换全部” 原则推进…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:58:57+08:00","size":1,"keywords":[],"body":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，下一轮乌克兰、美国、欧洲、俄罗斯四方会谈的举办时间与形式，取决于美方和各方就会议议程协调一致的进度。他称，“美方会尽力推动会谈尽快举行，但预计俄方可能采取行动拖延会议”。泽连斯基指出，欧洲加入谈判后，四方参与令谈判筹备更为复杂，会议需要充分准备、设定清晰具体的议程，力求取得实质成果，各方不应只满足于最低限度的共识。泽连斯基称，人员交换依然重要，乌方主张按照 “全部交换全部” 原则推进，但这不能成为谈判唯一议题。谈判必须聚焦结束战争这一核心目标，通过多方磋商逐步推动战事终结。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cca9632a91c","title":"伊朗称美军掩护油轮非法通行，霍尔木兹海峡触雷事故不断","url":"https://www.jiemian.com/article/15358359.html","summary":"当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚，多艘油轮在霍尔木兹海峡南部海域发生事故。","summary_short":"当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚，多艘油轮在霍尔木兹海峡南部海域发生事故。","digest":"当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚…","points":["当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚…","伊朗方面表示，20日晚，美军动用了包括空中加油机、F-16、F/A-18和 F-35…","在此期间，霍尔木兹海峡南部海域发生了多起油轮爆炸和起火事故"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:43:43+08:00","size":1,"keywords":[],"body":"当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚，多艘油轮在霍尔木兹海峡南部海域发生事故。伊朗方面表示，20日晚，美军动用了包括空中加油机、F-16、F/A-18和 F-35、P-8“海神”海上巡逻机、多架直升机以及MQ系列无人机等大规模空中力量，试图为油轮通过霍尔木兹海峡提供掩护，并协助其进行未经授权的货物运输。在此期间，霍尔木兹海峡南部海域发生了多起油轮爆炸和起火事故。声明称，第一起事件发生在海塞卜港附近。第二起事件则发生在21日清晨，地点位于盖奈姆岛海岸线约三公里处。这些爆炸是由涉事船只触碰水雷所致。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2a85981f65","title":"唐人神：积极采取措施应对本轮猪周期底部","url":"https://www.jiemian.com/article/15358351.html","summary":"唐人神日前在机构调研时表示，公司积极采取措施
