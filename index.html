<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

畫面確定。\n美聯社及英國天空新聞亦發布相關片段，以特朗普「似乎伸手欲牽習近平的手」描述這段短暫互動。\n\nTAKE MY HAND! - Trump helps Xi on escalator to APEC plenary. https://t.co/CYFS2rBenP\n— Viory Video (@vioryvideo) November 19, 2026習近平：確保中美關係沿正確航線前進\n兩國元首同日下午在深圳舉行雙邊會談。據中國外交部公布，習近平表示，中美關係總體穩定向好，期待與特朗普繼續為兩國關係領航掌舵，確保沿着正確航線前進。\n習近平強調，雙方應落實元首共識，加強團隊溝通，擴大合作，並建設性管控一時未能解決的分歧，防止矛盾升級。\n據中方通報，特朗普感謝中方熱情接待，表示希望保持兩國關係穩定發展，並加強農產品、能源及人工智能等領域合作。雙方認為此次會晤積極、具建設性，同意制定建設性戰略穩定關係行動計劃。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC．有片｜習近平特朗普扶梯上互助「挽手」畫面熱傳","url":"https://www.stheadline.com/realtime-china/3639145/深圳APEC有片習近平特朗普扶梯上互助挽手畫面熱傳","source_display":"星島頭條","published_at":"2026-11-20T07:03:53+08:00","category":"內地","digest":"亞太經合組織第三十三次領導人非正式會議周四在深圳國際交流中心舉行…"},{"title":"深圳APEC｜特朗普低頭閉目疑打瞌睡？白宮稱正看文件","url":"https://www.stheadline.com/realtime-world/3639139/深圳APEC特朗普低頭閉目疑打瞌睡白宮稱正看文件","source_display":"星島頭條","published_at":"2026-11-20T03:36:51+08:00","category":"國際","digest":"美國總統特朗普周四出席深圳亞太經合組織領導人非正式會議期間，被直播鏡頭拍到頭部低垂…"},{"title":"深圳APEC｜王毅點評會議成果 「達成『深圳展望』里程碑」","url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議成果-達成深圳展望里程碑","source_display":"星島頭條","published_at":"2026-11-19T23:10:15+08:00","category":"內地","digest":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果"},{"title":"深圳APEC｜王毅點評會議6項成果 「達成《深圳展望》里程碑」","url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議6項成果-達成深圳展望里程碑","source_display":"星島頭條","published_at":"2026-11-19T23:10:15+08:00","category":"內地","digest":"亞太經合組織第三十三次領導人非正式會議週四在深圳閉幕，中共中央政治局委員…"}],"cross":{"total":4,"angles":[{"point":"外交部長王毅在19日晚上會見記者，盤點今屆深圳APEC的成果","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議成果-達成深圳展望里程碑"},{"point":"亞太經合組織第三十三次領導人非正式會議周四在深圳國際交流中心舉行…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-china/3639145/深圳APEC有片習近平特朗普扶梯上互助挽手畫面熱傳"},{"point":"亞太經合組織第三十三次領導人非正式會議週四在深圳閉幕，中共中央政治局委員…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-china/3639035/深圳APEC王毅點評會議6項成果-達成深圳展望里程碑"},{"point":"美國總統特朗普周四出席深圳亞太經合組織領導人非正式會議期間，被直播鏡頭拍到頭部低垂…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-world/3639139/深圳APEC特朗普低頭閉目疑打瞌睡白宮稱正看文件"}]}},{"id":"c9c1392051a","title":"中俄美元首會晤｜特朗普擬周六開記者會 王毅指三方同意防止衝突對抗","url":"https://news.tvb.com/tc/1207355-中俄美元首會晤特朗普擬周六開記者會王毅指三方同意防止衝突對抗","summary":"美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅，他稱跟中俄元首建立極好關係。外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件。","summary_short":"美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅，他稱跟中俄元首建立極好關係。","digest":"美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅…","points":["美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅，他稱跟中俄元首建立極好關係","外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件","中共中央政治局委員、外長王毅，昨晚在深圳機場，分別為美國總統特朗普，及俄羅斯總統普京送機…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T06:13+08:00","size":5,"keywords":[],"body":"美國總統特朗普計劃在本港時間周六凌晨召開記者會，總結亞洲之旅，他稱跟中俄元首建立極好關係。外長王毅就稱，中俄美元首同意防止衝突對抗，三方會晤是載入史冊的標誌性事件。\n\n中共中央政治局委員、外長王毅，昨晚在深圳機場，分別為美國總統特朗普，及俄羅斯總統普京送機，之後趕到記者會。\n\n他指中俄美三國元首史上首次會晤，屬於載入史冊的標誌性事件。三方在取得一系列共識後，對外發布和平宣言，三國元首會晤可說是和平峰會。\n\n外長王毅表示：「中國一貫主張國家不分大小、一律平等，我們致力於推動國際關係民主化。同時我們認為，大國擁有更多資源、更大能力，應當展現大國胸懷、大國擔當，在國際上要帶頭講平等、守誠信、遵道義、重合作、作表率。」\n\n王毅又稱，大國關係牽動國際格局演變，事關全球戰略穩定。目前世界百年變局加速演進，各種風險挑戰層出不窮，國際社會對於和平與穩定的期盼日益強烈，對於大國加強溝通協調的呼聲持續高漲。這次會晤適應時代潮流，符合世界期待。\n\n王毅強調，三個元首同意防止發生衝突對抗，守住和平共處底線，期待形成整體穩定、均衡發展的大國關係新格局。\n\n王毅指出：「會晤發表的和平宣言，凝聚了三方的共識，對更有效應對全世界的挑戰，維護好世界的和平穩定，具有重大且積極的意義。」\n\n王毅表明，中國將與俄羅斯、美國，一同全面高效落實這次會議達成的共識，透過工作層保持溝通和協調。\n\n美國總統特朗普接受全國廣播公司的電話訪問，稱跟國家主席習近平討論發展「超級智能」，即人工智能的相關議題，包括設立防護機制。\n\n特朗普又指，三方會晤讓他跟習近平與普京建立極好的關係，若果10分是滿分，他會給12分，並計劃在美國東岸時間周五中午，在白宮召開記者會，總結訪華及菲律賓行程。\n\n普京早前在記者會表示，在亞太經合組織框架內合作，對俄羅斯有重大意義。他亦跟中美元首討論發展人工智能問題，同意以安全角度防範任何威脅。","image":"https://pro-vod-cdn.tvb.com/081e6b2fab6c4865b298687c2525459d/snapshots/493841e1f8a540c9bf88ef22d5ada7f5-00008.jpg","video":"https://pro-vod-cdn.tvb.com/081e6b2fab6c4865b298687c2525459d/646997a62f8a4f0594aa2ad975cf6f75-19b99ee5fd5cd11464a3ccbc4f1016a5-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/081e6b2fab6c4865b298687c2525459d/snapshots/493841e1f8a540c9bf88ef22d5ada7f5-00008.jpg","lan ary_short":"中新社纽约11月19日电 (记者 王帆)美国人工智能公司Anthropic当地时间19日在纽约纳斯达克证券交易所上市…","digest":"美国人工智能公司Anthropic当地时间19日在纽约纳斯达克证券交易所上市…","points":["中新社纽约11月19日电 (记者 王帆)美国人工智能公司Anthropic当地时间19日在纽…","当天，Anthropic以每股83美元的发行价挂牌，计入私募配售等股份后…","正式开盘时，该股报111.50美元，公司市值一度达到约2万亿美元"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T07:36:17+08:00","size":3,"keywords":[],"body":"中新社纽约11月19日电 (记者 王帆)美国人工智能公司Anthropic当地时间19日在纽约纳斯达克证券交易所上市，其首次公开募股(IPO)融资总额超过813亿美元，创下美股史上最大IPO融资规模纪录。\n\n　　当天，Anthropic以每股83美元的发行价挂牌，计入私募配售等股份后，完全稀释市值约为1.5万亿美元。正式开盘时，该股报111.50美元，公司市值一度达到约2万亿美元。截至收盘，该股报97.17美元，涨幅17.07%。\n\n　　据彭博社报道，Anthropic打破了太空探索技术公司此前创下的IPO融资规模纪录，股票认购需求达到发行量的近七倍。以发行价认购股票的投资者获利颇丰，而在上市首日开盘后买入的投资者则可能面临亏损。\n\n　　报道说，Anthropic的市值约占美股公开市场总市值的2%。在当前市场环境下，其上市后的股价表现被视为观察人工智能产业未来发展前景的重要风向标之一。\r\n\n　　Anthropic上市之际，人工智能发展及监管问题再次引发关注。在纳斯达克证券交易所举行上市敲钟仪式期间，纽约、旧金山等地有抗议者举行示威活动，呼吁放缓人工智能发展步伐。此外，有美国国会议员通过社交媒体发声，呼吁加强人工智能监管。\n\n　　面对外界对人工智能发展风险的担忧，Anthropic首席执行官达里奥·阿莫代伊表示，公司将审慎把握人工智能系统训练和部署的节奏，投入必要时间，直至确信这些系统安全可靠并始终处于人类控制之下。\n\n　　Anthropic成立于2021年，旗下主要产品包括“克劳德”系列人工智能模型。今年前三季度，公司营业收入达到332.4亿美元，较去年同期增长约12倍。(完) 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"Anthropic上市 创史上最大IPO融资纪录","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734997.shtml","source_display":"中新網 環球","published_at":"2026-11-20T07:36:17+08:00","category":"國際","digest":"美国人工智能公司Anthropic当地时间19日在纽约纳斯达克证券交易所上市…"},{"title":"Anthropic上市｜開市報111美元 較招股價急升34% 創全球最大IPO紀錄","url":"https://www.stheadline.com/stock-market/3639034/Anthropic上市開市報111美元-較招股價急升34-創全球最大IPO紀錄","source_display":"星島頭條","published_at":"2026-11-20T00:53:01+08:00","category":"財經","digest":"人工智能巨頭Anthropic周四在納斯達克掛牌，開市報111.5美元…"},{"title":"Anthropic上市｜開市報111美元 較招股價升34% 創全球最大IPO紀錄","url":"https://www.stheadline.com/stock-market/3639034/Anthropic上市開市報111美元-較招股價升34-創全球最大IPO紀錄","source_display":"星島頭條","published_at":"2026-11-20T00:53:01+08:00","category":"財經","digest":"人工智能巨頭Anthropic周四在納斯達克掛牌，開市報111. 氣變化，注意保暖"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T08:13+08:00","size":1,"keywords":[],"body":"天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄，大帽山最低5度。\n\n天文台署理高級科學主任黎宏駿指出：「預計今日會是密雲，有幾陣雨，市區氣溫由初時約17度，下降至今日稍後約14度，新界再低一、兩度，吹清勁北至東北風，離岸及高地會吹強風。」\n\n在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖。\n\n早上上班上學時間，不少市民穿了外套及頸巾，天文台預料明日早上仍然相當清涼，最低15度，隨後一兩日氣溫稍為回升，下周中期再度轉涼。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/snapshots/9d1a6588a82e469180a6ee5f15cfd348-00006.jpg","video":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/ae111edb665d47bd90ae6ca657947fa8-c65245cd819bec7338d021b7e71b0359-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/832ad8539e164f2d9a71ce50c3700b35/snapshots/9d1a6588a82e469180a6ee5f15cfd348-00006.jpg","lang":"zh-Hant"},{"id":"c028816e5f3","title":"宏福苑丨逾96%業主已簽買賣協議 啟德最受歡迎 粉嶺九龍灣已落成項目多人揀","url":"https://www.stheadline.com/society/3638897/宏福苑丨逾96業主已簽買賣協議-啟德最受歡迎-粉嶺九龍灣已落成項目多人揀","summary":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。","summary_short":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。","digest":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權","points":["大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權","房屋局回覆《星島》查詢時透露，截至本月17日，共有1,909戶業主完成簽署《買賣協議》…","1,651戶的業權轉讓已經完成並收到現金或「樓換樓劵」，佔總數83.2%"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:00:00+08:00","size":1,"keywords":[],"body":"大埔宏福苑大火事件發生將近一年，政府早前提出收購宏福苑A至H八座的業主的業權。房屋局回覆《星島》查詢時透露，截至本月17日，共有1,909戶業主完成簽署《買賣協議》，佔單位總數96.2%；1,651戶的業權轉讓已經完成並收到現金或「樓換樓劵」，佔總數83.2%；除少數特殊個案外，餘下個案預計於年內完成業權轉讓。\n「特設銷售計劃」中，以啟德啟陽苑最多業主選購，之後是已落成的粉嶺及九龍灣項目。目前已有9位業主完成收樓，有長者成為首位到粉嶺樂嶺軒收樓取鎖匙的宏福苑業主。\n有長者粉嶺上樓取鎖匙 年底遷入\n房協昨日在社媒發布影片，片中見到房協人員陪同長者張女士和家人前往粉嶺樂嶺軒辦理收樓手續及領取鎖匙，一同見證正式收樓。張女士對新居環境表示滿意，稱讚單位景致開揚，且單位無需進行繁複裝修，只需添置基本傢俬電器及加裝長者友善輔助設施，預計今年年底便能正式入伙，與同住的母親及弟弟展開新生活。她感謝社會各界熱心人士支持，以及「一戶一社工」和「解說專隊」成員一直以來的協助。\n相關新聞：宏福苑｜婆婆到粉嶺樂嶺軒收鎖匙 成首位業主收樓 料年底前入伙\n房屋局回覆《星島》查詢時透露，為出售業權的宏福苑業主而設的「特設銷售計劃」，已於9月29日開始按早前透過電腦隨機攪珠方式排列選樓次序的結果分批進行選樓。截至本月17日，共1,627戶，佔申請參與的業主的96%獲邀出席選樓環節，其中1,445戶出席選樓環節，1,410戶已透過「特設銷售計劃」選購或預留新單位。\n啟德已售或預留單位456個\n當中較多人選擇的是預計2028年10月落成的啟德啟陽苑，已售／預留456個單位；其次為房協項目、已落成的粉嶺樂嶺軒，已售／預留278個單位；九龍灣盛緻苑亦已售／預留252個單位。至於2029年12月落成的大埔欣雅苑，已售／預留181個單位。選購已落成的九龍灣盛緻苑及粉嶺樂嶺軒單位的業主，將由今年11月起陸續完成交易及收樓。截至本月17日，已有9位業主完成收樓。\n鄧家彪引述，有居民表示滿意樓宇附近的社區以及交通設施。\n協助宏福居民處理安置工作的工聯會立法會議員鄧家彪表示，能夠在一年內讓約2000個家庭有確切的長遠安居出路，並不容易，當中牽涉到收集意向、複雜的法律程序，以及要兼顧公平性，他認為整個政府跨部門團隊的努力值得肯定。\n他續指，較多人選擇啟德、粉嶺及九龍灣屋苑，反映多數居民重視盡早獲得安居之所，而政府亦做到在符合司法程序、兼顧社會利益與公平性的情況下，盡早安排合適居所。他提到，居民亦同樣重視地理位置，而政府亦並非隨意選擇樓宇，而是盡量貼近居民原有的生活質素，有居民表示滿意樓宇附近的社區以及交通設施。\n羅曉楓(左)引述居民稱，希望新一年可以過得「自在少少」。\n\n大埔區議員羅曉楓表示，政府重視宏福苑居民聲音，多個部門一直為居民提供協助，有居民向他讚揚解說專員解說詳細。羅曉楓引述居民稱，經歷一年，居民都希望新一年可以過得「自在少少」。對於仍有少數業主沒有簽署《買賣協議》，他認為不是全部人都是「死硬派」，相信有部分居民已失聯或已離香港。羅曉楓是選委會選舉參選人，詳細名單請參閱選舉網站。\n相關新聞：\n宏福苑｜「特設銷售計劃」10屋苑價單曝光 最平裕豐苑僅151萬 最貴房協「灝然」達536萬\n宏福苑收購︱《買賣協議》限期昨日屆滿 93.2%業主簽署 房屋局將酌情處理特殊個案","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbd0a5ab3e9","title":"元朗大馬路單車紙皮起火 火舌逼近垃圾桶 途人合力移走防蔓延","url":"https://www.stheadline.com/breaking-news/3639138/元朗大馬路單車紙皮起火-火舌逼近垃圾桶-途人合力移走防蔓延","summary":"元朗大馬路對開行人路發生火警。","summary_short":"元朗大馬路對開行人路發生火警。","digest":"元朗大馬路對開行人路發生火警","points":["元朗大馬路對開行人路發生火警","周四（19日）網上流傳一段影片，顯示路邊一個垃圾桶旁邊有紙皮及單車起火，火勢猛烈","多名途人見狀上前協助移走垃圾桶及單車，防止火勢蔓延，情況驚險"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:54:03+08:00","size":1,"keywords":[],"body":"元朗大馬路對開行人路發生火警。周四（19日）網上流傳一段影片，顯示路邊一個垃圾桶旁邊有紙皮及單車起火，火勢猛烈。多名途人見狀上前協助移走垃圾桶及單車，防止火勢蔓延，情況驚險。\n火勢猛烈逼近垃圾桶 兩名市民上前移開\n網傳片段可見，事發地點位於元朗大馬路對開行人路，一個垃圾桶旁邊的紙皮及單車陷入火海，現場火勢猛烈，火舌一度逼近垃圾桶。\n有兩名市民見狀後，隨即上前將垃圾桶移開；另有途人協助搬走鎖在鐵欄的單車，避免火勢進一步擴大。\n片段未有交代確實事發日期及時間。據了解，警方及消防初步未有接獲相關報案。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c106916d806","title":"屯門雅都花園第3座疑爆食水管停水逾兩日 住戶不滿垃圾房旁取水","url":"https://www.stheadline.com/breaking-news/3639137/屯門雅都花園第3座疑爆食水管停水逾兩日-住戶不滿垃圾房旁取水","summary":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。","summary_short":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。","digest":"屯門雅都花園第3座自本周二起疑因食水管爆裂緊急停水，至今仍未恢復供水","points":["屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水","事件引起居民不滿，批評初期未獲妥善應急安排，需在環境惡劣的垃圾房旁取水","涉事第3座本周二上午疑因地下供水上天台的水缸輸喉管爆裂，導致整座大廈停水，樓下商場則未受影響"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:38:41+08:00","size":1,"keywords":[],"body":"屯門雅都花園第3座自本周二（17日）起疑因食水管爆裂緊急停水，至今（20日）仍未恢復供水。事件引起居民不滿，批評初期未獲妥善應急安排，需在環境惡劣的垃圾房旁取水。\n疑地下輸喉管爆裂停水 商場未受影響\n據悉，涉事第3座本周二上午疑因地下供水上天台的水缸輸喉管爆裂，導致整座大廈停水，樓下商場則未受影響。\n今日（20日）凌晨現場可見，大廈內貼有通告通知住客停水及臨時供水位置。\n管理公司稱招標需時一個月 區議員介入設臨時取水點\n有住客反映，居民曾向管理處及業主立案法團反映問題，惟未獲應急安排，低層住戶一度要在環境惡劣的垃圾房旁取水。據了解，管理公司曾表示「要按正常程序向政府招標，一個月後，居民才有食水」。\n區議員及支援團隊其後介入事件，在第3座2樓平台設置臨時取水點，供受影響的1至14樓居民應急。據悉，維修人員需由第1及第2座駁水至第3座，再接駁至地下垃圾房旁及大廈平台位置裝設臨時供水。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb4dc49587b","title":"山頂柯士甸山道獨立屋遇竊 賊人撬窗掠4個Hermès手袋值約15萬","url":"https://www.stheadline.com/breaking-news/3639136/山頂柯士甸山道獨立屋遇竊-賊人撬窗掠4個Hermès手袋值約15萬","summary":"山頂柯士甸山道發生爆竊案。","summary_short":"山頂柯士甸山道發生爆竊案。","digest":"山頂柯士甸山道發生爆竊案","points":["山頂柯士甸山道發生爆竊案","昨午（19日）5時許，警方接獲一名外傭報案，指柯士甸山道24號至28號一幢獨立屋懷疑遭賊人潛…","警員接報到場調查，發現上址一間房間的窗戶被撬開"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:30:43+08:00","size":1,"keywords":[],"body":"山頂柯士甸山道發生爆竊案。昨午（19日）5時許，警方接獲一名外傭報案，指柯士甸山道24號至28號一幢獨立屋懷疑遭賊人潛入爆竊。 警員接報到場調查，發現上址一間房間的窗戶被撬開。經初步點算，相信屋內有4個名牌手袋失去。 據悉，4個失竊手袋均為Hermès，總值約15萬元。 警方經初步調查後，將案件列作爆竊，交由中區警區刑事調查隊第一隊跟進，暫時未有人被捕。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4276738a95","title":"香港仔利群商場大鼠當眾行走 網民慨嘆環境變差","url":"https://www.stheadline.com/breaking-news/3639130/香港仔利群商場大鼠當眾行走-網民慨嘆環境變差","summary":"香港仔利群商場疑出現大鼠出沒。","summary_short":"香港仔利群商場疑出現大鼠出沒。","digest":"香港仔利群商場疑出現大鼠出沒","points":["香港仔利群商場疑出現大鼠出沒","周四（19日）有網民在社交平台發文，指在該商場地下電梯位置目擊大鼠行走，引起網民熱議","網民指傍晚6時半目擊 大鼠神色自若"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T02:11:31+08:00","size":1,"keywords":[],"body":"香港仔利群商場疑出現大鼠出沒。周四（19日）有網民在社交平台發文，指在該商場地下電梯位置目擊大鼠行走，引起網民熱議。\n網民指傍晚6時半目擊 大鼠神色自若\n有網民昨日（19日）在Facebook群組「南區之友 2.0」發帖，指在「利群商場6:30見到」，位置在「地下、電梯位置」。從網傳圖片可見，一隻體型頗大的老鼠在場內當眾行走，表現神色自若，未見懼色。\n從網傳圖片可見，一隻體型頗大的老鼠在場內當眾行走。FB@南區之友 2.0\n帖文引起不少網民留言討論，有人幽默地代老鼠自稱「我係米奇，唔係老鼠」，亦有人打趣稱「日光日白，幻覺」。\n不過，亦有網民對區內衞生情況表示擔憂，慨嘆「唉，癡線，香港仔越嚟越污糟」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdd86b53e30","title":"新版Zeekr 7X香港開售｜豪華純電動5座SUV煥新升級 一式三款早鳥價$39.99萬元起 即日起至11月25日ELEMENTS圓方首展","url":"https://www.stheadline.com/car/3639123/新版Zeekr-7X香港開售豪華純電動5座SUV煥新升級-一式三款早鳥價3999萬元起-即日起至11月25日ELEMENTS圓方首展","summary":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會，豪華純電5座SUV續有單馬達後驅7X與長續航7X Plus…","summary_short":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","digest":"極氪Zeekr昨午在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","points":["極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會…","新車即日起至11月25日於ELEMENTS圓方金區1樓首展，車展早鳥優惠價分別為$399…","新版Zeekr 7X香港開售：流麗型態0.247Cd低風阻 兩款新色選擇"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T01:29:39+08:00","size":1,"keywords":[],"body":"極氪Zeekr昨午（11月19日）在西九龍ELEMENTS圓方為煥新版7X舉行發佈會，豪華純電5座SUV續有單馬達後驅7X與長續航7X Plus，以及標配空氣懸掛的雙馬達四驅旗艦7X Platinum三款型號。新車即日起至11月25日於ELEMENTS圓方金區1樓首展，車展早鳥優惠價分別為$399,900起（限量30部）、$469,900起及$519,900起，預計12月到港交付。文、圖：sammy\n新版Zeekr 7X香港開售：流麗型態0.247Cd低風阻 兩款新色選擇\n煥新版Zeekr 7X的長闊高尺寸是4,800 x 1,920 x 1,650mm，長度比舊版延伸13mm，橫闊收窄10mm，高度與2.9米軸距維持不變。簡約流麗造型同樣出自設計大師Stefan Sielaff手筆，換入新款前後泵把之餘，車頭並改配主動進氣格柵，連繫兩端新增導風口，行車風阻低至0..247Cd。車尾方面，車牌框擺放位置也見調動，由泵把上移到尾門中央，而可供選配的智能感應車門開關鍵，亦由B柱改為與車門把手融合。車展期間選購7X Plus和7X Platinum，除了免費升級Nappa真皮座椅，還分別加送電動後座側窗簾和橙色Akebono四活塞制動卡鉗。車身顏色共有6種，暗夜紫Interstellar Purple與Tech Grey星幕灰配Black Roof黑車頂是新增色系，其中後者是旗艦7X Platinum專屬。\n新版Zeekr 7X香港開售：裝潢配置升級 新增紫黑內飾\n環抱式座艙實用空間比例達83.34%，整體佈局沒有異動，但用料及配置皆升級。當中，頂篷改以麂皮包裹，質感更豪華。全線車系標配行車記錄儀（DVR）與雙層隔音玻璃，後者助分貝降至52db，乘坐比前寧靜舒適。與此同時，智能駕駛輔助系統核心晶片亦升級至J6M SOC（7鏡頭及3雷達）架構，提升極端天氣及後方盲區監測的傳感器融合力。未來，透過OTA更新還可加入遙控泊車輔助（RPA）新功能。全新紫黑配搭車廂內飾是7X Plus和7X Platinum專屬，而兩車配置同樣高級，除了前座備有14方位電動調校、記憶、通風及按摩功能，還有36.21吋AR-HUD投射式儀錶及21喇叭7.1.4聲道Zeekr Sound Pro音響等。\n新版Zeekr 7X香港開售：添動力增續航 10.5分鐘充電80%\n動力方面，煥新版Zeekr 7X性能同見升級。入門7X續配75kWh磷酸鐵鋰電，馬力455ps，扭力520Nm，0-100km/h加速5.6秒，WLTP續航力482km。對比舊版分別提升34ps與80Nm，0-100km/h快了0.4秒，續航程里微添2km。現場展出是7X Plus（暗夜紫）和7X Platinum（星幕灰配黑頂），兩者皆搭載100kWh三元鋰電，前者馬力與扭力輸出跟入門7X一致，0-100km/h只需5.5秒，續航力627km是車系之冠，比舊版可多行12km。\n 旗艦雙馬達四驅7X Platinum擁有680ps和790Nm更強動力，同比舊版提升34ps與80Nm，0-100km/h由3.8秒縮短至3.7秒，續航力也微増2km至545km。受惠800V高壓平台，最高支援DC 450kW直流快速，最快10.5分鐘充電80%。此外，智能氣壓懸掛連CCD電磁減震控制是Platinum版專屬，能自動掃描路面和即時調整吸震軟硬度，可升高降低車身70mm。\n 7X Plus規格\n 傳動：100kWh三元鋰電 + 後置驅動馬達\n 馬力/扭力：455ps / 520Nm\n 0至100km/h：5.5秒\n 續航力：627km(WLTP)\n 尺碼：4,800 x 1,920 x 1,650mm\n 售價：$469,900起(早鳥優惠)\n 查詢：2111 1009\n\n 7X Platinum規格\n 傳動：100kWh三元鋰電 + 前後馬達四驅\n 馬力/扭力：680ps / 790Nm\n 0至100km/h：3.7秒\n 續航力：545km(WLTP)\n 尺碼：4,800 x 1,920 x 1,650mm\n 售價：$519,900起(早鳥優惠)\n 查詢：2111 1009","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7b18573e0d","title":"深圳灣東濱隧道多車相撞 涉粵港兩地牌貨車 橙色林寶堅尼SUV車頭重創","url":"https://www.stheadline.com/breaking-news/3639082/深圳灣東濱隧道多車相撞-涉粵港兩地牌貨車-橙色林寶堅尼SUV車頭重創","summary":"深圳灣東濱隧道發生多車相撞事故。","summary_short":"深圳灣東濱隧道發生多車相撞事故。","digest":"深圳灣東濱隧道發生多車相撞事故","points":["深圳灣東濱隧道發生多車相撞事故","周四（19日）網上流傳影片顯示，隧道內有多輛車輛相撞，當中包括多輛粵港兩地牌貨車…","橙色林寶堅尼橫亘路面 車頭蓋扭曲泵把脫落"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:19:40+08:00","size":1,"keywords":[],"body":"深圳灣東濱隧道發生多車相撞事故。周四（19日）網上流傳影片顯示，隧道內有多輛車輛相撞，當中包括多輛粵港兩地牌貨車，現場一片凌亂。\n橙色林寶堅尼橫亘路面 車頭蓋扭曲泵把脫落\n網傳片段可見，「車陣」之中有一輛橙色林寶堅尼Urus SUV橫亘路面，其車頭損毀嚴重，車頭蓋扭曲摺起，泵把脫落，車身碎片散落一地。\n有目擊者在拍片時形容，涉事林寶堅尼「前後都扁晒」，同時指另一輛黑色私家車同樣「扁晒」。\n網民戲稱「公司三文治」 \n車禍片段在網上流傳後引起網民熱議。有人以食物戲謔被夾在車陣中的林寶堅尼變成「公司三文治」，亦有人笑稱「咦，蛋牛治喎！」。\n此外，不少網民亦在留言區揣測意外成因，有人直言「個個咁CUT線遲早嘅事」，亦有人質疑「乜料呀？直路都炒到咁？」，亦有網民留意車身狀況稱「林寶冇爛呀，非常硬！」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c733f2ae37b","title":"山頂盧吉道男子疑醉酒失足跌落斜坡 途人發現報警送院","url":"https://www.stheadline.com/breaking-news/3639061/山頂盧吉道男子疑醉酒失足跌落斜坡-途人發現報警送院","summary":"山頂盧吉道發生有人墮坡事件。","summary_short":"山頂盧吉道發生有人墮坡事件。","digest":"山頂盧吉道發生有人墮坡事件","points":["山頂盧吉道發生有人墮坡事件","周四（19日）10時32分，一名女子報案，指一名男子由欄杆跌落斜坡","持香港身份證印裔男疑踩欄杆飲酒失足 據悉，涉事男子持香港身份證，為印裔人士"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T00:04:28+08:00","size":1,"keywords":[],"body":"山頂盧吉道發生有人墮坡事件。周四（19日）10時32分，一名女子報案，指一名男子由欄杆跌落斜坡。 持香港身份證印裔男疑踩欄杆飲酒失足 據悉，涉事男子持香港身份證，為印裔人士。他懷疑在盧吉道一個欄杆位置踩上欄杆飲酒，醉酒後失足，跌落約兩米下的行人路。 男事主其後在行人路上被途人發現，途人隨即報警求助。警方及救護人員接報趕抵現場，發現男子清醒能行走，惟面部有擦傷，其後由救護車送院治理。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c224e714978","title":"TVB 59周年台慶｜羅嘉良強勢回歸送祝福 AI短片感謝幕後英雄","url":"https://news.tvb.com/tc/1207339-TVB59周年台慶羅嘉良強勢回歸送祝福AI短片感謝幕後英雄","summary":"無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝。無綫集團行政主席許濤、總經理蕭世和為台慶揭開序幕。","summary_short":"無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝。","digest":"無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝","points":["無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝","無綫集團行政主席許濤、總經理蕭世和為台慶揭開序幕","三屆視帝羅嘉良強勢回歸，身穿「一套西裝」的「奇哥」，以「十足的風度」率先送上祝福…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:21+08:00","size":1,"keywords":[],"body":"無綫集團慶祝59周年台慶，台前幕後一眾職藝員齊齊慶祝。\n\n無綫集團行政主席許濤、總經理蕭世和為台慶揭開序幕。\n\n三屆視帝羅嘉良強勢回歸，身穿「一套西裝」的「奇哥」，以「十足的風度」率先送上祝福，與新世代藝人，帶大家重溫《難兄難弟》的光輝歲月。\n\n「中年好聲音」唱將，帶來多首勁歌金曲，一眾女演員亦落力演出。\n\n六位《東張西望》女主持無懼寒風，以400米跑步比賽，展現外景採訪的衝勁。\n\n施展渾身解數的還有他們，向經典場景背後特技組等功臣致敬。\n\n「阿姐」汪明荃就特意拍攝短片，感謝梳化服同事。\n\n台慶亦以人工智能製作的短片，感謝工作多年的幕後英雄。\n\nTVBUDDY拉大隊走出電視城，帶同逾80名小生花旦，來到下月初才正式啟用的中九龍繞道九龍灣段，以歌舞表演賀壽。\n\n無綫電視1967年11月19日啟播，是全港首間商營的無線電視台。","image":"https://pro-vod-cdn.tvb.com/e0f10932dc36442cb8d601d6e888f8ab/snapshots/77f21271546d479e807c15f966880133-00008.jpg","video":"https://pro-vod-cdn.tvb.com/e0f10932dc36442cb8d601d6e888f8ab/84a5fa016ab84effa37214d65a96f77f-33be3fc36f9d6c5629e0e6ef00418c42-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e0f10932dc36442cb8d601d6e888f8ab/snapshots/77f21271546d479e807c15f966880133-00008.jpg","lang":"zh-Hant"},{"id":"c7735392bbb","title":"據悉銅鑼灣豐澤有店舖經理疑監守自盜 偷走約188萬元貨物","url":"https://news.tvb.com/tc/1207338-據悉銅鑼灣豐澤有店舖經理疑監守自盜偷走約188萬元貨物","summary":"銅 25505ab0909b/c672ef4f2c4f4b1e82345b2fdcf2fb0e-6bd1841723deae9926df3550ff9b2de1-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/7df7f22c02434e158f7225505ab0909b/snapshots/0581e85d0252423ca4a6d31d75b9ad72-00005.jpg","lang":"zh-Hant"},{"id":"c0b3db69068","title":"GTA6熱潮｜香港警察借遊戲封面宣傳守法 提醒市民現實「冇得消星」","url":"https://www.stheadline.com/breaking-news/3639037/GTA6熱潮香港警察借遊戲封面宣傳守法-提醒市民現實冇得消星","summary":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式上市，隨即在全球玩家群中掀起熱潮。","summary_short":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式上市…","digest":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto…","points":["歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）…","香港警察今日借遊戲熱潮在社交平台發文，並以AI生成模仿《GTA》遊戲封面的圖片…","有關帖文的主題為「玩家必睇•獨家攻略」，警方表示「現實生活，一旦右上角亮起★★★★★…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:16:33+08:00","size":1,"keywords":[],"body":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式上市，隨即在全球玩家群中掀起熱潮。香港警察今日借遊戲熱潮在社交平台發文，並以AI生成模仿《GTA》遊戲封面的圖片，提醒市民現實生活中的違法行為，不能像《GTA》一樣消除通緝星級或重新讀取存檔。\n有關帖文的主題為「玩家必睇•獨家攻略」，警方表示「現實生活，一旦右上角亮起★★★★★，冇得消星，更加冇得 Load Save！」、「香港每一條街道都保持平安，就係最型嘅 MISSION PASSED」。\n警方提到的星星，在《GTA》中是指通緝等級（Wanted Level），代表警方對玩家的追捕強度。有網民讚賞警方利用《GTA6》熱潮作守法宣傳，又表示可否與遊戲公司合作推出一款遊戲，讓一班未能成為警察的市民體驗警察日常捉大賊。\n香港警察以AI生成模仿《GTA》遊戲封面的圖片，提醒市民現實生活中的違法行為，不能像《GTA》一樣，消除通緝星級或重新讀取存檔。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8da5106b0f","title":"有片｜將軍澳廣場天降垃圾桶 男途人險擊中淡定離開 目擊者：爭唔夠一米就中","url":"https://www.stheadline.com/breaking-news/3639028/有片將軍澳廣場天降垃圾桶-男途人險擊中淡定離開-目擊者爭唔夠一米就中","summary":"高空墮物隨時對途人造成嚴重傷亡。","summary_short":"高空墮物隨時對途人造成嚴重傷亡。","digest":"高空墮物隨時對途人造成嚴重傷亡","points":["高空墮物隨時對途人造成嚴重傷亡","今日（19日）有網民於社交平台Threads上載一段車cam片…","男途人見到有垃圾桶從高處墮下，未有太震驚，反而繼續向前走，離開現場"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:24:55+08:00","size":1,"keywords":[],"body":"高空墮物隨時對途人造成嚴重傷亡。今日（19日）有網民於社交平台Threads上載一段車cam片，片中顯示時間為今午5時04分，一個垃圾桶突然從天而降，跌在將軍澳廣場近停車場入口，當時垃圾桶降落的位置僅離一名身穿淺色上衣的男途人只有半個身位，場面非常驚險。男途人見到有垃圾桶從高處墮下，未有太震驚，反而繼續向前走，離開現場。\n片主形容事件驚險，指男途人「爭唔夠一米就中」，質疑為何會有垃圾桶從高處墮下。多名網民笑言該名男途人為「淡定哥」，指他今次「執返身彩」，「個男人情緒好穩定」、「鎮定到呢…. 好似唔關佢事一樣」、「好彩人無事」、「真係大癲垃圾桶都掟得落嚟，嗰個男人真係執返身彩」、「防不勝防」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c36b3eeeff9","title":"八分鐘本地新聞重點｜鄺港智作供／二手名牌手袋店疑結業／樓價走勢分析","url":"https://news.tvb.com/tc/1207328-八分鐘本地新聞重點鄺港智作供二手名牌手袋店疑結業樓價走勢分析","summary":"【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人，蔡天鳳丈夫譚方駿鍾意自己，曾經買米線向他示愛。又形容與蔡天鳳關係複雜、難以解釋。","summary_short":"【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人…","digest":"【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】大埔龍尾村蔡天鳳肢解案續審…","points":["【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】","大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人，蔡天鳳丈夫譚方駿鍾意自己…","女瑜伽導師2022年倒斃在油麻地酒店房間，身中42刀，前男友被裁定謀殺罪罪成"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:19+08:00","size":1,"keywords":[],"body":"【蔡天鳳碎屍案｜鄺港智作供稱譚方駿曾買米線示愛】\n\n大埔龍尾村蔡天鳳肢解案續審，前夫鄺港智首次出庭作供，提及控方證人，蔡天鳳丈夫譚方駿鍾意自己，曾經買米線向他示愛。又形容與蔡天鳳關係複雜、難以解釋。\n\n【女瑜伽導師倒斃酒店案　前男友謀殺罪罪成聞判後表現冷靜】\n\n女瑜伽導師2022年倒斃在油麻地酒店房間，身中42刀，前男友被裁定謀殺罪罪成。\n\n【兩間售賣二手名牌手袋店疑結業　警接逾三百人報案涉款近4200萬】\n\n兩間售賣二手名牌手袋店舖懷疑結業。截至傍晚六時，警方接獲逾300名市民報案，涉款近4,200萬元。有立法會議員提醒，市民若要寄賣、要貨比三家。\n\n【住得樂｜分析認為外圍利率趨升　二手樓價或要回調半成】\n\n十大指標屋苑，首10個月交投跌近百分之8，有分析認為外圍利率趨升，二手樓價或要回調半成。\n\n【蘇黎世保險(香港)疑發生資料外洩】\n\n蘇黎世保險(香港)懷疑發生資料外洩，涉近4萬人姓名、身份證及護照號碼等個人資料。\n\n【天氣｜預測明日市區最低約14度】\n\n天文台再下調明天氣溫預測，市區最低約14度。","image":"https://pro-vod-cdn.tvb.com/924faf4f66434ceda6c2887610907044/snapshots/608c54976b274bf197c859e9f352de87-00008.jpg","video":"https://pro-vod-cdn.tvb.com/924faf4f66434ceda6c2887610907044/03d6766919d241cda0773e185059dd34-e44ea555837d98242acf4841ee045513-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/924faf4f66434ceda6c2887610907044/snapshots/608c54976b274bf197c859e9f352de87-00008.jpg","lang":"zh-Hant"},{"id":"c33724df237","title":"警搜藍田住宅及油塘工廈單位檢$57萬毒品 4男女被捕最細得17歲","url":"https://www.stheadline.com/breaking-news/3639021/警搜藍田住宅及油塘工廈單位檢57萬毒品-4男女被捕最細得17歲","summary":"觀塘警區特別職務隊人員經深入調查 休憩區","較開價貴約6倍，由黃廷方慈善基金及大澳文物酒店投得，將改建為休憩區，給遠足者及遊客使用…","石屋群位於大東山，共22間，當初用作華南基督教傳教士的避暑營地，至今有近百年歷史"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T21:53+08:00","size":1,"keywords":[],"body":"大嶼山大東山爛頭營3號石屋，由信和置業家族旗下基金等，以288萬元投得，將用作遠足休憩區。\n\n較開價貴約6倍，由黃廷方慈善基金及大澳文物酒店投得，將改建為休憩區，給遠足者及遊客使用，並提供自動販賣機、售賣港式涼茶及朱古力熱飲等。\n\n石屋群位於大東山，共22間，當初用作華南基督教傳教士的避暑營地，至今有近百年歷史。\n\n今次拍賣的3號石屋，建築面積約2,500平方呎，屬群內面積最小，沒水電供應，而上一手業主，是香港電影導演翁維銓。","image":"https://pro-vod-cdn.tvb.com/5674c3a9ef774335b70e4079b00642d0/snapshots/d355aae1a58d416191d6f9fe23e0dddc-00003.jpg","video":"https://pro-vod-cdn.tvb.com/5674c3a9ef774335b70e4079b00642d0/450d22efd1434ceaa1af47d6f592cca9-5f91ce22139c84dd22cdd7522eeb6af6-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/5674c3a9ef774335b70e4079b00642d0/snapshots/d355aae1a58d416191d6f9fe23e0dddc-00003.jpg","lang":"zh-Hant"},{"id":"c01f51d7187","title":"樂施毅行者明開跑 視障跑手夥隊友挑戰100公里 盼證明殘障亦能創佳績","url":"https://www.stheadline.com/society/3639001/樂施毅行者明開跑-視障跑手夥隊友挑戰100公里-盼證明殘障亦能創佳績","summary":"年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里，如此高難度的比賽常人尚覺艱難，卻有視障人士和聽障人士勇於挑戰。","summary_short":"年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里…","digest":"年度大型遠足籌款活動「樂施毅行者」明起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑…","points":["年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行…","視障跑手朱健驊今年與隊友組成「猛龍長跑隊」參加活動，他接受《星島頭條》訪問時表示…","退役三項鐵人運動員 花一年半時間準備比賽"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:51:23+08:00","size":1,"keywords":[],"body":"年度大型遠足籌款活動「樂施毅行者」明（20日）起舉行，參加者需四人一隊於48小時內橫跨麥理浩徑，路線全長共100公里，如此高難度的比賽常人尚覺艱難，卻有視障人士和聽障人士勇於挑戰。視障跑手朱健驊今年與隊友組成「猛龍長跑隊」參加活動，他接受《星島頭條》訪問時表示，運動讓他更樂於表達自我，希望自身經驗能讓更多人知道，殘障人士也能在運動中取得成績，也能擁有豐富運動體驗。\n退役三項鐵人運動員 花一年半時間準備比賽\n朱健驊本身是退役三項鐵人運動員，如今僅有一成視力，在香港傷健共融網絡的組織下，與聽障跑手崔霞，以及兩名健全領跑員黃婉琪和姚永聰組成「猛龍長跑隊」，挑戰「樂施毅行者」100公里項目。朱健驊透露，為了挑戰如此高難度的活動，他花了一年半時間準備，做了很多山路實地練習和體能練習，也培養了和領跑員及隊友之間的默契。\n朱健驊患有先天性青光眼，從小較為多病，當時醫生建議他多做運動改善身體，他便開始接觸游泳，之後陸續嘗試長跑、三項鐵人、越野跑和HYROX等，更成為了專業三項鐵人運動員。數年前，朱健驊的視力急遽衰退，他因而選擇退役，希望以業餘身份繼續留在運動領域，「樂施毅行者」便是他參加的其中一個活動。\n領跑員笑言是「氣氛擔當」 幫視障隊友口述影像\n「猛龍長跑隊」隊友間以暱稱互稱，隊友叫他「朱仔」，他則以「琪琪」稱呼領跑員黃婉琪。領跑員與視障人士拍檔時，要以口述影像的方式向視障跑手描述周遭環境。雖然練習過程長達一年半，但朱仔笑言每一次與隊友練習都很開心，他尤其讚賞領跑員琪琪，因她在口述影像之餘還會和拍檔聊天，活絡氣氛。黃婉琪亦有接受訪問，聞此笑言「氣氛擔當好重要」，因視障人士行山時看不見風景或覺沉悶，故她會不斷幫隊友腦補畫面，例如周圍的人事物和風景等，希望視障人士在行山時，全部的感官都能參與其中。\n琪琪的口述影像不止仔細準確，更加入風趣比喻。朱仔也對琪琪的風趣幽默印象深刻，更表示自己參加過這麼多次行山比賽，最難忘的都是和領跑員或隊友的相處時光。他曾與琪琪拍檔參加過一場港島路線的50公里越野賽，期間發生過一個小插曲：當時朱仔和琪琪正在下山，視障人士下山速度本身較慢，山路後面便聚集起了不少等著下山的跑手，琪琪見此就向朱仔開玩笑，「哇，後面好多牛牛啊」。朱仔表示，自己下山時需高度專注，有時會心急，怪自己走得慢，但琪琪的比喻讓他放鬆不少。如今朱仔受訪時重新講述這個故事，也和琪琪一起邊講邊笑。\n領跑員最重要細心、觀察能力強\n黃婉琪做領跑員已有八九年時間，當初是覺得做領跑員既可貢獻社會，又可跑步減肥，便開始學習成為領跑員。她認為做領跑員最重要的是細心和觀察能力，除了周圍環境，還要用心去感受拍檔需要甚麼。黃婉琪舉例指，不同視障運動員的視覺缺損程度都不一樣，要事前先問清楚；而先天失明的跑手，身體平衡感往往與後天失明的人相比較差，這些細節都要多加留意。\n黃婉琪和許多視障拍檔合作過，觀察到視障運動員對每一次訓練都非常珍惜。她笑言，若約身體健全朋友行山，對方有可能遲到或臨時爽約，但視障朋友不但不會這樣，還會提前詢問她需要準備什麼，問清楚集合地點時間等。朱仔聞此亦十分同意，指自己作為運動員的觀念是，每次訓練都是為了日後比賽，所以次次都彌足珍貴；此外，領跑員犧牲私人休閒時間，放棄和朋友玩樂的機會，特地抽出時間陪他們訓練，這份心意也值得好好珍惜。\n視障充當聽障「耳仔」 目標30小時內完賽\n香港傷健共融網絡經理（運動康復及籌款）Fiona表示，猛龍長跑隊既有視障跑手，也有聽障跑手，有時視障跑手可充當聽障跑手的「耳仔」，若隊伍後面有跑手希望「爬頭」並大喊通知前方跑手，視障跑手便會拍一拍聽障隊友肩膀作通知。她續指，香港傷健共融網絡多年來組織過不少傷健共融隊伍參加不同運動項目或比賽，每一次大型賽事，機構都會設後方支援隊，除了幫助領跑員處理突發狀況外，也會為跑手送上食物和衣物等補給，讓隊員在夜間路段補充體力，添上厚衣，再繼續上路。\n\n黃婉琪表示，今年比賽前，「猛龍長跑隊」已參加各種活動及賽事來磨合和練習，有信心可跑出不錯的成績，目標是30小時以內完成路線。朱健驊表示，本次100公里路線是他挑戰過最長的行山路線，雖有些緊張，但更多是興奮及開心。「最重要是好好享受比賽，感受沿途路況，把過去訓練學到的技術實際運用出來。」\n朱健驊續指，運動已成為他人生的一部分，不但能保持健康，更可拓展他內心的視野。「心態變得開闊，就更願意說出自己的困難，也願意和更多人分享自己的心路歷程，讓大家知道，原來殘障人士也能在運動當中取得成績，而且也能擁有豐富的運動體驗。」談及傷殘帶來的影響，朱健驊坦言，不論是先天殘障抑或後天殘障的人士，很多人遇到這樣的狀況便會不想面對。「但很多事情如果你願意面對，就會更加能夠堅持，只要堅持下去，就會出現很多不同的結果。」除了勉勵同行人，他也希望未來能有更多健全人士接納殘障人士的需求，理解他們面對的困難，並給予更多嘗試機會，讓他們獲得更多體驗，拓闊視野。\n記者：周育瑩","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6005ce5850","title":"深圳APEC︱外媒首訪中國讚深圳「超乎想像」 亞美尼亞記者因「The Weeknd」新歌冀遊覽香港","url":"https://www.stheadline.com/politics/3638997/深圳APEC外媒首訪中國讚深圳超乎想像-亞美尼亞記者因The-Weeknd新歌冀遊覽香港","summary":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。","summary_short":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。","digest":"2026年亞太經合組織第33次領導人非正式會議最後一天在深圳舉行","points":["2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行","今次APEC會議周共有近5000名中外記者註冊報道，當中不少是初次到訪中國或深圳","《星島頭條》記者趁最後一天，在新聞中心採訪幾位分別來自俄羅斯、亞美尼亞及納米比亞的外媒記者"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:43:44+08:00","size":1,"keywords":[],"body":"2026年亞太經合組織（APEC）第33次領導人非正式會議今日（19日）最後一天在深圳舉行。今次APEC會議周共有近5000名中外記者註冊報道，當中不少是初次到訪中國或深圳。《星島頭條》記者趁最後一天，在新聞中心採訪幾位分別來自俄羅斯、亞美尼亞及納米比亞的外媒記者。他們分享時不謀而合地讚嘆中國科技非常先進，美食很多元化，以及熱情好客的款待文化。談到香港，各人都表示認識且冀將到訪，亞美尼亞記者表示知道深港兩地很靠近，更指最近聽過歌手The Weeknd新歌《Hong Kong》，自己也因此很希望能遊覽香港。\n亞美尼亞記者：重慶麻辣顛覆認知 盼用《Hong Kong》拍片遊港\n亞美尼亞記者Diana數月前已抵中國進行採訪，坦言來華前對中國並無過多期望，然而這次旅程卻徹底打破她的刻板印象，對中國在高速現代化發展的同時，卻能保留傳統建築與文化表示敬佩。Diana分享，最喜歡的城市前三名分別是重慶、上海與深圳。她指重慶立體的城市景觀與璀璨夜景讓她大開眼界。她又指，重慶「麻辣」更徹底顛覆她對辣度的認知「之前我以為自己挺能吃辣；去過重慶之後，我才發現自己根本不懂什麼叫『辣』。」不過，她亦很欣賞這種圍爐共食、不看手機、專注聊天互動的用餐儀式「非常有人情味」。\n在深圳，她則嘗試燒賣和餃子等點心，稱感到十分驚喜。談及香港，她不僅渴望前往旅遊，還分享一個冷知識，指中環遮打道（Chater Road）是以亞美尼亞裔企業家Sir Paul Chater命名。她又指，知道加拿大歌手The Weeknd有一首新歌《Hong Kong》在網上非常熱門，自己也因此很想將來去到香港時，仿傚其他人用這首歌作配樂，分享遊覽香港的片段至社交平台。\n俄媒讚華強北「迷你高仿iPhone」 指深圳數字化超想像\n來自俄羅斯的Ilya Novikov曾於2023年到訪上海，卻是首次踏足深圳。他形容深圳給他的第一印象是「太不可思議了！」在深圳的兩天裡，他與同事一直在拍攝這座城市，特別提到南山區的景觀很美，指高樓林立、科技感亦十足。他們還參觀前海灣，體驗前沿的AI眼鏡、又到華強北參觀，笑言見到迷你版的高仿iPhone（barbie size iPhone），形容「It’s very cool」。同樣是首次到訪深圳、他的同事Dmitry Gavrilov則感嘆，深圳規模之大、城市之乾淨、數字化程度之高，均超乎他的想像。他大讚深圳市民熱情友好，在談到中西文化差異時，Gavrilov認為不應盲目比較東西方文化，指兩者雖截然不同，但也正因如此，兩者都非常美麗和獨特。\n納米比亞記者驚嘆深夜物流與AI生活 讚新聞中心設備完善\n來自納米比亞廣播公司的記者Rousa則是第二次來到深圳，她形容每次到訪都會被這裡無處不在的科技深深震撼。「AI雪糕機、AI咖啡機，無人機外賣」，指科技真的讓生活變得太便利，認為是展現「爭分奪秒」精神。Rousa又留意到，即使在凌晨2時，深圳依然有大量物流人員忙碌地為拼多多、淘寶等電商平台打包快件。她指這種高效社會節奏，以及高度普及的無現金交易方式，讓她深感敬佩，希望非洲大陸未來也能實現。\n作為與會記者，Rousa對本屆APEC新聞中心給予高度評價，認為設備非常完善，為國際媒體報導提供了極大便利。儘管在網絡上傳方面偶有延遲，但她表示各國記者之間互幫互助、交流採報經驗，形容是一次無與倫比的「人生體驗」，她會將這些寶貴的中國故事與採訪經驗帶回納米比亞。\n記者：陳俊豪、攝影：蘇正謙 深圳報道","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf3205505ea","title":"七旬翁偕友西貢深涌踩單車暈倒墮地 直升機送院搶救","url":"https://www.stheadline.com/breaking-news/3638973/七旬翁偕友西貢深涌踩單車暈倒墮地-直升機送院搶救","summary":"今日（19日）下午4時許，一名71歲姓戴男子與兩名單車友由西沙GO PARK踩
