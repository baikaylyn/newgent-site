許，一名47歲男子在上海街251號對開街頭突然暈倒，同行朋友見狀報案。救護員接報趕抵現場，證實事主當場死亡，死因有待驗屍後確定。 據了解，男事主為尼泊爾裔，持有香港身分證，事發前曾感到身體不適。警方正跟進事件，確實死因有待法醫驗屍後進一步確認。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":43,"items":[{"id":"ca4e9d336ac","title":"（深圳APEC）亚太经合组织互联互通蓝图发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml","summary":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。","summary_short":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。","digest":"亚太经合组织互联互通蓝图19日发布","points":["中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布","蓝图强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长","以《2040年亚太经合组织布特拉加亚愿景》为指引，朝着建设开放、活力、强韧…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T23:57:46+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 亚太经合组织互联互通蓝图19日发布。蓝图强调，互联互通促进本地区商品、服务、资金和人员流动，有助于密切经济联系、推动长期经济增长；以《2040年亚太经合组织布特拉加亚愿景》为指引，朝着建设开放、活力、强韧、和平的亚太共同体迈进，实现亚太人民和子孙后代的共同繁荣。\r\n\n　　在“硬联通”方面，蓝图指出，目标是鼓励各经济体通过创新和应用现代技术建设、维护并升级高质量基础设施，提升硬联通水平。加强陆上、海上、航空互联互通，通过交通联接提升区域互联互通水平。推动交通运输领域创新与数字化转型，探索安全可靠的自动驾驶、无人技术等新兴出行解决方案，开展自愿知识交流，分享相关经验和良好实践，以提升对新兴技术的适应能力。\n\n　　在“软联通”方面，蓝图表示，目标为鼓励各经济体减少制度性壁垒，促进贸易和投资，推动建立更加紧密的区域经济。通过技术与创新、边境机构合作、适当的查验、自动化风险管理以及简化通关手续，推动海关程序现代化。取消贸易投资领域“边境后”壁垒，简化相关程序，提升效率、营商便利度、生产率和竞争力。\n\n　　在“心联通”方面，蓝图说，目标是通过促进商务人员流动，以及教育、旅游、人力资源开发和创新合作，加强惠及所有人的互联互通。促进商务人员流动，用好亚太经合组织商务旅行卡，鼓励商旅卡计划正式成员经济体接纳和使用亚太经合组织虚拟商务旅行卡。肯定应对非正常移民流动的重要性。加强教育、职业培训、技能提升等领域交流，探索科研人员流动，支持终身学习。\n\n　　在实施方面，蓝图表示，鼓励各经济体根据各自情况通过亚太经合组织现有工作机制，进一步推进区域互联互通。也鼓励同相关利益攸关方开展跨机制协作。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）亚太经合组织互联互通蓝图发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml","source_display":"中國新聞網","published_at":"2026-11-19T23:57:46+08:00","category":"內地","digest":"亚太经合组织互联互通蓝图19日发布"},{"title":"亚太经合组织互联互通蓝图","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734972.shtml","source_display":"中國新聞網","published_at":"2026-11-19T22:51:24+08:00","category":"內地","digest":"亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务…"},{"title":"亚太经合组织互联互通蓝图","url":"https://www.jiemian.com/article/15352436.html","source_display":"界面新聞","published_at":"2026-11-19T22:48:58+08:00","category":"","digest":"亚太经合组织互联互通蓝图  我们强调，互联互通促进本地区商品、服务、资金和人员流动…"}],"cross":{"total":3,"angles":[{"point":"亚太经合组织互联互通蓝图  　　我们强调，互联互通促进本地区商品、服务…","sources":["中國新聞網","界面新聞"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734972.shtml"},{"point":"亚太经合组织互联互通蓝图19日发布","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734984.shtml"}]}},{"id":"c44445f9184","title":"（深圳APEC）2026年亚太经合组织领导人深圳展望发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734961.shtml","summary":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。","summary_short":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。","digest":"2026年亚太经合组织领导人深圳展望19日发布","points":["展望重申，亚太经合组织是区域经济合作的首要平台，将遵循自主自愿…","展望表示，将继续以市场驱动的方式，包括通过落实亚太自由贸易区相关议程，推进亚太区域经济一体化","亚太自由贸易区议程在提升各经济体参与高标准、综合性区域自贸安排的能力方面发挥着重要作用"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:37:01+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 2026年亚太经合组织领导人深圳展望19日发布。展望重申，亚太经合组织是区域经济合作的首要平台，将遵循自主自愿、非约束性和协商一致的合作原则，致力于将亚太经合组织打造成一个更加现代、高效、务实的理念孵化器。\r\n\n　　展望表示，将继续以市场驱动的方式，包括通过落实亚太自由贸易区相关议程，推进亚太区域经济一体化。亚太自由贸易区议程在提升各经济体参与高标准、综合性区域自贸安排的能力方面发挥着重要作用。\n\n　　展望说，认识到数字化对驱动本地区创新、促进生产力和经济增长的重要作用，及其对促进贸易的积极作用。将继续促进贸易便利化，包括通过实施无纸化贸易和跨境电子商务等措施。\n\n　　展望表示，在现有进展基础上，核可《亚太经合组织互联互通蓝图》，鼓励各经济体继续努力，通过进一步夯实“硬联通”、“软联通”、“心联通”三大支柱，实现无缝、全面联通和融合亚太。\n\n　　展望称，鼓励各经济体推进数字互联互通，弥合社会各阶层以及城乡区域间的数字鸿沟，加强可及、有韧性的数字基础设施建设，推动数字转型，促进经济增长，提升数字素养与技能，推进数字平台建设。\n\n　　展望指出，支持推动关键领域的数字和新兴技术转型，利用数字和新兴技术改善公共服务，包括加强医疗卫生体系建设，为企业营造有利的发展环境，推广以市场为导向、以创新为驱动的做法，并为中小微企业提供可及的数字工具以赋能其发展。\n\n　　展望强调，应该帮助劳动者为未来工作做好准备，以把握技术进步带来的益处，并根据《亚太经合组织应对人口结构变化框架合作文件》应对人口结构变化。\n\n　　展望称，寻求加强跨能源部门和跨技术的综合安全，共同应对能源安全挑战，确保不间断、可依赖、可负担和可持续地获取能源，以支撑经济繁荣。鼓励围绕供应链韧性、基础设施互联互通、风险评估加强能源安全协作。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）2026年亚太经合组织领导人深圳展望发布","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734961.shtml","source_display":"中國新聞網","published_at":"2026-11-19T22:37:01+08:00","category":"內地","digest":"2026年亚太经合组织领导人深圳展望19日发布"},{"title":"2026年亚太经合组织领导人深圳展望 建设亚太共同体，促进共同繁荣","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734929.shtml","source_display":"中新網 時政","published_at":"2026-11-19T21:14:01+08:00","category":"內地","digest":"2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  　　我们…"},{"title":"2026年亚太经合组织领导人深圳展望","url":"https://www.jiemian.com/article/15352335.html","source_display":"界面新聞","published_at":"2026-11-19T21:12:53+08:00","category":"","digest":"2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  我们…"}],"cross":{"total":3,"angles":[{"point":"2026年亚太经合组织领导人深圳展望  建设亚太共同体，促进共同繁荣  　　我们…","sources":["中新網 時政","界面新聞"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734929.shtml"},{"point":"2026年亚太经合组织领导人深圳展望19日发布","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734961.shtml"}]}},{"id":"cf3f9809119","title":"深圳APEC︱4點和平宣言明確推進議程 美失國際權力獨佔優勢︱拆局","url":"https://www.stheadline.com/realtime-china/3639154/深圳APEC4點和平宣言明確推進議程-美失國際權力獨佔優勢拆局","summary":"北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示，這份三方和平宣言的核心亮點，在於三方明確了後續協同推進的共同議程，4項內容各有側重。","summary_short":"北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示，這份三方和平宣言的核心亮點…","digest":"北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示…","points":["北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示，這份三方和平宣言的核心亮點…","第一，核風險對話打開了新的合作入口","宣言重申「核戰爭打不贏也打不得」，並明確三國將開展減少核風險、防止核擴散的對話…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:39:41+08:00","size":1,"keywords":[],"body":"北京清華大學戰略與安全研究中心副研究員孫成昊對《星島》表示，這份三方和平宣言的核心亮點，在於三方明確了後續協同推進的共同議程，4項內容各有側重。第一，核風險對話打開了新的合作入口。宣言重申「核戰爭打不贏也打不得」，並明確三國將開展減少核風險、防止核擴散的對話，達成核風險管控相關承諾。但此次尚未涉及核武器數量削減，後續對話機制的落實情況，仍待觀察。\n相關新聞：深圳APEC︱中美俄會談締歷史共推《和平宣言》 習近平：做夥伴不搞對抗\n能源合作聯繫各國企業民眾利益\n第二，能源合作直接回應現實經濟壓力。宣言提出增加精煉石油產品的生產和供應，並重申能源穩定流動的重要性。這使三方協調同各國企業和民眾的利益聯繫起來。後續看點是能否明確供應安排，讓能源安全合作產生收益。\n第三，聯合國仍是三國協調的重要共同基礎。宣言以安理會常任理事國的責任為出發點，提出推動聯合國改革、提高其應對全球挑戰的能力。「我的理解是三國希望通過改善現有機制發揮作用。能否在具體議題上加強合作、爭取其他成員支持，將是下一步值得觀察的。」孫成昊說。\n相關新聞：深圳APEC‧直擊｜熱情民眾無懼封路聚香蜜公園遠眺打卡 「如當年辦京奧般振奮」\n第四，國際司法條款體現了三方特定的利益交集。關於國家同意、官員豁免及防止國際刑事法院濫用管轄權的表述，反映三國對主權和國際司法權限的共同關切。它也說明三方能夠圍繞具體議題協調立場。\n海南大學國際傳播與藝術學院教授畢研韜對《星島》分析，中俄美三國對於本次會晤的目標預期各有側重：美國關注核軍控等議題，俄羅斯冀透過三方溝通改善外交處境，中國則聚焦大國關係的戰略穩定與全球和平。三方均有傳遞自身立場的需要，既存在競爭，亦致力防範衝突升級。這場會晤本身已是重大突破，兼具象徵與實質意義，中國作為東道主妥善擔當角色，作出具有歷史意義的貢獻。\n相關新聞：深圳APEC．有片｜習近平特朗普扶梯上互助「挽手」畫面熱傳\n西方憂中國成國際規則參與者\n畢研韜指出，國際權力格局正由美國獨佔優勢，逐漸轉向多個大國共同發揮影響力，這也是西方憂慮所在。對美國來說，較難接受的並非中國實力提升，而是自身不再擁有單方面主導國際事務的能力。二戰之後，美國連同盟友主導國際政經制度搭建，西方在不少核心規則的制訂上握有話語權。\n畢研韜指出，隨着中國綜合實力抬升，客觀上需要在全球事務中取得與自身實力、國際責任相匹配的角色。中國參與全球治理改革、推動多邊合作，推出多項國際倡議。西方擔心中國由過往國際規則的接受者，轉為規則共建參與者，繼而牽動全球制度的權力分配，動搖西方長期享有的制度優勢。駐京記者 楊浚源","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb07c0698d7","title":"深圳APEC︱中美俄會談締歷史共推《和平宣言》 習近平：做夥伴不搞對抗","url":"https://www.stheadline.com/realtime-china/3638877/深圳APEC中美俄會談締歷史共推和平宣言-習近平做夥伴不搞對抗","summary":"APEC CHINA 2026 亞太經合組織（APEC）峰會昨在深圳結束後，中美俄元首舉行史上首次三方會晤，會後發表4點《和平宣言》，包括推動聯合國改革，維護國際和平與安全，計劃增加石油產量…","summary_short":"APEC CHINA 2026 亞太經合組織（APEC）峰會昨在深圳結束後，中美俄元首舉行史上首次三方會晤…","digest":"APEC CHINA 2026 亞太經合組織峰會昨在深圳結束後…","points":["APEC CHINA 2026 亞太經合組織（APEC）峰會昨在深圳結束後…","習近平強調，「大國和則世界安，大國鬥則世界亂」，中俄美作為世界主要大國，應該當好表率…","他相信今次三方會晤「播下的種子，必將生根發芽、開花結果"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:00:14+08:00","size":1,"keywords":[],"body":"APEC CHINA 2026 亞太經合組織（APEC）峰會昨在深圳結束後，中美俄元首舉行史上首次三方會晤，會後發表4點《和平宣言》，包括推動聯合國改革，維護國際和平與安全，計劃增加石油產量，並就減少核風險進行對話等。習近平強調，「大國和則世界安，大國鬥則世界亂」，中俄美作為世界主要大國，應該當好表率，「做夥伴、做朋友，不衝突、不對抗」，堅持對話協商，換位思考，特別是不能觸碰對方的底線。他相信今次三方會晤「播下的種子，必將生根發芽、開花結果。」\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n會晤昨午以圓桌會方式在深圳麒麟山莊舉行，主持會議的習近平坐在中間，特朗普及普京分別坐在習近平左邊及右邊。在開放媒體拍攝時段，三國元首先後發表講話，接着舉行閉門會議。新華社報道，三方就烏克蘭危機、防止核武器擴散、中東局勢、朝鮮半島等問題交換了意見。\n重申核戰爭打不贏也打不得\n會後，新華社公布《中俄美元首和平宣言》：一、致力於推動聯合國改革，使之更有效應對全球性挑戰，維護國際和平與安全。二、三國計劃增加精煉石油產品的生產和供應，重申能源穩定流動的重要性。三、尊重國家官員享有豁免至關重要，一致認為國際刑事法院以及其他類似機構不得濫用管轄權。四、重申核戰爭打不贏也打不得。三國將就減少核風險、防止核擴散進行對話。\n相關新聞：深圳APEC︱特朗普晤習近平 表態：美國不支持「台獨」\n習近平指出，中俄美三國最高領導人有史以來首次聚首，具有開創性意義。80多年前，中俄美三國並肩奮戰，為世界贏得和平和安寧。當前，世界百年變局加速演進，天下並不太平。中俄美作為主要大國和聯合國安理會常任理事國，應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定。\n「大國和則世界安，大國鬥則世界亂。」習近平指出，中俄美三國國情不同，要尊重彼此主權和領土完整，堅持不干涉別國內政，在涉及對方的重大敏感問題上，要提前溝通、換位思考、謹慎行事，特別是不能觸碰對方的底線。他說，「修昔底德陷阱」絕不是宿命，中俄美要做夥伴、做朋友，不衝突、不對抗，保持常態化高層交往，暢通各層級對話渠道，建立危機溝通和預防機制，確保誤判少發生、分歧管得住、摩擦不升級。\n相關新聞：深圳APEC︱特朗普晤習近平 稱「美中同盼俄烏伊朗止戰」\n保持常態化交往 不能觸碰底線\n普京表示，感謝中方安排這次歷史性會晤，俄方願同中美相互尊重、平等對話、和平共處、妥處分歧，促進自由開放的國際貿易，維護能源、糧食安全，加強人工智能治理國際合作，共同為世界和平安全作出貢獻。特朗普表示，三國元首會晤創造了歷史。三國都是有核國，對維護世界和平穩定負有特殊重要的責任。三方應共同防止核擴散，避免核武器給人類帶來災難。\n普京昨晚在深圳召開記者會說，三方會晤的形式是成功的，三國領導人進行了「坦率」且「非常有益」的討論，不排除今後以其他形式就某些問題作出決定的可能。特朗普昨晚已乘坐「空軍一號」專機離開深圳，中共政治局委員、外長王毅前往送機。\n普京：三國領導人進行坦率討論\n王毅其後在APEC新聞中心舉行記者會，這是三國元首歷史上首次舉行會晤，意義重大，影響深遠，是載入史冊的標誌性事件。會晤氣氛坦誠友好，富有建設性。王毅表示，世界百年變局加速演進，各種風險挑戰層出不窮，中方將與俄美兩國全面高效落實會晤共識，並透過工作層面保持溝通協調，共同朝着建設更美好的世界，作出不懈努力。\n中俄美元首和平宣言\n1.致力推動聯合國改革，使之更有效應對全球性挑戰，維護國際和平與安全。\n2.三國計劃增加精煉石油產品的生產和供應，重申能源穩定流動的重要性。\n3.尊重國家官員享有豁免至關重要，一致認為國際刑事法院以及其他類似機構不得濫用管轄權。\n4.重申核戰爭打不贏也打不得。三國將就減少核風險、防止核擴散進行對話。\n《星島》中國組","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3a6837598b","title":"强化对党忠诚教育（学习贯彻党的二十届五中全会精神）","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735003.shtml","summary":"王小洪  　　对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求。","summary_short":"王小洪  　　对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求。","digest":"王小洪  　　对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求","points":["对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求","党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》…","我们要深刻认识强化对党忠诚教育的重要意义，找准着力点、切入点，增强针对性、实效性…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:50:00+08:00","size":1,"keywords":[],"body":"王小洪\n\n　　对党忠诚是共产党人首要的政治品质，也是党章对党员的基本要求。党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，立足新形势新任务对全面从严治党提出的新要求，就强化对党忠诚教育作出重要部署。我们要深刻认识强化对党忠诚教育的重要意义，找准着力点、切入点，增强针对性、实效性，教育引导全体党员、干部永葆对党忠诚的政治本色。\n\n　　一、深入学习领会习近平总书记关于对党忠诚和强化对党忠诚教育的重要论述\n\n　　党的十八大以来，习近平总书记围绕对党忠诚和强化对党忠诚教育作出一系列重要论述，丰富和发展了马克思主义建党学说，为我们做好相关工作指明了方向、提供了根本遵循。关于重要意义，习近平总书记指出，“党的事业，人民的事业，是靠千千万万党员的忠诚奉献而不断铸就的”，强调“如果没有对党忠诚作政治上的‘定海神针’，就很可能在各种考验面前败下阵来”。关于深刻内涵，习近平总书记指出，“对党忠诚，不是抽象的而是具体的，不是有条件的而是无条件的，必须体现到对党的信仰的忠诚上，必须体现到对党组织的忠诚上，必须体现到对党的理论和路线方针政策的忠诚上”，强调“对党忠诚，就要增强‘四个意识’、坚定‘四个自信’、做到‘两个维护’，严守党的政治纪律和政治规矩，始终在政治立场、政治方向、政治原则、政治道路上同党中央保持高度一致”。关于实践要求，习近平总书记指出，“对党忠诚，必须一心一意、一以贯之，必须表里如一、知行合一，任何时候任何情况下都不改其心、不移其志、不毁其节”，强调要“以坚定的理想信念砥砺对党的赤诚忠心”，“自觉做到党中央提倡的坚决响应、党中央决定的坚决照办、党中央禁止的坚决不做”。关于对党忠诚教育，习近平总书记强调，“新形势下，要大力加强对党忠诚教育”，“我们培养优秀年轻干部，千条万条，第一条就是教育他们对党忠诚”，“党员领导干部要把对党忠诚纳入家庭家教家风建设，引导亲属子女坚决听党话、跟党走”。对这些重要论述，我们要深入学习领会、坚决贯彻落实。\n\n　　二、充分认识强化对党忠诚教育的重要性\n\n　　新征程上，强化对党忠诚教育，对于全党更加紧密地团结在以习近平同志为核心的党中央周围，凝聚起以中国式现代化全面推进强国建设、民族复兴伟业的智慧和力量，具有十分重要的意义。\n\n　　(一)强化对党忠诚教育是传承党百年奋斗宝贵经验的必然要求。我们党自成立起，就把强化对党忠诚教育作为重中之重。新民主主义革命时期，我们党强调“忠心耿耿地为民族、为阶级、为党而工作”。社会主义革命和建设时期，我们党把“对党忠诚老实”作为党员的基本义务，着力培养既懂政治又懂业务、又红又专的干部。改革开放和社会主义现代化建设新时期，我们党按照革命化、年轻化、知识化、专业化的标准加强干部教育，对党忠诚始终是重要内容。新时代以来，以习近平同志为核心的党中央把对党忠诚教育摆在更加突出的位置，持续开展集中教育和经常教育，把党的团结统一推到了新高度。历史充分证明，加强忠诚教育、夯实忠诚根基，是我们党100多年奋斗的宝贵经验，也是我们党始终走在时代前列的精神密码，必须一以贯之地传承好、发扬好。\n\n　　(二)强化对党忠诚教育是坚持和加强党中央集中统一领导的必然要求。坚持和加强党中央集中统一领导，是做好一切工作的根本保证。随着改革开放不断深入，社会利益多元化、思想多样化深刻影响到党员、干部的观念和行为，破坏党的团结统一、影响党的凝聚力和战斗力的现象依然存在，背离党中央集中统一领导的问题时有发生。只有强化对党忠诚教育，才能把全党思想和行动统一到以习近平同志为核心的党中央决策部署上来，确保党的领导一贯到底、党中央政令畅通，形成万众一心、无坚不摧的磅礴力量。\n\n　　(三)强化对党忠诚教育是锻造堪当民族复兴重任的高素质干部队伍的必然要求。好干部标准有千万条，对党忠诚老实是第一条。当前，党的队伍主流是好的，但思想不纯、组织不纯、作风不纯问题尚未根本解决，少数党员、干部包括高级干部仍存在“假忠诚”、“伪忠诚”的问题，给党内政治生态、党和人民事业造成严重危害。只有强化对党忠诚教育，引导党员、干部砥砺对党的赤诚忠心，树立正确世界观、人生观、价值观和事业观、政绩观、权力观，做到为党分忧、为国尽责、为民奉献，才能确保党不变质不变色不变味。\n\n　　(四)强化对党忠诚教育是推进强国建设、民族复兴伟业的必然要求。我们党不断取得胜利，依靠的就是一代又一代对党的事业无比忠诚的共产党员。当前，世界百年未有之大变局加速演进，我国发展正处于战略机遇和风险挑战并存、不确定难预料因素增多的时期，需要时刻准备经受风高浪急甚至惊涛骇浪的重大考验。只有强化对党忠诚教育，推动全体党员、干部固根守魂，在纷繁复杂的国内外形势中把握大局大势、坚定信心决心，勇于斗争、善于斗争，才能战胜前进道路上的一切风险挑战。\n\n　　三、牢牢把握强化对党忠诚教育的重点\n\n　　面对新形势新任务，要坚持把对党忠诚摆在党性修养的突出位置，紧扣重点关键，有针对性强化教育引导。\n\n　　(一)聚焦坚决做到“两个维护”。坚强的领导核心和科学的理论指导，是关乎党和国家前途命运、党和人民事业成败的根本性问题。党的十八大以来，习近平总书记以马克思主义政治家、思想家、战略家的恢宏气魄、远见卓识、雄韬伟略，带领全党全军全国各族人民砥砺奋进，推动党和国家事业取得历史性成就、发生历史性变革。实践充分证明，“两个确立”是战胜一切艰难险阻、应对一切不确定性的最大确定性、最大底气、最大保证。新时代强化对党忠诚教育，必须教育引导党员、干部深刻领悟“两个确立”的决定性意义，增强“四个意识”、坚定“四个自信”、做到“两个维护”，始终在思想上政治上行动上同以习近平同志为核心的党中央保持高度一致。\n\n　　(二)聚焦坚定理想信念。忠诚不是自然而然产生的，对党要有朴素的感情，更要有理性的自觉。我们党从诞生之日起，就把马克思主义鲜明地写在自己旗帜上，把实现共产主义确立为最高理想。100多年来，无数共产党人不惜流血牺牲，靠的就是这种信仰，为的就是这个理想。新时代强化对党忠诚教育，必须教育引导党员、干部深入学习马克思主义基本理论，掌握和运用辩证唯物主义、历史唯物主义的立场观点方法，深化对共产党执政规律、社会主义建设规律、人类社会发展规律的认识，弄明白历史怎样走来、又怎样走下去，把学习成果转化为对马克思主义的信仰、对共产主义的信念、对中国特色社会主义的信心，做到虔诚而执着、至信而深厚。\n\n　　(三)聚焦提高政治能力。在党员、干部的所有能力中，政治能力是第一位的。面对错综复杂的形势，首先要善于从政治上分析问题、解决问题，提高政治判断力、政治领悟力、政治执行力，做到在重大问题和关键环节上头脑特别清醒、眼睛特别明亮、行动特别坚决。新时代强化对党忠诚教育，必须教育引导党员、干部胸怀“两个大局”、牢记“国之大者”，时刻关注党中央在关心什么、强调什么，准确把握党中央大政方针和战略意图，自觉把思想统一到党中央对形势任务的分析判断上来，不折不扣贯彻落实党中央决策部署；发扬斗争精神、增强斗争本领，坚决同一切否定党的领导和中国特色社会主义制度的言行、一切违背党的理论和路线方针政策的言行、一切危害国家统一和民族团结的言行作斗争，做到政治立场不移、政治方向不偏。\n\n　　(四)聚焦忠诚党的组织。党的力量来自组织，严密的组织体系是我们党的强大优势。历史和现实证明，如果不忠诚党的组织，把自己凌驾于组织之上，就会损害党中央权威和集中统一领导，影响党的事业。新时代强化对党忠诚教育，必须教育引导党员、干部牢记组织是我们最大的依靠，在党爱党、在党言党、在党忧党、在党为党，相信组织、依靠组织、服从组织，自觉接受组织管理监督，说老实话、办老实事、做老实人，做到襟怀坦荡、光明磊落、言行一致。\n\n　　(五)聚焦为党和人民积极工作。我们党进行的一切奋斗、一切牺牲、一切创造，都是为中国人民谋幸福、为中华民族谋复兴。对党忠诚不是一句空洞的口号，不能只停留在口头表态上，而要看实际行动，看能不能为党和人民事业勇于担当进取、甘于牺牲奉献。新时代强化对党忠诚教育，必须教育引导党员、干部坚持人民至上、事业第一，巩固拓展树立和践行正确政绩观学习教育成果，以功成不必在我的精神境界和功成必定有我的历史担当，积极投身以中国式现代化全面推进强国建设、民族复兴伟业，种好党组织交给的“责任田”，真正创造经得起实践、人民、历史检验的实绩，在担当尽责中书写忠诚。\n\n　　四、提高对党忠诚教育的质效\n\n　　对党忠诚教育是增强共产党人党性的重要抓手，也是加强党的建设的永恒课题，需要系统发力、持续用力。要遵循党员、干部成长规律和教育培训规律，坚持显性教育和潜移默化相结合、全面覆盖和分级分类相结合，进一步完善机制措施、创新方法手段、强化责任落实，引导全体党员、干部做到忠心护党、永不叛党。\n\n　　(一)强化理论学习。政治上的坚定源于理论上的清醒。要紧密结合党员、干部队伍的结构性变化和时代特点，坚持不懈用习近平新时代中国特色社会主义思想凝心铸魂，坚持和完善“第一议题”制度，提高党委(党组)理论学习中心组学习和基层党组织理论学习质量，健全常态化培训机制，持续用党的创新理论统一思想、统一意志、统一行动，教育引导党员、干部静下心来读原著、学原文、悟原理，自觉开展对照检视，及时掸去思想上的灰尘、纠正行为上的偏差，真正使理论学习的过程成为纯洁党性、砥砺忠诚的过程。同时，要认识到历史是最好的教科书、党史是最好的营养剂，深化党史、新中国史、改革开放史、社会主义发展史教育，用党的奋斗历程和伟大成就鼓舞斗志、坚定信心，用革命先辈的光辉事迹传承红色基因、弘扬革命精神，切实把忠诚注入血脉、融入灵魂。\n\n　　(二)强化政治历练。对党忠诚必须在伴随一生、永无止境的政治历练中不断强化。要充分发挥各级党组织的政治功能和组织功能，引导党员、干部加强政治历练，接受严肃认真的党内政治生活锻炼，特别是多到重大斗争最前沿，在复杂局面中增长见识、明辨是非，在风雨波浪中磨砺初心、淬炼筋骨，持续改造自己、提高自己，不断提高对党忠诚的“含金量”。同时，要引导党员、干部严守党的政治纪律和政治规矩，净化党内政治生态，旗帜鲜明反对“七个有之”和思想上的自由主义、政治上的投机主义、组织上的宗派主义、工作上的本位主义、履责上的好人主义，决不当两面派、两面人。\n\n　　(三)强化实践锤炼。对党忠诚是政治标准更是实践标准。要按照以习近平同志为核心的党中央擘画的蓝图、指明的方向，充分调动党员、干部干事创业的积极性主动性创造性，引导他们到改革发展稳定一线、艰苦复杂地区、关键吃劲岗位担苦、担难、担重、担险，以一往无前的精神投身中国式现代化建设实践，逢山开路、遇水架桥，破除一切障碍、扫除一切“拦路虎”，做到平常时候看得出来、关键时刻站得出来、危难关头豁得出来，使他们在这一过程中铸牢对党忠诚。\n\n　　(四)强化文化浸润。要加强党内政治文化建设，注重政治仪式的运用，完善重温入党誓词、入党志愿书等活动，更好让党内政治文化“日用而不觉”。善于汲取中华优秀传统文化、革命文化、社会主义先进文化精神养分，坚守共产党人价值观。要把学习宣传先进典型作为重要抓手，树立可亲可敬可学的典型榜样，激发党员、干部的思想认同、情感共鸣，自觉做到见贤思齐。把家庭作为对党忠诚教育的重要课堂，把对党忠诚纳入党员家庭家教家风建设，通过家教家风传承红色基因。 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b39abcf16","title":"王毅介绍亚太经合组织第三十三次领导人非正式会议及相关活动成果","url":"https://www.chinanews.com.cn/gn/2026/11-20/10734999.shtml","summary":"2026年11月19日，中共中央政治局委员、外交部长王毅在深圳向中外记者介绍亚太经合组织第三十三次领导人非正式会议及相关活动成果，并回答记者提问。","summary_short":"2026年11月19日，中共中央政治局委员、外交部长王毅在深圳向中外记者介绍亚太经合组织第三十三次领导人非正式会议及相关…","digest":"2026年11月19日，中共中央政治局委员…","points":["2026年11月19日，中共中央政治局委员、外交部长王毅在深圳向中外记者介绍亚太经合组织第三…","一年来，中方全面履行东道主责任，成功举办321场APEC会议和活动…","各场专业部长会议达成10余份重要成果，开放、创新、合作成为贯穿全年的高频词"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:46:21+08:00","size":1,"keywords":[],"body":"2026年11月19日，中共中央政治局委员、外交部长王毅在深圳向中外记者介绍亚太经合组织第三十三次领导人非正式会议及相关活动成果，并回答记者提问。\n\n　　王毅表示，今年是APEC“中国年”。一年来，中方全面履行东道主责任，成功举办321场APEC会议和活动，各经济体与会代表上万人次，创造了APEC史上的纪录，也为亚太合作注入了新鲜活力和强劲动力。各场专业部长会议达成10余份重要成果，开放、创新、合作成为贯穿全年的高频词。在开放领域，贸易部长会发表《苏州声明》，重申致力于推动区域经济一体化，深化亚太自贸区建设。在创新领域，数字和人工智能部长会发表《成都声明》，提出以数字经济和人工智能赋能亚太共同体建设。在合作领域，人力资源部长会发表《南京声明》，聚焦投资于人，改善就业民生，增进人民福祉。昨天的工商领导人峰会又发布《深圳倡议》，提出亚太工商界携手共建亚太共同体。全年各领域会议和活动共计75项主要成果，已形成《东道主会议和活动清单》和《东道主成果清单》并对外发布。\n\n　　APEC“中国年”的高潮就是刚刚成功举行的领导人非正式会议，这是中国今年最重要的主场外交，也是亚太经济合作铸就的一座新高峰。当今国际局势动荡不安、世界经济增长承压、逆全球化不断抬头，21个APEC经济体的领导人和代表齐聚深圳，共同探讨应对之策，共同协商合作大计，不仅对开创亚太合作新局具有重大意义，也将对维护世界和平发展产生深远影响。世界的目光投向中国、聚焦深圳。\n\n　　几天来，习近平主席主持领导人非正式会议，出席工商领导人峰会开幕式，进行双边会晤，主持中俄美元首会晤，密集开展了近20场双多边活动。在习近平主席引领下，在各经济体领导人支持下，会议达成富有雄心、务实全面的《亚太经合组织领导人深圳展望》，这是APEC“中国年”最重要的成果，也是APEC合作新的里程碑。《深圳展望》推动亚太共同体建设重整行装再出发，在六个方面取得重要进展：\n\n　　一是明确亚太合作的正确方向。习近平主席就“建设什么样的亚太共同体、怎样建设亚太共同体”深入阐述中国主张。习近平主席强调，面对国际形势变乱交织，亚太地区应当维护和平稳定大局，搭建开放合作桥梁，激发创新增长动力，拓展互利共赢路径，共同建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体，续写“亚太奇迹”的新篇章。习近平主席的重要讲话高瞻远瞩，使亚太共同体的旗帜更加鲜明、愿景更加清晰、路径更加明确。与会领导人积极呼应习近平主席重要讲话，支持亚太共同体从目标转为行动、从愿景成为现实，凝聚起共襄亚太发展繁荣大业的磅礴力量。\n\n　　二是搭建亚太共同体的“四梁八柱”。习近平主席强调，促进亚太共同繁荣，要消除贸易和投资壁垒，建设开放型亚太经济，也要推动普惠均衡发展，兼顾效率和公平。我们着眼这一目标，打造合作机制，提出合作倡议，制定行动计划，形成亚太共同体的“四梁八柱”。“四梁”就是经贸、联通、创新、发展。“八柱”就是亚太自贸区、设施硬联通、规制软联通、人民心联通，以及数字经济、新兴技术、能力建设、可持续增长。这些板块彼此呼应、相得益彰，支撑起亚太共同体的整体架构。\n\n　　三是为亚太自贸区建设注入新动力。今年是亚太自贸区愿景提出20周年。中方倡导开放的区域主义理念，推动APEC成员相向而行，重振亚太自贸区进程。此次会议通过《APEC贸易数字化合作框架》，成为促进亚太贸易便利化、支持亚太自贸区建设的重要举措。会议期间还发表了外交和贸易双部长会声明以及《关于亚太自贸区议程的声明》，强调多边贸易体制的重要性。这些成果都将推动亚太自贸区建设与时俱进，行稳致远。\n\n　　四是升级亚太互联互通合作。互联互通是区域经济一体化的纽带。此次会议达成APEC互联互通蓝图升级版，推动基础设施建设、供应链互联互通、政策监管合作和人员往来便利化。APEC“中国年”期间，各方还签署了智慧海关、智慧旅游、商旅便利化等互联互通合作文件。这些成果搭建起亚太经济体之间的桥梁，为区域经济一体化提供了更坚实支撑。\n\n　　五是赋能亚太创新增长。中国发挥自身优势，推动会议达成《APEC关于新兴技术促进就业和繁荣的声明》，就人工智能等新兴技术促进高质量充分就业、提升公共服务水平、加强数字基础设施建设等达成合作共识，体现了以人为本、智能向善理念。APEC“中国年”还举行数字周系列活动，形成数智赋能、开放创新生态、跨境数据验证合作等重要成果，将有力促进创新领域合作，培育亚太增长新动能、新优势。\n\n　　六是打造亚太合作的落地平台。会议期间，习近平主席宣布中方支持亚太合作的一系列自主举措，包括：设立亚太共同体研究中心，倡议组建世界湾区经济合作联盟，提供新的资助以开展APEC务实合作，在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立新的合作机构。同时，我们还充分考虑亚太地区差异性，推出一批促发展、惠民生的务实举措，涉及交通运输、公共卫生、能源、粮食安全、人力资源、反腐败等各个领域。这些举措契合各方发展需要，将有力推动亚太共同体建设走深走实，为共同体不断增添新的内涵。\n\n　　会议也促进了亚太各方的信任和团结。各经济体领导人举行了一系列重要双多边活动。习近平主席同美国总统特朗普举行会晤，就如何落实中美建设性战略稳定关系作出新的战略指引。习近平主席同俄罗斯总统普京举行会晤，围绕深化中俄全方位战略协作达成新的合作共识。\n\n　　王毅表示，大家都很关心中俄美元首会晤的情况。习近平主席、普京总统、特朗普总统举行会晤，就事关全球和平安全与稳定的重要问题深入交换了意见。这是三国元首历史上首次举行会晤，意义重大，影响深远，是载入史册的标志性事件。会晤气氛坦诚、友好，富有建设性，取得了一系列共识，发表了面向世界的《和平宣言》，核心就是共同维护世界和平，促进大国关系战略稳定。可以说，这是一次“和平峰会”。\n\n　　深圳是中国改革开放的重要窗口，是中国特色社会主义先行示范区。中国在深圳办会，彰显了致力于扩大高水平对外开放、推动建设开放型亚太经济的决心。我们要以深圳为新起点，向着亚太共同体目标坚定前行，为中国人民和亚太人民的福祉作出不懈努力，为世界的和平与发展作出更大贡献。\n\n　　王毅还接受了记者提问。\n\n　　有记者问及，中方如何评价中俄美元首会晤，后续如何落实会晤共识，如何看待自身作用。王毅表示，中俄美作为世界主要大国和联合国安理会常任理事国，肩负着促进全球和平与安全的重要责任。中俄美三国最高领导人围绕维护世界和平、促进大国关系战略稳定这一主题，就当前国际形势演变以及全球性挑战深入交换意见，向世界发出了积极信号，意义重大，影响深远。\n\n　　这是一次具有开创意义的历史性会晤。大国关系牵动国际格局演变，事关全球战略稳定。三国元首历史上首次举行面对面会晤，开创了三国最高领导人交往的新纪录，为新时期大国互动构建了新范式，也是推进新型大国关系的新实践，堪称国际关系史上的重大创举。\n\n　　这是一次体现大国担当的标志性会晤。当前，世界百年变局加速演进，各种风险挑战层出不穷，国际社会对和平与稳定的期盼日益强烈，对大国加强沟通协调的呼声日益高涨。会晤顺应时代潮流，符合世界期待。习近平主席强调，大国和则世界安，大国斗则世界乱。三国元首面对面阐明了各自战略意图，愿意防止发生冲突对抗，守住和平共处底线，期待形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。\n\n　　这是一次深入沟通互动的建设性会晤。中方一贯主张大小国家一律平等，致力于实现国际关系的民主化，构建平等有序的多极化。我们认为，大国拥有更多资源、更大能力，应展现大国胸怀、大国担当，在国际上带头讲平等、守诚信、尊道义、重合作、作表率。会晤发布的《和平宣言》凝聚了三方共识，对更有效应对全球性挑战，维护好世界和平稳定具有重大积极意义。正像习近平主席所说，今天播下的种子必将生根发芽、开花结果。中方将同俄美全面高效落实三国元首会晤共识，并通过工作层保持沟通协调，朝着建设一个更美好的世界作出不懈努力。\n\n　　有记者问及，会议为什么聚焦建设亚太共同体以及建设亚太共同体对中国和地区的意义。王毅说，首先，上世纪80年代末，APEC在经济全球化的大潮中应运而生，亚太共同体的构想也在APEC进程中培育形成。2020年，APEC制定了布特拉加亚愿景，提出2040年建成亚太共同体的目标。现在离2040年只有十多年时间了，如何使亚太共同体从目标转为行动、从愿景成为现实，需要亚太大家庭形成新的共识，作出鲜明回答。此次深圳会议在布特拉加亚愿景基础上更进一步，搭建起了亚太共同体的“四梁八柱”，绘就了实施路线图，正当其时、意义重大。可以说，亚太共同体建设从深圳真正启航了。\n\n　　第二，过去这些年，经济全球化遭遇逆风，一些人对亚太合作能走多远产生了疑问。我们旗帜鲜明地推动建设亚太共同体，就是为了发出开放合作的时代强音。APEC成立30多年的历史经验证明，开放合作才是发展振兴的正确选择。习近平主席在今天的会议上掷地有声地指出，经济全球化不时有回头浪，但亚太合作不能走回头路。《深圳展望》的达成表明，各方愿意克服分歧，共同维护APEC的初心，推动亚太共同体迈入实质性推进的新阶段。\n\n　　第三，亚太共同体目标与习近平主席倡导构建人类命运共同体的理念一脉相承。人类命运共同体的理念最早就源于亚太地区命运与共的思考，习近平主席2013年提出树立亚太命运共同体意识，并在实践中不断转化和融入APEC议程。世界要发展，关键看亚太。此次会议聚焦亚太共同体，同中方推动构建人类命运共同体的努力相得益彰，是中国理念和亚太愿景的完美结合，必将在亚太合作历史上留下浓墨重彩的篇章。\n\n 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca070b066e3","title":"大國外交｜習近平：中俄美應合作應對全球性挑戰 共同維護世界和平穩定","url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定","summary":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。習近平表示，中俄美應合作應對全球性挑戰，共同維護世界和平穩定。","summary_short":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","points":["國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","國家主席習近平稱：「當今世界早已不是彼此隔絕的孤島","人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:24+08:00","size":2,"keywords":[],"body":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤。習近平表示，中俄美應合作應對全球性挑戰，共同維護世界和平穩定。\n\n國家主席習近平稱：「當今世界早已不是彼此隔絕的孤島。人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體。在這個地球村裡，大國肩負著特殊責任。大國良性互動不是選擇題，而是必答題。」\n\n習近平指出：「當前，世界百年變局加速演進，天下並不太平。風雨見擔當。作為世界主要大國和聯合國安理會常任理事國，中俄美應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定，為人類進步作出更大貢獻。」","image":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/snapshots/60793b0057e64254b53116321f5ad045-00008.jpg","video":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/8cf0cf8eb7c24cc881956d4956cb2e97-321a167a725a6d5e3ff5a6f4b80ffdf1-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/8eb8ae8aff384b56a480d21221e050f5/snapshots/60793b0057e64254b53116321f5ad045-00008.jpg","lang":"zh-Hant","items":[{"title":"大國外交｜習近平：中俄美應合作應對全球性挑戰 共同維護世界和平穩定","url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:24+08:00","category":"兩岸","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤"},{"title":"大國外交｜習近平指中美關係總體穩定向好","url":"https://news.tvb.com/tc/1207330-大國外交習近平指中美關係總體穩定向好","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:12:00+08:00","category":"兩岸","digest":"大國外交｜習近平指中美關係總體穩定向好"}],"cross":{"total":2,"angles":[{"point":"大國外交｜習近平指中美關係總體穩定向好","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207330-大國外交習近平指中美關係總體穩定向好"},{"point":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，下午在深圳舉行首場中俄美元首會晤","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207344-大國外交習近平中俄美應合作應對全球性挑戰共同維護世界和平穩定"}]}},{"id":"cd2011b2bbf","title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳宣言》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳宣言-升級亞太互聯互通持續更新","summary":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。","summary_short":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行","points":["今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行","國家主席習近平將主持會議並發表重要講話","國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","size":2,"keywords":[],"body":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。國家主席習近平及美國總統特朗普，今日在深圳出席APEC亞太經合組織領導人非正式會議期間，先舉行中美雙邊會談，再跟俄羅斯總統普京在南山區麒麟山莊，首次出席備受矚目的三方會談。外交部表示，這是中俄美三國元首歷史上首次面對面會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。\n​​相關新聞：APEC 2026懶人包 21成員聚首深圳談甚麼？ 和我們息息相關？ 一文看清重點全解析\n本屆深圳APEC新增一場重頭戲：中美俄元首今日將舉行歷來首次三方會談，或觸及伊朗、烏克蘭等問題，俄方正推動會後發表聯合聲明。\n相關新聞：深圳APEC｜中美俄將展二戰後首次三方對話 學者：聚焦地區穩定不復刻強權外交︱分析\n內地分析人士對《星島》指出，在目前全球政經格局動盪之際，中美俄三國元首不但在深圳「同框」，而且將破天荒召開三方峰會；若北韓領袖金正恩也現身深圳，今次峰會將是APEC成立37年來「含金量最高」的一次會議。據了解，各方正醞釀推動達成《深圳宣言》。\n相關新聞：深圳APEC︱峰會今揭幕習近平發表講話 被譽史上「含金量最高」\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n11月19日最新消息\n\n相關新聞：深圳APEC︱中美俄元首麒麟山莊會晤登場 習近平：大國良性互動是必答題\n中國外交部長王毅將舉行記者會，介紹APEC領導人非正式會議成果。 陳俊豪攝\n王毅總結APEC會議成果\n22：10\n\n中國外交部長王毅將舉行記者會，介紹APEC領導人非正式會議成果。記者會原訂於晚上7時30分，大約6時許，大會通知記者會推遲至9時30分才舉行。由於傳媒希望能即時了解中方在APEC的總結，現場約200名中外記者即使經過連日採訪，面對疲倦的身軀仍然堅持等候。大約於10時許，外長王毅終於現身記者會。王毅一踏上講台，即向在場記者表示「讓大家久等了，各位辛苦了」，他解釋自己由於要從機場趕回，因而延遲，之後再作出APEC的總結。\n\n18：55\n新華社報道，國家主席習近平、俄羅斯總統普京、美國總統特朗普今日（19日）在深圳舉行會晤。三國元首就當前國際形勢深入交換了意見，致力於維護戰略穩定和國際安全，同時發表和平宣言。\n相關新聞：深圳APEC︱中俄美元首發表和平宣言 四大要點包括防止核擴散進行對話\n\n18：40\n\n美國總統特朗普離開深圳，外長王毅到機場送行。\n深圳APEC｜美國總統特朗普離開深圳。 路透社\n深圳APEC｜美國總統特朗普離開深圳。 路透社\n習近平：美國應在台灣問題上做對的事\n18：01\n中美俄閉門會議結束，歷時約一個半小時。央視報道，會晤結束後，特朗普、普京先後離開會晤現場。\n17：22\n\n習近平、特朗普、普京目前正在進行閉門會談。\n17：10\n習近平稱，核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n習近平強調，各國要尊重彼此主權和領土完整，尊重各自選擇的社會制度和發展道路，尊重彼此核心利益和重大關切。\n16：50\n美國總統特朗普表示，美中俄在討論核武問題上具有獨特的優勢。\n習近平說，「歷史告訴我們：大國和，則世界安﹔大國斗，則世界亂。」\n16：40\n習近平指出，人類同處「地球村」，大國肩負特殊責任，大國良性互動並非「選擇題」而是「必答題」。\n他強調，面對世界百年變局加速演進、天下並不太平，中俄美同為聯合國安理會常任理事國，應當好表率，合作應對全球性挑戰並共同維護世界和平穩定。\n16：30\n俄羅斯總統普京感謝中方積極組織今次三國元首會晤。他強調，中美俄三國同為第二次世界大戰戰勝國，對維護全球和平穩定負有特殊責任，並表示烏克蘭局勢將是今次會談的重點議題。\n16：28\n國家主席習近平在深圳同俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤。\n普京抵達現場。\n15：05\n根據現場消息，隨行記者獲告知，中國國家主席習近平、美國總統特朗普及其各自代表團目前正在共進午餐。\n截至下午3時剛過，這場午宴仍在進行中；而原本預定於下午2時30分舉行的習近平、特朗普與俄羅斯總統普京三方會晤，因此有所順延。\n14：55\n央視報道，中國國家主席習近平將在深圳與俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤。 \n14：40\n央視報道，中美峰會已經結束。\n14：20\n習近平稱，中美關係整體穩定且不斷改善，建構建設性的中美戰略穩定關係也是前所未有。他將與特朗普合作，確保中美關係繼續朝着既定方向發展。\n特朗普則稱呼習近平為「我的朋友」，指雙方有非常特別的關係，只要兩人掌舵便不會出現問題；他又透露美中在確保霍爾木茲海峽能源暢通及阻止伊朗擁核上立場一致，並希望在俄烏戰事及芬太尼危機等領域展開合作。\n特朗普則稱，他計劃與習近平討論結束烏克蘭戰爭，之後再赴中美俄元首會晤。\n14：10\n據路透社引述克林姆林宮消息報道，普京與特朗普進行雙邊會晤後心情極佳。雙方討論了烏克蘭衝突及雙邊關係相關議題。\n14：00\n特朗普向習近平表示：「你是我朋友，我們有著非常特別的關係。」他強調，中美雙方已建立起公平的關係，「這正是我們所追求的」，並指全球其他地方無人能做到中美兩國所能達成的成就。\n在經貿議題上，特朗普指出中美兩國已以公平方式分攤關稅，並稱相關貿易委員會正為過往失衡的雙邊關係帶來平衡。此外，特朗普亦透露，兩國領導人均強烈認為，石油運輸應保持暢通無阻地經由霍爾木茲海峽進行。\n13：32\n特朗普已抵達麒麟山莊。據央視報道，特朗普與習近平已開始會晤。\n相關新聞：深圳APEC︱中美俄元首會晤麒麟山莊即將登場 習近平先晤特朗普\n13：12\n特朗普與普京會面結束，正在前往麒麟山莊，準備與習近平會面。路透社報道，特普兩人會晤大約半小時左右，普京告訴特朗普，很高興見到他。\n特朗普則以「我的朋友」來稱呼普京，說：「我們多年來一直保持着良好的關係。我們彼此已認識很久，我認為這會帶來很多美好的結果，或者至少會由此開始。但我相信這些美好結果會由此而來」。\n特朗普與普京會晤。路透社\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n12：35\n美俄元首在北京會晤。會晤開始前，特朗普與普京握手，並稱兩人多年來一直保持著良好的關係，認為這次會面會帶來許多美好的會面。據外媒報道，是次會談持續不到1小時。\n特朗普與普京在北京會晤。俄羅斯衛星通訊社\n領導人非正式會議中，普京與特朗普亦曾作互動。路透社\n11：45\n國家主席於今日（19日）舉行的出席亞太經合組織（APEC）領導人非正式會議上，再次與日本首相高市早苗握手。昨日在歡迎晚晏上，二人亦曾握手。二人兩次握手，習近平都是只微笑，未有作交談。\n相關新聞：深圳APEC︱習近平再與高市早苗禮節性握手 繼續保持微笑\n11：33\n美國總統特朗普多次表示，在深圳出席亞太經合組織（APEC）峰會期間可能與北韓最高領導人金正恩會面。不過朝中社今日（19日）報道，金正恩近日已轉赴東部咸鏡南道視察海軍大學，朝方至今未對美方的會面提議作出任何回應。\n相關新聞：深圳APEC︱金正恩視察咸鏡南道 朝方未回應是否與特朗普會晤\n11：25\n中美俄三國元首今日（19日）在深圳亞太經合組織峰會場邊舉行歷史性會談前夕，俄方一個神秘黑色公事包意外成為焦點。普京隨行海軍軍官在深圳下榻酒店外被拍到手提代號「Cheget」的核武公事包，面對記者追問更罕有在鏡頭前微笑承認：「沒錯，就是它。」\n相關新聞：深圳APEC︱普京隨行軍官直認手上「核公事包」 中美俄會晤前「騷肌肉」？\n10：40\n國家主席習近平、美國總統特朗普與俄羅斯總統普京周四（19日）在深圳舉行三方會晤。三人上一次共同出席國際峰會是2019年日本大阪G20峰會，但當時並未舉行三方會談。外交部指，是次中俄美三國元首首度舉行三方會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。亦有分析指出，中美俄領導人首度同框意義重大，但同時會引發美國盟友之疑慮。\n相關新聞：深圳APEC｜中美俄元首同框象徵意義重大 惟引發美盟友不安｜拆局\n09：55\n國家主席習近平主持第33次領導人非正式會議，並發表講話。習近平表示，今天會議的主題是建設亞太共同體，促進共同繁榮。相信在我們共同努力下會議會圓滿成功，爲亞太經合組織實現更大發展地區乃至世界的和平、穩定、繁榮貢獻力量。\n\n習近平在講話提出多個重點，中方將提供2000萬美元資助開展亞太經合組織務實合作，在深圳設立亞太共同體研究中心。此外，亦會推進亞太自貿區建設，減少貿易壁壘，提升數字化與便利化水平；第二，升級互聯互通，鞏固基礎設施硬聯通，深化軟聯通與跨境支付合作；打造創新支柱，以數字經濟和人工智能為引擎，促進數據安全流通；發展支柱，深化能源、糧食及綠色低碳合作，支持改善民生。\n相關新聞：深圳APEC︱習近平倡攜手搭建亞太共同體「四樑八柱」︱講話全文\n\n09：52\n習近平與一眾嘉賓統一戴上中式領巾，然後一同合照。\n習近平：會議將為世界和平穩定貢獻力量。央視截圖\n領導人非正式會議上，特朗普在台上與習近平交流。路透社\n領導人非正式會議上，各出席嘉賓帶上領巾合照。路透社\n09：38\n俄羅斯總統普京及美國總統特朗普先後抵達深圳國際交流中心，出席領導人非正式會議。\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n特朗普今早離開酒店，前往深圳國際交流中心出席APEC領導人非正式會議。路透社\n09：20\nAPEC 採用「經濟體」作為參與單位，所有成員均按其官方英文名稱（例如 Australia、Canada、China、Hong Kong, China、Chinese Taipei 等）的字母順序依次入座。\n年度的主辦方即東道主領袖擔任會議主席，負責主持會議，通常坐在主位或正中央。因此，今次深圳峰會，國家主席習近平坐在主位。\n相關新聞：深圳APEC︱領導人峰會座位合照安排有玄機\n09：00\n今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。\n08：45\nAPEC領導人非正式會議在深圳揭幕，美國總統特朗普由菲律賓抵達深圳後，隨即入住福田區深圳東海朗廷酒店。周三（18日）下午起，酒店周邊實施交通管制，大批市民自發在對面馬路圍觀，\n相關新聞：深圳APEC︱市民街頭歡呼迎特朗普車隊 隔空叫「請他吃豬腳飯」︱有片\n00：35\n內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。\n相關新聞：深圳APEC｜晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n​ 內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。 中新視頻\n11月18日最新消息\n23：50\n俄羅斯衛星通訊社報道指出，出席歡迎晚宴的俄羅斯總統普京與美國總統特朗普，分別獲安排坐在習近平及夫人彭麗媛的左右兩側。\n相關新聞：深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身訪華團\n19：23\nAPEC各經濟體領導人開始陸續抵達位於深圳福田區的深圳國際交流中心。這處將舉行領導人合影活動，並舉辦由國家主席習近平名義舉行的歡迎晚宴。大會在入口處安排樂師現場演奏，當美國總統特朗普入場時，更特意駐足欣賞一會。\n相關新聞：深圳APEC｜習近平舉行歡迎晚宴 特朗普與普京握手\n晚宴開始後，中美俄三國領導人更在台上交談，期間美國總統特朗普更與俄羅斯總統普京握手。\n\n習近平在歡迎晚宴上，向出席嘉賓祝酒。路透社\n經濟體領導人在歡迎晚宴上合照。路透社\n經濟體領導人到深圳國際交流中心，出席歡迎晚宴。路透社\n習近平親迎特朗普：禮尚往來\n16：45\n新華社報道，周三（18日）下午，國家主席習近平在深圳寶安國際機場迎接來華出席亞太經合組織領導人非正式會議的美國總統特朗普。在迎賓曲中，習近平同特朗普親切握手。三軍儀仗隊行舉槍禮，少年兒童向特朗普獻花。中美兩國國旗迎風招展，軍樂團奏兩國國歌，戰機飛越致敬。兩國元首向青年歡迎隊伍揮手致意。\n習近平表示，今年9月我訪美時，特朗普總統夫婦專程赴機場迎接，並舉行隆重歡迎儀式。中國是禮儀之邦，有禮尚往來的傳統。我歡迎你再次訪華，期待同你就事關中美關係、亞太合作和世界格局的重大問題深入交換意見，推動基於尊重、公平、對等的中美建設性戰略穩定關系向前發展。\n特朗普表示，感謝習近平主席親赴機場迎接，感謝中方特殊安排，很高興再次到訪偉大的中國。習近平主席是一位偉大的領袖，每一次同習近平主席會晤都非常愉快，相信此訪將進一步推進兩國關係，取得圓滿成功。\n蔡奇、王毅、黃坤明參加。\n相關新聞：深圳APEC｜特朗普結束訪菲啟程來華 上機前做「招牌」握拳頭動作\n16：27\n日本首相高市早苗抵達深圳，將出席領導人非正式會議，展開就任後的首次訪華之行。\n\n相關新聞：深圳APEC︱日本首相高市早苗抵華 接待層級低於其他領導人\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n12：04\n國家主席習近平與俄羅斯總統普京會晤。\n習近平與普京會晤。\n習近平與普京會晤。\n普京讚深圳最具活力的大都市之一\n11：20\n俄羅斯總統普京出席深圳前海國際會議中心出席2026年亞太經合組織工商領導人峰會開幕，並以經濟體領導人身份作特別致辭。普京表示，此次APEC舉辦地深圳給人留下了深刻印像。「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」\n10：00\n國家主席習近平在主旨演講上表示，中國「十五五」規劃既是自身的發展藍圖，也為亞太乃至全球經濟增長提供機遇清單，是中國面向全球工商界發出的合作邀約。\n\n中國將為全球工商界提供超大規模開放市場。中國擁有全球規模最大中等收入群體，投資和消費潛力巨大。\n相關新聞：深圳APEC｜習近平籲踐行真正多邊主義 共建亞太共同體\n習近平：中國正加快建設開放大市場\n習近平指出，從新能源汽車到智能家居，從銀發經濟到冰雪旅遊，每一個新賽道都為全球企業帶來新機遇。中國正在加快建設開放大市場，擴大優質產品和服務進口，將不斷催生多樣化新需求。\n中國將為全球工商界提供前景廣闊的發展空間。創新驅動、綠色轉型是中國經濟的關鍵詞。中國將加快構建現代化產業體系，推動科技創新和產業創新深度融合，為全球企業技術創新和發展壯大提供強勁動能。\n\n中國將為全球工商界提供互促共進的合作環境。面對單邊主義、保護主義衝擊，中國始終踐行真正多邊主義，堅定維護多邊貿易體制，維護世貿組織規則，推動世界貿易組織改革，不斷為世界經濟增長和國際經貿合作注入穩定性和確定性。中方將從降低關稅、擴大准入，到探索規則、管理、標準等深水區改革，全面落實製造業准入又准營，穩步擴大服務業領域開放，為全球企業來華投資興業提供更穩定、更可預期優質環境。\n今明兩日出席峰會 多國領袖齊聚深圳\n03：00\n18日凌晨，俄羅斯總統普京乘專機抵達深圳，出席APEC峰會。中共中央政治局常委、中央書記處書記蔡奇前往機場迎接。分析人士對《星島》指出，今年5月普京訪華時，接機是中共中央政治局委員、外長王毅，而今次接機的是政治局常委蔡奇，規格比之前更高。預計普京在峰會期間將與多國與會領袖就亞太區經貿合作及國際局勢等議題展開交流。\n克里姆林宮發言人周六表示，11月19日在深圳，普京將與國家主席習近平及美國總統特朗普舉行三方會晤。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳宣言》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳宣言-升級亞太互聯互通持續更新","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","category":"內地","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行"},{"title":"深圳APEC︱ 王毅介紹會議成果：發表《深圳展望》 升級亞太互聯互通︱持續更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC-王毅介紹會議成果發表深圳展望-升級亞太互聯互通持續更新","source_display":"星島頭條","published_at":"2026-11-19T22:45:33+08:00","category":"內地","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議在深圳國際交流中心舉行"}]},{"id":"ced0cd41feb","title":"WTT冠军赛将首次登陆上海","url":"https://www.chinanews.com.cn/ty/2026/11-19/10734955.shtml","summary":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布，2027WTT上海冠军赛将于2027年1月19日至24日落户上海浦发银行东方体育中心…","summary_short":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","digest":"据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","points":["中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","WTT每个赛季在全球举办六站冠军赛","WTT上海冠军赛将作为2027赛季的首站冠军赛登场"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:22:28+08:00","size":2,"keywords":[],"body":"中新社上海11月19日电 据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布，2027WTT上海冠军赛将于2027年1月19日至24日落户上海浦发银行东方体育中心，这也是WTT赛事首次来到上海。\n\n　　WTT每个赛季在全球举办六站冠军赛。WTT上海冠军赛将作为2027赛季的首站冠军赛登场。WTT冠军赛汇集来自全球的32名顶尖男子单打和女子单打选手，角逐这项运动中最重要的奖项之一。该赛事不设资格赛，来自世界各地的顶尖选手从第一轮开始直接进入淘汰赛对决，争夺1000点世界排名积分。\n\n　　上海拥有丰富的乒乓球历史，乒乓球在这里拥有深厚的群众基础和极高的参与度，是市民们最喜爱的体育运动之一。上海还培养了多位乒乓球世界冠军及奥运冠军。\n\n　　国际乒乓球联合会主席及WTT董事会主席佩特拉·索林表示：“对于WTT而言，每一座新的主办城市都意味着创造更多机会，让球迷亲近乒乓球、享受难忘的观赛体验，并与当地社区及合作伙伴建立深度连接。我们期待与中国乒乓球协会及本地赛事组委会紧密合作，共同呈现一场精彩的赛事，也希望以此为起点，与上海这座城市建立长期而紧密的合作关系。”\r\n\n　　中国乒乓球协会秘书长何潇表示，上海是中国乒乓球运动的发源地，同时拥有国际乒联博物馆和中国乒乓球博物馆，乒乓文化底蕴深厚。早在2005年，上海就成功举办第48届国际乒联世界乒乓球锦标赛，打造了一场属于世界乒坛的盛会。“本次WTT冠军赛落地上海，既能满足上海及周边广大民众对高品质文体生活的向往，不断提升大家的体育获得感与幸福感，也将进一步点燃市民参与乒乓球运动的热情，助力乒乓文化持续传播。”(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"WTT冠军赛将首次登陆上海","url":"https://www.chinanews.com.cn/ty/2026/11-19/10734955.shtml","source_display":"中國新聞網","published_at":"2026-11-19T22:22:28+08:00","category":"","digest":"据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…"},{"title":"WTT冠军赛将首次在上海举办","url":"https://www.jiemian.com/article/15352393.html","source_display":"界面新聞","published_at":"2026-11-19T22:06:24+08:00","category":"","digest":"11月19日，世界乒乓球职业大联盟宣布…"}],"cross":{"total":2,"angles":[{"point":"11月19日，世界乒乓球职业大联盟宣布…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15352393.html"},{"point":"据上海市体育局19日消息，世界乒乓球职业大联盟(WTT)当日宣布…","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/ty/2026/11-19/10734955.shtml"}]}},{"id":"c3c39faf3da","title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734919.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","三国元首围绕“维护世界和平，促进大国关系战略稳定”主题进行深入讨论","习近平指出，中俄美三国最高领导人有史以来首次聚首，具有开创性意义"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:35:16+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。三国元首围绕“维护世界和平，促进大国关系战略稳定”主题进行深入讨论。\n\n　　习近平指出，中俄美三国最高领导人有史以来首次聚首，具有开创性意义。历史告诉我们，大国和则世界安，大国斗则世界乱。和平是人类社会的永恒期盼。我们这个星球曾爆发过1万多次战争，当下世界上仍有60多场地区冲突延宕不止。80多年前，作为世界反法西斯的中坚力量，中俄美三国并肩奋战，取得伟大胜利，为世界赢得和平和安宁。历史是最好的教科书。我们要铭记历史，以史为鉴，开创未来。\n\n　　习近平强调，人类生活在同一个地球村，是一个命运共同体。在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。近年来，中国推进中俄新时代全面战略协作伙伴关系，积极构建中美建设性战略稳定关系，推动形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。当前，世界百年变局加速演进，天下并不太平。中俄美作为世界主要大国和联合国安理会常任理事国，应该当好表率，合作应对全球性挑战，共同维护世界和平稳定，为人类进步作出更大贡献。\n\n　　习近平指出，大国如何正确相处、共同为世界和平托底，是必须答好的时代课题。他就此提出4点看法：\n\n　　第一，坚持相互尊重。相互尊重是大国交往的基本准则。中俄美三国国情不同，要彼此尊重、求同存异、共同发展，包括尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重彼此核心利益和重大关切。要坚持不干涉别国内政，不干涉彼此内部事务。在涉及对方的重大敏感问题上，要提前沟通、换位思考、谨慎行事，特别是不能触碰对方的底线。\n\n　　第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线。中俄美都是二战主要战胜国，应当坚定维护战后国际秩序，维护《联合国宪章》宗旨，捍卫来之不易的二战胜利成果。核战争打不赢也打不得，要尽一切努力防止。\n\n　　第三，坚持合作共赢。中俄美三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。应该加强经贸合作，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n\n　　第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦就可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。国际社会期待大国就热点问题多做劝和促谈工作，中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。\n\n　　普京表示，感谢中方安排历史上首次俄中美元首会晤。俄中美都是大国和联合国安理会常任理事国，二战的胜利成果把我们联系在一起，捍卫《联合国宪章》宗旨、维护国际和平是三国共同责任，妥善处理热点问题符合三国共同利益。三国要坚持主权平等、不干涉内政原则，通过合作寻找平衡解决关切的办法。俄方愿同中方和美方相互尊重、平等对话、和平共处、妥处分歧，促进自由开放的国际贸易，维护能源、粮食安全，加强人工智能治理国际合作，共同为世界和平安全作出贡献。\n\n　　特朗普表示，美中俄三国元首会晤举世瞩目、非常重要，创造了历史。三国都是有核国，对维护世界和平稳定负有特殊重要的责任。三方应共同防止核扩散，避免核武器给人类带来灾难。维护稳定、实现和平需要对话，任何问题都应通过对话解决。我期待同习近平主席和普京总统一道，更好地保护我们的地球，使未来更安全。\n\n　　三国元首还就乌克兰危机、防止核武器扩散、中东局势、朝鲜半岛等重大国际和地区问题交换了意见。\n\n　　习近平在总结讲话中指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的，三国在维护世界和平上看法是一致的。三国都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平，大国应该重视各国合理安全关切；对话谈判是化解分歧的正确选择，只要对话不停止、大门不关上，和平就有希望；合作是应对挑战的必由之路，要基于共同利益加强合作，以合作促和平、谋共赢。\n\n　　习近平强调，今天三国元首会晤播下的种子，必将生根发芽、开花结果。三国要落实好会晤共识，继续加强沟通，以对话聚共识，以担当迎挑战，以合作促和平，共同推动建设一个更加美好的世界。\n\n　　会后，三国发表《中俄美元首和平宣言》。\n\n　　蔡奇、王毅参加。(完) 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734919.shtml","source_display":"中新網 時政","published_at":"2026-11-19T21:35:16+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734866.shtml","source_display":"中新網 時政","published_at":"2026-11-19T20:06:15+08:00","category":"內地","digest":"11月19日下午，国家主席习 rce":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:29:01+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日上午，中国国家主席习近平夫人彭丽媛同出席亚太经合组织第三十三次领导人非正式会议的经济体领导人或代表配偶在深圳湾文化广场举行集体活动。\n\n　　彭丽媛热情迎接来宾并同她们合影。孩子们以喜庆热烈的醒狮和英歌舞欢迎嘉宾们的到来。彭丽媛邀请来宾参观“岭南非遗传承与创新”主题展。大家兴致盎然，不时驻足观看精美的非遗工艺品，共同欣赏岭南特色小型文艺展示，体验数字化骑楼街景。\n\n　　彭丽媛同来宾们亲切交流，表示岭南文化是中华文化重要支脉，展现了人与自然和合共生的智慧，中方愿同各方加强文化交流互鉴。来宾们对中华传统文化悠久历史和深厚底蕴赞不绝口，对中国式现代化发展成就深表钦佩，期待同中方深化交流合作。\n\n　　参观结束时，彭丽媛同来宾们合影留念并亲切道别。\n\n　　智利总统夫人阿德里亚索拉，韩国总统夫人金惠景，菲律宾总统夫人丽莎，越共中央总书记、国家主席夫人吴芳璃，新加坡总理夫人吕子蕊，泰国总理夫人塔娜侬，中国台北经济领导人代表夫人叶紫华等参加上述活动。(完) 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）彭丽媛同亚太经合组织经济体领导人或代表配偶参观“岭南非遗传承与创新”主题展","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734850.shtml","source_display":"中新網 時政","published_at":"2026-11-19T19:29:01+08:00","category":"內地","digest":"11月19日上午…"},{"title":"彭丽媛同亚太经合组织经济体领导人或代表配偶参观“岭南非遗传承与创新”主题展","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734812.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:56:41+08:00","category":"內地","digest":"11月19日上午…"}]},{"id":"ca9a0a4d01b","title":"【深圳APEC】融合四项非遗技艺 多处细节传递东方智慧 APEC围巾竟藏如此巧思","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-19/news1075513.shtml","summary":"11月19日，APEC各经济体领导人、代表合拍“全家福”。","summary_short":"11月19日，APEC各经济体领导人、代表合拍“全家福”。","digest":"11月19日，APEC各经济体领导人、代表合拍“全家福”","points":["11月19日，APEC各经济体领导人、代表合拍“全家福”","大家佩戴的红色、蓝色围巾，深深吸引了人们的目光","围巾主要设计方、苏州上久楷丝绸科技文化有限公司董事长吴建华受访时表示…"],"section":"內地","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T23:05:31+08:00","size":1,"keywords":[],"body":"11月19日，APEC各经济体领导人、代表合拍“全家福”。大家佩戴的红色、蓝色围巾，深深吸引了人们的目光。\n\n围巾主要设计方、苏州上久楷丝绸科技文化有限公司董事长吴建华受访时表示，两款名为“同心合锦”的围巾分别以宋锦、香云纱为面料，均为100%桑蚕丝，采用藏蓝和“故宫红”两种颜色。围巾融合四项非遗技艺，多处细节传递出东方智慧。 (记者 葛勇 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/9EE357CBF5804E3F91C516E4DDCAC26E.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c4b745663cb","title":"学者：中美建构建设性战略稳定关系 不支持“台独”表态具积极意义","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734968.shtml","summary":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出，相关对话反映出双方建构中美建设性战略稳定关系的积极意愿…","summary_short":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出…","digest":"围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出…","points":["中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述…","国家主席习近平19日在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普","习近平强调，在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:50:08+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 (记者 张杨彬 刘大炜)围绕中美元首19日深圳会晤涉台表述，多位学者当天接受中新社采访时指出，相关对话反映出双方建构中美建设性战略稳定关系的积极意愿，美方表态释放出对台政策更趋审慎的信号。\r\n\n　　国家主席习近平19日在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。习近平强调，在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。特朗普明确表示，美国不支持“台独”。\n\n　　华侨大学客座研究员包承柯表示，习近平主席关于台湾问题的表述具有连续性。从今年5月中美元首北京会晤时强调“台湾问题是中美关系中最重要的问题”，到9月华盛顿会晤时表示“希望美方坚持反对‘台独’的正确立场”，再到此次深圳会晤强调“美方要坚持做正确的事”，可以看出，台湾问题始终是影响中美建设性战略稳定关系的重要因素。\n\n　　“‘坚持做正确的事’与‘避免中美关系出现大的波折’构成了‘进’与‘稳’的辩证关系。”北京联合大学台湾研究院教授朱松岭指出，前者是积极进取的方向，指明双方应该朝哪里走、多做加法；后者是审慎务实的底线，明确双方不能跨越的边界。他说，这显现出中国在大国关系与对外交往中的战略定力与底线思维。\n\n　　对于特朗普此次明确表示不支持“台独”，清华大学战略与安全研究中心副研究员孙成昊认为，这一表态具有积极意义，有助于降低“台独”势力误判形势的风险。\n\n　　包承柯认为，特朗普此次表态较此前“不想跨越9500英里打一场战争”等说法更加清晰，是本届美国政府首次正式明确表达这一立场。\n\n　　包承柯分析，此次美方涉台表述的变化主要基于两个因素：一是中美两国领导人在一年内实现三次会晤，在互动中加深互信，促使美方在处理台湾问题时更加谨慎；二是从全球战略大局看，各方都有妥善处理潜在冲突、避免大国对抗的现实需求，台湾问题是其中一个潜在风险点，妥善处理这一问题，有助于维护中美关系稳定，避免风波发生。\n\n　　“接下来，更重要的是观察美方能否在对台军售、官方往来和军事活动等具体行动上体现这一承诺。”孙成昊说，美国能否保持言行一致、避免向“台独”释放错误信号，将是检验建设性战略稳定关系成效的一项重要标准。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca5127e7650","title":"全国首单香港主体跨境数据知识产权登记落地广东","url":"https://www.chinanews.com.cn/dwq/2026/11-19/10734962.shtml","summary":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识产权存证登记平台获得登记…","summary_short":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数…","digest":"香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识…","points":["中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多…","这是全国首个香港经营主体通过跨境登记模式在粤获得数据知识产权登记","继向澳门经营主体颁发数据知识产权登记证书之后，广东目前已实现面向香港…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:33:27+08:00","size":1,"keywords":[],"body":"中新网广州11月19日电 (记者 孙秋霞)香港乾盛映像传媒有限公司的“影视竖屏视频镜头语言多模态训练数据集”近日在广东数据知识产权存证登记平台获得登记，在19日举行的亚洲知识产权营商论坛“粤港澳大湾区分论坛”上，广东省市场监督管理局(知识产权局)为该企业颁发数据知识产权登记证书。\r\n\n　　这是全国首个香港经营主体通过跨境登记模式在粤获得数据知识产权登记。继向澳门经营主体颁发数据知识产权登记证书之后，广东目前已实现面向香港、澳门经营主体跨境数据知识产权登记的全覆盖。\n\n　　据介绍，此次登记的“影视竖屏视频镜头语言多模态训练数据集”由企业自有竖屏影视素材加工而成，共1001条镜头级记录、42个字段，以镜头级粒度完成多模态标注，面向AIGC竖屏视频模型训练，可为微短剧、竖屏广告、电商短视频等生产提供合规训练数据资源。\n\n　　香港经营主体跨境登记无现成先例。在广东省市场监督管理局(知识产权局)、广东省知识产权保护中心指导下，广州商标审查协作中心(广东省知识产权开发与服务中心)及相关服务机构与香港乾盛映像传媒有限公司建立港企跨境数据知识产权协同服务机制，破解香港企业资质核验、跨境合规、平台注册无先例等多项难题，落实两地监管要求，保障数据集权属清晰合规。\n\n　　香港乾盛映像传媒有限公司项目负责人表示：“这份登记证书，为我们香港自研的数据资产颁发了合法的‘数字身份证’。”\n\n　　近年来，广东省市场监督管理局(知识产权局)依托广东数字经济产业优势，统筹推进制度构建、登记实践、交易运用、权益保护、宣传推广全链条工作，为数据要素市场化配置改革提供有力支撑。\n\n　　截至2026年10月，广东省数据知识产权累计申请8699件，颁发证书5914件；落地数据知识产权质押70单，融资约13亿元；促成数据知识产权交易、保险、证券化金额2437.96万元；登记覆盖生物医药、先进制造、新一代电子信息、数字文创等多个重点产业领域。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c09a79539a6","title":"豪擲66萬｜遼寧千萬網紅收夫「現金花束」慶生 遭批炫富兼涉違法急刪片","url":"https://www.stheadline.com/realtime-china/3639009/豪擲66萬遼寧千萬網紅收夫現金花束慶生-遭批炫富兼涉違法急刪片","summary":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。","summary_short":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。","digest":"遼寧錦州近日一場高調生日宴引發內地網絡熱議","points":["遼寧錦州近日一場高調生日宴引發內地網絡熱議","一名男子為慶祝妻子41歲生日，竟豪擲66萬元（人民幣，下同）的百元大鈔…","事發於周三（18日）深夜，有網民在社交平台發布一段生日會現場片段…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:30:50+08:00","size":1,"keywords":[],"body":"遼寧錦州近日一場高調生日宴引發內地網絡熱議。一名男子為慶祝妻子41歲生日，竟豪擲66萬元（人民幣，下同）的百元大鈔，紮成巨型「現金花束」贈予愛妻，場面相當誇張。相關片段在社交平台瘋傳後，隨即惹來網民批評炫富及質疑違法；事件發酵後，涉事網紅今日（19日）將帳號內所有影片全數清空。 \n稱「物質是表達愛最好方式」 \n事發於周三（18日）深夜，有網民在社交平台發布一段生日會現場片段，顯示場內擺放著一束體積龐大的現金花束。替同行代班拍攝的攝影師向內地傳媒透露，現場是一名丈夫為41歲妻子慶生，該巨型花束全數由66萬元的百元大鈔紮成。 \n場地工作人員亦證實，該66萬元現金花束為男方送給妻子的生日禮物，兩人育有3名子女，女方是坐擁千萬粉絲的知名網紅，花束由當事人自行委託花店製作。針對有網民留言提醒「用人民幣紮花屬違法行為」，工作人員表示並不知情，並指網上不少人仿效及有花店提供相關服務。 \n綜合內媒報道，該名擁有逾1,200萬粉絲的女網紅於18日晚曾連發多段生日會影片，並感性發文稱：「愛不需要錢，但證明愛需要，物質不能代替愛情，但卻是表達愛的最好方式。」不過，隨着事件登上熱搜並，大批網民批評「俗不可耐」、「赤裸裸炫富」後，涉事女網紅、攝影師及場地方的社交帳號於今日下午均已刪除相關片段，女網紅的個人帳號作品更顯示為「0」，連帶其生日會直播帶貨的回放紀錄亦一併下架。 \n據悉，涉事網紅是快手平台的胡顏雪，其丈夫為熊健。目前胡顏雪的帳號已改為私密狀態。\n律師：妨礙貨幣流通屬不當使用 \n針對「現金花束」的法律爭議，河南澤槿律師事務所主任付建指出，根據《中華人民共和國人民幣管理條例》，人民幣作為國家法定貨幣，禁止故意毀損或妨礙其正常流通。即使以平鋪方式製作花束未有造成紙幣破損，但將貨幣當作裝飾擺件使用、使其脫離支付流通功能，已屬「不當使用人民幣」。 \n付建補充，行政機關可對相關行為人或花店經營者予以警告，若涉及大量使用或公開售賣此類花束且情節較重者，更可並處罰款。\n武漢大學社會學教授尚重生則批評，用巨額現鈔紮花看似浪漫實則並不高雅，是一種低級的表達方式，且存在治安及財物安全隱患。他強調，千萬級粉絲的網紅其流量與財富皆來自社會大眾，此類高調炫富行為極易對粉絲尤其是青少年群體的價值觀造成不良誤導。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c73d31493db","title":"（深圳APEC）以船为喻，中国向亚太发出“同舟之约”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734948.shtml","summary":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。","summary_short":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。","digest":"11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象","points":["中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼…","作为全球单体规模最大的集装箱码头之一，这里每周有53条直通亚太经合组织(APEC)成员经济体…","中国的新能源汽车、照相机由此出海，马来西亚榴莲、智利车厘子跨海而来"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T22:25:14+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 刘文文)11月的深圳，入夜微凉，盐田港灯火如昼，一派繁忙景象。作为全球单体规模最大的集装箱码头之一，这里每周有53条直通亚太经合组织(APEC)成员经济体的航线。中国的新能源汽车、照相机由此出海，马来西亚榴莲、智利车厘子跨海而来。在亚太地区，类似的航程每时每刻都在发生。彼此相连，也意味着休戚与共。\n\n　　11月19日，在深圳举行的APEC第三十三次领导人非正式会议上，中国国家主席习近平指出，亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，携手应对困难和挑战，持续培育共同体意识。他提出，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　四个关键词勾勒出亚太合作的新航向，也回答了一个现实问题：面对风高浪急的国际环境，亚太这艘大船如何行稳致远？\n\n　　风浪面前，首先要同舟共济。\n\n　　APEC21个经济体覆盖约30亿人口，经济总量约占全球GDP六成，贸易额占全球近一半，成员间产业链供应链深度互嵌。\n\n　　“没有人能单打独斗”，智利总统卡斯特说，有一些人有资源，剩下的人可能有技术，其他人有资本。只有大家一起开放市场，才能共存。\n\n　　当单边主义、保护主义掀起风浪，团结协作就是成本最低的“避险资产”。亚太经济体拉紧共同利益纽带，亚太这艘“大船”方能行稳。\n\n　　船要行得远，还要有畅通的航道。\n\n　　摩根大通中国区联席首席执行官、亚太区首席财务官何耀东表示，互联互通将带来新的经济机遇。在秘鲁，钱凯港开港两年来，中秘海运时间缩至最短23天。在印度尼西亚，雅万高铁重塑了爪哇岛经济格局。\n\n　　天丝集团首席执行官许馨雄表示，对于亚太各经济体而言，开放融通能够放大比较优势，打通要素流动堵点，共享市场扩容、技术互鉴、规则对接的红利，天丝集团正是亚太开放融通的受益者。\n\n　　要驶向新航程，还需要不断注入创新动力。\n\n　　如今，新一轮科技革命和产业变革正在重塑全球竞争格局。对于亚太经济体而言，创新不是“选择题”，而是稳住增长、化解风险、实现共同发展的“必答题”。\n\n　　中国企业研究院首席研究员李锦表示，过去各种案例已反复验证，创新既能帮助单个经济体转型升级，也能通过区域协同一起抵御外部风险、共享发展红利。\n\n　　如今，中国的新技术新产业加快走向亚太。在智利圣地亚哥市郊，中国设计的智慧农业无人机精准作业，帮助当地农场减少农药和水的使用。\n\n　　大船要走得稳，更不能落下任何一位同行者。\n\n　　亚太经济体多样性突出，发展诉求各异。在毕马威中国副主席、华南区首席合伙人伍耀辉看来，如何把“共同繁荣”的愿景转化为各经济体、各类企业都能参与并且能够受益的具体合作极为关键。\n\n　　中国银联股份有限公司董事长董俊峰说，印度尼西亚约有3500万、越南约有1600万小商户没有POS机，银联为其提供线下二维码收款牌，全球银联持卡人扫码即可购买越南芒果、泰国榴莲。一张张二维码，把亚太小商户接入了跨国消费网络。\n\n　　今年是中国“十五五”开局之年，中国为亚太提供新的“机遇清单”，也向各方发出“登船”邀请。从“同舟之约”到共同繁荣，亚太千帆，乘风共进。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3737614351","title":"在深圳APEC，全球CEO共话产业发展新方向","url":"https://www.chinanews.com/shipin/2026/11-19/news1075507.shtml","summary":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。","summary_short":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。","digest":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕","points":["11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕","峰会以“共促繁荣，共赢未来”为主题，为期两天，吸引了2000余位政商代表参会","在这场全球经贸最前沿，多位CEO接受了三里河的采访，从他们反复提及的关键词中…"],"section":"內地","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T22:22:35+08:00","size":1,"keywords":[],"body":"11月18日，由中国贸促会主办的2026年APEC工商领导人峰会在深圳圆满落幕。峰会以“共促繁荣，共赢未来”为主题，为期两天，吸引了2000余位政商代表参会。在这场全球经贸最前沿，多位CEO接受了三里河的采访，从他们反复提及的关键词中，我们能瞥见全球产业的未来趋势。(戴悦 董羽辰 黄蕾 迟瀚宇 李金磊 宫宏宇）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/b0580201-8856-4188-bf5f-74c32477c0f1.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ca97a0771a5","title":"八分鐘兩岸新聞重點｜中俄美元首會晤／APEC會議習近平講話／澳門大賽車","url":"https://news.tvb.com/tc/1207327-八分鐘兩岸新聞重點中俄美元首會晤APEC會議習近平講話澳門大賽車","summary":"【中俄美元首會晤｜習近平：三國播下種子必開花結果】國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言，包括計劃增加石油產量、進行對話減少核風險。習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果。","summary_short":"【中俄美元首會晤｜習近平：三國播下種子必開花結果】國家主席習近平、俄羅斯總統普京及美國總統特朗普…","digest":"【中俄美元首會晤｜習近平：三國播下種子必開花結果】國家主席習近平…","points":["【中俄美元首會晤｜習近平：三國播下種子必開花結果】","國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言…","習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T22:19+08:00","size":1,"keywords":[],"body":"【中俄美元首會晤｜習近平：三國播下種子必開花結果】\n\n國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言，包括計劃增加石油產量、進行對話減少核風險。習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果。\n\n【習近平稱應避免中美關係出現大波折】\n\n中俄美元首會晤前，中美、美俄元首分別舉行雙邊會談。國家主席習近平會見美國總統特朗普時稱，在台灣問題上美方要堅持做正確的事，避免兩國關係出現大波折。特朗普稱美方不支持「台獨」。\n\n【APEC領導人會議｜習近平籲成員經濟體攜手應對挑戰】\n\n亞太經合組織(APEC)領導人非正式會議在深圳召開，國家主席習近平主持會議並發表講話，呼籲各成員經濟體守望相助應對挑戰，中方會提供2,000萬美元，在深圳設立「亞太共同體研究中心」，開展政策研究和交流。\n\n【APEC｜馬斯克自稱中國超級粉絲】\n\n特斯拉公司首席執行官馬斯克在深圳出席APEC相關活動，自稱是中國超級粉絲，又盛讚中國到處是壯麗景色。\n\n【寒潮持續影響內地多地降雪降溫】\n\n寒潮持續影響內地，多地降雪降溫，中國天氣網推出全國羽絨服預警地圖，將氣溫數據轉成穿衣建議，方便民眾參考。\n\n【澳門大賽車｜首日上演多項練習賽和排位賽】\n\n第73屆澳門格蘭披治大賽車開鑼，首日上演多項練習賽和排位賽，有16歲的澳門本地女車手，首次出戰澳門四級方程式大賽。","image":"https://pro-vod-cdn.tvb.com/31da978970204988a75fb311e22dd796/snapshots/4070157d3a10489095ba6adeb095d85d-00008.jpg","video":"https://pro-vod-cdn.tvb.com/31da978970204988a75fb311e22dd796/15eb196564bb4a26babfa98912939434-c91ecd1a46d41b5e431a507c0793a515-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/31da978970204988a75fb311e22dd796/snapshots/4070157d3a10489095ba6adeb095d85d-00008.jpg","lang":"zh-Hant"},{"id":"c50d0b3c25c","title":"（近观中国）“鹏城”之会，习近平寄语亚太合作鹏程万里","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734949.shtml","summary":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。","summary_short":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。","digest":"“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里","points":["中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞…","”19日在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议上…","30多年来，亚太地区经济快速发展，面貌日新月异"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T22:09:14+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 张素)“期待在我们共同努力下，亚太合作像大鹏一样展翅高飞、鹏程万里。”19日在深圳举行的亚太经合组织(APEC)第三十三次领导人非正式会议上，中国国家主席习近平这样寄语亚太合作。\n\n11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议。中新社记者 赵文宇 摄\n\n　　深圳又名“鹏城”。在中国古籍里，相传鹏鸟能飞万里路程，由此引喻前程远大、前景无限。\n\n　　30多年来，亚太地区经济快速发展，面貌日新月异。构建亚太共同体是实现本地区长远发展繁荣的必由之路，也是各方的共同愿景。\n\n　　此次“鹏城”之会，着眼推动建设亚太共同体，习近平强调要“和衷共济”“开放融通”“开拓创新”“包容发展”。\n\n　　“这16个字里既有传承也有创新。”中国外交学院院长高飞说，一方面是对APEC推进区域经济一体化等成功经验的概括总结，另一方面融入“你中有我、我中有你”的共同体意识。\n\n　　“和衷共济”一词被置于首位。习近平指出，“浩瀚的太平洋承载千帆、滋养万物”，强调“亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助”。\n\n图为深南大道的APEC主题花坛花团锦簇。中新社记者 陈楚红 摄\n\n　　在习近平的APEC时间里，他曾多次以“船”为喻，提出重大理念主张。中国国际问题研究院亚太研究所所长蓝建学说，中方此次强调“和衷共济”，既是直面单边主义、地缘对抗等当前存在的“风浪”，也意在以“求同存异、和合共生”的智慧凝聚力量，为亚太合作开创新局面。\n\n　　在系统阐述亚太共同体丰富内涵的同时，习近平也为其指明建设路径。从强化经贸支柱到升级联通支柱，从打造创新支柱到夯实发展支柱，中方表示愿同各方一道携手搭建亚太共同体的“四梁八柱”。\n\n　　中国社会科学院亚太与全球战略研究院研究员许利平说，亚太共同体建设已取得一系列务实成果。面向2040年建成亚太共同体这一愿景，中方作为东道主适时提出搭建“四梁八柱”，将助力破解建设过程中的堵点、难点，进一步汇聚行动合力。\n\n　　以互联互通领域为例，习近平今次强调要巩固“硬联通”，增强“软联通”，密切“心联通”，提出“推动智慧海关、智慧交通建设”“深化跨境支付合作”等一系列举措。\n\n　　高飞表示，互联互通是区域合作的纽带。相关举措有助于为未来区域经济一体化夯实基础，也将为亚太乃至全球繁荣增长注入动力。\n\n　　中国是亚太经济合作的倡导者、推动者、先行者，也是积极的行动派。在深圳这座充满未来感的城市，习近平提出，中方将立足亚太合作，在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。此外，旨在提供智力支撑的亚太共同体研究中心也将落户“鹏城”。\n\n　　蓝建学表示，数字经济和人工智能是创新增长的引擎。这将为搭建“四梁八柱”进一步提供支撑，将合作共识落到实处。\n\n　　“在这些新兴领域，亚太经济体拥有广阔的合作空间。未来取得丰硕成果，不仅将为推进建设亚太共同体提供新的路径，也可更好造福地区人民。”许利平说。\n\n　　“大鹏一日同风起”，2026APEC“中国年”的会标取自鲲鹏意象，21根交织的羽翼宛如振翅凌云。这既是APEC21个经济体共生共荣的生动缩影，也承载着东道主对于“乘大势、共翱翔”的美好期许。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc2efb3ba6e","title":"（深圳APEC）事关中国经济 外媒五大关切在深圳找到答案","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734942.shtml","summary":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸  　　“中国挤压了别国发展空间？","summary_short":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸  　　“…","digest":"题：事关中国经济 外媒五大关切在深圳找到答案  　　中新社记者 张焕迪 国璇 尹倩芸…","points":["中新社记者 张焕迪 国璇 尹倩芸","新西兰NZINC公司总经理弗兰·奥沙利文用事实给出回答…","2025年，新西兰32%的乳制品、55%的木材、41%的肉类和34%的羊毛销往中国"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:50:45+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：事关中国经济 外媒五大关切在深圳找到答案\n\n　　中新社记者 张焕迪 国璇 尹倩芸\n\n　　“中国挤压了别国发展空间？”“中国新能源真的‘产能过剩’？”……一段时间以来，外媒对中国经济有种种疑问。\n\n　　当亚太经合组织(APEC)大家庭齐聚深圳，这些问题在这座“奇迹之城”找到了答案。\n\n　　问题一，“中国挤压了别国发展空间？”\n\n　　新西兰NZINC公司总经理弗兰·奥沙利文用事实给出回答：新西兰是第一个与中国签署自贸协定的发达国家，这些年从与中国的合作中“受益良多”。\n\n　　2025年，新西兰32%的乳制品、55%的木材、41%的肉类和34%的羊毛销往中国。\n\n　　“不论是新技术发展、生产力提升，还是工作岗位增加，亚太地区伙伴都从中国的发展中受益。”澳大利亚总理阿尔巴尼斯说。\n\n　　合作，是深圳“APEC时间”的高频词。大批商界人士带着合同赴“深圳之约”，中国的发展为亚太增长提供了坚实支撑。\n\n　　问题二，“中国AI技术‘成色’究竟如何？”\n\n　　在华强北，在深圳湾文化广场，在APEC新闻中心的机器人身上，答案呼之欲出。\n\n　　“中国人工智能技术和机器人产业发展迅猛，很多国家望尘莫及。”尼日利亚记者马克·朗延感叹。首次来华的德国客商托马斯认为，中国在AI领域已领先德国。\n\n　　透过深圳这扇窗，人们看到，中国AI竞争力的来源在于持之以恒的自主创新与长期积累。\n\n　　泰国国家会议展览局局长苏帕万·提拉拉特说，他尤其看重深圳在AI领域的创新能力，期待与至少1000家深圳企业合作。\n\n11月17日，位于广东深圳的中国首个具身智能机器人示范街区上演一场大型机器人表演，以“机器人总动员”迎接APEC。　中新社记者 陈楚红 摄\n\n　　问题三，“中国对外资吸引力下降？”\n\n　　泰国中华总商会副主席李桂雄的回答是：中国的发展实实在在，“外界怎么讲都推翻不了”。\n\n　　统计显示，今年前7个月中国新设立外商投资企业超3.7万家，高技术产业实际使用外资同比增长32.7%。\n\n　　115家世界500强企业代表齐聚前海，APEC工商领导人峰会现场座无虚席。商界人士“用脚投票”，充分表明了中国市场对外资的吸引力。\n\n　　问题四，“中国新能源产能过剩？”\n\n　　“这种说法本身十分自私。”加拿大韦博网讯科技(WPIC)首席执行官雅各布·库克说。\n\n　　有分析指出，部分国家炒作中国新能源“产能过剩”，意在维护自身产业地位、遏制中国产业升级，是以产能过剩之名行贸易保护之实。\n\n　　此次在深圳，多位APEC成员经济体领导人对封闭和贸易保护说“不”。马来西亚总理安瓦尔说，任何国家都不可能在孤立的情况下实现发展。韩国总统李在明称，为了打造稳定的产业基础与供应链，各方必须深化合作。\n\n11月15日，中外客商在深圳华强电子世界选购商品。中新社记者 张祥毅 摄\n\n　　问题五，“中国经济发展前景如何？”\n\n　　从边陲小镇到国际化大都市，深圳的发展历程就是最好的答案。\n\n　　今天的深圳汇聚了来自100多个国家和地区的国际化人才，掌纹支付、飞行汽车等创新不断刷新想象。“希望我的祖国也能有一个深圳”，一名西班牙学者的感慨引发众多海外网友共鸣。\n\n　　在这座“奇迹之城”，外国友人感受到了中国经济的活力，也捕捉到了中国发展带给世界的机遇。(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c541ec05fb3","title":"（深圳APEC）说粤语的泰国总理","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734860.shtml","summary":"中新社深圳11月19日电 题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心！","summary_short":"中新社深圳11月19日电 题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心！","digest":"题：说粤语的泰国总理  　　中新社记者 门睿  　　“好开心","points":["中新社深圳11月19日电 题：说粤语的泰国总理","”18日，泰国总理阿努廷在深圳用一句地道粤语，形容来到广东的感受","源于这种亲切感，每次我见到中国人都很开心"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:39:58+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：说粤语的泰国总理\n\n　　中新社记者 门睿\n\n　　“好开心！”18日，泰国总理阿努廷在深圳用一句地道粤语，形容来到广东的感受。\n\n　　对于阿努廷而言，广东有着特殊的意义。\n\n　　阿努廷祖籍广东。他曾在接受中国媒体采访时说：“我的父母、祖父祖母、外祖父外祖母都来自中国。我在泰国出生，有中文名字，家里也说粤语。源于这种亲切感，每次我见到中国人都很开心。”\n\n　　11月18日，阿努廷在2026年亚太经合组织(APEC)工商领导人峰会上发表演讲时用中文问好。一句“大家下午好”，引得现场响起掌声。\n\n11月18日，泰国总理阿努廷在深圳出席2026年亚太经合组织工商领导人峰会。　中新社记者 赵文宇 摄\n\n　　此次深圳之行并非阿努廷第一次“秀中文”。\n\n　　2023年1月，时任泰国副总理兼卫生部长的阿努廷亲赴曼谷素万那普国际机场，迎接中国游客。他在现场用中文说：“泰国人欢迎朋友们从中国来泰国玩。”消息传到中国，引发广泛讨论。\n\n　　今年7月，阿努廷就任泰国总理后首次正式访华。访问期间，他在社交媒体用中文发文“中泰一家亲” “上海中国”。10月，他再次在社交媒体发布中文“很好”，并配上了一张他与父亲差瓦拉在桌旁交谈的照片。\n\n　　差瓦拉中文名陈景镇，是泰国联泰工业建筑公司创始人。1998年，他曾回到广东新会祭祖，并为家乡村庄捐资修路。\n\n　　这正是海外华人心系故土的一道缩影。历史上，大批广东人离开故土到海外寻找发展机会。他们积极融入当地社会，成为联系祖(籍)国与住在国的桥梁。有数据显示，粤籍海外华侨华人有近3000万。\n\n　　五邑大学教授张国雄接受中新社记者采访时表示，无论是回馈桑梓还是语言传承，阿努廷父子的经历都体现出海外华人对中华文化的认可，以及华人与故乡割舍不断的血脉亲情。\n\n　　这种跨越时间与地域的情感，也体现在近年来频见报端的海外华人寻亲故事中。\n\n　　2025年，南太平洋岛国瑙鲁总统戴维·阿迪昂到外曾祖父的祖籍地——广东江门开平市赤坎镇中股村寻根谒祖。今年春节前夕，他再度到访，并写下“福”字赠与族亲。\n\n　　今年9月，马来西亚南侨机工后人张慧清在昆明街头“偶遇”外公邝金源的照片，她将这段经历拍摄成视频，发布在社交媒体。邝金源祖籍广东台山，曾瞒着家人加入南侨机工队伍，奔赴滇缅公路抢运物资，支援中国抗战。这段动人往事感动众多网友。视频发出十几天后，张慧清也在广东台山市台城街道岭背村完成认祖。\n\n　　“从这些家族故事中我们能看到，尽管已经过去了几代人的时光，海外华人在地域上也与家乡远隔重洋，但他们对故土亲情与中华文化的认同不会随着时间和距离淡化。”张国雄说。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdce33c36fa","title":"巴基斯坦华文学校校长马斌：为当地孩子打开一扇看中国的窗","url":"https://www.chinanews.com/hr/shipin/cns-d/2026/11-19/news1075503.shtml","summary":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","summary_short":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。","digest":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行","points":["11月18日至19日，第六届世界华文教育大会在海南博鳌举行","巴基斯坦华文教育协会会长、中巴教育文化中心校长马斌介绍，该校2013年建立…","马斌表示，此前巴基斯坦许多当地民众希望了解中文、了解中国文化，但是没有途径"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T21:22:42+08:00","size":1,"keywords":[],"body":"11月18日至19日，第六届世界华文教育大会在海南博鳌举行。\n\n巴基斯坦华文教育协会会长、中巴教育文化中心校长马斌介绍，该校2013年建立，是巴基斯坦首所华文学校，课程涵盖剪纸、武术、汉语、数学等。\n\n马斌表示，此前巴基斯坦许多当地民众希望了解中文、了解中国文化，但是没有途径。华文学校的建立，为当地民众搭建起系统了解中国文化的平台。(记者 李宇凡 王子谦)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/99CAA2C5C06F4EDB869538A953734402.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c40c1d2266f","title":"（深圳APEC）深圳APEC“摆桌”促对话：场边外交密集进行","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734912.shtml","summary":"中新社深圳11月19日电 题：深圳APEC“摆桌”促对话：场边外交密集进行  　　中新社记者 张焕迪  　　亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在深圳举行。","summary_short":"中新社深圳11月19日电 题：深圳APEC“摆桌”促对话：场边外交密集进行  　　中新社记者 张焕迪  　　亚太经合组织…","digest":"题：深圳APEC“摆桌”促对话：场边外交密集进行  　　中新社记者 张焕迪  　　亚…","points":["亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在深圳举行","17日，加拿大总理卡尼与墨西哥总统辛鲍姆会面","18日，卡尼与美国总统特朗普会面，讨论一项互利贸易协议，涉及就业以及加拿大的语言…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T21:15:03+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：深圳APEC“摆桌”促对话：场边外交密集进行\n\n　　中新社记者 张焕迪\n\n　　亚太经合组织(APEC)第三十三次领导人非正式会议18日至19日在深圳举行。会场内，各成员经济体围桌而坐，共商亚太合作；会场外，东道主中国又摆开一张张桌子。谁与谁会晤、谈些什么，由各方自行安排。谈成与否，话总要先接上。\n\n　　17日，加拿大总理卡尼与墨西哥总统辛鲍姆会面。两国重申续签《美国-墨西哥-加拿大协定》的承诺，还谈到加强关键矿产、能源、先进制造等领域合作。\r\n\n　　18日，卡尼与美国总统特朗普会面，讨论一项互利贸易协议，涉及就业以及加拿大的语言、文化和主权等问题。两国同意继续保持密切沟通。\n\n　　同日，辛鲍姆在深圳与特朗普见面后表示，双方在共同议程上继续取得进展。据悉，两国当前正推进旨在缓解贸易紧张的谈判。\n\n　　也是在同一天，俄罗斯总统普京同泰国总理阿努廷举行会谈，谈及双边关系、贸易增长以及在能源、交通、农业等领域的合作。\n\n　　在多边场合开展双边外交是国际惯例。多边会议提供场合，双边会见处理具体问题。这样的场景，在中国主办的多边会议上已属常见。\n\n　　2018年上合组织青岛峰会期间，吉尔吉斯斯坦与塔吉克斯坦两国总统举行会谈，聚焦两国边界划界和地区安全。两个中亚国家，借一次峰会，把争议多年的边界划界问题再次摆上桌面。\n\n　　2025年，普京与印度总理莫迪在上合组织天津峰会期间举行会晤，讨论双边关系以及乌克兰问题。值得注意的是，两人是在同一辆车上交谈了近一小时。一次不那么正式的见面，讨论的仍然是事关地区乃至世界局势的重要议题。\n\n　　密集的场边对话，往往是为了解开具体领域的“结”。多边共识定方向，双边沟通理脉络，亚太合作的纽带正是在这一次次接触中被不断拉紧。\n\n　　从欧洲国家领导人在第三届“一带一路”国际合作高峰论坛期间磋商，到各国经贸官员在上海进博会的展场内外对接合作，中国主办的多边会议和大型活动，正日益成为各方开展场边外交的公共平台。\n\n　　深圳这几天，这么多场重要会见密集进行，正是因为各方相信中国提供的这张桌子可用、可靠：氛围融洽，不预设议程，不居中干涉，来了就能坐下谈。\n\n　　而桌子周围，又有着广阔的市场、实在的机遇以及可预期的合作环境。\n\n　　会议有会期，对话无终点。只要各方愿意坐到一起，交流的窗口就会一直敞开。愿意坐下来的人，也总会在中国找到一张合适的桌子。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1fbb012379","title":"【和合共生】习言道｜大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075491.shtml","summary":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤","points":["11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤","习近平指出，大国和，则世界安"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:28:14+08:00","size":3,"keywords":[],"body":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平指出，大国和，则世界安；大国斗，则世界乱。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/fbab2f98-1292-4c06-80a0-d15e96b85562.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"【和合共生】习言道｜大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075491.shtml","source_display":"中新視頻","published_at":"2026-11-19T20:28:14+08:00","category":"內地","digest":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤"},{"title":"【和合共生】习言道｜习近平与深圳的“大故事”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734813.shtml","source_display":"中新網 時政","published_at":"2026-11-19T19:04:42+08:00","category":"內地","digest":"题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方"},{"title":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075480.shtml","source_display":"中新視頻","published_at":"2026-11-19T18:44:24+08:00","category":"內地","digest":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事"}],"cross":{"total":3,"angles":[{"point":"【和合共生】习言道｜在台湾问题上，美方要坚持做正确的事","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075480.shtml"},{"point":"题：习近平与深圳的“大故事”  　　“深圳是一个有大故事的地方","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734813.shtml"},{"point":"11月19日，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075491.shtml"}]}},{"id":"cead673d2a7","title":"【深圳APEC】记者会现场生动一幕！王毅入场响起热烈掌声 ，外长微笑鞠躬回应","url":"https://www.chinanews.com/gn/shipin/cns-d/2026/11-20/news1075517.shtml","summary":"深圳APEC会议记者会11月19日晚举行，中共中央政治局委员、外交部长王毅介绍情况。","summary_short":"深圳APEC会议记者会11月19日晚举行，中共中央政治局委员、外交部长王毅介绍情况。","digest":"深圳APEC会议记者会11月19日晚举行，中共中央政治局委员、外交部长王毅介绍情况","points":["深圳APEC会议记者会11月19日晚举行，中共中央政治局委员、外交部长王毅介绍情况"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T08:23:31+08:00","size":1,"keywords":[],"body":"深圳APEC会议记者会11月19日晚举行，中共中央政治局委员、外交部长王毅介绍情况。现场现生动一幕：王毅入场时响起热烈掌声，外长微笑鞠躬回应。(记者 刘子衿 迟瀚宇）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/38F382D2FAFA4B63A2BA2C09B8F5DA24.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c7826ed92b5","title":"APEC 1+1丨共促亚太繁荣：中国的建议与邀约","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734893.shtml","summary":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。","summary_short":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。","digest":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕","points":["17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕","在18日一系列的议程当中，APEC工商领导人峰会开幕式是最受瞩目的焦点","中国强调并始终推动开放、创新与合作"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:44:37+08:00","size":1,"keywords":[],"body":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。在18日一系列的议程当中，APEC工商领导人峰会开幕式是最受瞩目的焦点。中国强调并始终推动开放、创新与合作。这对亚太地区乃至世界会产生怎样的影响？“十五五” 规划蕴含哪些机遇惠及全球工商界？“世界湾区经济合作联盟”是什么？\r\n\n　　“十五五”规划蕴含哪些机遇惠及全球工商界？\n\n　　总台央视记者 徐卓阳：我在现场的时候感触很深。中国“十五五”和全球工商界是一体的、双向联动的。\n\n　　先说APEC对于“十五五”的意义。今年是中国第三次承办APEC，恰逢“十五五”开局之年，这场会议正是我们“十五五”开局阶段最重要的主场外交。\n\n　　再看“十五五”对于APEC能起到怎样的作用。我第一天连线时就谈到，期待来到深圳参会的嘉宾能够读懂中国质量。中国质量当中很重要的是经济质量，经济质量里很关键的一点，就是在全球经贸环境复杂多变的背景下，中国坚持以中长期规划统筹经济社会发展。这原本是我们自身发展的制度定力，而在亚太、在全球工商界眼中，这份定力正在形成一种独特的吸引力。\n\n　　就在峰会首日的工商对话上，全美商会会长克拉克谈到，地缘形势瞬息万变，企业最需要长期、稳定的信任关系。信任从哪里来？主旨演讲里提到的开放市场、广阔发展空间、互促共进的合作环境，都是大家可以信赖的支撑。\n\n　　而长期就体现在“十五五”这份规划上。五年周期对企业经营来说，是非常珍贵的定心丸，是企业求之不得的稳定预期。更大的长期则来自持续编制实施五年规划这套制度本身，“十五五”之后，还有“十六五”“十七五”，中国开放的大门只会越开越大，不会关上。\n\n　　所以对到场的全球工商界人士来说，他们收获的不只是一份合作邀约。面向未来共建亚太共同体、共促繁荣，中国有充足的诚意，在“十五五”乃至更长周期里持续敞开大门，欢迎各方伙伴前来携手合作。\n\n　　“世界湾区经济合作联盟”是什么？\n\n　　徐卓阳：这是全新的提法，非常激动人心，想象空间很大。我梳理三点理解。\n\n　　第一，全球公认的四大湾区，纽约湾区主打金融，旧金山湾区科创突出，东京湾区是历史上成熟的制造业，粤港澳大湾区起步最晚，但发展速度最快、市场潜力最大。现在湾区之间互动不少，但大多停留在企业、行业、个人这类微观层面，还缺少一个平台化的跨湾区经贸合作机制，一旦形成这样的协作平台，能够释放的能量值得期待。\n\n　　第二，这个联盟是全新的，我们都不知道长什么样子，是不是先把粤港澳大湾区的实践当作参照？我去搜了一下，大湾区已经有企业家联盟，还有会展、时尚等各类行业联盟，从官方到民间已经长出很多协同合作的载体，这些成熟经验，是不是可以为这个跨湾区新构想提供借鉴？\n\n　　接下来就是我个人最感兴趣的地方，既然这个新词是在深圳向世界提出的，向亚太提出的，接下来如果这个联盟有一个常设的理事处或者秘书处，会放在深圳吗？这会是本次APEC留给这个主办城市的一个长期的馈赠吗？是不是非常值得期待。联盟成立以后会有哪些活动？会对亚太非湾区经济体形成什么样的带动作用？给整个湾区注入什么样的新的活力？我觉得这个圈一划，有着对未来无穷的想象、无穷的力量。\n\n　　开放的共识如何转化成实际的行动？\n\n　　徐卓阳：18日的主旨演讲中提到，中国其实是一个巨大的创新实验场，天下大事，必作于细。这不就是落地嘛！华强北从改革开放发展到今天，生态已经越做越大，场所越来越新，往来的人越来越多。但是你要去看它最旺盛的生命力，还是在一个个小小的档口里面，在一些最细节的事情上面。\n\n　　《深圳特区报》上有华强北的整版报道，里面有一个细节我特别有感触。这边商户跟记者说，大厂偏好量大、技术方案成熟的订单；而来到这里的订单体量小，技术还处在起步阶段，最主要的是方案需要反复调来调去。\n\n　　在这里，大家都会非常耐心，帮你持续调试打磨。所以我觉得把小事做到极致，一个又一个小的梦想从这里起步、起飞，慢慢孕育成今天的华强北。说到大和小的关系，泰山不辞细壤，故能成其大。广阔的大市场里，一定会有这样小小的窗口；而一个个小窗口经过时间的孕育不断生长，到今天，这就是深圳这座“世界之窗”。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c30d82f0e54","title":"聚焦APEC丨亚太同心，共话合作新愿景","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734892.shtml","summary":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。","summary_short":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。","digest":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行","points":["11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行","来自亚太经合组织(APEC)21个经济体和英国、法国、德国…","从硬联通夯实物流基础，到软联通对接标准规则，再到心联通增进认同理解，互联互通不断向更深层次…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:43:15+08:00","size":1,"keywords":[],"body":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。来自亚太经合组织(APEC)21个经济体和英国、法国、德国、瑞士等13个域外经济体的2000余位政商界代表齐聚南海之滨，深入探讨亚太区域开放合作、繁荣发展大计，携手集众智、促合作、求共赢。\r\n\n　　互联互通不断走深走实\n\n　　从硬联通夯实物流基础，到软联通对接标准规则，再到心联通增进认同理解，互联互通不断向更深层次、更广领域延伸，为推进亚太自贸区建设积蓄务实力量。\n\n　　-数智合作激活创新引擎\n\n　　数字经济浪潮澎湃，数智经贸合作也成为当前APEC各方共识基础最扎实、合作氛围最浓厚的领域。工商峰会上，中外嘉宾围绕贸易数字化、人工智能、数字服务等一系列议题深入交流，探讨如何加快创新应用落地与产业深度融合。\n\n　　-共促亚太繁荣美好未来\n\n　　《2026年亚太经合组织工商领导人峰会深圳倡议》18日对外发布，呼吁深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣。这是APEC工商领导人峰会创办30年来首次以倡议形式发布成果文件。\n\n　　扎根亚太、建设亚太、造福亚太，更加开放的中国正不断以中国式现代化新成就为亚太和世界提供新机遇。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdddbdc5dd5","title":"台胞胡良昇：APEC让世界看见新时代的深圳","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734871.shtml","summary":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新网11月19日电(燕新台)11月18日至19日…","深圳，这座“创新之城”再度吸引全球目光","一句“来了就是深圳人”鼓舞人心"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:40:37+08:00","size":1,"keywords":[],"body":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳，这座“创新之城”再度吸引全球目光。\n\n　　一句“来了就是深圳人”鼓舞人心\n\n　　“今年APEC落地深圳，我感触很深。”深圳台商协会副会长、青年委员会主任委员胡良昇表示，APEC让世界看见新时代的深圳，他观察到不少海外媒体和国际博主前来深圳实地探访，都给出了真实且高度的正面评价。\n\n　　“希望本次参会的各国嘉宾在亲身体验这座城市的包容理念、发展速度与城市温度之后，能发自内心地说出那句——来了就是深圳人。”胡良昇认为，这句话“非常自豪，也非常鼓舞人心”。\r\n\n　　台湾青年能收获成长，才值得扎根\n\n　　由深圳台商协会主办的“WAY！来深圳”台湾青年深圳实习活动已连续举办近20年，累计吸引3000余名台湾在校大学生参与。\n\n　　在胡良昇看来，真正让台湾青年愿意在深圳扎根的，是这座城市的机遇与发展含金量。\n\n　　2026年，200余名台湾青年进入深圳60余家企业实习，其中科技类岗位约占四成，覆盖人工智能硬件研发、云计算技术支持、智能交通算法开发、跨境数字网络运营等细分方向。\n\n　　“台湾青年可以进入深圳科创企业一线实战、开眼界、练能力。他们看得很清楚：能在这里成长，才值得在这里扎根。”胡良昇说道。\n\n　　成长环境，决定眼界与视野\n\n　　胡良昇觉得，自己在深圳最大的收获，是身边聚集了大量优秀、敢拼敢闯的创业者与青年，多和这类人相处，自身的认知、格局、节奏都会被拉高。\n\n　　深耕科技产品出海领域多年的胡良昇，将深圳对创业者的助力总结为三点：一是高精尖人才密集，寻找团队、合作与技术伙伴效率更高；二是产业链完整、迭代速度快，产品从研发、打样到落地出海全链路效率突出；三是政府对科创产业扶持力度大、政策落地快，让创业者更敢于投入、创新并布局长期发展。\n\n　　胡良昇说，深圳一直在进化、蜕变，也推着创业者跟着这座城市一同成长。\n\n　　台湾同胞一定能“爱上深圳”\n\n　　作为在深逐梦十余年的台湾创业者，胡良昇也早已把这里当成了自己的家。一口熟悉的家乡味、一通打回台湾的视频电话……每逢节日，他总会和在深台胞们欢聚一堂。\n\n　　胡良昇也向从未到过深圳的台湾同胞发出邀请：一定要亲自到这座城市走走看看，感受这里的科技实力、商业活力、艺术氛围、生活节奏和饮食文化，找到属于自己“爱上深圳”的理由，切身感受“来了就是深圳人”的城市魅力。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfa9b5f49c6","title":"“未名·AI Park”在北京揭牌 共建人工智能创新转化高地","url":"https://www.chinanews.com.cn/edu/2026/11-19/10734878.shtml","summary":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。","summary_short":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。","digest":"“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌","points":["中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国…","“未名·AI Park”是百年京张AI创新带上的重要节点，其核心启动区选址北京大学西门外…","北京大学党委书记何光彩表示，北京大学依托深厚的基础研究和学科交叉优势…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:38:15+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。“未名·AI Park”是百年京张AI创新带上的重要节点，其核心启动区选址北京大学西门外，旨在构建服务北京大学的“一公里转化圈”，立足北京大学优势AI学科资源与海淀科创沃土，打通“原始创新—技术攻关—成果落地—产业集聚”全链条。\n\n　　“未名·AI Park”由北京大学、北京市海淀区人民政府共建。\n\n“未名·AI　Park”在北京市海淀区中关村国际创新大厦正式揭牌。主办方供图\n\n　　北京大学党委书记何光彩表示，北京大学依托深厚的基础研究和学科交叉优势，持续推动科技创新与产业创新深度融合，把园区建成北京大学科技成果转化的核心承载区、海淀人工智能产业的特色地标。\n\n　　北京市海淀区委书记王少峰表示，海淀坚持把人工智能作为现代化产业体系的龙头和引领，全力建设具有全球影响力的人工智能产业高地；依托“五方六力”科技成果转化机制，推动政府服务向科研一线延伸，共同筑牢校地共建、产城共融的创新根基。\n\n　　中关村科学城管委会副主任、海淀区副区长唐超发布“未名·AI Park”人工智能创新街区(简称未名·AI Park)，从规划背景、空间布局、生态培育三个方面作出系统阐述，打造北京大学创新成果策源地、师生创业首选地、教育科技人才一体发展示范区。\n\n　　活动现场，北京大学计算机学院AI产学研协同创新基地、北京大学具身智能系统研究中心、北京大学AI+Math国际研究中心正式亮相。多场北京大学人工智能交叉领域科创项目路演接续开展；专家学者、企业家、投资机构齐聚，围绕技术攻关、项目孵化、产业合作开展面对面对接交流。\n\n　　下一步，北京市海淀区将以“未名·AI Park”为支点，撬动更多创新资源在北大周边集聚、向海淀全域辐射，培育更多前沿技术、优质项目和高端人才；要始终当好北大创新发展的合伙人，与政产学研金等各方，一起筑牢校地共建、产城共融的创新根基，为服务国家高水平科技自立自强作出新的更大贡献。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"台灣","total":2,"items":[{"id":"c7d240a421a","title":"在深台胞：今年APEC落地深圳，期待世界看见新时代的深圳","url":"https://www.chinanews.com/tw/shipin/2026/11-19/news1075493.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇在接受中国新闻网“燕新台”…","他坦言，借着这场国际盛会，非常期待让全世界真正看见新时代的深圳…"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:07:57+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇在接受中国新闻网“燕新台”工作室采访时表示，他观察到不少海外媒体和国际博主前来深圳实地探访，都给出了真实且高度的正面评价。他坦言，借着这场国际盛会，非常期待让全世界真正看见新时代的深圳，也特别希望各国嘉宾在亲身体验这座城市的包容理念、发展速度与城市温度之后，能发自内心地说出那句——来了就是深圳人。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/12aefe9c-f627-4dad-a8a3-962a80a72c3d.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c47fcc72e11","title":"深圳创业十余年台胞：这座城市永远在蜕变，台湾青年一定会“爱上深圳”","url":"https://www.chinanews.com/tw/shipin/2026/11-19/news1075492.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","深圳，这座“创新之城”再度吸引全球目光","“深圳最大的特质，就是永远不会停在过去的成绩里"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:07:48+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳，这座“创新之城”再度吸引全球目光。“深圳最大的特质，就是永远不会停在过去的成绩里。”深圳台商协会副会长、青年委员会主任委员、在深创业十余年的台胞胡良昇，近日在接受中国新闻网“燕新台”工作室采访时，分享了他眼中的深圳。他认为，深圳真正留住台湾青年的并非单纯的政策福利，而是这座城市不断迭代的产业和无可替代的机会含金量。他向岛内青年发出真诚邀约：亲自来体验这里的科技实力、商业活力、艺术氛围和饮食文化，一定会找到属于自己“爱上深圳”的理由。","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/12af1128-76da-480c-99cc-b72180b8e65d.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"國際","total":21,"items":[{"id":"cd869ca0cdd","title":"美媒：特朗普称不会在新年前“仓促”决定对伊行动","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734989.shtml","summary":"中新网11月20日电 据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前，他不会就伊朗问题的下一步行动“仓促”作出决定。","summary_short":"中新网11月20日电 据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前…","digest":"据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前…","points":["中新网11月20日电 据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示…","我们要看看新年之后局势如何发展","报道指出，特朗普发表此番言论之际，面临来自以色列看守政府总理内塔尼亚胡的巨大压力…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T06:45:16+08:00","size":2,"keywords":[],"body":"中新网11月20日电 据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前，他不会就伊朗问题的下一步行动“仓促”作出决定。\n\n美国总统特朗普。（资料图）\n\n　　“我不会仓促做出任何(关于伊朗的)决定。我们要看看新年之后局势如何发展。”特朗普说。\n\n　　报道指出，特朗普发表此番言论之际，面临来自以色列看守政府总理内塔尼亚胡的巨大压力，敦促他尽快对伊朗发动一场决定性的轰炸行动。\n\n　　报道援引知情人士称，白宫已要求五角大楼和情报专家评估，伊朗将如何应对美军制定的各项打击方案。\n\n　　据报道，以色列情报和特勤局(摩萨德)局长戈夫曼日前访问美国，与美中央情报局局长拉特克利夫和美总统特使威特科夫进行会谈。以色列消息人士称，戈夫曼是内塔尼亚胡的亲密顾问之一，他受内塔尼亚胡委派，敦促恢复对伊战争。\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"美媒：特朗普称不会在新年前“仓促”决定对伊行动","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734989.shtml","source_display":"中新網 環球","published_at":"2026-11-20T06:45:16+08:00","category":"國際","digest":"据美国阿克西奥斯新闻网站报道，美国总统特朗普19日表示，在新年到来之前…"},{"title":"特朗普表示不会在新年前“仓促”决定对伊朗行动","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734986.shtml","source_display":"中新網 環球","published_at":"2026-11-20T06:04:00+08:00","category":"國際","digest":"美国总统特朗普19日表示，在新年到来之前…"}]},{"id":"c295a63db2e","title":"梵高《盛放的栗樹》近15億元拍賣成交破紀錄","url":"https://www.stheadline.com/realtime-world/3639153/梵高盛放的栗樹近15億元拍賣成交破紀錄","summary":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上，以連佣金1.904億美元（約14.85億港元）成交，刷新梵高作品的公開拍賣紀錄。","summary_short":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","digest":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","points":["荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上…","這幅已有逾50年未公開展出的畫作，拍賣前一度捲入納粹時期的售畫爭議…","《盛放的栗樹》（Blossoming Chestnut Trees）創作於1890年5月…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:34:22+08:00","size":1,"keywords":[],"body":"荷蘭著名畫家梵高生前最後兩個月創作的名畫《盛放的栗樹》，周三在紐約蘇富比拍賣會上，以連佣金1.904億美元（約14.85億港元）成交，刷新梵高作品的公開拍賣紀錄。這幅已有逾50年未公開展出的畫作，拍賣前一度捲入納粹時期的售畫爭議，猶太裔前藏家後人指家族當年受到納粹逼害，被逼出售畫作。雙方最終在開拍前達成和解，令拍賣得以順利舉行。\n梵高《盛放的栗樹》畫作。 路透社\n生前最後兩個月創作\n《盛放的栗樹》（Blossoming Chestnut Trees）創作於1890年5月，當時梵高剛離開法國南部的精神病院，移居巴黎近郊的瓦茲河畔奧維爾村，並在當地度過生命最後兩個月。畫作描繪盛放的栗樹及樹蔭下的鄉村小路，一名被認為可能以梵高本人為原型的男子，正走過3名衣着鮮艷的女子，為作品增添神秘色彩。蘇富比指出，畫作展現梵高晚期作品中罕見的樂觀情緒與鮮明色彩。由於梵高晚期作品大多已由博物館收藏，極少在私人市場流通，今次拍賣備受矚目。這幅名畫上月曾在香港中環蘇富比旗艦藝廊展出3天，吸引數百人排隊觀賞，當時估價高達1.8億美元。今次成交價亦打破梵高另一作品《有栢樹的果園》2022年創下的1.172億美元舊紀錄。\n捲入納粹時期售畫爭議\n這幅畫作的收藏歷史亦引發爭議。德國猶太裔出版商菲舍爾1909年在巴黎購入畫作，其家族於1936年納粹統治期間將畫作售出。菲舍爾的後人早前質疑，家族當年受到納粹逼害，蒙受重大經濟損失，被逼出售畫作，要求蘇富比證明交易並非在政治壓力下進行，且成交價符合當時市價。該畫曾幾經轉手，1975年由阿根廷布拉基耶家族購入，收藏逾半世紀。蘇富比在拍賣前夕宣布，現任藏家與菲舍爾夫婦所有合法後人已就出售畫作達成協議，但未有公開和解條款。菲舍爾家族後人感謝各方以公平及互信方式協商，認為協議承認家族在納粹時期遭受的苦難，亦彰顯後人多年來爭取公義的努力。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8bc3e49cf5","title":"輝達臨時CEO宣布提前加薪派股票","url":"https://www.stheadline.com/realtime-world/3639152/輝達臨時CEO宣布提前加薪派股票","summary":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。","summary_short":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。","digest":"美國晶片巨頭輝達在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會","points":["美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會","臨時行政總裁克雷斯（Colette Kress）為穩定軍心…","公司高層同時公布擴展人工智能（AI）工廠業務的計劃，強調黃仁勳離任不會影響發展方向"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:28:05+08:00","size":1,"keywords":[],"body":"美國晶片巨頭輝達（Nvidia）在創辦人黃仁勳因婚外情醜聞請辭後，周三舉行首次全體員工大會。臨時行政總裁克雷斯（Colette Kress）為穩定軍心，宣布將原定明年春季的加薪及股票獎勵安排提前至今年12月。公司高層同時公布擴展人工智能（AI）工廠業務的計劃，強調黃仁勳離任不會影響發展方向。\n《華爾街日報》報道，這場歷時約50分鐘的員工大會，氣氛與黃仁勳過往主持的會議截然不同。黃仁勳向來以充滿活力、愛說笑話及分享故事著稱，克雷斯則着重安撫員工情緒，並讓多名高層輪流發言。黃仁勳的女兒黃敏珊及女婿卡普雷茲亦有出席，但未有發言。克雷斯在會議上強調公司有能力克服目前困境，全球業務營運執行副總裁派克則表示，黃仁勳離任後，不少客戶及合作夥伴主動表達支持，公司未來亦會安排更多高層直接與客戶接觸。\n會議亦揭示輝達未來業務方向，計劃由晶片供應商進一步轉型為提供完整AI工廠的企業。硬件工程副總經理貝爾表示，公司明年將推出貨櫃式運算模組，每個模組可容納8台伺服器機櫃，長遠目標是讓客戶直接訂購整座資料中心。\n安謀(Arm)行政總裁哈斯。 路透社\n獵頭公司接觸安謀掌門\n另一方面，輝達正積極物色黃仁勳的接班人。美媒引述消息指，董事會委託獵頭公司海德思哲尋找新掌舵人，並已接觸英國晶片設計公司安謀（Arm）行政總裁哈斯。現年64歲的哈斯曾在輝達任職7年，被視為潛在接班人之一，但雙方均未就有關消息置評。哈斯周三在得州一場科技會議上形容黃仁勳為「傳奇人物」。輝達曾於2020年計劃收購安謀，但最終因監管機構反對而告吹。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5a686984ac","title":"北海道六花亭 | 日本知名手信品牌遭網攻 8000筆信用卡資料恐外洩","url":"https://www.stheadline.com/realtime-world/3639151/北海道六花亭-日本知名手信品牌遭網攻-8000筆信用卡資料恐外洩","summary":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改，可能導致約8000筆顧客信用卡資料外洩。","summary_short":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改…","digest":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵…","points":["日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵…","公司表示，為確保消費者安全，已暫停官網商店營運","總部位於北海道帶廣市的六花亭，以奶油葡萄夾心餅乾等經典甜點聞名…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:23:02+08:00","size":1,"keywords":[],"body":"日本北海道知名手信品牌六花亭（Rokkatei）證實，旗下官方網絡商店遭到黑客入侵，付款系統程式被竄改，可能導致約8000筆顧客信用卡資料外洩。公司表示，為確保消費者安全，已暫停官網商店營運。\n總部位於北海道帶廣市的六花亭，以奶油葡萄夾心餅乾等經典甜點聞名，是北海道極具代表性的手信品牌，深受日本國內外遊客歡迎。\n六花亭以奶油葡萄夾心餅乾等經典甜點聞名。六花亭官網\n六花亭總部位於北海道帶廣市。北海道旅遊網站\n六花亭札幌本店。六花亭官網\n黑客入侵官網商店\n根據六花亭說明，公司18日發現官網商店遭到非法存取，信用卡付款頁面的程式遭到惡意竄改，可能使顧客在結帳時輸入的信用卡資訊遭到竊取。\n目前估計約有8000筆信用卡資料可能受到影響，外洩資訊包括信用卡號碼、持卡人姓名、有效期限，以及信用卡安全碼。\n可能受影響的顧客，是10月21日晚上9時至11月18日上午11時期間，曾在六花亭官網商店使用信用卡付款的消費者。\n信用卡付款消費者受影響\n六花亭表示，為確保消費者安全，已暫停官網商店營運，在確認網站安全性之前不會恢復服務。同時，公司也將尋求外部專業機構協助，調查事件原因並研擬防止類似事件再次發生。\n針對今次資訊安全事件，六花亭發表聲明稱。「對於造成顧客極大的困擾與擔憂，我們深表歉意」。\n六花亭並呼籲曾在相關期間使用信用卡購物的消費者，務必確認信用卡交易明細，留意是否出現不明扣款，並提高警覺，防範不法人士利用外洩資訊進行電話詐騙等犯罪行為。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c239605b72f","title":"伊朗局勢｜特朗普：不會在新年前倉促決定是否下令恢復打擊","url":"https://news.tvb.com/tc/1207372-伊朗局勢特朗普不會在新年前倉促決定是否下令恢復打擊","summary":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風，稱不急於決定是否打擊伊朗，留待明年初再向傳媒討論此事。","summary_short":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。","digest":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗","points":["特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風…","有輿論認為，特朗普希望繼續以經濟制裁及海上封鎖向伊朗施壓，考慮到民主黨將於明年初掌控國會…","對於特朗普在未有公開證據下，宣稱伊朗正研發生化武器，伊朗外交部反駁指…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:46:00+08:00","size":1,"keywords":["美國","伊朗","特朗普","伊朗局勢"],"body":"美國總統特朗普表明，不會在新年前倉促決定，是否再下令美軍打擊伊朗。\n\n特朗普早前表示，不排除在中期選舉之後再打擊伊朗，他周四接受路透社及霍士新聞訪問，改變口風，稱不急於決定是否打擊伊朗，留待明年初再向傳媒討論此事。\n\n有輿論認為，特朗普希望繼續以經濟制裁及海上封鎖向伊朗施壓，考慮到民主黨將於明年初掌控國會，特朗普仍有可能在國會展開新會期前採取軍事行動。\n\n對於特朗普在未有公開證據下，宣稱伊朗正研發生化武器，伊朗外交部反駁指，美方試圖傳播謊言去製造恐慌，並警告國際不要重演2003年教訓，美國當年以發現大殺傷力武器為由，出兵攻打伊拉克，但戰後找不到相關武器。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026AYDmtTFC7l1795132059.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/b4e84f58d0e1403091e62437e200ea71/00d5adfa3e5c4c719268eb04e135a24b-c6eb5ca8d6b35b777abc56ca2d7262ad-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026AYDmtTFC7l1795132059.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c660af69a48","title":"尼泊尔法院批准羁押两名前劳工部长","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734994.shtml","summary":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实，加德满都地方法院当天批准警方继续羁押两名前劳工部长等六人4天。","summary_short":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实…","digest":"尼泊尔警方中央调查局发言人19日证实…","points":["中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实…","六人因涉嫌参与一起向赴马来西亚务工人员违规收费的案件，于18日被捕","据警方通报，这六人包括曾任尼泊尔劳工、就业和社会保障部部长的谢尔·巴哈杜尔·昆瓦尔和拉梅什沃…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:40:39+08:00","size":1,"keywords":[],"body":"中新社加德满都11月19日电 (记者 崔楠)尼泊尔警方中央调查局发言人19日证实，加德满都地方法院当天批准警方继续羁押两名前劳工部长等六人4天。六人因涉嫌参与一起向赴马来西亚务工人员违规收费的案件，于18日被捕。\r\n\n　　据警方通报，这六人包括曾任尼泊尔劳工、就业和社会保障部部长的谢尔·巴哈杜尔·昆瓦尔和拉梅什沃尔·拉伊·亚达夫，以及四名前劳工部高级官员。警方称，六人涉嫌参与批准将向务工人员违规收取的款项汇往马来西亚，汇款总额折合约16.9亿尼泊尔卢比。\n\n　　今年10月，尼泊尔警方已就此案逮捕四人。警方称，这四人涉嫌通过一家私营公司，在赴马来西亚务工人员接受出境前强制性体检时，在常规体检费之外以“生物医学服务费”名义向每名务工者加收100马来西亚林吉特。\n\n　　加德满都地方法院19日还就此案对尼泊尔政府前首席秘书埃克·纳拉扬·阿亚尔签发逮捕令。警方怀疑，其在担任劳工、就业和社会保障部部秘期间，也参与了上述汇款决策。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c3e407a1b","title":"国际能源署：中东冲突很可能对能源市场构成持久影响","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734995.shtml","summary":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告，警告中东冲突很可能对能源市场构成持久影响。","summary_short":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告…","digest":"国际能源署当地时间19日发布《2026年世界能源展望》报告…","points":["中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望…","国际能源署署长比罗尔表示，中东冲突导致的霍尔木兹海峡能源运输受阻给能源供应带来了巨大冲击","尽管能源市场和全球经济展现出了相当强的韧性，但长时间的危机将带来更深远的影响"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:39:17+08:00","size":1,"keywords":[],"body":"中新社巴黎11月19日电　（记者　李洋）国际能源署当地时间19日发布《2026年世界能源展望》报告，警告中东冲突很可能对能源市场构成持久影响。\n\n　　国际能源署署长比罗尔表示，中东冲突导致的霍尔木兹海峡能源运输受阻给能源供应带来了巨大冲击。尽管能源市场和全球经济展现出了相当强的韧性，但长时间的危机将带来更深远的影响。他认为尚没有切实可行的方法令能源市场恢复到危机前的状态。\n\n　　报告指出，能源供应危机令能源市场的脆弱性进一步加剧，而这种脆弱性又与地缘政治紧张局势、日益严峻的气候变化问题、网络攻击及其他针对能源基础设施的破坏活动交织在一起。同时，能源价格走高和化肥供应短缺，也对世界粮食安全构成威胁。\n\n　　报告认为，这场危机正促使很多国家重新审视其能源战略，寻求降低能源供应的脆弱性。多国推动在能源供应、贸易路线、燃料结构和技术供应链等领域更加多元化、更加倾向于使用本国能源资源并加快电气化进程。\r\n\n　　报告还认为，如果霍尔木兹海峡的航运风险持续存在，通过投资建设新的绕行管道、开发替代供应渠道等措施，可以将通过霍尔木兹海峡的石油日均运输量从危机前的2000万桶降至2030年的850万桶，并在2035年进一步降至200万桶以下。但中东仍将是全球最大的国际石油出口地区，在全球能源安全格局中依然发挥关键作用。\n\n　　报告预测，可再生能源和核能未来将快速发展；电力需求的增速也将加快。比罗尔表示，构建一个更安全、更经济、更可持续的能源体系，并为此开展有效合作，“符合所有国家的共同利益”。（完） 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cea4f4cd87b","title":"美国航空航天局：收到探测器从距离地球一光日发来的信号","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734996.shtml","summary":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示，已接收到“旅行者一号”探测器从距离地球一光日位置发来的信号。","summary_short":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示…","digest":"美国国家航空航天局19日表示…","points":["中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示…","一光日是指光在24小时内传播的距离，约为260亿公里","美国航空航天局在声明中说，“旅行者一号”探测器于美国东部时间11月18日5时16分抵达距离地…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:38:17+08:00","size":1,"keywords":[],"body":"中新社华盛顿11月19日电 (记者 沙晗汀)美国国家航空航天局19日表示，已接收到“旅行者一号”探测器从距离地球一光日位置发来的信号。\n\n　　一光日是指光在24小时内传播的距离，约为260亿公里。\n\n　　美国航空航天局在声明中说，“旅行者一号”探测器于美国东部时间11月18日5时16分抵达距离地球一光日的位置，是人类历史上飞行最远的航天器。美国航空航天局在美东时间11月19日5时16分确认收到“旅行者一号”探测器一天前发出的信号。\n\n　　美国航空航天局科学任务总监福克斯(Nicky Fox)表示，“旅行者一号”探测器再次打破纪录、突破界限，引领人类踏上新征程。\r\n\n　　美国航空航天局于1977年9月5日发射了“旅行者一号”探测器，该探测器已在太空中飞行了近50年，先后飞掠木星和土星，飞出太阳系。美国航空航天局1977年8月20日发射了“旅行者二号”探测器。它们是仅有的两个已离开太阳系进入星际空间飞行的人造航天器。\n\n　　相比“旅行者一号”探测器，“旅行者二号”探测器有着更远的飞行轨迹，先后飞掠木星、土星、天王星和海王星。据美国航空航天局消息，“旅行者二号”探测器预计于2035年11月到达距离地球一光日的位置。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c698a6ee969","title":"韩国最高法院将前总理韩德洙涉内乱案发回重审","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734993.shtml","summary":"中新社首尔11月19日电 (金旭 陈艺玲)韩国大法院(最高法院)当地时间19日就韩国前国务总理韩德洙涉内乱案作出判决，认定韩德洙的行为构成参与内乱重要任务罪，但撤销二审判决中的部分有罪认定…","summary_short":"中新社首尔11月19日电 (金旭 陈艺玲)韩国大法院(最高法院)当地时间19日就韩国前国务总理韩德洙涉内乱案作出判决…","digest":"韩国大法院(最高法院)当地时间19日就韩国前国务总理韩德洙涉内乱案作出判决…","points":["中新社首尔11月19日电 (金旭 陈艺玲)韩国大法院(最高法院)当地时间19日就韩国前国务总…","据韩联社报道，最高法院认为，韩德洙的部分行为足以构成参与内乱重要任务罪…","最高法院表示，韩德洙在戒严宣布后怂恿国务委员们在相关文件上签字…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T07:35:17+08:00","size":1,"keywords":[],"body":"中新社首尔11月19日电 (金旭 陈艺玲)韩国大法院(最高法院)当地时间19日就韩国前国务总理韩德洙涉内乱案作出判决，认定韩德洙的行为构成参与内乱重要任务罪，但撤销二审判决中的部分有罪认定，并将案件发回首尔高等法院重审。\r\n\n　　据韩联社报道，最高法院认为，韩德洙的部分行为足以构成参与内乱重要任务罪，但对于其建议召开国务会议，试图制造紧急戒严令经过国务会议审议这一表象的行为，现有证据不足以证明其具有扰乱宪法秩序的目的，因此被判无罪。\n\n　　最高法院表示，韩德洙在戒严宣布后怂恿国务委员们在相关文件上签字，并讨论封锁国会等主要机构以及对媒体实施断水断电等措施，这些行为可被认定其参与内乱。此外，对于二审判决认定的韩德洙制造虚假公文、违反“总统档案法”、作伪证等罪行，最高法院维持有罪认定。由于二审对数项罪名合并判处一个刑期，最高法院推翻其中部分认定后，将案件发回重新量刑。\n\n　　此次宣判距离韩德洙羁押期限届满仅剩数小时，由于发回重审期间可以延长羁押期限，韩德洙将继续处于羁押状态。\n\n　　2025年8月，韩国负责调查紧急戒严事件的特检组以涉嫌协助内乱、制造虚假公文、损坏公共文件、作伪证等罪名对韩德洙提起公诉。2026年1月，韩德洙因协助内乱头目等罪名一审被判有期徒刑23年，并当庭被捕，随后他提起上诉。5月，韩德洙二审被判有期徒刑15年，相比一审判决减少8年。韩德洙对二审判决表示不服，向最高法院提起上诉。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd0e6d49ba1","title":"外媒：一移民船在塞内加尔沿海倾覆 已致数十人失踪","url":"https://www.chinanews.com.cn/gj/2026/11-20/10734992.shtml","summary":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆，已造成数十人下落不明。","summary_short":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆…","digest":"据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆…","points":["中新网11月20日电 据路透社报道，当地官员19日表示…","当地一家非政府组织负责人表示，事故发生在塞内加尔首都达喀尔以南的耶讷镇附近海域","联合国难民机构本周指出，今年以来，已有近600名移民从西非乘船前往大西洋上的西班牙加那利群岛…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-20T07:18:42+08:00","size":1,"keywords":[],"body":"中新网11月20日电 据路透社报道，当地官员19日表示，一艘载有移民的船只在西非国家塞内加尔沿海倾覆，已造成数十人下落不明。\n\n　　据报道，当地一家非政府组织负责人表示，事故发生在塞内加尔首都达喀尔以南的耶讷镇附近海域。船上至少有约50人。\n\n　　报道称，目前正在搜寻幸存者。\n\n　　联合国难民机构本周指出，今年以来，已有近600名移民从西非乘船前往大西洋上的西班牙加那利群岛途中遇难或失踪，本月前12天就有超8000人取道该航线抵达加那利群岛。\r\n\n 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c01f30a184c","title":"國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立 美國稱防止政治化","url":"https://news.tvb.com/tc/1207365-國際法院裁定緬甸對羅興亞人實行種族滅絕罪名成立美國稱防止政治化","summary":"國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來，首次裁定有主權國干犯相關罪行，緬甸軍政府一直否認指控。歐盟指要為受害者伸張正義，美國就稱防止國際法院遭政治化。","summary_short":"國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來，首次裁定有主權國干犯相關罪行…","digest":"國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來…","points":["國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來…","歐盟指要為受害者伸張正義，美國就稱防止國際法院遭政治化","聯合國最高司法機構，荷蘭海牙的國際法院，周四就緬甸軍方在2017年屠殺羅興亞人案作出裁決"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:15+08:00","size":1,"keywords":[],"body":"國際法院裁定，緬甸對羅興亞人實行種族滅絕，罪名成立，是國際法院成立逾80年來，首次裁定有主權國干犯相關罪行，緬甸軍政府一直否認指控。歐盟指要為受害者伸張正義，美國就稱防止國際法院遭政治化。\n\n聯合國最高司法機構，荷蘭海牙的國際法院，周四就緬甸軍方在2017年屠殺羅興亞人案作出裁決。由15人組成的法官小組，以9比6裁定，緬甸清剿羅興亞人構成種族滅絕，違反《防止及懲治滅絕種族罪公約》，且不接受被告上訴。\n\n國際法院院長岩澤雄司表示：「法庭認為證據確鑿，緬甸安全部隊確曾無差別殺戮，隔離及處決男性，施以性暴力及蓄意焚毀羅興亞人家園。法院完全確信緬甸曾採取措施，意圖禁止羅興亞族群傳宗接代，有關種族滅絕(試圖阻止生育)干犯公約第2條D款成立。」\n\n今次是國際法院成立81年來，首次裁定單一國家要為種族滅絕承擔法律責任。法院長達191頁的裁決書，指緬甸當局有義務賠償羅興亞人，並保證他們安全及有尊嚴地重返緬甸家園。\n\n在孟加拉難民營有受訪羅興亞人，讚揚法院裁決等同徹底粉碎由整個國家支持的謊言。\n\n以佛教徒為主的緬甸，軍方2017年在北部若開邦，鐵腕鎮壓羅興亞穆斯林，包括殺害男性及嬰兒，強姦婦女及燒毀村莊，法院指約1萬人被屠殺，逾70萬人被迫逃亡到孟加拉等國家。\n\n時任國務資政的昂山素姬，考慮到文人政府權力受限制，加上面對國內民族主義壓力，當時她沒有阻止軍方而備受國際批評，甚至有人要求褫奪其諾貝爾和平獎。\n\n大部分人口為穆斯林的西非國家岡比亞，在伊斯蘭合作組織支持下，2019年為羅興亞人出頭，向國際法院起訴緬甸實施種族滅絕，緬甸軍方則辯稱是合法反恐行動。\n\n歐盟發言人稱，羅興亞人承受巨大苦難，國際法院今次裁決，凸顯必須為受害者伸張正義。美國國務院就稱，正確詮釋種族滅絕公約很重要，並要防止國際法院遭政治化。\n\n美方憂慮國際法院一旦降低「種族滅絕」裁決門檻，將來可能就加沙局勢，針對美國盟友以色列。","image":"https://pro-vod-cdn.tvb.com/f64e97ea841847baa91e8489d784bce5/snapshots/25b9d9e88c74485a880ebedf01730914-00008.jpg","video":"https://pro-vod-cdn.tvb.com/f64e97ea841847baa91e8489d784bce5/2d752792599847fba718eaf0c931749c-e1cb65c00309c54ded9d07c747233865-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/f64e97ea841847baa91e8489d784bce5/snapshots/25b9d9e88c74485a880ebedf01730914-00008.jpg","lang":"zh-Hant"},{"id":"c07c89c17d5","title":"普京：克里米亚大桥遭袭后 不再讨论海上
