　　作者 叶秋云\n\n　　18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行。打城戏折子戏《目连救母·过滑油山》《目连救母·代母绕枷》《真假美猴王·闹地府》《三打白骨精·擒僧》轮番登台，古老闽南戏韵响彻剧场。\n\n　　打城戏又名“法事戏”“和尚戏”“道士戏”，是国内独树一帜的仪式戏曲，已被列入国家级非物质文化遗产代表性项目名录。\n\n　　曾经，受多重因素影响，打城戏面临剧目散失、艺人流失，被其他剧种同化的危机，一度走到濒危的边缘。吴天乙、洪球江、黄锡均、黄莺莺、伍志新、吴晓军、黄海山等老一辈艺人倾尽半生心血，口传心授开展传承活动，让打城戏重返舞台。\n\n　　如今，泉州市打城戏传承中心挂靠高甲戏传承中心，实行“一团制”(一套班子、两个剧团)的运行模式，体制与民间传承双向并行。泉州市高甲戏传承中心主任周杰俊说，打城戏是珍贵的、具有重要价值的文化资源，一代代年轻人接过接力棒，继续守护和传承这份濒临消逝的戏曲记忆。\n\n11月18日，泉州市打城戏传承中心“00后”演员陈德佳(左一)在打城戏折子戏《目连救母·代母绕枷》中饰演目连。叶秋云 摄\n\n　　展演现场，折子戏《目连救母·代母绕枷》精彩上演，饰演目连的“00后”演员陈德佳带伤上阵，翻腾跳跃，利落的武打特技引得台下掌声阵阵。\n\n　　陈德佳自12岁开始学习打城戏，至今已经与之相伴十余载。“打城戏是一个断层情况十分严重的剧种。”谈起传承的难处，陈德佳感触颇深，老一辈艺人年事已高，留存下来的大多只是纸质史料，完整影像资料寥寥无几，年轻演员越来越难获得老艺人面对面言传身教的机会。“我们必须与时间赛跑，避免陷入‘人亡艺绝’的境地。”\n\n　　自2019年以来，在文旅部门和院团推动下，泉州市打城戏传承中心扎实开展打城戏掷铙钹、吃纸吐火等特技表演，累计抢救整理创排《劈山救母》《汉宫风云》等十多部剧目。与此同时，《代母绕枷》《过滑油山》《望乡台》等目连戏传统老戏也在持续挖掘复排，守住剧种的根脉。\n\n11月18日，泉州市打城戏传承中心“00后”演员苏有明(右二)在打城戏折子戏《真假美猴王·闹地府》中饰演美猴王。叶秋云 摄\n\n　　过去，打城戏传播渠道较为单一，大多依靠下乡巡演；如今，不少看完演出的戏迷自发在社交媒体分享片段。线上“种草”带动线下观演，不少上海、浙江等地的观众跨越千里专程来到泉州看戏。“这是新时代赋予我们的红利。”“00后”演员的苏有明坦言，机遇背后同样是沉甸甸的责任和压力，“主动担当是我辈义不容辞的文化责任”。\n\n　　守正不忘出新，青年演职人员也在探索适配当代观众的表达。剧团在强调剧种特性，保持剧种特色的同时，不断升级舞美灯光，运用布景机关补足演员难以实现的舞台效果；在《三打白骨精》等剧目中适度加入生活化、网络化台词，增添喜剧趣味，拉近和观众的距离。\n\n　　周杰俊表示，长期以来在各级部门和领导、专家、侨胞等社会各界人士的关心重视下，打城戏抢救、传承、研究和展示的实践探索，在人才培养、剧目整理创作和艺术研究等方面取得了可喜的成果。保护传承单位的设立及各项具体保护传承机制的组织实施，令打城戏“95后”“00后”演员从翻阅泛黄史料复原身段唱腔，到站上展演舞台挑大梁，正成为打城戏新一代“话事人”。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c137ad6d104","title":"天氣轉冷狂流鼻水、打乞嚏 中醫教3穴位 通鼻竅/防鼻敏感","url":"https://www.stheadline.com/health-edu/3638840/天氣轉冷狂流鼻水打乞嚏-中醫教3穴位-通鼻竅防鼻敏感","summary":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。","summary_short":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。","digest":"踏入秋冬季，不少人會出現鼻敏感反覆發作，特別是天氣轉變時尤其明顯","points":["踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯","中醫認為，長期處於冷氣環境及喜食冷飲，會令寒氣鬱閉、損傷陽氣，使抵抗力下降…","濟南市國家醫院分享了簡便易行的自我保健方法，適合市民日常應用："],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:31:22+08:00","size":1,"keywords":[],"body":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。中醫認為，長期處於冷氣環境及喜食冷飲，會令寒氣鬱閉、損傷陽氣，使抵抗力下降，增加鼻敏感發作機會。除積極治療外，配合穴位按摩、艾灸及敷貼等方法，有助宣通鼻竅、紓緩不適。\n3大核心穴位 通鼻竅、安神、強體質\n除內服藥物外，中醫外治法可有效控制鼻炎症狀，降低復發率。濟南市國家醫院分享了簡便易行的自我保健方法，適合市民日常應用：\n【同場加映】轉季鼻敏感發作、狂打乞嚏！營養學家推介4類抗敏食材 連皮蘋果、紫洋蔥助止鼻水？\n1. 迎香穴——通鼻第一穴\n位置：鼻翼外緣中點旁、鼻唇溝中。\n手法：以食指指腹順時針按揉1至2分鐘。\n功效：能快速疏通鼻道，緩解鼻塞、流涕及嗅覺失靈，是治療鼻炎的常用特效穴，鼻子不適時按壓最為直接。\n2. 印堂穴——安神定敏\n位置：在兩眉頭連線的中點。\n手法：以拇指或中指指腹自下而上推按或點按約1分鐘。\n功效：配合迎香穴使用，既能通鼻竅，亦可紓緩鼻炎引起的頭昏腦脹，安神穩定情緒。\n3. 合谷穴——強壯外援\n位置：在手背第1、2掌骨間，第2掌骨橈側中點，即虎口位置。\n手法：以對側拇指用力按壓，以有酸脹感為宜，維持1至2分鐘。\n功效：中醫有「面口合谷收」之說，合谷是調理頭面部的要穴，能增強體質，幫助改善過敏底子。\n應急技巧：搓揉迎香穴 快速通鼻塞\n以食指指腹按在迎香穴上，快速沿鼻樑兩側上下推擦約1至2分鐘，至鼻部發熱；也可用熱毛巾敷鼻，直至毛巾變冷。此法能瞬間擴張血管、通氣，紓緩鼻塞。建議每天早晚各做一套，持之以恆，鼻部不適會逐漸減少。\n艾灸與敷貼 逐寒濕、通氣血\n江蘇省中醫院針灸康復科主任醫師孫建華指，艾灸可逐寒濕、通氣血，對鼻炎有一定療效。隔薑灸法以鮮生薑切片，中間刺孔，置於背部大椎、肺俞及風門穴上，再放艾炷施灸，每穴灸3炷，以皮膚潮濕、紅潤為度。生薑辛溫走竄，可增強艾灸效果。\n穴位敷貼方面，夏季鼻炎症狀緩解時，可採用白芥子、甘遂、細辛等藥物加減，調以薑汁成丸，敷貼於背部定喘、肺俞及腎俞穴，讓藥物滲入皮膚，隨經絡氣血運行吸收，以期減少冬季發作。傳統以三伏天為最佳時機，臨床觀察整個三伏天均可考慮。惟敷貼並非人人適宜，正處疾病發作期、有嚴重慢性疾患、對藥物過敏、皮膚破潰或長有瘡癤者不宜；2歲以下幼兒皮膚嬌嫩，亦不建議。敷貼後應避寒保暖，忌食生冷，以免寒氣凝滯影響療效。\n穴位按摩與艾灸敷貼屬輔助保健，不能取代正規診治；使用以上輔助保健之前，應先立即求醫或諮詢專業中醫師。\n資料來源：孫建華醫師、濟南市國家醫院\n鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發','/health-care/3345484/鼻敏感飲食開冷氣易鼻敏感流鼻水中醫推介15種食物湯水紓緩防病發');\" oncontextmenu=\"cckevent('Article','鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發','/health-care/3345484/鼻敏感飲食開冷氣易鼻敏感流鼻水中醫推介15種食物湯水紓緩防病發');\">延伸閱讀：鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發\n---","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c76d415a234","title":"伍詠薇爆邀閨密上節目被開天價 袁詠儀成嫌疑人？ 靚靚曾撐好友做嘉賓近兩年忽然少交集","url":"https://www.stheadline.com/film-drama/3638902/伍詠薇爆邀閨密上節目被開天價-袁詠儀成嫌疑人-靚靚曾撐好友做嘉賓近兩年忽然少交集","summary":"現年57歲的伍詠薇向來性格直率。","summary_short":"現年57歲的伍詠薇向來性格直率。","digest":"現年57歲的伍詠薇向來性格直率","points":["現年57歲的伍詠薇向來性格直率","近日她擔任陳敏之網台節目《Chi Chat》的嘉賓時…","她主動提供了一份好友名單，當中包括一位相識多年的女性好友"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"現年57歲的伍詠薇向來性格直率。近日她擔任陳敏之網台節目《Chi Chat》的嘉賓時，透露早前主持HOY節目《九運會客室》第二季期間，節目組曾協助聯絡嘉賓。她主動提供了一份好友名單，當中包括一位相識多年的女性好友。豈料對方得知是伍詠薇的節目後，竟透過團隊要求遠超常規的車馬費才肯受訪。伍詠薇對此感到不滿，直言若無意受訪大可婉拒，而非提出高昂費用為難幕後人員，認為此舉缺乏尊重。片段播出後引起網民熱烈討論，紛紛猜測該女星的身份，其中最多人聯聯想到其相識30年的閨密袁詠儀。\n伍詠薇與袁詠儀逾30年姊妹情\n伍詠薇與袁詠儀是相識超過30年的圈中閨密，兩人於1994年合作電影《姊妹情深》結緣。當時身為香港小姐冠軍的袁詠儀起初對亞洲小姐出身的伍詠薇有些微言，心想：「她是亞洲電視的，和我一起拍戲？」沒想到合作後發現兩人性格同樣豪爽，隨即一拍即合。\n相關閱讀：伍詠薇曾患抑鬱症提早交代身後事 怨好友疏遠：我啲朋友去咗邊 一原因鬧老友「黐X線」\n伍詠薇曾調侃袁詠儀缺乏情趣\n兩人相處百無禁忌，袁詠儀曾透露伍詠薇吃飯時愛把骨頭吐進她的碟子裡，而伍詠薇也曾調侃袁詠儀「缺乏情趣」，笑稱張智霖說笑話時只有自己會給予反應，令袁詠儀反擊指兩人「有曖昧」。\n伍詠薇與袁詠儀曾有誤會\n雖然平時喜歡互相鬥嘴，但她們極為珍視這段友誼。2016年伍詠薇主持節目《伍姑娘真識食》邀請袁詠儀擔任嘉賓時，兩人都曾因「袁詠儀私下不希望與丈夫張智霖同台現身」而產生小誤會。誤會解開後，袁詠儀更大方送上一枚鑽石戒指予伍詠薇，象徵二人友誼永固。\n相關閱讀：張智霖兒子魔童20歲生日照曝光 張慕童輪廓深邃超靚仔 五官神複製《金枝玉葉》袁詠儀\n伍詠薇認曾對張智霖動心\n伍詠薇與張智霖同樣稔熟，二人以姊弟相稱，但她曾自爆當年對張智霖動過心，笑言：「當時我有想過跟靚靚『鍊過』，但鍊了個阿練（練海棠）回來。」張智霖則感性表示：「她對我的喜歡變成了疼愛。」伍詠薇常跟張智霖分享秘密，卻怨他口疏轉頭就告訴靚靚，足見三人感情深厚。而張智霖亦曾笑指伍詠薇「成日放飛機」。\n伍詠薇與袁詠儀近兩年較少交集\n不過，今年伍詠薇主持兩輯《九運會客室》，均未見袁詠儀和張智霖擔任嘉賓，而袁詠儀和伍詠薇近兩年的公開交集亦明顯減少。這次伍詠薇透露「高昂車馬費事件」，令網民再度關注這對昔日閨密的最新關係。\n相關閱讀：張智霖兒子休學與爸爸童年缺失有關？父子檔上台認有私心：點解我要多承擔呢份壓力","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7c008479f5","title":"李政宰被爆「自肥式」經營經理人公司 拍《魷魚遊戲》袋過億公司僅分237萬 累股價暴跌連年虧損","url":"https://www.stheadline.com/film-drama/3638939/李政宰被爆自肥式經營經理人公司-拍魷魚遊戲袋過億公司僅分237萬-累股價暴跌連年虧損","summary":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位，上月中李政宰控告5名前員工挪用公款之後…","summary_short":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位…","digest":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company風波不斷…","points":["李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷…","李政宰以9：1作收入分配比率","而且當李政宰的收入超過40億韓圜時，那些超出的部分就會全歸李政宰所有"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:15:38+08:00","size":1,"keywords":[],"body":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位，上月中李政宰控告5名前員工挪用公款之後，昨日（18日）又被《Dispatch》（D社）大爆李政宰以「自肥式經營」經理人公司，令公司連年虧損，股價暴跌。\n李政宰以9：1作收入分配比率\n據D社報道，李政宰與AC以9：1作為其演藝收入分配比率，李政宰的收入頭40億韓圜（約2,369萬港元）中，他本人分得當中90%，AC則只能取得10%。而且當李政宰的收入超過40億韓圜時，那些超出的部分就會全歸李政宰所有。據知AC旗下其他藝人，如廉晶雅、林智妍、金惠奫的合約都沒有這樣的條款。\n李政宰公司一年暴跌70%\n據指李政宰拍攝《魷魚遊戲》第2、3季時，每集片酬超過120萬美元（約17億韓圜、1,007萬港元），他拍攝了13集，總共賺得超過200億韓圜（約1.18億港元）。但AC只能從200億當中的頭40億韓圜中，抽取10%，所以就算李政宰賺了1,000億，AC亦只能分得4億韓圜（約236.9萬港元）。而李政宰是透過其個人公司Verdant Hills收取結算款項，根據2025年的業務報告，AC轉入該公司金額高達201億韓圜（約1.19億港元），與上述他拍《魷魚》2、3季的片酬相若，證明這套「自肥式」分成方法屬實。身為最大股東的李政宰去年賺成1.19億港元，但公司也只能分得唔夠237萬港元，難怪AC在市場表現疲弱。他們去年以每股13,610韓圜（約80.6港元）開盤，年底收盤價已跌到4,050韓圜（約24港元），一年內暴跌70%。\n李政宰逼子公司交雙重租金\n另外，李政宰自收購著名韓劇製作公司RaemongRaein（來夢來人） 後，就積極推動RaemongRaein（RR）的辦公室搬遷，將RR從論峴洞總部搬到李政宰旗下物業，然而論峴洞那邊的租約還有1年7個月才到期，RR被逼急搬之下，須交晒新舊辦公室的租金。據知論峴洞總部每月租金2,400萬韓圜（約14.2萬港元），而李政宰物業租金亦唔平，去年RR就支付了1.3億韓圜（約77萬港元）租金，今年上半年亦已支付了9,000萬韓圜（約55.3萬港元）租金。\n李政宰公司發聲明澄清\n而李政宰今年3月亦成立了Vena Beauty，發展化妝品事業。3個月後，AC亦於6月宣布進軍化妝品市場，並將李政宰親自開發的產品及個人國際知名度等資產投入新事業。不過，D社又踢爆AC除了必須每年向Vena Beauty支付最低保證金，還得依照營業成果支付10%的營利收益。然而AC回應指報道不實，更聲稱將採取法律行動。他們發表聲明表示，與李政宰的合約屬於「一般常見的合約」，而且是一份合理的合約，指李政宰和曾同任執行董事的鄭雨盛都沒有收取執行董事薪酬，兩人簽署的合約條款一樣。而李政宰有關《魷魚遊戲》的合約和海外工作均由美國經理人公司CAA負責，故片酬分成亦由CAA負責。雖然AC沒有直接參與，但亦根據合約獲得了部分收入。至於RR被收購後急搬總部一事，AC解釋說是方便處理法律糾紛，開展管理活動和業務運營。\n李政宰考慮過放棄最低保證金\n至於Vena Beauty部分，AC指出考慮到李政宰的廣告代言費通常高達數億韓圜，如今給Vena Beauty每年3,000萬韓圜（約17.7萬港元）的最低保證金，數額其實一點也不高。AC更指李政宰為了公司利益，本來考慮放棄最低保證金，但鑑於免費提供授權可能產生稅務問題，最終決定採用最低金額。他們更補充道：「根據合約，如果業績超過雙方約定的目標營業利潤，Vena Beauty只能獲得超額利潤的一部分，並且在達到目標營業利潤之前，除最低保證金外，不會獲得任何其他與業績掛鉤的回報。此外，合約還規定，任何未分配給Vena Beauty的超額利潤，都要再投資於公司業務。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7450287afa","title":"海鮮紅燒豆腐食譜 簡單7步炮製鮮甜海鮮","url":"https://news.tvb.com/tc/1206638-海鮮紅燒豆腐食譜簡單7步炮製鮮甜海鮮","summary":"想在家中炮製豐富又惹味的家常菜？不妨嘗試這道海鮮紅燒豆腐。","summary_short":"想在家中炮製豐富又惹味的家常菜？","digest":"想在家中炮製豐富又惹味的家常菜","points":["想在家中炮製豐富又惹味的家常菜","不妨嘗試這道海鮮紅燒豆腐","外脆內嫩的普寧豆腐吸滿濃郁芡汁，配搭鮮甜爽彈的蝦仁與魷魚，層次豐富，絕對是佐飯首選"],"section":"生活","category":"生活消閒","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:09:00+08:00","size":1,"keywords":["食譜"],"body":"想在家中炮製豐富又惹味的家常菜？不妨嘗試這道海鮮紅燒豆腐。外脆內嫩的普寧豆腐吸滿濃郁芡汁，配搭鮮甜爽彈的蝦仁與魷魚，層次豐富，絕對是佐飯首選！\n\n海鮮紅燒豆腐食材\n主料： 蝦仁 100克、魷魚 100克、白菜仔 100克、普寧豆腐 2件、薑 3片、蒜頭 2粒（切片）\n\n海鮮醃料： 鹽 1/4茶匙、胡椒粉 少許、生粉 半茶匙\n\n芡汁： 清水 3/4杯、蠔油 1湯匙、生抽 1湯匙、糖 1茶匙、生粉 1茶匙\n\n海鮮紅燒豆腐做法\n蝦仁去殼挑腸，魷魚輕切花紋再切件，分別下醃料拌勻略醃。\n\n普寧豆腐切件，抹乾水分後放入油鍋炸至金黃，盛起備用。\n\n原鍋剩下少許油，爆香薑片、蒜片，下清水，加入白菜仔炒至約八成熟，盛起備用。\n\n原鍋下薑片、蒜片爆香，先放入蝦仁炒至八、九成熟，盛起，原鍋再放入魷魚炒香，灒酒後盛起備用。\n\n另起油鍋，爆香薑片、蒜片，灒酒，將芡汁拌勻下鍋。\n\n待芡汁煮滾，放入普寧豆腐、白菜仔煮至入味。\n\n海鮮回鍋，合蓋煮約30秒，原鍋上桌，即成。","image":"https://pro-img-cdn.tvb.com/uploads/file/2026/11/2026le7VThqtLA1794820156.webp?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cacd5520450","title":"萬千星輝賀台慶2026懶人包｜全台員傾力演出 羅嘉良許志安任特別嘉賓","url":"https://news.tvb.com/tc/1207253-萬千星輝賀台慶2026懶人包全台員傾力演出羅嘉良許志安任特別嘉賓","summary":"TVB今日（19日）迎來59周年台慶大日子，大型特備節目《萬千星輝賀台慶》將於今晚7時許在電視廣播城隆重舉行，並由翡翠台全程現場直播。今年台慶陣容鼎盛，除了集結全台逾200位藝員及歌手施展渾身解數帶來連場精彩表演外，更重磅邀得三屆視帝羅嘉良及許志安擔任特別嘉賓，勢必將全晚氣氛推向高峰。","summary_short":"TVB今日（19日）迎來59周年台慶大日子，大型特備節目《萬千星輝賀台慶》將於今晚7時許在電視廣播城隆重舉行…","digest":"TVB迎來59周年台慶大日子…","points":["TVB今日（19日）迎來59周年台慶大日子，大型特備節目《萬千星輝賀台慶》將於今晚7時許在電…","今年台慶陣容鼎盛，除了集結全台逾200位藝員及歌手施展渾身解數帶來連場精彩表演外…","大會司儀陣容同樣星光熠熠，由汪明荃領軍，聯同林溥來、朱凱婷、周奕瑋、洪永城、黃翠如、陸浩明…"],"section":"生活","category":"娛樂","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T16:08:00+08:00","size":1,"keywords":["萬千星輝賀台慶2026"],"body":"TVB今日（19日）迎來59周年台慶大日子，大型特備節目《萬千星輝賀台慶》將於今晚7時許在電視廣播城隆重舉行，並由翡翠台全程現場直播。今年台慶陣容鼎盛，除了集結全台逾200位藝員及歌手施展渾身解數帶來連場精彩表演外，更重磅邀得三屆視帝羅嘉良及許志安擔任特別嘉賓，勢必將全晚氣氛推向高峰。\n\n大會司儀陣容同樣星光熠熠，由汪明荃領軍，聯同林溥來、朱凱婷、周奕瑋、洪永城、黃翠如、陸浩明、麥美恩、鄭衍峰、林秀怡、孔德賢及潘靜文合共12位主持坐鎮全場。除了連串歌舞及特備演出外，每年備受矚目的台慶大抽獎亦已準備就緒，獎金獎品相當豐富，與全港觀眾一齊熱鬧歡度TVB 59歲生日派對。\n\nPART 1 OPENING\n張振朗、劉穎鏇、周嘉洛、吳偉豪、朱敏瀚、陳曉華、馬貫東、劉佩玥、羅天宇、黃庭鋒等率領逾80藝員齊集6號幹線 (中九龍繞道—九龍灣段)揭開台慶序幕。 三屆視帝羅嘉良（撈家）孖關嘉敏、游嘉欣、李海銅、鍾柔美、劉芷君、羅天宇及劉倬昕等新生代藝人再現《難兄難弟》精彩場面，齊齊唱《奇哥》！\n\nPART 2 東張女神盃\n6位東張女神包括李旻芳、梁敏巧、黎寬怡、甘詠寧、何沛珈、陳庭欣手持咪進行400米跑步比賽，最終李旻芳奪得第一名，何沛珈包尾！","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026gmhmtjhpHl1795075774.png?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c83568865b9","title":"VTC委任民政署前署長張趙凱渝任執行幹事 明年起接替唐智強","url":"https://www.stheadline.com/edu-insights/3638861/VTC委任民政署前署長張趙凱渝任執行幹事-明年起接替唐智強","summary":"職業訓練局（VTC）公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事，接替即將卸任的唐智強，明年1月1日起生效。","summary_short":"職業訓練局（VTC）公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事，接替即將卸任的唐智強…","digest":"職業訓練局公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事…","points":["職業訓練局（VTC）公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事…","延伸閱讀：職訓局新學年增至逾14000學額 140項課程涵蓋AI與文創產業 航空及航海教育中…","張趙凱渝為資深政務官，1986年加入政府服務近40年，曾於政府多個決策局及部門工作…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:14:21+08:00","size":1,"keywords":[],"body":"職業訓練局（VTC）公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事，接替即將卸任的唐智強，明年1月1日起生效。\n延伸閱讀：職訓局新學年增至逾14000學額 140項課程涵蓋AI與文創產業 航空及航海教育中心明年落成\n張趙凱渝為資深政務官，1986年加入政府服務近40年，曾於政府多個決策局及部門工作，包括2019年至2022年出任運輸及房屋局副秘書長（房屋）／房屋署副署長（策略），2022年起出任民政事務總署署長至2025年退休。VTC透過公開招聘，挑選張趙凱渝接任執行幹事。\nVTC主席林健鋒表示，張趙凱渝有卓越的領導和管理能力，及廣闊政策視野，對香港未來人才發展需要具深刻見解，相信她將帶領VTC深化與政府、業界及社會各界的合作，培育更多人才配合經濟轉型及產業發展需要，為香港及國家的高質量發展注入新動力。\n即將卸任的唐智強，自2022年起出任執行幹事。林健鋒讚揚他以前瞻視野，帶領VTC在多個範疇取得重要成果，並積極配合國家及香港的發展策略，加強職專教育與產業需要的聯繫。\n延伸閱讀：VTC轄下牙科護理文憑 首屆畢業生就業率近百分百\n唐智強任內推動多項校園設施發展項目，包括茶果嶺新校舍發展計劃、VTC航空及航海教育中心，以及升降機及自動梯科技中心等，並帶領VTC成立香港資訊科技學院（HKIIT），成為本港首間專注培育資訊科技人才的專上學院。\n本報記者","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce515f8a09b","title":"孟京辉：在浪漫与科技间试探戏剧边界","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734596.shtml","summary":"中新网杭州11月19日电(林波 孙琳茹)“现在戏剧和以前不一样了。","summary_short":"中新网杭州11月19日电(林波 孙琳茹)“现在戏剧和以前不一样了。","digest":"“现在戏剧和以前不一样了","points":["中新网杭州11月19日电(林波 孙琳茹)“现在戏剧和以前不一样了","”11月18日至26日，2026第十五届杭州当代戏剧季在杭州举行","其间，戏剧导演孟京辉受访时表示，当下戏剧正走出小众剧场，被越来越多年轻人喜爱…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:08:44+08:00","size":1,"keywords":[],"body":"中新网杭州11月19日电(林波 孙琳茹)“现在戏剧和以前不一样了。”11月18日至26日，2026第十五届杭州当代戏剧季在杭州举行。其间，戏剧导演孟京辉受访时表示，当下戏剧正走出小众剧场，被越来越多年轻人喜爱，持续释放独特魅力。\n\n　　作为综合艺术，戏剧兼具即时性与感染力，能够吸纳音乐、舞蹈、文学、影像等各类艺术表达，也因此催生了遍地开花的戏剧节生态。\n\n　　在孟京辉看来，乌镇戏剧节的国际化、阿那亚戏剧节扎根海边的生活质感，各有风姿。“杭州当代戏剧季，生长在这座江南城市，又落址滨江这片科创高地，正在酝酿独属于自己的气质。”\n\n11月18日晚，孟京辉在2026第十五届杭州当代戏剧季上分享。　孙琳茹 摄\n\n　　“我希望杭州的戏剧，更浪漫一点。”孟京辉说，信息互通的时代里，城市之间的文化壁垒日渐消弭，但一场戏剧事件的内在质感，是地域赋予的独特标识。\n\n　　作为第十五届杭州当代戏剧季的艺术总监，孟京辉表示，杭州当代戏剧季始终贴着城市脉搏生长，十五年的沉淀，不是追逐一时热度，而是一场长效、持续的艺术实践。\n\n　　他说：“艺术这件事急不得，需要慢慢酝酿，新的想法、新的表达，才会一点点孕育出来。”\n\n　　对杭州，孟京辉有着绵长的情感联结。《恋爱的犀牛》除北京之外，在杭州演出场次最多，这片土地见证了这部先锋经典的传播；去年，余华作品《古典爱情》的舞台改编，也在这里落地。\n\n《恋爱的犀牛》剧照。(资料图，主办方供图)\n\n　　浪漫的底色之外，孟京辉把更多目光投向科技与戏剧的碰撞——让古老东方文化基因，和前沿科技碰撞，为当代戏剧打开新的想象空间。譬如，在《古典爱情》中，实时动态捕捉装置就已经让身体直接触发灯光与影像，技术的逻辑被接入戏剧的语法。\n\n　　在孟京辉手里，科技不是舞台奇观，而是一种新的戏剧身体。\n\n　　边界的试探，不只发生在浪漫与科技之间，也发生在代际之间。十五年一轮回望，经典的回响之外，更令他欣喜的是青年创作者的崛起。\n\n　　他注意到，新一代创作者的视角、舞台空间处理方式、叙事节奏都跳出过去的固有框架，如《今晚，朝阳水库淹没亚细亚》这类轻盈的新作，以小见大，把目光投向个体内心，藏着细腻的人文关怀，展现出新生代不容小觑的创作力量。\n\n　　在他眼中，戏剧天然拥有吸纳时代美好能量的能力，不同路径的探索，都是在拓宽戏剧的边界。\n\n　　“年复一年，我们想要的不仅仅是让观众感受戏剧的能量，我们更想要试探戏剧能量的边界。”正如《恋爱的犀牛》中那句广为流传的台词——“爱她，是我一生中做过的最好的事情”，这部承载一代人记忆的作品，传递着关于爱、理想与孤独的诗意。\n\n　　“我们也将继续兼顾大小剧目，兼容经典与新锐，在浪漫的底色之上，持续探索戏剧的当代表达，让戏剧扎根城市，陪伴一代又一代观众与创作者，持续生长。”谈及下一步探索方向，孟京辉如是说。\n\n　　在浪漫与科技之间，这位戏剧导演仍在试探边界，也试图让戏剧在城市与时代里长出新的可能。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c668d2fda89","title":"林子祥歌曲〈敢愛敢做〉登陸GTA 6 網民惡搞海報狂抽黑歷史 繼〈季候風〉再有粵語歌衝向國際","url":"https://www.stheadline.com/film-drama/3638856/林子祥歌曲敢愛敢做登陸GTA-6-網民惡搞海報狂抽黑歷史-繼季候風再有粵語歌衝向國際","summary":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式開售，隨即在全球玩家群中掀起熱潮。","summary_short":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式開售…","digest":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto…","points":["歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）…","不少華人玩家在遊戲中發現，當車載電台切換至「萬花筒FM」（Kaleidoscope FM）時…","這首歌正是香港殿堂級歌手林子祥在1987年推出的經典流行金曲〈敢愛敢做〉"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:07:00+08:00","size":1,"keywords":[],"body":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式開售，隨即在全球玩家群中掀起熱潮。不少華人玩家在遊戲中發現，當車載電台切換至「萬花筒FM」（Kaleidoscope FM）時，背景音樂竟然傳出非常親切的粵語歌。這首歌正是香港殿堂級歌手林子祥在1987年推出的經典流行金曲〈敢愛敢做〉。這一發現隨即在 Threads、Instagram 及微博等各大社交平台引發熱烈討論。\n網民讚流行經典長青：完美貼合遊戲氛圍\n雖然〈敢愛敢做〉是改編自美國組合 Starship 的經典名曲〈Nothing's Gonna Stop Us Now〉，但不少網民和玩家都認為，林子祥的版本唱得極具爆發力，甚至比原版更具感染力。歌曲旋律與歌詞亦相當貼合《GTA》系列狂野不羈的遊戲風格，其中一句歌詞「個個說我太狂 笑我不羈」更瞬間成為網絡金句。有玩家興奮表示：「沒想到能在《GTA 6》裡聽到林子祥的歌！」、「官方選曲真的非常出色，既浪漫又充滿激情。」\n相關閱讀：The Weeknd啟德演唱會丨新歌〈Hong Kong〉神級Sampling王菲〈季候風〉 專屬MV玩王家衛風\n繼 The Weeknd 採樣王菲後 再有粵語歌登上國際舞台\n這已不是近期首度有粵語流行曲登上國際舞台。加拿大流行天王 The Weeknd 上月在啟德體育園舉行香港站演唱會時，曾在現場首唱新歌〈Hong Kong〉，當中破天荒採樣了樂壇天后王菲的粵語經典〈季候風〉，當時在網上引發極大迴響。\n事隔僅個多月，再有粵語流行歌衝出國際。伴隨著《GTA 6》龐大的玩家基數，不少玩家預測林子祥這首經典金曲將在短期內重新席捲各大音樂串流平台，讓全球更多聽眾認識到香港80年代流行音樂的魅力。\n車載電台搜羅各地曲風 網民幽默聯想陳年舊聞\n在遊戲的「萬花筒FM」電台中，搜羅了世界各地、橫跨不同年代的多元流行樂曲。當電台播放此曲時，遊戲螢幕會顯示歌手為「GEORGE LAM」，而歌名則以漢語拼音標註為〈GAN AI GAN ZUO〉。除了林子祥的作品外，該電台亦收錄了 Ariana Grande〈Break Free〉、Drake〈Hold On, We're Going Home〉、Dua Lipa〈Go Easy〉，以及韓國女團 BLACKPINK 成員 Jisoo〈Earthquake〉與 Jennie〈Mantra〉等國際熱門歌曲。\n有趣的是，《GTA》系列一向主打犯罪與黑色幽默題材，有網民笑言官方之所以挑選林子祥，或許是聯想到他於1999年在美國夏威夷涉嫌意外拿走太陽眼鏡的陳年舊聞。更有創意爆棚的網民利用 AI 製作了二創宣傳海報，將遊戲男主角換成身穿白色背心、留著招牌鬍鬚的林子祥，海報中的女主角更刻意拿著一副黑色太陽眼鏡，幽默點子逗樂不少網民。\n相關閱讀：林子祥葉蒨文演唱會激咀逐格睇 錫完一動作超甜密 Sally撒嬌如少女：我青春畀你攞晒\nThe Weeknd在巡迴香港站推出新歌〈Hong Kong〉：","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3d6f4b5bbc","title":"周末6大免費親子活動推介 玩轉西九爵士音樂節/太空館觀星/文化嘉年華 附時間地點","url":"https://www.stheadline.com/ohpama/3638390/周末6大免費親子活動推介-玩轉西九爵士音樂節太空館觀星文化嘉年華-附時間地點","summary":"親子好去處2026｜今個周末還在想帶小朋友去哪裡？","summary_short":"親子好去處2026｜今個周末還在想帶小朋友去哪裡？","digest":"親子好去處2026｜今個周末還在想帶小朋友去哪裡","points":["親子好去處2026｜今個周末還在想帶小朋友去哪裡","本週末有不少精彩活動，全部免費入場","無論想帶小朋友欣賞爵士音樂節、親子觀星，抑或參與民族嘉年華及親子工作坊等…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T11:41:17+08:00","size":1,"keywords":[],"body":"親子好去處2026｜今個周末還在想帶小朋友去哪裡？本週末有不少精彩活動，全部免費入場！無論想帶小朋友欣賞爵士音樂節、親子觀星，抑或參與民族嘉年華及親子工作坊等，以下5大親子活動都能滿足不同需要的小朋友。立即記下以下活動時間、地點及參加詳情！\n博愛醫院 Chill Buddy 親子嘉年華\n「Chill Buddy 親子嘉年華」透過創意互動遊戲，讓家長與小朋友增進溝通及認識情緒。活動特設四大特色攤位，包括考驗默契、由家長蒙眼按子女指示畫畫的「蒙眼藝術家」；保密寫下心事換取鼓勵小卡的「樹洞回音」；將煩惱貼在冰壺推向解決方案、寓意減壓的「冰壺壓力回收站」；以及讓親子共同製作個性風鈴的「『魚』眾不同」。完成攤位遊戲即可獲得小禮物一份。\nChill Buddy 親子嘉年華 \n活動日期：2026年11月21日\n活動時間：11:00-18:00 \n活動地點：牛頭角上邨商場對出空地\n參加方法：費用全免，即場參加\n太空館 星空遊樂園\n今個周末太空館會化身成「星空遊樂園」，參加者可在天台使用天文望遠鏡觀賞維港上的星光，也可在展覽廳參與遊戲，認識天文知識。天台觀星活動共4節，每節約25分鐘，活動內容相同，每節名額80人。\n（圖片來源：香港太空館網站）\n太空館 星空遊樂園\n活動日期：2026年11月21日\n活動時間：19:00-21:00 \n活動地點： 香港太空館展覽廳及天台\n參加方法：於當天下午6:30在太空館正門處派發免費參加證，先到先得，額滿即止\n康文署《亞裔藝采+ 2026》嘉年華\n戶外嘉年華「亞裔藝采+」以「禮意綻放」為主題匯聚約30個國家及地區代表，帶來多元歌舞與親子工作坊。同場的「盛禮薈萃」民族文化展覽則展出各地珍貴手工藝藏品，適合一家大小共同探索不同文化的獨特風采。\n（圖片來源：香港特別行政區政府新聞公報網站）\n康文署《亞裔藝采+ 2026》嘉年華\n活動日期：2026年11月22日\n活動時間：14:00-18:00 \n活動地點： 九龍尖沙咀梳士巴利道10號香港文化中心大堂及露天廣場\n參加方法：免費入場，更多詳情可按此瀏覽\n國泰 西九爵士音樂節 \n今年「國泰西九爵士音樂節」免費演出雲集本地、中國內地、泰國、韓國及歐洲等地逾30個音樂單位，讓大小朋友感受即興與跨界音樂火花！一家大細可於大草坪及海濱西草坪邊野餐放電、邊逛15個本地品牌美食市集，或到M+草坪欣賞非洲鼓及手碟等特色樂器演出。現場詢問處更免費提供護耳罩借用，貼心照顧小朋友聽覺需要！\n由即日起於網上或國泰西九爵士音樂節現場登記成為 「西九演藝藝探會員」，只需出示有效會員證明，即可於11月21、22日到大草坪（餐飲市集）免費換領迎新飲品指定啤酒或特調汽水1罐（數量有限，先到先得，換完即止）。\n（圖片來源：WestK 西九文化區 instagram）\n（圖片來源：西九文化區網站）\n\n國泰西九爵士音樂節-免費音樂節目\n活動日期：2026年11月17日至22日\n活動時間：\n• 11月17至20日：20:15-22:45\n• 11月21日：14:30-22:30\n• 11月22日：14:00-22:45\n活動地點： 西九文化區（留白Livehouse、大草坪、海濱西草坪）\n參加方法：免費入場，部分項目需提早購票，更多詳情可按此瀏覽\nYMCA 「愛 • 和平」行動 2026\n由香港中華基督教青年會（YMCA）舉辦的「愛‧和平」行動2026，當日邀請到巴黎殘疾人奧運會輪椅羽毛球銀牌得主陳浩源先生擔任活動大使，鼓勵大眾透過運動關心自己、關愛他人。現場亦設有多個精彩攤位，參加者完成攤位遊戲更可換領豐富禮品，適合一家大小共同參與，盡興而歸。\n（圖片來源：Chinese YMCA of Hong Kong 香港中華基督教青年會 Facebook）\nYMCA 「愛 • 和平」行動 2026\n活動日期：2026年11月21日\n活動時間：14:30-17:00 \n活動地點： 啟德雙子匯2期8樓\n參加方法：免費入場\n香港女童軍總會 營地同樂日\n香港女童軍總會舉辦的營地同樂日設有3大特色活動，包括「減壓捏捏球」，參加者可發揮創意並搭配色彩，親手製作獨一無二的可愛小物。「拼豆創作」則以像素風手作形式，讓大眾利用色彩繽紛的拼豆拼砌喜愛圖案。以及「手轉小陀螺彩繪」，為經典木製小陀螺繪上獨特色彩與圖案，轉動時色彩斑斕，更可與家人及朋友即時展開陀螺大賽。無論大人或小朋友，均可一同享受這個充滿歡笑與探索的開放日。\n官方圖片\n香港女童軍總會-營地同樂日\n活動日期：2026年11月22日 \n活動時間：13:00-17:00\n活動地點：香港女童軍總會 梁省德海上活動訓練中心（大埔大美督船灣淡水湖側）\n參加方便：毋須預約，即場登記，費用全免","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":21,"items":[{"id":"c04e80669f7","title":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研、投』協同發展」議員議案總結發言","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900402.htm","summary":"以下是創新科技及工業局局長孫東教授今日（十一月十九日）在立法會會議就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研…","summary_short":"以下是創新科技及工業局局長孫東教授今日（十一月十九日）在立法會會議就「全面提升大學科研成果轉化能力…","digest":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力…","points":["再次感謝劉智鵬議員提出這項議案，並感謝李廣宇議員提出修正案，以及30位議員踴躍發言","為此，我們以產業鏈部署北都創科用地及產業園區的協同分工…","在整個布局中，北都新田、洪水橋和打鼓嶺三個大學城負責提供基礎科研與人才培養…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:07:00+08:00","size":4,"keywords":[],"body":"以下是創新科技及工業局局長孫東教授今日（十一月十九日）在立法會會議就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研、投』協同發展」議員議案的總結發言：\n\n主席：\n\n　　再次感謝劉智鵬議員提出這項議案，並感謝李廣宇議員提出修正案，以及30位議員踴躍發言。議員的意見有助政府思考如何進一步優化各項創科政策與資源配置。我現在就深化北都（北部都會區）「政、產、學、研、投」協作，以及推動大學科研成果轉化的工作，作綜合回應。\n\n　　多位議員關注到北都大學城與周邊園區的聯動效益，這亦是《香港第一個五年規劃》的焦點之一。規劃明確提出要鼓勵北都大學城內的院校與周邊產業園協同發展，融合打通「產、學、研」鏈條。為此，我們以產業鏈部署北都創科用地及產業園區的協同分工，將北都從單純的土地供應來源轉化為產業成長的基地。在整個布局中，北都新田、洪水橋和打鼓嶺三個大學城負責提供基礎科研與人才培養，而河套香港園區和新田科技城等則接力負責成果轉化與中試產業發展，全面落實教育、科技、產業一體化發展。\n\n　　《香港第一個五年規劃》提出要優先建設的河套香港園區將聚焦上中游研發、成果轉化與中試，其首批八座大樓將於今年年底前全部落成，同時亦已推出另外五組地塊招標，將於下月公布招標結果。截至今年十月底，已有超過130間科技企業、大學及科研機構簽署租約並進駐河套香港園區，當中不乏國際龍頭、獨角獸企業以及首次在香港設立據點的企業。在硬件配套上，感謝立法會批准37億元撥款，當中約15億元將用於園區內建設生命樣本庫及高效能運算設施等公共設施，為跨境數據及生物樣本流動提供關鍵支撐。河套香港園區正積極構建科研成果轉化生態圈。首屆培育計劃已經展開，為初創企業提供孵化及加速支援，協助具潛力的科研項目加快商品化及產業化進程。而將於今年年底落成的河套學研壹號將匯聚頂尖大學與機構的前沿科研力量，促進「大學＋研發＋產業」的互動銜接，推動科研成果與市場需求更有效對接。\n\n　　在下游承接方面，新田科技城是北都創科產業發展核心，提供原型開發、中試甚至量產空間。其約210公頃的新創科用地是香港規模最大的產業基地，可承接河套香港園區的科研成果轉化，作為生產和展示的基地，提升本地研發成果「從1到100」的轉化能力。加上同樣位處北都的沙嶺數據園區、元朗創新園、香港微電子研發院的中試線設備和洪水橋產業園等，各園區各司其職、優勢互補，構建「產、學、研」一體化產業空間。在政策軟件上，我們將從下月起啓動數據流跨境試點安排，正式開啓「四流」跨境流通的第一步，讓人才、企業、大學及科研機構精準對接，打通從實驗室到市場的完整創新生態鏈。\n\n　　連同科學園以及數碼港，三大創科園區按地理位置及產業定位分工，共同構成香港「北中南」發展新格局，各有側重地推進科研成果轉化與商品化工作。其中，香港科技園公司（科技園公司）透過其培育初創企業的經驗、投資者及商業網絡，協助初創企業拓展業務，促進技術轉移和研發成果商品化。今年《施政報告》宣布，政府將支持科技園公司研究設立「香港創科應用場景促進中心」，精準配對公私營界別的應用場景需求，打通創新成果由研發、試驗到應用市場的關鍵環節，加快科研成果轉化及產業化落地，協助對接行業標準並獲取市場認證，助力創科企業出海。至於數碼港，作為香港數碼科技樞紐及人工智能加速器，一直與本地大學緊密合作，透過創業培訓、導師指導、種子資金及培育支援，協助大學團隊把科研成果和創新意念轉化為商業方案，至今已為超過2 400間企業提供支援。\n\n　　多位議員關注「產學研1+計劃」能否切實達到起動科研成果商品化的效果。該計劃旨在通過配對方式，資助有潛力成為成功初創企業的大學研發團隊，促進優秀科技研發成果轉化及商品化。我們歡迎大學和研發團隊吸引更多來自各方（包括內地與海外）的投資，把實驗室的優秀科研成果帶到市場。為了令未來的審批過程更加順暢，我相信計劃的督導委員會在審批申請時，除了全面考慮項目本身的市場與商業化潛力外，亦會採取更具彈性的安排，適當兼顧不同科技範疇項目（例如新藥研發與前沿科技）在研發與商品化過程中所需要的不同時間和周期。\n\n　　除了「產學研1+計劃」，創新科技署亦推出了一系列措施，包括「新型工業加速計劃」、「創科加速器先導計劃」和「創科產業引導基金」。「新型工業加速計劃」為從事策略性產業並在香港設立新智能生產設施的企業，以1（政府）比2（企業）的配對形式提供資助，每家企業的獲資助總額上限為二億元。計劃至今已公布支持九宗申請，分別聚焦生命健康科技與先進製造兩大範疇，帶動約43億元總投資。「創科加速器先導計劃」用以吸引海內外具經驗的創科加速器進駐香港，培育本地初創企業。這亦呼應《香港第一個五年規劃》強調要培育具國際競爭力的創科企業的目標。計劃推出後共收到超過50宗申請，目前獲選的九間機構均擁有豐富的全球網絡和行業資源，將為本地初創企業提供共享空間、研發支援、投資對接以及市場拓展等全方位的增值服務。至於「創科產業引導基金」，則是為了加強引導市場資金投資指定策略性新興和未來產業，系統性建設香港創科產業生態圈。引導基金採用市場化的運作方式，由獲甄選的基金經理成立及管理五個主題板塊的子基金，負責籌集市場資金、日常營運，及根據投資框架投資合適的項目。我們已初步甄選約20間基金經理公司，目前正進行籌募資金及成立子基金的工作，預期將於今年內正式啓動。\n\n　　與此同時，《香港第一個五年規劃》提出要全面鞏固提升和發揮在港的全國重點實驗室和InnoHK創新香港研發平台（InnoHK）的「雙基地」優勢。在港全國重點實驗室作為國家級基地，承載着強化原始創新和突破關鍵技術的重任。創新科技署將持續投放資源優化基礎設施，全力支持本地指定大學團隊聚焦國家戰略科技領域，深化與內地優勢互補。作為高水平科研及成果轉化基地，InnoHK旗下的三個集群，即醫療科技、人工智能和可持續發展、能源、先進製造及材料，已匯聚超過3 000名本地及全球科研人員，並成功吸引本地大學與來自12個經濟體、超過30間世界頂尖大學與研究機構共同建立實驗室，助力科研成果轉化為具影響力的實際應用，帶動相關產業發展。我們亦會繼續透過「研究人才庫」、「創科實習計劃」以及「新型工業化及科技培訓計劃」等措施，加強對在學及在職科技人才的培訓與支援，協助企業吸納及培育本地人才，並配合河套香港園區及新田科技城等平台，為本地人才提供更多應用場景及就業機會。\n\n　　隨着各項措施和計劃陸續推進，我們會適時檢討因應運作效益計劃的相關安排，以期讓計劃更趨完善，促進產學研協作，激勵大學將更多優秀研發成果轉化及商品化，推動上中下游協調發展。\n\n　　主席，《香港第一個五年規劃》提出要在北都以科技引領「產、學、研」協同創新體系：香港正在抓緊建設北都大學城，以及構建「三大創科園區、五大研發機構」的新創科布局，加速創新生態鏈成型。政府將會因應最新發展與產業需求，按部就班落實各項優化與建設措施，積極結合與凝聚大學和社會各界的創科力量，全面提升香港的科研成果轉化能力。\n\n　　我再次感謝今日多位發言議員給予的寶貴意見。本人謹此陳辭。多謝主席。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研、投』協同發展」議員議案總結發言","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900402.htm","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:07:00+08:00","category":"","digest":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力…"},{"title":"立法會：教育局副局長就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研、投』協同發展」議員議案總結發言","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900400.htm","source_display":"香港政府新闻公报","published_at":"2026-11-19T15:36:00+08:00","category":"","digest":"立法會：教育局副局長就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產…"},{"title":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研、投』協同發展」議員議案開場發言","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900295.htm","source_display":"香港政府新闻公报","published_at":"2026-11-19T12:43:00+08:00","category":"","digest":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力…"},{"title":"立法會：教育局副局長就「深化國際教育樞紐建設，構建國際升學首選地」議員議案總結發言","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900291.htm","source_display":"香港政府新闻公报","published_at":"2026-11-19T12:35:00+08:00","category":"","digest":"立法會：教育局副局長就「深化國際教育樞紐建設…"}],"cross":{"total":4,"angles":[{"point":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力…","sources":["香港政府新闻公报","香港政府新闻公报"],"url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900402.htm"},{"point":"立法會：教育局副局長就「深化國際教育樞紐建設…","sources":["香港政府新闻公报"],"url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900291.htm"},{"point":"立法會：教育局副局長就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產…","sources":["香港政府新闻公报"],"url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900400.htm"}]}},{"id":"ce83107ce70","title":"2026香港資訊及通訊科技獎踏入二十周年 表揚卓越創科成果","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900414.htm","summary":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會頒發全年大獎。","summary_short":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造…","digest":"2026香港資訊及通訊科技獎頒奬典禮今晚舉行…","points":["2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行…","勝出隊伍憑「人工智慧清潔水箱機器人」繼獲得商業方案獎大獎後，再勇奪今年比賽的最高殊榮","財政司司長陳茂波在頒獎典禮致辭時表示：「回顧歷屆得獎作品，足見科技發展一日千里"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T20:10:00+08:00","size":1,"keywords":[],"body":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會頒發全年大獎。勝出隊伍憑「人工智慧清潔水箱機器人」繼獲得商業方案獎大獎後，再勇奪今年比賽的最高殊榮。\n\n　　財政司司長陳茂波在頒獎典禮致辭時表示：「回顧歷屆得獎作品，足見科技發展一日千里。科技日新月異，但歷屆得獎者始終有一個共通之處：他們洞悉社會所需，並以創新方法回應需要。」\n\n　　陳茂波指出，人工智能現已廣泛應用，但部分最重要的應用或尚待發掘。他說：「人工智能固然有助我們把現有工作做得更好，但更值得深思的是，它能讓我們以何種嶄新方式行事。今晚不少得獎者正為我們指引方向。他們所展示的，不僅是人工智能的功能，更是人工智能為大眾開創的種種可能。」\n\n　　他指出，政府的角色是為創新者締造有利的發展條件。政府正透過「AI+與產業發展策略委員會」，推動更多產業應用人工智能。興建中的沙嶺數據園區將提升香港的算力；香港人工智能研發院會促進科研成果轉化為實際應用。政府亦致力培育專才，並透過「全民AI」計劃，協助社會各界善用人工智能。\n\n　　香港資訊及通訊科技獎自二○○六年設立以來，一直是本地資訊科技界的年度盛事。獎項今年踏入二十周年，見證着香港資訊及通訊科技業界多年來的創新與發展，並持續表揚在資訊及通訊科技發明及應用方面表現出色的企業和人才，鼓勵業界精益求精，發揮創意，推動創新科技發展，並積極開拓內地及海外市場。\n\n　　這項年度盛事由數字政策辦公室舉辦，並在八個籌辦機構、督導委員會、標準保證小組委員會、最終評審委員會、市場推廣小組委員會、各評審和支持機構及業界組織的共同支持下順利舉行。最終評審委員會主席、香港浸會大學校長衞炳江教授衷心祝賀所有得獎者，並對本屆參賽者和得獎者所展現的才華、熱誠及投入深感鼓舞。\n\n　　衞炳江教授說：「各位得獎者憑藉深厚的專業知識、嚴謹的研發精神和出色的執行能力脫穎而出，實至名歸。他們的成就彰顯香港資訊及通訊科技業蓬勃發展；而這份蓬勃活力，正有賴業界一眾從業員、科研人員、創業者及專業團隊多年來的努力、投入和貢獻。他們持續把創新意念轉化為具實際效益的方案，進一步印證香港作為國際創新科技中心的實力與潛力。」\n\n　　創新科技及工業局局長孫東教授在頒獎典禮上頒發獎座予八個獎項類別的大獎得主，嘉許他們的傑出表現。各大獎得主為：\n\n 獎項類別\n\n （籌辦機構）\n 大獎得主\n\n （作品名稱）\n\n 數碼娛樂獎\n\n （香港數碼娛樂協會）\n 極專注有限公司 \n\n （QuestXR結合AI的XR遊戲創作平台）\n\n 金融科技獎\n\n （香港銀行學會）\n 亞丁金融控股有限公司\n\n （亞丁場外資產電子化交易平台）\n\n 資訊科技初創企業獎\n\n （香港無線科技商會）\n 炫幻視界\n\n （智匯：危機應變智能體）\n\n 商業方案獎 \n\n （香港電腦學會）\n 機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會\n\n （人工智慧清潔水箱機器人）\n\n 智慧生活獎\n\n （香港資訊科技商會）\n 鋒視有限公司\n\n （面具師® — 具身智能神經康復系統）\n\n 智慧出行獎\n\n （香港貨品編碼協會）\n 港鐵公司\n\n （無人機隧道巡檢系統）\n\n 智慧市民獎\n\n （香港社會服務聯會）\n 健聲科技有限公司\n\n （聲語同行）\n\n 學生創新獎\n\n （香港創科發展協會）\n 香港科技大學（李思晉／黎卓寧／梁晶晶／吳卓庭）／香港中文大學（陳顥邦）\n\n （Syntrak）\n\n　　得獎者及比賽的詳細資料已上載香港資訊及通訊科技獎網站（www.hkictawards.hk）。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0698d4af4a","title":"發展局局長出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮致辭","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900572.htm","summary":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）、許教授（古物諮詢委員會主席許焯權教授）、蘇教授（保育歷史建築諮詢委員會主…","summary_short":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）…","digest":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物…","points":["尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）…","時間過得很快，兩年前我們公布香港首次發現恐龍化石，都是在這裏公布，當時全城雀躍哄動","發展局接着與中國科學院古脊椎動物與古人類研究所（古脊椎所）簽署《框架協議》（《關於深化地層古…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T19:02:00+08:00","size":1,"keywords":[],"body":"以下是發展局局長甯漢豪今日（十一月十九日）出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：\n\n尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）、許教授（古物諮詢委員會主席許焯權教授）、蘇教授（保育歷史建築諮詢委員會主席蘇彰德教授）、各位嘉賓、各位朋友：\n\n　　大家好。首先歡迎各位出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮。\n\n　　時間過得很快，兩年前我們公布香港首次發現恐龍化石，都是在這裏公布，當時全城雀躍哄動。發展局接着與中國科學院古脊椎動物與古人類研究所（古脊椎所）簽署《框架協議》（《關於深化地層古生物及史前時期遺址領域交流與合作的框架協議》），開展緊密合作，馬上進行赤洲恐龍化石的發掘、清修和研究工作。\n\n　　赤洲恐龍化石發掘工作在二○二四年十月開展。當時赤洲一帶風浪極大，加上化石岩層位於海邊斜坡上，發掘期間還遇上颱風及不穩定天氣，為發掘和田野研究工作帶來極大挑戰。發掘完成後，化石清修工作馬上展開，經過專家兩年的努力，多件恐龍化石標本才逐漸顯露其真正容貌；接着由恐龍專家進行深入研究工作。經古脊椎所專家鑑定，赤洲出土的多件恐龍骨骼化石，很可能來自同一隻屬於「泰坦巨龍形類」的恐龍。\n\n　　隨着清修和研究工作逐步完成，我們籌備了這個展覽。展覽的名稱為「見龍在田」，其實亦有其故事。「見龍在田」是出自《易經》一個卦象，其直接意思就是發現一隻神秘的龍離開了潛伏之地，現身在田野大地，顯露其鋒芒。其實與今次展覽非常貼切，我們在赤洲有神秘的恐龍，被發現並展現在大地上顯露其鋒芒。今次這個展覽不單標誌着在香港首次發現恐龍化石這難得的事情，更是要強調這些化石展現給大家看牠們當年的鋒芒、蘊藏的歷史，展現香港遠古生態環境。\n\n　　展覽以赤洲恐龍為切入點，公布今次研究工作的階段性成果，包括從合共31塊含有化石的岩石標本清修出來的恐龍骨骼化石，剛才我提到應該來自同一隻恐龍，而其實專家還認為它們都是來自該恐龍身上的某一個部位，究竟是哪個部位，我相信大家看完展覽後便會清楚。這次展覽也展示國家在恐龍研究方面的成就，並且匯聚了來自內地四家博物館及研究機構共54組展品，其中化石有46組，當中多達七成是國家一級重點保護古生物化石，絕大部分都是首次在港展出，所以非常珍貴。為了配合展覽和推廣古生物，特別是恐龍的知識，策展團隊特別安排一系列的公眾講座和多元有趣的工作坊等教育活動，讓公眾享受古生物化石的樂趣。\n\n　　我要特別感謝古脊椎所，他們在恐龍化石的發掘、清修、研究，以至挑選展品和策展方面，提供了專業的指導及協助，並借出珍貴化石標本作為展品。我要特別感謝來自廣西壯族自治區自然博物館、浙江自然博物院，以及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴藏品。我亦要感謝特區政府的漁農自然護理署，協助採集化石的工作，亦感謝發展局轄下古蹟辦（古物古蹟辦事處）的團隊及古脊椎所團隊一起充滿熱情地參與鑑定和保護化石。經策展團隊悉心策劃，我們促成了這次「見龍在田」展覽，而其突出之處，就是大家不單看到赤洲的恐龍化石，亦可以看到來自內地不同地方的恐龍化石。我們試想像，一億多年前不同的恐龍在今次的展覽中，大家在這裏對話，一起跟我們說恐龍的故事。\n\n　　我誠邀市民和遊客把握這個難得機會，一同探索香港首次出土的恐龍化石，感受遠古自然歷史的奧妙，開啓一場嶄新的古生物探索之旅。\n\n　　祝願這個展覽圓滿成功，祝願大家有一個豐富的體驗。謝謝各位！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c800a7fae07","title":"​進口蟹樣本鎘含量超出法例標準","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900542.htm","summary":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。","summary_short":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。","digest":"食物環境衞生署食物安全中心公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準","points":["食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布…","中心發言人說：「中心透過恆常食物監測計劃，從進口層面檢取上述蟹樣本作檢測…","發言人續說：「長期攝入過量的鎘可影響腎功能"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:45:00+08:00","size":1,"keywords":[],"body":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。中心正跟進事件。 \n\n　　中心發言人說：「中心透過恆常食物監測計劃，從進口層面檢取上述蟹樣本作檢測，結果顯示鎘含量為百萬分之五點六，超出法例上限的百萬分之二。受影響批次產品沒有流出市面。」 \n\n　　發言人續說：「長期攝入過量的鎘可影響腎功能。中心已知會涉事進口商上述違規情況。如有足夠證據，中心會提出檢控。」 \n\n　　根據《食物攙雜（金屬雜質含量）規例》（第132V章），任何人如售賣金屬雜質濃度高於法定上限水平的食物，即屬違法。違例者一經定罪，最高可處罰款五萬元及監禁六個月。 \n\n　　中心會知會菲律賓當局及業界，並會繼續跟進事件和採取適當行動。調查仍然繼續。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2f6e74765e","title":"國際青年人才交流基地正式成立","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900265.htm","summary":"民政及青年事務局（民青局）今日（十一月十九日）在民青局賽馬會青立方舉辦國際青年人才交流基地（基地）開幕活動，標誌基地正式成立，進一步推動青年發展及國際交流。","summary_short":"民政及青年事務局（民青局）今日（十一月十九日）在民青局賽馬會青立方舉辦國際青年人才交流基地（基地）開幕活動…","digest":"民政及青年事務局在民青局賽馬會青立方舉辦國際青年人才交流基地開幕活動…","points":["民政及青年事務局（民青局）今日（十一月十九日）在民青局賽馬會青立方舉辦國際青年人才交流基地（…","今日的開幕活動以「青年聯通世界：與世界知識產權組織領袖共探全球機遇」為主題…","民青局局長麥美娟在開幕活動致辭時表示，特區政府在《香港特別行政區經濟和社會發展第一個五年規劃…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:42:00+08:00","size":1,"keywords":[],"body":"民政及青年事務局（民青局）今日（十一月十九日）在民青局賽馬會青立方舉辦國際青年人才交流基地（基地）開幕活動，標誌基地正式成立，進一步推動青年發展及國際交流。 \n\n　　行政長官在二○二六年《施政報告》中宣布成立基地，推廣國際交流，並邀請國際專家和訪港貴賓與曾參與國際交流和實習的青年進行交流。今日的開幕活動以「青年聯通世界：與世界知識產權組織領袖共探全球機遇」為主題，並邀請了由世界知識產權組織副總幹事申長雨博士率領的代表團與本港青年，包括曾參與民青局青年創業計劃、實習計劃及國際交流計劃等的「連青人網絡」成員進行交流，讓本港青年了解全球知識產權經濟的最新發展及為青年人帶來的機遇。\n\n　　民青局局長麥美娟在開幕活動致辭時表示，特區政府在《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》下，致力開拓青年發展空間，支持青年逐夢前行。為落實此願景，《行政長官2026年施政報告》提出新措施，由民青局於今年成立基地，進一步推動青年發展。民青局將透過基地為青年開拓更多走向國際的機會，並在基地舉辦更多元、讓青年人擴闊國際視野的活動，同時邀請「連青人網絡」成員積極參加，匯聚全球青年人才，推廣國際交流。\n\n　　在世界知識產權組織代表團進行分享前，麥美娟與其他主禮嘉賓主持基地揭牌儀式，包括申長雨博士、民青局常任秘書長李百全、中央人民政府駐香港特別行政區聯絡辦公室教育和青年部副部長萬寧、中華人民共和國外交部駐香港特別行政區特派員公署國際部主任王劍、民青局副局長梁宏正、青年專員林兆康，以及基地的管理和營運機構代表。\n\n　　基地涵蓋三個青年設施，包括柴灣青年廣場「民青局賽馬會青立方」、深水埗南昌社區中心「連青．南昌」及啟德青年驛站「啟航1331」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbec332afb4","title":"​香港海關在彩盈邨進行跨部門反私煙宣傳活動","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900374.htm","summary":"香港海關今日（十一月十九日）與觀塘區區議員、衞生署控煙酒辦公室、房屋署及警務處在彩盈邨進行聯合反私煙宣傳活動，並講解完稅標籤制度。","summary_short":"香港海關今日（十一月十九日）與觀塘區區議員、衞生署控煙酒辦公室、房屋署及警務處在彩盈邨進行聯合反私煙宣傳活動…","digest":"香港海關與觀塘區區議員、衞生署控煙酒辦公室…","points":["香港海關今日（十一月十九日）與觀塘區區議員、衞生署控煙酒辦公室…","海關人員於屋邨範圍內巡查，向居民介紹海關打擊私煙的工作…","海關人員亦向屋邨保安員講解發現懷疑私煙活動時的應對方法"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:12:00+08:00","size":1,"keywords":[],"body":"香港海關今日（十一月十九日）與觀塘區區議員、衞生署控煙酒辦公室、房屋署及警務處在彩盈邨進行聯合反私煙宣傳活動，並講解完稅標籤制度。 \n\n　　海關人員於屋邨範圍內巡查，向居民介紹海關打擊私煙的工作，並提醒居民未完稅煙草相關罪行的最高罰則已提高至罰款二百萬元及監禁七年。海關人員亦向屋邨保安員講解發現懷疑私煙活動時的應對方法。\n\n　　海關人員亦向區議員及居民介紹香港將施行的完稅標籤制度。海關已於本年初完成為期三個月的完稅標籤制度先導計劃，並會繼續與各持份者保持緊密溝通，持續優化制度設計及執行細節。海關期望完稅標籤制度有效區分已完稅和未完稅香煙，打擊「白牌煙」。 \n\n　　海關會繼續加強宣傳教育，提高市民的反私煙意識。如發現有公屋單位涉及私煙罪行，海關會在法庭審結案件後通知房屋署跟進。海關呼籲市民，切勿以身試法買賣私煙或派發私煙傳單，以免留下案底影響前途。\n\n　　根據《應課稅品條例》（第109章），任何人若處理、管有、售賣或購買私煙即屬違法，一經定罪，最高可被判罰款二百萬元及監禁七年。市民可致電海關二十四小時熱線182 8080、透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑私煙活動。\n\n　　根據《吸煙（公眾衞生）條例》（第371章），任何人不得分發任何形式的吸煙產品廣告（包括任何傳單），違例者最高可被罰款港幣五萬元。市民可致電衞生署控煙酒辦公室熱線2961 8823舉報懷疑派發私煙傳單活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca3803843f5","title":"一名入境旅客進口未完稅香煙罪成判囚","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900526.htm","summary":"一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》，今日（十一月十九日）在西九龍裁判法院被判處監禁七個月，以及罰款二千元。","summary_short":"一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》…","digest":"一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》…","points":["一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》…","海關人員昨日（十一月十八日）在香港國際機場截查一名五十五歲從日本東京飛抵本港的內地男旅客…","海關對判刑表示歡迎，監禁判刑具相當阻嚇作用，並充分反映罪行的嚴重性"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:05:00+08:00","size":1,"keywords":[],"body":"一名入境男旅客因進口未完稅香煙以及未有向海關人員作出申報，違反《應課稅品條例》，今日（十一月十九日）在西九龍裁判法院被判處監禁七個月，以及罰款二千元。\n\n　　海關人員昨日（十一月十八日）在香港國際機場截查一名五十五歲從日本東京飛抵本港的內地男旅客，並在他攜帶的個人行李內檢獲約四萬一千八百支未完稅香煙，估計市值約二十萬九千元，應課稅值約十三萬八千一百元。該名旅客隨即被捕。\n\n　　海關對判刑表示歡迎，監禁判刑具相當阻嚇作用，並充分反映罪行的嚴重性。\n\n　　海關提醒市民，根據《應課稅品條例》，香煙屬應課稅品。任何人士若處理、管有、售賣或購買私煙，即屬違法，一經定罪，最高可被判罰款二百萬元及監禁七年。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑私煙活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3890789174","title":"香港銀行同業結算有限公司提醒公眾慎防偽冒網站","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900507.htm","summary":"下稿代香港金融管理局發出︰  　　香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fpstk.xyz。","summary_short":"下稿代香港金融管理局發出︰  　　香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站f…","digest":"香港銀行同業結算有限公司提醒公眾慎防偽冒網站","points":["下稿代香港金融管理局發出︰","香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fpst…","該偽冒網站偽裝成「買家網上安全保障」，提供轉數快FPS網上交易安全服務，包括1）退款…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:55:00+08:00","size":1,"keywords":[],"body":"下稿代香港金融管理局發出︰\n\n　　香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fpstk.xyz。該偽冒網站偽裝成「買家網上安全保障」，提供轉數快FPS網上交易安全服務，包括1）退款、2）舉報未經授權的網上交易，以及3）網上交易支援，及進一步引導用戶與偽冒客服的人員進行對話。\n\n　　結算公司澄清，該偽冒網站與結算公司以及結算公司所有業務，均絕無關係。在一般情況下，結算公司不會直接向個別公眾人士提供轉數快服務，也不會主動接觸個別公眾人士。結算公司真正官方網址是www.hkicl.com.hk及fps.hkicl.com.hk。\n\n　　結算公司呼籲公眾人士提防可疑電話、網站或其他通訊，小心保護個人資料。如接獲任何宣稱來自結算公司成員的可疑通訊，請致電結算公司電話2533 1111核實。如市民懷疑受騙，應盡快向警方報案。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1f5861b13a","title":"衞生署轄下醫療器械諮詢委員會舉行首次會議","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900211.htm","summary":"​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議，就政府正積極籌備建立的醫療器械法定規管體系提供意見，以期從安全、質量及性能方面完善規管在香港供應的醫療器械…","summary_short":"​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議…","digest":"衞生署轄下的醫療器械諮詢委員會舉行首次會議…","points":["​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議…","委員會由趙偉仁教授出任主席，成員包括醫學界、工程界和創新科技界代表","成員名單載於衞生署醫療器械科網頁"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議，就政府正積極籌備建立的醫療器械法定規管體系提供意見，以期從安全、質量及性能方面完善規管在香港供應的醫療器械，從而保障公眾健康，促進醫療器械業界有序及持續發展，助力香港成為國際醫療創新樞紐。\n\n　　委員會由趙偉仁教授出任主席，成員包括醫學界、工程界和創新科技界代表。成員名單載於衞生署醫療器械科網頁。\n\n　　《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》及《行政長官2026年施政報告》均指出，政府會全面深化藥械監管改革，完善監管體系，並成立藥物及醫療器械監督管理中心。政府正有序推進多項工作，包括推動立法改革，建立新的醫療器械法定規管體系，涵蓋醫療器械推出市場前後各個風險管理環節。衞生署期望透過委員會廣泛而全面地吸納不同持份者的真知灼見，以建立一套清晰可行、具前瞻性，同時切合香港情況，並與國際接軌的醫療器械法定規管框架，為香港發展成為國際醫療創新樞紐提供更有力的制度支撐。\n\n　　會上，衞生署代表介紹現行自願參與的「醫療器械行政管理制度」在過去20多年來的運作成果，以及政府有關規管本港醫療器械的立法建議。委員會全力支持政府秉持以下重要原則，推展相關立法工作：\n\n（一）保障公眾安全和健康；\n\n（二）促進創新發展；\n\n（三）與國際監管標準接軌；\n\n（四）承接本港行政制度經驗；\n\n（五）聚焦源頭管理，要求供應鏈上游的貿易商申領牌照；及\n\n（六）按風險為本原則，有序推行醫療器械分級註冊。\n\n 除了在建立醫療器械法定規管體系期間，為衞生署蒐集及反映持份者意見外，委員會亦會就「醫療器械行政管理制度」的運作及過渡安排向署方提供意見。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc4b8908640","title":"哈薩克斯坦品牌ADILI在港開設首間海外門店 彰顯香港與中亞日益緊密的聯繫","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111800439.htm","summary":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店，成為首批進駐香港的中亞零售品牌之一。","summary_short":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店…","digest":"投資推廣署歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店…","points":["​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦…","ADILI以其受哈薩克傳統裝飾啓發而創作的原創印花圖案而聞名…","ADILI落戶香港，反映香港積極深化與中亞的經貿及文化聯繫，並加強「一帶一路」連結"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店，成為首批進駐香港的中亞零售品牌之一。ADILI以其受哈薩克傳統裝飾啓發而創作的原創印花圖案而聞名，該品牌特別為新店推出以香港為靈感的膠囊系列，與其廣受好評的經典系列一同發售。 \n\n　　ADILI落戶香港，反映香港積極深化與中亞的經貿及文化聯繫，並加強「一帶一路」連結。投資推廣署於二○二五年及二○二六年出訪中亞，包括哈薩克斯坦，與當地企業交流，介紹香港蘊藏的機遇，並探討嶄新合作領域。開店前夕，投資推廣署於十一月十七日舉行交流會，連繫在港哈薩克斯坦商界並促進兩地文化交流。\n\n　　投資推廣署署長劉凱旋表示：「ADILI的當代哈薩克設計為香港國際化的零售市場增添一道絢麗色彩。品牌落戶反映香港與中亞的文化聯繫日益深厚，這亦是推動更廣泛經貿合作的重要動力。投資推廣署會善用環球網絡和行業專業知識，致力吸引更多像ADILI一般，來自中亞以至其他地區的出眾品牌，以香港為基地拓展全球業務。」\n\n　　ADILI聯合創辦人Indira Adil表示：「香港是亞洲時裝、生活品味及國際零售市場的交匯點。在港開店是我們邁向國際舞台的重要第一步。我們非常感謝投資推廣署的支援，包括提供市場資訊、實戰指導及聯繫本地人脈，使我們得以成功進駐香港市場。」\n\n　　ADILI聯合創辦人兼創意總監Assel Adil表示：「我們以香港為靈感的膠囊系列，開展了當代哈薩克設計與這個充滿活力的城市之間的對話，將原創印花背後的傳統裝飾藝術，與香港的色彩和特質融為一體。我們期待與香港大眾及來自世界各地的旅客分享這個系列。」\n\n　　Indira Adil和Assel Adil兩姊妹於二○一○年創立ADILI，在哈薩克斯坦的設計工作室創作其原創印花圖案，產品涵蓋時裝、配飾、家居紡織品及禮品。ADILI在哈薩克斯坦各地設有零售店，香港店是品牌進軍國際市場的第一步。\n\n　　如欲了解更多關於ADILI的資訊，請瀏覽shopadili.com。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c441c2c7ad9","title":"挪威、英國和荷蘭部分地區禽肉及禽類產品暫停進口","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900361.htm","summary":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）宣布，因應世界動物衞生組織通報，指挪威阿格德爾郡Lindesnes Municipality…","summary_short":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）宣布，因應世界動物衞生組織通報…","digest":"食物環境衞生署食物安全中心宣布，因應世界動物衞生組織通報…","points":["食物環境衞生署食物安全中心（中心）今日（十一月十九日）宣布，因應世界動物衞生組織通報…","中心發言人說，香港目前與挪威只建立禽肉進口機制，並無禽蛋進口機制","根據政府統計處的資料，本港今年首九個月從挪威進口約二十公噸冷藏禽肉…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:00:00+08:00","size":1,"keywords":[],"body":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）宣布，因應世界動物衞生組織通報，指挪威阿格德爾郡Lindesnes Municipality、英國林肯郡西林齊區和荷蘭弗里斯蘭省爆發高致病性H5N1禽流感，中心即時指示業界暫停從上述地區進口禽肉及禽類產品（包括禽蛋），以保障本港公眾健康。 \n\n　　中心發言人說，香港目前與挪威只建立禽肉進口機制，並無禽蛋進口機制。根據政府統計處的資料，本港今年首九個月從挪威進口約二十公噸冷藏禽肉、從英國進口約六百八十公噸冰鮮和冷藏禽肉及約二十二萬隻禽蛋，以及從荷蘭進口約七百九十公噸冷藏禽肉。 \n\n　　發言人說：「中心已就事件聯絡挪威、英國和荷蘭當局，並會繼續密切留意世界動物衞生組織及有關當局發出關於爆發禽流感的消息，因應當地疫情發展，採取適當行動。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce1b0cf8cac","title":"香港知識產權學院啓動 培育跨專業人才推動創新成果轉化","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900250.htm","summary":"香港知識產權學院今日（十一月十九日）正式啓動，為各行各業提供更有系統和認受性的知識產權在職培訓，壯大香港知識產權人才庫，支持香港深化區域知識產權貿易中心建設。","summary_short":"香港知識產權學院今日（十一月十九日）正式啓動，為各行各業提供更有系統和認受性的知識產權在職培訓，壯大香港知識產權人才庫…","digest":"香港知識產權學院正式啓動，為各行各業提供更有系統和認受性的知識產權在職培訓…","points":["香港知識產權學院今日（十一月十九日）正式啓動，為各行各業提供更有系統和認受性的知識產權在職培…","學院首個基礎課程亦於今明兩日在亞洲知識產權營商論壇期間舉行","署理商務及經濟發展局局長陳百里博士今日在香港會議展覽中心出席學院開幕典禮"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:00:00+08:00","size":1,"keywords":[],"body":"香港知識產權學院今日（十一月十九日）正式啓動，為各行各業提供更有系統和認受性的知識產權在職培訓，壯大香港知識產權人才庫，支持香港深化區域知識產權貿易中心建設。學院首個基礎課程亦於今明兩日在亞洲知識產權營商論壇期間舉行。\n\n　　署理商務及經濟發展局局長陳百里博士今日在香港會議展覽中心出席學院開幕典禮。他致辭時表示：「國家《十五五規劃綱要》明確支持香港深化區域知識產權貿易中心建設。《香港第一個五年規劃》亦提出，透過成立知識產權學院，有系統地培育各知識產權密集行業所需的人才，讓他們掌握知識產權創造、保護、管理、融資、運用及商品化等方面的知識和技能，進一步推動香港知識產權生態圈發展。今日學院正式啓動，正是落實這項工作的重要一步。」\n\n　　他續指，知識產權不只關乎法律保障和權利註冊，更與科研成果轉化、品牌發展、授權和交易密切相關。期待學院匯聚業界力量、連接國際資源，為香港建設區域知識產權貿易中心培育人才，並為國家創新發展作出更大貢獻。\n\n　　學院由知識產權署與職業訓練局（職訓局）合作成立。政府在二零二六至二七年度《財政預算案》預留5,200萬元，支持學院的籌建及首兩年運作，預計在兩年先導期內為約2 000名學員提供培訓。學院將針對科技創新、文化創意、工商及專業服務等界別的需要，建立由基礎至進階的多層次在職培訓路徑，並逐步將合適的培訓課程發展成為認證課程及資歷架構認可課程。\n\n　　學院首個課程「IP101知識產權基礎課程」為期一日半，由具相關專業知識和實務經驗的講者授課。內容涵蓋不同類別的知識產權（包括商標、版權、專利、外觀設計及商業秘密）及知識產權貿易的基本概念，協助學員認識知識產權擁有人和使用者的權利與責任，並把所學應用於企業營運。\n\n　　出席今日典禮的其他嘉賓包括職訓局主席林健鋒、高等法院原訟法庭法官陸啟康、商務及經濟發展局常任秘書長李頌恩、世界知識產權組織副總幹事申長雨博士、知識產權署署長黃福來、香港知識產權學院先導計劃督導委員會主席李惠光教授及職訓局署理執行幹事任影嬋。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca220dca924","title":"日本進口水產的檢測情況","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900440.htm","summary":"因應日本政府單方面決定把福島核電站核污水排放大海，食物環境衞生署署長已發出《食物安全命令》，禁止源自日本10（都）縣的水產、海鹽和海藻食品進口本港，受禁（都）縣包括東京、福島、茨城、宮城、千葉、群馬…","summary_short":"因應日本政府單方面決定把福島核電站核污水排放大海，食物環境衞生署署長已發出《食物安全命令》…","digest":"因應日本政府單方面決定把福島核電站核污水排放大海…","points":["因應日本政府單方面決定把福島核電站核污水排放大海，食物環境衞生署署長已發出《食物安全命令》…","至於其他未有被禁止輸入香港的日本水產、海鹽和海藻，為確保食物安全…","在確認相關產品沒有超出輻射水平的情況下，才放行於市場供應"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:55:00+08:00","size":1,"keywords":[],"body":"因應日本政府單方面決定把福島核電站核污水排放大海，食物環境衞生署署長已發出《食物安全命令》，禁止源自日本10（都）縣的水產、海鹽和海藻食品進口本港，受禁（都）縣包括東京、福島、茨城、宮城、千葉、群馬、栃木、新潟、長野和埼玉。\n\n　　至於其他未有被禁止輸入香港的日本水產、海鹽和海藻，為確保食物安全，食物環境衞生署轄下食物安全中心（食安中心）正全面進行輻射水平測試；在確認相關產品沒有超出輻射水平的情況下，才放行於市場供應。\n\n　　由十一月十八日中午截至今日（十一月十九日）中午，食安中心已對144個日本進口「水產及其製品、海藻及海鹽」的食物樣本作輻射水平檢測，未有發現輻射水平超出安全標準。詳情可參閱食安中心「日本進口食品管制措施」專題網頁（www.cfs.gov.hk/tc_chi/programme/programme_rafs/programme_rafs_fc_01_30_Nuclear_Event_and_Food_Safety.html）。\n\n　　同期，漁農自然護理署（漁護署）已對50個本地漁產品樣本作輻射水平檢測，全部樣本檢測合格。詳情可參閱漁護署網頁（www.afcd.gov.hk/tc_chi/fisheries/Radiological_testing/Radiological_Test.html）。\n\n　　香港天文台亦已加強監測本港水域的環境輻射水平。至目前為止，並沒有發現異常情況。詳情可參閱香港天文台的網頁（www.hko.gov.hk/tc/radiation/monitoring/seawater.html）。\n\n　　由二○二三年八月二十四日起至今日中午，食安中心及漁護署分別檢測了共276 546個日本進口食物樣本（包括172 048個水產及其製品、海藻及海鹽樣本）及共58 814個本地漁產品樣本作輻射水平檢測，全部樣本檢測合格。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce93b510817","title":"行政長官在深圳出席亞太經合組織領導人非正式會議","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900435.htm","summary":"行政長官李家超今日（十一月十九日）在深圳出席亞太區經濟合作組織（亞太經合組織）第三十三次領導人非正式會議，與其他經濟體領導人就深化區域合作、拓展多元市場交流意見。","summary_short":"行政長官李家超今日（十一月十九日）在深圳出席亞太區經濟合作組織（亞太經合組織）第三十三次領導人非正式會議…","digest":"行政長官李家超在深圳出席亞太區經濟合作組織第三十三次領導人非正式會議…","points":["行政長官李家超今日（十一月十九日）在深圳出席亞太區經濟合作組織（亞太經合組織）第三十三次領導…","李家超在會議發言時指出，亞太地區是當今經濟增長的引擎，貢獻了全球三分之二的增長","香港作為國際金融、貿易及創科中心，在國家支持下，會充分發揮「超級聯繫人」和「超級增值人」的重…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:50:00+08:00","size":1,"keywords":[],"body":"行政長官李家超今日（十一月十九日）在深圳出席亞太區經濟合作組織（亞太經合組織）第三十三次領導人非正式會議，與其他經濟體領導人就深化區域合作、拓展多元市場交流意見。\n\n　　李家超在會議發言時指出，亞太地區是當今經濟增長的引擎，貢獻了全球三分之二的增長。香港作為國際金融、貿易及創科中心，在國家支持下，會充分發揮「超級聯繫人」和「超級增值人」的重要角色，繼續維持自由開放的市場，堅定支持以規則為本的多邊貿易體制，擴大與亞太經合組織的合作，持續為促進亞太地區的繁榮作出貢獻。\n\n　　李家超表示，粵港澳大灣區是區域開放合作、引領高質量發展的重要平台。這次亞太經合組織領導人非正式會議在深圳舉行，財政部長會上月首次在香港舉行，展現大灣區的國際影響力和競爭力。在《2026年全球創新指數》世界百強創新集群中，「深圳—香港—廣州」集群連續兩年排名全球第一，彰顯大灣區兄弟城市在創科領域合作共贏的豐碩成果。創新是未來競爭力的核心，香港擁有世界頂尖的大學及科研機構，結合粵港澳大灣區的製造及商業實力，共同推動科研成果轉化及應用，同時積極推動人工智能的廣泛應用，促進高質量發展。\n\n　　亞太經合組織成員經濟體就領導人宣言達成共識，同時通過有關貿易數字化、數字經濟和新興科技、互聯互通等領導人層級的成果文件。李家超表示，這些具前瞻性的成果對推進亞太地區的務實合作、深化區域經濟融合、推動高質量發展發揮關鍵作用。\n\n　　下午，李家超與其他經濟體領導人會面和舉行雙邊會談。李家超與秘魯總統藤森慶子會面時表示，秘魯是香港在拉丁美洲的第六大貿易夥伴，很高興二○二四年在秘魯利馬親身見證香港與秘魯簽署《自由貿易協定》，涵蓋貨物貿易、服務貿易及投資等領域。《自由貿易協定》今年九月一日正式生效，進一步促進雙邊貿易和投資，標誌兩地經貿關係邁向新里程。他鼓勵更多秘魯企業善用香港的國際商貿平台和專業服務，以香港為跳板進軍內地及亞洲市場，發掘更多商機。香港會繼續拓展新興市場，發揮「超級連繫人」和「超級增值人」的角色，與秘魯在不同範疇有更多合作，互惠共贏。\n\n　　李家超隨後與新加坡總理兼財政部長黃循財會面，表示很高興繼今年三月在香港會面後，再在深圳聚首。他說，香港與新加坡同是高度外向型的國際金融貿易中心，雙方經貿和人文往來頻繁、合作緊密。特區政府正提速提效發展北部都會區（北都）和河套深港科技創新合作區香港園區，李家超鼓勵具創科實力的新加坡企業落戶北都，結合香港匯聚全球人才及前沿科研的優勢，攜手開拓內地市場。他亦感謝新加坡一直支持香港盡早加入《區域全面經濟伙伴關係協定》，期望隨着新加坡明年擔任東盟輪值主席國，雙方繼續深化協作，共同推動區域經濟發展。\n\n 李家超結束深圳的會議及相關活動，傍晚返港。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c68140187e7","title":"​行政長官在深圳會見傳媒談話內容","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900421.htm","summary":"以下是行政長官李家超出席亞太區經濟合作組織（亞太經合組織）領導人非正式會議及相關活動期間，今日（十一月十九日）下午在深圳會見傳媒的談話內容：  行政長官：大家好。","summary_short":"以下是行政長官李家超出席亞太區經濟合作組織（亞太經合組織）領導人非正式會議及相關活動期間…","digest":"​行政長官在深圳會見傳媒談話內容（附圖／短片）","points":["以下是行政長官李家超出席亞太區經濟合作組織（亞太經合組織）領導人非正式會議及相關活動期間…","多謝大家連日採訪亞太區經濟合作組織（APEC）會議的情況","我星期二來到深圳，一連三日出席APEC工商領導人峰會及APEC領導人非正式會議"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:18:00+08:00","size":1,"keywords":[],"body":"以下是行政長官李家超出席亞太區經濟合作組織（亞太經合組織）領導人非正式會議及相關活動期間，今日（十一月十九日）下午在深圳會見傳媒的談話內容：\n\n行政長官：大家好。多謝大家連日採訪亞太區經濟合作組織（APEC）會議的情況。我星期二來到深圳，一連三日出席APEC工商領導人峰會及APEC領導人非正式會議。昨日，我與五個成員經濟體的領導人會面和進行雙邊會談，按時序分別是馬來西亞總理安華先生、越南國家主席蘇林先生、文萊蘇丹哈桑納爾先生、泰國總理阿努廷先生和智利總統卡斯特先生。今日稍後，我將會與秘魯總統藤森慶子女士和新加坡總理黃循財先生見面。\n\n　　今日早上，我出席了APEC領導人非正式會議。會議圍繞「建設亞太共同體，促進共同繁榮」的主題，聚焦「開放、創新、合作」三大優先領域。各成員經濟體就領導人宣言達成共識，同時通過有關貿易數字化、數字經濟、新興科技、互聯互通等領導人層級的成果文件。這些具前瞻性的成果對推進亞太地區的務實合作、深化區域經濟融合、推動高質量發展發揮關鍵作用。\n\n　　今年是APEC「中國年」，是國家第三次擔任東道主。國家已經成功舉辦超過300場各級別會議和活動，包括11個部長級會議，涵蓋貿易、能源、旅遊、數字和人工智能、中小企、運輸以及人力資源等領域，達成多份聲明和成果文件。今次我們出席APEC會議達致五個成果。\n\n　　第一，貢獻香港力量，積極參與及支持國家成功舉辦APEC會議。香港特區在APEC「中國年」有雙重身分：既是APEC成員經濟體，亦作為中國的一個特別行政區全面助力國家辦好APEC。我們以中國香港的身分，積極出席和舉辦會議、工作坊，開展一系列能力提升工作項目，並由政府代表在APEC個別的委員會擔當領導角色，從不同層面推動APEC主題。上月，APEC財長會（財政部長會）以國家財政部主辦、香港特區政府承辦的方式，首次在香港圓滿舉行，聚焦宏觀經濟金融形勢，推動亞太區經濟金融合作，充分展現香港作為國際金融中心的優勢，以及舉辦大型國際會議的能力。\n\n　　今個星期的APEC領導人會議周，香港代表團的規模是歷來最大，在商界方面有超過50人出席APEC工商領導人峰會和相關活動，涵蓋金融服務、進出口、地產、建造、航運交通等界別，以及商會、法定機構和組織等。企業及商界代表可以直接與其他經濟體的商界代表交流和溝通，全力投入及支持國家這個重要的主場外交活動。\n\n　　第二，深化與APEC成員經濟體的交流。APEC成員經濟體是香港的重要貿易夥伴，貿易往來佔本港外貿總值87%。透過APEC會議和活動，我與不同經濟體領導人交流，包括先後與馬來西亞、越南、文萊、泰國、智利、秘魯和新加坡，即總共七個經濟體的領導人進行會面及雙邊會談，討論雙方共同關注的議題，建立更深入的聯繫。\n\n　　第三，鞏固與東盟（東南亞國家聯盟）成員國的關係。東盟有七個國家是APEC成員經濟體。東盟是香港第二大貿易夥伴，我先後兩次率領商貿代表團訪問東盟多個國家，促進香港與東盟加強政府間的關係和往來。今次APEC讓我有機會和五位東盟成員領導人會面和進行雙邊會談，進一步鞏固關係。\n\n　　香港一直積極尋求盡早加入《區域全面經濟伙伴關係協定》（RCEP）。RCEP今年九月同意成立「加入工作組」，啓動各申請經濟體包括香港的加入程序。與我會面的東盟成員領導人都向我表示，繼續支持香港盡快加入RCEP，我感謝他們的支持。香港已經準備就緒，隨時與工作組見面及討論，爭取盡早加入RCEP。\n\n　　第四，進一步拓展新興市場。特區政府積極開拓經濟網絡，拓展和探索不同市場，近年尤其着重強化與新興、有潛質市場的連繫。昨日，我和智利總統共同見證了香港與智利簽署工作假期計劃協議。這是香港第一次與拉丁美洲國家合作推出工作假期計劃，讓香港青年人可以有一年的有關簽證擴闊視野，獲取外地的生活和工作經驗，促進兩地的聯繫和友誼。\n\n　　我在兩年前，二○二四年APEC會議期間，在秘魯利馬見證了香港與秘魯簽訂自由貿易協定，涵蓋貨物貿易、服務貿易及投資等領域。這一年以來，香港與拉丁美洲的商品貿易於有明顯的增長，二○二五年貿易總額達190億美元，較二○二四年上升19.1%；香港往拉丁美洲的整體出口為119億美元，當中香港產品出口及轉口均錄得雙位數字上升，分別上升10.3%及12.1%。我今日稍後會與秘魯總統進行雙邊會談，進一步推動雙方交流合作。\n\n　　第五，說好粵港澳大灣區、說好香港故事。今次APEC會議在深圳成功舉辦，而深圳是粵港澳大灣區的核心城市，充分展現大灣區作為國家高水平對外開放窗口的實力和魅力。我在星期二的APEC工商領導人峰會，在「粵港澳大灣區與亞太發展機遇」專題研討會上致辭，向各國與會代表推廣大灣區的發展機遇和香港在大灣區其中的獨特優勢。大灣區作為全球最具活力的經濟引擎之一，在「一國兩制」、三個司法管轄區和三種貨幣的制度框架下協同發展，創造超過2.1萬億美元的本地生產總值。我鼓勵亞太企業以香港作為開拓大灣區的跳板，對接大灣區的製造實力、資金和龐大消費市場，強化區域供應鏈，共建繁榮的亞太共同體。\n\n　　在不同的會面和雙邊會談中，我亦向與會領導人談及大灣區的機遇，並說明大灣區內，包含香港，如何形成一個多元生態圈，以及香港作為中國最開放、最國際化的城市，怎樣做好國際金融、航運、貿易中心、國際創新科技中心、國際高端人才集聚高地的角色，發揮「引進來、走出去」的雙向平台作用。\n\n　　香港會持續全力發揮「一國兩制」下背靠祖國、聯通世界的獨特優勢，深化國際交往，拓展全球合作網絡，繼續深耕歐美、東盟、中東等市場，同時開拓具備潛力的，包括中亞、非洲等新興市場，進一步拓展香港的全球經貿網絡，推動香港持續高質量發展。多謝大家。\n\n記者：想問習近平主席在亞太經合組織工商領導人峰會發表了主旨演講，你有甚麼體會？特別是關於灣區經濟方面，香港可以如何配合？另外，今次APEC會面，你與習主席同場交談期間，他有否特別提及到香港的發展情況？尤其是關於香港五年規劃等內容，有沒有甚麼啓示或啓發給你？謝謝。\n\n行政長官：習近平主席的主旨演講提出了四點建議：一要維護和平穩定大局，二要搭建開放合作橋樑，三要激發創新增長動力，四要拓展互利共贏路徑。堅持通過對話協商解決分歧，通過團結協作應對挑戰。\n\n　　香港長期擔當區域經貿合作的樞紐角色，是世界上最具競爭力經濟體之一，一直是堅持自由貿易和多邊主義。在加強區域經貿合作方面，香港可以從幾個不同方面配合。\n\n　　第一，會繼續用好APEC平台，與不同亞太經濟體加強互聯互通。香港與其他APEC成員經濟體的貿易往來，正如我剛才所說，佔香港外貿總值高達87%。我們會繼續發揮「超級連繫人」和「超級增值人」角色，促進區域繁榮發展。\n\n　　第二，是發揮「一國兩制」下香港內聯外通的獨特優勢，全力推動香港「四中心、一高地」建設。做好全球工商界進入大灣區和內地的發展跳板，並通過我們已經成立的內地企業出海專班，服務內地企業，拓展國際市場，更好地把握和發揮灣區機遇，發揮「引進來、走出去」的平台作用。\n\n　　第三，我認為可以深化與粵港澳大灣區交流合作，全速推進北部都會區建設，亦推動河套，深港科技創新合作區「一區兩園」協同發展，持續加強與灣區城市合作。「深圳—香港—廣州」創新集群在《2026年全球創新指數》再次排名世界第一，充分體現灣區的創科實力和廣闊前景。我們會繼續發揮香港優勢、灣區優勢，堅持在開放中與各方深度融合，共同發展，助力國家成為引領亞太合作的中堅力量。\n\n　　今次，我有機會和習主席短暫交流。今年習主席作為東道主，作為會議的主持人，他的行程十分緊密，所以我主要是利用和他短暫接觸和見面的時間，向他介紹香港在亞太經合組織工商領導人峰會上「粵港澳大灣區與亞太發展機遇」專題研討的情況。\n\n　　我向習主席表示，與會人士對大灣區發展前景反應十分正面，討論亦相當熱烈。大家都認同，粵港澳大灣區的發展潛力龐大。我亦提到香港會繼續用好「一國兩制」下內聯外通的優勢，發揮「超級聯繫人」和「超級增值人」角色，更好融入和服務國家發展大局，同時為亞太區合作和發展作出貢獻。\n\n（請同時參閱談話內容英文部分）","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb62faabae2","title":"署理商務及經濟發展局局長出席香港知識產權學院開幕典禮致辭全文","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900420.htm","summary":"以下是署理商務及經濟發展局局長陳百里博士今日（十一月十九日）在香港知識產權學院開幕典禮的致辭全文：  林主席（職業訓練局（職訓局）主席林健鋒）、申副總幹事（世界知識產權組織副總幹事申長雨博士）…","summary_short":"以下是署理商務及經濟發展局局長陳百里博士今日（十一月十九日）在香港知識產權學院開幕典禮的致辭全文：  林主席（職業訓練局…","digest":"署理商務及經濟發展局局長出席香港知識產權學院開幕典禮致辭全文（只有中文）","points":["林主席（職業訓練局（職訓局）主席林健鋒）、申副總幹事（世界知識產權組織副總幹事申長雨博士）…","很高興在亞洲知識產權營商論壇期間，與大家共同見證香港知識產權學院正式啓動…","《香港第一個五年規劃》亦提出，透過成立知識產權學院…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:10:00+08:00","size":1,"keywords":[],"body":"以下是署理商務及經濟發展局局長陳百里博士今日（十一月十九日）在香港知識產權學院開幕典禮的致辭全文：\n\n林主席（職業訓練局（職訓局）主席林健鋒）、申副總幹事（世界知識產權組織副總幹事申長雨博士）、陸法官（高等法院原訟法庭法官陸啟康）、李教授（香港知識產權學院先導計劃督導委員會主席李惠光教授）、各位嘉賓、各位朋友：\n\n　　大家好。很高興在亞洲知識產權營商論壇期間，與大家共同見證香港知識產權學院正式啓動，為香港知識產權人才培訓開展新一頁。\n\n　　國家《十五五規劃綱要》明確支持香港深化區域知識產權貿易中心建設。《香港第一個五年規劃》亦提出，透過成立知識產權學院，有系統地培育各知識產權密集行業所需的人才，讓他們掌握知識產權創造、保護、管理、融資、運用及商品化等方面的知識和技能，進一步推動香港知識產權生態圈發展。今日學院正式啓動，正是落實這項工作的重要一步。\n\n　　知識產權不只關乎法律保障和權利註冊，更與科研成果轉化、品牌發展、授權和交易密切相關。我們需要更多跨專業人才，協助企業將把創意和科研成果轉化為具有市場價值的資產，開拓新的商機。\n\n　　本屆政府任期內，知識產權署已為超過5 000名從業員提供培訓。在這個基礎上，學院將進一步完善培訓系統，推動人才培育邁向更有系統、更多元化和更具認受性的新階段。政府預留了5,200萬元，支持知識產權署與職訓局合作籌建學院及首兩年運作，預計在兩年先導期內培訓約2 000名學員。\n\n　　學院將以實務為本，為創科、文創、工商及專業服務等界別，提供由基礎至進階的多層次在職培訓。合適課程將按相關評審程序與資歷架構掛鈎。首個基礎課程就在今明兩日舉行，讓學員從認識知識產權出發，逐步掌握保護和運用無形資產的能力。\n\n　　國際合作也是學院發展的重要一環。我們十分榮幸世界知識產權組織副總幹事申長雨博士今日親臨開幕典禮，與我們共同見證學院正式啓動。這充分體現國際組織對香港知識產權發展的支持。我們期待日後與世界知識產權組織加強交流，探討在知識產權教育和人才培訓方面的合作機會，借助其國際專業知識、豐富培訓經驗和環球網絡，提升本地培訓質素，開拓學員的視野。\n\n　　我衷心感謝職訓局、學院先導計劃督導委員會、世界知識產權組織及各界夥伴的支持。學院的成功有賴各方攜手參與。期待大家繼續積極指導學院的課程和活動，為學院的長遠發展提供寶貴意見，攜手培育更多知識產權人才，協助企業把創新成果轉化為商機。\n\n　　在此，我再次恭賀學院順利成立，並祝願學院培育更多優秀人才，匯聚業界力量、連接國際資源，為香港建設區域知識產權貿易中心培育人才，為國家創新發展作出更大貢獻。多謝大家。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca4c780e727","title":"二○二六年選舉委員會界別分組一般選舉星期日舉行 投票人須依正確程序投票","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900352.htm","summary":"二○二六年選舉委員會（選委會）界別分組一般選舉將於星期日（十一月二十二日）舉行，投票時間由上午九時至下午六時。","summary_short":"二○二六年選舉委員會（選委會）界別分組一般選舉將於星期日（十一月二十二日）舉行，投票時間由上午九時至下午六時。","digest":"二○二六年選舉委員會界別分組一般選舉將於星期日舉行，投票時間由上午九時至下午六時","points":["二○二六年選舉委員會（選委會）界別分組一般選舉將於星期日（十一月二十二日）舉行…","選舉事務處提醒有關投票人／獲授權代表緊記依照投票通知卡指示…","選舉事務處發言人今日（十一月十九日）說：「根據法例…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:00:00+08:00","size":1,"keywords":[],"body":"二○二六年選舉委員會（選委會）界別分組一般選舉將於星期日（十一月二十二日）舉行，投票時間由上午九時至下午六時。選舉事務處提醒有關投票人／獲授權代表緊記依照投票通知卡指示，帶同有效的香港身份證正本前往獲編配的投票站投票。\n\n　　選舉事務處發言人今日（十一月十九日）說：「根據法例，只有載列在二○二六年選委會界別分組正式投票人登記冊上而屬31個須競逐的界別分組的已登記投票人／獲授權代表才可於投票日投票。相關界別分組的投票人／獲授權代表可透過『智方便』或選民登記網站（vr.gov.hk）登入『選民資料網上查閱系統』查閱其獲編配的投票站名稱和地址、位置圖、投票時間，以及候選人簡介等投票資訊。他們亦可致電選舉熱線2891 1001查詢。投票程序簡介的短片亦已上載到選舉網站（www.elections.gov.hk）。」\n\n　　在投票日，共有856名候選人競逐31個界別分組的723個席位。全港共設有五個一般投票站（分別設於港灣道體育館、九龍公園體育館、荃灣體育館、調景嶺體育館及車公廟體育館）和兩個專用投票站（分別設於跑馬地警署和石壁監獄），供須競逐的界別分組投票人／獲授權代表投票。\n\n投票安排\n\n　　是次選舉的一般投票站會使用電子選民登記冊系統發出選票。投票人／獲授權代表須在投票站發票櫃枱出示有效的香港身份證正本。投票站工作人員會以電子選民登記冊系統平板電腦掃描投票人／獲授權代表的身份證，並在核實身分後發出選票。\n\n　　投票人／獲授權代表填劃選票時須使用投票站提供的筆填滿所選擇的候選人姓名左邊的橢圓圈，而所選擇的候選人數目不可多於所屬界別分組須選出的席位數目，否則有關選票將被視為無效。\n\n　　發言人說：「投票站設有選票檢測機，供投票人／獲授權代表使用，以檢查選票是否已按照選舉法例妥為填劃。選票檢測機不會記錄或點算選票上的選擇。完成檢測後，投票人／獲授權代表應把選票已填劃的一面向下，不用摺疊選票，直接放進投票箱。投票人／獲授權代表如帶備一張載有他們所選擇的候選人名單或號碼的紙張，方便填劃選票時作為參考，原則上並沒有問題，但投票人／獲授權代表必須緊記不可在投票站內向其他人展示該紙張，亦須於完成投票後將紙張帶離投票站，否則有可能觸犯選舉法例。」\n\n　　基於投票自主及保密的原則，法例禁止任何人（即使是投票人／獲授權代表的親友）陪同或協助投票。如有需要，投票人／獲授權代表可按法例要求投票站主任或其副手在一名投票站工作人員在場見證下，按其投票意向代為填劃選票。任何投票人／獲授權代表在投票站內干擾別人投票，或使用電子器材進行通訊或拍影片、拍照、錄音或錄影，即屬違法。\n\n　　發言人表示，所有投票站亦備有由選舉事務處印製的候選人簡介，供投票人／獲授權代表參考。\n\n投票站特別安排\n\n　　投票站設立兩條隊伍：一條特別隊伍供年滿70歲的人士、孕婦及因身體狀況而難以長時間站立排隊的人士使用；另一條隊伍則供其他投票人／獲授權代表使用。投票站主任會視乎輪候情況靈活調配發票櫃枱。\n\n　　每個投票站外的若干範圍會被劃定為禁止拉票區，確保投票人／獲授權代表在不受干擾的情況下進入投票站。在禁止拉票區內，任何人均不可進行拉票或打手勢、示好等「變相拉票」行為。此外，投票站入口和出口處附近範圍會被劃定為禁止逗留區，任何人均不可在禁止逗留區逗留。\n\n　　投票日當日任何與是次選舉有關的查詢，可致電選舉熱線（2891 1001）。熱線會在當天上午八時三十分至下午六時三十分運作；而投訴熱線（2827 7251／3707 0188）則會在當天上午八時三十分至下午七時運作，處理有關違反選舉規例或選舉活動指引的投訴。\n\n點票安排\n\n　　是次選舉將採用中央點票模式。投票結束後，所有投票箱會運送到設於香港會議展覽中心的中央點票站進行點票。候選人、選舉代理人及監察點票代理人可以進入中央點票站，在點票區的指定範圍觀察點票過程。公眾人士和傳媒亦可進入中央點票站觀察點票，但不可以進入點票區。中央點票站外會張貼通告，列明點票站公眾範圍內可容納入場人數的上限。\n\n　　當個別界別分組的選票完成點算並經選舉事務處核實後，選舉主任會在中央點票站的問題選票裁決枱向在場的候選人及代理人公布點票及選舉結果，此外，所有當選人會獲安排在新聞中心的禮台上接受祝賀。選舉結果會張貼在新聞中心外，並透過新聞稿和選舉網站發放。\n\n　　如有查詢，可致電選舉熱線（2891 1001），或瀏覽選舉網站以獲取更多有關是次選舉的資訊。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c10d4f966c8","title":"屋宇署九月批出十六份建築圖則","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900260.htm","summary":"屋宇署九月共批出十六份建築圖則，其中港島三份及新界十三份。","summary_short":"屋宇署九月共批出十六份建築圖則，其中港島三份及新界十三份。","digest":"屋宇署九月共批出十六份建築圖則，其中港島三份及新界十三份","points":["上述批出的圖則包括四項住宅及商住發展、三項商業發展、七項工廠及工業發展，以及兩項社區服務發展","獲准動工的建築工程項目則有四個，這些工程完成後將提供可作住宅用途的建築樓面面積共十三萬三千四…","屋宇署同時發出二十一份入伙紙，包括港島五份、九龍八份及新界八份"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T15:00:00+08:00","size":1,"keywords":[],"body":"屋宇署九月共批出十六份建築圖則，其中港島三份及新界十三份。\n\n　　上述批出的圖則包括四項住宅及商住發展、三項商業發展、七項工廠及工業發展，以及兩項社區服務發展。\n\n　　獲准動工的建築工程項目則有四個，這些工程完成後將提供可作住宅用途的建築樓面面積共十三萬三千四百九十四平方米，涉及單位二千五百一十六個，非住宅用途的建築樓面面積達十五萬九千零八十五平方米。另外，該署亦接獲五個建築項目的上蓋工程動工通知。\n\n　　屋宇署同時發出二十一份入伙紙，包括港島五份、九龍八份及新界八份。\n\n　　其中住宅用途的建築樓面面積有三萬零四百七十平方米，共六百五十五個單位；而非住宅用途的建築樓面面積則為十萬零八百九十九平方米。\n\n　　九月份新落成樓宇的報價總值約為五十八億元。\n\n　　此外，該署批准三項拆卸樓宇工程。\n\n　　該署九月接獲三千五百四十宗有關僭建物的舉報，並發出七百七十一張僭建物的清拆令。\n\n　　九月資料月報全部內容已載於屋宇署網頁（www.bd.gov.hk），歡迎市民瀏覽。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c664e374012","title":"教育局公布二○二七／二八學年指定專業／界別課程資助計劃──副學位課程","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900216.htm","summary":"教育局今日（十一月十九日）公布，指定專業／界別課程資助計劃在二○二七／二八學年將資助五所專上院校共35個副學位課程的2 196個學額。","summary_short":"教育局今日（十一月十九日）公布，指定專業／界別課程資助計劃在二○二七／二八學年將資助五所專上院校共35個副學位課程的2…","digest":"教育局公布二○二七／二八學年指定專業／界別課程資助計劃──副學位課程","points":["教育局今日（十一月十九日）公布，指定專業／界別課程資助計劃在二○二七／二八學年將資助五所專上…","該35個指定副學位課程屬於七個對人才需求殷切的範疇，分別為建築及工程、電腦科學、創意工業…","有關課程和學額數目（見附件）經教育局諮詢相關政策局和部門後決定"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T15:00:00+08:00","size":1,"keywords":[],"body":"教育局今日（十一月十九日）公布，指定專業／界別課程資助計劃在二○二七／二八學年將資助五所專上院校共35個副學位課程的2 196個學額。\n\n　　該35個指定副學位課程屬於七個對人才需求殷切的範疇，分別為建築及工程、電腦科學、創意工業、護理、運動及康樂、檢測及認證和旅遊及款待。有關課程和學額數目（見附件）經教育局諮詢相關政策局和部門後決定。\n\n　　在二○二七／二八學年，實驗室為本課程與非實驗室為本課程的年度資助金額將分別為40,730元及23,390元。資助金額適用於符合資格的新生和舊生。資助會在課程的正常修業期內發放。獲資助的學生只須支付扣除資助後的學費。有需要的學生仍可就實際應繳的學費向在職家庭及學生資助事務處轄下的學生資助處申請學生資助。\n\n　　指定專業／界別課程資助計劃旨在資助學生修讀選定範疇的指定全日制經本地評審自資學士學位及副學位課程，為有殷切人力資源需求的行業培育人才。二○二七／二八學年的指定學士學位課程、資助學額數目及資助金額等詳情，已於九月二十一日公布。\n\n　　學生可直接向有關院校申請報讀獲資助的副學位課程。有關資助計劃的詳情，請瀏覽網頁www.cspe.edu.hk/sssdp。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c21edd2ec19","title":"​財庫局局長在盧森堡展示香港的金融實力","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111800406.htm","summary":"財經事務及庫務局局長許正宇十一月十八日（盧森堡時間）在盧森堡展開其出訪歐洲的第二站行程，其間會晤當地多名政府官員、金融監管機構、銀行及金融機構代表。","summary_short":"財經事務及庫務局局長許正宇十一月十八日（盧森堡時間）在盧森堡展開其出訪歐洲的第二站行程，其間會晤當地多名政府官員…","digest":"財經事務及庫務局局長許正宇十一月十八日在盧森堡展開其出訪歐洲的第二站行程…","points":["財經事務及庫務局局長許正宇十一月十八日（盧森堡時間）在盧森堡展開其出訪歐洲的第二站行程…","他當日先拜會盧森堡財政部，與秘書長兼庫務署署長Bob Kieffer會晤","會上，許正宇重點介紹香港在首份《五年規劃》下的策略方向…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T12:00:00+08:00","size":1,"keywords":[],"body":"財經事務及庫務局局長許正宇十一月十八日（盧森堡時間）在盧森堡展開其出訪歐洲的第二站行程，其間會晤當地多名政府官員、金融監管機構、銀行及金融機構代表。\n\n　　他當日先拜會盧森堡財政部，與秘書長兼庫務署署長Bob Kieffer會晤。會上，許正宇重點介紹香港在首份《五年規劃》下的策略方向，指出該藍圖不單進一步鞏固香港作為國際金融中心、全球離岸人民幣業務樞紐、國際資產財富管理中心和國際風險管理中心的地位，更透過具體的政策方向，為投資者和企業展現具預見性的發展環境。他表示，盧森堡與香港在財富管理、綠色金融和數字金融領域各具優勢且理念相近，是雙方深化合作、鞏固各自作為歐洲與亞洲資金安全港的理想策略夥伴。此外，香港亦是盧森堡抓緊中國內地龐大機遇的首選門戶。\n\n　　為更深入了解盧森堡的金融狀況，許正宇與盧森堡金融推廣署首席執行官Tom Théobald，以及盧森堡基金行業協會行政總裁Serge Weyland會面，並於其後與盧森堡銀行及財富管理業界的關鍵代表進行圓桌午餐會。盧森堡基金行業協會代表當地資產管理及投資基金業界，而盧森堡金融推廣署則是盧森堡政府與當地金融業聯會成立的公私營合作機構。\n\n　　許正宇向他們表示，可預見性及穩定性是香港金融巿場的標誌性優勢。他補充說，政府致力透過加強便利措施優化金融生態圈，包括通過法例優化有關基金、單一家族辦公室和附帶權益的優惠稅制，以及優化房地產投資信託基金（房託基金）制度，以提升房託基金市場的競爭力和流動性。\n\n　　他又提到香港自二○二五年一月獲倫敦金屬交易所納入為許可交付地點以來，在發展大宗商品市場方面取得令人鼓舞的成果。截至十月底，相關倉庫的總面積已超過74 000平方米，有色金屬庫存量亦突破67 000公噸。香港交易及結算所有限公司正力爭於明年聯動指定銀行推出代幣化倉單融資試點項目，以推動企業透過商品庫存作擔保，獲取流動資金。\n\n　　他其後到訪盧森堡證券交易所。該交易所是歐洲領先的證券交易所，專注於國際上市業務，並以可持續金融及跨境資本市場服務為重點。許正宇向其副行政總裁兼首席財務官Pierre Schoonbroodt及其他高層管理人員分享香港提升股票市場流動性的最新舉措，包括推動海外企業來港雙重主要上巿及第二上市，以及推動證券市場「T+1」結算周期。\n\n　　下午，許正宇與盧森堡金融監管委員會主管Marco Zwick會面。該委員會是監管盧森堡金融業從業員及金融產品的公營機構。許正宇認同遵守國際標準對確保市場暢順運作和有效保障投資者至關重要，並強調香港同樣擁有嚴謹的監管框架作為核心，支撐金融市場穩健暢旺發展。\n\n　　在與歐洲投資銀行副行長Marko Primorac博士會晤期間，許正宇向他介紹香港為強化綠色金融生態圈而推出的最新舉措，包括Core Climate促成的兩項跨境試點計劃，其一是讓香港企業得以購買內地的綠色電力證書，另一項則為測試碳排放配額的結算安排。\n\n　　許正宇亦禮節性拜會中國駐盧森堡大使館臨時代辦朱煒燁，向他介紹香港的最新金融發展情況。\n\n　　他十一月十九日（盧森堡時間）將前往比利時布魯塞爾，繼續出訪行程。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":15,"items":[{"id":"cf3d1f197da","title":"共识重在落实 繁荣贵在实干","url":"https://www.chinanews.com.cn/ll/2026/11-19/10734896.shtml","summary":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","各成员经济体汇聚一堂，共商发展大计，期待通过此次会议增进互信、凝聚共识，明确亚太前进方向…","这里产业体系多元，市场潜力巨大，科技创新活跃，孕育着广阔的发展机遇"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:46:29+08:00","size":1,"keywords":[],"body":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。各成员经济体汇聚一堂，共商发展大计，期待通过此次会议增进互信、凝聚共识，明确亚太前进方向，增强亚太发展动力，为世界经济注入更多确定性。\r\n\n　　亚太是全球发展的重要动力源和创新源。这里产业体系多元，市场潜力巨大，科技创新活跃，孕育着广阔的发展机遇。同时，贸易政策不确定性增加，地缘政治风险上升，也给区域发展带来新的挑战。APEC各成员经济体供应链深度交织，市场相互依存，一家的发展挑战可能传导为区域共同风险，一次成功合作也会转化为各方共享的红利。如何释放潜力、抵御风险，如何增强动能、共享成果，是APEC各成员经济体共同面对的时代课题。\n\n　　回答这些课题，需要从亚太发展的实践中寻找答案。开放合作，正是亚太繁荣的根基。各经济体发展水平不同、资源禀赋各异，在分工协作中优势互补，在互通有无中共同成长。开放打通市场，合作串联产业，让更多经济体参与区域发展、分享增长红利。亚太过去的发展得益于此，未来的繁荣同样依赖于此。越是外部环境复杂，越要坚守开放方向，巩固合作基础。\n\n　　2026年APEC“中国年”以“建设亚太共同体，促进共同繁荣”为主题，将“开放、创新、合作”作为三大优先领域，回应亚太发展之需，顺应国际社会共同期待，为亚太乃至世界应对挑战、开拓未来指明了方向。\n\n　　开放是亚太发展的重要前提。破除贸易投资壁垒，维护产业链供应链稳定畅通，才能让各经济体优势得到充分发挥。创新是持续增长的重要动力。加强技术交流，推动数字经济、绿色转型等新兴领域合作，才能不断培育新的增长动能。合作是实现共同繁荣的重要保障。深化政策沟通，照顾彼此关切，加强互通有无，才能帮助更多经济体把握机遇、应对风险，不让任何一方掉队。\n\n　　中国一直坚持与亚太及世界共享发展机遇，以高水平开放拓展亚太发展空间，以科技创新培育区域增长动能，以务实合作促进各方优势互补。接任APEC东道主以来，中国以东道主担当凝聚各方力量，以务实行动推动共同发展。中方同各成员一道，举办300多场会议和活动，达成一系列合作共识。从贸易投资自由化便利化到人工智能，从能源低碳转型到中小企业数字化发展，从防灾减灾到粮食安全，各领域交流紧扣时代发展需求，推动各方寻找利益交汇点、拓展合作空间。\n\n　　APEC的核心价值，在于从多元差异中寻找最大公约数，推动各方凝聚普遍共识、锚定共同利益。共识重在落实，繁荣贵在实干。期待APEC各成员把共识化为举措，把承诺化为行动，携手共创亚太光明未来。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c48811293db","title":"企业出海“第一站”如何行稳致远 中国和东盟法学法律界重庆共寻答案","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-19/10734890.shtml","summary":"中新网重庆11月19日电 (记者 刘相琳)企业“走出去”风险问题及法律应对论坛19日在重庆举行。","summary_short":"中新网重庆11月19日电 (记者 刘相琳)企业“走出去”风险问题及法律应对论坛19日在重庆举行。","digest":"企业“走出去”风险问题及法律应对论坛19日在重庆举行","points":["中新网重庆11月19日电 (记者 刘相琳)企业“走出去”风险问题及法律应对论坛19日在重庆举…","来自中国和东盟国家的法学法律界代表、律师组织负责人及多家企业代表齐聚一堂…","由中国法学会主办的第八届中国—东盟法治论坛此间在重庆举行…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:42:45+08:00","size":1,"keywords":[],"body":"中新网重庆11月19日电 (记者 刘相琳)企业“走出去”风险问题及法律应对论坛19日在重庆举行。来自中国和东盟国家的法学法律界代表、律师组织负责人及多家企业代表齐聚一堂，围绕“法治护航通道·合规赋能出海”主题，共商企业跨境经营风险防范与法律应对之道。\r\n\n　　由中国法学会主办的第八届中国—东盟法治论坛此间在重庆举行，企业“走出去”风险问题及法律应对论坛是分论坛之一。中国法学会党组书记、常务副会长王洪祥在分论坛致辞时表示，中国已连续17年稳居东盟第一大贸易伙伴，东盟连续6年成为中国第一大贸易伙伴。与此同时，中国已成为东盟的第二大外国投资来源地，而东盟成为中国企业海外投资最为集中的区域，也是许多中资企业出海选择的第一站。经贸合作的广度、深度持续拓展的同时，跨境经营的法律环境、规则体系、风险场景也更加复杂多元，跨境合规、投资保护、商事争议、知识产权、劳工环保等各类法律风险，成为制约企业稳健出海的关键因素。\n\n　　“合规不是出海的‘成本线’，而是‘生存线’。”王洪祥围绕深化中国—东盟法治合作、服务企业跨境发展，提出三点倡议：共筑规则基石，优化营商环境，以法治的确定性应对市场的不确定性；共守合规底线，赋能企业出海，推动企业树立全员、全程、全域合规理念；共建法律服务，护航跨境合作，建立面向东盟的国别法律查明机制和跨境商事争议多元解决机制。\n\n　　柬埔寨律师协会主席赛恩万纳介绍，该国2021年颁布的新投资法及配套实施性副法令推动投资程序更加透明可预测，他建议中国企业在进入柬埔寨之前，选择合适的法律结构，将合规性视为日常管理工作中的一项职责，同时对业务合作伙伴及交易开展有意义的尽职调查，要投资于人才建设及负责任的商业行为，并为跨境贸易可能面临的法律风险做好准备。\n\n　　老挝国家律师协会主席维恩萨万·潘塔利结合其处理的大量跨境投资合规案件与咨询实务，分析了中国企业赴老挝投资最常见的四大税务合规风险，建议中国企业赴老挝经营及投资要前置合规布局，精准适配本地化税收政策；建立常态化税务内控管理体系；依托专业法治力量，化解跨境合规壁垒。\n\n　　从一线实践出发，中国企业法务负责人分享了各自的合规经验和建议。腾讯集团副总裁徐炎建议，提升境内司法判赔力度，为企业出海提供坚实“大后方”。安踏集团法务副总裁樊俊伟提出，合规正从单项风险审核走向覆盖经营全过程的全链条治理。\n\n　　与会人士认为，企业“走出去”机遇与风险相伴，唯有把合规防线前移，才能实现“走得稳、走得远、走得好”，以高水平法治保障助力中国—东盟经贸合作行稳致远。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc0aa32f442","title":"“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办","url":"https://www.chinanews.com.cn/txy/2026/11-19/10734775.shtml","summary":"11月14日至15日，“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办。","summary_short":"11月14日至15日，“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办。","digest":"11月14日至15日，“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办","points":["河南省委统战部、省文化和旅游厅相关领导及处室负责同志，安阳市委统战部相关负责同志…","15日上午，“新艺河南·古都雅韵”非遗进景区活动启动仪式在中国文字博物馆启幕","非遗市集盛装亮相、异彩纷呈，来自全省40余项国家级、省级非遗项目集中登场，匠心技艺荟萃一堂"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:37:17+08:00","size":1,"keywords":[],"body":"11月14日至15日，“新艺河南·古都雅韵”非遗进景区活动在河南安阳举办。河南省委统战部、省文化和旅游厅相关领导及处室负责同志，安阳市委统战部相关负责同志，省新联会“寻美河南”“新艺河南”组委会成员和网络大V、非遗传承人及媒体记者等80余人参加活动。\n\n　　15日上午，“新艺河南·古都雅韵”非遗进景区活动启动仪式在中国文字博物馆启幕。非遗市集盛装亮相、异彩纷呈，来自全省40余项国家级、省级非遗项目集中登场，匠心技艺荟萃一堂。大家驻足市集参观体验，感悟根植中原文明的匠心传承，了解非遗技艺融入景区实景场景、依托数字渠道拓宽传播声量的实践路径。\n\n　　活动期间，大家先后赴殷墟考古文旅小镇、仓巷街历史文化街区、中国文字博物馆非遗市集及展厅、殷墟宗庙宫殿遗址、殷墟博物馆，聚焦非遗保护传承、活化利用与数字化传播，考察非遗与景区融合发展成效，了解工业遗存活化、历史文脉保护、线上线下联动文旅场景打造等创新做法。\n\n　　本次活动打造“网络+非遗+景区”创新模式，网络人士同步记录创作，截至目前，全网话题总阅读量达8372.8万，#新艺河南古都雅韵 安阳启动# #当古都安阳遇上多彩非遗# #新艺河南擦亮安阳文旅名片# 三大话题连续两天登顶同城热搜前三，活动产出原创短视频280余条，掀起品读殷商文脉、感受非遗焕新的传播热潮，助力打造黄河古都群世界级旅游目的地，为河南建设文旅强省贡献力量。\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb53ac71d49","title":"甘南学子津门研学：在历史与未来间感受“同心”","url":"https://www.chinanews.com.cn/txy/2026/11-19/10734852.shtml","summary":"中新网天津11月19日电 (记者 周亚强)第四期“同心·筑梦中国行”青少年研学团19日走进天津。","summary_short":"中新网天津11月19日电 (记者 周亚强)第四期“同心·筑梦中国行”青少年研学团19日走进天津。","digest":"第四期“同心·筑梦中国行”青少年研学团19日走进天津","points":["中新网天津11月19日电 (记者 周亚强)第四期“同心·筑梦中国行”青少年研学团19日走进天…","来自甘肃甘南藏族自治州的49名小学生，围绕红色教育、科创体验、校园交流…","在周恩来邓颖超纪念馆，孩子们放慢脚步，围在展柜前看照片、听讲解"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:36:18+08:00","size":1,"keywords":[],"body":"中新网天津11月19日电 (记者 周亚强)第四期“同心·筑梦中国行”青少年研学团19日走进天津。来自甘肃甘南藏族自治州的49名小学生，围绕红色教育、科创体验、校园交流、民族团结联谊等开展研学，在历史与未来之间感受“同心”。\n\n　　在周恩来邓颖超纪念馆，孩子们放慢脚步，围在展柜前看照片、听讲解。甘南州五年级学生旦增更君说：“以前只在课本上读到周总理的故事，今天看到他用过的东西，觉得他离我们很近。”碌曲县双岔镇中心小学教师仁青草说，走进纪念馆，孩子们对“为中华之崛起而读书”有了更具体的感受。\n\n11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津。图为甘南州学生在天开高教科创园与智能机器人互动。　记者 冯宏杰 摄\n\n　　在天开高教科创园，机械臂抓取物品、智能设备开口对话，孩子们围上前，追着讲解员问原理。具身智能应用展示体验中心里，有学生和围棋机器人对弈，输了，又坐下来重开一局。卓尼县柳林小学教师李靖说，研学让孩子们看到了山外的世界，也看到了科学的样子。\n\n　　随后，研学团走进南开大学，参观校史馆，并在周总理雕像前合影。有学生站在雕像前小声说：“我以后也想考到这里来。”南开大学相关负责人表示，希望校园参访能让甘南学子感受大学氛围，激发对知识的向往。\n\n11月19日，第四期“同心·筑梦中国行”青少年研学团走进天津。图为津甘两地学生在红光中学准备表演锅庄舞。　记者 冯宏杰 摄\n\n　　在天津市红光中学，津甘两地学生围成圈跳起锅庄舞。欢快的节奏中，原本有些拘谨的孩子们很快熟络起来。红光中学学生其美央宗说：“虽然我们来自不同地方，但跳起锅庄舞就像一家人。”合作市教育局督学马文忠表示，联谊活动让民族团结和交往交流交融自然发生在孩子们的笑声中。\n\n　　研学团带队负责人介绍，此次活动注重把爱国主义教育、科技创新体验和民族团结交流结合起来，让甘南孩子在行走中开阔眼界、增进认同。\n\n　　当天，研学团还走进银博缘四大发明文化创意体验城，感受中华优秀传统文化的魅力；后续还将参观大沽口炮台遗址博物馆、国家海洋博物馆和天津泰达航母主题公园，继续天津段研学。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cefaa878d80","title":"一把芦笙吹出爱情 探访贵州苗族传承千年的“相亲大会”","url":"https://www.chinanews.com/cul/shipin/cns/2026/11-19/news1075494.shtml","summary":"11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚，展开一场传承千年的苗族婚恋习俗——讨花带。","summary_short":"11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚…","digest":"11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚…","points":["11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚…","活动现场，女孩们头戴银冠、颈挂银项圈，身着盛装随芦笙曲翩翩起舞，展现自己最美的一面","(袁超 张琦 贵州黔东南报道 部分素材来源 雷山融媒）"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T20:15:31+08:00","size":1,"keywords":[],"body":"11月18日，贵州省雷山县黄里村的芦笙场地，众多当地及周边村寨的苗族青年男女相聚，展开一场传承千年的苗族婚恋习俗——讨花带。活动现场，女孩们头戴银冠、颈挂银项圈，身着盛装随芦笙曲翩翩起舞，展现自己最美的一面。芦笙场上，女孩们佩戴不同颜色的花朵，用于区别不同的村寨，而穿着苗族便装的小伙们手持芦笙，目光紧紧锁定心仪的女孩，在朋友或者家里长辈的陪同下，吹奏婉转悠扬的曲调，一步步向女孩靠近。在讨花带的过程中，若女方也对男方有好感，则把花带或者佩戴的银饰挂在男方芦笙和脖子上，以示定情信物。(袁超 张琦 贵州黔东南报道 部分素材来源 雷山融媒）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/EC46BC2133A0485D8E5B4A64802BF893.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c6f137d756b","title":"华西这位医生因“有温度的医嘱”走红：拍科普视频是为了“偷懒”","url":"https://www.chinanews.com/shipin/cns/2026/11-19/news1075487.shtml","summary":"近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注。","summary_short":"近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注。","digest":"近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注","points":["近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注","视频中，他没有围绕病情交流，而是像一位父辈，劝导住院少年不要沉迷手机，要重视学业","马俊账号里这类一线查房、面诊实拍视频已多次出圈，其中劝老年人多吃肉蛋…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T19:07:20+08:00","size":1,"keywords":[],"body":"近日，四川大学华西医院骨科副主任医师马俊一段视频经网络转发后引发大量关注。视频中，他没有围绕病情交流，而是像一位父辈，劝导住院少年不要沉迷手机，要重视学业。马俊账号里这类一线查房、面诊实拍视频已多次出圈，其中劝老年人多吃肉蛋、少喝汤的短视频广为传播，通俗的讲解打动不少网友。社交平台上，马俊已发布2000余个医学科普视频，积累超200万粉丝。谈及做网络科普的初衷，马俊坦言出发点十分简单，就是为了“偷懒，提升临床工作效率”。(陈选斌 四川成都报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/EF70180337404F8D9E0266E0E085B394.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cd7d41cb53b","title":"晨光追擊│「肯佩斯」愈贏愈醒","url":"https://www.stheadline.com/trackwork/3638983/晨光追擊肯佩斯愈贏愈醒","summary":"一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下。","summary_short":"一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下。","digest":"一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下","points":["一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下","「極上紗瓏」戴頭罩由潘明輝跳兩段，大步疾走神態軒昂，力度比前更好，狀態回到上季最弗時","「安都」助手跳兩段，墜手起勁火氣不斷冒升，外觀悅目毛色立立靚，狀態回勇"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T19:06:32+08:00","size":1,"keywords":[],"body":"一如平日的周四晨課，今朝出跳馬相當踴躍，當中不乏周日參戰分子及勇馬，現摘錄如下。\n「極上紗瓏」戴頭罩由潘明輝跳兩段，大步疾走神態軒昂，力度比前更好，狀態回到上季最弗時。「安都」助手跳兩段，墜手起勁火氣不斷冒升，外觀悅目毛色立立靚，狀態回勇。\n  「天天同樂」戴頭罩由巴度跳兩段，長韁操控特別試得好，岳頭馬不搶口，人馬夾檔狀態呈勇。「紫荊傳令」戴眼罩由助手按住順跳兩段，暗火湧現，馬身喼得靚佳態保持。「嘉應奇兵」潘明輝跳兩段，表現主動，火氣好到不得了，目光銳利神生步爽，保持勇態。\n  「錶之光速」助手跳兩段，動作無咁生硬，出腳變得流暢，質新馬有點進展。「金創福威」戴眼罩及頭罩由助手跳一段，轉腳後規矩好多，大馬亦不論盡，神態回旺大有起色。「絲王之王」助手跳兩段，毛色悅目金光閃閃，愈走愈起勁上火上力，狀態初勇。\n「飛來霸」戴頭罩由助手跳兩段，超短韁捉實充滿火氣，步伐無亂力度又好，狀態不俗。\n\n「跨境寶馬」戴眼罩由助手拍「八玲瓏」跳兩段，表現活躍，步輕力度充沛，毛色烏卒卒，狀態已起。「肯佩斯」戴頭罩由助手跳兩段，神態生猛大半程搶走，火力更強，愈贏愈醒神。「合夥奔馳」戴頭罩由助手跳兩段，年紀大了不再急口，馬身壯落腳爽，狀態及格。  \n  「飛來霸」戴頭罩由助手跳兩段，超短韁捉實充滿火氣，步伐無亂力度又好，狀態不俗。「君子傳承」戴眼罩由助手跳兩段，從容走過步挺開揚，馬身實淨觀感甚佳。「佰勝金龍」戴頭罩由助手跳兩段，馬身喼得靚展現線條美，神態活躍，狀態未見走樣。\n  「手機錶霸」戴頭罩由潘明輝跳兩段，一貫急勁和賣力，馬身脹卜卜，長在勇境。「友瑩亮」戴頭罩由助手跳兩段，步輕彈力十足，馬身保持飽滿，持續態勇。「觀眾之力」戴頭罩由助手草地跳兩段，扣住走火氣依然旺盛，身壯唔瘦勇態保持。佳態保持有餘。「嵐臣」潘頓草地跳兩段，健步如飛走勢爽勁，馬身壯肌肉起腱，愈贏愈銳利。\n兆文","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ceecb6dde36","title":"中国广西新发现直立人化石 助解古人类演化关键谜题","url":"https://www.chinanews.com/edu/shipin/cns-d/2026/11-19/news1075483.shtml","summary":"直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚大陆东部。","summary_short":"直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚大陆东部。","digest":"直立人是生存年代最长的古人类物种之一…","points":["直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚…","不过，由于此前中国特别是华南地区相关化石记录存在空白，成为古人类演化关键谜题之一，备受关注","中外科学家最近在广西相距15公里的两处洞穴遗址中鉴定出8颗直立人牙齿化石…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T18:17:43+08:00","size":1,"keywords":[],"body":"直立人是生存年代最长的古人类物种之一，已知在约190万年到10.8万年前分布在整个非洲到欧亚大陆东部。不过，由于此前中国特别是华南地区相关化石记录存在空白，成为古人类演化关键谜题之一，备受关注。\n\n中外科学家最近在广西相距15公里的两处洞穴遗址中鉴定出8颗直立人牙齿化石，发现该种群曾生存于距今32.4万年至18.4万年的雨林环境中。这既表明直立人在中国的存续年代比之前的认识至少后推了8万年，也挑战了关于直立人群体无法适应雨林环境行为局限的假设。\n\n这项古人类重大发现，由中国科学院古脊椎动物与古人类研究所(古脊椎所)东亚古人类文化演进与环境适应研究团队张颖奇研究员等，联合山东大学等中外6个国家10余个科研机构的科学家合作完成。北京时间11月19日凌晨，相关成果论文以姊妹篇形式在国际学术期刊《自然》上线发表。\n\n(记者 孙自法 制作 王佳琪 视频来源 施普林格·自然）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/295E618AD6154136B890E40A9A9D369F.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cb903d5853c","title":"哈工大原創話劇《仰望者》 以藝術之美還原「精神群像」｜聚焦哈工大","url":"https://www.stheadline.com/parenting-guide/3638388/哈工大原創話劇仰望者-以藝術之美還原精神群像聚焦哈工大","summary":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神、科學家精神的共鳴。","summary_short":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神…","digest":"近日，哈爾濱工業大學歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場…","points":["近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場…","專業演員與大學師生同台，將一群科學家、教育工作者扎根東北、教書育人、科研攻關的故事搬上舞台","20世紀50年代，800多名青年師生從中國各地齊聚哈爾濱工業大學"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:45:28+08:00","size":1,"keywords":[],"body":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神、科學家精神的共鳴。專業演員與大學師生同台，將一群科學家、教育工作者扎根東北、教書育人、科研攻關的故事搬上舞台。\n哈工大「八百壯士」奮鬥歷程\n這些人物有一個共同的名字——哈工大「八百壯士」。20世紀50年代，800多名青年師生從中國各地齊聚哈爾濱工業大學。這支平均年齡只有27.5歲的教師隊伍，承擔起學科建設與教學任務，為新中國培養工業化建設急需的人才。\n不搞模式化的英雄塑造，整部話劇深入歷史細節與人性深處。「我們站在舞台上，復刻的是先輩的崢嶸故事，演繹的是一代人的赤誠信仰。」就讀於建築與設計學院的鄒明燁說。\n哈工大「八百壯士」扎根北疆、「科技報國」的奮鬥歷程，是新中國高等教育特別是高等工程教育開拓發展的生動縮影。全劇以「仰望」為核心、「傳承」為主線，表達的就是「仰望與扎根」——腳踏泥濘、仰望星空，每代人都是仰望者，也會成為被仰望者。\n文藝是時代的號角，也是精神的載體。觀察者認為，《仰望者》找到了思想性與藝術性的結合點，通過高水準的劇本創排與舞台視覺呈現，使科學家精神與教育家精神在藝術美感中自然流淌、潤物無聲。\n這部話劇通過新媒體直播平台播出，50萬人次線上觀看。\n文：李雙余、闞思邈 圖：辛然、陳暢\n延伸閱讀：\n哈爾濱工業大學香港理工大學深圳國際設計學院 舉行揭牌儀式｜聚焦哈工大\n哈工大總體研製 八一04星「哈爾濱號」成功發射｜聚焦哈工大","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c441e987d3e","title":"食蜆習慣反映教養？港人震驚朋友1食法「嚇到眼都突」網民負評：睇得出人性禮貌","url":"https://www.stheadline.com/food/3638933/食蜆習慣反映教養港人震驚朋友1食法嚇到眼都突網民負評睇得出人性禮貌","summary":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。","summary_short":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。","digest":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教","points":["與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教","近日，一名港人於網上社交平台發文，分享早前與一大班朋友聚餐食炒蜆時…","帖文旋即引起廣大網民熱烈討論，大批網民一面倒負評樓主朋友的行為，直斥缺乏禮貌：「睇得出人性…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:27:41+08:00","size":1,"keywords":[],"body":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。近日，一名港人於網上社交平台發文，分享早前與一大班朋友聚餐食炒蜆時，驚見同枱友人竟做出一個奇特的食蜆舉動，直言與自己從小的家庭教育截然不同，令他當場大感震驚。帖文旋即引起廣大網民熱烈討論，大批網民一面倒負評樓主朋友的行為，直斥缺乏禮貌：「睇得出人性、禮貌同尊重」。\n港人與友聚餐食炒蜆驚見1行為 直言與從小家教截然不同\n港人聚餐或到小炒店用膳，惹味的炒蜆往往是餐桌上的熱門菜式。最近，一名港人於網上社交平台發文，表示自己從小到大與家人食炒蜆時，家人都會將蜆連同外殼一併夾走享用。然而，樓主日前與一班朋友食炒蜆時，卻驚見同枱所有人竟然都是「直接夾嚿肉」，然後將空殼原封不動留在公家碟上，令到樓主需於整碟蜆殼中「摷」才找到蜆肉。面對朋友們異於常人的進食習慣，樓主坦言當時「嚇到眼都突」，甚至一度懷疑自己的飲食習慣才是奇怪。\n網民批評友人無家教：隻隻都空城計真係嬲\n帖文引起網民熱烈討論，大多網友力撐樓主飲食習慣無問題，直指其朋友們的行為反映家教問題：「咁係你班friend無家教」、「你屋企有家教，千祈唔好以為一大班人係norm」、「通常我係做揀走啲殼嘅人，隻隻都空城計真係嬲」、「屋企人無教錯你」。有不少網民自身的家庭教育，表示從小長輩已教導必須連殼夾起，亦不能夾回碟內：「就算夾起發覺冇肉都唔可以放返落碟」、「好細個試過一次齋夾肉，比阿爸鬧」、「夾住嚿肉喺隻碟度揈甩個殼咁核突？」\n有較為包容的網民笑指朋友間無需太計較，或大家下次可選擇用公家匙羹：「通常我會將所有嘅殼夾晒出嚟放喺我前面，搞到變到有座山」、「最方便嘅方法就係用公匙羹，一勺倒落自己個碗慢慢食」、「唯有親自攞隻公家匙羹慢慢𢳂出嚟，提示大家應該連殼夾走」。有自稱資深「食蜆美食家」的網民打趣表示，樓主的朋友都不懂食蜆的真正美味：「作為炒蜆資深食家，夾到有肉就食、啜埋汁，無肉就淨啜汁」、「真，啜汁先惹味，算埋個殼先係精粹，佢哋識唔識食」、「我連殼食，用牙咬走啲肉，咁樣除咗得體，其實更好味」。\n文：R\n資料及圖片來源：Threads\n延伸閱讀：內地客遊港遇「茶餐廳文化」衝擊 力數三宗罪怒批：這叫服務嗎？ 勸這類人不要去....","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4a11f75943","title":"斯诺克德国大师赛资格赛：丁俊晖晋级正赛32强","url":"https://www.chinanews.com.cn/ty/2026/11-19/10734622.shtml","summary":"中新社英国维冈11月19日电 当地时间11月18日，2027斯诺克德国大师赛资格赛展开96进64轮剩余场次和部分第三轮(64进32)较量。","summary_short":"中新社英国维冈11月19日电 当地时间11月18日，2027斯诺克德国大师赛资格赛展开96进64轮剩余场次和部分第三轮(…","digest":"当地时间11月18日…","points":["中新社英国维冈11月19日电 当地时间11月18日…","中国球手10人出战，取得7胜3负","现世界排名23位的丁俊晖开局迟迟未能进入状态，扎克·舒尔第连赢两局"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:50:36+08:00","size":1,"keywords":[],"body":"中新社英国维冈11月19日电 当地时间11月18日，2027斯诺克德国大师赛资格赛展开96进64轮剩余场次和部分第三轮(64进32)较量。中国球手10人出战，取得7胜3负。丁俊晖战胜英格兰球手扎克·舒尔第晋级正赛。\n\n　　因现世界排名跌出前16、未获种子席位，丁俊晖此次德国大师赛从资格赛打起，当日比赛对手是世界排名第43位的扎克·舒尔第。现世界排名23位的丁俊晖开局迟迟未能进入状态，扎克·舒尔第连赢两局。落后的丁俊晖从第三局开始找回手感，先后打出单杆116分、99分和57分，连扳四局以4比2反超。尽管舒尔第此后以一个单杆50分扳回一局，但丁俊晖未给对手更多机会，第八局上手后连续围绕黑球得分，虽在咖啡球上错失147满分杆，仍打出单杆125分锁定胜局，终以5比3取胜，跻身32强。\n\n　　当日中国球手参加的另外三场64进32轮次比赛中，斯佳辉面对英格兰新星斯坦·穆迪，从0比2落后追至2比2，被对手再度扳成3比3后连下两局，以5比3取胜；周跃龙开局0比3落后威尔士球手杰克逊·佩奇，此后打出两杆80+和一杆破百，连赢五局以5比3翻盘；吕昊天与英格兰球手加里·威尔逊战满九局，决胜局惜败，以4比5被淘汰。\n\n　　6位中国球手参加第二轮剩余场次较量。其中，中国香港老将傅家俊在先失一局的情况下连续击出两杆单杆破百和两个单杆50+，终以5比1大胜威尔士老将马修·史蒂文斯，强势晋级。\r\n\n　　刘宏宇以5比2战胜英格兰球手阿尔菲·博登；罗泽涛在3比4落后的情况下连赢两局，以5比4险胜英格兰球手大卫·利利；范争一以5比3击败泰国球手塔纳瓦特·提拉朋派班，如愿晋级。\n\n　　另外两场中国选手参加的比赛中，徐思以1比5负于比利时球手朱利安·勒克莱，邓壕辉0比5不敌苏格兰球手安东尼·麦克吉尔。\n\n　　当地时间11月19日，本届德国大师赛资格赛将进入收官日，张安达、庞俊旭、雷佩凡等多位中国球手将出场，为正赛资格而战。(完) 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce3f588af51","title":"女子耳内“有虫爬” 竟是家中宠物惹的祸","url":"https://www.chinanews.com.cn/jk/2026/11-19/10734619.shtml","summary":"近日，市民余女士(化姓)出现耳鸣、耳道异物感，让她最难受的是还感觉有小虫子在耳朵里面慢慢爬，于是她来到南京江北医院耳鼻喉科就诊。","summary_short":"近日，市民余女士(化姓)出现耳鸣、耳道异物感，让她最难受的是还感觉有小虫子在耳朵里面慢慢爬…","digest":"近日，市民余女士(化姓)出现耳鸣、耳道异物感…","points":["近日，市民余女士(化姓)出现耳鸣、耳道异物感，让她最难受的是还感觉有小虫子在耳朵里面慢慢爬…","接诊后，副主任医师魏新民为她安排了耳内镜检查，但常规观察条件下，耳道内并未发现明显异常","直到改用高清放大专业内镜进一步细查后，才发现了耳道内螨虫样微小生物在顺光移动"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:30:19+08:00","size":1,"keywords":[],"body":"近日，市民余女士(化姓)出现耳鸣、耳道异物感，让她最难受的是还感觉有小虫子在耳朵里面慢慢爬，于是她来到南京江北医院耳鼻喉科就诊。接诊后，副主任医师魏新民为她安排了耳内镜检查，但常规观察条件下，耳道内并未发现明显异常。直到改用高清放大专业内镜进一步细查后，才发现了耳道内螨虫样微小生物在顺光移动。进一步追问生活史，问题根源指向了家中饲养的一只猫和一条狗。\r\n\n　　导致余女士耳部不适的微小生物正是耳螨，是宠物耳道里常见的寄生生物。“耳螨体型极小，普通光源下、肉眼下几乎无法辨认。”魏新民介绍，耳螨寄居于耳道，活动时会刺激外耳道皮肤和黏膜，从而引起耳鸣、耳痒、异物感、蚁行感等一系列症状。这类症状表现在临床上很容易与神经性耳鸣、外耳道炎等相混淆，所以不少患者反复就诊、反复用药，症状却始终不见好转，直到通过专科内镜仔细排查，才最终找到问题所在。\n\n　　结合余女士的情况，魏新民提醒：床单、被套、枕套等贴身织物建议定期清洗、晾晒；地毯、沙发、宠物窝等容易积聚灰尘的地方，也要定期清洁；与宠物亲密接触后及时洗手。如果家中养宠，且近期出现耳痒、耳鸣、耳道异物感或蚁行感，就诊时要主动向医生说明养宠情况，有助于医生更准确地判断病因。\n\n　　通讯员 陈绍静 胡晓蕾\n\n　　扬子晚报/紫牛新闻记者 许倩倩 【编辑:王琴】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfc6f9347b7","title":"小松塔变身文创 河北围场“塞罕手作”出圈","url":"https://www.chinanews.com/cul/shipin/2026/11-19/news1075446.shtml","summary":"立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔，如今成了抢手货。","summary_short":"立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔，如今成了抢手货。","digest":"立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔…","points":["立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔，如今成了抢手货","塞罕坝务林人李宝华隔几天就要进山捡一批松塔，他与社区创作小组成员一起，通过修剪、蒸煮、清洗…","2026年初，围场满族蒙古族自治县赛罕社区推出银发文创品牌“塞罕手作”…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T13:49:54+08:00","size":1,"keywords":[],"body":"立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔，如今成了抢手货。塞罕坝务林人李宝华隔几天就要进山捡一批松塔，他与社区创作小组成员一起，通过修剪、蒸煮、清洗、上色、粘贴等工序，把松塔制成松塔创意画。\n\n2026年初，围场满族蒙古族自治县赛罕社区推出银发文创品牌“塞罕手作”，开启“银龄+青年”跨代协作新模式：年轻人负责构思创意，老年人负责动手制作，产品从松塔创意画延伸到冰箱贴、车载挂件、木质摆件等。团队还用短视频、直播等方式讲述松塔背后的塞罕坝故事，让老手艺借助新创意、新传播走进更多人的视野。\n\n目前，该项目已吸纳76名居民常态化参与，制作各类手工艺品数百件，有效拓宽了居民增收渠道。下一步，社区将拓展线上线下销售渠道，把“塞罕手作”打造成围场特色文创品牌，让塞罕坝故事通过手工艺品走出大山。(邢璐 赵蕊 视频来源：围场县委宣传部)","image":"","video":"https://v-oss.cnsimg.net/glob/2026/11/19/bfe2a82b-2e89-487c-ac41-bdc186857080.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf69536bec3","title":"APEC: CE John Lee meets press; HK-Chile working holiday","url":"https://news.tvb.com/tc/1207225-APECCEJohnLeemeetspressHKChileworkingholiday","summary":"[13:30]Chief Executive John Lee meets the press at APEC in Shenzhen.He says Hong Kong contributes to…","summary_short":"[13:30]Chief Executive John Lee meets the press at APEC in S…","digest":"[13:30]Chief Executive John Lee meets the…","points":["Chief Executive John Lee meets the press at AP…","The city leader will meet with the Peruvian Pr…","Noting that the city has fielded the largest d…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T13:32:00+08:00","size":1,"keywords":["APEC","APEC Summit","APEC 2026","APEC China Year"],"body":"[13:30]\n\nChief Executive John Lee meets the press at APEC in Shenzhen.\n\nHe says Hong Kong contributes to its strengths and fully supports the nation in hosting a successful APEC meeting as China is hosting APEC for the third time and this year marks the APEC China Year. He says the city will work to advance Asia-Pacific cooperation, deepen collaboration and promote high-quality development within the bloc, with a view to achieving forward-looking outcomes for APEC member economies.\n\n[13:38]\n\nHong Kong is launching its first-ever Working Holiday scheme with Chile, expanding opportunities for young people to experience life and work in Latin America. The scheme offers a one-year visa, broadening horizons and strengthening exchanges between Hong Kong and Chile.\n\n[13:40]\n\nThe city leader will meet with the Peruvian President to conduct bilateral talks.\n\n[13:46]\n\nNoting that the city has fielded the largest delegation ever to APEC, CE John Lee says, \"We should take an active role in assisting our country to successully host this year's APEC.\"","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026fnYl
