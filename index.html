唐韋琪、鄧英敏等熟悉面孔。","summary_short":"現年65歲的前TVB金牌司儀盧敏儀，日前與導演丈夫孫敬安一同出席圈中好友飯局，同場還有唐韋琪、鄧英敏等熟悉面孔。","digest":"現年65歲的前TVB金牌司儀盧敏儀，日前與導演丈夫孫敬安一同出席圈中好友飯局…","points":["現年65歲的前TVB金牌司儀盧敏儀，日前與導演丈夫孫敬安一同出席圈中好友飯局…","從友人分享的合照中可見，坐在左下方的盧敏儀神態從容，丈夫孫敬安則站在其身後默默陪伴…","盧敏儀與孫敬安自1997年結婚至今已接近30年，多年來一直形影不離，是圈中出名的模範夫婦"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T09:00:00+08:00","size":1,"keywords":[],"body":"現年65歲的前TVB金牌司儀盧敏儀，日前與導演丈夫孫敬安一同出席圈中好友飯局，同場還有唐韋琪、鄧英敏等熟悉面孔。從友人分享的合照中可見，坐在左下方的盧敏儀神態從容，丈夫孫敬安則站在其身後默默陪伴，兩人表現恩愛。盧敏儀與孫敬安自1997年結婚至今已接近30年，多年來一直形影不離，是圈中出名的模範夫婦。\n盧敏儀笑談孫敬安日常相處\n兩人在2017年大搞結婚20周年派對時，盧敏儀曾公開感謝丈夫的愛護。她透露當時做體檢時懷疑患乳癌，孫敬安因擔心她而抱著她落淚；幸好後來找專家再抽組織檢驗證實無大礙，孫敬安又喜極而泣。盧敏儀坦言自己性格有時比較任性，但這20年間反而是丈夫主動為她改變，是一位好老公。談到夫妻日常，盧敏儀近年受訪時自認是個沉悶的太太，放假只想留在家中放空腦袋，不想辛苦執拾行李旅行。孫敬安則在一旁笑著投訴，指太太連去旅行或看電影都不肯，老夫老妻的鬥嘴十分溫馨。\n相關閱讀：《勁歌金曲》元祖級主持盧敏儀罕現身 轉行做律師多次為明星打官司 極關心李龍基未婚妻案情\n盧敏儀轉行做大律師曾為鍾鎮濤辯護\n盧敏儀讀中學時因主持《少年警訊》展露口才，曾獲警務處長頒發嘉許狀。入行後她深受無綫重用，不僅是《勁歌金曲》第一代主持，更屢次與鍾保羅合作主持大型節目。1997年婚後，她決定淡出娛樂圈重返校園，先後完成法律學士及法律碩士課程，並成為著名資深大律師清洪的徒弟。轉行大律師後，她多次為曾志偉、張慧雯等圈中人提供法律支援。2011年，鍾鎮濤與前妻章小蕙胞妹章小婉發生衝突而被控，當時便是由盧敏儀代表辯護，最終協助鍾鎮濤獲判無罪。\n相關閱讀：EYT好友會丨盧敏儀拒回應蔡楓華入紙紅館：盡在不言中 余慕蓮精靈現身自爆氣管不順有點咳嗽\n《勁歌金曲》元祖級主持蔡楓華獲平反：","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3d30652ceb","title":"主婦必看！洗潔精見底「加水」還能用嗎？花王警告：做錯一步等於無洗過 附清潔貼士","url":"https://www.stheadline.com/food-safety/3638186/主婦必看洗潔精見底加水還能用嗎花王警告做錯一步等於無洗過-附清潔貼士","summary":"洗潔精每天洗碗都會派上用場，隨著用量漸減，當快要見底時，有些人或許會習慣加點水進去、搖一搖繼續用。","summary_short":"洗潔精每天洗碗都會派上用場，隨著用量漸減，當快要見底時，有些人或許會習慣加點水進去、搖一搖繼續用。","digest":"洗潔精每天洗碗都會派上用場，隨著用量漸減，當快要見底時，有些人或許會習慣加點水進去…","points":["洗潔精每天洗碗都會派上用場，隨著用量漸減，當快要見底時，有些人或許會習慣加點水進去…","雖然這樣做看似節省一點，但背後的衞生狀況與清潔效果卻讓人不放心","由於洗潔精在出廠時，其去油與清潔效果都是在「原液建議用量」下經過嚴格測試與配方設計的…"],"section":"生活","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:59:05+08:00","size":1,"keywords":[],"body":"洗潔精每天洗碗都會派上用場，隨著用量漸減，當快要見底時，有些人或許會習慣加點水進去、搖一搖繼續用。雖然這樣做看似節省一點，但背後的衞生狀況與清潔效果卻讓人不放心。到底洗潔精見底加水稀釋還能用嗎？有日媒特別邀請專家來為大家解答這個問題。\n主婦必看！洗潔精見底加水稀釋還能用嗎？\n根據日媒《grapee.jp》報導，清潔洗劑品牌「花王」明確指出：在清洗餐具或廚房用具時，不建議將洗碗精加水稀釋使用。\n【同場加映】洗潔精推介｜日本《LDK》評測14款人氣產品 4款獲A級 快乾/強效去油/溫和護手！\n花王表示，正確的用法是將適量（約1-2mL）的洗潔精倒在沾濕的海綿上，輕輕搓揉出泡沫後再使用。由於洗潔精在出廠時，其去油與清潔效果都是在「原液建議用量」下經過嚴格測試與配方設計的，一旦擅自加水稀釋，會導致濃度被稀釋，因而無法達到應有的清潔與去油效果。\n加水稀釋洗潔精的2大隱患\n「花王株式會社」指，除了洗不乾淨之外，將稀釋後的洗潔精長時間存放於瓶內，還可能導致變質，加水稀釋反而會失去原本的效能，將洗潔精加水稀釋還伴隨著以下隱患：\n加水稀釋洗潔精的2大隱患\n 洗劑容易變質：市售的洗潔精瓶內通常添加了適量的防腐劑，以確保在未開封或正常使用下的保存期限。然而，一旦加入自來水，不僅會破壞原本的化學平衡與防腐成分濃度，若將稀釋後的液體長時間存放於瓶內，更容易導致洗劑變質、發臭。\n 細菌滋生：自來水中並非無菌，且浴室或廚房周遭環境潮濕。當水進入洗潔精瓶後，若放置過久，反而容易成為細菌、黴菌（如綠膿桿菌等）滋生的溫床。原本為了清潔餐具而使用的洗潔精，若帶有大量細菌，洗碗時反而可能造成二次汙染，對家人的衛生健康帶來隱憂。\n資料來源：《grapee.jp》\n延伸閱讀：初級大人必學！臨時沒有洗衣液點算好？專家教用3大家居好物應急 天然除臭去漬首選這款","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce4e418f13f","title":"南北方多地气温将陆续触底创新低 明起中东部进入降水间歇期","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734469.shtml","summary":"中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低，多地气温将陆续降至近期低点，并大范围创下立秋后新低。","summary_short":"中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低，多地气温将陆续降至近期低点…","digest":"中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束…","points":["中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低…","中东部地区降水将减少减弱，进入一段降水间歇期","23日前后，随着暖湿气流增强，江南、华南等地又将迎来一轮降水天气过程"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:46:32+08:00","size":1,"keywords":[],"body":"中国天气网讯 今明天(11月19日至20日)，冷空气影响将趋于结束，但中东部地区气温仍较低，多地气温将陆续降至近期低点，并大范围创下立秋后新低。与此同时，中东部地区降水将减少减弱，进入一段降水间歇期。23日前后，随着暖湿气流增强，江南、华南等地又将迎来一轮降水天气过程。\n\n　　寒潮东移南下 中东部气温将陆续触底\n\n　　昨天，寒潮继续南下，中东部大部出现大风降温天气。监测显示，内蒙古中东部、东北地区中南部、华北、黄淮及青海南部、西藏等地出现6至8级阵风，局地11级以上。今早6时较昨天同时次，黄淮、江淮、江汉、江南中东部、华南中西部等地部分地区出现6至10℃，局地12℃以上降温。\n\n　　今明天，冷空气影响将趋于结束，但中东部地区气温仍较低。其中明天早晨，最低气温0°C线将南压至河南北部至苏皖北部一带。\n\n　　受冷空气影响，南北方多地气温将陆续降至近期低点，并大范围创立秋后新低。沈阳今天最高气温将是下半年首次跌至0℃，济南明天早晨最低气温也将是下半年首次跌破冰点。这次冷空气过后，北方有望全面入冬，而长江中下游一带也将会有短暂的冬日体验。\n\n　　对于华南来说，由于前期气温显著偏高，这轮降温效果会十分明显。大城市中，广州、南宁最高气温将从前期的30℃上下，下滑至不足20℃，其中南宁今天最高气温仅有17℃，秋凉明显。\n\n　　此外，今天冷空气在东移南下过程中，由于地面气压梯度较大，加上高空动量下传，东北、华北等地仍将有大风天气。午后阵风尤其强劲，阵风可达7至9级，风寒效应明显，提醒公众外出需注意防风保暖。\n\n　　中东部进入降水间歇期 23日前后南方再迎降水过程\n\n　　随着冷空气东移南下，中东部地区的降水迅速向东向南收缩。昨天，内蒙古中东部、黑龙江、吉林东部、河北北部等地出现小到中雪或雨夹雪；云南南部、广西中南部、广东中南部、福建东北部等地出现分散性中到大雨，云南西双版纳局地暴雨。\n\n　　今天，东北地区的降雪和南方的降雨都会有所减少。中央气象台预计，今天，内蒙古中部、黑龙江中东部、吉林东部等地部分地区有小到中雪或雨夹雪，其中，黑龙江东北部局地有大雪。西南地区南部、华南大部、台湾岛等地部分地区有小到中雨，其中，云南南部等地部分地区有大雨。\n\n　　明后两天，我国大部地区将进入降水间歇期，天气以晴为主，并且在干燥偏北气流的影响下，空气相对湿度下降，南方的干燥程度也会加大。\n\n　　中央气象台预计，20日，内蒙古中部、黑龙江东部、山东半岛东北部等地部分地区有小到中雪或雨夹雪，其中，山东半岛等地部分地区有大雪。云南南部、华南中南部、台湾岛等地部分地区有小雨，其中，云南南部和中部等地部分地区有中雨。\n\n　　21日，内蒙古东北部、山东半岛东北部等地部分地区有小雪。云南中南部、贵州西部等地部分地区有小雨或阵雨。\n\n　　展望后期，23日前后，随着暖湿气流加强，配合南下的冷空气，南方又会迎来新一轮降水过程。届时，江南、华南等地将有中到大雨，提醒公众密切关注临近预报，提前做好防范措施。\n\n 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b0ad7dfa6","title":"52.2%受访者表示为AI花过钱 知识处理、多媒体创作、办公学习是主要用途","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734467.shtml","summary":"当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。","summary_short":"当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。","digest":"当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费","points":["当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费","上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者…","自从使用AI办公后，来自深圳的35岁黄鹂觉得自己的工作效率有了很大提高…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:41:30+08:00","size":1,"keywords":[],"body":"当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者参与的调查显示，超半数(52.2%)受访者表示为AI花过钱，知识处理(59.1%)、多媒体创作(53.3%)、办公学习(44.1%)是受访者常用AI做的事。\r\n\n　　自从使用AI办公后，来自深圳的35岁黄鹂觉得自己的工作效率有了很大提高，原来可能要做一整天的方案，如今在AI的加持下两到三小时就能完成。在她看来，为AI付费是对自己的一种“投资”。“如果你愿意付费深度学习、使用AI工具，它能提高你的工作效率，也能提升个人能力。”\n\n　　调查显示，超半数(52.2%)受访者为AI花过钱。交叉分析发现，受访90后的这一比例更高，为61.4%。然后是00后(58.3%)、95后(53.6%)。男性受访者(53.2%)的这一比例高于女性受访者(51.4%)。从地区来看，一线城市受访者的这一比例更高，为58.1%，然后是二线城市(51.7%)、三四线城市(51.1%)。\n\n　　来自上海的在读研究生王明远，从今年8月底开始为AI付费。“感觉学习效率提升了，对求职也有很大帮助。”\n\n　　王明远表示，互联网时代获取知识容易，但缺少一个可以随时提问的导师，“AI可以充当这个角色。”从课程知识学习、作业指导到简历项目设计，他用AI构建了一个24小时在线的私人导师。“我有很多问题可以问AI，它能指导我的成长。”\n\n　　来自深圳的37岁林子侨是一名游戏行业的从业者，最近他正和朋友一起创作一部AI短剧。为了达到更好的艺术效果，今年9月，他果断为AI掏出钱包。“我们有分工，朋友是编剧，用AI做视频我是自学的。”\n\n　　林子侨表示，免费模型在画面精度和语义理解上不够好，每次都要花大量时间后期修补。如今，他每月在续卡、买积分上的花费在2000元左右，调用的模型也越来越高级。“AI生成视频的成本虽有些高，但比自己拍片子的成本低。”在他看来，这笔钱买的是把创意直接变成画面的能力。\n\n　　大家会为什么样的AI服务付费？数据显示，49.2%的受访者会为更聪明的模型付费；48.4%的受访者会为多模态AI付费，生图、视频、语音更好用；46.7%的受访者是为了省时间，写稿、做表、出方案更快。其他还有：不卡额度，额度丰富够调用(28.2%)；懒得折腾，一个会员全平台通吃最省心(20.6%)等。\n\n　　90后原田在苏州做生产管理，下班后她还有另一个身份——短视频博主。她用AI生成脚本、画面、配音、剪辑，整个流程几乎不需要人工介入。“以前我试着学过剪辑，学着学着就放弃了，现在有想法直接就能成片。以前得几个人干的活，现在我下班回来一个人就做完了。”\n\n　　之前原田一直用免费版的AI工具，但发现废片率高、画质不够清晰，为AI付费之后，她明显感觉“快”了，并且能调用更好的模型。“现在几分钟就能生成能用的素材。”\n\n　　大家平时用AI做什么？调查中，查资料/翻译/解题/写代码等知识处理(59.1%)、生图/修图/剪视频/做AI短片等多媒体创作(53.3%)、写稿/周报/PPT/邮件等办公学习产出(44.1%)位列前三。其他还有：写小说/写歌/写段子/等文艺脑洞(27.7%)；闲聊/情感陪伴/角色扮演等日常互动(27.1%)；投喂资料做个人知识库/智能体训练(15.5%)等。\n\n　　来自河南郑州的85后网店主张龙，把AI当成了自己的“员工”，用AI生图、写文案、翻译，AI的出现让他解锁了很多技能。他的电脑里，整齐排列着一周的社交媒体发布包——文案、配图、标签全部由AI生成，他只需手动上传。“像美工、运营、剪辑、拍摄，以前至少需要一个团队，现在我一个人加AI就能搞定。”张龙说。\n\n　　受访者中，05后占3.2%，00后占22.6%，95后占20.7%，90后占25.4%，85后占13.2%，80后占11.2%，其他占3.7%。男性占47.6%，女性占52.4%。来自一线城市的占38.1%，二线城市的占35.7%，三四线城市的占19.8%，县城或城镇的占5.1%，农村的占1.3%。\n\n　　(应受访者要求，张龙为化名)\n\n　　中青报·中青网记者 吴欣宇 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c258f5e1aad","title":"“考古中国”成果上新 揭开哪些历史谜题？","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734460.shtml","summary":"国家文物局昨天(18日)发布了长江文明溯源最新考古成果，分别是四川遂宁桃花河遗址、浙江杭州良渚反山遗址、江西九江荞麦岭遗址群岭头上遗址、湖北云梦老虎墩墓地。","summary_short":"国家文物局昨天(18日)发布了长江文明溯源最新考古成果，分别是四川遂宁桃花河遗址、浙江杭州良渚反山遗址…","digest":"国家文物局昨天(18日)发布了长江文明溯源最新考古成果，分别是四川遂宁桃花河遗址…","points":["国家文物局昨天(18日)发布了长江文明溯源最新考古成果，分别是四川遂宁桃花河遗址…","从30万年前古人类生活营地，到五千年前良渚高等级礼仪院落，再到夏商周文化交融聚落…","又为实证中华文明多元一体带来哪些全新线索"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:19:59+08:00","size":1,"keywords":[],"body":"国家文物局昨天(18日)发布了长江文明溯源最新考古成果，分别是四川遂宁桃花河遗址、浙江杭州良渚反山遗址、江西九江荞麦岭遗址群岭头上遗址、湖北云梦老虎墩墓地。\n\n　　从30万年前古人类生活营地，到五千年前良渚高等级礼仪院落，再到夏商周文化交融聚落、秦汉简牍出土墓地，这些出土遗迹、石器、简牍究竟揭开了哪些历史谜题？又为实证中华文明多元一体带来哪些全新线索？\n\n　　四川遂宁桃花河遗址\n\n　　四川遂宁的桃花河遗址坐落在涪江中上游，包含鄢家沟、田家湾两处地点，总面积大约19万平方米，主体年代距今30万年到5万年。考古人员在这里发掘了1.3万余件石制品以及179件动物化石，还发现大量碎屑和人工搬运砾石，找到了砾石铺设活动面、石器集中贮藏区、石器加工场等遗迹。四川大学历史文化学院院长吕红亮说，桃花河遗址是长江流域迄今发现遗物最密集的中更新世旷野中心营地，极具特色的定型化大石片砍斫器工业、复杂的营地组织形态与空间规划能力，对研究全球早期人类演化具有重要意义。\r\n\n　　四川大学历史文化学院院长 吕红亮：桃花河遗址的时间节点非常有意思，30万年到5万年，这是在古人类研究里面非常敏感的一个时间段。另外它出土的石器非常有特点，而且密度很高，这在全世界都是比较罕见的。第三是它发现了一些可能的人类活动遗迹，这也是比较少见的。我们以前发现的人类活动遗迹相对来说都是旧石器时代晚期的，它早的这么一个时代，对全世界旧石器的考古研究来说是一个新的纪录。\n\n　　浙江杭州良渚反山遗址\n\n　　浙江杭州良渚反山遗址是已知良渚文化等级最高的贵族墓地。2024年开启的系统性发掘带来重要突破：考古工作者发现反山不只是一处单纯的墓葬土墩，它以土墩为中心，外围建有院墙，构成一座略呈长方形的独立院落，围护面积约2.5万平方米。浙江省文物考古研究所良渚遗址考古项目负责人王宁远介绍，院墙、台基及建筑遗迹的发现，揭示了墓葬区、礼仪活动空间与外围围护设施相结合的整体布局，为探讨良渚古国王权的礼仪性表达和制度化发展，提供了新的考古证据。\n\n　　浙江省文物考古研究所良渚遗址考古项目负责人 王宁远：良渚古城是不同来源的社群聚合而成的地缘社会，意味着社会组织和制度的全新建构。反山的发现，从聚落结构角度为这一变革提供了生动的例证：反山院墙以及东部建筑遗迹的发现，突破反山作为单纯土墩墓地的传统认识，表示当时已经形成与丧葬相关的稳定的规制。成组院落或分别对应不同的人群，为研究良渚古城社会组织和人群关系提供重要线索。反山王陵与土垄的结构性关联，证实了良渚古城与水利系统是统一规划建设的整体设施，它是社会权力、信仰与大型水利工程深度结合的物化体现。由此说明治水立国的东方文明理念，早在大禹治水传说之前一千年就已经在良渚地区成功实践。\n\n　　江西九江荞麦岭遗址群岭头上遗址\n\n　　江西九江的荞麦岭遗址群是一处大型先秦聚落遗址群，岭头上遗址是其中面积最大的墩台之一，总面积约6万平方米。考古在这里发现新石器时代晚期墓葬、玉石器加工遗存；也发现早商时期的居址、青铜冶炼遗存，出土坩埚、炉壁残块、铜渣、铜块等遗物。江西省文物考古研究院副研究馆员饶华松表示，这个遗址位于长江中下游的过渡地带，遗址内新石器时代晚期及早商时期的聚落文化因素多元，反映出长江中下游文化传播、互动交融频繁，揭示了中原与长江中游地区文化交流与资源开发控制的密切关系。\n\n　　江西省文物考古研究院副研究馆员 饶华松：荞麦岭遗址群岭头上遗址地处长江中游和下游与中原之间的地理关键节点，这里连接东西沟通南北，兼有多种文化因素，自新石器晚期直到商代的文化发展展现了显著的文化交汇的特征，既有皖、鄂、赣交界期的自身文化发展主线，也可见长江中游、下游文化的较强的影响。商代早期更是融入到中原文化的一体化浪潮中，是研究中原与南方长江中游和下游文化交流互动的难得材料，是认识中华文明多元进程的重要实证。\n\n　　湖北云梦老虎墩墓地\n\n　　湖北云梦老虎墩墓地属于战国晚期至西汉初期墓地。2026年考古发掘一共清理秦汉墓葬113座，其中40座是饱水墓葬，出土漆木、陶器、金属、玉器以及简牍等各类随葬品1200余件(套)。北京大学中国古代史研究中心教授朱凤瀚表示，老虎墩墓地是目前出土秦简最集中的墓地，所获材料涉及政治、军事、文学、医学、民俗学、艺术等领域，为研究秦汉大一统王朝历史进程以及基层社会治理模式提供了最新史料。\n\n　　北京大学中国古代史研究中心教授 朱凤瀚：从出土器物来看，它很好地体现了秦文化和楚文化的融合。同一座墓葬当中既有秦式器，还有楚式器物，很好地体现了秦、楚两种文化的交融。从人群角度来说，这里也见证了秦汉之际人群的融合，一部分秦国的官吏、士兵南下，这个墓地可以说是中华民族形成的一个缩影，从墓葬制度、随葬器物的制度、形制上很好地体现了这一点。\n\n　　从几十万年前古人类营建的旷野中心营地，到良渚时期统一规划的都邑、水利、高等级墓葬体系，再到夏商阶段南北之间的文化往来、资源互动，直至秦汉大一统之下地域文化交融共生，长江流域这四项考古成果，进一步补全了中华文明漫长的发展链条。接下来，考古团队还将开展多学科综合研究，持续挖掘出土遗迹遗物背后蕴藏的历史信息，为实证中华文明百万年人类史、五千多年文明史提供更多实物支撑。\n\n　　监制丨樊新征\n\n　　记者丨韩萌 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c578992540a","title":"词元作为数字商品进入大众消费 专家建议：统一计量口径守护AI消费权益","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734457.shtml","summary":"今年“双十一”，Token首次以独立品类摆上电商货架，“囤Token”成为热词。","summary_short":"今年“双十一”，Token首次以独立品类摆上电商货架，“囤Token”成为热词。","digest":"今年“双十一”，Token首次以独立品类摆上电商货架，“囤Token”成为热词","points":["今年“双十一”，Token首次以独立品类摆上电商货架，“囤Token”成为热词","Token中文名为“词元”，是大模型处理文本的最小单位，用AI写文案、做PPT…","厂商按量计费，输入输出都计费，但对普通用户来说，这个单位几乎不可感知…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:05:42+08:00","size":1,"keywords":[],"body":"今年“双十一”，Token首次以独立品类摆上电商货架，“囤Token”成为热词。\n\n　　Token中文名为“词元”，是大模型处理文本的最小单位，用AI写文案、做PPT、生成图片视频都在消耗它。厂商按量计费，输入输出都计费，但对普通用户来说，这个单位几乎不可感知：100万Token值多少钱，很难换算。于是不少平台把它“翻译”成积分或会员。\n\n　　有业内人士指出，词元作为数字商品进入大众消费后，仍面临计量、定价、安全、合规等多重课题：同一段文字在不同模型中消耗的词元可能相差两至五成，计费规则不一、套餐难以换算、未用完的额度如何处理、发生争议找谁，相关规则仍待厘清。\n\n　　围绕上述问题，《法治日报》记者采访了西南政法大学民商法学院教授张力和中国人民大学法学院副教授、法律科技与社会治理实验室副主任黄尹旭。\r\n\n　　囤词元系预付式消费\n\n　　记者：消费者“囤”的Token，买到的究竟是什么？\n\n　　张力：从法律性质看，单个Token不构成独立的物。Token套餐是经营者以预收款方式提供的数字服务，属于预付式消费。消费者预先支付价款，取得按Token计量的服务额度，未使用部分对应尚未消费的预付款，属于消费者的财产利益。\n\n　　记者：购买Token后，页面往往只显示“剩余额度”“剩余次数”，一次用掉多少、怎么扣费看不明白。账单看不懂、对不上，该找谁？\n\n　　张力：Token并非统一、中立的计量单位，而由各服务商自定义。消费者按Token付费，却无法预先确知某次使用消耗多少，也难以仅凭数量在不同套餐间比较。名义价格与实际消耗可能不对应，这正是“看不懂账”的根源。\n\n　　计量单位、计费口径、单价、单次消耗与余额变动，均属与消费者有重大利害关系的信息。经营者仅显示概括余额而不提供可供核验的明细，属于信息披露不充分。\n\n　　消费者首先可要求服务商提供用量明细。服务商拒绝或无法说明的，消费者可向市场监管部门投诉，或申请仲裁、提起诉讼。依据《最高人民法院关于民事诉讼证据的若干规定》，一方当事人控制证据无正当理由拒不提交，对待证事实负有举证责任的当事人主张该证据的内容不利于控制人的，人民法院可以认定该主张成立。服务商不提供明细，可能承担不利后果。\n\n　　黄尹旭：过去Token服务面向开发者，用量查询嵌入技术后台是行业惯例；转向大众零售后，数据打通、账单通俗化改造都需要时间。目前多数消费者还需跳转服务商后台查看明细。账单存疑，可先找服务商核对，协商不成再向平台投诉。\n\n　　出现争议应如何维权\n\n　　记者：打开一个Token商品，页面通常是几档套餐：有按用量计价的单项包，也有标着“赠送额度”的组合套餐，不少还写着“限时有效”“未用完不退”。对于消费者来说，付款前需要留意哪些内容？\n\n　　张力：关于“赠送额度”，若赠送额度真实无偿，其未使用部分原则上不产生退款请求权；但若实为套餐定价组成部分、仅以赠送名义标示，则属于误导性价格标示，涉嫌违反价格欺诈禁止规定。\n\n　　关于“限时有效”，预付款设定有效期并非当然违法，但有效期条款属格式条款；期限明显过短，或到期后余额一律作废、不予延期或退还的，可能排除消费者主要权利，依据民法典第四百九十七条和消费者权益保护法第二十六条，该条款无效。\n\n　　关于“未用完不退”，尚未消费部分属消费者预付资金，经营者不能以格式条款一概排除返还请求权。任何情形下均不退还余额的条款效力存疑。消费者因经营者违约、停业解除合同的，仍有权请求退还剩余额度。\n\n　　记者：对于Token这种“看得见摸不着”的数字商品，平台和AI服务商应各自承担怎样的安全保障义务？\n\n　　黄尹旭：Token作为新型数字商品，其安全保障义务边界仍在法律与实践探索之中，很难用现有标准要求某一方承担无限责任，更务实的原则是“法定底线守牢，延伸责任逐步探索”。\n\n　　张力：AI服务商作为直接提供者，依据消费者权益保护法，应保证服务符合保障财产安全的要求：保障账户与额度安全、防止盗用，保障服务连续稳定、避免中断造成额度损失，保障计量准确并保存记录；同时，依据个人信息保护法、网络安全法、数据安全法，对输入内容承担数据安全义务并明示规则。\n\n　　关于平台责任，依据电子商务法和消费者权益保护法，需核验入驻主体信息，在发生争议时提供经营者真实名称、地址和联系方式；不能提供的，消费者可要求平台赔偿；平台作出更有利于消费者承诺的，应当履行；知道或应当知道服务商侵权而未采取必要措施的，依法承担连带责任。\n\n　　计量口径有待标准化\n\n　　记者：从长远看，要让Token真正成为“买得放心、用得明白”的消费品，最关键要建立哪些制度或标准？\n\n　　黄尹旭：平台和商户当下即可先行探索：在商品详情页显著位置展示计量规则、有效期、退款政策、明细查询方式，把用户协议里的关键内容摆到台面上。\n\n　　张力：一是计量口径标准化，用国家标准、行业标准或团体标准统一Token定义、分词规则与计费口径，使输入、输出、系统提示、缓存等项目口径一致、价格可比。\n\n　　二是强制信息披露，公示单价、口径、有效期与退款规则，提供可核验明细。\n\n　　三是预付款资金监管，对预收资金实行存管或担保，防范挪用、停业失联造成余额损失。\n\n　　四是格式条款效力审查，明确“过期作废”“概不退换”等条款边界。\n\n　　五是平台主体责任，明确资质审核、信息披露与争议处置义务。\n\n　　六是第三方计量核验，建立符合性评价机制，为举证和执法提供技术支撑。Token计量不属于计量法调整的法定计量范畴，不能靠计量器具强制检定解决，但可借各类标准统一分词规则与计费口径。\n\n　　记者：统一计量口径、引入第三方核验，落到普通消费者身上，能解决什么问题？\n\n　　张力：这一步解决两个问题。其一，可验证性。口径公开、明细可获取后，消费者或其委托的第三方可自行复核账单，争议处理不再完全依赖经营者单方陈述。\n\n　　其二，可追责性。第三方核验通过认证与持续审计，将虚标额度转化为可识别、可追究的违约或违法事实，提高违法成本，为索赔提供证据基础。第三方核验不能绝对消除虚标，其作用在于降低信息不对称，而非替代监管追责。\n\n　　黄尹旭：统一计量口径，本质是给消费者一把通用的“公平秤”，也是以规则守护AI消费权益的体现。如买电用“度”、买流量用“GB”，无需逐一换算Token，比价对账才有据。第三方核验针对商家记账、消费者无从核验的信息不对称问题，既能约束商家、减少虚标多扣，也可提供中立维权依据。(记者 赵丽) 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c594845c646","title":"民宿烤全羊被指分量不足 四川平武市场监管部门立案调查","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734454.shtml","summary":"中新网11月19日电 据“平武发布”微信公众号消息，四川省绵阳市平武县市场监督管理局18日发布情况通报，2026年11月17日，有网友反映平武县某民宿提供的烤全羊分量不足，引发网民关注。","summary_short":"中新网11月19日电 据“平武发布”微信公众号消息，四川省绵阳市平武县市场监督管理局18日发布情况通报…","digest":"据“平武发布”微信公众号消息，四川省绵阳市平武县市场监督管理局18日发布情况通报…","points":["中新网11月19日电 据“平武发布”微信公众号消息…","对此，平武县市场监督管理局高度重视，成立工作组第一时间开展核查处置","11月17日下午，平武县市场监督管理局收到该网络反映，及时组织双方开展调解…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:02:24+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据“平武发布”微信公众号消息，四川省绵阳市平武县市场监督管理局18日发布情况通报，2026年11月17日，有网友反映平武县某民宿提供的烤全羊分量不足，引发网民关注。对此，平武县市场监督管理局高度重视，成立工作组第一时间开展核查处置。现将有关情况通报如下。\n\n　　一、事件概况\n\n　　2026年11月11日，游客一行在该民宿食宿，通过微信预订烤全羊一只。用餐时，游客认为“烤羊有点小、肉太少、全是骨架”。11月17日下午，平武县市场监督管理局收到该网络反映，及时组织双方开展调解，双方已就赔付事宜达成一致意见。\n\n　　二、核查情况\n\n　　11月17至18日，平武县市场监督管理局执法人员在涉事民宿开展实地调查核实，并邀请人大代表、政协委员、游客代表到场全程监督。\n\n　　经现场核实并询问双方当事人，当日经营者未留存该烤全羊称重凭证，仅以口头方式和消费者沟通重量，调查时距离事发已间隔6日，现有证据难以核实实际重量，平武县市场监督管理局以视频作为参考，疑似存在缺斤少两问题。同时，经现场调查发现，该民宿店内未公示菜品价格，存在“未明码标价”问题。\n\n　　经查，该民宿涉嫌违反《中华人民共和国消费者权益保护法》《中华人民共和国价格法》相关规定。平武县市场监督管理局已对该民宿立案调查，并将根据后续调查情况依法依规严肃处理，坚决维护市场经营秩序，切实保障消费者合法权益。\n\n图片来源：“平武发布”微信公众号截图\n\n 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c009e3e2ab1","title":"天氣｜天文台指今早多處地區氣溫 較昨日低約三至四度","url":"https://news.tvb.com/tc/1207173-天氣天文台指今早多處地區氣溫較昨日低約三至四度","summary":"受強烈東北季候風影響，天文台指本港今早多處地區氣溫，較昨日低約三至四度，今日日間氣溫約22度，到晚上市區氣溫下降至，午夜最低約18度，新界再低兩、三度。天文台科學主任謝威寶指出：「預計之後幾天都繼續受到強烈東北季候風影響，天氣仍然相當清涼。","summary_short":"受強烈東北季候風影響，天文台指本港今早多處地區氣溫，較昨日低約三至四度，今日日間氣溫約22度，到晚上市區氣溫下降至…","digest":"受強烈東北季候風影響，天文台指本港今早多處地區氣溫，較昨日低約三至四度…","points":["受強烈東北季候風影響，天文台指本港今早多處地區氣溫，較昨日低約三至四度…","天文台科學主任謝威寶指出：「預計之後幾天都繼續受到強烈東北季候風影響，天氣仍然相當清涼","展望明天有幾陣雨，氣溫會進一步下降至市區最低大約15度，新界再低兩、三度"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T08:02+08:00","size":1,"keywords":[],"body":"受強烈東北季候風影響，天文台指本港今早多處地區氣溫，較昨日低約三至四度，今日日間氣溫約22度，到晚上市區氣溫下降至，午夜最低約18度，新界再低兩、三度。\n\n天文台科學主任謝威寶指出：「預計之後幾天都繼續受到強烈東北季候風影響，天氣仍然相當清涼。展望明天有幾陣雨，氣溫會進一步下降至市區最低大約15度，新界再低兩、三度。」\n\n天文台預測，周六早上仍然相當清涼，隨後一、兩日氣溫稍為回升。而另一股東北季候風，會在下周中期影響華南，該區氣溫將再度下降及有幾陣雨。天文台提醒市民，特別是進行戶外活動人士，要留意天氣變化及注意保暖，並關顧長者及慢性病患者。","image":"https://pro-vod-cdn.tvb.com/70a53da3e1d4480c850d7f6f2178d272/snapshots/7dd87764891a4df8bde873ff6419cb86-00006.jpg","video":"https://pro-vod-cdn.tvb.com/70a53da3e1d4480c850d7f6f2178d272/5ae53e5014b34127b85d59bb93f69a9d-9dee20743bcf5a2e56842c4a38cbf5fd-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/70a53da3e1d4480c850d7f6f2178d272/snapshots/7dd87764891a4df8bde873ff6419cb86-00006.jpg","lang":"zh-Hant"},{"id":"c82ae9765ea","title":"Token抢手？超半数受访者表示没必要囤","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734453.shtml","summary":"Token抢手？","summary_short":"Token抢手？","digest":"Token抢手？超半数受访者表示没必要囤","points":["为AI付费，58.6%受访者感觉额度算不明白","今年“双十一”，直播间里出现了一个新鲜货——Token(词元)","今年“双十一”，来自河南郑州的85后网店主张龙趁着某AI平台做活动，买了一些积分"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T07:46:09+08:00","size":1,"keywords":[],"body":"Token抢手？超半数受访者表示没必要囤\n\n　　为AI付费，58.6%受访者感觉额度算不明白\n\n　　今年“双十一”，直播间里出现了一个新鲜货——Token(词元)。面对消费新事物，大家有哪些看法？\n\n　　上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者参与的调查显示，今年“双十一”，近两成(18.9%)受访者下单了AI会员、Token月卡或算力包(含体验卡)，超半数(53.5%)受访者表示随用随充，没必要囤货。\r\n\n　　当Token入场“双十一”：是果断下单，还是谨慎观望？\n\n　　今年“双十一”，来自河南郑州的85后网店主张龙趁着某AI平台做活动，买了一些积分。如今，在网店的日常运营上，张龙把美工、运营、剪辑好几个人干的活都交给了AI。他算了笔账，以前请团队每月最少一万多元支出，现在AI全包，一个月几千元就能搞定，“以前我不可能以这么低的成本做到”。\n\n　　数据显示，今年“双十一”首日，某电商平台Token品类成交额环比增长450%；在某主播直播间，半小时卖出10万份AI辅助类办公会员月卡，累计约两万亿Token。\n\n　　本次调查中，今年“双十一”，近两成(18.9%)受访者下单了AI会员、Token月卡或算力包(含体验卡)。32.5%的受访者虽没下单，但表示“考虑过”。交叉分析发现，受访05后下单了的比例更高，为38.1%，然后是00后(26.2%)、90后(19.2%)。\n\n　　张龙关注到，今年“双十一”有直播间卖Token，但他没有在直播间里下单，他有一些顾虑：“每家代理的API(指应用程序编程接口‌，是软件系统之间沟通的桥梁，定义了不同程序如何相互调用功能、交换数据的规则与协议——记者注)不一样，在非官方渠道买Token，有可能要换API接口，输入、输出多少钱都不一样。”\n\n　　来自苏州的90后原田是一名短视频博主，每天大量使用AI生成视频和图片，但面对“双十一”囤Token这件事，她保持观望态度。“大模型几个月就更迭一批，现在囤一堆，过一阵可能就不值钱了。”\n\n　　在原田看来，按量付费是最理智的选择，“用多少扣多少，囤月卡我怕用不完，过期就作废了。”\n\n　　大家如何看待“双十一”囤Token的现象？超半数(53.5%)受访者表示随用随充，没必要囤货；24.4%的受访者觉得是“真刚需”，早囤早享受；17.7%的受访者认为是纯噱头，有些实际未必用得上；持有其他观点的受访者占4.4%。\n\n　　什么情况下大家会为AI续费\n\n　　来自上海的00后在读研究生王明远是一名为AI付费的资深用户，平时用AI助力学习、作业指导，以及一些项目的设计和实现。在付费使用过多款主流AI工具后他发现，目前国内的AI平台主要采取积分订阅制度，“用户花一定的钱，却可能搞不清享受到多少Token，信息对消费者不透明。”\n\n　　来自深圳的35岁黄鹂经常使用AI辅助办公。她发现，有时在调用模型生成图片和视频时，平台会在自己不知情的情况下消耗大量积分。“前几天给AI一份视频脚本，不是很复杂，结果视频还没生成完，就消耗了7万积分，相当于花了70多元。”更让黄鹂无奈的是，平台没有实时客服，只能提交工单等待反馈。\n\n　　你感觉现在AI工具收费存在哪些“坑”？调查中，58.6%的受访者觉得额度算不明白，Token、次数、时长混着来；48.4%的受访者表示一些AI工具实际表现与宣传有差距，性价比一般。其他还有：会员权益细分多种类型，需不断付费升级(42.1%)；退订流程不够便捷，自动续费提醒不够明显(32.4%)等。\n\n　　张龙也遇到过AI工具收费复杂，算不清楚的情况。他举例，调用同一模型，官方API和国内的代理商价格差异较大，“某AI模型官方10元钱可能一天就用完，通过代理商20元钱能用几天，收费不太统一”。\n\n　　原田也表示，现在为AI工具充值，有时额度算不明白，Token、次数、时长混在一块儿卖。但原田也表示，如今AI确实为她的工作和生活赋能了，如果效果显著，她仍愿意为AI付费。“我的想法很简单，这钱花出去能帮我省时间或能让我赚回来，那就值。”\n\n　　“在使用高峰期，付费用户优先，而且免费版一天只能生成几张图，付费后几乎感觉不到限制。”张龙是从今年2月份开始接触AI的，最早用AI给孩子批改作业，后来发现它是个不错的生产力，就开始给AI付费辅助办公。付费前后，他最大的感受是模型调用权限和多模态输入的差别。“以前做跨境电商，语言方面沟通不顺畅，现在AI帮我连接邮箱回复客户，这一套流程下来很颠覆我的认知。”\n\n　　如今，张龙把AI当成自己创业路上的“隐形合伙人”，并打算一直付费使用。“虽说我现在用AI还没有实打实的收益，但它成为了我创业路上的一把‘万能钥匙’。只要AI继续以较低成本帮我生成文案、配图、剪辑视频，这笔钱就花得值。”\n\n　　什么情况下受访者会给AI续费？数据显示，49.3%的受访者表示要比免费版强一大截，不卡不扯谎；45.7%的受访者觉得要是办公学习的好帮手，极大提升效率。其他还有：赶上促销够便宜的时候，薅到就是赚到(38.2%)；同事/同学都在用，跟着大家一起买(21.8%)等。\n\n　　受访者中，05后占3.2%，00后占22.6%，95后占20.7%，90后占25.4%，85后占13.2%，80后占11.2%，其他占3.7%。男性占47.6%，女性占52.4%。\n\n　　(应受访者要求，张龙为化名)\n\n　　中青报·中青网记者 吴欣宇 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8208cbf537","title":"雪假来了：特色假期如何“放”到心坎里","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734450.shtml","summary":"秋假还没结束，雪假也来了。","summary_short":"秋假还没结束，雪假也来了。","digest":"秋假还没结束，雪假也来了","points":["11月18日，河北省张家口市中小学迎来了首个雪假，不同学段错峰放假","吉林省、内蒙古呼伦贝尔、新疆阿勒泰也陆续公布2026年雪假安排","雪假主要针对义务教育阶段学生，部分地区明确，幼儿园、中职学校可参照执行"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T07:41:13+08:00","size":1,"keywords":[],"body":"秋假还没结束，雪假也来了。11月18日，河北省张家口市中小学迎来了首个雪假，不同学段错峰放假。此外，吉林省、内蒙古呼伦贝尔、新疆阿勒泰也陆续公布2026年雪假安排。\n\n　　根据各地安排，雪假多在12月，为3个工作日与周末自然连休，形成“3+2”或“2+3”的5天小长假。雪假主要针对义务教育阶段学生，部分地区明确，幼儿园、中职学校可参照执行。\n\n　　设立雪假，促进学生上冰上雪\n\n　　同样是雪假，各地的玩法却不一样。\r\n\n　　呼伦贝尔市要求，具备合格资质、规范运营的滑雪场，面向全市义务教育阶段学生提供每天3小时免费滑雪体验，包含全套雪具使用。冰雪资源不足的旗市区将加大体育馆、全民健身中心开放力度，免费提供旱地冰壶、陆地冰球等器材借用服务。\n\n　　东北师范大学教授杨卫安认为，雪假的价值，在于把冰雪从资源变成课程，让假期从学生休整变成个人成长。它是有组织、成体系的安排，填补了课堂内教学的实践短板。\n\n　　“雪假的核心不只是‘怎么玩’‘玩什么’，更重在‘如何系统性落地’。对学生来说，雪假不等于彻底告别课堂，而是要依托冰雪游玩实践，去户外体验，并感知冰雪文化。”中国传媒大学副教授柳帆说。\n\n　　沈阳体育学院教授董传升表示，这些年冰雪运动进校园，专业化与大众化相结合的冰雪运动赛事也不断出现。设立雪假，通过政府购买服务的形式，有利于促进中小学生上冰上雪。用免费体验的方式，激活家庭滑雪需求，促进冰雪资源优化配置，也补齐冰雪运动场地设施的短板。\n\n　　孩子有假，家长能陪，学校兜底\n\n　　2025年12月，吉林省首个雪假落地，当时为全省义务教育学校统一放假。效果立竿见影：雪假期间全省接待游客945万人次，出游总花费89亿元，同比分别增长119%和31%；酒店预订量暴涨147%，重点滑雪场亲子客群占比超过60%。\n\n　　“雪假为冰雪文旅创造了可深入接触的消费时段。”柳帆认为，雪假让本地及周边居民拥有充裕的错峰窗口，能够从容体验冰雪项目，实现从“打卡式游览”向沉浸式体验的转变。他表示，目前，雪假的实施区域主要集中于多雪地区，通过雪假可以释放冰雪出游需求，带动滑雪场、冰雪乐园、民宿、餐饮、文创产品等业态客流，拉长冰雪文旅消费链条。\n\n　　在吉林省首个雪假期间，热门雪场预约难、现场核验拥堵、瞬时客流集中等问题也随之出现。\n\n　　对此，2026年吉林省的雪假方案作出调整。雪假时间确定为每年12月1日至20日内，具体日期由各市(州)结合气象条件、教学进度、冰雪场地承载力和文旅接待能力统筹错峰安排。此外，今年雪假实现惠民升级，免费体验次数增加：学生免费滑雪滑冰从上一年的1次增加到3次，每次3小时；免费游览省内A级景区也从1次增加到3次。各县市区通过政府购买服务的方式承接，全省公共文博体育场馆面向中小学生免费延时开放。\n\n　　今年雪假期间，吉林省还鼓励各地各级机关企事业单位落实职工带薪休假制度，通过分段休假、错峰休假、调休等灵活方式，为有义务教育阶段子女的职工预留雪假休假窗口。\n\n　　尽管有这么多利好政策，家住吉林长春的张先生还是有些担忧。他和妻子在高校工作，雪假期间“肯定没法和孩子同步休假，可能还是和去年一样，带着孩子去单位”。\n\n　　针对家长带娃难题，新疆阿勒泰地区教育局要求，开展校内免费托管服务，针对雪假期间双职工家庭、留守儿童、困境家庭等不能参加研学的学生，各县(市)各学校开放自习室、图书馆、运动场馆等设施，提供免费托管服务。\n\n　　杨卫安建议，针对看护难和预约场地难等问题，学校可组织集体冰雪研学，统一预约场地，由教师、专业教练随队照护，无法陪同的家长可委托教练或亲属并签订委托书。在资源统筹上，对农村和偏远学校采取“送教下乡”、移动冰场、集中包车进雪场等方式，尽量把服务送到孩子身边；在安全保障上，统一购买运动意外险，配足专业教练与医护保障，建立预约调度机制防止扎堆。\n\n　　通过特色假期推动教育特色化发展\n\n　　近两年，各地陆续设立春假、秋假、雪假等特色假期。\n\n　　目前，有十余个省份的学校试点春秋假、雪假制度。在时间安排上，与清明、“五一”、中秋等法定假期“凑整”连放外，有些地方探索结合传统节日、地方风俗、气候特点设置放假时段，多为2至3天。\n\n　　2020年，教育部在答复相关建议时指出，在保证开足开齐国家规定课程，完成好正常教育教学任务和教学时长的前提下，学校放假时间包括春秋假时间由各地、高等学校结合实际做出具体安排。\n\n　　杨卫安说，这些假期都可以被当成“撬动教育特色化发展的杠杆”。他认为，应坚持“一地一策”，用好各地特色资源；提炼可复制的制度经验，逐步推广“特色假期+实践教育”模式。\n\n　　其他地区可用本地资源替代冰雪，如江南的水、西部的山、乡村的田野，形成春秋假、农忙假、雪假等多样化的实践样态。杨卫安建议：“国家层面可出台指导意见，明确假期时长、经费保障、课程标准和安全规范标准，把地方探索上升为相对固定的假期制度，让每个孩子都拥有‘属于自己家乡的假期’。”\n\n　　(本报记者 陈鹏） 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf41f33810d","title":"涉及个人信息安全，请注意！","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734449.shtml","summary":"在《中华人民共和国个人信息保护法》实施5周年之际，最高人民检察院发布一批依法保护公民个人信息的典型案例，集中曝光了“开盒”网暴、非法获取倒卖信息等乱象，释放出对相关违法犯罪全链条从严惩治的鲜明信号…","summary_short":"在《中华人民共和国个人信息保护法》实施5周年之际，最高人民检察院发布一批依法保护公民个人信息的典型案例…","digest":"在《中华人民共和国个人信息保护法》实施5周年之际…","points":["在《中华人民共和国个人信息保护法》实施5周年之际…","数字技术在给我们的生产生活带来便利的同时，也越来越多地被不法分子利用","当前，侵犯公民个人信息犯罪正悄然“进化”，呈现出链条升级、手段翻新、流向复杂等新特征"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T07:38:18+08:00","size":1,"keywords":[],"body":"在《中华人民共和国个人信息保护法》实施5周年之际，最高人民检察院发布一批依法保护公民个人信息的典型案例，集中曝光了“开盒”网暴、非法获取倒卖信息等乱象，释放出对相关违法犯罪全链条从严惩治的鲜明信号，这些案例显示出公民个人信息安全面临很复杂的风险，需要引起高度重视。\r\n\n　　乱象悄然演变\n\n　　数字技术在给我们的生产生活带来便利的同时，也越来越多地被不法分子利用。当前，侵犯公民个人信息犯罪正悄然“进化”，呈现出链条升级、手段翻新、流向复杂等新特征。\n\n　　——犯罪链条产业化。上游非法获取、中游层层倒卖、下游变现牟利，环环相扣、分工严密，衍生出信息查询、非法跟踪、“开盒”滋扰等黑灰产服务，犯罪形态由个体零散作案转向流水线式协同作案。\n\n　　——窃取手段技术化。从侵入系统的脚本代码，到批量抓取的爬虫程序，再到贴身追踪的定位装置，各类技术工具越来越多地被不法分子用于实施信息窃取，相关犯罪活动呈现自动化、批量化新特点。\n\n　　——围猎目标精准化。不法分子紧盯求职者、老年人、追星族等群体，有针对性地设计诱骗话术，以“高薪招聘”“下乡代办”“明星行程”等为诱饵，大肆非法获取公民个人信息。\n\n　　——数据流转跨境化。境外“社工库”提供查询，境外服务器存放数据，利用虚拟货币结算资金……大量公民个人信息被违规转移出境，既为跨境违法犯罪输送“弹药”，也对我国数据安全构成现实威胁。\n\n　　风险不止眼前\n\n　　公民个人信息一旦流入黑灰产链条，往往会成为多种违法犯罪的“基础原料”，衍生出多重风险。\n\n　　——危及人身安全。“开盒”曝光个人身份信息极易引发网络暴力，突破线上边界侵扰现实生活，令人身心俱疲甚至危及人身安全。\n\n　　——威胁财产安全。个人财产信息外泄，将直接催生精准电信网络诈骗、敲诈勒索等违法犯罪活动，威胁人民群众的“钱袋子”。\n\n　　——危害公共安全。行业信息泄露可能会冲击行业管理秩序，医疗、交通等敏感信息外流，会给国家数据安全带来潜在隐患。\n\n　　各方共筑强防线\n\n　　守护公民个人信息安全，需要各方齐抓共管、共筑防线。\n\n　　——强管理。各类网络平台、企事业单位要完善权限管控、日志审计、数据脱敏机制，紧盯内部人员数据异常访问风险，堵住系统漏洞；落实信息采集最小必要原则，不超范围收集个人信息。\n\n　　——强防范。广大公民在日常上网、投递简历、线上登记、扫描授权时，坚持“非必要不提供”，谨慎开放APP权限，避免在社交平台上晒出证件、票据、定位等信息，不向陌生网友透露身份证号、行程安排等，网络聊天把握分寸，谨防“有心人”顺藤摸瓜。\n\n　　——强维权。广大公民若遭遇信息被非法查询、“开盒”网暴、精准骚扰等情况，应注意留存证据，及时向有关部门报案，维护自身合法权益。\n\n　　来源：国家安全部微信公众号 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"政府公布","total":3,"items":[{"id":"ce0a11b370f","title":"駐倫敦經貿辦在芬蘭Slush 2026推廣《香港第一個五年規劃》的創科機遇","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111800587.htm","summary":"​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台，聯同投資推廣署和香港貿易發展局（貿發局），以及香港科技園公司…","summary_short":"​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台…","digest":"香港駐倫敦經濟貿易辦事處於十一月十八日，透過「經貿一站通」平台…","points":["​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間）…","她表示，香港匯聚國際人才、科技和資本，並協助企業把握中國內地…","周雪梅亦介紹在《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》下…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T09:00:00+08:00","size":1,"keywords":[],"body":"​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台，聯同投資推廣署和香港貿易發展局（貿發局），以及香港科技園公司，在芬蘭赫爾辛基舉行的Slush 2026上，舉辦題為「下一站亞洲：透過香港拓展創科業務」的研討會，介紹香港的創新科技（創科）發展，以及香港為有意拓展亞洲市場的北歐初創企業提供的機遇。\n\n　　駐倫敦經貿辦處長周雪梅在研討會上致辭，介紹香港為北歐企業拓展亞洲市場的重要平台。她表示，香港匯聚國際人才、科技和資本，並協助企業把握中國內地，特別是粵港澳大灣區（大灣區）和其他亞洲市場的發展機遇。\n\n　　周雪梅亦介紹在《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》下，香港發展成為國際創科中心的願景。她指出，香港正積極推進「三大創科園區、五大研發機構」的建設，並投放大量資源，進一步完善創科生態圈，加快科研成果轉化，開拓更多商業機遇。\n\n　　她亦介紹北部都會區，指出這項重大發展計劃將為創新發展和跨境合作帶來新機遇。她指出，區內的河套深港科技創新合作區香港園區——港深創新及科技園（港深創科園）和新田科技城相互配合，推動研發、成果轉化及產業發展。她亦介紹港深創科園與毗鄰深圳園區所採用的「一河兩岸、一區兩園」獨特跨境合作模式。這個模式為北歐企業提供良機，讓它們在香港設立據點，善用香港「一國兩制」下的獨特優勢，與香港及深圳的科研機構和創科夥伴合作，並充分利用大灣區的科技和製造業資源。\n\n　　投資推廣署創新及科技，生命與健康科學總裁黃煒卓亦於研討會上以「香港作為通往中國及更廣泛亞洲地區商機的門戶（從科技創投角度出發）」為題發表演講。另外，貿發局、香港科技園公司及兩間北歐企業代表在爐邊對談環節中，分享他們對香港創科領域的最新發展、海外企業可把握的機遇，以及行業未來發展前景的見解。講者亦結合自身經驗和專業知識，探討北歐初創企業進軍香港市場、尋找合適合作夥伴，以及進一步拓展亞洲市場時需要考慮的實際因素。\n\n　　駐倫敦經貿辦會繼續與投資推廣署、貿發局及香港科技園公司緊密合作，推廣香港的創科發展，促進香港與北歐創科企業之間的合作。\n\n　　Slush是年度的全球初創盛會，在赫爾辛基舉行，匯聚來自世界各地初創企業創辦人、投資者及科技與創業生態圈的其他成員，為參與者提供交流經驗，以及與潛在投資者及商業夥伴建立聯繫的平台。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c31032c8a55","title":"設計營商周2026及DesignInspire創意設計博覽開幕","url":"https://www.info.gov.hk/gia/general/202611/18/P2026111800257.htm","summary":"設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。","summary_short":"設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。","digest":"設計營商周2026及DesignInspire創意設計博覽舉行開幕典禮","points":["連同城區活動「設計@HKG」2026及「deTour 2026設計節」…","文化體育及旅遊局局長羅淑佩今日出席設計營商周2026開幕典禮及DesignInspire創意…","政府將繼續推動設計及創意產業發展，進一步鞏固香港作為中外文化藝術交流中心的地位"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-18T23:57:00+08:00","size":1,"keywords":[],"body":"設計營商周2026及DesignInspire創意設計博覽今日（十一月十八日）舉行開幕典禮。連同城區活動「設計@HKG」2026及「deTour 2026設計節」，這四項由文化體育及旅遊局轄下文創產業發展處資助的大型設計主題活動由即日至十一月二十九日先後或同期在香港舉行，匯聚本地及國際設計師、創意領袖、企業及品牌，為香港注入國際創意力量，將多元創意體驗帶進社區不同角落。\n\n  文化體育及旅遊局局長羅淑佩今日出席設計營商周2026開幕典禮及DesignInspire創意設計博覽交流酒會時表示，兩項活動均展現香港在連繫全球創意人才、促進跨文化交流及商業協作方面的獨特優勢。政府將繼續推動設計及創意產業發展，進一步鞏固香港作為中外文化藝術交流中心的地位。\n\n  設計營商周由香港設計中心主辦，並由瑞士擔任今屆峰會的夥伴國家。活動以「設計共話：從連繫到蛻變」為主題，匯聚超過60位來自瑞士、捷克、韓國、德國等地，以及中國內地和香港的創意領袖與商業決策者，今日起一連三日圍繞多個關鍵議題展開深入討論。\n\n  由香港貿易發展局主辦的DesignInspire創意設計博覽今日至十一月二十一日舉行。今屆展會以「Wander & Wonder」為主題，匯聚來自17個國家及地區、超過200個參展商，透過展覽、講座、工作坊及商業對接活動等，以設計串連文化、產業與日常生活，連結設計師、品牌、買家、設計愛好者及公眾。焦點節目包括由香港藝術家策劃的「Cabinets of Wonders」、由瑞士設計工作室創作的「Breathing in Motion」、由米蘭國際家具展Salone del Mobile.Milano呈獻的「ABITO/HK」以及由香港燈光設計師和室內設計師策劃的「House of Lumière」。\n\n  此外，香港設計中心今晚於DX設計館舉辦「炫彩香港」活動，慶祝DX設計館成立兩周年並為七個新展覽開幕。文創產業專員黎細明出席開幕儀式。\n\n  各項活動為業界和廣大市民帶來一場全城設計盛會，也匯聚香港及國際創意人才與資源，促進跨界別和跨文化交流，推動香港成為亞洲創意之都。所有公眾展覽均免費入場，歡迎市民親臨參觀，更多有關活動的資訊，請瀏覽以下網頁：\n\n設計營商周：2026.bodw.com/zh-hk\n\n設計@HKG：designathkg.com/zh\n\nDesignInspire：designinspire.hktdc.com/tc\n\ndeTour 2026設計節（十一月二十日開幕）：main.detour.hk/zh-hk\n\n炫彩香港： www.hkdesigncentre.org/tc","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca42eb9c718","title":"食環署再奪最佳公廁兩項殊榮","url":"https://www.info.gov.hk/gia/general/202611/18/P2026111800769.htm","summary":"食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮獲金獎和銅獎。","summary_short":"食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮…","digest":"食物環境衞生署發言人表示…","points":["食物環境衞生署（食環署）發言人今日（十一月十八日）表示…","獲得金獎的觀塘區鯉魚門（嶺南新村）公廁採用了「廁世代PT 2.0．公廁設計比賽」的得獎設計概…","該公廁貫徹「以人為本」的設計理念，內部空間寬敞，並設有配備自動門的暢通易達洗手間和通用洗手間"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-18T23:00:00+08:00","size":1,"keywords":[],"body":"食物環境衞生署（食環署）發言人今日（十一月十八日）表示，欣悉署方轄下兩個公廁在今年香港廁所協會舉辦的年度最佳公廁選舉中榮獲金獎和銅獎。\n\n　　獲得金獎的觀塘區鯉魚門（嶺南新村）公廁採用了「廁世代PT 2.0．公廁設計比賽」的得獎設計概念，以「管水母」為靈感，透過靈活組合的模組化結構，完美配合不同地形和環境，將創意融入公共設施中。該公廁貫徹「以人為本」的設計理念，內部空間寬敞，並設有配備自動門的暢通易達洗手間和通用洗手間；公廁外亦設有飲水機，方便市民和旅客使用。公廁亦已裝設智能監察系統，實時監測異味並自動通報，提升衞生水平和管理效率，並透過非接觸式意見回饋系統，收集使用者的意見，作為改善服務和未來規劃的參考。此外，其暢通易達洗手間更設有智能意外感應系統，偵測跌倒和異常停留情況，以便適時提供協助。\n\n　　至於獲得銅獎的南區香港仔大道公廁，翻新後以溫暖的大地色系配搭簡潔俐落的線條設計，展現獨特的現代美學。該公廁內設有供兒童和長者使用的設施，照顧不同年齡使用者的需要。\n\n　　發言人說：「食環署一直採取多管齊下的方式，包括引入新科技，提升轄下公廁的設施、管理和衞生水平，並在設計上照顧不同使用者的需要。食環署轄下公廁屢獲殊榮，反映署方持續提升公廁服務的工作得到肯定，值得鼓舞。要長期保持公廁乾淨舒適，亦有賴前線人員用心清潔和管理，署方感謝他們的努力和貢獻。」\n\n　　食環署早前已留意到荃灣區柴灣角公廁內部分位置傳出異味，並即時通知相關部門安排維修。署方已在公廁附近加設流動廁所，並會在公廁維修工程完成前加強流動廁所的清潔工作，同時要求相關部門加快維修損壞的設施。此外，為改善大橋村公廁和通州街公廁的設施，食環署已將兩間公廁納入翻新計劃，除了要求承辦商加強清潔工作，亦會密切監察承辦商的服務表現。\n\n　　現時，食環署管理逾800所公廁，近年積極夥拍建築署推展優化公廁翻新計劃。在2019年推行該計劃前，約有110所公廁已率先展開翻新。在計劃涵蓋其餘約700所公廁中，目前已有近八成半展開工程，其中逾250所的工程已順利竣工。署方目標在2028年年底前，全面為餘下約110所公廁開展翻新工程。\n\n　　採納香港城市大學顧問報告的建議，食環署自2023年起，已於使用量高的新建或翻新公廁落實 1:2.32 的男女廁格比例標準。對於使用量不高或偏遠的公廁，則會視乎場地環境、空間限制及實際運作需要而靈活調整。\n\n　　發言人表示，食環署一直致力改善公共衞生環境，未來會持續加強轄下公廁的清潔和管理，並積極引入智慧科技和人性化配套，從軟件和硬件入手推動公廁現代化，為市民和旅客提供更優質的公廁環境。署方亦呼籲市民和訪客愛惜公廁設施、保持清潔，共同維護城市公共衞生。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":20,"items":[{"id":"cb903d5853c","title":"哈工大原創話劇《仰望者》 以藝術之美還原「精神群像」｜聚焦哈工大","url":"https://www.stheadline.com/parenting-guide/3638388/哈工大原創話劇仰望者-以藝術之美還原精神群像聚焦哈工大","summary":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神、科學家精神的共鳴。","summary_short":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神…","digest":"近日，哈爾濱工業大學歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場…","points":["近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場…","專業演員與大學師生同台，將一群科學家、教育工作者扎根東北、教書育人、科研攻關的故事搬上舞台","20世紀50年代，800多名青年師生從中國各地齊聚哈爾濱工業大學"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:45:28+08:00","size":1,"keywords":[],"body":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神、科學家精神的共鳴。專業演員與大學師生同台，將一群科學家、教育工作者扎根東北、教書育人、科研攻關的故事搬上舞台。\n哈工大「八百壯士」奮鬥歷程\n這些人物有一個共同的名字——哈工大「八百壯士」。20世紀50年代，800多名青年師生從中國各地齊聚哈爾濱工業大學。這支平均年齡只有27.5歲的教師隊伍，承擔起學科建設與教學任務，為新中國培養工業化建設急需的人才。\n不搞模式化的英雄塑造，整部話劇深入歷史細節與人性深處。「我們站在舞台上，復刻的是先輩的崢嶸故事，演繹的是一代人的赤誠信仰。」就讀於建築與設計學院的鄒明燁說。\n哈工大「八百壯士」扎根北疆、「科技報國」的奮鬥歷程，是新中國高等教育特別是高等工程教育開拓發展的生動縮影。全劇以「仰望」為核心、「傳承」為主線，表達的就是「仰望與扎根」——腳踏泥濘、仰望星空，每代人都是仰望者，也會成為被仰望者。\n文藝是時代的號角，也是精神的載體。觀察者認為，《仰望者》找到了思想性與藝術性的結合點，通過高水準的劇本創排與舞台視覺呈現，使科學家精神與教育家精神在藝術美感中自然流淌、潤物無聲。\n這部話劇通過新媒體直播平台播出，50萬人次線上觀看。\n文：李雙余、闞思邈 圖：辛然、陳暢\n延伸閱讀：\n哈爾濱工業大學香港理工大學深圳國際設計學院 舉行揭牌儀式｜聚焦哈工大\n哈工大總體研製 八一04星「哈爾濱號」成功發射｜聚焦哈工大","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c441e987d3e","title":"食蜆習慣反映教養？港人震驚朋友1食法「嚇到眼都突」網民負評：睇得出人性禮貌","url":"https://www.stheadline.com/food/3638933/食蜆習慣反映教養港人震驚朋友1食法嚇到眼都突網民負評睇得出人性禮貌","summary":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。","summary_short":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。","digest":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教","points":["與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教","近日，一名港人於網上社交平台發文，分享早前與一大班朋友聚餐食炒蜆時…","帖文旋即引起廣大網民熱烈討論，大批網民一面倒負評樓主朋友的行為，直斥缺乏禮貌：「睇得出人性…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:27:41+08:00","size":1,"keywords":[],"body":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。近日，一名港人於網上社交平台發文，分享早前與一大班朋友聚餐食炒蜆時，驚見同枱友人竟做出一個奇特的食蜆舉動，直言與自己從小的家庭教育截然不同，令他當場大感震驚。帖文旋即引起廣大網民熱烈討論，大批網民一面倒負評樓主朋友的行為，直斥缺乏禮貌：「睇得出人性、禮貌同尊重」。\n港人與友聚餐食炒蜆驚見1行為 直言與從小家教截然不同\n港人聚餐或到小炒店用膳，惹味的炒蜆往往是餐桌上的熱門菜式。最近，一名港人於網上社交平台發文，表示自己從小到大與家人食炒蜆時，家人都會將蜆連同外殼一併夾走享用。然而，樓主日前與一班朋友食炒蜆時，卻驚見同枱所有人竟然都是「直接夾嚿肉」，然後將空殼原封不動留在公家碟上，令到樓主需於整碟蜆殼中「摷」才找到蜆肉。面對朋友們異於常人的進食習慣，樓主坦言當時「嚇到眼都突」，甚至一度懷疑自己的飲食習慣才是奇怪。\n網民批評友人無家教：隻隻都空城計真係嬲\n帖文引起網民熱烈討論，大多網友力撐樓主飲食習慣無問題，直指其朋友們的行為反映家教問題：「咁係你班friend無家教」、「你屋企有家教，千祈唔好以為一大班人係norm」、「通常我係做揀走啲殼嘅人，隻隻都空城計真係嬲」、「屋企人無教錯你」。有不少網民自身的家庭教育，表示從小長輩已教導必須連殼夾起，亦不能夾回碟內：「就算夾起發覺冇肉都唔可以放返落碟」、「好細個試過一次齋夾肉，比阿爸鬧」、「夾住嚿肉喺隻碟度揈甩個殼咁核突？」\n有較為包容的網民笑指朋友間無需太計較，或大家下次可選擇用公家匙羹：「通常我會將所有嘅殼夾晒出嚟放喺我前面，搞到變到有座山」、「最方便嘅方法就係用公匙羹，一勺倒落自己個碗慢慢食」、「唯有親自攞隻公家匙羹慢慢𢳂出嚟，提示大家應該連殼夾走」。有自稱資深「食蜆美食家」的網民打趣表示，樓主的朋友都不懂食蜆的真正美味：「作為炒蜆資深食家，夾到有肉就食、啜埋汁，無肉就淨啜汁」、「真，啜汁先惹味，算埋個殼先係精粹，佢哋識唔識食」、「我連殼食，用牙咬走啲肉，咁樣除咗得體，其實更好味」。\n文：R\n資料及圖片來源：Threads\n延伸閱讀：內地客遊港遇「茶餐廳文化」衝擊 力數三宗罪怒批：這叫服務嗎？ 勸這類人不要去....","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf69536bec3","title":"APEC: CE John Lee meets press; HK-Chile working holiday","url":"https://news.tvb.com/tc/1207225-APECCEJohnLeemeetspressHKChileworkingholiday","summary":"[13:30]Chief Executive John Lee meets the press at APEC in Shenzhen.He says Hong Kong contributes to…","summary_short":"[13:30]Chief Executive John Lee meets the press at APEC in S…","digest":"[13:30]Chief Executive John Lee meets the…","points":["Chief Executive John Lee meets the press at AP…","The city leader will meet with the Peruvian Pr…","Noting that the city has fielded the largest d…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T13:32:00+08:00","size":1,"keywords":["APEC","APEC Summit","APEC 2026","APEC China Year"],"body":"[13:30]\n\nChief Executive John Lee meets the press at APEC in Shenzhen.\n\nHe says Hong Kong contributes to its strengths and fully supports the nation in hosting a successful APEC meeting as China is hosting APEC for the third time and this year marks the APEC China Year. He says the city will work to advance Asia-Pacific cooperation, deepen collaboration and promote high-quality development within the bloc, with a view to achieving forward-looking outcomes for APEC member economies.\n\n[13:38]\n\nHong Kong is launching its first-ever Working Holiday scheme with Chile, expanding opportunities for young people to experience life and work in Latin America. The scheme offers a one-year visa, broadening horizons and strengthening exchanges between Hong Kong and Chile.\n\n[13:40]\n\nThe city leader will meet with the Peruvian President to conduct bilateral talks.\n\n[13:46]\n\nNoting that the city has fielded the largest delegation ever to APEC, CE John Lee says, \"We should take an active role in assisting our country to successully host this year's APEC.\"","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026fnYl7Qkmk61795067153.bmp?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/3a1738ffad5d4480b22ec818e8d780e0/aa07a39aada6478ca2cad7d6f6f6638a-6c21f48137d4116d4f52217b00d10459-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026fnYl7Qkmk61795067153.bmp?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"ce87887432e","title":"貝托祺與港樂共譜華章 以馬勒八為序 以洪音開新天","url":"https://www.stheadline.com/culture/3638578/貝托祺與港樂共譜華章-以馬勒八為序-以洪音開新天","summary":"11月7日、8日，貝托祺（Tarmo Peltokoski）攜手香港管弦樂團、八位獨唱家及六個合唱團，合共近六百人，於香港文化中心隆重呈獻馬勒的鴻篇巨作第八交響曲…","summary_short":"11月7日、8日，貝托祺（Tarmo Peltokoski）攜手香港管弦樂團、八位獨唱家及六個合唱團，合共近六百人…","digest":"11月7日、8日，貝托祺（Tarmo Peltokoski）攜手香港管弦樂團…","points":["11月7日、8日，貝托祺（Tarmo Peltokoski）攜手香港管弦樂團…","正如歌德在《浮士德》中寫下那句擲地有聲的詩句：「太初有為","」貝托祺選擇以「馬勒八」這部凝聚人類精神、創造意志與終極理想的宏偉篇章…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T09:15:28+08:00","size":1,"keywords":[],"body":"11月7日、8日，貝托祺（Tarmo Peltokoski）攜手香港管弦樂團、八位獨唱家及六個合唱團，合共近六百人，於香港文化中心隆重呈獻馬勒的鴻篇巨作第八交響曲，為他出任香港管弦樂團音樂總監揭開序幕。\n正如歌德在《浮士德》中寫下那句擲地有聲的詩句：「太初有為！」貝托祺選擇以「馬勒八」這部凝聚人類精神、創造意志與終極理想的宏偉篇章，開展他與香港管弦樂團的全新旅程。這一選擇不僅是他對藝術立場的鮮明宣示，也體現了他對音樂力量與藝術使命的深刻理解。馬勒以恢宏的音樂語言，呈現人類對愛、創造與精神昇華的不懈追尋；而這份不斷突破界限，向更高理想邁進的精神，亦與貝托祺的藝術追求形成深刻共鳴。\n以此作為履新之作，既是對馬勒宏大精神世界的致意，也寄寓着他對樂團未來的期許：以行動激發創造，以藝術凝聚力量，在傳統與創新之間不斷探索，讓音樂連繫個人、城市，乃至世界。\n躬行實踐 突破界限 貝托祺與港樂的藝術使命\n「太初有為！」 沒有甚麼比這句話更適合作為浮士德那種透過行動超越自我的精神，馬勒顯然也為這種精神所着迷。1906年夏天，他在自己的夏季作曲小屋中潛心創作，完成了第八交響曲，第二部分的歌詞正選自歌德的《浮士德》，其音響上的龐大、編制上的宏偉，以及精神內涵上的廣闊而細膩，共同構成「馬勒八」獨一無二的面貌。\n在作品首演116年後，2026年11月7日與8日，香港管弦樂團（港樂）新任音樂總監貝托祺在其就職音樂會上，帶領樂團及合唱團近六百人的演出陣容，一同在香港呈獻這部巨作。參與演出的包括八位中外歌唱家：積奇蓮．華格納（Jacquelyn Wagner）、坎睿思（Chen Reiss）、鄺勵齡、莫莉森（Catriona Morison）、菊克（Sasha Cooke）、卡塔亞拉（Tuomas Katajala）、坎達寧修斯（Rinalds Kandalincevs）及沈洋；以及香港管弦樂團合唱團、學士合唱團、倫敦愛樂合唱團、聖保羅男女中學高級混聲合唱團、英華書院合唱團及香港兒童合唱團。這份對「行動」的信念，對音樂理想的追求，以及對精神力量的共鳴，正是貝托祺與港樂共同秉持的精神。\n貝托祺曾形容馬勒八「如宇宙般宏大、普世人間、超凡入聖、眾志成城」。這次演出既是對馬勒宏大精神世界的回應，也寄託着貝托祺對自己執掌下的港樂未來的期許：以行動激發創造，以藝術凝聚力量，在傳統與創新之間不斷探索，讓音樂連繫個人、城市，乃至世界。\n當音樂行至終章，管風琴、樂隊與人聲齊鳴。音樂將代代相傳的精神，展現在觀眾面前。一瞬間，這股力量傳到每個人身上，震撼整個香港文化中心。貝托祺熟練地帶領樂團、合唱團和獨唱家，有序而細緻地完成演出。在場的人無不為之感動──這是音樂帶來的力量。\n早前，港樂行政總裁方恩哲（Bernhard Fleischer）上任時，我曾與他對話。他提到，希望自己與貝托祺及港樂各位同事，在港樂這個「正處於加速向前發展的時刻」攜手共進，以演出的「曲目策劃」和「演出質素」為本，不辜負每一位觀眾的期待。從2026/27樂季的節目策劃，到這場演出的呈現，這兩點都得到充分體現；他們以實際行動，交出令人滿意的成績。\n巡演歐洲 走向世界\n方恩哲希望港樂能夠始終保持一種「沒有局限」的特質：能駕馭多元豐富的曲目類型，不斷拓展藝術表現的疆界，同時進一步提升樂團的國際影響力，讓港樂在世界古典音樂舞台上佔據更鮮明的位置。\n11月底，貝托祺將率領港樂展開橫跨四國八城的歐洲巡演，登上多個世界著名音樂廳的舞台。此次巡演曲目兼具深度與光彩：以夫利格（Henk de Vlieger）根據華格納歌劇改編的《指環》：管弦樂冒險，以及布魯赫納第四交響曲為核心，展現樂團駕馭大型交響作品的能力與藝術深度。同時，鋼琴家赫姆森（Martin Helmchen）將演繹莫扎特第二十四鋼琴協奏曲，並與貝托祺攜手呈獻聖桑《動物嘉年華》，為這趟巡演增添別樣的音樂色彩。\n巡演城巿包括巴塞隆拿、漢諾威和慕尼黑，此外，在赫爾辛基、多蒙特、柏林、漢堡和維也納，港樂還將帶來中國作曲家姚晨為港樂巡演特別創作的《團團轉》。這不僅讓中國當代音樂創作走進歐洲音樂廳，也使港樂的國際巡演成為一次雙向的文化交流：既向世界展示樂團的藝術面貌，也將當代中國音樂的聲音帶到更廣闊的舞台。\n對港樂而言，此次巡演的意義並不止於拓展巡演版圖，或是在國際舞台上留下足跡；更重要的是，港樂能在不同音樂文化語境中檢驗自身的藝術實力，連結世界各地的聽眾，在交流與碰撞中，不斷拓展自身的可能性。從香港出發，走向世界，再將新的經驗與視野帶回香港──這樣的往返，正是一支立足國際的樂團成長的重要組成部分。\n方恩哲與貝托祺所強調的「沒有局限」，正是在這樣一次次實踐中獲得具體意義：不囿於地域，不拘於曲目，也不為藝術表現設限。正因如此，對一支立足香港、面向世界的樂團而言，真正的突破或許正在於此──躬行實踐，突破界限。\n文：謝嘉雯 圖：香港管弦樂團","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c32be867870","title":"一把斧头加腐蚀性金属，爱尔兰男子潜入机场，“拆报废”一架6000万美元的“大力神”军机","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734481.shtml","summary":"一把斧头加腐蚀性金属，爱尔兰男子潜入机场，“拆报废”一架6000万美元的“大力神”军机 | 国际早察  　　美东时间11月17日，美国纽约南区联邦检察官办公室正式公开一份联邦起诉书…","summary_short":"一把斧头加腐蚀性金属，爱尔兰男子潜入机场，“拆报废”一架6000万美元的“大力神”军机 | 国际早察  　　美东时间11…","digest":"一把斧头加腐蚀性金属，爱尔兰男子潜入机场…","points":["美东时间11月17日，美国纽约南区联邦检察官办公室正式公开一份联邦起诉书…","这份最新解密的起诉书，将今年4月发生在爱尔兰香农机场(Shannon Airport)的一起…","据英国广播公司、CNN等外媒报道，今年4月11日…"],"section":"其他","category":"兩岸國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T09:13:28+08:00","size":1,"keywords":[],"body":"一把斧头加腐蚀性金属，爱尔兰男子潜入机场，“拆报废”一架6000万美元的“大力神”军机 | 国际早察\n\n　　美东时间11月17日，美国纽约南区联邦检察官办公室正式公开一份联邦起诉书，对48岁的爱尔兰男子戴西·奥科兰(Daithi O'Corrain)提起刑事指控，罪名是蓄意破坏并“有效摧毁”一架造价高达6000万美元的美军“大力神”运输机。\n\n　　这份最新解密的起诉书，将今年4月发生在爱尔兰香农机场(Shannon Airport)的一起离奇破坏案公之于众——而作案现场曝光的细节，堪称现实版的“硬核拆机现场”。\n\n　　凌晨封窗反锁舱门，48岁男子上演“硬核拆机”\n\n　　据英国广播公司、CNN等外媒报道，今年4月11日，一架美国空军国民警卫队的C-130H“大力神”运输机正停放在爱尔兰香农机场过夜。\n\n　　凌晨4时30分刚过，奥科兰趁夜通过破坏锁定装置进入机舱。\n\nBBC的报道公布了奥科兰作案现场\n\n　　他反侦察意识极强：先用绑带将舱门固定关闭，然后遮盖机窗，给自己造出封闭的“作案暗室”，随后展开系统性破坏：\n\n　　切断机内电线和液压管路。他挤压液氧管路，摧毁驾驶舱内的所有仪表，并刺穿飞机的通风管道。\n\n　　抡起斧头砍砸机身。走出机舱后，他直接挥斧猛砍机身，留下一道道“伤口”。\n\n　　卡死油箱腐蚀机身。更致命的是，他拧开油箱盖倒入大量金属滚珠轴承，还在关键金属部件上涂抹了具有腐蚀性的金属镓。\n\n　　预谋数月摸清门路，6000万美元“大力神”报废\n\n　　直到安保与美军察觉异样破门而入时，这架“大力神”已面目全非。\n\n　　美国检察官表示，奥科兰策划此次袭击已长达数月，期间专门在网上搜集了关于C-130运输机结构的信息，这才得以精准瘫痪整架飞机。\n\n　　美方确认，由于航电全毁、机身遭斧劈、油箱混入异物且蒙皮遭镓元素严重腐蚀，这架价值约6000万美元的运输机已无法修复，被认定为“有效摧毁”。\n\n　　雪上加霜的是，美国联邦调查局(FBI)称，此次袭击还“危及了关键的军事行动”。\n\n　　目前，奥科兰仍被关押在爱尔兰监狱中，美方已启动程序欲将其引渡至美国受审，一旦在美定罪，他将面临最高10年监禁。\n\n　　奥科兰为什么要冒险拆机？\n\n　　随着案情公开，奥科兰冒险“拆机”的动机也浮出水面。\n\n　　据外媒披露，一项由奥科兰好友发起的在线筹款活动称，他之所以让这架C-130运输机“丧失功能”，是为了抗议美国与以色列针对伊朗的战争，以及华盛顿对以色列在加沙地带所进行“种族灭绝战争”的支持。\n\nCNN对于此次事件的报道\n\n　　位于爱尔兰西部的香农机场是一座民用国际机场，亦时常承担过境军机的经停补给任务。然而，据媒体梳理，在过去18个月里，该机场曾发生多起安保漏洞事件。其中包括三人被控向一架过境美军飞机喷漆，以及另外三人驾车闯入限制区域。\n\n　　作者：王曦\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd0e1f06b28","title":"年轻人看体育赛事是在看什么 超半数受访青年从竞体赛事中学会了接纳输赢","url":"https://www.chinanews.com.cn/ty/2026/11-19/10734473.shtml","summary":"强势横扫、黑马逆袭、百炼成钢……","summary_short":"强势横扫、黑马逆袭、百炼成钢…","digest":"强势横扫、黑马逆袭、百炼成钢……如今，竞技体育赛事吸引了越来越多年轻人的目光","points":["强势横扫、黑马逆袭、百炼成钢……如今，竞技体育赛事吸引了越来越多年轻人的目光","近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育…","”她至今还记得2004年雅典奥运会上中国女排在先失两局的情况下连扳三局夺冠的瞬间…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:54:55+08:00","size":1,"keywords":[],"body":"强势横扫、黑马逆袭、百炼成钢……如今，竞技体育赛事吸引了越来越多年轻人的目光。近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育赛事的青年开展的调查显示，竞技对抗带来的悬念与刺激感是受访青年观看赛事的首要原因。篮球、足球、乒乓球是受访青年最青睐的三项竞技项目。\r\n\n　　年轻人爱看哪些竞技体育比赛项目\n\n　　95后王卓琳从小受家人的影响开始观看竞技体育赛事，“小时候我们家里的电视除了放各种晚会，就是各项比赛，大家都是‘体育迷’。”她至今还记得2004年雅典奥运会上中国女排在先失两局的情况下连扳三局夺冠的瞬间，“给儿时的我带来了极大的震撼。”上中学后，她开始和同学一起看篮球比赛，渐渐地也开始看足球、网球、F1(世界一级方程式赛车锦标赛——记者注)等项目的比赛，“现在大部分知名赛事我都会看一下。”\n\n　　作为一名“体育迷”，在北京工作的90后李泽林在日常运动健身之余，也会关注羽毛球、乒乓球、电子竞技等赛事。“我印象最深的还是2011年看李娜法网夺冠的电视转播，当时这场比赛在国内也受到广泛关注，成为很多人了解网球的契机，我也是因此在上大学时开始学习网球。”\n\n　　丰富多样的竞技体育赛事，正在不断吸引年轻人的目光。大家都看过哪些竞技体育项目的比赛？调查中，篮球(58.0%)、足球(53.7%)、乒乓球(50.4%)位列前三。其他还有：羽毛球(39.2%)、游泳/跳水/花样游泳(33.4%)、排球(29.2%)、电子竞技(26.9%)、网球(24.1%)、田径(23.4%)、冰雪项目(22.3%)、赛车/摩托车赛(16.1%)、搏击/格斗类(12.1%)等。\n\n　　过半受访者因竞技对抗带来的悬念与刺激感而观赛\n\n　　正在读研究生的00后卫婕从2020年东京奥运会开始关注竞技体育赛事，“最开始是看乒乓球，现在比较关注短道速滑赛事。”对她而言，竞技体育的不确定性是赛事最大的魅力，“即使对手之间有一些差距，甚至可以说实力悬殊，你也很难准确预判比赛结果。”另外，她也会被选手的个人魅力打动，“我喜欢的一名短道速滑选手，尽管实力强劲，却因场外因素屡屡受挫，后来他选择换一个全新的环境，最终在世锦赛上拿到了久违的金牌。这种选手跌宕起伏的人生故事非常打动我。”\n\n　　在广东上学的05后赵欣更看重比赛本身的观赏性，“即便我力挺的队伍没有参赛，我也会观看相关比赛。只要是发挥出色、没有违规的选手，我都会为他们喝彩。”看到一些队伍即使历经千辛万苦、颗粒无收，却仍然在赛场上为了冠军奋勇拼搏时，她也会被感染，“队员们为了冠军并肩奋斗，最后一起捧起奖杯的画面，太打动我了。”\n\n　　“我觉得竞技体育的赛事结果充满变数，奇迹时有发生。这种不确定性，以及每名运动员在项目里拼尽全力、不断突破人类极限的努力，都带给我深深的震撼。” 王卓琳觉得观看体育赛事给她带来了一些积极的“刺激”。今年中超联赛期间，她和其他球迷一度以为成都蓉城会夺冠，“但大连英博专注眼前每一场比赛，一分一分去拼，拿下了最后的冠军。”\n\n　　哪些因素吸引现在的年轻人观看竞技体育赛事？数据显示，55.4%的受访青年是因为竞技对抗带来的悬念与刺激感；49.5%的受访青年是被不断突破自我、挑战极限的力量吸引；48.4%的受访青年感受到了其中的团队协作与集体荣誉感。此外，选手永不言弃、顽强拼搏的精神(43.2%)，对该体育项目的热爱(41.8%)，赛事本身的观赏性(40.0%)，运动员的个人特质、成长故事(21.9%)，可以和亲朋好友一起讨论交流(13.4%)等也是吸引受访青年观赛的因素。\n\n　　56.0%受访青年从观赛中学会了接纳输赢\n\n　　“想做的都去做吧！” 这是卫婕喜欢的一名选手分享在社交平台的一句话，在她迷茫时给了她很大鼓舞，“这让我面对选择时，不会因为害怕失败而退缩。”在观赛过程中，她也慢慢提升了抗压能力，学会了自洽。“运动员可能付出超过常人几百倍的努力，却仍会因为运气或其他因素没能拿到想要的结果。以前遇到不顺，我容易自怨自艾；现在我明白很多事不必过度纠结，就算努力之后没能如愿，我也能更坦然地接受。”\n\n　　为了支持自己喜欢的选手，赵欣开始尝试不少新事物，“比如一个人出门旅行，制作赛事物料，剪辑视频记录选手的成长。”除了学到新技能，观看竞技体育赛事也丰富了她的精神世界，选手的故事持续激励着她：“之前有一名选手年少成名，却十年无缘最有分量的冠军，最终在队伍不被任何人看好的情况下，以黑马之姿夺冠。” 每当想要放弃的时候，这段故事都能帮她重拾信心：“这些选手站在世界级赛事舞台上，顶着巨大压力，一次次遭遇失利，却依旧保持热爱、为之付出。相比之下，我生活里遇到的挫折其实微不足道，再坚持一下，或许我也能迎来不一样的结果。”\n\n　　观看竞技体育赛事给年轻人带来了哪些积极影响？调查显示，56.0%的受访青年从中学会了接纳输赢，提升抗压能力；54.6%的受访青年舒缓了日常焦虑，调节情绪，放松自我；46.4%的受访青年在遇到挫折时，能被鼓舞，不轻言放弃。其他还有：受到带动，愿意主动运动，坚持锻炼(45.4%)；理解分工协作，提升团队意识(33.5%)；懂得尊重规则、敬畏公平(34.7%)；激发集体认同感与家国情怀(25.2%)等。\n\n　　受访青年中，男性占52.8%，女性占47.2%。05后占5.2%，00后占32.2%，95后占25.6%，90后占37.0%。\n\n　　(除卫婕外，受访者均为化名)\n\n　　中青报·中青网记者 戴瑶 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4137691858","title":"消防隐患要消除 酿成火灾或领刑","url":"https://www.chinanews.com.cn/fz/2026/11-19/10734471.shtml","summary":"消防隐患要消除 酿成火灾或领刑(以案说法)  　　此前的一天夜里，上海市嘉定区一栋三层商务小楼突然火光冲天，冒出浓烟。","summary_short":"消防隐患要消除 酿成火灾或领刑(以案说法)  　　此前的一天夜里，上海市嘉定区一栋三层商务小楼突然火光冲天，冒出浓烟。","digest":"消防隐患要消除 酿成火灾或领刑(以案说法)  　　此前的一天夜里…","points":["此前的一天夜里，上海市嘉定区一栋三层商务小楼突然火光冲天，冒出浓烟","嘉定区消防救援支队接到报警后，马上赶到现场","原来，该建筑一楼停放着待出售的电动自行车及铅酸电池、轮胎、小配件等，而2…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:50:38+08:00","size":1,"keywords":[],"body":"消防隐患要消除 酿成火灾或领刑(以案说法)\n\n　　此前的一天夜里，上海市嘉定区一栋三层商务小楼突然火光冲天，冒出浓烟。嘉定区消防救援支队接到报警后，马上赶到现场。\n\n　　原来，该建筑一楼停放着待出售的电动自行车及铅酸电池、轮胎、小配件等，而2、3层则被店主王某出租给了他人居住。消防救援人员马上将被困火场的2、3层住户张某、李某救出，并送医救治。可张某、李某已经受到了火灾现场有毒气体的侵害，其中，张某已经意识丧失、呼吸停止，送医后还是不治身亡。\n\n　　公安机关调查发现，王某租赁该商铺多年，1层用于经营电动自行车店，同时楼上用于住宿。此前，相关部门对该店几次开展消防检查时，均发现店内经营区域存在灭火器过期、电气线路不符合消防技术标准等违法行为，多次对其处罚，要求整改。王某每次被处罚后也进行了整改，可没过多久，店里又会出现新的违反消防法规的行为。案发时，王某甚至还使用铜导线连接自制拖线板为相关设备充电。而正是这次充电引发电气线路故障，最终引发火灾。\r\n\n　　在此之前，民警就发现该店楼上存在违规住人的情况，当即就告知王某，这类经营场所必须在物理隔离等方面符合消防法相关规定才行。后来，王某为了应付检查，就让楼上的住户搬走，但很快又将楼上出租出去供人居住。最终，王某被以消防责任事故罪起诉至嘉定区人民法院。\n\n　　法院审理认为，王某租赁的房屋属于集储存、经营和住宿于一体的“三合一”场所。而且，住宿与其他使用功能之间未设置有效的防火分隔，违反了消防法相关规定，即生产、储存、经营其他物品的场所与居住场所设置在同一建筑物内的，应当符合国家工程建设消防技术标准。\n\n　　现有证据证实，属地派出所民警就“三合一”场所多次向王某申明楼上不能住人，王某都敷衍应付。虽然用木门等进行了隔断，但防火分隔仍然不到位，加之本次自制拖线板为相关设备充电引发火灾，最终发生惨剧。王某在消防监督机构通知警告后，没有认真采取有效改正措施，属于刑法规定的“拒绝执行”，而引发火灾严重后果，行为符合消防责任事故罪构成要件。最终，法院判决王某犯消防责任事故罪，判处有期徒刑一年六个月。\n\n　　法官提醒，消防安全一环扣一环，一定要坚持安全第一、预防为主。相关部门要全面排查重点场所的突出风险隐患。电动自行车消费者也要定期对锂电池进行健康评估，千万不要购买不合格的电动车及配件，更不要用私拉电线、乱接插座等方式充电。(记者 金歆) 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2499159dfa","title":"别让你的骨头比你先老 预防骨质疏松记住“3+4”","url":"https://www.chinanews.com.cn/jk/2026/11-19/10734466.shtml","summary":"很多人觉得骨质疏松不是大事  　　这是一个很大的误区  　　事实上  　　骨质疏松会让骨骼脆性增加\r  　　一旦跌倒极易发生骨折  　　骨折后可能致残  　　严重时甚至危及生命  　　报告单上的指标到…","summary_short":"很多人觉得骨质疏松不是大事  　　这是一个很大的误区  　　事实上  　　骨质疏松会让骨骼脆性增加\r  　　一旦跌倒极易…","digest":"很多人觉得骨质疏松不是大事  　　这是一个很大的误区  　　事实上  　　骨质疏松会…","points":["很多人觉得骨质疏松不是大事","发生髋部骨折后1年内，约20%的患者可能死于各种并发症，约50%的患者致残，生活质量明显下降","-4＜指数≤-1，属于中风险，建议到医院咨询，提前干预"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:37:46+08:00","size":1,"keywords":[],"body":"很多人觉得骨质疏松不是大事\n\n　　这是一个很大的误区\n\n　　事实上\n\n　　骨质疏松会让骨骼脆性增加\r\n\n　　一旦跌倒极易发生骨折\n\n　　骨折后可能致残\n\n　　严重时甚至危及生命\n\n　　报告单上的指标到底是什么意思？\n\n　　我们应该如何科学对待骨质疏松？\n\n　　3个方法发现骨质疏松\n\n　　4个关键应对骨质疏松\n\n　　一起来看～\n\n　　01\n\n　　骨质在无声无息中流失\n\n　　人群普遍规律\n\n　　30～35岁：骨量达到峰值\n\n　　36～49岁：维持稳定，缓慢流失\n\n　　50～69岁：迅速减少\n\n　　70岁以上：持续减少\n\n　　过程：骨量减少—骨质疏松症—骨折\n\n　　发生骨质疏松性骨折后，患者的致残率和死亡率会显著增加，第一次骨折之后，再发骨折风险较高。\n\n　　其中，髋部骨折是骨质疏松症严重的并发症。发生髋部骨折后1年内，约20%的患者可能死于各种并发症，约50%的患者致残，生活质量明显下降。\n\n　　而这种风险离我们并不遥远。全国骨质疏松症流行病学调查显示，我国50岁以上人群骨质疏松症患病率为19.2%，其中50岁以上女性为32.1%，65岁以上女性患病率更达到51.6%。\n\n　　02\n\n　　3个方法，测一测骨质疏松风险\n\n　　OSTA亚洲人骨质疏松自我筛查工具(主要适用于绝经后亚洲女性)\n\n　　计算方法：(体重kg-年龄)×0.2=OSTA风险指数\n\n　　结果分析：\n\n　　指数＞-1，发生骨质疏松的风险较低；\n\n　　-4＜指数≤-1，属于中风险，建议到医院咨询，提前干预；\n\n　　指数≤-4，为高风险，建议尽快到医院做骨密度检查。\n\n　　举例说明：体重50公斤，年龄85岁的人，风险指数为(50－85)×0.2=-7，结果≤-4，提示骨质疏松高风险。\n\n　　3大症状，警惕骨质疏松\n\n　　腰背痛；\n\n　　驼背；\n\n　　身高缩短超过3厘米。\n\n　　以上3种情况，常提示可能存在脊柱压缩改变，需要排查骨质疏松。\n\n　　骨密度检测：报告上的3个核心指标\n\n　　双能X线骨密度检测是诊断骨质疏松的金标准，筛查建议如下：\n\n　　常规筛查人群：建议将骨密度纳入40岁以上人群常规体检项目。\n\n　　高危人群：长期服用激素、有脆性骨折史、体重过低、有烟酒嗜好等高危人群，即便没有不适，也建议主动排查骨量。女性早绝经(45岁前)、男性存在性腺功能减退症，同样需要尽早评估骨骼健康。\n\n　　T值：绝经后女性、50岁以上男性的诊断核心\n\n　　它是诊断骨质疏松的核心指标，对应分级标准如下：\n\n　　T值≥-1：骨量处于正常范围；\n\n　　-2.5＜T值＜-1：骨量减少，属于骨质疏松前期；\n\n　　T值≤-2.5：可诊断为骨质疏松症。\n\n　　Z值：绝经前女性、50岁以下男性的参考指标\n\n　　判断骨量是否符合自身年龄的正常水平。\n\n　　判断标准：\n\n　　Z值＞-2：骨量处于同年龄段的平均水平；\n\n　　Z值≤-2：骨密度低于同年龄人群平均水平，需要排查原因并积极干预。\n\n　　只看骨密度不够：结合动态指标判断流失速度\n\n　　骨密度反映的是骨骼的静态状态，只能体现检测当下的骨量水平，无法判断骨量丢失的快慢。\n\n　　如果想要了解近3个月的骨代谢动态、骨量流失速率，还需检测骨转换生化标志物。这项血液指标可以反映骨吸收与骨形成的活跃程度，和骨密度结果结合分析，才能更准确评估是否需要及时启动药物干预。\n\n　　另外需要注意，骨骼代谢周期较长，骨密度复查不宜过于频繁，通常6个月—1年检测1次即可，6个月内复查一般很难观察到明显变化。\n\n　　03\n\n　　日常护骨4字诀：吃、晒、动、戒\n\n　　骨量的积累与维护，离不开日常的健康管理，做好4件事，守护骨骼健康。\n\n　　吃：补足钙与优质蛋白\n\n　　充足的钙与蛋白质摄入，是维护骨骼健康的核心营养基础。\n\n　　普通健康成年人每日蛋白质推荐摄入量为0.8～1.0克/千克体重；\n\n　　骨质疏松人群、老年群体建议提升至每日1.0～1.2克/千克体重，以维持肌肉量、保障骨代谢正常运转；\n\n　　高龄、消瘦或已发生脆性骨折的患者，可进一步增至1.2～1.5克/千克体重，有助于降低肌肉衰减与再发骨折的风险。\n\n　　补钙优先通过膳食实现，建议每日摄入至少300毫升牛奶或相当量的奶制品，搭配豆制品、深绿色叶菜、鱼虾类等富钙食物。\n\n　　日常还要避免过度节食减重，防止营养摄入不足持续损耗骨量。\n\n　　晒：促进维生素D合成\n\n　　维生素D是钙吸收的“搬运工”，每日接受10～20分钟的日晒，可促进皮肤自行合成维生素D，帮助钙质沉积到骨骼中。注意避免正午强光暴晒，防止皮肤晒伤。\n\n　　动：给骨骼适度应力刺激\n\n　　骨骼遵循“用进废退”的原则，负重与力量训练能给骨骼施加良性刺激，促进骨形成。\n\n　　日常可选择快走、慢跑、跳绳、球类运动、深蹲等，既能锻炼肌肉，也能强化骨骼强度。\n\n　　戒：避开伤骨坏习惯\n\n　　戒烟限酒，避免过量饮用碳酸饮料、咖啡，尽量避免或少用影响骨代谢的药物，避免长期过度节食，减少骨量的不必要消耗。\n\n　　专家提醒：\n\n　　如果已确诊骨质疏松，或骨量减少且骨转换指标提示骨流失速度很快，仅靠补充营养远远不够。\n\n　　需由医生结合骨密度水平、骨代谢类型进行评估，选择规范的抗骨质疏松药物方案，有助于改善骨密度、降低骨折风险。\n\n　　应对骨质疏松行动指南\n\n　　测一测骨质疏松风险，试试这3个方法\n\n　　1.(体重kg-年龄)×0.2=OSTA风险指数，指数≤-4，建议尽快到医院做骨密度检查；\n\n　　2.骨密度检测；\n\n　　3.腰背痛、驼背、身高缩短超过3厘米。\n\n　　做好4件事，守护骨骼健康\n\n　　1.吃：每天摄入适量牛奶或酸奶，多吃豆制品、深绿色叶菜、鱼虾类食物，同时避免过度节食减重。\n\n　　2.晒：每日接受10～20分钟的日晒。\n\n　　3.动：日常可选择快走、慢跑、跳绳、球类运动、深蹲等。\n\n　　4.戒：戒烟限酒，减少含糖饮料、浓咖啡的过量摄入，避免长期过度节食。\n\n　　温馨提示\n\n　　本文为健康科普，不替代专业诊疗。骨量异常、腰背持续疼痛、身高明显缩短，请及时到骨科或内分泌科就诊，遵医嘱检查、干预。\n\n　　钙剂与维生素D仅作为基础营养支持，单纯补充一般难以逆转骨密度下降，也无法单独有效降低骨折风险，不能替代药物治疗。 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c861b4f9173","title":"黃仁勳出軌｜美報告：去年6月已約談黃樂 Nvidia同期將Megaspeed列禁售名單","url":"https://www.stheadline.com/realtime-world/3638763/黃仁勳出軌美報告去年6月已約談黃樂Nvidia同期將Megaspeed列禁售名單","summary":"英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層黃樂（Alice Huang）的婚外情風波持續。","summary_short":"英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層黃樂（Alice Huang…","digest":"英偉達（Nvidia…","points":["英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層…","美國商務部與司法部披露，美方早於2024年已就Megaspeed涉嫌違反出口管制展開調查…","英偉達亦於同月將Megaspeed列入公司「禁售」名單"],"section":"其他","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:37:02+08:00","size":1,"keywords":[],"body":"英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層黃樂（Alice Huang）的婚外情風波持續。美國商務部與司法部披露，美方早於2024年已就Megaspeed涉嫌違反出口管制展開調查，並於去年6月派員到公司實地查核及約談黃樂；英偉達亦於同月將Megaspeed列入公司「禁售」名單。\n2024年啟動調查　去年要求交出銷售紀錄\n兩部門在聯合聲明中表示，當局透過主動監察敏感半導體可能遭轉運的情況，發現可疑活動，遂於2024年啟動調查。商務部調查人員於2025年5月要求英偉達提交直接或間接向Megaspeed銷售產品的紀錄，英偉達翌月將該公司列入禁售名單。\n相關新聞：黃仁勳下台｜Nvidia宣布提前加薪派股權穩軍心 重申無意讓黃回歸\n聲明指，商務部工業與安全局人員其後聯同新加坡執法機關，於2025年6月到Megaspeed進行實地最終用途查核，並約談當時擔任行政總裁的黃樂。司法部其後接手主導刑事調查，惟聲明未交代具體接手日期，亦未公布針對Megaspeed的起訴。\nCNN：現有情報不足證明黃樂從事間諜活動\nCNN報道，美國商務部長盧特尼克近日因處理Megaspeed案的步伐受到質疑，財政部長貝森特亦曾批評商務部，延誤將這家英偉達客戶識別為潛在國安威脅。兩部門表示，雖然一般不評論進行中的調查，但認為有必要向公眾交代事實，澄清報道中的不準確資訊。\n至於黃樂被指可能與情報活動有關，CNN引述多名消息人士指出，美國情報界仍在釐清她與中國政府的關係，目前掌握的情報不足以證明她曾為北京從事間諜活動。相關懷疑不能視為已獲證實的結論。\n新加坡稱未查間諜活動　黃樂已被禁再入境\n新加坡內政部早前公布，當地警方及海關於2025年2月展開獨立調查，涉及採購伺服器時可能作出虛假申報等罪行。黃樂當時是Megaspeed行政總裁、主席及主要控制人之一，因此接受調查；當局強調，並非就間諜活動調查她。\n新加坡警方今年2月經諮詢總檢察署後，認為證據不足以確立黃樂涉及相關申報罪行。不過，警方認定她在調查期間提供明知不準確的資料，試圖淡化自己在公司的角色，因此向她發出嚴厲警告，並禁止她再次入境。當局於2月26日歸還護照，她同日離境；針對Megaspeed及另外6人的調查仍在進行。\nMegaspeed則表示，黃樂已於2025年8月離職，目前未在公司擔任任何職務，並反駁近期部分涉及其業務、供應鏈及全球營運的報道，指相關說法缺乏可核實證據。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc1f8231ca5","title":"廈門教區劉恆平祝聖主教4個月來全國第六位","url":"https://www.stheadline.com/realtime-china/3638761/廈門教區劉恆平祝聖主教4個月來全國第六位","summary":"內地再有天主教主教獲祝聖。","summary_short":"內地再有天主教主教獲祝聖。","digest":"內地再有天主教主教獲祝聖","points":["內地再有天主教主教獲祝聖","天主教廈門教區劉恆平主教祝聖典禮昨日在福建省廈門市鷺江道天主教堂舉行","這是4個月來內地第六名獲祝聖的主教，據了解同樣獲得中梵雙方認可"],"section":"其他","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:34:11+08:00","size":1,"keywords":[],"body":"內地再有天主教主教獲祝聖。天主教廈門教區劉恆平主教祝聖典禮昨日在福建省廈門市鷺江道天主教堂舉行。這是4個月來內地第六名獲祝聖的主教，據了解同樣獲得中梵雙方認可。典禮由中國天主教主教團副主席、杭州教區楊永強主教主禮。神父、修女和教友代表共500人參加祝聖典禮。\n現年54歲的劉恆平，生於福建省漳州市龍海區，在上海佘山修院攻讀神哲學，現任福建省天主教愛國會副主任，今年6月當選為廈門教區候任主教。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cba23198f97","title":"上课点名、体育长跑、饭卡充值……校园App为何越装越多？","url":"https://www.chinanews.com.cn/edu/2026/11-19/10734464.shtml","summary":"近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。","summary_short":"近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。","digest":"近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生…","points":["近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生…","体育环(长)跑、上课点名、接水饮水、饭卡充值……校园生活的每一处场景…","“校园App臃肿”的话题在网上引发激烈讨论，仅微博平台的相关话题阅读量就接近1亿"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:30:29+08:00","size":1,"keywords":[],"body":"近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。体育环(长)跑、上课点名、接水饮水、饭卡充值……校园生活的每一处场景，几乎都对应着不同的App或小程序。“校园App臃肿”的话题在网上引发激烈讨论，仅微博平台的相关话题阅读量就接近1亿。校园App为何越装越多？解决之道何在？\r\n\n　　校园里的数据孤岛\n\n　　打开不少大学生的手机，“超星学习通”“今日校园”“创高体育”“U净洗衣”“胖乖生活”等不同门类的App占满了屏幕，每一个都需要单独下载、注册并授权。2025年12月，一项面向全国高校大学生的问卷调查显示，97.72%的受访者日常使用校园App，其中93.89%的受访者在使用过程中受到不同程度的困扰。\n\n　　尽管吐槽不断，但独属校园的这些App又“不得不用”。以上课为例，三四个App都能签到，两三个平台都可随堂测验，任课老师挑自己顺手的用，学生却一个都不敢删。北京某高校大二学生小玖受访时表示，其英语课作业需用3个App才能完成：“批改网”写作文、“U校园”听听力、“fif口语训练平台”练口语。“它们太占内存了，等学期结束后，我打算都删了。”小玖说。\n\n　　有些应用看似体贴地提供了微信、支付宝小程序作为“轻量替代”，功能却大打折扣。华中某高校的学生宿舍洗衣机关联着“海乐生活”平台，学生小林就因小程序常常卡顿、无法使用预约功能，不得不专门下载了App。\n\n　　除了功能单一，商业广告多、运行不稳定、存在数据泄露风险等问题，这类校园App让学生不堪其扰。小玖学校的饮水机用的是一款叫“慧生活798”的App，每次喝水前都得先连着关掉几个弹窗，稍不留意就会“跳转”到购物软件。不少网友抱怨“洗个澡得先看一串广告”“看完广告热水都凉了”。\n\n　　校企各方整合难\n\n　　部分校园App乱象的根源，在于一些高校各部门各自为政，教务、学工、后勤、团委等部门往往只关注自身的管理需求，各部门对接不同供应商：每当合约到期、重新招标，系统便可能整体更换，学生只能重新下载、注册。\n\n　　企业逐利，绑架了学生的刚需。由第三方企业运营的生活服务类App一旦与校园生活强绑定，学生的手机便成为企业“跑马圈地”的沃土。对企业而言，校园是稳定的精准流量池，开屏广告、跳转流量与支付分成，共同构成了这个近乎稳赚不赔的商业闭环。有些App还强制要求开通免密支付、自动扣费，或设置最低充值金额。若学生想要退款，则颇为麻烦，甚至需要拨打12315投诉热线才能成功维权。\n\n　　在智慧校园的建设过程中，App的数量更被部分高校领导当作数字化建设的“成绩单”。校方只在意表面形式，并不关心学生使用是否便捷。西北某高校一位研究生透露，她居住的宿舍楼，若是热水器坏了，需要学生自己打电话给设备维修人员。“学校才不管，凡是不涉及安全的事，一律外包。”北方某高校一名在校内网络中心勤工俭学的学生发现，学校的部分系统版本仍停留在本世纪初，与新搭建的平台集成时问题不断，但“领导觉得好，我们就得用”。\n\n　　更何况，对于一些高校而言，新建一个平台远比多下载一个App来得麻烦——整合各方意味着协调各部门权责、触动企业利益、打破路径依赖。谁来牵头？谁来出钱？数据归谁管？就算高校有心，又能否真正实现？西部某高校相关负责人坦言，一些高校尝试自主研发软件系统，但技术能力有限，常出现各类故障；一些高校则外包给第三方，也常面临业务功能与现有系统不兼容，导致平台瘫痪的问题。\n\n　　年轻人开始自己动手\n\n　　好的数字化，应当围绕“人”转。2019年，教育部等8部门印发意见，划定备案审查、自愿选用的底线。近年来，相关部门也多次开展专项整治，要求清理冗余应用、规范广告推送。2026年8月，个人信息保护系列专项行动取得阶段性成效，不得过度收集个人信息的“最小必要”原则持续收紧。少一些“屏幕上的形式主义”，多一些“一个平台全托管”的踏实，才能让高校师生真正享受到智慧校园的便捷服务。\n\n　　如今，不少熟悉AI工具的学生选择“自力更生”：以Vibecoding的方式自行搭建集成式校园平台。来自华南某高校的小鹤同学，因为请假和订校车这两件“小事”反复受阻，所以萌生了自己动手的念头。他前后用了3天时间，搭建了一个可以代管自己在校事务的Agent，并将开源代码发布到网上。上海学生小C则围绕“Z世代校园数字生态系统设计”课题，仅用1天就搭起了一站式整合方案的雏形。\n\n　　西南大学教育学部教授彭泽平认为，高校应牵头建设功能高度集成、数据统一汇聚的智慧校园基础平台。学生之所以自行开发，根源在于其对轻量化、场景化、个性化服务的需求，与校方所提供的标准化、统一化平台之间存在错位。这些自下而上的实践不仅贴近场景，还能成为校方优化服务的“鲜活信号”。有学生反映，他使用的校园App就是民间自行开发、后被学校网络中心“招安”的，“功能越来越多，确实方便不少”。\n\n　　与其让学生各自“破墙”，不如敞开大门。重庆市教育科学研究院助理研究员邹南芳建议，将学生设计应用纳入课程学习、科研训练、专业实践等培养环节，实现数字化治理与人才培养的有机统一。在数据安全、接口合规、个人信息保护、可持续维护和责任归属等方面，学生自制应用存在一定的不确定性，校方可以开放合规、分级的标准化数据接口，建设开发沙箱与测试机制，按“最小必要”原则界定调用权限，让年轻人的热情与创造力在规则边界内自由奔涌、充分释放。\n\n　　半月谈记者：徐盛悦\n\n　　原标题《开学一个多月，手机多了十几个App》 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf83ccf4d35","title":"趙本山真聲獻唱網劇主題曲《慌啥子嘛》走紅","url":"https://www.stheadline.com/realtime-china/3638759/趙本山真聲獻唱網劇主題曲慌啥子嘛走紅","summary":"「慌啥子嘛，慢慢來。","summary_short":"「慌啥子嘛，慢慢來。","digest":"趙本山真聲獻唱網劇主題曲《慌啥子嘛》走紅","points":["」久未在大眾前露面的內地著名喜劇小品演員趙本山，近日為網劇獻聲演唱的歌曲《慌啥子嘛》爆紅","歌曲上線僅3小時，點讚便突破百萬，抖音相關話題播放量破兩億次","11月13日，趙本山真人版的《慌啥子嘛》作為趙家班新劇《走馬上任》的推廣曲正式上線"],"section":"其他","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:28:44+08:00","size":1,"keywords":[],"body":"「慌啥子嘛，慢慢來。」久未在大眾前露面的內地著名喜劇小品演員趙本山，近日為網劇獻聲演唱的歌曲《慌啥子嘛》爆紅。歌曲上線僅3小時，點讚便突破百萬，抖音相關話題播放量破兩億次。不少網民深受觸動，直言聽到落淚。\n《慌啥子嘛》最初是首含川渝方言的網絡歌曲，早前有網友以AI技術模仿趙本山聲線翻唱，在網上廣傳。面對這宗疑似侵權的創作，趙本山未有追究，反而主動聯絡原作者購入版權，親自走進錄音室重新錄製。\n\n11月13日，趙本山真人版的《慌啥子嘛》作為趙家班新劇《走馬上任》的推廣曲正式上線。官方發放的錄音花絮所見，趙本山戴上耳機，逐句反覆揣摩唱腔。他解釋願意獻唱的原因十分簡單：「孩子們愛聽，那我就唱唄。」\n這首歌歌詞簡單質樸：「慌啥子嘛，慢慢來。卸下一身的疲憊，今夜枕著星光再入睡。人生路還遠，你不必事事都完美。」\n真人版本推出後，在網上掀起巨大反響。內媒《長沙晚報》撰評稱，這首歌走紅背後是普通人對鬆弛感的集體渴望，一句「慢慢來」並非鼓勵躺平，而是給緊繃的生活按下了一個短暫停鍵。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1b4f1e872b","title":"黃仁勳下台｜Nvidia宣布提前加薪派股權穩軍心 重申無意讓黃回歸","url":"https://www.stheadline.com/realtime-world/3638754/黃仁勳下台Nvidia宣布提前加薪派股權穩軍心-重申無意讓黃回歸","summary":"英偉達（Nvidia，又稱輝達）在創辦人兼行政總裁黃仁勳因婚外婚醜聞辭職後，周三（18日）首次召開全體員工大會。","summary_short":"英偉達（Nvidia，又稱輝達）在創辦人兼行政總裁黃仁勳因婚外婚醜聞辭職後，周三（18日）首次召開全體員工大會。","digest":"英偉達（Nvidia，又稱輝達）在創辦人兼行政總裁黃仁勳因婚外婚醜聞辭職後…","points":["英偉達（Nvidia，又稱輝達）在創辦人兼行政總裁黃仁勳因婚外婚醜聞辭職後…","臨時行政總裁克雷斯（Colette Kress）宣布，將加薪及額外股權獎勵提前至12月落實…","管理層同時重申，董事會正物色永久行政總裁，無意讓黃仁勳復職"],"section":"其他","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:11:29+08:00","size":1,"keywords":[],"body":"英偉達（Nvidia，又稱輝達）在創辦人兼行政總裁黃仁勳因婚外婚醜聞辭職後，周三（18日）首次召開全體員工大會。臨時行政總裁克雷斯（Colette Kress）宣布，將加薪及額外股權獎勵提前至12月落實，較慣常春季調薪周期提早數月，藉此安撫員工對薪酬及公司前景的憂慮。管理層同時重申，董事會正物色永久行政總裁，無意讓黃仁勳復職。\n700條員工提問　薪酬最受關注\n據《WIRED》取得的會議發言內容，員工事前提交約700條問題，薪酬是最熱門議題，其次是要求董事會提高透明度。克雷斯表示，公司希望照顧每一位員工，讓大家對公司保持信心，毋須擔心薪酬，並承諾12月將有加薪及更多股權獎勵。\n《金融時報》引述知情人士指出，英偉達原本在春季進行年度考核及調薪。黃仁勳離任後，部分員工憂慮股價下跌會削弱股票薪酬的價值，提前調薪及發放股權獎勵，被視為新管理層穩定士氣的重要措施。\n克雷斯開場籲「繼續向前走」\nCNBC引述與會人士報道，克雷斯以「Let’s move forward」（讓我們繼續向前走）揭開大會序幕，新任董事會主席Harvey Jones及多名資深主管亦有發言。會議在加州聖克拉拉舉行，並透過網上平台向員工直播。\n面對部分員工希望黃仁勳回歸的聲音，管理層再次表明，董事會已一致接受其辭呈，並無意重新委任他為行政總裁。英偉達早前公布，永久接班人的遴選將同時考慮內部及外部人選；克雷斯過渡期間繼續兼任財務總監。\n強調產品路線不變　擴大高層維繫客戶角色\n《商業內幕》報道，主管在會上強調，公司產品路線圖、客戶關係及執行策略維持不變，客戶與合作夥伴亦在領導層變動後表達支持。不過，公司需要由更廣泛的高層團隊承擔維繫客戶的工作，延續過往由黃仁勳親自建立的聯繫。\n軟件工程高級副總裁Diercks亦表示，公司仍致力完成收購開放模型平台Hugging Face。這並非會上首次提出的新收購構想：英偉達早於9月已公布相關協議，預計2027年上半年完成，仍須取得監管批准及符合其他交割條件。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca00c2c751f","title":"沙特主导的联军称摧毁胡塞武装60个军事目标","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734452.shtml","summary":"中新网11月19日电 综合外媒报道，当地时间18日，沙特阿拉伯主导的多国联军发言人马利基表示，对也门胡塞武装实施了专项军事行动，摧毁了该组织位于也门萨那、荷台达、阿姆兰和萨达省的60个军事目标。","summary_short":"中新网11月19日电 综合外媒报道，当地时间18日，沙特阿拉伯主导的多国联军发言人马利基表示…","digest":"综合外媒报道，当地时间18日，沙特阿拉伯主导的多国联军发言人马利基表示…","points":["中新网11月19日电 综合外媒报道，当地时间18日…","声明称，此次行动旨在削弱胡塞武装发射弹道导弹和无人机的能力，并应对海上安全面临的威胁","声明还称，打击目标包括用于储存弹道导弹的山体隧道，以及无人机组装和储存设施"],"section":"其他","category":"兩岸國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T07:43:53+08:00","size":1,"keywords":[],"body":"中新网11月19日电 综合外媒报道，当地时间18日，沙特阿拉伯主导的多国联军发言人马利基表示，对也门胡塞武装实施了专项军事行动，摧毁了该组织位于也门萨那、荷台达、阿姆兰和萨达省的60个军事目标。\n\n　　声明称，此次行动旨在削弱胡塞武装发射弹道导弹和无人机的能力，并应对海上安全面临的威胁。\n\n　　声明还称，打击目标包括用于储存弹道导弹的山体隧道，以及无人机组装和储存设施。\n\n 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0b8a333d0d","title":"常态化整治群众身边不正之风和腐败问题（学习贯彻党的二十届五中全会精神）","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734446.shtml","summary":"刘金国  　　习近平总书记强调，“民心是最大的政治”，“为民造福是最大政绩”。","summary_short":"刘金国  　　习近平总书记强调，“民心是最大的政治”，“为民造福是最大政绩”。","digest":"刘金国  　　习近平总书记强调，“民心是最大的政治”，“为民造福是最大政绩”","points":["习近平总书记强调，“民心是最大的政治”，“为民造福是最大政绩”","我们党是全心全意为人民服务的马克思主义执政党，管党治党归根结底是为了坚守党的初心使命…","党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》…"],"section":"其他","category":"兩岸國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T07:34:36+08:00","size":1,"keywords":[],"body":"刘金国\n\n　　习近平总书记强调，“民心是最大的政治”，“为民造福是最大政绩”。我们党是全心全意为人民服务的马克思主义执政党，管党治党归根结底是为了坚守党的初心使命、性质宗旨，实现好、维护好、发展好最广大人民根本利益。党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》，对“常态化整治群众身边不正之风和腐败问题”作出重要部署，充分体现了以习近平同志为核心的党中央始终坚持以人民为中心的发展思想，把人民放在心中最高位置。我们要深刻领悟“两个确立”的决定性意义、坚决做到“两个维护”，认真学习贯彻全会精神，不断深化认识，发扬成绩，怀着对人民群众的深厚感情，持续推进群众身边不正之风和腐败问题整治工作。\n\n　　一、整治群众身边不正之风和腐败问题意义重大\n\n　　(一)这是践行人民至上理念、巩固党的执政根基的必然要求。党的根基在人民、血脉在人民、力量在人民，党同人民是鱼水关系，一刻也不能脱离群众。发生在群众身边的不正之风和腐败问题，损害老百姓切身利益，啃食人民群众获得感，割裂党同人民群众的血肉联系，如果任其蔓延，党就会失去民心，甚至走向衰败。整治群众身边不正之风和腐败问题，是老百姓期盼的实事，是关系党的执政根基的大事，怎么用力抓都不为过。只有坚持为人民而战，把群众利益放在第一位，凡是群众反映强烈的问题都严肃认真对待，凡是侵害群众利益的行为都坚决纠正，才能不断厚植我们党长期执政的群众基础，确保红色江山永不变色。\n\n　　(二)这是持续推动全面从严治党和反腐败斗争向基层延伸的重要举措。新时代全面从严治党和反腐败斗争取得历史性成就，开辟了百年大党自我革命新境界。但必须清醒看到，“上热中温下冷”现象还不同程度存在，特别是群众身边不正之风和腐败问题量大、面广、多发，人民群众对近在眼前的“蝇贪蚁腐”深恶痛绝，迫切渴望加以整治。习近平总书记强调：“我们党强力反腐，纠‘四风’树新风，是为了赢得党心民心。如果上面九级风浪、下面纹丝不动，怎么能得到人民群众衷心拥护？”正风反腐，不仅要“打老虎”，也要“拍苍蝇”，让老百姓可感可及、真正受益。只有对基层风腐问题零容忍、严惩治，才能打通全面从严治党“最后一公里”，让人民群众切实感受到党中央和习近平总书记的关心关爱就在身边，公平正义就在身边。\n\n　　(三)这是优化基层治理、推动中国式现代化行稳致远的重要保障。基层治理是国家治理的基石。习近平总书记指出，基层是改革发展稳定的第一线，是各种矛盾和问题的集聚地，必须抓好基层治理现代化这项基础性工作。群众身边不正之风和腐败问题暴露出基层治理还存在很多薄弱环节，如果长期得不到有效解决，就会影响中国式现代化事业顺利推进。只有树立大抓基层鲜明导向，持续整治群众身边不正之风和腐败问题，坚持一体推进不敢腐不能腐不想腐，深化以案促改促治，补齐基层治理短板，护航基层经济发展，化解基层矛盾，建强基层党组织战斗堡垒，才能打牢国家治理体系的坚实底座，为凝心聚力推进中国式现代化提供有力支撑。\n\n　　二、三年集中整治的成效和经验\n\n　　习近平总书记对人民群众感情最深厚，对老百姓急难愁盼最牵挂，高度重视整治群众身边不正之风和腐败问题，多次作出重要指示批示、提出明确要求。中央纪委国家监委坚决贯彻落实党中央决策部署和习近平总书记重要指示批示精神，自2024年起在全国开展群众身边不正之风和腐败问题集中整治，集中时间、集中精力、集中力量超常规推进，各地区各有关部门共同发力，取得了让老百姓得实惠、我们党得民心的效果。\n\n　　(一)惩治了一大批“蝇贪蚁腐”。“蝇贪蚁腐”其害如虎。集中整治以办案开路，中央纪委国家监委直接查办督办、强化指导，带动各级纪检监察机关强力办案。截至2026年9月，全国查处群众身边不正之风和腐败问题235.8万个、处分163万人、留置11.2万人、移送检察机关5.8万人。紧盯民愤大、反映多的“关键少数”，处分现任或原任县级以下“一把手”38万人。突破一批“骨头案”、“钉子案”，查办一批贪腐上千万的“小官大贪”，挖出一批地域性系统性窝案串案，侵害民利的违纪违法问题得到有力遏制。直接或推动返还群众被吃拿卡要、贪占挪用等的财物2304.8亿元。\n\n　　(二)解决了一大批群众急难愁盼问题。从人民群众最关心最直接最现实的利益问题入手，集中整改整治群众反映强烈的突出问题748.1万个，覆盖衣食住行、生老病葬、安居乐业等20多个领域，推动办成了许多过去想办而没有办成的实事难事，增进民生福祉，有的立竿见影、有的长远受益。攻坚治理民生领域信访问题，化解一批10年以上积案，攻克一批跨地区跨部门难案，有力维护群众合法权益。2025年，中央纪委国家监委接收检举控告量在2024年下降9.5%基础上又下降6.2%。聚焦不动产登记难问题，推动出台政策性文件，化解630万套房屋历史遗留问题，一些群众拿到了期盼20多年的房产证。坚决整治趋利性执法、违规异地执法等乱象，为企业挽回经济损失310亿余元。推动补发村干部报酬110亿元，为11万名环卫工人补发工资8.2亿元。推动纠治残疾人等级评定不精准问题95.37万个，追缴违规资金2110.7万元，增发补发各项补贴6.3亿元，有力保障残疾人权益。推动打掉一批涉黑涉恶组织，深挖背后的腐败问题及“保护伞”，处分8179人。\n\n　　(三)破解了许多民生领域的顽瘴痼疾。针对一些民生行业乱象丛生、党中央惠民政策“沙滩流水不到头”等问题，小切口、大纵深推进7个全国性整治项目和24项民生实事，先后出台69个全国性制度规定，重点民生领域治理取得突破性进展。强力整治“校园餐”问题，首次摸清全国校园食堂供餐规模，查处贪占学生餐费、插手招标采购等问题13万个，推动建立从源头到餐桌的全链条监管责任体系，学校食堂保障条件和管理水平明显提升，“校园餐”质量普遍提高，学生吃得更安心、家长更放心。开展整治殡葬领域腐败乱象专项行动，严肃查改天价骨灰盒、“靠墓吃墓”等问题，推动殡葬行业回归公益属性，全国经营性公墓均价明显下降，群众抱怨的“葬不起”问题得到有效解决。狠抓高标准农田建设问题整治，严查资金截留挪用、利益输送、监管不力等违纪违法行为，整改工程质量缺陷、管护不力等问题21万个。针对套取骗取医保基金等问题，深入整顿医保领域乱象，严查党员、干部失职失责问题，斩断骗保利益链条，追回群众医保“看病钱”572.3亿元。\n\n　　(四)有效提升基层监督治理水平。加强对基层的指导和帮助，推动资源力量下沉，着力解决基层治理“小马拉大车”问题。中央纪委国家监委直接督办1.6万个基层问题，推动解决35项“表现在基层、根子在上面”问题。各级各有关部门党员、干部沉到一线参与整治、纾困解难。行政执法监督平台、农村集体“三资”平台等直通县乡村，赋能基层治理。完善基层监督体系，推动纪检监察监督与巡视巡察、审计、财会等监督贯通协调，持续提升基层监督治理效能。坚决整治形式主义为基层减负，公开通报30起典型案例。\n\n　　国家统计局民意调查结果显示，农村居民对集中整治效果认可的比例达到96%，人民群众发自内心念党好、感党恩，更加爱戴习近平总书记、拥护党中央。在三年集中整治中，各地区各有关部门深入践行习近平新时代中国特色社会主义思想特别是习近平党建思想，坚持学以致用、用以促干，积累了经验，为常态化整治打下良好基础。\n\n　　一是发挥党的领导优势，压实责任聚合力。党的领导是各方合力、“一盘棋”推进集中整治的根本保证。必须始终压实责任，党政主责靠前主抓、纪委牵头全力推动、部门协同一贯到底、市县主战抓乡促村，引导人民群众广泛参与，横向联动、纵向贯通、全面发力，形成强劲态势。\n\n　　二是落实全面从严要求，强力办案揭盖子。办案是最直接、最有力的整治措施，这一手决不能松。必须始终坚持以办案带全局，对问题线索全面排查起底、集中优势力量突破，对涉及范围广、影响恶劣的从严查处，对疑难复杂、干扰多阻力大的联动攻坚，提级办理，查深查透。\n\n　　三是始终树牢宗旨意识，用情用力办实事。老百姓是天，老百姓是地。必须始终把老百姓的事当成自己的事，想尽办法解决群众反映强烈的痛点难点问题，真正守好百姓的钱、办好群众的事、治好为民的权。坚持开门搞整治，充分依靠群众，回应群众诉求，接受群众评判。千好万好老百姓说好才是真的好，千条万条老百姓的感受是第一条。\n\n　　四是聚焦工作短板漏洞，建章立制固成果。制度建设是打基础、利长远的，必须坚持运用改革的办法巩固整治成果，推动制度治权、依规治权。坚持“查改治”一体推进，把正风反腐与深化改革、完善制度、促进治理贯通起来，推动职能部门加强监管、堵塞漏洞，健全维护群众利益常态长效机制。\n\n　　五是强化基层支撑保障，督帮结合促提升。集中整治主战场在基层，必须聚焦县级以下补短板、强弱项。坚持抓两头、带中间，加强调度、督导、调研，对薄弱地区“一县一策”分类指导，促进整体提升。深化基层监督体制机制改革，优化县乡纪检监察机构设置和力量配备，推动监督下沉。\n\n　　六是正确运用政策策略，务实唯实保质效。基层情况千差万别，必须坚持实事求是，一切从实际出发，不下指标、不搞“一刀切”、不办“凑数案”。坚持惩前毖后、治病救人，准确运用“四种形态”，宽严相济、区别对待，激励干部担当作为。坚持从群众愿望和实际需要出发，突出重点，动真碰硬推进整治项目、办好民生实事，确保抓一个成一个，以看得见、摸得着的实际成效取信于民。\n\n　　三、常态长效推进整治工作\n\n　　群众身边不正之风和腐败问题积弊甚深，必须保持永远在路上的坚韧执着，以钉钉子精神系统整治，不断巩固、扩大成果。\n\n　　(一)健全齐抓共管责任体系。常态化整治要取得实效，各方主动担责、协同发力是关键。各级党委和政府扛牢主体责任，健全整治责任机制，加强统筹领导，靠前真抓实抓，增强整治工作整体性、协同性。职能部门切实履行行业主管和部门监管责任。纪委监委立足“监督的再监督”，加强对责任落实情况的监督检查，逐级拧紧责任螺丝。推动把常态化整治情况纳入党政督查、巡视巡察和部门评议、干部考核，强化结果运用，坚持“好的表扬、差的批评”，对履责不力的严肃问责并通报曝光。\n\n　　(二)纵深推进基层正风反腐。发扬斗争精神，狠抓办案不放松，对老问题深挖彻查，对新问题露头就打，持续形成强大震慑。紧盯资金使用、项目审批、工程建设等基层公权力运行关键环节，用好督办直办、片区协作、大数据比对等手段，深入排查问题线索，严查群众反映强烈的突出问题，坚决斩断伸向群众利益的“黑手”。对被贪占的财物应返尽返，承诺事项务必做到，让人民群众有更多更直接的获得感。深化以案促改促治，有针对性制发纪检监察建议书，逐一跟踪问效，确保整改到位。\n\n　　(三)闭环整治民生突出问题。紧扣民生痛点强力攻坚，一个问题一个问题解决。对问题多发的民生领域开展全国性整治，推动职能部门抓条线、带系统，全面查改乱象。指导各地因地制宜找准切口，完善领导包联、“纪巡审”贯通、拉网式排查等措施，真抓实干为群众办实事解难题。健全“群众点题、部门答题、纪委监督、社会评价”机制，抓好普惠性、基础性、兜底性民生实事，真正把工作做到群众心坎上。\n\n　　(四)系统施治提升基层治理水平。坚持党建引领基层治理，把整治工作与乡村振兴、基层组织建设、整治形式主义为基层减负等工作贯通起来，更好发挥基层党组织战斗堡垒作用和党员先锋模范作用。持续推动基层党务政务公开，统筹推进信息化平台建设，解决好监管缺位、数据壁垒等深层次问题，规范基层小微权力运行。注重发动群众、依靠群众，坚持和发展新时代“枫桥经验”，及时有效化解各类矛盾纠纷，提升基层治理效能。 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce5597225aa","title":"中国驻欧盟使团举办专题讲座阐释台湾问题中方原则立场","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734442.shtml","summary":"中新社布鲁塞尔11月18日电 (记者 德永健)中国驻欧盟使团17日在布鲁塞尔举办专题讲座，阐释台湾问题中方原则立场和政策主张。","summary_short":"中新社布鲁塞尔11月18日电 (记者 德永健)中国驻欧盟使团17日在布鲁塞尔举办专题讲座…","digest":"中国驻欧盟使团17日在布鲁塞尔举办专题讲座，阐释台湾问题中方原则立场和政策主张","points":["讲座由中国驻欧盟使团团长蔡润主持，第十四届全国政协常委、外事委员会副主任刘结一应邀主讲…","欧盟官员、欧洲议会议员、有关国家驻欧盟使节、智库学者等各界人士180余人参加讲座","蔡润表示，中欧关系发展积累起多方面宝贵经验，关键是尊重各自人民选择的社会制度和发展道路…"],"section":"其他","category":"兩岸國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T07:30:04+08:00","size":1,"keywords":[],"body":"中新社布鲁塞尔11月18日电 (记者 德永健)中国驻欧盟使团17日在布鲁塞尔举办专题讲座，阐释台湾问题中方原则立场和政策主张。\n\n　　讲座由中国驻欧盟使团团长蔡润主持，第十四届全国政协常委、外事委员会副主任刘结一应邀主讲，中国政府欧洲事务特别代表卢沙野、第十四届全国政协委员、中华全国台湾同胞联谊会副会长蔡睿等专家组成员一同出席。欧盟官员、欧洲议会议员、有关国家驻欧盟使节、智库学者等各界人士180余人参加讲座。\n\n　　刘结一系统阐释台湾问题的历史经纬、法理事实，全面介绍两岸关系现状，深入解读中国政府在台湾问题上的原则立场和政策主张，强调台湾问题是中国核心利益中的核心，希望欧方顺应大势，站在历史正确一边，切实尊重中国主权和领土完整，支持中国统一大业。\n\n　　蔡润表示，中欧关系发展积累起多方面宝贵经验，关键是尊重各自人民选择的社会制度和发展道路，尊重彼此核心利益和重大关切。希望欧方充分认识台湾问题的重要性敏感性，以实际行动恪守一个中国原则，尊重支持中方核心利益。\r\n\n　　讲座现场气氛热烈。来宾们积极评价讲座，认为增进了对台湾问题和中方立场的理解认识，愿努力推动欧中关系健康稳定发展。(完) 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c556903bdf6","title":"26萬輕改康城300呎法式蝸居 原裝廚房「轉色」添中島 圓拱門洞劃分工作睡眠區","url":"https://www.stheadline.com/renovation/3638477/26萬輕改康城300呎法式蝸居-原裝廚房轉色添中島-圓拱門洞劃分工作睡眠區","summary":"新盤自帶基本交樓裝修，雖可省卻不少工程，但格局及用料往往較為劃一，如何沿用原有基礎，同時融入個人喜好與生活習慣，便成為改造關鍵。","summary_short":"新盤自帶基本交樓裝修，雖可省卻不少工程，但格局及用料往往較為劃一，如何沿用原有基礎，同時融入個人喜好與生活習慣…","digest":"新盤自帶基本交樓裝修，雖可省卻不少工程，但格局及用料往往較為劃一，如何沿用原有基礎…","points":["新盤自帶基本交樓裝修，雖可省卻不少工程，但格局及用料往往較為劃一，如何沿用原有基礎…","日出康城Grand Season一個300多方呎一房單位…","團隊保留原有裝修，以鼠尾草綠與淺木色為主調，配搭歐式花線、水波玻璃及圓拱元素…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T06:00:30+08:00","size":1,"keywords":[],"body":"新盤自帶基本交樓裝修，雖可省卻不少工程，但格局及用料往往較為劃一，如何沿用原有基礎，同時融入個人喜好與生活習慣，便成為改造關鍵。日出康城Grand Season一個300多方呎一房單位，獨居的女戶主偏愛自然色系與法式元素，亦熱愛煮食及烘焙，遂斥資約26萬元，委託Mstudio微工作室設計總監Marcus Ko操刀。團隊保留原有裝修，以鼠尾草綠與淺木色為主調，配搭歐式花線、水波玻璃及圓拱元素，並增設弧形中島擴充烘焙操作空間，睡房則劃分工作與休息兩區，在有限面積內兼顧實用需要與輕法式格調。\n沿用新樓裝修 拆鞋櫃重整玄關\n單位屬一手新盤，原有木地板等交樓裝修狀況良好，團隊因此未有大幅拆改，而是將工程集中於訂製傢俬、櫃門飾面及配色，透過局部改動，為全屋建立一致風格。\n團隊重新規劃大門旁的儲物空間，新造到頂鞋櫃與矮櫃沿牆排列，令入口一帶的櫃體線條更整齊連貫。\n玄關是少數需要拆改的位置。發展商原設鞋櫃的開門方向及布局，未能配合新增櫃體與枱面的配置，團隊遂將其拆除，重新規劃大門旁的儲物空間。新造到頂鞋櫃與矮櫃沿牆排列，令入口一帶的櫃體線條更整齊連貫。\n櫃身採用低飽和、帶灰調的鼠尾草綠，配搭古銅金色拉手及淺木開放層架，甫進門已見全屋主調。原有淺木地板則貫穿公共空間，以溫潤木色平衡綠色櫃身，亦讓新增傢俬自然融入交樓裝修。\n廚櫃「轉色」融入全屋 弧形中島擴充烘焙空間\n女戶主熱愛煮食及烘焙，惟原有開放式廚房的枱面有限，搓麵糰、備料及製作甜點時難免侷促。如何在不大改格局的前提下增加操作空間，遂成為改造重點之一。\n團隊保留廚房原有位置及主要設備，集中從櫃門飾面着手，以鼠尾草綠框線門板配搭淺色工作枱及古銅金色拉手，讓原本風格較中性的廚櫃融入全屋設計。部分吊櫃改用水波玻璃門，透過帶紋理的半透明材質，隱約透出櫃內物件，既增添光影層次，視覺上亦較全實心門板輕盈；其間穿插淺木背板，呼應原有木地板。\n為補足烘焙所需的操作位置，團隊在廚房與客廳之間增設弧形中島，方便戶主搓麵糰、準備材料及製作甜點。\n為補足烘焙所需的操作位置，團隊在廚房與客廳之間增設弧形中島，方便戶主搓麵糰、準備材料及製作甜點。中島下方設有儲物空間，可收納體積較大的煮食及烘焙器具；靠通道一端則以圓弧收邊，減少尖角對走動的影響，同時柔化櫃體線條。\n鼠尾草綠櫃牆定調 拱形木飾面添層次\n由廚房延伸至客廳，鼠尾草綠繼續貫穿兩側訂製櫃體，成為公共空間的主色。Marcus沒有將綠色大幅鋪滿牆身，而是集中用於儲物櫃、吊櫃及梳化背後的半高護牆，再以奶油白與淺木色調和，既突顯主題，亦避免小空間顯得沉重。\n櫃門加入簡化歐式花線及古銅金色五金，為平整櫃面增添細節；旁邊穿插淺木開放層架，將封閉儲物與展示位置分開，並以自然木質感中和法式裝飾的精緻感。\n靠露台一側設淺木色矮櫃，背後配以大型拱形木飾面，畫作及擺設可直接靠放於櫃面，構成客廳的視覺焦點。拱形輪廓呼應中島的弧角，在方正櫃體之間加入曲線，令整體觀感更柔和。\n客廳傢俬配置保持簡潔，梳化靠牆擺放，展示與儲物功能集中於另一側，中央則保留由入口通往露台的主要動線。淺木地板一路延伸至落地玻璃門，配合低身傢俬及自然採光，讓狹長客廳保持開揚。\n圓拱門洞分隔工作睡眠區 奶油白營造柔和寢區\n一房單位面積有限，睡房除了供休息，亦須兼顧工作及衣物收納。團隊以大型圓拱門洞為界，將靠入口的書枱、衣櫃區與靠窗的睡眠區分開，毋須另加門片或實牆。從工作位置望入房內，視線仍可穿過拱形開口，直達睡床及窗戶，在劃分功能之餘，亦保留採光與通透感。\n工作區沿牆整合書枱及到頂衣櫃，將工作、閱讀與衣物收納集中處理，減少零散傢俬佔用走道。鼠尾草綠框線櫃門配搭淺木枱面及古銅色拉手，延續公共空間的設計，用色則較為克制。\n由工作區進入寢區，須踏上一級淺木地台，透過高低差進一步區分兩個區域；圓拱門洞則猶如一道畫框，將靠窗睡床框入其中。相比公共空間，睡房減少了鼠尾草綠的比例，僅於衣櫃、書枱櫃及半高護牆局部點綴；睡眠位置則以奶油白牆身、米白軟包床頭及淺木色為主，營造柔和寧靜的休息氛圍。\n床頭牆加入簡化花線及壁燈，呼應圓拱曲線，保留輕法式細節，同時避免小房間因裝飾過多而顯得繁複。工作與睡眠兩區各有分工，色調亦由公共空間較鮮明的鼠尾草綠，逐步過渡至私人寢區的明亮柔和。\n圖片由Mstudio微工作室提供\n相關文章：百萬改造黃埔花園鑽石廳 石紋電視牆連窗台弱化斜角 L形玻璃酒櫃展示珍藏\n相關文章：140萬改造夫婦回港度假宅 法式中古風重留白 設計師巧用胡桃木包橫樑 結構限制變視覺主軸\n相關文章：110萬改造1400呎雙連戶 飾面板修飾鑽石廳 主人套房增海景健身區 打通兩房姊妹共享大空間\n相關文章：元朗300呎居屋一家三口住 40萬改造變兩房 傢俬牆雙面收納兼顧採光 一體化傢俬盡用空間\n相關文章：45萬改造元朗454呎新居屋 2房變3房一家三口各有空間 不減客廳採光 旋轉餐枱騰出空間\n相關文章：50萬翻新馬鞍山逾30年居屋 藍調配木色營造暖意 書房變身復古森系畫室\n相關文章：55萬改造大埔452呎奇則單位 訂造櫃巧妙「拉直」牆身化解三角位 榻榻米地台提升收納量\n相關文章：獨居教師40萬翻新344呎舊樓 捨兩房闢「藏書閣」 窗台變工作枱兼藏6人餐桌\n相關文章：180呎新居屋重塑老香港情懷 海棠玻璃配紙皮石增韻味 20萬裝修兼顧實用與舊居回憶\n相關文章：告別近40年舊洋樓局促感 夫婦50萬翻新變黑白灰質感宅 弧形天花巧妙化解橫樑壓迫\n相關文章：青衣近500呎舊公屋68萬大翻新 微水泥營造侘寂氛圍 兩房改三房兼設獨立電競角\n相關文章：120萬重塑931呎北歐風親子宅 一家四口與工人各有空間 雙兒童房伴成長 弧形玻璃廚房成焦點\n相關文章：200萬豪裝啟德千呎法式大宅 黑白花線貫穿全屋 升降機大堂化身專屬玄關 兩客房變夫妻衣帽間\n相關文章：三口之家住安達臣450呎居屋 40萬劃出兩房 圓角櫃牆化身玩偶展區 U型廚房盡用每寸空間\n相關文章：60萬翻新荃灣558呎上車盤 胡桃木重塑復古日系風 半開放式廚房成全屋焦點\n相關文章：一家三口住油塘280呎居屋 35萬裝修間出兩房 弧形玻璃取代實牆 現代神枱櫃融入玄關\n相關文章：443呎Y型公屋變身奶油風 50萬營造私樓格調 弧形燈槽修飾樑柱 一招引光入室\n相關文章：18萬築起《鬼滅之刃》大正復古風 融入和洋美學 胡桃木圍身防撞兼顧美感 一設計引海景入廳\n相關文章：60年舊唐樓大改造 拆劏房還原390呎原木風雅居 巧闢雜物房取代滿牆櫃\n相關文章：首置女生精裝365呎法式輕奢宅 黑框趟門劃出玄關添儀式感 改造步入式衣帽間圓夢","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7ba4fb9aa1","title":"Vibrant Bougainvillea in Nanning Qingxiushan","url":"https://news.tvb.com/tc/1207227-VibrantBougainvilleainNanningQingxiushan","summary":"Inside Guangxi's Nanning Qingxiushan Scenic Area, the bougainvillea blossoms have reached their dazz…","summary_short":"Inside Guang
