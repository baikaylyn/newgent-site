下跌3.6%。","digest":"網易第三季非公認會計準則純利91.64億元，按年下跌3.6%","points":["網易（9999）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%","淨收入為278.5億元，少1.8%","網易派第三季息每股0.117美元，按年增長2.6%"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:32:18+08:00","size":1,"keywords":[],"body":"網易（9999）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%。淨收入為278.5億元，少1.8%。網易派第三季息每股0.117美元，按年增長2.6%。\n網易：經營經得起時間考驗遊戲\n網易首席執行官丁磊表示，一如既往製作精品遊戲內容，並為經典遊戲不斷注入新內容與新玩法，以吸引更廣泛的玩家群體；同時籌備多品類、多平台、多市場的在研新品。他稱，將持續聚焦於將創意、技術革新與高效執行相結合，經營經得起時間考驗的遊戲產品，並鞏固研發與長線營運能力。\n《燕雲十六聲》全球用戶破一億\n該集團表示，其遊戲產品進一步提升全球市場的吸引力，例如《漫威爭鋒》推出新特性和新內容 ，深化與全球玩家的聯結；《燕雲十六聲》 全球用戶於8月突破1億名，彰顯其面向全球市場的遊戲研發與長線營運能力不斷增強。網易又指，新作《無限大》計劃於2027年1月15日在全球多平台上線，目前預約量已突破2700萬份。\n遊戲收入按季少8%\n以業務收入劃分，遊戲及相關增值服務淨收入為229億元，按年減少1.7%，按季亦跌8.4%，主要由於自研遊戲淨收入下降。有道淨收入14億元，減少12.3%，因其智能硬件和在線營銷服務淨收入下降。而網易雲音樂（9899）淨收入19億元，降低0.9%。創新及其他業務淨收入則為15億元，按年增加7.1%。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c579d07dc68","title":"从一槽铝水到一池微藻 邹平铝业构建绿色低碳闭环","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734753.shtml","summary":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电；一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……","summary_short":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板…","digest":"一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电…","points":["中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板","一辆V80轻量化车型每百公里少耗1度电","一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……在山东邹平…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:29:46+08:00","size":1,"keywords":[],"body":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电；一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……在山东邹平，起步于2001年的高端铝产业集群，正推动绿色低碳理念贯穿产业发展全链条。\n\n在山东省邹平市魏桥轻量化基地，工人正在焊接铝制车身。梁犇 摄\n\n　　“铝水不落地”，从源头削减碳排放\n\n　　邹平铝产业从2001年起步，经过20多年的发展，已形成氧化铝精炼、电解铝冶炼、合金化、铝材加工、零部件深加工、废铝回收再生、赤泥综合利用等完整产业链条。2025年，邹平高端铝产业集群实现营收2650亿元(人民币，下同)。\n\n　　走进魏桥轻量化基地，作为整车研发制造中枢的山东宏衍汽车有限公司，其全铝白车身项目于2024年8月立项，2025年顺利投产。该项目与宏畅轻合金项目一同被邹平经济技术开发区列为“突破关键技术瓶颈、填补国内相关领域空白”的重大项目。\n\n　　项目依托“铝水不落地”生产模式，上游联动宏畅轻合金年产20万吨特种轻合金材料项目，电解槽产出的铝水不经铸锭、不入仓库，直接送进熔保炉加工。表面看起来，仅是省了一道工序，但实际减掉的是二次熔炼的能耗、金属烧损和随之而来的碳排放。\n\n　　轻量化造车，每百公里节省1度电\n\n　　目前，魏桥轻量化基地布局宏畅、宏奥、宏衍、宏和、宏钧五大项目，形成集材料研发、型材加工、压铸成型、车身总成于一体的产业格局。\n\n　　山东宏奥汽车轻量化科技有限公司总经理贾正宇介绍说，2025年11月，魏桥新能源商用车第二代高端铝VAN车型V80正式上市，采用全球领先的铝基轻量化技术，在保证安全性和承载性的前提下，整车减重10%-20%，比同级别、同尺寸车型降重150kg-300kg，实现每百公里节电1度，有效降低整车能耗与运输成本。\n\n　　V80车间占地2.5万平方米，共规划3条生产线。全线配置高精度柔性机器人，整体自动化率超过70%，综合运用CMT焊接、激光焊接等连接技术，其中冷连接工艺占比达70%，有效控制热变形、保障车身尺寸精度，实现“零烟气、零飞溅、零强光”绿色生产。\n\n　　“车铝循环”，报废车辆实现铝料重生\n\n　　车辆有使用年限，但铝材可以循环不息。在中德宏顺循环科技产业园，一辆报废的机动车经过精细化拆解，车体铝料可转化为高品质铝水、铝锭，重新回到铝产业供应链。\n\n　　该产业园由中国宏桥集团与德国顺尔茨集团携手打造，由山东宏顺循环科技有限公司运营，总投资15亿元，占地500余亩，聚焦报废机动车回收拆解、再生铝生产、动力电池再生利用三大核心业务。\n\n　　山东宏顺循环科技有限公司总经理徐庆告诉记者，中德宏顺循环科技产业园引进国际先进生产工艺与智能装备，依托报废机动车精细拆解、自动化金属破碎分拣、再生铝除杂不降级三大核心技术，持续推进产业数字化、智能化升级。\n\n　　数据显示，生产1吨再生铝，能耗仅为原铝生产的5%，可节约3.4吨标准煤、节水14立方米、减少固体废物排放20吨，整体实现节能95%、碳减排85%以上。\n\n图为邹平市魏桥国科微藻高值化开发基地。梁犇 摄\n\n　　排放口变原料口，微藻固碳开辟减碳新路径\n\n　　一边是金属循环，一边是生物固碳。魏桥国科微藻高值化开发基地将电厂烟气中的二氧化碳转化为微藻生长的“养料”。微藻光合效率远超陆生植物，基地探索“二氧化碳生物减排+生态固碳”路径，构建“碳捕集-生物转化-资源高值利用”一体化模式。\n\n　　基地不仅“养藻”，还搭建微藻高附加值产品全流程研发、中试与产业化示范平台：先小试跑通工艺，再中试核算成本。这套攻关模式，依托魏桥国科强大的科创支撑。2019年，魏桥创业集团联合中国科学院大学、中信信托共建魏桥国科(滨州)研究院，开创了科学家、实业家、金融家“握指成拳、深度合作”的新模式。\n\n　　重工业排出的二氧化碳，滋养微藻；以微藻为原料，又延伸出多元产业链。基地把工业排放端和微藻生产端串联起来，填补电厂二氧化碳捕集和微藻高附加值产品开发领域空白，打通基础研究到产业化的技术链路，助力农业、食品、医药产业转型升级。\n\n　　目前，邹平市拥有氧化铝产能400万吨，电解铝产能218.1万吨，再生铝产能201万吨，精细氧化铝产能84.55万吨，铝精深加工能力600万吨。2026年1月至10月份，该市高端铝产业集群实现营收2300亿元，中高端铝制品占比达到79%。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"caf746e0ba2","title":"美军中央司令部司令访以商讨地区局势","url":"https://www.jiemian.com/article/15351659.html","summary":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列，与以军总参谋长扎米尔及以色列情报与特勤局（摩萨德）局长罗曼·戈夫曼在特拉维夫举行会谈。","summary_short":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","digest":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","points":["当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","双方讨论了地区局势发展与共同面临的安全挑战，并强调了深化两国军队间作战合作…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:24:35+08:00","size":1,"keywords":[],"body":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列，与以军总参谋长扎米尔及以色列情报与特勤局（摩萨德）局长罗曼·戈夫曼在特拉维夫举行会谈。双方讨论了地区局势发展与共同面临的安全挑战，并强调了深化两国军队间作战合作、加强协调以及提升联合战备状态以应对各类局势的重要性。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8d96c45f13","title":"PC出货大跌两成，但头部厂商反而越赚越多","url":"https://www.jiemian.com/article/15351589.html","summary":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。","summary_short":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。","digest":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI…","points":["前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI…","杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题","一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:17:19+08:00","size":1,"keywords":[],"body":"文｜道总有理\n\n前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题。\n\n李彦宏的想法其实很符合逻辑，AI目前使用的最佳场景是PC而不是手机。那必然会对PC有一定的带动作用。\n\n但事实上，答案可能非常反直觉。\n\nIDC最新公布的数据显示，2026年第三季度，全球PC出货量为6270万台，同比下降20.1%。联想、惠普、戴尔、苹果、华硕，排名前五的厂商无一增长。联想出货量同比下滑22.6%，惠普同比下滑30.9%，包括苹果，Mac的出货量都跌了11.3%。\n\n被各路大佬频繁提及的“AI带动PC出货论”在一组组惨淡的数据面前显得格外无力。\n\n但更反直觉的是，尽管AI没有真的带动PC出货量，几大头部厂商的财报业绩却可圈可点。\n\n以联想为例，2025/26财年第三财季业绩：集团营收1575亿元人民币，同比增长18%；净利润同比增长36%，利润增速达到营收增速的两倍。\n\n苹果Mac收入107.9亿美元，同比增长23.7%；戴尔年内股价至高点累计涨幅一度高达259%。\n\nAI带不动PC出货量，却带动了厂商的“钱包”，头部厂商还要不要继续纠结出货数字是个问题。但问题背后更值得探讨的是，PC这门大众硬件生意的逻辑，是不是已经悄悄变了。\n\nAI到底带来多大利润？\n\n销量下降，厂商为什么还能赚钱？\n\n一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨。\n\n戴尔首席运营官Jeff Clarke在5月业绩会上形容，调价频繁到“感觉每天都在重新定价”。今年以来，联想、惠普、戴尔、华硕、宏碁等PC厂商均已多次调价，部分机型涨幅在15%到30%之间。\n\nIDC预计，2026年全球PC平均售价将上涨20%。\n\n高定价带来的利润自然会更高。例如，苹果继续上调多款Mac和iPad的售价，其中512GB版MacBook Air从1099美元涨至1299美元。Mac在截至6月的季度里收入103.5亿美元，涨了29%。\n\n当然，涨价不是PC厂商赚钱的根本原因，毕竟涨价也压制了消费级市场的出货意愿。归根结底，真正托举起头部厂商财报业绩的还是AI，一端是AI基础设施业务，另一端是单价数万元的高端AI PC。\n\n以戴尔为例，2027财年第二财季报告，戴尔营收469.71亿美元，同比增长58%，其中，AI服务器业务表现突出，订单金额达到609亿美元，确认收入达到164亿美元，已经超过整个PC相关业务的收入。\n\n无独有偶，截至6月底的季度，联想ISG业务（包括传统服务器、AI服务器和存储）收入同比增长98%，营业利润达到7.77亿美元。AI服务器项目储备540亿美元，一个季度涨了157%。\n\n而从2024年就火起来的AI PC在消费端承接了产品结构升级的使命。\n\n早在2024年第三季度，Canalys发布的数据就曾显示，当年全球AI PC出货量达到1330万台，占当季度PC总出货量的20%。此后，随着AI时代加速发展，头部厂商不断增加AI PC产品占比。\n\n以联想为例，数据显示，联想的AI PC产品类型，从24/25年第一财季的17款增加到第二财季的28款。到2026年，在IFA 2026期间，联想面向消费端和商务侧再度发布了多款AI PC新品。\n\n不止联想。\n\n根据《华尔街日报》报道，各家厂商都希望通过提高AI PC的产品占比，即增加能够在终端本地进行AI运算的PC产品，来减轻PC市场整体萎缩带来的影响。华硕ProArt P16、戴尔XPS 16 Creator Edition、惠普OmniBook Ultra 16、微星Prestige N16 Flip AI+也都开启了预定。\n\n如果说2024 年普及的初代AI PC，更多是“传统 PC”的营销话术，功能以轻量本地推理、语音转写、文案润色为主，消费者感知弱，溢价空间有限，并没有真正打破PC行业的盈利天花板。\n\n到2026年，英伟达入局PC领域，AI PC 进一步向超高端、Agent化方向的跃迁，定价逻辑也就脱离了消费电子的框架，例如，微软的SurfaceLaptop Ultra裸机顶配版本价格接近5万元；联想AI PC（YOGA Pro 15 RTX Spark高配版）标价42999元。\n\n这无疑是厂商盈利的最大依仗之一。\n\n同时，尽管大盘出货量在下降，但消费者很乐意为AI PC买单。\n\n联想YOGA Pro 15 RTX Spark高配版半小时售罄。至10月18日晚，京东仍然显示“无货”在闲鱼二手交易平台上，更有卖家将高配版挂出了50000元的价格，比官方建议零售价高出约7000元。\n\n那么，AI PC到底能为厂商赚多少钱？\n\n还是以联想为例，按照摩根士丹利的口径，联想普通PC的全球均价约为800美元（折合人民币约5400元），常规PC毛利率约为15.5%，而RTXSpark这类超高端AI工作站机型的毛利率可达22%左右。\n\n反映到营收与利润上：\n\n“经济杂志”记者测算，假设联想YOGAPro15出货量为200万台（约占联想PC年出货的3%），为IDG带来约752亿元增量收入、172亿元增量毛利，单机增量毛利率约23%，推升IDG毛利率约0.9至1.3个百分点、运营利润率约0.8至1.3个百分点。\n\n这组数据值得玩味的地方在于：仅占出货量3%的超高端机型，就能撬动一个头部厂商PC业务近1个百分点的利润率。这笔商业账算得越精准，那个以“出货量论英雄”的PC黄金时代，就越显得恍如隔世。\n\n悬而未决的英伟达“变数”\n\n就目前来看，各大机构十分看好AI PC。\n\nOmdia发布报告显示，预计2027年AI PC将占全球PC出货量的60%，到2030年进一步提升至79%。高盛则预计2026年AI PC出货量将达到1.5亿台，同比增长39%，占全部PC的59%，到2028年出货量将近2亿台，市场渗透率82%。\n\n消费市场上首发售罄、二手加价的盛况似乎更助推了AI PC加速取代传统PC的趋势。\n\n然而，会为AI功能更换电脑的人有多少呢？\n\n根据Omdia的调查，69%的PC办公用户愿意为本地AI处理能力支付更高价格，但只有9%的用户会因为AI功能更换电脑。更重要的是，头豹研究院2025年调研数据显示，AI PC的核心硬件NPU，在许多主流的软件中并未得到有效调用。\n\n这意味着用户在支付了硬件溢价后，并未获得一定的AI体验提升。\n\n2026年6月，英伟达宣布推出RTX Spark，正式入局PC芯片，一举引起PC厂商狂欢。微软、戴尔、惠普、华硕、联想、微星将相继推出搭载这款芯片的全新Windows 整机。例如，联想YOGA Pro 15 RTX Spark、华硕ProArt创16。\n\n新一代AI PC比之从前有进益了吗？\n\n从当前各大科技博主的测评来看，RTX Spark笔记本在GPU性能、本地大模型推理、大容量统一内存方面具备显著优势，尤其适配需本地运行大模型的开发者与创作者群体。但实测也暴露了诸多问题：\n\nWindows on Arm架构的软件兼容性存在短板，部分游戏与专业应用表现欠佳。\n\n高负载场景下的续航、发热及风扇噪声表现均不尽如人意。另外，英伟达重点宣传的本地Agent体验不佳，使用Hermes Agent和本地Qwen模型生成新闻简报，耗时约10分钟，消耗了10%的电量，最终效果不如云端Claude。\n\n诚然，体验层面的短板并非不可修复的硬伤，跟着以后的技术迭代大概率会逐步补齐。\n\n需要担心的是，在几款RTX Spark笔记本发布不久后，英伟达就迎来了黄仁勋“风波”。\n\n黄仁勋是英伟达杀入PC市场的核心操盘手，RTX Spark从架构定义、生态合作到落地节奏，全程由他亲自推动。TrendForce预估，RTX Spark相关产品2026年出货量约在20万台以内；随着生态系统成熟，2027年有望放大到100万台。\n\n时至今日，黄仁勋退场，海内外多家媒体开始担忧：未来，英伟达是否还会继续加码消费级项目？\n\n其中，RTX Spark的命运已经引起了数家媒体预测。例如，Omdia的PC分析师Kieren Jessop直言：短期内消费者不会感受到太多变化，但未来两三年值得警惕。\n\n毕竟消费级业务的商业回报远远不及AI数据中心，还需要持续投入。\n\n11月18日，英伟达公布了2027财年第三财季（截至2026年10月25日）的财报，收入为1158亿美元，同比增长103%，环比增长20%；净利润为653亿美元，同比增长105%，环比增长9%。\n\n搭载RTX Spark的联想新一代AI PC已开始出货，英伟达将这项进展列入边缘计算业务。\n\n本季度，该业务实现营收82亿美元。对比之下，数据中心业务收入达到了创纪录的1076亿美元，首次突破千亿美元，收入占比达到约93%，同比增长110%，环比增长21%。\n\n临时接任CEO的克雷斯出身CFO，英伟达往后的每一笔投入、营收只怕都会算得更严苛。\n\nPC厂商们的心境在此刻变得格外讽刺。\n\n这大抵就是PC行业逃不开的宿命：几十年来，从未真正掌握自己的叙事权。早年靠英特尔的摩尔定律推着迭代，后来靠微软的系统升级拉动换机，如今撞上AI浪潮，依旧要仰仗芯片巨头的战略倾斜才能分到增长红利。\n\n陷在存量困局的PC行业，随着一个人的离去，又要迷茫了。\n\n这也说明了PC行业一个残酷现实：当叙事权握在别人手里，增长的想象空间随时都可能会收缩。如今，AI带来的增量红利正变得不确定，那么降本就成了PC厂商更可控的抓手，而一场围绕产能的辗转腾挪其实早已开始。\n\n产能回迁的“零和博弈”\n\n未来，消费者会为什么样的电脑买单？\n\nCounterpoint高级分析师指出，AI电脑、高端显示器和差异化产品仍有机会，但最终胜出的企业必须同时具备创新能力、有竞争力的价格、严格的供应链管理，以及对消费者和企业具有吸引力的产品价值，四项全能，缺一不可。\n\n其中，价格、供应链管理在这个PC物料成本、终端售价越来越高的时代显得尤其重要。2025年第一季度，CPU、DRAM和SSD三大核心部件占整机物料成本的45%；到2026年第三季度，占比已经达到68%。\n\n当前各大PC厂商似乎只剩下了两个主要任务：省钱、赚钱。\n\n这也导致全球PC厂商的生产线即将发生新的变化。曾经，我国是全球电子行业最大的代工生产地区之一，也诞生了台系的富士康、广达电脑、仁宝电脑‌、‌和硕联合，大陆系的华勤技术、立讯精密等头部企业。\n\n后来，由于国内代工成本上升，PC厂商开始将生产线往更廉价的泰国、越南迁移。据悉，惠普甚至计划将最多七成产能迁出我国。\n\n如今，随着PC物料成本水涨船高，泰越基地配套不足的问题被放大，物流周期和库存成本叠加进来，原本低劳动力成本的优势被一点点吞噬。TrendForce指出，PC厂商正在重新评估新兴生产基地的物流、采购和供应链管理成本。\n\n反观我国，有成熟的制造业人才、较低的生产成本以及完整的电子产业链。\n\n10月28日，《日经亚洲》援引消息称，包括惠普、华硕、宏碁在内的全球PC厂商正将部分生产线从泰国和越南迁回我国，重新启用我国代工厂来应对不断飙升的零部件成本，并提高生产效率。\n\n从订单上来看，确实如此。\n\n根据DIGITIMES报道，华勤技术将在2027年为惠普代工一款消费级笔记本，这是其承接的第七个惠普笔电项目；立讯精密则拿下了戴尔高端轻薄本XPS13的代工订单，并计划于2027年进入惠普游戏本供应链。\n\nPC厂商在寒冬中决定到我国产业集群的怀抱，这是不争的事实。TrendForce的数据显示：2025年，全球约24%的笔记本电脑在我国境外生产。2026年这一比例预计下降至21%，2027年甚至可能跌破20%。\n\n但这真的是一笔稳赚不赔的“回头账”吗？\n\n值得一提的是，由于台系代工巨头跟PC厂商一样，把大部分产能分给了AI服务器，此轮回迁，承接回流产能的主力，不再是传统台系代工厂，而是立讯精密、华勤技术等大陆厂商。\n\n据悉，华勤在2026年半年报业绩说明会上预计全年笔记本出货量达2000万台，上半年笔记本营收同比增长超过50%，出货规模已直逼中国台湾第二大笔电代工厂仁宝。\n\n新一轮产能回迁，或许会加速PC核心零部件的国产替代进程。\n\n7月份，联想笔记本首次预装长江存储SSD登陆美国市场；同时，据《日经亚洲》报道，惠普已开始对长鑫存储的DRAM产品进行认证；戴尔同样开始对长鑫存储的DRAM产品进行认证；凤凰网科技引外媒消息报道，苹果公司正与长江存储和长鑫存储谈判。\n\n这意味着国产存储器供应链正式打入主流国际PC终端。\n\n另一方面，国际PC厂商向国内产业集群要效率、降成本的同时，其实也是在为本土竞争对手增加崛起的动力：因为成熟的代工体系、完善的零部件供应链、规模化的制造能力，最终并非只服务于国际品牌，同样也会服务于正在快速崛起的本土品牌。\n\n这是一场互利共生，也注定是此消彼长的博弈。\n\n总而言之，从以出货量论英雄的黄金时代，到靠高端溢价与AI业务托举利润的存量周期，PC行业最终花了十几年完成了一场价值转向，旧的增长逻辑已经失效，而新故事、新格局，正在巨头们的精心算计中悄然酝酿。\n\n本文为转载内容，授权事宜请联系原著作权人。\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\nPC出货大跌两成，但头部厂商反而越赚越多\n\nAI带不动 PC出货，却撑住了厂商的利润？\n\n道总有理 · 2026/11/19 17:17\n\n文｜道总有理\n\n前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题。\n\n李彦宏的想法其实很符合逻辑，AI目前使用的最佳场景是PC而不是手机。那必然会对PC有一定的带动作用。\n\n但事实上，答案可能非常反直觉。\n\nIDC最新公布的数据显示，2026年第三季度，全球PC出货量为6270万台，同比下降20.1%。联想、惠普、戴尔、苹果、华硕，排名前五的厂商无一增长。联想出货量同比下滑22.6%，惠普同比下滑30.9%，包括苹果，Mac的出货量都跌了11.3%。\n\n被各路大佬频繁提及的“AI带动PC出货论”在一组组惨淡的数据面前显得格外无力。\n\n但更反直觉的是，尽管AI没有真的带动PC出货量，几大头部厂商的财报业绩却可圈可点。\n\n以联想为例，2025/26财年第三财季业绩：集团营收1575亿元人民币，同比增长18%；净利润同比增长36%，利润增速达到营收增速的两倍。\n\n苹果Mac收入107.9亿美元，同比增长23.7%；戴尔年内股价至高点累计涨幅一度高达259%。\n\nAI带不动PC出货量，却带动了厂商的“钱包”，头部厂商还要不要继续纠结出货数字是个问题。但问题背后更值得探讨的是，PC这门大众硬件生意的逻辑，是不是已经悄悄变了。\n\nAI到底带来多大利润？\n\n销量下降，厂商为什么还能赚钱？\n\n一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨。\n\n戴尔首席运营官Jeff Clarke在5月业绩会上形容，调价频繁到“感觉每天都在重新定价”。今年以来，联想、惠普、戴尔、华硕、宏碁等PC厂商均已多次调价，部分机型涨幅在15%到30%之间。\n\nIDC预计，2026年全球PC平均售价将上涨20%。\n\n高定价带来的利润自然会更高。例如，苹果继续上调多款Mac和iPad的售价，其中512GB版MacBook Air从1099美元涨至1299美元。Mac在截至6月的季度里收入103.5亿美元，涨了29%。\n\n当然，涨价不是PC厂商赚钱的根本原因，毕竟涨价也压制了消费级市场的出货意愿。归根结底，真正托举起头部厂商财报业绩的还是AI，一端是AI基础设施业务，另一端是单价数万元的高端AI PC。\n\n以戴尔为例，2027财年第二财季报告，戴尔营收469.71亿美元，同比增长58%，其中，AI服务器业务表现突出，订单金额达到609亿美元，确认收入达到164亿美元，已经超过整个PC相关业务的收入。\n\n无独有偶，截至6月底的季度，联想ISG业务（包括传统服务器、AI服务器和存储）收入同比增长98%，营业利润达到7.77亿美元。AI服务器项目储备540亿美元，一个季度涨了157%。\n\n而从2024年就火起来的AI PC在消费端承接了产品结构升级的使命。\n\n早在2024年第三季度，Canalys发布的数据就曾显示，当年全球AI PC出货量达到1330万台，占当季度PC总出货量的20%。此后，随着AI时代加速发展，头部厂商不断增加AI PC产品占比。\n\n以联想为例，数据显示，联想的AI PC产品类型，从24/25年第一财季的17款增加到第二财季的28款。到2026年，在IFA 2026期间，联想面向消费端和商务侧再度发布了多款AI PC新品。\n\n不止联想。\n\n根据《华尔街日报》报道，各家厂商都希望通过提高AI PC的产品占比，即增加能够在终端本地进行AI运算的PC产品，来减轻PC市场整体萎缩带来的影响。华硕ProArt P16、戴尔XPS 16 Creator Edition、惠普OmniBook Ultra 16、微星Prestige N16 Flip AI+也都开启了预定。\n\n如果说2024 年普及的初代AI PC，更多是“传统 PC”的营销话术，功能以轻量本地推理、语音转写、文案润色为主，消费者感知弱，溢价空间有限，并没有真正打破PC行业的盈利天花板。\n\n到2026年，英伟达入局PC领域，AI PC 进一步向超高端、Agent化方向的跃迁，定价逻辑也就脱离了消费电子的框架，例如，微软的SurfaceLaptop Ultra裸机顶配版本价格接近5万元；联想AI PC（YOGA Pro 15 RTX Spark高配版）标价42999元。\n\n这无疑是厂商盈利的最大依仗之一。\n\n同时，尽管大盘出货量在下降，但消费者很乐意为AI PC买单。\n\n联想YOGA Pro 15 RTX Spark高配版半小时售罄。至10月18日晚，京东仍然显示“无货”在闲鱼二手交易平台上，更有卖家将高配版挂出了50000元的价格，比官方建议零售价高出约7000元。\n\n那么，AI PC到底能为厂商赚多少钱？\n\n还是以联想为例，按照摩根士丹利的口径，联想普通PC的全球均价约为800美元（折合人民币约5400元），常规PC毛利率约为15.5%，而RTXSpark这类超高端AI工作站机型的毛利率可达22%左右。\n\n反映到营收与利润上：\n\n“经济杂志”记者测算，假设联想YOGAPro15出货量为200万台（约占联想PC年出货的3%），为IDG带来约752亿元增量收入、172亿元增量毛利，单机增量毛利率约23%，推升IDG毛利率约0.9至1.3个百分点、运营利润率约0.8至1.3个百分点。\n\n这组数据值得玩味的地方在于：仅占出货量3%的超高端机型，就能撬动一个头部厂商PC业务近1个百分点的利润率。这笔商业账算得越精准，那个以“出货量论英雄”的PC黄金时代，就越显得恍如隔世。\n\n悬而未决的英伟达“变数”\n\n就目前来看，各大机构十分看好AI PC。\n\nOmdia发布报告显示，预计2027年AI PC将占全球PC出货量的60%，到2030年进一步提升至79%。高盛则预计2026年AI PC出货量将达到1.5亿台，同比增长39%，占全部PC的59%，到2028年出货量将近2亿台，市场渗透率82%。\n\n消费市场上首发售罄、二手加价的盛况似乎更助推了AI PC加速取代传统PC的趋势。\n\n然而，会为AI功能更换电脑的人有多少呢？\n\n根据Omdia的调查，69%的PC办公用户愿意为本地AI处理能力支付更高价格，但只有9%的用户会因为AI功能更换电脑。更重要的是，头豹研究院2025年调研数据显示，AI PC的核心硬件NPU，在许多主流的软件中并未得到有效调用。\n\n这意味着用户在支付了硬件溢价后，并未获得一定的AI体验提升。\n\n2026年6月，英伟达宣布推出RTX Spark，正式入局PC芯片，一举引起PC厂商狂欢。微软、戴尔、惠普、华硕、联想、微星将相继推出搭载这款芯片的全新Windows 整机。例如，联想YOGA Pro 15 RTX Spark、华硕ProArt创16。\n\n新一代AI PC比之从前有进益了吗？\n\n从当前各大科技博主的测评来看，RTX Spark笔记本在GPU性能、本地大模型推理、大容量统一内存方面具备显著优势，尤其适配需本地运行大模型的开发者与创作者群体。但实测也暴露了诸多问题：\n\nWindows on Arm架构的软件兼容性存在短板，部分游戏与专业应用表现欠佳。\n\n高负载场景下的续航、发热及风扇噪声表现均不尽如人意。另外，英伟达重点宣传的本地Agent体验不佳，使用Hermes Agent和本地Qwen模型生成新闻简报，耗时约10分钟，消耗了10%的电量，最终效果不如云端Claude。\n\n诚然，体验层面的短板并非不可修复的硬伤，跟着以后的技术迭代大概率会逐步补齐。\n\n需要担心的是，在几款RTX Spark笔记本发布不久后，英伟达就迎来了黄仁勋“风波”。\n\n黄仁勋是英伟达杀入PC市场的核心操盘手，RTX Spark从架构定义、生态合作到落地节奏，全程由他亲自推动。TrendForce预估，RTX Spark相关产品2026年出货量约在20万台以内；随着生态系统成熟，2027年有望放大到100万台。\n\n时至今日，黄仁勋退场，海内外多家媒体开始担忧：未来，英伟达是否还会继续加码消费级项目？\n\n其中，RTX Spark的命运已经引起了数家媒体预测。例如，Omdia的PC分析师Kieren Jessop直言：短期内消费者不会感受到太多变化，但未来两三年值得警惕。\n\n毕竟消费级业务的商业回报远远不及AI数据中心，还需要持续投入。\n\n11月18日，英伟达公布了2027财年第三财季（截至2026年10月25日）的财报，收入为1158亿美元，同比增长103%，环比增长20%；净利润为653亿美元，同比增长105%，环比增长9%。\n\n搭载RTX Spark的联想新一代AI PC已开始出货，英伟达将这项进展列入边缘计算业务。\n\n本季度，该业务实现营收82亿美元。对比之下，数据中心业务收入达到了创纪录的1076亿美元，首次突破千亿美元，收入占比达到约93%，同比增长110%，环比增长21%。\n\n临时接任CEO的克雷斯出身CFO，英伟达往后的每一笔投入、营收只怕都会算得更严苛。\n\nPC厂商们的心境在此刻变得格外讽刺。\n\n这大抵就是PC行业逃不开的宿命：几十年来，从未真正掌握自己的叙事权。早年靠英特尔的摩尔定律推着迭代，后来靠微软的系统升级拉动换机，如今撞上AI浪潮，依旧要仰仗芯片巨头的战略倾斜才能分到增长红利。\n\n陷在存量困局的PC行业，随着一个人的离去，又要迷茫了。\n\n这也说明了PC行业一个残酷现实：当叙事权握在别人手里，增长的想象空间随时都可能会收缩。如今，AI带来的增量红利正变得不确定，那么降本就成了PC厂商更可控的抓手，而一场围绕产能的辗转腾挪其实早已开始。\n\n产能回迁的“零和博弈”\n\n未来，消费者会为什么样的电脑买单？\n\nCounterpoint高级分析师指出，AI电脑、高端显示器和差异化产品仍有机会，但最终胜出的企业必须同时具备创新能力、有竞争力的价格、严格的供应链管理，以及对消费者和企业具有吸引力的产品价值，四项全能，缺一不可。\n\n其中，价格、供应链管理在这个PC物料成本、终端售价越来越高的时代显得尤其重要。2025年第一季度，CPU、DRAM和SSD三大核心部件占整机物料成本的45%；到2026年第三季度，占比已经达到68%。\n\n当前各大PC厂商似乎只剩下了两个主要任务：省钱、赚钱。\n\n这也导致全球PC厂商的生产线即将发生新的变化。曾经，我国是全球电子行业最大的代工生产地区之一，也诞生了台系的富士康、广达电脑、仁宝电脑‌、‌和硕联合，大陆系的华勤技术、立讯精密等头部企业。\n\n后来，由于国内代工成本上升，PC厂商开始将生产线往更廉价的泰国、越南迁移。据悉，惠普甚至计划将最多七成产能迁出我国。\n\n如今，随着PC物料成本水涨船高，泰越基地配套不足的问题被放大，物流周期和库存成本叠加进来，原本低劳动力成本的优势被一点点吞噬。TrendForce指出，PC厂商正在重新评估新兴生产基地的物流、采购和供应链管理成本。\n\n反观我国，有成熟的制造业人才、较低的生产成本以及完整的电子产业链。\n\n10月28日，《日经亚洲》援引消息称，包括惠普、华硕、宏碁在内的全球PC厂商正将部分生产线从泰国和越南迁回我国，重新启用我国代工厂来应对不断飙升的零部件成本，并提高生产效率。\n\n从订单上来看，确实如此。\n\n根据DIGITIMES报道，华勤技术将在2027年为惠普代工一款消费级笔记本，这是其承接的第七个惠普笔电项目；立讯精密则拿下了戴尔高端轻薄本XPS13的代工订单，并计划于2027年进入惠普游戏本供应链。\n\nPC厂商在寒冬中决定到我国产业集群的怀抱，这是不争的事实。TrendForce的数据显示：2025年，全球约24%的笔记本电脑在我国境外生产。2026年这一比例预计下降至21%，2027年甚至可能跌破20%。\n\n但这真的是一笔稳赚不赔的“回头账”吗？\n\n值得一提的是，由于台系代工巨头跟PC厂商一样，把大部分产能分给了AI服务器，此轮回迁，承接回流产能的主力，不再是传统台系代工厂，而是立讯精密、华勤技术等大陆厂商。\n\n据悉，华勤在2026年半年报业绩说明会上预计全年笔记本出货量达2000万台，上半年笔记本营收同比增长超过50%，出货规模已直逼中国台湾第二大笔电代工厂仁宝。\n\n新一轮产能回迁，或许会加速PC核心零部件的国产替代进程。\n\n7月份，联想笔记本首次预装长江存储SSD登陆美国市场；同时，据《日经亚洲》报道，惠普已开始对长鑫存储的DRAM产品进行认证；戴尔同样开始对长鑫存储的DRAM产品进行认证；凤凰网科技引外媒消息报道，苹果公司正与长江存储和长鑫存储谈判。\n\n这意味着国产存储器供应链正式打入主流国际PC终端。\n\n另一方面，国际PC厂商向国内产业集群要效率、降成本的同时，其实也是在为本土竞争对手增加崛起的动力：因为成熟的代工体系、完善的零部件供应链、规模化的制造能力，最终并非只服务于国际品牌，同样也会服务于正在快速崛起的本土品牌。\n\n这是一场互利共生，也注定是此消彼长的博弈。\n\n总而言之，从以出货量论英雄的黄金时代，到靠高端溢价与AI业务托举利润的存量周期，PC行业最终花了十几年完成了一场价值转向，旧的增长逻辑已经失效，而新故事、新格局，正在巨头们的精心算计中悄然酝酿。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c41aaec27f5","title":"山頂施勳道雙號屋近2億沽 內地豪客每呎8.2萬承接","url":"https://www.stheadline.com/realtime-property/3638943/山頂施勳道雙號屋近2億沽-內地豪客每呎82萬承接","summary":"豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出，呎價約8.2萬元。","summary_short":"豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出，呎價約8.2萬元。","digest":"豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出…","points":["豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出…","新買家為內地客，鐘情維多利亞港煙花海景","近期香港一手樓市成交表現持續理想，據市場消息今年截至11月12日一手成交已錄約1.7萬宗…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:17:15+08:00","size":1,"keywords":[],"body":"豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出，呎價約8.2萬元。據了解，新買家為內地客，鐘情維多利亞港煙花海景。 近期香港一手樓市成交表現持續理想，據市場消息今年截至11月12日一手成交已錄約1.7萬宗，豪宅物業更備受市場追捧，期內逾3,000萬元一手私宅成交量錄約1,008宗，較去年同期758宗上升約33%，反映市場對優質豪宅物業的殷切需求。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cecdf3da069","title":"西贝测试新店型“天边冰煮鲜羊”","url":"https://www.jiemian.com/article/15351585.html","summary":"界面新闻获悉，西贝旗下的“天边砂锅焖面”在呼和浩特的首店于11月19日原址变更为“天边冰煮鲜羊”并正式开业。","summary_short":"界面新闻获悉，西贝旗下的“天边砂锅焖面”在呼和浩特的首店于11月19日原址变更为“天边冰煮鲜羊”并正式开业。","digest":"西贝测试新店型“天边冰煮鲜羊”","points":["界面新闻获悉，西贝旗下的“天边砂锅焖面”在呼和浩特的首店于11月19日原址变更为“天边冰煮鲜…","对此西贝方面对界面新闻表示，该品牌不算一个完全独立的新品牌，主打的产品是冰煮鲜羊…","今年以来，西贝推出新的系列品牌“天边”，部分西贝餐厅改装成为另一个品牌“天边砂锅焖面”"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:14:40+08:00","size":1,"keywords":[],"body":"界面新闻获悉，西贝旗下的“天边砂锅焖面”在呼和浩特的首店于11月19日原址变更为“天边冰煮鲜羊”并正式开业。对此西贝方面对界面新闻表示，该品牌不算一个完全独立的新品牌，主打的产品是冰煮鲜羊，目前还在持续跑不同店型、做不同品类的测试，只在呼和浩特有一家门店。\n\n今年以来，西贝推出新的系列品牌“天边”，部分西贝餐厅改装成为另一个品牌“天边砂锅焖面”；8月7日，又在北京开出新的鲜羊品牌“天边羊多”。另外，位于北京六里桥 ·成都—哈萨克斯坦)JSQ捷达班列首发仪式在成都市青白江区成都铁路物流中心城厢营业部货场举行。","digest":"中亚（中国·成都—哈萨克斯坦）JSQ捷达班列首发","points":["11月19日，中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式在成都市青白江区成都铁路物…","一批由一汽大众汽车有限公司成都分公司生产的捷达品牌整车完成装载后正式发运，驶向中亚市场","这是“成都造”汽车首次通过铁路JSQ车方式在成都发运…"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T16:04:35+08:00","size":1,"keywords":[],"body":"11月19日，中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式在成都市青白江区成都铁路物流中心城厢营业部货场举行。一批由一汽大众汽车有限公司成都分公司生产的捷达品牌整车完成装载后正式发运，驶向中亚市场。这是“成都造”汽车首次通过铁路JSQ车方式在成都发运，也是成都一汽大众品牌首次开行中亚国际铁路JSQ班列，标志着成都汽车产业国际化物流服务体系再添新模式。(记者 张浪 制作 王佳琪)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/239605B2A0374C70862E678AE47DD8DD.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c0c0e4076ba","title":"美聯儲上月議息會議幾乎所有委員支持12月加息 金價下試3700美元關口","url":"https://news.tvb.com/tc/1207248-美聯儲上月議息會議幾乎所有委員支持12月加息金價下試3700美元關口","summary":"美國聯儲局公布上月議息會議紀要，幾乎所有委員都支持12月加息。在息口預期轉鷹下，金價下試3,700美元關口。","summary_short":"美國聯儲局公布上月議息會議紀要，幾乎所有委員都支持12月加息。","digest":"美國聯儲局公布上月議息會議紀要，幾乎所有委員都支持12月加息","points":["美國聯儲局公布上月議息會議紀要，幾乎所有委員都支持12月加息","在息口預期轉鷹下，金價下試3,700美元關口","根據上月27至28日的，聯儲局會議紀要，幾乎所有委員認為，在對通脹及勞工市場的基準預測下…"],"section":"財經","category":"財經","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T15:58+08:00","size":1,"keywords":[],"body":"美國聯儲局公布上月議息會議紀要，幾乎所有委員都支持12月加息。在息口預期轉鷹下，金價下試3,700美元關口。\n\n根據上月27至28日的，聯儲局會議紀要，幾乎所有委員認為，在對通脹及勞工市場的基準預測下，進一步上調聯邦基金利率，是確保通脹率回落至百分之2目標的合適舉動。當中有兩名與會者認為，若未來公布的通脹數據未見受控，下次會議或需加息逾四分一厘。\n\n聯儲局理事沃勒認為，局方或需採取激進行動，應對遠高於目標的通脹，如果明年1月不加息，12月應加息半厘。市場也迅速調整息口預期，利率期貨顯示，市場幾乎百分百押注聯儲局12月會加息。當中更有約一成機會預期將大幅加息半厘。\n\n臻享顧問董事總經理王良享指出︰「現在大家害怕的是聯儲局加息，而且加息幅度較市場之前預期高，過去一、兩個月美國通脹有些反彈，雖然戰事有希望結束，但要通脹掉頭回落，可能要等一、兩個季度。但到明年中左右，經濟開始回落，失業率飆升至約百分之4.5，我想聯儲局的鷹派態度將結束。」\n\n在息口預期轉鷹下，美國十年期債息繼續處於5厘以上，除了拖低美股估值，也引發市場波動。現貨金失守3,800美元後，一度跌穿3,700美元關口，創近14個月新低。\n\n加息也可能推高企業及消費者借貸成本，令經濟活動降溫，工廠生產及運輸需求減少，加上最新數據顯示，美國原油及燃料庫存增幅，超出預期。憂慮供應過剩，紐約期油曾跌穿每桶82美元，為近3個月低位。","image":"https://pro-vod-cdn.tvb.com/76f9999dc6c7411b8a46846803f9b547/snapshots/8b83813971604bdf8f8b8c4a1538f9d6-00008.jpg","video":"https://pro-vod-cdn.tvb.com/76f9999dc6c7411b8a46846803f9b547/88b8773410284f6294119024f2eb7a05-6ebcee1b04ffddb607504c555270ed82-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/76f9999dc6c7411b8a46846803f9b547/snapshots/8b83813971604bdf8f8b8c4a1538f9d6-00008.jpg","lang":"zh-Hant"},{"id":"cb259e434a8","title":"西祠胡同创始人响马突发急性心梗，团队发文：术后恢复平稳，愿早日康复","url":"https://www.jiemian.com/article/15350659.html","summary":"11月19日，西祠胡同网发文表示，创始人响马不久前突发急性心梗，经抢救手术，现已术后一月，恢复平稳，在家静养。","summary_short":"11月19日，西祠胡同网发文表示，创始人响马不久前突发急性心梗，经抢救手术，现已术后一月，恢复平稳，在家静养。","digest":"11月19日，西祠胡同网发文表示，创始人响马不久前突发急性心梗，经抢救手术…","points":["11月19日，西祠胡同网发文表示，创始人响马不久前突发急性心梗，经抢救手术，现已术后一月…","西祠全体团队衷心祝愿响马好好休养，身体早日康复，万事顺遂","紧急赶往医院，到急诊室几分钟后心脏骤停，医护人员当场CPR抢救回来，随后推入手术室…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T14:40:35+08:00","size":1,"keywords":[],"body":"11月19日，西祠胡同网发文表示，创始人响马不久前突发急性心梗，经抢救手术，现已术后一月，恢复平稳，在家静养。西祠全体团队衷心祝愿响马好好休养，身体早日康复，万事顺遂。也提醒大家：珍惜身体，健康第一。\n\n响马在社交平台介绍，他在10月16日晚回家途中，突发急性心梗，“寡妇血管”完全被血栓堵死，强撑到家，胸背痛加剧到无法忍受。紧急赶往医院，到急诊室几分钟后心脏骤停，医护人员当场CPR抢救回来，随后推入手术室，清理血栓安装支架。响马表示，术后一个月，身体和心脏都恢复都很好。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf01089d091","title":"驻哈巴罗夫斯克总领馆提醒领区内中国公民和企业注意消防安全","url":"https://www.jiemian.com/article/15350633.html","summary":"近期，我馆领区发生多起因失火导致护照损毁、财产损失等案件。","summary_short":"近期，我馆领区发生多起因失火导致护照损毁、财产损失等案件。","digest":"近期，我馆领区发生多起因失火导致护照损毁、财产损失等案件","points":["近期，我馆领区发生多起因失火导致护照损毁、财产损失等案件","当前，俄罗斯远东地区天气严寒，气候干燥，用火用电用气显著增多，火灾安全风险大幅增加","中国驻哈巴罗夫斯克总领馆郑重提醒领区中国公民和中资机构坚持底线思维，增强消防安全意识…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T14:35:11+08:00","size":1,"keywords":[],"body":"近期，我馆领区发生多起因失火导致护照损毁、财产损失等案件。当前，俄罗斯远东地区天气严寒，气候干燥，用火用电用气显著增多，火灾安全风险大幅增加。中国驻哈巴罗夫斯克总领馆郑重提醒领区中国公民和中资机构坚持底线思维，增强消防安全意识，严格落实各项安全措施，最大限度防范事故发生。如不幸遭遇火情请保持冷静，第一时间报警，及时沿疏散通道快速撤离至安全区域。如护照损毁，请勿自行粘贴、裁切或“修复”，建议立即报警、取得回执，并尽快向总领馆申请补发护照或旅行证（具体办理要求请登录我馆官网查询）。建议个人留存护照资料页、签证页、移民卡和居住登记复印件或电子扫描件；如证件由企业集中保管，存放点应远离火源、热源，不得与易燃可燃物混放，建议使用防火保险柜。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1f6e5aa9b2","title":"四川发力新型技术改造 前三季度技改投资增长14.2%","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734617.shtml","summary":"中新网成都11月19日电 (单鹏)四川省经济和信息化厅副厅长张勇19日在成都表示，今年1至9月，四川省技改投资同比增长14.2%，实施技改项目超过3000个，工业投资增长7.9%…","summary_short":"中新网成都11月19日电 (单鹏)四川省经济和信息化厅副厅长张勇19日在成都表示，今年1至9月…","digest":"四川省经济和信息化厅副厅长张勇19日在成都表示，今年1至9月…","points":["中新网成都11月19日电 (单鹏)四川省经济和信息化厅副厅长张勇19日在成都表示…","19日，四川省政府新闻办举行“万千气象看四川·开局向新见行动”系列主题新闻发布会(第二场)…","在目标导向上，四川把智能化改造、绿色化转型作为新型技改的核心方向…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:32:19+08:00","size":1,"keywords":[],"body":"中新网成都11月19日电 (单鹏)四川省经济和信息化厅副厅长张勇19日在成都表示，今年1至9月，四川省技改投资同比增长14.2%，实施技改项目超过3000个，工业投资增长7.9%，技术改造对扩大工业有效投资、培育发展新动能的支撑作用持续增强。\n\n　　19日，四川省政府新闻办举行“万千气象看四川·开局向新见行动”系列主题新闻发布会(第二场)，介绍四川在产业科技创新等方面的政策举措和工作成效。\n\n新闻发布会现场。　四川发布 供图\n\n　　张勇表示，新型技术改造是加快培育新质生产力、推进新型工业化的重要抓手。去年底，四川省政府印发《推动新型技术改造实施方案》，四川省经济和信息化厅围绕新型技改重点任务，系统推动各项工作落地见效。\n\n　　在目标导向上，四川把智能化改造、绿色化转型作为新型技改的核心方向，持续推动“5G+工业互联网”融合应用，全省累计建成国家级5G工厂48个，居全国第9位、西部第1位；同步统筹推进工业节能降碳，建立完善重点产业链能效、碳效标准体系，建成国家级绿色工厂233家、绿色工业园区40家，省级绿色工厂705家、绿色工业园区74家，“百家绿色工业园区”“千家绿色工厂”目标即将完成。\n\n　　在主要驱动力上，四川突出人工智能数字赋能，夯实工业互联网网络底座，实现全省重点产业园区5G全覆盖，新入选1家“数字领航”企业，集聚209家智改数转省级供应商；推动AI、工业大模型向研发设计、生产管控、设备运维全环节渗透，为企业开展技术诊断、改造方案适配服务，带动传统产业迭代跃升。\n\n　　在改造模式上，四川大力实施链式技改，发挥链主企业牵引作用，联动上下游配套企业、科研院所协同开展改造，今年内计划实施一批链式技改和产业化项目；加快试点示范，推动成都、绵阳、德阳先后入选国家制造业新型技术改造城市试点，先行先试总结可复制可推广的经验，以点带面推动全省技改提质扩面。\n\n　　在要素保障上，四川利用国省专项资金支持设备更新和技术改造，做优省级“技改贷”特色金融产品，撬动更多社会资本投向产业改造提升；实行项目清单化管理、项目库动态滚动更新，统筹做好用地、用能等要素供给；搭建银企对接平台，打通政策落地“最后一公里”，推动各类技改项目快落地、快建设、快见效。(完)\n\n 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf25bfdbc40","title":"抖音：治理“代解封”黑灰产，今年以来协助有关部门抓获相关产业链犯罪嫌疑人11人","url":"https://www.jiemian.com/article/15350622.html","summary":"11月19日，抖音发布关于深入治理“代解封”黑灰产的公告：近一个月，针对传播“账号代解封”攻略及宣传代解封服务，平台共处置违规内容1878条，对137个违规账号予以禁言处置。","summary_short":"11月19日，抖音发布关于深入治理“代解封”黑灰产的公告：近一个月，针对传播“账号代解封”攻略及宣传代解封服务…","digest":"11月19日，抖音发布关于深入治理“代解封”黑灰产的公告：近一个月…","points":["11月19日，抖音发布关于深入治理“代解封”黑灰产的公告：近一个月…","抖音提醒用户：切勿轻信所谓“代解封攻略”“付费代解封”等宣传，谨防财产损失和账号风险"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T14:31:25+08:00","size":1,"keywords":[],"body":"11月19日，抖音发布关于深入治理“代解封”黑灰产的公告：近一个月，针对传播“账号代解封”攻略及宣传代解封服务，平台共处置违规内容1878条，对137个违规账号予以禁言处置。2026年以来，上报多起违法犯罪线索，协助有关部门抓获相关产业链犯罪嫌疑人11人。抖音提醒用户：切勿轻信所谓“代解封攻略”“付费代解封”等宣传，谨防财产损失和账号风险。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccd51d0db98","title":"欧珀莱易主：一个外资“中国定制”品牌的时代转身","url":"https://www.jiemian.com/article/15350516.html","summary":"文｜未来迹FutureBeauty 陈龙  编辑｜吴思馨  11月17日，欧珀莱迎来创立32年以来最重要的一次股东变化。","summary_short":"文｜未来迹FutureBeauty 陈龙  编辑｜吴思馨  11月17日，欧珀莱迎来创立32年以来最重要的一次股东变化。","digest":"文｜未来迹FutureBeauty 陈龙  编辑｜吴思馨  11月17日…","points":["文｜未来迹FutureBeauty 陈龙","11月17日，欧珀莱迎来创立32年以来最重要的一次股东变化","资生堂宣布，将资生堂丽源化妆品有限公司100%股权转让给IDG资本主导的投资者财团"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T14:26:44+08:00","size":1,"keywords":[],"body":"文｜未来迹FutureBeauty 陈龙\n\n编辑｜吴思馨\n\n11月17日，欧珀莱迎来创立32年以来最重要的一次股东变化。资生堂宣布，将资生堂丽源化妆品有限公司100%股权转让给IDG资本主导的投资者财团。\n\n在许多中国消费者的记忆里，欧珀莱几乎与资生堂绑定在一起。\n\n1994年，这个专为中国市场开发的品牌从北京亦庄起步，借助资生堂技术体系和百货专柜网络成长，成为一代消费者接触中高端护肤的重要入口。巅峰时期，欧珀莱年销售额超过30亿元，与巴黎欧莱雅、OLAY并称百货渠道“三欧”。\n\n三十多年后，它告别资生堂，也告别了孕育自己的“合资品牌”模式。\n\n这场交易表面上是资生堂的一次品牌组合调整，背后却交叠着三重变化：百货专柜黄金时代退去，中端护肤价格带受到两端挤压，跨国集团则不断把资源集中到全球重点品牌。\n\n欧珀莱完成了上一阶段的历史任务，却不意味着只能悄然退场。IDG接手的不只有一个经营承压的品牌，还有32年的消费者认知、一座北京工厂、一套供应链和仍具规模的渠道基础。\n\n当一个时代过去，欧珀莱会走向何方？\n\n资生堂丽源被转手，欧珀莱有了“新归宿”\n\n这笔交易并不突然。\n\n资生堂丽源成立于1991年，原由资生堂集团持股65%、北京丽源持股35%。由于第三期合资协议将在2026年12月到期，双方经过协商决定不再续约。北京丽源持有的35%股权随后在北京产权交易所挂牌，挂牌价为1.995亿元；9月1日，资生堂完成受让，实现对资生堂丽源的全资持股。\n\n从时间顺序看，资生堂先收回少数股权、再转让全部股权，相当于为结束合资关系、清理产权结构及推进整体出售铺路。\n\n11月17日签署的交易协议进一步明确了新股权结构：IDG资本管理基金设立的两家主体将合计持有95%股权，其中Sunrise Winning Limited持有80.66%，珠海朴来管理咨询合伙企业持有14.34%；由资生堂丽源新管理团队为主设立的上海珀知源企业管理合伙企业持有5%。\n\n此次的收购方——IDG资本，是中国最早一批开展风险投资的机构，早期曾投资腾讯、百度、搜狐等企业；后续广泛布局消费与科技领域，投资了小米、美团、拼多多、哔哩哔哩等企业。在美妆领域，IDG曾投资了芙清、观夏等多个品牌。\n\n与常规资本的财务型投资不同，IDG资本此次直接接手欧珀莱的品牌、公司、工厂以及生产设备，是一套完整的经营系统。这种投资逻辑，得到了资生堂的认可。\n\n资生堂在公告中明确表示，选择IDG资本是因为其在消费领域有丰富经验和专长，相信在其支持下，欧珀莱能“敏捷地执行业务”，并提升品牌价值。IDG此前在消费领域的投资（如瑞幸、优诺中国等）经验，可能被用于帮助欧珀莱进行数字化或业务重组。\n\n曾跨过30亿的欧珀莱，为何会被推上交易桌？\n\n对于资生堂而言，出售资生堂丽源，不能用一句轻飘飘的“剥离不良资产”一笔带过。\n\n欧珀莱首先是资生堂中国本土化历史中极具分量的资产。\n\n1991年，资生堂在中国大陆布局的首家合资公司——资生堂丽源成立，并建厂于北京经济技术开发区（亦庄），曾被当地人称为“亦庄第一企”。资生堂丽源于1994年正式推出了专为中国市场定制的护肤品牌“欧珀莱（AUPRES）”，当年即实现销售收入2111万元。\n\n此后，品牌凭借资生堂的研发及生产体系、专柜咨询服务和持续扩张的百货渠道快速成长。资生堂早期公开资料显示，欧珀莱创立后销售额年均增长超过30%，销售网络一度覆盖全国700余家大型商场，有效会员超过130万人。\n\n到2015年，欧珀莱专柜数量已超过1000家，年销售规模达到约30亿元，几乎构成了中国百货一楼中端护肤的标准配置。\n\n对于资生堂中国而言，欧珀莱也一直是投资的重心，资生堂也愿意将许多科研和市场资源倾注给欧珀莱。直至2024年，资生堂中国为欧珀莱举办品牌30周年庆典，并携手品牌代言人唐嫣拍摄《新肌到底，直塑年轻》品牌大片，并将资生堂功效专利成分「新肌酮」应用到欧珀莱新品黑精灵精华中。\n\n欧珀莱成功的关键，在于踩中了三个时代条件：外资技术和品牌稀缺性；百货专柜是中高端美妆的核心渠道；中国消费者需要一套针对本地肤质、气候和审美开发的产品。\n\n它也为跨国集团提供了一套早期本土化范本：在中国建立合资公司和工厂，为中国市场单独创建品牌，再通过专柜美容顾问完成产品教育与会员经营。\n\n然而，当这些条件逐渐消失，欧珀莱原有的增长模式也开始松动。\n\n尼尔森IQ数据显示，2019年至2023年，全国51个重点城市的百货购物中心化妆品柜台总数从15415个锐减至9502个，五年间消失了近6000个柜台，与此同时，现存百货美妆销售越来越向国际高端品牌集中。欧珀莱赖以成长的中端专柜市场，空间被持续压缩。\n\n渠道之外，价格带也在发生“K型分化”。\n\n高端品牌通过促销、礼赠和渠道下沉争夺中端消费者，珀莱雅、薇诺娜、可复美等本土品牌则凭借功效成分、内容电商和快速迭代向上进入200元至500元价格带。欧珀莱既要面对高端品牌向下覆盖，又要应对国货品牌向上进攻，过去依靠“资生堂技术＋中国专属”的差异化优势明显减弱。\n\n经营数据进一步解释了资生堂为何选择放手。\n\n据立信会计师事务所审计的2025全年数据，资生堂丽源该年营收累计为8.69亿元，但营业利润亏损5106.19万元，全年净利润亏损4133.7万元。截至2025年末，资生堂丽源资产总计9.01亿元，但负债高达2.82亿元。\n\n在今年1-5月，资生堂丽源营业利润亏损扩大至7125.39万元，净利润亏损额攀升至5341.52万元。《FBeauty未来迹》统计抖音、淘天、京东、快手等线上平台数据显示，2026年1-10月，欧珀莱在主流线上平台上交易额达3.93亿，同比下滑21.51%。\n\n再看资生堂财报，今年1-9月公司净销售额7411亿日元（约313亿元人民币），核心营业利润675亿日元（约合28亿元人民币），销售额和利润正在按计划稳步回升。\n\n这与资生堂当前的资源配置方向逐渐产生冲突。\n\n资生堂近年来持续优化品牌组合，把投资重点集中到SHISEIDO、肌肤之钥、NARS、IPSA和醉象等全球重点高端品牌，并明确提出缩减或退出增长前景较弱的业务。其2030中期战略进一步强调盈利能力、资本效率和现金创造，将管理资源投向最具竞争优势的领域。\n\n欧珀莱拥有历史价值和一定市场规模，却已不在集团优先投入的核心序列。对需要持续投入产品创新、数字化能力和品牌焕新的欧珀莱而言，留在资生堂体系内，反而可能长期处于资源排序靠后的位置。\n\n从这个角度看，出售体现的是战略匹配度变化。资生堂卸下一项亏损业务，集中资源支持全球重点品牌；欧珀莱则离开集团内部的非核心位置，换取独立经营和重新获得投入的机会。\n\nIDG收购之后，欧珀莱将走向自主经营\n\n早已完成了历史使命的欧珀莱，即将走上一条“自力更生”的道路。\n\nIDG资本在过往的投资中，习惯于在跨国集团调整中国业务时接盘，并倾向于依靠原有或新组建的管理团队来运营，自身仅在战略和资源上提供支持。\n\n在此次收购中IDG资本沿用了这一思路。此次收购完成后，资生堂丽源有5%的股权由上海珀知源企业管理合伙企业（有限合伙）持有，资生堂公告明确说明，该合伙企业主要由资生堂丽源的新管理团队设立，新团队在美妆品牌管理和业务转型方面拥有丰富经验。\n\n对于欧珀莱而言，这次转手是一次“温柔的放手”。\n\n一方面，脱离资生堂体系后，新公司不再需要中日双方股东层层审批，品牌决策链条会大幅缩短，决策效率和敏捷度将大幅提升，这对于需要快速响应中国市场变化的护肤品牌来说，将为品牌运营带来直接的利好。\n\n另一方面，为了确保转让后的顺利过渡，资生堂将授予业务运营所需的某些知识产权的许可，将欧珀莱“扶上马、送一程”。\n\n在转手后的特定时期内，资生堂将为新产品开发提供持续支持，为现有产品的稳定供应提供技术援助，以及提供原材料和精选产品的持续供应，通过合作的方式保持欧珀莱在创新能力、产品质量和业务方面的可持续性。\n\n不过，“自由”对于品牌而言，本就是一条艰难的路，与进入贝泰妮体系的ZA、泊美品牌相比，欧珀莱虽然拥有自主供应链体系，但没有“大树”可依靠，它的前路依旧挑战重重。\n\n一方面，新团队需要在严峻的现金流和盈利压力之下，让资生堂丽源和欧珀莱品牌重新获得“造血能力”，实现经济层面的正向循环。\n\n另一方面，在过渡期结束后，失去技术支撑的欧珀莱如何维持产品力，将是其能否真正“独立”的关键。\n\n向外看，《FBeauty未来迹》曾在《深度｜美妆掀起“399现象”，大众市场集体难了》一文中作出分析：全行业K型分化下，大众中端阵营面临的系统性困境。中端护肤品消费者结构性“消失”，是欧珀莱所处价位段需要面对的结构性挑战。\n\n欧珀莱的前三十年，属于外资合资公司、本土专属品牌和百货专柜共同繁荣的时代。\n\n它曾帮助资生堂深入中国市场，也陪伴一代消费者从基础护肤走向品质护肤。随着渠道、消费人群和集团战略改变，这套模式完成了它的第一阶段任务。\n\n接下来，欧珀莱将进入真正属于自己的经营周期。它标志着由跨国集团孵化的中国专属品牌，开始从合资时代进入独立运营时代。品牌过去依靠母集团技术与渠道获得成长，未来需要凭借自己的产品、组织和消费者关系证明价值。\n\n欧珀莱真正的新生，将发生在消费者选择它，不再只是因为它曾经属于资生堂，而是因为它就是欧珀莱。\n\n本文为转载内容，授权事宜请联系原著作权人。欧珀莱 中国\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n欧珀莱易主：一个外资“中国定制”品牌的时代转身\n\n当一个时代过去，欧珀莱会走向何方？\n\n未来迹FutureBeauty · 2026/11/19 14:26\n\n图片来源：界面图库\n\n文｜未来迹FutureBeauty 陈龙\n\n编辑｜吴思馨\n\n11月17日，欧珀莱迎来创立32年以来最重要的一次股东变化。资生堂宣布，将资生堂丽源化妆品有限公司100%股权转让给IDG资本主导的投资者财团。\n\n在许多中国消费者的记忆里，欧珀莱几乎与资生堂绑定在一起。\n\n1994年，这个专为中国市场开发的品牌从北京亦庄起步，借助资生堂技术体系和百货专柜网络成长，成为一代消费者接触中高端护肤的重要入口。巅峰时期，欧珀莱年销售额超过30亿元，与巴黎欧莱雅、OLAY并称百货渠道“三欧”。\n\n三十多年后，它告别资生堂，也告别了孕育自己的“合资品牌”模式。\n\n这场交易表面上是资生堂的一次品牌组合调整，背后却交叠着三重变化：百货专柜黄金时代退去，中端护肤价格带受到两端挤压，跨国集团则不断把资源集中到全球重点品牌。\n\n欧珀莱完成了上一阶段的历史任务，却不意味着只能悄然退场。IDG接手的不只有一个经营承压的品牌，还有32年的消费者认知、一座北京工厂、一套供应链和仍具规模的渠道基础。\n\n当一个时代过去，欧珀莱会走向何方？\n\n资生堂丽源被转手，欧珀莱有了“新归宿”\n\n这笔交易并不突然。\n\n资生堂丽源成立于1991年，原由资生堂集团持股65%、北京丽源持股35%。由于第三期合资协议将在2026年12月到期，双方经过协商决定不再续约。北京丽源持有的35%股权随后在北京产权交易所挂牌，挂牌价为1.995亿元；9月1日，资生堂完成受让，实现对资生堂丽源的全资持股。\n\n从时间顺序看，资生堂先收回少数股权、再转让全部股权，相当于为结束合资关系、清理产权结构及推进整体出售铺路。\n\n11月17日签署的交易协议进一步明确了新股权结构：IDG资本管理基金设立的两家主体将合计持有95%股权，其中Sunrise Winning Limited持有80.66%，珠海朴来管理咨询合伙企业持有14.34%；由资生堂丽源新管理团队为主设立的上海珀知源企业管理合伙企业持有5%。\n\n此次的收购方——IDG资本，是中国最早一批开展风险投资的机构，早期曾投资腾讯、百度、搜狐等企业；后续广泛布局消费与科技领域，投资了小米、美团、拼多多、哔哩哔哩等企业。在美妆领域，IDG曾投资了芙清、观夏等多个品牌。\n\n与常规资本的财务型投资不同，IDG资本此次直接接手欧珀莱的品牌、公司、工厂以及生产设备，是一套完整的经营系统。这种投资逻辑，得到了资生堂的认可。\n\n资生堂在公告中明确表示，选择IDG资本是因为其在消费领域有丰富经验和专长，相信在其支持下，欧珀莱能“敏捷地执行业务”，并提升品牌价值。IDG此前在消费领域的投资（如瑞幸、优诺中国等）经验，可能被用于帮助欧珀莱进行数字化或业务重组。\n\n曾跨过30亿的欧珀莱，为何会被推上交易桌？\n\n对于资生堂而言，出售资生堂丽源，不能用一句轻飘飘的“剥离不良资产”一笔带过。\n\n欧珀莱首先是资生堂中国本土化历史中极具分量的资产。\n\n1991年，资生堂在中国大陆布局的首家合资公司——资生堂丽源成立，并建厂于北京经济技术开发区（亦庄），曾被当地人称为“亦庄第一企”。资生堂丽源于1994年正式推出了专为中国市场定制的护肤品牌“欧珀莱（AUPRES）”，当年即实现销售收入2111万元。\n\n此后，品牌凭借资生堂的研发及生产体系、专柜咨询服务和持续扩张的百货渠道快速成长。资生堂早期公开资料显示，欧珀莱创立后销售额年均增长超过30%，销售网络一度覆盖全国700余家大型商场，有效会员超过130万人。\n\n到2015年，欧珀莱专柜数量已超过1000家，年销售规模达到约30亿元，几乎构成了中国百货一楼中端护肤的标准配置。\n\n对于资生堂中国而言，欧珀莱也一直是投资的重心，资生堂也愿意将许多科研和市场资源倾注给欧珀莱。直至2024年，资生堂中国为欧珀莱举办品牌30周年庆典，并携手品牌代言人唐嫣拍摄《新肌到底，直塑年轻》品牌大片，并将资生堂功效专利成分「新肌酮」应用到欧珀莱新品黑精灵精华中。\n\n欧珀莱成功的关键，在于踩中了三个时代条件：外资技术和品牌稀缺性；百货专柜是中高端美妆的核心渠道；中国消费者需要一套针对本地肤质、气候和审美开发的产品。\n\n它也为跨国集团提供了一套早期本土化范本：在中国建立合资公司和工厂，为中国市场单独创建品牌，再通过专柜美容顾问完成产品教育与会员经营。\n\n然而，当这些条件逐渐消失，欧珀莱原有的增长模式也开始松动。\n\n尼尔森IQ数据显示，2019年至2023年，全国51个重点城市的百货购物中心化妆品柜台总数从15415个锐减至9502个，五年间消失了近6000个柜台，与此同时，现存百货美妆销售越来越向国际高端品牌集中。欧珀莱赖以成长的中端专柜市场，空间被持续压缩。\n\n渠道之外，价格带也在发生“K型分化”。\n\n高端品牌通过促销、礼赠和渠道下沉争夺中端消费者，珀莱雅、薇诺娜、可复美等本土品牌则凭借功效成分、内容电商和快速迭代向上进入200元至500元价格带。欧珀莱既要面对高端品牌向下覆盖，又要应对国货品牌向上进攻，过去依靠“资生堂技术＋中国专属”的差异化优势明显减弱。\n\n经营数据进一步解释了资生堂为何选择放手。\n\n据立信会计师事务所审计的2025全年数据，资生堂丽源该年营收累计为8.69亿元，但营业利润亏损5106.19万元，全年净利润亏损4133.7万元。截至2025年末，资生堂丽源资产总计9.01亿元，但负债高达2.82亿元。\n\n在今年1-5月，资生堂丽源营业利润亏损扩大至7125.39万元，净利润亏损额攀升至5341.52万元。《FBeauty未来迹》统计抖音、淘天、京东、快手等线上平台数据显示，2026年1-10月，欧珀莱在主流线上平台上交易额达3.93亿，同比下滑21.51%。\n\n再看资生堂财报，今年1-9月公司净销售额7411亿日元（约313亿元人民币），核心营业利润675亿日元（约合28亿元人民币），销售额和利润正在按计划稳步回升。\n\n这与资生堂当前的资源配置方向逐渐产生冲突。\n\n资生堂近年来持续优化品牌组合，把投资重点集中到SHISEIDO、肌肤之钥、NARS、IPSA和醉象等全球重点高端品牌，并明确提出缩减或退出增长前景较弱的业务。其2030中期战略进一步强调盈利能力、资本效率和现金创造，将管理资源投向最具竞争优势的领域。\n\n欧珀莱拥有历史价值和一定市场规模，却已不在集团优先投入的核心序列。对需要持续投入产品创新、数字化能力和品牌焕新的欧珀莱而言，留在资生堂体系内，反而可能长期处于资源排序靠后的位置。\n\n从这个角度看，出售体现的是战略匹配度变化。资生堂卸下一项亏损业务，集中资源支持全球重点品牌；欧珀莱则离开集团内部的非核心位置，换取独立经营和重新获得投入的机会。\n\nIDG收购之后，欧珀莱将走向自主经营\n\n早已完成了历史使命的欧珀莱，即将走上一条“自力更生”的道路。\n\nIDG资本在过往的投资中，习惯于在跨国集团调整中国业务时接盘，并倾向于依靠原有或新组建的管理团队来运营，自身仅在战略和资源上提供支持。\n\n在此次收购中IDG资本沿用了这一思路。此次收购完成后，资生堂丽源有5%的股权由上海珀知源企业管理合伙企业（有限合伙）持有，资生堂公告明确说明，该合伙企业主要由资生堂丽源的新管理团队设立，新团队在美妆品牌管理和业务转型方面拥有丰富经验。\n\n对于欧珀莱而言，这次转手是一次“温柔的放手”。\n\n一方面，脱离资生堂体系后，新公司不再需要中日双方股东层层审批，品牌决策链条会大幅缩短，决策效率和敏捷度将大幅提升，这对于需要快速响应中国市场变化的护肤品牌来说，将为品牌运营带来直接的利好。\n\n另一方面，为了确保转让后的顺利过渡，资生堂将授予业务运营所需的某些知识产权的许可，将欧珀莱“扶上马、送一程”。\n\n在转手后的特定时期内，资生堂将为新产品开发提供持续支持，为现有产品的稳定供应提供技术援助，以及提供原材料和精选产品的持续供应，通过合作的方式保持欧珀莱在创新能力、产品质量和业务方面的可持续性。\n\n不过，“自由”对于品牌而言，本就是一条艰难的路，与进入贝泰妮体系的ZA、泊美品牌相比，欧珀莱虽然拥有自主供应链体系，但没有“大树”可依靠，它的前路依旧挑战重重。\n\n一方面，新团队需要在严峻的现金流和盈利压力之下，让资生堂丽源和欧珀莱品牌重新获得“造血能力”，实现经济层面的正向循环。\n\n另一方面，在过渡期结束后，失去技术支撑的欧珀莱如何维持产品力，将是其能否真正“独立”的关键。\n\n向外看，《FBeauty未来迹》曾在《深度｜美妆掀起“399现象”，大众市场集体难了》一文中作出分析：全行业K型分化下，大众中端阵营面临的系统性困境。中端护肤品消费者结构性“消失”，是欧珀莱所处价位段需要面对的结构性挑战。\n\n欧珀莱的前三十年，属于外资合资公司、本土专属品牌和百货专柜共同繁荣的时代。\n\n它曾帮助资生堂深入中国市场，也陪伴一代消费者从基础护肤走向品质护肤。随着渠道、消费人群和集团战略改变，这套模式完成了它的第一阶段任务。\n\n接下来，欧珀莱将进入真正属于自己的经营周期。它标志着由跨国集团孵化的中国专属品牌，开始从合资时代进入独立运营时代。品牌过去依靠母集团技术与渠道获得成长，未来需要凭借自己的产品、组织和消费者关系证明价值。\n\n欧珀莱真正的新生，将发生在消费者选择它，不再只是因为它曾经属于资生堂，而是因为它就是欧珀莱。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf983a7851b","title":"吉林：统筹布局算力基础设施，科学谋划算力设施建设","url":"https://www.jiemian.com/article/15350584.html","summary":"吉林省人民政府办公厅印发《吉林省“人工智能+”发展“十五五”规划》，其中提出，统筹布局算力基础设施。","summary_short":"吉林省人民政府办公厅印发《吉林省“人工智能+”发展“十五五”规划》，其中提出，统筹布局算力基础设施。","digest":"吉林省人民政府办公厅印发《吉林省“人工智能+”发展“十五五”规划》，其中提出…","points":["吉林省人民政府办公厅印发《吉林省“人工智能+”发展“十五五”规划》，其中提出…","科学谋划算力设施建设，优化算力设施空间布局，有序扩大算力规模","扩容长春现代化都市圈算力集群，部署面向大模型训练、推理和边缘计算的高性能智算资源…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T14:24:48+08:00","size":1,"keywords":[],"body":"吉林省人民政府办公厅印发《吉林省“人工智能+”发展“十五五”规划》，其中提出，统筹布局算力基础设施。科学谋划算力设施建设，优化算力设施空间布局，有序扩大算力规模。扩容长春现代化都市圈算力集群，部署面向大模型训练、推理和边缘计算的高性能智算资源，满足低时延算力需求。依托西部绿电优势建设绿色低碳智算中心，打造绿色算力供给高地。强化数、算、电、网等资源协同配置，加大绿电直连、源网荷储一体化、新能源就近接入增量配电网等绿色算电协同创新模式推广力度，统筹算力资源与高速光纤网络协同布局。加强算力互联互通和供需匹配，积极接入全国一体化算力网监测调度平台。探索词元经济新模式，围绕词元生产、调用、分发与结算全生命周期，创新词元产品服务，提高算力利用效率与智能服务消费规模。","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"生活","total":18,"items":[{"id":"c2fd48e689f","title":"香港公開羽毛球錦標賽｜吳英倫兩局不敵「世三」安東臣 賽後不甘心：明年要展現一個更強的自己","url":"https://www.stheadline.com/realtime-sport/3638945/香港公開羽毛球錦標賽吳英倫兩局不敵世三安東臣-賽後不甘心明年要展現一個更強的自己","summary":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」、丹麥球手安東臣相遇，最終兩局直落見負，提前結束香港站賽事。","summary_short":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」…","digest":"世界排名20的港隊男單人氣小師弟吳英倫周四在體藝館續戰香港公開羽毛球錦標賽…","points":["世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球…","賽後，Jason直言：不甘心，希望新一季展現一個更強的自己","今日吳英倫開賽已進入狀態，半場暫停（interval）後手握11:4的優勢"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:19:34+08:00","size":2,"keywords":[],"body":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」、丹麥球手安東臣相遇，最終兩局直落見負，提前結束香港站賽事。賽後，Jason直言：不甘心，希望新一季展現一個更強的自己。\n首局大比數領先遭逆轉\n今日吳英倫開賽已進入狀態，半場暫停（interval）後手握11:4的優勢。尾段吳英倫已17:7領先之際，安東臣改變策略，積極控網前不願挑球，限制Jason進攻，竟然打出一波13:1的攻勢奇跡反超至20:18，唯一失1分還是安東臣自己發球偷後場出界。最終安東臣以21:19逆轉，拿下首局。\n次局難挽頹勢再敗\n第二局開局吳英倫經過調整，先以4:0領先。後被安東臣追平，兩人纏鬥至12:12，安東臣又是數次連續得分拉開比數，最後Jason力追無果，以15:21再落敗。安東臣以總局數2:0晉級8強。\nJason今年做出突破的成績，九月在深圳舉行的中國大師賽首次取得「超級750」的冠軍，本月（11月）初在南韓公開賽（超級500）亦奪得亞軍，世界排名升至新高的第20位，僅次香港一哥李卓耀一位；但今季香港站最後一場比賽，在領先大比數下被對手反勝，Jason坦言「不甘心」。\n爾郡耀攝\n爾郡耀攝\nJason坦言「不甘心」\n「今日在首局我在領先的情況下沒好好把握，我第一局打得不錯，但在領先後失去集中力，對方改變戰術，我開始出錯，可能太想贏，沒放平心態去打，我知這是不應該的。」Jason跟安東臣在九月及十月期間曾對過兩次，各有一勝一負，今次在香港主場見負，Jason最「不甘心」。\n「真的不甘心，今日在首局我在領先下沒好好把握，我第一局打得不錯，但領先後失去集中力，對方改變戰術，我開始出錯，可能太想贏，沒放平心態去打，我知這是不應該的。」\nJason坦言今季的成績及排名給予自己不少信心，知道自己也可以在大舞台上贏比賽，從今仗香港站的「不甘心」，他希望新一季展現一個更強的自己，尤其一月開始採新制的15分，五月份亦展開為期一年的洛杉磯奧運積分周期，他說：「今年有不錯的成績，明年都是繼續想贏比賽，未來一個月沒比賽，我會繼續去提升自己，新一季給一個更強的自己大家看，去證明我是可以去爭取勝利的。」\n記者：爾郡耀、徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"香港公開羽毛球錦標賽｜吳英倫兩局不敵「世三」安東臣 賽後不甘心：明年要展現一個更強的自己","url":"https://www.stheadline.com/realtime-sport/3638945/香港公開羽毛球錦標賽吳英倫兩局不敵世三安東臣-賽後不甘心明年要展現一個更強的自己","source_display":"星島頭條","published_at":"2026-11-19T17:19:34+08:00","category":"生活","digest":"世界排名20的港隊男單人氣小師弟吳英倫周四在體藝館續戰香港公開羽毛球錦標賽…"},{"title":"香港公開羽毛球錦標賽｜部署明年五月升格做超級750 香港站啟德新場獲本地及海外選手一致好評","url":"https://www.stheadline.com/realtime-sport/3638876/香港公開羽毛球錦標賽部署明年五月升格做超級750-香港站啟德新場獲本地及海外選手一致好評","source_display":"星島頭條","published_at":"2026-11-19T14:42:58+08:00","category":"生活","digest":"一年一度的香港公開羽毛球錦標賽（今年仍是超級500級別）今年起從紅館移師至可容納8…"}],"cross":{"total":2,"angles":[{"point":"世界排名20的港隊男單人氣小師弟吳英倫周四在體藝館續戰香港公開羽毛球錦標賽…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3638945/香港公開羽毛球錦標賽吳英倫兩局不敵世三安東臣-賽後不甘心明年要展現一個更強的自己"},{"point":"一年一度的香港公開羽毛球錦標賽（今年仍是超級500級別）今年起從紅館移師至可容納8…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3638876/香港公開羽毛球錦標賽部署明年五月升格做超級750-香港站啟德新場獲本地及海外選手一致好評"}]}},{"id":"c8a841d4efb","title":"打城戏迎来“新话事人” “Z世代”接续守护稀有剧种","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734756.shtml","summary":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行。","summary_short":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　18日至19…","digest":"题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　1…","points":["18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行","打城戏又名“法事戏”“和尚戏”“道士戏”，是国内独树一帜的仪式戏曲…","曾经，受多重因素影响，打城戏面临剧目散失、艺人流失，被其他剧种同化的危机，一度走到濒危的边缘"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:32:15+08:00","size":1,"keywords":[],"body":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种\n\n　　作者 叶秋云\n\n　　18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行。打城戏折子戏《目连救母·过滑油山》《目连救母·代母绕枷》《真假美猴王·闹地府》《三打白骨精·擒僧》轮番登台，古老闽南戏韵响彻剧场。\n\n　　打城戏又名“法事戏”“和尚戏”“道士戏”，是国内独树一帜的仪式戏曲，已被列入国家级非物质文化遗产代表性项目名录。\n\n　　曾经，受多重因素影响，打城戏面临剧目散失、艺人流失，被其他剧种同化的危机，一度走到濒危的边缘。吴天乙、洪球江、黄锡均、黄莺莺、伍志新、吴晓军、黄海山等老一辈艺人倾尽半生心血，口传心授开展传承活动，让打城戏重返舞台。\n\n　　如今，泉州市打城戏传承中心挂靠高甲戏传承中心，实行“一团制”(一套班子、两个剧团)的运行模式，体制与民间传承双向并行。泉州市高甲戏传承中心主任周杰俊说，打城戏是珍贵的、具有重要价值的文化资源，一代代年轻人接过接力棒，继续守护和传承这份濒临消逝的戏曲记忆。\n\n11月18日，泉州市打城戏传承中心“00后”演员陈德佳(左一)在打城戏折子戏《目连救母·代母绕枷》中饰演目连。叶秋云 摄\n\n　　展演现场，折子戏《目连救母·代母绕枷》精彩上演，饰演目连的“00后”演员陈德佳带伤上阵，翻腾跳跃，利落的武打特技引得台下掌声阵阵。\n\n　　陈德佳自12岁开始学习打城戏，至今已经与之相伴十余载。“打城戏是一个断层情况十分严重的剧种。”谈起传承的难处，陈德佳感触颇深，老一辈艺人年事已高，留存下来的大多只是纸质史料，完整影像资料寥寥无几，年轻演员越来越难获得老艺人面对面言传身教的机会。“我们必须与时间赛跑，避免陷入‘人亡艺绝’的境地。”\n\n　　自2019年以来，在文旅部门和院团推动下，泉州市打城戏传承中心扎实开展打城戏掷铙钹、吃纸吐火等特技表演，累计抢救整理创排《劈山救母》《汉宫风云》等十多部剧目。与此同时，《代母绕枷》《过滑油山》《望乡台》等目连戏传统老戏也在持续挖掘复排，守住剧种的根脉。\n\n11月18日，泉州市打城戏传承中心“00后”演员苏有明(右二)在打城戏折子戏《真假美猴王·闹地府》中饰演美猴王。叶秋云 摄\n\n　　过去，打城戏传播渠道较为单一，大多依靠下乡巡演；如今，不少看完演出的戏迷自发在社交媒体分享片段。线上“种草”带动线下观演，不少上海、浙江等地的观众跨越千里专程来到泉州看戏。“这是新时代赋予我们的红利。”“00后”演员的苏有明坦言，机遇背后同样是沉甸甸的责任和压力，“主动担当是我辈义不容辞的文化责任”。\n\n　　守正不忘出新，青年演职人员也在探索适配当代观众的表达。剧团在强调剧种特性，保持剧种特色的同时，不断升级舞美灯光，运用布景机关补足演员难以实现的舞台效果；在《三打白骨精》等剧目中适度加入生活化、网络化台词，增添喜剧趣味，拉近和观众的距离。\n\n　　周杰俊表示，长期以来在各级部门和领导、专家、侨胞等社会各界人士的关心重视下，打城戏抢救、传承、研究和展示的实践探索，在人才培养、剧目整理创作和艺术研究等方面取得了可喜的成果。保护传承单位的设立及各项具体保护传承机制的组织实施，令打城戏“95后”“00后”演员从翻阅泛黄史料复原身段唱腔，到站上展演舞台挑大梁，正成为打城戏新一代“话事人”。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c137ad6d104","title":"天氣轉冷狂流鼻水、打乞嚏 中醫教3穴位 通鼻竅/防鼻敏感","url":"https://www.stheadline.com/health-edu/3638840/天氣轉冷狂流鼻水打乞嚏-中醫教3穴位-通鼻竅防鼻敏感","summary":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。","summary_short":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。","digest":"踏入秋冬季，不少人會出現鼻敏感反覆發作，特別是天氣轉變時尤其明顯","points":["踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯","中醫認為，長期處於冷氣環境及喜食冷飲，會令寒氣鬱閉、損傷陽氣，使抵抗力下降…","濟南市國家醫院分享了簡便易行的自我保健方法，適合市民日常應用："],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:31:22+08:00","size":1,"keywords":[],"body":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。中醫認為，長期處於冷氣環境及喜食冷飲，會令寒氣鬱閉、損傷陽氣，使抵抗力下降，增加鼻敏感發作機會。除積極治療外，配合穴位按摩、艾灸及敷貼等方法，有助宣通鼻竅、紓緩不適。\n3大核心穴位 通鼻竅、安神、強體質\n除內服藥物外，中醫外治法可有效控制鼻炎症狀，降低復發率。濟南市國家醫院分享了簡便易行的自我保健方法，適合市民日常應用：\n【同場加映】轉季鼻敏感發作、狂打乞嚏！營養學家推介4類抗敏食材 連皮蘋果、紫洋蔥助止鼻水？\n1. 迎香穴——通鼻第一穴\n位置：鼻翼外緣中點旁、鼻唇溝中。\n手法：以食指指腹順時針按揉1至2分鐘。\n功效：能快速疏通鼻道，緩解鼻塞、流涕及嗅覺失靈，是治療鼻炎的常用特效穴，鼻子不適時按壓最為直接。\n2. 印堂穴——安神定敏\n位置：在兩眉頭連線的中點。\n手法：以拇指或中指指腹自下而上推按或點按約1分鐘。\n功效：配合迎香穴使用，既能通鼻竅，亦可紓緩鼻炎引起的頭昏腦脹，安神穩定情緒。\n3. 合谷穴——強壯外援\n位置：在手背第1、2掌骨間，第2掌骨橈側中點，即虎口位置。\n手法：以對側拇指用力按壓，以有酸脹感為宜，維持1至2分鐘。\n功效：中醫有「面口合谷收」之說，合谷是調理頭面部的要穴，能增強體質，幫助改善過敏底子。\n應急技巧：搓揉迎香穴 快速通鼻塞\n以食指指腹按在迎香穴上，快速沿鼻樑兩側上下推擦約1至2分鐘，至鼻部發熱；也可用熱毛巾敷鼻，直至毛巾變冷。此法能瞬間擴張血管、通氣，紓緩鼻塞。建議每天早晚各做一套，持之以恆，鼻部不適會逐漸減少。\n艾灸與敷貼 逐寒濕、通氣血\n江蘇省中醫院針灸康復科主任醫師孫建華指，艾灸可逐寒濕、通氣血，對鼻炎有一定療效。隔薑灸法以鮮生薑切片，中間刺孔，置於背部大椎、肺俞及風門穴上，再放艾炷施灸，每穴灸3炷，以皮膚潮濕、紅潤為度。生薑辛溫走竄，可增強艾灸效果。\n穴位敷貼方面，夏季鼻炎症狀緩解時，可採用白芥子、甘遂、細辛等藥物加減，調以薑汁成丸，敷貼於背部定喘、肺俞及腎俞穴，讓藥物滲入皮膚，隨經絡氣血運行吸收，以期減少冬季發作。傳統以三伏天為最佳時機，臨床觀察整個三伏天均可考慮。惟敷貼並非人人適宜，正處疾病發作期、有嚴重慢性疾患、對藥物過敏、皮膚破潰或長有瘡癤者不宜；2歲以下幼兒皮膚嬌嫩，亦不建議。敷貼後應避寒保暖，忌食生冷，以免寒氣凝滯影響療效。\n穴位按摩與艾灸敷貼屬輔助保健，不能取代正規診治；使用以上輔助保健之前，應先立即求醫或諮詢專業中醫師。\n資料來源：孫建華醫師、濟南市國家醫院\n鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發','/health-care/3345484/鼻敏感飲食開冷氣易鼻敏感流鼻水中醫推介15種食物湯水紓緩防病發');\" oncontextmenu=\"cckevent('Article','鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發','/health-care/3345484/鼻敏感飲食開冷氣易鼻敏感流鼻水中醫推介15種食物湯水紓緩防病發');\">延伸閱讀：鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發\n---","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c76d415a234","title":"伍詠薇爆邀閨密上節目被開天價 袁詠儀成嫌疑人？ 靚靚曾撐好友做嘉賓近兩年忽然少交集","url":"https://www.stheadline.com/film-drama/3638902/伍詠薇爆邀閨密上節目被開天價-袁詠儀成嫌疑人-靚靚曾撐好友做嘉賓近兩年忽然少交集","summary":"現年57歲的伍詠薇向來性格直率。","summary_short":"現年57歲的伍詠薇向來性格直率。","digest":"現年57歲的伍詠薇向來性格直率","points":["現年57歲的伍詠薇向來性格直率","近日她擔任陳敏之網台節目《Chi Chat》的嘉賓時…","她主動提供了一份好友名單，當中包括一位相識多年的女性好友"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"現年57歲的伍詠薇向來性格直率。近日她擔任陳敏之網台節目《Chi Chat》的嘉賓時，透露早前主持HOY節目《九運會客室》第二季期間，節目組曾協助聯絡嘉賓。她主動提供了一份好友名單，當中包括一位相識多年的女性好友。豈料對方得知是伍詠薇的節目後，竟透過團隊要求遠超常規的車馬費才肯受訪。伍詠薇對此感到不滿，直言若無意受訪大可婉拒，而非提出高昂費用為難幕後人員，認為此舉缺乏尊重。片段播出後引起網民熱烈討論，紛紛猜測該女星的身份，其中最多人聯聯想到其相識30年的閨密袁詠儀。\n伍詠薇與袁詠儀逾30年姊妹情\n伍詠薇與袁詠儀是相識超過30年的圈中閨密，兩人於1994年合作電影《姊妹情深》結緣。當時身為香港小姐冠軍的袁詠儀起初對亞洲小姐出身的伍詠薇有些微言，心想：「她是亞洲電視的，和我一起拍戲？」沒想到合作後發現兩人性格同樣豪爽，隨即一拍即合。\n相關閱讀：伍詠薇曾患抑鬱症提早交代身後事 怨好友疏遠：我啲朋友去咗邊 一原因鬧老友「黐X線」\n伍詠薇曾調侃袁詠儀缺乏情趣\n兩人相處百無禁忌，袁詠儀曾透露伍詠薇吃飯時愛把骨頭吐進她的碟子裡，而伍詠薇也曾調侃袁詠儀「缺乏情趣」，笑稱張智霖說笑話時只有自己會給予反應，令袁詠儀反擊指兩人「有曖昧」。\n伍詠薇與袁詠儀曾有誤會\n雖然平時喜歡互相鬥嘴，但她們極為珍視這段友誼。2016年伍詠薇主持節目《伍姑娘真識食》邀請袁詠儀擔任嘉賓時，兩人都曾因「袁詠儀私下不希望與丈夫張智霖同台現身」而產生小誤會。誤會解開後，袁詠儀更大方送上一枚鑽石戒指予伍詠薇，象徵二人友誼永固。\n相關閱讀：張智霖兒子魔童20歲生日照曝光 張慕童輪廓深邃超靚仔 五官神複製《金枝玉葉》袁詠儀\n伍詠薇認曾對張智霖動心\n伍詠薇與張智霖同樣稔熟，二人以姊弟相稱，但她曾自爆當年對張智霖動過心，笑言：「當時我有想過跟靚靚『鍊過』，但鍊了個阿練（練海棠）回來。」張智霖則感性表示：「她對我的喜歡變成了疼愛。」伍詠薇常跟張智霖分享秘密，卻怨他口疏轉頭就告訴靚靚，足見三人感情深厚。而張智霖亦曾笑指伍詠薇「成日放飛機」。\n伍詠薇與袁詠儀近兩年較少交集\n不過，今年伍詠薇主持兩輯《九運會客室》，均未見袁詠儀和張智霖擔任嘉賓，而袁詠儀和伍詠薇近兩年的公開交集亦明顯減少。這次伍詠薇透露「高昂車馬費事件」，令網民再度關注這對昔日閨密的最新關係。\n相關閱讀：張智霖兒子休學與爸爸童年缺失有關？父子檔上台認有私心：點解我要多承擔呢份壓力","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7c008479f5","title":"李政宰被爆「自肥式」經營經理人公司 拍《魷魚遊戲》袋過億公司僅分237萬 累股價暴跌連年虧損","url":"https://www.stheadline.com/film-drama/3638939/李政宰被爆自肥式經營經理人公司-拍魷魚遊戲袋過億公司僅分237萬-累股價暴跌連年虧損","summary":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位，上月中李政宰控告5名前員工挪用公款之後…","summary_short":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位…","digest":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company風波不斷…","points":["李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷…","李政宰以9：1作收入分配比率","而且當李政宰的收入超過40億韓圜時，那些超出的部分就會全歸李政宰所有"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:15:38+08:00","size":1,"keywords":[],"body":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位，上月中李政宰控告5名前員工挪用公款之後，昨日（18日）又被《Dispatch》（D社）大爆李政宰以「自肥式經營」經理人公司，令公司連年虧損，股價暴跌。\n李政宰以9：1作收入分配比率\n據D社報道，李政宰與AC以9：1作為其演藝收入分配比率，李政宰的收入頭40億韓圜（約2,369萬港元）中，他本人分得當中90%，AC則只能取得10%。而且當李政宰的收入超過40億韓圜時，那些超出的部分就會全歸李政宰所有。據知AC旗下其他藝人，如廉晶雅、林智妍、金惠奫的合約都沒有這樣的條款。\n李政宰公司一年暴跌70%\n據指李政宰拍攝《魷魚遊戲》第2、3季時，每集片酬超過120萬美元（約17億韓圜、1,007萬港元），他拍攝了13集，總共賺得超過200億韓圜（約1.18億港元）。但AC只能從200億當中的頭40億韓圜中，抽取10%，所以就算李政宰賺了1,000億，AC亦只能分得4億韓圜（約236.9萬港元）。而李政宰是透過其個人公司Verdant Hills收取結算款項，根據2025年的業務報告，AC轉入該公司金額高達201億韓圜（約1.19億港元），與上述他拍《魷魚》2、3季的片酬相若，證明這套「自肥式」分成方法屬實。身為最大股東的李政宰去年賺成1.19億港元，但公司也只能分得唔夠237萬港元，難怪AC在市場表現疲弱。他們去年以每股13,610韓圜（約80.6港元）開盤，年底收盤價已跌到4,050韓圜（約24港元），一年內暴跌70%。\n李政宰逼子公司交雙重租金\n另外，李政宰自收購著名韓劇製作公司RaemongRaein（來夢來人） 後，就積極推動RaemongRaein（RR）的辦公室搬遷，將RR從論峴洞總部搬到李政宰旗下物業，然而論峴洞那邊的租約還有1年7個月才到期，RR被逼急搬之下，須交晒新舊辦公室的租金。據知論峴洞總部每月租金2,400萬韓圜（約14.2萬港元），而李政宰物業租金亦唔平，去年RR就支付了1.3億韓圜（約77萬港元）租金，今年上半年亦已支付了9,000萬韓圜（約55.3萬港元）租金。\n李政宰公司發聲明澄清\n而李政宰今年3月亦成立了Vena Beauty，發展化妝品事業。3個月後，AC亦於6月宣布進軍化妝品市場，並將李政宰親自開發的產品及個人國際知名度等資產投入新事業。不過，D社又踢爆AC除了必須每年向Vena Beauty支付最低保證金，還得依照營業成果支付10%的營利收益。然而AC回應指報道不實，更聲稱將採取法律行動。他們發表聲明表示，與李政宰的合約屬於「一般常見的合約」，而且是一份合理的合約，指李政宰和曾同任執行董事的鄭雨盛都沒有收取執行董事薪酬，兩人簽署的合約條款一樣。而李政宰有關《魷魚遊戲》的合約和海外工作均由美國經理人公司CAA負責，故片酬分成亦由CAA負責。雖然AC沒有直接參與，但亦根據合約獲得了部分收入。至於RR被收購後急搬總部一事，AC解釋說是方便處理法律糾紛，開展管理活動和業務運營。\n李政宰考慮過放棄最低保證金\n至於Vena Beauty部分，AC指出考慮到李政宰的廣告代言費通常高達數億韓圜，如今給Vena Beauty每年3,000萬韓圜（約17.7萬港元）的最低保證金，數額其實一點也不高。AC更指李政宰為了公司利益，本來考慮放棄最低保證金，但鑑於免費提供授權可能產生稅務問題，最終決定採用最低金額。他們更補充道：「根據合約，如果業績超過雙方約定的目標營業利潤，Vena Beauty只能獲得超額利潤的一部分，並且在達到目標營業利潤之前，除最低保證金外，不會獲得任何其他與業績掛鉤的回報。此外，合約還規定，任何未分配給Vena Beauty的超額利潤，都要再投資於公司業務。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7450287afa","title":"海鮮紅燒豆腐食譜 簡單7步炮製鮮甜海鮮","url":"https://news.tvb.com/tc/1206638-海鮮紅燒豆腐食譜簡單7步炮製鮮甜海鮮","summary":"想在家中炮製豐富又惹味的家常菜？不妨嘗試這道海鮮紅燒豆腐。","summary_short":"想在家中炮製豐富又惹味的家常菜？","digest":"想在家中炮製豐富又惹味的家常菜","points":["想在家中炮製豐富又惹味的家常菜","不妨嘗試這道海鮮紅燒豆腐","外脆內嫩的普寧豆腐吸滿濃郁芡汁，配搭鮮甜爽彈的蝦仁與魷魚，層次豐富，絕對是佐飯首選"],"section":"生活","category":"生活消閒","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:09:00+08:00","size":1,"keywords":["食譜"],"body":"想在家中炮製豐富又惹味的家常菜？不妨嘗試這道海鮮紅燒豆腐。外脆內嫩的普寧豆腐吸滿濃郁芡汁，配搭鮮甜爽彈的蝦仁與魷魚，層次豐富，絕對是佐飯首選！\n\n海鮮紅燒豆腐食材\n主料： 蝦仁 100克、魷魚 100克、白菜仔 100克、普寧豆腐 2件、薑 3片、蒜頭 2粒（切片）\n\n海鮮醃料： 鹽 1/4茶匙、胡椒粉 少許、生粉 半茶匙\n\n芡汁： 清水 3/4杯、蠔油 1湯匙、生抽 1湯匙、糖 1茶匙、生粉 1茶匙\n\n海鮮紅燒豆腐做法\n蝦仁去殼挑腸，魷魚輕切花紋再切件，分別下醃料拌勻略醃。\n\n普寧豆腐切件，抹乾水分後放入油鍋炸至金黃，盛起備用。\n\n原鍋剩下少許油，爆香薑片、蒜片，下清水，加入白菜仔炒至約八成熟，盛起備用。\n\n原鍋下薑片、蒜片爆香，先放入蝦仁炒至八、九成熟，盛起，原鍋再放入魷魚炒香，灒酒後盛起備用。\n\n另起油鍋，爆香薑片、蒜片，灒酒，將芡汁拌勻下鍋。\n\n待芡汁煮滾，放入普寧豆腐、白菜仔煮至入味。\n\n海鮮回鍋，合蓋煮約30秒，原鍋上桌，即成。","image":"https://pro-img-cdn.tvb.com/uploads/file/2026/11/2026le7VThqtLA1794820156.webp?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c83568865b9","title":"VTC委任民政署前署長張趙凱渝任執行幹事 明年起接替唐智強","url":"https://www.stheadline.com/edu-insights/3638861/VTC委任民政署前署長張趙凱渝任執行幹事-明年起接替唐智強","summary":"職業訓練局（VTC）公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事，接替即將卸任的唐智強，明年1月1日起生效。","summary_short":"職業訓練局（VTC）公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事，接替即將卸任的唐智強…","digest":"職業訓練局公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事…","points":["職業訓練局（VTC）公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事…","延伸閱讀：職訓局新學年增至逾14000學額 140項課程涵蓋AI與文創產業 航空及航海教育中…","張趙凱渝為資深政務官，1986年加入政府服務近40年，曾於政府多個決策局及部門工作…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:14:21+08:00","size":1,"keywords":[],"body":"職業訓練局（VTC）公布，已獲政府同意，委任民政事務總署前署長張趙凱渝出任執行幹事，接替即將卸任的唐智強，明年1月1日起生效。\n延伸閱讀：職訓局新學年增至逾14000學額 140項課程涵蓋AI與文創產業 航空及航海教育中心明年落成\n張趙凱渝為資深政務官，1986年加入政府服務近40年，曾於政府多個決策局及部門工作，包括2019年至2022年出任運輸及房屋局副秘書長（房屋）／房屋署副署長（策略），2022年起出任民政事務總署署長至2025年退休。VTC透過公開招聘，挑選張趙凱渝接任執行幹事。\nVTC主席林健鋒表示，張趙凱渝有卓越的領導和管理能力，及廣闊政策視野，對香港未來人才發展需要具深刻見解，相信她將帶領VTC深化與政府、業界及社會各界的合作，培育更多人才配合經濟轉型及產業發展需要，為香港及國家的高質量發展注入新動力。\n即將卸任的唐智強，自2022年起出任執行幹事。林健鋒讚揚他以前瞻視野，帶領VTC在多個範疇取得重要成果，並積極配合國家及香港的發展策略，加強職專教育與產業需要的聯繫。\n延伸閱讀：VTC轄下牙科護理文憑 首屆畢業生就業率近百分百\n唐智強任內推動多項校園設施發展項目，包括茶果嶺新校舍發展計劃、VTC航空及航海教育中心，以及升降機及自動梯科技中心等，並帶領VTC成立香港資訊科技學院（HKIIT），成為本港首間專注培育資訊科技人才的專上學院。\n本報記者","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce515f8a09b","title":"孟京辉：在浪漫与科技间试探戏剧边界","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734596.shtml","summary":"中新网杭州11月19日电(林波 孙琳茹)“现在戏剧和以前不一样了。","summary_short":"中新网杭州11月19日电(林波 孙琳茹)“现在戏剧和以前不一样了。","digest":"“现在戏剧和以前不一样了","points":["中新网杭州11月19日电(林波 孙琳茹)“现在戏剧和以前不一样了","”11月18日至26日，2026第十五届杭州当代戏剧季在杭州举行","其间，戏剧导演孟京辉受访时表示，当下戏剧正走出小众剧场，被越来越多年轻人喜爱…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:08:44+08:00","size":1,"keywords":[],"body":"中新网杭州11月19日电(林波 孙琳茹)“现在戏剧和以前不一样了。”11月18日至26日，2026第十五届杭州当代戏剧季在杭州举行。其间，戏剧导演孟京辉受访时表示，当下戏剧正走出小众剧场，被越来越多年轻人喜爱，持续释放独特魅力。\n\n　　作为综合艺术，戏剧兼具即时性与感染力，能够吸纳音乐、舞蹈、文学、影像等各类艺术表达，也因此催生了遍地开花的戏剧节生态。\n\n　　在孟京辉看来，乌镇戏剧节的国际化、阿那亚戏剧节扎根海边的生活质感，各有风姿。“杭州当代戏剧季，生长在这座江南城市，又落址滨江这片科创高地，正在酝酿独属于自己的气质。”\n\n11月18日晚，孟京辉在2026第十五届杭州当代戏剧季上分享。　孙琳茹 摄\n\n　　“我希望杭州的戏剧，更浪漫一点。”孟京辉说，信息互通的时代里，城市之间的文化壁垒日渐消弭，但一场戏剧事件的内在质感，是地域赋予的独特标识。\n\n　　作为第十五届杭州当代戏剧季的艺术总监，孟京辉表示，杭州当代戏剧季始终贴着城市脉搏生长，十五年的沉淀，不是追逐一时热度，而是一场长效、持续的艺术实践。\n\n　　他说：“艺术这件事急不得，需要慢慢酝酿，新的想法、新的表达，才会一点点孕育出来。”\n\n　　对杭州，孟京辉有着绵长的情感联结。《恋爱的犀牛》除北京之外，在杭州演出场次最多，这片土地见证了这部先锋经典的传播；去年，余华作品《古典爱情》的舞台改编，也在这里落地。\n\n《恋爱的犀牛》剧照。(资料图，主办方供图)\n\n　　浪漫的底色之外，孟京辉把更多目光投向科技与戏剧的碰撞——让古老东方文化基因，和前沿科技碰撞，为当代戏剧打开新的想象空间。譬如，在《古典爱情》中，实时动态捕捉装置就已经让身体直接触发灯光与影像，技术的逻辑被接入戏剧的语法。\n\n　　在孟京辉手里，科技不是舞台奇观，而是一种新的戏剧身体。\n\n　　边界的试探，不只发生在浪漫与科技之间，也发生在代际之间。十五年一轮回望，经典的回响之外，更令他欣喜的是青年创作者的崛起。\n\n　　他注意到，新一代创作者的视角、舞台空间处理方式、叙事节奏都跳出过去的固有框架，如《今晚，朝阳水库淹没亚细亚》这类轻盈的新作，以小见大，把目光投向个体内心，藏着细腻的人文关怀，展现出新生代不容小觑的创作力量。\n\n　　在他眼中，戏剧天然拥有吸纳时代美好能量的能力，不同路径的探索，都是在拓宽戏剧的边界。\n\n　　“年复一年，我们想要的不仅仅是让观众感受戏剧的能量，我们更想要试探戏剧能量的边界。”正如《恋爱的犀牛》中那句广为流传的台词——“爱她，是我一生中做过的最好的事情”，这部承载一代人记忆的作品，传递着关于爱、理想与孤独的诗意。\n\n　　“我们也将继续兼顾大小剧目，兼容经典与新锐，在浪漫的底色之上，持续探索戏剧的当代表达，让戏剧扎根城市，陪伴一代又一代观众与创作者，持续生长。”谈及下一步探索方向，孟京辉如是说。\n\n　　在浪漫与科技之间，这位戏剧导演仍在试探边界，也试图让戏剧在城市与时代里长出新的可能。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c668d2fda89","title":"林子祥歌曲〈敢愛敢做〉登陸GTA 6 網民惡搞海報狂抽黑歷史 繼〈季候風〉再有粵語歌衝向國際","url":"https://www.stheadline.com/film-drama/3638856/林子祥歌曲敢愛敢做登陸GTA-6-網民惡搞海報狂抽黑歷史-繼季候風再有粵語歌衝向國際","summary":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式開售，隨即在全球玩家群中掀起熱潮。","summary_short":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式開售…","digest":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto…","points":["歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）…","不少華人玩家在遊戲中發現，當車載電台切換至「萬花筒FM」（Kaleidoscope FM）時…","這首歌正是香港殿堂級歌手林子祥在1987年推出的經典流行金曲〈敢愛敢做〉"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:07:00+08:00","size":1,"keywords":[],"body":"歷時13年開發的世紀遊戲《GTA6》（俠盜獵車手6/Grand Theft Auto VI）今日（11月19日）正式開售，隨即在全球玩家群中掀起熱潮。不少華人玩家在遊戲中發現，當車載電台切換至「萬花筒FM」（Kaleidoscope FM）時，背景音樂竟然傳出非常親切的粵語歌。這首歌正是香港殿堂級歌手林子祥在1987年推出的經典流行金曲〈敢愛敢做〉。這一發現隨即在 Threads、Instagram 及微博等各大社交平台引發熱烈討論。\n網民讚流行經典長青：完美貼合遊戲氛圍\n雖然〈敢愛敢做〉是改編自美國組合 Starship 的經典名曲〈Nothing's Gonna Stop Us Now〉，但不少網民和玩家都認為，林子祥的版本唱得極具爆發力，甚至比原版更具感染力。歌曲旋律與歌詞亦相當貼合《GTA》系列狂野不羈的遊戲風格，其中一句歌詞「個個說我太狂 笑我不羈」更瞬間成為網絡金句。有玩家興奮表示：「沒想到能在《GTA 6》裡聽到林子祥的歌！」、「官方選曲真的非常出色，既浪漫又充滿激情。」\n相關閱讀：The Weeknd啟德演唱會丨新歌〈Hong Kong〉神級Sampling王菲〈季候風〉 專屬MV玩王家衛風\n繼 The Weeknd 採樣王菲後 再有粵語歌登上國際舞台\n這已不是近期首度有粵語流行曲登上國際舞台。加拿大流行天王 The Weeknd 上月在啟德體育園舉行香港站演唱會時，曾在現場首唱新歌〈Hong Kong〉，當中破天荒採樣了樂壇天后王菲的粵語經典〈季候風〉，當時在網上引發極大迴響。\n事隔僅個多月，再有粵語流行歌衝出國際。伴隨著《GTA 6》龐大的玩家基數，不少玩家預測林子祥這首經典金曲將在短期內重新席捲各大音樂串流平台，讓全球更多聽眾認識到香港80年代流行音樂的魅力。\n車載電台搜羅各地曲風 網民幽默聯想陳年舊聞\n在遊戲的「萬花筒FM」電台中，搜羅了世界各地、橫跨不同年代的多元流行樂曲。當電台播放此曲時，遊戲螢幕會顯示歌手為「GEORGE LAM」，而歌名則以漢語拼音標註為〈GAN AI GAN ZUO〉。除了林子祥的作品外，該電台亦收錄了 Ariana Grande〈Break Free〉、Drake〈Hold On, We're Going Home〉、Dua Lipa〈Go Easy〉，以及韓國女團 BLACKPINK 成員 Jisoo〈Earthquake〉與 Jennie〈Mantra〉等國際熱門歌曲。\n有趣的是，《GTA》系列一向主打犯罪與黑色幽默題材，有網民笑言官方之所以挑選林子祥，或許是聯想到他於1999年在美國夏威夷涉嫌意外拿走太陽眼鏡的陳年舊聞。更有創意爆棚的網民利用 AI 製作了二創宣傳海報，將遊戲男主角換成身穿白色背心、留著招牌鬍鬚的林子祥，海報中的女主角更刻意拿著一副黑色太陽眼鏡，幽默點子逗樂不少網民。\n相關閱讀：林子祥葉蒨文演唱會激咀逐格睇 錫完一動作超甜密 Sally撒嬌如少女：我青春畀你攞晒\nThe Weeknd在巡迴香港站推出新歌〈Hong Kong〉：","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3d6f4b5bbc","title":"周末6大免費親子活動推介 玩轉西九爵士音樂節/太空館觀星/文化嘉年華 附時間地點","url":"https://www.stheadline.com/ohpama/3638390/周末6大免費親子活動推介-玩轉西九爵士音樂節太空館觀星文化嘉年華-附時間地點","summary":"親子好去處2026｜今個周末還在想帶小朋友去哪裡？","summary_short":"親子好去處2026｜今個周末還在想帶小朋友去哪裡？","digest":"親子好去處2026｜今個周末還在想帶小朋友去哪裡","points":["親子好去處2026｜今個周末還在想帶小朋友去哪裡","本週末有不少精彩活動，全部免費入場","無論想帶小朋友欣賞爵士音樂節、親子觀星，抑或參與民族嘉年華及親子工作坊等…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T11:41:17+08:00","size":1,"keywords":[],"body":"親子好去處2026｜今個周末還在想帶小朋友去哪裡？本週末有不少精彩活動，全部免費入場！無論想帶小朋友欣賞爵士音樂節、親子觀星，抑或參與民族嘉年華及親子工作坊等，以下5大親子活動都能滿足不同需要的小朋友。立即記下以下活動時間、地點及參加詳情！\n博愛醫院 Chill Buddy 親子嘉年華\n「Chill Buddy 親子嘉年華」透過創意互動遊戲，讓家長與小朋友增進溝通及認識情緒。活動特設四大特色攤位，包括考驗默契、由家長蒙眼按子女指示畫畫的「蒙眼藝術家」；保密寫下心事換取鼓勵小卡的「樹洞回音」；將煩惱貼在冰壺推向解決方案、寓意減壓的「冰壺壓力回收站」；以及讓親子共同製作個性風鈴的「『魚』眾不同」。完成攤位遊戲即可獲得小禮物一份。\nChill Buddy 親子嘉年華 \n活動日期：2026年11月21日\n活動時間：11:00-18:00 \n活動地點：牛頭角上邨商場對出空地\n參加方法：費用全免，即場參加\n太空館 星空遊樂園\n今個周末太空館會化身成「星空遊樂園」，參加者可在天台使用天文望遠鏡觀賞維港上的星光，也可在展覽廳參與遊戲，認識天文知識。天台觀星活動共4節，每節約25分鐘，活動內容相同，每節名額80人。\n（圖片來源：香港太空館網站）\n太空館 星空遊樂園\n活動日期：2026年11月21日\n活動時間：19:00-21:00 \n活動地點： 香港太空館展覽廳及天台\n參加方法：於當天下午6:30在太空館正門處派發免費參加證，先到先得，額滿即止\n康文署《亞裔藝采+ 2026》嘉年華\n戶外嘉年華「亞裔藝采+」以「禮意綻放」為主題匯聚約30個國家及地區代表，帶來多元歌舞與親子工作坊。同場的「盛禮薈萃」民族文化展覽則展出各地珍貴手工藝藏品，適合一家大小共同探索不同文化的獨特風采。\n（圖片來源：香港特別行政區政府新聞公報網站）\n康文署《亞裔藝采+ 2026》嘉年華\n活動日期：2026年11月22日\n活動時間：14:00-18:00 \n活動地點： 九龍尖沙咀梳士巴利道10號香港文化中心大堂及露天廣場\n參加方法：免費入場，更多詳情可按此瀏覽\n國泰 西九爵士音樂節 \n今年「國泰西九爵士音樂節」免費演出雲集本地、中國內地、泰國、韓國及歐洲等地逾30個音樂單位，讓大小朋友感受即興與跨界音樂火花！一家大細可於大草坪及海濱西草坪邊野餐放電、邊逛15個本地品牌美食市集，或到M+草坪欣賞非洲鼓及手碟等特色樂器演出。現場詢問處更免費提供護耳罩借用，貼心照顧小朋友聽覺需要！\n由即日起於網上或國泰西九爵士音樂節現場登記成為 「西九演藝藝探會員」，只需出示有效會員證明，即可於11月21、22日到大草坪（餐飲市集）免費換領迎新飲品指定啤酒或特調汽水1罐（數量有限，先到先得，換完即止）。\n（圖片來源：WestK 西九文化區 instagram）\n（圖片來源：西九文化區網站）\n\n國泰西九爵士音樂節-免費音樂節目\n活動日期：2026年11月17日至22日\n活動時間：\n• 11月17至20日：20:15-22:45\n• 11月21日：14:30-22:30\n• 11月22日：14:00-22:45\n活動地點： 西九文化區（留白Livehouse、大草坪、海濱西草坪）\n參加方法：免費入場，部分項目需提早購票，更多詳情可按此瀏覽\nYMCA 「愛 • 和平」行動 2026\n由香港中華基督教青年會（YMCA）舉辦的「愛‧和平」行動2026，當日邀請到巴黎殘疾人奧運會輪椅羽毛球銀牌得主陳浩源先生擔任活動大使，鼓勵大眾透過運動關心自己、關愛他人。現場亦設有多個精彩攤位，參加者完成攤位遊戲更可換領豐富禮品，適合一家大小共同參與，盡興而歸。\n（圖片來源：Chinese YMCA of Hong Kong 香港中華基督教青年會 Facebook）\nYMCA 「愛 • 和平」行動 2026\n活動日期：2026年11月21日\n活動時間：14:30-17:00 \n活動地點： 啟德雙子匯2期8樓\n參加方法：免費入場\n香港女童軍總會 營地同樂日\n香港女童軍總會舉辦的營地同樂日設有3大特色活動，包括「減壓捏捏球」，參加者可發揮創意並搭配色彩，親手製作獨一無二的可愛小物。「拼豆創作」則以像素風手作形式，讓大眾利用色彩繽紛的拼豆拼砌喜愛圖案。以及「手轉小陀螺彩繪」，為經典木製小陀螺繪上獨特色彩與圖案，轉動時色彩斑斕，更可與家人及朋友即時展開陀螺大賽。無論大人或小朋友，均可一同享受這個充滿歡笑與探索的開放日。\n官方圖片\n香港女童軍總會-營地同樂日\n活動日期：2026年11月22日 \n活動時間：13:00-17:00\n活動地點：香港女童軍總會 梁省德海上活動訓練中心（大埔大美督船灣淡水湖側）\n參加方便：毋須預約，即場登記，費用全免","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cef89065dcf","title":"消委會潤手霜2026｜秋冬皮膚乾燥易有濕疹主婦手 推介10款高分潤手霜最平$24","url":"https://www.stheadline.com/health-care/3284256/消委會潤手霜2026秋冬皮膚乾燥易有濕疹主婦手-推介10款高分潤手霜最平24","summary":"消委會潤手霜2026｜秋冬天氣乾燥，雙手容易脫皮或乾裂。","summary_short":"消委會潤手霜2026｜秋冬天氣乾燥，雙手容易脫皮或乾裂。","digest":"消委會潤手霜2026｜秋冬天氣乾燥，雙手容易脫皮或乾裂","points":["消委會潤手霜2026｜秋冬天氣乾燥，雙手容易脫皮或乾裂","消委會與國際消費者研究及試驗組織曾進行有關潤手霜的評估，測試13款在本港出售的潤手霜…","消委會推介10款高分且保濕功效強潤手霜，價錢最低更只需要$24，其中包括「NIVEA」…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T11:30:55+08:00","size":1,"keywords":[],"body":"消委會潤手霜2026｜秋冬天氣乾燥，雙手容易脫皮或乾裂。消委會與國際消費者研究及試驗組織曾進行有關潤手霜的評估，測試13款在本港出售的潤手霜，發現大部分潤手霜的保濕效果理想。消委會推介10款高分且保濕功效強潤手霜，價錢最低更只需要$24，其中包括「NIVEA」、「Avène」等常見的品牌。\n消委會潤手霜測試 10款高分潤手霜防乾燥濕疹\n根據《選擇月刊》第517期測試報告，消委會總共測試13款在本港有售的潤手霜，售價由約$24至$210不等。每款潤手霜都安排30位試用者進行為期兩星期的測試，並透過試用者的皮膚狀況進行評估。\n【同場加映】為甚麼要使用潤手霜？防手部乾燥引發濕疹？\n\n消委會推介10款高分潤手霜\n消委會檢測不同潤手霜的保濕功效和水份流失速度，結果發現，有10款潤手霜測試後總評分獲4星以上的高分評價，名單如下：\n\n消委會推測試 12款潤手霜保濕功效理想\n消委會指，試用者在使用各款潤手霜樣本2星期後，皮膚表面量度所得的電容值都明顯高於基線水平，反映樣本的保濕效能普遍理想。其中有12款保濕功效達4分或以上：\n5分潤手霜\n KIEHL'S 高效能潤手霜（聲稱來源地：美國 ）\n4分潤手霜\n BIODERMA Atoderm 柔潤護手霜（聲稱來源地：法國）\n NIVEA NOURISHING CARE HAND CREAM（聲稱來源地：西班牙）\n EAU THERMALE AVENE （聲稱來源地：法國 ）\n CAUDALIE 葡萄籽滋潤抗氧潤手霜（聲稱來源地：法國 ）\n YVES ROCHER 山金車深層滋養潤手霜（聲稱來源地：法國 ）\n AESOP 尊尚芳香護手霜（聲稱來源地：澳洲 ）\n Kamill 卡蜜兒強效滋潤護甲潤手霜（聲稱來源地：德國 ）\n EUCERIN 抗乾燥深度滋養手霜5%（聲稱來源地：波蘭 ）\n Jurlique 玫瑰護手霜（聲稱來源地：澳洲 ）\n L'OCCITANE乳木果潤手霜（聲稱來源地：法國 ）\n EOS 潤手乳霜 （蘭花香草）（聲稱來源地：美國 ）\n為甚麼潤手霜會油膩？越油保濕效果越好？\n潤手霜怎樣防止水分流失？消委會指出，普遍潤膚產品除了含有保濕劑來補充皮膚水分，通常也同時含有封鎖劑，有助在皮膚表面形成抗水的屏障。傳統的封鎖劑含有礦脂和礦物油，如果配方中含有超過5%的礦脂，能有效減少水分通過皮膚表面的流失。雖然礦脂的隔水效果比礦物油和矽類化合物更理想，但會令皮膚觸感變得油膩，而這亦是大部分潤手霜觸感油膩的原因。\n30位試用者實測 推介6款好用潤手霜\n消委會表示，是次測試中有邀請30位不同年齡的女士試用潤手霜，並在產品的接受程度、產品效能上進行評分，其中有6款評價評分較高，獲3.5點評分以上。試用均認為該乳霜易推，質地不會過於油潤或黏膩，吸收程度理想，而且令皮膚變平滑，名單如下：\n\n4分潤手霜：\n NIVEA NOURISHING CARE HAND CREAM\n3.5分潤手霜：\n KIEHL'S高效能潤手霜\n BIODERMA Atoderm 柔潤護手霜\n CAUDALÍE 葡萄籽滋潤抗氧潤手霜\n YVES ROCHER 山金車深層滋養潤手霜\n EOS 潤手乳霜 （蘭花香草）\n試用者推介不黏膩潤手霜 哪款氣味最易接受？\n此外，試用者亦為不同潤手霜的氣味和油潤黏膩程度進行評分，排名如下：\n\n最歡迎氣味（清淡而柔和） \n NIVEA\n YVES ROCHER\n較不受歡迎氣味（氣味太濃） \n Jurlique\n最受歡迎質地 （清爽不黏膩）\n BIODERMA\n NIVEA\n較不受歡迎質地 （感覺稍為油潤、黏膩）\n 卡蜜兒\n Eucerin\n lavera\n消委會教保養雙手貼士 正確使用潤手霜防爆拆\n消委會指出，保養雙手和使用潤手霜也有技巧，並教4大貼士：\n.\n\n護手方法：\n1. 使用潤手霜方法\n 建議適當洗手並擦乾後，取適量潤手霜塗抹於雙手，不要忽略手指、指尖和指縫，輕輕按摩至完全吸收。\n2. 清潔工作前保護\n 進行清潔工作，例如洗碗或需要接觸強力清潔劑的家務，應配戴手套以避免雙手反覆接觸化學物品和刺激物質。\n3. 戶外活動後使用\n 長時間在戶外活動例如踏單車和遠足，事前應做足防曬措施，手背和手指都應塗上防曬乳液並適時補塗。經陽光曝曬後，皮膚可能較為乾燥，建議使用潤手霜滋潤雙手。\n4. 五類人群需特別注意\n 長期病患者（如糖尿病、甲狀腺疾病患者）和皮膚病患者（如濕疹、牛皮癬患者）等可能因疾病而長期皮膚乾燥。\n 長者的皮膚油脂分泌較少，保濕效果較差，同樣易受皮膚乾燥問題困擾。\n 部分職業人士如髮型師、醫護人員等雙手經常沾水、接觸清潔劑或化學物品。\n 建議上述人士多加留意手部和身體的皮膚護理，塗抹潤手霜時不能忽略指尖、指縫等較為乾燥的部位，塗抹潤手霜的次數宜按需要增加，不含香料的潤手霜型號或許較為適合。\n延伸閱讀：消委會推介9款安全滿分潤唇膏 不含致癌礦物油\n\n延伸閱讀：濕疹7大常見症狀\n延伸閱讀：護理濕疹皮膚2大貼士\n相關文章：\n消委會免沖水洗頭水｜21款產品逾6成含致癌致敏物 5款較安全 $68完勝$390！\n消委會染髮劑｜16款染髮劑含致敏物可致腎中毒 9款獲滿分最安全 50惠上榜\n消委會氣炸鍋推介｜6款致癌物超標 5款安全高分最平$548 2招減致癌物\n《星島頭條》APP經已推出最新版本，請立即更新，瀏覽更精彩內容：https://bit.ly/3yLrgYZ\n\n 最Hit\n\n 撳錯即中招！「我不是機器人」淪新型釣魚陷阱 網民險被盜密碼+個人資料 小心網頁這些特徵...\n\n 生活百科\n\n 20小時前\n\n 胡定欣與醫生老公陳健華放閃約「媒人」打波 劉愷威攜新女友黎紀君甜蜜同框\n\n 影視圈\n\n 13小時前\n\n 深圳APEC｜歡迎晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n\n 即時中國\n\n 7小時前\n\n 羅霖餅印長子高大帥氣 精緻五官遺傳亞姐冠軍神基因 港大碩士英俊外貌網民讚可原地出道\n\n 影視圈\n\n 2026-11-18 08:00 HKT\n\n 深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n\n 即時中國\n\n 4小時前\n\n 行山愛好者競投石屋 出價100萬惜落空 不愛「石屎森林」 嘆有錢未必買到好環境\n\n 樓市動向\n\n 18小時前\n\n 09:22\n\n 深圳APEC︱習近平：中方提供2000萬美元資助開展亞太經合組織務實合作︱不斷更新\n\n 即時中國\n\n 1小時前\n\n 再就業津貼最後召集｜限期前拎足$20,000！40歲以上全職兼職皆有份 明年7月完結即睇申請資格\n\n 生活百科\n\n 19小時前\n\n 深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身深圳\n\n 即時中國\n\n 8小時前\n\n 洪天明自爆全家移居杭州 與老婆周家蔚曾因長時間分居兩地屢傳婚變 多次提出離婚\n\n 影視圈\n\n 23小時前\n\n 聯絡我們\n\n 關於我們\n\n 隱私政策聲明\n\n 使用條款\n\n 版權及免責聲明\n\n 幫助及反饋\n\n 我要爆料\n\n 無障礙網頁\n\n Copyright © 2026 SingTao Ltd.All rights reserved. \n\n 本網站正使用 Cookies\n\n 我們使用 Cookie 改善網站體驗。 繼續使用我們的網站即表示您同意我們的 Cookie 政策。\n\n 同意及關閉\n\n 《星島頭條》流動應用程式(APP)是一個結合生活、新聞資訊、視頻、個人化功能及生活實用小工具的綜合平台。\n\n 繼續瀏覽立即下載","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9f4fbca592","title":"黑龙江共青团“金秋助学”希望工程圆梦行动助力5.6万名学子逐梦成才","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734553.shtml","summary":"中新网哈尔滨11月19日电(记者 刘璐 赵宇航)11月18日晚，由黑龙江省青少年发展基金会主办的“托举梦的力量”——共青团“金秋助学”希望工程圆梦行动十周年公益分享会在哈尔滨举办。","summary_short":"中新网哈尔滨11月19日电(记者 刘璐 赵宇航)11月18日晚…","digest":"黑龙江共青团“金秋助学”希望工程圆梦行动助力5.6万名学子逐梦成才","points":["中新网哈尔滨11月19日电(记者 刘璐 赵宇航)11月18日晚…","来自社会各界的爱心企业、受助学子等1000余人参加活动","希望学子代表轮番登台分享成长故事，昔日受助的青少年如今成长为奋斗在祖国建设各条战线上的栋梁之…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T11:27:19+08:00","size":1,"keywords":[],"body":"中新网哈尔滨11月19日电(记者 刘璐 赵宇航)11月18日晚，由黑龙江省青少年发展基金会主办的“托举梦的力量”——共青团“金秋助学”希望工程圆梦行动十周年公益分享会在哈尔滨举办。来自社会各界的爱心企业、受助学子等1000余人参加活动。\n\n11月18日晚，“托举梦的力量”——共青团“金秋助学”希望工程圆梦行动十周年公益分享会活动现场。赵宇航 摄\n\n　　歌舞《这世界充满爱》拉开分享会帷幕，情景诗朗诵《十年前的来信》《一个也不能少》、希望工程主题曲《大眼睛》、黑龙江希望工程原创歌曲《雨露与花》等多个节目展现社会各界爱心人士的公益善举。希望学子代表轮番登台分享成长故事，昔日受助的青少年如今成长为奋斗在祖国建设各条战线上的栋梁之材。\n\n11月18日晚，“托举梦的力量”——共青团“金秋助学”希望工程圆梦行动十周年公益分享会节目表演现场。赵宇航 摄\n\n　　活动现场还发布《“金秋助学”新十年行动倡议书》，向十年来对黑龙江希望工程公益事业做出突出贡献的爱心企业、合作伙伴、工作者等致敬，号召各界争做微光聚力的爱心资助者、薪火相传的成长引路人、弘扬美德的公益宣传员，推动共青团“金秋助学”希望工程圆梦行动持续发展。\n\n　　据悉，自2017年共青团“金秋助学”希望工程圆梦行动启动以来，项目累计募集爱心善款1.1亿元，精准帮扶5.6万名黑龙江困境学子顺利完成学业、逐梦成才；逐步构建组织化、社会化、网络化相结合的资源筹集机制，搭建覆盖基础教育、职业教育、高等教育的全学段、全方位资助体系，形成跟踪帮扶、职业规划、岗位实习一体化资助服务链条，在资助学业的同时，引导青少年厚植家国情怀、树立远大理想。(完)\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c229b07c455","title":"曼聯‧英超｜普捷天奴1月救亡藍圖曝光 鎖定美國愛將及班夫韋迪","url":"https://www.stheadline.com/football-news/3638786/曼聯英超普捷天奴1月救亡藍圖曝光-鎖定美國愛將及班夫韋迪","summary":"曼聯新帥普捷天奴（Mauricio Pochettino）剛走馬上任，便要立即為慘不忍睹的防線尋找解藥。","summary_short":"曼聯新帥普捷天奴（Mauricio Pochettino）剛走馬上任，便要立即為慘不忍睹的防線尋找解藥。","digest":"曼聯新帥普捷天奴（Mauricio Pochettino）剛走馬上任…","points":["曼聯新帥普捷天奴（Mauricio Pochettino）剛走馬上任…","紅魔今季各項賽事狂失30球，與歐洲五大聯賽其餘兩隊並列防守最差","據《天空體育》披露，曼聯高層已承諾在1月冬季轉會窗全力「泵水」支持新帥…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T11:04:13+08:00","size":1,"keywords":[],"body":"曼聯新帥普捷天奴（Mauricio Pochettino）剛走馬上任，便要立即為慘不忍睹的防線尋找解藥。紅魔今季各項賽事狂失30球，與歐洲五大聯賽其餘兩隊並列防守最差。據《天空體育》披露，曼聯高層已承諾在1月冬季轉會窗全力「泵水」支持新帥，而普帥的增兵名單已初見雛形。他將破天荒獲得比歷任前度更大的轉會話事權，並瞄準中堅、左閘及前鋒三大位置進行重磅補強，其中英格蘭中堅班夫韋迪（Jarrad Branthwaite）及美國隊左閘愛將安東尼羅賓遜（Antonee Robinson）已成首要獵物。\n重燃班夫韋迪收購戰\n現年24歲的愛華頓中堅班夫韋迪，早在2024年已被曼聯瘋狂追求，惟當時兩度報價均遭拖肥糖拒絕。雖然班夫韋迪合約期至2030年，但急需中堅穩固防線的普捷天奴已將其列為頭號目標。此外，富咸中堅奇雲巴斯（Calvin Bassey）亦是考慮人選之一。\n至於左閘位置，富咸的美國國腳安東尼羅賓遜備受青睞。羅賓遜在普捷天奴執教美國國家隊期間合作無間，深得恩師器重。祖雲達斯中場麥堅尼（Weston McKennie）日前受訪時亦大爆內幕，直言多位美國隊隊友正籌備轉會，隨恩師空降奧脫福；普捷天奴對此亦拒絕排除可能性。\n美國國腳羅賓遜或隨恩師空降\n除了羅賓遜，曼聯在夏窗曾考慮的巴塞隆拿左閘阿歷斯巴迪（Alejandro Balde）依然在備用名單之中。隨着1月轉會窗進入倒數，這波針對防線的大清洗與重組，將成為普捷天奴能否帶領曼聯逃離降班區的關鍵戰役。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cca3821f944","title":"国家网络安全通报中心发布JAVA远程代码执行高危漏洞预警","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734531.shtml","summary":"中新网11月19日电 据国家网络安全通报中心微信公众号消息，11月19日，国家网络安全通报中心发布JAVA远程代码执行高危漏洞预警，具体内容如下：  　　11月17日…","summary_short":"中新网11月19日电 据国家网络安全通报中心微信公众号消息，11月19日…","digest":"据国家网络安全通报中心微信公众号消息，11月19日…","points":["11月17日，境外安全研究机构Calif披露了名为Java4Shell的高危漏洞(CVE-2…","该漏洞影响范围广，大量暴露于互联网的Java应用，极易成为网络攻击的重点目标","1、漏洞存在于OpenJDK底层性能优化汇编代码中…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T11:03:54+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据国家网络安全通报中心微信公众号消息，11月19日，国家网络安全通报中心发布JAVA远程代码执行高危漏洞预警，具体内容如下：\n\n　　11月17日，境外安全研究机构Calif披露了名为Java4Shell的高危漏洞(CVE-2026-114938)，该漏洞存在于OpenJDK Base64解码路径中，当攻击者向Java应用提交特制的Base64数据时，可触发堆内存越界写入，造成敏感信息泄露甚至远程代码执行，Oracle已紧急发布修复版本。该漏洞影响范围广，大量暴露于互联网的Java应用，极易成为网络攻击的重点目标。\n\n　　一、Java4Shell漏洞安全风险分析\n\n　　1、漏洞存在于OpenJDK底层性能优化汇编代码中，OpenJDK在x86-64平台采用AVX-512 VBMI指令集对Base64解码进行加速，当输入为畸形数据时，尾部填充区域输出长度计算发生数值下溢，触发约62字节堆内存越界写入。该漏洞深度内嵌于底层汇编代码中，常规组件扫描工具无法有效检出。\r\n\n　　2、触发条件简单，攻击路径较多。攻击者仅需向Java应用提交64个字母“A”加1个“=”(较老的OpenJDK 17版本为128个“A”加“=”)畸形字符串即可触发越界写入。Base64解码在身份认证、文件上传、网络消息等场景中广泛使用，攻击者可通过认证令牌、SAML消息、上传文件等多种入口提交恶意输入，触发路径多、利用成本低。\n\n　　3、危害后果严重，可致信息泄露或系统遭完全控制。攻击者通过堆内存越界写入，可覆写相邻对象元数据、读取敏感内存，造成拒绝服务，并最终实现远程代码执行，甚至完全接管服务器。漏洞披露方已在Keycloak、Atlassian Jira、Atlassian Confluence、JFrog Artifactory、Jenkins、PingFederate等常用产品的默认配置下验证预认证远程代码执行，Apache Kafka Broker、Apache Solr、Elasticsearch、Gerrit、Netflix Spinnaker等产品在认证后也可被利用，基于Spring Boot、Apache Struts构建的应用同样可以复现。\n\n　　4、影响范围广，重要行业安全威胁较大。该漏洞影响OpenJDK 17.0.6及之后版本，以及Amazon Corretto、Eclipse Temurin、Microsoft Build of OpenJDK、Azul Zulu、BellSoft Liberica、SAP SapMachine、Red Hat OpenJDK、Oracle Java SE等主流发行版，Oracle同时将Java SE 8的性能版8u511b33-perf列入受影响范围。漏洞触发需运行在支持AVX-512 VBMI指令集的x86-64处理器上，ARM64平台不受影响。初步研判认为，全球范围金融、航空、电信、政务等关键行业受影响的Java应用数量庞大。\n\n　　5、技术细节已公开，漏洞利用风险上升。相关漏洞由安全研究机构Calif借助AI辅助发现，其研究人员用时约1小时完成漏洞定位、2小时写出漏洞利用代码。目前漏洞触发/复现PoC已经公开，虽然暂未发现漏洞公开利用情况，但随着针对具体Java应用的利用链被逐步发现，短期内出现规模化攻击的风险较高。\n\n　　二、Java4Shell风险防范建议\n\n　　1、全面排查资产暴露面。对本行业/单位所有运行Java的系统进行清点，核对厂商与完整构建版本，重点排查对公网或跨网络暴露的服务(如Jira、Jenkins、Keycloak、Confluence等)，识别第三方产品、设备和容器中内置的Java组件。\n\n　　2、及时升级版本。通过可信来源获取并安装官方修复版本，将Java SE 17/21/25/27升级至17.0.21.1、21.0.13.1、25.0.5.1、27.0.1.1，Oracle Java 8 performance Pack 升级至8u513-perf，GraalVM应用Oracle 2026年11月关键补丁更新中的对应补丁，其他发行版参照各自安全公告。升级后重启所有相关Java进程，确保容器镜像和内置运行时同步更新。\n\n　　3、启用临时缓解措施。对暂时无法升级的x86-64环境，可通过为JVM增加启动参数-XX:-UseBASE64Intrinsics禁用硬件加速的Base64编解码，或增加-XX:UseAVX=2禁用AVX-512执行路径。需要注意的是，ARM64原生JVM不识别-XX:UseAVX=2参数，传入将导致JVM无法启动，应严格限定在x86环境使用。\n\n　　4、做好网络隔离措施。在补丁部署前，临时限制对互联网暴露的Java管理控制台的外部访问，做好网络隔离、身份认证加固和访问控制，限制Java进程向不可信服务器发起TLS连接。\n\n　　5、强化网络安全监测。持续关注OpenJDK及各发行版安全公告，实时监测Web、应用、认证与终端日志中的可疑活动，重点关注JVM崩溃日志、异常重启、认证头长度异常的base64、异常子进程和出站连接，做好日志留存和应急处置，严防发生重大网络和数据安全事件。 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c195886559e","title":"我国16座水库进行“三个大坝”建设试点","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734539.shtml","summary":"记者从水利部了解到，目前，我国选取三峡、小浪底、安徽佛子岭等16座覆盖不同年代、不同坝型的代表性水库，全面开展安全大坝、生态大坝、智能大坝建设试点。","summary_short":"记者从水利部了解到，目前，我国选取三峡、小浪底、安徽佛子岭等16座覆盖不同年代、不同坝型的代表性水库，全面开展安全大坝…","digest":"记者从水利部了解到，目前，我国选取三峡、小浪底、安徽佛子岭等16座覆盖不同年代…","points":["从水利部了解到，目前，我国选取三峡、小浪底、安徽佛子岭等16座覆盖不同年代…","2027年底前完成试点建设，形成一批可复制、可推广的技术方案和管理模式…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T11:03:36+08:00","size":1,"keywords":[],"body":"记者从水利部了解到，目前，我国选取三峡、小浪底、安徽佛子岭等16座覆盖不同年代、不同坝型的代表性水库，全面开展安全大坝、生态大坝、智能大坝建设试点。2027年底前完成试点建设，形成一批可复制、可推广的技术方案和管理模式，全面提升我国水库大坝现代化建设运行管理能力。\n\n　　(总台央视记者 梁丽娟 李洁)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdeeccc7a8c","title":"朱潔儀爆曾遇男主角「極端示愛」 單身多年屬「姊妹爭夫」命格 想將陳法蓉貶為亞軍？","url":"https://www.stheadline.com/film-drama/3638637/朱潔儀爆曾遇男主角極端示愛-單身多年屬姊妹爭夫命格-想將陳法蓉貶為亞軍","summary":"1989年港姐亞軍朱潔儀（Donna）近日作客由伍詠薇（伍姑娘）與李凱賢（Brian）主持的HOY TV節目《九運會客室2》。","summary_short":"1989年港姐亞軍朱潔儀（Donna）近日作客由伍詠薇（伍姑娘）與李凱賢（Brian）主持的HOY TV節目《九運會客室…","digest":"1989年港姐亞軍朱潔儀近日作客由伍詠薇與李凱賢主持的HOY TV節目《九運會客室2…","points":["1989年港姐亞軍朱潔儀（Donna）近日作客由伍詠薇（伍姑娘）與李凱賢（Brian）主持的…","現年59歲、保養得宜的朱潔儀，在節目中與同是選美出身的伍詠薇大談昔日選美及拍戲秘聞…","伍詠薇問到朱潔儀入行多年鮮有緋聞，是否因為「收得密」或無人追求"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T11:00:00+08:00","size":1,"keywords":[],"body":"1989年港姐亞軍朱潔儀（Donna）近日作客由伍詠薇（伍姑娘）與李凱賢（Brian）主持的HOY TV節目《九運會客室2》。現年59歲、保養得宜的朱潔儀，在節目中與同是選美出身的伍詠薇大談昔日選美及拍戲秘聞，剖白入行多年鮮有緋聞的原因，更獲堪輿學家唐碧霞師傅即場批算八字，揭開單身多年的謎底。\n朱潔儀曾獲男主角贈「全家之寶」示愛\n伍詠薇問到朱潔儀入行多年鮮有緋聞，是否因為「收得密」或無人追求。朱潔儀澄清自己不乏追求者，更透露初入行時曾遇過大製作的男主角主動獻殷勤。對方當時向她示愛，更送上一個宣稱是「由細戴到大、全家之寶」的護身符。自認性格謹慎且有些「遲鈍」的朱潔儀，笑稱當時接收不到追求信號，僅因覺得禮物太貴重和古舊而婉拒退還。\n朱潔儀笑指男方曾主動約放假睇電影：「咁我又get唔到，同埋以前其實係，開06去到深夜2、3點，我真係好需要睡眠。（你隔咗幾年先知原來佢追你？）即係之後諗下。（你對佢有無興趣？）有興趣，瞓少兩粒鐘都去啦。」\n相關閱讀：56歲前港姐朱潔儀近照容貌離奇極繃緊！淡出幕前多年 曾狠批師妹馮盈盈肉酸\n朱潔儀要求極高 難忍男方大聲呵斥\n朱潔儀自言因處女座性格，對伴侶要求極高，追求完美、溝通與上進心。她坦言自己在感情中若被大聲呵斥或責罵，會感到委屈落淚，因此選擇對象時分外謹慎，因而錯失了不少發展機會。\n同場的唐碧霞師傅從八字角度分析，指朱潔儀的八字桃花星非常強，身邊出現的男士多為其「貴人」，條件非凡，所以富二代、名門公子的追求從未間斷。不過，朱潔儀單身至今，全因命格中存在兩大障礙：一是容易陷入三角關係的「姊妹爭夫」格；二是具戲劇性的「貌貴合而不發，必嫁白頭郎」命格。\n唐碧霞師傅直言，朱潔儀若配對傳統的「正常姻緣」極難開花結果，必須尋求「不正常姻緣」方可化解。所謂的「不正常姻緣」，是指對方曾結婚或離婚、年齡比朱潔儀大十年或以上（或相反地比她年輕很多），又或是異地姻緣。\n相關閱讀：九運會客室2本周預告丨伍詠薇爆遭舊愛痛打 剖白21歲新婚喪夫歲月 馬賽細談不雅片風波\n朱潔儀出生自選美世家\n除了感情世界，朱潔儀亦分享了參選港姐的趣事。她透露自己從小愛美，但朱母卻不覺得女兒漂亮，更常拿親戚作比較：「好多親戚都靚過你」。原來朱母有親戚早年曾參選港姐並打入準決賽，足見家族基因優良。\n朱潔儀當年打算參選時，曾被母親潑冷水：「人哋都唔得，你點會得呀？」母親又擔心她落選會「好肉酸」；相反父親卻大力支持，鼓勵她嘗試及學習新事物。當時仍在大專讀一年級、兼職做模特兒的朱潔儀，最後在父親支持和家姐提名下參選。比賽期間，她曾收到佳麗電話，聲稱已有內定得獎者並勸她退出。不過朱潔儀未有理會，最終順利奪得1989年香港小姐亞軍。\n朱潔儀重排同屆港姐三甲：自己擺第一\n朱潔儀直言：「每個女仔都有冠軍夢想，如果嘛，咁……我覺得任何人，女仔啦，都有個夢想㗎嘛，可能夢想做冠軍呀，係咪先？」主持李凱賢問到，若有機會重新排名，會否將自己擺在第一名，朱潔儀毫不猶豫承認：「係呀！係呀！」至於亞、季軍人選，她笑言會將順序往後移：「之前冠軍就擺亞軍，跟住第三唔變咁囉。」（註：1989年港姐冠軍為陳法蓉、季軍為梁佩瑚。）\n相關閱讀：港姐朱潔儀狂晒淺水灣逾千呎豪宅 擁兩無敵海景花園設巨型噴水池歐式古典裝潢超有氣派","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6b0ad7dfa6","title":"52.2%受访者表示为AI花过钱 知识处理、多媒体创作、办公学习是主要用途","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734467.shtml","summary":"当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。","summary_short":"当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。","digest":"当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费","points":["当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费","上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者…","自从使用AI办公后，来自深圳的35岁黄鹂觉得自己的工作效率有了很大提高…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:41:30+08:00","size":1,"keywords":[],"body":"当越来越多年轻人把AI当作工作与生活的助手，为它花钱已从新鲜事变成了日常消费。上周，中国青年报社社会调查中心联合问卷网(wenjuan.com)发布的一项1334名受访者参与的调查显示，超半数(52.2%)受访者表示为AI花过钱，知识处理(59.1%)、多媒体创作(53.3%)、办公学习(44.1%)是受访者常用AI做的事。\r\n\n　　自从使用AI办公后，来自深圳的35岁黄鹂觉得自己的工作效率有了很大提高，原来可能要做一整天的方案，如今在AI的加持下两到三小时就能完成。在她看来，为AI付费是对自己的一种“投资”。“如果你愿意付费深度学习、使用AI工具，它能提高你的工作效率，也能提升个人能力。”\n\n　　调查显示，超半数(52.2%)受访者为AI花过钱。交叉分析发现，受访90后的这一比例更高，为61.4%。然后是00后(58.3%)、95后(53.6%)。男性受访者(53.2%)的这一比例高于女性受访者(51.4%)。从地区来看，一线城市受访者的这一比例更高，为58.1%，然后是二线城市(51.7%)、三四线城市(51.1%)。\n\n　　来自上海的在读研究生王明远，从今年8月底开始为AI付费。“感觉学习效率提升了，对求职也有很大帮助。”\n\n　　王明远表示，互联网时代获取知识容易，但缺少一个可以随时提问的导师，“AI可以充当这个角色。”从课程知识学习、作业指导到简历项目设计，他用AI构建了一个24小时在线的私人导师。“我有很多问题可以问AI，它能指导我的成长。”\n\n　　来自深圳的37岁林子侨是一名游戏行业的从业者，最近他正和朋友一起创作一部AI短剧。为了达到更好的艺术效果，今年9月，他果断为AI掏出钱包。“我们有分工，朋友是编剧，用AI做视频我是自学的。”\n\n　　林子侨表示，免费模型在画面精度和语义理解上不够好，每次都要花大量时间后期修补。如今，他每月在续卡、买积分上的花费在2000元左右，调用的模型也越来越高级。“AI生成视频的成本虽有些高，但比自己拍片子的成本低。”在他看来，这笔钱买的是把创意直接变成画面的能力。\n\n　　大家会为什么样的AI服务付费？数据显示，49.2%的受访者会为更聪明的模型付费；48.4%的受访者会为多模态AI付费，生图、视频、语音更好用；46.7%的受访者是为了省时间，写稿、做表、出方案更快。其他还有：不卡额度，额度丰富够调用(28.2%)；懒得折腾，一个会员全平台通吃最省心(20.6%)等。\n\n　　90后原田在苏州做生产管理，下班后她还有另一个身份——短视频博主。她用AI生成脚本、画面、配音、剪辑，整个流程几乎不需要人工介入。“以前我试着学过剪辑，学着学着就放弃了，现在有想法直接就能成片。以前得几个人干的活，现在我下班回来一个人就做完了。”\n\n　　之前原田一直用免费版的AI工具，但发现废片率高、画质不够清晰，为AI付费之后，她明显感觉“快”了，并且能调用更好的模型。“现在几分钟就能生成能用的素材。”\n\n　　大家平时用AI做什么？调查中，查资料/翻译/解题/写代码等知识处理(59.1%)、生图/修图/剪视频/做AI短片等多媒体创作(53.3%)、写稿/周报/PPT/邮件等办公学习产出(44.1%)位列前三。其他还有：写小说/写歌/写段子/等文艺脑洞(27.7%)；闲聊/情感陪伴/角色扮演等日常互动(27.1%)；投喂资料做个人知识库/智能体训练(15.5%)等。\n\n　　来自河南郑州的85后网店主张龙，把AI当成了自己的“员工”，用AI生图、写文案、翻译，AI的出现让他解锁了很多技能。他的电脑里，整齐排列着一周的社交媒体发布包——文案、配图、标签全部由AI生成，他只需手动上传。“像美工、运营、剪辑、拍摄，以前至少需要一个团队，现在我一个人加AI就能搞定。”张龙说。\n\n　　受访者中，05后占3.2%，00后占22.6%，95后占20.7%，90后占25.4%，85后占13.2%，80后占11.2%，其他占3.7%。男性占47.6%，女性占52.4%。来自一线城市的占38.1%，二线城市的占35.7%，三四线城市的占19.8%，县城或城镇的占5.1%，农村的占1.3%。\n\n　　(应受访者要求，张龙为化名)\n\n　　中青报·中青网记者 吴欣宇 来源：中国青年报\n\n　　2026年11月19日 08版 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc4ed399e0c","title":"患者讀書壓力誘發抑鬱 自行停藥復發演變思覺失調｜最強生命線‧延伸閱讀","url":"https://news.tvb.com/tc/1206939-患者讀書壓力誘發抑鬱自行停藥復發演變思覺失調最強生命線延伸閱讀","summary":"近40歲的秀蘭，在中學時期因為要面對讀書，及朋輩相處帶來的壓力而患上抑鬱症，情緒經常在低落及高漲兩個極端之間轉換，後來更演變成思覺失調。秀蘭說︰「其實我小時候也是在一個一般的家庭長大，有朋友、有興趣，喜歡畫畫，一直都很平穩。","summary_short":"近40歲的秀蘭，在中學時期因為要面對讀書，及朋輩相處帶來的壓力而患上抑鬱症，情緒經常在低落及高漲兩個極端之間轉換…","digest":"近40歲的秀蘭，在中學時期因為要面對讀書，及朋輩相處帶來的壓力而患上抑鬱症…","points":["情緒起落大，經常疑神疑鬼，甚至產生例如幻聽、幻視等，脫離現實的知覺問題…","除了靠藥物控制病情，亦會用到心理治療作輔助工具","根據醫管局的統計數字，香港現在有約五萬個思覺失調病人"],"section":"生活","category":"生活消閒","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T08:30+08:00","size":1,"keywords":[],"body":"情緒起落大，經常疑神疑鬼，甚至產生例如幻聽、幻視等，脫離現實的知覺問題，這些都是抑鬱症引發思覺失調常見的病徵。除了靠藥物控制病情，亦會用到心理治療作輔助工具。\n\n根據醫管局的統計數字，香港現在有約五萬個思覺失調病人。除了遺傳因素，其他因素，例如濫用藥物有機會引發遺傳因子，另外壓力大更是最主要，引致病發的因素之一。\n\n近40歲的秀蘭，在中學時期因為要面對讀書，及朋輩相處帶來的壓力，而患上抑鬱症。期間因自行停藥，之後更演變成思覺失調。她甚至曾將同學視作會害她的人，因此而逃課。\n\n秀蘭稱：「我有一個同學，我只見到他，沒甚麼特別，但我會套上他是聖經人物，在《聖經》描述他很惡毒的一個人，我覺得是那個同學，我很害怕他，又不敢上學，自己走了回內地。」\n\n思覺失調的患者有機會有幻聽、幻覺，完全分不清現實及幻想兩個世界。\n\n精神科專科醫生王明爍指出：「如果沒有藥物時，很大機會會復發，我們見到很多第一次病發的病人，治好後如果不服藥，其實兩年內大部分病人都會復發。如果發病多過一次的病人，停藥後兩年，差不多九成病人都會復發。」\n\n除了藥物治療，治療方案亦有機會，有臨床心理學家的參與，以引導患者理解及處理自己的情緒。\n\n臨床心理學家江偉賢稱：「我們要讓他感覺到他裡面的情緒，他裡面有些困難、痛苦，是可以應對的，那些妄念是真還是假，不需要擔心這部分。當有了這個好的關係時，很多時候我們跟他說的話，他會很容易聽。」\n\n一般思覺失調患者發病後，經過適當的藥物治療，通常於數星期至數個月內，可以穩定病情，但擅自停藥會增加復發風險，而且每次發病時都會令大腦萎縮，對腦部造成不可逆轉的損傷。\n\n點擊觀看節目重溫","image":"https://pro-vod-cdn.tvb.com/32aeffac190443d092034ded444b0eba/snapshots/6da995499fbb435a964103f9b7ee1480-00008.jpg","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":16,"items":[{"id":"c04e80669f7","title":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研、投』協同發展」議員議案總結發言","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900402.htm","summary":"以下是創新科技及工業局局長孫東教授今日（十一月十九日）在立法會會議就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研…","summary_short":"以下是創新科技及工業局局長孫東教授今日（十一月十九日）在立法會會議就「全面提升大學科研成果轉化能力…","digest":"立法會：創新科技及工業局局長就「全面提升大學科研成果轉化能力…","points":["再次感謝劉智鵬議員提出這項議案，並感謝李廣宇議員提出修正案，以及30位議員踴躍發言","為此，我們以產業鏈部署北都創科用地及產業園區的協同分工…","在整個布局中，北都新田、洪水橋和打鼓嶺三個大學城負責提供基礎科研與人才培養…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:07:00+08:00","size":4,"keywords":[],"body":"以下是創新科技及工業局局長孫東教授今日（十一月十九日）在立法會會議就「全面提升大學科研成果轉化能力，全力支援北都大學城『政、產、學、研、投』協同發展」議員議案的總結發言：\n\n主席：\n\n　　再次感謝劉智鵬議員提出這項議案，並感謝李廣宇議員提出修正案，以及30位議員踴躍發言。議員的意見有助政府思考如何進一步優化各項創科政策與資源配置。我現在就深化北都（北部都會區）「政、產、學、研、投」協作，以及推動大學科研成果轉化的工作，作綜合回應。\n\n　　多位議員關注到北都大學城與周邊園區的聯動效益，這亦是《香港第一個五年規劃》的焦點之一。規劃明確提出要鼓勵北都大學城內的院校與周邊產業園協同發展，融合打通「產、學、研」鏈條。為此，我們以產業鏈部署北都創科用地及產業園區的協同分工，將北都從單純的土地供應來源轉化為產業成長的基地。在整個布局中，北都新田、洪水橋和打鼓嶺三個大學城負責提供基礎科研與人才培養，而河套香港園區和新田科技城等則接力負責成果轉化與中試產業發展，全面落實教育、科技、產業一體化發展。\n\n　　《香港第一個五年規劃》提出要優先建設的河套香港園區將聚焦上中游研發、成果轉化與中試，其首批八座大樓將於今年年底前全部落成，同時亦已推出另外五組地塊招標，將於下月公布招標結果。截至今年十月底，已有超過130間科技企業、大學及科研機構簽署租約並進駐河套香港園區，當中不乏國際龍頭、獨角獸企業以及首次在香港設立據點的企業。在硬件配套上，感謝立法會批准37億元撥款，當中約15億元將用於園區內建設生命樣本庫及高效能運算設施等公共設施，為跨境數據及生物樣本流動提供關鍵支撐。河套香港園區正積極構建科研成果轉化生態圈。首屆培育計劃已經展開，為初創企業提供孵化及加速支援，協助具潛力的科研項目加快商品化及產業化進程。而將於今年年底落成的河套學研壹號將匯聚頂尖大學與機構的前沿科研力量，促進「大學＋研發＋產業」的互動銜接，推動科研成果與市場需求更有效對接。\n\n　　在下游承接方面，新田科技城是北都創科產業發展核心，提供原型開發、中試甚至量產空間。其約210公頃的新創科用地是香港規模最大的產業基地，可承接河套香港園區的科研成果轉化，作為生產和展示的基地，提升本地研發成果「從1到100」的轉化能力。加上同樣位處北都的沙嶺數據園區、元朗創新園、香港微電子研發院的中試線設備和洪水橋產業園等，各園區各司其職、優勢互補，構建「產、學、研」一體化產業空間。在政策軟件上，我們將從下月起啓動數據流跨境試點安排，正式開啓「四流」跨境流通的第一步，讓人才、企業、大學及科研機構精準對接，打通從實驗室到市場的完整創新生態鏈。\n\n　　連同科學園以及數碼港，三大創科園區按地理位置及產業定位分工，共同構成香港「北中南」發展新格局，各有側重地推進科研成果轉化與商品化工作。其中，香港科技園公司（科技園公司）透過其培育初創企業的經驗、投資者及商業網絡，協助初創企業拓展業務，促進技術轉移和研發成果商品化。今年《施政報告》宣布，政府將支持科技園公司研究設立「香港創科應用場景促進中心」，精準配對公私營界別的應用場景需求，打通創新成果由研發、試驗到應用市場的關鍵環節，加快科研成果轉化及產業化落地，協助對接行業標準並獲取市場認證，助力創科企業出海。至於數碼港，作為香港數碼科技樞紐及人工智能加速器，一直與本地大學緊密合作，透過創業培訓、導師指導、種子資金及培育支援，協助大學團隊把科研成果和創新意念轉化為商業方案，至今已為超過2 400間企業提供支援。\n\n　　多位議員關注「產學研1+計劃」能否切實達到起動科研成果商品化的效果。該計劃旨在通過配對方式，資助有潛力成為成功初創企業的大學研發團隊，促進優秀科技研發成果轉化及商品化。我們歡迎大學和研發團隊吸引更多來自各方（包括內地與海外）的投資，把實驗室的優秀科研成果帶到市場。為了令未來的審批過程更加順暢，我相信計劃的督導委員會在審批申請時，除了全面考慮項目本身的市場與商業化潛力外，亦會採取更具彈性的安排，適當兼顧不同科技範疇項目（例如新藥研發與前沿科技）在研發與商品化過程中所需要的不同時間和周期。\n\n　　除了「產學研1+計劃」，創新科技署亦推出了一系列措施，包括「新型工業加速計劃」、「創科加速器先導計劃」和「創科產業引導基金」。「新型工業加速計劃」為從事策略性產業並在香港設立新智能生產設施的企業，以1（政府）比2（企業）的配對形式提供資助，每家企業的獲資助總額上限為二億元。計劃至今已公布支持九宗申請，分別聚焦生命健康科技與先進製造兩大範疇，帶動約43億元總投資。「創科加速器先導計劃」用以吸引海內外具經驗的創科加速器進駐香港，培育本地初創企業。這亦呼應《香港第一個五年規劃》強調要培育具國際競爭力的創科企業的目標。計劃推出後共收到超過50宗申請，目前獲選的九間機構均擁有豐富的全球網絡和行業資源，將為本地初創企業提供共享空間、研發支援、投資對接以及市場拓展等全方位的增值服務。至於「創科產業引導基金」，則是為了加強引導市場資金投資指定策略性新興和未來產業，系統性建設香港創科產業生態圈。引導基金採用市場化的運作方式，由獲甄選的基金經理成立及管理五個主題板塊的子基金，負責籌集市場資金、日常營運，及根據投資框架投資合適的項目。我們已初步甄選約20間基金經理公司，目前正進行籌募資金及成立子基金的工作，預期將於今年內正式啓動。\n\n　　與此同時，《香港第一個五年規劃》提出要全面鞏固提升和發揮在港的全國重點實驗室和InnoHK創新香港研發平台（InnoHK）的「雙基地」優勢。在港全國重點實驗室作為國家級基地，承載着強化原始創新和突破關鍵技術的重任。創新科技署將持續投放資源優化基礎設施，全力支持本地指定大學團隊聚焦國家戰略科技領域，深化與內地優勢互補。作為高水平科研及成果轉化基地，InnoHK旗下的三個集群，即醫療科技、人工智能和可持續發展、能源、先進製造及材料，已匯聚超過3 000名本地及全球科研人員，並成功吸引本地大學與來自12個經濟體、超過30間世界頂尖大學與研究機構共同建立實驗室，助力科研成果轉化為具影響力的實際應用，帶動相關產業發展。我們亦會繼續透過「研究人才庫」、「創科實習計劃」以及「新型工業化及科技培訓計劃」等措施，加強對在學及在職科技人才的培訓與支援，協助企業吸納及培育本地人才，並配合河套香港園區及新田科技城等平台，為本地人才提供更多應用場景及就業機會。\n\n　　隨着各項措施和計劃陸續推進，我們會適時檢討因應運作效益計劃的相關安排，以期讓計劃更趨完善，促進產學研協作，激勵大學將更多優秀研發成果轉化及商品化，推動上中下游協調發展。\n\n　　主席，《香港第一個五年規劃》提出要在北都以科技引領「產、學、研」協同創新體系：香港正在抓緊建設北都大學城，以及構建「三大創科園區、五大研發機構」的新創科布局，加速創新生態鏈成型。政府將會因應最新發展與產業需求，按部就班落實各項優化與建設措施，積極結合與凝聚大學和社會各界的創科力量，全面提升香港的科研成果轉化能力。\n\n　　我再次感謝今日多位發言議員給予的寶貴意見。本人謹此陳辭。多謝主席。","image":"","video":"","video_poster"
