式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0749944107","title":"中信证券：降本增利，国内独立储能经济性拐点将至","url":"https://www.jiemian.com/article/15352807.html","summary":"中信证券研报称，2026年以来，新型储能的成本端与收益端同时承压，碳酸锂涨价带来电芯成本上涨，以及系统运行费上涨带来收益损失，国内项目整体经济性承压，这一定程度上影响了2026年国内大储装机量…","summary_short":"中信证券研报称，2026年以来，新型储能的成本端与收益端同时承压，碳酸锂涨价带来电芯成本上涨…","digest":"中信证券研报称，2026年以来，新型储能的成本端与收益端同时承压…","points":["中信证券研报称，2026年以来，新型储能的成本端与收益端同时承压…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:05:06+08:00","size":1,"keywords":[],"body":"中信证券研报称，2026年以来，新型储能的成本端与收益端同时承压，碳酸锂涨价带来电芯成本上涨，以及系统运行费上涨带来收益损失，国内项目整体经济性承压，这一定程度上影响了2026年国内大储装机量，据CESA，2026年前9个月国内新增装机量111GWh，同比增长87%。现阶段碳酸锂价格已较2026年5月的高点跌去超10万元/吨，电芯成本有下行空间，系统运行费分摊机制的优化写入了新型储能的“十五五”规划，国内多省陆续发布将系统运行费纳入分时波动的政策，以降低新型储能在谷段充电时的充电成本，判断后续国内新型储能项目经济性将迎来明确的边际改善，看好新型储能产业链，重点推荐优先受益的大型储能集成商，并关注装机上行带来的锂电池与材料的需求提振。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb21e7c7d1e","title":"科技早报 | 阿里第二财季营收2715.19亿元；《GTA6》预购收入超16亿美元","url":"https://www.jiemian.com/article/15352362.html","summary":"阿里第二财季营收2715.19亿元，同比增长10%  阿里巴巴11月19日公布截至2026年9月30日的季度及上半财年业绩。","summary_short":"阿里第二财季营收2715.19亿元，同比增长10%  阿里巴巴11月19日公布截至2026年9月30日的季度及上半财年业…","digest":"阿里第二财季营收2715.19亿元…","points":["阿里第二财季营收2715.19亿元，同比增长10%","阿里巴巴11月19日公布截至2026年9月30日的季度及上半财年业绩","外部客户收入增长64%，其中外部客户经常性收入增长67%"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T08:05:00+08:00","size":1,"keywords":[],"body":"阿里第二财季营收2715.19亿元，同比增长10%\n\n阿里巴巴11月19日公布截至2026年9月30日的季度及上半财年业绩。第二财季营收为2715.19亿元，同比增长10%；经营利润291.16亿元，同比增长443%；归属于普通股股东的净利润645.35亿元，同比增长207%。非GAAP净利润为199.09亿元，同比增长92%。\n\n财报显示，第二财季AI云和计算服务收入为609.73亿元，同比增长53%；外部客户收入增长64%，其中外部客户经常性收入增长67%。AI相关产品收入达到179.18亿元，连续第13个季度实现同比三位数增长。公司称，互联网、汽车、具身智能、金融服务和生物技术等行业客户均在扩大云服务使用。\n\n《GTA6》预购收入超16亿美元\n\n11月18日，《侠盗猎车手6》（Grand Theft Auto VI，下称《GTA6》）的媒体评测正式解禁。在游戏评分汇总网站Metacritic上，其PS5版本首批媒体综合评分达到99分，追平了1998年《塞尔达传说：时之笛》创下的纪录。此前，《GTA4》和《GTA5》分别获得98分和97分。\n\n据市场研究机构Sensor Tower于11月18日更新的追踪估算，《GTA6》在PS5及Xbox平台的数字版预购量已达到约1707万份，对应预购收入约16.5亿美元。其中，PlayStation平台贡献约75%的预购量。\n\n因150元成被执行人？格力电器最新回应\n\n11月19日，关于格力电器的一则消息在网络上传开，据中国执行信息公开网信息显示，格力电器新增一则小额被执行人信息，立案时间为11月17日，执行标的为150元，执行法院为义乌市人民法院，案件号为（2026）浙0782执32271号。\n\n据证券时报消息，格力电器对此回应称，针对网络上关于（2026）浙0782执32271号案件格力被列为被执行人一事，实为公司作为原告的一起商标侵权案件的受理费用。公司于11月19日收到缴费通知当天已按要求进行费用缴纳。\n\n马斯克：Optimus拟18个月内胜任家务，Terafab计划2028年底量产\n\n当地时间11月18日，特斯拉CEO埃隆·马斯克通过视频连线参加美国奥斯汀举行的TomorrowX峰会，并披露旗下多项业务进展。他表示，Optimus人形机器人有望在未来12至18个月内完成洗碗、清洗烘干并收纳等家务；Terafab研究工厂计划于明年6月试产首款测试芯片，并争取在2028年底实现第一阶段量产；xAI目前每月新增约0.5吉瓦算力，明年将提高至每月超过1吉瓦。\n\n马斯克还称，星舰实现完全、快速重复使用后，进入轨道的成本有望降低约100倍；Neuralink目前已为30多名受试者植入脑机接口设备。谈及英伟达时，他将CEO黄仁勋比作迈克尔·乔丹，称其是科技企业创始人中的顶尖人物，若失去黄仁勋的领导，对英伟达将是重大打击。\n\n字节跳动拟追加5亿美元微软云服务合同\n\n11月19日，据市场消息，字节跳动正在与微软进行谈判，计划在现有合同基础上，追加约5亿美元微软云服务支出，主要用于通过微软Azure使用OpenAI模型，目前交易尚未完成。微软拥有向客户转售OpenAI技术的权利，微软方面认为字节跳动主要将OpenAI模型用于包括软件开发在内的任务。不包括该笔在谈合同，据估算，字节跳动每年在微软AI与云服务上的支出近10亿美元。截至发稿，字节跳动方面暂未回应。\n\nOpenAI进军手机领域，富士康旗下富智康集团获组装订单\n\n11月19日，据人民财讯援引供应链消息，富士康旗下富智康集团（02038.HK）已获得OpenAI手机项目订单，将参与相关产品的整机组装。富士康同时是苹果iPhone的主要组装商。若OpenAI手机最终面市，其将进入手机终端市场，并可能围绕AI交互体验，与现有手机品牌展开更直接的竞争。相关产品方案、订单规模及量产安排，仍有待进一步获悉。\n\n联想集团二季度营收首破2000亿元，同比增长47.8%\n\n11月19日，联想集团公布2026/27财年第二季度业绩。财报显示，截至2026年9月30日，联想集团实现营收302.38亿美元（约合2029亿元人民币），同比增长47.8%，首次突破2000亿元大关，创历史新高。调整后净利润达到91.3亿元，同比增长166%。\n\n联想集团营收增长正呈现持续加速态势。2025/26财年第四季度，联想营收同比增长27.1%。进入2026/27财年后，第一季度营收增速跃升至43.1%，第二季度进一步提高至47.8%。两个季度，营收增速累计提升20.7个百分点。\n\n网易：第三季度净收入279亿元，同比下降1.8%\n\n11月19日，网易发布2026年第三季度财报显示，单季净收入279亿元，同比下降1.8%；游戏和相关增值服务净收入229亿元，同比下降1.7%；有道净收入14亿元，同比下降12.3%；网易云音乐净收入19亿元，同比下降0.9%；创新及其他业务净收入15亿元，同比增长7.1%。归属于公司股东的净利润84亿元；Non-GAAP净利润92亿元。\n\n未经正式授权严禁转载本文，侵权必究。科技早报\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n科技早报 | 阿里第二财季营收2715.19亿元；《GTA6》预购收入超16亿美元\n\n因150元成被执行人？格力电器最新回应；马斯克：Optimus拟18个月内胜任家务，Terafab计划2028年底量产；字节跳动拟追加5亿美元微软云服务合同。\n\n原创新闻宋佳楠 · 2026/11/20 08:05来源：界面新闻\n\n阿里第二财季营收2715.19亿元，同比增长10%\n\n阿里巴巴11月19日公布截至2026年9月30日的季度及上半财年业绩。第二财季营收为2715.19亿元，同比增长10%；经营利润291.16亿元，同比增长443%；归属于普通股股东的净利润645.35亿元，同比增长207%。非GAAP净利润为199.09亿元，同比增长92%。\n\n财报显示，第二财季AI云和计算服务收入为609.73亿元，同比增长53%；外部客户收入增长64%，其中外部客户经常性收入增长67%。AI相关产品收入达到179.18亿元，连续第13个季度实现同比三位数增长。公司称，互联网、汽车、具身智能、金融服务和生物技术等行业客户均在扩大云服务使用。\n\n《GTA6》预购收入超16亿美元\n\n11月18日，《侠盗猎车手6》（Grand Theft Auto VI，下称《GTA6》）的媒体评测正式解禁。在游戏评分汇总网站Metacritic上，其PS5版本首批媒体综合评分达到99分，追平了1998年《塞尔达传说：时之笛》创下的纪录。此前，《GTA4》和《GTA5》分别获得98分和97分。\n\n据市场研究机构Sensor Tower于11月18日更新的追踪估算，《GTA6》在PS5及Xbox平台的数字版预购量已达到约1707万份，对应预购收入约16.5亿美元。其中，PlayStation平台贡献约75%的预购量。\n\n因150元成被执行人？格力电器最新回应\n\n11月19日，关于格力电器的一则消息在网络上传开，据中国执行信息公开网信息显示，格力电器新增一则小额被执行人信息，立案时间为11月17日，执行标的为150元，执行法院为义乌市人民法院，案件号为（2026）浙0782执32271号。\n\n据证券时报消息，格力电器对此回应称，针对网络上关于（2026）浙0782执32271号案件格力被列为被执行人一事，实为公司作为原告的一起商标侵权案件的受理费用。公司于11月19日收到缴费通知当天已按要求进行费用缴纳。\n\n马斯克：Optimus拟18个月内胜任家务，Terafab计划2028年底量产\n\n当地时间11月18日，特斯拉CEO埃隆·马斯克通过视频连线参加美国奥斯汀举行的TomorrowX峰会，并披露旗下多项业务进展。他表示，Optimus人形机器人有望在未来12至18个月内完成洗碗、清洗烘干并收纳等家务；Terafab研究工厂计划于明年6月试产首款测试芯片，并争取在2028年底实现第一阶段量产；xAI目前每月新增约0.5吉瓦算力，明年将提高至每月超过1吉瓦。\n\n马斯克还称，星舰实现完全、快速重复使用后，进入轨道的成本有望降低约100倍；Neuralink目前已为30多名受试者植入脑机接口设备。谈及英伟达时，他将CEO黄仁勋比作迈克尔·乔丹，称其是科技企业创始人中的顶尖人物，若失去黄仁勋的领导，对英伟达将是重大打击。\n\n字节跳动拟追加5亿美元微软云服务合同\n\n11月19日，据市场消息，字节跳动正在与微软进行谈判，计划在现有合同基础上，追加约5亿美元微软云服务支出，主要用于通过微软Azure使用OpenAI模型，目前交易尚未完成。微软拥有向客户转售OpenAI技术的权利，微软方面认为字节跳动主要将OpenAI模型用于包括软件开发在内的任务。不包括该笔在谈合同，据估算，字节跳动每年在微软AI与云服务上的支出近10亿美元。截至发稿，字节跳动方面暂未回应。\n\nOpenAI进军手机领域，富士康旗下富智康集团获组装订单\n\n11月19日，据人民财讯援引供应链消息，富士康旗下富智康集团（02038.HK）已获得OpenAI手机项目订单，将参与相关产品的整机组装。富士康同时是苹果iPhone的主要组装商。若OpenAI手机最终面市，其将进入手机终端市场，并可能围绕AI交互体验，与现有手机品牌展开更直接的竞争。相关产品方案、订单规模及量产安排，仍有待进一步获悉。\n\n联想集团二季度营收首破2000亿元，同比增长47.8%\n\n11月19日，联想集团公布2026/27财年第二季度业绩。财报显示，截至2026年9月30日，联想集团实现营收302.38亿美元（约合2029亿元人民币），同比增长47.8%，首次突破2000亿元大关，创历史新高。调整后净利润达到91.3亿元，同比增长166%。\n\n联想集团营收增长正呈现持续加速态势。2025/26财年第四季度，联想营收同比增长27.1%。进入2026/27财年后，第一季度营收增速跃升至43.1%，第二季度进一步提高至47.8%。两个季度，营收增速累计提升20.7个百分点。\n\n网易：第三季度净收入279亿元，同比下降1.8%\n\n11月19日，网易发布2026年第三季度财报显示，单季净收入279亿元，同比下降1.8%；游戏和相关增值服务净收入229亿元，同比下降1.7%；有道净收入14亿元，同比下降12.3%；网易云音乐净收入19亿元，同比下降0.9%；创新及其他业务净收入15亿元，同比增长7.1%。归属于公司股东的净利润84亿元；Non-GAAP净利润92亿元。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4e9b5254ac","title":"Gap第三季度業績略好過市場預期 惟下調全年度業績指引","url":"https://news.tvb.com/tc/1207373-Gap第三季度業績略好過市場預期惟下調全年度業績指引","summary":"服裝品牌集團Gap第三季度業績略好過市場預期，但下調全年度業績指引。公司季內賺3.11億美元，按年增長三成一。","summary_short":"服裝品牌集團Gap第三季度業績略好過市場預期，但下調全年度業績指引。","digest":"服裝品牌集團Gap第三季度業績略好過市場預期，但下調全年度業績指引","points":["公司季內賺3.11億美元，按年增長三成一","經調整每股攤薄盈利82美仙，較預期多4美仙","淨收入逾40億美元，則與預期相若"],"section":"財經","category":"財經","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:53+08:00","size":1,"keywords":[],"body":"服裝品牌集團Gap第三季度業績略好過市場預期，但下調全年度業績指引。\n\n公司季內賺3.11億美元，按年增長三成一。經調整每股攤薄盈利82美仙，較預期多4美仙。淨收入逾40億美元，則與預期相若。\n\n集團下調全年度業績指引，當中經調整每股攤薄盈利，由原預期2.35至2.45美元，下調至2.29至2.34美元，淨收入由預期增長百分之1至1.5，降至持平。經調整毛利率由預期輕微上升，降至輕微下跌。","image":"https://pro-vod-cdn.tvb.com/a01b56d58cce41a1b34cbee26a3850fc/snapshots/eac2940d10fa4ade98841604cac7cbb4-00005.jpg","video":"https://pro-vod-cdn.tvb.com/a01b56d58cce41a1b34cbee26a3850fc/86650e8a536a485d967835450c728a0b-07da427f574f978eb8649163ebacebfd-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/a01b56d58cce41a1b34cbee26a3850fc/snapshots/eac2940d10fa4ade98841604cac7cbb4-00005.jpg","lang":"zh-Hant"},{"id":"c971d907b90","title":"产销、改装、回收，汽车消费全链条发力","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735005.shtml","summary":"《扩大消费“十五五”规划》提出“扩大汽车消费，推进汽车流通消费领域全链条创新发展，促进二手车流通，拓展汽车改装、租赁、赛事及房车露营等汽车后市场消费”。","summary_short":"《扩大消费“十五五”规划》提出“扩大汽车消费，推进汽车流通消费领域全链条创新发展，促进二手车流通，拓展汽车改装、租赁…","digest":"《扩大消费“十五五”规划》提出“扩大汽车消费，推进汽车流通消费领域全链条创新发展…","points":["《扩大消费“十五五”规划》提出“扩大汽车消费，推进汽车流通消费领域全链条创新发展…","商务部等8部门公布了40个汽车流通消费改革试点城市，各试点城市将结合本地产业特色、市场特点…","上午10点半，安徽蔚来先进制造合肥一工厂交付中心，消费者袁野提取3周前线上下定的新车…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:45:47+08:00","size":1,"keywords":[],"body":"《扩大消费“十五五”规划》提出“扩大汽车消费，推进汽车流通消费领域全链条创新发展，促进二手车流通，拓展汽车改装、租赁、赛事及房车露营等汽车后市场消费”。\n\n　　商务部等8部门公布了40个汽车流通消费改革试点城市，各试点城市将结合本地产业特色、市场特点、资源禀赋、区位条件、功能定位等实际情况，培育汽车消费新场景新业态新模式，带动商旅文体健融合发展。\n\n　　扩大汽车消费成效如何？记者在安徽、海南、广西等省份的汽车流通消费改革试点进行了采访。\n\n　　安徽合肥“前店后厂”产销融合\r\n\n　　建设新能源汽车一站式服务集群\n\n　　上午10点半，安徽蔚来先进制造合肥一工厂交付中心，消费者袁野提取3周前线上下定的新车，检查车辆、缴纳税费、选号上牌，前后不到半小时，“手续在提车现场一站办结。”\n\n　　便捷舒心的购车体验，是合肥探索汽车产销一体管理新模式的缩影。合肥打通从生产到消费的全链条通道，推动产业制造优势转化为终端消费动能。\n\n　　在生产端，合肥在蔚来、比亚迪、江淮、长安等整车制造企业，推行国产小客车新车预查验制度。“公司在总装车间设立标准化预查验工位，依托智能采集设备，自动抓取车辆识别码、整车实拍影像等车辆溯源信息。”蔚来安徽区域总经理余东明介绍，这些信息将自动生成电子化查验记录表，与合格证电子信息一并自动上传至工业和信息化部、公安部车辆预查验信息服务平台，和交管部门实现信息共享。\n\n　　原本需要到车管所办理的新车注册登记业务转到线上。“免予查验车辆直接线上办理，最快10分钟就能完成。”合肥市商务局市场体系建设处处长张弘说。\n\n　　在消费端，合肥依托工厂制造资源，打造特色“前店后厂”产销融合消费新场景。消费者不仅可以在门店看车选车，还能走进智能制造车间，近距离观看整车生产流程。“车企直营销售，车辆全国价格统一，我们省去了比价的烦恼。”袁野说。\n\n　　今年合肥入选汽车流通消费改革试点城市名单，重点改革创新方向便是汽车产销一体管理服务新模式。张弘表示，合肥将加快建设新能源汽车一站式服务集群，打造“制造基地+研发中心+销售中心”的产销一体新模式，年底前推动不少于3个一体化项目建成或投入运营。\n\n　　海南重点发展高附加值专用车\n\n　　聚焦“小而精”特色汽车产业定位\n\n　　“项目从签约到拿地再到开工只用了100天！”10月30日，程力汽车集团“海南新能源专用车产业区项目”在澄迈县老城镇破土开工。\n\n　　“我们主营环卫、工程、应急救援等品类专用车，产品辐射150多个国家和地区。希望抢抓自贸港封关窗口期布局出海业务，重点打造新能源专用车出口组装基地，聚焦海外定制车型改装、整车智能制造、跨境出口贸易。”企业相关负责人介绍，项目预计2027年5月具备专用车生产准入申报条件，下半年取得相关生产资质。\n\n　　“项目落地填补了海南专用车整车组装、出口定制化制造环节短板，完善了海南新能源与专用车产业链条，有利于带动零部件配套、跨境物流、外贸服务等上下游产业集聚，吸引产业技术、外贸、金融人才来琼就业发展。”海南省工业和信息化厅新能源汽车发展与监察处副处长余欢说。\n\n　　程力汽车集团赴琼设厂，是海南立足自贸港政策优势，推动汽车改装产业发展的缩影。“封关后，海南零关税商品清单扩容至约6600个税目，占全部商品税目的比重比封关前提高了近53个百分点，涵盖汽车音响、制动套件、灯光配件等。”余欢介绍。\n\n　　“改装可在优化汽车产业价值链的同时，激活汽车消费新增长点，稳定和扩大汽车消费规模。”中国汽车技术研究中心有限公司原资深首席专家黄永和认为，借助自贸港政策优势，海南可聚焦新车定制改装车型研发与发布、国内新车改装出口、进口新车改装转内销等方向，推动产业高质量发展。\n\n　　好政策加上好区位，海南汽车消费新场景也在不断“解锁”。走进海口观澜湖世界新能源汽车体验中心施工现场，一条国际二级标准赛道正加速建设。按照规划，2027年赛道将开展测试赛事，2028年正式运营，体验中心集“展销研赛会游”于一体，赛车改装、性能测试等业态也将同步落地。\n\n　　海南省工业和信息化厅相关负责人介绍，未来海南将聚焦“小而精”特色汽车产业定位，重点发展救护车、消防车、通信指挥车、旅居车等高附加值专用车，走好差异化、高端化、专精特新发展路径。\n\n　　广西梧州搭建再生利用体系\n\n　　打通回收、拆解、再制造全流程\n\n　　“这辆车已经到了报废条件，二手车中介看一眼直摇头，丢在家里占车位还操心。”广西梧州市民高先生说，“总担心换车成本高，迟迟没买新车。”\n\n　　前不久，高先生下定决心，敲定新车订单，将旧燃油车送至广西嘉禾盛德金太阳再生资源有限公司进行正规报废，并线上申领1.5万元补贴冲抵购车款。这笔钱打消了他换车的经济顾虑，报废回收也撬动新车消费增量。\n\n　　梧州东接大湾区、西联北部湾，区位优势独特。截至2025年底，全市汽车保有量约42万辆，其中新能源汽车保有量3年内增长了156%，报废车回收拆解量由2023年的7723辆增至2025年的13308辆，市场底盘厚实；当地再生金属材料产业规上工业产值达736亿元，产业根基扎实。\n\n　　结合本地产业实际，梧州搭建分层分类的报废车再生利用体系，延长汽车生命周期。梧州市商务局副局长梁泓说：“以报废机动车发动机、方向机、变速器、前后桥、车架等‘五大总成’来说，资源化利用方式有两种——破损严重、无复用价值的，拆解为废钢、废铝等，回炉再生；具备再制造条件的，交由合规企业再制造循环利用。”\n\n　　梧州循环经济产业园区金太阳公司拆解车间，工人对车顶、座椅等进行无害化处理，重型大力剪切割报废车体。“拆解物料中约六成是废钢，有色金属、废橡胶、废塑料等约占一成，归集后送往下游企业循环再造。”厂长柯雄祥说。\n\n　　一路之隔的梧州君临汽车零部件再制造有限公司，则走出高值化再利用路径。\n\n　　实验室内，工人在综合性能试验台前测试方向机性能：磨损耐久、空载摩擦力矩、齿轮齿条传动间隙……“以往车辆一报废，只能进熔炉，论斤卖；如今精细修复、检测达标后，高价值零部件有机会再度‘上岗’，装车复用。”公司总经理初长林说，相比全新配件，再制造零部件成本缩减一半，售价仅为新品七成，盘活报废车隐藏残值。\n\n　　从老旧车辆规范报废，到配件修复再生利用，梧州完善汽车消费全产业链。“接下来，我们将探索搭建报废回收数字化管理平台，引入智慧化交易市场，以数字溯源打通回收、拆解、再制造全流程，持续完善现有循环体系。”梁泓说。（记者 李俊杰 曹文轩 张云河） 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ceb8b8700fb","title":"“中国造”商品汽车出口专列累计开行1万列","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-20/news1075516.shtml","summary":"11月19日，一列满载203台国产新能源汽车的列车从河南郑州国际陆港驶向上海港，将经14天海运抵达澳大利亚，标志着铁路商品车运输专用车承运的“中国造”商品汽车出口专列累计开行1万列。","summary_short":"11月19日，一列满载203台国产新能源汽车的列车从河南郑州国际陆港驶向上海港，将经14天海运抵达澳大利亚…","digest":"11月19日，一列满载203台国产新能源汽车的列车从河南郑州国际陆港驶向上海港…","points":["11月19日，一列满载203台国产新能源汽车的列车从河南郑州国际陆港驶向上海港…","作为中国铁路商品汽车运输唯一承运商的中铁特货物流股份有限公司统计数据显示，今年以来…","其中，1至10月郑州地区经铁路运输的出口商品车近40万台"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T07:27:14+08:00","size":1,"keywords":[],"body":"11月19日，一列满载203台国产新能源汽车的列车从河南郑州国际陆港驶向上海港，将经14天海运抵达澳大利亚，标志着铁路商品车运输专用车承运的“中国造”商品汽车出口专列累计开行1万列。\n\n作为中国铁路商品汽车运输唯一承运商的中铁特货物流股份有限公司统计数据显示，今年以来，铁路出口商品车超203.5万台，同比增长79%。其中，1至10月郑州地区经铁路运输的出口商品车近40万台。(记者 赵梦阳)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/8CE4A4E7BA5844F89EE15730434FB905.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cadea4a3abe","title":"重庆大渡口培育壮大新质生产力 打造重庆具身智能产业核心承载地","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-20/news1075515.shtml","summary":"11月19日，在重庆市人民政府新闻办公室举行的“开局起步十五五·建设现代化新重庆”系列主题新闻发布会上，重庆市大渡口区委书记张果表示，“十五五”时期，大渡口区将以培育壮大新质生产力为主线…","summary_short":"11月19日，在重庆市人民政府新闻办公室举行的“开局起步十五五·建设现代化新重庆”系列主题新闻发布会上…","digest":"重庆大渡口培育壮大新质生产力 打造重庆具身智能产业核心承载地","points":["11月19日，在重庆市人民政府新闻办公室举行的“开局起步十五五·建设现代化新重庆”系列主题新…","大渡口区位于重庆中心城区西南部，工业文化积淀深厚，是国家产业转型升级示范区","“十五五”时期，当地坚持先进制造业筑基、现代服务业赋能，内育链主、外引龙头，抢占新赛道…"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T07:26:18+08:00","size":1,"keywords":[],"body":"11月19日，在重庆市人民政府新闻办公室举行的“开局起步十五五·建设现代化新重庆”系列主题新闻发布会上，重庆市大渡口区委书记张果表示，“十五五”时期，大渡口区将以培育壮大新质生产力为主线，打造重庆具身智能产业核心承载地。\n\n大渡口区位于重庆中心城区西南部，工业文化积淀深厚，是国家产业转型升级示范区。“十五五”时期，当地坚持先进制造业筑基、现代服务业赋能，内育链主、外引龙头，抢占新赛道，全力扩大产业规模，提升产业能级。当地依托宇树科技等龙头企业，构建“芯片、算力、大脑、本体”全链条未来产业生态，打造重庆具身智能产业核心承载地。\n\n当地提出，“十五五”时期，GDP年均增长5.5%以上、总量突破700亿元，人均GDP达到14万元以上，力争工业总产值突破1000亿元。(记者 肖江川)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/37780857B9604D5083A0F175560764FD.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c20d4fcecac","title":"美元匯價持續上升 金價連跌四日","url":"https://news.tvb.com/tc/1207362-美元匯價持續上升金價連跌四日","summary":"美元匯價持續上升，金價連跌四日，跌穿3,700美元一盎司。現貨金價曾跌至3,621.68美元一盎司，跌103.7美元，跌幅近百分之2.8，見去年9月以來低位。","summary_short":"美元匯價持續上升，金價連跌四日，跌穿3,700美元一盎司。","digest":"美元匯價持續上升，金價連跌四日，跌穿3,700美元一盎司","points":["現貨金價曾跌至3,621.68美元一盎司，跌103.7美元，跌幅近百分之2.8…","Everbank全球市場主管加夫尼表示，加息預期加上強美元，是金價下挫主因","他指出，聯儲局上月議息會議紀要顯示，幾乎所有與會委員預期，利率將進一步上升…"],"section":"財經","category":"財經","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T07:00:00+08:00","size":1,"keywords":["金價","紐約期金","財經"],"body":"美元匯價持續上升，金價連跌四日，跌穿3,700美元一盎司。\n\n現貨金價曾跌至3,621.68美元一盎司，跌103.7美元，跌幅近百分之2.8，見去年9月以來低位。\n\nEverbank全球市場主管加夫尼表示，加息預期加上強美元，是金價下挫主因。他指出，聯儲局上月議息會議紀要顯示，幾乎所有與會委員預期，利率將進一步上升，而近期公布的通脹數據，同樣支持美國需要加息。利率期貨市場顯示，下月加息機會超過九成六。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026E3NoLmtjom1795129292.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb. 24方呎，涵蓋2房1套至3房3套間隔，招標期直至今年12月31日，期內採用每日截標方式出售。該盤分兩期發展，合共提供172伙，開盤至今累售約68伙。\n西半山羅便臣道80號推3房連車位招標\n西半山豪宅羅便臣道80號推出1座41樓A室，連同一個指定車位招標。\n南豐旗下三個豪盤亦上載銷售安排，均定於下周一以招標形式發售，並於即日截標。當中同系旗下西半山入伙多年的豪宅羅便臣道80號，推出1座41樓A室，面積1058方呎，屬3房1套間隔，連同一個指定車位招標。另淺水灣福慧大廈則推出1個4房雙套連兩個指定車位應市，為6樓B單位，面積3480方呎。\n南區深水灣徑8號推售2座17樓C室，面積4214方呎，採4房4套設計。\n而同系旗下與豐資源合作發展的港島南區深水灣徑8號，最新推出2座17樓C室，面積4214方呎，露台220方呎，採4房4套設計。項目共提供52伙，至今暫售23伙，套現超過62億元。\n另外，萊蒙及俊和合作發展的何文田128 WATERLOO，同步推出15樓C室於下周一起以招標形式發售，單位面積342方呎，屬1套房間隔，招標期截至今年12月31日，採每日招標截標。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc110a21325","title":"Anthropic CEO回应9000亿美元AI投入承诺：相较现有现金储备和营收规模并不算大","url":"https://www.jiemian.com/article/15352512.html","summary":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示，若考虑公司目前的现金储备及年营收规模，9000亿美元的AI相关投入承诺“看起来就没那么庞大”。","summary_short":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示，若考虑公司目前的现金储备及年营收规模…","digest":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…","points":["11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…","阿莫代伊称，公司在预测未来算力需求时，通常会采取相对保守的估算方式，尽量避免高估需求"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T23:51:04+08:00","size":4,"keywords":[],"body":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示，若考虑公司目前的现金储备及年营收规模，9000亿美元的AI相关投入承诺“看起来就没那么庞大”。阿莫代伊称，公司在预测未来算力需求时，通常会采取相对保守的估算方式，尽量避免高估需求。","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"Anthropic CEO回应9000亿美元AI投入承诺：相较现有现金储备和营收规模并不算大","url":"https://www.jiemian.com/article/15352512.html","source_display":"界面新聞","published_at":"2026-11-19T23:51:04+08:00","category":"","digest":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…"},{"title":"Anthropic CEO称公司目前与SpaceX合作愉快，算力服务质量良好","url":"https://www.jiemian.com/article/15352504.html","source_display":"界面新聞","published_at":"2026-11-19T23:49:56+08:00","category":"","digest":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表示…"},{"title":"Anthropic CEO：公司希望未来获得投资级信用评级","url":"https://www.jiemian.com/article/15352500.html","source_display":"界面新聞","published_at":"2026-11-19T23:48:00+08:00","category":"","digest":"11月19日，Anthropic首席执行官达里奥·阿莫代伊表 世界排名已去到25位，超出教練團預期，他們期望2027年新賽季能衝上頒獎台，為五月展開的奧運計分周期打好基礎。\n「澤柔配」今日的16強有點可惜，他們跟印尼組合Dejan Ferdinansyah及Felisha Alberta Nathaniel Pasaribu的競爭像過山車，在首局初段港隊氣勢如虹，曾領先8:0，但對方一分分追上，雙方要打至「刁時」才分出勝負，結果是港隊以22:24先失一局，第二局在球迷打氣聲中越戰越勇，在這局拉鋸戰中，「澤柔配」以21:19扳成平手；決勝局初段只有一、兩分差距，但小休後一節，對方的主動追擊一分分拉開比賽，港隊終以11:21敗陣，16強止步。\n問到首局被反勝原因，延澤表示：「主要是對手的發接發和對每一分的處理比我們做得更好，當對手的分數逼近，我們自己也有些手緊，影響到發揮。」\n周四晚有八成入座率，不少人為港隊加油打氣，芷柔認為主場的壓力問題不大：「有那麼多觀眾支持，我會將壓力變成動力，沒有半點負面影響，這可能是心態及士氣上比以往好些。」\n今年三月固定合作混雙後，延澤及芷柔的世界排名徘徊在100位，五月闖入頭50位內，並接連在BWF世巡賽登上頒獎台，包括五月中的中國寶雞羽毛球大師賽（超級100）的亞軍及六月中澳門公開賽（超級300）的亞軍，世界排名於六月底升至頭32位內，這意味著二人可以打上去BWF更高級別的比賽，包括超級500、 750甚至1000級別的比賽，更首次參加了八月世錦賽及九月亞運會，二人表示這些「大賽」的經驗令他們獲益良多。\n芷柔說：「我們二人的組合越來越合作得好，近幾個月憑世界排名打到的超級500至1000級的比賽，對我們準備明年奧運積分周期很有幫助，至少令我們可以提早跟強手對陣，在高水平的比賽中檢視我們自己的水平；發覺高手們發揮很穩定，我們需要慢慢學習，有甚麼不好的，包括穩定性及臨場的變化，彼此在現場要怎樣溝通去處理下一球，或者在對方狀態散了，應如何去互相提醒，掘大家的狀態叫回來，這些都要去改善。」\n談到2027年的目標，包括新制的15分及半年後即展開的奧運積分周期，二人不約而同表示「一定要向上衝」：「爭冠的心態一定要有，今季的成績（特別是超級500以上的大賽），成績沒理想中好，但每一次感覺不是不夠打，很多時戰滿三局或『刁時』才輸，主要是在關鍵分沒處理好，所以在新一個賽季，我們要保持想衝想贏的心態。」\n記者/攝影：徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"香港公開羽毛球錦標賽｜混雙「澤柔配」陳延澤 吳芷柔止步16強 上寶貴一課 期望新賽季衝上「大賽」頒獎台","url":"https://www.stheadline.com/realtime-sport/3639135/香港公開羽毛球錦標賽混雙澤柔配陳延澤-吳芷柔止步16強-上寶貴一課-期望新賽季衝上大賽頒獎台","source_display":"星島頭條","published_at":"2026-11-20T02:21:59+08:00","category":"生活","digest":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…"},{"title":"香港公開羽毛球錦標賽｜伍家朗因傷中途退賽感「遺憾」 李卓耀自責壓力下只能發揮五成功力","url":"https://www.stheadline.com/realtime-sport/3639031/香港公開羽毛球錦標賽伍家朗因傷中途退賽感遺憾-李卓耀自責壓力下只能發揮五成功力","source_display":"星島頭條","published_at":"2026-11-19T22:58:18+08:00","category":"生活","digest":"兩位前「香港冠軍」李卓耀及伍家朗周四在八成滿的體藝館舉行的香港公開羽毛球錦標賽男單1…"}],"cross":{"total":2,"angles":[{"point":"香港混雙組合陳延澤及吳芷柔，周四亮相香港公開羽毛球錦標賽16強對印尼組合…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639135/香港公開羽毛球錦標賽混雙澤柔配陳延澤-吳芷柔止步16強-上寶貴一課-期望新賽季衝上大賽頒獎台"},{"point":"兩位前「香港冠軍」李卓耀及伍家朗周四在八成滿的體藝館舉行的香港公開羽毛球錦標賽男單1…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639031/香港公開羽毛球錦標賽伍家朗因傷中途退賽感遺憾-李卓耀自責壓力下只能發揮五成功力"}]}},{"id":"c14251b0bb1","title":"“零添加”“0蔗糖”未必更健康","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735009.shtml","summary":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)  　　“零添加”“0蔗糖”“非油炸”……","summary_short":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)  　　“零添加”“0蔗糖”“非油炸”…","digest":"本报记者 王美华  　　《人民日报海外版》(2026年11月20日 第 09 版)…","points":["《人民日报海外版》(2026年11月20日 第 09 版)","“零添加”“0蔗糖”“非油炸”……如今，许多食品打出这样的宣传标签，吸引消费者购买","“这些说法只涉及某种成分或加工方式，不能代表食品的整体营养状况"],"section":"生活","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:08:41+08:00","size":1,"keywords":[],"body":"本报记者 王美华\n\n　　《人民日报海外版》(2026年11月20日 第 09 版)\n\n　　“零添加”“0蔗糖”“非油炸”……如今，许多食品打出这样的宣传标签，吸引消费者购买。这些字眼是否意味着食品更安全、更健康？在国家卫生健康委近日举行的新闻发布会上，专家进行了详细解读。\n\n　　“这些说法只涉及某种成分或加工方式，不能代表食品的整体营养状况。”国家食品安全风险评估中心副研究员梁栋在发布会上介绍，2027年3月16日起，我国将实施新的标签标准要求，将禁止使用“零添加”“不添加”等用语对食品配料进行特别强调，避免误导消费者。\r\n\n　　关键在于控制糖的总摄入量\n\n　　梁栋介绍，“0蔗糖”≠没有糖。营养成分表中的糖，包括葡萄糖、果糖、蔗糖、麦芽糖和乳糖。“0蔗糖”只针对蔗糖，并不代表这个食品中不含有其他糖类，也不代表低能量。因此，需要控糖的人群，还要结合配料表和营养成分表来综合判断。此外，科学控糖关键在于控制糖的总摄入量，而不是纠结该选择哪种糖。\n\n　　“零添加”≠更健康。比如，不添加防腐剂的食品并不代表低糖、低盐。有些食品为了延长保质期，可能在加工过程中会添加更多的糖或者盐，因此也要控制其食用量。\n\n　　“非油炸”≠没有油、脂肪低。“非油炸”仅仅说明食品在加工过程中没有采用油炸工艺，但也有可能通过食品原料添加油或食品加工过程中加入了油脂。比如，有些非油炸膨化食品、焙烤食品为改善口感也会加油。“消费者在选购的时候，还要看配料表和营养成分表，观察配料表里到底有没有加入油脂，同时结合营养成分表中的脂肪含量来综合判断，而不能仅靠加工方式来下结论。”梁栋表示。\n\n　　重点看配料表与营养成分表\n\n　　食品标签上哪些内容需要重点关注？\n\n　　“消费者需求不同，选购预包装食品时的关注点也会有所差异，但关键都在于配料表和营养成分表。”梁栋表示，有食物过敏的人，需重点关注食品配料表和致敏提示。配料表说明制作食品用了什么，排得越靠前，用量越大。过敏人群要关注自己需要避免摄入的物质。\n\n　　接着看营养成分表，要注意含量是按每100克、每100毫升还是每份标示，吃多少要相应换算。表中的“营养素参考值”百分比，表示相应营养成分占每日参考量的比例。例如，每100克饱和脂肪对应的值是70%，意味着吃100克就占了一天饱和脂肪摄入总量的七成，要注意控制食用量。\n\n　　梁栋表示，消费者应根据自己的健康需求，选择更适合的食品。例如，需要减重的人群重点看能量，这里的能量是指蛋白质、脂肪和碳水化合物提供的总能量；高血压人群重点看钠含量，尽量选择钠含量较低的食品；血脂偏高人群关注脂肪和饱和脂肪的含量。\n\n　　需要提醒的是，现在许多食品包装上有了“数字标签”二维码，用手机扫一扫就可以实现标签信息的“可听、可播、可放大”，帮助更好了解和选择食品。\n\n　　2岁内幼儿尽量不摄入添加糖\n\n　　糖尿病是吃糖、吃甜食太多引起的吗？不吃糖就不会得糖尿病吗？\n\n　　北京协和医院主任医师许岭翎表示，糖尿病是身体调节和利用葡萄糖的能力出了问题，预防糖尿病不能只盯着吃不吃糖，还要规律进餐、粗细搭配、适量运动、保持健康体重。\n\n　　“平时生活中不必谈糖色变，重要的是注意控制添加糖的摄入量。”许岭翎提醒，添加糖是指加工食品或烹调时额外加入的糖，不包括食材中天然存在的糖。对于血糖正常的成人来说，每日添加糖应不超过50克，最好控制在25克以下。儿童青少年应该更加严格，2岁之内幼儿尽量不要摄入添加糖。\n\n　　此外，还要注意隐形糖。购买食品要养成看标签的习惯，既要看配料表中有没有添加糖，也要关注营养成分表中的糖含量，并按整瓶、整包计算，同时不能把碳水化合物直接当成添加糖。要留意调味酸奶、果汁饮料、酱料中的隐形糖，少吃甜点和高糖加工食品，用白开水、淡茶水替代甜饮料，用适量新鲜水果替代甜点。 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3ef76d0516","title":"抄袭、洗稿事件频发 文学刊物如何守住“原创防线”","url":"https://www.chinanews.com.cn/cul/2026/11-20/10735008.shtml","summary":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐，并对该作者的作品永久禁发。","summary_short":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐…","digest":"本报记者 路艳霞  　　《上海文学》近日发布致歉声明…","points":["《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传…","值得关注的是，今年以来，国内文学刊物已多次发出致歉声明，核心指向高度一致：作品雷同、洗稿…","今年10月，《人民文学》第9期短篇小说《秋宵梦觉》被读者比对指出文本雷同，经编辑部核实…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T08:05:14+08:00","size":1,"keywords":[],"body":"本报记者 路艳霞\n\n　　《上海文学》近日发布致歉声明，宣布撤回2025年第12期邹谨忆小说《泊松比之夜》的全平台宣传推荐，并对该作者的作品永久禁发。值得关注的是，今年以来，国内文学刊物已多次发出致歉声明，核心指向高度一致：作品雷同、洗稿、抄袭。\n\n　　近年文坛常见隐蔽式洗稿\n\n　　发布致歉声明的，都是大家耳熟能详的知名文学刊物。\r\n\n　　今年10月，《人民文学》第9期短篇小说《秋宵梦觉》被读者比对指出文本雷同，经编辑部核实，约三百字语段在场景书写、情绪氛围与句式表达上与日本作家井上靖作品高度相近。于是，刊物致歉，追回稿酬。\n\n　　今年11月，《人民文学》第10期散文《湘江北去》被指整体文意、行文脉络、段落结构与前人已发表作品高度重合。与普通字句抄袭不同，该作品通过改写语序、替换关键词、微调表达的方式规避机器查重——这正是近年文坛愈发常见的隐蔽式洗稿。为此，《人民文学》决定追回稿酬、撤销推介宣传，并对作者设置投稿禁发期。\n\n　　“文学期刊接二连三发致歉声明，会给其带来压力，这不是偶发性的舆论压力，而是一种结构性的制度压力。”《诗刊》社主编李少君的判断直指要害，它暴露了一个更深层的问题：传统的三审制在面对“洗稿”和“AI润色”时，防线正在系统性失守。\n\n　　在李少君看来，抄袭尚可依赖查重工具和编辑的阅读积累来发现，但洗稿是对原文本进行结构性改写，查重工具往往难以触发警报。李少君还指出，AI生成后的人工修改的文本，更是介于“原创”与“非原创”之间的灰色地带。“当最近两家标杆文学刊物在相近时间内被同一种方式击中，其他刊物的直接反应必然是：下一个会不会是我？我的审稿流程能不能挡住这种稿件？”\n\n　　坚决对抄袭和AI洗稿说“不”\n\n　　“今年以来接到的AI稿频次明显增加——表面流畅漂亮、旁征博引、词句准确，细看却空洞、模式化、堆砌意象。”《北京文学》执行主编师力斌如此说道。\n\n　　师力斌发现，AI稿件爱写一对男女到著名景区度假的场景。“一旦让它写北京某个村、某条街道，就会露马脚。”在他看来，缺乏私人性、特殊性、细节，是AI稿的致命伤。因此，在编辑部内部其实已经形成默契，凡是心存怀疑的来稿，一概不用。“因此，我们看到真人写的、哪怕不完美的文字，反而会欣喜，会觉得宝贵。”师力斌说。\n\n　　其实，不少文学期刊已纷纷启用辅助手段，进行防范。李少君介绍，《诗刊》的动作在诗歌刊物中启动较早，可概括为“工具筛查+黑名单+明确后果”三条线。“《诗刊》社很早即公开处理过几起抄袭事件，要求作者解释是否抄袭，属实则立即收回稿费、永不录用，对AI代笔同样如此。”不仅如此，在2026年全国文学报刊联盟框架下，《诗刊》作为理事长单位，参与了推动《原创承诺书》和行业统一规范的工作。“我们一直向投稿者传递‘这里不欢迎抄袭和AI代笔’的明确信号。”李少君说。\n\n　　值得关注的是，全国文学报刊联盟近期已发布通知，要求各成员单位刊发作品前，必须由作者签署《原创承诺书》，对作品原创性、著作权归属、引文规范、AI创作边界等作出郑重承诺，同时列明违背承诺所要承担的各类后果。“《原创承诺书》的落地，是一个起点，行业第一次有了统一的契约工具。”李少君说。\n\n　　编辑判断不可替代\n\n　　技术辅助手段和《原创承诺书》，是否能成为文学期刊真正捍卫“原创”的依靠，专业人士给出了答案。\n\n　　中国文字著作权协会常务副会长兼总干事张洪波透露，文著协就曾接受过知名文学期刊的咨询，为何利用学术不端检测系统依然查不出剽窃。张洪波就此向北京日报记者进行了一番普及，“检测系统可以查出来的政策、法规或者百科知识、常识，都属于不受版权保护的。而组合式抄袭、转换式使用，技术上很难发现，因此，查重技术仅仅是一种辅助。”文学期刊编辑张女士也向记者表明观点，“文学不像学术论文有规范、好鉴定。查重软件对文学不灵，人家用一句、几个字，根本查不出来。文学鉴定难就难在五花八门。”\n\n　　“几十年前的文学期刊和出版社的老编辑都是各领域的专家，对本领域的作者创作特点和行业动态非常熟悉，一打眼就能知道是不是抄袭、剽窃，或者引用了谁的观点。”张洪波直指，片面地强调依靠某些商业公司的查重系统，想走“捷径”，必然要被技术带偏。\n\n　　不仅如此，张洪波还强调，“期刊仅仅公开赔礼道歉还不足够，应该采取措施加强三审三校，一定要在期刊内部形成相关的制度，提升编辑的专业素养和版权法律意识。”同时，还应当以公告函等形式提示作者注意相关问题，如创作时对于他人作品的合理使用。针对如今存在的很多AI创作，也要考虑是否允许文学创作当中借助人工智能，并要求作者对人工智能的应用程度作出适当声明。否则，一旦造成侵权，期刊和抄袭他人作品的作者都要承担法律责任。\n\n　　延伸\n\n　　合理使用不等于随意使用\n\n　　“普通人理解的抄袭、剽窃，与文学界的行业标准、《中华人民共和国著作权法》(以下简称《著作权法》)意义上的抄袭、剽窃，并不一样。”中国文字著作权协会常务副会长兼总干事张洪波特别提示道。\n\n　　张洪波进行了一番梳理，根据《著作权法》规定，作者若对已发表、出版的作品，作为观点或内容来引用，要符合《著作权法》第24条关于“合理使用”的规定，即为了介绍、说明、评论某一作品，或说明某一问题、观点，可以适当使用已经发表的作品。张洪波说，“合理使用”是指不能构成自己作品的实质或核心部分，不能对原作者构成市场替代。此外，引用别人已发表、已出版的作品，必须标明出处，“引自哪本书、哪篇文章、作者是谁，都要标注清楚”。\n\n　　张洪波特别提醒，任何杂志、报纸在刊发作品时都依法负有审核义务，比如，作者相关作品刊发时，要审核其引用的参考文献或引用别人的作品是否做了合理标注；更关键的是，按照《最高人民法院关于审理著作权民事纠纷案件适用法律若干问题的解释》(2026年修正)，出版者对于出版行为的授权、稿件来源和署名、所编辑出版物的内容负有合理审核的义务。如果文学期刊对所刊发的内容未经过仔细核实，没有鉴别是否存在抄袭、剽窃、引用不当等，就应当为此承担相应的法律责任，即需要公开赔礼道歉、停止侵权；如果造成经济损失，则要给予被侵权者进行经济赔偿甚至精神损害赔偿。 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1887e45adc","title":"校園熱話│成軍半年奪全港醒獅冠軍！錦泰小學家校同心實踐正向教育","url":"https://www.stheadline.com/ohpama/3638515/校園熱話成軍半年奪全港醒獅冠軍錦泰小學家校同心實踐正向教育","summary":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！","summary_short":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！","digest":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間","points":["由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間","隊員每日苦練舞獅頭至腳腫仍堅持不懈，家長更自發擔任「搬運工」及現場打氣團","即睇錦泰小學如何透過傳統非遺醒獅活動結合正向教育，發掘學生品格優勢，培養孩子堅毅精神與責任感"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:15:11+08:00","size":1,"keywords":[],"body":"由零基礎到勇奪全港學界獅藝錦標賽冠軍，保良局錦泰小學12人醒獅隊僅花了半年時間！隊員每日苦練舞獅頭至腳腫仍堅持不懈，家長更自發擔任「搬運工」及現場打氣團。即睇錦泰小學如何透過傳統非遺醒獅活動結合正向教育，發掘學生品格優勢，培養孩子堅毅精神與責任感！\n家校齊心 舞出最燃正能量\n今年7月，全港學界獅藝錦標賽戰鼓擂響，保良局錦泰小學醒獅隊一舉奪魁。誰曾想到，這支由12名學生組成的醒獅隊，竟才成立半年。對錦泰師生及家長而言，奪冠絕非偶然，是三方鼎力同心、堅毅不屈的真實寫照。這股精氣神，為校園的正向教育點亮了一盞明燈。\n醒獅結合了武術、音樂、舞蹈和工藝，是國家級非物質文化遺產，對於小學生來說，因平日甚少接觸反倒生出好奇。「起初設立醒獅興趣班，是為了豐富學校活動課，加深學生對傳統文化的認識。」錦泰小學負責活動的林嘉榮主任介紹，學校於2025至2026學年第二期課後活動中為六年級開設醒獅循環體驗課。學校根據學生的興趣及初步選拔，一支十二人組的醒獅校隊正式成立。他們當中，有人平時愛跳舞，有人拉得一手好琴，也有人是體育健將，唯獨對醒獅零基礎。\n興趣引領下更能展現才能\n「錦泰的學生思路清晰、做事專注！」說起錦泰小學醒獅隊的學生，具有多年專業教學、裁判經驗的黃嘉勝教練頻頻點讚。黃教練表示，訓練舞獅時，他常常需要拆成不同組作個別訓練，「當我教緊鼓樂時，獅子組的同學會自覺練習，一點時間都唔會浪費。」林嘉榮主任也十分贊同，在興趣引領、專業指導和刻苦訓練的加持下，整個醒獅隊迅速成長，成立一個月後就能上台表演，五個月後第一次參加全港性比賽拿到優異獎，六個月後就拿到冠軍。\n越努力越有成就感，這是學生最大的感觸。醒獅隊成員李俊禧同學表示，當時因為好奇加入，並選擇最需要力量的舞獅頭，「最辛苦的時候，一天中所有的閒暇時間都用來練習，練到腳腫都沒有想過放棄。」獅隨鼓動，獅鼓是整個舞獅的統帥，決定了整個舞獅的節奏及氣勢。李映澄同學憑藉爵士鼓的經驗挑起了獅鼓的重任，她表示，這讓她更加有責任感。\n加入醒獅隊後學生盡顯積極\n家長也助力不少。「每次比賽，我們要帶上成套設備，家長們自發當起了搬運工。」林嘉榮表示，每一次比賽，家長都到現場打氣，給了老師和學生很大的鼓舞。「因為在孩子身上看到了對舞獅的熱愛、堅持和努力，作為家長，哪怕看到他受傷時會心疼，但依然會給予最大的支持。」李俊禧媽媽表示，自從加入醒獅隊，孩子的積極性明顯提升了不少，處事也更有擔當。\n發掘學生的興趣及品格優勢，引導其全心投入，並通過自身努力獲取成就感，是正向教育的核心。保良局錦泰小學吳嘉慧校長表示，她非常欣慰地看到學生、老師、家長在角色上的同頻共振，為學校的正向教育樹立了優秀典範。\n文、圖：保良局錦泰小學","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c24be478611","title":"英超｜名宿哈索賓基勸車路士放棄阿歷斯史葛 改斟阿仙奴冠軍中場蘇比文迪","url":"https://www.stheadline.com/football-news/3638976/英超名宿哈索賓基勸車路士放棄阿歷斯史葛-改斟阿仙奴冠軍中場蘇比文迪","summary":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。","summary_short":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。","digest":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下…","points":["英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下…","針對藍戰士有意重燃對般尼茅夫23歲中場新星阿歷斯史葛（Alex Scott）的追求…","哈索賓基強調，球隊目前極需一位現成的世界級冠軍贏家來穩定軍心，而非繼續囤積年輕新人"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:00:06+08:00","size":1,"keywords":[],"body":"英超豪門車路士在主帥沙比阿朗素（Xabi Alonso）帶領下，正積極部署1月冬季轉會窗的增兵計劃。針對藍戰士有意重燃對般尼茅夫23歲中場新星阿歷斯史葛（Alex Scott）的追求，車路士名宿哈索賓基（Jimmy Floyd Hasselbaink）日前高調獻計，強烈敦促舊東家立即放棄史葛，改斟阿仙奴陣中的西班牙失意防守中場蘇比文迪（Martin Zubimendi）。哈索賓基強調，球隊目前極需一位現成的世界級冠軍贏家來穩定軍心，而非繼續囤積年輕新人。\n促引進現成贏家重塑威望\n車路士今夏雖大肆擴軍，但隨著安素費南迪斯及安祖山度士離隊，中場防線僅靠摩西斯卡些度與剛傷癒的羅美奧拉維亞苦撐。\n哈索賓基接受《Canada Sports Betting》專訪時直言，23歲的史葛雖具備潛力，但無法解決車路士的燃眉之急：「我更希望看到球隊簽入一位經驗豐富的頂級國腳。沙比阿朗素麾下已有太多驚世駭俗的年輕人，他們現在需要的是那種一踏進科巴姆（Cobham）訓練基地，就能讓所有人驚呼『哇，我們這次是玩真的』的領袖。車路士必須引進擁有奪冠履歷的現成贏家，才能縮短重奪大賽錦標的陣痛期。」\n哈索賓基：沙比阿朗素深知其價值\n適逢蘇比文迪因難以撼動迪格蘭賴斯及新援般奴古馬雷斯的位置，今季在阿仙奴長居後備，已被槍手標價6,000萬鎊放售。\n哈索賓基一針見血地指出，這正是車路士截劫的黃金契機：「如果一月有機會從阿仙奴帶走蘇比文迪，車路士必須毫不猶豫地出手。他是歐洲國家盃及世界盃的雙料冠軍成員，渾身散發著無與倫比的冷靜與階級氣質。更重要的是，沙比阿朗素在皇家蘇斯達時期便對他非常了解。去吧，現在就去把他簽下來！」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c65bb9354dd","title":"理大入學攻略2027｜PolyU 10個最多人申請/競爭最激烈JUPAS課程 附最新收分+計分方法","url":"https://www.stheadline.com/admission-guide/3636044/理大入學攻略2027PolyU-10個最多人申請競爭最激烈JUPAS課程-附最新收分計分方法","summary":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。","summary_short":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。","digest":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試考生需要把握時間…","points":["大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請…","《星島教育》綜合了本港8所教資會資助大學2026年的收生資料，整理出各個課程的競爭情況","本文按照理大提供的數據，整合出該校5個最多人申請的課程（以Band A計算）…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T06:45:01+08:00","size":1,"keywords":[],"body":"大學聯合招生計劃（聯招／JUPAS）將於下月2日截止申請，中學文憑試（DSE）考生需要把握時間，揀選心儀課程。《星島教育》綜合了本港8所教資會資助大學2026年的收生資料，整理出各個課程的競爭情況。本文按照理大提供的數據，整合出該校5個最多人申請的課程（以Band A計算），及競爭最激烈的5個課程（以2026年的Band A申請人數對比學額計算），同時亦收錄關課程的計分方法及最新收生分數，助同學掌握最新升學形勢，增加入讀心儀學系的機會。\n理工大學5個最多人申請JUPAS課程\n在2026學年，最多申請者報讀的5個理大課程（以Band A計算），依次為護理學（榮譽）理學士、酒店及旅遊管理（榮譽）理學士組合課程（酒店管理 / 智慧旅遊及酒店產業 / 會展及體驗管理）、設計學（榮譽）文學士組合課程（廣告設計 / 環境設計 / 沉浸式媒體與遊戲設計 / 信息設計 / 交互設計 / 室內設計 / 產品設計 / 服務創新設計 / 社會創新設計）、時裝（榮譽）文學士組合課程（時裝設計 / 針織時裝設計 / 內衣及運動服裝 / 時裝商務 / 時裝創新及科技）及應用社會科學（榮譽）文學士組合課程（社會工作 / 社會政策及社會創業）\n第5位：應用社會科學（榮譽）文學士組合課程（社 慶紅地氈現場盛況\n點擊重溫TVB台慶2025紅地氈高清圖輯\n相關閱讀：萬千星輝賀台慶2026懶人包｜一文睇清TVB台慶表演焦點 汪明荃羅嘉良許志安坐鎮 附直播詳情\n《萬千星輝賀台慶2026》紅地氈直播資訊\n紅地氈盛況直播時間： 2026年11月19日（星期四）下午5時45分起\n網上直播及電視頻道：\n 網上平台： TVB官方YouTube頻道、娛樂新聞台Facebook專頁及YouTube頻道、東張+\n 電視平台： myTV SUPER 33台、無綫娛樂新聞台\n返回目錄\n【不斷更新】直擊台慶紅地氈現場盛況\n《萬千星輝賀台慶》紅地氈有多位女藝人性感亮相，向來身材出眾的鄧凱文華麗登場，超深V剪裁將其傲人上圍曲線表露無遺，頸間配戴廿多萬鑽飾更為整體造型增添幾分貴氣與亮點，性感又不失華麗感，成為傳媒鏡頭追逐的焦點。鄧凱文坦言為超低胸裙辛苦keep fit要廿四小時禁食，但忍不住偷食蒸水蛋，覺得打扮超性感不需事前問另一半，雖然未有男友，希望將來獲另一半信任工作需要。同樣低胸現身的陳楨怡因天氣變冷也要拿暖包，但未為着晚裝節食，更食海南雞飯，平時都有做運動修身，為配合台慶劇《玫瑰戰爭》着紅黑色調。以黑白造型示人的主持梁麗翹，以及身穿粉紅色晚裝、頭戴后冠的應屆港姐季軍李澤欣，同框畫面相當養眼。\n直擊台慶紅地氈現場盛況 Part1：\n 關嘉敏拿到晚裝已開始節食\n低胸露腰的關嘉敏拿到晚裝已開始節食，笑言無情飲水飽，騷長腿的李芷晴也只吃雞胸和灼菜，但演出的衫更性感。談到《東周刊》獨家拍到《女神2》求愛勇者關經翰帶練樂儀返豪宅過夜，關嘉敏表示私下有聯絡他，肯定他單身，據知他是相約一班朋友回家看《女神2》，讚他為人紳士。\n陳瀅和周嘉洛黑白配襯絕現身\n陳瀅和周嘉洛黑白配襯絕現身，陳瀅指是公司安排，多謝大家鍾意二人同行，嘉洛笑言求之不得，緋聞則不了了之，真感情不是今日話題，聽到被指二人合襯，嘉洛即面紅，談到陳瀅生日，他坦言已食幾餐飯但沒單獨約她。陳瀅笑言留意到嘉洛好多廣告，指他過界連美容都拍，令她有少少不舒服，問到有否獲嘉洛送護膚品，嘉洛又面紅指她都有大把護膚品。陳瀅又叮囑嘉洛今晚演出時小心安全。\n周嘉洛為劉穎鏇改名「三分鏇」\n「三分鏇」劉穎鏇笑言聽到周嘉洛為她改的外號也嚇一跳，身旁的張振朗讚她球技犀利，爆她曾入六次三分球是公司籃球隊MVP，搶分搶曝光，打波、演戲、跳舞都好看，今次一班人表演跳舞有想起當年藝訓班。談到惡搞《玫瑰戰爭》片尾曲，振朗笑言自己舉手扮姚子羚，覺得她條眉最有戲，扮到抽離不到變姚子眉，劉穎鏇讚似AI好笑，期待他即場表演，振朗笑言要加騷錢。問到在紅地毯不時以手抽裙的黃婧靈是否瘦了，她表示沒上磅但視覺似獲了5公斤，因最近吃得清淡，不時抽裙因裙面珠片重，驚走光。\n直擊台慶紅地氈現場盛況 Part 2： \n未有車的游嘉欣想抽中車\n郭柏妍和戴祖儀騷長腿，戴祖儀坦言凍到熱情都抵擋不住，讚身邊的游嘉欣修身成功，郭柏妍則自嘲肥，戴祖儀自認有胸肌，想打陰影都難，又指自己多女朋友所以不需男朋友。三人都想中台慶大獎，戴祖儀坦言未中過獎，覺得今年有機會，叫姊妹等等，未有車的游嘉欣想抽中車。\n馬國明再遇「安心事件」主角許志安不尷尬\n高海寧露背和雙肩偕黑馬王子馬國明行紅地毯，馬國明歎從來無抽獎運，多年來連擦膠都未抽中過，只羸過豐胸禮券，若高海寧中獎一定要她請食飯，高海寧則覺得有運曾在草蜢遊戲節目抽中獎金，希望今晚抽中車。馬國明有份參演《難兄難弟》歌舞大讚是經典，曾跟羅嘉良合作《富貴門》，狂NG仍獲對方鼓勵，讚是好前輩會銘記一世，高海寧未同羅嘉良合作但有幸到訪其北京住所讚有品味，多謝對方鼓勵和關心，馬國明爆羅嘉良愛玩音響，一部音響都貴過自己屋企。問到馬國明再遇當年「安心事件」主角許志安，他表示未知在演出環節後會否留低睇騷，等公司安排，坦言知安仔壓軸表演，也知大家想法，但不尷尬，多年前的事已過去，今日大家一齊幫TVB慶生，絕對不尷尬。\n直擊台慶紅地氈現場盛況 Part 3： \n返回目錄\n回顧去年經典！重溫2025台慶紅地氈最性感吸睛時刻\n在今晚盛典正式揭幕前，不妨先重溫去年的紅地氈經典瞬間！去年無綫58周年台慶紅地氈可謂看點十足，女星們為了搶鏡各出奇謀，多個性感造型至今仍令網民津津樂道，即刻點擊以下圖輯重溫去年的華麗戰衣：\n 「東張女神」奇招突圍：去年「東張女神」集體行紅地氈成為全場焦點，其中黎寬怡以一雙矚目的超大翅膀晚裝搶盡風頭；而陳曉彤更以一襲黑色高衩透視裝上陣，裙擺設計直逼大腿盡頭，若隱若現的視覺效果成功突圍！\n 美魔女高貴性感：陳煒去年以白色深V貼身晚裝現身，珠光閃爍，盡顯優雅高貴的「美魔女」風範。\n 新生代大鬥性感：宋宛穎以入行以來最性感的谷胸透視裝亮相，黃嘉雯則以黑色閃片晚裝露腰開胸，大展美好身段；波波黃婧靈更以白色低胸透視裙騷長腿兼大方展露優美曲線。\n返回目錄\n點擊重溫萬千星輝賀台慶2025紅地氈完整高清圖輯：\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女 鄧凱文澎湃上圍搶鏡 陳自瑤陳煒晒人妻魅力","url":"https://www.stheadline.com/film-drama/3638904/TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女-鄧凱文澎湃上圍搶鏡-陳自瑤陳煒晒人妻魅力","source_display":"星島頭條","published_at":"2026-11-19T20:28:22+08:00","category":"生活","digest":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚在將軍澳電視廣播城隆重揭幕"},{"title":"TVB台慶2026紅地氈丨俞可程避訪問鐵定缺席 六女神雍容華貴 阮嘉敏超暖心保護性感郭珮文","url":"https://www.stheadline.com/film-drama/3638985/TVB台慶2026紅地氈丨俞可程避訪問鐵定缺席-六女神雍容華貴-阮嘉敏超暖心保護性感郭珮文","source_display":"星島頭條","published_at":"2026-11-19T19:30:00+08:00","category":"生活","digest":"《萬千星輝賀台慶2026》於今晚在將軍澳電視廣播城隆重揭幕…"}]},{"id":"c26a9f31276","title":"陳卓賢預告演唱會打破新常規 罕與未合作過隊友小組演出 入圍叱咤七強感激粉絲四出拉票","url":"https://www.stheadline.com/film-drama/3639039/陳卓賢預告演唱會打破新常規-罕與未合作過隊友小組演出-入圍叱咤七強感激粉絲四出拉票","summary":"人氣男團MIRROR成員陳卓賢（Ian）今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質，但仍吸引數十粉絲拿著燈牌到場外應援，十分熱鬧。","summary_short":"人氣男團MIRROR成員陳卓賢（Ian）今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質…","digest":"人氣男團MIRROR成員陳卓賢今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質…","points":["人氣男團MIRROR成員陳卓賢（Ian）今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質…","陳卓賢聖誕與隊友粉絲度過","Ian透露今年聖誕將會與隊友及觀眾一同度過，由平安夜…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:45:16+08:00","size":1,"keywords":[],"body":"人氣男團MIRROR成員陳卓賢（Ian）今晚到銅鑼灣出席鑽飾活動，雖然活動是私人性質，但仍吸引數十粉絲拿著燈牌到場外應援，十分熱鬧。\n陳卓賢聖誕與隊友粉絲度過\nIan透露今年聖誕將會與隊友及觀眾一同度過，由平安夜、聖誕節到Boxing Day均會與粉絲見面，笑言今年絕非Lonely Christmas。對於隊友邱士縉（Stanley）透露會在演唱會中挑戰高難度舞蹈，Ian表示自己亦是「跳舞擔當」，近日已密鑼緊鼓排練了約兩星期，進度相當理想。他更賣關子預告，今次將會打破常規，與過去未曾合作過的隊友進行小組演出，並會互唱對方的歌曲，為觀眾帶來新鮮感。 \n陳卓賢感激粉絲四出拉票\n而Ian亦入圍叱咤「我最喜愛的男歌手」七強，對於一眾粉絲（Hellosss）連日來四出奔走為其拉票，Ian坦言十分感動與感激：「看到她們周圍替我拉票，好不容易，他們這麼辛苦，都是出於愛，很感謝她們。」問及對獎項的信心？Ian表示自己一向抱平常心，強調創作歌曲並非為了獎項，獎項對他而言只是Bonus。此外，Ian將於12月31日及1月1日赴澳門演出，估今年將未能出席叱咤頒獎禮，但他認為即使人不在現場，只要作品獲得肯定便已足夠。\n陳卓賢下周推首張全創作專輯\nIan下周一（23日）推出首張個人全創作專輯，他透露新碟所有歌曲的曲、詞均由他一手包辦，實現了作為唱作歌手擁有個人全創作大碟的夢想。被問到碟中最喜歡哪一首作品？Ian笑言：「很難選擇，每一隻都是「親生仔」，每一首都是別具意義。」但當中既有安慰自己的作品，亦有希望能治癒聽眾及給予力量的歌曲。由於新碟已售罄，連Ian媽媽亦向他查詢能否「加單」留碟，Ian笑指已盡力為身邊親友爭取名額。而新碟推出當日更會舉行簽名會，屆時將透過抽籤形式與購買專輯的支持者近距離見面。\n陳卓賢回應紀念品錯體\n至於早前演唱會紀念品被指出現印製錯字及亂碼問題，Ian回應指自己並不知情，但相信公司得悉後定會即時跟進及作出更改，確保交到歌迷手上的產品完美無瑕。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1a20f7dcc8","title":"萬千星輝賀台慶2026｜MYNT魔音女團露腰唱跳新歌 倪嘉雯爆排足一周 劉佩玥大讚有進步","url":"https://www.stheadline.com/film-drama/3639040/萬千星輝賀台慶2026MYNT魔音女團露腰唱跳新歌-倪嘉雯爆排足一周-劉佩玥大讚有進步","summary":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行，當中由六位TVB小花組成的「魔音女團」MYNT 震撼登場，成為全場焦點！","summary_short":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行…","digest":"《萬千星輝賀台慶2026》於今晚在將軍澳電視城隆重舉行…","points":["《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行…","成員宋宛穎（Sabrina）、倪嘉雯（Carmen）、莊子璇（Hilary）…","六女全晚舞姿整齊、動感十足，為盛典注入滿滿的青春熱血與活力"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:28:41+08:00","size":1,"keywords":[],"body":"《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視城隆重舉行，當中由六位TVB小花組成的「魔音女團」MYNT 震撼登場，成為全場焦點！成員宋宛穎（Sabrina）、倪嘉雯（Carmen）、莊子璇（Hilary）、倪樂琳（Ellyn）、喬美莎（Chelsea）及盧映彤（Skylar）齊齊以型格露腰裝束亮相，合力唱跳第三首全新主打單曲〈Tic Toc〉。六女全晚舞姿整齊、動感十足，為盛典注入滿滿的青春熱血與活力。對於今次台慶跳唱演出，倪嘉雯（Carmen）表示自我感覺良好，並透露為了是次表演足足排練了一星期，連前輩劉佩玥（Moon）遇見她們時亦大讚有進步，希望觀眾能看到她們的蛻變。\n莊子璇倪樂琳預告赴韓集訓\n談到即將出發到韓國展開地獄式集訓，MYNT 成員均顯得相當興奮。被問到有否為嚴寒天氣做好準備，莊子璇（Hilary）笑言已預備了大量暖包，更準備「寓工作於娛樂」；而倪樂琳（Ellyn）則吃貨上身，揚言到當地一定要大牌檔吃烤肉，又大讚韓國便利店的食物非常美味。雖然被取笑今次旅程是「增肥團」，但她們自信地表示不怕變肥，因為當地天氣寒冷加上排練艱苦，燃燒脂肪的速度會非常快。另外，講到台慶若幸運抽中大獎，盧映彤（Skylar）大方笑言會分錢給隊友，每人派一萬元，屆時在韓國集訓時由她請客，展現團員間的超強閨密情！\n相關閱讀：TVB台慶2026丨一文睇清精彩時刻 陳煒領軍性感熱舞 許志安馬國明「安心事件」後首同場","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce172eb7d74","title":"BTS相隔8年全員抵台 4子夜闖六合夜市掃台灣小食 V大展神射手技贏巨型公仔","url":"https://www.stheadline.com/film-drama/3638994/BTS相隔8年全員抵台-4子夜闖六合夜市掃台灣小食-V大展神射手技贏巨型公仔","summary":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲，並定於今晚（19日）、21日及22日假高雄世運主場館舉行3場高雄站演出…","summary_short":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲…","digest":"韓國天團BTS的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完…","points":["韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》…","雖然ARMY（BTS粉絲名稱）已事先發起「勿接機、勿跟車、勿蹲點、勿守酒店」的呼籲…","七子當中，Jin、J-Hope、V和Jungkook等4位成員到達下榻酒店只休息一會兒…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T23:15:08+08:00","size":1,"keywords":[],"body":"韓國天團BTS（防彈少年團）的世界巡迴演唱會《BTS WORLD TOUR ARIRANG》上月完成南美巡演後已回歸亞洲，並定於今晚（19日）、21日及22日假高雄世運主場館舉行3場高雄站演出，BTS七子已於昨日（18日）飛抵高雄。雖然ARMY（BTS粉絲名稱）已事先發起「勿接機、勿跟車、勿蹲點、勿守酒店」的呼籲，但畢竟今次是七子事隔8年再度全體來台的大日子，故此昨日凌晨已有粉絲帶埋摺凳和應援物抵達小港機場守候，最終機場更湧入上千名粉絲來接機。接着SUGA、RM、Jin、J-Hope、Jimin、V及Jungkook於昨午陸續現身，令全體粉絲激動不已。\nJin、J-Hope、V和Jungkook分享小食\n七子當中，Jin、J-Hope、V和Jungkook等4位成員到達下榻酒店只休息一會兒，就「衫都冇換」立即出發到當地著名的六合夜市遊覽。4人在工作人員和保安陪同下，悠閒地行夜市，而且4人中只有Jungkook穿連帽外套戴口罩，其餘3人都是零變裝、坦蕩蕩地走進人擠人的夜市。眾人第一站就是走到賣糍粑和芝士條的攤檔，他們點了一客芝士條，攤檔老闆叮囑他們「小心爆漿啊」，V也親切地用中文回應「好、好、好」。接過那盒芝士條後，4人就急不及待即時用簽子叉起芝士條享用，食得相當滋味！接着4人走到遊戲攤檔，Jin和V先觀察射氣球遊戲，並交談研究半晌，最終由曾服役於韓國陸軍軍事警察特任隊的V首先上陣，曾受過專業射擊訓練的他三兩下就將氣球全射破，盡展神射手架勢，最終贏得豬頭公仔一大個。然後4子走到賣大腸包小腸的攤檔買香腸，不知是否為演出保持最佳狀態，4子只買了一串香腸幾份分，買完香腸他們就打道回酒店，並一邊揮手向現場粉絲講拜拜，一邊坐上接載車輛離去。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6f7308a3b2","title":"跟着戏曲去出海 《戏宇宙（海外季）》开播仪式举办","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734965.shtml","summary":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。","summary_short":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。","digest":"山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办","points":["中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会…","《戏宇宙》自2022年开播以来，以“弘扬戏曲文化、传播中华之美”为初心，从演播室创演秀…","作为四度入选国家广电总局“中华文化广播电视传播工程”的重点IP，该节目第二季斩获“星光奖”…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:39:39+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 高凯)山东卫视《戏宇宙(海外季)》开播仪式日前在北京湖广会馆举办。\n\n　　据了解，《戏宇宙》自2022年开播以来，以“弘扬戏曲文化、传播中华之美”为初心，从演播室创演秀、文旅实景、经典解读到扬帆出海，五季内容完成四次形态跃迁，持续探索传统文化的年轻化表达。作为四度入选国家广电总局“中华文化广播电视传播工程”的重点IP，该节目第二季斩获“星光奖”，第三季跻身年度广电视听精品推荐。\n\n　　今年，《戏宇宙(海外季)》以“跟着戏曲去出海”为核心理念，将舞台从国内剧场搬到马来西亚的街头、海滩、校园与百年戏台，用更贴近海外年轻观众的语言重构戏曲叙事，让戏曲从“圈内叫好”走向“世界听见”。\n\n开播仪式现场。主办方供图\n\n　　山东广播电视台党委副书记、总编辑张桂林当日表示，《戏宇宙(海外季)》不是简单把中国戏曲“带出来”，而是以戏曲为桥，让海外观众透过一段唱腔、一则故事、一档节目，读懂中国人的情感表达、审美追求与精神底色；也借镜头向国内观众展现马来西亚的多元包容，实现“双向奔赴、彼此成就”。\n\n　　中国戏剧家协会分党组副书记、秘书长傅亦轩指出，《戏宇宙》五年来的迭代，是一条从“向内登临”到“向外登临”的路径，经典季回溯戏曲源头、把根讲清楚；海外季则带着名角、乡音与乡情走出国门，从经典文本溯源转向剧种与华人迁徙来路的溯源，在族谱、家书里打捞海外游子的故土记忆。\n\n　　国家广播电视总局广播影视信息网络中心副主任韩肖鹏基于中国视听大数据(CVB)在仪式上分享称，《戏宇宙》前四季正片与口述史节目大屏累计收视人次超3.5亿、总收视时长超9642万小时，各季收视率较前一季平均涨幅超41%，抖音、快手平台主话题播放超23亿次。他表示，五年运营让《戏宇宙》从一档节目成长为有稳定辨识度的文化品牌IP。\n\n节目剧照。主办方供图\n\n　　据介绍，《戏宇宙(海外季)》历时20天深入马来西亚沙巴亚庇、吉隆坡、槟城乔治市三城，把京剧、河北梆子、柳子戏、秦腔、粤剧、潮剧、闽剧、蒲剧等剧种的14位戏曲名家带到异国的土地上，完成全国首档国际戏曲文化交流节目的实地创制。\n\n　　节目中，“荐戏官”曾黎、李依晓、郑业成随团探访。三城展演各有侧重：沙巴站，河北梆子名家王少华、孙娜演绎《大登殿》，蒲剧名家梁静带来《精卫填海》，“洋美猴王”格法以《闹天宫》燃动公开课堂；吉隆坡站，秦腔名家李梅演绎《鬼怨》，彭馨韵带来《天女散花》，柳子戏梅花奖得主尹春媛献上《玩会跳船》《老青天》，青年京剧演员果菁以《卖水》《霸王别姬》展现青春力量；槟城站则将闽剧《荔枝换绛桃》、粤剧《紫钗记》、潮剧《苏六娘》及戏歌《给阿嫲的情书》搬上邱公祠百年戏台与姓氏桥，完成一场跨越山海的文化回访。\n\n节目剧照。主办方供图\n\n　　《戏宇宙(海外季)》突破“演一场”逻辑，搭建起“本土艺术对话、中外联合共创、全媒体长效传播”的传播闭环：在建国中学、英迪国际大学、钟灵独立中学开戏曲公开课，把京剧猴戏、秦腔“慢卧鱼”、粤剧长水袖带进课堂；在丹绒亚路海滩、独立广场、旧关仔角草场做街头汇演，与马来西亚二十四节令鼓、卡达山舞蹈、甘美兰同台。\n\n　　据悉，《戏宇宙(海外季)》将于11月21日起，每周六20:30，在山东卫视以及海内外新媒体平台同步播出。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc9fc2b42ab","title":"国家大剧院与法国波尔多国家歌剧院联合制作歌剧《魔笛》将在京登台","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734958.shtml","summary":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日，国家大剧院与法国波尔多国家歌剧院联合制作的莫扎特歌剧《魔笛》即将登陆国家大剧院戏剧场。","summary_short":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日…","digest":"2026年恰逢莫扎特诞辰270周年，11月24日至29日…","points":["中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年…","该剧此前已于波尔多成功首演，此番亮相北京，将由国家大剧院音乐艺术总监吕嘉执棒…","法国艺术家朱利安·杜瓦尔担纲导演，与中外实力派歌唱家组成的双卡司阵容群星璀璨，联袂献声…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T22:26:41+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 高凯)2026年恰逢莫扎特诞辰270周年，11月24日至29日，国家大剧院与法国波尔多国家歌剧院联合制作的莫扎特歌剧《魔笛》即将登陆国家大剧院戏剧场。\n\n　　该剧此前已于波尔多成功首演，此番亮相北京，将由国家大剧院音乐艺术总监吕嘉执棒，国家大剧院歌剧演员队、国家大剧院合唱团、国家大剧院管弦乐团联袂演绎。法国艺术家朱利安·杜瓦尔担纲导演，与中外实力派歌唱家组成的双卡司阵容群星璀璨，联袂献声，为观众呈现一部兼具欧洲歌剧纯正基因与当代审美表达的全新《魔笛》。\n\n排练现场。刘方摄\n\n　　该版《魔笛》日前举行剧组排练媒体探班活动。中外歌唱家齐聚国家大剧院第一排练厅，为大家带来了第二幕终场大合唱的宏大场面演绎，数十位歌唱演员组成多层次的声部叠加之下，歌声响彻排练厅。第一幕帕米娜与帕帕盖诺、莫诺斯塔托斯的诙谐对手戏，情节轻快、演唱灵动活泼，演员们凭借扎实的唱功与生动的表演，提前让在场媒体感受到了这部中法联合制作歌剧的鲜活魅力。\n\n排练现场。刘方摄\n\n　　国家大剧院与法国波尔多国家歌剧院联合制作歌剧《魔笛》围绕“时尚、梦幻、浪漫”展开。中外顶尖歌唱家双卡司加盟：塔米诺由美国抒情男高音卡梅伦·贝克尔与中国男高音王川分别出演，以纯净的抒情线条塑造王子的成长；帕米娜由瑞士女高音莫伊卡·埃德曼与中国女高音张玫瑰出演，细腻的乐句控制赋予角色柔韧的情感。夜后由希腊花腔女高音达娜埃·孔托拉与法国花腔女高音格洛丽亚·特罗内尔出演，用高超的花腔技巧演绎《复仇的火焰在我心中燃烧》，成为全场的听觉焦点。帕帕盖诺由奥地利男中音拉斐尔·芬格洛斯与中国男中音周正中出演，带来充满喜剧能量的表演；萨拉斯特罗由北马其顿男低音伊戈尔·杜尔洛夫斯基与中国男低音陈佩鑫出演，沉稳声压撑起神殿的庄严。莫诺斯塔托斯由迪特马尔·克施鲍姆与扣京出演，帕帕盖娜由张文沁出演。\n\n　　导演朱利安·杜瓦尔当日介绍，这一版《魔笛》在设计和排演中，努力平衡了莫扎特作品中的童真与深刻情感，演出通过第一幕明亮、第二幕暗黑的舞台设计体现主角经历试炼并成长的过程；服装设计色彩丰富、视觉冲击力强，旨在传递音乐中的喜悦与幽默。\n\n　　据悉，该剧目前排练已进行三周。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5869c3a387","title":"深化國際教育樞紐建設 議員促先完善基礎配套","url":"https://www.stheadline.com/edu-insights/3639023/深化國際教育樞紐建設-議員促先完善基礎配套","summary":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。","summary_short":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。","digest":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設…","points":["立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設…","多位議員呼籲政府先完善本港基礎教育配套，包括宿舍及畢業後的工作安排","教育局副局長施俊輝指，政府會將「一帶一路獎學金」名額提升至200個…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:06:22+08:00","size":1,"keywords":[],"body":"立法會通過兩項教育相關的無約束力議員議案，促請政府深化國際教育樞紐建設、支援北都大學城「政產學研投」協同發展。多位議員呼籲政府先完善本港基礎教育配套，包括宿舍及畢業後的工作安排。教育局副局長施俊輝指，政府會將「一帶一路獎學金」名額提升至200個，以先行先試方式逐步推行「直資擴容」，並持續檢視文憑試與國際標準的銜接。\n「一帶一路獎學金」增至200個\n提出議案之一的選委界議員范凱傑指，全球升學版圖正「洗牌」，香港應善用普通法制度、兩文三語環境及國際化學術體制，吸引更多海內外學生來港升學。\n多名議員呼籲政府擴大招攬學生的範圍，提出修正案的教育界議員鄧飛直言，社會討論國際教育樞紐時忽略基礎教育，強調政府應打通由基礎教育、職業專才教育到高等教育的「全產業鏈」。商界議員嚴剛建議，從國際學校與私立學校開始，研究放寬非本地中小學生來港就讀的簽證安排與監護人要求。\n延伸閱讀︰大學排名屢創新高 蔡若蓮：香港教育優勢難以取代 明年續辦大學校長論壇｜專訪\n選委會議員伍煥杰促請政府加快研究文憑試課程與國際接軌的方案，包括建設更具國際適應性的英文科考試。同屬選委界議員梁美芬，提到特斯拉行政總裁馬斯克的「港人消失論」，認為香港要吸引更多優質人才，提供更多實習和工作機會，「來了（香港）讀書後留住他」。\n施俊輝總結發言時重申，政府繼續支持各大院校主動走出去，而27/28學年起政府會將「一帶一路獎學金」名額，由現時每年150個增至200個，以把握「一帶一路」國家及地區的發展機遇；而直資學校今學年共170名非本地生以自資模式入讀，按年升13%，反映計劃開局良好。對於文憑試的國際認受性，他稱考評局會繼續加深各地教育界對文憑試課程及評核制度的認識，並積極拓展文憑試在內地及海外的認可。\n延伸閱讀︰蔡若蓮爭取大學城百億貸款「加碼」 新田項目最快明年底推 料院校競地不會「大包圍」｜專訪\n創新科技及工業局局長孫東則指，港府重視為大學強化科研成果轉化能力提供有利條件，包括支援大學團隊創立初創企業並將成果商品化的「大學科技初創企業資助計劃」，截至上月已累計向702間初創企業共批出約6.55億元資助。\n本報記者","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c33d32bdd18","title":"譚旻萱認愛黃澤林後過26歲生日 大騷英文語錄轉行文青風？ 遭毒舌網民起底學歷：好Kam","url":"https://www.stheadline.com/film-drama/3638907/譚旻萱認愛黃澤林後過26歲生日-大騷英文語錄轉行文青風-遭毒舌網民起底學歷好Kam","summary":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。","summary_short":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。","digest":"「籃球女神」譚旻萱早前公開與香港「網球一哥」黃澤林（Coleman）的戀情","points":["「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情","日前她迎來認愛後的首個生日，正式邁入26歲","譚旻萱隨後在社交平台上發文，分享多張美照並配上英文感言，不料卻引來部分網民的冷嘲熱諷"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T22:00:00+08:00","size":1,"keywords":[],"body":"「籃球女神」譚旻萱（Mandy）早前公開與香港「網球一哥」黃澤林（Coleman）的戀情。日前她迎來認愛後的首個生日，正式邁入26歲。譚旻萱隨後在社交平台上發文，分享多張美照並配上英文感言，不料卻引來部分網民的冷嘲熱諷。\n譚旻萱頻頻放閃 遠赴外地陪男友參賽\n譚旻萱自公開戀情後不時大方放閃，除了曾晒出「男友視角」的車廂照並寫下「Perfect birthday morning」外，此前更特意陪同男友遠赴外地參賽。近日，她在Instagram分享慶生新相，並在貼文中寫上西班牙文「Vamos」（意指「加油」），被指是隔空為男友打氣。\n相關閱讀：Mandy譚旻萱難忘與黃澤林台北之旅 晒男友視角甜爆 早前隨行陪網球一哥比賽感情升溫\n譚旻萱美照配英文金句\n譚旻萱在每張照片上，配上長短不一的英文感性語錄。例如與友人的合照中，寫下「leave me carrying only the love, the growth, and the quiet moments that made even the hard days beautiful」，而在自己吹蠟燭的獨照上，配文「leave a little light behind」及「26 starts now」，營造知性文青的格調。\n相關閱讀：譚旻萱赴台貼身陪黃澤林比賽 傳缺席周六903籃球賽？ 網民質疑只顧拍拖放棄上位\n網民反應兩極 起底學歷指「行為尷尬」\n然而，這番英文感言卻意外引發網民熱議。有網民認為她的舉動過於做作，甚至將其英文語錄截圖在網絡上瘋傳。更有網民起底其學歷背景，留言調侃：「英文水平：荔景天主教中學band 2中五」、「其實英文不好就不要張張寫英文，很Kam（尷尬）」、「英文版大文豪」、「裝作ABC」等。不過，亦有粉絲力撐她寫得有心思，雙方在網上掀起兩極討論。\n相關閱讀：譚旻萱戀黃澤林惹爭議 1年前訪問揭進取性格 追男仔會主動身體接觸：我係好明顯嘅","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1cb6cfc57b","title":"国家广播电视总局举办电视剧《伟大的长征》创作座谈会","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734944.shtml","summary":"中新网北京11月19日电 (记者 高凯)由国家广播电视总局主办的电视剧《伟大的长征》创作座谈会日前在京举行。","summary_short":"中新网北京11月19日电 (记者 高凯)由国家广播电视总局主办的电视剧《伟大的长征》创作座谈会日前在京举行。","digest":"由国家广播电视总局主办的电视剧《伟大的长征》创作座谈会日前在京举行","points":["中新网北京11月19日电 (记者 高凯)由国家广播电视总局主办的电视剧《伟大的长征》创作座谈…","与会人员围绕《伟大的长征》的创作传播经验、思想价值和现实意义以及做好重大革命题材电视剧创作等…","会议指出，电视剧《伟大的长征》是中宣部统筹指导下…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T21:55:31+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 高凯)由国家广播电视总局主办的电视剧《伟大的长征》创作座谈会日前在京举行。与会人员围绕《伟大的长征》的创作传播经验、思想价值和现实意义以及做好重大革命题材电视剧创作等话题进行了交流和探讨。\n\n　　会议指出，电视剧《伟大的长征》是中宣部统筹指导下，广电总局重点指导和扶持的重大革命题材电视剧，是多方协同、合力共创的精品力作。该剧坚持“以长征精神拍长征”，首次全景式呈现波澜壮阔的伟大长征，真实深刻地展现伟大长征精神，以系统详实的史料、精准细腻的表达、精益求精的创作，实现了长征题材电视剧的多个新突破、达到了新高度，是长征题材的史诗之作。\n\n　　国家广播电视总局电视剧司司长冯胜勇表示，《伟大的长征》是重大题材电视剧创作领导小组工作机制的成功实践；是央地协同、多省联动、联合共创的生动范例；是台网联动、同频共振、壮大主流舆论的鲜活例证。\n\n剧集海报。主办方供图\n\n　　《伟大的长征》之所以打动观众，引起热烈社会反响，其创作全过程所体现出的精品意识与匠心精神被认为至关重要。\n\n　　总编剧陈晋表示，主创在创作中紧紧抓住五个字：其中，“大”即全景式反映1934年1月到1937年1月三年党的历史和国内外大背景；“实”即还原历史本貌，让大历史、大感情有落点，小处见真情；“诗”即人物要有超越困境的精神境界；“思”，就是把思想融入故事；“魂”，就是要为作品立“魂”。\n\n　　导演张永新表示，创作该剧，团队始终怀着最大的克制与敬畏，恪守“大处立格局，小处见真情”的创作理念。立足全局，力求讲好远征之史、理顺转折之路，让观众看到信仰在绝境中的坚守与定力。同时团队也用心捕捉历史褶皱里的微小温热的细节，还原出有血有肉的人。\n\n　　演员于和伟(剧中“毛泽东”饰演者)谈到，塑造历史人物的核心是“一切表演扎根规定情境”，首先要尊重史料，但更关键的是要回到故事文本，回到人物当时所处的环境里去判断。\n\n　　演员曹磊(剧中“周恩来”饰演者)表示，他没有将人物简化为定型英雄符号，而是回到长征历史现场，理解巨大不确定性中的抉择、忍耐与坚持。导演提出温润、犀利四个字，也成为他把握人物精神内核的标尺：温润根植于对战士、对人民的体恤，犀利来自信仰原则上不可退让的立场。\n\n　　演员李乃文(剧中“张国焘”饰演者)表示，剧组专业严谨令他感受最深，每句台词、每个动作、每件道具都考究，提醒演员拍的是真实历史。\n\n座谈会现场。主办方供图\n\n　　中央文史研究馆馆员、文艺评论家仲呈祥认为，《伟大的长征》是新时代重大革命历史题材创作的又一部标志性的、里程碑式的作品，是从高原迈上高峰的佳作。该剧汇聚党史军史专家与电视文艺家强强联合，实现了创作资源最佳配置。\n\n　　国家广播电视总局阅评组专家李京盛指出，《伟大的长征》对重大革命历史题材的创作有四点启示：以大历史观打开中国革命历史叙事视角；以危机叙事突出中国革命的复杂性、艰巨性、残酷性；以对领袖人物的群像塑造突出团结奋斗的力量；以人民视角描写普通革命战士的牺牲与奉献。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c697463190c","title":"天氣｜天文台再下調周五氣溫預測 市區最低約14度","url":"https://news.tvb.com/tc/1207326-天氣天文台再下調周五氣溫預測市區最低約14度","summary":"天文台再下調周五氣溫預測，市區最低約14度。入夜後氣溫明顯轉涼，在尖沙咀不少市民出動冷帽、羽絨等禦寒衣物，受強烈東北季候風及雲雨帶影響，氣溫顯著下降。","summary_short":"天文台再下調周五氣溫預測，市區最低約14度。","digest":"入夜後氣溫明顯轉涼，在尖沙咀不少市民出動冷帽、羽絨等禦寒衣物…","points":["入夜後氣溫明顯轉涼，在尖沙咀不少市民出動冷帽、羽絨等禦寒衣物，受強烈東北季候風及雲雨帶影響…","天文台發出特別天氣提示，指晚上及周五顯著轉涼，周五市區氣溫由初時18度…","新界部分地區及高地寒冷，加上風寒效應，提醒市民注意保暖"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T21:55+08:00","size":1,"keywords":[],"body":"天文台再下調周五氣溫預測，市區最低約14度。\n\n入夜後氣溫明顯轉涼，在尖沙咀不少市民出動冷帽、羽絨等禦寒衣物，受強烈東北季候風及雲雨帶影響，氣溫顯著下降。\n\n天文台發出特別天氣提示，指晚上及周五顯著轉涼，周五市區氣溫由初時18度，進一步下降至稍後約14度，新界再低一兩度。新界部分地區及高地寒冷，加上風寒效應，提醒市民注意保暖。\n\n而隨著覆蓋廣東的雲帶周六轉薄，日夜溫差較大，早上仍然相當清涼，而一股達強風程度的偏東氣流下周初影響華南沿岸，氣溫將稍為回升。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/9697a0f3e4874bc0a647958eb7caff7a/snapshots/2e8bcc74e80e431a8292ff84c2cea3ad-00006.jpg","video":"https://pro-vod-cdn.tvb.com/9697a0f3e4874bc0a647958eb7caff7a/ae27f5281baf477898602a336e4d36f8-feba5f9ad978f0575cfa59d4fedf8e42-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/9697a0f3e4874bc0a647958eb7caff7a/snapshots/2e8bcc74e80e431a8292ff84c2cea3ad-00006.jpg","lang":"zh-Hant"},{"id":"c96b6be8dc7","title":"告別的年代丨邱士縉拍床戲事前向太太備案 自爆冇底線唔介意全裸演出 預告MIRROR舞台跳到斷氣","url":"https://www.stheadline.com/film-drama/3638996/告別的年代丨邱士縉拍床戲事前向太太備案-自爆冇底線唔介意全裸演出-預告MIRROR舞台跳到斷氣","summary":"MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映，MIRROR成員柳應廷（Jer）、李駿傑（Jeremy）、ROVER成員王希晉及卓金樂（Kim）、ZPOT等到場支持…","summary_short":"MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映，MIRROR成員柳應廷（Jer）…","digest":"MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映…","points":["MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映…","邱士縉難忘多倫多首映跨越語言","Stanley表示這部電影帶他走訪了許多地方，並與不同地區的台前幕後團隊合作…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:45:42+08:00","size":1,"keywords":[],"body":"MIRROR成員邱士縉（Stanley）今天出席他主演的電影《告別的年代》首映，MIRROR成員柳應廷（Jer）、李駿傑（Jeremy）、ROVER成員王希晉及卓金樂（Kim）、ZPOT等到場支持，呂爵安（Edan）因身體不適而缺席，但依然吸引不少粉絲到場支持，場面熱鬧。\n邱士縉難忘多倫多首映跨越語言\nStanley表示這部電影帶他走訪了許多地方，並與不同地區的台前幕後團隊合作，令他感到非常開心與感恩。最難忘是在多倫多首映時，儘管現場不少外國觀眾未必完全聽得懂戲中的語言，卻依然能深刻感受到電影所傳遞的情感與訊息。他直言：「印證了電影的魅力在於跨越語言限制，能透過影像與觀眾心靈交流，看到世界各地都有影迷前來支持，讓我既驚喜又感動。」 \n邱士縉一人分飾雙胞胎\nStanley在戲中一人分飾性格截然不同的雙胞胎兄弟，並與女主角宋芸樺有親密戲及床戲。被問及拍攝親密戲前有否向太太李炘頤「備案」及設下底線？Stanley透露：「我事前都有跟她交代，是出於尊重，不過太太本身都係表演者，她會理解演員的工作性質。」至於自身可有設下底線？他表示：「沒有。（全裸也可以？）可以，只要劇情合理、劇本需要就什麼都可以，身體只是演出工具，所以無須過多顧慮。」\n邱士縉嫌自己太大隻\n談及戲中展現身材的鏡頭，Stanley大爆導演笑言「不要浪費」他的身形，所以戲中要求他大騷結實腹肌，但他竟「嫌棄」自己太大隻，Stanley稱：「因為我個角色係60、70年代，不應該這麼大隻，但拍攝時間有限，沒時間減磅。」\n邱士縉對票房抱平常心\n至於可有票房壓力？Stanley坦言文藝題材向來具一定挑戰性，加上電影改編自原著小說且帶有濃厚馬來西亞背景，若觀眾事前看過小說或熟悉當地文化會更有共鳴。不過他對此抱持平常心，認為電影已成功在馬來西亞、台灣及多倫多等地放映並獲得關注，能夠將作品帶給不同地區的觀眾已屬難得。\n邱士縉排練順利\n除了電影宣傳，MIRROR演唱會亦進入倒數階段。Stanley透露目前排練進度比預期順利，時間充裕，甚至偶爾能提早收工休息。被問及今次會否在舞台上大派福利「騷肌」？他大賣關子笑稱雖然無刻意安排，但透露今次個人挑戰難度極高，其中一隻舞步「跳到就嚟斷氣」，屆時觀眾定能看到他全力以赴的表現，他笑：「會見到我跳完個嘴唇變白！」此外，他亦盛讚即將推出的演唱會主題曲節奏明快、極具氣氛，定能炒熱全場。\n邱士縉回應紀念品「錯體」\n至於演唱會紀念品被指出現「錯體」，其中一款襟章更印錯字及出現亂碼，Stanley直言：「聽公司說是AI圖案有少許出錯，不過他們已馬上修改，但我們的實物貨品是沒問題的。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6a7a231bad","title":"TVB台慶2026‧不斷更新｜羅嘉良「奇哥」再現 梁敏巧跑「東張女神盃」身材太好大落後？","url":"https://www.stheadline.com/film-drama/3638563/TVB台慶2026不斷更新羅嘉良奇哥再現-梁敏巧跑東張女神盃身材太好大落後","summary":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！","summary_short":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！","digest":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日盛大舉行","points":["TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行","今年適逢TVB 59周年，台慶以「TVB與你行得更近，走得更遠」為口號，除了一眾視帝…","《星島頭條》為讀者一文睇清今屆台慶的直播詳情、紅地氈時間及全晚焦點環節…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:45:08+08:00","size":1,"keywords":[],"body":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！今年適逢TVB 59周年，台慶以「TVB與你行得更近，走得更遠」為口號，除了一眾視帝、視后及全台逾百藝員傾力演出外，更有久未回巢的羅嘉良重返舞台重溫經典、許志安擔任壓軸表演嘉賓。《星島頭條》為讀者一文睇清今屆台慶的直播詳情、紅地氈時間及全晚焦點環節，今晚將會為大家不斷更新全晚盛況及得獎名單！\n《萬千星輝賀台慶》播放及直播詳情\n《萬千星輝賀台慶》全晚焦點環節【不斷更新】\nTVB台慶2026表演環節介紹\n《萬千星輝賀台慶》播放及直播詳情\n TVB台慶舉辦日期：2026年11月19日（星期四）\n 紅地氈盛況直播時間：下午5時45分起\n 紅地氈直播平台：TVB官方YouTube頻道、娛樂新聞台Facebook及YouTube、東張+、myTV SUPER 33台\n 台慶典禮現場直播時間：晚上7時45分起\n 電視直播頻道：81台翡翠台\n 大會司儀陣容： 汪明荃擔綱領軍，率領陳貝兒、朱凱婷、洪永城、黃翠如、麥美恩、林溥來、陸浩明、鄭衍峰、周奕瑋、林秀怡、孔德賢、潘靜文組成強大主持組合\n相關閱讀：TVB台慶2026紅地氈丨直播資訊懶人包 小生花旦爭妍鬥麗（附去年紅地氈圖輯重溫）返回目錄\n《萬千星輝賀台慶》全晚焦點環節【不斷更新】\n20:15 在首辦的「東張女神盃」400米跑中，一眾「東張女神」同場決戰。梁敏巧在比賽中大落後，即場被大會司儀陸浩明當眾取笑，指她未知是否因為「身形太好（上圍太豐滿）」而產生阻力，以致影響其跑步速度。而壓軸宣布賽果時，汪明荃亦忍不住開口嘲笑，指獲得第5名的梁敏巧與第6名的何沛珈，在後半段慢條斯理地跑步，笑言兩人簡直就像是在「鬥慢」一樣，喜感十足！\n19:56 接着回到錄影廠，視帝羅嘉良「回娘家」與後輩一同表演，重現《難兄難弟》角色「奇哥」經典。\n19:50 一眾TVB小生與花旦，於隧道熱舞，人才濟濟，活力十足。\n19:45 TVB高層參與亮燈儀式，為TVB 59周年台慶揭開序幕。而一眾司儀包括汪明荃與朱凱婷、麥美恩、林溥來、陸浩明、鄭衍峰、周奕瑋、林秀怡、孔德賢等，齊聚拍開場影片，大放笑彈。其中，麥美恩驚喜上演一幕「走出雪櫃」的幽默表演，效果極具視覺衝擊且喜感十足，成為開場的一大亮點！\n返回目錄\nTVB台慶2026表演環節介紹\n1. 汪明荃領軍致敬幕後功臣 盡顯驚人記憶力\n今年台慶其中一個最感人的焦點環節，是以專業與誠意向默默耕耘的幕後英雄致敬。環節由效力TVB達55年、塑造過逾80個經典角色造型的汪明荃（阿姐）領軍，帶領觀眾深入了解梳化服團隊的付出。在致敬片段中，汪明荃展現驚人記憶力，逐一細數梳化服老中青三代同事的名字、專長以及合作過的難忘造型，流露深厚情誼。此外，視帝譚俊彥、視后龔嘉欣、一眾藝人及神秘嘉賓亦會以不同形式向武指、特技人員、攝製隊及舞台設計團隊等致敬。\n2. 羅嘉良相隔23年回娘家 重現1997年《難兄難弟》\n自2003年離巢後，視帝羅嘉良相隔23年再度參與台慶。他將領軍數十位男女藝員，進行大型歌舞環節，並重演1997年經典神劇《難兄難弟》的精彩場面。而台慶的大型歌舞表演亦邀得陳煒、姚子羚、陳敏之、傅嘉莉四大「炫舞女王」聯手開騷，場面浩大。\n相關閱讀：羅嘉良為台慶2026排練 撐張家輝唔做歌星太浪費 讚劇集拍檔張曦雯聰明\n3. 逾80位藝人一鏡到底！隧道Opening震撼曝光\nTVB率先公開了全台逾80名藝人參與拍攝的隧道Opening片段。片段中多個歌舞大場面均採用「一鏡過」（One Take）直落拍攝，極具難度。短短數秒的鏡頭內有大量走位及動作，足見台前幕後的排練心機，屆時吉祥物TVBuddy亦會穿插其中與藝人互動。\n相關閱讀：萬千星輝賀台慶丨劉穎鏇在未通車隧道狂跑 同張振朗劉佩玥企正C位\n4. 《中年好聲音》破天荒合體 譚輝智黃博挑戰Rap跳舞\n人氣急升的《中年好聲音》成員譚輝智與黃博將破天荒首度合作，挑戰集唱歌、跳舞與Rap於一身的貼身歌舞演出，為觀眾帶來極具新鮮感的舞台演出。\n相關閱讀：萬千星輝賀台慶｜譚輝智望與怕醜囡囡父女檔同台 孖黃博台慶跳辣身舞兼Rap歌\n5. 「魔音女團」MYNT 聯乘韓國學院唱跳新歌\n由宋宛穎、倪嘉雯、莊子璇、倪樂琳、喬美莎及盧映彤組成的「魔音女團」MYNT，將會聯同YS韓國偶像學院的名師及尖子Lenna T.、Mia、Soe、Heily Hu及Venus，在台慶舞台上合力唱跳MYNT的第三首全新主打單曲〈Tic Toc〉。\n相關閱讀：萬千星輝賀台慶｜魔音女團首度公開跳唱新歌〈Tic Toc〉 預告月底全員赴韓接受唱跳特訓\n6. 攜手錢家班亡命挑戰！四大小生呈獻極速特技\n張振朗、劉穎鏇、周嘉洛、朱敏瀚將會聯手著名特技團隊「錢家班」，呈獻高難度動作及飛車表演項目「極速狂奔Speed and Stunt」，以驚險刺激的特技演出向一眾幕後特技英雄致敬。\n相關閱讀：朱敏瀚為TVB台慶綵排發生意外 兩米高墮地現驚險一幕 道具疑因支撐力不足突然倒塌\n7. 首辦「東張女神盃」 400米跑決賽誰是「跑女」之王\nTVB台慶2026首度增設體育競技環節「東張女神盃」，進行400米田徑決賽。一眾《東張西望》人氣主持陳庭欣、何沛珈、梁敏巧、李旻芳、黎寬怡及甘詠寧將會全副武裝化身「跑女」，在台慶的大日子同場競技，爭奪首屆女神盃寶座。\n8. 許志安壓軸Medley經典重現\n許志安將擔任壓軸表演嘉賓，為觀眾帶來一連串耳熟能詳的串燒經典Medley，用歌聲掀起全晚高潮。同場亦有競技趣劇《台慶喎！有嘢唔見咗》，實行全晚笑聲不斷。\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c670358b515","title":"纪录片《百年巨匠-秦含章》杀青 为民族工业巨匠立传","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734883.shtml","summary":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。","summary_short":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。","digest":"人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行","points":["中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京…","该片总导演夏蒙表示，在产业一线撑起民族工业的巨匠同样值得铭记","1931年毕业于上海国立劳动大学农学院，随后负笈欧洲研习农学、微生物学与酿造学"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:37:03+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。该片总导演夏蒙表示，在产业一线撑起民族工业的巨匠同样值得铭记。\n\n纪录片《百年巨匠-秦含章》杀青仪式海报。　百年巨匠文化传播有限公司供图\n\n　　秦含章(1908-2019)，生于江苏无锡，是我国食品工业科学家、一代酿酒泰斗。1931年毕业于上海国立劳动大学农学院，随后负笈欧洲研习农学、微生物学与酿造学。1936年学成归国，1950年出任中央人民政府食品工业部参事，1960年创办轻工业部食品发酵工业科学研究所并任所长。著书40余部，《新编酒经》被誉为“中国酒文化第一书”。茅台集团原董事长季克良、二锅头酿造技艺非遗代表性传承人高景炎等行业名家，皆出其门下。\n\n　　中国酒业协会秘书长何勇表示，杀青是一卷胶片的收束，更是一部精神长卷的总结——一位跨越三个世纪、享年112岁的老人，将从历史深处走到亿万观众的眼前。秦含章先生留给我们最珍贵的东西，是把传统当作根、把科学当作魂的精神。\n\n　　中国文学艺术基金会副理事长兼秘书长周冰表示，作为《百年巨匠》纪录片资助方和出品方，基金会的使命就是让文艺之花更加绚烂绽放。《百年巨匠》里的每一位人物都是中国的艺术灵魂。\n\n　　该片总导演夏蒙分享创作理念时说，匠人是把一件事做到极致；而巨匠是在极致之上，拥有格局与担当。秦含章有科学家的严谨，有读书人的风骨，有产业报国的赤诚。他一个人打通了传统酿造和现代科学之间的壁垒，让千年酒文化在现代工业时代站稳脚跟，走向更远的未来。“我们不只有书画文学的巨匠，在产业一线还有撑起民族工业的巨匠，他们同样值得被时代铭记。”\n\n　　据了解，摄制组先后赴北京、山西、无锡、重庆、南京、武汉等地取景，并远赴德国柏林、法国波尔多、比利时等秦含章当年求学与工作之地实地拍摄，还采访了季克良、高景炎、宋书玉等十余位行业专家和亲历见证者。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"政府公布","total":4,"items":[{"id":"c18264b0e15","title":"「見龍在田：赤洲與中國內地恐龍化石展」開幕","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900241.htm","summary":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。","summary_short":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。","digest":"「見龍在田：赤洲與中國內地恐龍化石展」於香港文物探知館舉行開幕典禮","points":["展覽由發展局和中國科學院古脊椎動物與古人類研究所（古脊椎所）合辦…","發展局局長甯漢豪在開幕典禮致辭時表示，赤洲恐龍化石發掘工作在二○二四年十月開展…","亦感謝廣西壯族自治區自然博物館、浙江自然博物院及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T21:48:00+08:00","size":1,"keywords":[],"body":"「見龍在田：赤洲與中國內地恐龍化石展」今日（十一月十九日）於香港文物探知館舉行開幕典禮。展覽由發展局和中國科學院古脊椎動物與古人類研究所（古脊椎所）合辦，展示香港赤洲發現的恐龍化石，揭開本土巨型恐龍的神秘面紗，同時結合粵港澳大灣區其他地方和全國多地的豐富化石寶庫，全面展現中國恐龍世界的演化歷史和生存圖景。\n\n　　發展局局長甯漢豪在開幕典禮致辭時表示，赤洲恐龍化石發掘工作在二○二四年十月開展，隨着清修和研究工作逐步完成，是次展覽不僅標誌着在香港首次發現恐龍化石這難得事情，更要強調這些化石展現恐龍當年的鋒芒、蘊藏的歷史及香港遠古生態環境。她特別感謝古脊椎所在恐龍化石的發掘、清修、研究，以至挑選展品和策展方面，提供了專業的指導及協助，並借出珍貴化石標本作為展品；亦感謝廣西壯族自治區自然博物館、浙江自然博物院及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴藏品。經策展團隊悉心策劃，展覽讓來自不同地方的恐龍化石同場展出對話，說好恐龍故事。\n\n　　古脊椎所所長徐星教授致辭時表示，這次合作是香港古生物研究的重要里程碑。他感謝發展局對聯合研究與科普活動的全力支持，並希望透過是次展覽，讓香港市民了解赤洲恐龍化石的最新研究成果，認識香港恐龍在中國乃至全球恐龍演化歷程中的獨特地位；同時讓公眾近距離接觸古生物學，提升公眾對古生物的興趣和知識。\n\n　　其他展覽開幕典禮的主禮嘉賓包括發展局常任秘書長 （工務）劉俊傑、古物諮詢委員會主席許焯權教授和保育歷史建築諮詢委員會主席蘇彰德教授。\n\n　　展覽共展出66組珍貴展品，既有在香港赤洲出土的全部恐龍骨骼化石，亦有來自粵港澳大灣區其他地方以至內地廣東省以外的白堊紀恐龍化石。來自內地的46組化石中，34組為國家一級重點保護古生物化石。這次來港展覽的化石，大部分都是首次在香港展出。赤洲恐龍化石（當中多件骨骼化石相信來自同一隻「泰坦巨龍形類」恐龍）、擁有完整頭骨的徐氏亞洲暴龍骨骼化石、具有骨質頭冠但沒有上下牙齒的斑嵴龍頭骨化石、體型龐大的諸城暴龍頜骨骼化石、竊蛋龍類恐龍所產的長形蛋化石，以及帶有胚胎的恐龍蛋化石都是這次展覽的亮點。\n\n　　此外，展覽以模型呈現中國恐龍的面貌，深入淺出地解說中國恐龍的演化。為推廣古生物相關知識，香港文物探知館將舉辦一系列公眾講座和多元化的工作坊，讓公眾深入了解古生物化石和古生態。\n\n　　展覽免費入場，詳情如下：\n\n日期：二○二六年十一月二十日至二○二七年五月十二日\n\n開放時間：\n\n星期一至三及星期五早上十時至下午六時；\n\n星期六、日及公眾假期早上十時至晚上七時；\n\n星期四（公眾假期除外）、農曆年初一及二休館\n\n地點：尖沙咀海防道九龍公園香港文物探知館\n\n　　有關展覽、相關活動資料以及精華短片，請瀏覽古蹟辦網頁（www.amo.gov.hk/tc/visitor-centre/exhibitions/heritage-discovery-centre/dinosaur-exhibition/index.html）。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce83107ce70","title":"2026香港資訊及通訊科技獎踏入二十周年 表揚卓越創科成果","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900414.htm","summary":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會頒發全年大獎。","summary_short":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造…","digest":"2026香港資訊及通訊科技獎頒奬典禮今晚舉行…","points":["2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行…","勝出隊伍憑「人工智慧清潔水箱機器人」繼獲得商業方案獎大獎後，再勇奪今年比賽的最高殊榮","財政司司長陳茂波在頒獎典禮致辭時表示：「回顧歷屆得獎作品，足見科技發展一日千里"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T20:10:00+08:00","size":1,"keywords":[],"body":"2026香港資訊及通訊科技獎頒奬典禮今晚（十一月十九日）舉行，財政司司長陳茂波向機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會頒發全年大獎。勝出隊伍憑「人工智慧清潔水箱機器人」繼獲得商業方案獎大獎後，再勇奪今年比賽的最高殊榮。\n\n　　財政司司長陳茂波在頒獎典禮致辭時表示：「回顧歷屆得獎作品，足見科技發展一日千里。科技日新月異，但歷屆得獎者始終有一個共通之處：他們洞悉社會所需，並以創新方法回應需要。」\n\n　　陳茂波指出，人工智能現已廣泛應用，但部分最重要的應用或尚待發掘。他說：「人工智能固然有助我們把現有工作做得更好，但更值得深思的是，它能讓我們以何種嶄新方式行事。今晚不少得獎者正為我們指引方向。他們所展示的，不僅是人工智能的功能，更是人工智能為大眾開創的種種可能。」\n\n　　他指出，政府的角色是為創新者締造有利的發展條件。政府正透過「AI+與產業發展策略委員會」，推動更多產業應用人工智能。興建中的沙嶺數據園區將提升香港的算力；香港人工智能研發院會促進科研成果轉化為實際應用。政府亦致力培育專才，並透過「全民AI」計劃，協助社會各界善用人工智能。\n\n　　香港資訊及通訊科技獎自二○○六年設立以來，一直是本地資訊科技界的年度盛事。獎項今年踏入二十周年，見證着香港資訊及通訊科技業界多年來的創新與發展，並持續表揚在資訊及通訊科技發明及應用方面表現出色的企業和人才，鼓勵業界精益求精，發揮創意，推動創新科技發展，並積極開拓內地及海外市場。\n\n　　這項年度盛事由數字政策辦公室舉辦，並在八個籌辦機構、督導委員會、標準保證小組委員會、最終評審委員會、市場推廣小組委員會、各評審和支持機構及業界組織的共同支持下順利舉行。最終評審委員會主席、香港浸會大學校長衞炳江教授衷心祝賀所有得獎者，並對本屆參賽者和得獎者所展現的才華、熱誠及投入深感鼓舞。\n\n　　衞炳江教授說：「各位得獎者憑藉深厚的專業知識、嚴謹的研發精神和出色的執行能力脫穎而出，實至名歸。他們的成就彰顯香港資訊及通訊科技業蓬勃發展；而這份蓬勃活力，正有賴業界一眾從業員、科研人員、創業者及專業團隊多年來的努力、投入和貢獻。他們持續把創新意念轉化為具實際效益的方案，進一步印證香港作為國際創新科技中心的實力與潛力。」\n\n　　創新科技及工業局局長孫東教授在頒獎典禮上頒發獎座予八個獎項類別的大獎得主，嘉許他們的傑出表現。各大獎得主為：\n\n 獎項類別\n\n （籌辦機構）\n 大獎得主\n\n （作品名稱）\n\n 數碼娛樂獎\n\n （香港數碼娛樂協會）\n 極專注有限公司 \n\n （QuestXR結合AI的XR遊戲創作平台）\n\n 金融科技獎\n\n （香港銀行學會）\n 亞丁金融控股有限公司\n\n （亞丁場外資產電子化交易平台）\n\n 資訊科技初創企業獎\n\n （香港無線科技商會）\n 炫幻視界\n\n （智匯：危機應變智能體）\n\n 商業方案獎 \n\n （香港電腦學會）\n 機電工程署／建築署／房屋署／香港智能建造研發中心／香港房屋協會\n\n （人工智慧清潔水箱機器人）\n\n 智慧生活獎\n\n （香港資訊科技商會）\n 鋒視有限公司\n\n （面具師® — 具身智能神經康復系統）\n\n 智慧出行獎\n\n （香港貨品編碼協會）\n 港鐵公司\n\n （無人機隧道巡檢系統）\n\n 智慧市民獎\n\n （香港社會服務聯會）\n 健聲科技有限公司\n\n （聲語同行）\n\n 學生創新獎\n\n （香港創科發展協會）\n 香港科技大學（李思晉／黎卓寧／梁晶晶／吳卓庭）／香港中文大學（陳顥邦）\n\n （Syntrak）\n\n　　得獎者及比賽的詳細資料已上載香港資訊及通訊科技獎網站（www.hkictawards.hk）。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0698d4af4a","title":"發展局局長出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮致辭","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900572.htm","summary":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）、許教授（古物諮詢委員會主席許焯權教授）、蘇教授（保育歷史建築諮詢委員會主…","summary_short":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）…","digest":"赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：  尊敬的徐所長（中國科學院古脊椎動物…","points":["尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）…","時間過得很快，兩年前我們公布香港首次發現恐龍化石，都是在這裏公布，當時全城雀躍哄動","發展局接着與中國科學院古脊椎動物與古人類研究所（古脊椎所）簽署《框架協議》（《關於深化地層古…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T19:02:00+08:00","size":1,"keywords":[],"body":"以下是發展局局長甯漢豪今日（十一月十九日）出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮的致辭全文：\n\n尊敬的徐所長（中國科學院古脊椎動物與古人類研究所所長徐星）、許教授（古物諮詢委員會主席許焯權教授）、蘇教授（保育歷史建築諮詢委員會主席蘇彰德教授）、各位嘉賓、各位朋友：\n\n　　大家好。首先歡迎各位出席「見龍在田：赤洲與中國內地恐龍化石展」開幕典禮。\n\n　　時間過得很快，兩年前我們公布香港首次發現恐龍化石，都是在這裏公布，當時全城雀躍哄動。發展局接着與中國科學院古脊椎動物與古人類研究所（古脊椎所）簽署《框架協議》（《關於深化地層古生物及史前時期遺址領域交流與合作的框架協議》），開展緊密合作，馬上進行赤洲恐龍化石的發掘、清修和研究工作。\n\n　　赤洲恐龍化石發掘工作在二○二四年十月開展。當時赤洲一帶風浪極大，加上化石岩層位於海邊斜坡上，發掘期間還遇上颱風及不穩定天氣，為發掘和田野研究工作帶來極大挑戰。發掘完成後，化石清修工作馬上展開，經過專家兩年的努力，多件恐龍化石標本才逐漸顯露其真正容貌；接着由恐龍專家進行深入研究工作。經古脊椎所專家鑑定，赤洲出土的多件恐龍骨骼化石，很可能來自同一隻屬於「泰坦巨龍形類」的恐龍。\n\n　　隨着清修和研究工作逐步完成，我們籌備了這個展覽。展覽的名稱為「見龍在田」，其實亦有其故事。「見龍在田」是出自《易經》一個卦象，其直接意思就是發現一隻神秘的龍離開了潛伏之地，現身在田野大地，顯露其鋒芒。其實與今次展覽非常貼切，我們在赤洲有神秘的恐龍，被發現並展現在大地上顯露其鋒芒。今次這個展覽不單標誌着在香港首次發現恐龍化石這難得的事情，更是要強調這些化石展現給大家看牠們當年的鋒芒、蘊藏的歷史，展現香港遠古生態環境。\n\n　　展覽以赤洲恐龍為切入點，公布今次研究工作的階段性成果，包括從合共31塊含有化石的岩石標本清修出來的恐龍骨骼化石，剛才我提到應該來自同一隻恐龍，而其實專家還認為它們都是來自該恐龍身上的某一個部位，究竟是哪個部位，我相信大家看完展覽後便會清楚。這次展覽也展示國家在恐龍研究方面的成就，並且匯聚了來自內地四家博物館及研究機構共54組展品，其中化石有46組，當中多達七成是國家一級重點保護古生物化石，絕大部分都是首次在港展出，所以非常珍貴。為了配合展覽和推廣古生物，特別是恐龍的知識，策展團隊特別安排一系列的公眾講座和多元有趣的工作坊等教育活動，讓公眾享受古生物化石的樂趣。\n\n　　我要特別感謝古脊椎所，他們在恐龍化石的發掘、清修、研究，以至挑選展品和策展方面，提供了專業的指導及協助，並借出珍貴化石標本作為展品。我要特別感謝來自廣西壯族自治區自然博物館、浙江自然博物院，以及山東諸城市恐龍文化研究中心協辦展覽及借出珍貴藏品。我亦要感謝特區政府的漁農自然護理署，協助採集化石的工作，亦感謝發展局轄下古蹟辦（古物古蹟辦事處）的團隊及古脊椎所團隊一起充滿熱情地參與鑑定和保護化石。經策展團隊悉心策劃，我們促成了這次「見龍在田」展覽，而其突出之處，就是大家不單看到赤洲的恐龍化石，亦可以看到來自內地不同地方的恐龍化石。我們試想像，一億多年前不同的恐龍在今次的展覽中，大家在這裏對話，一起跟我們說恐龍的故事。\n\n　　我誠邀市民和遊客把握這個難得機會，一同探索香港首次出土的恐龍化石，感受遠古自然歷史的奧妙，開啓一場嶄新的古生物探索之旅。\n\n　　祝願這個展覽圓滿成功，祝願大家有一個豐富的體驗。謝謝各位！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c800a7fae07","title":"​進口蟹樣本鎘含量超出法例標準","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900542.htm","summary":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。","summary_short":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。","digest":"食物環境衞生署食物安全中心公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準","points":["食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布…","中心發言人說：「中心透過恆常食物監測計劃，從進口層面檢取上述蟹樣本作檢測…","發言人續說：「長期攝入過量的鎘可影響腎功能"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T18:45:00+08:00","size":1,"keywords":[],"body":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）公布，一個菲律賓進口蟹樣本被檢出金屬雜質鎘含量超出法例標準。中心正跟進事件。 \n\n　　中心發言人說：「中心透過恆常食物監測計劃，從進口層面檢取上述蟹樣本作檢測，結果顯示鎘含量為百萬分之五點六，超出法例上限的百萬分之二。受影響批次產品沒有流出市面。」 \n\n　　發言人續說：「長期攝入過量的鎘可影響腎功能。中心已知會涉事進口商上述違規情況。如有足夠證據，中心會提出檢控。」 \n\n　　根據《食物攙雜（金屬雜質含量）規例》（第132V章），任何人如售賣金屬雜質濃度高於法定上限水平的食物，即屬違法。違例者一經定罪，最高可處罰款五萬元及監禁六個月。 \n\n　　中心會知會菲律賓當局及業界，並會繼續跟進事件和採取適當行動。調查仍然繼續。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":16,"items":[{"id":"c3533ef4951","title":"西甲｜畢爾包地頭惡 淨勝波膽穩開","url":"https://www.stheadline.com/football-betting/3639044/西甲畢爾包地頭惡-淨勝波膽穩開","summary":"畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手，氣勢如虹。","summary_short":"畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手，氣勢如虹。","digest":"畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手…","points":["畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手，氣勢如虹","今仗迎戰反擊力極弱的愛斯賓奴，主隊憑藉鐵人防中謝蘭拿巴列拿近期展現的獵犬式逼搶與強悍攔截…","在教練泰錫調教下，畢爾包聯賽11戰僅失11球，近3輪更錄得2勝1和佳績，包括主場4…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T08:00:50+08:00","size":1,"keywords":[],"body":"畢爾包近期走勢凌厲，各賽近11仗僅1負，加上主場近5戰3勝2和不敗兼3度零封對手，氣勢如虹。今仗迎戰反擊力極弱的愛斯賓奴，主隊憑藉鐵人防中謝蘭拿巴列拿近期展現的獵犬式逼搶與強悍攔截，勢必封死客軍攻勢，穩奪3分兼零封對手，推介波膽1:0及2:0。\n在教練泰錫調教下，畢爾包聯賽11戰僅失11球，近3輪更錄得2勝1和佳績，包括主場4:0大炒基達菲及在巴斯克打吡中力克皇蘇，攻守極具統治力。球隊表現改善的關鍵，在於23歲青訓防中謝蘭拿巴列拿異軍突起。這名被西媒譽為「獵犬」的鐵人今季已交出21次成功搶斷及16次攔截，攔截榜更一度高居西甲次席；早前3:0大勝馬體會一役，他全場狂奔12.89公里兼末段獻助攻，地面對抗勝率亦達58.7%。泰錫盛讚其跑動覆蓋與戰術紀律，以他為核心的中場屏障，令主隊防線固若金湯。\n愛斯賓奴不時送罰球\n相反，愛斯賓奴近7戰4負，換帥後雖靠死守兩戰不失，惟中前場創造力極弱，聯賽已連續4場半場悶和0:0；加上全季累積39面黃牌冠絕西甲，犯規過多兼攻力疲軟，今仗作客難逃一敗亦難望破蛋。馬高\n畢爾包 VS 愛斯賓奴\nNow 632台周六凌晨4:00直播\n推介：波膽1:0 & 2:0","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c180b998c96","title":"起床后这4件事易引发心梗，冬天尤其别做","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735004.shtml","summary":"今天是“中国心梗救治日”  心血管的这些风险，你留意过吗？","summary_short":"今天是“中国心梗救治日”  心血管的这些风险，你留意过吗？","digest":"今天是“中国心梗救治日”  心血管的这些风险，你留意过吗","points":["心血管的这些风险，你留意过吗","冬季是中老年人心血管疾病的高发季","当人在屏气排便时，各个器官的肌肉都在用力收缩，腹部肌肉也一样，导致腹压增高…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T07:46:01+08:00","size":1,"keywords":[],"body":"今天是“中国心梗救治日”\n\n心血管的这些风险，你留意过吗？\n\n冬季是中老年人心血管疾病的高发季\n\n晨起避免几个容易伤心脏的习惯\r\n\n起床过猛\n\n排便用力\n\n过早晨练\n\n慢性病患者自行减药\n\n其实心脏养护要贯穿一生\n\n不同年龄段\n\n风险隐患和护心重点各不相同\n\n早筛查、早管理，才能长期守护心脏健康\n\n接下来\n\n就让中国科学院院士\n\n浙江大学医学院附属第二医院 院长\n\n心脏中心主任医师 王建安\n\n带我们一起了解！\n\n01 冬季护心注意：早起“4不做”\n\n　　1.早上起床不要过猛\n\n　　人在睡觉时，大脑皮质处于休眠、抑制状态，各项生理功能维持着低速运转，代谢水平降低、心跳减慢、血压下降……刚睡醒时，这种“睡眠惯性”还会维持一小会儿，如果此时立刻起床，容易引起大脑供血不足，可能会引发中风、猝死等意外。\n\n　　正确做法：晨起遵循“躺30秒—坐30秒—站30秒”的节奏，避免体位骤变引发脑供血不足、摔倒。\n\n　　2.晨练不赶早\n\n　　冬季早上天气寒冷，室内外温差大，如果此时再进行运动，心肌供氧量增加，心脏负担就会加重，对于老年人来说，容易出现供氧不足、心脏缺血的情况，严重时可能会诱发心肌梗死。\n\n　　正确做法：等日出后气温回升再外出，做好头颈部保暖；避免大汗后受凉，防止血管剧烈收缩诱发心血管事件。\n\n　　冬季晨练要做好保暖工作，运动强度不宜过大，运动前要充分热身。走路、太极拳、八段锦等都是较好选择。\n\n　　注意：冠心病患者早晨不建议外出运动。\n\n　　3.排便不要过于用力\n\n　　对于老年人来说，用力排便是大忌。当人在屏气排便时，各个器官的肌肉都在用力收缩，腹部肌肉也一样，导致腹压增高，心脏排血阻力增大、血压升高和心肌耗氧量增加，从而可能会导致心肌缺血、心绞痛或严重心律失常，引发心肌梗死，严重可致死亡。\n\n　　正确做法：排便时应集中注意力，但不要过于用力，专心排便，建议每次排便时间不超过10分钟。\n\n　　4.慢性病患者，不要擅自减药量\n\n　　规律监测用药：每日固定时间测量血压并记录，作为医生调药的依据；寒冷季节心血管事件高发，需遵医嘱按时服药，不要擅自减量。\n\n02 全年龄段护心指南，每个阶段重点不同\n\n　　老年期：不是老了就该喘、该累、该肿\n\n　　很多老年人将活动后气喘、疲劳、下肢水肿归为衰老的正常表现，实则可能是心脏疾病的信号。\n\n　　3类症状需警惕\n\n　　气喘：运动耐量明显下降，比如之前爬5楼无碍，现在爬2~3楼就胸闷憋气，需排查冠心病心肌缺血；平地活动也喘、夜间平卧加重，需警惕舒张性心衰。\n\n　　疲劳：血压控制不佳、心功能下降、帕金森病等都可能引发，症状持续加重时需就医鉴别。\n\n　　水肿：可能是降压药副作用、静脉瓣功能减退，也可能提示瓣膜病、心衰、低蛋白血症、房颤等问题；若水肿进行性加重、伴随胸闷气喘，需及时就诊。\n\n　　中年期：延缓心脏老化的关键期\n\n　　中年是心血管防控的承上启下阶段，此时干预可显著降低老年发病风险，甚至有助于逆转早期血管损伤，直接决定晚年的健康质量。\n\n　　1. 理性看待血管斑块\n\n　　动脉粥样硬化是随年龄增长的自然过程，查体发现轻度斑块不必过度恐慌，它更像一个健康预警：提示你需要严格管理生活方式与危险因素。\n\n　　斑块进展速度可干预，戒烟限酒、控制体重、稳定血脂血压，能大幅延缓其发展，降低破裂风险。\n\n　　2. 核心防控要点\n\n　　全面管理指标：体重、腰围、血压、血糖、低密度脂蛋白胆固醇需同步控制，体重下降往往能同步改善血压、血脂、血糖等多项指标。\n\n　　正确看待长期用药：降压、降糖、他汀类降脂药等慢性病用药，有长期循证研究支持，获益明确，不良反应大多可控。不要因“依赖药物”的顾虑擅自停药，指标长期稳定带来的低心梗、低中风风险，才是用药的核心价值。\n\n　　青年人：别让隐患在年轻时埋下\n\n　　青年心梗看似突发，实则是危险因素长期叠加的结果。\n\n　　1. 青年心梗更凶险\n\n　　年轻人的血管斑块通常体积不大，但稳定性差，一旦突然破裂，会迅速形成血栓完全堵塞血管。由于病程短、没有形成侧支循环代偿，心肌坏死进展更快，对远期心功能影响相对更大。\n\n　　超重肥胖、三高、长期吸烟、熬夜、重油重糖饮食、久坐不动，是青年心梗较为常见的诱因。\n\n　　2. 常见不适的鉴别\n\n　　一过性针刺样痛、位置不固定、安静时明显、活动后反而缓解：大多与熬夜、焦虑、神经调节紊乱相关，即心脏神经官能症，并非器质性心脏病。\n\n　　心跳“漏一拍”：多为早搏，绝大多数是功能性的，与作息、情绪相关；若每日频发、伴随胸闷头晕，或继发于心肌炎、心肌缺血，则需就医评估。\n\n　　养护建议\n\n　　避免2个极端：既不能仗着年轻透支身体、放任血压血脂异常不管；也不必因偶发不适过度焦虑。\n\n　　症状持续时可完善心电图、24小时动态心电图检查；若活动后出现胸闷胸痛、休息后不缓解，需立即就诊。\n\n　　儿童青少年：隐匿风险早筛查\n\n　　儿童的心脏问题症状常不典型，容易被当作普通感冒、体虚忽略，需重点关注2类疾病：\n\n　　1. 先天性心脏病\n\n　　重症先心病患者出生后就可能出现口唇发绀等明显表现，但轻症如房间隔缺损、室间隔缺损，早期可能毫无症状。\n\n　　建议新生儿常规做心脏超声筛查，3岁左右复查；部分小缺损可随生长自行闭合，未闭合者大多可通过介入封堵等微创方式治疗，无需一律开胸手术。\n\n　　2. 暴发性心肌炎\n\n　　多继发于感冒、病毒性腹泻之后，病毒侵袭心肌并引发免疫损伤，病情进展迅猛，严重时可导致心衰、猝死。\n\n　　预警信号：体温恢复正常后，孩子仍持续精神萎靡、乏力懒动、活动后气急，状态与病前差异明显，不要简单归为“病后体虚”，需及时就医排查。\n\n03 心梗救治，记住2个“120”\n\n　　每年11月20日是中国心梗救治日，心梗救治的核心原则可总结为2个“120”：\n\n　　第一时间拨打120：出现持续不缓解的胸痛、胸闷，伴随大汗、濒死感，不要自行驾车就医，立即拨打120。急救车配备除颤、心肺复苏设备，可在转运途中开展急救，大幅提升存活率。\n\n　　黄金救治120分钟：血管堵塞后2小时内开通，心肌损伤最小，对日后心功能影响也最低；拖延越久，心肌坏死范围越大，越容易遗留心衰等后遗症。\n\n冬季养心脏行动指南\n\n　　1.冬季护心注意：早起“4不做”\n\n　　早上起床不要过猛、排便不要过于用力、晨练不要过早、不擅自减药量。\n\n　　2.全年龄段护心指南\n\n　　老年期：气喘、疲劳、水肿，出现这3类症状需警惕。\n\n　　中年期：理性看待斑块、全面管理指标、正确看待长期用药。\n\n　　青年人：青年心梗更凶险。若活动后出现胸闷胸痛、休息后不缓解，需立即就诊。\n\n　　儿童青少年：建议新生儿常规做心脏超声筛查，3岁左右复查。感冒退烧之后，如果孩子状态和之前差别很大，要及时就医排查。\n\n　　3.心梗救治的核心原则可总结为2个“120”\n\n　　第一时间拨打120、黄金救治120分钟。\n\n　　小圈温馨提示：\n\n　　本文为健康科普，不替代专业诊疗。 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c1f0a3807","title":"中環60年補鞋老店 00後女生轉行接班做「鞋醫」| 星島申訴王","url":"https://www.stheadline.com/voice-topics/3638794/中環60年補鞋老店-00後女生轉行接班做鞋醫-星島申訴王","summary":"講求時間累積的傳統手藝。","summary_short":"講求時間累積的傳統手藝。","digest":"講求時間累積的傳統手藝","points":["在手工鞋匠日益減少的年代，26歲00後女生Herman，就選擇接手位於中環…","Herman接受《星島申訴王》記者訪問時表示，希望在科技迅速發展的時代…","年青職人報道：90後港男出位打扮宣傳服飾爆紅 形象設計師活得自我…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:45:00+08:00","size":1,"keywords":[],"body":"講求時間累積的傳統手藝。在手工鞋匠日益減少的年代，26歲00後女生Herman，就選擇接手位於中環、擁有超過60年歷史的「順記鞋家」，更得到創辦人之一的順姨手把手傳授補鞋技藝。\nHerman接受《星島申訴王》記者訪問時表示，希望在科技迅速發展的時代，將這份古老工藝與人情味延續下去。\n年青職人報道：90後港男出位打扮宣傳服飾爆紅 形象設計師活得自我：襯衫是我樂趣 | 星島申訴王\n放棄插畫專業 三代同堂做鞋匠\n「順記鞋家」擁有超過60年歷史，創辦人陳順與太太順姨先後退休，子女無意接班，第二代接手人亦於2025年移民離開香港。在機緣巧合下，Herman的父親接手經營這間鞋店。當時正於大專修讀插畫專業的Herman，因見插畫行業競爭大、難以求職，於是決定隨父親步伐入行成為一名鞋匠。\nHerman表示，與其從事容易被科技取代的工作，倒不如學習一門手藝，既能維持生計，又可以將傳統文化傳承下去。她家中三代均曾從事鞋匠工作，父親和爺爺全力支持她經營鞋店，不時會到店內幫忙招呼客人，Herman爸爸余先生笑言「最緊要係女兒開心！」家人的支持，亦讓她無後顧之憂，建立自己的「修鞋王國」。\n鞋匠日常主要工作，是協助客人修補皮鞋鞋底，行內俗稱為「打掌」，即在皮鞋鞋底黏上膠質或防滑墊，以延長鞋子壽命或磨走過滑的鞋底。過程看似簡單，但實際操作卻甚具難度。Herman解釋，她剛入行時連削鞋墊都無法做到，且手勢不對更易刮損客人的鞋。\n年青職人報道：冷氣師傅健碩靚仔多？90後冷氣公司東主熱爆網絡 分享洗冷氣秘訣\n感激老店創辦人授藝 決心守護「打掌」傳統\n幸好鞋店創辦人順姨（陳太），親自花三個月時間把技藝傾囊相授。順姨曾向她形容：「其實我們做鞋匠好像一個醫生，客人的鞋子破爛就儼如醫院的病人，有病找醫生。」這番說話令Herman印象深刻，決心更努力傳承這份工藝與人情味。\nHerman的手藝逐漸獲得不少客人肯定，多位回頭客均大讚其手藝出色，收費合理，並認為在現今社會找到好的補鞋師傅並不容易。面對愈來愈多傳統行業因年輕人嫌辛苦而面臨失傳，00後的Herman選擇用行動證明年輕一代同樣能夠守護傳統。她形容鞋子就像藝術品，並希望大眾能多多支持這班00後用心承傳的珍貴工藝。\n大家是否認識一些年青人從事特殊工種？歡迎聯絡《星島申訴王》跟進報道。\n年青職人報道：00後不躺平！17歲入行做地盤 儲幾十萬買樓照顧家人","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce0a6156bdb","title":"德甲│小將直搗黃「隆」 拜仁大炒在望","url":"https://www.stheadline.com/football-betting/3639041/德甲小將直搗黃隆-拜仁大炒在望","summary":"德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別。","summary_short":"德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別。","digest":"德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別","points":["德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別","拜仁今季主場攻力極度殘暴，近期的強勢走勢與壓倒性的對賽往績，今仗極大機會是一場單方面的虐殺","中場新星蘭納特卡爾近期踢法愈見成熟，上輪聯賽更建功助球隊力克緬恩斯，狀態大勇"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T07:00:11+08:00","size":1,"keywords":[],"body":"德甲班霸拜仁慕尼黑今晚於安聯球場迎擊弱旅科隆，兩隊級數存在天淵之別。拜仁今季主場攻力極度殘暴，近期的強勢走勢與壓倒性的對賽往績，今仗極大機會是一場單方面的虐殺。中場新星蘭納特卡爾近期踢法愈見成熟，上輪聯賽更建功助球隊力克緬恩斯，狀態大勇。在主帥高柏尼重返場邊督師下，拜仁讓球盤讓足三球仍捧「主勝」。\n拜仁整體級數遠超科隆，今季縱使在中後場有所變動，在德甲仍9戰取得6勝3和，攻入29球僅失9球，場均近3球的火力冠絕德甲。拜仁在安聯主場的威力尤為恐怖，近4次主場狂轟20球，平均每場更高達5球，控球率亦錄得全聯賽最高的66.4%。加上兩隊近22次聯賽交手拜仁取得20勝2和的壓倒性優勢，近6次對碰更是全勝。另一方面，領隊高柏尼病癒回歸，配合王牌哈利卡尼和米高奧利斯在前場領軍進攻，拜仁絕對能輕鬆控制大局，徹底撕裂對手。\n年僅18歲的中場新星蘭納特卡爾今季不但克服傷患重返綠茵場，近期更成為拜仁陣中最具殺傷力的進攻催化劑。趁師兄穆斯亞拿早前養傷，卡爾立即全面取代其進攻中場位置，並完美展現其極低重心與狹窄空間中的盤扭突破天賦，更繼承了標誌性的42號球衣。這名天才橫溢的新星在聯賽僅上陣約320分鐘便攻入2球，上輪更射入奠勝球；即使在歐聯作客面對馬體會的大場面中，卡爾同場為球隊先開紀錄。領隊高柏尼亦盛讚其無懼對抗的大心臟特質。今仗面對防線漏洞百出的科隆，卡爾的中路盤球突破，和禁區的左腳精準命射，都將是拜仁開路搶分的利器。\n科隆近4場不勝\n反觀作客的科隆近況低迷，開季9戰僅得9分排名第15位，近4場聯賽錄得2和2負。而且球隊作客表現差劣，跨季連續17場聯賽作客不勝勝。近期主帥華格拿更備受防線主力缺陣的困擾。面對主場場均射門超過20次的拜仁，科隆脆弱的防線預期在半場便會全面失守。拜仁在天時地利人和下，大勝4球或以上可謂易如反掌。馬高\n拜仁慕尼黑 VS 科隆\nNow 639台周六凌晨3:30直播\n推介：讓球 [-3] 主勝","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c452158b1f8","title":"Grand Theft Auto VI released around world after 13-year wait","url":"https://news.tvb.com/tc/1207334-GrandTheftAutoVIreleasedaroundworldafter13yearwait","summary":"After over a decade in the making and an estimated 1 billion US dollars or more in production costs…","summary_short":"After over a decade in the making and an estimated 1 billion…","digest":"After over a decade in the making and an e…","points":["The crime-themed franchise known for allowing…","An auto-dealer in Arlington is closing his bus…","(Reporter: How long was the wait, 13 years…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T23:30+08:00","size":1,"keywords":[],"body":"After over a decade in the making and an estimated 1 billion US dollars or more in production costs, the \"Grand Theft Auto\" video game has officially launched a new entry in the series and begun its global rollout.\nThe crime-themed franchise known for allowing players to steal cars, engage in shootouts and roam freely through fictional US cities has sold more than 470 million units worldwide.\n\"Grand Theft Auto V\" generated 1 billion dollars in retail sales in only three days after its release in 2013.\nEarlier this month, GTA's co-creator Dave Jones noted players' preference for playing as criminals helped shape the direction of the original game.\nThe new edition, billed as one of the most eagerly awaited entertainment launches in years, unlocks for PlayStation 5 and Microsoft's Xbox Series X and S consoles when the clock struck midnight on Thursday .\nThe rollout with updated graphics has gained rapturous early reviews.\nExcitement spread across the electronics district in Tokyo. Posters have gone up on buildings around the town.\nFrom gaming cafes in India to the inspiration behind the game's \"Vice City\", Miami, one of the last places to get in on the action, fans take time off and even shut down businesses for Rockstar Games' latest installment.\nA crossover promo is turning the NBA's Miami Heat arena into \"Vice City\" as the team hosts the Milwaukee Bucks on a one-time-only court adorned with neon pink and blue.\nIn Dallas, Texas, a GTA player marks the release with a brass knuckle tattoo.\nAlexis Hurtado says, \"I have got a brass knuckle tattoo. I don't think you can see it fully, but its right there.\"\n(Reporter: It's related to what?) Hurtado says, \"The GTA game that's coming out...I played like the San Andreas as a kid. And it's like, it's always stuck with me cause like I got real close with like my older cousin because of it.\"\nAn auto-dealer in Arlington is closing his business on November 19.\nBryan Banuelos says, \"It's a cool game. I'm not the best player out there, but man, it's so fun to play. There's just tons of things to do, so definitely a cool thing to check out.\"\n(Reporter: How long was the wait, 13 years, is that right?) Banuelos says: \"About 13 years, yeah.\"\nHe says he hopes it's worth the wait and looks forward to exploring changes to the familiar streets and surroundings in the open world game.","image":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/snapshots/6e779408ab6546ecb42f4747fe7f32ae-00008.jpg","video":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/3a1b7976b8df408db94b89d210d4bd76-81a0e07ee93ca46b58abab60c6a52bad-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/35448d547ee441fb8a5a28964f8984a4/snapshots/6e779408ab6546ecb42f4747fe7f32ae-000
