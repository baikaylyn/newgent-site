\n謝硯是漕運世家謝氏的嫡子，昔日曾少年成名、恃才傲物。他在一場政敵構陷中雙腿致殘並背負污名，從此表面陰鬱病弱、沉迷藥癮與紈絝生活，實則心思縝密、暗藏鋒芒。\n賴偉明飾謝硯。\n崔景君（何洛洛 飾）\n崔景君 表面溫潤如玉、實則「白切黑」的神醫，他醫術高明且身分神秘。\n何洛洛飾崔景君。\n回到目錄\n《寶珠》5大必看亮點\n1. 代露娃首扛古裝大女主\n代露娃雖然在2020年便在電競青春劇《穿越火線》擔任女一號，並主演過現代甜寵劇《完美的他》，但人氣一直不鹹不淡。而令她人氣急升的代表作，多為是古裝劇的配角，例如《長相思》的阿念以及《白月梵星》的茯苓。《寶珠》是代露娃演藝生涯中第一部以女性角色為絕對核心的「古裝大女主」劇集，勢成其職業生涯的關鍵之作。\n代露娃首擔古裝劇大旗。\n2. 賴偉明首部男主作品\n賴偉明在2022年底正式出道，在多套熱播劇中出演重要配角和男二，累積不少人氣，包括在《大夢歸離》中飾演裴思恆，大晒古裝造型的可塑性、更憑着《驕陽似我》飾演讓人又愛又恨的莊序而人氣急升。他在不同的作品大晒多樣性，直到在《寶珠》才初次挑大樑擔綱男一號，他的表現絕對值得期待。\n賴偉明守得雲開見明月！\n3. 爆笑版「先婚後愛」\n雖然《寶珠》亦是以先婚後愛作為劇集的基調，但二人化身針鋒相對的歡喜冤家，為劇情增添不少趣味！在劇中，謝硯平生最討厭貪財庸俗之人，偏偏遇上凡事講求利益的金寶珠，二人成婚後每天互相試探、鬥嘴不斷，鬧得謝府雞犬不寧。但在相處後，二人敞開心扉，更出現男主角跪地立誓「此生只娶你一人」等高甜名場面，好笑得來又甜蜜。\n二人上演爆笑版先婚後愛。\n4. 兼備宅鬥與翻案\n《寶珠》並不是單純以宅鬥或者復仇為主線，而是兩者兼備。初入謝府的金寶珠面臨親戚虎視眈眈與權貴嘲諷時，以在市井練就的察言觀色與果敢作風見招拆招，充滿爽感。除此之外，劇情除了滿布笑點外亦有懸疑線，男女主角互補，聯手調查漕運舊案並挽救謝家危機。\n劇情設定吸睛。\n5. 幕後陣容不容小覷\n《寶珠》在開播後收穫不少好評，除了是演員的努力，以及高質的劇情外，更離不開優秀的幕後團隊！劇集由曾參與《以家人之名》及《九重紫》的導演郭鋒執導，擅長刻畫細膩的情感流動與家庭張力，總編劇魏菁菁，以及由芒果TV的「大芒計劃」羅盼團隊製作，絕對是誠意之作。\n回到目錄","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3bc74ea049","title":"車Cam直擊丨將軍澳廣場天降垃圾桶 男途人差不足一米險被擊中 未有停步照常離開","url":"https://news.tvb.com/tc/1207424-車Cam直擊丨將軍澳廣場天降垃圾桶男途人差不足一米險被擊中未有停步照常離開","summary":"網上流傳一段車Cam影片，記錄了昨日（19日）下午5時04分在將軍澳發生的一宗驚險高空墮物事件。事發時，車Cam主正駕車駛入將軍澳廣場近停車場入口位置，期間前方突然有一個垃圾桶從天而降，墮落在停車場入口附近。","summary_short":"網上流傳一段車Cam影片，記錄了昨日（19日）下午5時04分在將軍澳發生的一宗驚險高空墮物事件。","digest":"網上流傳一段車Cam影片，記錄了下午5時04分在將軍澳發生的一宗驚險高空墮物事件","points":["網上流傳一段車Cam影片，記錄了昨日（19日）下午5時04分在將軍澳發生的一宗驚險高空墮物事…","事發時，車Cam主正駕車駛入將軍澳廣場近停車場入口位置，期間前方突然有一個垃圾桶從天而降…","湊巧當時正有一名男子在該處經過，與墮下的垃圾桶距離不足一米，險些被直接擊中，場面相當驚險"],"section":"生活","category":"熱話","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T14:33+08:00","size":1,"keywords":[],"body":"網上流傳一段車Cam影片，記錄了昨日（19日）下午5時04分在將軍澳發生的一宗驚險高空墮物事件。事發時，車Cam主正駕車駛入將軍澳廣場近停車場入口位置，期間前方突然有一個垃圾桶從天而降，墮落在停車場入口附近。湊巧當時正有一名男子在該處經過，與墮下的垃圾桶距離不足一米，險些被直接擊中，場面相當驚險；不過該名男途人逃過一劫後並未停下腳步，隨即繼續步行離開現場。\n\n片主事後將車Cam片段上載至社交平台，對為何該處會有垃圾桶從高處墮下大感困惑與震驚，並發文表示：「今日喺TKO Plaza，見到一個從天而降嘅垃圾桶，個男人真係爭唔夠一米就中，咩料嗰度會有個垃圾桶跌落嚟」。","image":"https://pro-vod-cdn.tvb.com/b0e7b21aca624a81b3ce5cf5005cab54/snapshots/e623e730e95147ad9021664406579394-00001.jpg","video":"https://pro-vod-cdn.tvb.com/b0e7b21aca624a81b3ce5cf5005cab54/57128b22a5c34042bea5af99f708a7ed-269372e26505f718223789a3d274f71d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/b0e7b21aca624a81b3ce5cf5005cab54/snapshots/e623e730e95147ad9021664406579394-00001.jpg","lang":"zh-Hant"},{"id":"cde7a04029d","title":"陳庭欣傳暗撻中產燈飾老闆 曾包辦名店燈光打匹克球擦出愛火 傳男方剛離婚曾力追SG成員","url":"https://www.stheadline.com/film-drama/3639259/陳庭欣傳暗撻中產燈飾老闆-曾包辦名店燈光打匹克球擦出愛火-傳男方剛離婚曾力追SG成員","summary":"前港姐冠軍陳庭欣（Toby）在2025年底宣告與相戀8年的富商男友楊振源（Benny）因三觀不合而分手，正式告別「準闊太」生活，外界一直關心陳庭欣的感情生活，今日（20日）有傳陳庭欣終於有新歡…","summary_short":"前港姐冠軍陳庭欣（Toby）在2025年底宣告與相戀8年的富商男友楊振源（Benny）因三觀不合而分手…","digest":"前港姐冠軍陳庭欣在2025年底宣告與相戀8年的富商男友楊振源因三觀不合而分手…","points":["願》，但最後二人未能進一步發展","陳庭欣過往曾有于「百億女友」之稱，但與富商男友楊振源分手後…","重投單身市場的陳庭欣曾獲「金牌媒人」林盛斌（Bob）伸出援手…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:05:37+08:00","size":1,"keywords":[],"body":"前港姐冠軍陳庭欣（Toby）在2025年底宣告與相戀8年的富商男友楊振源（Benny）因三觀不合而分手，正式告別「準闊太」生活，外界一直關心陳庭欣的感情生活，今日（20日）有傳陳庭欣終於有新歡，有傳她與從事電燈生意的Gary於今年4月因打 Pickleball（匹克球）而大速撻著，拍拖至今約半年，但男方在5個月前才離婚回復單身，年初曾力追前女團 Super Girls 成員趙慧珊（Aka），不惜以公司名義贊助趙慧珊舉辦畫展《晃樂。願》，但最後二人未能進一步發展。《星島頭條》曾向陳庭欣了解，暫未有回覆。\n陳庭欣過往曾有于「百億女友」之稱，但與富商男友楊振源分手後，搬離昔日月租高達10萬的沙田九肚山3,000呎愛巢，搬入早年購入位於黃大仙的500多呎單位。重投單身市場的陳庭欣曾獲「金牌媒人」林盛斌（Bob）伸出援手，揚言會為她全力物色及介紹優質新對象。雖然陳庭欣的「新歡」身家不及楊振源家底厚，但據知Gary中產出身，是 KOFFA LIGHTING 的創辦人，曾負責不少名店的燈光設計，在上流圈子相當活躍。\n相關閱讀：39歲陳庭欣傳獲神秘男包場慶生力追 大合照疑揭「金主」身份為謝東閔 二人曖昧回應\n陳庭欣新歡約5個月前完成離婚手續\n回復單身的陳庭欣曾因熱衷打匹克球（Pickleball）被網民質疑「釣金龜」，但未受輿論影響，在不少關於匹克球的活動都見到她的踪影，湊巧Gary近年愛上打 Pickleball，多次以公司名義贊助大小比賽，因而結識了陳庭欣。據悉，二人由球友迅速發展成親密關係，而Gary在4、5個月前才與前妻完成離婚手續，成為真正的「單身男」，有知情人士透露：「Gary同 Toby一樣係 Pickleball 嘅發燒友，佢哋識嘅時候，Gary 都未正式離婚，嗰陣佢哋差唔多晚晚同班朋友一齊打波，不過一齊咗都冇特別講，唔算高調，但大家好快 get 到！」\n陳庭欣笑言現時不心急尋找另一半\n陳庭欣早前曾表示在林盛斌的牽線下，見過其中一位男士，當時她被問到會否想「漁翁撒網」多見幾位新對象慢慢挑選時，陳庭欣笑言現時不心急尋找另一半，一切順其自然，但認為多認識朋友亦無妨，以輕鬆心情迎接下一段更美好的良緣。在今年初陳庭欣曾被拍到與 27 歲《東張西望》主持曾錦燊密會及同場現身馬場，但陳庭欣已澄清對方只是後輩及朋友。在今年9月陳庭欣慶祝39歲生日，被指獲神秘男豪氣包場力追，後來揭發「金主」是相識 15 年的同期好友謝東閔，兩人同屬匹克球波友，純粹朋友請食飯。上月陳庭欣受訪時仍自稱「單身」並否認自己眼角高：「之前有報道亂寫我有緋聞男友，阿 Bob 仲以為係真，專登打嚟問我『係咪要收手？』我即刻叫佢『千祈唔好收手呀！』」\n相關閱讀：陳庭欣告別「10億女友」首過單身39歲生日 群星拱照「東張緋聞男友」曾錦燊貼心慶祝","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2ae34e1e56","title":"78歲名醫蔡堅黃大仙診所正式停診 嘆月租8萬難負荷 拒退休轉戰太子服務基層","url":"https://www.stheadline.com/health-edu/3639229/78歲名醫蔡堅黃大仙診所正式停診-嘆月租8萬難負荷-拒退休轉戰太子服務基層","summary":"香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重。","summary_short":"香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重。","digest":"香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重","points":["香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重","近日有網民發現其黃大仙診所門前張貼手寫「停診告示」，宣布診所已於11月17日正式結束營業","他補充指，加上自己已屆高齡，身體亦有不少毛病，實在難以再同時兼顧兩間診所四處奔波…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:00:42+08:00","size":1,"keywords":[],"body":"香港醫學會前會長、著名腎科專科醫生蔡堅行醫數十載，一直深得街坊敬重。近日有網民發現其黃大仙診所門前張貼手寫「停診告示」，宣布診所已於11月17日正式結束營業。蔡堅醫生其後向傳媒無奈透露「做唔住」真相。\n蔡堅黃大仙診所 服務街坊長達43年無奈停診\n近日有網民於社交平台上載一張攝於黃大仙診所門前的「停診告示」照片，手寫告示中清晰交代了停診緣由，寫明診所在黃大仙「經營咗43年，因租約問題，已經喺11月17日停診」，並貼心提醒一眾舊症病人，日後若有需要覆診或求醫，可轉往其位於太子道西的醫務所繼續跟進。\n現年78歲的蔡堅醫生隨後接受傳媒訪問時坦言，黃大仙舖位租金太貴，每月租金高達8萬元，直言「做唔住」。他補充指，加上自己已屆高齡，身體亦有不少毛病，實在難以再同時兼顧兩間診所四處奔波，因此決定結束黃大仙分店，集中留在屬於自置物業的旺角太子診所繼續看診，承諾不會輕易言休。\n近日有網民於社交平台上載一張攝於黃大仙診所門前的「停診告示」照片，手寫告示中清晰交代了停診緣由，寫明診所在黃大仙「經營咗43年，因租約問題，已經喺11月17日停診」。\n街坊網民留言不捨 讚醫術高明有醫德\n黃大仙診所停診的消息在網上流傳後，隨即掀起街坊集體回憶，大批曾受惠於蔡堅醫生診治的市民紛紛留言表達惋惜與敬意。不少街坊大讚蔡醫生多年來始終如一，紛紛留言讚揚他「醫術高明」。不少網民得悉他「11病纏身」仍堅持應診亦大感心痛，紛紛留言勸慰「年紀大，其實應該好好休息享福了」、「退休啦，仁醫周身病痛」、「蔡醫生 辛苦了，要愛惜自己，工作後要休息呀」。\n蔡堅糖尿纏身日服30粒藥 為食偷食朱古力\nTVB節目《醫生你有病》早前一集訪問前香港醫學會會長蔡堅醫生，77歲的他毫不言休，每日風雨不改在為病人看診。精神不錯的他，坦言自己「周身都係病」，由糖尿病、心臟病、白內障、青光眼，到胃扭轉、前列腺肥大，幾乎由頭到腳都出過事。他笑言自己是「最曳的病人」，寄語市民「病不羞恥」，鼓勵大家坦蕩蕩討論健康問題。\n蔡醫生即場示範用糖尿貼檢查血糖，指數7.7，屬正常範圍。他透露自己有家族糖尿病，40多歲後發病，每日需注射胰島素，並服食多種藥物。「糖尿病、心臟、膽固醇、血壓……一個人老咗，有好多嘢要控制，早晚加埋30粒藥。」\n談到飲食，蔡醫生笑言自己「冇得enjoy食嘢」，是「人生憾事」。他作為醫生，常常勸病人不要吃朱古力，自己卻「偷偷地食，耐唔耐食下」。被問到會否懺悔，他直言：「懺悔，做錯嘢就要懺悔。」蔡堅解釋，正因為自己也是病人，更能明白病人的心情與渴望。\n他坦言，醫生也是常人，一樣會病；他自己由頭到腳病歷一大疊：\n 眼睛：白內障、青光眼，做過白內障手術，現時滴眼藥水控制青光眼。\n 鼻：十幾歲起患鼻竇炎，曾切除鼻竇黏膜。\n 面部：三叉神經痛。\n 心臟：一條血管硬化，做過通波仔手術。\n 胃：胃扭轉，曾半夜嘔血。\n 腸：小腸切除一截，直腸多年前發炎。\n 腎：糖尿影響令腎功能轉差。\n 四肢：手震、腳曾折斷，現時鑲有鐵片固定。\n他更自嘲：「以前生肖屬牛，依家成塊鐵片。」他坦言77歲多數不會換腎，若撐不住便洗腎，若老到不能洗腎便「收工」。但他強調，這些都是都市病，與職業無關。「做醫生坐得多、運動少，醫生都會有呢啲病。」\n逃避檢查險喪命 自嘲「最曳的病人」\n蔡醫生坦言，醫生識得多，反而會挑戰醫囑：「係咪真係需要咁做呢？」結果成為「最曳的病人」。這種「曳」，其實源於過度自信，認為自己可以處理，但有時會失準，他最嚴重的一次，是胃扭轉。\n兩年前，他經常胃酸倒流及嘔吐，一直靠食藥止痛，最終痛到送院。「如果再唔理，係有機會死亡。」他形容痛楚「好似入面有嘢扭住、個胃吞咗上去咁」，情況相當罕見。他承認，多年前已獲港大外科醫生告知需要處理，但他一直逃避。「依家諗返起，係病人常見嘅盲點。」死過翻生後，他戒酒、盡量戒口，但逃避習慣未改。「照腸、照MRI、做微創手術先……有少少逃避。」\n一日去廁所近20次 半夜急召泌尿科醫生\n蔡醫生的前列腺亦出問題。十幾年前，他一日去廁所近20次，日尿夜尿頻密，控制不到，甚至褲濕。起初他自己開前列腺藥服用，拖延很久，直至某晚小便劇痛，半夜致電泌尿外科專科醫生王國田求助。王國田在電話中教他用藥控制，翌日他即到診所，最終接受經尿道前列腺切除手術，將增生組織抽薄，排尿回復暢通。\n蔡堅憶述：「一剎那天堂，一剎那地獄。之前痛不欲生，拔咗尿喉，跟住就屙得好順。」然而，他仍有逃避的習慣。前列腺指數高，需要照MRI，但他至今未照，「我諗都係時候，聽你講去照。」\n病非羞恥 籲市民勿輕視警號\n雖然常逃避檢查，但蔡醫生不怕尷尬，他鼓勵市民坦蕩蕩討論健康問題：「病並唔係一個羞恥嘅嘢。我想解釋俾市民知，醫生都係人，醫生都有病，醫生都需要睇醫生。」\n王國田醫生補充，前列腺問題並非突然出現，而是慢慢走下坡，經歷幾十年。他提醒，男士年輕時小便有力，隨年齡增長會逐漸減弱，「每個人到最後，可能嘅經歷都會同蔡醫生類似。所以千祈唔好笑人，今日笑下，聽日輪到。」他呼籲女士也應關心身邊男士，包括父親及伴侶。\n資料來源：TVB《醫生，你有病？》","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdf1f30c378","title":"專家拆解6大保暖陷阱恐致猝死 只穿厚外套不禦寒 重點保暖3部位","url":"https://www.stheadline.com/health-edu/3523254/專家拆解6大保暖陷阱恐致猝死只穿厚外套不禦寒-重點保暖3部位","summary":"冬天要怎樣保暖？","summary_short":"冬天要怎樣保暖？","digest":"專家拆解6大保暖陷阱恐致猝死 只穿厚外套不禦寒 重點保暖3部位","points":["好多人以為只穿厚外套就可保暖，但原來並不足夠","有醫生指出，冬季期間心肌梗塞、腦中風病例暴增","黃醫生分析，很多人用的「禦寒方式」既不保暖又傷血管，反而會「慢性凍害」身體"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:00:31+08:00","size":1,"keywords":[],"body":"冬天要怎樣保暖？好多人以為只穿厚外套就可保暖，但原來並不足夠！有醫生指出，冬季期間心肌梗塞、腦中風病例暴增；而日常生活中更有6大隱形陷阱，不但無法真正保暖，更可能增加心血管疾病風險，其中洗澡溫差更可能導致浴室猝死風險激增10倍。\n6大禦寒陷阱傷血管 恐致猝死\n重症科醫生黃軒近日在個人Facebook專頁分享，儘管冬天時大家都有保暖，但急症室的心肌梗塞、腦中風、骨折、氣喘、心衰竭等病例卻在寒冷氣溫下飆升。黃醫生分析，很多人用的「禦寒方式」既不保暖又傷血管，反而會「慢性凍害」身體。冬季最危險的6大錯誤習慣：\n【同場加映】天氣轉冷易猝死 醫生教4招保暖 喝2飲品有效\n禦寒陷阱｜1. 靠熱飲暖全身\n 錯誤習慣：很多人以為熱奶茶、熱湯可「瞬間」溫暖身體，讓身體誤以為「夠暖了」。\n 實際危害：熱飲僅刺激口腔溫度，核心體溫回升有限，反令大家誤判體溫而穿不夠，血管收縮更劇烈、壓力荷爾蒙更高，是冬季心肌梗塞的重要因素。\n禦寒陷阱｜2. 穿時尚緊身外套\n 錯誤習慣：很多年輕人冬天愛穿「太緊身、時尚、無保暖功能」的外套，裡面只有一件薄T恤。\n 實際危害：緊身外套易令血流受限，導致外周血管痙攣；研究顯示，寒冷暴露會讓收縮壓上升20-30mmHg，高血壓患者出現心肌梗塞風險激增。\n【同場加映】冬天洗澡後皮膚乾燥痕癢 醫生教4招保濕 潤膚膏選哪種？水溫勿超這溫度！\n禦寒陷阱｜3. 立即沖熱水澡\n 錯誤習慣：低溫天氣下，一到家立即洗熱水澡，是冬天最常見的危險習慣。\n 實際危害：日本研究指，冬季洗澡心血管死亡率是夏季10倍。寒冷氣溫令血管收縮；但洗熱水會令血管瞬間擴張，一冷一熱會引發血壓急速下降，出現洗澡中暈倒、心跳加速、心臟負荷失敗。\n禦寒陷阱｜4. 只穿厚外套、忽略3部位\n 錯誤習慣：只穿厚外套，忽略「人體3大散熱口」的頭、頸、腳，穿再厚也無法有效保暖。\n 實際危害：因為頭部散熱佔人體7-10%，如果頭沒做好保暖，導致腦血管收縮，出現頭痛、注意力下降、血壓升高。\n禦寒陷阱｜5. 暖氣開到最大\n 錯誤習慣：夜間將暖氣開到最大，令室內環境變得又熱又乾。\n 實際危害：\n 呼吸道影響：黏膜乾裂、咳嗽加劇、氣喘發作；乾燥空氣增加呼吸道感染風險。\n 睡眠影響：夜間血壓上升、睡眠品質下降。\n禦寒陷阱｜6. 冬季強硬做運動\n 錯誤習慣：冬天在戶外冷到發抖，如果照舊進行激烈運動不添加衣服，恐讓心臟更吃力。\n 實際危害：冷空氣進入氣道會導致支氣管收縮，越跑越喘、心臟負荷暴升。\n【同場加映】女子用保溫杯泡養生茶 竟炸爆天花板 裝9種飲品恐中毒傷身\n正確保暖6法則 從根本保護心血管\n黃醫生提出了正確保暖6大法則：\n 戴好「帽子＋圍巾＋手套」，比穿厚外套更有效。\n 洗澡前先把浴室暖起來。\n 冬天適合運動的大前提是做足熱身、保暖、循序漸進；走出室外前30秒做「暖身跳動」。\n 穿衣以洋蔥式分層為主，不要靠熱飲硬撐。\n 室內濕度要維持40–60%。\n 有心血管疾病者，冬天不要快步衝出門。\n解構心肌梗塞症狀/併發症\n根據本港醫管局資料，急性心肌梗塞普遍稱為「心臟病發」，是一種危及生命的疾病，通常是由動脈粥樣硬化和冠狀動脈血栓引起的。沒有血液供應的心肌就無法正常運作並開始壞死。\n 典型症狀：心口痛和胸部不適，有時更會延伸到下顎和左臂；冒汗和呼吸困難。\n 非典型症狀，如消化不良和頭暈。\n 有時，心臟驟停亦可能是急性心肌梗塞的首發症狀。\n 併發症：心肌壞死和功能失效，嚴重時會導致心源性休克和急性心臟衰竭。壞死的心肌可導致心律不正或心臟結構破裂而造成的心包填塞、急性二尖瓣倒流或急性心室間膈缺損。所有這些情況都有即時生命危險及增加中風或其他器官衰竭的機會。\n 長期影響：患者心臟受到不同程度的損傷，急性心肌梗塞的倖存者其患上慢性心臟衰竭、心律不正和中風等的風險會增加。\n資料來源：重症科醫生黃軒、醫管局\n延伸閱讀：體溫下降易患慢性病！60歲後必吃4類食物暖身延壽 5招提升體溫\n---","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6070af090d","title":"【呈分試風波】教大賽馬會小學常識重考掀爭議 校方：日後計分測考劃一同日進行","url":"https://www.stheadline.com/ohpama/3639250/呈分試風波教大賽馬會小學常識重考掀爭議-校方日後計分測考劃一同日進行","summary":"香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注，校方昨日（19日）再發通告作進一步交代。","summary_short":"香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注，校方昨日（19日）再發通告作進一步交代。","digest":"香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注…","points":["香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注…","校長張錦欣在通告中證實，11月上旬曾接獲家長反映，個別班別完成有關測驗後…","校方為免影響學生應付第一學段總結性評估的情緒，遂延至評估結束後才公布安排…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T13:42:06+08:00","size":1,"keywords":[],"body":"香港教育大學賽馬會小學近日就小六常識科第二次單元溫習安排重考一事引起關注，校方昨日（19日）再發通告作進一步交代。校長張錦欣在通告中證實，11月上旬曾接獲家長反映，個別班別完成有關測驗後，部分學生之間流傳寫有作答答案的紙張；校方為免影響學生應付第一學段總結性評估的情緒，遂延至評估結束後才公布安排，並宣布日後各級所有計分測考均會安排在同一時段進行。\n單元溫習分日考惹公平疑慮 家長憂增小六生壓力\n據悉，該校小六常識科評估涵蓋兩次單元溫習及一次大考，其中單元溫習共佔呈分試兩成分數。涉事的第二次單元溫習早前按不同班別分日進行，其後網上有地區群組傳出疑有同學傳閱抄有答案的字條，引發家長及外界對考核公平性的討論；亦有不少聲音關注小六生剛完成連日呈分試後再面對重考，擔心進一步加劇學童的溫習負擔與情緒壓力。\n校方證實部分學生傳閱答案紙張 免影響呈分試延後公布\n校方早前於18日發出通告，指鑑於該次單元溫習並非同日進行，決定不計算有關成績並安排重考。校方在昨日（19日）的通告中進一步說明，涉事單元溫習屬於常識科進展性評估的一部分（即平時分），並非總結性評估；校方11月上旬接獲家長反映後已即時跟進了解，因單元溫習未有安排各班同日進行而衍生有關情況，為確保評估公平，遂決定安排第三次常識科單元溫習。\n（圖片來源：受訪者提供）\n至於延至呈分試後才公布決定，校方解釋，當時學生即將應考11月12日至17日舉行的第一學段總結性評估，為免干擾學生備考情緒，因此決定待評估完成後再作公布。\n（圖片來源：受訪者提供）\n日後計分測考劃一同日進行 已辦特別班主任課疏導情緒\n校方強調一向重視測考公平性，為避免同類事件再發生，今後各級所有涉及計分的測考均會安排於同一時段進行，以確保評估機制公平、公正。校方又提到，昨日已為六年級學生安排特別班主任課，提供情緒疏導及輔導支援，照顧學生的身心需要，並就事件可能造成的額外負擔與不便向家長及學生致歉。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c064cbcb1ce","title":"天氣｜寒冷天氣警告生效 正午時分各區氣溫普遍跌至約12度","url":"https://news.tvb.com/tc/1207381-天氣寒冷天氣警告生效正午時分各區氣溫普遍跌至約12度","summary":"寒冷天氣警告生效，正午時分各區氣溫普遍跌至約12度。在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。","summary_short":"寒冷天氣警告生效，正午時分各區氣溫普遍跌至約12度。","digest":"在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步","points":["在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步","天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖","天亮後維港兩岸天色昏暗，早上上班上學時間，不少市民穿了外套及頸巾"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T12:07+08:00","size":1,"keywords":[],"body":"寒冷天氣警告生效，正午時分各區氣溫普遍跌至約12度。\n\n在紅磡大環山海旁，天未光就有市民如常前來游早水，亦有市民跑步。天文台提醒進行戶外活動人士，要留意天氣變化，注意保暖。\n\n天亮後維港兩岸天色昏暗，早上上班上學時間，不少市民穿了外套及頸巾。\n\n天文台指，受強烈東北季候風及一道雲雨帶影響，日間市區氣溫繼續下降，多處地區及高地寒冷。\n\n隨後一兩日氣溫稍為回升。預料另一股東北季候風，會在下周二抵達華南沿岸，下周中期會再度轉涼。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/a659117bddcf42a1a83327b177669813/snapshots/a9165c2793904cf88212f5bfd4802be7-00005.jpg","video":"https://pro-vod-cdn.tvb.com/a659117bddcf42a1a83327b177669813/b04e9b7ff57c42838e407c5d88f5d626-00c0231ae99353914f6d147822a48383-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/a659117bddcf42a1a83327b177669813/snapshots/a9165c2793904cf88212f5bfd4802be7-00005.jpg","lang":"zh-Hant"},{"id":"c9775f8e289","title":"天氣動態圖｜創入秋最凍紀錄 寒潮持續到幾時？ 下周再有冷鋒｜附九天預報","url":"https://news.tvb.com/tc/1207401-天氣動態圖創入秋最凍紀錄寒潮持續到幾時下周再有冷鋒附九天預報","summary":"受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄。天亮後市區氣溫不斷下降，正午時分，本港普遍地區氣溫下降至約12度。","summary_short":"受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄。","digest":"受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度…","points":["受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄","天亮後市區氣溫不斷下降，正午時分，本港普遍地區氣溫下降至約12度","一道廣闊雲帶持續為該區帶來有雨的天氣"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T12:05+08:00","size":1,"keywords":[],"body":"受強烈東北季候風影響，天氣顯著轉涼，天文台清晨錄得最低氣溫15.3度，是今年入秋以來最低紀錄。天亮後市區氣溫不斷下降，正午時分，本港普遍地區氣溫下降至約12度。\n\n周末氣溫會否回升？下星期繼續凍？即睇天氣動態圖了解。\n\n天文台指，一股強烈東北季候風正影響華南。同時，一道廣闊雲帶持續為該區帶來有雨的天氣。受強烈東北季候風影響，明早廣東地區寒冷。隨著覆蓋華南的雲帶在明日稍為轉薄，該區天色短暫好轉。\n\n而一股達強風程度的偏東氣流會在下周初影響華南沿岸，該區雲量增多，氣溫略為回升。預料另一股東北季候風會在下星期二抵達華南沿岸，下周中期該區氣溫再度下降及有幾陣雨。\n\n天文台預料，本港地區下午及今晚天氣轉冷，密雲，有幾陣雨。吹清勁北至東北風，離岸及高地吹強風。展望明早氣溫仍然偏低。隨後一兩日雲量增多，風勢頗大，氣溫稍為回升。下周中期再度下降。\n\n更新時間： 2026年11月20日12時00分","image":"https://pro-vod-cdn.tvb.com/ba10f7a5efd94c57a81779bc1b6adf7d/snapshots/3559e4b3e6dc4ca099dee74c0bb58c3f-00002.jpg","video":"https://pro-vod-cdn.tvb.com/ba10f7a5efd94c57a81779bc1b6adf7d/b6451aed1c344780b89fe98da0fce027-e62c9baaafdb043586211ee1f015e3ae-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/ba10f7a5efd94c57a81779bc1b6adf7d/snapshots/3559e4b3e6dc4ca099dee74c0bb58c3f-00002.jpg","lang":"zh-Hant"},{"id":"c1c3d84ef98","title":"AEON Black Friday開鑼！家電/零食/Häagen-Dazs雪糕低至半價 必搶$189廚具福車/週末任裝放題","url":"https://www.stheadline.com/lifetips/3639201/AEON-Black-Friday開鑼家電零食Häagen-Dazs雪糕低至半價-必搶189廚具福車週末任裝放題","summary":"AEON Black Friday優惠｜AEON（永旺百貨）由即日起舉行「AEON Black Friday Sale」年度大減價，為顧客帶來多項震撼折扣！","summary_short":"AEON Black Friday優惠｜AEON（永旺百貨）由即日起舉行「AEON Black Friday Sale」…","digest":"AEON Black Friday優惠｜AEON由即日起舉行「AEON Black…","points":["AEON Black Friday優惠｜AEON（永旺百貨）由即日起舉行「AEON Blac…","當中最受矚目的包括可以半價入手的 Häagen-Dazs 雪糕、人氣家電及零食","週末更會推出極具話題性的限時放題，讓大家任裝日本車厘茄…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:41:23+08:00","size":1,"keywords":[],"body":"AEON Black Friday優惠｜AEON（永旺百貨）由即日起舉行「AEON Black Friday Sale」年度大減價，為顧客帶來多項震撼折扣！當中最受矚目的包括可以半價入手的 Häagen-Dazs 雪糕、人氣家電及零食。此外，週末更會推出極具話題性的限時放題，讓大家任裝日本車厘茄、無鹽去骨鯖魚及指定 SANRIO 精品；還有超值 $189 廚具福車等著大家，勢必掀起全城搶購熱潮！\nAEON Black Friday優惠 必搶半價氣炸鍋/大拖羅壽司/Häagen-Dazs \nAEON Black Friday僧優惠涵蓋極多家庭必備好物。追求健康烹調的家庭切勿錯過BRAUN空氣炸鍋，無油氣炸功能讓用家輕鬆製作香脆小食，現以半價$499發售。美食方面，肥美甘香的大拖羅三文魚壽司每盒只需$89，而AEON獨家發售的Häagen-Dazs加賀棒焙茶拿鐵雪糕迷你杯更低至$19.5，茶香濃郁，絕對是甜品愛好者的入貨首選。另外，TOPVALU 24吋行李喼亦劈價至$349.5，為準備出國旅遊的人士提供極佳選擇；而新手爸媽亦可鎖定激減至$1,599的GB POCKIT+ ALL-TERRAIN手推車。\n想要一次過以極低價買入多款精選商品，限量福車絕對是必搶目標。售價$399的「美酒福車」（總值$575）齊集三得利角瓶威士忌、白鶴酒造梅酒原酒等頂級佳釀，最適合三五知己在節日聚會中暢飲。而「HÓME CÓORDY廚具福車」只需$189，即包含輕量陶瓷塗層桌上鍋及易潔單柄鍋，實用度滿分，能輕鬆提升下廚體驗。\n週末必玩「限時放題」任裝車厘茄/鯖魚/SANRIO精品\n除了直接的價格折扣，活動更推出極具娛樂性及話題性的「限時放題」。在11月28日（六）及29日（日）的指定時段內，顧客只需使用專用袋或盒，便能以單一價格將日本車厘茄、無鹽去骨鯖魚、巴西雞中翼或指定SANRIO精品任裝至滿，充滿挑戰性又能為日常補給。此外，購買廣告商品滿$300，即可免費到顧客服務台帶走「Black Friday多用途自黏收納布」一個，方便整理家居小物件，換完即止。\nAEON Black Friday 週末限時放題時間表\n 日期 時間 指定任裝商品 11月28日（六） 2pm-3pm 日本車厘茄 11月28日（六） 4pm-5pm 無鹽去骨鯖魚、指定 SANRIO 商品 11月29日（日） 2pm-3pm 巴西雞中翼 11月29日（日） 4pm-5pm 指定 SANRIO 商品 AEON Black Friday 2026\n 活動日期：2026年11月20日（五）至12月6日（日）\n 活動地點：全線AEON、AEON STYLE 或 AEON SUPERMARKET\n 會員限定：購物滿$800或以上送$50電子優惠券（適用於12月7日至17日期間滿$150的交易）\n 備註：部分特價商品如行李喼、壽司等不適用於個別分店，請參閱店內海報說明\n資料來源：AEON Stores Hong Kong\n同場加映：一田日本秋祭大特價低至買1送1！380+款優惠時令食材/零食飲品/日用品 $79.9北海道黑牛/生蠔","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2ad51998a7","title":"聖誕節2026｜寫信給聖誕老人攻略 6大高回信率地址+4招寄信貼士","url":"https://www.stheadline.com/ohpama/3638832/聖誕節2026寫信給聖誕老人攻略-6大高回信率地址4招寄信貼士","summary":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。","summary_short":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。","digest":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人…","points":["聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人…","以下整合6大熱門聖誕老人收信地址、截郵時間及4招實用寄信貼士，家長不妨趁現時盡早陪子女動筆","德國郵政每年都會設立聖誕郵局，由聖誕老人與「聖誕天使」協助回覆世界各地小朋友的來信"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:13+08:00","size":1,"keywords":[],"body":"聖誕節2026．寫信給聖誕老人｜聖誕節臨近，不少小朋友都期待親手寫信或畫畫給聖誕老人，分享今年的生活點滴與節日願望。以下整合6大熱門聖誕老人收信地址、截郵時間及4招實用寄信貼士，家長不妨趁現時盡早陪子女動筆！\n聖誕節2026｜德國郵政\n德國郵政每年都會設立聖誕郵局，由聖誕老人與「聖誕天使」協助回覆世界各地小朋友的來信。根據當地安排，聖誕老人將於2026年11月26日起回覆信件直至平安夜，信封上必須寫清楚寄件人地址以便寄回信件。\n資料圖片\n德國郵政\n收信地址： An den Weihnachtsmann, Weihnachtspostfiliale, 16798 Himmelpfort, Germany\n參考期限： 當地建議截郵日期為2026年12月13日（香港聖誕空郵截郵日為12月8日）\n聖誕節2026｜芬蘭羅瓦涅米聖誕老人總郵局\n位於北極圈羅瓦涅米的聖誕老人村被視為聖誕老人的官方故鄉，由芬蘭郵政運作的聖誕老人總郵局全年收信，每年處理逾50萬封信件。官方會處理來信並不時寄出回覆，但不保證每封信均獲免費回信（另設收費訂購信件服務）。由於國際郵遞需時，建議盡早寄出。\n（圖片來源：Posti網站）\n芬蘭羅瓦涅米聖誕老人總郵局\n收信地址： Santa Claus' Main Post Office, Tähtikuja 1, 96930 Arctic Circle, Finland\n參考期限： 香港聖誕空郵截郵日為12月8日（建議11月下旬前盡早空郵寄出，以提高在聖誕前收信的機會）\n更多詳情：按此\n\n聖誕節2026｜加拿大郵政\n加拿大郵政的聖誕老人回信計劃已有逾40年歷史，每年協助回覆世界各地逾100萬封信件，郵遞區號「H0H 0H0」正是諧音聖誕老人的笑聲。官方表示會回覆所有收到的信件，並按來信語言回覆，從香港寄出只需支付寄往加拿大的國際郵資，回信郵費由當地郵政負責。\n（圖片來源：Canada Post）\n加拿大郵政\n收信地址： Santa Claus, North Pole, H0H 0H0, Canada\n參考期限： 當地建議截郵日期為2026年12月9日（香港聖誕空郵截郵日為12月4日）\n更多詳情：按此了解\n法國郵政「聖誕老人秘書處」（Père Noël）\n法國郵政設有「聖誕老人秘書處」回覆兒童寄給 Père Noël 的信件，只要在信封背面填寫完整回郵地址即可申請回信。\n（AI生成示意圖）\n法國郵政「聖誕老人秘書處」（Père Noël）\n收信地址： Père Noël, 33500 Libourne, France\n參考期限： 香港聖誕空郵截郵日為12月3日\n香港郵政\n除了海外的聖誕老人郵政服務，本地其實亦有傳統的聖誕老人回信安排。一眾郵政人員便會化身聖誕老人小助手，逐一細讀孩子們的來信，並以聖誕老人回信給每位小朋友，讓在香港感受到節日氣氛。\n（圖片來源：政府新聞網圖片）\n香港郵政\n收信地址：香港中環康樂廣場2號香港郵政總局（信封面請註明「聖誕老人收」）\n同場加映：LEGO 聖誕樂仔收集小朋友的聖誕心願 \nThe LEGO Group 以全球企劃 The LEGO® Holiday Workshop 為靈感，邀請全港家庭走進充滿驚喜的節日拼砌世界。於指定時間內「寫信給聖誕樂仔」，填妥心意後寄到指定地址，即可收到聖誕樂仔的專屬回信，更有機會獲得聖誕禮物 。 \n官方圖片\n官方圖片\nLEGO\n活動日期：即日起至2027年1月3日\n參加方法：\n方法1：將信件以平郵方式寄往「Blk H, 12/F., Phase 4, Kwun Tong Ind. Ctr, 436 – 446 Kwun Tong Rd, Kwun Tong, Kln, H.K.」\n方法2：親身前往香港樂高®認證專門店索取專用信紙，寫下給「聖誕樂仔」的說話後，直接投入店內設置的聖誕郵箱即可。\n提高回信機率4個貼士\n（AI生成示意圖）\n1.清楚寫明回郵地址及格式\n在信封背面或左上角寫上孩子的姓名及完整英文回郵地址，最後加上「HONG KONG」，並確保收件人寫上「Santa Claus」或「Père Noël」等稱謂，以免無法寄回。\n2.內容自然簡潔，善用畫畫與貼紙\n信件毋須太長或太正式，可先自我介紹並分享近況或值得高興的事，再寫出願望；年紀較小或愛畫畫的孩子，可畫上聖誕樹、雪人或貼貼紙，增添童真與溫度。\n3.貼足國際郵票及留意截郵日期\n寄往海外前應按信件重量與目的地貼足國際郵票（可向郵局查詢或磅重）。需注意香港郵政的聖誕空郵截郵日只屬信件送抵目的地的參考，並非回信保證日期，預留充足郵遞時間、越早寄出越好。\n4.留意各地回信安排差異\n不同郵局的回信政策不同，部分表示會盡量或全數回覆，部分則不保證每封均獲回覆，家長宜與孩子一同平常心期待驚喜。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb5fa0f647d","title":"Oh!爸媽【聖誕4重賞】｜每週五解鎖神秘禮遇 暖笠笠迎聖誕","url":"https://www.stheadline.com/ohpama/3638585/Oh爸媽聖誕4重賞每週五解鎖神秘禮遇-暖笠笠迎聖誕","summary":"「又到聖誕…又到聖誕…","summary_short":"「又到聖誕…","digest":"「又到聖誕…又到聖誕…」Oh","points":["爸媽搜羅不同驚喜禮遇，玩樂體驗、親子好物應有盡有，與大小朋友共慶佳節","由11月23日開始，連續四星期不定時推出，記得緊貼最新公佈，一齊開心過聖誕","第一重賞(11月23日-11月26日)預告"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T11:00:00+08:00","size":1,"keywords":[],"body":"「又到聖誕…又到聖誕…」Oh!爸媽搜羅不同驚喜禮遇，玩樂體驗、親子好物應有盡有，與大小朋友共慶佳節。由11月23日開始，連續四星期不定時推出，記得緊貼最新公佈，一齊開心過聖誕！\n第一重賞(11月23日-11月26日)預告\n禮遇登記連結: (11月23日中午12時開始不定時發放，大家密切留意Oh!爸媽平台最新公佈)\n第二重賞預告\n11月27日公佈，密切留意！\n\n第三重賞預告\n12月2日公佈，密切留意！\n\n第四重賞預告\n12月9日公佈，密切留意！","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":31,"items":[{"id":"c84bf693351","title":"一年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000551.htm","summary":"下稿代香港金融管理局發出︰  　　香港金融管理局（金管局）以香港特別行政區政府（特區政府）代表身分於今日（十一月二十日）公布…","summary_short":"下稿代香港金融管理局發出︰  　　香港金融管理局（金管局）以香港特別行政區政府（特區政府）代表身分於今日（十一月二十日）…","digest":"一年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標","points":["香港金融管理局（金管局）以香港特別行政區政府（特區政府）代表身分於今日（十一月二十日）公布…","任何投標申請只可透過最新公布名單上的第一市場交易商進行…","投標結果將於金管局網站、香港政府債券網站、彭博（GBHK <GO>）和路孚特（IBPGSBP…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:00:00+08:00","size":2,"keywords":[],"body":"下稿代香港金融管理局發出︰\n\n　　香港金融管理局（金管局）以香港特別行政區政府（特區政府）代表身分於今日（十一月二十日）公布，重開在基礎建設債券計劃下推出的2年期人民幣特區政府機構債券（債券）（發行編號02GB2711001），作一年期債券供投標。該批重開債券將於二○二六年十一月二十六日（星期四）進行投標，並於二○二六年十一月三十日（星期一）交收。\n\n　　透過是次重開債券，將有額外7.5億人民幣的未到期二年期債券（發行編號02GB2711001）供投標。該批債券將於二○二七年十一月十七日期滿，利率為年息1.71厘，每半年派息一次。該批債券於二○二六年十一月二十日的指示價格為100.39，半年化收益率則為1.309%。\n\n　　投標只供於基礎建設債券計劃下委任的第一市場交易商參與。任何投標申請只可透過最新公布名單上的第一市場交易商進行，此名單可從香港政府債券網站www.hkgb.gov.hk下載。每項投標均須以五萬人民幣或其整數倍數為單位。\n\n　　投標結果將於金管局網站、香港政府債券網站、彭博（GBHK <GO>）和路孚特（IBPGSBPINDEX）公布，公布時間預計不遲於投標日的下午三時。\n\n特區政府機構債券投標資料\n\n　　一年期人民幣特區政府機構債券重開投標資料如下：\n\n 發行編號\n :\n 02GB2711001\n\n 股份代號　\n :\n 85089 （HKGB1.71 2711-R）\n\n 投標日期和時間\n :\n 2026年11月26日（星期四）\n\n 上午9時30分至10時30分\n\n 發行和交收日期\n :\n 2026年11月30日（星期一）\n\n 發行總額\n :\n 7.5億人民幣\n\n 年期\n\n 剩餘年期\n :\n\n :\n 1年\n\n 約0.96年\n\n 到期日\n :\n 2027年11月17日（星期三）\n\n 利息\n :\n 年息1.71厘，每半年派息一次\n\n 利息支付日期\n :\n 由發行日至到期日（包括該日）起計每年5月17日及 11月 17日，並按載於香港政府債券網站的基礎建設債券計劃及政府可持續債券計劃機構債券資料備忘錄（資料備忘錄）所述的條款進行調整。\n\n 投標形式\n :\n 競爭性投標\n\n 投標數額\n :\n 每項競爭性投標必須以5萬人民幣或其整數倍數為單位。任何投標申請只可透過最新公布名單上的第一市場交易商進行。\n\n 成功投得債券的人士於債券發行日（2026年11月30日），均須就每5萬人民幣的最低投標額繳付30.45人民幣的累計利息。\n\n （由於四捨五入關係，超過5萬人民幣的投標額需繳付的累計利息，可能與以5萬人民幣最低投標額計算出來的利息數字略有出入）。\n\n 其他詳情\n :\n 請參閱載於香港政府債券網站的資料備忘錄，或向第一市場交易商查詢。\n\n 預期開始在香港聯合交易所有限公司買賣的日期\n :\n 是次投標所得的債券數額可完全與現時在香港聯合交易所上市，股份代號為85089（即發行編號02GB2711001）的政府債券互換。\n\n 募集所得資金的用途\n :\n 債券將在基礎建設債券計劃下的機構部分發行。募集所得的資金將按載於香港政府債券網站的基礎建設債券框架作基建項目投資。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"一年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000551.htm","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:00:00+08:00","category":"","digest":"一年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標"},{"title":"七年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000548.htm","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:00:00+08:00","category":"","digest":"七年期人民幣特區政府機構債券將於十一月二十六日透過重開進行投標"}]},{"id":"c8c1fae3cc4","title":"蚊傳疾病登革熱和基孔肯雅熱的最新情況","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000622.htm","summary":"衞生署衞生防護中心（中心）今日（十一月二十日）公布登革熱和基孔肯雅熱的最新情況。","summary_short":"衞生署衞生防護中心（中心）今日（十一月二十日）公布登革熱和基孔肯雅熱的最新情況。","digest":"衞生署衞生防護中心公布登革熱和基孔肯雅熱的最新情況","points":["衞生署衞生防護中心（中心）今日（十一月二十日）公布登革熱和基孔肯雅熱的最新情況","中心提醒市民不論是身處本港或前往受蚊傳疾病影響的地區，均應採取適當防蚊措施，避免被蚊叮咬…","去年（二○二五年）錄得59宗登革熱個案，全部屬外地傳入"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:45:00+08:00","size":1,"keywords":[],"body":"衞生署衞生防護中心（中心）今日（十一月二十日）公布登革熱和基孔肯雅熱的最新情況。中心提醒市民不論是身處本港或前往受蚊傳疾病影響的地區，均應採取適當防蚊措施，避免被蚊叮咬，以預防感染蚊傳疾病。\n\n登革熱\n\n———\n\n　　由十一月十三日至昨日（十一月十九日），中心錄得兩宗外地傳入的登革熱感染個案，兩名病人於潛伏期內分別到過越南及柬埔寨。\n\n　　本港今年暫時累計錄得42宗登革熱個案，包括40宗外地傳入及兩宗本地感染個案。去年（二○二五年）錄得59宗登革熱個案，全部屬外地傳入。二○二四年共錄得161宗登革熱個案，包括156宗外地傳入及五宗本地感染個案。\n\n　　世界衞生組織（世衞）資料顯示，登革熱的全球發病率在過去20年顯著上升，構成重大公共衞生挑戰。世衞在二○二四年錄得超過1 400萬宗登革熱個案，創歷史新高。去年，全球超過90個國家／地區呈報了超過500萬宗登革熱個案和超過4 000宗相關死亡個案。今年一月至九月，全球共錄得約250萬宗登革熱個案和超過1 500宗相關死亡個案。\n\n　　登革熱在不少鄰近旅遊地點一直普遍流行。今年至今，孟加拉國、柬埔寨、斯里蘭卡及越南已分別錄得超過100 000宗個案；印度尼西亞錄得超過90 000宗個案；馬來西亞錄得超過80 000宗個案；印度錄得超過70 000宗個案；新加坡亦錄得超過3 000宗個案。另外，根據廣東省疾病預防控制局（疾控局）的資料，廣東省今年（截至九月）錄得586宗感染個案，其中155宗於九月錄得。\n\n　　有關香港和鄰近及海外國家及地區的登革熱最新情況，已上載至衞生防護中心的網頁。\n\n基孔肯雅熱\n\n—————\n\n　　由十一月十三日至昨日，中心錄得一宗外地傳入的基孔肯雅熱感染個案，涉及一名71歲男子，他於潛伏期內曾到過中國內地。中心認為病人在外遊期間受到感染，屬輸入個案。病人獲安排入院在無蚊環境下接受治療，現時情況穩定。中心會繼續進行流行病學調查，並已把個案通報中國內地衞生當局。\n\n　　本港今年暫時累計錄得九宗基孔肯雅熱確診個案，包括八宗輸入及一宗本地感染個案。本港去年錄得82宗基孔肯雅熱確診個案中，11宗屬本地個案，其餘全部屬輸入個案。\n\n　　世衞資料顯示，截至今年十月，全球共呈報了363 307宗基孔肯雅熱病例及122宗相關死亡個案。其中，世衞美洲區域和東南亞區域的通報病例佔比最高。另外，根據廣東省疾控局的資料，今年（截至九月）廣東省共錄得1 753宗感染個案，其中1 014宗於九月錄得，大幅高於七月至八月錄得的宗數（171至496宗）。\n\n市民應採取的防預措施\n\n——————————\n\n　　中心提醒市民保持環境衞生，不論是身處本港或前往受蚊傳疾病影響的地區，均應採取適當防蚊措施，避免被蚊叮咬，以預防感染蚊傳疾病。登革熱和基孔肯雅熱等蚊傳疾病在全球多國持續爆發，輸入風險存在，市民外遊前必須注意當地情況，尤其前往東南亞國家。此外，不論是否外遊，市民應使用含避蚊胺或其他有效活性成分的昆蟲驅避劑以防被蚊子叮咬，但使用時應注意以下事項：\n\n 先仔細閱讀標籤說明；\n\n 在進入可能被蚊叮的範圍前使用；\n\n 塗在外露皮膚及衣服；\n\n 孕婦使用避蚊胺的濃度上限是30%，兒童則為10%（如前往蚊傳疾病流行的國家或地區而有機會被蚊叮咬，兩個月或以上的兒童可使用濃度上限為30%的避蚊胺）；\n\n 先塗防曬霜，再塗昆蟲驅避劑；\n\n 遵照標籤說明，只於有需要時重複使用；及\n\n 除了避蚊胺之外，市面上亦有含其他活性成分的昆蟲驅避劑，例如IR3535、埃卡瑞丁（亦稱派卡瑞丁）等。公眾使用任何昆蟲驅避劑時，應遵從產品標籤上的使用說明及注意事項。\n\n​　　食物環境衞生署（食環署）呼籲市民繼續提高警覺及攜手合作，及早於家居及其他環境採取防蚊及滅蚊措施，包括視察家居及附近環境、徹底清除可供蚊子滋生的地方、每周最少一次徹底更換花瓶的水及擦洗內壁並清倒盆栽墊碟的水、妥善棄置空罐和飯盒等容器。此外，食環署亦建議市民和物業管理公司，應保持溝渠暢通及填平凹陷的地面，以防積水，並每周最少一次以鹼性清潔劑擦洗溝渠和排水明渠，除去可能積聚的蚊卵。\n\n　　市民如發現蚊患，應致電1823，亦可參閱以下專題網頁，了解詳情：衞生防護中心及旅遊健康服務基孔肯雅熱專頁、最新旅遊情報、使用昆蟲驅避劑的注意事項、中心Facebook專頁、Instagram帳戶及YouTube頻道，以及食環署防控蚊患專頁。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7e2467f52f","title":"民青局在創業日2026設置大灣區香港青年創新創業基地聯盟展館及舉辦專題研討會支持青年逐夢創業","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000273.htm","summary":"民政及青年事務局（民青局）今日（十一月二十日）在香港貿易發展局創業日2026舉辦專題研討會，並設置大灣區香港青年創新創業基地聯盟（聯盟）展館…","summary_short":"民政及青年事務局（民青局）今日（十一月二十日）在香港貿易發展局創業日2026舉辦專題研討會…","digest":"民政及青年事務局在香港貿易發展局創業日2026舉辦專題研討會…","points":["民政及青年事務局（民青局）今日（十一月二十日）在香港貿易發展局創業日2026舉辦專題研討會…","民青局局長麥美娟為專題研討會致開幕辭時表示，特區政府十分重視青年發展","她指出，《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》強調要開拓青年…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:45:00+08:00","size":1,"keywords":[],"body":"民政及青年事務局（民青局）今日（十一月二十日）在香港貿易發展局創業日2026舉辦專題研討會，並設置大灣區香港青年創新創業基地聯盟（聯盟）展館，向青年創業者及各界展示聯盟的支援服務和粵港澳大灣區的創業機遇。\n\n　　民青局局長麥美娟為專題研討會致開幕辭時表示，特區政府十分重視青年發展。她指出，《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》強調要開拓青年發展空間及支持青年逐夢前行，特區政府致力推動青年把握粵港澳大灣區機遇，透過聯盟激發創新與創業活力，助力青年逐夢圓夢。\n\n　　麥美娟表示，粵港兩地政府一直為有志於大灣區創業的青年提供多項扶持政策，區內創業氛圍愈見濃厚。她感謝廣東省人民政府港澳事務辦公室和廣東省人力資源和社會保障廳對聯盟工作的大力支持。民青局會繼續透過聯盟與各持份者加強合作，支持香港青年在大灣區創業，積極參與大灣區發展，更好融入和服務國家發展大局。\n\n　　是次專題研討會以「匯聚聯盟力量　支持青年逐夢創業」為題，邀請民青局粵港澳大灣區青年創業資助計劃的獲資助機構代表、青年創業團隊、粵港澳大灣區的創新創業基地代表，以及較早前出席亞太區經濟合作組織官方青年創新創業項目——APEC Young Entrepreneurs Conference的中國香港青年代表團成員，分享聯盟成員與青年創業團隊間的緊密合作，發揮一加一大於二的協同效應，協助香港青年在大灣區創新創業，並分享他們參與國際會議的體會和收穫。民青局亦邀得大灣區內地九個城市的創新創業基地代表，介紹當地創業政策及基地服務，讓青年創業者更掌握在大灣區落戶發展的資訊，提升在大灣區創新創業的能力和信心。\n\n　　是次專題研討會同場舉行聯盟新成員歡迎儀式，歡迎四個新成員機構加入，進一步擴大聯盟在粵港澳大灣區的創新創業基地網絡。\n\n　　聯盟由民青局、廣東省人民政府港澳事務辦公室及廣東省人力資源和社會保障廳於二○二三年十二月共同牽頭成立，匯聚約70個來自粵港兩地不同界別的成員機構，為青年創業者提供一站式的資訊、宣傳及交流平台。聯盟成立近三年來，各成員在粵港兩地籌辦超過480項不同類型的活動，支持處於不同發展階段的創業青年，協助他們拓展人際網絡和提升競爭力。聯盟的創新創業基地已全面覆蓋大灣區九個內地城市。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c354779fa50","title":"民政事務總署已開放臨時避寒中心","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000577.htm","summary":"民政事務總署今日（十一月二十日）已在各區開放共十八間臨時避寒中心，供有需要的市民避寒。","summary_short":"民政事務總署今日（十一月二十日）已在各區開放共十八間臨時避寒中心，供有需要的市民避寒。","digest":"民政事務總署已在各區開放共十八間臨時避寒中心，供有需要的市民避寒","points":["民政事務總署今日（十一月二十日）已在各區開放共十八間臨時避寒中心，供有需要的市民避寒","中心會於寒冷天氣警告持續生效期間繼續開放","各臨時避寒中心在開放期間會免費提供潔淨的墊褥和毛氈／棉被、熱食和熱水予入住人士使用"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:30:00+08:00","size":1,"keywords":[],"body":"民政事務總署今日（十一月二十日）已在各區開放共十八間臨時避寒中心，供有需要的市民避寒。中心會於寒冷天氣警告持續生效期間繼續開放。\n\n　　各臨時避寒中心在開放期間會免費提供潔淨的墊褥和毛氈／棉被、熱食和熱水予入住人士使用。\n\n　　為確保入住臨時避寒中心的人士可以在寧靜及不受干擾的環境下休息，任何市民或團體如希望送贈物品給入住者，須先聯絡中心職員進行登記，然後將物品放置在指定的室內地點。中心職員會協助通知入住者有關安排，讓他們自行領取所需物品。\n\n　　任何人士如需使用避寒中心或查詢有關在中心派贈物品的安排，可致電民政事務總署熱線2572 8427。\n\n　　十八間臨時避寒中心的位置如下：\n\n香港島：\n\n———\n\n中西區－西營盤高街2號西營盤社區綜合大樓3樓西營盤社區綜合大樓社區會堂\n\n東區－銅鑼灣福蔭道7號3樓銅鑼灣社區中心\n\n南區－鴨脷洲利東邨利東社區會堂\n\n灣仔－灣仔皇后大道東258號灣仔街市地下低層灣仔活動中心\n\n九龍：\n\n———\n\n九龍城－紅磡庇利街42號九龍城政府合署1樓紅磡社區會堂\n\n觀塘－藍田碧雲道223號藍田社區綜合大樓2樓藍田（東區）社區會堂\n\n深水埗－深水埗昌新里1號南昌社區中心\n\n黃大仙－鑽石山鳳德道111號鳳德邨鳳德社區中心\n\n油尖旺－油麻地眾坊街60號梁顯利油麻地社區中心\n\n新界：\n\n———\n\n離島－東涌文東路39號東涌市政大樓地下東涌社區會堂\n\n葵青－葵涌大窩口道15號大窩口社區中心\n\n北區－粉嶺祥華邨祥華社區會堂\n\n西貢－將軍澳坑口培成路38號西貢將軍澳政府綜合大樓地下坑口社區會堂\n\n沙田－沙田隆亨邨隆亨社區中心\n\n大埔－大埔鄉事會街2號大埔社區中心\n\n荃灣－荃灣梨木樹邨康樹樓地下梨木樹社區會堂\n\n屯門－屯門湖山路101號湖山路社區會堂\n\n元朗－元朗朗屏邨朗屏社區會堂","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1d393794bb","title":"一名女子因非法進口另類吸煙產品被判監六個月","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000462.htm","summary":"一名女子因非法進口38 000支另類吸煙產品，今日（十一月二十日）於西九龍裁判法院被判即時監禁六個月。","summary_short":"一名女子因非法進口38 000支另類吸煙產品，今日（十一月二十日）於西九龍裁判法院被判即時監禁六個月。","digest":"一名女子因非法進口38 000支另類吸煙產品，於西九龍裁判法院被判即時監禁六個月","points":["一名女子因非法進口38 000支另類吸煙產品，今日（十一月二十日）於西九龍裁判法院被判即時監…","衞生署歡迎判決，並忠告市民和旅客切勿攜帶電子煙、加熱煙產品或草本煙等另類吸煙產品進入香港…","衞生署控煙酒辦公室（控煙酒辦）昨日（十一月十九日）接獲香港海關通知…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:30:00+08:00","size":1,"keywords":[],"body":"一名女子因非法進口38 000支另類吸煙產品，今日（十一月二十日）於西九龍裁判法院被判即時監禁六個月。衞生署歡迎判決，並忠告市民和旅客切勿攜帶電子煙、加熱煙產品或草本煙等另類吸煙產品進入香港，亦不應使用任何另類吸煙產品。\n\n　　衞生署控煙酒辦公室（控煙酒辦）昨日（十一月十九日）接獲香港海關通知，於該名自日本抵港女子的行李中，檢獲38 000支另類吸煙產品。控煙酒辦隨即拘捕及檢控該名人士。\n\n　　自《2025年控煙法例（修訂）條例》中有關控煙酒辦督察拘捕權的修訂於二○二五年九月十九日生效以來，控煙酒辦已就34宗攜帶大量另類吸煙產品入境的案件提出檢控，共有37人被定罪和被判處監禁，刑期由四星期至八個月不等。\n\n　　根據《進出口條例》（第60章），任何人進口另類吸煙產品，包括電子煙、加熱煙產品及草本煙，即屬違法，經簡易程序定罪，可判處罰款50萬及監禁兩年；而經公訴程序定罪，則可判處罰款200萬元及監禁七年。\n\n　　根據《吸煙（公眾衞生）條例》（第371章），任何人不得推廣、製造、售賣或為商業目的而管有另類吸煙產品。違例者一經定罪，最高可處罰款五萬元及監禁六個月。\n\n　　控煙酒辦會繼續密切監察和持續執法以打擊相關違法行為。\n\n　　此外，衞生署忠告市民，另類吸煙產品會令人上癮，絕非有效的戒煙工具或減害工具。電子煙亦可增加患上癌症、呼吸系統疾病、心血管疾病之風險。吸煙人士為個人及他人健康着想，應盡快戒煙。市民可致電衞生署綜合戒煙熱線1833 183，或瀏覽www.livetobaccofree.hk，以獲取有關戒煙的資訊。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3a1109e446","title":"​《2026年虛擬資產服務法例（修訂）條例草案》刊憲","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000578.htm","summary":"政府今日（十一月二十日）在憲報刊登《2026年虛擬資產服務法例（修訂）條例草案》（《條例草案》）。","summary_short":"政府今日（十一月二十日）在憲報刊登《2026年虛擬資產服務法例（修訂）條例草案》（《條例草案》）。","digest":"政府在憲報刊登《2026年虛擬資產服務法例條例草案》","points":["《條例草案》旨在擴大虛擬資產服務的規管制度至涵蓋四類新增服務類型（包括交易、提供意見…","《條例草案》建議修訂《打擊洗錢及恐怖分子資金籌集條例》（第615章）…","受香港金融管理局（金管局）監管的銀行及儲值支付工具持牌人，如要在香港提供任何虛擬資產的服務…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:15:00+08:00","size":1,"keywords":[],"body":"政府今日（十一月二十日）在憲報刊登《2026年虛擬資產服務法例（修訂）條例草案》（《條例草案》）。《條例草案》旨在擴大虛擬資產服務的規管制度至涵蓋四類新增服務類型（包括交易、提供意見、管理及託管服務），以為相關虛擬資產服務提供者提供清晰的合規路徑，同時為投資者提供更充分保障，將有助促進香港數字資產市場穩健及可持續發展。\n\n　　《條例草案》建議修訂《打擊洗錢及恐怖分子資金籌集條例》（第615章），規定任何人在香港從事有關虛擬資產交易、提供意見、管理或託管的業務必須獲證券及期貨事務監察委員會（證監會）發牌或註冊，並須符合適當人選的評定準則及其他相關規管要求。受香港金融管理局（金管局）監管的銀行及儲值支付工具持牌人，如要在香港提供任何虛擬資產的服務，亦須向證監會註冊。《條例草案》將賦予證監會和香港金融管理局相關權力，以按照法定要求實施有關制度。《條例草案》擬議的監管制度參照了國際間就虛擬資產在反洗錢及投資者保障方面的標準及監管趨勢，同時充分考慮了本地情況，並與香港適用於傳統金融服務的標準接軌。\n\n　　財經事務及庫務局局長許正宇表示：「《香港第一個五年規劃》提出，香港應秉持「相同業務、相同風險、相同規則」原則，構建全球領先的數字資產監管制度，提升數字資產流動性及市場創新發展。此目標與我們去年發表的《香港數字資產發展政策宣言2.0》所述的願景一致。是次法例修訂工作是落實上述目標及願景的重要一步，將優化香港數字資產規管框架，貫通相關市場活動的主要節點，有助我們構建一個值得信賴、可持續的數字資產生態圈。」\n\n　　證監會行政總裁梁鳳儀表示：「這項立法建議是香港完善虛擬資產監管框架的重要里程碑。全面而穩健的監管制度不但能加強投資者保障，亦能為負責任的創新提供清晰的發展路徑，為香港數字資產生態圈的長遠及可持續發展奠定穩固基礎。」\n\n　　《條例草案》將於十二月二日提交立法會進行首讀。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c02c8de7ad7","title":"臘味時令食品調查結果滿意","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000400.htm","summary":"食物環境衞生署食物安全中心（中心）今日（十一月二十日）公布，最近完成一項有關臘味的時令食品調查結果，一百六十四個樣本全部通過檢測。","summary_short":"食物環境衞生署食物安全中心（中心）今日（十一月二十日）公布，最近完成一項有關臘味的時令食品調查結果…","digest":"食物環境衞生署食物安全中心公布，最近完成一項有關臘味的時令食品調查結果…","points":["食物環境衞生署食物安全中心（中心）今日（十一月二十日）公布…","中心發言人說：「踏入冬季，不少市民喜歡進食臘味，因此中心從不同零售商（包括網上零售商）抽取不…","發言人說：「臘味含有硝酸鹽及亞硝酸鹽，亞硝胺亦帶來潛在風險，部分臘味的鈉…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:15:00+08:00","size":1,"keywords":[],"body":"食物環境衞生署食物安全中心（中心）今日（十一月二十日）公布，最近完成一項有關臘味的時令食品調查結果，一百六十四個樣本全部通過檢測。\n\n　　中心發言人說：「踏入冬季，不少市民喜歡進食臘味，因此中心從不同零售商（包括網上零售商）抽取不同種類的臘味樣本，包括臘腸、膶腸、臘鴨及臘肉，進行化學和營養成分測試。」\n\n　　化學檢測包括獸藥殘餘、金屬雜質、較常用於醃製食品的防腐劑，以及製作過程可能使用的其他食物添加劑和不准添加於食物的染色料；營養成分測試則檢測樣本的能量、碳水化合物、蛋白質、總脂肪、飽和脂肪酸、反式脂肪酸、鈉和糖等含量，與其營養標籤上的標示值是否相符。\n\n　　發言人說：「臘味含有硝酸鹽及亞硝酸鹽，亞硝胺亦帶來潛在風險，部分臘味的鈉、糖和脂肪含量也較高，市民須注意均衡飲食，不宜過量進食臘味。嬰兒較易出現亞硝酸鹽中毒，所以不宜食用臘味，小孩也不宜多吃。」\n\n　　「此外，世界衞生組織轄下的國際癌症研究機構已將加工肉類歸類為『令人類致癌』（即第1組）。市民應避免進食過量加工肉類，以減低患大腸癌的風險。」\n\n　　​發言人亦呼籲業界遵守有關法例規定，並依從優良製造規範，適當地使用法例准許的食物添加劑。零售商應向可靠的供應商採購食物，並遵從《食物安全條例》的要求，保存良好的紀錄，以便在有需要時追查食物來源。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c610af48afd","title":"兩名入境旅客進口未完稅香煙罪成判囚","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000581.htm","summary":"兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》（第109章）；其中一人更因進口另類吸煙產品而違反《進出口條例》（第60章）。","summary_short":"兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》（第109章）…","digest":"兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》…","points":["兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》（第109章）","其中一人更因進口另類吸煙產品而違反《進出口條例》（第60章）","二人今日（十一月二十日）在西九龍裁判法院被判處監禁五至六個月，及罰款一千至二千元"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:05:00+08:00","size":1,"keywords":[],"body":"兩名入境旅客因進口未完稅香煙及未有向海關人員作出申報，違反《應課稅品條例》（第109章）；其中一人更因進口另類吸煙產品而違反《進出口條例》（第60章）。二人今日（十一月二十日）在西九龍裁判法院被判處監禁五至六個月，及罰款一千至二千元。\n\n　　海關人員於四月十四日在香港國際機場截查一名四十七歲抵港內地女旅客，並在她的個人行李內檢獲二萬六千支未完稅香煙，估計市值約十萬六千元，應課稅值約八萬六千元。該名旅客隨即被捕。她今日被判處監禁五個月及罰款一千元。\n\n　　此外，海關人員昨日（十一月十九日）在香港國際機場截查一名五十八歲抵港內地男旅客，並在他的個人行李內檢獲約四十支未完稅香煙及四萬件另類吸煙產品，估計市值約十二萬元，應課稅值約一百三十元。該名亦旅客隨即被捕。他今日被判處監禁六個月及罰款二千元。\n\n　　海關歡迎裁決，監禁刑罰具相當阻嚇作用，並充分反映罪行的嚴重性。\n\n　　海關提醒市民及旅客，根據《應課稅品條例》，香煙屬應課稅品。任何人若進口、處理、管有、售賣或購買私煙即屬違法，一經定罪，最高可被判罰款二百萬元及監禁七年。\n\n　　另外，根據《進出口條例》，任何人進口另類吸煙產品即屬違法，一經定罪，最高可被判罰款二百萬元及監禁七年。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑私煙活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb153e73d1a","title":"28名分間單位規管租賃業主因違反相關法例規定而被定罪","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000552.htm","summary":"28名分間單位業主因違反《業主與租客（綜合）條例》（第7章）第IVA部（《條例》）的相關規定，於十一月六日、十一月十三日及今日（十一月二十日）在東區裁判法院承認有關控罪…","summary_short":"28名分間單位業主因違反《業主與租客（綜合）條例》（第7章）第IVA部（《條例》）的相關規定，於十一月六日…","digest":"28名分間單位業主因違反《業主與租客條例》第IVA部的相關規定，於十一月六日…","points":["28名分間單位業主因違反《業主與租客（綜合）條例》（第7章）第IVA部（《條例》）的相關規定…","自《條例》生效以來，差餉物業估價署（估價署）持續加強採取執法行動…","該28名業主的罪行包括（一）沒有在規管租賃的租期開始後的60日內…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T17:00:00+08:00","size":1,"keywords":[],"body":"28名分間單位業主因違反《業主與租客（綜合）條例》（第7章）第IVA部（《條例》）的相關規定，於十一月六日、十一月十三日及今日（十一月二十日）在東區裁判法院承認有關控罪，並被判處罰款介乎800元至13,600元，合計罰款共112,500元。自《條例》生效以來，差餉物業估價署（估價署）持續加強採取執法行動，至今已合共檢控1 643宗個案，而就法庭已處理的1 478宗個案，均全數成功定罪，共涉及1 291名分間單位業主，合計總罰款共4,147,040元，另有165宗個案則正等待進行聆訊。\n\n　　該28名業主的罪行包括（一）沒有在規管租賃的租期開始後的60日內，向估價署署長提交租賃通知書（表格AR2）；（二）要求租客付還經分攤的水及／或電費時沒有出示繳費單副本及提供書面帳目；及（三）要求租客支付不屬《條例》所准許的種類的款項（包括要求租客支付的次期租賃租金超過《條例》所准許的最高租金款額）。\n\n　　估價署於早前發現這些業主涉嫌違反《條例》的相關規定。經深入調查及搜集證據後，估價署向這些業主提出檢控。\n\n　　估價署發言人重申，分間單位業主必須嚴格遵守《條例》下的相關規定，包括禁止業主刻意打擾租戶成員的安寧或舒適生活等，意圖使租客放棄佔用其分間單位；要求租客支付的次期租賃租金超過《條例》所准許的最高租金款額；同時提醒租客在《條例》下所享有的權益，包括四年（即兩年加兩年）的租住權保障。他亦強調估價署會繼續堅決執法，打擊任何違例個案。估價署除了跟進舉報個案，亦一直以多管齊下的方式主動識別、調查及跟進有關業主涉嫌違反《條例》規定的個案。就此，估價署要求規管租賃的業主提供與租賃有關的資料及參考文件，以核實他們是否已遵從《條例》的規定。如業主無合理辯解而拒絕提供相關資料或忽略署方要求，即屬違法，最高可處第三級罰款（10,000元）及監禁三個月。因應實際情況和所蒐集的資料及證據，估價署會對個別個案採取適當行動，包括就涉嫌觸犯《條例》下罪行的個案提出檢控。\n\n　　為幫助盡早遏止違法行為，市民應盡快向估價署舉報涉嫌違規個案。舉報渠道包括電話熱線（2150 8303）、電郵（enquiries@rvd.gov.hk）、傳真（2116 4920）、郵寄（九龍長沙灣道303號長沙灣政府合署15樓）或親身到訪（新界將軍澳唐賢街30號將軍澳政府合署南座7樓，估價署租務科辦公室，到訪前請先致電2150 8303預約）。此外，估價署亦已於其網頁提供一份表格（表格AR4）（www.rvd.gov.hk/doc/tc/forms/ar4.pdf），便利分間單位租客向估價署作出舉報。\n\n　　估價署提醒，根據《條例》，規管租賃的規管周期，須由該分間單位的連續兩項規管租賃（即首期租賃及次期租賃）所組成，而每項規管租賃的租期為兩年。分間單位首期租賃的租客有權獲授予有關規管周期中的次期租賃，從而享有總共四年的租住權保障。估價署陸續按照首期租賃屆滿的時間，分批發信給相關規管租賃的業主和租客並夾附有關資訊，旨在協助他們了解次期租賃的重要事項，並提醒應在擬達成的次期租賃開始前約兩個月須遵從的程序，以及在《條例》下的相關義務和權益。有關業主及租客亦可瀏覽估價署網站內的次期租賃專頁（www.rvd.gov.hk/tc/tenancy_matters/second_term_tenancy.html）的相關資料，包括「一圖看清」、小冊子、教學短片及常見問題。有關業主及租客亦應熟悉相關的法定要求，以及就次期租賃保持密切溝通，並按《條例》適切處理有關事宜。\n\n　　如就規管租賃事宜有疑問，可致電電話熱線（2150 8303）或瀏覽估價署網頁（www.rvd.gov.hk/tc/our_services/part_iva.html）內的相關資訊。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca38f04daa8","title":"香港銀行同業結算有限公司提醒公眾慎防偽冒網站","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000556.htm","summary":"下稿代香港金融管理局發出︰  　　​香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fpshk.xyz。","summary_short":"下稿代香港金融管理局發出︰  　　​香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站…","digest":"香港銀行同業結算有限公司提醒公眾慎防偽冒網站","points":["下稿代香港金融管理局發出︰","​香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fps…","該偽冒網站偽裝成「買家網上安全保障」，提供轉數快FPS網上交易安全服務，包括1）退款…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T16:45:00+08:00","size":1,"keywords":[],"body":"下稿代香港金融管理局發出︰\n\n　　​香港銀行同業結算有限公司（結算公司）近日發現一個偽冒成仿如結算公司官方網站的詐騙網站fpshk.xyz。該偽冒網站偽裝成「買家網上安全保障」，提供轉數快FPS網上交易安全服務，包括1）退款、2）舉報未經授權的網上交易，以及3）網上交易支援，及進一步引導用戶與偽冒客服的人員進行對話。\n\n　　結算公司澄清，該偽冒網站與結算公司以及結算公司所有業務，均絕無關係。在一般情況下，結算公司不會直接向個別公眾人士提供轉數快服務，也不會主動接觸個別公眾人士。結算公司真正官方網址是www.hkicl.com.hk及fps.hkicl.com.hk。\n\n　　結算公司呼籲公眾人士提防可疑電話、網站或其他通訊，小心保護個人資料。如接獲任何宣稱來自結算公司成員的可疑通訊，請致電結算公司電話2533 1111核實。如市民懷疑受騙，應盡快向警方報案。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca663cadf18","title":"​香港海關偵破非B類註冊貴金屬及寶石交易商進行指明現金交易的案件","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000565.htm","summary":"​香港海關昨日（十一月十九日）偵破一宗案件，涉及一間在貴金屬及寶石交易商監管制度下並非B類註冊人的本地公司，進行了十二萬以上港元含貴金屬及寶石的鐘錶的現金交易。","summary_short":"​香港海關昨日（十一月十九日）偵破一宗案件，涉及一間在貴金屬及寶石交易商監管制度下並非B類註冊人的本地公司…","digest":"香港海關偵破一宗案件，涉及一間在貴金屬及寶石交易商監管制度下並非B類註冊人的本地公司…","points":["​香港海關昨日（十一月十九日）偵破一宗案件，涉及一間在貴金屬及寶石交易商監管制度下並非B類註…","根據《打擊洗錢及恐怖分子資金籌集條例》（第615章），除獲豁免人士外…","除B類註冊人以外，任何人均不得在經營貴金屬及寶石業務過程中…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T16:43:00+08:00","size":1,"keywords":[],"body":"​香港海關昨日（十一月十九日）偵破一宗案件，涉及一間在貴金屬及寶石交易商監管制度下並非B類註冊人的本地公司，進行了十二萬以上港元含貴金屬及寶石的鐘錶的現金交易。案件仍在調查中。\n\n　　根據《打擊洗錢及恐怖分子資金籌集條例》（第615章），除獲豁免人士外，任何人如有意在香港從事貴金屬及寶石業務並進行十二萬或以上港元的交易（不論是支付或收取款項），均須向海關註冊。\n\n　　除B類註冊人以外，任何人均不得在經營貴金屬及寶石業務過程中，進行總額為十二萬或以上港元的現金交易。任何並非B類註冊人的交易商，若聲稱為B類註冊人、聲稱獲授權進行；或進行任何總額為十二萬或以上港元的現金交易，均屬違法，一經定罪，最高可被判處罰款港幣十萬元及監禁六個月。\n\n　　海關提醒貴金屬及寶石交易商必須在成功獲得相關註冊後，才可進行總額為十二萬或以上港元的現金或非現金交易。\n\n　　有關註冊申請的表格、程序和指引，可瀏覽「貴金屬及寶石交易商註冊系統」網站（www.drs.customs.gov.hk）或海關網頁（www.customs.gov.hk/tc/service-enforcement-information/anti-money-laundering/supervision-of-dealers-in-precious-metals-and-ston/index.html）。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑在沒有所需註冊的情況下而進行總額為十二萬或以上港元的相關貴金屬及寶石交易。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2d9ee1f1ec","title":"​二零二六年十月份消費物價指數","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000306.htm","summary":"政府統計處（統計處）今日（十一月二十日）公布二零二六年十月份的消費物價指數。","summary_short":"政府統計處（統計處）今日（十一月二十日）公布二零二六年十月份的消費物價指數。","digest":"政府統計處公布二零二六年十月份的消費物價指數","points":["政府統計處（統計處）今日（十一月二十日）公布二零二六年十月份的消費物價指數","根據綜合消費物價指數，二零二六年十月份整體消費物價與一年前同月比較，上升2.2%…","剔除所有政府一次性紓困措施的影響，綜合消費物價指數在二零二六年十月份的按年升幅（即基本通脹率…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T16:30:00+08:00","size":1,"keywords":[],"body":"政府統計處（統計處）今日（十一月二十日）公布二零二六年十月份的消費物價指數。根據綜合消費物價指數，二零二六年十月份整體消費物價與一年前同月比較，上升2.2%，較二零二六年九月份的相應升幅（1.9%）為高。二零二六年十月份的升幅擴大，主要是由於差餉寬減於二零二六年九月份結束。剔除所有政府一次性紓困措施的影響，綜合消費物價指數在二零二六年十月份的按年升幅（即基本通脹率）為2.0%，較二零二六年九月份（2.1%）略低。\n\n　　經季節性調整的綜合消費物價指數，截至二零二六年十月止的三個月的平均每月升幅為0.3%，而截至二零二六年九月止的三個月的相應升幅為0.2%。剔除所有政府一次性紓困措施的影響，相應的升幅為0.1%及0.2%。\n\n　　從細分指數分析，甲類、乙類及丙類消費物價指數在二零二六年十月份的按年升幅分別為2.0%、2.2%及2.3%，而二零二六年九月份的相應升幅分別為1.4%、2.0%及2.3%。剔除所有政府一次性紓困措施的影響，甲類、乙類及丙類消費物價指數在二零二六年十月份的按年升幅分別為1.7%、2.1%及2.2%，在二零二六年九月份的升幅則分別為1.7%、2.2%及2.4%。\n\n　　經季節性調整的甲類、乙類及丙類消費物價指數，截至二零二六年十月止的三個月的平均每月升幅均為0.3%，而截至二零二六年九月止的三個月的相應升幅均為0.2%。剔除所有政府一次性紓困措施的影響，截至二零二六年十月止的三個月，經季節性調整的甲類、乙類及丙類消費物價指數的平均每月升幅分別為0.1%、0.2%及0.2%，而截至二零二六年九月止的三個月的相應升幅則均為0.2%。\n\n　　在各類綜合消費物價指數組成項目中，價格在二零二六年十月份錄得按年升幅的類別為電力、燃氣及水（上升12.7%）、雜項服務（上升5.0%）、交通（上升4.5%）、耐用物品（上升1.4%）、雜項物品（上升1.4%）、住屋（上升1.4%）、外出用膳及外賣（上升0.9%），以及衣履（上升0.5%）。\n\n　　另一方面，綜合消費物價指數在二零二六年十月份錄得按年跌幅的類別為基本食品（下跌0.8%），以及煙酒（下跌0.4%）。\n\n　　以二零二六年首十個月合併計算，綜合消費物價指數較一年前同期上升1.8%，甲類、乙類及丙類消費物價指數的相應升幅分別為1.6%、1.9%及1.9%。剔除所有政府一次性紓困措施的影響，相應升幅則分別為1.7%、1.5%、1.8%及1.9%。\n\n　　截至二零二六年十月止的三個月，綜合消費物價指數較一年前同期上升1.9%，而甲類、乙類及丙類消費物價指數分別上升1.6%、2.0%及2.2%。剔除所有政府一次性紓困措施的影響，相應升幅則分別為2.0%、1.7%、2.1%及2.2%。\n\n　　截至二零二六年十月止的十二個月，綜合消費物價指數較一年前同期平均上升1.7%，甲類、乙類及丙類消費物價指數的相應升幅分別為1.5%、1.8%及1.8%。剔除所有政府一次性紓困措施的影響，相應升幅則分別為1.6%、1.4%、1.7%及1.8%。\n\n評論\n\n　　政府發言人表示，十月消費物價通脹保持溫和。基本綜合消費物價指數按年上升2.0%，略低於九月2.1%的升幅。燃料相關項目的價格繼續錄得顯著升幅，不過對其他項目的價格影響仍然有限，大部分其他項目的價格輕微上升甚或下跌。\n\n　　展望將來，較早前國際油價上升仍會繼續傳導至本地消費層面的燃料相關項目價格。然而，其他方面的價格壓力應會大致受控，整體通脹會維持溫和。不過，地緣政治緊張局勢仍是短期內影響國際燃料價格的主要不確定因素，須密切留意。\n\n進一步資料\n\n　　表1列載二零二六年十月份的消費物價各類別指數及按年變動率。表2列載消費物價指數的按年變動率時間數列，以及在剔除所有政府一次性紓困措施的影響後的相應變動率。參考經季節性調整的消費物價指數的變動情況，可幫助辨析消費物價的最新趨勢。表3列載經季節性調整的消費物價指數在最近三個月內的平均每月變動率的時間數列。圖1則顯示原來及經季節性調整的綜合消費物價指數的變動率，以及基本通脹率。\n\n　　更詳細的統計數字刊載於《消費物價指數月報》。用戶可於統計處網站（www.censtatd.gov.hk/tc/EIndexbySubject.html?pcode=B1060001&scode=270）瀏覽及下載該刊物。\n\n　　有關消費物價指數的查詢，可與統計處消費物價指數組聯絡，電話3903 7374或電郵cpi@censtatd.gov.hk。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c917c7ce461","title":"香港海關打擊非法進口動物執法行動","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000282.htm","summary":"香港海關於十一月開展專項調查行動，打擊非法進口動物活動，偵破兩宗非法進口動物的案件，檢獲七隻活貓及兩隻活犬，估計市值共約九萬二千元。","summary_short":"香港海關於十一月開展專項調查行動，打擊非法進口動物活動，偵破兩宗非法進口動物的案件，檢獲七隻活貓及兩隻活犬…","digest":"香港海關於十一月開展專項調查行動，打擊非法進口動物活動，偵破兩宗非法進口動物的案件…","points":["香港海關於十一月開展專項調查行動，打擊非法進口動物活動，偵破兩宗非法進口動物的案件…","香港海關透過網上巡查及情報分析，發現有社交媒體帳戶宣傳動物跨境托運服務…","行動中，七名本地居民被捕，包括三男四女，年齡介乎三十三至五十六歲"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T16:20:00+08:00","size":1,"keywords":[],"body":"香港海關於十一月開展專項調查行動，打擊非法進口動物活動，偵破兩宗非法進口動物的案件，檢獲七隻活貓及兩隻活犬，估計市值共約九萬二千元。七人被捕。\n\n　　香港海關透過網上巡查及情報分析，發現有社交媒體帳戶宣傳動物跨境托運服務，懷疑有人利用不法渠道走私動物，遂於本月開展專項調查行動，於各邊境口岸管制站加強檢查高風險的旅客及貨物。\n\n　　行動中，七名本地居民被捕，包括三男四女，年齡介乎三十三至五十六歲。其中兩人涉嫌偷運動物入境，兩人負責本地運輸，其餘三人則為收貨人。他們現正保釋候查。\n\n　　上述案件仍在調查中，不排除有更多人被捕。所有檢獲動物已轉交漁農自然護理署作跟進行動。\n\n　　海關是專責打擊走私的政府部門，將繼續加強與其他執法部門的合作及情報交流，適時開展針對性的反走私行動，全力遏止相關罪行。\n\n　　海關提醒市民，任何人未領有有效許可證而將動物輸入香港，即屬違法。\n\n　　根據《狂犬病規例》（第421A章），任何人非法輸入動物、動物屍體或動物產品，一經定罪，最高可被判罰款五萬元及監禁一年。\n\n　　​\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑走私活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1d0cacc021","title":"電影節目辦事處推出放映節目「五味人生──意大利風情」","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000327.htm","summary":"康樂及文化事務署電影節目辦事處將於十二月十三日至明年一月二十四日舉辦放映節目「五味人生──意大利風情」，於香港電影資料館（資料館）及K11 Art House放映十六部展現人生五味雜陳的意大利電影。","summary_short":"康樂及文化事務署電影節目辦事處將於十二月十三日至明年一月二十四日舉辦放映節目「五味人生──意大利風情」…","digest":"康樂及文化事務署電影節目辦事處將於十二月十三日至明年一月二十四日舉辦放映節目「五味人…","points":["康樂及文化事務署電影節目辦事處將於十二月十三日至明年一月二十四日舉辦放映節目「五味人生──意…","選映作品其中三部為愛情電影，包括由「拉丁大情人」馬斯杜安尼主演的《露滴牡丹開》（1960）…","節目亦選映探討階級鬥爭與社會發展關係的作品，其中有佛朗赤斯高羅西執導的《城市黑手》（1963…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T14:20:58+08:00","size":1,"keywords":[],"body":"康樂及文化事務署電影節目辦事處將於十二月十三日至明年一月二十四日舉辦放映節目「五味人生──意大利風情」，於香港電影資料館（資料館）及K11 Art House放映十六部展現人生五味雜陳的意大利電影。\n\n　　選映作品其中三部為愛情電影，包括由「拉丁大情人」馬斯杜安尼主演的《露滴牡丹開》（1960）、絕代美人歌狄亞嘉汀娜主演的《天涯一美人》（1961），以及他們合演的《風流何價》（1960）。\n\n　　節目亦選映探討階級鬥爭與社會發展關係的作品，其中有佛朗赤斯高羅西執導的《城市黑手》（1963）、貝納杜貝托魯奇執導的《同流者》（1970），以及艾里奧柏堤執導、講述警察調查同僚犯下的兇案的《查案記》（1970）。\n\n　　此外，節目有四部圍繞家庭關係的作品。《單車竊賊》（1948）講述失業父親為家人鋌而走險、《生命中的最痛》（2001）的心理醫師面對妻女深陷喪親之痛而自責、《愛的世界》（1966）講述父親隱瞞幼子喪母最終釀成悲劇，以及《天倫之旅》（1990）講述父親探望長大後散居各地的子女的旅程。\n\n　　三部選映作品講述戰火中的故事，包括在戰時羅馬實地拍攝的《不設防城市》（1945）、講述那不勒斯居民奮起反抗的《鐵蹄火海戰》（1962），及講述猶太父子被囚集中營的《一個快樂的傳說》（1997）。\n\n　　另外有二部選映作品以江湖險惡為主題，包括取材自意大利著名黑幫家族的《叛徒》（2019），以及講述肉店老闆的不義之財被銀行職員上下其手的《財產並非贓物》（1973）。\n\n　　節目亦會放映記錄片《配樂大師：ENNIO》（2021），介紹電影音樂巨匠安尼奧摩利哥尼的創作生涯。他曾為很多經典電影作品配樂，包括《查案記》、《財產並非贓物》和《天倫之旅》。\n\n　　所有影片均設中、英文字幕。《叛徒》為三級影片，只准十八歲或以上人士觀看。\n\n　　資料館放映場次票價為75元，門票現於城市售票網（www.urbtix.hk）發售，電話購票請致電3166 1288。K11 Art House放映場次票價為110及150元，門票現於K11 Art House及MCL戲院網站（www.mclcinema.com）發售。查詢節目詳情和優惠請致電2734 2900或瀏覽網頁www.lcsd.gov.hk/fp/tc/listing.html?id=101。\n\n　　部分放映設映後談，分別由登徒、皮亞、歐嘉麗博士及節目策劃黃國兆主講。節目另設三場映後座談會，分別以「馬斯杜安尼逝世30周年祭」、「懷念電影女神歌狄亞嘉汀娜」及「世界頂級配樂大師安尼奧摩利哥尼」為題，分別由羅卡、陳廣隆和羅展鳳博士主講。映後談及座談會以粵語主講、免費入場，持相關電影放映門票的觀眾優先入座，座位有限，先到先得。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9a8d4ec7aa","title":"政務司司長主持人工智能風險管治統籌工作組首次會議","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000406.htm","summary":"行政長官在二○二六年《施政報告》宣布，由政務司司長陳國基統籌各政策局推進人工智能（AI）風險治理策略的工作。","summary_short":"行政長官在二○二六年《施政報告》宣布，由政務司司長陳國基統籌各政策局推進人工智能（AI）風險治理策略的工作。","digest":"行政長官在二○二六年《施政報告》宣布…","points":["行政長官在二○二六年《施政報告》宣布，由政務司司長陳國基統籌各政策局推進人工智能（AI）風險…","陳國基今日（十一月二十日）召開人工智能風險管治統籌工作組（工作組）首次會議…","陳國基表示，AI發展迅速，在推動產業升級、便利生活的同時，其對社會各領域所帶來的影響…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T13:13:00+08:00","size":1,"keywords":[],"body":"行政長官在二○二六年《施政報告》宣布，由政務司司長陳國基統籌各政策局推進人工智能（AI）風險治理策略的工作。陳國基今日（十一月二十日）召開人工智能風險管治統籌工作組（工作組）首次會議，全面推進AI風險治理策略的統籌協調工作。\n\n　　陳國基表示，AI發展迅速，在推動產業升級、便利生活的同時，其對社會各領域所帶來的影響，以及風險治理和應用安全，同樣至關重要。工作組將督導和統籌各政策局及部門檢視AI發展風險、治理和安全等議題，強化風險意識，研究相應的管理和規範體系，務求在加快推進AI應用的同時，實現技術向善、安全可控。\n\n　　會議上，工作組檢視及統籌AI風險治理策略七項具體行動的工作計劃和落實方案，包括（一）打擊利用AI犯罪；（二）加強保護未成年使用者；（三）推動市場評估AI道德風險；（四）推動各行業安全有序應用AI；（五）研究AI產品導致意外的法律責任；（六）推出指引管理AI智能體；及（七）研究AI帶來的就業影響。\n\n　　工作組會按工作進度定期召開會議，檢視及督導政策局及部門落實各項措施的進度，並統籌協調跨部門事宜，確保香港的AI風險治理策略得以全面、穩妥和有序地推展落實。\n\n　　工作組成員為：\n\n政務司司長（組長）\n\n律政司司長\n\n教育局局長\n\n財經事務及庫務局局長\n\n創新科技及工業局局長\n\n勞工及福利局局長\n\n保安局局長\n\n特首政策組組長\n\n數字政策專員\n\n　　其他相關政策局和部門代表會按需要出席會議。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5fdae91693","title":"運輸及物流局副局長在立法會交通事務委員會會議就三條過海隧道及大欖隧道分時段收費的成效檢視及中九龍繞道的最新交通情況開場發言","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000362.htm","summary":"以下是運輸及物流局副局長廖振新今日（十一月二十日）在立法會交通事務委員會會議，就三條過海隧道及大欖隧道分時段收費的成效檢視及中九龍繞道的最新交通情況的開場發言：  主席…","summary_short":"以下是運輸及物流局副局長廖振新今日（十一月二十日）在立法會交通事務委員會會議…","digest":"運輸及物流局副局長在立法會交通事務委員會會議就三條過海隧道及大欖隧道分時段收費的成效…","points":["今日我們向交通事務委員會報告三條過海隧道和大欖隧道實施分時段收費後的交通表現…","政府自二○二三年十二月起在三隧推行分時段收費，並於二○二五年五月三十一日接收大欖隧道…","最新交通數據顯示，以上各種措施，在紓緩擠塞、理順過海交通…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T12:15:00+08:00","size":1,"keywords":[],"body":"以下是運輸及物流局副局長廖振新今日（十一月二十日）在立法會交通事務委員會會議，就三條過海隧道及大欖隧道分時段收費的成效檢視及中九龍繞道的最新交通情況的開場發言：\n\n主席、各位委員：\n\n　　​\n\n　　今日我們向交通事務委員會報告三條過海隧道和大欖隧道實施分時段收費後的交通表現，以及中九龍繞道的最新交通情況。\n\n　　政府自二○二三年十二月起在三隧推行分時段收費，並於二○二五年五月三十一日接收大欖隧道，同步實施分時段收費，下調各車種收費，以保持隧道暢順並紓緩替代路線壓力。\n\n　　最新交通數據顯示，以上各種措施，在紓緩擠塞、理順過海交通、改變駕駛者出行習慣及促進交通分流等方面，已達致預期效果及政策目標。這反映現行收費水平及分流措施成效顯著，各隧道與替代路線的容車量得以充分利用。\n\n　　另外，中九龍繞道（九龍灣段）將於今年十二月六日通車。而中九龍繞道（油麻地段）自去年十二月通車以來，九龍區整體交通狀況大致良好，九龍區內主要道路的交通擠塞得以紓緩。我們預期，中九龍繞道全線通車後，將進一步提升九龍東西交通的便捷程度，改善交通。\n\n　　綜合各項措施現階段的成效，我們建議暫時維持現行收費安排。接下來，同事會以投影片為大家詳細介紹。之後，我們非常樂意聆聽委員的意見。多謝主席。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6807526281","title":"研究資助局舉行「探索宇宙」公眾講座","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000191.htm","summary":"為配合政府提倡於中小學大力推動STEAM（科學、科技、工程、藝術和數學）教育，以及加強發掘和培育本地STEAM精英，研究資助局（研資局）於十一月期間舉辦一系列公眾講座，內容包括人工智能以至宇宙探索…","summary_short":"為配合政府提倡於中小學大力推動STEAM（科學、科技、工程、藝術和數學）教育，以及加強發掘和培育本地STEAM精英…","digest":"為配合政府提倡於中小學大力推動STEAM（科學、科技、工程、藝術和數學）教育…","points":["下稿代大學教育資助委員會發出：","為配合政府提倡於中小學大力推動STEAM（科學、科技、工程、藝術和數學）教育…","最後一場講座「探索宇宙」將於十一月二十八日（星期六）舉行"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T12:00:00+08:00","size":1,"keywords":[],"body":"下稿代大學教育資助委員會發出：\n\n　　為配合政府提倡於中小學大力推動STEAM（科學、科技、工程、藝術和數學）教育，以及加強發掘和培育本地STEAM精英，研究資助局（研資局）於十一月期間舉辦一系列公眾講座，內容包括人工智能以至宇宙探索，免費入場，先到先得，歡迎參與。\n\n　　最後一場講座「探索宇宙」將於十一月二十八日（星期六）舉行。講座以廣東話進行，詳情如下：\n\n時間：下午二時三十分至四時三十分\n\n地點：香港科學館一樓演講廳\n\n現場直播：香港科學館Facebook專頁（www.facebook.com/hkscm）或\n\n YouTube頻道（www.youtube.com/user/hksciencemuseum）\n\n第一節講座：「超新星：壯麗的宇宙煙花」\n\n——————————————————————————————————\n\n　　超新星是宇宙中最壯觀的爆炸之一，標誌着恆星的戲劇性死亡。這些宇宙煙火釋放出巨大能量，映照整個星系，並將行星和生命所需的重元素散播到宇宙中。而在爆炸消散很久後，膨脹的超新星殘骸會塑造星際介質，加速宇宙射線，並觸發新一代恆星的形成。本講座由香港大學物理學系副教授吳志勇教授主講，他將介紹恆星爆炸及留下的殘骸背後的物理原理，並揭示它們為何是現代天文物理學中最引人入勝的前沿領域，亦會重點介紹超新星研究的最新成果。\n\n第二節講座：「太空探索新紀元：破解宇宙的謎團」\n\n——————————————————————————————————\n\n　　隨着科技的急速發展，人類正處於探索太空的黃金時代。本講座由香港教育大學科學與環境學系副教授陳文豪博士主講，介紹數個正在執行和未來的太空任務，包括國家正在籌劃的任務，以破解宇宙的重大謎團，例如太陽系的未解之謎，以及暗物質、暗能量和標準宇宙學模型所面臨的難題。講座將探討這些太空任務如何協助破解這些謎團，並重新塑造我們對宇宙的認知。\n\n　　研資局自二○○九年起定期舉辦公眾講座，邀請不同學者擔任講者，旨在將香港高等院校的研究知識普及化，讓市民更了解本地研究的重要性及價值。\n\n　　如有查詢，可致電2524 3987或瀏覽大學教育資助委員會網頁（www.ugc.edu.hk/big5/rgc/about/events/lectures/lectures.html）。此外，公眾人士可透過連結（www.ugc.edu.hk/big5/rgc/about/subscribe）登記研資局的電郵訂閱服務，以定期收取最新資訊。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc4647c15de","title":"天氣寒冷市民應注意健康","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000316.htm","summary":"衞生署衞生防護中心（中心）今日（十一月二十日）表示，由於天氣寒冷，市民特別是重點人群包括長者、長期病患者、戶外工作人士、孕婦、嬰幼兒和兒童應採取適當措施，保障健康。","summary_short":"衞生署衞生防護中心（中心）今日（十一月二十日）表示，由於天氣寒冷，市民特別是重點人群包括長者、長期病患者、戶外工作人士…","digest":"衞生署衞生防護中心表示，由於天氣寒冷，市民特別是重點人群包括長者、長期病患者…","points":["衞生署衞生防護中心（中心）今日（十一月二十日）表示，由於天氣寒冷…","中心發言人表示，一般而言，長者皮下脂肪較少，加上體溫調節機能減退…","加上部分長者可能因為行動不便以致身體產生及保存熱能的能力減低"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:18:06+08:00","size":1,"keywords":[],"body":"衞生署衞生防護中心（中心）今日（十一月二十日）表示，由於天氣寒冷，市民特別是重點人群包括長者、長期病患者、戶外工作人士、孕婦、嬰幼兒和兒童應採取適當措施，保障健康。\n\n長者和長期病患者\n\n————————\n\n　　中心發言人表示，一般而言，長者皮下脂肪較少，加上體溫調節機能減退，身體未必能對氣溫下降作出適當反應。加上部分長者可能因為行動不便以致身體產生及保存熱能的能力減低。\n\n　　慢性疾病如高血壓、糖尿病或甲狀腺功能減退等，更會減慢新陳代謝率，因而令患者減少製造熱能。此外，慢性呼吸道疾病或心腦血管疾病等長期病患者，亦會較易因氣溫驟降而令病情惡化。\n\n　　發言人提醒市民，特別是長者和長期病患者，採取以下預防措施：\n\n 留意天氣預報，因應需要加穿禦寒衣物，包括帽、頸巾、手套及襪等；\n\n 進食足夠的食物，攝取充足的熱量；\n\n 經常做適量運動，以增加血液循環及產生熱能；\n\n 逗留在溫暖的環境內，盡量避開早晚氣温較低時段外出，亦應避免長時間暴露於戶外；\n\n 使用保暖電器時要注意安全，室內亦應保持空氣流通；\n\n 避免飲用含酒精的飲品，因為酒精會令血管擴張不但不能保暖，更令身體流失熱量，使人感到寒冷；及\n\n 如感到不適，應盡早求醫。\n\n幼童和孕婦\n\n—————\n\n　　在寒冷天氣下，嬰幼兒比成人更易流失熱能，發言人提醒家長應確保嬰幼兒穿著足夠衣物保暖，但宜輕巧，以防過熱。當兒童進行户外體力活動時，應適量增減衣物，如衣物濕透時，應及時更換。嬰幼兒和孕婦亦應盡量避開早晚氣温較低時段外出。\n\n　　嬰兒就寢時，家長應注意以下安全事項：\n\n 保持房間空氣流通，溫度適中；\n\n 緊記讓嬰兒仰睡，確保他睡覺時頭部、面部及雙手外露，不會被遮蓋；\n\n 嬰兒不需要使用枕頭。讓嬰兒睡在堅實和大小適中的床褥上，切勿在嬰兒睡覺的地方放置軟身物件、枕頭和寬鬆被鋪；\n\n 與嬰兒共睡一室，最安全是讓嬰兒獨自在嬰兒床上睡覺，並把嬰兒床放在父母的床邊；及\n\n 締造無煙環境。\n\n戶外工作人士\n\n——————\n\n　　戶外工作人士需留意天氣報告，穿着適當禦寒衣物工作，如衣物濕透時，應及時更換。在寒冷天氣警告生效期間，應採取適當的預防措施。如有不適應立即暫停工作、尋求協助及求醫。\n\n一般市民\n\n————\n\n　　​另外，多種呼吸道病原體，包括流感及新型冠狀病毒在內，可能在冬季轉趨活躍並同時傳播。除個別有已知禁忌症人士外，所有年滿六個月或以上的人士都建議接種季節性流感疫苗。有較高風險患上流感及其併發症的人士，包括長者及兒童，應盡快接種流感疫苗。詳情請參閱衞生防護中心有關疫苗接種計劃的網站。\n\n　　同時患上流感與2019冠狀病毒病的患者有較大可能出現嚴重併發症和死亡。接種流感疫苗與2019冠狀病毒病疫苗對於長者，尤其居於院舍的院友同樣重要，他們亦應盡快按建議接種2019冠狀病毒病疫苗額外加強劑。市民亦應保持良好個人和環境衞生，以防感染呼吸道疾病，注意事項包括：\n\n 病人佩戴外科口罩可以預防傳播呼吸道病毒，因此出現病徵（即使症狀輕微）的人士佩戴外科口罩十分重要；\n\n 在乘搭交通工具或在人多擠迫的地方逗留時，應佩戴外科口罩。正確佩戴口罩十分重要，包括在佩戴口罩前及脫下口罩後，保持手部衞生；\n\n 避免觸摸眼睛、口和鼻；\n\n 雙手一旦染污，應使用梘液和清水以正確方法洗手；\n\n 當雙手沒有明顯污垢時，用含70%至80%的酒精搓手液潔淨雙手；\n\n 打噴嚏或咳嗽時，應用紙巾掩着口鼻，把用過的紙巾棄置於有蓋垃圾箱內，其後應徹底洗手；\n\n 保持室內空氣流通；\n\n 當出現呼吸道感染病徵，應戴上外科口罩，不應上班或上學，避免前往人多擠逼的地方，及盡早向醫生求診；及\n\n 保持均衡飲食、恆常運動及充足休息，不要吸煙和避免過大的生活壓力。\n\n　　​​一些經由食物傳播的疾病特別是與火鍋食品有關的疾病，在天氣寒冷時也很常見，市民應採取以下預防措施：\n\n 處理食物及進餐前應該洗淨雙手；\n\n 選擇食物時，不要光顧無牌或衞生環境惡劣的商戶；\n\n 徹底清潔並煮熟所有食物；\n\n 蔬菜應以流動清水徹底沖淨，方可烹煮食用。在適當的情況下，可用乾淨的刷子刷洗帶有硬皮的農產品，以去除表面和縫隙間的污物雜質，包括除害劑殘餘和污染物；\n\n 蝦應徹底煮熟，並待殼變紅及蝦肉變白和不透明後才進食；\n\n 貝類海產如帶子及象拔蚌等的外殼應洗擦乾淨，並去除內臟；\n\n 切勿進食任何未完全煮熟的淡水水產。為確保食物徹底煮熟，食物的中心溫度須至少達到攝氏75度，以消滅致病菌；\n\n 大部分火鍋材料都應存放在攝氏四度或以下的冷凍格內，冷藏食物則應放在攝氏負18度或以下的冰箱內；\n\n 切勿以生雞蛋作為火鍋蘸醬；及\n\n 使用不同筷子夾取生熟食物，以免交叉污染。\n\n　　​​此外，市民使用燃燒燃料的裝置時，特別在室內地方，須確保有良好的通風，以免因吸入一氧化碳引致中毒，損害健康。\n\n　　有關更多健康資訊，可致電衞生署健康教育專線（2833 0111），或參閱衞生防護中心網頁和Facebook專頁，以及勞工處於在寒冷天氣警告生效期間，對僱主及僱員發布應採取預防措施的新聞公報。\n\n　　市民亦可「打電話問天氣」（1878 200），或參閱香港天文台網頁了解最新天氣情況和預報，或瀏覽關顧長者天氣資訊。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cac527a907b","title":"僱主及僱員在寒冷天氣應採取預防措施","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000313.htm","summary":"電台及電視台當值宣布員注意：  請立即播出下列特別報告，並在寒冷天氣警告生效時多次重播：  　　勞工處提醒僱主，由於寒冷天氣警告生效，僱主應採取適當的預防措施…","summary_short":"電台及電視台當值宣布員注意：  請立即播出下列特別報告，並在寒冷天氣警告生效時多次重播：  　　勞工處提醒僱主…","digest":"電台及電視台當值宣布員注意：  請立即播出下列特別報告…","points":["電台及電視台當值宣布員注意：","請立即播出下列特別報告，並在寒冷天氣警告生效時多次重播：","勞工處提醒僱主，由於寒冷天氣警告生效，僱主應採取適當的預防措施…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:17:43+08:00","size":1,"keywords":[],"body":"電台及電視台當值宣布員注意：\n\n請立即播出下列特別報告，並在寒冷天氣警告生效時多次重播：\n\n　　勞工處提醒僱主，由於寒冷天氣警告生效，僱主應採取適當的預防措施，例如提醒須在戶外或偏遠地方工作的僱員穿着合適的禦寒衣物，及盡量安排僱員交替在戶外及戶內或有遮蔽的地方工作。僱員要留意天氣報告、穿着合適的禦寒衣物和留意身體狀況，如有不適，例如手腳冰冷和全身震顫，應盡快通知主管和看醫生。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca8ebc98781","title":"一款電磁爐禁止在港供應","url":"https://www.info.gov.hk/gia/general/202611/20/P2026111800561.htm","summary":"機電工程署（機電署）今日（十一月二十日）根據《能源效益（產品標籤）條例》，將一款電磁爐從《條例》訂明的表列型號紀錄冊中剔除，即日起不得在本港供應。","summary_short":"機電工程署（機電署）今日（十一月二十日）根據《能源效益（產品標籤）條例》…","digest":"機電工程署根據《能源效益條例》，將一款電磁爐從《條例》訂明的表列型號紀錄冊中剔除…","points":["機電工程署（機電署）今日（十一月二十日）根據《能源效益（產品標籤）條例》…","機電署負責按《條例》實行強制性能源效益標籤計劃，並定期挑選表列型號的產品進行能源表現監察測試…","由於以上型號產品的測試結果未達相關的能源效益及／或功能特性表現，署方決定將其從紀錄冊中剔除"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T11:15:00+08:00","size":1,"keywords":[],"body":"機電工程署（機電署）今日（十一月二十日）根據《能源效益（產品標籤）條例》，將一款電磁爐從《條例》訂明的表列型號紀錄冊中剔除，即日起不得在本港供應。\n\n　　有關產品資料如下：\n\n電磁爐\n\n 進口商／\n\n 電話／\n\n 電郵地址\n 品牌\n 型號\n 參考編號\n\n 億世集團有限公司\n\n 2235 0333\n\n cs@epsa.com.hk\n ecHome\n IDCS2100BK\n I250027\n\n　　機電署負責按《條例》實行強制性能源效益標籤計劃，並定期挑選表列型號的產品進行能源表現監察測試，以查核有關產品是否符合向機電署遞交的能源效益及功能特性表現。由於以上型號產品的測試結果未達相關的能源效益及／或功能特性表現，署方決定將其從紀錄冊中剔除。\n\n　　機電署已根據《條例》向相關進口商發出通知書，進口商會於報章刊登通告，通知巿民有關產品會停止在本港供應。\n\n　　公眾如有查詢，請與上述進口商聯絡。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":15,"items":[{"id":"c17b652729d","title":"中老铁路迎开通以来最大入境外国旅游团","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-20/10735340.shtml","summary":"中新社云南西双版纳11月20日电 (黄远飞 于浩良)地处云南省中老边境的磨憨出入境边防检查站(下称“磨憨边检站”)20日通报称，11月19日至20日，中老铁路迎来开通近5年来最大入境外国旅游团…","summary_short":"中新社云南西双版纳11月20日电 (黄远飞 于浩良)地处云南省中老边境的磨憨出入境边防检查站(下称“磨憨边检站”)20日…","digest":"地处云南省中老边境的磨憨出入境边防检查站(下称“磨憨边检站”)20日通报称…","points":["中新社云南西双版纳11月20日电 (黄远飞 于浩良)地处云南省中老边境的磨憨出入境边防检查站…","磨憨铁路口岸位于云南省西双版纳傣族自治州勐腊县中老边境","作为中老铁路重要枢纽，该口岸已成为中国对东盟的第一大铁路口岸"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:44:20+08:00","size":1,"keywords":[],"body":"中新社云南西双版纳11月20日电 (黄远飞 于浩良)地处云南省中老边境的磨憨出入境边防检查站(下称“磨憨边检站”)20日通报称，11月19日至20日，中老铁路迎来开通近5年来最大入境外国旅游团，共计1270名外国籍旅游团团员从中老边境磨憨铁路口岸顺利入境。\n\n　　磨憨铁路口岸位于云南省西双版纳傣族自治州勐腊县中老边境。作为中老铁路重要枢纽，该口岸已成为中国对东盟的第一大铁路口岸。\n\n11月19日，旅客走在中老边境磨憨铁路口岸站台上。黄远飞 摄\n\n　　此次入境的外国旅游团由泰国、老挝、缅甸、柬埔寨的旅客组成，将前往云南西双版纳进行为期3天的旅游观光活动，随后乘坐中老铁路列车出境。\n\n　　自开通以来，中老铁路运力不断扩容升级。加之240小时过境免签和东盟国家旅游团入境西双版纳144小时过境免签等政策的加持，中老铁路国际旅客列车从开通初期每日2列增至4列，跨境旅客席位由250个提升至420个，通关时间由90分钟压缩至52分钟，昆明南直达万象最快仅需9小时36分。越来越多中外旅客选择乘坐中老铁路列车出行。\n\n11月19日，旅客在中老边境磨憨铁路口岸排队候检。黄远飞 摄\n\n　　据磨憨边检站统计，截至11月19日，该站今年以来在磨憨铁路口岸共计查验出入境旅客超30.9万人次，同比增长超27%。其中，来自世界97个国家和地区的外国籍旅客超4.5万人次。\n\n　　为做好此次大型旅游团的入境检查工作，磨憨边检站多次与文旅部门及相关旅行社沟通协调，启动团队预录预检、前置外国人入境卡填报、开通专用通道等便利化通关措施，组建由精通老挝语、泰国语、英语的民警组成的“国门译站”先锋队担任现场引导和台外执勤，极大提高旅行团通关效率。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c85ab8957cb","title":"民建宜春市委会赴丰城市总支开展“入企联心大走访”活动","url":"https://www.chinanews.com.cn/txy/2026/11-20/10735344.shtml","summary":"11月16日，民建宜春市委会继续开展“入企联心大走访”活动。","summary_short":"11月16日，民建宜春市委会继续开展“入企联心大走访”活动。","digest":"11月16日，民建宜春市委会继续开展“入企联心大走访”活动","points":["市政协副主席、民建市委会主委谢慧带队赴丰城市总支走访调研会员企业…","在江西恒顶食品有限公司，谢慧认真听取企业负责人付爱平关于生产经营、产品研发…","在江西宫鹤堂健康科技有限公司，谢慧一行参观了企业眼健康科普馆，详细了解企业在眼健康科普宣传…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:44:12+08:00","size":1,"keywords":[],"body":"11月16日，民建宜春市委会继续开展“入企联心大走访”活动。市政协副主席、民建市委会主委谢慧带队赴丰城市总支走访调研会员企业，并宣讲中共二十届五中全会精神，副主委兼秘书长谢志鹏、丰城市总支主委涂顾开陪同。\n\n　　在江西恒顶食品有限公司，谢慧认真听取企业负责人付爱平关于生产经营、产品研发、市场开拓等方面情况介绍，详细了解企业在市场竞争、海外市场开拓、跨境物流过程中遇到的压力与现实难题，并认真记录企业提出的意见诉求，为后续建言献策收集第一手资料。\n\n　　在江西宫鹤堂健康科技有限公司，谢慧一行参观了企业眼健康科普馆，详细了解企业在眼健康科普宣传、产品研发、科普公益推广等方面的工作举措与成效，认真记录相关意见建议，并对其深耕中西医结合大健康产业、积极开展科普惠民的做法给予了肯定。\n\n　　在丰城市好人志愿者协会，谢慧详细了解协会组织架构、队伍建设、项目开展等情况，认真听取协会负责人、企业家会员朱永红关于组织开展扶弱济困、文明实践、志愿服务等公益活动的工作介绍，并希望协会继续依托民建资源，凝聚更多公益合力，服务好地方基层治理与精神文明建设。\n\n　　走访过程中，谢慧与企业家会员面对面宣讲中共二十届五中全会精神，引导大家把思想和行动统一到全会部署上来，落实到依法合规经营上来，切实提振信心，创新发展。\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb54b21e285","title":"勇士·NBA｜勇士98:126大敗灰熊 自居利受傷後連續四場至少輸20分","url":"https://www.stheadline.com/basketball-zone/3639332/勇士NBA勇士98126大敗灰熊-自居利受傷後連續四場至少輸20分","summary":"勇士在史堤芬居利(Stephen Curry)缺席下持續低迷，周四對上近期狀態大勇的灰熊再吞一次大敗，作客以98:126告負錄下五連敗，自居利在11日對火箭傷出告負後，勇士隨後四連敗每場至少輸20分。","summary_short":"勇士在史堤芬居利(Stephen Curry)缺席下持續低迷，周四對上近期狀態大勇的灰熊再吞一次大敗…","digest":"勇士在史堤芬居利(Stephen Curry)缺席下持續低迷…","points":["勇士在史堤芬居利(Stephen Curry)缺席下持續低迷…","今戰倫德伯格11投中3僅得11分，樸辛基斯則得15分，勇士自13日對馬刺以85…","而灰熊今場則有卡梅倫保沙以100%命中率攻入16分外加6籃板5助攻延續亮眼表現…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:06:28+08:00","size":1,"keywords":[],"body":"勇士在史堤芬居利(Stephen Curry)缺席下持續低迷，周四對上近期狀態大勇的灰熊再吞一次大敗，作客以98:126告負錄下五連敗，自居利在11日對火箭傷出告負後，勇士隨後四連敗每場至少輸20分。\n勇士五連敗 近四場至少輸20分\n「咖喱仔」在11日對火箭一戰中早段便傷出離場，之後正直八連勝的勇士直接陷入低谷，在今場之前已錄得四連敗， 反觀對手灰熊目前狀態火熱已錄五連勝，而今戰勇士延續低迷表現，火力擔當的樸辛基斯(Brandin Podziemski)、倫德博格(Yaxel Lendeborg)和美爾頓(De'Anthony Melton)失準，單是三人三分出手13球僅中2，全隊出手29次僅入5球，打完半場便以47:55落後，但之後兩節被灰熊持續拉開分差，最終勇土再以98:126吞下五連敗。\n今戰倫德伯格11投中3僅得11分，樸辛基斯則得15分，勇士自13日對馬刺以85:123大敗38分後便開始，加上今場比賽勇士每場落敗都至要輸20分，由有「咖喱仔」座陣的8連勝，到現在的五連敗可見這位老將對球隊的影響力甚大。而灰熊今場則有卡梅倫保沙以100%命中率攻入16分外加6籃板5助攻延續亮眼表現，卡沃特則攻入隊高的19分。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc3f426b4e2","title":"潘毅琴：以国际商事仲裁护航西部陆海新通道建设","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-20/10735229.shtml","summary":"中新网重庆11月20日电 (记者 刘相琳)第八届中国—东盟法治论坛18日至20日在重庆举行，中国法学会党组成员、副会长潘毅琴在论坛上表示，随着中国—东盟经贸合作不断深化，跨境商事争议解决需求日益突出…","summary_short":"中新网重庆11月20日电 (记者 刘相琳)第八届中国—东盟法治论坛18日至20日在重庆举行，中国法学会党组成员…","digest":"第八届中国—东盟法治论坛18日至20日在重庆举行，中国法学会党组成员…","points":["中新网重庆11月20日电 (记者 刘相琳)第八届中国—东盟法治论坛18日至20日在重庆举行…","潘毅琴指出，今年是“十五五”开局之年","西部陆海新通道北接丝绸之路经济带、南连21世纪海上丝绸之路，是连接中国西部与东盟的重要通道"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:49:38+08:00","size":1,"keywords":[],"body":"中新网重庆11月20日电 (记者 刘相琳)第八届中国—东盟法治论坛18日至20日在重庆举行，中国法学会党组成员、副会长潘毅琴在论坛上表示，随着中国—东盟经贸合作不断深化，跨境商事争议解决需求日益突出，仲裁可以也应当发挥更大作用，维护企业海外合法权益，服务高水平对外开放。\n\n图为中国法学会党组成员、副会长潘毅琴在论坛上致辞。中国法学会供图\n\n　　潘毅琴指出，今年是“十五五”开局之年。“十五五”规划纲要提出，加快涉外法治体系和能力建设，健全国际商事调解、仲裁、诉讼等机制。西部陆海新通道北接丝绸之路经济带、南连21世纪海上丝绸之路，是连接中国西部与东盟的重要通道；随着通道建设加快推进，沿线跨境贸易、多式联运和单证融资等商事活动日益密集，国际商事争议相应增多，企业对公正、高效、可预期的争议解决机制需求更为迫切。\n\n　　潘毅琴认为，仲裁是中国法律规定的纠纷解决制度，也是国际通行的纠纷解决方式，具有专业、保密、灵活等优势，裁决跨境承认与执行便利，是维护企业海外合法权益、服务高水平对外开放的重要法治保障。\n\n　　“中国仲裁事业发展迅速，但仍需在理论研究、制度型开放、人才培养和国际交流上持续用力。”潘毅琴建议，深化仲裁理论研究，加强制度型开放，共育涉外仲裁人才，搭建国际交流平台。\n\n　　潘毅琴表示，涉外法治建设事关国家发展大局，国际商事仲裁是涉外法治的重要前沿阵地。中国法学会愿与各方携手，以扎实研究回应实践问题，以务实交流增进相互了解，共同推动新时代国际商事仲裁事业高质量发展，为加强涉外法治建设、服务高水平对外开放作出新的贡献。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4ea0646fbe","title":"第四届重庆消博会开幕 近50个国家千余品牌汇聚山城","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-20/10735204.shtml","summary":"中新网重庆11月20日电 (记者 刘相琳)第四届重庆国际消费品博览会暨遇见巴蜀·国际融合采洽会20日在重庆开幕，会期持续至23日，吸引近50个国家和地区、20余个国际及国内行业机构…","summary_short":"中新网重庆11月20日电 (记者 刘相琳)第四届重庆国际消费品博览会暨遇见巴蜀·国际融合采洽会20日在重庆开幕…","digest":"第四届重庆国际消费品博览会暨遇见巴蜀·国际融合采洽会20日在重庆开幕…","points":["中新网重庆11月20日电 (记者 刘相琳)第四届重庆国际消费品博览会暨遇见巴蜀·国际融合采洽…","“我们是首次来到这一平台，已充分感受到其规模、技术水平与务实导向","”俄罗斯哈卡斯共和国政府行政长官顾问克鲁茨基赫·米哈伊尔·亚历山德罗维奇说…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:40:14+08:00","size":1,"keywords":[],"body":"中新网重庆11月20日电 (记者 刘相琳)第四届重庆国际消费品博览会暨遇见巴蜀·国际融合采洽会20日在重庆开幕，会期持续至23日，吸引近50个国家和地区、20余个国际及国内行业机构、近20个省市的600家企业、1000余种消费品牌参展。\n\n图为活动现场。活动主办方供图\n\n　　本届展会设置陆海优品国内展区和陆海优品国际展区，同期举办首届重庆咖啡烘焙·潮流饮品展、KAWEH·重庆国际爵士咖啡音乐嘉年华。2026重庆与东盟国家经贸合作对接会、中国(重庆)—俄罗斯经贸对接洽谈会、“渝品云集”电子商务资源对接会、2026外贸优品中华行重庆站南岸区巡展以及系列行业主题对接会贯穿会期，努力实现展商有订单、市民有体验、城市有热度。\n\n　　走进陆海优品国际展区，来自欧洲、美洲、亚洲、非洲、大洋洲的商品琳琅满目，展品涵盖进口食品、酒水饮料、工艺品、珠宝首饰、日化洗护、家居用品等千余品类。“我们是首次来到这一平台，已充分感受到其规模、技术水平与务实导向。”俄罗斯哈卡斯共和国政府行政长官顾问克鲁茨基赫·米哈伊尔·亚历山德罗维奇说，中国在哈卡斯对外贸易额中的占比约为25%，重庆消博会能与生产商直接对接，争取更优惠价格，并建立长期合作关系。\n\n图为市民在现场逛展。活动主办方供图\n\n　　缅甸缅族企业家协会联合秘书长陶达琳则把目光投向物流互联互通。她说，缅甸香米曾于2011年和2026年两度荣获世界最佳大米奖，但优质农产品要走向全球，离不开可靠运输、现代仓储与冷链体系；缅方希望加强与西部陆海新通道的衔接，推动数字化转型，并欢迎中国企业赴缅投资。\n\n　　重庆市贸促会会长、致公党重庆市委会副主委邓琳表示，此次活动以展会为载体，精准邀约境外品牌商、采购商、渠道商组团参展观展，搭建供需对接、商贸洽谈、品牌推介一体化服务场景，推动海外优质消费品直达国内市场，助力本土特色产品借船出海，不断放大消博会溢出效应和辐射带动作用。未来，重庆市贸促会将持续导入优质国际工商合作资源，深耕客商资源、创新办展模式、丰富配套活动，推动消博会常办常新、越办越实，更好助力重庆国际消费中心城市建设，促进内外贸一体化协同发展。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc7b721bc1d","title":"多年“蛰伏”，终迎“星光”——专访S16冠军战队BLG","url":"https://www.chinanews.com.cn/ty/2026/11-20/10735215.shtml","summary":"中新网上海11月20日电 题：多年“蛰伏”，终迎“星光”——专访S16冠军战队BLG  　　中新网记者 王笈  　　北京时间11月15日，美国纽约，2026英雄联盟全球总决赛(S16…","summary_short":"中新网上海11月20日电 题：多年“蛰伏”，终迎“星光”——专访S16冠军战队BLG  　　中新网记者 王笈  　　北京…","digest":"多年“蛰伏”，终迎“星光”——专访S16冠军战队BLG","points":["北京时间11月15日，美国纽约，2026英雄联盟全球总决赛(S16…","当中国战队BLG(Bilibili Gaming)的队员们共同举起象征S赛最高荣誉的召唤师奖…","BLG电竞俱乐部负责人林青19日晚在上海接受中新网记者专访时表示…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:37:44+08:00","size":1,"keywords":[],"body":"中新网上海11月20日电 题：多年“蛰伏”，终迎“星光”——专访S16冠军战队BLG\n\n　　中新网记者 王笈\n\n　　北京时间11月15日，美国纽约，2026英雄联盟全球总决赛(S16，下称“S赛”)的终局画面定格在基地水晶碎裂的瞬间。当中国战队BLG(Bilibili Gaming)的队员们共同举起象征S赛最高荣誉的召唤师奖杯，欢呼声在相隔1万多公里的上海线下观赛点冲破穹顶。\n\n　　BLG电竞俱乐部负责人林青19日晚在上海接受中新网记者专访时表示，这是中国LPL赛区战队时隔5年再次捧起召唤师奖杯，也是LPL赛区战队首次在单届S赛“一穿四”韩国LCK赛区(指淘汰该赛区4支战队)，具有里程碑式的意义。\n\nBLG(Bilibili　Gaming)战队捧起2026英雄联盟全球总决赛(S16)冠军奖杯。　B站供图\n\n　　战队回到上海的第二天，记者在B站总部见到了BLG上单Bin(陈泽彬)。他用“百折不挠”四个字概括本次S赛之旅，“我们确实遇到了很多坎坷和失利，特别是瑞士轮2胜2负(生死战)的时候，大家都压力比较大，最后还是互相加油、支撑着走了下去”。直到纽约捧起奖杯的那一刻，所有坚持终成“值得”，“我真的特别开心，每个选手都想拿‘S冠’，我完成了这个梦想”。\n\n　　除了“S冠”，BLG中单Knight(卓定)还获封本届S赛FMVP(总决赛最有价值选手)。他印象最深刻的是决赛第二局，“当时我们已经被1比0领先了，所以这一局很关键，我们打的时候压力很大，撑了50多分钟才赢下，观众也都看得很激动”。而在扳平比分后，BLG越战越勇，最终以3比1取胜。\n\n　　林青在复盘决赛时指出，“拉锯战”的胜利在关键比赛里，往往决定了“天平”的倾斜方向，“BLG在关键时刻迸发出了很团结的精神和能量，这是我们获胜的至宝之一”。当赛场上的冠军烟火、观众席的应援“星光”都为BLG闪耀，林青既激动，又有点意料之外的平静，“我的脑海里浮现出很多‘来时路’的画面，从建队到拿下这座奖杯，这一路的起起伏伏铺满思绪，会有一种忧伤感”。\n\n　　2017年，B站组建BLG，正式进入英雄联盟职业电竞领域，并持续投入。两年前的S14决赛，BLG与T1打满5局后惜败；两年后的S16半决赛，BLG成功阻止T1冲击四连冠，也终结了十多年来T1在S赛BO5(五局三胜制)对LPL赛区战队的不败纪录。从伦敦的“眼泪”，到纽约的“星光”，所有“蛰伏”终成荣光。\n\n　　在Knight看来，“打职业”的这几年，自己最大的成长就是心态更好了，“决赛能赢，我觉得我们每个人的状态和心态都比对手好，他们比赛时没有我们那么放松”。Knight同时深感，自己对想法的表达也更多了，“以前可能只会看自己、顾好自己打得怎么样，现在也会和大家交流，比如队友哪方面做得更好”。\n\n　　当粉丝们仍在津津乐道那个难忘的凌晨，BLG电子竞技俱乐部基地却已恢复平静。Bin给自己点了一份热干面外卖，Knight的日常与过去无数个训练日并无区别……他们仿佛只是走了一段很长的路，然后站上了新的起点。“我其实有挺多想做的事情”，Knight说，这个冠军将支撑着他去一一完成。\n\n　　谈及BLG的未来发展，林青则透露，战队依旧会专注于自己的赛训及青训人才的培养，并把目标定在下一次国际赛事的奖杯。“这次S赛决赛，有超2000万人在B站直播间共同见证了我们的夺冠时刻，感谢大家凌晨还守在屏幕前支持我们，希望未来我们能收获更多冠军。”(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cef2d67904c","title":"福州匠人深耕传统古建筑彩绘 “无痕修复”让濒危的古建纹饰重生","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-20/news1075560.shtml","summary":"在福建福州的古厝街巷间，不少斑驳雅致的彩绘纹样通过“无痕修复”，虽历经风雨，依旧鲜活流转。","summary_short":"在福建福州的古厝街巷间，不少斑驳雅致的彩绘纹样通过“无痕修复”，虽历经风雨，依旧鲜活流转。","digest":"在福建福州的古厝街巷间，不少斑驳雅致的彩绘纹样通过“无痕修复”，虽历经风雨…","points":["在福建福州的古厝街巷间，不少斑驳雅致的彩绘纹样通过“无痕修复”，虽历经风雨，依旧鲜活流转","其中有不少出自闽侯传统古建筑彩绘技艺非遗技艺县级代表性传承人、福建省手工艺大师张和荣之手","闽侯传统古建筑彩绘独具地域特色，是民居墙头的戏曲纹样、博古图案，是祠堂梁枋的二十四孝…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T14:16:06+08:00","size":1,"keywords":[],"body":"在福建福州的古厝街巷间，不少斑驳雅致的彩绘纹样通过“无痕修复”，虽历经风雨，依旧鲜活流转。其中有不少出自闽侯传统古建筑彩绘技艺非遗技艺县级代表性传承人、福建省手工艺大师张和荣之手。\n\n闽侯传统古建筑彩绘独具地域特色，是民居墙头的戏曲纹样、博古图案，是祠堂梁枋的二十四孝、三国典故，承载着家风家训、民俗文化与美好祈愿。然而，岁月侵蚀、风雨冲刷，会让众多古建彩绘斑驳剥落、灰塑破损，而张和荣的工作，便是让这些濒危的古建纹饰重获新生。\n\n深耕古建筑彩绘、灰塑与古壁画修复领域三十余年，张和荣参与过于山白塔、三坊七巷、上下杭等众多重点文保建筑的修缮。他告诉记者，古建筑彩绘从不是单一的绘画艺术，而是集灰塑打底、泥浆塑形、颜料配比、纹样绘制于一体的系统技艺。\n\n为盘活非遗资源、拓宽传承路径，这些年张和荣一直在探索新的传承方式。为此，他积极参与非遗公益体验活动，开展泥塑、古建彩绘科普体验，让青少年近距离感受传统技艺魅力。(吴晟炜 陈堡)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/057D972DB40B4AADBA6FAD3040D76B24.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c51d5234eee","title":"荃灣老字號「鼎大」罕有開大閘！突發開倉平賣港產廚具/煲具低至$50 網民：唔買都一定要入去望望","url":"https://www.stheadline.com/shop/3639253/荃灣老字號鼎大罕有開大閘突發開倉平賣港產廚具煲具低至50-網民唔買都一定要入去望望","summary":"位於荃灣的「鼎大Ting Tai」一向緊閉大門，相當神秘，日前突發打開大門舉行開倉，平賣港產廚具、煲具，吸引大批市民及網民入場「尋寶」。","summary_short":"位於荃灣的「鼎大Ting Tai」一向緊閉大門，相當神秘，日前突發打開大門舉行開倉，平賣港產廚具、煲具…","digest":"位於荃灣的「鼎大Ting Tai」一向緊閉大門，相當神秘，日前突發打開大門舉行開倉…","points":["位於荃灣的「鼎大Ting Tai」一向緊閉大門，相當神秘，日前突發打開大門舉行開倉…","有網民難掩興奮，直言首次遇到「鼎大」開門，「唔買都一定要入去望望」","由於反應極為熱烈，官方專頁隨即宣佈即將加推開倉日"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T13:45:18+08:00","size":1,"keywords":[],"body":"位於荃灣的「鼎大Ting Tai」一向緊閉大門，相當神秘，日前突發打開大門舉行開倉，平賣港產廚具、煲具，吸引大批市民及網民入場「尋寶」。有網民難掩興奮，直言首次遇到「鼎大」開門，「唔買都一定要入去望望」。由於反應極為熱烈，官方專頁隨即宣佈即將加推開倉日。\n罕有開大閘！荃灣老字號「鼎大」開倉平賣港產廚具/煲具\n位於荃灣大涌道52號的「鼎大Ting Tai」（三元牌）近日罕有敞開大閘舉行開倉活動，消息於社交平台Threads上迅速傳開，不少市民趁機入內參觀購物。有多名網民發文分享是次開倉體驗。其中一名網民更難掩興奮，表示「第一次見佢打開門，唔買都一定要入去望望」，更指當時「聽到路過行人都係同我相同心態」。另一位網民則分享了場內貨品及價格資訊，指出是次「鼎大開倉，款式唔算太多」，但勝在價格親民，其中一款煲具更只需「$50 1個」。該網民笑言自己「咁啱經過望咗眼」，並形容現場充滿「好懷舊嘅感覺」。\n網民反應熱烈 品牌預告再度開倉\n「鼎大Ting Tai」創立於1945年，為香港歷史悠久的本土金屬廚具及家庭用品咖牌，品牌旗下最為人熟知的「三元牌」以生產高質素鋁製及不鏽鋼廚具聞名，昔日更是家家戶戶必備的經典港產品牌，見證了香港工業的黃金時代。此外，「三元牌」所生產的港式奶茶壺亦被不少奶茶師傅所選用，茶壺設計更是配合沖製港式奶茶而打造。\n「鼎大」創立初期的廠房設於九龍青山道，直至1981年才正式遷往荃灣沙咀道現址，生產線其後北移至廣東南海。面對大批市民的熱情支持，「鼎大」官方專頁亦發文致謝，直言「尋日開倉，真係估唔到有咁多人嚟，仲有咁多人喺 Threads 分享同留言。每一個留言我哋都有睇，好感動，衷心多謝」。鑑於不少網民表示突發開倉一天「趕唔切」，官方宣佈將於11月26日（星期四）中午12:00至下午3:30，再次於荃灣鼎大正門開倉。官方提醒市民現場「只收現金」，貨品更是「數量有限，售完即止」，並指由於「人手有限，如果當日人多要等，請大家多多包涵」。 \n「鼎大」限時開倉\n 日期：11月26日\n 時間：中午12:00至下午3:30\n 地點：荃灣大涌道52號鼎大正門（即沙咀道68號，入口位於大涌道）\n *只收現金\n文:M\n資料及圖片來源:wingmarumo@Threads授權轉載、鼎大官方網頁\n延伸閱讀：AEON Black Friday開鑼！家電/零食/Häagen-Dazs雪糕低至半價 必搶$189廚具福車/週末任裝放題","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6269702a36","title":"进入高发季！出现这6个信号，可能是心梗","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735122.shtml","summary":"寒潮来袭  急性心肌梗死(简称心梗)  也进入每年的高发季节  今天(11月20日)是\r  中国心梗救治日  这一天提醒我们记住  两个与生命有关的“120”：  出现疑似心梗症状  应及时拨打“12…","summary_short":"寒潮来袭  急性心肌梗死(简称心梗)  也进入每年的高发季节  今天(11月20日)是\r  中国心梗救治日  这一天提醒…","digest":"寒潮来袭  急性心肌梗死(简称心梗)  也进入每年的高发季节  今天(11月20日)…","points":["应及时拨打“120”急救电话","胸部不适：胸痛、胸闷、压迫感或紧缩感，可持续存在10多分钟，也可能反复出现","冷汗、头晕或心慌：可能突然出冷汗、头晕，部分患者伴有明显不安或晕厥"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:22:21+08:00","size":1,"keywords":[],"body":"寒潮来袭\n\n急性心肌梗死(简称心梗)\n\n也进入每年的高发季节\n\n今天(11月20日)是\r\n\n中国心梗救治日\n\n这一天提醒我们记住\n\n两个与生命有关的“120”：\n\n出现疑似心梗症状\n\n应及时拨打“120”急救电话\n\n心梗救治，争取黄金120分钟\n\n那么，心梗发生前\n\n身体会发出哪些危险信号？\n\n01\n\n心梗发生前的6个预警信号\n\n　　心梗发作时，一定会胸口剧痛吗？\n\n　　不一定。有些患者心梗时表现为明显胸痛，有些患者只感到胸闷、气短、恶心或异常疲惫，容易被误认为普通的身体不适。\n\n　　当身体出现以下6个预警信号时，一定要及时就医：\n\n　　胸部不适：胸痛、胸闷、压迫感或紧缩感，可持续存在10多分钟，也可能反复出现。\n\n　　放射性疼痛：不适可能出现在肩背、手臂、颈部或下颌等部位。\n\n　　呼吸困难：突然气短、呼吸费力，有时并不伴随明显胸痛。\n\n　　消化道不适：上腹疼痛、恶心、呕吐或类似烧心的感觉，容易与胃病混淆。\n\n　　异常疲惫：出现难以解释的明显疲劳、乏力，有时轻微活动就感到疲惫。\n\n　　冷汗、头晕或心慌：可能突然出冷汗、头晕，部分患者伴有明显不安或晕厥。\n\n　　女性、老年人及糖尿病患者的症状可能不典型。上述表现并非心梗所特有，但如果出现突然、持续或反复的可疑症状，尤其伴有胸部不适、气短、冷汗，应立即拨打120。\n\n心梗并非老年人“专属”\n\n越来越需要引起重视\n\n一旦怀疑发生心梗\n\n及时正确应对至关重要\n\n02\n\n突发心梗怎么办？\n\n　　自己心梗发作\n\n　　若突然出现胸痛、冒冷汗、喘不上气、视线模糊等症状，怀疑自己心梗发作且身边无人时，千万不要捶胸、用力咳嗽，也不要自行驾车前往医院。\n\n　　发病后的120分钟内进行救治非常关键，因此应立即拨打120，准确告知急救人员症状及所在位置，保持安静以减少心脏负担。在专业指导下使用阿司匹林、硝酸甘油等药物。\n\n　　遇他人心梗\n\n　　除上述操作外，如果患者无反应且没有正常心跳、呼吸，应立即进行心肺复苏，并尽快取用自动体外除颤器(AED)，抓住“黄金4分钟”。\n\n提醒大家\n\n心梗存在比较明显的时段规律\n\n清晨和寒冷季节相对高发\n\n心梗早期的识别很重要\n\n黄金急救时间在2小时左右\n\n当出现高度疑似心梗的症状时\n\n不要存在侥幸心理\n\n及时拨打急救电话 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7452bf9352","title":"似睡非睡4年 竟拖成顽固性失眠","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735121.shtml","summary":"今年52岁的张女士(化姓)，被失眠折磨四年有余。","summary_short":"今年52岁的张女士(化姓)，被失眠折磨四年有余。","digest":"今年52岁的张女士(化姓)，被失眠折磨四年有余","points":["今年52岁的张女士(化姓)，被失眠折磨四年有余","起初只是入睡稍慢，她误以为这是更年期的正常表现，居家调理就能好转","她尝试过泡脚、食疗，也断断续续服用过多种助眠药物，但睡眠问题反反复复"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:18:41+08:00","size":1,"keywords":[],"body":"今年52岁的张女士(化姓)，被失眠折磨四年有余。起初只是入睡稍慢，她误以为这是更年期的正常表现，居家调理就能好转。她尝试过泡脚、食疗，也断断续续服用过多种助眠药物，但睡眠问题反反复复。发展到后期，她躺在床上几小时毫无睡意，夜里频繁惊醒，整夜处于似睡非睡的状态。直到前往南京市妇幼保健院麻醉治疗与睡眠门诊就诊，才得知自己已经发展成为顽固性失眠。\r\n\n　　该院麻醉科主任医师王伟提醒，如果已经出现较长时间的睡眠困扰，不要再继续自己摸索调理，应及时就医，避免错过最佳干预时机。\n\n　　很多人觉得顽固性失眠就是睡眠时间不够，但其实二者并不等同。王伟介绍，顽固性失眠属于慢性失眠里的难治类型，问题核心往往不在于睡眠时长的缺乏，而在于睡眠质量差。即便有充足的休息时间、良好的睡眠环境，先后经过生活调整、常规理疗、普通药物治疗，睡眠依旧没有明显改善，并且已经对日常生活造成持续的负面影响，这才是顽固性失眠。\n\n　　因突发事件、压力造成数日睡不着属于短期失眠(普通人遇到变故带来的短暂睡不着)，一般病程很短，经过调整大多能够恢复。\n\n　　顽固性失眠有一些典型的特征，比如病程时间较长，存在入睡困难、睡眠浅、夜间频繁惊醒、早醒等问题，每周至少出现3晚，持续超过三个月；作息基本规律，卧室安静避光，不存在长期夜班、熬夜刷手机等人为压缩睡眠的行为，客观条件适合睡觉，但大脑依旧无法正常进入睡眠；已经试过生活方式调整、安神保健品、中药、常规安眠药物等多种方式，睡眠改善十分有限，就算短暂好转也会很快复发；同时白天已经出现明显不适，例如浑身疲惫、记忆力下降、注意力涣散，还经常心慌烦躁、情绪低落。\n\n　　当然，顽固性失眠并不是无法改善，但治疗周期相对较长，所以不建议患者单纯依靠自行吃药或者居家调理解决问题。王伟提醒，这类失眠大多是睡眠节律出现紊乱，失眠拖得越久，越容易形成心理负担，进一步加重睡眠问题。每个人恢复情况各不相同，一定要尽早到睡眠专科就诊评估，不要等到发展成顽固性失眠再就医。\n\n　　通讯员 张沁沁 扬子晚报/紫牛新闻记者 许倩倩 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2d15e1a3b1","title":"出现红斑揉一揉，再用气圈垫一垫？ 这些“好心护理法”正在加重压疮","url":"https://www.chinanews.com.cn/jk/2026/11-20/10735118.shtml","summary":"11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)。","summary_short":"11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)。","digest":"11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)","points":["11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)","2026年国际官方主题为：每一个动作，皆有意义","随着我国逐渐步入老龄化社会，大量卧床老人的居家照护问题日益显著…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T11:14:05+08:00","size":1,"keywords":[],"body":"11月的第三个星期四，是世界压疮预防日(全球压力性损伤预防日)。2026年国际官方主题为：每一个动作，皆有意义。随着我国逐渐步入老龄化社会，大量卧床老人的居家照护问题日益显著，而其中一个非常重要且容易被大家忽视的问题就是压疮。\r\n\n　　南京市中西医结合医院中医外科(疮疡科)主任中医师黄子慧提醒，不少人认为压疮就是“躺久了磨出来的”，这是对压疮发病机制的片面理解，不同人群的压疮风险特点不同，预防和治疗的侧重点也有差异。\n\n　　通讯员 杨璞 扬子晚报/紫牛新闻记者 许倩倩\n\n　　压疮不只是“躺久了磨出来的”\n\n　　压疮的本质是局部组织长期受压，血液循环障碍导致的缺血、缺氧性坏死，除了压力外，摩擦力(比如拖拽卧床患者时皮肤和床单的摩擦)、剪切力(半卧位时身体下滑，皮肤和深层组织发生相对位移)、潮湿(汗液、尿液长期浸渍皮肤)、营养不良、外周血管疾病等都是核心诱因。\n\n　　“像部分晚期肿瘤、糖尿病患者，即使每小时翻身一次，依然可能因为自身微循环障碍出现压疮。压疮预防是包含体位管理、皮肤护理、营养支持、基础疾病控制的系统工程，翻身只是其中的一个环节。”黄子慧说。\n\n　　对于压疮的常见错误认知还有很多，比如不少家属发现患者受压部位皮肤发红，第一反应是按揉局部“活血”，殊不知，此举有时反而会加重组织损伤。当发现红斑指压不褪色，同时伴随局部发硬、水疱，说明已经进展为1期或2期压力性损伤，此时不要自行按揉、热敷，要及时咨询医护人员处理。\n\n　　还有家属会给患者使用气垫圈、橡胶圈垫在红肿部位，以为能减轻压力，减少压疮风险。事实上，气垫圈的环形结构会导致圈的边缘部位压力集中，压迫红肿区域周围的血液循环，反而扩大缺血范围，正确的做法是选用软硬度合适的减压床垫(如泡沫床垫、充气减压床垫)，足跟、肘部等骨突部位可以用软海绵垫、泡沫敷料进行局部减压，避免直接接触床面。\n\n　　关于伤口护理的常见误区，就是“干燥结痂就是好得快”，实际上湿性愈合环境下的伤口修复速度比干燥环境快30%-50%。如果压疮伤口敞着，表面会形成硬痂，痂皮下方的渗液无法引流，反而会向深部组织渗透，导致创面加深、感染。\n\n　　“压疮不是‘小病’，不是自己在家涂点药膏、换换药就能解决的问题。如果创面越来越深、甚至露出骨头，往往可能已经合并深部组织感染、骨髓炎、败血症等严重并发症。”黄子慧表示，压疮的严重程度和创面深度也并不完全成正比，部分看似只有硬币大小的浅表创面，下方可能已经形成了深达肌肉的窦道，普通家属很难准确判断。建议只要出现指压不褪色的红斑、水疱，就应第一时间到医院就诊。\n\n　　需要注意的是，一些表面没有破溃的皮肤，皮下组织也可能已经发生了坏死。这种情况在肥胖患者、使用减压床垫的患者中尤其常见。\n\n　　黄子慧提醒，除了看皮肤颜色，还要用手摸一摸有没有发硬、波动感、疼痛感，一旦发现异常就要及时就诊。压疮是高复发性疾病，曾经得过压疮的患者，局部皮肤和皮下组织的结构已经受损，微循环比正常部位差，复发风险是普通人群的2—3倍。对于长期卧床、脊髓损伤、晚期肿瘤、糖尿病等高危人群，压疮预防是需要长期坚持的日常工作，即使之前的压疮已经完全愈合，依然要定期评估风险、坚持规范的体位管理和皮肤护理。\n\n　　中西医结合，不同人群分类防治\n\n　　西医的压疮预防以风险评估、体位管理、减压器具使用为核心，在此基础上加入中医“未病先防”的干预手段，能让高危人群的压疮发生率下降。对于已经形成的2期以上压力性损伤，需要彻底清除坏死组织，否则创面很难愈合。西医的外科清创、水刀清创、酶解清创能够快速清除大块的坏死组织，但对于创面缝隙里的少量腐肉、深部窦道的坏死组织，清理难度大，还容易损伤正常肉芽。此时配合中医的化腐生肌类外用药，能够利用药物的拔毒作用，让残留的坏死组织慢慢溶解、脱落，不会损伤新生的肉芽组织。\n\n　　压疮愈合后，西医的康复指导以功能锻炼、营养支持为主，配合中医的艾灸、药膳调理、经络按摩等手段，能够进一步改善患者的全身状态，降低复发风险。\n\n　　针对不同人群压疮防治的注意事项，黄子慧也做了详细介绍：\n\n　　老年卧床人群：重点关注皮肤状态的细微变化，因为老年人皮肤薄、敏感性差，压疮进展速度比年轻人快很多，可能短短24小时就会从红斑进展为深部破溃，建议每天至少检查2次全身皮肤，每周做1次压疮风险评估。\n\n　　脊髓损伤人群：因为感觉功能障碍，患者无法感知局部压迫的疼痛感，压疮复发率极高，建议每1—2小时翻身一次，使用动态减压床垫，骨突部位常规使用泡沫敷料预防，同时每年定期到疮疡科做皮肤检查。\n\n　　糖尿病合并压疮人群：此类人群因为外周神经病变和微循环障碍，压疮愈合难度大，感染风险高，除了创面处理外，一定要严格控制血糖，将空腹血糖控制在7.8mmol/L以下，餐后血糖控制在10mmol/L以下，才能保证创面顺利愈合。\n\n　　术后卧床人群：术后1—3天是压疮高发期，尤其是骨科术后、全麻术后的患者，因为活动受限、疼痛不敢翻身，家属要主动协助患者每2小时翻身一次，重点关注骶尾部、足跟、肩胛等部位，避免压疮发生。 【编辑:李岩】","image":"","video":"","video_poster":
