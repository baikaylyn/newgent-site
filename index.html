醫療器械科網頁"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"​衞生署轄下的醫療器械諮詢委員會（委員會）今日（十一月十九日）舉行首次會議，就政府正積極籌備建立的醫療器械法定規管體系提供意見，以期從安全、質量及性能方面完善規管在香港供應的醫療器械，從而保障公眾健康，促進醫療器械業界有序及持續發展，助力香港成為國際醫療創新樞紐。\n\n　　委員會由趙偉仁教授出任主席，成員包括醫學界、工程界和創新科技界代表。成員名單載於衞生署醫療器械科網頁。\n\n　　《香港特別行政區經濟和社會發展第一個五年規劃（2026—2030年）》及《行政長官2026年施政報告》均指出，政府會全面深化藥械監管改革，完善監管體系，並成立藥物及醫療器械監督管理中心。政府正有序推進多項工作，包括推動立法改革，建立新的醫療器械法定規管體系，涵蓋醫療器械推出市場前後各個風險管理環節。衞生署期望透過委員會廣泛而全面地吸納不同持份者的真知灼見，以建立一套清晰可行、具前瞻性，同時切合香港情況，並與國際接軌的醫療器械法定規管框架，為香港發展成為國際醫療創新樞紐提供更有力的制度支撐。\n\n　　會上，衞生署代表介紹現行自願參與的「醫療器械行政管理制度」在過去20多年來的運作成果，以及政府有關規管本港醫療器械的立法建議。委員會全力支持政府秉持以下重要原則，推展相關立法工作：\n\n（一）保障公眾安全和健康；\n\n（二）促進創新發展；\n\n（三）與國際監管標準接軌；\n\n（四）承接本港行政制度經驗；\n\n（五）聚焦源頭管理，要求供應鏈上游的貿易商申領牌照；及\n\n（六）按風險為本原則，有序推行醫療器械分級註冊。\n\n 除了在建立醫療器械法定規管體系期間，為衞生署蒐集及反映持份者意見外，委員會亦會就「醫療器械行政管理制度」的運作及過渡安排向署方提供意見。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc4b8908640","title":"哈薩克斯坦品牌ADILI在港開設首間海外門店 彰顯香港與中亞日益緊密的聯繫","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111800439.htm","summary":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店，成為首批進駐香港的中亞零售品牌之一。","summary_short":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店…","digest":"投資推廣署歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店…","points":["​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦…","ADILI以其受哈薩克傳統裝飾啓發而創作的原創印花圖案而聞名…","ADILI落戶香港，反映香港積極深化與中亞的經貿及文化聯繫，並加強「一帶一路」連結"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"​投資推廣署今日（十一月十九日）歡迎哈薩克斯坦時裝及紡織品牌ADILI於山頂開設期間限定旗艦店，成為首批進駐香港的中亞零售品牌之一。ADILI以其受哈薩克傳統裝飾啓發而創作的原創印花圖案而聞名，該品牌特別為新店推出以香港為靈感的膠囊系列，與其廣受好評的經典系列一同發售。 \n\n　　ADILI落戶香港，反映香港積極深化與中亞的經貿及文化聯繫，並加強「一帶一路」連結。投資推廣署於二○二五年及二○二六年出訪中亞，包括哈薩克斯坦，與當地企業交流，介紹香港蘊藏的機遇，並探討嶄新合作領域。開店前夕，投資推廣署於十一月十七日舉行交流會，連繫在港哈薩克斯坦商界並促進兩地文化交流。\n\n　　投資推廣署署長劉凱旋表示：「ADILI的當代哈薩克設計為香港國際化的零售市場增添一道絢麗色彩。品牌落戶反映香港與中亞的文化聯繫日益深厚，這亦是推動更廣泛經貿合作的重要動力。投資推廣署會善用環球網絡和行業專業知識，致力吸引更多像ADILI一般，來自中亞以至其他地區的出眾品牌，以香港為基地拓展全球業務。」\n\n　　ADILI聯合創辦人Indira Adil表示：「香港是亞洲時裝、生活品味及國際零售市場的交匯點。在港開店是我們邁向國際舞台的重要第一步。我們非常感謝投資推廣署的支援，包括提供市場資訊、實戰指導及聯繫本地人脈，使我們得以成功進駐香港市場。」\n\n　　ADILI聯合創辦人兼創意總監Assel Adil表示：「我們以香港為靈感的膠囊系列，開展了當代哈薩克設計與這個充滿活力的城市之間的對話，將原創印花背後的傳統裝飾藝術，與香港的色彩和特質融為一體。我們期待與香港大眾及來自世界各地的旅客分享這個系列。」\n\n　　Indira Adil和Assel Adil兩姊妹於二○一○年創立ADILI，在哈薩克斯坦的設計工作室創作其原創印花圖案，產品涵蓋時裝、配飾、家居紡織品及禮品。ADILI在哈薩克斯坦各地設有零售店，香港店是品牌進軍國際市場的第一步。\n\n　　如欲了解更多關於ADILI的資訊，請瀏覽shopadili.com。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c441c2c7ad9","title":"挪威、英國和荷蘭部分地區禽肉及禽類產品暫停進口","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900361.htm","summary":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）宣布，因應世界動物衞生組織通報，指挪威阿格德爾郡Lindesnes Municipality…","summary_short":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）宣布，因應世界動物衞生組織通報…","digest":"食物環境衞生署食物安全中心宣布，因應世界動物衞生組織通報…","points":["食物環境衞生署食物安全中心（中心）今日（十一月十九日）宣布，因應世界動物衞生組織通報…","中心發言人說，香港目前與挪威只建立禽肉進口機制，並無禽蛋進口機制","根據政府統計處的資料，本港今年首九個月從挪威進口約二十公噸冷藏禽肉…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:00:00+08:00","size":1,"keywords":[],"body":"食物環境衞生署食物安全中心（中心）今日（十一月十九日）宣布，因應世界動物衞生組織通報，指挪威阿格德爾郡Lindesnes Municipality、英國林肯郡西林齊區和荷蘭弗里斯蘭省爆發高致病性H5N1禽流感，中心即時指示業界暫停從上述地區進口禽肉及禽類產品（包括禽蛋），以保障本港公眾健康。 \n\n　　中心發言人說，香港目前與挪威只建立禽肉進口機制，並無禽蛋進口機制。根據政府統計處的資料，本港今年首九個月從挪威進口約二十公噸冷藏禽肉、從英國進口約六百八十公噸冰鮮和冷藏禽肉及約二十二萬隻禽蛋，以及從荷蘭進口約七百九十公噸冷藏禽肉。 \n\n　　發言人說：「中心已就事件聯絡挪威、英國和荷蘭當局，並會繼續密切留意世界動物衞生組織及有關當局發出關於爆發禽流感的消息，因應當地疫情發展，採取適當行動。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce1b0cf8cac","title":"香港知識產權學院啓動 培育跨專業人才推動創新成果轉化","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900250.htm","summary":"香港知識產權學院今日（十一月十九日）正式啓動，為各行各業提供更有系統和認受性的知識產權在職培訓，壯大香港知識產權人才庫，支持香港深化區域知識產權貿易中心建設。","summary_short":"香港知識產權學院今日（十一月十九日）正式啓動，為各行各業提供更有系統和認受性的知識產權在職培訓，壯大香港知識產權人才庫…","digest":"香港知識產權學院正式啓動，為各行各業提供更有系統和認受性的知識產權在職培訓…","points":["香港知識產權學院今日（十一月十九日）正式啓動，為各行各業提供更有系統和認受性的知識產權在職培…","學院首個基礎課程亦於今明兩日在亞洲知識產權營商論壇期間舉行","署理商務及經濟發展局局長陳百里博士今日在香港會議展覽中心出席學院開幕典禮"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T17:00:00+08:00","size":1,"keywords":[],"body":"香港知識產權學院今日（十一月十九日）正式啓動，為各行各業提供更有系統和認受性的知識產權在職培訓，壯大香港知識產權人才庫，支持香港深化區域知識產權貿易中心建設。學院首個基礎課程亦於今明兩日在亞洲知識產權營商論壇期間舉行。\n\n　　署理商務及經濟發展局局長陳百里博士今日在香港會議展覽中心出席學院開幕典禮。他致辭時表示：「國家《十五五規劃綱要》明確支持香港深化區域知識產權貿易中心建設。《香港第一個五年規劃》亦提出，透過成立知識產權學院，有系統地培育各知識產權密集行業所需的人才，讓他們掌握知識產權創造、保護、管理、融資、運用及商品化等方面的知識和技能，進一步推動香港知識產權生態圈發展。今日學院正式啓動，正是落實這項工作的重要一步。」\n\n　　他續指，知識產權不只關乎法律保障和權利註冊，更與科研成果轉化、品牌發展、授權和交易密切相關。期待學院匯聚業界力量、連接國際資源，為香港建設區域知識產權貿易中心培育人才，並為國家創新發展作出更大貢獻。\n\n　　學院由知識產權署與職業訓練局（職訓局）合作成立。政府在二零二六至二七年度《財政預算案》預留5,200萬元，支持學院的籌建及首兩年運作，預計在兩年先導期內為約2 000名學員提供培訓。學院將針對科技創新、文化創意、工商及專業服務等界別的需要，建立由基礎至進階的多層次在職培訓路徑，並逐步將合適的培訓課程發展成為認證課程及資歷架構認可課程。\n\n　　學院首個課程「IP101知識產權基礎課程」為期一日半，由具相關專業知識和實務經驗的講者授課。內容涵蓋不同類別的知識產權（包括商標、版權、專利、外觀設計及商業秘密）及知識產權貿易的基本概念，協助學員認識知識產權擁有人和使用者的權利與責任，並把所學應用於企業營運。\n\n　　出席今日典禮的其他嘉賓包括職訓局主席林健鋒、高等法院原訟法庭法官陸啟康、商務及經濟發展局常任秘書長李頌恩、世界知識產權組織副總幹事申長雨博士、知識產權署署長黃福來、香港知識產權學院先導計劃督導委員會主席李惠光教授及職訓局署理執行幹事任影嬋。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca220dca924","title":"日本進口水產的檢測情況","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900440.htm","summary":"因應日本政府單方面決定把福島核電站核污水排放大海，食物環境衞生署署長已發出《食物安全命令》，禁止源自日本10（都）縣的水產、海鹽和海藻食品進口本港，受禁（都）縣包括東京、福島、茨城、宮城、千葉、群馬…","summary_short":"因應日本政府單方面決定把福島核電站核污水排放大海，食物環境衞生署署長已發出《食物安全命令》…","digest":"因應日本政府單方面決定把福島核電站核污水排放大海…","points":["因應日本政府單方面決定把福島核電站核污水排放大海，食物環境衞生署署長已發出《食物安全命令》…","至於其他未有被禁止輸入香港的日本水產、海鹽和海藻，為確保食物安全…","在確認相關產品沒有超出輻射水平的情況下，才放行於市場供應"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:55:00+08:00","size":1,"keywords":[],"body":"因應日本政府單方面決定把福島核電站核污水排放大海，食物環境衞生署署長已發出《食物安全命令》，禁止源自日本10（都）縣的水產、海鹽和海藻食品進口本港，受禁（都）縣包括東京、福島、茨城、宮城、千葉、群馬、栃木、新潟、長野和埼玉。\n\n　　至於其他未有被禁止輸入香港的日本水產、海鹽和海藻，為確保食物安全，食物環境衞生署轄下食物安全中心（食安中心）正全面進行輻射水平測試；在確認相關產品沒有超出輻射水平的情況下，才放行於市場供應。\n\n　　由十一月十八日中午截至今日（十一月十九日）中午，食安中心已對144個日本進口「水產及其製品、海藻及海鹽」的食物樣本作輻射水平檢測，未有發現輻射水平超出安全標準。詳情可參閱食安中心「日本進口食品管制措施」專題網頁（www.cfs.gov.hk/tc_chi/programme/programme_rafs/programme_rafs_fc_01_30_Nuclear_Event_and_Food_Safety.html）。\n\n　　同期，漁農自然護理署（漁護署）已對50個本地漁產品樣本作輻射水平檢測，全部樣本檢測合格。詳情可參閱漁護署網頁（www.afcd.gov.hk/tc_chi/fisheries/Radiological_testing/Radiological_Test.html）。\n\n　　香港天文台亦已加強監測本港水域的環境輻射水平。至目前為止，並沒有發現異常情況。詳情可參閱香港天文台的網頁（www.hko.gov.hk/tc/radiation/monitoring/seawater.html）。\n\n　　由二○二三年八月二十四日起至今日中午，食安中心及漁護署分別檢測了共276 546個日本進口食物樣本（包括172 048個水產及其製品、海藻及海鹽樣本）及共58 814個本地漁產品樣本作輻射水平檢測，全部樣本檢測合格。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce93b510817","title":"行政長官在深圳出席亞太經合組織領導人非正式會議","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900435.htm","summary":"行政長官李家超今日（十一月十九日）在深圳出席亞太區經濟合作組織（亞太經合組織）第三十三次領導人非正式會議，與其他經濟體領導人就深化區域合作、拓展多元市場交流意見。","summary_short":"行政長官李家超今日（十一月十九日）在深圳出席亞太區經濟合作組織（亞太經合組織）第三十三次領導人非正式會議…","digest":"行政長官李家超在深圳出席亞太區經濟合作組織第三十三次領導人非正式會議…","points":["行政長官李家超今日（十一月十九日）在深圳出席亞太區經濟合作組織（亞太經合組織）第三十三次領導…","李家超在會議發言時指出，亞太地區是當今經濟增長的引擎，貢獻了全球三分之二的增長","香港作為國際金融、貿易及創科中心，在國家支持下，會充分發揮「超級聯繫人」和「超級增值人」的重…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:50:00+08:00","size":1,"keywords":[],"body":"行政長官李家超今日（十一月十九日）在深圳出席亞太區經濟合作組織（亞太經合組織）第三十三次領導人非正式會議，與其他經濟體領導人就深化區域合作、拓展多元市場交流意見。\n\n　　李家超在會議發言時指出，亞太地區是當今經濟增長的引擎，貢獻了全球三分之二的增長。香港作為國際金融、貿易及創科中心，在國家支持下，會充分發揮「超級聯繫人」和「超級增值人」的重要角色，繼續維持自由開放的市場，堅定支持以規則為本的多邊貿易體制，擴大與亞太經合組織的合作，持續為促進亞太地區的繁榮作出貢獻。\n\n　　李家超表示，粵港澳大灣區是區域開放合作、引領高質量發展的重要平台。這次亞太經合組織領導人非正式會議在深圳舉行，財政部長會上月首次在香港舉行，展現大灣區的國際影響力和競爭力。在《2026年全球創新指數》世界百強創新集群中，「深圳—香港—廣州」集群連續兩年排名全球第一，彰顯大灣區兄弟城市在創科領域合作共贏的豐碩成果。創新是未來競爭力的核心，香港擁有世界頂尖的大學及科研機構，結合粵港澳大灣區的製造及商業實力，共同推動科研成果轉化及應用，同時積極推動人工智能的廣泛應用，促進高質量發展。\n\n　　亞太經合組織成員經濟體就領導人宣言達成共識，同時通過有關貿易數字化、數字經濟和新興科技、互聯互通等領導人層級的成果文件。李家超表示，這些具前瞻性的成果對推進亞太地區的務實合作、深化區域經濟融合、推動高質量發展發揮關鍵作用。\n\n　　下午，李家超與其他經濟體領導人會面和舉行雙邊會談。李家超與秘魯總統藤森慶子會面時表示，秘魯是香港在拉丁美洲的第六大貿易夥伴，很高興二○二四年在秘魯利馬親身見證香港與秘魯簽署《自由貿易協定》，涵蓋貨物貿易、服務貿易及投資等領域。《自由貿易協定》今年九月一日正式生效，進一步促進雙邊貿易和投資，標誌兩地經貿關係邁向新里程。他鼓勵更多秘魯企業善用香港的國際商貿平台和專業服務，以香港為跳板進軍內地及亞洲市場，發掘更多商機。香港會繼續拓展新興市場，發揮「超級連繫人」和「超級增值人」的角色，與秘魯在不同範疇有更多合作，互惠共贏。\n\n　　李家超隨後與新加坡總理兼財政部長黃循財會面，表示很高興繼今年三月在香港會面後，再在深圳聚首。他說，香港與新加坡同是高度外向型的國際金融貿易中心，雙方經貿和人文往來頻繁、合作緊密。特區政府正提速提效發展北部都會區（北都）和河套深港科技創新合作區香港園區，李家超鼓勵具創科實力的新加坡企業落戶北都，結合香港匯聚全球人才及前沿科研的優勢，攜手開拓內地市場。他亦感謝新加坡一直支持香港盡早加入《區域全面經濟伙伴關係協定》，期望隨着新加坡明年擔任東盟輪值主席國，雙方繼續深化協作，共同推動區域經濟發展。\n\n 李家超結束深圳的會議及相關活動，傍晚返港。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c68140187e7","title":"​行政長官在深圳會見傳媒談話內容","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900421.htm","summary":"以下是行政長官李家超出席亞太區經濟合作組織（亞太經合組織）領導人非正式會議及相關活動期間，今日（十一月十九日）下午在深圳會見傳媒的談話內容：  行政長官：大家好。","summary_short":"以下是行政長官李家超出席亞太區經濟合作組織（亞太經合組織）領導人非正式會議及相關活動期間…","digest":"​行政長官在深圳會見傳媒談話內容（附圖／短片）","points":["以下是行政長官李家超出席亞太區經濟合作組織（亞太經合組織）領導人非正式會議及相關活動期間…","多謝大家連日採訪亞太區經濟合作組織（APEC）會議的情況","我星期二來到深圳，一連三日出席APEC工商領導人峰會及APEC領導人非正式會議"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:18:00+08:00","size":1,"keywords":[],"body":"以下是行政長官李家超出席亞太區經濟合作組織（亞太經合組織）領導人非正式會議及相關活動期間，今日（十一月十九日）下午在深圳會見傳媒的談話內容：\n\n行政長官：大家好。多謝大家連日採訪亞太區經濟合作組織（APEC）會議的情況。我星期二來到深圳，一連三日出席APEC工商領導人峰會及APEC領導人非正式會議。昨日，我與五個成員經濟體的領導人會面和進行雙邊會談，按時序分別是馬來西亞總理安華先生、越南國家主席蘇林先生、文萊蘇丹哈桑納爾先生、泰國總理阿努廷先生和智利總統卡斯特先生。今日稍後，我將會與秘魯總統藤森慶子女士和新加坡總理黃循財先生見面。\n\n　　今日早上，我出席了APEC領導人非正式會議。會議圍繞「建設亞太共同體，促進共同繁榮」的主題，聚焦「開放、創新、合作」三大優先領域。各成員經濟體就領導人宣言達成共識，同時通過有關貿易數字化、數字經濟、新興科技、互聯互通等領導人層級的成果文件。這些具前瞻性的成果對推進亞太地區的務實合作、深化區域經濟融合、推動高質量發展發揮關鍵作用。\n\n　　今年是APEC「中國年」，是國家第三次擔任東道主。國家已經成功舉辦超過300場各級別會議和活動，包括11個部長級會議，涵蓋貿易、能源、旅遊、數字和人工智能、中小企、運輸以及人力資源等領域，達成多份聲明和成果文件。今次我們出席APEC會議達致五個成果。\n\n　　第一，貢獻香港力量，積極參與及支持國家成功舉辦APEC會議。香港特區在APEC「中國年」有雙重身分：既是APEC成員經濟體，亦作為中國的一個特別行政區全面助力國家辦好APEC。我們以中國香港的身分，積極出席和舉辦會議、工作坊，開展一系列能力提升工作項目，並由政府代表在APEC個別的委員會擔當領導角色，從不同層面推動APEC主題。上月，APEC財長會（財政部長會）以國家財政部主辦、香港特區政府承辦的方式，首次在香港圓滿舉行，聚焦宏觀經濟金融形勢，推動亞太區經濟金融合作，充分展現香港作為國際金融中心的優勢，以及舉辦大型國際會議的能力。\n\n　　今個星期的APEC領導人會議周，香港代表團的規模是歷來最大，在商界方面有超過50人出席APEC工商領導人峰會和相關活動，涵蓋金融服務、進出口、地產、建造、航運交通等界別，以及商會、法定機構和組織等。企業及商界代表可以直接與其他經濟體的商界代表交流和溝通，全力投入及支持國家這個重要的主場外交活動。\n\n　　第二，深化與APEC成員經濟體的交流。APEC成員經濟體是香港的重要貿易夥伴，貿易往來佔本港外貿總值87%。透過APEC會議和活動，我與不同經濟體領導人交流，包括先後與馬來西亞、越南、文萊、泰國、智利、秘魯和新加坡，即總共七個經濟體的領導人進行會面及雙邊會談，討論雙方共同關注的議題，建立更深入的聯繫。\n\n　　第三，鞏固與東盟（東南亞國家聯盟）成員國的關係。東盟有七個國家是APEC成員經濟體。東盟是香港第二大貿易夥伴，我先後兩次率領商貿代表團訪問東盟多個國家，促進香港與東盟加強政府間的關係和往來。今次APEC讓我有機會和五位東盟成員領導人會面和進行雙邊會談，進一步鞏固關係。\n\n　　香港一直積極尋求盡早加入《區域全面經濟伙伴關係協定》（RCEP）。RCEP今年九月同意成立「加入工作組」，啓動各申請經濟體包括香港的加入程序。與我會面的東盟成員領導人都向我表示，繼續支持香港盡快加入RCEP，我感謝他們的支持。香港已經準備就緒，隨時與工作組見面及討論，爭取盡早加入RCEP。\n\n　　第四，進一步拓展新興市場。特區政府積極開拓經濟網絡，拓展和探索不同市場，近年尤其着重強化與新興、有潛質市場的連繫。昨日，我和智利總統共同見證了香港與智利簽署工作假期計劃協議。這是香港第一次與拉丁美洲國家合作推出工作假期計劃，讓香港青年人可以有一年的有關簽證擴闊視野，獲取外地的生活和工作經驗，促進兩地的聯繫和友誼。\n\n　　我在兩年前，二○二四年APEC會議期間，在秘魯利馬見證了香港與秘魯簽訂自由貿易協定，涵蓋貨物貿易、服務貿易及投資等領域。這一年以來，香港與拉丁美洲的商品貿易於有明顯的增長，二○二五年貿易總額達190億美元，較二○二四年上升19.1%；香港往拉丁美洲的整體出口為119億美元，當中香港產品出口及轉口均錄得雙位數字上升，分別上升10.3%及12.1%。我今日稍後會與秘魯總統進行雙邊會談，進一步推動雙方交流合作。\n\n　　第五，說好粵港澳大灣區、說好香港故事。今次APEC會議在深圳成功舉辦，而深圳是粵港澳大灣區的核心城市，充分展現大灣區作為國家高水平對外開放窗口的實力和魅力。我在星期二的APEC工商領導人峰會，在「粵港澳大灣區與亞太發展機遇」專題研討會上致辭，向各國與會代表推廣大灣區的發展機遇和香港在大灣區其中的獨特優勢。大灣區作為全球最具活力的經濟引擎之一，在「一國兩制」、三個司法管轄區和三種貨幣的制度框架下協同發展，創造超過2.1萬億美元的本地生產總值。我鼓勵亞太企業以香港作為開拓大灣區的跳板，對接大灣區的製造實力、資金和龐大消費市場，強化區域供應鏈，共建繁榮的亞太共同體。\n\n　　在不同的會面和雙邊會談中，我亦向與會領導人談及大灣區的機遇，並說明大灣區內，包含香港，如何形成一個多元生態圈，以及香港作為中國最開放、最國際化的城市，怎樣做好國際金融、航運、貿易中心、國際創新科技中心、國際高端人才集聚高地的角色，發揮「引進來、走出去」的雙向平台作用。\n\n　　香港會持續全力發揮「一國兩制」下背靠祖國、聯通世界的獨特優勢，深化國際交往，拓展全球合作網絡，繼續深耕歐美、東盟、中東等市場，同時開拓具備潛力的，包括中亞、非洲等新興市場，進一步拓展香港的全球經貿網絡，推動香港持續高質量發展。多謝大家。\n\n記者：想問習近平主席在亞太經合組織工商領導人峰會發表了主旨演講，你有甚麼體會？特別是關於灣區經濟方面，香港可以如何配合？另外，今次APEC會面，你與習主席同場交談期間，他有否特別提及到香港的發展情況？尤其是關於香港五年規劃等內容，有沒有甚麼啓示或啓發給你？謝謝。\n\n行政長官：習近平主席的主旨演講提出了四點建議：一要維護和平穩定大局，二要搭建開放合作橋樑，三要激發創新增長動力，四要拓展互利共贏路徑。堅持通過對話協商解決分歧，通過團結協作應對挑戰。\n\n　　香港長期擔當區域經貿合作的樞紐角色，是世界上最具競爭力經濟體之一，一直是堅持自由貿易和多邊主義。在加強區域經貿合作方面，香港可以從幾個不同方面配合。\n\n　　第一，會繼續用好APEC平台，與不同亞太經濟體加強互聯互通。香港與其他APEC成員經濟體的貿易往來，正如我剛才所說，佔香港外貿總值高達87%。我們會繼續發揮「超級連繫人」和「超級增值人」角色，促進區域繁榮發展。\n\n　　第二，是發揮「一國兩制」下香港內聯外通的獨特優勢，全力推動香港「四中心、一高地」建設。做好全球工商界進入大灣區和內地的發展跳板，並通過我們已經成立的內地企業出海專班，服務內地企業，拓展國際市場，更好地把握和發揮灣區機遇，發揮「引進來、走出去」的平台作用。\n\n　　第三，我認為可以深化與粵港澳大灣區交流合作，全速推進北部都會區建設，亦推動河套，深港科技創新合作區「一區兩園」協同發展，持續加強與灣區城市合作。「深圳—香港—廣州」創新集群在《2026年全球創新指數》再次排名世界第一，充分體現灣區的創科實力和廣闊前景。我們會繼續發揮香港優勢、灣區優勢，堅持在開放中與各方深度融合，共同發展，助力國家成為引領亞太合作的中堅力量。\n\n　　今次，我有機會和習主席短暫交流。今年習主席作為東道主，作為會議的主持人，他的行程十分緊密，所以我主要是利用和他短暫接觸和見面的時間，向他介紹香港在亞太經合組織工商領導人峰會上「粵港澳大灣區與亞太發展機遇」專題研討的情況。\n\n　　我向習主席表示，與會人士對大灣區發展前景反應十分正面，討論亦相當熱烈。大家都認同，粵港澳大灣區的發展潛力龐大。我亦提到香港會繼續用好「一國兩制」下內聯外通的優勢，發揮「超級聯繫人」和「超級增值人」角色，更好融入和服務國家發展大局，同時為亞太區合作和發展作出貢獻。\n\n（請同時參閱談話內容英文部分）","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb62faabae2","title":"署理商務及經濟發展局局長出席香港知識產權學院開幕典禮致辭全文","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900420.htm","summary":"以下是署理商務及經濟發展局局長陳百里博士今日（十一月十九日）在香港知識產權學院開幕典禮的致辭全文：  林主席（職業訓練局（職訓局）主席林健鋒）、申副總幹事（世界知識產權組織副總幹事申長雨博士）…","summary_short":"以下是署理商務及經濟發展局局長陳百里博士今日（十一月十九日）在香港知識產權學院開幕典禮的致辭全文：  林主席（職業訓練局…","digest":"署理商務及經濟發展局局長出席香港知識產權學院開幕典禮致辭全文（只有中文）","points":["林主席（職業訓練局（職訓局）主席林健鋒）、申副總幹事（世界知識產權組織副總幹事申長雨博士）…","很高興在亞洲知識產權營商論壇期間，與大家共同見證香港知識產權學院正式啓動…","《香港第一個五年規劃》亦提出，透過成立知識產權學院…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:10:00+08:00","size":1,"keywords":[],"body":"以下是署理商務及經濟發展局局長陳百里博士今日（十一月十九日）在香港知識產權學院開幕典禮的致辭全文：\n\n林主席（職業訓練局（職訓局）主席林健鋒）、申副總幹事（世界知識產權組織副總幹事申長雨博士）、陸法官（高等法院原訟法庭法官陸啟康）、李教授（香港知識產權學院先導計劃督導委員會主席李惠光教授）、各位嘉賓、各位朋友：\n\n　　大家好。很高興在亞洲知識產權營商論壇期間，與大家共同見證香港知識產權學院正式啓動，為香港知識產權人才培訓開展新一頁。\n\n　　國家《十五五規劃綱要》明確支持香港深化區域知識產權貿易中心建設。《香港第一個五年規劃》亦提出，透過成立知識產權學院，有系統地培育各知識產權密集行業所需的人才，讓他們掌握知識產權創造、保護、管理、融資、運用及商品化等方面的知識和技能，進一步推動香港知識產權生態圈發展。今日學院正式啓動，正是落實這項工作的重要一步。\n\n　　知識產權不只關乎法律保障和權利註冊，更與科研成果轉化、品牌發展、授權和交易密切相關。我們需要更多跨專業人才，協助企業將把創意和科研成果轉化為具有市場價值的資產，開拓新的商機。\n\n　　本屆政府任期內，知識產權署已為超過5 000名從業員提供培訓。在這個基礎上，學院將進一步完善培訓系統，推動人才培育邁向更有系統、更多元化和更具認受性的新階段。政府預留了5,200萬元，支持知識產權署與職訓局合作籌建學院及首兩年運作，預計在兩年先導期內培訓約2 000名學員。\n\n　　學院將以實務為本，為創科、文創、工商及專業服務等界別，提供由基礎至進階的多層次在職培訓。合適課程將按相關評審程序與資歷架構掛鈎。首個基礎課程就在今明兩日舉行，讓學員從認識知識產權出發，逐步掌握保護和運用無形資產的能力。\n\n　　國際合作也是學院發展的重要一環。我們十分榮幸世界知識產權組織副總幹事申長雨博士今日親臨開幕典禮，與我們共同見證學院正式啓動。這充分體現國際組織對香港知識產權發展的支持。我們期待日後與世界知識產權組織加強交流，探討在知識產權教育和人才培訓方面的合作機會，借助其國際專業知識、豐富培訓經驗和環球網絡，提升本地培訓質素，開拓學員的視野。\n\n　　我衷心感謝職訓局、學院先導計劃督導委員會、世界知識產權組織及各界夥伴的支持。學院的成功有賴各方攜手參與。期待大家繼續積極指導學院的課程和活動，為學院的長遠發展提供寶貴意見，攜手培育更多知識產權人才，協助企業把創新成果轉化為商機。\n\n　　在此，我再次恭賀學院順利成立，並祝願學院培育更多優秀人才，匯聚業界力量、連接國際資源，為香港建設區域知識產權貿易中心培育人才，為國家創新發展作出更大貢獻。多謝大家。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca4c780e727","title":"二○二六年選舉委員會界別分組一般選舉星期日舉行 投票人須依正確程序投票","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900352.htm","summary":"二○二六年選舉委員會（選委會）界別分組一般選舉將於星期日（十一月二十二日）舉行，投票時間由上午九時至下午六時。","summary_short":"二○二六年選舉委員會（選委會）界別分組一般選舉將於星期日（十一月二十二日）舉行，投票時間由上午九時至下午六時。","digest":"二○二六年選舉委員會界別分組一般選舉將於星期日舉行，投票時間由上午九時至下午六時","points":["二○二六年選舉委員會（選委會）界別分組一般選舉將於星期日（十一月二十二日）舉行…","選舉事務處提醒有關投票人／獲授權代表緊記依照投票通知卡指示…","選舉事務處發言人今日（十一月十九日）說：「根據法例…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:00:00+08:00","size":1,"keywords":[],"body":"二○二六年選舉委員會（選委會）界別分組一般選舉將於星期日（十一月二十二日）舉行，投票時間由上午九時至下午六時。選舉事務處提醒有關投票人／獲授權代表緊記依照投票通知卡指示，帶同有效的香港身份證正本前往獲編配的投票站投票。\n\n　　選舉事務處發言人今日（十一月十九日）說：「根據法例，只有載列在二○二六年選委會界別分組正式投票人登記冊上而屬31個須競逐的界別分組的已登記投票人／獲授權代表才可於投票日投票。相關界別分組的投票人／獲授權代表可透過『智方便』或選民登記網站（vr.gov.hk）登入『選民資料網上查閱系統』查閱其獲編配的投票站名稱和地址、位置圖、投票時間，以及候選人簡介等投票資訊。他們亦可致電選舉熱線2891 1001查詢。投票程序簡介的短片亦已上載到選舉網站（www.elections.gov.hk）。」\n\n　　在投票日，共有856名候選人競逐31個界別分組的723個席位。全港共設有五個一般投票站（分別設於港灣道體育館、九龍公園體育館、荃灣體育館、調景嶺體育館及車公廟體育館）和兩個專用投票站（分別設於跑馬地警署和石壁監獄），供須競逐的界別分組投票人／獲授權代表投票。\n\n投票安排\n\n　　是次選舉的一般投票站會使用電子選民登記冊系統發出選票。投票人／獲授權代表須在投票站發票櫃枱出示有效的香港身份證正本。投票站工作人員會以電子選民登記冊系統平板電腦掃描投票人／獲授權代表的身份證，並在核實身分後發出選票。\n\n　　投票人／獲授權代表填劃選票時須使用投票站提供的筆填滿所選擇的候選人姓名左邊的橢圓圈，而所選擇的候選人數目不可多於所屬界別分組須選出的席位數目，否則有關選票將被視為無效。\n\n　　發言人說：「投票站設有選票檢測機，供投票人／獲授權代表使用，以檢查選票是否已按照選舉法例妥為填劃。選票檢測機不會記錄或點算選票上的選擇。完成檢測後，投票人／獲授權代表應把選票已填劃的一面向下，不用摺疊選票，直接放進投票箱。投票人／獲授權代表如帶備一張載有他們所選擇的候選人名單或號碼的紙張，方便填劃選票時作為參考，原則上並沒有問題，但投票人／獲授權代表必須緊記不可在投票站內向其他人展示該紙張，亦須於完成投票後將紙張帶離投票站，否則有可能觸犯選舉法例。」\n\n　　基於投票自主及保密的原則，法例禁止任何人（即使是投票人／獲授權代表的親友）陪同或協助投票。如有需要，投票人／獲授權代表可按法例要求投票站主任或其副手在一名投票站工作人員在場見證下，按其投票意向代為填劃選票。任何投票人／獲授權代表在投票站內干擾別人投票，或使用電子器材進行通訊或拍影片、拍照、錄音或錄影，即屬違法。\n\n　　發言人表示，所有投票站亦備有由選舉事務處印製的候選人簡介，供投票人／獲授權代表參考。\n\n投票站特別安排\n\n　　投票站設立兩條隊伍：一條特別隊伍供年滿70歲的人士、孕婦及因身體狀況而難以長時間站立排隊的人士使用；另一條隊伍則供其他投票人／獲授權代表使用。投票站主任會視乎輪候情況靈活調配發票櫃枱。\n\n　　每個投票站外的若干範圍會被劃定為禁止拉票區，確保投票人／獲授權代表在不受干擾的情況下進入投票站。在禁止拉票區內，任何人均不可進行拉票或打手勢、示好等「變相拉票」行為。此外，投票站入口和出口處附近範圍會被劃定為禁止逗留區，任何人均不可在禁止逗留區逗留。\n\n　　投票日當日任何與是次選舉有關的查詢，可致電選舉熱線（2891 1001）。熱線會在當天上午八時三十分至下午六時三十分運作；而投訴熱線（2827 7251／3707 0188）則會在當天上午八時三十分至下午七時運作，處理有關違反選舉規例或選舉活動指引的投訴。\n\n點票安排\n\n　　是次選舉將採用中央點票模式。投票結束後，所有投票箱會運送到設於香港會議展覽中心的中央點票站進行點票。候選人、選舉代理人及監察點票代理人可以進入中央點票站，在點票區的指定範圍觀察點票過程。公眾人士和傳媒亦可進入中央點票站觀察點票，但不可以進入點票區。中央點票站外會張貼通告，列明點票站公眾範圍內可容納入場人數的上限。\n\n　　當個別界別分組的選票完成點算並經選舉事務處核實後，選舉主任會在中央點票站的問題選票裁決枱向在場的候選人及代理人公布點票及選舉結果，此外，所有當選人會獲安排在新聞中心的禮台上接受祝賀。選舉結果會張貼在新聞中心外，並透過新聞稿和選舉網站發放。\n\n　　如有查詢，可致電選舉熱線（2891 1001），或瀏覽選舉網站以獲取更多有關是次選舉的資訊。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c10d4f966c8","title":"屋宇署九月批出十六份建築圖則","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900260.htm","summary":"屋宇署九月共批出十六份建築圖則，其中港島三份及新界十三份。","summary_short":"屋宇署九月共批出十六份建築圖則，其中港島三份及新界十三份。","digest":"屋宇署九月共批出十六份建築圖則，其中港島三份及新界十三份","points":["上述批出的圖則包括四項住宅及商住發展、三項商業發展、七項工廠及工業發展，以及兩項社區服務發展","獲准動工的建築工程項目則有四個，這些工程完成後將提供可作住宅用途的建築樓面面積共十三萬三千四…","屋宇署同時發出二十一份入伙紙，包括港島五份、九龍八份及新界八份"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T15:00:00+08:00","size":1,"keywords":[],"body":"屋宇署九月共批出十六份建築圖則，其中港島三份及新界十三份。\n\n　　上述批出的圖則包括四項住宅及商住發展、三項商業發展、七項工廠及工業發展，以及兩項社區服務發展。\n\n　　獲准動工的建築工程項目則有四個，這些工程完成後將提供可作住宅用途的建築樓面面積共十三萬三千四百九十四平方米，涉及單位二千五百一十六個，非住宅用途的建築樓面面積達十五萬九千零八十五平方米。另外，該署亦接獲五個建築項目的上蓋工程動工通知。\n\n　　屋宇署同時發出二十一份入伙紙，包括港島五份、九龍八份及新界八份。\n\n　　其中住宅用途的建築樓面面積有三萬零四百七十平方米，共六百五十五個單位；而非住宅用途的建築樓面面積則為十萬零八百九十九平方米。\n\n　　九月份新落成樓宇的報價總值約為五十八億元。\n\n　　此外，該署批准三項拆卸樓宇工程。\n\n　　該署九月接獲三千五百四十宗有關僭建物的舉報，並發出七百七十一張僭建物的清拆令。\n\n　　九月資料月報全部內容已載於屋宇署網頁（www.bd.gov.hk），歡迎市民瀏覽。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c664e374012","title":"教育局公布二○二七／二八學年指定專業／界別課程資助計劃──副學位課程","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900216.htm","summary":"教育局今日（十一月十九日）公布，指定專業／界別課程資助計劃在二○二七／二八學年將資助五所專上院校共35個副學位課程的2 196個學額。","summary_short":"教育局今日（十一月十九日）公布，指定專業／界別課程資助計劃在二○二七／二八學年將資助五所專上院校共35個副學位課程的2…","digest":"教育局公布二○二七／二八學年指定專業／界別課程資助計劃──副學位課程","points":["教育局今日（十一月十九日）公布，指定專業／界別課程資助計劃在二○二七／二八學年將資助五所專上…","該35個指定副學位課程屬於七個對人才需求殷切的範疇，分別為建築及工程、電腦科學、創意工業…","有關課程和學額數目（見附件）經教育局諮詢相關政策局和部門後決定"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T15:00:00+08:00","size":1,"keywords":[],"body":"教育局今日（十一月十九日）公布，指定專業／界別課程資助計劃在二○二七／二八學年將資助五所專上院校共35個副學位課程的2 196個學額。\n\n　　該35個指定副學位課程屬於七個對人才需求殷切的範疇，分別為建築及工程、電腦科學、創意工業、護理、運動及康樂、檢測及認證和旅遊及款待。有關課程和學額數目（見附件）經教育局諮詢相關政策局和部門後決定。\n\n　　在二○二七／二八學年，實驗室為本課程與非實驗室為本課程的年度資助金額將分別為40,730元及23,390元。資助金額適用於符合資格的新生和舊生。資助會在課程的正常修業期內發放。獲資助的學生只須支付扣除資助後的學費。有需要的學生仍可就實際應繳的學費向在職家庭及學生資助事務處轄下的學生資助處申請學生資助。\n\n　　指定專業／界別課程資助計劃旨在資助學生修讀選定範疇的指定全日制經本地評審自資學士學位及副學位課程，為有殷切人力資源需求的行業培育人才。二○二七／二八學年的指定學士學位課程、資助學額數目及資助金額等詳情，已於九月二十一日公布。\n\n　　學生可直接向有關院校申請報讀獲資助的副學位課程。有關資助計劃的詳情，請瀏覽網頁www.cspe.edu.hk/sssdp。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c21edd2ec19","title":"​財庫局局長在盧森堡展示香港的金融實力","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111800406.htm","summary":"財經事務及庫務局局長許正宇十一月十八日（盧森堡時間）在盧森堡展開其出訪歐洲的第二站行程，其間會晤當地多名政府官員、金融監管機構、銀行及金融機構代表。","summary_short":"財經事務及庫務局局長許正宇十一月十八日（盧森堡時間）在盧森堡展開其出訪歐洲的第二站行程，其間會晤當地多名政府官員…","digest":"財經事務及庫務局局長許正宇十一月十八日在盧森堡展開其出訪歐洲的第二站行程…","points":["財經事務及庫務局局長許正宇十一月十八日（盧森堡時間）在盧森堡展開其出訪歐洲的第二站行程…","他當日先拜會盧森堡財政部，與秘書長兼庫務署署長Bob Kieffer會晤","會上，許正宇重點介紹香港在首份《五年規劃》下的策略方向…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T12:00:00+08:00","size":1,"keywords":[],"body":"財經事務及庫務局局長許正宇十一月十八日（盧森堡時間）在盧森堡展開其出訪歐洲的第二站行程，其間會晤當地多名政府官員、金融監管機構、銀行及金融機構代表。\n\n　　他當日先拜會盧森堡財政部，與秘書長兼庫務署署長Bob Kieffer會晤。會上，許正宇重點介紹香港在首份《五年規劃》下的策略方向，指出該藍圖不單進一步鞏固香港作為國際金融中心、全球離岸人民幣業務樞紐、國際資產財富管理中心和國際風險管理中心的地位，更透過具體的政策方向，為投資者和企業展現具預見性的發展環境。他表示，盧森堡與香港在財富管理、綠色金融和數字金融領域各具優勢且理念相近，是雙方深化合作、鞏固各自作為歐洲與亞洲資金安全港的理想策略夥伴。此外，香港亦是盧森堡抓緊中國內地龐大機遇的首選門戶。\n\n　　為更深入了解盧森堡的金融狀況，許正宇與盧森堡金融推廣署首席執行官Tom Théobald，以及盧森堡基金行業協會行政總裁Serge Weyland會面，並於其後與盧森堡銀行及財富管理業界的關鍵代表進行圓桌午餐會。盧森堡基金行業協會代表當地資產管理及投資基金業界，而盧森堡金融推廣署則是盧森堡政府與當地金融業聯會成立的公私營合作機構。\n\n　　許正宇向他們表示，可預見性及穩定性是香港金融巿場的標誌性優勢。他補充說，政府致力透過加強便利措施優化金融生態圈，包括通過法例優化有關基金、單一家族辦公室和附帶權益的優惠稅制，以及優化房地產投資信託基金（房託基金）制度，以提升房託基金市場的競爭力和流動性。\n\n　　他又提到香港自二○二五年一月獲倫敦金屬交易所納入為許可交付地點以來，在發展大宗商品市場方面取得令人鼓舞的成果。截至十月底，相關倉庫的總面積已超過74 000平方米，有色金屬庫存量亦突破67 000公噸。香港交易及結算所有限公司正力爭於明年聯動指定銀行推出代幣化倉單融資試點項目，以推動企業透過商品庫存作擔保，獲取流動資金。\n\n　　他其後到訪盧森堡證券交易所。該交易所是歐洲領先的證券交易所，專注於國際上市業務，並以可持續金融及跨境資本市場服務為重點。許正宇向其副行政總裁兼首席財務官Pierre Schoonbroodt及其他高層管理人員分享香港提升股票市場流動性的最新舉措，包括推動海外企業來港雙重主要上巿及第二上市，以及推動證券市場「T+1」結算周期。\n\n　　下午，許正宇與盧森堡金融監管委員會主管Marco Zwick會面。該委員會是監管盧森堡金融業從業員及金融產品的公營機構。許正宇認同遵守國際標準對確保市場暢順運作和有效保障投資者至關重要，並強調香港同樣擁有嚴謹的監管框架作為核心，支撐金融市場穩健暢旺發展。\n\n　　在與歐洲投資銀行副行長Marko Primorac博士會晤期間，許正宇向他介紹香港為強化綠色金融生態圈而推出的最新舉措，包括Core Climate促成的兩項跨境試點計劃，其一是讓香港企業得以購買內地的綠色電力證書，另一項則為測試碳排放配額的結算安排。\n\n　　許正宇亦禮節性拜會中國駐盧森堡大使館臨時代辦朱煒燁，向他介紹香港的最新金融發展情況。\n\n　　他十一月十九日（盧森堡時間）將前往比利時布魯塞爾，繼續出訪行程。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce0a11b370f","title":"駐倫敦經貿辦在芬蘭Slush 2026推廣《香港第一個五年規劃》的創科機遇","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111800587.htm","summary":"​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台，聯同投資推廣署和香港貿易發展局（貿發局），以及香港科技園公司…","summary_short":"​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台…","digest":"香港駐倫敦經濟貿易辦事處於十一月十八日，透過「經貿一站通」平台…","points":["​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間）…","她表示，香港匯聚國際人才、科技和資本，並協助企業把握中國內地…","周雪梅亦介紹在《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》下…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T09:00:00+08:00","size":1,"keywords":[],"body":"​香港駐倫敦經濟貿易辦事處（駐倫敦經貿辦）於十一月十八日（赫爾辛基時間），透過「經貿一站通」平台，聯同投資推廣署和香港貿易發展局（貿發局），以及香港科技園公司，在芬蘭赫爾辛基舉行的Slush 2026上，舉辦題為「下一站亞洲：透過香港拓展創科業務」的研討會，介紹香港的創新科技（創科）發展，以及香港為有意拓展亞洲市場的北歐初創企業提供的機遇。\n\n　　駐倫敦經貿辦處長周雪梅在研討會上致辭，介紹香港為北歐企業拓展亞洲市場的重要平台。她表示，香港匯聚國際人才、科技和資本，並協助企業把握中國內地，特別是粵港澳大灣區（大灣區）和其他亞洲市場的發展機遇。\n\n　　周雪梅亦介紹在《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》下，香港發展成為國際創科中心的願景。她指出，香港正積極推進「三大創科園區、五大研發機構」的建設，並投放大量資源，進一步完善創科生態圈，加快科研成果轉化，開拓更多商業機遇。\n\n　　她亦介紹北部都會區，指出這項重大發展計劃將為創新發展和跨境合作帶來新機遇。她指出，區內的河套深港科技創新合作區香港園區——港深創新及科技園（港深創科園）和新田科技城相互配合，推動研發、成果轉化及產業發展。她亦介紹港深創科園與毗鄰深圳園區所採用的「一河兩岸、一區兩園」獨特跨境合作模式。這個模式為北歐企業提供良機，讓它們在香港設立據點，善用香港「一國兩制」下的獨特優勢，與香港及深圳的科研機構和創科夥伴合作，並充分利用大灣區的科技和製造業資源。\n\n　　投資推廣署創新及科技，生命與健康科學總裁黃煒卓亦於研討會上以「香港作為通往中國及更廣泛亞洲地區商機的門戶（從科技創投角度出發）」為題發表演講。另外，貿發局、香港科技園公司及兩間北歐企業代表在爐邊對談環節中，分享他們對香港創科領域的最新發展、海外企業可把握的機遇，以及行業未來發展前景的見解。講者亦結合自身經驗和專業知識，探討北歐初創企業進軍香港市場、尋找合適合作夥伴，以及進一步拓展亞洲市場時需要考慮的實際因素。\n\n　　駐倫敦經貿辦會繼續與投資推廣署、貿發局及香港科技園公司緊密合作，推廣香港的創科發展，促進香港與北歐創科企業之間的合作。\n\n　　Slush是年度的全球初創盛會，在赫爾辛基舉行，匯聚來自世界各地初創企業創辦人、投資者及科技與創業生態圈的其他成員，為參與者提供交流經驗，以及與潛在投資者及商業夥伴建立聯繫的平台。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4720035224","title":"港匯指數","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900170.htm","summary":"二○二六年十一月十九日（星期四）的港幣匯率指數為一百點五（和昨日指數比較上升零點一）。","summary_short":"二○二六年十一月十九日（星期四）的港幣匯率指數為一百點五（和昨日指數比較上升零點一）。","digest":"二○二六年十一月十九日的港幣匯率指數為一百點五（和昨日指數比較上升零點一）","points":["二○二六年十一月十九日（星期四）的港幣匯率指數為一百點五（和昨日指數比較上升零點一）"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T16:00:00+08:00","size":1,"keywords":[],"body":"二○二六年十一月十九日（星期四）的港幣匯率指數為一百點五（和昨日指數比較上升零點一）。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cca0fb1ae4e","title":"銀線灣泳灘懸掛紅旗","url":"https://www.info.gov.hk/gia/general/202611/19/P2026111900180.htm","summary":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂及文化事務署今日（十一月十九日）宣布，由於大浪關係，西貢區的銀線灣泳灘已懸掛紅旗，顯示在該處游泳會有危險…","summary_short":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂及文化事務署今日（十一月十九日）宣布…","digest":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂…","points":["電台及電視台當值宣布員注意：","游泳人士請注意：康樂及文化事務署今日（十一月十九日）宣布，由於大浪關係…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-19T09:30:00+08:00","size":1,"keywords":[],"body":"電台及電視台當值宣布員注意：\n\n請盡快播出下列特別報告：\n\n　　游泳人士請注意：康樂及文化事務署今日（十一月十九日）宣布，由於大浪關係，西貢區的銀線灣泳灘已懸掛紅旗，顯示在該處游泳會有危險，市民請勿在該處游泳。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":20,"items":[{"id":"cb903d5853c","title":"哈工大原創話劇《仰望者》 以藝術之美還原「精神群像」｜聚焦哈工大","url":"https://www.stheadline.com/parenting-guide/3638388/哈工大原創話劇仰望者-以藝術之美還原精神群像聚焦哈工大","summary":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神、科學家精神的共鳴。","summary_short":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神…","digest":"近日，哈爾濱工業大學歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場…","points":["近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場…","專業演員與大學師生同台，將一群科學家、教育工作者扎根東北、教書育人、科研攻關的故事搬上舞台","20世紀50年代，800多名青年師生從中國各地齊聚哈爾濱工業大學"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:45:28+08:00","size":1,"keywords":[],"body":"近日，哈爾濱工業大學（哈工大）歷時3年創作的大型全景式話劇《仰望者》在哈爾濱連續上演3場，引發公眾對教育家精神、科學家精神的共鳴。專業演員與大學師生同台，將一群科學家、教育工作者扎根東北、教書育人、科研攻關的故事搬上舞台。\n哈工大「八百壯士」奮鬥歷程\n這些人物有一個共同的名字——哈工大「八百壯士」。20世紀50年代，800多名青年師生從中國各地齊聚哈爾濱工業大學。這支平均年齡只有27.5歲的教師隊伍，承擔起學科建設與教學任務，為新中國培養工業化建設急需的人才。\n不搞模式化的英雄塑造，整部話劇深入歷史細節與人性深處。「我們站在舞台上，復刻的是先輩的崢嶸故事，演繹的是一代人的赤誠信仰。」就讀於建築與設計學院的鄒明燁說。\n哈工大「八百壯士」扎根北疆、「科技報國」的奮鬥歷程，是新中國高等教育特別是高等工程教育開拓發展的生動縮影。全劇以「仰望」為核心、「傳承」為主線，表達的就是「仰望與扎根」——腳踏泥濘、仰望星空，每代人都是仰望者，也會成為被仰望者。\n文藝是時代的號角，也是精神的載體。觀察者認為，《仰望者》找到了思想性與藝術性的結合點，通過高水準的劇本創排與舞台視覺呈現，使科學家精神與教育家精神在藝術美感中自然流淌、潤物無聲。\n這部話劇通過新媒體直播平台播出，50萬人次線上觀看。\n文：李雙余、闞思邈 圖：辛然、陳暢\n延伸閱讀：\n哈爾濱工業大學香港理工大學深圳國際設計學院 舉行揭牌儀式｜聚焦哈工大\n哈工大總體研製 八一04星「哈爾濱號」成功發射｜聚焦哈工大","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c441e987d3e","title":"食蜆習慣反映教養？港人震驚朋友1食法「嚇到眼都突」網民負評：睇得出人性禮貌","url":"https://www.stheadline.com/food/3638933/食蜆習慣反映教養港人震驚朋友1食法嚇到眼都突網民負評睇得出人性禮貌","summary":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。","summary_short":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。","digest":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教","points":["與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教","近日，一名港人於網上社交平台發文，分享早前與一大班朋友聚餐食炒蜆時…","帖文旋即引起廣大網民熱烈討論，大批網民一面倒負評樓主朋友的行為，直斥缺乏禮貌：「睇得出人性…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:27:41+08:00","size":1,"keywords":[],"body":"與親朋好友聚餐食飯，餐桌上的微小舉動往往能反映一個人的禮儀與家教。近日，一名港人於網上社交平台發文，分享早前與一大班朋友聚餐食炒蜆時，驚見同枱友人竟做出一個奇特的食蜆舉動，直言與自己從小的家庭教育截然不同，令他當場大感震驚。帖文旋即引起廣大網民熱烈討論，大批網民一面倒負評樓主朋友的行為，直斥缺乏禮貌：「睇得出人性、禮貌同尊重」。\n港人與友聚餐食炒蜆驚見1行為 直言與從小家教截然不同\n港人聚餐或到小炒店用膳，惹味的炒蜆往往是餐桌上的熱門菜式。最近，一名港人於網上社交平台發文，表示自己從小到大與家人食炒蜆時，家人都會將蜆連同外殼一併夾走享用。然而，樓主日前與一班朋友食炒蜆時，卻驚見同枱所有人竟然都是「直接夾嚿肉」，然後將空殼原封不動留在公家碟上，令到樓主需於整碟蜆殼中「摷」才找到蜆肉。面對朋友們異於常人的進食習慣，樓主坦言當時「嚇到眼都突」，甚至一度懷疑自己的飲食習慣才是奇怪。\n網民批評友人無家教：隻隻都空城計真係嬲\n帖文引起網民熱烈討論，大多網友力撐樓主飲食習慣無問題，直指其朋友們的行為反映家教問題：「咁係你班friend無家教」、「你屋企有家教，千祈唔好以為一大班人係norm」、「通常我係做揀走啲殼嘅人，隻隻都空城計真係嬲」、「屋企人無教錯你」。有不少網民自身的家庭教育，表示從小長輩已教導必須連殼夾起，亦不能夾回碟內：「就算夾起發覺冇肉都唔可以放返落碟」、「好細個試過一次齋夾肉，比阿爸鬧」、「夾住嚿肉喺隻碟度揈甩個殼咁核突？」\n有較為包容的網民笑指朋友間無需太計較，或大家下次可選擇用公家匙羹：「通常我會將所有嘅殼夾晒出嚟放喺我前面，搞到變到有座山」、「最方便嘅方法就係用公匙羹，一勺倒落自己個碗慢慢食」、「唯有親自攞隻公家匙羹慢慢𢳂出嚟，提示大家應該連殼夾走」。有自稱資深「食蜆美食家」的網民打趣表示，樓主的朋友都不懂食蜆的真正美味：「作為炒蜆資深食家，夾到有肉就食、啜埋汁，無肉就淨啜汁」、「真，啜汁先惹味，算埋個殼先係精粹，佢哋識唔識食」、「我連殼食，用牙咬走啲肉，咁樣除咗得體，其實更好味」。\n文：R\n資料及圖片來源：Threads\n延伸閱讀：內地客遊港遇「茶餐廳文化」衝擊 力數三宗罪怒批：這叫服務嗎？ 勸這類人不要去....","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4a11f75943","title":"斯诺克德国大师赛资格赛：丁俊晖晋级正赛32强","url":"https://www.chinanews.com.cn/ty/2026/11-19/10734622.shtml","summary":"中新社英国维冈11月19日电 当地时间11月18日，2027斯诺克德国大师赛资格赛展开96进64轮剩余场次和部分第三轮(64进32)较量。","summary_short":"中新社英国维冈11月19日电 当地时间11月18日，2027斯诺克德国大师赛资格赛展开96进64轮剩余场次和部分第三轮(…","digest":"当地时间11月18日…","points":["中新社英国维冈11月19日电 当地时间11月18日…","中国球手10人出战，取得7胜3负","现世界排名23位的丁俊晖开局迟迟未能进入状态，扎克·舒尔第连赢两局"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:50:36+08:00","size":1,"keywords":[],"body":"中新社英国维冈11月19日电 当地时间11月18日，2027斯诺克德国大师赛资格赛展开96进64轮剩余场次和部分第三轮(64进32)较量。中国球手10人出战，取得7胜3负。丁俊晖战胜英格兰球手扎克·舒尔第晋级正赛。\n\n　　因现世界排名跌出前16、未获种子席位，丁俊晖此次德国大师赛从资格赛打起，当日比赛对手是世界排名第43位的扎克·舒尔第。现世界排名23位的丁俊晖开局迟迟未能进入状态，扎克·舒尔第连赢两局。落后的丁俊晖从第三局开始找回手感，先后打出单杆116分、99分和57分，连扳四局以4比2反超。尽管舒尔第此后以一个单杆50分扳回一局，但丁俊晖未给对手更多机会，第八局上手后连续围绕黑球得分，虽在咖啡球上错失147满分杆，仍打出单杆125分锁定胜局，终以5比3取胜，跻身32强。\n\n　　当日中国球手参加的另外三场64进32轮次比赛中，斯佳辉面对英格兰新星斯坦·穆迪，从0比2落后追至2比2，被对手再度扳成3比3后连下两局，以5比3取胜；周跃龙开局0比3落后威尔士球手杰克逊·佩奇，此后打出两杆80+和一杆破百，连赢五局以5比3翻盘；吕昊天与英格兰球手加里·威尔逊战满九局，决胜局惜败，以4比5被淘汰。\n\n　　6位中国球手参加第二轮剩余场次较量。其中，中国香港老将傅家俊在先失一局的情况下连续击出两杆单杆破百和两个单杆50+，终以5比1大胜威尔士老将马修·史蒂文斯，强势晋级。\r\n\n　　刘宏宇以5比2战胜英格兰球手阿尔菲·博登；罗泽涛在3比4落后的情况下连赢两局，以5比4险胜英格兰球手大卫·利利；范争一以5比3击败泰国球手塔纳瓦特·提拉朋派班，如愿晋级。\n\n　　另外两场中国选手参加的比赛中，徐思以1比5负于比利时球手朱利安·勒克莱，邓壕辉0比5不敌苏格兰球手安东尼·麦克吉尔。\n\n　　当地时间11月19日，本届德国大师赛资格赛将进入收官日，张安达、庞俊旭、雷佩凡等多位中国球手将出场，为正赛资格而战。(完) 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce3f588af51","title":"女子耳内“有虫爬” 竟是家中宠物惹的祸","url":"https://www.chinanews.com.cn/jk/2026/11-19/10734619.shtml","summary":"近日，市民余女士(化姓)出现耳鸣、耳道异物感，让她最难受的是还感觉有小虫子在耳朵里面慢慢爬，于是她来到南京江北医院耳鼻喉科就诊。","summary_short":"近日，市民余女士(化姓)出现耳鸣、耳道异物感，让她最难受的是还感觉有小虫子在耳朵里面慢慢爬…","digest":"近日，市民余女士(化姓)出现耳鸣、耳道异物感…","points":["近日，市民余女士(化姓)出现耳鸣、耳道异物感，让她最难受的是还感觉有小虫子在耳朵里面慢慢爬…","接诊后，副主任医师魏新民为她安排了耳内镜检查，但常规观察条件下，耳道内并未发现明显异常","直到改用高清放大专业内镜进一步细查后，才发现了耳道内螨虫样微小生物在顺光移动"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:30:19+08:00","size":1,"keywords":[],"body":"近日，市民余女士(化姓)出现耳鸣、耳道异物感，让她最难受的是还感觉有小虫子在耳朵里面慢慢爬，于是她来到南京江北医院耳鼻喉科就诊。接诊后，副主任医师魏新民为她安排了耳内镜检查，但常规观察条件下，耳道内并未发现明显异常。直到改用高清放大专业内镜进一步细查后，才发现了耳道内螨虫样微小生物在顺光移动。进一步追问生活史，问题根源指向了家中饲养的一只猫和一条狗。\r\n\n　　导致余女士耳部不适的微小生物正是耳螨，是宠物耳道里常见的寄生生物。“耳螨体型极小，普通光源下、肉眼下几乎无法辨认。”魏新民介绍，耳螨寄居于耳道，活动时会刺激外耳道皮肤和黏膜，从而引起耳鸣、耳痒、异物感、蚁行感等一系列症状。这类症状表现在临床上很容易与神经性耳鸣、外耳道炎等相混淆，所以不少患者反复就诊、反复用药，症状却始终不见好转，直到通过专科内镜仔细排查，才最终找到问题所在。\n\n　　结合余女士的情况，魏新民提醒：床单、被套、枕套等贴身织物建议定期清洗、晾晒；地毯、沙发、宠物窝等容易积聚灰尘的地方，也要定期清洁；与宠物亲密接触后及时洗手。如果家中养宠，且近期出现耳痒、耳鸣、耳道异物感或蚁行感，就诊时要主动向医生说明养宠情况，有助于医生更准确地判断病因。\n\n　　通讯员 陈绍静 胡晓蕾\n\n　　扬子晚报/紫牛新闻记者 许倩倩 【编辑:王琴】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfc6f9347b7","title":"小松塔变身文创 河北围场“塞罕手作”出圈","url":"https://www.chinanews.com/cul/shipin/2026/11-19/news1075446.shtml","summary":"立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔，如今成了抢手货。","summary_short":"立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔，如今成了抢手货。","digest":"立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔…","points":["立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔，如今成了抢手货","塞罕坝务林人李宝华隔几天就要进山捡一批松塔，他与社区创作小组成员一起，通过修剪、蒸煮、清洗…","2026年初，围场满族蒙古族自治县赛罕社区推出银发文创品牌“塞罕手作”…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T13:49:54+08:00","size":1,"keywords":[],"body":"立冬过后，河北省围场满族蒙古族自治县冯家店村的山林里，之前少有人关注的松塔，如今成了抢手货。塞罕坝务林人李宝华隔几天就要进山捡一批松塔，他与社区创作小组成员一起，通过修剪、蒸煮、清洗、上色、粘贴等工序，把松塔制成松塔创意画。\n\n2026年初，围场满族蒙古族自治县赛罕社区推出银发文创品牌“塞罕手作”，开启“银龄+青年”跨代协作新模式：年轻人负责构思创意，老年人负责动手制作，产品从松塔创意画延伸到冰箱贴、车载挂件、木质摆件等。团队还用短视频、直播等方式讲述松塔背后的塞罕坝故事，让老手艺借助新创意、新传播走进更多人的视野。\n\n目前，该项目已吸纳76名居民常态化参与，制作各类手工艺品数百件，有效拓宽了居民增收渠道。下一步，社区将拓展线上线下销售渠道，把“塞罕手作”打造成围场特色文创品牌，让塞罕坝故事通过手工艺品走出大山。(邢璐 赵蕊 视频来源：围场县委宣传部)","image":"","video":"https://v-oss.cnsimg.net/glob/2026/11/19/bfe2a82b-2e89-487c-ac41-bdc186857080.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf69536bec3","title":"APEC: CE John Lee meets press; HK-Chile working holiday","url":"https://news.tvb.com/tc/1207225-APECCEJohnLeemeetspressHKChileworkingholiday","summary":"[13:30]Chief Executive John Lee meets the press at APEC in Shenzhen.He says Hong Kong contributes to…","summary_short":"[13:30]Chief Executive John Lee meets the press at APEC in S…","digest":"[13:30]Chief Executive John Lee meets the…","points":["Chief Executive John Lee meets the press at AP…","The city leader will meet with the Peruvian Pr…","Noting that the city has fielded the largest d…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T13:32:00+08:00","size":1,"keywords":["APEC","APEC Summit","APEC 2026","APEC China Year"],"body":"[13:30]\n\nChief Executive John Lee meets the press at APEC in Shenzhen.\n\nHe says Hong Kong contributes to its strengths and fully supports the nation in hosting a successful APEC meeting as China is hosting APEC for the third time and this year marks the APEC China Year. He says the city will work to advance Asia-Pacific cooperation, deepen collaboration and promote high-quality development within the bloc, with a view to achieving forward-looking outcomes for APEC member economies.\n\n[13:38]\n\nHong Kong is launching its first-ever Working Holiday scheme with Chile, expanding opportunities for young people to experience life and work in Latin America. The scheme offers a one-year visa, broadening horizons and strengthening exchanges between Hong Kong and Chile.\n\n[13:40]\n\nThe city leader will meet with the Peruvian President to conduct bilateral talks.\n\n[13:46]\n\nNoting that the city has fielded the largest delegation ever to APEC, CE John Lee says, \"We should take an active role in assisting our country to successully host this year's APEC.\"","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026fnYl7Qkmk61795067153.bmp?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/3a1738ffad5d4480b22ec818e8d780e0/aa07a39aada6478ca2cad7d6f6f6638a-6c21f48137d4116d4f52217b00d10459-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026fnYl7Qkmk61795067153.bmp?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c3888c1e109","title":"NBA│勒邦占士輪休復出交22分6助攻 76人末節反勝魔術收4連勝","url":"https://www.stheadline.com/basketball-zone/3638806/NBA勒邦占士輪休復出交22分6助攻76人末節反勝魔術收4連勝","summary":"費城76人（Philadelphia 76ers）作客奧蘭多魔術（Orlando Magic），雖然有麥斯（Tyrese Maxey）及謝倫布朗（Jaylen Brown）因傷缺陣…","summary_short":"費城76人（Philadelphia 76ers）作客奧蘭多魔術（Orlando Magic）…","digest":"費城76人（Philadelphia 76ers）作客奧蘭多魔術（Orlando M…","points":["一老一嫩領軍反撲 艾治琴比末節爆發 占士關鍵兩傳一攻","76人今季開季錄得12勝3負，高踞東區榜首","不過，麥斯及布朗兩名主力進攻點同時缺陣，令球隊作客魔術時一度陷入苦戰，首節更曾落後多達17分"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T11:36:40+08:00","size":1,"keywords":[],"body":"費城76人（Philadelphia 76ers）作客奧蘭多魔術（Orlando Magic），雖然有麥斯（Tyrese Maxey）及謝倫布朗（Jaylen Brown）因傷缺陣，但即將年滿42歲的勒邦占士（LeBron James）輪休後復出，交出22分、6助攻，聯同二年級後衛VJ艾治琴比（VJ Edgecombe）轟下24分、8籃板、6助攻，帶領76人在一度落後17分下，末節反撲以121:116反勝魔術，收下4連勝，同時終止對手4連勝。\n一老一嫩領軍反撲 艾治琴比末節爆發 占士關鍵兩傳一攻\n76人今季開季錄得12勝3負，高踞東區榜首。不過，麥斯及布朗兩名主力進攻點同時缺陣，令球隊作客魔術時一度陷入苦戰，首節更曾落後多達17分。幸好，即將年滿42歲的勒邦占士輪休復出。他今季採取嚴格負荷管理，所有「背靠背」賽程只會出戰其中一場，今仗與「細一個對」的艾治琴比組成「一老一嫩」組合，帶領球隊逐步收復失地。\n上半場，魔術多點開花，共有3名球員得分上雙，半場以69:64領先76人。第三節結束時，魔術仍以97:92領先5分。進入第四節，艾治琴比挺身而出，他在末節初段一度連取10分，帶領球隊不斷縮窄差距，更在比賽最後5分鐘成功反超。魔術的蘇傑斯（Jalen Suggs）其後投進超前三分，但艾治琴比隨即在進攻時間將屆時回敬一記大號三分，再度為76人取得領先。加上占士其後在關鍵時刻被「放投」，冷靜命中中距離跳投，助球隊將領先優勢擴大至4分穩住局面。再助攻西蒙斯（Anfernee Simons）命中三分，將領先優勢擴大至6分，徹底殺死比賽懸念。\nPHILLY CLOSES IT OUT ON THE ROAD! VJ 3. VJ DEFLECTION. LEBRON JUMPER. SIMONS 3. SIXERS IMPROVE TO 13-3 🔥 https://t.co/L6aunftvzS\n— NBA (@NBA) November 19, 2026占士全場16射8中，三分5射1中，攻下22分、6助攻。76人最終以121:116完成17分大逆轉，收下4連勝，同時終止魔術的4連勝。安比（Joel Embiid）攻下26分、7助攻、6籃板；艾治琴比則交出24分、8籃板、6助攻，與攻入18分的西蒙斯攜手填補麥斯及布朗缺陣的空缺。76人取勝後，繼續以強勢姿態高踞東區榜首；而勒邦占士在輪休復出後即交出關鍵表現，再次證明這位老將在關鍵時刻的價值。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c439032c7f3","title":"無家庭負擔 10萬儲蓄撐半年 30歲打工仔裸辭第4日極焦慮 過來人教路：做這兩件事治癒增值｜Juicy叮","url":"https://www.stheadline.com/local-topics/3638762/無家庭負擔-10萬儲蓄撐半年-30歲打工仔裸辭第4日極焦慮-過來人教路做這兩件事治癒增值Juicy叮","summary":"無供樓養家壓力、手握10萬元儲蓄兼有保險兜底，一名30歲打工仔「裸辭」僅4天卻感到極度焦慮。","summary_short":"無供樓養家壓力、手握10萬元儲蓄兼有保險兜底，一名30歲打工仔「裸辭」僅4天卻感到極度焦慮。","digest":"無供樓養家壓力、手握10萬元儲蓄兼有保險兜底…","points":["無供樓養家壓力、手握10萬元儲蓄兼有保險兜底，一名30歲打工仔「裸辭」僅4天卻感到極度焦慮","過來人熱心教路兩招來自我治癒兼增值，並提醒要好好享受這段難得不用上班的自由時光","樓主昨天（18日）在社交平台Threads發帖苦訴，指自己才剛「裸辭」第4天…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T11:34:43+08:00","size":1,"keywords":[],"body":"無供樓養家壓力、手握10萬元儲蓄兼有保險兜底，一名30歲打工仔「裸辭」僅4天卻感到極度焦慮。過來人熱心教路兩招來自我治癒兼增值，並提醒要好好享受這段難得不用上班的自由時光。詳情見下圖及下文：\n無家庭負擔 10萬儲蓄撐半年 30歲打工仔裸辭第4日極焦慮 過來人教路：做這兩件事治癒增值逐張睇↓↓↓↓\n10萬預算使半年：無負擔卻感焦慮\n樓主昨天（18日）在社交平台Threads發帖苦訴，指自己才剛「裸辭」第4天，雖然無債一身輕，但卻感到焦慮：「裸辭第4日，今日Send（傳送）咗6-8份 CV（履歷表）。」\n樓主續自爆：「有10萬儲蓄，唔使供樓、唔使養小朋友、唔使養父母，Touch wood（觸木，意指謝天謝地） 有病都仲有兩份醫療保險可以救命，但個人都仲係好焦慮。」\n有網民見狀，隨即規勸應趁機好好享受不用上班的自由。不過樓主坦言「個人太焦慮，未享受到」。樓主透露自己心中有很多夢想和興趣想體驗，未料到一辭職便陷入恐慌。\n網民提醒勿自己嚇自己\n面對樓主的焦慮，有網民指出，這種不安純粹是「自己嚇自己」的心理作祟，直言令樓主焦慮的並非現實，而是腦袋不斷幻想「萬一搵唔到點算」的想法。\n網民勸道，既然當天已經寄出6至8份履歷表，就已經完成了當日的本分，其餘的應該放心交託給因緣，好好讓自己休息。\n不少網民也深有共鳴，留言安慰樓主萬事起頭難，剛進入無業空白期，不習慣是人之常情。有人直言，樓主其實已經準備得非常充足：\n「你已經準備得好足啦，有10萬應急錢、無供樓養家壓力、仲有醫療保兜底，今日又已經Send咗幾份CV，真係已經做得好好！畀自己放個假唞下氣先，好快會遇到適合你嘅 Offer（工作機會）🤍」亦有其他網民簡單留下一句「放鬆心情，會越來越好嘅」，為樓主打氣。\n過來人教兩招自我治癒兼增值\n不少曾有類似經歷的過來人亦留言，傳授如何度過這段「空白期」的兩大治癒方案。\n第一招是「免費自學」。有5個月前同樣經歷裸辭的過來人分享，利用空檔尋找免費課程學習新事物，不僅能自我增值，更能有效消除「浪費時間」的內疚感，從而減輕焦慮。網民透露自己現在多了時間，常會找免費東西學習，學了新事物覺得增值了自己，人也沒那麼焦慮。\n第二招是「做 Part-time（兼職）」。過來人指出，未找到正職前先做兼職，一來有收入可以幫補生計，二來自由身能靈活配合面試時間，隨時會因緣際會遇到更好的發展機會。\n網民提醒：10萬元不耐花\n不過，也有務實的網民提醒「10皮（十萬）唔係頂到好耐」，樓主對此也坦言「我都知，我預半年」。\n有網民更分享自身慘痛經歷來安慰樓主，指自己30歲嗰年整親手無法工作，當時沒有伴侶，同樣只有10萬元儲蓄，每個月還要花幾千元看醫生，最終捱了一年傷癒才成功轉行，勸樓主放鬆心情。\n資料來源：hiworld000111＠Threads\n相關閱讀：\n打工10年手持$133萬 32歲港男因職場一事擬裸辭「微退休」 網民意見兩極\n大學畢業裸辭後送外賣 33歲港男陷迷茫：每日賺500蚊先敢下線\n打工仔壓力爆煲「做做下嘢喺度喊」決心裸辭 網民分享求職市道現況掀熱議\n「50+」裸辭揭職場殘酷真相 「1句話」引爆初老族共鳴 網民：「終於有人敢講！」\n職場失意裸辭 母親7字真言感動 港女喊爆：後悔為咗份工忽視媽媽","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c77b86a6848","title":"凝聚粤港澳台侨青年同心力量 江门市举办纪念孙中山先生诞辰160周年专题研讨会","url":"https://www.chinanews.com.cn/txy/2026/11-19/10734541.shtml","summary":"近日，“百团联动 重走中山足迹”纪念孙中山先生诞辰160周年专题研讨会在江门五邑大学举行，专家学者、民主党派代表、高校师生、粤港澳台侨青年代表等约160人围绕“纪念先生、传承精神、凝聚侨心…","summary_short":"近日，“百团联动 重走中山足迹”纪念孙中山先生诞辰160周年专题研讨会在江门五邑大学举行，专家学者、民主党派代表…","digest":"凝聚粤港澳台侨青年同心力量 江门市举办纪念孙中山先生诞辰160周年专题研讨会","points":["近日，“百团联动 重走中山足迹”纪念孙中山先生诞辰160周年专题研讨会在江门五邑大学举行…","五邑大学党委书记栾天罡在致辞中，深入阐释了孙中山精神在新时代侨乡统战工作中的价值内涵","中山大学历史学系主任安东强教授围绕孙中山、梁启超与“少年中国”作主旨报告"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T11:15:52+08:00","size":1,"keywords":[],"body":"近日，“百团联动 重走中山足迹”纪念孙中山先生诞辰160周年专题研讨会在江门五邑大学举行，专家学者、民主党派代表、高校师生、粤港澳台侨青年代表等约160人围绕“纪念先生、传承精神、凝聚侨心、服务发展”主题研讨交流，重温孙中山先生的历史功绩，阐释孙中山精神当代价值，进一步凝聚共识，厚植家国认同。\r\n\n　　五邑大学党委书记栾天罡在致辞中，深入阐释了孙中山精神在新时代侨乡统战工作中的价值内涵。中山大学历史学系主任安东强教授围绕孙中山、梁启超与“少年中国”作主旨报告。林锦清、庞光华、石坚平、麦瑞权等嘉宾，分别从地方文史、人物研究、侨史脉络、港澳家国情怀培育等多个维度分享研究成果。嘉宾们立足江门侨乡独特资源，深挖孙中山革命事业与港澳台同胞、海外侨胞的深厚历史渊源，将孙中山先生振兴中华的理想追求与粤港澳大湾区建设、铸牢中华民族共同体意识紧密结合，推动学术研究与统战工作深度融合。大家表示，孙中山先生的理想信念与精神品格是海内外中华儿女共同的宝贵精神财富，在新征程上传承中山精神，必须高举爱国主义伟大旗帜，紧紧围绕中华民族伟大复兴目标携手同心、团结奋斗。\n\n　　本次活动是全省“百团联动 重走中山足迹”粤港澳台侨青年交流活动的重要组成部分，由江门市委统战部联合五邑大学、民革江门市委员会、中山大学校友会、江门五邑海外联谊会、江门五邑炎黄文化研究会、澳门家国情怀历史学会举办。 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9e1af5f4cd","title":"杨秀梅：一株寒梅绽芳华?履职尽责写担当","url":"https://www.chinanews.com.cn/txy/2026/11-19/10734543.shtml","summary":"一半砺行实干，一半案牍成文  左手深耕产业经济  右手守护法治初心  她如一株扎根沂蒙大地的寒梅  将民主党派成员、金融从业者  发改工作者  外贸商务人…","summary_short":"一半砺行实干，一半案牍成文  左手深耕产业经济  右手守护法治初心  她如一株扎根沂蒙大地的寒梅  将民主党派成员…","digest":"杨秀梅：一株寒梅绽芳华?履职尽责写担当","points":["一半砺行实干，一半案牍成文","她如一株扎根沂蒙大地的寒梅","8项列为市委统战部重点研究课题"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T11:15:24+08:00","size":1,"keywords":[],"body":"一半砺行实干，一半案牍成文\n\n左手深耕产业经济\n\n右手守护法治初心\n\n她如一株扎根沂蒙大地的寒梅\n\n将民主党派成员、金融从业者\n\n发改工作者\n\n外贸商务人、公职律师\n\n多重身份熔铸合一\n\n脚印遍布平邑发展热土\n\n笔端汇聚社情民意真知\n\n她就是\n\n九三学社临沂市委员会委员\n\n平邑县商务发展服务中心副主任\n\n杨秀梅\n\n　履职尽责建言硕果盈枝\n\n杨秀梅始终牢记党派成员职责使命\n\n积极深入发展一线调查研究\n\n充分发挥金融、发改、商务\n\n多领域优势从业经验\n\n形成一批高质量、有分量的\n\n社情民意信息和议政建言成果\n\n近三年来，3项课题入选\n\n九三学社中央参政议政课题\n\n4项课题被九三学社省委会立项\n\n8项列为市委统战部重点研究课题\n\n6项被市社科联列为社科规划项目\n\n11篇报告被九三学社中央领导\n\n及市主要领导批示肯定\n\n40余篇社情民意信息被\n\n九三学社中央、社省委会及省市政协采用\n\n 她独立执笔完成的\n\n《关于创新发展新型跨境易货贸易，\n\n推动高质量共建“一带一路”的建议》\n\n被九三学社中央采纳\n\n转化为全国政协十四届四次会议\n\n九三学社界别提案\n\n她荣获九三学社全国优秀社员\n\n连续3年获得九三学社山东省委会\n\n参政议政、信息、宣传工作先进个人\n\n获评省发改委优秀研究成果奖三等奖\n\n　岗位建功实干赋能开放\n\n立足县域外贸发展主战场\n\n杨秀梅积极投身对外开放发展改革一线\n\n累计走访重点企业50余次\n\n实地摸排罐头、木业、建材、手套等产业\n\n出海过程中的痛点堵点\n\n结合金融视角分析企业资金瓶颈\n\n依托发改产业规划思路\n\n找准产业升级方向\n\n牵头撰写形成高质量专项调研报告\n\n为县域外贸提质扩容明确行动方向\n\n 她坚持分层分类、靶向施策\n\n重点帮扶18家骨干外贸企业\n\n精准引导70家中小微企业纾困发展\n\n推动15家意向企业“出口破零”\n\n组织20余场政策宣讲培训会送策上门\n\n统筹组织200余家企业\n\n参与国内外展会、经贸对接活动30余场\n\n助力县域外贸增长势能充分释放\n\n　多面出彩绽放别样芳华\n\n杨秀梅还以公职律师身份\n\n助力县域法治营商环境建设\n\n她参与审核对外合同协议\n\n组织开展法治宣传教育\n\n防范化解涉外经贸领域法律风险\n\n以法律专业力量\n\n守护企业出海行稳致远\n\n她多次获全国、省、市级征文奖项\n\n被吸纳为山东省散文学会会员\n\n从一线问需到谋策纾困\n\n从外贸攻坚到到法治守护\n\n从议政建言到文学抒怀\n\n杨秀梅以复合型“多面手”姿态躬身实干\n\n以“有心人”的执着笔耕不辍\n\n生动展现一名党外干部的\n\n综合素养与责任担当\n\n梅立枝头，暗香自来\n\n杨秀梅将步履不息、笔耕不辍\n\n秉寒梅坚韧不拔之风骨笃行实干\n\n继续在沂蒙热土之上\n\n静绽芳华、漫吐清芬\n\n供稿：平邑县委统战部\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb31aea6574","title":"多名中国公民在赞比亚因非法采金被捕，中使馆提醒","url":"https://www.chinanews.com.cn/hr/2026/11-19/10734486.shtml","summary":"中新网11月19日电 据中国驻赞比亚使馆微信公众号消息，近日，16名中国公民在赞比亚穆钦加省因无证非法开采和加工黄金，污染当地河流，被赞有关安全和执法部门逮捕。","summary_short":"中新网11月19日电 据中国驻赞比亚使馆微信公众号消息，近日，16名中国公民在赞比亚穆钦加省因无证非法开采和加工黄金…","digest":"据中国驻赞比亚使馆微信公众号消息，近日…","points":["中新网11月19日电 据中国驻赞比亚使馆微信公众号消息，近日…","赞矿业监管部门早前在发现有关情况后，已向涉事人员下达停业整顿令，但其无视禁令继续开采…","根据有关法律规定，在赞从事包括黄金在内的矿物勘探、开采、浮选、加工和交易等活动…"],"section":"其他","category":"兩岸國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T11:03:46+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据中国驻赞比亚使馆微信公众号消息，近日，16名中国公民在赞比亚穆钦加省因无证非法开采和加工黄金，污染当地河流，被赞有关安全和执法部门逮捕。赞矿业监管部门早前在发现有关情况后，已向涉事人员下达停业整顿令，但其无视禁令继续开采，最终酿成严重后果。\r\n\n　　根据有关法律规定，在赞从事包括黄金在内的矿物勘探、开采、浮选、加工和交易等活动，须依法在赞有关部门取得相应资质和许可。其中，赞政府对手工采矿和小规模采矿有严格主体限制，外国公民和外资企业不得擅自从事不符合规定的采矿活动。未经许可开展采金等有关矿业活动，可能面临罚款、监禁等法律处罚，相关设备及矿产品也可能被依法查扣。\n\n　　中国政府坚决反对我公民以任何形式参与非法采金行为。驻赞比亚使馆在此郑重提醒中国公民和机构，非法采金不仅触犯当地法律规定，更伴随绑架、暴力冲突等极高风险。切勿抱有侥幸心理，以身试法，给自身带来安全风险和财产损失，有关行为也将受到法律严惩。\n\n　　赞比亚报警电话：991\n\n　　外交部全球领事保护与服务应急热线(24小时)：\n\n　　+86-10-12308\n\n　　+86-10-65612308\n\n　　驻赞比亚使馆领事保护与协助电话：\n\n　　+260-977790322 【编辑:惠小东】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c29bc941170","title":"古与今的书法对话！千年浯溪再添书法碑刻","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-19/news1075434.shtml","summary":"近日，湖南祁阳。","summary_short":"近日，湖南祁阳。","digest":"古与今的书法对话！千年浯溪再添书法碑刻","points":["为迎接12月上旬在湖南永州举行的第七届湖南旅游发展大会…","浯溪摩崖石刻始于唐代元结撰文、颜真卿书写的《大唐中兴颂》，是享誉全国的露天碑林…","为延续石刻文脉，祁阳开辟浯溪摩崖石刻新区，构建“古摩崖区+新碑林区”格局…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T10:53:42+08:00","size":1,"keywords":[],"body":"近日，湖南祁阳。为迎接12月上旬在湖南永州举行的第七届湖南旅游发展大会，祁阳浯溪摩崖石刻新碑林区首批20件书法作品正抓紧镌刻，古老碑林将以崭新姿态迎接八方来客。\n\n浯溪摩崖石刻始于唐代元结撰文、颜真卿书写的《大唐中兴颂》，是享誉全国的露天碑林，历经千年积淀，形成“诗、文、书、石”共生的独特文化瑰宝。为延续石刻文脉，祁阳开辟浯溪摩崖石刻新区，构建“古摩崖区+新碑林区”格局：老区守好“中兴”根脉，保护展示历代摩崖石刻遗存；新区围绕“复兴”主题，集中展示近现代书法精品。(谭俊杰 陈小玲 伍彬彬 彭旭 制作 周昂煜)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/FC34F9FE0660431ABB0D219C4349CC15.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c15cc2753d0","title":"Peltola finally gets to celebrate Alaska senate race win","url":"https://news.tvb.com/tc/1207193-PeltolafinallygetstocelebrateAlaskasenateracewin","summary":"Democrat Mary Peltola celebrated her Alaska win on Wednesday after defeating two-term Republican Sen…","summary_short":"Democrat Mary Peltola celebrated her Alaska win on Wednesday…","digest":"Democrat Mary Peltola celebrated her Alask…","points":["Peltola denies knowing any other candidate on…","Daniel J. Sullivan Jr., a retired schoolteache…","The situation drew condemnation from the White…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T10:25:00+08:00","size":1,"keywords":["Alaska","Mary peltola"],"body":"US federal authorities have escalated a criminal investigation into the Alaskan Senate race following allegations that Democratic candidate Mary Peltola's campaign coordinated to plant a same-name spoiler candidate on the ballot to siphon votes from the Republican incumbent.\n\nPeltola denies knowing any other candidate on the ballot while US President Donald Trump calls the move \"totally illegal.\"\n\nThe US Justice Department intensified its investigation into the Alaskan Senate race after a New York Times report detailing interviews, text messages and documents from Democratic candidate Mary Peltola's team aimed to coax a candidate with a similar name to the incumbent Republican senator into the race with the aim of confusing voters.\n\nDaniel J. Sullivan Jr., a retired schoolteacher, has been included in the Alaskan Senate race ballot alongside incumbent US Republican Senator Dan S. Sullivan and Peltola.\n\nAlaska's Republican Governor Mike Dunleavy ordered a separate state investigation, stating the deliberate manipulation of ballots directly struck at the \"integrity\" of elections.\n\nThe situation drew condemnation from the White House.\n\nSpeaking to reporters while campaigning in South Carolina, US President Donald Trump accused Democrats of \"conspiracy.\"\n\n\"So they got a guy named Dan Sullivan to go up against on a ballot, Dan Sullivan.\n\nSo you split, it's called splitting the vote, totally wrong, totally illegal.\n\nThis is voter fraud at the highest level.\n\nNot even that, he even looks a little bit like him.\n\nDo you ever see the pictures?\n\nIt's the craziest thing I've ever seen.\" said Trump.\n\nMeanwhile, addressing supporters at a rally in Juneau, Alaska, Peltola denied any wrongdoing or prior knowledge.\n\n\"I just want to clear the air.\n\nI knew nothing about any other candidates on the ballot except for me and the incumbent.\n\nThat is all I have ever known about.\n\nI am not interested in tricking voters.\n\nI know I can beat Dan Sullivan.\" said Peltola.\n\nOn the streets of Juneau, residents remained divided over the controversy.\n\nWhile some residents viewed the candidate manoeuvring as standard political strategy, rather than a criminal offence, independent voters expressed deep concerns the scandal provided fuel for critics to attack the democratic process.\n\n\"But it's not illegal and it is not unusual and so to me I'm really pissed off that the New York Times ran this article that puffed up something that is completely normal and not illegal.\" said a resident.\n\n\"I think there's no denying it and if I heard her say that it didn't happen or I don't know nothing about it, I would just at that point think even less of her because I'd believe she'd be lying.\" said an independent voter.\n\nThe controversy came as the country prepared for the upcoming mid-term elections with Trump's Republicans facing a strengthening Democrat opposition.","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026ti1bVjnjjI1795055093.jpg?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cae062d7a37","title":"APEC summit group photo taking session","url":"https://news.tvb.com/tc/1207188-APECsummitgroupphototakingsession","summary":"The APEC Economic Leaders' Meeting has opened, with leaders first taking a group photo ahead of the…","summary_short":"The APEC Economic Leaders' Meeting has opened…","digest":"The APEC Economic Leaders' Meeting has ope…","points":["President Xi made a rare appearance at the air…","The gesture was to reciprocate the welcome tha…","The two leaders exchanged high-profile greetin…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T10:00:00+08:00","size":1,"keywords":["APEC","APEC Summit","APEC 2026","APEC China Year"],"body":"US President Donald Trump's plane has touched down in APEC host city Shenzhen, China's booming hub for advanced tech in Guangdong province. President Xi Jinping paid Trump a special honour by personally greeting him on the tarmac upon his arrival.\nPresident Xi made a rare appearance at the airport today to welcome Donald Trump, whose Air Force One landed in Shenzhen for the APEC Leaders' Meeting.\nThe gesture was to reciprocate the welcome that the US president extended to the Chinese leader during his Washington visit in September this year.\nThe two leaders exchanged high-profile greetings at the foot of the airplane's stairs with a handshake and a hug.\nTrump saluted next to Xi as they posed for photos.\nTrump, who is seeking to reinforce the US status as the world's leading technology power, wants to take an improvised approach during his stay in the Chinese city and project strength and certainty ahead of a historic three-way summit with Xi and Russian President Vladimir Putin scheduled for Thursday.\nBesides the trilateral sit-down, Trump also teased the possibility of a private meeting with Putin and a separate conversation with Kim Jong Un.\nUS Secretary of State Marco Rubio clarified the meeting with Kim \"may not happen\" while saying the US president was \"serious\" about engaging with the North Korean leader as a way of resolving tensions on the Korean peninsula.\nShenzhen is the second stop of Trump's whirlwind Asia tour.\nEarlier on Wednesday, Philippine President Ferdinand Marcos Jr. gave Trump a red-carpet welcome at the Malacanang presidential palace, followed by a state banquet.\nTrump announced a trade deal between the United States and the Philippines was \"consummated\" without giving further details.\nHe touted an expansion of defence cooperation with Manila and said his administration approved over 5 billion US dollars in arms sales, suggesting the two countries could work together on a potential civilian nuclear power project.\nTrump also told Marcos at the bilateral talks he's \"not concerned\" about the situation in the contested South China Sea and that the US alliance with the Philippines has never been better.\n\"I'm not concerned at all. I'm not concerned about that at all, that'll be taken care of,\" Trump said.","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026PctSk6PxYz1795057337.bmp?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c82430833a7","title":"艺术能给乡村带来什么？川美十四年乡村实践展作答","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-19/news1075427.shtml","summary":"11月18日，“大地流彩——四川美术学院文艺赋美乡村实践展”在全国农业展览馆开幕，系统呈现这所艺术院校自2012年以来十四年扎根西部、以艺术赋能乡村全面振兴的实践成果。","summary_short":"11月18日，“大地流彩——四川美术学院文艺赋美乡村实践展”在全国农业展览馆开幕…","digest":"11月18日，“大地流彩——四川美术学院文艺赋美乡村实践展”在全国农业展览馆开幕…","points":["11月18日，“大地流彩——四川美术学院文艺赋美乡村实践展”在全国农业展览馆开幕…","展览设“与历史同行”“为乡村赋美”“以田野育人”三个单元，覆盖贵州羊磴、璧山七塘、西藏强钦…","据四川美术学院院长焦兴涛介绍，十四年来学校在全国开展920项服务乡村项目与教学实践…"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T09:49:09+08:00","size":1,"keywords":[],"body":"11月18日，“大地流彩——四川美术学院文艺赋美乡村实践展”在全国农业展览馆开幕，系统呈现这所艺术院校自2012年以来十四年扎根西部、以艺术赋能乡村全面振兴的实践成果。展览设“与历史同行”“为乡村赋美”“以田野育人”三个单元，覆盖贵州羊磴、璧山七塘、西藏强钦、四川夹江、重庆酉阳五个代表性案例。\n\n据四川美术学院院长焦兴涛介绍，十四年来学校在全国开展920项服务乡村项目与教学实践，超13万人次师生参与，带动地方经济效益70亿元。焦兴涛表示，乡村全面振兴不只需要产业之实、生态之美，也需要文化之魂、精神之丰。艺术如何参与乡风文明建设、如何激发村民和乡村孩子的创造力，是这个展览想回答的问题。\n\n展览将持续至12月15日。\n\n(记者 刘超)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/A4FEE7F85EBF42468176091C2C07C7E2.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2499159dfa","title":"别让你的骨头比你先老 预防骨质疏松记住“3+4”","url":"https://www.chinanews.com.cn/jk/2026/11-19/10734466.shtml","summary":"很多人觉得骨质疏松不是大事  　　这是一个很大的误区  　　事实上  　　骨质疏松会让骨骼脆性增加\r  　　一旦跌倒极易发生骨折  　　骨折后可能致残  　　严重时甚至危及生命  　　报告单上的指标到…","summary_short":"很多人觉得骨质疏松不是大事  　　这是一个很大的误区  　　事实上  　　骨质疏松会让骨骼脆性增加\r  　　一旦跌倒极易…","digest":"很多人觉得骨质疏松不是大事  　　这是一个很大的误区  　　事实上  　　骨质疏松会…","points":["很多人觉得骨质疏松不是大事","发生髋部骨折后1年内，约20%的患者可能死于各种并发症，约50%的患者致残，生活质量明显下降","-4＜指数≤-1，属于中风险，建议到医院咨询，提前干预"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:37:46+08:00","size":1,"keywords":[],"body":"很多人觉得骨质疏松不是大事\n\n　　这是一个很大的误区\n\n　　事实上\n\n　　骨质疏松会让骨骼脆性增加\r\n\n　　一旦跌倒极易发生骨折\n\n　　骨折后可能致残\n\n　　严重时甚至危及生命\n\n　　报告单上的指标到底是什么意思？\n\n　　我们应该如何科学对待骨质疏松？\n\n　　3个方法发现骨质疏松\n\n　　4个关键应对骨质疏松\n\n　　一起来看～\n\n　　01\n\n　　骨质在无声无息中流失\n\n　　人群普遍规律\n\n　　30～35岁：骨量达到峰值\n\n　　36～49岁：维持稳定，缓慢流失\n\n　　50～69岁：迅速减少\n\n　　70岁以上：持续减少\n\n　　过程：骨量减少—骨质疏松症—骨折\n\n　　发生骨质疏松性骨折后，患者的致残率和死亡率会显著增加，第一次骨折之后，再发骨折风险较高。\n\n　　其中，髋部骨折是骨质疏松症严重的并发症。发生髋部骨折后1年内，约20%的患者可能死于各种并发症，约50%的患者致残，生活质量明显下降。\n\n　　而这种风险离我们并不遥远。全国骨质疏松症流行病学调查显示，我国50岁以上人群骨质疏松症患病率为19.2%，其中50岁以上女性为32.1%，65岁以上女性患病率更达到51.6%。\n\n　　02\n\n　　3个方法，测一测骨质疏松风险\n\n　　OSTA亚洲人骨质疏松自我筛查工具(主要适用于绝经后亚洲女性)\n\n　　计算方法：(体重kg-年龄)×0.2=OSTA风险指数\n\n　　结果分析：\n\n　　指数＞-1，发生骨质疏松的风险较低；\n\n　　-4＜指数≤-1，属于中风险，建议到医院咨询，提前干预；\n\n　　指数≤-4，为高风险，建议尽快到医院做骨密度检查。\n\n　　举例说明：体重50公斤，年龄85岁的人，风险指数为(50－85)×0.2=-7，结果≤-4，提示骨质疏松高风险。\n\n　　3大症状，警惕骨质疏松\n\n　　腰背痛；\n\n　　驼背；\n\n　　身高缩短超过3厘米。\n\n　　以上3种情况，常提示可能存在脊柱压缩改变，需要排查骨质疏松。\n\n　　骨密度检测：报告上的3个核心指标\n\n　　双能X线骨密度检测是诊断骨质疏松的金标准，筛查建议如下：\n\n　　常规筛查人群：建议将骨密度纳入40岁以上人群常规体检项目。\n\n　　高危人群：长期服用激素、有脆性骨折史、体重过低、有烟酒嗜好等高危人群，即便没有不适，也建议主动排查骨量。女性早绝经(45岁前)、男性存在性腺功能减退症，同样需要尽早评估骨骼健康。\n\n　　T值：绝经后女性、50岁以上男性的诊断核心\n\n　　它是诊断骨质疏松的核心指标，对应分级标准如下：\n\n　　T值≥-1：骨量处于正常范围；\n\n　　-2.5＜T值＜-1：骨量减少，属于骨质疏松前期；\n\n　　T值≤-2.5：可诊断为骨质疏松症。\n\n　　Z值：绝经前女性、50岁以下男性的参考指标\n\n　　判断骨量是否符合自身年龄的正常水平。\n\n　　判断标准：\n\n　　Z值＞-2：骨量处于同年龄段的平均水平；\n\n　　Z值≤-2：骨密度低于同年龄人群平均水平，需要排查原因并积极干预。\n\n　　只看骨密度不够：结合动态指标判断流失速度\n\n　　骨密度反映的是骨骼的静态状态，只能体现检测当下的骨量水平，无法判断骨量丢失的快慢。\n\n　　如果想要了解近3个月的骨代谢动态、骨量流失速率，还需检测骨转换生化标志物。这项血液指标可以反映骨吸收与骨形成的活跃程度，和骨密度结果结合分析，才能更准确评估是否需要及时启动药物干预。\n\n　　另外需要注意，骨骼代谢周期较长，骨密度复查不宜过于频繁，通常6个月—1年检测1次即可，6个月内复查一般很难观察到明显变化。\n\n　　03\n\n　　日常护骨4字诀：吃、晒、动、戒\n\n　　骨量的积累与维护，离不开日常的健康管理，做好4件事，守护骨骼健康。\n\n　　吃：补足钙与优质蛋白\n\n　　充足的钙与蛋白质摄入，是维护骨骼健康的核心营养基础。\n\n　　普通健康成年人每日蛋白质推荐摄入量为0.8～1.0克/千克体重；\n\n　　骨质疏松人群、老年群体建议提升至每日1.0～1.2克/千克体重，以维持肌肉量、保障骨代谢正常运转；\n\n　　高龄、消瘦或已发生脆性骨折的患者，可进一步增至1.2～1.5克/千克体重，有助于降低肌肉衰减与再发骨折的风险。\n\n　　补钙优先通过膳食实现，建议每日摄入至少300毫升牛奶或相当量的奶制品，搭配豆制品、深绿色叶菜、鱼虾类等富钙食物。\n\n　　日常还要避免过度节食减重，防止营养摄入不足持续损耗骨量。\n\n　　晒：促进维生素D合成\n\n　　维生素D是钙吸收的“搬运工”，每日接受10～20分钟的日晒，可促进皮肤自行合成维生素D，帮助钙质沉积到骨骼中。注意避免正午强光暴晒，防止皮肤晒伤。\n\n　　动：给骨骼适度应力刺激\n\n　　骨骼遵循“用进废退”的原则，负重与力量训练能给骨骼施加良性刺激，促进骨形成。\n\n　　日常可选择快走、慢跑、跳绳、球类运动、深蹲等，既能锻炼肌肉，也能强化骨骼强度。\n\n　　戒：避开伤骨坏习惯\n\n　　戒烟限酒，避免过量饮用碳酸饮料、咖啡，尽量避免或少用影响骨代谢的药物，避免长期过度节食，减少骨量的不必要消耗。\n\n　　专家提醒：\n\n　　如果已确诊骨质疏松，或骨量减少且骨转换指标提示骨流失速度很快，仅靠补充营养远远不够。\n\n　　需由医生结合骨密度水平、骨代谢类型进行评估，选择规范的抗骨质疏松药物方案，有助于改善骨密度、降低骨折风险。\n\n　　应对骨质疏松行动指南\n\n　　测一测骨质疏松风险，试试这3个方法\n\n　　1.(体重kg-年龄)×0.2=OSTA风险指数，指数≤-4，建议尽快到医院做骨密度检查；\n\n　　2.骨密度检测；\n\n　　3.腰背痛、驼背、身高缩短超过3厘米。\n\n　　做好4件事，守护骨骼健康\n\n　　1.吃：每天摄入适量牛奶或酸奶，多吃豆制品、深绿色叶菜、鱼虾类食物，同时避免过度节食减重。\n\n　　2.晒：每日接受10～20分钟的日晒。\n\n　　3.动：日常可选择快走、慢跑、跳绳、球类运动、深蹲等。\n\n　　4.戒：戒烟限酒，减少含糖饮料、浓咖啡的过量摄入，避免长期过度节食。\n\n　　温馨提示\n\n　　本文为健康科普，不替代专业诊疗。骨量异常、腰背持续疼痛、身高明显缩短，请及时到骨科或内分泌科就诊，遵医嘱检查、干预。\n\n　　钙剂与维生素D仅作为基础营养支持，单纯补充一般难以逆转骨密度下降，也无法单独有效降低骨折风险，不能替代药物治疗。 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c861b4f9173","title":"黃仁勳出軌｜美報告：去年6月已約談黃樂 Nvidia同期將Megaspeed列禁售名單","url":"https://www.stheadline.com/realtime-world/3638763/黃仁勳出軌美報告去年6月已約談黃樂Nvidia同期將Megaspeed列禁售名單","summary":"英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層黃樂（Alice Huang）的婚外情風波持續。","summary_short":"英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層黃樂（Alice Huang…","digest":"英偉達（Nvidia…","points":["英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層…","美國商務部與司法部披露，美方早於2024年已就Megaspeed涉嫌違反出口管制展開調查…","英偉達亦於同月將Megaspeed列入公司「禁售」名單"],"section":"其他","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:37:02+08:00","size":1,"keywords":[],"body":"英偉達（Nvidia，又稱輝達）前行政總裁黃仁勳與新加坡雲端運算公司Megaspeed前高層黃樂（Alice Huang）的婚外情風波持續。美國商務部與司法部披露，美方早於2024年已就Megaspeed涉嫌違反出口管制展開調查，並於去年6月派員到公司實地查核及約談黃樂；英偉達亦於同月將Megaspeed列入公司「禁售」名單。\n2024年啟動調查　去年要求交出銷售紀錄\n兩部門在聯合聲明中表示，當局透過主動監察敏感半導體可能遭轉運的情況，發現可疑活動，遂於2024年啟動調查。商務部調查人員於2025年5月要求英偉達提交直接或間接向Megaspeed銷售產品的紀錄，英偉達翌月將該公司列入禁售名單。\n相關新聞：黃仁勳下台｜Nvidia宣布提前加薪派股權穩軍心 重申無意讓黃回歸\n聲明指，商務部工業與安全局人員其後聯同新加坡執法機關，於2025年6月到Megaspeed進行實地最終用途查核，並約談當時擔任行政總裁的黃樂。司法部其後接手主導刑事調查，惟聲明未交代具體接手日期，亦未公布針對Megaspeed的起訴。\nCNN：現有情報不足證明黃樂從事間諜活動\nCNN報道，美國商務部長盧特尼克近日因處理Megaspeed案的步伐受到質疑，財政部長貝森特亦曾批評商務部，延誤將這家英偉達客戶識別為潛在國安威脅。兩部門表示，雖然一般不評論進行中的調查，但認為有必要向公眾交代事實，澄清報道中的不準確資訊。\n至於黃樂被指可能與情報活動有關，CNN引述多名消息人士指出，美國情報界仍在釐清她與中國政府的關係，目前掌握的情報不足以證明她曾為北京從事間諜活動。相關懷疑不能視為已獲證實的結論。\n新加坡稱未查間諜活動　黃樂已被禁再入境\n新加坡內政部早前公布，當地警方及海關於2025年2月展開獨立調查，涉及採購伺服器時可能作出虛假申報等罪行。黃樂當時是Megaspeed行政總裁、主席及主要控制人之一，因此接受調查；當局強調，並非就間諜活動調查她。\n新加坡警方今年2月經諮詢總檢察署後，認為證據不足以確立黃樂涉及相關申報罪行。不過，警方認定她在調查期間提供明知不準確的資料，試圖淡化自己在公司的角色，因此向她發出嚴厲警告，並禁止她再次入境。當局於2月26日歸還護照，她同日離境；針對Megaspeed及另外6人的調查仍在進行。\nMegaspeed則表示，黃樂已於2025年8月離職，目前未在公司擔任任何職務，並反駁近期部分涉及其業務、供應鏈及全球營運的報道，指相關說法缺乏可核實證據。\n\n <div","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc1f8231ca5","title":"廈門教區劉恆平祝聖主教4個月來全國第六位","url":"https://www.stheadline.com/realtime-china/3638761/廈門教區劉恆平祝聖主教4個月來全國第六位","summary":"內地再有天主教主教獲祝聖。","summary_short":"內地再有天主教主教獲祝聖。","digest":"內地再有天主教主教獲祝聖","points":["內地再有天主教主教獲祝聖","天主教廈門教區劉恆平主教祝聖典禮昨日在福建省廈門市鷺江道天主教堂舉行","這是4個月來內地第六名獲祝聖的主教，據了解同樣獲得中梵雙方認可"],"section":"其他","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:34:11+08:00","size":1,"keywords":[],"body":"內地再有天主教主教獲祝聖。天主教廈門教區劉恆平主教祝聖典禮昨日在福建省廈門市鷺江道天主教堂舉行。這是4個月來內地第六名獲祝聖的主教，據了解同樣獲得中梵雙方認可。典禮由中國天主教主教團副主席、杭州教區楊永強主教主禮。神父、修女和教友代表共500人參加祝聖典禮。\n現年54歲的劉恆平，生於福建省漳州市龍海區，在上海佘山修院攻讀神哲學，現任福建省天主教愛國會副主任，今年6月當選為廈門教區候任主教。\n\n <div","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cba23198f97","title":"上课点名、体育长跑、饭卡充值……校园App为何越装越多？","url":"https://www.chinanews.com.cn/edu/2026/11-19/10734464.shtml","summary":"近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。","summary_short":"近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。","digest":"近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生…","points":["近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生…","体育环(长)跑、上课点名、接水饮水、饭卡充值……校园生活的每一处场景…","“校园App臃肿”的话题在网上引发激烈讨论，仅微博平台的相关话题阅读量就接近1亿"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T08:30:29+08:00","size":1,"keywords":[],"body":"近年来，随着“智慧校园”建设推进，各类移动应用本应方便师生，如今却在一些高校变成了学生手机里的负担。体育环(长)跑、上课点名、接水饮水、饭卡充值……校园生活的每一处场景，几乎都对应着不同的App或小程序。“校园App臃肿”的话题在网上引发激烈讨论，仅微博平台的相关话题阅读量就接近1亿。校园App为何越装越多？解决之道何在？\r\n\n　　校园里的数据孤岛\n\n　　打开不少大学生的手机，“超星学习通”“今日校园”“创高体育”“U净洗衣”“胖乖生活”等不同门类的App占满了屏幕，每一个都需要单独下载、注册并授权。2025年12月，一项面向全国高校大学生的问卷调查显示，97.72%的受访者日常使用校园App，其中93.89%的受访者在使用过程中受到不同程度的困扰。\n\n　　尽管吐槽不断，但独属校园的这些App又“不得不用”。以上课为例，三四个App都能签到，两三个平台都可随堂测验，任课老师挑自己顺手的用，学生却一个都不敢删。北京某高校大二学生小玖受访时表示，其英语课作业需用3个App才能完成：“批改网”写作文、“U校园”听听力、“fif口语训练平台”练口语。“它们太占内存了，等学期结束后，我打算都删了。”小玖说。\n\n　　有些应用看似体贴地提供了微信、支付宝小程序作为“轻量替代”，功能却大打折扣。华中某高校的学生宿舍洗衣机关联着“海乐生活”平台，学生小林就因小程序常常卡顿、无法使用预约功能，不得不专门下载了App。\n\n　　除了功能单一，商业广告多、运行不稳定、存在数据泄露风险等问题，这类校园App让学生不堪其扰。小玖学校的饮水机用的是一款叫“慧生活798”的App，每次喝水前都得先连着关掉几个弹窗，稍不留意就会“跳转”到购物软件。不少网友抱怨“洗个澡得先看一串广告”“看完广告热水都凉了”。\n\n　　校企各方整合难\n\n　　部分校园App乱象的根源，在于一些高校各部门各自为政，教务、学工、后勤、团委等部门往往只关注自身的管理需求，各部门对接不同供应商：每当合约到期、重新招标，系统便可能整体更换，学生只能重新下载、注册。\n\n　　企业逐利，绑架了学生的刚需。由第三方企业运营的生活服务类App一旦与校园生活强绑定，学生的手机便成为企业“跑马圈地”的沃土。对企业而言，校园是稳定的精准流量池，开屏广告、跳转流量与支付分成，共同构成了这个近乎稳赚不赔的商业闭环。有些App还强制要求开通免密支付、自动扣费，或设置最低充值金额。若学生想要退款，则颇为麻烦，甚至需要拨打12315投诉热线才能成功维权。\n\n　　在智慧校园的建设过程中，App的数量更被部分高校领导当作数字化建设的“成绩单”。校方只在意表面形式，并不关心学生使用是否便捷。西北某高校一位研究生透露，她居住的宿舍楼，若是热水器坏了，需要学生自己打电话给设备维修人员。“学校才不管，凡是不涉及安全的事，一律外包。”北方某高校一名在校内网络中心勤工俭学的学生发现，学校的部分系统版本仍停留在本世纪初，与新搭建的平台集成时问题不断，但“领导觉得好，我们就得用”。\n\n　　更何况，对于一些高校而言，新建一个平台远比多下载一个App来得麻烦——整合各方意味着协调各部门权责、触动企业利益、打破路径依赖。谁来牵头？谁来出钱？数据归谁管？就算高校有心，又能否真正实现？西部某高校相关负责人坦言，一些高校尝试自主研发软件系统，但技术能力有限，常出现各类故障；一些高校则外包给第三方，也常面临业务功能与现有系统不兼容，导致平台瘫痪的问题。\n\n　　年轻人开始自己动手\n\n　　好的数字化，应当围绕“人”转。2019年，教育部等8部门印发意见，划定备案审查、自愿选用的底线。近年来，相关部门也多次开展专项整治，要求清理冗余应用、规范广告推送。2026年8月，个人信息保护系列专项行动取得阶段性成效，不得过度收集个人信息的“最小必要”原则持续收紧。少一些“屏幕上的形式主义”，多一些“一个平台全托管”的踏实，才能让高校师生真正享受到智慧校园的便捷服务。\n\n　　如今，不少熟悉AI工具的学生选择“自力更生”：以Vibecoding的方式自行搭建集成式校园平台。来自华南某高校的小鹤同学，因为请假和订校车这两件“小事”反复受阻，所以萌生了自己动手的念头。他前后用了3天时间，搭建了一个可以代管自己在校事务的Agent，并将开源代码发布到网上。上海学生小C则围绕“Z世代校园数字生态系统设计”课题，仅用1天就搭起了一站式整合方案的雏形。\n\n　　西南大学教育学部教授彭泽平认为，高校应牵头建设功能高度集成、数据统一汇聚的智慧校园基础平台。学生之所以自行开发，根源在于其对轻量化、场景化、个性化服务的需求，与校方所提供的标准化、统一化平台之间存在错位。这些自下而上的实践不仅贴近场景，还能成为校方优化服务的“鲜活信号”。有学生反映，他使用的校园App就是民间自行开发、后被学校网络中心“招安”的，“功能越来越多，确实方便不少”。\n\n　　与其让学生各自“破墙”，不如敞开大门。重庆市教育科学研究院助理研究员邹南芳建议，将学生设计应用纳入课程学习、科研训练、专业实践等培养环节，实现数字化治理与人才培养的有机统一。在数据安全、接口合规、个人信息保护、可持续维护和责任归属等方面，学生自制应用存在一定的不确定性，校方可以开放合规、分级的标准化数据接口，建设开发沙箱与测试机制，按“最小必要”原则界定调用权限，让年轻人的热情与创造力在规则边界内自由奔涌、充分释放。\n\n　　半月谈记者：徐盛悦\n\n　　原标题《开学一个多月，手机多了十几个App》 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7ba4fb9aa1","title":"Vibrant Bougainvillea in Nanning Qingxiushan","url":"https://news.tvb.com/tc/1207227-VibrantBougainvilleainNanningQingxiushan","summary":"Inside Guangxi's Nanning Qingxiushan Scenic Area, the bougainvillea blossoms have reached their dazz…","summary_short":"Inside Guangxi's Nanning Qingxiushan Scenic Area…","digest":"Inside Guangxi's Nanning Qingxiushan Sceni…","points":["Inside Guangxi's Nanning Qingxiushan Scenic Ar…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T13:23+08:00","size":1,"keywords":[],"body":"Inside Guangxi's Nanning Qingxiushan Scenic Area, the bougainvil
