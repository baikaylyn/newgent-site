紧急警报。\n\n　　胡塞武装军事发言人叶海亚·萨雷亚20日晚在社交媒体发文说，沙特过去24小时内发动了78次袭击，目标涉及也门首都萨那以及荷台达、塔伊兹、拉赫季、萨达和马里卜等地，造成多人死亡。\n\n　　据也门胡塞武装控制的马西拉电视台20日傍晚报道，当地卫生部门发表声明说，过去24小时内，沙特在也门的军事行动共造成41人死亡，其中包括11名儿童和7名妇女，另有28人受伤。\r\n\n　　声明还指出，自冲突升级以来，也门累计死亡人数达438人，另有924人受伤。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6f94ff7a31","title":"探访秘鲁钱凯港：跨越太平洋的发展新机遇","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735662.shtml","summary":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际…","summary_short":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024年11…","digest":"题：探访秘鲁钱凯港：跨越太平洋的发展新机遇  　　中新社记者 林春茵  　　2024…","points":["2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际…","秘鲁首都利马以北约80公里，碧蓝的太平洋畔，钱凯港巨型岸桥高高耸立，智能集卡穿梭于集装箱堆场","目前，钱凯港已建成4个生产性泊位，配备6台远程操控岸桥、15台自动化轨道吊、50台智能集卡…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:32:08+08:00","size":1,"keywords":[],"body":"中新社秘鲁钱凯11月20日电 题：探访秘鲁钱凯港：跨越太平洋的发展新机遇\n\n　　中新社记者 林春茵\n\n　　2024年11月，亚太经合组织(APEC)领导人非正式会议在秘鲁举行之际，中秘合作建设的钱凯港正式开港。两年后，APEC时间来到中国深圳。作为亚太互联互通的标志性项目，钱凯港发生了怎样的变化？记者日前走访这座年轻的港口，探寻答案。\n\n近日，航拍秘鲁钱凯港。(钱凯港 供图)\n\n　　秘鲁首都利马以北约80公里，碧蓝的太平洋畔，钱凯港巨型岸桥高高耸立，智能集卡穿梭于集装箱堆场。走进钱凯港中央控制室，工作人员通过屏幕远程操控码头设备，装卸、运输、堆存等作业环节有序衔接。\n\n　　“从最初的一片荒滩，到如今码头操作区、入口辅建区、隧道及连接道路等基础设施已基本完善。”钱凯港常务副总经理何波亲历了南美洲首个绿色智慧现代化港口从无到有的全过程。\n\n　　何波说，作为连接亚洲与南美市场的重要物流节点，钱凯港开港后，“钱凯—上海”直航航线投入运营，两地海运时间从35至40天缩短至23天。相较直航开通前，物流成本降低逾20%。\n\n　　目前，钱凯港已建成4个生产性泊位，配备6台远程操控岸桥、15台自动化轨道吊、50台智能集卡，港机设备实现100%电气化，生产能源全部采用绿色电力。\n\n　　2026年前9个月，钱凯港累计完成船舶作业323艘次，同比增长31%；集装箱吞吐量达34万标准箱，同比增长47%。\n\n近日，秘鲁钱凯港作业场景。(钱凯港 供图)\n\n　　今年，19.6吨秘鲁鲜食香蕉搭乘“钱凯快航”抵达上海洋山港，首次进入中国市场。从牛油果、蓝莓到香蕉，越来越多拉美农产品摆上中国消费者的餐桌。\n\n　　如今的钱凯港，联通的不仅是中国和秘鲁。开港两年来，钱凯港已形成3条干线、5条支线的航运网络，覆盖亚洲、南美洲西海岸及中美洲主要港口，辐射巴西、厄瓜多尔等拉美国家。\n\n　　今年7月，一条连接秘鲁帕伊塔港、钱凯港与哥斯达黎加卡尔德拉港的支线开通。秘鲁北部及中美洲货物可汇集至钱凯港，搭乘远洋货轮直抵亚洲市场。\n\n　　据秘鲁国家海关与税务管理局统计，2026年前9个月，经钱凯港出口的货物总额达27.68亿美元，同比增长57.27%。\n\n　　“钱凯港有助于进一步畅通亚太与南美之间的贸易往来，提升区域供应链效率。”何波说，跨太平洋运输周期的缩短，为拉美农产品开拓亚洲市场带来新的机遇。\n\n当地时间11月20日，秘鲁钱凯港，钱凯港自动化轨道吊操作员莫妮卡·比索(Nicole　Monica　Bisso　Melendez)正在工作。　丘艳 摄\n\n　　钱凯港自动化轨道吊操作员莫妮卡·比索(Nicole Monica Bisso Melendez)是土生土长的钱凯人，此前从未接触过港口作业，但通过职业技能培训，走上了智能化码头的操作岗位。\n\n　　“我现在能操作吊运数吨货物的大型机械。”莫妮卡·比索说，“对年轻人来说，在钱凯港工作有很好的发展机会。”\n\n　　目前，钱凯港秘鲁籍员工占比近98.88%，来自钱凯、瓦拉尔周边社区的员工占比逾55%，女性员工占比逾20%。港口还联合秘鲁当地行业协会，开展国际贸易、旅游服务、烹饪技艺等职业技能培训，累计惠及逾千名当地青年、妇女和创业者。\n\n　　“港口还为本地供应商和中小企业带来了发展机遇。”钱凯港秘方副总经理杰森表示，钱凯这个传统渔村，正在成长为重要的贸易和物流枢纽。(完)\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4bd28c9816","title":"遊日注意 | 日本受強冷空氣影響 多地迎來初雪","url":"https://www.stheadline.com/realtime-world/3639549/遊日注意-日本受強冷空氣影響-多地迎來初雪","summary":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。","summary_short":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。","digest":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪","points":["日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪","氣象廳表示，受高空冷空氣影響，大氣極不穩定的狀態持續，提醒北陸地區至周日仍須嚴防土石災害","在岐阜縣白川鄉，屋頂被厚厚的白雪覆蓋，四周一片白茫茫"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:31:56+08:00","size":1,"keywords":[],"body":"日本受到強烈冷空氣影響，北海道、東北及北陸等地區出現惡劣天氣，部分地區還觀測到初雪。氣象廳表示，受高空冷空氣影響，大氣極不穩定的狀態持續，提醒北陸地區至周日仍須嚴防土石災害。\n在岐阜縣白川鄉，屋頂被厚厚的白雪覆蓋，四周一片白茫茫。受強烈冬季季候風影響，廣泛地區持續降雪，東北的秋田縣秋田市6小時內錄得20厘米降雪量，岩手縣西和賀町積雪超過40厘米。\n日本受強冷空氣影響，多地迎來降雪。法新社\n岐阜縣白川鄉迎來降雪。白川鄉觀光協會\n厚雪覆蓋白川鄉 旭川積雪22厘米\n北海道旭川有22厘米積雪，深川市積雪則超過30厘米。四國和鳥取縣等地區，以及仙台市及長野市亦迎來初雪。\n在東北的山形縣，周五下午3時左右，東根市國道48號線上一輛大型卡車因降雪受困。縣警表示，後方約50輛車也一度滯留，所幸無人受傷或身體不適。\n多地山區降雪最高50厘米\n氣象廳指，多地降雪主要集中在山區，最高可達到50厘米，又預計北海道周六平均風速達每秒20米，最大陣風則為每秒30米。\n另外，北陸地區截至周六下午6時的24小時累積雨量，局部地區預計可達120毫米，其後24小時還將達80毫米。\n氣象廳表示，冬季型氣壓分布將持續至周六，在北日本至西日本上空約5500米處，將有較往年低約10度、氣溫低於零下30度的強冷空氣流入。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c58cb652a48","title":"丹麦驱逐俄罗斯武官，俄表示将“适当回应”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735674.shtml","summary":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官，要求其在7日内离境。","summary_short":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官…","digest":"综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布…","points":["中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布…","俄外交部表示，将对丹麦驱逐其武官一事“作出适当回应”","据英国《卫报》报道，拉斯穆森当天在哥本哈根举行的记者会上表示…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:27:26+08:00","size":1,"keywords":[],"body":"中新网11月21日电 综合外媒报道，当地时间20日，丹麦外交大臣拉斯穆森宣布，丹麦决定驱逐俄罗斯驻丹麦国防武官，要求其在7日内离境。俄外交部表示，将对丹麦驱逐其武官一事“作出适当回应”。\n\n　　据英国《卫报》报道，拉斯穆森当天在哥本哈根举行的记者会上表示，丹麦已召见俄罗斯驻丹麦大使弗拉基米尔·巴尔宾，告知丹方驱逐俄罗斯国防武官的决定。他称，此举旨在向俄方“发出明确信号”。拉斯穆森同时表示，丹麦不会因此切断与俄罗斯的外交联系，将继续支持乌克兰。\n\n　　拉斯穆森还表示，丹麦正在加大力度，推动停止向俄罗斯公民发放非必要签证，并已在欧洲层面推动进一步收紧俄罗斯公民入境相关规定。据土耳其阿纳多卢通讯社报道，丹麦还计划与其他申根国家讨论相关签证限制。\n\n　　丹麦安全与情报局20日发布通报称，该机构评估认为，俄罗斯情报机构策划并发起了一起针对一名乌克兰裔美国公民的暗杀行动。丹麦有关部门于9月25日挫败了这一行动。\r\n\n　　对于丹方指控，俄罗斯驻丹麦大使馆表示，丹麦方面没有提供俄罗斯参与所谓暗杀行动的证据。俄罗斯外交部发言人扎哈罗娃则表示，莫斯科将对丹麦驱逐俄国防武官一事作出“适当回应”。 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b552d0bc5","title":"太空農業突破 | 模擬月球土壤添加有機物 種出食用馬鈴薯","url":"https://www.stheadline.com/realtime-world/3639541/太空農業突破-模擬月球土壤添加有機物-種出食用馬鈴薯","summary":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊，成功在添加了有機物的模擬月球土壤中，培育出安全且營養豐富的食用馬鈴薯…","summary_short":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊…","digest":"由美國太空總署資助…","points":["由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric G…","這項研究在權威期刊《npj Microgravity》發表…","月球表面的月塵（lunar regolith）由數億年的隕石撞擊形成…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:46:56+08:00","size":1,"keywords":[],"body":"由美國太空總署（NASA）資助、俄勒岡州立大學（OSU）植物生物學家戈耶（Aymeric Goyer）領軍的跨學科團隊，成功在添加了有機物的模擬月球土壤中，培育出安全且營養豐富的食用馬鈴薯，其生長和產量可以媲美地球上種植的馬鈴薯。\n這項研究在權威期刊《npj Microgravity》發表，證實只要在月球模擬岩屑中添加適量有機物質，即可獲得有如地球良田的農作物產量，為未來建立長期月球基地與太空人糧食自給，奠定了關鍵里程碑。\n科學家成功在模擬月球土壤培育出安全且營養豐富的食用馬鈴薯。路透社\n模擬月球土壤的馬鈴薯生長和產量，可以媲美地球上種植的馬鈴薯。路透社\n為月球基地糧食自足鋪路\n月球表面的月塵（lunar regolith）由數億年的隕石撞擊形成，極其鋒利且完全缺乏植物生長所需的氮元素與有機物質，甚至含有高劑量的銅等重金屬。\n研究團隊選用成熟快、紅皮白肉的「Modoc」馬鈴薯品種，並混入蚯蚓分解有機廢棄物產生的「蚯蚓堆肥」（vermicompost）進行試驗。\n產量媲美地球農田\n實驗結果顯示，未添加堆肥的純月塵幾乎無法結出塊莖；然而當堆肥比例提升至30%時，馬鈴薯產量與在俄勒岡州赫米斯頓（Hermiston）優質農地種植的表現完全一致。\n戈耶指出，有機物質不僅提供必需氮素，更能有效阻止植物過度吸收重金屬。\n未來，太空人可以將少量有機物質帶到月球，然後透過將食物殘渣和植物廢料轉化為更多有機物質來製造更多有機物，從而減少從地球運輸生長材料的需求。\n具高度飽足感 視為月球理想主食\n馬鈴薯單位面積熱量極高，富含維生素C、優質蛋白質與比香蕉更高劑量的鉀，具備高度飽足感，被視為月球基地的理想主食。 \n共同作者、太空生物學家漢迪（David Handy）強調，此項月球農業技術未來亦可轉化應用於地球，協助缺乏資源的沙漠地區、貧瘠城市或遭重金屬污染的土壤進行修復，實現地表與太空的永續農業目標。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce42792ac38","title":"特朗普称无法接受伊朗想达成的协议 重申伊朗“永远不会拥有核武器”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735660.shtml","summary":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议，但伊朗方面想要的并非他所能接受的协议。","summary_short":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议…","digest":"据美联社报道，美国总统特朗普当地时间20日表示…","points":["中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示…","特朗普20日在白宫举行的新闻发布会上表示，“我们要达成一项真正的协议，而不是虚假协议","”随后，特朗普再次重申其一贯承诺，“伊朗永远、永远不会拥有核武器"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:31:47+08:00","size":1,"keywords":[],"body":"中新网11月21日电 据美联社报道，美国总统特朗普当地时间20日表示，伊朗希望达成一项结束伊美敌对行动的协议，但伊朗方面想要的并非他所能接受的协议。\n\n资料图：美国总统特朗普。 \n\n　　据报道，特朗普20日在白宫举行的新闻发布会上表示，“我们要达成一项真正的协议，而不是虚假协议。”随后，特朗普再次重申其一贯承诺，“伊朗永远、永远不会拥有核武器。”\n\n　　报道称，特朗普在是否达成协议的问题上态度摇摆：时而主张达成一项结束战事的协议，时而又表示美国无需达成任何协议。分析人士认为，美伊下一步行动充满不确定性，加之最新一轮时强时弱的相互攻击，反映出冲突持续近九个月之际，双方都处于难以为继的境地。\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c236072785d","title":"日媒：日本研究引进核潜艇及为“无核三原则”设例外","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735659.shtml","summary":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。","summary_short":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。","digest":"据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光","points":["新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道…","草案提出“启动研究”引进核动力潜艇问题，并允许在紧急情况下将核武器运进日本","报道援引多名相关人士的话说，该草案设想在2027至2031财年期间启动引进核动力潜艇相关项目…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T10:25:04+08:00","size":1,"keywords":[],"body":"新华社东京11月20日电(记者梁晨 李子越)据日本共同社20日报道，日本政府为年底修订“安保三文件”拟定的草案内容曝光。草案提出“启动研究”引进核动力潜艇问题，并允许在紧急情况下将核武器运进日本。\n\n　　报道援引多名相关人士的话说，该草案设想在2027至2031财年期间启动引进核动力潜艇相关项目，并以“调查研究费”的名义安排必要预算。\n\n　　报道说，引进核动力潜艇和调整“无核三原则”相关表述是此次修订“安保三文件”的主要议题。“无核三原则”指“不拥有、不制造、不运进核武器”。草案一方面声称坚持这一原则，另一方面又明确写入允许在紧急情况下运进核武器的例外情况。\n\n　　报道称，日本政府高层主张拥有核动力潜艇，认为可在艇上搭载导弹垂直发射装置，将其作为实施所谓“强化反击能力”的手段之一。\r\n\n　　日本首相高市早苗10月14日在国会答辩中暗示，可能在今年年底修订《国家安全保障战略》等“安保三文件”时，调整其中有关“无核三原则”的表述。日本多个民间团体11月18日共同向日本外务省提交诉求书，要求政府坚持“无核三原则”，随后又于20日向防卫省递交由4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c978a74b36b","title":"伊朗宣布击落一架美军MQ-1无人机","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735843.shtml","summary":"中新网11月21日电 据伊朗媒体当地时间21日报道，伊朗伊斯兰革命卫队发布声明称，美军的一架MQ-1无人机在伊朗锡里克岛上空被击落。","summary_short":"中新网11月21日电 据伊朗媒体当地时间21日报道，伊朗伊斯兰革命卫队发布声明称…","digest":"据伊朗媒体当地时间21日报道，伊朗伊斯兰革命卫队发布声明称…","points":["中新网11月21日电 据伊朗媒体当地时间21日报道，伊朗伊斯兰革命卫队发布声明称…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T19:29:36+08:00","size":1,"keywords":[],"body":"中新网11月21日电 据伊朗媒体当地时间21日报道，伊朗伊斯兰革命卫队发布声明称，美军的一架MQ-1无人机在伊朗锡里克岛上空被击落。\n\n　　目前美方对此暂无回应。\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"民生","total":57,"items":[{"id":"c900d61aedf","title":"千余人徒步浙江千年古村 畅享绿水青山与人文之美","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735883.shtml","summary":"中新网金华11月21日电(项菁 赵海涵)“真是人文风光俱佳的宝藏地。","summary_short":"中新网金华11月21日电(项菁 赵海涵)“真是人文风光俱佳的宝藏地。","digest":"“真是人文风光俱佳的宝藏地","points":["中新网金华11月21日电(项菁 赵海涵)“真是人文风光俱佳的宝藏地","今天在古道徒步，体验感非常好","”健身爱好者刘圣良21日受访时表示"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:37:14+08:00","size":1,"keywords":[],"body":"中新网金华11月21日电(项菁 赵海涵)“真是人文风光俱佳的宝藏地。今天在古道徒步，体验感非常好。”健身爱好者刘圣良21日受访时表示。\n\n11月21日，2026“环浙步道—浙中环线”八婺徒步接力系列活动(磐安站)期间，多位参与者行走乡间古道。双峰乡人民政府 供图\n\n　　当日，2026“环浙步道—浙中环线”八婺徒步接力系列活动(磐安站)在浙江省金华市磐安县双峰乡大皿村启幕。来自全国各地的1000多名健身、徒步爱好者齐聚这座千年古村，踏古道、越山岭，沉浸式感受浙江绿水青山与人文底蕴交融之美。\n\n　　大皿村坐落于层峦叠嶂的山岙之中，皿溪穿村而过，古屋、古巷、石桥、古井依溪错落分布，村落入选第六批中国传统村落名录。千余年来，羊氏族人在此耕读传家、生生不息，如今村内95%的村民为羊姓，大皿村也素有“中华羊氏第一村”的美誉。\n\n　　古村、民俗、山野等资源集聚，为当地探索“体育+文旅+康养”融合发展打下坚实基础。据了解，本次磐安站徒步线路以大皿村为起终点，途经东坑村，翻越西华岭头，沿途可见连绵竹海、潺潺溪流与层叠山岭。\n\n11月21日，2026“环浙步道—浙中环线”八婺徒步接力系列活动(磐安站)期间，多位参与者享受山野风光。双峰乡人民政府 供图\n\n　　当日阳光正好，随着发令汽笛鸣响，徒步爱好者精神饱满踏上征程。大家穿行山野古道，呼吸山林间的清新空气，饱览青山竹海风光，近距离感受千年古村的烟火与人文。络绎不绝的徒步者、游客也进一步带动了当地生姜、进士酒等农特产品销售。\n\n　　走完全程后，徒步爱好者陈静娴感慨：“一路竹林伴溪，风景很美。虽然有点累，但心里特别放松。”\n\n　　近年来，浙江整合、扩容11个地市现有步道资源，建成“环浙步道”，为徒步、越野、骑行等运动休闲打造新场景。双峰乡则依托磐安县“身心两安、自在磐安”发展定位，以“环浙步道”建设为抓手，深挖古村、古道、民俗资源，串珠成链打造古村研学、古道寻踪、山野康养等特色文旅线路，让藏于深山的古村落持续焕发新活力。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c09a5deb1a9","title":"“小雪”后黑龙江多地进入冰封雪飘时节","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735882.shtml","summary":"中新网哈尔滨11月21日电 (王妮娜 杨爽)11月22日迎来中国传统二十四节气中的“小雪”，黑龙江省自此气温快速走低，大风、降温、降雪天气增多，千里北疆冬意铺展，逐步进入冰封雪飘的时节。","summary_short":"中新网哈尔滨11月21日电 (王妮娜 杨爽)11月22日迎来中国传统二十四节气中的“小雪”，黑龙江省自此气温快速走低…","digest":"11月22日迎来中国传统二十四节气中的“小雪”，黑龙江省自此气温快速走低，大风、降温…","points":["中新网哈尔滨11月21日电 (王妮娜 杨爽)11月22日迎来中国传统二十四节气中的“小雪”…","据黑龙江省气象部门预报，小雪节气首日，大兴安岭、黑河北部有小雪，其中大兴安岭北部有中到大雪…","气温方面，大兴安岭、黑河、伊春大部、齐齐哈尔北部、绥化北部、鹤岗东部、佳木斯大部…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:36:06+08:00","size":1,"keywords":[],"body":"中新网哈尔滨11月21日电 (王妮娜 杨爽)11月22日迎来中国传统二十四节气中的“小雪”，黑龙江省自此气温快速走低，大风、降温、降雪天气增多，千里北疆冬意铺展，逐步进入冰封雪飘的时节。\n\n　　据黑龙江省气象部门预报，小雪节气首日，大兴安岭、黑河北部有小雪，其中大兴安岭北部有中到大雪，哈尔滨东部、牡丹江西部有阵雪。气温方面，大兴安岭、黑河、伊春大部、齐齐哈尔北部、绥化北部、鹤岗东部、佳木斯大部、双鸭山东部、鸡西东部为-8至-4℃，其中大兴安岭北部、黑河北部部分地区为-12至-8℃，其他大部地区为-4至0℃。\n\n　　小雪时节是黑龙江省降雪较多的时期，常伴大风降温。虽名为“小雪”，但此时大雪纷飞甚至出现暴雪并不罕见。根据黑龙江省十三市(地)1991—2020年小雪节气期间降雪日数统计，伊春平均降雪日数为7.0天，“遇雪”概率最高，达46.9%；双鸭山以42.4%紧随其后；黑河为39.8%；佳木斯、鹤岗、七台河、大兴安岭、哈尔滨、牡丹江、绥化“遇雪”概率均超过30%，其他地区在20%至30%之间。\n\n　　气象部门预计，22日至24日，黑龙江省北部和东部地区有小雪，其中22日大兴安岭北部有中到大雪，降雪前后气温波动明显；25日至27日多弱冷空气活动，全省大部多阵雪天气。22日白天，南部地区大气扩散气象条件一般，局地有轻雾或霾。\r\n\n　　气象部门提醒，降雪易导致路面结冰、能见度下降，驾车请减速慢行、保持车距；气温波动较大，建议随时关注最新预报信息，及时增减衣物，做好防寒保暖，预防感冒。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c08cef21b89","title":"重庆举办生命科学产业人才发展大会释放创新动能","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735880.shtml","summary":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会·生命科学产业人才发展大会21日举行。","summary_short":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会·生命科学产业人才发展大会21日举行。","digest":"重庆国际人才交流大会·生命科学产业人才发展大会21日举行","points":["中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会·生命科学产业人才发展大会21日…","大会着力搭建人才交流、科创研讨、产业对接、成果转化的协同发展平台…","现场发布4款1类创新药成果，包括重庆市首个获批上市的1类新药赛立奇单抗…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:34:38+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会·生命科学产业人才发展大会21日举行。\n\n　　大会着力搭建人才交流、科创研讨、产业对接、成果转化的协同发展平台，汇聚多方资源助力生命科学与生物医药产业高质量发展。\n\n　　现场发布4款1类创新药成果，包括重庆市首个获批上市的1类新药赛立奇单抗，全球首款用于狂犬病被动免疫的双特异性抗体斯乐韦米单抗，国产首个靶向BCMA和CD3的双特异性抗体药品纬利妥米单抗，以及国内首个、全球第二款用于儿童青少年白血病的CAR-T细胞治疗创新药普基奥仑赛；抗体偶联药物、创新型医用材料、基因治疗、健康智能装备等领域10个重点项目同步签约。\n\n图为偶联药物产才科金共同体启动仪式。巴南区融媒体中心 供图\n\n　　大会还举办偶联药物产才科金共同体启动仪式。该共同体是重庆市抢抓全球偶联药物黄金赛道、构建完整产业生态的重要平台，将集聚链主企业、高校科研院所、医疗机构、检验检测平台、产业资本等主体，推动产业链、创新链、资金链、人才链深度融合，通过金融赋能，建设西部领先、具有全国影响力的偶联药物产业集群，打造“热带雨林式”产业生态。\n\n　　中新网记者从会上了解到，作为重庆医药产业布局体系里的核心园区，位于重庆市巴南区的重庆国际生物城近年持续构建创新生态，形成了涵盖基础研究、中试小试、成果转化的全链条创新能力。\n\n　　目前，重庆国际生物城已形成年产胰岛素3000余万支、疫苗4000余万支、抗体药物6.4万余升的产能储备，园区在研新药53个，进入临床21个、III期临床6个，注册申报阶段5个；包括3款国家1类新药在内的4款新药获批上市，实现重庆生物医药产业发展的关键性突破。\n\n图为生命科学产业人才发展大会现场。巴南区融媒体中心 供图\n\n　　产业成果的背后，离不开优质的营商环境与产业生态的持续培育。近年来，巴南区不断夯实“上下楼就是上下游、产业园就是产业链”的产业发展环境，打造集专业人才、专业标准、专业技术于一体的“专业陪跑”服务体系，推动国内“头部”生物医药企业聚集发展。\n\n　　下一步，巴南区将以大会为契机，吸引更多生命科学领域关键人才扎根重庆，推动源头创新成果落地生根，助力重庆打造国内生命科学产业新高地。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c56147574d2","title":"青春科创赴零碳之约 全国大学生零碳科技创新大赛宁德收官","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735870.shtml","summary":"中新网宁德11月21日电 (记者 叶茂)21日下午，“时代杯”全国大学生零碳科技创新大赛总决赛在福建省宁德市举行，经校赛、区域赛和半决赛遴选，最终10支高校团队晋级总决赛，同台展示零碳创新方案。","summary_short":"中新网宁德11月21日电 (记者 叶茂)21日下午，“时代杯”全国大学生零碳科技创新大赛总决赛在福建省宁德市举行…","digest":"21日下午，“时代杯”全国大学生零碳科技创新大赛总决赛在福建省宁德市举行，经校赛…","points":["中新网宁德11月21日电 (记者 叶茂)21日下午…","本次大赛由中国环境科学学会、中共宁德市委人才工作领导小组办公室…","赛事共吸引400余所高校、近9000名学生报名，覆盖环境、能源、化工、材料…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:19:11+08:00","size":1,"keywords":[],"body":"中新网宁德11月21日电 (记者 叶茂)21日下午，“时代杯”全国大学生零碳科技创新大赛总决赛在福建省宁德市举行，经校赛、区域赛和半决赛遴选，最终10支高校团队晋级总决赛，同台展示零碳创新方案。\n\n“时代杯”全国大学生零碳科技创新大赛总决赛现场。中新网记者 叶茂 摄\n\n　　本次大赛由中国环境科学学会、中共宁德市委人才工作领导小组办公室、宁德时代新能源科技股份有限公司共同主办。赛事共吸引400余所高校、近9000名学生报名，覆盖环境、能源、化工、材料、经管等500多个专业方向。\n\n　　零碳转型既是生态环保的硬性要求，更是新一轮产业竞争的战略支点，发展零碳，根本靠科技创新、核心靠人才。宁德市副市长许锋表示，希望参赛学生把宁德当作“创新现场”，让科创成果、路演数据经得起产线工况、真实场景的检验；希望企业敞开需求、揭榜出题，让优质项目找到落地载体，让青年创新拥有清晰的成长路径；希望主办承办单位建立常态化成果对接和跟踪服务机制，打通项目孵化、成果转化、人才落地通道。\n\n　　对宁德而言，零碳不是远景蓝图，而是正在落地的生动实践。当前，宁德正全力推动零碳人才引育、技术创新、产业落地一体推进。福鼎工业园区入选首批国家级零碳园区，《零碳宁德行动方案》系统布局九大应用场景。\n\n　　同时，宁德深入实施新时代“三都澳人才”强市战略，依托宁德时代等龙头企业，形成强大人才虹吸效应，“中国锂电行业博士一半在宁德”已成为现实图景；2026年宁德跻身全球百强创新集群第75位，连续三年入选“中国最具人才吸引力百强城市”，为零碳创新、成果转化厚植了沃土。\n\n参赛选手路演现场。中新网记者 叶茂 摄\n\n　　中国环境科学学会副秘书长陈永梅表示，学会举办大赛，旨在以赛促学、以赛促创、以创促用，引导青年学子把科研所长与产业所需贯通起来，希望青年学子厚植家国情怀，立足真问题、锤炼真本领，恪守科学精神，既有敢想敢试的锐气，也有坐得住冷板凳的定力，加强交流互鉴，让今天的对手成为明天的伙伴。\n\n　　总决赛现场，10支团队依次登场，通过项目展示、现场答辩等形式呈现创新成果，与专家评委深入交流。从不同学科的交叉探索，到技术方案的反复打磨，大赛不仅为青年学子提供了展示创新能力的舞台，也创造了跨专业交流、学习与实践的机会。\n\n　　路演结束后，现场通过评委投票评选出最佳减碳效益奖、最佳跨学科创新奖、最佳应用创新奖三个单项奖，并颁发二等奖、一等奖及特等奖。\n\n颁奖仪式。中新网记者 　叶茂 摄\n\n　　据悉，“时代杯”全国大学生零碳科技创新大赛是宁德时代青柠计划的重要组成部分。今年1月，宁德时代正式发布高校零碳科技人才培养公益项目“青柠计划”，以“一套课程及教材、一场大赛、一百个社群”为核心，构建覆盖知识学习、竞赛实践与社群交流的零碳科技人才培养体系。\n\n　　其中，零碳科技课程结合前沿理论与企业真实案例，帮助学子建立系统知识框架；全国大学生零碳科技创新大赛为青年学子提供实践与交流平台；由学生自发组织、自主管理的青柠俱乐部，则推动零碳知识传播与高校学生之间的持续交流。目前，青柠俱乐部已覆盖超100所高校。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc829cfa98a","title":"“医药保学面对面”首站在穗举办 推动创新药落地","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735862.shtml","summary":"中新网广州11月21日电 (记者 蔡敏婕)2026年医保药品目录新增品种“医药保学面对面”活动(第一站)21日在广州举行。","summary_short":"中新网广州11月21日电 (记者 蔡敏婕)2026年医保药品目录新增品种“医药保学面对面”活动(第一站)21日在广州举行…","digest":"2026年医保药品目录新增品种“医药保学面对面”活动(第一站)21日在广州举行","points":["中新网广州11月21日电 (记者 蔡敏婕)2026年医保药品目录新增品种“医药保学面对面”活…","这场活动释放的信号更明确：国家医保局正在把创新药准入的发力点，从“进目录”延伸至“进医院…","国家医保局医药服务管理司司长黄心宇介绍，2026年医保药品目录新增品种及相关政策"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T20:19:03+08:00","size":1,"keywords":[],"body":"中新网广州11月21日电 (记者 蔡敏婕)2026年医保药品目录新增品种“医药保学面对面”活动(第一站)21日在广州举行。这场活动释放的信号更明确：国家医保局正在把创新药准入的发力点，从“进目录”延伸至“进医院、进处方、进课堂”，让新药更快惠及患者的现实需求。\n\n　　对创新药来说，进目录只是拿到了“准生证”，临床知不知道、会不会用、患者找不找得到，才是真正的可及性。\n\n2026年医保药品目录新增品种“医药保学面对面”活动(第一站 广州—走进中山大学)在中山大学举行。广东省医保局 供图\n\n　　国家医保局医药服务管理司司长黄心宇介绍，2026年医保药品目录新增品种及相关政策。2026版医保目录共3331种药品，新增107种，调出34种；新增药品中103种为5年内新上市、51种为1类新药，均创新高；新增药品中化学药60种、生物制品36种、中成药11种；新增药品中治疗领域为肿瘤的29种、慢性病的21种、罕见病的18种。\n\n　　调出药品主要是未续约谈判药，以及因剂型替代、主成分仍在目录、临床可替代等调出的常规药。\n\n　　国家医保局局长章轲表示，中国医保将从六个方面持续发力：为医药创新提供稳定可靠的资金支持、构建科学合理的价格体系、提供客观公正的评价标准、完善支付政策、提供真实准确的数据、整合更多支付渠道。坚持“新药不集采、集采非新药”，全周期、全渠道、全领域支持创新。\n\n　　广东省医保局党组成员、副局长刘碧茹表示，截至目前，广东参保人数达1.13亿，2026年纳入广东医保目录药品达6493个；2025年按病种付费年度清算后全省结余留用总金额约35.06亿元。\n\n　　刘碧茹表示，广东省医保局将在四方面持续推动新增药品落地：紧盯终端落地、深化“医药保学”互动、统筹待遇保障和基金可持续发展、加强政策宣传解读。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdc9916939a","title":"把太阳光“分”着用 中国科研团队给植物“定制阳光”","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-21/news1075674.shtml","summary":"没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长。","summary_short":"没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长。","digest":"没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长","points":["没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长","这是记者近日在中国科学技术大学先进技术研究院农业光学实验室看到的一幕","这里的科研团队围绕“光与作物” 已经研究了十多年，做的第一件事是把阳光 “分” 开用"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T20:13:33+08:00","size":1,"keywords":[],"body":"没有阳光，也没有土壤，生菜、辣椒在人工光的照射下，一层层往外长。这是记者近日在中国科学技术大学先进技术研究院农业光学实验室看到的一幕。\n\n这里的科研团队围绕“光与作物” 已经研究了十多年，做的第一件事是把阳光 “分” 开用。一张聚合物光学膜，能把太阳光分成两部分。\n\n“植物生长只需要不到百分之十的太阳光，其余大部分都被浪费了。”据该院研究员张放心介绍，分出来的这部分光留给植物，植物不吸收的光则反射给光伏板发电。\n\n第二件事是把光“配”出来。植物工厂为不同作物定制“光配方”，除光强、光谱，还调控光周期，让能耗更低、作物长得更好。\n\n这座植物工厂还同时充当“育种加速器”。“南方一年两季的水稻，在人工光植物工厂里可以做到四季、五季甚至六季，当然这与品种有关。”张放心说。\n\n目前，集装箱式的植物工厂已经走进戈壁、海岛和雪域高原。“最大的好处是不依赖外部环境。”他坦言，在条件艰苦的地方，用人工光模拟光照环境，照样能种出菜来。\n\n谈及下一步，张放心表示，团队要把光学膜技术继续做深，让“光配方”走向更普遍的应用场景，同时持续突破技术、降低成本，让植物工厂从特殊场景走进更多社区和家庭。\n\n记者 张俊 安徽合肥报道","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/52758FCCFF724EC1B03FC163B0A91ADA.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c46a27c197b","title":"“传承薪火 同心筑梦”第四届重庆统战文化月开幕式举行","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075672.shtml","summary":"11月20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。","summary_short":"11月20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。","digest":"11月20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行","points":["活动集中发布重庆“一都一城两高地”建设成果，通过文化作品展演、精品线路推介等形式…","开幕式将成果发布与文化作品展演、线路推介结合，以曲艺、故事讲述等形式呈现统战历史","据介绍，重庆统战文化月自2023年起已连续成功举办三届，成为全市统一战线凝聚政治共识…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T19:57:07+08:00","size":1,"keywords":[],"body":"11月20日，“传承薪火 同心筑梦”第四届重庆统战文化月开幕式在渝举行。活动集中发布重庆“一都一城两高地”建设成果，通过文化作品展演、精品线路推介等形式，系统展现重庆统战文化建设成效。\n\n开幕式将成果发布与文化作品展演、线路推介结合，以曲艺、故事讲述等形式呈现统战历史。现场还推介了“重走歌乐·初心之旅”“棠城同心·五社润心之旅”等一批统战文化精品线路。\n\n据介绍，重庆统战文化月自2023年起已连续成功举办三届，成为全市统一战线凝聚政治共识、彰显统战魅力、促进文化传承的标志性品牌。(记者 贾楠）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/7929FC15023142BC93C70342B5557EDB.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf656bc2250","title":"哈尔滨极地公园今冬首场“淘学企鹅冰雪巡游”上线","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075671.shtml","summary":"11月21日，哈尔滨极地公园开启今冬首场“淘学企鹅冰雪巡游”。","summary_short":"11月21日，哈尔滨极地公园开启今冬首场“淘学企鹅冰雪巡游”。","digest":"11月21日，哈尔滨极地公园开启今冬首场“淘学企鹅冰雪巡游”","points":["伴随着欢快的音乐，50只南极企鹅集体亮相极地广场，可爱十足的巡游场面…","本次“淘学企鹅冰雪巡游”自11月21日起，每天13…","(制作 赵宇航 部分视频来源 哈尔滨极地公园）"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T19:56:52+08:00","size":1,"keywords":[],"body":"11月21日，哈尔滨极地公园开启今冬首场“淘学企鹅冰雪巡游”。伴随着欢快的音乐，50只南极企鹅集体亮相极地广场，可爱十足的巡游场面，为来自五湖四海的游客带来与众不同的极地体验。\n\n据了解，本次“淘学企鹅冰雪巡游”自11月21日起，每天13：30在哈尔滨极地公园极地广场免费向公众开放，后续还将根据客流的变化，逐步增加巡游场次。(制作 赵宇航 部分视频来源 哈尔滨极地公园）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/3515CA344B5B4C419A944CBD08360BAA.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf50d77aa0d","title":"云南非遗保护与发展试点成果展在大理启幕","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735849.shtml","summary":"中新网大理11月21日电 (黄兴鸿)21日，“非物质文化遗产系统性保护与可持续发展云南试点成果展”在大理白族自治州大理市喜洲镇启幕，60余项国家级、省级、州市级非物质文化遗产代表性项目进行现场展示…","summary_short":"中新网大理11月21日电 (黄兴鸿)21日，“非物质文化遗产系统性保护与可持续发展云南试点成果展”在大理白族自治州大理市…","digest":"云南非遗保护与发展试点成果展在大理启幕","points":["中新网大理11月21日电 (黄兴鸿)21日，“非物质文化遗产系统性保护与可持续发展云南试点成…","截至目前，国家级、省级非遗代表性项目分别有127项、686项","2024年12月，文化和旅游部确定云南省承担非物质文化遗产系统性保护与可持续发展试点任务…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T19:55:49+08:00","size":1,"keywords":[],"body":"中新网大理11月21日电 (黄兴鸿)21日，“非物质文化遗产系统性保护与可持续发展云南试点成果展”在大理白族自治州大理市喜洲镇启幕，60余项国家级、省级、州市级非物质文化遗产代表性项目进行现场展示、展演、展销，旨在把试点成果从“报告文本”变成“可感知的实践经验”，推动非遗融入现代生活，服务美好生活。\n\n　　地处中国西南边陲的云南省，各民族在漫长的历史长河中创造了多姿多彩、特色鲜明的非物质文化遗产。截至目前，国家级、省级非遗代表性项目分别有127项、686项。2024年12月，文化和旅游部确定云南省承担非物质文化遗产系统性保护与可持续发展试点任务，由云南省非物质文化遗产保护中心具体承担课题研究工作。\n\n11月21日，“非物质文化遗产系统性保护与可持续发展云南试点成果展”启幕。　黄兴鸿 摄\n\n　　课题组选取大理白族自治州大理市喜洲镇周城村、鹤庆县新华银匠村，楚雄彝族自治州南华县“七彩彝绣”非遗工坊，普洱市澜沧拉祜族自治县惠民镇景迈山古茶林，昆明市安宁市县街街道石庄村，怒江傈僳族自治州福贡县匹河怒族乡老姆登村，西双版纳傣族自治州景洪市勐罕镇曼远村，红河哈尼族彝族自治州元阳县阿者科村共8个典型点位开展案例研究，聚焦包容性经济发展、环境可持续发展等7大领域，形成1个总报告与8个案例分报告成果。\n\n　　周城扎染年产值超1.6亿元、带动4000余人就业，新华银匠村的“固定工坊+居家灵活作业”模式为困难民众和残障从业者留出稳定生计空间，景迈山古茶林的“林茶互养”与元阳梯田的“四素同构”把非遗根系扎进生态安全与粮食安全的土壤……9个报告拼出“非物质文化遗产系统性保护与可持续发展”的云南答案，于2026年3月通过文化和旅游部非物质文化遗产司验收。\n\n11月21日，活动现场傣族舞蹈《神鸟舞》展演。　黄兴鸿 摄\n\n　　本次成果展，集成果展示、非遗大集、歌舞乐展演、公开课直播、学术交流于一体，荟萃云南试点60余项国家级、省级、州市级非遗代表性项目，搭建起专家、基层从业者、代表性传承人与社区民众多元互动平台，旨在将试点经验转化为民众可看、可感、可体验的文化盛宴，凝聚更多力量参与到非物质文化遗产的保护、传承中。\n\n　　当天的非遗大集、歌舞乐展演等活动，吸引众多游客和当地民众体验传统技艺，共赏民族文化的独特魅力。\n\n11月21日，活动现场展出琳琅满目的瓦猫文创产品。　黄兴鸿 摄\n\n　　云南省将坚持系统性保护理念，推动非遗与生态保护、乡村建设、基层治理深度融合，提炼可复制、可推广的“云南经验”，让非遗更好地彰显“七彩云南”文化魅力，服务品牌建设，为云南文旅高质量发展注入持久动能。\n\n　　本次成果展共3天时间，由云南省文化和旅游厅指导，云南省非物质文化遗产保护中心、大理州文化和旅游局主办。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c56dd875f3b","title":"黄河进入2026—2027年度凌汛期","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735702.shtml","summary":"中新社郑州11月21日电 中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时，黄河内蒙古包头至头道拐河段出现流凌，流凌长度累计34千米。","summary_short":"中新社郑州11月21日电 中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…","digest":"中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…","points":["中新社郑州11月21日电 中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…","首凌日期与常年(1971年至2025年均值)持平","凌汛是指冬春季节河流因冰凌阻塞河道导致水位上涨的水文现象"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:41:45+08:00","size":2,"keywords":[],"body":"中新社郑州11月21日电 中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时，黄河内蒙古包头至头道拐河段出现流凌，流凌长度累计34千米。首凌日期与常年(1971年至2025年均值)持平。黄河即日起进入2026—2027年度凌汛期。\n\n　　凌汛是指冬春季节河流因冰凌阻塞河道导致水位上涨的水文现象。河流从低纬度流向高纬度，且河道形态呈上宽下窄、弯曲回环的地方，容易出现凌汛。\n\n11月21日，黄河内蒙古段五犋牛浮桥处流凌。张瑞锋 摄\n\n　　11月21日黄河内蒙古段出现首凌后，黄委即刻启动防凌工作机制。黄委要求，各级各单位压紧压实防凌责任，将防范极端风险贯穿监测预警、会商研判、调度指挥、应急值守、巡查防守、抢险处置、转移安置等各环节；强化监测预报预警，科学精细调度水库，塑造适宜的封河流量过程；全面开展隐患排查，梳理风险点清单，明确处置措施和责任单位；严格浮桥与施工栈桥管理，确保河道行凌畅通；科学调度骨干水工程，全面做好各项防凌工作，全力确保本年度黄河防凌安全。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"黄河进入2026—2027年度凌汛期","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735702.shtml","source_display":"中國新聞網","published_at":"2026-11-21T13:41:45+08:00","category":"民生","digest":"中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…"},{"title":"黄河内蒙古段进入2026至2027年度凌汛期","url":"https://www.jiemian.com/article/15357658.html","source_display":"界面新聞","published_at":"2026-11-21T10:57:59+08:00","category":"","digest":"内蒙古自治区防汛抗旱指挥部办公室消息，受近期冷空气过程影响，11月21日8时…"}],"cross":{"total":2,"angles":[{"point":"中国水利部黄河水利委员会(以下简称黄委)21日消息，当日8时…","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/sh/2026/11-21/10735702.shtml"},{"point":"内蒙古自治区防汛抗旱指挥部办公室消息，受近期冷空气过程影响，11月21日8时…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15357658.html"}]}},{"id":"c8785df1191","title":"研讨现代化水网建设 第三届国家水网及南水北调高质量发展论坛举行","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735834.shtml","summary":"中新网北京11月21日电 11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质量发展论坛在京举行。","summary_short":"中新网北京11月21日电 11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质量发展论坛在京举行。","digest":"11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质量发展论坛在京举行","points":["中新网北京11月21日电 11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质…","来自国家部委、地方政府、企事业单位、金融机构、科研院所、高等院校的院士…","南水北调工程是国家水网的主骨架和大动脉，事关战略全局、事关长远发展、事关人民福祉"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T19:38:10+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 11月21日，由中国南水北调集团主办的第三届国家水网及南水北调高质量发展论坛在京举行。来自国家部委、地方政府、企事业单位、金融机构、科研院所、高等院校的院士、专家学者及有关方面代表，围绕“科技赋能·创新驱动 建设现代化水网”主题开展交流研讨。\n\n 11月21日，第三届国家水网及南水北调高质量发展论坛在京举行。中国南水北调集团供图\n\n　　水利部总规划师于琪洋在致辞中表示，加快构建国家水网，建设现代化高质量水利基础设施网络，统筹解决水资源、水生态、水环境、水灾害问题，是党中央作出的重大战略部署。南水北调工程是国家水网的主骨架和大动脉，事关战略全局、事关长远发展、事关人民福祉。中国南水北调集团作为南水北调工程的投资建设运营管理主体，要立足“三个企业”战略定位，统筹发展和安全，大力推进智能运维、智能建造、智能治理，为保障我国水安全作出新的更大贡献。\n\n　　“南水北调东中线一期工程通水以来，累计向北方调水超920亿立方米，为近2亿人提供稳定优质水源，有力支撑北方地区超19万亿元GDP增长。”中国南水北调集团党组书记、董事长汪安南在作报告时说。他表示，立足“十五五”，南水北调集团确立了巩固提升世界一流调水工程、投资建设运营一批国家水网重大工程、加快建设世界一流水网企业“三个一”的奋斗目标。集团将统筹推进维护南水北调“三个安全”、充分发挥“四条生命线”作用、加快推进后续工程高质量发展、全面参与现代化水网建设、积极有序发展相关涉水业务五大任务，不断增强企业核心功能，助力加快建成“系统完备、安全可靠，集约高效、绿色智能，循环通畅、调控有序”的现代化水网。\n\n　　在主论坛主旨报告环节，中国工程院院士张建云、康绍忠、张强，中国科学院院士夏军，国务院发展研究中心研究员高世楫围绕深入贯彻党中央关于“六张网”规划建设战略部署、推进国家“十五五”规划落实，加快建设现代化水网、推进水权水价水市场等市场化改革，提升水网运营可持续性、推进科技创新与产业创新深度融合，推动国家水网及南水北调高质量发展等开展交流。\n\n　　三场平行论坛上，20多位专家学者，聚焦“三个智能”推动南水北调高质量发展、深化改革提升水网运营可持续性、数智融合打造现代水网新质生产力等方面交流探讨，共同分享科技创新成果。论坛还发布了南水北调“天河”大模型系统V2。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cae38489a36","title":"（走进中国乡村）安徽青阳农民把“生活日记”画向世界","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735836.shtml","summary":"中新社安徽池州11月21日电 题：安徽青阳农民把“生活日记”画向世界  　　中新社记者 张强  　　皖南山区，地处九华山后山的安徽省池州市青阳县朱备镇朱笔村…","summary_short":"中新社安徽池州11月21日电 题：安徽青阳农民把“生活日记”画向世界  　　中新社记者 张强  　　皖南山区…","digest":"题：安徽青阳农民把“生活日记”画向世界  　　中新社记者 张强  　　皖南山区…","points":["中新社安徽池州11月21日电 题：安徽青阳农民把“生活日记”画向世界","皖南山区，地处九华山后山的安徽省池州市青阳县朱备镇朱笔村，一栋农家小院的客厅里挂满农民画…","”张平安是安徽省级非遗青阳农民画的省级代表性传承人，他给自己立了条规矩：作品要让人看得懂"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T19:27:52+08:00","size":1,"keywords":[],"body":"中新社安徽池州11月21日电 题：安徽青阳农民把“生活日记”画向世界\n\n　　中新社记者 张强\n\n　　皖南山区，地处九华山后山的安徽省池州市青阳县朱备镇朱笔村，一栋农家小院的客厅里挂满农民画：八头水牛在塘中戏水，农妇在苎麻地里弯腰劳作，板龙在村巷间游走……耄耋之年的张平安伏在案前，握笔为画作上色。\n\n　　“田就是田，池塘就是池塘，山就是山。”张平安是安徽省级非遗青阳农民画的省级代表性传承人，他给自己立了条规矩：作品要让人看得懂。“青阳农民画是农民的‘生活日记’，画的是身边的生产场景和乡风民俗，每一笔都藏着对生活的热爱。”\n\n11月20日，安徽青阳农民画省级非遗代表性传承人张平安在家中创作。中新社记者 张强 摄\n\n　　青阳农民画距今已有600多年历史。有别于陕西西安鄠邑区、上海金山区、安徽萧县等地的农民画，青阳农民画在吸收青阳县及周边地区古代砖雕、石雕、木雕、剪纸、墙饰画等民间艺术的基础上逐渐发展而来，艺术风格体现为构图饱满、色彩艳丽、造型夸张。\n\n　　1975年，青阳县文化部门开办农民画培训班。在家务农的张平安报名参加，画笔从此成为他和同学们的另一件“农具”。目前，青阳县拥有青阳农民画省级非遗代表性传承人4人、市级非遗代表性传承人3人，农民画协会有近100名会员。\n\n11月20日，在安徽省池州市青阳县朱备镇东桥村九子岩景区，展示着青阳农民画省级非遗代表性传承人张平安的作品。中新社记者 张强 摄\n\n　　东桥村党总支书记王金安说，当地的基层治理、廉政宣传、板龙舞、七布泉瀑布都是青阳农民画的创作题材，画作在文化广场和景区常态化展示。“今年以来，我们村接待游客近40万人次。农民画嵌入文旅业态，二者相互赋能。”\n\n　　张平安的儿子张理庆把自家闲置老屋改造成“青画民宿”，以青阳农民画为主题。“九华山高铁站开通了，后山的旅游环境也好了，我们看到了新的商机。”张理庆说，民宿在节假日时常满房，平日入住率超五成。\n\n11月20日，青画民宿负责人张理庆在给民宿里的花浇水。花下面的墙面上画有农民画。中新社记者 张强 摄\n\n　　青阳县杨田镇则把农民画“画”进了产业链。正在上海参加第七届长三角国际文化产业博览会的青阳农民画池州市级非遗代表性传承人徐金锋21日接受记者电话采访时说，“博览会现场非常火爆，青阳农民画文创产品日销售额超1万元人民币，已与杭州、上海及法国、日本等地的客商达成合作。”他们带去参会产品的标签、包装均按农民画技艺绘制专题图案且全部申请了版权保护，“实现了非遗赋能地方特产”。\n\n　　黄精丸、木榨油、野生葛粉、富硒米……据介绍，徐金锋公司的上百种农特产品陆续有了专属的农民画“保护外衣”。他还开发出扇子、茶杯垫、灯光画等百余款融入农民画元素的文创产品，其中的农民画拓印文创产品颇受研学学子欢迎。\n\n　　徐金锋说，通过电商、直播等渠道，青阳农民画原画及手工文创已远销法国、德国、韩国等国家和地区。许多来九华山旅游的外国友人，也专程上门交流合作。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9c2592d8ee","title":"多项大科学装置模型在武汉展出","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735835.shtml","summary":"中新网武汉11月21日电 (陈长丽 高笛)“中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华”21日在中国科学院武汉植物园启动。","summary_short":"中新网武汉11月21日电 (陈长丽 高笛)“中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华”21日在中国科…","digest":"“中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华”21日在中国科学院武…","points":["中新网武汉11月21日电 (陈长丽 高笛)“中国科学院第九届科学节·武汉专场暨2026年湖北…","活动集结中国科学院院属科研机构，湖北省科普教育基地、高校等40余家单位力量…","活动由中国科学院学部工作局、湖北省科学技术协会主办，为期两天…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T19:26:42+08:00","size":1,"keywords":[],"body":"中新网武汉11月21日电 (陈长丽 高笛)“中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华”21日在中国科学院武汉植物园启动。活动集结中国科学院院属科研机构，湖北省科普教育基地、高校等40余家单位力量，通过100多项科技展品、节目及实践体验，为公众呈现一场科普盛宴。\n\n中国科学院第九届科学节·武汉专场暨2026年湖北省科普嘉年华活动举行。中国科学院武汉植物园供图\n\n　　活动由中国科学院学部工作局、湖北省科学技术协会主办，为期两天，设置“嗨剧场”“创新展”“创工坊”“零距离”“科创荟”“科学之美”六个板块。\n\n　　“创新展”板块集中展出中国科学院12件重大科技基础设施与科研成果的科学装置模型，其中江门中微子实验设施、强流重离子加速器装置、超导量子计算原型机“祖冲之三号”、钍基熔盐堆核能系统、“怀柔一号”(极目)卫星等8件模型为首次在武汉展出。\n\n观众参观超导量子计算原型机。中国科学院武汉植物园供图\n\n　　借助实景模型、VR体验等展示手段，大科学装置变成可走近、可触摸、可操作的沉浸式展项。活动现场，江门中微子实验设施模型前排起长队，“奋斗者”号、“拉索”模型旁观众络绎不绝，重大科技基础设施与科研成果从科研一线走到公众身边，让大国重器与前沿科技变得可感可及。\n\n　　“创工坊”板块，细胞观察实验、鱼鳞拓印、叶脉书签、古钱币范铸、宋瓷冰箱贴手作等20余项趣味科学实践集中开展；“嗨剧场”板块，科普舞台剧、科学实验秀、魔术、舞蹈等10余场节目轮番登场。\n\n观众参与科学实验互动。中国科学院武汉植物园供图\n\n　　中国科学院科学节是中国科学院自2018年起打造的面向社会公众的大型科学嘉年华，今年以“主场＋多地专场”方式展开。此次活动是科学节设置专场以来，第四次落地中国科学院武汉植物园。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c721445712b","title":"一湖碧水映彩林 云南普达措初冬美如画","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-21/news1075670.shtml","summary":"近日，初冬的云南省迪庆藏族自治州普达措国家公园层林尽染，流云舒卷，高原湖泊、山林与草甸交相辉映，吸引众多国内外游客前来观光。","summary_short":"近日，初冬的云南省迪庆藏族自治州普达措国家公园层林尽染，流云舒卷，高原湖泊、山林与草甸交相辉映…","digest":"近日，初冬的云南省迪庆藏族自治州普达措国家公园层林尽染，流云舒卷，高原湖泊…","points":["近日，初冬的云南省迪庆藏族自治州普达措国家公园层林尽染，流云舒卷，高原湖泊…","属都湖平静如镜，山间流云与湖畔斑斓的林木倒映水中，金黄的草甸沿湖岸铺展","游客漫步林间栈道，欣赏高原初冬的湖光山色"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T19:22:20+08:00","size":1,"keywords":[],"body":"近日，初冬的云南省迪庆藏族自治州普达措国家公园层林尽染，流云舒卷，高原湖泊、山林与草甸交相辉映，吸引众多国内外游客前来观光。\n\n属都湖平静如镜，山间流云与湖畔斑斓的林木倒映水中，金黄的草甸沿湖岸铺展。游客漫步林间栈道，欣赏高原初冬的湖光山色。\n\n普达措国家公园地处滇西北“三江并流”世界自然遗产的中心地带。2026年赏秋旺季，景区日均接待游客约3500人次。\n\n近年来，景区坚持生态保护与旅游发展相结合，通过完善环保游览设施、推广清洁能源等措施，减少旅游活动对自然环境的影响，推动生态保护与旅游发展协调并进。(王临梓）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/819BF4FD4211412FBAF9BF083CE28844.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cd4272b694b","title":"土耳其媒体人：真实的新疆文化多元 民生向好","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-21/news1075669.shtml","summary":"11月20日，为期5天的“土耳其主流媒体疆行记”活动在新疆和田市圆满结束，10余位媒体人通过走访、体验等，在乌鲁木齐、克拉玛依以及和田切身感受了新疆经济发展活力、多元文化底蕴…","summary_short":"11月20日，为期5天的“土耳其主流媒体疆行记”活动在新疆和田市圆满结束，10余位媒体人通过走访、体验等，在乌鲁木齐…","digest":"11月20日，为期5天的“土耳其主流媒体疆行记”活动在新疆和田市圆满结束…","points":["11月20日，为期5天的“土耳其主流媒体疆行记”活动在新疆和田市圆满结束…","在新疆国际大巴扎，街区商铺林立，民族手工艺品、特色美食琳琅满目，往来游客络绎不绝","在新疆博物馆，土耳其媒体人参观出土文物、古代织物等展品…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T19:19:08+08:00","size":1,"keywords":[],"body":"11月20日，为期5天的“土耳其主流媒体疆行记”活动在新疆和田市圆满结束，10余位媒体人通过走访、体验等，在乌鲁木齐、克拉玛依以及和田切身感受了新疆经济发展活力、多元文化底蕴、民族团结风貌与社会稳定成果。\n\n在新疆国际大巴扎，街区商铺林立，民族手工艺品、特色美食琳琅满目，往来游客络绎不绝。在新疆博物馆，土耳其媒体人参观出土文物、古代织物等展品，了解古代丝绸之路交往历史和新疆历史脉络。在克拉玛依市，土耳其媒体人走进中国石油大学(北京)克拉玛依校区走访了校园实训场地，了解学校专业设置、科研方向等。\n\n在新疆和田地区，土耳其媒体人先后走进和田县百和镇稻香村、和田团城、和田夜市等地，浓厚文化氛围和民族特色，让土耳其国民频道主持人兼制片人基万奇·奥兹达尔不断拍摄记录。\n\n几天时间，土耳其媒体人了解了真实的新疆，不少土耳其媒体人表示，实地走访感受到新疆的安定与活力，希望把此行的真实见闻，传递给土耳其受众。\n\n(左丹丹 新疆综合报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/60CB61EA29824E9EA751AC962C7AE108.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ce7b6cf0a02","title":"2026年以来昆明市检察机关办理涉外因素案件210件","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735823.shtml","summary":"中新网昆明11月21日电 (陈静 贝文)昆明市人民检察院21日消息，2026年以来，全市检察机关共办理具有涉外因素的案件210件，实现刑事、民事、行政、公益诉讼四大检察业务全覆盖。","summary_short":"中新网昆明11月21日电 (陈静 贝文)昆明市人民检察院21日消息，2026年以来…","digest":"昆明市人民检察院21日消息，2026年以来…","points":["中新网昆明11月21日电 (陈静 贝文)昆明市人民检察院21日消息，2026年以来…","2026年以来，昆明市检察机关严格落实最高人民检察院、云南省人民检察院涉外检察工作部署…","立足面向南亚东南亚辐射中心建设，制定《昆明市检察机关关于涉外检察工作的实施方案》…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T18:45:58+08:00","size":1,"keywords":[],"body":"中新网昆明11月21日电 (陈静 贝文)昆明市人民检察院21日消息，2026年以来，全市检察机关共办理具有涉外因素的案件210件，实现刑事、民事、行政、公益诉讼四大检察业务全覆盖。\n\n　　2026年以来，昆明市检察机关严格落实最高人民检察院、云南省人民检察院涉外检察工作部署，主动融入云南“1+2+8+N”涉外检察工作格局，涉外检察工作取得一定成效和进展。\n\n　　立足面向南亚东南亚辐射中心建设，制定《昆明市检察机关关于涉外检察工作的实施方案》，在全市检察机关组建一支覆盖四大检察的40人办案团队，聚焦跨境犯罪打击、涉外知识产权保护、边境矛盾纠纷化解等重点领域，培育专业化、复合型涉外检察人才。\n\n　　通过系统分析近5年涉外、涉外国人刑事犯罪和刑事执行案件数据，提出六项对策建议，为提升办案质效提供数据参考。同时，加大跨境毒品犯罪打击力度，办理的跨境跨省大宗运输毒品抗诉案件成功入选最高检全国典型案例。通过办理跨境系列电信网络诈骗案，形成侦查取证经验做法，为全省公安机关开展传导式业务培训。\r\n\n　　立足口岸治理，招募磨憨出入境边防检查站公益诉讼志愿者20余名，常态化排查口岸生态污染、设施破损、监管缺位等公益诉讼线索，构建“检察监督+边防巡查+群众参与”的多元共治模式。\n\n　　联合牡丹江市检察院、防城港市检察院、怒江州检察院、临沧市检察院开展跨境流域交流培训，采用实战辩论、经验分享、专家授课相结合模式，互相学习借鉴。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c65a83a5660","title":"宁夏银川非遗创新设计大赛收官 36件作品让老手艺走进日常生活","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735821.shtml","summary":"中新网银川11月21日电 (记者 李佩珊)11月21日，宁夏银川市阅彩城的一处舞台前围满了市民。","summary_short":"中新网银川11月21日电 (记者 李佩珊)11月21日，宁夏银川市阅彩城的一处舞台前围满了市民。","digest":"11月21日，宁夏银川市阅彩城的一处舞台前围满了市民","points":["中新网银川11月21日电 (记者 李佩珊)11月21日…","音乐响起，舞者依次登台，手中的“道具”是一批刚获奖的非遗文创作品——贺兰砚、剪纸、麻编…","这是“守艺银川·非遗新传”2026年第四届银川市非遗创新设计大赛成果展的现场…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T18:45:22+08:00","size":1,"keywords":[],"body":"中新网银川11月21日电 (记者 李佩珊)11月21日，宁夏银川市阅彩城的一处舞台前围满了市民。音乐响起，舞者依次登台，手中的“道具”是一批刚获奖的非遗文创作品——贺兰砚、剪纸、麻编、羊毛毡……传统技艺与现代设计的碰撞，引来阵阵掌声。舞台之外，非遗文创集市同步开市，一个个摊位前，市民驻足端详、拍照。\n\n舞蹈演员在舞台上展示获奖作品。　赵惠 摄\n\n　　这是“守艺银川·非遗新传”2026年第四届银川市非遗创新设计大赛成果展的现场，由银川市委宣传部、银川市文化旅游广电局、共青团银川市委员会联合主办。作为大赛收官活动，现场集中展示6大赛道36件获奖作品并进行颁奖，《守艺银川》品牌同步发布，品牌产品库启动，本届全部获奖作品入库，优质成果纳入核心产品体系，并优先推荐落地转化。\n\n市民选购非遗文创产品。　中新网记者 李佩珊 摄\n\n　　36件作品，来自一场持续两个多月的比拼。本届大赛构建“1+5”赛道架构，除“守艺银川”创新赛道外，还有“畅游银川”“妙选银川”“乐购银川”“微醺银川”“悦动银川”5大产业赛道，引导非遗设计对接景区、商圈、赛事等真实消费场景。自9月启动以来，共收到报名作品957件，经复赛、决赛层层评审，最终36件作品脱颖而出。\n\n市民选购非遗文创产品。　中新网记者 李佩珊 摄\n\n　　翻看获奖名单，一个共同点清晰可见：这些作品都不止于“好看”。《贺兰日叟》深挖贺兰山岩画文化内核，对古老岩画进行当代艺术转化；手工羊毛毡精油皂把岩画元素融入日常消费品；《茶姬》将非遗符号植入年轻消费场景。从贺兰砚、剪纸、麻编等传统技艺，到特色酒标包装、赛事周边等新品类，它们跳出单纯的美学设计，形成可对接生产、可进入流通渠道、可触达消费者的完整产品逻辑。\n\n　　“创作中，我扎根宁夏本土文化，尝试将传统非遗与现代设计相融合，希望自己的作品能让更多人感受非遗的独特魅力。”一等奖获得者王莹说。\n\n　　好创意要走出展柜，还差落地这“最后一公里”。大赛联动贺兰山岩画、西夏陵、水洞沟等20家重点文旅景区与市场主体，围绕联名产品开发、获奖作品落地转化开展合作。启动前期，主办方走进宁夏大学、北方民族大学、银川科技学院等高校开展“非遗进高校”系列活动，搭建“非遗代表性传承人+青年设计师+市场企业”三方共创平台，让“校园里共创、商圈里体验、景区里展销”的格局逐步成形。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc433fc9c79","title":"拉萨市城关区精准监督 破解小区治理难题","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735819.shtml","summary":"中新网拉萨11月21日电 (卢鑫)物业费收得明不明白、公共设施坏了谁来修、小区环境脏乱谁来管、装修拆改会不会破坏承重结构……","summary_short":"中新网拉萨11月21日电 (卢鑫)物业费收得明不明白、公共设施坏了谁来修、小区环境脏乱谁来管…","digest":"物业费收得明不明白、公共设施坏了谁来修、小区环境脏乱谁来管…","points":["中新网拉萨11月21日电 (卢鑫)物业费收得明不明白、公共设施坏了谁来修…","近日，记者从拉萨市城关区纪委监委获悉，今年以来，该纪委监委把住宅小区物业服务领域群众急难愁盼…","为更好发挥党建引领的作用，让物业行业有“主心骨”，该纪委监委督促城关区委社会工作部…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T18:44:02+08:00","size":1,"keywords":[],"body":"中新网拉萨11月21日电 (卢鑫)物业费收得明不明白、公共设施坏了谁来修、小区环境脏乱谁来管、装修拆改会不会破坏承重结构……物业服务看似鸡毛蒜皮，却是市民群众天天有感的“心头事”，也是投诉多发、反映强烈的痛点领域。\r\n\n　　近日，记者从拉萨市城关区纪委监委获悉，今年以来，该纪委监委把住宅小区物业服务领域群众急难愁盼作为群众身边不正之风和腐败问题集中整治的重要切口，推动解决了一批群众反映强烈的高频问题。\n\n　　为更好发挥党建引领的作用，让物业行业有“主心骨”，该纪委监委督促城关区委社会工作部、物业行业党委精准摸排110余家物业企业，推动通过整建制物业公司党支部转隶物业行业党委统一管理、成立联合党支部覆盖零散党员、统筹化管理行业党支部等方式，实现物业行业党员管理全覆盖、无死角。\n\n　　针对物业费收缴争议、公共设施维修滞后、邻里占用公共空间、物业服务不到位等高频问题，该纪委监委跟踪督办多方共治机制落实，推动街道、社区、业委会、物业、业主代表开展现场会商研判10余次，现场协商、就地处置物业矛盾、邻里纠纷、管理难题20余件。\n\n　　该纪委监委围绕住宅小区管理全域覆盖跟进监督，推动补齐基层治理短板，实现规范化、常态化管护。城关区473个住宅小区全面建立多元协同管理机制，社区代管小区全面退出历史舞台。\n\n　　同时，紧盯业委会组建进度，督促城关区住建局联合各街道通过“周调度、日跟进”模式推进应建尽建，截至目前，组建率达99.08%，其中依托老旧小区改造新增业委会115个。\n\n　　在该纪委监委监督推动下，城关区住建局牵头制定小区装修管理办法。“装修管理办法明确了物业巡查、劝阻、上报责任，我们发现问题不再只是口头提醒，而是有章可循、有据可报。”拉萨市城关区某物业公司项目经理说。\n\n　　截至目前，城关区累计开展房屋安全专题培训2场次、参训350余人次；线下宣传40余场，发放藏汉双语宣传海报、宣传册2700余份；联动上级部门及通信运营商全域推送房屋安全公益短信。同时，多方筹措专项经费，选取25个小区试点推进安全生产LED宣传设施安装。\n\n　　该纪委监委还督促开展物业及业委会履职培训，截至目前已完成街道巡讲2次、集中培训1次，计划年内与城关区委社会工作部开展2次集中专项培训。针对开发企业遗留问题发函3份，推动3个小区完成整改；对排查出的问题逐一发放整改通知书，跟踪督促闭环整改30余项。督促城关区住建局联合相关部门开展住宅小区专项督查20次，核查小区34个，发现问题16个，现场整改完成14个，限期整改2个，整改完成率达98%。\n\n　　据悉，在集中整治过程中，该纪委监委紧盯区属国有物业服务公司在监管、治理、作风建设等方面存在的系统性风险，严肃查处拉萨城祥物业管理有限公司员工旦某贪污小区物业、房租、水电费案件。对6名有关责任人严肃追责问责，深入分析研判该领域风险点，制发纪检监察建议，推动完善制度11项，做实以案促改促治。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbc73b10cd9","title":"全国300余位专家学者齐聚长春 共议教师教育改革","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735818.shtml","summary":"中新网长春11月21日电 (记者 郭佳)中国高等教育学会教师教育分会2026年学术年会21日在东北师范大学举行。","summary_short":"中新网长春11月21日电 (记者 郭佳)中国高等教育学会教师教育分会2026年学术年会21日在东北师范大学举行。","digest":"中国高等教育学会教师教育分会2026年学术年会21日在东北师范大学举行","points":["中新网长春11月21日电 (记者 郭佳)中国高等教育学会教师教育分会2026年学术年会21日…","来自全国各地的300余位专家学者、教师及研究生参会…","教育部教师工作司司长王磊在线致辞时表示，中国式现代化新格局、人口变化新形势…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T18:41:21+08:00","size":1,"keywords":[],"body":"中新网长春11月21日电 (记者 郭佳)中国高等教育学会教师教育分会2026年学术年会21日在东北师范大学举行。来自全国各地的300余位专家学者、教师及研究生参会，围绕新时代教师培养课程改革与高质量教师教育发展展开研讨。\n\n11月21日，中国高等教育学会教师教育分会2026年学术年会在长春举办。(东北师范大学供图\n\n　　本次年会以“新时代教师培养课程与高质量教师教育”为主题。教育部教师工作司司长王磊在线致辞时表示，中国式现代化新格局、人口变化新形势、科技产业变革新挑战，都对教师队伍建设提出了全新命题。教育部将聚焦“培养什么样的教师、谁来培养教师、怎样培养教师”的源头之问，加快构建卓越引领、开放协同、供需适配的中国特色高水平教师教育体系。\n\n　　主旨报告环节，来自北京师范大学、首都师范大学、天津师范大学、西北师范大学、华东师范大学、南京师范大学及东北师范大学等高校的专家学者，围绕新时代师范院校发展方向、人工智能赋能教师教育、教师角色转型与素养重构等议题作报告。\n\n　　会议期间还设置5个平行论坛、6个青年学者论坛及期刊见面会。48位专家和60位青年学者围绕教师教育课程体系建设、智能技术赋能教师教育、教师可持续发展机制、教师核心素养与专业标准重构、数据驱动的教师教育评价等议题展开交流。\n\n　　与会专家认为，人工智能等新技术正在推动教育教学方式和教师角色发生变化，教师教育需要进一步优化课程体系，加强技术与教育教学的深度融合，同时注重教师专业素养和育人能力培养。\n\n　　此次年会为全国教师教育领域专家学者搭建了学术交流与合作平台，也为推动教师教育理论创新、课程改革和实践探索提供了交流契机。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbff8dd3f23","title":"2026城市“青活力”调查报告：近八成年轻人选择城市首看薪资","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735817.shtml","summary":"中新网北京11月21日电 中国新闻周刊2026城市“青活力”调查报告(以下简称“报告”)20日在京发布。","summary_short":"中新网北京11月21日电 中国新闻周刊2026城市“青活力”调查报告(以下简称“报告”)20日在京发布。","digest":"中国新闻周刊2026城市“青活力”调查报告(以下简称“报告”)20日在京发布","points":["中新网北京11月21日电 中国新闻周刊2026城市“青活力”调查报告(以下简称“报告”)20…","报告深度调研9727名年轻人，聚焦“事业成长、生活品质、价值认同、公共服务”四个维度…","围绕本次调查，中国新闻周刊重磅推出封面故事《年轻人的城市》…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-21T18:40:17+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 中国新闻周刊2026城市“青活力”调查报告(以下简称“报告”)20日在京发布。报告深度调研9727名年轻人，聚焦“事业成长、生活品质、价值认同、公共服务”四个维度，年轻人投票选出心中的活力之城。围绕本次调查，中国新闻周刊重磅推出封面故事《年轻人的城市》，解读城市如何把功夫下在年轻人的日常里。\r\n\n　　2026年是“十五五”开局之年。“十五五”规划纲要首次以专节形式部署支持青年发展。“赢得青年，才能赢得下一个十年。”中国新闻周刊总编辑王晨波表示，“城市里最稀缺的不是地，不是楼，是让空间长出内容、长出新故事的创造力，这股力量来自青年。”\n\n　　青年是城市最核心的活力源泉、创新主力与未来底气。年轻人的流向，直接决定一座城市的产业能级、发展潜力与存续生命力。\n\n　　那么，一座城市靠什么吸引年轻人，又靠什么留住年轻人？\n\n　　75.9%要高薪，68.7%同步要求“公平”——既要挣得到，也要活得像样。60.2%拒绝在“拼命”和“躺平”之间二选一，要的是事业与生活都能兼顾的地方。66.2%把“政策说到做到”列为城市有好产业的第一标准，拒绝“画饼”。\n\n　　对于“活力之城”最重要的特质，“包容”一词以近三成占比高居榜首。\n\n　　调研显示，城市竞争的逻辑正在翻转。过去是哪里有产业，人就往哪里跑。现在是哪里活得舒服、规则正，人才愿意留下。人留下，好企业自然跟着来。\n\n　　报告发布现场，来自区域经济、城市规划与国际传播领域的专家学者，从多维度解析城市“青活力”，为城市吸引年轻人提供路径参考。\n\n　　“居民对城市的选择，已经从高收入、好事业转向事业和生活平衡、安放家庭。”在全国工程勘察设计大师、中国城市规划设计研究院原院长李晓江看来，城镇化新型不新型，关键看安家。他认为，“成年城市”要想成为年轻人的城市，吸引年轻人安家，就要供给年轻人所需的空间，吸引大学生、留住农民工就是“王”；要摆脱增量时代审美价值观，关切不同人群的选择偏好，尤其是关注弱势群体的生存发展，同时也要关注气候变化，关注文化价值的审美趣味、人文精神、文明教化和文化传承。\n\n　　中央团校常务副校长、国家中长期青年发展规划专家委员廉思指出，青年人在一座城市中谋生，形成了对城市的深刻理解，既要为未来努力，也可以享受当下的生活。所以，城市不仅要提供住所和岗位，也应当珍惜那些愿意使人生活于此的关系、记忆和意义。制度不能替人回答生命的所有问题，却可以为“寻找”创造条件。在生活有保障的基础上，让人理解自己、关心他人，有勇气展开尚未完成的人生。\n\n　　清华大学国家形象传播研究中心主任、新闻与传播学院教授范红表示，激发青年创造力、完善青年成长生态、推动城市形象多元共创，三者逻辑一脉相承。一座富有活力的城市，既要能够吸引青年，更要善于成就青年。“城市先要打造令青年真心认同、愿意扎根的生活发展环境。当青年在这里拥有归属感，便会自发成为城市最鲜活的讲述者，共同塑造真实动人的城市形象。”\n\n　　报告综合城市的“事业成长、生活品质、价值认同、公共服务”等维度，根据调研内容，发布2026活力之城案例，包括：天津市、武汉市、成都市、南京市、济南市、杭州市、青岛市、深圳市、宁波市、石家庄市、长沙市、唐山市、大同市、无锡市、苏州市、扬州市、湖州市、潍坊市、临沂市、张家界市、宜宾市、榆林市、北京市海淀区、佛山市顺德区、天台县等。\n\n　　自2021年起，中国新闻周刊持续发布“活力之城”相关报告，围绕城市活力议题形成了系统的观察脉络与研究积累，助力城市建设找到活力之源。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":75,"items":[{"id":"cbecca7f46e","title":"外籍来华消费有多便利？美国博主：来了就知道","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735780.shtml","summary":"聚焦APEC丨外籍来华消费有多便利？","sum eo_poster":"","lang":"zh-Hans","items":[{"title":"第四十届中国植保双交会成都开幕 发布10项团体标准","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-21/news1075653.shtml","source_display":"中新視頻","published_at":"2026-11-21T15:54:26+08:00","category":"財經","digest":"11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕"},{"title":"第四十届中国植保双交会在蓉开幕 发布10项团体标准","url":"https://www.chinanews.com.cn/sh/2026/11-21/10735694.shtml","source_display":"中新網 社會","published_at":"2026-11-21T13:34:25+08:00","category":"","digest":"第四十届中国植保双交会在蓉开幕 发布10项团体标准"}],"cross":{"total":2,"angles":[{"point":"第四十届中国植保双交会在蓉开幕 发布10项团体标准","sources":["中新網 社會"],"url":"https://www.chinanews.com.cn/sh/2026/11-21/10735694.shtml"},{"point":"11月21日，第四十届中国植保信息交流暨农药械交易会在成都中国西部国际博览城开幕","sources":["中新視頻"],"url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-21/news1075653.shtml"}]}},{"id":"ced00a6b7f1","title":"算力补贴直达企业 北京延庆上线词元服务平台","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735881.shtml","summary":"中新网北京11月21日电 (张思琦)Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服务计划上线发布会20日在北京延庆Y-Hub·OPC创新社区举办。","summary_short":"中新网北京11月21日电 (张思琦)Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服…","digest":"Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服…","points":["中新网北京11月21日电 (张思琦)Token Hub·词元汇——中关村延庆园词元服务平台暨…","该平台的上线投用，将有效补齐区域科创服务链条，降低中小微企业人工智能算力使用成本…","平台依托天翼云底座搭建，接入DeepSeek、豆包、通义千问等34款模型，全面覆盖文本创作…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:38:36+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 (张思琦)Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服务计划上线发布会20日在北京延庆Y-Hub·OPC创新社区举办。该平台的上线投用，将有效补齐区域科创服务链条，降低中小微企业人工智能算力使用成本，为北京延庆数字科创产业发展赋能增效。\n\n图为Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服务计划上线发布会。主办方供图\n\n　　据了解，平台依托天翼云底座搭建，接入DeepSeek、豆包、通义千问等34款模型，全面覆盖文本创作、图文生成、音视频制作等多元AI应用能力，可充分满足各类科创企业的智能化开发与运营需求。\n\n　　平台最大亮点为普惠化、直达式算力补贴机制，企业算力使用补贴最高可达50%。补贴采用实时直抵抵扣模式，无需企业先行垫付费用、后续报销，彻底简化补贴申领流程，大幅减轻中小微企业资金压力。\n\n　　同时，平台配套推出多档月度算力套餐及增量加油包，实现补贴账目、套餐账目独立分账、清晰可查。企业账户开通、订单查询、发票申领等全部流程实现线上一体化办结。平台支持密钥额度上限设置、IP白名单管理，全程可追溯每一次模型调用记录，从技术层面筑牢企业数据安全屏障。\n\n　　本次发布会成果密集落地，同步完成平台正式发布、全新服务体系亮相、科创加速营招募、产业机构集中签约等多项重要环节。平台将算力供给、政策补贴、孵化培育、创业培训、产业对接等服务整合为一体化科创服务包，精准直达创业主体，全力打造普惠可及、生态完善的区域AI创新发展环境。\n\n图为Token Hub·词元汇——中关村延庆园词元服务平台暨延庆Y-Hub·OPC赋能服务计划上线发布会。主办方供图\n\n　　发布会还同步推出Y-Hub·OPC企业服务体系与“Yan创课堂”培训栏目，集成政策申报、财税法务、知识产权等全维度创业刚需服务。活动现场专门设置实操咨询专区，技术人员一对一、手把手指导企业完成平台注册、补贴申领、模型部署等操作，让科创服务直达一线、落地见效。\n\n　　活动由中关村科技园区延庆园管委会指导，中国电信延庆分公司、中关村延庆园投资发展有限公司、北京氪星创服联合主办，多家科技孵化器与科技服务企业共同承办。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4aa329a1da","title":"行业报告称，中国脑机接口产业集聚于三大城市群","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735875.shtml","summary":"中新社北京11月21日电 (记者 陈杭)21日于北京举行的2026脑机接口大会主论坛发布《脑机接口创新发展研究报告(2026)》。","summary_short":"中新社北京11月21日电 (记者 陈杭)21日于北京举行的2026脑机接口大会主论坛发布《脑机接口创新发展研究报告(20…","digest":"21日于北京举行的2026脑机接口大会主论坛发布《脑机接口创新发展研究报告(2026…","points":["中新社北京11月21日电 (记者 陈杭)21日于北京举行的2026脑机接口大会主论坛发布《脑…","报告显示，中国脑机接口产业集聚于京津冀、长三角和粤港澳三大城市群，已初步形成重视原创、转化…","报告由中国信息通信研究院联合脑机接口产业联盟编制"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:35:26+08:00","size":1,"keywords":[],"body":"中新社北京11月21日电 (记者 陈杭)21日于北京举行的2026脑机接口大会主论坛发布《脑机接口创新发展研究报告(2026)》。报告显示，中国脑机接口产业集聚于京津冀、长三角和粤港澳三大城市群，已初步形成重视原创、转化、制造的优质协同链条。\r\n\n　　报告由中国信息通信研究院联合脑机接口产业联盟编制。报告显示，2026年，全球脑机接口企业数量达1175家，相比2025年有较快增长。脑机接口国际产业发展环境不断完善，产业格局面临洗牌。中国、美国等从技术、应用、生态、治理等方面推进，积极争取产业话语权。\n\n　　根据报告，中国京津冀地区脑机接口项目呈精品化特征，融资转化率高；长三角地区有龙头企业带动，投资环境良好；粤港澳地区中小企业多，制造环节占优。\n\n　　报告提出，脑机接口产业当前的营收主要来自科研和医疗两个领域，大量相关医疗器械产品仍处于研发、临床与审批中；非医疗领域尚处产业初期阶段，在人机交互、消费电子方面有较大发展空间。\n\n　　报告指出，脑机接口技术周期长、难度大，多学科协同复杂度高，疗效评估仍需审慎；规模化落地受制于临床证据不足、支付与人才体系不完善，仍需要战略耐心、资本耐心，需要持续的政策支持及资源供给。\n\n　　报告发布人、中国信息通信研究院知识产权与创新发展中心主任李文宇表示，2026年，随着脑机接口技术与产业不断进步，其战略意义正逐渐从大脑和外部设备的直接连接，走向更为多维的产业赋能。\n\n　　2026脑机接口大会由中国信息通信研究院、北京市昌平区联合举办，从11月19日持续至22日，打造集竞技活动、论坛、成果展览于一体的国家级产业交流平台。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cee54e96138","title":"北京丰台亮出9处优质体育资源 邀“城市合伙人”共创运动新空间","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735873.shtml","summary":"中新网北京11月21日电 11月中旬开始，北京市丰台区陆续举办系列专场推介发布会，亮出政府合作诚意，全程公开透明，持续释放优质投资机会。","summary_short":"中新网北京11月21日电 11月中旬开始，北京市丰台区陆续举办系列专场推介发布会，亮出政府合作诚意，全程公开透明…","digest":"11月中旬开始，北京市丰台区陆续举办系列专场推介发布会，亮出政府合作诚意…","points":["中新网北京11月21日电 11月中旬开始，北京市丰台区陆续举办系列专场推介发布会…","“遇见丰台·众汇京彩”——2026丰台区体育资源发布会作为第二场系列发布20日举办","会上，丰台亮出体育资源“家底”，集中推出9处体育“留白空间”，包括5宗体育用地…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:26:57+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 11月中旬开始，北京市丰台区陆续举办系列专场推介发布会，亮出政府合作诚意，全程公开透明，持续释放优质投资机会。“遇见丰台·众汇京彩”——2026丰台区体育资源发布会作为第二场系列发布20日举办。会上，丰台亮出体育资源“家底”，集中推出9处体育“留白空间”，包括5宗体育用地、1处体育存量设施和3处可做气膜场馆用地，面向社会公开征集运营主体，所有体育设施、地块信息全部向社会公开、全程接受社会监督。\r\n\n　　“丰台资源丰富。大家的需求，我们看得明白。丰台区有打造宜居宜业城区的真心，也有一抓到底的决心。”北京市丰台区副区长高崇耀率先用三个“有”——有底、有数、有心，道出丰台的诚意。\n\n　　一块体育用地，能长出什么？丰台实打实拿出一批优质空间满足想象。会上，北京市丰台区体育局局长杨华发布9处体育资源，分布在右安门、大红门、南苑、花乡等街镇，项目类型丰富、特色鲜明，可充分满足各类运营主体差异化、多元化的项目建设需求。\n\n　　其中，5宗体育用地全部完成征地拆迁、净地可移交，周边市政道路贯通，基本具备“拿地即开工”条件。位于南二环与南三环之间的右安门街道T00-0501-617地块A4体育用地面积最大、人口密度最高，周边配套条件成熟，可考虑做地区级全民健身中心、全民赛事活力中心；大红门街道T00-0516-0003地块A4体育用地位处南中轴活力片区，弥补周边潮流运动项目缺口，可瞄准“潮流运动”方向；南苑街道NY-040地块A4体育用地紧邻南苑森林湿地公园，可打造体绿融合、全龄友好、赛消一体的森氧运动公园；看丹街道FT00-1523-081地块A4体育用地位处中关村丰台园，依托高频客群底盘与交通商业协同，可打造全龄运动生活中心；新村街道FT00-1523-0030地块A4体育用地体量最小但紧邻北京丰台站，可服务通勤人群与周边居民。\n\n　　5宗净地外，还有一处待更新的存量设施——占地21.78万平方米、已运营36年的丰台体育中心城市焕新项目，以及3处属于建设用地的拆违腾退地块，位处花乡街道、王佐镇及六里桥街道，可做气膜场馆用地，为中小运营主体提供了进入丰台体育市场的低门槛通道。\n\n　　“我们寻找的是‘城市合伙人’，丰台有把体育产业当作长期事业来做的诚意，无论是重资产开发，还是轻资产运营，总有一款适合您。”杨华发出邀约。\n\n　　北京市体育产业协会副会长高原鸣在访谈中表示，引入社会资本，不是简单把体育项目完全交给市场，核心是把握好边界；华体集团总裁助理李铁林从产业实操角度为企业“划重点”，要吃透政策、用好服务工具、匹配地块所在板块的功能定位；北京市篮协副主席焦健则从运动员、全民健身推广者的角度出发，对丰台未来的体育场景提出期待；中国科学院大学讲习教授，北京市建筑设计研究院总建筑师、总规划师，首钢集团总建筑师吴晨认为，项目落地需要运营前置、业态导入和界面处理，让体育节点与慢行系统、周边街区形成动线耦合，把“过境人流”转化为“驻留人流”。\n\n　　高崇耀用核心三件事向企业清晰亮出丰台的发力主线——释放空间资源、做优营商环境、打造产业生态。“三样到位了，产业才能扎下根、活力才能出来。”\n\n　　截至目前，丰台全区规划公共体育设施共计164处，总用地面积约198.8公顷，建筑规模约136.6万平方米。“15分钟健身圈”建设加速推进，已建成全民健身专项活动场地497片，全民健身路径工程器材13000余件，体育公园2处，群众在家门口即可享高品质健身服务。\n\n　　体育生态为产业生长涵养沃土，营商环境与金融赋能同样不可或缺。据介绍，丰台区通过持续举办“区长企业服务日”活动，深化政企协调发展，同时创新推出“审批科长工作营”，联动市级部门，汇聚20余个职能部门、60余名审批科长，提供一站式审批对接服务，助力企业轻装上阵、专心发展。\n\n　　在金融支持环节，北京银行丰台支行副行长郝梦瑶介绍，银行可提供“项目建设—资产更新—运营周转—消费场景—综合服务”全周期金融服务，为金融资本与产业资本同频共振带去新机会。\n\n　　以体育凝聚人气，以商业实现价值，以生态反哺发展，丰台将携手“城市合伙人”，把每一处体育空间打造成“一刻钟遇见美好生活”的活力场景。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6872f6c602","title":"投资额约14亿元 重庆发布市属国企第四批“四链”融合创新项目","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735871.shtml","summary":"中新网重庆11月21日电 (梁钦卿)重庆国际人才交流大会·“科学家·创业者·投资人”创投对接活动21日在重庆举办。","summary_short":"中新网重庆11月21日电 (梁钦卿)重庆国际人才交流大会·“科学家·创业者·投资人”创投对接活动21日在重庆举办。","digest":"重庆国际人才交流大会·“科学家·创业者·投资人”创投对接活动21日在重庆举办","points":["中新网重庆11月21日电 (梁钦卿)重庆国际人才交流大会·“科学家·创业者·投资人”创投对接…","活动现场发布了重庆市属国企第四批“四链”融合创新项目共65个，投资额约14亿元…","此次活动以“‘四链’融合 赋能发展”为主题，推动科学家、创业者、投资人三方对接、同向发力…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:19:59+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (梁钦卿)重庆国际人才交流大会·“科学家·创业者·投资人”创投对接活动21日在重庆举办。活动现场发布了重庆市属国企第四批“四链”融合创新项目共65个，投资额约14亿元，主要覆盖智能网联新能源汽车、先进材料与绿色化工、智能装备与制造等6大方向。\n\n　　此次活动以“‘四链’融合 赋能发展”为主题，推动科学家、创业者、投资人三方对接、同向发力，撬动各类资本为重庆市引进的高层次人才创新创业赋能。\n\n图为活动现场。重庆市国有资产监督管理委员会供图\n\n　　此次发布的“四链”融合创新项目中，先进材料与绿色化工方向项目7个、计划投资2.69亿元，围绕特种精细化工、新型功能材料等开展研发，推动产业向高端化、绿色化转型；智能装备与制造方向项目14个、计划投资5.34亿元，重点布局高端装备国产化和首台(套)重大技术装备研发应用，提升产业链自主可控能力。\n\n　　今年以来，重庆市属国企“四链”融合创新项目累计落地239个、带动经济效益近100亿元。\n\n　　重庆渝富控股集团现场发布渝富科创资本体系及国有资本服务高层次人才成果转化对接机制，构建“入库汇总—价值挖掘—分类赋能—转化落地”全链条孵化通道，配套成果转化、融资接力、项目直通三张清单。\n\n　　该机制聚焦高层次人才项目动态库建设，按“创业企业类”“中试熟化类”“概念验证类”“创意形成类”分层标注、分类赋能；对尚未转化为公司实体的科技成果，探索组建陪跑人团队，深化“科技成果+认股权”模式；对已形成项目载体的，按种子期、天使期、A轮及以前、成长成熟期精准匹配种子基金、天使类基金、科创母基金等投资工具接续赋能。\n\n　　本次活动紧扣重庆“33618”现代制造业集群体系，现场签约人才项目、“国企优投”创投项目。人才项目签约涵盖科技副总、“背靠一所大学”校企合作、人才代表等；“国企优投”创投项目涵盖基金合作与科创企业投资两类，涉及碳化硅半导体、医疗大数据、具身智能、智能网联新能源汽车、智能装备等领域。\n\n　　重庆市国有资产监督管理委员会相关负责人表示，将持续跟踪“国企优投”签约项目落地实施，推动国有资本服务高层次人才成果转化对接机制常态长效，深化人才强企战略，为现代化新重庆建设贡献国资国企力量。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c854eedbd31","title":"泽连斯基：打击克里米亚大桥是对俄军袭击乌桥梁的回应","url":"https://www.jiemian.com/article/15358373.html","summary":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，在乌方对克里米亚大桥实施打击之前，俄军已经使用导弹和无人机对乌克兰境内桥梁发动109次袭击。","summary_short":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，在乌方对克里米亚大桥实施打击之前…","digest":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示…","points":["当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示…","泽连斯基强调，乌方针对克里米亚大桥的行动，是在俄军多次袭击乌克兰桥梁之后作出的回应","他指出，克里米亚大桥长期被俄方用作军事后勤通道，俄军经由该桥向克里米亚运送坦克…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:59:32+08:00","size":1,"keywords":[],"body":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，在乌方对克里米亚大桥实施打击之前，俄军已经使用导弹和无人机对乌克兰境内桥梁发动109次袭击。泽连斯基强调，乌方针对克里米亚大桥的行动，是在俄军多次袭击乌克兰桥梁之后作出的回应。他指出，克里米亚大桥长期被俄方用作军事后勤通道，俄军经由该桥向克里米亚运送坦克、火炮等各类军事装备，相关运输活动有视频佐证。泽连斯基认为，俄方持续袭击乌克兰基础设施的行为，表明其并无结束战争的意愿，还在寻找借口继续升级冲突。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccbc62ad085","title":"泽连斯基称乌欧美俄四方会谈时间取决于美方协调","url":"https://www.jiemian.com/article/15358367.html","summary":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，下一轮乌克兰、美国、欧洲、俄罗斯四方会谈的举办时间与形式，取决于美方和各方就会议议程协调一致的进度。","summary_short":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，下一轮乌克兰、美国、欧洲…","digest":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示…","points":["当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，下一轮乌克兰…","泽连斯基指出，欧洲加入谈判后，四方参与令谈判筹备更为复杂，会议需要充分准备…","泽连斯基称，人员交换依然重要，乌方主张按照 “全部交换全部” 原则推进…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:58:57+08:00","size":1,"keywords":[],"body":"当地时间11月21日，乌克兰总统泽连斯基在会晤英国国防大臣斯特里廷时表示，下一轮乌克兰、美国、欧洲、俄罗斯四方会谈的举办时间与形式，取决于美方和各方就会议议程协调一致的进度。他称，“美方会尽力推动会谈尽快举行，但预计俄方可能采取行动拖延会议”。泽连斯基指出，欧洲加入谈判后，四方参与令谈判筹备更为复杂，会议需要充分准备、设定清晰具体的议程，力求取得实质成果，各方不应只满足于最低限度的共识。泽连斯基称，人员交换依然重要，乌方主张按照 “全部交换全部” 原则推进，但这不能成为谈判唯一议题。谈判必须聚焦结束战争这一核心目标，通过多方磋商逐步推动战事终结。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cca9632a91c","title":"伊朗称美军掩护油轮非法通行，霍尔木兹海峡触雷事故不断","url":"https://www.jiemian.com/article/15358359.html","summary":"当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚，多艘油轮在霍尔木兹海峡南部海域发生事故。","summary_short":"当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚，多艘油轮在霍尔木兹海峡南部海域发生事故。","digest":"当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚…","points":["当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚…","伊朗方面表示，20日晚，美军动用了包括空中加油机、F-16、F/A-18和 F-35…","在此期间，霍尔木兹海峡南部海域发生了多起油轮爆炸和起火事故"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:43:43+08:00","size":1,"keywords":[],"body":"当地时间11月21日，伊朗伊斯兰革命卫队海军发表声明称，自20日晚，多艘油轮在霍尔木兹海峡南部海域发生事故。伊朗方面表示，20日晚，美军动用了包括空中加油机、F-16、F/A-18和 F-35、P-8“海神”海上巡逻机、多架直升机以及MQ系列无人机等大规模空中力量，试图为油轮通过霍尔木兹海峡提供掩护，并协助其进行未经授权的货物运输。在此期间，霍尔木兹海峡南部海域发生了多起油轮爆炸和起火事故。声明称，第一起事件发生在海塞卜港附近。第二起事件则发生在21日清晨，地点位于盖奈姆岛海岸线约三公里处。这些爆炸是由涉事船只触碰水雷所致。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2a85981f65","title":"唐人神：积极采取措施应对本轮猪周期底部","url":"https://www.jiemian.com/article/15358351.html","summary":"唐人神日前在机构调研时表示，公司积极采取措施应对本轮猪周期底部，一是，公司三大业务保持稳定发展，充分发挥饲料产业周转速度快、现金流好等产业优势，公司母公司以饲料生产销售为主…","summary_short":"唐人神日前在机构调研时表示，公司积极采取措施应对本轮猪周期底部，一是，公司三大业务保持稳定发展…","digest":"唐人神日前在机构调研时表示，公司积极采取措施应对本轮猪周期底部，一是…","points":["唐人神日前在机构调研时表示，公司积极采取措施应对本轮猪周期底部，一是…","2026年1—9月，公司经营活动产生的现金流量净额为1.7亿元，经营活动现金流仍保持正流入","二是，公司结合生猪行情变化，对生猪出栏结构做出动态调整，以维护现金流安全为首要任务"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:42:38+08:00","size":1,"keywords":[],"body":"唐人神日前在机构调研时表示，公司积极采取措施应对本轮猪周期底部，一是，公司三大业务保持稳定发展，充分发挥饲料产业周转速度快、现金流好等产业优势，公司母公司以饲料生产销售为主，母公司及下属饲料子公司具备良好的融资条件，可为公司其它产业提供现金流支持。2026年1—9月，公司经营活动产生的现金流量净额为1.7亿元，经营活动现金流仍保持正流入。二是，公司结合生猪行情变化，对生猪出栏结构做出动态调整，以维护现金流安全为首要任务。三是，公司持续通过项目制实现生猪养殖成本改善，加强生产与健康管理、提高生产成绩指标。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc13cf5c099","title":"香港特区2026年选举委员会界别分组一般选举的筹备工作已准备就绪","url":"https://www.jiemian.com/article/15358346.html","summary":"香港特区2026年选举委员会界别分组一般选举明日（11月22日）举行。","summary_short":"香港特区2026年选举委员会界别分组一般选举明日（11月22日）举行。","digest":"香港特区2026年选举委员会界别分组一般选举明日举行","points":["选举管理委员会主席陆启康法官今日（21日）上午在技术咨询委员会召集人及成员的陪同下巡视设于港…","他衷心感谢工作人员作出的努力，以确保明日的选举可公开、诚实、公平地进行"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:41:33+08:00","size":1,"keywords":[],"body":"香港特区2026年选举委员会界别分组一般选举明日（11月22日）举行。选举管理委员会主席陆启康法官今日（21日）上午在技术咨询委员会召集人及成员的陪同下巡视设于港湾道体育馆的投票站和设于香港会议展览中心的中央点票站，并呼吁合资格投票人明日踊跃投票。陆启康法官表示，2026年选举委员会界别分组一般选举的筹备工作已准备就绪，工作人员现正进行最后的准备和演练。他衷心感谢工作人员作出的努力，以确保明日的选举可公开、诚实、公平地进行。（大湾区之声）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc7cae5d3cc","title":"把赛事节展变为城市IP，上海有了破圈新打法","url":"https://www.jiemian.com/article/15358046.html","summary":"界面新闻记者 | 崔逸星 界面新闻编辑 | 庄键  今年的上海网球大师赛在10月5日开赛，但与之相关的各类活动，更早前就已经在上海的各个角落陆续展开。","summary_short":"界面新闻记者 | 崔逸星 界面新闻编辑 | 庄键  今年的上海网球大师赛在10月5日开赛，但与之相关的各类活动…","digest":"界面新闻记者 | 崔逸星 界面新闻编辑 | 庄键  今年的上海网球大师赛在10月5日…","points":["今年的上海网球大师赛在10月5日开赛，但与之相关的各类活动…","部分球员当时已抵沪训练，球迷可以买票进入位于闵行区的旗忠网球中心看训练…","在本周举行的上海文商旅体展融合发展研讨会上，上海久事动娱文旅集团股份有限公司副总裁张伟尧透露…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:29:33+08:00","size":1,"keywords":[],"body":"界面新闻记者 | 崔逸星\n界面新闻编辑 | 庄键\n\n今年的上海网球大师赛在10月5日开赛，但与之相关的各类活动，更早前就已经在上海的各个角落陆续展开。\n\n10月1日至4日，大师赛首次举办了赛前嘉年华。部分球员当时已抵沪训练，球迷可以买票进入位于闵行区的旗忠网球中心看训练，家长也可以带孩子去“马上网球”体验区。不少孩子在那里第一次拿起球拍，跟着教练学击球。\n\n嘉年华门票每张60元，附带等额消费抵用券，可以买吃的，也可以挑一件赛事纪念品。算上这场赛前嘉年华，今年大师赛的活动周期延长到了18天。\n\n在本周举行的上海文商旅体展融合发展研讨会上，上海久事动娱文旅集团股份有限公司副总裁张伟尧透露，今年大师赛现场累计接待25万人次，而设在赛场外的“第二现场”，则吸引观众超过40万人次。\n\n距离旗忠网球中心30多公里外、地处上海市中心的静安苏河湾，是今年大师赛“第二现场”的主要举办地。\n\n10月5日上午，中国网球选手布云朝克特和美国选手泰勒·弗里茨乘船抵达这里，参加大师赛的抽签仪式，并共同揭晓男单对阵签表。不少球迷专程赶来，想和两位选手合影。\n\n“第二现场”内，修缮一新的福新面粉厂旧址免费开放，今年出圈的“潦草小狗”也换了造型，戴上网球帽，抱着网球出现在面粉厂前。\n\n沿着苏州河散步时，市民可以顺道看一眼以历届大师赛冠军为原型制作的“兵马俑”。等比赛正式开打，没买球票的人也可以留在这里，收看比赛转播。\n\n今年前十个月，上海统筹举办了近90项重大活动，其中12项吸引了百万级客流。对于如此规模的城市级IP，主办方也需要考虑赛场、剧场和展厅以外的人。原本没打算看一场比赛、听一场音乐会、或者欣赏一场展览的人，如何也能参与其中？\n\n在上述研讨会上，发布了2027年上海文商旅体展融合发展“四大支持计划”，其中就提及支持打造城市级“IP+”重点活动项目，鼓励主办方从“垂类专业圈”走向大众“生活圈”与“消费圈”的表述。\n\n类似上海大师赛在今年尝试的破圈行动，已逐渐成为上海打造城市级IP时的重要打法。\n\nF1中国大奖赛已经有了多年走出围场的经验。今年3月13日，赛车在上海国际赛车场开跑，配套的“格子旗嘉年华”从3月8日就开始了。\n\n徐汇西岸有赛车展览和互动游戏，到了比赛周末，北外滩国际客运中心码头的卡丁车赛道24小时开放。第一天晚上，从7时到次日凌晨1时的体验票全部约满。\n\n今年，演出主办方也开启了新的合作模式，不仅把舞台搬进市民“生活圈”和“消费圈”，售票点也一同而来。\n\n10月19日，捷克男童合唱团来到陆家嘴中心绿地。上海国际艺术节和陆家嘴国际咖啡文化季今年首次合作，艺术节把合唱、舞蹈、爵士乐编进咖啡节一周的日程，在现场也设了展位。逛咖啡节的人如果对剧场里的节目感兴趣，可以在展位上挑选指定剧目，享受购票折扣。\n\n艺术节今年还首次到商圈发售优惠票。百联又一城、TX淮海等五个商圈的售票点共推出约6500张优惠票，平均以半价出售，最终全部售罄。\n\n本届艺术节有超过40万张演出活动门票可以用来领取优惠，覆盖46个商业体、约1000家商户。\n\n在静安的“环享嗨GO”或百联的“联联GO”上传票根，通过核验后，观众就能查到相应的餐饮、购物优惠。艺术节还和锦江旅游合作，让外地观众可以同步预订演出票、景点门票、机票和酒店。\n\n据艺术节主办方调研，来沪观演的观众平均在上海停留5.12天。重点剧场演出前后，周边日均消费金额同比增长9.28%。从整届艺术节来看，观演直接产生消费11.86亿元，综合带动消费超过45.4亿元。\n\n上海国际艺术节中心副总裁阮杰在研讨会上举例：“今年艺术节和‘秋约魔都美术季’推出演展联票，从两张票变成了一条线路。”\n\n在晶耀前滩，蓝蛙餐厅为持艺术节票根的观众提供了指定饮品买一赠一的优惠。同一家店，今年春天参加上海国际花卉节时，做的却是布展的活。门口那只半人高、用花瓣拼成的蓝色青蛙，就是餐厅自己出钱请设计师做的。来前滩吃饭的人走到店门口，也就逛到了花卉节的一处展点。\n\n上海国际花展是上海本土培育的城市级IP，今年更名为上海国际花卉节。沿街商户参与布展的做法也延续了下来。仅新天地一处，就有近40家品牌商户布置了花艺橱窗，行人沿街就能免费逛展。\n\n在黄浦区淡水路，街道请设计师为沿街10家小店布置花窗，大施裁缝铺的店主施意还把花摆进了屋里。她找来老式花瓶，把插花摆上桌案，还原上世纪80年代上海人家里的摆设。有人在门外拍完花，进店看到熟悉的老物件，就和她聊了起来。花窗布置好后的周五、周六，进店人数和成交量都翻了倍。\n\n“市民也愿意把园艺的心得和作品拿出来分享。”万花(上海)城市运营管理有限公司副总经理丁浩然在研讨会上说，今年花卉节还组织了社区花园活动，也有市民走进商圈，和更多人交流园艺心得。\n\n万花负责花卉节的市场化运营，公司董事吕志华此前告诉界面新闻，参与花卉节的商圈和品牌，有的出资，有的则提供场地。\n\n去年花展期间，黄浦区投入约200万元，社会投入约1100万元。今年区里的投入基本持平，社会投入增至2500万元以上。据上海市绿化市容局统计，展期23天的花卉节共吸引客流2950万人次，相关商圈实现销售额20.25亿元。\n\n花卉节结束后，万花又参与了上海博物馆美洲展的策划。这一次，团队在花箱里育苗，等玉米长高后，趁夜运到上博人民广场馆，在南门外布置了一片玉米地。馆里展出的文物中有玛雅玉米神雕像，馆外的玉米则可以亲手采摘。\n\n8月6日，35名受邀观众提着竹篮来掰玉米，其中有人专程从外地赶来。辰山植物园的专家也来到现场，给大家讲解手里的这株作物。\n\n辰山植物园原是花卉节的合作伙伴，经万花介绍，与上博有了合作。两家机构把一堂研学课分在了两个地方。孩子们上午在博物馆看文物，下午去松江的植物园，看看玉米的野生祖先大刍草长什么样。\n\n植物园只是上博美洲展的合作伙伴之一。美洲古代文明对不少中国观众来说较为陌生，为了让更多人了解展览，上博从文物中寻找与当下生活的联系，与辰山植物园、上海动物园等合作，把动物、植物和食物等带进展览。这被上博称为“五物联动”，即围绕文物，将人物、动物、植物和食物与展览结合起来。\n\n未来，上海还致力于打造更多的城市级IP。研讨会举办当天，上海启动2027年城市级重大活动征集，并公布四项支持计划。除了鼓励赛事、节展主办方走进大众生活和消费空间，上海还支持片区运营企业和行业联盟共同打造特色地标，围绕夜间消费、短途度假等策划活动，并支持城市品牌推广和数字化服务项目。\n\n要让更多人在赛场、剧场和展厅之外接触这些活动，主办方得找到愿意一起做事的伙伴。商场能提供场地、接触顾客，植物园能和博物馆合上一堂课。上海在筹划下一年的重大活动时，也把这些合作方纳入了支持范围。\n\n在体育领域，上海建立了“尚嗨运动”联动资源库，把赛事活动和企业资源汇集到一起。今年4月，东航加入资源库，并宣布成为2026上海马拉松官方合作伙伴，同时与世界摩托车越野锦标赛上海站达成合作，资源库将继续吸纳赛事和企业，帮助双方对接。\n\n《上海市社会主义国际文化大都市建设“十五五”规划》也提出，统筹年度重点活动排期，提高城市空间资源共享水平，让不同类型的活动有更多合作机会。\n\n这些联动合作即将迎来全新的载体。12月21日，“随申GO”票根平台将正式上线。观众看完一场球赛或一台演出，上传票根，就能在平台上查询附近商户提供的各类优惠。\n\n随着“跨年迎新季”临近，上海也在鼓励活动主办方和企业提前策划，让更多赛事、节展走进街区和商圈。对这座致力于打造更多城市级IP的城市来说，吸引更多人参与其中，既丰富了市民的生活，也为城市消费带来了新的场景和机会。\n\n未经正式授权严禁转载本文，侵权必究。上海要闻\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n把赛事节展变为城市IP，上海有了破圈新打法\n\n今年上海已统筹举办了近90项重大活动，其中12项吸引了百万级客流。\n\n原创新闻崔逸星 · 2026/11/21 19:29来源：界面新闻\n\n2026格子旗嘉年华 图片来源：上海体育微信公号\n\n界面新闻记者 | 崔逸星\n界面新闻编辑 | 庄键\n\n今年的上海网球大师赛在10月5日开赛，但与之相关的各类活动，更早前就已经在上海的各个角落陆续展开。\n\n10月1日至4日，大师赛首次举办了赛前嘉年华。部分球员当时已抵沪训练，球迷可以买票进入位于闵行区的旗忠网球中心看训练，家长也可以带孩子去“马上网球”体验区。不少孩子在那里第一次拿起球拍，跟着教练学击球。\n\n嘉年华门票每张60元，附带等额消费抵用券，可以买吃的，也可以挑一件赛事纪念品。算上这场赛前嘉年华，今年大师赛的活动周期延长到了18天。\n\n在本周举行的上海文商旅体展融合发展研讨会上，上海久事动娱文旅集团股份有限公司副总裁张伟尧透露，今年大师赛现场累计接待25万人次，而设在赛场外的“第二现场”，则吸引观众超过40万人次。\n\n距离旗忠网球中心30多公里外、地处上海市中心的静安苏河湾，是今年大师赛“第二现场”的主要举办地。\n\n10月5日上午，中国网球选手布云朝克特和美国选手泰勒·弗里茨乘船抵达这里，参加大师赛的抽签仪式，并共同揭晓男单对阵签表。不少球迷专程赶来，想和两位选手合影。\n\n“第二现场”内，修缮一新的福新面粉厂旧址免费开放，今年出圈的“潦草小狗”也换了造型，戴上网球帽，抱着网球出现在面粉厂前。\n\n沿着苏州河散步时，市民可以顺道看一眼以历届大师赛冠军为原型制作的“兵马俑”。等比赛正式开打，没买球票的人也可以留在这里，收看比赛转播。\n\n今年前十个月，上海统筹举办了近90项重大活动，其中12项吸引了百万级客流。对于如此规模的城市级IP，主办方也需要考虑赛场、剧场和展厅以外的人。原本没打算看一场比赛、听一场音乐会、或者欣赏一场展览的人，如何也能参与其中？\n\n在上述研讨会上，发布了2027年上海文商旅体展融合发展“四大支持计划”，其中就提及支持打造城市级“IP+”重点活动项目，鼓励主办方从“垂类专业圈”走向大众“生活圈”与“消费圈”的表述。\n\n类似上海大师赛在今年尝试的破圈行动，已逐渐成为上海打造城市级IP时的重要打法。\n\nF1中国大奖赛已经有了多年走出围场的经验。今年3月13日，赛车在上海国际赛车场开跑，配套的“格子旗嘉年华”从3月8日就开始了。\n\n徐汇西岸有赛车展览和互动游戏，到了比赛周末，北外滩国际客运中心码头的卡丁车赛道24小时开放。第一天晚上，从7时到次日凌晨1时的体验票全部约满。\n\n今年，演出主办方也开启了新的合作模式，不仅把舞台搬进市民“生活圈”和“消费圈”，售票点也一同而来。\n\n10月19日，捷克男童合唱团来到陆家嘴中心绿地。上海国际艺术节和陆家嘴国际咖啡文化季今年首次合作，艺术节把合唱、舞蹈、爵士乐编进咖啡节一周的日程，在现场也设了展位。逛咖啡节的人如果对剧场里的节目感兴趣，可以在展位上挑选指定剧目，享受购票折扣。\n\n艺术节今年还首次到商圈发售优惠票。百联又一城、TX淮海等五个商圈的售票点共推出约6500张优惠票，平均以半价出售，最终全部售罄。\n\n本届艺术节有超过40万张演出活动门票可以用来领取优惠，覆盖46个商业体、约1000家商户。\n\n在静安的“环享嗨GO”或百联的“联联GO”上传票根，通过核验后，观众就能查到相应的餐饮、购物优惠。艺术节还和锦江旅游合作，让外地观众可以同步预订演出票、景点门票、机票和酒店。\n\n据艺术节主办方调研，来沪观演的观众平均在上海停留5.12天。重点剧场演出前后，周边日均消费金额同比增长9.28%。从整届艺术节来看，观演直接产生消费11.86亿元，综合带动消费超过45.4亿元。\n\n上海国际艺术节中心副总裁阮杰在研讨会上举例：“今年艺术节和‘秋约魔都美术季’推出演展联票，从两张票变成了一条线路。”\n\n在晶耀前滩，蓝蛙餐厅为持艺术节票根的观众提供了指定饮品买一赠一的优惠。同一家店，今年春天参加上海国际花卉节时，做的却是布展的活。门口那只半人高、用花瓣拼成的蓝色青蛙，就是餐厅自己出钱请设计师做的。来前滩吃饭的人走到店门口，也就逛到了花卉节的一处展点。\n\n上海国际花展是上海本土培育的城市级IP，今年更名为上海国际花卉节。沿街商户参与布展的做法也延续了下来。仅新天地一处，就有近40家品牌商户布置了花艺橱窗，行人沿街就能免费逛展。\n\n在黄浦区淡水路，街道请设计师为沿街10家小店布置花窗，大施裁缝铺的店主施意还把花摆进了屋里。她找来老式花瓶，把插花摆上桌案，还原上世纪80年代上海人家里的摆设。有人在门外拍完花，进店看到熟悉的老物件，就和她聊了起来。花窗布置好后的周五、周六，进店人数和成交量都翻了倍。\n\n“市民也愿意把园艺的心得和作品拿出来分享。”万花(上海)城市运营管理有限公司副总经理丁浩然在研讨会上说，今年花卉节还组织了社区花园活动，也有市民走进商圈，和更多人交流园艺心得。\n\n万花负责花卉节的市场化运营，公司董事吕志华此前告诉界面新闻，参与花卉节的商圈和品牌，有的出资，有的则提供场地。\n\n去年花展期间，黄浦区投入约200万元，社会投入约1100万元。今年区里的投入基本持平，社会投入增至2500万元以上。据上海市绿化市容局统计，展期23天的花卉节共吸引客流2950万人次，相关商圈实现销售额20.25亿元。\n\n花卉节结束后，万花又参与了上海博物馆美洲展的策划。这一次，团队在花箱里育苗，等玉米长高后，趁夜运到上博人民广场馆，在南门外布置了一片玉米地。馆里展出的文物中有玛雅玉米神雕像，馆外的玉米则可以亲手采摘。\n\n8月6日，35名受邀观众提着竹篮来掰玉米，其中有人专程从外地赶来。辰山植物园的专家也来到现场，给大家讲解手里的这株作物。\n\n辰山植物园原是花卉节的合作伙伴，经万花介绍，与上博有了合作。两家机构把一堂研学课分在了两个地方。孩子们上午在博物馆看文物，下午去松江的植物园，看看玉米的野生祖先大刍草长什么样。\n\n植物园只是上博美洲展的合作伙伴之一。美洲古代文明对不少中国观众来说较为陌生，为了让更多人了解展览，上博从文物中寻找与当下生活的联系，与辰山植物园、上海动物园等合作，把动物、植物和食物等带进展览。这被上博称为“五物联动”，即围绕文物，将人物、动物、植物和食物与展览结合起来。\n\n未来，上海还致力于打造更多的城市级IP。研讨会举办当天，上海启动2027年城市级重大活动征集，并公布四项支持计划。除了鼓励赛事、节展主办方走进大众生活和消费空间，上海还支持片区运营企业和行业联盟共同打造特色地标，围绕夜间消费、短途度假等策划活动，并支持城市品牌推广和数字化服务项目。\n\n要让更多人在赛场、剧场和展厅之外接触这些活动，主办方得找到愿意一起做事的伙伴。商场能提供场地、接触顾客，植物园能和博物馆合上一堂课。上海在筹划下一年的重大活动时，也把这些合作方纳入了支持范围。\n\n在体育领域，上海建立了“尚嗨运动”联动资源库，把赛事活动和企业资源汇集到一起。今年4月，东航加入资源库，并宣布成为2026上海马拉松官方合作伙伴，同时与世界摩托车越野锦标赛上海站达成合作，资源库将继续吸纳赛事和企业，帮助双方对接。\n\n《上海市社会主义国际文化大都市建设“十五五”规划》也提出，统筹年度重点活动排期，提高城市空间资源共享水平，让不同类型的活动有更多合作机会。\n\n这些联动合作即将迎来全新的载体。12月21日，“随申GO”票根平台将正式上线。观众看完一场球赛或一台演出，上传票根，就能在平台上查询附近商户提供的各类优惠。\n\n随着“跨年迎新季”临近，上海也在鼓励活动主办方和企业提前策划，让更多赛事、节展走进街区和商圈。对这座致力于打造更多城市级IP的城市来说，吸引更多人参与其中，既丰富了市民的生活，也为城市消费带来了新的场景和机会。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca01b372452","title":"友邦夥中大醫院港怡 擬提早交代治療費用 增醫療資訊透明度","url":"https://www.stheadline.com/realtime-finance/3639667/友邦夥中大醫院港怡-擬提早交代治療費用-增醫療資訊透明度","summary":"友邦香港及澳門今日（21日）宣布，與香港中文大學醫院及港怡醫院探索醫療合作，擬在病人就醫較早階段協調治療安排，讓病人掌握治療路徑及預計費用，並增加醫療質素及治療成效資訊，供病人選擇治療方案時參考。","summary_short":"友邦香港及澳門今日（21日）宣布，與香港中文大學醫院及港怡醫院探索醫療合作，擬在病人就醫較早階段協調治療安排…","digest":"友邦香港及澳門宣布，與香港中文大學醫院及港怡醫院探索醫療合作…","points":["友邦香港及澳門今日（21日）宣布，與香港中文大學醫院及港怡醫院探索醫療合作…","友邦香港及澳門首席產品主張策劃及醫療保健官梁莉斯表示，期望透過保險公司與醫療機構更緊密合作…","她指出，中大醫院及港怡醫院與本港知名大學關係密切，可為合作帶來臨床、適切醫療…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:17:08+08:00","size":1,"keywords":[],"body":"友邦香港及澳門今日（21日）宣布，與香港中文大學醫院及港怡醫院探索醫療合作，擬在病人就醫較早階段協調治療安排，讓病人掌握治療路徑及預計費用，並增加醫療質素及治療成效資訊，供病人選擇治療方案時參考。\n梁莉斯：加強保險公司與醫院協作\n友邦香港及澳門首席產品主張策劃及醫療保健官梁莉斯表示，期望透過保險公司與醫療機構更緊密合作，改善病人的治療成效及就醫體驗，同時更有效運用醫療資源，將「跨界合作轉化為具體行動」。\n她指出，中大醫院及港怡醫院與本港知名大學關係密切，可為合作帶來臨床、適切醫療、研究及創新方面的支援，包括應用創新醫療科技。公司期望隨着合作模式發展，將效益擴展至更多病人。\n「全方位醫療夥伴」涵蓋治療及費用資訊\n上述合作模式名為「全方位醫療夥伴」，涵蓋三方面，包括提供符合醫學實證與臨床卓越研究所（IMACE）臨床指引及獲認可國際標準的治療路徑；增加醫療質素、治療成效及診治效率資訊；以及提早協調治療安排、交代預計費用及簡化流程。\n私人醫療保險開支四年間升逾六成\n友邦於今日舉行的「醫療融資高峰論壇2026」公布上述安排，並引述保聯委託香港理工大學專業及持續教育學院相關研究中心進行的研究指，2019至2023年間，私人醫療保險開支上升逾60%，同期住院索償次數增加68%。\n中大醫院及港怡醫院為首批與友邦共同探索有關模式的私營醫療機構。友邦表示，期望日後與更多私營醫療機構合作。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5099fa5439","title":"青海德令哈5.6级地震震感强烈，中国地震局启动四级应急响应","url":"https://www.jiemian.com/article/15358317.html","summary":"@中国地震台网速报 微博消息，中国地震台网正式测定：11月21日18时45分在青海海西州德令哈市（北纬37.14度，东经96.62度）发生5.6级地震，震源深度10千米。","summary_short":"@中国地震台网速报 微博消息，中国地震台网正式测定：11月21日18时45分在青海海西州德令哈市（北纬37.14度…","digest":"@中国地震台网速报 微博消息…","points":["@中国地震台网速报 微博消息，中国地震台网正式测定…","地震造成当地震感强烈，震中距德令哈市区71公里、距都兰县162公里、距乌兰县167公里…","另据地震信息播报机器人，此次震中5公里范围内平均海拔约3070米…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T19:01:21+08:00","size":1,"keywords":[],"body":"@中国地震台网速报 微博消息，中国地震台网正式测定：11月21日18时45分在青海海西州德令哈市（北纬37.14度，东经96.62度）发生5.6级地震，震源深度10千米。地震造成当地震感强烈，震中距德令哈市区71公里、距都兰县162公里、距乌兰县167公里、距格尔木市172公里，距西宁市463公里。此外，西宁、兰州、格尔木等地网友表示有震感。中国地震局启动四级应急响应。另据地震信息播报机器人，此次震中5公里范围内平均海拔约3070米，距离2026年6月16日在青海海西发生的6.3级地震的震中约119公里。 ​​​","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0d086aa9df","title":"特朗普批美联储利率太高，美联储主席陷两难","url":"https://www.jiemian.com/article/15358305.html","summary":"当地时间11月20日，美国总统特朗普再度批评美联储，称当前利率水平过高，美联储的决策带有“政治属性”。","summary_short":"当地时间11月20日，美国总统特朗普再度批评美联储，称当前利率水平过高，美联储的决策带有“政治属性”。","digest":"当地时间11月20日，美国总统特朗普再度批评美联储，称当前利率水平过高…","points":["当地时间11月20日，美国总统特朗普再度批评美联储，称当前利率水平过高…","不过，他说自己的这一表态并不是在责怪美联储主席凯文·沃什","分析认为，沃什由特朗普提名，如今正陷入现实两难，一方面，特朗普希望压低利率以提振市场…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T18:59:15+08:00","size":1,"keywords":[],"body":"当地时间11月20日，美国总统特朗普再度批评美联储，称当前利率水平过高，美联储的决策带有“政治属性”。不过，他说自己的这一表态并不是在责怪美联储主席凯文·沃什。分析认为，沃什由特朗普提名，如今正陷入现实两难，一方面，特朗普希望压低利率以提振市场、减轻偿债压力；另一方面，通胀维持在高位导致美联储不敢贸然降息，沃什需要在白宫的政治诉求与央行货币政策独立性之间寻找平衡。（央视财经）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6aff61d225","title":"自僱人士1.05萬承租屯門緹岸開放式戶","url":"https://news.tvb.com/tc/1207493-自僱人士105萬承租屯門緹岸開放式戶","summary":"掃管笏半新盤入場門檻親民且會所配套完善，不僅吸引追求生活質素的自僱人士承租，亦為不少趁低入市的業主帶來理想收租回報。利嘉閣地產屯門-V City分行市務經理李日麟表示，該行團隊精英最新促成緹岸 1A 座中層 D 室的二手租務成交個案，單位實用面積約 315 呎，採開放式間隔，外望開揚市景。","summary_short":"掃管笏半新盤入場門檻親民且會所配套完善，不僅吸引追求生活質素的自僱人士承租，亦為不少趁低入市的業主帶來理想收租回報。","digest":"掃管笏半新盤入場門檻親民且會所配套完善，不僅吸引追求生活質素的自僱人士承租…","points":["掃管笏半新盤入場門檻親民且會所配套完善，不僅吸引追求生活質素的自僱人士承租…","利嘉閣地產屯門-V City分行市務經理李日麟表示…","李日麟透露，新租客為自僱人士，一直尋覓環境清幽舒適且會所配套完善的優質居所…"],"section":"財經","category":"地產","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T18:00:00+08:00","size":1,"keywords":["地產"],"body":"掃管笏半新盤入場門檻親民且會所配套完善，不僅吸引追求生活質素的自僱人士承租，亦為不少趁低入市的業主帶來理想收租回報。利嘉閣地產屯門-V City分行市務經理李日麟表示，該行團隊精英最新促成緹岸 1A 座中層 D 室的二手租務成交個案，單位實用面積約 315 呎，採開放式間隔，外望開揚市景。\n\n李日麟透露，新租客為自僱人士，一直尋覓環境清幽舒適且會所配套完善的優質居所，早前經利嘉閣「真盤源」平台獲代理安排參觀上述放盤。租客參觀單位後，極為心儀屋苑住客會所設施豐富且居住環境寧靜宜居，加上單位間隔合用，符合個人工作生活需求，睇樓後感到十分滿意，遂決定以 10,500 元承租上址，折合實用面積呎租約 33.33 元，屬市場合理水平。\n\n據悉，業主於 2025 年以約257.352萬元購入上述單位，持貨僅逾 1 年，現可享高達約 4.9 厘租金回報。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026sUaym3eT2C1795171323.jpg?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c86c802c269","title":"重庆发布86项低空产业发展机会清单 总投资约289亿元","url":"https://www.chinanews.com.cn/cj/2026/11-21/10735787.shtml","summary":"中新网重庆11月21日电 (张旭)11月21日下午，重庆国际人才交流大会·超大城市低空综合治理产业人才发展大会在重庆举行。","summary_short":"中新网重庆11月21日电 (张旭)11月21日下午，重庆国际人才交流大会·超大城市低空综合治理产业人才发展大会在重庆举行…","digest":"11月21日下午…","points":["中新网重庆11月21日电 (张旭)11月21日下午…","该份清单涵盖低空基础设施、低空装备制造、科研创新与人才教育、低空运营服务…","其中包含了起降设施、通信导航监视、数字底座等基础能力建设项目，也包括整机研发制造…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:29:24+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (张旭)11月21日下午，重庆国际人才交流大会·超大城市低空综合治理产业人才发展大会在重庆举行。大会发布低空产业发展机会清单86项，预计总投资约289亿元。\n\n　　据了解，该份清单涵盖低空基础设施、低空装备制造、科研创新与人才教育、低空运营服务、检验检测与运行保障5个类别。其中包含了起降设施、通信导航监视、数字底座等基础能力建设项目，也包括整机研发制造、关键零部件、智能载荷等产业项目。\n\n图为大会现场。张旭 摄\n\n　　大会同步推出城市治理、巡检应急、低空物流、文旅消费等特色应用场景，清晰展现低空产业由单一装备制造向设施建设、技术服务、场景运营和安全保障协同延伸的发展态势。\n\n　　大会还促成8个项目达成合作，总投资约17.9亿元，涉及产业投资、校地合作、平台建设、应用场景、产学研合作等领域。相关合作协议，将打通低空治理需求、高校科研资源、企业技术优势与区县产业基础，为技术成果实景验证、产业项目加速落地搭建对接通道。\n\n图为项目签约现场。张旭 摄\n\n　　大会同步发布产业人才需求清单，覆盖技术研发、系统集成、飞行运维、装备制造等9个类别，直观体现低空产业对跨学科复合型人才的旺盛需求。大会同步举行人才签约仪式，共引进人才46名，用人单位覆盖政府、企业、高校、科研院所等各类主体。\n\n　　近年来，重庆围绕低空空域管理改革持续探索，形成一批阶段性成果。该市低空智管平台同步打通军航、民航、无人机监管三条核心数据链路，企业通过“渝快办”一次申报，空域使用批复时限压缩80%，用户平均跑动次数大幅缩短，实现从“跑多次”到“一次办”。\n\n　　本次大会由重庆市国防科技工业办公室主办。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca91b3d5199","title":"山頂御峯複式戶約1.36億沽 每呎高見5.83萬","url":"https://www.stheadline.com/property-new/3639640/山頂御峯複式戶約136億沽-每呎高見583萬","summary":"恒隆發展的山頂司徒拔道超級豪宅項目御峯錄得一宗新成交，單位為33樓A室複式大宅，面積約2,337方呎，以約1.36億元售出，呎價約58,300元。","summary_short":"恒隆發展的山頂司徒拔道超級豪宅項目御峯錄得一宗新成交，單位為33樓A室複式大宅，面積約2,337方呎…","digest":"恒隆發展的山頂司徒拔道超級豪宅項目御峯錄得一宗新成交，單位為33樓A室複式大宅…","points":["恒隆發展的山頂司徒拔道超級豪宅項目御峯錄得一宗新成交，單位為33樓A室複式大宅，面積約2…","是次售出大宅位於項目「宸峯」樓層， \n\n受今年夏季台风、秋冬季大西洋飓风等极端天气影响，航线整体时效未能达成最初20天直达的目标，整体航行出现阶段性延误，超出企业前期预判。\n\n不过依托口岸、港口体系的专项保障，航线尽可能对冲了外部风险。今年华东口岸遭遇多轮台风，普遍出现船舶、货物积压拥堵，中欧北极快航则实现全国合作港口零等待直靠，大幅节约周转时间与物流成本，也保障了全年8个航次顺利落地。\n\n李晓斌称，没有相关部门的支持，公司今年可能完成不了8个航班的目标。\n\n作为航线核心始发港，宁波舟山港穿山港区承担着冰上丝绸之路北向通道的试点重任。\n\n宁波舟山港相关人士告诉界面新闻，港口紧邻长三角锂电、储能、光伏、新能源整车产业集群，腹地货源结构与北极航线高附加值、热敏货（需在特定温度区间内运输和储存的货物）运输需求高度契合。\n\n针对“新三样”货物，宁波港划定了封闭危化专属堆场，和普通集装箱、热源区域拉开安全隔离距离。同时，港口的吊机、集卡配套特种箱作业方案，制定了储能柜专项装卸标准作业程序。\n\n宁波港还依托海铁联运网络，把内陆货源和北极快航通道打通，打造“海铁快线+国际快航”的“双快”物流模式。\n\n以今年中欧北极快航的“海杰连云港”轮次为例，一家合肥货主的逆变器在工厂完成装箱，直接搭乘“合肥北-宁波舟山港”海铁联运精品班列抵达穿山港站，货物“不换箱”无缝衔接“中欧北极快航”，将中国内陆到欧洲之间的货物在途时长缩短了15天左右。\n\n中欧北极快航，图片来自海杰航运\r\n\n上述宁波港人士表示，航线常态化运营，进一步优化了浙江外贸开放格局。作为全省外贸增长核心动能，“新三样”得以借助北向新通道快速抢占欧洲市场，同时带动舟山极地船舶补给、LNG加注、国际航运服务等配套产业发展。\n\n值得关注的是，虽然北极快航常态化运行，但季节性通航短板、运力不足等瓶颈仍在。受北极冰情限制，航线仅夏季具备通航窗口，无法满足企业全年稳定出货需求，多数外贸企业仅能将其作为备选通道。\n\n来自北极快航客户端的反馈，也证实了上述问题，他们对中欧北极快航的时效和安全性较为满意，但希望航线能更稳定、运营时间更长。\n\n为突破现有瓶颈，海杰航运已明确下一步升级规划。\n\n李晓斌称，公司明年将引入大型冰区加强级船舶，升级船队硬件能力；同步搭建完善的气象预报、智能导航、航线优化综合服务体系，精简沿途挂靠港口，打造点对点直达快航，极致压缩运输时长。货源品类上，未来将逐步拓展机械设备、精密仪器、合规危险品等多元货类，打开增量空间。\n\n一位行业人士建议，航线还将重点培育欧洲返程货源，吸纳欧洲高端化工品、再生材料、精密设备返程回国，破解单向货流难题，提升航线整体经济性。\n\n李晓斌表示，中欧北极快航属于全新赛道，通航标准、监管细则、应急体系仍处于摸索阶段，需要多部门、多领域协同完善。\n\n在他看来，当前中欧贸易体量庞大且持续迭代，每年涌现大量新增外贸客户，北极快航的市场渗透率仍有巨大提升空间。“随着运力升级、周期拉长、双向通道打通，这条北向新航道，有望成为中国新能源出海、中欧高端贸易往来的新增长极。”李晓斌称。\n\n未经正式授权严禁转载本文，侵权必究。长三角商业地理港口 航运业\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n【出海头条】北极快航第二季收官，中欧经贸新通道如何跑得更稳？\n\n今年北极快航共运行8个航次，合作客户数量上升至接近700家，总货值达53.3亿元。\n\n原创新闻杨冰柯 · 2026/11/21 16:54来源：界面新闻\n\n中欧北极快航，图片来自海杰航运\n\n界面新闻记者 | 杨冰柯\n界面新闻编辑 | 庄键\n\n两艘由液化天然气（LNG）为动力的船舶“海杰连云港”和“海杰民都鲁”满载货物，相继在近日抵达欧洲港口。海杰航运运营的中欧北极快航由此完成了今年全年的航行计划。\n\n由海杰航运运营的中欧北极快航在2025年完成首航。相较于传统海运和中欧班列，北极快航的核心优势在于快速通行、高效交付。海杰航运于2022年在上海设立总部，深耕远东与新兴市场集装箱贸易，是国内唯一运营中欧北极快航的企业。\n\n海杰航运首席运营官李晓斌向界面新闻介绍称，“去年大部分客户还处于观望试水状态，今年市场主动性明显提升，后续多个航次基本是企业主动上门询价订舱，甚至出现一舱难求的情况。”\n\n2026年8月15日，“迪拜塔”号从 e/15358195.html","summary":"11月20日，国家数据局局长刘烈宏出席在湖南长沙举办的2026世界计算大会开幕式并致辞。","summary_short":"11月20日，国家数据局局长刘烈宏出席在湖南长沙举办的2026世界计算大会开幕式并致辞。","digest":"国家数据局：积极拓展词元服务应用场景，健全词元计量计费、质量测评等标准规范","points":["11月20日，国家数据局局长刘烈宏出席在湖南长沙举办的2026世界计算大会开幕式并致辞","刘烈宏表示，词元打通了算力、模型、数据间的价值传导链路…","一是词元发展初步起势，围绕词元生产、流通、消费的产业生态正加速构建，拓展了经济增长新空间"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T16:46:56+08:00","size":1,"keywords":[],"body":"11月20日，国家数据局局长刘烈宏出席在湖南长沙举办的2026世界计算大会开幕式并致辞。刘烈宏表示，词元打通了算力、模型、数据间的价值传导链路，成为数智经济的价值锚点和数据价值的显性化载体。一是词元发展初步起势，围绕词元生产、流通、消费的产业生态正加速构建，拓展了经济增长新空间。二是“词元工厂”快速兴起，将算力租赁、模型供给、数据能力升级为词元生产服务，成为产业组织新形态。三是词元催生服务交付新模式，行业高质量数据集经模型训练推理转化为可计量、可交付的智能服务，形成以词元计量、按调用计价的交付方式，为数据要素价值释放提供新路径。下一步，国家数据局将积极拓展词元服务应用场景，健全词元计量计费、质量测评等标准规范，引导行业规范发展，坚决避免低质量重复建设，加快构建以数据为关键要素的数字经济。","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"生活","total":37,"items":[{"id":"c024cfbaae0","title":"香港公開羽毛球錦標賽·混雙｜蔣魏配今年第三次與「鳳凰」會師決賽 近兩屆冠軍對決爭勝 黃東萍/馮彥哲望二連霸","url":"https://www.stheadline.com/realtime-sport/3639679/香港公開羽毛球錦標賽混雙蔣魏配今年第三次與鳳凰會師決賽-近兩屆冠軍對決爭勝-黃東萍馮彥哲望二連霸","summary":"週六（21日）國家隊混雙代表會師決賽。","summary_short":"週六（21日）國家隊混雙代表會師決賽。","digest":"週六國家隊混雙代表會師決賽","points":["週六（21日）國家隊混雙代表會師決賽","「鳳凰」組合馮彥哲/黃東萍和「蔣魏配」蔣振邦/魏雅欣分別直落兩局取勝，晉級決賽","前者淘汰大馬夫妻檔吳塤閥/賴潔敏，後者速勝來自印尼的Dejan FERDINANSYAH /…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T20:35:27+08:00","size":2,"keywords":[],"body":"週六（21日）國家隊混雙代表會師決賽。「鳳凰」組合馮彥哲/黃東萍和「蔣魏配」蔣振邦/魏雅欣分別直落兩局取勝，晉級決賽。前者淘汰大馬夫妻檔吳塤閥/賴潔敏，後者速勝來自印尼的Dejan FERDINANSYAH / Felisha Alberta Nathaniel PASARIBU。這是兩個國家隊組合今年第三次會師決賽。同時，「鳳凰」是上屆冠軍，今屆力爭衛冕；「蔣魏配」則曾在2024年香港站奪冠，當時正是戰勝了馮彥哲/黃東萍奪得冠軍。這兩對亦敵亦友的組合將再爭高下。\n「鳳凰」先入決賽等隊友匯合\n週六上午先是「鳳凰」以21:17、21:18淘汰大馬組合晉級。雖是直落兩局取勝，但今場比賽面對世界排名第12位的吳塤閥/賴潔敏，作為「世一」的馮彥哲/黃東萍贏得不算輕鬆，東萍賽後坦言：「我們雙方其實對彼此的技戰術、技術特點都很熟悉，對方今場比賽在限制和反限制上給我們製造了很多困難，因為對方也是非常有經驗的選手，能在現場視情況做出很多臨場的變化。」\n馮彥哲總結：「現在大家的比賽節奏都非常快，場上瞬息萬變，所以沒有好打的對手，還是希望和隊友會師決賽。這樣冠軍能讓中國隊來獲得。」\n「蔣魏配」有望背靠背三站奪冠\n而下午的「蔣魏配」則速度取勝回應隊友對會師決賽的期盼，耗時31分鐘，以兩局21:13拍走印尼組合Dejan FERDINANSYAH / Felisha Alberta Nathaniel PASARIBU。蔣振邦/魏雅欣連續三站賽事打進決賽，過去半個月，他們先後在韓國公開賽和熊本大師賽奪冠，加上香港站，他們已背靠背三站超級500級別賽事打進決賽，盡顯統治力。若香港站再奪冠，則將會創下500級三連霸。\n\n賽後，談到三入決賽的壯舉，蔣振邦謙虛地表示：「我們8強的對手退賽了，所以我們多了一天休息時間，但休息過後，今天開賽階段我們沒有好好地提起狀態。」魏雅欣則補充：「我認為這段時間我們整體表現還不錯，不是每一場都會出現問題，但當有問題的時候，我們能盡快地去調整還挺好的。」\n\n記者：爾郡耀","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"香港公開羽毛球錦標賽·混雙｜蔣魏配今年第三次與「鳳凰」會師決賽 近兩屆冠軍對決爭勝 黃東萍/馮彥哲望二連霸","url":"https://www.stheadline.com/realtime-sport/3639679/香港公開羽毛球錦標賽混雙蔣魏配今年第三次與鳳凰會師決賽-近兩屆冠軍對決爭勝-黃東萍馮彥哲望二連霸","source_display":"星島頭條","published_at":"2026-11-21T20:35:27+08:00","category":"生活","digest":"週六國家隊混雙代表會師決賽"},{"title":"香港公開羽毛球錦標賽·女單｜王祉怡兩局挫宮崎友花再度殺入香港站決賽 離衛冕只差一步 以賽代練為年終總決賽作準備","url":"https://www.stheadline.com/realtime-sport/3639664/香港公開羽毛球錦標賽女單王祉怡兩局挫宮崎友花再度殺入香港站決賽-離衛冕只差一步-以賽代練為年終總決賽作準備","source_display":"星島頭條","published_at":"2026-11-21T19:10:18+08:00","category":"生活","digest":"週六香港公開羽毛球錦標賽女單4強，國家隊女單一姐王祉怡直落兩局淘汰宮崎友花…"}],"cross":{"total":2,"angles":[{"point":"週六國家隊混雙代表會師決賽","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639679/香港公開羽毛球錦標賽混雙蔣魏配今年第三次與鳳凰會師決賽-近兩屆冠軍對決爭勝-黃東萍馮彥哲望二連霸"},{"point":"週六香港公開羽毛球錦標賽女單4強，國家隊女單一姐王祉怡直落兩局淘汰宮崎友花…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639664/香港公開羽毛球錦標賽女單王祉怡兩局挫宮崎友花再度殺入香港站決賽-離衛冕只差一步-以賽代練為年終總決賽作準備"}]}},{"id":"c69e307746b","title":"方力申抗寒挑戰35公里港澳慈善游 僅花08:37:24完成目標","url":"https://www.stheadline.com/film-drama/3639578/方力申抗寒挑戰35公里港澳慈善游-僅花083724完成目標","summary":"前香港奧運泳手方力申（Alex）今日（21日）再次挑戰極限，由凝動香港體育基金主辦的慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」今晨正式啟航。","summary_short":"前香港奧運泳手方力申（Alex）今日（21日）再次挑戰極限，由凝動香港體育基金主辦的慈善挑戰「凝動全城 破浪傳承：方力申…","digest":"前香港奧運泳手方力申再次挑戰極限…","points":["前香港奧運泳手方力申（Alex）今日（21日）再次挑戰極限…","方力申為支持基層及特殊教育需要（SEN）兒童的體育培訓…","而方力申在中午時分，已籌得逾600萬"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:31:53+08:00","size":2,"keywords":[],"body":"前香港奧運泳手方力申（Alex）今日（21日）再次挑戰極限，由凝動香港體育基金主辦的慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」今晨正式啟航。方力申為支持基層及特殊教育需要（SEN）兒童的體育培訓，於今晨8時53分在親友的熱烈歡呼聲中，於大嶼山雞翼角孤身躍入海中，挑戰長達35公里的港澳公海橫渡，誓要刷新港澳最快橫渡紀錄，並向著總籌款目標1,000萬元全力衝刺。而方力申在中午時分，已籌得逾600萬。直到現時下午4時25分，方力申已完成29公里。\n方力申獲親友打氣\n46歲的方力申近年兼顧游泳學校生意，兼照顧女兒Isla，昨日（20日）又開心宣布太太正陀第二胎，湊夠一個「好」字。方力申今早抵達現場，見到太太葉萱（Maple）及親友現身打氣外，同時身兼凝動董事會主席弟弟方圓明，更登上隨行工作船，全程在海上為哥哥守候。\n方力申獲妻女整早餐\n方力申出發前，表示今早已身獲妻女炮製愛心早餐。面對35公里的挑戰，方力申受訪時表示經過幾個月的訓練，雖然極度艱辛，但會咬緊牙關撐過去：「35公里的海況完全是未知數，過程肯定會非常辛苦，但我同自己講一定要咬緊牙關頂過去。因為我知道，對岸有我嘅家人、有我嘅女兒Isla，還有很多需要資源嘅小朋友等住我登岸。」\n相關閱讀：方力申宣布太太再度懷孕 兩年抱兩湊夠個「好」字 打破終極外父相激動狂呼：真係仔呀\n相關閱讀：方力申爸爸缺血性中風右半身癱瘓 醫藥費高達幾十萬 發病前現三個先兆\n方力申禁穿防寒衣、不准扶船休息\n主辦單位透露方力申是次橫渡規則極為嚴苛，在整個35公里的過程中，不但不准上船或扶著任何物件休息，更被禁止穿著潛水衣、防寒衣或使用任何助浮裝備。方力申必須單憑一條泳褲、泳帽和泳鏡，橫跨香港、內地珠江口及澳門三個水域。除了要頂著湍急的深海暗流，更要時刻避開繁忙的大船航道，對方力申的體能、意志力以及抗寒能力都是極大考驗。\n方力申晚上出席慈善音樂會\n方力申完成深海橫渡後，今日傍晚將無縫接力，現身由其一手發起的「《浪接．浪》港澳群星慈善音樂會」。而今晚的音樂會陣容星光熠熠，包括胡定欣、側田、江若琳、林盛斌（Bob）、劉浩龍、小肥、陳慧敏外，更有尹光、古淖文、Kiri T、Gordon Flanders及樂隊DAZE IN WHITE等港澳兩地歌手參與。\n相關閱讀：方力申自豪女兒Isla將來係Party Girl 坦言：呢啲一定唔係遺傳我 網民讚節奏感強具音樂天分","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"方力申抗寒挑戰35公里港澳慈善游 僅花08:37:24完成目標","url":"https://www.stheadline.com/film-drama/3639578/方力申抗寒挑戰35公里港澳慈善游-僅花083724完成目標","source_display":"星島頭條","published_at":"2026-11-21T17:31:53+08:00","category":"生活","digest":"前香港奧運泳手方力申再次挑戰極限…"},{"title":"方力申抗寒挑戰35公里港澳慈善游未到半程籌逾600萬 女兒Isla成最強心靈支柱","url":"https://www.stheadline.com/film-drama/3639578/方力申抗寒挑戰35公里港澳慈善游未到半程籌逾600萬-女兒Isla成最強心靈支柱","source_display":"星島頭條","published_at":"2026-11-21T14:04:54+08:00","category":"生活","digest":"前香港奧運泳手方力申再次挑戰極限…"}]},{"id":"c9062969271","title":"舞剧《红山》让5000余年史前文明“活”起来","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735879.shtml","summary":"中新网沈阳11月21日电 (记者 李晛 )21日晚，原创民族舞剧《红山》在沈阳展演。","summary_short":"中新网沈阳11月21日电 (记者 李晛 )21日晚，原创民族舞剧《红山》在沈阳展演。","digest":"21日晚，原创民族舞剧《红山》在沈阳展演","points":["中新网沈阳11月21日电 (记者 李晛 )21日晚，原创民族舞剧《红山》在沈阳展演","灯光亮起处，5000多年前的红山文明，踏着舞步与当代观众相逢","辽宁朝阳牛河梁遗址是它最具代表性的遗存，距今约5800年至5200年"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:36:58+08:00","size":1,"keywords":[],"body":"中新网沈阳11月21日电 (记者 李晛 )21日晚，原创民族舞剧《红山》在沈阳展演。灯光亮起处，5000多年前的红山文明，踏着舞步与当代观众相逢。\n\n　　红山文化发源于西辽河流域，是中华文明起源阶段的重要文化之一。辽宁朝阳牛河梁遗址是它最具代表性的遗存，距今约5800年至5200年。舞剧《红山》以牛河梁遗址为创作原点，通过“玉碎”“求援”“祈雨”“洪殇”四个篇章，叙写先民寻玉守土、琢玉兴邦的史诗。\n\n11月21日晚，原创民族舞剧《红山》在沈阳展演。李晛 摄\n\n　　该剧为国家艺术基金2026年度大型舞台剧和作品创作资助项目，同时获批辽宁省文艺精品创作生产专项资金扶持项目，亦是沈阳音乐学院“双一流”建设重点项目。自2025年首演以来，先后赴多地巡演，收获广泛好评。11月21日至22日在沈阳连演两场，剧目在舞蹈语汇、舞台光影、配乐节奏上进一步精修提升，叙事层次更细腻。\n\n　　演出现场，图腾流转，衣袂飞扬，舞者肢体舒展起伏，把先民对天地的敬畏、对玉石的求索、部族之间守望相助的深情娓娓道来，遥远晦涩的史前文明变得可感可触。\n\n　　如何让沉睡的文物化为舞台上流动的叙事？舞剧《红山》总导演王海峰说，主创团队没有简单复刻文物外形，而是从“玉人”“玉猪龙”等文物造型中“抠”动作，提炼出“屈肘擎物”“趋步拜祭”等核心语汇，把坛、庙、冢的空间关系转化为舞台调度，让文物在舞者的身体上“活”过来。\n\n11月21日晚，原创民族舞剧《红山》在沈阳展演。李晛 摄\n\n　　“舞剧《红山》更像一场文明的当代转译。”王海峰表示，希望借由舞蹈，让观众读懂“南良渚、北红山”背后，中华文明多元一体的深厚底色。\n\n　　“没有台词，我却看懂了。”来自马来西亚的在辽留学生林凯轩说，艺术是无国界的语言，玉猪龙、祭天礼俗等独特文化符号极具东方特色，这场演出让他真正触摸到了中华史前文明的温度。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c59c086bfd6","title":"LCSD公開劍擊錦標賽｜女佩一周前創歷史奪世界盃團體銅牌 大師姐歐倩瑩寫包單：不是『僅此一次」 睇好師妹有力爭奧運資格","url":"https://www.stheadline.com/realtime-sport/3639678/LCSD公開劍擊錦標賽女佩一周前創歷史奪世界盃團體銅牌-大師姐歐倩瑩寫包單不是僅此一次-睇好師妹有力爭奧運資格","summary":"香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌，大師姐兼助教歐倩瑩周六以玩票性質參加康文署LCSD公開劍擊錦標賽，她表示替團隊開心，有信心師妹們不是「一次性」的成績，預告會繼續創造歷史…","summary_short":"香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌，大師姐兼助教歐倩瑩周六以玩票性質參加康文署LCSD公開劍擊錦標賽…","digest":"香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌…","points":["香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌…","LCSD公開劍擊錦標賽周六一連兩天在體院劍擊訓練場舉行，首天進行了女花及女佩個人賽…","開羅站世界盃的的突破（包括16強擊敗「世二」兼應屆世界冠軍匈牙利）…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T20:33:36+08:00","size":1,"keywords":[],"body":"香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌，大師姐兼助教歐倩瑩周六以玩票性質參加康文署LCSD公開劍擊錦標賽，她表示替團隊開心，有信心師妹們不是「一次性」的成績，預告會繼續創造歷史，明年四月展開的洛杉磯奧運周期，她有信心師妹們有力爭取奧運參賽資格。\nLCSD公開劍擊錦標賽周六一連兩天在體院劍擊訓練場舉行，首天進行了女花及女佩個人賽，去年失落香港主辦的全運會後開始一半退居「幕後」，以自身的大賽經驗協助師妹們成長，包括在今次LCSD的比賽，她給自己的目標是至少入到八強，她做到了（八強以12:15負梁洛文），她說：「其實我現在在女佩隊的任務，是提高難度給她們，好似在這個比賽，她們理應贏我的。」\n本月中歷史性贏得世界盃女佩團體銅牌的功臣（包括薛雅齊（Summer Fay)、劉綺程、曾悅澄及朱詠翹）已全數返港，除了Fay 因手肘傷缺席外，其餘全數參加周六LCSD的比賽。\n對於明年四月展開的洛奧計分周期，歐倩瑩表示：「南韓籍教練（李旭宰，曾帶領南韓男佩奪2012倫敦奧運團體金牌）三年前開始執教我們時，他已定下目標，就是要衝洛奧的參賽資格，除了現有的出戰成人組的隊員外，年青的還有不少具潛質的，我覺得是有機會衝奧的。」\n開羅站世界盃的的突破（包括16強擊敗「世二」兼應屆世界冠軍匈牙利），隊中四位成員都是都是18至25歲的年輕代表，歐倩瑩表示這是十分健康的接軌，証明女佩的青少年班底也是高水平。\n三位世界盃創歷史的女佩劍手劉綺程、曾悅澄及列後備的朱詠翹也表示這面團體銅牌給予他們好大信心，至少現在敢去想爭取奧運資格，他們不約而同表示：「這面世界盃獎牌給予我們好大信心，之前一直都覺得我們可以贏到，但總是爭幾分，現在真是贏到一些高水平的隊伍，增強信心，知道我們也可以做到，現在距離奧運積分周期還有幾個月，希望將勢頭一直保持下去，奧運名額一定有希望的。」\n比賽方面，應屆亞洲U23冠軍薛雅致在決賽以15:12險勝劉綺程，朱詠翹及年僅18歲的曾悅澄分別16強止步，後者以15:11不敵世界盃銅牌隊友劉綺程。\n薛雅致首奪LCSD女佩冠軍\n女佩冠軍由應屆亞洲U23女佩個人賽金牌得主薛雅致（Jane）首奪LCSD冠軍，賽後激動大叫，亦忍不住開心的眼淚，她認為唯一美中不足是在體院進行今站比賽，不設觀眾入場，父母及家姐薛雅齊沒法到場看她奪冠，但開心繼本賽衛冕的家姐守住冠軍位置。\n女子花劍冠軍由大師姐鄭曉為（左二）奪得。徐嘉華攝\n鄭曉為在比賽中大腿後肌抽筋.\n女花大師姐鄭曉為頂住大腿後肌抽筋及發燒奪冠\n女子花劍方面，大師姐鄭曉為頂住發燒及途中出現大腿後肌抽筋，在決賽落後下以15:10反勝師妹黃諾頤。曉為賽後表示開心見到自己的「堅持」及「贏到自己」：「剛在保加利亞回來香港只有幾天，身體不是好舒服，在比賽途中（四入二時）在落後下曾想過放棄，但提醒自己要集中去打，於是頂下去，我開心不是個獎，而是自己的堅持及『贏到自己』。」雙季軍是吳佳蔚及樊寶懿。\n記者/攝影：徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca544375ee9","title":"“CMG电影文化嘉年华·成都专场”启动 聚焦“电影+”经济消费新业态","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735877.shtml","summary":"中新网成都11月21日电 20日在成都启动的“CMG电影文化嘉年华”活动，围绕“电影+”创新设计，推出以“金秋电影季”为主题的系列活动，充分聚焦“电影+”经济消费新业态。","summary_short":"中新网成都11月21日电 20日在成都启动的“CMG电影文化嘉年华”活动，围绕“电影+”创新设计…","digest":"20日在成都启动的“CMG电影文化嘉年华”活动，围绕“电影+”创新设计…","points":["中新网成都11月21日电 20日在成都启动的“CMG电影文化嘉年华”活动…","他们分享从业感悟，认为影视创作当以精品为标尺，讲好中国故事重在直抵人心…","该活动通过在社区、学校、商圈、工业遗址地等多场景搭建流动影院，为市民免费放映经典影片…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:32:46+08:00","size":1,"keywords":[],"body":"中新网成都11月21日电 20日在成都启动的“CMG电影文化嘉年华”活动，围绕“电影+”创新设计，推出以“金秋电影季”为主题的系列活动，充分聚焦“电影+”经济消费新业态。\n\n活动开幕现场。　主办方供图\n\n　　活动现场，演员赵雅芝、魏翔、邓嘉(邓家佳)获聘“电影文化推广大使”。他们分享从业感悟，认为影视创作当以精品为标尺，讲好中国故事重在直抵人心，唯有用心打磨贴近生活的角色，方能传递中国人独有的精神情怀。两部电影新片《二手球星》《循环街区》同场推介。\n\n　　“CMG电影文化嘉年华·成都专场”三个分会场同步开启。郫都区的光影文化市集、高新区的动画电影产业孵化宣介会、成华区的露天电影院，把三千年蜀地变成可逛的市集、可展示的平台、可珍藏的非遗、可体验的电影科技。\n\n　　“电影文化嘉年华——公益放映进基层”活动同日启动。该活动通过在社区、学校、商圈、工业遗址地等多场景搭建流动影院，为市民免费放映经典影片，打通电影文化公共服务进基层的“最后一公里”。\n\n　　多个“电影+”融合发展成果在活动现场发布。中广影视卫星有限责任公司与成都传媒产业集团签署合作协议，双方将在成都打造电影IP潮玩中心，激活电影IP价值，壮大数字文创产业。同日成立的数字影视产业联盟(成都)，发布首批11家成员单位，该联盟将充分利用AIGC、虚拟制片、超高清等前沿技术，持续拓宽影视创作边界，集聚行业合力、共建数字影视创新沃土。\n\n活动现场。　主办方供图\n\n　　成都是全国首批“电影+”消费综合试点城市。新明电影院打造电影轻博物馆，糖画、蜀绣等非遗在光影中焕发新生；奎星楼街旧教室改造成电影主题餐厅，让“边看电影边吃火锅”成为消费新时尚；王府井电影城银幕内外皆课堂，影院成为孩子假期的研学基地。\n\n　　活动由国家电影局指导、中央广播电视总台与成都市人民政府联合主办。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c67fdb6d337","title":"姚兵自揭生活艱難零家用 曾靠老婆貼錢追夢感謝不離不棄 因一舉動得罪主持痛失機會","url":"https://www.stheadline.com/film-drama/3639633/姚兵自揭生活艱難零家用-曾靠老婆貼錢追夢感謝不離不棄-因一舉動得罪主持痛失機會","summary":"TVB節目《中年好聲音4》的「白羊君」姚兵，近日接受YouTube頻道《橙色大笨象 Orange Elephant》訪問，大談追逐演藝夢的艱辛，姚兵更提到太太從拍拖到結婚，多年來不離不棄支持他追夢…","summary_short":"TVB節目《中年好聲音4》的「白羊君」姚兵，近日接受YouTube頻道《橙色大笨象 Orange Elephant》訪問…","digest":"TVB節目《中年好聲音4》的「白羊君」姚兵…","points":["TVB節目《中年好聲音4》的「白羊君」姚兵，近日接受YouTube頻道《橙色大笨象 Oran…","姚兵在訪問中，提到自己已婚：「呢幾年我係好多謝、好多謝我太太","其實我想講俾所有男人聽嘅一件事，呢個就係，做一個乖男人呢…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T20:30:35+08:00","size":1,"keywords":[],"body":"TVB節目《中年好聲音4》的「白羊君」姚兵，近日接受YouTube頻道《橙色大笨象 Orange Elephant》訪問，大談追逐演藝夢的艱辛，姚兵更提到太太從拍拖到結婚，多年來不離不棄支持他追夢，甚至花儲蓄及補貼姚兵，成為其經濟支柱。\n姚兵獲太太支持追夢\n姚兵在訪問中，提到自己已婚：「呢幾年我係好多謝、好多謝我太太。其實我想講俾所有男人聽嘅一件事，呢個就係，做一個乖男人呢，其實千祈唔好太多出面嘅迎合（應酬）呢樣嘢。」姚兵自爆有一段時間，由於生活艱難，不但沒有給予家用，更要太太作為經濟支柱：「其實呢幾年係搵唔到咩錢㗎啦。老婆係一路幫我儲、支持呢啲錢係儲返落嚟。其實呢幾年我係，我（俾）屋企一毫子都無拎返去。佢都係每個月，俾錢我使，呢個就係最好嘅支持啦！」姚兵稱自己好實際，不會只用言語感謝太太：「呢啲嘢全部都係好虛華（浮誇）嘅呢啲嘢嚟㗎。但係依家呢個係最實際嘅，同埋依家都係一路支持緊我。」\n相關閱讀：中年好聲音4丨蒙面歌手全揭曉 「貓女郎」劉佩玥揮別猙獰表情獻唱 「白羊君」姚兵爆笑認瀟灑\n姚兵學唱歌被學校走數\n姚兵早在17、18歲時已涉足社會，卻因從小熱愛唱歌，想提升歌藝而受騙：「係我兩年嘅人工就全部俾晒呢個學校，咁跟住落嚟呢個學校就突然之間搬咗，其實係呃人嘅。嗰時我哋通信都唔係好、好發達啦，全部都係睇報紙㗎嘛。打小廣告，就係。我就睇咗呢個廣告：『啊，北京呢啲學校』﹛嗰時已經係知自己識唱歌㗎啦。我就是想搵一個地方提升、提升下一自己嘅呢啲唱歌水平。嗰個打擊係好大嘅，20歲都未到，好似人人、人生就……就謝咗，成個人就謝咗啦。」\n姚兵曾年少輕狂得罪人\n姚兵後來到寧波電視台參加歌唱比賽，在當地漸漸建立起名氣，卻因年少輕狂，不懂收斂情緒，而得罪節目主持。當時有位主持在台下拍打姚兵的頭，讚賞他唱得不錯。姚兵卻面露不悅：「我啱啱就做好頭、頭髮嘛，我有髮型㗎嘛，佢咁樣做，就整到我好烏糟邋遢。咁我就話：『我說，你幹嘛呀？你這個手腳能不能稍微這個乾淨一點？』」卻因此得罪對方，而失去亮相機會。經一事長一智，姚兵學
