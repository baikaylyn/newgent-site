模应用”迈出关键一步。","summary_short":"中新社重庆11月21日电 (记者 钟旖)国家人工智能应用中试基地(人力资源领域人力资源服务方向)21日在重庆揭牌…","digest":"国家人工智能应用中试基地(人力资源领域人力资源服务方向)21日在重庆揭牌…","points":["中新社重庆11月21日电 (记者 钟旖)国家人工智能应用中试基地(人力资源领域人力资源服务方…","据介绍，基地总体目标为建设全国现代化人力资源效能中心、全国人力资源服务产业孵化中心…","目前，基地已启动人力资源智算中心建设，建成5个行业高质量数据集…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T16:37:15+08:00","size":2,"keywords":[],"body":"中新社重庆11月21日电 (记者 钟旖)国家人工智能应用中试基地(人力资源领域人力资源服务方向)21日在重庆揭牌，标志着行业人工智能应用从“技术突破”向“规模应用”迈出关键一步。\n\n　　据介绍，基地总体目标为建设全国现代化人力资源效能中心、全国人力资源服务产业孵化中心、全国人工智能赋能人力资源服务产业高地，旨在通过“技术研发—场景验证—成果转化”的全周期赋能，打通人力资源服务业AI落地的“最后一公里”。\n\n11月21日，国家人工智能应用中试基地(人力资源领域人力资源服务方向)在重庆揭牌。中新社记者 何蓬磊 摄\n\n　　目前，基地已启动人力资源智算中心建设，建成5个行业高质量数据集，在全国先行探索人社领域公共数据授权运营工作；聚焦智能网联新能源汽车行业、人力资源市场监管、人岗精准匹配、人才测评等重点产业及民生实事，先行先试打造了4大先导智能体。\n\n　　当天，“人力资源人工智能科创中心”同步揭牌。该中心由上述基地联合重庆通用人工智能研究院、重庆人工智能学院共建，目前正聚焦“人力资源知识演化大模型体系、人机协同组织智能体架构”等关键技术开展攻关，推进成果转化和复合型人才培养。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"人力资源服务方向国家人工智能应用中试基地在重庆揭牌","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735757.shtml","source_display":"中國新聞網","published_at":"2026-11-21T16:37:15+08:00","category":"內地","digest":"国家人工智能应用中试基地(人力资源领域人力资源服务方向)21日在重庆揭牌…"},{"title":"人力资源服务方向国家人工智能应用中试基地在渝揭牌","url":"https://www.jiemian.com/article/15358008.html","source_display":"界面新聞","published_at":"2026-11-21T14:31:49+08:00","category":"","digest":"在11月21日举行的重庆国际人才交流大会开幕式上…"}],"cross":{"total":2,"angles":[{"point":"在11月21日举行的重庆国际人才交流大会开幕式上…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15358008.html"},{"point":"国家人工智能应用中试基地(人力资源领域人力资源服务方向)21日在重庆揭牌…","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-21/10735757.shtml"}]}},{"id":"c9e59ce7c74","title":"侨商牵线促成足坛巨星IP落地上海 南京东路添体育文化打卡新地标","url":"https://www.chinanews.com.cn/hr/2026/11-21/10735931.shtml","summary":"中新网上海11月21日电(范宇斌)21日，全球最高C罗巨型雕像揭幕暨CR7 MUSEUM(C罗博物馆)上海馆开幕活动在上海南京东路第一百货商业中心举行。","summary_short":"中新网上海11月21日电(范宇斌)21日，全球最高C罗巨型雕像揭幕暨CR7 MUSEUM(C罗博物馆)上海馆开幕活动在上…","digest":"侨商牵线促成足坛巨星IP落地上海 南京东路添体育文化打卡新地标","points":["中新网上海11月21日电(范宇斌)21日，全球最高C罗巨型雕像揭幕暨CR7 MUSEUM(C…","该项目在中国侨商联合会荣誉副会长、上海市侨商联合会顾问王琳达推动及多方支持下成功落地…","当日，上海市侨联组织侨界体育文化领域代表到场参加揭幕、观展，并围绕发挥侨界资源优势…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T22:32:30+08:00","size":1,"keywords":[],"body":"中新网上海11月21日电(范宇斌)21日，全球最高C罗巨型雕像揭幕暨CR7 MUSEUM(C罗博物馆)上海馆开幕活动在上海南京东路第一百货商业中心举行。\n\n　　该项目在中国侨商联合会荣誉副会长、上海市侨商联合会顾问王琳达推动及多方支持下成功落地，侨力搭桥，把国际足球传奇IP引入上海核心商圈，打造全新世界级体育文化地标。\n\n　　当日，上海市侨联组织侨界体育文化领域代表到场参加揭幕、观展，并围绕发挥侨界资源优势，推动中外体育文化交流开展研讨。\n\n活动现场。　上海市侨联供图\n\n　　本次亮相的C罗全身雕像高7米，还原其标志性庆祝动作，定格“巅峰之上，超越自我”的精神内核。雕塑以极具辨识度的赛场姿态，诠释勇于突破、永不言弃、追求卓越的体育精神，传递追逐梦想、持续进取的感染力。\n\n　　配套落地的C罗博物馆上海馆拥有近3000平方米沉浸式展陈空间，设置10个主题展区、15处特色场景，完整铺展C罗从马德拉少年成长为五夺金球奖足坛巨星的职业之路。馆内汇集奖杯、经典球衣、比赛战靴等数十件珍贵原版藏品，复原其年少时居住的卧室、墙上“我要做到最好”的留言；同时搭载AI数字人合影、虚拟射门等数字互动项目，兼顾收藏价值与沉浸式体验。\n\n　　项目落地将进一步擦亮南京东路商圈国际化名片，吸引海内外球迷、游客到访，持续为商圈导入客流、带动消费，助力上海推进文商旅体展融合，为国际消费中心城市建设注入体育文化新活力，成为上海对外展示开放包容城市气质、联通中外体育文化交流的崭新窗口。\n\n　　据悉，这座巨型C罗雕像将展览至今年12月底。C罗博物馆上海馆展期一年，面向公众开放，邀请大众沉浸式品读足坛传奇故事，感受体育文化与城市商业空间的融合魅力。此外，博物馆专门设置每周三公益日，面向青少年推出体育文化游学活动。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5f033d7f3c","title":"“清水文化海外传播与创新发展研讨会”在厦门开幕","url":"https://www.chinanews.com.cn/hr/2026/11-21/10735925.shtml","summary":"中新社厦门11月21日电 (吴冠标 吴江辉)由华侨大学主办的“清水文化海外传播与创新发展研讨会”21日在福建厦门开幕，170余名海内外专家学者、侨界代表齐聚一堂，共同探索中华文化海外传播的新路径。","summary_short":"中新社厦门11月21日电 (吴冠标 吴江辉)由华侨大学主办的“清水文化海外传播与创新发展研讨会”21日在福建厦门开幕…","digest":"由华侨大学主办的“清水文化海外传播与创新发展研讨会”21日在福建厦门开幕…","points":["中新社厦门11月21日电 (吴冠标 吴江辉)由华侨大学主办的“清水文化海外传播与创新发展研讨…","“清水祖师信俗”2011年被列入第三批国家级非物质文化遗产名录，其发祥于福建安溪清水岩…","马来西亚旅游、艺术和文化部副部长赵俊文在视频致辞中表示，清水文化跨越国界的传播历程…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T22:21:45+08:00","size":1,"keywords":[],"body":"中新社厦门11月21日电 (吴冠标 吴江辉)由华侨大学主办的“清水文化海外传播与创新发展研讨会”21日在福建厦门开幕，170余名海内外专家学者、侨界代表齐聚一堂，共同探索中华文化海外传播的新路径。\n\n　　“清水祖师信俗”2011年被列入第三批国家级非物质文化遗产名录，其发祥于福建安溪清水岩，千年来随闽南移民跨海传播到海外各地。\n\n11月21日，“清水文化海外传播与创新发展研讨会”在福建厦门开幕。　(华侨大学 供图)\n\n　　马来西亚旅游、艺术和文化部副部长赵俊文在视频致辞中表示，清水文化跨越国界的传播历程，是马来西亚与中国人文交流的生动缩影。期待各位专家学者深入挖掘清水文化的时代价值，梳理海外传承脉络，探索当代创新路径，进一步推动马来西亚乃至东南亚地区与中国的文明互鉴、文化交流合作。\n\n　　“清水文化是闽台同根同源、海内外侨胞共有记忆的生动载体。”华侨大学党委副书记林诗锋表示，学校将发挥侨校特色和优势，持续搭建交流平台、开展清水文化研究等，推动清水文化创造性转化、创新性发展，为清水文化申报世界遗产积累学理基础与社会共识，服务地方高质量发展，助力两岸融合发展，凝聚侨心侨力，促进中外人文交流。\n\n　　开幕式上，一批海内外专家学者受聘为清水文化研究智库专家。\n\n　　研讨会为期两天。当日，多位专家学者围绕清水文化的历史内涵和时代价值、两岸融合发展、侨务资源联动等主题作主旨报告。\n\n　　安溪县蓬莱镇副镇长、清水岩管委会常务副主任李德强说，清水岩将以本次研讨会为契机，联动海内外专家学者，深挖清水文化的精神内核，不断创新传播形式，依托专家研讨、研学实践、文创开发等多元载体持续扩大影响力。\n\n　　本次会议由华侨大学海外华人宗教与闽台宗教研究中心、安溪县清水岩管委会、安溪县清水文化旅游发展基金会等共同承办。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c424a52395b","title":"八分鐘兩岸新聞重點｜神舟二十四號完成合練／論文涉AI造假／橫越沙漠尋駱駝","url":"https://news.tvb.com/tc/1207667-八分鐘兩岸新聞重點神舟二十四號完成合練論文涉AI造假橫越沙漠尋駱駝","summary":"【神舟二十四號｜完成最後一次全區合練】神舟二十四號載人飛船將於近日發射，發射場已完成最後一次全區合練。當局又透露，專門為參與今次任務的巴基斯坦航天員提供清真太空食品。","summary_short":"【神舟二十四號｜完成最後一次全區合練】神舟二十四號載人飛船將於近日發射，發射場已完成最後一次全區合練。","digest":"【神舟二十四號｜完成最後一次全區合練】神舟二十四號載人飛船將於近日發射…","points":["神舟二十四號載人飛船將於近日發射，發射場已完成最後一次全區合練","當局又透露，專門為參與今次任務的巴基斯坦航天員提供清真太空食品","湖南中南大學的附屬醫院一篇論文被質疑是用人工智能AI生成，內容錯漏百出…"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T22:13+08:00","size":1,"keywords":[],"body":"【神舟二十四號｜完成最後一次全區合練】\n神舟二十四號載人飛船將於近日發射，發射場已完成最後一次全區合練。當局又透露，專門為參與今次任務的巴基斯坦航天員提供清真太空食品。\n\n【內地論文涉AI造假】\n湖南中南大學的附屬醫院一篇論文被質疑是用人工智能AI生成，內容錯漏百出，甚至腫瘤樣本圖片被指像「蝦滑」。校方事後證實論文涉及偽造數據，已處分涉事研究人員。\n\n【澳門大賽車｜酒店平均入住率逾八成】\n澳門格蘭披治大賽車第三日，吸引不少旅客觀賽。旅遊業界稱，賽事期間酒店平均入住率超過八成。\n\n【科企冀續提升機械狗速度】\n首屆世界機械人登泰山大賽月初舉行，奪得其中一項賽事冠軍的北京靈翌科技隊，負責人指成績超出預期，將繼續提升機械狗的速度，適應更多場景。\n\n【牧民橫越沙漠尋駱駝】\n踏入初冬，內蒙古沙漠有一群被「放養」半年的駱駝，準備轉到冬季牧場生活。牧民要在眾多駱駝中，逐一尋回自己養的駱駝。","image":"https://pro-vod-cdn.tvb.com/dcb1df42402343c184bcc33aa6309139/snapshots/d102ac68091444b2bdd9bf59e07fdde7-00008.jpg","video":"https://pro-vod-cdn.tvb.com/dcb1df42402343c184bcc33aa6309139/df2274e04ba14a6499da29c62206b781-980a55775b00c803256b382fb52965ca-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/dcb1df42402343c184bcc33aa6309139/snapshots/d102ac68091444b2bdd9bf59e07fdde7-00008.jpg","lang":"zh-Hant"},{"id":"c64491c34bc","title":"第七届世界海洋生物多样性大会在比利时举行","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735916.shtml","summary":"中新社比利时布鲁日11月21日电 (记者 德永健)第七届世界海洋生物多样性大会于11月17日至20日在比利时西北部城市布鲁日举行，围绕全球海洋生物现状、建立“数字海洋”体系等展开研讨。","summary_short":"中新社比利时布鲁日11月21日电 (记者 德永健)第七届世界海洋生物多样性大会于11月17日至20日在比利时西北部城市布…","digest":"第七届世界海洋生物多样性大会于11月17日至20日在比利时西北部城市布鲁日举行…","points":["中新社比利时布鲁日11月21日电 (记者 德永健)第七届世界海洋生物多样性大会于11月17日…","中国南海研究院和厦门大学派代表参会","今年第七届大会由比利时法兰德斯海洋研究所主办，汇聚来自全球68个国家和地区的800余名代表"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:52:52+08:00","size":1,"keywords":[],"body":"中新社比利时布鲁日11月21日电 (记者 德永健)第七届世界海洋生物多样性大会于11月17日至20日在比利时西北部城市布鲁日举行，围绕全球海洋生物现状、建立“数字海洋”体系等展开研讨。中国南海研究院和厦门大学派代表参会。\r\n\n　　作为海洋生物多样性领域高级别学术会议，世界海洋生物多样性大会每三年举办一次。今年第七届大会由比利时法兰德斯海洋研究所主办，汇聚来自全球68个国家和地区的800余名代表。中国南海研究院副院长林勇新率团出席会议。\n\n　　在大会主旨报告环节，厦门大学讲席教授、鹭江创新实验室副主任柴扉发表演讲，以“海洋数字孪生及其应用”为主题，阐述“海洋数字孪生”如何融合多源观测、数值模型与人工智能，实现对海洋环境与生态系统的动态监测、预测预警和情景模拟，为海洋生物多样性保护、资源可持续利用和科学决策提供技术支撑。\n\n　　柴扉同时介绍厦门申办《〈联合国海洋法公约〉下国家管辖范围以外区域海洋生物多样性的养护和可持续利用协定》(简称《海洋生物多样性协定》)秘书处的情况，表示厦门海洋文化底蕴深厚，科研基础雄厚，正以积极申办《海洋生物多样性协定》秘书处为契机，深化国际海洋治理合作，为全球海洋生物多样性保护贡献力量。\n\n　　本届大会举行之际，适逢联合国海洋科学促进可持续发展十年(2021－2030年)(简称“海洋十年”)进程过半。与会专家表示，当前全球海洋生物多样性保护正处在“关键十字路口”，保护工作既有成功案例，又因气候变化、过度捕捞、海洋污染等承受重压，呼吁国际社会协同行动，应对海洋生物多样性保护“系统性压力”，推动保护工作从个别化走向常态化。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cae5996eedd","title":"习近平新时代中国特色社会主义思想海外研究国际论坛（2026）在北京举行 李书磊出席开幕式并发表主旨演讲","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735898.shtml","summary":"新华社北京11月21日电 习近平新时代中国特色社会主义思想海外研究国际论坛(2026)21日在北京开幕。","summary_short":"新华社北京11月21日电 习近平新时代中国特色社会主义思想海外研究国际论坛(2026)21日在北京开幕。","digest":"习近平新时代中国特色社会主义思想海外研究国际论坛(2026)21日在北京开幕","points":["中共中央政治局委员、中宣部部长李书磊出席开幕式并发表主旨演讲","与会嘉宾认为，习近平新时代中国特色社会主义思想是在科学回答中国之问、世界之问、人民之问…","习近平主席提出构建人类命运共同体的重要理念，就解决各国面临的共同时代课题给出了中国答案…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:11:12+08:00","size":1,"keywords":[],"body":"新华社北京11月21日电 习近平新时代中国特色社会主义思想海外研究国际论坛(2026)21日在北京开幕。中共中央政治局委员、中宣部部长李书磊出席开幕式并发表主旨演讲。\n\n　　与会嘉宾认为，习近平新时代中国特色社会主义思想是在科学回答中国之问、世界之问、人民之问、时代之问，推动中国与世界携手并进的过程中创立和发展的。习近平主席提出构建人类命运共同体的重要理念，就解决各国面临的共同时代课题给出了中国答案，赢得国际社会的广泛认同。\n\n　　与会嘉宾表示，要加强习近平新时代中国特色社会主义思想海外研究和传播，共同推进全球发展事业，共同维护世界和平稳定，共同推动人类文明进步，共同完善全球治理体系。\n\n　　习近平新时代中国特色社会主义思想海外研究国际论坛(2026)于11月21日至22日在北京举行，由中国社会科学院主办。论坛以“大道之行：人类命运共同体”为主题，并在中国香港、乌兹别克斯坦、埃塞俄比亚、希腊、匈牙利、乌拉圭举办6场专题论坛。来自全球80多个国家和地区的近650名嘉宾出席。 【编辑:张燕玲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3657e080e9","title":"“不是因为开APEC会议，是一直都很漂亮”，这句话为啥火了","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735910.shtml","summary":"APEC会议期间，有媒体记者在深圳深南大道采访环卫工田大姐，问这条路是不是因为开会才这么漂亮。","summary_short":"APEC会议期间，有媒体记者在深圳深南大道采访环卫工田大姐，问这条路是不是因为开会才这么漂亮。","digest":"APEC会议期间，有媒体记者在深圳深南大道采访环卫工田大姐…","points":["APEC会议期间，有媒体记者在深圳深南大道采访环卫工田大姐，问这条路是不是因为开会才这么漂亮","田大姐回了一句：“不是因为开APEC会议这条路才很美，它一直都这么漂亮","”说起自己的活儿，她又打了个比方：“把它打扮得漂漂亮亮，像打了一场胜仗"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T21:05:05+08:00","size":1,"keywords":[],"body":"APEC会议期间，有媒体记者在深圳深南大道采访环卫工田大姐，问这条路是不是因为开会才这么漂亮。田大姐回了一句：“不是因为开APEC会议这条路才很美，它一直都这么漂亮。”说起自己的活儿，她又打了个比方：“把它打扮得漂漂亮亮，像打了一场胜仗。”\r\n\n　　一句话，把城市管理的“底牌”亮了。这句话最动人的，不是“漂亮”，是“一直”。田大姐的话之所以让人听着舒坦，是因为它直接撕掉了人们对大型盛会的“滤镜焦虑”：真正的城市体面，从来不是临时抱佛脚赶出来的“精装”，而是日复一日养出来的“底妆”。这份底气，不只属于深圳，更藏在越来越多中国城市的日常里。\n\n　　“盛会限定”容易，“日常标配”难。看一座城市的管理，别只看它是否“出片”，还要看它是否“耐用”。所谓“一直漂亮”，不过是把该做的事，在没有镜头的时候也做了。一盏路灯坏了有没有人修，一场雨后积水有没有人管，一段盲道被占有没有人过问；迎宾大道干净整洁，背街小巷、老旧小区、城乡接合部能不能同样被看见？对市民来说，少绕一段路、少踩一脚水，就是具体的获得感；对企业来说，有序、稳定、可预期的公共环境，也是营商环境的一部分。城市竞争力，既写在摩天大楼的高度里，也藏在井盖是否平整、街角是否干净的细节里。\n\n　　重在日常，不是降低重大活动保障的标准，而是别让高标准“限时返场”。把重点路段的要求延伸到更多街巷，把“有人检查才紧张”变成“没人提醒也负责”；考核少看一点迎检时的焕然一新，多看一些随机时刻的本来面目，少听一次精心准备的汇报，多听几句市民随口的牢骚。城市管理，最忌镜头一撤，管理也跟着“撤档”。\n\n　　田大姐说，把道路打扮漂亮，像打了一场胜仗。对城市管理者来说，真正的胜仗，不是赢在一次检查、一场盛会，而是赢在每一个普通清晨：客人来了，城市拿得出手；客人走了，市民依然住得舒心。\n\n　　“一直漂亮”的底气，不是盛会给的，是日常攒的。盛会会落幕，生活天天开场。城市最美的妆容，叫日常。\n\n　　作者：常钦 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf15771ff27","title":"与中国有一种真挚连接——访兰花奖得主勒克莱齐奥","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735908.shtml","summary":"新华社巴黎11月21日电 专访｜与中国有一种真挚连接——访兰花奖得主勒克莱齐奥  　　新华社记者张百慧 邬惠我 孙鑫晶  　　“文学是推动人们追求和平的重要力量。","summary_short":"新华社巴黎11月21日电 专访｜与中国有一种真挚连接——访兰花奖得主勒克莱齐奥  　　新华社记者张百慧 邬惠我 孙鑫晶…","digest":"专访｜与中国有一种真挚连接——访兰花奖得主勒克莱齐奥  　　新华社记者张百慧 邬惠我…","points":["新华社记者张百慧 邬惠我 孙鑫晶","“文学是推动人们追求和平的重要力量","作为20世纪后半期法国新寓言派代表作家之一，勒克莱齐奥长期以文学创作拓展读者对多元文明和人类…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T21:02:25+08:00","size":1,"keywords":[],"body":"新华社巴黎11月21日电 专访｜与中国有一种真挚连接——访兰花奖得主勒克莱齐奥\n\n　　新华社记者张百慧 邬惠我 孙鑫晶\n\n　　“文学是推动人们追求和平的重要力量。”兰花奖得主、法国作家让-马里·居斯塔夫·勒克莱齐奥近日在巴黎接受新华社记者专访时说，文学能够让人们了解不同文化背景下的生命经历，从而走出自我、理解他者，这为文明间交流与和平共处创造更多可能。\n\n　　第三届兰花奖颁奖典礼20日在北京举行。86岁的勒克莱齐奥在颁奖典礼上说：“获得这一奖项对我来说意义非凡，我始终觉得自己和(中国)人民之间有一种真挚的连接，一种精神上的亲近，尤其是我一直深爱着中国文学。”\r\n\n　　作为20世纪后半期法国新寓言派代表作家之一，勒克莱齐奥长期以文学创作拓展读者对多元文明和人类共同命运的认知。他于2008年获得诺贝尔文学奖，其作品的中译本自1983年以来在中国多次出版，广受关注。20世纪60年代，勒克莱齐奥首次到访中国。多年来，他积极参与法中文学交流和中国文化国际传播。\n\n　　勒克莱齐奥在巴黎接受专访时告诉记者，第一次踏上中国土地之前，他通过译本接触到唐诗。“当时我对中国一无所知，生活在一个完全不同的世界里，却能读懂李白的诗歌，这让我着迷。”\n\n　　唐诗中河流、明月、飞鸟等意象及其蕴含的情感，让勒克莱齐奥感受到人与自然浑然一体的意境。“即使过了一千年、相隔一两千公里，文学传递的信息依然真切、有意义。”\n\n　　勒克莱齐奥认为，在法国，应该更加重视对中国文学的研究。他与中国学者合著《唐诗之路》，将唐诗介绍给法语世界，受到广泛关注和好评。\n\n　　勒克莱齐奥说，文学对于文明间交流的意义首先在于能够“帮助人们寻求和平”。文明之间的竞争往往导致残酷战争，而文学能够帮助化解这种困境，“走出自我、理解他者”正是文学的作用之一。\n\n　　作为多元文化传播者，勒克莱齐奥认为翻译的作用非常重要。“通过翻译传递作家想要表达的信息并非易事，但这确实能够促进不同文化之间的交流。”\n\n　　谈及如何培养优秀的文学译者，他主张为有志于从事中国文学翻译的人才提供更多赴华学习、生活的机会，因为“中国文化不局限于书本知识，还包括当地人的生活方式、交谈方式和日常表达”。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd6ae02dfef","title":"外媒记者看深圳：一座实至名归的“APEC之城”","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735905.shtml","summary":"国际在线消息(记者 谢诗佳 冯启坤)：亚太经合组织第三十三次领导人非正式会议日前圆满落下帷幕。","summary_short":"国际在线消息(记者 谢诗佳 冯启坤)：亚太经合组织第三十三次领导人非正式会议日前圆满落下帷幕。","digest":"国际在线消息：亚太经合组织第三十三次领导人非正式会议日前圆满落下帷幕","points":["国际在线消息(记者 谢诗佳 冯启坤)：亚太经合组织第三十三次领导人非正式会议日前圆满落下帷幕","在外媒记者眼中，APEC会议既是记录亚太合作进程的现场，也是观察中国改革开放…","他们认为，深圳作为APEC举办城市实至名归"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T20:59:23+08:00","size":1,"keywords":[],"body":"国际在线消息(记者 谢诗佳 冯启坤)：亚太经合组织第三十三次领导人非正式会议日前圆满落下帷幕。在外媒记者眼中，APEC会议既是记录亚太合作进程的现场，也是观察中国改革开放、科技创新与城市发展的窗口。他们认为，深圳作为APEC举办城市实至名归。深圳现代化的城市风貌、随处可见的科技应用、便捷的交通和友善的市民，都给他们留下了深刻印象。有记者表示，希望把深圳在科技创新和城市长远规划方面的经验介绍给本国读者。\r\n\n　　实至名归：现代化城市风貌与细致筹备工作获点赞\n\n　　《伊朗日报》记者Delaram用“实至名归”概括对深圳承办APEC会议的评价。她说：“我认为深圳被选为APEC会议举办城市可谓实至名归。这里方方面面都非常便利，举办这次活动所需的各项准备工作都做得非常充分细致。”在她看来，从会务组织到城市运行，深圳展现出的便利程度和筹备工作的细致程度，让与会者切实感受到这座现代化国际都市的办会能力与诚意。\n\n　　菲律宾《马尼拉时报》记者Red Mendoza则分享了对深圳改革开放成果方面的观察。他说：“我们看到了这座城市因改革开放而取得的丰硕成果。从繁荣的经济、蓬勃发展的城市面貌，到高耸的现代化建筑、繁盛的消费市场以及便捷的地铁交通，这些都是一座现代化、充满发展活力的城市所应具备的，而深圳正是这样一座城市。”\n\n　　墨西哥《每日报》记者Angeles Cruz表示，深圳处处都能感受到高科技的存在，这种科技感并非停留在展台，而是融入城市运行和日常生活，“中国的发展速度与活力令人印象深刻”。墨西哥Los Reporteros MX记者Manuel Pedrero则提到，这里的人们友好、热情，让采访体验格外温暖；城市建筑中应用的科技也让人耳目一新，展现出科技与城市建设相融合的独特气质。\n\n　　土耳其记者Emre Aytekin深有同感。他表示，每次来到深圳，都能真切感受到这座城市快速发展的脉搏，看到科技如何融入城市建设并切实应用于日常生活。“深圳成为APEC会议举办城市绝对是当之无愧的。”在他看来，科技应用与经济发展相互促进，正是深圳承办APEC会议的底气所在。\n\n　　会场内外看合作：开放议题牵动全球目光\n\n　　外媒记者普遍关注亚太合作在复杂国际环境中的现实意义。智利电视13台记者Sebastian Avila表示，在当前复杂的全球大环境下，此类会议及其促成的机遇格外重要，有助于维护和平、促进商业合作，并推动各成员经济体共同关注的事务向前发展。在他看来，越是国际环境复杂，越需要APEC这样的平台凝聚共识、创造合作机会。\n\n　　墨西哥记者Manuel Pedrero认为，墨西哥总统专程来到深圳出席APEC会议本身就是一个很有分量的信号，传递出墨西哥对亚太合作的高度重视，也体现出墨方深化同中国在经贸、投资、科技创新等领域合作的积极意愿。\n\n　　马来西亚《阳光日报》记者Junhairi在深圳参访约一周后表示，中国科技给人最深的印象是独特而先进，不仅体现在技术本身，更体现在企业研发、产业应用和城市生活场景的紧密结合。他认为，其他经济体可以从深圳学到如何培育更活跃的创新精神、搭建更丰富的应用场景，让科技进步真正转化为产业竞争力和发展动能。\n\n　　把“深圳故事”装进行囊：科技创新与长远规划引发共鸣\n\n　　当被问及最想给本国受众讲述怎样的APEC深圳故事时，发展速度、科技创新和长远规划成为外媒记者反复提及的关键词。智利合作社电台记者Fabián Pizarro表示，中国是智利重要的投资和技术来源地，中国通过制定五年规划进行统筹规划的发展方式尤其值得借鉴。他说：“我觉得了解中国的这些做法很有意思，也值得我们加以借鉴，从而使我们的政策不再局限于短期目标，而是着眼于更长远的发展。”在他看来，五年规划的意义在于把长远目标分解为可执行的阶段性任务，让政策更具连续性和可预期性，这对智利谋划未来发展同样具有参考价值。\n\n　　智利记者Sebastian Avila表示，深圳是一座科技感十足、规模庞大且充满活力的年轻城市。对他而言，此行最重要的是把在深圳看到的发展经验带回智利，把人工智能等面向未来的技术和发展故事“装进行囊”，为智利未来发展提供助力。\n\n　　菲律宾记者Red Mendoza最想讲述的，是深圳从宁静小渔村到改革开放“试验田”、再到繁华大都市的发展历程。他认为，这条跨越式发展轨迹本身就是改革开放最直观的样本；如今深圳汇聚全球领先的科技企业，机器人技术等新兴产业持续为城市发展注入动能，创新活力已成为这座城市最鲜明的气质。\n\n　　APEC会议虽已落幕，深圳留给外媒记者的印象却愈发清晰——这是一座实至名归的“APEC之城”，也是一座值得把故事装进行囊、带向世界的城市。随着记者们陆续踏上归程，深圳的开放活力、创新动能与长远规划，也将通过他们的报道，进入更多国家和地区的视野。对深圳而言，APEC盛会不仅是展示城市魅力的窗口，更是迈向未来的新起点——以开放创新持续书写城市发展新篇，为亚太合作注入更多确定性与活力。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6aa96f07dd","title":"SD3系统连续稳定运行逾5年 入围戈登·贝尔气候建模奖","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735884.shtml","summary":"中新网北京11月21日电 题：SD3系统连续稳定运行逾5年 入围戈登·贝尔气候建模奖  　　记者 张素  　　国际计算机学会(ACM)近日在SC26国际超级计算大会上公布2026年度戈登·贝尔气候建模…","summary_short":"中新网北京11月21日电 题：SD3系统连续稳定运行逾5年 入围戈登·贝尔气候建模奖  　　记者 张素  　　国际计算机…","digest":"题：SD3系统连续稳定运行逾5年 入围戈登·贝尔气候建模奖  　　记者 张素…","points":["国际计算机学会(ACM)近日在SC26国际超级计算大会上公布2026年度戈登·贝尔气候建模奖…","SD3由中科天机团队自主研发，相关负责人在受访时解读这一系统有何“天机”","据知，SD3是将全部模块移植到国产异构加速器的气象数值模式，其中加速器计算占比超过99%…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T20:44:24+08:00","size":1,"keywords":[],"body":"中新网北京11月21日电 题：SD3系统连续稳定运行逾5年 入围戈登·贝尔气候建模奖\n\n　　记者 张素\n\n　　国际计算机学会(ACM)近日在SC26国际超级计算大会上公布2026年度戈登·贝尔气候建模奖，SD3全球公里级气象数值模拟系统入围决赛名单。\n\n　　SD3由中科天机团队自主研发，相关负责人在受访时解读这一系统有何“天机”。\r\n\n　　关键指标获得认可\n\n　　戈登·贝尔奖设立于1987年，被视为高性能计算应用领域的最高荣誉之一。自2023年起，ACM专门设立了戈登·贝尔气候建模奖，表彰在并行计算方法上取得突破性创新，并对气候变化应对与地球系统科学作出贡献的团队。\n\n　　据知，SD3是将全部模块移植到国产异构加速器的气象数值模式，其中加速器计算占比超过99%，并依托曙光8000超智融合平台构建了计算底座。\n\n　　相关负责人介绍说，在24576张国产异构加速器上，该系统实现了全球1.5公里分辨率下205.7模拟天/日的峰值吞吐。这些关键指标获得国际评审委员会认可，也标志着中国自主可控的高分辨率气象基础软件进一步从学术原型走向产业落地。\n\n　　连续稳定运行5年以上\n\n　　与多数依靠单次极端规模测试入围的学术方案不同，SD3“不仅能在极限规模下跑出惊人速度，更已在真实业务场景中长期稳定交付”。\n\n　　据介绍，自2020年投入业务化运行，SD3至今已连续稳定运行5年以上。\n\n　　研发团队负责人称，在日常业务中，它仅用12个计算节点、约85分钟即可完成全球12公里分辨率的10天预报，而国外同类系统约需288个节点。\n\n　　预报精度方面，基于多源全球观测资料与730个样本周期的系统性客观检验显示，SD3在全球500hPa位势高度距平相关系数(ACC)≥0.6的有效预报时效达到10天。\n\n　　面向全球科研人员开放\n\n　　去年9月，“高分辨率气象数据共享计划”推出，建成天机气象数据共享平台，面向全球科研人员免费开放下载，已先后开放全球12公里预报产品、中国区域2.5公里融合数据及历史数据集等。\n\n　　据统计，截至目前该平台已汇聚超过1.5万名专业用户、390余家科研与行业机构，累计数据下载量突破1PB，广泛服务于气象人工智能大模型训练、新能源资源评估与功率预测、航空与交通气象、防灾减灾等场景。\n\n　　为推进科学成果普惠共享，今年6月，中科天机海外数据集接入国际平台，与NOAA GFS、HRRR等国际主流气象数据集并列，让中国自主气象数据基础设施进入全球开放数据生态。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3ec6ea45f8","title":"ESG传播，不能止于一纸报告","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735878.shtml","summary":"中新网杭州11月21日电 (钱晨菲)一台风机由上万个零部件组成，在运达风电原董事长高玲看来，企业的绿色低碳实践，不只体现在自身生产环节，也延伸至供应链的一颗螺丝、一道加工工艺乃至生产用电。","summary_short":"中新网杭州11月21日电 (钱晨菲)一台风机由上万个零部件组成，在运达风电原董事长高玲看来，企业的绿色低碳实践…","digest":"一台风机由上万个零部件组成，在运达风电原董事长高玲看来，企业的绿色低碳实践…","points":["中新网杭州11月21日电 (钱晨菲)一台风机由上万个零部件组成，在运达风电原董事长高玲看来…","“披露本身就是一个传播行为","”近日，在杭州举行的新质时代ESG实践与传播高峰对话上，高玲谈起企业ESG实践时…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:34:50+08:00","size":1,"keywords":[],"body":"中新网杭州11月21日电 (钱晨菲)一台风机由上万个零部件组成，在运达风电原董事长高玲看来，企业的绿色低碳实践，不只体现在自身生产环节，也延伸至供应链的一颗螺丝、一道加工工艺乃至生产用电。\n\n　　“披露本身就是一个传播行为。”近日，在杭州举行的新质时代ESG实践与传播高峰对话上，高玲谈起企业ESG实践时，将话题落在产业链的细节上。作为链主企业，运达风电将碳足迹核算要求向上下游延伸，并共享碳管理平台，推动供应商共同参与绿色低碳管理。\n\n　　“在人工智能能够快速生成图文报告的当下，ESG传播尤其需要回到实践。ESG报告不是写出来的，一定是我们业务过程中的数据跑出来的。”她表示，真实、可靠的数据是企业建立信任的基础。\n\n活动现场。孙杨洋 摄\n\n　　真实的实践还需要找到合适的表达方式。浙江省青年企业家协会秘书长于千朋接触了不少年轻企业家，发现他们未必会主动阅读其他企业厚厚的ESG报告，却很关心ESG与经营发展的关系。降本增效、出海合规等具体议题，更容易引起经营者关注。\n\n　　为此，协会尝试通过脱口秀、播客等形式，让企业家在交流中理解ESG。如在那曲地震援助中，协会没有简单号召企业大额捐款，而是先了解受灾学校缺少课桌、床铺、被褥等实际需求，再发动企业按需参与。于千朋认为，与其先要求企业明确理解ESG概念，不如从具体行动入手，再把真实的实践转化为传播内容。\n\n　　微链创始人兼CEO蔡华则将视线从企业自身延伸至产业生态。他观察到，一些企业仍将ESG狭义理解为对外发布报告，实际上，企业的可持续发展与产业链上下游密切相关。他用家庭作比：家庭成员的健康关系到全家生活，一家企业的经营状况和可持续发展能力，也会影响上下游合作伙伴。\n\n　　在蔡华看来，ESG并非企业额外增加的一项展示任务，而是企业经营过程中需要面对的风险、责任与长期发展问题，要纳入企业战略层面规划。尤其在出海过程中，提前布局ESG的企业可能借此打开海外市场，忽视相关要求的企业则可能错失发展机会。\n\n　　企业责任意识的变化，也与经营者代际更替有关。对话主持人、浙江工商大学战略企业家学院院长胡宏伟注意到，随着“90后”逐渐走上管理岗位，企业面对的传播对象正在变化。\n\n　　“做比说更重要，但不等于不说。”胡宏伟认为，企业承担社会责任，既能推动社会进步，也有助于自身发展。中国企业并不缺少朴素的责任意识，关键是将这种意识转化为系统、可持续的实践，并通过有效传播形成更广泛的理解和认同。\n\n　　浙江传媒学院教授、高级编辑朱永祥从传播角度提出，ESG传播需要建立信任，也要讲述企业家和一线从业者的真实故事，并让供应链、社区、用户等相关方参与其中，形成信任叙事、人格叙事和共生叙事。\n\n　　“信任不是天然标签，哪怕是大企业，一旦数据造假，信任也会灰飞烟灭。”朱永祥说。相较于单纯罗列指标，可查询、可溯源的数据，以及真实的人物故事和多方参与的实践，更有助于建立持久的信任。\n\n　　从一颗螺丝的碳足迹，到受灾学校需要的课桌和床铺，再到企业出海面对的合规要求，ESG并不只是报告中的指标，也存在于企业日常经营和社会交往的具体环节。对企业而言，实践是传播的起点，传播则让这些实践走出企业，进入公众视野和市场评价之中。\n\n　　此次活动由中新社国际传播集团浙江分公司、浙商总会新媒体专业委员会、中国投资协会高新技术投资专业委员会主办，江苏银行杭州分行、浙江工商大学战略企业家学院承办。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cde999a27f1","title":"天津通报正风肃纪反腐“成绩单” 部署深化“三不腐”","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735863.shtml","summary":"中新网天津11月21日电 (记者 周亚强)记者从中共天津市委21日举行的新闻发布会上获悉，市第十二次党代会以来，全市纪检监察机关共查处“四风”问题1万余起，批评教育和处理1.3万余人…","summary_short":"中新网天津11月21日电 (记者 周亚强)记者从中共天津市委21日举行的新闻发布会上获悉，市第十二次党代会以来…","digest":"记者从中共天津市委21日举行的新闻发布会上获悉，市第十二次党代会以来…","points":["中新网天津11月21日电 (记者 周亚强)记者从中共天津市委21日举行的新闻发布会上获悉…","同期共立案2.4万余件，处分2.2万余人，其中处分市管干部235人","此次发布会旨在解读天津市委十二届九次全会精神"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:20:05+08:00","size":1,"keywords":[],"body":"中新网天津11月21日电 (记者 周亚强)记者从中共天津市委21日举行的新闻发布会上获悉，市第十二次党代会以来，全市纪检监察机关共查处“四风”问题1万余起，批评教育和处理1.3万余人；同期共立案2.4万余件，处分2.2万余人，其中处分市管干部235人。\n\n图为新闻发布会现场。中共天津市委供图\n\n　　此次发布会旨在解读天津市委十二届九次全会精神。天津市纪委副书记、市监委副主任孙占军在回答中新社记者提问时表示，天津把中央八项规定作为必须长期坚持的铁规矩、硬杠杠，坚持抓典型抓现行抓通报，持续狠刹享乐主义、奢靡之风，重拳纠治形式主义、官僚主义，党的纪律规矩更加严明，全市上下靠作风吃饭、拿实绩说话的氛围不断浓厚。\n\n　　他表示，作风和纪律问题具有长期性、顽固性、反复性。《中共天津市委关于深入贯彻落实党的二十届五中全会精神持之以恒推进全面从严治党的意见》(下称《意见》)从四方面作出部署：密切联系和服务群众；锲而不舍落实中央八项规定及其实施细则精神；推进作风建设常态化长效化；强化从严执纪和纪律教育。\n\n　　在一体推进“三不腐”方面，孙占军介绍，市委坚持严的基调不动摇，以保持高压震慑强化不敢腐，以加强监督制约强化不能腐，以深化廉洁教育强化不想腐，以完善体制机制、强化科技赋能促进一体推进，持续释放一严到底、寸步不让、越往后越严的强烈信号。\n\n　　孙占军表示，《意见》从保持反腐败高压态势、加强权力运行制约监督、筑牢拒腐防变思想防线、增强治理腐败综合效能四方面作出部署，坚持同时发力、同向发力、综合发力，更加注重标本兼治、系统施治，从严惩、精准治、有效防、一体抓，将反腐败斗争进行到底。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c642604123a","title":"天津市城市民族工作品牌“津石榴”形象标识设计投入使用","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735858.shtml","summary":"中新网天津11月21日电 (田孟轩)中新网记者近日从天津市民族和宗教事务委员会了解到，其牵头指导天津科技大学艺术设计学院孙立团队完成“津石榴”形象标识设计…","summary_short":"中新网天津11月21日电 (田孟轩)中新网记者近日从天津市民族和宗教事务委员会了解到…","digest":"中新网记者近日从天津市民族和宗教事务委员会了解到…","points":["中新网天津11月21日电 (田孟轩)中新网记者近日从天津市民族和宗教事务委员会了解到…","近年来，天津市以“津石榴”为品牌，先后举办天津市全国民族团结进步模范事迹巡回宣讲报告…","上述有关“津石榴”形象标识设计工作，是为了学习宣传贯彻《中华人民共和国民族团结进步促进法》…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T20:16:03+08:00","size":1,"keywords":[],"body":"中新网天津11月21日电 (田孟轩)中新网记者近日从天津市民族和宗教事务委员会了解到，其牵头指导天津科技大学艺术设计学院孙立团队完成“津石榴”形象标识设计，并撰写了《关于打造“津石榴”天津市民族工作品牌形象的对策建议》，目前，该设计成果已在天津市首个民族团结进步宣传周、京津冀铸牢中华民族共同体意识研讨会和有关主题研学活动中应用。\r\n\n　　据悉，近年来，天津市以“津石榴”为品牌，先后举办天津市全国民族团结进步模范事迹巡回宣讲报告、铸牢中华民族共同体意识文艺展演、文化行电影展、文化之旅等活动，得到各族群众的认可与赞誉。\n\n　　上述有关“津石榴”形象标识设计工作，是为了学习宣传贯彻《中华人民共和国民族团结进步促进法》，有形有感构筑中华民族共有精神家园，有力有效提升“津石榴”天津城市民族工作品牌。\n\n　　该标识设计以石榴元素为主体，紧扣“各民族像石榴籽一样紧紧抱在一起”的重要论述，象征各民族血脉相连、命运与共。设计创意源于玉璧与同心圆，中孔为“同心之眼”，外缘寓“圆融之界”，寓意各族人民同心同德，“周行不殆”的永恒动力，象征中华民族以玉为德、以和为贵的和合精神。\n\n　　玉璧之纹样巧妙融合手牵手、环拥成圆的各族人民；人物形象亦取自天津杨柳青年画经典的众娃娃捧石榴的形象，彰显津派韵味与“中华民族一家亲”理念。顶部花萼提炼海河三岔河口浪花意象，勾勒天津依河而生、汇流交融的城市底蕴，尽显津城灵动气韵，更延伸出各民族在历史长河中交融汇聚、团结共进的深层意象。\n\n　　整体轮廓融入天津地标摩天轮元素，锚定城市专属身份标识。色彩取自杨柳青年画，以橙、红、紫、蓝渐变，融石榴暖意、国旗赤诚、祥瑞紫气与海河深韵。\n\n　　整体设计古今相融、形意相合，兼具政治高度、文化厚度、地域温度与艺术锐度，简约醒目，便于宣传与文创延展，树立天津城市民族工作鲜明视觉符号和精神标识。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c488fd75bcb","title":"中国科研团队给植物定制专属“光配方”","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735847.shtml","summary":"中新网合肥11月21日电 (记者 张俊)在中国科学技术大学先进技术研究院的农业光学实验室里，生菜、辣椒等蔬菜排满栽培架。","summary_short":"中新网合肥11月21日电 (记者 张俊)在中国科学技术大学先进技术研究院的农业光学实验室里，生菜、辣椒等蔬菜排满栽培架。","digest":"在中国科学技术大学先进技术研究院的农业光学实验室里，生菜、辣椒等蔬菜排满栽培架","points":["中新网合肥11月21日电 (记者 张俊)在中国科学技术大学先进技术研究院的农业光学实验室里…","没有阳光，也没有土壤，叶子在人工光的照射下一层层往外长","“植物生长只需要大概不到10%的太阳光"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T19:50:43+08:00","size":1,"keywords":[],"body":"中新网合肥11月21日电 (记者 张俊)在中国科学技术大学先进技术研究院的农业光学实验室里，生菜、辣椒等蔬菜排满栽培架。没有阳光，也没有土壤，叶子在人工光的照射下一层层往外长。\n\n　　“植物生长只需要大概不到10%的太阳光。”上述研究院研究员张放心说，他所在的团队围绕“光与作物”研究了十多年。第一件事是把阳光“分”开用：一张聚合物光学膜让植物需要的红光、蓝光等有效波段透过去，植物用不上的光反射给光伏板发电。同一块地，上面光伏发电，下面作物生长。\n\n11月21日，科研人员正在查看种植箱内植物生长情况。记者张俊 摄\n\n　　张放心说，过去一块地要么种庄稼，要么架光伏，如今这套技术让两者不再“争地”。光学膜还能阻隔大部分热量，植物表面温度低一些，水蒸发也少一些。\n\n　　科研团队做的第二件事是把光“配”出来。据张放心介绍，团队研制了植物工厂系统，根据不同的植物定制专属“光配方”，灯具的光强、光谱、光周期可以分别调；自研的多通道光量子传感器可以精准测出每个波段的光子数，数据回到控制系统，形成闭环调光。\n\n　　“我们给不同的植物定制精准的‘光配方’，让能耗更低，植物长得更好。”张放心说，以番茄为例，自然光里红光与蓝光比例约为4：5，工厂里调到9：1，番茄红素生成更快，口感也更好。\n\n　　张放心表示，植物生长箱里，一茬茬作物在不同的“光配方”下生长，数据被攒下来，用来训练植物生长大模型，配方再一轮轮迭代优化。\n\n11月21日，科研人员正在查看实验室内植物生长情况。记者张俊 摄\n\n　　“我们也把这套办法也用到了育种。”张放心告诉记者，水稻在南方一年种植两季，在植物工厂里可种植四季至六季。\n\n　　如今，这套植物工厂与光电子农业技术已经走出实验室。集装箱植物工厂能进戈壁、海岛、雪域高原，也随远洋货轮出海，产品销往马来西亚、新加坡等国家和地区。\n\n　　“我们希望把植物工厂的能耗降得再低一些。”张放心正在规划下一代产品。他说，未来将继续开展技术攻关，降低成本，让植物工厂走向更多社区和家庭。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c57b68f6ad0","title":"中外高校围绕“产学研用”达成19项合作","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735837.shtml","summary":"中新社重庆11月21日电 (记者 钟旖)2026国际产学研用合作会议(西南三省一市一区)21日在重庆召开。","summary_short":"中新社重庆11月21日电 (记者 钟旖)2026国际产学研用合作会议(西南三省一市一区)21日在重庆召开。","digest":"2026国际产学研用合作会议(西南三省一市一区)21日在重庆召开","points":["中新社重庆11月21日电 (记者 钟旖)2026国际产学研用合作会议(西南三省一市一区)21…","其间，聚焦关键技术攻关、成果转化落地、国际人才联合培养，重庆、云南、贵州等地高校与俄罗斯…","其中，7项为产学研用合作项目签约，包括重庆医科大学与泰国孔敬大学…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T19:29:20+08:00","size":1,"keywords":[],"body":"中新社重庆11月21日电 (记者 钟旖)2026国际产学研用合作会议(西南三省一市一区)21日在重庆召开。\n\n　　其间，聚焦关键技术攻关、成果转化落地、国际人才联合培养，重庆、云南、贵州等地高校与俄罗斯、英国、希腊、塔吉克斯坦、泰国、越南等国的高校、科研院所、企业达成19项务实合作。\n\n　　其中，7项为产学研用合作项目签约，包括重庆医科大学与泰国孔敬大学、希腊克里特大学合作谅解备忘录，贵州大学与泰国皇太后大学合作谅解备忘录，云南交通职业技术大学与越南老街高等专科学校共同建设越南海外工程技术学院合作协议等；另有重庆邮电大学菲尔兹奖工作站、西南大学—法国科尔玛葡萄科技小院等12个创新平台发布。\n\n11月21日，2026国际产学研用合作会议(西南三省一市一区)上的平台发布环节。(重庆市教委供图)\n\n　　“推动协同创新与产学联动，是高等教育服务科技创新产业发展的重要途径。”俄罗斯远东联邦大学校长鲍里斯·科罗贝茨(Boris Korobets)称，该校与重庆邮电大学、俄罗斯天然气工业银行技术引领中心有限公司此次签署产学研用合作协议，将把高校合作延伸至产业应用端，促进科研方向与实际场景衔接。\n\n　　菲尔兹奖获得者、中国科学院外籍院士埃菲·杰曼诺夫(Efim Zelmanov)表示，产学研用合作应行稳致远。高校在其中发挥重要作用：一方面培养人才、构建创新生态；另一方面在技术研发与产业应用之间搭建桥梁。他认为，育才育人是产学研用协同合作的核心要义，建议搭建实习历练和联合指导平台，以协同育人促进国际交流合作。\n\n　　重庆市教育委员会主任刘宴兵表示，从2023年开始，重庆已连续举办国际产学研用合作会议，吸引31个国家的近3000名中外高校、科研院所和企业代表参会，达成近100项合作，推动更多创新成果从实验室走向产业一线，促进教育链、人才链与产业链、创新链有机衔接。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4f71c613eb","title":"第五届长江大保护司法论坛在武汉开幕","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735827.shtml","summary":"中新网武汉11月21日电 (记者 武一力)第五届长江大保护司法论坛21日在武汉开幕，来自学界、业界与实务界的专家学者齐聚武汉，共同探寻在法治轨道上推进长江流域治理现代化的实践路径。","summary_short":"中新网武汉11月21日电 (记者 武一力)第五届长江大保护司法论坛21日在武汉开幕，来自学界…","digest":"第五届长江大保护司法论坛21日在武汉开幕，来自学界、业界与实务界的专家学者齐聚武汉…","points":["中新网武汉11月21日电 (记者 武一力)第五届长江大保护司法论坛21日在武汉开幕…","本届论坛以“以法典之力护长江文脉 以法治之为兴长江文明”为主题，由湖北省高级人民法院…","论坛上，中国科学院院士何舜平提出，摸清水生生物“家底”是长江大保护的首要任务"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T18:47:42+08:00","size":1,"keywords":[],"body":"中新网武汉11月21日电 (记者 武一力)第五届长江大保护司法论坛21日在武汉开幕，来自学界、业界与实务界的专家学者齐聚武汉，共同探寻在法治轨道上推进长江流域治理现代化的实践路径。\n\n　　本届论坛以“以法典之力护长江文脉 以法治之为兴长江文明”为主题，由湖北省高级人民法院、长江海商法学会、武汉大学、华中科技大学、中南财经政法大学、人民法院环境资源司法理论研究(武汉大学)基地联合主办。\n\n11月21日，第五届长江大保护司法论坛在武汉开幕。朱向东 摄\n\n　　论坛上，中国科学院院士何舜平提出，摸清水生生物“家底”是长江大保护的首要任务。针对传统监测费时耗力、物种鉴定困难、难以标准化的局限，环境DNA技术以快速、低成本、高通量、非入侵、易标准化的优势，成为水生生物监测的重要手段。他认为，要推动环境DNA技术发展，为长江大保护提供有力科技支撑。\n\n　　华中科技大学法学院客座教授卢埃林·约瑟夫·吉本斯表示，跨界水资源决策应当吸纳上下游主体意见、厘清污染因果证据、明确跨区域损害的责任主体，保护水生态要上下游协同、共担责任，做到“饮水思源”。\n\n　　交通运输部长江航务管理局局长刘亮介绍，近年来，长航局坚持法治引领推动航运绿色转型，落实《长江保护法》等法律法规，建成30多处水上法律服务站，加快“信用长江”建设。长江水系已建在建绿色船舶超1200艘，建成9座LNG加注站、9处充换电设施和一批绿色航道示范工程，绿色转型成效显著。\n\n　　据悉，长江大保护司法论坛举办五年来，专家学者紧扣长江流域现代化治理和法治保障核心议题，产出一批兼具理论价值与实践效能的研究成果，促进健全长江大保护的体制机制，推动长江司法保护工作走深走实。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc6128601a2","title":"重庆国际人才交流大会开幕","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735825.shtml","summary":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会21日开幕。","summary_short":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会21日开幕。","digest":"重庆国际人才交流大会21日开幕","points":["中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会21日开幕","本届大会延续“才聚新重庆·共创新未来”主题，秉持“高端化、国际化、专业化、社会化”办会理念…","据介绍，近年来，重庆坚定实施科技创新和人才强市首位战略…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T18:39:55+08:00","size":1,"keywords":[],"body":"中新网重庆11月21日电 (记者 钟旖)重庆国际人才交流大会21日开幕。\n\n　　本届大会延续“才聚新重庆·共创新未来”主题，秉持“高端化、国际化、专业化、社会化”办会理念，进一步突出时代性、创新性、实效性，按照“2942N”总体布局，精心设置2场政务活动、9场会议活动、4场引才引智活动、2场创投活动，以及一系列专场和分项活动，邀请海内外重要嘉宾齐聚山城、共谋发展。\n\n图为重庆国际人才交流大会开幕现场。中新网记者 何蓬磊 摄\n\n　　据介绍，近年来，重庆坚定实施科技创新和人才强市首位战略，加快建设区域科技创新中心和西部人才中心，着力构建现代化产业体系，优化科技创新布局，完善全周期一站式人才服务，建设现代化人民城市，为各类人才创新创造搭建了广阔舞台。“十四五”期间，重庆引进市外来渝人才37.1万人，人才集聚“磁场效应”持续放大。\n\n　　国际人才组织联合会副主席贺志明称，重庆这座城市保持着发展进步的势头，正以开放包容的胸怀广纳人才。国际人才组织联合会将充分发挥作用，与重庆深化合作，促进国际人才交流，鼓励更多人才来渝拓宽国际视野、把握职业发展新机遇。\n\n　　四川省委常委、组织部部长周立伟表示，成渝地区已成为国家高质量发展的重要增长极，四川将始终坚持“一盘棋”思想、“一家亲”理念，主动对接重庆、全面协同发力，坚定不移携手共筑西部人才高地、共塑区域人才优势、共担国家使命任务。\n\n　　开幕式上，还发布了人才引领驱动“33618”现代制造业集群体系建设标志性成果及教育科技人才一体发展场景清单，为国家人工智能应用中试基地(人力资源领域人力资源服务方向)、人力资源人工智能科创中心揭牌，并向“创赢”系列大赛获奖代表颁奖。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c811c1b0b90","title":"中国生态文明自主知识体系联盟在福建南平成立","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735791.shtml","summary":"中新网南平11月21日电 (记者 张丽君) 由16家科研院所、智库机构联合发起的中国生态文明自主知识体系联盟，21日在福建南平成立。","summary_short":"中新网南平11月21日电 (记者 张丽君) 由16家科研院所、智库机构联合发起的中国生态文明自主知识体系联盟…","digest":"由16家科研院所、智库机构联合发起的中国生态文明自主知识体系联盟…","points":["中新网南平11月21日电 (记者 张丽君) 由16家科研院所…","第四届生态资产管理与中国式现代化战略咨询会同步举行，150余位专家学者…","本次咨询会于11月20日至22日举办，由中国人民大学、南平市人民政府主办…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T18:07:08+08:00","size":1,"keywords":[],"body":"中新网南平11月21日电 (记者 张丽君) 由16家科研院所、智库机构联合发起的中国生态文明自主知识体系联盟，21日在福建南平成立。第四届生态资产管理与中国式现代化战略咨询会同步举行，150余位专家学者、试点城市代表及企业界人士与会。\n\n中国生态文明自主知识体系联盟21日在福建南平成立。中新网记者 张丽君 摄\n\n　　本次咨询会于11月20日至22日举办，由中国人民大学、南平市人民政府主办，以提升中国生态文明理论学理化、体系化水平为主线，推动生态文明理论与实践双向转化。\n\n　　主旨报告环节，专家学者围绕生态资产管理理论创新、绿色低碳转型机制、生态文明思想引领地方实践等方向分享观点。\n\n　　会议期间，还将进行六大专题论坛，议题涵盖生态产品价值实现、国家公园建设、绿色金融、生态环境法典、碳排放双控，以及建构中国生态文明自主知识体系。\n\n　　联盟现场发布六点倡议，坚持自主立根、建构中国特色理论体系；深化协同创新、打造跨界融合科研平台；深耕育人赋能、培育生态文明人才队伍；聚焦实践落地、服务美丽中国建设大局；厚植文化传播、构建中国生态文明的学术话语；健全长效机制、筑牢联盟可持续发展根基。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9ed7280647","title":"新格局下海外华媒共话华文教育新发展","url":"https://www.chinanews.com/hr/shipin/cns/2026/11-21/news1075666.shtml","summary":"近日，以“新格局、新华教、新发展”为主题的第六届世界华文教育大会在海南博鳌召开，共商新形势下华文教育未来发展大计。","summary_short":"近日，以“新格局、新华教、新发展”为主题的第六届世界华文教育大会在海南博鳌召开，共商新形势下华文教育未来发展大计。","digest":"近日，以“新格局、新华教、新发展”为主题的第六届世界华文教育大会在海南博鳌召开…","points":["近日，以“新格局、新华教、新发展”为主题的第六届世界华文教育大会在海南博鳌召开…","“开放新海南 活力自贸港——行走中国·2026海外华文媒体海南行”11月16日至21日在海南…","海外华文媒体代表在参访过程中接受中新社记者采访，立足在地传播经验，分享华文教育发展新思路"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T18:05:26+08:00","size":1,"keywords":[],"body":"近日，以“新格局、新华教、新发展”为主题的第六届世界华文教育大会在海南博鳌召开，共商新形势下华文教育未来发展大计。\n\n“开放新海南 活力自贸港——行走中国·2026海外华文媒体海南行”11月16日至21日在海南开展活动。海外华文媒体代表在参访过程中接受中新社记者采访，立足在地传播经验，分享华文教育发展新思路。\n\n海外华媒代表一致认为，构建海外华文教育新生态，需要华文学校、侨团、华文媒体、国内院校多方协同。海外华文媒体将持续发挥融通中外的独特优势，当好华文教育的“传声筒”、中华文化的“摆渡人”，为文明交流互鉴持续注入华文力量。\n\n林士杰 陈英清 符宇群 张月和 海南综合报道","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/354301F36D8E459FB1CFECE43668CD9B.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c60dd393196","title":"湖南中南大學附屬醫院論文涉AI造假錯漏百出 腫瘤樣本圖片被指像「蝦滑」","url":"https://news.tvb.com/tc/1207633-湖南中南大學附屬醫院論文涉AI造假錯漏百出腫瘤樣本圖片被指像蝦滑","summary":"湖南中南大學的附屬醫院一篇論文被質疑是用人工智能AI生成，內容錯漏百出，甚至腫瘤樣本圖片被指像「蝦滑」。校方事後證實論文涉及偽造數據，已處分涉事研究人員。","summary_short":"湖南中南大學的附屬醫院一篇論文被質疑是用人工智能AI生成，內容錯漏百出，甚至腫瘤樣本圖片被指像「蝦滑」。","digest":"湖南中南大學的附屬醫院一篇論文被質疑是用人工智能AI生成，內容錯漏百出…","points":["校方事後證實論文涉及偽造數據，已處分涉事研究人員","涉事的是這篇關於鼻咽癌的研究論文，去年十二月在國際醫學期刊上發表","近日有內地傳媒揭發論文有多處常識錯誤，包括拼寫錯湖南省的英文"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T17:53+08:00","size":1,"keywords":[],"body":"湖南中南大學的附屬醫院一篇論文被質疑是用人工智能AI生成，內容錯漏百出，甚至腫瘤樣本圖片被指像「蝦滑」。校方事後證實論文涉及偽造數據，已處分涉事研究人員。\n\n涉事的是這篇關於鼻咽癌的研究論文，去年十二月在國際醫學期刊上發表。近日有內地傳媒揭發論文有多處常識錯誤，包括拼寫錯湖南省的英文。\n\n論文附有由實驗白老鼠切除下來的腫瘤圖片，但用來標示大小的直尺，一厘米有十二個毫米格，並非十格。腫瘤的體積及重量亦不符常理，認為腫瘤的AI生成痕跡太明顯，甚至有人調侃是「蝦滑」扮腫瘤。\n\n據內地《財新》報道，論文的第一作者及通訊作者，分別來自中南大學湘雅醫院及湘雅二醫院。中南大學周四在網站通報，指與專家核查後，證實論文偽造、篡改實驗研究數據及圖表，不當署名，違反科研倫理規範，存在學術不端行為。\n\n根據有關規定，向論文第一作者及通訊作者作出處分，包括五年內取消職務職稱晉升、人才計劃申報等資格，十年內不得承擔財政性資金支持科技活動。\n\n內地傳媒報道，中南大學去年起展開撤稿論文自查工作，整理2023年以來的相關論文。早前已公布幾宗學術不端事件，涉及買賣研究數據、圖片使用混亂、不當操作等問題。","image":"https://pro-vod-cdn.tvb.com/0c473545127b4a239e090c05e9d6f2d7/snapshots/c5411ff9f61e42cbae6f070c76bbfa38-00008.jpg","video":"https://pro-vod-cdn.tvb.com/0c473545127b4a239e090c05e9d6f2d7/431b4808d45b4a4f9c05d4c9db6754a8-2d56f5401ff53a4723f1bb9841cc42d3-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/0c473545127b4a239e090c05e9d6f2d7/snapshots/c5411ff9f61e42cbae6f070c76bbfa38-00008.jpg","lang":"zh-Hant"},{"id":"c8e8927f0af","title":"深圳APEC｜英歌7歲女孩莊恩琪C位領舞 2分鐘節目排練上百次｜有片","url":"https://www.stheadline.com/realtime-china/3639632/深圳APEC英歌7歲女孩莊恩琪C位領舞-2分鐘節目排練上百次有片","summary":"在深圳舉行的亞太經合組織（APEC）峰會期間，一眾大國元首夫人被一場熱烈的嶺南非遺表演深深吸引！","summary_short":"在深圳舉行的亞太經合組織（APEC）峰會期間，一眾大國元首夫人被一場熱烈的嶺南非遺表演深深吸引！","digest":"在深圳舉行的亞太經合組織峰會期間，一眾大國元首夫人被一場熱烈的嶺南非遺表演深深吸引","points":["在深圳舉行的亞太經合組織（APEC）峰會期間，一眾大國元首夫人被一場熱烈的嶺南非遺表演深深吸…","曾在香港新春花車巡遊亮相、全網爆紅的7歲汕頭「英歌女孩」莊恩琪擔綱領舞C位…","綜合《羊城晚報》及內地傳媒報道，國家主席習近平夫人彭麗媛於19日上午在深圳灣文化廣場…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:00:00+08:00","size":1,"keywords":[],"body":"在深圳舉行的亞太經合組織（APEC）峰會期間，一眾大國元首夫人被一場熱烈的嶺南非遺表演深深吸引！曾在香港新春花車巡遊亮相、全網爆紅的7歲汕頭「英歌女孩」莊恩琪擔綱領舞C位，其父昨日（20日）透露，為了短短2分鐘演出，恩琪專程赴深圳暫讀4個月、排練逾百次。\n獲多國第一夫人連連鼓掌\n綜合《羊城晚報》及內地傳媒報道，國家主席習近平夫人彭麗媛於19日上午在深圳灣文化廣場，接待智利、韓國、菲律賓及新加坡等國家的「夫人團」。鑼鼓聲響起，身穿傳統服飾的少年兒童舉起醒獅、掄動英歌槌，而在這場高規格迎賓表演中最引人注目的，正是站在正中央領舞C位的7歲小女孩莊恩琪。只見她一手握槌、一手壓住陣腳，帶領同伴騰挪跳躍，動作乾脆利落、眼神凌厲自信，引得現場包括韓國總統夫人金惠景在內的一眾貴賓紛紛展顏歡笑並連連鼓掌。\n相關新聞：深圳APEC｜彭麗媛與「夫人團」參觀嶺南非遺展 嘉賓盛讚中華文化底蘊\n莊恩琪出生於汕頭潮陽區貴嶼鎮，祖父是英歌隊海螺手，父親莊镕強是隊中鑼手。她自幼受家庭薰陶，5歲便掌握整套動作；2024年因在家門口路邊與路過的英歌隊互動共舞而爆紅全網，累積播放量突破100億次。今年年初一，她更受邀隨普寧富美青年英歌隊赴港，在尖沙咀街頭及昂坪市集領舞亮相，深受港人喜愛。\n父感心疼：練到招式入骨\n莊恩琪父親莊镕強昨日接受訪問時透露，早在今年6月底便接到這項重大外事演出任務，全家深感榮幸。由於深圳與汕頭相距甚遠，為了全身心投入彩排，家人7月初便決定安排恩琪前往深圳「暫讀」幼稚園。在長達4個月的時間裏，為了打磨這段僅2分鐘的演出，她與同伴前後排練了上百次，連同日常訓練總時長超逾百小時，不斷優化擊槌的角度與節奏。\n莊镕強坦言，見到年僅7歲的女兒每天高強度訓練，作為父親難免感到心疼，但為了不影響孩子的狀態一直藏在心底。所幸恩琪對英歌舞純粹熱愛，彩排時始終興致勃勃，凝造出的舞台魅力驚艷國際。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6eb2e32a49","title":"聚焦AI攻防变局 第六届新一代通信网内生安全大会12月南京举行","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735758.shtml","summary":"中新网南京11月21日电 (记者 徐珊珊)记者20日从紫金山实验室召开的新闻通气会上获悉，第六届新一代通信网内生安全学术大会暨第九届“强网”拟态防御国际精英挑战赛将于12月3日至6日在南京举办。","summary_short":"中新网南京11月21日电 (记者 徐珊珊)记者20日从紫金山实验室召开的新闻通气会上获悉…","digest":"记者20日从紫金山实验室召开的新闻通气会上获悉…","points":["中新网南京11月21日电 (记者 徐珊珊)记者20日从紫金山实验室召开的新闻通气会上获悉…","同期，还将举办IEEE CRESS2026国际会议","当前，人工智能驱动的网络攻击能力快速演进，依赖查漏补缺的传统防护思路已难以为继"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T16:45:29+08:00","size":1,"keywords":[],"body":"中新网南京11月21日电 (记者 徐珊珊)记者20日从紫金山实验室召开的新闻通气会上获悉，第六届新一代通信网内生安全学术大会暨第九届“强网”拟态防御国际精英挑战赛将于12月3日至6日在南京举办。同期，还将举办IEEE CRESS2026国际会议。\r\n\n　　当前，人工智能驱动的网络攻击能力快速演进，依赖查漏补缺的传统防护思路已难以为继。本次大会以“全面提升新一代通信网安全韧性水平”为总主题，旨在推动网络安全发展范式重构。中国工程院院士邬江兴在通气会上表示，中国原创的内生安全理论以“构造决定安全”为核心，依托动态异构冗余架构，让系统自带免疫能力，有望把安全防护提升为对抗威胁过程中持续可用的“网络韧性”。\n\n　　大会期间，紫金山实验室将集中发布一系列重磅成果。除了“新一代通信网内生安全基站”等重大创新成果，以及系列蓝皮书、专著等理论研究成果外，大会还将与上汽集团联合发布“全球首款搭载内生安全的量产车型”，推动内生安全技术从学术理念走向重大产业应用。\n\n　　作为大会重要组成部分，第九届“强网”拟态防御国际精英挑战赛备受瞩目。南京市委网信办一级调研员魏晓勇介绍，本届赛事紧扣智能化攻防趋势，最突出的变化是把大模型与自主智能体推上攻防一线。决赛将设置Pre6G小基站、天地一体内生安全、内生安全智能网联车、内生安全AI等六大赛道。赛事靶标全部取自云网、车联网、低空无人装备等真实软硬件系统，以人机协同复现未来由AI主导的攻防场景。\n\n　　本次活动坚持学术引领、国际协同、落地导向，将汇聚全球智慧，搭建“以赛促研、以赛验技、以赛聚才”的合作交流平台，集中呈现中国在新一代通信网内生安全领域的原创成果，为全球网络安全治理贡献中国智慧。(完) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ccd62321e96","title":"西藏阿里地区档案馆实现馆藏档案100%数字化","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735768.shtml","summary":"中新网拉萨11月21日电 (李林)20日，阿里地区档案馆介绍，该馆已完成全部全宗、全部门类馆藏档案数字化加工工作，实现馆藏档案数字化全覆盖。","summary_short":"中新网拉萨11月21日电 (李林)20日，阿里地区档案馆介绍，该馆已完成全部全宗、全部门类馆藏档案数字化加工工作…","digest":"20日，阿里地区档案馆介绍，该馆已完成全部全宗、全部门类馆藏档案数字化加工工作…","points":["中新网拉萨11月21日电 (李林)20日，阿里地区档案馆介绍，该馆已完成全部全宗…","此次数字化工作历时五年，覆盖文书、会计、基建、交通、企业退休人事、照片、录音录像…","累计完成纸质档案546598页，数据量3.98TB"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T16:32:32+08:00","size":1,"keywords":[],"body":"中新网拉萨11月21日电 (李林)20日，阿里地区档案馆介绍，该馆已完成全部全宗、全部门类馆藏档案数字化加工工作，实现馆藏档案数字化全覆盖。\n\n　　据悉，此次数字化工作历时五年，覆盖文书、会计、基建、交通、企业退休人事、照片、录音录像、实物等多载体档案，案卷级、文件级目录数据库与全文影像数据一一对应。累计完成纸质档案546598页，数据量3.98TB；录音档案8714分钟，0.84TB；照片档案20384张，0.73TB；录像档案395个，0.16TB；实物档案376个，0.01TB。\n\n　　阿里地区档案馆馆长赵军介绍，将以此次全覆盖为新起点，依托数字档案资源库开展开放鉴定、编研开发，深挖档案价值；常态化做好系统运维、数据校验与备份，筑牢数据安全防线；夯实数字资源底座，推进高水平数字档案馆建设，提升档案收、管、存、用数字化治理水平。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c220927af6e","title":"全球媒体聚焦丨为在变局中谋增长的亚太注入合作新动能","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735764.shtml","summary":"亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心、务实全面的《2026年亚太经合组织领导人深圳展望》(以下简称《深圳展望》)，持续引发外媒关注。","summary_short":"亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心…","digest":"亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心…","points":["亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心…","越南国情多语种对外传播网站(vietnam.vn)11月20日发表评论文章称，在本次会议上…","在全球经济充满不确定性的大背景下，这些合作方向有望为亚太地区增长注入新动能…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T16:26:28+08:00","size":1,"keywords":[],"body":"亚太经合组织第三十三次领导人非正式会议日前在深圳落下帷幕，会议达成富有雄心、务实全面的《2026年亚太经合组织领导人深圳展望》(以下简称《深圳展望》)，持续引发外媒关注。\n\n　　越南国情多语种对外传播网站(vietnam.vn)11月20日发表评论文章称，在本次会议上，各方承诺推进经济一体化、强化供应链韧性、释放新兴技术潜力。在全球经济充满不确定性的大背景下，这些合作方向有望为亚太地区增长注入新动能，也为各成员经济体适应全球经济的深刻变革创造机遇。\n\n　　文章指出，本次会议以“建设亚太共同体，促进共同繁荣”为目标，不仅致力于解决眼前的贸易壁垒，还着力打造一个开放、富有活力且适应性强的经济格局，以应对全球变局。\n\n　　文章称，亚太地区汇聚了全球主要制造业、贸易与技术枢纽，拥有维持增长领先地位的诸多优势。但贸易保护主义抬头、地缘政治紧张局势、供应链中断，都给区域经济一体化带来严峻挑战。在此背景下，APEC21个经济体达成了《深圳展望》，重申推进区域经济一体化、维护供应链韧性，意义重大。\r\n\n　　文章援引昆山杜克大学常务副校长‌约翰·奎尔奇的观点称，《深圳展望》能够把建设亚太共同体的目标，转化为贸易、互联互通、创新等领域的实质合作。\n\n　　文章认为，持续推进亚太自贸区建设，将强化现有贸易机制之间的联动，迈向更加开放的区域经济格局。\n\n　　文章指出，经济一体化是基础，技术和创新则是塑造APEC未来增长的关键驱动力。人工智能、大数据、自动化、数字平台正在重塑生产与商业模式，技术越来越成为提高生产力与竞争力的决定性因素。亚太地区用好技术成果，就能释放大量新增长空间。\n\n　　文章表示，APEC各经济体领导人能够达成成果文件值得肯定。接下来的优先任务是把共同目标落实为具体举措，给企业和民众带来实实在在的好处，从而长期惠及整个亚太地区。\n\n　　文章最后表示，在当今动荡的世界中，加强合作不只是短期应对措施，更是亚太地区巩固自身地位、保持发展势头、迈向共同繁荣的必由之路。\n\n　　来源 | 总台环球资讯\n\n　　编译 | 单立娟 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce0b10bd22d","title":"湖北兴山：有水喝、喝好水，就是村民最踏实的幸福感","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735751.shtml","summary":"中新网宜昌11月21日电 题：湖北兴山：有水喝、喝好水，就是村民最踏实的幸福感  　　作者 张令旗  　　从宜昌市兴山县城出发，驱车约40分钟，一路穿行蜿蜒公路，进入兴山县峡口镇…","summary_short":"中新网宜昌11月21日电 题：湖北兴山：有水喝、喝好水，就是村民最踏实的幸福感  　　作者 张令旗  　　从宜昌市兴山县…","digest":"题：湖北兴山：有水喝、喝好水…","points":["从宜昌市兴山县城出发，驱车约40分钟，一路穿行蜿蜒公路，进入兴山县峡口镇…","这座全县最大的农村标准化水厂，自去年底全面完工投运以来，目前日处理水量达2000吨…","近日，水利部2026年“国之重器 民之三峡”主题活动采访团来到湖北宜昌兴山县…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T15:54:54+08:00","size":1,"keywords":[],"body":"中新网宜昌11月21日电 题：湖北兴山：有水喝、喝好水，就是村民最踏实的幸福感\n\n　　作者 张令旗\n\n　　从宜昌市兴山县城出发，驱车约40分钟，一路穿行蜿蜒公路，进入兴山县峡口镇，来到位于海拔900多米处的琚坪水厂。这座全县最大的农村标准化水厂，自去年底全面完工投运以来，目前日处理水量达2000吨，让村民彻底告别了干旱缺水、远道运水的日子。\n\n　　近日，水利部2026年“国之重器 民之三峡”主题活动采访团来到湖北宜昌兴山县，感受当地“踏实的幸福感”。\n\n　　峡口镇是三峡库区移民乡镇，长期面临水源匮乏、季节性缺水、供水不稳等难题。当地争取三峡后续专项补助资金，实施香溪河右岸峡口段农村水源建设及供水工程。项目采用“多水源+智慧水厂+高压管道”系统方案，新建了总容量4座达2万立方米的蓄水池，并对库容近10万立方米的凉棚岭水库进行系统整治，为区域供水提供了坚实保障。\n\n香溪河右岸峡口段农村水源建设及供水工程平面图。张令旗 摄\n\n　　“水厂通过‘原水-凝聚-絮凝-沉淀-过滤-消毒’工艺，引入信息化监测与控制系统，确保出厂水‘水质优、供水稳’。”兴山县水利局项目办工作人员向正虎介绍，该工程有效解决了峡口镇琚坪村、秀龙村等9个村(居委会)和12家企业共12422人的饮水问题，其中移民1778人，同时为1700亩农田提供灌溉用水。\n\n琚坪水厂。兴山县水利局供图\n\n　　山高坡陡，居住分散，农村供水工程管护曾是老大难。如何让山区群众从“有水喝”迈向“喝好水”？兴山县构建“县域统管公司专业运维+村级管水员属地协管”的分级运维模式，县级公司负责规模化水厂、主干管网的运营与大规模维修；村级管水员负责村级管网、入户水表等设施的日常巡查、小损处置、水费协收和用户诉求响应。通过“三定一签”，即定职责、定标准、定范围、签协议，压实各方责任，每一处供水设施有人管、有人护。\n\n　　“村级管水员由各村村民担任，小村一个，大村两个，凭借人熟、地熟、情况熟的优势，能够快速响应处置村民诉求。”峡口镇秀龙村书记孙龙说。\n\n　　王艳艳一家三口在2002年移民到峡口镇秀龙村。“琚坪水厂建好后，水更清了，也不存在季节性缺水的情况了，有什么问题，一个电话就有人来修了。”王艳艳感慨，“水好了，日子就过得踏实。”\n\n　　搬得出，更要稳得住、能致富。据了解，兴山县通过开发山水资源，发展乡村旅游，打造普安片区乡村振兴示范带，已经形成了普安村“茶光旅+科普研学”、琚坪村“红色文化+绿色农耕”、岩岭村“户外拓展+农旅康养”的发展模式。而琚坪水厂正在为乡村振兴注入源源不断的“水动力”。(完）\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3d3dfa984c","title":"ESG实践与传播高峰对话在杭州举办","url":"https://www.chinanews.com/gn/shipin/2026/11-21/news1075649.shtml","summary":"11月20日，新质时代ESG实践与传播高峰对话在杭州举办，活动聚焦中国式ESG本土化落地、价值转化、可信传播等主题展开研讨。","summary_short":"11月20日，新质时代ESG实践与传播高峰对话在杭州举办，活动聚焦中国式ESG本土化落地、价值转化…","digest":"11月20日，新质时代ESG实践与传播高峰对话在杭州举办…","points":["11月20日，新质时代ESG实践与传播高峰对话在杭州举办，活动聚焦中国式ESG本土化落地…","伴随着全球绿色治理规则迭代和资本市场价值导向转变，与会嘉宾认为…","当日现场同步发布长三角上市企业ESG报告、国有企业ESG报告…"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:50:24+08:00","size":1,"keywords":[],"body":"11月20日，新质时代ESG实践与传播高峰对话在杭州举办，活动聚焦中国式ESG本土化落地、价值转化、可信传播等主题展开研讨。\n\n伴随着全球绿色治理规则迭代和资本市场价值导向转变，与会嘉宾认为，ESG已不只是企业对外披露的“形象工程”，而是夯实治理底座、管控经营风险、对接全球供应链、吸引长期资本的核心要件，也是培育新质生产力、塑造长期竞争优势的重要抓手。\n\n当日现场同步发布长三角上市企业ESG报告、国有企业ESG报告、民营企业ESG报告三份研究成果，为长三角不同主体的ESG建设提供观测样本与行动参考。\n\n吴君毅 毛佳仪 浙江杭州报道","image":"","video":"https://v-oss.cnsimg.net/glob/2026/11/21/cef64746-752e-43c5-b8c2-da82752670bc.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c7f65c913c5","title":"“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动在海口启动","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735743.shtml","summary":"中新网海口11月21日电(黄嘉雯) 烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇。","summary_short":"中新网海口11月21日电(黄嘉雯) 烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇。","digest":"烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇","points":["中新网海口11月21日电(黄嘉雯) 烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇","由中央网信办网络传播局指导，海南省委宣传部、海南省委网信办、海南省委省直机关工委…","2026年是中国共产党成立105周年、中国工农红军长征胜利90周年…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T15:48:58+08:00","size":1,"keywords":[],"body":"中新网海口11月21日电(黄嘉雯) 烽火岁月铸就琼崖革命丰碑，开放潮头续写海南自贸港新篇。由中央网信办网络传播局指导，海南省委宣传部、海南省委网信办、海南省委省直机关工委、海南省委党史研究室(海南省地方志办公室)、共青团海南省委等单位联合主办的“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动启动仪式，于11月20日在海南广播电视总台举行。\n\n启动仪式现场。黄嘉雯 摄\n\n　　2026年是中国共产党成立105周年、中国工农红军长征胜利90周年，也是中共琼崖第一次代表大会召开100周年、海南自贸港全岛封关运作后的首个完整年度。一百年前，中共琼崖第一次代表大会在海口召开，产生中共琼崖地方委员会，海南从此有了党的统一领导。在长期艰苦的革命斗争中，琼崖共产党人铸就了“二十三年红旗不倒”的革命奇迹，形成了“坚定信念、坚持斗争，实事求是、勇于担当，民族团结、共同奋斗”的琼崖精神，这是海南人民战胜一切艰难险阻、取得革命胜利的力量源泉。本次活动旨在深挖琼崖红色文化资源，传承“二十三年红旗不倒”革命精神，赓续红色血脉，展示海南自贸港建设成效，凝聚奋进力量。\n\n　　启动仪式以“一束红星，三条路”为主线，分为“山路”“海路”“新路”三个叙事段落，以情景式宣讲呈现。主题宣传片《红星照耀中国·从琼崖烽火到开放自贸港》以“光”为线索开场，从海口竹林村的一盏油灯、母瑞山密林的火种、渡海船头的马灯，延伸到网络辟谣平台、政策解读短视频、中国洋浦港与封关口岸的通关实景，展现同一束光从历史照进现实的历程。\n\n启动仪式现场的文艺演出。黄嘉雯 摄\n\n　　“山路”段落聚焦革命火种如何存续，由母瑞山革命纪念园终身名誉园长、89岁的王学广以《不老的红心》为题，讲述母瑞山在革命低潮时保住琼崖革命火种的历程。情景表演《红色娘子军》以女子军特务连成立为背景，呈现琼崖女性投身革命的光辉片段。“海路”段落聚焦红旗如何不倒、口岸如何打开，由冯白驹之女冯尔曾以《父辈的青春》为题，讲述冯白驹等琼崖先辈领导琼崖人民坚持“二十三年红旗不倒”的光辉历程。情景歌舞《渡海》以1950年渡海作战兵团强渡琼州海峡为背景，再现木帆船打败军舰、解放全岛的历史瞬间。\n\n　　“新路”段落一头连着网上群众路线，一头连着开放自贸港，讲述红星如何照进万家灯火。海南广播电视总台主持人徐海跃以《营商环境建设的新长征》为题，讲述跟随“营商巴士”深入企业一线，结合保税维修、水产种业等企业诉求推动问题解决，展现海南自贸港封关运作后营商环境持续优化的新气象。吴千斌同志生前同事杨树文以《守好网上群众路线建功海南自由贸易港》为题，讲述吴千斌长期奋战网信一线、打造“椰小探”辟谣IP，在亚沙会网络安全保障中坚守到生命最后一刻的事迹。歌曲《夜空中最亮的星》在杨树文讲述后响起，以“人走了，星还亮着”引发全场共鸣。海南海事局王月亮、汪庆言以《碧海青春守安澜 海事护航启新程》为题，讲述海事青年在海上搜救、防台护航、航天保障中守护蓝色疆域、接力传承的担当。海南大学自贸港新青年宣讲团成员刘璋澄《以青春赴自贸港之约》为题，讲述退役军人、海洋清洁能源团队、封关网络安全团队等青年群体守国土、攻专业、传故事的青春风采。\n\n　　启动仪式环节，嘉宾共同按下启动键。大屏海南地图上，星火从椰子寨初燃，依次点亮母瑞山、红色娘子军纪念园等革命遗址，最终延伸至海南自贸港沿海地标，形成“星火燎原”之势。\n\n　　据了解，启动仪式后，网络主题宣传活动将全面展开。活动将统筹中央重点新闻网站、省属重点网络媒体、国内外网络名人等传播力量，组建全媒体采编团队深入海南各地开展深度调研采访。采访报道紧扣红色传承、开放发展两大主线推进：组织大家深入革命旧址、纪念场馆和基层一线，深挖历史内涵，讲好红色故事；走进口岸、园区、企业和项目现场，见证海南自贸港建设的生动实践，倾听企业发展、群众生活中的真实心声；各参与主体将发挥平台优势和专业特长，创新传播表达，讲好革命文化与开放发展相融共生的海南故事，汇聚网络正能量，书写中国式现代化海南实践新篇章。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc868889d21","title":"岛内舆论高度关注特朗普不支持“台独”表态","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735733.shtml","summary":"中新网11月21日电(燕新台)美国总统特朗普在中美元首19日深圳会晤时明确表示，美国不支持“台独”。","summary_short":"中新网11月21日电(燕新台)美国总统特朗普在中美元首19日深圳会晤时明确表示，美国不支持“台独”。","digest":"美国总统特朗普在中美元首19日深圳会晤时明确表示，美国不支持“台独”","points":["中新网11月21日电(燕新台)美国总统特朗普在中美元首19日深圳会晤时明确表示…","此番涉台表述引发岛内舆论高度关注","台湾“中时新闻网”引述中国国民党副主席萧旭岑观点表示，中美在台湾议题上的共识与方向越来越清晰"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-21T15:36:37+08:00","size":1,"keywords":[],"body":"中新网11月21日电(燕新台)美国总统特朗普在中美元首19日深圳会晤时明确表示，美国不支持“台独”。此番涉台表述引发岛内舆论高度关注。\n\n　　台湾“中时新闻网”引述中国国民党副主席萧旭岑观点表示，中美在台湾议题上的共识与方向越来越清晰。特朗普重申不支持“台独”，对赖清德及其主导的“台独抗中”路线是一大警讯。中国国民党籍民意代表马文君则认为，美国过去虽已讲过不支持“台独”，但现在态度更为明确。\n\n　　台湾《旺报》19日评论称，特朗普5月访华结束后，在接受美国媒体专访和在专机上也曾谈到台湾问题，但与此次正式会谈提出的意义仍有所不同。\n\n　　台湾“中时新闻网”援引学者观点指出，特朗普再次表达不支持“台独”的立场，是对今年5月访华后相关表态的再次确认，且此次释出的信号更加明确，显示美国未来处理台湾问题时将更加谨慎。\r\n\n　　有岛内舆论指出，若赖清德当局误判国际形势，认为凭借高科技产业优势就能让全世界，尤其是西方国家在相关议题上选择“支持台湾”，“其实是很不现实的想法”。\n\n　　另据台湾《联合报》报道，台湾旅美学者翁履中批评，台湾现在最需要的，不是更多的政治表演，而是清楚的战略方向。\n\n　　据此前报道，特朗普在今年5月公开表示不希望看到有人搞“独立”、不想美军跋涉9500英里去打仗、不要当“台独”靠山、不轻易承诺对台军售。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"台灣","total":1,"items":[{"id":"c3875db9773","title":"台湾自媒体人翟翾感叹：何其有幸，我们是中国人！我们中国有个深圳！","url":"https://www.chinanews.com/tw/shipin/2026/11-21/news1075647.shtml","summary":"台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议，世界各地的代表们都想亲自来深圳看看中国速度到底是什么，感受中国的科技发展给社会带来脱胎换骨的动力。","summary_short":"台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议…","digest":"台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议…","points":["台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议…","翟翾则感慨，不少外国人都希望“我的祖国也能有个深圳”，作为中国人“何其有幸”…"],"section":"台灣","category":"台灣","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:12:22+08:00","size":1,"keywords":[],"body":"台湾时事评论员邱世卿近日在节目中与台湾自媒体人翟翾对谈时表示，此次深圳APEC会议，世界各地的代表们都想亲自来深圳看看中国速度到底是什么，感受中国的科技发展给社会带来脱胎换骨的动力。翟翾则感慨，不少外国人都希望“我的祖国也能有个深圳”，作为中国人“何其有幸”，并表示也有很多台湾同胞在深圳发展得非常好。(中新网“燕新台”工作室）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/20/af62ae94-2f54-415b-a0e3-5ce21ef154c0.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"國際","total":24,"items":[{"id":"ca6dbfc2778","title":"伊朗革命衛隊展示地下「導彈城」示威總司令警告：對美打擊僅是開始","url":"https://www.stheadline.com/realtime-world/3639691/伊朗革命衛隊展示地下導彈城示威總司令警告對美打擊僅是開始","summary":"據伊朗伊斯蘭共和國廣播電視台（IRIB）21日公開伊朗革命衛隊（IRGC）地下「導彈城」的影片，革命衛隊航空航天部隊新研發的「雙聯裝導彈發射裝置」（dual-missile launcher）首次亮相…","summary_short":"據伊朗伊斯蘭共和國廣播電視台（IRIB）21日公開伊朗革命衛隊（IRGC）地下「導彈城」的影片…","digest":"據伊朗伊斯蘭共和國廣播電視台21日公開伊朗革命衛隊地下「導彈城」的影片…","points":["據伊朗伊斯蘭共和國廣播電視台（IRIB）21日公開伊朗革命衛隊（IRGC）地下「導彈城」的影…","報道指出，革命衛隊總司令瓦希迪（Ahmad Vahidi）周六首次視察地下「導彈城」…","革命衛隊航空航天部隊指揮官穆薩維（Majid Mousavi）亦陪同視察…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T22:14:34+08:00","size":1,"keywords":[],"body":"據伊朗伊斯蘭共和國廣播電視台（IRIB）21日公開伊朗革命衛隊（IRGC）地下「導彈城」的影片，革命衛隊航空航天部隊新研發的「雙聯裝導彈發射裝置」（dual-missile launcher）首次亮相。\n伊朗革命衛隊總司令視察地下「導彈城」。 IRIB\n報道指出，革命衛隊總司令瓦希迪（Ahmad Vahidi）周六首次視察地下「導彈城」，並即場發表講話，警告美國及其盟友稱，當前對敵人的打擊「僅僅是個開始」，敵人將面臨進一步的羞辱與失敗。\n革命衛隊航空航天部隊指揮官穆薩維（Majid Mousavi）亦陪同視察，並強調部隊已經掌控戰場，隨時做好準備應對任何外部威脅。\n伊朗「導彈城」隧道放滿導彈及發射器。 IRIB\n畫面顯示長長的隧道內，左右兩側整齊排列着連綿不絕的導彈和發射器。伊朗武裝部隊總參謀長阿卜杜拉希（Ali Abdollahi）11月10日，主持了該新型地下「導彈城」的啟用儀式，已展示了包括「法塔赫-1」（Fattah-1）高超音速導彈在內的各類彈道導彈、巡航導彈及偽裝成民用貨車的發射車影像。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c812d84518f","title":"黑客雪櫃攻擊｜惡意調高溫度癱瘓歐洲超市 英國緊急修復漏洞","url":"https://www.stheadline.com/realtime-world/3639680/黑客雪櫃攻擊惡意調高溫度癱瘓歐洲超市-英國緊急修復漏洞","summary":"近日有黑客透過商用雪櫃的系統漏洞，遠端控制惡意調高溫度，導致瑞典、比利時及法國大批超市與倉庫食物報銷。","summary_short":"近日有黑客透過商用雪櫃的系統漏洞，遠端控制惡意調高溫度，導致瑞典、比利時及法國大批超市與倉庫食物報銷。","digest":"近日有黑客透過商用雪櫃的系統漏洞，遠端控制惡意調高溫度，導致瑞典…","points":["近日有黑客透過商用雪櫃的系統漏洞，遠端控制惡意調高溫度，導致瑞典…","英國網絡安全部門檢查當地的商用雪櫃，及時發現並修復了安全漏洞…","相關新聞：法國數百超市遭黑客入侵 雪櫃溫度被調高至50度 部分店舖起火"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T21:06:38+08:00","size":1,"keywords":[],"body":"近日有黑客透過商用雪櫃的系統漏洞，遠端控制惡意調高溫度，導致瑞典、比利時及法國大批超市與倉庫食物報銷。英國網絡安全部門檢查當地的商用雪櫃，及時發現並修復了安全漏洞，成功阻截這場「冷凍危機」蔓延至當地。\n相關新聞：法國數百超市遭黑客入侵 雪櫃溫度被調高至50度 部分店舖起火\n今年10月至11月期間，歐洲多國爆發針對商用製冷系統的網絡襲擊。黑客入侵超市、倉庫和餐廳的雪櫃及冷凍庫系統，惡意調高溫度導致食物變壞，商戶被迫丟棄價值數百萬歐羅的食物。其中法國的災情最為嚴重，確認700 套商用設施遭攻擊，更引發了15宗火災。\n英國最初認為自己在這場危機中能獨善其身，因為英國製冷行業主要採用的設備與歐洲大陸不同。但英國當局與業界合作夥伴深入調查後，驚覺當地系統存在一處關鍵漏洞，隨時可能成為黑客入侵的突破口。\n雪櫃斷網等修復補丁發布\n據英國廣播公司（BBC）報道，此漏洞由網絡安全公司Omega Solutions率先識找到，英國各大連鎖超市緊急斷網，等候修復補丁（Fix）發布。目前相關安全修復程序已開發完成並全面部署。\n法國情報及網絡安全部門直接指控，這波雪櫃攻擊的幕後黑手是伊朗革命衛隊（Revolutionary Guards）。黑客在10月份鎖定法國境內約系統，11月初攻擊擴散至瑞典和比利時。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1116c680b1","title":"中方设备解了我们燃眉之急——委内瑞拉感谢中方支持灾后重建","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735909.shtml","summary":"新华社加拉加斯11月20日电 通讯｜中方设备解了我们燃眉之急——委内瑞拉感谢中方支持灾后重建  　　新华社记者田睿  　　“中国捐赠的重型机械帮助我们移除沉重的混凝土板，解了我们燃眉之急。","summary_short":"新华社加拉加斯11月20日电 通讯｜中方设备解了我们燃眉之急——委内瑞拉感谢中方支持灾后重建  　　新华社记者田睿…","digest":"通讯｜中方设备解了我们燃眉之急——委内瑞拉感谢中方支持灾后重建  　　新华社记者田睿…","points":["“中国捐赠的重型机械帮助我们移除沉重的混凝土板，解了我们燃眉之急","”在委内瑞拉北部拉瓜伊拉州被强震摧毁的一处住宅废墟前…","在阿亚拉身后，5台中国捐赠的重型机械正在断壁残垣间轰鸣运转"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T21:03:51+08:00","size":1,"keywords":[],"body":"新华社加拉加斯11月20日电 通讯｜中方设备解了我们燃眉之急——委内瑞拉感谢中方支持灾后重建\n\n　　新华社记者田睿\n\n　　“中国捐赠的重型机械帮助我们移除沉重的混凝土板，解了我们燃眉之急。”在委内瑞拉北部拉瓜伊拉州被强震摧毁的一处住宅废墟前，清理作业点负责人安吉·阿亚拉20日对新华社记者说。\n\n　　在阿亚拉身后，5台中国捐赠的重型机械正在断壁残垣间轰鸣运转。这栋原本16层高的住宅楼在地震中变成废墟。得益于中国捐赠的重型机械，废墟清理工作在15天前启动。\r\n\n　　6月24日晚，委内瑞拉发生百余年来最强地震，一分钟内出现两次7级以上强震，遇难人数超6000人。\n\n　　“最初废墟清理工作没有重型机械参与，每天只能清理3车，如今清理效率提高到每天40到50车。”阿亚拉说：“我们十分感谢中国政府提供的援助。”\n\n　　废墟前的一片空地上，摆放着救援人员从瓦砾中清理出的各类遗物。不时有遇难者家属前来辨认和领走属于亲人的物件。\n\n　　“我们在清理中没有使用炸药，废墟里还有我们同胞的遗体，他们的家人还在等待我们寻找。”清理现场工作协调员安耶尔·安德拉德说：“有了中国提供的重型机械，预计圣诞节前清理工作就能全部完成。”\n\n　　就在记者准备离开现场时，几名满身尘土的救灾人员快步走上前来，往记者手里塞橘子、矿泉水和几包饼干。他们指着远处仍在轰鸣作业的设备，连声表达着谢意，感谢中国捐赠的重型机械为当地废墟清理和灾后重建提供巨大帮助。\n\n　　10月31日，中国政府援助委内瑞拉第二批人道主义救灾物资移交委方。该批物资主要包括活动板房、重型车辆设备等。\n\n　　根据委内瑞拉政府通报，得益于中国捐赠的重型机械设备，仅在拉瓜伊拉州西蒙·玻利瓦尔国际机场周边就增加了28个废墟清理作业区。目前机场周边共有86个作业区，清理废墟超过47.6万吨。\n\n　　委内瑞拉部长理事会公共工程与服务事务副主席胡安·何塞·拉米雷斯20日在西蒙·玻利瓦尔国际机场附近举行的新闻发布会上说：“中国捐赠的重型机械如雪中送炭。”拉瓜伊拉州州长何塞·特兰同样对中国政府援助表达感谢，“真正的朋友会在危急关头伸出援手”。\n\n　　中国驻委内瑞拉大使蓝虎表示，中国人民对委内瑞拉人民的遭遇感同身受，愿委内瑞拉灾区人民在国际社会的帮助下早日回归正常生活。 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c62901c7c38","title":"数万名日本民众签名反对日本拥有核潜艇","url":"https://www.chinanews.com/gj/shipin/cns-d/2026/11-21/news1075676.shtml","summary":"当地时间11月20日，日本多个民间团体向防卫省递交由约4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。","summary_short":"当地时间11月20日，日本多个民间团体向防卫省递交由约4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇…","digest":"当地时间11月20日…","points":["当地时间11月20日，日本多个民间团体向防卫省递交由约4.7万名日本民众联合签名的材料…","此次联合签名活动由“日本原子力资料情报室”等民间机构和组织共同发起…","联合签名活动声明指出，日本作为唯一遭受过原子弹轰炸的国家，一直宣称有责任推动废除核武器…"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T20:51:55+08:00","size":1,"keywords":[],"body":"当地时间11月20日，日本多个民间团体向防卫省递交由约4.7万名日本民众联合签名的材料，反对日本拥有核动力潜艇，要求政府撤回相关计划。\n\n此次联合签名活动由“日本原子力资料情报室”等民间机构和组织共同发起，在约一个月时间内就征集到约4.7万人签名。\n\n联合签名活动声明指出，日本作为唯一遭受过原子弹轰炸的国家，一直宣称有责任推动废除核武器，而拥有核动力潜艇无异于主动背弃这一承诺。声明表示，强烈要求政府撤回拥有核潜艇的相关计划。\n\n在递交联署材料后的记者会上，民间团体代表表示，日本政府一方面探讨引进核动力潜艇，另一方面又试图为“无核三原则”中“不运进”一项设置例外情况，这一系列相互关联的政策变化，可能从根本上改变日本作为无核武器国家的定位。(记者 朱晨曦 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/0CE6E310F67549CF8AAD585B54C36214.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cf9f29f26cf","title":"菲律宾霍乱病例两周增加69% 卫生部吁保障饮水和食品安全","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735864.shtml","summary":"中新网马尼拉11月21日电 　菲律宾卫生部20日发布报告称，菲律宾霍乱病例近期有所上升，10月11日至24日较此前两周增加69%。","summary_short":"中新网马尼拉11月21日电 　菲律宾卫生部20日发布报告称，菲律宾霍乱病例近期有所上升…","digest":"菲律宾卫生部20日发布报告称，菲律宾霍乱病例近期有所上升…","points":["中新网马尼拉11月21日电 　菲律宾卫生部20日发布报告称，菲律宾霍乱病例近期有所上升…","该部门正密切监测厄尔尼诺现象可能带来的饮水安全风险，呼吁公众注意饮用水和食品安全","截至11月7日，今年累计报告霍乱病例551例，较2025年同期的1421例下降61%…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:27:11+08:00","size":1,"keywords":[],"body":"中新网马尼拉11月21日电 　菲律宾卫生部20日发布报告称，菲律宾霍乱病例近期有所上升，10月11日至24日较此前两周增加69%。该部门正密切监测厄尔尼诺现象可能带来的饮水安全风险，呼吁公众注意饮用水和食品安全。\r\n\n　　菲律宾卫生部流行病学报告显示，10月11日至24日，菲律宾报告霍乱病例27例，较此前两周的16例增加69%。截至11月7日，今年累计报告霍乱病例551例，较2025年同期的1421例下降61%，病死率为2.18%。目前有两个地区因病例超过流行病学阈值且持续增加而受到重点监测。\n\n　　同期，菲律宾报告伤寒病例1141例，较此前两周增加4%。截至11月7日，今年累计报告伤寒病例16432例，同比下降28%，病死率为0.30%。目前，菲律宾10个地区的15个省及高度城市化城市因病例数超过流行病学阈值且持续增加而受到监测。\n\n　　此外，今年1月4日至11月7日，菲律宾累计报告急性血性腹泻病例8601例，较2025年同期下降25%；流感样疾病病例累计报告150187例，同比下降15%；登革热病例累计报告254090例，同比下降9%。\n\n　　菲律宾卫生部表示，厄尔尼诺现象可能影响安全饮用水供应，并改变蚊虫孳生环境，增加相关传染病传播风险。\n\n　　卫生部提醒公众饮用安全水源，确保食物充分煮熟，注意个人卫生。如出现持续发热、严重腹痛、反复呕吐、血便或明显乏力等症状，应及时就医。卫生部还呼吁民众及时清除积水，做好防蚊灭蚊工作，以降低登革热传播风险。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca559c889ca","title":"菲律宾达沃机场发生客机紧急迫降 146人安全撤离","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735857.shtml","summary":"中新网马尼拉11月21日电 一架从中国香港飞往巴布亚新几内亚的客机21日凌晨因右侧发动机出现火警警报，在菲律宾南部达沃国际机场紧急迫降。","summary_short":"中新网马尼拉11月21日电 一架从中国香港飞往巴布亚新几内亚的客机21日凌晨因右侧发动机出现火警警报…","digest":"一架从中国香港飞往巴布亚新几内亚的客机21日凌晨因右侧发动机出现火警警报…","points":["中新网马尼拉11月21日电 一架从中国香港飞往巴布亚新几内亚的客机21日凌晨因右侧发动机出现…","机上146名乘客及机组人员全部安全撤离，无人员受伤","初步检查发现，飞机右侧起落架4个机轮受损"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:26:25+08:00","size":1,"keywords":[],"body":"中新网马尼拉11月21日电 一架从中国香港飞往巴布亚新几内亚的客机21日凌晨因右侧发动机出现火警警报，在菲律宾南部达沃国际机场紧急迫降。机上146名乘客及机组人员全部安全撤离，无人员受伤。初步检查发现，飞机右侧起落架4个机轮受损。\n\n当地时间11月21日，巴布亚新几内亚航空公司涉事客机停靠在菲律宾达沃国际机场。图片来源：《马尼拉公报》\n\n　　菲律宾民航局表示，涉事客机为波音767-383ER型飞机，隶属巴布亚新几内亚航空公司，机上共有137名乘客和9名机组人员。飞机偏离原定航线后，于21日凌晨在达沃国际机场降落。乘客和机组人员随后通过紧急滑梯撤离。\n\n　　菲律宾民航局发言人埃里克·阿波洛尼奥表示，飞行员通过仪表指示发现右侧发动机可能出现火花或起火迹象，随即按照安全程序处置，并申请在达沃国际机场紧急降落。\n\n　　菲律宾民航局已派出航空事故调查人员，调查事故具体情况及原因。\n\n　　为配合应急处置，达沃国际机场一度暂停航班起降，导致两架入境国内航班取消。完成应急处置及跑道安全评估后，机场已恢复运行。(完)\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca847f4f491","title":"港口通、绿电足、智能普惠：深圳APEC交出开放创新高分答卷","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735855.shtml","summary":"中新网11月21日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新网11月21日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新网11月21日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会…","深圳成为继上海、北京之后中国APEC第三城，其所代表的开放联通与创新效率…","2026年以来，深圳港新开通了30条途经APEC经济体航线，持续完善亚太航运线路，7月…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:24:07+08:00","size":1,"keywords":[],"body":"中新网11月21日电 11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳成为继上海、北京之后中国APEC第三城，其所代表的开放联通与创新效率，彰显出亚太合作的韧性与活力。\n\n视频：港口通、绿电足、智能普惠：深圳APEC交出开放创新高分答卷来源：中国新闻网\n\n　　APEC经贸联通持续深化。2026年前10个月，中国对APEC其他经济体货物贸易进出口27.08万亿元，同比增长25.4%。2026年以来，深圳港新开通了30条途经APEC经济体航线，持续完善亚太航运线路，7月，深圳港与10个APEC经济体的16座港口签署《APEC经济体港口友好合作协议》。航线更密、港口更通，亚太合作的实效日益突显。\n\n　　绿色转型在2026年从愿景加速走向规则与行动。2026年9月北京第十六次APEC能源部长会议首次提出并系统阐释“亚太能源共同体”。11月深圳工商领导人峰会通过的《深圳倡议》进一步呼吁“加快建立绿色贸易规则框架，推动向零碳和低碳出行转型，保障绿色供应链稳定、有韧性、顺畅流动”，将绿色规则从能源生产端延伸到贸易与供应链端。此次APEC会议成为绿色转型的示范场景。深圳APEC会议周重要会场、交通枢纽和接待场所实现100%绿电供应。亚太绿色转型正在2026年获得可验证的推进节奏。\n\n　　新能源、人工智能等前沿科技领域如今已成为全球发展的关键驱动力，也是亚太合作的重要议题。此次APEC工商领导人峰会把“共建开放普惠的人工智能创新生态”列为专题研讨议题之一，让技术合作落到普惠共享的尺度上。数智经贸合作如今已成为APEC各方共识基础最扎实、合作氛围最浓厚的领域。工商峰会上，中外嘉宾围绕贸易数字化、人工智能、数字服务等一系列议题深入交流，探讨如何加快创新应用落地与产业深度融合。\n\n　　从港口航线到清洁电力，从产业对接到智能应用，亚太合作在每一次靠港启航、每一度绿电流转、每一项技术落地之中。APEC不是少数经济体的先行游戏，而是各成员共同参与的能力提升与生态共建。开放、创新、合作，亚太共同体建设就在这条联通与共享的航线上向前延伸。多年来，中国在APEC中的角色从参与者逐步走向议程塑造者与公共产品提供者，让亚太共同体从愿景一步步走进港口、走进工厂、走进每一位普通人的生活。(完)\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfddb606a06","title":"洪都拉斯女大學生失蹤揭跨國性販運 3美國人結社罪成","url":"https://www.stheadline.com/realtime-world/3639671/洪都拉斯女大學生失蹤揭跨國性販運-3美國人結社罪成","summary":"洪都拉斯（Honduras）2022年的一宗年輕女大學生失蹤案，牽扯出一個跨國性販運集團。","summary_short":"洪都拉斯（Honduras）2022年的一宗年輕女大學生失蹤案，牽扯出一個跨國性販運集團。","digest":"洪都拉斯（Honduras）2022年的一宗年輕女大學生失蹤案…","points":["洪都拉斯（Honduras）2022年的一宗年輕女大學生失蹤案，牽扯出一個跨國性販運集團","四名與性販運集團「Delta Teams」有關的男子在當地被裁定「刑事結社」罪名成立…","然而，法院裁定其中兩名主犯「人口販運」罪名不成立，檢方強烈抗議並將提出上訴"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:43:59+08:00","size":1,"keywords":[],"body":"洪都拉斯（Honduras）2022年的一宗年輕女大學生失蹤案，牽扯出一個跨國性販運集團。四名與性販運集團「Delta Teams」有關的男子在當地被裁定「刑事結社」罪名成立，包括三名美國公民。然而，法院裁定其中兩名主犯「人口販運」罪名不成立，檢方強烈抗議並將提出上訴；而案中關鍵失蹤女大學生至今仍下落不明。\n水上電單車漂170公里揭發\n被裁定罪名成立的4人，分別是美國公民格林（Harold Green）、默多克（William James Murdock）及約翰斯頓（Gary Lee Johnston），以及洪都拉斯本地男子特雷霍（Gustavo Trejo）。檢方爭取判他們最高10年監禁，法官將於12月9日宣判。\n洪都拉斯Delta Teams跨國性販運案，4名被告出庭應訊。 法新社\n相關新聞：柬埔寨人口販運︱台灣IG網紅7天被性侵9次 遭毒打 迫賣淫 靠社交平台脫險\n此案導火線是22 歲洪都拉斯女大學生佩尼亞（Angie Pena）失蹤。2022年元旦，她在加勒比海旅遊勝地羅阿坦島（Roatan）駕駛水上電單車時神秘失蹤。警方起初懷疑她意外溺斃，但家屬堅信她遭綁架並爭取調查。\n此案因22歲洪都拉斯女大學生佩尼亞（Angie Pena）離奇失蹤而查出。 網上圖片\n數月後，佩尼亞當時駕駛的水上電單車在距離170公里外的鄰國伯利茲（Belize）被尋獲，警方隨即展開人口販運調查。調查發現，佩尼亞不幸落入名為「Delta Teams」的跨國性販運集團魔掌。目前該集團已被瓦解，受害者包括未成年人。\n人口販運罪不成立 檢方將上訴\n4名被告利用社交媒體「物色、招募和運送」女性，被判結社罪成，但法院以證據不足為由，裁定其中2名相信是主犯的美國人（格林及默多克）「人口販運」罪名不成立。洪都拉斯檢方對此表示強烈不滿，已表明會提出上訴。\n相關新聞：微軟亞馬遜高層被揭用公司電郵召妓 美警調查透露涉人口販運\n此案審訊閉門進行，透明度備受質疑。值至注意的是，今年8月一名關鍵受保護證人突遭殺害，隨後有影片流出，指控洪都拉斯檢察官辦公室的特警涉嫌貪腐。\n洪都拉斯目前是拉丁美洲殺害女性率（Femicide）最高的國家，每10萬人就有4，3宗。此案再次暴露出當地女性在尋求司法公正時面臨的重重困境。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c712ac7dc9b","title":"糧食危機｜世糧署：全球近2.7億人嚴重捱餓 明年僅能援助9100萬人","url":"https://www.stheadline.com/realtime-world/3639616/糧食危機世糧署全球近27億人嚴重捱餓-明年僅能援助9100萬人","summary":"聯合國世界糧食計劃署（WFP）周五（20日）表示，計劃在2027年為9,100萬人提供糧食援助，預計需要121億美元資金。","summary_short":"聯合國世界糧食計劃署（WFP）周五（20日）表示，計劃在2027年為9,100萬人提供糧食援助…","digest":"聯合國世界糧食計劃署周五表示，計劃在2027年為9,100萬人提供糧食援助…","points":["聯合國世界糧食計劃署（WFP）周五（20日）表示，計劃在2027年為9…","該機構警告，在資金持續短缺下，將有更多人陷入飢餓，新一輪全球糧食危機或正逼近","相關新聞：超強厄爾尼諾︱今年破壞或達史上新高 全球恐有5千萬人捱餓"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:00:14+08:00","size":1,"keywords":[],"body":"聯合國世界糧食計劃署（WFP）周五（20日）表示，計劃在2027年為9,100萬人提供糧食援助，預計需要121億美元資金。該機構警告，在資金持續短缺下，將有更多人陷入飢餓，新一輪全球糧食危機或正逼近。\n相關新聞：超強厄爾尼諾︱今年破壞或達史上新高 全球恐有5千萬人捱餓\n厄爾尼諾加重饑荒\n糧食署發布的《2027年全球展望》報告顯示，全球至少有2.66億人正面臨嚴重飢餓，當中約3,900萬人更處於緊急或更嚴重的糧食不安全狀況。糧食署助理執行幹事霍林沃思（Matthew Hollingworth）表示，該機構將繼續盡最大努力，為流離失所者、最脆弱群體以及每天挨餓的民眾提供協助。\n然而，由於各國援助預算不斷削減，迫使糧食署必須將有限資源優先分配予處境最危急的人群，其他同樣亟需協助的群體則可能無法獲得支援；在當前嚴峻形勢下，急需援助卻求助無門的人口恐將日益增多。\n與此同時，全球糧食供應鏈正承受多重壓力。地區衝突波及霍爾木茲海峽、曼德海峽及黑海三條重要航運通道，加上「超級厄爾尼諾」現象影響農作物收成，以及燃料和運輸成本上漲，進一步推高全球食品價格。\n霍林沃思警告，繼新冠疫情及俄烏戰爭引發的衝擊後，世界可能很快便會面臨六年內的第三次全球糧食危機。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca67a8e7540","title":"《Batman Returns》蝙蝠車1992版周一拍賣 估值5460萬港元","url":"https://www.stheadline.com/realtime-world/3639618/Batman-Returns蝙蝠車1992版周一拍賣-估值5460萬港元","summary":"1992年經典荷里活電影《蝙蝠俠再戰風雲》（Batman Returns）中，由影星米高基頓（Tim Burton）駕駛的「頭號英雄座駕」原版蝙蝠車，將於下周一（23日）在美國洛杉磯首度公開拍賣。","summary_short":"1992年經典荷里活電影《蝙蝠俠再戰風雲》（Batman Returns）中…","digest":"1992年經典荷里活電影《蝙蝠俠再戰風雲》（Batman Returns）中…","points":["1992年經典荷里活電影《蝙蝠俠再戰風雲》（Batman Returns）中…","拍賣行預料成交價高達700萬美元（折合約5460萬港元）…","劇組當年由改裝車大師卡斯帕團隊定製了3輛蝙蝠車，今次首度拍賣的是負責片中絕大部分在「葛咸城」…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:00:00+08:00","size":1,"keywords":[],"body":"1992年經典荷里活電影《蝙蝠俠再戰風雲》（Batman Returns）中，由影星米高基頓（Tim Burton）駕駛的「頭號英雄座駕」原版蝙蝠車，將於下周一（23日）在美國洛杉磯首度公開拍賣。拍賣行預料成交價高達700萬美元（折合約5460萬港元），一旦成交有望打破塵封多年的最貴蝙蝠車拍賣紀錄。\n配備遙控噴火尾管\n綜合《美聯社》等外電報道，美國朱利安拍賣行（Julien's Auctions）聯同經典電影頻道TCM，將於下周一（23日）在洛杉磯及網上舉行「終極蝙蝠車拍賣會」，主角是由名導添布頓執導、1992年上映的《蝙蝠俠再戰風雲》（Batman Returns）原版蝙蝠車。\n劇組當年由改裝車大師卡斯帕團隊定製了3輛蝙蝠車，今次首度拍賣的是負責片中絕大部分在「葛咸城」飛車鏡頭的「頭號英雄座駕」。該車全長約6米，由兩具雪佛蘭（Chevrolet）Impala底盤拼接而成，搭載雪佛蘭V8引擎及3速自動波箱，配以手工玻璃纖維全黑車身、噴射渦輪造型車頭及兩片流線型蝙蝠尾翼，更設有無綫電遙控的噴火排氣系統，可噴出逾20呎真實火焰。\n不符道路法規禁上路\n拍賣行估計，該車成交價介乎500萬至700萬美元（約3900萬至5460萬港元），有望打破1966年電視版蝙蝠車於2013年創下的462萬美元（約3600萬港元）紀錄。\n不過，雖然該車具備實際行駛性能，但因不符合現行道路駕駛法例，買家只能擁有收藏，不能合法駕駛它在馬路上行駛。\n同場拍賣原版蝙蝠戰衣\n同場亦會拍賣多件超級英雄電影道具，包括《蝙蝠俠再戰風雲》原版蝙蝠戰衣與頭罩、1989年《蝙蝠俠》蝙蝠車模型、蝙蝠爪鈎槍，以及《美國隊長》盾牌、《幽靈刺客》太陽眼鏡及1987年《超人第四集》超人戰衣等。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c16143c8278","title":"特朗普、普京、李在明等APEC与会领导人感谢中国，点赞深圳：“这是历史性的一页”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735832.shtml","summary":"中新网11月21日电 风从大洋来，潮起珠江畔。","summary_short":"中新网11月21日电 风从大洋来，潮起珠江畔。","digest":"风从大洋来，潮起珠江畔","points":["中新网11月21日电 风从大洋来，潮起珠江畔","连日来，世界的目光投向了中国、聚焦深圳","11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-21T18:41:47+08:00","size":1,"keywords":[],"body":"中新网11月21日电 风从大洋来，潮起珠江畔。连日来，世界的目光投向了中国、聚焦深圳。\n\n　　11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。这是中国第三次、也是时隔12年再次担任APEC东道主。\n\n　　美国总统特朗普、俄罗斯总统普京、马来西亚总理安瓦尔、韩国总统李在明……与会领导人共赴深圳之约，并接连表态，感谢中国、点赞深圳。\n\n　　美国总统特朗普：“非常精彩且影响深远的访问”\n\n　　11月19日，美国总统特朗普结束深圳行，启程离开中国。特朗普在返美途中发文称，“这是一次非常精彩且影响深远的访问。”\n\n　　白宫援引特朗普的这条帖文时同样表示，此行意义深远。在另一条帖文中，白宫发布特朗普启程返美的图片。图片显示，特朗普在专机舱门前，做出了标志性的挥拳动作。\n\n　　白宫还表示，特朗普此行具有历史性意义。\n\n11月18日，美国总统特朗普抵达深圳。 中新社记者 富田 摄\n\n　　俄罗斯总统普京：“外交史上的一页”\n\n　　据俄罗斯卫星通讯社报道，11月18日至19日，俄罗斯总统普京前往深圳出席亚太经合组织第三十三次领导人非正式会议。\n\n　　普京在结束深圳工作行程后举行的记者会上说，此次会议“取得了积极成果”，讨论了有关方共同关心的议题。普京指出，与亚太经合组织合作对俄罗斯意义重大。\n\n　　据报道，谈及中俄美元首会晤，普京说，“这无疑是外交史上的一页。”\n\n　　俄罗斯卫星通讯社还报道称，普京感谢中方出色主办APEC会议。\n\n11月18日，俄罗斯总统普京访问深圳北理莫斯科大学，并发表演讲。 中新社记者 张祥毅 摄\n\n　　马来西亚总理安瓦尔：呼吁合作与开放\n\n　　马来西亚总理安瓦尔在社交媒体上发文介绍说，在访问深圳期间，他与多家中国高科技企业相关方会面，探讨了在马来西亚拓展业务、提升产能以及新的投资机会等。\n\n　　安瓦尔还发文称，他在出席亚太经合组织工商领导人峰会时强调了合作与开放。他希望中国同东南亚国家联合开展创新研究，扩大在人工智能和数字化转型等领域合作。\n\n图片来源：马来西亚总理安瓦尔社交媒体截图\n\n　　墨西哥总统辛鲍姆：呼吁携手合作、共享繁荣\n\n　　墨西哥总统辛鲍姆在社交媒体上发布了自己乘机抵达中国深圳的现场视频。视频中，辛鲍姆面带笑容，迎宾青年热情迎接。\n\n　　辛鲍姆还发文谈到，她在亚太经合组织工商领导人峰会上致辞。据此前报道，辛鲍姆在发言中表示，一个国家的发展不应意味着另一个国家的衰落或停滞，而应携手合作、共享繁荣。在相互联通的世界里，应当通过合作、贸易、投资和知识交流，不断增强所有经济体的能力。\n\n11月16日，墨西哥总统辛鲍姆(左)乘机抵达深圳。中新社记者 陈骥旻 摄\n\n　　韩国总统李在明：感谢中方热情接待\n\n　　出席会议期间，韩国总统李在明在社交媒体发布了多条帖文，介绍自己的在华活动，并感谢东道主中国给予的热情接待。他表示，愿以2027年两国建交35周年为契机，推动韩中关系向前发展。\n\n　　李在明在另一条帖文中还写道，“开放、创新、合作！我们将秉持APEC的基本精神携手共创繁荣未来。”\n\n11月18日，韩国总统李在明抵达深圳。中新社记者 侯宇 摄\n\n　　泰国总理阿努廷：呼吁加强互联互通\n\n　　泰国外交部在社交媒体上发布了多条帖文，分享了泰国总理阿努廷的深圳之行。帖文指出，泰国强调，应通过创新发展、技能培养以及绿色转型来增强经济韧性。\n\n　　泰国总理阿努廷还呼吁加强经济与数字贸易互联互通，联手打击网络诈骗及金融欺诈，维护供应链韧性，实现包容性增长。\n\n11月18日，泰国总理阿努廷抵达深圳。中新社记者 陈骥旻 摄\n\n　　加拿大总理卡尼：展望未来，期待更多合作\n\n　　加拿大总理卡尼在社交媒体上分享了此次来华的多条图文和视频。\n\n　　卡尼表示，同中方回顾了双方在贸易、能源、旅游和文化领域取得的进展，并展望未来，聚焦于两国能实现更多合作成果的领域。\n\n　　卡尼还写道，加方将与亚太地区伙伴携手合作，通过基础设施、制度和人员的互联互通，进一步促进各国经济之间的紧密联系。\n\n11月16日晚，加拿大总理卡尼(中)抵达深圳。中新社记者 侯宇 摄\n\n　　秘鲁总统藤森庆子：感谢中方邀请和热情欢迎\n\n　　秘鲁总统藤森庆子在社交媒体上接连发文，感谢中方邀请和热情欢迎。帖文称，此次访问有助于加强两国关系，拓展在技术和基础设施等领域的合作。\n\n　　藤森庆子还介绍说，她与中方主要的商界领袖举行了“非凡的会晤”，共同重申继续携手合作的决心和承诺。\n\n图片来源：秘鲁总统藤森庆子社交媒体截图\n\n　　新加坡总理黄循财：新中携手，共创开放互联的未来\n\n　　据新加坡《联合早报》报道，新加坡总理黄循财11月18日起赴中国进行工作访问。这是他2024年主政以来第三次访华。\n\n　　据报道，黄循财发表了题为《新中携手，共创开放互联的未来》中英署名文章，回顾了新中关系并展望两国潜在合作方向。\n\n　　黄循财认为，新中仍有很大的合作空间，也面临许多共同挑战。他进一步指出，这些挑战可为两国带来新合作契机，尤其是在推动各行业应用人工智能，以及开发其他新兴科技方面。\n\n新加坡总理黄循财(前排左)于11月18日抵达深圳。图片来源：新加坡《联合早报》报道截图\n\n　　智利总统卡斯特：智中之间有着兄弟般的情谊\n\n　　智利总统卡斯特发文称，在中国深圳出席了亚太经合组织工商领导人峰会。他表示，智利寻求加强合作，开拓新的贸易和投资机遇。\n\n　　卡斯特此前还发文称，“智利和中国之间有着兄弟般的情谊和相互尊重的历史关系，更重要的是，两国拥有共同发展、共同繁荣的未来。”\n\n11月18日，智利总统卡斯特到访深圳一家百果园门店，见证车厘子新产季在中国开启。图为智利总统卡斯特(中)展示车厘子。 中新社记者 陈楚红 摄\n\n　　澳大利亚总理阿尔巴尼斯：澳中关系具有重要意义\n\n　　澳大利亚总理阿尔巴尼斯在社交平台上发文称，感谢中方举行了“富有建设性的会议”。\n\n　　阿尔巴尼斯还表示，澳中关系对澳大利亚经济及地区安全稳定具有重要意义。\n\n11月18日，澳大利亚总理阿尔巴尼斯抵达深圳。中新社记者 陈骥旻 摄\n\n　　印度尼西亚总统普拉博沃：愿不断深化对华合作\n\n　　据新华社报道，印度尼西亚总统普拉博沃表示，祝贺中方成功主办亚太经合组织领导人非正式会议，引领亚太合作取得新进展。\n\n　　普拉博沃还表示，印尼政府和人民感谢中方长期以来为印尼经济社会发展提供支持，愿不断深化对华合作。印尼衷心欢迎中资企业赴印尼投资兴业，将致力于提供可靠稳定、可预期的营商环境。\n\n11月18日，印度尼西亚总统普拉博沃抵达深圳。 中新社记者 陈骥旻 摄\n\n　　越南媒体：苏林此访进一步深化越中关系\n\n　　据越通社报道，越共中央总书记、国家主席苏林在深圳出席亚太经合组织第三十三次领导人非正式会议。\n\n　　报道称，此访通过高层外交、多边合作和经贸科技交流，进一步深化越中关系。\n\n11月17日，越共中央总书记、国家主席苏林抵达深圳。中新社记者 陈骥旻 摄\n\n 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfa9c188962","title":"印度東北部至少11人飲假酒中毒死亡逾百人入院 當局承諾懲處肇事者","url":"https://news.tvb.com/tc/1207624-印度東北部至少11人飲假酒中毒死亡逾百人入院當局承諾懲處肇事者","summary":"印度東北部至少11人飲假酒後中毒死亡，另外181人入院。事發在曼尼普爾邦，首席部長辛格到醫院探望因為飲假酒而入院的人。","summary_short":"印度東北部至少11人飲假酒後中毒死亡，另外181人入院。","digest":"印度東北部至少11人飲假酒後中毒死亡，另外181人入院","points":["事發在曼尼普爾邦，首席部長辛格到醫院探望因為飲假酒而入院的人","他指政府將展開調查，並承諾逮捕及懲處肇事者，又下令醫護人員確保向患者提供合適治療及必要的支援","當局亦建議民眾避免飲用本地釀製，或來源地可疑的酒精產品"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T17:25+08:00","size":1,"keywords":[],"body":"印度東北部至少11人飲假酒後中毒死亡，另外181人入院。\n\n事發在曼尼普爾邦，首席部長辛格到醫院探望因為飲假酒而入院的人。他指政府將展開調查，並承諾逮捕及懲處肇事者，又下令醫護人員確保向患者提供合適治療及必要的支援。當局亦建議民眾避免飲用本地釀製，或來源地可疑的酒精產品。\n\n印度不時發生假酒中毒事件，民眾飲用經非正規渠道銷售、可能含高濃度甲醇的廉價酒精產品，導致失明、肝臟受損，甚至死亡。","image":"https://pro-vod-cdn.tvb.com/d04bb54840214e9896e1faf6b3d820bf/snapshots/f6c54bbf666145f4a0a63547cdaadf30-00005.jpg","video":"https://pro-vod-cdn.tvb.com/d04bb54840214e9896e1faf6b3d820bf/b53ca8251be249dda6248c0920dcf7b3-7033491acfd93cb093de5f5380ddbc17-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/d04bb54840214e9896e1faf6b3d820bf/snapshots/f6c54bbf666145f4a0a63547cdaadf30-00005.jpg","lang":"zh-Hant"},{"id":"c184e32f5bb","title":"日本北部及東部暴雪影響交通 據報福島縣逾千人被困包括數百名酒店旅客","url":"https://news.tvb.com/tc/1207623-日本北部及東部暴雪影響交通據報福島縣逾千人被困包括數百名酒店旅客","summary":"日本北部和東部山區暴雪，其中福島縣有大雪壓倒樹木，阻塞部分公路要封閉。共同社報道，超過一千人被困，包括幾百名酒店旅客。","summary_short":"日本北部和東部山區暴雪，其中福島縣有大雪壓倒樹木，阻塞部分公路要封閉。","digest":"日本北部和東部山區暴雪，其中福島縣有大雪壓倒樹木，阻塞部分公路要封閉","points":["日本北部和東部山區暴雪，其中福島縣有大雪壓倒樹木，阻塞部分公路要封閉","共同社報道，超過一千人被困，包括幾百名酒店旅客","受寒流影響，北部和東部山區降雪量增加，山形縣、岩手縣等地積雪逾50厘米"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T17:16+08:00","size":1,"keywords":[],"body":"日本北部和東部山區暴雪，其中福島縣有大雪壓倒樹木，阻塞部分公路要封閉。共同社報道，超過一千人被困，包括幾百名酒店旅客。\n\n日本長野縣有居民忙著清理積雪，北海道等地大雪紛飛。受寒流影響，北部和東部山區降雪量增加，山形縣、岩手縣等地積雪逾50厘米。當地傳媒報道，山形縣東根市一條公路，昨天下午有貨車因積雪受困，影響後面數十架車一度滯留。\n\n惡劣天氣亦令部分鐵路暫停營運，連接福島和新潟縣的JR磐越西線，有列車昨晚撞到倒塌的樹木後出軌，鐵路公司指沒有人受傷。\n\n福島縣亦因為樹木倒塌，阻塞部分道路，北鹽原村一個度假區和附近地區有不少人被困，當局加緊鏟雪和清理工作。\n\n至於新潟縣就持續下雨，截至當地今早72小時內，降雨量逾240毫米，創歷來11月最高降雨量。氣象廳對新潟縣部分地區發布4級危險警報，預計新潟縣明日將繼續有強降雨，山區將繼續下雪，明日中午24小時內降雪量將達到40厘米。\n\n當局警告道路狀況危險，呼籲民眾提高警覺，防範山泥傾瀉和雪崩等災害。","image":"https://pro-vod-cdn.tvb.com/001151d89535423e96a288eef4e80518/snapshots/259d4b27b65e49b68844d60cd4f3b1bc-00008.jpg","video":"https://pro-vod-cdn.tvb.com/001151d89535423e96a288eef4e80518/cf9f75e909cd46adbb4c4a80a4793eaf-4e27b2798e18748d02f4d7bb0d4b526b-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/001151d89535423e96a288eef4e80518/snapshots/259d4b27b65e49b68844d60cd4f3b1bc-00008.jpg","lang":"zh-Hant"},{"id":"c3d8cb3b789","title":"黃仁勳辭職︱子女仍任輝達高管 專家：夾在父親公司之間 處境尷尬","url":"https://www.stheadline.com/realtime-world/3639629/黃仁勳辭職子女仍任輝達高管-專家夾在父親公司之間-處境尷尬","summary":"輝達（Nvidia）創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁，但兒子黃勝斌（Spencer Huang）、女兒黃敏珊（Madison Huang）及女婿仍任輝達高層…","summary_short":"輝達（Nvidia）創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁…","digest":"輝達創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁…","points":["輝達（Nvidia）創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁…","專家指出，他們既要對父親忠誠，也該對公司忠誠，目前陷入兩難","相關新聞：黃仁勳出軌｜分析：Nvidia家族企業色彩濃 無董事長未有繼任人計劃"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T16:39:48+08:00","size":1,"keywords":[],"body":"輝達（Nvidia）創辦人黃仁勳的婚外情醜聞震驚科技業，他在11月12日辭任行政總裁，但兒子黃勝斌（Spencer Huang）、女兒黃敏珊（Madison Huang）及女婿仍任輝達高層，各自年薪逾百萬美元。專家指出，他們既要對父親忠誠，也該對公司忠誠，目前陷入兩難。\n相關新聞：黃仁勳出軌｜分析：Nvidia家族企業色彩濃 無董事長未有繼任人計劃\n美國國會正調查黃仁勳與黃樂的關係。美聯社\n黃仁勳與黃樂爆出婚外情醜聞，2人舉止親密。路透社\n黃仁勳（右2）婚外情風波核心人物黃樂（後右3）2024年COMPUTEX台北國際電腦展會後派對時，兩人被拍到坐在一起。路透社\n\n黃敏珊向丈夫拿自己的手機，為二人拍攝合照。X\n黃敏珊與黃樂談笑，氣氛融洽。X\n黃敏珊幫二人拍攝合照。X\n公司內部視為「皇族」\n根據輝達今年5月申報的關係人交易揭露文件，36歲的黃勝斌年薪約130萬美元（約1020萬港元），是輝達機械人事業群產品管理總監；35歲的黃敏珊年薪約120萬美元（約940萬港元），職銜是實體AI產品行銷資深總監。\n\n黃勝斌畢業於芝加哥哥倫比亞藝術學院，曾在台北創辦廣受好評的調酒酒吧「R&D Cocktail Lab」，後赴紐約大學取得MBA學位才加入輝達機械人部門。而黃敏珊則出身美國廚藝學院，當過侍酒師，曾加入LVMH集團負責精品飯店行銷，前往倫敦商學院攻讀MBA後，2020年以實習生身分加入輝達。她的丈夫、瑞士前高山滑雪國手卡普雷茲（Nico Caprez）同樣任職輝達，是資料中心開發商關係副總裁。\n\n相關新聞：黃仁勳出軌對象是誰？ 黃樂自稱曾任媒體、金融業、Megaspeed高層 背景神秘曝光\n黃敏珊替父管理形象惹高層不滿\n父親去職後，外界不免更嚴格檢視兩人的角色與影響力。輝達立場是他們沒有「靠父蔭」，但《華爾街日報》引述知情人士指出，黃家子女在公司內被當成「皇族」對待。《紐約時報》則爆料，黃敏珊在父親醜聞升溫期間介入形象管理，引發同事不滿，過去3年已有逾10名高層因不願與她共事而離職。\n加州大學爾灣分校商學院榮譽教授皮爾斯（Jone Pearce）直言，「就我來看這當然是裙帶關係」，如今兩人處境尷尬，「他們既要對父親忠誠，也該對組織忠誠，這令他們陷入兩難。」但她也補充，受惠於家族關係者往往揹負不公平的惡名，「但這不代表他們沒有能力。正因為知道別人會不服氣，他們通常會加倍努力。」\n知情人士透露，黃仁勳離職後，子女如常上班，黃敏珊本周赴亞利桑那州出差。兩人18日全員大會當天都有在辦公室現身，但對父親下台一事至今未公開表態。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb06c6a5430","title":"澳洲即將正式踏入南半球夏天 最新報告指45歲以上男性遇溺風險最高","url":"https://news.tvb.com/tc/1207613-澳洲即將正式踏入南半球夏天最新報告指45歲以上男性遇溺風險最高","summary":"還有個多星期，澳洲正式踏入南半球夏天，最新的國家海岸安全報告顯示，45歲以上男性遇溺風險最高。隨著天氣轉熱，越來越多澳洲人選擇到海灘消暑，有救生員提醒公眾，下水時必須保障好自身安全，又指很多在水中發生的意外，其實都是可以避免。","summary_short":"還有個多星期，澳洲正式踏入南半球夏天，最新的國家海岸安全報告顯示，45歲以上男性遇溺風險最高。","digest":"還有個多星期，澳洲正式踏入南半球夏天，最新的國家海岸安全報告顯示…","points":["隨著天氣轉熱，越來越多澳洲人選擇到海灘消暑，有救生員提醒公眾，下水時必須保障好自身安全…","救生員默里說：「如果我們必須進入水中，通常是在風險較高的區域，去執行救援…","最新的《全國海岸安全報告》顯示，過去12個月內，澳洲沿海地區共有151人溺斃…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T16:20+08:00","size":1,"keywords":[],"body":"還有個多星期，澳洲正式踏入南半球夏天，最新的國家海岸安全報告顯示，45歲以上男性遇溺風險最高。\n\n隨著天氣轉熱，越來越多澳洲人選擇到海灘消暑，有救生員提醒公眾，下水時必須保障好自身安全，又指很多在水中發生的意外，其實都是可以避免。\n\n救生員默里說：「如果我們必須進入水中，通常是在風險較高的區域，去執行救援，這也會讓救援人員自身陷入險境，而很多時候，這類情況其實是可以避免。」\n\n最新的《全國海岸安全報告》顯示，過去12個月內，澳洲沿海地區共有151人溺斃，當中大部分為男性，而且超過一半人年齡在45歲以上。\n\n澳洲衝浪救生協會行政總裁維爾說：「去海邊時千萬別做那種人，別做那種冒不必要風險的人，也別做那種在無人巡邏海灘下水的人。」\n\n澳洲衝浪救生組織呼籲公眾加強關注海灘安全事宜。\n\n澳洲救生鐵人賽冠軍得主亨迪說：「人們往往會高估自己當下的能力，卻低估了現場的環境狀況，轉眼間，人就已經被捲入離岸流之中，情況瞬間變得完全不同了。一旦臉上被濺到水，加上其他種種狀況，你就不再是剛開始那個充滿自信的人了。」\n\n除了要小心遇溺，泳客亦要小心提防鯊魚出沒，專家警告，受厄爾尼諾現象影響，今年海水溫度比往年高，可能導致公牛鯊更早游到澳洲沿海地區，而停留時間亦可能較往年長。\n\n麥覺理大學教授哈考特說：「如果你在旗幟標示的區域內游泳，而該處又有航拍機監控，那麼你的安全保障會好得多，但如果水質非常混濁，航拍機就無法發揮作用，所以在大雨過後，這正是鯊魚覓食的時候，這時你絕對不應該下水。」\n\n當局亦因應鯊魚可能出沒，加強監測工作，包括部署超過70架無人機，配合人工智能偵測技術，在約100個海灘加強巡邏。","image":"https://pro-vod-cdn.tvb.com/fea0f3ce75b0484888f2bee2e0fee377/snapshots/a2e17c1efcc142d18cdabdf783683130-00008.jpg","video":"https://pro-vod-cdn.tvb.com/fea0f3ce75b0484888f2bee2e0fee377/2f3c61d64e3a4adc8d43fd45c333de77-a25c7906ef685e3171cac41606fe2266-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/fea0f3ce75b0484888f2bee2e0fee377/snapshots/a2e17c1efcc142d18cdabdf783683130-00008.jpg","lang":"zh-Hant"},{"id":"cfe2fc545b2","title":"印尼青年体验中国茶艺 感受传统文化魅力","url":"https://www.chinanews.com/gj/shipin/cns-d/2026/11-21/news1075656.shtml","summary":"当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场，来自当地高校的青年学生和民众参与茶艺小课堂，在中国茶艺老师指导下了解中国茶文化，学习茶艺知识和冲泡技巧。","summary_short":"当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场…","digest":"当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场…","points":["当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场…","参与者通过观茶、闻香、品茶等环节，近距离体验中国茶文化，在一盏清茶中感受中国传统文化的韵味"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T16:13:06+08:00","size":1,"keywords":[],"body":"当地时间11月20日，在印度尼西亚雅加达举行的心联通·文互鉴“讲中国故事”活动现场，来自当地高校的青年学生和民众参与茶艺小课堂，在中国茶艺老师指导下了解中国茶文化，学习茶艺知识和冲泡技巧。\n\n参与者通过观茶、闻香、品茶等环节，近距离体验中国茶文化，在一盏清茶中感受中国传统文化的韵味。(李志全 魏之强 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/7B4143563F154653BD363A67338BA10F.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c4dc49e04df","title":"国际电信联盟机构代表：中国在国际电联标准制定中扮演着重要角色｜新闻会客厅","url":"https://www.chinanews.com/gj/shipin/2026/11-21/news1075648.shtml","summary":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。","summary_short":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。","digest":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行","points":["《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行","国际电信联盟(ITU)电信标准化部门、信息通信技术与气候变化工作组副主席让·曼努埃尔·卡内接…","他呼吁世界各国共同采取行动，参与人工智能(AI)治理…"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T15:27:02+08:00","size":1,"keywords":[],"body":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。国际电信联盟(ITU)电信标准化部门、信息通信技术与气候变化工作组副主席让·曼努埃尔·卡内接受中新社“新闻会客厅”栏目采访时表示，中国以及中国的产业主体，都在国际电联标准制定中发挥着重要的作用。同时，他呼吁世界各国共同采取行动，参与人工智能(AI)治理，以确保人工智能(AI)朝着有益于人类的方向发展。","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/18EF7DF72384489F8E387966B2D55A02.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c3becdd3217","title":"秘魯中部6.7級地震 首都利馬震感強烈","url":"https://news.tvb.com/tc/1207579-秘魯中部67級地震首都利馬震感強烈","summary":"[15:15更新]秘魯中部發生6.7級地震，首都利馬有強烈震感，暫時未有傷亡報告。地震發生時，利馬有閉路電視鏡頭不斷震動。","summary_short":"[15:15更新]秘魯中部發生6.7級地震，首都利馬有強烈震感，暫時未有傷亡報告。","digest":"[15:15更新]秘魯中部發生6.7級地震，首都利馬有強烈震感，暫時未有傷亡報告","points":["地震發生時，利馬有閉路電視鏡頭不斷震動","當地電視台報道，部分民眾走到戶外暫避","地震在當地周五晚上7時09分發生，震央位於胡寧省胡寧市西北部30公里，震源深度約129公里"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T15:15+08:00","size":1,"keywords":[],"body":"[15:15更新]\n秘魯中部發生6.7級地震，首都利馬有強烈震感，暫時未有傷亡報告。\n\n地震發生時，利馬有閉路電視鏡頭不斷震動。當地電視台報道，部分民眾走到戶外暫避。\n\n地震在當地周五晚上7時09分發生，震央位於胡寧省胡寧市西北部30公里，震源深度約129公里。新華社引述秘魯地球物理研究所測定，利馬等震感強烈。\n\n[08:32]\n秘魯發生6.7級地震，首都利馬震感強烈。","image":"https://pro-vod-cdn.tvb.com/4f2bd08d4be44bf9a97792caf6ad966a/snapshots/c4c7cd81d85a42108021d3fd7faebaf3-00003.jpg","video":"https://pro-vod-cdn.tvb.com/4f2bd08d4be44bf9a97792caf6ad966a/d208a8a31cd74c639e142720912203ce-5bf020e8e3844a8bc60cbd3171256324-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/4f2bd08d4be44bf9a97792caf6ad966a/snapshots/c4c7cd81d85a42108021d3fd7faebaf3-00003.jpg","lang":"zh-Hant"},{"id":"c04213563a2","title":"歐洲多國民眾示威罷工 交通等公共服務受影響","url":"https://www.stheadline.com/realtime-world/3639593/歐洲多國民眾示威罷工-交通等公共服務受影響","summary":"德國、英國、法國、意大利、瑞士、西班牙及葡萄牙等歐洲多國年輕民眾周五（20日）舉行示威和罷工活動，宣洩對高生活成本、軍費支出及氣候危機等議題的憤怒，要求關注年輕世代的福祉…","summary_short":"德國、英國、法國、意大利、瑞士、西班牙及葡萄牙等歐洲多國年輕民眾周五（20日）舉行示威和罷工活動，宣洩對高生活成本…","digest":"德國、英國、法國、意大利、瑞士…","points":["德國、英國、法國、意大利、瑞士、西班牙及葡萄牙等歐洲多國年輕民眾周五（20日）舉行示威和罷工…","部分國家的交通、醫療和教育等公共服務受到影響","示威者走上各國城市街頭，許多人揮舞寫有「為我們的未來而戰」的標語牌，點燃照明彈…"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:37:24+08:00","size":1,"keywords":[],"body":"德國、英國、法國、意大利、瑞士、西班牙及葡萄牙等歐洲多國年輕民眾周五（20日）舉行示威和罷工活動，宣洩對高生活成本、軍費支出及氣候危機等議題的憤怒，要求關注年輕世代的福祉，增加公共服務投入和提高工資以改善民生，呼籲減少國防開支。部分國家的交通、醫療和教育等公共服務受到影響。\n示威者走上各國城市街頭，許多人揮舞寫有「為我們的未來而戰」的標語牌，點燃照明彈，焚燒坦克的紙板模型。這些集會由一個由青年主導、由超過50個團體組成的聯盟協調，其訴求因地而異，包括以色列在加沙的戰爭、高昂的租金，以及學校和大學日益惡化的學習條件。\n意大利有示威者與警員衝突，警員施放水炮驅散。美聯社\n示威者呼籲減少國防開支。路透社\n倫敦特拉法加廣場有民眾示威。新華社\n德國漢堡示𢦡者人頭湧湧。路透社\n年輕世代主導示威 要求增加教育開支\n德國柏林、科隆、法蘭克福、慕尼黑等數十個城市均有民眾上街示威，反對恢復兵役制和削減教育經費，並就校舍修繕、教育公平和住房負擔等表達訴求。柏林警方說，約有4500人參加示威遊行，警方出動約1600名警力維持秩序。\n英國倫敦也舉行抗議活動，數百名抗議者，其中部分穿著校服，在倫敦國會外及鄰近的特拉法加廣場聚集示威，揮舞標語牌，上面寫著「拯救高等教育」和「為我們的未來而戰，而非他們的戰爭」。示威者反對軍事擴張和生活成本上漲，呼籲減少軍事投入，增加教育、醫療和住房等公共服務支出。示威者隨後在首相官邸附近匯合，一度造成道路交通擁堵，並與立場不同的右翼示威者發生對峙，警方逮捕數人。\n法部署7萬警員防亂\n法國巴黎等地出現規模相對較小的遊行。法國媒體報道，示威者周六還將舉行新一輪全國抗議活動以紀念「黃背心」運動發起8周年。法國政府計劃在全國部署7萬名警察和憲兵，維護公共秩序。\n意大利總工會發起全國性罷工，罷工部門包括公共部門以及部分私營部門。抗議者在羅馬、米蘭、博洛尼亞、熱那亞、那不勒斯和巴勒莫等城市舉行集會，要求提高工資、增加教育和醫療投入，並對增加國防開支表示反對。\n意大利、葡萄牙民眾發起罷工\n意大利總工會說，當日全國超過150萬人參與罷工。意大利總工會負責人蘭迪尼指出，抗議活動反映出民眾要求改變現狀、將民生需求置於優先位置的強烈願望。\n在瑞士，主辦單位聲稱全國已有超過4萬名抗議者走上街頭。在西班牙，示威者首都馬德里的抗議活動中，呼籲增加教育經費，並強烈反對增加軍費。\n葡萄牙公共部門員工也舉行罷工，要求政府就2027年工資調整方案展開談判。今次行動由葡萄牙總工會下屬的公共部門工會聯合陣線發起。罷工影響醫療、教育和垃圾清運等公共服務，全國多地學校關閉，醫院僅維持最低限度醫療服務。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c76b523fa02","title":"強風暴襲巴西南部釀3死60傷 8000房屋被摧毀","url":"https://www.stheadline.com/realtime-world/3639586/強風暴襲巴西南部釀3死60傷-8000房屋被摧毀-","summary":"巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮。","summary_short":"巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮。","digest":"巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮","points":["巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮","其中，人口約2萬的圖潘西雷唐市受災最為嚴重，至少3人死亡、60人受傷","全市約8600棟住宅中，約8000棟受損甚至倒塌"],"section":"國際","category":"國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:03:07+08:00","size":1,"keywords":[],"body":"巴西南部南里奧格蘭德州連日來持續遭受強風暴吹襲擊，波及30個市鎮。其中，人口約2萬的圖潘西雷唐市受災最為嚴重，至少3人死亡、60人受傷。全市約8600棟住宅中，約8000棟受損甚至倒塌。\n20日淩晨3時左右，伴隨冰雹的強風暴襲擊圖潘西雷唐市，最大陣風時速達114公里。全市大量樹木、電線桿倒塌，道路受阻，電力及食水供應中斷，通訊網絡受損。市內唯一一家醫院屋頂被掀翻，傷者被緊急轉往鄰近城市救治。\n面對家園被毀，一對男女相擁安慰。路透社\n全市約8000棟住宅被摧毀。路透社\n多座建築物倒塌。路透社\n整座城市被摧毀\n圖潘西雷唐市市長特拉接受當地媒體訪問時表示：「整座城市都被摧毀了，有如前所未見的電影場景。」\n南里奧格蘭德州州長萊特表示，已動員民防、消防、警方等部門全力救援，緊急撥款調配機械設備和救災物資，加快恢復電力供應。\n巴西聯邦政府已派遣民防及醫療救援隊伍前往災區，協助救治傷者並運送救災物資，同時推動緊急救災資金撥付。\n巴西國家氣象研究所預報，至23日，該國多地仍將出現強降雨和雷暴天氣，南部、東南部部分地區面臨較高風暴風險。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c841ef2e798","title":"印尼摄影家赴福建采风成果展在雅加达举行","url":"https://www.chinanews.com/gj/shipin/cns-d/2026/11-21/news1075641.shtml","summary":"当地时间11月20日，心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。","summary_short":"当地时间11月20日，心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。","digest":"当地时间11月20日…","points":["本次展览共展出印尼摄影家创作的100幅摄影作品，涵盖中国历史文化、自然风光、城市发展…","活动现场还安排了中文歌曲合唱、传统舞蹈等文艺节目，以及书法、吹画、漆扇和茶艺等文化体验活动","中国驻印尼使馆文化参赞王思平表示，本次活动以“心联通·文互鉴”为主题…"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T13:41:40+08:00","size":1,"keywords":[],"body":"当地时间11月20日，心联通·文互鉴——“讲中国故事”暨印尼摄影家赴福建采风成果展在雅加达举行。\n\n本次展览共展出印尼摄影家创作的100幅摄影作品，涵盖中国历史文化、自然风光、城市发展、人文风情等内容，从不同角度展现真实、生动的中国。\n\n活动现场还安排了中文歌曲合唱、传统舞蹈等文艺节目，以及书法、吹画、漆扇和茶艺等文化体验活动。\n\n中国驻印尼使馆文化参赞王思平表示，本次活动以“心联通·文互鉴”为主题，既是一场“讲中国故事”的文化分享，也是一次以影像为媒、以文化会友的交流盛会。希望通过主题讲座、青年交流、文艺展演和文化体验等多种形式，让更多印尼朋友特别是青年一代，从身边的故事和真实视角认识中国、了解中国。(李志全 魏之强 制作 侯诗蕊）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/E226C31CAFBA4DDABD1F6994D79032DF.mp4","video_poster":"","lang":"zh-Hans"},{"id":"caab0176fe6","title":"特朗普稱與習近平談設AI防護機制 警告美資企業設海外數據中心將被徵重稅","url":"https://news.tvb.com/tc/1207599-特朗普稱與習近平談設AI防護機制警告美資企業設海外數據中心將被徵重稅","summary":"美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制。特朗普同時警告美資企業，一旦在海外設立數據中心將被徵收重稅，防止技術外流。","summary_short":"美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制。","digest":"美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制","points":["美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制","特朗普同時警告美資企業，一旦在海外設立數據中心將被徵收重稅，防止技術外流","美國總統特朗普結束「中國行」，談及跟國家主席習近平會面期間，討論人工智能相關議題…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T12:40+08:00","size":1,"keywords":[],"body":"美國總統特朗普指，美中人工智能技術領先全球，他與國家主席習近平同意為AI設立防護機制。特朗普同時警告美資企業，一旦在海外設立數據中心將被徵收重稅，防止技術外流。\n\n美國總統特朗普結束「中國行」，談及跟國家主席習近平會面期間，討論人工智能相關議題，包括設立防護機制。\n\n美國總統特朗普說：「習主席和我達成共識，設立(人工智能)共同防護機制，我們兩人之間，因為沒有第三個地方，我們(於人工智能發展)領先，中國位列第二，沒有任何國家能緊隨其後。」\n\n特朗普又指，美國在「超級智能」發展上正領先中國，但若因政治阻撓，導致數據中心發展停滯，可能會威脅美國的領先地位，警告美資企業一旦在海外設立人工智能數據中心，當局不排除會徵收重稅，以免他們外流晶片及相關技術，讓中國成為大贏家。\n\n特朗普表明，批准美資企業繼續向中國出售晶片，但只限舊型號晶片，而禁售最先進晶片。\n他認為美方即使完全禁售晶片，中國仍有能力自行研製。\n\n對於輝達前行政總裁黃仁勳，捲入婚外情及間諜疑雲，引起科技界關注，特朗普稱，跟習近平談及此事，但沒有交待細節。特朗普認為黃仁勳是卓越的人，即使他間中作出差劣決定，但可協助美國在人工智能保持領先地位，他值得擁有「另一次機會」。\n\n不過，美國財長貝森特則有另一個說法，指美中會談並未談及黃仁勳。路透社引述知情人士透露，美國證券管理委員會正調查輝達可能涉及的會計問題。\n\n據報黃仁勳同意出席參議院委員會聽證會，並公開作證，但未知他出席聽證會的確實日期。","image":"https://pro-vod-cdn.tvb.com/73498febb99940eba0228abb94c1ac4c/snapshots/61a2b77dff7c4b5fa75b58361b1f1c2e-00008.jpg","video":"https://pro-vod-cdn.tvb.com/73498febb99940eba0228abb94c1ac4c/a7e6222027c048429a15c247d77506a3-26d69d6aacd4eb1b2ca9e4400f9c814d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/73498febb99940eba0228abb94c1ac4c/snapshots/61a2b77dff7c4b5fa75b58361b1f1c2e-00008.jpg","lang":"zh-Hant"},{"id":"c978a74b36b","title":"伊朗宣布击落一架美军MQ-1无人
