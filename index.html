盃和澳門四級方程式大賽自由練習，要挑戰出名高難度的「葡京灣」，多架車撞欄，賽事一度暫停。\n\n北京旅客柯先生說：「覺得非常刺激和比較精彩，以前只是在電視和網絡上看過，沒有實際真正在現場看過比賽，所以看了非常震驚。」\n\n安哥拉留學生說：「這其實是我第一次觀賽。我也很喜歡車，在這看到賽車在賽道飛馳感受太好了。」\n\n除了三個主要觀眾看台，當局在社區多個地點，都設置了大型屏幕轉播賽事，讓市民和旅客即使沒有身處現場，都感受到大賽車的氣氛。\n\n今屆澳門四級方程式大賽，有來自十個國家及地區的十二支車隊挑戰東望洋賽道。現年16歲的澳門女車手劉司鑾，是今屆方程式賽事中唯一的澳門車手，她稱小時候在公園玩電動車，之後接觸小型賽車，亦參加過不同的賽事。\n\nF4車手劉司鑾說：「情況比我想像中更難，模擬器時直路沒那麼跳，出到去時非常跳，起初有些害怕，但之後開始有信心。我也輸了很多場，也嬴過很多場比賽，但我覺得總體來說，過程最重要，學到的東西可以幫助你成長。」\n\nF4車手劉司鑾母親說：「作為媽媽，我也很擔心，但可以幫女兒找到她的興趣和發展，我和我丈夫也很支持，希望可以陪她走下去，看看可以走得多遠。」","image":"https://pro-vod-cdn.tvb.com/720540ffd02a48119404f3bf6614a151/snapshots/6ce61a3f0f5541c68d8d673ff45c5e9b-00008.jpg","video":"https://pro-vod-cdn.tvb.com/720540ffd02a48119404f3bf6614a151/d4393b0f2ebc4ebc85faff40816eeea7-61ca82364f71659469ca0c04d77d4a24-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/720540ffd02a48119404f3bf6614a151/snapshots/6ce61a3f0f5541c68d8d673ff45c5e9b-00008.jpg","lang":"zh-Hant"},{"id":"c5cf0524a3d","title":"藍田啟田道中學疑有「尿袋」起火冒煙 14歲男學生燒傷送院","url":"https://www.stheadline.com/breaking-news/3638948/藍田啟田道中學疑有尿袋起火冒煙-14歲男學生燒傷送院","summary":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。","summary_short":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。","digest":"下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄…","points":["今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前…","事發時一名14歲男學生在校內使用「尿袋」，其間疑「尿袋」短路起火冒煙，男學生被燒傷…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:13:55+08:00","size":1,"keywords":[],"body":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。\n據了解，事發時一名14歲男學生在校內使用「尿袋」，其間疑「尿袋」短路起火冒煙，男學生被燒傷，幸仍然清醒，由救護車送往聯合醫院治理。\n消防到場調查起火原因。曾志恒攝\n現場為藍田啟田道5號聖公會基孝中學。曾志恒攝","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c968cf39e6e","title":"立法會通過深化國際教育樞紐議案 議員促重啟傳統名校轉直資","url":"https://www.stheadline.com/society/3638872/立法會通過深化國際教育樞紐議案-議員促重啟傳統名校轉直資","summary":"立法會大會今早（19日）續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設，構建國際升學首選地」的無約束力議員議案，終獲在席兩部分議員分別以過半數支持，獲議通過。","summary_short":"立法會大會今早（19日）續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設…","digest":"立法會大會今早續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設…","points":["立法會大會今早（19日）續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設…","管浩鳴促容百年名校轉直資吸海外生","選委界管浩鳴認為直資擴容要深刻思考，舉例2018年香港華仁書院的正式申請被拒之後…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:45:52+08:00","size":1,"keywords":[],"body":"立法會大會今早（19日）續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設，構建國際升學首選地」的無約束力議員議案，終獲在席兩部分議員分別以過半數支持，獲議通過。\n管浩鳴促容百年名校轉直資吸海外生\n選委界管浩鳴認為直資擴容要深刻思考，舉例2018年香港華仁書院的正式申請被拒之後，基本上就再無傳統資助名校成功轉制，而前特首曾蔭權和現任特首李家超，就分別是兩間華仁書院的畢業生。他相信傳統名校都是家長趨之若鶩，很多來自海外的人士想來就讀，希望教育局在直資擴容之外，考慮對於百年名校、高等學府可以開放嘗試申請為直資。\n他明白社會會討論公平問題，但只是要小心避免基層學生未能在這些學校就讀，認為可以考慮有全面減免的機制，最重要是學校能夠招收到高質學生，譬如學生被小學推薦升讀，是否可以有另外的資金幫助。他希望政府思考，香港成為國際升學首選地，就要明白市場上如何吸引大家來香港，又是否能夠選擇來香港升學。\n陳祖恒籲擴大「留學香港」推廣 吸海外名校落戶\n經民聯陳祖恒建議加大投入推廣「留學香港」品牌，研究將推廣範圍，由過往集中在高等教育，擴大至涵蓋整個教育體系，特別是香港有優勢的專業，用好「留學香港專班」，更主動地組織本港教育專家、機構，到海外參展及出席國際會議，向全球釋出「留學香港」的清晰訊息；同時善用資源，在香港舉辦大型教育展覽，積極爭取國際性教育會議落戶香港，讓海外院校與學生親身體驗香港的優勢，以實地交流建立長遠的國際口碑。\n他亦建議盡快吸引國際知名院校落戶香港，無論是開設辦事處、研發或交流中心、以及分校，盡快和香港建立聯繫，才能為香港持續拓展國際網絡優勢鋪路。他又建議吸引頂尖行業機構與港校合辦課程，研究為本港發展急需的戰略性學科加大投入，推動本港包括職專教育機構在內的院校，與國際頂尖行業機構合作辦校，為本地及國際學生提供系統性訓練、學術資格和就業階梯，聚焦又迅速地培養「八大中心」定位的相關人才。\n教育局：支持各大院校加強全球宣傳\n教育局副局長施俊輝表示，當局持續支持各大院校主動走出去，包括加強全球宣傳活動和參與各地的教育展覽，向海外展示香港高等教育界的優勢和特點，開拓多元化生源，除了提供奬學金，當局亦會通過交流分享會幫助同學了解香港的學習、生活、升學和就業前景，以及建立同儕和校友的網絡。\n至於「直資擴容」，他表示，根據今年九月直資學校點算在學人數結果，本學年持學生簽證以自資模式入讀直資學校的非本地學生人數合共170人，較去年上升13％，反映計劃開局良好，亦顯示海外學生及家長對香港基礎教育具一定信心。「直資擴容」是國際教育樞紐建設推進至基礎教育的第一步，教育局會以先行先試方式逐步推行計劃，並會適時研究未來發展方向，從而容讓學界不同界別均能參與推進國際教育樞紐建設。\n記者：郭詠欣","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c33155a111a","title":"歷來最大型「香港繽紛冬日巡禮」 中環皇后像廣場22米高聖誕樹任打卡 尖沙咀太空館化身夢幻水晶球","url":"https://www.stheadline.com/hot-place/3638699/歷來最大型香港繽紛冬日巡禮-中環皇后像廣場22米高聖誕樹任打卡-尖沙咀太空館化身夢幻水晶球","summary":"聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛，年度盛事「香港繽紛冬日巡禮」於昨晚在中環和尖沙咀閃亮登場，慶祝活動一直延伸至2027年1月5日。","summary_short":"聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛，年度盛事「香港繽紛冬日巡禮」於昨晚在中環和尖沙咀閃亮登場…","digest":"聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛…","points":["聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛…","今次巡禮歷來規模最大，分別在中環、尖沙咀和銅鑼灣設3個「冬日小鎮」，結合璀璨聖誕裝置…","中環皇后像廣場花園化身成夢幻歐陸聖誕小鎮，以「環球聖誕歷奇」為主題…"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:29:23+08:00","size":1,"keywords":[],"body":"聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛，年度盛事「香港繽紛冬日巡禮」於昨晚在中環和尖沙咀閃亮登場，慶祝活動一直延伸至2027年1月5日。\n今次巡禮歷來規模最大，分別在中環、尖沙咀和銅鑼灣設3個「冬日小鎮」，結合璀璨聖誕裝置、繽紛光影表演以及聖誕市集，將節日歡樂氣氛推至最高，其中中環設6層樓高的巨型聖誕樹，成為打卡熱點。\n中環皇后像廣場花園化身成夢幻歐陸聖誕小鎮，以「環球聖誕歷奇」為主題，設有12米長經典蒸汽火車、馴鹿及熱氣球等精緻聖誕裝置。現場最矚目是歷年最高的22米、相當於約6層樓高的戶外聖誕樹，市民及旅客可漫步於熱氣球航站及聖誕列車站之間，盡情打卡。聖誕老人更會在指定日子，現身小鎮內的聖誕郵局，與市民及旅客見面。\n除了充滿異國風情的聖誕裝飾，每晚7時起，皇后像廣場花園附近共9座地標建築，包括中國銀行大廈、中銀大廈、香港大會堂高座、香港會所大廈、滙豐總行大廈、香港文華東方酒店、太子大廈、渣打銀行大廈及終審法院大樓的外牆，將上演8幕沉浸式光影表演。演出以經典蒸汽火車貫穿全場，帶領觀眾穿梭冰雪天地、玩具世界及糖果王國等奇幻場景，並途經山頂纜車等香港特色地標，令人目不暇接。光影表演期間，巨型聖誕樹及小鎮內的打卡裝置，亦會隨節奏變換色彩。\n此外，小鎮還設有多間特色小木屋，市民及旅客可以一邊挑選節日禮物、品嘗美食，一邊欣賞城市夜色。場內亦特設聖誕珍藏市集，義賣歷年珍藏聖誕紀念品及珍藏聖誕回憶，收益將作慈善用途。訪客還可到訪聖誕寄願站，於明信片專區寫下節日祝福，寄送給親友。\n尖沙咀冬日小鎮沉浸式光影音樂表演打造視覺盛宴\n香港旅遊發展局「香港繽紛冬日巡禮」系列活動中，尖沙咀冬日小鎮昨晚亦開幕，呈獻兩大主題沉浸式光影音樂表演，為觀眾帶來視覺盛宴。\n尖沙咀鐘樓及香港文化中心化身光影舞台，上映「冬日星光音樂會」光影表演，播放多首觀眾耳熟能詳的聖誕樂曲，重新演繹成活力十足的流行舞曲，並以璀璨光影與動感音樂交織，為海濱注入節日動感。\n遊人沿海濱漫步，可走進另一場別具魅力的浪漫光影世界。香港藝術館披上夢幻絢麗的極光色彩，太空館則化身巨型水晶球，加上逾7000盞燈球組成燈海，隨樂章變幻色彩，營造浪漫動人的冬日世界。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf464ac5b31","title":"火炭工廈外紙皮起火危及機房 OT男途經拖喉救火獲讚","url":"https://www.stheadline.com/breaking-news/3638868/火炭工廈外紙皮起火危及機房OT男途經拖喉救火獲讚","summary":"火炭昨晚（18日）發生一宗火警，揭發好人好事。","summary_short":"火炭昨晚（18日）發生一宗火警，揭發好人好事。","digest":"火炭昨晚發生一宗火警，揭發好人好事","points":["火炭昨晚（18日）發生一宗火警，揭發好人好事","一名需要加班的男子外出用膳期間遇見火炭路安華工業大廈對開卡板紙皮起火…","消防及警方接報到場，經初步調查，不排除煙頭肇禍"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:16:01+08:00","size":1,"keywords":[],"body":"火炭昨晚（18日）發生一宗火警，揭發好人好事。一名需要加班的男子外出用膳期間遇見火炭路安華工業大廈對開卡板紙皮起火，他馬上從大廈拖出消防喉轆射水灌救，最終在途人協助下成功將火撲熄。消防及警方接報到場，經初步調查，不排除煙頭肇禍。\n男子在帖文中表示：「帶住負能量返工開OT，take個break（休息一下）去食飯，竟然去左（咗）救火，難得啊，其實我用消防喉轆其實好叻。」帖文標註事發地點為火炭，實際地址為火炭路安華工業大廈對開行人路。\n片段可見，事主臨危不亂，一手持消防水喉撲火，一手持手機拍下片段；其間有熱心途人主動上前協助，移開上方尚未燃燒的紙皮，讓水柱能直接射向核心著火點，火勢隨後受控。\n事件網民激讚：「功德無量」、「好人有好報」，有網民留意到紙皮後方是一個機房，若不及時救火，恐防會釀成更大災難，「好在有你幫忙，着火紙皮後面係中電機房」，另有網民推斷應是有人亂丟煙頭肇禍：「實係有人亂拋煙頭」。\n警方表示，昨晚7時許接報，指火炭路一幢工業大廈外有紙皮起火，人員到場時火勢已被救熄。經初步調查，事件沒有可疑，相信因未熄滅的煙頭點燃紙皮肇禍。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce1222f7bbc","title":"前民政署長張趙凱渝退休後轉跑道 出任VTC執行幹事","url":"https://www.stheadline.com/politics/3638864/前民政署長張趙凱渝退休後轉跑道-出任VTC執行幹事","summary":"職業訓練局（VTC）今日（19日）公布，已得到政府同意，委任張趙凱渝為新一任執行幹事，由2027年1月1日起生效。","summary_short":"職業訓練局（VTC）今日（19日）公布，已得到政府同意，委任張趙凱渝為新一任執行幹事，由2027年1月1日起生效。","digest":"職業訓練局公布，已得到政府同意，委任張趙凱渝為新一任執行幹事…","points":["職業訓練局（VTC）今日（19日）公布，已得到政府同意，委任張趙凱渝為新一任執行幹事…","張趙凱渝曾於政府多個決策局及部門服務，包括出任運輸及房屋局副秘書長（房屋）／房屋署副署長（策…","林健鋒：張趙凱渝對香港人才發展具深刻見解"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:06:03+08:00","size":1,"keywords":[],"body":"職業訓練局（VTC）今日（19日）公布，已得到政府同意，委任張趙凱渝為新一任執行幹事，由2027年1月1日起生效。張趙凱渝曾於政府多個決策局及部門服務，包括出任運輸及房屋局副秘書長（房屋）／房屋署副署長（策略），2025年時退休時擔任民政事務總署署長。\n林健鋒：張趙凱渝對香港人才發展具深刻見解\n職業訓練局主席林健鋒表示，張趙凱渝擁有卓越的領導和管理能力，以及廣闊的政策視野，對香港未來人才發展需要具深刻見解，深信她將帶領職業訓練局進一步深化與政府、業界及社會各界的合作，培育更多配合經濟轉型及產業發展需要的人才，為香港及國家的高質量發展注入新動力。\n林健鋒又指，職業訓練局根據既定政策及程序，透過公開招聘揀選張趙凱渝接任執行幹事，理事會相信她將引領職業訓練局持續向前，推動香港職業專才教育再創高峰。\n感謝現任幹事唐智強卓越貢獻\n林健鋒亦衷心感謝即將卸任的執行幹事唐智強，指他自2022年出任執行幹事以來，以前瞻視野帶領職業訓練局在多個範疇取得重要成果，並積極配合國家及香港的發展策略，加強職專教育與產業需要的聯繫，為職業訓練局及職專教育的長遠發展奠定堅實基礎。職業訓練局理事會對唐智強任內的卓越貢獻深表謝意。\n張趙凱渝於1986年加入政府，服務近40年間曾在多個決策局及部門服務，包括前公務員事務科、前工商科、前政務總署、前貿易署、公務員事務局、政務司司長辦公室、前民政事務局、教育局及商務及經濟發展局。並於2016年至2019年出任環境保護署副署長，2019年至2022年出任運輸及房屋局副秘書長（房屋）／房屋署副署長（策略），並於2022年起出任民政事務總署署長至2025年退休。\n林健鋒是選委會選舉參選人。詳細參選名單請參閱選舉網站。\n相關新聞：\n選委會選舉2026．提名全名單︱累計接獲1155份提名 至少31個界別分組有競爭 社福界25人爭15席","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc688638dd7","title":"小巴司機酒駕撞斃七旬婦 認危駕酒駕囚25個月及停牌7年半","url":"https://www.stheadline.com/society/3638862/小巴司機酒駕撞斃七旬婦-認危駕酒駕囚25個月及停牌7年半","summary":"54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿，老婦送院後不治；小巴司機事後被驗出酒精含量超標。","summary_short":"54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿，老婦送院後不治…","digest":"54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿…","points":["54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿…","他早前承認危險駕駛導致他人死亡及酒後駕駛兩罪，今於區域法院接受判刑","暫委法官梁嘉琪列舉加刑因素，包括事件引致他人死亡、被告醉駕且酒精含量超標近4倍…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T13:55:08+08:00","size":1,"keywords":[],"body":"54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿，老婦送院後不治；小巴司機事後被驗出酒精含量超標。他早前承認危險駕駛導致他人死亡及酒後駕駛兩罪，今於區域法院接受判刑。暫委法官梁嘉琪列舉加刑因素，包括事件引致他人死亡、被告醉駕且酒精含量超標近4倍、他駕駛公共交通工具，以及事發在行人過路處，最終判囚25個月、停牌7年半。\n官指行車紀錄儀所示與被告一時失專注說法有別\n56歲被告吳國成，早前承認1項危險駕駛導致他人死亡及1項酒後駕駛罪。梁官引述辯方指被告當時一時失去專注，反應時間有限，而被告無超速或違規，事後即時停車，故辯方認為案情非同類中最嚴重。惟梁官指出，行車紀錄儀顯示案發時無乘客但播放音響，被告在下午1時許、天氣良好之下駕駛公共小巴，他的視線無阻擋，與一時失去專注的說法有別。\n梁官直言本案屬特別嚴重的危駕致死案，被告體內的酒精含量超標達第三級，但仍選擇駕駛和準備接載乘客。梁官最終就兩罪判入獄26個月，鑑於被告因好酒而導致肝臟受損和影響精神狀況，目前等待肝移植，酌情扣減1個月，終判入獄25個月、停牌7年半及須自費上駕駛改進課程。\n事主「衝紅燈」遭小巴撞倒並輾過雙腿\n案情指，2024年10月9日中午約1時許，被告駕駛涉事小巴行駛至曉光街及秀明道交界，並停在行人過路處附近，當交通燈號轉為綠燈，他開車駛出路口。此時，女事主陳金菊從左至右急步橫過行人過路處，小巴車頭右方撞上事主，及後車輪輾過事主雙腿；當時行人過路處的燈號為紅燈。\n被告有所感覺及停下小巴，這時女事主倒臥在小巴後方，當救護員到場時，女事主已陷入昏迷及情況危殆，送院搶救後證實不治。驗屍報告顯示，死者頭部創傷、顱骨骨折及腦部創傷等。\n被告警誡下稱前一晚飲數罐雞尾酒\n同日警方拘捕被告，在警誡下，他稱當時交通燈號轉為綠燈，他便開車，「不知道死者從何處衝出來」。警員注意到，被告滿面通紅及身上有酒氣，進行呼氣測試後，發現其體內酒精濃度超出訂明上限，達到每100毫升內有84至95微克的酒精。警誡下，被告稱案發前一晚在便利店飲了數罐雞尾酒。\n辯方早前求情時，確認被告過去曾有一次管有第一部毒藥案底，但控罪性質與本案不同，而且事隔已久。辯方指，被告案發時並非一邊飲酒、一邊駕駛，而是前一晚飲酒後曾回家休息，而案發早上只僅駕駛了兩次，其餘時間在小巴站休息，案發時小巴上也沒有乘客，被告亦無超速。\n辯方指，被告有20年職業司機經驗，過去記錄稱得上良好，沒有危駕或不小心駕駛的記錄。被告現時身體狀況不佳，其肝功能嚴重受損，以致出現肝腦病變及須等待肝臟移植手術，他行動不便及須輪椅代步。辯方強調被告深感後悔，現已戒酒。\n案件編號：DCCC1770/2025\n法庭記者：雷璟怡","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0ac34f0d03","title":"首三季近萬宗電騙涉款19億 8月份破2,000宗創新高 警夥私隱公署調查","url":"https://www.stheadline.com/breaking-news/3638849/首三季近萬宗電騙涉款19億-8月份破2000宗創新高-警夥私隱公署調查","summary":"電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行，共偵破108宗騙案涉款約6,800萬元，並拘捕95男28女（介乎14至75歲）。","summary_short":"電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行，共偵破108宗騙案涉款約6…","digest":"電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行…","points":["電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行…","根據警方數字，今年首三季接獲的詐騙案已佔整體罪案數字一半，當中電話騙案更佔近三成…","單是8月份電騙案突破2,000宗，創下有紀錄以來的新高"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T13:38:23+08:00","size":1,"keywords":[],"body":"電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行，共偵破108宗騙案涉款約6,800萬元，並拘捕95男28女（介乎14至75歲）。根據警方數字，今年首三季接獲的詐騙案已佔整體罪案數字一半，當中電話騙案更佔近三成，接近1萬宗，涉款逾19億元。單是8月份電騙案突破2,000宗，創下有紀錄以來的新高。\n相關新聞：觀塘紅磡工廈單位淪「遙控貓池」中心 網絡電話冒固網打出 警拘123人\n商業罪案調查科警司郭靜怡指出，今年1月至9月期間，警方共接獲34,679宗詐騙案件，佔整體罪案約五成。當中電話騙案佔近三成（28.8%），錄得9,999宗，涉款約19.4億元。單是8月份，電騙宗數更突破2,000宗，創下有紀錄以來的歷史新高。\n郭靜怡稱，在各類電話騙案中，「假冒客服」依然是最普遍的手法，佔整體電騙約六成。近期騙徒頻繁冒充多個知名零售商戶、網購平台或物流公司，訛稱市民訂購的貨品或服務出現問題並主動提出「賠償」，誘使市民以「驗證身份」為名將款項轉帳至指定戶口。值得關注的是，騙徒往往能準確道出受害人的姓名、電話號碼及真實交易紀錄。針對個人資料外洩風險，警方已聯同個人資料私隱專員公署展開深入調查。\n在「假冒客服」電騙案之中，騙徒很多時會以疑似固網電話「2」、「3」字頭的號碼打出，或者在釣魚短訊內留下這些「2」、「3」字頭的號碼，冒充為客服電話。警方調查發現這些號碼很多都不是傳統固網電話，而是由互聯網平台打出的網絡電話。不法分子以個人名義，甚至利用空殼公司申請這些號碼，令到市民信以為是客服來電。\n郭靜怡續稱，目前電話儲值卡設有實名登記數量上限，但針對月費「上台」服務，包括固網及網絡電話，現行法例並未就企業客戶可登記號碼的數量，設有適用於所有電訊商的統一上限。騙徒有機會利用公司名義，以大批量或分次申請的方式，取得多個「上台」號碼，再交由詐騙集團使用。\n換言之，騙徒未必需要開設大量不同帳戶，只要利用一個公司名義，已經有機會取得多個電話號碼，再建立詐騙電話中心，短時間內向大量市民撥出詐騙電話。此手法成本相對低，但可以大量接觸市民，正正體現「低成本、高效益」的特點。\n郭靜怡呼籲，雖然電訊商一般會核實客戶資料，但為防止服務被濫用，業界仍需要加強客戶審核、號碼分配及異常使用監察，及早識別和堵截可疑服務或涉及詐騙的電話號碼，防止騙徒繼續利用有關號碼行騙。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":50,"items":[{"id":"c01db93f1c0","title":"（深圳APEC）习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特…","digest":"11月19日下午…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织…","习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道…","中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:27:46+08:00","size":4,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。\n\n　　习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道，确立了“中美建设性战略稳定关系”的新定位，并赋予其“基于尊重、公平、对等”的新内涵，受到中美两国人民认可和国际社会欢迎。中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性。我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。\n\n　　习近平强调，构建中美建设性战略稳定关系是前无古人的开创性事业，需要敢闯敢试、脚踏实地、善作善成。中美元首外交的引领作用不可替代。要延续中美关系目前的稳定向好势头，关键是要在落实元首共识上付诸行动。双方团队的沟通也要跟上。要拉长合作清单、压缩问题清单，一时解决不了的分歧要建设性管控，防止矛盾升级。在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。经贸领域要加强沟通，解决彼此关切，争取互利互惠。两国在禁毒、非法移民遣返、打击电信网络诈骗等领域的合作卓有成效，可以本着尊重、公平、对等的原则继续加强合作。中美应当加强沟通和协调，防范人工智能安全风险，确保人工智能始终处于人类控制之下。\n\n　　特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。\n\n　　双方认为此次会晤是积极、建设性的，同意制定建设性战略稳定关系行动计划，落实两国元首共识，构建基于尊重、公平、对等的中美建设性战略稳定关系。\n\n　　两国元首还就共同关心的国际和地区问题交换了意见。\n\n　　蔡奇、王毅、何立峰、黄坤明等参加会见。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml","source_display":"中國新聞網","published_at":"2026-11-19T17:27:46+08:00","category":"內地","digest":"11月19日下午…"},{"title":"习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734694.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:22:55+08:00","category":"內地","digest":"11月19日下午…"},{"title":"新华图讯丨习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734624.shtml","source_display":"中新網 時政","published_at":"2026-11-19T15:24:16+08:00","category":"內地","digest":"新华图讯丨习近平会见美国总统特朗普"},{"title":"习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734607.shtml","source_display":"中國新聞網","published_at":"2026-11-19T14:08:40+08:00","category":"內地","digest":"11月19日下午…"}],"cross":{"total":4,"angles":[{"point":"11月19日下午…","sources":["中國新聞網","中新網 時政","中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml"},{"point":"新华图讯丨习近平会见美国总统特朗普","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734624.shtml"}]}},{"id":"c2da1d98f24","title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734866.shtml","summary":"新华社深圳11月19日电(记者杨依军、冯歆然)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"新华社深圳11月19日电(记者杨依军、冯歆然)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","points":["新华社深圳11月19日电(记者杨依军、冯歆然)11月19日下午…","三国元首围绕“维护世界和平，促进大国关系战略稳定”主题进行深入讨论","习近平指出，中俄美三国最高领导人有史以来首次聚首，具有开创性意义"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T20:06:15+08:00","size":3,"keywords":[],"body":"新华社深圳11月19日电(记者杨依军、冯歆然)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。三国元首围绕“维护世界和平，促进大国关系战略稳定”主题进行深入讨论。\n\n　　习近平指出，中俄美三国最高领导人有史以来首次聚首，具有开创性意义。历史告诉我们，大国和则世界安，大国斗则世界乱。和平是人类社会的永恒期盼。我们这个星球曾爆发过1万多次战争，当下世界上仍有60多场地区冲突延宕不止。80多年前，作为世界反法西斯的中坚力量，中俄美三国并肩奋战，取得伟大胜利，为世界赢得和平和安宁。历史是最好的教科书。我们要铭记历史，以史为鉴，开创未来。\n\n　　习近平强调，人类生活在同一个地球村，是一个命运共同体。在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。近年来，中国推进中俄新时代全面战略协作伙伴关系，积极构建中美建设性战略稳定关系，推动形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。当前，世界百年变局加速演进，天下并不太平。中俄美作为世界主要大国和联合国安理会常任理事国，应该当好表率，合作应对全球性挑战，共同维护世界和平稳定，为人类进步作出更大贡献。\n\n　　习近平指出，大国如何正确相处、共同为世界和平托底，是必须答好的时代课题。他就此提出4点看法：\n\n　　第一，坚持相互尊重。相互尊重是大国交往的基本准则。中俄美三国国情不同，要彼此尊重、求同存异、共同发展，包括尊重彼此主权和领土完整，尊重各自选择的社会制度和发展道路，尊重彼此核心利益和重大关切。要坚持不干涉别国内政，不干涉彼此内部事务。在涉及对方的重大敏感问题上，要提前沟通、换位思考、谨慎行事，特别是不能触碰对方的底线。\n\n　　第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。中俄美要做伙伴、做朋友，不冲突、不对抗，守住和平共处底线。中俄美都是二战主要战胜国，应当坚定维护战后国际秩序，维护《联合国宪章》宗旨，捍卫来之不易的二战胜利成果。核战争打不赢也打不得，要尽一切努力防止。\n\n　　第三，坚持合作共赢。中俄美三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。应该加强经贸合作，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n\n　　第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦就可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。国际社会期待大国就热点问题多做劝和促谈工作，中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。\n\n　　普京表示，感谢中方安排历史上首次俄中美元首会晤。俄中美都是大国和联合国安理会常任理事国，二战的胜利成果把我们联系在一起，捍卫《联合国宪章》宗旨、维护国际和平是三国共同责任，妥善处理热点问题符合三国共同利益。三国要坚持主权平等、不干涉内政原则，通过合作寻找平衡解决关切的办法。俄方愿同中方和美方相互尊重、平等对话、和平共处、妥处分歧，促进自由开放的国际贸易，维护能源、粮食安全，加强人工智能治理国际合作，共同为世界和平安全作出贡献。\n\n　　特朗普表示，美中俄三国元首会晤举世瞩目、非常重要，创造了历史。三国都是有核国，对维护世界和平稳定负有特殊重要的责任。三方应共同防止核扩散，避免核武器给人类带来灾难。维护稳定、实现和平需要对话，任何问题都应通过对话解决。我期待同习近平主席和普京总统一道，更好地保护我们的地球，使未来更安全。\n\n　　三国元首还就乌克兰危机、防止核武器扩散、中东局势、朝鲜半岛等重大国际和地区问题交换了意见。\n\n　　习近平在总结讲话中指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的，三国在维护世界和平上看法是一致的。三国都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平，大国应该重视各国合理安全关切；对话谈判是化解分歧的正确选择，只要对话不停止、大门不关上，和平就有希望；合作是应对挑战的必由之路，要基于共同利益加强合作，以合作促和平、谋共赢。\n\n　　习近平强调，今天三国元首会晤播下的种子，必将生根发芽、开花结果。三国要落实好会晤共识，继续加强沟通，以对话聚共识，以担当迎挑战，以合作促和平，共同推动建设一个更加美好的世界。\n\n　　会后，三国发表《中俄美元首和平宣言》。\n\n　　蔡奇、王毅参加。 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734866.shtml","source_display":"中新網 時政","published_at":"2026-11-19T20:06:15+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"新华图讯｜习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734754.shtml","source_display":"中新網 時政","published_at":"2026-11-19T17:26:42+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734710.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:34:33+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"ce906af15e6","title":"中俄美元首會晤｜習近平：三國播下種子必開花結果 和平宣言倡對話減核風險","url":"https://news.tvb.com/tc/1207304-中俄美元首會晤習近平三國播下種子必開花結果和平宣言倡對話減核風險","summary":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言，包括計劃增加石油產量、進行對話減少核風險。習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果。","summary_short":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言，包括計劃增加石油產量…","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤…","points":["國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言…","習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果","習近平坐在畫面中間位置，美國總統特朗普及俄羅斯總統普京分別坐在習近平左邊及右邊"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T19:05+08:00","size":3,"keywords":[],"body":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤，並發布四點和平宣言，包括計劃增加石油產量、進行對話減少核風險。習近平指今次會晤具有開創性意義，播下的種子，必將生根發芽、開花結果。\n\n中俄美元首會晤，由國家主席習近平主持。習近平坐在畫面中間位置，美國總統特朗普及俄羅斯總統普京分別坐在習近平左邊及右邊。\n\n習近平表示，中俄美三國最高領導人有史以來首次聚首，具有開創性意義，將討論維護世界和平，以及促進大國關係戰略穩定。\n\n國家主席習近平說：「當今世界早已不是彼此隔絕的孤島。人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體。在這個地球村裡，大國肩負著特殊責任。大國良性互動不是選擇題，而是必答題。當前，世界百年變局加速演進，天下並不太平。風雨見擔當。作為世界主要大國，和聯合國安理會常任理事國，中俄美應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定，為人類進步作出更大貢獻。」\n\n習近平就大國如何正確相處，提出四點看法，就是要堅持相互尊重、和平共處，合作共贏、對話協商。中俄美要做夥伴、做朋友，不衝突、不對抗，習近平又稱，應該全面禁止並徹底銷毀核武器，最終建立無核武器世界，核戰爭打不贏也打不得，要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n\n普京之後發言，他指在早前舉行的俄中及俄美雙邊會談，他們一致認為，應對當今威脅及挑戰，符合共同利益，相信三國有能力應對，為加強世界和平及穩定，作出重要貢獻。\n\n俄羅斯總統普京說：「我們三國擁有，眾多共同利益，在解決地區衝突上，包括顯而易見的烏克蘭衝突，昨天我們與中國國家主席討論了此事，今天應美國總統倡議我們重點討論。」\n\n特朗普最後一個發言，他表示很高興有機會舉行三邊會晤，認為他們創造歷史，將要討論很多議題。\n\n美國總統特朗普說：「我們肩負特殊責任，保持開放、尊重，且富有成效的對話，這些問題不僅影響我們的人民，更影響整個地球，過去的領導人往往迴避，與存在分歧的國家對話，我們持相反看法，且對此深信不疑。」\n\n會晤歷時一個半小時，特朗普之後乘坐專機，空軍一號離開深圳，中共中央政治局委員，外長王毅到機場送行。\n\n中俄美元首發布四點和平宣言，包括推動聯合國改革，計劃增加精煉石油產品的，生產及供應，國際刑事法院等機構，不得濫用管轄權，以及重申核戰爭打不贏也打不得，三國將就減少核風險，防止核擴散進行對話。\n\n國家主席習近平在深圳同俄羅斯總統普京、美國總統特朗普舉行中俄美元首會晤，總結此次會晤達成的主要共識。\n\n習近平指出，今天的中俄美元首會晤是積極的、建設性的，也是富有成果的，三國在維護世界和平上看法是一致的，都記得二戰期間並肩作戰的歷史，強調要珍惜來之不易的和平，都同意大國應該重視各國合理安全關切，主張對話談判是化解分歧的正確選擇。只要對話不停止、大門不關上，和平就有希望，都認為合作是應對挑戰的必由之路，要基於共同利益加強合作，以合作促和平、謀共贏，今天三國會晤播下的種子，必將生根發芽、開花結果。\n\n中俄美三國要落實好會晤共識，繼續加強溝通，以對話聚共識，以擔當迎挑戰，以合作促和平，共同推動建設一個更加美好的世界。","image":"https://pro-vod-cdn.tvb.com/7a85c87a8df348b49a8c42d8fd0cca61/snapshots/ba7194951d2b4bbdbe465ebe92ed90af-00008.jpg","video":"https://pro-vod-cdn.tvb.com/7a85c87a8df348b49a8c42d8fd0cca61/067a4a728c41491f85745a265826e528-c74461625b7638c49c13c80d5eeca170-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/7a85c87a8df348b49a8c42d8fd0cca61/snapshots/ba7194951d2b4bbdbe465ebe92ed90af-00008.jpg","lang":"zh-Hant","items":[{"title":"中俄美元首會晤｜習近平：三國播下種子必開花結果 和平宣言倡對話減核風險","url":"https://news.tvb.com/tc/1207304-中俄美元首會晤習近平三國播下種子必開花結果和平宣言倡對話減核風險","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T19:05+08:00","category":"兩岸","digest":"國家主席習近平、俄羅斯總統普京及美國總統特朗普，結束首場中俄美元首會晤…"},{"title":"中俄美元首會晤．現場｜習近平、普京、特朗普拍攝合照","url":"https://news.tvb.com/tc/1207264-中俄美元首會晤現場習近平普京特朗普拍攝合照","source_display":" 赋不同，经济互补性强，可以发挥自身优势，互通有无。应该摒弃冷战思维，加强经贸合作，将资源大国、制造大国、消费大国的各自优势贯通起来，共同做大合作蛋糕，实现双赢共赢，而不能搞“脱钩断链”。全球能源安全面临严峻挑战，三国可以加强沟通和协调，共同维护能源产业链供应链稳定畅通，维护全球能源市场安全稳定。\n\n　　第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。三国要保持常态化高层交往，畅通各层级对话渠道，建立危机沟通和预防机制，确保误判少发生、分歧管得住、摩擦不升级。当前，全球各种纷争持续不断，热点问题按下葫芦浮起瓢，国际社会期待大国多做劝和促谈工作。中俄美三国应该继续推动冲突当事方坐下来、谈起来，通过政治外交手段化解纷争。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平就大国如何正确相处提出4点看法","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734794.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:15:33+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"界面晚报 | 习近平就大国如何正确相处提出4点看法；商务部谈当前消费市场表现","url":"https://www.jiemian.com/article/15348271.html","source_display":"界面新聞","published_at":"2026-11-19T17:27:00+08:00","category":"","digest":"习近平就大国如何正确相处提出4点看法  11月19日下午…"},{"title":"习近平就大国如何正确相处提出4点看法","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734740.shtml","source_display":"中新網 時政","published_at":"2026-11-19T17:15:34+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}],"cross":{"total":3,"angles":[{"point":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","sources":["中新網 時政","中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734794.shtml"},{"point":"习近平就大国如何正确相处提出4点看法  11月19日下午…","sources":["界面新聞"],"url":"https://www.jiemian.com/article/15348271.html"}]}},{"id":"c94811ff99e","title":"（深圳APEC）习近平主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734613.shtml","summary":"中新社深圳11月19日电 (记者 谢雁冰)11月19日上午，中国国家主席习近平在深圳国际交流中心主持亚太经合组织第三十三次领导人非正式会议，并发表题为《建设亚太共同体…","summary_short":"中新社深圳11月19日电 (记者 谢雁冰)11月19日上午，中国国家主席习近平在深圳国际交流中心主持亚太经合组织第三十三…","digest":"11月19日上午…","points":["中新社深圳11月19日电 (记者 谢雁冰)11月19日上午…","11月的深圳，微风送爽，鲜花盛开","习近平热情迎接与会的各经济体领导人、代表及国际组织负责人，同他们亲切握手并集体合影…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:37:43+08:00","size":3,"keywords":[],"body":"中新社深圳11月19日电 (记者 谢雁冰)11月19日上午，中国国家主席习近平在深圳国际交流中心主持亚太经合组织第三十三次领导人非正式会议，并发表题为《建设亚太共同体，续写“亚太奇迹”新篇章》的重要讲话。\n\n　　11月的深圳，微风送爽，鲜花盛开。\n\n　　习近平热情迎接与会的各经济体领导人、代表及国际组织负责人，同他们亲切握手并集体合影，随后主持会议。\n\n　　习近平指出，30多年前，亚太经合组织应运而生，开启了建设亚太共同体的壮阔历程。30多年来，亚太地区面貌日新月异，创造了经济快速发展的“亚太奇迹”。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　一要坚持和衷共济，拉紧共同利益纽带，携手应对困难和挑战，持续培育共同体意识。二要坚持开放融通，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局，倡导自由开放的贸易和投资，为亚太经济增长开拓更广阔空间。三要坚持开拓创新，鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。四要坚持包容发展，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。\n\n　　习近平强调，中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n\n　　第一，强化经贸支柱。亚太自由贸易区是亚太经合组织成员的共同愿景，要稳步向前推进，打造更高水平的开放格局。推动区域经贸协定对接，提升贸易投资便利化、数字化水平，减少贸易投资壁垒。加强政策对话，开展经验交流和技术合作，提高各方参与高水平经贸安排的能力。\n\n　　第二，升级联通支柱。互联互通是区域经济一体化的纽带。要巩固“硬联通”，完善基础设施网络；增强“软联通”，促进政策和监管协调；密切“心联通”，便利商旅和人员往来，促进人文交流和民众相知相亲。\n\n　　第三，打造创新支柱。数字经济和人工智能是创新增长的引擎。要加强数字基础设施建设，完善区域数据治理和协同合作，实现高效、便捷、安全的跨境数据流动。打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n\n　　第四，夯实发展支柱。要加强能力建设，推动区域能源和粮食安全合作，深化跨境腐败治理。推动资源、环境、人口协调发展，拓展绿色低碳合作，实现经济可持续增长。支持改善民生和投资于人，实施健康老龄化行动，促进就业和职业技能开发，支持妇女经济赋权和青年人才交流，释放亚太人才活力。\n\n　　习近平宣布中方支持亚太合作的最新举措，包括提供2000万美元资助开展亚太经合组织务实合作；在深圳设立亚太共同体研究中心，开展政策研究和交流，提供智力支撑；在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。\n\n　　各经济体领导人及代表围绕会议主题“建设亚太共同体，促进共同繁荣”依次发言。各方高度评价APEC“中国年”取得的丰硕成果，感谢中方所做出色工作，积极呼应习近平主席提出的重大倡议举措。各方表示，愿密切各领域合作，携手应对风险挑战，推动亚太经合组织实现更大发展，为地区和世界的和平、稳定、繁荣作出贡献。国际货币基金组织总裁格奥尔基耶娃应邀介绍当前全球经济形势。\n\n　　习近平听取各方发言后作总结发言，就高质量推进亚太合作提出3点主张：一是坚定信心，努力将建设亚太共同体的共识转化为行动，把愿景变为现实。二是把准方向，始终锚定建设亚太共同体的大方向不动摇，以强烈的使命感推进各领域合作，携手创造亚太更加美好的未来，推动构建人类命运共同体。三是实干笃行，抓住发展这个最大公约数，尊重规律、真抓实干、善作善成，不断取得可感可及的亚太合作成果。\n\n　　会议最后进行东道主交接，2027年亚太经合组织东道主越南国家主席苏林欢迎各经济体领导人、代表明年前往越南出席会议。\n\n　　会议一致通过2026年亚太经合组织领导人宣言，就亚太共同体建设提出“深圳展望”，以及贸易、联通、创新领域3项成果文件。\n\n　　蔡奇、王毅出席。(完) 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734613.shtml","source_display":"中國新聞網","published_at":"2026-11-19T14:37:43+08:00","cate 6-11-19T19:29:01+08:00","category":"內地","digest":"11月19日上午…"},{"title":"彭丽媛同亚太经合组织经济体领导人或代表配偶参观“岭南非遗传承与创新”主题展","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734812.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:56:41+08:00","category":"內地","digest":"11月19日上午…"}]},{"id":"c1e298881f0","title":"习近平：大国良性互动不是选择题，而是必答题","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734792.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","习近平指出，当今世界早已不是彼此隔绝的孤岛","人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T18:14:15+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。\n\n　　习近平指出，当今世界早已不是彼此隔绝的孤岛。人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体。在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。近年来，中国推进中俄新时代全面战略协作伙伴关系，积极构建中美建设性战略稳定关系，推动形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。当前，世界百年变局加速演进，天下并不太平。风雨见担当。作为世界主要大国和联合国安理会常任理事国，中俄美应该当好表率，合作应对全球性挑战，共同维护世界和平稳定，为人类进步作出更大贡献。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平：大国良性互动不是选择题，而是必答题","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734792.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:14:15+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平：大国良性互动不是选择题，而是必答题","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734714.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:43:00+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"c03b73816a5","title":"习近平：大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734790.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","习近平指出，和平是人类社会的永恒期盼","我们这个星球曾爆发过1万多次战争，两次世界大战更是给人类社会造成空前浩劫…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T18:13:29+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。\n\n　　习近平指出，和平是人类社会的永恒期盼。我们这个星球曾爆发过1万多次战争，两次世界大战更是给人类社会造成空前浩劫，当下世界上仍有60多场地区冲突延宕不止。历史告诉我们：大国和，则世界安；大国斗，则世界乱。80多年前，作为世界反法西斯的中坚力量，中俄美三国并肩奋战，取得伟大胜利，为世界赢得和平和安宁。历史是最好的教科书。我们要铭记历史，以史为鉴，开创未来。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"习近平：大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734790.shtml","source_display":"中新網 時政","published_at":"2026-11-19T18:13:29+08:00","category":"內地","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平：大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734712.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:41:10+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"c7826ed92b5","title":"APEC 1+1丨共促亚太繁荣：中国的建议与邀约","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734893.shtml","summary":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。","summary_short":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。","digest":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕","points":["17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕","在18日一系列的议程当中，APEC工商领导人峰会开幕式是最受瞩目的焦点","中国强调并始终推动开放、创新与合作"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:44:37+08:00","size":1,"keywords":[],"body":"17日，为期两天的APEC工商领导人峰会在深圳前海国际会议中心开幕。在18日一系列的议程当中，APEC工商领导人峰会开幕式是最受瞩目的焦点。中国强调并始终推动开放、创新与合作。这对亚太地区乃至世界会产生怎样的影响？“十五五” 规划蕴含哪些机遇惠及全球工商界？“世界湾区经济合作联盟”是什么？\r\n\n　　“十五五”规划蕴含哪些机遇惠及全球工商界？\n\n　　总台央视记者 徐卓阳：我在现场的时候感触很深。中国“十五五”和全球工商界是一体的、双向联动的。\n\n　　先说APEC对于“十五五”的意义。今年是中国第三次承办APEC，恰逢“十五五”开局之年，这场会议正是我们“十五五”开局阶段最重要的主场外交。\n\n　　再看“十五五”对于APEC能起到怎样的作用。我第一天连线时就谈到，期待来到深圳参会的嘉宾能够读懂中国质量。中国质量当中很重要的是经济质量，经济质量里很关键的一点，就是在全球经贸环境复杂多变的背景下，中国坚持以中长期规划统筹经济社会发展。这原本是我们自身发展的制度定力，而在亚太、在全球工商界眼中，这份定力正在形成一种独特的吸引力。\n\n　　就在峰会首日的工商对话上，全美商会会长克拉克谈到，地缘形势瞬息万变，企业最需要长期、稳定的信任关系。信任从哪里来？主旨演讲里提到的开放市场、广阔发展空间、互促共进的合作环境，都是大家可以信赖的支撑。\n\n　　而长期就体现在“十五五”这份规划上。五年周期对企业经营来说，是非常珍贵的定心丸，是企业求之不得的稳定预期。更大的长期则来自持续编制实施五年规划这套制度本身，“十五五”之后，还有“十六五”“十七五”，中国开放的大门只会越开越大，不会关上。\n\n　　所以对到场的全球工商界人士来说，他们收获的不只是一份合作邀约。面向未来共建亚太共同体、共促繁荣，中国有充足的诚意，在“十五五”乃至更长周期里持续敞开大门，欢迎各方伙伴前来携手合作。\n\n　　“世界湾区经济合作联盟”是什么？\n\n　　徐卓阳：这是全新的提法，非常激动人心，想象空间很大。我梳理三点理解。\n\n　　第一，全球公认的四大湾区，纽约湾区主打金融，旧金山湾区科创突出，东京湾区是历史上成熟的制造业，粤港澳大湾区起步最晚，但发展速度最快、市场潜力最大。现在湾区之间互动不少，但大多停留在企业、行业、个人这类微观层面，还缺少一个平台化的跨湾区经贸合作机制，一旦形成这样的协作平台，能够释放的能量值得期待。\n\n　　第二，这个联盟是全新的，我们都不知道长什么样子，是不是先把粤港澳大湾区的实践当作参照？我去搜了一下，大湾区已经有企业家联盟，还有会展、时尚等各类行业联盟，从官方到民间已经长出很多协同合作的载体，这些成熟经验，是不是可以为这个跨湾区新构想提供借鉴？\n\n　　接下来就是我个人最感兴趣的地方，既然这个新词是在深圳向世界提出的，向亚太提出的，接下来如果这个联盟有一个常设的理事处或者秘书处，会放在深圳吗？这会是本次APEC留给这个主办城市的一个长期的馈赠吗？是不是非常值得期待。联盟成立以后会有哪些活动？会对亚太非湾区经济体形成什么样的带动作用？给整个湾区注入什么样的新的活力？我觉得这个圈一划，有着对未来无穷的想象、无穷的力量。\n\n　　开放的共识如何转化成实际的行动？\n\n　　徐卓阳：18日的主旨演讲中提到，中国其实是一个巨大的创新实验场，天下大事，必作于细。这不就是落地嘛！华强北从改革开放发展到今天，生态已经越做越大，场所越来越新，往来的人越来越多。但是你要去看它最旺盛的生命力，还是在一个个小小的档口里面，在一些最细节的事情上面。\n\n　　《深圳特区报》上有华强北的整版报道，里面有一个细节我特别有感触。这边商户跟记者说，大厂偏好量大、技术方案成熟的订单；而来到这里的订单体量小，技术还处在起步阶段，最主要的是方案需要反复调来调去。\n\n　　在这里，大家都会非常耐心，帮你持续调试打磨。所以我觉得把小事做到极致，一个又一个小的梦想从这里起步、起飞，慢慢孕育成今天的华强北。说到大和小的关系，泰山不辞细壤，故能成其大。广阔的大市场里，一定会有这样小小的窗口；而一个个小窗口经过时间的孕育不断生长，到今天，这就是深圳这座“世界之窗”。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c30d82f0e54","title":"聚焦APEC丨亚太同心，共话合作新愿景","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734892.shtml","summary":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。","summary_short":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。","digest":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行","points":["11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行","来自亚太经合组织(APEC)21个经济体和英国、法国、德国…","从硬联通夯实物流基础，到软联通对接标准规则，再到心联通增进认同理解，互联互通不断向更深层次…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:43:15+08:00","size":1,"keywords":[],"body":"11月17日至18日，2026年亚太经合组织(APEC)工商领导人峰会在深圳举行。来自亚太经合组织(APEC)21个经济体和英国、法国、德国、瑞士等13个域外经济体的2000余位政商界代表齐聚南海之滨，深入探讨亚太区域开放合作、繁荣发展大计，携手集众智、促合作、求共赢。\r\n\n　　互联互通不断走深走实\n\n　　从硬联通夯实物流基础，到软联通对接标准规则，再到心联通增进认同理解，互联互通不断向更深层次、更广领域延伸，为推进亚太自贸区建设积蓄务实力量。\n\n　　-数智合作激活创新引擎\n\n　　数字经济浪潮澎湃，数智经贸合作也成为当前APEC各方共识基础最扎实、合作氛围最浓厚的领域。工商峰会上，中外嘉宾围绕贸易数字化、人工智能、数字服务等一系列议题深入交流，探讨如何加快创新应用落地与产业深度融合。\n\n　　-共促亚太繁荣美好未来\n\n　　《2026年亚太经合组织工商领导人峰会深圳倡议》18日对外发布，呼吁深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣。这是APEC工商领导人峰会创办30年来首次以倡议形式发布成果文件。\n\n　　扎根亚太、建设亚太、造福亚太，更加开放的中国正不断以中国式现代化新成就为亚太和世界提供新机遇。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdddbdc5dd5","title":"台胞胡良昇：APEC让世界看见新时代的深圳","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734871.shtml","summary":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","summary_short":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。","digest":"11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行","points":["中新网11月19日电(燕新台)11月18日至19日…","深圳，这座“创新之城”再度吸引全球目光","一句“来了就是深圳人”鼓舞人心"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:40:37+08:00","size":1,"keywords":[],"body":"中新网11月19日电(燕新台)11月18日至19日，亚太经合组织(APEC)第三十三次领导人非正式会议在深圳举行。深圳，这座“创新之城”再度吸引全球目光。\n\n　　一句“来了就是深圳人”鼓舞人心\n\n　　“今年APEC落地深圳，我感触很深。”深圳台商协会副会长、青年委员会主任委员胡良昇表示，APEC让世界看见新时代的深圳，他观察到不少海外媒体和国际博主前来深圳实地探访，都给出了真实且高度的正面评价。\n\n　　“希望本次参会的各国嘉宾在亲身体验这座城市的包容理念、发展速度与城市温度之后，能发自内心地说出那句——来了就是深圳人。”胡良昇认为，这句话“非常自豪，也非常鼓舞人心”。\r\n\n　　台湾青年能收获成长，才值得扎根\n\n　　由深圳台商协会主办的“WAY！来深圳”台湾青年深圳实习活动已连续举办近20年，累计吸引3000余名台湾在校大学生参与。\n\n　　在胡良昇看来，真正让台湾青年愿意在深圳扎根的，是这座城市的机遇与发展含金量。\n\n　　2026年，200余名台湾青年进入深圳60余家企业实习，其中科技类岗位约占四成，覆盖人工智能硬件研发、云计算技术支持、智能交通算法开发、跨境数字网络运营等细分方向。\n\n　　“台湾青年可以进入深圳科创企业一线实战、开眼界、练能力。他们看得很清楚：能在这里成长，才值得在这里扎根。”胡良昇说道。\n\n　　成长环境，决定眼界与视野\n\n　　胡良昇觉得，自己在深圳最大的收获，是身边聚集了大量优秀、敢拼敢闯的创业者与青年，多和这类人相处，自身的认知、格局、节奏都会被拉高。\n\n　　深耕科技产品出海领域多年的胡良昇，将深圳对创业者的助力总结为三点：一是高精尖人才密集，寻找团队、合作与技术伙伴效率更高；二是产业链完整、迭代速度快，产品从研发、打样到落地出海全链路效率突出；三是政府对科创产业扶持力度大、政策落地快，让创业者更敢于投入、创新并布局长期发展。\n\n　　胡良昇说，深圳一直在进化、蜕变，也推着创业者跟着这座城市一同成长。\n\n　　台湾同胞一定能“爱上深圳”\n\n　　作为在深逐梦十余年的台湾创业者，胡良昇也早已把这里当成了自己的家。一口熟悉的家乡味、一通打回台湾的视频电话……每逢节日，他总会和在深台胞们欢聚一堂。\n\n　　胡良昇也向从未到过深圳的台湾同胞发出邀请：一定要亲自到这座城市走走看看，感受这里的科技实力、商业活力、艺术氛围、生活节奏和饮食文化，找到属于自己“爱上深圳”的理由，切身感受“来了就是深圳人”的城市魅力。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfa9b5f49c6","title":"“未名·AI Park”在北京揭牌 共建人工智能创新转化高地","url":"https://www.chinanews.com.cn/edu/2026/11-19/10734878.shtml","summary":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。","summary_short":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。","digest":"“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌","points":["中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国…","“未名·AI Park”是百年京张AI创新带上的重要节点，其核心启动区选址北京大学西门外…","北京大学党委书记何光彩表示，北京大学依托深厚的基础研究和学科交叉优势…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:38:15+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 陈杭)“未名·AI Park”18日在北京市海淀区中关村国际创新大厦正式揭牌。“未名·AI Park”是百年京张AI创新带上的重要节点，其核心启动区选址北京大学西门外，旨在构建服务北京大学的“一公里转化圈”，立足北京大学优势AI学科资源与海淀科创沃土，打通“原始创新—技术攻关—成果落地—产业集聚”全链条。\n\n　　“未名·AI Park”由北京大学、北京市海淀区人民政府共建。\n\n“未名·AI　Park”在北京市海淀区中关村国际创新大厦正式揭牌。主办方供图\n\n　　北京大学党委书记何光彩表示，北京大学依托深厚的基础研究和学科交叉优势，持续推动科技创新与产业创新深度融合，把园区建成北京大学科技成果转化的核心承载区、海淀人工智能产业的特色地标。\n\n　　北京市海淀区委书记王少峰表示，海淀坚持把人工智能作为现代化产业体系的龙头和引领，全力建设具有全球影响力的人工智能产业高地；依托“五方六力”科技成果转化机制，推动政府服务向科研一线延伸，共同筑牢校地共建、产城共融的创新根基。\n\n　　中关村科学城管委会副主任、海淀区副区长唐超发布“未名·AI Park”人工智能创新街区(简称未名·AI Park)，从规划背景、空间布局、生态培育三个方面作出系统阐述，打造北京大学创新成果策源地、师生创业首选地、教育科技人才一体发展示范区。\n\n　　活动现场，北京大学计算机学院AI产学研协同创新基地、北京大学具身智能系统研究中心、北京大学AI+Math国际研究中心正式亮相。多场北京大学人工智能交叉领域科创项目路演接续开展；专家学者、企业家、投资机构齐聚，围绕技术攻关、项目孵化、产业合作开展面对面对接交流。\n\n　　下一步，北京市海淀区将以“未名·AI Park”为支点，撬动更多创新资源在北大周边集聚、向海淀全域辐射，培育更多前沿技术、优质项目和高端人才；要始终当好北大创新发展的合伙人，与政产学研金等各方，一起筑牢校地共建、产城共融的创新根基，为服务国家高水平科技自立自强作出新的更大贡献。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0c7a7890b8","title":"西藏发布“十五五”妇女儿童发展规划 重点向农牧区和边境地区倾斜","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734868.shtml","summary":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。","summary_short":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。","digest":"西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行","points":["中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会1…","根据发布会上的信息，相关政策举措将向农牧区、基层、边境一线倾斜","西藏自治区妇联主席、政府妇儿工委副主任旦珍介绍，妇女、儿童发展规划分别设8个领域76项…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T20:17:01+08:00","size":1,"keywords":[],"body":"中新社拉萨11月19日电 (记者 贡桑拉姆)西藏自治区“十五五”妇女儿童发展规划新闻发布会19日在拉萨举行。根据发布会上的信息，相关政策举措将向农牧区、基层、边境一线倾斜。\n\n　　西藏自治区妇联主席、政府妇儿工委副主任旦珍介绍，妇女、儿童发展规划分别设8个领域76项、7个领域75项主要目标。西藏已先后制定实施5轮妇女儿童发展规划。\n\n　　“十四五”期间，西藏孕产妇系统管理率、住院分娩率分别达85.38%和99.54%；学前教育毛入园率、九年义务教育巩固率、高中阶段毛入学率分别达92.83%、98.74%和92.04%；城镇新增就业女性占比41.18%。发布会也指出，农牧区和边境地区妇幼健康服务、教育资源供给仍不够均衡。\n\n　　西藏自治区卫生健康委员会副主任国吉说，将建立稳定投入机制，向高海拔、偏远、边境地区倾斜；将对长期居住高原的儿童开展慢性缺氧风险早期筛查，防治婴幼儿高原性肺动脉高压；推进适龄女童HPV疫苗免费接种，宫颈癌筛查率达70%以上；推广出生医学证明电子证照和“新生儿出生一件事”多证联办。\r\n\n　　西藏自治区民政厅儿童福利处一级调研员来子文表示，到2030年，保持孤儿、事实无人抚养儿童保障覆盖率100%，推动孤儿、事实无人抚养儿童保障申请“跨省通办”，方便异地安置儿童及时享受救助。\n\n　　西藏自治区人民检察院副检察长张萍表示，对侵害儿童犯罪保持“零容忍”，通过制发督促监护令、开展国家司法救助介入困境未成年人帮扶。她提到，《检察公益诉讼法》将于2027年1月1日起施行，将未成年人权益保障纳入公益诉讼法定领域。\n\n　　西藏自治区农业农村厅帮扶处处长仝富军表示，支持妇女发展民族手工艺、庭院经济、家庭牧场和农村电商，带领农牧区妇女走出家门，参与“村歌”“村舞”等“村字号”大型文体活动。(完) 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c32b66b9c61","title":"5000斤台湾午仔鱼在京开售 两岸业者盼更多宝岛水产品“登陆”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734559.shtml","summary":"中新网11月19日电(燕新台)18日上午，台湾渔产品输入北京开箱仪式在京举行，5000斤台湾午仔鱼在北京京深海鲜市场开箱销售。","summary_short":"中新网11月19日电(燕新台)18日上午，台湾渔产品输入北京开箱仪式在京举行…","digest":"18日上午，台湾渔产品输入北京开箱仪式在京举行…","points":["中新网11月19日电(燕新台)18日上午，台湾渔产品输入北京开箱仪式在京举行…","这是继10月23日台湾渔产品输入大陆启动后，北京首农水产集团与高雄渔业企业首次合作…","北京台资企业协会副会长兼秘书长施心木介绍，午仔鱼是台湾南部重要的渔业养殖产品…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T14:03:39+08:00","size":2,"keywords":[],"body":"中新网11月19日电(燕新台)18日上午，台湾渔产品输入北京开箱仪式在京举行，5000斤台湾午仔鱼在北京京深海鲜市场开箱销售。\n\n　　这是继10月23日台湾渔产品输入大陆启动后，北京首农水产集团与高雄渔业企业首次合作，也是入冬后北京市输入的第一批来自宝岛台湾的特色渔产品。\n\n　　“这批水产一到货，就基本上销售一空了。”京深海鲜批发市场总经理张扬波向记者表示，台湾水产品品种丰富，为北京市场带来了新的选择。\n\n　　北京台资企业协会副会长兼秘书长施心木介绍，午仔鱼是台湾南部重要的渔业养殖产品，广受台湾家庭喜爱。他表示，很高兴看到这类富有台湾特色的优质鱼货走进大陆广阔的市场，走进千家万户，让更多大陆消费者品尝到这份来自宝岛的美味。\r\n\n　　据悉，午仔鱼也称马友鱼，命名与端午节前后盛产并靠岸产卵的鱼汛有关，是台湾重要的高经济海水养殖鱼，以油脂丰厚、肉质细软肥嫩、骨细刺少著称。\n\n　　北京台协丰台区联谊会副会长刘品祥指出，两岸渔业交流既拓宽了台湾渔民的销路，也丰富了大陆消费者餐桌。“期待两岸在渔业、农产品、经济、文化等领域有更多交流互动。”\n\n　　国台办发言人陈斌华18日在例行新闻发布会上表示，在两岸企业共同努力下，今后还将有更多台湾优质渔产品进入北京市场。这既丰富了北京生鲜市场的产品品类，让京城消费者能品尝到宝岛渔产品，也助力台湾渔业业者拓展销售渠道，获得实实在在的收益。我们将持续推进落实十项促进两岸交流合作的政策措施，助力台湾农渔业者拓展大陆市场，让两岸更多同胞同获其利、共享其惠。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"5000斤台湾午仔鱼在京开售 两岸业者盼更多宝岛水产品“登陆”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734559.shtml","source_display":"中新網 時政","published_at":"2026-11-19T14:03:39+08:00","category":"內地","digest":"18日上午，台湾渔产品输入北京开箱仪式在京举行…"},{"title":"5000斤台湾午仔鱼在北京开箱即基本售罄 两岸业者期待更多台湾海鲜走进大陆市场","url":"https://www.chinanews.com/cj/shipin/2026/11-19/news1075438.shtml","source_display":"中新視頻","published_at":"2026-11-19T11:46:02+08:00","category":"財經","digest":"11月18日上午，5000斤台湾午仔鱼在北京京深海鲜市场开箱销售，上市后基本已售罄"}],"cross":{"total":2,"angles":[{"point":"18日上午，台湾渔产品输入北京开箱仪式在京举行…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734559.shtml"},{"point":"11月18日上午，5000斤台湾午仔鱼在北京京深海鲜市场开箱销售，上市后基本已售罄","sources":["中新視頻"],"url":"https://www.chinanews.com/cj/shipin/2026/11-19/news1075438.shtml"}]}},{"id":"cbeb75ee9ef","title":"习近平：三国会晤播下的种子必将生根发芽、开花结果","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734863.shtml","summary":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，总结此次会晤达成的主要共识。","summary_short":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤…","digest":"11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","points":["中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京…","习近平指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的…","我们都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:50:40+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤，总结此次会晤达成的主要共识。\n\n　　习近平指出，今天的中俄美元首会晤是积极的、建设性的，也是富有成果的，三国在维护世界和平上看法是一致的。我们都记得二战期间并肩作战的历史，强调要珍惜来之不易的和平。我们都同意大国应该重视各国合理安全关切。我们都主张对话谈判是化解分歧的正确选择。只要对话不停止、大门不关上，和平就有希望。我们都认为合作是应对挑战的必由之路，要基于共同利益加强合作，以合作促和平、谋共赢。今天三国会晤播下的种子，必将生根发芽、开花结果。中俄美三国要落实好会晤共识，继续加强沟通，以对话聚共识，以担当迎挑战，以合作促和平，共同推动建设一个更加美好的世界。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8d69662c80","title":"榕台职工福州探寻百年工业文脉","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734842.shtml","summary":"中新社福州11月19日电 (记者 闫旭)由福州市总工会主办的“匠心传承·融合发展”2026年榕台职工品质生活系列活动19日在福州启动，近100名福州和台湾职工当日循着跨越百年的工业文脉探访工业遗产。","summary_short":"中新社福州11月19日电 (记者 闫旭)由福州市总工会主办的“匠心传承·融合发展”2026年榕台职工品质生活系列活动19…","digest":"由福州市总工会主办的“匠心传承·融合发展”2026年榕台职工品质生活系列活动19日在…","points":["中新社福州11月19日电 (记者 闫旭)由福州市总工会主办的“匠心传承·融合发展”2026年…","福州是中国近代工业的重要发源地之一","在中国船政文化城，榕台职工走进轮机车间、铁胁厂，在“学堂寻根”定向闯关活动中体悟船政先辈工业…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:45:56+08:00","size":1,"keywords":[],"body":"中新社福州11月19日电 (记者 闫旭)由福州市总工会主办的“匠心传承·融合发展”2026年榕台职工品质生活系列活动19日在福州启动，近100名福州和台湾职工当日循着跨越百年的工业文脉探访工业遗产。\n\n　　福州是中国近代工业的重要发源地之一。在中国船政文化城，榕台职工走进轮机车间、铁胁厂，在“学堂寻根”定向闯关活动中体悟船政先辈工业报国的赤诚；在福建电力博物馆，两岸职工通过“百年电力·榕台共话”微讲堂，了解近代福州工业发展轨迹。\n\n图为11月19日，　“匠心传承·融合发展”2026年榕台职工品质生活系列活动启动，榕台职工共同走进中国船政文化城。　(福州市总工会 供图)\n\n　　“走进这座百年厂房，看着老设备，历史仿佛触手可及。”在福建电力博物馆，来自台湾的郑家铨说，近年来，福州加快建设两岸融合发展示范区先行城市，从台胞公租房到职业资格采认，从“福马同城通”卡到工会“娘家人”的贴心服务，他真切感到这里是可以安心扎根的家。\n\n　　此次活动中，榕台职工还将走进东南汽车城、福州茉莉花茶工业技艺工坊。“今天，在电力博物馆和船政文化城，我看到两岸共同的过去；明天，在东南汽车城，我期待看到两岸携手的未来。”台胞何经源说，两岸技术各有专长、正好互补，期待在“智造”之路上和更多两岸伙伴找到携手合作的机会。\n\n　　福州市总工会社联部负责人表示，工会将持续发挥桥梁纽带作用，不断丰富榕台职工交流载体，搭建技能切磋、创业创新、文化互动平台，吸引更多台湾青年来榕就业创业。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c31d21a9182","title":"石泰峰在陕西、四川调研时强调 深入学习贯彻习近平党建思想 推动全面从严治党各项任务落到实处","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734861.shtml","summary":"新华社成都11月19日电 中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西、四川调研。","summary_short":"新华社成都11月19日电 中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西、四川调研。","digest":"中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西、四川调研","points":["新华社成都11月19日电 中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西…","他强调，要深入学习贯彻习近平党建思想，全面落实党的二十届五中全会部署…","石泰峰来到延安，瞻仰杨家岭革命旧址，缅怀革命先辈的丰功伟绩，学习感悟延安精神"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:43:14+08:00","size":1,"keywords":[],"body":"新华社成都11月19日电 中共中央政治局委员、中央组织部部长石泰峰16日至19日在陕西、四川调研。他强调，要深入学习贯彻习近平党建思想，全面落实党的二十届五中全会部署，深刻领悟“两个确立”的决定性意义，坚决做到“两个维护”，以更高标准、更实举措推进全面从严治党，把党建设得更好更强，为全面建成社会主义现代化强国、以中国式现代化全面推进中华民族伟大复兴提供坚强保障。\n\n　　石泰峰来到延安，瞻仰杨家岭革命旧址，缅怀革命先辈的丰功伟绩，学习感悟延安精神。在延安、西安、成都，走进乡村、社区、企业、科研院所，深入园区、党群服务中心、新就业群体服务阵地，同党员干部群众交流，详细了解生产生活和基层党组织建设情况。调研期间，石泰峰主持召开座谈会，围绕学习贯彻习近平党建思想和五中全会精神听取意见建议。\n\n　　石泰峰指出，习近平党建思想是坚持“两个结合”推进党的理论创新的重大成果，是深入推进新时代党的建设新的伟大工程的根本遵循和行动指南。要把学习贯彻习近平党建思想和五中全会精神作为重大政治任务，分级分类推进党员、干部培训，深化理论研究阐释，推动入脑入心、见行见效。要弘扬理论联系实际的学风，坚持党的全面领导和党中央集中统一领导，扎实做好全面从严治党各项工作，把学习成效转化为管党治党、兴党强党的实际行动。要强化大抓基层鲜明导向，深入推进抓党建促乡村全面振兴，深化党建引领基层治理，用心用情解决群众急难愁盼问题。要进一步加强国有企业党的建设，促进党建工作与生产经营深度融合，以高质量党建引领企业高质量发展。要深化拓展新兴领域“两个覆盖”，做深做实思想政治引领、服务管理、合法权益保障，引导新就业群体听党话、跟党走。\n\n　　石泰峰还实地调研中国延安干部学院工作情况。他表示，中国浦东、井冈山、延安干部学院要坚持学院姓党，把学习贯彻习近平党建思想贯穿始终，用好红色资源，突出抓好党性教育主责主业，加强政绩观教育，推进从严治院、从严治教、从严治学，不断提高办学治院水平。 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cff029cf630","title":"（深圳APEC）专家解读深圳倡议：凝聚工商界共识，为世界注入确定性","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734853.shtml","summary":"中新社深圳11月19日电 (记者 郑嘉伟)《2026年亚太经合组织工商领导人峰会深圳倡议》(简称“深圳倡议”)18日对外发布…","summary_short":"中新社深圳11月19日电 (记者 郑嘉伟)《2026年亚太经合组织工商领导人峰会深圳倡议》(简称“深圳倡议”)18日对外…","digest":"《2026年亚太经合组织工商领导人峰会深圳倡议》(简称“深圳倡议”)18日对外发布…","points":["中新社深圳11月19日电 (记者 郑嘉伟)《2026年亚太经合组织工商领导人峰会深圳倡议》(…","多位受访专家学者表示，深圳倡议为亚太区域开放合作凝聚工商界共识，也为动荡不安的世界注入确定性","“深圳倡议把APEC工商咨询理事会全年讨论成果吸纳进来…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:29:13+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 (记者 郑嘉伟)《2026年亚太经合组织工商领导人峰会深圳倡议》(简称“深圳倡议”)18日对外发布，这是亚太经合组织(APEC)工商领导人峰会创办30年来首次以倡议形式发布成果文件。多位受访专家学者表示，深圳倡议为亚太区域开放合作凝聚工商界共识，也为动荡不安的世界注入确定性。\r\n\n　　“深圳倡议把APEC工商咨询理事会全年讨论成果吸纳进来，向APEC领导人非正式会议提出工商界建议，并列出工商界愿意参与的行动。”中国社会科学院世界经济与政治研究所所长廖凡接受中新社记者采访时表示，这体现亚太工商界在变乱交织的全球环境下主动凝聚共识，积极寻求确定性的意愿。\n\n　　中国人民大学国际关系学院教授、国际事务研究所所长王义桅认为，相比过往的声明文件，倡议更强调功能性合作与循序渐进。“没有强制约束，而是在共识的基础上协同推进相关工作，这也体现了求同存异的中国智慧。”\n\n　　从内容看，深圳倡议的指向十分具体——呼吁深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣。王义桅指出，这些呼吁都在回应当下最实在的“堵点”：一方面，全球单边主义、保护主义抬头，企业跨境经营面临规则碎片化和数字鸿沟；另一方面，AI、绿色低碳等新赛道带来系列新问题，工商界需要一套“能用的共同语言”来有效应对。\n\n　　回应这些堵点，靠的是打通区域内部循环。廖凡表示，亚太是全球最具活力的区域，当亚太经济体积极回应倡议呼吁，携手破除区域交通、贸易、规则和人文交流壁垒，加快推进一体化进程，让经济循环顺畅起来，就能有效稳定全球经济预期。\n\n　　王义桅表示，深圳倡议具有充分包容性，不对非APEC经济体关门，也不在APEC内部搞小圈子，而是把不同制度、不同发展阶段的经济体都吸纳进来，最大程度上形成全球经济复苏合力。\n\n　　针对AI等前沿技术带来的问题与风险，深圳倡议也在“创新增长：以技术创新驱动包容增长”中予以关注。南京大学国际关系学院教授朱锋认为，AI带来的技术挑战远超此前三次工业革命，面对AI潜藏的风险，没有任何经济体可以独善其身，深圳倡议有助于国际社会建立可共享的规则与评测工具，共同推动“AI向善”。\n\n　　“一分部署，九分落实。”廖凡强调，中国在倡议落实中的角色清晰：坚持开放创新、普惠包容，建设更高水平开放型经济新体制；以制度型开放实现更大范围、更宽领域、更深层次的开放格局，依托自贸区建设与国际通道联通激发动能，发挥引领作用。中国用自身发展的确定性，对冲世界的不确定性。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9d61d1d880","title":"李希在广西调研时强调 深入学习贯彻党的二十届五中全会精神 在持之以恒推进全面从严治党中更好担当尽责","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734844.shtml","summary":"新华社南宁11月19日电 中共中央政治局常委、中央纪委书记李希16日至19日到广西调研。","summary_short":"新华社南宁11月19日电 中共中央政治局常委、中央纪委书记李希16日至19日到广西调研。","digest":"中共中央政治局常委、中央纪委书记李希16日至19日到广西调研","points":["新华社南宁11月19日电 中共中央政治局常委、中央纪委书记李希16日至19日到广西调研","他强调，纪检监察机关在持之以恒推进全面从严治党中责任重大、使命光荣…","李希来到百色市田阳区兴城村、平陆运河征地搬迁沙坪镇安置点，与干部群众深入交流…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T19:23:17+08:00","size":1,"keywords":[],"body":"新华社南宁11月19日电 中共中央政治局常委、中央纪委书记李希16日至19日到广西调研。他强调，纪检监察机关在持之以恒推进全面从严治党中责任重大、使命光荣，要深入学习贯彻习近平新时代中国特色社会主义思想特别是习近平党建思想，认真学习贯彻党的二十届五中全会精神，深刻领悟“两个确立”的决定性意义、坚决做到“两个维护”，以更高标准、更实举措做好纪检监察各项工作。\n\n　　李希来到百色市田阳区兴城村、平陆运河征地搬迁沙坪镇安置点，与干部群众深入交流，听取对正风肃纪反腐的意见建议。他强调，纪检监察机关要有力保障全面推进乡村振兴，常态化整治群众身边不正之风和腐败问题，让群众获得感成色更足、幸福感更可持续、安全感更有保障。在广西南南铝加工有限公司，李希要求认真落实习近平总书记对国有企业党的建设工作作出的重要指示，深入推进国企党风廉政建设和反腐败斗争。在平陆运河马道枢纽，李希要求推进政治监督具体化、精准化、常态化，保障重大工程建设廉洁高效推进。\n\n　　调研期间，李希来到自治区纪委监委机关，详细了解工作情况，并主持召开部分省区纪委书记座谈会，听取对贯彻落实五中全会精神、做好纪检监察工作的意见建议。他强调，纪检监察机关作为推进全面从严治党的重要力量，要在学习贯彻五中全会精神上走在前、作表率。要深刻把握新时代全面从严治党伟大成就，坚定不移沿着习近平总书记指引的方向奋勇前行。深刻把握当前所处的历史方位和面临的形势任务，在保障实现党的使命任务、持之以恒推进全面从严治党、坚定走好中国特色反腐败之路中强化担当。深刻把握五中全会总体要求和战略部署，深学细悟笃行习近平党建思想，更加注重理论武装、党性锤炼，更加注重围绕中心、服务大局，更加注重严的基调、问题导向，更加注重标本兼治、系统施治，更加注重反腐为民、反腐惠民，更加注重科技赋能、提质增效，更加注重压实责任、形成合力，持之以恒强化政治监督、正风肃纪反腐，推动纪检监察工作高质量发展取得更大成效。深刻把握忠诚干净担当、敢于善于斗争要求，扎实推进“三化”建设年行动，在提升办案质效、加强队伍建设、强化纪法教育培训上进一步巩固深化，锻造政治过硬、能力过硬、作风过硬、廉洁过硬的纪检监察铁军。\n\n　　李希还来到中国工农红军第七军军部旧址、百色起义纪念馆，学习缅怀革命先辈丰功伟绩，要求纪检监察干部传承弘扬党的光荣传统，赓续“因党而生、为党而战”的红色基因，始终做党和人民的忠诚卫士。 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1e916450c3","title":"中俄美元首發表四點和平宣言 包括擬增精煉石油產品生產及供應｜附全文","url":"https://news.tvb.com/tc/1207300-中俄美元首發表四點和平宣言包括擬增精煉石油產品生產及供應附全文","summary":"中俄美元首發布四點和平宣言，包括計劃增加精煉石油產品的生產及供應，以及將就減少核風險對話。中俄美三國元首和平宣言全文中國國家主席習近平、俄羅斯總統普京、美國總統特朗普於2026年11月19日在深圳舉行會晤。","summary_short":"中俄美元首發布四點和平宣言，包括計劃增加精煉石油產品的生產及供應，以及將就減少核風險對話。","digest":"中俄美元首發布四點和平宣言，包括計劃增加精煉石油產品的生產及供應…","points":["中俄美元首發布四點和平宣言，包括計劃增加精煉石油產品的生產及供應，以及將就減少核風險對話","中俄美三國元首和平宣言全文","中國國家主席習近平、俄羅斯總統普京、美國總統特朗普於2026年11月19日在深圳舉行會晤"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T18:53:00+08:00","size":1,"keywords":["習近平","普京","大國外交","特朗普"],"body":"中俄美元首發布四點和平宣言，包括計劃增加精煉石油產品的生產及供應，以及將就減少核風險對話。\n\n中俄美三國元首和平宣言全文\n\n中國國家主席習近平、俄羅斯總統普京、美國總統特朗普於2026年11月19日在深圳舉行會晤。俄美領導人感謝中方主辦此次歷史性會晤。三國元首就當前國際形勢深入交換了意見，致力於維護戰略穩定和國際安全。\n\n一、中國、俄羅斯、美國作為聯合國安理會常任理事國，致力於推動聯合國改革，使之更有效應對全球性挑戰，並履行其維護國際和平與安全的基本使命。\n\n二、三國計劃增加精煉石油產品的生產和供應，以造福世界各國。三國重申能源穩定流動的重要性。\n\n三、三國元首認可國家同意原則和尊重國家官員享有豁免至關重要，一致認為國際刑事法院以及其他類似機構不得濫用管轄權。\n\n四、三國元首重申核戰爭打不贏也打不得。三國將就減少核風險、防止核擴散進行對話。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026DjKv5QNjN91795085253.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/2441704b5b30405a81947fe04da97a47/7ae529d106d2468e9d8bf77ecc8e4b1e-4cc14c416c202544e070564e49277054-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026DjKv5QNjN91795085253.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"cf2509da63f","title":"（深圳APEC）深圳留下近十年最全APEC“全家福”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734752.shtml","summary":"中新社深圳11月19日电 题：深圳留下近十年最全APEC“全家福”  　　中新社记者 张素  　　11月19日，深圳国际交流中心，应邀出席亚太经合组织(APEC)第三十三次领导人非正式会议的领导人…","summary_short":"中新社深圳11月19日电 题：深圳留下近十年最全APEC“全家福”  　　中新社记者 张素  　　11月19日…","digest":"题：深圳留下近十年最全APEC“全家福”  　　中新社记者 张素  　　11月19日…","points":["11月19日，深圳国际交流中心，应邀出席亚太经合组织(APEC)第三十三次领导人非正式会议的…","19日会议开始前，与会经济体领导人、代表戴上红蓝围巾，留下属于深圳的“APEC时刻”","这张集体合影里人员齐、规格高，被认为是近十年以来最全的APEC“全家福”"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:28:48+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：深圳留下近十年最全APEC“全家福”\n\n　　中新社记者 张素\n\n　　11月19日，深圳国际交流中心，应邀出席亚太经合组织(APEC)第三十三次领导人非正式会议的领导人、代表，留下一张具有标志性意义的集体合影。\n\n　　嘉宾身穿东道主特别设计的服饰拍摄“全家福”，是APEC大家庭的传统保留环节。19日会议开始前，与会经济体领导人、代表戴上红蓝围巾，留下属于深圳的“APEC时刻”。\n\n　　这张集体合影里人员齐、规格高，被认为是近十年以来最全的APEC“全家福”。从“全”“家”“福”三个字，或可更好读懂合影传递的信息。\n\n11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议。　中新社记者 赵文宇 摄\n\n　　“全”：APEC大家庭“整整齐齐”\n\n　　连日来，深圳宝安国际机场红毯铺不停。\n\n　　美国总统特朗普来了。去年在韩国庆州，特朗普参加了APEC工商领导人峰会，但在APEC领导人非正式会议前启程返美。\n\n　　俄罗斯总统普京来了，携3位副总理、7位部长出席深圳APEC盛会。上一次普京在线下出席APEC领导人非正式会议是在2017年。\n\n　　“在世界动荡变局中，大家都认为应坐下来探讨如何解决问题。更多国家选择‘向东看’，希望找到摆脱贫困和战争的办法，这也是APEC吸引力所在。”中国现代国际关系研究院研究员陈凤英说。\n\n　　30多年来，APEC促进亚太地区实现发展与繁荣。数据显示，APEC成员经济体以近全球40%的人口，创造了超出六成的全球经济总量。\n\n　　“亚太共同体区别于排他性‘小圈子’的特点在于，不让任何一个伙伴掉队。”四川大学国际关系学院讲席教授荣鹰表示，众多经济体领导人齐聚深圳，APEC大家庭“整整齐齐”，说明各方愿意以多边交流扩大合作“朋友圈”。\n\n　　“家”：彰显中国主场外交号召力\n\n　　从北京雁栖湖到深圳香蜜湖，各成员领导人、代表合影，将APEC会议的盛况定格在历史相册中。\n\n　　“这张近十年最全APEC‘全家福’，彰显中国办会的号召力。”陈凤英分析，一方面，中国已成为13个APEC经济体最大贸易伙伴，紧密联结的经贸纽带为亚太伙伴共享中国发展机遇筑牢根基。\n\n　　另一方面，当今世界风云变幻，中国发展的稳定性、确定性弥足珍贵。作为“多边主义的捍卫者和世界经济的重要引擎”，中国再次担任APEC东道主，也给动荡的世界带来更多确定性。\n\n　　今年，中方同各成员经济体一道成功举办了300多场各类会议和活动，APEC“中国年”取得一系列合作成果。在深圳，中方细致周密的安排也让外方宾至如归。\n\n　　“各经济体领导人、代表高度肯定中国作为东道主的努力和贡献，同时也期待中国为实现APEC目标和愿景作出更大贡献。”荣鹰说。\n\n　　“福”：合作像大鹏一样展翅高飞\n\n　　太平洋连接着亚太大家庭，承载着各方对美好生活的共同期待。\n\n　　有评论认为，在逆全球化与地缘博弈交织的当下，APEC“软协调”机制的意义反而凸显出来：它不必解决所有分歧，却能提供一个“先把分歧放一边、把合作做起来”的空间，让亚太合作像大鹏一样展翅高飞、鹏程万里。\n\n　　荣鹰说，各方积极参会，对亚太区域合作的未来方向和路径展开充分讨论，有利于挖掘更多机遇。\n\n　　深圳的故事本身就是亚太合作的成功范例。来到这座“奇迹之城”，当城市的故事与亚太的故事交汇，已有多位APEC经济体领导人表达对合作的期待。\n\n　　智利总统卡斯特走进水果门店，见证智利车厘子新产季在华开启；澳大利亚总理阿尔巴尼斯走进超市，考察龙虾等澳特产，表示“正致力于推动经济增长”；墨西哥总统辛鲍姆走进智慧医院，近距离了解深圳医疗的科技成果，并称要把先进科学技术成果引入墨西哥……\n\n　　陈凤英表示，APEC织密合作网络、拉紧利益纽带，有助于推动合作进一步走深走实。“开放、创新、合作”，不仅是中国主场外交的重点，也指向亚太合作的前方。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd3828d40de","title":"深圳APEC︱中俄美元首歷史性會晤 習近平：三國應守住和平共處底線","url":"https://www.stheadline.com/realtime-china/3638877/深圳APEC中俄美元首歷史性會晤-習近平三國應守住和平共處底線","summary":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。","summary_short":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","digest":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","points":["深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","習近平指出，中俄美三國最高領導人有史以來首次聚首，具有開創性意義","近年來，中國推進中俄新時代全面戰略協作夥伴關係，積極構建中美建設性戰略穩定關係…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:18:14+08:00","size":1,"keywords":[],"body":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。習近平指出，中俄美三國最高領導人有史以來首次聚首，具有開創性意義。 ​​​\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n習近平指出，當今世界早已不是彼此隔絕的孤島。人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體。在這個地球村裡，大國肩負著特殊責任。大國良性互動不是選擇題，而是必答題。近年來，中國推進中俄新時代全面戰略協作夥伴關係，積極構建中美建設性戰略穩定關係，推動形成和平共處、總體穩定、均衡發展的大國關係格局，既惠及彼此，又造福世界。\n習近平又指當前，世界百年變局加速演進，天下並不太平。風雨見擔當。作為世界主要大國和聯合國安理會常任理事國，中俄美應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定，為人類進步作出更大貢獻。\n相關新聞：深圳APEC︱特朗普晤習近平 表態：美國不支持「台獨」\n習近平指出，和平是人類社會的永恆期盼。我們這個星球曾爆發過1萬多次戰爭，兩次世界大戰更是給人類社會造成空前浩劫，當下世界上仍有60多場地區衝突延宕不止。歷史告訴我們：大國和，則世界安；大國鬥，則世界亂。80多年前，作為世界反法西斯的中堅力量，中俄美三國並肩奮戰，取得偉大勝利，為世界贏得和平和安寧。歷史是最好的教科書。我們要銘記歷史，以史為鑒，開創未來。\n大國如何正確相處提出4點看法\n第一，堅持相互尊重。相互尊重是大國交往的基本準則。中俄美三國國情不同，誰也改變不了誰，這是歷史形成的，也是各自人民的自主選擇。正確的態度是彼此尊重、求同存異、共同發展。要尊重彼此主權和領土完整，尊重各自選擇的社會制度和發展道路，尊重彼此核心利益和重大關切。要堅持不干涉別國內政，不干涉彼此內部事務。在涉及對方的重大敏感問題上，提前溝通、換位思考、謹慎行事，特別是不能觸碰對方的底線。\n第二，堅持和平共處。「修昔底德陷阱」絕不是宿命，關鍵要看主要大國如何抉擇。中俄美要做夥伴、做朋友，不衝突、不對抗，守住和平共處底線，努力跨越「修昔底德陷阱」。中俄美都是二戰主要戰勝國，應當堅定維護戰後國際秩序，維護《聯合國憲章》宗旨，捍衛來之不易的二戰勝利成果。核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n相關新聞：深圳APEC｜普京隨行軍官直認手上「核公事包」 中美俄會晤前「騷肌肉」？\n第三，堅持合作共贏。三國發展稟賦不同，經濟互補性強，可以發揮自身優勢，互通有無。應該摒棄冷戰思維，加強經貿合作，將資源大國、製造大國、消費大國的各自優勢貫通起來，共同做大合作蛋糕，實現雙贏共贏，而不能搞「脫鉤斷鏈」。全球能源安全面臨嚴峻挑戰，三國可以加強溝通和協調，共同維護能源產業鏈供應鏈穩定暢通，維護全球能源市場安全穩定。\n第四，堅持對話協商。大國間有分歧在所難免，如果不溝通，猜忌便會蔓延，小摩擦也可能演變成大衝突。三國要保持常態化高層交往，暢通各層級對話渠道，建立危機溝通和預防機制，確保誤判少發生、分歧管得住、摩擦不升級。當前，全球各種紛爭持續不斷，熱點問題按下葫蘆浮起瓢，國際社會期待大國多做勸和促談工作。中俄美三國應該繼續推動衝突當事方坐下來、談起來，通過政治外交手段化解紛爭。\n習近平：最終建設無核世界\n習近平：堅持和平共處。「修昔底德陷阱」絕不是宿命，關鍵要看主要大國如何抉擇。中俄美要做夥伴、做朋友，不衝突、不對抗，守住和平共處底線，努力跨越「修昔底德陷阱」。中俄美都是二戰主要戰勝國，應當堅定維護戰後國際秩序，維護《聯合國憲章》宗旨，捍衛來之不易的二戰勝利成果。核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n相關新聞：深圳APEC︱特朗普晤習近平 稱「美中同盼俄烏伊朗止戰」\n美國總統特朗普在會議開幕致辭中則表示，「這三個國家（美中俄）在討論核武問題上具有獨特的優勢」。特朗普還補充說：「過去的領導人常常避免與那些和他們意見相左的領導人交談」。他表示，減少溝通機會絕不會締造和平，美中俄肩負著解決影響全球問題的重大責任。\n特朗普稱我們必須合作打擊全球核擴散威脅、擁有核武器，為此今天我們將討論所有相關議題。\n相關新聞：深圳APEC｜金正恩視察咸鏡南道 朝方未回應是否與特朗普會晤\n俄羅斯總統普京則感謝中方積極組織今次三國元首會晤。他強調，中美俄三國同為第二次世界大戰戰勝國，對維護全球和平穩定負有特殊責任，並表示烏克蘭局勢將是今次會談的重點議題。\n普京向中美兩國領導人表示，只要俄羅斯、中國和美國進行建設性合作，便能加強全球穩定。他說：「我們三國在解決地區衝突方面擁有許多共同利益，當中自然也包括烏克蘭衝突。」\n普京進一步指出，他與習近平、特朗普可以「為加強全球安全與穩定作出有意義的貢獻，前提是我們必須展開建設性合作」。\n相關新聞：深圳APEC︱ 習近平：大國和則世界安，大國鬥則世界亂︱不斷更新\n國家主席習近平在中俄美元首三方會議前，先與美國總統特朗普雙邊會晤。兩人在深圳麒麟山莊會面，歷時約1小時。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca6802e74fa","title":"河南省商丘市人大常委会原党组成员、副主任张团结被“双开”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734683.shtml","summary":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员、副主任张团结严重违纪违法问题进行了立案审查调查。","summary_short":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员…","digest":"据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员…","points":["中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准…","经查，张团结丧失理想信念，背弃初心使命，对抗组织审查","无视中央八项规定精神，收受可能影响公正执行公务的礼金、消费卡，违规配备使用公务用车"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:57:07+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员、副主任张团结严重违纪违法问题进行了立案审查调查。\n\n　　经查，张团结丧失理想信念，背弃初心使命，对抗组织审查；无视中央八项规定精神，收受可能影响公正执行公务的礼金、消费卡，违规配备使用公务用车；违背组织原则，在组织函询时不如实说明问题，利用职权为他人谋取人事利益并收受财物；廉洁底线失守，借用管理和服务对象的车辆，通过民间借贷获取大额回报，违规从事营利活动，利用职权为他人谋取利益并收受财物；不正确履行职责，造成不良影响；丧失纪法底线，大搞权钱交易，利用职务便利为他人在项目承揽、职务调整等方面谋取利益，非法收受巨额财物。\n\n　　张团结严重违反党的政治纪律、组织纪律、廉洁纪律、工作纪律和国家法律法规，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经河南省纪委常委会会议研究并报中共河南省委批准，决定给予张团结开除党籍处分；由河南省监委给予其开除公职处分；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf0ee547996","title":"第六届世界华文教育大会在海南召开","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734703.shtml","summary":"新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开。","summary_short":"新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开。","digest":"第六届世界华文教育大会11月18日至19日在海南博鳌召开","points":["新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开","大会期间，来自全球70多个国家和地区的近600名代表，围绕“新格局、新华教、新发展”主题…","与会代表表示，海外华文教育作为海外侨胞自主创办的中华语言文化教育事业…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:25:55+08:00","size":1,"keywords":[],"body":"新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开。大会期间，来自全球70多个国家和地区的近600名代表，围绕“新格局、新华教、新发展”主题，总结华文教育发展成效和经验，聚焦新形势下华文教育的使命任务，共商未来发展大计。\n\n　　与会代表表示，海外华文教育作为海外侨胞自主创办的中华语言文化教育事业，长期以来在凝聚侨心侨力、传承中华文化和推动中外友好交流等方面发挥了重要作用。今年是“十五五”开局之年，中国的发展正站在新的历史起点上，华文教育发展迎来难得机遇和广阔空间。华文教育工作者应坚守教育初心，积极推进华文教育标准化、正规化、专业化、信息化建设，不断提高办学水平和质量，发挥融通中外的独特优势，讲好中国故事，促进中外民心相通和文明交流互鉴，让世界各国人民通过华文教育了解一个可信、可爱、可敬的中国，为构建人类命运共同体作出新的更大贡献。\n\n　　会前，中共中央政治局委员、中央统战部部长李干杰会见出席大会的全体代表并合影留念。 【编辑:吴青潞】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6f7f270d93","title":"中国人民对外友好协会会长杨万明访问尼泊尔","url":"https://www.chinanews.com.cn/gn
