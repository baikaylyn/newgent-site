深圳作为中国改革开放的重要窗口，与本届APEC会议确定的“开放、创新、合作”三大优先领域相互呼应，传递出一个清晰信息：合作与创新是实现经济增长、激发区域活力的重要动力。\n\n　　美联社还进一步关注到中国在数字经济和人工智能领域深化合作，为国际投资者创造更加有利的环境的意愿。\n\n　　广东发展彰显开放优势\n\n　　深圳创新活力吸引世界\n\n　　除区域合作议题外，深圳的城市发展和科技创新实力，也是外媒关注的另一大焦点。\n\n　　美联社关注到，深圳在过去40多年间，已从一个渔村发展成为拥有众多摩天大楼、集出口制造业与科技产业于一体的城市。\n\n　　新西兰“亚洲媒体中心”网站报道称，深圳是一座具有开放基因、持续创新活力和跨领域合作精神的城市。报道认为，深圳从渔村成长为科技与制造业中心的历程，是中国改革开放的一个缩影，也展现了亚太地区合作所蕴含的发展潜力。\n\n　　俄罗斯塔斯社则将深圳称为中国现代化发展的一个奇迹，指出这座城市在短短几十年间，从一个小渔村发展成为全球电子产品和高科技产品制造中心。俄罗斯总统助理乌沙科夫表示，深圳是一座在许多方面都独一无二的城市。\n\n　　美国商业资讯(Business Wire)网站刊文，将本届APEC会议与广东经济发展及全球贸易联系起来。\n\n　　报道关注到，广东正加大对先进制造、智能互联、生物技术和可再生能源等新兴领域的投资；借助本届APEC会议，广东有望进一步深化区域经贸伙伴关系、吸引国际投资，并提升其在亚太供应链中的地位。\n\n　　从深圳的产业升级到广东的外贸增长，从人工智能到绿色技术，外媒的报道展现出一个共同视角：深圳不仅是本届APEC会议的举办地，也是观察中国经济活力、创新能力和开放水平的重要窗口之一。\n\n　　塔斯社报道援引俄罗斯总统特别代表、俄罗斯直接投资基金总裁基里尔·德米特里耶夫的话称，2026年亚太经合组织工商领导人峰会是一场旨在促进对话、合作、和平与繁荣的会议。\n\n 【编辑:管娜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0322ea80f7","title":"澤連斯基倡召開歐洲有份四方會談 多國領袖與普京劃清界線","url":"https://news.tvb.com/tc/1207382-澤連斯基倡召開歐洲有份四方會談多國領袖與普京劃清界線","summary":"美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障。烏克蘭總統澤連斯基，倡議召開歐洲有份的四方會談。","summary_short":"美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障。","digest":"美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障","points":["美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障","烏克蘭總統澤連斯基，倡議召開歐洲有份的四方會談","歐洲多國領袖表明，跟俄羅斯總統普京劃清界線"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T09:10+08:00","size":1,"keywords":[],"body":"美國及歐洲多國代表開會，討論是否向烏克蘭提供類似北約「集體防禦」的安全保障。烏克蘭總統澤連斯基，倡議召開歐洲有份的四方會談。歐洲多國領袖表明，跟俄羅斯總統普京劃清界線。普京就稱無意就海上停火談判。\n\n俄烏戰事持續將近4年9個月，烏克蘭周四指俄羅斯出動多枚反艦導彈及近百架無人機，向烏方至少18處施襲。\n\n在首都基輔，奧地利駐烏克蘭大使館輕微受損。荷蘭駐當地大使館亦受波及，荷蘭有軍火商宣稱，烏軍過去周二襲擊克里米亞大橋，部分導彈來自該公司。俄羅斯與荷蘭關係轉趨緊張，莫斯科質疑荷蘭當局公然參與衝突。\n\n由英、法兩國主導，約40個支援烏克蘭國家組成的「自願聯盟」，同日在德國柏林開會，討論如何加強援烏及長遠安全問題。美國總統特朗普女婿庫什納，及特使威特科夫亦有與會。\n\n庫什納指，美方倡議向烏克蘭提供類以北約第五條款，有關集體防衛機制是至關重要，特朗普對此持開放態度。庫什納宣稱，一直反對烏克蘭加入北約的俄羅斯，對烏方可能獲安全保證感「舒暢」，意味俄方可能接納美國方案。\n\n美方談判代表庫什納表示：「那是我們已達成的極大進展，我方已令俄方感到舒暢，任何給予烏方的安全保障都建基於北約第五條款，至少呼應俄羅斯人的意願，即是戰事結束後，不再爆發另一戰爭。」\n\n烏克蘭總統澤連斯基就表明，現在是時候舉行烏、歐、美、俄四方會談，他不忘指控俄羅斯總統普京，一直拒絕接受為局勢降溫的方案。\n\n身為東道主的德國總理默茨表示，美方知道若沒有歐洲參與推動俄烏達成協議，就不會帶來和平。另有部分歐洲國家領袖，包括波蘭總理圖斯克，表明要跟普京劃清界線。\n\n丹麥首相弗雷澤里克森就憂慮，普京在深圳跟國家主席習近平及特朗普舉行三方會晤後，莫斯科會變得更大膽。\n\n至於普京周四在深圳召開記者會，強調挑起戰爭的是烏克蘭，而不是俄羅斯。他稱同意由美方提出的妥協方案，問題在於烏方及其歐洲支持者是否願意接受，並質疑烏方無意停戰。\n\n對於克里米亞大橋多次遇襲，普京表明俄方無意跟烏方就海上停火，或停止攻擊能源設施方面談判。","image":"https://pro-vod-cdn.tvb.com/b79e325a87e74a8181e5a49edcb20de7/snapshots/a8cb19f951634057825f3748ba90442e-00008.jpg","video":"https://pro-vod-cdn.tvb.com/b79e325a87e74a8181e5a49edcb20de7/4254d2f0e12243eeaa3edc92fd38a499-dfd2c60bbece9f4cf67c88bbee954c42-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/b79e325a87e74a8181e5a49edcb20de7/snapshots/a8cb19f951634057825f3748ba90442e-00008.jpg","lang":"zh-Hant"},{"id":"c73ff45784b","title":"日本民众集会反对高市政府扩军修宪动向","url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075528.shtml","summary":"","summary_short":"","digest":"日本民众集会反对高市政府扩军修宪动向","points":[],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T10:00:31+08:00","size":2,"keywords":[],"body":"","image":"","video":"https://video.chinanews.com/tvmining/News/MP4ZXW/test/2026/11/20/iQt6m62_1795135950362_SjgDBhd_6383.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"日本民众集会反对高市政府扩军修宪动向","url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075528.shtml","source_display":"中新視頻","published_at":"2026-11-20T10:00:31+08:00","category":"國際","digest":"日本民众集会反对高市政府扩军修宪动向"},{"title":"上万日本民众举行抗议集会 反对高市政府扩军修宪","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735056.shtml","source_display":"中新網 環球","published_at":"2026-11-20T09:39:38+08:00","category":"國際","digest":"据日本《东京新闻》报道，当地时间19日，上万名日本民众在东京日本国会议事堂举行集会…"}],"cross":{"total":2,"angles":[{"point":"日本民众集会反对高市政府扩军修宪动向","sources":["中新視頻"],"url":"https://www.chinanews.com/gj/shipin/2026/11-20/news1075528.shtml"},{"point":"据日本《东京新闻》报道，当地时间19日，上万名日本民众在东京日本国会议事堂举行集会…","sources":["中新網 環球"],"url":"https://www.chinanews.com.cn/gj/2026/11-20/10735056.shtml"}]}}]},{"name":"民生","total":53,"items":[{"id":"c32ba3b8215","title":"广西首例心肺联合移植患者痊愈出院","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735200.shtml","summary":"中新网南宁11月20日电(陈沿佑 王东栋)11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院。","summary_short":"中新网南宁11月20日电(陈沿佑 王东栋)11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院…","digest":"11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院","points":["中新网南宁11月20日电(陈沿佑 王东栋)11月19日…","这是广西首例心肺联合移植手术，该例手术的成功，填补了广西在此项技术领域的空白…","20年间，活动后气促始终困扰着他，其先后到过国内多家心血管权威医院就诊治疗…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T14:18:27+08:00","size":2,"keywords":[],"body":"中新网南宁11月20日电(陈沿佑 王东栋)11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院。这是广西首例心肺联合移植手术，该例手术的成功，填补了广西在此项技术领域的空白，也标志着广西器官移植与危重症救治的整体水平迈上了新台阶。\n\n11月19日，接受心肺联合移植手术的患者(中)与家属给医生团队送锦旗。陈沿佑 摄\n\n　　据了解，该名37岁患者的病史可追溯至33年前，其幼年感冒体检时发现心脏杂音，当时未予重视，之后顺利成长。2007年病情加重后就诊，确诊为“先天性心脏病、室间隔缺损合并重度肺动脉高压”，次年接受心脏畸形矫治手术，但其肺动脉高压并未随手术缓解，反而逐年加重。20年间，活动后气促始终困扰着他，其先后到过国内多家心血管权威医院就诊治疗，但病情仍在持续进展。\n\n　　今年9月20日，患者因“再发胸闷伴出现咯血2天”入住某家三甲医院CCU，虽经积极治疗，但心衰仍急性加重，很快发展为心源性休克。9月24日凌晨，患者突发“呼吸急促、大汗淋漓”，血压降至80/50毫米汞柱，血氧饱和度仅80%，当地医院紧急行气管插管并启动VA-ECMO(静脉—动脉体外膜肺氧合)支持，随后连夜转入广西医科大学第二附属医院重症医学科进一步治疗。\n\n　　经相关医生评估后认为，该患者的病，用药物和常规手术治疗已无逆转可能，“心肺联合移植”是唯一有效的救治方法。医院随即组织移植医学研究所、胸心外科、心血管内科、麻醉科、呼吸与危重症医学科等多学科团队会诊，在VA-ECMO桥接支持下完成器官移植术前评估，并将其录入器官移植等待系统。\n\n　　10月22日，匹配的供体出现，患者进入手术室接受心肺联合移植手术。历经五个多小时，手术成功。\n\n　　“经过二十多天的各项看护，他现在恢复得不错，生活可以自理，还能下床走几步”，患者妻子陈康(化名)表示，家中孩子每天都会询问父亲的病情，这次终于能回家了。\n\n　　广西医科大学第二附属医院副院长、移植医学研究所所长孙煦勇表示，心肺联合移植手术牵涉很多学科，对医院的组织协调能力有着极大考验，在手术过程中的每个环节都不能出现过多耽搁，这是一个很严峻的挑战。\n\n　　“广西没有做过这类手术，在别的地方，这种联合移植手术也属于个位数，没有太多经验来借鉴。我们对肝肾、心肝、心肾等联合移植，是有挺多经验的，这些经验对这次心肺联合移植手术有很大的帮助。这例手术的成功实施，病人成功康复出院，对我们来说，在器官移植的‘版图’就画上了一个圆满的句号。”孙煦勇说。\n\n　　据悉，中国首例心肺联合移植手术于1995年由中国医学科学院阜外医院完成，此后国内该项移植手术仅有少数零星开展。因该项手术技术门槛高，受供体心肺匹配条件严苛等因素限制，整体开展规模始终有限。目前全国具备常规开展手术能力的医疗机构不足5家，年完成手术量不足10例。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"广西首例心肺联合移植患者痊愈出院","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735200.shtml","source_display":"中新網 社會","published_at":"2026-11-20T14:18:27+08:00","category":"","digest":"11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院"},{"title":"广西首例心肺联合移植患者痊愈出院","url":"https://www.chinanews.com/shipin/cns-d/2026/11-20/news1075554.shtml","source_display":"中新視頻","published_at":"2026-11-20T13:42:43+08:00","category":"其他","digest":"11月19日，一名接受心肺联合移植手术的患者从广西医科大学第二附属医院痊愈出院"}]},{"id":"c03bea1b86e","title":"富平赴南昌开展两场文旅推介 推进赣陕文旅协作","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735330.shtml","summary":"中新网南昌11月20日电 陕西富平县日前于江西南昌举办两场文旅推介活动，依托活动搭建黄河文化与长江文化交流平台，拓展省外旅游客源市场。","summary_short":"中新网南昌11月20日电 陕西富平县日前于江西南昌举办两场文旅推介活动，依托活动搭建黄河文化与长江文化交流平台…","digest":"陕西富平县日前于江西南昌举办两场文旅推介活动，依托活动搭建黄河文化与长江文化交流平台…","points":["中新网南昌11月20日电 陕西富平县日前于江西南昌举办两场文旅推介活动…","推介活动首先走进南昌航空大学，面向在校青年学生开展文旅宣讲与非遗展演","其后移至万寿宫历史文化街区举办，现场设置展销展台，集中展示当地非遗、文创及特色旅游商品"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T17:10:50+08:00","size":1,"keywords":[],"body":"中新网南昌11月20日电 陕西富平县日前于江西南昌举办两场文旅推介活动，依托活动搭建黄河文化与长江文化交流平台，拓展省外旅游客源市场。\n\n　　推介活动首先走进南昌航空大学，面向在校青年学生开展文旅宣讲与非遗展演。其后移至万寿宫历史文化街区举办，现场设置展销展台，集中展示当地非遗、文创及特色旅游商品。\n\n活动现场。主办方供图\n\n　　国家级非遗阿宫腔《挂画》《断桥》等折子戏当日进行现场演出，非遗代表性传承人向市民演示花馍制作、石刻拓片等技艺。活动同时介绍富平老城、中华郡景区等文旅资源，发布门票、温泉相关惠民政策。\n\n　　活动期间，赣陕两地旅行社行业协会签署战略合作协议，围绕高铁沿线文旅市场，确定资源共享、客源互送、市场互通等合作方向，推动两地跨区域文旅协作走向常态化。\n\n　　据了解，富平此前已赴瑞金开展文旅对接，就跨区域旅游线路、客源输送达成初步意向。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c52c70c820a","title":"山东各地开展供热保障工作 守护民众冬日暖意","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735328.shtml","summary":"中新网济南11月20日电 (刘驰原)立冬过后，寒意渐浓。","summary_short":"中新网济南11月20日电 (刘驰原)立冬过后，寒意渐浓。","digest":"立冬过后，寒意渐浓","points":["中新网济南11月20日电 (刘驰原)立冬过后，寒意渐浓","山东各地开展供热保障工作，从管网体检、系统调试、智慧调度等方面发力，全力保障民众温暖过冬","连日来，济南市莱芜区高庄街道安仙村莲花河小区组织施工团队对地下供热管道开展检修抢修"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T17:10:40+08:00","size":1,"keywords":[],"body":"中新网济南11月20日电 (刘驰原)立冬过后，寒意渐浓。山东各地开展供热保障工作，从管网体检、系统调试、智慧调度等方面发力，全力保障民众温暖过冬。\n\n　　连日来，济南市莱芜区高庄街道安仙村莲花河小区组织施工团队对地下供热管道开展检修抢修。施工现场，维修人员深入井下，排查管道运行状况、定位破损点位，同步进行管道检修、污垢清理等作业。物业工作人员则在井上统筹调度施工进度，设置警戒防护，疏导过往行人和车辆，保障施工安全。\n\n　　据了解，莲花河小区物业抢抓供热前窗口期，对供热管网进行隐患排查、维修养护工作，常态化巡检管网工况，及时消除地下管网渗漏、堵塞等问题，为平稳供热打下基础，让居民住得更安心、舒心。\n\n　　济宁市太白湖新区和鸣天著小区换热站内，济宁市北湖科技供热有限责任公司运行主管王永前俯身查看控制柜，逐项记录供回水温度、压力参数，仔细检查阀门接口是否渗水。\n\n　　“换热站就像小区的‘心脏’，热量经过这里转换、输送，再送到家家户户。”王永前向记者介绍，连日来，供热团队有序开展注水试压、管道冲洗、冷循环和排气调试工作，对庭院管网、楼内立管和用户末端设施展开拉网式巡查。\n\n工作人员对管道进行检修。济宁市委宣传部供图\n\n　　和鸣天著小区的供热筹备工作，是太白湖新区落实“应供尽供”承诺、回应民众用热需求的生动缩影。今年以来，当地推行“一小区一策”，不再以入住率为门槛，而是根据居民用热需求进行供热，同时持续推进老旧供热设施改造，目前已完成庭院管道改造2公里、住宅楼内管道改造1公里，新建及升级换热站11座，更换二次网分支阀门230个、立管补偿器128个，有效提升供热管网承压与循环能力。\n\n　　如果说管网改造是强基固本，那么科技赋能则让供热调控更加精细。走进菏泽永恒热力有限公司(以下简称“永恒热力”)智慧服务大厅，电子屏幕上实时滚动着各片区热力运行参数。为提升供热精准度，该公司今年新增室温采集器4000套，更换、维修热表108块，实时采集住户室温、管网运行数据，依托大数据实现热网调度智慧化、精准化。\n\n　　其中，永恒热力建邦公园换热站作为智慧供热技术示范站点，实现站内高低区参数集中可视化展示，可对声音、图像等多维度异常进行智能识别和预警。同时，站内搭载AI语音对讲交互功能，运维人员通过语音对话即可调取站内运行数据，补齐传统换热站人工巡检效率低、隐患发现滞后、数据查询繁琐的短板，推动换热站向智能化、少人化运维模式升级。\n\n　　在强化智慧调度的同时，永恒热力同步配齐线上服务力量，采暖季期间实行24小时值守机制，供热咨询、投诉热线全天候畅通；建立问题闭环处理响应体系，普通问题24小时办结、复杂问题72小时闭环，保障供热服务持续在线。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce69b406aa2","title":"四川成都：孤岛变猫岛 两种“守护”让善意延续","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-20/news1075575.shtml","summary":"近日，在成都天府新区，一座约1500平方米的“荒岛”，变成了流浪猫的栖身之所。","summary_short":"近日，在成都天府新区，一座约1500平方米的“荒岛”，变成了流浪猫的栖身之所。","digest":"近日，在成都天府新区，一座约1500平方米的“荒岛”，变成了流浪猫的栖身之所","points":["近日，在成都天府新区，一座约1500平方米的“荒岛”，变成了流浪猫的栖身之所","这座属于流浪猫的“桃花源”不仅为流浪猫遮风避雨，也聚集了一群志同道合的志愿者","2026年7月，成都“花花猫岛”正式开放投运"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T16:31:52+08:00","size":1,"keywords":[],"body":"近日，在成都天府新区，一座约1500平方米的“荒岛”，变成了流浪猫的栖身之所。这座属于流浪猫的“桃花源”不仅为流浪猫遮风避雨，也聚集了一群志同道合的志愿者。\n\n2026年7月，成都“花花猫岛”正式开放投运。目前，猫岛共安置47只流浪猫。除集中收容外，团队还将救助延伸至社区、高校等地，通过捕捉、绝育、放归等方式，并推行志愿服务“工分制”，以人为本，尝试从源头减少流浪猫无序繁殖。\n\n从收容流浪猫，到为救助者提供支持，团队希望将一座猫岛逐步发展为连接更多救助力量的平台。让救助不再依赖少数人的独自付出，让善意有机会长久延续。\n\n杨予頔 四川成都报道","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/55C8D0C8FD884415841FB67F58D84AAD.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ceb65fd0613","title":"“长春大冬号”主题彩绘飞机亮相","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075573.shtml","summary":"11月20日，长春龙嘉国际机场，“长春大冬号”主题彩绘飞机亮相。","summary_short":"11月20日，长春龙嘉国际机场，“长春大冬号”主题彩绘飞机亮相。","digest":"11月20日，长春龙嘉国际机场，“长春大冬号”主题彩绘飞机亮相","points":["机身设计历经20多轮打磨，采用60余种色彩，君子兰、“四时俱好是长春”、净月潭林海雪原…","该飞机作为“空中信使”，将向旅客展现长春风貌，传递大冬盛会的青春邀约","长春2027第33届世界大学生冬季运动会将于2027年1月15日至25日举办"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T16:23:37+08:00","size":1,"keywords":[],"body":"11月20日，长春龙嘉国际机场，“长春大冬号”主题彩绘飞机亮相。\n\n据了解，机身设计历经20多轮打磨，采用60余种色彩，君子兰、“四时俱好是长春”、净月潭林海雪原、吉祥物“吉冰”“吉雪”以及长春大冬会会徽五大元素图案自机首向机尾铺展。该飞机作为“空中信使”，将向旅客展现长春风貌，传递大冬盛会的青春邀约。\n\n长春2027第33届世界大学生冬季运动会将于2027年1月15日至25日举办。","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/DFC0F76F8B6D43D6A8433BAE461504E4.mp4","video_poster":"","lang":"zh-Hans"},{"id":"caa2062f49a","title":"寻访诗词文脉 赴一场长安诗约","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735294.shtml","summary":"一座长安城，半部《全唐诗》。","summary_short":"一座长安城，半部《全唐诗》。","digest":"一座长安城，半部《全唐诗》","points":["在西安，古典诗词不再只是典籍里的文字，而是散落在城垣街巷、碑石古塔、山水舞台之间…","走进长安十二时辰主题街区，仿唐里坊格局的街巷错落铺开，青瓦木檐之下，宫灯高悬，酒肆林立…","“我们不做‘书本里的唐诗’，要做‘生活里的唐诗’，让唐诗从古籍里走出来…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T16:20:01+08:00","size":1,"keywords":[],"body":"一座长安城，半部《全唐诗》。在西安，古典诗词不再只是典籍里的文字，而是散落在城垣街巷、碑石古塔、山水舞台之间，触手可及的城市风景。\n\n　　走进长安十二时辰主题街区，仿唐里坊格局的街巷错落铺开，青瓦木檐之下，宫灯高悬，酒肆林立，唐风巡游、飞花令等互动活动次第上演。\n\n　　“我们不做‘书本里的唐诗’，要做‘生活里的唐诗’，让唐诗从古籍里走出来，变回盛唐街头的烟火人间。”长安十二时辰主题街区文化大使李媛媛说，诗中写到的宴饮、游赏、相逢，在这里都化作一幕幕实景小剧场，让游客置身其间，沉浸式感受唐诗里的市井气象。\n\n　　金石无言，翰墨留声。移步西安碑林博物馆，馆藏碑石、墓志四千余方，汇集颜真卿、柳公权等名家笔墨。《开成石经》规整厚重，被称作唐代的“标准教科书”。\r\n\n　　不少唐代诗作，以碑侧题记、墓志铭辞、诗碑的形式留存至今。西安碑林博物馆特级讲解员白雪松介绍，坚硬的碑石，为诗词提供了跨越千年的载体，也让后人得以读懂文字背后古人的情志与故事。\n\n　　出城向东，灞水悠悠，自古便是诗意的送别之地。李白写下“送君灞陵亭，灞水流浩浩”的千古名句，千年之后，灞河东岸的长安云・“一带一路”城市展示体验中心里，“灞柳风雪”的意境借光影重现。\n\n　　“在这里，观众身处诗中场景，读懂诗词背后的风物与心绪。”长安云·灞河东岸唐诗文化街区首席推荐官仇蕾说，科技让古老诗句有了新的表达方式。\n\n　　山水为幕，长诗为魂。在西安临潼华清宫，依托白居易《长恨歌》打造的实景舞剧，循着诗篇脉络铺展剧情，用光影乐舞完成一场诗与史的跨时空对话。\n\n　　“中国诗词的文脉结合优秀的艺术创作，实际上就是让躺着的历史鲜活地站立起来。”舞剧《长恨歌》艺术总监薛雷凯说，舞台演绎，正吸引更多观众读懂诗词承载的历史底蕴。\n\n　　文脉的源头，还藏在《诗经》秦风的吟唱之中。大型历史舞台剧《赳赳大秦》撷取《诗经・秦风》里《无衣》《蒹葭》的诗意，结合黑夫家书的故事，以普通人的牵挂与信义，诠释秦风刚柔并济的底色。\n\n　　从《诗经》秦风的质朴吟唱，到盛唐唐诗的群星璀璨，诗词文脉在古都西安呈现出多样的当代表达。博物馆、沉浸式街区、数字场馆、实景舞台，不同载体各有表达，共同推动古典诗词走出书页、融入日常。\n\n　　2025年9月，西安出台打造“唐诗之都”实施方案，秉持“微更新、轻改造、深融合”理念，推动唐诗系统性嵌入城市空间，让千年文脉可感可及。\n\n　　11月16日至19日，“何以中国·诗词里的千年文脉”网络主题宣传活动走进西安，媒体记者、网络名人循着诗句寻访古城，记录下中华文脉活化传承的鲜活实践。(史梦) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c98d3696d06","title":"“粤”上新台阶丨何以“香云纱”？","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735291.shtml","summary":"在今年APEC领导人非正式会议上，包含香云纱元素的国礼惊艳亮相，这份别出心裁的礼物，是如何做到传统又创新？","summary_short":"在今年APEC领导人非正式会议上，包含香云纱元素的国礼惊艳亮相，这份别出心裁的礼物，是如何做到传统又创新？","digest":"在今年APEC领导人非正式会议上，包含香云纱元素的国礼惊艳亮相，这份别出心裁的礼物…","points":["在今年APEC领导人非正式会议上，包含香云纱元素的国礼惊艳亮相，这份别出心裁的礼物…","香云纱染整技艺国家级代表性传承人黄田胜告诉记者，以前的香云纱又叫响云纱，因为当时的材质偏硬…","现在的香云纱通过砂洗，变软，和以前穿着的完全不一样"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T16:16:03+08:00","size":1,"keywords":[],"body":"在今年APEC领导人非正式会议上，包含香云纱元素的国礼惊艳亮相，这份别出心裁的礼物，是如何做到传统又创新？\n\n　　香云纱染整技艺国家级代表性传承人黄田胜告诉记者，以前的香云纱又叫响云纱，因为当时的材质偏硬，走起路来“沙沙”作响，因此得名响云纱。现在的香云纱通过砂洗，变软，和以前穿着的完全不一样。穿进去更加柔软、冰凉。\n\n　　以桑蚕丝为底坯，用香云纱染整工艺做出来的面料，才是真正的香云纱。除了桑蚕丝，制作香云纱还有另外两件重要法宝：薯莨和河泥。薯莨汁把布染成棕红，泥里的铁离子再把它压成乌黑，成就了香云纱一面乌黑油亮、一面赭褐温润的独特质感。三十余道工序，缺一不可，全看老师傅的一双巧手。\n\n　　黄田胜告诉我们，香云纱之所以被称为“软黄金”，是因为这种布料工序极其繁杂，与此同时，制作一匹香云纱，不仅要看手艺，还要看天气。\r\n\n　　香云纱染整技艺顺德区级非遗代表性传承人何超告诉记者，制作香云纱要顺天时而作，根据每天的天气、温度、湿度、阳光以及布的状态，来做相应的调整。“做一匹香云纱，现在最顶尖的手艺人也要半年时间，我们是跟时间赛跑，抢时间，抢阳光。”何超说道。\n\n　　香云纱宋锦围巾设计制作方负责人吴建华说，希望通过APEC，让全世界看到中国非遗的魅力，未来才能真正地让中国的非遗能够走向世界。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cbea9ea233e","title":"2025年度北京市科学技术奖揭晓 基础研究成果持续涌现","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735277.shtml","summary":"中新网北京11月20日电 (记者 陈杭)记者20日从北京市科委、中关村管委会获悉，2025年度北京市科学技术奖正式公布。","summary_short":"中新网北京11月20日电 (记者 陈杭)记者20日从北京市科委、中关村管委会获悉，2025年度北京市科学技术奖正式公布。","digest":"记者20日从北京市科委、中关村管委会获悉，2025年度北京市科学技术奖正式公布","points":["中新网北京11月20日电 (记者 陈杭)记者20日从北京市科委、中关村管委会获悉…","王中林、王拥军荣获突出贡献中关村奖","59项成果荣获自然科学奖，包括一等奖15项，二等奖44项"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T16:07:43+08:00","size":1,"keywords":[],"body":"中新网北京11月20日电 (记者 陈杭)记者20日从北京市科委、中关村管委会获悉，2025年度北京市科学技术奖正式公布。王中林、王拥军荣获突出贡献中关村奖。59项成果荣获自然科学奖，包括一等奖15项，二等奖44项；26项成果荣获技术发明奖，包括一等奖6项，二等奖20项；109项成果荣获科学技术进步奖，包括一等奖29项，二等奖80项。\r\n\n　　标杆人才示范效应彰显\n\n　　据悉，获奖者聚力基础研究与关键核心技术攻坚，发挥头雁带动作用，勇攀前沿科学高峰，勇闯科研探索无人区，创新提出新理论、拓展新领域，充分释放战略人才牵引效能，为推进北京(京津冀)国际科技创新中心建设积蓄内生动能。\n\n　　突出贡献中关村奖旨在奖励为北京市重点发展领域作出重大贡献的科技工作者。获奖者北京纳米能源与系统研究所研究员王中林致力于材料科学和纳米科学研究，开创了基于纳米发电机的自驱动系统领域，为高熵能源体系的发展提供了全新的方向；发明了摩擦纳米发电机，为多种设备提供了可持续的能源与传感解决方案；奠定了压电电子学与压电光电子学效应的第三代半导体研究领域，为信息技术的变革提供了重大机遇。这一系列工作将纳米能源和纳米传感推动成为国际公认的一个新型学科，助力我国成为微纳能源研究的学术高地。\n\n　　获奖者首都医科大学附属北京天坛医院主任医师王拥军致力于脑血管病的应用基础、临床医学及转化研究，创立了缺血性脑血管病治疗新方案，改写了全球脑血管病指南；建立了扩时间窗静脉溶栓新方法，临床开发了4个新型溶栓药物，开辟了晚时间窗与多药选择的再灌注治疗新时代；创建了逆向药物转化新范式，发现了多个新药研发关键靶点并成功推动了产业化。这一系列工作推动了我国及全球脑血管病防治事业发展，使我国脑血管病临床研究跻身国际一流水平。\n\n　　基础研究成果持续涌现\n\n　　2025年度获奖项目中，基础研究类成果占比达30.4%，这些成果既涵盖了空天探索、生命起源等前沿科学问题的重大发现，又涵盖了半导体材料、生成式人工智能等科学与产业融合方面的理论突破，为持续提升北京原始创新策源能力，抢占全球科技竞争制高点奠定基础。\n\n　　“功能基元有序组装与能源分子催化转化”项目荣获自然科学奖一等奖。北京理工大学着眼于我国能源体系清洁低碳与高效安全转型，开发了功能基元有序组装新技术，构建分子设计到跨尺度集成的能源催化新体系，推动了高性能能源催化材料的发展。\n\n　　关键核心技术取得突破\n\n　　2025年度技术发明奖获奖项目占比13.4%，连续四年实现增长，在创新药物、智能传感等领域多点开花，涌现出脑胶质瘤创新药、硅基谐振式压力传感器等一批重大突破性成果，为加快新质生产力布局，以科技创新赋能未来产业发展提供支撑。\n\n　　“基础大模型关键技术及规模化应用”荣获科学技术进步奖一等奖。清华大学等单位突破国产大模型从基础理论、核心架构到应用落地的全链条技术瓶颈，构建了全栈自主GLM大模型技术体系，研发的MaaS平台已服务全球460余万开发者和企业用户，赋能全球人工智能行业生态发展。\n\n　　企业创新活力迸发\n\n　　2025年度194项获奖项目中，企业作为前三单位牵头或参与完成的项目有105项，连续七年超半数。在京科技企业以技术突破和产业发展为导向，深度整合各类创新要素，集聚优势创新资源，不断深化科技创新和产业创新融合，加快形成以人工智能、医药健康为代表的特色优势产业集群，为首都高质量发展注入强劲动能。\n\n　　此外，2025年度194项获奖项目中，承担过国家重大专项、国家重点研发计划等国家重要任务的项目有179项，占比92.3%。在航天工程、卫星导航、氢能和核聚变能等领域积极承接国家重大科技任务，取得突破性成果，有力提升了我国自主创新水平和国际影响力，支撑创新型国家和科技强国建设。(完) 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ced657c05f3","title":"黑龙江：智能农机、无人农场、黑土地数字化监测全面铺开","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735273.shtml","summary":"中新网哈尔滨11月20日电 (记者 田德雨)“2026年作为‘十五五’开局起步关键之年，黑龙江省牢牢把握国家赋予的‘三基地、一屏障、一高地’重大使命任务，锚定数字经济高质量发展主线…","summary_short":"中新网哈尔滨11月20日电 (记者 田德雨)“2026年作为‘十五五’开局起步关键之年…","digest":"“2026年作为‘十五五’开局起步关键之年，黑龙江省牢牢把握国家赋予的‘三基地…","points":["中新网哈尔滨11月20日电 (记者 田德雨)“2026年作为‘十五五’开局起步关键之年…","”20日，黑龙江省发展和改革委员会党组成员，省数据局党组书记、局长高炽扬介绍…","当日，由中共黑龙江省委宣传部、黑龙江省人民政府新闻办公室主办的“开局起步‘十五五’——奋力谱…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T16:05:38+08:00","size":1,"keywords":[],"body":"中新网哈尔滨11月20日电 (记者 田德雨)“2026年作为‘十五五’开局起步关键之年，黑龙江省牢牢把握国家赋予的‘三基地、一屏障、一高地’重大使命任务，锚定数字经济高质量发展主线，推动数据要素赋能人工智能创新发展，加快培育壮大新质生产力。”20日，黑龙江省发展和改革委员会党组成员，省数据局党组书记、局长高炽扬介绍，该省农业数字化转型实现领跑，智能农机、无人农场、黑土地数字化监测全面铺开。\n\n新闻发布会现场。　李鹏举 摄\n\n　　当日，由中共黑龙江省委宣传部、黑龙江省人民政府新闻办公室主办的“开局起步‘十五五’——奋力谱写中国式现代化黑龙江新篇章”系列主题新闻发布会第九场举行。高炽扬围绕“黑龙江省以数字经济赋能高质量振兴发展”作主旨介绍。\n\n　　2026年前三季度，黑龙江省数字经济核心产业营业收入同比增长22.7%，高于去年同期7.1个百分点，保持较快增长势头。\n\n　　高炽扬介绍，黑龙江省在算力基础设施提速布局上，统筹智能算力与绿色电力协同布局。通过发挥全球运营商最大单体集群中国移动万卡智算中心引领效应，丰富算力供给体系，加速相关项目建设，让算力规模持续攀升。黑龙江省在深化“人工智能+”行动，提档升级实体经济数智化转型过程中，出台政策措施，强化基础支撑能力、优化产业发展环境，推出“模型券”“数据券”等政策工具，激发市场活力。在数字产业化特色领域，黑龙江省加速释放数据要素潜能。稳步推进数据产业集聚区建设、建立省级示范场景储备库，探索数据领域国际合作，7个项目获评中国-上合组织国家数字经济合作典型案例。黑龙江省加快实数深度融合进程。农业、制造业、服务业的产业数字化纵深推进。\n\n　　高炽扬表示，“十五五”时期，黑龙江省将加快发展数字经济，创新配置生产要素，做强智慧农业、做大数智制造业、做优数字服务业、培育智能新经济，促进实体经济和数字经济深度融合。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6ede092b7c","title":"【深圳APEC】我是深圳人！ “五星上将麦克阿瑟”扮演者：在深圳让我感觉自己更年轻","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-20/news1075570.shtml","summary":"近日，大家所熟悉的“五星上将麦克阿瑟”扮演者受访聊起深圳的变化。","summary_short":"近日，大家所熟悉的“五星上将麦克阿瑟”扮演者受访聊起深圳的变化。","digest":"近日，大家所熟悉的“五星上将麦克阿瑟”扮演者受访聊起深圳的变化","points":["近日，大家所熟悉的“五星上将麦克阿瑟”扮演者受访聊起深圳的变化","在电影《长津湖》里扮演“麦克阿瑟”的演员詹姆斯·菲尔伯德‌(James Filbird)…","现实中，他已在深圳常居20年"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T15:42:33+08:00","size":1,"keywords":[],"body":"近日，大家所熟悉的“五星上将麦克阿瑟”扮演者受访聊起深圳的变化。在电影《长津湖》里扮演“麦克阿瑟”的演员詹姆斯·菲尔伯德‌(James Filbird)，曾因角色相关“热梗”一度成为解说类视频后半段的常驻嘉宾。现实中，他已在深圳常居20年。\n\n随着世界目光聚焦APEC，深圳又成了刷屏海外社交媒体的“大网红”，詹姆斯·菲尔伯德‌(James Filbird)坦言，他是美国人，但总自称是“深圳人”。谈及深圳的发展，他表示：“我已经快68岁了，但是我时常感觉自己还像40多岁的样子，深圳是一座年轻的城市，我被年轻的能量‘包围’着。”(视频来源 荔视频)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/9977BEF609BE46A5A4255B558633C8AA.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c89917c735c","title":"中转场更智能、乡村邮路更通畅 邮政寄递量稳步增长","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735262.shtml","summary":"今年以来，我国邮政行业寄递量稳步增长，国家邮政局数据显示，前10个月，邮政行业寄递业务量累计完成1830.3亿件，同比增长3.3%。","summary_short":"今年以来，我国邮政行业寄递量稳步增长，国家邮政局数据显示，前10个月，邮政行业寄递业务量累计完成1830.3亿件…","digest":"今年以来，我国邮政行业寄递量稳步增长，国家邮政局数据显示，前10个月…","points":["今年以来，我国邮政行业寄递量稳步增长，国家邮政局数据显示，前10个月…","AI视觉与数字孪生助力中转场高效流转","寄递量稳步增长的同时，中转场里的包裹流转也在变得更智能"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T15:35:03+08:00","size":1,"keywords":[],"body":"今年以来，我国邮政行业寄递量稳步增长，国家邮政局数据显示，前10个月，邮政行业寄递业务量累计完成1830.3亿件，同比增长3.3%。\n\n　　AI视觉与数字孪生助力中转场高效流转\n\n　　寄递量稳步增长的同时，中转场里的包裹流转也在变得更智能。今年以来，邮政行业依托AI视觉、数字孪生等技术，提升快递包裹安全高效运输水平。\n\n　　在上海青浦一处物流转运中心，满载包裹的快递车繁忙而有序地驶入园区。进港卸货区，包裹在自动传送机上以每秒两米的速度通过扫描门。\r\n\n　　某快递企业上海转运中心自动化区班长 聂龙军：我们现在新加了DWS(尺寸测量、称重与扫码)扫描设备，快件从卸货到分拣、集包，再到末端装车，从以前4个小时左右压缩到1个小时以内。\n\n　　通过AI视觉算法，无论是面单褶皱还是反光，设备都能智能识别，还能自动警示并精准定位破损件，极大缓解了因破损导致“末端赔付”这一行业痛点，通过减少客诉和人工成本实现降本增效。\n\n　　某快递企业运营服务成本服务负责人 叶霖：到了电商大促的时候，当单量高了以后，现场的人是挑不过来的，有一些破损件就直接漏过去了，会引发一些客户的投诉。我们通过AI视觉，后台通过大数据模型智能识别出来哪些件是破损的，单独分拣到一个地方去，有专门的人来处理。一方面提升了我们现场的操作效率，同时整个客户的体验也有保障。\n\n　　车辆入库环节，AI同样在辅助人工进行实时监测。过去车辆进场靠人工登记、人工指路，高峰期极易堵在门口；现在AI摄像头自动识别车牌和月台状态，系统实时分配道口，车辆进场、停靠、卸货一气呵成。而要让几十上百个道口、几千米长的传送带像钟表一样精准咬合，靠的是背后的“数字孪生”技术——在虚拟世界里再造一个一模一样的转运中心。\n\n　　某快递企业产品技术成本产品负责人 李涓涓：把我们的信息流实时的信息、物理空间位置，还有视觉、图像、视频的能力三流对齐之后，会让现场更高效。\n\n　　如今，从依靠人工巡检到AI自动识别，从末端被动赔付到全链路主动溯源，核心枢纽中转环节流转效率提升超10%。\n\n　　山乡快递员：打通邮路 见证双向助农\n\n　　技术赋能让中转场里的包裹流转更高效，但在偏远的村落，仍需要快递员日复一日把包裹送进山里。在湖北长阳，快递员在蜿蜒山路穿梭，从一个人、一个方便袋，到覆盖五个村、日均处理快件超1400件，乡村快递员见证着山乡变化。\n\n　　在湖北长阳土家族自治县榔坪镇秀峰桥村综合便民服务站，记者见到了快递员张骞，他正和同事们忙着卸货、分拣快递包裹。这段时间，站点日均处理快件超1400件，忙碌持续到晚上。货架上除了村民日常网购包裹，更多的是大棚建材、农药种子等生产物资，以及家具家电等村里以前买不到的物品。\n\n　　这两天，沙地村村民郭先秀远在珠海的儿子为新房购置的沙发、茶几到货了，因为物件大、路途远，张骞开着货车把大件送到老人家。\n\n　　宜昌市长阳土家族自治县榔坪镇沙地村村民 郭先秀：还是比较方便，都不需要自己去搬的。\n\n　　送件路上，张骞告诉记者，过去快递点大多只到乡镇一级，乡亲们收发包裹往往要往返二三十公里山路，取件还要支付一两元代取费。2013年，他从深圳返乡开起超市，正赶上国家推行快递下乡政策，于是试水兼职了长阳第一批村级快递代收点。\n\n　　宜昌市长阳土家族自治县快递员 张骞：刚开始量很少，每次就一个方便袋拎回来，用客车带。做了差不多半年，快递量多了，巴士带不了，我就买了一辆货车。后来快递量越来越大。\n\n　　这些年，除了自家的快递点，张骞又发展了三个村点，快递业务从一个村覆盖到五个村13000多人。除了送快递，他的快递点还承担着“农产品出山”的重任，长阳很多村庄的高山蔬菜、腊肉等山货，都通过他快递到全国各地。\n\n　　宜昌市长阳土家族自治县榔坪镇八角村村民 秦鹏：有了这个快递点方便许多，原来我们都要在榔坪镇才能寄。\n\n　　山路一趟趟跑，包裹一件件送。畅通的物流通道，正为乡村发展持续注入活力。\n\n　　宜昌市长阳土家族自治县快递员 张骞：肯定是辛苦的，选择这个行业，我要对这份工作负责，老百姓有需要的时候，我都会义无反顾去做。 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6c90a950a5","title":"“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动将于今日启动","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735243.shtml","summary":"中新网海口11月20日电 记者从海南省委网信办获悉，“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动，将于今日启动。","summary_short":"中新网海口11月20日电 记者从海南省委网信办获悉，“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动…","digest":"记者从海南省委网信办获悉，“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动…","points":["来自中央、地方新闻单位的媒体记者以及知名网络大V，将走进海南自贸港…","2026年是中国共产党成立105周年、中共琼崖一大召开100周年…","站在新的历史起点上，海南既承载着传承琼崖革命“二十三年红旗不倒”精神的历史使命…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T15:04:37+08:00","size":1,"keywords":[],"body":"中新网海口11月20日电 记者从海南省委网信办获悉，“红星照耀中国·从琼崖烽火到开放自贸港”网络主题宣传活动，将于今日启动。来自中央、地方新闻单位的媒体记者以及知名网络大V，将走进海南自贸港，在深入挖掘海南红色文化资源的同时，以多元新闻产品展现自贸港建设的新气象。\r\n\n　　2026年是中国共产党成立105周年、中共琼崖一大召开100周年，同时也是“十五五”开局之年和海南自由贸易港全岛封关运作首个完整年度。站在新的历史起点上，海南既承载着传承琼崖革命“二十三年红旗不倒”精神的历史使命，也肩负着打造新时代中国特色社会主义生动范例、建设具有世界影响力的中国特色自由贸易港的重大责任。\n\n　　活动线路将覆盖海口、澄迈、临高、定安、琼海、五指山、陵水、三亚等多个市县。红色点位串联琼崖革命起源、武装斗争、民族团结、革命胜利全历程，完整还原“二十三年红旗不倒”到解放海南岛的峥嵘史诗；自贸港点位聚焦产业出海、现代化产业体系建设、医疗教育开放、南繁等核心业态，全景展示自贸港建设成果。全程实现“历史与现实交替、红色与开放呼应”，以实地探访、实景纪实的形式，让红色故事可感、发展成果可见，形成完整的主题叙事闭环。\n\n　　活动期间将搭建“中央权威传播+地方全域覆盖+社交流量破圈”的立体化传播矩阵，依托央媒、省媒、市县主流媒体，以及抖音、微博、微信、视频号等社交平台，推出图文、短视频、图解等融媒体产品，立体展现琼崖革命的峥嵘岁月与自贸港建设的丰硕成果，激发全社会团结奋进的精气神，为实现“十五五”良好开局、推动海南自贸港建设行稳致远营造浓厚舆论氛围。\n\n　　本次活动由中央网信办网络传播局指导，海南省委宣传部、海南省委网信办、海南省委省直机关工委、海南省委党史研究室(海南省地方志办公室)、共青团海南省委主办，海口市委网信委、三亚市委网信委、琼海市委网信委、五指山市委网信委、澄迈县委网信委、临高县委网信委、定安县委网信委、陵水县委网信委协办。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf8c12c79b4","title":"成都一座猫岛的双向奔赴 救助者也值得被守护","url":"https://www.chinanews.com/sh/shipin/2026/11-20/news1075565.shtml","summary":"在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”。","summary_short":"在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”。","digest":"在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”","points":["在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”","2025年11月，“花花宠物救助”团队开始筹建猫岛","如今，猫岛共安置47只流浪猫，2500余名注册义工接力守护"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T14:51:34+08:00","size":1,"keywords":[],"body":"在四川成都天府新区，一座约1500平方米的闲置小岛，变成了流浪猫的“桃花源”。2025年11月，“花花宠物救助”团队开始筹建猫岛。如今，猫岛共安置47只流浪猫，2500余名注册义工接力守护。\n\n这里被守护的不只有流浪猫，还有流浪动物救助者。团队通过义工积分、物资支持等方式，尝试减轻救助者的负担，让每一份善意得到回应。(杨予頔)","image":"","video":"https://v-oss.cnsimg.net/glob/2026/11/20/a8399910-59c3-484e-8847-3c87cbf8fc04.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c6e654953f7","title":"中医药文化体验成西安入境游新热点","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735223.shtml","summary":"中新社西安11月20日电 (记者 李一璠 党田野)苍术、佩兰的清苦伴着桂花的甜香漫过展台，来自叙利亚的马赞小心翼翼地将草本药粉填入绣着缠枝纹的锦袋，指尖捏紧绳结收口。","summary_short":"中新社西安11月20日电 (记者 李一璠 党田野)苍术、佩兰的清苦伴着桂花的甜香漫过展台…","digest":"苍术、佩兰的清苦伴着桂花的甜香漫过展台…","points":["中新社西安11月20日电 (记者 李一璠 党田野)苍术、佩兰的清苦伴着桂花的甜香漫过展台…","他举着刚完工的香囊和身旁同伴交流，“这是我第一次亲手做中药香囊，听说它能舒缓心情、提神醒脑…","马赞近日在西安参加一场中阿文明数字互动交流活动，活动现场的中医药文化体验区成了最热闹的打卡点"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:44:08+08:00","size":1,"keywords":[],"body":"中新社西安11月20日电 (记者 李一璠 党田野)苍术、佩兰的清苦伴着桂花的甜香漫过展台，来自叙利亚的马赞小心翼翼地将草本药粉填入绣着缠枝纹的锦袋，指尖捏紧绳结收口。他举着刚完工的香囊和身旁同伴交流，“这是我第一次亲手做中药香囊，听说它能舒缓心情、提神醒脑，回去要送给家人”。\n\n　　马赞近日在西安参加一场中阿文明数字互动交流活动，活动现场的中医药文化体验区成了最热闹的打卡点。来自叙利亚、约旦、埃及等国的友人在中药材辨识区俯身轻嗅，听工作人员讲解每一味药材的性状与功效，对中医药“取材自然”的理念表现出浓厚兴趣；在香囊制作区，他们研磨药材、缝制锦袋，把东方草木的香气制成可带走的纪念品。\n\n　　类似场景正在西安不断出现。随着中外文旅往来持续升温，体验地道中医药康养文化，已从小众文化交流项目，成为越来越多外籍游客到访古都的特色选择。中医理疗、药膳餐饮、中药茶饮等多元业态成为西安入境消费的新热点。\n\n2026年11月，外籍游客在西安体验制作中药香囊。(西安中医脑病医院供图)\n\n　　来自美国、突尼斯等国的游客近期走进西安中医脑病医院，成为该院中医药文化体验项目迎来的首批海外游客。治未病科里，艾条轻烟袅袅，医护人员将指尖搭在游客腕间诊脉，根据体质给出艾灸、推拿、耳穴压豆等体验方案。体验者询问疗法原理与适用范围，感叹传统中医“简、便、验、廉”的独到之处。体验间隙，温热的中药茶饮端上桌，“药食同源”的养生理念随茶香传递。\n\n　　陕西是中医药文化重要发祥地之一，素有“秦地无闲草，自古多良医”的美誉。2026年，陕西入选国家中医药服务消费和服务贸易融合发展试点地区名单，当地逐步打通“文化体验—服务消费—国际传播”的链路，打造多条中医药特色旅游线路。\n\n　　“我们致力于整合特色医疗资源，以多元体验为载体，打通中医药文化传播与服务消费转化的双向链路，助力更多海外游客从体验中医到认可中医，让古都入境游名片多一抹草本底色。”西安中医脑病医院国际部主任王辉说。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c56ed60cb40","title":"江苏首例侵入式脑机接口手术患者实现“脑控”轮椅出行","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735221.shtml","summary":"中新网南通11月20日电(谷华 吴丹丹)11月19日，在南通大学附属医院脑机接口与神经调控研究型病区，26岁的女孩笑笑(化名)通过意念操控特制的轮椅，从病房内转弯行至病区走廊。","summary_short":"中新网南通11月20日电(谷华 吴丹丹)11月19日，在南通大学附属医院脑机接口与神经调控研究型病区…","digest":"11月19日，在南通大学附属医院脑机接口与神经调控研究型病区…","points":["中新网南通11月20日电(谷华 吴丹丹)11月19日…","一年前，一场意外车祸造成笑笑颈段脊髓重度损伤，生活被迫按下暂停键","2026年5月，笑笑家人看到南通大学附属医院发布的“无线植入式脑机接口系统”临床研究患者招募…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:41:34+08:00","size":1,"keywords":[],"body":"中新网南通11月20日电(谷华 吴丹丹)11月19日，在南通大学附属医院脑机接口与神经调控研究型病区，26岁的女孩笑笑(化名)通过意念操控特制的轮椅，从病房内转弯行至病区走廊。\n\n　　一年前，一场意外车祸造成笑笑颈段脊髓重度损伤，生活被迫按下暂停键。2026年5月，笑笑家人看到南通大学附属医院发布的“无线植入式脑机接口系统”临床研究患者招募公告后，第一时间为她报名入组。6月5日，笑笑顺利完成侵入式脑机接口柔性电极系统植入手术。这也是江苏首例、全国第三例侵入式脑机接口手术。\n\n江苏首例侵入式脑机接口手术患者实现“脑控”轮椅出行。南通大学附属医院 供图\n\n　　手术后，笑笑开始了系统训练，从基础的小球追踪、点格训练，到光标自由控制完成脑控任务。她的脑控应用场景正快速拓展，不仅重返数字生活的娱乐与社交，更朝着生活自理迈出了坚实一步。\n\n　　11月19日，笑笑在取得出色康复成效的基础上，坐上了特制的轮椅，在没有任何其他外力的作用下，凭借意念实现了轮椅前进、后退、停止、转弯，整个过程非常流畅。\n\n　　“我们终于实现了用科技让你走出病房的诺言。接下来，还将通过脑控手套、外骨骼等辅助器具解码其他功能。”南通大学附属医院党委书记、神经疾病中心主任施炜向笑笑竖起大拇指。(完)\n\n 【编辑:张令旗】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3aa518e83d","title":"甘肃康县：林间麻出山 席上鲜入座","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735219.shtml","summary":"中新网兰州11月20日电 (高文)19日，甘肃省陇南市康县阳坝镇中心广场，天麻宴品鉴台前围满客商，新鲜天麻切片码在白瓷盘中，天麻炖鸡汤香气四溢。","summary_short":"中新网兰州11月20日电 (高文)19日，甘肃省陇南市康县阳坝镇中心广场，天麻宴品鉴台前围满客商…","digest":"19日，甘肃省陇南市康县阳坝镇中心广场，天麻宴品鉴台前围满客商…","points":["中新网兰州11月20日电 (高文)19日，甘肃省陇南市康县阳坝镇中心广场…","2026年陇南天麻采收暨东西部协作产品展示展销交易会在此举行","就在交易会前，康县天麻药膳刚在第三届广西药膳大赛邀请赛上折桂"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:38:46+08:00","size":1,"keywords":[],"body":"中新网兰州11月20日电 (高文)19日，甘肃省陇南市康县阳坝镇中心广场，天麻宴品鉴台前围满客商，新鲜天麻切片码在白瓷盘中，天麻炖鸡汤香气四溢。2026年陇南天麻采收暨东西部协作产品展示展销交易会在此举行。就在交易会前，康县天麻药膳刚在第三届广西药膳大赛邀请赛上折桂。从林间到席上，康县天麻走出了一条清晰的产业延伸路。\n\n　　麻香南北\n\n　　天麻在中国南北餐桌上的角色大不相同。在云南昭通等南方产区，当地有“天麻当洋芋吃”的说法，鲜天麻炖鸡、煮火锅、蒸蛋、油炸，家家常备天麻酒，天麻入膳早已是日常。2023年天麻纳入药食同源目录后，天麻粉、天麻曲奇、凉菜、炒菜、炸食乃至全品类宴席菜式进一步为天麻打开了加工类药膳的空间。\n\n　　但在北方，天麻长期是“药房里抓出来的药材”。北方不产鲜麻，消费者接触天麻的传统路径是到药房买饮片，用于特定调理，而非日常做菜。\n\n11月19日，2026年陇南天麻采收暨东西部协作产品展示展销交易会现场，天麻、蜂蜜、核桃制作的糕点。杨晓培 摄\n\n　　中国烹饪协会小吃专委会副主任委员卢有才观察到，原本集中在南方的日常煲汤、烹饪习惯，如今向北方渗透。这一迹象，正是康县天麻产业延伸的突破口。\n\n　　林下生金\n\n　　康县把天麻从林间送上席间的底气，来自一组数据：全县6200余户种植户种植林下天麻1.5万亩、桶装天麻280余万桶，全产业链总产值突破20亿元。天麻素含量1.11%，远高于《中国药典》标准。甘肃首家天麻趁鲜切制加工主体落地康县，即食天麻、天麻挂面、天麻酒、天麻片等十余种药食同源产品已经成型。交易会期间，北京同仁堂(安国)等三家企业与康县企业签署天麻GAP共建协议，标准化基地建设再进一步。\n\n　　展示展销区内，新鲜天麻切片在盘中泛着淡黄光泽。种植户刘明亮今年种了20多亩林下天麻，亩产6000斤左右，预估收入约一百万元。他笑着说：“这次活动让康县天麻被更多人熟知，希望把山里的好货卖出去。”\n\n　　中国农业科学院研究员戴小枫在主题演讲中给出方向：天麻产业要从“种得好”迈向“卖得好”，不能只停留在原料销售，要向精深加工迈进，同时用好东西部协作平台，“让康县优质天麻走进东部商超、餐桌、康养市场”。戴小枫说道。\n\n康县鲜意浓农业开发有限公司生产的天麻手工挂面。(资料图)李蓉 摄\n\n　　精深加工的空间有多大？吉林农业大学教授、博士生导师包海鹰带来一个更远的设想：天麻地上茎和生产剩余的种子目前大多被废弃，前期研究证实其具备镇静、抗疲劳、抗抑郁活性，国内尚无产业化案例。若能在康县落地，这将是林下资源的又一条增值路。\n\n　　席上添香\n\n　　但让天麻药膳真正走上普通人的席间，还有一段路要走。卢有才说，其实多数普通消费者还没见过新鲜天麻长什么样，天麻药膳消费仍局限于高端宴席和主产区本地餐馆。他建议，要扩大产能、做好品牌宣传，打通批发市场、农贸市场等普通消费渠道，开展消费者教育，“破除认知门槛，推动天麻走进普通家庭餐桌”。\n\n　　康县已经在往这个方向走。趁鲜切制、即食天麻、天麻挂面、天麻酒，都是把天麻从“论斤卖”变成“论产品卖”的尝试——产品形态变了，离席上的距离就近了一步。\n\n图为康县探索的林下“桶装天麻”种植。(资料图)李蓉 摄\n\n　　从林间到车间，康县已经走出了第一步；从车间到席上，产品、渠道、认知仍需一步步铺开。康县委书记黄顺在交易会上表示，康县将持续推动扩量提质延链，把道地天麻的生态优势转化为发展胜势。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c05da0abd6b","title":"以会为媒 四川将端出冰雪旅游季“大餐”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735205.shtml","summary":"中新网成都11月20日电 (祝欢)“四川将集中发布四川文旅冬季新资源、新产品、新线路，推介25条精品旅游线路，覆盖冰雪观光、温泉康养、非遗体验、跨年迎新等多种场景。","summary_short":"中新网成都11月20日电 (祝欢)“四川将集中发布四川文旅冬季新资源、新产品、新线路，推介25条精品旅游线路…","digest":"“四川将集中发布四川文旅冬季新资源、新产品、新线路，推介25条精品旅游线路…","points":["中新网成都11月20日电 (祝欢)“四川将集中发布四川文旅冬季新资源、新产品、新线路…","”20日，四川省文化和旅游厅二级巡视员宋俊武表示，景区门票减免、文旅消费券也将同步跟进…","发布会上介绍，第十二届四川国际旅游交易博览会(以下简称旅博会)…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:35:58+08:00","size":1,"keywords":[],"body":"中新网成都11月20日电 (祝欢)“四川将集中发布四川文旅冬季新资源、新产品、新线路，推介25条精品旅游线路，覆盖冰雪观光、温泉康养、非遗体验、跨年迎新等多种场景。”20日，四川省文化和旅游厅二级巡视员宋俊武表示，景区门票减免、文旅消费券也将同步跟进，让冬游四川既有看点，也享实惠。\n\n新闻发布会现场。四川发布供图\n\n　　当日，四川省政府新闻办举行新闻发布会。发布会上介绍，第十二届四川国际旅游交易博览会(以下简称旅博会)、2026四川冰雪和温泉旅游节、2026四川省冬季旅游季将于12月3日在四川乐山同期启幕。\n\n　　据了解，四川是全球低纬度冰雪资源最富集、中国南方最适宜开展冰雪运动和冰雪旅游的地区。宋俊武介绍，今年冬季旅游季，四川还将结合“四川有请！”百千万全球邀约计划，针对东南亚、港澳台等境外游客消费偏好量身定制一批“冰雪游”、针对俄罗斯等境外游客推出攀西“阳光游”等主题路线和产品，展现四川多元化冬日魅力。\n\n　　据介绍，四川国际旅游交易博览会自2014年创办以来已成功举办十一届，是西南地区规模最大的文旅行业展会之一。本届旅博会以“汇聚全球宾朋乐享安逸四川”为主题，将首次与冰雪和温泉旅游节、冬季旅游季启动仪式同期举办，形成“专业展会提能级、大众节会促消费”双向赋能格局，整体规模、客商层级、专业能级较往届又有新提升。\n\n　　乐山市委常委、宣传部部长张雄在发布会上介绍，本届旅博会突出惠民利民，市民游客得实惠。本届旅博会十大展区面向公众开放，市民可以一站式体验国际旅游风情、文创IP、体育旅游等新场景。同时，“乐山之夜”推出的“景区+酒店+机票”特惠政策，将同步向市民游客释放红利。\n\n　　不仅如此，此次旅博会还注重赛事共享，配套的双遗马拉松、峨眉山越野挑战赛，让展会期间的城市更有活力。展会期间，乐山围绕“周末下班、直奔乐山”主题，串联峨眉山、乐山大佛、苏稽古镇等点位，推出系列周末微度假、短途游产品，让周边城市游客周五下班坐高铁到乐山，吃顿跷脚牛肉、看场夜景，周六登峨眉山、拜大佛，周日下午返程，轻松又充实。\n\n　　本届旅博会设置入境旅游、定制旅游、银发康养、体育文旅、户外旅游、文创IP、国际协作、地方文旅、文旅企业和巴蜀文旅走廊十大展区，规划2万平方米展区面积，把“文旅+”消费热点搬进展区，设置真人CS、飞盘高尔夫、匹克球等体验。展会期间还将发布研学旅游、低空文旅、自驾旅游等多项行业报告，推出两项旅行服务团体标准，既为行业立标尺，也为游客添选择。\n\n　　在开放合作方面，本届旅博会邀请来自美国、德国、意大利、韩国、俄罗斯、新加坡等国家和中国香港地区的100家境外买家参与，精准链接境外入境采购资源，全面辐射亚欧及美洲重点客源市场。现场设置的国际专属展区，近20个国家和地区的客商将集中展示全球文旅资源与创新产品。展会期间还将举办行业主题分享会，国际旅游组织代表、国内外文旅专家围绕自驾旅游、国际旅行服务等议题开展主旨演讲与圆桌对话，以展会为桥，深化客源互送、产业联动。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8be03f66c3","title":"探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735209.shtml","summary":"中新网成都11月20日电 题：探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”  　　作者 尧欣雨  　　在四川天府新区以南的水库之中，有一座四面环水、须乘船方能登岛的1500平方米孤岛。","summary_short":"中新网成都11月20日电 题：探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”  　　作者 尧欣雨  　　在…","digest":"题：探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”  　　作者 尧欣雨…","points":["在四川天府新区以南的水库之中，有一座四面环水、须乘船方能登岛的1500平方米孤岛","草木掩映间，数十只猫咪悠然踱步……这里便是收容了47只流浪猫的“花花猫岛流浪猫救助基地”(以…","“花花宠物救助”创始人伍文俊的第一只猫“虾饺”外出洗澡时因应激去世，商家提出赔偿…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:31:25+08:00","size":1,"keywords":[],"body":"中新网成都11月20日电 题：探访成都花花猫岛：一座1500平方米孤岛上的流浪猫“桃花源”\n\n　　作者 尧欣雨\n\n　　在四川天府新区以南的水库之中，有一座四面环水、须乘船方能登岛的1500平方米孤岛。泛舟登岛后，此起彼伏的猫叫声扑面而来；草木掩映间，数十只猫咪悠然踱步……这里便是收容了47只流浪猫的“花花猫岛流浪猫救助基地”(以下简称花花猫岛)，一座属于流浪猫的“桃花源”。\n\n航拍花花猫岛。记者 王磊 摄\n\n　　花花猫岛的起点，源于一次失去。“花花宠物救助”创始人伍文俊的第一只猫“虾饺”外出洗澡时因应激去世，商家提出赔偿，他没有将钱收入囊中，而是捐给了一家宠物医院，用于帮助流浪猫。然而真正踏入救助行业后，他看到不少救助人救下上百只流浪动物，最终被经济压力压得生活、家庭难以为继，圈内还存在乱募捐、捐赠款项使用不规范等乱象。曾担任广东省台山市红十字会兼职副会长的他，决定自己搭建一套体系。\n\n　　2025年10月，伍文俊在社交平台上看到成都兴隆湖以南一座水库中央的荒岛。在他看来，水是一道天然结界——既能物理隔绝疾病传播和责任转嫁，也能给猫咪更安定的环境。此前在广东江门的救助基地，曾有附近的狗闯入咬伤两只猫，一只抢救无效死亡，另一只永远失去了尾巴。寻找“世外桃源”的念头，由来已久。\n\n　　而成都浓厚的宠物友好氛围，为花花猫岛落地提供了适宜的土壤。截至2025年，成都宠物保有量突破500万只，养宠家庭超200万户。2026年3月签下合同，4月1日动工，没有专业设计团队和施工队，村民和义工用码头上仅存的一艘小破船，一点一点往岛上运送材料。今年5月，花花猫岛正式投用。\n\n　　花花猫岛投用后，救助并非“来猫就收”，而是环环相扣。“线上收到求助线索，我们一定要线下踩点核实。要分清这是真正需要救助的流浪猫，还是人为弃养，同时评估猫咪的身体状况。”“花花宠物救助”运营负责人彭雅兰介绍，患病猫咪送往合作医院免费救治，康复后先在岛外“花花小院”隔离观察，再转运上岛；登岛后还要再次单独隔离，经医生评估健康稳定，才允许融入大群体。\n\n　　不同于多数救助机构依靠社会捐助维持运转，花花猫岛定下了“不募捐、不收捐赠”的原则。“捐赠带来的帮助是短期的，不是长远之计。”伍文俊说，基地每月运营成本超4万元，他希望靠自身“造血”实现长期救助。目前的做法是“公益打底、商业反哺”：一方面开展亲子上岛深度体验活动，把生命教育搬到现实场景，让孩子近距离理解生命、拒绝遗弃；另一方面，团队正自主研发猫粮，通过商业营收反哺救助事业，力争今年实现收支基本持平。\n\n义工龙先英为猫咪投食。记者 王磊 摄\n\n　　花花猫岛平稳运转的背后，离不开一大批义工的默默付出。猫舍内，义工龙先英正清洗食盆、更换饮用水、清理猫砂。今年十月起，她几乎每周都坐船来岛上做义工，“路程虽然很远，但我心甘情愿，希望给流浪小动物一个家。”据介绍，截至目前，“花花宠物救助”小程序注册义工已超2500人，1000余人上岛参与救助，预约已排至12月底。\n\n　　义工欧阳威在小程序上蹲守半个月才“抢号”成功，特意请假前来。当天，他正和其他义工打扫为猫咪过冬准备的小木屋。“刚上岛，一只叫顺疯的猫直接跳到我身上，闻了闻，就在我身上睡着了，那种感觉特别治愈。”\n\n欧阳威(左)在花花猫岛参与义工服务。记者 王磊 摄\n\n　　义工的热情，也被一套积分机制有序串联起来：义工上岛或在定点社区服务，每小时积一分，可兑换送猫上岛救助的资格、领养猫咪的权限、岛上深度体验及宠物用品优惠券等。“领养后我们会定期回访，当初的救助人也可以和领养家庭保持联系。”彭雅兰说，不希望花花猫岛变为没有门槛的流浪猫收容所，而是成为猫咪从救助到领养之间的“温暖中转站”。\n\n　　“花花宠物救助”的救助版图，也不局限于花花猫岛本身。除开展岛上救助外，团队还以TNR(抓捕—绝育—放归)方式介入社区、高校和商圈的流浪猫群体，定期提供猫粮、猫砂并开展公益宣传。“未来，我们希望以花花猫岛为样板，从一座岛扩展为一片群岛，把这套模式复制到重庆及西南各地，乃至全国，让更多漂泊的猫咪拥有归宿。”伍文俊说。(完)\n\n 【编辑:陈思彦】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c903bfb4803","title":"享惠货值破百亿 海口海关“三同三溯”监管红利持续释放","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735206.shtml","summary":"中新网海口11月20日电(李佳琦)海口海关20日披露，其创新实施的“三同三溯”监管模式持续释放政策红利。","summary_short":"中新网海口11月20日电(李佳琦)海口海关20日披露，其创新实施的“三同三溯”监管模式持续释放政策红利。","digest":"海口海关20日披露，其创新实施的“三同三溯”监管模式持续释放政策红利","points":["中新网海口11月20日电(李佳琦)海口海关20日披露…","截至11月19日，该模式已保障约120万吨食品快速出区，带动约110亿元植物油通关提速","“三同三溯”监管模式于2025年2月13日正式落地实施"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T14:26:49+08:00","size":1,"keywords":[],"body":"中新网海口11月20日电(李佳琦)海口海关20日披露，其创新实施的“三同三溯”监管模式持续释放政策红利。截至11月19日，该模式已保障约120万吨食品快速出区，带动约110亿元植物油通关提速。\n\n　　“三同三溯”监管模式于2025年2月13日正式落地实施。“三同”指同一企业、同一批原料、同一条生产线；“三溯”指打通海关内部、企业、地方监管部门三方追溯链条，建立进出海关特殊监管区域全过程食品安全追溯机制。\n\n　　海口海关介绍，新模式跳出“一票一检”的传统思维，把整批原料、整条产线的产品作为一个监管单元，提前开展风险监测，检测合格后，同一监管单元产品申报出区就能实现即报即放，无需等待检测结果，通关时长压缩70%，更加适配企业规模化、连续性生产出货节奏。\n\n　　在优化出区流程的同时，海关提前做好企业备案、资质审核，做到既“放得活”又“管得好”。\r\n\n　　海口海关表示，下一步将持续优化“三同三溯”监管模式，稳步扩大适用范围，在严守国门食品安全底线的前提下，不断压缩通关成本。(完) 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5ba1d63fe0","title":"河北隆化赴天津推介农旅品牌 签约拓展康养研学合作","url":"https://www.chinanews.com.cn/sh/2026/11-20/10735212.shtml","summary":"中新网天津11月20日电 (记者 周亚强)河北省承德市隆化县农旅品牌资源推介活动19日在天津举办，主题为“热河之源·隆化温泉”。","summary_short":"中新网天津11月20日电 (记者 周亚强)河北省承德市隆化县农旅品牌资源推介活动19日在天津举办…","digest":"河北省承德市隆化县农旅品牌资源推介活动19日在天津举办，主题为“热河之源·隆化温泉”","points":["中新网天津11月20日电 (记者 周亚强)河北省承德市隆化县农旅品牌资源推介活动19日在天津…","隆化县与相关企业达成合作意向并现场签约，双方将在农旅开发、客源互送、研学运营…","来自行业协会、文旅企业、研学机构、康养机构的嘉宾代表参加"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-20T14:24:25+08:00","size":1,"keywords":[],"body":"中新网天津11月20日电 (记者 周亚强)河北省承德市隆化县农旅品牌资源推介活动19日在天津举办，主题为“热河之源·隆化温泉”。隆化县与相关企业达成合作意向并现场签约，双方将在农旅开发、客源互送、研学运营、康养度假等领域深化协作，推动资源共享、优势互补。\n\n图为推介活动现场。记者 佟郁 摄\n\n　　此次活动旨在深挖温泉康养、生态森林、非遗民俗、特色农品资源，拓宽农旅合作渠道，吸引更多客商和游客走进隆化。来自行业协会、文旅企业、研学机构、康养机构的嘉宾代表参加。\n\n　　推介会现场，活动在歌伴舞《欢迎你到隆化来》中拉开帷幕。隆化县相关领导致辞并介绍农旅发展情况，表示将依托资源优势，做强温泉康养、生态休闲、非遗体验、特色农产品等业态，完善配套服务，搭建互助合作平台。\n\n　　推介环节，隆化推介官集中展示当地核心农旅资源。其中，七家温泉依托华北稀缺地热资源，发展医养康养、私汤体验、精品民宿集群等业态；温泉民宿、温泉酒店等业态以及茅荆坝森林公园等生态资源同步亮相，展示隆化温泉康养、山水休闲特色。\n\n图为活动现场。记者 佟郁 摄\n\n　　活动期间，国家级非物质文化遗产代表性项目“满族二贵摔跤”与霸王鞭等民俗表演轮番上演，展现传统民俗文化；现场还穿插有奖互动问答，增进嘉宾对隆化农旅资源的了解。\n\n　　据介绍，隆化县集地热温泉、红色底蕴、原始森林、特色非遗、农旅资源于一体，各类资源联动互补。此次签约是推介活动的重要成果，将为隆化农旅产业合作拓展新伙伴、注入新动能，促进资源优势转化为产业优势、发展优势。\n\n　　隆化县方面表示，下一步将推动文旅深度融合，丰富产品供给，打造精品旅游线路，提升文旅服务品质，不断扩大“热河之源·隆化温泉”品牌影响力。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":78,"items":[{"id":"cca657cf4b9","title":"上期能源：对部分客户采取限制开仓监管措施","url":"https://www.jiemian.com/article/15356313.html","summary":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告。","summary_short":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告。","digest":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告","points":["11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告","公告称，2026年11月20日，1组实际控制关系账户在相关合约上账户组日内开仓交易量超限达到…","上述客户交易行为违反《上海国际能源交易中心异常交易行为管理细则》第16条之规定…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:38:02+08:00","size":2,"keywords":[],"body":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告。公告称，2026年11月20日，1组实际控制关系账户在相关合约上账户组日内开仓交易量超限达到上海国际能源交易中心（以下简称上期能源）处理标准。上述客户交易行为违反《上海国际能源交易中心异常交易行为管理细则》第16条之规定，上期能源决定对相关客户在相应品种上采取限制开仓的监管措施。","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"上期能源：对部分客户采取限制开仓监管措施","url":"https://www.jiemian.com/article/15356313.html","source_display":"界面新聞","published_at":"2026-11-20T17:38:02+08:00","category":"","digest":"11月20日，上海国际能源交易中心发布关于对部分客户采取限制开仓监管措施的公告"},{"title":"上期所：对部分客户采取限制开仓监管措施","url":"https://www.jiemian.com/article/15356297.html","source_display":"界面新聞","published_at":"2026-11-20T17:35:20+08:00","category":"","digest":"11月20日，上海期货交易所发布关于对部分客户采取限制开仓监管措施的公告"}]},{"id":"c636c6b12d8","title":"挪威创新署官员：中国电动汽车制造商正获得竞争优势","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-20/news1075577.shtml","summary":"当地时间11月19日，中国新能源汽车品牌蔚来进入挪威市场五周年特别活动在奥斯陆举行。","summary_short":"当地时间11月19日，中国新能源汽车品牌蔚来进入挪威市场五周年特别活动在奥斯陆举行。","digest":"当地时间11月19日，中国新能源汽车品牌蔚来进入挪威市场五周年特别活动在奥斯陆举行","points":["当地时间11月19日，中国新能源汽车品牌蔚来进入挪威市场五周年特别活动在奥斯陆举行","挪威创新署贸易与投资部门负责人加尔德·马德森(Gard Madsen)在接受记者采访时表示…","随着中国电动汽车制造商逐渐站稳脚跟，其相较于世界其他地区汽车制造商确实正获得优势"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T16:47:02+08:00","size":2,"keywords":[],"body":"当地时间11月19日，中国新能源汽车品牌蔚来进入挪威市场五周年特别活动在奥斯陆举行。挪威创新署贸易与投资部门负责人加尔德·马德森(Gard Madsen)在接受记者采访时表示，中国新能源汽车产业发展令人印象深刻。随着中国电动汽车制造商逐渐站稳脚跟，其相较于世界其他地区汽车制造商确实正获得优势。挪威对电动汽车接受程度很高，是中国汽车品牌拓展欧洲市场的良好选择。(马秀秀 制作 周昂煜)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/C016C15A860B4BD8AB1F6A07338CA530.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"挪威创新署官员：中国电动汽车制造商正获得竞争优势","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-20/news1075577.shtml","source_display":"中新視頻","published_at":"2026-11-20T16:47:02+08:00","category":"財經","digest":"当地时间11月19日，中国新能源汽车品牌蔚来进入挪威市场五周年特别活动在奥斯陆举行"},{"title":"挪威创新署官员：中国电动汽车制造商正获得竞争优势","url":"https://www.chinanews.com.cn/gj/2026/11-20/10735042.shtml","source_display":"中新網 環球","published_at":"2026-11-20T10:31:28+08:00","category":"國際","digest":"挪威创新署贸易与投资部门负责人加尔德·马德森(Gard Madsen)19日在接受记…"}],"cross":{"total":2,"angles":[{"point":"当地时间11月19日，中国新能源汽车品牌蔚来进入挪威市场五周年特别活动在奥斯陆举行","sources":["中新視頻"],"url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-20/news1075577.shtml"},{"point":"挪威创新署贸易与投资部门负责人加尔德·马德森(Gard Madsen)19日在接受记…","sources":["中新網 環球"],"url":"https://www.chinanews.com.cn/gj/2026/11-20/10735042.shtml"}]}},{"id":"c2aca038105","title":"辽宁省工商联“三措并举”护航民营经济高质量发展","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735347.shtml","summary":"中新网沈阳11月20日电 (记者 王景巍)11月20日，在辽宁省政府新闻办举办的新闻发布会上，据辽宁省工商业联合会副主席于谦介绍，辽宁省工商联将立足“两个健康”工作主题，紧密配合司法行政部门…","summary_short":"中新网沈阳11月20日电 (记者 王景巍)11月20日，在辽宁省政府新闻办举办的新闻发布会上…","digest":"11月20日，在辽宁省政府新闻办举办的新闻发布会上…","points":["中新网沈阳11月20日电 (记者 王景巍)11月20日…","于谦表示，工商联在助力打造市场化、法治化、国际化一流营商环境方面…","各级工商联将常态化入驻涉企法律服务站，通过走访调研、商会座谈、会员联络等渠道…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:45:12+08:00","size":1,"keywords":[],"body":"中新网沈阳11月20日电 (记者 王景巍)11月20日，在辽宁省政府新闻办举办的新闻发布会上，据辽宁省工商业联合会副主席于谦介绍，辽宁省工商联将立足“两个健康”工作主题，紧密配合司法行政部门，推动《辽宁省“法治护航”涉企法律服务工作行动方案(试行)》落到实处、惠及广大市场主体。\r\n\n　　于谦表示，工商联在助力打造市场化、法治化、国际化一流营商环境方面，要做好政企之间的“传声筒”，常态化归集转办企业诉求。各级工商联将常态化入驻涉企法律服务站，通过走访调研、商会座谈、会员联络等渠道，收集民营企业和个体工商户在生产经营、行政执法、权益保障等方面的法律诉求，经涉企法律服务站、12348涉企专线、网络专栏等渠道规范提交，建立诉求收集、研判分流、跟踪反馈的闭环，推动企业急难愁盼法律问题得到及时处置。\n\n　　与此同时，还要当好合规发展的“助推器”，引导民营企业依法治企。联动涉企法律服务团，围绕《中华人民共和国民营经济促进法》《中华人民共和国民法典》、知识产权、劳动用工、安全生产、跨境贸易等重点领域，开展送法进商会、进园区、进企业活动，引导企业主动参与法治体检，从源头防范法律风险，推动企业从事后维权向事前风险防控转变。同时发挥商会调解特色优势，优先柔性化解会员企业之间、上下游之间的商事、劳资纠纷，降低企业维权成本。\n\n　　此外，还要搭建协同联动的“连心桥”，推动惠企法治政策直达企业。发挥遍布辽宁省市县、各行业商会的组织网络优势，把涉企法律服务站、热线专线、网络专栏、工商联诉求提交渠道广泛告知民营企业和个体工商户，并针对龙头企业、专精特新企业、中小微企业、外向型企业不同特点，配合落实“一企一策”精准服务。\n\n　　据悉，企业既可到属地涉企法律服务站，也可拨打12348涉企专线、登录法律服务网专栏，或通过各级工商联提交法律需求，个体工商户全部纳入服务覆盖范围。\n\n　　于谦称，下步工作中，辽宁省工商联将和辽宁省司法厅密切协同，持续深化联动机制，做实诉求收集、纠纷协调、合规引导、政策直达各项工作，为辽宁民营经济高质量发展贡献工商联力量。(完) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6d04a16fcd","title":"从工业到体育 脑机接口加速“破圈”","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735342.shtml","summary":"中新社北京11月20日电 (记者 陈杭)工业场景认知状态解码，脑控小车、机械臂……","summary_short":"中新社北京11月20日电 (记者 陈杭)工业场景认知状态解码，脑控小车、机械臂…","digest":"工业场景认知状态解码，脑控小车、机械臂……19日至20日，脑机接口大赛决赛在北京举办…","points":["中新社北京11月20日电 (记者 陈杭)工业场景认知状态解码，脑控小车…","2026年，脑机接口首次写入政府工作报告","中国科学院自动化研究所研究员何晖光表示，脑机接口分为非侵入式、半侵入式和侵入式…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:44:16+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 (记者 陈杭)工业场景认知状态解码，脑控小车、机械臂……19日至20日，脑机接口大赛决赛在北京举办，设算法、脑控外设、路演共八个赛道，展示这一技术加速“破圈”，走向工业与体育等多元场景。\n\n　　2026年，脑机接口首次写入政府工作报告。中国科学院自动化研究所研究员何晖光表示，脑机接口分为非侵入式、半侵入式和侵入式，正处于场景探索阶段。虽不及AI普及，但已有相关产品进入脊髓损伤等医疗康复领域应用。\n\n11月19日至20日，脑机接口大赛决赛在北京举办。图为19日，工作人员展示佩戴智能安全帽，采集脑电数据。　中新社记者 陈杭 摄\n\n　　在工业场景认知状态解码赛道，志愿者佩戴智能安全帽采集脑电数据后，各参赛队比拼算法的分类准确率。\n\n　　大赛评委、华脑安全(北京)科技有限公司副总经理宋思沐表示，在工业安全管理中，相较于传统视频监控在矿井等场景受限于隐私和舒适度，脑电信号能更精准地辅助判断关键岗位人员的疲劳与专注度，从而防范事故。\n\n　　脑电信号易受运动干扰且个体差异大，如何在有限电极里提取更多信息，是算法面临的核心难题。“公司开发的脑机接口智能终端以安全帽为载体，实时提取高精度脑电信号，并结合脉率、血氧，活动状态、头部姿态等，实时解码大脑状态特征。”宋思沐说，该设备已在采矿、冶金、化工等行业投入应用，但仍需结合反馈情况不断打磨。\n\n11月19日至20日，脑机接口大赛决赛在北京举办。图为19日，工作人员展示采集脑电数据。中新社记者 陈杭 摄\n\n　　非侵入式脑机接口也向更垂直的运动场景渗透。深圳回录智能科技有限公司参与了脑纹识别等赛道。该公司创始人张昊天表示，传统运动手表多以心率变异性等数据为主，而脑机接口填补了大脑状态与中枢神经疲劳管理的空白。\n\n　　张昊天说，公司开发轻量化智能运动脑机头带，通过佩戴结构设计、电极材料与滤波降噪等算法抵抗运动干扰，并将脑电与行为多模态数据结合进行脑电大模型融合推理验证。产品已进入清华大学等高校课程及专业体育科研机构，用于实时监测运动员状态。下一步，公司拟通过美国消费电子展等渠道和平台，推动产品加速走向海外市场。\n\n　　尽管前景广阔，但业内人士坦言，非侵入式脑机接口面临优质数据匮乏等难题。何晖光建议，脑机接口产业需在采集端提高数据质量；在模型端，汇聚更多数据构建脑机接口大模型，提升泛化能力；在生态端，建立涵盖软硬件及应用场景的完整生态。\n\n　　本次大赛在2026脑机接口大会期间举办。据悉，大会由中国信息通信研究院、北京市昌平区联合举办，从19日持续至22日，打造集竞技活动、论坛、成果展览于一体的国家级产业交流平台。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c89cad88c78","title":"今年前10个月北京地区进出口总值创历史同期新高","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735339.shtml","summary":"中新社北京11月20日电 (记者 徐婧)北京海关20日发布统计数据显示，今年前10个月，北京地区(含中央在京单位，下同)货物贸易进出口3.14万亿元(人民币，下同)，同比(下同)增长17.4%…","summary_short":"中新社北京11月20日电 (记者 徐婧)北京海关20日发布统计数据显示，今年前10个月，北京地区(含中央在京单位…","digest":"北京海关20日发布统计数据显示，今年前10个月，北京地区(含中央在京单位…","points":["中新社北京11月20日电 (记者 徐婧)北京海关20日发布统计数据显示，今年前10个月…","其中，出口5846.4亿元，增长13.7%","进口2.55万亿元，增长18.3%"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:43:20+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 (记者 徐婧)北京海关20日发布统计数据显示，今年前10个月，北京地区(含中央在京单位，下同)货物贸易进出口3.14万亿元(人民币，下同)，同比(下同)增长17.4%，进出口总值创历史同期新高。其中，出口5846.4亿元，增长13.7%；进口2.55万亿元，增长18.3%。\r\n\n　　民营企业进出口值大幅增长。前10个月，北京地区民营企业进出口值5300.2亿元，增长47.2%；国有企业进出口值2.17万亿元，增长16.4%；外商投资企业进出口值4295.4亿元。\n\n　　同期，通过首都国际机场、大兴国际机场“双枢纽”口岸合计进出口值7071.2亿元，增长11.2%；北京经济技术开发区进出口值2046.8亿元，增长32.4%。\n\n　　前10个月，北京地区机电产品出口值3523.3亿元，增长24%，占北京地区出口值的60.3%。其中，手机、集成电路、电工器材、汽车、电脑及其零部件出口值分别增长0.6%、140.6%、34.5%、36.8%、149.1%。同期，北京地区医药材及药品、集成电路、半导体制造设备进口值分别增长7.8%、5.8%、77.5%。(完) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3821735652","title":"破解绿电外送消纳难题 中国自主研发装备在延安投运","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735335.shtml","summary":"中新社陕西延安11月20日电 (记者 李一璠 党田野)由中国自主研发的35千伏/30兆伏安IGBT串联型静止全功率发生器(SPG)经过短路试验后168小时试运行…","summary_short":"中新社陕西延安11月20日电 (记者 李一璠 党田野)由中国自主研发的35千伏/30兆伏安IGBT串联型静止全功率发生器…","digest":"由中国自主研发的35千伏/30兆伏安IGBT串联型静止全功率发生器(SPG)经过短路…","points":["中新社陕西延安11月20日电 (记者 李一璠 党田野)由中国自主研发的35千伏/30兆伏安I…","延安地处陕北能源富集区域，风电、光伏产业持续壮大","风光发电受天气影响存在间歇性波动，随着并网规模扩大…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:43:12+08:00","size":1,"keywords":[],"body":"中新社陕西延安11月20日电 (记者 李一璠 党田野)由中国自主研发的35千伏/30兆伏安IGBT串联型静止全功率发生器(SPG)经过短路试验后168小时试运行，于11月20日在陕西省延安市安塞区330千伏方河变电站正式投运，标志着中国在新型电力系统关键支撑装备领域取得重要突破。\r\n\n　　延安地处陕北能源富集区域，风电、光伏产业持续壮大。风光发电受天气影响存在间歇性波动，随着并网规模扩大，长期面临高比例新能源接入带来的短路比不足、暂态电压支撑弱等运行难题。\n\n　　SPG是一种以具备能量储备和短时过载能力的电力电子换流器为核心，以稳定内电势幅值和相角为控制目标，对外呈现电压源特性的有功/无功综合补偿技术。它依靠换流器实现快速控制，稳态调压、动态跟随、暂态支撑，被称为主动式“超级稳定器”。\n\n　　此装置在技术上实现多项突破，直流电容用量显著降低，换流阀体积明显减小，大幅提升可靠性并降低运维量；同时，储能经高频隔离接入，可兼容低压储能，满足新建工程与老站改造需求。\n\n　　国网陕西省电力有限公司延安供电公司副总经理李舟向中新社记者表示，装置的投用为大规模新能源汇集送出系统的安全稳定运行提供了可复制、可推广的自主化技术方案，“此装置能在电网故障瞬间几个毫秒内快速支撑电压，解决高比例新能源并网带来的电压波动问题，让绿电送得出、送得稳。”\n\n　　据测算，装置投运后，延安北部地区新能源出力可提升5万千瓦，供区每年可新增新能源上网电量约0.6亿千瓦时，相当于2万户家庭一年的日常用电需求。(完) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6aa719ca35","title":"圣元环保：董事长提议1亿元-1.5亿元回购公司股份","url":"https://www.jiemian.com/article/15356321.html","summary":"圣元环保11月20日公告，公司控股股东、实际控制人、董事长朱煜煊提议公司使用自有或自筹资金通过深圳证券交易所交易系统以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票…","summary_short":"圣元环保11月20日公告，公司控股股东、实际控制人、董事长朱煜煊提议公司使用自有或自筹资金通过深圳证券交易所交易系统以集…","digest":"圣元环保11月20日公告，公司控股股东、实际控制人…","points":["圣元环保11月20日公告，公司控股股东、实际控制人…","回购价格不高于公司董事会审议通过回购方案决议前30个交易日公司股票交易均价的150%…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:41:20+08:00","size":1,"keywords":[],"body":"圣元环保11月20日公告，公司控股股东、实际控制人、董事长朱煜煊提议公司使用自有或自筹资金通过深圳证券交易所交易系统以集中竞价交易方式回购公司已发行的部分人民币普通股（A股）股票，回购股份目的为维护公司价值及股东权益所必需，回购资金总额不低于1亿元（含）且不超过1.5亿元（含）。回购价格不高于公司董事会审议通过回购方案决议前30个交易日公司股票交易均价的150%，具体以董事会审议通过的回购方案为准。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8beb539616","title":"段永平谈字节跳动：6000亿美元估值“我有兴趣”","url":"https://www.jiemian.com/article/15355024.html","summary":"11月20日，知名投资人段永平在公开社交平台回应网友提问时，就字节跳动当前估值与投资价值作出明确表态。","summary_short":"11月20日，知名投资人段永平在公开社交平台回应网友提问时，就字节跳动当前估值与投资价值作出明确表态。","digest":"11月20日，知名投资人段永平在公开社交平台回应网友提问时…","points":["11月20日，知名投资人段永平在公开社交平台回应网友提问时…","在雪球平台上，有网友向其提问，如果字节跳动上市是否会购买其股票","数据显示，该公司共持有16家公司，期末持仓市值为171.91亿美元，较二季度末小幅减少"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:38:50+08:00","size":1,"keywords":[],"body":"11月20日，知名投资人段永平在公开社交平台回应网友提问时，就字节跳动当前估值与投资价值作出明确表态。\n\n在雪球平台上，有网友向其提问，如果字节跳动上市是否会购买其股票。段永平回复称：“字节跳动确实很强，但他们好像没有上市的计划。这是一个很好的例子，好公司未必就一定要上市的。字节目前的市场估值大概在6000亿美元，这个价钱我会有兴趣的。”\n\n据了解，段永平曾创立小霸王、步步高，因投资网易、苹果、茅台等标的，也成为闻名业界的“价值投资标杆”。\n\n当地时间11月16日，段永平管理的H&H InternationalInvestment向美国SEC提交了2026年三季度13F持仓报告。数据显示，该公司共持有16家公司，期末持仓市值为171.91亿美元，较二季度末小幅减少。\n\n调仓方面，H&H新建仓1只股票，增持2只股票，清仓3只股票，减持6只股票。截至今年三季度末，H&H前十大持仓个股为：苹果、伯克希尔·哈撒韦、拼多多、特斯拉、西方石油、英伟达、谷歌、微软、迪士尼以及联合健康。\n\n近期，段永平还因为投资泡泡玛特而被市场所关注，随着公司股价持续调整，他的持仓波动受到市场关注。\n\n截至目前，段永平通过旗下投资主体H&H International Investment, LLC持有泡泡玛特约1.02亿股，持股比例为8.01%，成为仅次于创始人王宁的公司第二大股东。\n\n尽管泡泡玛特股价波动明显，近期段永平对于其依旧持有看好的观点。10月21日，在雪球上，有网友向段永平询问称，“就机会成本而言，您现在call走的苹果会选择再多买点现在的泡泡玛特吗？”\n\n对此，段永平表示，“我应该还会再买一些，但不会超过公司的10%，不然公司该有意见了哈。网易我最多也就到过10%左右吧。”\n\n未经正式授权严禁转载本文，侵权必究。段永平\n\n段永平：好公司未必要上市，字节6000亿美元估值我会有兴趣2小时前\n段永平第三季度减持英伟达11月17日 12:14\n\n界面投资\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n段永平\n段永平谈字节跳动：6000亿美元估值“我有兴趣”\n\n近期，段永平还因为投资泡泡玛特而被市场所关注。\n\n原创新闻江怡曼JYM · 2026/11/20 17:38来源：界面新闻\n\n图片来源：界面图库\n\n11月20日，知名投资人段永平在公开社交平台回应网友提问时，就字节跳动当前估值与投资价值作出明确表态。\n\n在雪球平台上，有网友向其提问，如果字节跳动上市是否会购买其股票。段永平回复称：“字节跳动确实很强，但他们好像没有上市的计划。这是一个很好的例子，好公司未必就一定要上市的。字节目前的市场估值大概在6000亿美元，这个价钱我会有兴趣的。”\n\n据了解，段永平曾创立小霸王、步步高，因投资网易、苹果、茅台等标的，也成为闻名业界的“价值投资标杆”。\n\n当地时间11月16日，段永平管理的H&H InternationalInvestment向美国SEC提交了2026年三季度13F持仓报告。数据显示，该公司共持有16家公司，期末持仓市值为171.91亿美元，较二季度末小幅减少。\n\n调仓方面，H&H新建仓1只股票，增持2只股票，清仓3只股票，减持6只股票。截至今年三季度末，H&H前十大持仓个股为：苹果、伯克希尔·哈撒韦、拼多多、特斯拉、西方石油、英伟达、谷歌、微软、迪士尼以及联合健康。\n\n近期，段永平还因为投资泡泡玛特而被市场所关注，随着公司股价持续调整，他的持仓波动受到市场关注。\n\n截至目前，段永平通过旗下投资主体H&H International Investment, LLC持有泡泡玛特约1.02亿股，持股比例为8.01%，成为仅次于创始人王宁的公司第二大股东。\n\n尽管泡泡玛特股价波动明显，近期段永平对于其依旧持有看好的观点。10月21日，在雪球上，有网友向段永平询问称，“就机会成本而言，您现在call走的苹果会选择再多买点现在的泡泡玛特吗？”\n\n对此，段永平表示，“我应该还会再买一些，但不会超过公司的10%，不然公司该有意见了哈。网易我最多也就到过10%左右吧。”\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b29113235","title":"西安高新区获批工信部全国首批高标准数字园区建设对象","url":"https://www.jiemian.com/article/15356298.html","summary":"文 | 张静攀 李任子雨  近日，西安高新区成功入选工业和信息化部首批高标准数字园区建设对象，成为全国园区数字化转型先行示范。","summary_short":"文 | 张静攀 李任子雨  近日，西安高新区成功入选工业和信息化部首批高标准数字园区建设对象…","digest":"文 | 张静攀 李任子雨  近日…","points":["近日，西安高新区成功入选工业和信息化部首批高标准数字园区建设对象…","这是高新区继上半年获批国家数据产业集聚区建设试点后，再添一项国家级数字化金字招牌…","高标准数字园区建设，是工信部推动制造业数字化转型、发展新质生产力的重要部署"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:36:17+08:00","size":1,"keywords":[],"body":"文 | 张静攀 李任子雨\n\n近日，西安高新区成功入选工业和信息化部首批高标准数字园区建设对象，成为全国园区数字化转型先行示范。这是高新区继上半年获批国家数据产业集聚区建设试点后，再添一项国家级数字化金字招牌，也是全省唯一同时承载国家数据产业集聚区试点与高标准数字园区建设两项国家级数字领域任务的区域。\n\n高标准数字园区建设，是工信部推动制造业数字化转型、发展新质生产力的重要部署。本次遴选经申报推荐、专家评审等多轮严格环节，竞争门槛高、示范价值突出，入选意味着西安高新区将获得国家层面试点指引，先行探索园区全域数字化升级路径。\n\n在园区数智化建设上，西安高新区已经搭建起省市联动的数字化政策体系，探索形成协同研发、共享制造、数字金融等生产性服务新模式，创新园区资产数字化管理路径，建成以万兆光网为引领的新一代数字底座。\n\n以此获批为新起点，西安高新区将围绕产业数字化转型、园区数字化服务、园区数字化管理、数字化支撑能力四大方向开展建设，重点实施产业链链式数字化改造，完善中小企业数字化服务供给，落地共享智造、智慧政务、绿色低碳、安全应急等数字化场景，持续夯实算力网络底座、筑牢数字安全屏障。叠加此前获批的国家数据产业集聚区试点，西安高新区将形成“数据要素集聚+园区场景落地”的独特协同优势，既能依托可信数据空间盘活数据资源，又能在高标准数字园区载体中把数据要素转化为制造业升级动能。\n\n本文为转载内容，授权事宜请联系原著作权人。\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n西安高新区获批工信部全国首批高标准数字园区建设对象\n\n高新区将形成“数据要素集聚+园区场景落地”的独特协同优势。\n\n界面陕西 · 2026/11/20 17:36\n\n文 | 张静攀 李任子雨\n\n近日，西安高新区成功入选工业和信息化部首批高标准数字园区建设对象，成为全国园区数字化转型先行示范。这是高新区继上半年获批国家数据产业集聚区建设试点后，再添一项国家级数字化金字招牌，也是全省唯一同时承载国家数据产业集聚区试点与高标准数字园区建设两项国家级数字领域任务的区域。\n\n高标准数字园区建设，是工信部推动制造业数字化转型、发展新质生产力的重要部署。本次遴选经申报推荐、专家评审等多轮严格环节，竞争门槛高、示范价值突出，入选意味着西安高新区将获得国家层面试点指引，先行探索园区全域数字化升级路径。\n\n在园区数智化建设上，西安高新区已经搭建起省市联动的数字化政策体系，探索形成协同研发、共享制造、数字金融等生产性服务新模式，创新园区资产数字化管理路径，建成以万兆光网为引领的新一代数字底座。\n\n以此获批为新起点，西安高新区将围绕产业数字化转型、园区数字化服务、园区数字化管理、数字化支撑能力四大方向开展建设，重点实施产业链链式数字化改造，完善中小企业数字化服务供给，落地共享智造、智慧政务、绿色低碳、安全应急等数字化场景，持续夯实算力网络底座、筑牢数字安全屏障。叠加此前获批的国家数据产业集聚区试点，西安高新区将形成“数据要素集聚+园区场景落地”的独特协同优势，既能依托可信数据空间盘活数据资源，又能在高标准数字园区载体中把数据要素转化为制造业升级动能。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cda681dfa48","title":"2026“发现宝藏山东”冬季推广活动暨“山海冬韵·鸥遇青岛”青岛海鸥季活动启动仪式在青岛举行","url":"https://www.jiemian.com/article/15356271.html","summary":"鸥鸣落岸启冬序，山海相约聚青岛。","summary_short":"鸥鸣落岸启冬序，山海相约聚青岛。","digest":"鸥鸣落岸启冬序，山海相约聚青岛","points":["鸥鸣落岸启冬序，山海相约聚青岛","活动由山东省文化和旅游厅主办，青岛市文化和旅游局、市南区人民政府、青岛旅游集团承办…","从冰雪温泉到热气美食，从候鸟观鸥到演艺文博，山东的冬天从不缺场景…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:35:57+08:00","size":1,"keywords":[],"body":"鸥鸣落岸启冬序，山海相约聚青岛。11月20日，2026“发现宝藏山东”冬季推广活动暨“山海冬韵·鸥遇青岛”青岛海鸥季活动启动仪式在青岛奥林匹克帆船中心八角广场举行。活动由山东省文化和旅游厅主办，青岛市文化和旅游局、市南区人民政府、青岛旅游集团承办，本次推广活动整合发布一批冬季文旅资源、旅游线路、主题产品，搭建冬游山东与青岛海鸥季的联动推广平台。鸥鸣起处，冬游山东的序幕与青岛海鸥季的邀约在同一片海湾交汇，山海、城市与游客由此共赴一场冬日之约。\n\n一图识得齐鲁冬，四格认领人间暖。从冰雪温泉到热气美食，从候鸟观鸥到演艺文博，山东的冬天从不缺场景，无论哪种人格都能解锁适合自己的宝藏玩法。2026“发现宝藏山东”冬季推广活动以全省冬季文旅资源整合为主线，把资源展示、产品推介与渠道合作拧成一股绳。活动现场以群口相声《冬季的人格》开展情景推介，发布《山东冬季旅游体感图鉴》，以“冰火、候鸟、烟火、暖庐”四种人格对应冰雪温泉、观鸟治愈、热气美食、演艺非遗，发起#选择你的山东冬季人格#全网话题，让游客从“看资源”变为“认领一种冬游身份”。其意义不止于一场推介——它以人格化表达降低冬游选择门槛，以情景化叙事增强传播温度，把“冷资源”做成“热体验”，把“资源清单”变成“出行理由”。\n\n山海冬韵遍全域，文创漫游妙趣生。青岛同步以追鸥、松弛、逛吃、文艺四位“冬日搭子”视角展开“一步山海 一杯青岛”City Walk、City Drink产品线路推介，四条线路覆盖吃住行游购娱，串起全市冬季文旅场景，展示青岛冬游的多样打开方式。发布海鸥主题产品和活动，包括“快乐鸥途”海鸥主题航班、巴士、游船，“鸥然自得”海鸥主题城市体验，“鸥惠满城”近千家票根商家联盟，覆盖全城礼遇，“鸥礼来袭” 集中展示海鸥联名文创好物。同时发布文明观鸥宣传片，提醒广大市民游客爱鸥护鸥、文明观鸥。启动仪式环节，嘉宾一同放飞手中的海鸥气球，让海鸥展翅启航，让冬韵乘风而上，共同开启鸥遇青岛的冬日篇章。启动仪式最后，《鸥遇青岛》精彩唱响，这是自11月市文化和旅游局，面向全网发起的“鸥遇青岛·全城寻鸥”海鸥主题作品征集活动所征集到的原创歌曲，以“City Walk一步山海、City Drink一杯青岛”串联山海城景与城市烟火，向四海宾朋发出“鸥遇青岛”的冬日邀约。\n\n启动仪式后，参会嘉宾现场参观“非常鸥K”市集，青小鸥、鸥k发箍、鸥啦、红嘴小古等海鸥系列文创产品集中亮相，郑庄脂渣、王哥庄大馒头、夏格庄蒜香鸡等美食飘香，上合有约胶州有礼展出非遗产品，方特梦幻王国、青岛野生动物世界等景区文创琳琅满目。\n\n鸥遇青岛贯冬季，冬游长卷邀客来。当天市南区在栈桥同步启动一年一度·鸥友赴约会，定制剧《一座城的鸥之约》迎来首演，生动演绎海鸥与青岛32周年的约定故事。海鸥IP“鸥啦”携手剧目六位NPC开展“移动剧场”巡游，与市民、游客欢乐互动。\n\n值得一提的是，青岛海鸥季活动将持续至次年3月，陆续推出“鸥友视界·全域场景”“鸥友乐园·展演潮玩”“鸥友联盟·惠享冬日”“鸥友我的朋友·温度宣推”四大板块，涵盖NPC巡游、全城寻宝、鸥友冬日集、文艺展演等系列活动，联动景区、酒店、商超和品牌推出联名产品，从鸥友赴约到温暖送别，邀市民游客玩转冬日。\n\n海鸥不再只是冬日来客，而是城市叙事的引线——它把栈桥的晨光、老城的街巷、商圈的烟火与海上的航线串成一条可漫游、可体验、可回味的冬游长卷，让海鸥季立在城市里、融入生活中，把冬日流量沉淀为城市记忆。\n\n来源：推广\n\n本文为转载内容，授权事宜请联系原著作权人。资讯\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n 56万股…","基于对公司价值的判断和未来发展的坚定信心，自今年7月以来…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:34:21+08:00","size":1,"keywords":[],"body":"11月20日，赛力斯发布股份回购及增持公告。公告显示，公司通过集中竞价交易方式已累计回购A股股份1779.56万股，回购总金额约9.94亿元，回购股份全部予以注销。\n\n与此同时，基于对公司价值的判断和未来发展的坚定信心，自今年7月以来，控股股东已完成1.57亿元A股及1.097亿港元H股股份增持计划。此外，公司团队近三年增持约3.7亿元人民币，充分彰显管理层对公司长期发展的信心及对公司内在价值的高度认可。\n\n未来，赛力斯将以高质量发展为目标，持续提升经营质量，不断夯实技术、产品与渠道能力，推动内在价值稳步提升，努力为股东创造长期、稳定、可持续的回报。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce697655ff7","title":"农业农村部：从严抓好高标准农田建设突出问题整治，持续推进生猪产能综合调控","url":"https://www.jiemian.com/article/15356213.html","summary":"11月20日，农业农村部党组召开会议。","summary_short":"11月20日，农业农村部党组召开会议。","digest":"11月20日，农业农村部党组召开会议","points":["11月20日，农业农村部党组召开会议","会议强调，要认真落实党中央、国务院决策部署，系统谋划提高高标准农田建设质量…","要统筹推进耕地保护和质量提升，加强黑土地保护、酸化耕地治理和盐碱耕地综合利用…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:26:58+08:00","size":1,"keywords":[],"body":"11月20日，农业农村部党组召开会议。会议强调，要认真落实党中央、国务院决策部署，系统谋划提高高标准农田建设质量，健全高标准农田建设、运营、管护机制，分区分类细化建设重点和标准，保质保量完成年度建设任务，加力推进农田沟渠修复整治，从严抓好高标准农田建设突出问题整治，较真碰硬加强资金监管，强化全周期质量管理。要统筹推进耕地保护和质量提升，加强黑土地保护、酸化耕地治理和盐碱耕地综合利用，大力推进农业节水增效，切实提升耕地水土保持功能和粮食生产能力。要毫不放松抓实冬春农业生产，紧盯不放抓好秋冬种工作，因地因苗落细田间管理，加密灾害监测预警，做好农业防灾减灾救灾准备。要着力稳定冬季“菜篮子”产品生产，促进蔬菜产销衔接，持续推进生猪产能综合调控，加强重大动物疫病防控。要强化监测帮扶，及时防范化解返贫致贫风险，保障好农村基本民生。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c45608849ea","title":"机器人能做家务了？马斯克：未来12至18个月内实现！机器人ETF汇添富(159213)指数跌近4%，资金逢跌连续5日涌入超1000万元！","url":"https://www.jiemian.com/article/15356044.html","summary":"11月20日，黑色星期五来袭，A股市场普跌，超5200股下挫，短线情绪显著退潮，全市成交额小幅放量至1.44万亿元，已连续5日低于1.5万亿元。","summary_short":"11月20日，黑色星期五来袭，A股市场普跌，超5200股下挫，短线情绪显著退潮，全市成交额小幅放量至1.44万亿元…","digest":"11月20日，黑色星期五来袭，A股市场普跌，超5200股下挫，短线情绪显著退潮…","points":["11月20日，黑色星期五来袭，A股市场普跌，超5200股下挫，短线情绪显著退潮…","宽基ETF尾盘明显放量，沪指收盘跌幅收窄至1.22%","物理AI概念随市承压，截至收盘，机器人ETF汇添富（159213）标的指数跌3.9%…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:26:40+08:00","size":1,"keywords":[],"body":"11月20日，黑色星期五来袭，A股市场普跌，超5200股下挫，短线情绪显著退潮，全市成交额小幅放量至1.44万亿元，已连续5日低于1.5万亿元。宽基ETF尾盘明显放量，沪指收盘跌幅收窄至1.22%。物理AI概念随市承压，截至收盘，机器人ETF汇添富（159213）标的指数跌3.9%，录得弱势7连阴。资金逢跌涌入，机器人ETF汇添富（159213）今日再度小幅吸金，已连续5日吸金超1000万元。\n\n机器人ETF汇添富（159213）标的指数成分股多数回调，大族激光、绿的谐波跌超6%，三花智控、科大讯飞、中控技术等跌超3%，汇川技术等回调。\n【机器人ETF汇添富（159213）标的指数前十大成分股】\n\n截至15:00，成分股仅做展示使用，不构成投资建议。\n虽然机器人板块今日随市承压，但产业链依旧如火如荼。作为物理AI的核心赛道之一，人形机器人备受关注，其“大脑”技术加速迭代，本机量产正迅速推进。\n产业消息面上，当地时间11月18日，马斯克在TomorrowX峰会视频连线中表示，Optimus人形机器人预计在未来12至18个月内胜任倒垃圾、洗碗并将碗碟收进橱柜等家务，并计划一到两个月内进行一场“真实”的演示。\n【物理AI产业正迎来两大趋势：科技巨头加速入局+多模态模型演进】\n国盛证券指出，物理AI产业正迎来两大趋势：一是科技巨头加速入局，推动具身大模型能力提升与技术门槛下降，机器人竞争优势有望逐步向本体及软硬件协同能力转移；二是机器人训练范式从视觉主导的VLA向融合触觉的多模态模型演进，触觉有望成为精细化操作能力突破的关键增量。重点看好触觉传感器商业化突破，以及机器人本体与核心零部件的长期成长机会。\n大厂模型竞争加速，模型能力趋于普惠，本体价值有望重估。2026年以来，全球科技巨头持续加码物理AI，具身模型加速迭代。苹果发布HALO 人形机器人自主控制系统，通过仿真训练实现机器人自主全身运动，验证仿真到现实的迁移潜力；英伟达推出GR00T 2世界动作模型，强化少样本学习及跨任务泛化能力；谷歌DeepMind发布Gemini Robotics 2.5，进一步提升机器人复杂操作与真实场景执行能力。大厂持续入局有望加速具身模型能力提升，随着通用模型及开源生态逐步完善，机器人厂商获取基础智能能力的门槛有望下降，行业竞争重心将逐步向本体执行能力及软硬件协同转移。\n从VLA走向VTLA，触觉有望成为物理AI精细化操作的关键突破口。当前主流VLA模型主要依靠视觉信息生成动作，难以直接感知接触力、摩擦及滑移等物理状态，制约机器人在精密装配、柔性物体操作等高接触任务中的泛化能力。随着具身智能向精细化操作升级，融合视觉、触觉、语言与动作的VTLA模型加速发展。帕西尼与复旦大学团队提出N₀-VTLA模型，在9项真实机器人操作任务中均优于对比基线；ForeTac-VLA通过预测未来触觉状态，在4项真实接触操作任务中实现95%的平均成功率，较纯视觉VLA提升36.25个百分点；SimpleTouch通过引入触觉专家模块，在4项真实机器人任务中实现71.3%的平均成功率。触觉正从辅助感知向动作决策的重要输入演进，不仅有望提升机器人复杂接触任务的执行能力，更将成为物理AI获取真实交互数据的重要入口。随着触觉感知与模型训练深度融合，柔性电子皮肤、多维力传感器及触觉数据采集系统需求有望持续释放，推动触觉传感器商业化进程加速。（来源于国盛证券20261116《物理AI训练的两大趋势：触觉和真机》）\n【人形机器人怎么看？高度看本体、弹性看数据、容量看T链】\n国金证券指出，高度看本体。通用模型开始承担机器人任务的观察、规划和纠错，整机能覆盖多少工位、能否稳定交付，决定这一轮能力提升能转化成多大市场。11月9日，Anthropic在旗舰模型发布中披露双臂操作仿真评测。11月13日，OpenAI确认将机器人研究并入主研究团队。苹果AMP1实验则展示了如何让通用模型通过同一框架连接不同本体。走到现场，Google DeepMind采用具身推理和专用动作模型分层协作，在奔驰零件拣配试点取得96%的任务成功率。Agility披露Digit v4在客户现场累计运行超过6.5万小时，下一代Digit 5则已有附履约条件的多年期服务订单。应用扩张也出现两种路径，优必选与天翼电信终端探索新场景，Serve Robotics为既有机队开放新的订单入口。我们坚定看好物理AI能够覆盖更多任务，重点看整机能否在新工位达到客户要求的节拍和稳定性，以及付费部署和复购能否随任务范围一起扩大。\n弹性看数据。通用模型降低新任务的起步门槛后，具身数据的价值更容易用现场调试成本和失败率衡量。NVIDIA在CoRL介绍的GR00T 2采用混合数据进行预训练，包含402,730小时人类第一视角视频、10,184小时手持UMI夹爪演示、23,500小时机器人遥操作数据。其中，NVIDIA已公开10万小时的第一视角视频。在公司披露的同一组50项任务中，每项给1次和5次演示时，平均成功率分别为71%和95%。对于精细操作，视频能看到抓取过程，接触力还能反映受力方向和滑移趋势。Melexis本周发布三轴力指尖模组，为收集这类数据提供了硬件入口。国内方面，北京市经济和信息化局提出要在不少于100个真实场景采集超过100万小时高质量数据，推进对工位变化、物料差异和失败恢复等现场样本的采集。\n容量看T链。Tesla–SpaceX潜在整合提供了模型、芯片与整机制造协同的预期，供应链的批量采购要靠 Optimus产品和交付进度来验证。Tesla和SpaceX此前已分别披露设立特别委员会，潜在协同涉及xAI的模型与算力、Terafab的端侧芯片规划和Tesla的制造验证。 Optimus本身已有可跟踪的进展，Tesla于10月21日披露Fremont产线已产出首批达到生产质量标准的机器人，Texas产线仍在建设。手部尤其是手指仍需打磨，Optimus Academy筹建中的任务练习也将为模型提供真机反馈。Elon Musk在三季度业绩会上提出，若进展顺利，AI5约在2027年4月集成，外部企业交付预计在2027年底前后。T链的跟踪顺序是手部方案与关键件验证、实际生产爬坡、外部交付。（来源于国金证券20261115《物理AI：分歧时坚定看好》）\n全球科技巨头/新秀全面下场布局人形机器人，行业量产奇点已至！全面拥抱人形机器人大时代，布局万亿成长空间，认准机器人ETF汇添富(159213)，联接基金（A：024768，C：024769）跟踪中证机器人指数，人形机器人含量高达71%，该指数结构与产业链环节高度契合，为投资者提供一键布局机器人及其产业各环节的投资工具。\n风险提示：基金有风险，投资需谨慎。投资人应当阅读《基金合同》《招募说明书》《产品资料概要》等法律文件，了解基金的风险收益特征，特别是特有风险，并根据自身投资目的、投资经验、资产状况等判断是否和自身风险承受能力相适应。基金管理人承诺以诚实信用、谨慎尽责的原则管理和运用基金资产，但不保证基金一定盈利或本金不受损失。以上基金属于中风险等级（R3）产品，适合经客户风险承受等级测评后结果为稳健型（C3）及以上的投资者。请投资者关注指数化投资的风险以及集中投资于细分有色指数成分股的持有风险，请关注部分指数成分股权重较大、集中度较高的风险，请关注指数化投资的风险、ETF运作风险、投资特定品种的特有风险等。文中提及个股仅为指数成份股客观展示列举，本文出现信息只作为参考，投资人须对任何自主决定的投资行为负责。本文中的任何观点、分析及预测不构成对阅读者任何形式的投资建议。投资者在申购/赎回ETF基金份额时，申购赎回代理券商可按照不超过0.50%的标准收取佣金，其中包含证券交易所，登记机构等收取的相关费用。其他基金的销售费用请参见相应基金的招募说明书，产品资料概要等法律文件。\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n机器人能做家务了？马斯克：未来12至18个月内实现！机器人ETF汇添富(159213)指数跌近4%，资金逢跌连续5日涌入超1000万元！\n\n截至收盘，机器人ETF汇添富（159213）标的指数跌3.9%，录得弱势7连阴。资金逢跌涌入，机器人ETF汇添富（159213）今日再度小幅吸金，已连续5日吸金超1000万元。\n\n原创新闻有连云 · 2026/11/20 17:26来源：界面新闻\n\n11月20日，黑色星期五来袭，A股市场普跌，超5200股下挫，短线情绪显著退潮，全市成交额小幅放量至1.44万亿元，已连续5日低于1.5万亿元。宽基ETF尾盘明显放量，沪指收盘跌幅收窄至1.22%。物理AI概念随市承压，截至收盘，机器人ETF汇添富（159213）标的 受力方向和滑移趋势。Melexis本周发布三轴力指尖模组，为收集这类数据提供了硬件入口。国内方面，北京市经济和信息化局提出要在不少于100个真实场景采集超过100万小时高质量数据，推进对工位变化、物料差异和失败恢复等现场样本的采集。\n容量看T链。Tesla–SpaceX潜在整合提供了模型、芯片与整机制造协同的预期，供应链的批量采购要靠 Optimus产品和交付进度来验证。Tesla和SpaceX此前已分别披露设立特别委员会，潜在协同涉及xAI的模型与算力、Terafab的端侧芯片规划和Tesla的制造验证。 Optimus本身已有可跟踪的进展，Tesla于10月21日披露Fremont产线已产出首批达到生产质量标准的机器人，Texas产线仍在建设。手部尤其是手指仍需打磨，Optimus Academy筹建中的任务练习也将为模型提供真机反馈。Elon Musk在三季度业绩会上提出，若进展顺利，AI5约在2027年4月集成，外部企业交付预计在2027年底前后。T链的跟踪顺序是手部方案与关键件验证、实际生产爬坡、外部交付。（来源于国金证券20261115《物理AI：分歧时坚定看好》）\n全球科技巨头/新秀全面下场布局人形机器人，行业量产奇点已至！全面拥抱人形机器人大时代，布局万亿成长空间，认准机器人ETF汇添富(159213)，联接基金（A：024768，C：024769）跟踪中证机器人指数，人形机器人含量高达71%，该指数结构与产业链环节高度契合，为投资者提供一键布局机器人及其产业各环节的投资工具。\n风险提示：基金有风险，投资需谨慎。投资人应当阅读《基金合同》《招募说明书》《产品资料概要》等法律文件，了解基金的风险收益特征，特别是特有风险，并根据自身投资目的、投资经验、资产状况等判断是否和自身风险承受能力相适应。基金管理人承诺以诚实信用、谨慎尽责的原则管理和运用基金资产，但不保证基金一定盈利或本金不受损失。以上基金属于中风险等级（R3）产品，适合经客户风险承受等级测评后结果为稳健型（C3）及以上的投资者。请投资者关注指数化投资的风险以及集中投资于细分有色指数成分股的持有风险，请关注部分指数成分股权重较大、集中度较高的风险，请关注指数化投资的风险、ETF运作风险、投资特定品种的特有风险等。文中提及个股仅为指数成份股客观展示列举，本文出现信息只作为参考，投资人须对任何自主决定的投资行为负责。本文中的任何观点、分析及预测不构成对阅读者任何形式的投资建议。投资者在申购/赎回ETF基金份额时，申购赎回代理券商可按照不超过0.50%的标准收取佣金，其中包含证券交易所，登记机构等收取的相关费用。其他基金的销售费用请参见相应基金的招募说明书，产品资料概要等法律文件。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1483cf98db","title":"光模块再遇情绪杀跌：高“光”指数跌近5%探年内新低，龙头估值回落至历史极低分位","url":"https://www.jiemian.com/article/15356090.html","summary":"周五（11月20日），算力硬件继续磨底，重仓光模块龙头的创业板人工智能ETF华宝（159363）标的指数震荡走低，收跌4.94%再创年内新低，资金关注度较高。","summary_short":"周五（11月20日），算力硬件继续磨底，重仓光模块龙头的创业板人工智能ETF华宝（159363）标的指数震荡走低…","digest":"周五，算力硬件继续磨底，重仓光模块龙头的创业板人工智能ETF华宝标的指数震荡走低…","points":["周五（11月20日），算力硬件继续磨底，重仓光模块龙头的创业板人工智能ETF华宝（15936…","光模块龙头“易中天”再度下挫，天孚通信领跌近7%，中际旭创下跌3.72%，新易盛跌逾1%","仅作展示，个股描述不作为任何形式的投资建议，也不代表管理人旗下任何基金的持仓信息和交易动向"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-20T17:26:31+08:00","size":1,"keywords":[],"body":"周五（11月20日），算力硬件继续磨底，重仓光模块龙头的创业板人工智能ETF华宝（159363）标的指数震荡走低，收跌4.94%再创年内新低，资金关注度较高。光模块龙头“易中天”再度下挫，天孚通信领跌近7%，中际旭创下跌3.72%，新易盛跌逾1%。\n TF：159125）跌3.32%，全球中国互联网（相关ETF：513220）跌2.23%。隔夜美股三大指数均跌超2%，纳指跌2.25%，英伟达跌3.3%、连续第六周收阴，AMD遭做空机构Hunterbrook指控循环交易、重挫近8%；Anthropic上市首日收涨17.1%，但盘中回吐一半涨幅，市场把这桩史上最大IPO读成抽走其他科技股流动性。东京股市20日早盘AI与半导体遭集中抛售，日经225一度跌超4%。国内这边，阿里三季度云收入增53%、资本开支增60%但自由现金流为负，腾讯单季资本开支814亿元创新高、自由现金流-691亿元，市场对高投入何时变现的耐心正在变短。港股网易三季度营收279亿元、同比降1.8%且低于预期，股价跌超18%，华虹宏力跌超8%。\n上证50从跌2%到收红，中证2000跌5.36%，风格裂口拉到极致。\n上证指数（相关ETF：563930）跌1.22%，中证A500（相关ETF：560610）跌1.54%，中证1000（相关ETF：159680）跌4.89%，中证2000（相关ETF：159552）跌5.36%。同一天上证50涨0.45%报2785.92点，尾盘从跌超2%直线拉起。半导体内部同样分层，中证半导（相关ETF：561980）跌3.14%，科创50（相关ETF：588450）跌3.12%，消费电子（相关ETF：159779）跌3.60%。行业专属质量管理体系标准获批、国产设备向多道关键工序拓展、多家公司订单充足，产业进展没变，变的是持仓拥挤度。\n尾盘红利股集体创历史新高，防守端只剩确定性资产。\nA500红利低波（相关ETF：562180）涨0.68%居首，银行AH（相关ETF：517900）涨0.40%，电力指数（相关ETF：560480）涨0.25%，国证油气（相关ETF：159197）涨0.18%，中证畜牧（相关ETF：516670）涨0.16%。临近尾盘建设银行、工商银行、中信银行、长江电力、美的集团齐创历史新高，中国石油涨4%，茅台涨近2%。1年期LPR报3.0%、5年期以上报3.5%，连续18个月未调整，银行息差压力没有进一步恶化，这是银行股敢在这个位置创新高的底气。猪价全国瘦肉型外三元均价9.26元/公斤、环比涨0.04元，旺季启动、养殖端惜售转强，但同比仍低21.2%。反过来看，中证红利（相关ETF：515080）跌0.33%、红利质量（相关ETF：159209）跌0.91%，红利不是全面走强，只有大权重在扛。\n资金面：小盘双星迎抄底资金，卫星同样获逆势加仓\n中证2000增强ETF（159552）净申购2544.00万元居首，对应中证2000跌5.36%，中证1000增强ETF（159680）382.50万元，资金博弈小盘超跌反弹方向；、卫星ETF（159218）1391.60万元，对应卫星产业跌5.73%，指数回到起点，资金重新建仓。\n\n机构怎么看？\n光大证券11月20日认为，短线仍处磨底阶段，结构热点表现会好于指数，资金集中在业绩高增的半导体国产链与低位防御方向。中信建投指出，市场存在超跌修复性机会，但市场底和盈利底还需反复确认，操作上不宜激进，优先选择估值合理、现金流稳健、分红有保障的品种。中邮证券首席经济学家黄付生则把科技股调整拆成三层：交易结构拥挤导致筹码脆弱、海外AI商业化落地不及预期沿产业链传导、美联储加息推高无风险利率压制长久期成长估值。\n后市方向思考\n银行与电力（相关ETF：517900、560480）是当日唯一被大权重真金白银买起来的方向，LPR连续18个月未动、息差压力不再恶化，叠加年末长钱配置需求，短期仍有相对收益，但连创新高后性价比已不如11月初。自由现金流与红利低波（相关ETF：159119、562180）作为底仓更稳，中证红利本身跌0.33%，红利内部也在分化，选股比选指数重要。畜牧养殖（相关ETF：516670）与石油（相关ETF：159197）是低相关性补充，猪价同比仍低21%，只能算超跌修复。半导体制造与设备（相关ETF：561980、588450）订单与行业标准都在推进，但前期涨幅回吐压力没释放完，等缩量企稳比追反弹合适。AI应用（相关ETF：159890）拥挤度较高，海外AI开支疑虑未消，短期不具备右侧条件。港股科技（相关ETF：159125、513220）估值在低位，但网易、腾讯财报都指向AI投入压制利润，反弹更可能是超跌修复。小盘（相关ETF：159552、159680）在成交1.43万亿、超5200只个股下跌的环境里缺乏承接，仍以观察为主，超跌反弹或可一搏但不宜重仓。\n风险提示：以上内容仅供参考，不构成任何投资建议。市场有风险，投资需谨慎。\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youli 一定要注意安全，开车不能睡觉。”","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1f952b5396","title":"葉劉淑儀出任新地獨董 首次做上市公司董事 年收30萬元","url":"https://www.stheadline.com/realtime-finance/3639338/葉劉淑儀出任新地獨董-首次做上市公司董事-年收30萬元","summary":"新鴻基地產（016）公布，委任行政會議召集人葉劉淑儀，為獨立非執行董事，即日生效，屬葉太首次擔任上市公司董事。","summary_short":"新鴻基地產（016）公布，委任行政會議召集人葉劉淑儀，為獨立非執行董事，即日生效，屬葉太首次擔任上市公司董事。","digest":"新鴻基地產公布，委任行政會議召集人葉劉淑儀，為獨立非執行董事，即日生效…","points":["新鴻基地產（016）公布，委任行政會議召集人葉劉淑儀，為獨立非執行董事，即日生效…","新地指，她每年可獲30萬元董事袍金","現年76歲的葉劉淑儀現為行政會議召集人及非官守議員，她亦為新民黨…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:14:16+08:00","size":1,"keywords":[],"body":"新鴻基地產（016）公布，委任行政會議召集人葉劉淑儀，為獨立非執行董事，即日生效，屬葉太首次擔任上市公司董事。新地指，她每年可獲30萬元董事袍金。\n首位女性保安局局長\n現年76歲的葉劉淑儀現為行政會議召集人及非官守議員，她亦為新民黨、匯賢智庫及海上絲綢之路協會的創始主席，以及全球繁榮峰會的創辦人。葉太於1975年起加入公務員政務職系，涉足民政事務、保安、工商和貿易的政策範疇，她於1998年至2003年擔任保安局局長，是該局首名女性局長，在2000年晉升為「局長」級官員。\n葉劉自嘲數口唔夠 「做生意一定仆」\n葉劉淑儀去年接受訪問曾指，自己「一輩子幹的活就只是政府事務，還有就是議會事務，用英語來講就是government and politics。沒有從商，也沒有當甚麼獨董，因為沒時間也沒能力。」她又曾在公開場合表示，自己只適合從事公共事業工作，「份人唔夠數口，出去做生意一定仆呀！」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd77a669ca1","title":"鰂魚涌君豪峰錄本月首宗買賣成交 1房戶570萬元易手","url":"https://news.tvb.com/tc/1206660-鰂魚涌君豪峰錄本月首宗買賣成交1房戶570萬元易手","summary":"中原地產康怡康安街分行首席分區營業經理楊文傑表示，鰂魚涌君豪峰錄本月首宗買賣成交，分行促成單位為低層B室，實用面積290平方呎，採1房間隔，向東北，望樓景，最新以570萬元成交，折合實用呎價19,655元。楊文傑表示，新買家為投資客，看好屋苑地理位置優越，客源穩定且租務有保證。","summary_short":"中原地產康怡康安街分行首席分區營業經理楊文傑表示，鰂魚涌君豪峰錄本月首宗買賣成交，分行促成單位為低層B室…","digest":"中原地產康怡康安街分行首席分區營業經理楊文傑表示，鰂魚涌君豪峰錄本月首宗買賣成交…","points":["中原地產康怡康安街分行首席分區營業經理楊文傑表示，鰂魚涌君豪峰錄本月首宗買賣成交…","楊文傑表示，新買家為投資客，看好屋苑地理位置優越，客源穩定且租務有保證","預計單位月租可達2萬至2.1萬元，租金回報料達4.2至4.4厘"],"section":"財經","category":"地產","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T16:00:00+08:00","size":1,"keywords":["地產"],"body":"中原地產康怡康安街分行首席分區營業經理楊文傑表示，鰂魚涌君豪峰錄本月首宗買賣成交，分行促成單位為低層B室，實用面積290平方呎，採1房間隔，向東北，望樓景，最新以570萬元成交，折合實用呎價19,655元。\n楊文傑表示，新買家為投資客，看好屋苑地理位置優越，客源穩定且租務有保證。預計單位月租可達2萬至2.1萬元，租金回報料達4.2至4.4厘。據悉，原業主於2018年8月以706萬元購入單位，持貨8年，是次轉手賬面蝕讓136萬元，單位貶值19.3%。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/20263HuCdmlEVt1794823146.jpg?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb00eaec1cf","title":"前10月中国快递收入增速“跑赢”业务量","url":"https://www.chinanews.com.cn/cj/2026/11-20/10735226.shtml","summary":"中新社北京11月20日电 (记者 王梦瑶)据中国国家邮政局20日消息，今年前10个月，中国快递业务收入累计完成12981.5亿元人民币，同比增长6.6%；同期快递业务量累计完成1688.2亿件…","summary_short":"中新社北京11月20日电 (记者 王梦瑶)据中国国家邮政局20日消息，今年前10个月…","digest":"据中国国家邮政局20日消息，今年前10个月…","points":["中新社北京11月20日电 (记者 王梦瑶)据中国国家邮政局20日消息，今年前10个月…","同期快递业务量累计完成1688.2亿件，同比增长3.8%","11月10日，在位于河北廊坊的一家快递企业北方总部内，快递被有序分拣"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T14:48:16+08:00","size":1,"keywords":[],"body":"中新社北京11月20日电 (记者 王梦瑶)据中国国家邮政局20日消息，今年前10个月，中国快递业务收入累计完成12981.5亿元人民币，同比增长6.6%；同期快递业务量累计完成1688.2亿件，同比增长3.8%。快递业务收入增速“跑赢”业务量增速。\n\n　　从“以价换量”到“提质增效”，这一转变与行业综合整治“内卷式”竞争的治理脉络高度吻合。\n\n　　国家邮政局发展研究中心战略规划研究部主任刘江表示，从产地直发、进厂驻点到按品类定制，快递服务供需匹配度与履约精准度明显提升；技术应用由单点提效向全链路赋能延伸，自动化、具身机器人、无人快递车与AI(人工智能)助手承接重复性劳动，在提高效率的同时缓解一线人员压力；权益保障制度化，关怀措施更加可及，行业高质量发展成果更多惠及快递员。\n\n11月10日，在位于河北廊坊的一家快递企业北方总部内，快递被有序分拣。　中新社记者 翟羽佳 摄\n\n　　这些收入增量正投向科技与效率。顺丰在广东东莞寮步片区升级末端智慧运力，新增投入3台无人配送车参与日常派件作业，以自动化设备分流末端派送压力，降低一线人员劳动强度；浙江桐乡濮院毛衫旺季单量暴涨，韵达以客户管家系统实现多平台订单一键同步、急件优先流转，客服前置介入；圆通AI助手将揽派等日常工作集成到行者App，帮助快递员在实际派件过程中提前了解客户需求，AI室内外导航帮助快递员少绕路；邮政企业在浙江宁波与本土龙头企业共建智能云仓，依托13米高的立体仓储空间、分拣机器人、AI无人叉车等自动化设备，提升寄件效率。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"生活","total":24,"items":[{"id":"c63dd6c021b","title":"伍仲衡痛失恩師再揭喪母之痛 停網上直播三個月寫歌念親恩 53歲生日停辦派對改派福袋行善","url":"https://www.stheadline.com/film-drama/3639346/伍仲衡痛失恩師再揭喪母之痛-停網上直播三個月寫歌念親恩53歲生日停辦派對改派福袋行善","summary":"近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師（梁月玲）。","summary_short":"近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師（梁月玲）。","digest":"近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師","points":["近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師（梁月玲）","伍仲衡在社交平台分享僅在兩星期前才前往探望對方及與一些和老師的相處點滴…","原來三個多月前，伍仲衡至愛的母親也突然離開了，他痛心不已…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:45:56+08:00","size":1,"keywords":[],"body":"近日，香港樂壇痛失了一位備受尊敬的歌唱老師 - Mary老師（梁月玲）。伍仲衡在社交平台分享僅在兩星期前才前往探望對方及與一些和老師的相處點滴，完全深感他的痛心與不捨。原來三個多月前，伍仲衡至愛的母親也突然離開了，他痛心不已，沉澱了差不多三個月沒有出現社交平台開直播，只是透過他太太跟相熟的粉絲們告知沒有出現在社交平台的原因，讓他們不用擔心。\n伍仲衡感激母親栽培音樂興趣\n上星期，他在直播中與他的粉絲見面，有粉絲說他很久沒有直播了！他才公開回應：「我發生了人生最大衝擊嘅一件事情，呢件事對我打擊得好嚴重，因為喺八月嘅時候，我媽媽突然離開咗我，真係好突然，突然到我係完全唔識反應，所以我就三個月冇乜開live，但係到依家一切都回復正常，但係我仍然都係好掛住佢，日日都好掛住佢，因為我學琴都係因為佢鞭策我學，我才沒有放棄，我先可以彈到咁多歌，如果唔係佢，我可能都唔係做音樂，多謝媽咪對我嘅栽培。」這段期間，伍仲衡還寫了一首歌送給他媽媽，曲詞包辦，叫做《有種愛》，歌詞入邊完全感受到他對媽媽的感激和思念，粉絲們都紛紛留言說太感動及聽完都哭了。\n伍仲衡帶陳子晴及粉絲一齊行善\n11月21日是伍仲衡53歲生日，他每年都會與粉絲一齊度過，但他今年因為喪母的關係，決定不搞生日會，攜同他旗下新人Nat Chan陳子晴與Fans一齊做善事。上星期日他與Fan Club會員一起準備了500個福袋，派了給500個長者，希望他們都開開心心、身體健康，極具意義。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c73762d8626","title":"民族团结同心行 健康文体进乡村 ——沈阳市民族和宗教事务局联合沈阳医学院走进新民市兴隆堡镇","url":"https://www.chinanews.com.cn/txy/2026/11-20/10735346.shtml","summary":"11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融。","summary_short":"11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融。","digest":"11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融","points":["11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融","为有形有感有效铸牢中华民族共同体意识，把民族团结进步工作与便民惠民健康服务深度融合…","60名师生志愿者一早从学校出发，把一堂宣讲、一次义诊、一套健身功法，一并送到了村民身边"],"section":"生活","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:45:04+08:00","size":1,"keywords":[],"body":"11月18日，新民市兴隆堡镇温查牛满族村党群服务中心暖意融融。为有形有感有效铸牢中华民族共同体意识，把民族团结进步工作与便民惠民健康服务深度融合，沈阳市民族和宗教事务局联合沈阳医学院，在这里开展“民族团结同心行·健康文体进乡村”社会实践活动。60名师生志愿者一早从学校出发，把一堂宣讲、一次义诊、一套健身功法，一并送到了村民身边。\n\n　　上午9时30分，活动从一堂宣讲开始。市民族和宗教事务局徐鹏飞以“传承长征奋进志相聚乡土叙同心”为题，为医学院的师生和村民献上一堂铸牢中华民族共同体意识宣讲课。把长征精神与铸牢中华民族共同体意识讲到了一处。他从90年前的红军长征讲起——队伍走到哪里，各族群众就送粮、带路、腾房，同舟共济才走完了漫漫征途；再讲回眼前的温查牛满族村，路修好了，产业有了，文化活动多了，靠的同样是各族群众一起干、一起过日子。长征路上的“同心”和村寨里的“同心”，本来就是一回事。宣讲过后民族团结进步促进法读本和宣传纪念品一并送到了群众手上。\n\n　　义诊台前，沈阳医学院团委邀请的医生逐一为群众测量血压、血糖并登记，对指标异常者当面说明情况、提出就医建议；应急救护演示和合理膳食、老年常见病防治的讲解，用的是“少盐少油、粗细搭配”这样的家常话；老年居家康复指导区里，师生针对颈肩腰腿痛等问题，手把手教动作、提出护理意见。体育教学部的教师带着村民练八段锦、打太极拳。同时医护人员和志愿者分组入户，在炕头、在床前为行动不便的老人做上门义诊康复评估，把宣传资料和健康提示送到手上。一户一户走下来，服务才算真正到了“最后一米”。义诊检测的登记表写满了整整几页，健康知识图解卡片成了抢手货。村民们说，过去看病要往镇里、往市里跑，如今大夫进了村、上了门，还教会了能天天练的养生法子，这样的活动盼着常来。\n\n　　市民族和宗教局有关负责同志表示，民族团结进步不是一句口号，要落在群众看得见、摸得着的实事上，把民族工作与健康服务、文体活动拧成一股绳，铸牢中华民族共同体意识才能有形有感有效。\n\n　　温查牛满族村作为沈阳市少数民族发展任务资金项目所在地之一。近年来，沈阳市民族和宗教事务局持续加大对兴隆堡镇的帮扶力度，帮助全镇落实19项民生工程，涉及完善乡村基础设施、发展特色产业、农文旅融合发展等领域；落实3983件物资，帮扶低保、五保、残疾、高龄、大病、困难党员等低收入群体，惠及1900余人次；组织文化下乡、慈善义诊、结对帮扶、法律援助、农产品展销等惠民活动数十次。项目往村里投，服务往群众身上落。这次活动，正是把帮扶从基础设施延伸到人的身边，让资金和项目背后的温度，真正被群众摸得着、感受得到。\n\n　　下一步，沈阳市民族和宗教事务局将推动民族工作与乡村振兴同向发力，把少数民族发展任务资金项目与惠民活动有效衔接；沈阳医学院将以社会实践为纽带，常态化组织师生下沉基层，让学生在实践中受教育、长才干。\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc4437957c0","title":"2026集美·阿尔勒影像艺术季在厦门开幕","url":"https://www.chinanews.com.cn/cul/2026/11-20/10735338.shtml","summary":"中新社厦门11月20日电 (吴冠标)2026集美·阿尔勒影像艺术季20日在厦门开幕。","summary_short":"中新社厦门11月20日电 (吴冠标)2026集美·阿尔勒影像艺术季20日在厦门开幕。","digest":"2026集美·阿尔勒影像艺术季20日在厦门开幕","points":["此次艺术季展期持续至2027年1月3日，展期内呈现超过40场展览，展出来自中国、法国、瑞士…","集美·阿尔勒影像艺术季长期与知名摄影节法国阿尔勒摄影节合作，关注华人艺术家的创作与研究…","截至目前，集美·阿尔勒影像艺术季已累计呈现逾380场展览、展出近900位艺术家的作品"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T17:43:18+08:00","size":1,"keywords":[],"body":"中新社厦门11月20日电 (吴冠标)2026集美·阿尔勒影像艺术季20日在厦门开幕。\n\n　　此次艺术季展期持续至2027年1月3日，展期内呈现超过40场展览，展出来自中国、法国、瑞士、美国、韩国、挪威等国家和地区的2000余件作品，涵盖摄影、动态影像、装置、多媒体等形式。\n\n　　集美·阿尔勒影像艺术季长期与知名摄影节法国阿尔勒摄影节合作，关注华人艺术家的创作与研究，持续呈现全球影像创作的多样面貌与发展趋势。截至目前，集美·阿尔勒影像艺术季已累计呈现逾380场展览、展出近900位艺术家的作品。\n\n11月20日，2026集美·阿尔勒影像艺术季在厦门开幕。　吴冠标 摄\n\n　　法国阿尔勒摄影节总监、集美·阿尔勒联合艺术总监克里斯托弗·维斯纳(Christoph Wiesner)在开幕式上表示，两个摄影节的合作已延续十余年，其价值“远远超越了展览作品的跨地域呈现”，更在于让来自不同文化背景、拥有不同历史经验的艺术家、策展人和观众彼此相遇、交流。\n\n　　挪威艺术家比亚纳·克文斯兰(Bjarne Kvinnsland)此次参展作品为沉浸式声音装置：二十余种从深海采集的鲸鸣，经多组扬声器在暗厅中回荡。“观众可以真切体会到与鲸鱼一同置身水下是什么感受。人们无需精通音乐，也能很容易地与动物的声音产生共鸣。”\n\n　　“我希望借此作品探讨声音如何与视觉叙事产生互动。”比亚纳·克文斯兰说，海底幽暗无光，人们却可借由声音“感知光”，当鲸鸣与展厅中其他影像作品相结合，观众便会产生更多想象。\n\n　　“集美·阿尔勒已经发展成为中国乃至国际摄影领域一项重要的文化盛事。”克里斯托弗·维斯纳表示，法国阿尔勒摄影节也非常荣幸能够每年通过“集美·阿尔勒发现奖”等项目，将中国摄影艺术家的创作介绍给欧洲观众。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf5247f5af4","title":"銅鑼灣軒尼斯道官小英文呈分試 家長質疑教師試前「通水」惹不公 校方：正調查事件","url":"https://www.stheadline.com/edu-insights/3639330/銅鑼灣軒尼斯道官小英文呈分試-家長質疑教師試前通水惹不公-校方正調查事件","summary":"近日不少學校爆出呈分試爭議。","summary_short":"近日不少學校爆出呈分試爭議。","digest":"近日不少學校爆出呈分試爭議","points":["近日不少學校爆出呈分試爭議","《星島教育》昨日（19日）亦收到家長報料，指軒尼詩道官立小學（銅鑼灣）有個別老師…","校方今日（20日）回覆《星島教育》查詢，表示正在調查事件，重申所有試卷均嚴格保密"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:34:22+08:00","size":1,"keywords":[],"body":"近日不少學校爆出呈分試爭議。《星島教育》昨日（19日）亦收到家長報料，指軒尼詩道官立小學（銅鑼灣）有個別老師，在英文科呈分試開考前，於課堂向學生提供與實際試題高度相似的題目，認為有「通水」之嫌。校方今日（20日）回覆《星島教育》查詢，表示正在調查事件，重申所有試卷均嚴格保密。教育局亦回覆，表示知悉事件後，已即時聯絡學校了解情況，要求嚴肅跟進。\n軒尼詩道官立小學(銅鑼灣) (網上圖片)\n報料家長表示，該校其中一班的英文科教師在小六呈分試前，於課堂以遊戲方式讓同學回答與試卷相近的題型。該家長質疑這有「通水」之嫌，令部分學生「於關鍵評估中處於不公平劣勢」。涉事老師曾解釋，課堂題目為人工智能生成，並非刻意「通水」，但家長認為題目與正式試題的選材、題型、篇章或答案高度相近，故不接受教師以「AI生成」作解釋。\n家長認為校方的調查並不透明，要求交代涉事課堂題目的來源、與正式試卷的關係，以及是否有班別獲不公平優勢。家長續指，該校英文呈分試早前亦爆出其他爭議，包括試卷內容與日常教學不符；有班別在考試前提醒學生溫習附錄，令各班學生的準備條件不一。\n校方回覆：所有試卷均嚴格保密\n校方回覆時表示，現正調查事件。經初步了解，該級別所有英文教師在測考前均有按測考範圍及學生能力替學生進行溫習，包括其中一班透過電子互動遊戲溫習。校方重申，所有試卷均嚴格保密，教師亦已教授考試範圍的內容。該校現正檢視相關安排，並會在有需要時優化。\n教育局回覆指，當局要求學校就所有校本評核，必須嚴格遵守公平、公正的原則，並確保評核程序嚴謹妥善。教育局知悉事件後，已即時聯絡學校了解情況，要求學校嚴肅跟進，並向局方詳細交代有關處理工作。學校已就事件展開調查，並會就學校的跟進與家長溝通。在決定任何跟進措施時，校方必須以保障全體學生福祉及評核公平為首要考慮。\n教育局已提醒學校全面檢視測考安排，務必確保所有校內測考均在公平和公正的原則下進行，亦須與家長及學生保持良好溝通，提供支援。教育局會繼續與學校保持緊密聯繫，提供適切支援。\n延伸閱讀：\n【呈分試風波】教大賽馬會小學常識重考掀爭議 校方：日後計分測考劃一同日進行\n有家長投訴呈分試試題疑外洩予補習社 馬鞍山靈糧小學澄清：絕無洩密 望釋除疑慮","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c179ee62f16","title":"足本重溫｜萬千星輝賀台慶｜6大「東張女神」決戰400米 跑出東張精神 李旻芳奪冠 何沛珈包尾","url":"https://news.tvb.com/tc/1205908-足本重溫萬千星輝賀台慶6大東張女神決戰400米跑出東張精神李旻芳奪冠何沛珈包尾","summary":"TVB59 周年台慶當晚首辦「東張女神盃」，特別挑選王牌節目《東張西望》中的六大「東張女神」包括陳庭欣、何沛珈、梁敏巧、李旻芳、黎寬怡、甘詠寧，將其以往在節目中不惜一切追尋真相…","summary_short":"TVB59 周年台慶當晚首辦「東張女神盃」，特別挑選王牌節目《東張西望》中的六大「東張女神」包括陳庭欣、何沛珈、梁敏巧…","digest":"TVB59 周年台慶當晚首辦「東張女神盃」…","points":["TVB59 周年台慶當晚首辦「東張女神盃」，特別挑選王牌節目《東張西望》中的六大「東張女神」…","《萬千星輝賀台慶》「東張女神盃」於 11月19日(周四)晚在 TVB 隆重舉行…","為隆重其事，TVB早前特假觀塘 HEXAGON DYNAMIC ASIA 健身工作室舉行《萬…"],"section":"生活","category":"娛樂","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T17:21+08:00","size":1,"keywords":[],"body":"TVB59 周年台慶當晚首辦「東張女神盃」，特別挑選王牌節目《東張西望》中的六大「東張女神」包括陳庭欣、何沛珈、梁敏巧、李旻芳、黎寬怡、甘詠寧，將其以往在節目中不惜一切追尋真相、最真實追訪涉事者的狂奔場面搬上台慶賽道。\n\n《萬千星輝賀台慶》「東張女神盃」於 11月19日(周四)晚在 TVB 隆重舉行，在全港觀眾見證下，「東張女神」將化身「跑女」同場決戰 400 米，於真實賽道上跑出「東張精神」，完美 演繹出日常「求真追訪」的勇往直前、堅持不懈的精神。\n\n為隆重其事，TVB早前特假觀塘 HEXAGON DYNAMIC ASIA 健身工作室舉行《萬千星輝賀台慶》「東張女神盃」記者會。六大「東張女神」陳庭欣、何沛珈、梁敏巧、李旻芳、黎寬怡、甘詠寧「東張女神」輪流抽出比賽出場號碼，揀選屬於自己的賽道;為公平競爭，六大「跑女」 亦進行賽前過磅，並呼籲觀眾參與「東張女神盃」競猜遊戲投票，冀「女神」們發揮水準，順利跑出。記者會司儀由關曜儁擔任。\n\n6位東張女神包括李旻芳、梁敏巧、黎寬怡、甘詠寧、何沛珈、陳庭欣手持咪進行400米跑步比賽，最終李旻芳奪得第一名，何沛珈包尾！","image":"https://pro-vod-cdn.tvb.com/a2f99c1392974d5dbfee3c80d1824a19/snapshots/c888b082689e44639c9d90742025c579-00008.jpg","video":"https://pro-vod-cdn.tvb.com/a2f99c1392974d5dbfee3c80d1824a19/098bcec2a9c14f04a5ace9a82a907364-ae4a167ad5522651c6264fc1f067024c-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/a2f99c1392974d5dbfee3c80d1824a19/snapshots/c888b082689e44639c9d90742025c579-00008.jpg","lang":"zh-Hant"},{"id":"ceab8f781a7","title":"曾傲棐入圍叱咤七強止步感激粉絲每日拉票 范卓賢澳門跨年騷跳舞留畀姜濤羅志祥","url":"https://www.stheadline.com/film-drama/3639337/曾傲棐入圍叱咤七強止步感激粉絲每日拉票-范卓賢澳門跨年騷跳舞留畀姜濤羅志祥","summary":"曾傲棐（Arvin）和范卓賢（Jacky Fan）今日出席節目《收夜的美食家》記者會，兩人分享拍攝時的趣事，更爆試過做侍應時有客人生日陪飲酒飲到嘔，又指食完一餐試過重3KG。","summary_short":"曾傲棐（Arvin）和范卓賢（Jacky Fan）今日出席節目《收夜的美食家》記者會，兩人分享拍攝時的趣事…","digest":"曾傲棐和范卓賢（Jacky Fan）今日出席節目《收夜的美食家》記者會…","points":["曾傲棐（Arvin）和范卓賢（Jacky Fan）今日出席節目《收夜的美食家》記者會…","曾傲棐爆醉後講AI不能取代人情味","曾傲棐指自己平常也飲得，但因為當日溝酒和沒有飲水的關係，所以飲到嘔…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:15:57+08:00","size":1,"keywords":[],"body":"曾傲棐（Arvin）和范卓賢（Jacky Fan）今日出席節目《收夜的美食家》記者會，兩人分享拍攝時的趣事，更爆試過做侍應時有客人生日陪飲酒飲到嘔，又指食完一餐試過重3KG。\n曾傲棐爆醉後講AI不能取代人情味\n曾傲棐指自己平常也飲得，但因為當日溝酒和沒有飲水的關係，所以飲到嘔，又指因為拍節目所以不介意豁出去，只是沒想過飲醉後會那麼多嘢講，笑言今次是第一次在人面前飲醉和斷片，但自己酒品應該是OK的，因沒有收到任何評論；而Jacky就指曾傲棐不懂避酒，自己飲到差不多就會趴在枱上避，又指他飲醉後不停說話，講得最好笑的是AI不能取代人情味，而兩人又指拍這個節目之後，最怕就是「上磅」，因為全盛時期是真的重了3KG，又指試過一星期拍4、5日，真的試過食到嘔。\n曾傲棐能入七強算是一種交代\n曾傲棐早前入圍《2026年度叱咤樂壇流行榜頒獎典禮》「叱咤樂壇我最喜愛的男歌手」七強，但可惜最後五強止步，他坦言入十強已經是超額完成，能入七強是對支持自己的朋友算是一種交代：「始終個獎或者入圍都係靠佢哋每人投票，我冇乜功勞，每日打開Threads見佢哋幫我拉票，好感謝佢哋。」\n范卓賢唔想挑戰觀眾底線\n至於Jacky稍後將會與羅志祥、姜濤等人到澳門演出跨年騷，問到時是否會跳舞？他笑指不是不想挑戰自己，而是不想挑戰觀眾的底線：「始終佢哋買飛入場睇，我希望係用我最叻同最好嘅嘢俾人哋睇，我都唔希望代表公司出去會失禮，跳舞有師兄同小豬，我嘅話等我練好啲再算。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb5a8ad623a","title":"叱咤2026｜我最喜愛五強出爐 古天樂出局張敬軒單挑4鏡仔 容祖兒相隔7年再殺入5強","url":"https://www.stheadline.com/film-drama/3639336/叱咤2026我最喜愛五強出爐-古天樂出局張敬軒單挑4鏡仔-容祖兒相隔7年再殺入5強","summary":"商業電台今日（20日）正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果，樂迷萬眾期待的「叱咤樂壇我最喜愛的男歌手、女歌手及組合」最後5強名單經已誕生。","summary_short":"商業電台今日（20日）正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果…","digest":"商業電台正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果…","points":["商業電台今日（20日）正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果…","今屆名單可謂驚喜重重，除了一眾新生代繼續混戰外，樂壇天王天后亦創下驚人紀錄…","至於日前掀起全城熱話、誓要爭奪「我最喜愛」的影帝古天樂，最終則後勁不繼，未能殺入最後5強…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T17:09:59+08:00","size":1,"keywords":[],"body":"商業電台今日（20日）正式公布《2026年度叱咤樂壇流行榜頒獎典禮》第二階段投票結果，樂迷萬眾期待的「叱咤樂壇我最喜愛的男歌手、女歌手及組合」最後5強名單經已誕生。今屆名單可謂驚喜重重，除了一眾新生代繼續混戰外，樂壇天王天后亦創下驚人紀錄，其中張敬軒與容祖兒雙雙打破歷史，第19次入圍5強，風頭一時無兩。\n古天樂飲恨張敬軒單挑四鏡仔\n男歌手方面的競爭極具戲劇性。早前在投票走勢中一度跌出7強、令粉絲捏一把汗的MIRROR成員呂爵安（Edan）、陳卓賢（Ian）及盧瀚霆（Anson Lo），在最後關頭憑「神徒」、「柳柳粉」及「爵屎」等強力發動全天候拉票，最終成功強勢回歸，攜手殺入5強。連同另一人氣成員姜濤，以及樂壇長青樹張敬軒，今屆男歌手5強名單繼2021年及2022年後，歷史性第三度出現完全相同的「1敵4」夢幻陣容！張敬軒將再次以一人之力，力敵4位「鏡仔」的夾擊。至於日前掀起全城熱話、誓要爭奪「我最喜愛」的影帝古天樂，最終則後勁不繼，未能殺入最後5強，遺憾出局，無緣再次締造「古天樂神話」。\n相關閱讀：古天樂殺入叱咤2026我最喜愛男歌手八強 為入5強被逼拍片宣傳 晒宣萱黑圖笑料百出\n容祖兒相隔7年驚喜回歸\n女歌手方面同樣亮眼，樂壇天后容祖兒相隔7年後，再次強勢打入最後5強，證明其天后級號召力依然無減。今屆女歌手名單亦呈現「世代交替」的全新局面，人氣小天后炎明熹（Gigi）與實力派女歌手黃淑蔓（Feanna）均是首度入圍5強，成績令人鼓舞。她們將連同COLLAR實力成員邱彥筒（Marf）以及唱家班衛蘭（Janice），一同角逐「我最喜愛的女歌手」寶座。\nCOLLAR大熱倒灶出局\n組合方面的戰況同樣激烈。在今早10時公布的暫時7強走勢中，本來形勢大好的COLLAR及晚安莉莉，在最後兩小時的衝刺階段大熱倒灶，最終未能晉身5強。最終成功突圍、躋身最後5強的單位包括樂壇人氣男團MIRROR、搞笑與實力兼備的ERROR、網絡神級組合JFYT、青春女團VIVA以及殿堂級Hip-Hop組合農夫FAMA。\n頒獎典禮詳情\n這場樂壇年度壓軸盛事《2026年度叱咤樂壇流行榜頒獎典禮》，已定於2027年1月1日（星期五）晚上7時，於亞洲國際博覽館ARENA隆重舉行。屆時一眾樂迷誓必屏息以待，見證各大獎項花落誰家。\n11月23日中午12時起，「叱咤樂壇我最喜愛的男、女歌手及組合」第三階段網上投票正式開始\n「叱咤投票站」：https://pse.is/9vug55\n第三階段投票日期：2026年11月23至27日\n日期：2027年1月1日（星期五）\n時間：晚上7時\n地點：亞洲國際博覽館 ARENA\n相關閱讀：叱咤2026丨我最喜愛男女歌手及組合十強出爐 姜濤、Ian陳卓賢或缺席無阻粉絲投票力撐","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8bd5354e50","title":"罗嘉良时隔23年再登TVB台庆重现《难兄难弟》经典场面","url":"https://www.chinanews.com/yl/shipin/cns-d/2026/11-20/news1075579.shtml","summary":"香港TVB于11月19日晚在香港举行59周年台庆晚会《万千星辉贺台庆2026》，曾多次夺得万千星辉颁奖典礼最佳男主角的香港艺人罗嘉良亮相舞台。","summary_short":"香港TVB于11月19日晚在香港举行59周年台庆晚会《万千星辉贺台庆2026》…","digest":"香港TVB于11月19日晚在香港举行59周年台庆晚会《万千星辉贺台庆2026》…","points":["香港TVB于11月19日晚在香港举行59周年台庆晚会《万千星辉贺台庆2026》…","这是他自2003年离巢后，时隔23年重返TVB台庆","罗嘉良联同关嘉敏、游嘉欣、钟柔美、刘芷君等新生代艺人，重现《难兄难弟》经典场面…"],"section":"生活","category":"生活","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T17:04:52+08:00","size":1,"keywords":[],"body":"香港TVB于11月19日晚在香港举行59周年台庆晚会《万千星辉贺台庆2026》，曾多次夺得万千星辉颁奖典礼最佳男主角的香港艺人罗嘉良亮相舞台。这是他自2003年离巢后，时隔23年重返TVB台庆。\n\n罗嘉良联同关嘉敏、游嘉欣、钟柔美、刘芷君等新生代艺人，重现《难兄难弟》经典场面，一同献唱曲目《奇哥》。经典剧集搭配新生代演绎，勾起不少观众的集体回忆。作为TVB经典剧集代表演员，他的登场成为当晚台庆的一大看点，为晚会添上怀旧色彩。(记者 戴小橦 制作 侯诗蕊)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/9F837337F1C547C39456DA59E2A9C5EC.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c791820fdef","title":"天氣｜天文台料明早氣溫最低13度 提醒市民注意保暖","url":"https://news.tvb.com/tc/1207437-天氣天文台料明早氣溫最低13度提醒市民注意保暖","summary":"寒冷天氣警告生效，正午時分各區氣溫普遍跌至約12度，明早氣溫預料仍然偏低。一股強烈東北季候風，加上一道廣闊雲帶，氣溫顯著下降。","summary_short":"寒冷天氣警告生效，正午時分各區氣溫普遍跌至約12度，明早氣溫預料仍然偏低。","digest":"寒冷天氣警告生效，正午時分各區氣溫普遍跌至約12度，明早氣溫預料仍然偏低","points":["寒冷天氣警告生效，正午時分各區氣溫普遍跌至約12度，明早氣溫預料仍然偏低","一股強烈東北季候風，加上一道廣闊雲帶，氣溫顯著下降","在紅磡大環山海旁，無阻市民天未亮就落水"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T15:27+08:00","size":1,"keywords":[],"body":"寒冷天氣警告生效，正午時分各區氣溫普遍跌至約12度，明早氣溫預料仍然偏低。\n\n一股強烈東北季候風，加上一道廣闊雲帶，氣溫顯著下降。\n\n在紅磡大環山海旁，無阻市民天未亮就落水。亦有市民身穿背心，如常跑步。\n\n在中環碼頭，上班族及學生都要添加厚外套。亦有學生出動頸巾保暖。\n\n天文台清晨錄得15.3度，是今年入秋以來最低，但越晏越凍，中午跌至13.2度，各區普遍下降至約12度。\n\n天文台指加上風寒效應，提醒市民注意保暖。\n\n天文台高級科學主任楊漢賢說：「這次的寒潮屬於濕潮，濕的寒潮，即下雨的寒潮，通常都是這樣，日間雲多，密雲，看不到陽光，所以日間氣溫不能回升，加上大風，所以氣溫會持續下降。」\n\n天文台預料，明早氣溫仍然偏低最低13度，隨後一兩日氣溫稍為回升，另一股東北季候風會在下周二抵達華南沿岸，將再度轉涼，亦會有幾陣雨。\n\n九天天氣預報","image":"https://pro-vod-cdn.tvb.com/0d959b18361c4906a9fe868cb7510769/snapshots/e9b95a8936eb49eca41aafc8acee864a-00008.jpg","video":"https://pro-vod-cdn.tvb.com/0d959b18361c4906a9fe868cb7510769/a2497ecb7a174bc484da195c70b56ca1-133f832065624b26292bc6cc21f610cb-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/0d959b18361c4906a9fe868cb7510769/snapshots/e9b95a8936eb49eca41aafc8acee864a-00008.jpg","lang":"zh-Hans"},{"id":"ca19d21cc31","title":"寶珠｜線上看Disney+陸劇 代露娃與賴偉明上演殺豬女嫁落魄世子 劇情懶人包及5大必看亮點","url":"https://www.stheadline.com/film-drama/3638094/寶珠線上看Disney陸劇-代露娃與賴偉明上演殺豬女嫁落魄世子-劇情懶人包及5大必看亮點","summary":"寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Disney+和芒果TV播出，共24集。","summary_short":"寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Disney+和芒果TV播出，共24集。","digest":"寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Dis…","points":["寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Disney+…","故事講述兩位主角「先婚後愛、雙向救贖」的宅鬥權謀","下文將為您精心整理《寶珠》的追劇日曆、詳細劇情大綱、人物關係圖、主要角色介紹…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T14:42:57+08:00","size":1,"keywords":[],"body":"寶珠｜由人氣演員代露娃和賴偉明領銜主演的古裝愛情權謀劇《寶珠》於11月18日在Disney+和芒果TV播出，共24集。故事講述兩位主角「先婚後愛、雙向救贖」的宅鬥權謀。下文將為您精心整理《寶珠》的追劇日曆、詳細劇情大綱、人物關係圖、主要角色介紹，以及5大必看亮點！\n追劇日曆\n劇情大綱\n人物關係圖\n角色介紹\n必看亮點\n《寶珠》追劇日曆\n《寶珠》追劇日曆公開！\n回到目錄\n《寶珠》詳細劇情大綱\n市井屠戶女金寶珠（代露娃 飾）為擺脫家人壓榨，主動嫁入漕運世家，給雙腿致殘、假裝自暴自棄的落魄嫡子謝硯（賴偉明 飾）做妾，並簽下3年婚約。金寶珠憑藉殺豬刀的氣勢與過人算帳能力震懾刁僕、整頓產業，更逼迫表面病弱的謝硯戒除藥癮、重拾生機。在過程中，二人由原本的針鋒相對，慢慢暗生情愫，最終合力洗刷謝硯的冤屈並化解家族危機，收穫圓滿愛情。\n《寶珠》可謂低開高走。\n回到目錄\n《寶珠》人物關係圖\n《寶珠》人物關係圖公開！\n回到目錄\n《寶珠》主要角色介紹\n金寶珠（代露娃 飾）\n金寶珠是一名出身市井屠戶家庭的潑辣少女，她性格果敢直率、精明貪財。在嫁入謝府做妾後，憑藉殺豬刀的氣勢與過人算帳本領整頓家業，在深宅中走出自己的路。\n代露娃飾金寶珠。\n謝硯（賴偉明 飾）
