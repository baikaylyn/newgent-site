应邀出席亚太经合组织(APEC)第三十三次领导人非正式会议的领导人、代表，留下一张具有标志性意义的集体合影。\n\n　　嘉宾身穿东道主特别设计的服饰拍摄“全家福”，是APEC大家庭的传统保留环节。19日会议开始前，与会经济体领导人、代表戴上红蓝围巾，留下属于深圳的“APEC时刻”。\n\n　　这张集体合影里人员齐、规格高，被认为是近十年以来最全的APEC“全家福”。从“全”“家”“福”三个字，或可更好读懂合影传递的信息。\n\n11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议。　中新社记者 赵文宇 摄\n\n　　“全”：APEC大家庭“整整齐齐”\n\n　　连日来，深圳宝安国际机场红毯铺不停。\n\n　　美国总统特朗普来了。去年在韩国庆州，特朗普参加了APEC工商领导人峰会，但在APEC领导人非正式会议前启程返美。\n\n　　俄罗斯总统普京来了，携3位副总理、7位部长出席深圳APEC盛会。上一次普京在线下出席APEC领导人非正式会议是在2017年。\n\n　　“在世界动荡变局中，大家都认为应坐下来探讨如何解决问题。更多国家选择‘向东看’，希望找到摆脱贫困和战争的办法，这也是APEC吸引力所在。”中国现代国际关系研究院研究员陈凤英说。\n\n　　30多年来，APEC促进亚太地区实现发展与繁荣。数据显示，APEC成员经济体以近全球40%的人口，创造了超出六成的全球经济总量。\n\n　　“亚太共同体区别于排他性‘小圈子’的特点在于，不让任何一个伙伴掉队。”四川大学国际关系学院讲席教授荣鹰表示，众多经济体领导人齐聚深圳，APEC大家庭“整整齐齐”，说明各方愿意以多边交流扩大合作“朋友圈”。\n\n　　“家”：彰显中国主场外交号召力\n\n　　从北京雁栖湖到深圳香蜜湖，各成员领导人、代表合影，将APEC会议的盛况定格在历史相册中。\n\n　　“这张近十年最全APEC‘全家福’，彰显中国办会的号召力。”陈凤英分析，一方面，中国已成为13个APEC经济体最大贸易伙伴，紧密联结的经贸纽带为亚太伙伴共享中国发展机遇筑牢根基。\n\n　　另一方面，当今世界风云变幻，中国发展的稳定性、确定性弥足珍贵。作为“多边主义的捍卫者和世界经济的重要引擎”，中国再次担任APEC东道主，也给动荡的世界带来更多确定性。\n\n　　今年，中方同各成员经济体一道成功举办了300多场各类会议和活动，APEC“中国年”取得一系列合作成果。在深圳，中方细致周密的安排也让外方宾至如归。\n\n　　“各经济体领导人、代表高度肯定中国作为东道主的努力和贡献，同时也期待中国为实现APEC目标和愿景作出更大贡献。”荣鹰说。\n\n　　“福”：合作像大鹏一样展翅高飞\n\n　　太平洋连接着亚太大家庭，承载着各方对美好生活的共同期待。\n\n　　有评论认为，在逆全球化与地缘博弈交织的当下，APEC“软协调”机制的意义反而凸显出来：它不必解决所有分歧，却能提供一个“先把分歧放一边、把合作做起来”的空间，让亚太合作像大鹏一样展翅高飞、鹏程万里。\n\n　　荣鹰说，各方积极参会，对亚太区域合作的未来方向和路径展开充分讨论，有利于挖掘更多机遇。\n\n　　深圳的故事本身就是亚太合作的成功范例。来到这座“奇迹之城”，当城市的故事与亚太的故事交汇，已有多位APEC经济体领导人表达对合作的期待。\n\n　　智利总统卡斯特走进水果门店，见证智利车厘子新产季在华开启；澳大利亚总理阿尔巴尼斯走进超市，考察龙虾等澳特产，表示“正致力于推动经济增长”；墨西哥总统辛鲍姆走进智慧医院，近距离了解深圳医疗的科技成果，并称要把先进科学技术成果引入墨西哥……\n\n　　陈凤英表示，APEC织密合作网络、拉紧利益纽带，有助于推动合作进一步走深走实。“开放、创新、合作”，不仅是中国主场外交的重点，也指向亚太合作的前方。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd3828d40de","title":"深圳APEC︱中俄美元首歷史性會晤 習近平：三國應守住和平共處底線","url":"https://www.stheadline.com/realtime-china/3638877/深圳APEC中俄美元首歷史性會晤-習近平三國應守住和平共處底線","summary":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。","summary_short":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","digest":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","points":["深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","習近平指出，中俄美三國最高領導人有史以來首次聚首，具有開創性意義","近年來，中國推進中俄新時代全面戰略協作夥伴關係，積極構建中美建設性戰略穩定關係…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:18:14+08:00","size":1,"keywords":[],"body":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。習近平指出，中俄美三國最高領導人有史以來首次聚首，具有開創性意義。 ​​​\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n習近平指出，當今世界早已不是彼此隔絕的孤島。人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體。在這個地球村裡，大國肩負著特殊責任。大國良性互動不是選擇題，而是必答題。近年來，中國推進中俄新時代全面戰略協作夥伴關係，積極構建中美建設性戰略穩定關係，推動形成和平共處、總體穩定、均衡發展的大國關係格局，既惠及彼此，又造福世界。\n習近平又指當前，世界百年變局加速演進，天下並不太平。風雨見擔當。作為世界主要大國和聯合國安理會常任理事國，中俄美應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定，為人類進步作出更大貢獻。\n相關新聞：深圳APEC︱特朗普晤習近平 表態：美國不支持「台獨」\n習近平指出，和平是人類社會的永恆期盼。我們這個星球曾爆發過1萬多次戰爭，兩次世界大戰更是給人類社會造成空前浩劫，當下世界上仍有60多場地區衝突延宕不止。歷史告訴我們：大國和，則世界安；大國鬥，則世界亂。80多年前，作為世界反法西斯的中堅力量，中俄美三國並肩奮戰，取得偉大勝利，為世界贏得和平和安寧。歷史是最好的教科書。我們要銘記歷史，以史為鑒，開創未來。\n大國如何正確相處提出4點看法\n第一，堅持相互尊重。相互尊重是大國交往的基本準則。中俄美三國國情不同，誰也改變不了誰，這是歷史形成的，也是各自人民的自主選擇。正確的態度是彼此尊重、求同存異、共同發展。要尊重彼此主權和領土完整，尊重各自選擇的社會制度和發展道路，尊重彼此核心利益和重大關切。要堅持不干涉別國內政，不干涉彼此內部事務。在涉及對方的重大敏感問題上，提前溝通、換位思考、謹慎行事，特別是不能觸碰對方的底線。\n第二，堅持和平共處。「修昔底德陷阱」絕不是宿命，關鍵要看主要大國如何抉擇。中俄美要做夥伴、做朋友，不衝突、不對抗，守住和平共處底線，努力跨越「修昔底德陷阱」。中俄美都是二戰主要戰勝國，應當堅定維護戰後國際秩序，維護《聯合國憲章》宗旨，捍衛來之不易的二戰勝利成果。核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n相關新聞：深圳APEC｜普京隨行軍官直認手上「核公事包」 中美俄會晤前「騷肌肉」？\n第三，堅持合作共贏。三國發展稟賦不同，經濟互補性強，可以發揮自身優勢，互通有無。應該摒棄冷戰思維，加強經貿合作，將資源大國、製造大國、消費大國的各自優勢貫通起來，共同做大合作蛋糕，實現雙贏共贏，而不能搞「脫鉤斷鏈」。全球能源安全面臨嚴峻挑戰，三國可以加強溝通和協調，共同維護能源產業鏈供應鏈穩定暢通，維護全球能源市場安全穩定。\n第四，堅持對話協商。大國間有分歧在所難免，如果不溝通，猜忌便會蔓延，小摩擦也可能演變成大衝突。三國要保持常態化高層交往，暢通各層級對話渠道，建立危機溝通和預防機制，確保誤判少發生、分歧管得住、摩擦不升級。當前，全球各種紛爭持續不斷，熱點問題按下葫蘆浮起瓢，國際社會期待大國多做勸和促談工作。中俄美三國應該繼續推動衝突當事方坐下來、談起來，通過政治外交手段化解紛爭。\n習近平：最終建設無核世界\n習近平：堅持和平共處。「修昔底德陷阱」絕不是宿命，關鍵要看主要大國如何抉擇。中俄美要做夥伴、做朋友，不衝突、不對抗，守住和平共處底線，努力跨越「修昔底德陷阱」。中俄美都是二戰主要戰勝國，應當堅定維護戰後國際秩序，維護《聯合國憲章》宗旨，捍衛來之不易的二戰勝利成果。核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n相關新聞：深圳APEC︱特朗普晤習近平 稱「美中同盼俄烏伊朗止戰」\n美國總統特朗普在會議開幕致辭中則表示，「這三個國家（美中俄）在討論核武問題上具有獨特的優勢」。特朗普還補充說：「過去的領導人常常避免與那些和他們意見相左的領導人交談」。他表示，減少溝通機會絕不會締造和平，美中俄肩負著解決影響全球問題的重大責任。\n特朗普稱我們必須合作打擊全球核擴散威脅、擁有核武器，為此今天我們將討論所有相關議題。\n相關新聞：深圳APEC｜金正恩視察咸鏡南道 朝方未回應是否與特朗普會晤\n俄羅斯總統普京則感謝中方積極組織今次三國元首會晤。他強調，中美俄三國同為第二次世界大戰戰勝國，對維護全球和平穩定負有特殊責任，並表示烏克蘭局勢將是今次會談的重點議題。\n普京向中美兩國領導人表示，只要俄羅斯、中國和美國進行建設性合作，便能加強全球穩定。他說：「我們三國在解決地區衝突方面擁有許多共同利益，當中自然也包括烏克蘭衝突。」\n普京進一步指出，他與習近平、特朗普可以「為加強全球安全與穩定作出有意義的貢獻，前提是我們必須展開建設性合作」。\n相關新聞：深圳APEC︱ 習近平：大國和則世界安，大國鬥則世界亂︱不斷更新\n國家主席習近平在中俄美元首三方會議前，先與美國總統特朗普雙邊會晤。兩人在深圳麒麟山莊會面，歷時約1小時。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbd80977f12","title":"深圳APEC︱特朗普晤習近平 表態：美國不支持「台獨」","url":"https://www.stheadline.com/realtime-china/3638855/深圳APEC特朗普晤習近平-表態美國不支持台獨","summary":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。","summary_short":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","digest":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","points":["深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","在三方會面之前，國家主席習近平就先與美國總統特朗普會晤，雙方就多項議程進行交流","中美元首先於19日下午進行會晤，根據《央視》畫面顯示，美方出席人員包括國務卿魯比奧…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:05:48+08:00","size":1,"keywords":[],"body":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。在三方會面之前，國家主席習近平就先與美國總統特朗普會晤，雙方就多項議程進行交流。\n特朗普：美中存在特殊關係\n相關新聞：深圳APEC︱特朗普與普京會晤︱不斷更新\n中美元首先於19日下午進行會晤，根據《央視》畫面顯示，美方出席人員包括國務卿魯比奧、財長貝森特、商務部長盧特尼克、貿易代表格里爾、白宮幕僚長米勒、副幕僚長斯卡維諾，以及美國駐華大使龐德偉。\n中方出席人員包括外長王毅、財長藍佛安、外交部副部長馬朝旭，以及中共中央政策研究室主任唐方裕。畫面還顯示，國務院副總理何立峰、中央書記處書記蔡奇、國家發展改革委主任鄭柵潔，以及廣東省委書記黃坤明也出席會晤。\n\n新華社報道，習近平指出，過去幾個月，從北京到華盛頓，我和特朗普總統共同探索中美兩個大國正確相處之道，確立了「中美建設性戰略穩定關係」的新定位，並賦予其「基於尊重、公平、對等」的新內涵，受到中美兩國人民認可和國際社會歡迎。中美關係總體穩定向好，給兩國人民帶來實實在在的利益，也給世界注入穩定性和確定性。\n習近平：願續與特朗普合作\n習近平強調，構建中美建設性戰略穩定關係是前無古人的開創性事業，需要敢闖敢試、腳踏實地、善作善成。中美元首外交的引領作用不可替代。要延續中美關係目前的穩定向好勢頭，關鍵是要在落實元首共識上付諸行動。雙方團隊的溝通也要跟上。要拉長合作清單、壓縮問題清單，一時解決不了的分歧要建設性管控，防止矛盾升級。\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n\n他指出，在台灣問題上，美方要堅持做正確的事，避免中美關係出現大的波折。經貿領域要加強溝通，解決彼此關切，爭取互利互惠。兩國在禁毒、非法移民遣返、打擊電信網絡詐騙等領域的合作卓有成效，可以本著尊重、公平、對等的原則繼續加強合作。中美應當加強溝通和協調，防範人工智能安全風險，確保人工智能始終處於人類控制之下。\n\n新華社又指，特朗普示建交40多年來，美中關係取得顯著進展。我同習近平主席保持密切交往，友誼日益深厚，共同引領美中關係發展。兩國貿易、投資關係不斷加強，芬太尼等領域合作取得成效。雙方應保持美中關係穩定發展勢頭，在農產品、能源、超級智能等領域加強合作，公平處理好各自關切。美國不支持「台獨」。祝賀中方成功舉辦亞太經合組織領導人非正式會議。美國非常強大，中國也非常強大，兩國要共同引領和促進世界和平穩定。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce80096fabf","title":"街頭宣傳「超筍」找換服務 港幣$1000換人民幣¥900 放蛇揭疑點重重 | 星島申訴王","url":"https://www.stheadline.com/voice-undercover/3638475/街頭宣傳超筍找換服務-港幣1000換人民幣900-放蛇揭疑點重重-星島申訴王","summary":"近一年人民幣持續強勢，港幣兌人民幣的匯率不斷下跌。","summary_short":"近一年人民幣持續強勢，港幣兌人民幣的匯率不斷下跌。","digest":"近一年人民幣持續強勢，港幣兌人民幣的匯率不斷下跌","points":["近一年人民幣持續強勢，港幣兌人民幣的匯率不斷下跌","《星島申訴王》最近發現，有人在街頭張貼廣告街招，以超優惠匯率提供港幣兌人民幣服務","有大律師提醒市民，就算真的有人能提供超筍匯率的找換服務，亦要非常小心…"],"section":"內地","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:00:00+08:00","size":1,"keywords":[],"body":"近一年人民幣持續強勢，港幣兌人民幣的匯率不斷下跌。《星島申訴王》最近發現，有人在街頭張貼廣告街招，以超優惠匯率提供港幣兌人民幣服務。記者假扮有意換錢的客人查詢，發現伏味甚濃。有大律師提醒市民，就算真的有人能提供超筍匯率的找換服務，亦要非常小心，否則隨時有機會捲入洗黑錢案件。\n根據街招資料顯示，該找換服務是以支付寶或微信兌換，匯率為0.87至0.88，即港幣$1,000換到人民幣¥870至¥880；若經銀行卡收款，更可換到人民幣¥900。惟記者翻查資料，由10月16日至11月17日期間，港元兌人民幣匯率維持在0.8468至0.8537之間，即港幣$1,000只可換到人民幣¥846至¥853。由此可見，街招列出的匯率實在高得不正常。\n更多騙案報道：名牌寄賣店突關門 日籍東主失聯 苦主逾百 損失金額或逾2千萬\n匯率遠高於市場 要求提供個人資料伏味濃\n記者假裝有意兌換3萬元人民幣，發訊息聯絡對方，一位自稱姓李的男子回覆稱，匯率為0.88。李男相約記者在太子會面，表示會即場將3萬元人民幣，分別轉帳至記者的支付寶和微信戶口，記者確認收款後才付港幣現金也不遲。惟會面前夕，李男突然傳來一份表格，要求記者填寫姓名、年齡、電話和籍貫等個人資料；而另一名自稱李男同事的男子，隨後又致電記者，詳細詢問記者住址和工作地址。\n記者發訊息質問李姓男子，為何要提供個人資料，李男解釋說由於現時內地對於資金轉帳監管嚴密，擔心將3萬元人民幣轉到記者戶口後，他們的戶口會被封，所以索取記者個人資料，以免記者不認數。其後他們又慫恿記者以銀行戶口收款，並將匯率提高至0.91，但記者要立即提供戶口持有人名稱和戶口號碼。記者拒絕後，李男亦隨之失蹤，沒再回覆訊息。\n綜觀整個放蛇過程，對方聲稱能提供遠高於市價的兌換服務，本身已令人相當奇怪；雖然該自稱姓李的男子，表示能當面交收，並先把人民幣轉帳給記者才收錢，但最後一刻又突然要求索取詳盡個人資料、地址以至銀行戶口號碼，記者不落搭便玩失蹤，舉動相當可疑，不排除有人以換錢為藉口行騙，目的是索取他人個人資料作不法用途。\n大律師陸偉雄指出，任何人在香港經營貨幣兌換或匯款等業務，都要向海關申請「金錢服務經營者牌照」，如無牌經營貨幣兌換業務便屬違法，最高刑罰是罰款一百萬元和監禁兩年。他提醒市民，就算有人真的能提供匯率遠高於市場的找換服務，亦必須加倍小心，因資金可能是犯罪得益或來歷不明的「黑錢」，市民如果照樣交易，當「黑錢」存進自己戶口後，有可能被控洗黑錢罪名，收款戶口亦會被凍結，只會得不償失。\n另外，就對方要求提供個人資料方面，陸大狀說如果只是姓名和電話號碼，他認為是無可厚非，但如果連住址、工作地址以至銀行戶口號碼等也要提供，他就覺得不合常理。陸指出，收集過多的個人資料，不但違反私隱條例，而且資料一旦落在不法之徒手上，是很危險的事情，所以他建議市民遇到這情況時，要堅拒提供住址、工作地址以至銀行戶口號碼等個人資料。\n更多騙案報道：揭「佳寧案內幕」 扮股壇老行尊 「唱高散貨」騙局變招再現\n去年至今年10月 26人被控無牌貨幣兌換\n海關回覆《星島申訴王》查詢表示，根據《打擊洗錢及恐怖分子資金籌集條例》（《條例》），任何經營匯款及/或貨幣兌換服務人士，必須領有由海關關長發出的牌照。海關通過定期或突擊巡查，以檢視金錢服務經營者有否按牌照指引作業，包括妥善處理客戶款項及其他發牌規定等。如發現違反《條例》的情況，海關會採取適當的執法行動。違規者除受到刑事制裁外，還可能面對紀律及/或行政制裁。\n《條例》禁止無牌經營匯款或貨幣兌換，違者一經定罪，最高可被判罰款一百萬元及監禁兩年。\n海關指出，由去年1月至今年10月，共成功檢控26名無牌金錢服務經營者，當中1名涉案人士被判處監禁兩個月，緩刑12個月，為最高刑罰；而其餘涉案人士分別被判處罰款港幣$2,000至$24,000不等。\n近年香港發生過涉及找換的騙案，警方一直呼籲市民如需兌換外幣，應選用信譽良好的找換店或銀行。如有需要，可利用海關金錢服務經營者牌照系統，確認找換店是否持有相關牌照。如有懷疑，可致電『防騙易』諮詢熱線18222查詢。\n更多騙案報道：旅遊平台爆洩漏私隱疑雲？港人訂機票後即遇詐騙 行程全被掌握","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca6802e74fa","title":"河南省商丘市人大常委会原党组成员、副主任张团结被“双开”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734683.shtml","summary":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员、副主任张团结严重违纪违法问题进行了立案审查调查。","summary_short":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员…","digest":"据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员…","points":["中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准…","经查，张团结丧失理想信念，背弃初心使命，对抗组织审查","无视中央八项规定精神，收受可能影响公正执行公务的礼金、消费卡，违规配备使用公务用车"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:57:07+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员、副主任张团结严重违纪违法问题进行了立案审查调查。\n\n　　经查，张团结丧失理想信念，背弃初心使命，对抗组织审查；无视中央八项规定精神，收受可能影响公正执行公务的礼金、消费卡，违规配备使用公务用车；违背组织原则，在组织函询时不如实说明问题，利用职权为他人谋取人事利益并收受财物；廉洁底线失守，借用管理和服务对象的车辆，通过民间借贷获取大额回报，违规从事营利活动，利用职权为他人谋取利益并收受财物；不正确履行职责，造成不良影响；丧失纪法底线，大搞权钱交易，利用职务便利为他人在项目承揽、职务调整等方面谋取利益，非法收受巨额财物。\n\n　　张团结严重违反党的政治纪律、组织纪律、廉洁纪律、工作纪律和国家法律法规，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经河南省纪委常委会会议研究并报中共河南省委批准，决定给予张团结开除党籍处分；由河南省监委给予其开除公职处分；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c97060376e4","title":"习近平：大国良性互动不是选择题，而是必答题","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734714.shtml","summary":"新华社深圳11月19日电(记者冯歆然、梁旭)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"新华社深圳11月19日电(记者冯歆然、梁旭)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","points":["新华社深圳11月19日电(记者冯歆然、梁旭)11月19日下午…","习近平指出，当今世界早已不是彼此隔绝的孤岛","人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:43:00+08:00","size":1,"keywords":[],"body":"新华社深圳11月19日电(记者冯歆然、梁旭)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。\n\n　　习近平指出，当今世界早已不是彼此隔绝的孤岛。人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体。在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。近年来，中国推进中俄新时代全面战略协作伙伴关系，积极构建中美建设性战略稳定关系，推动形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。当前，世界百年变局加速演进，天下并不太平。风雨见担当。作为世界主要大国和联合国安理会常任理事国，中俄美应该当好表率，合作应对全球性挑战，共同维护世界和平稳定，为人类进步作出更大贡献。\n 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd82ab0d034","title":"中国成功发射实践二十四号卫星","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734524.shtml","summary":"中新社北京11月19日电 (记者 马帅莎)据中国航天科技集团消息，北京时间11月19日6时51分，中国在太原卫星发射中心使用长征二号丁运载火箭，成功将实践二十四号卫星发射升空，卫星顺利进入预定轨道…","summary_short":"中新社北京11月19日电 (记者 马帅莎)据中国航天科技集团消息，北京时间11月19日6时51分…","digest":"据中国航天科技集团消息，北京时间11月19日6时51分…","points":["11月19日，中国在太原卫星发射中心使用长征二号丁运载火箭，成功发射实践二十四号卫星","长征二号丁运载火箭是一型常温液体二级运载火箭，具有可靠性高、经济性好、适应性强等特点…","此次任务是长征系列运载火箭的第678次飞行"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:41:32+08:00","size":2,"keywords":[],"body":"中新社北京11月19日电 (记者 马帅莎)据中国航天科技集团消息，北京时间11月19日6时51分，中国在太原卫星发射中心使用长征二号丁运载火箭，成功将实践二十四号卫星发射升空，卫星顺利进入预定轨道，发射任务取得圆满成功。\n\n11月19日，中国在太原卫星发射中心使用长征二号丁运载火箭，成功发射实践二十四号卫星。王亚鹏 摄\n\n　　长征二号丁运载火箭是一型常温液体二级运载火箭，具有可靠性高、经济性好、适应性强等特点，支持单星、多星并联、串联、搭载等多种形式的发射需求，700公里太阳同步轨道运载能力为1.3吨。此次任务是长征系列运载火箭的第678次飞行。\n\n　　实践二十四号卫星由中国航天科技集团五院抓总研制。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"中国成功发射实践二十四号卫星","url":"https://www.chinanews.com.cn/gn/2026/11-19/1073 "source_display":"中新網 時政","published_at":"2026-11-19T16:25:55+08:00","size":1,"keywords":[],"body":"新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开。大会期间，来自全球70多个国家和地区的近600名代表，围绕“新格局、新华教、新发展”主题，总结华文教育发展成效和经验，聚焦新形势下华文教育的使命任务，共商未来发展大计。\n\n　　与会代表表示，海外华文教育作为海外侨胞自主创办的中华语言文化教育事业，长期以来在凝聚侨心侨力、传承中华文化和推动中外友好交流等方面发挥了重要作用。今年是“十五五”开局之年，中国的发展正站在新的历史起点上，华文教育发展迎来难得机遇和广阔空间。华文教育工作者应坚守教育初心，积极推进华文教育标准化、正规化、专业化、信息化建设，不断提高办学水平和质量，发挥融通中外的独特优势，讲好中国故事，促进中外民心相通和文明交流互鉴，让世界各国人民通过华文教育了解一个可信、可爱、可敬的中国，为构建人类命运共同体作出新的更大贡献。\n\n　　会前，中共中央政治局委员、中央统战部部长李干杰会见出席大会的全体代表并合影留念。 【编辑:吴青潞】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6f7f270d93","title":"中国人民对外友好协会会长杨万明访问尼泊尔","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734681.shtml","summary":"新华社加德满都11月19日电(记者张平)11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔，分别会见尼众议院议长阿亚尔、外交部长希西尔、加德满都大都市代理市长丹戈尔…","summary_short":"新华社加德满都11月19日电(记者张平)11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔…","digest":"11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔…","points":["双方表示，将认真落实两国领导人达成的重要共识，坚持中尼面向发展与繁荣的世代友好的战略合作伙伴…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:02:50+08:00","size":1,"keywords":[],"body":"新华社加德满都11月19日电(记者张平)11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔，分别会见尼众议院议长阿亚尔、外交部长希西尔、加德满都大都市代理市长丹戈尔、巴德岗市长普拉贾帕蒂等中央和地方政府、议会负责人，与尼中经贸协会主席阿努伯、阿尼哥协会主席苏希尔、尼中文化教育协会主席哈利仕等友好人士进行集体座谈会，就今年8月26日中尼边境发生严重泥石流灾害向尼方致以诚挚慰问，表示中国人民对外友好协会愿为尼方重建家园提供力所能及的支持。\n\n　　双方表示，将认真落实两国领导人达成的重要共识，坚持中尼面向发展与繁荣的世代友好的战略合作伙伴关系定位，不断深化两国地方、议会、民间、经贸、人文、旅游和青少年等领域友好交流合作。\n\n 【编辑:王琴】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf327122993","title":"广西与越南边境三省市法院深化合作 破解跨境司法难点","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734673.shtml","summary":"【东盟专线】广西与越南边境三省市法院深化合作 破解跨境司法难点  　　中新社广西崇左11月19日电 (林浩 魏素娟)2026年中国广西与越南高平、谅山、广宁三省市法院院长会晤研讨活动…","summary_short":"【东盟专线】广西与越南边境三省市法院深化合作 破解跨境司法难点  　　中新社广西崇左11月19日电 (林浩 魏素娟)20…","digest":"【东盟专线】广西与越南边境三省市法院深化合作 破解跨境司法难点  　　中新社广西崇左…","points":["中新社广西崇左11月19日电 (林浩 魏素娟)2026年中国广西与越南高平、谅山…","本次会晤围绕“数字时代下解决跨境民事和商业纠纷的合作”“进一步加强中越边境省份法官交流培训和…","中国最高人民法院国际合作局局长段农根在活动致辞中表示，当前，随着中越两国经贸…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:51:07+08:00","size":1,"keywords":[],"body":"【东盟专线】广西与越南边境三省市法院深化合作 破解跨境司法难点\n\n　　中新社广西崇左11月19日电 (林浩 魏素娟)2026年中国广西与越南高平、谅山、广宁三省市法院院长会晤研讨活动，18日至19日在中越边境广西崇左市举行。\n\n　　本次会晤围绕“数字时代下解决跨境民事和商业纠纷的合作”“进一步加强中越边境省份法官交流培训和建立常态化会晤机制”等议题，越南三省市法院院长以及中方与会代表展开深入交流，为两国边境地区司法合作贡献智慧和力量。\n\n11月19日，2026年中国广西与越南高平、谅山、广宁三省市法院院长会晤研讨活动在广西崇左市举行。林浩 摄\n\n　　中国最高人民法院国际合作局局长段农根在活动致辞中表示，当前，随着中越两国经贸、人文往来日益频繁，跨境民商事纠纷、新型网络犯罪等新情况新问题不断涌现，对跨境司法协作提出新的更高要求。中国最高人民法院支持广西法院与越南边境法院聚焦跨境民商事审判、纠纷联合调解、司法便民服务、涉外风险防控等重点领域，开展实质合作。精准对接口岸开放、边贸发展、跨境务工、跨境文旅等新业态新需求，破解跨境司法堵点难点。\n\n　　段农根倡议，中越边境法院完善合作机制，深化数字司法合作，探索在线调解、远程取证、电子送达等跨境司法服务新模式，让更多中越民众了解边境省份法院合作的实际成效。\n\n　　广西壮族自治区高级人民法院院长黄海龙表示，当前，中国—东盟自由贸易区3.0版即将生效实施，中越经贸合作和人员往来日益密切。作为中国边境省份，广西愿与越方加强司法交流合作，共同维护边境地区安宁稳定，促进经贸合作，增进民众福祉。\n\n　　越南谅山省人民法院院长丁玉勋对中方倡议表示认同。他认为，越中边境法院可以建立“年度轮值司法研讨会”机制，开展法官专题交流，确保法院裁判客观、公正，并得到有效执行。\n\n　　近年来，在中国最高人民法院指导下，广西法院相继与越南谅山、广宁等法院签署相关合作备忘录，在法官培训、案例研究、司法协助等方面开展合作。本次会晤活动的举办，标志着中越司法交流合作逐步迈向更深层次、更广领域。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c93c0385252","title":"（深圳APEC）深圳APEC：一场中国式现代化的“现场说明会”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734636.shtml","summary":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉  　　世界的目光正聚焦深圳“APEC时间”。","summary_short":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉  　　世界的目光…","digest":"题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉…","points":["作为亚太经合组织(APEC)“中国年”的三大优先领域，“开放、创新…","“看五十年的中国就来深圳”，中国国家主席习近平在APEC领导人非正式会议欢迎晚宴上这样介绍深…","APEC“中国年”启动以来，16座城市举办300多场会议和活动，各经济体代表累计参与逾万人次"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:36:08+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”\n\n　　中新社记者 王宗汉\n\n　　世界的目光正聚焦深圳“APEC时间”。\n\n　　作为亚太经合组织(APEC)“中国年”的三大优先领域，“开放、创新、合作”成为在深圳举行的领导人会议周的关键词。\n\n　　三个关键词，既回应亚太共同发展的现实课题，也与中国式现代化的发展追求高度契合——开放是鲜明标识，创新是第一动力，合作共赢是必然要求。\n\n　　“看五十年的中国就来深圳”，中国国家主席习近平在APEC领导人非正式会议欢迎晚宴上这样介绍深圳。深圳的发展实践，正是中国式现代化的生动缩影。深圳APEC会议，为世界读懂中国式现代化开了一场生动的“现场说明会”。\n\n11月15日，市民拍摄深圳华强北的APEC标识。中新社记者 张祥毅 摄\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“开放”。\n\n　　APEC“中国年”启动以来，16座城市举办300多场会议和活动，各经济体代表累计参与逾万人次。进入深圳会议周，全部21个APEC成员经济体的领导人、代表相聚于此，APEC工商领导人峰会吸引来自亚太及域外经济体的2000余位政商界代表参加。\n\n　　国际盛会，折射深圳与亚太的深度联系，也展现中国拥抱世界的开放姿态。\n\n　　近年来，从全面取消制造业领域外资准入限制，到扩大电信、医疗等服务业开放试点，再到海南自贸港全岛封关运作，中国以一系列务实举措持续扩大开放。APEC各经济体代表走进深圳前海合作区，感受中国开放的成果；工商界围绕区域贸易、数字经济等议题深入交流，让合作更进一步。\n\n　　从深圳深度融入全球市场，到APEC汇聚亚太各方，世界观察到，中国式现代化始终坚持敞开大门，与伙伴共拓发展空间。\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“创新”。\n\n　　加拿大总理卡尼这样评价深圳：“未来在这里设计，在这里测试，也在这里制造。”美国经济学家杰弗里·萨克斯则称深圳是中国创新的“标杆”。\n\n　　“APEC科技落地签”“AI上APEC”……诸多热点在这场盛会上出圈，让深圳的创新活力更加鲜活可感，也彰显了中国以科技创新推动现代化的蓬勃动能。\n\n　　近年来，从加大基础研究投入、支持前沿探索，到实施“人工智能+”行动、推动成果转化，中国以务实举措持续激发创新活力。2025年，中国研发经费投入稳居世界第二，全球创新指数排名首次跻身前十。\n\n　　从深圳科技产业蓬勃发展，到APEC共商亚太增长新动能，世界看到的不只是中国科技创新成果，更是中国式现代化坚持创新驱动、推动科技与产业深度融合的生动实践。\n\n11月18日，《2026年亚太经合组织工商领导人峰会深圳倡议》在深圳对外发布。　中新社记者 赵文宇 摄\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“合作”。\n\n　　深圳的发展离不开亚太市场，亚太的繁荣也离不开各经济体的密切协作。这座城市正是中国与亚太相互依存、彼此成就的缩影。\n\n　　作为东道主，中方与各方一道，聚焦深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣等达成诸多共识，也展现了中国与世界相互成就的广阔前景。\n\n　　近年来，从高质量共建“一带一路”，到深化区域产业链供应链协作，中国不断拓展互利共赢空间。中国已成为13个APEC经济体的最大贸易伙伴，2025年与APEC其他经济体进出口总额超过26万亿元人民币。\n\n　　从凝聚合作共识，到共绘繁荣蓝图，深圳的“APEC时间”，既是世界观察中国的窗口，也是中国与世界携手前行的生动见证。\n\n　　这次盛会再次证明，中国式现代化，不是独善其身的现代化，而是在开放中拥抱世界、在创新中共享机遇、在合作中彼此成就。中国与世界的故事，从不是单向的奔赴，而是相向而行、共同书写的未来。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c97454dc58d","title":"东西问丨中国AI赋能中小企业，对亚太其他经济体有何借鉴意义？","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734642.shtml","summary":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。","summary_short":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。","digest":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新…","points":["中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量","日前，在广州举行的第32次APEC中小企业部长会议…","9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:31:42+08:00","size":1,"keywords":[],"body":"中新社记者 许青青\n\n　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。日前，在广州举行的第32次APEC中小企业部长会议，正式倡议在广州设立“亚太人工智能赋能中小企业发展合作中心”、在深圳建设“亚太中小企业合作区”，标志着中国AI赋能中小企业发展，从国内实践走向区域协作。\n\n　　中国中小企业使用AI进展如何？中国在AI赋能中小企业方面有哪些经验可供借鉴？中山大学国家发展研究院副院长、中山大学岭南学院教授李兵近日接受中新社“东西问”专访，对此作出解读。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能体验中心观看机器人弹奏钢琴。　中新社记者 　陈楚红 摄\n\n　　中新社记者：AI对于一家中小企业本质上意味着什么？它将带来哪些改变？\n\n　　李兵：人工智能(AI)被认为是继蒸汽、电力、信息技术之后的又一次技术革命。经济学里把这一类技术叫作“通用目的技术”，它能渗透到经济生活的每一个角落，而且会越用越好。人工智能，就是最新一次这样的革命。\n\n　　AI对中小企业而言，既是挑战，更是机遇。\n\n　　过去，顶尖人才往往聚集在大企业，中小企业很难聘用到。而AI集成了大量人类智慧，且模型每次迭代都会吸收新的经验。所以某种程度上讲，中小企业现在借助AI，就相当于随时随地用到了这些顶尖智慧。这一点对中小企业最重要，“顶尖能力”变得便宜了。\n\n　　AI时代正滚滚而来，中小企业会加速分化：用好了，成长很快；没抓住、忽视了，就会被时代抛弃。\n\n　　中新社记者：中国中小企业运用AI提高生产效率，相对亚太区域其他经济体中小企业有哪些优势？\n\n　　李兵：根据中国信通院对中国6000多家中小企业的调查，已经有50%以上的企业用上了人工智能，还有约1/4计划在两年内使用。但结合我们自己调研的实际情况看，企业员工已在日常工作里使用，老板对此不一定知情。也就是说，中国至少有50%的中小企业正在使用AI。但真正把AI深度嵌入到业务流程里的，只有4%左右：企业清楚哪个流程该用什么AI，特定流程从头到尾都有AI参与，整体效率得到提升，但不等于全公司所有业务都已完全打通。\n\n　　要让AI真正发挥效用来、带动企业提效增长，还是要真正实现全公司端到端的全流程打通。此外，底层技术变了，组织机构必然跟着调整，目前来看还为时尚早，最终形式还需要企业在实践中探索。\n\n　　中国中小企业在利用AI方面，我认为主要有三方面优势：中国AI供给充足，很多国内大模型比美国同类产品便宜，而且好用；AI建立在移动互联网之上，中国有高速网络与稳定电力，基础设施优势明显；中国有完整产业体系与丰富应用场景，尤其粤港澳大湾区中小企业密集、创业热情高，只要找到一个场景把AI用起来，往往就能赚到钱。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾体验互动游戏。　中新社记者 　陈楚红 　摄\n\n　　中新社记者：广州花都通过AI产业园引入头部企业搭建公共AI服务平台，批量服务纺织、鞋服等传统中小企业，这种共享数字化服务模式的核心逻辑是什么？\n\n　　李兵：广州市花都区政府牵头，联合华为、中国信通院等共建的城市级工业人工智能中心“广州市花都区新型工业化数字服务平台”，集成了50P公共算力，提供工业互联网SaaS应用、AI工具及全链条数字化转型服务，带动声光电、化妆品、皮革皮具等重点产业产值同比增长，这一共享数字化服务模式已向多地推广。\n\n　　在花都项目里，华为主要为园区提供算力和大模型支撑，还整理、打包了各类成熟的应用场景案例；专门安排人员开展使用相关技术和工具的培训。此外，当地的客户资源与产业集群优势，也让产业园模式释放出更多红利。\n\n　　这种“政府搭台、大企业输出技术、中小企业共享服务”的共享数字化模式，把中小企业单独买不起、用不好的AI能力，变成一种公共品，按需取用、门槛极低，正是广东探索出来的典型路径。\n\n　　中新社记者：中国AI赋能中小企业的经验有哪些可以复制？对亚太区域发展中经济体有何借鉴意义？\n\n　　李兵：我的基本判断是：技术可以复制，但认知、能力与环境的鸿沟不会自动消弭。很多发展中国家不是没有技术，而是“不知道技术存在、不知道如何运用”，认知鸿沟比技术鸿沟更难消弭，这正是务实合作必须发力的方向。\n\n　　可以直接复制的有：\n\n　　公共赋能中心的机制。政府搭台、共享服务的逻辑，几乎所有经济体都可以做，只是规模大小不同。花都模式最值得复制的地方，不是具体的平台，而是“把固定成本公共化”这个机制。\n\n　　算力券、创新券这类补贴工具。这是降低企业使用门槛最直接的政策工具，对于很多经济体值得参考。\n\n　　开源大模型的路径。中国的AI大模型总体走开源路线，开源天然就是普惠的，是帮助全球中小企业跨越技术门槛最有价值的路径。\n\n　　“小快轻准”的轻量化产品。引导企业的产品在小型化、快速化、轻量化、精准化等维度持续深耕，把AI拆成中小企业用得起的模块，这种产品化思路可复制性很强。\n\n　　能力建设和培训机制。这是投入小、见效长的“基础工程”，也是消弭认知鸿沟最直接的手段。\n\n　　对亚太发展中经济体，我建议复制中国的“机制”而不是复制“模板”。把共享、普惠、借力的机制带回去，结合本地产业基础和制度条件重新设计。技术转移从来不是单向输出，而是供给方与应用方的双向奔赴。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能体验中心佩戴脑机接口设备控制汽车模型行驶。　中新社记者 　陈楚红 　摄\n\n　　中新社记者：对于正在犹豫要不要上AI的亚太中小企业主，您有何具体建议？\n\n　　李兵：我的建议主要有三条：\n\n　　第一，老板带头，全员用起来。老板自己不用AI、没有体感，员工下面在做什么你根本不知道，又怎么指挥？所以第一件事是自己上手。同时，给员工账号、给额度，鼓励大家用起来。\n\n　　第二，从小场景切入，借外力降低门槛。高频、重复、输入任务和输出成果都特别明确的流程，最适合先用AI，借助产业园、政府算力券先跑起来，把这部分效率提上来，再考虑其他环节。\n\n　　第三，用场景换技术，找高校合作。草根中小企业摸爬滚打在第一线，最清楚要做什么、怎么落地。高校懂技术却不了解高密度、真需求，两者结合起来，就能找到好的应用场景。\n\n　　对于还在观望的中小企业，我想说：中小企业不应该是AI的旁观者，而应该是AI赋能的主战场、生力军；谁先用会AI，谁就有机会拿下未来的市场。(完)\n\n　　受访者简介\n\n李兵。受访者供图\n\n　　李兵，中山大学岭南学院教授，博士生导师，中山大学国家发展研究院副院长，中山大学经济管理国家级实验教学示范中心副主任。主要研究方向是国际贸易、国际政治经济学、城市经济学等。教育部全国万名优秀创新创业导师人才库首批入库导师，首批国家知识产权局专利分析和预警专家库专家，中国技术经济学会知识产权分委会理事，中国国际经济关系学会理事，粤港澳高校质量联盟学术委员会委员，中国国土经济学会区域战略青年学者菁英会会员，广东省经济学会副秘书长。\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6b2f82c6cd","title":"和合共生｜APEC聊些啥？又是如何运转的？","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075457.shtml","summary":"","summary_short":"","digest":"和合共生｜APEC聊些啥？又是如何运转的？","points":[],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T16:13:02+08:00","size":3,"keywords":[],"body":"","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/8CE28DA1ECED445AB1CE648957D5FA1C.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"和合共生｜APEC聊些啥？又是如何运转的？","url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075457.shtml","source_display":"中新視頻","published_at":"2026-11-19T16:13:02+08:00","category":"內地","digest":"和合共生｜APEC聊些啥？又是如何运转的？"},{"title":"【和合共生】习言道｜推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734579.shtml","source_display":"中新網 時政","published_at":"2026-11-19T14:23:18+08:00","category":"內地","digest":"11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议…"},{"title":"【和合共生】习言道｜看千年的中国去西安，看五百年的中国去北京，看一百年的中国去上海，看五十年的中国来深圳","url":"https://www.chinanews.com/gn/shipin/2026/11-18/news1075411.shtml","source_display":"中新視頻","published_at":"2026-11-18T23:16:02+08:00","category":"兩岸","digest":"11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会…"}],"cross":{"total":3,"angles":[{"point":"和合共生｜APEC聊些啥？又是如何运转的？","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/2026/11-19/news1075457.shtml"},{"point":"11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会…","sources":["中新視頻"],"url":"https://www.chinanews.com/gn/shipin/2026/11-18/news1075411.shtml"},{"point":"11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734579.shtml"}]}},{"id":"cb56148cf85","title":"多位领导人在APEC工商领导人峰会上呼吁开放创新合作","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734639.shtml","summary":"新华社深圳11月18日电 题：多位领导人在APEC工商领导人峰会上呼吁开放创新合作  　　新华社记者  　　18日…","summary_short":"新华社深圳11月18日电 题：多位领导人在APEC工商领导人峰会上呼吁开放创新合作  　　新华社记者  　　18日…","digest":"题：多位领导人在APEC工商领导人峰会上呼吁开放创新合作  　　新华社记者  　　1…","points":["18日，多位亚太经合组织(APEC)成员经济体领导人在深圳出席APEC工商领导人峰会并致辞时…","普京说，俄方将继续同亚太经合组织其他成员经济体发展互利合作关系…","越共中央总书记、国家主席苏林表示，当今世界正经历快速而深刻的变化，各种挑战相互叠加"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:15:27+08:00","size":1,"keywords":[],"body":"新华社深圳11月18日电 题：多位领导人在APEC工商领导人峰会上呼吁开放创新合作\n\n　　新华社记者\n\n　　18日，多位亚太经合组织(APEC)成员经济体领导人在深圳出席APEC工商领导人峰会并致辞时，呼吁坚持开放、推动创新、加强合作，携手应对世界之变带来的共同挑战，打造亚太更加美好的未来。\n\n　　俄罗斯总统普京表示，亚洲的发展中经济体几十年间实现了巨大飞跃，逐步成为全球发展的引领者和创新火车头，对全球经济和世界秩序产生深远影响。“总体而言，亚太地区出现了重大变革，这些变革如今像波浪一样传导到全世界。一个更加公正、民主和平等的世界秩序体系正在确立。”\r\n\n　　普京说，俄方将继续同亚太经合组织其他成员经济体发展互利合作关系，并建议在亚太经合组织框架内加强基础设施互联互通等领域合作，以充分适应世界经济的发展变化。\n\n　　越共中央总书记、国家主席苏林表示，当今世界正经历快速而深刻的变化，各种挑战相互叠加。在这样的背景下，亚太经合组织对亚太地区未来发展具有更加重要的意义。\n\n　　苏林说，各方应推动建设开放的贸易和投资环境，为经济一体化注入新动力，同时培育新的增长动力，开拓新的发展空间。亚太经合组织应成为开放、建设性的对话平台，推动各方化解分歧、寻求务实方案。\n\n　　马来西亚总理安瓦尔表示，殖民与帝国主义时代早已过去。在当今时代，新兴经济体应当获得尊重与平等对待。亚太地区各国应自主把握发展道路，技术变革应真正服务于人类进步。\n\n　　“我们要推动贸易、商业与投资，恪守共同准则，尊重多边机制。”安瓦尔说，任何国家都不可能在孤立的情况下实现发展。亚太经合组织是地区各经济体合作的平台和载体。马来西亚希望同包括中国在内的各方携手合作，共同促进和平繁荣，让区域经济一体化成果更公平惠及各经济体人民。\n\n　　韩国总统李在明表示，以人工智能为代表的技术革命、气候变化和人口结构调整等正在彻底改变产业格局，各方需要寻找新的增长动力。当下最紧迫的任务，是扩大亚太经合组织区域内的贸易与投资，拓展新的增长机会。\n\n　　李在明说，亚太各方应当充分利用人工智能革命带来的红利，让创新惠及所有人。为了打造稳定的产业基础与供应链，各方必须深化合作。愿各方共同努力，“把亚太经合组织打造为收获更大繁荣的合作平台”。\n\n　　泰国总理阿努廷表示，开放让亚太地区成为世界经济增长引擎，贸易与投资将地区各经济体联系在一起。“1989年亚太经合组织成立之时，很少有人能预料到贸易和投资会给亚太地区带来如此巨大的改变。”他说，“如今，新一轮经济变革浪潮扑面而来。穿越变革风浪、实现更强发展，必须坚持区域开放，搭建互信纽带，凝聚集体韧性。”\n\n　　阿努廷说，世界正经历深刻变革，亚太经合组织也应顺势而变。亚太各经济体需要拓宽联通渠道，培育全新能力，稳定投资预期。挑战和机遇并存，各方在可再生能源、绿色转型、数字经济以及人工智能等领域拥有广阔合作前景。\n\n　　加拿大总理卡尼表示，当前国际合作进程遭遇阻碍，亚太经济体通过加强互联互通，在供应链、人工智能、能源及食品等领域深化合作，将能够有效降低可能的风险。“开放、创新、合作”对于促进整个亚太地区繁荣发展有着重要意义。\n\n　　卡尼说，亚太各经济体应当加强经贸、金融等领域合作，并且持续推动创新，特别是在推动清洁能源经济发展方面。中国在风能、太阳能和储能等领域处于全球领先地位，为推动清洁能源领域合作提供了巨大可能。\n\n　　澳大利亚总理阿尔巴尼斯表示，亚太经合组织多年来凝聚各经济体合作共识，以促进经济增长、减少贸易壁垒，并为区域内工商界等创造机遇。\n\n　　阿尔巴尼斯说，在当前技术变革浪潮中，各经济体无法单打独斗，需要携手开发并善用人工智能等新技术，共同应对风险和挑战。澳大利亚愿与亚太经合组织合作伙伴共同努力，抓住人工智能带来的机遇，促进地区繁荣。 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4fe11ad765","title":"30年首次！深圳前海发出的这份倡议，写了什么？","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734635.shtml","summary":"为期两天的2026年亚太经合组织工商领导人峰会昨天(18日)在深圳落下帷幕。","summary_short":"为期两天的2026年亚太经合组织工商领导人峰会昨天(18日)在深圳落下帷幕。","digest":"为期两天的2026年亚太经合组织工商领导人峰会昨天(18日)在深圳落下帷幕","points":["为期两天的2026年亚太经合组织工商领导人峰会昨天(18日)在深圳落下帷幕","这是APEC工商领导人峰会创办30年来首次以倡议形式发布成果文件","“倡议虽以峰会主席名义形成，但吸纳整合了APEC工商咨询理事会全年4次会议成果文件…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:13:41+08:00","size":1,"keywords":[],"body":"为期两天的2026年亚太经合组织工商领导人峰会昨天(18日)在深圳落下帷幕。这场峰会给出的答案，正凝结在一份沉甸甸的倡议之中。\n\n　　这是APEC工商领导人峰会创办30年来首次以倡议形式发布成果文件。《2026年亚太经合组织工商领导人峰会深圳倡议》，以构建亚太共同体的四大领域“开放包容、创新增长、互联互通、合作共赢”为骨架，系统吸纳整合了工商界的核心主张，面向领导人非正式会议建言献策。\n\n　　“倡议虽以峰会主席名义形成，但吸纳整合了APEC工商咨询理事会全年4次会议成果文件，有广泛的共识基础，代表了亚太工商界的共同立场。《深圳倡议》既积极献策，又积极承诺，展现信心决心，形成了可落地、可跟进的政策建议。”中国贸促会国际合作部副部长单明接受中国之声采访时说。\n\n　　开放是亚太合作的生命线\r\n\n　　《深圳倡议》第一部分聚焦“开放包容”，提出面对经济碎片化风险，共同营造开放型区域经济环境，是亚太经合组织各成员和亚太工商界的共同责任。\n\n　　这一主张并非空泛表态，而是直指当下工商界最迫切的现实关切。以亚太工商界大力呼吁推进的无纸化贸易为例，目前，亚太经合组织间很多贸易单证仍以纸质流转，一纸之隔，拖慢的是整个区域的通关效率与贸易成本。此次APEC工商咨询理事会(ABAC)区域经济一体化工作组主席安娜·柯曾女士就坦言，多年来，企业面临的压力是真实存在的，因此，ABAC声明中，第一条便是无纸化贸易。\n\n　　有测算显示，全面落地无纸化贸易模式可直接帮助区域内贸易成本降低约5.6%，对中小企业的减负效应尤为直接。《深圳倡议》提出，积极支持亚太自贸区建设，积极参与海关与商界对话，为无纸化贸易实施确定优先事项。中国商务部国际司司长陈超透露，APEC无纸贸易卓越中心已于2026年正式启动。\n\n　　创新是亚太经济腾飞的翅膀\n\n　　在本届APEC工商领导人峰会上，人工智能成为多场专题研讨和企业采访中的高频词。当前，亚太各经济体的AI发展水平参差不齐，现场的嘉宾们重点讨论了如何缩小区域智能发展鸿沟，让数字技术红利惠及更多经济体。\n\n　　“我们最近在江苏苏州的主要基地举行了大型供应商会议，邀请许多人工智能公司来合作，看看如何为我们全球范围内的产品来开发人工智能。因为我们真的很想在机器人、工厂自动化、流程优化这些方面好好利用中国的人工智能，我们想找到更好的工作方法。”参会代表、德国一家企业亚太区董事白迪森说。\n\n　　深圳倡议在第二部分“创新增长”中呼吁APEC构建负责任、安全可控、可互操作且激励创新的人工智能治理框架，推动人工智能开放包容、普惠向善发展；同时支持中小微企业使用人工智能，决心推动人工智能在清洁能源、制造、物流、气候适应、绿色金融等高价值场景应用。\n\n　　互联互通是区域经济一体化的重要基础\n\n　　亚太地区作为全球经济最活跃、贸易量最大的区域，实现内部的互联共通是发展的必然要求。\n\n　　“互联互通合作是近十余年来亚太区域合作各个成员参与程度最高、共识度最高的一个领域，取得很多实际成效。因为它涵盖硬件基础设施、人员跨境联动，还有机制和制度方面的互联互通，这对任何成员来说，都是能够获得收益的，也是我们2026年会议的目标成果之一。”中国APEC研究院院长刘晨阳说。\n\n　　《深圳倡议》第三部分“互联互通”呼吁APEC着眼未来十年发展需要，制定《亚太经合组织互联互通蓝图》升级版，加快建立绿色贸易规则框架，支持通过数字化和分阶段实施APEC开放天空政策议程，加强APEC商务旅行卡计划等。\n\n　　“联通不是一个抽象的概念，必须通过各个层级、各个方面的链接来实现，我们的目的是为APEC互联互通的中长期合作规划目标和举措，升级版蓝图以硬联通、软联通和心联通为基本构架。”2026年APEC高官会主席陈旭表示。\n\n　　合作共赢是亚太各经济体共同发展的根本方向\n\n　　唯有合作才能发展。深圳倡议第四部分“合作共赢”呼吁APEC推动能源转型，推进农业科技创新，加快医疗创新，支持健康老龄化，打造更有力支撑经济发展的健康劳动力队伍。同时，决心在农业技术、气候智慧农业和生物制造领域加大创新投资，开发适合中小微企业的可负担解决方案；加大对防灾减灾和低碳基础设施的投资，实现早期预警系统的互操作和安全的跨境数据共享。\n\n　　两天会期虽短，从深圳前海发出的这份倡议，承载的却是亚太工商界对开放合作的共同期待。而在这份期待背后，中国声音、中国方案清晰可辨。\n\n　　“中方代表在APEC工商咨询理事会实现工作组全覆盖，围绕绿色农业、零碳交通、海洋多能融合、跨境二维码支付、人工智能普惠及粤港澳大湾区合作等提出一系列高质量提案，相关成果已写入《深圳倡议》。我们期待，通过《深圳倡议》为推进亚太经济一体化、共创亚太光明未来作出更大贡献。”中国贸促会国际合作部副部长单明说。 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7e376f7cc6","title":"《獅子山下》深圳響起 APEC晚宴迎賓顯心思 交響樂團奏各地名曲你識幾多首？｜有片","url":"https://news.tvb.com/tc/1207220-獅子山下深圳響起APEC晚宴迎賓顯心思交響樂團奏各地名曲你識幾多首有片","summary":"國家主席習近平與夫人彭麗媛，昨晚在深圳為出席亞太經合組織APEC會議的領導人舉行歡迎宴會。中方在迎接各領導人進場時盡顯心思，安排深圳管弦樂團，演奏各地名曲。","summary_short":"國家主席習近平與夫人彭麗媛，昨晚在深圳為出席亞太經合組織APEC會議的領導人舉行歡迎宴會。","digest":"國家主席習近平與夫人彭麗媛…","points":["國家主席習近平與夫人彭麗媛，昨晚在深圳為出席亞太經合組織APEC會議的領導人舉行歡迎宴會","中方在迎接各領導人進場時盡顯心思，安排深圳管弦樂團，演奏各地名曲","其中美國總統特朗普進場時，樂團奏起美國愛國歌曲《美麗的美利堅》"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T13:38+08:00","size":1,"keywords":[],"body":"國家主席習近平與夫人彭麗媛，昨晚在深圳為出席亞太經合組織APEC會議的領導人舉行歡迎宴會。中方在迎接各領導人進場時盡顯心思，安排深圳管弦樂團，演奏各地名曲。各位領導人進場時，顯得相當受落。\n\n其中美國總統特朗普進場時，樂團奏起美國愛國歌曲《美麗的美利堅》。特朗普特地停步欣賞，並向樂團鼓掌致意，還站在樂團前面，讓媒體拍照。樂團在俄羅斯總統普京進場時則奏起《俄羅斯舞曲》。此曲來自俄羅斯作曲家柴可夫斯基創作的經典芭蕾舞劇《胡桃夾子》，普京聽後亦面露微笑。\n\n至於日本首相高市早苗進場時，樂團奏起1960年代名曲《Sukiyaki》。此曲原名為《上を向いて歩こう》，中文翻譯為《昂首向前走》，由日本已故男歌手坂本九原唱。由於歌曲誕生之時，日本正值爆發反對修訂《日美安全保障條約》。有分析指，雖然曲中並無明顯反戰意味，但中方選擇在高市進場時演奏此曲，可謂別具心思。\n\n對於香港讀者而言，行政長官李家超進場時，樂團奏起《獅子山下》，相信不少人也有共鳴。","image":"https://pro-vod-cdn.tvb.com/e6ee15e79edb4221935992c03d947568/snapshots/4fe096a2b36d4d1e8e67abe9befdf67c-00008.jpg","video":"https://pro-vod-cdn.tvb.com/e6ee15e79edb4221935992c03d947568/45c9b8f6539445abaa877fb3d88d0d01-ed0d55d43db5436a2a2a2f0f5c3e2141-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e6ee15e79edb4221935992c03d947568/snapshots/4fe096a2b36d4d1e8e67abe9befdf67c-00008.jpg","lang":"zh-Hant"},{"id":"c7f9fbf6a30","title":"新华图讯｜习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734754.shtml","summary":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","points":["11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤","编辑：侯俊 毕晓洋 郝昭 卢烨 翟一凡"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:26:42+08:00","size":2,"keywords":[],"body":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。\n\n　　记者：谢环驰 申宏\n\n　　编辑：侯俊 毕晓洋 郝昭 卢烨 翟一凡\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"新华图讯｜习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734754.shtml","source_display":"中國新聞網","published_at":"2026-11-19T17:26:42+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"},{"title":"习近平主持中俄美元首会晤","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734710.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:34:33+08:00","category":"內地","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…"}]},{"id":"cc5fd716d5f","title":"“来了就是深圳人！”美国网红博主晨跑深圳街头点赞城市魅力","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734529.shtml","summary":"“来了就是深圳人！","summary_short":"“来了就是深圳人！","digest":"“来了就是深圳人！”美国网红博主晨跑深圳街头点赞城市魅力","points":["11月18日清晨，美国网红博主赛瑞斯·詹森(Cyrus Janssen…","在他看来，这句话充分体现了深圳这座城市的魅力","深圳和APEC2026的热度实在太高了"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:45:09+08:00","size":1,"keywords":[],"body":"“来了就是深圳人！”\n\n　　11月18日清晨，美国网红博主赛瑞斯·詹森(Cyrus Janssen，中文名“王德中”)在深圳街头用中文读出了这句城市宣传语。在他看来，这句话充分体现了深圳这座城市的魅力。\n\n　　他在社交媒体上写道：\n\n　　深圳和APEC2026的热度实在太高了！今天早晨跑步时，我在路边看到了这样一块标语牌：\n\n　　来了就是深圳人！\n\n　　一旦来到这里，你就永远是深圳人！\n\n　　这是一句非常棒的城市口号，也充分体现了深圳的独特魅力。\n\n　　这座城市的人口平均年龄只有31.5岁(官方数据为32.5岁)。来自中国各地乃至世界各地的人们汇聚于此，充分利用这里全球最完善的供应链体系和科技产业生态。\n\n　　全世界都在关注深圳。很高兴本周能够来到这里，参加这场令人瞩目的盛会！\n\n图片来源：社交媒体截图\n\n　　作者：苏婧欣\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2178fb50d8","title":"苏黔中华职教社及职业院校东西部协作共建签约仪式在贵阳举行","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734526.shtml","summary":"中新网贵阳11月19日电 (记者 杨茜)苏黔中华职业教育社和职业院校东西部协作共建签约仪式18日在贵州省贵阳市举行。","summary_short":"中新网贵阳11月19日电 (记者 杨茜)苏黔中华职业教育社和职业院校东西部协作共建签约仪式18日在贵州省贵阳市举行。","digest":"苏黔中华职业教育社和职业院校东西部协作共建签约仪式18日在贵州省贵阳市举行","points":["中新网贵阳11月19日电 (记者 杨茜)苏黔中华职业教育社和职业院校东西部协作共建签约仪式1…","苏黔两地职教社、职业院校共达成六组结对合作，以职业教育为纽带深化山海协作…","本次签约中，南京市、淮安市、无锡市中华职教社，分别与贵阳市、安顺市…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:42:04+08:00","size":1,"keywords":[],"body":"中新网贵阳11月19日电 (记者 杨茜)苏黔中华职业教育社和职业院校东西部协作共建签约仪式18日在贵州省贵阳市举行。苏黔两地职教社、职业院校共达成六组结对合作，以职业教育为纽带深化山海协作，落实东西部协作部署，携手共育高素质技术技能人才。\n\n图为签约仪式现场。杨茜 摄\n\n　　本次签约中，南京市、淮安市、无锡市中华职教社，分别与贵阳市、安顺市、黔西南州中华职教社结成三对市社协作对子；常州信息职业技术大学、徐州工业职业技术学院、江苏农林职业技术学院，分别与贵州电子信息职业技术学院、毕节工业职业技术学院、黔西南职业技术学院开展校校共建，合作覆盖电子信息、工业制造、现代农业重点产业领域。\n\n　　江苏是近代职业教育发祥地，职教发展水平位居全国前列；贵州正加速从人口大省向人才大省转变，产业升级对技术技能人才需求旺盛。\n\n　　贵州省政协副主席、农工党省委主委、省中华职教社主任张光奇表示，苏黔职教合作从过去点对点帮扶升级为双向赋能的共建模式。期待双方推进订单式人才培养、共建专业课程标准、搭建产教融合实训平台，培育更多“土专家”“田秀才”，把合作打造成东西部协作、统一战线服务高质量发展的示范工程。\n\n　　江苏省委统战部副部长、省中华职教社副主任姜东表示，此次结对重在打造示范样板，务求合作落地见效。江苏方面将发挥产业、企业资源优势，在人才双向流动、学生实习就业、专业共建、产教融合上做实文章，同时邀请贵州职教界赴江苏回访交流，推动合作经验辐射更多地市与院校。\n\n　　苏黔协作根基深厚，多年来江苏持续在人才、产业、教育等领域帮扶贵州。此次签约之后，两地将推动实现人才共育有温度、专业共建有精度、产教融合有深度，把统一战线制度优势转化为职业教育发展效能，为巩固拓展脱贫攻坚成果、助力乡村全面振兴、服务两省高质量发展注入职教力量。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c668b0b194c","title":"中俄美元首會晤．現場｜習近平、普京、特朗普會談期間拍攝合照","url":"https://news.tvb.com/tc/1207264-中俄美元首會晤現場習近平普京特朗普會談期間拍攝合照","summary":"國家主席習近平、俄羅斯總統普京、美國總統特朗普，在深圳舉行歷史性三方會談期間，拍攝合照。","summary_short":"國家主席習近平、俄羅斯總統普京、美國總統特朗普，在深圳舉行歷史性三方會談期間，拍攝合照。","digest":"國家主席習近平、俄羅斯總統普京、美國總統特朗普，在深圳舉行歷史性三方會談期間…","points":["國家主席習近平、俄羅斯總統普京、美國總統特朗普，在深圳舉行歷史性三方會談期間，拍攝合照"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T16:51+08:00","size":2,"keywords":[],"body":"國家主席習近平、俄羅斯總統普京、美國總統特朗普，在深圳舉行歷史性三方會談期間，拍攝合照。","image":"https://pro-vod-cdn.tvb.com/6d1a4b6786e241e3a5204b96ce99bfd2/snapshots/4cafb40e48094b0e824682d60464530b-00003.jpg","video":"https://pro-vod-cdn.tvb.com/6d1a4b6786e241e3a5204b96ce99bfd2/2ab47ff597474ee0bbf163f26be46796-8acf96a2892bc75d314f91f5f30b7b3a-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/6d1a4b6786e241e3a5204b96ce99bfd2/snapshots/4cafb40e48094b0e824682d60464530b-00003.jpg","lang":"zh-Hant","items":[{"title":"中俄美元首會晤．現場｜習近平、普京、特朗普會談期間拍攝合照","url":"https://news.tvb.com/tc/1207264-中俄美元首會晤現場習近平普京特朗普會談期間拍攝合照","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T16:51+08:00","category":"兩岸","digest":"國家主席習近平、俄羅斯總統普京、美國總統特朗普，在深圳舉行歷史性三方會談期間…"},{"title":"中俄美元首會晤‧現場｜習近平：大國肩負特殊責任 中俄美積極互動是必選項｜附全文","url":"https://news.tvb.com/tc/1207263-中俄美元首會晤現場習近平大國肩負特殊責任中俄美積極互動是必選項附全文","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T16:30+08:00","category":"兩岸","digest":"中俄美元首在深圳會晤，國家主席習近平首先發言，表示在這個地球村，大國肩負特殊責任…"}],"cross":{"total":2,"angles":[{"point":"國家主席習近平、俄羅斯總統普京、美國總統特朗普，在深圳舉行歷史性三方會談期間…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207264-中俄美元首會晤現場習近平普京特朗普會談期間拍攝合照"},{"point":"中俄美元首在深圳會晤，國家主席習近平首先發言，表示在這個地球村，大國肩負特殊責任…","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207263-中俄美元首會晤現場習近平大國肩負特殊責任中俄美積極互動是必選項附全文"}]}},{"id":"c3e148f65e2","title":"联合国前副秘书长索尔海姆：中国清洁能源发展让各国走向繁荣与绿色","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734517.shtml","summary":"中新网成都11月19日电 (王利文)“中国将太阳能、风能及储能成本大幅压低，使各国第一次可以同时走向繁荣和绿色。","summary_short":"中新网成都11月19日电 (王利文)“中国将太阳能、风能及储能成本大幅压低，使各国第一次可以同时走向繁荣和绿色。","digest":"“中国将太阳能、风能及储能成本大幅压低，使各国第一次可以同时走向繁荣和绿色","points":["中新网成都11月19日电 (王利文)“中国将太阳能、风能及储能成本大幅压低…","”联合国前副秘书长兼环境规划署执行主任、欧盟亚洲中心联合主席埃里克·索尔海姆在成都如是说","11月17日，四川成都，出席2026第九届国际光伏与储能产业大会的埃里克·索尔海姆"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:26:40+08:00","size":1,"keywords":[],"body":"中新网成都11月19日电 (王利文)“中国将太阳能、风能及储能成本大幅压低，使各国第一次可以同时走向繁荣和绿色。”联合国前副秘书长兼环境规划署执行主任、欧盟亚洲中心联合主席埃里克·索尔海姆在成都如是说。\n\n11月17日，四川成都，出席2026第九届国际光伏与储能产业大会的埃里克·索尔海姆。何美锟 摄\n\n　　11月17日至20日，2026第九届国际光伏与储能产业大会在成都举办，来自海内外的光伏和储能产业领军人物、专家学者汇聚一堂，共话全球光储产业发展新未来。\n\n　　索尔海姆1984年首次到访中国。他观察到，中国近年来在生态环境治理上取得显著进展。在他看来，“绿水青山就是金山银山”，这一理念正转化为现实的经济逻辑。\n\n　　谈及清洁能源成本，索尔海姆表示，约15年前，几乎没有人想到太阳能价格会下降90%，风能与储能电池价格也以类似速度下降。过去，一个国家走向繁荣似乎只有化石能源一条路，如今各国可以同时实现繁荣与绿色。在他看来，可再生能源同时回应三个问题：保护地球、保障各国能源安全、创造本地就业。\n\n　　“21世纪将是光伏主导的世纪。”对于光伏与储能在能源转型中的作用，索尔海姆举例道，太阳能兼具灵活性，既可安装在非洲小屋屋顶供孩童读书照明，也可在青海、新疆铺展成大型“光伏海洋”。在巴基斯坦，居民在屋顶安装太阳能板获取廉价电力；在印度，一些用户以太阳能替代柴油，能源支出明显下降。即便组件从中国进口，安装、并网、能效管理仍主要带动当地岗位。\n\n　　谈到共建“一带一路”，索尔海姆称，“这是当今世界最重要的发展与投资倡议”。他列举肯尼亚蒙内铁路(蒙巴萨至内罗毕)、埃塞俄比亚至吉布提铁路(亚的斯亚贝巴至吉布提)等项目，认为这些通道对当地经济发展至关重要，共建“一带一路”绿色属性进一步凸显。\n\n　　对于应对气候变化，索尔海姆表示，印度尼西亚山火、欧洲今夏热浪等一再提示风险正在加剧。他认为，最有效的应对之道是把气候行动变成商业机会，让国家和企业通过绿色转型获利，才能推动技术规模化。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb79b2e4993","title":"习近平：携手搭建亚太共同体的“四梁八柱”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734519.shtml","summary":"新华社深圳11月19日电(记者邵艺博、熊嘉艺)11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话，强调亚太各方要携手搭建亚太共同体的“四梁八柱”。","summary_short":"新华社深圳11月19日电(记者邵艺博、熊嘉艺)11月19日上午…","digest":"11月19日上午…","points":["新华社深圳11月19日电(记者邵艺博、熊嘉艺)11月19日上午…","习近平指出，中国是亚太经济合作的倡导者、推动者、先行者","中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:25:05+08:00","size":1,"keywords":[],"body":"新华社深圳11月19日电(记者邵艺博、熊嘉艺)11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话，强调亚太各方要携手搭建亚太共同体的“四梁八柱”。\n\n　　习近平指出，中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n\n　　一是强化经贸支柱。推动区域经贸协定对接，围绕亚太自贸区加强政策对话，提高各方参与高水平经贸安排的能力。\n\n　　二是升级联通支柱。巩固“硬联通”，完善基础设施网络；增强“软联通”，促进政策和监管协调；密切“心联通”，促进人文交流和民众相知相亲。\n\n　　三是打造创新支柱。加强数字基础设施建设，完善区域数据治理和协同合作，打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n\n　　四是夯实发展支柱。推动区域能源和粮食安全合作，深化跨境腐败治理，加大自然资源合理利用和保护，实现经济可持续增长。 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf74d6eda55","title":"习近平谈建设亚太共同体","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734518.shtml","summary":"新华社深圳11月19日电(记者马卓言、钟焯)11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话。","summary_short":"新华社深圳11月19日电(记者马卓言、钟焯)11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式…","digest":"11月19日上午…","points":["新华社深圳11月19日电(记者马卓言、钟焯)11月19日上午…","习近平指出，当前，世界百年变局加速演进，科技创新和产业创新方兴未艾","面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:24:55+08:00","size":1,"keywords":[],"body":"新华社深圳11月19日电(记者马卓言、钟焯)11月19日上午，国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话。\n\n　　习近平指出，当前，世界百年变局加速演进，科技创新和产业创新方兴未艾。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　建设亚太共同体，要坚持和衷共济。浩瀚的太平洋承载千帆、滋养万物，造就了亚太地区兼收并蓄、和合共生的磅礴气象。亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，持续培育共同体意识。\n\n　　建设亚太共同体，要坚持开放融通。开放合作是亚太发展振兴的必由之路。要秉持开放的区域主义，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局。倡导自由开放的贸易和投资，为亚太经济增长开拓更广阔空间。\n\n　　建设亚太共同体，要坚持开拓创新。创新是引领发展的第一动力。要鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境。放大亚太经合组织孵化器作用，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。\n\n　　建设亚太共同体，要坚持包容发展。亚太经济体多样性突出，发展诉求各异。要因势利导推进合作，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c17f8c56acd","title":"第二届空间科学青年科学家国际论坛在塞浦路斯举行","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734516.shtml","summary":"中新网北京11月19日电 (记者 孙自法)记者从中国空间科学学会获悉，第二届空间科学青年科学家国际论坛11月17日至19日在塞浦路斯首都尼科西亚举行。","summary_short":"中新网北京11月19日电 (记者 孙自法)记者从中国空间科学学会获悉…","digest":"记者从中国空间科学学会获悉…","points":["中新网北京11月19日电 (记者 孙自法)记者从中国空间科学学会获悉…","来自中国、美国、法国、德国、意大利、芬兰、希腊、匈牙利、塞浦路斯、印度…","论坛开幕式环节，塞浦路斯空间探索组织(CSEO)主席乔治·达诺斯(George DANOS)…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:22:43+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 孙自法)记者从中国空间科学学会获悉，第二届空间科学青年科学家国际论坛11月17日至19日在塞浦路斯首都尼科西亚举行。来自中国、美国、法国、德国、意大利、芬兰、希腊、匈牙利、塞浦路斯、印度、马来西亚等11个国家40余位专家学者和青年科研人员参会，围绕日球层物理和空间地球科学主题开展深入研讨，推动空间科学领域国际合作。\n\n乔治·达诺斯主持论坛开幕式并致辞。中国空间科学学会 供图\n\n　　论坛开幕式环节，塞浦路斯空间探索组织(CSEO)主席乔治·达诺斯(George DANOS)、中国空间科学学会(CSSR)名誉理事长吴季研究员、国际空间研究委员会(COSPAR)秘书长让-克劳德·沃姆斯(Jean-Claude WORMS)代表主办方致辞。\n\n　　乔治·达诺斯认为，太空已成为关乎人类未来发展最为重要的领域之一。当今世界正面临着气候变化、人工智能等全球性挑战。为应对这些共同挑战，开展空间领域国际合作尤为关键。\n\n吴季致辞。中国空间科学学会 供图\n\n　　吴季指出，空间科学是当代自然科学的前沿领域，不断拓展人类的知识疆域。当前，科技全球化深入发展，在空间科学领域开展国际合作，已成为不可阻挡的发展趋势。他期待空间科学领域青年科学家基于本次论坛搭建的学术交流平台，增进理解、建立信任和联系，同时通过与资深专家的对话交流，未来成长为引领学科发展的领军人才。\n\n　　让-克劳德·沃姆斯表示，国际空间研究委员会成立之初，致力于为冷战期间东西方阵营之间的沟通和合作搭建桥梁。本次论坛由塞浦路斯空间探索组织、中国空间科学学会和国际空间研究委员会共同主办，希望促进处于职业早期的空间科学领域青年科学家的交流合作，为未来开展空间科学国际合作奠定基础。\n\n让-克劳德·沃姆斯致辞。中国空间科学学会 供图\n\n　　主旨报告环节，匈牙利航天员久洛·切雷尼(Gyula Cerényi)、吴季研究员、雅典国立卡波季斯特里安大学科斯塔斯·瓦罗佐斯(Costas Varotsos)教授、中国科学院国家空间科学中心施建成研究员、国际空间研究委员会能力建设专家咨询组组长胡安·卡洛斯·加布里埃尔(Juan Carlos Gabriel)博士、南京大学陈鹏飞教授、欧洲空间局计划科学家菲利普·埃斯库贝(Philippe Escoubet)、美国国家航空航天局戈达德航天飞行中心拉里·凯普科(Larry Kepko)教授等8位专家学者应邀作报告，分别就“匈牙利进入太空计划”“中国鸿蒙计划”“从轨道视角洞察地球系统”“中国西藏水循环研究”“关于国际空间研究委员会能力建设的新思考”“太阳爆发关键科学问题”“中欧微笑(SMILE)任务的科学运行”“日球层物理的研究历史、现状和未来”等议题进行分享交流。\n\n　　专题论坛环节，来自日球层物理和空间地球科学领域的青年科学家，通过学术报告深入交流和讨论领域内科学前沿热点、卫星任务取得的最新研究成果等，并对未来开展国际合作进行探讨。\n\n　　随后，青年科学家代表还通过“与专家面对面”环节等，同领域内资深专家进行面对面交流，学习和探讨科研方法，提升学术素养。\n\n　　据悉，空间科学青年科学家国际论坛由中国空间科学学会发起，旨在为全球空间科学领域青年科技人员建立沟通交流平台，增进彼此理解、信任和友谊，密切相互联系，为未来开展联合研究等合作奠定基础。2024年10月，第一届论坛在中国澳门举办。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8cd5537f49","title":"台企扎根“医疗特区”：海南自贸港政策有吸引力","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734506.shtml","summary":"中新网海南琼海11月19日电 题：台企扎根“医疗特区”：海南自贸港政策有吸引力  　　中新网记者 符宇群  　　“我们企业发展最大的优势…","summary_short":"中新网海南琼海11月19日电 题：台企扎根“医疗特区”：海南自贸港政策有吸引力  　　中新网记者 符宇群  　　“我们企…","digest":"题：台企扎根“医疗特区”：海南自贸港政策有吸引力  　　中新网记者 符宇群  　　“…","points":["“我们企业发展最大的优势，就是海南博鳌乐城国际医疗旅游先行区(简称“乐城先行区”)的先行先试…","”颖奕国际医疗中心院长韩海玲向前来参访的海外华文媒体人士如是说","11月18日，来自17个国家的20家海外华文媒体走进乐城先行区…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:07:26+08:00","size":1,"keywords":[],"body":"中新网海南琼海11月19日电 题：台企扎根“医疗特区”：海南自贸港政策有吸引力\n\n　　中新网记者 符宇群\n\n　　“我们企业发展最大的优势，就是海南博鳌乐城国际医疗旅游先行区(简称“乐城先行区”)的先行先试医疗特许政策。”颖奕国际医疗中心院长韩海玲向前来参访的海外华文媒体人士如是说。\n\n　　11月18日，来自17个国家的20家海外华文媒体走进乐城先行区，探访扎根于此的这家台资医疗机构，近距离感受自贸港政策叠加之下国际医疗健康产业开放发展的活力。\n\n11月18日，海外华文媒体走进海南博鳌乐城国际医疗旅游先行区内的颖奕国际医疗中心参访。　中新网记者 骆云飞 摄\n\n　　韩海玲告诉中新网记者，颖奕国际医疗中心去年接待国际医疗服务案例约157例，今年来境外客户线上咨询、线下就诊总量增长两三倍。“境外就诊人群以运动损伤患者居多，不少海外患者专程前来体验针灸、中医膏方、中药饮片等中医特色疗法。”\n\n　　国际医疗旅游业务的增长，直观印证海南自贸港政策的吸引力。官方数据显示，今年前8个月，乐城先行区累计接待医疗旅游79.13万人次，同比增长近一倍，国际医疗旅游吸引力持续释放。\n\n　　“乐城先行区的特许医疗、特许经营、特许研究、特许国际交流等4个特许政策支持，叠加海南自贸港政策，对东南亚、欧美客户吸引力突出。”韩海玲说。\n\n　　诸多“高含金量”政策加持下，乐城先行区作为中国唯一“医疗特区”，已成为国际创新药械进入中国的门户。目前，该园区汇聚40多家国内外高水平医疗机构，初步形成肿瘤、心脑血管、眼科等优势学科群；依托特许药械政策红利，引进境外上市创新药械及特殊食品超590种，累计惠及患者超34万人次。\n\n图为海外华文媒体代表参观颖奕国际医疗中心。　中新网记者 骆云飞 摄\n\n　　封关以来，海南自贸港政策红利持续释放。韩海玲表示，企业主动面向国际市场拓展业务，海外尖端医师、前沿技术落地速度明显加快；同时，海南自贸港税惠政策落地，企业运营成本得到控制，最终惠及就诊客户。\n\n　　对于颖奕国际医疗中心而言，海南自贸港外籍医师执业便利政策，助力引进美国、新加坡骨科医生；30天免签政策，则支撑起“旅游+康养+治疗”的闭环服务。\n\n　　“海外华侨华人社群对国际化、高质量医疗康养需求旺盛。”加拿大搜罗传媒副总经理唐明涛认为，乐城先行区的制度创新、国际合作实践，有助于吸引更多人前来体验国际医疗旅游服务。\n\n　　“颖奕国际医疗中心落户乐城，正是看好这里的政策环境。”在荷兰《中荷商报》特派记者姚卫民看来，颖奕国际医疗中心的成长，也是台胞台企抢抓自贸港机遇、深耕海南大健康赛道的缩影。“随着琼台交流持续深化，越来越多台资健康项目将依托这扇开放窗口，连接两岸、联通世界。”(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc708c00739","title":"“亚太是我们共同发展的天地”——习近平主席出席亚太经合组织工商领导人峰会开幕式并发表主旨演讲侧记","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734494.shtml","summary":"“让我们携起手来，以开放纾发展之困，以创新聚增长之势，以合作谋共享之福，建设亚太共同体，共创亚太光明未来！","summary_short":"“让我们携起手来，以开放纾发展之困，以创新聚增长之势，以合作谋共享之福，建设亚太共同体，共创亚太光明未来！","digest":"“让我们携起手来，以开放纾发展之困，以创新聚增长之势，以合作谋共享之福…","points":["“让我们携起手来，以开放纾发展之困，以创新聚增长之势，以合作谋共享之福，建设亚太共同体…","这是深圳前海特区馆广场上的“鹏翔碧浪”主题景观(2026年11月5日摄)","11月18日，2026年亚太经合组织工商领导人峰会在这里举行…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T10:05:56+08:00","size":1,"keywords":[],"body":"“让我们携起手来，以开放纾发展之困，以创新聚增长之势，以合作谋共享之福，建设亚太共同体，共创亚太光明未来！”\n\n这是深圳前海特区馆广场上的“鹏翔碧浪”主题景观(2026年11月5日摄)。新华社记者 梁旭 摄\n\n　　南海之滨，深圳前海国际会议中心。“鹏翔碧浪”主题景观如锦铺展，“共促繁荣 共赢未来”的金色大字熠熠生辉，映衬又一个历史性时刻——\n\n　　11月18日，2026年亚太经合组织工商领导人峰会在这里举行，习近平主席出席开幕式并发表主旨演讲，为新形势下亚太合作指引前进方向。\n\n　　这是中国继2001年在上海、2014年在北京之后，第三次以亚太经合组织(APEC)东道主身份主办工商领导人峰会。\n\n2026年11月18日上午，2026年亚太经合组织工商领导人峰会开幕式在深圳举行。这是记者在现场采访。新华社记者 李响 摄\n\n　　从黄浦江畔，到燕山脚下，再到南海之滨，作为亚太合作的坚定支持者、积极参与者、重要引领者，中国早已深度融入亚太、融入世界，成为世界经济增长的重要引擎和稳定力量。\n\n　　从去年韩国庆州到今年中国深圳，接棒东道主的近400个日夜里，从主题设置到盛会筹备，中国携手其他APEC成员经济体，共商亚太经济新图景、合作新机遇。\n\n　　此时此刻，世界聚焦亚太，亚太瞩望中国。\n\n这是深圳前海国际会议中心外的“共促繁荣 共赢未来”景观(2026年11月18日摄)。新华社记者 梁旭 摄\n\n　　灯光璀璨、镜头频闪，来自世界各地的媒体定格下这一重要时刻——上午9点50分，前海国际会议中心一层大厅内，习近平主席同与会亚太工商界代表等合影留念。\n\n　　他们身后的蓝色背景板上，是“2026年亚太经合组织工商领导人峰会”中英文字样和APEC“中国年”会标，21根交织的羽翼宛如大鹏展翅，寓意21个经济体乘大势、共翱翔。\n\n这是深圳莲花山公园的巨型APEC主题花坛(2026年10月17日摄)。新华社记者 梁旭 摄\n\n　　回首过往，每至亚太发展的关键时刻，一项项中国方案直面区域发展挑战，彰显大国领袖引领亚太合作、践行多边主义的远见与担当。\n\n　　面向未来，亚太经合组织如何推动建设亚太共同体，亚太能否继续当好推动经济全球化的火车头，中国声音备受关注。\n\n　　上午10时整，会议中心二层主会场内，随着恢宏的《和平—命运共同体》乐曲声响起，全场嘉宾起立，热烈鼓掌，习近平主席阔步走上讲台，发表题为《坚定信心，勇毅前行 共创亚太光明未来》的主旨演讲。\n\n　　“欢迎亚太工商界的朋友们！很高兴同大家在深圳见面。”情真意切的问候，让与会中外嘉宾如沐春风。\n\n在深圳前海，楼宇屏幕滚动播放APEC主题的宣传海报(2026年11月3日摄)。新华社记者 毛思倩 摄\n\n　　此次峰会的举办地深圳，在习近平主席的心中独具分量。\n\n　　2012年党的十八大后首次离京考察便来到深圳前海，2018年改革开放40周年之际再赴深圳，2020年出席深圳经济特区建立40周年庆祝大会……足迹所至、殷殷嘱托，向世界传递将改革开放进行到底的坚定决心。\n\n　　此次赴深圳出席会议前夕，习近平总书记到广东中山考察。在深中通道西人工岛上凭栏远眺，西边深中大桥车流如织，东南边深圳前海的城市天际线蔚为大观。\n\n　　“40多年来，深圳在中国改革开放春潮中勇立潮头、奋发进取，实现了从边陲小镇到国际化大都市的历史性跨越，创造了世界发展史上的一个奇迹。深圳的成功，给人们许多启示。”会场内，习近平主席的演讲跨越时空、意蕴深远。\n\n　　昔日小渔村变身今日奇迹之城，深圳的精彩蝶变何以发生？答案写在“开放”二字里——它既是这座城市拔节生长的沛然力量，也是亚太走向持续繁荣的深层根基。\n\n　　当前，国际形势变乱交织，世界经济增长动能不足，单边主义、保护主义甚嚣尘上。与此同时，全球贸易在逆势中保持增长，新兴技术加速突破，深刻影响世界发展格局。\n\n　　“世界怎么了？亚太怎么办？开放还是封闭，合作还是分化，变革还是守旧？”演讲中，习近平主席提出的问题引人深思。\n\n　　“中方愿同各方一道，坚定信心、勇毅前行，携手建设亚太共同体，促进亚太共同繁荣。”面对新的时代课题，习近平主席的回答掷地有声。\n\n　　——促进亚太共同繁荣，要维护和平稳定大局。\n\n　　提出越是外部形势复杂，“越要坚定维护战后国际秩序，推进平等有序的世界多极化、普惠包容的经济全球化”“越要坚持通过对话协商解决分歧，通过团结协作应对挑战，为亚太地区长治久安筑牢根基”。\n\n　　——促进亚太共同繁荣，要搭建开放合作桥梁。\n\n　　强调要坚定维护以世界贸易组织为核心、以规则为基础的多边贸易体制，支持自由开放的贸易和投资，维护全球产业链供应链稳定畅通；稳步推进亚太自由贸易区进程，“为亚太经济一体化建设铺路架桥”。\n\n　　——促进亚太共同繁荣，要激发创新增长动力。\n\n　　聚焦积极构建科技创新伙伴关系，强调“深化数字经济、人工智能合作，促进绿色低碳转型，不断将创新优势转化为增长动能，为亚太经济增长提供强劲动力”。\n\n　　——促进亚太共同繁荣，要拓展互利共赢路径。\n\n　　指出亚太推进合作“不能搞整齐划一”，要既消除贸易和投资壁垒，建设开放型亚太经济，又推动普惠均衡发展，兼顾效率和公平；要坚持以人民为中心的发展理念，“让发展成果惠及各经济体和不同的阶层及人群”。\n\n　　习近平主席以宏大的历史视野提出促进亚太共同繁荣的四点主张，中国理念、中国方案再次为亚太未来发展注入丰沛的思想动能、提供明确的方向指引。\n\n　　建设亚太共同体，共创亚太光明未来。\n\n　　此次工商峰会举行地深圳，处在粤港澳大湾区。经济总量突破15万亿元，拥有3个地区生产总值超3万亿元的城市……粤港澳大湾区正不断拓宽与亚太各地共享合作机遇的通道，持续释放开放的红利。\n\n　　习近平主席在演讲中表示，中方支持成立世界湾区经济合作联盟，深化各湾区交流互动，探索亚太经济合作新路径。\n\n　　扎根亚太、建设亚太、造福亚太，更加开放的中国正不断以中国式现代化新成就为亚太和世界提供新机遇。\n\n　　APEC“中国年”恰逢中国“十五五”开局。“中国‘十五五’规划既是自身的发展蓝图，也为亚太乃至全球经济增长提供机遇清单，是中国面向全球工商界发出的合作邀约。”习近平主席指出。\n\n　　这份邀约背后，是超大规模的开放市场：从新能源汽车到智能家居，从银发经济到冰雪旅游，“每一个新赛道都为全球企业带来新机遇”。\n\n　　这份邀约背后，是前景广阔的发展空间：中国将加快构建现代化产业体系，推动科技创新和产业创新深度融合，“为全球企业技术创新和发展壮大提供强劲动能”。\n\n　　这份邀约背后，是互促共进的合作环境：中国始终践行真正的多边主义，坚定维护多边贸易体制，“不断为世界经济增长和国际经贸合作注入稳定性和确定性”；坚定不移推动共建“一带一路”高质量发展，欢迎亚太地区企业积极参与，共谋发展机遇、共享发展成果。\n\n　　…………\n\n　　一以贯之的开放承诺，合作共赢的坚定决心，赢得与会嘉宾热烈回应。\n\n　　“习主席的演讲围绕促进亚太共同繁荣提出一系列主张，传递出一个明确信号就是要携手合作，这对当下的世界来说非常重要。”现场聆听演讲，美国经济学家杰弗里·萨克斯如是说。\n\n　　“这是非常重要的演讲，我会第一时间与企业朋友分享。”来自澳中工商业委员会的弗兰克·麦奎尔表示，他对习主席提到的互利共赢理念印象深刻，中国的创新发展将给澳大利亚企业带来更多新机遇。\n\n　　此时的深圳前海，开放合作的浪潮奔涌向前。会场不远处，形如“扬帆启航”的前海石迎风而立。\n\n　　“亚太是我们共同发展的天地，也是我们并肩合作的舞台。”从深圳再出发，亚太的未来充满希望、前景光明。\n\n　　文字记者：韩洁、潘洁、唐诗凝\n\n　　海报设计：马发展\n 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c983b97c3c1","title":"深圳APEC︱習近平今早將主持領導人非正式會議︱不斷更新","url":"https://www.stheadline.com/realtime-china/3638328/深圳APEC習近平今早將主持領導人非正式會議不斷更新","summary":"今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。","summary_short":"今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。","digest":"今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行","points":["今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行","國家主席習近平將主持會議並發表重要講話","而全球觸目的中俄美三國元首會談將在今日下午進行，可能涉及俄烏戰事及伊朗局勢"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T09:20:59+08:00","size":1,"keywords":[],"body":"今日上午，亞太經合組織第三十三次領導人非正式會議將在深圳國際交流中心舉行。國家主席習近平將主持會議並發表重要講話。而全球觸目的中俄美三國元首會談將在今日下午進行，可能涉及俄烏戰事及伊朗局勢。外交部表示，這是中俄美三國元首歷史上首次面對面會晤，將圍繞維護世界和平、促進大國關係戰略穩定深入交換意見。\n中俄美三國元首面對面會晤。 新華社\n​​​\n\n相關新聞：APEC 2026懶人包 21成員聚首深圳談甚麼？ 和我們息息相關？ 一文看清重點全解析\n本屆深圳APEC新增一場重頭戲：中美俄元首明日將舉行歷來首次三方會談，或觸及伊朗、烏克蘭等問題，俄方正推動會後發表聯合聲明。\n相關新聞：深圳APEC｜中美俄將展二戰後首次三方對話 學者：聚焦地區穩定不復刻強權外交︱分析\n內地分析人士對《星島》指出，在目前全球政經格局動盪之際，中美俄三國元首不但在深圳「同框」，而且將破天荒召開三方峰會；若北韓領袖金正恩也現身深圳，今次峰會將是APEC成立37年來「含金量最高」的一次會議。據了解，各方正醞釀推動達成《深圳宣言》。\n相關新聞：深圳APEC︱峰會今揭幕習近平發表講話 被譽史上「含金量最高」\n11月19日最新消息\n00：35\n內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。\n相關新聞：深圳APEC｜晚宴菜單曝光 龍蝦石斑還有花膠湯 融會中西美饌精髓\n​ 內地傳媒報道，全球首富、Tesla行政總裁馬斯克出現在特朗普的訪華隨行巴士上，證實他亦隨特朗普到了深圳。 中新視頻\n11月18日最新消息\n23：50\n俄羅斯衛星通訊社報道指出，出席歡迎晚宴的俄羅斯總統普京與美國總統特朗普，分別獲安排坐在習近平及夫人彭麗媛的左右兩側。\n相關新聞：深圳APEC｜特朗普普京晚宴分坐習近平兩側 馬斯克低調現身訪華團\n19：23\nAPEC各經濟體領導人開始陸續抵達位於深圳福田區的深圳國際交流中心。這處將舉行領導人合影活動，並舉辦由國家主席習近平名義舉行的歡迎晚宴。大會在入口處安排樂師現場演奏，當美國總統特朗普入場時，更特意駐足欣賞一會。\n相關新聞：深圳APEC｜習近平舉行歡迎晚宴 特朗普與普京握手\n晚宴開始後，中美俄三國領導人更在台上交談，期間美國總統特朗普更與俄羅斯總統普京握手。\n\n習近平在歡迎晚宴上，向出席嘉賓祝酒。路透社\n經濟體領導人在歡迎晚宴上合照。路透社\n經濟體領導人到深圳國際交流中心，出席歡迎晚宴。路透社\n習近平親迎特朗普：禮尚往來\n16：45\n新華社報道，周三（18日）下午，國家主席習近平在深圳寶安國際機場迎接來華出席亞太經合組織領導人非正式會議的美國總統特朗普。在迎賓曲中，習近平同特朗普親切握手。三軍儀仗隊行舉槍禮，少年兒童向特朗普獻花。中美兩國國旗迎風招展，軍樂團奏兩國國歌，戰機飛越致敬。兩國元首向青年歡迎隊伍揮手致意。\n習近平表示，今年9月我訪美時，特朗普總統夫婦專程赴機場迎接，並舉行隆重歡迎儀式。中國是禮儀之邦，有禮尚往來的傳統。我歡迎你再次訪華，期待同你就事關中美關係、亞太合作和世界格局的重大問題深入交換意見，推動基於尊重、公平、對等的中美建設性戰略穩定關系向前發展。\n特朗普表示，感謝習近平主席親赴機場迎接，感謝中方特殊安排，很高興再次到訪偉大的中國。習近平主席是一位偉大的領袖，每一次同習近平主席會晤都非常愉快，相信此訪將進一步推進兩國關係，取得圓滿成功。\n蔡奇、王毅、黃坤明參加。\n相關新聞：深圳APEC｜特朗普結束訪菲啟程來華 上機前做「招牌」握拳頭動作\n16：27\n日本首相高市早苗抵達深圳，將出席領導人非正式會議，展開就任後的首次訪華之行。\n\n相關新聞：深圳APEC︱日本首相高市早苗抵華 接待層級低於其他領導人\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n深圳民眾舉行手機，拍攝相信是接載日本首相高市早苗的專機。路透社\n12：04\n國家主席習近平與俄羅斯總統普京會晤。\n習近平與普京會晤。\n習近平與普京會晤。\n普京讚深圳最具活力的大都市之一\n11：20\n俄羅斯總統普京出席深圳前海國際會議中心出席2026年亞太經合組織工商領導人峰會開幕，並以經濟體領導人身份作特別致辭。普京表示，此次APEC舉辦地深圳給人留下了深刻印像。「這是最現代化、最具活力的大都市之一，它有機結合了高度城市化、舒適的城市環境和創新的生產基地。」\n10：00\n國家主席習近平在主旨演講上表示，中國「十五五」規劃既是自身的發展藍圖，也為亞太乃至全球經濟增長提供機遇清單，是中國面向全球工商界發出的合作邀約。\n\n中國將為全球工商界提供超大規模開放市場。中國擁有全球規模最大中等收入群體，投資和消費潛力巨大。\n相關新聞：深圳APEC｜習近平籲踐行真正多邊主義 共建亞太共同體\n習近平：中國正加快建設開放大市場\n習近平指出，從新能源汽車到智能家居，從銀發經濟到冰雪旅遊，每一個新賽道都為全球企業帶來新機遇。中國正在加快建設開放大市場，擴大優質產品和服務進口，將不斷催生多樣化新需求。\n中國將為全球工商界提供前景廣闊的發展空間。創新驅動、綠色轉型是中國經濟的關鍵詞。中國將加快構建現代化產業體系，推動科技創新和產業創新深度融合，為全球企業技術創新和發展壯大提供強勁動能。\n\n中國將為全球工商界提供互促共進的合作環境。面對單邊主義、保護主義衝擊，中國始終踐行真正多邊主義，堅定維護多邊貿易體制，維護世貿組織規則，推動世界貿易組織改革，不斷為世界經濟增長和國際經貿合作注入穩定性和確定性。中方將從降低關稅、擴大准入，到探索規則、管理、標準等深水區改革，全面落實製造業准入又准營，穩步擴大服務業領域開放，為全球企業來華投資興業提供更穩定、更可預期優質環境。\n今明兩日出席峰會 多國領袖齊聚深圳\n03：00\n18日凌晨，俄羅斯總統普京乘專機抵達深圳，出席APEC峰會。中共中央政治局常委、中央書記處書記蔡奇前往機場迎接。分析人士對《星島》指出，今年5月普京訪華時，接機是中共中央政治局委員、外長王毅，而今次接機的是政治局常委蔡奇，規格比之前更高。預計普京在峰會期間將與多國與會領袖就亞太區經貿合作及國際局勢等議題展開交流。\n克里姆林宮發言人周六表示，11月19日在深圳，普京將與國家主席習近平及美國總統特朗普舉行三方會晤。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2c9b461094","title":"台企扎根“医疗特区”：感知海南自贸港封关运作“磁吸力”","url":"https://www.chinanews.com/hr/shipin/2026/11-19/news1075426.shtml","summary":"2025年12月海南自贸港正式启动全岛封关运作以来，政策红利持续释放，市场活力加速迸发。","summary_short":"2025年12月海南自贸港正式启动全岛封关运作以来，政策红利持续释放，市场活力加速迸发。","digest":"2025年12月海南自贸港正式启动全岛封关运作以来，政策红利持续释放…","points":["2025年12月海南自贸港正式启动全岛封关运作以来，政策红利持续释放，市场活力加速迸发","位于海南琼海的博鳌乐城国际医疗旅游先行区(简称“乐城先行区”)是中国大陆唯一的“医疗特区”…","11月18日，来自17个国家的20家海外华文媒体走进乐城先行区，探访颖奕国际医疗中心…"],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T09:18:41+08:00","size":1,"keywords":[],"body":"2025年12月海南自贸港正式启动全岛封关运作以来，政策红利持续释放，市场活力加速迸发。位于海南琼海的博鳌乐城国际医疗旅游先行区(简称“乐城先行区”)是中国大陆唯一的“医疗特区”，享有“特许医疗、特许研究、特许经营、特许国际交流”等政策，已成为国际创新药械进入中国大陆市场的最主要通道。\n\n11月18日，来自17个国家的20家海外华文媒体走进乐城先行区，探访颖奕国际医疗中心，在此了解台资企业依托海南自贸港政策的发展故事。\n\n颖奕国际医疗中心作为一家全台资三级综合医疗机构，自2021年正式运营以来，依托乐城先行区特许政策叠加海南自贸港红利，持续打通两岸医疗资源、对接全球前沿技术，成为台企看好海南、深耕健康产业的生动缩影。\n\n颖奕国际医疗中心院长韩海玲表示，封关之后，无论是海内外前来就诊的患者群体，还是企业自身发展，都能感受到明显变化。不少境外客户主动多方了解、持续关注海南自贸港相关政策；依托自贸港人才引进政策，中心顺利引进多名境外顶尖医师，同步引入国际先进医疗技术，“去年我们国际医疗板块接诊约157名患者，今年截至目前，接诊量已经实现两至三倍增长”。(林士杰 陈英清 符宇群)","image":"","video":"https://v-oss.cnsimg.net/glob/2026/11/19/ee4da00b-c110-4068-9220-5016baf43dc6.mp4","video_poster":"","lang":"zh-Hans"}]},{"name":"台灣","total":1,"items":[{"id":"caf2ed770c4","title":"國台辦回應羅大佑言論 指台同胞不滿民進黨違逆民意","url":"https://www.stheadline.com/realtime-china/3638764/國台辦回應羅大佑言論-指台同胞不滿民進黨違逆民意","summary":"台灣音樂人羅大佑近日受訪時，批評民進黨當局鉗制島內言論，種種做法「成為台灣民眾恐懼來源」。","summary_short":"台灣音樂人羅大佑近日受訪時，批評民進黨當局鉗制島內言論，種種做法「成為台灣民眾恐懼來源」。","digest":"台灣音樂人羅大佑近日受訪時，批評民進黨當局鉗制島內言論…","points":["台灣音樂人羅大佑近日受訪時，批評民進黨當局鉗制島內言論，種種做法「成為台灣民眾恐懼來源」","大陸國台辦昨回應稱，當以創作《明天會更好》等歌聞名的音樂人對今天台灣社會文化亂象痛心疾首…","11月10日，羅大佑接受台灣媒體人唐湘龍廣播節目專訪時，對民進黨當局火力全開，針對政治亂象…"],"section":"台灣","category":"台灣","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:39:53+08:00","size":1,"keywords":[],"body":"台灣音樂人羅大佑近日受訪時，批評民進黨當局鉗制島內言論，種種做法「成為台灣民眾恐懼來源」。大陸國台辦昨回應稱，當以創作《明天會更好》等歌聞名的音樂人對今天台灣社會文化亂象痛心疾首、慷慨陳詞，可見問題之嚴重。\n國台辦發言人陳斌華。中新社\n11月10日，羅大佑接受台灣媒體人唐湘龍廣播節目專訪時，對民進黨當局火力全開，針對政治亂象、文化政策及社會氛圍提出尖銳批評。他直言「唱歌的人很難沉默」，呼籲為了下一代，台灣民眾應該覺醒、站出來。\n國台辦發言人陳斌華昨日回應說，當一位以創作《明天會更好》等膾炙人口歌曲而聞名的音樂人痛心疾首、慷慨陳詞時，可見問題之嚴重。德不孤，必有鄰，越來越多台灣同胞對民進黨當局種種踐踏民主、違逆民意的做法強烈不滿，對當前島內文化生態被「台獨」勢力政治裹挾表達深切憂慮。","image":"",
