成泰柬停火感到自豪附全文"},{"point":"有評論指日本首相高市早苗抵達深圳出席APEC會議時被「冷落」","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207256-APEC評論指高市被冷落北京稱按國際慣例作適當禮賓安排"}]}},{"id":"c32b66b9c61","title":"5000斤台湾午仔鱼在京开售 两岸业者盼更多宝岛水产品“登陆”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734559.shtml","summary":"中新网11月19日电(燕新台)18日上午，台湾渔产品输入北京开箱仪式在京举行，5000斤台湾午仔鱼在北京京深海鲜市场开箱销售。","summary_short":"中新网11月19日电(燕新台)18日上午，台湾渔产品输入北京开箱仪式在京举行…","digest":"18日上午，台湾渔产品输入北京开箱仪式在京举行…","points":["中新网11月19日电(燕新台)18日上午，台湾渔产品输入北京开箱仪式在京举行…","这是继10月23日台湾渔产品输入大陆启动后，北京首农水产集团与高雄渔业企业首次合作…","北京台资企业协会副会长兼秘书长施心木介绍，午仔鱼是台湾南部重要的渔业养殖产品…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T14:03:39+08:00","size":2,"keywords":[],"body":"中新网11月19日电(燕新台)18日上午，台湾渔产品输入北京开箱仪式在京举行，5000斤台湾午仔鱼在北京京深海鲜市场开箱销售。\n\n　　这是继10月23日台湾渔产品输入大陆启动后，北京首农水产集团与高雄渔业企业首次合作，也是入冬后北京市输入的第一批来自宝岛台湾的特色渔产品。\n\n　　“这批水产一到货，就基本上销售一空了。”京深海鲜批发市场总经理张扬波向记者表示，台湾水产品品种丰富，为北京市场带来了新的选择。\n\n　　北京台资企业协会副会长兼秘书长施心木介绍，午仔鱼是台湾南部重要的渔业养殖产品，广受台湾家庭喜爱。他表示，很高兴看到这类富有台湾特色的优质鱼货走进大陆广阔的市场，走进千家万户，让更多大陆消费者品尝到这份来自宝岛的美味。\r\n\n　　据悉，午仔鱼也称马友鱼，命名与端午节前后盛产并靠岸产卵的鱼汛有关，是台湾重要的高经济海水养殖鱼，以油脂丰厚、肉质细软肥嫩、骨细刺少著称。\n\n　　北京台协丰台区联谊会副会长刘品祥指出，两岸渔业交流既拓宽了台湾渔民的销路，也丰富了大陆消费者餐桌。“期待两岸在渔业、农产品、经济、文化等领域有更多交流互动。”\n\n　　国台办发言人陈斌华18日在例行新闻发布会上表示，在两岸企业共同努力下，今后还将有更多台湾优质渔产品进入北京市场。这既丰富了北京生鲜市场的产品品类，让京城消费者能品尝到宝岛渔产品，也助力台湾渔业业者拓展销售渠道，获得实实在在的收益。我们将持续推进落实十项促进两岸交流合作的政策措施，助力台湾农渔业者拓展大陆市场，让两岸更多同胞同获其利、共享其惠。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"5000斤台湾午仔鱼在京开售 两岸业者盼更多宝岛水产品“登陆”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734559.shtml","source_display":"中新網 時政","published_at":"2026-11-19T14:03:39+08:00","category":"內地","digest":"18日上午，台湾渔产品输入北京开箱仪式在京举行…"},{"title":"5000斤台湾午仔鱼在北京开箱即基本售罄 两岸业者期待更多台湾海鲜走进大陆市场","url":"https://www.chinanews.com/cj/shipin/2026/11-19/news1075438.shtml","source_display":"中新視頻","published_at":"2026-11-19T11:46:02+08:00","category":"財經","digest":"11月18日上午，5000斤台湾午仔鱼在北京京深海鲜市场开箱销售，上市后基本已售罄"}],"cross":{"total":2,"angles":[{"point":"18日上午，台湾渔产品输入北京开箱仪式在京举行…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734559.shtml"},{"point":"11月18日上午，5000斤台湾午仔鱼在北京京深海鲜市场开箱销售，上市后基本已售罄","sources":["中新視頻"],"url":"https://www.chinanews.com/cj/shipin/2026/11-19/news1075438.shtml"}]}},{"id":"c8b981e5a4e","title":"（深圳APEC）习近平谈建设亚太共同体","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734542.shtml","summary":"中新社深圳11月19日电 (记者 谢雁冰)11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话。","summary_short":"中新社深圳11月19日电 (记者 谢雁冰)11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正…","digest":"11月19日上午…","points":["中新社深圳11月19日电 (记者 谢雁冰)11月19日上午…","习近平指出，当前，世界百年变局加速演进，科技创新和产业创新方兴未艾","面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T11:34:45+08:00","size":2,"keywords":[],"body":"中新社深圳11月19日电 (记者 谢雁冰)11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话。\n\n　　习近平指出，当前，世界百年变局加速演进，科技创新和产业创新方兴未艾。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　建设亚太共同体，要坚持和衷共济。浩瀚的太平洋承载千帆、滋养万物，造就了亚太地区兼收并蓄、和合共生的磅礴气象。亚太大家庭的成员同在一条船上，要经受住太平洋的风浪，就应当勠力同心、守望相助，拉紧共同利益纽带，持续培育共同体意识。\n\n　　建设亚太共同体，要坚持开放融通。开放合作是亚太发展振兴的必由之路。要秉持开放的区域主义，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局。倡导自由开放的贸易和投资，为亚太经济增长开拓更广阔空间。\n\n　　建设亚太共同体，要坚持开拓创新。创新是引领发展的第一动力。要鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境。放大亚太经合组织孵化器作用，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。\n\n　　建设亚太共同体，要坚持包容发展。亚太经济体多样性突出，发展诉求各异。要因势利导推进合作，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。(完) 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平谈建设亚太共同体","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734542.shtml","source_display":"中國新聞網","published_at":"2026-11-19T11:34:45+08:00","category":"兩岸國際","digest":"11月19日上午…"},{"title":"习近平谈建设亚太共同体","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734518.shtml","source_display":"中新網 時政","published_at":"2026-11-19T10:24:55+08:00","category":"內地","digest":"11月19日上午…"}]},{"id":"cf2509da63f","title":"（深圳APEC）深圳留下近十年最全APEC“全家福”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734752.shtml","summary":"中新社深圳11月19日电 题：深圳留下近十年最全APEC“全家福”  　　中新社记者 张素  　　11月19日，深圳国际交流中心，应邀出席亚太经合组织(APEC)第三十三次领导人非正式会议的领导人…","summary_short":"中新社深圳11月19日电 题：深圳留下近十年最全APEC“全家福”  　　中新社记者 张素  　　11月19日…","digest":"题：深圳留下近十年最全APEC“全家福”  　　中新社记者 张素  　　11月19日…","points":["11月19日，深圳国际交流中心，应邀出席亚太经合组织(APEC)第三十三次领导人非正式会议的…","19日会议开始前，与会经济体领导人、代表戴上红蓝围巾，留下属于深圳的“APEC时刻”","这张集体合影里人员齐、规格高，被认为是近十年以来最全的APEC“全家福”"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:28:48+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：深圳留下近十年最全APEC“全家福”\n\n　　中新社记者 张素\n\n　　11月19日，深圳国际交流中心，应邀出席亚太经合组织(APEC)第三十三次领导人非正式会议的领导人、代表，留下一张具有标志性意义的集体合影。\n\n　　嘉宾身穿东道主特别设计的服饰拍摄“全家福”，是APEC大家庭的传统保留环节。19日会议开始前，与会经济体领导人、代表戴上红蓝围巾，留下属于深圳的“APEC时刻”。\n\n　　这张集体合影里人员齐、规格高，被认为是近十年以来最全的APEC“全家福”。从“全”“家”“福”三个字，或可更好读懂合影传递的信息。\n\n11月19日上午，中国国家主席习近平在深圳主持亚太经合组织第三十三次领导人非正式会议。　中新社记者 赵文宇 摄\n\n　　“全”：APEC大家庭“整整齐齐”\n\n　　连日来，深圳宝安国际机场红毯铺不停。\n\n　　美国总统特朗普来了。去年在韩国庆州，特朗普参加了APEC工商领导人峰会，但在APEC领导人非正式会议前启程返美。\n\n　　俄罗斯总统普京来了，携3位副总理、7位部长出席深圳APEC盛会。上一次普京在线下出席APEC领导人非正式会议是在2017年。\n\n　　“在世界动荡变局中，大家都认为应坐下来探讨如何解决问题。更多国家选择‘向东看’，希望找到摆脱贫困和战争的办法，这也是APEC吸引力所在。”中国现代国际关系研究院研究员陈凤英说。\n\n　　30多年来，APEC促进亚太地区实现发展与繁荣。数据显示，APEC成员经济体以近全球40%的人口，创造了超出六成的全球经济总量。\n\n　　“亚太共同体区别于排他性‘小圈子’的特点在于，不让任何一个伙伴掉队。”四川大学国际关系学院讲席教授荣鹰表示，众多经济体领导人齐聚深圳，APEC大家庭“整整齐齐”，说明各方愿意以多边交流扩大合作“朋友圈”。\n\n　　“家”：彰显中国主场外交号召力\n\n　　从北京雁栖湖到深圳香蜜湖，各成员领导人、代表合影，将APEC会议的盛况定格在历史相册中。\n\n　　“这张近十年最全APEC‘全家福’，彰显中国办会的号召力。”陈凤英分析，一方面，中国已成为13个APEC经济体最大贸易伙伴，紧密联结的经贸纽带为亚太伙伴共享中国发展机遇筑牢根基。\n\n　　另一方面，当今世界风云变幻，中国发展的稳定性、确定性弥足珍贵。作为“多边主义的捍卫者和世界经济的重要引擎”，中国再次担任APEC东道主，也给动荡的世界带来更多确定性。\n\n　　今年，中方同各成员经济体一道成功举办了300多场各类会议和活动，APEC“中国年”取得一系列合作成果。在深圳，中方细致周密的安排也让外方宾至如归。\n\n　　“各经济体领导人、代表高度肯定中国作为东道主的努力和贡献，同时也期待中国为实现APEC目标和愿景作出更大贡献。”荣鹰说。\n\n　　“福”：合作像大鹏一样展翅高飞\n\n　　太平洋连接着亚太大家庭，承载着各方对美好生活的共同期待。\n\n　　有评论认为，在逆全球化与地缘博弈交织的当下，APEC“软协调”机制的意义反而凸显出来：它不必解决所有分歧，却能提供一个“先把分歧放一边、把合作做起来”的空间，让亚太合作像大鹏一样展翅高飞、鹏程万里。\n\n　　荣鹰说，各方积极参会，对亚太区域合作的未来方向和路径展开充分讨论，有利于挖掘更多机遇。\n\n　　深圳的故事本身就是亚太合作的成功范例。来到这座“奇迹之城”，当城市的故事与亚太的故事交汇，已有多位APEC经济体领导人表达对合作的期待。\n\n　　智利总统卡斯特走进水果门店，见证智利车厘子新产季在华开启；澳大利亚总理阿尔巴尼斯走进超市，考察龙虾等澳特产，表示“正致力于推动经济增长”；墨西哥总统辛鲍姆走进智慧医院，近距离了解深圳医疗的科技成果，并称要把先进科学技术成果引入墨西哥……\n\n　　陈凤英表示，APEC织密合作网络、拉紧利益纽带，有助于推动合作进一步走深走实。“开放、创新、合作”，不仅是中国主场外交的重点，也指向亚太合作的前方。(完)\n 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd3828d40de","title":"深圳APEC︱中俄美元首歷史性會晤 習近平：三國應守住和平共處底線","url":"https://www.stheadline.com/realtime-china/3638877/深圳APEC中俄美元首歷史性會晤-習近平三國應守住和平共處底線","summary":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。","summary_short":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","digest":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","points":["深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","習近平指出，中俄美三國最高領導人有史以來首次聚首，具有開創性意義","近年來，中國推進中俄新時代全面戰略協作夥伴關係，積極構建中美建設性戰略穩定關係…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:18:14+08:00","size":1,"keywords":[],"body":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。習近平指出，中俄美三國最高領導人有史以來首次聚首，具有開創性意義。 ​​​\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n習近平指出，當今世界早已不是彼此隔絕的孤島。人類生活在同一個地球村，大家一榮俱榮、一損俱損，是一個命運共同體。在這個地球村裡，大國肩負著特殊責任。大國良性互動不是選擇題，而是必答題。近年來，中國推進中俄新時代全面戰略協作夥伴關係，積極構建中美建設性戰略穩定關係，推動形成和平共處、總體穩定、均衡發展的大國關係格局，既惠及彼此，又造福世界。\n習近平又指當前，世界百年變局加速演進，天下並不太平。風雨見擔當。作為世界主要大國和聯合國安理會常任理事國，中俄美應該當好表率，合作應對全球性挑戰，共同維護世界和平穩定，為人類進步作出更大貢獻。\n相關新聞：深圳APEC︱特朗普晤習近平 表態：美國不支持「台獨」\n習近平指出，和平是人類社會的永恆期盼。我們這個星球曾爆發過1萬多次戰爭，兩次世界大戰更是給人類社會造成空前浩劫，當下世界上仍有60多場地區衝突延宕不止。歷史告訴我們：大國和，則世界安；大國鬥，則世界亂。80多年前，作為世界反法西斯的中堅力量，中俄美三國並肩奮戰，取得偉大勝利，為世界贏得和平和安寧。歷史是最好的教科書。我們要銘記歷史，以史為鑒，開創未來。\n大國如何正確相處提出4點看法\n第一，堅持相互尊重。相互尊重是大國交往的基本準則。中俄美三國國情不同，誰也改變不了誰，這是歷史形成的，也是各自人民的自主選擇。正確的態度是彼此尊重、求同存異、共同發展。要尊重彼此主權和領土完整，尊重各自選擇的社會制度和發展道路，尊重彼此核心利益和重大關切。要堅持不干涉別國內政，不干涉彼此內部事務。在涉及對方的重大敏感問題上，提前溝通、換位思考、謹慎行事，特別是不能觸碰對方的底線。\n第二，堅持和平共處。「修昔底德陷阱」絕不是宿命，關鍵要看主要大國如何抉擇。中俄美要做夥伴、做朋友，不衝突、不對抗，守住和平共處底線，努力跨越「修昔底德陷阱」。中俄美都是二戰主要戰勝國，應當堅定維護戰後國際秩序，維護《聯合國憲章》宗旨，捍衛來之不易的二戰勝利成果。核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n相關新聞：深圳APEC｜普京隨行軍官直認手上「核公事包」 中美俄會晤前「騷肌肉」？\n第三，堅持合作共贏。三國發展稟賦不同，經濟互補性強，可以發揮自身優勢，互通有無。應該摒棄冷戰思維，加強經貿合作，將資源大國、製造大國、消費大國的各自優勢貫通起來，共同做大合作蛋糕，實現雙贏共贏，而不能搞「脫鉤斷鏈」。全球能源安全面臨嚴峻挑戰，三國可以加強溝通和協調，共同維護能源產業鏈供應鏈穩定暢通，維護全球能源市場安全穩定。\n第四，堅持對話協商。大國間有分歧在所難免，如果不溝通，猜忌便會蔓延，小摩擦也可能演變成大衝突。三國要保持常態化高層交往，暢通各層級對話渠道，建立危機溝通和預防機制，確保誤判少發生、分歧管得住、摩擦不升級。當前，全球各種紛爭持續不斷，熱點問題按下葫蘆浮起瓢，國際社會期待大國多做勸和促談工作。中俄美三國應該繼續推動衝突當事方坐下來、談起來，通過政治外交手段化解紛爭。\n習近平：最終建設無核世界\n習近平：堅持和平共處。「修昔底德陷阱」絕不是宿命，關鍵要看主要大國如何抉擇。中俄美要做夥伴、做朋友，不衝突、不對抗，守住和平共處底線，努力跨越「修昔底德陷阱」。中俄美都是二戰主要戰勝國，應當堅定維護戰後國際秩序，維護《聯合國憲章》宗旨，捍衛來之不易的二戰勝利成果。核武器是懸在人類頭上的「達摩克利斯之劍」，應該全面禁止並徹底銷毀，最終建立無核武器世界。核戰爭打不贏也打不得。要盡一切努力防止核戰爭，遵守《不擴散核武器條約》，維護全球戰略穩定。\n相關新聞：深圳APEC︱特朗普晤習近平 稱「美中同盼俄烏伊朗止戰」\n美國總統特朗普在會議開幕致辭中則表示，「這三個國家（美中俄）在討論核武問題上具有獨特的優勢」。特朗普還補充說：「過去的領導人常常避免與那些和他們意見相左的領導人交談」。他表示，減少溝通機會絕不會締造和平，美中俄肩負著解決影響全球問題的重大責任。\n特朗普稱我們必須合作打擊全球核擴散威脅、擁有核武器，為此今天我們將討論所有相關議題。\n相關新聞：深圳APEC｜金正恩視察咸鏡南道 朝方未回應是否與特朗普會晤\n俄羅斯總統普京則感謝中方積極組織今次三國元首會晤。他強調，中美俄三國同為第二次世界大戰戰勝國，對維護全球和平穩定負有特殊責任，並表示烏克蘭局勢將是今次會談的重點議題。\n普京向中美兩國領導人表示，只要俄羅斯、中國和美國進行建設性合作，便能加強全球穩定。他說：「我們三國在解決地區衝突方面擁有許多共同利益，當中自然也包括烏克蘭衝突。」\n普京進一步指出，他與習近平、特朗普可以「為加強全球安全與穩定作出有意義的貢獻，前提是我們必須展開建設性合作」。\n相關新聞：深圳APEC︱ 習近平：大國和則世界安，大國鬥則世界亂︱不斷更新\n國家主席習近平在中俄美元首三方會議前，先與美國總統特朗普雙邊會晤。兩人在深圳麒麟山莊會面，歷時約1小時。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca6802e74fa","title":"河南省商丘市人大常委会原党组成员、副主任张团结被“双开”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734683.shtml","summary":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员、副主任张团结严重违纪违法问题进行了立案审查调查。","summary_short":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员…","digest":"据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员…","points":["中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准…","经查，张团结丧失理想信念，背弃初心使命，对抗组织审查","无视中央八项规定精神，收受可能影响公正执行公务的礼金、消费卡，违规配备使用公务用车"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:57:07+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据河南省纪委监委消息：经中共河南省委批准，河南省纪委监委对商丘市人大常委会原党组成员、副主任张团结严重违纪违法问题进行了立案审查调查。\n\n　　经查，张团结丧失理想信念，背弃初心使命，对抗组织审查；无视中央八项规定精神，收受可能影响公正执行公务的礼金、消费卡，违规配备使用公务用车；违背组织原则，在组织函询时不如实说明问题，利用职权为他人谋取人事利益并收受财物；廉洁底线失守，借用管理和服务对象的车辆，通过民间借贷获取大额回报，违规从事营利活动，利用职权为他人谋取利益并收受财物；不正确履行职责，造成不良影响；丧失纪法底线，大搞权钱交易，利用职务便利为他人在项目承揽、职务调整等方面谋取利益，非法收受巨额财物。\n\n　　张团结严重违反党的政治纪律、组织纪律、廉洁纪律、工作纪律和国家法律法规，构成严重职务违法并涉嫌受贿犯罪，且在党的十八大后不收敛、不收手，性质严重，影响恶劣，应予严肃处理。依据《中国共产党纪律处分条例》《中华人民共和国监察法》《中华人民共和国公职人员政务处分法》等有关规定，经河南省纪委常委会会议研究并报中共河南省委批准，决定给予张团结开除党籍处分；由河南省监委给予其开除公职处分；收缴其违纪违法所得；将其涉嫌犯罪问题移送检察机关依法审查起诉，所涉财物一并移送。\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c97060376e4","title":"习近平：大国良性互动不是选择题，而是必答题","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734714.shtml","summary":"新华社深圳11月19日电(记者冯歆然、梁旭)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"新华社深圳11月19日电(记者冯歆然、梁旭)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","points":["新华社深圳11月19日电(记者冯歆然、梁旭)11月19日下午…","习近平指出，当今世界早已不是彼此隔绝的孤岛","人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:43:00+08:00","size":1,"keywords":[],"body":"新华社深圳11月19日电(记者冯歆然、梁旭)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。\n\n　　习近平指出，当今世界早已不是彼此隔绝的孤岛。人类生活在同一个地球村，大家一荣俱荣、一损俱损，是一个命运共同体。在这个地球村里，大国肩负着特殊责任。大国良性互动不是选择题，而是必答题。近年来，中国推进中俄新时代全面战略协作伙伴关系，积极构建中美建设性战略稳定关系，推动形成和平共处、总体稳定、均衡发展的大国关系格局，既惠及彼此，又造福世界。当前，世界百年变局加速演进，天下并不太平。风雨见担当。作为世界主要大国和联合国安理会常任理事国，中俄美应该当好表率，合作应对全球性挑战，共同维护世界和平稳定，为人类进步作出更大贡献。\n 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ced17be0d2d","title":"习近平：大国和，则世界安；大国斗，则世界乱","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734712.shtml","summary":"新华社深圳11月19日电(记者杨依军、毛思倩)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。","summary_short":"新华社深圳11月19日电(记者杨依军、毛思倩)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","digest":"11月19日下午，国家主席习近平在深圳同俄罗斯总统普京…","points":["新华社深圳11月19日电(记者杨依军、毛思倩)11月19日下午…","习近平指出，和平是人类社会的永恒期盼","我们这个星球曾爆发过1万多次战争，两次世界大战更是给人类社会造成空前浩劫…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:41:10+08:00","size":1,"keywords":[],"body":"新华社深圳11月19日电(记者杨依军、毛思倩)11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。\n\n　　习近平指出，和平是人类社会的永恒期盼。我们这个星球曾爆发过1万多次战争，两次世界大战更是给人类社会造成空前浩劫，当下世界上仍有60多场地区冲突延宕不止。历史告诉我们：大国和，则世界安；大国斗，则世界乱。80多年前，作为世界反法西斯的中坚力量，中俄美三国并肩奋战，取得伟大胜利，为世界赢得和平和安宁。历史是最好的教科书。我们要铭记历史，以史为鉴，开创未来。\n 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf0ee547996","title":"第六届世界华文教育大会在海南召开","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734703.shtml","summary":"新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开。","summary_short":"新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开。","digest":"第六届世界华文教育大会11月18日至19日在海南博鳌召开","points":["新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开","大会期间，来自全球70多个国家和地区的近600名代表，围绕“新格局、新华教、新发展”主题…","与会代表表示，海外华文教育作为海外侨胞自主创办的中华语言文化教育事业…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:25:55+08:00","size":1,"keywords":[],"body":"新华社海南博鳌11月19日电 第六届世界华文教育大会11月18日至19日在海南博鳌召开。大会期间，来自全球70多个国家和地区的近600名代表，围绕“新格局、新华教、新发展”主题，总结华文教育发展成效和经验，聚焦新形势下华文教育的使命任务，共商未来发展大计。\n\n　　与会代表表示，海外华文教育作为海外侨胞自主创办的中华语言文化教育事业，长期以来在凝聚侨心侨力、传承中华文化和推动中外友好交流等方面发挥了重要作用。今年是“十五五”开局之年，中国的发展正站在新的历史起点上，华文教育发展迎来难得机遇和广阔空间。华文教育工作者应坚守教育初心，积极推进华文教育标准化、正规化、专业化、信息化建设，不断提高办学水平和质量，发挥融通中外的独特优势，讲好中国故事，促进中外民心相通和文明交流互鉴，让世界各国人民通过华文教育了解一个可信、可爱、可敬的中国，为构建人类命运共同体作出新的更大贡献。\n\n　　会前，中共中央政治局委员、中央统战部部长李干杰会见出席大会的全体代表并合影留念。 【编辑:吴青潞】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6f7f270d93","title":"中国人民对外友好协会会长杨万明访问尼泊尔","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734681.shtml","summary":"新华社加德满都11月19日电(记者张平)11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔，分别会见尼众议院议长阿亚尔、外交部长希西尔、加德满都大都市代理市长丹戈尔…","summary_short":"新华社加德满都11月19日电(记者张平)11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔…","digest":"11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔…","points":["双方表示，将认真落实两国领导人达成的重要共识，坚持中尼面向发展与繁荣的世代友好的战略合作伙伴…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T16:02:50+08:00","size":1,"keywords":[],"body":"新华社加德满都11月19日电(记者张平)11月17日至19日，中国人民对外友好协会会长杨万明应邀率团访问尼泊尔，分别会见尼众议院议长阿亚尔、外交部长希西尔、加德满都大都市代理市长丹戈尔、巴德岗市长普拉贾帕蒂等中央和地方政府、议会负责人，与尼中经贸协会主席阿努伯、阿尼哥协会主席苏希尔、尼中文化教育协会主席哈利仕等友好人士进行集体座谈会，就今年8月26日中尼边境发生严重泥石流灾害向尼方致以诚挚慰问，表示中国人民对外友好协会愿为尼方重建家园提供力所能及的支持。\n\n　　双方表示，将认真落实两国领导人达成的重要共识，坚持中尼面向发展与繁荣的世代友好的战略合作伙伴关系定位，不断深化两国地方、议会、民间、经贸、人文、旅游和青少年等领域友好交流合作。\n\n 【编辑:王琴】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf327122993","title":"广西与越南边境三省市法院深化合作 破解跨境司法难点","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734673.shtml","summary":"【东盟专线】广西与越南边境三省市法院深化合作 破解跨境司法难点  　　中新社广西崇左11月19日电 (林浩 魏素娟)2026年中国广西与越南高平、谅山、广宁三省市法院院长会晤研讨活动…","summary_short":"【东盟专线】广西与越南边境三省市法院深化合作 破解跨境司法难点  　　中新社广西崇左11月19日电 (林浩 魏素娟)20…","digest":"【东盟专线】广西与越南边境三省市法院深化合作 破解跨境司法难点  　　中新社广西崇左…","points":["中新社广西崇左11月19日电 (林浩 魏素娟)2026年中国广西与越南高平、谅山…","本次会晤围绕“数字时代下解决跨境民事和商业纠纷的合作”“进一步加强中越边境省份法官交流培训和…","中国最高人民法院国际合作局局长段农根在活动致辞中表示，当前，随着中越两国经贸…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:51:07+08:00","size":1,"keywords":[],"body":"【东盟专线】广西与越南边境三省市法院深化合作 破解跨境司法难点\n\n　　中新社广西崇左11月19日电 (林浩 魏素娟)2026年中国广西与越南高平、谅山、广宁三省市法院院长会晤研讨活动，18日至19日在中越边境广西崇左市举行。\n\n　　本次会晤围绕“数字时代下解决跨境民事和商业纠纷的合作”“进一步加强中越边境省份法官交流培训和建立常态化会晤机制”等议题，越南三省市法院院长以及中方与会代表展开深入交流，为两国边境地区司法合作贡献智慧和力量。\n\n11月19日，2026年中国广西与越南高平、谅山、广宁三省市法院院长会晤研讨活动在广西崇左市举行。林浩 摄\n\n　　中国最高人民法院国际合作局局长段农根在活动致辞中表示，当前，随着中越两国经贸、人文往来日益频繁，跨境民商事纠纷、新型网络犯罪等新情况新问题不断涌现，对跨境司法协作提出新的更高要求。中国最高人民法院支持广西法院与越南边境法院聚焦跨境民商事审判、纠纷联合调解、司法便民服务、涉外风险防控等重点领域，开展实质合作。精准对接口岸开放、边贸发展、跨境务工、跨境文旅等新业态新需求，破解跨境司法堵点难点。\n\n　　段农根倡议，中越边境法院完善合作机制，深化数字司法合作，探索在线调解、远程取证、电子送达等跨境司法服务新模式，让更多中越民众了解边境省份法院合作的实际成效。\n\n　　广西壮族自治区高级人民法院院长黄海龙表示，当前，中国—东盟自由贸易区3.0版即将生效实施，中越经贸合作和人员往来日益密切。作为中国边境省份，广西愿与越方加强司法交流合作，共同维护边境地区安宁稳定，促进经贸合作，增进民众福祉。\n\n　　越南谅山省人民法院院长丁玉勋对中方倡议表示认同。他认为，越中边境法院可以建立“年度轮值司法研讨会”机制，开展法官专题交流，确保法院裁判客观、公正，并得到有效执行。\n\n　　近年来，在中国最高人民法院指导下，广西法院相继与越南谅山、广宁等法院签署相关合作备忘录，在法官培训、案例研究、司法协助等方面开展合作。本次会晤活动的举办，标志着中越司法交流合作逐步迈向更深层次、更广领域。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c93c0385252","title":"（深圳APEC）深圳APEC：一场中国式现代化的“现场说明会”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734636.shtml","summary":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉  　　世界的目光正聚焦深圳“APEC时间”。","summary_short":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉  　　世界的目光…","digest":"题：深圳APEC：一场中国式现代化的“现场说明会”  　　中新社记者 王宗汉…","points":["作为亚太经合组织(APEC)“中国年”的三大优先领域，“开放、创新…","“看五十年的中国就来深圳”，中国国家主席习近平在APEC领导人非正式会议欢迎晚宴上这样介绍深…","APEC“中国年”启动以来，16座城市举办300多场会议和活动，各经济体代表累计参与逾万人次"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:36:08+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：深圳APEC：一场中国式现代化的“现场说明会”\n\n　　中新社记者 王宗汉\n\n　　世界的目光正聚焦深圳“APEC时间”。\n\n　　作为亚太经合组织(APEC)“中国年”的三大优先领域，“开放、创新、合作”成为在深圳举行的领导人会议周的关键词。\n\n　　三个关键词，既回应亚太共同发展的现实课题，也与中国式现代化的发展追求高度契合——开放是鲜明标识，创新是第一动力，合作共赢是必然要求。\n\n　　“看五十年的中国就来深圳”，中国国家主席习近平在APEC领导人非正式会议欢迎晚宴上这样介绍深圳。深圳的发展实践，正是中国式现代化的生动缩影。深圳APEC会议，为世界读懂中国式现代化开了一场生动的“现场说明会”。\n\n11月15日，市民拍摄深圳华强北的APEC标识。中新社记者 张祥毅 摄\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“开放”。\n\n　　APEC“中国年”启动以来，16座城市举办300多场会议和活动，各经济体代表累计参与逾万人次。进入深圳会议周，全部21个APEC成员经济体的领导人、代表相聚于此，APEC工商领导人峰会吸引来自亚太及域外经济体的2000余位政商界代表参加。\n\n　　国际盛会，折射深圳与亚太的深度联系，也展现中国拥抱世界的开放姿态。\n\n　　近年来，从全面取消制造业领域外资准入限制，到扩大电信、医疗等服务业开放试点，再到海南自贸港全岛封关运作，中国以一系列务实举措持续扩大开放。APEC各经济体代表走进深圳前海合作区，感受中国开放的成果；工商界围绕区域贸易、数字经济等议题深入交流，让合作更进一步。\n\n　　从深圳深度融入全球市场，到APEC汇聚亚太各方，世界观察到，中国式现代化始终坚持敞开大门，与伙伴共拓发展空间。\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“创新”。\n\n　　加拿大总理卡尼这样评价深圳：“未来在这里设计，在这里测试，也在这里制造。”美国经济学家杰弗里·萨克斯则称深圳是中国创新的“标杆”。\n\n　　“APEC科技落地签”“AI上APEC”……诸多热点在这场盛会上出圈，让深圳的创新活力更加鲜活可感，也彰显了中国以科技创新推动现代化的蓬勃动能。\n\n　　近年来，从加大基础研究投入、支持前沿探索，到实施“人工智能+”行动、推动成果转化，中国以务实举措持续激发创新活力。2025年，中国研发经费投入稳居世界第二，全球创新指数排名首次跻身前十。\n\n　　从深圳科技产业蓬勃发展，到APEC共商亚太增长新动能，世界看到的不只是中国科技创新成果，更是中国式现代化坚持创新驱动、推动科技与产业深度融合的生动实践。\n\n11月18日，《2026年亚太经合组织工商领导人峰会深圳倡议》在深圳对外发布。　中新社记者 赵文宇 摄\n\n　　深圳“APEC时间”，世界读懂中国式现代化的“合作”。\n\n　　深圳的发展离不开亚太市场，亚太的繁荣也离不开各经济体的密切协作。这座城市正是中国与亚太相互依存、彼此成就的缩影。\n\n　　作为东道主，中方与各方一道，聚焦深化开放型区域经济、以技术创新驱动包容增长、畅通区域一体化动脉、携手实现共同繁荣等达成诸多共识，也展现了中国与世界相互成就的广阔前景。\n\n　　近年来，从高质量共建“一带一路”，到深化区域产业链供应链协作，中国不断拓展互利共赢空间。中国已成为13个APEC经济体的最大贸易伙伴，2025年与APEC其他经济体进出口总额超过26万亿元人民币。\n\n　　从凝聚合作共识，到共绘繁荣蓝图，深圳的“APEC时间”，既是世界观察中国的窗口，也是中国与世界携手前行的生动见证。\n\n　　这次盛会再次证明，中国式现代化，不是独善其身的现代化，而是在开放中拥抱世界、在创新中共享机遇、在合作中彼此成就。中国与世界的故事，从不是单向的奔赴，而是相向而行、共同书写的未来。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c97454dc58d","title":"东西问丨中国AI赋能中小企业，对亚太其他经济体有何借鉴意义？","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734642.shtml","summary":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。","summary_short":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。","digest":"中新社记者 许青青  　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新…","points":["中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量","日前，在广州举行的第32次APEC中小企业部长会议…","9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T15:31:42+08:00","size":1,"keywords":[],"body":"中新社记者 许青青\n\n　　中小微企业是亚太经济版图上最蓬勃的底色，是推动创新、促进就业、改善民生的中坚力量。日前，在广州举行的第32次APEC中小企业部长会议，正式倡议在广州设立“亚太人工智能赋能中小企业发展合作中心”、在深圳建设“亚太中小企业合作区”，标志着中国AI赋能中小企业发展，从国内实践走向区域协作。\n\n　　中国中小企业使用AI进展如何？中国在AI赋能中小企业方面有哪些经验可供借鉴？中山大学国家发展研究院副院长、中山大学岭南学院教授李兵近日接受中新社“东西问”专访，对此作出解读。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能体验中心观看机器人弹奏钢琴。　中新社记者 　陈楚红 摄\n\n　　中新社记者：AI对于一家中小企业本质上意味着什么？它将带来哪些改变？\n\n　　李兵：人工智能(AI)被认为是继蒸汽、电力、信息技术之后的又一次技术革命。经济学里把这一类技术叫作“通用目的技术”，它能渗透到经济生活的每一个角落，而且会越用越好。人工智能，就是最新一次这样的革命。\n\n　　AI对中小企业而言，既是挑战，更是机遇。\n\n　　过去，顶尖人才往往聚集在大企业，中小企业很难聘用到。而AI集成了大量人类智慧，且模型每次迭代都会吸收新的经验。所以某种程度上讲，中小企业现在借助AI，就相当于随时随地用到了这些顶尖智慧。这一点对中小企业最重要，“顶尖能力”变得便宜了。\n\n　　AI时代正滚滚而来，中小企业会加速分化：用好了，成长很快；没抓住、忽视了，就会被时代抛弃。\n\n　　中新社记者：中国中小企业运用AI提高生产效率，相对亚太区域其他经济体中小企业有哪些优势？\n\n　　李兵：根据中国信通院对中国6000多家中小企业的调查，已经有50%以上的企业用上了人工智能，还有约1/4计划在两年内使用。但结合我们自己调研的实际情况看，企业员工已在日常工作里使用，老板对此不一定知情。也就是说，中国至少有50%的中小企业正在使用AI。但真正把AI深度嵌入到业务流程里的，只有4%左右：企业清楚哪个流程该用什么AI，特定流程从头到尾都有AI参与，整体效率得到提升，但不等于全公司所有业务都已完全打通。\n\n　　要让AI真正发挥效用来、带动企业提效增长，还是要真正实现全公司端到端的全流程打通。此外，底层技术变了，组织机构必然跟着调整，目前来看还为时尚早，最终形式还需要企业在实践中探索。\n\n　　中国中小企业在利用AI方面，我认为主要有三方面优势：中国AI供给充足，很多国内大模型比美国同类产品便宜，而且好用；AI建立在移动互联网之上，中国有高速网络与稳定电力，基础设施优势明显；中国有完整产业体系与丰富应用场景，尤其粤港澳大湾区中小企业密集、创业热情高，只要找到一个场景把AI用起来，往往就能赚到钱。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾体验互动游戏。　中新社记者 　陈楚红 　摄\n\n　　中新社记者：广州花都通过AI产业园引入头部企业搭建公共AI服务平台，批量服务纺织、鞋服等传统中小企业，这种共享数字化服务模式的核心逻辑是什么？\n\n　　李兵：广州市花都区政府牵头，联合华为、中国信通院等共建的城市级工业人工智能中心“广州市花都区新型工业化数字服务平台”，集成了50P公共算力，提供工业互联网SaaS应用、AI工具及全链条数字化转型服务，带动声光电、化妆品、皮革皮具等重点产业产值同比增长，这一共享数字化服务模式已向多地推广。\n\n　　在花都项目里，华为主要为园区提供算力和大模型支撑，还整理、打包了各类成熟的应用场景案例；专门安排人员开展使用相关技术和工具的培训。此外，当地的客户资源与产业集群优势，也让产业园模式释放出更多红利。\n\n　　这种“政府搭台、大企业输出技术、中小企业共享服务”的共享数字化模式，把中小企业单独买不起、用不好的AI能力，变成一种公共品，按需取用、门槛极低，正是广东探索出来的典型路径。\n\n　　中新社记者：中国AI赋能中小企业的经验有哪些可以复制？对亚太区域发展中经济体有何借鉴意义？\n\n　　李兵：我的基本判断是：技术可以复制，但认知、能力与环境的鸿沟不会自动消弭。很多发展中国家不是没有技术，而是“不知道技术存在、不知道如何运用”，认知鸿沟比技术鸿沟更难消弭，这正是务实合作必须发力的方向。\n\n　　可以直接复制的有：\n\n　　公共赋能中心的机制。政府搭台、共享服务的逻辑，几乎所有经济体都可以做，只是规模大小不同。花都模式最值得复制的地方，不是具体的平台，而是“把固定成本公共化”这个机制。\n\n　　算力券、创新券这类补贴工具。这是降低企业使用门槛最直接的政策工具，对于很多经济体值得参考。\n\n　　开源大模型的路径。中国的AI大模型总体走开源路线，开源天然就是普惠的，是帮助全球中小企业跨越技术门槛最有价值的路径。\n\n　　“小快轻准”的轻量化产品。引导企业的产品在小型化、快速化、轻量化、精准化等维度持续深耕，把AI拆成中小企业用得起的模块，这种产品化思路可复制性很强。\n\n　　能力建设和培训机制。这是投入小、见效长的“基础工程”，也是消弭认知鸿沟最直接的手段。\n\n　　对亚太发展中经济体，我建议复制中国的“机制”而不是复制“模板”。把共享、普惠、借力的机制带回去，结合本地产业基础和制度条件重新设计。技术转移从来不是单向输出，而是供给方与应用方的双向奔赴。\n\n9月1日，第32次亚太经合组织(APEC)中小企业部长会议参访活动嘉宾在广州海心沙全空间智能体验中心佩戴脑机接口设备控制汽车模型行驶。　中新社记者 　陈楚红 　摄\n\n　　中新社记者：对于正在犹豫要不要上AI的亚太中小企业主，您有何具体建议？\n\n　　李兵：我的建议主要有三条：\n\n　　第一，老板带头，全员用起来。老板自己不用AI、没有体感，员工下面在做什么你根本不知道，又怎么指挥？所以第一件事是自己上手。同时，给员工账号、给额度，鼓励大家用起来。\n\n　　第二，从小场景切入，借外力降低门槛。高频、重复、输入任务和输出成果都特别明确的流程，最适合先用AI，借助产业园、政府算力券先跑起来，把这部分效率提上来，再考虑其他环节。\n\n　　第三，用场景换技术，找高校合作。草根中小企业摸爬滚打在第一线，最清楚要做什么、怎么落地。高校懂技术却不了解高密度、真需求，两者结合起来，就能找到好的应用场景。\n\n　　对于还在观望的中小企业，我想说：中小企业不应该是AI的旁观者，而应该是AI赋能的主战场、生力军；谁先用会AI，谁就有机会拿下未来的市场。(完)\n\n　　受访者简介\n\n李兵。受访者供图\n\n　　李兵，中山大学岭南学院教授，博士生导师，中山大学国家发展研究院副院长，中山大学经济管理国家级实验教学示范中心副主任。主要研究方向是国际贸易、国际政治经济学、城市经济学等。教育部全国万名优秀创新创业导师人才库首批入库导师，首批国家知识产权局专利分析和预警专家库专家，中国技术经济学会知识产权分委会理事，中国国际经济关系学会理事，粤港澳高校质量联盟学术委员会委员，中国国土经济学会区域战略青年学者菁英会会员，广东省经济学会副秘书长。\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c7ca1d27bb7","title":"成都首发中亚JSQ捷达班列","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-19/10734621.shtml","summary":"中新社成都11月19日电 (记者 张浪 岳依桐)中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式19日在四川成都举行。","summary_short":"中新社成都11月19日电 (记者 张浪 岳依桐)中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式19日在四川成都举行…","digest":"中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式19日在四川成都举行","points":["中新社成都11月19日电 (记者 张浪 岳依桐)中亚(中国·成都—哈萨克斯坦)JSQ捷达班列…","一批由一汽大众汽车有限公司成都分公司生产的捷达品牌整车完成装载后正式发运，驶向中亚市场","这是“成都造”汽车首次通过铁路JSQ车方式在成都发运…"],"section":"內地","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:48:48+08:00","size":1,"keywords":[],"body":"中新社成都11月19日电 (记者 张浪 岳依桐)中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式19日在四川成都举行。\n\n　　一批由一汽大众汽车有限公司成都分公司生产的捷达品牌整车完成装载后正式发运，驶向中亚市场。这是“成都造”汽车首次通过铁路JSQ车方式在成都发运，标志着成都汽车产业国际化物流服务体系再添新模式。\n\n11月19日，中亚(中国·成都—哈萨克斯坦)JSQ捷达班列首发仪式在四川成都举行。 中新社记者 张浪 摄\n\n　　据介绍，铁路JSQ车是中铁特货公司服务整车运输的重要专业化装备。采用该方式组织汽车出口，可实现车辆集运、报关、发运等环节高效衔接，较传统集装箱运输运量提升约75%、运费降低约10%，能够有效提升整车装载效率和运输组织质效，为汽车企业降低综合物流成本、稳定国际交付周期提供有力支撑。\n\n　　据了解，此次班列开行，将制造基地、口岸平台和国际市场更加紧密地连接起来，为成都汽车企业拓展中亚市场提供了更加稳定、高效、经济的国际物流选择，也为中亚跨境整车运输探索形成可复制、可推广经验。\n\n　　下一步，成都将完善整车集运、口岸报关、国际联运等一体化服务，争取更多JSQ国际运力，推动成都至中亚整车出口运输常态化、规模化发展。(完)\n\n 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfaffb0c1d3","title":"民盟“留住乡愁”实践基地在湖北咸宁刘家桥揭牌","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734595.shtml","summary":"中新网咸宁11月19日电 (胡传林 冯东东 魏张昕)民盟“留住乡愁”实践基地18日在湖北咸宁市咸安区刘家桥揭牌，依托民盟资源优势助力古村落保护、非遗传承和乡村文化振兴。","summary_short":"中新网咸宁11月19日电 (胡传林 冯东东 魏张昕)民盟“留住乡愁”实践基地18日在湖北咸宁市咸安区刘家桥揭牌…","digest":"民盟“留住乡愁”实践基地18日在湖北咸宁市咸安区刘家桥揭牌…","points":["中新网咸宁11月19日电 (胡传林 冯东东 魏张昕)民盟“留住乡愁”实践基地18日在湖北咸宁…","刘家桥村拥有400余年历史，被誉为“楚天民俗第一村”","活动现场，民盟中央社会服务部一级巡视员段海溪，湖北省政协副秘书长…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:07:13+08:00","size":1,"keywords":[],"body":"中新网咸宁11月19日电 (胡传林 冯东东 魏张昕)民盟“留住乡愁”实践基地18日在湖北咸宁市咸安区刘家桥揭牌，依托民盟资源优势助力古村落保护、非遗传承和乡村文化振兴。\n\n　　刘家桥村拥有400余年历史，被誉为“楚天民俗第一村”。村落依山傍水，清溪穿村而过，一座砖木古廊桥历经岁月沧桑，巍然如故。村内古民居为典型徽派建筑，兼具明清古庄园格局，堂屋宽敞、巨梁横跨、雕梁画栋，屋宇相接、廊道迂回，村中至今仍留存诸多传统农耕器物。\n\n民盟“留住乡愁”实践基地在咸宁刘家桥揭牌。胡传林 摄\n\n　　活动现场，民盟中央社会服务部一级巡视员段海溪，湖北省政协副秘书长、民盟湖北省委专职副主委李涛，咸宁市委统战部部长、一级巡视员石玉华，咸宁市人民政府副市长、民盟咸宁市委主委刘红梅共同为基地揭牌。\n\n　　该基地将搭建民盟服务基层、赋能乡村的常态化平台，充分发挥民盟文化、教育、文艺界别优势，聚焦古村落活化利用、乡土文化挖掘、非遗技艺传承、乡村文旅提质，常态化开展调研走访、文化帮扶、实践服务，守护乡村历史文脉，留住乡土记忆，擦亮咸宁乡土文化名片。\n\n与会嘉宾观赏非遗作品蛋雕。胡传林 摄\n\n　　咸宁素有“中国桂花之乡”“楠竹之乡”美誉，桂花文化源远流长，楠竹资源储量丰厚，是当地发展生态文旅、壮大特色产业的重要根基。\n\n　　揭牌仪式后，调研组先后走进刘家桥村史馆、乡村记忆馆，通过史料、老物件、图文档案，深入了解村落发展脉络、宗族乡风与古村落保护现状。刘家桥古民居连片成群、古桥错落，是鄂南极具代表性的传统古村落。调研组重点调研咸宁桂花、楠竹两大特色资源。\n\n金丝龙舞非遗展演。胡传林 摄\n\n　　调研组现场观看鱼门拳、金丝龙舞非遗展演，观赏草木扎染、蛋雕、漆扇、古村民俗绘画等非遗作品，沉浸式感受鄂南非遗独特韵味。\n\n　　11月19日，调研组一行前往咸宁市规划展览馆、咸安区北伐汀泗桥战役纪念馆、向阳湖文化名人旧址调研。\n\n　　此次揭牌暨调研活动，是民盟中央投身乡村文化振兴、守护乡土文脉的具体实践。下一步，民盟各级组织将依托“留住乡愁”实践基地扎根咸宁，围绕古村落保护、非遗创新传播、特色产业赋能精准建言、扎实开展社会服务，推动咸宁文化资源优势转化为发展优势，让古村落焕发新生、非遗代代相传、乡愁绵延不绝，助推和美乡村建设提质增效。(完)\n\n 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd169f3c19b","title":"中国艺术团赴南非开普敦演出 共庆侨团成立十周年","url":"https://www.chinanews.com.cn/hr/2026/11-19/10734609.shtml","summary":"中新网约翰内斯堡11月19日电 “亲情中华·北京情思”慰侨演出暨开普敦华星艺术团、开普敦华助中心成立十周年庆典近日在开普敦巴克斯特剧院举行，中南两国各界人士700余人出席活动。","summary_short":"中新网约翰内斯堡11月19日电 “亲情中华·北京情思”慰侨演出暨开普敦华星艺术团…","digest":"“亲情中华·北京情思”慰侨演出暨开普敦华星艺术团…","points":["中新网约翰内斯堡11月19日电 “亲情中华·北京情思”慰侨演出暨开普敦华星艺术团…","中国驻开普敦代总领事王晓发表致辞说，中国与南非虽远隔重洋，但心意相通","南非全国省级事务委员会(议会上院)副主席莱斯·戈芬德在致辞中说，南中两国关系历久弥坚…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:06:35+08:00","size":1,"keywords":[],"body":"中新网约翰内斯堡11月19日电 “亲情中华·北京情思”慰侨演出暨开普敦华星艺术团、开普敦华助中心成立十周年庆典近日在开普敦巴克斯特剧院举行，中南两国各界人士700余人出席活动。\n\n　　中国驻开普敦代总领事王晓发表致辞说，中国与南非虽远隔重洋，但心意相通。期待以艺术为桥，加深相知互信，让中南民间友谊生生不息。\n\n　　南非全国省级事务委员会(议会上院)副主席莱斯·戈芬德在致辞中说，南中两国关系历久弥坚，文化与人文交流不断深化。期待两国进一步加强交流，在各个层面开展更多互动，促进文化领域深度合作，鼓励两国青年加强往来。\n\n图为与会嘉宾与演职人员合影。(主办方供图)\n\n　　本次演出节目丰富多元，开场群舞《唐印》《丝路古韵》《启·华章》率先拉开帷幕，以灵动舞姿重现华夏古风；北京歌剧舞剧院带来女子群舞《桃夭》，川剧绝技《变脸》惊艳全场；笛子独奏、琵琶与舞蹈《茉莉花》、民乐合奏《月下煮茶+爱拼才会赢》等节目，传递传统民乐之美。中国杂技团带来集体空竹《俏花旦》，技巧精湛；舞台还融合《我的非洲之梦》等当地艺术团体的特色节目。\n\n图为演出现场。(主办方供图)\n\n　　参与同台演出的开普敦艺术团成员表示非常荣幸能够和中国艺术家同台献艺，在舞台上亲身感受中华文化的魅力，也真切体会到中南文化交流的美好与意义。\n\n　　整场演出高潮不断，剧场座无虚席。现场观众亨德里克(Hendrik)女士感慨，自己年过七旬，这是她人生第一次欣赏到如此精彩的中国文化表演，舞台上的服饰、音乐、舞蹈都给她留下了极其深刻的印象。\n\n图为演出现场。(主办方供图)\n\n　　本次活动由中华全国归国华侨联合会(中国侨联)和北京市归国华侨联合会(北京市侨联)主办，首都文化科技集团和开普敦华星艺术团承办。\n\n　　南非开普敦华星艺术团团长董钢表示，2026年为中非人文交流年，这场精彩纷呈的文艺演出，充分展现了开普敦华星艺术团在融入当地主流文化生活，凝聚侨心、汇集侨力、传播中华优秀文化、促进侨社与本土社会交融的努力。(完)\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c719c98aff3","title":"2026年渝港澳职业技能大赛在重庆开幕","url":"https://www.chinanews.com.cn/dwq/2026/11-19/10734598.shtml","summary":"中新社重庆11月19日电 (梁钦卿)2026年渝港澳职业技能大赛19日在重庆工业博物馆开幕。","summary_short":"中新社重庆11月19日电 (梁钦卿)2026年渝港澳职业技能大赛19日在重庆工业博物馆开幕。","digest":"2026年渝港澳职业技能大赛19日在重庆工业博物馆开幕","points":["中新社重庆11月19日电 (梁钦卿)2026年渝港澳职业技能大赛19日在重庆工业博物馆开幕","132名来自重庆、香港、澳门和四川的选手和专家齐聚山城，围绕数字建造、餐厅服务、中式烹调…","本次大赛参照世界技能大赛、全国技能大赛的标准和流程，赛项设置对接城市更新、养老服务…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T14:05:59+08:00","size":1,"keywords":[],"body":"中新社重庆11月19日电 (梁钦卿)2026年渝港澳职业技能大赛19日在重庆工业博物馆开幕。132名来自重庆、香港、澳门和四川的选手和专家齐聚山城，围绕数字建造、餐厅服务、中式烹调、糖艺/西点制作、养老护理、美容6个赛项切磋交流。\n\n　　本次大赛参照世界技能大赛、全国技能大赛的标准和流程，赛项设置对接城市更新、养老服务、文旅消费升级的现实需求，兼顾地区产业特色。赛程为期3天，19日至20日为正式竞赛，21日进行颁奖。所有成绩合格的选手，同步获得职业技能等级证书与“一带一路”国际技能认证证书。\n\n　　在数字建造赛场，选手要运用建筑信息模型、物联网、大数据、人工智能、数字孪生、云计算等新一代信息技术，为一项建设工程构建覆盖策划、设计、施工、运维全生命周期的数字模型。\n\n　　“这两年数字建造技术变化很大，尤其是AI技术愈发成熟，让我重新学到不少东西。”来自香港的选手林芷浩受访说，这次比赛汇集众多参赛者，让他得以结识更多同行、拓展人脉，也想借这次比赛把已有知识系统温习一遍，再接触些新应用、新技术。\n\n11月19日，2026年渝港澳职业技能大赛在重庆工业博物馆开幕。图为选手正在参加美容项目比赛。梁钦卿 摄\n\n　　在餐厅服务赛场，水果拼盘、口布折花、餐台铺设，选手们一气呵成；中式烹调灶台前，热菜、冷菜与拼盘，均要讲究色、香、味、形俱全，厨房卫生同样纳入考核；糖艺/西点制作台面上，熬糖、拉糖、吹糖与烘焙技艺轮番登场，把甜蜜做成艺术品；养老护理赛场考核生活照料、基础照护、康复护理等项目；美容赛场则综合考核皮肤护理、身体护理、化妆、美甲、美睫、脱毛等项目，于方寸之间雕琢美丽。\n\n　　香港职业训练局技能比赛事务处处长马晓英表示，渝港澳三地在职业教育、技能培训和产业发展方面合作空间广阔，此次职业技能大赛正好为青年、院校和业界搭建平台，让大家以技能切磋交流、借赛事增进了解。\n\n　　澳门工会联合总会副理事长邝子丰表示，技能人才是粤港澳大湾区与重庆等西部地区联动发展的宝贵资源，期待渝港澳三地推动职业标准互认、培训资源共享、产业协同发展。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c78c75487ab","title":"跨越500多年，阳明心学如何“对话”前沿科技？","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734590.shtml","summary":"中新网杭州11月19日电(项菁)一名飞手轻推摇杆，无人机稳稳穿梭在山林之间，实现人机合一、静定飞行。","summary_short":"中新网杭州11月19日电(项菁)一名飞手轻推摇杆，无人机稳稳穿梭在山林之间，实现人机合一、静定飞行。","digest":"一名飞手轻推摇杆，无人机稳稳穿梭在山林之间，实现人机合一、静定飞行","points":["中新网杭州11月19日电(项菁)一名飞手轻推摇杆，无人机稳稳穿梭在山林之间，实现人机合一…","“操控贵在克制与敬畏，这恰是阳明先生‘知行合一’的生动映照","”长三角航空航天学会联盟轮值主席、浙江省航空航天学会常务副理事长金歆近日受访时如是表示"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T14:04:41+08:00","size":1,"keywords":[],"body":"中新网杭州11月19日电(项菁)一名飞手轻推摇杆，无人机稳稳穿梭在山林之间，实现人机合一、静定飞行。\n\n　　“操控贵在克制与敬畏，这恰是阳明先生‘知行合一’的生动映照。”长三角航空航天学会联盟轮值主席、浙江省航空航天学会常务副理事长金歆近日受访时如是表示。\n\n　　王阳明是明代思想家、心学集大成者，“心即理”“知行合一”“致良知”“万物一体”等思想蜚声中外。跨越500多年，这份古老智慧正与前沿科技相逢共生。\n\n　　浙江是王阳明的出生地、成长地和归葬地，多地至今留存着阳明遗迹。眼下，该省正持续推动阳明文化等优秀传统文化创造性转化、创新性发展，以“文化+科技”的深度融合，助力高水平文化强省建设。走出故纸典籍，心学思想正在专家学者、企业家、科技界人士的共同探索下，在前沿赛道释放独有的现代价值、东方智慧。\n\n游客参观浙江绍兴阳明故里景区。(资料图)项菁 摄\n\n　　阳明心学对话AI，筑牢人本伦理底线\n\n　　当机器开始思考，人类如何与之相处？当算法参与决策，安全如何保障？当技术挑战伦理，治理如何跟上？当鸿沟不断拉大，普惠如何实现？关于AI(人工智能)的四个“时代之问”发人深省。\n\n　　全球技术创新热度空前，发展机遇与治理压力并存。阳明心学思想，为解答上述问题提供了东方视角。\n\n　　国际儒学联合会副理事长、浙江省稽山王阳明研究院院长董平受访时指出，AI引发的“时代之问”，是人类必须直面的问题。阳明心学是起源于中国的一种哲学形态，实现其当代价值转换同样是时代命题。\n\n　　“机器能辅助或替代人类部分工作，但无法替代人的反思能力。”董平呼吁，AI时代，人类要始终筑牢人的主体性地位，让人工智能服务人的全面发展，同时希望通过更多学术研讨，引发全社会更多思考。\n\n　　面对新一轮科技浪潮，浙江正系统布局人工智能赛道，推动人工智能赋能千行百业，并明确到2030年，规上人工智能核心产业营业收入达1.2万亿元。产业加速奔跑的同时，技术伦理、人机边界的问题也备受关注。\n\n　　在某品牌汽车的智能座舱内，摄像头、拾音设备实时捕捉驾乘人员的情绪、语音信号后，系统便自动推送明快或舒缓的音乐，甚至推荐周边适合放松就餐的点位。AI正模拟人的驾驶逻辑，实现人、车、环境协同运行。\n\n　　“汽车作为复杂的集成智能体，本身就呼应着阳明心学‘万物一体’理念，如L4级、L5级自动驾驶就大量运用AI模拟人的驾驶思维。”专注汽车技术领域的新生代企业家王文斌受访时表示，发展智能汽车既要打破行业壁垒实现跨界协同，更要守住人机权责边界，以企业端的海量试验和打磨，向客户交付安全产品。\n\n　　产业实践的探索，也在学界引发更深层的伦理思辨。台湾东华大学荣誉讲座教授林安梧受访时表示，建议把阳明心学以及《四书》《五经》承载的中华经典思想，作为AI发展底层伦理的重要参照。在其看来，“知行合一”是一套动态灵活的思维方式，可为AI思考问题提供启发。人机相处重在感应与交互，而不是谁取代谁。\n\n　　就在近日召开的2026阳明心学大会上，“稽山论道”环节首次聚焦“心学如何回应‘时代之问’”主题，与会学者围绕人工智能是否具备“主体性”、能否实现“致良知”等展开研讨。此外，该大会还重点设置“AI视域下的阳明心学与现代伦理”议题。\n\n11月1日，2026阳明心学大会期间，“阳明心学与低空经济融合发展”主题活动现场。项菁 摄\n\n　　阳明心学对话硬核创新，校准科技前行方向\n\n　　除了为AI划定人本伦理底线之外，这套古老智慧也走出算法空间，为企业家探索科技创新树立价值标尺。\n\n　　近日，浙江省稽山王阳明研究院与哈尔滨工业大学正式达成合作，将开设首届“知行致新·阳明心学与硬科技企业家高级研修班”，面向科技领域企业家招生。\n\n　　哈尔滨工业大学高级管理培训中心主任马欣受访时介绍，该课程遵循“取势、明道、优术”三层逻辑，依托阳明心学思想，引导科技企业家明晰企业使命、愿景与价值取向，夯实企业文化根基，同时紧扣新兴产业及未来产业进行科学布局。“届时，九成课程设在绍兴，学员将走进阳明故里、阳明洞天、阳明墓等遗迹，实地体悟心学思想的时代内涵。”他说。\n\n　　传统文化贵在经世致用。航空航天、量子科技等前沿领域，正是心学智慧赋能创新的鲜活载体。科研之路充满变数，从实验室走向产业化，考验着从业者的定力、敬畏心与底线意识。坚守创新向善的价值追求，是技术行稳致远的必答题。\n\n　　周恩来总理侄女、中国新闻社原副社长周秉德受访时说，靠着前辈们的航空航天报国之志、一代代人的接续奋斗，中国航空航天事业不断前进，也为今天低空经济蓬勃发展打下基础。低空产业行稳致远，既依靠技术硬实力，也离不开技术伦理、安全底线等准则。阳明心学蕴含的“知行合一”“致良知”，可为科技创新和产业发展提供精神指引。\n\n　　放眼浙江，该省建有100多所中小学航空航天特色学校。这些学校把航空航天、工程科创、机器人实践纳入科普课程，同步融入阳明先生“知行合一”“事上磨”等思想，涵养青少年的科学敬畏之心、踏实求索的定力。\n\n　　“我们不光要教会孩子操控机器，更要让他们懂得人与机器的协调共生关系。像阳明先生一样，不论遇到任何事，都能‘静定’处理。”金歆说。\n\n10月14日，以王阳明墓为核心的阳明文化园。项菁 摄\n\n　　阳明心学对话数字世界，搭建世界文明交流桥梁\n\n　　当心学为科技发展划定底线、树立标尺，新技术也反过来助力东方智慧走出书斋、走向世界。\n\n　　前不久，多地联合打造的AI漫剧《别叫我阳明先生》上线多个短视频平台，迅速收获年轻受众。据了解，该剧以明代朝堂为背景，用通俗剧情拆解“致良知”等心学内核，借故事冲突讲透修心破局的人生智慧。\n\n　　作为参与方之一，绍兴市王阳明研究会副会长马士力受访时坦言，厚重晦涩的阳明文化表达，常让年轻人望而却步，AIGC(生成式人工智能)为古老思想打开轻量化传播新通道。\n\n　　不止AI漫剧，数字表达正持续拓宽阳明文化的传播边界。近年，浙江各地正统筹推进“文化+科技”深度融合，通过国际学术研讨、数字内容创作等多条路径，推动阳明文化实现体系化、常态化国际传播。\n\n　　例如身高180厘米的王阳明仿真机器人远赴保加利亚，当场书写“知行合一”引得当地民众驻足；余姚创新运用AIGC数字技术，打造双语系列微短剧《王阳明小故事》，面向海外华侨华人、华裔青少年群体传播。\n\n　　数字载体打通了出海通道，但语言壁垒、认知差异、转译偏差等难题，仍是阳明文化国际传播需要破解的考验。\n\n　　如何让东方古老思想真正被世界读懂？贵阳孔学堂文化传播中心党委书记、主任戴建伟受访时提到，当前国际主流大模型训练语料中，英文占比超九成，这就容易导致人们在转译、解读阳明心学等中华文化时出现原意偏差。想要用好AI这一传播载体，必须加快搭建高质量中文专属语料库，完整留存阳明心学的思想内涵与语境逻辑，为跨文化传播筑牢底座。\n\n　　德国汉学家、哥廷根大学荣休教授施寒微(Helwig Schmidt-Glintzer)则从技术伦理层面提出思考。他受访时说，阳明心学是珍贵的东方思想资源，无论技术如何迭代，人始终要掌握技术的主导权。他建议依托浙江成熟的产业基础与深厚的文化资源，持续推进阳明心学与前沿科技的交叉研究。\n\n　　为现代技术把舵领航，借数字之桥联通世界，古老心学正与前沿科技双向奔赴、彼此成就。科技向前，人心向善，这场跨越时空的对话，仍在继续。(完)\n\n 【编辑:万纪玮】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2783308147","title":"深圳APEC︱特朗普晤習近平 稱「美中同盼俄烏伊朗止戰」","url":"https://www.stheadline.com/realtime-china/3638855/深圳APEC特朗普晤習近平-稱美中同盼俄烏伊朗止戰","summary":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。","summary_short":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","digest":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","points":["深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行…","在三方會面之前，國家主席習近平就先與美國總統特朗普會晤，雙方就多項議程進行交流","中美元首先於19日下午進行會晤，根據《央視》畫面顯示，美方出席人員包括國務卿魯比奧…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T13:42:48+08:00","size":1,"keywords":[],"body":"深圳APEC期間最矚目的中美俄元首三方會晤定於19日下午在深圳麒麟山莊舉行，這亦是中美俄三國元首歷史上首次面對面三方會晤。在三方會面之前，國家主席習近平就先與美國總統特朗普會晤，雙方就多項議程進行交流。\n特朗普：美中存在特殊關係\n相關新聞：深圳APEC︱特朗普與普京會晤︱不斷更新\n中美元首先於19日下午進行會晤，根據《央視》畫面顯示，美方出席人員包括國務卿魯比奧、財長貝森特、商務部長盧特尼克、貿易代表格里爾、白宮幕僚長米勒、副幕僚長斯卡維諾，以及美國駐華大使龐德偉。\n中方出席人員包括外長王毅、財長藍佛安、外交部副部長馬朝旭，以及中共中央政策研究室主任唐方裕。畫面還顯示，國務院副總理何立峰、中央書記處書記蔡奇、國家發展改革委主任鄭柵潔，以及廣東省委書記黃坤明也出席會晤。\n會晤中，特朗普稱，雙方已經建立了一種公平的關係，「這正是我們所希望的」。他又對習近平表示，「你是我的朋友，我們之間有著非常特殊的關係」，更指其他任何地方的人都做不到他們所能做到的事。此外，特朗普表示，兩國以公平的方式分攤了關稅，而貿易委員會亦正為這種一度失衡的關係帶來平衡。\n習近平：願續與特朗普合作\n特朗普亦提到「30-for-30」協議——這是一項互惠安排，旨在各自削減約300億美元的關稅。「我們做得很好，你們也做得很好，」特朗普說，「我們的農民都受惠良多。」\n習近平同樣表示願意繼續與特朗普合作。他指出，目標是讓中美關係重回正軌。習近平隨後談及要建構戰略穩定的建設性關係，形容這項努力是「史無前例的」，並向特朗普表示：「我仍然致力於與您合作。」\n至於俄烏戰事方面，特朗普表示，美國與中國都希望看到烏克蘭戰爭結束。特朗普說：「我們希望在俄羅斯與烏克蘭的戰爭問題上提供協助。」他補充指出，雙方均盼望戰事早日平息，並提到目前每個月有約2萬5,000人喪生，當中大部分是士兵。\n特朗普又透露，自己稍早時間曾與普京會面，「只是為了給今天下午的三方會談作準備」。他說：「我認為我們或許會舉行一場成功的會晤。」\n中美皆期許霍峽暢通\n談及伊朗局勢，特朗普稱美國與中國都希望霍爾木茲海峽保持暢通。他表示，中美雙方均希望確保「能源能夠順利通過霍爾木茲海峽流通」，並且同意「伊朗不能擁有核武」。「我們倆對此都深有同感，」特朗普說。他還補充，除了地緣衝突外，美中之間仍有「許多其他潛在合作領域」可與習近平商討，例如合作解決美國的芬太尼危機。\n另據《路透社》之報道，普京與特朗普舉行雙邊會晤後「心情極佳」，烏克蘭問題是雙方討論的主要議題。\n相關新聞：深圳APEC︱中美俄三方峰會今登場 為何選址深圳麒麟山莊？\n根據外交部日前公布，三國元首圍繞維護世界和平及促進大國關係戰略穩定深入交換意見。三方會晤結束後，特朗普將直接從麒麟山莊前往深圳寶安國際機場，啟程返美。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7e376f7cc6","title":"《獅子山下》深圳響起 APEC晚宴迎賓顯心思 交響樂團奏各地名曲你識幾多首？｜有片","url":"https://news.tvb.com/tc/1207220-獅子山下深圳響起APEC晚宴迎賓顯心思交響樂團奏各地名曲你識幾多首有片","summary":"國家主席習近平與夫人彭麗媛，昨晚在深圳為出席亞太經合組織APEC會議的領導人舉行歡迎宴會。中方在迎接各領導人進場時盡顯心思，安排深圳管弦樂團，演奏各地名曲。","summary_short":"國家主席習近平與夫人彭麗媛，昨晚在深圳為出席亞太經合組織APEC會議的領導人舉行歡迎宴會。","digest":"國家主席習近平與夫人彭麗媛…","points":["國家主席習近平與夫人彭麗媛，昨晚在深圳為出席亞太經合組織APEC會議的領導人舉行歡迎宴會","中方在迎接各領導人進場時盡顯心思，安排深圳管弦樂團，演奏各地名曲","其中美國總統特朗普進場時，樂團奏起美國愛國歌曲《美麗的美利堅》"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T13:38+08:00","size":1,"keywords":[],"body":"國家主席習近平與夫人彭麗媛，昨晚在深圳為出席亞太經合組織APEC會議的領導人舉行歡迎宴會。中方在迎接各領導人進場時盡顯心思，安排深圳管弦樂團，演奏各地名曲。各位領導人進場時，顯得相當受落。\n\n其中美國總統特朗普進場時，樂團奏起美國愛國歌曲《美麗的美利堅》。特朗普特地停步欣賞，並向樂團鼓掌致意，還站在樂團前面，讓媒體拍照。樂團在俄羅斯總統普京進場時則奏起《俄羅斯舞曲》。此曲來自俄羅斯作曲家柴可夫斯基創作的經典芭蕾舞劇《胡桃夾子》，普京聽後亦面露微笑。\n\n至於日本首相高市早苗進場時，樂團奏起1960年代名曲《Sukiyaki》。此曲原名為《上を向いて歩こう》，中文翻譯為《昂首向前走》，由日本已故男歌手坂本九原唱。由於歌曲誕生之時，日本正值爆發反對修訂《日美安全保障條約》。有分析指，雖然曲中並無明顯反戰意味，但中方選擇在高市進場時演奏此曲，可謂別具心思。\n\n對於香港讀者而言，行政長官李家超進場時，樂團奏起《獅子山下》，相信不少人也有共鳴。","image":"https://pro-vod-cdn.tvb.com/e6ee15e79edb4221935992c03d947568/snapshots/4fe096a2b36d4d1e8e67abe9befdf67c-00008.jpg","video":"https://pro-vod-cdn.tvb.com/e6ee15e79edb4221935992c03d947568/45c9b8f6539445abaa877fb3d88d0d01-ed0d55d43db5436a2a2a2f0f5c3e2141-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/e6ee15e79edb4221935992c03d947568/snapshots/4fe096a2b36d4d1e8e67abe9befdf67c-00008.jpg","lang":"zh-Hant"},{"id":"c130b828e9e","title":"打造红色沉浸式空间 沪三大红色场馆亮相长三角文博会","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734555.shtml","summary":"中新网上海11月19日电 (记者 许婧)第七届长三角国际文化产业博览会19日在国家会展中心(上海)开幕。","summary_short":"中新网上海11月19日电 (记者 许婧)第七届长三角国际文化产业博览会19日在国家会展中心(上海)开幕。","digest":"第七届长三角国际文化产业博览会19日在国家会展中心(上海)开幕","points":["中新网上海11月19日电 (记者 许婧)第七届长三角国际文化产业博览会19日在国家会展中心(…","中共一大纪念馆携手中共二大会址纪念馆、中共四大纪念馆，以“光荣之城”主题亮相展会…","当天，主题交响音画《信仰之约》以快闪形式发布，作品以交响音乐与视听画面相结合的方式…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T12:46:41+08:00","size":1,"keywords":[],"body":"中新网上海11月19日电 (记者 许婧)第七届长三角国际文化产业博览会19日在国家会展中心(上海)开幕。中共一大纪念馆携手中共二大会址纪念馆、中共四大纪念馆，以“光荣之城”主题亮相展会，打造集品牌展示、产品体验、技术交流、合作洽谈于一体的综合性红色文化空间，形成一条可看、可玩、可互动、可体验的完整参观动线。\n\n　　当天，主题交响音画《信仰之约》以快闪形式发布，作品以交响音乐与视听画面相结合的方式，围绕建党历史与信仰主题展开艺术表达，不少观众循声聚拢、驻足观看，有人举起手机记录，有人随旋律轻声哼唱，现场气氛在音乐与画面的交融中逐渐升温。\n\n中共一大纪念馆携手中共二大会址纪念馆、中共四大纪念馆亮相第七届长三角国际文化产业博览会。　中共一大纪念馆供图\n\n　　上海是党的诞生地、初心始发地、伟大建党精神孕育地，承载着中国近现代史上重要的历史记忆。本次展台中，不仅展示中共一大会址标志性的石库门建筑，还将中共一、二、四大场馆的标志性门楣“搬”进展区。展台以三座石库门造型，串联起树德里、辅德里、广吉里三座与上海建党密切相关的历史建筑，以建筑意象勾勒早期建党历程，让观众循着建党脉络，在历史回响中汲取信仰力量。\n\n　　数字体验是本次参展的一大亮点。作为虚实融合共生的博物馆数智体验平台，VR体验区集中呈现了《数字一大·初心之旅》《数字一大·伟大征程》《力量之源·信仰堡垒》等多款数字化体验产品，形成人与物穿越山海、实与虚跨越时空的红色文化殿堂，让观众可以沉浸式体验中国共产党波澜壮阔的光辉历程，在“数字世界”中感受初心。\n\n　　当日舞台活动区还安排了观影与红色问答活动，观众在此歇脚之余，也能在寓教于乐的氛围中了解中国共产党的创建故事。展会期间，舞台活动区将轮番呈现丰富多元的红色文化体验。宣誓主题微电影以影像再现庄严时刻，让观众在光影中真切感受入党誓词的分量与温度。红色问答互动环节则以趣味竞答的方式，让党史知识在轻松氛围中入脑入心。现场还安排了专业讲解员，围绕中共一、二、四大场馆的历史脉络与展台亮点进行生动讲述，让观众在行走与聆听中读懂“光荣之城”的深厚底蕴。\n\n　　一大文创×英雄联名款新品同日发布，本次联名从一大会址的建筑与史料中提取设计元素，将红色记忆融入日常文具产品。《数字一大·初心之旅》南通站也正式发布，推动红色数字资源在更多城市传播共享。\n\n　　截至2025年底，“一大文创”已开发SKU(最小存货单位)900余个，覆盖十大领域，与36个品牌开展联名，形成“党的诞生地——树德里”“不忘初心”“馆藏文物与专题展览”“跨界联名合作”四大产品矩阵。本届长三角文博会期间，从“树德里”冰箱贴、笔记本，到与英雄钢笔合作的钢笔套装，红色文化正以年轻、潮流的方式走进日常。(完)\n\n 【编辑:梁异】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9135e69937","title":"（近观中国）一湾锦绣通亚太，习近平讲述“深圳大故事”","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734570.shtml","summary":"中新社深圳11月19日电 题：一湾锦绣通亚太，习近平讲述“深圳大故事”  　　中新社记者 黄钰钦  　　“深圳是一个有大故事的地方。","summary_short":"中新社深圳11月19日电 题：一湾锦绣通亚太，习近平讲述“深圳大故事”  　　中新社记者 黄钰钦  　　“深圳是一个有大…","digest":"题：一湾锦绣通亚太…","points":["11月18日晚，中国国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会…","他回忆起1978年第一次到深圳时的情景：“看到的还是一个小渔村","”弹指间40多年过去了，如今这里高楼林立、车水马龙"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T12:45:05+08:00","size":1,"keywords":[],"body":"中新社深圳11月19日电 题：一湾锦绣通亚太，习近平讲述“深圳大故事”\n\n　　中新社记者 黄钰钦\n\n　　“深圳是一个有大故事的地方。”\n\n　　南海之滨，灯火璀璨。11月18日晚，中国国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织(APEC)第三十三次领导人非正式会议的来宾。在祝酒辞中，习近平讲起了深圳的今昔。\n\n　　“看五十年的中国就来深圳。”习近平这样向来宾介绍这座城市。他回忆起1978年第一次到深圳时的情景：“看到的还是一个小渔村。”弹指间40多年过去了，如今这里高楼林立、车水马龙。\n\n11月18日晚，国家主席习近平和夫人彭丽媛在深圳国际交流中心举行宴会，欢迎出席亚太经合组织第三十三次领导人非正式会议的来宾。这是习近平发表致辞。新华社记者 姚大伟 摄\n\n　　今天的深圳，也走进了当晚的合影画面。背景墙上，深圳湾畔高楼错落，勾画出城市天际线。宴会开始之前，APEC大家庭在深圳的第一张“全家福”就在这里定格。\n\n　　怎样读懂深圳的“大故事”？习近平用了三个关键词：开放、创新、合作。这也是贯穿亚太经合组织发展历程的鲜明标识。\n\n　　“开放是深圳与生俱来的基因。”从边陲小镇到国际化大都市，从引进外资和技术到积极参与制定国际规则，深圳的成长始终与世界相连。\n\n　　放眼亚太，这样的故事同样发生在山海之间。30多年来，各经济体在开放融通中拓展发展空间。彼此依存，是亚太每天都在发生的现实。深圳联通四海的港口，也是这张合作网络中的繁忙节点。\n\n深圳深南大道绿化景观带上布设的APEC主题花坛。中新社记者 陈骥旻 摄\n\n　　“创新是深圳的活力所在。”习近平谈到这座城市的转变。从出口加工到自主研发，今天的深圳每年国际专利申请量近2万件，先进制造业和现代服务业比翼齐飞。\n\n　　创新同样关乎亚太的未来。面对新一轮科技革命和产业变革，如何把技术进步转化为共同发展的机遇，是各方相聚深圳的重要议题。从这座创新之城出发，探索创新驱动增长的路径，有着现实而具体的意义。\n\n　　“合作是深圳的力量之源。”习近平提起一句人们熟悉的话：“来了就是深圳人。”来自100多个国家和地区的国际化人才，在深圳汇聚。\n\n　　一座城市的包容与发展，呼应着一个区域的合作之道。正如习近平所说，亚太经济体突破地理限制和观念差异，积极投入区域合作的大舞台，创造了经济快速发展的“亚太奇迹”。\n\n俯瞰深圳城市景观。中新社记者 陈楚红 摄\n\n　　深圳的故事是中国改革开放的缩影，也是亚太合作的成功范例。从上海到北京再到深圳，中国三次主办APEC领导人非正式会议，见证着自身发展与亚太合作的紧密交融。宴会厅内的一处设计，让这份联系变得具体可感。\n\n　　在长长的宴会桌上，一幅中国山水微缩模型徐徐铺展。繁花掩映间流水蜿蜒，上海豫园、北京天坛、深圳深中通道与红树林融入其中。“一湾锦绣通亚太”，中国三座APEC东道主城市连在一起。\n\n　　从西雅图的初次握手到雁栖湖的历史盛会，从茂物目标到亚太共同体愿景，习近平在祝酒辞中回望亚太合作历程。开放、创新、合作，既解释着深圳这座城市的来路，也指向亚太共同前行的方向。\n\n　　“于道各努力，千里自同风。”习近平期待，在领导人会议上同各方共商亚太合作大计、共襄亚太发展大业。\n\n　　深圳湾畔的这一夜，城市的故事与亚太的故事交汇。关于未来的共同探索，也将从此刻的相聚延续到接下来的议程。(完)\n 【编辑:曹子健】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c691de452d6","title":"习近平对老龄工作作出重要指示","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734565.shtml","summary":"习近平对老龄工作作出重要指示强调  深入实施积极应对人口老龄化国家战略  努力让老年人的生活更加幸福美满  李强出席全国老龄工作会议并讲话  　　新华社北京11月19日电 中共中央总书记、国家主席…","summary_short":"习近平对老龄工作作出重要指示强调  深入实施积极应对人口老龄化国家战略  努力让老年人的生活更加幸福美满  李强出席全国…","digest":"习近平对老龄工作作出重要指示强调  深入实施积极应对人口老龄化国家战略  努力让老年…","points":["深入实施积极应对人口老龄化国家战略","努力让老年人的生活更加幸福美满","新华社北京11月19日电 中共中央总书记、国家主席…"],"section":"內地","category":"內地","source":"chinanews_china","source_display":"中新網 時政","published_at":"2026-11-19T12:21:40+08:00","size":1,"keywords":[],"body":"习近平对老龄工作作出重要指示强调\n\n深入实施积极应对人口老龄化国家战略\n\n努力让老年人的生活更加幸福美满\n\n李强出席全国老龄工作会议并讲话\n\n　　新华社北京11月19日电 中共中央总书记、国家主席、中央军委主席习近平近日对老龄工作作出重要指示指出，党的十八大以来，我国老龄工作取得新进展新成效，养老事业和养老产业快速发展，广大老年人获得感、幸福感、安全感持续增强。\n\n　　习近平强调，新征程上，要以新时代中国特色社会主义思想为指导，深入实施积极应对人口老龄化国家战略，坚持政府、市场、社会、家庭协同发力，进一步加强老年人社会保障、养老服务、健康服务、社会参与，大力发展银发经济，营造孝老敬老良好环境，建设老年友好社会，努力让老年人的生活更加幸福美满。\n\n　　全国老龄工作会议18日至19日在京召开。会上传达了习近平重要指示。中共中央政治局常委、国务院总理李强出席会议并讲话。\n\n　　李强在讲话中指出，习近平总书记的重要指示充分肯定我国老龄工作取得的新进展新成效，深刻阐明新征程上深入实施积极应对人口老龄化国家战略的方向路径和重点任务，具有很强的政治性、思想性、指导性。我们要认真学习领会，坚决贯彻落实。\n\n　　李强强调，要学深悟透习近平总书记关于老龄工作的重要论述，准确把握人口老龄化发展的阶段性特征，辩证看待人口老龄化带来的深刻影响，充分认识我国应对人口老龄化的独特优势，自觉增强做好老龄工作的责任感和主动性。要顺应人口老龄化发展的趋势变化，分层分类做好老龄工作，把握老年群体的年龄和健康状况差异，注重老有所养和老有所为相统筹；把握老年群体的经济条件差异，注重服务保障的梯度供给；把握老年群体的养老方式差异，注重居家社区机构服务贯通协调；把握老年群体的城乡区域分布差异，注重政策的均衡性和精准性。\n\n　　李强指出，要以增进老年人福祉为目标，着眼满足老年人美好生活需要，推进落实老龄工作重点任务。围绕老年人基本生活需求，稳步提高养老保障和服务水平；围绕老年人身心健康需求，不断加强健康促进和精神文化服务；围绕老年人价值实现需求，积极拓展其参与经济社会发展的空间；围绕老年人品质化消费需求，大力发展银发经济。要加强组织领导，强化统筹协调，凝聚各方合力，用心用情服务，为老龄工作提供坚强保障。\n\n　　国务委员、全国老龄工作委员会主任谌贻琴在总结讲话中表示，要深入学习贯彻习近平总书记关于老龄工作的重要论述和重要指示精神，认真落实李强总理讲话要求，锚定“十五五”目标任务，着力解决好老年人急难愁盼问题，不断满足老年人日益增长的美好生活需要，推动新征程老龄事业高质量发展。\n\n　　民政部、国家发展改革委、人力资源社会保障部、国家卫生健康委、北京市、浙江省、四川省负责同志作交流发言。\n\n　　吴政隆出席会议。\n\n　　全国老龄工作委员会委员，各省区市和计划单列市、新疆生产建设兵团，中央和国家机关有关部门、有关人民团体负责同志等参加会议。 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce69b8f703c","title":"【深圳APEC】APEC领导人非正式会议：普京笔不离手记重点 特朗普专注聆听","url":"https://www.chinanews.com/gn/shipin/cns-d/2026/11-19/news1075444.shtml","summary":"11月19日，APEC领导人非正式会议现场，普京笔不离手记重点，特朗普专注聆听。","summary_short":"11月19日，APEC领导人非正式会议现场，普京笔不离手记重点，特朗普专注聆听。","digest":"11月19日，APEC领导人非正式会议现场，普京笔不离手记重点，特朗普专注聆听","points":[],"section":"內地","category":"內地","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T12:44:19+08:00","size":3,"keywords":[],"body":"11月19日，APEC领导人非正式会议现场，普京笔不离手记重点，特朗普专注聆听。(记者 范思忆 制作 王雪尔）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/3AF07748F45048DC84FB75165DFBB8DB.mp4","video_poster":"","lang":"zh-Hans","items":[{"title":"【深圳APEC】APEC领导人非正式会议：普京笔不离手记重点 特朗普专注聆听","url":"https://www.chinanews.com/gn/shipin/cns-d/2026/11-19/news1075444.shtml","source_display":"中新視頻","published_at":"2026-11-19T12:44:19+08:00","category":"內地","digest":"11月19日，APEC领导人非正式会议现场，普京笔不离手记重点，特朗普专注聆听"},{"title":"【深圳APEC】APEC领导人非正式会议会场：双层同心圆座位，水墨屏风","url":"https://www.chinanews.
