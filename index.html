播出。《星島頭條》整合來年各大劇集、綜藝及新聞資訊節目的最爆看點。\n7大焦點劇集推介\n劇集新賽道：首開「豎屏短劇」及「迷你劇」\n王牌綜藝節目：多元真人騷大混戰\n慶典特備節目 ＆ 新聞資訊\n相關閱讀：TVB節目巡禮2027大合照排位曝光 高海寧張曦雯爭一姐 陳煒被邊緣化（附花旦性感美照）\n7大焦點劇集推介\n來年翡翠台黃金檔期強陣出擊， 7 大焦點劇集（排名不分先後）分別是《驅魔速遞》、《超時空男臣II》、《警是個大佬》、《模仿人生》、《枱底》、《模範律師團》及《新聞女王III》，其中《驅魔》、《男臣II》及《新聞女王III》的宣傳片是首度曝光。：\n 劇集名稱 領銜主演 / 陣容 核心看點與最新預告 《驅魔速遞》 陳曉華（Hera）、周嘉洛、吳偉豪、戴祖儀 靈異驅魔結合精彩打鬥。陳曉華以冷艷黑絲速遞魔女造型登場，大晒超強腿功；戴祖儀則以「魚網High Kick」迎戰，期待值爆燈！ 《超時空男臣II》 蕭正楠、曹永廉、何廣沛 首繼續大玩搞笑穿越。三子現身銅鑼灣，以一杯「廢水」三份飲重現經典畫面，今次任務是要在現代尋找太子及公主。 《新聞女王III》 佘詩曼（飾 文慧心Man姐） 預告片以文慧心（佘詩曼飾）媽咪阮雪君（夏文汐飾）離奇失蹤揭開序幕，中間還加插了阮雪君致電Man姐求救片段，感覺緊湊。 《警是個大佬》 林盛斌、羅子溢、王敏奕、容天佑、傅嘉莉、賴慰玲、張馳豪、鄧智堅、陳若思、徐榮\n 焦點警匪大製作。黑幫龍頭高天（林盛斌 飾）遇伏重傷昏迷，靈魂意外附身於正直交通警家佑體內。家佑（羅子溢 飾）被迫遭革職並以臥底身份重返社團，在追查暗殺真相與保護高天女兒方廷（王敏奕 飾）的過程中產生微妙情愫；面對背叛社團的義子與錯綜複雜的江湖風暴，展開笑中有淚的救贖行動。 《模仿人生》 袁詠儀、江美儀、張曦雯、張振朗、羅子溢、關禮傑 慘遭凌辱墜海的魏嘉欣，被商業特務溫敏救起，整容化身設計師「許玥」潛入敵營復仇。豈料溫敏背後藏著「身分互換」的驚天秘密，許玥驚覺自己只是溫敏奪回人生的復仇棋子。\n 《枱底》 羅子溢、張振朗、陳展鵬、蔡潔、劉佩玥、陳楨怡、莊思敏及郭珮文 劇組首次採用 「虛擬拍攝 + AI 場景 + 真人拍攝」 的融合模式。富二代高偉豪（羅子溢飾）遠赴東南亞闖蕩，建立網上賭博帝國，欲將生意洗白；豈料與他並肩作戰的生死之交林家安（張振朗飾），竟是奉命剿滅他的臥底親兄弟。\n 《模範律師團》 羅嘉良、楊茜堯、陳煒、張曦雯、滕麗名、劉佩玥、何廣沛 殿堂大狀潘澤生（羅嘉良 飾）引退，引爆「首席」繼承戰！愛徒歐皓澄（楊茜堯 飾）為爭上位，與同門師姐明爭暗鬥，化身亦正亦邪的「殺人大狀」。此時，潘澤生與宿敵高淑樺（陳煒 飾）的權鬥亦白熱化。一場神秘爆炸案突然發生，揭開兩代律師驚天陰謀，正邪界線徹底崩潰！\n 返回目錄\n劇集新賽道：首開「豎屏短劇」及「迷你劇」\n迎合網絡新趨勢，TVB在2027年將開拓全新影視賽道，開拍現時在內地極之流行的豎屏短劇，頭炮作品是經典IP《金枝慾孽》番外篇《金枝慾孽之宮牆折柳》，以最爆節奏重現經典，勢必引爆全網追劇熱潮！\n1. 經典IP番外篇豎屏短劇\n首發頭炮為《金枝慾孽之宮牆折柳》，以節奏極爆的豎屏格式重現經典！\n 6大主角陣容及角色造型率先公開：陳豪、龔嘉欣、陳自瑤、倪嘉雯、阮浩棕、陳楨怡。\n\n2. 與騰訊攜手打造「重現經典」迷你劇\n除豎屏短劇，TVB來年更會與騰訊攜手打造多套迷你劇，以全新規格重現TVB經典IP，塑造神劇回憶殺。\n 《宮心計·摘星》\n\n 《重案追兇》（主打「全城同步破案」）\n\n 《衝上雲霄·愛與夢飛行》\n\n 香港重案故事系列：《龍頭篇》、《狂徒篇》、《賊王篇》\n\n返回目錄\n王牌綜藝節目：多元真人騷大混戰\n來年的綜藝節目題材極之豐富，有《家家有本美味的經》、《大丈夫步步為營》、《姐姐的契約》、《明星Body Check》、《大灣區小明星》、《鑽石戀愛計劃》以及《試真D》第三輯。當中最引爆期待的，絕對是由「金牌媒人」林盛斌主持的全新戀綜真人騷《鑽石戀愛計劃》。\n 節目名稱 主持 / 嘉賓陣容 節目亮點 《鑽石戀愛計劃》 林盛斌（Bob） 全新中年單身人士戀綜真人騷。無論是藝人還是素人，只要想「好好戀愛」都可以參加。 《姐姐的契約》 四組頂流「三高」女強人（有人年薪高達八位數） 紀錄式綜藝。探討高學歷、高收入、高職位女性在「愛情與麵包」之間的妥協與堅持。 《大丈夫步步為營》 羅子溢、洪永城 「背妻出走」旅遊特輯！深入阿壩縣、蓮寶葉則、白石崖及桑科草原等隱世靚景，羅子溢更興奮高呼「好在冇帶老婆嚟」！ 《家家有本美味的經》 李家鼎、肥媽、李泳豪、陸浩明 「真‧假父子母子檔」踩上藝人及素人家中打開「冰箱盲盒」，即興大搞無菜單料理。 其他期待作 - 《明星Body Check》、《大灣區小明星》、《試真D》（第三輯） 返回目錄\n慶典特備節目 ＆ 新聞資訊\n為迎接香港特區成立30周年及TVB 60周年，多個重量級特備節目及新聞資訊節目亦將陸續登場：\n 《藝員訓練班》：演技競賽真人騷！結合經典IP，由影帝曾志偉擔任主考官，將藝訓班直接搬上舞台同台鬥戲！\n\n 周年慶典系列：《30年的奇蹟》、《三生有幸去黐餐》、《民宿強人》、《遊戲天團》、《星廚》、《中年好聲音5》、《勁歌金曲演唱會》。\n\n 新聞台（83台）焦點：\n 《大同之路》：由陳貝兒主持，深入探討國家政策。\n\n 《醫生，你有病？》第二季：口碑醫學節目載譽歸來。\n\n TVB FF 工作室精心打造的A.I. 微動畫：《東張三俠》《社畜求生102》\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd9d823e7b8","title":"陳展鵬首做主持緊張對稿 王祖藍派定心丸︰表現唔似第一次","url":"https://www.stheadline.com/film-drama/3639662/陳展鵬首做主持緊張對稿-王祖藍派定心丸表現唔似第一次","summary":"陳展鵬、王祖藍、關心妍、黃劍文、葉蒨文、林俊其、羅毓儀等人今日（11月21日）錄影節目《弊傢伙！","summary_short":"陳展鵬、王祖藍、關心妍、黃劍文、葉蒨文、林俊其、羅毓儀等人今日（11月21日）錄影節目《弊傢伙！","digest":"陳展鵬、王祖藍、關心妍、黃劍文、葉蒨文、林俊其、羅毓儀等人錄影節目《弊傢伙","points":["陳展鵬、王祖藍、關心妍、黃劍文、葉蒨文、林俊其、羅毓儀等人今日（11月21日）錄影節目《弊傢…","陳展鵬、王祖藍受訪，陳展鵬直言第一次做主持，心情有少許緊張，「好彩有祖藍喺度…","」王祖藍大讚他的表現說：「唔使tips，頭先表現都唔似第一次啦"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:45:09+08:00","size":1,"keywords":[],"body":"陳展鵬、王祖藍、關心妍、黃劍文、葉蒨文、林俊其、羅毓儀等人今日（11月21日）錄影節目《弊傢伙！有嘢唔見咗！》。陳展鵬、王祖藍受訪，陳展鵬直言第一次做主持，心情有少許緊張，「好彩有祖藍喺度，一入到化妝間就同佢度一度（稿），已經定好多。」王祖藍大讚他的表現說：「唔使tips，頭先表現都唔似第一次啦！」\n王祖藍笑「雞髀文」爆紅\n提起同場的黃劍文，王祖藍也不忘笑說：「咩呀，佢唔係姓黃，而家係姓『雞』，名『髀文』㗎嘛，哈哈哈！」陳展鵬也提起自己有同類經歷，試過差一點得獎。葉蒨文受訪，坦言對自己的腦力無自信，笑說：「以前我漏咗部車喺街！」原來她晚上駕車去做gym，但做完就回家，翌日，葉蒨文的媽媽，即登記車主收到告票後，她才記得，直言有「腦霧」。有記者問起俞可程被踢爆拍拖一事，她指與俞可程不熟，不了解事件，最好留待公司處理。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbc750263ab","title":"BIGBANG首獻唱新歌 MAMA獲最佳MV及願景獎 太陽錯過兒子生日落淚","url":"https://www.stheadline.com/film-drama/3639669/BIGBANG首獻唱新歌-MAMA獲最佳MV及願景獎-太陽錯過兒子生日落淚","summary":"「2026 MAMA頒獎禮」今日（21日）在日本大阪京瓷巨蛋舉行第2日典禮，韓國天團BIGBANG憑新歌《BiiiG》奪得「最佳MV」，G-Dragon、太陽及大聲三人同上台領獎。","summary_short":"「2026 MAMA頒獎禮」今日（21日）在日本大阪京瓷巨蛋舉行第2日典禮…","digest":"「2026 MAMA頒獎禮」在日本大阪京瓷巨蛋舉行第2日典禮…","points":["「2026 MAMA頒獎禮」今日（21日）在日本大阪京瓷巨蛋舉行第2日典禮…","其後，太陽再憑《LIVE FAST DIE SLOW》獲頒「最佳個人男子舞蹈表演」…","他亦向G-Dragon及大聲致意，直言因為有二人才有BIGBANG"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T19:24:00+08:00","size":1,"keywords":[],"body":"「2026 MAMA頒獎禮」今日（21日）在日本大阪京瓷巨蛋舉行第2日典禮，韓國天團BIGBANG憑新歌《BiiiG》奪得「最佳MV」，G-Dragon、太陽及大聲三人同上台領獎。其後，太陽再憑《LIVE FAST DIE SLOW》獲頒「最佳個人男子舞蹈表演」，他在台上向妻子閔孝琳及家人致謝，提到上星期是兒子生日，自己因工作未能陪伴，一度哽咽落淚，並連聲致歉，惹來全場掌聲。他亦向G-Dragon及大聲致意，直言因為有二人才有BIGBANG。\nGD新長髮造型示人\nBIGBANG今次亦首度在頒獎禮上獻唱新歌《GiiiRIP》。該曲於昨日才發行，由G-Dragon參與作詞作曲，太陽亦參與填詞。G-Dragon以全新長髮造型亮相，成為全場焦點。演出結束後，BIGBANG再捧走「年度音樂願景獎」，GD笑言披長髮很辛苦，太陽及大聲搞笑為他撥頭髮。\n新人男團CORTIS憑《REDRED》奪得「年度歌曲」大獎，成員上台領獎時都眼泛淚光。他們早前已憑《REDRED》獲「最佳舞蹈表演男子組合」及「TOP10最佳歌曲」。重組後的I.O.I則憑《Suddenly》同獲「TOP10最佳歌曲」。其他獲獎者方面，LE SSERAFIM與J-Hope合作的《Spaghetti》奪得「最佳合作」，ILLIT的《It’s Me》獲「最佳舞蹈表演女子組合」，華莎憑《Good Goodbye》及IVE憑《Bang Bang》亦入選「TOP10最佳歌曲」，華莎再摘下「最佳個人歌唱演出」。IVE昨日已擊敗BLACKPINK、LE SSERAFIM等組合獲封「最佳女團」。男團ZEROBASEONE則獲得「最喜愛跳唱組合」。\nBTS捧走年度專輯\nMAMA分兩日舉行，第1日由防彈少年團（BTS）及ENHYPEN分獲「年度藝人」、「FANS' CHOICE年度大賞」等大獎。BTS今日再憑《ARIRANG》捧走「年度專輯」。\n此外，「第68屆日本唱片大獎」今日公布得獎名單，頒獎典禮將於下月30日舉行。CORTIS與與CUTIE STREET及Number_i獲頒「特別國際音樂獎」，其中CORTIS出道僅1年3個月，創下該獎項歷來最短獲獎紀錄。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf4cce72924","title":"新界校長會AI評審徵文比賽 近2800份作品建寫作數據庫","url":"https://www.stheadline.com/ohpama/3639643/新界校長會AI評審徵文比賽-近2800份作品建寫作數據庫","summary":"新界校長會為慶祝中華人民共和國成立77周年，舉辦「卓標盃」徵文比賽，旨在引導學生關注國家發展進程、反思國民身份認同，並推動學界學術交流。","summary_short":"新界校長會為慶祝中華人民共和國成立77周年，舉辦「卓標盃」徵文比賽，旨在引導學生關注國家發展進程、反思國民身份認同…","digest":"新界校長會為慶祝中華人民共和國成立77周年，舉辦「卓標盃」徵文比賽…","points":["新界校長會為慶祝中華人民共和國成立77周年，舉辦「卓標盃」徵文比賽…","本屆賽事共吸引150間中小學參與，接獲約2,800篇作品","為提升評核效率與準確度，新界校長會首次引入人工智能（AI）工具協助篩選作品…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:34:32+08:00","size":1,"keywords":[],"body":"新界校長會為慶祝中華人民共和國成立77周年，舉辦「卓標盃」徵文比賽，旨在引導學生關注國家發展進程、反思國民身份認同，並推動學界學術交流。本屆賽事共吸引150間中小學參與，接獲約2,800篇作品。為提升評核效率與準確度，新界校長會首次引入人工智能（AI）工具協助篩選作品，為學界大型寫作比賽開創全新的評估模式。\n比賽分為四個組別：初小組有51間學校參與（約553篇）、高小組67間（約803篇）、初中組54間（約638篇）、高中組50間（約806篇）。另有16間中小學因逾期遞交，其207篇作品雖不獲評審，但大會仍頒發參與證書以作鼓勵。\n恭喜得獎的同學們。\n頒獎禮已於11月20日舉行。初小組冠軍由仁濟醫院蔡衍濤小學王紫鈺奪得，高小組冠軍為光明英來學校虞博文；初中組及高中組冠軍分別是循道衞理聯合教會李惠利中學王秋琳、佛教筏可紀念中學李雅雯。\n新界校長會會長朱景玄表示，本屆賽事首次採用「兩輪AI＋教師校準」評審機制。首階段由AI對手寫作品進行文字識別及按標準初評；次階段由教師評審團抽樣5%至10%進行人手批改，以校準AI的評分偏差；第三階段由AI在學習教師批改結果後，對全數作品進行二次評審，得出初賽成績，最終賽果則由評審團落實。\n恭喜得獎的同學們。\n朱會長指出，AI在切題、結構及字數規範上的判斷與教師相當接近，評分標準亦全面對照文憑試中文科卷二。至於創意與情感等具備人性特質的元素，均交由教師親自確認，確保整個機制屬「人機協作」，而非取代教師。\n透過AI系統的初步分析，大會發現參賽學生的寫作水平出現正面轉變。學生不僅對國家發展有更深入的認識，能將航天科技、高鐵及大灣區生活體驗融入文中，高小及初中組別更能善用具體事例與細節描寫，不再流於空喊口號。此外，不少學校為賽事安排校內寫作訓練，有效帶動整體寫作風氣。\n朱會長表示，AI系統為全數2,800份參賽作品提供個人化AI批改與評語，比賽結束後將派回參賽學生參考，並作為教師課堂指導的實用參考。大會期望經過本屆比賽後，這種「AI初篩＋教師把關」模式可建立大型寫作數據庫，未來能與教育局分享經驗，為推動電子學習與評估提供第一手實證參考。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c806ab7c45d","title":"54件西藏勉唐画派唐卡亮相江西 呈现文化交融之美","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735788.shtml","summary":"中新网南昌11月21日电 (记者 李韵涵)“如意度量 五彩意境——西藏勉唐画派唐卡艺术展”21日在江西省博物馆开展，54件唐卡作品集中亮相，呈现文化交融之美。","summary_short":"中新网南昌11月21日电 (记者 李韵涵)“如意度量 五彩意境——西藏勉唐画派唐卡艺术展”21日在江西省博物馆开展…","digest":"“如意度量 五彩意境——西藏勉唐画派唐卡艺术展”21日在江西省博物馆开展…","points":["中新网南昌11月21日电 (记者 李韵涵)“如意度量 五彩意境——西藏勉唐画派唐卡艺术展”2…","据江西省博物馆介绍，该馆策划推出民族文化系列展览，并联合西藏博物馆呈现西藏勉唐画派唐卡艺术展","作为该系列首展，这也是内地首个勉唐画派唐卡专题展览，共遴选唐卡作品54件…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:31:08+08:00","size":1,"keywords":[],"body":"中新网南昌11月21日电 (记者 李韵涵)“如意度量 五彩意境——西藏勉唐画派唐卡艺术展”21日在江西省博物馆开展，54件唐卡作品集中亮相，呈现文化交融之美。\n\n　　据江西省博物馆介绍，该馆策划推出民族文化系列展览，并联合西藏博物馆呈现西藏勉唐画派唐卡艺术展。作为该系列首展，这也是内地首个勉唐画派唐卡专题展览，共遴选唐卡作品54件，珍贵文物占比达87%。\n\n11月21日，“如意度量 五彩意境——西藏勉唐画派唐卡艺术展”在江西省博物馆开展。记者 李韵涵 摄\n\n　　据了解，唐卡作为西藏绘画艺术的重要形式，其生成与发展并非单一文化传统的结果，而是在西藏本土艺术的基础上，广泛吸收中原地区以及尼泊尔、印度等地的绘画艺术元素，在长期交融互鉴中逐渐形成的综合性艺术体系。\n\n　　展览前言中写道，唐卡艺术在历史长河中积淀成长，流派纷呈。勉唐画派作为其中的重要代表，展现了西藏唐卡艺术的独特魅力，也承载着中华各民族交往交流交融的历史记忆。\n\n　　展览之余，江西省博物馆还推出“汉藏交融·匠心传承——勉唐唐卡艺术美学之旅”系列文化活动。该活动以勉唐画派古法度量体系为依托，选取祥云、卷草、莲花等纹样，以标准化唐卡线稿为载体，邀请观众亲手勾勒、落笔描摹，在起笔收线间体悟线条的规整法度与构图的秩序之美，感知传统唐卡“依度而立、循法而美”的创作内核。\n\n　　“唐卡上人物的衣纹和繁复的花饰，远看十分匀整，但细看又处处有变化。”前来观展的游客毛梓倩告诉记者，自己此前对唐卡艺术了解不多，但细看之下也能感受到一些熟悉的审美趣味，中华文化的丰富多彩，在这一刻变得很直观。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"caf04009306","title":"陳偉霆老婆何穗帶兒子公園草地嬉戲 「小太陽」身穿熊仔衫好動活潑 網民指一部位似媽媽","url":"https://www.stheadline.com/film-drama/3639638/陳偉霆老婆何穗帶兒子公園草地嬉戲-小太陽身穿熊仔衫好動活潑-網民指一部位似媽媽","summary":"40歲的陳偉霆與內地超模何穗去年10月無預警下在社交平台報喜，宣布已誕下一子「小太陽」並已經結婚。","summary_short":"40歲的陳偉霆與內地超模何穗去年10月無預警下在社交平台報喜，宣布已誕下一子「小太陽」並已經結婚。","digest":"40歲的陳偉霆與內地超模何穗去年10月無預警下在社交平台報喜…","points":["40歲的陳偉霆與內地超模何穗去年10月無預警下在社交平台報喜…","不過這對新手父母對家庭生活極為保護，鮮有公開放閃","日前何穗分享與兒子的日常，寫道「好愛我的每一天」，並帶寶貝仔到戶外草地親近大自然"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:30:45+08:00","size":1,"keywords":[],"body":"40歲的陳偉霆與內地超模何穗去年10月無預警下在社交平台報喜，宣布已誕下一子「小太陽」並已經結婚。不過這對新手父母對家庭生活極為保護，鮮有公開放閃。日前何穗分享與兒子的日常，寫道「好愛我的每一天」，並帶寶貝仔到戶外草地親近大自然。雖然爸爸陳偉霆未有出鏡，但畫面中兩母子的溫馨互動，已隔空傳遞出無限的家庭幸福。\n陳偉霆兒子手腳修長似超模媽媽\n當日何穗與囝囝穿上同色系的親子裝，時尚感十足，何穗身穿一件深啡色羊毛外套，內搭白色T恤，下身配上深啡色貼身運動褲，完美勾勒出筆直纖細的逆天長腿，保暖之餘又不失時尚氣場。而兒子「小太陽」則化身一隻「毛毛小熊」，穿上一件啡白相間的毛衣，帽子上還附有一雙可愛的熊耳朵。年僅一歲的「小太陽」在草地上站立時，手長腳長的比例顯而易見，完美遺傳了超模媽媽及高大爸爸的神級基因，絕對是個不折不扣的小型男。\n相關閱讀：陳偉霆一家三口度假激罕被捕獲 帶雙保姆照顧兒子 趁老婆行街William做一事\n何穗幫可愛囝囝拍照母愛滿瀉\n何穗與兒子在公園中玩得不亦樂乎，而何穗不時蹲下身子，滿臉笑容地用手機與兒子自拍，兒子亦非常配合地對著鏡頭揮手。期間兒子匆匆撲向媽媽扭計要抱抱，何穗則一臉寵溺地將兒子緊緊擁入懷中，畫面溫馨滿瀉。隨後何穗一邊推著嬰兒車，一邊牽著兒子在落葉滿地的步道上緩緩散步，而何穗亦不禁在清幽的草地上自拍，舉手投足深具超模風範。\n相關閱讀：陳偉霆80歲凍齡靚媽罕現身 餅印母子樣成焦點 陳母獲子孝順住億元豪宅","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce08317657b","title":"全国青少年软式棒垒球校园联赛走进宁夏固原","url":"https://www.chinanews.com.cn/ty/2026/11-21/10735784.shtml","summary":"中新网固原11月21日电 (记者 杨迪)11月21日，2026全国青少年软式棒垒球校园联赛·固原分站赛在固原市体育馆正式开赛，来自当地4所小学的8支队伍、百余名少年选手…","summary_short":"中新网固原11月21日电 (记者 杨迪)11月21日，2026全国青少年软式棒垒球校园联赛·固原分站赛在固原市体育馆正式…","digest":"11月21日，2026全国青少年软式棒垒球校园联赛·固原分站赛在固原市体育馆正式开赛…","points":["中新网固原11月21日电 (记者 杨迪)11月21日…","本次赛事由中国垒球协会主办，固原市教育体育局、宁夏棒垒球协会承办…","近年来宁夏棒垒球运动发展迅速，宁夏棒垒球协会持续联动中国棒球协会、中国垒球协会…"],"section":"生活","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:24:27+08:00","size":1,"keywords":[],"body":"中新网固原11月21日电 (记者 杨迪)11月21日，2026全国青少年软式棒垒球校园联赛·固原分站赛在固原市体育馆正式开赛，来自当地4所小学的8支队伍、百余名少年选手，在赛场上展现协作拼搏的棒球精神。\n\n比赛现场。固原市新闻传媒中心供图\n\n　　本次赛事由中国垒球协会主办，固原市教育体育局、宁夏棒垒球协会承办，这是固原首次承办该项全国性棒垒球校园赛事。\n\n比赛现场。固原市新闻传媒中心供图\n\n　　赛场上，棒球少年们激烈对抗，攻守交替，全力以赴，击球声与欢呼声交织，气氛紧张热烈。\n\n　　据了解，近年来宁夏棒垒球运动发展迅速，宁夏棒垒球协会持续联动中国棒球协会、中国垒球协会、MLB等国家级、行业头部资源，搭建“青苗计划筑基、种子教师赋能、以赛促练闭环”的本土化发展路径，推动棒垒球运动从银川向固原、中卫、吴忠等各地市县校园有序铺开，打造具有宁夏特色的棒垒球青少年人才培育生态。\n\n　　在人才启蒙端，该协会落地青苗计划，面向宁夏中小学开展棒垒球进校园公益普及。依托中国棒球协会国手公益资源，面向低龄学生开展兴趣启蒙，广泛发掘运动苗子，建立宁夏青少年棒垒球人才储备库。\n\n　　在师资支撑端，宁夏棒垒球协会重点推进种子教师培育工程，定期组织宁夏中小学体育教师、基层教练员专项培训，邀请国手教练、国家级讲师授课，打造一批“留得住、教得好”的本土种子教练队伍。\n\n　　在竞赛体系端，该协会承接全国青少年软式棒垒球校园联赛等国家级赛事资源，搭建“校园校内赛—市级分站赛—全区选拔赛—全国总决赛”四级赛事链条。\n\n　　宁夏棒垒球协会负责人王建彬表示，下一步，该协会将稳步扩大青苗计划覆盖学校数量，常态化开展种子教师培训，持续在宁夏各地落地各级棒垒球赛事。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c98510f0d7e","title":"七十载笔墨传薪 《作家》搭建中外文学对话桥梁","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735782.shtml","summary":"中新网长春11月21日电 (李彦国 高龙安)推动吉林文学高质量发展暨《作家》杂志创刊70周年主题系列活动，21日在长春举行。","summary_short":"中新网长春11月21日电 (李彦国 高龙安)推动吉林文学高质量发展暨《作家》杂志创刊70周年主题系列活动…","digest":"推动吉林文学高质量发展暨《作家》杂志创刊70周年主题系列活动，21日在长春举行","points":["中新网长春11月21日电 (李彦国 高龙安)推动吉林文学高质量发展暨《作家》杂志创刊70周年…","《作家》杂志深度参与中国当代文学发展进程，培养了一大批文学新人…","《作家》杂志于1956年创刊，初名《长春》，1983年更为现名，被誉为中国“先锋文学重镇”"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:18:21+08:00","size":1,"keywords":[],"body":"中新网长春11月21日电 (李彦国 高龙安)推动吉林文学高质量发展暨《作家》杂志创刊70周年主题系列活动，21日在长春举行。《作家》杂志深度参与中国当代文学发展进程，培养了一大批文学新人，同时大力推动中国作家作品“走出去”，促进中外文学交流。\n\n　　《作家》杂志于1956年创刊，初名《长春》，1983年更为现名，被誉为中国“先锋文学重镇”。1985年，韩少功阐述“寻根文学”主张的《文学的“根”》在此刊发。毕飞宇的《哺乳期的女人》、徐坤的《厨房》、潘向黎的《白水青菜》分别获第一、二、四届鲁迅文学奖。格非《江南三部曲》获第九届茅盾文学奖。今年7月，第九届鲁迅文学奖揭晓，全勇先《秘密》斩获中篇小说奖。\n\n5月16日，在位于长春的吉林文学馆，读者在参观《作家》杂志的往期封面。(资料图) 高龙安 摄\n\n　　中国作家协会副主席、书记处书记吴义勤表示，《作家》杂志是中国当代文学版图上极具标识性的刊物，以开阔的世界性视野，搭建起中国文学与世界文学对话交流的重要窗口。\n\n　　据悉，《作家》杂志曾译介《纽约客》《大西洋月刊》等世界名刊的精彩文章，首发多位世界知名作家的小说及访华演讲稿，以专题小辑形式翻译介绍欧美及东北亚国家颇具影响力的作家作品。\n\n　　《作家》杂志主编宗仁发介绍，2000年该杂志改版，在视觉设计上融入更多国际化元素，便于海外传播。2015年，《作家》杂志与俄罗斯《冰与火》杂志合作开展中俄当代文学作品互译工作，将18位当代俄罗斯作家的作品译介到中国，又将11位中国作家的作品译介到俄罗斯。\n\n　　《作家》杂志长期关注海外华人作家动态，并与他们保持紧密联系，多年来，刊发了相当数量的海外华人作家作品，在海内外文坛形成了一定的影响力。\n\n　　当天，“时代文学奖”征集信息正式发布。该奖项由《作家》杂志社与时代文艺出版社共同推出，面向全球征集华文原创作品，以奖促创、以奖育才。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cec9c941e52","title":"樊亦敏攬離巢凱恩送祝福 歐瑞偉早年做替身撞傷致左右面唔對稱","url":"https://www.stheadline.com/film-drama/3639627/樊亦敏攬離巢凱恩送祝福-歐瑞偉早年做替身撞傷致左右面唔對稱","summary":"樊亦敏、車婉婉、歐瑞偉、何依婷等出席《愛‧回家之三代同糖》宣傳活動。","summary_short":"樊亦敏、車婉婉、歐瑞偉、何依婷等出席《愛‧回家之三代同糖》宣傳活動。","digest":"樊亦敏、車婉婉、歐瑞偉、何依婷等出席《愛‧回家之三代同糖》宣傳活動","points":["樊亦敏、車婉婉、歐瑞偉、何依婷等出席《愛‧回家之三代同糖》宣傳活動","樊亦敏表示，歐瑞偉在劇中有很多動作戲，又會有名場面，呼籲大家要多留意，又讚他身手了得…","早年做替身時撞傷，面部撞到超腫，最後留院兩個月才康復，現時左右臉都有少少不對稱"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:15:34+08:00","size":1,"keywords":[],"body":"樊亦敏、車婉婉、歐瑞偉、何依婷等出席《愛‧回家之三代同糖》宣傳活動。樊亦敏表示，歐瑞偉在劇中有很多動作戲，又會有名場面，呼籲大家要多留意，又讚他身手了得，拍動作戲時會兼任指導工作，就算受傷也會堅持完成，非常專業，並提議歐瑞偉在明年台慶表演跳火圈，但他即表示已表演過。\n歐瑞偉做過張國榮動作替身\n歐瑞偉回憶初入行時為張國榮、任達華、劉德華等擔任動作替身。早年做替身時撞傷，面部撞到超腫，最後留院兩個月才康復，現時左右臉都有少少不對稱。另外，提到到林凱恩離開TVB，兩人均表示她開心就好。樊亦敏指台慶當晚，在化妝間見到林凱恩，得知是她在TVB最後一日，有擁抱支持和祝福她，並透露林凱恩指，在新階段想多作新嘗試，做自己喜歡做的事；樊亦敏續稱，雖然林凱恩之前有經營餐飲事業，但未知她的去向，祝福她有新的發展。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd594110f48","title":"《寶貝智多星》落實拍新續集 麥哥利高堅隔32年再演Kevin","url":"https://www.stheadline.com/film-drama/3639634/寶貝智多星落實拍新續集-麥哥利高堅隔32年再演Kevin","summary":"荷里活經典聖誕喜劇《寶貝智多星》今日傳出籌拍全新續集，童星出身的麥哥利高堅（Macaulay Culkin）相隔32年再穿紅色毛衣，再演家喻戶曉的Kevin，電影由迪士尼主理。","summary_short":"荷里活經典聖誕喜劇《寶貝智多星》今日傳出籌拍全新續集，童星出身的麥哥利高堅（Macaulay Culkin）相隔32年再…","digest":"荷里活經典聖誕喜劇《寶貝智多星》今日傳出籌拍全新續集…","points":["荷里活經典聖誕喜劇《寶貝智多星》今日傳出籌拍全新續集…","《寶貝智多星》1990年上映，全球票房約4.76億美元（約37.3億港元），成為聖誕檔期經典","新片由影星薛夫洛根（Seth Rogen）及Evan Goldberg參與編劇及監製"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:02:23+08:00","size":1,"keywords":[],"body":"荷里活經典聖誕喜劇《寶貝智多星》今日傳出籌拍全新續集，童星出身的麥哥利高堅（Macaulay Culkin）相隔32年再穿紅色毛衣，再演家喻戶曉的Kevin，電影由迪士尼主理。\n《寶貝智多星》1990年上映，全球票房約4.76億美元（約37.3億港元），成為聖誕檔期經典。據報道，新片由影星薛夫洛根（Seth Rogen）及Evan Goldberg參與編劇及監製。系列1997年曾推出第3集，但當時麥哥利及首兩集導演均無參與，今次新作能否獲視為正統續集，備受關注。\n首兩集導演Chris對新續集不知情\n然而，執導首集及《寶貝智多星2：玩轉紐約》的Chris Columbus，事前卻對項目毫不知情。Chris在消息公開前接受《Variety》訪問，直言若欠缺兩位核心演員——麥哥利高堅及已故的Catherine O'Hara，便不會有續集，因二人是全片的情感核心，他表示若原班人馬回歸，自己願意重返崗位，他指Catherine等於一半的《寶》片。Chris早前亦曾公開指，這個系列應該保持原樣，認為經典時刻難以重現。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf67a428c2e","title":"張與辰童年缺乏父愛因「細粒」遭欺凌 赴台追夢遇詐騙集團戶口剩百元：點解唱歌換來咁多痛苦？","url":"https://www.stheadline.com/film-drama/3639598/張與辰童年缺乏父愛因細粒遭欺凌-赴台追夢遇詐騙集團戶口剩百元點解唱歌換來咁多痛苦","summary":"TVB節目《中年好聲音3》亞軍得主張與辰（Vic），曾透露悲慘成長經歷。","summary_short":"TVB節目《中年好聲音3》亞軍得主張與辰（Vic），曾透露悲慘成長經歷。","digest":"TVB節目《中年好聲音3》亞軍得主張與辰，曾透露悲慘成長經歷","points":["TVB節目《中年好聲音3》亞軍得主張與辰（Vic），曾透露悲慘成長經歷","近日現身網上頻道《有艇搭》訪問，再度提起缺乏父愛的童年，以及曾受到校園欺凌…","單親家庭長大的張與辰，有指童年時因父親沉迷賭博，加上酗酒及家暴，最終由媽媽照顧張與辰長大"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:00:02+08:00","size":1,"keywords":[],"body":"TVB節目《中年好聲音3》亞軍得主張與辰（Vic），曾透露悲慘成長經歷。近日現身網上頻道《有艇搭》訪問，再度提起缺乏父愛的童年，以及曾受到校園欺凌、赴台追夢卻遭詐騙集團捲走血汗積蓄，人生一度陷低谷，試過抑鬱自殘。\n張與辰單親家庭長大\n單親家庭長大的張與辰，有指童年時因父親沉迷賭博，加上酗酒及家暴，最終由媽媽照顧張與辰長大。張與辰近日接受資深傳媒人黃庭桄訪問，被問到不愉快的童年，張與辰坦言：「其實我覺得呢，雖然屋企係冇咗、冇咗爸爸呢個角色。不過媽咪呢係……照顧我哋、照顧得非常之好。所以佢唔會令到我哋覺得，好似喺屋企係缺乏愛呢件事情。所以呢樣……我自己都覺得係一件好幸福嘅事。」\n相關閱讀：張與辰圓夢與《全美一叮》總冠軍合作 生日許願辦個人巡迴演唱會 秘婚JW王灝兒在演出名單中\n相關閱讀：張與辰二創張國榮經典封面以「烏蠅」致敬 被轟醜化哥哥 發長文解畫「哥迷」唔收貨\n張與辰反叛武裝自己\n沒有父親陪住成長，張與辰在中學時更成為校園霸凌的對象。張與辰「直至到返中學嘅時候，因為我以前其實好細粒，所以以前細個容易俾人恰啲。但嗰陣時我通常會抱住一種心態，『我恰人先，人哋就唔敢恰我喇！』所以有一期變得比較叛逆、變得比較壞。」直到現在反映在做音樂或者舞台表演上，要「先下手為強」。\n張與辰受騙食飯都成問題\n只有41歲的張與辰，於2015年赴台灣追夢時，原本滿懷音樂抱負，豈料遇人不淑：「去到2015年，可以話係我過去咁多年嚟最黑暗嘅歲月。嗰時我去咗台灣發展，原本諗住可以好好做音樂，點知遇到個合作方，原來佢哋係詐騙集團。佢哋將我好多嘅積蓄，仲有其他投資者嘅錢都騙走晒，成個團隊捲款而逃。嗰一刻我成個戶口真係被騙到得返台幣100蚊（約港幣25元），連食飯都成問題。」\n相關閱讀：張與辰15字剖白與K先生關係 相交16年曾一齊開設公司 公開感恩好友捱出頭：是一種福氣\n張與辰聲帶受損陷抑鬱\n此時，張與辰又因壓力過大，導致聲帶受損而雪上加霜，陷入無法唱歌的絕境。在失去生計與夢想的雙重毀滅性打擊下，張與辰患上抑鬱症，甚至以自殘方式折磨自己：「點解鍾意唱歌呢件事情，會換來我咁多痛苦呢？明明係一件好快樂嘅事情。」\n張與辰曾考慮返家鄉發展\n張與辰因為事事不順，曾打算今年3月便離開台灣，返回家鄉馬來西亞協助家人打理飲食業生意：「本身諗住唔再做音樂，覺得玩咗咁耐都夠啦，返去幫下屋企人嘅生意，得閒先寫下歌。」後來獲得同鄉歌手戴佩妮施以援手，讓張與辰重新燃起鬥志，其後參加《中年好聲音3》，並留港發展。\n相關閱讀：《中3》張與辰腹部劇痛緊急送院交代病情 腎石塞尿道加一病夾擊 今做手術公開最新情況","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cef2db7385d","title":"直撃聖若瑟書院中一入學簡介會 副校教路面試小組討論切忌「搶講」或「零發言」","url":"https://www.stheadline.com/admission-guide/3639631/直撃聖若瑟書院中一入學簡介會-副校教路面試小組討論切忌搶講或零發言","summary":"傳統名校聖若瑟書院今日（21日）舉行中一入學簡介會，吸引大批家長及高小學生到場，了解學校的辦學理念、課程特色及收生安排。","summary_short":"傳統名校聖若瑟書院今日（21日）舉行中一入學簡介會，吸引大批家長及高小學生到場，了解學校的辦學理念、課程特色及收生安排。","digest":"傳統名校聖若瑟書院舉行中一入學簡介會，吸引大批家長及高小學生到場，了解學校的辦學理念…","points":["傳統名校聖若瑟書院今日（21日）舉行中一入學簡介會，吸引大批家長及高小學生到場…","簡介會開始前，校舍正門外已出現長長人龍，多名身穿整齊校服的學生大使在場維持秩序…","校方在會上公布，明年中一入學面試定於2月27日（星期六）舉行，所有申請人均會獲邀出席…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T16:54:21+08:00","size":1,"keywords":[],"body":"傳統名校聖若瑟書院今日（21日）舉行中一入學簡介會，吸引大批家長及高小學生到場，了解學校的辦學理念、課程特色及收生安排。簡介會開始前，校舍正門外已出現長長人龍，多名身穿整齊校服的學生大使在場維持秩序，並引導參加者有序進入校園及禮堂。校方在會上公布，明年中一入學面試定於2月27日（星期六）舉行，所有申請人均會獲邀出席，詳情將透過電郵通知。\n傳統名校聖若瑟書院今日（21日）舉行中一入學簡介會，吸引大批家長及高小學生到場。（攝影：高俊謙）\n校長強調學生主導 副校籲多角度思考\n校長郭迪民於禮堂致辭時，透過簡報向在場家長及學生介紹「SJC Summer Academy」等校園活動。他指出，聖若瑟書院具備高度自由與開放的學習風氣，許多校內活動均由學生主導及籌辦，校方則從旁協助與配合，旨在讓學生在書本以外的實踐中，培養自信心、領導才能及組織能力，成就他們心目中的理想目標。\n校長郭迪民於禮堂致辭。（攝影：高俊謙）\n副校長譚創耀則詳細講解中一入學面試的流程與評核準則。他表示，校方相當重視申請人小五及小六的校內成績表，特別是操行表現，若操行僅獲C級，即使其他方面表現理想亦會被扣分，提醒學生多加留意。\n在面試形式方面，所有申請人將於2027年2月27日上午（視乎人數或延至下午）到校參與面試。面試分為兩部分：第一部分為「小組討論」，題目主要圍繞日常生活（例如在學校小賣部購買食物的選擇）或個人成長議題，重點考察學生之間的溝通互動、多角度思考、明辨性思維及創意思維。譚創耀特別提醒考生，討論時切忌「搶住講晒所有嘢」而忽略他人，亦不應只顧將問題拋給別人（「What do you think?」）而自己缺乏個人見解。\n第二部分則為「個人面試」，不設筆試，主要考核中、英、數三科的基本能力。其中英文科著重日常英語對答，建議考生平日多朗讀英文文章以保持流暢度；數學科以英語考核心算題；中文科則主要以廣東話進行（非華語或習慣使用普通話的學生亦可作出相應安排及備註）。\n跨區家長慕名而來 小六生每晚溫習至10時半\n現場亦有不少家長帶同子女跨區前來「取經」。居住於黃大仙區的George媽媽與就讀小六的兒子George一同出席簡介會，她表示欣賞聖若瑟書院的良好校風，加上George平時熱愛踢足球，而該校足球隊向來成績斐然、獲獎無數，故特意前來了解。\n居住於黃大仙區的George媽媽與就讀小六的兒子George一同出席簡介會。（攝影：高俊謙）\n面對近年不少人才子女來港就學帶來的升學競爭，George媽媽坦言對選校亦感擔心，現時已為兒子報讀面試班，並鼓勵他作多方面嘗試；George則表示對升中略感憂慮，擔心成績未如理想，但仍對入讀該校抱有信心。\n小六受訪學生蕭同學認為講座內容相當吸引。（攝影：高俊謙）\n另一名小六受訪學生蕭同學則認為講座內容相當吸引，讓他對聖若瑟書院有更深入的認識。雖然他心儀另一所中學為首選，但亦十分希望有機會入讀聖若瑟。他坦言父母並無給予太大壓力，但自己對升中感到緊張，平日放學後均需參加奧數補習班及練琴等課外活動，有時更要溫習及準備至晚上10時半才回家，希望透過付出更多努力考入心儀中學。同行的蕭爸爸則指，香港升學競爭一向存在，家長能做的就是多陪伴子女準備學習所需，並保持平常心應對。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c52be5f2b24","title":"周潤發帶隊挑戰《毅行者》限定版20K 零疲態興奮率黃浩然蔡一智衝線 三哥戚美珍親到終點迎接","url":"https://www.stheadline.com/film-drama/3639607/周潤發帶隊挑戰毅行者限定版20K-零疲態興奮率黃浩然蔡一智衝線-三哥戚美珍親到終點迎接","summary":"周潤發（發哥）率領黃浩然、蔡一智一行近廿人今日（21日）出戰「樂施毅行者2026」新增的「樂施會50周年限定版」20公里賽事，由早上7時45分在大帽山扶輪公園停車場出發…","summary_short":"周潤發（發哥）率領黃浩然、蔡一智一行近廿人今日（21日）出戰「樂施毅行者2026」新增的「樂施會50周年限定版」20公里…","digest":"周潤發率領黃浩然…","points":["周潤發（發哥）率領黃浩然、蔡一智一行近廿人今日（21日）出戰「樂施毅行者2026」新增的「樂…","苗僑偉（三哥）和太太戚美珍更專誠到終點迎接他們","周潤發笑言由大帽山有7、8k直落去會頂不順"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T16:47:35+08:00","size":1,"keywords":[],"body":"周潤發（發哥）率領黃浩然、蔡一智一行近廿人今日（21日）出戰「樂施毅行者2026」新增的「樂施會50周年限定版」20公里賽事，由早上7時45分在大帽山扶輪公園停車場出發，並於下午2時25分到達終點屯門哈羅香港國際學校。苗僑偉（三哥）和太太戚美珍更專誠到終點迎接他們。\n周潤發笑說兩個髀甩晒骹\n周潤發、蔡一智和黃浩然一起接受訪問，對於今次跑20公里的體驗，周潤發搞笑謂：「你睇吓智哥（蔡一智）面青青就知佢冇跑，我哋個個都紅卜卜！」談到原定預期他在11時半到終點，問到是否覺得跑得比預期慢？周潤發笑言由大帽山有7、8k直落去會頂不順。問到是否腳震震，周潤發笑說：「唔係腳震震，係甩脾呀！兩個髀甩晒骹！」\n相關閱讀：周潤發罕有駕車被「捕獲」 返九龍塘逾億元獨立屋 傳擁10位數身家享受「貼地」生活\n周潤發曾自爆跑山「怕蛇又怕鬼」\n蔡一智表示跑得比較慢，因為他們去了千島湖打卡。談到覺得那位跑得最叻，周潤發指黃浩然帶傷上陣，對方上次跑步扭傷腳，所以慢慢陪住一齊跑。當笑指黃浩然曾幽默指今次是「50周年特別版暨周潤發先生一齊玩版」，周潤發即謂：「玩一次好啦！以後都唔好再嚟，命都唔長。」談到周潤發曾自爆跑山「怕蛇又怕鬼」，他搞笑指蔡一智最「蛇」，因為在山上拉筋，又承認好多跑友邀請他合照，但覺得這些一定要做。\n周潤發參與跑20公里全程靠吹水\n談到今次參與跑20公里，問到可有策略？周潤發笑說：「邊有策略？全程喺度吹水，又有飯團、朱古力等。」在旁的蔡一智即謂：「爭少少，邊爐都拎埋出嚟！」完成跑20公里可有慶祝活動？三人齊聲指苗僑偉夫婦迎接他們，周潤發笑言好大鼓勵，黃浩然則謂他們指接機就試過，接跑就第一次。周潤發又搞笑指《使徒行者》重案組卓Sir（三哥）在上面查緊案，更爆三哥已「落叠」，下次一齊跑2027「渣馬」。問到跑全馬定半馬，三人即齊聲謂：「10K公里！你想佢死啫！」周潤發又搞笑指三哥是「北譚涌教頭」，更為對方改名「苗英偉」，又讚三哥現在變得更英俊，自己則退隱了交捧給對方。再問鄭則仕（Kent 哥）會否參與一齊跑「渣馬」，周潤發說：「佢有得唔跑呀！因為佢做咗「渣馬」吉祥物，肥貓嘛！我依家幫佢改咗名叫「鄭杞人」，佢太杞人憂天，又驚落雨又驚打風。」\n相關閱讀：黃浩然明日孖周潤發蔡一智行20km　澄清婚後「絕情」拒留女星電話 : 現在當然有 吳業坤伍富橋組隊挑戰100km\n周潤發大讚BIGBANG主場館演唱會好睇\n另外，提到G-Dragon（GD）在 BIGBANG香港啟德主場館尾場演唱會公開感謝周潤發到場捧場，並向這位偶像致敬。周潤發大讚個騷好睇，在後台都有合照，又指\nBIGBANG經理人要用大會機影相，所以想用自己機也不能。當笑問可有使出招牌Selfie，周潤發笑說：「有，打畀周太（發嫂），佢有相，其實佢哋係叫我陪周太去！」問到周太鍾意BIGBANG哪一位成員？他說：「三個都鍾意，佢係唔鍾意我啫！」談到發哥睇騷時可有像梁朝偉和劉嘉玲睇The Weeknd演唱會邊睇邊跳舞？周潤發笑說：「我『Un』晒啦！」隨即唱「咪當我老襯…！」周潤發更透露繼去年頒獎給G-Dragon後，一直未有見過對方，其後周潤發謂肚餓要去食煲蠟鴨飯，所以要結束訪問。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":15,"items":[{"id":"cafeb941dbc","title":"選管會主席巡視選舉委員會界別分組一般選舉投票站及中央點票站","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100416.htm","summary":"二○二六年選舉委員會界別分組一般選舉明日（十一月二十二日）舉行。","summary_short":"二○二六年選舉委員會界別分組一般選舉明日（十一月二十二日）舉行。","digest":"二○二六年選舉委員會界別分組一般選舉明日舉行","points":["下稿代選舉管理委員會發出：","二○二六年選舉委員會界別分組一般選舉明日（十一月二十二日）舉行","五個一般投票站將由上午九時至下午六時開放予相關界別分組的投票人／獲授權代表投票"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T19:22:00+08:00","size":1,"keywords":[],"body":"下稿代選舉管理委員會發出：\n\n　　二○二六年選舉委員會界別分組一般選舉明日（十一月二十二日）舉行。選舉管理委員會（選管會）主席陸啟康法官今日（十一月二十一日）上午在技術諮詢委員會召集人及成員的陪同下巡視設於港灣道體育館的投票站和設於香港會議展覽中心的中央點票站，並呼籲合資格投票人明日踴躍投票。\n\n　　陸啟康法官表示，二○二六年選舉委員會界別分組一般選舉的籌備工作已準備就緒，工作人員現正進行最後的準備和演練。他衷心感謝工作人員作出的努力，以確保明日的選舉可公開、誠實、公平地進行。\n\n　　選管會委員石丹理教授和文本立資深大律師今早亦分別巡視設於車公廟體育館和調景嶺體育館的投票站，隨後與陸啟康法官一同在技術諮詢委員會召集人及成員的陪同下巡視中央點票站，視察工作人員實地綵排，確保點票工作順利進行。\n\n　　在投票日，共有856名候選人競逐31個界別分組共723個席位。五個一般投票站將由上午九時至下午六時開放予相關界別分組的投票人／獲授權代表投票。投票人／獲授權代表須帶備有效的香港身份證正本，到列明於投票通知卡上其獲編配的投票站投票。\n\n　　陸啟康法官補充，是次選舉的一般投票站將繼續使用電子選民登記冊系統為投票人／獲授權代表發出選票，讓發票程序高效地進行。投票結束後，所有投票箱會運送到設於香港會議展覽中心的中央點票站進行點票。候選人、選舉代理人及監察點票代理人可以進入中央點票站，在點票區的指定範圍觀察點票過程。公眾人士和傳媒亦可在中央點票站的公眾範圍觀察點票程序。\n\n　　點票結束後，選舉主任會在中央點票站的問題選票裁決枱向候選人和代理人公布點票及選舉結果。所有當選人隨後會獲安排在新聞中心的禮台上接受祝賀。市民可在新聞中心的公眾人士區域內現場觀看過程。新聞中心的公眾席有約130個。選舉事務處將於投票日下午五時四十五分起，以「先到先得」的形式派發公眾人士入場券，額滿即止。為方便控制入場人數，進場公眾人士必須佩戴選舉事務處提供的手帶以作識別。選舉結果會張貼在新聞中心外，並透過新聞稿和選舉網站（www.elections.gov.hk）發放。\n\n　　另外，陸啟康法官亦在今日下午與政制及內地事務局局長謝小華，陪同行政長官李家超視察港灣道體育館投票站的最後準備情況。選管會及選舉事務處在各方面均已準備就緒，將全力確保明日的選舉在公平、公正、誠實和安全的環境下順利進行。\n\n　　如有查詢，可致電選舉熱線（2891 1001），或瀏覽選舉網站。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb7f28121e5","title":"​運輸及物流局局長出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃2026聯合頒奬典禮致辭","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100554.htm","summary":"以下是運輸及物流局局長陳美寶今日（十一月二十一日）出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃2026聯合頒奬典禮的致辭全文：  林船長（立法會議員…","summary_short":"以下是運輸及物流局局長陳美寶今日（十一月二十一日）出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃20…","digest":"​運輸及物流局局長出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃…","points":["時間過得很快，今日是星期六，一連七日的香港海運週十周年活動來到尾聲…","不講不知，我們自去年起已構思活動概念，有幸得到香港海運港口發展局的鼎力支持…","參與人數仍在統計中，相信很大機會超越去年的18 000人，破紀錄達到近20 000人"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T18:49:00+08:00","size":1,"keywords":[],"body":"以下是運輸及物流局局長陳美寶今日（十一月二十一日）出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃2026聯合頒奬典禮的致辭全文：\n\n林船長（立法會議員、香港海運港口發展局人力發展委員會委員林銘鋒）、Wellington（香港海運港口發展局人力發展委員會主席顧之灝）、王處長（海事處處長王世發）、Richard（香港海事博物館主席宋睿之）、Captain Nair（香港傑出海事甲板及輪機實習生嘉許計劃工作小組主席Somasundar Nair）、Connie（東方海外貨櫃航運（中國）有限公司華南及香港區董事總經理陳軼）、Frank（現代貨箱碼頭有限公司商務總裁費恩信）、各位嘉賓、家長及同學：\n\n　　大家下午好！昨日天氣較為寒冷，今日則放晴，最適合外出活動、伸展手腳。時間過得很快，今日是星期六，一連七日的香港海運週十周年活動來到尾聲，這個壓軸活動我們亦期待已久。不講不知，我們自去年起已構思活動概念，有幸得到香港海運港口發展局的鼎力支持，有Wellington和林議員非常支持這個想法。\n\n　　今年海運週特別星光熠熠，中西匯聚，總共有超過80個機構安排了60多項活動。參與人數仍在統計中，相信很大機會超越去年的18 000人，破紀錄達到近20 000人。在海運週的最後一日舉辦這個活動實在別具意義。\n\n　　我本身不太擅長畫畫，不知道在座有多少畫家，大家不妨到海事博物館的露天展覽場地「打卡」，欣賞得獎的三個貨櫃藝術作品之餘，還有另一個貨櫃展示了其他入圍作品，當中很多都非常漂亮。特別一提，我早前已經和同事率先前來「打卡」。藝術各花入各眼，平時我們覺得貨櫃船、航運好像與大家的生活沒有太大關聯，未必會關心。透過今次的參賽作品──無論小學組、中學組或公開組──大家會發現許多香港特色。我先跟大家分享個人感受，對於當中幾個圖案有特別深刻的印象。那些貨櫃藝術包括麻將牌「一筒」；紅白藍袋的圖案配以香港的舊式街道、冰室裏的階磚；點心、海鮮產品，代表香港人喜歡的美食。如果沒有貨櫃船運送貨品，我們就不能享受這些美食。當中，我認為最特別、最有心思的貨櫃，是將香港與其他航點連結起來，構成一幅天空上星星的圖畫，希望大家接着會去看看。這幅作品加上剛才播放的短片，令我聯想起航海期間，我們於夜深的時候望向外面，或登上甲板時會看見許多星宿，這就是「航海的浪漫」。\n\n　　今年的香港海運週，除了一如以往有多項中西匯聚的活動，以吸引全球航運業人士，我們更公布了八項成果。這些成果正好切合今年的主題，就是透過伙伴港口達致信任，通過多元化發展以增強香港港口的韌性。我們不單只是簽署一些備忘錄，更希望付諸行動，「火力十足」般「連珠發炮」，務求令香港「增貨量、增價值」，以及強化協同效應，希望香港在全球航運物流及航空產業鏈中發揮強大的協同作用。\n\n　　在海運週的最後一日，我特別開心能夠來到香港海事博物館。\n\n（請同時參閱致辭的英文部分。）","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf24682b8ff","title":"教育局副局長出席「一帶一路獎學金」獲獎學生及畢業生年度交流分享會","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000332.htm","summary":"教育局今日（十一月二十一日）舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會，以協助新獲獎學生認識香港的不同機遇及擴展在地人際網絡。","summary_short":"教育局今日（十一月二十一日）舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會…","digest":"教育局舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會…","points":["教育局今日（十一月二十一日）舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會…","教育局副局長施俊輝博士及「一帶一路」專員何力治出席分享會…","施俊輝博士致辭時表示，為積極配合國家「十五五」規劃，政府已制定香港首個《五年規劃》…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T17:20:00+08:00","size":1,"keywords":[],"body":"教育局今日（十一月二十一日）舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會，以協助新獲獎學生認識香港的不同機遇及擴展在地人際網絡。教育局副局長施俊輝博士及「一帶一路」專員何力治出席分享會，與逾百名獲獎學生及在港發展的畢業生交流。\n\n　　施俊輝博士致辭時表示，為積極配合國家「十五五」規劃，政府已制定香港首個《五年規劃》，勾勒出未來五年本港經濟與社會發展的藍圖，並正全速落實各項措施。教育局將繼續在「一國兩制」下，鞏固並發揮香港教育高度國際化及多元化的獨特優勢，並致力在全球建立「留學香港」品牌，推廣香港高等教育，以吸引更多優秀學生和學者來港升學及從事研究。\n\n　　他說，自「一帶一路獎學金」推出以來，一直深受「一帶一路」沿線國家及地區的優秀學生，以及參與計劃的本地院校的歡迎。《行政長官2026年施政報告》宣布，該獎學金的名額將由二○二七／二八學年起增加至每年200個，讓更多傑出學生體驗香港獨特且充滿活力的中西文化薈萃特色。\n\n　　在分享會上，兩位曾獲得「一帶一路獎學金」的畢業生分享他們在香港求學和工作的經歷，以及在香港生活的體會。其中一位獲獎者指出該獎學金賦予他追求夢想的信心，又形容香港是一個充滿機遇的地方，並鼓勵所有獲獎學生主動把握這些機會。另一位獲獎畢業生表示，該獎學金讓她得以專注探索學術興趣，無須為經濟壓力而擔憂。她亦勉勵所有獲獎學生勇於挑戰自我，並在完成學業後留港發展事業。\n\n　　教育局自二○二四／二五學年起，每年為新獲獎學生舉辦交流分享會，並由二○二六／二七學年起，邀請所有在讀的獲獎學生和留港發展的畢業生參與及分享經驗，協助獲獎學生了解香港的學習、生活、升學和就業前景，並建立同儕及校友網絡。\n\n　　政府於二○一六／一七學年推出「一帶一路獎學金」，旨在鼓勵來自「一帶一路」沿線國家／地區的學生來港升學。截至二○二六／二七學年，累計超過980名來自58個「一帶一路」國家／地區的學生獲獎。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7f5d681e3e","title":"亞洲基礎設施投資銀行簽署協定 推進在香港開設辦事處","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000492.htm","summary":"中華人民共和國政府與亞洲基礎設施投資銀行（亞投行）今日（十一月二十一日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資銀行關於在中華人民共和國香港特別行政區設立辦公室的協定》…","summary_short":"中華人民共和國政府與亞洲基礎設施投資銀行（亞投行）今日（十一月二十一日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資…","digest":"中華人民共和國政府與亞洲基礎設施投資銀行在香港簽署《中華人民共和國政府與亞洲基礎設施…","points":["中華人民共和國政府與亞洲基礎設施投資銀行（亞投行）今日（十一月二十一日）在香港簽署《中華人民…","財政司司長陳茂波和署理財經事務及庫務局局長陳浩濂出席了簽署儀式","中華人民共和國政府與亞投行分別由國家財政部部長藍佛安和亞投行行長鄒加怡代表簽署協定"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T17:11:00+08:00","size":1,"keywords":[],"body":"中華人民共和國政府與亞洲基礎設施投資銀行（亞投行）今日（十一月二十一日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資銀行關於在中華人民共和國香港特別行政區設立辦公室的協定》，為亞投行在香港開設辦公室奠定基礎。財政司司長陳茂波和署理財經事務及庫務局局長陳浩濂出席了簽署儀式。\n\n　　中華人民共和國政府與亞投行分別由國家財政部部長藍佛安和亞投行行長鄒加怡代表簽署協定。該協定確定亞投行於香港設立辦公室，並為特權及豁免與其他有助成立辦公室的事宜制定原則。\n\n　　陳茂波說：「感謝國家財政部對香港特區的支持，以及亞投行對香港的信任。亞投行選擇在香港設立辦公室，充分肯定香港作為國際金融中心的地位，亦彰顯香港在匯聚國際資本、支持亞洲基礎設施建設方面的獨特角色。特區政府會全力支持辦公室的設立和運作。我們期待與亞投行加強合作，讓香港的資本市場和專業服務為其業務發展提供更大的支持，撬動更多國際資本參與亞洲基建投融資。」他表示，特區政府將按便利國際組織在港運作的一貫做法，盡早向立法會提交有關附屬法例，以正式賦予亞投行在香港辦公室所需的特權及豁免。\n\n　　此外，在同一場合，陳浩濂代表特區政府與亞投行首席夥伴合作官金憲簽署一份向「項目準備特別基金」注資2,000萬美元的協定，以展現對亞投行工作的支持。陳浩濂表示：「香港會一如既往積極支持亞投行推展其使命，並探索與亞投行進一步加強合作，尤其在發揮香港資本市場與專業服務優勢，以及在能力建設與人才培訓等方面。」\n\n　　亞投行是一家多邊發展銀行，宗旨是通過在基礎設施和其他生產性領域的投資，促進成員經濟體的可持續發展、提升其人民的生活質素，以及改善亞洲及其他地區基礎設施的互聯互通。此外，亞投行鼓勵私營資本參與投資有利於區域經濟發展的項目、企業和活動。亞投行成立了不同的基金，以推展其工作，當中包括「項目準備特別基金」。該基金的資金來源包括亞投行其中七個成員的注資，以支援發展中經濟體接受亞投行融資的部分項目的前期準備工作。中國香港於二○一七年六月成為亞投行成員。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb7499165c3","title":"特首政策組組長出席「中國香港專題論壇：新時代港澳治理與港澳發展」開幕致辭","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100500.htm","summary":"以下是特首政策組組長黃元山博士今日（十一月二十一日）出席中國社會科學院（社科院）舉辦的「中國香港專題論壇：新時代港澳治理與港澳發展」的開幕致辭：  尊敬的馮仲平主任（社科院港澳研究中心執行主任）…","summary_short":"以下是特首政策組組長黃元山博士今日（十一月二十一日）出席中國社會科學院（社科院）舉辦的「中國香港專題論壇：新時代港澳治理…","digest":"特首政策組組長出席「中國香港專題論壇：新時代港澳治理與港澳發展」開幕致辭（只有中文）…","points":["尊敬的馮仲平主任（社科院港澳研究中心執行主任）、黃平院長（社科院香港中國學術研究院院長）…","今年總論壇的主題，是「大道之行：人類命運共同體」","學習習近平新時代中國特色社會主義思想，我體會到，構建人類命運共同體…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T16:53:00+08:00","size":1,"keywords":[],"body":"以下是特首政策組組長黃元山博士今日（十一月二十一日）出席中國社會科學院（社科院）舉辦的「中國香港專題論壇：新時代港澳治理與港澳發展」的開幕致辭：\n\n尊敬的馮仲平主任（社科院港澳研究中心執行主任）、黃平院長（社科院香港中國學術研究院院長），各位領導、嘉賓、朋友：\n\n　　大家下午好。很高興出席本次專題論壇。感謝籌辦各方搭建這個平台。\n\n　　今年總論壇的主題，是「大道之行：人類命運共同體」。《禮記》說：「大道之行也，天下為公」。二十大報告指出：「只有各國行天下之大道，和睦相處、合作共贏，繁榮才能持久，安全才有保障」。兩段話相隔兩千多年。今天借這個「行」字，談談理念怎樣落到實處。\n\n　　怎樣行？《論語》說：「己欲立而立人，己欲達而達人」。《攜手構建人類命運共同體》白皮書也談到「立己達人」之道。這與二十大報告所說的「胸懷天下」相呼應：辦好自己的事，也為世界作出貢獻。\n\n　　學習習近平新時代中國特色社會主義思想，我體會到，構建人類命運共同體，既回答「建設甚麼樣的世界」，也回答「怎樣建設這個世界」。四大全球倡議為此提供戰略引領。\n\n　　四大全球倡議的落實，有賴各國合作和多邊平台。憑藉「一國兩制」的制度優勢，香港可以為國家推動落實這些倡議，提供一些具體的實踐場景。\n\n　　可能有人會問，香港為甚麼有這個條件？\n\n　　我想，關鍵就在「一國兩制」。習主席說過，「一國兩制」蘊含中華文化的和合理念，體現「求大同、存大異」的精神。他在澳門回歸祖國二十五周年時也指出，「一國兩制」蘊含的和平、包容、開放、共享的價值理念，「是中國的，也是世界的」。而共同體的願景，是建設持久和平、普遍安全、共同繁榮、開放包容、清潔美麗的世界，理念有相通之處。\n\n　　習主席在聽取行政長官述職時，要求特區政府主動對接國家「十五五」規劃。今年九月，香港公布第一個五年規劃。在我看來，香港既要把自己的事情辦好，也要發揮聯通世界的優勢，為國家推動構建人類命運共同體出一分力。從這個意義上說，香港「一國兩制」的成功實踐，也體現了「立己達人」的精神。\n\n　　下面，我按發展、安全、文明、治理的次序，分四個方面舉例說明。\n\n　　第一，發展。\n\n　　全球發展倡議提出加強綠色融資。在港發行的人民幣綠色主權債券，就是一個例子。\n\n　　今年五月，國家財政部首次在香港發行人民幣綠色主權債券。香港發揮國際金融中心的作用，把國家的綠色融資安排與國際投資者連接起來，為國際資金參與綠色發展提供一個共用渠道。\n\n　　另一個例子，是藥械監管。今年三月起，香港分階段實施新藥「第一層審批」，並正籌建藥械監管中心。去年，國家批准上市的創新藥有76個。同年，我國創新藥對外授權交易總額超過1,300億美元。香港對接國際標準、建立自主審評能力，希望為創新藥走向世界多開一扇窗，也讓病人更早用上合適的藥物。這也呼應習主席倡導構建人類衞生健康共同體的理念。\n\n　　第二，安全。以金融業的人工智能治理為例。\n\n　　全球安全倡議將人工智能等新興科技領域的國際安全治理列為重點合作方向。今年七月，習主席在世界人工智能大會上說，要讓人工智能這匹千里馬既跑得快又跑得穩，並提出加強治理規則、技術標準的對接協調。\n\n　　香港金融管理局推出生成式人工智能沙盒，讓金融機構在可控環境中測試技術和風險管理措施。這是本地監管實踐，為業界探索兼顧創新與風險管理，累積可供交流的經驗。\n\n　　習主席指出，要讓人工智能成為促進共同繁榮、維護共同安全的一個重要動力源。對香港而言，具體可做的，是把本地風險管理做實，並與各方交流經驗。\n\n　　第三，文明。\n\n　　全球文明倡議倡導文明傳承創新和國際人文交流。國家《十五五規劃綱要》提出，發揮港澳在中西文明交流互鑑中的重要窗口作用。\n\n　　西九文化區的兩家博物館，從不同角度推動文化交流。香港故宮文化博物館去年與多哈伊斯蘭藝術博物館合辦伊斯蘭藝術展，下月將與法國吉美博物館（吉美國立亞洲藝術博物館）合辦絲綢之路佛教藝術展；M+上月與巴黎龐比度藝術中心、紐約現代藝術博物館建立文化聯盟。\n\n　　在同一個文化區，既有中華文化的根，也有國際策展網絡。這呼應習主席倡導的以文明交流超越文明隔閡、文明互鑑超越文明衝突、文明包容超越文明優越。\n\n　　第四，治理。\n\n　　全球治理倡議強調國際法治。調解是和平解決國際爭端的一種途徑。\n\n　　國際調解院由中國與志同道合的國家共同倡議建立，是全球首個專門以調解方式解決國際爭端的政府間國際法律組織。在中央支持下，總部落戶香港。今年五月，即正式開業不到一年，調解院公布了首宗成功案例，是一宗跨境海事爭議，經調解後，雙方達成和解協議。\n\n　　調解院總部由舊灣仔警署改建，設計借用瓷藝諺語：「一色入窯，萬彩出窯」。用在這裏，寓意生動：各方帶着分歧而來，通過調解找到多元的解決辦法。\n\n　　調解院作為獨立的國際組織，服務國際社會；特區政府做好東道支援。以對話促進理解、以調解化解爭端，有助維護持久和平。\n\n　　這些例子分屬不同領域，說明香港可以發揮自身所長，為國家促進國際合作作出具體貢獻。\n\n　　作為政策研究者，我深感這是一個「知」與「行」不斷往復的過程：構想要經過實踐檢驗，實踐的得失也要回到研究中總結，為闡釋「一國兩制」的生命力提供鮮活的案例。\n\n　　今年七月，在中央港澳辦（中央港澳工作辦公室）支持下，社科院港澳研究中心揭牌。工作之一正是構建「一國兩制」基礎理論和學術話語體系。\n\n　　各位朋友，明年是香港回歸祖國三十周年。借用《論語》的「三十而立」，香港要立得穩，就要堅守「一國」之本、善用「兩制」之利，辦好自己的事情，「立己達人」，為國家促進開放合作、推動構建人類命運共同體多做實事。\n\n　　大道之行，貴在力行。香港會在「一國兩制」下，把自己這一段路走實、走好。\n\n　　預祝本次論壇圓滿成功。謝謝大家。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd666d4d78d","title":"警方呼籲市民提供大埔失蹤女子消息","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100493.htm","summary":"警方今日（十一月二十一日）呼籲市民提供一名在大埔失蹤女子的消息。","summary_short":"警方今日（十一月二十一日）呼籲市民提供一名在大埔失蹤女子的消息。","digest":"警方呼籲市民提供一名在大埔失蹤女子的消息","points":["警方今日（十一月二十一日）呼籲市民提供一名在大埔失蹤女子的消息","七十二歲女子蘇秀珍昨日（十一月二十日）凌晨在完善路最後露面後便告失蹤，其家人同日向警方報案","任何人如有該失蹤女子的消息或曾見過她，請致電三六六一　三一一三或電郵至rmpu-ntn-1@…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T16:22:40+08:00","size":1,"keywords":[],"body":"警方今日（十一月二十一日）呼籲市民提供一名在大埔失蹤女子的消息。\n\n　　七十二歲女子蘇秀珍昨日（十一月二十日）凌晨在完善路最後露面後便告失蹤，其家人同日向警方報案。\n\n　　她身高約一點六米，體重約五十五公斤，中等身材，圓面型，黃皮膚及蓄短黑髮。她最後露面時身穿黑色外套、黑色長褲及黑白色波鞋。\n\n　　任何人如有該失蹤女子的消息或曾見過她，請致電三六六一　三一一三或電郵至rmpu-ntn-1@police.gov.hk與新界北總區失蹤人口調查組，或與任何一間警署聯絡。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c01330dbbd4","title":"​香港海關檢獲懷疑受管制屬瀕危物種的活龜","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100393.htm","summary":"香港海關今日（十一月二十一日）在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜，估計市值共約四千元。","summary_short":"香港海關今日（十一月二十一日）在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜，估計市值共約四千元。","digest":"香港海關在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜，估計市值共約四千元","points":["香港海關今日（十一月二十一日）在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜…","透過風險評估，海關人員檢查一件由美國進口至香港，報稱玩具禮盒的包裹","經檢查後，海關人員於包裹中發現該批懷疑受管制屬瀕危物種的活龜"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T15:35:00+08:00","size":1,"keywords":[],"body":"香港海關今日（十一月二十一日）在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜，估計市值共約四千元。\n\n　　透過風險評估，海關人員檢查一件由美國進口至香港，報稱玩具禮盒的包裹。經檢查後，海關人員於包裹中發現該批懷疑受管制屬瀕危物種的活龜。\n\n　　案件已轉交漁農自然護理署跟進。\n\n　　根據《保護瀕危動植物物種條例》（第586章），任何人如非按照《條例》規定進出口或管有瀕危物種均屬違法。一經定罪，最高可被判罰款一千萬元及監禁十年，有關物品亦會被充公。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑走私活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc58db2fdaf","title":"​香港海關搗破網店及其分銷中心售賣冒牌貨品及參與清洗黑錢","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000606.htm","summary":"香港海關於十一月十一日展開特別執法行動，偵破一宗透過兩間網上店鋪及其分銷中心售賣冒牌物品及清洗黑錢的案件，檢獲共約八百件懷疑冒牌物品，包括香水及公仔，估計市值共約五十萬元。","summary_short":"香港海關於十一月十一日展開特別執法行動，偵破一宗透過兩間網上店鋪及其分銷中心售賣冒牌物品及清洗黑錢的案件…","digest":"香港海關於十一月十一日展開特別執法行動…","points":["香港海關於十一月十一日展開特別執法行動，偵破一宗透過兩間網上店鋪及其分銷中心售賣冒牌物品及清…","案件涉及處理懷疑售賣冒牌物品的犯罪得益高達六百萬元，行動中拘捕一人","海關早前接獲市民舉報，指有網上店鋪售賣冒牌物品，海關人員隨即展開調查"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T14:05:16+08:00","size":1,"keywords":[],"body":"香港海關於十一月十一日展開特別執法行動，偵破一宗透過兩間網上店鋪及其分銷中心售賣冒牌物品及清洗黑錢的案件，檢獲共約八百件懷疑冒牌物品，包括香水及公仔，估計市值共約五十萬元。案件涉及處理懷疑售賣冒牌物品的犯罪得益高達六百萬元，行動中拘捕一人。\n\n　　海關早前接獲市民舉報，指有網上店鋪售賣冒牌物品，海關人員隨即展開調查。經深入調查及在商標持有人協助下，海關人員於十一月十一日採取執法行動，搜查有關網上店鋪位於觀塘一個工廠大廈單位的分銷中心，並檢獲該批懷疑冒牌物品。\n\n　　與此同時，經資金流向分析，海關人員發現有人成立一間本地公司，透過公司帳戶收取及轉賬大量懷疑犯罪得益。由二○二三年至二○二六年期間，該帳戶合共處理約六百萬元懷疑來自售賣冒牌物品的犯罪得益。\n\n　　行動中，海關根據《商品說明條例》及《有組織及嚴重罪行條例》拘捕一名六十一歲本地男子。\n\n　　案件仍在調查中，被捕人士現正保釋候查，不排除會有更多人被捕。\n\n　　海關呼籲消費者光顧信譽良好的店鋪或網店，避免與可疑商戶交易；如對貨品真偽存疑，應先向有關商標持有人或其代理商查詢。\n\n　　海關一直致力保障消費者權益，不時於市面及網上巡查。此外，海關人員會運用大數據系統進行風險評估和分析，辨識網店有否違反《商品說明條例》，加強保障消費者網上購物的權益。\n\n　　根據《商品說明條例》，任何人銷售或為售賣用途而管有冒牌物品，即屬違法，一經定罪，最高可被判罰款五十萬元及監禁五年。\n\n　　而根據《有組織及嚴重罪行條例》，任何人如知道或有合理理由相信任何財產，不論全部或部分、直接或間接，代表任何人從可公訴罪行所得的得益，而仍然處理該財產，即屬犯罪。一經定罪，最高可被判罰款五百萬元及監禁十四年，相關犯罪得益亦可被沒收。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002），舉報懷疑冒牌貨及懷疑洗黑錢活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5ca693d949","title":"香港特區立法會強烈不滿和堅決反對美中經濟與安全審議委員會報告","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100349.htm","summary":"香港特別行政區（香港特區）立法會發言人今日（十一月二十一日）表示，強烈不滿和堅決反對美中經濟與安全審議委員會發表所謂「2026年報告」，對香港情況作出失實、偏頗的陳述，肆意詆毀「一國兩制」…","summary_short":"香港特別行政區（香港特區）立法會發言人今日（十一月二十一日）表示…","digest":"香港特別行政區立法會發言人表示…","points":["香港特別行政區（香港特區）立法會發言人今日（十一月二十一日）表示…","立法會發言人對此表示強烈譴責，並堅定支持特區政府就該報告發出的聲明，直斥其非，以正視聽…","立法會發言人指出，維護國家主權、安全和發展利益，是香港特區的憲制責任…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T13:17:00+08:00","size":1,"keywords":[],"body":"下稿代立法會秘書處發出：\n\n　　香港特別行政區（香港特區）立法會發言人今日（十一月二十一日）表示，強烈不滿和堅決反對美中經濟與安全審議委員會發表所謂「2026年報告」，對香港情況作出失實、偏頗的陳述，肆意詆毀「一國兩制」，又對香港的司法獨立和法治、依法維護國家安全工作、選舉制度，以及經濟發展等多方面無理抹黑。立法會發言人對此表示強烈譴責，並堅定支持特區政府就該報告發出的聲明，直斥其非，以正視聽，維護香港聲譽。\n\n　　立法會發言人指出，維護國家主權、安全和發展利益，是香港特區的憲制責任，亦是保障香港長期繁榮穩定、市民安居樂業的根本前提。美方所謂報告指責《香港國安法》及《基本法》第二十三條立法系統性侵蝕香港法治，卻隻字不提二○一九年香港發生的嚴重暴力動亂和社會撕裂，正是《香港國安法》的實施才能有效恢復社會秩序，保障了市民的生命財產安全。立法會發言人強調，《香港國安法》和《維護國家安全條例》等相關法律，確保香港能依法有效防範、制止和懲治危害國家安全的行為和活動。有關法律精準針對極少數危害國家安全的罪行，同時堅持法治原則，絕不影響一切正常的商業、專業、學術、文化、新聞活動，更好保障了香港居民依法享有的權利和自由。美方所謂報告將香港依法維護國家安全的工作污名化，同時卻完全不提美國自身早已有多部極嚴厲的維護國家安全法律，再一次暴露其雙重標準的虛偽本質。\n\n　　立法會發言人指出，正如特區政府聲明所指，特區政府今年六月訂立《維護國家安全（程序事宜）規例》，清楚述明在《香港國安法》和《維護國家安全條例》下界定「特區的法律下其他危害國家安全的罪行」的機制，細化相關程序事宜，為《香港國安法》、《維護國家安全條例》等相關規定的實施帶來更大確定性。有關規例沒有改變現有和行之有效的規定、沒有改變《香港國安法》、《維護國家安全條例》的適用範圍、沒有改變「危害國家安全的罪行」的定義，也沒有訂立新的罪行、罰則或執法權力。\n\n　　立法會發言人又指，美方所謂報告對香港的評論亦不符合國際社會的客觀評價。世界正義工程《2026年法治指數》顯示，在全球143個國家和地區中，香港位列第24位，領先於包括美國在內一些不時無理批評香港法治和人權狀況的西方國家。發言人強調，香港居民根據《基本法》、《香港國安法》及本地法律，一直享有言論、新聞、出版、結社、集會、遊行和示威等權利和自由，依法與外界交流往來亦受充分保障；司法機構依法獨立行使審判權，所有案件按法律程序處理，被告人享有公平審訊及依法上訴的權利。\n\n　　就該報告提到立法會換屆選舉，立法會發言人表示，特區政府亦指，第八屆立法會換屆選舉順利舉行，選民積極投票，選出新一屆愛國愛港、有擔當、有才幹、有志服務社會的立法會議員，再次展現完善選舉制度下高質量、高水平的良性競爭，體現了廣泛代表性和均衡參與。\n\n　　立法會發言人強調，在完善選舉制度後，以愛國者為主體的第八屆立法會已擺脫內耗，議事效率顯著提升，既堅定支持特區政府依法施政，亦積極透過審議法案、審批撥款及監察政府施政，推動經濟發展，改善民生。就美方所謂報告提及全體立法會議員今年七月到北京進行國家事務研修考察，發言人指出，此行是香港立法機關歷來首次，意義重大，旨在讓議員深入了解國家最新發展戰略及治理經驗，有助議員更準確把握香港在國家發展大局中的定位角色，並促進香港良政善治，為「愛國者治港」創造更大價值。\n\n　　立法會發言人亦指出，任何指稱因香港五年規劃出台而偏離資本主義市場經濟的說法，均是子虛烏有。香港五年規劃強調香港對市場經濟和面向全球的長期堅持，絕無偏離市場經濟。特區政府公布五年規劃，已明確指出堅持「有效市場」和「有為政府」相結合，而多個在港外國商會均認同五年規劃有助為香港未來發展帶來更多確定性。與此同時，北部都會區正全速發展，多個片區的設施已相繼落成並引進企業。《北部都會區發展條例草案》剛於本月獲立法會通過，簡化規劃和地政等程序、加快工程建設及便利跨境要素流動。立法會亦一直透過相關委員會及撥款審議，積極支持特區政府推展北都的基建和發展項目，並持續監察落實進度。\n\n　　立法會發言人強調，香港首次制定五年規劃，是更有效融入國家發展大局、破解自身深層次矛盾（如產業單一化）的積極舉措，旨在為香港謀求長遠繁榮。與此同時，香港與內地經濟融合（如大灣區建設、互聯互通機制）為香港帶來了龐大的發展機遇，促進了本地就業和經濟增長。該報告以上所述均明顯意圖唱衰香港、誤導國際投資者，立法會發言人必須嚴詞駁斥。\n\n　　香港已進入由治及興的新階段。立法會發言人強烈敦促美中經濟與安全審議委員會及美國有關方面，香港特區事務全屬中國內政，立即停止干涉香港事務，為中美建設戰略性穩定關係發展和港美合作發揮正面作用。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1eb9706272","title":"香港公共圖書館嘉許「兒童及青少年閱讀計劃」得獎者","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000279.htm","summary":"​康樂及文化事務署香港公共圖書館今日（十一月二十一日）在香港中央圖書館舉行證書頒發儀式，表揚二○二五／二六年度積極參與「兒童及青少年閱讀計劃」的會員。","summary_short":"​康樂及文化事務署香港公共圖書館今日（十一月二十一日）在香港中央圖書館舉行證書頒發儀式…","digest":"康樂及文化事務署香港公共圖書館在香港中央圖書館舉行證書頒發儀式…","points":["​康樂及文化事務署香港公共圖書館今日（十一月二十一日）在香港中央圖書館舉行證書頒發儀式…","今年有六千多名兒童及青少年加入成為會員，透過參與計劃感受開卷樂趣，養成良好閱讀習慣","24位會員憑所撰寫的閱讀報告獲得「每月之星」獎項，其中作品最出色的九位更獲選為「閱讀超新星」"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T12:37:00+08:00","size":1,"keywords":[],"body":"​康樂及文化事務署香港公共圖書館今日（十一月二十一日）在香港中央圖書館舉行證書頒發儀式，表揚二○二五／二六年度積極參與「兒童及青少年閱讀計劃」的會員。\n\n　　今年有六千多名兒童及青少年加入成為會員，透過參與計劃感受開卷樂趣，養成良好閱讀習慣。24位會員憑所撰寫的閱讀報告獲得「每月之星」獎項，其中作品最出色的九位更獲選為「閱讀超新星」。另外，17位會員因最積極參與「月月讀書樂」月會而獲頒「樂讀小菁英」獎牌。\n\n　　香港公共圖書館積極透過學校推廣閱讀風氣，並頒發「最積極推動參與學校獎」，以嘉許年度內成功推薦最多新會員的五間學校，而累積提名會員閱書總量最高的五間學校則獲頒「最積極推動閱讀學校獎」。得獎名單如下：\n\n　　「最積極推動參與學校獎」獲獎學校：\n\n　　佛教榮茵學校\n\n　　和富慈善基金李宗德小學\n\n　　聖公會九龍灣基樂小學\n\n　　聖公會何澤芸小學\n\n　　觀塘官立小學\n\n　　「最積極推動閱讀學校獎」獲獎學校：\n\n　　和富慈善基金李宗德小學\n\n　　香港浸信會聯會小學\n\n　　循道學校\n\n　　聖公會仁立小學\n\n　　聖公會田灣始南小學\n\n　　「兒童及青少年閱讀計劃」以幼稚園至中六的學生為對象，旨在提升兒童及青少年閱讀的興趣，鼓勵他們從小培養閱讀習慣，並與人分享閱讀的樂趣及交流心得。幼稚園至小三的兒童更可與父母以家庭形式參加，促進親子共讀。有興趣參加閱讀計劃的市民，可聯絡就近的公共圖書館或瀏覽www.hkpl.gov.hk/rp。\n\n　　今屆的「閱讀超新星」獲奬作品現於香港中央圖書館地下南門大堂展出至十一月二十五日，稍後會於多間公共圖書館作巡迴展覽。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c10851521c2","title":"財政司司長率團訪問英國和荷蘭","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100315.htm","summary":"財政司司長陳茂波今日（十一月二十一日）深夜啓程前往英國和荷蘭訪問。","summary_short":"財政司司長陳茂波今日（十一月二十一日）深夜啓程前往英國和荷蘭訪問。","digest":"財政司司長陳茂波深夜啓程前往英國和荷蘭訪問","points":["財政司司長陳茂波今日（十一月二十一日）深夜啓程前往英國和荷蘭訪問","他將率領一個20多人的代表團，成員包括多個政府部門、公營機構和行業組織的代表…","十一月二十二日至二十五日訪問英國期間，代表團會到訪劍橋大學…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T12:30:00+08:00","size":1,"keywords":[],"body":"財政司司長陳茂波今日（十一月二十一日）深夜啓程前往英國和荷蘭訪問。他將率領一個20多人的代表團，成員包括多個政府部門、公營機構和行業組織的代表，以及投資界和創科界的領袖（註），以增進香港與兩地的商貿和創科交流，並推廣香港的最新發展，以促成更多的投資與合作。\n\n　　十一月二十二日至二十五日訪問英國期間，代表團會到訪劍橋大學，出席由香港貿易發展局與劍橋大學合辦的創新對話會，並到訪大學的創新成果商品化機構和生物醫藥企業的研發中心。陳茂波一行其後會在倫敦出席香港－歐洲商務委員會全體會議、香港工商協會午餐會，以及由香港貿易發展局舉辦的「香港晚宴」。在倫敦期間，他也會與當地工商金融界和智庫的領袖會面，並出席金融界圓桌會議。\n\n　　十一月二十五日至二十八日訪問荷蘭期間，代表團會前往阿姆斯特丹、海牙和埃因霍溫等地，參觀多個創科園區、創新中心和創科企業。陳茂波一行也會出席多場商務餐會，向當地各界介紹香港的最新情況。此外，陳茂波會與當地政商金融界和智庫的領袖會面，並出席多場圓桌會議和交流會。\n\n　　陳茂波一行將於荷蘭時間十一月二十八日（星期六）上午啓程回港，十一月二十九日早上返抵香港。在他離港期間，財政司副司長黃偉綸將署任財政司司長。\n\n註：代表團成員包括引進重點企業辦公室、投資推廣署、香港貿易發展局、香港投資管理有限公司、香港科技園公司、香港數碼港管理有限公司、港深創新及科技園有限公司、香港生產力促進局、香港應用科技研究院和多個行業組織的代表，以及多家從事初創投資、人工智能、生物科技、通訊科技等範疇的企業的主要負責人。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cceda84a8d5","title":"​創新科技及工業局局長出席《領航 · 追光——歷屆國家最高科學技術獎獲得者特展》科學家精神進校園系列巡展活動啓動儀式致辭","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100291.htm","summary":"以下是創新科技及工業局局長孫東教授今日（十一月二十一日）出席《領航 · 追光——歷屆國家最高科學技術獎獲得者特展》科學家精神進校園系列巡展活動啓動儀式的致辭：  　　尊敬的羅暉部長（中國科學技術協會黨…","summary_short":"以下是創新科技及工業局局長孫東教授今日（十一月二十一日）出席《領航 · 追光——歷屆國家最高科學技術獎獲得者特展》科學家…","digest":"​創新科技及工業局局長出席《領航 · 追光——歷屆國家最高科學技術獎獲得者特展》科學…","points":["尊敬的羅暉部長（中國科學技術協會黨組成員兼國際合作部部長）…","獎項自二○○○年設立至今，共有39位科學家獲獎，包括有「雜交水稻之父」之稱的袁隆平…","他們不僅在所屬科技領域作出傑出貢獻，更是推動國家和世界科學進步的代表"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T12:23:00+08:00","size":1,"keywords":[],"body":"以下是創新科技及工業局局長孫東教授今日（十一月二十一日）出席《領航 · 追光——歷屆國家最高科學技術獎獲得者特展》科學家精神進校園系列巡展活動啓動儀式的致辭：\n\n　　尊敬的羅暉部長（中國科學技術協會黨組成員兼國際合作部部長）、楊書宣部長（中國科學技術協會科學技術創新部部長）、呂峰副部長（中央人民政府駐香港特別行政區聯絡辦公室經濟金融二部副部長）、何巍副部長（中國科學技術協會國際合作部（港澳台辦公室）副部長、一級巡視員）、陳勇及陳學鋒副主席（民建聯副主席）、李志成校長（保良局蕭漢森小學校長）、各位嘉賓、老師、同學：\n\n　　大家早上好！今天非常高興出席《領航 · 追光——歷屆國家最高科學技術獎獲得者特展》啓動儀式。\n\n　　國家最高科學技術獎是國家科學技術獎中的最高榮譽，旨在表彰在當代科技前沿取得突破性成就的技術工作者。獎項自二○○○年設立至今，共有39位科學家獲獎，包括有「雜交水稻之父」之稱的袁隆平，以及拉斯克臨床醫學研究獎和諾貝爾生理學或醫學獎得主屠呦呦。他們不僅在所屬科技領域作出傑出貢獻，更是推動國家和世界科學進步的代表。\n\n　　回顧國家的科技發展歷程，科學家始終秉持「國家需要、民族復興」的初心，以科學力量攻克核心技術難題與解決國家的重大議題。比如，新中國成立之初的「兩彈一星」工程，不僅為國家的國防、航天等高端科技發展奠定基礎，更為國家後來一日千里的發展和民族復興提供堅實後盾。\n\n　　袁隆平教授曾說過：「中國人的飯碗要牢牢掌握到自己手上去，我們要擔當起來！」他堅信，科技進步不僅能幫助中國解決糧食問題，還能造福世界各地人民。憑着這份信念，袁隆平教授與團隊相繼攻克難題，成功培育出超級雜交水稻，提高糧食產量，為世界的糧食安全作出重要貢獻。\n\n　　時至今日，新一代科技工作者繼續秉承老一輩科學家的精神，在不同領域努力不懈，砥礪前行，取得卓越成就。在航天深空探索上，自二○○三年中國首位太空人楊利偉乘坐神舟五號登上太空以來，國家載人航天事業不斷突破，中國空間站更已實現常態化運作，香港的黎家盈博士亦有機會參與國家載人航天任務。在人工智能的賽道上，中國面對技術封鎖和資源限制，仍能自主研發出大語言模型，並創造了目前世界最大的智能機器人應用場景。在高端製造和新能源領域，科技工作者以十年磨一劍的精神，研製出自主創新的高鐵、飛機、郵輪等大型運輸工具。中國的科學家精神是改善人民生活、推動世界進步的重要動力源。\n\n　　這次巡展活動中的科學家故事，希望能在大家心中播下熱愛科學的種子。各位同學，只要心繫家國，勇於嘗試，時刻提升自己，我相信，今天科學的小樹苗明日必能茁壯成長，滋養大地。\n\n　　最後，我衷心感謝中國科協（中國科學技術協會）科學技術傳播中心、科教促進會及各協辦與支持單位，悉心籌備這次活動。祝願全港校園巡展圓滿成功，各位同學學業進步、勇於探索、夢想成真！謝謝大家！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c3ef7ca682c","title":"​財庫局局長在布魯塞爾宣揚香港穩定和具預見性的金融環境","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000289.htm","summary":"財經事務及庫務局局長許正宇十一月二十日（布魯塞爾時間）在比利時布魯塞爾完成其出訪歐洲的最後一站行程。","summary_short":"財經事務及庫務局局長許正宇十一月二十日（布魯塞爾時間）在比利時布魯塞爾完成其出訪歐洲的最後一站行程。","digest":"財經事務及庫務局局長許正宇十一月二十日在比利時布魯塞爾完成其出訪歐洲的最後一站行程","points":["財經事務及庫務局局長許正宇十一月二十日（布魯塞爾時間）在比利時布魯塞爾完成其出訪歐洲的最後一…","其間他與比利時副首相兼財政及退休金事務大臣會面、出席高層專家午餐會，並與多間金融機構進行交流","許正宇十一月十九日（布魯塞爾時間）拜會比利時副首相兼財政及退休金事務大臣Jan Jambon"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T12:00:00+08:00","size":1,"keywords":[],"body":"財經事務及庫務局局長許正宇十一月二十日（布魯塞爾時間）在比利時布魯塞爾完成其出訪歐洲的最後一站行程。其間他與比利時副首相兼財政及退休金事務大臣會面、出席高層專家午餐會，並與多間金融機構進行交流。\n\n　　許正宇十一月十九日（布魯塞爾時間）拜會比利時副首相兼財政及退休金事務大臣Jan Jambon。他表示，面對變幻莫測的經濟環境，香港通過重新定義韌性及策略性多元發展來拓寬經濟基礎，應對挑戰。此外，香港也致力為全球市場參與者構建一個在結算、互聯互通、價格發現、風險管理、倉儲及保險均具可靠能力的黃金及大宗商品生態圈，從而開拓全球相關市場。 \n\n　　許正宇隨後與兩個智庫會面。他先與專注於經濟學研究的布魯蓋爾智庫副總監Katharina Bergant會晤，其後出席為歐洲亞洲事務研究所舉辦的高層次專家圓桌午餐會，並就「重新定義韌性：本幣與黃金如何重塑香港金融」發表演講。他又與出席的歐洲機構、金融服務界、投資界及商界高層代表互動交流。\n\n　　許正宇在闡述多元貨幣如何連結資產和供應鏈，從而增強韌性時指出，香港是離岸人民幣體系的核心，擁有高達1.3萬億元人民幣的龐大資金池，吸引優質發行人來港。同時，與內地有貿易往來的歐洲企業也能以具競爭力的成本，在符合國際標準的環境下，就近其亞洲業務籌集及管理人民幣資金。香港亦具備完善的債券市場工具，讓海外投資者在熟悉的規則下進行人民幣資產融資、對沖及調動。迄今，以離岸人民幣計價發行的債券佔香港上市債券總發行額的38%，已超過美元債的31%。\n\n　　香港現時正積極把自身核心優勢與策略願景相結合。許正宇闡述，當人民幣發揮貿易及投資貨幣的功能、黃金作為策略儲備資產，以及大宗商品連繫實體經濟時，便能形成一個相輔相成的生態圈。在此模式下，以人民幣進行黃金及大宗商品的定價和結算，遂構成串連這三大支柱的共同紐帶。交易商可將黃金運到香港並存放於本地金庫，透過在香港的交易所進行對沖以獲取人民幣融資，整個流程均在單一法律制度及同一時區內完成。隨着相關業務規模日漸壯大，三大支柱將能互相賦能、相得益彰。\n\n　　同日，許正宇到訪比利時金融服務及市場管理局，與主席Jean-Paul Servais會面。雙方就綠色金融和數字金融的發展和監管進行了深入討論。該管理局負責監管比利時的金融業界，與香港的金融監管機構向有合作。\n\n　　許正宇晚上與中華人民共和國駐歐盟使團團長、特命全權大使蔡潤進行晚餐會議。雙方就全球經濟的最新前景和香港的金融狀況交換意見，特別是香港在《五年規劃》下如何充分發揮國際金融中心的角色，連繫內地巿場與歐洲市場。\n\n　　許正宇十一月二十日（布魯塞爾時間）與歐洲聯盟委員會金融穩定、金融服務及資本市場聯盟副總幹事Alexandra Jour-Schroeder博士進行雙邊交流。參與雙邊交流的香港代表團成員包括香港金融管理局、證券及期貨事務監察委員會和香港交易及結算所有限公司的代表；歐方代表則包括歐洲銀行管理局、歐洲證券及市場管理局和歐洲反洗錢管理局的代表。雙方就市場發展、深化互聯互通，以至對接金融新領域的監管制度等多個範疇進行討論。雙方也探討了與構建覆蓋更廣的黃金及大宗商品交易生態圈相關的事宜，並就打擊詐騙及防範金融罪行交流意見和最佳實踐經驗。\n\n　　下午，許正宇與比利時金融業聯合會董事會主席Michael Anseeuw和行政總裁Ruben Lecok會面，向他們介紹香港為提升金融市場流動性及多元化發展而推出的一系列舉措。比利時金融業聯合會擁有逾230個會員機構，代表比利時絕大部分金融業界。\n\n　　他隨後與歐洲清算銀行行政總裁Valérie Urbain會面，以借鏡該集團以「貨銀對付」方式結算本地及國際證券交易方面的豐富經驗。即將於下季全面運作的香港黃金中央清算及結算系統也會透過連結即時支付結算系統，實現「貨銀對付」結算，從而降低結算風險並提升整體運作效率。\n\n　　許正宇也拜會了中國駐比利時大使館臨時代辦李艷，就香港與比利時之間的金融合作空間交換意見。\n\n　　在結束出訪行程前，許正宇設宴款待比利時的家族辦公室代表，與會者就香港與歐洲的投資機遇及金融市場發展交流。許正宇指出，雖然香港現已成為全球最大的跨境財富管理中心，但在便利更多家族辦公室善用香港作為財富傳承樞紐方面未有放慢腳步。政府正進行修訂法例的工作，優化有關基金、單一家族辦公室和附帶權益的優惠稅制。相關條例草案獲通過後，優惠稅制會由二○二五／二六課稅年度起生效。此外，政府將優化房地產投資信託基金制度，以提供更大便利。\n\n　　許正宇呼籲比利時家族辦公室探索香港在資產配置多元化及財富管理方面的優勢，把握機遇。他補充說，在投資推廣署的協助下，二○二六年首十個月已有超過75間家族辦公室在港設立或擴展業務，另有約160間家族辦公室表示正準備或已決定在港設立或擴展業務。\n\n　　許正宇十一月二十一日（布魯塞爾時間）啓程返港。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cff1cba13db","title":"​廟岩共生 鬧市瑰寶","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000652.htm","summary":"建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟。","summary_short":"建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟。","digest":"建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟","points":["建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟","古廟順應天然岩石興建，體現因地制宜的工藝和建築智慧","廟內供奉多名神祇，反映華人民間信仰兼容並蓄的特色"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T10:17:00+08:00","size":1,"keywords":[],"body":"建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟。古廟順應天然岩石興建，體現因地制宜的工藝和建築智慧。廟內供奉多名神祇，反映華人民間信仰兼容並蓄的特色。\n\n　　發展局古物古蹟辦事處代表接受《政府新聞網》訪問，講解古廟依岩而建的建築特色和灣仔海岸線變遷的歷史，古廟管理機構代表則介紹廟方未來如何推廣傳統文化。\n\n　　有關報道今日（十一月二十一日）以文字和短片方式上載至www.news.gov.hk/chi/feature。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7e1af16b15","title":"數個泳灘懸掛紅旗","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100225.htm","summary":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂及文化事務署今日（十一月二十一日）宣布，由於大浪關係，港島南區的赤柱正灘泳灘及大浪灣泳灘…","summary_short":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂及文化事務署今日（十一月二十一日）宣…","digest":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂…","points":["電台及電視台當值宣布員注意：","游泳人士請注意：康樂及文化事務署今日（十一月二十一日）宣布，由於大浪關係…","西貢區的銀線灣泳灘及清水灣第二灣泳灘已懸掛紅旗，顯示在該處游泳會有危險，市民請勿在該處游泳"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T10:12:21+08:00","size":1,"keywords":[],"body":"電台及電視台當值宣布員注意：\n\n請盡快播出下列特別報告：\n\n　　游泳人士請注意：康樂及文化事務署今日（十一月二十一日）宣布，由於大浪關係，港島南區的赤柱正灘泳灘及大浪灣泳灘；西貢區的銀線灣泳灘及清水灣第二灣泳灘已懸掛紅旗，顯示在該處游泳會有危險，市民請勿在該處游泳。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":18,"items":[{"id":"cca0c7fdd06","title":"Engine spark prompts HK to Papua New Guinea emergency landing","url":"https://news.tvb.com/tc/1207617-EnginesparkpromptsHKtoPapuaNewGuineaemergencylanding","summary":"An Air Niugini plane carrying 146 passengers and crew departingHong Kong for Papua New Guinea a safe…","summary_short":"An Air Niugini plane carrying 146 passengers and crew depart…","digest":"An Air Niugini plane carrying 146 passenge…","points":["An Air Niugini plane carrying 146 passengers a…","Hong Kong for Papua New Guinea a safe emergenc…","landing in southern Philippines Davao Internat…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T19:48+08:00","size":1,"keywords":[],"body":"An Air Niugini plane carrying 146 passengers and crew departing\nHong Kong for Papua New Guinea a safe emergency \nlanding in southern Philippines Davao International Airport.\nFootage shows some of the 137 passengers and nine crew members\nwalking onto a grass field after they had\ndisembarked the Boeing 767-383ER through emergency slides. \nThe pilots reported they detected possible sparks or fire in the right engine, \nprompting the move to divert and land in the Philippines, according to \naviation officials.\nThe Davao Airport shut down air traffic for the emergency landing \nbut has subsequently reopened.","image":"https://pro-vod-cdn.tvb.com/a6b3f948f76f439cb0e4b869bdf76b2a/snapshots/d63c1141d89d47798168c17efd288217-00004.jpg","video":"https://pro-vod-cdn.tvb.com/a6b3f948f76f439cb0e4b869bdf76b2a/b516081956e6439bbacbd632c1baa483-9af4f333fb6cbc82843a8176e3eccb3c-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/a6b3f948f76f439cb0e4b869bdf76b2a/snapshots/d63c1141d89d47798168c17efd288217-00004.jpg","lang":"en"},{"id":"c4ca7928163","title":"Gov't hopeful that 2026 visitor figure will reach 53 million","url":"https://news.tvb.com/tc/1207641-Govthopefulthat2026visitorfigurewillreach53million","summary":"Secretary for Culture, Sports and Tourism Rosanna Law expresses confidence in the city's tourism sec…","summary_short":"Secretary for Culture, Sports and Tourism Rosanna Law expres…","digest":"Secretary for Culture…","points":["Secretary for Culture, Sports and Tourism Rosa…","She adds authorities have been striving to org…","According to government estimates…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T19:11+08:00","size":1,"keywords":[],"body":"Secretary for Culture, Sports and Tourism Rosanna Law expresses confidence in the city's tourism sector -- believing the tourist figure will reach the targeted 8% growth year-on-year. \nShe adds authorities have been striving to organise more nighttime activities in hopes of driving more local consumption. \nAmid the continual rise of tourists visiting the city, Hong Kong recorded more than 45 million tourists as of October -- marking a 12% year-on-year increase.\nAccording to government estimates, the city is set to record a total of 53.8 million visitors in 2026, which is an 8% increase year-on-year.\nThis as Secretary for Culture, Sports and Tourism Rosanna Law said the government is confident the city will reach this target. \nShe said the government has strengthened efforts to promote light shows and nighttime events starting with the Mid-Autumn Festival, in hopes of creating a lively atmosphere all across the city to attract residents to visit landmarks they haven't been to in a long time.\nLaw said such arrangements were not made just for foreign tourists, stressing the importance of preserving local flavours. \nMentioning the conclusion of the APEC summit in Shenzhen, she said attendees of the event also took the opportunity to visit Hong Kong. \nShe noted several hotel managers in the East Tsim Sha Tsui area told her hotel occupancy rates reached 92 to 93% during the period, with many guests arriving from abroad.","image":"https://pro-vod-cdn.tvb.com/759ae5afb75445cb833264ada73caae4/snapshots/d76f5a970d8a4a2e9d81bc30b1813364-00008.jpg","video":"https://pro-vod-cdn.tvb.com/759ae5afb75445cb833264ada73caae4/b795c3ff5aa9404a9f01022f35e7c7de-ca6018ae44d2e91b483a6cd65f697030-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/759ae5afb75445cb833264ada73caae4/snapshots/d76f5a970d8a4a2e9d81bc30b1813364-00008.jpg","lang":"en"},{"id":"cd250b5d8c8","title":"广西钦州港口岸获评中西部地区首个“国际卫生港口”","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-21/10735785.shtml","summary":"中新网南宁11月21日电(李虎祥 钟闯瑜 林浩)11月21日，经世界卫生组织专家组实地测评，广西钦州港口岸正式荣获“国际卫生港口”称号，成为中国中西部地区首个获此认证的水运口岸。","summary_short":"中新网南宁11月21日电(李虎祥 钟闯瑜 林浩)11月21日，经世界卫生组织专家组实地测评…","digest":"11月21日，经世界卫生组织专家组实地测评…","points":["中新网南宁11月21日电(李虎祥 钟闯瑜 林浩)11月21日，经世界卫生组织专家组实地测评…","该称号是世界卫生组织对国际通航口岸安全与卫生控制能力的高度认可…","“国际卫生港口”是世界卫生组织依据《国际卫生条例(2005)》，围绕口岸卫生基础设施建设…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:26:13+08:00","size":1,"keywords":[],"body":"中新网南宁11月21日电(李虎祥 钟闯瑜 林浩)11月21日，经世界卫生组织专家组实地测评，广西钦州港口岸正式荣获“国际卫生港口”称号，成为中国中西部地区首个获此认证的水运口岸。\n\n　　该称号是世界卫生组织对国际通航口岸安全与卫生控制能力的高度认可，标志着钦州港口岸公共卫生治理能力迈入国际先进行列，为中国—东盟自贸区3.0版升级议定书生效实施营造了良好环境。\n\n图为授牌仪式现场。南宁海关 供图\n\n　　“国际卫生港口”是世界卫生组织依据《国际卫生条例(2005)》，围绕口岸卫生基础设施建设、卫生管理体系运行、突发公共卫生事件应急处置能力开展的权威性测评认定。\n\n　　南宁海关卫生检疫处副处长郭枫介绍，创建过程中，该关聚焦检疫管控、病媒生物监测、技术支撑等重点模块，坚持高标准推进，将口岸公共卫生核心能力要求深度融入港口标准化建设、日常运营管理的全流程，推动创建成果实时转化，口岸公共卫生安全水平、协同处置能力、口岸开放能级持续跃升。\n\n　　依托科技创新赋能，钦州港口岸公共卫生防控与通关服务质效实现双重跃升。口岸创新打造西部沿海地区首个“智慧湾”智能监控指挥调度系统，建立“一平台调度、多主体联动、全流程防控”联合指挥调度机制，全面打通海关、港口、海事、船方等多方数据交互共享通道，实现货物即到即查、快验快放，口岸集疏运效率提升25%。\n\n　　口岸应对突发公共卫生事件时，多部门能即时沟通、共同研判指挥、分级高效处置，大幅提升应急防控实战能力。\n\n　　同时，钦州港口岸全面推行智慧电讯检疫，优化无接触式卫生检疫模式，实现船舶7×24小时快速通关，靠泊等待时间缩减30%以上，单船船舶通关节约通关时长超10小时。\n\n　　依托东盟口岸传染病监测预警中心平台，钦州港口岸精准落实“一国一策、一病一策、一口岸一策”，做到风险早研判、疫情早发现、处置早闭环，有效提升病媒监测预警智能化、精细化水平，有效防范鼠类传疾病及登革热、基孔肯雅热、疟疾等蚊媒传染病跨境传播。\n\n　　海关总署相关负责人表示，此次成功获评，不仅强化了钦州港口岸突发公共卫生事件应对处置能力，构建起安全、高效、便捷的国际化通关环境，更将有力赋能国际贸易和区域经贸合作，为高质量共建“一带一路”，构建更为紧密的中国—东盟命运共同体注入强劲动力。\n\n　　下一步，钦州港口岸将持续巩固创建成果，健全长效管理机制。当地海关将立足口岸检疫监管职责，不断强化风险研判、完善防控体系，协同各方守牢国门公共卫生安全防线，持续优化口岸营商环境。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5c7d98b8eb","title":"西藏开展2026年冰雪运动进机关和企事业单位活动","url":"https://www.chinanews.com.cn/ty/2026/11-21/10735769.shtml","summary":"中新网拉萨11月21日电 (李林)为补齐冬季全民健身活动供给短板，20日，2026年西藏自治区冰雪运动进机关和企事业单位活动在拉萨市堆龙德庆区康嘎楚希峰顺利举办，全区各党政机关…","summary_short":"中新网拉萨11月21日电 (李林)为补齐冬季全民健身活动供给短板，20日…","digest":"为补齐冬季全民健身活动供给短板，20日…","points":["中新网拉萨11月21日电 (李林)为补齐冬季全民健身活动供给短板，20日…","图为参与队伍列队有序出发，沉浸式开展高原冰雪徒步健身运动","本次活动由西藏自治区体育局、中共西藏自治区直属机关工作委员会主办，西藏自治区登山队…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T16:46:21+08:00","size":1,"keywords":[],"body":"中新网拉萨11月21日电 (李林)为补齐冬季全民健身活动供给短板，20日，2026年西藏自治区冰雪运动进机关和企事业单位活动在拉萨市堆龙德庆区康嘎楚希峰顺利举办，全区各党政机关、企事业单位干部职工及户外运动爱好者200余人踊跃参与。\n\n图为参与队伍列队有序出发，沉浸式开展高原冰雪徒步健身运动。西藏自治区体育局供图\n\n　　活动现场氛围热烈、秩序井然。随着活动正式启动，参与队伍列队有序出发，沉浸式开展高原冰雪徒步健身运动。为全力保障活动安全有序开展，西藏自治区登山队选派专业高山向导全程护航值守，现场教学高原冰雪路面行进专业技巧，细致解读高原冬季户外运动安全规范、风险防控要点。\n\n　　据悉，冰雪运动进机关和企事业单位活动已在西藏连续多年常态化开展，是西藏冬季全民健身的标杆品牌活动，有效带动全民冰雪健身热情，持续浓厚冬季健身氛围。\n\n　　下一步，西藏自治区体育局将立足高原特色体育资源禀赋，持续深挖冰雪体育发展潜力，不断丰富冬季全民健身活动载体、创新活动形式内容，常态化普及推广高原冰雪运动。\n\n　　本次活动由西藏自治区体育局、中共西藏自治区直属机关工作委员会主办，西藏自治区登山队、拉萨市体育局承办，西藏自治区体育彩票管理中心、堆龙德庆区人民政府协办。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c743229cd2c","title":"NBA·有片｜哈登轟51分超越高比 37歲老將聊發少年狂：得分能力絕非只剩回憶","url":"https://www.stheadline.com/basketball-zone/3639592/NBA有片哈登轟51分超越高比-37歲老將聊發少年狂得分能力絕非只剩回憶","summary":"過去幾個賽季，哈登（James Harden）的打法逐漸轉型，從昔日那個無所不能的得分機器，演變成更專注為隊友創造機會的組織者。","summary_short":"過去幾個賽季，哈登（James Harden）的打法逐漸轉型，從昔日那個無所不能的得分機器…","digest":"過去幾個賽季，哈登（James Harden）的打法逐漸轉型…","points":["過去幾個賽季，哈登（James Harden）的打法逐漸轉型，從昔日那個無所不能的得分機器…","然而在美國時間周五（20日）的NBA盃小組賽，這位37歲老將向外界證明…","他全場狂轟賽季新高的51分，帶領騎士以128:119擊敗溜馬…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:41:05+08:00","size":1,"keywords":[],"body":"過去幾個賽季，哈登（James Harden）的打法逐漸轉型，從昔日那個無所不能的得分機器，演變成更專注為隊友創造機會的組織者。然而在美國時間周五（20日）的NBA盃小組賽，這位37歲老將向外界證明，其頂級得分能力依然未被歲月完全帶走，絕非只剩下回憶。他全場狂轟賽季新高的51分，帶領騎士以128:119擊敗溜馬，更在生涯「50+」場次上正式超越已故傳奇高比拜仁（Kobe Bryant），升上歷史第三位。\nJAMES HARDEN. 51 POINTS. IT'S HIS MOST POINTS AS A CAVALIER 🤯 CAVS MOVE TO 2-1 IN EMIRATES NBA CUP GROUP PLAY! https://t.co/twWJ4G70Nk\n— NBA (@NBA) November 21, 2026哈登今仗上陣賽季新高的40分鐘，全場26投15中，當中三分球11射7中，加上罰球14射全中，交出51分、6籃板及6助攻的亮眼數據。這不僅是他自今年2月季中交易加盟騎士以來的單場最高得分，更是他相隔近一年後再次突破50大關——他上一次斬獲「50+」，已是2025年11月22日效力快艇對陣黃蜂時攻入的55分。憑藉今場爆發，迎來生涯第26次單場「50+」的哈登，成功打破與高比並列近一年的僵局，目前在歷史排行榜上僅次於名宿張伯倫（Wilt Chamberlain，118次）及米高佐敦（Michael Jordan，31次）。\n對於熟悉哈登「火箭時代」的老球迷而言，這份數據難免令人感到恍惚。昔日處於巔峰期的他，曾交出常規賽場均36.1分的恐怖數據；但在今仗大爆發前，他本季場均得分僅為16.2分。談到角色的轉變，哈登坦言：「對我來說，現在的角色已經不同了。我的球權使用率不再是每場都極高，球隊有其他人負責這工作。我的任務是在需要時得分，然後分配球權。當球隊需要我挺身而出時，我依然能做到。我知道自己可以，只是當你不經常這樣做時，感覺會有點流失，甚至會懷疑自己是否還具備這能力。」\n騎士上季曾殺入東岸決賽，惟今季開局表現反覆，即使近4戰3勝，目前戰績僅為9勝8負。作為征戰聯盟18年的老將，哈登對自己的「進化」感受甚深：「最讓我興奮的是，即使到了生涯第18個賽季，我仍在學習如何發揮影響力。年輕時很容易，你可以跑得快、跳得高去過人；現在速度慢了，你就要思考如何擺脫對手。這就是哈登的進化。今晚大大提升了我的自信，證明我依然能在高水平賽事中做到這一點。」\n賽後談及超越偶像高比的歷史性里程碑，哈登感到榮幸與謙卑：「當你談論籃球時，張伯倫顯然是精英，但在得分後衛的位置上，佐敦和高比就是史上最出色的球員。能夠進入這樣的討論行列，讓我感到非常謙卑，這絕對是一件特別的事情。」同時，他亦深情地表達了對高比的思念：「他是我的偶像，是我成長過程中一直關注和學習的人。他對待籃球的態度，以及為這項運動付出的努力，都非常特別。我們很掛念他，非常非常掛念他。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c271ef47f92","title":"獎金紀錄王「浪漫勇士」榮休日 雙「浪漫」錦上添花？","url":"https://www.stheadline.com/realtime-racing/3639588/獎金紀錄王浪漫勇士榮休日-雙浪漫錦上添花","summary":"馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式，向這匹兩屆香港馬王 (2023/24及2025/26年度馬季)致敬。","summary_short":"馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式…","digest":"馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式…","points":["馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式…","「浪漫勇士」服役期間累計贏得總獎金逾二億八千八百七十四萬港元，是全球歷來累積獎金最多的賽駒…","周日沈集成部署「浪漫鬥士」及「浪漫戰神」分別出戰第五及九場，其中後駒報爭二千米馬會盃…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:05:46+08:00","size":1,"keywords":[],"body":"馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式，向這匹兩屆香港馬王 (2023/24及2025/26年度馬季)致敬。\n「浪漫勇士」服役期間累計贏得總獎金逾二億八千八百七十四萬港元，是全球歷來累積獎金最多的賽駒，馬會周日將會向馬主劉栢輝頒發終身成就獎的獎座，以表彰「浪漫勇士」的成就。\n周日沈集成部署「浪漫鬥士」及「浪漫戰神」分別出戰第五及九場，其中後駒報爭二千米馬會盃，對於劉栢輝來說，如果在「浪漫勇士」榮休歡送儀式同一日贏馬拉頭馬捧盃，自然更為難忘。\n按圖睇有關相片：\n陳嘉甜","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce2ebb132c2","title":"冬奥场馆开启新赛季 四项国际雪联顶级赛事落地云顶滑雪公园","url":"https://www.chinanews.com.cn/ty/2026/11-21/10735707.shtml","summary":"中新网张家口11月21日电 河北省张家口市云顶滑雪公园日前发布2026-2027赛季“云顶巅峰赛季”赛程，四项国际雪联顶级赛事落户冬奥场馆，时间从2026年12月持续至2027年2月，覆盖自由式滑雪…","summary_short":"中新网张家口11月21日电 河北省张家口市云顶滑雪公园日前发布2026-2027赛季“云顶巅峰赛季”赛程…","digest":"河北省张家口市云顶滑雪公园日前发布2026-2027赛季“云顶巅峰赛季”赛程…","points":["云顶滑雪公园是2022年北京冬奥会自由式滑雪、单板滑雪竞赛场馆","该场地赛道条件优越，常年承办世界杯等国际顶级雪上赛事，兼顾专业竞技与大众滑雪","12月6日至13日，这里将举行自由式滑雪及单板滑雪U型场地世界杯…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:47:33+08:00","size":1,"keywords":[],"body":"中新网张家口11月21日电 河北省张家口市云顶滑雪公园日前发布2026-2027赛季“云顶巅峰赛季”赛程，四项国际雪联顶级赛事落户冬奥场馆，时间从2026年12月持续至2027年2月，覆盖自由式滑雪、单板滑雪多个项目，将为冰雪运动爱好者献上一场横跨整个雪季的赛事盛宴。\n\n　　云顶滑雪公园是2022年北京冬奥会自由式滑雪、单板滑雪竞赛场馆。该场地赛道条件优越，常年承办世界杯等国际顶级雪上赛事，兼顾专业竞技与大众滑雪。\n\n　　12月6日至13日，这里将举行自由式滑雪及单板滑雪U型场地世界杯，预计将有来自12至13个国家和地区的160至180名运动员及随队官员参赛。作为两届冬奥会冠军，从北京冬奥会起，谷爱凌每年都在云顶这条赛道站上最高领奖台；2025年12月，她在这里实现世界杯云顶站三连冠。此次，谷爱凌继续领衔中国队出战，张可欣、单板新锐周苡竹等也将主场征战。英国选手佐伊·阿特金和日本名将户冢优斗、平野步梦等选手均将参赛。\n\n图为河北省张家口市云顶滑雪公园内的U型场地技巧世界杯比赛场地。主办方供图\n\n　　2027年1月12日至18日，单板滑雪障碍追逐世界杯将接棒上演，这是该项目在北京冬奥会后首次重返云顶。北京冬奥会该项目冠军、美国名将琳赛·雅各贝利斯等选手将再度亮相，中国新生代运动员也将在家门口练兵。\n\n　　2027年2月14日至20日，自由式滑雪空中技巧世界杯在云顶举行。作为中国雪上传统优势项目，徐梦桃、齐广璞两位冬奥冠军将和李天马、陈梅婷等年轻选手携手冲击奖牌。本站赛事同时承担2029年张家口世锦赛测试赛功能，是中国队备战新冬奥周期的重要一站。\n\n　　2027年2月14日至27日将举行国际雪联单板和自由式世界青年锦标赛，这是国内迄今规格最高的青年国际雪上赛事，也是青奥会资格赛，预计将有20至30个国家和地区的300余名青年选手参赛，同时为2029年张家口世锦赛提前预热。\n\n　　据悉，四项赛事均设置独立比赛场地，不占用大众滑雪区域，滑雪爱好者可在正常滑雪的同时近距离观摩顶级赛事。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb77cbfb6bc","title":"兰花奖得主 斯诺夫妇后人：美中人民间的理解永远值得追求","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-21/news1075638.shtml","summary":"11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖。","summary_short":"11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖。","digest":"11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖","points":["11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖","他表示，海伦·福斯特·斯诺一生致力于帮助人们了解中国，并在美中两国之间建立友谊","我希望我能回到过去让她知道，她架起的“桥”仍然屹立不倒，最重要的是，人们仍然走在这座桥上"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T13:41:07+08:00","size":1,"keywords":[],"body":"11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖。\n\n他表示，海伦·福斯特·斯诺一生致力于帮助人们了解中国，并在美中两国之间建立友谊。我希望我能回到过去让她知道，她架起的“桥”仍然屹立不倒，最重要的是，人们仍然走在这座桥上。\n\n今天我带着感激之情接受这个奖项，同时也带着责任感，友谊的工作永远不会结束。每一代人都必须选择继续下去。我把这份荣誉献给海伦，献给每一位继承她遗志的人，献给所有相信美中两国人民之间的理解永远值得追求的人。\n\n(孙恒业 肖欣 吴昕妮 北京报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/F1B7C0AD76EE4CAF9A44D6DCED364530.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c20b9189d01","title":"Mourners at Cincinnati Zoo remembers Fiona the hippo","url":"https://news.tvb.com/tc/1207601-MournersatCincinnatiZooremembersFionathehippo","summary":"Mourners at Cincinnati Zoo remembered Fiona the hippo as a ray of \"light and hope\" after the hippo d…","summary_short":"Mourners at Cincinnati Zoo remembered Fiona the hippo as a r…","digest":"Mourners at Cincinnati Zoo remembered Fion…","points":["Fiona, the hippo whose premature birth and fig…","Veterinarians and staff tried for days to help…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T13:00:00+08:00","size":1,"keywords":["United States","zoo"],"body":"Mourners at Cincinnati Zoo remembered Fiona the hippo as a ray of \"light and hope\" after the hippo died on November 19 from complications after swallowing a knit hat accidentally flung into her enclosure.\nFiona, the hippo whose premature birth and fight for survival at the Cincinnati Zoo turned her into a global sensation nearly a decade ago. She was 9 years old. \nVeterinarians and staff tried for days to help the hippo safely digest and pass a knit cap she swallowed, but the efforts were ultimately unsuccessful.","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026QiXqwZLpxH1795237292.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/6fd3351c64d940b9b8ff3be5ad1ab7db/430719ca37b94f35baa9826a64fc3cce-121c261bc3e523ac98dbf07af3fda321-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026QiXqwZLpxH1795237292.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"cdc1b6d0475","title":"Cool morning to be followed by sunny intervals","url":"https://news.tvb.com/tc/1207598-Coolmorningtobefollowedbysunnyintervals","summary":"Affected by the northeast monsoon, the weather in Hong Kong was cool this morning.The sky was overca…","summary_short":"Affected by the northeast monsoon…","digest":"Affected by the northeast monsoon…","points":["Affected by the northeast monsoon…","The sky was overcast in the morning…","Temperatures across various districts were rec…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T12:38:00+08:00","size":1,"keywords":["HKO","cool"],"body":"Affected by the northeast monsoon, the weather in Hong Kong was cool this morning.\n\nThe sky was overcast in the morning, and many elderly people put on jackets to keep warm.\n\nTemperatures across various districts were recorded at around 13 to 16 degrees Celsius in the early morning, with Tsuen Wan recording a minimum temperature of just 11.9 degrees.\nThe Observatory stated that as the broad band of clouds covering southern China gradually moves away, the weather will improve briefly. Today will see sunny intervals and very dry conditions during the day, with a maximum temperature of around 20 degrees.\n\nAs an easterly airstream reaching strong force affects the coast of southern China early next week, temperatures will rise slightly. However, affected by another northeast monsoon next Tuesday, temperatures in Hong Kong will drop again with a few showers.","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026wgv5LlIXm31795235889.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/8dc57df67d564e0e90a10bbf8fe163ff/2953d5e4dcd442758a03d7486ca13fa3-f1c76f6f654b12911eb6547529214efa-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026wgv5LlIXm31795235889.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c2f0f347e23","title":"Earthquake hits Peru with no immediate damage reported","url":"https://news.tvb.com/tc/1207594-EarthquakehitsPeruwithnoimmediatedamagereported","summary":"A magnitude 6.7 earthquake shook the Andes in central Peru on Friday with no immediate reports of da…","summary_short":"A magnitude 6.7 earthquake shook the Andes in central Peru o…","digest":"A magnitude 6.7 earthquake shook the Andes…","points":["A magnitude 6.7 earthquake shook the Andes in…","Peru lies along the \"Ring of Fire,\" a 40…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T12:15:00+08:00","size":1,"keywords":["earthquake","Peru"],"body":"A magnitude 6.7 earthquake shook the Andes in central Peru on Friday with no immediate reports of damage or casualties.\n\nThe U.S. Geological Survey said the earthquake struck at 7:09 p.m. local time (0900 GMT Saturday). Its epicenter was in the Andes, 34 kilometers (21 miles) north of Junin, at a depth of 108 kilometers (67 miles).\n\nPeru's Geophysical Institute said no damages or casualties had been reported.\n\nThe earthquake was felt in the Peruvian capital, prompting residents to rush into the streets.\n\nPeru lies along the \"Ring of Fire,\" a 40,000-kilometer (25,000-mile) arc of volcanoes and fault lines around the Pacific Basin, where most of the world's earthquakes occur.\n\nIn August, a 6.7 magnitude earthquake in the Peruvian Andes left two people injured and damaged several homes, health centers and schools, while in July, a 5.5-magnitude quake in the Junín region resulted in six deaths and 30 injuries.","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026tq0rRbU22s1795234502.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/2d4da464ebf248de9d2fd2b1d4ff2ec8/9ff480c64ef24df48e7b8b75b72f9b7c-0ad52e05432518181d0c4ed0308b467a-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026tq0rRbU22s1795234502.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"c55852c9679","title":"第三届兰花奖颁奖 诺贝尔文学奖得主勒克莱齐奥获终身荣誉奖","url":"https://www.chinanews.com/cul/shipin/cns/2026/11-21/news1075633.shtml","summary":"11月20日，第三届兰花奖颁奖典礼在北京举行。","summary_short":"11月20日，第三届兰花奖颁奖典礼在北京举行。","digest":"11月20日，第三届兰花奖颁奖典礼在北京举行","points":["11月20日，第三届兰花奖颁奖典礼在北京举行","法国作家、诺贝尔文学奖得主让-马里·居斯塔夫·勒克莱齐奥、新加坡学者马凯硕、英国导演柯文思…","获得终身荣誉奖的勒克莱齐奥在演讲中表示，文学艺术能够承担文化交流的使命"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T12:08:37+08:00","size":1,"keywords":[],"body":"11月20日，第三届兰花奖颁奖典礼在北京举行。法国作家、诺贝尔文学奖得主让-马里·居斯塔夫·勒克莱齐奥、新加坡学者马凯硕、英国导演柯文思、美国友人亚当·福斯特等十人获奖。获得终身荣誉奖的勒克莱齐奥在演讲中表示，文学艺术能够承担文化交流的使命。兰花奖评委，作家麦家在演讲中表示，兰花奖是君子精神的体现。\n\n(孙恒业 肖欣 吴昕妮 北京报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/7FE0EB23686F463E8271E47DDF0D3F95.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c1a5f128717","title":"五中全会精神在基层丨“放心田”背后是责任心","url":"https://www.chinanews.com.cn/ll/2026/11-21/10735676.shtml","summary":"走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间。","summary_short":"走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间。","digest":"走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间","points":["走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间","种粮大户胡昆站在田埂上，望着满眼金黄的稻谷对记者说：“今年又是好年成","南昌县是产粮大县，部分早期建成的农田已不同程度出现沟渠淤塞、设施老化等问题"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:32:54+08:00","size":1,"keywords":[],"body":"走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间。\n\n　　种粮大户胡昆站在田埂上，望着满眼金黄的稻谷对记者说：“今年又是好年成。修整之后，机耕道路直达地头，光收割这一项，一亩地就能省下不少钱。”\n\n　　党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》明确提出，深化政绩观教育，引导干部坚持立党为公、为民造福、科学决策、真抓实干，创造经得起实践、人民、历史检验的实绩，并要求常态化整治群众身边不正之风和腐败问题。\n\n　　南昌县是产粮大县，部分早期建成的农田已不同程度出现沟渠淤塞、设施老化等问题。整治正是从这些具体问题入手。南昌县农业农村、纪检监察、财政等部门组成工作专班，紧盯工程质量、资金使用、建后管护等关键环节，深入乡村走访种粮大户、村干部和群众，查找建后管护中的堵点难点。\r\n\n　　前不久，幽兰镇给高标准农田做了“全面体检”，工作人员挨个排查179座提灌设施，更换电机、检修管道、重新铺设线路，灌溉用水顺着沟渠汩汩流淌。在幽兰镇厚田村，村民万平看着渠里淌过来的清水说：“现在水排得顺、灌得上，来年稻子能长得更好。”整治以来，南昌县修缮各类提灌设施700多座。\n\n　　高标准农田，三分靠建、七分靠管。在泾口乡东岗村，驻村第一书记雷家胜带着管护志愿队巡田，清淤泥、平田块、查设备。队员里有村干部、老党员，也有种粮大户和村民代表。泾口乡把管护责任落实到人，干部包村包片，做到田里有人巡、沟渠有人管、道路有人修。目前，这套田间管护的做法，正在南昌县全县推广。\n\n　　既抓问题整治，更要建好机制。南昌县将建后管护经费纳入年度预算，建立了530多人的建后管护队伍，并探索“大户直管+村级统管+保险补充”的综合管护模式。\n\n　　农田建得好不好、管护到不到位，老百姓最有发言权。在冈上镇晋安村，刚整修完的机耕道旁，一块高标准农田项目公示牌上清清楚楚标识着整改内容、验收标准、管护责任人员。当地村民说：“牌子立在田埂上，做得好不好，一眼就能看明白。”\n\n　　南昌县在高标准农田整治工作中大力发挥群众监督作用，推行“六步群众工作法”：台账底数向群众公开、问题整改请群众认可、修复清单由群众首报、项目建设请群众参与、建后管护受群众监督、整治成效由群众共享。同时，每个乡镇都开通高标准农田管理服务“书记热线”，群众有咨询、要报修、想反映问题，一个电话就能对接。\n\n　　当田地有人巡、沟渠有人管、群众监督能落地，高标准农田便真正成为长久好用的“放心田”。(经济日报记者 刘兴) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8d9cd0d7d0","title":"麦家：今天的中国给作家提供了取之不尽的创作活水","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-21/news1075629.shtml","summary":"11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示，今天的中国是世界经济发展的重要引擎，也是世界文明最重要的保护者和建设者。","summary_short":"11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示，今天的中国是世界经济发展的重要引擎…","digest":"11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示…","points":["11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示…","今天的中国作家既能畅通地学习和借鉴世界文学的累累硕果，同时又处在活力四射…","我个人十分有信心，以后写出更多好的作品，向世界文学致敬，向世界人民致意"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T10:47:50+08:00","size":1,"keywords":[],"body":"11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示，今天的中国是世界经济发展的重要引擎，也是世界文明最重要的保护者和建设者。今天的中国作家既能畅通地学习和借鉴世界文学的累累硕果，同时又处在活力四射、国泰民安的大好时期，热火朝天，多层次、多触角的生活给中国作家提供了取之不尽的创作活水。我个人十分有信心，以后写出更多好的作品，向世界文学致敬，向世界人民致意。\n\n(孙恒业 肖欣 吴昕妮 北京报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/2DE46AE7D653495C893487431A996491.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ccb34dec837","title":"誰來守護年邁父母 闊佬懶理又多意見 手足再多都無用 最孝順注定最吃虧？ 照顧者：連喊累都無資格｜Juicy叮","url":"https://www.stheadline.com/local-topics/3639509/誰來守護年邁父母-闊佬懶理又多意見-手足再多都無用-最孝順注定最吃虧-照顧者連喊累都無資格Juicy叮","summary":"有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用，有人不是闊佬懶理就是意見多多。","summary_short":"有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用，有人不是闊佬懶理就是意見多多。","digest":"有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用…","points":["有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用，有人不是闊佬懶理就是意見多多","相反，默默付出的那一個則注定吃虧，天天陪伴張羅看病、打理日常生活卻無人體諒…","網民對這「能者過勞」情況大表同情，痛心最孝順的人往往最受委屈"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:45:31+08:00","size":1,"keywords":[],"body":"有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用，有人不是闊佬懶理就是意見多多。\n相反，默默付出的那一個則注定吃虧，天天陪伴張羅看病、打理日常生活卻無人體諒，當上照顧者的更是連喊累都無資格。網民對這「能者過勞」情況大表同情，痛心最孝順的人往往最受委屈。詳情見下圖及下文：\n誰來守護年邁父母 闊佬懶理又多意見 手足再多都無用 最孝順注定最吃虧？ 照顧者：連喊累都無資格逐張睇↓↓↓↓\n闊佬懶理卻最多意見\n樓主早前在社交平台 Threads發帖直言，有些為人子女的，「逢年過節回來吃頓飯，買點東西，就被誇得孝順又貼心」，相反，有些「天天陪著父母看病、拿藥、張羅三餐，累得連自己的生活都快顧不好，卻沒人覺得他辛苦。」\n最令樓主不甘心的是，平常不出錢、不出力的人，意見往往最多，導致「真正照顧父母的人，反而連喊累的資格都沒有！」樓主直指孝順不是嘴巴說說或偶爾回家演戲，並無奈發問：「照顧年邁父母的責任，真的應該落在最孝順的那個孩子身上嗎？」\n網民：父母眼盲偏心\n貼文引來網民共鳴，有人痛心直言「會吵會哭的才有糖吃」，會演戲、會喊窮的手足反而最受父母偏心。\n有網民道出同住照顧者的無奈，指責任「會落在同住的人身上，才不會管你孝不孝」，根本避無可避。\n有人更加稱「這是真的，但有些是父母捨不得叫他們最疼愛的孩子來照顧」，指出父母偏心大細超的現實，並嘆道「會孝順的孩子通常心比較軟也比較有責任感，能者過勞」。\n有網民因而感慨「偏偏父母也嚴重的眼盲心瞎，偏心著會演戲、會喊窮的⋯ 對於付出的人，視為理所當然。」\n有人更進一步表示：「通常最愛錫嗰個長大後係最敗家，最不理家人嗰個」，偏偏父母最偏心他，反而「照顧父母者，往往都最受氣，被父母責罵沒良心；待父母不好，偶爾回家的就最受寵。」\n網民勸照顧者：對得起自己、不留遺憾\n網民於是提醒：「做父母的，請有智慧一點，別糟蹋了守在你身邊照顧你的真兒女，只偏心寵溺回家像沾醬油的兒女！」\n有人則勸慰「願意孝順父母，是來報恩的，會有福報。」也有人直言手足雖然自私無情，但「如果連那位最容易心軟、照顧父母最多的孩子都計較起來，那吃苦的不就是父母嗎？每當我這麼想的時候心裏就會釋懷。」\n網民落力勸勉照顧者，指唯有自勉，認為「長輩與兒女之間的互動是一種緣，如果你經濟好，不要在乎兄弟分擔多少，那種付出會是意想不到的快樂。經濟問題解決了，你關心父母的程度就看你時間的多寡，那是真心的付出，沒有壓力的付出。」\n網民亦留言打氣，只要「對得起自己，以後不要有遺憾就好。」也有人分享自己的日常掙扎，指很多人勸他也可以一起擺爛，但「問題是若連我也擺爛，那媽媽該如何呢！算了，人在做天在看，做自己應該做的，抱怨也改變不了事實。」\n資料來源：miaoyuntu＠Threads\n相關閱讀：\n單身孝順女獨力照顧病重父母 已婚兄姐卸膊仲講風涼話 網民教路反擊自私鬼\n仔女全移民！師傅幫獨居長者改廁所防跌 臨走婆婆一句心底話揭移民潮最殘酷現實\n最強孝道！老父最後心願「死也不入老人院」 孝順家庭總動員「人肉Support」 港男無悔告白惹哭網民\n養兒防老防了個寂寞 無人送最後一程有幾恐怖？ 血淚個案：四個仔女得一個送終 網民教兩代相處最現實一招","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb020beef7d","title":"馬場浮世繪｜單日六捷累積250W！英冠軍騎師劉見龍勢破79年歷史紀錄","url":"https://www.stheadline.com/realtime-racing/3639674/馬場浮世繪單日六捷累積250W英冠軍騎師劉見龍勢破79年歷史紀錄","summary":"英國年輕好手劉見龍上月正式封王，成為今年英國平地賽冠軍騎師，之後繼續在英國策騎。","summary_short":"英國年輕好手劉見龍上月正式封王，成為今年英國平地賽冠軍騎師，之後繼續在英國策騎。","digest":"英國年輕好手劉見龍上月正式封王，成為今年英國平地賽冠軍騎師，之後繼續在英國策騎","points":["英國年輕好手劉見龍上月正式封王，成為今年英國平地賽冠軍騎師，之後繼續在英國策騎","前日劉見龍在溫伐咸頓馬場贏出六場頭馬，令今年頭馬達至二百五十場…","今年尚有個多月才結束，所以劉見龍大有機會打破紀錄"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T20:09:32+08:00","size":1,"keywords":[],"body":"英國年輕好手劉見龍上月正式封王，成為今年英國平地賽冠軍騎師，之後繼續在英國策騎。 前日劉見龍在溫伐咸頓馬場贏出六場頭馬，令今年頭馬達至二百五十場，距離一九四七年李察斯爵士創下的騎師一年內頭馬二百六十九場紀錄，只相差十九場。今年尚有個多月才結束，所以劉見龍大有機會打破紀錄。 文傑","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd
