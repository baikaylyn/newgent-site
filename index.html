","sources":["中新網 環球"],"url":"https://www.chinanews.com.cn/gj/2026/11-19/10734439.shtml"},{"point":"美国众议院民主党党团18日提名现任众议院民主党领袖哈基姆·杰弗里斯为下届众议院议长…","sources":["中新網 環球"],"url":"https://www.chinanews.com.cn/gj/2026/11-19/10734434.shtml"},{"point":"美国众议院民主党人当地时间18日提名现任众议院民主党领袖哈基姆·杰弗里斯(Hakee…","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gj/2026/11-19/10734443.shtml"}]}},{"id":"c641af949bb","title":"夜蛾如何辨识方向？国际最新研究发现利用地磁和星光两种罗盘导航","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734729.shtml","summary":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称，布冈夜蛾(Bogong moths)利用一种地磁罗盘帮助它们进行季节性的迁徙…","summary_short":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称…","digest":"国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称…","points":["中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表…","夏季，高山洞穴中休眠的布冈夜蛾，洞穴岩壁上每平方米约有1.7万只蛾…","春季，数十亿夜蛾从澳大利亚东南部各地出发，前往此前从未去过的1000公里外的澳大利亚阿尔卑斯…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:39+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电(记者 孙自法)国际学术期刊《自然》北京时间11月19日凌晨在线发表一篇动物学论文称，布冈夜蛾(Bogong moths)利用一种地磁罗盘帮助它们进行季节性的迁徙，连同此前研究证明这些蛾子还会利用星光导航，表明此类昆虫使用地磁和星光两种内在罗盘来寻找方向。\n\n夏季，高山洞穴中休眠的布冈夜蛾，洞穴岩壁上每平方米约有1.7万只蛾，每个洞穴内有数百万只(图片来自Eric　Warrant)。施普林格·自然 供图\n\n　　论文作者认为，布冈夜蛾的磁感应能力与一些夜间迁徙的鸣禽相似，其表明相距甚远的物种可能会独立演化出类似能力。\n\n　　据论文介绍，澳大利亚的布冈夜蛾在仅一年的生命周期中有两次大规模迁徙。春季，数十亿夜蛾从澳大利亚东南部各地出发，前往此前从未去过的1000公里外的澳大利亚阿尔卑斯山，随后在秋季返回。\n\n布冈夜蛾(图片来自澳大利亚麦考瑞大学Ajay　Narendra)。施普林格·自然 供图\n\n　　此前研究表明，这些夜蛾利用星空作为指南针导航前往目的地，但星空被云层遮蔽时它们仍能正确前进。基于此，有观点提出，这是因为夜蛾能够感知和利用地球磁场，但具体机制尚未得到证实。\n\n　　在本项研究中，瑞典隆德大学、德国奥尔登堡大学的研究团队合作，捕捉了迁徙中的夜蛾，将其转移至一个封闭环境，其中布置了随机的星空(缺乏方向性线索)和一个局部磁场(可调整改变磁北极位置)。\n\n布冈夜蛾休眠洞穴附近的高山景观(图片来自Eric　Warrant)。施普林格·自然 供图\n\n　　研究显示，在没有典型夜空的情况下，蛾子能仅靠磁场继续朝向正确方向迁徙；当磁场角度调整时，它们会改变飞行方向，但磁极性(磁场南北极的方向)改变时，它们不受影响；施加微弱射频噪声和去除蓝紫光(这些因素已知会扰乱其他磁感知动物的迁徙)，都会导致夜蛾无法确定方向。\n\n　　论文作者总结表示，本项研究结果指向夜蛾的内在磁罗盘采用了基于自由基对的机制，这与夜间迁徙鸣禽中观察到的机制相似。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c279d652d49","title":"菲律宾多地高温指数达危险级别 局地达44摄氏度","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734718.shtml","summary":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数，局地高温指数达到44摄氏度。","summary_short":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数…","digest":"菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数…","points":["中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示…","据该机构消息，马斯巴特市、东萨马省博龙岸市和三宝颜市当天高温指数均达到44摄氏度","巴拉望省公主港市和库约镇达到43摄氏度"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:05+08:00","size":1,"keywords":[],"body":"中新社马尼拉11月19日电(记者 周璟)菲律宾大气地球物理天文局表示，菲律宾13个地区18日出现危险级别高温指数，局地高温指数达到44摄氏度。\n\n　　据该机构消息，马斯巴特市、东萨马省博龙岸市和三宝颜市当天高温指数均达到44摄氏度。巴拉望省公主港市和库约镇达到43摄氏度。另有8个地区高温指数达到42摄氏度。\n\n　　受高温天气影响，菲律宾多地19日暂停线下教学或缩短课时，以降低高温对师生健康的影响。\n\n　　菲律宾大气地球物理天文局此前预报，19日，米马罗巴地区、米沙鄢群岛和棉兰老岛的5个监测地点高温指数预计达到42至51摄氏度，处于危险级别。\r\n\n　　高温指数是结合实际气温和相对湿度计算得出的人体体感温度。菲律宾气象部门将高温指数分为四个等级：警戒级(27至32摄氏度)、高度警戒级(33至41摄氏度)、危险级(42至51摄氏度)和极端危险级(52摄氏度及以上)。\n\n　　菲律宾气象部门警告，持续暴露于危险级别高温环境可能导致热痉挛和热衰竭，长时间暴露甚至可能引发中暑。该机构提醒公众及时补充水分，尽量避免在10时至16时外出，外出时做好防晒措施。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c26b45b62ec","title":"涉嫌参与海地总统遇刺案 美国牧师或面临终身监禁","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734676.shtml","summary":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel Sanon)因涉嫌刺杀海地总统若弗内尔·莫伊兹(Jovenel Moise)…","summary_short":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel San…","digest":"涉嫌参与海地总统遇刺案 美国牧师或面临终身监禁","points":["中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christia…","综合路透社、美国《迈阿密先驱报》等媒体报道，萨农现年68岁，拥有美国和海地双重国籍","萨农被裁定所有指控全部成立，其中包括共谋杀害海地总统莫伊兹"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:43:09+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 当地时间18日，牧师克里斯蒂安·埃马纽埃尔·萨农(Christian Emmanuel Sanon)因涉嫌刺杀海地总统若弗内尔·莫伊兹(Jovenel Moise)，被迈阿密法官裁定有罪，可能面临终身监禁。\n\n　　综合路透社、美国《迈阿密先驱报》等媒体报道，萨农现年68岁，拥有美国和海地双重国籍。萨农被裁定所有指控全部成立，其中包括共谋杀害海地总统莫伊兹。迈阿密一家联邦法院定于2027年2月10日对其宣判量刑，萨农最高可能被判处终身监禁。\n\n　　庭审期间，萨农始终坚称自己无罪。判决公布后，其律师表示对判决结果感到失望，并称将适时提起上诉。\n\n　　2021年7月7日，海地总统莫伊兹在太子港私邸遭暗杀身亡。事发数日后，萨农在太子港被捕。警方搜查其住所时，发现8块车牌、19本护照、12部手机、30箱弹药及12个手枪枪套。\r\n\n　　莫伊兹遇刺身亡后，海地持续动荡。受政治危机、帮派暴力等因素影响，该国选举多次推迟，长期未能产生民选总统。2024年4月，海地过渡总统委员会成立，在民选总统就职前的过渡期内暂行特定总统权力。\n\n　　目前，海地总统选举首轮投票暂定于2027年7月举行，莫伊兹的遗孀玛蒂娜·莫伊兹已登记为海地总统选举候选人。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1f12d0929e","title":"沙特王储与美军中央司令部司令会谈 沙特与也门胡塞武装持续相互打击","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734656.shtml","summary":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀率领的代表团。","summary_short":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀…","digest":"综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布…","points":["中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美…","沙特和也门胡塞武装当天持续互相打击","据沙特通讯社报道，穆罕默德与库珀在会谈期间回顾双边关系，尤其是军事领域合作…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:42:35+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 综合消息：沙特阿拉伯王储兼首相穆罕默德19日在沙特首都利雅得会见美军中央司令部司令布拉德·库珀率领的代表团。沙特和也门胡塞武装当天持续互相打击。\n\n　　据沙特通讯社报道，穆罕默德与库珀在会谈期间回顾双边关系，尤其是军事领域合作，讨论地区局势发展，以及促进地区安全、稳定与和平的努力。\n\n　　报道称，沙特国家安全顾问艾班、沙特武装部队总参谋长兼沙特主导的多国联军代理指挥官鲁韦利参加会谈。\n\n　　另据以色列《耶路撒冷邮报》、卡塔尔半岛电视台报道，库珀率团赴沙特会谈前，在以色列特拉维夫与以高级军事和情报官员举行会谈。以色列国防军通报称，双方讨论的重点是为应对区域安全挑战，加强军事准备和协调行动。\r\n\n　　路透社报道称，知情人士表示，本轮沙特与也门胡塞武装的冲突升级以来，沙特曾于9月向美国总统特朗普寻求军事援助，以打击胡塞武装。特朗普不同意美方直接参与打击胡塞武装，但表示将提供情报共享等援助。\n\n　　沙特民防部门19日在几小时内连续发出5次紧急情况警报，要求民众遵循安全指示，避免前往人群聚集地点。当天晚些时候，警报解除。\n\n　　沙特阿拉伯主导的多国联军发言人马利基19日在社交媒体上发布多条信息称，联军当天先后拦截并摧毁胡塞武装射向沙特南部地区的6枚导弹，并应对一起其针对沙特首都利雅得的导弹威胁。导弹碎片坠落造成财产损失，损失程度仍在评估中。\n\n　　也门胡塞武装通报称，多国联军19日对也门首都萨那的纺织厂、皮革厂，以及西南部塔伊兹省的医疗机构等民用目标发动数轮空袭。(完) 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c36dee1b62a","title":"“游历于色彩与线条之间”特别企画展在东京中国文化中心举办","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734653.shtml","summary":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心举办。","summary_short":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化…","digest":"“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心…","points":["中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别…","本次展览由东京中国文化中心策展并主办","展览汇集姜淼、吴霜、鲍蓓等中国当代一流新锐艺术家的作品，以抽象绘画为切入点，围绕色彩…"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:41:45+08:00","size":1,"keywords":[],"body":"中新网东京11月19日电(记者 朱晨曦)“游历于色彩与线条之间——中国现代艺术的新印象”特别企画展于16日在东京中国文化中心举办。\n\n　　本次展览由东京中国文化中心策展并主办。展览汇集姜淼、吴霜、鲍蓓等中国当代一流新锐艺术家的作品，以抽象绘画为切入点，围绕色彩、线条与材料展开，呈现艺术家对绘画形式和视觉语言的多样探索。展览展期至12月25日。\n\n展览现场。中新网记者 朱晨曦 摄\n\n　　据介绍，本次展出作品虽各具面貌，却共同关注色彩、线条与材料之间的关系。作品通过色彩的交织与对照、线条的穿插与延伸，以及材料肌理的叠加和变化，共同构成画面的视觉层次。同时，线条与色块既参与画面结构的组织，也形成不同的视觉节奏。此外，材料经过覆盖、叠加、刮刻等处理，留下丰富的表面痕迹，使作品呈现出各具特点的质感。\n\n　　主办方表示，抽象艺术为艺术家提供了不同于具象描绘的表达方式，也使色彩、线条和材料本身成为画面表达的重要组成部分。艺术家并不拘泥于对具体形象的描绘，而是通过形式与材料的组合，拓展画面的表达空间。\n\n展览现场。中新网记者 朱晨曦 摄\n\n　　作为功能及定位适配化改造的重要一环，东京中国文化中心希望通过本次展览，用小而美的表达方式向日本文艺界和艺术爱好者展现鲜活的中国当代抽象艺术面貌，吸引更多日本民众了解当代中国文化、感知当代中国发展。(完)\n\n 【编辑:冯小妍】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ce10a8e0351","title":"印度一学校62名学生疑因附近沥青厂污染出现恶心和呼吸困难症状","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734747.shtml","summary":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心、呼吸困难等症状并入院，相关症状据称与学校附近一处沥青搅拌厂造成的污染有关。","summary_short":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心…","digest":"据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心…","points":["中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生…","警方表示，目前所有学生情况稳定，暂无严重健康问题","警方还表示，该工厂此前因当地居民投诉污染问题曾被关闭，后在高等法院解除停业限制后重新运营…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T17:11:33+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据印度报业托拉斯报道，印度喀拉拉邦奎隆县一所私立学校18日有62名学生因出现恶心、呼吸困难等症状并入院，相关症状据称与学校附近一处沥青搅拌厂造成的污染有关。\n\n　　警方表示，目前所有学生情况稳定，暂无严重健康问题。\n\n　　警方还表示，该工厂此前因当地居民投诉污染问题曾被关闭，后在高等法院解除停业限制后重新运营，此次事件发生后再次被关闭。\n\n　　事件发生后，警方和当地有关部门已介入处理。\r\n\n 【编辑:孔庆玲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c298a9635bb","title":"强气旋风暴逼近 印度东部沿海逾4.6万人转移避险","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734736.shtml","summary":"中新网11月19日电 据《印度斯坦时报》19日报道，印度当地官员表示，强气旋风暴“阿克万”逼近印度东部沿海，预计将于20日在安得拉邦纳尔萨普尔至奥迪沙邦普里之间沿海地区登陆。","summary_short":"中新网11月19日电 据《印度斯坦时报》19日报道，印度当地官员表示，强气旋风暴“阿克万”逼近印度东部沿海…","digest":"据《印度斯坦时报》19日报道，印度当地官员表示，强气旋风暴“阿克万”逼近印度东部沿海…","points":["中新网11月19日电 据《印度斯坦时报》19日报道，印度当地官员表示…","奥迪沙邦已有超过4.6万人转移至安全地点","当地政府已对11个地区发布红色预警"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T16:56:51+08:00","size":1,"keywords":[],"body":"中新网11月19日电 据《印度斯坦时报》19日报道，印度当地官员表示，强气旋风暴“阿克万”逼近印度东部沿海，预计将于20日在安得拉邦纳尔萨普尔至奥迪沙邦普里之间沿海地区登陆。奥迪沙邦已有超过4.6万人转移至安全地点。当地政府已对11个地区发布红色预警。\r\n\n　　当地官员还表示，目前，奥迪沙邦已有448处避难所投入使用，另有约3000处正准备启用。当地政府优先转移孕妇、老年人和儿童，并要求山区居民前往安全地点，以防发生山体滑坡。\n\n　　印度气象局局长姆鲁琼贾伊·莫哈帕特拉指出，奥迪沙邦南部、北部及沿海地区预计20日至21日将出现大到特大暴雨，局部地区可能出现极端强降雨。 【编辑:孔庆玲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c963fd1a491","title":"第一视角带看APEC！深圳不止速度与算法 快与慢之间 藏着中国智慧","url":"https://www.chinanews.com/gj/shipin/2026/11-19/news1075464.shtml","summary":"如果说深圳的快是速度，慢则是深度。","summary_short":"如果说深圳的快是速度，慢则是深度。","digest":"如果说深圳的快是速度，慢则是深度","points":["如果说深圳的快是速度，慢则是深度","在深圳图书馆北馆，看一本书的奇妙旅行，感受深圳这座“阅读之城”的科技魔法","在深圳美术馆，近距离领略岭南生物的多样性，感叹被呵护着的自然生态之美"],"section":"國際","category":"國際","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T15:58:58+08:00","size":1,"keywords":[],"body":"如果说深圳的快是速度，慢则是深度。\n\n在深圳图书馆北馆，看一本书的奇妙旅行，感受深圳这座“阅读之城”的科技魔法；在深圳美术馆，近距离领略岭南生物的多样性，感叹被呵护着的自然生态之美。\n\n深圳不只有速度与算法，这里的“快与慢”是这座APEC之城的A面与B面，也是“走得快”也要“走更远”的中式智慧。(唐雨弦 赵丽）","image":"","video":"https://v-oss.cnsimg.net/cspimp/2026/11/19/a7026dd2-e9c1-4b31-a1ed-12cd11cf7792.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c2cf14cc0eb","title":"乌克兰称袭击俄罗斯两座炼油厂","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734629.shtml","summary":"中新社北京11月19日电 基辅消息：乌克兰总参谋部18日表示，乌军于17日至18日袭击了俄罗斯西南部克拉斯诺达尔边疆区的两座炼油厂。","summary_short":"中新社北京11月19日电 基辅消息：乌克兰总参谋部18日表示，乌军于17日至18日袭击了俄罗斯西南部克拉斯诺达尔边疆区的…","digest":"基辅消息：乌克兰总参谋部18日表示…","points":["中新社北京11月19日电 基辅消息：乌克兰总参谋部18日表示…","综合《基辅独立报》、乌通社等媒体报道，乌克兰总参谋部称…","乌克兰总参谋部说，两座炼油厂的年石油加工能力合计约为1300万吨"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:28:00+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 基辅消息：乌克兰总参谋部18日表示，乌军于17日至18日袭击了俄罗斯西南部克拉斯诺达尔边疆区的两座炼油厂。\n\n　　综合《基辅独立报》、乌通社等媒体报道，乌克兰总参谋部称，袭击击中了伊利斯基炼油厂的储油罐及阿菲普斯基炼油厂的石油加工装置，但未说明袭击方式。\n\n　　乌克兰总参谋部说，两座炼油厂的年石油加工能力合计约为1300万吨。\n\n　　另据俄罗斯《生意人报》18日报道，克拉斯诺达尔边疆区应急指挥部当天表示，该边疆区遭无人机袭击，造成9人受伤。\r\n\n　　伊利斯基炼油厂和阿菲普斯基炼油厂均位于俄罗斯克拉斯诺达尔边疆区，此前曾多次遭乌克兰无人机袭击。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ca8005c0e3f","title":"韩国高考开考 多项措施严防考试作弊","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734614.shtml","summary":"中新网首尔11月19日电(记者 金旭)韩国第2027学年度大学修学能力考试(以下简称“韩国高考”)当地时间19日开考，55万多名考生在全国1312个考场参加考试。","summary_short":"中新网首尔11月19日电(记者 金旭)韩国第2027学年度大学修学能力考试(以下简称“韩国高考”)当地时间19日开考…","digest":"韩国第2027学年度大学修学能力考试(以下简称“韩国高考”)当地时间19日开考…","points":["中新网首尔11月19日电(记者 金旭)韩国第2027学年度大学修学能力考试(以下简称“韩国高…","此前，韩国政府出台一系列防作弊追加措施，在现有约7.5万名监考人员的基础上…","其中部分人员专门负责检查AI眼镜等智能设备"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:27:10+08:00","size":1,"keywords":[],"body":"中新网首尔11月19日电(记者 金旭)韩国第2027学年度大学修学能力考试(以下简称“韩国高考”)当地时间19日开考，55万多名考生在全国1312个考场参加考试。\n\n　　此前，韩国政府出台一系列防作弊追加措施，在现有约7.5万名监考人员的基础上，增派约8400人维护考场秩序。其中部分人员专门负责检查AI眼镜等智能设备。考生不得携带任何智能设备进入考场，所有考生衣服纽扣必须用贴纸密封，以防藏有摄像头。考场内及附近区域的无线网络也被关闭。\n\n　　据韩联社报道，韩国政府在考试前发送无法拒收的紧急灾难警报短信，以排查未按规定上交手机的学生。8时30分发送紧急灾难警报短信后，已查获22部未上交的智能手机，尚未发现考生使用其他高科技设备作弊的情况。截至记者发稿时，14时21分、14时57分分别发送第二轮、第三轮紧急灾难警报短信。\n\n　　今年韩国高考于8时40分至17时45分进行，按照韩国国语、数学、英语等五个科目依次进行。所有考生须在8时10分之前进入考场，今年参考人数共有55.1864万人，同比减少0.4%。(完)\r\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c60461cc30d","title":"澳大利亚10月失业率升至4.9%","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734599.shtml","summary":"中新社悉尼11月19日电(记者 薄雯雯)澳大利亚统计局19日公布的数据显示，经季节性因素调整，该国10月失业率从9月的4.7%升至4.9%，为2021年10月以来最高水平。","summary_short":"中新社悉尼11月19日电(记者 薄雯雯)澳大利亚统计局19日公布的数据显示，经季节性因素调整…","digest":"澳大利亚统计局19日公布的数据显示，经季节性因素调整…","points":["中新社悉尼11月19日电(记者 薄雯雯)澳大利亚统计局19日公布的数据显示…","数据显示，澳大利亚10月就业人数环比减少约4.35万人","其中，全职就业人数减少约2900人，兼职就业人数减少约4.06万人…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:19:43+08:00","size":1,"keywords":[],"body":"中新社悉尼11月19日电(记者 薄雯雯)澳大利亚统计局19日公布的数据显示，经季节性因素调整，该国10月失业率从9月的4.7%升至4.9%，为2021年10月以来最高水平。\n\n　　数据显示，澳大利亚10月就业人数环比减少约4.35万人。其中，全职就业人数减少约2900人，兼职就业人数减少约4.06万人，兼职岗位减少是当月就业人数下降的主要原因。同期，失业人数增加约1.78万人，劳动参与率环比下降0.2个百分点至66.6%。\n\n　　澳大利亚统计局劳工统计部门负责人肖恩·克里克表示，10月澳15岁至24岁人口的失业率从9月的11.1%升至11.3%，达到2021年10月以来最高水平。\n\n　　澳大利亚国库部长查默斯当天表示，数据反映出澳民众当前面临的“切实而严峻的压力”。在利率上升及全球性挑战持续的背景下，失业率走高并不意外，但仍令人担忧。政府将继续帮助民众应对生活成本压力、支持就业并抑制通胀。\r\n\n　　澳大利亚广播公司(ABC)报道称，澳大利亚储备银行(央行)此前预测失业率将在未来两年继续上升，到2028年底达到5.1%。10月数据表明，失业率上升速度快于央行预期。\n\n　　澳央行本月初进行了今年第五次加息。ABC援引分析人士观点称，最新数据降低了央行12月再次加息的可能性，但通胀和工资增长压力仍在，央行或将维持利率不变，继续观察经济数据。(完) 【编辑:惠小东】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3d5c9ffc34","title":"洪都拉斯发生袭击事件造成至少12人死亡","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734574.shtml","summary":"中新社北京11月19日电 特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Edgardo Barahona)18日表示，该国中北部约罗省约里托市当天凌晨发生4起袭击事件…","summary_short":"中新社北京11月19日电 特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Edgardo Barahona…","digest":"特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Edgardo Bar…","points":["中新社北京11月19日电 特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Ed…","综合《洪都拉斯日报》等媒体报道，3起袭击事件发生在巴列西略斯的一处足球场和两处民宅…","另一起袭击发生在帕卡亚雷斯社区，造成3人死亡，其中包括一名市议员"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:19:09+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 特古西加尔巴消息：洪都拉斯国家警察局发言人埃德加多·巴拉奥纳(Edgardo Barahona)18日表示，该国中北部约罗省约里托市当天凌晨发生4起袭击事件，共造成至少12人死亡，其中包括一名地方市议员。\r\n\n　　综合《洪都拉斯日报》等媒体报道，3起袭击事件发生在巴列西略斯的一处足球场和两处民宅，每起袭击均造成3人死亡。另一起袭击发生在帕卡亚雷斯社区，造成3人死亡，其中包括一名市议员。\n\n　　巴拉奥纳说，警方初步调查认为，上述袭击是犯罪团伙实施的报复行动。\n\n　　目前，洪都拉斯刑事调查局正与检察机关协调，对4处案发现场进行勘查和取证。\n\n　　洪都拉斯政府已召开紧急会议，协调相关部门采取应对措施，并决定加强受影响地区的警力和军事部署。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c810e8a3975","title":"马斯克盛赞深圳：“我是中国的粉丝，总是鼓励人们来中国走走看看”","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734638.shtml","summary":"中新网11月19日电 综合报道，2026年APEC会议期间，美国企业家马斯克随美方团队到访中国深圳。","summary_short":"中新网11月19日电 综合报道，2026年APEC会议期间，美国企业家马斯克随美方团队到访中国深圳。","digest":"综合报道，2026年APEC会议期间，美国企业家马斯克随美方团队到访中国深圳","points":["中新网11月19日电 综合报道，2026年APEC会议期间…","马斯克远程连线参加了在美国得克萨斯州奥斯汀举行的一场会议活动(TomorrowX Summi…","说实话，中国真是一个令人印象深刻的国家"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T15:14:33+08:00","size":1,"keywords":[],"body":"中新网11月19日电 综合报道，2026年APEC会议期间，美国企业家马斯克随美方团队到访中国深圳。马斯克远程连线参加了在美国得克萨斯州奥斯汀举行的一场会议活动(TomorrowX Summit)，并谈到了自己的访华经历。马斯克表示，“我是中国的粉丝，我总是鼓励人们来中国走走，亲眼看看。”\n\n图片来源：TomorrowX Summit社交媒体截图\n\n　　马斯克通过视频连线告诉与会者，他现在正在中国深圳。他表示，“每次来中国，我都觉得太震撼了。说实话，中国真是一个令人印象深刻的国家。我现在在深圳，这是一座非常巨大的城市，有很多很酷的建筑，我觉得这里是中国最大的科技中心。”\n\n　　“每次来到这里，我都会被中国的规模和宏伟壮丽所震撼。我是中国的粉丝，我总是鼓励人们来中国走走，亲眼看看。这是一个令人印象深刻的国家。”马斯克说。\n\n　　马斯克提到，他来华的原因之一，还包括想参观特斯拉上海工厂，并感谢团队多年来所付出的努力。\n\n　　马斯克最后说道，美国总统特朗普也正在中国访问，讨论贸易关系。马斯克说，他希望双方能取得进展，并指出，推动经贸关系向好发展，对全世界都是有益的。\n\n　　据此前报道，11月18日，特朗普车队抵达深圳东海朗廷酒店，马斯克现身随行大巴车。\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf19e0c453b","title":"委内瑞拉同美国签署协议恢复军事技术合作","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734563.shtml","summary":"中新社北京11月19日电 加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国国防部长赫格塞思签署协议，以恢复两国军事技术合作。","summary_short":"中新社北京11月19日电 加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国国防部长赫格塞思签署协议…","digest":"加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国国防部长赫格塞思签…","points":["中新社北京11月19日电 加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国…","委内瑞拉国防部18日发表声明称，委美两国决定，在相互尊重、互惠等基础上…","根据声明，此次合作旨在恢复同训练、技术交流、技术升级等相关的举措…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T12:48:07+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 加拉加斯消息：委内瑞拉国防部长洛佩斯当地时间18日同到访该国的美国国防部长赫格塞思签署协议，以恢复两国军事技术合作。\n\n　　委内瑞拉国防部18日发表声明称，委美两国决定，在相互尊重、互惠等基础上，推动军事技术合作恢复到之前水平。\n\n　　根据声明，此次合作旨在恢复同训练、技术交流、技术升级等相关的举措，并为“应对共同威胁”作出贡献。声明指出，合作将严格遵守委内瑞拉宪法及该国现行法律体系，充分尊重委内瑞拉主权、独立与领土完整。\n\n　　据路透社消息，赫格塞思称，该协议涵盖联合训练、情报共享以及美委军事合作的其他方面。他还表示，双方合作预示着将大幅加强针对贩毒团伙的联合行动。\r\n\n　　美联社称，赫格塞思未对协议内容作更多说明。\n\n　　据委内瑞拉《最新消息报》报道，委内瑞拉代总统德尔西·罗德里格斯18日在位于该国首都加拉加斯的总统府会见赫格塞思，并在会晤结束后强调恢复两国军事技术合作的重要性。罗德里格斯认为，双边合作应当确保委内瑞拉与西半球和平。\n\n　　由于美国持续干涉委内瑞拉内政，委内瑞拉于2019年与美国断绝外交关系。今年1月3日，美军对委内瑞拉发动大规模军事打击，强行控制委总统马杜罗及其妻子并将他们带到美国。3月，委美两国政府同意恢复外交和领事关系。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9cb2f30ee9","title":"深耕中国、看好深圳：美国工商界人士期待借APEC深化中美经贸合作","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734557.shtml","summary":"中新网深圳11月19日电（张东方 戴悦 宫宏宇）2026年APEC领导人会议周期间，多位美国工商界人士接受记者采访时表示，APEC是推动区域贸易便利化、加强政策沟通协调的重要平台，期待依托这一机制…","summary_short":"中新网深圳11月19日电（张东方 戴悦 宫宏宇）2026年APEC领导人会议周期间…","digest":"2026年APEC领导人会议周期间，多位美国工商界人士接受记者采访时表示…","points":["中新网深圳11月19日电（张东方 戴悦 宫宏宇）2026年APEC领导人会议周期间…","视频：美中贸委会会长谭森现场用中文说“厚积薄发” 诠释APEC务实推进之道来源：中国新闻网","APEC推动贸易便利化，为企业带来切实机遇"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T11:49:34+08:00","size":1,"keywords":[],"body":"中新网深圳11月19日电（张东方 戴悦 宫宏宇）2026年APEC领导人会议周期间，多位美国工商界人士接受记者采访时表示，APEC是推动区域贸易便利化、加强政策沟通协调的重要平台，期待依托这一机制，在数字支付、无纸化贸易等多领域深化合作。\n\n视频：美中贸委会会长谭森现场用中文说“厚积薄发” 诠释APEC务实推进之道来源：中国新闻网\n\n　　APEC推动贸易便利化，为企业带来切实机遇\n\n　　成立37年来，APEC始终致力于推动贸易投资自由化便利化，促进区域经济增长与共同繁荣。\n\n　　在美国工商界人士看来，APEC的价值不仅在于凝聚共识，更体现在持续改善贸易环境、降低跨境经营成本，为企业创造更加便利的条件。\n\n　　中国美国商会会长何迈可表示，企业家和各经济体代表依托APEC平台相聚交流，本身就具有重要意义。对美国企业而言，APEC的重要价值在于帮助他们了解中国市场的长期前景，把握潜在机遇。\n\n　　他指出，深圳的发展展现了中国经济转型与创新的速度。作为众多中国企业总部所在地，深圳创新活力充沛，也为美国企业近距离了解中国市场和产业发展提供了窗口。\n\n　　“我们不少企业都已经在深圳以及大湾区布局业务。”何迈可说，“对美国企业而言，清晰、明确的规则至关重要，无论是企业母国的相关规则，还是中国的政策法规，都有助于企业准确判断经营环境。”\n\n　　在美中贸易全国委员会会长谭森看来，APEC这一多边机制不仅关乎中美，更关乎整个亚太地区。谭森说，APEC设立的意义在于让产品跨境流转变得更加顺畅。\n\n　　“这件事听起来并不新潮，不算高科技，也没有亮眼的噱头，但APEC实实在在的价值，就是帮助货物跨境运输更高效、更快速。”谭森说。\n\n　　他以机器人等高科技产品为例指出，一件产品的零部件可能在中国、马来西亚、越南、新加坡和美国等地之间多次流转，最终再回到中国。“供应链越复杂，APEC的作用就越关键。”\n\n　　谭森表示，APEC的成效不会一蹴而就，而是通过每年推动许多非常微小的渐进性变化和建议，持续降低贸易和商业活动中的障碍，让跨境交易更加便捷。\n\n　　“没有哪一家企业比深圳的公司，更能感受到APEC机制带来的便利。它让贸易变得更加顺畅高效，不仅惠及深圳企业，也惠及APEC各经济体以及全球各地的消费者。”谭森说。\n\n视频：深圳APEC丨美中贸易全国委员会会长谭森：APEC惠及全世界消费者来源：三里河\n\n　　期待深化务实合作，共促亚太繁荣\n\n　　受访美国工商界人士认为，作为全球和亚太地区重要经济体，中美加强协作，不仅有利于双边经贸关系发展，也将为区域合作与共同繁荣创造更多机遇。\n\n　　谭森表示，中美两大经济体携手努力，APEC才能更好地实现其愿景。在他看来，数字支付和无纸化贸易是双方有望取得进展的合作方向。中美可与其他APEC经济体一道，推动无纸化贸易和跨境电子支付建设。\n\n　　在何迈可看来，可持续发展目标、供应链和经济韧性是中美工商界可优先推进的合作方向。他认为，中国市场及其持续推进的创新，为两国企业深化合作提供了良好契机。\n\n　　农业领域同样是中美经贸合作的重要领域。美国大豆出口协会（USSEC）东亚区执行总监撒加罗表示，美国仍高度重视中国市场，美国农民希望继续向中国销售大豆。\n\n　　撒加罗介绍，不仅是APEC，在中国国际进口博览会期间，由美国大豆出口协会等多家农产品行业协会组成的“美国农产品贸易高级访华团”访华。“我希望继续发挥协会的桥梁作用，推动美国农业与中国市场对接，巩固双方信任，进一步拓展合作。”\n\n　　进入中国市场40多年来，惠普也持续从中国的发展中寻找合作机遇。惠普公司首席公共政策官布里塔妮·马萨洛萨洛（Brittany Masalosalo）表示，中国不仅是惠普全球制造业供应链的重要组成部分，也在研发创新领域发挥着重要作用。中国高校人才储备丰富，本土企业创新活跃，为跨国企业开展合作提供了广阔空间。（完）\n\n 【编辑:李岩】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c39a77ad181","title":"日本多个民间团体要求政府坚持“无核三原则”","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734532.shtml","summary":"新华社东京11月18日电(记者李子越 杨智翔)日本多个民间团体18日共同向日本外务省提交诉求书，要求政府坚持“无核三原则”。","summary_short":"新华社东京11月18日电(记者李子越 杨智翔)日本多个民间团体18日共同向日本外务省提交诉求书…","digest":"日本多个民间团体18日共同向日本外务省提交诉求书，要求政府坚持“无核三原则”","points":["新华社东京11月18日电(记者李子越 杨智翔)日本多个民间团体18日共同向日本外务省提交诉求…","“无核三原则”指“不拥有、不制造、不运进核武器”","针对这一动向，日本民间团体在18日提交的诉求书中指出…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T10:52:19+08:00","size":1,"keywords":[],"body":"新华社东京11月18日电(记者李子越 杨智翔)日本多个民间团体18日共同向日本外务省提交诉求书，要求政府坚持“无核三原则”。\n\n　　“无核三原则”指“不拥有、不制造、不运进核武器”。现行“安保三文件”中的日本《国家安全保障战略》明确表示，坚持“无核三原则”的基本方针“今后不会改变”。但据日本媒体近期报道，日本政府正考虑在计划于年底修订的《国家安全保障战略》中写入“无核三原则”例外情况，或允许在紧急情况下将核武器运进日本。\n\n　　针对这一动向，日本民间团体在18日提交的诉求书中指出，“无核三原则”是日本长期奉行的国家方针，具有极其重要的地位，长期以来对历届政府的政策选择发挥着制约和引导作用。\n\n　　民间团体代表当天还与外务省方面以非公开形式进行意见交换。在之后的记者会上，民间团体代表透露，对于要求明确承诺继续坚持“无核三原则”等诉求，外务省仅表示相关问题仍在研究之中，未作出明确承诺，延续了此前的模糊立场。\r\n\n　　民间团体还指出，日本政府试图以所谓“紧急事态”为由，为核武器运进日本设置例外，这种做法不仅无助于维护日本的和平与安全，反而可能进一步加剧地区紧张局势，带来更大的安全风险。\n\n　　日本政府或调整核政策的动向已引发广泛担忧。据日本广播协会日前报道，从2025年10月高市早苗就任首相至今年10月底，日本参议院已收到全国地方议会提交的近300份意见书，要求坚持、尊重“无核三原则”或推动其法律化，数量相较以前显著增加。(完) 【编辑:曲克】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2b92749267","title":"“晶通丝路”东海水晶文化体验活动在曼谷举行","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734491.shtml","summary":"中新网曼谷11月19日电 (王茜 梁峻祥 李映民)由曼谷中国文化中心、中外文化和旅游交流中心、连云港市东海县政府共同主办的“晶通丝路”东海水晶文化体验活动18日在曼谷中国文化中心开幕。","summary_short":"中新网曼谷11月19日电 (王茜 梁峻祥 李映民)由曼谷中国文化中心、中外文化和旅游交流中心…","digest":"由曼谷中国文化中心、中外文化和旅游交流中心…","points":["中新网曼谷11月19日电 (王茜 梁峻祥 李映民)由曼谷中国文化中心…","中泰文化界、教育界、工商界嘉宾及主流媒体约150人出席","泰国文化部文化促进司副司长苏拉潘·查伦萨普、曼谷中国文化中心兼中国驻曼谷旅游办事处主任张若愚…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T10:11:59+08:00","size":1,"keywords":[],"body":"中新网曼谷11月19日电 (王茜 梁峻祥 李映民)由曼谷中国文化中心、中外文化和旅游交流中心、连云港市东海县政府共同主办的“晶通丝路”东海水晶文化体验活动18日在曼谷中国文化中心开幕。中泰文化界、教育界、工商界嘉宾及主流媒体约150人出席。\n\n开幕式现场。王茜 摄\n\n　　泰国文化部文化促进司副司长苏拉潘·查伦萨普、曼谷中国文化中心兼中国驻曼谷旅游办事处主任张若愚、连云港市东海县副县长任彦洁以及泰国文化中心主任纳塔帕·吉拉蓬邦迪特等嘉宾共同为活动启幕。\n\n　　张若愚主任在致辞中表示，东海水晶雕刻技艺走进曼谷中国文化中心，让泰国朋友近距离感受中华文化的温度，也让中泰朋友在面对面交流中增进了解、加深情谊。苏拉潘副司长表示，东海水晶所展现的东方工艺智慧，与泰国本地的珠宝玉石传统完全可以相互借鉴、彼此成就。任彦洁副县长表示，恰逢东海获授“世界水晶之都”十周年，希望依托曼谷的区位优势与产业优势，推开一扇双向交流的窗口，让泰国朋友近距离感受水晶工艺和人文情怀，读懂藏在晶石里的东方故事。\n\n水晶精品鉴赏。梁峻祥 摄\n\n　　活动为期两天，将水晶精品鉴赏、茶艺展演、水晶雕刻展演与体验、文创互动四大环节串联成可观、可品、可触、可玩的精彩互动。观众在传承人带领下鉴赏水晶原石与雕刻佳作，品味“云茶入晶器”的交融之美，现场观摩立体圆雕、浮雕、镂空雕等东海特色技法并亲手打磨原石，还参与水晶手串DIY，体验水晶与潮玩跨界文创、水晶穿戴甲等时尚新品，感受水晶文化年轻化、生活化、潮流化的多元魅力。\n\n体验活动现场。李映民 摄\n\n　　“晶通丝路”东海水晶文化体验活动以一方晶石、一门手艺、一次体验，为中泰文化交流与水晶产业合作搭建桥梁，为“中泰一家亲”和“一带一路”民心相通增添温润而持久的力量。(完)\n\n 【编辑:惠小东】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cafd9929b83","title":"以军在加沙中部发动地面行动 哈马斯谴责以色列违反停火协议","url":"https://www.chinanews.com.cn/gj/2026/11-19/10734468.shtml","summary":"中新社北京11月19日电 综合消息：以色列军方18日在加沙地带中部“黄线”以西发动军事行动。","summary_short":"中新社北京11月19日电 综合消息：以色列军方18日在加沙地带中部“黄线”以西发动军事行动。","digest":"综合消息：以色列军方18日在加沙地带中部“黄线”以西发动军事行动","points":["中新社北京11月19日电 综合消息：以色列军方18日在加沙地带中部“黄线”以西发动军事行动","巴勒斯坦伊斯兰抵抗运动(哈马斯)同日发表声明，谴责以色列违反停火协议","据《以色列时报》报道，以军18日在加沙地带中部“黄线”以西展开军事行动…"],"section":"國際","category":"國際","source":"chinanews_world","source_display":"中新網 環球","published_at":"2026-11-19T10:11:13+08:00","size":1,"keywords":[],"body":"中新社北京11月19日电 综合消息：以色列军方18日在加沙地带中部“黄线”以西发动军事行动。巴勒斯坦伊斯兰抵抗运动(哈马斯)同日发表声明，谴责以色列违反停火协议。\n\n　　据《以色列时报》报道，以军18日在加沙地带中部“黄线”以西展开军事行动，导致当地巴勒斯坦平民被迫流离失所。\n\n　　以军表示，此次行动旨在摧毁当地一条隧道，并称该隧道对以军部队构成直接威胁。\n\n　　半岛电视台报道说，这是自2025年10月10日停火协议生效以来，以军首次公开宣布在加沙地带发动大规模地面军事行动。根据停火协议，以军应将部队撤至“黄线”以东，这条分界线大致将加沙地带划分为东西两部分。\r\n\n　　此外，以军方18日宣布，两名哈马斯指挥官在前一天加沙地带的两次袭击中丧生。以军方称，这两名武装人员不断袭击以军和以平民，并试图恢复哈马斯的作战能力，其行为“系统性地违反了停火协议”。\n\n　　哈马斯18日发表声明称，以军发动突袭并迫使巴勒斯坦人流离失所，严重违反停火协议，导致局势危险升级。\n\n　　哈马斯指责以色列试图通过军事行动将巴勒斯坦居民进一步挤压至加沙地带一处狭窄区域，并称以色列看守政府意在通过升级军事袭击，转移公众对其国内危机的注意力。\n\n　　哈马斯警告说，如果以方继续采取此类行动，加沙地带200多万巴勒斯坦人面临的人道主义灾难将进一步加剧。(完) 【编辑:甘甜】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2d5d99f67b","title":"美中期選舉︱佩爾托拉阿拉斯加獲勝 參院民主黨奪56席獲16年來最大優勢","url":"https://www.stheadline.com/realtime-world/3638771/美中期選舉佩爾托拉阿拉斯加獲勝-參院民主黨奪56席獲16年來最大優勢","summary":"美國11月3日舉行中期選舉，18日美媒報道，前聯邦眾議員佩爾托拉（Mary Peltola）在阿拉斯加州的聯邦參議員選舉中，擊敗共和黨籍現任參議員沙利文，為民主黨拿下第9個原由共和黨掌握的席位…","summary_short":"美國11月3日舉行中期選舉，18日美媒報道，前聯邦眾議員佩爾托拉（Mary Peltola）在阿拉斯加州的聯邦參議員選舉…","digest":"美國11月3日舉行中期選舉，18日美媒報道…","points":["美國11月3日舉行中期選舉，18日美媒報道，前聯邦眾議員佩爾托拉（Mary Peltola）…","相關新聞：美國中期選舉｜防長赫格塞思成特朗普挫敗「替死鬼」 最快下周被彈劾","佩爾托拉以50.12%得票率勝出，讓這次中期選舉最後一場勝負未定的參議院選戰塵埃落定"],"section":"國際","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T09:11:15+08:00","size":1,"keywords":[],"body":"美國11月3日舉行中期選舉，18日美媒報道，前聯邦眾議員佩爾托拉（Mary Peltola）在阿拉斯加州的聯邦參議員選舉中，擊敗共和黨籍現任參議員沙利文，為民主黨拿下第9個原由共和黨掌握的席位，使民主黨在參議院以56席壓倒共和黨的44席，是16年來該黨在參議院的最大優勢。\n相關新聞：美國中期選舉｜防長赫格塞思成特朗普挫敗「替死鬼」 最快下周被彈劾\n拿第9個原共和黨掌握席位\n佩爾托拉以50.12%得票率勝出，讓這次中期選舉最後一場勝負未定的參議院選戰塵埃落定。由於阿拉斯加州偏遠村落分布廣泛，選民散居各地，點票歷時兩周才完成。佩爾托拉獲得14萬4302票，勝過沙利文（Dan Sullivan）13萬1844票；即使將另一名候選人小蘇利文（Daniel J. Sullivan Jr.）所得的4760票合併計算，仍無法超越佩爾托拉。\n選票上出現兩名叫沙利文的候選人，多次引發總統特朗普不滿，指稱民主黨利用「冒牌候選人」分票。\n佩爾托拉勝選後，民主黨將在明年1月新一屆國會開議時，以56席對44席掌握參議院多數，為民主黨16年來在參議院的最大優勢。民主黨目前在435席的眾議院，暫以257席拋離共和黨的172席。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cef5b629584","title":"特朗普讚菲前第一夫人艾美黛「一直最美麗」 兩人結識逾30年","url":"https://www.stheadline.com/realtime-world/3638770/特朗普讚菲前第一夫人艾美黛一直最美麗-兩人結識逾30年","summary":"美國總統特朗普訪問菲律賓期間，昨日在馬尼拉總統府馬拉坎南宮與一位老友重聚，即總統小馬可斯的母親、前第一夫人艾美黛(Imelda Marcos)。","summary_short":"美國總統特朗普訪問菲律賓期間，昨日在馬尼拉總統府馬拉坎南宮與一位老友重聚，即總統小馬可斯的母親…","digest":"美國總統特朗普訪問菲律賓期間，昨日在馬尼拉總統府馬拉坎南宮與一位老友重聚…","points":["美國總統特朗普訪問菲律賓期間，昨日在馬尼拉總統府馬拉坎南宮與一位老友重聚…","現年97歲的伊美黛以奢華生活風格著稱，是上世紀80年代遭人命力量革命推翻的前總統馬可斯的遺孀","當天穿粉紅色套裝、坐在輪椅上的艾美黛向特朗普說：「歡迎來到菲律賓」"],"section":"國際","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T09:02:46+08:00","size":1,"keywords":[],"body":"美國總統特朗普訪問菲律賓期間，昨日在馬尼拉總統府馬拉坎南宮與一位老友重聚，即總統小馬可斯的母親、前第一夫人艾美黛(Imelda Marcos)。\n現年97歲的伊美黛以奢華生活風格著稱，是上世紀80年代遭人命力量革命推翻的前總統馬可斯的遺孀。當天穿粉紅色套裝、坐在輪椅上的艾美黛向特朗普說：「歡迎來到菲律賓」。特朗普更大讚她「一直是最美麗的」。\n兩人早於30多年前在紐約社交圈結識並建立深厚友誼，特朗普還曾多次公開讚揚馬可斯家族。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1a65b216de","title":"DHC｜日本化妝品大廠爆1911萬筆個資外洩 另波及數間日企","url":"https://www.stheadline.com/realtime-world/3638768/DHC日本化妝品大廠爆1911萬筆個資外洩-另波及數間日企","summary":"日本知名化妝品及健康食品大廠DHC昨日驚傳大規模個人資料外洩事件，約1911萬筆顧客資料流出，包括姓名、出生年月日及電郵地址等。","summary_short":"日本知名化妝品及健康食品大廠DHC昨日驚傳大規模個人資料外洩事件，約1911萬筆顧客資料流出，包括姓名…","digest":"日本知名化妝品及健康食品大廠DHC昨日驚傳大規模個人資料外洩事件…","points":["日本知名化妝品及健康食品大廠DHC昨日驚傳大規模個人資料外洩事件…","事件源於DHC使用的行銷服務平台遭到黑客入侵，受害企業不止DHC，還包括JINS…","DHC表示，這次外洩的是旗下網上商店註冊顧客的資料…"],"section":"國際","category":"兩岸國際","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:56:18+08:00","size":1,"keywords":[],"body":"日本知名化妝品及健康食品大廠DHC昨日驚傳大規模個人資料外洩事件，約1911萬筆顧客資料流出，包括姓名、出生年月日及電郵地址等。事件源於DHC使用的行銷服務平台遭到黑客入侵，受害企業不止DHC，還包括JINS、思夢樂等知名日企。\nDHC表示，這次外洩的是旗下網上商店註冊顧客的資料，原因是合作的東京行銷公司PLAID所提供的服務KARTE遭到非法入侵。\n不過，外洩資料不包含信用卡等付款資訊，目前也尚未發現個人資料遭到不法利用。DHC將陸續通知受影響的顧客。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c334d3f14a5","title":"美防長訪委內瑞拉 雙方簽署恢復軍事技術合作協議","url":"https://news.tvb.com/tc/1207152-美防長訪委內瑞拉雙方簽署恢復軍事技術合作協議","summary":"美國俘虜委內瑞拉總統馬杜羅逾十個月，美國防長赫格塞思訪問委內瑞拉，雙方簽署恢復軍事技術合作協議。美國防長赫格塞思周三訪問加拉加斯，會晤委內瑞拉臨時總統羅德里格斯，雙方簽署軍事技術合作協議，內容涉及美方更新作戰裝備、訓練委軍部隊等。","summary_short":"美國俘虜委內瑞拉總統馬杜羅逾十個月，美國防長赫格塞思訪問委內瑞拉，雙方簽署恢復軍事技術合作協議。","digest":"美國俘虜委內瑞拉總統馬杜羅逾十個月，美國防長赫格塞思訪問委內瑞拉…","points":["美國防長赫格塞思周三訪問加拉加斯，會晤委內瑞拉臨時總統羅德里格斯，雙方簽署軍事技術合作協議…","羅德里格斯認為有助兩國應對共同威脅","赫格塞思就期待兩國合力打擊毒販及恐怖分子"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T08:35+08:00","size":1,"keywords":[],"body":"美國俘虜委內瑞拉總統馬杜羅逾十個月，美國防長赫格塞思訪問委內瑞拉，雙方簽署恢復軍事技術合作協議。\n\n美國防長赫格塞思周三訪問加拉加斯，會晤委內瑞拉臨時總統羅德里格斯，雙方簽署軍事技術合作協議，內容涉及美方更新作戰裝備、訓練委軍部隊等。羅德里格斯認為有助兩國應對共同威脅。赫格塞思就期待兩國合力打擊毒販及恐怖分子。\n\n美軍今年初強行將馬杜羅夫婦帶去美國，之後雙方同意恢復外交關係。","image":"https://pro-vod-cdn.tvb.com/2861f0fcc05c402c9ca0f7a4fda41685/snapshots/6ecbfda564974bf6a8306ade2ba12e86-00005.jpg","video":"https://pro-vod-cdn.tvb.com/2861f0fcc05c402c9ca0f7a4fda41685/7d47aa4a151b482c83598877c0c0579a-7f90609d1e78d3ab05029cb718ed8dc0-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/2861f0fcc05c402c9ca0f7a4fda41685/snapshots/6ecbfda564974bf6a8306ade2ba12e86-00005.jpg","lang":"zh-Hant"},{"id":"ca413433d1e","title":"日本「西瓜卡」換新吉祥物 有網民製作AI惡搞片段成網上熱話","url":"https://news.tvb.com/tc/1207178-日本西瓜卡換新吉祥物有網民製作AI惡搞片段成網上熱話","summary":"日本交通儲值用的「西瓜卡」，陪伴乘客25年的吉祥物企鵝，將於明年3月「退休」。發行商公布新的吉祥物造型，設計師期望可帶來安心及感動的理念。","summary_short":"日本交通儲值用的「西瓜卡」，陪伴乘客25年的吉祥物企鵝，將於明年3月「退休」。","digest":"日本交通儲值用的「西瓜卡」，陪伴乘客25年的吉祥物企鵝，將於明年3月「退休」","points":["日本交通儲值用的「西瓜卡」，陪伴乘客25年的吉祥物企鵝，將於明年3月「退休」","發行商公布新的吉祥物造型，設計師期望可帶來安心及感動的理念","在日本部分地區用餐、購物、乘搭巴士及鐵路，部分民眾會用JR東日本發行…"],"section":"國際","category":"國際","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T08:25+08:00","size":1,"keywords":[],"body":"日本交通儲值用的「西瓜卡」，陪伴乘客25年的吉祥物企鵝，將於明年3月「退休」。發行商公布新的吉祥物造型，設計師期望可帶來安心及感動的理念。另有網民製作AI惡搞片段，成為網上熱話。\n\n在日本部分地區用餐、購物、乘搭巴士及鐵路，部分民眾會用JR東日本發行，俗稱「西瓜卡」的綠色交通IC卡Suica繳費，形式類似「八達通」。包含手機數碼版及實體卡在內，「西瓜卡」在日本發行量，已突破1億2,000萬張。\n\n說到「西瓜卡」，相信大家記得這隻企鵝，它由插畫家坂崎千春設計，1998年在個人繪本登場，2001年開始成為「西瓜卡」吉祥物，幾乎成為日本鐵道文化的經典象徵。\n\n由於「西瓜卡」品牌轉型，JR東日本決定更改吉祥物，身形圓滾滾、表情可愛的企鵝，將於明年3月底光榮退休。JR東日本早前公開3款新角色設計，供民眾在網上投票，到周三選出新的吉祥物，總票數逾166萬，這隻由插畫家世戶宏明設計的紫色兔子拿下86萬票，成為「西瓜卡」第二代吉祥物。\n\n世戶宏明表示，選擇兔子作為設計原型，是希望塑造一個角色，代表聆聽聲音、朝向未來躍進。他又稱象徵「安心」的藍色，與代表「感動」的紅色，混合起來就變成紫色，希望藉此傳達新角色的理念。\n\n評選委員會主席就稱，紫色兔子帶來新鮮感，具備極強的視覺衝擊力，令人印象深刻，相信會受到大眾喜愛。JR東日本正舉行命名活動，明年3月底公布紫色兔子的名字。\n\n不過日本部分網民似乎不太喜歡這個新角色，不僅用AI人工智能生成「惡搞」片段，甚至稱它做「毒兔子」。有超高人氣的企鵝，陪伴日本人四分之一個世紀，紫色兔子將來能否受到大眾愛戴，有待時間證明。","image":"https://pro-vod-cdn.tvb.com/16313c0e78ee4c249ae02988c27925a6/snapshots/d135b7f922584ba2a0ed5b02acf38732-00008.jpg","video":"https://pro-vod-cdn.tvb.com/16313c0e78ee4c249ae02988c27925a6/0ae9b414e1354775a502dc8ef185cdb8-bb2448d9454aa5097a685204c7adf17f-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/16313c0e78ee4c249ae02988c27925a6/snapshots/d135b7f922584ba2a0ed5b02acf38732-00008.jpg","lang":"zh-Hant"}]},{"name":"民生","total":41,"items":[{"id":"c7bc6ea7153","title":"诺贝尔奖得主斯宾塞走进苏州校园探讨“AI时代人的价值”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734780.shtml","summary":"中新网昆山11月19日电 (记者 钟升)2001年诺贝尔经济学奖得主迈克尔·斯宾塞16日到访江苏苏州的昆山杜克大学。","summary_short":"中新网昆山11月19日电 (记者 钟升)2001年诺贝尔经济学奖得主迈克尔·斯宾塞16日到访江苏苏州的昆山杜克大学。","digest":"2001年诺贝尔经济学奖得主迈克尔·斯宾塞16日到访江苏苏州的昆山杜克大学","points":["中新网昆山11月19日电 (记者 钟升)2001年诺贝尔经济学奖得主迈克尔·斯宾塞16日到访…","在以“人工智能与全球经济的未来”为主题的演讲中，斯宾塞分析了AI如何成为新的经济增长动力…","斯宾塞认为，AI之所以重要，不仅因为技术本身令人惊叹，更因为全球经济需要新的生产率增长来源"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:52:04+08:00","size":1,"keywords":[],"body":"中新网昆山11月19日电 (记者 钟升)2001年诺贝尔经济学奖得主迈克尔·斯宾塞16日到访江苏苏州的昆山杜克大学。在以“人工智能与全球经济的未来”为主题的演讲中，斯宾塞分析了AI如何成为新的经济增长动力，以及技术要真正造福更多人，还需要跨过哪些门槛。\n\n　　斯宾塞认为，AI之所以重要，不仅因为技术本身令人惊叹，更因为全球经济需要新的生产率增长来源。他将AI革命分为两部分：一是研发强大的前沿模型，二是推动这些技术进入不同领域，被真正采用，并不断扩散。\n\n斯宾塞以“人工智能与全球经济的未来”为主题发表演讲。　昆山杜克大学供图\n\n　　在斯宾塞看来，AI能否改变经济，关键不只在于模型本身，更在于技术能否与真实需求连接，进入广泛的应用场景，只有技术进入日常工作，帮助更多人改善服务、解决问题、创造新产品，AI的潜力才会转化为广泛的经济收益。\n\n　　斯宾塞表示，庞大的制造业基础是中国的重要优势之一，令中国有望在机器人领域处于领先地位。机器人技术的进步，则可能让AI进入更多需要实际操作的工作场景。\n\n　　对于“随着AI发展，工作将会变成一种可选项”的观点，斯宾塞予以否定。他认为，技术有可能大幅缓解某些重要领域的稀缺，但这不等于所有稀缺都会消失，更不意味着人类很快不再需要工作。AI更值得期待的用途，是节省人的时间、帮助人完成原本做不到的事情，以及识别人类难以发现的复杂模式。\n\n　　面对AI革命，斯宾塞对台下师生们的建议是：用起来，在实际使用中理解AI。他也提出，AI可以成为学习的助手，但不应成为绕过学习的捷径，永远不要用AI替代自身。\n\n斯宾塞与师生们围绕着AI的相关话题展开探讨。　昆山杜克大学供图\n\n　　面对师生提出的“如果AI让雇主更难判断候选人的能力，大学学位是否反而会更有价值？”的问题，斯宾塞指出，大学教育不只是获取技能。社会需要有愿景、有内在动力、善于协作的人，更需要那些能够带动他人，让团队成果超越个体成果简单相加的人。AI的出现并没有让人的成长失去意义。相反，技术可以帮助处理部分繁琐事务、辅助研究，让人们有机会投入更令人兴奋的探索中。\n\n　　负责主持的昆山杜克大学常务副校长约翰·奎尔奇也表示，生产效率的提升固然重要，却不能取代创造的乐趣。他鼓励在场师生追求热爱、享受探索，在乐趣中激发创造力，并以此为努力与成长注入动力。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1c6ba74f42","title":"湖南怀化文旅升温：提前五年攒“管院子的人”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734765.shtml","summary":"中新网怀化11月19日电 (易辉君)“院子是新的，人也是新的才好。","summary_short":"中新网怀化11月19日电 (易辉君)“院子是新的，人也是新的才好。","digest":"“院子是新的，人也是新的才好","points":["中新网怀化11月19日电 (易辉君)“院子是新的，人也是新的才好","”湖南怀化市辰溪县孝坪镇废弃水塔改成的“水塔咖啡”，闲置工会楼变成兵工主题民宿…","第五届怀化市旅游发展大会在辰溪闭幕后，这句话点出一个现实课题：办会、修路、建索道、改院子…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:43:01+08:00","size":1,"keywords":[],"body":"中新网怀化11月19日电 (易辉君)“院子是新的，人也是新的才好。”湖南怀化市辰溪县孝坪镇废弃水塔改成的“水塔咖啡”，闲置工会楼变成兵工主题民宿，83岁退休职工赵国强看着集镇重新热闹起来。\n\n　　第五届怀化市旅游发展大会在辰溪闭幕后，这句话点出一个现实课题：办会、修路、建索道、改院子，看得见的资产一年可以立起来；游客住进去后，谁在前台递房卡、谁判断客房配什么早餐、退房后回一句什么话，这些不写在项目清单上的事，决定院子能否真正“活”下来。\n\n怀化市首期民宿管家技能提升培训班在安江校区开班。　怀化市委宣传部 供图\n\n　　怀化职业技术学院较早动手布局。2021年教育部职业教育专业新增民宿管理与运营专业，学校当年申报了该专业，目前也是湖南省唯一开设民宿管理与运营专业的高职院校。\n\n　　学校组织团队走访凤凰和怀化周边民宿集群，经营者回答一致：“不缺铺床的，缺懂经营的人”。课程据此设置，涵盖民宿运营管理、管家服务、房务餐饮、活动策划、数字化营销、民宿数据分析与财务管理。学校将岗位需求、课程教学、技能竞赛、职业证书贯通起来，以“岗课赛证”融通培养民宿管家。\n\n　　2023年6月，湖南省首批民宿管家职业能力考核在怀化职业技术学院设点，51名学生成为全省首批持证民宿管家；2025年11月民宿管家职业技能鉴定点也落在学校，同时获批具备该职业工种的自主评价机构资质。2025年中国高职院校专业竞争力排行榜中，该校民宿管理与运营专业位居全国第4。\n\n怀化职业技术学院51名学生成为湖南省首批获证民宿管家。　怀化市委宣传部 供图\n\n　　课堂还延伸到校外：2024级“亚湾班”赴重庆酉阳、涪陵学习场景营造、古镇共生和主题民宿集群布局；教师赴杭州桐庐企业训练营学习店长职责、线上运营和成本收益管理。2026年7月，湖南省首届旅游民宿管家职业技能大赛决赛在长沙望城举行，怀化职院学生团队组获一等奖2项。\n\n　　同年，怀化职业技术学院学生作品《侗锦织韵——非遗纹样重构活化品牌设计方案》《皇都侗韵锦歌和鸣——侗寨非遗沉浸式体验》分别荣获艺术设计赛道银奖、中华传统技艺赛道铜奖。这些赛事成绩，正逐步转化为全市民宿一线的服务能力。\n\n　　怀化职业技术学院的先行，也与怀化市发展节奏逐步合拍。2024年10月，多个市直部门与学校签约，在安江农校纪念园共建首个农文旅产教融合职业技能人才培训基地。市级层面推出“懂你的”文旅技能培训，分3期培训超1500人次，学校参与教学，结合芷江红色旅游、通道侗族文化差异化施教。\n\n怀化市首期民宿管家技能提升培训班现场。　怀化市委宣传部 供图\n\n　　2026年1月，怀化市委六届十一次全会通过《关于促进文旅产业高质量发展加快建设全国一流旅游度假目的地的决定》，把文旅人才和运营能力置于与项目建设同等位置。2026年7月，怀化职业技术学院商贸旅游学院院长李玉华当选会长，将AI赋能文旅、产教协同育人列入新一届理事会工作方向。\n\n　　据怀化市文旅部门统计，2025年全市接待游客7224.07万人次，旅游总花费685.78亿元，同比分别增长12.13%和12.7%。张吉怀高铁通车后，“过境客流”向“过夜消费”转化，消费落在院子里，接不接得住，取决于前台后面的人懂不懂这间院子和这片土地。\n\n　　“福地怀化，懂你如家”是怀化市委、市政府对游客的承诺，兑现承诺的最后一米，落在管院子的人身上。怀化市资源联动和市委再部署，怀化职业技术学院提前五年主动布局，使这份提前准备与院子集中开门形成了衔接。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cab62706127","title":"追忆乡村教师叶连平：“最后一口气我要在讲台上呼出去的”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734770.shtml","summary":"中新网安徽马鞍山11月19日电 题：追忆乡村教师叶连平：“最后一口气我要在讲台上呼出去的”  　　作者 张俊 刘鸿鹤 游蕾  　　19日上午，在安徽省马鞍山市和县乌江镇卜陈村的叶连平老屋里…","summary_short":"中新网安徽马鞍山11月19日电 题：追忆乡村教师叶连平：“最后一口气我要在讲台上呼出去的”  　　作者 张俊 刘鸿鹤 游…","digest":"题：追忆乡村教师叶连平：“最后一口气我要在讲台上呼出去的”  　　作者 张俊 刘鸿鹤…","points":["19日上午，在安徽省马鞍山市和县乌江镇卜陈村的叶连平老屋里，书架上摆着几排旧书…","有人对着讲台鞠躬，有人在门口放下一束花","26年前，叶连平腾出自家房屋办起的“卜陈未成年人之家”"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:40:15+08:00","size":1,"keywords":[],"body":"中新网安徽马鞍山11月19日电 题：追忆乡村教师叶连平：“最后一口气我要在讲台上呼出去的”\n\n　　作者 张俊 刘鸿鹤 游蕾\n\n　　19日上午，在安徽省马鞍山市和县乌江镇卜陈村的叶连平老屋里，书架上摆着几排旧书，讲台上放着他用过的教具。\n\n　　村民、同事、学生家长陆续走进老屋，脚步都很轻。有人对着讲台鞠躬，有人在门口放下一束花。26年前，叶连平腾出自家房屋办起的“卜陈未成年人之家”。就在这间屋里，他义务给周边学生辅导功课。\n\n　　18日下午，叶连平因病逝世，享年98岁。\n\n11月19日，民众来到“卜陈未成年人之家”悼念叶连平。中新社记者张俊 摄\n\n　　“80多岁骑自行车去南京买书”\n\n　　孟丽华是叶连平友人的女儿。她的父亲与叶连平曾在一起工作过，两家人来往了几十年。\n\n　　“他是个优秀的乡村教师，但也吃了不少苦，这一辈子都奉献了。”孟丽华说，屋里那张床、沙发、橱柜，都是她结婚换家具时送过来的，“他舍不得买家具，一辈子节省得不得了。”\n\n　　“他80多岁还骑自行车去南京买书，跑过好多次，为的是省下车钱留给困难的学生。”孟丽华回忆说，今年，他把书捐给了好几所学校。\n\n　　曹丽的女儿是叶连平的学生。“女儿从小学三年级到六年级都在叶老师的家里上英语课。”曹丽说，叶连平上课特别认真、平时特别关心学生。\n\n　　“我女儿的第一副眼镜，就是叶老师带着去南京配的。”曹丽说，她曾劝过叶连平，“你90多岁就不要去了，我自己带她去。叶老师不放心，来回半天多，检查、验光，他一直在旁边。”\n\n11月19日，在叶连平的老屋里，他使用过的教具和遗体捐献证书摆放在桌子上。中新社记者张俊 摄\n\n　　“去世10天前还在给学生上课”\n\n　　今年10月，曹丽带女儿来看望叶连平。曹丽说，那天他精神不如往常，聊家常时提起手指关节疼，说了一句：“我就担心不能写字，我以后还要给他们上课。”\n\n　　当时，叶连平还给曹丽的女儿留了一个问题，并叮嘱说：“下次来告诉我。”\n\n　　居平树是叶连平的学生，两人还曾是同事。如今，他是“叶连平奖学金”的负责人之一。\n\n　　今年6月，叶连平的肩颈一直疼。居平树和同事们带他到医院检查后确诊是肿瘤。居平树说，今年暑假，大家都劝叶连平别上课了，有大学生志愿者可以来上的。叶连平退了一步说：“我给他们做点服务，备课、批改作业。”\n\n　　据居平树介绍，前不久，叶连平住进了一家老年公寓。他闲不住，又开起了课，给附近一所小学三年级的孩子上课。“叶老师去世10多天前，还在给孩子们上课。”居平树说。\n\n11月19日，“卜陈未成年人之家”里摆放着叶连平生前授课的照片。中新社记者张俊 摄\n\n　　“要淡泊名利、要持之以恒”\n\n　　距卜陈村几十公里外的濮集镇，66岁的王加胜也创办了一家“留守儿童活动中心”。\n\n　　2014年，王加胜把自家部分房屋腾了出来作为活动中心。王加胜回忆说，当时叶连平找过他，说了一句话：“王老师，办一个留守儿童之家，要淡泊名利、要持之以恒，不要在乎别人对你的评价。”\n\n　　十多年来，叶连平常常到上述留守儿童活动中心上课。“他的精神一点一滴注入了我的生命。”王加胜说，“今年最后一次见面，他前后嘱咐了我几遍：‘王老师，你一定要把我所做的事情做下去。’”\n\n　　居平树回忆说：“他太爱教育，太爱孩子，舍不得离开三尺讲台。”\n\n　　2012年，叶连平拿出积蓄设立奖学金。后来，他立下遗嘱：身后的家产、存折和现金，全部捐作奖学金；遗体捐献给蚌埠医科大学，供医学教学与科研使用。\n\n　　“正如他自己说的，我希望我的最后一口气是在讲台上呼出去的。”居平树说，他几乎是实现了这个心愿。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c53f8b5f17d","title":"忘忧草“出海记”：一株中国黄花的世界叙事","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734758.shtml","summary":"中新网大同11月19日电 题：忘忧草“出海记”：一株中国黄花的世界叙事  　　中新网记者 胡健  　　美国东部小镇的华人超市货架，摆着一包“大同黄花”。","summary_short":"中新网大同11月19日电 题：忘忧草“出海记”：一株中国黄花的世界叙事  　　中新网记者 胡健  　　美国东部小镇的华人…","digest":"题：忘忧草“出海记”：一株中国黄花的世界叙事  　　中新网记者 胡健  　　美国东部…","points":["美国东部小镇的华人超市货架，摆着一包“大同黄花”","山西省大同市云州区素有“黄花之乡”美誉，黄花七蕊凝黄、条壮肉实","当地为黄花全链条立起标准，种黄花告别“看天吃饭”，转向“盯着数据干”，六年接力…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:37:17+08:00","size":1,"keywords":[],"body":"中新网大同11月19日电 题：忘忧草“出海记”：一株中国黄花的世界叙事\n\n　　中新网记者 胡健\n\n　　美国东部小镇的华人超市货架，摆着一包“大同黄花”。异乡见家乡花，一朵小花牵起游子乡愁。\n\n　　这朵花产自雁北。山西省大同市云州区素有“黄花之乡”美誉，黄花七蕊凝黄、条壮肉实。可多年前，好物产换不来好日子。\n\n山西大同云州区的生产车间正在加工鲜黄花。大同市新闻中心 供图\n\n　　云州区唐家堡村村民唐万、唐俊琦父子记忆里的黄花，滋味截然不同。父亲唐万记得，早年虫害频发、销路不畅：“那时一斤鲜黄花就一块钱，大伙儿宁可种玉米，也不敢大量种黄花。”\n\n　　当地为黄花全链条立起标准，种黄花告别“看天吃饭”，转向“盯着数据干”，六年接力，一年攻克一个瓶颈：2021年合作社市场化改革，亩均增产近400斤；2022年绿色防控落地；2023年滴灌水肥一体化推广；2024年标准化田间管理铺开；2025年人工采摘成本下降两成。\n\n　　成效写在大地上：亩产从不足1000斤升至2500斤以上，1.7万名脱贫人口累计分红3000余万元，近2万人家门口就业，人均年增收5200元。没人敢种的黄花地，成了抢着采收的致富田。唐俊琦家靠黄花增收，新建住房、购了汽车，还在城区安家。\n\n　　“以前，干黄花一斤16元，现在一斤能卖到30元。这光景，让咱敢想更敢干。”云州区慧宇农业有限公司总经理梁新宇说。不少从业者告别“背着麻袋跑市场”，转型为全链条经营。\n\n当地农民正在为黄花松土除草。大同市新闻中心 供图\n\n　　“龙头企业＋合作社＋种植户”模式带动138家经营主体，干菜、冰鲜、茶饮、文创等上百种深加工产品相继问世。花倾城车间里，农户马建华感慨：土地流转有收入，就近务工能顾家，收入踏实。\n\n　　一朵黄花，不止旺田野，也融进城市。大同古城里，黄花烧卖、黄花冰激凌带火特色餐饮；云州黄花登上云冈机场航班餐食，化作丝巾、抱枕纹样，成了带得走的“大同记忆”。火山黄花田园综合体客流不断，返乡青年蔡佳慧在家门口经营文旅业态，黄花既种出了丰收，也种出了风景。\n\n　　如今，这朵金色之花已走出国门，远销美国、加拿大等地。从海外游子的餐桌乡愁，到世界读懂中国乡村振兴的窗口，一朵小黄花正把乡土故事讲给世界听。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c72460698bd","title":"新疆“画家村”：农民画家手绘乡村蝶变","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734761.shtml","summary":"中新网新疆吉木萨尔11月19日电 (记者 苟继鹏)初冬时节，有着“画家村”之称的新疆吉木萨尔县新地乡小分子村雪染层峦。","summary_short":"中新网新疆吉木萨尔11月19日电 (记者 苟继鹏)初冬时节，有着“画家村”之称的新疆吉木萨尔县新地乡小分子村雪染层峦。","digest":"初冬时节，有着“画家村”之称的新疆吉木萨尔县新地乡小分子村雪染层峦","points":["中新网新疆吉木萨尔11月19日电 (记者 苟继鹏)初冬时节…","虽是农闲时节，但64岁的村民张新香却闲不下来，整日忙着画画","“画画不仅圆了儿时的梦想，也让平淡的生活多了几分色彩"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:35:57+08:00","size":1,"keywords":[],"body":"中新网新疆吉木萨尔11月19日电 (记者 苟继鹏)初冬时节，有着“画家村”之称的新疆吉木萨尔县新地乡小分子村雪染层峦。虽是农闲时节，但64岁的村民张新香却闲不下来，整日忙着画画。\n\n　　“画画不仅圆了儿时的梦想，也让平淡的生活多了几分色彩。”记者近日见到张新香时，她正准备提笔勾勒家乡的冬日，家里墙上挂着几幅其描绘家乡风光的画作。\n\n初冬时节的新疆吉木萨尔县新地乡小分子村，宛如一幅水墨画。　陈晓雯 摄\n\n　　上个月，一场名为“土地里长出的画”的新疆农民画展亮相深圳市，展出的22幅画作中绝大多数都出自包括张新香在内的小分子村农民画家之手。\n\n　　“乡村振兴，不仅是让日子富起来，还要让每个人心里那团火也燃起来。”张新香说。\n\n　　位于天山北麓的小分子村，山地多、耕地少，曾是一个“靠天吃饭”的村落。早年村民人均收入并不高，一度还是贫困村。2014年前后，一批画家先后到此采风定居，村庄逐渐有了“画家村”的美名。此后十余年间，村里相继建起美术馆、民宿、酒吧，村民当上了咖啡师或民宿经营户。\n\n　　十年前，村民马生喜把自家房屋精心改造一番后，建起村里第一家民宿。凭借热情周到的服务与整洁舒适的环境，每到旅游旺季，这里游客络绎不绝。“后来我们新建了屋舍，那座老宅就变成了农家画廊，墙上挂满了众多艺术家的画，每一幅画背后都有说不完的故事。”\n\n　　“这些年村里最直观的变化就是大家的腰包越来越鼓。”村民马海亮在艺术家的建议下，将昔日的羊圈改成“羊圈酒吧”，将闲置房屋变成特色民宿，成为不少游客的打卡地，每年能多增收六万余元人民币。\n\n　　新疆画家刘燕虹是最早一批驻村画家之一，他认为，过去村民更多关心一头牛、一只羊能值多少钱，如今不少人拿起画笔，把平凡的乡村生活描绘得热烈鲜活。“从最初的消磨农闲时光，到慢慢画出一些名堂，艺术带来了收入，也带起了村民用作品赞誉家园的那份热切。”\n\n　　截至目前，已有来自全国各地的30多位艺术家驻村创作，村里还建成20多家民宿和农家乐，年接待游客30余万人次，旅游收入超800万元。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc4699a0812","title":"将美术课堂搬进医院 成都一群美术老师坚持公益艺术疗愈","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734755.shtml","summary":"中新网成都11月19日电 题：将美术课堂搬进医院 成都一群美术老师坚持公益艺术疗愈  　　作者 祝欢  　　晚上7点，大多数人已下班回家休息，而在成都第一骨科医院儿童骨科的活动室内…","summary_short":"中新网成都11月19日电 题：将美术课堂搬进医院 成都一群美术老师坚持公益艺术疗愈  　　作者 祝欢  　　晚上7点…","digest":"题：将美术课堂搬进医院 成都一群美术老师坚持公益艺术疗愈  　　作者 祝欢  　　晚…","points":["晚上7点，大多数人已下班回家休息，而在成都第一骨科医院儿童骨科的活动室内…","2010年，成都市青羊区教育科学研究院美术教研员匡敏在看了关于自闭症的电影《海洋天堂》后…","2023年，志愿服务范围从特殊教育学校延伸至医院"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:33:07+08:00","size":1,"keywords":[],"body":"中新网成都11月19日电 题：将美术课堂搬进医院 成都一群美术老师坚持公益艺术疗愈\n\n　　作者 祝欢\n\n　　晚上7点，大多数人已下班回家休息，而在成都第一骨科医院儿童骨科的活动室内，每周一都会迎来一群从各自学校赶来的中小学美术教师。他们自带黏土、水彩、画笔等材料，带领行动方便的孩子在活动室围坐创作，在卧床孩子的病床边一对一陪伴，针对性设计的艺术疗愈课程让孩子们在创作中暂时忘记了病痛。\n\n艺术疗愈现场。祝欢 摄\n\n　　这样的场景，在这家医院已经持续了三年。而它背后的那条路，从2013年走到今天，整整13年。“让艺术，成为一剂没有副作用的药。”这句话，一群人用了13年去证明。\n\n　　2010年，成都市青羊区教育科学研究院美术教研员匡敏在看了关于自闭症的电影《海洋天堂》后，心里久久不能平静，萌生了想为他们做点什么的想法。2013年，匡敏在成都市青羊区普通中小学美术教师中招募志愿者，志愿者们走进青羊区特殊教育学校，用画笔陪伴那些在沟通表达上困难的“星星的孩子”。这一做，就是7年，相关课题后来获得四川省教育成果一等奖。\n\n　　2023年，志愿服务范围从特殊教育学校延伸至医院。当时，匡敏在成都第一骨科医院住院，护士长左江红了解到她做了多年的公益项目，主动邀请她把美术课带进病房，这一想法也得到了院方的大力支持。“将老师们的艺术工作和医院的病人相结合，不仅可以加深患者对艺术的了解，也有助于拉近医患距离。”成都市第一骨科医院院长唐晓俞表示，医院在组织保障、人员分工及制度建设等方面给予了大力支持。\n\n　　“希望通过艺术疗愈，让大家觉得医院不完全是痛苦的地方，也还有美好的回忆。”回忆起当时的初衷，匡敏表示，让自己意外的是，第一次倡议就有80多名公立学校美术教师报名，如今参与医院服务的志愿者已超过150人。\n\n艺术疗愈现场。祝欢 摄\n\n　　匡敏反复强调，艺术疗愈不只是一堂课。“艺术疗愈实际上是通过艺术的手段，让内心找到愉悦的感觉。”匡敏介绍，面对不同的孩子，老师们做的不是教技法，而是根据每个孩子的年龄、受伤部位等针对性地设计课程，主题跟着四季和节气走，也根据每个孩子的状态调整。\n\n　　近来成都银杏叶变黄，志愿者吴杨特意选取成都本土题材与自然素材，提前捡到银杏叶压平夹在书中，带领孩子在银杏叶上画大熊猫，再将银杏叶按构图贴于古朴扇面，作品既有趣又简单。下班后从学校赶往医院，对和吴杨一样的志愿者老师来说已是寻常。“看到孩子们在创作中放松下来，就觉得坚持有意义。”作为首批加入倡议的志愿者，吴杨说。\n\n　　该医院儿童骨科主任徐兵从临床角度看到了明显变化。“很多创伤患儿在疼痛和陌生环境的双重因素叠加下会引起情绪的抗拒，但通过艺术疗愈，慢慢打开了心结，艺术疗愈和医疗疗愈相辅相成。”在徐兵看来，艺术疗愈介入后，孩子在创作中放松下来，对临床治疗的主动性也大大提高。不仅如此，该科室在日常工作中还通过举行音乐、趣味活动，让小朋友坐着遥控汽车进入手术室等方式缓解患儿情绪。\n\n　　走进医院之后，项目的服务对象并没有停在儿童骨科。匡敏在接触中看到许多失能失智的老人，“艺术可以帮他们唤醒曾经的记忆，通过艺术材料的使用训练他们快失去的基本能力。”于是，这间“艺术教室”又向老年病房延伸。3年来，该项目累计在医院服务600余名患儿及家属、50余名老人。仅儿童骨科的艺术疗愈常态化志愿服务，就已累计开展80余场。\n\n艺术疗愈现场。徐俊宇 摄\n\n　　唐晓俞认为，艺术疗愈不是一个简单的“公益项目”，更是已经进入医院人文建设和社会服务的常态化机制里。“以医务社工为枢纽，用艺术这种非语言的方式，回应住院带来的失控感和恐惧是可以在其他科室复制的。”唐晓俞认为，艺术疗愈和医疗疗愈本来就在同一条路上。\n\n　　做了13年艺术疗愈的匡敏希望，未来有更多社会群体参与进来，增加体验种类，扩大影响力，甚至走向更多专科病房，让更多患者被艺术疗愈。匡敏表示，下一步将会和医生一起，把艺术疗愈公益项目做成课题，继续研究针对什么样的孩子、做什么样的疗愈、达到什么样的效果，“让这条路走得更专业、更长远”。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1223557541","title":"广东携超2万个岗位赴湘三校“精准揽才”","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734759.shtml","summary":"中新网韶关11月19日电 (记者 王坚)据广东省韶关市政府19日消息，“百万英才汇南粤”2026年N城联动秋季招聘湖南专场，在三天时间里，由韶关市带队，相继走进湘潭大学、湖南科技大学…","summary_short":"中新网韶关11月19日电 (记者 王坚)据广东省韶关市政府19日消息…","digest":"据广东省韶关市政府19日消息，“百万英才汇南粤”2026年N城联动秋季招聘湖南专场…","points":["中新网韶关11月19日电 (记者 王坚)据广东省韶关市政府19日消息…","据介绍，三场活动线上线下共有563家次企事业单位参聘，提供岗位20458个次…","现场吸引近2万名毕业生入场，收到简历9930份"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:25:24+08:00","size":1,"keywords":[],"body":"中新网韶关11月19日电 (记者 王坚)据广东省韶关市政府19日消息，“百万英才汇南粤”2026年N城联动秋季招聘湖南专场，在三天时间里，由韶关市带队，相继走进湘潭大学、湖南科技大学、中南林业科技大学，把超2万个岗位直接送到湖南高校门口。\n\n招聘活动现场。韶关市政府 供图\n\n　　据介绍，三场活动线上线下共有563家次企事业单位参聘，提供岗位20458个次，其中本科岗位14437个次、硕士3682个次、博士867个次，覆盖不同学历层次。现场吸引近2万名毕业生入场，收到简历9930份。先进材料、装备制造、大数据与电子信息专区里，企业招聘从“收简历”转向“聊项目、谈技术”，专业对口率明显高于常规招聘。\n\n　　广东20个战略性新兴产业集群，对数学、计算机、材料、工程类人才形成结构性需求。韶关以大数据为首位产业，同步布局先进材料、装备制造、生物医药和林业生态等“1+8”赛道。湘潭大学的材料化学、湖科大的工程与材料、中南林大的林学与生态，分别对应韶关不同产业方向，高校学科优势直接转化为可对接的岗位表。\n\n　　比现场签约更进一步的，是合作机制开始“留下来”。活动期间，韶关市人社部门与三校就业部门签署合作协议，韶关市林业局与中南林大林学院、韶关学院马院与湘大马院、韶关律协与湘大法学学部分别签约，覆盖林业生态、思政教育、法学实践等领域；同时三校各聘10名广东籍在校生担任校园大使，把一次性招聘延伸为常态化的校地人才联络。\n\n　　从“跨岭送岗”到“校地共建”，这场招聘会试图解决的，不只是应届生去哪就业，更是粤北产业升级如何稳定接住外地高校智力资源。\n\n　　据悉，下一步，韶关将依托签约机制和校友网络持续推送岗位与政策，把阶段性揽才成果转为长期人才供给。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf28332e3bf","title":"上海五部门联合印发“园八条” 文创园区迎来新一轮政策利好","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734746.shtml","summary":"中新网上海11月19日电 (记者 王笈)19日，上海市文化创意产业推进领导小组办公室、中共上海市委宣传部、上海市经济和信息化委员会、上海市文化和旅游局…","summary_short":"中新网上海11月19日电 (记者 王笈)19日，上海市文化创意产业推进领导小组办公室、中共上海市委宣传部…","digest":"19日，上海市文化创意产业推进领导小组办公室、中共上海市委宣传部…","points":["中新网上海11月19日电 (记者 王笈)19日，上海市文化创意产业推进领导小组办公室…","文创园区是文创产业集聚发展的重要空间载体，承载着文化创新创造、产业跨界融合…","产业布局上，“园八条”明确支持杨浦滨江、徐汇滨江、浦东滨江、苏州河静安段打造覆盖数字文创…"],"section":"民生","category":"民生","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:15:34+08:00","size":1,"keywords":[],"body":"中新网上海11月19日电 (记者 王笈)19日，上海市文化创意产业推进领导小组办公室、中共上海市委宣传部、上海市经济和信息化委员会、上海市文化和旅游局、上海市国有资产监督管理委员会等五部门联合出台《上海市关于推动文化创意产业园区高质量发展的若干措施》(简称“园八条”)，推动文创园区从空间集聚转向生态赋能。\r\n\n　　文创园区是文创产业集聚发展的重要空间载体，承载着文化创新创造、产业跨界融合、城市有机更新的多重功能，是上海建设社会主义国际文化大都市、建设“设计之都”“时尚之都”“品牌之都”的重要依托。\n\n　　产业布局上，“园八条”明确支持杨浦滨江、徐汇滨江、浦东滨江、苏州河静安段打造覆盖数字文创、人工智能、文商旅体展、时尚创意等不同领域的产业集聚带，支持“一江一河”沿岸各区协同发展，并将文创园区纳入全市城市更新规划实施体系。\n\n　　发展形态上，上海支持文创园区融合式发展，鼓励形成综合产业空间，打造文商旅体展融合发展示范样板；支持有条件的园区引进文化旅游空间及设施，面向社区居民举办普惠性文化活动，联动周边商区、景区打造系列“文创+”融合场景。\n\n　　同时，上海支持园区举办“展会秀节赛”等高人气文化品牌活动，发展“首店经济”，并通过培育“上海定制”、推进“上海设计”“上海制造”，扩大上海品牌影响力；支持有条件的文创园区发展夜间演艺、沉浸式体验、潮玩聚会等夜间文化消费业态，成为夜间经济的重要组成部分。\n\n　　“园八条”注重提升文创园区的服务、运营与孵化能力，在优化基础服务的同时，支持定制个性化方案，探索数智化转型；建立全周期孵化体系和梯度培育机制，与高校、职校、企业等共同推进人才培养。\n\n　　对“一江一河”文创产业集聚带，市级层面按市促进文化创意产业发展专项资金管理要求给予扶持，针对文创园区改造贷款提供最高不超过100万元贴息。上海还将进一步制定行业运营规范和服务标准，定期开展市级文创园区认定、监测文创园区运营情况。(完) 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0b7e8b5b5e","title":"第九届全国职工职业技能大赛圆满落幕","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734738.shtml","summary":"中新网北京11月19日电 (记者 余湛奕)2026年全国行业职业技能竞赛——第九届全国职工职业技能大赛19日圆满落幕。","summary_short":"中新网北京11月19日电 (记者 余湛奕)2026年全国行业职业技能竞赛——第九届全国职工职业技能大赛19日圆满落幕。","digest":"2026年全国行业职业技能竞赛——第九届全国职工职业技能大赛19日圆满落幕","points":["中新网北京11月19日电 (记者 余湛奕)2026年全国行业职业技能竞赛——第九届全国职工职…","经过决赛三天的激烈角逐，最终决出个人奖、团体奖和组织奖","全国总工会兼职副主席、大赛总裁判长高凤林宣布决赛成绩，彭正飞获数控机床装调维修工工种第一名…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T17:02:09+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 余湛奕)2026年全国行业职业技能竞赛——第九届全国职工职业技能大赛19日圆满落幕。经过决赛三天的激烈角逐，最终决出个人奖、团体奖和组织奖。\n\n　　全国总工会兼职副主席、大赛总裁判长高凤林宣布决赛成绩，彭正飞获数控机床装调维修工工种第一名，李思晨获智能网联汽车装调运维员工种第一名，王雷雄获人工智能训练师工种第一名，梁义获电子设备装接工工种第一名，李文杰获工业废水处理工工种第一名，吴燕飞获网约配送员工种第一名。同时，闭幕式现场，向10家优秀组织单位、团体总分前5名的代表队、各工种前三名的优胜选手颁奖。大赛组委会向各工种前3名选手、团体总分前5名的代表队、大赛优秀组织奖获奖单位颁奖。\n\n2026年全国行业职业技能竞赛——第九届全国职工职业技能大赛19日圆满落幕。　主办方供图\n\n　　根据大赛奖励办法，大赛组委会将对符合条件的各工种前3名选手，按程序推荐申报全国五一劳动奖章，对各工种前20名选手按有关规定晋升职业技能等级，持续营造劳动光荣、技能宝贵、创造伟大的社会风尚。\n\n大赛组委会将对符合条件的各工种前3名选手，按程序推荐申报全国五一劳动奖章。　主办方供图\n\n　　本届大赛以“匠心筑梦 技能强国”为主题，旨在充分发挥职业技能竞赛在构建产业工人技能形成体系方面的重要作用，为职工技能学习、互学互鉴提供了更好的平台。据介绍，大赛坚持高标准、严规范、高质量、保公平，立足“十五五”产业发展趋势和企业生产实际，考核内容贴岗位、重实用，重点考核岗位技能运用和解决生产实际问题的能力，邀请两院院士、大国工匠、行业技术专家及科研院所、企业职院等领域专家，体现出国赛水平。决赛期间，同步举办全国工会系统技能竞赛成果展、职工绝技绝活展、生成式人工智能应用成果展及历届大赛优胜选手交流四大主题活动，全方位展示新时代职工技能风采、产业创新成果和技能竞赛成效。此外，通过“云游+访谈+展演+慢直播”等形式直击赛事盛况，吸引带动广大青年职工学技能、练本领。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c50d6cb7e90","title":"中南大学通报附属医院3篇论文争议：存在学术不端 4人被处理","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734734.shtml","summary":"中新网长沙11月19日电 (冯军)针对近日引发关注的湘雅二医院、湘雅医院论文质疑事件，中南大学11月19日在官网发布情况通报，认定被质疑的3篇论文存在伪造篡改实验研究数据和图表等学术不端行为…","summary_short":"中新网长沙11月19日电 (冯军)针对近日引发关注的湘雅二医院、湘雅医院论文质疑事件…","digest":"针对近日引发关注的湘雅二医院、湘雅医院论文质疑事件…","points":["通报称，近日网络上出现对湘雅二医院、湘雅医院3篇论文数据和图表的质疑","学校第一时间组织同行专家核查实验记录、原始数据、投稿记录等材料，访谈相关人员","论文二2026年发表于《Cell Death& Disease》，第一作者蔡某…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T16:59:05+08:00","size":1,"keywords":[],"body":"中新网长沙11月19日电 (冯军)针对近日引发关注的湘雅二医院、湘雅医院论文质疑事件，中南大学11月19日在官网发布情况通报，认定被质疑的3篇论文存在伪造篡改实验研究数据和图表等学术不端行为，4名相关责任人受到处理。\r\n\n　　通报称，近日网络上出现对湘雅二医院、湘雅医院3篇论文数据和图表的质疑。学校第一时间组织同行专家核查实验记录、原始数据、投稿记录等材料，访谈相关人员。根据同行专家核查结果，经校学风建设委员会审议，形成上述结论。\n\n　　据通报，被质疑论文一为2025年发表于《Journal of Translational Medicine》的研究，第一作者邓某某，通讯作者赵某，经查存在伪造篡改实验研究数据和图表、不当署名、违反科研伦理规范的学术不端行为；论文二2026年发表于《Cell Death& Disease》，第一作者蔡某、共同第一作者谭某某，通讯作者赵某，经查存在伪造篡改数据和图表、不当署名行为；论文三2026年发表于《Scientific Reports》，第一作者和共同第一作者为校外人员，通讯作者邓某某，存在伪造篡改数据和图表行为。\n\n　　依据相关规定，中南大学对邓某某、赵某予以降低专业技术岗位等级处罚，5年内取消其职务职称晋升、人才计划申报、研究生招生、评奖评优等资格，10年内不得承担财政性资金支持科技活动；对蔡某、谭某某，5年内取消其职务职称晋升、人才计划申报、研究生招生、评奖评优等资格，5年内不得承担财政性资金支持科技活动；对其他相关作者予以学术诫勉谈话。\n\n　　此次争议起于网友的学术打假。据新京报等媒体报道，有网友发现涉事论文的作者单位信息将“湖南省”的英文表述误写为“人类省”，论文图片中的刻度尺1厘米竟有12个小格，邮编“410011”末位写成小写字母“l”，图中小鼠肿瘤形态亦被质疑违背基本生物学常识，甚至怀疑相关实验图片系AI生成。\n\n　　11月17日，中南大学湘雅二医院科研部回应称已介入调查；湖南省科学技术厅监督与诚信处对外表示，相关部门已责成作者单位展开调查。\n\n　　中南大学在通报中表示，学校始终坚持对学术不端行为“零容忍”，将进一步加强科研作风建设，完善监督核查体系，坚决维护风清气正的学术生态。今年8月，该校曾集中通报六起学术不端问题处理结果，多名责任人被撤销基金项目申请资格、暂停职称晋升。(完) 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8a90618422","title":"中国雪乡风景区开园迎客","url":"https://www.chinanews.com/sh/shipin/cns-d/2026/11-19/news1075471.shtml","summary":"11月19日，中国雪乡风景区开园迎客。","summary_short":"11月19日，中国雪乡风景区开园迎客。","digest":"11月19日，中国雪乡风景区开园迎客","points":["开园当日，雪乡银装素裹，纷飞的雪花为大红灯笼罩上一层白纱","开园仪式现场，高跷、锣鼓、秧歌轮番上演，中外游客从远方赶来，驻足观看民俗展演…","中国雪乡风景区距离哈尔滨200多公里，是“哈亚雪”冰雪旅游精品线路的重要一环"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T16:34:02+08:00","size":1,"keywords":[],"body":"11月19日，中国雪乡风景区开园迎客。开园当日，雪乡银装素裹，纷飞的雪花为大红灯笼罩上一层白纱。开园仪式现场，高跷、锣鼓、秧歌轮番上演，中外游客从远方赶来，驻足观看民俗展演，在唯美雪景中拍照打卡。\n\n中国雪乡风景区距离哈尔滨200多公里，是“哈亚雪”冰雪旅游精品线路的重要一环。这里每年10月至次年4月持续降雪，积雪厚度最高可达2米，自然形成层层叠叠的雪蘑菇、雪檐等景观。\n\n新雪季，雪乡围绕游玩业态、夜景氛围、场景设施、服务保障、文体活动等多维度提档升级，为游客带来全新体验。\n\n(田兆军 孙庭义 陈冬 制作 赵宇航 视频来源 龙江森工大海林林业局有限公司)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/11FC556F5EAE43DBA332E1109C6197F4.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c307cca8f3b","title":"暨南大学120周年华诞 校友师生共话“声教讫于四海”","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-19/news1075468.shtml","summary":"近日，中国华侨最高学府暨南大学迎来建校120周年华诞。","summary_short":"近日，中国华侨最高学府暨南大学迎来建校120周年华诞。","digest":"近日，中国华侨最高学府暨南大学迎来建校120周年华诞","points":["近日，中国华侨最高学府暨南大学迎来建校120周年华诞","从1906年在南京创办至今，该校历经三落三起、五易其址，如今已成为国家“双一流”建设高校","当前，暨南大学已成为全国规模最大的港澳台侨人才培养基地…"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T16:04:20+08:00","size":1,"keywords":[],"body":"近日，中国华侨最高学府暨南大学迎来建校120周年华诞。从1906年在南京创办至今，该校历经三落三起、五易其址，如今已成为国家“双一流”建设高校。当日，来自五湖四海的暨南大学校友回到母校，与在校师生共话“声教讫于四海”。\n\n当前，暨南大学已成为全国规模最大的港澳台侨人才培养基地，累计为170多个国家和地区培养人才60余万，华侨华人子弟占其中相当大一部分。\n\n暨南大学董事会副董事长马有恒回顾了其63年的暨南情缘。他于1963年从澳门到内地求学，入读暨南大学经济系，感念母校在困难时期仍悉心照顾港澳侨生。\n\n王庆然 李曙 广东广州报道","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/3E51B5B865574355B261BC8748009E97.mp4","video_poster":"","lang":"zh-Hans"},{"id":"cbd043a378b","title":"月面聚光烧砖、远程送电、开采水冰：中国新技术推动人类从“探月”迈向“驻月”","url":"https://www.chinanews.com/sh/shipin/cns/2026/11-19/news1075459.shtml","summary":"近日，哈尔滨工业大学地外天体环境物理与智能探测团队研发出一款月面高效大容差离轴太阳能聚光器，为月面带来高效供能方案。","summary_short":"近日，哈尔滨工业大学地外天体环境物理与智能探测团队研发出一款月面高效大容差离轴太阳能聚光器，为月面带来高效供能方案。","digest":"月面聚光烧砖、远程送电、开采水冰：中国新技术推动人类从“探月”迈向“驻月”","points":["近日，哈尔滨工业大学地外天体环境物理与智能探测团队研发出一款月面高效大容差离轴太阳能聚光器…","该技术可显著提升能量传输和月壤“烧砖”的作业效率，有望打破月球短时探测的局限","这项成果标志着中国在地外能源、月球原位基建领域取得重要突破"],"section":"民生","category":"民生","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T15:51:31+08:00","size":1,"keywords":[],"body":"近日，哈尔滨工业大学地外天体环境物理与智能探测团队研发出一款月面高效大容差离轴太阳能聚光器，为月面带来高效供能方案。该技术可显著提升能量传输和月壤“烧砖”的作业效率，有望打破月球短时探测的局限。这项成果标志着中国在地外能源、月球原位基建领域取得重要突破。过去，探索月球只能“短时登陆、快速撤离”。新的供能技术，让这片曾经的地外禁区，逐步成为可长期开展探索的区域，人类奔赴星辰大海的目标也更近一步。(记者 田德雨 黑龙江报道)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/DDEC636405C74645824F99F8D9563330.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ccc7ab58814","title":"（文化新纪行）一器融南北 千年辽瓷焕新韵","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734668.shtml","summary":"中新社沈阳11月19日电 题：一器融南北 千年辽瓷焕新韵  　　中新社记者 李晛  　　初冬时节，沈阳辽瓷工坊窑火不熄。","summary_short":"中新社沈阳11月19日电 题：一器融南北 千年辽瓷焕新韵  　　中新社记者 李晛  　　初冬时节，沈阳辽瓷工坊窑火不熄。","digest":"题：一器融南北 千年辽瓷焕新韵  　　中新社记者 李晛  　　初冬时节…","points":["中新社沈阳11月19日电 题：一器融南北 千年辽瓷焕新韵","匠人执刀修坯，瓷屑簌簌飘落，坊内的鸡冠壶、皮囊壶、摩羯鱼壶等辽瓷佳作曾多次出海…","辽瓷制瓷技艺曾落寞三百年，如今，在辽三彩烧造技艺非遗代表性传承人孙天舒的赓续与创新下…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T15:48:03+08:00","size":1,"keywords":[],"body":"中新社沈阳11月19日电 题：一器融南北 千年辽瓷焕新韵\n\n　　中新社记者 李晛\n\n　　初冬时节，沈阳辽瓷工坊窑火不熄。匠人执刀修坯，瓷屑簌簌飘落，坊内的鸡冠壶、皮囊壶、摩羯鱼壶等辽瓷佳作曾多次出海，向世界展现兼容南北的中国瓷韵。\n\n　　辽瓷有近1200年历史，是中国瓷器史上唯一一个以少数民族政权命名的瓷器种类。辽瓷制瓷技艺曾落寞三百年，如今，在辽三彩烧造技艺非遗代表性传承人孙天舒的赓续与创新下，走出展厅、连上云端、走向世界。\n\n2025年12月15日，图为孙天舒(右)向记者介绍辽瓷。　中新社记者 禹瑞斋 摄\n\n　　“辽瓷直观体现了中原农耕、契丹游牧的双向融合。”孙天舒举例，这只鸡冠壶就是契丹与中原匠人跨越千年的对话。\n\n　　“鸡冠壶原型是契丹人马背皮囊，壶身复刻皮棱、针脚、皮扣，专为游牧迁徙而生，但成型、施釉、烧制取自中原汉地窑工。”孙天舒介绍，辽代中后期，器物弱化驮载功能，器身增添中原吉祥纹样。游牧需求塑造器型，中原纹饰装点瓷面，双向吸收、彼此成就，形成辽瓷独有的气质。\n\n　　中国工艺美术大师关宝琮提出，辽瓷作为中华文明多元一体的典型物证，关键在于它并非简单移植中原技艺，而是技术、造型、审美的创造性融合。\n\n　　“南方青瓷、宋白瓷代表农耕审美脉络，辽瓷补全北方草原陶瓷谱系。”关宝琮认为，各族群共享工艺，又依自身生活重塑器物，这种交融不是同化，而是和而不同；传承辽瓷，就是守护长城内外民族交往交流交融的实物见证。\n\n辽瓷经典器型——鸡冠壶。(孙天舒供图)\n\n　　“辽瓷扁身器型最难烧，稍微温差不对就会变形开裂。”孙天舒坦言，无典籍可依、无前人传授，她常年驻守窑厂，反复调试胎土、釉色与窑温，在一次次开窑失败、作废重来中，才攻克失传工艺。\n\n　　孙天舒说，她的工坊常态化接纳青年学徒、开设体验课程，让古老技艺代代相传。\n\n　　目前，孙天舒团队拥有134项知识产权、26项专利，自研原材料配方填补行业空白，开发200余款新品。团队把辽瓷特色刻剔、三彩施釉技艺融入茶具、餐具、国风文创。其中“马到成功”系列撷取《虢国夫人游春图》骏马神韵，唐韵辽风交汇，广受喜爱。\n\n　　孙天舒介绍，依托VR仿真技术、线上云展、直播科普与公益课堂，辽瓷制坯、刻剔、烧窑的完整工序得以数字化呈现。藏于窑厂的古老技艺打破时空限制，正以鲜活的姿态走进大众视野。\n\n　　近年来，兼具古韵与新意的辽瓷作品先后亮相达沃斯论坛、大阪世博会、巴黎卢浮宫国际艺术交流展，多次作为外事国礼走出国门。(完)\n\n 【编辑:惠小东】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9966577577","title":"中国雪乡风景区开园 新增冰雪DIY体验","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734667.shtml","summary":"中新网牡丹江11月19日电 (记者 王琳)19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。","summary_short":"中新网牡丹江11月19日电 (记者 王琳)19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。","digest":"19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客","points":["中新网牡丹江11月19日电 (记者 王琳)19日…","今冬，该景区新增冰雪DIY(Do It Yourself)创作等互动体验","中国雪乡风景区距离哈尔滨200多公里，是“哈亚雪”冰雪旅游精品线路的重要一环"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T15:44:45+08:00","size":1,"keywords":[],"body":"中新网牡丹江11月19日电 (记者 王琳)19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。今冬，该景区新增冰雪DIY(Do It Yourself)创作等互动体验。\n\n　　中国雪乡风景区距离哈尔滨200多公里，是“哈亚雪”冰雪旅游精品线路的重要一环。这里每年10月至次年4月持续降雪，积雪厚度最高可达2米，自然形成层层叠叠的雪蘑菇、雪檐等景观。\n\n19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。图为开园活动现场全景。孙庭义 摄\n\n　　开园当日，雪乡银装素裹，纷飞的雪花为大红灯笼罩上一层白纱。开园仪式现场，高跷、锣鼓、秧歌轮番上演，中外游客从远方赶来，驻足观看民俗展演，在唯美雪景中拍照打卡。\n\n　　新雪季，雪乡围绕游玩业态、夜景氛围、场景设施、服务保障、文体活动等多维度提档升级。在游玩内容方面，全新推出多个互动式、体验式、参与式的冰雪项目，引入雪地龙舟展演特色项目，打造关东冰雪运动IP。\n\n19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。图为高跷民俗表演在雪中精彩上演。孙庭义 摄\n\n　　依托雪源大街河道的天然冰雪资源，雪乡打造自然造物冰雪体验区，结合墙面彩绘与自然雪景，开设雪雕手工课堂。专业人员现场指导，面向亲子家庭、青少年群体开设冰雪DIY创作体验，让静态雪景转化为可触摸、可创作、可互动的动态游玩场景。\n\n　　在灯饰亮化方面，全新建成4200平方米大型花灯观赏区，围绕林海雪原风光、东北民俗文化、新春祈福年味三大主题布设灯组，并增设许愿互动环节。火红灯火与皑皑白雪交相辉映，营造“白天赏雪景、夜晚观灯景”的全天候游览体验。\n\n19日，位于龙江森工大海林林业局有限公司双峰林场的中国雪乡风景区开园迎客。图为鼓手雪中擂鼓助兴。孙庭义 摄\n\n　　此外，雪乡全新打造年轻化、潮流化的网红打卡景观集群，增设主题打卡墙、文艺快闪舞台、东北方言创意景观等新潮点位；针对往年旅游旺季车流集中、通行压力较大的实际情况，实施多项重点基础设施升级工程；将陆续启动14项文体赛事，涵盖文创艺术、体育竞技、数字创作等多个领域。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2c5d2b74b6","title":"天津发布新版重污染天气应对预案 细化差异化管控举措","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734654.shtml","summary":"中新网天津11月19日电 (记者 江莹)18日，天津市生态环境局召开新闻发布会，解读新版《天津市重污染天气应对预案》。","summary_short":"中新网天津11月19日电 (记者 江莹)18日，天津市生态环境局召开新闻发布会，解读新版《天津市重污染天气应对预案》。","digest":"18日，天津市生态环境局召开新闻发布会，解读新版《天津市重污染天气应对预案》","points":["中新网天津11月19日电 (记者 江莹)18日，天津市生态环境局召开新闻发布会…","该预案于11月6日正式印发实施，旨在进一步提升重污染天气应对工作的科学性、规范性与有效性","数据显示，2026年1至10月，天津全市PM2.5浓度为34.4微克/立方米…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T15:30:14+08:00","size":1,"keywords":[],"body":"中新网天津11月19日电 (记者 江莹)18日，天津市生态环境局召开新闻发布会，解读新版《天津市重污染天气应对预案》。该预案于11月6日正式印发实施，旨在进一步提升重污染天气应对工作的科学性、规范性与有效性。\n\n图为新闻发布会现场。(天津市生态环境局供图)\n\n　　近年来，天津大气污染治理成效持续显现，民众蓝天获得感稳步提升。数据显示，2026年1至10月，天津全市PM2.5浓度为34.4微克/立方米，优良天数比例达69.4%。与此同时，空气质量改善基础仍不稳固，秋冬季受静稳、高湿、逆温等不利气象及区域传输叠加影响，重污染天气仍存在发生风险。\n\n　　此次预案修订严格对标《中华人民共和国生态环境法典》、天津市突发事件总体应急预案相关技术指南，结合本地污染应对实际制定，全文共包含总则、组织指挥、运行机制等七个板块，构建起系统化的重污染天气应对处置体系。\n\n　　预案优化了减排清单管理模式，将原有应对减排清单统一划分为“措施类”和“豁免类”两大类别，每年9月底进行调整，3月、6月、12月底动态更新，审核流程更为清晰、日常管理更加规范。\n\n　　在差异化精准管控方面，针对固定源，依据企业环境绩效水平分级落实减排举措；针对移动源，按企业绩效等级、预警级别，分类管控载货车辆、非道路移动机械使用，对国三及以下非道路移动机械实施区域差异化管控。施工扬尘管控方面，明确预警期间停止土石方、建筑拆除、喷涂、现场搅拌等作业，同步落实砂石料厂露天作业、露天烧烤等场景管控要求。\n\n　　此外，预案完善区域联防联控机制，依托国家生态环境部门区域性预警提示，开展区域重污染天气联防联控；结合京津冀空气质量会商意见，开展区域协同防控，统筹推进轻中度污染天气应对工作。\n\n　　下一步，天津将加密空气质量动态会商研判，精准把握污染变化态势，严格依照新版预案规范发布预警、启动应对响应，持续筑牢秋冬季大气污染防治防线。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9c3f2249bf","title":"从一条巷子读懂“和合”——“何以中国·和合礼让”采访团桐城行侧记","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734655.shtml","summary":"11月17日下午，“何以中国·和合礼让”主题采访团走进桐城，先后探访六尺巷、桐城历史文化展陈馆，并深入文昌街道六尺巷社区“德邻社”、西苑社区“红色港湾”调研。","summary_short":"11月17日下午，“何以中国·和合礼让”主题采访团走进桐城，先后探访六尺巷、桐城历史文化展陈馆…","digest":"11月17日下午，“何以中国·和合礼让”主题采访团走进桐城，先后探访六尺巷…","points":["11月17日下午，“何以中国·和合礼让”主题采访团走进桐城，先后探访六尺巷…","一条古巷、一座展陈馆、两个基层社区，四个点位串联起“和合”文化在当代的生动实践","六尺巷坐落于桐城市胜利街历史文化街区，全长约100米、宽2米，路面以鹅卵石铺就…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T15:27:18+08:00","size":1,"keywords":[],"body":"11月17日下午，“何以中国·和合礼让”主题采访团走进桐城，先后探访六尺巷、桐城历史文化展陈馆，并深入文昌街道六尺巷社区“德邻社”、西苑社区“红色港湾”调研。一条古巷、一座展陈馆、两个基层社区，四个点位串联起“和合”文化在当代的生动实践。\r\n\n　　一条巷子，一个“让”字\n\n　　六尺巷坐落于桐城市胜利街历史文化街区，全长约100米、宽2米，路面以鹅卵石铺就，形成于清康熙年间。据《旧闻随笔》《桐城县志略》等史料记载，清代文华殿大学士张英的家人与邻居吴氏因宅旁空地权属发生争议，张英收到家书后赋诗一首：“一纸书来只为墙，让他三尺又何妨。长城万里今犹在，不见当年秦始皇。”张家见信后主动退让三尺，吴家为其义举所感，亦退让三尺，六尺之巷由此形成。巷东牌坊镌刻“礼让”二字，巷西牌坊镌刻“懿德流芳”四字。一个“让”字，既彰显了中华民族“和为贵”的传统美德，也为当代基层治理提供了深厚的文化滋养。\n\n　　一个阵地，让文化浸润有落脚点\n\n　　“六尺巷工作法”的源头，便始于这条全长不足百米的街巷。桐城市文昌街道六尺巷社区原党总支书记张耘表示，社区是践行该工作法的“实验田”。文化传播不应仅局限于巷内面向游客讲解，更需要打造居民抬脚可及、入内即可落座的公共空间——“六尺巷·德邻社”党群服务站，正是承载这一功能的核心阵地。“德邻”二字取自《论语》中的“德不孤，必有邻”；服务站设置“巷里生活、巷礼和谐、巷你奉献”三大空间，集学习教育、党群议事、便民服务、矛盾化解功能于一体。依托这一阵地，“六尺巷小课堂”围绕《聪训斋语》《澄怀园语》开展本土家风主题宣讲，张耘带头讲授“父子宰相家训”；社区剧社自主编排快板、黄梅小戏定期展演，义诊、普法、非遗课程等便民服务常年开展。张耘表示，这些活动看似是日常文娱，实则是为了让不同楼栋的居民在同一空间共处一两个小时。彼此熟识后，即便日后出现小的摩擦，也便于沟通协调。\n\n　　一套机制，让服务“未诉先办”\n\n　　金神镇与范岗镇杨安村也同步展现了“六事六办”的实践成果。桐城市将六尺巷工作法拓展为“干部问事主动办、网格梳事及时办、党群议事协商办、能人理事协同办、提级解事聚力办、全民治事齐心办”的工作体系，推动服务群众模式从“被动接诉”向“未诉先办”转变。金神镇以“干部问事主动办”为先导，将民情日记与就业服务相结合，实现从“群众上门”到“干部问事”的转变：建立涵盖2.9万余名技能型劳动力的台账，归集岗位需求700余个；春节期间组织50余家企业开展招聘活动，达成就业意向约640人次。范岗镇杨安村则将直播间打造为“民情传感器”：自2025年12月开播以来，线上观看人次突破30万，化解群众诉求17件；有村民反映弯道植被遮挡视线，村干部下播后立即赶赴现场，当日完成清理工作。\n\n　　从一条巷子到一部法规\n\n　　基层治理的“最后一公里”落在社区。采访团一行最后走进西苑社区“红色港湾”。这个老城区社区下辖29个小区，有居民6977人，社区两委及网格员共12人，注册志愿者753人。西苑社区坚持党建引领，积极探索“苑景社”党建工作品牌，通过激活“微网格”、畅通“微信用”、搭建“微联盟”、做实“微服务”，着力构建小事不出网格、大事不出社区、人人参与的居民自治新格局。2021年改建、新建的红色港湾推行“红色课堂+实践课堂”模式，设置党员先锋岗，将党员置于矛盾调解、文明创建一线。\n\n　　从社区到全市，一条巷子的经验正在升华为一座城市的治理制度。2026年10月17日，《安徽省人民代表大会常务委员会关于用好“六尺巷工作法”提升基层社会治理效能的决定》正式施行。桐城全市300余处六尺巷调解室统一推行“听、辨、劝、借、让、和”六步调解流程，1301个网格按“1+3+N”标准配强工作力量，今年以来已协商处置各类事项997件。截至目前，“六尺巷工作法”已获评全国新时代“枫桥经验”先进典型。\n\n　　文韵与治道交融之处，五千多年的思想长河奔涌着治世济民的润泽活水，书写着社会治理现代化的时代篇章。从“让他三尺”到“未诉先办”，礼让不再局限于道德劝谕，更转化为可落地、可执行的治理程序。这或许正是“何以中国”的基层注脚：文化根脉扎得越深，治理的枝叶就越繁茂。(文/图 李佳俊) 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"ceee4679924","title":"鹄影蹁跹引客来 新疆“赏天鹅季”催热冬季文旅","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734633.shtml","summary":"中新社乌鲁木齐11月19日电 (苟继鹏 陈莹)初冬时节，成批天鹅飞抵天山南北，新疆玛纳斯县、伊宁县、库尔勒市等地进入“赏天鹅季”，以天鹅为主题的亲子研学、生态观光等文旅项目热度攀升…","summary_short":"中新社乌鲁木齐11月19日电 (苟继鹏 陈莹)初冬时节，成批天鹅飞抵天山南北，新疆玛纳斯县、伊宁县…","digest":"初冬时节，成批天鹅飞抵天山南北，新疆玛纳斯县、伊宁县、库尔勒市等地进入“赏天鹅季”…","points":["中新社乌鲁木齐11月19日电 (苟继鹏 陈莹)初冬时节，成批天鹅飞抵天山南北，新疆玛纳斯县…","近日走进伊宁县夏合勒克塔木村天鹅泉景区，水面薄雾轻笼，天鹅踏水起舞","观景台上，不少孩子在家长陪同下对着天鹅写生"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T15:16:17+08:00","size":1,"keywords":[],"body":"中新社乌鲁木齐11月19日电 (苟继鹏 陈莹)初冬时节，成批天鹅飞抵天山南北，新疆玛纳斯县、伊宁县、库尔勒市等地进入“赏天鹅季”，以天鹅为主题的亲子研学、生态观光等文旅项目热度攀升，成为新疆冬季旅游的新名片。\n\n　　记者近日走进伊宁县夏合勒克塔木村天鹅泉景区，水面薄雾轻笼，天鹅踏水起舞。观景台上，不少孩子在家长陪同下对着天鹅写生。“以前来只是看风景，这次我把它们画下来，回家贴在墙上。”当地学生马新玥说，天鹅不仅是来村里过冬的客人，也是朋友。\n\n11月17日，学生在伊宁县夏合勒克塔木村天鹅泉景区写生画天鹅。陈莹 摄\n\n　　“20世纪90年代起，每年都有天鹅来村里越冬。为了保护天鹅，方便游客观赏，当地政府部门投资建设天鹅泉景区，每年这个时候就热闹起来了。”夏合勒克塔木村党支部书记段耀军19日说。\n\n　　2025年底，夏合勒克塔木村建成伊犁河谷首个天鹅主题科普研学阵地。“该中心集生态科普、研学实践、文化体验于一体，方便更多研学学生和游客了解天鹅。”伊宁县文化体育广播电视和旅游局党组成员郝振阳表示，近些年伊宁县持续打造天鹅文旅品牌，带动当地民众增收。\n\n　　天山北麓的玛纳斯国家湿地公园，近日迎来首批越冬天鹅，30余只天鹅多以家庭为单位，在浅水间游弋觅食。“预计明年1月份左右，来此越冬的天鹅有千余只。”玛纳斯国家湿地公园管理局局长张建坤说，工作人员将加大巡护力度，守护天鹅平安越冬。\n\n　　眼下，库尔勒市杜鹃河和孔雀河的越冬天鹅已超过450只，正值最佳观赏季。每到周末，游客数量超5000人次。“早就听说库尔勒市是‘天鹅之城’，果然名不虚传，能看到这么多天鹅，太美了。”来自喀什市的游客古丽扎努尔·买买提明19日受访时说。\n\n　　为守护天鹅越冬，库尔勒市园林绿化事务中心还成立了天鹅中队。队长吐尔逊·艾买提说，目前工作人员每日投喂两次天鹅，预计元旦前后越冬天鹅将迎来高峰，投喂量也将增加。\n\n　　“自2006年起，天鹅已连续20年到库尔勒市越冬，天鹅数量逐年增多，是当地生态环境持续改善的印证。”吐尔逊·艾买提说。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1107d195c7","title":"大熊猫“林阳”因病救治无效死亡 时年25岁","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734631.shtml","summary":"中新网成都11月19日电 (记者 安源)中国大熊猫保护研究中心19日发布信息：大熊猫“林阳”2026年9月20日因病救治无效在都江堰基地死亡，时年25岁。","summary_short":"中新网成都11月19日电 (记者 安源)中国大熊猫保护研究中心19日发布信息：大熊猫“林阳”2026年9月20日因病救治…","digest":"中国大熊猫保护研究中心19日发布信息：大熊猫“林阳”2026年9月20日因病救治无效…","points":["中新网成都11月19日电 (记者 安源)中国大熊猫保护研究中心19日发布信息…","“林阳”，雄性，谱系号538，2001年9月28日出生于卧龙核桃坪基地","“林阳”既往罹患食管肿瘤、尿路梗阻(尿闭)继发急性肾损伤/急性肾衰竭、毛根鞘癌等多系统疾病…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T15:03:44+08:00","size":1,"keywords":[],"body":"中新网成都11月19日电 (记者 安源)中国大熊猫保护研究中心19日发布信息：大熊猫“林阳”2026年9月20日因病救治无效在都江堰基地死亡，时年25岁。“林阳”，雄性，谱系号538，2001年9月28日出生于卧龙核桃坪基地。\n\n　　“林阳”既往罹患食管肿瘤、尿路梗阻(尿闭)继发急性肾损伤/急性肾衰竭、毛根鞘癌等多系统疾病，并长期存在骨质疏松及多发性骨折。自7月起，其肛周及皮肤先后出现大小不等的增生物；多次复查血钙持续显著低于正常参考范围，提示重度低钙血症。虽经反复调整治疗及管理方案，病情仍未获根本性改善。9月10日以来，“林阳”陆续出现食欲急剧下降、突发吼叫、后肢僵直无力、拒食、抽搐等症状。经全力抢救，依然于9月20日18时25分死亡。(完)\n\n 【编辑:于晓】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cd55d6ee9f6","title":"吉林市迎今冬最大降雪 校园上演趣味雪课","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734630.shtml","summary":"中新网吉林11月19日电 (记者 石洪宇)19日，吉林省吉林市城区迎来入冬以来最大规模降雪。","summary_short":"中新网吉林11月19日电 (记者 石洪宇)19日，吉林省吉林市城区迎来入冬以来最大规模降雪。","digest":"19日，吉林省吉林市城区迎来入冬以来最大规模降雪","points":["中新网吉林11月19日电 (记者 石洪宇)19日，吉林省吉林市城区迎来入冬以来最大规模降雪","降雪过后，当地校园组织学生开展雪地足球、冰蛋制作、雪地持球接力等活动…","长春2027第33届世界大学生冬季运动会将于2027年1月15日至25日在长春市、吉林市举办"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T15:02:02+08:00","size":1,"keywords":[],"body":"中新网吉林11月19日电 (记者 石洪宇)19日，吉林省吉林市城区迎来入冬以来最大规模降雪。降雪过后，当地校园组织学生开展雪地足球、冰蛋制作、雪地持球接力等活动，让学生在冰雪天气里感受冬季运动的乐趣。\n\n　　长春2027第33届世界大学生冬季运动会将于2027年1月15日至25日在长春市、吉林市举办。吉林市作为分赛区，将承办高山滑雪、自由式滑雪等雪上项目赛事。随着新雪季开启，吉林市部分滑雪场陆续对外营业，赛事氛围持续升温，冰雪热潮也走进校园。\n\n　　当天，吉林市丰满区东山实验小学校的操场银装素裹，白雪铺成天然运动场，学生们奔跑嬉戏，欢呼声伴着落雪此起彼伏。\n\n吉林市丰满区东山实验小学校上演趣味雪课。　石洪宇 摄\n\n　　雪地足球场上，小球员们带球、传球、射门，在雪地上留下串串脚印。雪地持球接力项目中，孩子们抱球穿梭，配合默契。学生们制作出带色彩装饰的“冰蛋”，为校园增添冬日趣味。\n\n　　东山实验小学校党支部书记李雪松介绍，这类活动既丰富学生冬季校园生活，也让孩子们在冰雪运动中感受家乡冬日特色，为即将举办的长春大冬会营造浓厚的校园氛围。“孩子们在雪地里跑一跑、闹一闹，亲身感受远比课堂讲解更加直观。”李雪松说。\n\n　　根据部署，吉林市义务教育阶段学校将于12月初错峰放雪假。雪假期间，当地义务教育阶段学生可享受免费滑雪、滑冰体验及A级景区游览等优惠政策。校园冰雪活动将与雪假安排有序衔接。(完)\n\n 【编辑:刘阳禾】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":82,"items":[{"id":"c820d52f160","title":"新一批领航级智能工厂培育名单公布","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734778.shtml","summary":"中新网南京11月19日电(记者 朱晓颖)19日，工业和信息化部等六部门公布了第二批34家领航级智能工厂培育名单，中兴通讯(南京)有限责任公司、南通中远海运川崎工程有限公司等企业入选。","summary_short":"中新网南京11月19日电(记者 朱晓颖)19日，工业和信息化部等六部门公布了第二批34家领航级智能工厂培育名单…","digest":"19日，工业和信息化部等六部门公布了第二批34家领航级智能工厂培育名单…","points":["中新网南京11月19日电(记者 朱晓颖)19日，工业和信息化部等六部门公布了第二批34家领航…","同一天在南京举办的2026世界智能制造大会上，这34家企业负责人集体登台亮相…","从第二批34家领航级智能工厂培育名单的区域分布来看，覆盖了中国东北、西北、西南、中部…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:09+08:00","size":1,"keywords":[],"body":"中新网南京11月19日电(记者 朱晓颖)19日，工业和信息化部等六部门公布了第二批34家领航级智能工厂培育名单，中兴通讯(南京)有限责任公司、南通中远海运川崎工程有限公司等企业入选。同一天在南京举办的2026世界智能制造大会上，这34家企业负责人集体登台亮相，领航工厂培育行动发布。\n\n11月19日，2026世界智能制造大会在南京开幕。中新网记者 朱晓颖 摄\n\n　　从第二批34家领航级智能工厂培育名单的区域分布来看，覆盖了中国东北、西北、西南、中部、东部地区；从行业分布看，在装备制造、钢铁、电子信息等领域外，消费品领域医药、服装等行业的企业首次入选，覆盖范围从大国重器延伸至民生行业。\n\n　　作为中国智能工厂梯度培育体系的最高层级，领航工厂肩负着推动新一代智能制造发展的重要历史使命。数据显示，第二批领航工厂全员劳动生产率平均提升34.4%，生产效率平均提升19.3%。领航工厂的产业链带动作用也在持续凸显，这34家工厂已累计带动近4000家企业协同开展数字化、智能化升级。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cac3774eca7","title":"欧莱雅拟拿下阿玛尼10%股份，LVMH退出谈判","url":"https://www.jiemian.com/article/15351500.html","summary":"11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高级别会谈。","summary_short":"11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高级别会谈。","digest":"11月19日，据财联社报道…","points":["11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高…","欧莱雅或将牵头一个投资者联合体，收购阿玛尼合计15%的股权","其中，欧莱雅拟收购约10%，长期生产阿玛尼眼镜的依视路陆逊梯卡最多收购5%"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:38:57+08:00","size":1,"keywords":[],"body":"11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高级别会谈。欧莱雅或将牵头一个投资者联合体，收购阿玛尼合计15%的股权。其中，欧莱雅拟收购约10%，长期生产阿玛尼眼镜的依视路陆逊梯卡最多收购5%。若交易达成，两名新股东将为阿玛尼家族与基金会提供产业支持，未来阿玛尼家族若出让控股权或推动上市，欧莱雅与依视路陆逊梯卡也有望获得财务回报。\n\n本次交易标的阿玛尼15%股权是品牌创始人乔治·阿玛尼在遗嘱中定下的安排。2025年9月4日，乔治·阿玛尼在米兰逝世，享年91岁，终身未婚无子，这一年恰逢其1975年创立的品牌满50周年；他早在2016年便设立乔治·阿玛尼基金会为传承做准备。\n\n他在遗嘱中规定，继承人应在其去世后的12至18个月内出售公司约15%的股份，后续可再处置30%至54.9%的股份，或是选择推动公司挂牌上市。遗嘱中将LVMH、欧莱雅和依视路陆逊梯卡列为优先买家，这三家企业均与阿玛尼有着长期的授权合作关系。\n\n而遗嘱列明的三家潜在合作方中，LVMH已退出竞争；阿尔诺家族旗下的这家法国奢侈品巨头自有香氛与眼镜业务，恰好和欧莱雅、依视路陆逊梯卡的核心业务形成直接竞争。本次阿玛尼股权调整的目标时间点为2027年3月，这也是乔治・阿玛尼规定出让15%股权的18个月期限截止日。\n\n乔治·阿玛尼还在遗嘱规定，三家均未获选时，可出售给同等地位的其他集团，但须经长期合作伙伴潘塔莱奥·德洛尔科同意，并优先考虑现有商业合作伙伴。无论走哪条路，乔治・阿玛尼基金会都须保留至少30.1%的股份。阿玛尼集团首席执行官朱塞佩·马尔索奇（Giuseppe Marsocci）今年10月22日在武汉SKP与WWD联合举办的峰会上重申，基金会将始终持有公司至少30%的股份，创始人留下的九条创始原则由基金会守护。\n\n欧莱雅与阿玛尼的合作渊源深厚。自1988年起，欧莱雅一直是阿玛尼香水和美妆的授权经营方，双方目前的合作协议已续约至2050年。汇丰银行分析师在报告中指出，阿玛尼的美妆授权许可2024年或创造了15亿欧元的营收，占欧莱雅高档化妆品事业部营收的10%，占集团总营收的3.45%。通过入股，欧莱雅有望巩固这一长达38年的合作关系。\n\n依视路陆逊梯卡与阿玛尼的合作同样始于1988年，负责生产阿玛尼品牌眼镜；2018年陆逊梯卡与依视路合并后，双方于2023年1月续签了15年，协议有效期延长至2038年。值得一提的是，乔治·阿玛尼生前持有依视路陆逊梯卡近2%股份，陆逊梯卡创始人德尔·维奇奥与他亦有长久私交。\n\n从阿玛尼的业绩表现来看，2025年是创始人离世后的首个完整财年。财报显示，阿玛尼集团2025年合并净营收同比下滑4.6%至21.9亿欧元，按固定汇率计算下滑约2.8%。其中零售渠道贡献11.9亿欧元，批发渠道营收7.537亿欧元，授权特许权营收2.243亿欧元。若包含授权业务，集团总营收规模达40亿欧元，面向终端消费者的商品销售总额超60亿欧元。\n\n尽管营收下滑，阿玛尼的盈利能力仍保持相对稳定。2025年息税折旧摊销前利润（EBITDA）同比增长3.2%至1.527亿欧元，营业利润增长2%至5260万欧元。截至2025年底，阿玛尼集团净现金头寸为5.29亿欧元，包含财务投资在内的净现金头寸为5.96亿欧元。此外，阿玛尼手握约5亿欧元现金储备，创始人一直依靠这笔资金保障品牌独立性。\n\n阿玛尼集团CEO马尔索奇在业绩声明中表示，消费者对奢侈品的消费方式正发生可能具有结构性的变化，品牌必须主动适应；集团同时披露，2026年前几个月业务延续上年趋势，亚洲市场尤其中国与日本活力显著提升。\n\n未经正式授权严禁转载本文，侵权必究。欧莱雅\n4k\n\n欧莱雅用“首发”与“共创”重写在华增长逻辑8天前\n欧莱雅与进博会的九年双向奔赴8天前\n\n时尚商业说\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n欧莱雅\n欧莱雅拟拿下阿玛尼10%股份，LVMH退出谈判\n\n乔治·阿玛尼在遗嘱中规定，继承人应在其去世后的12至18个月内出售公司约15%的股份。\n\n原创新闻李科峰 · 2026/11/19 17:38来源：界面新闻\n\n图片来源：视觉中国\n\n11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高级别会谈。欧莱雅或将牵头一个投资者联合体，收购阿玛尼合计15%的股权。其中，欧莱雅拟收购约10%，长期生产阿玛尼眼镜的依视路陆逊梯卡最多收购5%。若交易达成，两名新股东将为阿玛尼家族与基金会提供产业支持，未来阿玛尼家族若出让控股权或推动上市，欧莱雅与依视路陆逊梯卡也有望获得财务回报。\n\n本次交易标的阿玛尼15%股权是品牌创始人乔治·阿玛尼在遗嘱中定下的安排。2025年9月4日，乔治·阿玛尼在米兰逝世，享年91岁，终身未婚无子，这一年恰逢其1975年创立的品牌满50周年；他早在2016年便设立乔治·阿玛尼基金会为传承做准备。\n\n他在遗嘱中规定，继承人应在其去世后的12至18个月内出售公司约15%的股份，后续可再处置30%至54.9%的股份，或是选择推动公司挂牌上市。遗嘱中将LVMH、欧莱雅和依视路陆逊梯卡列为优先买家，这三家企业均与阿玛尼有着长期的授权合作关系。\n\n而遗嘱列明的三家潜在合作方中，LVMH已退出竞争；阿尔诺家族旗下的这家法国奢侈品巨头自有香氛与眼镜业务，恰好和欧莱雅、依视路陆逊梯卡的核心业务形成直接竞争。本次阿玛尼股权调整的目标时间点为2027年3月，这也是乔治・阿玛尼规定出让15%股权的18个月期限截止日。\n\n乔治·阿玛尼还在遗嘱规定，三家均未获选时，可出售给同等地位的其他集团，但须经长期合作伙伴潘塔莱奥·德洛尔科同意，并优先考虑现有商业合作伙伴。无论走哪条路，乔治・阿玛尼基金会都须保留至少30.1%的股份。阿玛尼集团首席执行官朱塞佩·马尔索奇（Giuseppe Marsocci）今年10月22日在武汉SKP与WWD联合举办的峰会上重申，基金会将始终持有公司至少30%的股份，创始人留下的九条创始原则由基金会守护。\n\n欧莱雅与阿玛尼的合作渊源深厚。自1988年起，欧莱雅一直是阿玛尼香水和美妆的授权经营方，双方目前的合作协议已续约至2050年。汇丰银行分析师在报告中指出，阿玛尼的美妆授权许可2024年或创造了15亿欧元的营收，占欧莱雅高档化妆品事业部营收的10%，占集团总营收的3.45%。通过入股，欧莱雅有望巩固这一长达38年的合作关系。\n\n依视路陆逊梯卡与阿玛尼的合作同样始于1988年，负责生产阿玛尼品牌眼镜；2018年陆逊梯卡与依视路合并后，双方于2023年1月续签了15年，协议有效期延长至2038年。值得一提的是，乔治·阿玛尼生前持有依视路陆逊梯卡近2%股份，陆逊梯卡创始人德尔·维奇奥与他亦有长久私交。\n\n从阿玛尼的业绩表现来看，2025年是创始人离世后的首个完整财年。财报显示，阿玛尼集团2025年合并净营收同比下滑4.6%至21.9亿欧元，按固定汇率计算下滑约2.8%。其中零售渠道贡献11.9亿欧元，批发渠道营收7.537亿欧元，授权特许权营收2.243亿欧元。若包含授权业务，集团总营收规模达40亿欧元，面向终端消费者的商品销售总额超60亿欧元。\n\n尽管营收下滑，阿玛尼的盈利能力仍保持相对稳定。2025年息税折旧摊销前利润（EBITDA）同比增长3.2%至1.527亿欧元，营业利润增长2%至5260万欧元。截至2025年底，阿玛尼集团净现金头寸为5.29亿欧元，包含财务投资在内的净现金头寸为5.96亿欧元。此外，阿玛尼手握约5亿欧元现金储备，创始人一直依靠这笔资金保障品牌独立性。\n\n阿玛尼集团CEO马尔索奇在业绩声明中表示，消费者对奢侈品的消费方式正发生可能具有结构性的变化，品牌必须主动适应；集团同时披露，2026年前几个月业务延续上年趋势，亚洲市场
