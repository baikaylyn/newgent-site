1,"keywords":[],"body":"中新网景德镇11月19日电 (记者 姜涛)19日，景德镇中国陶瓷博物馆内游人如织。站在元青花缠枝牡丹纹梅瓶前，来自巴基斯坦的江西农业大学教授马文(TARIQ ALI)满眼好奇与兴奋。在中国生活了17年的他第一次来到景德镇，用流利的中文与讲解员交流，不时举起手机拍照。\n\n11月19日，江西农业大学教授马文(TARIQ　ALI)在景德镇中国陶瓷博物馆内参观。潘旭 摄\n\n　　2026年7月，“景德镇手工瓷业遗存”成功列入《世界遗产名录》，成为中国第61项世界遗产，也填补了该名录中以“瓷”为主题遗产的空白。\n\n　　连日来，近20位来自人工智能、科技、教育等领域的高层次海外人才走进景德镇，先后探访陶阳里历史文化街区、景德镇国际陶瓷博览交易中心、中国陶瓷博物馆以及湖田窑遗址等地，沉浸式体验中国陶瓷文化与世界遗产底蕴。\n\n　　位于浮梁县的瑶里古镇，古称“窑里”，也是历史悠久的茶乡。老窑址周边茶园里一派忙碌景象，游客沉浸式品茶。作为农业经济专家，马文的视角与旁人不同。在他看来，瓷与茶不是陈列品，而是仍在运转的产业。“这种‘让历史留在生活里、让传统继续产生价值’的机制，创造出了新的时代活力，也是一种可资借鉴的样本。”\n\n　　在景德镇国际陶瓷博览城研学体验中心，南昌大学新闻与传播学院博士后Hamza Amir告诉记者，此前在短视频平台看到陶瓷匠人巧手塑泥，感觉很惊艳。“今天试着自己拉坯，太难了但很有趣。景德镇是一个‘活着的实验室’。”在他看来，这种“活态”本身就是历史与现代最自然的共生方式，值得所有热爱文化的人来实地感受。\n\n　　“景德镇老匠人凭经验将火候、泥土与水分控制到极致，这为人工智能模拟人类创造力提供了灵感。”加拿大籍人工智能专家李明楚，从制瓷技艺中读出了“历史与现代共生”的另一种解法。他建议景德镇建立“AI+陶瓷”联合实验室，把老匠人的经验数据化、把古瓷基因结构化，让机器不仅“看懂”瓷器，还能理解背后的文化逻辑。\n\n　　参观结束时，马文在中国陶瓷博物馆文创区挑了几件青花瓷元素的文创产品。他拿起一只青花咖啡杯，用指尖划过釉面，上面既有传统纹样，也有现代设计。“回去送给外地的朋友，告诉他们一定要来一趟景德镇。”(完)\n\n 【编辑:张子怡】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c9163316a64","title":"福建省入渝推介文旅资源 签约5.9亿元文旅项目深化合作","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734748.shtml","summary":"中新网重庆11月19日电 (记者 钟旖)19日，为推动闽渝两地资源共享、客源互通、产业对接、资本赋能，2026“清新福建”文旅经济发展推介暨招商活动在重庆举行。","summary_short":"中新网重庆11月19日电 (记者 钟旖)19日，为推动闽渝两地资源共享、客源互通、产业对接、资本赋能…","digest":"19日，为推动闽渝两地资源共享、客源互通、产业对接、资本赋能…","points":["中新网重庆11月19日电 (记者 钟旖)19日，为推动闽渝两地资源共享、客源互通、产业对接…","现场，闽渝两地围绕康养旅居开发、农文旅融合、研学基地提质、航线客源互送…","当前，福建立足“十五五”发展新起点，全力推进更高水平文化强省和世界知名旅游目的地建设…"],"section":"民生","category":"","source":"chinanews_society","source_display":"中新網 社會","published_at":"2026-11-19T18:01:44+08:00","size":1,"keywords":[],"body":"中新网重庆11月19日电 (记者 钟旖)19日，为推动闽渝两地资源共享、客源互通、产业对接、资本赋能，2026“清新福建”文旅经济发展推介暨招商活动在重庆举行。\n\n　　现场，闽渝两地围绕康养旅居开发、农文旅融合、研学基地提质、航线客源互送、产业链协同运营等重点领域，签约一批代表性项目，总投资达5.9亿元，涵盖项目共建、品牌联营、客源互送等合作模式，推动闽渝文旅合作从“亮家底”走向“谋共赢”。\n\n图为闽渝两地签约一批代表性项目。活动主办方 供图\n\n　　福建省文化和旅游厅副厅长陈训明在推介时表示，闽渝江海相连、山海相依，“清新福建”与重庆城市文旅品牌各具优势、互补性强，合作前景广阔。当前，福建立足“十五五”发展新起点，全力推进更高水平文化强省和世界知名旅游目的地建设，加快培育文旅支柱产业，文旅经济呈现稳中有进、提质增效的良好态势。\n\n　　陈训明说，重庆坐拥现象级城市IP、夜间经济流量转化、文旅数字治理等领先优势，福建拥有世遗集群、滨海生态、山海资源和对外交流渠道，两地合作贵在取长补短、双向赋能，重在要素互通、内容共创，把握文旅消费从“一张门票”迭代升级为“一段生活”的共同机遇，携手推动文旅融合由“有”向“好”、由“好”向“美”持续迈进。\n\n图为2026“清新福建”文旅经济发展推介暨招商活动现场。活动主办方 供图\n\n　　据悉，作为“清新福建”全国接力推介由沿海向内陆纵深拓展的重要一站，此次活动将推动闽渝文旅由短期互游迈向产业共兴、品牌共建、市场共拓的深度融合，把资源优势、文化优势持续转化为产业优势、发展胜势。\n\n　　会后，福建推介团还深入重庆重点文旅标杆项目实地调研，学习夜间经济打造、文旅数字治理、工业研学旅游、温泉康养专业化运营等成熟经验。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"財經","total":64,"items":[{"id":"c97380a66db","title":"国际航协官员：中国可持续航空燃料产能建设令人鼓舞","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734894.shtml","summary":"中新网土耳其安塔利亚11月19日电 (记者 魏园 陈溯)11月9日至20日，《联合国气候变化框架公约》第三十一次缔约方大会(COP31)在土耳其安塔利亚举行。","summary_short":"中新网土耳其安塔利亚11月19日电 (记者 魏园 陈溯)11月9日至20日…","digest":"11月9日至20日…","points":["中新网土耳其安塔利亚11月19日电 (记者 魏园 陈溯)11月9日至20日…","国际航空运输协会(IATA)气候政策助理经理阿比吉特·安贝里·普雷马南德在COP31中国角主…","普雷马南德表示，据IATA测算，到2050年航空业所需减排量的65%将由可持续航空燃料承担…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:47:15+08:00","size":1,"keywords":[],"body":"中新网土耳其安塔利亚11月19日电 (记者 魏园 陈溯)11月9日至20日，《联合国气候变化框架公约》第三十一次缔约方大会(COP31)在土耳其安塔利亚举行。国际航空运输协会(IATA)气候政策助理经理阿比吉特·安贝里·普雷马南德在COP31中国角主题边会上表示，中国可持续航空燃料产能建设令人鼓舞。\n\nCOP31期间，国际航空运输协会(IATA)气候政策助理经理阿比吉特·安贝里·普雷马南德在中国角主题边会上发言。记者 魏园 摄\n\n　　普雷马南德表示，据IATA测算，到2050年航空业所需减排量的65%将由可持续航空燃料承担，新一代推进技术贡献约13%，运行效率改进约3%，其余依靠抵消与碳捕集，这一贡献幅度仍存在不确定性。\n\n　　他介绍，2026年全球SAF(Sustainable Aviation Fuel，可持续航空燃料)产量预计约240万吨，仅占航空燃料总用量的0.8%；到2050年航空业需要约5亿吨SAF。目前中国和亚太地区聚集了相当数量产能，但整体供需不均，希望这一状况在2026年缓解。\n\n　　“中国在提升SAF自产能力方面所做的大量工作，让我深受鼓舞。”他提到，中国政府部门关于以全供应链方式统筹解决SAF问题的表态，令他印象深刻。\n\n　　他强调，各国需要在实施强制性要求之前，先通过生产激励与投资框架提供确定性、降低风险，并兼顾生产供应端与航空公司等终端用户的需求。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6820a5d4d1","title":"联合国工发组织副总干事：中国推进绿氢等经验可向全球南方推广","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734888.shtml","summary":"中新网土耳其安塔利亚11月19日电 (记者 魏园 陈溯)《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。","summary_short":"中新网土耳其安塔利亚11月19日电 (记者 魏园 陈溯)《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在…","digest":"《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行","points":["中新网土耳其安塔利亚11月19日电 (记者 魏园 陈溯)《联合国气候变化框架公约》第三十一次…","COP31期间，联合国工业发展组织副总干事兼技术合作和可持续工业发展总司执行干事邹刺勇在中国…","绿色燃料在难减排行业尤为重要，要释放其全部潜力，需要从试点转向大规模、系统性的工业部署"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:45:41+08:00","size":1,"keywords":[],"body":"中新网土耳其安塔利亚11月19日电 (记者 魏园 陈溯)《联合国气候变化框架公约》第三十一次缔约方大会(COP31)正在土耳其安塔利亚举行。联合国工业发展组织副总干事兼技术合作和可持续工业发展总司执行干事邹刺勇在大会期间表示，工发组织正与中国携手推进绿氢、绿色航运等合作项目，把可再生能源制氢与难减排行业的绿色燃料需求直接连接，相关项目经验可向全球南方推广。\n\nCOP31期间，联合国工业发展组织副总干事兼技术合作和可持续工业发展总司执行干事邹刺勇在中国角主题边会上发言。记者 魏园 摄\n\n　　邹刺勇表示，当前国际社会在气候承诺与实际行动之间仍存在差距，工业必须为气候行动提供产业解决方案。重工业和交通领域脱碳已不再只是环境要求，而是绿色投资的基石。绿色燃料在难减排行业尤为重要，要释放其全部潜力，需要从试点转向大规模、系统性的工业部署。\n\n　　他认为，打通供需两端需要协调一致的政策、统一的技术和碳标准、可靠的基础设施和稳健的跨境供应链。在燃料电池交通和氢能交通领域，车辆部署、加氢网络和绿色燃料供应必须协同扩展。\n\n　　邹刺勇介绍，工发组织与中国工业和信息化部、国际氢能燃料电池协会合作实施全球环境基金支持的绿氢项目，将可再生能源制氢与重工业绿色燃料需求直接连接，同时推进新能源汽车和储氢技术方案；工发组织还与中国交通运输部合作开展航运绿色转型示范项目，支持中国政府完善政策环境与标准、示范领先技术。\n\n　　他表示，这两个项目的经验可供分享，支持成功方案向更广范围推广，助力全球南方国家。合作旨在应对全球工业挑战、支持公正转型，确保不让任何人掉队。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cccf9cd1ac5","title":"内蒙古电力（集团）有限责任公司原党委书记、董事长张海峰被“双开”","url":"https://www.jiemian.com/article/15352237.html","summary":"经查，张海峰丧失理想信念，背弃初心使命，搞迷信活动；无视中央八项规定精神，违规收受礼品、礼金、消费卡，接受可能影响公正执行公务的宴请，将应当由本人支付的费用由他人支付；违反组织原则…","summary_short":"经查，张海峰丧失理想信念，背弃初心使命，搞迷信活动；无视中央八项规定精神，违规收受礼品、礼金、消费卡…","digest":"经查，张海峰丧失理想信念，背弃初心使命，搞迷信活动；无视中央八项规定精神…","points":["经查，张海峰丧失理想信念，背弃初心使命，搞迷信活动","无视中央八项规定精神，违规收受礼品、礼金、消费卡，接受可能影响公正执行公务的宴请…","违反组织原则，不按规定报告个人有关事项，在组织函询时不如实说明问题…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T20:32:32+08:00","size":1,"keywords":[],"body":"经查，张海峰丧失理想信念，背弃初心使命，搞迷信活动；无视中央八项规定精神，违规收受礼品、礼金、消费卡，接受可能影响公正执行公务的宴请，将应当由本人支付的费用由他人支付；违反组织原则，不按规定报告个人有关事项，在组织函询时不如实说明问题，在干部工作调动中违规为他人谋取利益并收受财物；廉洁底线失守，利用职务便利为他人谋取利益并收受财物；违反工作纪律，干预和插手市场经济活动；公权私用，利用职务上的便利为他人在承揽工程、结算工程款等方面谋取利益，并非法收受巨额财物。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cab9c6c56b5","title":"吴泳铭：千问已经在平头哥芯片上训练下一代模型，2030自然年阿里云外部收入1000亿美元目标不变","url":"https://www.jiemian.com/article/15352228.html","summary":"11月19日，在2027财年第二季度财报分析师电话会上，阿里巴巴集团CEO吴泳铭表示，平头哥三代GPU产品路线图正在加速推进——今年真武M890全面上线，2027年V900…","summary_short":"11月19日，在2027财年第二季度财报分析师电话会上，阿里巴巴集团CEO吴泳铭表示…","digest":"11月19日，在2027财年第二季度财报分析师电话会上，阿里巴巴集团CEO吴泳铭表示…","points":["11月19日，在2027财年第二季度财报分析师电话会上，阿里巴巴集团CEO吴泳铭表示…","吴泳铭强调，千问已经在平头哥芯片上训练下一代模型，百炼已经基于国产芯片提供模型推理服务","综合各因素影响，吴泳铭表示，2031财年（2030自然年）云外部收入1000亿美元…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T20:30:32+08:00","size":1,"keywords":[],"body":"11月19日，在2027财年第二季度财报分析师电话会上，阿里巴巴集团CEO吴泳铭表示，平头哥三代GPU产品路线图正在加速推进——今年真武M890全面上线，2027年V900、2028年J900的生产供应链全面推进并进入大规模量产。\n吴泳铭强调，千问已经在平头哥芯片上训练下一代模型，百炼已经基于国产芯片提供模型推理服务。阿里的全栈AI基础设施将在国产算力供应链上形成明显优势，而自研芯片与自研模型的深度协同，将持续转化为更优的单位算力成本和更高的AI应用研发效率。\n综合各因素影响，吴泳铭表示，2031财年（2030自然年）云外部收入1000亿美元、利润率超过20%的目标不变。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cf37910b20e","title":"青海德令哈：柴达木枸杞“入饲”蛋鸡养殖促增收","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734865.shtml","summary":"中新网西宁11月19日电 题：青海德令哈：柴达木枸杞“入饲”蛋鸡养殖促增收  　　作者孙睿王正钰  　　冬日的青海省海西州德令哈市寒风凛冽，柯鲁柯镇规模化蛋鸡养殖企业的生产车间正有序运转。","summary_short":"中新网西宁11月19日电 题：青海德令哈：柴达木枸杞“入饲”蛋鸡养殖促增收  　　作者孙睿王正钰  　　冬日的青海省海西…","digest":"题：青海德令哈：柴达木枸杞“入饲”蛋鸡养殖促增收  　　作者孙睿王正钰  　　冬日的…","points":["冬日的青海省海西州德令哈市寒风凛冽，柯鲁柯镇规模化蛋鸡养殖企业的生产车间正有序运转","2025年，全州枸杞种植面积达43.73万亩，品牌价值突破196亿元(人民币，下同)","建成的8栋标准化养殖厂房内，喂料、饮水、温控、捡蛋、环境消杀全部靠智能数控设备操作…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:29:56+08:00","size":1,"keywords":[],"body":"中新网西宁11月19日电 题：青海德令哈：柴达木枸杞“入饲”蛋鸡养殖促增收\n\n　　作者孙睿王正钰\n\n　　冬日的青海省海西州德令哈市寒风凛冽，柯鲁柯镇规模化蛋鸡养殖企业的生产车间正有序运转。\n\n　　枸杞是海西州主导产业之一。2025年，全州枸杞种植面积达43.73万亩，品牌价值突破196亿元(人民币，下同)。依托柴达木盆地高海拔、环境洁净、日照充足的条件，当地企业跳出同质化养殖竞争，深挖本地枸杞资源优势。\n\n图为养殖厂房内。德令哈市委宣传部 供图\n\n　　“我们不外购成品饲料，选用玉米、豆粕等原粮自主调配，创新把高原枸杞加入饲料配方，培育出特色枸杞鸡蛋、枸杞鸡，还注册了商标，将高原生态优势转化为市场竞争优势，让柴达木特色禽蛋产品走向大众餐桌。”生产车间负责人张维昌说。\n\n　　张维昌介绍，粪污处理这道养殖行业的“老大难”问题，在这里也变了样。“我们构建起‘养殖—粪污制肥—枸杞种植—枸杞喂鸡’循环产业链：鸡粪加工成有机肥供给枸杞种植基地，枸杞地的末茬果实又回流养殖场作饲料原料，粪污全资源化利用，既护住柴达木脆弱的生态，也把养殖与枸杞两大本土产业连在一起。”\n\n　　建成的8栋标准化养殖厂房内，喂料、饮水、温控、捡蛋、环境消杀全部靠智能数控设备操作，没有满地粪便和刺鼻臭味。\n\n　　车间蛋鸡存栏6万羽，常年吸纳周边村民稳定就业，月均工资约4000元；每年短期用工可达300余人，日薪130元，有效带动民众增收。\n\n图为工人们分拣鸡蛋。德令哈市委宣传部 供图\n\n　　“我在家门口干了5年，工资按月发放，年终还有奖金，既能挣钱又能照顾家里。”本地员工刘利龙说。\n\n　　目前，柯鲁柯镇当地企业生产的枸杞鸡蛋、枸杞鸡入选“神奇柴达木优品”，本土品牌影响力不断提升，蛋鸡养殖产业持续优化生态循环体系，走出一条绿色养殖、品牌增效的高原农牧业高质量发展路。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c90b1c34b60","title":"商业银行20天推迟发债900亿，堪比过去20年总和","url":"https://www.jiemian.com/article/15352020.html","summary":"界面新闻记者 | 杨志锦 界面新闻编辑 | 王姝  前脚刚挂出债券发行公告，后脚就宣布发行计划推迟。","summary_short":"界面新闻记者 | 杨志锦 界面新闻编辑 | 王姝  前脚刚挂出债券发行公告，后脚就宣布发行计划推迟。","digest":"界面新闻记者 | 杨志锦 界面新闻编辑 | 王姝  前脚刚挂出债券发行公告…","points":["前脚刚挂出债券发行公告，后脚就宣布发行计划推迟","界面新闻记者根据同花顺ifind整理，自10月30日以来的近20日内…","商业银行近20天推迟发债规模已相当于过去20年的总和"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T20:25:49+08:00","size":1,"keywords":[],"body":"界面新闻记者 | 杨志锦\n界面新闻编辑 | 王姝\n\n前脚刚挂出债券发行公告，后脚就宣布发行计划推迟。\n\n界面新闻记者根据同花顺ifind整理，自10月30日以来的近20日内，共有7家商业银行宣布推迟相关债券发行，涉及8只金融债券，规模合计约900亿元。\n\n这是史无前例的金融债券推迟发行潮。商业银行近20天推迟发债规模已相当于过去20年的总和。2026年10月之前的20年商业银行金融债券推迟发行只数为20只，合计规模约907亿。\n\n界面新闻记者根据同花顺ifind数据制图\r\n\n界面新闻记者采访了解到，推迟发行的直接触发因素是近期债市调整，金融债收益率显著上行、付息成本抬升，商业银行选择暂停发债以等待更好的发行窗口。\n\n但更深一层看，这是净息差低位、扩表放缓背景下商业银行精细化管理的必然选择：过去息差厚、扩张快，核心矛盾是缺负债、缺资本，利息高一点也照发不误；如今息差薄了、扩表慢了，每一笔成本都需要精细管理。\n\n债市调整冲击金融债一级市场\n\n10月18日，湖北银行公告称，因本行发行计划调整，经与簿记管理人协商一致，决定推迟本期债券发行，后续将根据市场情况重新制定发行计划。该债券原计划发行规模为20亿。\n\n这并非个案。这一轮商业银行金融债取消发行始于10月下旬。10月30日，东莞农商行公告称，综合考虑近期市场情况及本行负债规划，本行决定择时重新发行“26东莞农商行债01”。该债券原计划发行规模也为20亿元。\n\n据界面新闻记者统计，这期间共有7家商业银行宣布推迟相关债券发行，共涉及8只债券，规模合计约900亿元，其中工商银行、兴业银行、浦发银行均超200亿元，占比较高。\n\n“商业银行密集推迟债券发行主要原因是发行成本上升，近期债市波动推高资本类债券收益率，此时发行将锁定高付息成本。”中国邮政储蓄银行研究员娄飞鹏对界面新闻记者表示。\n\n据界面新闻记者了解，10月27日珠海华发集团债务风险传闻引发市场担忧，资管产品担心踩雷，开始出售相关债券，进而导致资管产品净值下跌、投资者赎回增加，资管机构又不得不卖出金融债。\n\n“为应对赎回，机构先从流动性最好的债券卖，商业银行二级资本债、永续债收益率出现了上行。”北京地区某私募债券投资人士对界面新闻记者直言。\n\n中国债券信息网数据显示，10月26日3年期AAA级中资银行债券收益率为1.49%，11月17日上行至1.53%，上行了4个基点；同期5年期AAA级中资银行债券收益率上行10个基点至1.62%。\n\n界面新闻记者截图自中国债券信息网\r\n\n兴业银行原计划于11月17日发行200亿元“26兴业银行债01”（3年期）。按3年期AAA级银行普通债收益率上行4个基点粗略测算，如果当日发行，兴业银行年付息成本将较10月底发行增加约800万元。\n\n需要注意的是，债券二级市场的调整不仅对金融债一级市场形成冲击，对信用债一级市场也有影响。因为非金融企业债券融资成本也会上升，非金融企业取消债券发行的规模也明显增加。\n\n同花顺ifind数据显示，10月27日以来，共有53只信用债推迟发行，规模合计350亿元，而9月初至10月26日，信用债推迟发行的只数和规模分别为19只、117亿元。\n\n扩表放缓下的选择 \n\n“由债券市场风险事件导致一级市场发行取消的案例比较常见，比如2020年10月永煤违约时、2022年四季度债市调整时。”前述北京地区私募债券投资人士对界面新闻记者表示。\n\n据界面新闻记者统计，上述两个风险事件冲击后，一个月内信用债推迟发行规模均超600亿，同期商业银行二级资本债、永续债收益率上行幅度达到20-40个基点，但2020年10月、2022年四季度推迟发行的金融债仅分别为2只（10亿）、3只（90亿）。\n\n此次二永债收益率仅上行约8个基点，商业银行金融债推迟发行却已达8只（900亿元）。这一重大变化因何发生？\n\n界面新闻记者采访了解到，其原因在于商业银行资产增速显著放缓。过去商业银行资产增速普遍在10%以上，核心矛盾是缺负债、缺资本，即便利率高一点，也不得不通过金融债筹集资金；如今资产增速降至6%，核心矛盾已转为缺资产，而非缺负债。\n\n界面新闻记者根据同花顺ifind制图\r\n\n“资产增长较慢主要因为市场需求不足，而不是银行不愿意放贷。”某股份行资产负债部人士对界面新闻记者表示。\n\n以工商银行为例，截至2026年三季度末该行总资产相比去年底增长6.7%，而同期负债增速为7.1%，后者增速高于前者为工行暂缓永续债发行提供了空间。\n\n“银行扩表明显放缓，资本消耗放慢，补充紧迫性下降，加上资本指标仍有缓冲，银行暂停发行从而等待更好的发行时机窗口。”娄飞鹏对界面新闻记者表示。\n\n据界面新闻记者统计，目前推迟发行的八只金融债券，有两只是永续债，其主要用于补充商业银行其他一级资本；剩余六只为普通金融债、专项金融债，其主要用于补充负债。\n\n展望未来，银行业资产增速放缓或是新常态。惠誉评级亚太区金融机构评级高级董事胡月明对界面新闻记者表示，预计未来一两年信贷增长仍将维持较低水平。\n\n“从评级角度看，跑得快未必好。当前环境下过度放贷反而对评级有负面影响，我们更看重盈利的可持续性，过度放贷短期内或能提升盈利，但会埋下资产质量隐患。”胡月明称。\n\n净息差低位下的精细化管理\n\n另一个原因则在于，净息差处于低位，商业银行需通过各种精细化管理手段维持净利润的稳定。\n\n同花顺ifind数据显示，过去净息差长期维持在2%以上，商业银行营收和净利润也持续增长，但2022年以来净息差由2%左右快速回落至目前的1.4%，商业银行利息净收入持续下降。\n\n界面新闻记者根据同花顺ifind数据制图\r\n\n为稳住净利润，商业银行多方施策，压降费用就是其中之一，业内谓之“精细化管理”，其中有代表性的有平安银行的“小一楼，大二楼”策略。\n\n平安银行行长冀光恒多次在该行业绩会上介绍，该行推动网点收缩，同时调整为小一楼、大二楼，因为一楼的租金很高，但到网点的人越来越少，造成很多浪费。\n\n再如兴业银行“挣一块省一毛”的策略。2025年4月，兴业银行行长吕家进在该行业绩会上表示，现在商业银行的钱是一块一块地挣，也要一毛一毛地省。\n\n以兴业银行此次推迟发行的“26兴业银行债01”为例，此举预计将省下一年约800万的付息成本，接近该行2024年净利润增量的十分之一。\n\n财报数据显示，2024年兴业银行实现归母净利润772.1亿元，相比上年增长0.9亿元。\n\n“现在能省一点是一点。”前述股份行资产负债部人士对界面新闻记者表示，“以前我们总分行之间员工交流半年、一年，员工一般住酒店，但现在为省成本，改成了在当地租房。”\n\n娄飞鹏表示，在净息差低位、扩表放缓的背景下，商业银行资产管理要从以量补价转向稳量保价，提升高收益资产占比；负债上压降高成本定期存款、拉长负债久期对冲期限错配；资本上以内源留存为主，前瞻储备资本债券额度、择时发行，并通过资本计量优化与轻资本业务减少资本消耗。\n\n未经正式授权严禁转载本文，侵权必究。金融live\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n商业银行20天推迟发债900亿，堪比过去20年总和\n\n扩表放缓、净息差低位下的精细化成本账。\n\n原创新闻杨志锦 · 2026/11/19 20:25来源：界面新闻\n\n图片来源：界面图库\n\n界面新闻记者 | 杨志锦\n界面新闻编辑 | 王姝\n\n前脚刚挂出债券发行公告，后脚就宣布发行计划推迟。\n\n界面新闻记者根据同花顺ifind整理，自10月30日以来的近20日内，共有7家商业银行宣布推迟相关债券发行，涉及8只金融债券，规模合计约900亿元。\n\n这是史无前例的金融债券推迟发行潮。商业银行近20天推迟发债规模已相当于过去20年的总和。2026年10月之前的20年商业银行金融债券推迟发行只数为20只，合计规模约907亿。\n\n界面新闻记者根据同花顺ifind数据制图\r\n\n界面新闻记者采访了解到，推迟发行的直接触发因素是近期债市调整，金融债收益率显著上行、付息成本抬升，商业银行选择暂停发债以等待更好的发行窗口。\n\n但更深一层看，这是净息差低位、扩表放缓背景下商业银行精细化管理的必然选择：过去息差厚、扩张快，核心矛盾是缺负债、缺资本，利息高一点也照发不误；如今息差薄了、扩表慢了，每一笔成本都需要精细管理。\n\n债市调整冲击金融债一级市场\n\n10月18日，湖北银行公告称，因本行发行计划调整，经与簿记管理人协商一致，决定推迟本期债券发行，后续将根据市场情况重新制定发行计划。该债券原计划发行规模为20亿。\n\n这并非个案。这一轮商业银行金融债取消发行始于10月下旬。10月30日，东莞农商行公告称，综合考虑近期市场情况及本行负债规划，本行决定择时重新发行“26东莞农商行债01”。该债券原计划发行规模也为20亿元。\n\n据界面新闻记者统计，这期间共有7家商业银行宣布推迟相关债券发行，共涉及8只债券，规模合计约900亿元，其中工商银行、兴业银行、浦发银行均超200亿元，占比较高。\n\n“商业银行密集推迟债券发行主要原因是发行成本上升，近期债市波动推高资本类债券收益率，此时发行将锁定高付息成本。”中国邮政储蓄银行研究员娄飞鹏对界面新闻记者表示。\n\n据界面新闻记者了解，10月27日珠海华发集团债务风险传闻引发市场担忧，资管产品担心踩雷，开始出售相关债券，进而导致资管产品净值下跌、投资者赎回增加，资管机构又不得不卖出金融债。\n\n“为应对赎回，机构先从流动性最好的债券卖，商业银行二级资本债、永续债收益率出现了上行。”北京地区某私募债券投资人士对界面新闻记者直言。\n\n中国债券信息网数据显示，10月26日3年期AAA级中资银行债券收益率为1.49%，11月17日上行至1.53%，上行了4个基点；同期5年期AAA级中资银行债券收益率上行10个基点至1.62%。\n\n界面新闻记者截图自中国债券信息网\r\n\n兴业银行原计划于11月17日发行200亿元“26兴业银行债01”（3年期）。按3年期AAA级银行普通债收益率上行4个基点粗略测算，如果当日发行，兴业银行年付息成本将较10月底发行增加约800万元。\n\n需要注意的是，债券二级市场的调整不仅对金融债一级市场形成冲击，对信用债一级市场也有影响。因为非金融企业债券融资成本也会上升，非金融企业取消债券发行的规模也明显增加。\n\n同花顺ifind数据显示，10月27日以来，共有53只信用债推迟发行，规模合计350亿元，而9月初至10月26日，信用债推迟发行的只数和规模分别为19只、117亿元。\n\n扩表放缓下的选择 \n\n“由债券市场风险事件导致一级市场发行取消的案例比较常见，比如2020年10月永煤违约时、2022年四季度债市调整时。”前述北京地区私募债券投资人士对界面新闻记者表示。\n\n据界面新闻记者统计，上述两个风险事件冲击后，一个月内信用债推迟发行规模均超600亿，同期商业银行二级资本债、永续债收益率上行幅度达到20-40个基点，但2020年10月、2022年四季度推迟发行的金融债仅分别为2只（10亿）、3只（90亿）。\n\n此次二永债收益率仅上行约8个基点，商业银行金融债推迟发行却已达8只（900亿元）。这一重大变化因何发生？\n\n界面新闻记者采访了解到，其原因在于商业银行资产增速显著放缓。过去商业银行资产增速普遍在10%以上，核心矛盾是缺负债、缺资本，即便利率高一点，也不得不通过金融债筹集资金；如今资产增速降至6%，核心矛盾已转为缺资产，而非缺负债。\n\n界面新闻记者根据同花顺ifind制图\r\n\n“资产增长较慢主要因为市场需求不足，而不是银行不愿意放贷。”某股份行资产负债部人士对界面新闻记者表示。\n\n以工商银行为例，截至2026年三季度末该行总资产相比去年底增长6.7%，而同期负债增速为7.1%，后者增速高于前者为工行暂缓永续债发行提供了空间。\n\n“银行扩表明显放缓，资本消耗放慢，补充紧迫性下降，加上资本指标仍有缓冲，银行暂停发行从而等待更好的发行时机窗口。”娄飞鹏对界面新闻记者表示。\n\n据界面新闻记者统计，目前推迟发行的八只金融债券，有两只是永续债，其主要用于补充商业银行其他一级资本；剩余六只为普通金融债、专项金融债，其主要用于补充负债。\n\n展望未来，银行业资产增速放缓或是新常态。惠誉评级亚太区金融机构评级高级董事胡月明对界面新闻记者表示，预计未来一两年信贷增长仍将维持较低水平。\n\n“从评级角度看，跑得快未必好。当前环境下过度放贷反而对评级有负面影响，我们更看重盈利的可持续性，过度放贷短期内或能提升盈利，但会埋下资产质量隐患。”胡月明称。\n\n净息差低位下的精细化管理\n\n另一个原因则在于，净息差处于低位，商业银行需通过各种精细化管理手段维持净利润的稳定。\n\n同花顺ifind数据显示，过去净息差长期维持在2%以上，商业银行营收和净利润也持续增长，但2022年以来净息差由2%左右快速回落至目前的1.4%，商业银行利息净收入持续下降。\n\n界面新闻记者根据同花顺ifind数据制图\r\n\n为稳住净利润，商业银行多方施策，压降费用就是其中之一，业内谓之“精细化管理”，其中有代表性的有平安银行的“小一楼，大二楼”策略。\n\n平安银行行长冀光恒多次在该行业绩会上介绍，该行推动网点收缩，同时调整为小一楼、大二楼，因为一楼的租金很高，但到网点的人越来越少，造成很多浪费。\n\n再如兴业银行“挣一块省一毛”的策略。2025年4月，兴业银行行长吕家进在该行业绩会上表示，现在商业银行的钱是一块一块地挣，也要一毛一毛地省。\n\n以兴业银行此次推迟发行的“26兴业银行债01”为例，此举预计将省下一年约800万的付息成本，接近该行2024年净利润增量的十分之一。\n\n财报数据显示，2024年兴业银行实现归母净利润772.1亿元，相比上年增长0.9亿元。\n\n“现在能省一点是一点。”前述股份行资产负债部人士对界面新闻记者表示，“以前我们总分行之间员工交流半年、一年，员工一般住酒店，但现在为省成本，改成了在当地租房。”\n\n娄飞鹏表示，在净息差低位、扩表放缓的背景下，商业银行资产管理要从以量补价转向稳量保价，提升高收益资产占比；负债上压降高成本定期存款、拉长负债久期对冲期限错配；资本上以内源留存为主，前瞻储备资本债券额度、择时发行，并通过资本计量优化与轻资本业务减少资本消耗。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cc1751056c6","title":"睿芯披露去年营收过亿并实现盈亏平衡，今与多家企业达成AI及具身智能领域合作","url":"https://www.jiemian.com/article/15352166.html","summary":"界面新闻获悉，11月19日，睿芯与云从科技、浪潮信息、物产中大数字科技等23家合作伙伴签约，涉及人工智能、具身智能、智算、AI终端等领域。","summary_short":"界面新闻获悉，11月19日，睿芯与云从科技、浪潮信息、物产中大数字科技等23家合作伙伴签约，涉及人工智能、具身智能…","digest":"界面新闻获悉，11月19日，睿芯与云从科技、浪潮信息…","points":["界面新闻获悉，11月19日，睿芯与云从科技、浪潮信息、物产中大数字科技等23家合作伙伴签约…","据睿芯披露，目前相关方案已在轨道交通、能源、制造等行业落地，服务客户超过30家","公司创始人范东睿表示，2025年睿芯营收超过1亿元，并实现盈亏平衡"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T20:25:46+08:00","size":1,"keywords":[],"body":"界面新闻获悉，11月19日，睿芯与云从科技、浪潮信息、物产中大数字科技等23家合作伙伴签约，涉及人工智能、具身智能、智算、AI终端等领域。期间，睿芯还展示了新一代升级芯片产品。据睿芯披露，目前相关方案已在轨道交通、能源、制造等行业落地，服务客户超过30家。公司创始人范东睿表示，2025年睿芯营收超过1亿元，并实现盈亏平衡。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c3a71fe1cb5","title":"英力特：控股股东拟协议转让公司股份，11月20日起继续停牌","url":"https://www.jiemian.com/article/15352205.html","summary":"英力特11月19日公告，公司于近日收到控股股东国能英力特能源化工集团股份有限公司通知，英力特集团已确定宁夏宝丰集团有限公司为其拟协议转让公司股份的最终受让方。","summary_short":"英力特11月19日公告，公司于近日收到控股股东国能英力特能源化工集团股份有限公司通知…","digest":"英力特11月19日公告，公司于近日收到控股股东国能英力特能源化工集团股份有限公司通知…","points":["英力特11月19日公告，公司于近日收到控股股东国能英力特能源化工集团股份有限公司通知…","英力特集团拟向宝丰集团一次性整体协议转让其持有的公司155,322,687股无限售流通股份…","截至本公告披露日，相关各方正在积极推进本次股份转让和发行股份购买资产交易的各项工作…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T20:20:44+08:00","size":1,"keywords":[],"body":"英力特11月19日公告，公司于近日收到控股股东国能英力特能源化工集团股份有限公司通知，英力特集团已确定宁夏宝丰集团有限公司为其拟协议转让公司股份的最终受让方。英力特集团拟向宝丰集团一次性整体协议转让其持有的公司155,322,687股无限售流通股份，占公司总股本的39.41%。本次股份转让交易目前正在推进《股份转让协议》的协商谈判工作。截至本公告披露日，相关各方正在积极推进本次股份转让和发行股份购买资产交易的各项工作，公司预计无法在2026年11月20日（星期五）上午开市起复牌。经公司申请，公司证券（证券品种：A股股票，证券简称：英力特，证券代码：000635）自2026年11月20日（星期五）上午开市起继续停牌，预计继续停牌时间不超过5个交易日。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c61fee2ad7c","title":"截至10月底江苏月度词元调用量超450万亿","url":"https://www.jiemian.com/article/15352194.html","summary":"据江苏省数据局消息，当前，江苏算力供给能力持续提升，人工智能服务需求快速增长，词元经济发展呈现加速态势。","summary_short":"据江苏省数据局消息，当前，江苏算力供给能力持续提升，人工智能服务需求快速增长，词元经济发展呈现加速态势。","digest":"据江苏省数据局消息，当前，江苏算力供给能力持续提升，人工智能服务需求快速增长…","points":["据江苏省数据局消息，当前，江苏算力供给能力持续提升，人工智能服务需求快速增长…","经测算，截至10月底，全省月度词元调用量已突破450万亿，环比增长30.39%","截至10月底，江苏全省算力总规模达279.27EFlops，其中智能算力占比达74.75%"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T20:17:25+08:00","size":1,"keywords":[],"body":"据江苏省数据局消息，当前，江苏算力供给能力持续提升，人工智能服务需求快速增长，词元经济发展呈现加速态势。经测算，截至10月底，全省月度词元调用量已突破450万亿，环比增长30.39%。截至10月底，江苏全省算力总规模达279.27EFlops，其中智能算力占比达74.75%；全省入库词元工厂、词元运营中心和词元超市项目已达61个，覆盖13个设区市。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c62dfff5950","title":"沃尔玛第三财季营收1888.35亿美元，同比增长5.2%","url":"https://www.jiemian.com/article/15352182.html","summary":"沃尔玛11月19日公布2027财年第三财季业绩。","summary_short":"沃尔玛11月19日公布2027财年第三财季业绩。","digest":"沃尔玛11月19日公布2027财年第三财季业绩","points":["沃尔玛11月19日公布2027财年第三财季业绩","截至10月31日的三个月，公司实现营收1888.35亿美元，同比增长5.2%","经营利润77.7亿美元，同比增长16%"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T20:12:57+08:00","size":1,"keywords":[],"body":"沃尔玛11月19日公布2027财年第三财季业绩。截至10月31日的三个月，公司实现营收1888.35亿美元，同比增长5.2%；经营利润77.7亿美元，同比增长16%；归属于沃尔玛的净利润为49.45亿美元，同比下降19.5%。调整后每股收益为0.65美元，高于上年同期的0.62美元。沃尔玛将2027财年净销售额增幅预期上调至4.9%至5.2%（固定汇率），调整后经营利润增幅预期上调至8%至8.6%，调整后每股收益预期上调至2.84至2.89美元。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1f914f42e7","title":"前十个月大连市规上工业增加值同比增长6.6%","url":"https://www.jiemian.com/article/15352177.html","summary":"大连市统计局11月19日公布1-10月份全市经济运行情况。","summary_short":"大连市统计局11月19日公布1-10月份全市经济运行情况。","digest":"大连市统计局11月19日公布1-10月份全市经济运行情况","points":["大连市统计局11月19日公布1-10月份全市经济运行情况","1-10月份，大连市规上工业增加值同比增长6.6%，增速比前三季度提高0.1个百分点","从重点行业看，石化工业增加值同比增长4.7%"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T20:04:42+08:00","size":1,"keywords":[],"body":"大连市统计局11月19日公布1-10月份全市经济运行情况。1-10月份，大连市规上工业增加值同比增长6.6%，增速比前三季度提高0.1个百分点。从重点行业看，石化工业增加值同比增长4.7%；装备制造业同比增长7.8%，其中铁路船舶、通用设备、仪器仪表行业分别增长49.9%、12.7%、11.2%；农产品加工业增长17.4%，连续10个月保持两位数增长。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c0fcdca0c9f","title":"“汉交会”开幕 中外客商共寻经贸合作新机遇","url":"https://www.chinanews.com/cj/shipin/cns-d/2026/11-19/news1075490.shtml","summary":"11月19日，2026年武汉商品交易会(以下简称“汉交会”)在武汉黄陂开幕，来自白俄罗斯、阿根廷等17个国家和地区的36位驻华外交官齐聚武汉汉口北国际贸易城，共话经贸合作新机遇。","summary_short":"11月19日，2026年武汉商品交易会(以下简称“汉交会”)在武汉黄陂开幕，来自白俄罗斯…","digest":"11月19日，2026年武汉商品交易会(以下简称“汉交会”)在武汉黄陂开幕…","points":["11月19日，2026年武汉商品交易会(以下简称“汉交会”)在武汉黄陂开幕，来自白俄罗斯…","走进主展区，机器人表演、低空飞行器体验接连上演，西班牙火腿…","本届汉交会以“智联世界 贸通天下”为主题，总规模19万平方米"],"section":"財經","category":"財經","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-19T19:44:14+08:00","size":1,"keywords":[],"body":"11月19日，2026年武汉商品交易会(以下简称“汉交会”)在武汉黄陂开幕，来自白俄罗斯、阿根廷等17个国家和地区的36位驻华外交官齐聚武汉汉口北国际贸易城，共话经贸合作新机遇。\n\n走进主展区，机器人表演、低空飞行器体验接连上演，西班牙火腿、澳大利亚葡萄酒等全球风味吸引嘉宾上前品尝，一众湖北老字号美食及长江中游城市群特色好物集中展出。\n\n据了解，本届汉交会以“智联世界 贸通天下”为主题，总规模19万平方米。展会立足商贸物流中心城市建设，集产品展示、经贸洽谈、消费促进、对外开放于一体，为海内外客商、市民游客奉上一场“好看、好玩、好吃、好买、好谈”的综合性商贸盛会。(王梦媛 卢琪）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/19/chinanews/MEIZI_YUNSHI/onair/3B71C837B18C494ABDB03F9ED42A1EC9.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c820d52f160","title":"新一批领航级智能工厂培育名单公布","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734778.shtml","summary":"中新网南京11月19日电(记者 朱晓颖)19日，工业和信息化部等六部门公布了第二批34家领航级智能工厂培育名单，中兴通讯(南京)有限责任公司、南通中远海运川崎工程有限公司等企业入选。","summary_short":"中新网南京11月19日电(记者 朱晓颖)19日，工业和信息化部等六部门公布了第二批34家领航级智能工厂培育名单…","digest":"19日，工业和信息化部等六部门公布了第二批34家领航级智能工厂培育名单…","points":["中新网南京11月19日电(记者 朱晓颖)19日，工业和信息化部等六部门公布了第二批34家领航…","同一天在南京举办的2026世界智能制造大会上，这34家企业负责人集体登台亮相…","从第二批34家领航级智能工厂培育名单的区域分布来看，覆盖了中国东北、西北、西南、中部…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:44:09+08:00","size":1,"keywords":[],"body":"中新网南京11月19日电(记者 朱晓颖)19日，工业和信息化部等六部门公布了第二批34家领航级智能工厂培育名单，中兴通讯(南京)有限责任公司、南通中远海运川崎工程有限公司等企业入选。同一天在南京举办的2026世界智能制造大会上，这34家企业负责人集体登台亮相，领航工厂培育行动发布。\n\n11月19日，2026世界智能制造大会在南京开幕。中新网记者 朱晓颖 摄\n\n　　从第二批34家领航级智能工厂培育名单的区域分布来看，覆盖了中国东北、西北、西南、中部、东部地区；从行业分布看，在装备制造、钢铁、电子信息等领域外，消费品领域医药、服装等行业的企业首次入选，覆盖范围从大国重器延伸至民生行业。\n\n　　作为中国智能工厂梯度培育体系的最高层级，领航工厂肩负着推动新一代智能制造发展的重要历史使命。数据显示，第二批领航工厂全员劳动生产率平均提升34.4%，生产效率平均提升19.3%。领航工厂的产业链带动作用也在持续凸显，这34家工厂已累计带动近4000家企业协同开展数字化、智能化升级。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cac3774eca7","title":"欧莱雅拟拿下阿玛尼10%股份，LVMH退出谈判","url":"https://www.jiemian.com/article/15351500.html","summary":"11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高级别会谈。","summary_short":"11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高级别会谈。","digest":"11月19日，据财联社报道…","points":["11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高…","欧莱雅或将牵头一个投资者联合体，收购阿玛尼合计15%的股权","其中，欧莱雅拟收购约10%，长期生产阿玛尼眼镜的依视路陆逊梯卡最多收购5%"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:38:57+08:00","size":1,"keywords":[],"body":"11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高级别会谈。欧莱雅或将牵头一个投资者联合体，收购阿玛尼合计15%的股权。其中，欧莱雅拟收购约10%，长期生产阿玛尼眼镜的依视路陆逊梯卡最多收购5%。若交易达成，两名新股东将为阿玛尼家族与基金会提供产业支持，未来阿玛尼家族若出让控股权或推动上市，欧莱雅与依视路陆逊梯卡也有望获得财务回报。\n\n本次交易标的阿玛尼15%股权是品牌创始人乔治·阿玛尼在遗嘱中定下的安排。2025年9月4日，乔治·阿玛尼在米兰逝世，享年91岁，终身未婚无子，这一年恰逢其1975年创立的品牌满50周年；他早在2016年便设立乔治·阿玛尼基金会为传承做准备。\n\n他在遗嘱中规定，继承人应在其去世后的12至18个月内出售公司约15%的股份，后续可再处置30%至54.9%的股份，或是选择推动公司挂牌上市。遗嘱中将LVMH、欧莱雅和依视路陆逊梯卡列为优先买家，这三家企业均与阿玛尼有着长期的授权合作关系。\n\n而遗嘱列明的三家潜在合作方中，LVMH已退出竞争；阿尔诺家族旗下的这家法国奢侈品巨头自有香氛与眼镜业务，恰好和欧莱雅、依视路陆逊梯卡的核心业务形成直接竞争。本次阿玛尼股权调整的目标时间点为2027年3月，这也是乔治・阿玛尼规定出让15%股权的18个月期限截止日。\n\n乔治·阿玛尼还在遗嘱规定，三家均未获选时，可出售给同等地位的其他集团，但须经长期合作伙伴潘塔莱奥·德洛尔科同意，并优先考虑现有商业合作伙伴。无论走哪条路，乔治・阿玛尼基金会都须保留至少30.1%的股份。阿玛尼集团首席执行官朱塞佩·马尔索奇（Giuseppe Marsocci）今年10月22日在武汉SKP与WWD联合举办的峰会上重申，基金会将始终持有公司至少30%的股份，创始人留下的九条创始原则由基金会守护。\n\n欧莱雅与阿玛尼的合作渊源深厚。自1988年起，欧莱雅一直是阿玛尼香水和美妆的授权经营方，双方目前的合作协议已续约至2050年。汇丰银行分析师在报告中指出，阿玛尼的美妆授权许可2024年或创造了15亿欧元的营收，占欧莱雅高档化妆品事业部营收的10%，占集团总营收的3.45%。通过入股，欧莱雅有望巩固这一长达38年的合作关系。\n\n依视路陆逊梯卡与阿玛尼的合作同样始于1988年，负责生产阿玛尼品牌眼镜；2018年陆逊梯卡与依视路合并后，双方于2023年1月续签了15年，协议有效期延长至2038年。值得一提的是，乔治·阿玛尼生前持有依视路陆逊梯卡近2%股份，陆逊梯卡创始人德尔·维奇奥与他亦有长久私交。\n\n从阿玛尼的业绩表现来看，2025年是创始人离世后的首个完整财年。财报显示，阿玛尼集团2025年合并净营收同比下滑4.6%至21.9亿欧元，按固定汇率计算下滑约2.8%。其中零售渠道贡献11.9亿欧元，批发渠道营收7.537亿欧元，授权特许权营收2.243亿欧元。若包含授权业务，集团总营收规模达40亿欧元，面向终端消费者的商品销售总额超60亿欧元。\n\n尽管营收下滑，阿玛尼的盈利能力仍保持相对稳定。2025年息税折旧摊销前利润（EBITDA）同比增长3.2%至1.527亿欧元，营业利润增长2%至5260万欧元。截至2025年底，阿玛尼集团净现金头寸为5.29亿欧元，包含财务投资在内的净现金头寸为5.96亿欧元。此外，阿玛尼手握约5亿欧元现金储备，创始人一直依靠这笔资金保障品牌独立性。\n\n阿玛尼集团CEO马尔索奇在业绩声明中表示，消费者对奢侈品的消费方式正发生可能具有结构性的变化，品牌必须主动适应；集团同时披露，2026年前几个月业务延续上年趋势，亚洲市场尤其中国与日本活力显著提升。\n\n未经正式授权严禁转载本文，侵权必究。欧莱雅\n4k\n\n欧莱雅用“首发”与“共创”重写在华增长逻辑8天前\n欧莱雅与进博会的九年双向奔赴8天前\n\n时尚商业说\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n欧莱雅\n欧莱雅拟拿下阿玛尼10%股份，LVMH退出谈判\n\n乔治·阿玛尼在遗嘱中规定，继承人应在其去世后的12至18个月内出售公司约15%的股份。\n\n原创新闻李科峰 · 2026/11/19 17:38来源：界面新闻\n\n图片来源：视觉中国\n\n11月19日，据财联社报道，法国美妆集团欧莱雅与意大利奢侈品牌阿玛尼的高层代表近日举行了最高级别会谈。欧莱雅或将牵头一个投资者联合体，收购阿玛尼合计15%的股权。其中，欧莱雅拟收购约10%，长期生产阿玛尼眼镜的依视路陆逊梯卡最多收购5%。若交易达成，两名新股东将为阿玛尼家族与基金会提供产业支持，未来阿玛尼家族若出让控股权或推动上市，欧莱雅与依视路陆逊梯卡也有望获得财务回报。\n\n本次交易标的阿玛尼15%股权是品牌创始人乔治·阿玛尼在遗嘱中定下的安排。2025年9月4日，乔治·阿玛尼在米兰逝世，享年91岁，终身未婚无子，这一年恰逢其1975年创立的品牌满50周年；他早在2016年便设立乔治·阿玛尼基金会为传承做准备。\n\n他在遗嘱中规定，继承人应在其去世后的12至18个月内出售公司约15%的股份，后续可再处置30%至54.9%的股份，或是选择推动公司挂牌上市。遗嘱中将LVMH、欧莱雅和依视路陆逊梯卡列为优先买家，这三家企业均与阿玛尼有着长期的授权合作关系。\n\n而遗嘱列明的三家潜在合作方中，LVMH已退出竞争；阿尔诺家族旗下的这家法国奢侈品巨头自有香氛与眼镜业务，恰好和欧莱雅、依视路陆逊梯卡的核心业务形成直接竞争。本次阿玛尼股权调整的目标时间点为2027年3月，这也是乔治・阿玛尼规定出让15%股权的18个月期限截止日。\n\n乔治·阿玛尼还在遗嘱规定，三家均未获选时，可出售给同等地位的其他集团，但须经长期合作伙伴潘塔莱奥·德洛尔科同意，并优先考虑现有商业合作伙伴。无论走哪条路，乔治・阿玛尼基金会都须保留至少30.1%的股份。阿玛尼集团首席执行官朱塞佩·马尔索奇（Giuseppe Marsocci）今年10月22日在武汉SKP与WWD联合举办的峰会上重申，基金会将始终持有公司至少30%的股份，创始人留下的九条创始原则由基金会守护。\n\n欧莱雅与阿玛尼的合作渊源深厚。自1988年起，欧莱雅一直是阿玛尼香水和美妆的授权经营方，双方目前的合作协议已续约至2050年。汇丰银行分析师在报告中指出，阿玛尼的美妆授权许可2024年或创造了15亿欧元的营收，占欧莱雅高档化妆品事业部营收的10%，占集团总营收的3.45%。通过入股，欧莱雅有望巩固这一长达38年的合作关系。\n\n依视路陆逊梯卡与阿玛尼的合作同样始于1988年，负责生产阿玛尼品牌眼镜；2018年陆逊梯卡与依视路合并后，双方于2023年1月续签了15年，协议有效期延长至2038年。值得一提的是，乔治·阿玛尼生前持有依视路陆逊梯卡近2%股份，陆逊梯卡创始人德尔·维奇奥与他亦有长久私交。\n\n从阿玛尼的业绩表现来看，2025年是创始人离世后的首个完整财年。财报显示，阿玛尼集团2025年合并净营收同比下滑4.6%至21.9亿欧元，按固定汇率计算下滑约2.8%。其中零售渠道贡献11.9亿欧元，批发渠道营收7.537亿欧元，授权特许权营收2.243亿欧元。若包含授权业务，集团总营收规模达40亿欧元，面向终端消费者的商品销售总额超60亿欧元。\n\n尽管营收下滑，阿玛尼的盈利能力仍保持相对稳定。2025年息税折旧摊销前利润（EBITDA）同比增长3.2%至1.527亿欧元，营业利润增长2%至5260万欧元。截至2025年底，阿玛尼集团净现金头寸为5.29亿欧元，包含财务投资在内的净现金头寸为5.96亿欧元。此外，阿玛尼手握约5亿欧元现金储备，创始人一直依靠这笔资金保障品牌独立性。\n\n阿玛尼集团CEO马尔索奇在业绩声明中表示，消费者对奢侈品的消费方式正发生可能具有结构性的变化，品牌必须主动适应；集团同时披露，2026年前几个月业务延续上年趋势，亚洲市场尤其中国与日本活力显著提升。\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cdf5cbbd1d9", 99）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%。","digest":"網易第三季非公認會計準則純利91.64億元，按年下跌3.6%","points":["網易（9999）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%","淨收入為278.5億元，少1.8%","網易派第三季息每股0.117美元，按年增長2.6%"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:32:18+08:00","size":1,"keywords":[],"body":"網易（9999）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%。淨收入為278.5億元，少1.8%。網易派第三季息每股0.117美元，按年增長2.6%。\n網易：經營經得起時間考驗遊戲\n網易首席執行官丁磊表示，一如既往製作精品遊戲內容，並為經典遊戲不斷注入新內容與新玩法，以吸引更廣泛的玩家群體；同時籌備多品類、多平台、多市場的在研新品。他稱，將持續聚焦於將創意、技術革新與高效執行相結合，經營經得起時間考驗的遊戲產品，並鞏固研發與長線營運能力。\n《燕雲十六聲》全球用戶破一億\n該集團表示，其遊戲產品進一步提升全球市場的吸引力，例如《漫威爭鋒》推出新特性和新內容 ，深化與全球玩家的聯結；《燕雲十六聲》 全球用戶於8月突破1億名，彰顯其面向全球市場的遊戲研發與長線營運能力不斷增強。網易又指，新作《無限大》計劃於2027年1月15日在全球多平台上線，目前預約量已突破2700萬份。\n遊戲收入按季少8%\n以業務收入劃分，遊戲及相關增值服務淨收入為229億元，按年減少1.7%，按季亦跌8.4%，主要由於自研遊戲淨收入下降。有道淨收入14億元，減少12.3%，因其智能硬件和在線營銷服務淨收入下降。而網易雲音樂（9899）淨收入19億元，降低0.9%。創新及其他業務淨收入則為15億元，按年增加7.1%。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c579d07dc68","title":"从一槽铝水到一池微藻 邹平铝业构建绿色低碳闭环","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734753.shtml","summary":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电；一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……","summary_short":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板…","digest":"一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电…","points":["中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板","一辆V80轻量化车型每百公里少耗1度电","一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……在山东邹平…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:29:46+08:00","size":1,"keywords":[],"body":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电；一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……在山东邹平，起步于2001年的高端铝产业集群，正推动绿色低碳理念贯穿产业发展全链条。\n\n在山东省邹平市魏桥轻量化基地，工人正在焊接铝制车身。梁犇 摄\n\n　　“铝水不落地”，从源头削减碳排放\n\n　　邹平铝产业从2001年起步，经过20多年的发展，已形成氧化铝精炼、电解铝冶炼、合金化、铝材加工、零部件深加工、废铝回收再生、赤泥综合利用等完整产业链条。2025年，邹平高端铝产业集群实现营收2650亿元(人民币，下同)。\n\n　　走进魏桥轻量化基地，作为整车研发制造中枢的山东宏衍汽车有限公司，其全铝白车身项目于2024年8月立项，2025年顺利投产。该项目与宏畅轻合金项目一同被邹平经济技术开发区列为“突破关键技术瓶颈、填补国内相关领域空白”的重大项目。\n\n　　项目依托“铝水不落地”生产模式，上游联动宏畅轻合金年产20万吨特种轻合金材料项目，电解槽产出的铝水不经铸锭、不入仓库，直接送进熔保炉加工。表面看起来，仅是省了一道工序，但实际减掉的是二次熔炼的能耗、金属烧损和随之而来的碳排放。\n\n　　轻量化造车，每百公里节省1度电\n\n　　目前，魏桥轻量化基地布局宏畅、宏奥、宏衍、宏和、宏钧五大项目，形成集材料研发、型材加工、压铸成型、车身总成于一体的产业格局。\n\n　　山东宏奥汽车轻量化科技有限公司总经理贾正宇介绍说，2025年11月，魏桥新能源商用车第二代高端铝VAN车型V80正式上市，采用全球领先的铝基轻量化技术，在保证安全性和承载性的前提下，整车减重10%-20%，比同级别、同尺寸车型降重150kg-300kg，实现每百公里节电1度，有效降低整车能耗与运输成本。\n\n　　V80车间占地2.5万平方米，共规划3条生产线。全线配置高精度柔性机器人，整体自动化率超过70%，综合运用CMT焊接、激光焊接等连接技术，其中冷连接工艺占比达70%，有效控制热变形、保障车身尺寸精度，实现“零烟气、零飞溅、零强光”绿色生产。\n\n　　“车铝循环”，报废车辆实现铝料重生\n\n　　车辆有使用年限，但铝材可以循环不息。在中德宏顺循环科技产业园，一辆报废的机动车经过精细化拆解，车体铝料可转化为高品质铝水、铝锭，重新回到铝产业供应链。\n\n　　该产业园由中国宏桥集团与德国顺尔茨集团携手打造，由山东宏顺循环科技有限公司运营，总投资15亿元，占地500余亩，聚焦报废机动车回收拆解、再生铝生产、动力电池再生利用三大核心业务。\n\n　　山东宏顺循环科技有限公司总经理徐庆告诉记者，中德宏顺循环科技产业园引进国际先进生产工艺与智能装备，依托报废机动车精细拆解、自动化金属破碎分拣、再生铝除杂不降级三大核心技术，持续推进产业数字化、智能化升级。\n\n　　数据显示，生产1吨再生铝，能耗仅为原铝生产的5%，可节约3.4吨标准煤、节水14立方米、减少固体废物排放20吨，整体实现节能95%、碳减排85%以上。\n\n图为邹平市魏桥国科微藻高值化开发基地。梁犇 摄\n\n　　排放口变原料口，微藻固碳开辟减碳新路径\n\n　　一边是金属循环，一边是生物固碳。魏桥国科微藻高值化开发基地将电厂烟气中的二氧化碳转化为微藻生长的“养料”。微藻光合效率远超陆生植物，基地探索“二氧化碳生物减排+生态固碳”路径，构建“碳捕集-生物转化-资源高值利用”一体化模式。\n\n　　基地不仅“养藻”，还搭建微藻高附加值产品全流程研发、中试与产业化示范平台：先小试跑通工艺，再中试核算成本。这套攻关模式，依托魏桥国科强大的科创支撑。2019年，魏桥创业集团联合中国科学院大学、中信信托共建魏桥国科(滨州)研究院，开创了科学家、实业家、金融家“握指成拳、深度合作”的新模式。\n\n　　重工业排出的二氧化碳，滋养微藻；以微藻为原料，又延伸出多元产业链。基地把工业排放端和微藻生产端串联起来，填补电厂二氧化碳捕集和微藻高附加值产品开发领域空白，打通基础研究到产业化的技术链路，助力农业、食品、医药产业转型升级。\n\n　　目前，邹平市拥有氧化铝产能400万吨，电解铝产能218.1万吨，再生铝产能201万吨，精细氧化铝产能84.55万吨，铝精深加工能力600万吨。2026年1月至10月份，该市高端铝产业集群实现营收2300亿元，中高端铝制品占比达到79%。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"caf746e0ba2","title":"美军中央司令部司令访以商讨地区局势","url":"https://www.jiemian.com/article/15351659.html","summary":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列，与以军总参谋长扎米尔及以色列情报与特勤局（摩萨德）局长罗曼·戈夫曼在特拉维夫举行会谈。","summary_short":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","digest":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","points":["当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","双方讨论了地区局势发展与共同面临的安全挑战，并强调了深化两国军队间作战合作…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:24:35+08:00","size":1,"keywords":[],"body":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列，与以军总参谋长扎米尔及以色列情报与特勤局（摩萨德）局长罗曼·戈夫曼在特拉维夫举行会谈。双方讨论了地区局势发展与共同面临的安全挑战，并强调了深化两国军队间作战合作、加强协调以及提升联合战备状态以应对各类局势的重要性。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8d96c45f13","title":"PC出货大跌两成，但头部厂商反而越赚越多","url":"https://www.jiemian.com/article/15351589.html","summary":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。","summary_short":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。","digest":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI…","points":["前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI…","杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题","一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:17:19+08:00","size":1,"keywords":[],"body":"文｜道总有理\n\n前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题。\n\n李彦宏的想法其实很符合逻辑，AI目前使用的最佳场景是PC而不是手机。那必然会对PC有一定的带动作用。\n\n但事实上，答案可能非常反直觉。\n\nIDC最新公布的数据显示，2026年第三季度，全球PC出货量为6270万台，同比下降20.1%。联想、惠普、戴尔、苹果、华硕，排名前五的厂商无一增长。联想出货量同比下滑22.6%，惠普同比下滑30.9%，包括苹果，Mac的出货量都跌了11.3%。\n\n被各路大佬频繁提及的“AI带动PC出货论”在一组组惨淡的数据面前显得格外无力。\n\n但更反直觉的是，尽管AI没有真的带动PC出货量，几大头部厂商的财报业绩却可圈可点。\n\n以联想为例，2025/26财年第三财季业绩：集团营收1575亿元人民币，同比增长18%；净利润同比增长36%，利润增速达到营收增速的两倍。\n\n苹果Mac收入107.9亿美元，同比增长23.7%；戴尔年内股价至高点累计涨幅一度高达259%。\n\nAI带不动PC出货量，却带动了厂商的“钱包”，头部厂商还要不要继续纠结出货数字是个问题。但问题背后更值得探讨的是，PC这门大众硬件生意的逻辑，是不是已经悄悄变了。\n\nAI到底带来多大利润？\n\n销量下降，厂商为什么还能赚钱？\n\n一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨。\n\n戴尔首席运营官Jeff Clarke在5月业绩会上形容，调价频繁到“感觉每天都在重新定价”。今年以来，联想、惠普、戴尔、华硕、宏碁等PC厂商均已多次调价，部分机型涨幅在15%到30%之间。\n\nIDC预计，2026年全球PC平均售价将上涨20%。\n\n高定价带来的利润自然会更高。例如，苹果继续上调多款Mac和iPad的售价，其中512GB版MacBook Air从1099美元涨至1299美元。Mac在截至6月的季度里收入103.5亿美元，涨了29%。\n\n当然，涨价不是PC厂商赚钱的根本原因，毕竟涨价也压制了消费级市场的出货意愿。归根结底，真正托举起头部厂商财报业绩的还是AI，一端是AI基础设施业务，另一端是单价数万元的高端AI PC。\n\n以戴尔为例，2027财年第二财季报告，戴尔营收469.71亿美元，同比增长58%，其中，AI服务器业务表现突出，订单金额达到609亿美元，确认收入达到164亿美元，已经超过整个PC相关业务的收入。\n\n无独有偶，截至6月底的季度，联想ISG业务（包括传统服务器、AI服务器和存储）收入同比增长98%，营业利润达到7.77亿美元。AI服务器项目储备540亿美元，一个季度涨了157%。\n\n而从2024年就火起来的AI PC在消费端承接了产品结构升级的使命。\n\n早在2024年第三季度，Canalys发布的数据就曾显示，当年全球AI PC出货量达到1330万台，占当季度PC总出货量的20%。此后，随着AI时代加速发展，头部厂商不断增加AI PC产品占比。\n\n以联想为例，数据显示，联想的AI PC产品类型，从24/25年第一财季的17款增加到第二财季的28款。到2026年，在IFA 2026期间，联想面向消费端和商务侧再度发布了多款AI PC新品。\n\n不止联想。\n\n根据《华尔街日报》报道，各家厂商都希望通过提高AI PC的产品占比，即增加能够在终端本地进行AI运算的PC产品，来减轻PC市场整体萎缩带来的影响。华硕ProArt P16、戴尔XPS 16 Creator Edition、惠普OmniBook Ultra 16、微星Prestige N16 Flip AI+也都开启了预定。\n\n如果说2024 年普及的初代AI PC，更多是“传统 PC”的营销话术，功能以轻量本地推理、语音转写、文案润色为主，消费者感知弱，溢价空间有限，并没有真正打破PC行业的盈利天花板。\n\n到2026年，英伟达入局PC领域，AI PC 进一步向超高端、Agent化方向的跃迁，定价逻辑也就脱离了消费电子的框架，例如，微软的SurfaceLaptop Ultra裸机顶配版本价格接近5万元；联想AI PC（YOGA Pro 15 RTX Spark高配版）标价42999元。\n\n这无疑是厂商盈利的最大依仗之一。\n\n同时，尽管大盘出货量在下降，但消费者很乐意为AI PC买单。\n\n联想YOGA Pro 15 RTX Spark高配版半小时售罄。至10月18日晚，京东仍然显示“无货”在闲鱼二手交易平台上，更有卖家将高配版挂出了50000元的价格，比官方建议零售价高出约7000元。\n\n那么，AI PC到底能为厂商赚多少钱？\n\n还是以联想为例，按照摩根士丹利的口径，联想普通PC的全球均价约为800美元（折合人民币约5400元），常规PC毛利率约为15.5%，而RTXSpark这类超高端AI工作站机型的毛利率可达22%左右。\n\n反映到营收与利润上：\n\n“经济杂志”记者测算，假设联想YOGAPro15出货量为200万台（约占联想PC年出货的3%），为IDG带来约752亿元增量收入、172亿元增量毛利，单机增量毛利率约23%，推升IDG毛利率约0.9至1.3个百分点、运营利润率约0.8至1.3个百分点。\n\n这组数据值得玩味的地方在于：仅占出货量3%的超高端机型，就能撬动一个头部厂商PC业务近1个百分点的利润率。这笔商业账算得越精准，那个以“出货量论英雄”的PC黄金时代，就越显得恍如隔世。\n\n悬而未决的英伟达“变数”\n\n就目前来看，各大机构十分看好AI PC。\n\nOmdia发布报告显示，预计2027年AI PC将占全球PC出货量的60%，到2030年进一步提升至79%。高盛则预计2026年AI PC出货量将达到1.5亿台，同比增长39%，占全部PC的59%，到2028年出货量将近2亿台，市场渗透率82%。\n\n消费市场上首发售罄、二手加价的盛况似乎更助推了AI PC加速取代传统PC的趋势。\n\n然而，会为AI功能更换电脑的人有多少呢？\n\n根据Omdia的调查，69%的PC办公用户愿意为本地AI处理能力支付更高价格，但只有9%的用户会因为AI功能更换电脑。更重要的是，头豹研究院2025年调研数据显示，AI PC的核心硬件NPU，在许多主流的软件中并未得到有效调用。\n\n这意味着用户在支付了硬件溢价后，并未获得一定的AI体验提升。\n\n2026年6月，英伟达宣布推出RTX Spark，正式入局PC芯片，一举引起PC厂商狂欢。微软、戴尔、惠普、华硕、联想、微星将相继推出搭载这款芯片的全新Windows 整机。例如，联想YOGA Pro 15 RTX Spark、华硕ProArt创16。\n\n新一代AI PC比之从前有进益了吗？\n\n从当前各大科技博主的测评来看，RTX Spark笔记本在GPU性能、本地大模型推理、大容量统一内存方面具备显著优势，尤其适配需本地运行大模型的开发者与创作者群体。但实测也暴露了诸多问题：\n\nWindows on Arm架构的软件兼容性存在短板，部分游戏与专业应用表现欠佳。\n\n高负载场景下的续航、发热及风扇噪声表现均不尽如人意。另外，英伟达重点宣传的本地Agent体验不佳，使用Hermes Agent和本地Qwen模型生成新闻简报，耗时约10分钟，消耗了10%的电量，最终效果不如云端Claude。\n\n诚然，体验层面的短板并非不可修复的硬伤，跟着以后的技术迭代大概率会逐步补齐。\n\n需要担心的是，在几款RTX Spark笔记本发布不久后，英伟达就迎来了黄仁勋“风波”。\n\n黄仁勋是英伟达杀入PC市场的核心操盘手，RTX Spark从架构定义、生态合作到落地节奏，全程由他亲自推动。TrendForce预估，RTX Spark相关产品2026年出货量约在20万台以内；随着生态系统成熟，2027年有望放大到100万台。\n\n时至今日，黄仁勋退场，海内外多家媒体开始担忧：未来，英伟达是否还会继续加码消费级项目？\n\n其中，RTX Spark的命运已经引起了数家媒体预测。例如，Omdia的PC分析师Kieren Jessop直言：短期内消费者不会感受到太多变化，但未来两三年值得警惕。\n\n毕竟消费级业务的商业回报远远不及AI数据中心，还需要持续投入。\n\n11月18日，英伟达公布了2027财年第三财季（截至2026年10月25日）的财报，收入为1158亿美元，同比增长103%，环比增长20%；净利润为653亿美元，同比增长105%，环比增长9%。\n\n搭载RTX Spark的联想新一代AI PC已开始出货，英伟达将这项进展列入边缘计算业务。\n\n本季度，该业务实现营收82亿美元。对比之下，数据中心业务收入达到了创纪录的1076亿美元，首次突破千亿美元，收入占比达到约93%，同比增长110%，环比增长21%。\n\n临时接任CEO的克雷斯出身CFO，英伟达往后的每一笔投入、营收只怕都会算得更严苛。\n\nPC厂商们的心境在此刻变得格外讽刺。\n\n这大抵就是PC行业逃不开的宿命：几十年来，从未真正掌握自己的叙事权。早年靠英特尔的摩尔定律推着迭代，后来靠微软的系统升级拉动换机，如今撞上AI浪潮，依旧要仰仗芯片巨头的战略倾斜才能分到增长红利。\n\n陷在存量困局的PC行业，随着一个人的离去，又要迷茫了。\n\n这也说明了PC行业一个残酷现实：当叙事权握在别人手里，增长的想象空间随时都可能会收缩。如今，AI带来的增量红利正变得不确定，那么降本就成了PC厂商更可控的抓手，而一场围绕产能的辗转腾挪其实早已开始。\n\n产能回迁的“零和博弈”\n\n未来，消费者会为什么样的电脑买单？\n\nCounterpoint高级分析师指出，AI电脑、高端显示器和差异化产品仍有机会，但最终胜出的企业必须同时具备创新能力、有竞争力的价格、严格的供应链管理，以及对消费者和企业具有吸引力的产品价值，四项全能，缺一不可。\n\n其中，价格、供应链管理在这个PC物料成本、终端售价越来越高的时代显得尤其重要。2025年第一季度，CPU、DRAM和SSD三大核心部件占整机物料成本的45%；到2026年第三季度，占比已经达到68%。\n\n当前各大PC厂商似乎只剩下了两个主要任务：省钱、赚钱。\n\n这也导致全球PC厂商的生产线即将发生新的变化。曾经，我国是全球电子行业最大的代工生产地区之一，也诞生了台系的富士康、广达电脑、仁宝电脑‌、‌和硕联合，大陆系的华勤技术、立讯精密等头部企业。\n\n后来，由于国内代工成本上升，PC厂商开始将生产线往更廉价的泰国、越南迁移。据悉，惠普甚至计划将最多七成产能迁出我国。\n\n如今，随着PC物料成本水涨船高，泰越基地配套不足的问题被放大，物流周期和库存成本叠加进来，原本低劳动力成本的优势被一点点吞噬。TrendForce指出，PC厂商正在重新评估新兴生产基地的物流、采购和供应链管理成本。\n\n反观我国，有成熟的制造业人才、较低的生产成本以及完整的电子产业链。\n\n10月28日，《日经亚洲》援引消息称，包括惠普、华硕、宏碁在内的全球PC厂商正将部分生产线从泰国和越南迁回我国，重新启用我国代工厂来应对不断飙升的零部件成本，并提高生产效率。\n\n从订单上来看，确实如此。\n\n根据DIGITIMES报道，华勤技术将在2027年为惠普代工一款消费级笔记本，这是其承接的第七个惠普笔电项目；立讯精密则拿下了戴尔高端轻薄本XPS13的代工订单，并计划于2027年进入惠普游戏本供应链。\n\nPC厂商在寒冬中决定到我国产业集群的怀抱，这是不争的事实。TrendForce的数据显示：2025年，全球约24%的笔记本电脑在我国境外生产。2026年这一比例预计下降至21%，2027年甚至可能跌破20%。\n\n但这真的是一笔稳赚不赔的“回头账”吗？\n\n值得一提的是，由于台系代工巨头跟PC厂商一样，把大部分产能分给了AI服务器，此轮回迁，承接回流产能的主力，不再是传统台系代工厂，而是立讯精密、华勤技术等大陆厂商。\n\n据悉，华勤在2026年半年报业绩说明会上预计全年笔记本出货量达2000万台，上半年笔记本营收同比增长超过50%，出货规模已直逼中国台湾第二大笔电代工厂仁宝。\n\n新一轮产能回迁，或许会加速PC核心零部件的国产替代进程。\n\n7月份，联想笔记本首次预装长江存储SSD登陆美国市场；同时，据《日经亚洲》报道，惠普已开始对长鑫存储的DRAM产品进行认证；戴尔同样开始对长鑫存储的DRAM产品进行认证；凤凰网科技引外媒消息报道，苹果公司正与长江存储和长鑫存储谈判。\n\n这意味着国产存储器供应链正式打入主流国际PC终端。\n\n另一方面，国际PC厂商向国内产业集群要效率、降成本的同时，其实也是在为本土竞争对手增加崛起的动力：因为成熟的代工体系、完善的零部件供应链、规模化的制造能力，最终并非只服务于国际品牌，同样也会服务于正在快速崛起的本土品牌。\n\n这是一场互利共生，也注定是此消彼长的博弈。\n\n总而言之，从以出货量论英雄的黄金时代，到靠高端溢价与AI业务托举利润的存量周期，PC行业最终花了十几年完成了一场价值转向，旧的增长逻辑已经失效，而新故事、新格局，正在巨头们的精心算计中悄然酝酿。\n\n本文为转载内容，授权事宜请联系原著作权人。\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\nPC出货大跌两成，但头部厂商反而越赚越多\n\nAI带不动 PC出货，却撑住了厂商的利润？\n\n道总有理 · 2026/11/19 17:17\n\n文｜道总有理\n\n前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题。\n\n李彦宏的想法其实很符合逻辑，AI目前使用的最佳场景是PC而不是手机。那必然会对PC有一定的带动作用。\n\n但事实上，答案可能非常反直觉。\n\nIDC最新公布的数据显示，2026年第三季度，全球PC出货量为6270万台，同比下降20.1%。联想、惠普、戴尔、苹果、华硕，排名前五的厂商无一增长。联想出货量同比下滑22.6%，惠普同比下滑30.9%，包括苹果，Mac的出货量都跌了11.3%。\n\n被各路大佬频繁提及的“AI带动PC出货论”在一组组惨淡的数据面前显得格外无力。\n\n但更反直觉的是，尽管AI没有真的带动PC出货量，几大头部厂商的财报业绩却可圈可点。\n\n以联想为例，2025/26财年第三财季业绩：集团营收1575亿元人民币，同比增长18%；净利润同比增长36%，利润增速达到营收增速的两倍。\n\n苹果Mac收入107.9亿美元，同比增长23.7%；戴尔年内股价至高点累计涨幅一度高达259%。\n\nAI带不动PC出货量，却带动了厂商的“钱包”，头部厂商还要不要继续纠结出货数字是个问题。但问题背后更值得探讨的是，PC这门大众硬件生意的逻辑，是不是已经悄悄变了。\n\nAI到底带来多大利润？\n\n销量下降，厂商为什么还能赚钱？\n\n一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨。\n\n戴尔首席运营官Jeff Clarke在5月业绩会上形容，调价频繁到“感觉每天都在重新定价”。今年以来，联想、惠普、戴尔、华硕、宏碁等PC厂商均已多次调价，部分机型涨幅在15%到30%之间。\n\nIDC预计，2026年全球PC平均售价将上涨20%。\n\n高定价带来的利润自然会更高。例如，苹果继续上调多款Mac和iPad的售价，其中512GB版MacBook Air从1099美元涨至1299美元。Mac在截至6月的季度里收入103.5亿美元，涨了29%。\n\n当然，涨价不是PC厂商赚钱的根本原因，毕竟涨价也压制了消费级市场的出货意愿。归根结底，真正托举起头部厂商财报业绩的还是AI，一端是AI基础设施业务，另一端是单价数万元的高端AI PC。\n\n以戴尔为例，2027财年第二财季报告，戴尔营收469.71亿美元，同比增长58%，其中，AI服务器业务表现突出，订单金额达到609亿美元，确认收入达到164亿美元，已经超过整个PC相关业务的收入。\n\n无独有偶，截至6月底的季度，联想ISG业务（包括传统服务器、AI服务器和存储）收入同比增长98%，营业利润达到7.77亿美元。AI服务器项目储备540亿美元，一个季度涨了157%。\n\n而从2024年就火起来的AI PC在消费端承接了产品结构升级的使命。\n\n早在2024年第三季度，Canalys发布的数据就曾显示，当年全球AI PC出货量达到1330万台，占当季度PC总出货量的20%。此后，随着AI时代加速发展，头部厂商不断增加AI PC产品占比。\n\n以联想为例，数据显示，联想的AI PC产品类型，从24/25年第一财季的17款增加到第二财季的28款。到2026年，在IFA 2026期间，联想面向消费端和商务侧再度发布了多款AI PC新品。\n\n不止联想。\n\n根据《华尔街日报》报道，各家厂商都希望通过提高AI PC的产品占比，即增加能够在终端本地进行AI运算的PC产品，来减轻PC市场整体萎缩带来的影响。华硕ProArt P16、戴尔XPS 16 Creator Edition、惠普OmniBook Ultra 16、微星Prestige N16 Flip AI+也都开启了预定。\n\n如果说2024 年普及的初代AI PC，更多是“传统 PC”的营销话术，功能以轻量本地推理、语音转写、文案润色为主，消费者感知弱，溢价空间有限，并没有真正打破PC行业的盈利天花板。\n\n到2026年，英伟达入局PC领域，AI PC 进一步向超高端、Agent化方向的跃迁，定价逻辑也就脱离了消费电子的框架，例如，微软的SurfaceLaptop Ultra裸机顶配版本价格接近5万元；联想AI PC（YOGA Pro 15 RTX Spark高配版）标价42999元。\n\n这无疑是厂商盈利的最大依仗之一。\n\n同时，尽管大盘出货量在下降，但消费者很乐意为AI PC买单。\n\n联想YOGA Pro 15 RTX Spark高配版半小时售罄。至10月18日晚，京东仍然显示“无货”在闲鱼二手交易平台上，更有卖家将高配版挂出了50000元的价格，比官方建议零售价高出约7000元。\n\n那么，AI PC到底能为厂商赚多少钱？\n\n还是以联想为例，按照摩根士丹利的口径，联想普通PC的全球均价约为800美元（折合人民币约5400元），常规PC毛利率约为15.5%，而RTXSpark这类超高端AI工作站机型的毛利率可达22%左右。\n\n反映到营收与利润上：\n\n“经济杂志”记者测算，假设联想YOGAPro15出货量为200万台（约占联想PC年出货的3%），为IDG带来约752亿元增量收入、172亿元增量毛利，单机增量毛利率约23%，推升IDG毛利率约0.9至1.3个百分点、运营利润率约0.8至1.3个百分点。\n\n这组数据值得玩味的地方在于：仅占出货量3%的超高端机型，就能撬动一个头部厂商PC业务近1个百分点的利润率。这笔商业账算得越精准，那个以“出货量论英雄”的PC黄金时代，就越显得恍如隔世。\n\n悬而未决的英伟达“变数”\n\n就目前来看，各大机构十分看好AI PC。\n\nOmdia发布报告显示，预计2027年AI PC将占全球PC出货量的60%，到2030年进一步提升至79%。高盛则预计2026年AI PC出货量将达到1.5亿台，同比增长39%，占全部PC的59%，到2028年出货量将近2亿台，市场渗透率82%。\n\n消费市场上首发售罄、二手加价的盛况似乎更助推了AI PC加速取代传统PC的趋势。\n\n然而，会为AI功能更换电脑的人有多少呢？\n\n根据Omdia的调查，69%的PC办公用户愿意为本地AI处理能力支付更高价格，但只有9%的用户会因为AI功能更换电脑。更重要的是，头豹研究院2025年调研数据显示，AI PC的核心硬件NPU，在许多主流的软件中并未得到有效调用。\n\n这意味着用户在支付了硬件溢价后，并未获得一定的AI体验提升。\n\n2026年6月，英伟达宣布推出RTX Spark，正式入局PC芯片，一举引起PC厂商狂欢。微软、戴尔、惠普、华硕、联想、微星将相继推出搭载这款芯片的全新Windows 整机。例如，联想YOGA Pro 15 RTX Spark、华硕ProArt创16。\n\n新一代AI PC比之从前有进益了吗？\n\n从当前各大科技博主的测评来看，RTX Spark笔记本在GPU性能、本地大模型推理、大容量统一内存方面具备显著优势，尤其适配需本地运行大模型的开发者与创作者群体。但实测也暴露了诸多问题：\n\nWindows on Arm架构的软件兼容性存在短板，部分游戏与专业应用表现欠佳。\n\n高负载场景下的续航、发热及风扇噪声表现均不尽如人意。另外，英伟达重点宣传的本地Agent体验不佳，使用Hermes Agent和本地Qwen模型生成新闻简报，耗时约10分钟，消耗了10%的电量，最终效果不如云端Claude。\n\n诚然，体验层面的短板并非不可修复的硬伤，跟着以后的技术迭代大概率会逐步补齐。\n\n需要担心的是，在几款RTX Spark笔记本发布不久后，英伟达就迎来了黄仁勋“风波”。\n\n黄仁勋是英伟达杀入PC市场的核心操盘手，RTX Spark从架构定义、生态合作到落地节奏，全程由他亲自推动。TrendForce预估，RTX Spark相关产品2026年出货量约在20万台以内；随着生态系统成熟，2027年有望放大到100万台。\n\n时至今日，黄仁勋退场，海内外多家媒体开始担忧：未来，英伟达是否还会继续加码消费级项目？\n\n其中，RTX Spark的命运已经引起了数家媒体预测。例如，Omdia的PC分析师Kieren Jessop直言：短期内消费者不会感受到太多变化，但未来两三年值得警惕。\n\n毕竟消费级业务的商业回报远远不及AI数据中心，还需要持续投入。\n\n11月18日，英伟达公布了2027财年第三财季（截至2026年10月25日）的财报，收入为1158亿美元，同比增长103%，环比增长20%；净利润为653亿美元，同比增长105%，环比增长9%。\n\n搭载RTX Spark的联想新一代AI PC已开始出货，英伟达将这项进展列入边缘计算业务。\n\n本季度，该业务实现营收82亿美元。对比之下，数据中心业务收入达到了创纪录的1076亿美元，首次突破千亿美元，收入占比达到约93%，同比增长110%，环比增长21%。\n\n临时接任CEO的克雷斯出身CFO，英伟达往后的每一笔投入、营收只怕都会算得更严苛。\n\nPC厂商们的心境在此刻变得格外讽刺。\n\n这大抵就是PC行业逃不开的宿命：几十年来，从未真正掌握自己的叙事权。早年靠英特尔的摩尔定律推着迭代，后来靠微软的系统升级拉动换机，如今撞上AI浪潮，依旧要仰仗芯片巨头的战略倾斜才能分到增长红利。\n\n陷在存量困局的PC行业，随着一个人的离去，又要迷茫了。\n\n这也说明了PC行业一个残酷现实：当叙事权握在别人手里，增长的想象空间随时都可能会收缩。如今，AI带来的增量红利正变得不确定，那么降本就成了PC厂商更可控的抓手，而一场围绕产能的辗转腾挪其实早已开始。\n\n产能回迁的“零和博弈”\n\n未来，消费者会为什么样的电脑买单？\n\nCounterpoint高级分析师指出，AI电脑、高端显示器和差异化产品仍有机会，但最终胜出的企业必须同时具备创新能力、有竞争力的价格、严格的供应链管理，以及对消费者和企业具有吸引力的产品价值，四项全能，缺一不可。\n\n其中，价格、供应链管理在这个PC物料成本、终端售价越来越高的时代显得尤其重要。2025年第一季度，CPU、DRAM和SSD三大核心部件占整机物料成本的45%；到2026年第三季度，占比已经达到68%。\n\n当前各大PC厂商似乎只剩下了两个主要任务：省钱、赚钱。\n\n这也导致全球PC厂商的生产线即将发生新的变化。曾经，我国是全球电子行业最大的代工生产地区之一，也诞生了台系的富士康、广达电脑、仁宝电脑‌、‌和硕联合，大陆系的华勤技术、立讯精密等头部企业。\n\n后来，由于国内代工成本上升，PC厂商开始将生产线往更廉价的泰国、越南迁移。据悉，惠普甚至计划将最多七成产能迁出我国。\n\n如今，随着PC物料成本水涨船高，泰越基地配套不足的问题被放大，物流周期和库存成本叠加进来，原本低劳动力成本的优势被一点点吞噬。TrendForce指出，PC厂商正在重新评估新兴生产基地的物流、采购和供应链管理成本。\n\n反观我国，有成熟的制造业人才、较低的生产成本以及完整的电子产业链。\n\n10月28日，《日经亚洲》援引消息称，包括惠普、华硕、宏碁在内的全球PC厂商正将部分生产线从泰国和越南迁回我国，重新启用我国代工厂来应对不断飙升的零部件成本，并提高生产效率。\n\n从订单上来看，确实如此。\n\n根据DIGITIMES报道，华勤技术将在2027年为惠普代工一款消费级笔记本，这是其承接的第七个惠普笔电项目；立讯精密则拿下了戴尔高端轻薄本XPS13的代工订单，并计划于2027年进入惠普游戏本供应链。\n\nPC厂商在寒冬中决定到我国产业集群的怀抱，这是不争的事实。TrendForce的数据显示：2025年，全球约24%的笔记本电脑在我国境外生产。2026年这一比例预计下降至21%，2027年甚至可能跌破20%。\n\n但这真的是一笔稳赚不赔的“回头账”吗？\n\n值得一提的是，由于台系代工巨头跟PC厂商一样，把大部分产能分给了AI服务器，此轮回迁，承接回流产能的主力，不再是传统台系代工厂，而是立讯精密、华勤技术等大陆厂商。\n\n据悉，华勤在2026年半年报业绩说明会上预计全年笔记本出货量达2000万台，上半年笔记本营收同比增长超过50%，出货规模已直逼中国台湾第二大笔电代工厂仁宝。\n\n新一轮产能回迁，或许会加速PC核心零部件的国产替代进程。\n\n7月份，联想笔记本首次预装长江存储SSD登陆美国市场；同时，据《日经亚洲》报道，惠普已开始对长鑫存储的DRAM产品进行认证；戴尔同样开始对长鑫存储的DRAM产品进行认证；凤凰网科技引外媒消息报道，苹果公司正与长江存储和长鑫存储谈判。\n\n这意味着国产存储器供应链正式打入主流国际PC终端。\n\n另一方面，国际PC厂商向国内产业集群要效率、降成本的同时，其实也是在为本土竞争对手增加崛起的动力：因为成熟的代工体系、完善的零部件供应链、规模化的制造能力，最终并非只服务于国际品牌，同样也会服务于正在快速崛起的本土品牌。\n\n这是一场互利共生，也注定是此消彼长的博弈。\n\n总而言之，从以出货量论英雄的黄金时代，到靠高端溢价与AI业务托举利润的存量周期，PC行业最终花了十几年完成了一场价值转向，旧的增长逻辑已经失效，而新故事、新格局，正在巨头们的精心算计中悄然酝酿。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"生活","total":19,"items":[{"id":"cddd0e0d7a0","title":"TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女 鄧凱文澎湃上圍搶鏡 陳自瑤陳煒晒人妻魅力","url":"https://www.stheadline.com/film-drama/3638904/TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女-鄧凱文澎湃上圍搶鏡-陳自瑤陳煒晒人妻魅力","summary":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視廣播城隆重揭幕！","summary_short":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視廣播城隆重揭幕！","digest":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚在將軍澳電視廣播城隆重揭幕","points":["TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視廣播城隆重揭幕","今年適逢59周年台慶，除了晚會節目陣容鼎盛，每年最受矚目的「台慶紅地氈」環節亦將於傍晚率先登…","屆時無綫集團全台俊男美女、當紅小生及人氣花旦將會盛裝出席，在鎂光燈下爭妍鬥麗…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:28:22+08:00","size":2,"keywords":[],"body":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚（19日）在將軍澳電視廣播城隆重揭幕！今年適逢59周年台慶，除了晚會節目陣容鼎盛，每年最受矚目的「台慶紅地氈」環節亦將於傍晚率先登場。屆時無綫集團全台俊男美女、當紅小生及人氣花旦將會盛裝出席，在鎂光燈下爭妍鬥麗，展現最時尚華麗的一面。\n《星島頭條》將會全程直擊紅地氈的每一個精彩瞬間，並在本文為大家帶來最快、最新的現場實況！想第一時間飽覽女星們的性感戰衣與現場大合照，敬請收藏本頁密切留意「不斷更新」報道！\n《萬千星輝賀台慶2026》紅地氈直播資訊\n【不斷更新】直擊台慶紅地氈現場盛況\n點擊重溫TVB台慶2025紅地氈高清圖輯\n相關閱讀：萬千星輝賀台慶2026懶人包｜一文睇清TVB台慶表演焦點 汪明荃羅嘉良許志安坐鎮 附直播詳情\n《萬千星輝賀台慶2026》紅地氈直播資訊\n紅地氈盛況直播時間： 2026年11月19日（星期四）下午5時45分起\n網上直播及電視頻道：\n 網上平台： TVB官方YouTube頻道、娛樂新聞台Facebook專頁及YouTube頻道、東張+\n 電視平台： myTV SUPER 33台、無綫娛樂新聞台\n返回目錄\n【不斷更新】直擊台慶紅地氈現場盛況\n《萬千星輝賀台慶》紅地氈有多位女藝人性感亮相，向來身材出眾的鄧凱文華麗登場，超深V剪裁將其傲人上圍曲線表露無遺，頸間配戴廿多萬鑽飾更為整體造型增添幾分貴氣與亮點，性感又不失華麗感，成為傳媒鏡頭追逐的焦點。鄧凱文坦言為超低胸裙辛苦keep fit要廿四小時禁食，但忍不住偷食蒸水蛋，覺得打扮超性感不需事前問另一半，雖然未有男友，希望將來獲另一半信任工作需要。同樣低胸現身的陳楨怡因天氣變冷也要拿暖包，但未為着晚裝節食，更食海南雞飯，平時都有做運動修身，為配合台慶劇《玫瑰戰爭》着紅黑色調。以黑白造型示人的主持梁麗翹，以及身穿粉紅色晚裝、頭戴后冠的應屆港姐季軍李澤欣，同框畫面相當養眼。\n直擊台慶紅地氈現場盛況 Part1：\n 關嘉敏拿到晚裝已開始節食\n低胸露腰的關嘉敏拿到晚裝已開始節食，笑言無情飲水飽，騷長腿的李芷晴也只吃雞胸和灼菜，但演出的衫更性感。談到《東周刊》獨家拍到《女神2》求愛勇者關經翰帶練樂儀返豪宅過夜，關嘉敏表示私下有聯絡他，肯定他單身，據知他是相約一班朋友回家看《女神2》，讚他為人紳士。\n陳瀅和周嘉洛黑白配襯絕現身\n陳瀅和周嘉洛黑白配襯絕現身，陳瀅指是公司安排，多謝大家鍾意二人同行，嘉洛笑言求之不得，緋聞則不了了之，真感情不是今日話題，聽到被指二人合襯，嘉洛即面紅，談到陳瀅生日，他坦言已食幾餐飯但沒單獨約她。陳瀅笑言留意到嘉洛好多廣告，指他過界連美容都拍，令她有少少不舒服，問到有否獲嘉洛送護膚品，嘉洛又面紅指她都有大把護膚品。陳瀅又叮囑嘉洛今晚演出時小心安全。\n周嘉洛為劉穎鏇改名「三分鏇」\n「三分鏇」劉穎鏇笑言聽到周嘉洛為她改的外號也嚇一跳，身旁的張振朗讚她球技犀利，爆她曾入六次三分球是公司籃球隊MVP，搶分搶曝光，打波、演戲、跳舞都好看，今次一班人表演跳舞有想起當年藝訓班。談到惡搞《玫瑰戰爭》片尾曲，振朗笑言自己舉手扮姚子羚，覺得她條眉最有戲，扮到抽離不到變姚子眉，劉穎鏇讚似AI好笑，期待他即場表演，振朗笑言要加騷錢。問到在紅地毯不時以手抽裙的黃婧靈是否瘦了，她表示沒上磅但視覺似獲了5公斤，因最近吃得清淡，不時抽裙因裙面珠片重，驚走光。\n直擊台慶紅地氈現場盛況 Part 2： \n未有車的游嘉欣想抽中車\n郭柏妍和戴祖儀騷長腿，戴祖儀坦言凍到熱情都抵擋不住，讚身邊的游嘉欣修身成功，郭柏妍則自嘲肥，戴祖儀自認有胸肌，想打陰影都難，又指自己多女朋友所以不需男朋友。三人都想中台慶大獎，戴祖儀坦言未中過獎，覺得今年有機會，叫姊妹等等，未有車的游嘉欣想抽中車。\n馬國明再遇「安心事件」主角許志安不尷尬\n高海寧露背和雙肩偕黑馬王子馬國明行紅地毯，馬國明歎從來無抽獎運，多年來連擦膠都未抽中過，只羸過豐胸禮券，若高海寧中獎一定要她請食飯，高海寧則覺得有運曾在草蜢遊戲節目抽中獎金，希望今晚抽中車。馬國明有份參演《難兄難弟》歌舞大讚是經典，曾跟羅嘉良合作《富貴門》，狂NG仍獲對方鼓勵，讚是好前輩會銘記一世，高海寧未同羅嘉良合作但有幸到訪其北京住所讚有品味，多謝對方鼓勵和關心，馬國明爆羅嘉良愛玩音響，一部音響都貴過自己屋企。問到馬國明再遇當年「安心事件」主角許志安，他表示未知在演出環節後會否留低睇騷，等公司安排，坦言知安仔壓軸表演，也知大家想法，但不尷尬，多年前的事已過去，今日大家一齊幫TVB慶生，絕對不尷尬。\n直擊台慶紅地氈現場盛況 Part 3： \n返回目錄\n回顧去年經典！重溫2025台慶紅地氈最性感吸睛時刻\n在今晚盛典正式揭幕前，不妨先重溫去年的紅地氈經典瞬間！去年無綫58周年台慶紅地氈可謂看點十足，女星們為了搶鏡各出奇謀，多個性感造型至今仍令網民津津樂道，即刻點擊以下圖輯重溫去年的華麗戰衣：\n 「東張女神」奇招突圍：去年「東張女神」集體行紅地氈成為全場焦點，其中黎寬怡以一雙矚目的超大翅膀晚裝搶盡風頭；而陳曉彤更以一襲黑色高衩透視裝上陣，裙擺設計直逼大腿盡頭，若隱若現的視覺效果成功突圍！\n 美魔女高貴性感：陳煒去年以白色深V貼身晚裝現身，珠光閃爍，盡顯優雅高貴的「美魔女」風範。\n 新生代大鬥性感：宋宛穎以入行以來最性感的谷胸透視裝亮相，黃嘉雯則以黑色閃片晚裝露腰開胸，大展美好身段；波波黃婧靈更以白色低胸透視裙騷長腿兼大方展露優美曲線。\n返回目錄\n點擊重溫萬千星輝賀台慶2025紅地氈完整高清圖輯：\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女 鄧凱文澎湃上圍搶鏡 陳自瑤陳煒晒人妻魅力","url":"https://www.stheadline.com/film-drama/3638904/TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女-鄧凱文澎湃上圍搶鏡-陳自瑤陳煒晒人妻魅力","source_display":"星島頭條","published_at":"2026-11-19T20:28:22+08:00","category":"生活","digest":"TVB年度壓軸盛事《萬千星輝賀台慶2026》於今晚在將軍澳電視廣播城隆重揭幕"},{"title":"TVB台慶2026紅地氈丨俞可程避訪問鐵定缺席 六女神雍容華貴 阮嘉敏超暖心保護性感郭珮文","url":"https://www.stheadline.com/film-drama/3638985/TVB台慶2026紅地氈丨俞可程避訪問鐵定缺席-六女神雍容華貴-阮嘉敏超暖心保護性感郭珮文","source_display":"星島頭條","published_at":"2026-11-19T19:30:00+08:00","category":"生活","digest":"《萬千星輝賀台慶2026》於今晚在將軍澳電視廣播城隆重揭幕…"}]},{"id":"c2fd48e689f","title":"香港公開羽毛球錦標賽｜吳英倫兩局不敵「世三」安東臣 賽後不甘心：明年要展現一個更強的自己","url":"https://www.stheadline.com/realtime-sport/3638945/香港公開羽毛球錦標賽吳英倫兩局不敵世三安東臣-賽後不甘心明年要展現一個更強的自己","summary":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」、丹麥球手安東臣相遇，最終兩局直落見負，提前結束香港站賽事。","summary_short":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」…","digest":"世界排名20的港隊男單人氣小師弟吳英倫周四在體藝館續戰香港公開羽毛球錦標賽…","points":["世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球…","賽後，Jason直言：不甘心，希望新一季展現一個更強的自己","今日吳英倫開賽已進入狀態，半場暫停（interval）後手握11:4的優勢"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:19:34+08:00","size":2,"keywords":[],"body":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」、丹麥球手安東臣相遇，最終兩局直落見負，提前結束香港站賽事。賽後，Jason直言：不甘心，希望新一季展現一個更強的自己。\n首局大比數領先遭逆轉\n今日吳英倫開賽已進入狀態，半場暫停（interval）後手握11:4的優勢。尾段吳英倫已17:7領先之際，安東臣改變策略，積極控網前不願挑球，限制Jason進攻，竟然打出一波13:1的攻勢奇跡反超至20:18，唯一失1分還是安東臣自己發球偷後場出界。最終安東臣以21:19逆轉，拿下首局。\n次局難挽頹勢再敗\n第二局開局吳英倫經過調整，先以4:0領先。後被安東臣追平，兩人纏鬥至12:12，安東臣又是數次連續得分拉開比數，最後Jason力追無果，以15:21再落敗。安東臣以總局數2:0晉級8強。\nJason今年做出突破的成績，九月在深圳舉行的中國大師賽首次取得「超級750」的冠軍，本月（11月）初在南韓公開賽（超級500）亦奪得亞軍，世界排名升至新高的第20位，僅次香港一哥李卓耀一位；但今季香港站最後一場比賽，在領先大比數下被對手反勝，Jason坦言「不甘心」。\n爾郡耀攝\n爾郡耀攝\nJason坦言「不甘心」\n「今日在首局我在領先的情況下沒好好把握，我第一局打得不錯，但在領先後失去集中力，對方改變戰術，我開始出錯，可能太想贏，沒放平心態去打，我知這是不應該的。」Jason跟安東臣在九月及十月期間曾對過兩次，各有一勝一負，今次在香港主場見負，Jason最「不甘心」。\n「真的不甘心，今日在首局我在領先下沒好好把握，我第一局打得不錯，但領先後失去集中力，對方改變戰術，我開始出錯，可能太想贏，沒放平心態去打，我知這是不應該的。」\nJason坦言今季的成績及排名給予自己不少信心，知道自己也可以在大舞台上贏比賽，從今仗香港站的「不甘心」，他希望新一季展現一個更強的自己，尤其一月開始採新制的15分，五月份亦展開為期一年的洛杉磯奧運積分周期，他說：「今年有不錯的成績，明年都是繼續想贏比賽，未來一個月沒比賽，我會繼續去提升自己，新一季給一個更強的自己大家看，去證明我是可以去爭取勝利的。」\n記者：爾郡耀、徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"香港公開羽毛球錦標賽｜吳英倫兩局不敵「世三」安東臣 賽後不甘心：明年要展現一個更強的自己","url":"https://www.stheadline.com/realtime-sport/3638945/香港公開羽毛球錦標賽吳英倫兩局不敵世三安東臣-賽後不甘心明年要展現一個更強的自己","source_display":"星島頭條","published_at":"2026-11-19T17:19:34+08:00","category" 騷結實腹肌，但他竟「嫌棄」自己太大隻，Stanley稱：「因為我個角色係60、70年代，不應該這麼大隻，但拍攝時間有限，沒時間減磅。」\n邱士縉對票房抱平常心\n至於可有票房壓力？Stanley坦言文藝題材向來具一定挑戰性，加上電影改編自原著小說且帶有濃厚馬來西亞背景，若觀眾事前看過小說或熟悉當地文化會更有共鳴。不過他對此抱持平常心，認為電影已成功在馬來西亞、台灣及多倫多等地放映並獲得關注，能夠將作品帶給不同地區的觀眾已屬難得。\n邱士縉排練順利\n除了電影宣傳，MIRROR演唱會亦進入倒數階段。Stanley透露目前排練進度比預期順利，時間充裕，甚至偶爾能提早收工休息。被問及今次會否在舞台上大派福利「騷肌」？他大賣關子笑稱雖然無刻意安排，但透露今次個人挑戰難度極高，其中一隻舞步「跳到就嚟斷氣」，屆時觀眾定能看到他全力以赴的表現，他笑：「會見到我跳完個嘴唇變白！」此外，他亦盛讚即將推出的演唱會主題曲節奏明快、極具氣氛，定能炒熱全場。\n邱士縉回應紀念品「錯體」\n至於演唱會紀念品被指出現「錯體」，其中一款襟章更印錯字及出現亂碼，Stanley直言：「聽公司說是AI圖案有少許出錯，不過他們已馬上修改，但我們的實物貨品是沒問題的。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6a7a231bad","title":"TVB台慶2026‧不斷更新｜羅嘉良「奇哥」再現 梁敏巧跑「東張女神盃」身材太好大落後？","url":"https://www.stheadline.com/film-drama/3638563/TVB台慶2026不斷更新羅嘉良奇哥再現-梁敏巧跑東張女神盃身材太好大落後","summary":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！","summary_short":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！","digest":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日盛大舉行","points":["TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行","今年適逢TVB 59周年，台慶以「TVB與你行得更近，走得更遠」為口號，除了一眾視帝…","《星島頭條》為讀者一文睇清今屆台慶的直播詳情、紅地氈時間及全晚焦點環節…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:45:08+08:00","size":1,"keywords":[],"body":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）盛大舉行！今年適逢TVB 59周年，台慶以「TVB與你行得更近，走得更遠」為口號，除了一眾視帝、視后及全台逾百藝員傾力演出外，更有久未回巢的羅嘉良重返舞台重溫經典、許志安擔任壓軸表演嘉賓。《星島頭條》為讀者一文睇清今屆台慶的直播詳情、紅地氈時間及全晚焦點環節，今晚將會為大家不斷更新全晚盛況及得獎名單！\n《萬千星輝賀台慶》播放及直播詳情\n《萬千星輝賀台慶》全晚焦點環節【不斷更新】\nTVB台慶2026表演環節介紹\n《萬千星輝賀台慶》播放及直播詳情\n TVB台慶舉辦日期：2026年11月19日（星期四）\n 紅地氈盛況直播時間：下午5時45分起\n 紅地氈直播平台：TVB官方YouTube頻道、娛樂新聞台Facebook及YouTube、東張+、myTV SUPER 33台\n 台慶典禮現場直播時間：晚上7時45分起\n 電視直播頻道：81台翡翠台\n 大會司儀陣容： 汪明荃擔綱領軍，率領陳貝兒、朱凱婷、洪永城、黃翠如、麥美恩、林溥來、陸浩明、鄭衍峰、周奕瑋、林秀怡、孔德賢、潘靜文組成強大主持組合\n相關閱讀：TVB台慶2026紅地氈丨直播資訊懶人包 小生花旦爭妍鬥麗（附去年紅地氈圖輯重溫）返回目錄\n《萬千星輝賀台慶》全晚焦點環節【不斷更新】\n20:15 在首辦的「東張女神盃」400米跑中，一眾「東張女神」同場決戰。梁敏巧在比賽中大落後，即場被大會司儀陸浩明當眾取笑，指她未知是否因為「身形太好（上圍太豐滿）」而產生阻力，以致影響其跑步速度。而壓軸宣布賽果時，汪明荃亦忍不住開口嘲笑，指獲得第5名的梁敏巧與第6名的何沛珈，在後半段慢條斯理地跑步，笑言兩人簡直就像是在「鬥慢」一樣，喜感十足！\n19:56 接着回到錄影廠，視帝羅嘉良「回娘家」與後輩一同表演，重現《難兄難弟》角色「奇哥」經典。\n19:50 一眾TVB小生與花旦，於隧道熱舞，人才濟濟，活力十足。\n19:45 TVB高層參與亮燈儀式，為TVB 59周年台慶揭開序幕。而一眾司儀包括汪明荃與朱凱婷、麥美恩、林溥來、陸浩明、鄭衍峰、周奕瑋、林秀怡、孔德賢等，齊聚拍開場影片，大放笑彈。其中，麥美恩驚喜上演一幕「走出雪櫃」的幽默表演，效果極具視覺衝擊且喜感十足，成為開場的一大亮點！\n返回目錄\nTVB台慶2026表演環節介紹\n1. 汪明荃領軍致敬幕後功臣 盡顯驚人記憶力\n今年台慶其中一個最感人的焦點環節，是以專業與誠意向默默耕耘的幕後英雄致敬。環節由效力TVB達55年、塑造過逾80個經典角色造型的汪明荃（阿姐）領軍，帶領觀眾深入了解梳化服團隊的付出。在致敬片段中，汪明荃展現驚人記憶力，逐一細數梳化服老中青三代同事的名字、專長以及合作過的難忘造型，流露深厚情誼。此外，視帝譚俊彥、視后龔嘉欣、一眾藝人及神秘嘉賓亦會以不同形式向武指、特技人員、攝製隊及舞台設計團隊等致敬。\n2. 羅嘉良相隔23年回娘家 重現1997年《難兄難弟》\n自2003年離巢後，視帝羅嘉良相隔23年再度參與台慶。他將領軍數十位男女藝員，進行大型歌舞環節，並重演1997年經典神劇《難兄難弟》的精彩場面。而台慶的大型歌舞表演亦邀得陳煒、姚子羚、陳敏之、傅嘉莉四大「炫舞女王」聯手開騷，場面浩大。\n相關閱讀：羅嘉良為台慶2026排練 撐張家輝唔做歌星太浪費 讚劇集拍檔張曦雯聰明\n3. 逾80位藝人一鏡到底！隧道Opening震撼曝光\nTVB率先公開了全台逾80名藝人參與拍攝的隧道Opening片段。片段中多個歌舞大場面均採用「一鏡過」（One Take）直落拍攝，極具難度。短短數秒的鏡頭內有大量走位及動作，足見台前幕後的排練心機，屆時吉祥物TVBuddy亦會穿插其中與藝人互動。\n相關閱讀：萬千星輝賀台慶丨劉穎鏇在未通車隧道狂跑 同張振朗劉佩玥企正C位\n4. 《中年好聲音》破天荒合體 譚輝智黃博挑戰Rap跳舞\n人氣急升的《中年好聲音》成員譚輝智與黃博將破天荒首度合作，挑戰集唱歌、跳舞與Rap於一身的貼身歌舞演出，為觀眾帶來極具新鮮感的舞台演出。\n相關閱讀：萬千星輝賀台慶｜譚輝智望與怕醜囡囡父女檔同台 孖黃博台慶跳辣身舞兼Rap歌\n5. 「魔音女團」MYNT 聯乘韓國學院唱跳新歌\n由宋宛穎、倪嘉雯、莊子璇、倪樂琳、喬美莎及盧映彤組成的「魔音女團」MYNT，將會聯同YS韓國偶像學院的名師及尖子Lenna T.、Mia、Soe、Heily Hu及Venus，在台慶舞台上合力唱跳MYNT的第三首全新主打單曲〈Tic Toc〉。\n相關閱讀：萬千星輝賀台慶｜魔音女團首度公開跳唱新歌〈Tic Toc〉 預告月底全員赴韓接受唱跳特訓\n6. 攜手錢家班亡命挑戰！四大小生呈獻極速特技\n張振朗、劉穎鏇、周嘉洛、朱敏瀚將會聯手著名特技團隊「錢家班」，呈獻高難度動作及飛車表演項目「極速狂奔Speed and Stunt」，以驚險刺激的特技演出向一眾幕後特技英雄致敬。\n相關閱讀：朱敏瀚為TVB台慶綵排發生意外 兩米高墮地現驚險一幕 道具疑因支撐力不足突然倒塌\n7. 首辦「東張女神盃」 400米跑決賽誰是「跑女」之王\nTVB台慶2026首度增設體育競技環節「東張女神盃」，進行400米田徑決賽。一眾《東張西望》人氣主持陳庭欣、何沛珈、梁敏巧、李旻芳、黎寬怡及甘詠寧將會全副武裝化身「跑女」，在台慶的大日子同場競技，爭奪首屆女神盃寶座。\n8. 許志安壓軸Medley經典重現\n許志安將擔任壓軸表演嘉賓，為觀眾帶來一連串耳熟能詳的串燒經典Medley，用歌聲掀起全晚高潮。同場亦有競技趣劇《台慶喎！有嘢唔見咗》，實行全晚笑聲不斷。\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c670358b515","title":"纪录片《百年巨匠-秦含章》杀青 为民族工业巨匠立传","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734883.shtml","summary":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。","summary_short":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。","digest":"人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行","points":["中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京…","该片总导演夏蒙表示，在产业一线撑起民族工业的巨匠同样值得铭记","1931年毕业于上海国立劳动大学农学院，随后负笈欧洲研习农学、微生物学与酿造学"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T20:37:03+08:00","size":1,"keywords":[],"body":"中新网北京11月19日电 (记者 应妮)人物传记纪录片《百年巨匠-秦含章》杀青仪式18日在京举行。该片总导演夏蒙表示，在产业一线撑起民族工业的巨匠同样值得铭记。\n\n纪录片《百年巨匠-秦含章》杀青仪式海报。　百年巨匠文化传播有限公司供图\n\n　　秦含章(1908-2019)，生于江苏无锡，是我国食品工业科学家、一代酿酒泰斗。1931年毕业于上海国立劳动大学农学院，随后负笈欧洲研习农学、微生物学与酿造学。1936年学成归国，1950年出任中央人民政府食品工业部参事，1960年创办轻工业部食品发酵工业科学研究所并任所长。著书40余部，《新编酒经》被誉为“中国酒文化第一书”。茅台集团原董事长季克良、二锅头酿造技艺非遗代表性传承人高景炎等行业名家，皆出其门下。\n\n　　中国酒业协会秘书长何勇表示，杀青是一卷胶片的收束，更是一部精神长卷的总结——一位跨越三个世纪、享年112岁的老人，将从历史深处走到亿万观众的眼前。秦含章先生留给我们最珍贵的东西，是把传统当作根、把科学当作魂的精神。\n\n　　中国文学艺术基金会副理事长兼秘书长周冰表示，作为《百年巨匠》纪录片资助方和出品方，基金会的使命就是让文艺之花更加绚烂绽放。《百年巨匠》里的每一位人物都是中国的艺术灵魂。\n\n　　该片总导演夏蒙分享创作理念时说，匠人是把一件事做到极致；而巨匠是在极致之上，拥有格局与担当。秦含章有科学家的严谨，有读书人的风骨，有产业报国的赤诚。他一个人打通了传统酿造和现代科学之间的壁垒，让千年酒文化在现代工业时代站稳脚跟，走向更远的未来。“我们不只有书画文学的巨匠，在产业一线还有撑起民族工业的巨匠，他们同样值得被时代铭记。”\n\n　　据了解，摄制组先后赴北京、山西、无锡、重庆、南京、武汉等地取景，并远赴德国柏林、法国波尔多、比利时等秦含章当年求学与工作之地实地拍摄，还采访了季克良、高景炎、宋书玉等十余位行业专家和亲历见证者。(完)\n\n 【编辑:田博群】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c72923f3015","title":"TVB台慶2026丨羅嘉良驚喜重返TVB 打頭陣獻唱〈奇哥〉兩經典歌勾集體回憶","url":"https://www.stheadline.com/film-drama/3638995/TVB台慶2026丨羅嘉良驚喜重返TVB-打頭陣獻唱奇哥兩經典歌勾集體回憶","summary":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）在將軍澳電視廣播城隆重舉行，慶祝TVB 59周年。","summary_short":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）在將軍澳電視廣播城隆重舉行…","digest":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日在將軍澳電視…","points":["TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）在將軍澳電…","久未回巢的三屆視帝羅嘉良，穿上一襲白色型格西裝外套，以及太陽眼鏡，於亮光儀式後…","羅嘉良一登場便勾起全場高呼，獻唱其經典代表作〈奇哥〉及〈難兄難弟〉，歌聲一出…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:34:01+08:00","size":1,"keywords":[],"body":"TVB台慶2026丨無綫集團年度盛事《萬千星輝賀台慶》於今晚11月19日（星期四）在將軍澳電視廣播城隆重舉行，慶祝TVB 59周年。久未回巢的三屆視帝羅嘉良，穿上一襲白色型格西裝外套，以及太陽眼鏡，於亮光儀式後，率領全台逾200位藝人打頭陣演出。\n羅嘉良炒熱氣氛\n羅嘉良一登場便勾起全場高呼，獻唱其經典代表作〈奇哥〉及〈難兄難弟〉，歌聲一出，瞬間將氣氛推向頂峰，逾200位藝員包括關嘉敏、陳楨怡、游嘉欣、劉佩玥、周嘉洛、林夏薇、高海寧、陳豪、馬國明、譚俊彥、羅子溢等分批出場，跟著羅嘉良演出起舞，場面壯觀。\n相關閱讀：萬千星輝賀台慶2026懶人包｜一文睇清TVB台慶表演焦點 汪明荃羅嘉良許志安坐鎮 附直播詳情\n相關閱讀：TVB台慶2026紅地氈丨俞可程避訪問鐵定缺席 六女神雍容華貴 阮嘉敏超暖心保護性感郭珮文\n汪明荃羅嘉良聚舊\n表演結束後，大會司儀「阿姐」汪明荃與羅嘉良溫馨相擁，二人久未碰面，汪明荃興奮地對羅嘉良說：「你好，好耐冇見啊！歡迎你返嚟TVB！」而羅嘉良亦顯得十分激動表示：「好開心啊！非常Happy！」汪明荃又為羅嘉良打氣，連聲說道：「好，加油！加油！」互動真摯。隨後，羅嘉良在全場歡呼下，為台慶抽出第一位幸運兒。\n相關閱讀：TVB台慶2026紅地氈丨樊亦敏索爆唔輸後生女 鄧凱文澎湃上圍搶鏡 陳自瑤陳煒晒人妻魅力","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c83db8cfbb8","title":"Coffee林芊妤重提「殘廁事件」承受大壓力 曾飽受舊愛家暴 誤信「打你係因為愛」","url":"https://www.stheadline.com/film-drama/3638920/Coffee林芊妤重提殘廁事件承受大壓力-曾飽受舊愛家暴-誤信打你係因為愛","summary":"37歲的林芊妤（Coffee）於2018年結婚，婚後與老公翟志榮育有一子一女，近年轉型為人氣瑜伽導師兼KOL，可謂事業愛情兩得意。","summary_short":"37歲的林芊妤（Coffee）於2018年結婚，婚後與老公翟志榮育有一子一女，近年轉型為人氣瑜伽導師兼KOL…","digest":"37歲的林芊妤於2018年結婚，婚後與老公翟志榮育有一子一女…","points":["37歲的林芊妤（Coffee）於2018年結婚，婚後與老公翟志榮育有一子一女…","Coffee日前作客由伍詠薇（伍姑娘）及李凱賢（Brian）主持的HOY節目《九運會客室2》…","Coffee林芊妤走出低谷轉型變百萬KOL"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:30:00+08:00","size":1,"keywords":[],"body":"37歲的林芊妤（Coffee）於2018年結婚，婚後與老公翟志榮育有一子一女，近年轉型為人氣瑜伽導師兼KOL，可謂事業愛情兩得意。Coffee日前作客由伍詠薇（伍姑娘）及李凱賢（Brian）主持的HOY節目《九運會客室2》，大方剖白童年陰影及婚姻生活，期間亦再次主動提及當年的「殘廁事件」。\nCoffee林芊妤走出低谷轉型變百萬KOL\n當年的「殘廁事件」令Coffee形象受損並離開TVB。重提舊事，她坦言當時壓力極大：「咁梗係好大壓力啦！嗰時件事咁大！我覺得我當時係無諗咁多，亦都無計劃要點做。」Coffee透露，在事件發生前她已因病暫停工作，期間為了慳錢而考取瑜伽導師牌照，並開始提供一對一教學。這份因緣際會，最終成為她離巢後的事業新出路，成功轉型為百萬KOL。\n相關閱讀：Coffee林芊妤罕解構「殘廁事件」真相 遭TVB解約面對樂小姐極無助 拒回舊公司：保留少少尊嚴\nCoffee父親重男輕女 體罰釀成童年陰影\nCoffee在節目中提到，自己的愛情觀深受童年被父親體罰的經歷影響。她透露父親思想傳統、工作壓力大，經常對子女施以嚴重體罰；加上重男輕女，她童年時宛如哥哥的「奴婢」，包辦洗碗、拿鞋襪等家務。\n她回憶有次幫父親清潔抽油煙機時割傷腳趾，現場血流如注，家人卻沒有帶她求醫：「我可以體諒佢，我原諒佢當初咁樣。但係細個嗰時，其實我都有好多次會覺得，點解我會喺呢個屋企入面呢？究竟我嘅人生係咪就係咁呢？即係其實都幾黑暗㗎。」\n相關閱讀：Coffee林芊妤消暑夏水禮連環派福利 「水著放題」換泳衣越見少布 火辣身材勁吸睛\nCoffee默默承受初戀家暴\n中學時，Coffee曾因不滿父親體罰而離家出走，其後父親第一次向她道歉並表示：「其實我都是因為好緊張你，好愛你，我先打你。」這句「打你是因為愛」卻深植在她的潛意識中。\n17歲時，Coffee與大她兩歲的初戀男友交往。對方佔有慾極強，經常無故懷疑她，並限制其穿着及外出時間，甚至對她動粗，但Coffee卻選擇默默承受。她直言：「佢會打我，拳打腳踢。佢打咗我幾次，佢話：『我係因為好愛你，我先至會打你。』但係呢句，點解會喺我度生效？因為我爸同我講過呢句說話，我入咗血呀！」幸好，她後來遇到現任老公翟志榮，才真正獲得幸福。\n相關閱讀：Coffee林芊妤揭童年陰影 被家人貼「低能」標籤：覺得我冇得救 爆蘭桂坊「跪街」真相\nCoffee老公「有部署」未婚懷孕\nCoffee與翟志榮在酒吧相識，她當時已覺得對方高大帥氣。兩人拍拖兩年期間，翟志榮曾多次求婚，但Coffee擔心影響剛起步的瑜伽事業而婉拒。\n後來Coffee意外懷孕，她笑指老公其實早有「預謀」，因為對方平日做事非常細心、防範措施一向做足。得知懷孕後，極度自卑的Coffee曾擔心對方只是出於責任而結婚，甚至對老公說：「其實你唔使一定要娶我，我們可以繼續咁，我可以自己照顧小朋友。因為我成日睇到自己好低，覺得無人會想要我、無人會愛我。」直到後來從朋友口中得知，老公在拉埋天窗前早已默默物色及訂購求婚戒指，這份心意才讓她放下心頭大石，安心出嫁。\n相關閱讀：Coffee林芊妤最新內衣福利圖陷走光疑雲 內褲極高衩疑露敏感部位 親理品牌IG老貓燒鬚","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca9cc574fa7","title":"每星期快走3次可改善記憶力！研究證海馬體增2% 附最佳方式防認知障礙","url":"https://www.stheadline.com/health-care/3638521/每星期快走3次可改善記憶力研究證海馬體增2-附最佳方式防認知障礙","summary":"大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」。","summary_short":"大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」。","digest":"大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」","points":["大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」","研究指，每週快走3次，能有效令其掌管記憶的海馬體增大2%","每週3次快走令海馬體增大2% 刺激大腦強化記憶"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T20:00:42+08:00","size":1,"keywords":[],"body":"大家都知道「多走路對身體好」，但你未必知道，規律快走竟然能讓大腦「變年輕」。研究指，每週快走3次，能有效令其掌管記憶的海馬體增大2%！\n每週3次快走令海馬體增大2% 刺激大腦強化記憶\n美國匹茲堡大學與伊利諾大學的神經科學團隊曾發表1項刊登於《美國國家科學院院刊》（PNAS）的里程碑研究，招募120名平均年齡66歲、平日缺乏運動的中老年人進行1年追蹤，結果發現每週快走3次的組別，其掌管記憶的核心腦區「海馬體」平均增大2%，成功逆轉自然老化萎縮的軌跡。\n隨著年齡增長，負責學習、記憶與空間導航的海馬體會逐年自然萎縮，與短期記憶力衰退及患上認知障礙症（俗稱腦退化症）的風險息息相關。實驗中，對照組（僅作伸展運動）的海馬迴在1年內自然縮小了1.4%，但每週進行3次、每次40分鐘中等強度快走的組別卻不減反增：\n研究負責人 Kirk Erickson 教授指出，海馬體體積增大的幅度愈明顯，受試者在記憶力測驗中的進步亦愈顯著，證實大腦結構的物理性改善能直接反映在認知功能之上。\n科學家解釋，快走等中等強度有氧運動能顯著提升體內的「腦源性神經營養因子（BDNF）」。BDNF 猶如大腦的天然肥料，專門負責幫助神經細胞長出新連結、強化神經可塑性、保護腦細胞免受損傷及促進記憶形成；2025年多篇國際期刊系統回顧亦指出，相比其他運動，「步行」最容易讓人長期堅持，且原本最缺乏運動的人開始快走後進步幅度往往最大。\n大腦抗老方法\n6大步行健康好處 抗發炎、穩血糖、防腦退化\n許多人誤以為走路運動量太低、保健效果有限，事實上規律快走能同時帶動身體與大腦的「雙重復甦」，除護腦外更可減低慢性發炎反應、降低血壓、提升胰島素敏感度以穩定血糖、改善心肺耐力、減少壓力荷爾蒙（皮質醇）分泌及提升睡眠品質。面對全球高齡化及認知障礙症患者急增的挑戰，專家建議市民按以下「最佳步行方式」：\n 時間： 每週進行 3 次 快走，每次持續 40 分鐘，並持之以恆至少 12 個月。\n\n 強度： 步行速度應維持在「稍微感到氣喘、但仍能順暢說話」的中等有氧強度，無須昂貴器材或健身室會籍，只需1雙舒適運動鞋即可隨時啟動。\n\n 注意： 若平日完全沒有運動習慣，初學者可先從每次15分鐘起步，再逐步延長至40分鐘；科學家強調，健腦抗老的關鍵不在於一時的高強度衝刺，而在於長期規律持續。\n\n
