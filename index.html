付费中约一半采用“基础订阅+超额用量”的混合模式——这意味着收入上限取决于AI在组织内部被用得多深，而不是卖了几个席位。\n\nWorkBuddy的DAU和Token消耗回答的是另一个问题：个人工作流能不能产生足够高的频次，高到AI成为日常操作里剥不掉的一层。100万亿日均Token给出了肯定的答案。\n\n但“高频”本身不是商业模式。从个人高频到企业级收入，中间隔着订阅转化、组织采购、合规部署、IT集成四道关。腾讯用“最近七天年化”来呈现收入规模，传播上有效，财务审慎性上却留了余地——月度是行业公认的最短合理年化周期，七天数据的波动性不言自明。\n\n两个问题并不互斥，但答案指向的组织能力不同。答好第一个，靠企业销售体系、客户成功和行业解决方案；答好第二个，靠产品体验、增长机制和生态触点。两个都答好，比在任意单一路径上跑出漂亮数据难得多。\n\n陆战变海战，考验才刚开始\n\nWorkBuddy在腾讯财报里的位置值得留意。\n\n2026年三季度，腾讯营收2073.36亿元，同比增长8%，非IFRS净利润同比下降6%；但云服务收入同比增长35%，腾讯明确把WorkBuddy的需求列为驱动力之一。在整体增速放缓的背景下，AI办公产品第一次进入核心财务叙事。这本身就是信号：WorkBuddy不再是一个“尝试性产品”，它扛着腾讯在AI时代从消费互联网向企业服务延伸的期待。\n\n马化腾11月内部讲话里那句“陆战已经变成海战，陆军必须变成海军”，放进这个语境并不夸张。腾讯在AI原生应用第一梯队里的缺位是结构性的：QuestMobile 9月AI原生App月活榜前三分别是豆包4.19亿、千问1.58亿、DeepSeek 1.23亿，腾讯无一入围。WorkBuddy的3235万办公Agent月活，是腾讯在“工作场景”里为数不多能对位的资产。\n\n它必须从“跑得最快的办公Agent”，变成“收得住收入的企业平台”，才能补上腾讯AI版图最薄的一块。\n\n对整个赛道来说，同一天的两组数据给了个清晰的观察框架：豆包工作检验企业付费的可持续性，WorkBuddy检验消费端频次向组织采购的转化效率。两个检验，都还没到终局。\n\nAI办公最终争的，不是一个新品类，而是个人工作流与企业工作流的交汇处。在这儿，DAU和ARR只是某一刻的快照。真正决定格局的，是谁能让AI同时读懂一个人的操作习惯和一个组织的运行规则，再把两者接进同一条工作流。\n\n发布数据的日子会过去。入口之争，才刚进入要证明“留量”而非“流量”的阶段。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8214afe78f","title":"积存金价格跌至“7字头”，银行纷纷提示贵金属市场波动风险","url":"https://www.jiemian.com/article/15357464.html","summary":"11月20日，国际金价跌破3600美元/盎司，与其高度联动的积存金价格随之下探进入“7字头”区间。","summary_short":"11月20日，国际金价跌破3600美元/盎司，与其高度联动的积存金价格随之下探进入“7字头”区间。","digest":"11月20日，国际金价跌破3600美元/盎司…","points":["11月20日，国际金价跌破3600美元/盎司，与其高度联动的积存金价格随之下探进入“7字头”…","截至记者发稿时，工银积存金报769元/克，当日跌幅达3.5%","同日，工商银行发布关于贵金属市场波动风险的提示"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T08:39:47+08:00","size":1,"keywords":[],"body":"11月20日，国际金价跌破3600美元/盎司，与其高度联动的积存金价格随之下探进入“7字头”区间。截至记者发稿时，工银积存金报769元/克，当日跌幅达3.5%。同日，工商银行发布关于贵金属市场波动风险的提示。同日，建设银行、招商银行、宁波银行等也发布相关风险提示。受访人士建议，在金价尚未企稳时不宜一次性重仓抄底，建议以定投方式分批建仓、摊薄成本，把黄金作为资产配置中的防御性配置，而非波段交易工具。（上海证券报）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cfc16de0699","title":"网传零跑A10后备厢被几箱啤酒压穿，零跑回应","url":"https://www.jiemian.com/article/15357470.html","summary":"11月20日晚，针对网传零跑A10后备厢被几箱啤酒压穿底一事，@零跑汽车 发布《关于零跑A10后备厢储物盒的情况说明》称，近日关注到网络上流传的零跑A10后备厢下层储物盒受损的相关视频。","summary_short":"11月20日晚，针对网传零跑A10后备厢被几箱啤酒压穿底一事，@零跑汽车 发布《关于零跑A10后备厢储物盒的情况说明》称…","digest":"11月20日晚，针对网传零跑A10后备厢被几箱啤酒压穿底一事…","points":["11月20日晚，针对网传零跑A10后备厢被几箱啤酒压穿底一事…","公司高度重视，第一时间联系用户并对车辆进行了检测","经核实，本次受损部件为后备厢盖板下方的独立储物盒，系装载物品超过其设计承重上限所致…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T08:39:31+08:00","size":1,"keywords":[],"body":"11月20日晚，针对网传零跑A10后备厢被几箱啤酒压穿底一事，@零跑汽车 发布《关于零跑A10后备厢储物盒的情况说明》称，近日关注到网络上流传的零跑A10后备厢下层储物盒受损的相关视频。公司高度重视，第一时间联系用户并对车辆进行了检测。经核实，本次受损部件为后备厢盖板下方的独立储物盒，系装载物品超过其设计承重上限所致，并非后备厢底板或整车承载结构受损。零跑汽车表示，已与用户充分沟通并获得了用户的理解。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4fd090a3f1","title":"汽车早报｜享界V8上市2小时大定达2216台 阿维塔正式进入瑞士市场","url":"https://www.jiemian.com/article/15352794.html","summary":"中汽协：1-10月销量排名前十轿车生产企业共销售528.5万辆  11月20日，据中国汽车工业协会统计分析，2026年1-10月，销量排名前十位的轿车生产企业共销售528.5万辆…","summary_short":"中汽协：1-10月销量排名前十轿车生产企业共销售528.5万辆  11月20日，据中国汽车工业协会统计分析…","digest":"中汽协：1-10月销量排名前十轿车生产企业共销售528.5万辆  11月20日…","points":["中汽协：1-10月销量排名前十轿车生产企业共销售528.5万辆","11月20日晚，零跑汽车在港交所公告，于2026年11月20日…","据此，公司同意就Opel全新C级SUV向Opel提供工程及开发服务…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T08:33:00+08:00","size":1,"keywords":[],"body":"中汽协：1-10月销量排名前十轿车生产企业共销售528.5万辆\n\n11月20日，据中国汽车工业协会统计分析，2026年1-10月，销量排名前十位的轿车生产企业共销售528.5万辆，占轿车销售总量的68.9%。在上述十家企业中，与去年同期相比，上汽股份和特斯拉销量呈不同程度增长，其他企业销量均呈不同程度下降。\n\n零跑汽车：同意就欧宝全新C级SUV向其提供工程及开发服务\n\n11月20日晚，零跑汽车在港交所公告，于2026年11月20日，公司与Opel（欧宝）订立合作协议。据此，公司同意就Opel全新C级SUV向Opel提供工程及开发服务，合作协议项下总代价为1亿欧元。Opel为Stellantis的全资附属公司。\n\n余承东：享界V8上市2小时大定达2216台\n\n11月20日晚，华为常务董事、产品投资评审委员会主任、终端BG董事长余承东发文透露，享界V8上市2小时，大定达2216台。\n\n据了解，享界V8售价31.98万元起。配置方面，新车全系搭载华为乾崑智驾ADS 5，标配800V高压纯电/增程双平台，纯电版标配120kWh电池包，CLTC纯电续航最高可达830km，增程版可选75.4kWh电池包，最大四驱CLTC综合续航1465km；标配4个零重力座椅，共30多种座椅组合模式。\n\n稍早前，余承东还发文回应了“开车睡觉”相关言论。“今天发布会上，有几句话讲的不准确，要纠正一下。享界V8现在给大家用的是L2辅助驾驶，L3的硬件能力已具备，但还没有开放。”他表示，“大家用辅助驾驶要专心开车、按要求握好方向盘。现在还是L2时代，大家一定要注意安全，开车不能睡觉。”\n\n阿维塔正式进入瑞士市场\n\n11月20日，阿维塔科技与Schmohl AG（劳斯莱斯、宾利、布加迪经销商）旗下Kamps Import AG签约，阿维塔正式进入瑞士市场。\n\nAIVA首款车型将于2027年第一季度上市，赛豆科技：渠道采用经销商模式\n\n据每经，11月19日，赛豆科技（即重庆赛豆科技有限公司）相关负责人接受采访时透露，AIVA首款量产车型AIVA ME7将于2027年第一季度正式上市。“年底前我们将在国内主流城市建设完成几十家AIVA体验店。”该负责人表示。上述赛豆科技相关负责人表示，AIVA的渠道布局不会采取直营模式，而是采用经销商模式。“AIVA品牌将完善全谱系产品布局，覆盖20万元以上主流市场。”\n\n上汽通用汽车推出全新插混技术\n\n11月20日，上汽通用汽车宣布推出全新一代旗舰插混技术“真龙插混MAX”，并宣布将在全新别克至境世家首发搭载。\n\n广汽夸克电驱非晶-碳纤维电驱第10万套量产下线\n\n据广汽集团消息，11月20日，广汽夸克电驱非晶-碳纤维电驱第10万套正式量产下线。据广汽方面介绍，夸克电驱2.0非晶-碳纤维电驱已批量搭载埃安N60、2027款埃安RT、2027款埃安i60等车型。在电池容量不变的情况下，搭载车型整车能耗下降4%，续航提升30至50公里。\n\n本田中国开启现地生产中排量摩托车海外出口事业\n\n11月20日，本田中国宣布由中国现地生产的中排量摩托车CBR500R FOUR将首次出口欧洲市场。当日，本田在华摩托车合资公司五羊-本田摩托（广州）有限公司在其增城工厂二期举行了CBR500R FOUR欧洲版车型的下线仪式。\n\n日本各车企将统一零部件标准\n\n日本汽车工业会11月19日宣布，将就汽车制造使用的部分材料和零部件制定统一标准，首先从铁、树脂和电气配线三项开始，再逐步扩大对象。此举旨在统一各企业间并不相同的规格，以降低采购成本。\n\n未经正式授权严禁转载本文，侵权必究。汽车要闻\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n汽车早报｜享界V8上市2小时大定达2216台 阿维塔正式进入瑞士市场\n\nAIVA首款车型将于2027年第一季度上市；上汽通用汽车推出全新插混技术。\n\n原创新闻陈小同 · 2026/11/21 08:33来源：界面新闻\n\n中汽协：1-10月销量排名前十轿车生产企业共销售528.5万辆\n\n11月20日，据中国汽车工业协会统计分析，2026年1-10月，销量排名前十位的轿车生产企业共销售528.5万辆，占轿车销售总量的68.9%。在上述十家企业中，与去年同期相比，上汽股份和特斯拉销量呈不同程度增长，其他企业销量均呈不同程度下降。\n\n零跑汽车：同意就欧宝全新C级SUV向其提供工程及开发服务\n\n11月20日晚，零跑汽车在港交所公告，于2026年11月20日，公司与Opel（欧宝）订立合作协议。据此，公司同意就Opel全新C级SUV向Opel提供工程及开发服务，合作协议项下总代价为1亿欧元。Opel为Stellantis的全资附属公司。\n\n余承东：享界V8上市2小时大定达2216台\n\n11月20日晚，华为常务董事、产品投资评审委员会主任、终端BG董事长余承东发文透露，享界V8上市2小时，大定达2216台。\n\n据了解，享界V8售价31.98万元起。配置方面，新车全系搭载华为乾崑智驾ADS 5，标配800V高压纯电/增程双平台，纯电版标配120kWh电池包，CLTC纯电续航最高可达830km，增程版可选75.4kWh电池包，最大四驱CLTC综合续航1465km；标配4个零重力座椅，共30多种座椅组合模式。\n\n稍早前，余承东还发文回应了“开车睡觉”相关言论。“今天发布会上，有几句话讲的不准确，要纠正一下。享界V8现在给大家用的是L2辅助驾驶，L3的硬件能力已具备，但还没有开放。”他表示，“大家用辅助驾驶要专心开车、按要求握好方向盘。现在还是L2时代，大家一定要注意安全，开车不能睡觉。”\n\n阿维塔正式进 ），A股收盘三大指数集体下跌。","digest":"【隔夜行情】  •周五，A股收盘三大指数集体下跌","points":["•周五（2026年11月20日），A股收盘三大指数集体下跌","上证指数跌0.28%，深证成指跌0.71%，创业板指跌0.79%","【北交所推出创新型中小企业发展公司债券】11月20日…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-21T08:30:00+08:00","size":1,"keywords":[],"body":"【隔夜行情】\n\n•周五（2026年11月20日），A股收盘三大指数集体下跌。上证指数跌0.28%，深证成指跌0.71%，创业板指跌0.79%。A股649只个股上涨，4876只个股下跌。截至收盘，沪指跌1.23%，深成指跌3.09%，创业板指跌3.54%。\n\n•周五（2026年11月20日），港股三大指数低开低走，恒科指数录得八日连跌，盘中一度击穿3500点。截至收盘，恒生指数跌1.89%或430.82点，报22410.80点，成交2703.00亿港元；国企指数跌1.77%，报7554.37点；恒生科技指数跌3.78%，报3511.14点。全周来看，恒指累跌5.19%，国指累跌4.83%，恒生科技指数累跌7.92%。\n\n【重要新闻】\n\n【北交所推出创新型中小企业发展公司债券】11月20日，北京证券交易所于2026年11月20日发布《关于支持发行创新型中小企业发展公司债券的通知》，正式推出创新型中小企业发展公司债券。\n\n本次北交所推出创新中小债，充分听取各方意见建议，全面总结前期市场实践，在严格遵循当前债券市场法规制度基础上，聚焦创新型中小企业债券融资难点堵点，探索提出一揽子支持引导举措。有关制度安排主要包括三个方面：一是提供主体类和用途类两种融资模式，明确发行主体范围。主体类支持符合条件的创新型中小企业直接发债，包括北交所上市公司、具备国家级创新称号的全国股转系统挂牌公司和其他公司等。同时，考虑到部分中小企业直接发债难度较大，支持相关优质主体发行用途类创新中小债，将募集资金主要投向创新型中小企业。二是围绕市场主体关切问题，针对性提出优化服务安排。鼓励发行人适用多元化增信措施，支持信用评级机构适配完善信用评级体系，提升增信担保可得性、评级机制适配性。引导证券公司加大综合服务力度，促进投融资对接交流，提高中介机构和投资机构参与积极性。支持符合条件的发行人适用贴息、奖补等支持政策，发挥各方政策合力。同时，提高交易所债券审核效率，提升发行人债券融资便利度。三是保护债券持有人合法权益，健全风险防控机制。在适用本所关于公司债券发行监管的一般性要求基础上，针对创新型中小企业所处行业、发展阶段特点，进一步要求主体类发行人充分披露自身创新属性、成长性等信息，要求在募集说明书中约定具体、可执行的偿债保障条款，并督促主承销商、证券服务机构就募集资金用途切实履行核查义务。\n\n未经正式授权严禁转载本文，侵权必究。资本风云\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n11月21日投资早报|通威股份拟10亿元—20亿元回购股份，吉林敖东拟1亿元—2亿元回购股份，渤海化学拟3.76亿元收购格瑞新材80%股份\n\n今晨，这些重要的投资信息你需要知道\n\n原创新闻李科峰 · 2026/11/21 08:30来源：界面新闻\n\n【隔夜行情】\n\n•周五（2026年11月20日），A股收盘三大指数集体下跌。上证指数跌0.28%，深证成指跌0.71%，创业板指跌0.79%。A股649只个股上涨，4876只个股下跌。截至收盘，沪指跌1.23%，深成指跌3.09%，创业板指跌3.54%。\n\n•周五（2026年11月20日），港股三大指数低开低走，恒科指数录得八日连跌，盘中一度击穿3500点。截至收盘，恒生指数跌1.89%或430.82点，报22410.80点，成交2703.00亿港元；国企指数跌1.77%，报7554.37点；恒生科技指数跌3.78%，报3511.14点。全周来看，恒指累跌5.19%，国指累跌4.83%，恒生科技指数累跌7.92%。\n\n【重要新闻】\n\n【北交所推出创新型中小企业发 官方認證的「落場」（Match Worn）體育用品線上拍賣平台，向全球公開拍賣大衛施華當日使用的比賽用品。八件拍賣品包括上下半場穿著的球衣、比賽用球褲、熱身球衣、護脛及球靴，所有物品均附有大衛施華親筆簽名，並作為他復出戰的珍藏紀念。\n球靴以3620歐元成交\n今次拍賣中，大衛施華比賽時穿著的球靴最受追捧，最終以3,620歐元成交，成為最高成交價物品。下半場射入十二碼時穿著的球衣則以2,510歐元成交，上半場球衣亦以2,026歐元拍出。其餘拍賣品成交價包括比賽用球褲：224歐元及222歐元、熱身球衣：430歐元及396歐元、護脛：1,513歐元。各項物品最終合共售出10,941歐元，折合約94,125港元，反映大衛施華即使只在香港短暫復出，仍然在球迷及收藏家之間具有相當號召力。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7ffd8866c7","title":"兒童濕疹│國際最新治療指引曝光！告別痕癢才塗藥 非類固醇藥膏放寬至3個月嬰幼兒","url":"https://www.stheadline.com/ohpama/3638547/兒童濕疹國際最新治療指引曝光告別痕癢才塗藥-非類固醇藥膏放寬至3個月嬰幼兒","summary":"本港約20%兒童及青少年受濕疹困擾！","summary_short":"本港約20%兒童及青少年受濕疹困擾！","digest":"本港約20%兒童及青少年受濕疹困擾","points":["本港約20%兒童及青少年受濕疹困擾","衞生署衞生防護中心指出，國際醫學界全面更新兒童異位性皮膚炎治療指引…","一文看清外用非類固醇藥膏（TCI放寬至3個月嬰幼兒）、生物製劑…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:30:00+08:00","size":1,"keywords":[],"body":"本港約20%兒童及青少年受濕疹困擾！衞生署衞生防護中心指出，國際醫學界全面更新兒童異位性皮膚炎治療指引，強調以「長期主動維持治療」取代被動消炎，減少逾五成復發。一文看清外用非類固醇藥膏（TCI放寬至3個月嬰幼兒）、生物製劑、口服JAK抑制劑及日常保濕新觀念，助家長科學控管濕疹！\n兒童及青少年異位性皮膚炎治療新方向\n本港兒童及青少年人口中，大約有20%受異位性皮膚炎（俗稱濕疹）影響，當中大部分患者(85%) 於5歲前便發病。\n近年國際醫學界包括美國皮膚科醫學會（American Academy of Dermatology）、歐洲皮膚病學與性病學會 （European Academy of Dermatology and Venereology）、聯合歐洲皮膚病論壇 （EuroGuiDerm）等均針對兒童及青少年濕疹的治療指引進行了全面更新。\n指引的核心思維是從過去的「被動性治療」轉向「長期主動維持治療」與「新型精準治療」。指引亦針對局部外用療法（處方藥與非處方藥）、光照療法以及全身性系統治療，提供實證醫學建議。以下是主要重點：\n1. 不再「痕癢才塗藥」：主動維持治療減逾五成復發\n 不再「痕癢才塗藥」：新指引強調，對容易反覆發作的部位適當用藥，不必等到濕疹明顯發作才用藥。\n 間歇性維持：建議在病情緩解期，每周固定2至3次間歇性使用外用非類固醇藥膏（如TCI）或低強度類固醇藥膏，能顯著減少超過50%的系統性復發，並延長皮膚穩定時間。\n2. 非類固醇藥膏TCI放寬至3個月嬰幼兒\n外用療法是治療異位性皮膚炎的重要基礎，難以被取代，尤其針對輕度至中度的患者。雖然這類療法非常有效，且風險顯著低於全身性系統治療，但其療效取決於持續規律的塗抹與正確的使用方式。\n在敏感部位使用鈣調神經磷酸酶抑制劑（TCI）藥膏：針對面部、眼瞼、眼周、脖子及皮膚皺褶等部位，指引強烈推薦使用TCI藥膏。最新大型綜合分析證實，外用TCI藥膏不會導致皮膚萎縮變薄，且未增加癌症風險，大幅緩解了患者的「類固醇恐懼症」。指引已將適用年齡放寬至3個月以上的嬰幼兒。\n以下為核心的外用藥物：\n 外用類固醇（TCS）作為治療急性發炎的第一線藥物：弱效類固醇通常用於敏感部位（如臉部、皮膚皺褶部分），而較強效的類固醇則用於皮膚較厚的老繭或斑塊病灶。\n 外用鈣調磷酸酶抑制劑（TCIs）： 他克莫司（tacrolimus）、吡美莫司（pimecrolimus）等非類固醇的抗發炎藥膏非常適合長期維持治療，以及用於敏感肌膚部位，使用亦不會引起皮膚變薄（萎縮）的副作用。\n PDE4抑制劑及JAK抑制劑： 較新型的非類固醇外用藥，例如克立硼羅 （crisaborole）、蘆可替尼 （ruxolitinib），能針對免疫系統中的特定致病機制進行調節，減輕發炎與痕癢。\n 芳香烴受體激動劑（Aryl hydrocarbon receptor agonist）（tapinarof）：新型的非類固醇外用藥。\n 上調關鍵屏障蛋白（filaggrin）及促進神經醯胺（ceramide）的生成：顯著減少皮膚經皮水分流失，並阻擋外界細菌（如金黃色葡萄球菌）與過敏原入侵。壓制Th2軸發炎。抑制IL-31（被稱為「引發瘙癢的細胞因子」）的表達。中和濕疹部位產生的過度氧化壓力，保護基底角質細胞免受發炎損傷。\n3. 中重度濕疹精準治療：生物製劑及口服JAK抑制劑比較\n對於傳統外用藥膏無效、大面積病變的中重度患者，最新指引明確劃分了生物製劑與小分子標靶藥物的階梯式應用：\n 治療類型 代表藥物 治療特點與更新方向 生物製劑 （Biologics） Dupilumab（杜避炎）\n Lebrikizumab（來瑞奇珠單抗）\n Tralokinumab（曲羅盧單抗） 精準阻斷發炎因子（如IL-4, IL-13），安全性高，適用年齡已擴大至嬰幼兒及青少年，適合長期穩定控制。 口服標靶小分子藥物 JAK抑制劑，如Abrocitinib（阿布昔替尼）、Upadacitinib（烏達西替尼）、Baricitinib（巴瑞替尼） 止癢速度極快（數天內見效）。新指引提醒，使用期間需定期覆診抽血，監測肝腎功能與血球指標。 4. 日常保濕重「持續塗抹」 認識光照療法及全身性系統治療\n指引指出，目前無證據證明特定昂貴成分（如神經醯胺等）有絕對優勢。醫護人員應選擇「病人願意持續塗抹、無刺激性、且經濟能長期負擔」的保濕劑，而每日多次塗抹，比單次厚塗更重要。\n以下為其他療法：\n光照療法（Phototherapy）：利用特定波長的人造紫外線照射皮膚，以抑制皮膚異常免疫反應並減輕發炎的物理治療方法。\n一般使用窄頻中波紫外線療法（Narrowband UVB, 簡稱 NB-UVB）：一般建議每星期二至三次治療。初次照射時間通常較短（依患者的皮膚類型評估而定）。若皮膚耐受良好且沒有出現異常紅腫，後續會依醫師評估適度調整照射參數，以達到穩定的治療反應。通常在連續接受一段時間的治療後會看到明顯的病灶改善與癢感降低。若要達到最大緩解或進入穩定的疾病緩解期，通常需要完成完整的療程，一般情況需時三個月。\n全身性系統治療 (包括傳統免疫抑制劑、生物製劑、小分子藥物)：可使用傳統免疫抑制劑，包括：\n 甲氨蝶呤（Methotrexate）\n 環孢素（Cyclosporine）\n 黴酚酸酯（Mycophenolate mofetil）\n 硫唑嘌呤（Azathioprine）\n治療中重度異位性皮膚炎（濕疹）的全身性系統藥物：當患者病情嚴重，且外用類固醇或光療無效，傳統免疫抑制劑是一個行之多年的經典標示外使用（Off-label use）備選治療方案。\n總括而言，異位性皮膚炎需要長期管理，治療方案亦會因應患者年齡、病情及生活需要而調整。家長應諮詢醫護人員，並按指示持續護理及覆診。\n文：衞生署衞生防護中心","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5cf5f93c78","title":"多哈亞洲保齡球錦標賽｜麥卓賢回勇 帶領港隊奪1金1銀2銅埋齋","url":"https://www.stheadline.com/realtime-sport/3639548/多哈亞洲保齡球錦標賽麥卓賢回勇-帶領港隊奪1金1銀2銅埋齋","summary":"香港保齡球隊憑大師兄麥卓賢連日來在多哈舉行的亞洲錦標賽中保持穩定發揮，帶領球隊奪1金1銀2銅，包括周五晚的五人隊際賽，港隊以6606分奪得銀牌，功臣包括麥卓賢、馬嘉言、黃鈞源、林諾謙及袁焯軒…","summary_short":"香港保齡球隊憑大師兄麥卓賢連日來在多哈舉行的亞洲錦標賽中保持穩定發揮，帶領球隊奪1金1銀2銅，包括周五晚的五人隊際賽…","digest":"香港保齡球隊憑大師兄麥卓賢連日來在多哈舉行的亞洲錦標賽中保持穩定發揮…","points":["香港保齡球隊憑大師兄麥卓賢連日來在多哈舉行的亞洲錦標賽中保持穩定發揮…","港隊在今屆亞錦賽在麥卓賢回勇下取得不俗的成績，他率先在初段先奪單打金銅牌…","在五人隊際賽中競爭激烈，港隊在完成第五局時仍排在第四位，五人在最後一局奮起直追…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:20:57+08:00","size":1,"keywords":[],"body":"香港保齡球隊憑大師兄麥卓賢連日來在多哈舉行的亞洲錦標賽中保持穩定發揮，帶領球隊奪1金1銀2銅，包括周五晚的五人隊際賽，港隊以6606分奪得銀牌，功臣包括麥卓賢、馬嘉言、黃鈞源、林諾謙及袁焯軒，麥卓賢亦在男子個人全能賽奪銅，港隊以四面獎牌結束多哈之旅。\n港隊在今屆亞錦賽在麥卓賢回勇下取得不俗的成績，他率先在初段先奪單打金銅牌，為港隊打開獎牌之門，繼而夥拍師弟黃鈞源合作雙人賽，二人奪得金牌，他們二人再在五人隊際賽再次上陣。\n在五人隊際賽中競爭激烈，港隊在完成第五局時仍排在第四位，五人在最後一局奮起直追，各人平均打出210分以上成績，僅勝沙特亞拉伯17枝瓶，最終升上第二名完成，冠軍是大馬的6740分。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2928f45231","title":"港人求救房門膠紙印難除走 熱風筒/WD40/除膠劑都無用？網民齊推介1物：呢支超勁！","url":"https://www.stheadline.com/lifetips/3638860/港人求救房門膠紙印難除走-熱風筒WD40除膠劑都無用網民齊推介1物呢支超勁","summary":"在日常的家居清潔中，總會遇到不少看似能簡單解決，但卻苦無對策的「奇難雜症」。","summary_short":"在日常的家居清潔中，總會遇到不少看似能簡單解決，但卻苦無對策的「奇難雜症」。","digest":"在日常的家居清潔中，總會遇到不少看似能簡單解決，但卻苦無對策的「奇難雜症」","points":["在日常的家居清潔中，總會遇到不少看似能簡單解決，但卻苦無對策的「奇難雜症」","近日，有港人於社交平台發文求救，指對房門的膠紙印苦無對策…","不少網民都紛紛留言分享方法，當中不少人都提到1物，力讚：「呢支超勁」，詳情即看下文"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:15:06+08:00","size":1,"keywords":[],"body":"在日常的家居清潔中，總會遇到不少看似能簡單解決，但卻苦無對策的「奇難雜症」。近日，有港人於社交平台發文求救，指對房門的膠紙印苦無對策，即使已嘗試用坊間流傳的方法都難以解決。不少網民都紛紛留言分享方法，當中不少人都提到1物，力讚：「呢支超勁」，詳情即看下文！ \n港人求救膠紙印難除走 網民齊推介1物\n日前，有港人在社交平台以「想請問吓有乜嘢方法去咗啲膠紙印？」發文，指家中房門的膠紙印難除，又表示曾試過坊間的方法，「熱風筒吹家（加）WD40或除膠劑都好難整甩」。依樓主分享的圖片所見，房門確有頗深的膠紙印，目測為撕去膠紙後留下的痕跡，而且範圍不小，亦為日常生活中相當常見的情況。\n樓主的帖文引來不少網民分享自己的成功去印方法，「去深水埗特賣場，買支除膠劑」、「白電油林濕啲浸耐啲就應該得」、「掃藍威寶，十分鐘後可清洗」、「用節水抹就得」。另外，原來有不少網民都異口同聲推介「橙水」，「一定係橙水」、「五金舖問橙水」、「這支橘水（橙水）超勁。我屋企岩岩裝修完，清潔玻璃門窗到地磚膠紙或者石屎粒，仲有櫃上面的原裝膠紙都通通輕鬆Ko」。\n「橙水」可除油垢/油漬/膠紙印\n一眾網民介紹的「橙水」於各家品店或網店均有發售，據產品介紹指出其成份為「百分百天然柑橘活性成分」，目的為去除頑固油脂、污垢、黏漬等。除了膠紙印外，「橙水」亦可用以清除衣領油垢、抽油煙機及爐頭重油漬等，其用法亦非常簡單，只需於使用前搖勻，無需開水。\n文：TF\n資料及圖片來源：家居維修交流平台@facebook\n延伸閱讀：撳錯即中招！「我不是機器人」淪新型釣魚陷阱 網民險被盜密碼+個人資料 小心網頁這些特徵...","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cdaaa27484c","title":"黃酒煮雞材料/做法一文睇 冬天暖身菜 湯汁鮮甜香醇 零失敗做法｜識煮食譜","url":"https://www.stheadline.com/food/3639378/黃酒煮雞材料做法一文睇-冬天暖身菜-湯汁鮮甜香醇-零失敗做法識煮食譜","summary":"黃酒煮雞｜冷鋒襲港，不妨在家自煮暖身菜。","summary_short":"黃酒煮雞｜冷鋒襲港，不妨在家自煮暖身菜。","digest":"黃酒煮雞｜冷鋒襲港，不妨在家自煮暖身菜","points":["黃酒煮雞｜冷鋒襲港，不妨在家自煮暖身菜","今日示範的黃酒煮雞，是材料簡單又易煮的滋補菜式，想雞味濃郁可選原隻光雞，方便一點可用雞髀肉…","材料：光雞1/2隻、薑片3片、客家黃酒2杯、冰糖1小塊、鹽1茶匙、麻油少許、油適量"],"section":"生活","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:00:57+08:00","size":1,"keywords":[],"body":"黃酒煮雞｜冷鋒襲港，不妨在家自煮暖身菜。今日示範的黃酒煮雞，是材料簡單又易煮的滋補菜式，想雞味濃郁可選原隻光雞，方便一點可用雞髀肉，特別選用客家黃酒入饌，此酒是客家傳統酒，味道甜而酒精濃度較低，很適合用來煮家常菜。\n黃酒煮雞材料/做法一文睇\n示範菜式：黃酒煮雞\n 材料：光雞1/2隻、薑片3片、客家黃酒2杯、冰糖1小塊、鹽1茶匙、麻油少許、油適量\n做法：\n 把光雞斬成細件，洗淨。\n 在鍋中燒熱油，加薑片爆香，加入雞件炒至六成熟。\n 倒入米酒煮滾，加冰糖煮至雞肉全熟，\n 加鹽及麻油調味。\n小貼士：不想酒味太濃，可加適量清水稀釋\n文：EH 圖：星島日報\n\n延伸閱讀：\n白蘿蔔牛肉湯飯材料/做法一文睇 湯水清甜鮮味 材料及煮法簡單｜識煮食譜\n八珍醋酸子薑燜排骨材料/做法一文睇 酸甜開胃 下飯佳品｜識煮食譜","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0434ac0962","title":"吳婉芳長子胡智略結婚5周年 新抱霍詠盈：期待50年 舉家入住8層高2萬呎豪宅","url":"https://www.stheadline.com/film-drama/3639427/吳婉芳長子胡智略結婚5周年-新抱霍詠盈期待50年-舉家入住8層高2萬呎豪宅","summary":"59歲的吳婉芳一向被封為「凍齡女神」，其長子胡智略與霍英東二房孫女霍詠盈迎來結婚5周年紀念日，向來低調的霍詠盈日前罕有在社交平台大方放閃，貼出多張甜蜜合照，更大爆二人緣分深厚…","summary_short":"59歲的吳婉芳一向被封為「凍齡女神」，其長子胡智略與霍英東二房孫女霍詠盈迎來結婚5周年紀念日…","digest":"59歲的吳婉芳一向被封為「凍齡女神」…","points":["59歲的吳婉芳一向被封為「凍齡女神」，其長子胡智略與霍英東二房孫女霍詠盈迎來結婚5周年紀念日…","霍詠盈比起31歲的胡智略年長2年，二人背景相仿，同曾留學英國，兩人於2021年11月共諧連理","她感性表示，這簡直是「短劇才會出現的橋段」，並感謝丈夫5年來的包容、疼愛與支持…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:00:40+08:00","size":1,"keywords":[],"body":"59歲的吳婉芳一向被封為「凍齡女神」，其長子胡智略與霍英東二房孫女霍詠盈迎來結婚5周年紀念日，向來低調的霍詠盈日前罕有在社交平台大方放閃，貼出多張甜蜜合照，更大爆二人緣分深厚，從昔日的中學「剋星」演變成倫敦地鐵車廂重逢的浪漫橋段，發表深情告白，羨煞旁人。\n胡智略太太長文感謝老公包容\n霍詠盈比起31歲的胡智略年長2年，二人背景相仿，同曾留學英國，兩人於2021年11月共諧連理。近日霍詠盈在社交平台撰寫長文，細數與丈夫從校園到婚後的奇妙緣分，笑指中學時期的他們一個是循規蹈矩的音樂風紀，另一個則是痞帥淘氣的體育生，原本互為「剋星」，長大後卻在倫敦地鐵車廂意外重逢。她感性表示，這簡直是「短劇才會出現的橋段」，並感謝丈夫5年來的包容、疼愛與支持，笑言每天對著老公的「高顏值」讓自己潛移默化變美，甚至連對方的「戰略性耍廢」也能甘之如飴，誓言要與丈夫攜手白頭。她表示：「總是支持我，想當女強人或當個小孩子亦可，也謝謝你那看不厭的美貌，讓我五年來每天對住你，潛移默化地變美」，「我愛五年前的你，愛現在的你，會繼續愛五年後的你，期待我們以後的五年、十年、五十年」。\n相關閱讀：吳婉芳三名高顏值子女合體遊韓 大晒兄弟專屬紋身 二仔胡智同公開向老婆示愛超甜蜜\n吳婉芳一家住2萬呎8層獨立屋\n吳婉芳與子女及新抱一同居住於大坑一棟樓高8層、面積達2萬呎的超巨型獨立屋。這棟豪宅外觀極具現代設計感，曾榮獲國際設計及建築大獎，內部更配套有私人大泳池和巨型露台。從日常照中可見，巨型客廳裝潢高貴典雅，牆上更掛滿了溫馨的全家福。一向與新抱關係極為融洽的吳婉芳，今年8月出席好友上山詩納的生日派對時，因極致凍齡的少女外貌再次成為全城熱話，被網民大讚是「全港最美奶奶」。\n吳婉芳二仔今年5月結婚\n吳婉芳今年更是喜事連連，除了大仔胡智略恩愛依舊，一向活躍於社交平台、外形健碩的二仔胡智同，亦於今年5月低調與女友結婚，令胡家再添喜事。吳婉芳在幾年間接連「升呢」成為奶奶，且兩名新抱皆大方得體。兩位高顏值兒子相繼成家立室，一家人同住於2萬呎大坑豪宅內，過著幸福美滿的大家庭生活，網民紛紛送上祝福，指吳婉芳不僅保養得宜，更是真正的人生贏家。\n相關閱讀：前港姐吳婉芳2萬呎8層獨立屋曝光 囝囝意外洩屋內寬敞空間 大宅曾獲國際獎","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"caabc39eede","title":"粟米、番薯是「減脂陷阱」？營養師揭6大澱粉類營養對比「低卡之王」竟是它！注意3大減脂建議","url":"https://www.stheadline.com/health-care/3638126/粟米番薯是減脂陷阱營養師揭6大澱粉類營養對比低卡之王竟是它注意3大減脂建議","summary":"談及減脂餐單中的低卡之選，不少市民購買外賣飯盒時，常誤以為粟米、番薯及南瓜屬於「蔬菜類」而放心大吃，結果卻令澱粉與熱量悄悄超標！","summary_short":"談及減脂餐單中的低卡之選，不少市民購買外賣飯盒時，常誤以為粟米、番薯及南瓜屬於「蔬菜類」而放心大吃…","digest":"談及減脂餐單中的低卡之選，不少市民購買外賣飯盒時，常誤以為粟米…","points":["談及減脂餐單中的低卡之選，不少市民購買外賣飯盒時，常誤以為粟米…","6大常見全穀雜糧碳水含量對比","營養師王郁菁在社交平台發文解釋，雖然粟米、番薯及南瓜富含膳食纖維與維生素…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T11:00:30+08:00","size":1,"keywords":[],"body":"談及減脂餐單中的低卡之選，不少市民購買外賣飯盒時，常誤以為粟米、番薯及南瓜屬於「蔬菜類」而放心大吃，結果卻令澱粉與熱量悄悄超標！\n6大常見全穀雜糧碳水含量對比\n營養師王郁菁在社交平台發文解釋，雖然粟米、番薯及南瓜富含膳食纖維與維生素，確實是替代精緻白米飯的優質主食，但若當成蔬菜無限制攝取，熱量依然會失控。以每100克可食份量計算，6種常見根莖及穀物類的營養與食用盲點如下：\n 南瓜 約50卡路里\n 碳水約11克、低卡冠軍\n 熱量密度最低且水分含量高，對控制總熱量極為友善；惟外賣常見的南瓜濃湯或焗烤南瓜，烹調時往往加入大量牛油與忌廉，容易令熱量直接翻倍。 山藥 約84卡路里\n 碳水約20克\n 升糖指數（GI值）相對較低，質地滑順並富含黏液蛋白；但若磨成山藥泥或製成蜜煮甜品，糖分與消化吸收速度均會提高，仍須計入澱粉總量。 粟米 約108卡路里\n 碳水約23克\n 富含葉黃素與粟米黃素，卻最常被大眾誤當成蔬菜；事實上吃下一整條大粟米，便等同攝取了將近半碗白飯的澱粉量。 番薯 約124卡路里\n 碳水約29克\n 富含β-胡蘿蔔素與鉀質，膳食纖維豐富；然而烤番薯因水分蒸發導致糖分濃縮，升糖指數會大幅飆高，加上香甜順口極易吃過量，建議優先選擇蒸煮方式。 芋頭 約128卡路里\n 碳水約30克\n 澱粉感較重且飽足感極佳，但市面上常見的芋泥、芋圓等甜品通常添加大量糖分與油脂，過量攝取容易增加身體代謝負擔。 栗子 約172卡路里\n 碳水約37克\n 膳食纖維高達4.1克且香甜富口感，但碳水化合物比例偏高，小小一顆熱量已不容小覷，若當作零食一口接一口進食，熱量極易在不知不覺間超標。 6大常見全穀雜糧碳水含量對比\n減脂控卡首選南瓜山藥 緊記主食等量替換\n王郁菁營養師總結3大飲食建議，提醒大家可因應個人健康目標，挑選合適全穀雜糧類食材，但前提是必須建立正確的主食替換觀念，切勿在照常吃足一整碗白飯的情況下額外加吃：\n 建議1： 若希望嚴格控制熱量攝取，南瓜與山藥是相對低負擔的理想選擇；若想促進腸道蠕動、順暢補充膳食纖維，則可適量選擇栗子、粟米與番薯。\n\n 建議2： 只要該餐有進食粟米、番薯、南瓜或芋頭等全穀雜糧類，當餐的白飯、粉麵或麵包便必須相應等量扣除，避免讓健康好食材變成減脂路上的隱形熱量地雷。\n\n 建議3： 即使選對低卡食材，烹調手法亦直接影響熱量；例如番薯宜選蒸煮而非烤焗以防升糖指數飆升，南瓜及芋頭則應避開加入大量牛油、忌廉或砂糖製成的濃湯、焗烤及甜品，方能真正吃得健康無負擔。\n\n資料來源：營養師王郁菁\n 延伸閱讀：吃4種澱粉食物可減肥 更可降血糖/防大腸癌？營養師揭白飯這樣吃也有效！","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ccb468384ee","title":"翁嘉穗趁天氣轉冷出「反差」靚相 薄紗長裙盡騷白滑美背","url":"https://news.tvb.com/tc/1207421-翁嘉穗趁天氣轉冷出反差靚相薄紗長裙盡騷白滑美背","summary":"隨着天氣正式開始轉冷，前香港小姐冠軍翁嘉穗特意為大家送上「夏日暖意」。她日前於社交平台上載多張在沙灘拍攝的唯美寫真，並發文表示：「趁着今天正式開始感覺寒冷，出一個反差，夏日沙灘造型祝大家在寒冷的天氣，仍感覺溫暖！","summary_short":"隨着天氣正式開始轉冷，前香港小姐冠軍翁嘉穗特意為大家送上「夏日暖意」。","digest":"隨着天氣正式開始轉冷，前香港小姐冠軍翁嘉穗特意為大家送上「夏日暖意」","points":["隨着天氣正式開始轉冷，前香港小姐冠軍翁嘉穗特意為大家送上「夏日暖意」","她日前於社交平台上載多張在沙灘拍攝的唯美寫真，並發文表示：「趁着今天正式開始感覺寒冷…","曝光的相片中，翁嘉穗狀態大勇，置身於開揚的海邊沙灘取景，身後可見岸邊岩石與連綿山景"],"section":"生活","category":"娛樂","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T10:55:00+08:00","size":1,"keywords":["翁嘉穗"],"body":"隨着天氣正式開始轉冷，前香港小姐冠軍翁嘉穗特意為大家送上「夏日暖意」。她日前於社交平台上載多張在沙灘拍攝的唯美寫真，並發文表示：「趁着今天正式開始感覺寒冷，出一個反差，夏日沙灘造型祝大家在寒冷的天氣，仍感覺溫暖！」\n\n曝光的相片中，翁嘉穗狀態大勇，置身於開揚的海邊沙灘取景，身後可見岸邊岩石與連綿山景。她挑選了一件充滿度假風情的白色薄紗長裙，裙身點綴着柔和的淡黃色花卉印花與層次荷葉邊設計，輕盈感十足。其中背面近鏡特寫更將禮服的大露背設計表露無遺，盡顯她白皙緊緻的美背線條。面對鏡頭，翁嘉穗任由海風輕吹一頭棕色長捲髮，既在沙灘漫步回眸微笑，又抬手揚起隨風飛舞的薄紗衣袖，在寒意漸濃的日子裡展現出溫暖又迷人的女神風采。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026SenpD8ejwn1795154195.png?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd3db756afb","title":"上海壁球公開賽｜陳善鈺歷史性躋身金級賽四強 再遇大馬亞運「雙金」得主 望半個主場成功復仇","url":"https://www.stheadline.com/realtime-sport/3639544/上海壁球公開賽陳善鈺歷史性躋身金級賽四強-再遇大馬亞運雙金得主-望半個主場成功復仇","summary":"名古屋亞運女單銅牌得主陳善鈺周五晚在上海舉行的中國壁球公開賽創個人最佳！","summary_short":"名古屋亞運女單銅牌得主陳善鈺周五晚在上海舉行的中國壁球公開賽創個人最佳！","digest":"名古屋亞運女單銅牌得主陳善鈺周五晚在上海舉行的中國壁球公開賽創個人最佳","points":["名古屋亞運女單銅牌得主陳善鈺周五晚在上海舉行的中國壁球公開賽創個人最佳","上海站列為PSA（職業壁球協會）世界巡迴賽「金級」比賽，善鈺連闖數關…","陳善鈺首次躋身PSA 金級世巡賽四強"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:53:52+08:00","size":1,"keywords":[],"body":"名古屋亞運女單銅牌得主陳善鈺周五晚在上海舉行的中國壁球公開賽創個人最佳！上海站列為PSA（職業壁球協會）世界巡迴賽「金級」比賽，善鈺連闖數關，周五晚跟世界排名18位的埃及七號種籽Sana Ibrahim拉鋸63分鐘，在落後下以3:2反勝對手，首次躋身周六晚「金級賽」的四強，與應屆亞運雙金（個人賽及團體賽）得主、大馬的Sivasangari Subramaniam再次碰頭，爭入決賽。\n陳善鈺首次躋身PSA 金級世巡賽四強。PSA 圖\n陳善鈺（右）在八強戰中擊敗世界排18位的埃及的Sana Ibrahim （左）入四強。PSA圖\nPSA 圖\n上海公開賽於仙霞網球中心上演，世界排名30位的陳善鈺在比賽中表現出色，包括在16強曾以3:1（10:12、11:9、11:4、11:3）爆冷擊敗世界排名第九的比利時球手Tinne Gilis入八強對埃及的Sana，雙方鬥得激烈，Sana在首局贏「刁時」以12:10先開紀錄，港將不甘示弱，次局以11:9追成平手，雖然在第三局被對方再度以11:4領先，但善鈺隨即以11:5追平，決勝局再次打至「刁時」，但這次勝方是善鈺，個人歷史性躋身「金級賽」四強。\n24歲的陳善鈺賽後多謝場內為她打氣的中國球迷：「真的好開心能夠躋身『金級賽』的四強，對我意義重大，上海這裡有很多國內的觀眾為我打氣，加上這裡亦同時舉行世界壁球教練會議，很多香港的教練們都有來到現場為我打氣；我為到這場勝仗感恩外，亦加強我越戰越勇的戰鬥精神。」\n善鈺的四強對手Siva可以說是老對手，二人在美國讀書時已時有對賽，在九月底的愛知名古屋亞運會女單四強，善鈺以0:3（6:11、8:11、7:11）不敵最終的冠軍Siva，周六是一次復仇的好機會，亦為月底「銀級」的香港壁球公開賽打支強心針。\n另一邊的四強對手是日本的應屆亞運銅牌、世界排第七的渡邊聰美對美國世界排第12的Marina Stefanoni。\n各將戰罷上海站後將來到香港參加下周的香港足球會壁球賽以及月底的Milwaukee香港壁球公開賽。\n記者：徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd61656f0fa","title":"港人裸辭7個月再踏職場哀嘆「返工唔啱我」 悟出5大深刻教訓 網民共鳴：休息為走更遠路","url":"https://www.stheadline.com/lifetips/3638808/港人裸辭7個月再踏職場哀嘆返工唔啱我-悟出5大深刻教訓-網民共鳴休息為走更遠路","summary":"在高壓且快節奏的都市生活中，「裸辭」成為不少年輕打工仔重整人生步調的選擇。","summary_short":"在高壓且快節奏的都市生活中，「裸辭」成為不少年輕打工仔重整人生步調的選擇。","digest":"在高壓且快節奏的都市生活中，「裸辭」成為不少年輕打工仔重整人生步調的選擇","points":["在高壓且快節奏的都市生活中，「裸辭」成為不少年輕打工仔重整人生步調的選擇","近日，有打工仔在社交平台發文，透露自己在裸辭休息7個月後重投職場，首日上班深感不適應…","帖文迅速引起不少網民共鳴，有過來人分享指曾因上班壓力大引致「報復式消費」…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:45:19+08:00","size":1,"keywords":[],"body":"在高壓且快節奏的都市生活中，「裸辭」成為不少年輕打工仔重整人生步調的選擇。近日，有打工仔在社交平台發文，透露自己在裸辭休息7個月後重投職場，首日上班深感不適應，同時總結出5個「職場與人生」教訓。帖文迅速引起不少網民共鳴，有過來人分享指曾因上班壓力大引致「報復式消費」，甚至跌入「資本陷阱」的惡性循環，提醒大眾看清生活本質。\n裸辭7個月回歸社畜生活 打工仔哀嘆「唔啱我」列5大深刻教訓\n有打工仔發文透露自己在裸辭7個月後重投職場，首日上班即深感不適應，總結出5大深刻教訓。\n有打工仔在社交平台發文，透露自己大半年前在沒有落實下一份工作的情況下毅然辭職，度過了長達7個月的休閒時光，「裸辭左7個月，已經唔知返工係咩感覺。」然而，休息期劃上句號之際，重返職場崗位的現實卻為他帶來沉重心理負擔。事主直言：「今日開始要返工，完全覺得返工唔岩（啱）我」，形容復工前夕產生生理與心理的抗拒：「前一晚已經唔捨得訓，第2朝又要到屎咁早準備」，對於重投朝九晚五的「社畜」生活感到無比掙扎。\n而經歷長達半年的悠閒生活後，事主在帖文中整理出5點「最深刻嘅教訓」：\n1. 為未來累積資金\n事主直指：「唔返工都可以過到自己想要嘅生活，大前提先成為社畜累積資金。」認為享受自由生活的前提，是必須在職場累積一定程度的儲蓄。\n2. 善用空檔轉型\n事主指出當前世代的工作型態已與以往不同，「今時唔同往日 ，而家唔係手停口停」，提醒打工仔在裸辭期間不要虛度光陰，應趁空檔增值自己，「撈多啲唔同嘅出路」，開拓更多收入來源。\n3. 拒絕搵工焦慮\n面對失業期間的徬徨，事主認為應以豁達心態看待：「個天真係唔會畀你過得咁快活，時間到了，工作就會來」，籲待業人士「唔好因為搵工而提前焦慮，提前破壞自己嘅安寧」。\n4. 回歸職場如「下次裸辭嘅開始」\n事主指出，當前世代不少打工仔都將工作視為為下一段假期賺取路費的階段：「一旦開始返工，又係準備下次裸辭嘅開始」。\n5. 珍惜裸辭時間\n最後，事主感嘆：「返咗工先識珍惜裸辭既時光」，直言再次回歸職場才深刻明白無拘無束的珍貴。\n過來人深感共鳴：休息是為了走更遠的路\n帖文發布後，在社交平台引來不少網民討論，大部分人普遍認同適度停下腳步並非錯誤，「老土啲講句：休息，是為了走更遠的路」。有人則分享自身經歷，感嘆即使休息半年亦轉瞬即逝，「中間又兼職，覺得自己咩都無做過，又要繼續牛馬」，甚至因沒有收入而不敢旅遊，「無去一次想去嘅旅行（無收入始終唔想使太多，雖然又唔係手緊），而家有收入但連休息時間都無，所以真係要等到退休先真正可以享受生活」；更有留言道出重返職場的最大惡夢：「最慘係再翻工係翻左一份真係唔適合嘅工，然之後又痛苦到懷疑人生。」\n有理性的過來人亦留言分享心得，透露不少人上班壓力過大時會依賴物質消費紓壓，「成日用報復式消費去減壓，結果跌入資本陷阱——洗晒啲錢、逼住繼續返工嘅無限Loop」，反而令自己永無止境受困於工作。該網民認為短暫待業能讓人認清「低物慾一樣可以活得好好」，建議打工仔趁這個時間建立低成本生活模式，同時計算未來的退休開支，「計清楚儲夠幾多就夠退休，返工就會有個明確目標，無咁難捱。只要唔好亂借錢、唔過度消費、唔夾硬買樓，要儲夠錢過平靜退休生活其實唔難。」\n來源：Threads\n文：LW\n同場加映：零售業打工仔日日受氣苦呻「基本尊重都冇」！力數客人/老闆2宗罪 網民安慰：問心無愧就得","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c1e18a6b011","title":"天氣｜本港早上清涼 下周初氣溫會略為回升","url":"https://news.tvb.com/tc/1207584-天氣本港早上清涼下周初氣溫會略為回升","summary":"受東北季候風影響，本港早上天氣清涼。早上天色灰暗，不少長者都穿上外套、做足保暖，清晨各區錄得約13至16度，荃灣最低氣溫只有11.9度。","summary_short":"受東北季候風影響，本港早上天氣清涼。","digest":"受東北季候風影響，本港早上天氣清涼","points":["早上天色灰暗，不少長者都穿上外套、做足保暖，清晨各區錄得約13至16度…","天文台指，隨著覆蓋華南的廣闊雲帶逐漸遠離，天色會短暫好轉","今日大致多雲及乾燥，日間部分時間有陽光，最高氣溫約20度"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T10:02+08:00","size":1,"keywords":[],"body":"受東北季候風影響，本港早上天氣清涼。\n\n早上天色灰暗，不少長者都穿上外套、做足保暖，清晨各區錄得約13至16度，荃灣最低氣溫只有11.9度。\n\n天文台指，隨著覆蓋華南的廣闊雲帶逐漸遠離，天色會短暫好轉。今日大致多雲及乾燥，日間部分時間有陽光，最高氣溫約20度。\n\n隨著一股達強風程度的偏東氣流，下周初影響華南沿岸，氣溫會略為回升。但下周二，受另一股東北季候風影響，本港氣溫會再度下降及有幾陣雨。","image":"https://pro-vod-cdn.tvb.com/f66fa6bebc204bfd9ce22b570f0a752f/snapshots/21adf02d110e4fde8e3a7af2574ad405-00005.jpg","video":"https://pro-vod-cdn.tvb.com/f66fa6bebc204bfd9ce22b570f0a752f/9225ea469eba432bb31faf85f239c8df-ac43299061eddcc25489a4f0e407b16d-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/f66fa6bebc204bfd9ce22b570f0a752f/snapshots/21adf02d110e4fde8e3a7af2574ad405-00005.jpg","lang":"zh-Hant"},{"id":"cb466e8022b","title":"灣區零距離｜海歸建築師團隊扎根開平塘口 用匠心拯救「空心」","url":"https://news.tvb.com/tc/1206633-灣區零距離海歸建築師團隊扎根開平塘口用匠心拯救空心","summary":"塘口營造(上)這一集同大家來僑鄉江門開平，不是簡單介紹世界文化遺產開平雕樓，而是認識一班學建築的「海歸」青年，到這條只剩下九戶人家的村落，如何用匠心之手拯救條村「空心化」危機。","summary_short":"塘口營造(上)這一集同大家來僑鄉江門開平，不是簡單介紹世界文化遺產開平雕樓，而是認識一班學建築的「海歸」青年…","digest":"塘口營造(上)這一集同大家來僑鄉江門開平，不是簡單介紹世界文化遺產開平雕樓…","points":["這一集同大家來僑鄉江門開平，不是簡單介紹世界文化遺產開平雕樓…","無名營造社的工作室，前身是開平塘口墟的舊糧站，主理人、建築師陳國棟…","建築師陳國棟說：「我們(工作室)的後邊就是碉樓，是世界遺產，這裡的人好、吸引到你才會來"],"section":"生活","category":"生活消閒","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T09:00+08:00","size":1,"keywords":[],"body":"塘口營造(上)\n\n這一集同大家來僑鄉江門開平，不是簡單介紹世界文化遺產開平雕樓，而是認識一班學建築的「海歸」青年，到這條只剩下九戶人家的村落，如何用匠心之手拯救條村「空心化」危機。\n\n主持：黎慧怡\n\n無名營造社的工作室，前身是開平塘口墟的舊糧站，主理人、建築師陳國棟，自小生活在廣東的沿海城市湛江，2017年由日本學成歸來，與團隊先落戶貴州東南鄉村。\n\n政府三顧茅廬活化鄉村\n\n適逢開平塘口政府，打造鄉村文旅品牌，三顧草廬將他們請過來，為破落的鄉村、做摩登的設計。\n\n建築師陳國棟說：「我們(工作室)的後邊就是碉樓，是世界遺產，這裡的人好、吸引到你才會來。」\n\n傳統匠人技藝留存 高效與復刻間的平衡\n\n要最大程度保留一磚一瓦，對他們而言不是難事，最大挑戰反而是人。\n\n建築師陳國棟說：「現在我們的時代在發展，我們追求高效快速，那麼傳統匠人的這種技藝呢，他就無法很高效，如何去做這樣的一種平衡，我覺得還是挺難的。」\n\n木叔，是陳國棟的鄰居兼常在塘口合作的木匠\n\n4年改造眾多項目 不該被歷史磨滅的鄉村蛻變\n\n碰巧遇上疫情，做下、停下，用了兩年時間，工作室2022年啟用，目前已在塘口完成多個設計改造項目，包括將碉樓改建成民宿，翻新舊街市，設計旅遊公廁等。\n\n建築師陳國棟說：「中國還有6億多老百姓是農民，這些農民老百姓幾乎沒有被設計(師)服務過，灣區有非常多像塘口這樣的地方，其實它很普通，又面臨著空心化，它又總不能被歷史所抹滅掉，它會變成甚麼樣子，我非常期待。」\n\n原本凋零的街區，四年間雲集大型書店，\n\n獨立設計師，咖啡師、傳統灰塑匠人……下集我們一齊看看，陳國棟如何「築巢引鳳」，將這班「大師」齊集一村。","image":"https://pro-vod-cdn.tvb.com/0dc841eff8b3437d9d77fbf420b4ed81/snapshots/7c45e03d8e35411a821b89ed501bff98-00008.jpg","video":"https://pro-vod-cdn.tvb.com/0dc841eff8b3437d9d77fbf420b4ed81/ff16932b7dac4a49ad40f0d51591ac51-49f1e4edaff987995e31937db0f9e71f-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/0dc841eff8b3437d9d77fbf420b4ed81/snapshots/7c45e03d8e35411a821b89ed501bff98-00008.jpg","lang":"zh-Hant"},{"id":"cd6f426e00c","title":"中一入學2027｜香港真光書院資訊日 校長主講入學講座、設學科展覽及活動體驗","url":"https://www.stheadline.com/ohpama/3639375/中一入學2027香港真光書院資訊日-校長主講入學講座設學科展覽及活動體驗","summary":"位於香港南區鴨脷洲的資助女校香港真光書院，將於2026年12月5日（星期六）舉辦「中一入學資訊日」，讓高小學生及家長親身走入校園，認識學校的辦學理念、課程特色及升中安排。","summary_short":"位於香港南區鴨脷洲的資助女校香港真光書院，將於2026年12月5日（星期六）舉辦「中一入學資訊日」…","digest":"位於香港南區鴨脷洲的資助女校香港真光書院…","points":["位於香港南區鴨脷洲的資助女校香港真光書院，將於2026年12月5日（星期六）舉辦「中一入學資…","截止報名日期為2026年11月23日，有意出席的家長與同學宜於限期前到學校網站填寫報名表格並…","校長親自主講入學講座 設多元學科與活動體驗"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T07:30:23+08:00","size":1,"keywords":[],"body":"位於香港南區鴨脷洲的資助女校香港真光書院，將於2026年12月5日（星期六）舉辦「中一入學資訊日」，讓高小學生及家長親身走入校園，認識學校的辦學理念、課程特色及升中安排。截止報名日期為2026年11月23日，有意出席的家長與同學宜於限期前到學校網站填寫報名表格並查閱交通資訊。\n（圖片來源：星島新聞圖片庫）\n校長親自主講入學講座 設多元學科與活動體驗\n資訊日當日活動涵蓋講座、學科展示、互動體驗及校園導覽。除由羅楚雲校長親自主持入學講座，為家長講解中一收生安排及學校發展方向外，校方亦安排了學科介紹和展覽，讓來賓了解各科的教學內容與學生學習成果。此外，同學亦可參與課外活動體驗、欣賞學生表演及參觀校園設施，實地了解校園環境與學習氛圍。\n重視語文與全人培育 設多元化課程與課外活動\n書院關注學生的語文能力與全人發展。學校設有跨學科英語課程（LAC），並透過外籍英語老師主持中一英語銜接日營及提供非華語學生支援措施，協助新生適應中學的語言學習環境。\n課程設計方面，學校涵蓋中、英、數、公民與社會發展、綜合科學、STEAM、資訊及通訊科技，以及中史、歷史、地理、經濟、企會財、健康管理與社會關懷、聖經、家政、音樂、視覺藝術及體育等多元化科目，同時推行資優教育及閱讀推廣。課外活動方面，學生積極參與校外比賽與社區服務，截至2025年6月底累計獲獎671項，涵蓋藝術、文學、射箭、游泳及英語廣播劇等多個範疇。\n48周年校慶綜藝表演（圖片來源：《中學概覽》）\n中一自行分配學位收生準則\n根據《中學概覽》資料，該校中一自行分配學位收生準則比重如下（實際申請細則及最新安排以校方及教育局公布為準）：\n 評審項目\n 比重\n 學業成績及教育局成績次第\n 60%\n 面試\n 30%\n 課外活動表現及獎項\n 10%\n DSE成績穩健 中英文合格率逾九成\n在公開試表現方面，根據《中學概覽》資料，該校於2025年香港中學文憑試，中文及英文科合格率為99%及98%，均高於全港；合格率超過90%的科目共有12科，7科取得第4級或以上之百份率高於全港日校考生。入讀JUPAS學位課程之百份率比全港高，而且學校多年來四主科、最佳五科及多個選修科之增值均高於全港平均水平。\n前教育局局長楊潤雄訪校與師生交談。（圖片來源：《中學概覽》）\n香港真光書院「中一入學資訊日」\n日期：2026年12月5日（星期六）\n地點：香港鴨脷洲利東邨道1號\n報名：報名表格\n截止報名日期：2026年11月23日（星期一）","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c21ec464f6f","title":"南京企業家自掏腰包開「零元麵館」 卻周邊商販斥擾亂市場 | 網絡熱話","url":"https://news.tvb.com/tc/1206362-南京企業家自掏腰包開零元麵館卻周邊商販斥擾亂市場網絡熱話","summary":"江蘇南京的民營企業家張先生，為了做慈善和推廣素食，自費在南京市區開了兩家「零元麵館」。麵館吃麵不設領取門檻，排隊即可每人領取一份素麵，需自備碗筷，不能打包，一天最多送出2000多碗。","summary_short":"江蘇南京的民營企業家張先生，為了做慈善和推廣素食，自費在南京市區開了兩家「零元麵館」。","digest":"江蘇南京的民營企業家張先生，為了做慈善和推廣素食，自費在南京市區開了兩家「零元麵館」","points":["江蘇南京的民營企業家張先生，為了做慈善和推廣素食，自費在南京市區開了兩家「零元麵館」","麵館吃麵不設領取門檻，排隊即可每人領取一份素麵，需自備碗筷，不能打包…","殘障人士、80歲以上的老年人、環衛工、外賣騎手等，可以到店優先用餐"],"section":"生活","category":"熱話","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T07:15+08:00","size":1,"keywords":[],"body":"江蘇南京的民營企業家張先生，為了做慈善和推廣素食，自費在南京市區開了兩家「零元麵館」。麵館吃麵不設領取門檻，排隊即可每人領取一份素麵，需自備碗筷，不能打包，一天最多送出2000多碗。殘障人士、80歲以上的老年人、環衛工、外賣騎手等，可以到店優先用餐。\n\n店門口不少人排隊吃麵，人群打起「蛇餅」。周圍的店鋪，卻因此客流減半，有店主甚至打算租約到期就搬走，認為「零元麵館」嚴重擾亂市場，是導致他們收入急劇減少的直接原因。周邊的店主還在網上發帖，攻擊張先生這種不設門檻的慈善行為。有網民質疑，這種無差別的施捨，等於變相鼓勵不勞而獲，並未對社會風氣形成良好的引導作用，並且對周圍小本經營的其他商戶，也有不小的打擊。也有小部分網友認為，吃得起飯的人，怎麼可能花這麼長的時間排隊，僅僅為了吃一碗免費的素麵？他們就支持張先生這種不求回報的善舉，聲援他繼續堅持。一時之間，網絡上各種聲音交織。\n\n幾天之後，創辦人張先生回應，來吃麵的80%以上都是真正需要的人，否則不會每天自備碗筷，天天排隊來吃素麵。而對於周邊麵館營業額下降，他表示有媒體去隔壁店鋪調查發現，他們的營業額不降反升，並非如網上所說經營困難。並且出於人道主義，他甚至還給了隔壁店鋪1萬元作為補償。同時他也改變規則，設置門檻，只有殘障人士、60歲以上老人、環衛工人和退伍軍人，這四類人群才能免費吃麵。\n\n有律師就指出，「零元麵館」不構成不正當競爭，麵館沒有排擠同行的主觀意圖，本身也不盈利，但仍然存在邊界問題。有分析指，合法之外還有合理，底線之上還有情理，周邊小店的房租生計是現實，困難群體的用餐需求同樣值得重視，二者都不應被忽視。你又點睇呢？","image":"https://pro-vod-cdn.tvb.com/b10c04a14ef14cf5b27d6aa1aa2e892e/snapshots/4542d6b29a614fea838ece5ac5daa8a4-00006.jpg","video":"https://pro-vod-cdn.tvb.com/b10c04a14ef14cf5b27d6aa1aa2e892e/958a5d36aa2347498d2a24c7e184e868-297c879ca83005bad17b6d9e6eb37c59-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/b10c04a14ef14cf5b27d6aa1aa2e892e/snapshots/4542d6b29a614fea838ece5ac5daa8a4-00006.jpg","lang":"zh-Hant"},{"id":"cc7c8fc23ae","title":"英超｜曼城勢狂攻反底 淨勝兩球可置「富」","url":"https://www.stheadline.com/football-betting/3639420/英超曼城勢狂攻反底-淨勝兩球可置富","summary":"英超戰火重燃，三連敗的曼城急於在主場對富咸重啓勝門。","summary_short":"英超戰火重燃，三連敗的曼城急於在主場對富咸重啓勝門。","digest":"英超戰火重燃，三連敗的曼城急於在主場對富咸重啓勝門","points":["英超戰火重燃，三連敗的曼城急於在主場對富咸重啓勝門","藍月整體級數與戰術支配力遠超客軍，加上有國際賽期作調整，今仗勢可重新控制戰局","曼城的「10號仔」進攻中場卓基具備頂級創造力，面對預期會主動示弱兼重兵防守的富咸…"],"section":"生活","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T07:00:32+08:00","size":1,"keywords":[],"body":"英超戰火重燃，三連敗的曼城急於在主場對富咸重啓勝門。藍月整體級數與戰術支配力遠超客軍，加上有國際賽期作調整，今仗勢可重新控制戰局。曼城的「10號仔」進攻中場卓基具備頂級創造力，面對預期會主動示弱兼重兵防守的富咸，可成撕開鐵桶陣的罐頭刀，睇好曼城能重拾霸氣，推介讓球主客和讓兩破的「和」。\n曼城整體實力與主場火力依然屬英超頂班，共入21球排聯賽第2多，雖然近3場聯賽全敗，不過細看之下並非進攻啞火，而是激進的3-1-6進攻陣式，有單防中防守覆蓋嚴重不足的缺陷，導致攻守轉換時回追不及，令衝刺數據排英超包尾的缺點徹底現形，再加上後場連番失誤，失球無可避免。\n全攻型陣式效果顯著\n其實進攻方面，射手艾寧夏蘭特等人火力依舊強勁，今仗回師主場，只要修正後防低級犯錯，實力超群的藍月必可發揮主動控球優勢，壓前狂攻格殺對手。\n要瓦解預期泊大巴的富咸，曼城極需卓基在危險區域的魔法。這位本季已交出7球3助攻的法國天才，是現時球壇罕見的雙槍將，更是打破密集的最強解碼器。卓基在小範圍盤帶能為夏蘭特拉開防線縫隙，正如主帥馬列斯卡讚譽其具備獨一無二的局部突破天賦。只要將他鎖在進攻三區，不因過度回撤導致中場失誤，他和其餘進攻球員的配合將成為富咸新中堅艾芬格魯巴的夢魘。\n反觀客軍富咸今季進攻效率平平，推進速度僅每秒1.38米為英超最慢，同樣的中場保護力和回追力不足，導致防守轉換時場均送出高達4次黃金機會。在體力透支下，下半場失球率更高於上半場兩倍，對抗成功率低更僅排第16位。雖然富咸或會複製零封利物浦的鐵桶陣頑抗，但面對急於反彈的曼城，其回追死穴必遭懲罰。預計曼城全場狂攻下將剛好贏兩球，博有4.1倍的讓球主客和讓兩球「和」。馬高\n曼城 VS 富咸\nNow 621、611台今晚8:30直播\n推介：讓球主客和 [-2] 和","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0d27054bc8","title":"港超聯｜理文登榜首迎傷兵潮 贊卡路或考慮轉會窗增兵","url":"https://www.stheadline.com/football-news/3639445/港超聯理文登榜首迎傷兵潮贊卡路或考慮轉會窗增兵","summary":"港超聯周五（20日）晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首。","summary_short":"港超聯周五（20日）晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首。","digest":"港超聯周五晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首","points":["港超聯周五（20日）晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首","理文主教練贊卡路賽後認為，球隊今仗在領先後成功抵擋北區反撲…","北區由格蘭特頭槌追回一球，惟理文在補時階段獲判十二碼，巴科爾操刀射入，最終以3:1鎖定勝局"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T23:13:52+08:00","size":2,"keywords":[],"body":"港超聯周五（20日）晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首。理文主教練贊卡路賽後認為，球隊今仗在領先後成功抵擋北區反撲，並展現出比早前對傑志一戰更成熟的處理大賽能力；北區主教練冼家裕則表示，球隊整體發揮不差，只是角球防守失誤及十二碼判決令球隊付出代價。\n理文下半場三球奏功　北區首嘗敗績\n理文賽前以18分排第二，僅落後高力北區一分。今仗理文在下半場先由杜素諾夫接應角球頂入，巴科爾其後把握北區後防失誤建功，取得2:0領先。北區由格蘭特頭槌追回一球，惟理文在補時階段獲判十二碼，巴科爾操刀射入，最終以3:1鎖定勝局。高力北區吞下今季聯賽首場敗仗，理文則全取三分，反壓對手升上榜首。\n贊卡路讚球隊展現成熟一面\n贊卡路表示，理文在大部分時間控制比賽，但北區追回一球後，形勢一度變得緊張。他說，球隊最終能保持紀律，頂住對方的反撲，對結果感到滿意。他認為，北區是一支實力強、轉守為攻直接而且具威脅的球隊，今仗勝仗對理文提升信心十分重要。贊卡路又指，理文近11場贏得10場，只是早前對傑志一戰暴露出球隊處理關鍵時刻時稍欠成熟，但今仗球員在這方面有所進步，有助球隊建立一個更好的賽季。\n談到今場獲選為最佳球員的杜素諾夫表現，贊卡路認為這名球員不但在防守及比賽中具影響力，其積極的性格和訓練態度亦能感染隊友，推動其他球員提升表現。\n卡拉夫接受手術　理文或考慮增兵\n贊卡路透露，隊中球員卡拉夫特日前已接受手術，預計需要數月時間康復；另外基高里的情況亦相約，情況亦有待觀察。至於冬季轉會窗會否增兵，他表示球會會視乎實際需要作決定，現階段對現有陣容仍感滿意。\n冼家裕指失第一球成關鍵\n高力北區主教練冼家裕表示，球隊上、下半場均曾作出調整，並逐漸與理文形成均勢，可惜先在角球防守中失守，後防再出現失誤，令對手取得第二個入球。他說，球隊追回一球曾有機會追平，格蘭特的頭槌攻門若能命中，形勢或會改變；至於補時階段的十二碼判決，他表示難以評論。冼家裕認為，球隊整體表現並不差，惟在關鍵位置未能把握機會。\n北區今仗有大衛卡廸停賽，冼家裕承認球隊在侵略性及進攻方面受到一定影響，但拿華路 頂上後亦完成應有工作。他強調，球隊不會因首敗而承受額外壓力，會繼續「一場一場踢」，避免為球員設定過高目標。談到增兵部署，冼家裕表示管理層容許球隊考慮補強，現階段較可能集中在前鋒位置。共指球隊目前主要依靠格蘭特擔任正宗前鋒，若需作出輪換，替補選擇相對有限，因此教練團隊會再平衡外援名額及陣容調配。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"港超聯｜理文登榜首迎傷兵潮 贊卡路或考慮轉會窗增兵","url":"https://www.stheadline.com/football-news/3639445/港超聯理文登榜首迎傷兵潮贊卡路或考慮轉會窗增兵","source_display":"星島頭條","published_at":"2026-11-20T23:13:52+08:00","category":"生活","digest":"港超聯周五晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首"},{"title":"港超聯｜理文3:1挫高力北區 破對手金身重登榜首","url":"https://www.stheadline.com/football-news/3639441/港超聯理文31挫高力北區破對手金身重登榜首","source_display":"星島頭條","published_at":"2026-11-20T22:42:49+08:00","category":"生活","digest":"港超聯周五晚在旺角大球場上演榜首大戰，理文憑杜素諾夫、及巴科爾梅開二度…"}],"cross":{"total":2,"angles":[{"point":"港超聯周五晚在旺角大球場上演榜首大戰，理文憑杜素諾夫、及巴科爾梅開二度…","sources":["星島頭條"],"url":"https://www.stheadline.com/football-news/3639441/港超聯理文31挫高力北區破對手金身重登榜首"},{"point":"港超聯周五晚上演榜首大戰，理文在旺角大球場以3:1擊敗高力北區，反壓對手重登榜首","sources":["星島頭條"],"url":"https://www.stheadline.com/football-news/3639445/港超聯理文登榜首迎傷兵潮贊卡路或考慮轉會窗增兵"}]}},{"id":"c3225eaf539","title":"玫瑰戰爭｜小三拿驗孕棒向大婆示威！傅嘉莉嬲爆豁出去與馬國明激演情慾戲｜第九集劇情","url":"https://news.tvb.com/tc/1207476-玫瑰戰爭小三拿驗孕棒向大婆示威傅嘉莉嬲爆豁出去與馬國明激演情慾戲第九集劇情","summary":"【玫瑰戰爭】第九集精華 小三拿驗孕棒向大婆示威！傅嘉莉嬲爆豁出去與馬國明激演情慾戲《玫瑰》開拍情慾戲，懷孕的素希(陳楨怡)到片場向菲雅(傅嘉莉)示威，菲雅帶著不忿，與德龍(馬國明)鏡頭前火花四濺！","summary_short":"【玫瑰戰爭】第九集精華 小三拿驗孕棒向大婆示威！","digest":"【玫瑰戰爭】第九集精華 小三拿驗孕棒向大婆示威","points":["【玫瑰戰爭】第九集精華 小三拿驗孕棒向大婆示威","《玫瑰》開拍情慾戲，懷孕的素希(陳楨怡)到片場向菲雅(傅嘉莉)示威，菲雅帶著不忿…","德龍找上無雙(楊茜堯)，帶來線索證子盈(陳自瑤)之死非自殺，二人決定連手追查真相"],"section":"生活","category":"娛樂","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T22:00+08:00","size":2,"keywords":[],"body":"【玫瑰戰爭】第九集精華 小三拿驗孕棒向大婆示威！傅嘉莉嬲爆豁出去與馬國明激演情慾戲\n\n《玫瑰》開拍情慾戲，懷孕的素希(陳楨怡)到片場向菲雅(傅嘉莉)示威，菲雅帶著不忿，與德龍(馬國明)鏡頭前火花四濺！德龍找上無雙(楊茜堯)，帶來線索證子盈(陳自瑤)之死非自殺，二人決定連手追查真相。\n\n激演情慾戲\n\n德龍(馬國明)找上無雙(楊茜堯)，帶來線索佐證安安(鄺潔楹)所言非虛，二人決定聯手追查真相。\n《玫瑰》開拍情慾戲，懷孕的素希(陳楨怡)到片場向菲雅(傅嘉莉)示威，菲雅帶著不忿，與德龍鏡頭前火花四濺。\n\n關鍵證據USB\n\n雲生(陳豪)著綺雲(林夏薇)設法令安安噤聲。安安信任綺雲，向綺雲透露以前她無意中從鳳儀(姚子羚)的電腦中，取得了子盈(陳自瑤)接客片段，綺雲開價20 萬收購。\n\n志健(林景程)上門交收USB 時，安安竟當場抬價，志健直接向安安下殺手。安安倉皇逃脫時，遭私家車撞至重傷，昏迷不醒。久\n\n無雙手持接客影片\n\nUSB輾轉落入無雙手上，無雙看後震撼…無雙以公開影片脅逼鳳儀在《死亡揭露》道出真相，並主動認錯。另邊廂，無雙向綺雲直言安安的車禍並非意外，而是鳳儀所為。\n綺雲確信USB 已落在無雙手上，將此事告知雲生，雲生認為需盡快處理妥當，以免鬧大，並對鳳儀留著影片一事大興問罪。\n\n#TVB #玫瑰戰爭 #楊茜堯 #陳豪 #林夏薇 #馬國明 #陳展鵬 #姚子羚 #傅嘉莉 #陳自瑤 #陳楨怡 #陳星妤 #劇集 #港劇 #電視劇\n\n玫瑰戰爭｜星期一至五 晚上 8:30｜翡翠台","image":"https://pro-vod-cdn.tvb.com/03a454d9074846ae9f523e58e4692e66/snapshots/369d333032494558814036e0b03ebcce-00008.jpg","video":"https://pro-vod-cdn.tvb.com/03a454d9074846ae9f523e58e4692e66/c8724e58d4694dfd9bf244e022216808-d5e654928abf71dee802e4fef7657e44-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/03a454d9074846ae9f523e58e4692e66/snapshots/369d333032494558814036e0b03ebcce-00008.jpg","lang":"zh-Hant","items":[{"title":"玫瑰戰爭｜小三拿驗孕棒向大婆示威！傅嘉莉嬲爆豁出去與馬國明激演情慾戲｜第九集劇情","url":"https://news.tvb.com/tc/1207476-玫瑰戰爭小三拿驗孕棒向大婆示威傅嘉莉嬲爆豁出去與馬國明激演情慾戲第九集劇情","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T22:00+08:00","category":"娛樂","digest":"【玫瑰戰爭】第九集精華 小三拿驗孕棒向大婆示威"},{"title":"玫瑰戰爭劇情懶人包｜1-9集劇透率先睇 楊茜堯攜陳自瑤日記復仇 陳豪林夏薇各懷鬼胎","url":"https://www.stheadline.com/film-drama/3633144/玫瑰戰爭劇情懶人包1-9集劇透率先睇-楊茜堯攜陳自瑤日記復仇-陳豪林夏薇各懷鬼胎","source_display":"星島頭條","published_at":"2026-11-20T20:32:00+08:00","category":"生活","digest":"TVB 59周年重頭台慶劇《玫瑰戰爭》由楊茜堯、陳豪、林夏薇…"}],"cross":{"total":2,"angles":[{"point":"【玫瑰戰爭】第九集精華 小三拿驗孕棒向大婆示威","sources":["无綫新闻 TVB News"],"url":"https://news.tvb.com/tc/1207476-玫瑰戰爭小三拿驗孕棒向大婆示威傅嘉莉嬲爆豁出去與馬國明激演情慾戲第九集劇情"},{"point":"TVB 59周年重頭台慶劇《玫瑰戰爭》由楊茜堯、陳豪、林夏薇…","sources":["星島頭條"],"url":"https://www.stheadline.com/film-drama/3633144/玫瑰戰爭劇情懶人包1-9集劇透率先睇-楊茜堯攜陳自瑤日記復仇-陳豪林夏薇各懷鬼胎"}]}},{"id":"cc620498aed","title":"周末好去處︳愛創 Life is ARTsome社藝合作展 多元媒介藝術裝置 免費入場","url":"https://www.stheadline.com/lifetips/3639414/周末好去處愛創-Life-is-ARTsome社藝合作展-多元媒介藝術裝置-免費入場","summary":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑。","summary_short":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑。","digest":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑","points":["藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑","適逢基督教香港信義會社會服務部踏入五十周年，機構特別於石硤尾賽馬會創意藝術中心（JCCAC）…","這場別具意義的展覽匯聚了七組本地藝術家，與來自不同年齡層…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:45:53+08:00","size":2,"keywords":[],"body":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑。適逢基督教香港信義會社會服務部踏入五十周年，機構特別於石硤尾賽馬會創意藝術中心（JCCAC）舉辦「愛創 Life is ARTsome」社藝合作展。這場別具意義的展覽匯聚了七組本地藝術家，與來自不同年齡層、文化及生活背景的服務使用者同行整整一年，透過陶藝、光影、互動影像以至人工智能（AI）等多元媒介，共同創作出七組大型藝術裝置，將一個個觸動人心的生命故事化為可見可感的藝術語言。\n\n七件有溫度的作品\n走進展場，七件作品各有溫度與張力。在天幕裝置《風簾》中，張瑋晉與戒毒康復者攜手合作，讓微風吹動簾幕，象徵跨越掙扎後的重獲新生與希望；《屋企在途中》則由葉雯、陳朗丰與過渡性房屋居民運用AI與藝術共創，勾勒出基層家庭在安居路上的期盼與對「家」的想像。面對人口老化與照顧壓力，曾翠珊、林志輝與金齡長者及照顧者打造了互動影像《凝‧聽日常》，引領觀眾細味平凡生活中的深情陪伴；而黃翠雯與殘疾人士合作的陶泥板作品《手心裏的雙重奏》，則以雙手觸感記錄彼此默契，展現生命的韌力與尊嚴。\n此外，年輕一代與育兒家庭的心聲亦在展場中綻放光芒。林若曦與青少年透過光影藝術《動態皮影誌》，投射出成長路上的迷惘與蛻變；朱頌琪與幼兒照顧者創作的懸空裝置《我一嚿雲》，宛如為忙碌的照顧者提供一片喘息與放空的溫柔天空；劉清華則帶領幼兒學生以定格動畫《小小小小大冒險》，展現孩童純真眼界裏的無窮創意。\n除了七組社藝共創裝置，同場更設有「感動‧敢動 Love Creates」特別展區，展出多件信義會社會服務五十周年的重點標誌物。這些由前線同工精心挑選的日常物件，表面看似平凡無奇，背後卻盛載着半個世紀以來人與人之間最真摯的連結。\n「愛創 Life is ARTsome」社藝合作展展期由即日起至2026年11月23日，免費開放予公眾參觀。大家不妨抽空走進石硤尾JCCAC，在光影與創作之間放慢腳步，聆聽這群共創者真誠的生命故事，感受藝術與社會服務交織而成的溫暖力量。\n\nINFO\n日期： 即日至11月23日（星期一）\n時間： 星期一至四 10:30 - 17:30｜星期五至日 10:30 - 20:00\n地點： 石硤尾白田街30號賽馬會創意藝術中心（JCCAC）L0、L1藝廊及中庭（港鐵石硤尾站C出口）\n費用： 免費入場\n詳情： https://50th.elcss.org.hk/life-is-artsome","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"周末好去處︳愛創 Life is ARTsome社藝合作展 多元媒介藝術裝置 免費入場","url":"https://www.stheadline.com/lifetips/3639414/周末好去處愛創-Life-is-ARTsome社藝合作展-多元媒介藝術裝置-免費入場","source_display":"星島頭條","published_at":"2026-11-20T20:45:53+08:00","category":"生活","digest":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑"},{"title":"周末好去處｜愛創 Life is ARTsome社藝合作展 多元媒介藝術裝置 免費入場","url":"https://www.stheadline.com/hot-place/3639414/周末好去處愛創-Life-is-ARTsome社藝合作展-多元媒介藝術裝置-免費入場","source_display":"星島頭條","published_at":"2026-11-20T20:45:53+08:00","category":"","digest":"藝術從來不只是高高在上的殿堂美學，更是連繫彼此心靈的橋樑"}]},{"id":"c279f3702bb","title":"樂易玲慈善晚宴獻唱王菲《季候風》籌40萬 林盛斌激讚：又靚又唱得好聽","url":"https://www.stheadline.com/film-drama/3639484/樂易玲慈善晚宴獻唱王菲季候風籌40萬-林盛斌激讚又靚又唱得好聽","summary":"TVB助理總經理（藝員管理及發展）、邵氏電影執行董事及總經理樂易玲（樂小姐）向來人脈甚廣，昨晚盛裝率女神何沛珈、王嘉慧、鄧凱文、應屆港姐袁絲珩、鄧匡閔、李澤欣等出席慈善籌款晚宴…","summary_short":"TVB助理總經理（藝員管理及發展）、邵氏電影執行董事及總經理樂易玲（樂小姐）向來人脈甚廣，昨晚盛裝率女神何沛珈、王嘉慧…","digest":"TVB助理總經理（藝員管理及發展）、邵氏電影執行董事及總經理樂易玲向來人脈甚廣…","points":["TVB助理總經理（藝員管理及發展）、邵氏電影執行董事及總經理樂易玲（樂小姐）向來人脈甚廣…","當晚樂易玲一身黑色裝扮型爆登場，樂小姐為慈善不遺餘力，戰戰兢兢上台獻唱…","何沛珈及王嘉慧及應屆港姐都全程跟着節奏拍手和唱，樂易玲越唱越強，連司儀林盛斌也在台上笑說…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T01:36:01+08:00","size":1,"keywords":[],"body":"TVB助理總經理（藝員管理及發展）、邵氏電影執行董事及總經理樂易玲（樂小姐）向來人脈甚廣，昨晚盛裝率女神何沛珈、王嘉慧、鄧凱文、應屆港姐袁絲珩、鄧匡閔、李澤欣等出席慈善籌款晚宴，更罕有大開金口上台獻唱王菲經典金曲《季候風》及蘇苪《憑着愛》，為大會成功籌得40萬元善款！\n鄭衍峰李爾晨左右護航\n當晚樂易玲一身黑色裝扮型爆登場，樂小姐為慈善不遺餘力，戰戰兢兢上台獻唱，TVB小生鄭衍峰與李爾晨亦相當識做地全程在台上左右護航，又開啟手機的閃燈，高舉手機在空中揮舞，帶動全場氣氛！何沛珈及王嘉慧及應屆港姐都全程跟着節奏拍手和唱，樂易玲越唱越強，連司儀林盛斌也在台上笑說：「點搞呀，又靚，唱得又咁好聽，啲仔畀你媾晒啦！」唱完樂小姐緊張掩嘴，鄭衍峰拍拍她後腰壓驚。事後談感受，樂小姐仍按着心口形容好驚：「但見到善長仁翁喺晒度都要獻醜！」她落台前阿Bob笑住對她說：「好快喺叱咤頒獎禮上會到你。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c72d70041cf","title":"李居明-每句話都有能量 嘴巴深藏一生福報｜李居明大師會客室","url":"https://www.stheadline.com/lifetips/3639404/李居明-每句話都有能量-嘴巴深藏一生福報李居明大師會客室","summary":"看一個人有沒有福報？","summary_short":"看一個人有沒有福報？","digest":"看一個人有沒有福報","points":["就在於他一生人所講的話，有沒有幫到別人","可惜，目今社會上總有些人，經常做「臭口棗」批評別人，說人是非、詛咒別人，說一些很悲觀的說話…","特別做電台節目、做傳媒的，一句話會影響很多人"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T00:05:47+08:00","size":1,"keywords":[],"body":"看一個人有沒有福報？是不是好命？晚運好不好？就在於他一生人所講的話，有沒有幫到別人？還是傷害到別人？這句「人間好話」叫做「嘴巴深藏一生福報」。\n不要以罵人為職業\n一個人如果能夠祝福人多一點，讚美別人多一點，通常他們的福報比較厚。這令我們想起很多過世的前輩，令我們懷念他，因為他們真的是「嘴巴深藏一生福報」的典範。\n可惜，目今社會上總有些人，經常做「臭口棗」批評別人，說人是非、詛咒別人，說一些很悲觀的說話，代表他們沒有福報可言。英文有句諺語說得非常傳神：If you are good at nothing, be a critic，中文意思是：如果你一事無成，便去罵人為你的職業吧！\n古文化很重視「語焉吉祥」。我們講的每一句說話、每一個字，其實都有一種能量，我們真的不要用負面的言語去影響別人，更加不要影響自己的福報。特別做電台節目、做傳媒的，一句話會影響很多人。\n就像我每一年的運程書，每個字都會影響很多人。所以每年寫運程書，我都要閉關，慎而重之，如果寫錯了一句話影響別人，我都覺得很難過。坦白地說，每年我最大壓力就是寫運程書，第一要起卦，起完卦又要分析，然後找到解藥。所以，每年運程書都是壓軸登場。三十多年來，我的運程書檔期是沒有變過的。原因是運程書應該是迎聖誕、過新曆年、再是賀農曆年，這才是運程書正確的檔期。\n無論如何，我希望贈這句說話給所有的人，特別是現在年輕人，你記住千萬不要向別人說粗口。因為你一說粗口的時間，一定問候別人的阿媽，這件事是非常之不道德和不禮貌的，這是會折損你自己的好福報。雖然有時候衝口而出，但是也要記得一句說話「激氣不如爭氣」！\n嘴巴深藏一生福報，一個人如果能夠祝福人多一點，讚美別人多一點，通常他們的福報比較厚。\n機械人首次搭台板演出《粤劇特朗普6.0》，大受觀眾歡迎，並一起參與首演晚的拜神儀式。\n自己站不穩，別人靠不住\n「自己站不穩，別人靠不住」意思是自己都照顧不到自己，你怎麼可以去成為別人的靠山呢？這句話是源於一個故事。話說有一個好心人，看見路人日曬雨淋，於是在路邊蓋了個涼亭，但因為沒有很多錢，泥水工料不夠，結果涼亭倒塌反而壓死了在裏面乘涼的人，好心做壞事。所以，現代人的哲學是，自己先豐足起來，自立強大了，再去惠及他人。\n很多人都很有善心想幫人，但每個人都要有自知之明，你沒實力，你就不要經常想着去幫人。越幫越忙，幫出個禍，累人又累己。這句話很深刻！就是說你自己先要在社會上站得住腳、賺到錢、生活變得很實淨了，你才可以談理想去幫助人。你自己都不實淨，就不要盲目去幫人。所以我經常說「先媚世俗，後談理想」，便是這個道理。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":8,"items":[{"id":"c77b3ea4985","title":"體育爭議解決高峰會十二月一日舉行 現已接受免費登記","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000818.htm","summary":"律政司、香港律師會及香港大律師公會將於十二月一日（星期二）合辦體育爭議解決高峰會，展現推動香港成為國際體育爭議解決中心的獨特優勢與發展潛力，進一步深化香港作為國際法律及解決爭議服務中心的地位。","summary_short":"律政司、香港律師會及香港大律師公會將於十二月一日（星期二）合辦體育爭議解決高峰會…","digest":"律政司、香港律師會及香港大律師公會將於十二月一日合辦體育爭議解決高峰會…","points":["律政司、香港律師會及香港大律師公會將於十二月一日（星期二）合辦體育爭議解決高峰會…","隨着大型體育盛事及體育產業蓬勃發展，公平、專業及高效的爭議解決機制對促進體育界長遠發展至關重…","是次高峰會匯聚世界各地的頂尖體育法律及爭議解決專家，包括來自國際體育仲裁法庭…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T09:00:00+08:00","size":1,"keywords":[],"body":"律政司、香港律師會及香港大律師公會將於十二月一日（星期二）合辦體育爭議解決高峰會，展現推動香港成為國際體育爭議解決中心的獨特優勢與發展潛力，進一步深化香港作為國際法律及解決爭議服務中心的地位。\n\n　　隨着大型體育盛事及體育產業蓬勃發展，公平、專業及高效的爭議解決機制對促進體育界長遠發展至關重要。是次高峰會匯聚世界各地的頂尖體育法律及爭議解決專家，包括來自國際體育仲裁法庭、法國律師全國公會、中國體育仲裁委員會及香港法律專業團體的代表。\n\n　　律政司副司長兼體育爭議解決諮詢委員會主席張國鈞博士、香港律師會會長湯文龍、香港大律師公會體育及運動法專業委員會主席丘揚萬，以及中國香港體育協會暨奧林匹克委員會副會長霍啟剛將出席高峰會並致辭。\n\n　　高峰會設有兩場專題座談會，各地專家將雲集香江，從中國內地、香港、亞洲以至國際的多元視角出發，深入探討國際體育調解及仲裁的最新趨勢與未來發展，為業界及公眾帶來具前瞻性的專業洞見。\n\n　　張國鈞博士表示，律政司與香港體育界和法律界一直合作無間，積極開拓與國際及區域體育組織的合作，以期推動香港體育爭議解決服務走向國際。\n\n　　他指出，繼去年初成立體育爭議解決諮詢委員會，於十二月推出為期兩年的體育爭議解決先導計劃，社會各界反應正面。隨着啟德體育園啓用及大型國際賽事接連在港舉行，本地體育產業正全速發展。建立公平高效的爭議解決機制，已成為產業升級不可或缺的制度基建。憑藉「一國兩制」的獨特優勢、穩健的普通法制度、具備國際水平的爭議解決機構及專業人才，配合國際調解院在香港運作的協同效應，香港實在是成為國際體育爭議解決中心的理想地。\n\n　　他說：「我們亦正積極爭取國際主要體育組織落戶香港。在此向大家分享一則好消息——今年內將有一家重要的區域性體育法律組織的總部落戶香港。詳情我們先賣個關子，將於適當時候公布。」\n\n　　高峰會將於十二月一日上午九時半至下午一時舉行，現已接受免費登記。有興趣參與的人士，可即日起登入Hong Kong Legal Hub網頁預先登記。名額有限，先到先得。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb659aed824","title":"駐三藩市經貿辦透過院校合作推廣香港電影","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100100.htm","summary":"香港駐三藩市經濟貿易辦事處（駐三藩市經貿辦）透過與三藩市大學及柏克萊藝術博物館暨太平洋電影資料館（BAMPFA）建立緊密合作，深度推廣香港電影。","summary_short":"香港駐三藩市經濟貿易辦事處（駐三藩市經貿辦）透過與三藩市大學及柏克萊藝術博物館暨太平洋電影資料館（BAMPFA）建立緊密…","digest":"香港駐三藩市經濟貿易辦事處（駐三藩市經貿辦）透過與三藩市大學及柏克萊藝術博物館暨太平…","points":["香港駐三藩市經濟貿易辦事處（駐三藩市經貿辦）透過與三藩市大學及柏克萊藝術博物館暨太平洋電影資…","院校合作讓香港電影走進三藩市灣區的大學及博物館社群","「香港光影」系列首個放映會十一月九日（三藩市時間）於三藩市大學舉行…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T05:45:00+08:00","size":1,"keywords":[],"body":"香港駐三藩市經濟貿易辦事處（駐三藩市經貿辦）透過與三藩市大學及柏克萊藝術博物館暨太平洋電影資料館（BAMPFA）建立緊密合作，深度推廣香港電影。院校合作讓香港電影走進三藩市灣區的大學及博物館社群。\n\n　　「香港光影」系列首個放映會十一月九日（三藩市時間）於三藩市大學舉行，以香港歷來最高票房的本地電影《破·地獄》打響頭炮。是次放映與三藩市大學亞太研究中心合辦，讓駐三藩市經貿辦的電影推廣工作延伸至大學社群，並吸引逾50名學生及社區人士參與。\n\n　　駐三藩市經貿辦亦繼續與BAMPFA合作。BAMPFA是加州大學柏克萊分校旗下的藝術博物館、電影院及電影資料館。繼於二○二六年一月及二月成功合辦「花樣年華：王家衛電影」系列後，雙方於十月二十三日至十一月二十八日（柏克萊時間）呈獻「香港電影：珍稀佳作與修復之作」系列。系列涵蓋逾30年的香港電影，共放映九部作品，題材由愛情到武俠，包羅萬有。\n\n　　​駐三藩市經貿辦處長張岱楨表示：「在過去一年，駐三藩市經貿辦在加州、科羅拉多州、夏威夷州及華盛頓州四個州份，共舉辦或支持了13個國際及區域電影節、社區放映會和電影回顧展，有助推廣香港文化。我們很高興與知名院校合作，將香港電影帶給灣區社群。」\n\n　　三藩市大學亞太研究中心總監Wei Yang Menkus教授表示：「透過電影認識一個地方，總有一種特別的感受。電影帶領我們走進當地人的日常生活和他們身處的世界，也讓我們看見跨越文化、連繫彼此的故事。我們非常感謝駐三藩市經貿辦與把出色的香港電影作品帶給三藩市大學及灣區社群，並慶幸能夠參與這項合作。」\n\n　　BAMPFA電影部總監兼資深策展人Susan Oxtoby表示：「我們感謝駐三藩市經貿辦一直與我們合作，在BAMPFA呈獻香港電影。無論是王家衛電影回顧展，還是現正舉行的『香港電影：珍稀佳作與修復之作』系列，我們都感謝駐三藩市經貿辦提供推廣宣傳及建立交流網絡的機會。」\n\n　　三藩山市長辦公室國際貿易及商務總監馬克錢德勒出席了《破·地獄》放映會，並於會後表示：「這是一部不論國籍或背景，所有觀眾都不容錯過的電影。這部震撼人心的作品呈現了家庭傳統、迷信觀念與尊重。片中栩栩如生的角色及描寫哀傷家庭的故事，令人深受感動。我感謝駐三藩市經貿辦透過與三藩市大學合作促成這個機會，讓灣區觀眾能夠欣賞香港電影。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf99f473139","title":"文創處資助舉辦「deTour 2026設計節」今日開幕","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000252.htm","summary":"由文化體育及旅遊局（文體旅局）轄下文創產業發展處資助、PMQ元創方主辦的「deTour 2026設計節」（deTour 2026）今日（十一月二十日）在中環PMQ元創方舉行開幕禮。","summary_short":"由文化體育及旅遊局（文體旅局）轄下文創產業發展處資助、PMQ元創方主辦的「deTour 2026設計節」（deTour…","digest":"由文化體育及旅遊局轄下文創產業發展處資助…","points":["由文化體育及旅遊局（文體旅局）轄下文創產業發展處資助…","作為香港年度設計盛事之一，deTour 2026匯聚本地及海外的設計社群…","文體旅局副局長劉震出席開幕禮時表示，deTour自二○一四年舉辦以來…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T22:45:00+08:00","size":1,"keywords":[],"body":"由文化體育及旅遊局（文體旅局）轄下文創產業發展處資助、PMQ元創方主辦的「deTour 2026設計節」（deTour 2026）今日（十一月二十日）在中環PMQ元創方舉行開幕禮。作為香港年度設計盛事之一，deTour 2026匯聚本地及海外的設計社群，由即日起至十一月二十九日舉辦一系列展覽、工作坊及交流活動，讓公眾親身體驗創意設計與日常生活的融合。\n\n　　文體旅局副局長劉震出席開幕禮時表示，deTour自二○一四年舉辦以來，累計接待逾130萬名訪客，並吸引超過220個來自香港及境外的設計單位參與。這項年度設計盛事不僅成為展示本地及國際創意人才的理念和創意的重要平台，更展現其在設計界的影響力和認受性。加上今屆首度推出的快閃店及一系列精彩活動，設計節將為公眾帶來全方位的沉浸式體驗。\n\n　　deTour 2026以「BETTER, NOT PERFECT 不完美，更美好：Prototypes for Tomorrow」為主題，設有三大展區，展出來自香港、中國內地及海外創作者帶來的概念及作品。今屆設計節新設快閃店，發售本地及海外設計師的限量產品、生活用品及deTour 2026周邊商品，讓設計人才獲得更多的曝光機會，展現設計如何融入日常生活，並加深公眾對設計的認識與欣賞。\n\n　　更多關於deTour 2026的資訊，請瀏覽detour.hk。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c80e586f33f","title":"特區政府強烈不滿和堅決反對美中經濟與安全審議委員會報告","url":"https://www.info.gov.hk/gia/general/202611/20/P2026112000800.htm","summary":"​香港特別行政區（特區）政府今日（十一月二十日）就美中經濟與安全審議委員會發表所謂「二○二六年報告」，以失實和偏頗的詆毀，污衊抹黑香港特區各方面的情況，表示強烈譴責，並必須嚴厲直斥其非。","summary_short":"​香港特別行政區（特區）政府今日（十一月二十日）就美中經濟與安全審議委員會發表所謂「二○二六年報告」…","digest":"香港特別行政區政府就美中經濟與安全審議委員會發表所謂「二○二六年報告」…","points":["​香港特別行政區（特區）政府今日（十一月二十日）就美中經濟與安全審議委員會發表所謂「二○二六…","特區政府發言人強調：「香港特區是中華人民共和國不可分離的部分…","特區政府發言人表示：「特區政府堅定維護香港市民受到法律保障的權利和自由"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-20T21:35:56+08:00","size":1,"keywords":[],"body":"​香港特別行政區（特區）政府今日（十一月二十日）就美中經濟與安全審議委員會發表所謂「二○二六年報告」，以失實和偏頗的詆毀，污衊抹黑香港特區各方面的情況，表示強烈譴責，並必須嚴厲直斥其非。\n\n　　特區政府發言人強調：「香港特區是中華人民共和國不可分離的部分，在『一國兩制』下是一個享有高度自治權、直轄於中央人民政府的地方行政區域。『一國兩制』以《憲法》和《基本法》為法律依據實施，為基本權利和自由提供憲制上的保證，包括法律面前一律平等的權利保證，更在法治和獨立司法權之下得以鞏固。特區政府強烈不滿和堅決反對美中經濟與安全審議委員會肆意以政治凌駕法治，一再透過發表所謂報告干預香港特區事務。」\n\n　　「香港特區堅決維護國家主權、安全和發展利益，全面準確貫徹『一國兩制』方針的最高原則。特區政府會繼續堅定不移全面準確實施《香港國安法》、《維護國家安全條例》和其他維護國家安全的相關法律，依法有效防範、制止和懲治危害國家安全的行為和活動，同時堅持法治原則，依法保障香港市民的權利和自由，確保『一國兩制』實踐行穩致遠。特區政府再次強烈敦促美國認清事實，遵從國際法和國際關係的基本準則，立即停止干涉純屬中國內政的香港事務。」\n\n保障權利和自由\n\n　　特區政府發言人表示：「特區政府堅定維護香港市民受到法律保障的權利和自由。自香港回歸祖國以來，人權一直受到《憲法》和《基本法》的堅實憲制保障。《香港國安法》及《維護國家安全條例》是香港恢復秩序、保障自由和發展的制度基礎。《香港國安法》和《維護國家安全條例》訂明的罪行精準針對危害國家安全的行為，清楚訂明構成有關罪行的元素和刑罰。有關法律不會影響本地的機構、組織和人員與其他國家、地區及聯合國等相關國際組織的正常交流。奉公守法的人士不會誤墮法網。」\n\n　　「《香港國安法》和《維護國家安全條例》清楚訂明香港特區維護國家安全應當尊重和保障人權，依法保護香港居民根據《基本法》、《公民權利和政治權利國際公約》和《經濟、社會與文化權利的國際公約》適用於香港的規定，有關言論、新聞、出版、結社、集會、遊行、示威的權利和自由。然而，和世界其他地方一樣，有關權利和自由並非絕對。《公民權利和政治權利國際公約》亦清楚訂明，在有必要保障國家安全、公共安全、公共秩序或他人的權利和自由等情況下，可以依法限制部分權利和自由。所謂報告片面引用數據扭曲事實，抹煞香港特區一直以來堅定保障市民依法行使權利和自由的決心和工作，特區政府必須直斥其非，予以強烈譴責。」\n\n　　「自《香港國安法》和《維護國家安全條例》實施以來，本港的傳媒環境蓬勃依然。新聞和言論自由一直在憲制層面受到《基本法》的堅實保障。傳媒享有評論和批評政府施政的自由，與此同時與其他人一樣必須遵守所有法律；只要不違法，其行使自由的權利全然不受限制。確立的人權法原則是，新聞工作者必須按『負責任新聞作業』原則真誠地行事，以準確事實為基礎，並提供準確可靠的資訊，方可獲言論和新聞自由權利保障。反之，美國的傳媒環境卻日趨嚴峻。據統計，二○二六年至今，美國的執法當局已拘捕40多名記者；而對記者施加暴力（包括強行按倒在地、以警棍毆打、甚至向其射擊）的個案更近170宗，當中絕大部份涉及執法人員。美國官員經常辱罵提問的記者，隨意禁止主流傳媒進入白宮進行採訪及參加記者會的做法亦變本加厲，即使美國法院於今年十月發出臨時禁制令暫時停止美國政府有關做法，部分傳媒在白宮的採訪活動仍然受阻。惟美方卻聯同部分別有用心人士刻意捏造有關香港新聞和言論自由的情況，實在是恬不知恥。」\n\n　　「就大埔宏福苑火災，特區政府正全力推進善後工作，以獨立委員會報告作基礎推行全面改革，並追究刑事責任和行政責任。然而，一些別有用心的外部勢力及反中亂港分子，在火災發生後，意圖透過在網上散播假新聞、假消息，甚至派發煽動性傳單等，惡意抹黑救援工作、挑動社會分化對立，影響社會團結一致推動救災善後工作。特區政府絕不容忍任何惡意抹黑、煽動仇恨的行為，依法採取果斷執法行動。」\n\n維護國家安全法律\n\n　　發言人強調：「危害國家安全是嚴重的罪行，沒有國家會對危害國家安全的行為和活動袖手旁觀。美國有龐大而嚴密的國安法律體系，除了有多部維護國家安全法律，以所謂『國家安全』為名簽發的行政命令更不計其數，泛化『國家安全』概念打壓別國、巧取豪奪、侵犯別國主權，甚至動用軍隊濫殺平民、實行法外處決，在二○二五年九月至二○二六年九月期間便以『防止毒品恐怖主義』為名攻擊民用船隻殺害至少230名平民。美中經濟與安全審議委員會對香港特區維護國家安全法律和執法所持的標準與評價自己國家的侵犯人權問題截然不同，是實實在在的雙重標準，純屬卑劣的政治操弄，必須予以強烈譴責。」\n\n　　「香港特區負有維護國家安全的憲制責任，必須持續完善維護國家安全的法律制度和執行機制，以持續有效防範、制止和懲治危害國家安全的行為和活動。特區政府於今年三月制定《2026年〈中華人民共和國香港特別行政區維護國家安全法第四十三條實施細則〉（修訂）實施細則》（《修訂細則》）符合《基本法》，包括有關人權的條文，以及《香港國安法》的有關規定。《修訂細則》的多項措施設有由司法機關把關的機制，以確保執法人員在執行各項措施時，既能有效防範、制止和懲治危害國家安全的行為和活動，也能同時按《香港國安法》第四條及第五條的要求，充分保障個人和組織的合法權利。根據經修訂的《實施細則》附表1，在一般情況下，警務人員必須有合理理由懷疑電子設備可能包含危害國家安全罪行的證據，並向裁判官申請手令及獲得授權後，才能根據手令搜查該電子設備，以獲取相關犯罪證據。只有在依法獲得授權就電子設備行使搜查權力後，警方才有權要求指明人士提供電子設備的密碼或解密方法。」\n\n　　「特區政府於今年六月訂立《維護國家安全（程序事宜）規例》，清楚述明在《香港國安法》和《維護國家安全條例》下界定『特區的法律下其他危害國家安全的罪行』的機制，細化相關程序事宜，為《香港國安法》、《維護國家安全條例》等相關規定的實施帶來更大確定性。行政長官證明書的有關規定與普通法原則完全一致。香港和美國等普通法司法管轄區的法院均確立司法機關須尊重行政機關對國家安全問題的評估與判斷。一宗二○一○年美國最高法院案例指出：『國家安全和外交政策問題與應對不斷演變的威脅有密切關係，而在相關領域的資訊難以獲取，且某些行為的影響也難以評估』，並指出：『法院明顯欠缺評估相關問題的能力』。有關規例沒有改變現有和行之有效的規定，沒有改變《香港國安法》、《維護國家安全條例》的適用範圍，沒有改變『危害國家安全的罪行』的定義，也沒有訂立新的罪行、罰則或執法權力。美中經濟與安全審議委員會全然漠視香港特區訂立及持續優化相關法律的憲制責任和實際需要，反而對香港特區維護國家安全的法律制度和執行機制指手畫腳，其偽善之心昭然若揭，令人齒冷。」\n\n　　「在複雜多變的地緣政局下，香港得以在《香港國安法》等維護國家安全法律的保障下，發揮『一國兩制』下內聯外通、國際化和多元包容的獨特優勢，充分發揮『超級聯繫人』和『超級增值人』的角色，致力為環球投資者打造穩定安全的投資環境。一如既往，近日香港特區境內舉辦多項盛事，涵蓋法律、經濟金融、海運等不同範疇，當中不乏重要國際會議，吸引世界各地人士來港參與；國際機構相繼在香港設立總部或辦事處，包括國際調解院、國際統一私法協會等；加上近年在各項主要國際競爭力及發展排名中表現優異，充分展現香港作為國際金融和商貿中心與各界對香港的肯定和信心，使各種意圖攻擊香港特區的謊言不攻自破。」\n\n維護司法公正和法治精神\n\n　　特區政府發言人指出：「香港是法治社會，特區政府一直依法履行維護國家安全的憲制責任，堅持有法必依、執法必嚴、違法必究的原則。《香港國安法》第五條和《維護國家安全條例》第2條明確訂明防範、制止和懲治危害國家安全犯罪，應當堅持法治原則。」\n\n　　「特區政府維護獨立的司法權，全力支持司法機構依法獨立行使審判權，維護司法公正和法治精神。《基本法》第二條、第十九條及第八十五條訂明，香港特區享有獨立的司法權和終審權，法院獨立進行審判，不受任何干涉。法官在處理危害國家安全犯罪案件時，一如其他案件，都是獨立公正地履行司法職責，不受任何干涉，而所有面對刑事指控的人都享有接受公平審訊的權利。法院嚴格按照證據和所有適用法律判案，案件不會因涉案者的職業、政治理念或背景而在處理上有所不同。六年多以來的實踐證明，法院嚴格按照上述原則處理涉及《香港國安法》及特區其他維護國家安全法律的案件。 」 \n\n　　「律政司按《基本法》第六十三條主管刑事檢控工作，不受任何干涉，所有檢控決定是基於所有可接納的證據和適用法律進行客觀分析後作出，而控方有責任在毫無合理疑點下證明被告人犯罪，被告人才可被法庭定罪。」\n\n　　「香港特區執法部門一直根據證據、嚴格依照法律，以及按有關人士或單位的行為而採取執法行動，與涉事人士或組織的政治立場、背景或職業無關。所有案件均是嚴格根據證據和依照法律處理；所有被告均嚴格按照香港適用法律（包括《香港國安法》），並在《基本法》及《香港人權法案》的保障下接受公平審訊。任何倡議某些人或組織不應就其違法行為承擔其法律後果，等同給予其犯法特權，這完全違反法治精神。」\n\n　　「就所謂的報告對黎智英被控危害國家安全罪行一案（『黎智英案』）判決的惡意抹黑，特區政府必須再次強調法庭是嚴格按照證據和所有適用法律判案，依法對黎智英及各被告作出重判，彰顯了法治和公義，而黎智英已選擇不就其定罪及判刑提出上訴。特區政府留意到以美西方為首的外部勢力一直不斷抹黑香港特區在『黎智英案』的執法行動和司法程序，試圖干預香港特區法院依法進行審判，作出妨礙司法公正和破壞法治的行為。這些卑鄙圖謀在香港特區法庭不偏不倚作出的審判後不攻自破，惟美國在面對這些鐵一般的事實，依然顛倒是非、惡意攻擊，令人不齒。特區政府必須再次嚴正駁斥，以正視聽。」\n\n　　「所謂的報告亦有提及的『支聯會煽動顛覆國家政權』案。法庭頒下的裁決理由書已經明確指出，『支聯會』綱領的目標就是要推翻和破壞中國共產黨在《憲法》下的領導地位。被告透過挑起敵意和分化，企圖令香港市民對中國共產黨失去信任，從而達到破壞中華人民共和國根本制度的目的。裁決理由書清楚指出，被告並非因其政治觀點或信念受審。該案說明，任何人煽動顛覆國家政權、危害國家安全，最終都會被依法懲治，絕不姑息。法律從不容許任何人假借人權、民主和自由之名偷樑換柱，公然傷害自己的國家及同胞。」\n\n　　「至於所謂的報告提及黃之鋒涉及的『串謀勾結外國或者境外勢力危害國家安全罪』案件，黃之鋒承認控罪並被判處監禁十年。在大量事實和證據面前，黃之鋒無從狡辯。事實上，本案以外，黃之鋒屢次犯法，包括非法集結、藐視法庭等，視法律如無物。他在各宗刑事案件中被依法懲治，實屬咎由自取，亦屬天經地義。」\n\n　　「《香港國安法》及《維護國家安全條例》下的罪行訂有適當的域外效力，完全符合國際法原則、國際慣例和各國各地區通行做法，實屬必要和正當，並與世界其他國家和地區一致。香港警方作為特區維護國家安全的執法部門，有責任依法追究在境外涉嫌危害國家安全的惡行。該等一直潛藏境外的潛逃者被通緝，是因為他們在當地繼續公然從事危害國家安全的勾當，肆意勾結外部勢力包庇其惡行。警方採取一切合法措施，強烈打擊有關潛逃行為，做法有理有據，實屬必要和正當。事實上，包括美國等不少國家也會就不同的通緝犯施行措施打擊潛逃行為。美方無視《聯合國憲章》下最基本的主權平等和不干涉原則，濫施長臂管轄、亂揮『制裁』大棒、跨境擄挾甚至擊殺主權國家領導人，才是赤裸裸的『跨境鎮壓』。」\n\n　　「就所謂的報告中提及有關潛逃者郭鳳儀的父親被裁定『企圖直接或間接處理屬於有關潛逃者或由有關潛逃者擁有或控制的資金或其他財務資產或經濟資源』罪罪成一案，判刑理由書清楚指出，有關控罪旨在防範他人處理潛逃者資產，令潛逃者在潛逃期間，無法動用或移轉其資金和資產，增加其回港面對司法程序的機會。有關案件的性質嚴重，涉案行為有機會令潛逃者可繼續潛逃並進行其危害國家安全的勾當，惟有關定罪和刑罰不存在任何『連坐』懲罰，亦與被告是否潛逃者親屬無關。」\n\n　　「就香港駐倫敦經濟貿易辦事處（經貿辦）一名僱員被英國法院裁定『協助外國情報機構』罪名成立，特區政府重申，相關控罪涉及不實指控和抹黑，英方以『莫須有』罪名提告，濫用法律、操弄司法程序，案件全然是英方的政治操弄，目的是為外逃在英的反中亂港分子撐腰站臺，污蔑抹黑中國中央政府及香港特區政府。正如我們由案件開始至今一直明確指出，案件所涉的指控與特區政府、駐倫敦經貿辦及其工作絕無關連，我們堅決反對所有不實指控。英國當局的拙劣把戲亦同時突顯其《2023年國家安全法》下『協助外國情報機構』罪的寬泛、含糊和嚴苛本質，特別是控方就此罪無須證明被告人所協助的外國情報機構究竟是何組織，明顯損害了被告人獲得公平審訊的權利。」\n\n堅持「有效市場」和「有為政府」相結合\n\n　　特區政府發言人指出：「香港一直堅持奉行市場經濟的經濟政策，包括自由貿易，資金、人才和資訊自由流動，保障私有財產，簡單稅制，以及法治等。這些一直是我們成功不可或缺的元素。事實上，《香港特別行政區經濟和社會發展第一個五年規劃（2026-2030年）》（香港五年規劃）強調香港對市場經濟和面向全球的長期堅持，絕無偏離市場經濟。香港五年規劃第一篇已開宗明義指出，『有效市場』和『有為政府』雙管齊下的方針是規劃的基本原則之一，而其後各章闡述的頂層經濟策略亦一再印證這個原則。任何指稱香港因香港五年規劃出台而偏離資本主義市場經濟的說法，絕對子虛烏有。」\n\n　　「有效管治與成功的市場經濟從來沒有對立。世界主要經濟體進行中長期經濟規劃，是普遍甚至必要的做法，從而在充滿不確定因素的全球環境中推動經濟發展。投資者確實重視政府政策的確定性，因為這有助營造穩定的營商環境。該報告的失實聲稱顯示報告對香港現況和香港五年規劃缺乏了解，並完全漠視政府透過清晰闡述政策和有效規管，促進經濟和社會發展的願景，我們對此深表遺憾。」\n\n打擊洗錢和執行制裁\n\n　　發言人又指出︰「特區政府高度重視維護金融體系的誠信及穩健。本港銀行和其他金融機構均嚴格遵守包括打擊洗錢和恐怖分子資金籌集的國際標準和最佳做法。專責制訂打擊洗錢和恐怖分子資金籌集國際標準的財務行動特別組織已確認香港整體，尤其在識別及了解風險、執法、追討資產及國際合作等方面符合相關國際標準，並擁有健全的法律架構及有效的制度。在虛擬資產方面，虛擬資產交易平台發牌制度自二○二三年六月起實施，規定虛擬資產交易平台須符合適當人選準則，並遵從打擊洗錢和恐怖分子資金籌集的相關規定。此外，我們將於下月向立法會提交條例草案，擴大虛擬資產服務的規管制度至涵蓋新增服務類型（包括交易、提供意見、管理及託管服務），藉此進一步提升香港打擊與虛擬資產相關的洗錢及恐怖分子資金籌集活動框架的有效性。」\n\n　　「特區政府一直全面及嚴格執行聯合國安全理事會（安理會）施加的制裁，以履行國際義務。我們不會執行其他國家施加的單邊制裁或其他單邊限制措施。這些所謂『制裁』及單邊措施違反以國際法為基礎的國際秩序，和以《聯合國憲章》宗旨和原則為基礎的國際關係基本準則。特區政府通過有效的機制執行聯合國安理會的決議，包括拒絕聯合國安理會指定及可疑的船隻進入香港；監察和巡查可疑的香港公司，防止其參與規避聯合國制裁的活動；以及通過中央人民政府參與《化學武器公約》及《武器貿易條約》。我們的工作成效，一直獲得各貿易夥伴的尊重和認同。」\n\n經完善的選舉制度\n\n　　特區政府發言人指出：「二○二一年完善選舉制度後產生的立法會全面落實『愛國者治港』，符合確保政權掌握在愛國者手中這世界通行的政治原則。完善後的立法會已徹底擺脫以往對立撕裂、議事堂失序失效的亂象，重回理性務實的正軌，高效高質量議政，集中精力發展經濟、改善民生，使『一國兩制』行穩致遠。第八屆立法會換屆選舉於去年年底順利舉行，選民積極投票，選出新一屆愛國愛港、有擔當、有才幹、有志服務社會的立法會議員，再次展現新選舉制度下高質量、高水平的良性競爭，體現了廣泛代表性和均衡參與。完善後的立法會以實踐證明，這是符合香港特區實際情況、是適合香港需要的民主選舉制度。」\n\n加強國民教育\n\n　　特區政府發言人指出：「學校是學生學習和成長的地方，學校有責任提供安全有序的校園環境和氛圍，防止政治干預或違法活動入侵校園，以保障學生福祉。國民教育一直是香港中小學及幼稚園課程重要部分，以加強學生對國情、歷史和文化、《憲法》和《基本法》，以及國家安全的認識，建立文化自信，提升國民身分認同，培育他們成為德才兼備，有承擔、有視野、愛國愛港的新一代。此外，教師是學生的重要楷模，肩負知識傳承、熏陶品德的重要職責，特區政府有責任確保教師的專業操守。實施包括國家安全教育在內的國民教育，是世界各地教育當局正當合理的責任，不同地方對實施國家安全教育及培養學生國民身分，包括對各自的憲法、自身歷史、文化、地理等知識，均十分重視。」\n\n　　「學術自由是香港一直推崇的重要社會價值，亦是香港高等教育界賴以成功的基石。自《香港國安法》和《維護國家安全條例》實施以來，本港學者和專上院校繼續與境外和校外合作夥伴進行正常交流活動。同時，本地專上院校已採取一系列措施，將國家安全教育納入學生的學習範圍，以履行其法定責任。各院校在課程設計上享有自主，特區政府鼓勵其就國家安全教育為學生提供多元化的學習機會。」\n\n保持長期繁榮穩定\n\n　　發言人重申：「在『一國兩制』下，香港擁有『背靠祖國、聯通世界』此得天獨厚的顯著優勢，並會藉此繼續發揮其作為『超級連繫人』和『超級增值人』的雙角色。香港亦會繼續發揮其優勢以鞏固國際金融、航運和貿易中心等地位，以及更好融入和服務國家發展大局，包括參與粵港澳大灣區建設、『一帶一路』高質量發展等。在國際排名上，香港在不同經貿領域繼續名列前茅，包括已連續三年獲菲沙研究所評定為全球最自由經濟體。特區政府會繼續積極開拓經濟發展新領域及提升競爭力。事實上，美國在港享有重大的經濟利益，美國對香港的貿易順差過去10年超過2,500億美元，是其全球貿易夥伴中最高之一，目前約1 550家美國公司在港設有業務。這些數字顯示香港跟美國兩地有密切而長遠的經濟往來，而美國企業在香港擁有龐大的商業利益。香港的繁榮穩定對香港及美國均有利。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cff1cba13db","title":"​廟岩共生 鬧市瑰寶","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000652.htm","summary":"建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟。","summary_short":"建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟。","digest":"建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟","points":["建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟","古廟順應天然岩石興建，體現因地制宜的工藝和建築智慧","廟內供奉多名神祇，反映華人民間信仰兼容並蓄的特色"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T10:17:00+08:00","size":1,"keywords":[],"body":"建於一八四七年至一八五二年的灣仔洪聖古廟在二○二六年十月被列為法定古蹟。古廟順應天然岩石興建，體現因地制宜的工藝和建築智慧。廟內供奉多名神祇，反映華人民間信仰兼容並蓄的特色。\n\n　　發展局古物古蹟辦事處代表接受《政府新聞網》訪問，講解古廟依岩而建的建築特色和灣仔海岸線變遷的歷史，古廟管理機構代表則介紹廟方未來如何推廣傳統文化。\n\n　　有關報道今日（十一月二十一日）以文字和短片方式上載至www.news.gov.hk/chi/feature。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4c0c700261","title":"紅色火災危險警告","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100117.htm","summary":"電台、電視台當值宣布員注意：  　　為大眾安全起見，請播放下列警告：  　　火災危險警告  　　天文台已於今日（十一月二十一日）發出紅色火災危險警告，表示火警極易發生，市民應小心防火。","summary_short":"電台、電視台當值宣布員注意：  　　為大眾安全起見，請播放下列警告：  　　火災危險警告  　　天文台已於今日（十一月二…","digest":"電台、電視台當值宣布員注意：  　　為大眾安全起見…","points":["電台、電視台當值宣布員注意：","為大眾安全起見，請播放下列警告：","天文台已於今日（十一月二十一日）發出紅色火災危險警告，表示火警極易發生，市民應小心防火"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T06:10:25+08:00","size":1,"keywords":[],"body":"電台、電視台當值宣布員注意：\n\n　　為大眾安全起見，請播放下列警告：\n\n　　火災危險警告\n\n　　天文台已於今日（十一月二十一日）發出紅色火災危險警告，表示火警極易發生，市民應小心防火。\n\n　　市民前往郊野旅行，最好帶備乾糧或已經煮熟的食物，並應小心防止山火。在郊野非法生火的人士，可被罰款二萬五千元及入獄一年。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9881ed6adb","title":"分區賣旗日","url":"https://www.info.gov.hk/gia/general/202611/21/P2026111900199.htm","summary":"社會福利署（社署）發言人表示，三個慈善團體獲發公開籌款許可證於今日（十一月二十一日）由上午七時至下午十二時三十分，分別在港島（香港認知障礙症協會）…","summary_short":"社會福利署（社署）發言人表示，三個慈善團體獲發公開籌款許可證於今日（十一月二十一日）由上午七時至下午十二時三十分…","digest":"社會福利署發言人表示，三個慈善團體獲發公開籌款許可證於由上午七時至下午十二時三十分…","points":["社會福利署（社署）發言人表示，三個慈善團體獲發公開籌款許可證於今日（十一月二十一日）由上午七…","為了確保分區賣旗日順利進行，該署已與有關賣旗團體作出安排…","十一月二十一日舉行的分區賣旗的安排如下："],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T06:00:00+08:00","size":1,"keywords":[],"body":"社會福利署（社署）發言人表示，三個慈善團體獲發公開籌款許可證於今日（十一月二十一日）由上午七時至下午十二時三十分，分別在港島（香港認知障礙症協會）、九龍（香港導盲犬協會有限公司）及新界（保護遺棄動物協會有限公司）三區同時進行賣旗活動。\n\n　　為了確保分區賣旗日順利進行，該署已與有關賣旗團體作出安排，方便市民識別當日同時進行的三個分區賣旗活動。\n\n　　十一月二十一日舉行的分區賣旗的安排如下：\n\n 地區\n 機構名稱\n 賣旗錢袋顏色\n 旗紙顏色\n\n 港島\n 香港認知障礙症協會\n 黃色\n 藍色\n\n 九龍\n 香港導盲犬協會有限公司\n 紅色\n 粉紅色\n\n 新界\n 保護遺棄動物協會有限公司\n 橙色\n 藍色\n\n　　所有獲發許可證於公眾地方進行的慈善籌款活動詳情，包括任何更新的資料，已透過香港政府一站通網頁（www.gov.hk/tc/theme/fundraising/search）發布，而賣旗日許可證亦已上載至社署網頁（www.swd.gov.hk/tc/ngo/controlofc/flagdays），以供查閱賣旗機構的聯絡方法及已獲准舉行的賣旗日活動資料。市民如有查詢，可致電社署熱線2343 2255，或1823電話中心專線3142 2678。\n\n　　發言人補充說：「市民如對賣旗活動有所懷疑，請不要捐助，並立即通知警方。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7e1af16b15","title":"數個泳灘懸掛紅旗","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100225.htm","summary":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂及文化事務署今日（十一月二十一日）宣布，由於大浪關係，港島南區的赤柱正灘泳灘及大浪灣泳灘…","summary_short":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂及文化事務署今日（十一月二十一日）宣…","digest":"電台及電視台當值宣布員注意：  請盡快播出下列特別報告：  　　游泳人士請注意：康樂…","points":["電台及電視台當值宣布員注意：","游泳人士請注意：康樂及文化事務署今日（十一月二十一日）宣布，由於大浪關係…","西貢區的銀線灣泳灘及清水灣第二灣泳灘已懸掛紅旗，顯示在該處游泳會有危險，市民請勿在該處游泳"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T10:12:21+08:00","size":1,"keywords":[],"body":"電台及電視台當值宣布員注意：\n\n請盡快播出下列特別報告：\n\n　　游泳人士請注意：康樂及文化事務署今日（十一月二十一日）宣布，由於大浪關係，港島南區的赤柱正灘泳灘及大浪灣泳灘；西貢區的銀線灣泳灘及清水灣第二灣泳灘已懸掛紅旗，顯示在該處游泳會有危險，市民請勿在該處游泳。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"其他","total":19,"items":[{"id":"c1a5f128717","title":"五中全会精神在基层丨“放心田”背后是责任心","url":"https://www.chinanews.com.cn/ll/2026/11-21/10735676.shtml","summary":"走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间。","summary_short":"走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间。","digest":"走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间","points":["走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间","种粮大户胡昆站在田埂上，望着满眼金黄的稻谷对记者说：“今年又是好年成","南昌县是产粮大县，部分早期建成的农田已不同程度出现沟渠淤塞、设施老化等问题"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:32:54+08:00","size":1,"keywords":[],"body":"走进江西省南昌市南昌县塔城乡秋溪村，千亩高标准农田连成一片，大型收割机穿梭其间。\n\n　　种粮大户胡昆站在田埂上，望着满眼金黄的稻谷对记者说：“今年又是好年成。修整之后，机耕道路直达地头，光收割这一项，一亩地就能省下不少钱。”\n\n　　党的二十届五中全会通过的《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》明确提出，深化政绩观教育，引导干部坚持立党为公、为民造福、科学决策、真抓实干，创造经得起实践、人民、历史检验的实绩，并要求常态化整治群众身边不正之风和腐败问题。\n\n　　南昌县是产粮大县，部分早期建成的农田已不同程度出现沟渠淤塞、设施老化等问题。整治正是从这些具体问题入手。南昌县农业农村、纪检监察、财政等部门组成工作专班，紧盯工程质量、资金使用、建后管护等关键环节，深入乡村走访种粮大户、村干部和群众，查找建后管护中的堵点难点。\r\n\n　　前不久，幽兰镇给高标准农田做了“全面体检”，工作人员挨个排查179座提灌设施，更换电机、检修管道、重新铺设线路，灌溉用水顺着沟渠汩汩流淌。在幽兰镇厚田村，村民万平看着渠里淌过来的清水说：“现在水排得顺、灌得上，来年稻子能长得更好。”整治以来，南昌县修缮各类提灌设施700多座。\n\n　　高标准农田，三分靠建、七分靠管。在泾口乡东岗村，驻村第一书记雷家胜带着管护志愿队巡田，清淤泥、平田块、查设备。队员里有村干部、老党员，也有种粮大户和村民代表。泾口乡把管护责任落实到人，干部包村包片，做到田里有人巡、沟渠有人管、道路有人修。目前，这套田间管护的做法，正在南昌县全县推广。\n\n　　既抓问题整治，更要建好机制。南昌县将建后管护经费纳入年度预算，建立了530多人的建后管护队伍，并探索“大户直管+村级统管+保险补充”的综合管护模式。\n\n　　农田建得好不好、管护到不到位，老百姓最有发言权。在冈上镇晋安村，刚整修完的机耕道旁，一块高标准农田项目公示牌上清清楚楚标识着整改内容、验收标准、管护责任人员。当地村民说：“牌子立在田埂上，做得好不好，一眼就能看明白。”\n\n　　南昌县在高标准农田整治工作中大力发挥群众监督作用，推行“六步群众工作法”：台账底数向群众公开、问题整改请群众认可、修复清单由群众首报、项目建设请群众参与、建后管护受群众监督、整治成效由群众共享。同时，每个乡镇都开通高标准农田管理服务“书记热线”，群众有咨询、要报修、想反映问题，一个电话就能对接。\n\n　　当田地有人巡、沟渠有人管、群众监督能落地，高标准农田便真正成为长久好用的“放心田”。(经济日报记者 刘兴) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8d9cd0d7d0","title":"麦家：今天的中国给作家提供了取之不尽的创作活水","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-21/news1075629.shtml","summary":"11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示，今天的中国是世界经济发展的重要引擎，也是世界文明最重要的保护者和建设者。","summary_short":"11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示，今天的中国是世界经济发展的重要引擎…","digest":"11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示…","points":["11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示…","今天的中国作家既能畅通地学习和借鉴世界文学的累累硕果，同时又处在活力四射…","我个人十分有信心，以后写出更多好的作品，向世界文学致敬，向世界人民致意"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T10:47:50+08:00","size":1,"keywords":[],"body":"11月20日，第三届兰花奖颁奖典礼在北京举行，兰花奖评委、作家麦家在演讲中表示，今天的中国是世界经济发展的重要引擎，也是世界文明最重要的保护者和建设者。今天的中国作家既能畅通地学习和借鉴世界文学的累累硕果，同时又处在活力四射、国泰民安的大好时期，热火朝天，多层次、多触角的生活给中国作家提供了取之不尽的创作活水。我个人十分有信心，以后写出更多好的作品，向世界文学致敬，向世界人民致意。\n\n(孙恒业 肖欣 吴昕妮 北京报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/2DE46AE7D653495C893487431A996491.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ccb34dec837","title":"誰來守護年邁父母 闊佬懶理又多意見 手足再多都無用 最孝順注定最吃虧？ 照顧者：連喊累都無資格｜Juicy叮","url":"https://www.stheadline.com/local-topics/3639509/誰來守護年邁父母-闊佬懶理又多意見-手足再多都無用-最孝順注定最吃虧-照顧者連喊累都無資格Juicy叮","summary":"有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用，有人不是闊佬懶理就是意見多多。","summary_short":"有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用，有人不是闊佬懶理就是意見多多。","digest":"有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用…","points":["有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用，有人不是闊佬懶理就是意見多多","相反，默默付出的那一個則注定吃虧，天天陪伴張羅看病、打理日常生活卻無人體諒…","網民對這「能者過勞」情況大表同情，痛心最孝順的人往往最受委屈"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:45:31+08:00","size":1,"keywords":[],"body":"有孝順仔女在網上慨嘆，照顧年邁父母時，兄弟姊妹再多都無用，有人不是闊佬懶理就是意見多多。\n相反，默默付出的那一個則注定吃虧，天天陪伴張羅看病、打理日常生活卻無人體諒，當上照顧者的更是連喊累都無資格。網民對這「能者過勞」情況大表同情，痛心最孝順的人往往最受委屈。詳情見下圖及下文：\n誰來守護年邁父母 闊佬懶理又多意見 手足再多都無用 最孝順注定最吃虧？ 照顧者：連喊累都無資格逐張睇↓↓↓↓\n闊佬懶理卻最多意見\n樓主早前在社交平台 Threads發帖直言，有些為人子女的，「逢年過節回來吃頓飯，買點東西，就被誇得孝順又貼心」，相反，有些「天天陪著父母看病、拿藥、張羅三餐，累得連自己的生活都快顧不好，卻沒人覺得他辛苦。」\n最令樓主不甘心的是，平常不出錢、不出力的人，意見往往最多，導致「真正照顧父母的人，反而連喊累的資格都沒有！」樓主直指孝順不是嘴巴說說或偶爾回家演戲，並無奈發問：「照顧年邁父母的責任，真的應該落在最孝順的那個孩子身上嗎？」\n網民：父母眼盲偏心\n貼文引來網民共鳴，有人痛心直言「會吵會哭的才有糖吃」，會演戲、會喊窮的手足反而最受父母偏心。\n有網民道出同住照顧者的無奈，指責任「會落在同住的人身上，才不會管你孝不孝」，根本避無可避。\n有人更加稱「這是真的，但有些是父母捨不得叫他們最疼愛的孩子來照顧」，指出父母偏心大細超的現實，並嘆道「會孝順的孩子通常心比較軟也比較有責任感，能者過勞」。\n有網民因而感慨「偏偏父母也嚴重的眼盲心瞎，偏心著會演戲、會喊窮的⋯ 對於付出的人，視為理所當然。」\n有人更進一步表示：「通常最愛錫嗰個長大後係最敗家，最不理家人嗰個」，偏偏父母最偏心他，反而「照顧父母者，往往都最受氣，被父母責罵沒良心；待父母不好，偶爾回家的就最受寵。」\n網民勸照顧者：對得起自己、不留遺憾\n網民於是提醒：「做父母的，請有智慧一點，別糟蹋了守在你身邊照顧你的真兒女，只偏心寵溺回家像沾醬油的兒女！」\n有人則勸慰「願意孝順父母，是來報恩的，會有福報。」也有人直言手足雖然自私無情，但「如果連那位最容易心軟、照顧父母最多的孩子都計較起來，那吃苦的不就是父母嗎？每當我這麼想的時候心裏就會釋懷。」\n網民落力勸勉照顧者，指唯有自勉，認為「長輩與兒女之間的互動是一種緣，如果你經濟好，不要在乎兄弟分擔多少，那種付出會是意想不到的快樂。經濟問題解決了，你關心父母的程度就看你時間的多寡，那是真心的付出，沒有壓力的付出。」\n網民亦留言打氣，只要「對得起自己，以後不要有遺憾就好。」也有人分享自己的日常掙扎，指很多人勸他也可以一起擺爛，但「問題是若連我也擺爛，那媽媽該如何呢！算了，人在做天在看，做自己應該做的，抱怨也改變不了事實。」\n資料來源：miaoyuntu＠Threads\n相關閱讀：\n單身孝順女獨力照顧病重父母 已婚兄姐卸膊仲講風涼話 網民教路反擊自私鬼\n仔女全移民！師傅幫獨居長者改廁所防跌 臨走婆婆一句心底話揭移民潮最殘酷現實\n最強孝道！老父最後心願「死也不入老人院」 孝順家庭總動員「人肉Support」 港男無悔告白惹哭網民\n養兒防老防了個寂寞 無人送最後一程有幾恐怖？ 血淚個案：四個仔女得一個送終 網民教兩代相處最現實一招","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c573910978c","title":"阿Sa讀書時期Comfort Food思樂冰/炸雞髀/熱狗 拍拖最啱打邊爐｜《起筷》- 一味情深","url":"https://www.stheadline.com/food/3637404/阿Sa讀書時期Comfort-Food思樂冰炸雞髀熱狗-拍拖最啱打邊爐起筷-一味情深","summary":"大家是否仍然記得中學讀書時期最愛光顧的餐廳？","summary_short":"大家是否仍然記得中學讀書時期最愛光顧的餐廳？","digest":"大家是否仍然記得中學讀書時期最愛光顧的餐廳","points":["大家是否仍然記得中學讀書時期最愛光顧的餐廳","談及這段青春時光，藝人蔡卓妍(阿Sa)說當時喜歡很多食物，例如常常會到便利店買思樂冰…","她說，小店隱身於街角一隅，雞髀炸得十分脆，熱狗裏面的沙律醬亦相當美味，在其他地方吃不到…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T08:00:52+08:00","size":1,"keywords":[],"body":"大家是否仍然記得中學讀書時期最愛光顧的餐廳？談及這段青春時光，藝人蔡卓妍(阿Sa)說當時喜歡很多食物，例如常常會到便利店買思樂冰，但最令她念念不忘的是銅鑼灣一間小店賣的炸雞髀和熱狗。\n她說，小店隱身於街角一隅，雞髀炸得十分脆，熱狗裏面的沙律醬亦相當美味，在其他地方吃不到，是只有該店才能做出的獨有味道。因為這兩款食物的味道，小店便成為了她讀書時期的愛店之一。\n問到拍拖會選擇去什麼類型的餐廳約會，阿Sa馬上回答說，要看發展到什麼階段，如果是剛發展的階段，她會選擇去火鍋店打邊爐，「keep住有嘢做就不會怕冇嘢講而感到尷尬。若已經在一起了一段時間，雙方變得熟絡，就吃什麼都可以啦。」\n阿Sa坦言，自己經常希望市面有一間餐廳，每道菜是一口吃完，例如一羹麻婆豆腐飯又或一箸四川擔擔麵，如此就可以品嚐到好多不同類型的食物。如果這間餐廳要有一道招牌菜，阿Sa希望是一匙叉燒飯，只有一舊叉燒和一啖飯。愛吃又怕肥的女生，或許都會夢想世上有這樣一間體貼的餐廳吧。\n遊走多個國家，阿Sa記得倫敦有一間餐廳的炭燒牛扒很美味，日本的壽司店和拉麵店也給她許多滋味回憶。阿Sa形容很容易會覺得食物味道好，這與她樂觀豁達的性格，密不可分。\n阿Sa接受《起筷》訪問大談對食的要求。\n阿Sa希望有一間餐廳是每道菜都只提供一口。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cfbc738026e","title":"英超｜阿仙奴計「素」 最醒 黃金波膽值得追","url":"https://www.stheadline.com/football-betting/3639421/英超阿仙奴計素-最醒-黃金波膽值得追","summary":"阿仙奴走勢強勁而穩定，加上下星期要應付兩場大戰，體力管理事在必行。","summary_short":"阿仙奴走勢強勁而穩定，加上下星期要應付兩場大戰，體力管理事在必行。","digest":"阿仙奴走勢強勁而穩定，加上下星期要應付兩場大戰，體力管理事在必行","points":["阿仙奴走勢強勁而穩定，加上下星期要應付兩場大戰，體力管理事在必行","該隊有即將續約的門將大衛拉耶力拒來犯，勢於今晚英超作客一球力克攻力疲弱的紐卡素…","賽前排榜首的客軍阿仙奴，對上5場各賽法定時間4勝1和，此期間只在聯賽盃失利…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T08:00:04+08:00","size":1,"keywords":[],"body":"阿仙奴走勢強勁而穩定，加上下星期要應付兩場大戰，體力管理事在必行。該隊有即將續約的門將大衛拉耶力拒來犯，勢於今晚英超作客一球力克攻力疲弱的紐卡素，一於再追黃金波膽0:1。\n賽前排榜首的客軍阿仙奴，對上5場各賽法定時間4勝1和，此期間只在聯賽盃失利，而4場勝仗中有3場僅勝一球。領隊阿迪達經歷過上季的成功後，已將魚生粥煲到出神入化，無論對手強如利物浦還是升班馬候城，通通被兵工廠以1:0擊退，領先後只控不攻和尾段泊大巴等招數已臻化境，泛泛之輩實難偷雞。再者，阿仙奴前有翼鋒布於約沙卡養傷，加上大批國腳剛從國際賽回歸，下周中歐聯還要迎戰多蒙特，緊接亦要惡鬥英超三哥曼城等後顧，種種原因令槍手今仗領先後拖慢節奏機會極大。\n事實上，阿仙奴10場聯賽只失5球屬英超最少，加上3屆金手套得主門將大衛拉耶原則上已答應續約，在好消息沖喜下，再來一場清白之身易如反掌。碰巧今場對手紐卡素無論預期入球值11.5、場均3.4次中目標攻門及創造19次黃金機會，通通排英超廿隊倒數第4或更低，創造力嚴重不足，破蛋無望。預料客隊一球領先後有力保持到完場，波膽0:1合情合理，6.6倍相當抵玩。加利李爾\n紐卡素 VS 阿仙奴\nNow 621、611周日凌晨1:30直播\n推介：波膽0:1","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ccba0c22368","title":"最新《起筷》特刊出爐！《黑白大廚》4大黑湯匙主廚襲港 阿Sa大談「火鍋約會防尷尬秘笈」 全港「宵夜地圖」大搜查","url":"https://www.stheadline.com/food/3638969/最新起筷特刊出爐黑白大廚4大黑湯匙主廚襲港-阿Sa大談火鍋約會防尷尬秘笈-全港宵夜地圖大搜查","summary":"週末又到，又是時候犒賞自己！","summary_short":"週末又到，又是時候犒賞自己！","digest":"週末又到，又是時候犒賞自己","points":["週末又到，又是時候犒賞自己","最新一期《頭條日報》人氣周六特刊《起筷》現已隆重登場，網上「足本揭頁版」同步上線","今期內容豐富得令人垂涎三尺，不單有紅星獨家專訪，更為大家搜羅了全港最矚目的日韓盛宴與深夜美食"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T07:00:48+08:00","size":1,"keywords":[],"body":"週末又到，又是時候犒賞自己！最新一期《頭條日報》人氣周六特刊《起筷》現已隆重登場，網上「足本揭頁版」同步上線！今期內容豐富得令人垂涎三尺，不單有紅星獨家專訪，更為大家搜羅了全港最矚目的日韓盛宴與深夜美食。快點按此閱讀「足本揭頁版」，解鎖最精彩的週末飲食玩樂指南！\n越夜越繽紛 精選「AFTER 9 宵夜地圖」\n最新一期《頭條日報》周六特刊《起筷》「足本揭頁版」已經上線！\n勞碌一整天，宵夜是最好的犒賞。配合旅發局「香港美食月」，今期特刊特別為大家搜羅了多個深夜飲食好去處：\n 九龍香格里拉大堂酒廊：由30年經驗的邱杰飈行政總廚坐鎮，推出「糖水及宵夜」系列，帶來豆香濃郁的「木桶豆腐花」及創意「拔絲咖喱長洲魚蛋」。\n\n 中環「Mind念」：由兩位港澳區調酒冠軍主理，推出極具廣東風味的創意雞尾酒，如帶有煲仔飯鑊氣的「Claypot Sour」及童年回憶「Mighty Malty」。\n\n 鵝頸橋四季火鍋：懷舊大笪地風格，配上慢熬10小時的招牌金湯花膠雞鍋，暖胃又暖心。\n\n這份宵夜地圖還隱藏了哪些寶藏酒吧與地道美食？快點擊足本版獲取完整清單！\n阿Sa獨家專訪 揭秘「拍拖初期的火鍋約會學」\n今期「一味情深」請來人氣女星蔡卓妍（阿Sa）接受專訪，大談她的飲食哲學與童年回憶。阿Sa除了分享她對銅鑼灣小店炸雞髀與熱狗的念念不忘外，更鬼馬地透露自己拍拖初期的約會秘訣——原來「打邊爐」是她極力推介的防尷尬妙法？想知原因以及阿Sa對美食的極致要求，立刻翻開足本揭頁版！\n韓風襲港！《黑白大廚》4大黑湯匙主廚親民聯乘\nNetflix大熱綜藝《黑白大廚：料理階級大戰》掀起熱潮，今期特刊為大家帶來重磅消息！「撕漫男」曹光孝、「建築工地大廚」鄭宇英、「歸來的少年」蔡落英及「鳥燒王」金秉默4位人氣黑湯匙主廚首度襲港！本地日韓餐廳 Han Dining 聯同 YEBISU 推出全新「THE TABLE」十二手聯乘企劃，以超親民價 $518 即可享用 14 道菜的日韓家庭式盛宴。惹味麻辣炸雞翼、韓式白切肉配包心菜等焦點菜式究竟味道如何？記者已率先為大家試食，精彩食評不容錯過！\n除了美食，今期還有常見蘋果挑選與6大食用宜忌，以及無印良品（MUJI）25周年生活實用收納與旅遊好物推薦。隨著「香港繽紛冬日巡禮」即將登場，特刊更率先為大家規劃了橫跨尖沙咀、銅鑼灣及中 \n1. 厚重窗簾與雙層玻璃（阻風聚氣）\n針對「風吹頭煞」，窗戶宜加裝質感厚重的雙層隔音遮光窗簾，強風天氣避免大開窗戶，改用微氣流循環系統。讓室內氣場從「急促流散」轉為「沉穩聚氣」，從心理上提供足夠的安全感與放鬆感。\n針對「風吹頭煞」，窗戶宜加裝質感厚重的雙層隔音遮光窗簾，強風天氣避免大開窗戶，改用微氣流循環系統。\n2. 暖陽火土陣法（補陽鎮陰）\n在窗台面對山林陰氣的位置，擺放一對質感厚重的陶瓷大象或天然黃水晶球，五行屬土，取重土鎮石之意，並在客廳常開暖黃色系光源（火）。以「火土相生」的能量抵禦窗外的孤陰氣場，為室內補充溫暖的正陽氣場。\n3. 增加室內煙火氣（激活生活熱情）\n客廳與睡房可增添暖色系軟裝，如暖色地毯、橙黃色抱枕。\n避免空間過於極簡或採用冷色調，如大面積的灰色、白色。客廳與睡房可增添暖色系軟裝，如暖色地毯、橙黃色抱枕，並多在家中煮食、邀請三五知己聚會聊天，利用「人間煙火氣」驅散獨居的清冷之氣。\n4. 客廳擺放對飾（雙雙對對）\n將家中單獨的裝飾品，如單人雕像、單幅掛畫，更換為成雙成對的擺設，如一對對飾、雙人油畫，在潛意識中不斷給予自己「渴望伴侶、走向雙人生活」的正向心理暗示。\n結局與後記\nHelen回家後迅速落實改動：她換上了質感厚重的暖色窗簾，在窗台擺放黃水晶與暖光燈，並重新調整客廳的色彩，開始頻繁邀請朋友到家中聚餐。\n改動後數月，Helen感覺家中不再像以往般冷清逼人，心情亦變得溫柔放鬆，不再強烈抗拒社交活動。半年後，在一次朋友的家宴上，Helen結識了一位成熟穩重、同樣注重生活品質的建築師。兩人相談甚歡，彼此敞開心扉，如今已建立起一段真誠而穩定的伴侶關係。\n結語\n風水從來不是神仙法術，亦不是天降真愛的靈丹妙藥。它是一門研究「環境、心理與命運」相互作用的古代智慧。無論是鏡影照面的虛浮、床頭壓樑的怯懦、黑廁壓吉的污染，還是孤高獨聳的冷傲，風水改善的核心，永遠是透過修繕居住空間，重塑一個健康、平靜、富有安全感與吸引力的自我。\n當你的居所充滿陽光與穩定的氣場，你的內心自然堅定明亮，而真正值得的愛情，亦自會在這種健康的和諧中悄然降臨。\n脫單風水學（四）\n金耀\n金瑤閣堪輿學家\n相關文章：公關男社交廣闊卻總遇假桃花？單位藏兩大感情風水煞氣 4招微調重迎正緣｜金耀\n相關文章：IT男拍拖5年談婚總退縮 橫樑壓床頭恐礙姻緣 4招調整家居布局｜金耀\n相關文章：金融分析師情路屢受挫 單位開門見鏡易招爛桃花 4招調整家居布局化解｜金耀\n相關文章：海景單位玻璃幕強光入屋 慎防「反光煞」 揀樓宜分時段察看｜金耀\n相關文章：睇樓勿只看間隔 廚窗正對防火巷藏隱憂 拆解「陰巷煞」與化解法｜金耀\n相關文章：買樓切忌只顧屋內裝修 大廈樓梯陰暗無光犯「陰濕煞」4大自保法｜金耀\n相關文章：準新人睇中頂層連天台戶 生鏽鐵皮屋揭氣場危機 4招助化解「壓頂煞」｜金耀\n相關文章：家居風水局出事連累「子女宮」 騰蛇煞惹官非血光之災 化解屋主十萬破財危機｜金耀\n相關文章：神台擺位失宜 牽動一家四口家宅安寧 3個不傷傳統調整法｜金耀\n相關文章：財位橫樑壓頂難聚財？初創老闆陷利潤樽頸 3步微調辦公室格局｜金耀\n相關文章：主人房正對樓縫犯「天斬煞」健康運勢齊響警號 3招調整減緩衝擊｜金耀\n相關文章：開門見電梯 財氣易流走 3招化解家居直沖格局聚氣守財｜金耀\n相關文章：四口之家缺西北角 丈夫病弱缺乏魄力 拆解「缺角屋」4大化解法｜金耀\n相關文章︰裝修追求色調「高級感」反致病破財 光線失衡拖垮家運 5個改動化解困局｜金耀\n相關文章︰「開門見灶」悄悄偷走健康與財運 拆解廚房禁忌 3招低成本化解 ︳金耀\n相關文章︰家中雜物封旺盛吉位 事業受阻爛桃花纏身 四管齊下調整運勢 ︳金耀\n相關文章︰單位種300盆多肉植物 險毀婚姻兼破財 3招化解「木囚死局」 ︳金耀\n相關文章︰風水改名不及改電話號碼 成現代人最有效改運方法｜金耀\n相關文章︰馬來西亞情降之禍 商家生意感情齊轉壞 風水佈局助化解｜金耀\n相關文章︰打工仔遭小人暗算阻升職 揭座位環境惹是非 3步調整可化解｜金耀\n相關文章︰餐廳老闆辛苦8年財來財去 受累「財入污池」格局 三步化煞可改善｜金耀\n相關文章︰單身女花數萬元購粉晶擺設 位置放錯 桃花催旺變催煞 「旺的全是爛桃花」 ︳金耀\n相關文章︰新婚夫婦搬新屋「開門見廁」 感情健康急轉差 3招可阻穢氣直沖｜金耀\n相關文章：床頭特意靠窗反致夜夜驚醒「靠山落空」格局影響運勢 3招簡單化解｜金耀\n相關文章：現代公寓常見「穿堂煞」 導致家人失眠兼多病 可從兩位置入手\n相關文章：辦公室「無靠山」再遇光煞 易生是非惹小人 做好三件事即化解｜金耀\n相關文章：家藏雜物阻聚氣 屋主壓力變大 全屋檢查清理 「免財位受累
