<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

俄罗斯三国领导人日前在中国深圳举行首次三方会晤，这是“一场具有重大历史意义的国际峰会”。\n\n　　在结束中国之行后，特朗普美东时间19日晚返抵华盛顿。20日下午，他在副总统万斯和国务卿鲁比奥的陪同下，在白宫举行新闻发布会。\n\n　　在谈到中俄美元首会晤时，特朗普说，“这次峰会规模很大，意义重大，气氛也非常好，令人难以置信。我们三人之间的关系非常融洽。”\n\n　　特朗普说，这场具有历史意义的峰会达成的成果，“是一份史无前例的三方和平宣言”。美国、俄罗斯和中国正式达成共识，绝不能让核冲突发生。\r\n\n　　中俄美三国元首19日在深圳举行会晤，围绕维护世界和平、促进大国关系战略稳定主题进行深入讨论。会后，三方发表《中俄美元首和平宣言》。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"特朗普：中俄美元首会晤具有重大历史意义","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735613.shtml","source_display":"中新網 環球","published_at":"2026-11-21T10:04:27+08:00","category":"國際","digest":"美国总统特朗普20日在白宫表示，美国…"},{"title":"特朗普：中俄美元首会晤“史无前例”“意义重大”","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735606.shtml","source_display":"中國新聞網","published_at":"2026-11-21T06:06:28+08:00","category":"國際","digest":"美国总统特朗普20日在白宫举行的新闻发布会上表示…"}],"cross":{"total":2,"angles":[{"point":"美国总统特朗普20日在白宫表示，美国…","sources":["中新網 環球"],"url":"https://www.chinanews.com.cn/gj/2026/11-21/10735613.shtml"},{"point":"美国总统特朗普20日在白宫举行的新闻发布会上表示…","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gj/2026/11-21/10735606.shtml"}]}},{"id":"c4e69ed5d3b","title":"深圳APEC‧分析｜「深圳國際體系」初啟 如何落實尚待觀察","url":"https://www.stheadline.com/realtime-china/3639512/深圳APEC分析深圳國際體系初啟-如何落實尚待觀察","summary":"中美俄三國元首在深圳APEC期間會晤，並發表4點《和平宣言》。","summary_short":"中美俄三國元首在深圳APEC期間會晤，並發表4點《和平宣言》。","digest":"中美俄三國元首在深圳APEC期間會晤，並發表4點《和平宣言》","points":["中美俄三國元首在深圳APEC期間會晤，並發表4點《和平宣言》","中國人民大學重陽金融研究院院長王文對《星島》分析，此次會晤最核心的意義…","王文稱，三個安理會常任理事國元首坐在一起，本身就是向全球釋放強烈信號：大國之間不是只有選邊…"],"section":"內地","category":"內地","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T08:32:00+08:00","size":2,"keywords":[],"body":"中美俄三國元首在深圳APEC期間會晤，並發表4點《和平宣言》。中國人民大學重陽金融研究院院長王文對《星島》分析，此次會晤最核心的意義，是在陣營對抗風險上升、全球衝突多發的當下，走出一條大國「管控分歧、和平共存」的新嘗試。\n王文稱，三個安理會常任理事國元首坐在一起，本身就是向全球釋放強烈信號：大國之間不是只有選邊、對抗這一條路。此次會晤不是要打造所謂G3小集團，更不是復刻雅爾塔式勢力範圍劃分，而是「深圳國際體系」思路的實踐——以自願約束、危機溝通為基礎，給動盪的世界注入確定性。它是一種正在演變的大國互動模式，目前正在實踐和發展中，其基礎是多極世界已經到來的客觀現實。\n相關新聞：深圳APEC︱特朗普晤習近平首稱不支持「台獨」 學者：外交磋商成果 料仍有起伏︱拆局\n獨立政治學者陳道銀對《星島》指出，縱觀當今全球博弈格局，中美處於長期的結構性戰略競爭之中；美俄之間存在嚴峻的安全與地緣政治衝突；中俄雖保持戰略協作，但兩國有各自獨立的國家利益與外交戰略。但三國依然簽署了同一份聲明。這揭示了大國協調並不要求接受對方的全部國際戰略，只要求各方承認某些共同底線。\n中國社科院政治學研究所研究員房寧對《星島》稱，當前美俄都面臨各自的現實難題，《宣言》主要體現原則層面的共識，後續如何落實是關鍵，未來各方將如何回應，仍有待觀察。 \n駐京記者 楊浚源","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC‧分析｜「深圳國際體系」初啟 如何落實尚待觀察","url":"https://www.stheadline.com/realtime-china/3639512/深圳APEC分析深圳國際體系初啟-如何落實尚待觀察","source_display":"星島頭條","published_at":"2026-11-21T08:32:00+08:00","category":"內地","digest":"中美俄三國元首在深圳APEC期間會晤，並發表4點《和平宣言》"},{"title":"深圳APEC｜歡迎晚宴唱中文版《YMCA》 習近平特朗普同桌欣賞｜有片","url":"https://www.stheadline.com/realtime-china/3639505/深圳APEC歡迎晚宴唱中文版YMCA習近平特朗普同桌欣賞有片","source_display":"星島頭條","published_at":"2026-11-21T06:29:31+08:00","category":"內地","digest":"深圳亞太經合組織峰會歡迎晚宴出現別具心思的表演"}],"cross":{"total":2,"angles":[{"point":"深圳亞太經合組織峰會歡迎晚宴出現別具心思的表演","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-china/3639505/深圳APEC歡迎晚宴唱中文版YMCA習近平特朗普同桌欣賞有片"},{"point":"中美俄三國元首在深圳APEC期間會晤，並發表4點《和平宣言》","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-china/3639512/深圳APEC分析深圳國際體系初啟-如何落實尚待觀察"}]}},{"id":"cefed56d6d0","title":"打擊圍標︱丘應樺：《競爭條例》修訂草案爭取今屆政府任期內通過","url":"https://www.stheadline.com/society/3639538/打擊圍標丘應樺競爭條例修訂草案爭取今屆政府任期內通過","summary":"針對樓宇維修「圍標」問題，特區政府正全速推進法例修訂。","summary_short":"針對樓宇維修「圍標」問題，特區政府正全速推進法例修訂。","digest":"針對樓宇維修「圍標」問題，特區政府正全速推進法例修訂","points":["針對樓宇維修「圍標」問題，特區政府正全速推進法例修訂","商務及經濟發展局局長丘應樺透露，港府與律政司正緊鑼密鼓進行詳細的條例修改工作…","丘應樺今早（21日）在電台節目表示，修訂核心是將樓宇維修的圍標行為刑事化…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T10:55:12+08:00","size":1,"keywords":[],"body":"針對樓宇維修「圍標」問題，特區政府正全速推進法例修訂。商務及經濟發展局局長丘應樺透露，港府與律政司正緊鑼密鼓進行詳細的條例修改工作，計劃於今年內諮詢業界，並於明年四月將《競爭條例》修訂草案提交立法會審議，全力爭取在今屆政府任期內通過並落實。\n丘應樺今早（21日）在電台節目表示，修訂核心是將樓宇維修的圍標行為刑事化，並加入《有組織及嚴重罪行條例》及《廉政公署條例》共同搜證，以收最大阻嚇力。\n對於市場擔憂刑事檢控的搜證及舉證門檻極高，丘應樺指出，新修訂將允許執法部門從多個角度搜證，能大幅提升檢舉成功率。他強調，透過刑事與民事雙軌並行，圍標集團將面臨極高昂的違法代價，包括基本罰款額由1,000萬港元起，最高可判處違法期間利潤的三倍，或整體營運額的50%，並有監禁刑罰。若因搜證困難未能進行刑事起訴，政府仍可退而求其次進行民事起訴。民事罰則亦同步加強，最高罰款達800萬港元、沒收違法商業得益的兩倍，或違法期間最多3個年度的本地營業額的30%，以3年為限，並延長取消董事資格的期限，關聯公司亦會被連帶檢控。\n不傾向將「吹哨者」寬待機制普及化\n針對社會關注跨部門「聯合特遣隊」在立法後會否出現人手與資源不足，丘應樺回應指，作為政府機構必須量入為出，暫時會先以現有資源應付，待實際運作體現出真實需求後，才會適當申請增撥公帑。\n至於會否將目前競爭事務委員會針對「吹哨者」（舉報人）的寬待機制（豁免或減免刑罰）普及化至刑事檢控中，丘應樺認為，檢舉並非一定要靠吹哨者，現行刑事法例中警方會就不同情況，對個別個案會有酌情權。由於涉及刑事起訴，港府在修例時會再詳細考慮，並諮詢律政司及業界意見，目前不傾向將其全部普及化。\n政府正從多方面建立防線\n民政及青年事務局在諮詢後決定暫不推行「授權票上限」改革，外界憂慮可能讓圍標集團繼續透過控制授權票影響採購。丘應樺對此表示並不擔心。他指出，政府正從多方面建立防線， 特遣隊及民政事務總署有權以「風險為本」 ，主動派員直接列席業主立案法團會議、法例修訂後，監管範圍將直接針對顧問公司的聘用，若涉不法行為即屬刑事，還有白名單機制，支援局會為法團揀選顧問公司提供充足資訊，相信並無大空間可予他們做出違法行為。\n相關新聞：\n打擊圍標︱測量師學會：新成立樓宇維修支援及服務局有利正規承建商 可為已展開工程項目「驗身」\n宏福苑︱政府料明年4月通過樓宇維修圍標刑事化 鄧家彪倡設「篤灰獎勵金」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd99bf2a5c6","title":"李强同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735603.shtml","summary":"11月20日晚，国务院总理李强在北京钓鱼台国宾馆同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会。","summary_short":"11月20日晚，国务院总理李强在北京钓鱼台国宾馆同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会。","digest":"李强同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会","points":["近30位中澳商会和企业负责人出席","在听取两国工商界代表发言后，李强表示，过去一年，中澳关系与合作在两国领导人战略引领下…","这些成绩是在国际贸易遭受严重冲击、世界经济增长乏力的背景下取得的，来之不易…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-20T23:53:18+08:00","size":3,"keywords":[],"body":"11月20日晚，国务院总理李强在北京钓鱼台国宾馆同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会。新华社记者 黄敬文 摄\n\n　　新华社北京11月20日电(记者伍岳)11月20日晚，国务院总理李强在北京钓鱼台国宾馆同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会。近30位中澳商会和企业负责人出席。\n\n　　在听取两国工商界代表发言后，李强表示，过去一年，中澳关系与合作在两国领导人战略引领下，取得不少新进展。这些成绩是在国际贸易遭受严重冲击、世界经济增长乏力的背景下取得的，来之不易，充分彰显了两国合作的强大内生动力。实践反复表明，中澳经济优势互补、共同利益广泛，两国既是天然合作伙伴，也是彼此发展机遇。当前，全球发展仍然面临诸多不确定性。越是这样的时候，越需要稳定可靠的伙伴。中澳应当进一步拉紧经贸关系，实现更广泛领域、更高水平的互利共赢。\n\n　　李强指出，双方可以聚焦三个方面持续深化中澳合作。一是围绕提高生活品质的消费升级。在巩固扩大农食等传统贸易的同时，深挖旅游、教育、健康养老、生物医药、高端医疗等领域合作潜力，围绕人的全生命周期需要，开发更多高品质产品和服务，更好惠及两国民众。二是以数智技术为代表的创新合作。把各自创新优势更好结合起来，加强相互赋能，在新技术的场景化、产业化方面深入合作，推动科研成果加速转化为两国企业的新产品、新订单，更好分享创新收益。三是体现可持续发展的绿色低碳转型。合作开发具有竞争力的绿色产品，携手构建绿色钢铁供应链、新能源汽车产供链等，协力开拓第三方市场，在全球绿色价值链上共同攀升。\n\n　　李强强调，中国政府愿同澳大利亚政府一道努力，把握两国关系发展正确方向，坚持合作共赢主流，排除对正常经贸的干扰，为两国企业合作提供良好环境和稳定预期。中国开放的大门只会越开越大，欢迎更多澳企深耕中国市场。希望两国工商界继续做互利合作的开拓者、两国友好的促进者，推动中澳经贸合作不断取得新成果。\n\n　　阿尔巴尼斯在致辞中表示，中国是澳方最大的贸易伙伴，澳中经贸合作有利于两国经济发展，给两国人民带来实实在在的利益。明年是澳中建交55周年，也是“澳中旅游年”，澳方愿以此为契机，同中方加强在人工智能、绿色转型、现代农业等领域互利合作，深化人文交流。期待两国商界相互学习，相互借鉴，拓展合作，为澳中关系发展作出更大贡献。\n\n　　吴政隆出席圆桌会。\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"李强同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735603.shtml","source_display":"中國新聞網","published_at":"2026-11-20T23:53:18+08:00","category":"內地","digest":"李强同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会"},{"title":"李强同澳大利亚总理阿尔巴尼斯举行第十一轮中澳总理年度会晤","url":"https://www.chinanews.com.cnhttps://www.chinanews.com.cn/tp/hd2011/2026/11-20/1211324.shtml","source_display":"中國新聞網","published_at":"2026-11-20T22:33:36+08:00","category":"","digest":"李强同澳大利亚总理阿尔巴尼斯举行第十一轮中澳总理年度会晤"},{"title":"李强同澳大利亚总理阿尔巴尼斯举行第十一轮中澳总理年度会晤","url":"https://www.chinanews.com.cn/gn/2026/11-20/10735483.shtml","source_display":"中新網 時政","published_at":"2026-11-20T21:12:33+08:00","category":"內地","digest":"11月20日下午…"}],"cross":{"total":3,"angles":[{"point":"11月20日下午…","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-20/10735483.shtml"},{"point":"李强同澳大利亚总理阿尔巴尼斯举行第十一轮中澳总理年度会晤","sources":["中國新聞網"],"url":"https://www.chinanews.com.cnhttps://www.chinanews.com.cn/tp/hd2011/2026/11-20/1211324.shtml"},{"point":"李强同澳大利亚总理阿尔巴尼斯共同出席第九届中澳工商界首席执行官圆桌会","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-20/10735603.shtml"}]}},{"id":"ce5b7e06d28","title":"2026年“数据要素×”大赛新疆分赛正式闭幕","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735671.shtml","summary":"中新网新疆昌吉11月21日电 (袁鹏冲)2026年“数据要素×”大赛新疆分赛闭幕式20日在新疆昌吉市举办，本届赛事作为“数据要素×”三年行动收官重要实践，以赛聚智、以赛促用…","summary_short":"中新网新疆昌吉11月21日电 (袁鹏冲)2026年“数据要素×”大赛新疆分赛闭幕式20日在新疆昌吉市举办…","digest":"2026年“数据要素×”大赛新疆分赛闭幕式20日在新疆昌吉市举办…","points":["中新网新疆昌吉11月21日电 (袁鹏冲)2026年“数据要素×”大赛新疆分赛闭幕式20日在新…","本届大赛围绕“数据赋能乘数而上”主题，设置17条赛道，吸引全疆各地州市766个项目踊跃报名…","经多轮评审遴选，194个项目分获各等级奖项，34个项目突围跻身全国总决赛…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:28:48+08:00","size":1,"keywords":[],"body":"中新网新疆昌吉11月21日电 (袁鹏冲)2026年“数据要素×”大赛新疆分赛闭幕式20日在新疆昌吉市举办，本届赛事作为“数据要素×”三年行动收官重要实践，以赛聚智、以赛促用，一批扎根新疆产业民生的数据创新成果集中揭晓。\n\n图为活动现场。袁鹏冲 摄\n\n　　本届大赛围绕“数据赋能乘数而上”主题，设置17条赛道，吸引全疆各地州市766个项目踊跃报名，覆盖工业制造、现代农业、文旅文博、医疗医保、能源交通等多元领域。经多轮评审遴选，194个项目分获各等级奖项，34个项目突围跻身全国总决赛，斩获全国二等奖1项、三等奖4项，不少方案把行业痛点转化为数字应用的创新亮点。\n\n　　闭幕式上，赛事成果分析报告正式发布，现场同步开展主题分享、优秀项目展演，对一、二、三等奖、优秀解决方案及优秀组织单位予以表彰。\n\n　　记者了解到，本次比赛相关参赛成果立足新疆地域实际，从智慧矿山、数字农田到文物AI活化、医保数智监管，数据要素正在田间、车间、公共治理场景落地生根，把赛场创意转化为现实生产力。\n\n　　近年来新疆持续擦亮“天山论数”赛事品牌，构建起“赛场选才、成果储备、供需对接”的完整链条。\n\n　　据新疆维吾尔自治区数字化发展局相关负责人介绍，新疆将持续完善项目储备库，搭建成果转化对接渠道，培育数据要素流通生态，吸引更多数字人才与产业资源入疆兴业，让数据“乘数效应”持续赋能丝绸之路经济带核心区高质量发展。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c1db9d8da2a","title":"沙特称拦截3枚胡塞武装导弹 也门媒体称沙特袭击致41死","url":"https://www.chinanews.com.cn/gj/2026/11-21/10735663.shtml","summary":"中新社北京11月21日电 据沙特《利雅得报》当地时间21日凌晨报道，沙特阿拉伯主导的多国联军称摧毁了也门胡塞武装向沙特首都利雅得发射的三枚弹道导弹。","summary_short":"中新社北京11月21日电 据沙特《利雅得报》当地时间21日凌晨报道…","digest":"据沙特《利雅得报》当地时间21日凌晨报道…","points":["中新社北京11月21日电 据沙特《利雅得报》当地时间21日凌晨报道…","拦截导弹前，沙特民防总局对利雅得发布紧急警报，随后解除","这是该部门连续第三晚对利雅得发布紧急警报"],"section":"國際","category":"國際","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:33:02+08:00","size":1,"keywords":[],"body":"中新社北京11月21日电 据沙特《利雅得报》当地时间21日凌晨报道，沙特阿拉伯主导的多国联军称摧毁了也门胡塞武装向沙特首都利雅得发射的三枚弹道导弹。\n\n　　拦截导弹前，沙特民防总局对利雅得发布紧急警报，随后解除。这是该部门连续第三晚对利雅得发布紧急警报。\n\n　　胡塞武装军事发言人叶海亚·萨雷亚20日晚在社交媒体发文说，沙特过去24小时内发动了78次袭击，目标涉及也门首都萨那以及荷台达、塔伊兹、拉赫季、萨达和马里卜等地，造成多人死亡。\n\n　　据也门胡塞武装控制的马西拉电视台20日傍晚报道，当地卫生部门发表声明说，过去24小时内，沙特在也门的军事行动共造成41人死亡，其中包括11名儿童和7名妇女，另有28人受伤。\r\n\n　　声明还指出，自冲突升级以来，也门累计死亡人数达438人，另有924人受伤。(完) 【编辑:魏晨曦】","image":"","video":"","video_poster":"","lang":"zh-Hans"}],"sections":[{"name":"港聞","total":25,"items":[{"id":"ccd6a6a8b44","title":"荃灣有住宅疑因暖爐起火 男子吸入濃煙不適送院","u ry":"荃灣韻濤居發生火警。","summary_short":"荃灣韻濤居發生火警。","digest":"荃灣韻濤居發生火警","points":["清晨5時15分，青山公路荃灣段621至623號韻濤居一個住宅單位起火…","消防員接報到場，出動一喉一煙帽隊，約28分鐘將火救熄","火警中約80人疏散，單位內一名40歲男子因吸入濃煙不適，由救護車送仁濟醫院治理"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T06:59:20+08:00","size":1,"keywords":[],"body":"荃灣韻濤居發生火警。清晨5時15分，青山公路荃灣段621至623號韻濤居一個住宅單位起火，有樓上住戶發現鄰近單位有火，報警求助。\n消防員接報到場，出動一喉一煙帽隊，約28分鐘將火救熄。火警中約80人疏散，單位內一名40歲男子因吸入濃煙不適，由救護車送仁濟醫院治理。火警中一隻貓咪證實不治。\n據了解，起火原因疑與暖爐焫着被鋪或床褥有關，確實起火原因仍待調查。現場可見，多名居民疏散至屋苑空地等候，消防員及警員在場處理。\n㺺場所見，由於時值清晨，居民大多在睡夢中驚醒逃生，不少人仍穿着睡衣褲，僅披上一件厚上衣便趕落平台等候。一名男住客帶同寵物貓走火時，懷疑貓咪受驚，抓傷他的手指，在救護車上包紮傷口後，拒絕送院。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c57c6b2efd2","title":"元朗警署對開斑馬線電單車未讓路直衝 女途人急停避過 網民轟危駕","url":"https://www.stheadline.com/breaking-news/3639497/元朗警署對開斑馬線電單車未讓路直衝-女途人急停避過-網民轟危駕","summary":"網上流傳一段車Cam片段，顯示前日（19日）下午1時許，一輛電單車駛經元朗警署對開斑馬線時，無視正橫過馬路的女途人直接衝過，幸女途人及時停步未有釀成意外。","summary_short":"網上流傳一段車Cam片段，顯示前日（19日）下午1時許，一輛電單車駛經元朗警署對開斑馬線時…","digest":"網上流傳一段車Cam片段，顯示前日下午1時許，一輛電單車駛經元朗警署對開斑馬線時…","points":["網上流傳一段車Cam片段，顯示前日（19日）下午1時許，一輛電單車駛經元朗警署對開斑馬線時…","片段曝光後惹來網民一面倒炮轟鐵騎士行為危險","事發於前日下午1時許，涉事Cam車沿元朗體育路行駛，途經元朗警署後按燈號轉入教育路"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T02:34:33+08:00","size":1,"keywords":[],"body":"網上流傳一段車Cam片段，顯示前日（19日）下午1時許，一輛電單車駛經元朗警署對開斑馬線時，無視正橫過馬路的女途人直接衝過，幸女途人及時停步未有釀成意外。片段曝光後惹來網民一面倒炮轟鐵騎士行為危險。\n網民斥「警署在旁都敢衝」 \n社交平台Facebook群組「車cam L（香港群組）」流傳一段長約42秒的車Cam影片。事發於前日下午1時許，涉事Cam車沿元朗體育路行駛，途經元朗警署後按燈號轉入教育路。當駛至元朗警署及元朗警察已婚宿舍對開斑馬線前，Cam主見一名女途人正橫過馬路，隨即停車禮讓。\n當駛至元朗警署及元朗警察已婚宿舍對開斑馬線前，Cam主見一名女途人正橫過馬路，隨即停車禮讓。fb@車cam L（香港群組）（下同）\n其後一輛電單車駛至。\n電單車無視交通規則及行人，直接從女途人前方高速穿過斑馬線。\n惟女途人行至馬路中央時突然停步，未幾即有一輛電單車無視交通規則及行人，直接從女途人前方高速穿過斑馬線，幸事件中無人受傷。女途人定神後繼續前行，對面兩名中學生橫過馬路時，亦特地向停車讓路的Cam主揮手致謝。\n大批網民留言批評涉事鐵騎士罔顧安全，直言「危駕，做佢」、「見Cam主停車就知有人過緊馬路啦，咁都衝，害人害物」，亦有人諷刺「警署喺附近，都夠膽衝」。\n根據香港法例第374G章《道路交通（交通管制）規例》第31條，當行人已踏上斑馬線，司機必須在車輛駛至斑馬線前讓行人先行。此外，按第240章《定額罰款（刑事訴訟）條例》，「沒有讓斑馬線上的行人先行」屬定額罰款罪行，自2026年1月1日起相關罰款已調高五成至675元。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c42d5388f4f","title":"港鐵尖沙咀站驚現鼠蹤 小老鼠扶手電梯旁現身 網民：米奇無處不在","url":"https://www.stheadline.com/breaking-news/3639496/港鐵尖沙咀站驚現鼠蹤-小老鼠扶手電梯旁現身-網民米奇無處不在","summary":"本港近日多處發現鼠蹤，昨日（20日）有網民在社交平台發文，指在港鐵尖沙咀站內的行人扶手電梯附近發現老鼠出沒，引來不少網民熱議。","summary_short":"本港近日多處發現鼠蹤，昨日（20日）有網民在社交平台發文，指在港鐵尖沙咀站內的行人扶手電梯附近發現老鼠出沒…","digest":"本港近日多處發現鼠蹤，有網民在社交平台發文…","points":["本港近日多處發現鼠蹤，昨日（20日）有網民在社交平台發文…","扶手電梯金屬板旁現身 身形細小疑從罅隙爬出","有目擊者昨日在Facebook群組「香港突發事故報料區及討論區」發文…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T02:16:23+08:00","size":1,"keywords":[],"body":"本港近日多處發現鼠蹤，昨日（20日）有網民在社交平台發文，指在港鐵尖沙咀站內的行人扶手電梯附近發現老鼠出沒，引來不少網民熱議。\n扶手電梯金屬板旁現身 身形細小疑從罅隙爬出\n有目擊者昨日在Facebook群組「香港突發事故報料區及討論區」發文，表示「尖沙咀地鐵站內行人扶手電梯有米奇」，並上載兩張現場照片。\n港鐵尖沙咀站內的行人扶手電梯附近發現老鼠出沒，引來不少網民熱議。FB@香港突發事故報料區及討論區（下同）\n該隻老鼠背部披有深色毛髮、耳朵圓小、尾巴幼長，疑似從附近罅隙爬出。\n從照片可見，事發地點為港鐵尖沙咀站內，在鋪有黑色及米白色間條圖案的地磚、毗鄰帶有黃色警示標記的銀灰色金屬坑紋板位置，出現一隻身形細小的老鼠。該隻老鼠背部披有深色毛髮、耳朵圓小、尾巴幼長，疑似從附近罅隙爬出。\n網民熱議衛生情況 紛指「成街周圍都係」\n帖文隨即引起大批網民留言關注本港鼠患情況，不少人感嘆「米奇無處不在」，亦有人直言「成街周圍都係老鼠」、「好多老鼠，失控」，甚至戲稱「香港係米奇之都」。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c317662ddd0","title":"有片｜西九龍公路現大坑洞陷阱 電單車輾過倒地 鐵騎士受傷送院","url":"https://www.stheadline.com/breaking-news/3639494/有片西九龍公路現大坑洞陷阱電單車輾過倒地-鐵騎士受傷送院","summary":"西九龍公路發生交通意外。","summary_short":"西九龍公路發生交通意外。","digest":"西九龍公路發生交通意外","points":["昨日（20日）下午1時許，一名54歲姓李男子駕駛電單車沿西九龍公路南行…","途經的私家車司機目擊意外後代為報警","救護員接報趕抵現場，發現男傷者全身多處受傷，幸仍保持清醒，隨即由救護車送往瑪嘉烈醫院治理"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T01:17:54+08:00","size":1,"keywords":[],"body":"西九龍公路發生交通意外。昨日（20日）下午1時許，一名54歲姓李男子駕駛電單車沿西九龍公路南行，駛至商場V Walk對開時，疑因路面有殘缺，電單車輾過坑洞後失去平衡，人仰車翻倒地。途經的私家車司機目擊意外後代為報警。\n目擊者驚呼：「咁大個坑」\n救護員接報趕抵現場，發現男傷者全身多處受傷，幸仍保持清醒，隨即由救護車送往瑪嘉烈醫院治理。警方正調查意外起因。\n網傳片見路面現大坑 另有白色小狗公路奔跑\n事後網上流傳事發現場的照片及影片，可見男事主倒臥馬路上，涉事電單車橫亘路中，有警員在場調查。有途經人士拍片時驚呼路面出現「咁大個坑」，片段中亦見有一隻白色小狗在公路上奔跑，暫未知其後去向。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf054006cec","title":"富寶花園爆水管｜鹹水凌晨起陸續恢復 議員指須檢查相關零部件有否老化","url":"https://news.tvb.com/tc/1207552-富寶花園爆水管鹹水凌晨起陸續恢復議員指須檢查相關零部件有否老化","summary":"馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4,000戶的食水及沖廁水供應一度受影響。食水供應在周五晚上約8時恢復供應，至於鹹水則於周六凌晨起陸續恢復。","summary_short":"馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4,000戶的食水及沖廁水供應一度受影響。","digest":"馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4…","points":["馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4…","食水供應在周五晚上約8時恢復供應，至於鹹水則於周六凌晨起陸續恢復","供水暫停期間，不少富寶花園居民冒著寒冷天氣，帶同水桶及水袋等，到樓下水車取水…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T01:00+08:00","size":1,"keywords":[],"body":"馬鞍山富寶花園，周五凌晨起有內部私人供水管爆裂，屋苑約4,000戶的食水及沖廁水供應一度受影響。食水供應在周五晚上約8時恢復供應，至於鹹水則於周六凌晨起陸續恢復。\n\n供水暫停期間，不少富寶花園居民冒著寒冷天氣，帶同水桶及水袋等，到樓下水車取水，取水點出現人龍，有人出動手推車。\n\n黃先生說：「真是糟糕，最重要的是鹹水、淡水都沒有，你說怎麼辦？嚴重影響的話，是沒有機會洗熱水澡。」\n\n水務署派出兩架水車，放置24個水箱，有「供水特攻隊」成員在場協助居民，派發樽裝飲用水，附近超市貨架上的樽裝水，幾乎被搶購一空。\n\n水務署稱周五早上得悉，富寶花園有內部私人供水管爆裂，與沙田民政處、區議員等協調後，大廈管理處承建商安排緊急維修。\n\n簡先生稱：「剛才問了職員，有一架水車回去裝水中，水車不是很足夠，只有一架在這裡，因為(屋苑)有兩級，這裡一層、上面一層，總共兩層，我們從上面來，我們等會兒要再走上去。」\n\n1993年入伙的富寶花園，屬私人參建居屋，共有12座、超過4,000伙。立法會議員葉傲冬曾到場了解，估計是喉管老化導致爆水管。\n\n民建聯新界東南議員葉傲冬指出：「似乎也是喉管的老化，出現金屬疲勞等情況，出現了破損，食水喉破裂的喉管，旁邊就是鹹水喉，這也是法團給我們的資訊，因為食水喉的破裂，影響了鹹水喉，出現了破裂的情況，未來最重要也要檢查相關零部件，會否出現老化情況，如果出現老化情況，也要及早更換。」\n\n水務署提醒，恢復供水初期水管可能會殘留雜質，建議市民先打開水龍頭放水，等水質清澈後才使用。","image":"https://pro-vod-cdn.tvb.com/0875034e0123470daf38c53e7026905f/snapshots/fd231d3ac28f41a78bc002bc4e318b5e-00008.jpg","video":"https://pro-vod-cdn.tvb.com/0875034e0123470daf38c53e7026905f/a6b714f12a9a4852a0bb6adb33d2b84a-34c29c35666c1498171db7cb0c6baf32-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/0875034e0123470daf38c53e7026905f/snapshots/fd231d3ac28f41a78bc002bc4e318b5e-00008.jpg","lang":"zh-Hant"},{"id":"ccb25f52cf4","title":"天氣寒冷｜今日新界6區低見10度或以下 這區日夜溫差達13度","url":"https://www.stheadline.com/society/3639461/天氣寒冷今日新界6區低見10度或以下-這區日夜溫差達13度","summary":"本港周末早晚寒意加深，日間氣溫則明顯回升。","summary_short":"本港周末早晚寒意加深，日間氣溫則明顯回升。","digest":"本港周末早晚寒意加深，日間氣溫則明顯回升","points":["本港周末早晚寒意加深，日間氣溫則明顯回升","天文台預測，今日（21日、周六）市區氣溫介乎13至21度，大致多雲，日間部分時間有陽光及乾燥","自動分區天氣預報顯示，新界6區最低氣溫降至10度或以下，其中打鼓嶺低見8度…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T00:45:20+08:00","size":1,"keywords":[],"body":"本港周末早晚寒意加深，日間氣溫則明顯回升。天文台預測，今日（21日、周六）市區氣溫介乎13至21度，大致多雲，日間部分時間有陽光及乾燥。自動分區天氣預報顯示，新界6區最低氣溫降至10度或以下，其中打鼓嶺低見8度，日間最高則達21度，日夜溫差達13度。\n打鼓嶺8度石崗9度　將軍澳大埔最低10度\n根據分區預報，周六打鼓嶺最低氣溫僅8度，石崗低見9度；將軍澳、上水、大埔及流浮山最低均為10度。多區日間氣溫回升，早晚與日間溫差顯著，市民外出宜留意氣溫變化，適時添衣。\n根據分區預報，周六打鼓嶺最低氣溫僅8度，石崗低見9度；將軍澳、上水、大埔及流浮山最低均為10度。\n天文台周五（20日）下午4時半更新的預報顯示，周六本港吹北風4至5級，後轉東風4至5級，相對濕度介乎50%至80%。\n下周初略回暖　周二季候風再抵沿岸\n天文台表示，強烈東北季候風會令周六早上廣東地區寒冷。隨着覆蓋華南的廣闊雲雨帶逐漸遠離，該區天色將短暫好轉。\n不過，一股達強風程度的偏東氣流會在下周初影響華南沿岸，屆時雲量增多，氣溫略為回升。另一股東北季候風預料於下周二（24日）抵達華南沿岸，下周中期氣溫將再度下降，並有幾陣雨。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2ec4ce4d1e","title":"香港海關自主研發「ValidAP」獲國際肯定 奪「第六屆亞洲創新發明展覽會—香港」銀獎","url":"https://www.stheadline.com/breaking-news/3639432/香港海關自主研發ValidAP獲國際肯定-奪第六屆亞洲創新發明展覽會香港銀獎","summary":"由香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中脫穎而出，榮獲銀獎。","summary_short":"由香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中脫穎而出，榮獲銀獎。","digest":"由香港海關策劃的創新項目「ValidAP」…","points":["由香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中脫穎而出…","「亞洲創新發明展覽會—香港」由日內瓦國際發明展主辦機構與香港出口商會合作舉辦…","香港海關於11月19日至20日參與在香港會議展覽中心舉行的第六屆展覽會，期間設立專屬展位…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:12:01+08:00","size":1,"keywords":[],"body":"由香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中脫穎而出，榮獲銀獎。\n「亞洲創新發明展覽會—香港」由日內瓦國際發明展主辦機構與香港出口商會合作舉辦，是專為亞洲區內創新和發明而設的年度展覽及比賽。香港海關於11月19日至20日參與在香港會議展覽中心舉行的第六屆展覽會，期間設立專屬展位，並由助理關長（稅務及策略支援）李建基親自向評審團詳細介紹「ValidAP」的主要功能及技術特點。\n海關助理關長（稅務及策略支援）李建基向評審團詳細介紹「ValidAP」的主要功能及技術特點。香港海關FB圖片\n香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中榮獲銀獎。香港海關FB圖片\n香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中榮獲銀獎。香港海關FB圖片\n香港海關策劃的創新項目「ValidAP」，在「第六屆亞洲創新發明展覽會—香港」中榮獲銀獎。香港海關FB圖片\n「ValidAP」由香港海關主導開發，是一個運用密碼學及區塊鏈技術的電子文件驗證平台，為各類電子文件（包括國際貿易相關文件）提供即時、可靠及準確的驗證，有效加速物流與經濟發展。\n海關指今次獲獎不僅展現香港海關在推動「智慧海關」建設的卓越成果，更印證在提升通關便利及促進商貿發展等方面所作的不懈努力。香港海關將繼續深化與各地海關及創科機構的交流與合作，以科技賦能海關工作，為構建更安全、更高效的國際貿易環境貢獻力量。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c93346898b2","title":"騙徒假冒機構職員 扮退款呃個人資料氹轉賬 警教4招自保","url":"https://www.stheadline.com/breaking-news/3639419/騙徒假冒機構職員-扮退款呃個人資料氹轉賬-警教4招自保","summary":"購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員，能準確說出購物者的姓名、購買紀錄及送貨地址，再以「退錢畀你」作誘餌，誘騙點擊連結、輸入個人資料，甚至轉賬。","summary_short":"購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員，能準確說出購物者的姓名、購買紀錄及送貨地址…","digest":"購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員…","points":["購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員…","警方指資料可能源自部分機構的資料外洩事件，呼籲市民應留意官方公告，接到來電話應致電客服查證…","警方指每個帳戶應使用獨立而高強度的密碼，一旦懷疑資料外洩，應即刻更改…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T22:07:37+08:00","size":1,"keywords":[],"body":"購物騙案不時發生，警方於社交平台「守網者」發文表示，近日有騙徒冒充機構職員，能準確說出購物者的姓名、購買紀錄及送貨地址，再以「退錢畀你」作誘餌，誘騙點擊連結、輸入個人資料，甚至轉賬。警方指資料可能源自部分機構的資料外洩事件，呼籲市民應留意官方公告，接到來電話應致電客服查證，不要點擊可疑連結，更不要未核實對方身份便給予個人資料。\n此外，警方指每個帳戶應使用獨立而高強度的密碼，一旦懷疑資料外洩，應即刻更改，其他曾用過同一密碼的帳戶亦要一併更改。凡支援雙重認證的帳戶應全部開啟，銀行密碼、信用卡驗證碼及一次性驗證碼，絕對不可透露予來電者，亦不要在可疑網站輸入。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd487e653e2","title":"特區政府強烈譴責美中經濟與安全審議委員會報告 嚴厲駁斥國安法與經濟發展失實指控","url":"https://www.stheadline.com/politics/3639430/特區政府強烈譴責美中經濟與安全審議委員會報告-嚴厲駁斥國安法與經濟發展失實指控","summary":"特區政府今日（20日）發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」，直斥其偏頗和失實抹黑。","summary_short":"特區政府今日（20日）發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」，直斥其偏頗和失實抹黑。","digest":"特區政府發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」…","points":["特區政府今日（20日）發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」…","發言人強調，特區政府堅定實施國安法律，保障市民權利，並嚴正駁斥報告對本港司法獨立…","特區政府強調，香港特區是中華人民共和國不可分離的部分，在「一國兩制」下享有高度自治權"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T21:56:43+08:00","size":1,"keywords":[],"body":"特區政府今日（20日）發聲明，強烈譴責和反對美中經濟與安全審議委員會發表的「2026年報告」，直斥其偏頗和失實抹黑。發言人強調，特區政府堅定實施國安法律，保障市民權利，並嚴正駁斥報告對本港司法獨立、涉華案件判決，以及因「五年規劃」而偏離資本主義市場經濟的無理指控。\n堅決維護國家安全 駁斥美方雙重標準與抹黑\n特區政府強調，香港特區是中華人民共和國不可分離的部分，在「一國兩制」下享有高度自治權。政府將堅定不移實施《香港國安法》及《維護國家安全條例》，依法防範和懲治危害國家安全的行為，同時保障市民的權利和自由。\n針對報告對本港國安法律的指控，特區政府指出國安法律精準針對危害國家安全的行為，完全不影響本地機構、組織及人員與海外的正常交流。同時，本港的傳媒環境在《基本法》保障下蓬勃依然，新聞工作者只要按「負責任新聞作業」原則真誠行事，其行使自由的權利全然不受限制。\n相反，美國自身的傳媒環境卻日趨嚴峻，自2026年至今已拘捕40多名記者，對記者施暴個案更近170宗。美國擁有龐大國安法體系，更頻繁以國安為名打壓別國，美方刻意捏造香港狀況，顯然是雙重標準與卑劣政治操弄。目前經修訂的《實施細則》及新訂立的《維護國家安全（程序事宜）規例》均設有司法把關機制，充分保障了個人和組織的合法權利。\n特區政府維護獨立的司法權，全力支持司法機構依法獨立行使審判權。\n捍衛司法獨立與公正 斥外部勢力干預司法程序\n特區政府維護獨立的司法權，全力支持司法機構依法獨立行使審判權。律政司的刑事檢控工作完全不受干涉，所有檢控決定均是基於證據和法律作出客觀分析，控方更有責任在毫無合理疑點下證明被告人犯罪，以維護司法公正。\n發言人亦就報告提及的多宗案件作出嚴正駁斥。在「黎智英案」中，法庭嚴格按照證據和法律判案並依法重判，彰顯法治與公義，黎智英本人亦已選擇不提出上訴，外部勢力的抹黑在公正審判下不攻自破。至於「支聯會案」，法庭判詞已明確指出其綱領旨在顛覆國家政權、破壞憲法下的根本制度，被告並非因政治觀點受審。\n另外，黃之鋒承認串謀勾結外國勢力危害國家安全罪，且屢次干犯非法集結及藐視法庭等罪，依法懲治屬咎由自取。針對通緝犯的打壓潛逃措施完全符合國際慣例，其中「郭鳳儀案」防範他人移轉潛逃者資產的法律，旨在督促其回港，並不存在任何連坐懲罰。而英方在「駐倫敦經貿辦僱員案」中以莫須有罪名進行政治操弄，相關指控與特區政府及經貿辦絕無關連。\n實施包括國家安全教育在內的國民教育是教育當局的正當責任。\n維持資本主義市場經濟 融入國家發展大局\n特區政府澄清，任何指稱香港因「五年規劃」出台而偏離資本主義市場經濟的說法絕對子虛烏有。香港將繼續奉行自由貿易、資金及資訊自由流動的市場經濟政策，並將「有效市場」與「有為政府」雙管齊下作為基本原則，這與世界主要經濟體進行中長期規劃的普遍做法一致。\n本港金融體系誠信穩健，打擊洗錢及恐怖分子資金籌集的法律架構健全，並將於下月提交條例草案以進一步擴大虛擬資產服務規管。同時，本港全面且嚴格執行聯合國安理會施加的制裁，拒絕可疑船隻入港，但不會執行個別國家的單邊制裁。\n政治與社會制度方面，完善選舉制度後產生的立法會全面落實「愛國者治港」，已擺脫以往撕裂亂象，重回理性務實正軌。在教育方面，實施包括國家安全教育在內的國民教育是教育當局的正當責任，而本地學者和院校在保障學術自由的前提下，與境外的正常學術交流活動依然蓬勃。特區政府重申，香港將發揮「超級聯繫人」和「超級增值人」的角色，鞏固各項國際中心地位，而美國在港擁有龐大商業利益，香港的繁榮穩定對港美雙方均有利。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cda4303cd76","title":"FIP板網球銀級賽32強西沙GO PARK揭幕 雲集300頂尖球手雲集 周日決賽免費入場","url":"https://www.stheadline.com/society/3639425/FIP板網球銀級賽32強西沙GO-PARK揭幕-雲集300頂尖球手雲集-周日決賽免費入場","summary":"由中國香港板式網球總會等主辦的國際板網球巡迴賽「FIP Silver GO PARK Hong Kong」，於11月20日在西沙GO PARK揭幕。","summary_short":"由中國香港板式網球總會等主辦的國際板網球巡迴賽「FIP Silver GO PARK Hong Kong」…","digest":"由中國香港板式網球總會等主辦的國際板網球巡迴賽「FIP Silver GO PARK…","points":["由中國香港板式網球總會等主辦的國際板網球巡迴賽「FIP Silver GO PARK Hon…","賽事升級至銀級，吸引近30個國家及地區、近300位頂尖球手參賽","所有賽事及嘉年華由即日起至11月22日決賽均免費向公眾開放，藉此推動本港盛事經濟與運動旅遊…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T21:35:12+08:00","size":1,"keywords":[],"body":"由中國香港板式網球總會等主辦的國際板網球巡迴賽「FIP Silver GO PARK Hong Kong」，於11月20日在西沙GO PARK揭幕。賽事升級至銀級，吸引近30個國家及地區、近300位頂尖球手參賽。所有賽事及嘉年華由即日起至11月22日決賽均免費向公眾開放，藉此推動本港盛事經濟與運動旅遊，誠邀市民親臨感受運動狂熱。\n三大賽事同場薈萃 雲集世界百強球手\n由中國香港板式網球總會及 Asia Padel Events 聯合主辦、GO PARK Sports 擔任場地夥伴的「FIP Silver GO PARK Hong Kong」國際板網球巡迴賽，今日（20日）正式展開男女子雙打32強賽事。大會邀得中國香港板式網球總會會長及新鴻基地產執行董事郭基煇、文化體育及旅遊局體育專員莊敏婷，以及中國香港體育協會暨奧林匹克委員會義務秘書長楊祖賜等多位嘉賓，出席32強開賽典禮。\n中國香港板式網球總會會長及新鴻基地產執行董事郭基煇。\n體院院長蔡玉坤、中國香港板式網球總會會長及新鴻基地產執行董事郭基煇、GO PARK Sports 總監朱國庭，與中國香港板網球隊代表、2026年亞運八強女子運動員陳曉嵐及中國香港板式網球總會代表親切交流。\n匯聚三大賽事 同步舉行嘉年華\n今次運動盛事一舉匯聚了三大板網球賽事，並全部免費向公眾開放。除了核心的銀級巡迴賽吸引近300位頂尖球手，當中包括多位FIP世界百強球員及中國香港代表外，同場更設有首屆「FIP Promises 青少年錦標賽」，吸引近150位來自世界各地的U18新生代好手參與。此外，本地球手亦會在「Hong Kong Challenger 本地排名賽」中同場競技，令本周日（22日）的決賽更具看頭。\n為配合賽事進行，場內同期舉行「板網球狂熱嘉年華」，設有星級大師班、美食車及互動遊戲。在11月21日及22日的週末期間，現場更特別增設 Primal Power Nutrition 免費試飲專區、McDavid「擊退痛症大挑戰」、板網球神射手入桶挑戰賽，以及現場限定官方紀念品發售，務求令板網球迷與零基礎新手皆能樂在其中。\n郭基煇：做好體育與文化交流平台\n郭基煇指出，GO PARK Sports 至今已先後四度迎來 FIP 國際板網球賽事，累計匯聚逾900位球手。今屆賽事級別由銅級晉升至銀級，展現了香港積極推動盛事經濟與運動旅遊。大會更帶領參賽球手品嚐本地茶樓點心，並到訪尖沙咀由香港旅遊發展局主辦的「香港繽紛冬日巡禮」，感受本港節日氣氛。他續稱，西沙GO PARK坐落於優美海岸線旁，自開幕以來已成功舉辦1,300場國際賽事及大型盛事，累計吸引超過630萬人次到訪，期望能繼續做好體育與文化交流的平台。\n中國香港板網球隊代表陳曉嵐表示，板網球在2026年首次成為亞運項目，她有幸代表香港參賽並晉身八強。今次能在主場西沙GO PARK與世界頂尖球手切磋，機會難得，並感謝郭基煇的鼎力支持，認為這展現了香港舉辦國際體育賽事及推動運動旅遊的專業實力。\n大馬選手大讚GO PARK配套\n馬來西亞板網球隊代表、2026年亞運銀牌得主Christian Didier Chin Zao Quan亦對賽事配套讚不絕口。他指出，西沙GO PARK的球場、物理治療支援及戶外健身設施均屬國際級水平，並感謝帝逸酒店提供的住宿支持。他在賽事餘暇到訪了GO PARK Aqua水上活動中心，在三杯酒及企嶺下海一帶駕駛意大利經典FIAT海上跑車，並前往蓮香樓品嚐地道點心、漫步星光大道欣賞維港夜色，在尖沙咀感受濃厚聖誕氣氛。他盛讚香港兼具世界級賽事配套與豐富旅遊體驗，期待日後再次來港參賽。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cfebf0b88e6","title":"食環署持續推展「雷霆行動」和「天羅行動」滅鼠 截至昨日檢近300隻老鼠","url":"https://www.stheadline.com/society/3639422/食環署持續推展雷霆行動和天羅行動滅鼠-截至昨日檢近300隻老鼠","summary":"食環署今日（20日）公布全港打擊鼠患行動進展，指自11月4日展開「雷霆行動」以來，截至昨日（19日），署方在全港針對性核查1,433個地點，共發現282個鼠洞或藏匿點…","summary_short":"食環署今日（20日）公布全港打擊鼠患行動進展，指自11月4日展開「雷霆行動」以來，截至昨日（19日）…","digest":"食環署公布全港打擊鼠患行動進展，指自11月4日展開「雷霆行動」以來，截至…","points":["食環署今日（20日）公布全港打擊鼠患行動進展，指自11月4日展開「雷霆行動」以來…","署方剛完成為期兩周的第三階段「天羅行動」，期間巡查食肆及食物業處所逾3,300次…","食環署表示，「雷霆行動」採取風險為本及精準部署策略，主動追查鼠穴集中滅鼠"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T21:25:44+08:00","size":1,"keywords":[],"body":"食環署今日（20日）公布全港打擊鼠患行動進展，指自11月4日展開「雷霆行動」以來，截至昨日（19日），署方在全港針對性核查1,433個地點，共發現282個鼠洞或藏匿點，捕獲161隻活鼠及收集119隻死鼠。此外，署方剛完成為期兩周的第三階段「天羅行動」，期間巡查食肆及食物業處所逾3,300次，並就衞生及鼠患問題提出176宗檢控。\n食環署表示，「雷霆行動」採取風險為本及精準部署策略，主動追查鼠穴集中滅鼠。已核查的1,433個位置中，包括1,230個由其他政府部門管理的公園及休憩用地。人員至今已在162個位置完成毒殺老鼠及封堵鼠洞，署方指不排除大部分鼠隻已死於洞內及隱蔽處，未能在檢獲數字中全面反映，而覆查顯示相關地點鼠蹤已大幅減少。其中，行動初期重點之一的尖沙咀文化中心，展開工作至今已捕獲及檢獲逾100隻老鼠。\n署方近日亦聯同康文署在九龍城及元朗區進行針對性滅鼠。在九龍城差館里休憩處，食環署人員巡查發現花圃圍牆底部有裂隙及垃圾管理問題，透過施放毒餌、設鼠籠及出動夜間流動隊，共捕獲12隻活鼠及治理8處鼠穴，並已建議康文署盡快修補設施及加強清理食物殘渣；執法人員亦就亂拋垃圾發出2張定額罰款通知書及提出1宗檢控。至於元朗鳳翔路花園，人員在兩個花圃發現7個活躍鼠穴及食物殘渣，施放毒餌後共收集17隻死鼠及摧毀7個鼠穴，康文署亦已清走現場殘渣雜物，並安排在受影響花圃翻土。\n「天羅行動」巡查食肆逾3,300次 發逾百張消除蟲鼠通知\n另一方面，食環署剛完成為期兩周的第三階段「天羅行動」，重點巡查食物業處所及商場食肆的衞生、垃圾收集及廚餘處理情況。行動期間，署方巡查商場內及其他高風險位置食肆共1,996次，發出62張「消除蟲鼠通知」、177張「規定食物業處所改善清潔狀況及維修通知」、12項警告及提出115宗檢控；另巡查其他食物業處所1,369次，發出24張「消除蟲鼠通知」、70張改善清潔及維修通知、4項警告及提出61宗檢控。署方亦向有關商場及大廈物業管理負責人發出42張「消除蟲鼠通知」，要求加快廢物處理及堵塞鼠洞。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c945327cb6f","title":"APEC青年企业家峰会在港举行 APEC秘书处执行主任点赞香港创业活力","url":"https://www.chinanews.com/ga/shipin/cns-d/2026/11-20/news1075613.shtml","summary":"11月20日，2026 APEC Next-Gen青年企业家峰会在香港故宫文化博物馆举行。","summary_short":"11月20日，2026 APEC Next-Gen青年企业家峰会在香港故宫文化博物馆举行。","digest":"APEC青年企业家峰会在港举行 APEC秘书处执行主任点赞香港创业活力","points":["11月20日，2026 APEC Next-Gen青年企业家峰会在香港故宫文化博物馆举行","会上，亚太青年创业家协会(APYEA)与香港菁英会正式签署合作备忘录…"],"section":"港聞","category":"港聞","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-20T21:20:06+08:00","size":1,"keywords":[],"body":"11月20日，2026 APEC Next-Gen青年企业家峰会在香港故宫文化博物馆举行。APEC秘书处执行主任爱德华多·佩德罗萨在峰会上点赞香港创业活力，寄语青年企业家充分发挥潜力。\n\n会上，亚太青年创业家协会(APYEA)与香港菁英会正式签署合作备忘录，双方将建立常态化的区域青年企业家网络，并将APYEA香港办事处落户香港菁英会。\n\n(记者 陈子彦)","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/20/chinanews/MEIZI_YUNSHI/onair/401436C1E6904434A80D88519D4A385A.mp4","video_poster":"","lang":"zh-Hans"},{"id":"ce670787a8d","title":"馬鞍山富寶花園停食水鹹水 居民捱寒冒雨取水現百米人龍 女子水箱旁洗菜被罵","url":"https://www.stheadline.com/breaking-news/3639389/馬鞍山富寶花園停食水鹹水-居民捱寒冒雨取水現百米人龍-女子水箱旁洗菜被罵","summary":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。","summary_short":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。","digest":"馬鞍山富寶花園凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響","points":["馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響","水務署派出水車及水箱供居民使用，逾百名居民撐起雨傘冒寒排隊取水，人龍一度長達200米","有民居擔心維修工程需時，可能長時間沒有食水及鹹水，「都唔知夠唔夠水煮飯…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T21:13:58+08:00","size":1,"keywords":[],"body":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。水務署派出水車及水箱供居民使用，逾百名居民撐起雨傘冒寒排隊取水，人龍一度長達200米。有民居擔心維修工程需時，可能長時間沒有食水及鹹水，「都唔知夠唔夠水煮飯，今晚唔沖涼喇橫掂天寒地凍」。\n富寶花園附近超市食水被搶購一空\n《星島頭條》現場所見，水車停放在富寶花園商場對開空地，另有多個水箱放在屋苑不同位置供人使用。由於現時正值煮飯時間，不少居民帶同水煲、水桶到水箱取水，秩序大致良好，不過有人用水箱的水洗菜，被其他居民指罵「嘥水」。另外，超市的食水亦被搶購一空。\n居於12座的劉先生帶同兒子到樓下取水，他指今次事出突然，幸今日早上他與家人已經洗澡，可以「頂多一陣」，「唯有出街食飯啦唔煮啦，如果聽日都仲係無水就唔沖喇，都無辦法」。另外，一名居於第4座的居民指維修工程需時，可能長時間沒有食水及鹹水，「都唔知夠唔夠水煮飯，今晚唔沖涼喇橫掂天寒地凍」。\n相關新聞 : 馬鞍山富寶花園喉管爆裂 食水及鹹水供應暫停 逾4200戶受影響","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cbec2588322","title":"北角社區客廳開幕 料可服務區內270個劏房戶","url":"https://news.tvb.com/tc/1207519-北角社區客廳開幕料可服務區內270個劏房戶","summary":"北角社區客廳開幕，是今年第10間投入服務的社區客廳。客廳面積2,400平方呎，設有煮食區，洗衣機，以及兒童遊戲區，有小朋友在場玩耍。","summary_short":"北角社區客廳開幕，是今年第10間投入服務的社區客廳。","digest":"北角社區客廳開幕，是今年第10間投入服務的社區客廳","points":["北角社區客廳開幕，是今年第10間投入服務的社區客廳","客廳面積2,400平方呎，設有煮食區，洗衣機，以及兒童遊戲區，有小朋友在場玩耍","客廳由太古提供場地，聖雅各福群會營運，預計可服務區內270個劏房戶，全年服務43,000人次"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T20:56+08:00","size":1,"keywords":[],"body":"北角社區客廳開幕，是今年第10間投入服務的社區客廳。\n\n客廳面積2,400平方呎，設有煮食區，洗衣機，以及兒童遊戲區，有小朋友在場玩耍。客廳由太古提供場地，聖雅各福群會營運，預計可服務區內270個劏房戶，全年服務43,000人次。\n\n政務司司長陳國基、勞福局局長孫玉菡出席開幕禮，並且參觀了客廳設施。陳國基稱，政府會繼續透過政策引導及跨界別合作，令社區客廳紮根社區，持續發展及不斷優化服務。","image":"https://pro-vod-cdn.tvb.com/278573a25e4c4587b5c9d59d6356648f/snapshots/22307097cc8444c795e51dbd09fb12c4-00004.jpg","video":"https://pro-vod-cdn.tvb.com/278573a25e4c4587b5c9d59d6356648f/21e5967ab5cc417c90b73f654aa7f28a-234c0a68c4d9668bba9280eb26d63183-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/278573a25e4c4587b5c9d59d6356648f/snapshots/22307097cc8444c795e51dbd09fb12c4-00004.jpg","lang":"zh-Hant"},{"id":"cca3fcff6d5","title":"馬鞍山富寶花園爆喉影響逾4200戶 食水陸續恢復 鹹水管仍未完成維修","url":"https://www.stheadline.com/breaking-news/3639372/馬鞍山富寶花園爆喉影響逾4200戶-食水陸續恢復-鹹水管仍未完成維修","summary":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。","summary_short":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。","digest":"馬鞍山富寶花園凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響","points":["馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響","管理處其後發通告通知住戶，指食水供水喉管爆裂處位於地底位置，維修程序較為複雜…","水務署其後派員到場協助，並派遣水車及水箱到各座樓宇地下，為住戶提供臨時供水"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:54:43+08:00","size":1,"keywords":[],"body":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。管理處其後發通告通知住戶，指食水供水喉管爆裂處位於地底位置，維修程序較為複雜，現階段暫未能清晰了解恢復供水時間。水務署其後派員到場協助，並派遣水車及水箱到各座樓宇地下，為住戶提供臨時供水。\n至晚上8時半，管理處再發出通告，指食水供水喉管經搶修後，陸續恢復各大廈的食水供應，惟沖廁供水喉管則仍未完成維修。\n管理處至晚上8時半再發出通告，指食水喉管已完成搶修。\n富寶花園管理處已安排搶修\n管理處在通告中提到，今日凌晨4時許屋苑的食水及鹹水總供水系統（入邨總供水系統）有喉管突發性爆裂，導致供水中斷。事故發生後，管理處已安排承辦商進行緊急搶修工程，惟食水供水喉管爆裂處處於地底位置，維修程序較為複雜，現階段暫未能清晰了解恢復供水時間，並呼籲市民自備容器到各座樓下的水車及水箱取水。\n水務署︰派出「供水特攻隊」 協助居民取水\n水務署表示，今早得悉馬鞍山富寶花園因內部私人供水管爆裂，導致屋苑住戶食水及沖廁水供應受到影響。署方經與沙田民政事務處、區議員及屋苑管理處協調後，已為屋苑安排臨時食水供應，包括提供4架水車及放置24個水箱，亦派出「供水特攻隊」 於取水點協助居民取水，並主動為有需要的居民送上水袋及樽裝水。\n水務署續稱，有關大廈管理處承建商正為大廈內部供水系統安排緊急維修工程，署方會提供適切技術支援，以協助大廈管理處盡快完成有關的私人水管維修工程。\n立法會議員葉傲冬在社交平台發文，指現時工程人員正全力搶修，爭取於今晚先行修復食水喉並盡快恢復供水，務求將對街坊日常生活的影響減至最低。\n翻查資料，富寶花園於1993年入伙，共有12座、大約4200個單位。\n相關新聞︰富寶花園居民捱寒冒雨取水現百米人龍 女子水箱旁洗菜被罵","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf7e27e52ac","title":"海關破酒店製毒工場及分銷中心檢160萬元大麻毒品 3男女被捕","url":"https://www.stheadline.com/breaking-news/3639417/海關破酒店製毒工場及分銷中心檢160萬元大麻毒品-3男女被捕","summary":"香港海關昨日（19日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約3.7公斤懷疑大麻花、約3.6公斤懷疑大麻油、約24公斤懷疑大麻糖…","summary_short":"香港海關昨日（19日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約3.7公斤懷疑大麻花…","digest":"香港海關在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場…","points":["香港海關昨日（19日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場…","海關人員透過情報分析及深入調查，並鎖定兩名男子採取執法行動","海關人員於昨日押解一名23歲目標男子及一名28歲同行女子到屯門一個住宅單位進行搜查…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:46:54+08:00","size":1,"keywords":[],"body":"香港海關昨日（19日）在屯門搗破一個懷疑毒品分銷中心及在荃灣搗破一個懷疑製毒工場，檢獲約3.7公斤懷疑大麻花、約3.6公斤懷疑大麻油、約24公斤懷疑大麻糖、1148支懷疑大麻油煙彈及一批懷疑毒品包裝及製毒工具，估計市值共約160萬元，並拘捕3人。\n海關人員透過情報分析及深入調查，並鎖定兩名男子採取執法行動。海關人員於昨日押解一名23歲目標男子及一名28歲同行女子到屯門一個住宅單位進行搜查，在單位內檢獲約3.7公斤懷疑大麻花、332支懷疑大麻油煙彈、約180克懷疑大麻糖及一批懷疑毒品包裝工具。\n海關人員其後押解另外一名33歲目標男子到荃灣一個酒店單位進行搜查，在單位內檢獲約3.6公斤懷疑大麻油、816支懷疑大麻油煙彈、約24公斤懷疑大麻糖及一批懷疑毒品包裝及製毒工具。\n23歲被捕男子及28歲被捕女子已被控兩項販運危險藥物罪，而33歲被捕男子已被控兩項販運危險藥物罪和一項製造危險藥物罪，案件明日（21日）在沙田裁判法院提堂。\n被捕23歲男子報稱無業，而33歲被捕男子則報稱地盤工人，他們承認收取每個月2萬港元作販毒報酬；至於28歲被捕女子則為一名清潔工。\n海關表示，販毒集團選擇交通較不便、人流稀少的酒店房間製毒，然後將製成品轉運至市區住宅單位，以進行包裝、儲存及分銷，試圖分散風險及逃避執法人員偵查。另外，集團在製毒過程中會混入不同香味及香油，以減低年輕人的戒心，從而令他們染上毒癮。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c202a787854","title":"蔡天鳳案・今日重點｜鄺港智稱折返驚見蔡天鳳無氣息 以為父會報警看新聞始知分屍","url":"https://www.stheadline.com/society/3639396/蔡天鳳案今日重點鄺港智稱折返驚見蔡天鳳無氣息-以為父會報警看新聞始知分屍","summary":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。","summary_short":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智…","digest":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智…","points":["28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智…","案件踏入第42日審訊，鄺港智第2日出庭作供","他指案發日蔡天鳳不滿鄺球聲言要見孫兒否則不合作，大怒於七人車上狂罵鄺球後要當面談判"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:40:54+08:00","size":1,"keywords":[],"body":"28歲名媛蔡天鳳（Abby Choi）2023年2月疑遭殺害後肢解烹屍，其前夫鄺港智、前家翁鄺球及前夫兄長鄺港傑否認謀殺罪。案件踏入第42日審訊，鄺港智第2日出庭作供。他指案發日蔡天鳳不滿鄺球聲言要見孫兒否則不合作，大怒於七人車上狂罵鄺球後要當面談判。鄺港智指他再見蔡天鳳時，對方已頭破血流倒地，且無呼吸心跳。他後來離開時以為鄺球會報警或召救護車，但看報導才知蔡被肢解。\n鄺港智指蔡天鳳罵鄺球「臨老入花叢」\n鄺港智憶述案發當日登上AA七人車與蔡天鳳同行接女兒放學，期間閒談替蔡母還賭債利息及睇樓等事。及後他向蔡天鳳透露，鄺球要求見孫兒否則不再配合其他事，隨即惹怒蔡天鳳。蔡天鳳在車上狂鬧鄺球，斥責他60多歲仍「臨老入花叢」「溝骨妹」，揶揄他被騙光錢財，說着說着，更決定不讓他再見孫兒「教壞」兩人，並當場拍板要找鄺球談判，鄺港智說抵達大尾督停車場時蔡天鳳仍在生。\n相關新聞：\n蔡天鳳碎屍案丨鄺港智稱從未接觸沾有其DNA的錘子 不知是否與蔡天鳳死亡有關\n蔡天鳳碎屍案丨鄺港智指蔡天鳳斥鄺球死老嘢臨老入花叢 拒讓見孫兒免教壞 案發日談判\n折返驚見蔡天鳳頭破血流倒地\n鄺港智供稱，抵埗後鄺球上車與蔡天鳳傾談，他與兄長鄺港傑下車吸煙，折返打開車門卻見蔡天鳳已倒臥地上，鄺球則稱「唔好講住」並指示先返龍尾村單位。途中他見蔡天鳳頭部流血，觸摸心跳及探測呼吸均無反應。到埗後他問鄺球是否報警或召救護車，鄺球以他正被通緝為由指示先搬入屋。他在外把風及協助清空七人車，期間發現衣物在檢查蔡天鳳時沾血遂更衣。鄺港智指，因正被通緝及鄺球表示會處理，於是他急忙離開；其後知道蔡母張燕花已報警，因不滿對方明知他被通緝仍未事先通知便驚動警方而爆粗，他隨即致電鄺球並收拾物品離開。\n相關新聞：\n蔡天鳳碎屍案丨鄺港智：蔡天鳳與鄺球車上傾談後 頭破流血倒地\n蔡天鳳碎屍案丨鄺港智否認曾襲擊或計劃參與襲擊蔡天鳳\n以為鄺球會報警結果是分屍\n鄺港智指當日於停車場見到蔡天鳳倒臥在地時「好驚好緊張」，更沒預計蔡天鳳會遭襲擊。其後「老豆叫我哋走先，話佢會處理」，於是他匆忙離開龍尾村，返抵加多利山後才入房哭泣，大概哭泣數十分鐘後，他走出房外「好似無事咁樣」，實是強抑情緒。他稱，他本以為鄺球會「報警或者call白車」，未料後來看報導，得知蔡天鳳被肢解時大驚，他形容當時「心驚驚」，遂安排取回存放在貴族鐘錶的款項並離開。\n指當年偷金蔡天鳳有份「睇水」\n鄺港智接受鄺港傑的代表大狀盤問時提到，14歲認識蔡天鳳後便發生性關係，當時蔡母並不反對「佢好鍾意㖭」，翌年並遷入對方住所。被問到他於婚前開始干犯盜竊案，蔡天鳳對此可知情，鄺港智直言「一齊做㗎嘛，佢幫我睇水⋯⋯（涉案金器）我交畀佢」。\n相關新聞：\n蔡天鳳碎屍案｜鄺港智婚前起干犯偷金案 蔡天鳳有份　「一齊做㗎嘛，佢幫我睇水」\n急付30萬「坐大飛」潛逃「受騙」\n鄺港智供稱因本身正被通緝，加上知悉出事及張燕花稱警方正尋找他，遂提取名錶及金錢，打算在2月22或23日安排乘搭「大飛」離港。他指以往一程船費僅10萬元，惟當時表明急需離開、「錢唔緊要」任由對方開價，結果費用被加至30萬元，他答應後翌日在接頭人陪同下抵達東涌碼頭，隨即被捕驚覺受騙。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9c59df6511","title":"馬鞍山富寶花園喉管爆裂 食水及鹹水供應一度暫停 逾4200戶受影響","url":"https://www.stheadline.com/breaking-news/3639372/馬鞍山富寶花園喉管爆裂-食水及鹹水供應一度暫停-逾4200戶受影響","summary":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。","summary_short":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。","digest":"馬鞍山富寶花園凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響","points":["管理處其後發通告通知住戶，指食水供水喉管爆裂處位於地底位置，維修程序較為複雜…","水務署其後派員到場協助，並派遣水車及水箱到各座樓宇地下，為住戶提供臨時供水","至晚上8時半，現場有消息指水管已完成修復，部份座數已經恢復供水"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:37:22+08:00","size":1,"keywords":[],"body":"馬鞍山富寶花園今日（20日）凌晨有喉管爆裂，導致屋苑的食水及鹹水供應暫停，逾4200戶受影響。管理處其後發通告通知住戶，指食水供水喉管爆裂處位於地底位置，維修程序較為複雜，現階段暫未能清晰了解恢復供水時間。水務署其後派員到場協助，並派遣水車及水箱到各座樓宇地下，為住戶提供臨時供水。至晚上8時半，現場有消息指水管已完成修復，部份座數已經恢復供水。\n富寶花園管理處已安排搶修\n管理處在通告中提到，今日凌晨4時許屋苑的食水及鹹水總供水系統（入邨總供水系統）有喉管突發性爆裂，導致供水中斷。事故發生後，管理處已安排承辦商進行緊急搶修工程，惟食水供水喉管爆裂處處於地底位置，維修程序較為複雜，現階段暫未能清晰了解恢復供水時間，並呼籲市民自備容器到各座樓下的水車及水箱取水。\n水務署︰派出「供水特攻隊」 協助居民取水\n水務署表示，今早得悉馬鞍山富寶花園因內部私人供水管爆裂，導致屋苑住戶食水及沖廁水供應受到影響。署方經與沙田民政事務處、區議員及屋苑管理處協調後，已為屋苑安排臨時食水供應，包括提供4架水車及放置24個水箱，亦派出「供水特攻隊」 於取水點協助居民取水，並主動為有需要的居民送上水袋及樽裝水。\n水務署續稱，有關大廈管理處承建商正為大廈內部供水系統安排緊急維修工程，署方會提供適切技術支援，以協助大廈管理處盡快完成有關的私人水管維修工程。\n立法會議員葉傲冬在社交平台發文，指現時工程人員正全力搶修，爭取於今晚先行修復食水喉並盡快恢復供水，務求將對街坊日常生活的影響減至最低。\n翻查資料，富寶花園於1993年入伙，共有12座、大約4200個單位。\n相關新聞︰富寶花園居民捱寒冒雨取水現百米人龍 女子水箱旁洗菜被罵","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9a5aeb0559","title":"寒冷天氣警告｜市民買料打邊爐 牛肉檔大排長龍 火鍋店坐無虛席","url":"https://www.stheadline.com/breaking-news/3639426/寒冷天氣警告市民買料打邊爐-牛肉檔大排長龍-火鍋店坐無虛席","summary":"受強烈東北季候風影響，本港今日（20日）氣溫顯著下降，天文台發出寒冷天氣警告，天文台尖沙咀總部更錄得最低氣溫12.7度，是入秋以來的最低紀錄。","summary_short":"受強烈東北季候風影響，本港今日（20日）氣溫顯著下降，天文台發出寒冷天氣警告，天文台尖沙咀總部更錄得最低氣溫12.7度…","digest":"受強烈東北季候風影響，本港氣溫顯著下降，天文台發出寒冷天氣警告…","points":["受強烈東北季候風影響，本港今日（20日）氣溫顯著下降，天文台發出寒冷天氣警告…","不少市民專程到街市買火鍋配料，準備與親友在家打邊爐禦寒，其中九龍城街市不少檔口大排長龍…","《星島頭條》記者下午走訪九龍城區街市，見到九龍城街市見有不少市民正選購火鍋食材，人頭湧湧…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:32:39+08:00","size":1,"keywords":[],"body":"受強烈東北季候風影響，本港今日（20日）氣溫顯著下降，天文台發出寒冷天氣警告，天文台尖沙咀總部更錄得最低氣溫12.7度，是入秋以來的最低紀錄。不少市民專程到街市買火鍋配料，準備與親友在家打邊爐禦寒，其中九龍城街市不少檔口大排長龍，其中買牛肉及鮮雞的檔口最受市民歡迎，需要排隊才能買到心頭好。\n《星島頭條》記者下午走訪九龍城區街市，見到九龍城街市見有不少市民正選購火鍋食材，人頭湧湧，其中一間牛肉檔亦出現人龍，大約有10人在排隊。雞檔檔主玲姐表示，今日天氣突然急降，多人購買雞件打邊爐，「個個都話買嚟打邊爐，幾好呀幾happy呀，不過今日又撞啱落雨，如果凍就多啲人嚟買 但落雨就唔多，啲老人家唔嚟又靜咗啲」。\n凍肉檔檔主Tina姐透露，受惠今日天氣氣溫顯著下降，多人購買魚蛋等食物準備打邊爐，「今朝一開舖已經有好多人嚟買嘢，主要都係嚟買魚蛋、手打墨丸、魚餃、魚皮…希望嚟緊呢幾日生意keep住好啦」。\n不過，有市民亦趁天氣轉涼，相約三五知己外出打邊爐，其中深水埗一間有名炭爐火鍋店亦坐無虛席，不少人聚在一邊打邊爐驅寒取暖，大塊朵頤。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cccc2aca2e1","title":"據悉馬鞍山富寶花園完成修復水管 供水陸續恢復","url":"https://news.tvb.com/tc/1207511-據悉馬鞍山富寶花園完成修復水管供水陸續恢復","summary":"馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響。傍晚約六時晚飯時間，不少居民帶同水桶、水袋等，到樓下水車取水，取水點出現人龍，有水務署「供水特攻隊」，及關愛隊成員協助居民。","summary_short":"馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響。","digest":"馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響","points":["馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響","傍晚約六時晚飯時間，不少居民帶同水桶、水袋等，到樓下水車取水，取水點出現人龍…","到晚上近8時，現場消息指，已完成修復水管，供水陸續恢復"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-20T20:31:00+08:00","size":1,"keywords":["水務署","爆水管","富寶花園"],"body":"馬鞍山富寶花園有內部私人供水管爆裂，屋苑食水及沖廁水供應受影響。\n\n傍晚約六時晚飯時間，不少居民帶同水桶、水袋等，到樓下水車取水，取水點出現人龍，有水務署「供水特攻隊」，及關愛隊成員協助居民。\n\n水務署指早上得悉，富寶花園有內部私人供水管爆裂，與沙田民政處、區議員等協調後，已安排臨時食水供應，除了4架水車，亦放置了24個水箱。\n\n大廈管理處承建商，安排緊急維修。到晚上近8時，現場消息指，已完成修復水管，供水陸續恢復。\n\n富寶花園在1993年入伙，屬私人參建居屋，共有12座、超過4,000個單位。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026KMw0kufiRa1795178204.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/051a3757bf3c43e1a546f4b5e9192128/4ea3a59a6d384b0cad4f57613d607de7-0534e50d1ad8e04a5a896581468f9589-sd.m3u8","video_poster":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026KMw0kufiRa1795178204.jpg?x-oss-process=image/resize,w_1200","lang":"zh-Hant"},{"id":"cac15615497","title":"北角社區客廳開幕 料惠及270劏房戶 陳國基：冀成家長日常喘息空間","url":"https://www.stheadline.com/society/3639406/北角社區客廳開幕-料惠及270劏房戶-陳國基冀成家長日常喘息空間","summary":"北角社區客廳今日（20日）舉行開幕典禮，政務司司長陳國基表示，北角社區客廳是今年第10間投入服務的社區客廳，體現「政、商、民」三方通力合作，為劏房戶開拓生活空間及提供支援。","summary_short":"北角社區客廳今日（20日）舉行開幕典禮，政務司司長陳國基表示，北角社區客廳是今年第10間投入服務的社區客廳，體現「政…","digest":"北角社區客廳舉行開幕典禮，政務司司長陳國基表示…","points":["北角社區客廳今日（20日）舉行開幕典禮，政務司司長陳國基表示…","他指出，這間社區客廳的一大特色是小朋友較多，不少家長特別是母親都會每日到訪…","陳國基致辭時表示，東區是港島最多劏房的地區，繼去年3月筲箕灣社區客廳投入服務後…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-20T20:20:24+08:00","size":1,"keywords":[],"body":"北角社區客廳今日（20日）舉行開幕典禮，政務司司長陳國基表示，北角社區客廳是今年第10間投入服務的社區客廳，體現「政、商、民」三方通力合作，為劏房戶開拓生活空間及提供支援。他指出，這間社區客廳的一大特色是小朋友較多，不少家長特別是母親都會每日到訪，場地為她們提供能喘息、交流及學習新技能的地方，也能促進街坊互動與社區凝聚。 \n佔地約2,400平方呎\n陳國基致辭時表示，東區是港島最多劏房的地區，繼去年3月筲箕灣社區客廳投入服務後，北角社區客廳開幕可進一步為區內有需要居民提供溫暖服務。他介紹，北角社區客廳實用面積約2,400平方呎，預計可服務270個劏房戶，全年服務人次約43,000人。會員可在場內煮食、用膳、獲取社區生活資訊及參與活動，認識不同年齡與背景的朋友，建立互助網絡。 \n他提到，營運機構團隊會主動走入社區接觸劏房戶，介紹及邀請他們使用設施；專業社工亦會識別高風險家庭，提供輔導、個案支援及轉介，及早介入有需要人士，避免潛在意外或生活困境。客廳亦提供維修工具、書本及運動器材等日常用品供居民共享。 \n讚現場充滿人情味\n他表示早前參觀了客廳設施，形容現場溫暖和諧、充滿人情味，見到兒童遊戲區有小朋友以社區環境為靈感製作小遊戲，客廳有家長縫製手作，備餐間亦有街坊與小朋友一同準備小食，氣氛熱鬧。他又留意到牆畫描繪北角特色店舖，反映居民對社區的歸屬感與熱愛。 \n太古提供場地聖雅各福群會營運\n陳國基致辭時提到，北角社區客廳的順利落成有賴政商民三方合作，特別感謝太古地產有限公司及太古集團慈善信託基金提供場地，他同時感謝營運機構聖雅各福群會全年無休服務社區，他續指，太古與聖雅各福群會早於2022年已在鰂魚涌合作打造社區休憩空間，今次北角項目是三方優勢互補、結合企業資源、社福專業與社區參與的延伸。 \n陳國基續稱，政府會繼續擔當「推動者」與「促成者」角色，透過政策引導及跨界別合作，鼓勵社區客廳善用空間與居民網絡，並連繫地區商戶及企業引入資源，讓居民由「受助者」成為「貢獻者」，令社區客廳紮根社區、持續發展及不斷優化服務。\n記者、攝影：蘇芷慧","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":46,"items":[{"id":"cbecedce0e1","title":"以影像为笺寄侨情 “泰国V姐”陈映玲为南洋侨史“留声”","url":"https://www.chinanews.com.cn/hr/2026/11-21/10735672.shtml","summary":"中新网海口11月21日电 题：以影像为笺寄侨情 “泰国V姐”陈映玲为南洋侨史“留声”  　　中新网记者 符宇群  　　“如果说当年一封封侨批，是先辈写给故土的家书；那么今天，我希望用镜头下真实的影像…","summary_short":"中新网海口11月21日电 题：以影像为笺寄侨情 “泰国V姐”陈映玲为南洋侨史“留声”  　　中新网记者 符宇群  　　“…","digest":"题：以影像为笺寄侨情 “泰国V姐”陈映玲为南洋侨史“留声”  　　中新网记者 符宇群…","points":["“如果说当年一封封侨批，是先辈写给故土的家书","那么今天，我希望用镜头下真实的影像，写下属于我们这一代人的回信","”20日，在2026年侨海(客家)青年发展大会现场，短视频创作者“泰国V姐”…"],"section":"內地","category":"內地","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T11:27:56+08:00","size":1,"keywords":[],"body":"中新网海口11月21日电 题：以影像为笺寄侨情 “泰国V姐”陈映玲为南洋侨史“留声”\n\n　　中新网记者 符宇群\n\n　　“如果说当年一封封侨批，是先辈写给故土的家书；那么今天，我希望用镜头下真实的影像，写下属于我们这一代人的回信。”20日，在2026年侨海(客家)青年发展大会现场，短视频创作者“泰国V姐”、潮语电影《给阿嬷的情书》参演者陈映玲一席发言，打动在场不少侨界青年。\n\n11月20日，短视频创作者、电影《给阿嬷的情书》参演者陈映玲在海口分享发言。中新网记者 骆云飞 摄\n\n　　祖籍广东汕头、长期扎根泰国的陈映玲，三年多来扛着镜头奔走东南亚，寻访海外华侨，打捞封存于时光里的侨史记忆。\n\n　　陈映玲的镜头里，藏着侨批纸页间一字一泪的牵挂、耄耋华侨跨越半生的故土念想，也记录着南洋潮、琼、客家乡亲相融共生的脉脉温情。\n\n　　寻访路上，许多老一辈侨胞的讲述令陈映玲动容。\n\n　　“一封侨批就是一个故事，无数生动和真实的缩影凑在一起，就是一幅五彩斑斓的侨史画卷。”两年前，汕头市档案馆侨批分馆(侨批文物馆)名誉馆长林庆熙的话刻在了陈映玲的脑海里。\n\n　　陈映玲说，90多岁的泰国中华总商会名誉主席陈绍扬当年在泰国开侨批局，和她说起等候侨批的往事，那句“帮人读批的时候，真的是一字一泪”，让她读懂薄薄侨批背后海外游子沉甸甸的乡愁。\n\n　　一位80多岁的泰国第二代华裔，潮汕话自小听长辈口述习得，中文是在日本工作期间对照英文注解、靠着字典自学而成。得知陈映玲前来采访，老人特意早早休息养足精神，和她
