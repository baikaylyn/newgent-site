8955/網易上季經調整純利跌4-派息增3-指遊戲產品全球吸引力提升","summary":"網易（9999）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%。","summary_short":"網易（9999）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%。","digest":"網易第三季非公認會計準則純利91.64億元，按年下跌3.6%","points":["網易（9999）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%","淨收入為278.5億元，少1.8%","網易派第三季息每股0.117美元，按年增長2.6%"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:32:18+08:00","size":1,"keywords":[],"body":"網易（9999）第三季非公認會計準則純利91.64億元（人民幣，下同），按年下跌3.6%。淨收入為278.5億元，少1.8%。網易派第三季息每股0.117美元，按年增長2.6%。\n網易：經營經得起時間考驗遊戲\n網易首席執行官丁磊表示，一如既往製作精品遊戲內容，並為經典遊戲不斷注入新內容與新玩法，以吸引更廣泛的玩家群體；同時籌備多品類、多平台、多市場的在研新品。他稱，將持續聚焦於將創意、技術革新與高效執行相結合，經營經得起時間考驗的遊戲產品，並鞏固研發與長線營運能力。\n《燕雲十六聲》全球用戶破一億\n該集團表示，其遊戲產品進一步提升全球市場的吸引力，例如《漫威爭鋒》推出新特性和新內容 ，深化與全球玩家的聯結；《燕雲十六聲》 全球用戶於8月突破1億名，彰顯其面向全球市場的遊戲研發與長線營運能力不斷增強。網易又指，新作《無限大》計劃於2027年1月15日在全球多平台上線，目前預約量已突破2700萬份。\n遊戲收入按季少8%\n以業務收入劃分，遊戲及相關增值服務淨收入為229億元，按年減少1.7%，按季亦跌8.4%，主要由於自研遊戲淨收入下降。有道淨收入14億元，減少12.3%，因其智能硬件和在線營銷服務淨收入下降。而網易雲音樂（9899）淨收入19億元，降低0.9%。創新及其他業務淨收入則為15億元，按年增加7.1%。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c579d07dc68","title":"从一槽铝水到一池微藻 邹平铝业构建绿色低碳闭环","url":"https://www.chinanews.com.cn/cj/2026/11-19/10734753.shtml","summary":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电；一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……","summary_short":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板…","digest":"一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电…","points":["中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板","一辆V80轻量化车型每百公里少耗1度电","一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……在山东邹平…"],"section":"財經","category":"財經","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:29:46+08:00","size":1,"keywords":[],"body":"中新网山东邹平11月19日电 (记者 梁犇)一块铝板经过几道工序很快即可成为车门外板；一辆V80轻量化车型每百公里少耗1度电；一辆报废车的车身铝材可以在产线上重新变成铝水、铝锭……在山东邹平，起步于2001年的高端铝产业集群，正推动绿色低碳理念贯穿产业发展全链条。\n\n在山东省邹平市魏桥轻量化基地，工人正在焊接铝制车身。梁犇 摄\n\n　　“铝水不落地”，从源头削减碳排放\n\n　　邹平铝产业从2001年起步，经过20多年的发展，已形成氧化铝精炼、电解铝冶炼、合金化、铝材加工、零部件深加工、废铝回收再生、赤泥综合利用等完整产业链条。2025年，邹平高端铝产业集群实现营收2650亿元(人民币，下同)。\n\n　　走进魏桥轻量化基地，作为整车研发制造中枢的山东宏衍汽车有限公司，其全铝白车身项目于2024年8月立项，2025年顺利投产。该项目与宏畅轻合金项目一同被邹平经济技术开发区列为“突破关键技术瓶颈、填补国内相关领域空白”的重大项目。\n\n　　项目依托“铝水不落地”生产模式，上游联动宏畅轻合金年产20万吨特种轻合金材料项目，电解槽产出的铝水不经铸锭、不入仓库，直接送进熔保炉加工。表面看起来，仅是省了一道工序，但实际减掉的是二次熔炼的能耗、金属烧损和随之而来的碳排放。\n\n　　轻量化造车，每百公里节省1度电\n\n　　目前，魏桥轻量化基地布局宏畅、宏奥、宏衍、宏和、宏钧五大项目，形成集材料研发、型材加工、压铸成型、车身总成于一体的产业格局。\n\n　　山东宏奥汽车轻量化科技有限公司总经理贾正宇介绍说，2025年11月，魏桥新能源商用车第二代高端铝VAN车型V80正式上市，采用全球领先的铝基轻量化技术，在保证安全性和承载性的前提下，整车减重10%-20%，比同级别、同尺寸车型降重150kg-300kg，实现每百公里节电1度，有效降低整车能耗与运输成本。\n\n　　V80车间占地2.5万平方米，共规划3条生产线。全线配置高精度柔性机器人，整体自动化率超过70%，综合运用CMT焊接、激光焊接等连接技术，其中冷连接工艺占比达70%，有效控制热变形、保障车身尺寸精度，实现“零烟气、零飞溅、零强光”绿色生产。\n\n　　“车铝循环”，报废车辆实现铝料重生\n\n　　车辆有使用年限，但铝材可以循环不息。在中德宏顺循环科技产业园，一辆报废的机动车经过精细化拆解，车体铝料可转化为高品质铝水、铝锭，重新回到铝产业供应链。\n\n　　该产业园由中国宏桥集团与德国顺尔茨集团携手打造，由山东宏顺循环科技有限公司运营，总投资15亿元，占地500余亩，聚焦报废机动车回收拆解、再生铝生产、动力电池再生利用三大核心业务。\n\n　　山东宏顺循环科技有限公司总经理徐庆告诉记者，中德宏顺循环科技产业园引进国际先进生产工艺与智能装备，依托报废机动车精细拆解、自动化金属破碎分拣、再生铝除杂不降级三大核心技术，持续推进产业数字化、智能化升级。\n\n　　数据显示，生产1吨再生铝，能耗仅为原铝生产的5%，可节约3.4吨标准煤、节水14立方米、减少固体废物排放20吨，整体实现节能95%、碳减排85%以上。\n\n图为邹平市魏桥国科微藻高值化开发基地。梁犇 摄\n\n　　排放口变原料口，微藻固碳开辟减碳新路径\n\n　　一边是金属循环，一边是生物固碳。魏桥国科微藻高值化开发基地将电厂烟气中的二氧化碳转化为微藻生长的“养料”。微藻光合效率远超陆生植物，基地探索“二氧化碳生物减排+生态固碳”路径，构建“碳捕集-生物转化-资源高值利用”一体化模式。\n\n　　基地不仅“养藻”，还搭建微藻高附加值产品全流程研发、中试与产业化示范平台：先小试跑通工艺，再中试核算成本。这套攻关模式，依托魏桥国科强大的科创支撑。2019年，魏桥创业集团联合中国科学院大学、中信信托共建魏桥国科(滨州)研究院，开创了科学家、实业家、金融家“握指成拳、深度合作”的新模式。\n\n　　重工业排出的二氧化碳，滋养微藻；以微藻为原料，又延伸出多元产业链。基地把工业排放端和微藻生产端串联起来，填补电厂二氧化碳捕集和微藻高附加值产品开发领域空白，打通基础研究到产业化的技术链路，助力农业、食品、医药产业转型升级。\n\n　　目前，邹平市拥有氧化铝产能400万吨，电解铝产能218.1万吨，再生铝产能201万吨，精细氧化铝产能84.55万吨，铝精深加工能力600万吨。2026年1月至10月份，该市高端铝产业集群实现营收2300亿元，中高端铝制品占比达到79%。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"caf746e0ba2","title":"美军中央司令部司令访以商讨地区局势","url":"https://www.jiemian.com/article/15351659.html","summary":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列，与以军总参谋长扎米尔及以色列情报与特勤局（摩萨德）局长罗曼·戈夫曼在特拉维夫举行会谈。","summary_short":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","digest":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","points":["当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列…","双方讨论了地区局势发展与共同面临的安全挑战，并强调了深化两国军队间作战合作…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:24:35+08:00","size":1,"keywords":[],"body":"当地时间11月18日，正在中东地区访问的美军中央司令部司令库珀当天应邀抵达以色列，与以军总参谋长扎米尔及以色列情报与特勤局（摩萨德）局长罗曼·戈夫曼在特拉维夫举行会谈。双方讨论了地区局势发展与共同面临的安全挑战，并强调了深化两国军队间作战合作、加强协调以及提升联合战备状态以应对各类局势的重要性。（央视新闻）","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c8d96c45f13","title":"PC出货大跌两成，但头部厂商反而越赚越多","url":"https://www.jiemian.com/article/15351589.html","summary":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。","summary_short":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。","digest":"文｜道总有理  前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI…","points":["前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI…","杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题","一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:17:19+08:00","size":1,"keywords":[],"body":"文｜道总有理\n\n前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题。\n\n李彦宏的想法其实很符合逻辑，AI目前使用的最佳场景是PC而不是手机。那必然会对PC有一定的带动作用。\n\n但事实上，答案可能非常反直觉。\n\nIDC最新公布的数据显示，2026年第三季度，全球PC出货量为6270万台，同比下降20.1%。联想、惠普、戴尔、苹果、华硕，排名前五的厂商无一增长。联想出货量同比下滑22.6%，惠普同比下滑30.9%，包括苹果，Mac的出货量都跌了11.3%。\n\n被各路大佬频繁提及的“AI带动PC出货论”在一组组惨淡的数据面前显得格外无力。\n\n但更反直觉的是，尽管AI没有真的带动PC出货量，几大头部厂商的财报业绩却可圈可点。\n\n以联想为例，2025/26财年第三财季业绩：集团营收1575亿元人民币，同比增长18%；净利润同比增长36%，利润增速达到营收增速的两倍。\n\n苹果Mac收入107.9亿美元，同比增长23.7%；戴尔年内股价至高点累计涨幅一度高达259%。\n\nAI带不动PC出货量，却带动了厂商的“钱包”，头部厂商还要不要继续纠结出货数字是个问题。但问题背后更值得探讨的是，PC这门大众硬件生意的逻辑，是不是已经悄悄变了。\n\nAI到底带来多大利润？\n\n销量下降，厂商为什么还能赚钱？\n\n一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨。\n\n戴尔首席运营官Jeff Clarke在5月业绩会上形容，调价频繁到“感觉每天都在重新定价”。今年以来，联想、惠普、戴尔、华硕、宏碁等PC厂商均已多次调价，部分机型涨幅在15%到30%之间。\n\nIDC预计，2026年全球PC平均售价将上涨20%。\n\n高定价带来的利润自然会更高。例如，苹果继续上调多款Mac和iPad的售价，其中512GB版MacBook Air从1099美元涨至1299美元。Mac在截至6月的季度里收入103.5亿美元，涨了29%。\n\n当然，涨价不是PC厂商赚钱的根本原因，毕竟涨价也压制了消费级市场的出货意愿。归根结底，真正托举起头部厂商财报业绩的还是AI，一端是AI基础设施业务，另一端是单价数万元的高端AI PC。\n\n以戴尔为例，2027财年第二财季报告，戴尔营收469.71亿美元，同比增长58%，其中，AI服务器业务表现突出，订单金额达到609亿美元，确认收入达到164亿美元，已经超过整个PC相关业务的收入。\n\n无独有偶，截至6月底的季度，联想ISG业务（包括传统服务器、AI服务器和存储）收入同比增长98%，营业利润达到7.77亿美元。AI服务器项目储备540亿美元，一个季度涨了157%。\n\n而从2024年就火起来的AI PC在消费端承接了产品结构升级的使命。\n\n早在2024年第三季度，Canalys发布的数据就曾显示，当年全球AI PC出货量达到1330万台，占当季度PC总出货量的20%。此后，随着AI时代加速发展，头部厂商不断增加AI PC产品占比。\n\n以联想为例，数据显示，联想的AI PC产品类型，从24/25年第一财季的17款增加到第二财季的28款。到2026年，在IFA 2026期间，联想面向消费端和商务侧再度发布了多款AI PC新品。\n\n不止联想。\n\n根据《华尔街日报》报道，各家厂商都希望通过提高AI PC的产品占比，即增加能够在终端本地进行AI运算的PC产品，来减轻PC市场整体萎缩带来的影响。华硕ProArt P16、戴尔XPS 16 Creator Edition、惠普OmniBook Ultra 16、微星Prestige N16 Flip AI+也都开启了预定。\n\n如果说2024 年普及的初代AI PC，更多是“传统 PC”的营销话术，功能以轻量本地推理、语音转写、文案润色为主，消费者感知弱，溢价空间有限，并没有真正打破PC行业的盈利天花板。\n\n到2026年，英伟达入局PC领域，AI PC 进一步向超高端、Agent化方向的跃迁，定价逻辑也就脱离了消费电子的框架，例如，微软的SurfaceLaptop Ultra裸机顶配版本价格接近5万元；联想AI PC（YOGA Pro 15 RTX Spark高配版）标价42999元。\n\n这无疑是厂商盈利的最大依仗之一。\n\n同时，尽管大盘出货量在下降，但消费者很乐意为AI PC买单。\n\n联想YOGA Pro 15 RTX Spark高配版半小时售罄。至10月18日晚，京东仍然显示“无货”在闲鱼二手交易平台上，更有卖家将高配版挂出了50000元的价格，比官方建议零售价高出约7000元。\n\n那么，AI PC到底能为厂商赚多少钱？\n\n还是以联想为例，按照摩根士丹利的口径，联想普通PC的全球均价约为800美元（折合人民币约5400元），常规PC毛利率约为15.5%，而RTXSpark这类超高端AI工作站机型的毛利率可达22%左右。\n\n反映到营收与利润上：\n\n“经济杂志”记者测算，假设联想YOGAPro15出货量为200万台（约占联想PC年出货的3%），为IDG带来约752亿元增量收入、172亿元增量毛利，单机增量毛利率约23%，推升IDG毛利率约0.9至1.3个百分点、运营利润率约0.8至1.3个百分点。\n\n这组数据值得玩味的地方在于：仅占出货量3%的超高端机型，就能撬动一个头部厂商PC业务近1个百分点的利润率。这笔商业账算得越精准，那个以“出货量论英雄”的PC黄金时代，就越显得恍如隔世。\n\n悬而未决的英伟达“变数”\n\n就目前来看，各大机构十分看好AI PC。\n\nOmdia发布报告显示，预计2027年AI PC将占全球PC出货量的60%，到2030年进一步提升至79%。高盛则预计2026年AI PC出货量将达到1.5亿台，同比增长39%，占全部PC的59%，到2028年出货量将近2亿台，市场渗透率82%。\n\n消费市场上首发售罄、二手加价的盛况似乎更助推了AI PC加速取代传统PC的趋势。\n\n然而，会为AI功能更换电脑的人有多少呢？\n\n根据Omdia的调查，69%的PC办公用户愿意为本地AI处理能力支付更高价格，但只有9%的用户会因为AI功能更换电脑。更重要的是，头豹研究院2025年调研数据显示，AI PC的核心硬件NPU，在许多主流的软件中并未得到有效调用。\n\n这意味着用户在支付了硬件溢价后，并未获得一定的AI体验提升。\n\n2026年6月，英伟达宣布推出RTX Spark，正式入局PC芯片，一举引起PC厂商狂欢。微软、戴尔、惠普、华硕、联想、微星将相继推出搭载这款芯片的全新Windows 整机。例如，联想YOGA Pro 15 RTX Spark、华硕ProArt创16。\n\n新一代AI PC比之从前有进益了吗？\n\n从当前各大科技博主的测评来看，RTX Spark笔记本在GPU性能、本地大模型推理、大容量统一内存方面具备显著优势，尤其适配需本地运行大模型的开发者与创作者群体。但实测也暴露了诸多问题：\n\nWindows on Arm架构的软件兼容性存在短板，部分游戏与专业应用表现欠佳。\n\n高负载场景下的续航、发热及风扇噪声表现均不尽如人意。另外，英伟达重点宣传的本地Agent体验不佳，使用Hermes Agent和本地Qwen模型生成新闻简报，耗时约10分钟，消耗了10%的电量，最终效果不如云端Claude。\n\n诚然，体验层面的短板并非不可修复的硬伤，跟着以后的技术迭代大概率会逐步补齐。\n\n需要担心的是，在几款RTX Spark笔记本发布不久后，英伟达就迎来了黄仁勋“风波”。\n\n黄仁勋是英伟达杀入PC市场的核心操盘手，RTX Spark从架构定义、生态合作到落地节奏，全程由他亲自推动。TrendForce预估，RTX Spark相关产品2026年出货量约在20万台以内；随着生态系统成熟，2027年有望放大到100万台。\n\n时至今日，黄仁勋退场，海内外多家媒体开始担忧：未来，英伟达是否还会继续加码消费级项目？\n\n其中，RTX Spark的命运已经引起了数家媒体预测。例如，Omdia的PC分析师Kieren Jessop直言：短期内消费者不会感受到太多变化，但未来两三年值得警惕。\n\n毕竟消费级业务的商业回报远远不及AI数据中心，还需要持续投入。\n\n11月18日，英伟达公布了2027财年第三财季（截至2026年10月25日）的财报，收入为1158亿美元，同比增长103%，环比增长20%；净利润为653亿美元，同比增长105%，环比增长9%。\n\n搭载RTX Spark的联想新一代AI PC已开始出货，英伟达将这项进展列入边缘计算业务。\n\n本季度，该业务实现营收82亿美元。对比之下，数据中心业务收入达到了创纪录的1076亿美元，首次突破千亿美元，收入占比达到约93%，同比增长110%，环比增长21%。\n\n临时接任CEO的克雷斯出身CFO，英伟达往后的每一笔投入、营收只怕都会算得更严苛。\n\nPC厂商们的心境在此刻变得格外讽刺。\n\n这大抵就是PC行业逃不开的宿命：几十年来，从未真正掌握自己的叙事权。早年靠英特尔的摩尔定律推着迭代，后来靠微软的系统升级拉动换机，如今撞上AI浪潮，依旧要仰仗芯片巨头的战略倾斜才能分到增长红利。\n\n陷在存量困局的PC行业，随着一个人的离去，又要迷茫了。\n\n这也说明了PC行业一个残酷现实：当叙事权握在别人手里，增长的想象空间随时都可能会收缩。如今，AI带来的增量红利正变得不确定，那么降本就成了PC厂商更可控的抓手，而一场围绕产能的辗转腾挪其实早已开始。\n\n产能回迁的“零和博弈”\n\n未来，消费者会为什么样的电脑买单？\n\nCounterpoint高级分析师指出，AI电脑、高端显示器和差异化产品仍有机会，但最终胜出的企业必须同时具备创新能力、有竞争力的价格、严格的供应链管理，以及对消费者和企业具有吸引力的产品价值，四项全能，缺一不可。\n\n其中，价格、供应链管理在这个PC物料成本、终端售价越来越高的时代显得尤其重要。2025年第一季度，CPU、DRAM和SSD三大核心部件占整机物料成本的45%；到2026年第三季度，占比已经达到68%。\n\n当前各大PC厂商似乎只剩下了两个主要任务：省钱、赚钱。\n\n这也导致全球PC厂商的生产线即将发生新的变化。曾经，我国是全球电子行业最大的代工生产地区之一，也诞生了台系的富士康、广达电脑、仁宝电脑‌、‌和硕联合，大陆系的华勤技术、立讯精密等头部企业。\n\n后来，由于国内代工成本上升，PC厂商开始将生产线往更廉价的泰国、越南迁移。据悉，惠普甚至计划将最多七成产能迁出我国。\n\n如今，随着PC物料成本水涨船高，泰越基地配套不足的问题被放大，物流周期和库存成本叠加进来，原本低劳动力成本的优势被一点点吞噬。TrendForce指出，PC厂商正在重新评估新兴生产基地的物流、采购和供应链管理成本。\n\n反观我国，有成熟的制造业人才、较低的生产成本以及完整的电子产业链。\n\n10月28日，《日经亚洲》援引消息称，包括惠普、华硕、宏碁在内的全球PC厂商正将部分生产线从泰国和越南迁回我国，重新启用我国代工厂来应对不断飙升的零部件成本，并提高生产效率。\n\n从订单上来看，确实如此。\n\n根据DIGITIMES报道，华勤技术将在2027年为惠普代工一款消费级笔记本，这是其承接的第七个惠普笔电项目；立讯精密则拿下了戴尔高端轻薄本XPS13的代工订单，并计划于2027年进入惠普游戏本供应链。\n\nPC厂商在寒冬中决定到我国产业集群的怀抱，这是不争的事实。TrendForce的数据显示：2025年，全球约24%的笔记本电脑在我国境外生产。2026年这一比例预计下降至21%，2027年甚至可能跌破20%。\n\n但这真的是一笔稳赚不赔的“回头账”吗？\n\n值得一提的是，由于台系代工巨头跟PC厂商一样，把大部分产能分给了AI服务器，此轮回迁，承接回流产能的主力，不再是传统台系代工厂，而是立讯精密、华勤技术等大陆厂商。\n\n据悉，华勤在2026年半年报业绩说明会上预计全年笔记本出货量达2000万台，上半年笔记本营收同比增长超过50%，出货规模已直逼中国台湾第二大笔电代工厂仁宝。\n\n新一轮产能回迁，或许会加速PC核心零部件的国产替代进程。\n\n7月份，联想笔记本首次预装长江存储SSD登陆美国市场；同时，据《日经亚洲》报道，惠普已开始对长鑫存储的DRAM产品进行认证；戴尔同样开始对长鑫存储的DRAM产品进行认证；凤凰网科技引外媒消息报道，苹果公司正与长江存储和长鑫存储谈判。\n\n这意味着国产存储器供应链正式打入主流国际PC终端。\n\n另一方面，国际PC厂商向国内产业集群要效率、降成本的同时，其实也是在为本土竞争对手增加崛起的动力：因为成熟的代工体系、完善的零部件供应链、规模化的制造能力，最终并非只服务于国际品牌，同样也会服务于正在快速崛起的本土品牌。\n\n这是一场互利共生，也注定是此消彼长的博弈。\n\n总而言之，从以出货量论英雄的黄金时代，到靠高端溢价与AI业务托举利润的存量周期，PC行业最终花了十几年完成了一场价值转向，旧的增长逻辑已经失效，而新故事、新格局，正在巨头们的精心算计中悄然酝酿。\n\n本文为转载内容，授权事宜请联系原著作权人。\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\nPC出货大跌两成，但头部厂商反而越赚越多\n\nAI带不动 PC出货，却撑住了厂商的利润？\n\n道总有理 · 2026/11/19 17:17\n\n文｜道总有理\n\n前段时间的百度世界大会上，李彦宏问了到场的杨元庆一个问题：因为AI，联想PC的销量和使用率是不是变高了。杨元庆模棱两可地嗯了一声，然后迅速绕过了这个话题。\n\n李彦宏的想法其实很符合逻辑，AI目前使用的最佳场景是PC而不是手机。那必然会对PC有一定的带动作用。\n\n但事实上，答案可能非常反直觉。\n\nIDC最新公布的数据显示，2026年第三季度，全球PC出货量为6270万台，同比下降20.1%。联想、惠普、戴尔、苹果、华硕，排名前五的厂商无一增长。联想出货量同比下滑22.6%，惠普同比下滑30.9%，包括苹果，Mac的出货量都跌了11.3%。\n\n被各路大佬频繁提及的“AI带动PC出货论”在一组组惨淡的数据面前显得格外无力。\n\n但更反直觉的是，尽管AI没有真的带动PC出货量，几大头部厂商的财报业绩却可圈可点。\n\n以联想为例，2025/26财年第三财季业绩：集团营收1575亿元人民币，同比增长18%；净利润同比增长36%，利润增速达到营收增速的两倍。\n\n苹果Mac收入107.9亿美元，同比增长23.7%；戴尔年内股价至高点累计涨幅一度高达259%。\n\nAI带不动PC出货量，却带动了厂商的“钱包”，头部厂商还要不要继续纠结出货数字是个问题。但问题背后更值得探讨的是，PC这门大众硬件生意的逻辑，是不是已经悄悄变了。\n\nAI到底带来多大利润？\n\n销量下降，厂商为什么还能赚钱？\n\n一小部分原因是在内存涨价的压力下，全球PC平均售价都在上涨。\n\n戴尔首席运营官Jeff Clarke在5月业绩会上形容，调价频繁到“感觉每天都在重新定价”。今年以来，联想、惠普、戴尔、华硕、宏碁等PC厂商均已多次调价，部分机型涨幅在15%到30%之间。\n\nIDC预计，2026年全球PC平均售价将上涨20%。\n\n高定价带来的利润自然会更高。例如，苹果继续上调多款Mac和iPad的售价，其中512GB版MacBook Air从1099美元涨至1299美元。Mac在截至6月的季度里收入103.5亿美元，涨了29%。\n\n当然，涨价不是PC厂商赚钱的根本原因，毕竟涨价也压制了消费级市场的出货意愿。归根结底，真正托举起头部厂商财报业绩的还是AI，一端是AI基础设施业务，另一端是单价数万元的高端AI PC。\n\n以戴尔为例，2027财年第二财季报告，戴尔营收469.71亿美元，同比增长58%，其中，AI服务器业务表现突出，订单金额达到609亿美元，确认收入达到164亿美元，已经超过整个PC相关业务的收入。\n\n无独有偶，截至6月底的季度，联想ISG业务（包括传统服务器、AI服务器和存储）收入同比增长98%，营业利润达到7.77亿美元。AI服务器项目储备540亿美元，一个季度涨了157%。\n\n而从2024年就火起来的AI PC在消费端承接了产品结构升级的使命。\n\n早在2024年第三季度，Canalys发布的数据就曾显示，当年全球AI PC出货量达到1330万台，占当季度PC总出货量的20%。此后，随着AI时代加速发展，头部厂商不断增加AI PC产品占比。\n\n以联想为例，数据显示，联想的AI PC产品类型，从24/25年第一财季的17款增加到第二财季的28款。到2026年，在IFA 2026期间，联想面向消费端和商务侧再度发布了多款AI PC新品。\n\n不止联想。\n\n根据《华尔街日报》报道，各家厂商都希望通过提高AI PC的产品占比，即增加能够在终端本地进行AI运算的PC产品，来减轻PC市场整体萎缩带来的影响。华硕ProArt P16、戴尔XPS 16 Creator Edition、惠普OmniBook Ultra 16、微星Prestige N16 Flip AI+也都开启了预定。\n\n如果说2024 年普及的初代AI PC，更多是“传统 PC”的营销话术，功能以轻量本地推理、语音转写、文案润色为主，消费者感知弱，溢价空间有限，并没有真正打破PC行业的盈利天花板。\n\n到2026年，英伟达入局PC领域，AI PC 进一步向超高端、Agent化方向的跃迁，定价逻辑也就脱离了消费电子的框架，例如，微软的SurfaceLaptop Ultra裸机顶配版本价格接近5万元；联想AI PC（YOGA Pro 15 RTX Spark高配版）标价42999元。\n\n这无疑是厂商盈利的最大依仗之一。\n\n同时，尽管大盘出货量在下降，但消费者很乐意为AI PC买单。\n\n联想YOGA Pro 15 RTX Spark高配版半小时售罄。至10月18日晚，京东仍然显示“无货”在闲鱼二手交易平台上，更有卖家将高配版挂出了50000元的价格，比官方建议零售价高出约7000元。\n\n那么，AI PC到底能为厂商赚多少钱？\n\n还是以联想为例，按照摩根士丹利的口径，联想普通PC的全球均价约为800美元（折合人民币约5400元），常规PC毛利率约为15.5%，而RTXSpark这类超高端AI工作站机型的毛利率可达22%左右。\n\n反映到营收与利润上：\n\n“经济杂志”记者测算，假设联想YOGAPro15出货量为200万台（约占联想PC年出货的3%），为IDG带来约752亿元增量收入、172亿元增量毛利，单机增量毛利率约23%，推升IDG毛利率约0.9至1.3个百分点、运营利润率约0.8至1.3个百分点。\n\n这组数据值得玩味的地方在于：仅占出货量3%的超高端机型，就能撬动一个头部厂商PC业务近1个百分点的利润率。这笔商业账算得越精准，那个以“出货量论英雄”的PC黄金时代，就越显得恍如隔世。\n\n悬而未决的英伟达“变数”\n\n就目前来看，各大机构十分看好AI PC。\n\nOmdia发布报告显示，预计2027年AI PC将占全球PC出货量的60%，到2030年进一步提升至79%。高盛则预计2026年AI PC出货量将达到1.5亿台，同比增长39%，占全部PC的59%，到2028年出货量将近2亿台，市场渗透率82%。\n\n消费市场上首发售罄、二手加价的盛况似乎更助推了AI PC加速取代传统PC的趋势。\n\n然而，会为AI功能更换电脑的人有多少呢？\n\n根据Omdia的调查，69%的PC办公用户愿意为本地AI处理能力支付更高价格，但只有9%的用户会因为AI功能更换电脑。更重要的是，头豹研究院2025年调研数据显示，AI PC的核心硬件NPU，在许多主流的软件中并未得到有效调用。\n\n这意味着用户在支付了硬件溢价后，并未获得一定的AI体验提升。\n\n2026年6月，英伟达宣布推出RTX Spark，正式入局PC芯片，一举引起PC厂商狂欢。微软、戴尔、惠普、华硕、联想、微星将相继推出搭载这款芯片的全新Windows 整机。例如，联想YOGA Pro 15 RTX Spark、华硕ProArt创16。\n\n新一代AI PC比之从前有进益了吗？\n\n从当前各大科技博主的测评来看，RTX Spark笔记本在GPU性能、本地大模型推理、大容量统一内存方面具备显著优势，尤其适配需本地运行大模型的开发者与创作者群体。但实测也暴露了诸多问题：\n\nWindows on Arm架构的软件兼容性存在短板，部分游戏与专业应用表现欠佳。\n\n高负载场景下的续航、发热及风扇噪声表现均不尽如人意。另外，英伟达重点宣传的本地Agent体验不佳，使用Hermes Agent和本地Qwen模型生成新闻简报，耗时约10分钟，消耗了10%的电量，最终效果不如云端Claude。\n\n诚然，体验层面的短板并非不可修复的硬伤，跟着以后的技术迭代大概率会逐步补齐。\n\n需要担心的是，在几款RTX Spark笔记本发布不久后，英伟达就迎来了黄仁勋“风波”。\n\n黄仁勋是英伟达杀入PC市场的核心操盘手，RTX Spark从架构定义、生态合作到落地节奏，全程由他亲自推动。TrendForce预估，RTX Spark相关产品2026年出货量约在20万台以内；随着生态系统成熟，2027年有望放大到100万台。\n\n时至今日，黄仁勋退场，海内外多家媒体开始担忧：未来，英伟达是否还会继续加码消费级项目？\n\n其中，RTX Spark的命运已经引起了数家媒体预测。例如，Omdia的PC分析师Kieren Jessop直言：短期内消费者不会感受到太多变化，但未来两三年值得警惕。\n\n毕竟消费级业务的商业回报远远不及AI数据中心，还需要持续投入。\n\n11月18日，英伟达公布了2027财年第三财季（截至2026年10月25日）的财报，收入为1158亿美元，同比增长103%，环比增长20%；净利润为653亿美元，同比增长105%，环比增长9%。\n\n搭载RTX Spark的联想新一代AI PC已开始出货，英伟达将这项进展列入边缘计算业务。\n\n本季度，该业务实现营收82亿美元。对比之下，数据中心业务收入达到了创纪录的1076亿美元，首次突破千亿美元，收入占比达到约93%，同比增长110%，环比增长21%。\n\n临时接任CEO的克雷斯出身CFO，英伟达往后的每一笔投入、营收只怕都会算得更严苛。\n\nPC厂商们的心境在此刻变得格外讽刺。\n\n这大抵就是PC行业逃不开的宿命：几十年来，从未真正掌握自己的叙事权。早年靠英特尔的摩尔定律推着迭代，后来靠微软的系统升级拉动换机，如今撞上AI浪潮，依旧要仰仗芯片巨头的战略倾斜才能分到增长红利。\n\n陷在存量困局的PC行业，随着一个人的离去，又要迷茫了。\n\n这也说明了PC行业一个残酷现实：当叙事权握在别人手里，增长的想象空间随时都可能会收缩。如今，AI带来的增量红利正变得不确定，那么降本就成了PC厂商更可控的抓手，而一场围绕产能的辗转腾挪其实早已开始。\n\n产能回迁的“零和博弈”\n\n未来，消费者会为什么样的电脑买单？\n\nCounterpoint高级分析师指出，AI电脑、高端显示器和差异化产品仍有机会，但最终胜出的企业必须同时具备创新能力、有竞争力的价格、严格的供应链管理，以及对消费者和企业具有吸引力的产品价值，四项全能，缺一不可。\n\n其中，价格、供应链管理在这个PC物料成本、终端售价越来越高的时代显得尤其重要。2025年第一季度，CPU、DRAM和SSD三大核心部件占整机物料成本的45%；到2026年第三季度，占比已经达到68%。\n\n当前各大PC厂商似乎只剩下了两个主要任务：省钱、赚钱。\n\n这也导致全球PC厂商的生产线即将发生新的变化。曾经，我国是全球电子行业最大的代工生产地区之一，也诞生了台系的富士康、广达电脑、仁宝电脑‌、‌和硕联合，大陆系的华勤技术、立讯精密等头部企业。\n\n后来，由于国内代工成本上升，PC厂商开始将生产线往更廉价的泰国、越南迁移。据悉，惠普甚至计划将最多七成产能迁出我国。\n\n如今，随着PC物料成本水涨船高，泰越基地配套不足的问题被放大，物流周期和库存成本叠加进来，原本低劳动力成本的优势被一点点吞噬。TrendForce指出，PC厂商正在重新评估新兴生产基地的物流、采购和供应链管理成本。\n\n反观我国，有成熟的制造业人才、较低的生产成本以及完整的电子产业链。\n\n10月28日，《日经亚洲》援引消息称，包括惠普、华硕、宏碁在内的全球PC厂商正将部分生产线从泰国和越南迁回我国，重新启用我国代工厂来应对不断飙升的零部件成本，并提高生产效率。\n\n从订单上来看，确实如此。\n\n根据DIGITIMES报道，华勤技术将在2027年为惠普代工一款消费级笔记本，这是其承接的第七个惠普笔电项目；立讯精密则拿下了戴尔高端轻薄本XPS13的代工订单，并计划于2027年进入惠普游戏本供应链。\n\nPC厂商在寒冬中决定到我国产业集群的怀抱，这是不争的事实。TrendForce的数据显示：2025年，全球约24%的笔记本电脑在我国境外生产。2026年这一比例预计下降至21%，2027年甚至可能跌破20%。\n\n但这真的是一笔稳赚不赔的“回头账”吗？\n\n值得一提的是，由于台系代工巨头跟PC厂商一样，把大部分产能分给了AI服务器，此轮回迁，承接回流产能的主力，不再是传统台系代工厂，而是立讯精密、华勤技术等大陆厂商。\n\n据悉，华勤在2026年半年报业绩说明会上预计全年笔记本出货量达2000万台，上半年笔记本营收同比增长超过50%，出货规模已直逼中国台湾第二大笔电代工厂仁宝。\n\n新一轮产能回迁，或许会加速PC核心零部件的国产替代进程。\n\n7月份，联想笔记本首次预装长江存储SSD登陆美国市场；同时，据《日经亚洲》报道，惠普已开始对长鑫存储的DRAM产品进行认证；戴尔同样开始对长鑫存储的DRAM产品进行认证；凤凰网科技引外媒消息报道，苹果公司正与长江存储和长鑫存储谈判。\n\n这意味着国产存储器供应链正式打入主流国际PC终端。\n\n另一方面，国际PC厂商向国内产业集群要效率、降成本的同时，其实也是在为本土竞争对手增加崛起的动力：因为成熟的代工体系、完善的零部件供应链、规模化的制造能力，最终并非只服务于国际品牌，同样也会服务于正在快速崛起的本土品牌。\n\n这是一场互利共生，也注定是此消彼长的博弈。\n\n总而言之，从以出货量论英雄的黄金时代，到靠高端溢价与AI业务托举利润的存量周期，PC行业最终花了十几年完成了一场价值转向，旧的增长逻辑已经失效，而新故事、新格局，正在巨头们的精心算计中悄然酝酿。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c41aaec27f5","title":"山頂施勳道雙號屋近2億沽 內地豪客每呎8.2萬承接","url":"https://www.stheadline.com/realtime-property/3638943/山頂施勳道雙號屋近2億沽-內地豪客每呎82萬承接","summary":"豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出，呎價約8.2萬元。","summary_short":"豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出，呎價約8.2萬元。","digest":"豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出…","points":["豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出…","新買家為內地客，鐘情維多利亞港煙花海景","近期香港一手樓市成交表現持續理想，據市場消息今年截至11月12日一手成交已錄約1.7萬宗…"],"section":"財經","category":"財經","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:17:15+08:00","size":1,"keywords":[],"body":"豪宅市場成交不絕於耳，市場消息指出，山頂施勳道一幢雙號屋，新近以近2億元售出，呎價約8.2萬元。據了解，新買家為內地客，鐘情維多利亞港煙花海景。 近期香港一手樓市成交表現持續理想，據市場消息今年截至11月12日一手成交已錄約1.7萬宗，豪宅物業更備受市場追捧，期內逾3,000萬元一手私宅成交量錄約1,008宗，較去年同期758宗上升約33%，反映市場對優質豪宅物業的殷切需求。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cecdf3da069","title":"西贝测试新店型“天边冰煮鲜羊”","url":"https://www.jiemian.com/article/15351585.html","summary":"界面新闻获悉，西贝旗下的“天边砂锅焖面”在呼和浩特的首店于11月19日原址变更为“天边冰煮鲜羊”并正式开业。","summary_short":"界面新闻获悉，西贝旗下的“天边砂锅焖面”在呼和浩特的首店于11月19日原址变更为“天边冰煮鲜羊”并正式开业。","digest":"西贝测试新店型“天边冰煮鲜羊”","points":["界面新闻获悉，西贝旗下的“天边砂锅焖面”在呼和浩特的首店于11月19日原址变更为“天边冰煮鲜…","对此西贝方面对界面新闻表示，该品牌不算一个完全独立的新品牌，主打的产品是冰煮鲜羊…","今年以来，西贝推出新的系列品牌“天边”，部分西贝餐厅改装成为另一个品牌“天边砂锅焖面”"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:14:40+08:00","size":1,"keywords":[],"body":"界面新闻获悉，西贝旗下的“天边砂锅焖面”在呼和浩特的首店于11月19日原址变更为“天边冰煮鲜羊”并正式开业。对此西贝方面对 com/article/15351476.html","summary":"韩国大法院11月19日对前国务总理韩德洙涉嫌在2024年12月3日紧急戒严事件中参与内乱重要任务一案作出终审判决，判定他在宣布紧急戒严之前建议尹锡悦召开国务会议，“难以视为参与叛乱”…","summary_short":"韩国大法院11月19日对前国务总理韩德洙涉嫌在2024年12月3日紧急戒严事件中参与内乱重要任务一案作出终审判决…","digest":"韩国大法院11月19日对前国务总理韩德洙涉嫌在2024年12月3日紧急戒严事件中参与…","points":["韩国大法院11月19日对前国务总理韩德洙涉嫌在2024年12月3日紧急戒严事件中参与内乱重要…","据央视新闻报道，韩德洙被控在前总统尹锡悦等人实施内乱的过程中承担重要任务…","在宣布紧急戒严后，要求国务委员在相关文件上签名"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:08:18+08:00","size":1,"keywords":[],"body":"韩国大法院11月19日对前国务总理韩德洙涉嫌在2024年12月3日紧急戒严事件中参与内乱重要任务一案作出终审判决，判定他在宣布紧急戒严之前建议尹锡悦召开国务会议，“难以视为参与叛乱”，返回二审法院重审。\n\n据央视新闻报道，韩德洙被控在前总统尹锡悦等人实施内乱的过程中承担重要任务，包括建议尹锡悦召开国务会议，以制造“紧急戒严令”经国务委员审议通过的表象；在宣布紧急戒严后，要求国务委员在相关文件上签名；与时任行政安全部长官研讨封锁主要国家机关、切断部分媒体机构水电供应等指令的执行方案；紧急戒严解除后，同前总统尹锡悦、前国防部长官金龙显在宣布戒严之后补制的戒严令文件上签字，并将其进行作废处理等。\n\n该案由特别检察组于2025年8月29日提起公诉，今年1月21日作出一审宣判，以参与内乱重要任务、制作虚假公文、违反《总统记录物管理法》等罪名，判处韩德洙有期徒刑23年并当庭被捕。今年5月7日，二审判决法院推翻一审部分判决，判处他有期徒刑15年。\n\n此次宣判距离韩德洙羁押期限届满仅剩一天。韩国大法院今年8月以“案件受到国民高度关注，且有必要从历史角度作出司法评价”为由，将韩德洙案及前行政安全部长官李祥敏案交由全员合议庭审理。\n\n大法院认为，韩德洙在‌戒严宣布后‌的核心行为行为构成参与内乱重要任务罪，包括研讨封锁国家机关、切断媒体水电供应的执行方案，戒严解除后在事后补制的戒严文件上签字并销毁相关材料，但他建议尹锡悦召开国务会议、制造戒严令经国务审议通过的表象的行为难以认定具有扰乱宪法秩序的目的”，不构成参与内乱。\n\n由于个体野心，以及历史结构性等问题，韩国政坛的政治斗争既非常激烈，又富有戏剧性。\n\n今年76岁的韩德洙长年供职于政府经济部门，曾经两度担任总理，早年因韩国地域对立政治环境，曾刻意隐藏出身背景。韩国媒体此前对他的评价是“极度务实”“工作作风沉稳理性”。\n\n韩德洙长期主导韩国经济政策，还推动韩美自贸协定谈判落地，曾针对低出生率推出外籍劳工引进计划，放宽企业雇佣限制。\n\n2024年12月3日深夜，时任总统尹锡悦以在野党裹挟国会、掣肘施政等原因宣布进行“紧急戒严”，但以失败告终，后遭国会弹劾下台。韩国随后举行提前大选，来自共同民主党的李在明当选。\n\n去年12月15日，特检组宣布起诉包括尹锡悦、韩德洙在内的政府和军方24人。尹锡悦及其同下属企图利用军队以紧急立法机构取代国会，最终垄断立法和司法权。\n\n调查报告指出，尹锡悦自2023年10月起着手为宣布紧急戒严做准备工作，包括军队改组、作战规划及与高级军事指挥官的多次接触。其团队还准备了锥子、铁锤等刑讯工具，企图对30多人动刑。\n\n警方还发现，尹锡悦和时任国防部长金龙显等人试图通过无人机事件诱使朝鲜进攻韩国，届时只要朝方开火，尹锡悦就能借“紧急戒严”镇压在野党、封锁国会。\n\n宣布戒严后，暗杀小组将立即行动，以执政党党首韩东勋等政界人士为刺杀对象，事后宣称这是朝鲜所为。但事后证明，朝鲜方面并没有如尹锡悦预期的那样做出极端反应。\n\n2025年8月，特检组以涉嫌协助内乱、制造虚假公文、损坏公共文件、作伪证等罪名对韩德洙提起公诉。检方在结案庭审时指出，韩德洙在紧急戒严当天没有制止尹锡悦实施戒严，反而参与其中并提供协助，给国家和国民造成重大损失。\n\n检方还指出，韩德洙涉嫌与尹锡悦等人合谋，在紧急戒严后补制戒严相关文件，企图赋予“紧急戒严”正当性；此外，韩德洙曾在宪法法院和国会称自己对戒严令文件毫不知情，特检组就此指控韩德洙涉嫌作伪证，因此请求法院予以从重处罚。\n\n至于内乱罪主犯，尹锡悦本人身负十余项指控，其他罪名还包括滥用职权、伪造公文。今年1月13日晚，检方要求法院判处尹锡悦死刑。\n\n11月19日当天早些时候，大法院还就尹锡悦的妻子金建希涉嫌操纵股价、违法接受民意调查以及与宗教团体有资金往来等“三大争议案”作出终审判决，判处她有期徒刑4年。\n\n未经正式授权严禁转载本文，侵权必究。寰球政事权力游戏\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n“参与内乱”罪名不完全成立，韩前总理韩德洙被发回二审重审\n\n今年76岁的韩德洙长年供职于政府经济部门，曾经两度担任总理，早年因韩国地域对立政治环境，曾刻意隐藏出身背景。\n\n原创新闻陈升龙 · 2026/11/19 17:08来源：界面新闻\n\n视觉中国\n\n韩国大法院11月19日对前国务总理韩德洙涉嫌在2024年12月3日紧急戒严事件中参与内乱重要任务一案作出终审判决，判定他在宣布紧急戒严之前建议尹锡悦召开国务会议，“难以视为参与叛乱”，返回二审法院重审。\n\n据央视新闻报道，韩德洙被控在前总统尹锡悦等人实施内乱的过程中承担重要任务，包括建议尹锡悦召开国务会议，以制造“紧急戒严令”经国务委员审议通过的表象；在宣布紧急戒严后，要求国务委员在相关文件上签名；与时任行政安全部长官研讨封锁主要国家机关、切断部分媒体机构水电供应等指令的执行方案；紧急戒严解除后，同前总统尹锡悦、前国防部长官金龙显在宣布戒严之后补制的戒严令文件上签字，并将其进行作废处理等。\n\n该案由特别检察组于2025年8月29日提起公诉，今年1月21日作出一审宣判，以参与内乱重要任务、制作虚假公文、违反《总统记录物管理法》等罪名，判处韩德洙有期徒刑23年并当庭被捕。今年5月7日，二审判决法院推翻一审部分判决，判处他有期徒刑15年。\n\n此次宣判距离韩德洙羁押期限届满仅剩一天。韩国大法院今年8月以“案件受到国民高度关注，且有必要从历史角度作出司法评价”为由，将韩德洙案及前行政安全部长官李祥敏案交由全员合议庭审理。\n\n大法院认为，韩德洙在‌戒严宣布后‌的核心行为行为构成参与内乱重要任务罪，包括研讨封锁国家机关、切断媒体水电供应的执行方案，戒严解除后在事后补制的戒严文件上签字并销毁相关材料，但他建议尹锡悦召开国务会议、制造戒严令经国务审议通过的表象的行为难以认定具有扰乱宪法秩序的目的”，不构成参与内乱。\n\n由于个体野心，以及历史结构性等问题，韩国政坛的政治斗争既非常激烈，又富有戏剧性。\n\n今年76岁的韩德洙长年供职于政府经济部门，曾经两度担任总理，早年因韩国地域对立政治环境，曾刻意隐藏出身背景。韩国媒体此前对他的评价是“极度务实”“工作作风沉稳理性”。\n\n韩德洙长期主导韩国经济政策，还推动韩美自贸协定谈判落地，曾针对低出生率推出外籍劳工引进计划，放宽企业雇佣限制。\n\n2024年12月3日深夜，时任总统尹锡悦以在野党裹挟国会、掣肘施政等原因宣布进行“紧急戒严”，但以失败告终，后遭国会弹劾下台。韩国随后举行提前大选，来自共同民主党的李在明当选。\n\n去年12月15日，特检组宣布起诉包括尹锡悦、韩德洙在内的政府和军方24人。尹锡悦及其同下属企图利用军队以紧急立法机构取代国会，最终垄断立法和司法权。\n\n调查报告指出，尹锡悦自2023年10月起着手为宣布紧急戒严做准备工作，包括军队改组、作战规划及与高级军事指挥官的多次接触。其团队还准备了锥子、铁锤等刑讯工具，企图对30多人动刑。\n\n警方还发现，尹锡悦和时任国防部长金龙显等人试图通过无人机事件诱使朝鲜进攻韩国，届时只要朝方开火，尹锡悦就能借“紧急戒严”镇压在野党、封锁国会。\n\n宣布戒严后，暗杀小组将立即行动，以执政党党首韩东勋等政界人士为刺杀对象，事后宣称这是朝鲜所为。但事后证明，朝鲜方面并没有如尹锡悦预期的那样做出极端反应。\n\n2025年8月，特检组以涉嫌协助内乱、制造虚假公文、损坏公共文件、作伪证等罪名对韩德洙提起公诉。检方在结案庭审时指出，韩德洙在紧急戒严当天没有制止尹锡悦实施戒严，反而参与其中并提供协助，给国家和国民造成重大损失。\n\n检方还指出，韩德洙涉嫌与尹锡悦等人合谋，在紧急戒严后补制戒严相关文件，企图赋予“紧急戒严”正当性；此外，韩德洙曾在宪法法院和国会称自己对戒严令文件 ":"文丨李国雄  凌晨五点四十分，天府广场的路灯尚未熄灭，第一辆洒水车已经碾过湿漉漉的路面。","digest":"文丨李国雄  凌晨五点四十分，天府广场的路灯尚未熄灭…","points":["凌晨五点四十分，天府广场的路灯尚未熄灭，第一辆洒水车已经碾过湿漉漉的路面","成都五万余名环卫工人中的一部分，正陆续赶往各自负责的街段","城市的第一缕洁净，是从环卫工人这些俯身与坚守之间开始的"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T17:06:05+08:00","size":1,"keywords":[],"body":"文丨李国雄\n\n凌晨五点四十分，天府广场的路灯尚未熄灭，第一辆洒水车已经碾过湿漉漉的路面。成都五万余名环卫工人中的一部分，正陆续赶往各自负责的街段。一位保洁员把扫帚斜靠在路沿石上，蹲下身，用铲刀一点一点剔除嵌进砖缝的烟蒂。\n\n城市的第一缕洁净，是从环卫工人这些俯身与坚守之间开始的。\n\n城市的干净底色，来自环卫工日复一日的坚守\r\n\n这是成都“净优亮美”工程的基本作业单元。净环境、优秩序、亮空间、美风貌，这四组词汇标定了成都对人居环境的追求与想象，近年来，成都正在推进以“净优亮美”为标尺的城市治理，净字居首，意味深长。\n\n一条没有垃圾、没有积尘、没有污渍的街道，是公园城市示范区建设的起点，这个起点，靠的是五万余名环卫工人日复一日、无人喝彩的重复劳作。清晨第一班公交车出发之前，路面已经恢复整洁；暴雨过后行人醒来之前，污水已经排空；集聚烟火气的夜市，清晨的街道也先于人潮恢复它应有的模样。这种秩序因为太过稳定、太过日常，反而容易被城市遗忘。\n\n作为公共空间秩序的基底维护者，“净”字的直接承担者，环卫工人在城市叙事中被称为“蓉城美容师”，这是一个备受赞誉的称号，但赞美与善待之间，仍存在不小的距离。\n\n城市美的背后，生成这些美的过程本身是否体面，创造美的人是否被善待、被尊重，是一个值得追问的问题，人们可以随时说出“辛苦了”，但是一份足额缴纳的社保、一个工资专用账户、一笔写进制度的关爱，需要整个治理体系付出真实的成本。\n\n城市美容师\r\n\n长期以来，环卫工人群体面临的最大困境并非劳动强度本身，而是劳动价值与劳动回报之间的错位。这种错位大多源于用工制度的模糊地带，临时工、劳务派遣、超龄用工等复杂形态，使得许多环卫工人游离于正规劳动保障体系之外。\n\n成都市的破题之道，在于以“刚性制度”兜住收入底线。《成都市环卫工人健康安全关爱办法（修订）》从工资标准、津贴补助、加班报酬、社会保险四个维度作出强制性规定，将基础工资锁定为全市最低工资标准的130%，以制度化的方式承认了环卫工作的特殊性与不可替代性，打破了“最低工资即合理工资”的惯性思维。\n\n且岗位津贴按出勤日发放、酷暑寒冬专项补助、各类加班费严格执行法定标准、超龄人员强制购买高额意外保险……这套组合拳几乎覆盖了环卫工人可能遭遇的权益风险点。尤其是对超龄人员的保障安排，体现出精细化治理的担当。\n\n对于环卫工人的权益保障，目的是要让他们的生活更有质量。成都的多项举措正在推动这一跨越，“三年一轮”覆盖全市环卫工人的免费体检、1071座环卫工人作息房、千余个“环卫工人爱心驿站”、2400余座工会驿站……这些数字背后，是对劳动者身体权利的切实关照，也展示了通过技术进一步降低劳动强度的长远思路。\n\n从硬件的完善到人文温度的升腾，成都不仅关注环卫工人“干得动”，更开始在意他们“被看见”，让那些日复一日的付出，能在某个特定的时间节点，获得注目与回响。\n\n每年十月，是成都环卫工人的“高光时刻”，成都把这份注视与高光固定成了制度，今年修订的《成都市环卫工人健康安全关爱办法》明确将每年10月定为全市“环卫工人关爱月”，倡导社会各界开展多种形式关爱活动，尊重环卫工人劳动成果，理解支持环卫工作，集中释放对“蓉城美容师”的敬意与关怀。\n\n原本零散在季节轮替中的慰问，收束成一个有时点标志的制度窗口，让一座城市每年在固定的月份，正式地、集中地面对这个群体。愿意为低头劳作的人划出一段时间、调集公共资源、回应他们的健康与尊严。\n\n武侯区的“身、心、文”三位一体服务，锦江区的智能驿站，崇州市的“弹性钥匙”深夜开放，书画老师为他们定制折扇，心理老师倾听他们的心声，工会驿站为他们敞开大门，健康讲座、书画体验、心理疏导，从市城管委到各区县，从街道到社区，一场场面向环卫工人的主题活动密集展开，让公众得以看见一把扫帚背后的技艺、体能与心理负荷，也让蓉城美容师的职业归属感与社会认同感真正落地。\n\n从更宏观的层面看，环卫工人的处境，是衡量城市治理现代化程度的一把标尺。城市文明建设与发展，其实始终伴随着对基层劳动者如何被更好的尊重与承认的追问。公园城市所许诺的那个“美”字，最终要回答的是这份美究竟为谁而在。\n\n一座城市以精细化标准要求街道干净整洁，也必须同时回答，那些让街道一尘不染的人，是否正在被这座城市以同样的精细与郑重相待。关爱月，恰是把这个问题推到明处，让城市在擦拭自身的同时，也看清那些擦拭它的人。\n\n11月16日至17日，成都市城管委联合市人社局、市总工会开展环卫工人权益保障落实情况 “回头看”调研，逐项查阅环卫工人工资发放、社保及公积金缴纳、健康体检和职业病防治工作。\n\n这份追问，让冰冷的制度有了心跳，也让“精细化”三个字从街面的砖缝延伸到了人的心底。\n\n清晨的扫帚声，是城市苏醒之前最早的声音之一。站在更宏阔的视野审视，环卫工人关爱与公园城市建设的融合，本质上是对“人民城市”理念的一次深度诠释。城市的主体是人，城市的尺度是人，城市的终极目的也是人，一座城市愿意为基层劳动者织密保障网络，愿意将人文关怀嵌入每一条街道、每一处驿站、每一项制度，这座城市便获得了超越物质层面的灵魂。\n\n这种灵魂，既体现在“净优亮美”的外在风貌上，更沉淀在每一个市民内心的归属感与认同感中。\n\n本文为转载内容，授权事宜请联系原著作权人。\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n俯身与坚守：公园城市示范区的“净”界与温度\n\n从硬件的完善到人文温度的升腾，成都不仅关注环卫工人“干得动”，更开始在意他们“被看见”，让那些日复一日的付出，能在某个特定的时间节点，获得注目与回响。\n\n界面四川 · 2026/11/19 17:06\n\n文丨李国雄\n\n凌晨五点四十分，天府广场的路灯尚未熄灭，第一辆洒水车已经碾过湿漉漉的路面。成都五万余名环卫工人中的一部分，正陆续赶往各自负责的街段。一位保洁员把扫帚斜靠在路沿石上，蹲下身，用铲刀一点一点剔除嵌进砖缝的烟蒂。\n\n城市的第一缕洁净，是从环卫工人这些俯身与坚守之间开始的。\n\n城市的干净底色，来自环卫工日复一日的坚守\r\n\n这是成都“净优亮美”工程的基本作业单元。净环境、优秩序、亮空间、美风貌，这四组词汇标定了成都对人居环境的追求与想象，近年来，成都正在推进以“净优亮美”为标尺的城市治理，净字居首，意味深长。\n\n一条没有垃圾、没有积尘、没有污渍的街道，是公园城市示范区建设的起点，这个起点，靠的是五万余名环卫工人日复一日、无人喝彩的重复劳作。清晨第一班公交车出发之前，路面已经恢复整洁；暴雨过后行人醒来之前，污水已经排空；集聚烟火气的夜市，清晨的街道也先于人潮恢复它应有的模样。这种秩序因为太过稳定、太过日常，反而容易被城市遗忘。\n\n作为公共空间秩序的基底维护者，“净”字的直接承担者，环卫工人在城市叙事中被称为“蓉城美容师”，这是一个备受赞誉的称号，但赞美与善待之间，仍存在不小的距离。\n\n城市美的背后，生成这些美的过程本身是否体面，创造美的人是否被善待、被尊重，是一个值得追问的问题，人们可以随时说出“辛苦了”，但是一份足额缴纳的社保、一个工资专用账户、一笔写进制度的关爱，需要整个治理体系付出真实的成本。\n\n城市美容师\r\n\n长期以来，环卫工人群体面临的最大困境并非劳动强度本身，而是劳动价值与劳动回报之间的错位。这种错位大多源于用工制度的模糊地带，临时工、劳务派遣、超龄用工等复杂形态，使得许多环卫工人游离于正规劳动保障体系之外。\n\n成都市的破题之道，在于以“刚性制度”兜住收入底线。《成都市环卫工人健康安全关爱办法（修订）》从工资标准、津贴补助、加班报酬、社会保险四个维度作出强制性规定，将基础工资锁定为全市最低工资标准的130%，以制度化的方式承认了环卫工作的特殊性与不可替代性，打破了“最低工资即合理工资”的惯性思维。\n\n且岗位津贴按出勤日发放、酷暑寒冬专项补助、各类加班费严格执行法定标准、超龄人员强制购买高额意外保险……这套组合拳几乎覆盖了环卫工人可能遭遇的权益风险点。尤其是对超龄人员的保障安排，体现出精细化治理的担当。\n\n对于环卫工人的权益保障，目的是要让他们的生活更有质量。成都的多项举措正在推动这一跨越，“三年一轮”覆盖全市环卫工人的免费体检、1071座环卫工人作息房、千余个“环卫工人爱心驿站”、2400余座工会驿站……这些数字背后，是对劳动者身体权利的切实关照，也展示了通过技术进一步降低劳动强度的长远思路。\n\n从硬件的完善到人文温度的升腾，成都不仅关注环卫工人“干得动”，更开始在意他们“被看见”，让那些日复一日的付出，能在某个特定的时间节点，获得注目与回响。\n\n每年十月，是成都环卫工人的“高光时刻”，成都把这份注视与高光固定成了制度，今年修订的《成都市环卫工人健康安全关爱办法》明确将每年10月定为全市“环卫工人关爱月”，倡导社会各界开展多种形式关爱活动，尊重环卫工人劳动成果，理解支持环卫工作，集中释放对“蓉城美容师”的敬意与关怀。\n\n原本零散在季节轮替中的慰问，收束成一个有时点标志的制度窗口，让一座城市每年在固定的月份，正式地、集中地面对这个群体。愿意为低头劳作的人划出一段时间、调集公共资源、回应他们的健康与尊严。\n\n武侯区的“身、心、文”三位一体服务，锦江区的智能驿站，崇州市的“弹性钥匙”深夜开放，书画老师为他们定制折扇，心理老师倾听他们的心声，工会驿站为他们敞开大门，健康讲座、书画体验、心理疏导，从市城管委到各区县，从街道到社区，一场场面向环卫工人的主题活动密集展开，让公众得以看见一把扫帚背后的技艺、体能与心理负荷，也让蓉城美容师的职业归属感与社会认同感真正落地。\n\n从更宏观的层面看，环卫工人的处境，是衡量城市治理现代化程度的一把标尺。城市文明建设与发展，其实始终伴随着对基层劳动者如何被更好的尊重与承认的追问。公园城市所许诺的那个“美”字，最终要回答的是这份美究竟为谁而在。\n\n一座城市以精细化标准要求街道干净整洁，也必须同时回答，那些让街道一尘不染的人，是否正在被这座城市以同样的精细与郑重相待。关爱月，恰是把这个问题推到明处，让城市在擦拭自身的同时，也看清那些擦拭它的人。\n\n11月16日至17日，成都市城管委联合市人社局、市总工会开展环卫工人权益保障落实情况 “回头看”调研，逐项查阅环卫工人工资发放、社保及公积金缴纳、健康体检和职业病防治工作。\n\n这份追问，让冰冷的制度有了心跳，也让“精细化”三个字从街面的砖缝延伸到了人的心底。\n\n清晨的扫帚声，是城市苏醒之前最早的声音之一。站在更宏阔的视野审视，环卫工人关爱与公园城市建设的融合，本质上是对“人民城市”理念的一次深度诠释。城市的主体是人，城市的尺度是人，城市的终极目的也是人，一座城市愿意为基层劳动者织密保障网络，愿意将人文关怀嵌入每一条街道、每一处驿站、每一项制度，这座城市便获得了超越物质层面的灵魂。\n\n这种灵魂，既体现在“净优亮美”的外在风貌上，更沉淀在每一个市民内心的归属感与认同感中。\n\n本文为转载内容，授权事宜请联系原著作权人。","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c717d34125d","title":"1.5萬租屯門NOVO LAND 2房戶","url":"https://news.tvb.com/tc/1206610-15萬租屯門NOVOLAND2房戶","summary":"利嘉閣地產屯門-兆康站分行首席分區董事胡志偉表示，該行團隊精英最新促成屯門NOVO LAND 2B 期 Arreso 1B 座低層 C 室的二手租務成交個案，單位實用面積約 454 呎，採兩房間隔…","summary_short":"利嘉閣地產屯門-兆康站分行首席分區董事胡志偉表示，該行團隊精英最新促成屯門NOVO LAND 2B 期 Arreso 1…","digest":"利嘉閣地產屯門-兆康站分行首席分區董事胡志偉表示…","points":["利嘉閣地產屯門-兆康站分行首席分區董事胡志偉表示…","胡志偉透露，新租客為本地家庭客，原居於天水圍，為方便子女上學決定遷至屯門…","租客參觀單位後，心儀屋苑會所設施豐富且生活配套一應俱全，加上單位開則實用，空間感十足…"],"section":"財經","category":"地產","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:00:00+08:00","size":1,"keywords":["地產"],"body":"利嘉閣地產屯門-兆康站分行首席分區董事胡志偉表示，該行團隊精英最新促成屯門NOVO LAND 2B 期 Arreso 1B 座低層 C 室的二手租務成交個案，單位實用面積約 454 呎，採兩房間隔，外望開揚樓景及翠綠山景。\n\n胡志偉透露，新租客為本地家庭客，原居於天水圍，為方便子女上學決定遷至屯門，早前經利嘉閣「真盤源」平台獲代理安排參觀上述放盤。租客參觀單位後，心儀 滨市亚布力管理委员会举办亚布力冰雪季新闻发布会。　杨思颖 摄\n\n　　会上发布了亚布力滑雪旅游度假区2026—2027雪季的全新业态、服务安排及“三山联网”运营成效，展现“这么早，那么晚，龙江滑雪任你选”的资源优势，持续擦亮哈尔滨冰雪季品牌。\n\n　　哈尔滨市亚布力管理委员会文化旅游管理处处长吴丹介绍，亚布力滑雪旅游度假区的新业态、新场景集中亮相，为冰雪消费注入全新活力，今冬将积极培育夜间消费，做强温泉、夜间演艺、山地酒吧等多元场景，拉长游客停留消费链条。\n\n11月18日，游客在亚布力阳光度假村体验滑雪运动。　杨思颖 摄\n\n　　亚布力阳光度假村新媒体运营官杜冰玉介绍，多家连锁品牌入驻度假村，餐点全天供应；酒店内新增轻奢下午茶、酒廊、午夜粥铺等业态，度假村内配有酒吧、健身房等供游客休闲娱乐，实现“白天滑雪、日间休闲、夜间社交”全时段闭环。\n\n　　亚布力旅游投资集团有限公司副总经理刘广鹏介绍，服务升级的核心方向是暖心细节，深化“有温度的亚布力”服务品牌。在夜间保障方面，增设4至6台自动售餐机，解决夜间闭店后用餐需求。\n\n11月18日，大熊猫在亚布力熊猫馆吃竹子。　杨思颖 摄\n\n　　亚布力森林温泉酒店总经理吴辉介绍，依托亚布力顶级滑雪资源，酒店成功打造“白天激情滑雪、夜晚温泉康养”的成熟度假闭环。滑雪释放活力，温泉舒缓身心，动静结合、冷暖相宜，构建出完整、高品质的冰雪度假体验体系。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c2a1c15baaf","title":"中国首个面向东盟气象AI专项赛事收官","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-19/10734489.shtml","summary":"中新网南宁11月19日电 (张广权 王以照 黄姿娜)2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术交流活动18日在广西南宁举行。","summary_short":"中新网南宁11月19日电 (张广权 王以照 黄姿娜)2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术…","digest":"2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术交流活动18日在…","points":["中新网南宁11月19日电 (张广权 王以照 黄姿娜)2026年AI赋能千行百业超级联赛“人工…","现场公布大赛最终获奖结果并颁奖","该赛事是中国首个面向东盟国家的气象人工智能专项赛事"],"section":"財經","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T09:21:24+08:00","size":1,"keywords":[],"body":"中新网南宁11月19日电 (张广权 王以照 黄姿娜)2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术交流活动18日在广西南宁举行。现场公布大赛最终获奖结果并颁奖。\n\n　　该赛事是中国首个面向东盟国家的气象人工智能专项赛事。大赛自6月启动以来，吸引中国及东盟六国逾千名科创力量参与，104支队伍晋级决赛，共评出55个奖项，一批可落地、可跨境推广的创新成果集中亮相。\n\n11月18日，2026年AI赋能千行百业超级联赛“人工智能+气象”创新应用大赛技术交流活动在广西南宁举行。现场公布大赛最终获奖结果并颁奖。刘英轶 摄\n\n　　大赛设置“AI+气象数智计量”“AI+短时降水预报”“AI+众创气象服务”三大赛道。中国与东盟国家联合组队，跨境协作从“技术输出”走向“联合研发”，并依托云上算力支撑多模型同步推演。\n\n　　决赛路演环节，创新成果集中亮相。“多源融合短时降水预报模型”综合评分较传统数值模式提升34.7%；泰国代表队展示的“城市内涝智能预警方案”，可将多源多要素气象监测数据转化为街道积水风险研判。\n\n　　泰国气象局航空气象研究与发展处处长普差潘·西里萨(Putchaphan Sirisap)表示，人工智能正助力气象预报更加精准，在短时降水、城市内涝等场景中更好守护民众生命安全。\n\n　　广西壮族自治区政协副主席钱学明表示，气象与人工智能天然契合，广西以气象智能预警方案“妈祖”为抓手，深化与东盟国家的气象合作交流。希望未来推动更多气象创新成果走出赛场、惠及公众；利用人工智能等技术手段提升气候变化、极端天气应对能力。(完)\n\n 【编辑:何颖】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c35af969785","title":"Anthropic敲钟在即，英伟达业绩炸裂，为何科技股反而大跌？当前应该如何配置资产？","url":"https://www.jiemian.com/article/15348769.html","summary":"一、Anthropic：AI赛道的“超级抽血机”来了 本周，全球科技圈和资本市场都在屏息等待一件事——大模型巨头 Anthropic 正式登陆纳斯达克。","summary_short":"一、Anthropic：AI赛道的“超级抽血机”来了 本周，全球科技圈和资本市场都在屏息等待一件事——大模型巨头 Ant…","digest":"一、Anthropic：AI赛道的“超级抽血机”来了 本周…","points":["一、Anthropic：AI赛道的“超级抽血机”来了","本周，全球科技圈和资本市场都在屏息等待一件事——大模型巨头 Anthropic 正式登陆纳斯…","作为史上规模最大的IPO之一，这次发行高达8.25亿股，定价区间在70至78美元…"],"section":"財經","category":"","source":"jiemian","source_display":"界面新聞","published_at":"2026-11-19T09:08:45+08:00","size":1,"keywords":[],"body":"一、Anthropic：AI赛道的“超级抽血机”来了\n本周，全球科技圈和资本市场都在屏息等待一件事——大模型巨头 Anthropic 正式登陆纳斯达克。作为史上规模最大的IPO之一，这次发行高达8.25亿股，定价区间在70至78美元，募资体量极其惊人。\n每当这种级别的巨无霸上市，市场的第一反应往往不是狂欢，而是对流动性的恐慌。在资金总量有限的情况下，机构为了腾出仓位认购新巨头，必然会抛售手中的存量科技股。这也为近期科技板块的剧烈震荡埋下了伏笔。\n二、市场复盘：英伟达业绩炸裂，为何科技股反而大跌？\n很多投资者看着盘面感到困惑：就在刚刚发布的英伟达最新财报中，数据中心营收同比增长高达110%（达到1,076亿美元），下一季度的营收指引更是达到了惊人的1,300亿美元，远远甩开市场预期。\n单看基本面，AI算力需求不仅没有丝毫放缓，订单反而依然旺盛。那为什么美股科技股此前却提前经历了一轮大跌？\n核心原因只有一句话：资本市场交易的从来不是已经兑现的业绩，而是对未来的预期。\n在亮眼的财报数据之下，华尔街正在为四个深层的不确定性重新定价：\n对AI资本开支可持续性的担忧：下游科技巨头们真金白银砸了上千亿美元买芯片，但市场开始疑惑：这种疯狂的资本开支还能持续几个季度？如果终端应用迟迟跑不出对等的商业变现，算力采购的拐点随时可能出现。\n高估值的脆弱性：过去两年AI概念被极致演绎，科技股估值普遍处于历史高位。在“预期打满”的状态下，任何风吹草动都会触发资金的获利了结，高估值本身就是最大的风险。\n核心管理层变动的冲击：随着黄仁勋卸任CEO、临时管理层接棒，尽管公司强调技术路线图照常推进，但失去灵魂人物掌舵带来的治理不确定性，依然让部分机构选择避险为上。\n三、重定价：新一轮资本融资如何重塑AI估值？\nAnthropic 的上市，标志着AI产业正式从“一级市场讲故事”迈入“二级市场算总账”的残酷阶段。\n大模型不再稀缺，盈利能力成试金石：Anthropic 招股书里写满了风险提示，即便模型能力处于第一梯队，它依然是一个极其烧钱、尚未建立稳定持续盈利路径的重资产业务。上市后，它的每一个季度财报都会被放在显微镜下审视。\n估值锚点重构：今年6月 SpaceX 上市后也曾经历过破发和剧烈波动。如果 Anthropic 上市后表现不及预期，或者出现“上市即巅峰”的走势，整个AI应用层乃至算力层的估值中枢都会被向下重定价。资本市场将不再为单纯的“参数规模”买单，而是只为“自由现金流”和“商业闭环”买单。\n四、破局：泡沫暗涌之下，普通人该如何调整账户？\n当高估值科技股进入高波动、高分化的“深水区”，普通投资者如果还把所有筹码押在单一科技赛道上，无异于在惊涛骇浪中走钢丝。\n在这个节骨眼上，“哑铃策略”依然是最稳妥的解法——一端保留少量看好的硬核科技底仓，另一端则必须加大高股息、低波动的防御性资产配置，用确定的分红现金流来对冲科技泡沫破裂的风险。\n为什么现阶段建议重点关注红利资产？\n抗跌属性强：在市场风险偏好下降、资金从高估值成长股撤离时，具备稳定盈利和持续分红能力的企业往往成为资金青睐的对象。\n穿越周期的复利：不管AI技术路线怎么迭代、哪家大模型最终胜出，水电煤、银行、交运等关系国计民生的基础行业依然在源源不断地产生现金流。\n红利低波ETF天弘（159549）——紧密跟踪红利低波100指数\n红利低波ETF天弘（159549）通过紧密跟踪红利低波100指数，聚焦银行、医药生物、交通运输等具备稳健盈利与强现金流的行业，剔除了高波动杂质，将低波特征与分红意愿结合。\n从指数编制情况来看，红利低波100从A股中选取100只流动性好、连续分红、股息率高且波动率低的股票，有四个亮点值得关注：\n•双因子筛选，规避“红利陷阱”：只看股息率，容易买入因股价暴跌而“被动高息”的公司；叠加低波动筛选，更聚焦经营稳定、分红可持续的企业。\n•股息率/波动率加权：股息率越高、波动越低，权重越大；股价下跌推高股息率时，权重随之上调，形成“越便宜越多买”的再平衡。\n•每季度调样：比年度调样更及时地剔除股息率下滑或波动放大的个股。\n•行业分散：单一二级行业权重上限20%。\n●作为标准化的资产配置工具，在AI泡沫加剧的当前市场环境，红利低波ETF天弘（159549）仍具有较高的配置价值，适合作为投资者“哑铃策略”的一端。\n风险提示：成份股仅为客观展示，不代表个股推荐。本文观点不构成任何投资建议，市场有风险，投资需谨慎，指数基金存在跟踪误差，请投资人独立判断和决策。数据来源：wind。\n往期精选：\n《岁末年初险资避险需求提升，红利低波ETF天弘(159549)资产配置工具属性凸现》\nhttps://www.jiemian.com/article/15250858.html\n《震荡市中的确定性回报——揭秘红利资产背后收益驱动的引擎》\nhttps://www.jiemian.com/article/15308740.html\n《宽基和高股息资产怎么搭配更佳？一文说清》\nhttps://www.jiemian.com/article/15318567.html\n《俄乌美三方会谈重启，市场定价容易反复，该选择什么类型的避险资产？》\nhttps://www.jiemian.com/article/15323480.html\n《行业轮动过快，账户里的数字上蹿下跳，如何放置我们的资产？》\nhttps://www.jiemian.com/article/15334891.html\n\n 未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n 以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\nETF严选\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\nAnthropic敲钟在即，英伟达业绩炸裂，为何科技股反而大跌？当前应该如何配置资产？\n\n作为标准化的资产配置工具，在AI泡沫加剧的当前市场环境，红利低波ETF天弘（159549）仍具有较高的配置价值，适合作为投资者“哑铃策略”的一端。\n\n原创新闻有连云 · 2026/11/19 09:08来源：界面新闻\n\n一、Anthropic：AI赛道的“超级抽血机”来了\n本周，全球科技圈和资本市场都在屏息等待一件事——大模型巨头 Anthropic 正式登陆纳斯达克。作为史上规模最大的IPO之一，这次发行高达8.25亿股，定价区间在70至78美元，募资体量极其惊人。\n每当这种级别的巨无霸上市，市场的第一反应往往不是狂欢，而是对流动性的恐慌。在资金总量有限的情况下，机构为了腾出仓位认购新巨头，必然会抛售手中的存量科技股。这也为近期科技板块的剧烈震荡埋下了伏笔。\n二、市场复盘：英伟达业绩炸裂，为何科技股反而大跌？\n很多投资者看着盘面感到困惑：就在刚刚发布的英伟达最新财报中，数据中心营收同比增长高达110%（达到1,076亿美元），下一季度的营收指引更是达到了惊人的1,300亿美元，远远甩开市场预期。\n单看基本面，AI算力需求不仅没有丝毫放缓，订单反而依然旺盛。那为什么美股科技股此前却提前经历了一轮大跌？\n核心原因只有一句话：资本市场交易的从来不是已经兑现的业绩，而是对未来的预期。\n在亮眼的财报数据之下，华尔街正在为四个深层的不确定性重新定价：\n对AI资本开支可持续性的担忧：下游科技巨头们真金白银砸了上千亿美元买芯片，但市场开始疑惑：这种疯狂的资本开支还能持续几个季度？如果终端应用迟迟跑不出对等的商业变现，算力采购的拐点随时可能出现。\n高估值的脆弱性：过去两年AI概念被极致演绎，科技股估值普遍处于历史高位。在“预期打满”的状态下，任何风吹草动都会触发资金的获利了结，高估值本身就是最大的风险。\n核心管理层变动的冲击：随着黄仁勋卸任CEO、临时管理层接棒，尽管公司强调技术路线图照常推进，但失去灵魂人物掌舵带来的治理不确定性，依然让部分机构选择避险为上。\n三、重定价：新一轮资本融资如何重塑AI估值？\nAnthropic 的上市，标志着AI产业正式从“一级市场讲故事”迈入“二级市场算总账”的残酷阶段。\n大模型不再稀缺，盈利能力成试金石：Anthropic 招股书里写满了风险提示，即便模型能力处于第一梯队，它依然是一个极其烧钱、尚未建立稳定持续盈利路径的重资产业务。上市后，它的每一个季度财报都会被放在显微镜下审视。\n估值锚点重构：今年6月 SpaceX 上市后也曾经历过破发和剧烈波动。如果 Anthropic 上市后表现不及预期，或者出现“上市即巅峰”的走势，整个AI应用层乃至算力层的估值中枢都会被向下重定价。资本市场将不再为单纯的“参数规模”买单，而是只为“自由现金流”和“商业闭环”买单。\n四、破局：泡沫暗涌之下，普通人该如何调整账户？\n当高估值科技股进入高波动、高分化的“深水区”，普通投资者如果还把所有筹码押在单一科技赛道上，无异于在惊涛骇浪中走钢丝。\n在这个节骨眼上，“哑铃策略”依然是最稳妥的解法——一端保留少量看好的硬核科技底仓，另一端则必须加大高股息、低波动的防御性资产配置，用确定的分红现金流来对冲科技泡沫破裂的风险。\n为什么现阶段建议重点关注红利资产？\n抗跌属性强：在市场风险偏好下降、资金从高估值成长股撤离时，具备稳定盈利和持续分红能力的企业往往成为资金青睐的对象。\n穿越周期的复利：不管AI技术路线怎么迭代、哪家大模型最终胜出，水电煤、银行、交运等关系国计民生的基础行业依然在源源不断地产生现金流。\n红利低波ETF天弘（159549）——紧密跟踪红利低波100指数\n红利低波ETF天弘（159549）通过紧密跟踪红利低波100指数，聚焦银行、医药生物、交通运输等具备稳健盈利与强现金流的行业，剔除了高波动杂质，将低波特征与分红意愿结合。\n从指数编制情况来看，红利低波100从A股中选取100只流动性好、连续分红、股息率高且波动率低的股票，有四个亮点值得关注：\n•双因子筛选，规避“红利陷阱”：只看股息率，容易买入因股价暴跌而“被动高息”的公司；叠加低波动筛选，更聚焦经营稳定、分红可持续的企业。\n•股息率/波动率加权：股息率越高、波动越低，权重越大；股价下跌推高股息率时，权重随之上调，形成“越便宜越多买”的再平衡。\n•每季度调样：比年度调样更及时地剔除股息率下滑或波动放大的个股。\n•行业分散：单一二级行业权重上限20%。\n●作为标准化的资产配置工具，在AI泡沫加剧的当前市场环境，红利低波ETF天弘（159549）仍具有较高的配置价值，适合作为投资者“哑铃策略”的一端。\n风险提示：成份股仅为客观展示，不代表个股推荐。本文观点不构成任何投资建议，市场有风险，投资需谨慎，指数基金存在跟踪误差，请投资人独立判断和决策。数据来源：wind。\n往期精选：\n《岁末年初险资避险需求提升，红利低波ETF天弘(159549)资产配置工具属性凸现》\nhttps://www.jiemian.com/article/15250858.html\n《震荡市中的确定性回报——揭秘红利资产背后收益驱动的引擎》\nhttps://www.jiemian.com/article/15308740.html\n《宽基和高股息资产怎么搭配更佳？一文说清》\nhttps://www.jiemian.com/article/15318567.html\n《俄乌美三方会谈重启，市场定价容易反复，该选择什么类型的避险资产？》\nhttps://www.jiemian.com/article/15323480.html\n《行业轮动过快，账户里的数字上蹿下跳，如何放置我们的资产？》\nhttps://www.jiemian.com/article/15334891.html\n\n未经正式授权严禁转载本文，侵权必究。","image":"","video":"","video_poster":"","lang":"zh-Hans"}]},{"name":"生活","total":30,"items":[{"id":"c8a841d4efb","title":"打城戏迎来“新话事人” “Z世代”接续守护稀有剧种","url":"https://www.chinanews.com.cn/cul/2026/11-19/10734756.shtml","summary":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行。","summary_short":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　18日至19…","digest":"题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种  　　作者 叶秋云  　　1…","points":["18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行","打城戏又名“法事戏”“和尚戏”“道士戏”，是国内独树一帜的仪式戏曲…","曾经，受多重因素影响，打城戏面临剧目散失、艺人流失，被其他剧种同化的危机，一度走到濒危的边缘"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T17:32:15+08:00","size":1,"keywords":[],"body":"中新网福州11月19日电 题：打城戏迎来“新话事人” “Z世代”接续守护稀有剧种\n\n　　作者 叶秋云\n\n　　18日至19日，“经典传承——福建戏曲‘天下第一团’暨稀有剧种折子戏展演”在福州举行。打城戏折子戏《目连救母·过滑油山》《目连救母·代母绕枷》《真假美猴王·闹地府》《三打白骨精·擒僧》轮番登台，古老闽南戏韵响彻剧场。\n\n　　打城戏又名“法事戏”“和尚戏”“道士戏”，是国内独树一帜的仪式戏曲，已被列入国家级非物质文化遗产代表性项目名录。\n\n　　曾经，受多重因素影响，打城戏面临剧目散失、艺人流失，被其他剧种同化的危机，一度走到濒危的边缘。吴天乙、洪球江、黄锡均、黄莺莺、伍志新、吴晓军、黄海山等老一辈艺人倾尽半生心血，口传心授开展传承活动，让打城戏重返舞台。\n\n　　如今，泉州市打城戏传承中心挂靠高甲戏传承中心，实行“一团制”(一套班子、两个剧团)的运行模式，体制与民间传承双向并行。泉州市高甲戏传承中心主任周杰俊说，打城戏是珍贵的、具有重要价值的文化资源，一代代年轻人接过接力棒，继续守护和传承这份濒临消逝的戏曲记忆。\n\n11月18日，泉州市打城戏传承中心“00后”演员陈德佳(左一)在打城戏折子戏《目连救母·代母绕枷》中饰演目连。叶秋云 摄\n\n　　展演现场，折子戏《目连救母·代母绕枷》精彩上演，饰演目连的“00后”演员陈德佳带伤上阵，翻腾跳跃，利落的武打特技引得台下掌声阵阵。\n\n　　陈德佳自12岁开始学习打城戏，至今已经与之相伴十余载。“打城戏是一个断层情况十分严重的剧种。”谈起传承的难处，陈德佳感触颇深，老一辈艺人年事已高，留存下来的大多只是纸质史料，完整影像资料寥寥无几，年轻演员越来越难获得老艺人面对面言传身教的机会。“我们必须与时间赛跑，避免陷入‘人亡艺绝’的境地。”\n\n　　自2019年以来，在文旅部门和院团推动下，泉州市打城戏传承中心扎实开展打城戏掷铙钹、吃纸吐火等特技表演，累计抢救整理创排《劈山救母》《汉宫风云》等十多部剧目。与此同时，《代母绕枷》《过滑油山》《望乡台》等目连戏传统老戏也在持续挖掘复排，守住剧种的根脉。\n\n11月18日，泉州市打城戏传承中心“00后”演员苏有明(右二)在打城戏折子戏《真假美猴王·闹地府》中饰演美猴王。叶秋云 摄\n\n　　过去，打城戏传播渠道较为单一，大多依靠下乡巡演；如今，不少看完演出的戏迷自发在社交媒体分享片段。线上“种草”带动线下观演，不少上海、浙江等地的观众跨越千里专程来到泉州看戏。“这是新时代赋予我们的红利。”“00后”演员的苏有明坦言，机遇背后同样是沉甸甸的责任和压力，“主动担当是我辈义不容辞的文化责任”。\n\n　　守正不忘出新，青年演职人员也在探索适配当代观众的表达。剧团在强调剧种特性，保持剧种特色的同时，不断升级舞美灯光，运用布景机关补足演员难以实现的舞台效果；在《三打白骨精》等剧目中适度加入生活化、网络化台词，增添喜剧趣味，拉近和观众的距离。\n\n　　周杰俊表示，长期以来在各级部门和领导、专家、侨胞等社会各界人士的关心重视下，打城戏抢救、传承、研究和展示的实践探索，在人才培养、剧目整理创作和艺术研究等方面取得了可喜的成果。保护传承单位的设立及各项具体保护传承机制的组织实施，令打城戏“95后”“00后”演员从翻阅泛黄史料复原身段唱腔，到站上展演舞台挑大梁，正成为打城戏新一代“话事人”。(完)\n\n 【编辑:刘欢】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c137ad6d104","title":"天氣轉冷狂流鼻水、打乞嚏 中醫教3穴位 通鼻竅/防鼻敏感","url":"https://www.stheadline.com/health-edu/3638840/天氣轉冷狂流鼻水打乞嚏-中醫教3穴位-通鼻竅防鼻敏感","summary":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。","summary_short":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。","digest":"踏入秋冬季，不少人會出現鼻敏感反覆發作，特別是天氣轉變時尤其明顯","points":["踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯","中醫認為，長期處於冷氣環境及喜食冷飲，會令寒氣鬱閉、損傷陽氣，使抵抗力下降…","濟南市國家醫院分享了簡便易行的自我保健方法，適合市民日常應用："],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:31:22+08:00","size":1,"keywords":[],"body":"踏入秋冬季，不少人會出現鼻敏感（過敏性鼻炎）反覆發作，特別是天氣轉變時尤其明顯。中醫認為，長期處於冷氣環境及喜食冷飲，會令寒氣鬱閉、損傷陽氣，使抵抗力下降，增加鼻敏感發作機會。除積極治療外，配合穴位按摩、艾灸及敷貼等方法，有助宣通鼻竅、紓緩不適。\n3大核心穴位 通鼻竅、安神、強體質\n除內服藥物外，中醫外治法可有效控制鼻炎症狀，降低復發率。濟南市國家醫院分享了簡便易行的自我保健方法，適合市民日常應用：\n【同場加映】轉季鼻敏感發作、狂打乞嚏！營養學家推介4類抗敏食材 連皮蘋果、紫洋蔥助止鼻水？\n1. 迎香穴——通鼻第一穴\n位置：鼻翼外緣中點旁、鼻唇溝中。\n手法：以食指指腹順時針按揉1至2分鐘。\n功效：能快速疏通鼻道，緩解鼻塞、流涕及嗅覺失靈，是治療鼻炎的常用特效穴，鼻子不適時按壓最為直接。\n2. 印堂穴——安神定敏\n位置：在兩眉頭連線的中點。\n手法：以拇指或中指指腹自下而上推按或點按約1分鐘。\n功效：配合迎香穴使用，既能通鼻竅，亦可紓緩鼻炎引起的頭昏腦脹，安神穩定情緒。\n3. 合谷穴——強壯外援\n位置：在手背第1、2掌骨間，第2掌骨橈側中點，即虎口位置。\n手法：以對側拇指用力按壓，以有酸脹感為宜，維持1至2分鐘。\n功效：中醫有「面口合谷收」之說，合谷是調理頭面部的要穴，能增強體質，幫助改善過敏底子。\n應急技巧：搓揉迎香穴 快速通鼻塞\n以食指指腹按在迎香穴上，快速沿鼻樑兩側上下推擦約1至2分鐘，至鼻部發熱；也可用熱毛巾敷鼻，直至毛巾變冷。此法能瞬間擴張血管、通氣，紓緩鼻塞。建議每天早晚各做一套，持之以恆，鼻部不適會逐漸減少。\n艾灸與敷貼 逐寒濕、通氣血\n江蘇省中醫院針灸康復科主任醫師孫建華指，艾灸可逐寒濕、通氣血，對鼻炎有一定療效。隔薑灸法以鮮生薑切片，中間刺孔，置於背部大椎、肺俞及風門穴上，再放艾炷施灸，每穴灸3炷，以皮膚潮濕、紅潤為度。生薑辛溫走竄，可增強艾灸效果。\n穴位敷貼方面，夏季鼻炎症狀緩解時，可採用白芥子、甘遂、細辛等藥物加減，調以薑汁成丸，敷貼於背部定喘、肺俞及腎俞穴，讓藥物滲入皮膚，隨經絡氣血運行吸收，以期減少冬季發作。傳統以三伏天為最佳時機，臨床觀察整個三伏天均可考慮。惟敷貼並非人人適宜，正處疾病發作期、有嚴重慢性疾患、對藥物過敏、皮膚破潰或長有瘡癤者不宜；2歲以下幼兒皮膚嬌嫩，亦不建議。敷貼後應避寒保暖，忌食生冷，以免寒氣凝滯影響療效。\n穴位按摩與艾灸敷貼屬輔助保健，不能取代正規診治；使用以上輔助保健之前，應先立即求醫或諮詢專業中醫師。\n資料來源：孫建華醫師、濟南市國家醫院\n鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發','/health-care/3345484/鼻敏感飲食開冷氣易鼻敏感流鼻水中醫推介15種食物湯水紓緩防病發');\" oncontextmenu=\"cckevent('Article','鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發','/health-care/3345484/鼻敏感飲食開冷氣易鼻敏感流鼻水中醫推介15種食物湯水紓緩防病發');\">延伸閱讀：鼻敏感飲食｜開冷氣易鼻敏感流鼻水？中醫推介15種食物湯水紓緩防病發\n---","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c76d415a234","title":"伍詠薇爆邀閨密上節目被開天價 袁詠儀成嫌疑人？ 靚靚曾撐好友做嘉賓近兩年忽然少交集","url":"https://www.stheadline.com/film-drama/3638902/伍詠薇爆邀閨密上節目被開天價-袁詠儀成嫌疑人-靚靚曾撐好友做嘉賓近兩年忽然少交集","summary":"現年57歲的伍詠薇向來性格直率。","summary_short":"現年57歲的伍詠薇向來性格直率。","digest":"現年57歲的伍詠薇向來性格直率","points":["現年57歲的伍詠薇向來性格直率","近日她擔任陳敏之網台節目《Chi Chat》的嘉賓時…","她主動提供了一份好友名單，當中包括一位相識多年的女性好友"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:30:00+08:00","size":1,"keywords":[],"body":"現年57歲的伍詠薇向來性格直率。近日她擔任陳敏之網台節目《Chi Chat》的嘉賓時，透露早前主持HOY節目《九運會客室》第二季期間，節目組曾協助聯絡嘉賓。她主動提供了一份好友名單，當中包括一位相識多年的女性好友。豈料對方得知是伍詠薇的節目後，竟透過團隊要求遠超常規的車馬費才肯受訪。伍詠薇對此感到不滿，直言若無意受訪大可婉拒，而非提出高昂費用為難幕後人員，認為此舉缺乏尊重。片段播出後引起網民熱烈討論，紛紛猜測該女星的身份，其中最多人聯聯想到其相識30年的閨密袁詠儀。\n伍詠薇與袁詠儀逾30年姊妹情\n伍詠薇與袁詠儀是相識超過30年的圈中閨密，兩人於1994年合作電影《姊妹情深》結緣。當時身為香港小姐冠軍的袁詠儀起初對亞洲小姐出身的伍詠薇有些微言，心想：「她是亞洲電視的，和我一起拍戲？」沒想到合作後發現兩人性格同樣豪爽，隨即一拍即合。\n相關閱讀：伍詠薇曾患抑鬱症提早交代身後事 怨好友疏遠：我啲朋友去咗邊 一原因鬧老友「黐X線」\n伍詠薇曾調侃袁詠儀缺乏情趣\n兩人相處百無禁忌，袁詠儀曾透露伍詠薇吃飯時愛把骨頭吐進她的碟子裡，而伍詠薇也曾調侃袁詠儀「缺乏情趣」，笑稱張智霖說笑話時只有自己會給予反應，令袁詠儀反擊指兩人「有曖昧」。\n伍詠薇與袁詠儀曾有誤會\n雖然平時喜歡互相鬥嘴，但她們極為珍視這段友誼。2016年伍詠薇主持節目《伍姑娘真識食》邀請袁詠儀擔任嘉賓時，兩人都曾因「袁詠儀私下不希望與丈夫張智霖同台現身」而產生小誤會。誤會解開後，袁詠儀更大方送上一枚鑽石戒指予伍詠薇，象徵二人友誼永固。\n相關閱讀：張智霖兒子魔童20歲生日照曝光 張慕童輪廓深邃超靚仔 五官神複製《金枝玉葉》袁詠儀\n伍詠薇認曾對張智霖動心\n伍詠薇與張智霖同樣稔熟，二人以姊弟相稱，但她曾自爆當年對張智霖動過心，笑言：「當時我有想過跟靚靚『鍊過』，但鍊了個阿練（練海棠）回來。」張智霖則感性表示：「她對我的喜歡變成了疼愛。」伍詠薇常跟張智霖分享秘密，卻怨他口疏轉頭就告訴靚靚，足見三人感情深厚。而張智霖亦曾笑指伍詠薇「成日放飛機」。\n伍詠薇與袁詠儀近兩年較少交集\n不過，今年伍詠薇主持兩輯《九運會客室》，均未見袁詠儀和張智霖擔任嘉賓，而袁詠儀和伍詠薇近兩年的公開交集亦明顯減少。這次伍詠薇透露「高昂車馬費事件」，令網民再度關注這對昔日閨密的最新關係。\n相關閱讀：張智霖兒子休學與爸爸童年缺失有關？父子檔上台認有私心：點解我要多承擔呢份壓力","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c42839425fd","title":"香港公開羽毛球錦標賽｜吳英倫兩局不敵「世三」安東臣 賽後不甘心：明年要展現一個更強的自己","url":"https://www.stheadline.com/realtime-sport/3638945/香港公開羽毛球錦標賽吳英倫兩局不敵世三安東臣-賽後不甘心明年要展現一個更強的自己","summary":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」、丹麥球手安東臣相遇，最終兩局直落見負，提前結束香港站賽事。","summary_short":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」…","digest":"世界排名20的港隊男單人氣小師弟吳英倫周四在體藝館續戰香港公開羽毛球錦標賽…","points":["世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球…","賽後，Jason直言：不甘心，希望新一季展現一個更強的自己","今日吳英倫開賽已進入狀態，半場暫停（interval）後手握11:4的優勢"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:19:34+08:00","size":1,"keywords":[],"body":"世界排名20的港隊男單人氣小師弟吳英倫（Jason）周四（19日）在體藝館續戰香港公開羽毛球錦標賽，16強再與「世三」、丹麥球手安東臣相遇，最終兩局直落見負，提前結束香港站賽事。賽後，Jason直言：不甘心，希望新一季展現一個更強的自己。\n首局大比數領先遭逆轉\n今日吳英倫開賽已進入狀態，半場暫停（interval）後手握11:4的優勢。尾段吳英倫已17:7領先之際，安東臣改變策略，積極控網前不願挑球，限制Jason進攻，竟然打出一波13:1的攻勢奇跡反超至20:18，唯一失1分還是安東臣自己發球偷後場出界。最終安東臣以21:19逆轉，拿下首局。\n次局難挽頹勢再敗\n第二局開局吳英倫經過調整，先以4:0領先。後被安東臣追平，兩人纏鬥至12:12，安東臣又是數次連續得分拉開比數，最後Jason力追無果，以15:21再落敗。安東臣以總局數2:0晉級8強。\nJason今年做出突破的成績，九月在深圳舉行的中國大師賽首次取得「超級750」的冠軍，本月（11月）初在南韓公開賽（超級500）亦奪得亞軍，世界排名升至新高的第20位，僅次香港一哥李卓耀一位；但今季香港站最後一場比賽，在領先大比數下被對手反勝，Jason坦言「不甘心」。\n爾郡耀攝\n爾郡耀攝\nJason坦言「不甘心」\n「今日在首局我在領先的情況下沒好好把握，我第一局打得不錯，但在領先後失去集中力，對方改變戰術，我開始出錯，可能太想贏，沒放平心態去打，我知這是不應該的。」Jason跟安東臣在九月及十月期間曾對過兩次，各有一勝一負，今次在香港主場見負，Jason最「不甘心」。\n「真的不甘心，今日在首局我在領先下沒好好把握，我第一局打得不錯，但領先後失去集中力，對方改變戰術，我開始出錯，可能太想贏，沒放平心態去打，我知這是不應該的。」\nJason坦言今季的成績及排名給予自己不少信心，知道自己也可以在大舞台上贏比賽，從今仗香港站的「不甘心」，他希望新一季展現一個更強的自己，尤其一月開始採新制的15分，五月份亦展開為期一年的洛杉磯奧運積分周期，他說：「今年有不錯的成績，明年都是繼續想贏比賽，未來一個月沒比賽，我會繼續去提升自己，新一季給一個更強的自己大家看，去證明我是可以去爭取勝利的。」\n記者：爾郡耀、徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7c008479f5","title":"李政宰被爆「自肥式」經營經理人公司 拍《魷魚遊戲》袋過億公司僅分237萬 累股價暴跌連年虧損","url":"https://www.stheadline.com/film-drama/3638939/李政宰被爆自肥式經營經理人公司-拍魷魚遊戲袋過億公司僅分237萬-累股價暴跌連年虧損","summary":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位，上月中李政宰控告5名前員工挪用公款之後…","summary_short":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位…","digest":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company風波不斷…","points":["李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷…","李政宰以9：1作收入分配比率","而且當李政宰的收入超過40億韓圜時，那些超出的部分就會全歸李政宰所有"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:15:38+08:00","size":1,"keywords":[],"body":"李政宰與鄭雨盛聯手創立的經理人公司Artist Company（簡稱AC）風波不斷，繼上月初鄭雨盛辭去執行董事職位，上月中李政宰控告5名前員工挪用公款之後，昨日（18日）又被《Dispatch》（D社）大爆李政宰以「自肥式經營」經理人公司，令公司連年虧損，股價暴跌。\n李政宰以9：1作收入分配比率\n據D社報道，李政宰與AC以9：1作為其演藝收入分配比率，李政宰的收入頭40億韓圜（約2,369萬港元）中，他本人分得當中90%，AC則只能取得10%。而且當李政宰的收入超過40億韓圜時，那些超出的部分就會全歸李政宰所有。據知AC旗下其他藝人，如廉晶雅、林智妍、金惠奫的合約都沒有這樣的條款。\n李政宰公司一年暴跌70%\n據指李政宰拍攝《魷魚遊戲》第2、3季時，每集片酬超過120萬美元（約17億韓圜、1,007萬港元），他拍攝了13集，總共賺得超過200億韓圜（約1.18億港元）。但AC只能從200億當中的頭40億韓圜中，抽取10%，所以就算李政宰賺了1,000億，AC亦只能分得4億韓圜（約236.9萬港元）。而李政宰是透過其個人公司Verdant Hills收取結算款項，根據2025年的業務報告，AC轉入該公司金額高達201億韓圜（約1.19億港元），與上述他拍《魷魚》2、3季的片酬相若，證明這套「自肥式」分成方法屬實。身為最大股東的李政宰去年賺成1.19億港元，但公司也只能分得唔夠237萬港元，難怪AC在市場表現疲弱。他們去年以每股13,610韓圜（約80.6港元）開盤，年底收盤價已跌到4,050韓圜（約24港元），一年內暴跌70%。\n李政宰逼子公司交雙重租金\n另外，李政宰自收購著名韓劇製作公司RaemongRaein（來夢來人） 後，就積極推動RaemongRaein（RR）的辦公室搬遷，將RR從論峴洞總部搬到李政宰旗下物業，然而論峴洞那邊的租約還有1年7個月才到期，RR被逼急搬之下，須交晒新舊辦公室的租金。據知論峴洞總部每月租金2,400萬韓圜（約14.2萬港元），而李政宰物業租金亦唔平，去年RR就支付了1.3億韓圜（約77萬港元）租金，今年上半年亦已支付了9,000萬韓圜（約55.3萬港元）租金。\n李政宰公司發聲明澄清\n而李政宰今年3月亦成立了Vena Beauty，發展化妝品事業。3個月後，AC亦於6月宣布進軍化妝品市場，並將李政宰親自開發的產品及個人國際知名度等資產投入新事業。不過，D社又踢爆AC除了必須每年向Vena Beauty支付最低保證金，還得依照營業成果支付10%的營利收益。然而AC回應指報道不實，更聲稱將採取法律行動。他們發表聲明表示，與李政宰的合約屬於「一般常見的合約」，而且是一份合理的合約，指李政宰和曾同任執行董事的鄭雨盛都沒有收取執行董事薪酬，兩人簽署的合約條款一樣。而李政宰有關《魷魚遊戲》的合約和海外工作均由美國經理人公司CAA負責，故片酬分成亦由CAA負責。雖然AC沒有直接參與，但亦根據合約獲得了部分收入。至於RR被收購後急搬總部一事，AC解釋說是方便處理法律糾紛，開展管理活動和業務運營。\n李政宰考慮過放棄最低保證金\n至於Vena Beauty部分，AC指出考慮到李政宰的廣告代言費通常高達數億韓圜，如今給Vena Beauty每年3,000萬韓圜（約17.7萬港元）的最低保證金，數額其實一點也不高。AC更指李政宰為了公司利益，本來考慮放棄最低保證金，但鑑於免費提供授權可能產生稅務問題，最終決定採用最低金額。他們更補充道：「根據合約，如果業績超過雙方約定的目標營業利潤，Vena Beauty只能獲得超額利潤的一部分，並且在達到目標營業利潤之前，除最低保證金外，不會獲得任何其他與業績掛鉤的回報。此外，合約還規定，任何未分配給Vena Beauty的超額利潤，都要再投資於公司業務。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cec637386b0","title":"梁烈唯揭帶貨驚人薪酬等於拍幾部戲 曾收勞斯萊斯禮物、住豪宅 早前捲LABUBU失竊風波","url":"https://www.stheadline.com/film-drama/3638911/梁烈唯揭帶貨驚人薪酬等於拍幾部戲-曾收勞斯萊斯禮物住豪宅-早前捲LABUBU失竊風波","summary":"47歲的梁烈唯（曾改名梁競徽）近年轉戰內地市場，積極開拓直播帶貨事業，日前他接受內地抖音博主「Midu Yang在美國」訪問，二人一邊同遊杭州西湖一邊大談近況。","summary_short":"47歲的梁烈唯（曾改名梁競徽）近年轉戰內地市場，積極開拓直播帶貨事業…","digest":"47歲的梁烈唯近年轉戰內地市場，積極開拓直播帶貨事業…","points":["47歲的梁烈唯（曾改名梁競徽）近年轉戰內地市場，積極開拓直播帶貨事業…","面對「做直播是否純為賺錢」的問題，梁烈唯坦蕩直認要養家：「是啊，我要賺錢的，工作不是就賺錢嗎","」 隨後他更在鏡頭前驚揭直播帶貨的薪酬內幕，直言好搵與否全憑個人能力，更自爆…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:00:00+08:00","size":1,"keywords":[],"body":"47歲的梁烈唯（曾改名梁競徽）近年轉戰內地市場，積極開拓直播帶貨事業，日前他接受內地抖音博主「Midu Yang在美國」訪問，二人一邊同遊杭州西湖一邊大談近況。面對「做直播是否純為賺錢」的問題，梁烈唯坦蕩直認要養家：「是啊，我要賺錢的，工作不是就賺錢嗎？賺錢不就是我們要養家啊，想要我們自己的生活，可以有選擇，我覺得很正常。」 隨後他更在鏡頭前驚揭直播帶貨的薪酬內幕，直言好搵與否全憑個人能力，更自爆：「如果那一場你賣得很好，或者你是體量很大的主播，那肯定一次直播可能就抵你，好像我們那麼普通的演員，利益可能是我們拍幾部戲的價格了。」\n梁烈唯直播吸金住豪宅揸名車\n梁烈唯曾獲TVB力捧，並先後奪得「飛躍進步男藝員」及「最佳男配角」殊榮。2025年約滿邵氏後，他改以自由身接洽工作，主力進軍內地及馬來西亞市場，近年更與沈震軒、高鈞賢、黃長興及黃嘉樂組成「好犀利男團」兼擔正 C 位，人氣與財富雙雙暴漲。多年來吸金不斷的他，生活品質亦同步升級，他近年除了直播帶貨，又投資副業開鐘錶店及車行等，曾在生日收到契媽送上一架價值過千萬的勞斯萊斯庫里南（Rolls-Royce Cullinan），又試過晒出估值逾70萬的勞力士（Rolex）「白金隕石面地通拿」，由原本居住深井碧堤半島，於2024年遷入價值逾千萬的烏溪沙海景豪宅居住，生活過得相當富貴，是圈中公認的隱形富豪。\n相關閱讀：梁烈唯終於現身！捲樂易玲生日派對Labubu失竊風波 無阻操肌心情晒麒麟臂 引網民嘲諷\n梁烈唯疑捲入Labubu失竊風波\n梁烈唯身家豐厚，住在千萬豪宅，早前卻疑捲入「Labubu失竊風波」。事緣在早前TVB 高層樂易玲的生日派對上，歌手周吉佩送贈的Labubu 熱門花束突然不翼而飛，網民隨即憑現場線索將嫌疑人矛頭直指梁烈唯。雖然樂易玲隨後接受訪問時極力澄清只是一場誤會，強調並非外界所傳的「偷竊」，並透露對方隨後已將裝飾好的花束親自送回她的辦公室，但這宗離奇事件仍迅速掀起熱烈討論。\n相關閱讀：樂易玲首開腔揭「生日被偷Labubu」真相：唔講都唔記得 避談「真兇」身份 證梁烈唯已離巢","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c6e46fe916d","title":"49年走到1光日 带着金唱片的旅行者1号能被外星人发现吗","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734478.shtml","summary":"人类飞得最远的探测器走到哪了？","summary_short":"人类飞得最远的探测器走到哪了？","digest":"人类飞得最远的探测器走到哪了","points":["人类飞得最远的探测器走到哪了","北京时间昨天(18日)18时16分07秒，旅行者1号探测器历经49年的飞行…","这也是人类历史上第一次，将自己造出的装置送到了即便以光速也要用“天”来计量的遥远尺度"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T09:08:13+08:00","size":1,"keywords":[],"body":"人类飞得最远的探测器走到哪了？北京时间昨天(18日)18时16分07秒，旅行者1号探测器历经49年的飞行，正式抵达了距离地球1光日的地方。这也是人类历史上第一次，将自己造出的装置送到了即便以光速也要用“天”来计量的遥远尺度。\r\n\n　　从地球到月球，光只要跑1.3秒；从太阳照到地球，光只要走8分多钟；即便飞到最远的行星海王星，光也只需要4个多小时。1光日，是指光在真空中跑上一整天的距离，折算下来大约是259亿千米。\n\n　　探测器所抵达的1光日的位置，距离飞出太阳系还有多远？半个世纪的星际航行，带来哪些发现与挑战？\n\n　　1光日到底有多远？\n\n　　北京天文馆研究员 朱进：1光日指的是以光速运动，走一天的距离。光速为光子在真空中的传播速度，每秒30万千米，一天86400秒，两者相乘约259亿千米，即1光日的距离。\n\n　　大家把1光日当成一个比较受关注的节点，那飞到这个位置，旅行者1号周边的宇宙环境，会出现比较明显变化吗？这个节点它更多是纪念意义，还是说能给我们研究星际空间、认识太阳系边界带来新的科学收获呢？\n\n　　朱进：1光日只是为了“凑个整”。平时在太阳系内运动多用天文单位，常听说的其实是光年，很少用光日。光日是因为这一距离正好是以光速衡量24小时，或者说与飞船通信时信号发过去需24小时、发回来也需24小时。因此，1光日对应的距离上并没有物理上特别不一样的地方。\n\n　　快要飞出太阳系了吗？\n\n　　这次到达1光日的距离，有不少听众好奇它是不是已经或者快要飞出太阳系了。其实早在2012年8月，旅行者1号越过日球层顶、进入星际空间的时候，大家就有过同样的疑问。那这次的情况又是怎么样的呢？\n\n　　朱进：2012年旅行者1号经过太阳风层顶(日球层顶)，这是一个比较重要的不同之处：飞船经过该处后，来自太阳的太阳风粒子压力与来自外部恒星际空间的压力达到平衡，是一个比较关键的变化。但经过太阳风层顶与飞出太阳系并非一回事。离太阳最近的恒星有4光年远，1光日其实还只是离太阳非常近的地方。旅行者1号虽已走了近50年，但按太阳系尺度看，其实只走了太阳系里非常中心的一小段。\n\n　　地面测控最大难点是什么？\n\n　　到了1光日这个距离，信号单程就要24小时，一来一回通信时延接近48小时。这么长的时延，地面测控面临最大的难点是什么？\n\n　　朱进：这一距离上最大难点其实并不是延时，因为很多时候并没有那么多需要实时反应的东西。最关键的是距离远造成信号衰减特别强；同时旅行者1号已近50年，50年前的航天器不可能携带特别大的天线，发射信号功率肯定特别低，且为节省能源还要限制信号发射强度和电力消耗。真正麻烦的是信号太微弱，探测器上科学观测设备和发射信号设备都存在寿命与功率问题。\n\n　　金唱片能被外星文明捕获吗？\n\n　　旅行者1号和2号上，都携带着同样的一张金唱片，这张唱片上，记录了55种语言的问候、大概90分钟的音乐、115幅模拟编码图像，以及风雨、浪涛和动物的声音。封面用氢原子跃迁建立时间尺度，以脉冲星图标示太阳位置。那么，在漫长的星际漂流中，它有没有机会被外星文明捕获，甚至是被读懂呢？\n\n　　朱进：在我看来，碰到外星人基本上不可能。两个探测器要真正离开太阳系、抵达离太阳最近的恒星，还早得很，怎么也是几万年以后的事。旅行者1号49年才走1光日，若银河系有外星人，一般考虑不会到处都是，在这种情况下能被外星人接触到，是百万年量级的事。因此需上百万年甚至上千万年，且唱片还没坏、还能一直往前飞，才有可能被外星人碰着。 【编辑:王琴】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c4568614fde","title":"调查：超八成受访青年因线下观看竞技体育赛事结识了新朋友","url":"https://www.chinanews.com.cn/sh/2026/11-19/10734476.shtml","summary":"超八成受访青年因线下观赛结识了新朋友  　　见证重要赛事节点、感受紧张现场氛围、打卡丰富配套活动……","summary_short":"超八成受访青年因线下观赛结识了新朋友  　　见证重要赛事节点、感受紧张现场氛围、打卡丰富配套活动…","digest":"超八成受访青年因线下观赛结识了新朋友  　　见证重要赛事节点、感受紧张现场氛围…","points":["见证重要赛事节点、感受紧张现场氛围、打卡丰富配套活动……观看竞技体育赛事时…","近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育…","”在广东广州上学的05后赵欣喜欢在现场亲身感受比赛氛围…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-19T09:04:59+08:00","size":1,"keywords":[],"body":"超八成受访青年因线下观赛结识了新朋友\n\n　　见证重要赛事节点、感受紧张现场氛围、打卡丰富配套活动……观看竞技体育赛事时，你是否会选择去线下，享受和同好一起加油助威的快乐？近日，中国青年报社社会调查中心联合问卷网(wenjuan.com)对1048名观看过竞技体育赛事的青年开展的调查显示，超七成受访青年曾在线下观看过竞技体育赛事，其中，80.8%的受访青年因线下观赛结识了新朋友。\n\n　　“线下观赛的氛围感是线上无法体验到的”\n\n　　“在线下看比赛和隔着屏幕还是很不一样的。”在广东广州上学的05后赵欣喜欢在现场亲身感受比赛氛围，也会为了自己喜欢的赛事特意去其他城市观赛，“我看的竞技项目在上海的赛程比较多，去一次可能会花费5000元左右。”今年，该赛事推出了城市巡回赛，落地了她所在的广州，“一场的票价大约在300元，比较合适。”她也会去球迷或者官方组织的线下观赛点观看赛事转播，“可以感受大家一起观赛的激动氛围。”\r\n\n　　在北京工作的90后李泽林更倾向在当地看比赛。作为一名网球爱好者，他从2014年就开始在线下观看中国网球公开赛(以下简称“中网”)。除了门票，他还会购买挂件、服饰等赛事周边，“去一次基本会花费1000元左右。”今年中网期间，他和朋友被一家正在转播中网赛事的餐厅吸引，“其实在餐馆之类的地方，和朋友一起边吃边看，也很有意思。”\n\n　　除了现场观赛，如今越来越丰富的线下观赛形式也吸引更多年轻人走出家门，和同好一起分享观赛激情。数据显示，70.9%的受访青年在比赛现场、影院转播活动等线下渠道观看过竞技体育赛事。其中，7.4%的受访青年通常会为线下观赛活动花费100元以下；43.6%的受访青年花费100-500元(不含500元)；35.4%的受访青年花费500-1000元(不含1000元)；11.2%的受访青年花费1000-3000元(不含3000元)；还有2.4%的受访青年会花费3000元及以上。\n\n　　“线下观赛的氛围感是线上无法体验到的。”正在读研究生的00后卫婕会选择在一些关键赛事，或者有自己喜欢的队伍参赛时去线下观赛，和同好一起加油助威。同时，她也感到如今的赛事配套活动越来越丰富，将赛事与城市特色融合起来，给观众带来了更沉浸的线下观赛体验，“今年我去北京看了一场比赛，它在开场表演和舞美设计中，融入了京剧等北京特色元素，让人眼前一亮。”\n\n　　对95后王卓琳而言，只有去线下观赛，才能真正感受到一个体育项目的魅力，“哪怕把电视声音开得再大，和现场也是完全不同的。”她平时也会去不同城市观看足球比赛，亲身感受赛场独有的紧张感，“有的人可能觉得屏幕上看得更清楚，可以看到细节、听清解说，但只有在现场，你才能感受到为什么一个带球、一个进球都牵动人心。”\n\n　　比起在家“躺着”观赛，年轻人为何会选择到线下场所观看竞技体育比赛？在有过线下观赛经历的743名受访青年中，57.5%的受访青年是想亲眼见证高光时刻、经典对决；56.9%的受访青年是为了和同好一起呐喊助威，获得情绪共鸣；55.2%的受访青年是为了沉浸式感受赛场独有的紧张氛围。其他还有：近距离支持喜欢的选手、队伍(47.4%)，互动、抽奖、表演等线下配套活动丰富(36.3%)，作为一种休闲社交方式(25.0%)，打卡赛事地标(5.9%)等。\n\n　　线下观赛 八成受访青年结识了新朋友\n\n　　线下观赛，年轻人不仅享受比赛本身的魅力，也拓展了自己的社交圈。调查显示，在有过线下观赛经历的受访青年中，80.8%的受访青年因此结识了新朋友。\n\n　　赵欣觉得，竞技体育赛事让来自天南海北的观众有机会相聚在一起。“最开始大家可能只是网友，在社交平台上发帖交流。随着线上交流的深入，大家会加好友、建群。”有比赛时，群里的朋友也会相约线下观赛，“我也因此认识了很多新朋友。”\n\n　　李泽林在中网期间会和球迷群里的网友相约买票，“我们会选一个比较集中的区域，方便一起加油助威。”观赛时，大家还会在现场讨论比赛内容，交流球技。赛后，他还会和新“球友”约着一起线下打球。\n\n　　卫婕会在观赛现场和其他粉丝交换周边，也会和旁边的其他同好搭话，在一来二去的闲聊中慢慢发展出友谊。如今，她和一些通过线下观赛认识的同好之间的话题，已经不仅仅是比赛本身，“有的已经成了能分享生活的好友。”\n\n　　受访青年中，男性占52.8%，女性占47.2%。05后占5.2%，00后占32.2%，95后占25.6%，90后占37.0%。\n\n　　(除卫婕外，受访者均为化名)\n\n　　中青报·中青网记者 戴瑶\n\n　　来源：中国青年报 2026年11月19日 08版 【编辑:王琴】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c220630ab76","title":"時尚品牌秋冬人氣聯乘 MCM/Brooks Brothers卡通童趣滿分 Alice ALICE + OLIVIA by Stacey Bendet碰撞美式世界","url":"https://www.stheadline.com/luxe/3638622/時尚品
