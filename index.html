“烽火中的民族精神与文化中国”为主题…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T22:25:20+08:00","size":2,"keywords":[],"body":"中新社广西桂林11月21日电 (张广权 欧惠兰)2026文化抗战学术研讨会21日在广西桂林举行。会上，多名抗战文化名人后代向文化抗战(桂林)研究院捐赠一批珍贵的抗战时期书籍与手稿。\n\n　　此次研讨会由广西师范大学主办，以“烽火中的民族精神与文化中国”为主题，是文化抗战(桂林)研究院成立以来举办的首届全国性学术研讨会。\n\n11月21日，2026文化抗战学术研讨会在广西桂林举行。图为捐赠仪式现场。(广西师范大学供图)\n\n　　桂林是首批中国国家历史文化名城。抗战时期，大批文化人士汇聚于此，以笔为枪、以艺救亡，出版机构等文化团体蓬勃发展，成为中国文化抗战的重要中心，被誉为“抗战文化城”。\n\n　　桂林市委书记郭忠志表示，近年来桂林持续加强抗战遗址遗迹保护修缮，深入挖掘文化抗战历史资源，连续多年举办桂林艺术节，积极推动抗战文化创造性转化、创新性发展。下一步，桂林将深化校地合作，加强抗战遗址遗存保护修缮和展示利用，把文化抗战资源融入桂林世界级旅游城市建设。\n\n　　广西师范大学党委书记赵勇富指出，桂林是抗战大后方知名的文化重镇，该校办学历史与桂林抗战文化发展脉络血脉相连。学校将与各方携手溯源寻脉、深耕学术、以史育人，共同推动文化抗战研究迈向更高水平。\n\n　　当天，田汉之孙欧阳维代表抗战文化名人后代向文化抗战(桂林)研究院捐赠书籍等资料。\n\n　　欧阳维表示，抗战文艺蕴藏的民族精神至今仍能与海外华人形成精神共鸣。他表示，田汉基金会后续将联合文化抗战(桂林)研究院及地方文博机构，继续深挖、整理和研究相关历史遗存。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"2026文化抗战学术研讨会在桂林举行","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735926.shtml","source_display":"中國新聞網","published_at":"2026-11-21T22:25:20+08:00","category":"生活","digest":"2026文化抗战学术研讨会21日在广西桂林举行"},{"title":"2026文化抗战学术研讨会在桂林召开","url":"https://www.chinanews.com.cn/gn/2026/11-21/10735828.shtml","source_display":"中新網 時政","published_at":"2026-11-21T18:48:36+08:00","category":"內地","digest":"11月21日，“烽火中的民族精神与文化中国”2026文化抗战学术研讨会在广西桂林召开"}],"cross":{"total":2,"angles":[{"point":"2026文化抗战学术研讨会21日在广西桂林举行","sources":["中國新聞網"],"url":"https://www.chinanews.com.cn/cul/2026/11-21/10735926.shtml"},{"point":"11月21日，“烽火中的民族精神与文化中国”2026文化抗战学术研讨会在广西桂林召开","sources":["中新網 時政"],"url":"https://www.chinanews.com.cn/gn/2026/11-21/10735828.shtml"}]}},{"id":"c68230d0d36","title":"方力申渡海泳｜出戰前遭老婆葉萱訓話 曾出現負面情緒凍到腳震頭痛 游到最後迴光返照：今次真係辛苦","url":"https://www.stheadline.com/film-drama/3639675/方力申渡海泳出戰前遭老婆葉萱訓話-曾出現負面情緒凍到腳震頭痛-游到最後迴光返照今次真係辛苦","summary":"方力申（Alex）今日（21日）參與慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」，於今晨8時53分於大嶼山雞翼角孤身躍入海中，挑戰長達35公里的港澳公海橫渡，經過逾8小時的努力…","summary_short":"方力申（Alex）今日（21日）參與慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」…","digest":"方力申參與慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」…","points":["方力申（Alex）今日（21日）參與慈善挑戰「凝動全城 破浪傳承…","完成創舉行，方力申無縫接力參與「《浪接．浪》港澳群星慈善音樂會」，在音樂會開始前…","相關閱讀：方力申成功挑戰35公里港澳慈善游 僅花08:37…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T21:00:00+08:00","size":2,"keywords":[],"body":"方力申（Alex）今日（21日）參與慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」，於今晨8時53分於大嶼山雞翼角孤身躍入海中，挑戰長達35公里的港澳公海橫渡，經過逾8小時的努力，方力申終於僅花08:37:24順利抵達澳門黑沙海灘，比預期快約20分鐘，更打破歷年記錄，小方這次的港澳慈善游，籌得逾800萬。\n方力申出戰前遭太太葉萱訓話\n完成創舉行，方力申無縫接力參與「《浪接．浪》港澳群星慈善音樂會」，在音樂會開始前，方力申表示自己已清醒了一點，又笑指太太葉萱在出戰前跟他講已年近50 ，仔細老婆嫩，不要再搞這些，方力申指很感恩自己的技能也可以幫到人，但他指在游時也跟自己說：「真係游埋呢次，真係搞唔掂，今次真係好辛苦。」\n相關閱讀：方力申成功挑戰35公里港澳慈善游 僅花08:37:24完成目標 籌得890萬善款支援基層及SEN兒童\n方力申指最初首公里已很大浪，游完一小時已經攰，不如如何捱，去到第四小時水溫突然跌了三度，只有21、22度左右，就算自己不怕凍也頂不順：「凍到頭痛，我一路踢腳，淨係feel到上五寸下五寸隻腳郁緊，兩個腳掌我係feel唔到，我一路游嘅時候就心諗咁樣游真係游唔到，但仲頂得順，因嗰陣時都係四個鍾，仲有啲體力嘅，但係到六個鐘開始，我係凍到游緊都震，我都未試過，自己都keep唔到體溫。」\n方力申又坦言有幻想過自己有可能游不完，隨之又產生負面情緒：「我喺度諗死喇，我又頭痛，跟住而家又咁攰，萬一咩低溫症嗰啲會唔會頭暈？會唔會暈到跟住暈低？啲水咁濁，跳落嚟都搵我唔到，咁我死梗，一定冇人救我啦！真係死梗喎！嗰一刻我嗰啲負面情緒就係我老婆啱啱有咗，佢點算？我喺度諗好多呢啲嘢，跟住我就諗游埋呢次真係算。」而方力申笑言游到接近終點時，見到有人即有種「迴光返照」的感覺，才開始有返力氣。\n 相關閱讀：方力申自豪女兒Isla將來係Party Girl 坦言：呢啲一定唔係遺傳我 網民讚節奏感強具音樂天分","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"方力申渡海泳｜出戰前遭老婆葉萱訓話 曾出現負面情緒凍到腳震頭痛 游到最後迴光返照：今次真係辛苦","url":"https://www.stheadline.com/film-drama/3639675/方力申渡海泳出戰前遭老婆葉萱訓話-曾出現負面情緒凍到腳震頭痛-游到最後迴光返照今次真係辛苦","source_display":"星島頭條","published_at":"2026-11-21T21:00:00+08:00","category":"生活","digest":"方力申參與慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」…"},{"title":"方力申渡海泳｜無懼嚴苛考驗挑戰35公里 獲太太母親溫馨送行 登岸無縫接力開騷","url":"https://www.stheadline.com/realtime-sport/3639582/方力申渡海泳無懼嚴苛考驗挑戰35公里-獲太太母親溫馨送行-登岸無縫接力開騷","source_display":"星島頭條","published_at":"2026-11-21T13:57:17+08:00","category":"生活","digest":"前香港奧運泳手方力申（Alex Fong）展開「凝動全城 破浪傳承：方力申港澳慈善游…"}],"cross":{"total":2,"angles":[{"point":"方力申參與慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」…","sources":["星島頭條"],"url":"https://www.stheadline.com/film-drama/3639675/方力申渡海泳出戰前遭老婆葉萱訓話-曾出現負面情緒凍到腳震頭痛-游到最後迴光返照今次真係辛苦"},{"point":"前香港奧運泳手方力申（Alex Fong）展開「凝動全城 破浪傳承：方力申港澳慈善游…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639582/方力申渡海泳無懼嚴苛考驗挑戰35公里-獲太太母親溫馨送行-登岸無縫接力開騷"}]}},{"id":"c024cfbaae0","title":"香港公開羽毛球錦標賽·混雙｜蔣魏配今年第三次與「鳳凰」會師決賽 近兩屆冠軍對決爭勝 黃東萍/馮彥哲望二連霸","url":"https://www.stheadline.com/realtime-sport/3639679/香港公開羽毛球錦標賽混雙蔣魏配今年第三次與鳳凰會師決賽-近兩屆冠軍對決爭勝-黃東萍馮彥哲望二連霸","summary":"週六（21日）國家隊混雙代表會師決賽。","summary_short":"週六（21日）國家隊混雙代表會師決賽。","digest":"週六國家隊混雙代表會師決賽","points":["週六（21日）國家隊混雙代表會師決賽","「鳳凰」組合馮彥哲/黃東萍和「蔣魏配」蔣振邦/魏雅欣分別直落兩局取勝，晉級決賽","前者淘汰大馬夫妻檔吳塤閥/賴潔敏，後者速勝來自印尼的Dejan FERDINANSYAH /…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T20:35:27+08:00","size":2,"keywords":[],"body":"週六（21日）國家隊混雙代表會師決賽。「鳳凰」組合馮彥哲/黃東萍和「蔣魏配」蔣振邦/魏雅欣分別直落兩局取勝，晉級決賽。前者淘汰大馬夫妻檔吳塤閥/賴潔敏，後者速勝來自印尼的Dejan FERDINANSYAH / Felisha Alberta Nathaniel PASARIBU。這是兩個國家隊組合今年第三次會師決賽。同時，「鳳凰」是上屆冠軍，今屆力爭衛冕；「蔣魏配」則曾在2024年香港站奪冠，當時正是戰勝了馮彥哲/黃東萍奪得冠軍。這兩對亦敵亦友的組合將再爭高下。\n「鳳凰」先入決賽等隊友匯合\n週六上午先是「鳳凰」以21:17、21:18淘汰大馬組合晉級。雖是直落兩局取勝，但今場比賽面對世界排名第12位的吳塤閥/賴潔敏，作為「世一」的馮彥哲/黃東萍贏得不算輕鬆，東萍賽後坦言：「我們雙方其實對彼此的技戰術、技術特點都很熟悉，對方今場比賽在限制和反限制上給我們製造了很多困難，因為對方也是非常有經驗的選手，能在現場視情況做出很多臨場的變化。」\n馮彥哲總結：「現在大家的比賽節奏都非常快，場上瞬息萬變，所以沒有好打的對手，還是希望和隊友會師決賽。這樣冠軍能讓中國隊來獲得。」\n「蔣魏配」有望背靠背三站奪冠\n而下午的「蔣魏配」則速度取勝回應隊友對會師決賽的期盼，耗時31分鐘，以兩局21:13拍走印尼組合Dejan FERDINANSYAH / Felisha Alberta Nathaniel PASARIBU。蔣振邦/魏雅欣連續三站賽事打進決賽，過去半個月，他們先後在韓國公開賽和熊本大師賽奪冠，加上香港站，他們已背靠背三站超級500級別賽事打進決賽，盡顯統治力。若香港站再奪冠，則將會創下500級三連霸。\n\n賽後，談到三入決賽的壯舉，蔣振邦謙虛地表示：「我們8強的對手退賽了，所以我們多了一天休息時間，但休息過後，今天開賽階段我們沒有好好地提起狀態。」魏雅欣則補充：「我認為這段時間我們整體表現還不錯，不是每一場都會出現問題，但當有問題的時候，我們能盡快地去調整還挺好的。」\n\n記者：爾郡耀","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"香港公開羽毛球錦標賽·混雙｜蔣魏配今年第三次與「鳳凰」會師決賽 近兩屆冠軍對決爭勝 黃東萍/馮彥哲望二連霸","url":"https://www.stheadline.com/realtime-sport/3639679/香港公開羽毛球錦標賽混雙蔣魏配今年第三次與鳳凰會師決賽-近兩屆冠軍對決爭勝-黃東萍馮彥哲望二連霸","source_display":"星島頭條","published_at":"2026-11-21T20:35:27+08:00","category":"生活","digest":"週六國家隊混雙代表會師決賽"},{"title":"香港公開羽毛球錦標賽·女單｜王祉怡兩局挫宮崎友花再度殺入香港站決賽 離衛冕只差一步 以賽代練為年終總決賽作準備","url":"https://www.stheadline.com/realtime-sport/3639664/香港公開羽毛球錦標賽女單王祉怡兩局挫宮崎友花再度殺入香港站決賽-離衛冕只差一步-以賽代練為年終總決賽作準備","source_display":"星島頭條","published_at":"2026-11-21T19:10:18+08:00","category":"生活","digest":"週六香港公開羽毛球錦標賽女單4強，國家隊女單一姐王祉怡直落兩局淘汰宮崎友花…"}],"cross":{"total":2,"angles":[{"point":"週六國家隊混雙代表會師決賽","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639679/香港公開羽毛球錦標賽混雙蔣魏配今年第三次與鳳凰會師決賽-近兩屆冠軍對決爭勝-黃東萍馮彥哲望二連霸"},{"point":"週六香港公開羽毛球錦標賽女單4強，國家隊女單一姐王祉怡直落兩局淘汰宮崎友花…","sources":["星島頭條"],"url":"https://www.stheadline.com/realtime-sport/3639664/香港公開羽毛球錦標賽女單王祉怡兩局挫宮崎友花再度殺入香港站決賽-離衛冕只差一步-以賽代練為年終總決賽作準備"}]}},{"id":"c69e307746b","title":"方力申抗寒挑戰35公里港澳慈善游 僅花08:37:24完成目標","url":"https://www.stheadline.com/film-drama/3639578/方力申抗寒挑戰35公里港澳慈善游-僅花083724完成目標","summary":"前香港奧運泳手方力申（Alex）今日（21日）再次挑戰極限，由凝動香港體育基金主辦的慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」今晨正式啟航。","summary_short":"前香港奧運泳手方力申（Alex）今日（21日）再次挑戰極限，由凝動香港體育基金主辦的慈善挑戰「凝動全城 破浪傳承：方力申…","digest":"前香港奧運泳手方力申再次挑戰極限…","points":["前香港奧運泳手方力申（Alex）今日（21日）再次挑戰極限…","方力申為支持基層及特殊教育需要（SEN）兒童的體育培訓…","而方力申在中午時分，已籌得逾600萬"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T17:31:53+08:00","size":2,"keywords":[],"body":"前香港奧運泳手方力申（Alex）今日（21日）再次挑戰極限，由凝動香港體育基金主辦的慈善挑戰「凝動全城 破浪傳承：方力申港澳慈善游2026」今晨正式啟航。方力申為支持基層及特殊教育需要（SEN）兒童的體育培訓，於今晨8時53分在親友的熱烈歡呼聲中，於大嶼山雞翼角孤身躍入海中，挑戰長達35公里的港澳公海橫渡，誓要刷新港澳最快橫渡紀錄，並向著總籌款目標1,000萬元全力衝刺。而方力申在中午時分，已籌得逾600萬。直到現時下午4時25分，方力申已完成29公里。\n方力申獲親友打氣\n46歲的方力申近年兼顧游泳學校生意，兼照顧女兒Isla，昨日（20日）又開心宣布太太正陀第二胎，湊夠一個「好」字。方力申今早抵達現場，見到太太葉萱（Maple）及親友現身打氣外，同時身兼凝動董事會主席弟弟方圓明，更登上隨行工作船，全程在海上為哥哥守候。\n方力申獲妻女整早餐\n方力申出發前，表示今早已身獲妻女炮製愛心早餐。面對35公里的挑戰，方力申受訪時表示經過幾個月的訓練，雖然極度艱辛，但會咬緊牙關撐過去：「35公里的海況完全是未知數，過程肯定會非常辛苦，但我同自己講一定要咬緊牙關頂過去。因為我知道，對岸有我嘅家人、有我嘅女兒Isla，還有很多需要資源嘅小朋友等住我登岸。」\n相關閱讀：方力申宣布太太再度懷孕 兩年抱兩湊夠個「好」字 打破終極外父相激動狂呼：真係仔呀\n相關閱讀：方力申爸爸缺血性中風右半身癱瘓 醫藥費高達幾十萬 發病前現三個先兆\n方力申禁穿防寒衣、不准扶船休息\n主辦單位透露方力申是次橫渡規則極為嚴苛，在整個35公里的過程中，不但不准上船或扶著任何物件休息，更被禁止穿著潛水衣、防寒衣或使用任何助浮裝備。方力申必須單憑一條泳褲、泳帽和泳鏡，橫跨香港、內地珠江口及澳門三個水域。除了要頂著湍急的深海暗流，更要時刻避開繁忙的大船航道，對方力申的體能、意志力以及抗寒能力都是極大考驗。\n方力申晚上出席慈善音樂會\n方力申完成深海橫渡後，今日傍晚將無縫接力，現身由其一手發起的「《浪接．浪》港澳群星慈善音樂會」。而今晚的音樂會陣容星光熠熠，包括胡定欣、側田、江若琳、林盛斌（Bob）、劉浩龍、小肥、陳慧敏外，更有尹光、古淖文、Kiri T、Gordon Flanders及樂隊DAZE IN WHITE等港澳兩地歌手參與。\n相關閱讀：方力申自豪女兒Isla將來係Party Girl 坦言：呢啲一定唔係遺傳我 網民讚節奏感強具音樂天分","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"方力申抗寒挑戰35公里港澳慈善游 僅花08:37:24完成目標","url":"https://www.stheadline.com/film-drama/3639578/方力申抗寒挑戰35公里港澳慈善游-僅花083724完成目標","source_display":"星島頭條","published_at":"2026-11-21T17:31:53+08:00","category":"生活","digest":"前香港奧運泳手方力申再次挑戰極限…"},{"title":"方力申抗寒挑戰35公里港澳慈善游未到半程籌逾600萬 女兒Isla成最強心靈支柱","url":"https://www.stheadline.com/film-drama/3639578/方力申抗寒挑戰35公里港澳慈善游未到半程籌逾600萬-女兒Isla成最強心靈支柱","source_display":"星島頭條","published_at":"2026-11-21T14:04:54+08:00","category":"生活","digest":"前香港奧運泳手方力申再次挑戰極限…"}]},{"id":"cefce82692a","title":"李家鼎李泳豪父子檔拍飲食節目 豪仔讚賢內助Agnes身兼六職現場打點 網民指今生修來福氣","url":"https://www.stheadline.com/film-drama/3639688/李家鼎李泳豪父子檔拍飲食節目-豪仔讚賢內助Agnes身兼六職現場打點-網民指今生修來福氣","summary":"李家鼎與兒子李泳豪近日父子檔合作經營YouTube頻道外，兩人更聯同肥媽及陸浩明為TVB拍攝全新飲食綜藝節目《家家有本美味的經》。","summary_short":"李家鼎與兒子李泳豪近日父子檔合作經營YouTube頻道外，兩人更聯同肥媽及陸浩明為TVB拍攝全新飲食綜藝節目《家家有本美…","digest":"李家鼎與兒子李泳豪近日父子檔合作經營YouTube頻道外…","points":["李家鼎與兒子李泳豪近日父子檔合作經營YouTube頻道外…","拍攝期間，李泳豪與爸爸鼎爺密密開工，而他的台灣妻子林妤謙（Agnes）更是全程貼身打點…","據知Agnes出身於台灣的高雄中產從商家庭，本身是一名資深的寵物美容師…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T23:00:41+08:00","size":1,"keywords":[],"body":"李家鼎與兒子李泳豪近日父子檔合作經營YouTube頻道外，兩人更聯同肥媽及陸浩明為TVB拍攝全新飲食綜藝節目《家家有本美味的經》。拍攝期間，李泳豪與爸爸鼎爺密密開工，而他的台灣妻子林妤謙（Agnes）更是全程貼身打點，讓李泳豪忍不住在社交平台上公開放閃，大讚老婆是不可多得的「賢內助」。\n李泳豪讚老婆Agnes貼身打點\n李泳豪在社交平台分享了拍攝花絮照片，並甜蜜寫道：「我的賢內助李太，她集統籌、助導、攝影、劇務、梳頭、化妝於一身」，相中所見，兩公婆身處電視台的化妝間，身穿粉紅色衛衣的Agnes面露甜美笑容坐在李泳豪身旁，而李泳豪則手持手機對鏡自拍，恩愛之情溢於言表。據知Agnes出身於台灣的高雄中產從商家庭，本身是一名資深的寵物美容師，曾遠赴日本深造並擔任動物醫院護士。因同樣熱愛寵物，她與李泳豪一拍即合，並於2022年結婚，婚後李泳豪多次在公開場合大讚愛妻務實、直率且廚藝精湛，連老爺鼎爺亦曾力撐新抱，大讚她斯文有禮。\n相關閱讀：李泳豪帶老婆拉頭馬 現身馬場捧盃甜蜜放閃 亡母施明骨灰順利上位家庭風波暫平息\n網民羨慕李泳豪娶得能幹太太\n李泳豪與老婆放閃後，隨即引來網民熱烈討論，大讚Agnes「裡裡外外都幫得手，又靚女，今生修來的福啊！」及「完美的夫妻」。亦有網民笑稱李泳豪是「幸福豬」，並溫馨叮囑李泳豪：「記得出糧俾賢內助啊！」此外，更有不少粉絲留意到Agnes的高雄背景，留言笑問：「幾時叫靚太教我哋做下高雄名菜？」，網民更紛紛表示十分期待鼎爺、李泳豪、肥媽與6號這個充滿火花的全新飲食組合。\n相關閱讀：李家鼎狂增18磅全面復工 欲攜李泳豪上位想父子檔做飲食節目 拒談家事：再理自己會辛苦\n李泳豪老婆Agnes曾被李泳漢禁入靈堂：","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c8d35c205e7","title":"英超｜曼城又失分 主場1：1迫和富咸 聯賽四場不勝","url":"https://www.stheadline.com/football-news/3639692/英超曼城又失分-主場11迫和富咸聯賽四場不勝","summary":"國際賽期後英超重開，曼城周六（21日）早場主場迎戰富咸，依然未能重返勝軌。","summary_short":"國際賽期後英超重開，曼城周六（21日）早場主場迎戰富咸，依然未能重返勝軌。","digest":"國際賽期後英超重開，曼城周六早場主場迎戰富咸，依然未能重返勝軌","points":["國際賽期後英超重開，曼城周六（21日）早場主場迎戰富咸，依然未能重返勝軌","「藍月亮」上半場先失一球，夏蘭特（Erling Haaland）一度破網亦因犯規被判無效…","曼城終止聯賽三連敗，卻連續四輪未嘗勝果"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T22:32:18+08:00","size":1,"keywords":[],"body":"國際賽期後英超重開，曼城周六（21日）早場主場迎戰富咸，依然未能重返勝軌。「藍月亮」上半場先失一球，夏蘭特（Erling Haaland）一度破網亦因犯規被判無效，換邊後雖憑艾利洛安達臣（Elliot Anderson）扳平，其後傾力進攻仍未能再下一城，最終只能以1：1逼和富咸。曼城終止聯賽三連敗，卻連續四輪未嘗勝果；富咸則終於結束對曼城的20連敗。\n科頓復任正選　曼城求止跌\n開季曾豪取七連勝的曼城，近期聯賽表現陷入低潮，接連不敵阿士東維拉、白禮頓及諾定咸森林，賽前排第三，落後榜首阿仙奴六分。今仗馬菲奧斯紐尼斯（Matheus Nunes）與施美安（Antoine Semenyo）因傷缺陣，菲爾科頓（Phil Foden）重返正選，卓基（Rayan Cherki）先任後備，兩翼由伊利文尼戴耶（Iliman Ndiaye）及謝利美杜古（Jérémy Doku）出擊，支援箭頭夏蘭特。\n富咸賽前雖只排第15位，但近四場聯賽取得兩勝兩和，期間曾賽和紐卡素及阿士東維拉。主帥艾比路亞續以穩守突擊應戰，中場由辛達貝治（Sander Berge）與舒亞查里斯查里斯（Shea Charles）把守中路，上輪後備建功的洛迪高梅尼斯（Rodrigo Muniz）擔正攻堅，昔日曼城青訓球員波普（Oscar Bobb）則負責在右路策動反擊。\n梅尼斯先開紀錄　夏蘭特入球被推翻\n曼城開賽後未能先拔頭籌，反而於16分鐘被富咸一次快速反擊攻破大門。波普在右路擺脫防守後橫傳，洛迪高梅尼斯禁區內接應射入死角，助客軍領先1：0。24分鐘，曼城一度以為追成平手。伊利文尼戴耶右路傳中，夏蘭特第一時間撞射被賓特尼奴（Bernd Leno）接住，隨即再伸腳補射，將門將手邊的皮球送入網內。球證起初判入球有效，但經VAR覆核後，改判夏蘭特犯規在先，入球作廢，曼城半場仍落後一球。\n安達臣扳平　換人強攻未奏效\n換邊後，曼城持續在前場施壓，終於在58分鐘把握角球攻勢，由後上的艾利洛安達臣（Elliot Anderson）起腳破網，將比數扳成1：1，重新燃起反勝希望。「藍月亮」其後接連調入卓基、阿蘭（Allan）及加華度爾（Joško Gvardiol），加強攻勢，安素費南迪斯（Enzo Fernandez）亦於85分鐘後備上陣，力圖在尾段搶下致勝一球。然而，富咸防線保持紀律，中堅艾芬格魯巴（David Affengruber）多次在禁區內作出關鍵封堵及頭槌解圍，成功抵擋主隊連番進攻。\n富咸終止對賽20連敗\n曼城最終未能將下半場的壓力轉化為勝果，主場只能與富咸踢成1：1。雖然止住聯賽三連敗頹勢，但連同今仗已四輪不勝，開季七連勝的氣勢不再。富咸則在領先下被追平，未能全取三分，但仍憑頑強防守從曼城主場帶走一分，並終結對賽20連敗的紀錄，將近期聯賽不敗走勢延續至五場。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf049a43410","title":"广西留学生“斗诗”品味中国诗词之美","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735927.shtml","summary":"中新社南宁11月21日电 (记者 黄艳梅)2026年第五届广西留学生中国诗词大赛21日在广西民族大学举行，来自广西17所高校的51名留学生选手同台“打擂”，展开一场跨越国界的诗词对话。","summary_short":"中新社南宁11月21日电 (记者 黄艳梅)2026年第五届广西留学生中国诗词大赛21日在广西民族大学举行…","digest":"2026年第五届广西留学生中国诗词大赛21日在广西民族大学举行…","points":["中新社南宁11月21日电 (记者 黄艳梅)2026年第五届广西留学生中国诗词大赛21日在广西…","本届大赛由广西高等教育学会外国留学生教育管理专业委员会主办…","团体赛以现场赛形式进行，各参赛高校派出3名留学生代表组队出战，现场竞答诗词文化知识套题"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T22:25:26+08:00","size":1,"keywords":[],"body":"中新社南宁11月21日电 (记者 黄艳梅)2026年第五届广西留学生中国诗词大赛21日在广西民族大学举行，来自广西17所高校的51名留学生选手同台“打擂”，展开一场跨越国界的诗词对话。\n\n　　本届大赛由广西高等教育学会外国留学生教育管理专业委员会主办，以“品味诗词之美传承千古文明”为主题，旨在传承和弘扬中华优秀传统文化，引导留学生感受古典诗词之美，提高来华留学生的中国文化素养。\n\n11月21日，2026年第五届广西留学生中国诗词大赛在广西民族大学举行。图为赛事现场。中新社记者 黄艳梅 摄\n\n　　大赛分为个人赛和团体赛两个环节。个人赛中，所有参赛选手在考场内单独作答；团体赛以现场赛形式进行，各参赛高校派出3名留学生代表组队出战，现场竞答诗词文化知识套题。参赛留学生来自泰国、老挝、马来西亚、缅甸、布基纳法索、法国、东帝汶等国家。\n\n　　经过角逐，阮晋禄、杨氏美仙、蔡崇裕、陈苏苏、李雄建获得个人赛一等奖；广西民族大学和广西师范大学参赛队获得团体赛一等奖。\n\n　　“中国古诗词有着无穷无尽的诗意，我被深深吸引着。”广西民族大学越南籍留学生李雄建接受中新社记者采访时说，他计划在中国攻读研究生，毕业后回越南开办汉语中心，传播中国文化。\n\n　　“中国古典诗词有着独特的韵味与文化底蕴。每读一首古诗歌，就像打开了一扇了解中国的窗。”来自广西医科大学的参赛留学生佩丽雅说，她将深入研读中国古诗词，并通过社交媒体平台进行传播，让更多人透过这扇“窗”了解中国。(完)\n\n 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c965f427da4","title":"焦浩軒《愛回家》完結後急謀出路 拍完《流行都市》兼職教健身 考獲筋膜刀證書隨時轉型","url":"https://www.stheadline.com/film-drama/3639677/焦浩軒愛回家完結後急謀出路-拍完流行都市兼職教健身-考獲筋膜刀證書隨時轉型","summary":"焦浩軒憑藉TVB處境劇《愛回家之開心速遞》中「艾頓壯」一角成功入屋，但隨著劇集大結局，他近年積極開拓第二事業，日前焦浩軒在社交平台宣布好消息…","summary_short":"焦浩軒憑藉TVB處境劇《愛回家之開心速遞》中「艾頓壯」一角成功入屋，但隨著劇集大結局，他近年積極開拓第二事業…","digest":"焦浩軒憑藉TVB處境劇《愛回家之開心速遞》中「艾頓壯」一角成功入屋，但隨著劇集大結局…","points":["焦浩軒憑藉TVB處境劇《愛回家之開心速遞》中「艾頓壯」一角成功入屋，但隨著劇集大結局…","相中的他身穿深藍色運動衫，手捧證書並對鏡頭豎起大拇指","焦浩軒透露，近年他一直兼任健身教練，希望透過伸展同筋膜放鬆…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T22:00:00+08:00","size":1,"keywords":[],"body":"焦浩軒憑藉TVB處境劇《愛回家之開心速遞》中「艾頓壯」一角成功入屋，但隨著劇集大結局，他近年積極開拓第二事業，日前焦浩軒在社交平台宣布好消息，透露自己已順利完成北京體育大學香港培訓中心的專業「筋膜刀課程」並獲頒證書。相中的他身穿深藍色運動衫，手捧證書並對鏡頭豎起大拇指。焦浩軒透露，近年他一直兼任健身教練，希望透過伸展同筋膜放鬆，為學生提供更全面的痛症改善與拉伸體驗。\n焦浩軒排滿一日行程做足11小時\n焦浩軒現時一方面要錄製《流行都市》，同時要兼顧當健身教練，已經2個月沒有放假，更壓力大到爆唇瘡。日前焦浩軒分享自己「一日行程」，早上十時已經開工教健身，經常兩節課堂後，中午他又要趕回TVB錄節目，而且要一次拍攝兩集《流行都市》，直到晚上7 時後，隨即又趕回健身房，繼續為其他學生上當天的最後一節健身課。直到晚上9時多他才終於正式下班，最讓人暖心的是，即便是晚上回到家，一身疲憊的焦浩軒，依然貼心地為媽媽進行一對一的拉筋和按摩。過程中，他一邊幫媽媽揉按一邊笑問：「你個仔乖唔乖呀？」媽媽在一旁雖然痛得直笑，但最後也甜絲絲地讚道：「細仔乖」。\n相關閱讀：焦浩軒坐前港姐大髀如官宣戀情 當年「翻版湯洛雯」現似王君馨 精通5國語言現為林盛斌員工\n「學霸」焦浩軒回港追演員夢\n焦浩軒面對轉型求生的壓力，將熱愛運動的興趣轉化為專業技能，其實焦浩軒私底下更是不折不扣的「隱形學霸」，他於 2001年隨家人移民加拿大生活，隨後入讀英屬哥倫比亞大學，以雙學士身分修畢會計及國際貿易。主修會計的他畢業後並未當上會計師，反而在 2012 年回流香港追尋童年的演員夢。現時《愛回家》完結，又未有重回《三代同糖》劇組，他亦積極開拓健身事業，近日再考獲筋膜刀證書，多方面嘗試積極轉型謀生。\n相關閱讀：「艾頓壯」焦浩軒談面臨「失業」 坦言怕中年危機 將重返《流行都市》：踢走安德尊","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c2b45683a77","title":"第十八届傅雷翻译出版奖获奖者名单在江苏南京揭晓","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735921.shtml","summary":"中新社南京11月21日电 (记者 朱晓颖)第十八届傅雷翻译出版奖获奖者名单21日在江苏南京的世界文学客厅揭晓。","summary_short":"中新社南京11月21日电 (记者 朱晓颖)第十八届傅雷翻译出版奖获奖者名单21日在江苏南京的世界文学客厅揭晓。","digest":"第十八届傅雷翻译出版奖获奖者名单21日在江苏南京的世界文学客厅揭晓","points":["中新社南京11月21日电 (记者 朱晓颖)第十八届傅雷翻译出版奖获奖者名单21日在江苏南京的…","要颖娟凭借译作《瘟疫与霍乱》摘得文学类奖项，吴子枫凭借译作《写给非哲学家的哲学入门》获得社科…","新人奖由王睿琦获得，获奖译作是《拟像与拟真》"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:53:36+08:00","size":1,"keywords":[],"body":"中新社南京11月21日电 (记者 朱晓颖)第十八届傅雷翻译出版奖获奖者名单21日在江苏南京的世界文学客厅揭晓。要颖娟凭借译作《瘟疫与霍乱》摘得文学类奖项，吴子枫凭借译作《写给非哲学家的哲学入门》获得社科类奖项；新人奖由王睿琦获得，获奖译作是《拟像与拟真》。\r\n\n　　南京是联合国教科文组织(UNESCO)授予“世界文学之都”称号的城市，本届傅雷翻译出版奖颁奖典礼落地南京。\n\n　　法国驻华大使馆公使白美燕在致辞中表示：“书籍之所以能够跨越语言的界限，甚至远渡重洋，来到距离作者数千公里之外的地方，比如中国，抵达新的读者手中，是因为在作者与读者之间有人在进行默默无闻却至关重要的工作，那就是翻译。”\n\n　　法国作家、龚古尔文学奖得主让-巴蒂斯特·安德烈亚认为，译者的工作充满挑战，既要契合作者的声音、表达风格，又要适应目的国的文化背景、语言习惯，译者的角色、工作目的就是实现和谐。\n\n　　傅雷翻译出版奖为纪念翻译家傅雷而得名。作为法译中文学先驱，傅雷曾翻译过巴尔扎克、伏尔泰、罗曼·罗兰、普罗斯佩·梅里美的著作。\n\n　　2009年，在法国驻华大使馆和以北京大学法国文学教授、作家、翻译家董强为代表的中国法语界学者的推动下，傅雷翻译出版奖坚持每年评选出当年的最佳法译中图书作品，以表彰译者的工作及法语译著对中国文坛和知识界的影响。(完) 【编辑:付子豪】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb8bb27395e","title":"天氣｜多區氣溫入夜後跌破20度大致多雲 料明早市區最低約19度","url":"https://news.tvb.com/tc/1207658-天氣多區氣溫入夜後跌破20度大致多雲料明早市區最低約19度","summary":"一股清勁至強風程度的偏東氣流，預料會在晚間逐漸影響廣東沿岸。本港大致多雲，多區氣溫入夜後跌至20度以下。","summary_short":"一股清勁至強風程度的偏東氣流，預料會在晚間逐漸影響廣東沿岸。","digest":"一股清勁至強風程度的偏東氣流，預料會在晚間逐漸影響廣東沿岸","points":["一股清勁至強風程度的偏東氣流，預料會在晚間逐漸影響廣東沿岸","本港大致多雲，多區氣溫入夜後跌至20度以下","在西九文化區，不少外出的市民都穿上外套保暖"],"section":"生活","category":"天氣","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T21:38+08:00","size":1,"keywords":[],"body":"一股清勁至強風程度的偏東氣流，預料會在晚間逐漸影響廣東沿岸。\n\n本港大致多雲，多區氣溫入夜後跌至20度以下。在西九文化區，不少外出的市民都穿上外套保暖。預測明早市區最低氣溫約19度，新界再低兩三度，日間最高氣溫約23度。\n\n展望周一多雲，初時風勢仍然頗大。預料東北季候風周二抵達華南沿岸，下周中期氣溫下降及有幾陣雨。","image":"https://pro-vod-cdn.tvb.com/6bae7266b65d4b0d8cc2b3d37ea88535/snapshots/1d975d796dbb4ad7b3583afb7d035941-00004.jpg","video":"https://pro-vod-cdn.tvb.com/6bae7266b65d4b0d8cc2b3d37ea88535/2bc8668ae9264d0cb0d3f97886f8a583-cd858b39dfbb38a842cc31b0fb27b371-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/6bae7266b65d4b0d8cc2b3d37ea88535/snapshots/1d975d796dbb4ad7b3583afb7d035941-00004.jpg","lang":"zh-Hant"},{"id":"cf4a6fa1dd6","title":"欖球｜香港欖球總會迎首位華人主席 望加強運動本土化 呼籲市民支持欖球運動","url":"https://www.stheadline.com/realtime-sport/3639686/欖球香港欖球總會迎首位華人主席-望加強運動本土化-呼籲市民支持欖球運動","summary":"中國香港欖球總會（欖總）9月公布迎來首位華人主席，黎志豪主席藉2026年世界欖球國家盃首次在香港進行的機會，在啟德青年運動場面見記者，談作為欖總首位華人主席的感受及未來的願景。","summary_short":"中國香港欖球總會（欖總）9月公布迎來首位華人主席，黎志豪主席藉2026年世界欖球國家盃首次在香港進行的機會…","digest":"中國香港欖球總會9月公布迎來首位華人主席…","points":["中國香港欖球總會（欖總）9月公布迎來首位華人主席…","黎志豪說作為首個華人主席感受相當特別，說認為華人主席的當選，反映本地持份者…","作為欖總首個華人主席當選，黎志豪指會利用對於香港本地的認識和本地的人脈網絡…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T21:33:27+08:00","size":1,"keywords":[],"body":"中國香港欖球總會（欖總）9月公布迎來首位華人主席，黎志豪主席藉2026年世界欖球國家盃首次在香港進行的機會，在啟德青年運動場面見記者，談作為欖總首位華人主席的感受及未來的願景。\n香港欖球總會首位華人主席黎志豪。爾郡耀攝\n望促進香港欖球本地化\n黎志豪說作為首個華人主席感受相當特別，說認為華人主席的當選，反映本地持份者，對欖球本地化有期望。希望日後可以促進與不同的學校、政府單位及商界加強合作。作為欖總首個華人主席當選，黎志豪指會利用對於香港本地的認識和本地的人脈網絡，繼續發展好香港欖球。他又冀望更多年輕人可以參與欖球運動，從中得到很多正面的能量和積極的價值觀。\n香港欖球登上國際舞台\n回望74年香港欖球發展，黎志豪說香港欖球的國際化做得相當成功，男子代表隊在名古屋亞運獲得第三面金牌、女子代表隊兩次贏得銅牌，可見香港隊伍在國際賽場上優秀的成績。明年男子代表隊終於有機會代表中國香港到澳大利亞參與世界盃，他直言這是一個里程碑，說港隊的出賽代表香港欖球已達世界最高水平的舞台上。\n世界欖球總會在港舉辦盛事\n黎志豪指出湯加的女子代表隊首次離開大洋洲到外地比賽，表示非常開心，亦很榮幸迎接他們來到啟德的香港主場。這亦是世界欖球總會的女子國際賽事首次帶到香港。他盛讚香港女子代表隊在和東加隊的比賽中有精彩的表現，對本地女子球員和球迷十分鼓舞。\n談港隊中華裔球員的稀少\n被問到作為華人主席，怎麼吸納更多華人球員進入本地欖球一隊或成人隊，改善港隊中華裔球員的稀少性，黎志豪回答未來香港欖球將會深入不同本地學校，從少年的人才發掘，推出更多鼓勵本地辦學團體推行欖球運動的項目。他指受限於文化因素，過往參與欖球的學校更多是國際學校。但他認為本地學生同樣適合參與欖球運動，將在明年欖總75週年配合推行更多推廣計劃，請大家悉目以待。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c4eb8a1a974","title":"半部全唐诗咏长安，今天我们为何还要读诗？","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735915.shtml","summary":"西安网评：半部全唐诗咏长安，今天我们为何还要读诗？","summary_short":"西安网评：半部全唐诗咏长安，今天我们为何还要读诗？","digest":"西安网评：半部全唐诗咏长安，今天我们为何还要读诗","points":["11月19日，“何以中国・诗词里的千年文脉”网络主题宣传活动在陕西大剧院启幕","以诗词为脉络，以长安为舞台，多维度、立体化的传播，把流淌在三秦大地的千年文脉一寸寸铺展开来","《全唐诗》收录存世诗作近5万首，其中涉长安、咏长安、作于长安的篇目超过2万首…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T21:17:10+08:00","size":1,"keywords":[],"body":"西安网评：半部全唐诗咏长安，今天我们为何还要读诗？\n\n　　11月19日，“何以中国・诗词里的千年文脉”网络主题宣传活动在陕西大剧院启幕。以诗词为脉络，以长安为舞台，多维度、立体化的传播，把流淌在三秦大地的千年文脉一寸寸铺展开来。一场活动，也把一个并不新鲜却时常被忽略的问题重新摆到了台面上：今天我们为什么还要读诗？\n\n　　答案，其实早就写在长安城里。《全唐诗》收录存世诗作近5万首，其中涉长安、咏长安、作于长安的篇目超过2万首，“长安”二字在全诗集中出现1400余次，说“一座长安城，半部全唐诗”，并不夸张。作为唐朝的都城，长安曾是天下士子心心念念的去处：曲江宴饮，雁塔题名，灞桥折柳，诗人们把抱负、乡愁、聚散都留在了这座城的街巷与山水之间。城给了诗以气象，诗还了城以灵魂。千百年过去，城墙还在，雁塔还在，那些诗句也还在，它们一同构成了这座城市最耐读的底色，也构成了中国人共有的精神原乡。\n\n　　以诗为钥，读懂一座城的精神密码。读懂长安，只看遗址、只看碑刻还不够，还得读诗。“长安一片月，万户捣衣声”，写的是盛世的安宁；“朱门酒肉臭，路有冻死骨”，写的是诗人的良心；“春风得意马蹄疾，一日看尽长安花”，写的是少年人的意气。同一座城，在不同诗句里有不同的面孔，这些面孔拼在一起，才是一个完整的、有温度的、可亲近的长安。文化自信从来不是一句空话，它就藏在这些读得懂、传得开的句子里。\r\n\n　　以诗化人，让经典回到烟火人间。文脉要传下去，不能只躺在典籍里。近年来，经典诵读、诗词大会、诗词进校园进社区等活动在各地陆续开展，越来越多的孩子能熟练背出“慈母手中线”，也有越来越多的年轻人在旅途上随口念一句“春风十里”。诗词的门槛其实不高，它写的就是普通人的喜怒哀乐：思乡、离别、相逢、守岁。让诗词从课本走向生活，从考卷走向街巷，从“要求背”变成“愿意读”，文脉才算真正接上了地气。文化传承最怕曲高和寡，最好的状态是润物无声。一句诗被一个孩子记住，可能就是一颗种子落了地；十年之后，它会在某个时刻忽然发芽。\n\n　　以诗为桥，让文脉抵达更远的地方。诗词是中华文化最有辨识度的名片之一。“海内存知己，天涯若比邻”，不必逐字翻译，也能让人感到暖意；“但愿人长久，千里共婵娟”，跨越语言，仍能相通。这些年，中国古典诗词在海外收获了不少读者，一些外国朋友正是从一首诗开始，对中国的历史和文化生出兴趣。以诗为媒，讲的是中国人的宇宙观、家国情、人情味，传递的是一个可亲、可敬、可信的中国形象。文明交流互鉴，很多时候就是从一句诗、一个典故、一段吟诵开始的。诗短，情长，这样的交流最省力，也最走心。\n\n　　千年文脉不是博物馆里的标本，它需要有人读、有人讲、有人接着往下写。“何以中国・诗词里的千年文脉”主题宣传活动，与其说是一次集中展示，倒不如说是一次郑重的邀约：邀请更多人走进诗里，认识一个更有底蕴的中国；也邀请这座古老的城市，把文脉的火种稳稳递到下一个千年。(西安网特约评论员王济川) 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c6c2a95728b","title":"傳奇馬王榮休｜「浪漫勇士」退役將赴澳洲生活 練馬師不捨稱感覺如家人離別","url":"https://news.tvb.com/tc/1207656-傳奇馬王榮休浪漫勇士退役將赴澳洲生活練馬師不捨稱感覺如家人離別","summary":"馬會周日會在沙田馬場，為前馬王「浪漫勇士」舉行榮休歡送儀式。馬主希望這匹傳奇馬王永遠留在馬迷心中。","summary_short":"馬會周日會在沙田馬場，為前馬王「浪漫勇士」舉行榮休歡送儀式。","digest":"馬會周日會在沙田馬場，為前馬王「浪漫勇士」舉行榮休歡送儀式","points":["馬會周日會在沙田馬場，為前馬王「浪漫勇士」舉行榮休歡送儀式","馬主希望這匹傳奇馬王永遠留在馬迷心中","「浪漫勇士」輝煌生涯在2021年開始，首季八出七捷，包括攻下「打吡大賽」"],"section":"生活","category":"體育","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T21:11+08:00","size":1,"keywords":[],"body":"馬會周日會在沙田馬場，為前馬王「浪漫勇士」舉行榮休歡送儀式。馬主希望這匹傳奇馬王永遠留在馬迷心中。練馬師沈集成指，感覺與兒子離別一樣。\n\n「浪漫勇士」輝煌生涯在2021年開始，首季八出七捷，包括攻下「打吡大賽」。\n\n「浪漫勇士」練馬師沈集成憶述：「其實牠一開始出賽已經很厲害，在跑馬地馬場12檔起步都贏，如果不是馬王的級數，差不多是不可能實現的。」\n\n第三季開始遠征之旅，接連攻下澳洲「覺士盾」、日本「安田紀念」，再遠征迪拜贏馬，成為首匹香港賽駒贏四地一級賽。「沙特盃」跑第二，是牠最後一次遠征。\n\n沈集成說：「雖然輸了少少，不是完美，但是你們會感覺到，我們已出盡全力了。有拼搏的精神，我覺得已經是『收貨』。」\n\n「浪漫勇士」馬主劉栢輝稱：「最適合的形容，就是我真正明白甚麼是雖敗猶榮。第一次和世界第一的泥地王跑，輸個馬鼻，我對他的表現是萬分滿意。」\n\n「浪漫勇士」去年五月受傷，左前腿手術要鑲螺絲，復出後仍六戰全勝，但之後再一次發現腳部問題，馬主決定讓「浪漫勇士」光榮退役。練馬師指，感覺像一位家人離去，想過退休。\n\n沈集成表示：「牠給我很大的動力，我早返工不要緊，早上見到牠，我就很開心。感覺是不想工作、想退休，(心情)很複雜，曾跟老婆商量過退休，沒甚麼動力令我繼續工作。」\n\n劉栢輝指出：「由去年五月，第一口螺絲鑲下後，其實心裡面已有些準備。現在退役，我們覺得是可以名正言順地說是華麗榮休。」\n\n除了接下來的周日，馬會將於12月國際賽日，再安排「浪漫勇士」在沙田馬場公開亮相，退役後會到澳洲悉尼，在最佳拍檔麥道朗安排的牧場中過退休生活。\n\n沈集成說：「『浪漫勇士』不是最叻，未必是潛力最強，但一定是最偉大，因為牠的鬥心是無比的，是很堅強地克服，不知道應否這樣形容，但牠真的有香港精神。」\n\n劉栢輝稱：「我希望每一名馬迷，在未來見到那一件湖水綠、倒三角綵衣時，腦海中會飄出一些『浪漫勇士』以往的片段。」","image":"https://pro-vod-cdn.tvb.com/032134f133d14594a4c9b45f0a1aff1d/snapshots/70f069506d694aeca6261372733e26b7-00008.jpg","video":"https://pro-vod-cdn.tvb.com/032134f133d14594a4c9b45f0a1aff1d/671653e476a04c1f945dcc4adefd9f66-5bc19ad1aa0b11320bf59e0337815974-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/032134f133d14594a4c9b45f0a1aff1d/snapshots/70f069506d694aeca6261372733e26b7-00008.jpg","lang":"zh-Hant"},{"id":"cb001b21109","title":"2026年世界泳联中国游泳日哈尔滨主会场活动举行","url":"https://www.chinanews.com/ty/shipin/cns-d/2026/11-21/news1075675.shtml","summary":"11月21日，2026世界泳联中国游泳日哈尔滨主会场开赛，本次活动由世界泳联指导，中国12个主会场同步启动。","summary_short":"11月21日，2026世界泳联中国游泳日哈尔滨主会场开赛，本次活动由世界泳联指导，中国12个主会场同步启动。","digest":"11月21日，2026世界泳联中国游泳日哈尔滨主会场开赛，本次活动由世界泳联指导…","points":["11月21日，2026世界泳联中国游泳日哈尔滨主会场开赛，本次活动由世界泳联指导…","在哈尔滨，来自黑龙江省各地的44支参赛队伍逐浪碧波、以赛会友，与全国各地泳坛健儿共赴亲水之约","本次活动暨全国第二届学生(青年)运动会游泳项目黑龙江选拔赛…"],"section":"生活","category":"生活","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T20:50:35+08:00","size":1,"keywords":[],"body":"11月21日，2026世界泳联中国游泳日哈尔滨主会场开赛，本次活动由世界泳联指导，中国12个主会场同步启动。在哈尔滨，来自黑龙江省各地的44支参赛队伍逐浪碧波、以赛会友，与全国各地泳坛健儿共赴亲水之约。本次活动暨全国第二届学生(青年)运动会游泳项目黑龙江选拔赛，为2027年学青会预选赛选拔后备人才，助力黑龙江搭建游泳人才梯队、推进体教融合。(制作 田德雨 视频来源 黑龙江省体育局）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/9229698819594E27B57AA1C6DBB82178.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c9062969271","title":"舞剧《红山》让5000余年史前文明“活”起来","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735879.shtml","summary":"中新网沈阳11月21日电 (记者 李晛 )21日晚，原创民族舞剧《红山》在沈阳展演。","summary_short":"中新网沈阳11月21日电 (记者 李晛 )21日晚，原创民族舞剧《红山》在沈阳展演。","digest":"21日晚，原创民族舞剧《红山》在沈阳展演","points":["中新网沈阳11月21日电 (记者 李晛 )21日晚，原创民族舞剧《红山》在沈阳展演","灯光亮起处，5000多年前的红山文明，踏着舞步与当代观众相逢","辽宁朝阳牛河梁遗址是它最具代表性的遗存，距今约5800年至5200年"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:36:58+08:00","size":1,"keywords":[],"body":"中新网沈阳11月21日电 (记者 李晛 )21日晚，原创民族舞剧《红山》在沈阳展演。灯光亮起处，5000多年前的红山文明，踏着舞步与当代观众相逢。\n\n　　红山文化发源于西辽河流域，是中华文明起源阶段的重要文化之一。辽宁朝阳牛河梁遗址是它最具代表性的遗存，距今约5800年至5200年。舞剧《红山》以牛河梁遗址为创作原点，通过“玉碎”“求援”“祈雨”“洪殇”四个篇章，叙写先民寻玉守土、琢玉兴邦的史诗。\n\n11月21日晚，原创民族舞剧《红山》在沈阳展演。李晛 摄\n\n　　该剧为国家艺术基金2026年度大型舞台剧和作品创作资助项目，同时获批辽宁省文艺精品创作生产专项资金扶持项目，亦是沈阳音乐学院“双一流”建设重点项目。自2025年首演以来，先后赴多地巡演，收获广泛好评。11月21日至22日在沈阳连演两场，剧目在舞蹈语汇、舞台光影、配乐节奏上进一步精修提升，叙事层次更细腻。\n\n　　演出现场，图腾流转，衣袂飞扬，舞者肢体舒展起伏，把先民对天地的敬畏、对玉石的求索、部族之间守望相助的深情娓娓道来，遥远晦涩的史前文明变得可感可触。\n\n　　如何让沉睡的文物化为舞台上流动的叙事？舞剧《红山》总导演王海峰说，主创团队没有简单复刻文物外形，而是从“玉人”“玉猪龙”等文物造型中“抠”动作，提炼出“屈肘擎物”“趋步拜祭”等核心语汇，把坛、庙、冢的空间关系转化为舞台调度，让文物在舞者的身体上“活”过来。\n\n11月21日晚，原创民族舞剧《红山》在沈阳展演。李晛 摄\n\n　　“舞剧《红山》更像一场文明的当代转译。”王海峰表示，希望借由舞蹈，让观众读懂“南良渚、北红山”背后，中华文明多元一体的深厚底色。\n\n　　“没有台词，我却看懂了。”来自马来西亚的在辽留学生林凯轩说，艺术是无国界的语言，玉猪龙、祭天礼俗等独特文化符号极具东方特色，这场演出让他真正触摸到了中华史前文明的温度。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c59c086bfd6","title":"LCSD公開劍擊錦標賽｜女佩一周前創歷史奪世界盃團體銅牌 大師姐歐倩瑩寫包單：不是『僅此一次」 睇好師妹有力爭奧運資格","url":"https://www.stheadline.com/realtime-sport/3639678/LCSD公開劍擊錦標賽女佩一周前創歷史奪世界盃團體銅牌-大師姐歐倩瑩寫包單不是僅此一次-睇好師妹有力爭奧運資格","summary":"香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌，大師姐兼助教歐倩瑩周六以玩票性質參加康文署LCSD公開劍擊錦標賽，她表示替團隊開心，有信心師妹們不是「一次性」的成績，預告會繼續創造歷史…","summary_short":"香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌，大師姐兼助教歐倩瑩周六以玩票性質參加康文署LCSD公開劍擊錦標賽…","digest":"香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌…","points":["香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌…","LCSD公開劍擊錦標賽周六一連兩天在體院劍擊訓練場舉行，首天進行了女花及女佩個人賽…","開羅站世界盃的的突破（包括16強擊敗「世二」兼應屆世界冠軍匈牙利）…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T20:33:36+08:00","size":1,"keywords":[],"body":"香港女佩隊本月中在開羅舉行的世界盃女團賽歷史性奪得銅牌，大師姐兼助教歐倩瑩周六以玩票性質參加康文署LCSD公開劍擊錦標賽，她表示替團隊開心，有信心師妹們不是「一次性」的成績，預告會繼續創造歷史，明年四月展開的洛杉磯奧運周期，她有信心師妹們有力爭取奧運參賽資格。\nLCSD公開劍擊錦標賽周六一連兩天在體院劍擊訓練場舉行，首天進行了女花及女佩個人賽，去年失落香港主辦的全運會後開始一半退居「幕後」，以自身的大賽經驗協助師妹們成長，包括在今次LCSD的比賽，她給自己的目標是至少入到八強，她做到了（八強以12:15負梁洛文），她說：「其實我現在在女佩隊的任務，是提高難度給她們，好似在這個比賽，她們理應贏我的。」\n本月中歷史性贏得世界盃女佩團體銅牌的功臣（包括薛雅齊（Summer Fay)、劉綺程、曾悅澄及朱詠翹）已全數返港，除了Fay 因手肘傷缺席外，其餘全數參加周六LCSD的比賽。\n對於明年四月展開的洛奧計分周期，歐倩瑩表示：「南韓籍教練（李旭宰，曾帶領南韓男佩奪2012倫敦奧運團體金牌）三年前開始執教我們時，他已定下目標，就是要衝洛奧的參賽資格，除了現有的出戰成人組的隊員外，年青的還有不少具潛質的，我覺得是有機會衝奧的。」\n開羅站世界盃的的突破（包括16強擊敗「世二」兼應屆世界冠軍匈牙利），隊中四位成員都是都是18至25歲的年輕代表，歐倩瑩表示這是十分健康的接軌，証明女佩的青少年班底也是高水平。\n三位世界盃創歷史的女佩劍手劉綺程、曾悅澄及列後備的朱詠翹也表示這面團體銅牌給予他們好大信心，至少現在敢去想爭取奧運資格，他們不約而同表示：「這面世界盃獎牌給予我們好大信心，之前一直都覺得我們可以贏到，但總是爭幾分，現在真是贏到一些高水平的隊伍，增強信心，知道我們也可以做到，現在距離奧運積分周期還有幾個月，希望將勢頭一直保持下去，奧運名額一定有希望的。」\n比賽方面，應屆亞洲U23冠軍薛雅致在決賽以15:12險勝劉綺程，朱詠翹及年僅18歲的曾悅澄分別16強止步，後者以15:11不敵世界盃銅牌隊友劉綺程。\n薛雅致首奪LCSD女佩冠軍\n女佩冠軍由應屆亞洲U23女佩個人賽金牌得主薛雅致（Jane）首奪LCSD冠軍，賽後激動大叫，亦忍不住開心的眼淚，她認為唯一美中不足是在體院進行今站比賽，不設觀眾入場，父母及家姐薛雅齊沒法到場看她奪冠，但開心繼本賽衛冕的家姐守住冠軍位置。\n女子花劍冠軍由大師姐鄭曉為（左二）奪得。徐嘉華攝\n鄭曉為在比賽中大腿後肌抽筋.\n女花大師姐鄭曉為頂住大腿後肌抽筋及發燒奪冠\n女子花劍方面，大師姐鄭曉為頂住發燒及途中出現大腿後肌抽筋，在決賽落後下以15:10反勝師妹黃諾頤。曉為賽後表示開心見到自己的「堅持」及「贏到自己」：「剛在保加利亞回來香港只有幾天，身體不是好舒服，在比賽途中（四入二時）在落後下曾想過放棄，但提醒自己要集中去打，於是頂下去，我開心不是個獎，而是自己的堅持及『贏到自己』。」雙季軍是吳佳蔚及樊寶懿。\n記者/攝影：徐嘉華","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ca544375ee9","title":"“CMG电影文化嘉年华·成都专场”启动 聚焦“电影+”经济消费新业态","url":"https://www.chinanews.com.cn/cul/2026/11-21/10735877.shtml","summary":"中新网成都11月21日电 20日在成都启动的“CMG电影文化嘉年华”活动，围绕“电影+”创新设计，推出以“金秋电影季”为主题的系列活动，充分聚焦“电影+”经济消费新业态。","summary_short":"中新网成都11月21日电 20日在成都启动的“CMG电影文化嘉年华”活动，围绕“电影+”创新设计…","digest":"20日在成都启动的“CMG电影文化嘉年华”活动，围绕“电影+”创新设计…","points":["中新网成都11月21日电 20日在成都启动的“CMG电影文化嘉年华”活动…","他们分享从业感悟，认为影视创作当以精品为标尺，讲好中国故事重在直抵人心…","该活动通过在社区、学校、商圈、工业遗址地等多场景搭建流动影院，为市民免费放映经典影片…"],"section":"生活","category":"生活","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T20:32:46+08:00","size":1,"keywords":[],"body":"中新网成都11月21日电 20日在成都启动的“CMG电影文化嘉年华”活动，围绕“电影+”创新设计，推出以“金秋电影季”为主题的系列活动，充分聚焦“电影+”经济消费新业态。\n\n活动开幕现场。　主办方供图\n\n　　活动现场，演员赵雅芝、魏翔、邓嘉(邓家佳)获聘“电影文化推广大使”。他们分享从业感悟，认为影视创作当以精品为标尺，讲好中国故事重在直抵人心，唯有用心打磨贴近生活的角色，方能传递中国人独有的精神情怀。两部电影新片《二手球星》《循环街区》同场推介。\n\n　　“CMG电影文化嘉年华·成都专场”三个分会场同步开启。郫都区的光影文化市集、高新区的动画电影产业孵化宣介会、成华区的露天电影院，把三千年蜀地变成可逛的市集、可展示的平台、可珍藏的非遗、可体验的电影科技。\n\n　　“电影文化嘉年华——公益放映进基层”活动同日启动。该活动通过在社区、学校、商圈、工业遗址地等多场景搭建流动影院，为市民免费放映经典影片，打通电影文化公共服务进基层的“最后一公里”。\n\n　　多个“电影+”融合发展成果在活动现场发布。中广影视卫星有限责任公司与成都传媒产业集团签署合作协议，双方将在成都打造电影IP潮玩中心，激活电影IP价值，壮大数字文创产业。同日成立的数字影视产业联盟(成都)，发布首批11家成员单位，该联盟将充分利用AIGC、虚拟制片、超高清等前沿技术，持续拓宽影视创作边界，集聚行业合力、共建数字影视创新沃土。\n\n活动现场。　主办方供图\n\n　　成都是全国首批“电影+”消费综合试点城市。新明电影院打造电影轻博物馆，糖画、蜀绣等非遗在光影中焕发新生；奎星楼街旧教室改造成电影主题餐厅，让“边看电影边吃火锅”成为消费新时尚；王府井电影城银幕内外皆课堂，影院成为孩子假期的研学基地。\n\n　　活动由国家电影局指导、中央广播电视总台与成都市人民政府联合主办。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c67fdb6d337","title":"姚兵自揭生活艱難零家用 曾靠老婆貼錢追夢感謝不離不棄 因一舉動得罪主持痛失機會","url":"https://www.stheadline.com/film-drama/3639633/姚兵自揭生活艱難零家用-曾靠老婆貼錢追夢感謝不離不棄-因一舉動得罪主持痛失機會","summary":"TVB節目《中年好聲音4》的「白羊君」姚兵，近日接受YouTube頻道《橙色大笨象 Orange Elephant》訪問，大談追逐演藝夢的艱辛，姚兵更提到太太從拍拖到結婚，多年來不離不棄支持他追夢…","summary_short":"TVB節目《中年好聲音4》的「白羊君」姚兵，近日接受YouTube頻道《橙色大笨象 Orange Elephant》訪問…","digest":"TVB節目《中年好聲音4》的「白羊君」姚兵…","points":["TVB節目《中年好聲音4》的「白羊君」姚兵，近日接受YouTube頻道《橙色大笨象 Oran…","姚兵在訪問中，提到自己已婚：「呢幾年我係好多謝、好多謝我太太","其實我想講俾所有男人聽嘅一件事，呢個就係，做一個乖男人呢…"],"section":"生活","category":"生活","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T20:30:35+08:00","size":1,"keywords":[],"body":"TVB節目《中年好聲音4》的「白羊君」姚兵，近日接受YouTube頻道《橙色大笨象 Orange Elephant》訪問，大談追逐演藝夢的艱辛，姚兵更提到太太從拍拖到結婚，多年來不離不棄支持他追夢，甚至花儲蓄及補貼姚兵，成為其經濟支柱。\n姚兵獲太太支持追夢\n姚兵在訪問中，提到自己已婚：「呢幾年我係好多謝、好多謝我太太。其實我想講俾所有男人聽嘅一件事，呢個就係，做一個乖男人呢，其實千祈唔好太多出面嘅迎合（應酬）呢樣嘢。」姚兵自爆有一段時間，由於生活艱難，不但沒有給予家用，更要太太作為經濟支柱：「其實呢幾年係搵唔到咩錢㗎啦。老婆係一路幫我儲、支持呢啲錢係儲返落嚟。其實呢幾年我係，我（俾）屋企一毫子都無拎返去。佢都係每個月，俾錢我使，呢個就係最好嘅支持啦！」姚兵稱自己好實際，不會只用言語感謝太太：「呢啲嘢全部都係好虛華（浮誇）嘅呢啲嘢嚟㗎。但係依家呢個係最實際嘅，同埋依家都係一路支持緊我。」\n相關閱讀：中年好聲音4丨蒙面歌手全揭曉 「貓女郎」劉佩玥揮別猙獰表情獻唱 「白羊君」姚兵爆笑認瀟灑\n姚兵學唱歌被學校走數\n姚兵早在17、18歲時已涉足社會，卻因從小熱愛唱歌，想提升歌藝而受騙：「係我兩年嘅人工就全部俾晒呢個學校，咁跟住落嚟呢個學校就突然之間搬咗，其實係呃人嘅。嗰時我哋通信都唔係好、好發達啦，全部都係睇報紙㗎嘛。打小廣告，就係。我就睇咗呢個廣告：『啊，北京呢啲學校』﹛嗰時已經係知自己識唱歌㗎啦。我就是想搵一個地方提升、提升下一自己嘅呢啲唱歌水平。嗰個打擊係好大嘅，20歲都未到，好似人人、人生就……就謝咗，成個人就謝咗啦。」\n姚兵曾年少輕狂得罪人\n姚兵後來到寧波電視台參加歌唱比賽，在當地漸漸建立起名氣，卻因年少輕狂，不懂收斂情緒，而得罪節目主持。當時有位主持在台下拍打姚兵的頭，讚賞他唱得不錯。姚兵卻面露不悅：「我啱啱就做好頭、頭髮嘛，我有髮型㗎嘛，佢咁樣做，就整到我好烏糟邋遢。咁我就話：『我說，你幹嘛呀？你這個手腳能不能稍微這個乾淨一點？』」卻因此得罪對方，而失去亮相機會。經一事長一智，姚兵學懂收歛，不能輕易表露負面情緒，否則會因一個失控的舉動，摧毀之前累積的心血。\n相關閱讀：中年好聲音4｜「白羊君」攞5燈熱爆舞台 兩特點洩真身為TVB老臣子？入行前曾做巴士司機","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c941cafdefe","title":"黃劍文台慶失10萬蚊瘀事紅遍加拿大 關心妍恥笑震驚全球 曹永廉封利是定驚","url":"https://www.sth 》及《新聞女王III》，其中《驅魔》、《男臣II》及《新聞女王III》的宣傳片是首度曝光。：\n 劇集名稱 領銜主演 / 陣容 核心看點與最新預告 《驅魔速遞》 陳曉華（Hera）、周嘉洛、吳偉豪、戴祖儀 靈異驅魔結合精彩打鬥。陳曉華以冷艷黑絲速遞魔女造型登場，大晒超強腿功；戴祖儀則以「魚網High Kick」迎戰，期待值爆燈！ 《超時空男臣II》 蕭正楠、曹永廉、何廣沛 首繼續大玩搞笑穿越。三子現身銅鑼灣，以一杯「廢水」三份飲重現經典畫面，今次任務是要在現代尋找太子及公主。 《新聞女王III》 佘詩曼（飾 文慧心Man姐） 預告片以文慧心（佘詩曼飾）媽咪阮雪君（夏文汐飾）離奇失蹤揭開序幕，中間還加插了阮雪君致電Man姐求救片段，感覺緊湊。 《警是個大佬》 林盛斌、羅子溢、王敏奕、容天佑、傅嘉莉、賴慰玲、張馳豪、鄧智堅、陳若思、徐榮\n 焦點警匪大製作。黑幫龍頭高天（林盛斌 飾）遇伏重傷昏迷，靈魂意外附身於正直交通警家佑體內。家佑（羅子溢 飾）被迫遭革職並以臥底身份重返社團，在追查暗殺真相與保護高天女兒方廷（王敏奕 飾）的過程中產生微妙情愫；面對背叛社團的義子與錯綜複雜的江湖風暴，展開笑中有淚的救贖行動。 《模仿人生》 袁詠儀、江美儀、張曦雯、張振朗、羅子溢、關禮傑 慘遭凌辱墜海的魏嘉欣，被商業特務溫敏救起，整容化身設計師「許玥」潛入敵營復仇。豈料溫敏背後藏著「身分互換」的驚天秘密，許玥驚覺自己只是溫敏奪回人生的復仇棋子。\n 《枱底》 羅子溢、張振朗、陳展鵬、蔡潔、劉佩玥、陳楨怡、莊思敏及郭珮文 劇組首次採用 「虛擬拍攝 + AI 場景 + 真人拍攝」 的融合模式。富二代高偉豪（羅子溢飾）遠赴東南亞闖蕩，建立網上賭博帝國，欲將生意洗白；豈料與他並肩作戰的生死之交林家安（張振朗飾），竟是奉命剿滅他的臥底親兄弟。\n 《模範律師團》 羅嘉良、楊茜堯、陳煒、張曦雯、滕麗名、劉佩玥、何廣沛 殿堂大狀潘澤生（羅嘉良 飾）引退，引爆「首席」繼承戰！愛徒歐皓澄（楊茜堯 飾）為爭上位，與同門師姐明爭暗鬥，化身亦正亦邪的「殺人大狀」。此時，潘澤生與宿敵高淑樺（陳煒 飾）的權鬥亦白熱化。一場神秘爆炸案突然發生，揭開兩代律師驚天陰謀，正邪界線徹底崩潰！\n 返回目錄\n劇集新賽道：首開「豎屏短劇」及「迷你劇」\n迎合網絡新趨勢，TVB在2027年將開拓全新影視賽道，開拍現時在內地極之流行的豎屏短劇，頭炮作品是經典IP《金枝慾孽》番外篇《金枝慾孽之宮牆折柳》，以最爆節奏重現經典，勢必引爆全網追劇熱潮！\n1. 經典IP番外篇豎屏短劇\n首發頭炮為《金枝慾孽之宮牆折柳》，以節奏極爆的豎屏格式重現經典！\n 6大主角陣容及角色造型率先公開：陳豪、龔嘉欣、陳自瑤、倪嘉雯、阮浩棕、陳楨怡。\n\n2. 與騰訊攜手打造「重現經典」迷你劇\n除豎屏短劇，TVB來年更會與騰訊攜手打造多套迷你劇，以全新規格重現TVB經典IP，塑造神劇回憶殺。\n 《宮心計·摘星》\n\n 《重案追兇》（主打「全城同步破案」）\n\n 《衝上雲霄·愛與夢飛行》\n\n 香港重案故事系列：《龍頭篇》、《狂徒篇》、《賊王篇》\n\n返回目錄\n王牌綜藝節目：多元真人騷大混戰\n來年的綜藝節目題材極之豐富，有《家家有本美味的經》、《大丈夫步步為營》、《姐姐的契約》、《明星Body Check》、《大灣區小明星》、《鑽石戀愛計劃》以及《試真D》第三輯。當中最引爆期待的，絕對是由「金牌媒人」林盛斌主持的全新戀綜真人騷《鑽石戀愛計劃》。\n 節目名稱 主持 / 嘉賓陣容 節目亮點 《鑽石戀愛計劃》 林盛斌（Bob） 全新中年單身人士戀綜真人騷。無論是藝人還是素人，只要想「好好戀愛」都可以參加。 《姐姐的契約》 四組頂流「三高」女強人（有人年薪高達八位數） 紀錄式綜藝。探討高學歷、高收入、高職位女性在「愛情與麵包」之間的妥協與堅持。 《大丈夫步步為營》 羅子溢、洪永城 「背妻出走」旅遊特輯！深入阿壩縣、蓮寶葉則、白石崖及桑科草原等隱世靚景，羅子溢更興奮高呼「好在冇帶老婆嚟」！ 《家家有本美味的經》 李家鼎、肥媽、李泳豪、陸浩明 「真‧假父子母子檔」踩上藝人及素人家中打開「冰箱盲盒」，即興大搞無菜單料理。 其他期待作 - 《明星Body Check》、《大灣區小明星》、《試真D》（第三輯） 返回目錄\n慶典特備節目 ＆ 新聞資訊\n為迎接香港特區成立30周年及TVB 60周年，多個重量級特備節目及新聞資訊節目亦將陸續登場：\n 《藝員訓練班》：演技競賽真人騷！結合經典IP，由影帝曾志偉擔任主考官，將藝訓班直接搬上舞台同台鬥戲！\n\n 周年慶典系列：《30年的奇蹟》、《三生有幸去黐餐》、《民宿強人》、《遊戲天團》、《星廚》、《中年好聲音5》、《勁歌金曲演唱會》。\n\n 新聞台（83台）焦點：\n 《大同之路》：由陳貝兒主持，深入探討國家政策。\n\n 《醫生，你有病？》第二季：口碑醫學節目載譽歸來。\n\n TVB FF 工作室精心打造的A.I. 微動畫：《東張三俠》《社畜求生102》\n返回目錄","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"政府公布","total":9,"items":[{"id":"cafeb941dbc","title":"選管會主席巡視選舉委員會界別分組一般選舉投票站及中央點票站","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100416.htm","summary":"二○二六年選舉委員會界別分組一般選舉明日（十一月二十二日）舉行。","summary_short":"二○二六年選舉委員會界別分組一般選舉明日（十一月二十二日）舉行。","digest":"二○二六年選舉委員會界別分組一般選舉明日舉行","points":["下稿代選舉管理委員會發出：","二○二六年選舉委員會界別分組一般選舉明日（十一月二十二日）舉行","五個一般投票站將由上午九時至下午六時開放予相關界別分組的投票人／獲授權代表投票"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T19:22:00+08:00","size":1,"keywords":[],"body":"下稿代選舉管理委員會發出：\n\n　　二○二六年選舉委員會界別分組一般選舉明日（十一月二十二日）舉行。選舉管理委員會（選管會）主席陸啟康法官今日（十一月二十一日）上午在技術諮詢委員會召集人及成員的陪同下巡視設於港灣道體育館的投票站和設於香港會議展覽中心的中央點票站，並呼籲合資格投票人明日踴躍投票。\n\n　　陸啟康法官表示，二○二六年選舉委員會界別分組一般選舉的籌備工作已準備就緒，工作人員現正進行最後的準備和演練。他衷心感謝工作人員作出的努力，以確保明日的選舉可公開、誠實、公平地進行。\n\n　　選管會委員石丹理教授和文本立資深大律師今早亦分別巡視設於車公廟體育館和調景嶺體育館的投票站，隨後與陸啟康法官一同在技術諮詢委員會召集人及成員的陪同下巡視中央點票站，視察工作人員實地綵排，確保點票工作順利進行。\n\n　　在投票日，共有856名候選人競逐31個界別分組共723個席位。五個一般投票站將由上午九時至下午六時開放予相關界別分組的投票人／獲授權代表投票。投票人／獲授權代表須帶備有效的香港身份證正本，到列明於投票通知卡上其獲編配的投票站投票。\n\n　　陸啟康法官補充，是次選舉的一般投票站將繼續使用電子選民登記冊系統為投票人／獲授權代表發出選票，讓發票程序高效地進行。投票結束後，所有投票箱會運送到設於香港會議展覽中心的中央點票站進行點票。候選人、選舉代理人及監察點票代理人可以進入中央點票站，在點票區的指定範圍觀察點票過程。公眾人士和傳媒亦可在中央點票站的公眾範圍觀察點票程序。\n\n　　點票結束後，選舉主任會在中央點票站的問題選票裁決枱向候選人和代理人公布點票及選舉結果。所有當選人隨後會獲安排在新聞中心的禮台上接受祝賀。市民可在新聞中心的公眾人士區域內現場觀看過程。新聞中心的公眾席有約130個。選舉事務處將於投票日下午五時四十五分起，以「先到先得」的形式派發公眾人士入場券，額滿即止。為方便控制入場人數，進場公眾人士必須佩戴選舉事務處提供的手帶以作識別。選舉結果會張貼在新聞中心外，並透過新聞稿和選舉網站（www.elections.gov.hk）發放。\n\n　　另外，陸啟康法官亦在今日下午與政制及內地事務局局長謝小華，陪同行政長官李家超視察港灣道體育館投票站的最後準備情況。選管會及選舉事務處在各方面均已準備就緒，將全力確保明日的選舉在公平、公正、誠實和安全的環境下順利進行。\n\n　　如有查詢，可致電選舉熱線（2891 1001），或瀏覽選舉網站。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb7f28121e5","title":"​運輸及物流局局長出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃2026聯合頒奬典禮致辭","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100554.htm","summary":"以下是運輸及物流局局長陳美寶今日（十一月二十一日）出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃2026聯合頒奬典禮的致辭全文：  林船長（立法會議員…","summary_short":"以下是運輸及物流局局長陳美寶今日（十一月二十一日）出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃20…","digest":"​運輸及物流局局長出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃…","points":["時間過得很快，今日是星期六，一連七日的香港海運週十周年活動來到尾聲…","不講不知，我們自去年起已構思活動概念，有幸得到香港海運港口發展局的鼎力支持…","參與人數仍在統計中，相信很大機會超越去年的18 000人，破紀錄達到近20 000人"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T18:49:00+08:00","size":1,"keywords":[],"body":"以下是運輸及物流局局長陳美寶今日（十一月二十一日）出席「藝術貨櫃啟航」繪畫比賽暨香港傑出海事甲板及輪機實習生嘉許計劃2026聯合頒奬典禮的致辭全文：\n\n林船長（立法會議員、香港海運港口發展局人力發展委員會委員林銘鋒）、Wellington（香港海運港口發展局人力發展委員會主席顧之灝）、王處長（海事處處長王世發）、Richard（香港海事博物館主席宋睿之）、Captain Nair（香港傑出海事甲板及輪機實習生嘉許計劃工作小組主席Somasundar Nair）、Connie（東方海外貨櫃航運（中國）有限公司華南及香港區董事總經理陳軼）、Frank（現代貨箱碼頭有限公司商務總裁費恩信）、各位嘉賓、家長及同學：\n\n　　大家下午好！昨日天氣較為寒冷，今日則放晴，最適合外出活動、伸展手腳。時間過得很快，今日是星期六，一連七日的香港海運週十周年活動來到尾聲，這個壓軸活動我們亦期待已久。不講不知，我們自去年起已構思活動概念，有幸得到香港海運港口發展局的鼎力支持，有Wellington和林議員非常支持這個想法。\n\n　　今年海運週特別星光熠熠，中西匯聚，總共有超過80個機構安排了60多項活動。參與人數仍在統計中，相信很大機會超越去年的18 000人，破紀錄達到近20 000人。在海運週的最後一日舉辦這個活動實在別具意義。\n\n　　我本身不太擅長畫畫，不知道在座有多少畫家，大家不妨到海事博物館的露天展覽場地「打卡」，欣賞得獎的三個貨櫃藝術作品之餘，還有另一個貨櫃展示了其他入圍作品，當中很多都非常漂亮。特別一提，我早前已經和同事率先前來「打卡」。藝術各花入各眼，平時我們覺得貨櫃船、航運好像與大家的生活沒有太大關聯，未必會關心。透過今次的參賽作品──無論小學組、中學組或公開組──大家會發現許多香港特色。我先跟大家分享個人感受，對於當中幾個圖案有特別深刻的印象。那些貨櫃藝術包括麻將牌「一筒」；紅白藍袋的圖案配以香港的舊式街道、冰室裏的階磚；點心、海鮮產品，代表香港人喜歡的美食。如果沒有貨櫃船運送貨品，我們就不能享受這些美食。當中，我認為最特別、最有心思的貨櫃，是將香港與其他航點連結起來，構成一幅天空上星星的圖畫，希望大家接着會去看看。這幅作品加上剛才播放的短片，令我聯想起航海期間，我們於夜深的時候望向外面，或登上甲板時會看見許多星宿，這就是「航海的浪漫」。\n\n　　今年的香港海運週，除了一如以往有多項中西匯聚的活動，以吸引全球航運業人士，我們更公布了八項成果。這些成果正好切合今年的主題，就是透過伙伴港口達致信任，通過多元化發展以增強香港港口的韌性。我們不單只是簽署一些備忘錄，更希望付諸行動，「火力十足」般「連珠發炮」，務求令香港「增貨量、增價值」，以及強化協同效應，希望香港在全球航運物流及航空產業鏈中發揮強大的協同作用。\n\n　　在海運週的最後一日，我特別開心能夠來到香港海事博物館。\n\n（請同時參閱致辭的英文部分。）","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf24682b8ff","title":"教育局副局長出席「一帶一路獎學金」獲獎學生及畢業生年度交流分享會","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000332.htm","summary":"教育局今日（十一月二十一日）舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會，以協助新獲獎學生認識香港的不同機遇及擴展在地人際網絡。","summary_short":"教育局今日（十一月二十一日）舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會…","digest":"教育局舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會…","points":["教育局今日（十一月二十一日）舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會…","教育局副局長施俊輝博士及「一帶一路」專員何力治出席分享會…","施俊輝博士致辭時表示，為積極配合國家「十五五」規劃，政府已制定香港首個《五年規劃》…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T17:20:00+08:00","size":1,"keywords":[],"body":"教育局今日（十一月二十一日）舉辦「一帶一路獎學金」獲獎學生及畢業生年度交流分享會，以協助新獲獎學生認識香港的不同機遇及擴展在地人際網絡。教育局副局長施俊輝博士及「一帶一路」專員何力治出席分享會，與逾百名獲獎學生及在港發展的畢業生交流。\n\n　　施俊輝博士致辭時表示，為積極配合國家「十五五」規劃，政府已制定香港首個《五年規劃》，勾勒出未來五年本港經濟與社會發展的藍圖，並正全速落實各項措施。教育局將繼續在「一國兩制」下，鞏固並發揮香港教育高度國際化及多元化的獨特優勢，並致力在全球建立「留學香港」品牌，推廣香港高等教育，以吸引更多優秀學生和學者來港升學及從事研究。\n\n　　他說，自「一帶一路獎學金」推出以來，一直深受「一帶一路」沿線國家及地區的優秀學生，以及參與計劃的本地院校的歡迎。《行政長官2026年施政報告》宣布，該獎學金的名額將由二○二七／二八學年起增加至每年200個，讓更多傑出學生體驗香港獨特且充滿活力的中西文化薈萃特色。\n\n　　在分享會上，兩位曾獲得「一帶一路獎學金」的畢業生分享他們在香港求學和工作的經歷，以及在香港生活的體會。其中一位獲獎者指出該獎學金賦予他追求夢想的信心，又形容香港是一個充滿機遇的地方，並鼓勵所有獲獎學生主動把握這些機會。另一位獲獎畢業生表示，該獎學金讓她得以專注探索學術興趣，無須為經濟壓力而擔憂。她亦勉勵所有獲獎學生勇於挑戰自我，並在完成學業後留港發展事業。\n\n　　教育局自二○二四／二五學年起，每年為新獲獎學生舉辦交流分享會，並由二○二六／二七學年起，邀請所有在讀的獲獎學生和留港發展的畢業生參與及分享經驗，協助獲獎學生了解香港的學習、生活、升學和就業前景，並建立同儕及校友網絡。\n\n　　政府於二○一六／一七學年推出「一帶一路獎學金」，旨在鼓勵來自「一帶一路」沿線國家／地區的學生來港升學。截至二○二六／二七學年，累計超過980名來自58個「一帶一路」國家／地區的學生獲獎。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c7f5d681e3e","title":"亞洲基礎設施投資銀行簽署協定 推進在香港開設辦事處","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000492.htm","summary":"中華人民共和國政府與亞洲基礎設施投資銀行（亞投行）今日（十一月二十一日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資銀行關於在中華人民共和國香港特別行政區設立辦公室的協定》…","summary_short":"中華人民共和國政府與亞洲基礎設施投資銀行（亞投行）今日（十一月二十一日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資…","digest":"中華人民共和國政府與亞洲基礎設施投資銀行在香港簽署《中華人民共和國政府與亞洲基礎設施…","points":["中華人民共和國政府與亞洲基礎設施投資銀行（亞投行）今日（十一月二十一日）在香港簽署《中華人民…","財政司司長陳茂波和署理財經事務及庫務局局長陳浩濂出席了簽署儀式","中華人民共和國政府與亞投行分別由國家財政部部長藍佛安和亞投行行長鄒加怡代表簽署協定"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T17:11:00+08:00","size":1,"keywords":[],"body":"中華人民共和國政府與亞洲基礎設施投資銀行（亞投行）今日（十一月二十一日）在香港簽署《中華人民共和國政府與亞洲基礎設施投資銀行關於在中華人民共和國香港特別行政區設立辦公室的協定》，為亞投行在香港開設辦公室奠定基礎。財政司司長陳茂波和署理財經事務及庫務局局長陳浩濂出席了簽署儀式。\n\n　　中華人民共和國政府與亞投行分別由國家財政部部長藍佛安和亞投行行長鄒加怡代表簽署協定。該協定確定亞投行於香港設立辦公室，並為特權及豁免與其他有助成立辦公室的事宜制定原則。\n\n　　陳茂波說：「感謝國家財政部對香港特區的支持，以及亞投行對香港的信任。亞投行選擇在香港設立辦公室，充分肯定香港作為國際金融中心的地位，亦彰顯香港在匯聚國際資本、支持亞洲基礎設施建設方面的獨特角色。特區政府會全力支持辦公室的設立和運作。我們期待與亞投行加強合作，讓香港的資本市場和專業服務為其業務發展提供更大的支持，撬動更多國際資本參與亞洲基建投融資。」他表示，特區政府將按便利國際組織在港運作的一貫做法，盡早向立法會提交有關附屬法例，以正式賦予亞投行在香港辦公室所需的特權及豁免。\n\n　　此外，在同一場合，陳浩濂代表特區政府與亞投行首席夥伴合作官金憲簽署一份向「項目準備特別基金」注資2,000萬美元的協定，以展現對亞投行工作的支持。陳浩濂表示：「香港會一如既往積極支持亞投行推展其使命，並探索與亞投行進一步加強合作，尤其在發揮香港資本市場與專業服務優勢，以及在能力建設與人才培訓等方面。」\n\n　　亞投行是一家多邊發展銀行，宗旨是通過在基礎設施和其他生產性領域的投資，促進成員經濟體的可持續發展、提升其人民的生活質素，以及改善亞洲及其他地區基礎設施的互聯互通。此外，亞投行鼓勵私營資本參與投資有利於區域經濟發展的項目、企業和活動。亞投行成立了不同的基金，以推展其工作，當中包括「項目準備特別基金」。該基金的資金來源包括亞投行其中七個成員的注資，以支援發展中經濟體接受亞投行融資的部分項目的前期準備工作。中國香港於二○一七年六月成為亞投行成員。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cb7499165c3","title":"特首政策組組長出席「中國香港專題論壇：新時代港澳治理與港澳發展」開幕致辭","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100500.htm","summary":"以下是特首政策組組長黃元山博士今日（十一月二十一日）出席中國社會科學院（社科院）舉辦的「中國香港專題論壇：新時代港澳治理與港澳發展」的開幕致辭：  尊敬的馮仲平主任（社科院港澳研究中心執行主任）…","summary_short":"以下是特首政策組組長黃元山博士今日（十一月二十一日）出席中國社會科學院（社科院）舉辦的「中國香港專題論壇：新時代港澳治理…","digest":"特首政策組組長出席「中國香港專題論壇：新時代港澳治理與港澳發展」開幕致辭（只有中文）…","points":["尊敬的馮仲平主任（社科院港澳研究中心執行主任）、黃平院長（社科院香港中國學術研究院院長）…","今年總論壇的主題，是「大道之行：人類命運共同體」","學習習近平新時代中國特色社會主義思想，我體會到，構建人類命運共同體…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T16:53:00+08:00","size":1,"keywords":[],"body":"以下是特首政策組組長黃元山博士今日（十一月二十一日）出席中國社會科學院（社科院）舉辦的「中國香港專題論壇：新時代港澳治理與港澳發展」的開幕致辭：\n\n尊敬的馮仲平主任（社科院港澳研究中心執行主任）、黃平院長（社科院香港中國學術研究院院長），各位領導、嘉賓、朋友：\n\n　　大家下午好。很高興出席本次專題論壇。感謝籌辦各方搭建這個平台。\n\n　　今年總論壇的主題，是「大道之行：人類命運共同體」。《禮記》說：「大道之行也，天下為公」。二十大報告指出：「只有各國行天下之大道，和睦相處、合作共贏，繁榮才能持久，安全才有保障」。兩段話相隔兩千多年。今天借這個「行」字，談談理念怎樣落到實處。\n\n　　怎樣行？《論語》說：「己欲立而立人，己欲達而達人」。《攜手構建人類命運共同體》白皮書也談到「立己達人」之道。這與二十大報告所說的「胸懷天下」相呼應：辦好自己的事，也為世界作出貢獻。\n\n　　學習習近平新時代中國特色社會主義思想，我體會到，構建人類命運共同體，既回答「建設甚麼樣的世界」，也回答「怎樣建設這個世界」。四大全球倡議為此提供戰略引領。\n\n　　四大全球倡議的落實，有賴各國合作和多邊平台。憑藉「一國兩制」的制度優勢，香港可以為國家推動落實這些倡議，提供一些具體的實踐場景。\n\n　　可能有人會問，香港為甚麼有這個條件？\n\n　　我想，關鍵就在「一國兩制」。習主席說過，「一國兩制」蘊含中華文化的和合理念，體現「求大同、存大異」的精神。他在澳門回歸祖國二十五周年時也指出，「一國兩制」蘊含的和平、包容、開放、共享的價值理念，「是中國的，也是世界的」。而共同體的願景，是建設持久和平、普遍安全、共同繁榮、開放包容、清潔美麗的世界，理念有相通之處。\n\n　　習主席在聽取行政長官述職時，要求特區政府主動對接國家「十五五」規劃。今年九月，香港公布第一個五年規劃。在我看來，香港既要把自己的事情辦好，也要發揮聯通世界的優勢，為國家推動構建人類命運共同體出一分力。從這個意義上說，香港「一國兩制」的成功實踐，也體現了「立己達人」的精神。\n\n　　下面，我按發展、安全、文明、治理的次序，分四個方面舉例說明。\n\n　　第一，發展。\n\n　　全球發展倡議提出加強綠色融資。在港發行的人民幣綠色主權債券，就是一個例子。\n\n　　今年五月，國家財政部首次在香港發行人民幣綠色主權債券。香港發揮國際金融中心的作用，把國家的綠色融資安排與國際投資者連接起來，為國際資金參與綠色發展提供一個共用渠道。\n\n　　另一個例子，是藥械監管。今年三月起，香港分階段實施新藥「第一層審批」，並正籌建藥械監管中心。去年，國家批准上市的創新藥有76個。同年，我國創新藥對外授權交易總額超過1,300億美元。香港對接國際標準、建立自主審評能力，希望為創新藥走向世界多開一扇窗，也讓病人更早用上合適的藥物。這也呼應習主席倡導構建人類衞生健康共同體的理念。\n\n　　第二，安全。以金融業的人工智能治理為例。\n\n　　全球安全倡議將人工智能等新興科技領域的國際安全治理列為重點合作方向。今年七月，習主席在世界人工智能大會上說，要讓人工智能這匹千里馬既跑得快又跑得穩，並提出加強治理規則、技術標準的對接協調。\n\n　　香港金融管理局推出生成式人工智能沙盒，讓金融機構在可控環境中測試技術和風險管理措施。這是本地監管實踐，為業界探索兼顧創新與風險管理，累積可供交流的經驗。\n\n　　習主席指出，要讓人工智能成為促進共同繁榮、維護共同安全的一個重要動力源。對香港而言，具體可做的，是把本地風險管理做實，並與各方交流經驗。\n\n　　第三，文明。\n\n　　全球文明倡議倡導文明傳承創新和國際人文交流。國家《十五五規劃綱要》提出，發揮港澳在中西文明交流互鑑中的重要窗口作用。\n\n　　西九文化區的兩家博物館，從不同角度推動文化交流。香港故宮文化博物館去年與多哈伊斯蘭藝術博物館合辦伊斯蘭藝術展，下月將與法國吉美博物館（吉美國立亞洲藝術博物館）合辦絲綢之路佛教藝術展；M+上月與巴黎龐比度藝術中心、紐約現代藝術博物館建立文化聯盟。\n\n　　在同一個文化區，既有中華文化的根，也有國際策展網絡。這呼應習主席倡導的以文明交流超越文明隔閡、文明互鑑超越文明衝突、文明包容超越文明優越。\n\n　　第四，治理。\n\n　　全球治理倡議強調國際法治。調解是和平解決國際爭端的一種途徑。\n\n　　國際調解院由中國與志同道合的國家共同倡議建立，是全球首個專門以調解方式解決國際爭端的政府間國際法律組織。在中央支持下，總部落戶香港。今年五月，即正式開業不到一年，調解院公布了首宗成功案例，是一宗跨境海事爭議，經調解後，雙方達成和解協議。\n\n　　調解院總部由舊灣仔警署改建，設計借用瓷藝諺語：「一色入窯，萬彩出窯」。用在這裏，寓意生動：各方帶着分歧而來，通過調解找到多元的解決辦法。\n\n　　調解院作為獨立的國際組織，服務國際社會；特區政府做好東道支援。以對話促進理解、以調解化解爭端，有助維護持久和平。\n\n　　這些例子分屬不同領域，說明香港可以發揮自身所長，為國家促進國際合作作出具體貢獻。\n\n　　作為政策研究者，我深感這是一個「知」與「行」不斷往復的過程：構想要經過實踐檢驗，實踐的得失也要回到研究中總結，為闡釋「一國兩制」的生命力提供鮮活的案例。\n\n　　今年七月，在中央港澳辦（中央港澳工作辦公室）支持下，社科院港澳研究中心揭牌。工作之一正是構建「一國兩制」基礎理論和學術話語體系。\n\n　　各位朋友，明年是香港回歸祖國三十周年。借用《論語》的「三十而立」，香港要立得穩，就要堅守「一國」之本、善用「兩制」之利，辦好自己的事情，「立己達人」，為國家促進開放合作、推動構建人類命運共同體多做實事。\n\n　　大道之行，貴在力行。香港會在「一國兩制」下，把自己這一段路走實、走好。\n\n　　預祝本次論壇圓滿成功。謝謝大家。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cd666d4d78d","title":"警方呼籲市民提供大埔失蹤女子消息","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100493.htm","summary":"警方今日（十一月二十一日）呼籲市民提供一名在大埔失蹤女子的消息。","summary_short":"警方今日（十一月二十一日）呼籲市民提供一名在大埔失蹤女子的消息。","digest":"警方呼籲市民提供一名在大埔失蹤女子的消息","points":["警方今日（十一月二十一日）呼籲市民提供一名在大埔失蹤女子的消息","七十二歲女子蘇秀珍昨日（十一月二十日）凌晨在完善路最後露面後便告失蹤，其家人同日向警方報案","任何人如有該失蹤女子的消息或曾見過她，請致電三六六一　三一一三或電郵至rmpu-ntn-1@…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T16:22:40+08:00","size":1,"keywords":[],"body":"警方今日（十一月二十一日）呼籲市民提供一名在大埔失蹤女子的消息。\n\n　　七十二歲女子蘇秀珍昨日（十一月二十日）凌晨在完善路最後露面後便告失蹤，其家人同日向警方報案。\n\n　　她身高約一點六米，體重約五十五公斤，中等身材，圓面型，黃皮膚及蓄短黑髮。她最後露面時身穿黑色外套、黑色長褲及黑白色波鞋。\n\n　　任何人如有該失蹤女子的消息或曾見過她，請致電三六六一　三一一三或電郵至rmpu-ntn-1@police.gov.hk與新界北總區失蹤人口調查組，或與任何一間警署聯絡。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c01330dbbd4","title":"​香港海關檢獲懷疑受管制屬瀕危物種的活龜","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100393.htm","summary":"香港海關今日（十一月二十一日）在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜，估計市值共約四千元。","summary_short":"香港海關今日（十一月二十一日）在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜，估計市值共約四千元。","digest":"香港海關在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜，估計市值共約四千元","points":["香港海關今日（十一月二十一日）在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜…","透過風險評估，海關人員檢查一件由美國進口至香港，報稱玩具禮盒的包裹","經檢查後，海關人員於包裹中發現該批懷疑受管制屬瀕危物種的活龜"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T15:35:00+08:00","size":1,"keywords":[],"body":"香港海關今日（十一月二十一日）在香港國際機場檢獲四隻懷疑受管制屬瀕危物種的活龜，估計市值共約四千元。\n\n　　透過風險評估，海關人員檢查一件由美國進口至香港，報稱玩具禮盒的包裹。經檢查後，海關人員於包裹中發現該批懷疑受管制屬瀕危物種的活龜。\n\n　　案件已轉交漁農自然護理署跟進。\n\n　　根據《保護瀕危動植物物種條例》（第586章），任何人如非按照《條例》規定進出口或管有瀕危物種均屬違法。一經定罪，最高可被判罰款一千萬元及監禁十年，有關物品亦會被充公。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002）舉報懷疑走私活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc58db2fdaf","title":"​香港海關搗破網店及其分銷中心售賣冒牌貨品及參與清洗黑錢","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112000606.htm","summary":"香港海關於十一月十一日展開特別執法行動，偵破一宗透過兩間網上店鋪及其分銷中心售賣冒牌物品及清洗黑錢的案件，檢獲共約八百件懷疑冒牌物品，包括香水及公仔，估計市值共約五十萬元。","summary_short":"香港海關於十一月十一日展開特別執法行動，偵破一宗透過兩間網上店鋪及其分銷中心售賣冒牌物品及清洗黑錢的案件…","digest":"香港海關於十一月十一日展開特別執法行動…","points":["香港海關於十一月十一日展開特別執法行動，偵破一宗透過兩間網上店鋪及其分銷中心售賣冒牌物品及清…","案件涉及處理懷疑售賣冒牌物品的犯罪得益高達六百萬元，行動中拘捕一人","海關早前接獲市民舉報，指有網上店鋪售賣冒牌物品，海關人員隨即展開調查"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T14:05:16+08:00","size":1,"keywords":[],"body":"香港海關於十一月十一日展開特別執法行動，偵破一宗透過兩間網上店鋪及其分銷中心售賣冒牌物品及清洗黑錢的案件，檢獲共約八百件懷疑冒牌物品，包括香水及公仔，估計市值共約五十萬元。案件涉及處理懷疑售賣冒牌物品的犯罪得益高達六百萬元，行動中拘捕一人。\n\n　　海關早前接獲市民舉報，指有網上店鋪售賣冒牌物品，海關人員隨即展開調查。經深入調查及在商標持有人協助下，海關人員於十一月十一日採取執法行動，搜查有關網上店鋪位於觀塘一個工廠大廈單位的分銷中心，並檢獲該批懷疑冒牌物品。\n\n　　與此同時，經資金流向分析，海關人員發現有人成立一間本地公司，透過公司帳戶收取及轉賬大量懷疑犯罪得益。由二○二三年至二○二六年期間，該帳戶合共處理約六百萬元懷疑來自售賣冒牌物品的犯罪得益。\n\n　　行動中，海關根據《商品說明條例》及《有組織及嚴重罪行條例》拘捕一名六十一歲本地男子。\n\n　　案件仍在調查中，被捕人士現正保釋候查，不排除會有更多人被捕。\n\n　　海關呼籲消費者光顧信譽良好的店鋪或網店，避免與可疑商戶交易；如對貨品真偽存疑，應先向有關商標持有人或其代理商查詢。\n\n　　海關一直致力保障消費者權益，不時於市面及網上巡查。此外，海關人員會運用大數據系統進行風險評估和分析，辨識網店有否違反《商品說明條例》，加強保障消費者網上購物的權益。\n\n　　根據《商品說明條例》，任何人銷售或為售賣用途而管有冒牌物品，即屬違法，一經定罪，最高可被判罰款五十萬元及監禁五年。\n\n　　而根據《有組織及嚴重罪行條例》，任何人如知道或有合理理由相信任何財產，不論全部或部分、直接或間接，代表任何人從可公訴罪行所得的得益，而仍然處理該財產，即屬犯罪。一經定罪，最高可被判罰款五百萬元及監禁十四年，相關犯罪得益亦可被沒收。\n\n　　市民可致電海關二十四小時熱線182 8080，或透過舉報罪案專用電郵帳戶（crimereport@customs.gov.hk）或網上表格（eform.cefs.gov.hk/form/ced002），舉報懷疑冒牌貨及懷疑洗黑錢活動。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c5ca693d949","title":"香港特區立法會強烈不滿和堅決反對美中經濟與安全審議委員會報告","url":"https://www.info.gov.hk/gia/general/202611/21/P2026112100349.htm","summary":"香港特別行政區（香港特區）立法會發言人今日（十一月二十一日）表示，強烈不滿和堅決反對美中經濟與安全審議委員會發表所謂「2026年報告」，對香港情況作出失實、偏頗的陳述，肆意詆毀「一國兩制」…","summary_short":"香港特別行政區（香港特區）立法會發言人今日（十一月二十一日）表示…","digest":"香港特別行政區立法會發言人表示…","points":["香港特別行政區（香港特區）立法會發言人今日（十一月二十一日）表示…","立法會發言人對此表示強烈譴責，並堅定支持特區政府就該報告發出的聲明，直斥其非，以正視聽…","立法會發言人指出，維護國家主權、安全和發展利益，是香港特區的憲制責任…"],"section":"政府公布","category":"","source":"hkgov","source_display":"香港政府新闻公报","published_at":"2026-11-21T13:17:00+08:00","size":1,"keywords":[],"body":"下稿代立法會秘書處發出：\n\n　　香港特別行政區（香港特區）立法會發言人今日（十一月二十一日）表示，強烈不滿和堅決反對美中經濟與安全審議委員會發表所謂「2026年報告」，對香港情況作出失實、偏頗的陳述，肆意詆毀「一國兩制」，又對香港的司法獨立和法治、依法維護國家安全工作、選舉制度，以及經濟發展等多方面無理抹黑。立法會發言人對此表示強烈譴責，並堅定支持特區政府就該報告發出的聲明，直斥其非，以正視聽，維護香港聲譽。\n\n　　立法會發言人指出，維護國家主權、安全和發展利益，是香港特區的憲制責任，亦是保障香港長期繁榮穩定、市民安居樂業的根本前提。美方所謂報告指責《香港國安法》及《基本法》第二十三條立法系統性侵蝕香港法治，卻隻字不提二○一九年香港發生的嚴重暴力動亂和社會撕裂，正是《香港國安法》的實施才能有效恢復社會秩序，保障了市民的生命財產安全。立法會發言人強調，《香港國安法》和《維護國家安全條例》等相關法律，確保香港能依法有效防範、制止和懲治危害國家安全的行為和活動。有關法律精準針對極少數危害國家安全的罪行，同時堅持法治原則，絕不影響一切正常的商業、專業、學術、文化、新聞活動，更好保障了香港居民依法享有的權利和自由。美方所謂報告將香港依法維護國家安全的工作污名化，同時卻完全不提美國自身早已有多部極嚴厲的維護國家安全法律，再一次暴露其雙重標準的虛偽本質。\n\n　　立法會發言人指出，正如特區政府聲明所指，特區政府今年六月訂立《維護國家安全（程序事宜）規例》，清楚述明在《香港國安法》和《維護國家安全條例》下界定「特區的法律下其他危害國家安全的罪行」的機制，細化相關程序事宜，為《香港國安法》、《維護國家安全條例》等相關規定的實施帶來更大確定性。有關規例沒有改變現有和行之有效的規定、沒有改變《香港國安法》、《維護國家安全條例》的適用範圍、沒有改變「危害國家安全的罪行」的定義，也沒有訂立新的罪行、罰則或執法權力。\n\n　　立法會發言人又指，美方所謂報告對香港的評論亦不符合國際社會的客觀評價。世界正義工程《2026年法治指數》顯示，在全球143個國家和地區中，香港位列第24位，領先於包括美國在內一些不時無理批評香港法治和人權狀況的西方國家。發言人強調，香港居民根據《基本法》、《香港國安法》及本地法律，一直享有言論、新聞、出版、結社、集會、遊行和示威等權利和自由，依法與外界交流往來亦受充分保障；司法機構依法獨立行使審判權，所有案件按法律程序處理，被告人享有公平審訊及依法上訴的權利。\n\n　　就該報告提到立法會換屆選舉，立法會發言人表示，特區政府亦指，第八屆立法會換屆選舉順利舉行，選民積極投票，選出新一屆愛國愛港、有擔當、有才幹、有志服務社會的立法會議員，再次展現完善選舉制度下高質量、高水平的良性競爭，體現了廣泛代表性和均衡參與。\n\n　　立法會發言人強調，在完善選舉制度後，以愛國者為主體的第八屆立法會已擺脫內耗，議事效率顯著提升，既堅定支持特區政府依法施政，亦積極透過審議法案、審批撥款及監察政府施政，推動經濟發展，改善民生。就美方所謂報告提及全體立法會議員今年七月到北京進行國家事務研修考察，發言人指出，此行是香港立法機關歷來首次，意義重大，旨在讓議員深入了解國家最新發展戰略及治理經驗，有助議員更準確把握香港在國家發展大局中的定位角色，並促進香港良政善治，為「愛國者治港」創造更大價值。\n\n　　立法會發言人亦指出，任何指稱因香港五年規劃出台而偏離資本主義市場經濟的說法，均是子虛烏有。香港五年規劃強調香港對市場經濟和面向全球的長期堅持，絕無偏離市場經濟。特區政府公布五年規劃，已明確指出堅持「有效市場」和「有為政府」相結合，而多個在港外國商會均認同五年規劃有助為香港未來發展帶來更多確定性。與此同時，北部都會區正全速發展，多個片區的設施已相繼落成並引進企業。《北部都會區發展條例草案》剛於本月獲立法會通過，簡化規劃和地政等程序、加快工程建設及便利跨境要素流動。立法會亦一直透過相關委員會及撥款審議，積極支持特區政府推展北都的基建和發展項目，並持續監察落實進度。\n\n　　立法會發言人強調，香港首次制定五年規劃，是更有效融入國家發展大局、破解自身深層次矛盾（如產業單一化）的積極舉措，旨在為香港謀求長遠繁榮。與此同時，香港與內地經濟融合（如大灣區建設、互聯互通機制）為香港帶來了龐大的發展機遇，促進了本地就業和經濟增長。該報告以上所述均明顯意圖唱衰香港、誤導國際投資者，立法會發言人必須嚴詞駁斥。\n\n　　香港已進入由治及興的新階段。立法會發言人強烈敦促美中經濟與安全審議委員會及美國有關方面，香港特區事務全屬中國內政，立即停止干涉香港事務，為中美建設戰略性穩定關係發展和港美合作發揮正面作用。","image":"","video":"","video_poster":" mpts HK to Papua New Guinea emergency landing","url":"https://news.tvb.com/tc/1207617-EnginesparkpromptsHKtoPapuaNewGuineaemergencylanding","summary":"An Air Niugini plane carrying 146 passengers and crew departingHong Kong for Papua New Guinea a safe…","summary_short":"An Air Niugini plane carrying 146 passengers and crew depart…","digest":"An Air Niugini plane carrying 146 passenge…","points":["An Air Niugini plane carrying 146 passengers a…","Hong Kong for Papua New Guinea a safe emergenc…","landing in southern Philippines Davao Internat…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T19:48+08:00","size":1,"keywords":[],"body":"An Air Niugini plane carrying 146 passengers and crew departing\nHong Kong for Papua New Guinea a safe emergency \nlanding in southern Philippines Davao International Airport.\nFootage shows some of the 137 passengers and nine crew members\nwalking onto a grass field after they had\ndisembarked the Boeing 767-383ER through emergency slides. \nThe pilots reported they detected possible sparks or fire in the right engine, \nprompting the move to divert and land in the Philippines, according to \naviation officials.\nThe Davao Airport shut down air traffic for the emergency landing \nbut has subsequently reopened.","image":"https://pro-vod-cdn.tvb.com/a6b3f948f76f439cb0e4b869bdf76b2a/snapshots/d63c1141d89d47798168c17efd288217-00004.jpg","video":"https://pro-vod-cdn.tvb.com/a6b3f948f76f439cb0e4b869bdf76b2a/b516081956e6439bbacbd632c1baa483-9af4f333fb6cbc82843a8176e3eccb3c-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/a6b3f948f76f439cb0e4b869bdf76b2a/snapshots/d63c1141d89d47798168c17efd288217-00004.jpg","lang":"en"},{"id":"c4ca7928163","title":"Gov't hopeful that 2026 visitor figure will reach 53 million","url":"https://news.tvb.com/tc/1207641-Govthopefulthat2026visitorfigurewillreach53million","summary":"Secretary for Culture, Sports and Tourism Rosanna Law expresses confidence in the city's tourism sec…","summary_short":"Secretary for Culture, Sports and Tourism Rosanna Law expres…","digest":"Secretary for Culture…","points":["Secretary for Culture, Sports and Tourism Rosa…","She adds authorities have been striving to org…","According to government estimates…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T19:11+08:00","size":1,"keywords":[],"body":"Secretary for Culture, Sports and Tourism Rosanna Law expresses confidence in the city's tourism sector -- believing the tourist figure will reach the targeted 8% growth year-on-year. \nShe adds authorities have been striving to organise more nighttime activities in hopes of driving more local consumption. \nAmid the continual rise of tourists visiting the city, Hong Kong recorded more than 45 million tourists as of October -- marking a 12% year-on-year increase.\nAccording to government estimates, the city is set to record a total of 53.8 million visitors in 2026, which is an 8% increase year-on-year.\nThis as Secretary for Culture, Sports and Tourism Rosanna Law said the government is confident the city will reach this target. \nShe said the government has strengthened efforts to promote light shows and nighttime events starting with the Mid-Autumn Festival, in hopes of creating a lively atmosphere all across the city to attract residents to visit landmarks they haven't been to in a long time.\nLaw said such arrangements were not made just for foreign tourists, stressing the importance of preserving local flavours. \nMentioning the conclusion of the APEC summit in Shenzhen, she said attendees of the event also took the opportunity to visit Hong Kong. \nShe noted several hotel managers in the East Tsim Sha Tsui area told her hotel occupancy rates reached 92 to 93% during the period, with many guests arriving from abroad.","image":"https://pro-vod-cdn.tvb.com/759ae5afb75445cb833264ada73caae4/snapshots/d76f5a970d8a4a2e9d81bc30b1813364-00008.jpg","video":"https://pro-vod-cdn.tvb.com/759ae5afb75445cb833264ada73caae4/b795c3ff5aa9404a9f01022f35e7c7de-ca6018ae44d2e91b483a6cd65f697030-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/759ae5afb75445cb833264ada73caae4/snapshots/d76f5a970d8a4a2e9d81bc30b1813364-00008.jpg","lang":"en"},{"id":"cd250b5d8c8","title":"广西钦州港口岸获评中西部地区首个“国际卫生港口”","url":"https://www.chinanews.com.cn/aseaninfo/2026/11-21/10735785.shtml","summary":"中新网南宁11月21日电(李虎祥 钟闯瑜 林浩)11月21日，经世界卫生组织专家组实地测评，广西钦州港口岸正式荣获“国际卫生港口”称号，成为中国中西部地区首个获此认证的水运口岸。","summary_short":"中新网南宁11月21日电(李虎祥 钟闯瑜 林浩)11月21日，经世界卫生组织专家组实地测评…","digest":"11月21日，经世界卫生组织专家组实地测评…","points":["中新网南宁11月21日电(李虎祥 钟闯瑜 林浩)11月21日，经世界卫生组织专家组实地测评…","该称号是世界卫生组织对国际通航口岸安全与卫生控制能力的高度认可…","“国际卫生港口”是世界卫生组织依据《国际卫生条例(2005)》，围绕口岸卫生基础设施建设…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T17:26:13+08:00","size":1,"keywords":[],"body":"中新网南宁11月21日电(李虎祥 钟闯瑜 林浩)11月21日，经世界卫生组织专家组实地测评，广西钦州港口岸正式荣获“国际卫生港口”称号，成为中国中西部地区首个获此认证的水运口岸。\n\n　　该称号是世界卫生组织对国际通航口岸安全与卫生控制能力的高度认可，标志着钦州港口岸公共卫生治理能力迈入国际先进行列，为中国—东盟自贸区3.0版升级议定书生效实施营造了良好环境。\n\n图为授牌仪式现场。南宁海关 供图\n\n　　“国际卫生港口”是世界卫生组织依据《国际卫生条例(2005)》，围绕口岸卫生基础设施建设、卫生管理体系运行、突发公共卫生事件应急处置能力开展的权威性测评认定。\n\n　　南宁海关卫生检疫处副处长郭枫介绍，创建过程中，该关聚焦检疫管控、病媒生物监测、技术支撑等重点模块，坚持高标准推进，将口岸公共卫生核心能力要求深度融入港口标准化建设、日常运营管理的全流程，推动创建成果实时转化，口岸公共卫生安全水平、协同处置能力、口岸开放能级持续跃升。\n\n　　依托科技创新赋能，钦州港口岸公共卫生防控与通关服务质效实现双重跃升。口岸创新打造西部沿海地区首个“智慧湾”智能监控指挥调度系统，建立“一平台调度、多主体联动、全流程防控”联合指挥调度机制，全面打通海关、港口、海事、船方等多方数据交互共享通道，实现货物即到即查、快验快放，口岸集疏运效率提升25%。\n\n　　口岸应对突发公共卫生事件时，多部门能即时沟通、共同研判指挥、分级高效处置，大幅提升应急防控实战能力。\n\n　　同时，钦州港口岸全面推行智慧电讯检疫，优化无接触式卫生检疫模式，实现船舶7×24小时快速通关，靠泊等待时间缩减30%以上，单船船舶通关节约通关时长超10小时。\n\n　　依托东盟口岸传染病监测预警中心平台，钦州港口岸精准落实“一国一策、一病一策、一口岸一策”，做到风险早研判、疫情早发现、处置早闭环，有效提升病媒监测预警智能化、精细化水平，有效防范鼠类传疾病及登革热、基孔肯雅热、疟疾等蚊媒传染病跨境传播。\n\n　　海关总署相关负责人表示，此次成功获评，不仅强化了钦州港口岸突发公共卫生事件应对处置能力，构建起安全、高效、便捷的国际化通关环境，更将有力赋能国际贸易和区域经贸合作，为高质量共建“一带一路”，构建更为紧密的中国—东盟命运共同体注入强劲动力。\n\n　　下一步，钦州港口岸将持续巩固创建成果，健全长效管理机制。当地海关将立足口岸检疫监管职责，不断强化风险研判、完善防控体系，协同各方守牢国门公共卫生安全防线，持续优化口岸营商环境。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c5c7d98b8eb","title":"西藏开展2026年冰雪运动进机关和企事业单位活动","url":"https://www.chinanews.com.cn/ty/2026/11-21/10735769.shtml","summary":"中新网拉萨11月21日电 (李林)为补齐冬季全民健身活动供给短板，20日，2026年西藏自治区冰雪运动进机关和企事业单位活动在拉萨市堆龙德庆区康嘎楚希峰顺利举办，全区各党政机关…","summary_short":"中新网拉萨11月21日电 (李林)为补齐冬季全民健身活动供给短板，20日…","digest":"为补齐冬季全民健身活动供给短板，20日…","points":["中新网拉萨11月21日电 (李林)为补齐冬季全民健身活动供给短板，20日…","图为参与队伍列队有序出发，沉浸式开展高原冰雪徒步健身运动","本次活动由西藏自治区体育局、中共西藏自治区直属机关工作委员会主办，西藏自治区登山队…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T16:46:21+08:00","size":1,"keywords":[],"body":"中新网拉萨11月21日电 (李林)为补齐冬季全民健身活动供给短板，20日，2026年西藏自治区冰雪运动进机关和企事业单位活动在拉萨市堆龙德庆区康嘎楚希峰顺利举办，全区各党政机关、企事业单位干部职工及户外运动爱好者200余人踊跃参与。\n\n图为参与队伍列队有序出发，沉浸式开展高原冰雪徒步健身运动。西藏自治区体育局供图\n\n　　活动现场氛围热烈、秩序井然。随着活动正式启动，参与队伍列队有序出发，沉浸式开展高原冰雪徒步健身运动。为全力保障活动安全有序开展，西藏自治区登山队选派专业高山向导全程护航值守，现场教学高原冰雪路面行进专业技巧，细致解读高原冬季户外运动安全规范、风险防控要点。\n\n　　据悉，冰雪运动进机关和企事业单位活动已在西藏连续多年常态化开展，是西藏冬季全民健身的标杆品牌活动，有效带动全民冰雪健身热情，持续浓厚冬季健身氛围。\n\n　　下一步，西藏自治区体育局将立足高原特色体育资源禀赋，持续深挖冰雪体育发展潜力，不断丰富冬季全民健身活动载体、创新活动形式内容，常态化普及推广高原冰雪运动。\n\n　　本次活动由西藏自治区体育局、中共西藏自治区直属机关工作委员会主办，西藏自治区登山队、拉萨市体育局承办，西藏自治区体育彩票管理中心、堆龙德庆区人民政府协办。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"c743229cd2c","title":"NBA·有片｜哈登轟51分超越高比 37歲老將聊發少年狂：得分能力絕非只剩回憶","url":"https://www.stheadline.com/basketball-zone/3639592/NBA有片哈登轟51分超越高比-37歲老將聊發少年狂得分能力絕非只剩回憶","summary":"過去幾個賽季，哈登（James Harden）的打法逐漸轉型，從昔日那個無所不能的得分機器，演變成更專注為隊友創造機會的組織者。","summary_short":"過去幾個賽季，哈登（James Harden）的打法逐漸轉型，從昔日那個無所不能的得分機器…","digest":"過去幾個賽季，哈登（James Harden）的打法逐漸轉型…","points":["過去幾個賽季，哈登（James Harden）的打法逐漸轉型，從昔日那個無所不能的得分機器…","然而在美國時間周五（20日）的NBA盃小組賽，這位37歲老將向外界證明…","他全場狂轟賽季新高的51分，帶領騎士以128:119擊敗溜馬…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:41:05+08:00","size":1,"keywords":[],"body":"過去幾個賽季，哈登（James Harden）的打法逐漸轉型，從昔日那個無所不能的得分機器，演變成更專注為隊友創造機會的組織者。然而在美國時間周五（20日）的NBA盃小組賽，這位37歲老將向外界證明，其頂級得分能力依然未被歲月完全帶走，絕非只剩下回憶。他全場狂轟賽季新高的51分，帶領騎士以128:119擊敗溜馬，更在生涯「50+」場次上正式超越已故傳奇高比拜仁（Kobe Bryant），升上歷史第三位。\nJAMES HARDEN. 51 POINTS. IT'S HIS MOST POINTS AS A CAVALIER 🤯 CAVS MOVE TO 2-1 IN EMIRATES NBA CUP GROUP PLAY! https://t.co/twWJ4G70Nk\n— NBA (@NBA) November 21, 2026哈登今仗上陣賽季新高的40分鐘，全場26投15中，當中三分球11射7中，加上罰球14射全中，交出51分、6籃板及6助攻的亮眼數據。這不僅是他自今年2月季中交易加盟騎士以來的單場最高得分，更是他相隔近一年後再次突破50大關——他上一次斬獲「50+」，已是2025年11月22日效力快艇對陣黃蜂時攻入的55分。憑藉今場爆發，迎來生涯第26次單場「50+」的哈登，成功打破與高比並列近一年的僵局，目前在歷史排行榜上僅次於名宿張伯倫（Wilt Chamberlain，118次）及米高佐敦（Michael Jordan，31次）。\n對於熟悉哈登「火箭時代」的老球迷而言，這份數據難免令人感到恍惚。昔日處於巔峰期的他，曾交出常規賽場均36.1分的恐怖數據；但在今仗大爆發前，他本季場均得分僅為16.2分。談到角色的轉變，哈登坦言：「對我來說，現在的角色已經不同了。我的球權使用率不再是每場都極高，球隊有其他人負責這工作。我的任務是在需要時得分，然後分配球權。當球隊需要我挺身而出時，我依然能做到。我知道自己可以，只是當你不經常這樣做時，感覺會有點流失，甚至會懷疑自己是否還具備這能力。」\n騎士上季曾殺入東岸決賽，惟今季開局表現反覆，即使近4戰3勝，目前戰績僅為9勝8負。作為征戰聯盟18年的老將，哈登對自己的「進化」感受甚深：「最讓我興奮的是，即使到了生涯第18個賽季，我仍在學習如何發揮影響力。年輕時很容易，你可以跑得快、跳得高去過人；現在速度慢了，你就要思考如何擺脫對手。這就是哈登的進化。今晚大大提升了我的自信，證明我依然能在高水平賽事中做到這一點。」\n賽後談及超越偶像高比的歷史性里程碑，哈登感到榮幸與謙卑：「當你談論籃球時，張伯倫顯然是精英，但在得分後衛的位置上，佐敦和高比就是史上最出色的球員。能夠進入這樣的討論行列，讓我感到非常謙卑，這絕對是一件特別的事情。」同時，他亦深情地表達了對高比的思念：「他是我的偶像，是我成長過程中一直關注和學習的人。他對待籃球的態度，以及為這項運動付出的努力，都非常特別。我們很掛念他，非常非常掛念他。」","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c271ef47f92","title":"獎金紀錄王「浪漫勇士」榮休日 雙「浪漫」錦上添花？","url":"https://www.stheadline.com/realtime-racing/3639588/獎金紀錄王浪漫勇士榮休日-雙浪漫錦上添花","summary":"馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式，向這匹兩屆香港馬王 (2023/24及2025/26年度馬季)致敬。","summary_short":"馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式…","digest":"馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式…","points":["馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式…","「浪漫勇士」服役期間累計贏得總獎金逾二億八千八百七十四萬港元，是全球歷來累積獎金最多的賽駒…","周日沈集成部署「浪漫鬥士」及「浪漫戰神」分別出戰第五及九場，其中後駒報爭二千米馬會盃…"],"section":"其他","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-21T14:05:46+08:00","size":1,"keywords":[],"body":"馬會將在本周日為全球歷來累積最高獎金賽駒「浪漫勇士」舉行榮休歡送儀式，向這匹兩屆香港馬王 (2023/24及2025/26年度馬季)致敬。\n「浪漫勇士」服役期間累計贏得總獎金逾二億八千八百七十四萬港元，是全球歷來累積獎金最多的賽駒，馬會周日將會向馬主劉栢輝頒發終身成就獎的獎座，以表彰「浪漫勇士」的成就。\n周日沈集成部署「浪漫鬥士」及「浪漫戰神」分別出戰第五及九場，其中後駒報爭二千米馬會盃，對於劉栢輝來說，如果在「浪漫勇士」榮休歡送儀式同一日贏馬拉頭馬捧盃，自然更為難忘。\n按圖睇有關相片：\n陳嘉甜","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce2ebb132c2","title":"冬奥场馆开启新赛季 四项国际雪联顶级赛事落地云顶滑雪公园","url":"https://www.chinanews.com.cn/ty/2026/11-21/10735707.shtml","summary":"中新网张家口11月21日电 河北省张家口市云顶滑雪公园日前发布2026-2027赛季“云顶巅峰赛季”赛程，四项国际雪联顶级赛事落户冬奥场馆，时间从2026年12月持续至2027年2月，覆盖自由式滑雪…","summary_short":"中新网张家口11月21日电 河北省张家口市云顶滑雪公园日前发布2026-2027赛季“云顶巅峰赛季”赛程…","digest":"河北省张家口市云顶滑雪公园日前发布2026-2027赛季“云顶巅峰赛季”赛程…","points":["云顶滑雪公园是2022年北京冬奥会自由式滑雪、单板滑雪竞赛场馆","该场地赛道条件优越，常年承办世界杯等国际顶级雪上赛事，兼顾专业竞技与大众滑雪","12月6日至13日，这里将举行自由式滑雪及单板滑雪U型场地世界杯…"],"section":"其他","category":"","source":"chinanews","source_display":"中國新聞網","published_at":"2026-11-21T13:47:33+08:00","size":1,"keywords":[],"body":"中新网张家口11月21日电 河北省张家口市云顶滑雪公园日前发布2026-2027赛季“云顶巅峰赛季”赛程，四项国际雪联顶级赛事落户冬奥场馆，时间从2026年12月持续至2027年2月，覆盖自由式滑雪、单板滑雪多个项目，将为冰雪运动爱好者献上一场横跨整个雪季的赛事盛宴。\n\n　　云顶滑雪公园是2022年北京冬奥会自由式滑雪、单板滑雪竞赛场馆。该场地赛道条件优越，常年承办世界杯等国际顶级雪上赛事，兼顾专业竞技与大众滑雪。\n\n　　12月6日至13日，这里将举行自由式滑雪及单板滑雪U型场地世界杯，预计将有来自12至13个国家和地区的160至180名运动员及随队官员参赛。作为两届冬奥会冠军，从北京冬奥会起，谷爱凌每年都在云顶这条赛道站上最高领奖台；2025年12月，她在这里实现世界杯云顶站三连冠。此次，谷爱凌继续领衔中国队出战，张可欣、单板新锐周苡竹等也将主场征战。英国选手佐伊·阿特金和日本名将户冢优斗、平野步梦等选手均将参赛。\n\n图为河北省张家口市云顶滑雪公园内的U型场地技巧世界杯比赛场地。主办方供图\n\n　　2027年1月12日至18日，单板滑雪障碍追逐世界杯将接棒上演，这是该项目在北京冬奥会后首次重返云顶。北京冬奥会该项目冠军、美国名将琳赛·雅各贝利斯等选手将再度亮相，中国新生代运动员也将在家门口练兵。\n\n　　2027年2月14日至20日，自由式滑雪空中技巧世界杯在云顶举行。作为中国雪上传统优势项目，徐梦桃、齐广璞两位冬奥冠军将和李天马、陈梅婷等年轻选手携手冲击奖牌。本站赛事同时承担2029年张家口世锦赛测试赛功能，是中国队备战新冬奥周期的重要一站。\n\n　　2027年2月14日至27日将举行国际雪联单板和自由式世界青年锦标赛，这是国内迄今规格最高的青年国际雪上赛事，也是青奥会资格赛，预计将有20至30个国家和地区的300余名青年选手参赛，同时为2029年张家口世锦赛提前预热。\n\n　　据悉，四项赛事均设置独立比赛场地，不占用大众滑雪区域，滑雪爱好者可在正常滑雪的同时近距离观摩顶级赛事。(完)\n\n 【编辑:徐世傲】","image":"","video":"","video_poster":"","lang":"zh-Hans"},{"id":"cb77cbfb6bc","title":"兰花奖得主 斯诺夫妇后人：美中人民间的理解永远值得追求","url":"https://www.chinanews.com/cul/shipin/cns-d/2026/11-21/news1075638.shtml","summary":"11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖。","summary_short":"11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖。","digest":"11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖","points":["11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖","他表示，海伦·福斯特·斯诺一生致力于帮助人们了解中国，并在美中两国之间建立友谊","我希望我能回到过去让她知道，她架起的“桥”仍然屹立不倒，最重要的是，人们仍然走在这座桥上"],"section":"其他","category":"其他","source":"cnsvideo","source_display":"中新視頻","published_at":"2026-11-21T13:41:07+08:00","size":1,"keywords":[],"body":"11月20日，第三届兰花奖颁奖典礼在北京举行，斯诺夫妇后人亚当·福斯特获得友好使者奖。\n\n他表示，海伦·福斯特·斯诺一生致力于帮助人们了解中国，并在美中两国之间建立友谊。我希望我能回到过去让她知道，她架起的“桥”仍然屹立不倒，最重要的是，人们仍然走在这座桥上。\n\n今天我带着感激之情接受这个奖项，同时也带着责任感，友谊的工作永远不会结束。每一代人都必须选择继续下去。我把这份荣誉献给海伦，献给每一位继承她遗志的人，献给所有相信美中两国人民之间的理解永远值得追求的人。\n\n(孙恒业 肖欣 吴昕妮 北京报道）","image":"","video":"https://poss-videocloud.cns.com.cn/oss/2026/11/21/chinanews/MEIZI_YUNSHI/onair/F1B7C0AD76EE4CAF9A44D6DCED364530.mp4","video_poster":"","lang":"zh-Hans"},{"id":"c20b9189d01","title":"Mourners at Cincinnati Zoo remembers Fiona the hippo","url":"https://news.tvb.com/tc/1207601-MournersatCincinnatiZooremembersFionathehippo","summary":"Mourners at Cincinnati Zoo remembered Fiona the hippo as a ray of \"light and hope\" after the hippo d…","summary_short":"Mourners at Cincinnati Zoo remembered Fiona the hippo as a r…","digest":"Mourners at Cincinnati Zoo remembered Fion…","points":["Fiona, the hippo whose premature birth and fig…","Veterinarians and staff tried for days to help…"],"section":"其他","category":"News","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-21T13:00:00+08:00","size":1,"keywords":["United States","zoo"],"body":"Mourners at Cincinnati Zoo remembered Fiona the hippo as a ray of \"light and hope\" after the hippo died on November 19 from complications after swallowing a knit hat accidentally flung into her enclosure.\nFiona, the hippo whose premature birth and fight for survival at the Cincinnati Zoo turned her into a global sensation nearly a decade ago. She was 9 years old. \nVeterinarians and staff tried for days to help the hippo safely digest and pass a knit cap she swallowed, but the efforts were ultimately unsuccessful.","image":"https://pro-img-cdn.
