<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 不主动被搜索引擎收录：这是只给链接的分享页，不想进搜索结果 -->
<meta name="robots" content="noindex, nofollow">
<!-- 必须 no-referrer：中新视频的 CDN（v-oss.cnsimg.net / poss-videocloud）
     开了防盗链，Referer 不是自家域名就回 403 + text/html，浏览器随即按
     ORB 把整条媒体请求判掉（MEDIA_ERR_SRC_NOT_SUPPORTED）——表现就是
     「视频全都播不了」。不带头 Referer 时 CDN 放行。 -->
<meta name="referrer" content="no-referrer">
<title>NewGent</title>
<style>
  /* ============================================================
     设计 token —— 与 Android Theme.kt / macOS Theme.swift 一一对应
     见 docs/视觉规范.md
     ============================================================ */
  :root{
    --font: -apple-system, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Microsoft JhengHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
    /* 全局字号倍率：用户档位 × 窗口宽度系数，由 JS 写入 */
    --fs: 1;
  }
  html[data-theme="light"]{
    --bg:#FBFAF7; --surface:#FFFFFF; --t1:#17171B; --t2:#5F5F68; --t3:#9C9CA4;
    --accent:#A6402F; --line:#E8E6E0; --bar:rgba(251,250,247,.88); --live:#C0392B;
    --press:rgba(0,0,0,.045); --btn-bg:#17171B; --btn-fg:#FBFAF7;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="dark"]{
    --bg:#0C0C0E; --surface:#151517; --t1:#EDEDEF; --t2:#9A9AA2; --t3:#66666E;
    --accent:#E0735A; --line:#232327; --bar:rgba(12,12,14,.88); --live:#E05252;
    --press:rgba(255,255,255,.06); --btn-bg:#EDEDEF; --btn-fg:#0C0C0E;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="sepia"]{
    --bg:#EDE6D6; --surface:#F6F1E4; --t1:#3A3226; --t2:#6B5F4C; --t3:#97896F;
    --accent:#7B5B33; --line:#DCD1BA; --bar:rgba(237,230,214,.92); --live:#A85434;
    --press:rgba(58,50,38,.06); --btn-bg:#3A3226; --btn-fg:#F6F1E4;
    --card:transparent; --card-border:transparent; --card-shadow:none; --card-blur:none;
  }
  html[data-theme="glass"]{
    --bg:#10141F; --surface:#1A1F2C; --t1:#F3F5F9; --t2:#AAB2C2; --t3:#79829A;
    --accent:#8FB6E9; --line:rgba(255,255,255,.11); --bar:rgba(255,255,255,.055); --live:#E85C5C;
    --press:rgba(255,255,255,.09); --btn-bg:rgba(255,255,255,.92); --btn-fg:#12151C;
    --card:rgba(255,255,255,.07); --card-border:rgba(255,255,255,.14);
    --card-shadow:0 8px 24px rgba(0,0,0,.25); --card-blur:blur(18px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--t1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background .35s ease, color .35s ease;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  /* 滚动条：细、低对比 */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--t3); background-clip:padding-box; border:2px solid transparent; }

  /* ============================================================
     磨砂玻璃背景
     ============================================================ */
  .backdrop{ position:fixed; inset:0; z-index:0; opacity:0; pointer-events:none; transition:opacity .4s ease; }
  html[data-theme="glass"] .backdrop{ opacity:1; }
  .backdrop .grad{ position:absolute; inset:0;
    background:linear-gradient(160deg,#141B2B 0%,#1B1626 45%,#0D141C 100%); }
  .blob{ position:absolute; border-radius:50%; filter:blur(70px); }
  .b1{ width:46vw;height:46vw; background:#3D5A8A; top:-12vw; left:-10vw; opacity:.5; }
  .b2{ width:40vw;height:40vw; background:#5A3D6E; top:22vh; right:-12vw; opacity:.4; }
  .b3{ width:52vw;height:52vw; background:#2A5A5E; bottom:-20vw; left:-8vw; opacity:.35; }

  /* ============================================================
     骨架
     ============================================================ */
  .app{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }

  .topbar{
    height:46px; flex-shrink:0; display:flex; align-items:center; gap:2px;
    padding:0 12px 0 16px;
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.3px; margin-right:10px; user-select:none; }
  .brand em{ font-style:normal; color:var(--accent); }
  .spacer{ flex:1; }
  .updated{ font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-right:8px; font-variant-numeric:tabular-nums;
            display:flex; align-items:center; gap:5px; transition:color .3s ease; white-space:nowrap; }
  .updated .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
                 opacity:0; transition:opacity .3s ease; }
  .updated.live .dot{ opacity:1; animation:breathe 3.2s ease-in-out infinite; }
  .updated.flash{ color:var(--accent); }
  /* 数据过期：别让人把三天前的新闻当今天的读 */
  .updated.stale{ color:var(--live); }
  .updated.stale .dot{ opacity:1; background:var(--live); animation:none; }
  @keyframes breathe{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  .ibtn{
    height:30px; min-width:30px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--t2); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:500;
    transition:background .14s ease, color .14s ease, transform .1s ease;
  }
  .ibtn:hover{ background:var(--press); color:var(--t1); }
  .ibtn:active{ transform:scale(.95); }
  .ibtn svg{ width:15px; height:15px; }

  .body{ flex:1; display:flex; min-height:0; }
  .vdiv{ width:1px; flex-shrink:0; background:var(--line); }

  /* ============================================================
     侧栏
     ============================================================ */
  .sidebar{ width:210px; flex-shrink:0; overflow-y:auto; padding:10px 8px 16px; }
  .sb-group{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:12px 10px 5px;
  }
  .sb-item{
    display:flex; align-items:center; gap:7px;
    padding:6px 10px; border-radius:7px; cursor:pointer;
    font-size:calc(12.5px * var(--fs)); color:var(--t2); user-select:none;
    transition:background .13s ease, color .13s ease;
  }
  .sb-item:hover{ background:var(--press); }
  .sb-item.on{ background:var(--press); color:var(--t1); font-weight:600; }
  .sb-item .cnt{ margin-left:auto; font-size:calc(9.5px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .sb-dot{ width:5px; height:5px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .sb-live-tag{ margin-left:auto; font-size:calc(9.5px * var(--fs)); font-weight:600; color:var(--live); }

  /* ============================================================
     中栏：列表
     ============================================================ */
  /* 栏宽跟着字号倍率走：字大了，行宽也得跟上，否则一行没几个字 */
  .listcol{ width:calc(356px * var(--fs)); flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .lc-head{
    flex-shrink:0; display:flex; align-items:baseline; gap:6px;
    padding:14px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .lc-head .t{ font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:-.2px; }
  .lc-head .c{ font-size:calc(10px * var(--fs)); color:var(--t3); }
  .lc-scroll{ flex:1; overflow-y:auto; padding-bottom:20px; }

  .row{
    padding:12px 18px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .row:hover{ background:var(--press); }
  .row.on{ background:var(--press); }
  .row:last-child{ border-bottom:0; }
  .row h3{
    font-size:calc(13.5px * var(--fs)); line-height:1.46; font-weight:500; letter-spacing:-.15px; color:var(--t1);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row p{
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2); margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row .meta{ margin-top:6px; }
  .row.head h3{ font-size:calc(15.5px * var(--fs)); font-weight:650; line-height:1.4; -webkit-line-clamp:3; }
  .row.head p{ font-size:calc(12px * var(--fs)); -webkit-line-clamp:3; }

  /* ============================================================
     热搜行：排名 + 词 + 热度
     ============================================================ */
  .trow{
    display:flex; align-items:flex-start; gap:11px;
    padding:11px 18px; cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .13s ease;
  }
  .trow:hover{ background:var(--press); }
  .trow:last-child{ border-bottom:0; }
  .trow .rk{
    flex-shrink:0; width:18px; text-align:right; padding-top:1px;
    font-size:calc(11.5px * var(--fs)); font-weight:650; color:var(--t3);
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .trow.top .rk{ color:var(--accent); }
  .trow .tx{ flex:1; min-width:0; }
  .trow .tx b{
    display:block; font-size:calc(13px * var(--fs)); font-weight:500; line-height:1.46;
    letter-spacing:-.1px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tx small{
    display:block; margin-top:3px; font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .trow .tag{
    flex-shrink:0; margin-top:2px; padding:2px 5px; border-radius:4px;
    font-size:calc(9.5px * var(--fs)); font-weight:650;
    background:var(--press); color:var(--accent);
  }
  html[data-theme="glass"] .lc-scroll .trow{
    border-bottom:0; border-radius:12px; margin-bottom:6px;
    background:var(--card); border:1px solid var(--card-border);
  }

  /* 玻璃模式：行变卡片 */
  html[data-theme="glass"] .lc-scroll{ padding:10px 10px 20px; }
  html[data-theme="glass"] .row{
    border-bottom:0; border-radius:14px; margin-bottom:8px;
    background:var(--card); border:1px solid var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
    box-shadow:var(--card-shadow);
  }

  /* ============================================================
     元信息
     ============================================================ */
  .meta{
    display:flex; align-items:center; gap:6px;
    font-size:calc(10px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
  }
  .meta .cat{ color:var(--accent); font-weight:550; }
  .meta .n{ color:var(--accent); font-weight:550; }
  .meta .sep{ width:2px; height:2px; border-radius:50%; background:var(--t3); opacity:.55; flex-shrink:0; }

  /* ============================================================
     右栏：详情
     ============================================================ */
  .detail{ flex:1; overflow-y:auto; min-width:0; }
  .detail-inner{
    max-width:calc(680px * var(--fs)); padding:34px 44px 56px;
    margin:0 auto;
  }
  .detail-inner > *{ max-width:100%; }
  .kicker{
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--accent);
    margin-bottom:10px;
  }
  .detail h1{
    font-size:calc(27px * var(--fs)); line-height:1.38; font-weight:700; letter-spacing:-.6px;
    color:var(--t1); text-wrap:balance;
  }
  .byline{
    display:flex; align-items:center; gap:0;
    font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums;
    padding:14px 0 18px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .byline .sep{ width:2px;height:2px;border-radius:50%;background:var(--t3);opacity:.55;margin:0 6px; }
  .lead{
    font-size:calc(14px * var(--fs)); line-height:1.8; color:var(--t2); font-weight:500;
    padding-bottom:18px;
  }
  .prose{ font-size:calc(15px * var(--fs)); line-height:1.92; color:var(--t1); letter-spacing:.1px; }
  .prose p + p{ margin-top:15px; }
  .hint{ font-size:calc(13px * var(--fs)); color:var(--t3); }

  /* 转载说明：出处 + 原文链接 + 用途声明 */
  .source-note{
    margin-top:22px; padding:12px 14px; border-radius:10px;
    background:var(--press); border:1px solid var(--line);
  }
  .source-note .sn1{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:calc(11px * var(--fs)); color:var(--t2);
  }
  .source-note .sn1 b{ color:var(--t1); font-weight:600; }
  .source-note .sn1 a{
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line);
  }
  .source-note .sn2{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3); line-height:1.5;
  }

  .related{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .related .rh{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1); margin-bottom:4px;
  }
  .rel{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    padding:9px 0; cursor:pointer; font-family:var(--font); border-radius:6px;
    transition:opacity .13s ease;
  }
  .rel:hover{ opacity:.65; }
  .rel.on{ background:var(--press); box-shadow:inset 2px 0 0 var(--accent); padding-left:9px; }
  .rel.on .rt{ color:var(--accent); font-weight:600; }
  .rel .rt{ font-size:calc(13.5px * var(--fs)); line-height:1.5; color:var(--t1); }
  .rel .rm{ font-size:calc(10px * var(--fs)); color:var(--t3); margin-top:3px; font-variant-numeric:tabular-nums; }

  /* 窄屏返回列表：详情页左上角的小胶囊，宽屏不显示 */
  .backbtn{
    display:none; align-items:center; gap:4px;
    margin-bottom:14px; padding:6px 13px 6px 8px;
    border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs));
    cursor:pointer;
  }
  .backbtn:hover{ background:var(--press); color:var(--t1); }
  .backbtn svg{ width:14px; height:14px; }
  @media (max-width:780px){ .backbtn{ display:inline-flex; } }

  /* ============================================================
     速览：正文抽 3 句，扫一眼就够
     ============================================================ */
  .brief{
    margin:0 0 22px; padding:14px 16px 13px;
    border:1px solid var(--line); border-radius:12px; background:var(--press);
  }
  .brief .bh{
    display:flex; align-items:center; gap:7px; margin-bottom:9px;
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .brief .bh i{
    width:5px; height:5px; border-radius:50%; background:var(--accent); flex-shrink:0;
  }
  .brief ol{ margin:0; padding-left:17px; }
  .brief li{ font-size:calc(13px * var(--fs)); line-height:1.72; color:var(--t1); }
  .brief li + li{ margin-top:6px; }
  .brief .note{ margin-top:10px; font-size:calc(10px * var(--fs)); color:var(--t3); }

  /* ============================================================
     视频：内嵌播放
     ============================================================ */
  .vwrap{ margin:0 0 20px; }
  .vwrap video{
    display:block; width:100%; max-height:min(54vh, 400px);
    background:#000; border-radius:12px; border:1px solid var(--line);
  }
  .vsrc{
    margin-top:8px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; align-items:center; gap:6px;
  }
  .vsrc b{ color:var(--accent); font-weight:600; }
  .vsrc a{
    margin-left:auto; color:var(--t3); text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .vsrc a:hover{ color:var(--t1); }
  .vfallback{
    margin-top:8px; padding:9px 12px; border-radius:9px;
    background:var(--press); font-size:calc(11.5px * var(--fs)); color:var(--t2); line-height:1.6;
  }
  .vfallback a{ color:var(--accent); text-decoration:none; }

  /* ============================================================
     多源：同一件事各家怎么说
     ============================================================ */
  .cross{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .cross .ch{
    font-size:calc(11.5px * var(--fs)); font-weight:650; letter-spacing:.5px; color:var(--t1);
    margin-bottom:10px;
  }
  .cross .ca{
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cross .ca:last-child{ border-bottom:0; }
  .cross .cp{ font-size:calc(13px * var(--fs)); line-height:1.66; color:var(--t1); }
  .cross .cs{
    margin-top:5px; font-size:calc(10px * var(--fs)); color:var(--t3);
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .cross .cs span{
    padding:1px 6px; border-radius:5px; background:var(--press); color:var(--t2);
  }

  /* 列表里的视频标记 */
  .meta .vtag{ color:var(--accent); font-weight:600; }

  /* 今日速览卡（列表顶部） */
  .briefcard{
    margin:12px 12px 4px; padding:13px 15px 9px;
    border:1px solid var(--line); border-radius:14px; background:var(--press);
  }
  .briefcard .bh{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; flex-wrap:wrap; }
  .briefcard .bh b{
    font-size:calc(10px * var(--fs)); font-weight:700; letter-spacing:.8px; color:var(--accent);
  }
  .briefcard .bh small{ font-size:calc(9.5px * var(--fs)); color:var(--t3); }
  .briefcard .bi{
    display:flex; gap:9px; width:100%; text-align:left;
    padding:5px 0; border:0; background:transparent; cursor:pointer; font-family:var(--font);
  }
  .briefcard .bi:hover .t{ color:var(--t1); }
  .briefcard .bi .s{
    flex-shrink:0; min-width:24px; padding-top:2px;
    font-size:calc(9.5px * var(--fs)); color:var(--accent); font-weight:600;
  }
  .briefcard .bi .t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs)); line-height:1.56; color:var(--t2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .kws{ margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.9; color:var(--t3); }

  .actions{ display:flex; gap:9px; margin-top:26px; }
  .btn{
    border:0; cursor:pointer; font-family:var(--font);
    font-size:calc(13px * var(--fs)); font-weight:650; letter-spacing:.2px;
    padding:11px 22px; border-radius:11px;
    transition:transform .1s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.975); }
  .btn.primary{ background:var(--btn-bg); color:var(--btn-fg); }
  .btn.ghost{ background:transparent; color:var(--t2); border:1px solid var(--line); }
  html[data-theme="glass"] .btn.ghost{ border-color:rgba(255,255,255,.16); }
  .btn:hover{ opacity:.86; }

  /* 详情页头部：标题在左，操作按钮钉在右上角 */
  .detail-inner{ position:relative; }
  .dhead{ display:flex; align-items:flex-start; gap:16px; }
  .dhead-main{ flex:1; min-width:0; }
  .dactions{ display:flex; gap:7px; flex-shrink:0; }
  .act{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11.5px * var(--fs)); font-weight:600;
    letter-spacing:.2px; padding:7px 13px; border-radius:9px;
    cursor:pointer; white-space:nowrap;
    transition:opacity .13s ease, background .13s ease;
  }
  .act:hover{ opacity:.68; }
  .act.primary{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; }
  html[data-theme="glass"] .act{ border-color:rgba(255,255,255,.16); }

  /* 上一篇 / 下一篇 */
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:6px; padding:13px 0;
    border-top:1px solid var(--line);
  }
  .pager .pg{
    border:0; background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(12px * var(--fs)); font-weight:550;
    padding:3px 0; flex:1 1 0; min-width:0; text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:opacity .13s ease;
  }
  .pager .pg:last-child{ text-align:right; }
  .pager .pg:hover{ opacity:.6; }
  .pager .pg[disabled]{ color:var(--t3); opacity:.32; cursor:default; }
  .pager .pgn{
    font-size:calc(10px * var(--fs)); color:var(--t3);
    font-variant-numeric:tabular-nums; flex:0 0 auto; padding:0 10px;
  }

  /* 热搜分组标题 */
  .tgroup{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:16px 18px 7px;
    font-size:calc(10.5px * var(--fs)); font-weight:650; letter-spacing:.8px; color:var(--accent);
  }
  .tgroup .n{ color:var(--t3); font-weight:400; letter-spacing:0; }
  .tgroup:first-child{ padding-top:10px; }

  /* 热搜分类筛选条：横向滚动的胶囊，微博那种带分类的榜才有 */
  .tfilter{
    display:flex; gap:7px; align-items:center;
    padding:11px 18px 9px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-bottom:1px solid var(--line); scrollbar-width:none;
  }
  .tfilter::-webkit-scrollbar{ display:none; }
  .tfilter .tf{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:transparent; color:var(--t2); cursor:pointer;
    font-family:var(--font); font-size:calc(11px * var(--fs)); line-height:1.4;
    white-space:nowrap;
  }
  .tfilter .tf span{ color:var(--t3); font-variant-numeric:tabular-nums; font-size:calc(9.5px * var(--fs)); }
  .tfilter .tf:hover{ background:var(--press); }
  .tfilter .tf.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .tfilter .tf.on span{ color:rgba(255,255,255,.75); }
  /* 热搜行里的摘要：两行截断 */
  .trow .tx .sm{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:4px;
    font-size:calc(11.5px * var(--fs)); line-height:1.55; color:var(--t2);
  }
  .trow .tx b{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  html[data-theme="glass"] .tgroup{ padding-left:14px; padding-right:14px; }

  .urlline{
    margin-top:14px; font-family:var(--mono); font-size:calc(10px * var(--fs)); color:var(--t3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* 空态 */
  .empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:7px; padding:40px; text-align:center;
  }
  .empty .e1{ font-size:calc(13px * var(--fs)); font-weight:500; color:var(--t2); }
  .empty .e2{ font-size:calc(11.5px * var(--fs)); line-height:1.8; color:var(--t3); max-width:340px; }

  /* ============================================================
     主题选择器
     ============================================================ */
  .picker{
    position:fixed; top:52px; right:12px; z-index:50; width:186px; padding:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    opacity:0; transform:translateY(-6px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:.16s cubic-bezier(.32,.72,0,1);
  }
  html[data-theme="light"] .picker, html[data-theme="sepia"] .picker{ background:#fff; }
  html[data-theme="dark"] .picker{ background:#1A1A1D; }
  .picker.on{ opacity:1; transform:none; pointer-events:auto; }
  .pk{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
    cursor:pointer; font-size:calc(12.5px * var(--fs)); color:var(--t1);
    transition:background .13s ease;
  }
  .pk:hover{ background:var(--press); }
  .pk .sw{ width:15px;height:15px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4); }
  .pk .tick{ margin-left:auto; font-size:calc(11px * var(--fs)); color:var(--accent); opacity:0; }
  .pk.on .tick{ opacity:1; }

  /* 拖放提示 */
  .dropveil{
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  }
  .dropveil.on{ display:flex; }
  .dropveil .box{
    padding:28px 40px; border-radius:16px; border:1.5px dashed var(--t3);
    font-size:calc(13px * var(--fs)); color:#fff; letter-spacing:.3px;
  }

  /* 键盘可达性 */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============================================================
     模块容器 + 底部四大模块
     ============================================================ */
  .stage{ flex:1; min-height:0; }
  .mod{ display:none; height:100%; min-height:0; }
  .mod.on{ display:flex; }
  #mod-live, #mod-radio, #mod-settings{ flex-direction:column; overflow-y:auto; }

  /* ============================================================
     听新闻：底部朗读控制条
     ============================================================ */
  .listenbar{
    display:none; flex-shrink:0; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-top:1px solid var(--line);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  }
  .listenbar.on{ display:flex; }
  .listenbar .lb-txt{ flex:1; min-width:0; }
  .listenbar .lb-k{
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.6px;
    color:var(--accent); display:block; margin-bottom:2px;
  }
  .listenbar .lb-t{
    display:block; font-size:calc(12px * var(--fs)); color:var(--t1); line-height:1.35;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lbtn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--t2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:opacity .13s ease, background .13s ease;
  }
  .lbtn:hover{ opacity:.7; }
  .lbtn svg{ width:14px; height:14px; }
  .lbtn.main{ background:var(--btn-bg); color:var(--btn-fg); border-color:transparent; width:38px; height:38px; }
  .lbtn.main svg{ width:15px; height:15px; }

  /* 直播页里的「收听」入口 */
  .listencard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:16px 18px; margin-bottom:18px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .listencard{ background:var(--card); border-color:var(--card-border); }
  .listencard:hover{ opacity:.85; }
  .listencard .lc-i{
    width:42px; height:42px; flex-shrink:0; border-radius:50%;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
  }
  .listencard .lc-i svg{ width:16px; height:16px; }
  .listencard .lc-t{ flex:1; min-width:0; }
  .listencard .lc-t b{ display:block; font-size:calc(13.5px * var(--fs)); font-weight:650; color:var(--t1); }
  .listencard .lc-t small{ display:block; margin-top:4px; font-size:calc(11px * var(--fs)); color:var(--t3); line-height:1.5; }

  /* 直播页：真电台声音的补充入口 */
  .liverow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 14px; margin:-8px 0 18px; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:transparent;
    font-family:var(--font);
  }
  html[data-theme="glass"] .liverow{ background:var(--card); border-color:var(--card-border); }
  .liverow:hover{ opacity:.85; }
  .liverow .lr-tag{
    flex-shrink:0; padding:2px 7px; border-radius:999px;
    border:1px solid currentColor; color:var(--accent);
    font-size:calc(9.5px * var(--fs)); font-weight:650; letter-spacing:.5px;
  }
  .liverow .lr-t{
    flex:1; min-width:0; font-size:calc(11.5px * var(--fs));
    color:var(--t3); line-height:1.45;
  }
  .liverow .lr-t b{ color:var(--t1); font-weight:650; }
  .liverow .lr-go{ flex-shrink:0; font-size:calc(11px * var(--fs)); font-weight:600; color:var(--accent); }

  .tabbar{
    height:56px; flex-shrink:0; display:flex; align-items:stretch;
    padding:0 4px env(safe-area-inset-bottom, 0px);
    background:var(--bar);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1; border:0; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--t3); font-family:var(--font); font-size:calc(10px * var(--fs)); font-weight:550;
    letter-spacing:.2px; border-radius:10px;
    transition:color .15s ease, background .15s ease;
  }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--t2); }
  .tab.on{ color:var(--accent); }

  /* 模块内页：统一居中留白 */
  .wrap{ width:100%; max-width:760px; margin:0 auto; padding:26px 24px 36px; }
  .mhead{ display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
  .mhead h2{ font-size:calc(20px * var(--fs)); font-weight:700; letter-spacing:-.45px; color:var(--t1); }
  .mhead span{ font-size:calc(11px * var(--fs)); color:var(--t3); font-variant-numeric:tabular-nums; }
  .mnote{
    margin-top:22px; font-size:calc(11px * var(--fs)); line-height:1.85; color:var(--t3);
    padding-top:14px; border-top:1px solid var(--line);
  }

  /* 直播 */
  .livegrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:10px; }
  .lcard{
    text-align:left; border:1px solid var(--line); background:transparent;
    border-radius:14px; padding:14px 16px; cursor:pointer; font-family:var(--font);
    transition:background .14s ease, transform .1s ease;
  }
  .lcard:hover{ background:var(--press); }
  .lcard:active{ transform:scale(.985); }
  .lcard .lt{ font-size:calc(14px * var(--fs)); font-weight:600; letter-spacing:-.2px; color:var(--t1); }
  .lcard .lm{
    margin-top:7px; font-size:calc(10.5px * var(--fs)); font-weight:600; color:var(--live);
    display:flex; align-items:center; gap:5px;
  }
  .lcard.off .lm{ color:var(--t3); }
  .lcard .lm i{ width:5px;height:5px;border-radius:50%;background:currentColor; }

  /* 电台播放器 */
  .player{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:14px;
    padding:13px 16px; margin-bottom:20px;
    border:1px solid var(--line); border-radius:16px;
    background:var(--surface);
  }
  html[data-theme="glass"] .player{
    background:var(--card); border-color:var(--card-border);
    backdrop-filter:var(--card-blur); -webkit-backdrop-filter:var(--card-blur);
  }
  .player .pinfo{ flex:1; min-width:0; }
  .player .pname{
    font-size:calc(13.5px * var(--fs)); font-weight:650; letter-spacing:-.2px; color:var(--t1);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .pmeta{
    font-size:calc(10.5px * var(--fs)); color:var(--t3); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .player .purl{
    display:inline-block; margin-top:5px; font-size:calc(10px * var(--fs));
    color:var(--t3); text-decoration:none;
    border-bottom:1px dotted var(--t3); padding-bottom:1px;
  }
  .player .purl:hover{ color:var(--t1); }
  .player .perr{ color:var(--live); }
  .pbtn{
    width:42px; height:42px; flex-shrink:0; border-radius:50%; border:0; cursor:pointer;
    background:var(--btn-bg); color:var(--btn-fg);
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, opacity .15s ease;
  }
  .pbtn:active{ transform:scale(.94); }
  .pbtn:hover{ opacity:.88; }
  .pbtn svg{ width:15px; height:15px; }
  .pbtn.loading{ animation:breathe 1.1s ease-in-out infinite; }

  /* 电台列表 */
  .stgroup{ margin-bottom:20px; }
  .stgroup .gh{
    font-size:calc(10px * var(--fs)); font-weight:650; letter-spacing:.7px; color:var(--t3);
    padding:0 2px 6px;
  }
  .strow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; border:0; border-radius:10px; background:transparent;
    cursor:pointer; font-family:var(--font);
    transition:background .13s ease;
  }
  .strow:hover, .strow.on{ background:var(--press); }
  .strow .si{
    flex-shrink:0; width:22px; height:22px; border-radius:50%;
    background:var(--press); color:var(--t2);
    display:flex; align-items:center; justify-content:center;
    transition:background .14s ease, color .14s ease;
  }
  .strow.on .si{ background:var(--accent); color:#fff; }
  .strow .si svg{ width:8px; height:8px; }
  .strow .sn{ flex:1; min-width:0; }
  .strow .sn b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .strow .sn small{
    display:block; margin-top:2px; font-size:calc(10.5px * var(--fs)); color:var(--t3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strow .kind{
    flex-shrink:0; font-size:calc(9px * var(--fs)); color:var(--t3);
    border:1px solid var(--line); border-radius:4px; padding:1px 4px;
  }

  /* 设置 */
  .setrow{
    display:flex; align-items:center; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line);
  }
  .setrow:last-child{ border-bottom:0; }
  .setrow .sl{ flex:1; min-width:0; }
  .setrow .sl b{ display:block; font-size:calc(12.5px * var(--fs)); font-weight:550; color:var(--t1); }
  .setrow .sl small{ display:block; margin-top:3px; font-size:calc(10.5px * var(--fs)); line-height:1.7; color:var(--t3); }
  .seg{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  .seg button{
    border:1px solid var(--line); background:transparent; color:var(--t2);
    font-family:var(--font); font-size:calc(11px * var(--fs)); font-weight:550;
    padding:6px 11px; border-radius:8px; cursor:pointer;
    transition:background .14s ease, color .14s ease, border-color .14s ease;
  }
  .seg button:hover{ background:var(--press); }
  .seg button.on{ background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg); }

  /* ============================================================
     窄窗口适配
     ============================================================ */
  /* 侧栏开关：宽屏点它收起/展开侧栏，窄屏点它唤出抽屉 */
  .drawer-mask{ display:none; }
  .menu-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; flex-shrink:0;
    margin-right:2px; border-radius:8px;
    border:1px solid transparent; background:transparent;
    color:var(--t2); cursor:pointer;
    transition:background .14s ease, color .14s ease;
  }
  .menu-btn:hover{ background:var(--press); color:var(--t1); }
  .menu-btn:active{ background:var(--line); }

  /* 宽屏：收起侧栏后，阅读区吃满剩余宽度 */
  @media (min-width: 1041px){
    .app.nav-collapsed .sidebar{ display:none; }
    .app.nav-collapsed .vdiv{ display:none; }
  }

  @media (max-width: 1040px){
    .vdiv{ display:none; }

    .sidebar{
      display:block;
      position:fixed; top:0; left:0; bottom:0;
      width:268px; max-width:82vw;
      padding-top:16px;
      transform:translateX(-102%);
      transition:transform .24s cubic-bezier(.4,0,.2,1);
      z-index:120;
      background:var(--bg);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid var(--line);
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar.open{ transform:translateX(0); }

    .drawer-mask{
      display:block; position:fixed; inset:0;
      background:rgba(0,0,0,.42); z-index:110;
      opacity:0; pointer-events:none;
      transition:opacity .24s ease;
    }
    .drawer-mask.on{ opacity:1; pointer-events:auto; }
  }
  @media (max-width: 780px){
    .listcol{ width:100%; }
    /* 顶栏挤：只留图标，不要文字标签 */
    .ibtn .lbl{ display:none; }
    .detail{ display:none; }
    .body.split .listcol{ display:none; }
    .body.split .detail{ display:block; }
    /* 窄屏放不下并排，操作按钮挪到标题上方一行 */
    .dhead{ flex-direction:column-reverse; align-items:stretch; gap:0; }
    .dactions{ padding-bottom:12px; }
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grad"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="app">
  <!-- 抽屉遮罩必须放在 .app 里面：.app 有 z-index:1，自成一个层叠上下文，
       放在外面的话遮罩(110)会盖住整个 .app，包括 z-index:120 的侧栏——
       表现就是「抽屉打开了，点栏目没反应」，其实点中的是遮罩。 -->
  <div class="drawer-mask" id="drawerMask"></div>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" title="分区与热搜" aria-label="打开分区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>
    <div class="brand">New<em>Gent</em></div>
    <div class="spacer"></div>
    <div class="updated" id="updated"></div>
    <button class="ibtn" id="loadBtn" title="载入 app_data.json（也可直接把文件拖进窗口）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/>
      </svg>
      <span class="lbl">载入数据</span>
    </button>
    <button class="ibtn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/>
      </svg>
    </button>
  </header>

  <div class="stage" id="stage">

    <!-- ── 新闻 ── -->
    <main class="body mod on" id="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="vdiv" id="vdiv1"></div>
      <section class="listcol">
        <div class="lc-head">
          <span class="t" id="listTitle">今日要闻</span>
          <span class="c" id="listCount"></span>
        </div>
        <div class="lc-scroll" id="listScroll"></div>
      </section>
      <div class="vdiv" id="vdiv2"></div>
      <section class="detail" id="detail"></section>
    </main>

    <!-- ── 直播 ── -->
    <section class="mod" id="mod-live">
      <div class="wrap" id="liveBody"></div>
    </section>

    <!-- ── 电台 ── -->
    <section class="mod" id="mod-radio">
      <div class="wrap" id="radioBody"></div>
    </section>

    <!-- ── 设置 ── -->
    <section class="mod" id="mod-settings">
      <div class="wrap" id="settingsBody"></div>
    </section>

  </div>

  <!-- 听新闻：朗读控制条（不朗读时隐藏） -->
  <div class="listenbar" id="listenBar">
    <div class="lb-txt">
      <span class="lb-k" id="lbKicker">收听</span>
      <span class="lb-t" id="lbTitle"></span>
    </div>
    <button class="lbtn" id="lbPrev" title="上一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.4v14H7zM19 5v14l-8.6-7z"/></svg>
    </button>
    <button class="lbtn main" id="lbToggle" title="暂停 / 继续"></button>
    <button class="lbtn" id="lbNext" title="下一条">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 5H17v14h-2.4zM5 5l8.6 7L5 19z"/></svg>
    </button>
    <button class="lbtn" id="lbClose" title="停止收听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-mod="news">

:"11月19日，在2026年APEC領導人非正式會議的全家福合影，定格了經濟體的歷史性同框。各國領導人披着一條香雲紗長巾，沈穩紅與深邃藍兩色輝映。其中獨特的「英雄紅」來自順德薯莨與河泥「魔法」變出的香雲紗，花了不少功夫才登上國禮的舞台。\n今次中方配飾「同心合錦」紅藍CP驚艷世界，藍色圍巾以蘇州上久楷的宋錦織造，紅色圍巾則是來自順德的香雲紗染整。「同心合錦」中的那抹磚紅色並非化學染劑，而是源自順德倫教曬莨裏，薯莨與河泥的古老魔法。經過30多道純手工、無化學助劑的染整工序，在日光、河泥與草地的反復催化下，才沈澱出那份沈穩的「英雄紅」。\n從老師傅靠經驗到規範化\n傳統香雲紗「憑手感、看眼力」，導致市場上真偽難辨、良莠不齊，成為高端品牌化的最大阻礙，但倫教政府特別出台《香雲紗品類與等級評定規範》團體標準，將老師傅的經驗轉化為包含色牢度、撕拉力等指標的理化數據，並結合非遺傳承人的感官評定。\n2026年4月，首批「優等品」評定落地。優質香雲紗獲得品質認證，打開了成為國禮的大門。\n順德河泥獨特 溫濕度難複製\n其他地方即使能種出薯莨（一種薯蕷科薯蕷屬植物）、仿造工序，也搬不走順德特有的富含鐵離子的河泥，搬不走珠三角的日照與溫濕度，更搬不走一代代順德手藝人沈澱的技藝。\n如今的順德倫教，手握國家級非遺、國家地理標誌產品、國家地理標誌證明商標三張「國字號」名片，2025年香雲紗產能突破1000萬米，曬莨場逾1600畝，倫教建立出全國首個香雲紗全產業鏈園區，將面料生產、設計研發、品牌孵化、交易展貿整合於一體。\n當「同心合錦」需要批量交付高品質長巾時，順德能夠迅速調度產能、控制品質。從原產地的保護，到規模化、標準化的生產，順德香雲紗完成了從「農產品式作坊」向「現代時尚工業」的躍升。\n小知識：大合照傳統服裝何以簡化成圍巾？\n自1993年西雅圖峰會，時任美國總統克林頓贈送每人一件皮褸開始，APEC就出現了了穿東道主特色服裝拍大合照慣例，例如上海唐裝、越南奧黛等。後來有官員對於穿異國傳統服飾感到不自在，近年多國簡化為有各國特色的圍巾，在保留了宣傳本土文化工藝的同時免各國領袖感到拘束 。","image":"","video":"","video_poster":"","lang":"zh-Hant","items":[{"title":"深圳APEC｜全家福長巾「紅藍雙絕」 拆解紅色「順德香雲紗」國禮手作奧秘","url":"https://www.stheadline.com/realtime-china/3638940/深圳APEC全家福長巾紅藍雙絕-拆解紅色順德香雲紗國禮手作奧秘","source_display":"星島頭條","published_at":"2026-11-19T17:30:54+08:00","category":"內地","digest":"11月19日，在2026年APEC領導人非正式會議的全家福合影…"},{"title":"深圳APEC｜李家超晤新加坡總理黃循財 感謝支持香港加入RCEP 邀星企發掘河套商機","url":"https://www.stheadline.com/politics/3638938/深圳APEC李家超晤新加坡總理黃循財-感謝支持香港加入RCEP-邀星企發掘河套商機","source_display":"星島頭條","published_at":"2026-11-19T17:12:39+08:00","category":"港聞","digest":"行政長官李家超於下午在深圳出席亞太經合組織相關活動期間，與新加坡總理黃循財會面"},{"title":"深圳APEC｜李家超：與習近平短暫交流 匯報大灣區機遇及香港發展優勢","url":"https://www.stheadline.com/politics/3638875/深圳APEC李家超與習近平短暫交流-匯報大灣區機遇及香港發展優勢","source_display":"星島頭條","published_at":"2026-11-19T14:41:34+08:00","category":"港聞","digest":"第33次亞太經合組織領導人非正式會議在深圳召開"},{"title":"深圳APEC｜李家超：達五成果 包括與智利簽定工作假期計劃協議","url":"https://www.stheadline.com/politics/3638845/深圳APEC李家超達五成果-包括與智利簽定工作假期計劃協議","source_display":"星島頭條","published_at":"2026-11-19T13:50:04+08:00","category":"港聞","digest":"亞太區經濟合作組織第三十三 :4,"keywords":[],"body":"中新社深圳11月19日电 11月19日下午，中国国家主席习近平在深圳会见来华出席亚太经合组织领导人非正式会议的美国总统特朗普。\n\n　　习近平指出，过去几个月，从北京到华盛顿，我和特朗普总统共同探索中美两个大国正确相处之道，确立了“中美建设性战略稳定关系”的新定位，并赋予其“基于尊重、公平、对等”的新内涵，受到中美两国人民认可和国际社会欢迎。中美关系总体稳定向好，给两国人民带来实实在在的利益，也给世界注入稳定性和确定性。我期待同特朗普总统一道，继续为中美关系领航掌舵，确保这艘大船始终沿着正确航线扬帆远航。\n\n　　习近平强调，构建中美建设性战略稳定关系是前无古人的开创性事业，需要敢闯敢试、脚踏实地、善作善成。中美元首外交的引领作用不可替代。要延续中美关系目前的稳定向好势头，关键是要在落实元首共识上付诸行动。双方团队的沟通也要跟上。要拉长合作清单、压缩问题清单，一时解决不了的分歧要建设性管控，防止矛盾升级。在台湾问题上，美方要坚持做正确的事，避免中美关系出现大的波折。经贸领域要加强沟通，解决彼此关切，争取互利互惠。两国在禁毒、非法移民遣返、打击电信网络诈骗等领域的合作卓有成效，可以本着尊重、公平、对等的原则继续加强合作。中美应当加强沟通和协调，防范人工智能安全风险，确保人工智能始终处于人类控制之下。\n\n　　特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。\n\n　　双方认为此次会晤是积极、建设性的，同意制定建设性战略稳定关系行动计划，落实两国元首共识，构建基于尊重、公平、对等的中美建设性战略稳定关系。\n\n　　两国元首还就共同关心的国际和地区问题交换了意见。\n\n　　蔡奇、王毅、何立峰、黄坤明等参加会见。(完) 【编辑:黄钰涵】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml","source_display":"中國新聞網","published_at":"2026-11-19T17:27:46+08:00","category":"內地","digest":"11月19日下午…"},{"title":"习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734694.shtml","source_display":"中新網 時政","published_at":"2026-11-19T16:22:55+08:00","category":"內地","digest":"11月19日下午…"},{"title":"新华图讯丨习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734624.shtml","source_display":"中新網 時政","published_at":"2026-11-19T15:24:16+08:00","category":"內地","digest":"新华图讯丨习近平会见美国总统特朗普"},{"title":"习近平会见美国总统特朗普","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734607.shtml","source_display":"中國新聞網","published_at":"2026-11-19T14:08:40+08:00","category":"內地","digest":"11月19日下午…"}],"cross":{"total":4,"angles":[{"point":"11月19日下午…","sources":["中國新聞網","中新網 時政","中國新聞網"],"url":"https://www.chinanews.com.cn/gn/2026/11-19/10734739.shtml"},{"point":"新华图讯丨习近平会见美国总统特朗普"," 异，创造了经济快速发展的“亚太奇迹”。面对新的机遇和挑战，亚太合作必须适应新形势、迈出新步伐、开创新局面，推动建设和衷共济、开放融通、开拓创新、包容发展的亚太共同体。\n\n　　一要坚持和衷共济，拉紧共同利益纽带，携手应对困难和挑战，持续培育共同体意识。二要坚持开放融通，稳步推进经济一体化进程，构建开放而不排他、融合而不分割的合作格局，倡导自由开放的贸易和投资，为亚太经济增长开拓更广阔空间。三要坚持开拓创新，鼓励科技交流合作，促进创新成果转化，营造开放、公平、公正、非歧视的合作环境，推动机制理念创新和结构性改革，不断释放亚太经济的活力和潜力。四要坚持包容发展，让发展成果普惠共享，增加民众获得感，照顾各方舒适度，为实现亚太共同体目标积累有利条件。\n\n　　习近平强调，中国是亚太经济合作的倡导者、推动者、先行者。中方愿同各方一道，集思广益、汇聚合力，携手搭建亚太共同体的“四梁八柱”。\n\n　　第一，强化经贸支柱。亚太自由贸易区是亚太经合组织成员的共同愿景，要稳步向前推进，打造更高水平的开放格局。推动区域经贸协定对接，提升贸易投资便利化、数字化水平，减少贸易投资壁垒。加强政策对话，开展经验交流和技术合作，提高各方参与高水平经贸安排的能力。\n\n　　第二，升级联通支柱。互联互通是区域经济一体化的纽带。要巩固“硬联通”，完善基础设施网络；增强“软联通”，促进政策和监管协调；密切“心联通”，便利商旅和人员往来，促进人文交流和民众相知相亲。\n\n　　第三，打造创新支柱。数字经济和人工智能是创新增长的引擎。要加强数字基础设施建设，完善区域数据治理和协同合作，实现高效、便捷、安全的跨境数据流动。打造开放创新生态，促进人工智能广泛应用，推动产业转型升级、向新发展。\n\n　　第四，夯实发展支柱。要加强能力建设，推动区域能源和粮食安全合作，深化跨境腐败治理。推动资源、环境、人口协调发展，拓展绿色低碳合作，实现经济可持续增长。支持改善民生和投资于人，实施健康老龄化行动，促进就业和职业技能开发，支持妇女经济赋权和青年人才交流，释放亚太人才活力。\n\n　　习近平宣布中方支持亚太合作的最新举措，包括提供2000万美元资助开展亚太经合组织务实合作；在深圳设立亚太共同体研究中心，开展政策研究和交流，提供智力支撑；在数字技术、数据跨境流动、清洁能源、中小企业发展等领域设立合作机构，助力亚太创新、绿色增长。\n\n　　各经济体领导人及代表围绕会议主题“建设亚太共同体，促进共同繁荣”依次发言。各方高度评价APEC“中国年”取得的丰硕成果，感谢中方所做出色工作，积极呼应习近平主席提出的重大倡议举措。各方表示，愿密切各领域合作，携手应对风险挑战，推动亚太经合组织实现更大发展，为地区和世界的和平、稳定、繁荣作出贡献。国际货币基金组织总裁格奥尔基耶娃应邀介绍当前全球经济形势。\n\n　　习近平听取各方发言后作总结发言，就高质量推进亚太合作提出3点主张：一是坚定信心，努力将建设亚太共同体的共识转化为行动，把愿景变为现实。二是把准方向，始终锚定建设亚太共同体的大方向不动摇，以强烈的使命感推进各领域合作，携手创造亚太更加美好的未来，推动构建人类命运共同体。三是实干笃行，抓住发展这个最大公约数，尊重规律、真抓实干、善作善成，不断取得可感可及的亚太合作成果。\n\n　　会议最后进行东道主交接，2027年亚太经合组织东道主越南国家主席苏林欢迎各经济体领导人、代表明年前往越南出席会议。\n\n　　会议一致通过2026年亚太经合组织领导人宣言，就亚太共同体建设提出“深圳展望”，以及贸易、联通、创新领域3项成果文件。\n\n　　蔡奇、王毅出席。(完) 【编辑:叶攀】","image":"","video":"","video_poster":"","lang":"zh-Hans","items":[{"title":"（深圳APEC）习近平主持亚太经合组织第三十三次领导人非正式会议并发表重要讲话","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734613.shtml","source_display":"中國新聞網","published_at":"2026-11-19T14:37:43+08:00","category":"內地","digest":"11月19日上午…"},{"title":"新华图讯丨习近平主持亚太经合组织第三十三次领导人非正式会议","url":"https://www.chinanews.com.cn/gn/2026/11-19/10734573.shtml","source_display":"中新網 時政","published_at":"2026-11-19T12:46:09+08:00", 。第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。详情点击>>\n\n新一轮国企改革全面实施，国资委强调发展未来产业要防止“一哄而上”\n\n丽莎对界面新闻表示，现代产业核心技术研发投入大、周期长、风险高、交叉性强，单一龙头企业难以独立完成全链条技术突破，尤其在根技术、共性技术、前沿技术领域，需要多元主体联合攻关。胡迟对界面新闻表示，提升国资监管效能需要构建纵横协同的监管体系。详情点击>>\n\nAPEC 2026｜从华强北到亚太产业链：深圳智能硬件的世界坐标\n\n陈金尧告诉界面新闻，其中在东南亚，泰国已成为其中增长最快的市场之一。郭彦东告诉界面新闻，智平方的机器人当“志愿者”之前快速学习了十几门外语，APEC经济体里国家常用的语言它都会。杨倩向界面新闻分析道，亚太市场对具身智能、物理AI技术的需求是真实且长期的。详情点击>>\n\n如何看待当前消费市场表现？商务部提到三个特点\n\n罗志恒对界面新闻表示，当前，有效需求不足是宏观经济运行的突出矛盾，主要表现为居民消费动力不足、企业投资意愿偏弱。居民消费不足，既与收入增长和就业预期有关，也受到社会保障不够完善、教育医疗养老等支出压力较大、预防性储蓄倾向较强等因素影响。详情点击>>\n\n特朗普说美国不支持“台独”\n\n特朗普非常感谢中方对他的热情接待，表示建交40多年来，美中关系取得显著进展。我同习近平主席保持密切交往，友谊日益深厚，共同引领美中关系发展。两国贸易、投资关系不断加强，芬太尼等领域合作取得成效。双方应保持美中关系稳定发展势头，在农产品、能源、超级智能等领域加强合作，公平处理好各自关切。美国不支持“台独”。祝贺中方成功举办亚太经合组织领导人非正式会议。美国非常强大，中国也非常强大，两国要共同引领和促进世界和平稳定。详情点击>>\n\n日媒称中方对高市早苗的简朴接机仪式引发关注，中方回应\n\n日本朝日新闻记者提问，关于APEC峰会期间对访华领导人的机场迎接，日本首相受到的简朴迎接仪式引发广泛关注。请问在迎接方式上采取这种方法，中方有什么考虑？郭嘉昆表示，作为东道主，中方根据国际惯例，对所有参会方作出适当的礼宾安排。详情点击>>\n\n被判有期徒刑4年，金建希涉争议案件终审结果出炉\n\n尹锡悦夫妻以总统职权为核心、夫妻分工协作的系统性腐败模式‌，成为韩国政坛标志性案件。金建希背负的刑事指控集中在‌影响力受贿、股价操纵、违规斡旋‌三大类，相关案件大多已进入二审及后续审理阶段。除了上述罪名，自尹锡悦2021年12月参选总统起，金建希便被爆出存在学术不端、履历造假等问题。详情点击>>\n\n马斯克：我是中国的超级粉丝\n\n马斯克11月19日在深圳说：“我是中国的超级粉丝。中国很酷。我一直鼓励世界各地的人们来中国走走，亲眼看看中国这些了不起的地方。这里有不可思议的城市、不可思议的自然风光，还有像兵马俑这样的世界奇迹。美中合作越多，各自也会越好。”详情点击>>\n\n未经正式授权严禁转载本文，侵权必究。界面晚报\n\n点赞\n收藏\n看评论\n\n分享至微博分享\n微信分享\nQQzone\n\n沉浸模式\n\n评论\n\n暂无评论哦，快来评价一下吧！\n\n下载界面新闻\n\n 微信公众号\n\n微博\n\n上海界面财联社科技股份有限公司 版权所有 © 2014-2026 JIEMIAN.COM\n关于我们\n联系我们\n广告合作\n注册协议\n投稿须知\n版权声明\n举报及处置\n\n界面晚报 | 习近平就大国如何正确相处提出4点看法；商务部谈当前消费市场表现\n\n国资委强调发展未来产业要防止“一哄而上”；从华强北到亚太产业链：深圳智能硬件的世界坐标；金建希涉争议案件终审结果出炉。以下是界面新闻为你梳理的11月19日晚报新闻。\n\n原创新闻界面综合 · 2026/11/19 17:27来源：界面新闻\n\n习近平就大国如何正确相处提出4点看法\n\n11月19日下午，国家主席习近平在深圳同俄罗斯总统普京、美国总统特朗普举行中俄美元首会晤。习近平就大国如何正确相处、共同为世界和平托底提出4点看法：第一，坚持相互尊重。相互尊重是大国交往的基本准则。第二，坚持和平共处。“修昔底德陷阱”绝不是宿命，关键要看主要大国如何抉择。第三，坚持合作共赢。三国发展禀赋不同，经济互补性强，可以发挥自身优势，互通有无。第四，坚持对话协商。大国间有分歧在所难免，如果不沟通，猜忌便会蔓延，小摩擦也可能演变成大冲突。详情点击>>\n\n新一轮国企改革全面实施，国资委强调发展未来产业要防止“一哄而 "title":"恆豐酒店與錦倫旅運合謀定價罰款10.4萬 競委會上訴得直 改判罰款95萬","url":"https://www.stheadline.com/society/3638953/恆豐酒店與錦倫旅運合謀定價罰款104萬-競委會上訴得直-改判罰款95萬","summary":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間，因不滿同業在酒店的銷售價格較低，多次向酒店施壓，要求與對手落實定價。","summary_short":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間…","digest":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司…","points":["旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間…","競爭事務審裁處裁定他們合謀定價並違反《競爭條例》，去年下令恆豐酒店罰款10.4萬元","競委會認為罰款過低提出上訴，高等法院上訴庭今頒下判詞，裁定競委會上訴得直…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:43:52+08:00","size":1,"keywords":[],"body":"旅議會前主席胡兆英及其擔任董事總經理的錦倫旅運有限公司，在2016年於酒店出售旅遊門票期間，因不滿同業在酒店的銷售價格較低，多次向酒店施壓，要求與對手落實定價。競爭事務審裁處裁定他們合謀定價並違反《競爭條例》，去年下令恆豐酒店罰款10.4萬元。競委會認為罰款過低提出上訴，高等法院上訴庭今頒下判詞，裁定競委會上訴得直，指原審判刑未能反映嚴重性及起阻嚇，終改判恆豐酒店罰款95萬元。\n上訴方為競爭事務委員會，而答辯方為擁有恆豐酒店的Prudential Hotel(BVI) Limited。\n競委會指罰款額須超違規行為得益以阻嚇\n上訴方早前提出認為罰款10.4萬元過低，強調罰款額須超越違規行為所得的利益，以作出足夠阻嚇作用，維護公平競爭環境，否則難以體現違反競爭法的嚴重性。恆豐酒店一方則指，罰款10.4萬元已足夠反映其罪責，重申恆豐酒店並非整個安排的發起者，只是充當「促成者」角色。\n判詞指，恆豐酒店一方與其他涉案人士合謀定價，雖然恆豐酒店只負責協調安排，它每月向錦倫收取固定租金，並不受涉案門票銷售額影響，但事件性質嚴重，涉及到合謀定價及排除基本競爭，符合條例下嚴重反競爭行為的定義，屬於價格競爭中典型的侵害行為，而價格競爭在經濟巿場上如同中樞神經系統一般。\n恆豐擔當中間人角色參與程度不被動 \n判詞續指，恆豐酒店即使沒有因應涉事門票銷售額而直接影響收入，它在合謀仍有着關鍵角色，而非純粹被動，例如恆豐酒店會負責把綿倫的價格轉達給Tink Labs、並要求Tink Labs跟隨定價，它擔當了中間人角色；甚至會令人懷疑，如果沒有恆豐酒店的協調，涉案合謀能否落實。\n恆豐酒店一方原被判罰款10.4萬元，這甚至少過它在案發時的租金收入，上訴庭認為競爭事務審裁處在原審判刑時未有充分考慮阻嚇需要，為反映案中合謀的嚴重性及恆豐酒店的參與程度，終改判罰款95萬元、須於42日內支付，並須向競委會一方支付訟費。\n案件編號：CACV218/2025\n法庭記者：王仁昌","image":"","video":"","video_poster":"","lang":"zh-Hant"}],"sections":[{"name":"港聞","total":13,"items":[{"id":"cf268f4238c","title":"市建局土瓜灣道／榮光街發展計劃 由信和夥鷹君財團以26.88億元投得","url":"https://www.stheadline.com/society/3638952/市建局土瓜灣道榮光街發展計劃-由信和夥鷹君財團以2688億元投得","summary":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作，發展土瓜灣道／榮光街發展計劃，中標金額為26.88億元。","summary_short":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作…","digest":"市建局公布，經過公開招標程序後…","points":["市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成…","市建局預計項目將於2032年落成","市建局發言人表示，多間主要發展商均有參與是次投標，入標數量與出價均在預期之內…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:42:19+08:00","size":1,"keywords":[],"body":"市建局今日（19日）公布，經過公開招標程序後，決定與由信和置業有限公司及鷹君集團有限公司組成的財團「天瑋有限公司」合作，發展土瓜灣道／榮光街發展計劃，中標金額為26.88億元。市建局預計項目將於2032年落成。\n市建局：入標數量與出價均在預期之內\n今次項目於11月11日截標時共接獲三份標書。由市建局董事會設立的招標遴選小組在審慎評估標書後，建議將合約批予「天瑋有限公司」，並獲董事會接納。市建局發言人表示，多間主要發展商均有參與是次投標，入標數量與出價均在預期之內，最終中標價亦相當貼近市價。市建局在與中標財團完成簽訂發展合約後，將以不記名方式適時公布其餘未中標公司的投標金額。\n發揮「小區重建」協同效應\n土瓜灣道／榮光街項目為市建局首個「小區重建新社區」（Victoria Cove Central，簡稱VCC）的最後一期。連同是次批出的項目，整個VCC共八個項目已匯聚八間主要發展商參與，反映小區規劃模式獲市場支持。\n市建局行政總監蔡宏興對參與投標的發展商及財團表示感謝。他指出，今次入標的發展商中，有三間均有參與發展VCC或毗鄰項目，證明業界充分肯定VCC整全規劃的長遠價值。他續稱，新項目將與區內另外七個正施工的重建項目產生協同效應，配合市建局提出的「海—岸—陸」整體規劃方針，營造更具活力的社區，並響應構建「東維港灣區」的願景。\n建兩條行人天橋成「超級連接」 \n根據規劃，是次項目除作商住用途外，亦兼負改善區內步行環境及社區配套的重任。項目將興建兩條行人天橋，貫通港鐵土瓜灣站及毗鄰七個重建項目，形成「超級連接」網絡；同時將提供不少於5,500平方米的非住用樓面面積作社福設施用途，並增設公共空間。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c9b20c8a078","title":"聽▶︎港聞｜鄺港智供稱譚方駿鍾意自己／港青可獲智利一年簽證／午夜氣溫料最低約18度｜2026年11月19日","url":"https://news.tvb.com/tc/1207240-聽港聞鄺港智供稱譚方駿鍾意自己港青可獲智利一年簽證午夜氣溫料最低約18度2026年11月19日","summary":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地，其後用相同方法，往返內地和香港，每次都是包船，費用是10萬元，自己有能力支付。","summary_short":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地…","digest":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行…","points":["大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行…","➤ 蔡天鳳碎屍案｜鄺港智供稱譚方駿鍾意自己　「所以三個人就一齊」","行政長官李家超在深圳出席亞太經濟合作組織(APEC)領導人非正式會議…"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T17:25+08:00","size":1,"keywords":[],"body":"大埔龍尾村蔡天鳳肢解案續審，蔡天鳳前夫鄺港智作供時提及，2015年8月，因為涉及罪行，要坐「大飛」前往內地，其後用相同方法，往返內地和香港，每次都是包船，費用是10萬元，自己有能力支付。\n\n➤ 蔡天鳳碎屍案｜鄺港智供稱譚方駿鍾意自己　「所以三個人就一齊」\n\n行政長官李家超在深圳出席亞太經濟合作組織(APEC)領導人非正式會議，期間與多位成員經濟體領袖會面。他表示，與智利總統共同見證簽署工作假期計劃協議，香港青年可獲一年工作假期簽證，為香港首次與拉丁美洲國家合作推出工作假期計劃 。\n\n➤ 李家超：與智利簽署工作假期計劃協議　香港青年可獲一年簽證\n\n受強烈東北季候風影響，早上氣溫轉涼。\n\n➤ 天氣｜早上氣溫轉涼　天文台預測氣溫逐漸下降至午夜最低約18度\n\n巴拿馬當局完成審查長和集團子公司的港口特許經營合約，發現公司與當地政府前官員可能涉嫌違規，將提出刑事訴訟。長和集團早前啟動國際仲裁程序，向巴拿馬當局索償。\n\n➤ 巴拿馬完成審查長和子公司港口特許經營合約　稱或涉嫌違規將提出刑事訴訟\n\n警方搗破兩個電話詐騙中心，更發現騙徒改用固網電話行騙，懷疑是逃避電話卡實名制措施。\n\n➤ 警方搗破兩個電騙中心　發現騙徒改用固網電話行騙疑逃避電話卡實名制\n\n(旁述由AI生成)","image":"https://pro-vod-cdn.tvb.com/681879f8f50f400492bd7d65da705d27/snapshots/dc865f4840324f8495c20ee3aeef31df-00008.jpg","video":"https://pro-vod-cdn.tvb.com/681879f8f50f400492bd7d65da705d27/669796073aa0427d8ab8ad00f46c78ca-eb01212bd90bb3cb4baa3625fdddce1c-sd.m3u8","video_poster":"https://pro-vod-cdn.tvb.com/681879f8f50f400492bd7d65da705d27/snapshots/dc865f4840324f8495c20ee3aeef31df-00008.jpg","lang":"zh-Hant"},{"id":"c5cf0524a3d","title":"藍田啟田道中學疑有「尿袋」起火冒煙 14歲男學生燒傷送院","url":"https://www.stheadline.com/breaking-news/3638948/藍田啟田道中學疑有尿袋起火冒煙-14歲男學生燒傷送院","summary":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。","summary_short":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。","digest":"下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄…","points":["今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前…","事發時一名14歲男學生在校內使用「尿袋」，其間疑「尿袋」短路起火冒煙，男學生被燒傷…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T17:13:55+08:00","size":1,"keywords":[],"body":"今日（19日）下午3時許，藍田啟田道5號聖公會基孝中學發生火警，消防接報到場前，火勢已被救熄，事件中毋須疏散。\n據了解，事發時一名14歲男學生在校內使用「尿袋」，其間疑「尿袋」短路起火冒煙，男學生被燒傷，幸仍然清醒，由救護車送往聯合醫院治理。\n消防到場調查起火原因。曾志恒攝\n現場為藍田啟田道5號聖公會基孝中學。曾志恒攝","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c968cf39e6e","title":"立法會通過深化國際教育樞紐議案 議員促重啟傳統名校轉直資","url":"https://www.stheadline.com/society/3638872/立法會通過深化國際教育樞紐議案-議員促重啟傳統名校轉直資","summary":"立法會大會今早（19日）續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設，構建國際升學首選地」的無約束力議員議案，終獲在席兩部分議員分別以過半數支持，獲議通過。","summary_short":"立法會大會今早（19日）續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設…","digest":"立法會大會今早續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設…","points":["立法會大會今早（19日）續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設…","管浩鳴促容百年名校轉直資吸海外生","選委界管浩鳴認為直資擴容要深刻思考，舉例2018年香港華仁書院的正式申請被拒之後…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:45:52+08:00","size":1,"keywords":[],"body":"立法會大會今早（19日）續會，繼續辯論由選委界范凱傑提出，「深化國際教育樞紐建設，構建國際升學首選地」的無約束力議員議案，終獲在席兩部分議員分別以過半數支持，獲議通過。\n管浩鳴促容百年名校轉直資吸海外生\n選委界管浩鳴認為直資擴容要深刻思考，舉例2018年香港華仁書院的正式申請被拒之後，基本上就再無傳統資助名校成功轉制，而前特首曾蔭權和現任特首李家超，就分別是兩間華仁書院的畢業生。他相信傳統名校都是家長趨之若鶩，很多來自海外的人士想來就讀，希望教育局在直資擴容之外，考慮對於百年名校、高等學府可以開放嘗試申請為直資。\n他明白社會會討論公平問題，但只是要小心避免基層學生未能在這些學校就讀，認為可以考慮有全面減免的機制，最重要是學校能夠招收到高質學生，譬如學生被小學推薦升讀，是否可以有另外的資金幫助。他希望政府思考，香港成為國際升學首選地，就要明白市場上如何吸引大家來香港，又是否能夠選擇來香港升學。\n陳祖恒籲擴大「留學香港」推廣 吸海外名校落戶\n經民聯陳祖恒建議加大投入推廣「留學香港」品牌，研究將推廣範圍，由過往集中在高等教育，擴大至涵蓋整個教育體系，特別是香港有優勢的專業，用好「留學香港專班」，更主動地組織本港教育專家、機構，到海外參展及出席國際會議，向全球釋出「留學香港」的清晰訊息；同時善用資源，在香港舉辦大型教育展覽，積極爭取國際性教育會議落戶香港，讓海外院校與學生親身體驗香港的優勢，以實地交流建立長遠的國際口碑。\n他亦建議盡快吸引國際知名院校落戶香港，無論是開設辦事處、研發或交流中心、以及分校，盡快和香港建立聯繫，才能為香港持續拓展國際網絡優勢鋪路。他又建議吸引頂尖行業機構與港校合辦課程，研究為本港發展急需的戰略性學科加大投入，推動本港包括職專教育機構在內的院校，與國際頂尖行業機構合作辦校，為本地及國際學生提供系統性訓練、學術資格和就業階梯，聚焦又迅速地培養「八大中心」定位的相關人才。\n教育局：支持各大院校加強全球宣傳\n教育局副局長施俊輝表示，當局持續支持各大院校主動走出去，包括加強全球宣傳活動和參與各地的教育展覽，向海外展示香港高等教育界的優勢和特點，開拓多元化生源，除了提供奬學金，當局亦會通過交流分享會幫助同學了解香港的學習、生活、升學和就業前景，以及建立同儕和校友的網絡。\n至於「直資擴容」，他表示，根據今年九月直資學校點算在學人數結果，本學年持學生簽證以自資模式入讀直資學校的非本地學生人數合共170人，較去年上升13％，反映計劃開局良好，亦顯示海外學生及家長對香港基礎教育具一定信心。「直資擴容」是國際教育樞紐建設推進至基礎教育的第一步，教育局會以先行先試方式逐步推行計劃，並會適時研究未來發展方向，從而容讓學界不同界別均能參與推進國際教育樞紐建設。\n記者：郭詠欣","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c33155a111a","title":"歷來最大型「香港繽紛冬日巡禮」 中環皇后像廣場22米高聖誕樹任打卡 尖沙咀太空館化身夢幻水晶球","url":"https://www.stheadline.com/hot-place/3638699/歷來最大型香港繽紛冬日巡禮-中環皇后像廣場22米高聖誕樹任打卡-尖沙咀太空館化身夢幻水晶球","summary":"聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛，年度盛事「香港繽紛冬日巡禮」於昨晚在中環和尖沙咀閃亮登場，慶祝活動一直延伸至2027年1月5日。","summary_short":"聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛，年度盛事「香港繽紛冬日巡禮」於昨晚在中環和尖沙咀閃亮登場…","digest":"聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛…","points":["聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛…","今次巡禮歷來規模最大，分別在中環、尖沙咀和銅鑼灣設3個「冬日小鎮」，結合璀璨聖誕裝置…","中環皇后像廣場花園化身成夢幻歐陸聖誕小鎮，以「環球聖誕歷奇」為主題…"],"section":"港聞","category":"","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:29:23+08:00","size":1,"keywords":[],"body":"聖誕節還有一個多月到臨，香港旅遊發展局率先掀動冬日繽紛氣氛，年度盛事「香港繽紛冬日巡禮」於昨晚在中環和尖沙咀閃亮登場，慶祝活動一直延伸至2027年1月5日。\n今次巡禮歷來規模最大，分別在中環、尖沙咀和銅鑼灣設3個「冬日小鎮」，結合璀璨聖誕裝置、繽紛光影表演以及聖誕市集，將節日歡樂氣氛推至最高，其中中環設6層樓高的巨型聖誕樹，成為打卡熱點。\n中環皇后像廣場花園化身成夢幻歐陸聖誕小鎮，以「環球聖誕歷奇」為主題，設有12米長經典蒸汽火車、馴鹿及熱氣球等精緻聖誕裝置。現場最矚目是歷年最高的22米、相當於約6層樓高的戶外聖誕樹，市民及旅客可漫步於熱氣球航站及聖誕列車站之間，盡情打卡。聖誕老人更會在指定日子，現身小鎮內的聖誕郵局，與市民及旅客見面。\n除了充滿異國風情的聖誕裝飾，每晚7時起，皇后像廣場花園附近共9座地標建築，包括中國銀行大廈、中銀大廈、香港大會堂高座、香港會所大廈、滙豐總行大廈、香港文華東方酒店、太子大廈、渣打銀行大廈及終審法院大樓的外牆，將上演8幕沉浸式光影表演。演出以經典蒸汽火車貫穿全場，帶領觀眾穿梭冰雪天地、玩具世界及糖果王國等奇幻場景，並途經山頂纜車等香港特色地標，令人目不暇接。光影表演期間，巨型聖誕樹及小鎮內的打卡裝置，亦會隨節奏變換色彩。\n此外，小鎮還設有多間特色小木屋，市民及旅客可以一邊挑選節日禮物、品嘗美食，一邊欣賞城市夜色。場內亦特設聖誕珍藏市集，義賣歷年珍藏聖誕紀念品及珍藏聖誕回憶，收益將作慈善用途。訪客還可到訪聖誕寄願站，於明信片專區寫下節日祝福，寄送給親友。\n尖沙咀冬日小鎮沉浸式光影音樂表演打造視覺盛宴\n香港旅遊發展局「香港繽紛冬日巡禮」系列活動中，尖沙咀冬日小鎮昨晚亦開幕，呈獻兩大主題沉浸式光影音樂表演，為觀眾帶來視覺盛宴。\n尖沙咀鐘樓及香港文化中心化身光影舞台，上映「冬日星光音樂會」光影表演，播放多首觀眾耳熟能詳的聖誕樂曲，重新演繹成活力十足的流行舞曲，並以璀璨光影與動感音樂交織，為海濱注入節日動感。\n遊人沿海濱漫步，可走進另一場別具魅力的浪漫光影世界。香港藝術館披上夢幻絢麗的極光色彩，太空館則化身巨型水晶球，加上逾7000盞燈球組成燈海，隨樂章變幻色彩，營造浪漫動人的冬日世界。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cf464ac5b31","title":"火炭工廈外紙皮起火危及機房 OT男途經拖喉救火獲讚","url":"https://www.stheadline.com/breaking-news/3638868/火炭工廈外紙皮起火危及機房OT男途經拖喉救火獲讚","summary":"火炭昨晚（18日）發生一宗火警，揭發好人好事。","summary_short":"火炭昨晚（18日）發生一宗火警，揭發好人好事。","digest":"火炭昨晚發生一宗火警，揭發好人好事","points":["火炭昨晚（18日）發生一宗火警，揭發好人好事","一名需要加班的男子外出用膳期間遇見火炭路安華工業大廈對開卡板紙皮起火…","消防及警方接報到場，經初步調查，不排除煙頭肇禍"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:16:01+08:00","size":1,"keywords":[],"body":"火炭昨晚（18日）發生一宗火警，揭發好人好事。一名需要加班的男子外出用膳期間遇見火炭路安華工業大廈對開卡板紙皮起火，他馬上從大廈拖出消防喉轆射水灌救，最終在途人協助下成功將火撲熄。消防及警方接報到場，經初步調查，不排除煙頭肇禍。\n男子在帖文中表示：「帶住負能量返工開OT，take個break（休息一下）去食飯，竟然去左（咗）救火，難得啊，其實我用消防喉轆其實好叻。」帖文標註事發地點為火炭，實際地址為火炭路安華工業大廈對開行人路。\n片段可見，事主臨危不亂，一手持消防水喉撲火，一手持手機拍下片段；其間有熱心途人主動上前協助，移開上方尚未燃燒的紙皮，讓水柱能直接射向核心著火點，火勢隨後受控。\n事件網民激讚：「功德無量」、「好人有好報」，有網民留意到紙皮後方是一個機房，若不及時救火，恐防會釀成更大災難，「好在有你幫忙，着火紙皮後面係中電機房」，另有網民推斷應是有人亂丟煙頭肇禍：「實係有人亂拋煙頭」。\n警方表示，昨晚7時許接報，指火炭路一幢工業大廈外有紙皮起火，人員到場時火勢已被救熄。經初步調查，事件沒有可疑，相信因未熄滅的煙頭點燃紙皮肇禍。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"ce1222f7bbc","title":"前民政署長張趙凱渝退休後轉跑道 出任VTC執行幹事","url":"https://www.stheadline.com/politics/3638864/前民政署長張趙凱渝退休後轉跑道-出任VTC執行幹事","summary":"職業訓練局（VTC）今日（19日）公布，已得到政府同意，委任張趙凱渝為新一任執行幹事，由2027年1月1日起生效。","summary_short":"職業訓練局（VTC）今日（19日）公布，已得到政府同意，委任張趙凱渝為新一任執行幹事，由2027年1月1日起生效。","digest":"職業訓練局公布，已得到政府同意，委任張趙凱渝為新一任執行幹事…","points":["職業訓練局（VTC）今日（19日）公布，已得到政府同意，委任張趙凱渝為新一任執行幹事…","張趙凱渝曾於政府多個決策局及部門服務，包括出任運輸及房屋局副秘書長（房屋）／房屋署副署長（策…","林健鋒：張趙凱渝對香港人才發展具深刻見解"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T14:06:03+08:00","size":1,"keywords":[],"body":"職業訓練局（VTC）今日（19日）公布，已得到政府同意，委任張趙凱渝為新一任執行幹事，由2027年1月1日起生效。張趙凱渝曾於政府多個決策局及部門服務，包括出任運輸及房屋局副秘書長（房屋）／房屋署副署長（策略），2025年時退休時擔任民政事務總署署長。\n林健鋒：張趙凱渝對香港人才發展具深刻見解\n職業訓練局主席林健鋒表示，張趙凱渝擁有卓越的領導和管理能力，以及廣闊的政策視野，對香港未來人才發展需要具深刻見解，深信她將帶領職業訓練局進一步深化與政府、業界及社會各界的合作，培育更多配合經濟轉型及產業發展需要的人才，為香港及國家的高質量發展注入新動力。\n林健鋒又指，職業訓練局根據既定政策及程序，透過公開招聘揀選張趙凱渝接任執行幹事，理事會相信她將引領職業訓練局持續向前，推動香港職業專才教育再創高峰。\n感謝現任幹事唐智強卓越貢獻\n林健鋒亦衷心感謝即將卸任的執行幹事唐智強，指他自2022年出任執行幹事以來，以前瞻視野帶領職業訓練局在多個範疇取得重要成果，並積極配合國家及香港的發展策略，加強職專教育與產業需要的聯繫，為職業訓練局及職專教育的長遠發展奠定堅實基礎。職業訓練局理事會對唐智強任內的卓越貢獻深表謝意。\n張趙凱渝於1986年加入政府，服務近40年間曾在多個決策局及部門服務，包括前公務員事務科、前工商科、前政務總署、前貿易署、公務員事務局、政務司司長辦公室、前民政事務局、教育局及商務及經濟發展局。並於2016年至2019年出任環境保護署副署長，2019年至2022年出任運輸及房屋局副秘書長（房屋）／房屋署副署長（策略），並於2022年起出任民政事務總署署長至2025年退休。\n林健鋒是選委會選舉參選人。詳細參選名單請參閱選舉網站。\n相關新聞：\n選委會選舉2026．提名全名單︱累計接獲1155份提名 至少31個界別分組有競爭 社福界25人爭15席","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"cc688638dd7","title":"小巴司機酒駕撞斃七旬婦 認危駕酒駕囚25個月及停牌7年半","url":"https://www.stheadline.com/society/3638862/小巴司機酒駕撞斃七旬婦-認危駕酒駕囚25個月及停牌7年半","summary":"54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿，老婦送院後不治；小巴司機事後被驗出酒精含量超標。","summary_short":"54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿，老婦送院後不治…","digest":"54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿…","points":["54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿…","他早前承認危險駕駛導致他人死亡及酒後駕駛兩罪，今於區域法院接受判刑","暫委法官梁嘉琪列舉加刑因素，包括事件引致他人死亡、被告醉駕且酒精含量超標近4倍…"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T13:55:08+08:00","size":1,"keywords":[],"body":"54歲小巴司機前年10月醉駕，在秀茂坪撞倒一名「衝紅燈」的七旬婦人，更輾過她的雙腿，老婦送院後不治；小巴司機事後被驗出酒精含量超標。他早前承認危險駕駛導致他人死亡及酒後駕駛兩罪，今於區域法院接受判刑。暫委法官梁嘉琪列舉加刑因素，包括事件引致他人死亡、被告醉駕且酒精含量超標近4倍、他駕駛公共交通工具，以及事發在行人過路處，最終判囚25個月、停牌7年半。\n官指行車紀錄儀所示與被告一時失專注說法有別\n56歲被告吳國成，早前承認1項危險駕駛導致他人死亡及1項酒後駕駛罪。梁官引述辯方指被告當時一時失去專注，反應時間有限，而被告無超速或違規，事後即時停車，故辯方認為案情非同類中最嚴重。惟梁官指出，行車紀錄儀顯示案發時無乘客但播放音響，被告在下午1時許、天氣良好之下駕駛公共小巴，他的視線無阻擋，與一時失去專注的說法有別。\n梁官直言本案屬特別嚴重的危駕致死案，被告體內的酒精含量超標達第三級，但仍選擇駕駛和準備接載乘客。梁官最終就兩罪判入獄26個月，鑑於被告因好酒而導致肝臟受損和影響精神狀況，目前等待肝移植，酌情扣減1個月，終判入獄25個月、停牌7年半及須自費上駕駛改進課程。\n事主「衝紅燈」遭小巴撞倒並輾過雙腿\n案情指，2024年10月9日中午約1時許，被告駕駛涉事小巴行駛至曉光街及秀明道交界，並停在行人過路處附近，當交通燈號轉為綠燈，他開車駛出路口。此時，女事主陳金菊從左至右急步橫過行人過路處，小巴車頭右方撞上事主，及後車輪輾過事主雙腿；當時行人過路處的燈號為紅燈。\n被告有所感覺及停下小巴，這時女事主倒臥在小巴後方，當救護員到場時，女事主已陷入昏迷及情況危殆，送院搶救後證實不治。驗屍報告顯示，死者頭部創傷、顱骨骨折及腦部創傷等。\n被告警誡下稱前一晚飲數罐雞尾酒\n同日警方拘捕被告，在警誡下，他稱當時交通燈號轉為綠燈，他便開車，「不知道死者從何處衝出來」。警員注意到，被告滿面通紅及身上有酒氣，進行呼氣測試後，發現其體內酒精濃度超出訂明上限，達到每100毫升內有84至95微克的酒精。警誡下，被告稱案發前一晚在便利店飲了數罐雞尾酒。\n辯方早前求情時，確認被告過去曾有一次管有第一部毒藥案底，但控罪性質與本案不同，而且事隔已久。辯方指，被告案發時並非一邊飲酒、一邊駕駛，而是前一晚飲酒後曾回家休息，而案發早上只僅駕駛了兩次，其餘時間在小巴站休息，案發時小巴上也沒有乘客，被告亦無超速。\n辯方指，被告有20年職業司機經驗，過去記錄稱得上良好，沒有危駕或不小心駕駛的記錄。被告現時身體狀況不佳，其肝功能嚴重受損，以致出現肝腦病變及須等待肝臟移植手術，他行動不便及須輪椅代步。辯方強調被告深感後悔，現已戒酒。\n案件編號：DCCC1770/2025\n法庭記者：雷璟怡","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c0ac34f0d03","title":"首三季近萬宗電騙涉款19億 8月份破2,000宗創新高 警夥私隱公署調查","url":"https://www.stheadline.com/breaking-news/3638849/首三季近萬宗電騙涉款19億-8月份破2000宗創新高-警夥私隱公署調查","summary":"電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行，共偵破108宗騙案涉款約6,800萬元，並拘捕95男28女（介乎14至75歲）。","summary_short":"電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行，共偵破108宗騙案涉款約6…","digest":"電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行…","points":["電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行…","根據警方數字，今年首三季接獲的詐騙案已佔整體罪案數字一半，當中電話騙案更佔近三成…","單是8月份電騙案突破2,000宗，創下有紀錄以來的新高"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T13:38:23+08:00","size":1,"keywords":[],"body":"電話騙案無日無之，警方商業罪案調查科於本月初採取行動，打擊電話騙案及相關洗黑錢罪行，共偵破108宗騙案涉款約6,800萬元，並拘捕95男28女（介乎14至75歲）。根據警方數字，今年首三季接獲的詐騙案已佔整體罪案數字一半，當中電話騙案更佔近三成，接近1萬宗，涉款逾19億元。單是8月份電騙案突破2,000宗，創下有紀錄以來的新高。\n相關新聞：觀塘紅磡工廈單位淪「遙控貓池」中心 網絡電話冒固網打出 警拘123人\n商業罪案調查科警司郭靜怡指出，今年1月至9月期間，警方共接獲34,679宗詐騙案件，佔整體罪案約五成。當中電話騙案佔近三成（28.8%），錄得9,999宗，涉款約19.4億元。單是8月份，電騙宗數更突破2,000宗，創下有紀錄以來的歷史新高。\n郭靜怡稱，在各類電話騙案中，「假冒客服」依然是最普遍的手法，佔整體電騙約六成。近期騙徒頻繁冒充多個知名零售商戶、網購平台或物流公司，訛稱市民訂購的貨品或服務出現問題並主動提出「賠償」，誘使市民以「驗證身份」為名將款項轉帳至指定戶口。值得關注的是，騙徒往往能準確道出受害人的姓名、電話號碼及真實交易紀錄。針對個人資料外洩風險，警方已聯同個人資料私隱專員公署展開深入調查。\n在「假冒客服」電騙案之中，騙徒很多時會以疑似固網電話「2」、「3」字頭的號碼打出，或者在釣魚短訊內留下這些「2」、「3」字頭的號碼，冒充為客服電話。警方調查發現這些號碼很多都不是傳統固網電話，而是由互聯網平台打出的網絡電話。不法分子以個人名義，甚至利用空殼公司申請這些號碼，令到市民信以為是客服來電。\n郭靜怡續稱，目前電話儲值卡設有實名登記數量上限，但針對月費「上台」服務，包括固網及網絡電話，現行法例並未就企業客戶可登記號碼的數量，設有適用於所有電訊商的統一上限。騙徒有機會利用公司名義，以大批量或分次申請的方式，取得多個「上台」號碼，再交由詐騙集團使用。\n換言之，騙徒未必需要開設大量不同帳戶，只要利用一個公司名義，已經有機會取得多個電話號碼，再建立詐騙電話中心，短時間內向大量市民撥出詐騙電話。此手法成本相對低，但可以大量接觸市民，正正體現「低成本、高效益」的特點。\n郭靜怡呼籲，雖然電訊商一般會核實客戶資料，但為防止服務被濫用，業界仍需要加強客戶審核、號碼分配及異常使用監察，及早識別和堵截可疑服務或涉及詐騙的電話號碼，防止騙徒繼續利用有關號碼行騙。","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c07b45dcbcb","title":"港鐵：香港大學站信號設備故障已修復 港島綫列車服務陸續恢復正常","url":"https://news.tvb.com/tc/1207174-港鐵香港大學站信號設備故障已修復港島綫列車服務陸續恢復正常","summary":"[08:45]港鐵：早前的信號設備故障已修復，港島綫列車服務陸續恢復正常。[08:10]港鐵：香港大學站有信號設備故障，來往堅尼地城站及柴灣站的行車時間預計需要額外5至8分鐘。","summary_short":"[08:45]港鐵：早前的信號設備故障已修復，港島綫列車服務陸續恢復正常。","digest":"[08:45]港鐵：早前的信號設備故障已修復，港島綫列車服務陸續恢復正常","points":["港鐵藍田站路軌旁傍晚發生火警，無人受傷，觀塘站來往調景嶺站列車服務一度暫停約一小時","港鐵指懷疑是道岔設備絕緣膠因短路起火","事發的路軌旁冒出火光，位置靠近底部，出事的是俗稱波口的道岔用來控制列車行駛方向"],"section":"港聞","category":"港聞","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T08:44:00+08:00","size":1,"keywords":["港鐵"],"body":"港鐵藍田站路軌旁傍晚發生火警，無人受傷，觀塘站來往調景嶺站列車服務一度暫停約一小時。港鐵指懷疑是道岔設備絕緣膠因短路起火。\n\n事發的路軌旁冒出火光，位置靠近底部，出事的是俗稱波口的道岔用來控制列車行駛方向。港鐵指傍晚約五時半，即放工繁忙時段，藍田站路軌旁發生火警，車站需要封閉，大批消防和地鐵職員在往黃埔方向月台進入路軌搶修，受事故影響，觀塘至調景嶺站列車服務暫停，大批乘客須改乘其他交通工具。\n\n陸先生說：「上面很多人、塞滿大堂，取消行程，相信都很多人。下次再打算。」\n\n張小姐說：「原本打算繞路走，每站停久一些，其餘都可以，遲了約5至10分鐘。上層有位坐。」\n\n港鐵安排免費接駁巴士，來往觀塘、藍田及油塘站。在油塘站的車站，人龍沿著茶果嶺道，排到油塘道交界。\n\n港鐵在傍晚約六時半宣布，於藍田站附近路軌旁的火警已經處理，觀塘綫列車服務逐步回復正常，藍田站亦已經解封。\n\n港鐵晚上指懷疑是道岔設備一件絕緣膠因短路起火。曾是港鐵職員的立法會前議員張欣宇認為，事故不影響行車安全，又指單靠日常檢修，難以完全避免短路。\n\n智慧交通聯盟理事長張欣宇說：「應該是短路爆的火花點燃絕緣膠，因為膠是能燒著，在路軌軌旁包括波口，其實真的能燒著的東西很少，就算一塊膠都不會燒很久，不然燒很短時間都會停下來，只要檢查環境、固定波口、重新行車，相對短時間能完成。」\n\n由於事故歷時逾半小時，加上正值繁忙時間，張欣宇估計港鐵會被罰款。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026XTaZxrgVnj1795047172.jpg?x-oss-process=image/resize,w_1200","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c554ae471cf","title":"香港大學站連續2日信號設備故障 港島綫行車時間一度調整","url":"https://www.stheadline.com/breaking-news/3638756/香港大學站連續2日信號設備故障-港島綫行車時間一度調整","summary":"香港大學站連續兩日早上發生信號故障，今日（19日）早上約8時17分，港鐵表示，由於香港大學站附近有信號設備故障，列車行經該路段需要慢駛，整體行車時間（總站至總站）預計需要額外5至8分鐘。","summary_short":"香港大學站連續兩日早上發生信號故障，今日（19日）早上約8時17分，港鐵表示，由於香港大學站附近有信號設備故障…","digest":"香港大學站連續兩日早上發生信號故障，早上約8時17分，港鐵表示…","points":["香港大學站連續兩日早上發生信號故障，今日（19日）早上約8時17分，港鐵表示…","港鐵人員經處理後，至早上約8時42分信號設備故障已修復，港島綫列車服務陸續恢復正常","相關新聞：香港大學站附近信號設備故障 港島綫列車服務一度受阻近2小時"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:43:13+08:00","size":1,"keywords":[],"body":"香港大學站連續兩日早上發生信號故障，今日（19日）早上約8時17分，港鐵表示，由於香港大學站附近有信號設備故障，列車行經該路段需要慢駛，整體行車時間（總站至總站）預計需要額外5至8分鐘。港鐵人員經處理後，至早上約8時42分信號設備故障已修復，港島綫列車服務陸續恢復正常。\n相關新聞：香港大學站附近信號設備故障 港島綫列車服務一度受阻近2小時\n周三香港大學站信號設備故障：\n昨日（18日）早上8時46分，香港大學站附近亦發生信號設備故障，列車行經該路段需要慢駛，港島綫列車服務受阻近2小時，整體行車時間一度需要延長最多達8分鐘，至早上10時36分信號設備故障經修復，港島綫列車服務陸續恢復正常。\n事發時正值上班繁忙時間，有網民在社交平台上載相片，所見北角站的月台擠滿候車乘客。亦有網民發文指：「港島綫壞信號，已淪陷。」不過，亦有市民拍得金鐘站情況，所見人流暢順，並未出現擠塞情況。\n\n <div","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c59fd12889c","title":"龍翔道救護車遭私家車撞尾 行車線一度封閉","url":"https://www.stheadline.com/breaking-news/3638755/龍翔道救護車遭私家車撞尾-行車線一度封閉","summary":"今日（19日）早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵鑽石山站對開時，與尾隨一輛私家車相撞。","summary_short":"今日（19日）早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵鑽石山站對開時，與尾隨一輛私家車相撞。","digest":"早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵鑽石山站對開時…","points":["今日（19日）早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵鑽石山站對開時…","現場所見，私家車撞向救護車的車尾，有救護員下車視察車輛損毀情況","事件中無人受傷，警方正調查事故成因"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T08:29:31+08:00","size":1,"keywords":[],"body":"今日（19日）早上7時44分，一輛救護車沿龍翔道往荃灣方向行駛，當駛至近港鐵鑽石山站對開時，與尾隨一輛私家車相撞。現場所見，私家車撞向救護車的車尾，有救護員下車視察車輛損毀情況。事件中無人受傷，警方正調查事故成因。\n受交通意外影響期間，龍翔道往荃灣方向近鑽石山港鐵站的中線一度封閉，交通受阻，其後現場始解封。\nfb香港交通及突發事故報料區\n\n <div","image":"","video":"","video_poster":"","lang":"zh-Hant"},{"id":"c66f9b5a72c","title":"國安常識 「即答即獎」學生連中三元 全港學界挑戰賽總決賽明年4.15舉行","url":"https://www.stheadline.com/breaking-news/3638793/國安常識-即答即獎學生連中三元-全港學界挑戰賽總決賽明年415舉行","summary":"保安局在社交平台介紹最近舉行「全港學界國家安全常識挑戰賽」半準決賽的情況，今年戰況緊張刺激。","summary_short":"保安局在社交平台介紹最近舉行「全港學界國家安全常識挑戰賽」半準決賽的情況，今年戰況緊張刺激。","digest":"保安局在社交平台介紹最近舉行「全港學界國家安全常識挑戰賽」半準決賽的情況…","points":["保安局在社交平台介紹最近舉行「全港學界國家安全常識挑戰賽」半準決賽的情況，今年戰況緊張刺激","現場設有「即答即獎」遊戲，答中的學生可獲小禮物","當中有學生回答國安問題「快狠準」，更連中三元「攞到成手都係禮物」"],"section":"港聞","category":"港聞","source":"stheadline","source_display":"星島頭條","published_at":"2026-11-19T11:25:43+08:00","size":1,"keywords":[],"body":"保安局在社交平台介紹最近舉行「全港學界國家安全常識挑戰賽」半準決賽的情況，今年戰況緊張刺激。現場設有「即答即獎」遊戲，答中的學生可獲小禮物。當中有學生回答國安問題「快狠準」，更連中三元「攞到成手都係禮物」。是項挑戰賽的總決賽將於明年4月15日舉行，同學們向冠軍進發。","image":"","video":"","video_poster":"","lang":"zh-Hant"}]},{"name":"內地","total":52,"items":[{"id":"c6435a1f01e","title":"APEC｜評論指高市被「冷落」 北京稱按國際慣例作適當禮賓安排","url":"https://news.tvb.com/tc/1207256-APEC評論指高市被冷落北京稱按國際慣例作適當禮賓安排","summary":"有評論指日本首相高市早苗抵達深圳出席APEC會議時被「冷落」。在北京，外交部稱作為東道主，中方根據國際慣例，對所有參會方作出適當的禮賓安排。","summary_short":"有評論指日本首相高市早苗抵達深圳出席APEC會議時被「冷落」。","digest":"有評論指日本首相高市早苗抵達深圳出席APEC會議時被「冷落」","points":["有評論指日本首相高市早苗抵達深圳出席APEC會議時被「冷落」","在北京，外交部稱作為東道主，中方根據國際慣例，對所有參會方作出適當的禮賓安排"],"section":"內地","category":"內地","source":"tvb","source_display":"无綫新闻 TVB News","published_at":"2026-11-19T16:17:00+08:00","size":13,"keywords":["高市早苗","大國外交","APEC 2026"],"body":"有評論指日本首相高市早苗抵達深圳出席APEC會議時被「冷落」。在北京，外交部稱作為東道主，中方根據國際慣例，對所有參會方作出適當的禮賓安排。","image":"https://pro-img-cdn.tvb.com/uploads/image/2026/11/2026NeAXcmXF401795076280.jpg?x-oss-process=image/resize,w_1200","video":"https://pro-vod-cdn.tvb.com/6d1a4b6786e241e3a5204b96ce99bfd2/2ab47ff597474
